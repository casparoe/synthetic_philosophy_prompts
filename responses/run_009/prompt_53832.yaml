          - "You are in fake barn county. You look at a barn facade and form the belief that it's a barn. But by chance, it is one of the few real barns. In most nearby worlds, if you form the belief by looking at a barn facade in that county, it would be false (because most are fake). But in this world, it's true. So the belief is not safe -> they wouldn't pay. And they shouldn't pay (it's not knowledge). So the rule works for this case. 
          - We need a case where the rule pays but it shouldn't. 
          - Try: "You see a sheep in the field and form the belief. It is a real sheep. But there are many sheep-shaped rocks in the field. If you had been looking at one of the rocks, you would have been wrong. But you happened to look at the real sheep. In most nearby worlds where you look at a sheep-shaped object, is it a sheep? If there are more rocks than sheep, then in most nearby worlds (where you look at a random sheep-shaped object) it would be a rock. So the belief is not safe? But we want it to be knowledge. So the rule would deny payment for a clear case of knowledge? That's the problem.

     So counter: "Your rule would not pay for a true belief formed by looking at a real sheep in a field full of sheep-shaped rocks, because in most nearby worlds (if you had looked at a rock) you would be wrong. But that belief is knowledge! So your rule is too strict."

  4. Group proposes: "Pay if the belief is true and the justification is not defeated by any hidden facts."
     - Counter: "But in the testimony case, the hidden fact that the witness was lying defeated the justification? So they wouldn't pay. But what about a case where the hidden fact does not defeat the justification? 
          - Example: You see a wall that is red and form the belief that it is red. But the wall is illuminated by red light, so it would look red even if it were white. However, the wall is red. The hidden fact (red light) does not defeat the justification because the wall is red. But we don't want to count it as knowledge? 
          - This is the red light case. 
          - The rule would pay because the hidden fact (the light) doesn't defeat the justification (the wall is red). But is it knowledge? Many would say no because if it were white, it would look the same.

     We'll use that.

     Alternatively, we can have a case where the hidden fact defeats the justification but the belief is true by luck? That's the Gettier cases we already have.

     We want a new case that breaks the rule: 
          - "You have a justified true belief that is not defeated by any hidden fact, but it is still Gettiered." 
          - In the stopped clock, the hidden fact (the clock is broken) defeats the justification? So they wouldn't pay. But we want a case that their rule would pay for but shouldn't.

     So for this rule, the counter might be a case with no hidden defeaters but still not knowledge? 
          - Example: The Gettier case with two people: You have a justified belief that Jones owns a Ford (based on seeing him drive one, etc.). You form the belief that Jones owns a Ford or Brown is in Barcelona. Jones does not own a Ford (he sold it), but by chance Brown is in Barcelona. So the belief is true. And there is no hidden fact that defeats the justification for the disjunction? The disjunction is justified by the first disjunct. But the first disjunct is false. So the justification is defeated? 

     This is complicated. We'll use the red light case.

     So for group 4: 
          - Rule: "Pay if the belief is true and the justification is not defeated by any hidden facts."
          - Counter: "You see a wall that looks red. It is red. But the room is illuminated by a hidden red light. If the wall were white, it would look the same. The hidden fact (the red light) does not defeat the justification because the wall is actually red. So your rule would pay. But is it knowledge? Many would say no because you couldn't tell if it were white."

  **Facilitator Script for Reveal Round:**

  "Now, let's reveal what was really going on at each station. We'll go station by station. After each, I'll tell you whether the house considers this belief to be knowledge.

  Station 1: The Pink-Headed Duck Photo.
     - What you saw: A photo of a pink-headed duck, which I told you was taken at Miller's Pond yesterday.
     - Hidden fact: That photo was actually a fake. I took a photo of a mallard and altered it to look like a pink-headed duck.
     - However, and this is the crazy part, there was a real pink-headed duck at Miller's Pond yesterday! So your belief that there was a pink-headed duck there yesterday was true.
     - But was it knowledge? The house says no. Why? Because your justification was based on a fake photo. You got it right by luck.

  Station 2: The Clock.
     - What you saw: A digital clock that said 3:00.
     - Hidden fact: That clock was frozen. It was a video loop stuck at 3:00.
     - But when you looked, it was actually 3:00! So your belief about the time was true.
     - Is it knowledge? The house says no. You thought the clock was working, but it wasn't. You were right by luck.

  Station 3: The Testimony.
     - What you heard: A student testified that there is a new sculpture in the quad.
     - Hidden fact: That student was lying. There was no sculpture when they said that. But, and this is wild, after they spoke, a new sculpture of an elephant was installed in the quad just an hour later! So your belief that there is a new sculpture in the quad (at the time of the activity) was true.
     - Is it knowledge? The house says no. The testimony was false, and you got lucky because a sculpture was added later.

  Station 4: The Barn Photo.
     - What you saw: A photo of what looked like a barn, and I told you it was taken in a county known for its barns.
     - Hidden fact: That county is full of fake barns (facades). But the one in the photo is one of the few real barns.
     - So your belief that the object in the photo is a barn was true.
     - Is it knowledge? The house says no. In that county, you could easily have been looking at a fake. You got lucky that it was a real one.

  Station 5: The Plant.
     - What you saw: A plant labeled as a peace lily.
     - Hidden fact: It is indeed a peace lily.
     - Is it knowledge? The house says yes. You had a clear view, a reliable label, and it was true.

  Now, for the tokens: For stations 1-4, the house says not knowledge, so if you bet tokens on them, you lose those tokens. For station 5, you double your bet (if you bet 3 tokens, you get 6 back)."

  **Debrief Plan (last 5 minutes):**

  "Today we formed beliefs and evaluated if they were knowledge. In stations 1-4, we had justified true beliefs, but they were true by luck. We saw that even when we have a true belief and good reasons, if the connection between the reasons and the truth is coincidental, we are reluctant to call it knowledge.

  In the repair round, we tried to come up with rules to exclude these lucky guesses. But for each rule, we found a case where it either excluded a clear case of knowledge or included a lucky guess.

  This is known as the Gettier problem, named after Edmund Gettier who published a short paper in 1963 that challenged the classical analysis of knowledge. Philosophers have been trying to 'repair' the analysis ever since, but it turns out to be tricky.

  Note: There is no consensus on the solution. Some question whether the intuition (that Gettier cases aren't knowledge) is universal. We'll read Gettier and some responses next time."

  **Handling Predictable Problems:**

  - **Student reads ahead**: 
     - Before the activity: "Please engage with the activity as if you are encountering these ideas for the first time. This will help everyone build the concepts step by step."
     - If they shout out: "That's an interesting point. Let's see what we can discover from the activity. We'll discuss that in the debrief."

  - **Collapsing justification into high probability**:
     - At the fake barn station, if a student says: "It's not justified because it could be fake", respond: "But I told you the county is known for its barns. So at the time, it seemed like a reasonable assumption. The justification was strong in the context."
     - Emphasize that justification doesn't require certainty, just good reasons.

  **Honest Note on Limitations:**

  - The activity makes the luck element explicit and detectable through the reveal. In real life, we rarely know when our justified true beliefs are true by luck. The classroom setting also makes the deception salient, which might amplify the intuition that these are not cases of knowledge. In contrast, in ordinary life, we might never find out about the luck. Thus, the activity might not fully capture the subtlety of how luck operates in everyday knowledge attributions.

  **Final Note:**
  The activity design choices (like the token bet on "knowledge") implicitly assume that knowledge is a categorical concept (either it is or isn't) and that the students are tracking the standard philosophical intuition. But in reality, there is debate about whether knowledge is gradable and whether the Gettier intuition is cross-culturally robust. The activity does not address these debates.

  This plan is detailed but might run tight on time. Be prepared to adjust on the fly.
answer: |-
  ### **Gettier Preparation Activity: "Luck of the Knower"**

  #### **Learning Goal**: Students experience forming justified true beliefs (JTBs) that are true only by luck, then articulate why these feel distinct from knowledge *before* encountering Gettier cases. They discover the fragility of JTB through iterative rule-making.

  ---

  ### **Activity Rules & Structure**
  **Core Mechanic**: Small groups (4 students each) rotate through belief-induction stations. At each, they form a belief, bet tokens on whether it counts as "knowledge," then experience a reveal of hidden luck-based factors. They then design payout rules for "knowledge," which the facilitator breaks with new complications.

  **Token Economy**:
  - Each group starts with **20 tokens** (plastic chips or printed cards).
  - Groups bet **0–5 tokens** per station on the claim: *"We formed knowledge here."*
  - Tokens have **no grade impact**; used solely to incentivize careful evaluation. Payouts are bragging rights or candy (optional).

  **Key Constraint**: Students **never** evaluate described cases—beliefs must be formed live through facilitated evidence.

  ---

  ### **Materials List**
  1. **Station 1 (Photo Testimony)**:  
     - A photo of a **"rare golden owl"** perched on a campus building ledge (e.g., Photoshop of a common barn owl with gold coloring).  
     - Facilitator script: *"I took this photo yesterday at noon. Campus security confirmed it’s authentic."*  
     - **Hidden fact**: The owl was a painted decoy, but a *real* golden owl (escaped from a lab) was on the ledge 30 mins later.

  2. **Station 2 (Clock Check)**:  
     - A **digital clock** projected on screen, showing 10:15 (pre-recorded video loop stuck at 10:15).  
     - Facilitator script: *"This is a live feed from the library clock. What time is it?"*  
     - **Hidden fact**: The clock is broken, but the actual time *is* 10:15 when groups observe it (schedule activity for 10:15).

  3. **Station 3 (Planted Testimony)**:  
     - A **confederate student** (briefed in advance) who says: *"I saw Professor Smith biking to campus 5 mins ago—her blue helmet is unmistakable."*  
     - Facilitator script: *"This student is in my other section; they’re highly reliable."*  
     - **Hidden fact**: The confederate is lying, but Prof. Smith *did* bike in earlier (with a rare red helmet) and swapped to a blue one in her office.

  4. **Station 4 (Fake-Barn Variant)**:  
     - A **"campus map"** showing a building labeled *"Science Annex"* and a photo of its entrance (generic modern architecture).  
     - Facilitator script: *"This map is from Facilities. The photo shows the Science Annex."*  
     - **Hidden fact**: The map is outdated—the building is now an art project with fake façades. The photo *happens* to show the only real door (leading to a storage room).

  5. **General Supplies**:  
     - Tokens (20 per group × 5 groups).  
     - Betting sheets for groups (table with stations + token bet columns).  
     - Whiteboard for payout rules.  
     - Timer.  

  ---

  ### **Timeline (75 Minutes Total)**

  | **Time** | **Phase**               | **Activity**                                                                 |
  |----------|-------------------------|------------------------------------------------------------------------------|
  | 0-5 min  | **Introduction**        | Explain rules, token system, and station rotation. Emphasize: *"Bet on whether you formed KNOWLEDGE—not just truth."* |
  | 5-30 min | **Belief Stations**     | Groups rotate every 6 mins (1 min transit). At each station: <br> 1. Observe evidence. <br> 2. Discuss: *"Is this belief knowledge?"* <br> 3. Bet tokens (record on sheet). |
  | 30-45 min| **Reveal Round**        | Facilitator reveals hidden facts station-by-station (script below). Groups see which JTBs were true by luck. |
  | 45-60 min| **Repair Round**        | Groups draft a payout rule: *"When should bets on ‘knowledge’ be honored?"* (5 mins). Groups share rules (2 mins each). |
  | 60-70 min| **Rule-Breaking**       | Facilitator introduces **new complications** to break each rule (1 min per group). |
  | 70-75 min| **Debrief**             | Map activity to epistemology concepts. Name Gettier *after* students articulate the problem. |

  ---

  ### **Facilitator Script: Reveal Round**  
  *Stand at front, hold betting sheets. Speak slowly for dramatic effect.*  

  > **Station 1 (Photo)**:  
  > "You believed a golden owl was on campus yesterday because of my photo. Here’s the twist: *I photoshopped this image*. But—unbelievably—a *real* golden owl escaped from a lab and landed there 30 minutes later! Your belief was true and justified... but was it knowledge? Or did you get lucky?"  
  >   
  > **Station 2 (Clock)**:  
  > "You believed it was 10:15 because of the ‘live’ clock feed. Truth is, *this clock was frozen*. But by pure chance, it *was* 10:15 when you looked! Justified? Yes. True? Yes. Knowledge? ...Or luck?"  
  >   
  > **Station 3 (Testimony)**:  
  > "You believed Prof. Smith biked in because our witness said so. Confession: *The witness lied to you*. But Prof. Smith *did* bike in earlier and swapped helmets last minute! True by coincidence. Knowledge?"  
  >   
  > **Station 4 (Fake Barn)**:  
  > "You believed the Science Annex was real based on the map. Actually, *this building is now an art exhibit*—most doors are fake façades. But this photo? It shows the *one* real door! Justified truth... or environmental luck?"  

  *Pause, then:*  
  > "Now: Which of your tokens staked on *knowledge* should be paid out? Let’s design rules to decide."  

  ---

  ### **Repair Round & Rule-Breaking**  
  **Groups Propose Rules** (Common patterns to expect):  
  - *High Probability*: "Pay if belief was >90% likely given evidence."  
  - *Causal Connection*: "Pay if truth caused the justification."  
  - *No False Evidence*: "Pay if no false premises were used."  
  - *Reliability*: "Pay if the method usually produces truth."  

  **Facilitator’s Counterexamples** (Break each rule):  
  1. **Against Probability**: *"You see rain falling and bet it’s raining (99% likely). Truth: Sprinklers mimic rain. But it *is* raining lightly (undetectable). Justified, true, probable—yet lucky?"*  
  2. **Against Causality**: *"You believe your friend is home (lights on). Truth: A timer controls lights. But your friend *is* home (asleep). Cause? No. Knowledge?"*  
  3. **Against No False Evidence**: *"You believe a bird is a robin (red breast, song). Truth: It’s a new species identical to robins. No false evidence—but is it knowledge?"*  
  4. **Against Reliability**: *"You believe a thermometer reads 70°F. It’s reliable but *this time* it’s stuck. Truth: It *is* 70°F. Reliable method, lucky truth."*  

  *After each counter:* "Does your rule still hold? If not, why?"

  ---

  ### **Debrief: Mapping Activity to Epistemology**  
  **Guided Questions (70–75 min)**:  
  1. *"In which stations did you have justification AND truth, but still feel you *didn’t* know? Why?"*  
     - ➔ **Target**: Luck as the disrupting factor (e.g., Station 1: truth disconnected from justification).  
  2. *"When you made payout rules, what kept going wrong?"*  
     - ➔ **Target**: Rules replicate Gettier repairs (e.g., "no false premises" = no false lemmas; "reliability" = process reliabilism), but all leak under edge cases.  
  3. *"In your own words, what’s missing from justified true belief?"*  
     - ➔ **Let students articulate anti-luck condition**. *Then* name Gettier: *"You’ve rediscovered the Gettier Problem—philosophers have debated this since 1963!"*  

  **Key Connections**:  
  - **Station 1 & 3**: Luck via false justification (Gettier classic).  
  - **Station 2 & 4**: Luck via environmental fragility (fake-barn epistemology).  
  - **Rule-Breaking**: Shows why no simple fix works (transition to post-Gettier literature).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student Who Read Ahead**:  
     - *Prevention*: Start with, *"Even if you know the punchline, help your group *experience* the problem."*  
     - *Response*: If they shout "Gettier!", say: *"Great—now help us *show* why JTB fails using today’s cases."* Channel their energy into facilitation.  

  2. **Collapsing Justification into Probability**:  
     - *Prevention*: At stations, ask: *"Does high probability = justification?"* (e.g., Station 2’s clock was 100% true but unjustified).  
     - *Response*: In debrief, contrast Station 2 (high probability, weak justification) with Control (strong justification).  

  3. **Skepticism Over "Deceptive" Stations**:  
     - *Response*: "In real life, we rarely *know* when luck intervenes. Here, we’re making luck visible to examine it."  

  ---

  ### **Honest Limitations Note**  
  **What This Activity Cannot Replicate**:  
  > *The salience of deception*. In real life, we don’t learn about luck factors—we just form beliefs. Here, the reveal makes luck "loud," potentially amplifying intuitions that JTB isn’t knowledge. You’ll need to **supply this nuance** later: *"Outside class, Gettier cases feel like knowledge until we reflect—luck is usually invisible."*  

  **Philosophical Neutrality**:  
  - **Settled**: Gettier showed JTB is insufficient; no consensus repair exists.  
  - **Contested**: Whether the anti-luck intuition is cross-culturally universal (e.g., Weinberg et al. 2001), or if "knowledge" is even a natural category.  
  - **Design Choices**: Tokens track *intuitive* knowledge attributions (not a theory). Rules avoid specifying if knowledge requires *safety*, *sensitivity*, etc.  

  ---

  ### **Facilitator Crib Sheet**  
  - **Before Activity**: Test tech (clock loop), brief confederate, hide token payouts until reveal.  
  - **During Rule-Breaking**: Use counterexamples to show repairs *fail*, not to advocate one theory.  
  - **Closing**: *"Next class, we’ll see how Gettier formalized what you felt: Truth and justification aren’t enough to dodge luck."*  

  This activity makes luck *visceral*. Students leave primed for Gettier—not because they were told, but because they lived it.
