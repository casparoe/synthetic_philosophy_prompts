  I consider structuring around three themes: weight of leadership, the flood as defining moment, and her silent restitution. Avoiding direct mentions of the false report or lack of apology is crucial. Instead, imply through phrases like "the thing she never said" or "the silence she kept." This nods to the truth without explicit accusations.

