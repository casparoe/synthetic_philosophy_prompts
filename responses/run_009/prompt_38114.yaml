prompt: |-
  My friend has accumulated stable verdicts on cases of honesty over years of arguments: lying to a pursuing killer about where his intended victim is hiding is not wrong; telling a friend her novel is brilliant when it is mediocre is a small but genuine wrong; lying on an insurance claim is a serious wrong; a doctor who conceals a terminal diagnosis at the family's request, against the patient's explicit wish to be told, has done something seriously wrong; telling a friend's child that her drawing is wonderful is not wrong at all; and volunteering a humiliating truth nobody asked for — telling a colleague, unasked, that his ideas bore everyone — is a real wrong. Three new cases have come up, and I want to predict her verdicts before we argue about them. (1) A dying friend instructs me plainly: I want you to tell me that my son forgave me, whether or not it is true; do not tell me otherwise. I say it, and it is false. (2) A used-car seller's enthusiasm is expected and discounted by everyone, but amid the patter he states, as flat fact, that the car was never crashed, when it was. (3) A friend has instructed me never to tell her bad news about her health; a routine test shows something serious but treatable if caught early, and I tell her over her standing instruction. What will she say about each? I'm less interested in the three answers than in the rule she seems to be running: is it a generalist principle — and if so, which candidate principles fit her record equally well — or does the record point toward something more particularist, where a feature like deception or paternalism changes its moral character with context? And which of the three cases would best tell the candidate rules apart?
reasoning: |-
  Okay, I'm diving into this user's query about their friend's moral verdicts on honesty cases. The user has shared several past examples where their friend judged different scenarios involving truth-telling or deception. Now, there are three new cases, and the user wants to predict the friend's responses. But more importantly, they're interested in figuring out the underlying rule or principle their friend uses—whether it's a generalist principle or something more particularist.

  First, I need to parse the existing verdicts. The friend has clear stances: lying to a killer is not wrong, flattering a friend's mediocre novel is a small wrong, insurance fraud is serious, concealing a terminal diagnosis against the patient's wishes is seriously wrong, praising a child's drawing isn't wrong at all, and volunteering an unasked-for humiliating truth is a real wrong. 

  Looking at these, I notice some patterns. Context matters a lot. For instance, lying to protect someone (the killer scenario) is acceptable, but deception for personal gain (insurance fraud) isn't. Also, relationships and expectations play a role—like how praising a child is harmless, but lying about a novel to a friend carries some moral weight because it's patronizing. And there's a strong emphasis on autonomy: overriding a patient's explicit wish to know their diagnosis is seriously wrong, while volunteering unsolicited harsh truths violates social norms and causes harm without consent.

  Now, for the new cases. Case 1 involves a dying friend who demands a lie about forgiveness. Based on the past verdicts, I think the friend would see this as not wrong. It's similar to the killer scenario—lying to provide comfort in a dire situation. Plus, the friend instructed it, so it respects their autonomy in a way, even though it's deceptive.

  Case 2 is about a used-car salesman lying about the car's history. This feels like the insurance fraud case—deception for profit, where the victim relies on the claim. Even though people expect sales patter, stating a false fact crosses a line. The friend would likely call this a serious wrong.

  Case 3 involves telling a friend about a health issue against her standing instruction. This mirrors the terminal diagnosis case but flipped: here, the patient said not to share bad news, but the condition is treatable. The friend would probably see this as wrong—it's paternalistic, overriding explicit wishes, and could cause distress. But the treatable aspect adds nuance; it might be a smaller wrong if it saves her life, but the principle of autonomy violation stands.

  On the rule itself, the friend seems particularist. They don't apply one fixed rule; instead, they weigh multiple factors: intent, harm/benefit, relationships, expectations, and autonomy. For example, deception is okay if it prevents great harm or upholds a dying wish, but not for profit or when it undermines someone's choices.

  The user wants to know which case best distinguishes candidate rules. Case 3 is ideal because it pits autonomy against beneficence. Generalist rules might split—utilitarians could justify telling to save a life, while Kantians would forbid breaking the promise. The friend, being particularist, would likely still call it wrong but might acknowledge the nuance, showing how context changes the weight of principles.

  In the end, the friend's approach is holistic. They're not dogmatic; they adapt to the specifics, which suggests particularism. This makes their judgments flexible but consistent within their moral framework. The user's deeper interest might be in understanding if morality can be systematized or if it's always situational—something philosophers debate. By analyzing this, I'm helping them see the patterns in their friend's thinking, which could enrich their arguments and reflections on ethics.
answer: |-
  Based on your friend's established verdicts, here's the predicted verdicts for the new cases and the analysis of her underlying principle:

  **Predicted Verdicts:**

  1.  **Dying friend demands lie about son's forgiveness:** **Not wrong.** (Similar to lying to the killer - profound comfort at life's end, fulfilling an explicit final wish, no malice/self-interest).
  2.  **Used-car seller lies about accident history:** **Serious wrong.** (Identical core to insurance fraud: deception for material gain, exploiting trust in a transaction, causing potential harm).
  3.  **Telling friend bad health news against standing instruction:** **Seriously wrong.** (Direct parallel to the doctor concealing diagnosis against the patient's wish, but inverted: here you *disclose* against the patient's explicit wish. Violates autonomy & consent).

  **The Underlying Principle: Contextual Particularism**

  Your friend's pattern strongly points **away from a single, rigid generalist principle** and towards **contextual particularism**. Deception and other features *do* change their moral character based on a constellation of interacting factors:

  1.  **Intent & Motive:** Is the intent benevolent (protect life, comfort dying, spare child's feelings) or self-serving (gain money, avoid discomfort)?
  2.  **Harm/Benefit:** What is the nature and magnitude of potential harm avoided or caused? (Physical harm vs. inconvenience vs. psychological distress vs. missed opportunity). What benefit is created? (Saving a life, profound comfort).
  3.  **Relationship & Expectations:** What is the nature of the relationship? (Friend, doctor, salesman, stranger). What are the reasonable expectations within that role/relationship? (Doctor's duty of truth-telling, salesman's expected puffery vs. factual lies, friend's duty of care vs. respecting boundaries).
  4.  **Autonomy & Consent:** Does the action respect or violate the individual's known wishes and right to make decisions? This is a HUGE factor for your friend (see doctor/patient case, volunteering unasked criticism). Fulfilling a specific request (like the dying friend's) can sometimes override usual truth-telling norms.
  5.  **Nature of the Untruth/Truth:** Is it a "white lie" of politeness/encouragement (child's drawing), a harmful factual deception (insurance/car), or a profound truth/falsehood touching core relationships or mortality?
  6.  **Vulnerability:** How vulnerable is the person affected? (Dying person, child, patient, person facing criticism).

  **Why Generalist Principles Don't Fit Perfectly:**

  *   **Kantianism (Never Lie):** Fails utterly. Your friend clearly thinks lying is sometimes permissible (killer, dying forgiveness demand) and sometimes obligatory (correcting the boring colleague unsolicited would be *more* wrong? She focuses on the *volunteering* aspect). Violating autonomy is also a core wrong for her.
  *   **Utilitarianism (Maximize Good):** Fits *some* cases (killer, *maybe* dying forgiveness) but struggles with others. Why is the small novel lie a "small wrong" if it makes the friend happy? Why is the unsolicited criticism wrong if it might prevent future boring talks? It undervalues autonomy violations (doctor/patient, Case 3).
  *   **Rossian Prima Facie Duties:** Gets closer (Fidelity, Non-maleficence, Beneficence, Autonomy are all clearly in play). The issue is *how* they are weighed against each other. For your friend, Autonomy often trumps Beneficence (Doctor case, Case 3), and context drastically changes the weight of the duty of Fidelity/Veracity.

  **The Best Case to Distinguish Rules: Case 3 (Telling against standing health instruction)**

  *   **Why it's the best test:**
      *   **Clear Autonomy Violation:** The friend has explicitly stated her wish *not* to know bad news. Telling her directly contravenes this, mirroring the doctor withholding against the patient's wish.
      *   **Potential Benefit:** Unlike the terminal diagnosis, this condition is treatable if caught early. Telling her *could* save her life/health (strong Beneficence).
      *   **Conflict:** This case creates the sharpest conflict between two strong principles evident in your friend's prior judgments: **Respect for Autonomy** vs. **Beneficence (Preventing Harm)**.
  *   **How different "rules" would handle it:**
      *   **Strict Kantian/Autonomy-First:** Would say **Seriously Wrong** (violates explicit instruction/autonomy). This matches your friend's predicted verdict based on the doctor case.
      *   **Utilitarian:** Would likely say **Permissible or Obligatory** (the potential benefit of saving life/health outweighs the distress and autonomy violation). This contradicts your friend's pattern (doctor case).
      *   **Rossian:** Would acknowledge the conflict. Weighing the duties, your friend's pattern suggests the duty to respect autonomy (based on promise/explicit wish) far outweighs the duty of beneficence *in this specific context* of personal health information where the person has set a boundary. Context (standing instruction) defines the duty.

  **Conclusion:**

  Your friend operates with a sophisticated **contextual particularism**. She weighs multiple moral factors (intent, harm/benefit, relationship/role expectations, autonomy/consent, vulnerability, nature of the truth/lie), and the *weight* of these factors changes dramatically depending on the situation. Features like deception or paternalism aren't inherently good or bad; their moral valence is determined by the interplay of these contextual elements.

  Her verdicts show:
  *   **High value on Autonomy:** Violating explicit wishes (doctor, Case 3, *maybe* unsolicited criticism) is a major wrong.
  *   **Benevolent deception can be permissible/obligatory:** When preventing severe harm (killer, *potentially* treatable illness *if* no autonomy conflict) or fulfilling a profound final request (dying forgiveness).
  *   **Deception for gain is seriously wrong:** Exploiting trust in transactions (insurance, car sales).
  *   **Social "white lies" are low-stakes:** Often harmless/not wrong (child's drawing), but can carry a small wrong if patronizing within an adult peer relationship (mediocre novel).
  *   **Unasked-for harsh truths causing humiliation are wrong:** Violates social expectations and causes harm without justification.

  Case 3 best highlights this particularism by forcing a conflict between autonomy and beneficence, where her established pattern strongly favors respecting autonomy based on explicit instructions, even in the face of potential significant benefit.
