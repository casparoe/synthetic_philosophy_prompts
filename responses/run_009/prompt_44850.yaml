answer: |-
  Your diagnosis is remarkably astute and captures the core dynamics of the epistemicism/supervaluationism debate. The stalemate isn't accidental; it stems from deep, intertwined divergences in priorities, metaphysics, and bedrock commitments. Let's dissect your hypothesis point by point:

  ### 1. **Different Core Questions/Projects**  
     **Your Hypothesis:** Epistemicism addresses the *logic/semantics we actually use* (preserving classical logic), while supervaluationism addresses *meaning-as-use* (how vague terms get content from linguistic practice).  
     **Verdict:** **Largely correct.**  
     - **Epistemicism** (especially Williamson) prioritizes explaining why classical logic *works* in vague discourse (e.g., why we accept excluded middle, why modus ponens doesn't fail in sorites arguments). Its sharp boundaries are a consequence of preserving bivalence and classical semantics.  
     - **Supervaluationism** (e.g., Fine, Keefe) prioritizes modeling how linguistic practice *determines meaning* without sharp boundaries. Precisifications formalize "ways the community could legitimately sharpen the term."  
     - **Why this stalls debate:** Each side sees the other's project as secondary or misguided. Epistemicists view supervaluationist logic (e.g., truth-value gaps) as revisionist and unmotivated. Supervaluationists see epistemicism as ignoring how meaning is grounded in use.

  ### 2. **Hidden Metaphysical Disagreement**  
     **Your Hypothesis:** A clash over whether vagueness is *linguistic* (supervaluationism) or *worldly* (epistemicism), masked by semantic framing.  
     **Verdict:** **Correct, but nuanced.**  
     - **Epistemicism** *claims* to be semantic (sharp boundaries are features of language), but its machinery implies a **quiet metaphysical realism**:  
       - Sharp boundaries are *discovered*, not stipulated.  
       - Williamson’s margin-for-error principles treat ignorance as *inescapable* given our causal access to meaning—implying meaning is a mind-independent fact.  
       - The "semantic fact" of a sharp boundary *feels* like a worldly fact because its unknowability mirrors limitations in empirical access.  
     - **Supervaluationism** explicitly treats vagueness as *semantic indecision*: boundaries aren’t "out there" but reflect underdetermination in linguistic rules.  
     - **The Crux:** The distinction between "semantic" and "worldly" blurs here. Epistemicism’s sharp boundaries *act* like metaphysical facts (they constrain truth irreducibly), while supervaluationism’s precisifications are tools to avoid metaphysical commitment. This unspoken rift fuels mutual incomprehension.

  ### 3. **Protected Starting Points**  
     **Your Hypothesis:** Epistemicists treat bivalence/excluded middle as non-negotiable; supervaluationists treat "no sharp cutoffs" as axiomatic. Each sees the other’s commitment as a reductio.  
     **Verdict:** **Exactly right.**  
     - For epistemicists, abandoning classical logic is a dealbreaker; for supervaluationists, accepting unknowable sharp boundaries is intolerably mysterious.  
     - **Result:** Deadlock. Epistemicists see higher-order vagueness as proof supervaluationism fails (it regenerates the problem). Supervaluationists see epistemicism as violating the core intuition that vague predicates *don’t* draw lines.  
     - Neither can convince the other because their "bedrock" is mutually exclusive. Arguments appeal to pre-theoretic intuitions the other side already rejects.

  ---

  ### Diagnosis: What Kind of Disagreement Is This?
  - **Substantive, not verbal:** Both address the same phenomenon (vagueness) but with incompatible frameworks driven by divergent priorities (logic preservation vs. meaning-as-use).  
  - **Not merely two research programs:** They share a core problem (sorites) but offer solutions that are *incommensurable* due to foundational splits.  
  - **Metaphysics is decisive:** The hidden issue is whether meaning/language *mirrors* reality (epistemicism) or *mediates* it (supervaluationism). Epistemicism’s "semantic facts" function as metaphysical posits; supervaluationism’s anti-realism about boundaries is a metaphysical stance.  

  ---

  ### Pathways to Progress
  The stalemate won’t break via internal argument. Progress requires **external pressure** or **reconceptualization**:

  1. **Evidence from Cognitive Science/Linguistics:**  
     - If experiments show competent speakers *treat* borderline cases as having truth-value gaps (e.g., hesitation patterns, rejection of excluded middle), supervaluationism gains.  
     - If speakers exhibit implicit commitment to sharp boundaries (e.g., consistent transitive judgments despite noise), epistemicism benefits.  
     - **Current status:** Mixed data. Some studies suggest gap-like behavior; others show probabilistic boundaries. This is the most promising near-term path.

  2. **Formal/Metaphysical Clarification:**  
     - Can epistemicism explain how *use fixes sharp boundaries* without positing occult facts? If not, it remains unstable.  
     - Can supervaluationism handle higher-order vagueness without collapsing into epistemicism (e.g., via open-textured admissibility constraints)? If not, it fails its own goal.  
     - **Result needed:** A theorem showing supervaluationism *requires* classical logic at some level, or that epistemicism *entails* absurd metaphysical commitments.

  3. **Rejecting the Dichotomy:**  
     - **Contextualism** (e.g., Raffman): Vagueness arises from context shifts in sorites sequences. Avoids both sharp boundaries and global gaps.  
     - **Degree Theories** (e.g., fuzzy logic): Rejects bivalence, but faces its own sorites problems (what degree is "bald"?).  
     - **Philosophical Therapy** (e.g., Wittgensteinian): Dissolves the paradox by rejecting the assumptions (e.g., "meaning determines all cases").  
     - **Obstacle:** These often sacrifice core intuitions (e.g., classical logic) or lack formal rigor.

  4. **Metaphysical Groundwork:**  
     - A theory explaining how linguistic practice *could* generate sharp boundaries unknowably (epistemicism’s holy grail) or why it *can’t* (supervaluationism’s vindication).  
     - **Challenge:** This requires bridging philosophy of language and metaphysics—a task neither side prioritizes.

  ---

  ### Realistic Prognosis
  **The field is waiting for something nobody knows how to produce.**  
  - Epistemicism dominates in philosophy of language for its logical conservatism; supervaluationism thrives in formal semantics for its modeling flexibility.  
  - The debate will likely end **not by refutation but by attrition**: one framework becomes the "working assumption" due to its utility for adjacent problems (e.g., epistemicism for safety-based epistemology; supervaluationism for semantic indeterminacy in AI).  
  - A decisive breakthrough would require **interdisciplinary work** (e.g., cognitive science + formal semantics + metaphysics) to resolve the bedrock clash between "no sharp boundaries" and "logic must be classical." Absent that, the stalemate persists.  

  **In short:** Your hypothesis survives scrutiny. The disagreement is a tangle of semantic, logical, and metaphysical commitments, with progress blocked by protected intuitions. Honest progress demands confronting the metaphysics head-on or awaiting empirical evidence that reshapes the intuitions themselves.
