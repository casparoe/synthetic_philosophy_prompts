  Utility invariance is tricky. Scale invariance is intuitive but ordinal invariance is too demanding—that's worth noting. The disagreement point should matter, but perhaps not dominate—like in the job offer scenario. Pareto efficiency is non-negotiable; rationality demands no waste.

  Symmetry is ideal but not always applicable—real cases often have asymmetries. The toy cases: simple pie-splitting with symmetric players vs. asymmetric best-case outcomes. That sets up Kalai-Smorodinsky vs. Nash later.

  Finally, briefly comparing how Nash and Kalai-Smorodinsky fare against the list, without bias. Highlighting Nash's IIA and K-S's monotonicity, their trade-offs. The TA can expand in lecture.

