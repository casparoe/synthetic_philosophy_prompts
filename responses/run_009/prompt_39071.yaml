answer: |-
  Here is the core handout framing the desiderata for a nonidentity solution adequate for institutional guidance, structured as requested:

  ---

  ### **Desiderata for an Institutionally Actionable Solution to the Nonidentity Problem**  
  *Standard of Adequacy:* Solutions must enable concrete policy deliberation (e.g., for genetic counseling guidelines, intergenerational environmental regulations) — **not merely** reconcile philosophical intuitions.  

  | Desideratum                                                                                                                          | Non-Negotiable? | Factional Alignment?                                                                 | Motivating Case/Consideration                                                                                                                                 |
  | :----------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Wrongness without Victims:**<br>Condemns reckless procreation (e.g., a teen choosing to conceive now, foreseeing a worse-but-still-worthwhile life for the child vs. waiting) **without** requiring a harmed individual who is worse off. *Alternatively*, provides a rigorous justification for abandoning this intuition. | **Non-Negotiable** (Policy) | *Rejected by strict Person-Affecting (PA) views* | **Case:** Genetic counselor advising a 16-year-old with a transient condition guaranteeing childhood disability. Policy needs to call this choice wrongful to justify intervention. |
  | **2. Respect for Preference Rationality:**<br>Acknowledges the resulting child, once adult, can rationally endorse the choice to exist, as the alternative was nonexistence *for them*.                                | **Non-Negotiable** (Rationality) | *Broadly neutral; core to PA, accepted by most* | **Consideration:** To deny this is to claim individuals *should* regret their own existence in nonidentity cases. Institutions cannot demand irrational regret. |
  | **3. Non-Evaporating Wrong in Aggregates:**<br>Applies to collective actions (e.g., sustained high-emission policies) where no single act determines identities, without dissolving the wrong when decomposed into individual acts. | **Non-Negotiable** (Policy) | *Challenges strict individualism; Totalists/Impersonalists accept more easily* | **Case:** Climate policy setting emissions targets over 100 years. Each voter/regulator’s act is identity-affecting, but the *policy* predictably creates worse-off future generations. Wrong must persist. |
  | **4. Guidance Under Moral Uncertainty:**<br>Delivers actionable directives even if the agency doubts the existence/weight of impersonal values or other contested foundations.                                     | **Non-Negotiable** (Agency) | *Rejected by Moral Realists who demand certainty; Pragmatists require it* | **Consideration:** Health ministries can’t halt prenatal care policies while philosophers debate impersonal goodness. Requires a "veil of ignorance" or risk-averse procedural default. |
  | **5. No Worse Trade-offs:**<br>Avoids solutions that generate intuitively repugnant conclusions (e.g., the Repugnant Conclusion) or create larger moral disasters than the nonidentity problem.           | **Negotiable** (Cost-Benefit) | *Rejected by committed Totalists; Prioritized by PA and Critical Level theorists* | **Case:** If an impersonal principle condemns the reckless teen but *also* requires creating massive populations with barely-worthwhile lives, the cost may be too high for policy adoption. |

  ---

  ### **The Core Tension**  
  **Desiderata 1 & 2 Cannot Be Fully Reconciled**  
  This is the tension your discussion must confront:  
  - **Desideratum 1** demands we condemn the reckless procreator’s act as wrongful.  
  - **Desideratum 2** insists the resulting child has no rational complaint (they prefer existing to never existing).  
  *Why the conflict?*  
  Wrongfulness typically requires a victim who is harmed (*worse off*). Yet the nonidentity problem blocks this by design: the child is not worse off than they would otherwise have been (since "otherwise" is nonexistence). **Any solution must either:**  
     - *Reinterpret wrongfulness* (e.g., as impersonal, non-comparative, or agent-centered),  
     - *Reject the victim requirement* for wrongness in procreative contexts, or  
     - *Explain why the child’s endorsement isn’t decisive* for assessing the act.  
  **Institutions cannot dodge this.** Policy must either prohibit the teen’s choice (contradicting 2?) or permit it (contradicting 1?).  

  ---

  ### **Notes for Seminar**  
  - **Factional Maps:**  
    - *Person-Affecting (PA) Camp*: Prioritizes 2, rejects 1 (or redefines "harm"), wary of 3 & 5.  
    - *Totalist/Impersonal Camp*: Embraces 1 & 3, dismisses 2’s relevance to permissibility, may accept 5’s cost.  
    - *Skeptics*: Reject 1 as confused, making 2 irrelevant; see 3 as intractable.  
  - **Policy Reality Check:** Desiderata 1, 3, and 4 are non-negotiable **because institutions must act**. Philosophers can suspend judgment; agencies cannot.  

  **Your Task:** Evaluate proposed solutions not by theoretical elegance, but by whether they satisfy *these institutional demands* — especially where 1 and 2 collide.  

  ---  
  *This framing isolates the practical stakes, forcing engagement with the "what counts as a solution?" meta-question before theory-laden debates consume discussion. The tension between condemning the reckless choice (1) and respecting the created person’s perspective (2) is the engine for deeper analysis.*
