prompt: |-
  I teach a graduate seminar on explanation in the social sciences, and a colleague in sociology has sent round an argument against what she calls "values as causes." Its target is Weber's Protestant ethic thesis, and I cannot decide whether it is a serious objection or a cheap one dressed up in serious clothes. Here it is, as she states it.

  (1) If an explanation is to be more than a redescription, it must be possible to establish that the cause was present without presupposing that the effect occurred; otherwise the explanation is untestable and empty.
  (2) In Weber's thesis, the cause is a psychological condition: the anxiety over election, the sanctification of everyday labor as a calling, the hostility to idle enjoyment and to wealth that is merely enjoyed rather than used — the disposition he is famous for calling innerworldly asceticism — prevailing among ordinary Calvinist believers.
  (3) Weber's evidence that this condition was prevalent among the population, as opposed to merely preached at it, consists of sermons, catechisms, and manuals of practical divinity — texts establishing what believers were told — together with the occupational and confessional statistics with which the essay opens, which show at most that Protestants were concentrated in business and skilled trades, not why.
  (4) So the attribution of the ethic to the population rests on the very conduct it is supposed to explain: we count the ethic as widespread because methodical, ascetic, profit-oriented conduct was widespread, and then explain the conduct by the ethic.
  (5) The explanation therefore collapses into: these people behaved as they did because they had the dispositions that produced that behavior.
  (6) And nothing in the reasoning is special to Weber: every explanation that invokes values or culture as a cause infers the values from the conduct they are invoked to explain, so every such explanation is untestable and empty.

  She concludes that Weber's thesis, and cultural explanation in general, is a redescription of what it claims to explain. My colleague is content with this; I am not, but I also cannot locate the defective step. I will mention two features of the argument that I think any adequate answer must take seriously.

  First, if the argument is sound, it does not stop at culture. When I explain a student's arriving at my seminar out of breath by her desire not to be late, my evidence for the desire is, in the main, the running itself — the very behavior the desire is cited to explain. My colleague replies that the individual case is different, because there the inference concerns a particular subject who can be interrogated, observed in other circumstances, and so on. I find that boundary unstable, but I cannot say precisely where it breaks, or whether it breaks in a way that also breaks her step (6).

  Second, I would like to keep (1) in some form: I do believe that explanations which cannot be checked against anything are empty. But I suspect the requirement I actually want is weaker than the one my colleague needs for (5) and (6) to go through, and I would like to see exactly where the extra strength enters the argument.

  Please tell me which step to reject, why that step looked acceptable when it was introduced, and what rejecting it costs — including what my colleague's position and mine must each give up.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a graduate seminar on explanation in the social sciences and have a colleague in sociology who presented an argument against "values as causes," specifically targeting Weber's Protestant ethic thesis. The user is unsure whether this argument is a serious objection or a superficial one dressed up formally. They've outlined the colleague's six-step argument and want to know which step to reject, why it seemed acceptable, and the implications of rejecting it.

  First, I need to understand the colleague's argument thoroughly. The key steps are: (1) Explanations must allow the cause to be established independently of the effect to avoid being untestable. (2) Weber's cause is a psychological condition (innerworldly asceticism). (3) Weber's evidence for this condition's prevalence relies on texts (sermons, etc.) and occupational stats, which show correlation but not causation. (4) Therefore, attributing the ethic to the population rests on the conduct it explains, leading to circularity. (5) The explanation reduces to dispositions causing behavior. (6) This applies to all cultural explanations, making them untestable.

  The user has two main concerns. First, the colleague's boundary between individual and cultural explanations seems unstable. The user's example of explaining a student running to class based on their desire highlights this—desire is inferred from behavior, similar to inferring values from conduct. The colleague argues that individual cases allow for additional evidence (interrogation, observation), but the user finds this boundary shaky. Second, the user wants to uphold some form of step (1) but suspects it's stronger than necessary.

  I need to identify the weak step. Step (4) seems problematic. It claims Weber's evidence for the ethic's prevalence depends solely on the conduct it explains. But Weber uses sermons, catechisms, etc., which are prescriptive, not descriptive of actual behavior. The occupational stats show a correlation but don't prove the ethic caused it. However, the colleague conflates these sources. The texts indicate what was taught, not necessarily internalized. Weber likely combines this with historical analysis to argue internalization. So step (4) oversimplifies by equating the evidence of preached values with actual psychological states, ignoring that Weber uses multiple lines of evidence.

  Why does step (4) seem acceptable? Because the colleague focuses on the direct evidence. Occupational stats alone don't show why, and texts only show what was preached. Without behavioral evidence, inferring the ethic from conduct seems circular. But Weber's argument is more nuanced. He uses the texts as a basis to infer internalization when combined with behavioral outcomes, supplemented by historical context. The colleague misses this inferential step.

  Rejecting step (4) means denying that the ethic is inferred solely from the conduct. Instead, it's inferred from prescriptive texts combined with behavioral outcomes and contextual analysis. This challenges the reduction to circularity. The cost for the user's colleague is that cultural explanations can avoid circularity with multiple evidence sources. For the user, they must accept that cultural causes aren't directly observable and require careful triangulation, which might be messier than natural sciences.

  The user's second concern about step (1) being too strong. The colleague's version requires direct independence, but social sciences often rely on indirect evidence. A weaker requirement might allow for evidence that isn't entirely independent but uses multiple indicators to avoid circularity. This preserves testability without demanding strict independence.

  The individual vs. cultural boundary: rejecting step (4) shows that cultural explanations, like individual ones, can use multiple evidence sources. The colleague's boundary breaks because both involve inference from behavior, but cultural explanations can use additional contextual and historical data. The instability comes from differing access to evidence, not a fundamental methodological divide.

  Implications: The colleague must accept that cultural explanations aren't inherently circular if they use diverse evidence. The user must accept that such explanations are inferential and probabilistic, not as straightforward as some natural science explanations. Both need a nuanced view of evidence in social sciences.
answer: |-
  The defective step is **Step (4)**. Your colleague's argument hinges on this claim, but it misrepresents Weber's methodology and overgeneralizes the problem to all cultural explanations. Let's break down why Step (4) fails, why it seemed plausible, and what rejecting it costs both positions.

  ### Why Step (4) is Defective
  1. **Misreading Weber's Evidence**:  
     Weber *does not* infer the prevalence of "innerworldly asceticism" *solely* from the conduct it explains (e.g., profit-oriented behavior). His evidence includes:  
     - **Prescriptive texts** (sermons, catechisms): These establish the *ideological framework* promoted to believers. They are independent evidence of the *values being taught*, not proof of internalization.  
     - **Historical context**: Weber argues that Calvinist theology (e.g., predestination) created unique psychological pressures. This is inferred from doctrine, not conduct.  
     - **Comparative analysis**: He contrasts Protestant regions/countries with Catholic ones, showing correlations between religious affiliation and economic behavior *before* asserting causation.  

     The occupational statistics (Step 3) are **correlative**, not the *basis* for inferring the ethic. They prompt the question ("Why this correlation?"), but the answer comes from analyzing doctrine and its psychological implications. The ethic is *not* "counted as widespread because conduct was widespread" (Step 4)—it is inferred from the pervasiveness of Calvinist institutions and teachings.

  2. **Conflating "Inference" with "Circularity"**:  
     All social explanations infer unobservable states (e.g., beliefs, desires) from observable behavior. This is *not inherently circular* if:  
     - The inference uses **multiple independent lines of evidence** (e.g., texts + comparative data + historical accounts).  
     - The cause (values) has **predictive/explanatory power** beyond the initial effect (e.g., explaining differential development across regions).  
     Weber’s thesis *predicts* patterns beyond the initial correlation (e.g., *why* Protestant artisans reinvested profits while Catholic ones did not). Circularity only arises if the *sole* evidence for the cause is the single effect it explains—which Weber avoids.

  ### Why Step (4) Looked Acceptable
  - **Surface Plausibility**: If Weber *had* only used economic conduct to infer the ethic and then "explained" conduct with that ethic, it would indeed be circular. Your colleague isolates occupational statistics while downplaying Weber’s use of doctrinal texts and comparative history.  
  - **Reductionist Temptation**: It’s easy to caricature cultural explanations as "X acted this way because of their culture" without examining *how* culture is operationalized. Step (4) exploits this by reducing Weber’s rich argument to a tautology.  
  - **Methodological Rigor**: Step (1) rightly demands independent testability, making Step (4) *seem* like a legitimate application. But Step (4) erroneously assumes Weber lacks independent evidence for the cause.

  ### What Rejecting Step (4) Costs
  #### For Your Colleague's Position:
  - **Loss of Generalization (Step 6)**: If Weber’s explanation isn’t circular, the claim that *all* cultural explanations are untestable collapses. Values/culture *can* be causes if supported by diverse evidence (e.g., linguistic data, rituals, comparative cases).  
  - **Weaker Skepticism**: They must concede that cultural explanations *can* be testable (e.g., by predicting novel phenomena or using historical controls).  

  #### For Your Position:
  - **Accepting Messier Epistemology**: You must defend that:  
    - Values are **unobservable constructs** inferred from behavior, texts, institutions, etc.  
    - Such inferences are **abductive** (best explanation) and **probabilistic**, not deductive.  
    - This makes cultural explanations **fallible and contestable**—but not empty.  
  - **Upholding a Weaker Version of Step (1)**: You keep the core principle ("explanations must be testable") but reject your colleague’s **strong independence requirement** (cause must be established *without any reference* to the effect). Instead, you adopt:  
    > *"An explanation is testable if it generates predictions beyond the initial phenomenon or integrates diverse evidence that isn’t solely derived from the effect."*  
    This allows inferring desires from behavior (your student example) *and* values from conduct, provided other evidence supports the inference (e.g., the student’s prior statements; Weber’s doctrinal analysis).

  ---

  ### Addressing Your Two Concerns
  1. **The Individual vs. Cultural Boundary**:  
     Your intuition is correct: the boundary is unstable. Rejecting Step (4) dissolves it. In *both* cases:  
     - We infer unobservable states (desires/values) from behavior.  
     - We use **additional evidence** to avoid circularity:  
       - For individuals: past behavior, testimony, alternative scenarios ("Would they run if not late?").  
       - For cultures: texts, comparative cases, institutional practices.  
     The difference is **pragmatic** (ease of access to evidence) not **methodological**. Your colleague cannot sustain Step (6) without this false dichotomy.

  2. **Preserving Testability (Weaker Step (1))**:  
     Your colleague’s Step (1) demands *strong independence* (cause identifiable *without* the effect). This is:  
     - **Unworkable in social sciences**: Causes like values are rarely observed directly.  
     - **Unnecessarily strong**: Testability requires that explanations can be *falsified* or *corroborated*, not that causes exist in a vacuum.  
     **Your weaker principle** suffices: Weber’s thesis *is* testable. For example:  
     - If innerworldly asceticism caused capitalism, we should *not* find similar economic dynamism in non-Calvinist societies with comparable material conditions (Weber checks this with Catholic regions).  
     - If Calvinist doctrine changed, economic behavior should shift predictably (historians have tested this).  

  ---

  ### Conclusion: What to Reject and Why
  - **Reject Step (4)**: It misrepresents Weber by ignoring his use of doctrinal evidence and comparative history to establish the cause independently of the effect.  
  - **Result**: Weber’s thesis isn’t circular, and cultural explanations *can* be valid.  
  - **Cost to You**: Defending social science as inherently inferential and probabilistic.  
  - **Cost to Colleague**: Abandoning sweeping skepticism about cultural causation.  

  **Key Insight**: The argument confuses *inferring causes from effects* (routine in all sciences) with *circular explanation* (which requires no independent evidence). Weber’s use of texts and cross-cultural comparison provides the necessary independence. Your seminar might explore how abductive reasoning rescues cultural explanations from vacuity—a fruitful response to this challenge.
