          - For those who saw a partner with a bad track record: did you update less?
          - Now that you know some track records were fake, how do you feel about the updates you made? Would you do it differently?
          - In the final round, when you saw your partner's probability that they were more accurate, how did you react? Did you update your own probability? Why or why not?
          - Did anyone feel that they were more accurate and therefore didn't update much? (steadfast)
          - Did anyone update a lot because they thought their partner was reliable? (conciliation)

      - Then introduce conciliationism and steadfastness.

      - Point out: In the game, there was an objective truth. In real disagreements, there isn't. But we often act as if there will be an objective truth (in the long run).

      - Also, note that in the final round, the question was about a fact that they had just participated in (but didn't know the outcome). This mirrors how in real disagreements we might have to form opinions about our own reliability.

      - Ask: Was it easier to be steadfast in the final round? Why?

      - Highlight cases where steadfastness paid off (when the partner was fake and wrong) and when it didn't (when the partner was genuine and right). And vice versa for conciliation.

      - Conclude: The game illustrates that how much you update should depend on how much you trust your partner. But in real life, we don't know if the person is a peer (we don't have a track record). So we have to rely on other factors.

  Given the complexity, we should do a dry run with a few friends to iron out the kinks.

  This design meets the constraints and should achieve the goal of making conciliationism and steadfastness experiential.
answer: |-
  Below is a comprehensive design for your in-class peer disagreement game, optimized for a 50-minute session with 16 students. The activity uses estimation tasks to simulate peer dynamics, introduces track records (half genuine/half fabricated), and employs a quadratic scoring rule to incentivize truthful credence reporting. Crucially, it culminates in a round where students disagree about *who is the peer*, forcing reflection on epistemic humility. I'll outline the full structure, materials, scoring, reveal, debrief, and limitations.

  ---

  ### **Game Structure & Timing** (Total: 50 min)
  **Goal:** Students experience conciliationism (revising beliefs toward a peer) and steadfastness (holding firm) before learning the terms.  
  **Core Mechanics:**  
  - Private credences on estimable quantities.  
  - "Track records" (50% real, 50% random) to manipulate perceived peerhood.  
  - Proper scoring rule (quadratic) to penalize hedging and reward accuracy.  
  - Final round on "who was more accurate?" to dispute peerhood itself.  

  | **Phase**       | **Time** | **Description**                                                                 |
  |-----------------|----------|---------------------------------------------------------------------------------|
  | **Setup**       | 5 min    | Explain rules, distribute materials, assign pairs.                             |
  | **Round 1**     | 5 min    | Private estimates for Q1–Q3 (individual).                                      |
  | **Pairing**     | 5 min    | Reveal partner’s Q1–Q3 answers + track record; update Q1–Q3 credences.         |
  | **Round 2**     | 5 min    | Private estimates for Q4–Q6 (individual).                                      |
  | **Update**      | 5 min    | Reveal partner’s Q4–Q6 answers; update Q4–Q6 credences.                        |
  | **Round 3**     | 10 min   | Estimate: "Who was more accurate in Q1–Q6?" See partner’s answer; update.      |
  | **Reveal**      | 5 min    | Share true answers, track record authenticity, and scores.                     |
  | **Debrief**     | 10 min   | Map experiences to conciliationism/steadfastness; discuss limitations.         |

  ---

  ### **Materials & Preparation**  
  **1. Estimation Questions (6 total):**  
     - Uncheckable facts (students can’t Google). Use diverse categories:  
       - **Q1:** Population of Bhutan (2023).  
       - **Q2:** Length of the River Nile (km).  
       - **Q3:** Year the printing press was invented.  
       - **Q4:** Wingspan of a Boeing 747 (m).  
       - **Q5:** Number of bones in the human body.  
       - **Q6:** Depth of Lake Baikal (m).  
     - **Q7 (Round 3):** *Which of you was more accurate in Q1–Q6?* (Students assign a probability to themselves being more accurate, e.g., "I am 70% likely to be more accurate").  

  **2. Track Records:**  
     - **Genuine Records (8 students):** Calculate post-game using pre-class submissions.  
       - Before class, have students submit estimates for 3 unrelated questions (e.g., height of Mount Kilimanjaro, population of Norway, year of Einstein’s birth). Compute their absolute errors (|estimate − truth|) and average error.  
       - Format: *"Partner’s Past Performance: Avg. Error = X units [e.g., 15% off]. Examples: Estimated Y for [question]; actual was Z."*  
     - **Fabricated Records (8 students):** Generate using a shuffled stack of the *genuine* records.  
       - Shuffle the 16 genuine records and randomly assign 8 to students as their "partner’s" history. This ensures identical formatting and plausible stats (no one can distinguish real vs. random).  
     - **Distribution:** Assign records randomly during pairing (students never know if their partner’s record is genuine/fake).  

  **3. Worksheets:**  
     - **Individual Sheets:**  
       - Sections for initial estimates (Q1–Q6), updated estimates (post-partner), and Q7 probability.  
       - Space to record partner’s answers and track record notes.  
     - **Partner Reveal Cards:** Pre-printed for each pair with:  
       - Partner’s Q1–Q3 answers (for Round 1 update).  
       - Partner’s Q4–Q6 answers (for Round 2 update).  
       - Partner’s Q7 probability (for Round 3 update).  
       - Track record (genuine or random).  

  **4. Scoring:**  
     - **Quadratic Scoring Rule:** For estimates, use \( \text{Score} = 100 - (\text{estimate} - \text{truth})^2 \).  
       - Encourages honest reporting: Moving halfway to a partner’s answer *gains points if the partner is right* but *loses points if they’re wrong*. Retreating to the mean (e.g., splitting the difference) is penalized.  
     - **Q7 Probability Scoring:** Use \( \text{Score} = 1 - (1 - p)^2 \) if correct, \( \text{Score} = 1 - p^2 \) if incorrect (proper for probabilities).  
     - **Points:** Track individual scores; winners get bragging rights (e.g., "Epistemic Champion" title).  

  ---

  ### **Step-by-Step Instructions**  
  1. **Setup (5 min):**  
     - Distribute worksheets. Explain:  
       - "You’ll estimate quantities privately. Then, you’ll see a partner’s answers and their past performance. Update your estimates if you trust them. Scores reward accuracy, not caution."  
     - Randomly pair students (8 pairs).  

  2. **Round 1 (5 min):**  
     - Students privately estimate Q1–Q3. Collect worksheets.  

  3. **Pairing (5 min):**  
     - Redistribute worksheets with **Partner Reveal Cards** (showing partner’s Q1–Q3 answers + track record).  
     - Students update Q1–Q3 estimates based on partner’s input.  

  4. **Round 2 (5 min):**  
     - Students privately estimate Q4–Q6. Collect worksheets.  

  5. **Update (5 min):**  
     - Redistribute worksheets with partner’s Q4–Q6 answers (no new track record).  
     - Students update Q4–Q6 estimates.  

  6. **Round 3 (10 min):**  
     - Students assign a probability to Q7: *"What’s the probability you were more accurate than your partner in Q1–Q6?"*  
     - Reveal partner’s Q7 probability. Students update their Q7 probability.  

  7. **Reveal (5 min):**  
     - Share true answers for Q1–Q6.  
     - Announce which track records were genuine (50%) and which were random (50%).  
     - Calculate scores:  
       - Award 1–3 points for each question (based on quadratic scoring).  
       - Crown a "winner" for fun (e.g., top scorer).  

  ---

  ### **Debrief & Connection to Epistemology** (10 min)  
  **Guiding Questions:**  
  1. **Map actions to theory:**  
     - *Conciliationism:* "Who moved their estimates significantly toward their partner’s? Did your trust in their track record drive this? How did it affect your score?"  
     - *Steadfastness:* "Who barely updated their estimates? Did skepticism pay off when your partner’s record was random? When did it backfire?"  
     - **Key insight:** Steadfastness wins points when partners are wrong/random; conciliationism wins when partners are genuine/right.  

  2. **Revising credence vs. revising peerhood:**  
     - "In Q1–Q6, you revised beliefs about facts. In Q7, you revised beliefs about *your partner* (e.g., ‘Maybe they’re not a peer after all’). How did the disputed track records in Q7 feel different?"  
     - **Predictable reaction:** Students with random-track-record partners retroactively distrust *all* track records. Note: "This mirrors real life—once burned, we overcorrect by doubting peers."  

  3. **Where steadfastness won:**  
     - Highlight a student who:  
       - Had a random-track-record partner with bad Q1–Q6 answers.  
       - Held firm (minimal updates) and scored high.  
     - "This is steadfastness in action: trusting your own evidence despite apparent peer disagreement."  

  4. **Limitations of the game:**  
     - **Candid shortcomings:**  
       - Real peer disagreement lacks an "oracle" (external truth). Here, you reveal answers—but irl, we rarely have closure.  
       - Real disagreements involve *shared evidence*; here, track records are private.  
       - The game can’t capture deep, evidence-based debates (e.g., moral/political disagreements).  
     - **Supply in final minutes:**  
       - "In real life, conciliationism asks us to lower confidence when facing peers. Steadfastness says we can hold firm if we have reason to doubt peerhood. The game shows both can be rational, but hinge on how we judge peers—and that judgment is fallible."  
       - **Bridge to reading:** "Now that you’ve lived this, we’ll see how philosophers like Kelly (steadfast) and Elga (conciliationist) formalize it."  

  ---

  ### **Predictable Pitfalls & Fixes**  
  - **Problem:** Students ignore scoring and "split the difference" reflexively.  
    - **Fix:** Start with a practice question (e.g., "Estimate my age") and show scoring math: Splitting the difference when the partner is wrong *loses points*.  
  - **Problem:** Fabricated track records are detected (e.g., implausible errors).  
    - **Fix:** Use shuffled genuine records (as above); errors will feel realistic.  
  - **Problem:** Time runs short during pairing/updates.  
    - **Fix:** Use a timer; assign TA to expedite handout swaps.  
  - **Problem:** Q7 feels abstract; students don’t engage.  
    - **Fix:** Frame it competitively ("Who’s the better estimator?").  

  ---

  ### **Why This Works**  
  - Students experience peer disagreement viscerally: Trusting a "peer" with a random record feels like epistemic betrayal, while steadfastness against a weak partner feels vindicating.  
  - The scoring rule forces rational trade-offs (no easy hedging).  
  - Q7 makes peerhood itself the disagreement, priming deeper discussion.  
  - Revealing the 50% fabrication rate mirrors real-world uncertainty about peer reliability.  

  This design ensures that "conciliationism" and "steadfastness" enter the syllabus as lived strategies—not just labels. Good luck!
