prompt: |-
  I write about science and ideas for a living, and a data-scientist friend of mine has been on a "death of expertise" tear lately. Over beers he laid out an argument that big crowds are basically infallible, and I can't find the hole in it even though the conclusion is nuts. Roughly:

  (1) Condorcet's jury theorem: take a group voting yes or no on some factual question. If each voter is better than a coin flip at getting the right answer, and their votes are independent, then as you add more voters the probability that the majority is right approaches 1. It works at 51% accuracy, it works at 90% — at 51% it just takes longer.

  (2) "Independent" in the theorem just means what it means in everyday life: nobody's vote is influenced by anyone else's vote. No copying, no seeing the running tally, everyone answering on their own.

  (3) Take any factual question in the news — did the politician actually say the quote, was that study garbage, whatever — and poll a million people who follow the news even casually. Someone who follows a topic at all is a bit better than a coin flip on questions about it; that's pretty much what "following a topic" means.

  (4) A phone poll satisfies (2) trivially: no one sees anyone else's answer before they submit.

  (5) So a million-person poll on any newsy factual question is right with probability 1 minus a rounding error.

  (6) So forget fact-checkers and expert panels. On any factual question, a big enough poll beats any expert, every time.

  I raised the obvious objection that everyone watches the same three channels and reads the same viral thread, and he waved it off: that's shared background, not influence between votes — the theorem cares about whether my vote influences yours, not about whether we watched the same show before voting. Which... sounded right at the time? My instinct since then is to attack (3) instead, on the grounds that people aren't really better than chance on technical questions, but he just says "51 percent" and smiles, and honestly people who read the news probably are at least 51% on news questions. So I'm stuck. Every step sounds fine on its own, and yet the conclusion is insane — Twitter polls about health stuff are wrong constantly.

  Which step do I reject, and what does rejecting it cost me? Please structure your answer as: "Verdict" (2-3 sentences, name the step), "Why the friend's reading of that step is wrong" (~150 words), "Whether my instinct about (3) fails too, or actually holds" (~120 words), and "What's left of the theorem after this" (~150 words). I'd rather keep (1) if at all possible — I checked the math myself and it's definately real.
reasoning: |-
  Okay, the user is a science writer whose data scientist friend argues that large crowds are infallible based on Condorcet's jury theorem. The friend's reasoning seems solid step-by-step but leads to an absurd conclusion. The user wants to know which step to reject without undermining the theorem's validity.

  Hmm, the core issue appears to be Step 4's claim that phone polls guarantee independence. The theorem requires strict statistical independence, whereas real-world voters share information sources and cognitive biases. Even in phone polls, pre-poll media consumption creates correlated errors - like everyone believing the same misinformation from a viral news segment. This violates the theorem's independence condition.

  Looking at Step 3, the user's instinct has merit too. While news-followers may clear 51% accuracy on simple facts, technical questions often fall below that threshold. But this alone doesn't fully resolve the paradox - even 51% accuracy would theoretically work with true independence.

  The theorem itself remains mathematically sound for controlled scenarios like jury decisions. Its real-world limitation is that statistical independence is practically unattainable in connected societies. The key insight is that shared informational ecosystems create dependence that the theorem doesn't account for. This preserves the math while explaining why Twitter polls fail.
answer: |-
  ### Verdict
  **Reject Step 4.** The friend incorrectly assumes phone polls guarantee the statistical independence required by Condorcet’s jury theorem. Real-world voters share systemic biases from common information sources, violating the theorem’s core assumption.

  ### Why the Friend’s Reading of Step 4 is Wrong (~150 words)
  Independence in Condorcet’s theorem isn’t just about *direct influence during voting* (e.g., seeing others’ answers). It requires *statistical independence*—meaning errors must be uncorrelated. In reality, voters consume the same media, algorithms, or viral misinformation, creating *shared biases*. For example, if Fox News misreports a quote, conservatives in a poll will systematically err together; if a TikTok myth spreads, Gen Z voters align incorrectly. Phone polls prevent *direct* collusion but not *mediated* correlation through pre-existing exposure. The theorem fails spectacularly when errors correlate—a 51% accurate but correlated group can yield near-100% *wrong* majorities. Twitter polls fail because misinformation creates herd errors; votes aren’t independent trials but echoes of the same flawed sources.

  ### Does Your Instinct About (3) Hold? (~120 words)
  **Yes, but it’s secondary.** Attacking (3) has merit: on *technical* questions (e.g., "Does mRNA alter DNA?"), even engaged voters often fall below 51% accuracy due to complexity or misinformation. However, your friend’s "51%" dodge works for *simple* factual questions ("Did Politician X say Y?"). Yet shared bias *still breaks independence* even if individuals clear 51% on easy questions. For instance, partisan voters might be 60% accurate on their own "side" but systematically wrong on opponent quotes due to filter bubbles. Thus, while (3) is weak for technical issues, (4) is the critical flaw—independence fails first, making (3) irrelevant in many cases.

  ### What’s Left of the Theorem After This (~150 words)
  Condorcet’s theorem remains mathematically valid but highly context-dependent. It applies only in **controlled environments** with true statistical independence and individual competence >50%:
  - **Juries/panels:** Experts deliberating *independently* (e.g., blinded peer review).
  - **Prediction markets:** Traders with diverse, *uncorrelated* information.
  - **Niche technical decisions:** Engineers voting on safety protocols without shared biases.  

  It fails in **public discourse** due to correlated errors from media monocultures, algorithms, or misinformation. The theorem isn’t "wrong"—it’s misapplied. To salvage crowd wisdom, you’d need:
  1. **Diverse, uncorrelated information sources** (rare in polarized societies),
  2. **Vetting for competence** (unrealistic at scale),
  3. **Mechanisms to prevent herding** (e.g., Delphi method).  
  Expert panels still dominate for complex issues because they enforce independence *and* competence.
