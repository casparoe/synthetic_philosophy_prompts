  ### Final Proposal: The "Forecast Coordination" Game
  We'll have two parts to the payoff:
  1. A coordination payoff: you get more if you plant the same crop as the majority.
  2. A weather payoff: you get more if your crop matches the actual weather.

  And the actual weather is determined by the base weather state (which is drawn once for all) and is the same for everyone.

  The catch: the forecast is a noisy signal of the base weather state, but the coordination part doesn't depend on the weather.

  In Round 1:
     - The instructor draws the base weather state (Sunny or Rainy, 50-50).
     - Each farmer receives a forecast: with accuracy `a` (say 70%) they get the correct forecast; otherwise the opposite.
     - Each farmer chooses a crop (A or B) based on their forecast.
     - The actual weather is the base weather.
     - Payoff for a farmer:
          - If they plant the same crop as the majority, they get 5 points (coordination bonus).
          - If their crop matches the weather, they get 5 points (weather bonus).
          - So total up to 10.

  But note: the coordination bonus depends on the majority, which depends on what others do. The weather bonus depends on the weather and their choice.

  In this setup, if the forecast is accurate, they are more likely to match the weather. But the coordination bonus requires matching the majority.

  What is the best response? It depends on what others do.

  If everyone conditions on the forecast, then:
     - If the base weather is Sunny, 70% get "Sunny" and plant A (assuming they plant A on sunny forecast), and 30% plant B.
     - Then the majority is A (70%).
     - So the 70% get both bonuses: coordination (because they are in the majority) and weather (because they planted A and it's sunny).
