  ### **Game Title**: The Lighthouse Keeper's Dilemma  
  *Cover Story*:  
  16 ships are sailing through foggy waters. Each ship must choose between the FAST route (riskier, depends on rocks) or the SLOW route (safe but costly). A lighthouse broadcasts a signal (🔴/🔵) about rock formations, but its accuracy depends on how many ships *heed* its warning. Ships care about both individual safety and collective efficiency.

  ---

  ### **Materials**  
  - 16 player packets (each contains: decision sheet, 🔴/🔵 forecast card, envelope)  
  - 1 "Rock Formation" die (D6)  
  - 1 "Lighthouse Accuracy" slider (poster with movable marker)  
  - Snack point tokens  

  ---

  ### **Rules & Payoffs**  
  **Key Variables**:  
  - **True Rock State**: Determined by die roll *before* forecasts (1-3 = Safe, 4-6 = Treacherous)  
  - **Lighthouse Accuracy**: Starts at 50%. Increases by 3% per ship that *ignores* its signal.  
  - **Forecasts**: Players receive 🔴 or 🔵 signals. Probability matches Lighthouse Accuracy.  

  **Payoff Table** (per player):  
  | Action          | Route Taken | If Rocks SAFE | If Rocks TREACHEROUS |  
  |-----------------|------------|---------------|----------------------|  
  | Follow Signal   | FAST if 🔵  | +20 points    | -10 points          |  
  |                 | SLOW if 🔴  | +5 points     | +5 points           |  
  | Ignore Signal   | FAST       | +25 points    | -20 points          |  
  |                 | SLOW       | 0 points      | +10 points          |  

  **Collective Bonus**: If ≥12 ships choose the SAME TYPE OF DECISION (all follow or all ignore signals), +5 bonus points each.  

  ---

  ### **Timeline (90 min)**  
  1. **Intro & Round 1 Setup (10 min)**  
     - Explain cover story, payoffs, and individual incentives ("Your signal is your best clue for safety!").  
     - Roll "True Rock State" (hide result). Set Lighthouse Accuracy to 50%.  

  2. **Round 1: Conditional Choice (20 min)**  
     - Distribute forecast cards (match true state w/ 50% accuracy).  
     *Players decide individually: FOLLOW signal (SLOW on 🔴, FAST on 🔵) or IGNORE (choose freely).*  
     - Collect decisions. Calculate:  
       a) New Lighthouse Accuracy = 50% + (3% × number who IGNORED)  
       b) Collective bonus eligibility  
     - Reveal true state, payoffs, and accuracy drift. *Most will FOLLOW; collective bonus likely missed.*  

  3. **Round 2: Policy Commitment (25 min)**  
     - Reset Lighthouse Accuracy to 50%.  
     - Distribute envelopes. Players write **binding policies** for both signals:  
       *"If I see 🔴, I will: ______"*  
       *"If I see 🔵, I will: ______"*  
       (Options: FOLLOW or IGNORE)  
     - Collect sealed envelopes. Roll new "True Rock State."  
     - Distribute forecast cards (using original 50% accuracy).  
     - Open envelopes, execute policies, calculate payoffs.  

  4. **Debrief & Concept Mapping (35 min)**  
     - Compare avg. payoffs (Round 1 likely 5-10; Round 2 15+ if coordinated).  
     - **Key moments to highlight**:  
       - *The Accuracy Drift*: "When you used your signal, you *made it less valuable* for others. Your private info hurt the group."  
       - *The Collective Bonus*: "Policies let you coordinate *before* knowing your role."  
       - *Policy vs. Action*: "In Round 2, you chose a *rule* for both signals while ignorant. In Round 1, you chose *given* your signal."  
     - **Jargon-free framing**:  
       - "Signals aren't just *clues about the world*—they're *inputs your past self could predict*. Choosing while ignorant lets you optimize for *all possible yous*."  
     - **Avoiding free will digressions**: Preempt with, "We're not debating philosophy—we're simulating how *timing of decisions* changes outcomes."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Round 1 coordination attempts**: Some may try to rally others to ignore signals. *Solution*: Run decisions silently and privately. Emphasize "no talking" to preserve individualism.  
  2. **Round 2 mixed strategies**: Players may write "FOLLOW if 🔴, IGNORE if 🔵" (still conditional). *Solution*: Post-policy examples: "Always FOLLOW" or "Always IGNORE" get bonus; mixed strategies don't.  
  3. **Confusion on payoffs**: Use a sample calculation (e.g., "If 4 ignore signals, accuracy jumps to 62%").  
  4. **Free will derailment**: Most likely when sealing policies. *Shut down*: "For this game, assume binding commitments—like unbreakable contracts. We're testing decision *timing*, not metaphysics."  

  ---

  ### **What the Game Can't Replicate**  
  - **Counterfactual ownership**: Students won't *feel* responsible for paths not taken (e.g., "The me who saw 🔵 got -10, but the 🔴 me saved the bonus!").  
  - **Debrief requirement**: Explicitly explain: "Your Round 2 policy succeeded because it valued *all possible signals equally*—even those you didn't receive. That's the 'updateless' insight: optimizing for the *tree of possibilities*."  

  ---

  ### **Why This Works**  
  - **Stealth structure**: Forecasts feel like "helpful info," but the accuracy drift + bonus create tension between individual rationality and group welfare.  
  - **Low stakes**: Snack points prevent emotional investment in "wrong" choices.  
  - **Dual revelation**: Round 1 shows the trap; Round 2 proves policy superiority.  

  This design forces students to *experience* the gap between conditional and precommitment thinking without triggering pattern-matching. The payoff asymmetry (high risk/reward for FAST) + collective bonus mirrors Newcomb's tension, while the lighthouse drift adds novelty.
