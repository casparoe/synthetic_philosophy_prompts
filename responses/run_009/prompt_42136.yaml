  Conditioning on the forecast: 
     - When weather is sunny (50% of the time):
          - 70% get 10, 30% get 0 -> average sunny: 7
     - When weather is rainy (50% of the time):
          - 70% get 0, 30% get 10 -> average rainy: 3
     - Overall average: 0.5*7 + 0.5*3 = 5

  So the precommitment to always plant A gives 7.5 on average, while conditioning gives 5.

  But in the sunny case, the 70% are very happy and the 30% are not. In the rainy case, the 30% are very happy and the 70% are not. But overall, the coordinated strategy is better on average.

  In Round 1, students play by conditioning on their forecast. They will experience that sometimes they are in the majority and sometimes not, and the average will be 5.

  In Round 2, they submit a strategy: for each forecast ("Sunny" or "Rainy"), what crop to plant. They can choose to ignore the forecast and always plant A, or always plant B, or condition.

