  And if they submit always B, then they get 5 if weather is rainy (10) and 5 if sunny (5), also 7.5.

  So the best is to ignore the forecast and plant one crop consistently.

  This illustrates that the forecast, though informative about the weather, causes them to split and lose the coordination bonus. By precommitting to ignore the forecast, they guarantee the coordination bonus and get the weather bonus half the time.

  ### The Game Structure

  **Materials:**
  - Envelopes or small papers for students to write their Round 2 strategies.
  - A coin or RNG to determine the weather and the forecasts.

  **Rules:**

  There are two crops: Crop A and Crop B.
  There are two weather conditions: Sunny and Rainy.
  Crop A thrives in Sunny weather, Crop B in Rainy weather.

  **Payoff Rules:**
  - You get 5 points if you plant the same crop as the majority of the class.
  - You get 5 points if you plant a crop that matches the weather (Crop A in Sunny, Crop B in Rainy).
  - Your total points are the sum (0 to 10).

  **Round 1:**
  1. The instructor draws the weather (Sunny or Rainy) with a fair coin toss (not revealed to students).
  2. For each student, the instructor generates a forecast:
     - If the weather is Sunny, then with 70% chance the forecast is "Sunny", 30% "Rainy".
     - If the weather is Rainy, then with 70% chance the forecast is "Rainy", 30% "Sunny".
     (This can be done by having students draw from a bag with 7 sunny and 3 rainy tickets for sunny weather, and vice versa for rainy, or use an RNG.)
  3. Each student sees their own forecast and chooses to plant either Crop A or Crop B.
  4. The instructor reveals the weather and the majority crop.
  5. Each student calculates their payoff.

  **Round 2:**
  1. Before any draw, each student writes down a strategy on a piece of paper and puts it in an envelope. The strategy is two choices:
     - "If my forecast is 'Sunny', I will plant: [A or B]"
     - "If my forecast is 'Rainy', I will plant: [A or B]"
  2. The instructor draws the weather (same as before).
  3. For each student, the instructor generates a forecast (as in Round 1).
  4. The instructor collects the envelopes and then, for each student, opens their envelope and notes their choice based on their actual forecast and their strategy.
  5. The instructor announces the majority crop.
  6. Students calculate payoffs.

  **Timeline for 90 minutes:**
  - Introduction to the scenario and rules: 10 minutes
  - Round 1:
     - Draw weather and generate forecasts: 5 minutes
     - Students make choices: 5 minutes
     - Compute majority and payoffs: 5 minutes
     - Report individual payoffs and average: 5 minutes (total 20 minutes)
  - Round 2:
     - Explain strategy submission: 5 minutes
     - Students write strategies and seal: 5 minutes
     - Draw weather and generate forecasts: 5 minutes
     - Apply strategies and compute: 10 minutes
     - Report payoffs and average: 5 minutes (total 30 minutes)
  - Debrief: 30 minutes

  **Debrief:**
  1. Compare the average payoff in Round 1 (expected around 5) and Round 2 (if they coordinated on one crop, expected 7.5).
  2. Ask students who did well in Round 1: typically those who happened to be in the majority and matched the weather. But note that in sunny weather, the majority were those who got sunny forecast (70%) and they got 10; the minority (30%) got 0. Similarly in rainy weather, the 30% who got rainy forecast got 10, the 70% got 0. Overall average: 5.
  3. In Round 2, students who submitted a strategy to always plant one crop (either A or B) got 7.5 on average. They gave up on the weather bonus half the time but always got the coordination bonus.
  4. Map to concepts:
     - In Round 1, you decided with the information you had (the forecast). That seemed like the sensible thing to do because it gave you information about the weather. But it caused you to sometimes be in the minority, losing the coordination bonus.
     - In Round 2, you committed to a policy for both possible forecasts before you knew which forecast you would get. This allowed you to ignore the forecast and guarantee the coordination bonus.
     - The forecast was evidence about the weather (so locally it seemed good to follow it) but by following it, you became vulnerable to being in the minority. Your earlier self, not knowing what forecast you would get, could choose a policy that avoids that risk.

  **What might go wrong:**
  - In Round 1, some students might not follow the forecast. They might try to coordinate. But with 16 students, if a few defect from following the forecast, it might change the majority. We can emphasize that they should act on the forecast to the best of their ability.
  - In Round 2, some students might still condition. They might write: if sunny forecast then A, if rainy then B. Then they will get the same as Round 1. But others might write always A or always B. The average might not be 7.5 if not everyone coordinates on the same crop. We can point out that the ones who conditioned did worse than the ones who didn't.
  - Free will digression: students might argue that in Round 2 they are not really precommitting because they can change their mind. But we have them submit sealed strategies to enforce commitment. If they ask, say: "In this game, we are simulating a precommitment by having you write it down and not letting you change after you see the forecast."

  **What the game cannot reproduce:**
  - In true updatelessness, an agent cares about the counterfactual versions of themselves that see different evidence. In this game, the student only experiences one path (the forecast they actually get). But in Round 2, when they write the strategy, they are forced to consider both possibilities. The debrief should emphasize that the policy choice is made from a position of ignorance about which forecast you get, so you are forced to average over both possibilities.

  **Likely derailment:**
  - Free will: when we ask them to commit in Round 2, they might say "But I can just change my mind when I see the forecast." We handle it by the rules: the strategy is sealed and you cannot change. We are simulating a precommitment device.
  - "Why not all condition but on the same mapping?" For example, they might think: let's all agree that if we get sunny, we plant A; if rainy, we plant A. Then they are always planting A. That's the coordinated strategy! But in Round 1, they didn't have a chance to coordinate. In Round 2, they can. The point is that without precommitment, they cannot coordinate because they act on their private information.

  This game should illustrate the core idea: sometimes you should decide on a policy before you know which observation you get, even if the observation is informative, because it helps with coordination or avoids other pitfalls.
