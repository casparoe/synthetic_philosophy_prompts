prompt: |-
  I'm a junior and I co-lead the philosophy club at my school, which is a small group of about ten students who meet for half an hour at lunch every other week. For an upcoming session I've been assigned to present the Jain doctrine of anekāntavāda, the view that reality is many-sided and that any single statement about it captures only part of the truth, along with its companion doctrine of sevenfold predication, according to which a claim is to be prefixed with something like "from one standpoint" and can be affirmed, denied, both, or neither in various combinations. Most of the group has never heard of Jainism and none of them has studied Indian philosophy.

  I don't want you to explain the doctrine to me; I've read enough to feel I understand it myself. What I need is a plan for the session. Specifically:

  1. Dependency structure: in what order the pieces must come so that the doctrine feels like a natural response to a real problem rather than a piece of trivia? Does the idea of standpoints have to come before the sevenfold scheme, or the other way around, and what breaks if I get the order wrong? And does anything need to be in place even before that — some prior sense of what it would mean for a description to be incomplete?

  2. The carrying example: the parable of the blind men and the elephant is the obvious one, but I'm suspicious of it, partly because it seems to suggest there is a sighted person who sees the whole elephant and gets it right, which is exactly the kind of privileged standpoint the doctrine seems to deny. Should I use it anyway and repair it, or is there a better case to build the whole session on? Whatever you recommend, tell me what the example must have in it and what it must not smuggle in.

  3. Misconceptions: I can already guess my clubmates will conclude either that the doctrine is just relativism ("everyone's opinion is equally valid"), or that it's self-refuting ("if every statement is partial, so is that one, so why believe it?"), or that it forbids anyone from ever asserting anything flat-out. Are these the right three to expect, in what order will they surface, and at what point in the sequence should each be headed off rather than allowed to derail the session?

  4. A check for understanding: one question or task I could pose in the last five minutes that would show me whether they've actually grasped the doctrine rather than just found it charming, and what a good versus a merely compliant answer would look like.

  5. What to leave out: given the audience and the thirty minutes, what parts of the tradition should I openly decline to cover, and say I'm declining, so the session doesn't bloat?

  Please be concrete about the sequencing and the reasoning behind it; I care less about the content of the doctrine than about the order of ideas, because that's what I keep getting wrong when I try to teach things.
reasoning: |-
  Okay, let me approach this systematically. The user is preparing a philosophy club session on Jainism's anekāntavāda and needs pedagogical guidance rather than content explanation. 

  First, I consider the core challenge: making abstract doctrine feel necessary. They've struggled with sequencing before, so the response must prioritize logical scaffolding. The dependency structure should start from concrete epistemic pain points - perhaps with a relatable disagreement scenario. 

  For the parable problem, the elephant story seems flawed because it implies a privileged observer. I recall Jain texts emphasize all perspectives being inherently limited, including the "sighted" one. Maybe reframing it as "everyone touches different parts, and even sighted observers miss microscopic details" preserves the core while avoiding hierarchy.

  Anticipating misconceptions is crucial. Relativism and self-refutation will likely surface immediately. I should suggest preemptive clarification during the standpoint introduction phase, perhaps contrasting "partial validity" with "equal validity." The self-refutation concern might need addressing when introducing the sevenfold scheme itself.

  For the check of understanding, a well-designed question could ask students to apply syādvāda to a polarized debate topic. A strong answer would show conditional affirmation/denial based on standpoints, not just "both sides have points."

  Time constraints mean omitting historical context and ascetic practices. I'll explicitly note these exclusions to model disciplined focus - which ironically demonstrates anekāntavāda by showing what's left out of this very session.

  The flow should be: 1) provoke recognition of incomplete descriptions via debate exercise, 2) introduce standpoints as solution framework, 3) present sevenfold predication as practical tool, 4) immediately defuse top misconceptions, 5) assess with applied question. Getting steps 1-2 inverted would make the doctrine seem arbitrary.
answer: |-
  Here's a concrete 30-minute session plan focused on sequencing and pedagogical flow, designed to make anekāntavāda feel necessary and address your core concerns:

  **Dependency Structure & Sequence (25 mins total):**
  1.  **Provoke the Problem (5 mins):**
      *   **Activity:** "The Hot Dog Debate." Pose: *"Is a hot dog a sandwich?"* Have students briefly argue sides (1 min). Then ask: *"What if I told you BOTH sides are right... AND wrong? Not just 'opinions differ,' but that each claim captures something true but misses something crucial?"*
      *   **Why first?** Creates an immediate, relatable experience of incomplete description/conflicting truths. *Without this felt problem, anekāntavāda seems arbitrary.* Avoid abstract talk of "incompleteness" – create it experientially.
      *   **Transition:** "This isn't just about food. Jain philosophers argued *all* claims about complex reality face this. Their solution: **Standpoints (Nayas)**."

  2.  **Introduce Standpoints (Nayas) (7 mins):**
      *   **Concept:** Explain standpoints as specific contexts, purposes, perspectives (e.g., culinary, legal, biological for the hot dog; material, functional, emotional for an object like a mug).
      *   **Key Point:** Emphasize *no single standpoint is the whole truth*. Each reveals a facet. The "truth" depends *from which angle you're looking*.
      *   **Crucial Guardrail:** Immediately state: *"This is NOT relativism. Relativism says 'anything goes.' Jainism says each standpoint reveals a REAL aspect of a complex object, but ONLY that aspect. Some standpoints are more relevant for specific questions."*
      *   **Why before Syādvāda?** Standpoints provide the *reason* for the sevenfold scheme. Syādvāda is the *tool* for expressing standpoint-bound claims. Reversing makes Syādvāda seem like arbitrary logic-chopping.

  3.  **Present Syādvāda (Sevenfold Predication) (8 mins):**
      *   **Tool, Not Abstraction:** Frame it as the linguistic rule for using standpoints responsibly: "Always prefix your claim with 'Syāt' (roughly: 'From a standpoint,' 'Conditionally,' 'Perhaps')".
      *   **The 7 Modes (Simplify!):** Focus on the core 4 for clarity:
          1.  **Syāt Asti:** From standpoint X, it *is* (e.g., Culinary: Hot dog *is* a sandwich – bread surrounding filling).
          2.  **Syāt Nāsti:** From standpoint Y, it *is not* (e.g., Cultural/Historical: Hot dog *is not* a sandwich – distinct category).
          3.  **Syāt Asti Nāsti (Successively):** From different standpoints, it *is* AND *is not* (but not at the same time/same standpoint!).
          4.  **Syāt Avaktavyaḥ (Inexpressible):** If you try to describe it *without any standpoint* or *simultaneously* from conflicting standpoints, it's indescribable/incoherent.
      *   **Why Now?** Standpoints define *why* we need these qualifiers. The hot dog debate shows *why* modes 1-3 exist. Trying to answer "What is it *absolutely*?" leads to mode 4.

  4.  **Address Key Misconceptions Head-On (3 mins):**
      *   **Relativism:** Reiterate: "Not all standpoints are equal! Some are *objectively relevant* to the question. A biologist's standpoint on 'alive' matters more for health than a poet's. Anekāntavāda demands *identifying the relevant standpoint*, not ignoring it. It's about *qualified* truth, not *equal* opinion."
      *   **Self-Refutation:** "This doctrine *applies to itself*. It says: *From the standpoint of describing complex reality accurately*, the best model is this many-sided one. It doesn't claim absolute, standpoint-less truth for itself. It's a tool for better understanding, not the final word from nowhere."
      *   **Never Assert Anything:** "Jains *do* assert! They just qualify *how* it's true. 'Syāt, stealing causes suffering' is a strong assertion *from the standpoint of ethics/karma*. It's about intellectual humility and precision, not silence."
      *   **Timing:** Hit these *immediately* after explaining Syādvāda, BEFORE discussion opens. Preempt the derailment. Relativism will surface first, then self-refutation.

  5.  **The Elephant Example - Repaired (2 mins):**
      *   **Use it, but FIX it:** "Imagine the blind men. One feels the leg (tree), one the trunk (snake), one the tail (rope). Each grasps a real part, but mistakes it for the whole. NOW: Crucially, imagine a sighted person observing *from 50 feet away*. They see the *whole elephant shape* – a better standpoint for 'what is the overall form?' BUT: Do they see the texture of the skin? The internal organs? The elephant's history? The atomic structure? **NO.** Even their view is partial, just *more comprehensive* for that specific question (overall shape). No standpoint captures *everything*."
      *   **Must Have:** Multiple perspectives, each capturing a real aspect but mistaking it for the whole. **Must NOT Have:** Any perspective presented as the absolute, complete, "God's-eye" truth. Emphasize the *sighted person's limitations too*.

  **Check for Understanding (Last 5 mins):**
  *   **Question:** "Apply Syādvāda to the statement: 'This smartphone is essential.' Generate at least two different Syāt-prefixed statements representing different standpoints."
  *   **Good Answer:** Clearly identifies distinct standpoints and uses the modes appropriately. Example:
      *   "Syāt, it is essential (Asti): From the standpoint of running my small business communication, it is essential."
      *   "Syāt, it is not essential (Nāsti): From the standpoint of basic human survival needs (food, water, shelter), it is not essential."
      *   (Bonus) "Syāt, it is inexpressible (Avaktavyaḥ): If I try to say whether it's essential *absolutely*, without context, it's meaningless."
  *   **Merely Compliant Answer:** Vague standpoint references or repeats the original claim with "syāt" tacked on without meaningful qualification. Example: "Syāt, it is essential for some people." "Syāt, it is not essential for others." (Doesn't define *which* standpoints).

  **What to Leave Out (Explicitly Declare - 1 min, woven in):**
  *   **"We don't have time for the deep historical context of Jainism (asceticism, Tirthankaras, karma theory). Focus today is purely on this epistemological tool."**
  *   **"We're simplifying the sevenfold scheme; the full version has nuances about successive vs. simultaneous assertion/denial we're skipping."**
  *   **"We won't delve into the rigorous Jain metaphysical categories (dravya, guṇa, paryāya) that underpin this view. We're staying at the level of everyday description."**
  *   **Why Declare?** Shows intentionality, prevents "what about...?" tangents, models intellectual discipline, and ironically demonstrates anekāntavāda – you're admitting the *limits* of *this specific session's standpoint*.

  **Why this order works:**
  1.  **Problem First:** Creates need (Hot Dog Debate).
  2.  **Core Concept (Naya):** Provides the framework to solve the problem (Standpoints explain *why* claims conflict).
  3.  **Tool (Syādvāda):** Provides the method to *use* the framework responsibly (The 7 modes give precise language).
  4.  **Preemptive Defense:** Blocks major misinterpretations *before* they derail discussion.
  5.  **Illustration (Repaired Elephant):** Reinforces concepts after the groundwork is laid.
  6.  **Application (Check):** Tests synthesis and guards against superficial understanding.
  7.  **Limits Declared:** Maintains focus and models the doctrine itself.

  **Critical Failure Modes if Sequence Wrong:**
  *   **Start with Syādvāda:** Feels like bizarre, arbitrary logic games. "Why would I *ever* talk like this?"
  *   **Start with Elephant:** Easily misleads into thinking there's a privileged view (if unrepaired) or is just a cute story without philosophical teeth.
  *   **Delay Misconception Handling:** Discussion gets bogged down in "So it's just relativism?" or "This is nonsense because..." and never recovers.
  *   **Omit Problem:** Doctrine lacks motivation, feels like trivia.

  This sequence builds the doctrine as a necessary and practical response to a felt intellectual problem, minimizes key misunderstandings, and provides a clear check for comprehension within tight constraints. Good luck!
