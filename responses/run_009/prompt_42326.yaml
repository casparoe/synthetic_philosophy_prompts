  Hey, I'm taking an upper-level decision theory seminar this semester and we just wrapped up the unit on money pump arguments for acyclicity and the expected utility axioms — some Gustafsson, older setups in the Davidson-McKinsey-Suppes-Siegel style, plus McClennen on resolute vs. sophisticated choice. For the final paper I basically get to set my own agenda within diachronic rationality, and my professor wants us to argue for which questions in the area actually matter rather than survey them. The problem is I genuinely can't tell which open threads are load-bearing. Like, obviously there's the question of whether the money pump arguement begs the question by assuming the agent keeps accepting each trade when refusing is available, and whether resolute choice is a real way out or just relocates the intransitivity into an earlier self's commitments. But then there's other stuff: do these arguments at most establish *conditional* norms ("if you're going to be dynamically naive, don't be cyclic") rather than categorical requirements on preferences themselves? And a friend in my seminar claims money pumps are only a problem if someone is actually around to exploit you, so in a world with no predatory traders cyclicity would be basically costless — I suspect that's wrong somehow (maybe the argument only needs a *possible* exploiter, or the pump reveals the irrationality regardless of anyone running it), but I can't articulate why convincingly.

