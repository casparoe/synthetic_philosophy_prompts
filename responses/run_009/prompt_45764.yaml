  Third, the simplest explanation: irrationality or enjoyment. The user compares voting to eating ice cream—no paradox there. But voting is framed as a paradox because rational choice theory assumes instrumental rationality. If people vote for intrinsic reasons, it's not irrational; it's just expanding the utility function. However, this might stretch rational choice to cover any behavior, making it tautological. The paradox exists only if we stick to a narrow view of rationality. Maybe the user is frustrated with rational choice theory's limitations and prefers behavioral explanations. They might be hinting that the paradox is a non-issue if we accept other motivations.

