prompt: |-
  Is there a proper name for this? I'm in a couple of online communities — one is a parenting forum that's very into a particular sleep-training philosophy, the other is a neighbourhood group fighting a specific local development. In both I've noticed the same thing and I want to know whether the people who study this stuff have a word for it.

  Here's the thing: neither group avoids the other side's arguments. Everyone can recite them. The forum has a sticky post titled "what they say and why they're wrong," and in the neighbourhood group people do live reenactments of arguments with the developers' consultants, doing the voices. So it's not like nobody has heard the objections. But the versions we've all learned are slightly off — the other side's case as we know it is a bit stupider and a bit meaner than the case they actually make.

  That's the setup. The part I'm really asking about is what happens when a genuine outsider shows up — a parent who sleep-trained and it went fine, or an actual consultant. What they say never matches the script, so it gets rounded to the nearest line in the script, and answered with the rehearsed rebuttal for that line. If they protest that's not their argument at all, the protest is also in the script, as a move ("they always deny it first"). So real people arrive and get processed as performances of characters we already know. And wierdly the group isn't hostile to outside sources as such — members will cheerfully admit the other side has some points — it's just that the only other side any of us has ever met is our own impression of them. You can't fix it by exposure either, because exposure is what got us here.

  My friends just call this an echo chamber, but at this point that word covers everything from "my feed agrees with me" to "society," so I want something more precise. Specifically this configuration: the other side's arguments ARE encountered, but only ever in our own reenactment of them, so the encounter feels like engagement while never once being one. If the literature has an established term, tell me what it is, and how it differs from the nearby things I can think of — an echo chamber proper, a straw man (the script isn't really a straw man, it's more like a slightly degraded copy nobody believes they misread), or just being well-informed about your opponents. If there's no established term, say that plainly and propose one, with a definition that marks the edges: for example, does the phenomenon require the group to believe outsiders are lying or shilling? Mine mostly doesn't, which is exactly why I'm unsure it counts as an echo chamber at all. I'm not after a label to drop at parties — I want to know what the thing is and isn't.

  Whatever you conclude, end with the following line, in exactly this form and with nothing after it:

  Verdict: [one short phrase — either the established term, or "no established name — proposed: X"]
reasoning: |-
  Okay, let me tackle this user's query. They're describing a specific dynamic in online communities where groups are familiar with opposing arguments but only through their own distorted versions. The key points are: both groups have rehearsed rebuttals to what they think the other side says, and when real outsiders show up, their actual arguments get forced into the group's pre-existing script. The user wants to know if there's a precise term for this phenomenon.

  First, I need to recall if there's an established term. Echo chamber is mentioned, but the user feels it's too broad. Straw man fallacy comes to mind, but that's usually a deliberate misrepresentation. Here, the group isn't intentionally distorting; they genuinely believe their version is accurate. It's more like a collective bias where exposure hasn't corrected misconceptions but reinforced their own narratives.

  The concept of the "hermeneutic filter" from epistemology might fit. It refers to how pre-existing frameworks shape the interpretation of new information. In this case, the group's shared narrative acts as that filter, processing real interactions through their constructed scripts. 

  Another angle is the "out-group homogeneity effect," where outsiders are seen as monolithic. The user's groups create simplified characters for the opposition. When a real person speaks, their arguments are assimilated into these characters, preventing genuine engagement. 

  Also, consider "preemptive neutralization" or "stereotype embodiment." The group rehearses responses to caricatures, making real encounters non-threatening because they're treated as performances. This isn't about hostility but about maintaining the group's coherence. 

  The user's groups don't think outsiders are lying, which rules out some echo chamber definitions. They acknowledge other viewpoints but only through their distorted lens. This is key. The difference from an echo chamber is that opposing views are engaged with, but in a prefabricated way. 

  Since no single term perfectly matches, proposing a new one makes sense. "Rehearsed Reality" captures the scripted interactions. "Hermeneutic Capture" emphasizes the interpretive trap. Or "Caricature Assimilation" for how real people are molded into existing caricatures. 

  I need to ensure the proposed term is concise and reflects the core mechanism. "Reality-As-Performance" highlights the theatrical aspect the user mentioned, like the live reenactments. It fits because the group treats real interactions as scripted performances, not genuine dialogue. 

  Finally, verifying that existing literature doesn't have a better term. Confirmation bias and group polarization are related but not exact. The specific combination of knowing opposing arguments yet distorting them through group narrative seems unique. Thus, no established name, and proposing "Reality-As-Performance" with a clear definition.
answer: |-
  Based on your detailed description, here's the analysis and verdict:

  1.  **Not precisely an "Echo Chamber":** Classic echo chambers actively *avoid* or suppress opposing views. Your groups *engage* with opposing arguments, albeit through their own distorted lens. Exposure occurs, but it's filtered.
  2.  **More than just "Straw Man":** While the distorted versions resemble straw men, the key difference is the *systematic, communal* nature. The group doesn't *just* misrepresent the opposition; they collectively *embody* and *perform* the caricature, creating a shared "script" for interaction. It's a *socially constructed and maintained* distortion.
  3.  **Beyond "Out-Group Homogeneity":** This cognitive bias (seeing outsiders as all alike) is part of it, but your phenomenon adds the crucial elements of *active performance*, *scripting of encounters*, and the *rounding* of genuine arguments to fit the pre-existing template.
  4.  **Related Concept - "Hermeneutic Filter" (Epistemology):** This describes how pre-existing interpretive frameworks shape understanding. Your groups have a powerful shared hermeneutic filter through which *all* opposition is interpreted, ensuring it always fits the pre-formed narrative.
  5.  **The Core Mechanism:** You've described a **self-reinforcing cycle of performative engagement**. The group possesses a **communal script** defining the opposition's arguments, motives, and even their denials. Real interactions are not evaluated on their merits but **processed as performances** of the expected script. Genuine deviation is dismissed or assimilated ("rounded") because the *script defines reality* for the group. Exposure reinforces the script, not challenges it.

  **Established Term?** There isn't a single, universally established term that perfectly captures this *specific configuration* of communal scripting, performative engagement, and reality-distorting processing of genuine encounters within an otherwise seemingly engaged group.

  **Proposed Term:** **Reality-as-Performance (RaP)**

  *   **Definition:** A group dynamic where opposition arguments are known through a communally constructed and maintained script or caricature. Genuine encounters with outsiders are not engaged with directly but are interpreted and processed *as performances* of this pre-existing script. Arguments are "rounded" to fit the nearest scripted line, responses are rehearsed rebuttals, and deviations (like protests) are treated as predictable moves *within* the scripted performance, preventing authentic engagement and reinforcing the distorted narrative. Hostility isn't necessary; the defining feature is the replacement of direct interpretation with scripted performance.
  *   **Edges/Markers:**
      *   Requires a **communal script** defining the opposition's arguments/motives/responses.
      *   Involves **active performance** (reenactments, rehearsed rebuttals).
      *   Features **"rounding"** of genuine arguments to fit the script.
      *   Treats **protests/denials** as *expected scripted moves*, not genuine communication.
      *   **Not defined by hostility or avoidance:** The group may acknowledge the *existence* of other views but only engages with their own *representation* of them.
      *   **Exposure reinforces the script:** Unlike echo chambers where exposure is lacking, here exposure is processed *through* the script, strengthening it.
      *   **Differs from:** Simple misinformation (the script is *about* the opposition, not general facts), pure confirmation bias (more active and performative), standard straw man (communal, performative, systemic).

  **Verdict:** no established name — proposed: Reality-as-Performance (RaP)
