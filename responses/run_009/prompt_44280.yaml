prompt: |-
  Just got back from a three-hour argument with my flatmate about where the mind actually stops (the pub closed around us, it got heated). She's deep into the extended mind stuff from Clark and Chalmers, the Otto and Inga thing. Anyway, we ended up going through a stack of cases and I wrote down her verdicts as we went, and now I want to know whether her position hangs together or whether she's just vibing. Her record:

  - Otto and his notebook: part of his mind, full stop.
  - Inga's ordinary biological memory: mind, obviously.
  - A healthy person who keeps notes in a phone app, checks it constantly but also double-checks it against other stuff and sometimes thinks, hang on, is that right?: NOT part of her mind.
  - Someone playing Tetris who rotates the piece by hitting a button rather than doing it in their head: the button-pressing isn't cognition, it's just an action.
  - A blind person's cane: yes, part of their perceptual apparatus.
  - A navigation team on a ship running everything through a shared paper checklist: the checklist is nobody's mind. It belongs to the team or the system or whatever, but it's not part of any individual person's mind.

  Then the two cases we never settled:

  (a) A woman with face blindness who keeps a spreadsheet of her colleagues' distinguishing features (the mole, the haircut, the terrible laugh), updates it religously, and completely trusts it — but she reviews it the night before at home, because she can't exactly check her phone mid-conversation without being rude. Is the spreadsheet part of her mind?

  (b) A songwriter who swears the songs live in her hands and that one specific piano together, and genuinely can't compose anywhere else. The piano is dedicated to the job, she trusts it utterly, but the actual composing through it is slow and effortful. Is the piano part of her mind?

  So: what will my flatmate say on (a) and (b), and what should she say if she wants to stay consistent with her own record? What rule is she actually running — something like trust-plus-accessibility, or a fluency criterion where it only counts if it's seamlessly integrated, or something about dedicatedness to a single job? Are there other rules that fit her track record just as well but come apart on (a) and (b)? And what further case should I spring on her next time to actually separate the candidate rules — I was thinking something internal but effortful, like a mnemonic she has to consciously grind through in her own head, since that would tell us whether it's fluency doing the work or just location. I'd like to be armed this time.
reasoning: |-
  Okay, I see the user has had this intense three-hour debate with their flatmate about where the mind stops, based on Clark and Chalmers' extended mind theory. The flatmate has specific verdicts on different cases, and now the user wants to figure out if those positions are consistent. They've listed several examples where the flatmate decided whether something was part of the mind or not, and there are two unresolved cases: one about a face-blind woman with a spreadsheet, and another about a songwriter and her piano. The user also wants to know what rule the flatmate is implicitly using and what test case to use next to clarify things.

  First, I need to recall Clark and Chalmers' extended mind thesis. They argue that external objects can be part of cognitive processes if they meet certain criteria: constant availability, automatic endorsement, past endorsement, and easy accessibility. For example, Otto's notebook is treated as part of his mind because he always has it, trusts it implicitly, and relies on it like biological memory.

  Looking at the flatmate's record: She agrees with Otto's notebook being part of his mind and Inga's memory obviously being mind. But she rejects the phone app case because the person double-checks and doubts it, so trust isn't absolute. For Tetris, she says button-pressing is an action, not cognition, which aligns with the idea that just using a tool doesn't make it cognitive. The blind person's cane is part of perceptual apparatus, fitting the extension of sensory processes. The ship's checklist isn't part of any individual's mind but a team system, which makes sense as it's shared and not individually owned.

  Now, for the unresolved cases. Case (a): The woman with face blindness uses a spreadsheet, updates it religiously, trusts it completely, but reviews it at home, not in real-time during conversations. Is this part of her mind? Based on the flatmate's past decisions, trust seems key. The spreadsheet is trusted, but it's not accessible in the moment when needed. That might be why she'd say it's not part of her mind, similar to the phone app where accessibility was an issue even though it was checked constantly. The flatmate emphasized constant accessibility in Otto's case, so if the spreadsheet isn't accessible mid-conversation, it might not count.

  Case (b): The songwriter and her piano. She trusts it utterly, it's dedicated to composing, but the process is slow and effortful. The flatmate rejected the Tetris button as not cognition because it was just an action, but here the piano is integral to the creative process. However, since it's effortful, not fluent, the flatmate might see it as a tool rather than an extension. Trust is there, but fluency might be lacking. She might lean towards not part of the mind because it's not seamless.

  The user is asking what rule the flatmate is using. From the cases, it seems like a combination of trust and constant accessibility. For Otto and the cane, both are trusted and accessible when needed. The phone app isn't fully trusted due to double-checking, and the spreadsheet isn't accessible in real-time. The Tetris button isn't cognition, just action, so it's about whether the tool is integral to the cognitive process. The ship checklist is shared, not individual. So perhaps the rule is: something is part of the mind if it's trusted, constantly accessible, and functions automatically as part of cognition.

  To stay consistent, for (a), the flatmate should say no because it's not accessible in real-time. For (b), she might say no because it's effortful, not fluent. But the user wants to test fluency versus location. A good test case would be an internal mnemonic that's effortful. If the flatmate considers that part of the mind, then fluency isn't the key; it's about being internal. But if she excludes it, then fluency is crucial. For example, consciously using a memory technique like a method of loci where you have to mentally walk through a palace—effortful but internal. If she says it's part of the mind, then location matters more than fluency. If not, then seamless integration is key.

  Other possible rules could be based on dedicatedness or functional role. But in the phone app case, it's dedicated but not trusted, so trust seems essential. The Tetris button is dedicated but just an action. So trust and accessibility are central.

  So, predicting the flatmate: For (a), she'll likely say not part of the mind due to lack of real-time access. For (b), not part because it's effortful. To be consistent, she should say no to both based on her past verdicts. The rule is trust plus constant accessibility and automatic use.

  For the test case, the internal effortful mnemonic is perfect. If she includes it as mind, then location is key; if not, fluency is the criterion. That will help clarify her underlying principles.
answer: |-
  Based on your flatmate's pattern of verdicts, she's implicitly applying a **trust + constant, automatic accessibility + functional fluency** rule for whether something counts as "part of the mind" under the extended mind thesis. Her position emphasizes the *seamlessness and automaticity* of the coupling between the biological agent and the external resource. Let's break it down:

  ### Your Flatmate's Likely Verdicts on (a) and (b)
  1.  **(a) The Face-Blind Woman's Spreadsheet:**  
      **What she'll say:** **NOT part of her mind.**  
      **Why:** The spreadsheet isn't accessible *in real-time during the cognitive task* (recognizing faces mid-conversation). She reviews it proactively ("the night before"), making it more like a studied reference than an *extension* of her working memory. It's functionally similar to memorizing facts from a textbook—trusted and vital, but not *integrated* into the moment-to-moment cognitive process. This echoes her rejection of the phone app case (where double-checking breaks automaticity) and contrasts with Otto's notebook (accessed *as needed*, like biological memory).

  2.  **(b) The Songwriter's Piano:**  
      **What she'll say:** **NOT part of her mind.**  
      **Why:** The composing process is described as "slow and effortful," lacking the automaticity she values. The piano is trusted and dedicated, but it doesn't function *fluently* as part of cognition. Instead, it's a tool she *deliberately manipulates* to generate ideas. This aligns with her Tetris verdict: pressing a button to rotate a piece is an *action* enabling cognition but isn't cognition itself. The piano is likely seen similarly—an "effortful" tool for externalizing thought, not an extended part of her mind.

  ### What She *Should* Say to Stay Consistent
  Her prior verdicts demand **real-time, automatic coupling**:
  -   **For (a): NOT part of the mind.** Consistency requires rejecting it because accessibility isn't constant *during the task it supports*. Otto's notebook is accessed *while* navigating; the cane is used *while* perceiving. The spreadsheet is consulted *beforehand*, breaking the "online" cognitive loop.
  -   **For (b): NOT part of the mind.** The "slow and effortful" use violates the fluency criterion. Compare to the blind person's cane, which is wielded automatically and provides real-time perceptual feedback. The piano requires conscious effort, making it more like the Tetris button—an input device, not cognitive extension.

  ### The Implicit Rule: "Trust + Automatic Accessibility + Fluency"
  Her decisions hinge on **three jointly necessary conditions**:
  1.  **Absolute trust:** The resource must be relied upon automatically without verification (Otto’s notebook ✅; phone app ❌).
  2.  **Constant, task-relevant accessibility:** Available *during* the cognitive act it supports (cane ✅; spreadsheet ❌; ship checklist ❌—not individual).
  3.  **Functional fluency:** The resource must be so seamlessly integrated that its use feels automatic and effortless, like biological cognition (Otto’s notebook/cane ✅; Tetris button/piano ❌—both effortful actions).

  *Key nuance:* She seems stricter than Clark and Chalmers. They might accept the spreadsheet (as a "standing belief") or piano (as "cognitive scaffolding"), but your flatmate demands *immediate, fluent* coupling.

  ### Alternative Rules That *Almost* Fit (But Fail on Key Cases)
  1.  **"Dedicatedness to a single job"**:  
      Fits Otto (addresses), cane (sensing), piano (composing).  
      **Fails:** Rejected phone app (dedicated to memory) and Tetris button (dedicated to rotation). Trust/fluency matter more.
  2.  **"Individual ownership"**:  
      Fits ship checklist rejection (shared).  
      **Fails:** Doesn't explain phone app (individually owned but rejected) or Tetris (individually used but rejected).
  3.  **"Location inside/outside the head"**:  
      Fits Inga (inside) vs. Otto (outside).  
      **Fails:** Blind person's cane (outside but accepted)—so she clearly *does* accept external extensions.

  ### Your Test Case: Internal but Effortful Cognition
  **Propose this:**  
  *"A chess player who uses a laborious, conscious mnemonic to calculate moves (e.g., 'If I move my knight here, then king safety = 2, pawn structure = -1...'). It's entirely in her head, she trusts it, but it's slow and requires deliberate step-by-step effort—unlike her intuitive pattern recognition for simpler positions."*

  **Why this separates rules:**
  -   If she says **YES (part of mind)**, she prioritizes **location (internal)** over fluency. This would *invalidate* her Tetris/piano rejections (which were external but effortful) and suggest inconsistency.
  -   If she says **NO (not part of mind)**, she prioritizes **fluency (automaticity)** over location. This *confirms* her rule: effortful processes (even internal ones) aren't "cognition proper" under her view. It would align with rejecting the phone app and piano.

  **Outcome prediction:** She’ll likely say **NO**—it's not fluent. This reinforces her fluency criterion and exposes her view as more about *cognitive phenomenology* (how thinking *feels*) than functional equivalence.

  ### Next Step: Arm Yourself for Round Two
  1.  **Challenge the fluency criterion:** Point out that even *biological* cognition can be effortful (e.g., solving complex math). If only "automatic" processes count, much of human reasoning is excluded. Ask: "Is my *conscious* working memory not part of my mind?"
  2.  **Press on accessibility:** For the spreadsheet, ask: "If she *could* check it mid-conversation (e.g., via AR glasses), would it *then* be part of her mind?" This tests if accessibility is the true barrier.
  3.  **Invoke Clark/Chalmers' parity principle:** "If the spreadsheet acts *like* Inga's memory (trusted, reliable, used for recall), why treat it differently just because access isn't instantaneous? Isn't that anthropocentrism?"
  4.  **Bring beer.** It’s the only proven lubricant for extended mind debates.

  Her position *is* coherent—but it's a high-bar, "hyper-fluent" interpretation of extended mind theory. To poke holes, force her to confront cases where internal cognition is effortful or external resources are trusted but situationally inaccessible. Good luck! 🍻
