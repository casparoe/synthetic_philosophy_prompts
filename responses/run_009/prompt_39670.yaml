  ## The Case for Actuarial Measurement: Violence Reduction as Individual Safety

  The dispute over whether a world with a quadrupled population and halved per-capita violent death rate (but doubled absolute deaths) is "less violent" hinges on what constitutes the genuine reduction of violence. I argue that the actuarial view – focusing on the risk faced by a randomly chosen individual – provides the correct measure, reflecting the core experiential reality of violence. However, this correctness stems from a substantive moral commitment to the individual as the primary locus of harm and value, not a neutral statistical convention. Crucially, this commitment establishes a fact of the matter: *within this moral framework*, the later world is objectively less violent.

  **Why the Actuarial View Reflects Genuine Violence Reduction:**

  1.  **Violence is Experienced by Individuals:** Violence happens *to* persons. The fundamental harm – the death, injury, trauma – is inflicted upon an individual life. When we ask if the world is "less violent," we are fundamentally asking if an individual living in that world faces a *lower risk* of suffering violent harm. The halved per-capita rate directly answers this question: a person chosen at random in the later world has objectively better odds of avoiding a violent death than someone in the earlier world. This captures the lived reality of safety.
  2.  **Focus on Probability, Not Scale:** Violence is not a monolithic entity measured solely by its gross output. It is a *risk* distributed across the population. Reducing this risk per person signifies a genuine improvement in the human condition regarding violence. A world where the *chance* of being struck by lightning halves, even if more people live under stormy skies, is objectively safer *for the individual*. Similarly, halving the per-capita violent death rate means the environment is less lethal per person. The absolute number reflects the *scope* of the problem, not the *intensity of the risk* each person faces.
  3.  **Meaningful Progress:** If we reject the per-capita measure, we face the absurd conclusion that safety improvements (lower risk per person) can be completely negated or reversed simply by population growth. This makes the concept of "reducing violence" meaningless in a growing world – a conclusion at odds with the lived experience of individuals who *are* demonstrably safer. The actuarial view allows us to meaningfully track whether efforts to protect individuals are succeeding.

  **Addressing Objections:**

  1.  **Objection: Per-Capita Presupposes Individualism:** This is correct, but it is a justified presupposition. The objection highlights the core of the dispute: it *is* a substantive evaluative commitment. We *should* prioritize the individual prospect because the moral significance of violence resides in its impact on individual lives, consciousnesses, and futures. An aggregate statistic (total deaths) abstracts away from this fundamental unit of suffering. The actuarial view makes explicit this commitment: the moral concern is for *each person's* vulnerability to harm. This commitment isn't hidden; it's the very reason the per-capita measure is morally salient. Prioritizing the aggregate can implicitly value lives less in larger populations, diluting the moral weight of each individual's risk.
  2.  **Objection: Absolute Counts and Whole Victims:** Each death *is* an absolute tragedy, and doubling the annual toll represents double the raw suffering and loss. This fact is undeniable and morally significant. **However, it does not make the world *more violent* in the sense of posing a *greater threat to each person living in it*.** The objection conflates two distinct moral concerns:
      *   **The risk faced by individuals (actuarial):** Reduced.
      *   **The aggregate suffering caused by the system (epidemic):** Increased.
      While the doubled toll is a larger *problem* demanding attention due to its scale, it does not mean each inhabitant faces a more dangerous world. We can (and should) mourn the increased absolute loss *while simultaneously acknowledging* that the average person's life is objectively less endangered by violence. The "denominator" (population) isn't offsetting the deaths; it's contextualizing the risk. Claiming the increased absolute toll makes the world "more violent" ignores the crucial fact that the *density* or *concentration* of that violence across the population has decreased.

  **The Fact of the Matter within a Value Framework:**

  The dispute doesn't dissolve into a mere choice of measure because the choice of denominator is driven by a prior, substantive question: **"What aspect of violence are we fundamentally trying to assess when we ask if the world is 'less violent'?"**

  *   If our primary concern is **"Is the average person safer from violent harm?"** (a question centered on individual experience and risk), then the per-capita rate provides the objective fact of the matter. Within this evaluative frame, the later world *is factually and unambiguously* less violent. The halved rate is the direct, objective answer.
  *   If our primary concern is **"Is the total amount of suffering caused by violence increasing?"** (a question centered on aggregate impact), then the absolute death toll provides the objective fact of the matter. The doubled toll means the aggregate suffering is greater.

  The "fact of the matter" about the violence *trend* consists in the objective measurement *relative to the chosen evaluative framework*. Once we commit to the framework that defines violence reduction as a decrease in the *probability of harm facing individuals* (the actuarial view), the statistical fact – the halved per-capita rate – provides the objective verdict: violence, understood as a risk to the person, has decreased. This verdict is not arbitrary; it follows logically and objectively from the conjunction of the moral commitment to the individual as the locus of harm and the empirical data. The dispute is resolvable by clarifying the underlying value question ("Safety for whom?"), and within each clarified frame, there is a clear factual answer.
