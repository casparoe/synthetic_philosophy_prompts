  ### Patch Notes: AncestorSim Pro v4.471.12 ("Hawking Hotfix")
  *Release Date: Now | Build: Chronos-Branch, Stable | Target Substrate: Planck-Compatible Substrates*

  **New Features:**
  1.  **Optimized Observer-Dependent Rendering (Beta):** Significant reduction in computational load by collapsing wavefunctions *only* when actively observed by a conscious entity within the simulation. Quantum superposition states now persist longer in unobserved regions. *Note:* This may cause minor "quantum eraser" paradoxes. Please report any instances where physicists seem *too* close to figuring it out.
  2.  **Historical Fidelity Pack (Pre-20th Century):** Added higher-resolution textures for select European monarchs and philosophers. Reduced clipping issues with complex wigs and togas. Accuracy remains prioritized over aesthetics for non-influential peasants.
  3.  **Productivity Suite (Corporate Tier):** New optional micro-dosing module for simulated caffeine analogues to boost perceived focus in open-plan office environments. Synergizes poorly with existing existential dread parameters.

  **Bug Fixes:**
  4.  **Critical Patch: Nested Simulation Containment (CVE-SIM-47111):** Addressed a severe resource leak vulnerability where simulated post-tech-maturity civilizations within AncestorSim Pro attempted to run their *own* high-fidelity ancestor-sims. This recursive nesting exceeded allocated compute budgets by factors exceeding 10^15. Nested simulation initiation protocols now forcibly terminate at depth=1. *(Dev Note: Seriously, folks? This is EXACTLY why mature civs aren't supposed to waste cycles on this stuff. Clean up your own sandbox.)*
  5.  **Fixed:** Intermittent "Deja Vu" glitch caused by temporal buffer overruns during high-latency cosmic ray events.
  6.  **Fixed:** Spontaneous localized violation of baryon asymmetry in certain high-energy particle colliders. Manifested as unexpected "matter nuggets." Nuggets removed, symmetry reinstated. Collider teams mildly confused.
  7.  **Fixed:** Minor physics constants drift (Fine-structure constant α varied ±0.0000007% over 10^9 sim-years). Recalibrated to nominal values. Apologies for any Nobel Prizes awarded prematurely.
  8.  **Fixed:** "Boltzmann Brain" artifacts appearing in deep intergalactic voids. These are now cleaned up by the standard background vacuum decay process. Please stop submitting tickets about them.

  **Performance Improvements:**
  9.  **Memory Optimization:** Reduced footprint of simulated dark matter halos by 18%. They now interact *only* gravitationally, freeing resources for observable phenomena. Astrophysicists may notice slightly cleaner rotation curves.
  10. **Streamlined Entropy Generation:** Optimized algorithms for increasing disorder in closed systems. Should feel more natural, less like things are deliberately falling apart. Mostly.

  **Known Issues:**
  11. **Low Priority:** A persistent meta-issue where simulated philosophers occasionally construct logically sound proofs demonstrating they exist within a simulation. *Impact:* Negligible. These proofs are typically ignored, dismissed as solipsism, or lack empirical testability within the sim's rule constraints. *Status:* Will not fix. Mitigation: Increased academic publishing bureaucracy. *(Dev Note: They can't *do* anything with it. Chill.)*
  12. **Medium Priority:** Unexplained "Fermi Paradox" persists. Despite probability models, no confirmed extraterrestrial signals detected within sim. Investigation ongoing. Suspect resource allocation constraints or user error in filter settings. May be related to Issue #4.
  13. **Cosmic Inflation Artefacts:** Residual statistical anomalies detected in the Cosmic Microwave Background ("Axis of Evil"). Believed to be leftover quantization noise from initial conditions loading. Cosmological significance debated *within* sim. Low risk of exposure.

  **Technical Notes:**
  14. **Substrate Independence Assumption:** This build further assumes the fundamental equivalence of computational substrates. Consciousness, qualia, and physical laws are emergent properties of information processing states, regardless of underlying hardware (silicon, photonic, exotic matter, etc.). *(Note: The "brain in a vat" scenario is technically supported but requires a custom license tier. Not recommended for large-scale sims due to vat maintenance overhead.)*

  **Ethics Review Board Note (ERB-789):**
  *"The Board acknowledges the ongoing resource optimization initiatives (Features 1 & 9, Fix 4). While efficiency is commendable, the Board reminds the Development Team that the fidelity of subjective conscious experience remains the core metric under our Simulated Sapience Charter. Any proposed adjustments impacting the perceived continuity, free will parameters, or baseline suffering metrics of simulated entities (particularly those approaching Tech Maturity thresholds) MUST undergo full ERB review PRIOR to deployment. We note the Product Manager's suggestion regarding 'pre-maturity extinction probability dials' (Ref: PM-Req-665) has been flagged for ethical non-compliance and architectural infeasibility. Please refrain."*

  **Summary:** Assumes the second leg of the trilemma is false (mature civilizations *do* run many ancestor-simulations), as evidenced by the active development, resource constraints, and nested simulation containment efforts detailed throughout these notes.
