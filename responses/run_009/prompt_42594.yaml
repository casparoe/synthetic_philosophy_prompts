  ### **Dispositions Game: The Conditional-Analysis Challenge**

  #### **Game Design: "The Mystery Object Lab"**
  **Objective:** Testers must deduce objects' hidden dispositions through experiments, while interferers manipulate outcomes to create finks, masks, and false positives. The game runs in two rounds to contrast naive testing (Round 1) vs. interfered testing (Round 2).

  **Time Allocation:**
  - Setup: 5 min  
  - Round 1 (Baseline): 15 min  
  - Round 2 (Interference): 25 min  
  - Scoring & Transition: 10 min  
  - Debrief: 35 min  
  **Total:** 90 min  

  ---

  ### **Roles & Materials**
  1. **Objects (4 students):**  
     - Each holds a **secret disposition card** (printed beforehand):  
       - `Fragile` (breaks when struck).  
       - `Soluble` (dissolves when soaked).  
       - `Flammable` (ignites when heated).  
       - `Null` (no dispositions).  
     - *Example Objects:* Glass (Fragile), Sugar Cube (Soluble), Dry Twig (Flammable), Rock (Null).  

  2. **Testers (6 students):**  
     - Goal: Correctly identify all objects' dispositions.  
     - Tools: **Test tokens** (5 tokens each; 1 token = 1 test). Tests cost tokens to limit spamming.  
     - Tests:  
       - **Strike** (tests fragility).  
       - **Soak** (tests solubility).  
       - **Heat** (tests flammability).  

  3. **Interferers (4 students):**  
     - Each holds a **secret interference card** (assigned in Round 2):  
       - `Guardian` (Fink): Protects fragile objects when struck (e.g., shields glass; it *never breaks*).  
       - `Styrofoam Packer` (Mask): Wraps *any* object when struck (e.g., packs in foam; *nothing breaks*).  
       - `Saboteur` (False Positive): Breaks *non-fragile* objects when struck (e.g., smashes rocks; they *always break*).  
       - `Waterproof Coater` (Antidote): Coats objects when soaked (e.g., wax on sugar; soluble things *never dissolve*).  
     - **Key:** Interferers only act during their assigned test (e.g., Guardian only during Strike).  

  ---

  ### **Game Rules & Structure**
  **Setup (5 min):**  
  - Assign roles (4 Objects, 4 Interferers, 6 Testers).  
  - Objects draw disposition cards (keep secret).  
  - Give Testers 5 tokens each. Interferers sit out in Round 1.  

  **Round 1: Baseline Testing (15 min)**  
  - **Goal:** Testers learn how dispositions *should* work without interference.  
  - **Procedure:**  
    1. Testers spend tokens to request tests (e.g., "Strike the Glass").  
    2. Teacher (you) announces outcomes based *only* on dispositions:  
       - Fragile object struck? → Breaks.  
       - Soluble object soaked? → Dissolves.  
       - *No interferers active.*  
    3. After 10 min, Testers submit guesses for all objects' dispositions.  
  - **Scoring:** Testers earn **1 point per correct guess**.  

  **Round 2: Interference Chaos (25 min)**  
  - **Goal:** Testers face finks, masks, and false positives.  
  - **Changes:**  
    - Assign each Interferer an interference card (keep secret).  
    - Testers get 5 new tokens.  
  - **Procedure:**  
    1. Testers request tests (as in Round 1).  
    2. When a test occurs:  
       - Teacher checks if an Interferer is assigned to that test type (e.g., Strike → Guardian/Styrofoam/Saboteur).  
       - **Interferer secretly declares action** (e.g., Guardian: "Protect the glass!").  
       - Teacher announces **manipulated outcome** (e.g., glass struck but shielded → *doesn’t break*).  
    3. After 15 min, Testers submit guesses.  
  - **Scoring:**  
    - **Testers:** 1 point per correct guess.  
    - **Interferers:** 2 points per test they successfully manipulated + 3 points if Testers guess *their* object’s disposition *wrong*.  

  ---

  ### **Predicted Problems & Fixes**
  1. **Loophole Lawyers:**  
     - *Risk:* Testers spam tests on one object ("I’ll strike the rock 5 times!").  
     - **Fix:** Tokens are per-tester (not per-object). Each test costs 1 token, limiting total tests (max 30 tests/round).  

  2. **Chaotic Testing:**  
     - *Risk:* Testers shout over each other.  
     - **Fix:** Use a "test queue." Testers write requests on slips; you resolve 3–4 at once to keep pace.  

  3. **Interferer Confusion:**  
     - *Risk:* Interferers act on wrong tests (e.g., Waterproof Coater interfering with Heat).  
     - **Fix:** Cards specify allowed tests (e.g., "Only during Soak").  

  4. **Scoring Delays:**  
     - *Risk:* Manual tallying eats time.  
     - **Fix:** Use pre-printed scorecards. Assign a student to tally while you debrief.  

  ---

  ### **Debrief (35 min): Map Game → Metaphysics**
  **Start with Student Reflections (10 min):**  
  - "What surprised you in Round 2?"  
  - "Why did you misidentify Object X?"  

  **Connect Mechanics to Theory (15 min):**  
  | **Game Case**         | **Metaphysics Concept**          | **Conditional Analysis Failure**                          |  
  |------------------------|----------------------------------|----------------------------------------------------------|  
  | Guardian (glass never breaks)   | **Fink**                         | Disposition vanishes *during test* → Breaks "if struck, *then* breaks." |  
  | Styrofoam (nothing breaks)    | **Mask**                         | Disposition exists but is suppressed → Breaks "intrinsic fragility" claim. |  
  | Saboteur (rock always breaks) | **False Positive**               | Non-disposition mimics disposition → Breaks "only if fragile" necessity. |  
  | Waterproof (sugar never dissolves) | **Antidote**                   | Prevents manifestation → Challenges stimulus-response link. |  

  **Address Game Limitations (10 min):**  
  - **What the Game *Can’t* Show:**  
    - **Intrinsicness Debate:** Game dispositions are "labels," not intrinsic properties. *Supplement:* Discuss Martin’s finkish disposition argument (does the glass *lose* fragility when finked?).  
    - **Time-Sensitivity:** Real finks/masks can be temporary. *Supplement:* Use Lewis’ "finkish fragility" thought experiment.  
    - **Multi-Dispositions:** Objects had one disposition; real things have many. *Supplement:* Bird’s antidote example (vitamin C masks fragility?).  

  **Closing Challenge (5 min):**  
  - "If conditional analysis fails, what *is* a disposition? (Hint: Check next week’s reading on pandispositionalism!)."  

  ---

  ### **Why This Works**
  - **Experiential Learning:** Students *feel* the frustration of falsified conditionals.  
  - **Low Prep:** Only need printed cards and tokens (paper clips as tokens work).  
  - **Debrief Flexibility:** Focus on concepts that emerged (e.g., if masks dominated, dive into Bird).  
  - **Loopholes Closed:** Token limits, role-specific rules, and secret interference prevent gaming.  

  **Final Tip:** Run Round 1 fast to maximize Round 2 chaos. The "aha!" moment comes when Testers rage, "But the glass *should* have broken!"—then you reveal the Guardian.
