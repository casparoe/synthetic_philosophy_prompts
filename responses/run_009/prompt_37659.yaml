  First, I need to recall the basic principles of welfare economics. The cost-benefit analysis relies on revealed preference theory, where individual choices are the best indicator of welfare. But the user is questioning how this squares with paternalism. So, the core tension is between respecting autonomy and intervening for individuals' own good.

  The user wants five distinct philosophical commitments. Each point must name a presupposition and then note if government actions support or undermine it. Let me brainstorm possible commitments. 

  One key idea is that actual choices reveal stable preferences. But in reality, preferences might be inconsistent or influenced by context. For example, labor market studies assume workers understand risks, but behavioral economics shows cognitive biases. Paternalistic policies like sin taxes acknowledge such flaws, undermining this commitment.

  Another point is commensurability—converting diverse values into monetary terms. But policies like seatbelt laws might prioritize life over cost without monetizing, challenging this reduction. Then there's the aggregation of individual preferences into social welfare. However, regulations sometimes override majority preferences for minority protection, conflicting with strict aggregation.

  Also, the assumption that individuals are the best judges of their welfare is contradicted by mandates like retirement savings, which assume myopia. Finally, the focus on ex ante WTP ignores that people might regret risks later, which paternalistic laws address.

  Now, checking each point against government actions: for each commitment, paternalistic policies seem to undermine them. The user might be hinting at an inconsistency in government philosophy, or perhaps different domains apply different principles. They might also be interested in how behavioral economics challenges traditional welfare economics. 

  I need to ensure each point is distinct and ties back to the tension. Avoid overlap. Also, the user is knowledgeable, so references to concepts like VSL and revealed preference are appropriate. Let me structure each point clearly: commitment first, then government's stance. Confirm that all five points address the query without repetition. Finally, ensure no intro or conclusion, just the numbered points as specified.
answer: |-
  Here are five distinct philosophical commitments underlying cost-benefit analysis (CBA) and their relationship to paternalistic policies:

  1.  **Revealed Preference as Welfare Proxy:** CBA presupposes that individuals' actual choices (revealed through market behavior like wage-risk tradeoffs) reliably express their underlying preferences and thus their welfare, treating willingness to pay (WTP) as the best available measure of the value they place on goods like safety. Paternalistic policies (e.g., cigarette taxes, seatbelt mandates) actively undermine this by asserting that revealed choices are often flawed indicators of true welfare due to biases, addiction, or myopia.

  2.  **Commensurability via Monetary Valuation:** CBA rests on the commitment that diverse goods (life, health, environment, consumer goods) can be meaningfully compared and aggregated by reducing them to a common monetary metric based on WTP/WTA. Other government interventions implicitly reject strict commensurability in practice, treating certain goods (like basic safety or health protection) as lexically superior or non-fungible to the point of mandating them regardless of individual WTP.

  3.  **Sovereignty of Ex Ante Preferences:** CBA relies on individuals' *ex ante* valuations made *before* facing a specific risk or outcome (e.g., a worker's general valuation of risk reduction), assuming this perspective accurately captures their considered welfare interests. Paternalistic policies often appeal to *ex post* perspectives or objective harm (e.g., the regret of a smoker with cancer, the objective harm of poverty in old age), implicitly prioritizing potential future selves or objective wellbeing over revealed *ex ante* choices.

  4.  **Methodological Individualism & Aggregation:** CBA presupposes social welfare is solely the aggregation of individual welfare, defined by individual preferences/WTP, with no independent collective values. While CBA honors this aggregation, paternalistic mandates (like Social Security) sometimes override aggregate individual preferences based on a societal judgment about minimum provision, social stability, or fairness, introducing a collectivist element absent from pure WTP aggregation.

  5.  **Stable, Context-Independent Preferences:** The VSL methodology assumes preferences revealed in one context (labor markets) are stable and transferable to other contexts (e.g., environmental risk, transportation safety), and that individuals understand and process risk probabilities rationally. Paternalistic policies fundamentally challenge this, acting on the belief that preferences are context-dependent, risk perception is systematically biased, and rational processing often fails, necessitating intervention to achieve outcomes aligned with "true" preferences or objective good.
