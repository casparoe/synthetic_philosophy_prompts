prompt: |-
  I'm taking a decision theory course this semester and we just got to St. Petersburg, which I thought I understood, but then I read a chapter of a popular book on infinity paradoxes that my uncle lent me and now I'm confused about this "Pasadena game" thing. The chapter says the following, roughly: you flip a coin until the first heads, and if that happens on toss n, you get a payoff that grows huge as n grows, but it alternates between a reward and a penalty, so some outcomes pay you a lot and others cost you a lot. Then it says that when you compute the expected value, you get an infinite series whose partial sums oscillate back and forth forever and never settle on a value, so the game just has no expected value, full stop. It also says there's a theorem from math letting you rearrange the terms of a series like this to make it add up to anything you want, so a clever casino could make the game's fair price be whatever number it likes, which honestly sounds like a scam. The chapter ends by saying this game "delivers the killing blow to expected utility theory," since the theory can't put a value on the game and a theory that can't value gambles is refuted. And I think it also said somewhere that the payoffs actually get smaller as you go deeper into the game, which doesn't match my memory of the setup but the book is by a mathematician so I assumed I misread.

  Something feels off but I can't place it. My lecturer said St. Petersburg is supposed to be the warm-up and Pasadena the "real trouble," but she also said the killing-blow framing is too strong, and I didn't get why. So: go through the chapter's summary bit by bit and tell me what's accurate, what's subtly wrong (I get the feeling at least one thing about the math is stated in a way a decision theorist would wince at), and what a defender of expected utility theory would say about the final conclusion -- does "undefined value for one gamble" really add up to "theory refuted," or is there a difference between a theory being silent and a theory being wrong? If it helps, we've also talked in class about how some people think there's a weaker notion of expectation that still puts a number on the game, so I'd be curious whether that rescues anything or just changes what the paradox is about.
