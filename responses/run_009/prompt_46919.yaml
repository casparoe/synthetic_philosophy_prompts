  i'm a second-year epistemology PhD student trying to figure out what to actually work on in the peer disagreement literature for the next few years. everyone seems to agree the old split-the-difference conciliationism is dead in its crude form, but it's a lot less clear what the live research questions are now. which open problems here would you prioritize, and why?

  i'm less interested in a survey of positions (steadfastness, the total evidence view, enoch-style right rationality, etc.) than in a dependency-aware ordering: which questions are upstream of which. e.g. is the real crux how you individuate epistemic peers in the first place -- shared evidence vs. track record -- or is that downstream of something about how higher-order evidence interacts with first-order justification? or is the peer individuation thing basically a side show?

  also, which parts of this literature do you think are overrated, in the sense that settling them wouldn't change much downstream? and tell me what would make you move something up or down the list. i want reasoning about what makes a question worth a dissertation, not just that it's unresolved -- a defended agenda, not a reading list
