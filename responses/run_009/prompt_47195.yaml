  But CDT doesn't consider the effect of the policy on the prediction. It considers the action in isolation. So we must assume that the prediction is fixed and not affected by the current action. However, the prediction is based on what the agent would do, which is the current action. 

  This is a known problem in these setups. One way out is to assume that the agent has a fixed type (which they are now using) and the predictor knew that type. Therefore, the prediction is fixed and the agent doesn't change it by their current action (because the current action is determined by the type).

  So let's assume the agent is using a fixed decision rule. Since we are comparing the actions, we need to consider how the letter arose given the fixed prediction that is based on the agent's overall policy.

  But the agent's overall policy is not yet chosen. We are in the midst of CDT. 

  Alternatively, we can consider that the agent is using a mixed strategy or that the agent doesn't know their own type. But this is messy.

  A common approach in CDT for these problems is to note that the prediction is fixed and the action does not affect it. Therefore, the agent conditions on the letter and then decides.

  So we compute the probability of being in branch H or T given the letter, and also the dirt state if in T.

  But the probability of receiving the letter depends on the branch and the prediction. And the prediction is based on the agent's policy. For the CDT agent, we must assume a policy. But the agent is free to choose any action. How do we compute the probabilities without a policy? 

  We can assume that the agent's policy is fixed and known to the predictor. Let the policy be such that the agent pays with probability q. But then the analysis becomes very complex.

  However, the problem asks to show that CDT always refuses. So we must show that no matter what, the expected utility of paying is negative.

  The causal effect of paying is to lose $1000 in the current branch. Additionally, it might have other effects? But in this setup, paying does not cause any other effect. The dirt is already there, the bonus is already set in the other branch. 

  Therefore, the only effect is -$1000. So the causal expected utility of paying is always -$1000, while not paying is 0. Therefore, CDT always refuses.

  But is that true regardless of the information from the letter? The agent might have information about the branch, but in any branch, if they pay, they lose $1000. There is no benefit in the current branch from paying. 

  In branch H, paying only gives a loss. In branch T, paying only gives a loss (and no benefit because the bonus is already set and the dirt is not affected). Therefore, in both branches, paying causes a loss of $1000. 

  Therefore, no matter what the agent believes about the branch, the expected causal utility of paying is -$1000 and of not paying is 0. So CDT always refuses.

  Now, for the updateless threshold: we set p=0.1, so B* = 1900.

  We need two worked examples:
     - B just below 1900: say 1899 -> then EU(Pay) = 0.5*1899 + 500*0.1 - 1000 = 949.5 + 50 - 1000 = -0.5 < 0 -> so choose NotPay.
     - B just above: 1901 -> EU(Pay)=0.5*1901+50-1000=950.5+50-1000=0.5>0 -> choose Pay.

  Now, the trap: the probability of receiving the letter depends on your own decision procedure. So you can't update on "an envelope arrived" without knowing your own policy. 

  Updateless reasoning avoids this by not updating. It considers the entire policy and averages over all states (including the ones where the letter is not sent). Specifically, it doesn't condition on the observation (the letter) when choosing the policy. It chooses a policy that maps observations to actions, and then evaluates the expected utility over the entire distribution, including states where the letter is not sent (and therefore the policy is not invoked). 

  In our calculation for UDT, we did exactly that: we averaged over the coin, the dirt, and then within each branch, we considered whether the letter was sent and what the policy would do. We did not condition on the letter being sent. We considered the entire world.

  Now, the honesty check: which single feature is doing the work? 

  The key feature is that in the tails branch (which is the XB leg), the arrival of the letter depends on the policy and the dirt. In particular, if the agent has the dirt, then under the policy of paying, the letter is not sent so the agent doesn't pay. But under the policy of not paying, the letter is sent (if there is dirt) and then the agent doesn't pay anyway. Therefore, the agent only pays in the tails branch if they have no dirt and the policy is to pay. 

  This asymmetry makes the tails branch less costly for the policy of paying because the agent only pays when there is no dirt (so they are not being blackmailed for real dirt). Therefore, the cost in the tails branch for the paying policy is only $1000 with probability (1-p). 

  If we unhook the blackmail letter's arrival from the prediction, what would happen? Suppose in the blackmail leg, the letter is always sent regardless of the prediction. Then:

  For policy Pay in branch T:
     - Bonus: +B
     - Letter is always sent, so they pay $1000 -> utility = B - 1000.

  Then EU(Pay) = 0.5*(-1000) + 0.5*(B-1000) = 0.5B - 1000.
  EU(NotPay) = 0.5*0 + 0.5*0 = 0.

  Then the agent pays if 0.5B - 1000 > 0 => B>2000.

  But what about the dirt? The paying does nothing for the dirt, but the agent pays regardless of the dirt. So the cost in the tails branch is always $1000. 

  Additionally, the presence of the dirt doesn't affect the payment because the letter is always sent and they always pay. So the dirt is irrelevant. 

  This then becomes a mixture of:
     - Heads branch: lose $1000 if pay.
     - Tails branch: get B if pay (policy) and also lose $1000 (because they pay the blackmail).

  So it's like a counterfactual mugging but with an additional $1000 loss in the tails branch if you pay. Therefore, the threshold becomes B>2000.

  But note: if we also remove the payment in the tails branch (so the blackmail leg doesn't require payment), then it would be the classic CM: 
     - Heads: pay $1000 if policy is Pay.
     - Tails: get B if policy is Pay.

  Then EU(Pay)=0.5*(-1000)+0.5*B, so threshold B>1000.

  So by having the blackmail letter's arrival depend on the prediction, we reduce the threshold from 2000 to 1900 (for p=0.1). The reduction is by 1000p.

  Now, EDT: Evidential Decision Theory.

  EDT conditions on the action and updates the probabilities of the states.

  The agent has received the letter. They consider:

  P(state | action) and then compute expected utility.

  But the action (paying) is evidence about the agent's policy, which in turn affects the predictor's prediction and the arrival of the letter. However, the letter has already arrived. 

  The agent must consider: if I pay, what does that say about the world?

  In particular, paying is more likely if the agent has a policy of paying. But the policy of paying affects the prediction and the arrival of the letter.

  Let me try to compute for EDT.

  We are to compute the expected utility of paying and not paying, conditional on the letter having arrived, and using conditional probabilities given the action.

  Let A be the action (Pay or NotPay).

  We need P(coin, dirt | A, letter)

  But note: the letter is given. So we condition on the letter having been sent.

  The agent knows the letter was sent. They are to choose A.

  The probability of the state (coin, dirt) given A and that the letter was sent.

  But A is evidence about the policy. In fact, the agent's action A is a consequence of their policy. Since the policy is either always pay or never pay, then:

     - If the agent pays, then their policy must be "always pay", because if it were "never pay", they wouldn't pay.
     - Similarly, if they don't pay, their policy must be "never pay".

  Therefore, the action perfectly reveals the policy.

  So:

     If the agent pays, then the policy is Pay.
     If the agent doesn't pay, then the policy is NotPay.

  Therefore, conditioning on the action, we know the policy and hence the prediction.

  Now, we can compute the probability of the state.

  We are interested in the utility, which depends on the branch and the dirt and the policy (which is known from the action).

  Let's compute for the action Pay:

     We condition on the action being Pay, which means the policy is Pay.

     Also, we condition on the letter having been sent.

     The probability of the state (coin, dirt) given policy=Pay and letter sent.

     By Bayes, we can compute:

     P(coin=H, dirt | policy=Pay, letter sent) and P(coin=T, dirt | policy=Pay, letter sent)

     Since the policy is fixed to Pay, the letter being sent happens with:
        - In branch H: always sent.
        - In branch T: sent only if no dirt.

     And the dirt is independent of the coin.

     We need the prior probabilities: 
        P(coin=H)=0.5, P(coin=T)=0.5
        P(dirt)=p, P(no dirt)=1-p

     The likelihood of the letter being sent given (coin, dirt, policy=Pay):
        - If coin=H: always sent -> probability 1.
        - If coin=T: sent only if no dirt -> probability (1-p)

     But wait: we are conditioning on the letter being sent. We want P(coin, dirt | policy=Pay, letter sent).

     Since the policy is fixed, we can compute:

     P(coin=H, dirt | policy=Pay, letter sent) ∝ P(letter sent | coin=H, dirt, policy=Pay) * P(coin=H, dirt | policy=Pay)
       = 1 * [P(coin=H) * P(dirt)] = 0.5 * p

     Similarly, 
     P(coin=H, no dirt | policy=Pay, letter sent) ∝ 1 * 0.5 * (1-p)

     P(coin=T, dirt | policy=Pay, letter sent) ∝ P(letter sent | coin=T, dirt, policy=Pay) * ... = 0 * [0.5 * p] = 0
     P(coin=T, no dirt | policy=Pay, letter sent) ∝ (1-p) * [0.5 * (1-p)]? 

     Actually, the probability of the state (coin, dirt) given the policy is just the prior. Then the likelihood of the letter being sent is:

          if coin=H: 1
          if coin=T and no dirt: 1
          if coin=T and dirt: 0

     So the normalization:

          States that have non-zero likelihood:
             (H, dirt): probability 0.5 * p
             (H, no dirt): 0.5 * (1-p)
             (T, no dirt): 0.5 * (1-p)   [because in T, dirt: no letter, so not included]

          Total probability of letter sent given policy=Pay: 
              = P(H) * 1 + P(T) * P(no dirt) 
              = 0.5 * 1 + 0.5 * (1-p) = 0.5 + 0.5(1-p) = 1 - 0.5p

          Therefore:
             P(coin=H, dirt | policy=Pay, letter sent) = [0.5 * p] / [1 - 0.5p]
             P(coin=H, no dirt | ...) = [0.5 * (1-p)] / [1 - 0.5p]
             P(coin=T, no dirt | ...) = [0.5 * (1-p)] / [1 - 0.5p]
             P(coin=T, dirt | ...) = 0

     Now, the utility if the agent pays (and we know the policy is Pay) is:

          In branch H: -1000 (regardless of dirt)
          In branch T: 
               - If no dirt: then the agent pays $1000 (because the letter is sent and they are paying) and also gets the bonus B? 
                  But wait: in branch T, the bonus B is paid if the policy is Pay. And the policy is Pay, so the bonus is there regardless of the letter. So:
                     utility in (T, no dirt): B - 1000
               - In branch T, dirt: but we have conditioned that the letter was sent, and in T with dirt and policy=Pay, the letter is not sent. But our conditioning has set the probability of (T,dirt) to 0. So we ignore.

          Therefore, the expected utility of paying, given policy=Pay and letter sent, is:

             = [P(H,dirt) * (-1000) + P(H,no dirt)*(-1000) + P(T,no dirt)*(B-1000)] 
             = [ (0.5p)/(1-0.5p) * (-1000) + (0.5(1-p))/(1-0.5p) * (-1000) + (0.5(1-p))/(1-0.5p) * (B-1000) ]

          Note: the state (H,dirt) and (H,no dirt) both yield -1000. Also, (T,no dirt) yields B-1000.

          = [ -1000 * (0.5p + 0.5(1-p)) + (0.5(1-p))/(1-0.5p) * (B-1000) ] / [normalization? But we have the probabilities already normalized]

          Actually, the expression above is the expected utility using the conditional probabilities.

          The first part: 
              -1000 * [ (0.5p + 0.5(1-p)) / (1-0.5p) ] = -1000 * [0.5/(1-0.5p)] 
          because p + (1-p)=1.

          Second part: [0.5(1-p)]/(1-0.5p) * (B-1000)

          So:
             EU(Pay | letter, policy=Pay) = [ -500 + 0.5(1-p)(B-1000) ] / (1-0.5p)

          But note: we don't need to divide by (1-0.5p) if we are using the normalized probabilities? Actually, we have:

             = [ -1000 * (0.5) + 0.5(1-p)(B-1000) ] / (1-0.5p)
             = [ -500 + 0.5(1-p)B - 0.5(1-p)*1000 ] / (1-0.5p)

          = [ -500 -500(1-p) + 0.5(1-p)B ] / (1-0.5p)
          = [ -500(1 + (1-p)) + 0.5(1-p)B ] / (1-0.5p)
          = [ -500(2-p) + 0.5(1-p)B ] / (1-0.5p)

     Now, for the action NotPay:

          If the agent does not pay, then that reveals the policy is NotPay.

          Then we condition on policy=NotPay and letter sent.

          The likelihood of letter sent given (coin, dirt, policy=NotPay):
             - H: always sent -> 1
             - T: sent only if dirt -> P(dirt)=p

          So the probability of letter sent given policy=NotPay:
              = P(H)*1 + P(T)*p = 0.5 + 0.5p

          The states:
             (H, dirt): 0.5 * p
             (H, no dirt): 0.5 * (1-p)
             (T, dirt): 0.5 * p  [because in T, only if dirt then letter sent]
             (T, no dirt): 0 (because in T, no dirt: no letter)

          Then conditional probabilities:

             P(H,dirt | ...) = (0.5p) / (0.5+0.5p) = p/(1+p)
             P(H,no dirt | ...) = (0.5(1-p)) / (0.5(1+p)) = (1-p)/(1+p)
             P(T,dirt | ...) = (0.5p) / (0.5(1+p)) = p/(1+p)

          The utility for not paying (and policy=NotPay) is:

             In H: 0 (because not pay) 
             In T: 0 (because not pay, and also the bonus is 0 because policy=NotPay)

          So EU(NotPay | letter, policy=NotPay) = 0.

          Therefore, the agent will compare:

             EU(Pay) = [ -500(2-p) + 0.5(1-p)B ] / (1-0.5p)
             EU(NotPay) = 0

          They will pay if EU(Pay) > 0.

          Let's plug in p=0.1:

             Denominator: 1-0.05 = 0.95

             Numerator: -500*(2-0.1) + 0.5*0.9 * B = -500*1.9 + 0.45B = -950 + 0.45B

             So EU(Pay) = (-950 + 0.45B) / 0.95

             Set >0: -950 + 0.45B >0  => 0.45B>950 => B>950/0.45 ≈ 2111.11

          So for p=0.1, the threshold for EDT is about 2111.11.

          But note: this is above the updateless threshold of 1900.

          Also, it is above 2000.

          Why? Because paying is evidence that the policy is Pay, which means:

             - It increases the probability that we are in a branch where the letter is less likely to be sent in the tails branch? 

          Specifically, conditioning on paying makes it more likely that we are in the heads branch (because in the tails branch, with policy=Pay, the letter is only sent if no dirt, which is 90% of the time, but in heads it is always sent). However, the overall probability of the letter being sent given policy=Pay is 1-0.5p = 0.95, while under policy=NotPay it is 0.5+0.5p=0.55. 

          Therefore, the fact that we received a letter is more likely under policy=Pay than under policy=NotPay. So if we pay, we are more likely to be in the heads branch? 

          Actually, in our calculation, the conditional probability of being in heads given policy=Pay and letter is:

               P(coin=H | policy=Pay, letter) = [0.5] / [1-0.5p] = 0.5 / 0.95 ≈ 0.5263

          and tails: 0.5(1-p)/0.95 = 0.5*0.9/0.95 ≈ 0.45/0.95 ≈ 0.4737

          So indeed, heads is slightly more likely.

          Moreover, in the tails branch, we only have the no-dirt case and we have to pay $1000 and we get B. But the benefit is B-1000. However, the cost in the heads branch is $1000.

          The expected utility is negative unless B is large enough to offset the high probability of being in the heads branch.

          Therefore, EDT is less likely to pay than UDT in this setup.

  Finally, the "never pay for counterfactual payoffs" camp (which might be CDT or some other) would attack the threshold reasoning.

  They would say that the bonus B in the tails branch is not affected by the current action. Therefore, it should not be taken into account when deciding to pay. The current action only affects the current branch. In the current branch, paying loses $1000. Therefore, they would refuse to pay.

  They would reject the updateless reasoning that averages over the branches and considers the bonus in the tails branch. They might say that the bonus in the tails branch is not experienced by the agent in the heads branch, and vice versa. Since the agent is in one branch, they should only care about that branch.

  In the heads branch, paying loses $1000. In the tails branch, the agent is faced with a blackmail letter. If they are in the tails branch, then they would use CDT again: paying the blackmail does nothing, so they wouldn't pay. Therefore, they would never pay.

  This camp would reject the very idea of a policy that spans multiple branches. They would say that the agent should make the decision that is best for the situation they are in.

  However, the case is fair to them in the sense that they are consistent: they only consider the causal effect in the current branch. It begs the question by assuming that counterfactuals in other branches should not be counted. The updateless agent counts them because they are part of the overall consequences of the policy.

  In summary, we have:

  - CDT always refuses.
  - UDT pays if B > 2000 - 1000p (e.g., 1900 for p=0.1).
  - EDT pays only if B is even higher (e.g., about 2111 for p=0.1).

  The threshold B* for UDT might be unintuitive because it is less than 2000 (when p>0). This is due to the fact that in the blackmail leg, the agent with a paying policy only pays when there is no dirt, which is less than 100% of the time.

  We have built the thought experiment to spec.
answer: |-
  ### Thought Experiment: Ambiguous Counterfactual Demand

  **Protocol Summary:**  
  An honest predictor (with decades of verified accuracy) first predicts your response to a $1,000 demand. A fair coin is flipped. Heads (50%): You receive the demand; if the coin had been tails, you would have received a bonus $B iff the predictor foresaw payment. Tails (50%): You receive the identical demand iff (you have "dirt" XOR predictor foresaw payment); paying does nothing about the dirt. Dirt probability \(p\) is independent and fixed (e.g., \(p = 0.1\) for rare dirt). You see only the envelope and know the protocol, but not the coin, dirt, or prediction.

  ---

  ### **1. Stakes and Threshold Setting**
  - **Everyday stakes**: Dirt probability \(p = 0.1\) (e.g., 10% chance of termites).  
  - **Threshold \(B^*\)**: For UDT, \(B^* = 2000 - 1000p = 2000 - 1000 \times 0.1 = 1900\).  
    - **Just below \(B^*\)**: \(B = 1899\) → UDT refuses.  
    - **Just above \(B^*\)**: \(B = 1901\) → UDT pays.  
  This ensures near-cancellation: At \(B = 1900\), EU(Pay) = EU(Refuse) = 0.

  ---

  ### **2. CDT Always Refuses (Regardless of \(B\))**
  CDT only considers causal effects of actions. Upon receiving the envelope:  
  - Paying causes a loss of $1,000 in the current branch (whether heads or tails).  
  - Bonus $B (in tails) and dirt status are unaffected by payment (already fixed).  
  - Conditioning on the envelope:  
    - In heads: Paying loses $1,000.  
    - In tails: Paying loses $1,000 (no effect on dirt/bonus).  
    - **Causal EU(Pay) = -1000** (across all states).  
    - **Causal EU(Refuse) = 0**.  
  → **CDT refuses for any \(B\)**, as the loss is certain and no benefit is causally attainable.

  ---

  ### **3. Updateless (UDT) Verdict as Function of \(B\)**
  UDT evaluates policies over all branches, ignoring the observation ("envelope arrived") to avoid circularity. Policies:  
  - **Pay**: Always pay if envelope arrives.  
  - **Refuse**: Never pay.  

  **Expected Utility (UDT)**:  
  \[
  \begin{align*}
  \text{EU(Pay)} &= 0.5 \times (-1000) + 0.5 \times \left[ B - 1000 \times (1 - p) \right] \\
  &= -500 + 0.5B - 500(1 - p) \\
  &= 0.5B + 500p - 1000 \\
  \text{EU(Refuse)} &= 0 \\
  \end{align*}
  \]  
  - **Threshold \(B^*\)**: Solve \(0.5B + 500p - 1000 > 0\) → \(B > 2000 - 1000p\).  
  - **Worked Examples (\(p = 0.1\))**:  
    - \(B = 1899\): EU(Pay) = \(0.5 \times 1899 + 500 \times 0.1 - 1000 = -0.5\) → **Refuse**.  
    - \(B = 1901\): EU(Pay) = \(0.5 \times 1901 + 50 - 1000 = 0.5\) → **Pay**.

  ---

  ### **4. The Trap: Circularity of P(Envelope)**
  - **Problem**: Probability of receiving the envelope depends on your policy:  
    - Heads: Always sent.  
    - Tails: Sent iff (dirt XOR prediction), and prediction depends on your policy.  
  - **UDT Solution**: Avoids updating on the envelope. Instead:  
    1. Fix a policy (Pay or Refuse).  
    2. Compute EU over all coin/dirt/prediction states (including branches without envelopes).  
    3. Choose the policy with higher EU.  
  This sidesteps circularity by not conditioning on the observation during policy selection.

  ---

  ### **5. Honesty Check**  
  - **Key Feature**: In the blackmail leg (tails), envelope arrival depends on policy and dirt. For "Pay" policy, you pay only if *no dirt* (prob \(1-p\)), reducing expected cost. If envelope arrival in blackmail were *unhooked from prediction* (e.g., always sent):  
    - EU(Pay) = \(0.5 \times (-1000) + 0.5 \times (B - 1000) = 0.5B - 1000\).  
    - Threshold becomes \(B > 2000\) (no \(p\) dependence).  
  - **Why?** With prediction-dependent arrival, UDT pays less often in blackmail (only when no dirt), lowering \(B^*\) to \(2000 - 1000p\). The dependence **couples policy selection to dirt probability**, making it distinct from a noisy mugging.

  ---

  ### **6. EDT: Pays for Bad News?**  
  EDT conditions on the action to update beliefs:  
  - Paying reveals a "Pay" policy → increases belief of being in heads (where envelopes are more likely).  
  - **EU_EDT(Pay | Envelope)**:  
    \[
    \frac{-500(2-p) + 0.5(1-p)B}{1 - 0.5p}
    \]  
  - For \(p=0.1\), threshold: \(B > 2111.11\) (higher than UDT).  
  - **Circularity?**: Yes—EDT uses the action to infer the policy, which affects beliefs about dirt/coin. But it pays for the "good news" of likely being in tails (where bonus awaits), offset by "bad news" of likely heads (loss). At \(B=1901\), EDT refuses (EU≈-5.26), caught in the same circularity trap as updating on the envelope.

  ---

  ### **Attack from "Never Pay" Camp**  
  - **Fair Critique**: They reject counterfactual bonuses in unactualized branches. Argument:  
    > "Your decision affects only your current branch. Paying loses $1,000 here. The bonus $B (in tails) is unobserved and irrelevant—it doesn't compensate your actual loss."  
    This is consistent: CDT ignores non-causal cross-branch effects.  
  - **Question-Begging**: UDT assumes branches are "real" for averaging, but the critic denies this. At \(B^*=1900\), they see:  
    - Heads: Certain $1,000 loss if paid.  
    - Tails: Bonus irrelevant (you're not in tails).  
    Thus, paying is strictly dominated.  
  **Verdict**: The clash reduces to whether counterfactual outcomes (e.g., bonus in tails) are part of utility. UDT says yes; "never pay" says no—no new argument bridges this gap. The unintuitive \(B^*=1900\) highlights UDT's counterfactual weighting.
