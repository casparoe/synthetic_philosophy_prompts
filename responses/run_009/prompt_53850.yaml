prompt: |-
  I teach an upper-level seminar on personal identity and I'm writing the take-home final. Problem: my students have all memorized the standard Parfit script to the point where it's worthless — teletransporter, replica isn't you, fission case, "identity is not what matters, psychological connectedness is." I can grade those answers with a rubber stamp.

  So I need ONE essay question, answerable in about 90 minutes, that punishes recitation. The crux I want it built around: Parfit's conclusion only follows if personal identity has to be a one-one relation, since in fission the two successors each have the continuity but neither can be you (identity is transitive, and the successors aren't each other). But there's a known escape route in the literature — roughly, say that *two* people shared the pre-fission body/states all along, so each successor is straightforwardly identical to one of them, and fission no longer breaks identity. The question should force students to (1) actually reconstruct the argument that identity must be one-one rather than assert it, (2) say what the escape route buys and what it costs (I'm thinking counting problems: how many people were in the room before the machine was even turned on?), (3) say whether the escape route even helps with the ordinary non-branching teletransporter case, where Parfit's claim that the replica isn't you seems to rest on something else entirely, and (4) take a stand on whether the fight between Parfit and the escape-route theorist is substantive or merely verbal — would anything I do, feel, or care about come out differently?

  You're a professional philosopher who's taught this material for years, so please think carefully — maybe brainstorm a couple of ways the question could go sideways before committing (e.g. ways a student could still answer it by reciting). Then give me (a) the question itself, around 150 words, stated so that it can't be answered by summarizing Reasons and Persons; (b) a model answer of ~650 words that actually takes a position rather than surveying; (c) a marking scheme with five must-hit points totaling 25 marks, and for each point one line on how a B answer typically goes wrong there. Answer in American English please, and don't lean on me grading charity — assume the marker knows the literature.
