prompt: |-
  so I'm filling out an advance directive and it turns out that forces you to actually decide when you'd count as dead. before signing anything I wrote down what I believe, and I'd like someone to stress-test the whole set. here it is:

  1. whole-brain death is death. the rationale is the organism-as-a-whole thing: the brain is what integrates all the systems, so once the entire brain is gone what's left on the ventilator is a corpse, not a patient. and I think the higher-brain version is a mistake — permanently unconscious patients are alive, full stop.

  2. the dead-donor rule is a bright line and I want it held: no organs come out of anyone who isnt dead, no matter how long the waiting list is or how good the outcome would be.

  3. I'm a registered organ donor and I'd be fine with donation after circulatory death — the protocol where they pull the ventilator, wait a couple minutes (some places two, some five) after the heart stops, and then recover the organs. seems obviously okay to me.

  4. withdrawing the ventilator from a permanently unconscious patient is letting them die, not killing them, and I think that distinction does real moral work — it's not a euphemism we hide behind.

  5. I accept that the Harvard committee and the people behind the 1981 uniform death law were partly motivated by wanting organs and freeing up ICU beds, and I still think they landed on the right answer. death is a biological fact that the law recognizes; the law doesn't get to define it into whatever is convenient.

  for what it's worth, the cases that bug me most are the brain-dead pregnant women who've been kept on support for months so the baby can be delivered — something about that feels off but I cant say what. maybe that's nothing.

  go through my five and tell me which ones are actually in tension and how badly. rank the tensions by severity, don't list them like they're all equal. for each real one say what would have to give and what giving it costs me, and flag any that only look like tensions. and if theres a single revision that would clean up more than its share, tell me which one. under 700 words please — I want an audit, not a treatise.
reasoning: |-
  Okay, the user is filling out an advance directive and wants their beliefs about death and organ donation stress-tested. They've listed five key principles and mentioned discomfort about brain-dead pregnant women being kept on life support. 

  First, I need to map the tensions between their stated positions. Points #1 (whole-brain death) and #3 (DCD acceptance) seem solid alone, but together they might conflict ethically. The core issue is that DCD protocols declare death after 2-5 minutes of circulatory arrest, but neuronal activity can persist longer - which contradicts their whole-brain definition. 

  The pregnancy case they mention actually highlights a different tension: their strong "organism-as-a-whole" rationale (#1) clashes with keeping brain-dead bodies "alive" for fetal gestation. This exposes a conflict between biological integration (their core argument) and temporary somatic preservation. 

  Hmm, their dead-donor rule (#2) and DCD support (#3) also create pressure points. If DCD donors aren't fully dead by whole-brain criteria (since residual activity might exist), doesn't that violate the bright line? Yet rejecting DCD would force them to abandon organ donation preference.

  The withdrawal distinction (#4) seems consistent unless we push their rationale to unconscious patients - but they explicitly reject higher-brain criteria, so it holds. The Harvard committee point (#5) is more historical than ethical, no direct conflict.

  Prioritizing the tensions by severity:
  - The DCD vs whole-brain death conflict is most acute because it challenges biological consistency
  - The pregnancy case reveals a secondary tension in their organism-as-a-whole principle
  - The dead-donor rule gets strained by DCD but could be salvaged with revised death criteria

  Minimal revision path: Adjusting #1 to accept irreversible cessation (not instantaneous absence) of brain function would resolve multiple tensions. It maintains biological grounding while accommodating DCD realities, preserves organ donation option, and costs little - they already accept cessation in circulatory death. The pregnancy discomfort would remain but become philosophically coherent: those cases represent technologically sustained biology, not integrated life.

  Should emphasize that their discomfort about pregnant cases is actually evidence their framework is working - it flags where technology creates ethical outliers without violating core principles.
answer: |-
  Here's your stress-test audit, prioritizing tensions by severity:

  **Severe Tension: #1 (Whole-Brain Death) vs. #3 (DCD Acceptance)**
  *   **Why:** Your #1 defines death as the *absence* of all brain function ("entire brain is gone"). DCD (#3) declares death based solely on *irreversible cessation* of circulation/respiration after a very short wait (2-5 mins). At that point, the *entire brain* is not necessarily "gone" – neurons die over minutes/hours. Brainstem function sufficient for spontaneous breathing/consciousness is gone quickly, but higher cortical activity *might* linger briefly. DCD relies on *irreversibility* (no spontaneous return), not instantaneous, complete neuronal death.
  *   **Tension:** You're using two different biological standards for declaring death. DCD donors aren't "whole-brain dead" by the strict definition in #1 at the moment organs are recovered. This directly challenges the bright-line Dead-Donor Rule (#2) in DCD cases.
  *   **What Gives/Cost:** You must either:
      1.  **Revise #1:** Accept that death is defined by the *irreversible cessation* of brain function (which circulatory death inevitably causes, even if not instantaneous), not its complete absence at the exact moment of declaration. *Cost:* Weakens the "organism-as-a-whole" immediacy, but aligns with biological reality and standard medical/legal practice. **Minimal cost, resolves the most tension.**
      2.  **Revise #3:** Reject DCD as violating #1 and #2. *Cost:* Abandons organ donation preference for many viable organs, contradicts widespread ethical/legal acceptance of DCD.
      3.  **Revise #2:** Abandon the bright-line Dead-Donor Rule for DCD. *Cost:* Violates a core principle, ethically slippery slope.

  **Moderate Tension: #1 (Organism-as-a-Whole) & #2 (Dead-Donor) vs. Brain-Dead Pregnancy Cases**
  *   **Why:** Your rationale for #1 emphasizes the brain's role in integrating the organism as a whole. Keeping a brain-dead body functioning for fetal gestation (#1 says this is a "corpse") seems like using a corpse as an incubator, which feels exploitative or inconsistent with "organism-as-a-whole" ceasing.
  *   **Tension:** This challenges the *practical implications* of your definition. Legally/medically, the body *is* being sustained as a functional biological system *for the fetus*, blurring the "corpse" line. It tests the Dead-Donor Rule by potentially using a legally dead body for another's biological benefit.
  *   **What Gives/Cost:** You likely need to **accept the logical consequence** of #1: if the pregnant woman is dead, sustaining her somatic functions is extraordinary support for the fetus, not treatment for *her*. Your discomfort stems from the unique biological situation, not a flaw in #1 or #2. *Cost:* Accepting this counterintuitive outcome is the price of strict whole-brain death + dead-donor adherence.

  **Apparent Tension (Not Real): #1 (Reject Higher-Brain) vs. #4 (Withdrawal OK)**
  *   **Why:** You reject higher-brain death (#1) but support withdrawing life support from the permanently unconscious (#4), calling it "letting die."
  *   **Resolution:** No conflict. Your #4 hinges on the act/omission distinction and the futility of treatment, *not* redefining the patient as dead. You clearly state permanently unconscious patients are *alive* but may permissibly be allowed to die by stopping burdensome/unwanted interventions. The moral distinction holds.

  **Minimal Tension: #5 (Motivations vs. Outcome)**
  *   **Why:** You accept flawed motivations behind the Harvard Committee/UDA but endorse their conclusion (whole-brain death).
  *   **Tension:** Very minor. It questions whether pragmatic concerns *unduly* influenced the biological definition. You resolve it by asserting death is biological, not defined by convenience. Holding both is consistent.

  **Recommendation:**
  *   **Key Revision:** Amend #1 to focus on the **irreversible cessation of all functions of the entire brain** (the standard legal/medical phrasing), replacing "entire brain is gone". This resolves the severe tension with #3 and DCD, upholds #2, and is biologically sound (cessation implies irreversibility). It costs little, as you already accept irreversible circulatory cessation in DCD.
  *   **Hold Steady:** Maintain #2, #4, #5. Accept the pregnancy case consequence as logically consistent with #1 (revised) and #2, even if uncomfortable.
  *   **Result:** A coherent framework: Death = irreversible cessation of whole-brain function. Dead-donor rule strictly upheld. Withdrawal of life support from the living unconscious is permissible allowing to die. DCD is valid as it causes and relies on irreversible cessation. Historical motivations don't invalidate the biological standard.
