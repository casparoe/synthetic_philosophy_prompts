answer: |-
  Here’s the sonnet, voiced by the overpass, wrestling with its own contested history:

  **The Parkway Span Considers Causation**

  I stand, a judge in rivets, steel, and stone,
  My arch prescribes the limit, clear and low:
  No bus shall scrape my crown, nor claim the zone
  Of Jones Beach sands where richer currents flow.
  My builder knew: the road is meant for cars
  That bear the sort who own the shore’s sweet view.
  I am the gate that keeps the buses barred,
  Intent made manifest, his purpose true.
  Politics hardened in my concrete frame,
  A silent law suspended in the air.

  *But then... the scholars came with file and claim,*
  *Unspooling tales that left my purpose bare.*
  *Tape measures whispered heights were not so planned,*
  *Bus routes scarce used my road, paths touched the sand.*

  So, did I wield the power, cold and stark?
  Or did they forge the meaning, after dark?
  I feel the weight of wheels on asphalt pass
  The same beneath me, either way, alas.

  ---

  **Breakdown:**

  *   **Octave (Lines 1-8):** The bridge confidently asserts Winner's narrative. It uses language of judgment ("judge," "prescribes," "law"), exclusion ("No bus," "keeps the buses barred"), and explicit intent ("builder knew," "Intent made manifest," "his purpose true"). "Politics hardened in my concrete frame" directly echoes the key concept.
  *   **Volta (Lines 9-10):** The turn arrives mid-sentence at line 9 ("But then..."), signaled by the shift in perspective ("scholars came") and the questioning tone. Lines 9-10 introduce the critical historians disrupting the certainty.
  *   **Sestet (Lines 11-14):** Details the specific historical counter-arguments ("tape measures," "heights," "Bus routes," "paths") that undermine the bridge's original confident claim. The language shifts from declaration to description of doubt ("whispered," "scarce used," "touched").
  *   **Closing Couplet (Lines 15-16):** The bridge articulates its central confusion – inherent politics vs. ascribed politics? The final line emphasizes the *effect* remains unchanged ("same beneath me"), regardless of the *cause*. "Alas" conveys a quiet, weary confusion, not judgment.
  *   **Voice:** The bridge speaks plainly, using physical sensations ("feel the weight," "scrape my crown," "suspended in the air") and structural terms ("rivets, steel, and stone," "arch," "frame," "concrete"). It avoids overly academic language ("manifest" is the most complex word, fitting its initial certainty). There's no smugness in either stance – initial confidence feels like simple fact, later confusion feels genuine.
  *   **Ambiguity:** The final couplet doesn't resolve the debate. It focuses on the bridge's inability to know its own "true" nature from its fixed position, highlighting the core seminar question about interpretation vs. inherent design. The enduring reality is the daily traffic flow ("wheels on asphalt pass").
