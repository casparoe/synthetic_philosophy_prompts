prompt: |-
  I sit on the governance review group of Hillcrest Housing Co-operative, a student-run co-op with about 700 resident members. We're revising our bylaws, and the group has become stuck on a boundary question that I suspect is an old philosophical problem wearing institutional clothes: who counts as part of our co-op for voting purposes?

  At present only resident members vote. Three proposals would widen that, each backed by a different faction. The first would give votes to subletters — around 90 non-members living in our buildings under short-term agreements while members are on placement abroad; they pay the same rent and are subject to the same house rules and disciplinary procedures, but have no say in making them. The second would give votes to the eleven live-in wardens, who are employees rather than members; the argument is that they're affected by nearly every governance decision but currently have to be 'consulted' in a way nobody is obliged to take seriously. The third, pushed hardest by a group of final-year members, would create proxy or successor votes for people on our waiting list — roughly 200 students who will live here next year and will bear the consequences of rent and capital decisions taken now, but who have no present say.

  There's also a fourth, quieter faction who think we've drawn the boundary too widely already and should be talking about narrowing it: they point out that our bulk-purchasing and building decisions affect traders and neighbours in the surrounding streets who will never be members of anything, and that if we start expanding the franchise on the ground of being affected, we have no obvious place to stop — you can't put a landlord in Ascot on the ballot because our refurbishment budget moved the price of his scaffolding.

  I have to circulate a position paper before our meeting in a fortnight, and I want it to be a proper decision memo, not a survey of views: a concrete recommendation for a revised franchise, with the reasoning behind it. I'd like the reasoning to be principled — some articulated test for who belongs in the decision-making body, not a case-by-case horse trade — and to say honestly where the test draws lines that some faction will hate. It should also take the strongest argument for the losing side seriously, whichever side that turns out to be; my inclination is toward the subletters, but I want to be shown the best case against my own position rather than reassured. Finally, I want the memo to address the slippery-slope worry about the affected-but-distant (the scaffolding landlords of the world) rather than wave it away, since our group will seize on any hand-waving there.

  Please keep the memo under 600 words. Assume it will be read by intelligent students with no philosophy background, so jargon should be either avoided or explained in a sentence when it earns its place.
reasoning: |-
  Okay, the user is part of a housing co-op governance review group facing a voting rights dilemma. They need a principled position paper on franchise boundaries, balancing four factions with competing proposals. 

  Hmm, this is fascinating - it's essentially the "boundary problem" of democratic theory in real life. The core tension is between resident-membership purity and impact-based inclusion. The user wants clear principles, not compromises, and specifically asks to confront the slippery slope argument head-on. 

  I notice they're personally leaning toward subletters but want their bias challenged. Smart. The memo must be under 600 words for student readers without philosophy background. Key constraints: no jargon without explanation, address the "affected parties" concern seriously, and give the losing side's strongest argument.

  The scaffolding landlord example is brilliant - it perfectly embodies the absurd endpoint of pure impact-based voting. Need to tackle that directly. Also important: wardens are employees, which creates a principal-agent tension, while waitlisters are future members without current stake. 

  For structure: first establish a "meaningful stake" test with residency + consequence + duration filters. Then apply it to each group. Subletters pass (temporary residency), wardens fail (employee conflict), waitlisters fail (no present residency). Then demolish the slippery slope by showing how "affected" alone is insufficient without residency tethering. 

  Biggest risk is sounding dogmatic. Must emphasize this is about institutional sustainability, not moral desert. The "strongest counter" section should genuinely wrestle with wardens' unfair consultation limbo. And acknowledge that any line-drawing will disappoint someone - that's the point of principles.
answer: |-
  ## Governance Review: Position Paper on Voting Franchise Boundaries  
  **To:** Hillcrest Housing Co-operative Governance Review Group  
  **From:** [Your Name], Governance Review Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Revised Voting Franchise Based on the "Meaningful Stake" Principle  

  **1. Recommended Franchise:** Voting rights should be extended **only to Resident Members and Subletters**. Wardens and individuals on the waiting list should not be granted voting rights.  

  **2. Core Principle: The Meaningful Stake Test**  
  Voting rights should belong to individuals who simultaneously meet two criteria:  
      *   **Present, Direct Residency:** They currently live within the co-op's physical community.  
      *   **Subject to Rules & Consequences:** They are directly governed by the co-op's rules, disciplinary procedures, and financial obligations (like rent) *and* bear the immediate consequences of governance decisions (e.g., rent changes, capital projects affecting their living space).  
  This principle balances the need for democratic legitimacy (those governed should ideally consent) with practical community boundaries. It focuses on the **shared, immediate experience of residing together under the co-op's authority**.  

  **3. Applying the Principle:**  
  *   **Resident Members:** Clearly meet both criteria. *Status: Retain Vote.*  
  *   **Subletters:**  
      *   *For:* They reside in the co-op *now*, pay full rent *now*, live under house rules *now*, and face immediate consequences of decisions (e.g., rent hikes during their stay, rule enforcement). Excluding them creates a democratic deficit where residents lack a voice.  
      *   *Against (Counter Considered):* Their stay is temporary, potentially undermining long-term commitment.  
      *   *Decision:* Their *present* residency and subjection to rules/rent outweigh the temporary nature. **Recommendation: Grant Vote.**  
  *   **Wardens:**  
      *   *For:* They are deeply affected by decisions, live on-site, and current "consultation" is inadequate. Their insights are valuable.  
      *   *Against:* They are **employees**. Granting votes fundamentally blurs the line between governance (members setting direction) and management/operations (employees implementing it). This creates a conflict of interest and undermines the member-employee accountability structure. Their primary relationship is contractual, not ownership-based.  
      *   *Decision:* While affected, their employee status is incompatible with the "meaningful stake" defined by residency *as a member/tenant*. **Recommendation: No Vote.** Strengthen formal consultation mechanisms instead.  
  *   **Waiting List (Future Residents):**  
      *   *For:* They *will* be affected by long-term financial decisions (e.g., debt impacting future rent).  
      *   *Against:* They do **not currently reside** in the co-op. They are not subject to current rules, paying current rent, or experiencing the immediate consequences of *today's* decisions. Granting votes severs the essential link between *present* residency and governance.  
      *   *Decision:* Future impact alone is insufficient. **Recommendation: No Vote.** Ensure robust member education on long-term implications.  

  **4. Addressing the Slippery Slope ("Affected But Distant"):**  
  The "Meaningful Stake" principle provides a clear stopping point to prevent franchise creep:  
  *   **The Residency Anchor:** The requirement for **present, direct residency** within the co-op's physical community is the critical boundary. It excludes those only indirectly or financially affected (e.g., scaffolding suppliers, local traders, neighbours).  
  *   **Immediate Governance Subjection:** While our decisions *affect* others, only residents are *directly governed* by the co-op's internal rules and bear the *immediate, personal consequences* within their homes.  
  *   **Practical Reality:** Democratic communities require definable boundaries. "Affectedness" alone is infinitely expandable (as the Ascot landlord example shows). Residency provides a tangible, administrable, and democratically relevant line. While we should consider our external impact responsibly, governance must reside with those living the internal reality.  

  **5. Strongest Counterargument (Against Subletter Inclusion):**  
  The most compelling case against including subletters is the **risk to community cohesion and long-term vision**. Subletters, by definition, are transient. Granting them equal voting power on long-term capital projects or fundamental rule changes alongside members committed for years could lead to decisions favouring short-term convenience or cost savings over the co-op's sustainable future, potentially harming the community members aim to build and maintain. Their stake, while real, is inherently temporary.  

  **6. Conclusion:**  
  Extending voting rights to subletters corrects a current democratic gap for present residents governed by our rules. Excluding wardens preserves the essential member-employee distinction. Excluding the waiting list maintains the vital link between *current* residency and governance. The "Meaningful Stake" principle, anchored in present residency and immediate subjection to rules/consequences, provides a clear, defensible, and administrable boundary. While this excludes some affected parties (wardens, future residents, external actors), it ensures governance remains with those experiencing the co-op as their *present home*. This line, though imperfect, protects the integrity of our resident-led community.  

  **Recommendation Summary:**  
  *   **Voting Rights:** Resident Members + Subletters.  
  *   **No Voting Rights:** Wardens, Waiting List.  
  *   **Action:** Strengthen formal consultation processes for Wardens; enhance transparency/education for all on long-term decisions affecting future members.
