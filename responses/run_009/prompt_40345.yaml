        However, they sacrifice the condition of independence of irrelevant alternatives (IIA) because the score given to one application might be influenced by the others (though panelists are instructed to score independently per application). 
        Also, Arrow's theorem assumes ordinal rankings, so by using cardinal information we are outside the strict domain of Arrow.

      Alternatives considered:
        - Full rankings: Too burdensome for 40 items, and might lead to arbitrary rankings in the middle.
        - Top-k: Loses information about the bottom.

      We choose a 0-10 scale (with 10 being best) and allow panelists to assign the same score to multiple applications.

