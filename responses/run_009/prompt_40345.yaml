                  A: std = sqrt( ((8-9)^2 + (9-9)^2 + (10-9)^2)/3 ) = sqrt((1+0+1)/3)=sqrt(2/3)≈0.816
                  Similarly, B and C have the same.

              Step 3: Third quartile (75th percentile) of the original set: 
                  For a set of three, the 75th percentile is the third smallest? 
                  We compute: 
                    We sort: [8,9,10] -> the 75th percentile: 
                      position = 0.75*(3+1)=3 -> the third number? or 0.75*3=2.25 -> interpolate: 
                      The 75th percentile is the value at index 2 (0-indexed) which is 10? 
                  Actually, for three numbers: 
                    25th: index=0.25*4=1 -> first number? 
                    50th: 0.5*4=2 -> second?
                    75th: 0.75*4=3 -> third? 
                  So 75th percentile = 10 for all.

              Step 4: First quartile: 8 for all.

              Step 5: Break by ID. We assume A has ID=1, B=2, C=3. Then A wins (lowest ID).

            So the ranking: A, then B, then C.

          This breaks the cycle.

      Case 2: Appeal that A would have outranked B if C hadn't been on the ballot.

          We set up:

            Applications: A, B, C

            Scores:

              Panelist1: A=10, B=9, C=8
              Panelist2: A=9, B=10, C=7
              Panelist3: A=8, B=7, C=10   # This panelist likes C best.

          We'll compute without C (so remove C) and with C.

          Without C (so only A and B):

            A: [10,9,8] -> n=3 -> trim: remove 10 and 8 -> [9] -> avg=9
            B: [9,10,7] -> trim: remove 10 and 7 -> [9] -> avg=9

            Tie-breaking: 
              Median: A: [8,9,10] -> 9, B: [7,9,10] -> 9 -> tie.
              Standard deviation: 
                  A: std≈0.816
                  B: std≈ sqrt( ( (7-9)^2 + (9-9)^2 + (10-9)^2 )/3 ) = sqrt( (4+0+1)/3 ) = sqrt(5/3)≈1.291
              So A wins (lower std).

          With C:

            We compute the trimmed means for A, B, C:

              A: [10,9,8] -> trim to [9] -> 9
              B: [9,10,7] -> trim to [9] -> 9
              C: [8,7,10] -> trim to [8]? because remove 10 and 7 -> [8] -> 8

            Now ranking: A and B tied at 9, then C at 8.

            Tie-breaking between A and B: same as above -> A wins.

            So the ranking is: A, B, C.

          The appeal: Had C not been on the ballot, A would have outranked B? 
            Without C: A beats B? -> yes, A wins the tie-breaker.
            With C: A still beats B? -> yes, same outcome.

          Therefore, the appeal fails.

          But what if the presence of C changed the scores? 
            We assume it didn't. But what if the panelists adjusted their scores for A and B because C was there?

          Example:

            Without C:

              Panelist1: A=10, B=9
              Panelist2: A=9, B=10
              Panelist3: A=10, B=9   # changed from the above? 

            Then:
              A: [10,9,10] -> trim: remove 10 and 9 -> [10] -> 10
              B: [9,10,9] -> trim: remove 10 and 9 -> [9] -> 9
              So A>B.

            With C:

              Panelist1: A=10, B=9, C=8
              Panelist2: A=9, B=10, C=7
              Panelist3: A=8, B=7, C=10   # now panelist3, because C is there, lowers A and B.

            Then for A: [10,9,8] -> trim to 9 -> average=9
            B: [9,10,7] -> trim to 9 -> average=9
            Tie-breaking: A wins as above.

            But note: without C, panelist3 would have given A=10 and B=9? but with C, they gave A=8 and B=7? 
            This is a violation of our assumption of independent scoring. 

          We cannot prevent this. We rely on the panelists to score independently.

      Case 3: The Idiosyncratic Ballot that determines the tail.

          We have 7 panelists. One panelist (P1) gives:
            App X: 10
            All others (including App Y): 0

          The other six panelists give:
            App X: 5
            App Y: 7 (all six give 7)

          Then:

            For X: 
                Scores: [10, 5,5,5,5,5,5]   (one 10 and six 5s)
                n=7: remove 10 and 5 (the lowest 5? but there are multiple 5s) -> remove one 10 and one 5 -> remaining: five 5s -> average=5.

            For Y:
                Scores: [0,7,7,7,7,7,7]   (one 0 and six 7s)
                n=7: remove 0 and 7 -> remaining: five 7s -> average=7.

            So Y (7) > X (5) -> Y is ranked higher.

          The tail (the bottom) is determined by the applications that get the lowest scores. In this case, X is not at the bottom because it has 5. 
          The application that gets the lowest score might be one that the other six panelists gave 5 and the extreme panelist gave 0? 

          Example: App Z (not X or Y) gets:
            P1: 0
            Others: 5

          Then:
            Z: [0,5,5,5,5,5,5] -> trim: remove 0 and 5 -> five 5s -> average=5.

          So Z and X both have 5. Then tie-breaking: 
            For X: original set: [10,5,5,5,5,5,5] -> median=5, std= (we don't need to compute because the trimmed means are the same, but we break by median: both have median 5 -> then by std? 
            Standard deviation for X: 
               mean of original: (10+5*6)/7 = 40/7≈5.71
               std = sqrt( ( (10-5.71)^2 + 6*(5-5.71)^2 )/7 ) = ... 
            Similarly for Z: 
               original: [0,5,5,5,5,5,5] -> mean≈4.29, std=?

          We break by the median: both have median=5 -> tie.
          Then by standard deviation: 
            For X: 
              deviations: (10-5.71)=4.29, then 6 times (5-5.71)^2 = 6*(0.71)^2≈6*0.5=3.0 -> total variance≈ (18.4+3.0)/7≈21.4/7≈3.06 -> std≈1.75
            For Z:
              deviations: (0-4.29)^2≈18.4, then 6*(5-4.29)^2≈6*0.5≈3.0 -> total variance≈21.4/7≈3.06 -> std≈1.75
          Then we break by the third quartile: 
            For X: sorted: [5,5,5,5,5,5,10] -> 7 numbers: 75th percentile is the value at index floor(0.75*7)=5? (0-indexed: 0,1,2,3,4,5,6) -> the 5th index is the 6th number? 
            Actually: 
              positions: 0:5, 1:5, 2:5, 3:5, 4:5, 5:5, 6:10 -> the 75th percentile: 
                index = (7-1)*0.75+1 = 6*0.75+1 = 5.5 -> interpolate between index5 (5) and index6 (10) -> 7.5.
            For Z: sorted: [0,5,5,5,5,5,5] -> 75th percentile: same method: index=5.5 -> interpolate between index5 (5) and index6 (5) -> 5.
            So X has 7.5 and Z has 5 -> X wins.

          Therefore, X is ranked above Z.

          The extreme panelist's ballot did not force the entire tail to be tied. It only affected the tie-breaking for applications with the same trimmed mean.

          Moreover, note that the extreme panelist's 0 for Y was removed, so Y was not pulled down.

      Case 4: An output we dislike.

          We already gave an example: A polarizing application (A) loses to a consensus application (B) even though A had high scores from some.

          Another example: 
            Application D: [10, 10, 10, 10, 0]   (4 panelists love it, one hates it)
            Application E: [7,7,7,7,7]

          For D: n=5 -> remove 10 and 0 -> [10,10,10] -> average=10
          For E: n=5 -> remove 7 and 7 -> [7,7,7] -> average=7

          So D wins. 

          But what if the 0 was from a respected panelist? We might be concerned. But our method removed that 0. 

          Now change the scores for D: [10,10,10,1,1] 
            Trim: remove one 10 and one 1 -> [10,10,1] -> average= (10+10+1)/3≈7.0
          For E: [7,7,7,7,7] -> trim: still [7,7,7] -> 7.

          Then D (7.0) and E (7.0) tie.

          Tie-breaking for D and E:
            D: original set: [1,1,10,10,10] -> median=10, std≈4.97
            E: original set: [7,7,7,7,7] -> median=7, std=0
            Step1: median: 10>7 -> D wins.

          So D still wins.

          But what if the low scores are not 1 but 2? 
            D: [10,10,10,2,2] -> trimmed: [10,10,2] -> average≈7.33
            E: [7,7,7,7,7] -> 7
            Then D>E.

          What if we have:
            D: [10,10,10,3,3] -> trimmed: [10,10,3] -> 7.67
            E: [8,8,8,8,8] -> trimmed: 8 -> then E wins (8>7.67)

          So if the consensus application has a high enough score, it wins.

          We designed the method to be robust to one or two extreme scores. But in the case of two low scores, the trimmed mean for D becomes lower. 

          The chair might dislike that an application with three 10s is not funded because two panelists gave it 3 and the consensus application got 8. 

          We have to accept this: the method values consensus and avoids risk.

      Conclusion:

          We have described a procedure that:
            - Uses a trimmed mean of scores (0-10) to aggregate.
            - Handles conflicts and withdrawals.
            - Mitigates the effect of extreme ballots.
            - Avoids cycles by using cardinal scores.

          We sacrifice the independence of irrelevant alternatives (IIA) condition. This sacrifice is open and we explain that the context of the entire set of applications may influence the scoring by panelists, but we instruct them to score independently.

          The procedure is mechanical and does not require chair discretion beyond the initial ballot validation and handling withdrawals.

          We provide tie-breaking rules that are mechanical.

          We have demonstrated the procedure on several cases.

          We note that the method may sometimes favor consensus applications over transformative ones, and we are open about that trade-off.

      Note: The above procedure is complex in tie-breaking. In practice, ties might be rare. We can simplify the tie-breaking to:

          Tie-breaking steps:
            1. Median of the original set (descending).
            2. Standard deviation of the original set (ascending).
            3. Application ID (ascending).

          We drop the quartiles.

      Let's adjust the procedure accordingly.

      Final tie-breaking:

          If two applications have the same trimmed mean:

            Step 1: The application with the higher median of the original set of scores wins.
            Step 2: If the medians are the same, the application with the lower standard deviation (of the original set) wins.
            Step 3: If still tied, the application with the lower application ID (e.g., a numerical ID) wins.

      This is simpler and still captures the idea of favoring applications with more central support and less disagreement.
answer: |-
  ### Proposed Aggregation Procedure for Grant Review Panel

  #### **1. Ballot Collection: Scores on a 0–10 Scale**
  - **Procedure**: Panelists assign each non-conflicted application a score from 0 (worst) to 10 (best), allowing one decimal place. Conflicts of interest are declared upfront; conflicted applications are left unscored and treated as abstentions. Panelists must score all non-conflicted applications.
  - **Burden vs. Accuracy Tradeoff**: 
    - *Complete rankings*: Too burdensome for 40 applications; risks arbitrary distinctions in lower tiers.
    - *Top-k rankings*: Loses information about the lower tier; vulnerable to strategic burial of competitors.
    - **Scores chosen**: Reduce cognitive load while capturing intensity of preference. Sacrifices **independence of irrelevant alternatives (IIA)** by design, as scores may be relative to the set (e.g., a "good" application in a weak pool may score higher than in a strong pool). This sacrifice is **openly disclosed**.
  - **Handling Partial Ballots**: 
    - A panelist ranking only their top ten and marking others as "tied" must assign a score (e.g., 0) to the lower tier. Unscored non-conflicted applications are flagged, and the chair follows up for correction. If unresolved, they are treated as abstentions.

  #### **2. Aggregation Rule: Trimmed Mean Ranking**
  - **Procedure**:
    1. **Handle withdrawals**: Remove any withdrawn applications after ballots are submitted. Their removal does not rescore other applications (avoids IIA violations in aggregation).
    2. **Calculate application scores**:
       - Let \( S \) be the list of scores for an application (excluding conflicts/abstentions).
       - If \( |S| = 0 \): Assign a score of \(-\infty\) (ranked last).
       - If \( |S| = 1 \) or \( 2 \): Score = mean of \( S \).
       - If \( |S| \geq 3 \): Remove the highest and lowest scores, then score = mean of the trimmed set.
    3. **Rank applications**: Sort by score descending.
    4. **Break ties**:
       - If tied scores, compare **medians of original scores** (higher wins).
       - If still tied, compare **standard deviations of original scores** (lower wins; favors consensus).
       - If still tied, use **application ID** (lower wins; arbitrary but mechanical).
  - **Why Trimmed Mean?** Reduces impact of strategic/extreme ballots while preserving intensity. Sacrifices **unrestricted domain** (by trimming extremes) and **IIA** (due to cardinal context), but both are **openly disclosed**.

  #### **3. Cycle Handling**
  - **Not Applicable**: Cardinal scores (trimmed means) avoid Condorcet cycles by construction. Pairwise comparisons are not used, so cycles cannot occur.

  #### **4. Handling Recurring Irritants**
  - **Conflict of Interest**: Abstentions are ignored for the conflicted application. No score adjustment needed.
  - **Idiosyncratic Ballots** (e.g., one application scored 10, others 0): Trimming removes the extreme high/low for each application, mitigating undue influence. The trimmed mean depends on central tendencies (see Case 3).
  - **Late Withdrawal**: Remove the application; other scores unchanged. Justification: Scores are context-independent per panelist instructions (avoids IIA disputes).

  #### **5. Justification for Sacrificing Arrow's Conditions**
  - **IIA Sacrificed**: Scores may be context-dependent (openly disclosed). Mitigated by instructing panelists to score applications independently.
  - **Unrestricted Domain Sacrificed**: Trimming restricts score sets (openly disclosed). Necessary to dampen extremes.
  - **Non-Dictatorship and Pareto Efficiency**: Preserved. No single panelist controls outcomes, and unanimity in scores is reflected.

  ---

  ### **Simulated Cases**

  #### **Case 1: Genuine Condorcet Cycle (Top Three)**
  - **Scenario**: Applications A, B, C. Panelist preferences:
    - 3 votes: A > B > C  
    - 3 votes: B > C > A  
    - 3 votes: C > A > B  
    Scores (emulating rankings):  
    - A: [10, 10, 10, 0, 0, 0, 5, 5, 5]  
    - B: [0, 0, 0, 10, 10, 10, 5, 5, 5]  
    - C: [5, 5, 5, 0, 0, 0, 10, 10, 10]  
  - **Aggregation**:
    - Trimmed means (remove one highest/lowest per application):
      - A: Trimmed scores = [10, 10, 0, 0, 5, 5, 5] → Mean = 5.0  
      - B: Trimmed scores = [0, 0, 10, 10, 5, 5, 5] → Mean = 5.0  
      - C: Trimmed scores = [5, 5, 0, 0, 10, 10, 5] → Mean = 5.0  
    - Tie-breaking by median:
      - A: Median = 5.0  
      - B: Median = 5.0  
      - C: Median = 5.0  
    - Tie-breaking by standard deviation (lower is better):
      - A: Std = 3.74
      - B: Std = 3.74
      - C: Std = 3.74  
    - Tie-breaking by ID: Assume A=1, B=2, C=3 → **Rank: A > B > C**.
  - **Outcome**: Cycle resolved mechanically. No chair judgment needed.

  ---

  #### **Case 2: Appeal Due to Withdrawn Application**
  - **Scenario**: Application C withdraws after scoring. Appellant claims A would outrank B if C not present.
  - **Original Scores**:
    - A: [8, 8, 8, 8, 8] → Trimmed mean = 8.0  
    - B: [10, 10, 10, 0, 0] → Trimmed (remove 10 and 0) = [10, 10, 0] → Mean = 6.67  
    - C: [5, 5, 5, 5, 5] (irrelevant; withdrawn).  
  - **Ranking with C**: B (6.67) < A (8.0) → **A > B**.
  - **Appeal Test ("If C Not Present")**: Remove C; A and B scores unchanged. **A (8.0) > B (6.67)**. Outcome identical.
  - **Chair Action**: Reject appeal. Removal preserves relative rankings; IIA violation is inherent but openly disclosed.

  ---

  #### **Case 3: Idiosyncratic Ballot Determines Funded Tail**
  - **Scenario**: Panelist 1 scores: X=10, all others=0. Other six panelists score Y=7, Z=5, others uniformly.
  - **Aggregation for Y and Z**:
    - Y: Scores = [0, 7, 7, 7, 7, 7, 7]  
      - Trimmed (remove 0 and 7) → [7, 7, 7, 7, 7] → Mean = 7.0  
    - Z: Scores = [0, 5, 5, 5, 5, 5, 5]  
      - Trimmed (remove 0 and 5) → [5, 5, 5, 5, 5] → Mean = 5.0  
  - **Outcome**: **Y (7.0) > Z (5.0)**. Extreme ballot impacts Z minimally (trimming removes the 0).  
  - **Chair Dislikes This**: If the panelist scored X=10 and Z=0 (others unchanged), Z’s trimmed mean is 5.0—identical to without the extreme ballot. The tail is **not determined by one ballot** due to trimming.  
    - **Exception**: If Z has only one supporter (Panelist 1=0, others abstain), Z’s score = mean([0]) = 0.0 (unlikely, as panelists must score non-conflicted apps).

  ---

  ### **Where Judgment is Required vs. Mechanical Steps**
  - **Mechanical Steps** (No Chair Discretion):
    - Score adjustment (capping at 0/10, handling abstentions).
    - Calculating trimmed means, medians, standard deviations.
    - Ranking and tie-breaking per rules.
    - Handling withdrawals (remove application; no rescoring).
  - **Judgment Calls** (Chair Intervenes):
    - **Validating Conflicts**: Verifying self-declared conflicts.
    - **Correcting Ballot Errors**: Following up on incomplete/out-of-bound scores.
    - **Appeals Interpretation**: Assessing if procedural violations occurred (e.g., scoring bias from withdrawn apps). The **aggregation itself is not overridden**.

  ---

  ### **Conclusion**
  This procedure:
  - Reduces burden with scoring.
  - Mitigates extremes via trimmed means.
  - Avoids cycles and clarifies tie-breaking.
  - Openly sacrifices IIA and unrestricted domain for practicality.
  - Minimizes chair discretion to pre- and post-aggregation checks.

  **Trustee Justification**: We sacrifice IIA for richer cardinal data and mitigate its risks through independent scoring instructions and trimming. Pareto efficiency, non-dictatorship, and transparency are preserved. The method is robust to common issues, with mechanical aggregation ensuring replicability.
