prompt: |-
  I run a philosophy-of-mind evening course for adult learners with no background in philosophy, most of whom signed up out of an interest in sleep or lucid dreaming. My next session, ninety minutes with a whiteboard, is on whether dreams are experiences at all — Malcolm's contention that a dream is not something experienced while asleep but a story composed or accepted upon waking, and Dennett's response that dreams are experiences of an unusual kind, drafted and loaded into memory just before or as we wake. I want a plan for the session, not a rehearsal of the doctrine. Specifically: which idea has to be in place before the question can even seem open to them — I suspect it is the difference between a report of an ongoing episode and a report told after the fact, but tell me if something else has to come first and why. Which single case should carry the whole session — it has to do double duty, lending itself to both the real-time-experience reading and the composition-at-waking reading, and I want to know what that case must contain and what it must be kept free of. The misconceptions the class will predictably form, in the order they will arrive — that Malcolm is flatly denying that people dream, that REM sleep research and neural decoding have long since settled the matter, that Dennett is calling dreams fake and our dream memories deceptive — and exactly where in the sequence each should be headed off. One question I can pose at the end that would distinguish someone who has understood the argument from someone who has merely sat through it. And what I should openly decline to get into at this level — I suspect lucid dreaming and the neuroscience — and why leaving those out does no harm to the core point.
reasoning: |-
  Okay, the user is teaching a philosophy of mind evening course for adult learners without a philosophy background. Their next session is on whether dreams are experiences, focusing on Norman Malcolm's view that dreams aren't experienced during sleep but are stories composed upon waking, versus Daniel Dennett's position that dreams are unusual experiences drafted right before waking. 

  The user wants a session plan that avoids doctrine rehearsal and focuses on pedagogical strategy. They're asking very specific questions about conceptual prerequisites, a central illustrative case, predictable misconceptions, an assessment question, and boundaries for the discussion. 

  First, the foundational concept needed is the distinction between real-time experience and retrospective narrative. Without grasping this, students won't see why the question is open. I should emphasize that Malcolm isn't denying dreaming occurs but challenging how we conceptualize it - the confusion usually happens around the word "experience." 

  For the central case, I'm considering "the interrupted dream" scenario - someone woken mid-dream who reports a specific experience. This works because it supports both theories: Malcolm would say the narrative was constructed upon waking, while Dennett could argue the experience was retrieved from memory. The case must avoid neuroscientific details or lucid dreaming elements to stay focused on phenomenology. 

  Predictable misconceptions will come in waves: first that Malcolm denies dreaming happens (clarify immediately), then that neuroscience has settled this (postpone as irrelevant to the philosophical question), and finally that Dennett calls dreams fake (emphasize both agree we have dream reports but disagree about their origin). 

  The perfect assessment question would be: "If Malcolm is right, what actually happens during REM sleep?" This tests if they understand his core claim isn't about dream occurrence but about the nature of dreaming. 

  Neuroscience and lucid dreaming should be explicitly bracketed out - they're fascinating but tangential to the conceptual distinction being examined. The user's instinct here is correct; adding them would muddy the waters for beginners. 

  The session flow should be: establish the experience/narrative distinction → present the interrupted dream case → examine it through both theories → systematically dismantle misconceptions → end with the assessment question. Keeping the whiteboard visual with two columns (real-time vs. retrospective) will help reinforce the dichotomy. 

  What's clever about the user's approach is how they anticipate exactly where students will stumble. Their question about "which idea must come first" shows deep teaching experience - they know conceptual sequencing determines whether an argument lands or crashes. I should honor that by keeping the scaffolding extremely tight.
answer: |-
  Here’s a focused 90-minute session plan tailored to your needs, prioritizing conceptual clarity over doctrine and leveraging predictable misconceptions:

  ---

  ### **Core Foundation to Establish First**  
  **The Experience vs. Memory Distinction**  
  - *Why this first?* Without this, Malcolm’s position sounds absurd. Learners conflate "having a dream" (post-waking memory) with "experiencing a dream" (real-time event). Use relatable analogies:  
    - *Real-time report:* "Describe what’s happening *right now* in this room."  
    - *Memory report:* "Describe what you ate for breakfast *after* finishing the meal."  
  - **Key Insight:** Malcolm argues dream reports are *only* memory reports, not evidence of prior experience.  

  ---

  ### **The Central Case: "The Interrupted Dream"**  
  *Use a single hypothetical scenario throughout the session:*  
  > *"A participant in a sleep study is woken abruptly during REM sleep. They immediately report: 'I was just running through a forest, chased by a bear! I felt my heart pounding!'"*  

  #### **What this case MUST include:**  
  1. **Vivid sensory details** (e.g., "running," "forest," "bear," "heart pounding") to feel experientially rich.  
  2. **Immediate recall upon waking** (avoids "forgot and remembered later").  
  3. **Emotional content** ("fear") to highlight subjective "experience."  

  #### **What it MUST avoid:**  
  - No lucid dreaming (introduces meta-awareness complications).  
  - No neuroscience (e.g., "REM proves experience!" – bracket this).  
  - No verifiable reality (e.g., "and then they found bear claw marks" – conflates dream with reality).  

  ---

  ### **Predictable Misconceptions & When to Address Them**  
  *(Sequence mirrors likely learner reactions)*  

  1. **"Malcolm says dreams don’t happen!"**  
     - *When:* Immediately after introducing Malcolm.  
     - *Response:* "Malcolm *agrees* we wake with dream stories. His point: we can’t prove they were *experienced during sleep*. Like finding a letter on your desk – did you write it last night, or this morning?"  

  2. **"But REM/deep learning/neuroscience proves dreams are real experiences!"**  
     - *When:* During Dennett’s response or Q&A.  
     - *Response:* "Science shows *brain activity* during sleep, but not *subjective experience*. Brains process information without consciousness (e.g., coma, deep sleep). Malcolm: Activity ≠ experience."  

  3. **"Dennett says dreams are fake/deceptive!"**  
     - *When:* After contrasting Dennett’s "drafting" model.  
     - *Response:* "Dennett *agrees* dreams feel real! His twist: the 'experience' isn’t in sleep; it’s constructed *at recall*. Like editing a movie *as* you watch it – still real to you."  

  ---

  ### **The Key Assessment Question**  
  **End with this:**  
  > *"If Malcolm is right, what actually happens during REM sleep?"*  

  - **Shallow answer:** "Nothing? We don’t dream?" *(Misses the point)*  
  - **Deep answer:** "Brains process information/emotions, but no subjective experience occurs *until* waking. The 'dream' is the story we tell upon waking." *(Grasps the experience/memory divide)*  

  ---

  ### **What to Openly Exclude & Why**  
  1. **Lucid Dreaming:**  
     - *Why:* Lucidity implies real-time awareness, which *seems* to support Dennett. But it’s a special case requiring meta-cognition, muddying the core debate.  

  2. **Neuroscience/Neural Decoding:**  
     - *Why:* Brain scans correlate with dream *reports*, not unmediated experience. Malcolm’s argument is philosophical: subjective experience can’t be third-party verified.  

  **Why omitting these does no harm:**  
  The core goal is understanding *how we justify claims about private experiences*. Neuroscience doesn’t resolve Malcolm’s challenge – it just provides more data to interpret through the same lens.  

  ---

  ### **Session Flow**  
  1. **Intro (5 mins):** Frame the question – "Are dreams experiences *during* sleep?"  
  2. **Foundation (15 mins):** Experience vs. memory reports (whiteboard: real-time vs. retrospective).  
  3. **Malcolm’s View (20 mins):** "Interrupted dream" case → Malcolm’s interpretation (story at waking). Preempt Misconception #1.  
  4. **Dennett’s Response (20 mins):** Same case → Dennett’s "just-in-time loading" model. Preempt Misconception #3.  
  5. **Contrast & Debate (20 mins):** Whiteboard comparison. Tackle Misconception #2 if raised.  
  6. **Assessment & Wrap-up (10 mins):** Pose key question. Emphasize both agree dreams *occur* – they disagree *when and how*.  

  ---

  **Whiteboard Strategy:**  
  | **Real-Time Experience**          | **Retrospective Narrative**       |  
  |-----------------------------------|-----------------------------------|  
  | (e.g., feeling rain *now*)        | (e.g., recalling yesterday's rain)|  
  | **Dennett: "Drafted at waking"**  | **Malcolm: "Only a story"**       |  
  | *Brain: Loads fragments*          | *Brain: Constructs coherence*     |  

  This keeps the debate anchored to the framework, not personalities or extraneous science.
