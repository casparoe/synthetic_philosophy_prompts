  **Axiomatic Wealth Partners**  
  **7 Virtue Circle, Suite 101**  
  **Ethicopolis, MV 02118**  

  October 26, 2023  

  Dear Mr. Ellis,  

  Welcome to Axiomatic Wealth Partners, where we believe your moral convictions are your most valuable assets—and like any assets, they deserve sophisticated, diversified management. We understand you’ve recently experienced what we call a “deontic dislocation event”—that unsettling realization that your moral certainties may not be as… certain as you once believed. Rest assured, you’ve come to the right place. Just as you wouldn’t entrust your retirement savings to a single volatile stock, you shouldn’t stake your ethical future on a single moral theory. Moral uncertainty isn’t a crisis; it’s an opportunity for strategic allocation.  

  At Axiomatic, our flagship offering is the **Diversified Conscience Fund™ (DCF)**, built on the rigorously optimized principle of Maximizing Expected Choiceworthiness (MEC). Think of it as a globally balanced ethical index fund. You hold credences across multiple moral theories—say, 35% in utilitarianism, 25% in Kantian deontology, 20% in virtue ethics, 15% in contractualism, and perhaps a speculative 5% in that compelling but niche care-ethics start-up. The DCF doesn’t force you to liquidate any positions prematurely. Instead, we calculate the action with the highest *expected moral return* across your entire portfolio. Why gamble on one theory being “right” when you can harvest compounded returns from all of them?  

  Now, we anticipate your question: “How do you compare the ‘choiceworthiness’ of saving a human life under utilitarianism to keeping a promise under deontology? Aren’t those… different currencies?” An astute concern! This is the intertheoretic value comparison challenge—akin to converting yen to euros while accounting for fluctuating moral purchasing power parity. At Axiomatic, we employ a proprietary **Normalization Process™** to harmonize these valuations. Our patented algorithms (developed in-house by our quants in the Normativity Lab) apply scalable weighting metrics to render all theories’ outputs into standardized “Axiomatic Choiceworthiness Units” (ACUs). While the full methodology is a trade secret (disclosure: involving advanced meta-ethical smoothing protocols), rest assured it’s been back-tested across thousands of historical dilemmas with statistically significant reductions in normative regret.  

  For clients seeking an even more neutral approach, we offer the **No Favorites Balanced Portfolio™**, utilizing the Borda Count methodology. Here, we simply rank actions by each theory’s preference ordering, aggregate the rankings, and select the option with the highest average placement. It’s perfect for those who prefer to avoid direct value comparisons entirely—think of it as the ethical equivalent of a low-volatility municipal bond. Stable, consensus-driven, and ideal for the conflict-averse philanthropist.  

  Of course, all moral investments carry inherent risks, meticulously outlined in our prospectus (Section 12: Compromise Action Disclosure). The MEC-optimized action may sometimes be one that *no single theory in your portfolio fully endorses*—a unique “blended position” achievable only through diversification. While statistically rare, such outcomes represent the cutting edge of meta-normative innovation. Additionally, our **Coalition Governance Package™** (automatically included in all portfolios) ensures efficient execution of your moral strategy. Your majority-held theories (e.g., utilitarianism and deontology) form a stable governing bloc for routine decisions, while minority positions (like your 5% long-termist allocation) remain in a consultative “fiduciary reserve” role. This prevents disruptive filibustering by fringe theories during time-sensitive dilemmas, though they may be activated for high-impact “special resolutions” like existential risk mitigation.  

  A final note on performance metrics: While some critics quibble that moral theories lack “objective probabilities” comparable to empirical events, we at Axiomatic respectfully disagree. Your credences reflect your sincere, epistemically privileged assessment of plausibility—and that’s the only bedrock we need. As our Chief Ethicist likes to say: “If you can assign a probability to a quantum fluctuation, you can assign one to contractualism.”^(1)  

  Mr. Ellis, your moral capital is poised for growth. Let Axiomatic Wealth Partners engineer a portfolio as nuanced as your conscience—because in today’s complex world, why settle for ethical monocropping?  

  Sincerely,  
  **Eleanor V. Thorne**  
  Senior Fiduciary Moral Advisor  
  Axiomatic Wealth Partners  

  ---
  ^(1) *Past moral performance is not indicative of future rectitude. Moral diversification does not eliminate the risk of profound regret or interpersonal condemnation. Axiomatic Choiceworthiness Units (ACUs) are theoretical constructs and not redeemable for intrinsic value. Consult your metaphysician before significant normative rebalancing. The Borda Count methodology may produce suboptimal outcomes under strategic voting conditions by rival moral agents. Coalition Governance tactics are subject to Arrow’s Impossibility Theorem restrictions. Fees apply.*
