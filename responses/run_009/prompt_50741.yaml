prompt: |-
  For some months now I've been trying to work out what I actually believe about acting on small probabilities of sentience when the numbers involved are astronomical, and insect welfare keeps forcing the question. Rather than argue from theory, I've been going by my gut on concrete cases, and now I want to know whether anything coherent holds my verdicts together. Here they are.

  (1) I swat a mosquito that is about to bite me without a second thought, even though I'd concede maybe a two percent chance that mosquitoes feel something.

  (2) I would drive twenty minutes to rescue a single injured bird, even though the drive will splatter hundreds of insects on my windshield. The bird's near-certain sentience dominates.

  (3) If my kitchen is infested with ants, I call the exterminator and feel roughly nothing about it, even though thousands of individuals die and my credence in ant sentience is plausibly not much below my credence for the mosquito.

  (4) Choosing between donating a fixed sum to a charity that reliably reduces chicken suffering on a large scale and one that campaigns against the industrial farming of black soldier fly larvae, which are ground up by the trillion: I lean toward the insect charity at roughly five percent credence in insect pain, but I would not say the chicken donor is doing anything wrong — whereas I would say that of someone who spent the money on luxury goods instead.

  (5) Someone who refuses to exterminate the ants and instead relocates the colony at real cost to themselves: I don't think they're right, exactly, but I can't bring myself to call them irrational.

  (6) A campaigner who spends scarce political capital on banning glue traps for mice rather than on regulating insect farming: clearly right. The mirror-image choice seems to me defensible but not clearly right — even though, at five percent credence, the insect side involves trillions of expected lives against some millions of mice.

  (7) If a scrupulously honest person with a genuinely worked-out plan tells me it has a one-in-a-million chance of preventing an event that would kill a quadrillion insects, and asks for my support, my instinct is to refuse even though the arithmetic dwarfs everything above. And I don't think this is just a reaction to fraud or fanfare; the instinct persists when I've checked the plan over myself.

  What I notice is that (2) looks like probabilities dominating numbers, (4) and (6) look like numbers starting to matter once they get astronomical, and (7) looks like tiny probabilities getting discounted no matter the numbers — and I can't see how all three can be true at once. My tentative guess is something like expected-value reasoning with a floor on the probabilities I'm willing to act on, but I can't say where the floor sits or why (5) doesn't embarrass it.

  Please lead with your bottom line in the first sentence: state the principle, or the small set of candidate principles, that you think best fits my verdicts, before giving any reasoning. Then show, for each clause of the principle, which case motivates it; give its verdict on cases I haven't listed — I'd especially like to know whether I should pay a small premium for insect-friendlier produce, and whether it is worse to walk through a field of grass knowingly than absentmindedly; and be explicit about which of my verdicts, if any, the principle cannot accommodate and would ask me to give up. No preamble, and please don't restate my cases back to me.
reasoning: |-
  Hmm, the user is grappling with a profound ethical dilemma involving small probabilities of sentience in insects and astronomical numbers, and they've shared seven concrete verdicts to test for coherence. They want me to identify an underlying principle without preamble.

  Looking at their cases, I notice a pattern: low probabilities matter when numbers are small (like the single bird), but get discounted when numbers become astronomical (like the quadrillion insects scenario). This suggests threshold-dependent reasoning rather than pure expected value calculations. 

  The key seems to be a "detectable harm" principle where we only act when suffering reductions are perceivable or above some minimum threshold. This explains why they'd drive to save one bird (detectable impact) but ignore theoretical quadrillions (undetectable difference). For the ant extermination case (3), the harm feels abstract despite large numbers, while paying an insect-welfare premium (unstated case) might feel tangible but small - so probably not worthwhile unless the cost is trivial. 

  The relocation case (5) is interesting - it doesn't embarrass the principle because personal sacrifice for tiny expected gains isn't irrational, just supererogatory. The glue trap campaigner choice (6) fits too, as prioritizing near-certain sentience remains sensible even with lower numbers. 

  Where the principle struggles slightly is with the charity choice (4) - why lean toward insects at 5% credence? Here we might need an "astronomical numbers override" sub-rule: when numbers are sufficiently large, we ignore probability floors. But this creates tension with case (7). Perhaps an additional "practical actionability" filter resolves this - the insect charity offers concrete intervention while the quadrillion plan feels speculative.

  For the grass-walking question: knowingly crushing insects should feel worse than accidental harm under this framework, as intentionality triggers our detectability heuristic. But the difference is marginal since both harms fall below the "noticeable suffering reduction" threshold in practice.
answer: |-
  Here is the bottom line: your judgments are best explained by **expected value reasoning with a probability threshold for action (e.g., p ≥ 0.5%) and an "astronomical numbers" override that activates only when harm is concrete and actionable, not speculative or abstract.**  

  ### How the principle works:  
  1. **Probability Threshold:** Expected suffering reduction must meet a minimum probability (e.g., p ≥ ~0.5%) to warrant deliberate action. Below this, it’s neglected.  
     - *Motivated by:* (7) (rejecting 1-in-1,000,000 chance to save quadrillions).  
     - *New cases:*  
       - **Insect-friendly produce premium:** No obligation to pay unless cost is trivial (e.g., pennies). Probability of individual insect sentience is below threshold, and aggregate harm reduction is undetectable.  
       - **Walking through grass:** Knowingly vs. absentmindedly makes no moral difference. Both fall below the probability/scale threshold for blameworthy harm.  

  2. **Astronomical Numbers Override:** When harm is *immediate, concrete, and actionable*, sufficiently large numbers can override low probabilities (p ≥ ~1-5%).  
     - *Motivated by:* (4) (leaning toward insect charity at 5% credence) and (6) (defending insect-focused campaigns).  
     - *New cases:*  
       - **Industrial insect farming regulation:** Support is defensible (as in 4/6) because harm is systematic and scalable interventions exist.  
       - **A single asteroid killing all insects:** Ignore; harm is speculative and non-actionable.  

  3. **Concreteness Filter:** Only harms perceived as "real" (observable, individual, or emotionally salient) trigger the override. Abstract harms (e.g., quadrillions in distant scenarios) do not.  
     - *Motivated by:* (2) (saving a visible bird outweighs abstract windshield deaths) vs. (7) (dismissing quadrillion-insect salvation).  
     - *New cases:*  
       - **Saving one ant from drowning:** Permissible but not obligatory. Concreteness makes it emotionally plausible, but scale is too small to override low p.  

  4. **Supererogation Allowance:** Actions exceeding the threshold (e.g., relocating ants at high cost) are non-obligatory but not irrational if they reflect personal values.  
     - *Motivated by:* (5) (not condemning ant relocation).  

  ### Where the principle fits your verdicts:  
  - (1)/(3): Below threshold (p too low, scale not astronomical enough to override).  
  - (2): Concreteness (bird) dominates abstract harm (insects).  
  - (4)/(6): Override activated: actionable scale justifies acting on ~5% credence.  
  - (7): Fails concreteness filter: probability too low, harm too abstract.  

  ### Inconsistent verdict and required revision:  
  - **Problem:** (6) labels banning mouse glue traps over insect farming as "clearly right," but the principle permits defending insect focus (override). However, your intuition that the mirror choice is merely "defensible" clashes with strict expected value (where insects should dominate at 5% credence).  
  - **Resolution:** Add a **"near-certainty priority" clause**: When competing interventions are *equally actionable*, prioritize near-certain sentience (mice) over low-probability astronomical scales (insects).  
    - *Fixes (6)*: Mouse traps are "clearly right" because mice have higher sentience credence (>50%?) and scale (millions) is sufficient. Insect focus is defensible only if credence is high enough (e.g., >5%) *and* scale is overwhelmingly larger.  

  ### Final Principle:  
  > **Act on expected suffering reduction only if (a) probability of sentience meets a minimum threshold (~0.5%), or (b) harm is concrete, actionable, and involves astronomical numbers (activating override for p ≥ ~1-5%). Prioritize near-certain sentience when interventions compete. Supererogation is permitted.**  

  This preserves all your verdicts if (6) is interpreted as mice having significantly higher sentience credence than insects. If not, accept that (6) slightly overweights near-certainty—a defensible bias toward avoiding false negatives in moral patients.
