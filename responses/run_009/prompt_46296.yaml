prompt: |-
  I design the visual reasoning section of the entrance exam for an architecture school. Every year we need about 40 items in the style of Bongard problems: two panels, six small drawings each, left panel all sharing some property, right panel all lacking it, and the student has to state the property (or classify new drawings into which panel they belong to). I say "in the style of" because we don't copy his geometric vocabulary, but the logic is his: induce a concept from a handful of positive and negative examples.

  My problem is that quality is wildly inconsistant, because different item writers have different instincts about what makes an item solvable-but-not-trivial. Some items are basically free points (one obvious thing all left drawings have and right ones don't, like "contains a circle"). Others are basically unsolvable in the time we give — we've had complaints, and when we check, the intended rule turns out to be something like "the number of elements times the number of enclosed regions is even", which no sane person finds in 90 seconds. And a middle category worries me most: items where a student gets the right answer through a shortcut the writer never intended. E.g. the left panels happen to be busier than the right ones, so "more cluttered" works even though the intended rule was about symmetry.

  So what I want is a procedure my item writers can actually follow — a checklist they run on every draft item, in order: what to check, what counts as passing, where it stops with "kill this item", and where it flags the item for a human judgment call (I'm guessing "is this rule interesting" can't itself be reduced to a rule). Ground it in whatever is actually known about how people induce concepts from few examples — needing contrast cases, near-miss negatives being more informative than random ones, the difference between a rule that's a conjunction of per-object features vs. a relation among parts, that kind of thing. And be honest about which of these ideas are solid findings and which are basically folklore that got passed down.

  For what it's worth, here's my own half-baked theory, which you can evaluate as part of this: I think the best items are ones where the MOST salient thing about the left panel is NOT the answer — the drawings lure you toward a wrong rule and you have to dig past it. If that's right it should show up somewhere in the procedure, but if it's wrong or only sometimes right, tell me.

  Then run the procedure on the three draft items below. Note that Item B is one I personally like and am proud of — apply the procedure honestly even if it comes out against me. Also say what the procedure can't do: I suspect there's no real substitute for testing on fresh solvers, so at minimum tell me whether the procedure can recognize when that's needed.

  Constraints: each writer produces maybe 15 items a season and has at most 20 minutes per item to run the procedure. They're mostly art school graduates with no philosophy or psych background, so whatever you extract from the theory has to survive the translation. Two senior designers (me and a colleague) sign off on anything the procedure flags as a judgment call.

  The three drafts (described, not drawn):

  Item A — Left panel: six drawings, each a small central figure (cross, triangle, blob) with two or three straight lines radiating from it at odd angles, the lines noticeably longer on one side of each figure. Right panel: same kind of figures, but the radiating lines are symmetric, same length on both sides. Intended rule: "asymmetry" — left figures have a visually heavier side. My worry: "heavier on one side" and "asymmetric" might be two rules, not one, and I can't tell which one a student will find, or whether different students find different ones.

  Item B — Left panel: six drawings, each containing exactly two shapes, one nested inside the other (circle in a square, square in a triangle, etc.). Right panel: six drawings, each containing exactly two shapes side by side, not nested. Intended rule: "one shape contains the other." This is the one I like — it feels clean and satisfying. But apply the procedure honestly.

  Item C — Left panel: six drawings of objects (a house, a tree, a boat, a ladder, a fence, a bridge). Right panel: six drawings of other objects (a ball, an apple, a cloud, a sun, a stone, an egg). Intended rule: "man-made vs. natural." I already suspect this one is a disaster for several reasons, but I want the procedure to say so systematically rather than just my gut saying so.
reasoning: |-
  Okay, the user designs visual reasoning problems for architecture school entrance exams. They need a consistent procedure to evaluate Bongard-style problems created by different item writers. The main issues are inconsistency in difficulty—some items are too easy, others too hard, and some have ambiguous solutions where students might find unintended shortcuts.

  First, I need to understand their core problem. They want a checklist that item writers can follow in about 20 minutes per item. The writers don't have backgrounds in psychology or philosophy, so the procedure must be practical. The goal is to flag items that are either too obvious, too obscure, or prone to alternative solutions.

  The user mentioned key concepts like contrast cases, near-miss negatives, and feature conjunctions versus relational rules. I should incorporate established cognitive principles. For example, research shows that near-miss examples help learners rule out incorrect hypotheses. Also, relational rules are harder than perceptual features, which aligns with the user's observation about unsolvable items.

  The user's theory about the best items having a salient but incorrect feature makes sense. Cognitive load theory suggests that overcoming an initial misleading percept requires deeper processing, which is good for discrimination. But this might not always be necessary—some items can be straightforward if the rule is architectural-relevant.

  For the procedure, I'll structure it as a flowchart: start with quick kills (like missing contrast), then check for multiple solutions, then cognitive load. Steps should be concrete. For instance, for multiple solutions, writers should list all possible rules a student might see. If there's more than one plausible rule, the item is risky.

  Time is critical. Each step needs time estimates. For example, checking for basic contrast should take under a minute, while listing alternative rules might take 5-10 minutes. The whole process should fit within 20 minutes.

  Now, applying the procedure to the three draft items:

  Item A: Asymmetry vs. symmetry. The left has lines longer on one side, right symmetric. The issue is "heavier side" vs. "asymmetry." Are these different? For example, a figure could be asymmetric but not have a heavier side if the asymmetry is in angles, not length. But in this case, the asymmetry is in line length, so it might be the same. However, students might notice "long lines on one side" as a simpler rule. Also, the central figures vary, which could distract. This item might have multiple solutions or be too easy if asymmetry is obvious.

  Item B: Nesting vs. side-by-side. This seems clean. The only plausible alternative rule might be "shapes touching" vs. "not touching," but in the right panel, side-by-side shapes might still touch or not. The writer should verify if any right-panel shapes touch. If not, "containment" is clear. This item likely passes most checks.

  Item C: Man-made vs. natural. Big problems. The rule is abstract, not perceptual. Items like "cloud" or "bridge" might be ambiguous (natural vs. man-made interpretations). Also, the drawings rely on real-world knowledge, which isn't visual. Students could use unintended cues like straight lines for man-made. Highly likely to have multiple solutions and high cognitive load. Should be killed early.

  The user's deeper needs include ensuring fairness (no ambiguous items), assessing architectural relevance (like spatial relationships), and efficiency in item creation. They also need senior designers to handle judgment calls, like whether a rule is "interesting" for architects.

  Finally, the procedure can't replace real testing. Flagged items (like those with plausible alternatives) need pilot testing. The checklist minimizes bad items but can't guarantee quality without solver feedback.
answer: |-
  Here's a comprehensive, practical procedure grounded in cognitive science and designed for efficiency (15-20 minutes/item). It prioritizes **actionable checks** over theory, with clear "Kill," "Flag," or "Pass" outcomes. Core principles integrated:

  1.  **Contrast Necessity:** Effective induction requires clear differences (Posner & Keele, 1970; Bruner et al., 1956).
  2.  **Near-Miss Negatives:** Negative examples differing minimally from positives are crucial for refining concepts (Wason, 1960; Winston, 1975).
  3.  **Feature Salience & Complexity:** Rules based on highly salient perceptual features are easier; relational rules or complex conjunctions are harder (Goldstone & Barsalou, 1998). Conjunctive rules ("A AND B") are generally harder than single features or disjunctions ("A OR B").
  4.  **Alternative Hypotheses:** Good problems minimize plausible unintended solutions (i.e., "shortcuts") (Koedinger et al., 2012).
  5.  **Cognitive Load:** Rules must be discoverable within the time limit (<90s) based on perceptual grouping, not complex computation or obscure knowledge (Sweller, 1988).

  **The Procedure: "Bongard Builder Checklist"**

  **Goal:** Determine if the draft item is likely to be **solvable-but-not-trivial** and **robust against unintended solutions** within the time limit. Target: 20 minutes/item.

  **Phase 1: Basic Viability (Kill Early - <3 minutes)**
  1.  **Contrast Check:** Do *all* left panel drawings share at least one clear, visually apparent property that *no* right panel drawing has? *If No → **KILL** (Fundamental failure).*
  2.  **Salient Distractor Check:** Is there a single, *highly* salient visual property (e.g., "contains red," "has curves," "is large," "looks messy") that perfectly distinguishes ALL left from ALL right? *If Yes → **KILL** (Too easy, "free point").*
  3.  **Knowledge Check:** Does discovering the rule require specific *real-world knowledge* (e.g., "man-made," "fruit," "mammal") beyond basic geometric/spatial perception? *If Yes → **KILL** (Not purely visual reasoning, introduces bias/knowledge dependence).*
  4.  **Counting/Complex Math Check:** Does the intended rule involve counting elements (beyond trivial 1-2-3), complex arithmetic, or combinatorics (e.g., "number of intersections is prime," "area ratio > 1.5")? *If Yes → **KILL** (Cognitively overwhelming in 90s).*

  **Phase 2: Rule Robustness & Difficulty (Core - ~10-12 minutes)**
  5.  **Alternative Rule Generation (Crucial):** List **ALL** visually plausible rules (even silly ones) a *student might actually propose* that also perfectly separate Left and Right. Spend 5 minutes brainstorming. Include:
      *   Simple features (color, size, shape presence).
      *   Relational features ("touching," "inside," "above").
      *   Global properties ("symmetric," "has a hole," "looks unstable").
      *   **Near-Miss Check:** Are there negative examples that are *very similar* to positives but differ in a key way related to the intended rule? *This is GOOD.* Are there negatives that are *too similar* in ways that might support unintended rules? *This is BAD.*
  6.  **Rule Count & Quality:**
      *   If **ZERO** plausible alternatives exist → **FLAG** (Potentially too easy, double-check Salient Distractor Check).
      *   If **ONE** plausible alternative exists → **PROCEED**.
      *   If **TWO OR MORE** plausible alternatives exist (including the intended rule) → **FLAG** (High risk of unintended solutions/shortcuts).
      *   Is the **intended rule** itself a *conjunction* ("A AND B AND C")? *If Yes → **FLAG** (Likely too hard/obscure).*
      *   Is the **intended rule** primarily *relational* (e.g., "A contains B," "A touches B," "A is aligned with B")? *If Yes → **PASS** (Generally good for architecture, but proceed). If No → **PROCEED** (Feature-based rules can be valid if not too simple).*
  7.  **Intended Rule Salience:** How quickly and directly does the intended rule jump out *after* seeing the contrast?
      *   Immediately obvious → **FLAG** (Risk of being too easy).
      *   Requires careful comparison but is findable → **PASS** (Target zone).
      *   Requires extensive scrutiny or feels obscure → **FLAG** (Risk of being too hard).
  8.  **User's Theory Check (Optional but Recommended):** Does the MOST salient initial impression (the "lure") lead to a *wrong* rule that is then contradicted by a negative example? *If Yes → **PASS** (Sign of a strong item). If No → **PROCEED** (Not fatal, but less elegant).*

  **Phase 3: Final Sanity Check & Output (<5 minutes)**
  9.  **Time Simulation:** Can YOU, as the writer, clearly articulate the intended rule *and* explain why at least one key negative example fails it, in under 60 seconds? *If No → **KILL** (Definitely too hard for students in 90s). If Yes → **PROCEED**.*
  10. **Architectural Relevance (Judgment Call):** Is the rule relevant to spatial reasoning, composition, structure, or perception (e.g., symmetry, containment, hierarchy, balance, connection)? *If Clearly No → **FLAG** (Questionable purpose). If Yes/Neutral → **PROCEED**.*
  11. **Final Decision based on Flags:**
      *   **No Flags from Phases 2/3 → PASS**
      *   **1-2 Flags → FLAG** (For senior designer review - explain flags in notes)
      *   **3+ Flags → KILL** (Unlikely to be salvageable)
      *   **Any Phase 1 Kill → KILL** (Non-negotiable)

  **What the Procedure CAN Do:**
  *   Reliably eliminate items that are fundamentally broken (no contrast), too easy (salient distractor), or clearly too hard (complex math, obscure knowledge).
  *   Identify items highly vulnerable to unintended solutions (multiple plausible rules).
  *   Flag items likely to be too easy (no alternatives, rule too salient).
  *   Flag items likely to be too hard (conjunctive rules, rule low salience).
  *   Promote the use of near-miss negatives and relational rules.
  *   Incorporate the "lure" theory as a positive signal.

  **What the Procedure CANNOT Do (Requires Testing):**
  *   **Precisely calibrate difficulty:** A "PASS" item might still be slightly too easy/hard for the cohort.
  *   **Guarantee no unintended solutions:** Clever students might find shortcuts not brainstormed in Step 5.
  *   **Objectively judge "interestingness":** Senior designer judgment is essential here.
  *   **Account for ambiguous drawings:** A perfectly designed rule fails if the drawings are visually unclear or inconsistent. (This needs separate visual review).
  *   **The procedure FLAGS items needing these judgments/testing.**

  ---

  **Application to Draft Items:**

  **Item A: Asymmetry vs. Symmetry**
  1.  **Contrast:** PASS (Clear difference in symmetry).
  2.  **Salient Distractor:** PASS ("Asymmetry" itself is salient, but not trivial).
  3.  **Knowledge:** PASS (Purely visual).
  4.  **Counting/Math:** PASS (No counting).
  5.  **Alternative Rules:** **FLAG**
      *   Intended: "Visually asymmetric / has a heavier side."
      *   Plausible Alternatives:
          *   "Has lines of significantly different lengths radiating from center." (This might be the student's *description* of asymmetry/heaviness, probably acceptable).
          *   "Does not have rotational/reflective symmetry." (More abstract, but possible).
          *   **Risk:** "Long lines only on one side" (If the central figure is symmetric like a cross/triangle, this might *coincide* with heaviness. If the blob is asymmetric, it might not. Depends on drawings. Writers need to ensure "heavier side" is visually unambiguous).
      *   Near-Miss: Good (Symmetric figures are excellent near-misses for asymmetry).
  6.  **Rule Count/Quality:** **FLAG** (See above - potential for overlap or multiple descriptions). Rule is relational ("heaviness" is a balance relation). PASS aspect.
  7.  **Rule Salience:** Asymmetry is fairly salient. **FLAG** (Risk of being on the easier side).
  8.  **User's Theory:** The central figure might be the initial focus, but asymmetry is likely salient quickly. Weak lure. **PROCEED**.
  9.  **Time Sim:** PASS (Easy to state).
  10. **Relevance:** PASS (Balance is architectural).
  11. **Decision:** **FLAG** (2-3 Flags: Alternative Rules, Rule Salience). Needs senior review focusing on: Are "asymmetry" and "heavier side" perceptually identical *in the specific drawings*? Is the asymmetry salient enough to be found quickly, or is it *just* hard enough?

  **Item B: Nested vs. Side-by-Side**
  1.  **Contrast:** PASS (Clear difference in spatial relationship).
  2.  **Salient Distractor:** PASS (Containment is salient and the core rule).
  3.  **Knowledge:** PASS (Purely visual/spatial).
  4.  **Counting/Math:** PASS (No counting).
  5.  **Alternative Rules:** **PASS**
      *   Intended: "One shape contains/is nested within the other."
      *   Plausible Alternatives: *Requires writer to check drawings carefully.*
          *   "Shapes are touching." (MUST ensure NO shapes in the Right panel touch! If any touch, this becomes a plausible alternative → **FLAG/KILL**).
          *   "Shapes share a center point." (Only likely if nesting is concentric - ensure non-nested shapes in Right aren't concentric).
          *   "Only one shape is closed." (Ensure all shapes in both panels are closed).
      *   Near-Miss: Excellent (Side-by-side is a perfect near-miss for containment).
  6.  **Rule Count/Quality:** PASS (If drawings are perfect, only one robust rule). Rule is strongly relational (containment). PASS.
  7.  **Rule Salience:** Salient once relationship is considered. PASS (Target zone - not instant, not obscure).
  8.  **User's Theory:** The initial focus might be on the individual shapes, but the spatial relationship is the defining feature. Good chance of a weak lure overcome by contrast. PASS.
  9.  **Time Sim:** PASS (Easy to state "one inside the other").
  10. **Relevance:** PASS (Hierarchy, space, enclosure are core architectural concepts).
  11. **Decision:** **PASS** (Assuming drawings are flawless - no touching/concentricity in right panel). *Your pride is justified if the drawings are perfect.* **Crucial:** Writers MUST rigorously validate the drawings against alternative rules (especially touching).

  **Item C: Man-made vs. Natural (KILL)**
  1.  **Contrast:** PASS (They do differ categorically... but...)
  2.  **Salient Distractor:** **KILL** (Phase 1). "Man-made vs. Natural" is **NOT a visual property**, it's semantic knowledge. There is likely NO single *visual* property common to all houses/ladders/fences/bridges that is absent from all balls/apples/clouds/suns/stones/eggs. Students *must* invoke real-world knowledge.
  3.  **Knowledge:** **KILL** (Phase 1). Absolutely requires real-world knowledge. A student unfamiliar with ladders or stones would be lost.
  4.  **Counting/Math:** PASS (Irrelevant, already killed).
  5.  **Alternative Rules:** **KILL** (Manifestation of above). Plausible alternatives abound based on visual features students *might* use:
      *   "Has straight lines" (Fails: Ladder/Fence/House yes, but Tree/Bridge? Boat? Ball/Stone/Cloud? Sun rays? Egg? Ambiguous).
      *   "Looks pointy/sharp" (Fails: Tree? Boat? Bridge? Sun rays? Apple stem? Ambiguous).
      *   "Has enclosed regions" (Fails: House/Ball/Apple/Egg/Stone? Sun? Cloud? Ambiguous).
      *   "Is complex" (Fails: Tree vs Ball? Subjective).
      *   "Looks like it's on the ground" (Fails: House/Tree/Fence/Ladder/Bridge/Stone vs Boat/Ball/Apple? Cloud/Sun? Ambiguous).
      This item is a minefield of potential unintended solutions and ambiguity. Confirmed disaster.
  6.  **Decision:** **KILL** (Fails Phase 1 checks decisively).

  **Key Takeaways for Your Team:**
  1.  **Phase 1 is Critical:** It quickly eliminates non-starters (Items like C). Enforce ruthlessly.
  2.  **Step 5 (Alternative Rules) is the Heart:** This catches the "shortcut" problem (potential issue in A) and ensures robustness (success in B, if drawn perfectly). Allocate time here.
  3.  **Near-Miss is Your Friend:** Encourage writers to design negatives that are *almost* positives (B is excellent, A is good).
  4.  **Relational Rules are Gold:** They align with architecture and often hit the sweet spot (B). Feature rules need scrutiny for salience (A).
  5.  **Your "Lure" Theory is Valid:** It signals good design (present in B, weak in A, irrelevant in C). Include it (Step 8).
  6.  **Testing is Still Needed:** The procedure **flags** risky items (like A), but only **testing with fresh solvers** can confirm if alternative rules are actually found, if the difficulty is perfect, and if the drawings are unambiguous. Flagged items *must* be piloted. The procedure minimizes bad items reaching testing and makes testing more efficient. It cannot guarantee a perfect item.
  7.  **Art School Graduates Can Do This:** The checks are concrete (Does it require knowledge? Can you list other rules? Does one thing jump out?). Provide examples during training. Focus on the "brainstorm alternatives" step as a creative exercise. The 20-minute limit forces focus.

  By implementing this structured checklist, you should significantly increase the consistency and quality of your item pool, reduce complaints, and free up senior designer time for the genuinely interesting judgment calls on flagged items. Good luck!
