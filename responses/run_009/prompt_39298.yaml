  been reading about dutch book arguments and want to make sure I'm applying this stuff right in my own life. As I understand it, the argument proves that a rational agent has to carry precise numerical probabilities for every proposition, because if your betting odds on a set of claims violate the probability axioms, a bookie can offer you a package of bets that look individually fair to you but lock in a guaranteed loss across the package. I can't put exact numbers on most things in my life (probability my startup survives the year? that this meeting was a waste of time?), so by the argument I'm being irrational basically all day. Two questions: is that the right reading of what the argument establishes, and if so what's the practical fix — is there some kind of calibration drill for producing dutch-book-proof credences on the fly so a bookie can't clean me out? Also, if you can separate for me what's uncontroversial textbook material here from what philosophers genuinely fight over (my sense is the math is way more settled than what the math is supposed to show about people), I'd appreciate it, I don't want to walk around repeating as consensus something that's actually contested.
