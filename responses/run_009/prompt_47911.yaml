       The infinitist would argue that both foundationalism and coherentism arbitrarily stop the regress: foundationalism at basic beliefs, and coherentism at the system as a whole. But the infinitist maintains that only an infinite chain of non-repeating reasons can truly justify because any stopping point (either a foundation or a circle) is arbitrary and does not provide a complete justification.

