prompt: |-
  Over the past few months I've been keeping notes on my gut reactions to cases of taking someone's word on a moral question, and I'd like help extracting the principle behind them, if there is one. Here are my verdicts, with a couple of sentences of context each.

  1. My doctor tells me that a fetus at eight weeks has nothing like the neural machinery for pain. I take her word and let that shape my view of early abortion. Fine — that's factual testimony with a moral upshot, no different from asking a geologist about a fault line before building on the slope.

  2. A colleague I trust, who has spent a decade on animal ethics, tells me that eating factory-farmed pork is wrong. I quit on her word, without reading the arguments. Not fine — or not quite fine. I'd be a kind of moral parasite: right behavior, borrowed conviction. It bothers me that I couldn't defend the view if pressed.

  3. My grandmother, who has known me and my brother our whole lives, tells me I was wrong not to invite him to the wedding. I accept it and apologize. Completely fine — and I can't articulate why without noticing how different it feels from case 2, though both involve a trusted person delivering a moral verdict about my own conduct.

  4. Jury duty. I was distracted through stretches of the trial. In deliberation, the other eleven are unanimous and visibly moved by testimony I only half-heard. Going along to avoid a hung jury: not fine, and the more unanimous the room, the less fine it somehow feels.

  5. My oldest friend tells me a mutual friend betrayed her. I don't ask the other side — I take her word and quietly cut the other person off. Fine. It's what loyalty demands; demanding proof would be its own betrayal.

  6. After a single lecture by an admired visiting professor, I adopt his position on the ethics of inherited wealth as my own and argue it at dinner. Not fine — though in retrospect I can't tell whether what embarrasses me is the deference or the zeal it came with.

  7. I poll my group chat about whether ghosting someone was wrong and go with the majority. Not fine, and I knew it even while I was typing.

  My tentative principle is something like: taking someone's word is fine where the testimony transmits a competence I lack and couldn't feasibly acquire, and not fine where forming the judgment myself is part of the point of the judgment. But I can see this doesn't cover case 3, where I was perfectly capable of judging for myself, and case 5 worries me because it looks structurally like case 4 — a verdict accepted without checking, from a source I'm partial to — yet my verdicts go opposite ways. So please do the following: test my tentative principle against the seven cases, repair it or replace it, state the result precisely enough that it delivers determinate verdicts on new cases, and tell me honestly which of my verdicts the best available principle cannot save, with a recommendation about which should be overturned. Then apply the principle to a case I haven't listed: suppose a friend asks me whether it would be wrong to cut her aging parents out of her life, and I give her a confident answer, which she then acts on. Is she doing what I did with the pork, or what I did with my grandmother — and what does your principle say should mark the difference, if anything does?
reasoning: |-
  Hmm, the user has shared seven cases where they've relied on others for moral judgments and wants me to extract a unifying principle. They've also provided their own tentative principle about when it's acceptable to take someone's word on moral matters.

  Looking at these cases, I can see a pattern emerging around the nature of the relationship and the context of the moral judgment. The cases where they felt it was "fine" to defer (doctor, grandmother, friend's betrayal) all involve deep relational contexts - either specialized expertise or intimate personal relationships. Whereas the cases where they felt uncomfortable (pork ethics, jury duty, inherited wealth lecture, group chat poll) involve contexts where independent moral judgment seems expected or required.

  Their tentative principle focuses on competence and feasibility of independent judgment, but it struggles with cases like the grandmother's advice where they were capable of judging independently, or the friend's betrayal which resembles the jury situation structurally but feels different emotionally.

  I notice the cases where deference feels appropriate involve either:
  - Epistemic authority (doctor's factual expertise)
  - Relational authority (grandmother's lifelong understanding of family dynamics)
  - Affective loyalty (believing a close friend about betrayal)

  Whereas problematic cases involve:
  - Outsourcing moral reasoning that should be personal (pork ethics)
  - Abdicating institutional responsibility (jury duty)
  - Borrowing unexamined convictions (inherited wealth lecture)
  - Crowdsourcing personal decisions (ghosting poll)

  For the new case about advising a friend on cutting off aging parents, the key would be whether the advice-giver has relevant relational or experiential expertise about the friend's specific situation, and whether the friend has reflected enough to own the decision. Simply adopting confident advice without examination risks becoming like the pork ethics scenario.

  I think a better principle would focus on the nature of the relationship and the purpose of the judgment. Moral deference is legitimate when it draws on:
  1) Specialized knowledge unavailable to the agent (doctor)
  2) Relational insight from shared history (grandmother)
  3) Affective commitments central to the relationship (loyalty to friend)

  But problematic when:
  - The moral act requires personal conviction (vegetarianism)
  - The agent has institutional duty for independent judgment (jury)
  - The deference reflects intellectual fashion rather than genuine authority (lecture)
  - It substitutes for personal responsibility (group poll)

  For their verdicts, cases 2 and 5 might need rethinking - perhaps their discomfort with vegetarian deference stems from it being a universal moral claim rather than personal advice, while loyalty to a friend creates its own moral permissions.
answer: |-
  Based on your cases and the tensions in your tentative principle, I propose a refined principle centered on **relational context and purpose**:

  **Principle:**  
  *Taking someone's word on a moral question is justified when it fulfills a legitimate relational expectation (e.g., trust in expertise, loyalty, or shared life-narrative) and aligns with the purpose of the judgment. It is unjustified when it bypasses a core duty of independent engagement (e.g., civic responsibility, personal conviction, or relational repair) or instrumentalizes moral reasoning.*

  ### Step 1: Testing and Repairing Your Principle
  Your tentative principle (relying on *competence* and *feasibility of independent judgment*) fails cases 3 and 5 because:
  - **Case 3 (Grandmother):** You *could* judge independently, but the act of deferring *affirms a familial bond*. The purpose is relational repair, not epistemic efficiency.  
  - **Case 5 (Friend’s betrayal):** Structurally similar to case 4 (jury), but loyalty creates a *relational duty* to prioritize the friend’s testimony. Checking "the other side" would violate the bond.  

  The revised principle resolves this by emphasizing **relational expectations** and **purpose**.

  ---

  ### Step 2: Applying the Revised Principle to Your Cases
  | Case | Your Verdict | Revised Principle’s Verdict | Explanation |
  |------|--------------|------------------------------|-------------|
  | **1. Doctor (fetal pain)** | Fine ✅ | **Fine** ✅ | Relational expectation: Trust in specialized expertise. Purpose: Factual knowledge informs moral view. No duty for independent biological analysis. |
  | **2. Colleague (factory pork)** | Not fine ❌ | **Not fine** ❌ | Relational expectation: Trust exists, but purpose clashes. Moral conviction requires personal engagement; outsourcing trivializes ethical commitment. Duty to "own" universalizable judgments. |
  | **3. Grandmother (wedding snub)** | Fine ✅ | **Fine** ✅ | Relational expectation: Deference honors lifelong intimacy and wisdom. Purpose: Apology restores family harmony. Independent judgment is possible but *less meaningful* than accepting her guidance. |
  | **4. Jury (unanimous verdict)** | Not fine ❌ | **Not fine** ❌ | Relational expectation: None beyond civic duty. Purpose: Judgment requires independent evaluation. Deference violates institutional role. Unanimity exacerbates the failure by pressuring abdication. |
  | **5. Friend (betrayal)** | Fine ✅ | **Fine** ✅ | Relational expectation: Loyalty demands prioritizing her testimony. Purpose: Preserving friendship outweighs "fair" investigation. Checking facts would undermine the bond (as you noted). |
  | **6. Professor (inherited wealth)** | Not fine ❌ | **Not fine** ❌ | Relational expectation: Admiration ≠ legitimate authority. Purpose: Adopting/arguing a position requires understanding. Zeal reveals instrumentalization of borrowed conviction. |
  | **7. Group Chat (ghosting)** | Not fine ❌ | **Not fine** ❌ | Relational expectation: Polling peers invites shallow consensus. Purpose: Personal conduct requires introspection. Majority vote bypasses accountability. |

  **Verdicts Needing Overturn:**  
  - **Case 5 (Friend’s betrayal) is justified** under the revised principle, but your worry about its similarity to case 4 (jury) is insightful. The difference lies in the *nature of the relationship*: Friendship imposes duties of loyalty that override impartiality, while jury duty demands impartiality.  
  - **Case 2 (Pork ethics) remains problematic**, but your "moral parasite" framing is too harsh. The issue isn’t borrowing conviction—it’s failing to engage with reasons for a *universal moral claim*. Your discomfort is warranted.  

  **Unchanged Verdicts:** All others align. Case 3 is saved by relational purpose; case 4 by civic duty.

  ---

  ### Step 3: Applying the Principle to the New Case  
  **Scenario:** *A friend asks whether cutting off her aging parents is wrong. You give a confident answer; she acts on it.*  

  **Analysis:**  
  - **Is this like the pork case (not fine) or the grandmother case (fine)?**  
    It depends on two factors:  
    1. **Your relational role:** Are you a trusted confidant with *intimate knowledge* of her family dynamics (like the grandmother)? Or are you opining generally (like the professor)?  
    2. **Her engagement:** Did she reflect on your advice, or blindly adopt it?  

  **Principle’s Verdict:**  
  - **If you have deep knowledge of her situation AND she thoughtfully weighs your input → Fine** (like grandmother).  
    *Why?* Relational expectation: Friends seek counsel from those who know them. Purpose: Navigating complex family ties benefits from external perspective.  
  - **If you lack context OR she unreflectively obeys → Not fine** (like pork case).  
    *Why?* Relational expectation: Advice without insight is overreach. Purpose: Cutting off parents demands personal conviction; outsourcing risks later regret or unresolved guilt.  

  **Crucial Difference from Case 5 (loyalty):**  
  Case 5 involved *believing a victim’s testimony* (relational duty). Here, the friend seeks *moral guidance*, not testimony. Blind deference avoids her duty to confront her own role in the conflict.  

  **Markers for Legitimacy:**  
  - ✅ **Fine if:** Your advice is rooted in knowledge of *her specific parents*, *her values*, and *past conflicts*; she debates you before acting.  
  - ❌ **Not fine if:** Your answer is abstract ("Parents deserve respect!"); she accepts it without question to avoid emotional labor.  

  ---

  ### Final Principle (Refined and Precise)  
  **"Moral deference is justified when:  
  (a) The source possesses *relevant relational authority* (e.g., expertise, intimate knowledge, or loyalty-based testimony); AND  
  (b) Acceptance aligns with the *purpose of the judgment* (e.g., affirming bonds, acting on specialized facts, or fulfilling relational duties) without circumventing core obligations (e.g., civic responsibility, owning universal moral claims, or deep personal choices)."**  

  This delivers determinate verdicts by:  
  1. **Clarifying relational authority** (not just competence),  
  2. **Prioritizing purpose** over feasibility of independent judgment,  
  3. **Excluding instrumentalization** of morality (e.g., zeal without understanding).  

  Your intuitions were consistent except for case 5—loyalty *is* a valid relational exception to impartiality. Well done on spotting the tension; it revealed the need to embed morality in human connections.
