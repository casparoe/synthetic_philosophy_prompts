answer: |-
  ## The St. Petersburg Paradox: Why Five Replies Aren't Enough

  You're right to be suspicious. The confident dismissals in LessWrong/OB threads offer useful *constraints* on the paradox but rarely grapple with its deep challenge to the foundations of decision theory. They often change the subject or quietly redefine rationality. Let's dissect the beast properly.

  **The Setup Revisited:**
  A fair coin is flipped until the first heads appears on toss `n`. You win `$2ⁿ`. The expected monetary value (EMV) is:
  `E = (1/2)*$2 + (1/4)*$4 + (1/8)*$8 + ... + (1/2ⁿ)*$2ⁿ + ... = $1 + $1 + $1 + ... = ∞`
  Yet, virtually no sane person pays more than ~$25 to play. This *is* a paradox for naive EMV maximization as a universal criterion for rational choice.

  **Standard "Resolutions" and Their Hidden Costs:**

  1.  **Finite Bankroll (Truncation):**
      *   **What it buys:** Realism. No counterparty has infinite wealth. If the casino's max payout is `$2^M`, the EMV becomes finite: `E = Σ_{n=1}^M (1/2ⁿ)*2ⁿ + Σ_{n=M+1}^∞ (1/2ⁿ)*2^M = M + 1`. For M=40 (~$1.1 trillion), E=$41.
      *   **The Cost:** It changes the *game*. The paradox explicitly involves an *infinite* expectation. Truncation solves a *different*, more practical problem. It doesn't address the *theoretical* challenge: **Why does our intuition rebel against an infinite EMV *even in the idealized case*?** It also begs the question of *where* to truncate – why M=40 and not M=100? The paradox highlights a discontinuity between finite-but-large-M and infinite-M.

  2.  **Diminishing Marginal Utility (Concave Utility, e.g., log($)):**
      *   **What it buys:** Psychologically realism (Bernoulli's original solution). The utility of `$2ⁿ` isn't `2ⁿ` but something like `log₂(2ⁿ) = n`. Expected Utility (EU) becomes `Σ (1/2ⁿ)*n = Σ n/2ⁿ = 2` (finite!). This aligns with low willingness-to-pay (WTP). It preserves the core EU maximization framework by replacing dollars with utils.
      *   **The Cost:** **It fundamentally changes the theory of value.** Rationality is no longer about maximizing expected *money* but expected *utility*, where utility is bounded (as `n` grows, `log($2ⁿ) = n` grows linearly, but the *probability* `1/2ⁿ` decays exponentially). The "cost" is accepting that rationality *requires* this transformation. Crucially, it assumes utility *is* concave in dollars, which might not hold universally (see "Pooled Wealth" wrinkle). It also sidesteps the question: *Why* is utility concave? The paradox reveals this concavity as essential for finite valuation under unbounded payoffs.

  3.  **Risk Aversion:**
      *   **What it buys:** Captures the intuition that the tiny chance of a huge loss (the stake) outweighs the huge-but-vanishingly-small chance of an enormous win for many people. Formalized via concave utility (closely related to point 2) or direct preference models.
      *   **The Cost:** Like concave utility, it modifies the core theory (EU) and defines rationality as sensitive to the *distribution* of outcomes, not just the mean. It raises the question: Is risk aversion a rational correction or an irrational bias? The paradox forces us to confront that pure EMV maximization *is* "risk neutral" and that humans aren't – but is that human irrationality or a flaw in risk-neutral EMV as a normative ideal? The paradox challenges the normative status of risk-neutral EMV.

  4.  **Kelly Criterion / Time-Average Growth (Ergodicity Economics):**
      *   **What it buys:** Shifts focus from single-play EMV to long-term wealth growth rate. For a single, all-in play, Kelly often recommends a fractional bet or avoidance. For repeated plays, it provides an optimal betting fraction (`f*`) maximizing the exponential growth rate `G = E[log(1+f*return)]`. For St. Petersburg, calculating `f*` is complex, but the stake required for `f*=1` (betting full bankroll) would be astronomically high relative to bankroll, making the recommended stake low.
      *   **The Cost:** **It changes the problem domain.** Kelly is fundamentally about *repeated*, *fractional* betting with reinvestment. The St. Petersburg paradox, as classically posed, is about a *single*, *all-in* play for a fixed stake. Applying Kelly requires redefining the game. It also introduces the concept of "ergodicity breaking" – the ensemble average (EMV) ≠ time average (growth rate) – as the core issue. This is a profound shift, suggesting rationality should *always* prioritize time-average growth, even in single-shot scenarios where ensemble averages diverge. This is a significant revision of standard decision theory.

  5.  **Rejecting Unbounded Utility:**
      *   **What it buys:** Instant dissolution. Declare that utility functions *must* be bounded (e.g., `U($) < U_max` for all `$`). Then `EU ≤ U_max`, always finite. The St. Petersburg payoff stream, despite infinite EMV, has finite EU.
      *   **The Cost:** **It's a nuclear option.** It solves the paradox by axiomatically forbidding it. But why *must* utility be bounded? Can we truly not conceive of scenarios where outcomes are ordered such that no finite bound captures their value (e.g., saving 1 life vs. 10 vs. 1000 vs. 1e100...)? This move cripples our ability to model many ethical dilemmas involving vast stakes (e.g., Pascal's Mugging, longtermism). It feels less like a solution and more like a suppression of the underlying problem: how to handle infinite expectations within a coherent decision theory.

  **Grappling with the Wrinkles:**

  1.  **The Resale Puzzle (Selling vs. Buying):**
      *   Your gut says: Sell a ticket you own for $100, but refuse to buy one for $100. Symmetry suggests these prices should match under standard EU theory with a stable utility function.
      *   **What this reveals:** This asymmetry screams **reference dependence** and **loss aversion** (core tenets of Prospect Theory, not standard EU). Owning the ticket establishes a reference point. Selling it for $X feels like gaining $X. Buying it for $X feels like losing $X to gain a risky prospect. Loss aversion (losses loom larger than gains) makes the buying price lower than the selling price. The ticket itself is a "bird in the hand" with a certain (low) certainty equivalent. Buying requires parting with a sure thing for risk.
      *   **The Verdict on Symmetry:** Expected Utility theory (with a *stable*, context-independent utility function) *predicts* symmetry. The observed asymmetry is a strong empirical strike *against* descriptive EU theory. Normatively, it's murkier. Does loss aversion reflect a rational adjustment for genuine regret/disappointment, or is it a cognitive bias? The paradox itself doesn't force asymmetry; human psychology does. This wrinkle highlights that the paradox isn't just about infinite EMV; it's also about how real agents value *risky prospects relative to sure things*, and standard EU may be descriptively inadequate and normatively contested here.

  2.  **The Pooled-Wealth/Altruist Challenge:**
      *   Scenario: You allocate capital for a vast altruistic fund (`$A`). Its utility `U($)` is linear in dollars saved for its cause (e.g., micromorts averted, QALYs gained) over the relevant scale. The counterparty (e.g., "Nature" or a cosmic casino backed by a multi-galactic economy) genuinely can pay `$2ⁿ` for any `n`.
      *   **Does the paradox roar back?** **Yes, resoundingly.** Concavity was carrying the weight. With linear utility, EU *is* EMV: `EU = Σ (1/2ⁿ) * U($2ⁿ) = k * Σ (1/2ⁿ) * 2ⁿ = k * Σ 1 = ∞` (for some constant `k` scaling dollars to utility).
      *   **Should the rationalist altruist bite the bullet?** **Conditionally, yes.** *If*:
          *   Utility is truly linear in dollars over the entire range of possible payoffs (`$2` to `$2ⁿ` for arbitrarily large `n`).
          *   The counterparty's ability to pay `$2ⁿ` for any `n` is unquestionable.
          *   There are no alternative investments with infinite expected utility.
          *   The fund's capital `$A` is finite but large enough that paying a finite stake `$S` doesn't meaningfully alter the marginal utility per dollar *if they lose*.
      *   ...then, **rationally, they should be willing to pay any finite stake `$S` to play.** `∞ > S`, always. This is the "fanaticism bullet" applied to St. Petersburg. Refusing to pay `$S` means rejecting the dominance of infinite EU over finite `$S`.
      *   **The Catch:** These conditions are astronomically improbable in reality. True linearity over 50+ orders of magnitude of wealth is implausible (even for an altruist fund, priorities or cause-effectiveness might change at scales that dwarf current global GDP). Guaranteed payment of `$2¹⁰⁰` is physically impossible. *In practice*, these constraints (effectively re-introducing concavity, counterparty risk, and physical limits) dominate, preventing the fanatical conclusion. But *in the idealized thought experiment where they hold*, the EU maximizer *must* pay any finite price. This exposes the **fragility of finite willingness-to-pay:** it relies critically on concavity or bounds that *might* fail for agents with effectively linear utility over vast scales facing truly cosmic payoffs.

  **The Definite Verdict:**

  **The St. Petersburg paradox *is* a genuine defect in the theory of rational choice *if* that theory is defined as maximizing expected monetary value (EMV) or expected utility (EU) *with unbounded utility functions*.**

  *   **EMV Maximization:** Utterly fails. It prescribes insanity (mortgaging galaxies to play).
  *   **EU with Unbounded Utility:** Also fails. It prescribes the same fanaticism (`EU = ∞` beats any finite cost).

  **Dissolution requires modifying the theory.** There is no cost-free "fix" that leaves naive EMV or unbounded EU intact. The viable resolutions all impose significant structure:

  1.  **Bounded Utility:** Dissolves the paradox axiomatically. **Cost:** Limits the scope of decision theory, making it unable to model genuinely open-ended value hierarchies without arbitrary bounds. Feels ad hoc to many.
  2.  **Concave Utility (e.g., log):** Dissolves the paradox for realistic agents. **Cost:** Fundamentally redefines rationality away from EMV maximization and assumes a specific (albeit plausible) psychology of value. Fails for the Pooled-Wealth Altruist.
  3.  **Kelly/Ergodicity:** Dissolves the paradox for repeated investment. **Cost:** Radically redefines the problem and the core objective of rationality (time-average growth over ensemble expectation). Not directly applicable to single-shot play without conceptual stretching.
  4.  **Finite Resources:** Dissolves the *practical* paradox. **Cost:** Abandons the *theoretical* challenge of the infinite game. Doesn't explain the intuitive aversion to the ideal case.

  **The Fully Worked-Out Position (Conditional Verdict):**

  **For individual humans making personal financial decisions, the paradox is robustly dissolved by the combination of counterparty risk (finite bankroll truncation) and the concavity of utility in wealth (Bernoulli's solution within EU framework).** This is the "standard resolution" for a reason – it accurately describes reality and aligns with observed behavior. Kelly provides valuable reinforcement for repeated gamblers.

  **However, the paradox remains a profound *conceptual* challenge to the foundations of decision theory.** It reveals that:

  *   **Unbounded value leads to fanaticism.** Expected Utility theory with unbounded utility mandates paying any finite cost for any non-zero probability of infinite gain (`∞ * p > S` for any finite `S` and `p > 0`). St. Petersburg is a specific, elegant instance of this general problem (Pascal's Mugging is a more extreme cousin).
  *   **Linearity + Scale Breaks Concavity.** The Pooled-Wealth Altruist scenario shows that if an agent's utility *is* effectively linear over the relevant scale and counterparty risk is eliminated, the paradox forces the fanatical conclusion. Rationalists endorsing linear utility for altruism *must* bite this bullet in the idealized case or find a principled reason why the idealized case is incoherent (e.g., rejecting unbounded payouts as physically impossible or defining utility such that linearity inevitably breaks at extreme scales).
  *   **Behavior Exceeds Simple EU.** The Resale Puzzle highlights descriptive failures of stable-EU and suggests reference dependence is fundamental to understanding actual choice.

  **Therefore, the St. Petersburg paradox is not "trivially dissolved." It is a razor testing the coherence and scope of our decision theories.** It forces us to choose our axioms: bounded utility, concave utility, ergodicity focus, or acceptance of fanaticism under linearity and infinite stakes. There is no resolution without cost. The confidence in five-reply dismissals is indeed misplaced; it stems from applying practical constraints (finite bankrolls, human risk aversion) to evade the deeper theoretical wound the paradox inflicts on unbounded, linear, risk-neutral valuation. The paradox endures as a monument to the challenge of uniting rationality, infinity, and human intuition.
