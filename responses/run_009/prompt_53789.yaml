  ### Key Principles from Kelly and Geometric Growth
  - The Kelly criterion maximizes the long-term growth rate of wealth in repeated bets.
  - The basic formula for a bet with two outcomes (win or lose) is:
      f* = (bp - q) / b
    where:
      f* = fraction of bankroll to bet
      b = net odds received (if you bet 1 unit and win, you get b units net, so total return is 1+b)
      p = probability of winning
      q = 1-p = probability of losing

  - For multiple independent bets, the optimal fractions can be approximated by solving for each in isolation if the bets are small, but for larger fractions or correlated bets, it becomes complex.

  However, our context:
  - We have multiple proposals (bets) in each cycle, but the bankroll (endowment) is reused in the next cycle.
