  ### Decision Procedure for Research Funding Allocation Based on Kelly Criterion

  This procedure balances geometric growth optimization with practical constraints, mission alignment, and estimation uncertainty. It requires **inputs**, **computations**, and **judgment calls** at specified points. Use a spreadsheet for calculations.

  ---

  #### **Inputs Required Before Starting**
  1. **Bankroll (B)**: Current endowment allocated for this funding cycle (e.g., $40M).  
  2. **Proposal Data**: For each proposal, collect:  
     - **Requested Amount ($C_i$)**  
     - **Success Probability ($p_i$)**: Estimated chance of success (0–1).  
     - **Net Return Multiple ($b_i$)**: Net profit per dollar invested if successful (e.g., a 2.2x total return → $b_i = 1.2$).  
     - **Confidence Score (1–5)**: 1 = low confidence (high uncertainty), 5 = high confidence (robust data).  
     - **Mission Critical Flag**: Yes/No for proposals central to the fund’s charter.  
  3. **Mission Allocation (%)**: Fixed portion of B set aside for non-Kelly proposals (e.g., 5–10%).  
  4. **Risk-Free Rate**: Default = 0% (holding cash), but adjust if endowment earns interest.  

  **Handling Unquantifiable Payoffs**:  
  - Proposals with non-monetary impacts (e.g., societal benefit) are **excluded from Kelly calculations**. Fund these from the **Mission Allocation** with program officer discretion.  

  ---

  #### **Step-by-Step Procedure**
  **Step 1: Set Aside Mission Allocation**  
  - Mission Bankroll = $B_{\text{mission}} = B \times \text{Mission Allocation \%}$  
  - Kelly Bankroll = $B_{\text{kelly}} = B - B_{\text{mission}}$  

  **Step 2: Compute Base Kelly Fraction ($f^*_i$) for Each Proposal**  
  - For binary outcomes (success/failure):  
    $$
    f^*_i = \frac{p_i \cdot b_i - (1 - p_i)}{b_i}
    $$  
    - If $f^*_i < 0$, reject (negative expected value).  
    - *Example*: $p_i = 0.6$, $b_i = 1.2$ → $f^*_i = \frac{(0.6 \times 1.2) - 0.4}{1.2} = 0.267$.  

  **Step 3: Adjust for Uncertainty (Fractional Kelly)**  
  - Uncertainty factor: $u_i = \frac{5 - \text{Confidence Score}}{10}$ (e.g., Confidence 2 → $u_i = 0.3$).  
  - Adjusted fraction: $f_{\text{adj}_i} = f^*_i \times (1 - u_i)$  
  - **Hard Cap**: $f_{\text{adj}_i} \leq 0.1$ (no bet >10% of $B_{\text{kelly}}$).  

  **Step 4: Calculate Allocation per Proposal**  
  - Max allocation for proposal $i$: $A_i = \min(C_i,\ f_{\text{adj}_i} \times B_{\text{kelly}})$  
  - *Partial funding is allowed unless specified otherwise*.  

  **Step 5: Allocate Across Portfolio**  
  1. Rank proposals by $f_{\text{adj}_i}$ (descending).  
  2. Allocate from top down until $B_{\text{kelly}}$ is exhausted.  
  3. **Constraint**: Total allocated ≤ $B_{\text{kelly}}$.  

  **Step 6: Mission Allocation**  
  - Distribute $B_{\text{mission}}$ to:  
    - Proposals flagged **Mission Critical** but underfunded by Kelly.  
    - Proposals with **unquantifiable payoffs**.  

  ---

  #### **Where Arithmetic and Geometric Views Diverge**  
  Kelly reduces allocation when:  
  - **High risk of ruin** ($p_i$ low, $b_i$ high).  
  - **Overestimation risk** (uncertainty adjustment).  
  - **Positive expectation but high volatility** (Kelly favors lower volatility).  
  *Example*: A proposal with high arithmetic EV but low success probability will have a much lower Kelly allocation.  

  ---

  #### **Human Judgment Call Points**  
  1. **Mission Allocation %**: Set by trustees (not dictated by Kelly).  
  2. **Confidence Scores**: Subjective; calibrate with historical data.  
  3. **Non-Divisible Proposals**: If partial funding isn’t feasible, skip or use mission funds.  
  4. **Correlations**: Kelly assumes independence; if proposals are correlated, reduce allocations further (no formula; judgment call).  
  5. **Spend-Down Scenarios**: Kelly’s long-run assumption fails; use finite-horizon adjustment (see Case 3).  

  --- 

  ### **Case Studies**

  #### **Case 1: Spinout Company ($2.2x Return, 60% Success)**  
  - **Inputs**: $p = 0.6$, $b = 1.2$ (net return), Confidence = 4.  
  - **Kelly**:  
    - $f^* = \frac{(0.6 \times 1.2) - 0.4}{1.2} = 0.267$  
    - $u = (5-4)/10 = 0.1$ → $f_{\text{adj}} = 0.267 \times 0.9 = 0.24$  
    - **Capped at 0.10** → $A_i = 0.1 \times B_{\text{kelly}}$  
  - **Arithmetic View**:  
    - EV = $(0.6 \times 1.2) - 0.4 = 0.32$ (positive; allocate fully).  
  - **Verdict**: Kelly bets **1/3 less** than arithmetic due to risk of ruin.  

  #### **Case 2: Moonshot (3% Success, Transformative Payoff)**  
  - **Inputs**: $p = 0.03$, $b = 999$ (1000x total return), Confidence = 1.  
  - **Kelly**:  
    - $f^* = \frac{(0.03 \times 999) - 0.97}{999} \approx 0.029$  
    - $u = (5-1)/10 = 0.4$ → $f_{\text{adj}} = 0.029 \times 0.6 \approx 0.017$  
    - $A_i = 0.017 \times B_{\text{kelly}}$ (e.g., $647K if $B_{\text{kelly}} = 38M$)  
  - **Arithmetic View**:  
    - EV = $(0.03 \times 999) - 0.97 = 29.0$ (allocate entire bankroll).  
  - **Conflict**: Kelly allocates **<2%** of bankroll; arithmetic wants 100%.  
  - **Resolution**:  
    - Kelly correctly avoids overbetting on low-probability events.  
    - **Mission Allocation Must Bridge Gap**: Fund the gap between $647K and requested amount using $B_{\text{mission}}$.  
    - **If Mission Allocation is Insufficient**: Accept that Kelly protects the endowment, even if it underfunds moonshots. Break Kelly only if trustees explicitly prioritize mission over growth.  

  #### **Case 3: 3-Year Spend-Down (No Long Run)**  
  - **Problem**: Kelly assumes repeated bets; here, bets are finite (3 cycles).  
  - **Adjustment**:  
    - **Reduce Uncertainty-Adjusted Fractions**: $f_{\text{finite}} = f_{\text{adj}_i} / 3$ (spread risk over cycles).  
    - **Final Cycle**: Allocate all remaining funds to highest $f_{\text{adj}_i}$ proposals (no compounding).  
  - **Verdict**:  
    - Y1: Bet 1/3 of $f_{\text{adj}_i}$ amounts.  
    - Y2: Recompute $B_{\text{kelly}}$ with returns, repeat.  
    - Y3: Allocate 100% of remaining bankroll to proposals with $f^*_i > 0$.  
  - **Limitation**: Finite Kelly is suboptimal; prioritize mission-critical bets in final cycle.  

  ---

  ### **Key Takeaways**  
  - **Use Kelly When**: Long-term endowment growth is priority; bets are repeatable and quantifiable.  
  - **Override Kelly When**: Mission-critical proposals are underfunded (use $B_{\text{mission}}$) or in spend-down scenarios.  
  - **Never Blindly Trust $p_i$**: Uncertainty adjustments prevent overestimation ruin.  
  - **Spreadsheet Tools**: Use formula templates for $f^*_i$, $f_{\text{adj}_i}$, and allocation ranking.  

  This procedure systematizes geometric growth principles while flagging where human judgment must prevail. It resolves disputes by showing when Kelly and arithmetic diverge and provides a defensible starting point for allocations.
