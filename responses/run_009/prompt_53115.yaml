  We are building a quiz with 8-10 questions. Each question is a scenario with 2-3 answer options.
   The positions we want to map to:
   1. Civic Duty View: Voting is a duty owed to fellow citizens, regardless of the immediate consequences.
   2. Expressive Theory: Voting is an expression of support or identity, like cheering at a game, and the impact isn't about changing the outcome.
   3. No Duty to Vote but Bad Voting: There's no duty to vote, but if you do vote, you can do it badly (e.g., without proper information).
   4. Pure Expected-Consequence: Voting is only justified if the expected benefit (probability of tipping the outcome times the stakes) outweighs the cost.
   5. Outright Abstentionism: There is no duty to vote and it's often better not to.
   6. Lesser-Evil Voting: It's acceptable to vote for a candidate who is not ideal but better than the alternative, especially to prevent a worse outcome.
   7. Vote Your Conscience: Never compromise; vote only for candidates you truly believe in, regardless of the odds or consequences.

   We have specific scenarios to cover:
   - Voting for the lesser evil in a non-swing state.
   - Voting third party in a swing state.
   - Going to the polls to cancel out a spouse's vote.
   - The "no single vote ever decides" argument, and we want at least one question where positions disagree on whether this matters.
   - Voting while clueless about the candidates (to challenge the "bad voting is worse than not voting" view).

   We must avoid questions that directly ask about the theory (e.g., "is voting expressive?"). Instead, use concrete scenarios.

   Let's design the questions:

   Question 1: Voting for the lesser evil in a non-swing state.
     Scenario: Alex lives in a state that has voted for Party A in every presidential election for the last 50 years. The polls show Party A leading by 20 points this year. Alex strongly dislikes both major candidates but thinks Candidate A (the frontrunner) is slightly less bad than Candidate B. Should Alex vote for Candidate A?
     Options:
       a) Yes, because it's important to support the lesser evil, even if the state isn't competitive.
       b) No, because in a non-competitive state, voting for the lesser evil won't change the outcome and is pointless.
       c) Alex should vote only if there is a candidate Alex genuinely supports, which might be a third party.

   Question 2: Voting third party in a genuine swing state.
     Scenario: Jamie lives in a state where the race between the two major parties is extremely close, and every vote could matter. Jamie finds both major-party candidates unacceptable but likes a third-party candidate. Should Jamie vote for the third-party candidate?
     Options:
       a) Yes, because voting is about expressing your true beliefs, and Jamie should vote for the candidate who best represents those beliefs.
       b) No, because in a swing state, a vote for a third party could split the vote and lead to the worse major-party candidate winning. Jamie should vote for the lesser evil among the major candidates.
       c) Jamie should not vote at all if they don't support either major candidate.

   Question 3: Canceling out a spouse's vote.
     Scenario: Taylor and their spouse are voting in a swing state. Taylor's spouse is going to vote for Candidate X, whom Taylor thinks would be a disaster. Taylor doesn't particularly like the other major candidate, Candidate Y, but thinks they would be better than X. Taylor is considering going to the polls just to cancel out their spouse's vote for X. Should Taylor do it?
     Options:
       a) Yes, because every vote matters in a swing state, and stopping a bad candidate is important.
       b) No, because voting just to cancel out someone else's vote is petty and doesn't express Taylor's genuine views.
       c) Taylor should only vote if they have a positive reason to support Candidate Y.

   Question 4: The "no single vote" argument.
     Scenario: Casey doesn't see the point in voting because no single vote has ever decided a national election. What is the best response to Casey?
     Options:
       a) Casey is right: the chance of one vote mattering is so small that it's not worth the effort to vote.
       b) Even if one vote doesn't change the outcome, voting is a civic duty that we owe to our community and democracy.
       c) Voting is about expressing your support for a candidate or cause, not about changing the outcome, so the "no single vote" argument misses the point.

   Question 5: Voting while clueless.
     Scenario: Morgan hasn't had time to follow the election. They don't know the candidates' positions or qualifications. They are considering skipping the election, but a friend says, "Even a bad vote is better than not voting at all." Should Morgan vote anyway?
     Options:
       a) Yes, because it's a citizen's duty to vote, even if they are uninformed.
       b) No, because voting without information is irresponsible and might even harm the outcome. It's better to abstain.
       c) Morgan should vote only if they take the time to get informed first.

   Question 6: Lesser evil vs. conscience in a competitive state.
     Scenario: In a state where the election is expected to be very close, Sam strongly prefers a third-party candidate but knows that the two major candidates are very different and that one is much worse than the other. Sam is considering voting for the lesser evil among the major candidates to prevent the worse one from winning. Should Sam do that?
     Options:
       a) Yes, because in a close race, the practical impact of preventing a bad outcome is more important than expressing a pure conscience vote.
       b) No, because voting for the lesser evil only perpetuates a broken system. Sam should vote for the third-party candidate to build support for a better alternative.
       c) Sam should not vote at all if they cannot in good conscience support any of the major candidates.

   Question 7: Voting in a non-competitive race for a third party.
     Scenario: Jordan lives in a state that is guaranteed to go to one party by a large margin. Jordan supports a third party that has no chance of winning. Should Jordan bother voting for that third party?
     Options:
       a) Yes, because voting is about expressing support for the ideas of the third party, not about winning this election.
       b) No, because in a non-competitive state, a vote for a third party is wasted and could be better used by not voting or by voting for a major party to send a signal.
       c) Jordan should vote only if they feel a duty to vote, but then they should vote for the major party that is closest to their views.

   Question 8: The cost of voting.
     Scenario: Riley has to work on Election Day and would lose a day's wages by taking time off to vote. The polling place is also far away and Riley doesn't have a car. Given that Riley's state is not a swing state and the outcome is a foregone conclusion, is Riley obligated to vote?
     Options:
       a) Yes, because voting is a civic duty and we must make sacrifices for the good of the community.
       b) No, because the costs are too high and the chance of making a difference is too low. Riley should not feel guilty about skipping.
       c) Only if Riley can vote without too much hardship. Otherwise, it's acceptable to skip.

   We have 8 questions. We can add one or two more to get to 10? Let's add:

   Question 9: The symbolic value of voting.
     Scenario: Avery believes that voting is an important symbol of civic participation and that high turnout is good for democracy, even if the election is not competitive. Avery doesn't care much about the candidates but is planning to vote to show support for the democratic process. Should Avery vote?
     Options:
       a) Yes, because the act of voting itself is valuable for democracy, regardless of the specific vote.
       b) No, because voting without caring about the candidates is empty symbolism and might even encourage bad candidates if people vote randomly.
       c) Avery should only vote if they take the time to form a preference about the candidates.

   Question 10: The protest vote.
     Scenario: Taylor is so disgusted with both major candidates that they want to cast a protest vote by writing in a fictional character. They know it won't affect the outcome because their state is safe for one party. Should Taylor cast the protest vote?
