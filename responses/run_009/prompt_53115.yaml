answer: |-
  **Question 1:**  
  Alex lives in a state that’s voted for Party A in every presidential election for 50 years. Polls show Party A leading by 20 points. Alex dislikes both major candidates but thinks Candidate A (the frontrunner) is slightly less bad than Candidate B. Should Alex vote for Candidate A?  
  a) Yes—supporting the lesser evil matters, even in non-competitive states.  
  b) No—voting for the "lesser evil" in a safe state is pointless; skip or vote third-party.  
  c) Only if Alex feels a duty to vote, but vote third-party if they align better.  

  **Question 2:**  
  Jamie lives in a swing state where polls show a tie. Jamie finds both major candidates awful but likes a third-party candidate. Should Jamie vote third-party?  
  a) Yes—voting is about expressing your true beliefs, not just electoral math.  
  b) No—in a close race, voting third-party risks helping the worst major candidate win; vote lesser evil.  
  c) Skip voting—if both majors are unacceptable, abstaining is better than supporting either.  

  **Question 3:**  
  Taylor’s spouse is voting for Candidate X, who Taylor believes would be disastrous. Taylor dislikes Candidate Y but thinks they’re better than X. In their swing state, should Taylor vote for Y just to cancel out their spouse’s vote?  
  a) Yes—every vote counts in swing states; neutralizing a bad vote is worthwhile.  
  b) No—voting should express your genuine views, not just negate someone else’s.  
  c) Skip—voting solely to cancel a spouse’s vote is petty and unprincipled.  

  **Question 4:**  
  Casey says, "Why vote? No single ballot has ever decided a national election." How do you respond?  
  a) Casey’s right—one vote won’t tip the outcome, so voting is irrational.  
  b) Wrong—voting is a civic duty we owe our community, regardless of impact.  
  c) Wrong—voting expresses your values like cheering at a game; it’s not about winning.  

  **Question 5:**  
  Morgan hasn’t researched the candidates. They’re considering skipping the election, but a friend says, "Even a bad vote beats not voting!" Should Morgan vote?  
  a) Yes—citizens have a duty to vote, informed or not.  
  b) No—uninformed voting is irresponsible and potentially harmful; skip.  
  c) Only if Morgan researches first—voting badly is worse than abstaining.  

  **Question 6:**  
  In a state where the race is tied, Sam strongly prefers a third-party candidate but knows one major candidate is much worse. Should Sam vote for the "lesser evil" major candidate?  
  a) Yes—preventing disaster in a close race outweighs ideological purity.  
  b) No—voting for the lesser evil rewards a broken system; vote third-party to build alternatives.  
  c) Never vote for evil—abstain if no candidate aligns with your conscience.  

  **Question 7:**  
  Jordan lives in a state guaranteed to go to Party A by 30 points. They support a fringe third party with no chance. Should Jordan vote third-party?  
  a) Yes—voting signals support for ideas you believe in, win or lose.  
  b) No—it’s a wasted vote; better to vote for the "lesser evil" major party to influence their platform.  
  c) Skip—pointless in non-competitive states; save time.  

  **Question 8:**  
  Riley must miss work to vote, losing a day’s wages. Their state is non-competitive (outcome certain). Is Riley obligated to vote?  
  a) Yes—civic duty requires sacrifice; vote anyway.  
  b) No—voting’s costs outweigh near-zero impact; skip guilt-free.  
  c) Only if convenient—duty matters, but real-life costs excuse abstention.  

