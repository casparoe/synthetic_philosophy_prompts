  ### Scoring Key  
  Tally your answers below. **Highest score** indicates your closest match. Positions:  
  - **Civic Duty (CD)**: Voting is a non-negotiable obligation to society.  
  - **Expressive (EXP)**: Voting is personal expression, like art or speech.  
  - **No Duty but Avoid Bad Voting (ND)**: No duty to vote, but voting badly is irresponsible.  
  - **Pure Expected-Consequence (EC)**: Vote only if your ballot’s *statistical impact* justifies costs.  
  - **Outright Abstentionism (OA)**: No duty to vote; abstaining is often wise.  
  - **Lesser-Evil Voting (LE)**: Vote to block the worst viable candidate, even if they’re bad.  
  - **Vote Your Conscience (VC)**: Never compromise; only vote for candidates you truly endorse.  

  | Position | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 |  
  |----------|----|----|----|----|----|----|----|----|  
  | CD       | a  | b  | a  | b  | a  | a  | b  | a  |  
  | EXP      | c  | a  | b  | c  | a  | b  | a  | a  |  
  | ND       | b  | c  | c  | a  | b,c| c  | c  | b,c|  
  | EC       | b  | b  | a  | a  | b  | a  | b,c| b  |  
  | OA       | b  | c  | c  | a  | b  | c  | c  | b  |  
  | LE       | a  | b  | a  | b  | a  | a  | b  | a  |  
  | VC       | c  | a  | b  | c  | c  | b  | a  | c  |  

  **How to score**: Count how many of your answers match each position’s row.  
  - Example: If you answered Q1=b, Q2=a, Q3=b, Q4=c, etc., EXP and VC both score highly.  

  ---

  ### Separation Caveats & Unoccupied Combos  
  **Hard to separate**:  
  - EXP vs. VC: Both support protest/third-party votes (Q2a, Q7a) and reject lesser-evil pragmatism (Q3b, Q6b). Key difference: VC *always* prioritizes conscience (Q5c, Q8c), while EXP may vote uninformed/symbolically (Q5a, Q8a).  
  - CD vs. LE: Overlap in "duty to stop bad outcomes" (Q1a, Q3a, Q6a). LE is more consequentialist; CD emphasizes obligation even without impact (Q4b).  
  - EC vs. OA vs. ND: All reject duty (Q4a, Q8b), but ND uniquely condemns bad voting (Q5b), while OA/EC focus on cost-benefit.  

  **Unoccupied answer combos**:  
  - High CD/LE + Q4a (Casey’s right): Rare. CD/LE reject "no impact" arguments.  
  - High VC + Q5a (vote uninformed): Incoherent for VC—conscience requires informed judgment.  
  - High EC + Q7a (vote hopeless third party): Contradicts EC’s focus on statistical impact.  
  - Pure OA + Q3a (cancel spouse’s vote): Incoherent; OA sees no value in voting.  

  **Unexplored views**:  
  - "Symbolic duty" (vote to uphold democracy, regardless of choice): Scores like CD/EXP but lacks real-world equivalents.  
  - "Pragmatic conscience" (vote lesser evil *only* if well-informed): Hybrid of LE/ND, not clearly mapped.  

