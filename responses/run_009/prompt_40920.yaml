prompt: |-
  Two friends at my local EA meetup spent an entire evening arguing about where our small giving circle's budget should go this year, and they eventually asked me to referee, which went nowhere, so now I'm asking you. Maya wanted the money on corporate campaigns against battery cages. Her reasoning: the scale leg of importance-tractability-neglectedness is enormous — tens of billions of chickens — and unlike most big causes it's also demonstrably tractable, since campaigns have actually flipped major food companies on cage-free pledges. Dev said that's exactly the problem: precisely because it has a track record, it's no longer neglected. Big funders have noticed, money is flooding in, and the marginal dollar now buys almost nothing. He wanted us to fund wild-animal-welfare research instead: importance arguably even bigger than farmed animals, tractability admittedly terrible, but neglectedness so extreme it dominates once you multiply the factors. Maya pushed back hard on neglectedness as a criterion. She said a cause being untouched can just mean funders looked at it and passed — empty niches are empty for a reason — and that neglectedness was always supposed to be a proxy for room for more funding, not a virtue in itself. She also said that once you let one factor be 'off the charts' and multiply it against fuzzier estimates for the others, the framework stops doing arithmetic and starts doing rationalization: people just declare the product big for whatever they were already fond of, and ITN becomes a checklist you fill in after the decision. Dev answered that any framework which only steers you toward proven interventions is worse than useless, because it just ratifies whatever the current funding distribution already is — neglectedness is what makes the thing a search procedure instead of a mirror — and if the multiplication is fuzzy, fine, the point is to force you to look where others aren't. Who's right at each step of this? In particular I want your honest take on whether neglectedness is a genuine input or just a proxy that can go stale, and whether the three-factor multiplication is actually doing work or is mostly theater. Say who's more right overall.
reasoning: |-
  Okay, let me unpack this EA funding debate. The core tension is between Maya's corporate-campaign approach and Dev's wild-animal-research proposal, with ITN framework as the battleground. 

  First, examining Maya's position: Her strength lies in concrete evidence - battery cage campaigns have measurable wins with major corporations. The scale argument (tens of billions of chickens) feels visceral. But I notice her dismissal of neglectedness seems almost reflexive - she's treating current funding saturation as permanent when history shows cause popularity cycles. Her warning about "empty niches" being red flags is valid though; some problems remain neglected precisely because they're intractable money pits.

  Now Dev's wild-animal angle: The scale potential here dwarfs even factory farming - we're talking trillions of organisms. His "neglectedness as searchlight" metaphor is compelling, but I'm skeptical about his tractability hand-waving. "Admittedly terrible" tractability multiplied by massive scale and neglect might mathematically dominate, but in practice could mean burning money on unsolvable problems. His point about ITN becoming rationalization theater hits hard though - I've seen groups misuse multipliers to justify pet projects.

  The proxy vs virtue neglectedness question is thorny. Originally in EA, neglectedness absolutely was a funding-gap indicator. But when foundations treat it as sacred, they can ignore when causes transition from underfunded to adequately funded. The battery cage cause might be in that transition now. 

  On multiplication fuzziness: The math breaks down when factors have different certainty levels. Assigning 10/10 neglect to wild animals while tractability is 0.1/10? Multiplying those creates false precision. Yet ditching multiplication entirely loses the framework's forcing function to consider counterintuitive opportunities.

  Overall lean: Maya wins on battery cages being past prime funding time, but Dev's core critique of ITN stagnation is vital. The best path might be rejecting both proposals - seek interventions with moderate scores across all three factors rather than letting one dominate. Wild animals needs basic research before intervention funding, while corporate campaigns need specialized execution our circle lacks. 

  Final thought: Their debate exposed how EA frameworks can become rhetorical weapons. The real failure was not jointly seeking a third option when ITN calculations diverged so extremely.
answer: |-
  Here's a step-by-step breakdown of who's more convincing at each stage, followed by an overall verdict and analysis of neglectedness and multiplication:

  ### 1. **Scale Argument (Maya Wins)**
     - **Maya:** Correct about battery cages' enormous scale (tens of billions of chickens suffering intensely). Wild animal welfare *potentially* has larger scale (trillions of beings), but uncertainty is extreme.
     - **Dev:** Wild animal scale is theoretical – we lack data on net suffering in nature (predation, disease, starvation). Farmed animal scale is documented and actionable *now*.
     - **Verdict:** Maya's scale claim is stronger due to evidence.

  ### 2. **Tractability (Maya Wins Decisively)**
     - **Maya:** Battery cage campaigns have a proven track record (e.g., McDonald’s, Walmart cage-free pledges). Corporate campaigns leverage public pressure efficiently.
     - **Dev:** Admits wild animal welfare tractability is "terrible." No proven interventions exist; solutions may require sci-fi tech (e.g., ecosystem engineering).
     - **Verdict:** Maya dominates. Proven impact beats speculative hope.

  ### 3. **Neglectedness (Dev Wins, But With Caveats)**
     - **Maya:** Correct that "neglected ≠ important" – causes can be neglected *because* they’re intractable or low-impact. Neglectedness is a **proxy for cost-effectiveness**, not inherently valuable.
     - **Dev:** Right that neglectedness prevents groupthink. Without it, ITN just reinforces existing funding and misses undervalued opportunities. True neglect *is* a signal when other factors are plausible (e.g., AI safety pre-2015).
     - **Verdict:** Dev’s core insight is valid, but Maya’s warning about "empty niches" applies perfectly to wild animal welfare: it’s neglected partly because tractability is near-zero.

  ### 4. **Marginal Impact of Funding (Tie, Leaning Maya)**
     - **Maya:** Correct that corporate cage campaigns are now crowded (GFI, OWA, HSUS). Marginal dollars *may* achieve less as low-hanging fruit is gone.
     - **Dev:** Overstates "money flooding in." Animal charity evaluators still recommend some cage-free work. Wild animal welfare *is* highly neglected, but funneling money into a black box (zero tractability) wastes resources.
     - **Verdict:** Maya’s caution is prudent. Dev’s proposal risks funding "lost causes."

  ### 5. **ITN Framework Critiques (Both Have Points)**
     - **Maya:** Correct that letting one factor dominate (e.g., "infinite neglect") makes ITN a rationalization tool. Multiplying fuzzy numbers (e.g., 10/10 neglect × 0.1/10 tractability) creates pseudoscientific precision.
     - **Dev:** Right that ignoring neglectedness makes ITN conservative and reactive. It *should* push us toward overlooked but plausible high-impact areas (e.g., early AI safety or malaria bed nets).
     - **Verdict:** Both critiques are valid. ITN needs guardrails against gaming the system.

  ---

  ### **The Neglectedness Question**
  - **Proxy, not virtue:** Maya is right. Neglectedness matters **only as a proxy for room for more funding/cost-effectiveness**. When a cause becomes crowded (like cage-free campaigns circa 2020), its neglectedness score drops – the proxy has gone stale.
  - **But Dev is also right:** Neglectedness forces us to *search* for undervalued opportunities. Dismissing it entirely risks funding only "safe" bets, missing potential paradigm shifts.

  ### **Is Multiplication "Theater"?**
  - **Mostly yes, but useful theater:** Precise multiplication of subjective scores (e.g., 8 × 7 × 9) is indeed performative. However, the *qualitative* exercise forces explicit tradeoffs:
    - High neglect × low tractability? (Wild animals) → Risky moonshot.
    - Medium scale × high tractability × low neglect? (Cage-free today) → Diminishing returns.
    - **The real value:** Preventing one factor from dominating uncritically.

  ---

  ### **Overall Verdict: Maya Is More Right**
  - **Why?** Her position is evidence-based and avoids speculative leaps. Battery cage work, while less neglected than before, still has room for impact (e.g., holding corporations accountable, expanding to emerging markets). Dev’s proposal swaps proven impact for scale and neglect alone – a gamble with poor odds.
  - **Key flaws in Dev’s view:** 
    - Neglectedness can’t compensate for near-zero tractability. Wild animal welfare needs basic research *before* major funding.
    - His model ("neglect × scale × tractability") would also prioritize causes like asteroid defense (massive scale + extreme neglect + low tractability) – a clear misallocation.
  - **But honor Dev’s insight:** Allocate *a small portion* to exploratory work (e.g., 10-20% for wild animal welfare research). Avoid binary choices.

  ### **A Better Path for Your Giving Circle**
  1. **Split strategically:** Fund medium-neglect, high-tractability work (e.g., corporate campaigns for **broiler chicken welfare** – less crowded than cage-free).
  2. **Support innovation:** Allocate 10-15% to **high-neglect, plausible-tractability research** (e.g., invertebrate welfare or AI alignment for animals).
  3. **Reject false dichotomies:** Use ITN as a discussion tool, not a calculator. Prioritize **robustness** – if an intervention’s impact holds under realistic scores, it’s credible.

  **Bottom line:** Maya’s approach is less sexy but more responsible. Dev’s vision needs proof-of-concept before scaling. Allocate pragmatically.
