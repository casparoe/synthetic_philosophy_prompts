  ## The Unbuilt Crane: Dennett's Greedy Tempo in Breaking the Spell

  Dan Dennett gifted us indispensable tools for thinking. His distinction between cranes – painstakingly constructed, mechanistic explanations – and skyhooks – miraculous, top-down impositions – remains a bedrock for understanding science and complexity. His warning against "greedy reductionism," the sin of leaping prematurely or simplistically to fundamental levels while ignoring the intricate middle machinery, is equally vital. We rightly praise him for this. Yet, applying Dennett’s own rigorous standards to his ambitious project in *Breaking the Spell* reveals a profound, and largely unacknowledged, tension. The book, while a bold and necessary opening salvo, succumbs to a subtle form of the very greediness he decried – not in its *target* (explaining religion naturalistically), but in its *tempo* and execution. It announces a grand crane-building project but spends far more time describing the *need* for the crane and sketching its silhouette than actually assembling its critical moving parts.

  The core mandate of *Breaking the Spell* was compelling: religion is a natural phenomenon, woven into the fabric of human biology and culture, demanding scientific investigation free from theological exemption. Dennett masterfully dismantles the taboo, arguing persuasively for the legitimacy and necessity of the cognitive science of religion (CSR). This was crucial work. However, the book implicitly promises more. It promises to *begin* the construction of the crane itself – to outline the mechanistic pathways by which religious beliefs and practices emerge, persist, and evolve. Here, the gears grind, not due to faulty ambition, but due to a failure of explanatory patience.

  Consider the phenomena a robust crane for religion must hoist: How do complex theological doctrines, often opaque even to adherents, propagate across generations? How does "belief in belief" – the social commitment to the *value* of religious tenets, distinct from literal conviction – function as a stabilizing force, especially in communities with widespread private doubt? What precise mechanisms allow corporate worship and costly rituals to persist, fostering cohesion and suppressing free-riders, even when individual motivations are diverse and often non-doctrinal? Why do individuals sacrifice profoundly, even unto death, for articulated doctrines they may poorly understand or for identities rooted in group belonging rather than personal theology?

  Dennett identifies these as crucial questions. He gestures towards potential components of the crane: memetics (the cultural analogue of genes), costly signalling, the by-products of evolved cognitive tendencies like hyperactive agency detection. But the gesture often substitutes for construction. The book spends substantial energy arguing *why* CSR is valid and necessary (describing the crane's purpose and blueprints), surveying possible materials (memes, evolutionary psychology), and anticipating objections (largely theological). Comparatively little space is devoted to the painstaking work of *assembling* these components into a working model that demonstrably accounts for the specific, complex phenomena listed above. *How* does the meme for the Trinity, notoriously difficult to pin down, reliably replicate? *What specific social feedback loops* reinforce "belief in belief" in a secularizing society? *What is the precise interplay* between individual cognition, costly signalling displays, and group-level benefits in maintaining ritual participation? These questions are raised, often insightfully, but the mechanistic connective tissue – the pistons, gears, and control systems of the crane – remains largely schematic, implied rather than engineered.

  **This is where the greediness emerges – as a sin of tempo, not level.** Dennett correctly identifies the *appropriate* level of explanation: the complex interplay of cognitive biases, cultural evolution, and social dynamics. He doesn’t crudely reduce religion to, say, a single misfiring neuron or a nakedly selfish gene. His declared target is entirely valid. The greediness lies in the *pace* at which he moves from identifying the target level to asserting explanatory sufficiency. It's the haste of declaring the crane *essentially built* once the need is established, the materials listed, and the *possibility* of construction argued, without sufficiently demonstrating *how* the listed materials actually fit together to lift the specific, heavy loads. He sketches the crane's design at the speed of someone who finds its eventual construction obvious, even inevitable, given the initial premises, thereby skipping the messy, detailed engineering work that constitutes genuine explanation. It’s akin to explaining a car by saying "it's made of metal, powered by combustion, and obeys the laws of physics" – technically true, but grievously missing the transmission, the fuel injection, the electrical system.

  **This critique is fundamentally distinct from the "cheap" accusation that naturalistic explanation inherently "explains away" religion.** That complaint misunderstands science. A well-built crane doesn't debunk the phenomenon it lifts; it illuminates *how* it stands. A robust CSR explanation of why minimally counterintuitive concepts spread easily, or why costly rituals foster trust, doesn't negate the profound personal or communal significance of religion any more than neuroscience negates the reality of love or biochemistry negates the beauty of a sunset. It explains the mechanisms enabling these experiences and institutions. The flaw in *Breaking the Spell* isn't that it offers a naturalistic explanation; it's that the explanation offered often remains promissory, gestural, lacking the mechanistic detail that would make it a truly *satisfying* crane – the detail Dennett himself taught us to demand.

  **So, how does this stand against the obvious defenses?**

  1.  **"He called it a sketch, a first salvo!"** True, and this is a valid partial defense. Dennett explicitly framed the book as an opening move, aiming to provoke inquiry, not deliver the final word. This defense *does* bite regarding the book's breadth and its role in catalyzing the field. It rightly absolves him of the impossible task of delivering a complete, ironclad theory in one volume. However, it becomes a dodge when used to excuse the *specific kind* of under-specification at issue. Announcing a sketch doesn't license consistently substituting programmatic declaration for mechanistic probing at the chosen level of analysis. Even a sketch of a crane should show *how* the boom connects to the base, *how* the cable runs through the pulleys. Dennett sketches the *idea* of the crane and lists parts, but often neglects the functional linkages between those parts for the complex phenomena he aims to lift. The tempo remains greedy relative to the explanatory burden he willingly shouldered.
  2.  **"No single book could contain the full mechanisms!"** Absolutely true and unassailable. This defense bites hard. The complexity demands libraries, not monographs. However, this too becomes a dodge if used to deflect the criticism that *within the scope he set*, the *emphasis* was misplaced. The book dedicates considerable space to meta-arguments (the spell-breaking itself) and preliminary surveys. A less greedy tempo wouldn't require omniscience; it would involve a deliberate shift in focus *within the same page count*. Less rehearsal of *why* the crane is needed and *what* materials exist, more detailed assembly of *one or two* critical components – say, a deep dive into the precise cognitive and social mechanisms sustaining widespread ritual participation *despite* doctrinal diversity or doubt, using the best available evidence. The greediness shows in opting for broad strokes across many potential mechanisms rather than meticulous assembly of a few.

  **The Strongest Defense: Provocation as Priority**

  The most formidable counter-argument a Dennett defender could mount is this: *You fundamentally misunderstand the book's purpose and success.* Breaking the profound cultural and intellectual taboo *was* the paramount goal. The "spell" wasn't just religious immunity; it was the very reluctance to *ask* the questions scientifically. In that context, meticulously building one cog of the crane, however well-engineered, would have been strategically myopic. The *sketch* – the bold, sweeping argument for naturalism, the provocative mapping of the terrain, the compelling call to arms – was precisely the powerful crane needed to *lift the field itself* into existence. Demanding intricate mechanism-building in *that* book is like demanding an engineer to detail the metallurgy of the crane *while* it’s being used in a daring rescue. The tempo wasn't greedy; it was strategically necessary. The book’s lasting value lies not in its mechanistic completeness, but in its world-changing provocation, which *enabled* the detailed crane-building by others that followed.

  **Conclusion: The Unfinished Legacy**

  This defense has undeniable merit. *Breaking the Spell* was a cultural and intellectual crane of immense power. It lifted the study of religion onto a new plane of scientific legitimacy. But acknowledging this triumph shouldn't preclude applying Dennett’s own exacting standards to the work itself. By those standards, the book exhibits a distinct flavor of greedy reductionism – not in leaping to the wrong level, but in moving too swiftly *past* the necessary, granular work of mechanistic assembly at the level it correctly targeted. It described the crane, argued for its possibility and necessity, and pointed to the warehouse of parts, but left the detailed engineering schematic frustratingly incomplete.

  This isn't a damning indictment; it’s a calibration. It reminds us that even our sharpest tools for thinking can, under the pressure of a monumental task, be applied with imperfect patience. Dennett’s genius lay in identifying the cranes and warning us of the skyhooks and greedy leaps. His legacy in *Breaking the Spell* is the vast research program he launched. The challenge for those who follow is to honour his vision not just by accepting the naturalistic premise, but by embracing the slower, less glamorous, fundamentally *non-greedy* tempo required to build the truly explanatory cranes he knew were essential – bolt by bolt, gear by gear, mechanism by mechanism. The greatest tribute to Dennett’s dangerous idea is to finish building the crane he so compellingly envisioned, with the meticulous care he so rightly demanded.
