  First, I need to recognize the core tensions: honoring past autonomy vs respecting current well-being, especially in dementia cases. The user wants a structured process that acknowledges both but provides actionable guidance. They specifically mentioned three test cases to validate the procedure.

  The user's unspoken needs might include: avoiding committee paralysis, ensuring legal defensibility, managing family dynamics, and maintaining ethical integrity without academic jargon. They also seem frustrated by theoretical debates that don't translate to clinical reality.

  For the decision procedure, I should consider:
  - Starting with basic validity checks to filter out inapplicable directives
  - Incorporating Jaworska's point about current values by requiring assessment of present preferences
  - Building in off-ramps where judgment is unavoidable (no false objectivity)
  - Flagging when family input is relevant without letting it override patient autonomy

  The three test cases each stress different aspects:
  Case 1 tests the happy dementia patient vs explicit directive conflict
  Case 2 examines life changes making old directives feel obsolete
  Case 3 addresses vague directives - here the procedure should fail early

  Key design challenges:
  - Balancing efficiency with thoroughness in 20-minute discussions
  - Making value judgments explicit rather than hidden in "objective" steps
  - Defining what counts as "sufficient" evidence at each stage
  - Handling situations where current preferences are unclear

  I think the procedure should have clear stopping points:
  - When directive is invalid/inaplicable (hard stop)
  - When current preferences are reliably ascertained (defer to now-self)
  - When all steps are exhausted but conflict remains (committee judgment)

  For the "happy dementia patient" dilemma (Case 1), the procedure must confront Dworkin's critical interests argument directly but require active assessment of current will - not defaulting to override. The family's role here should be contextual, not decisive.

  In Case 2 (changed life circumstances), the key is distinguishing between fundamental value shifts versus temporary changes - hence the "irreconcilable divergence" checkpoint requiring evidence of sustained change.

  Vague directives (Case 3) should trigger immediate committee judgment - no false precision. The procedure should explicitly state when it can't solve the problem.

  Throughout, I need to label which steps involve disguised judgment (e.g., assessing "reasonableness" of divergence) so committees don't mistake process for neutrality.
answer: |-
  Here's a practical, step-by-step decision procedure designed for clinical ethics committees facing advance directive dilemmas. It prioritizes efficiency, acknowledges judgment points, and balances past/current interests. **Key Principles:**  
  1. **Validity First:** Inapplicable/invalid directives don't bind.  
  2. **Current Self Matters:** Assess the patient's *current* values/well-being.  
  3. **Transparent Judgment:** Flags where committees *must* make value calls.  
  4. **No False Neutrality:** Explicitly labels "judgment steps."  

  ---

  ### **The Advance Directive Decision Procedure**  
  *Run these steps in order. Stop if a clear answer emerges.*

  1. **VALIDITY CHECK**  
     - *Question:* Is the directive legally valid *and* does it *plainly apply* to the current clinical situation?  
     - *Sufficient "No" Answer:*  
       - Document is not witnessed/signed properly.  
       - Clinical scenario doesn't match directive (e.g., directive refuses ventilation, but current need is antibiotics).  
       - Patient lacked capacity *when making the directive* (rare; needs evidence).  
     - ***HALT HERE IF "NO":** Directive is not binding. Proceed with best interests assessment.*  

  2. **CURRENT PREFERENCES ASSESSMENT**  
     - *Question:* Can we ascertain the patient's *current, reliable* wishes/preferences?  
     - *Sufficient "Yes" Answer:*  
       - Patient can communicate consistently (e.g., nods "yes/no," uses communication aids).  
       - Expressed view is stable (not fleeting/confused) and relates to the decision.  
     - ***HALT HERE IF "YES":** Follow CURRENT preferences. Override the directive.*  
     - *Judgment Step:* Assessing "reliability" requires clinical judgment (e.g., is a smile at family evidence of wanting life? Probably not. Is saying "I want to die" repeatedly evidence? Likely yes).  

  3. **DIRECTIVE VS. CURRENT WELL-BEING CONFLICT**  
     - *Question:* Is following the directive *very likely* to cause the patient *significant, avoidable suffering* **or** does the patient *appear content* with their current state?  
       - *Evidence Needed:* Observe behavior (agitation? calm?), physical signs (pain? comfort?), engagement (responds to music/family?).  
     - ***IF SUFFERING LIKELY & DIRECTIVE DEMANDS NON-TREATMENT:** Proceed to Step 4.*  
     - ***IF PATIENT IS CONTENT & DIRECTIVE DEMANDS NON-TREATMENT:** Proceed to Step 5.*  
     - *Judgment Step:* Defining "suffering" and "contentment" is contextual (committee must weigh evidence).  

  4. **SUFFERING TEST (For directives refusing treatment)**  
     - *Question:* Would overriding the directive to *prevent suffering* align with the patient's *known core values*?  
       - *Evidence:* Family/testimony about lifelong values, religious beliefs, prior statements beyond the directive.  
     - ***IF STRONG EVIDENCE OVERRIDE ALIGNS WITH CORE VALUES:** Override directive. Treat.*  
     - ***IF EVIDENCE WEAK/UNCLEAR:** Proceed to Step 6.*  

  5. **CONTENTMENT TEST (For directives refusing treatment)**  
     - *Question:* Is there *strong evidence* that the patient's *past critical interests* (life narrative, values) *decisively outweigh* their current contentment?  
       - *Evidence Needed:* Directive's rationale (e.g., "I’d rather die than live with dementia"), testimony about deeply held beliefs.  
     - ***IF DIRECTIVE EXPLICITLY TARGETS CURRENT STATE (e.g., "if I’m demented") & RATIONALE IS CLEAR:** Follow directive. Do not treat.*  
     - ***IF DIRECTIVE VAGUE OR LIFE NARRATIVE SHIFTED:** Proceed to Step 6.*  
     - *Judgment Step:* Weighing "critical interests" vs. "current contentment" is inherently philosophical. Committees *must* debate this.  

  6. **LIFE NARRATIVE SHIFT CHECK**  
     - *Question:* Is there *credible evidence* that the patient's core values *irreconcilably changed* after the directive was written?  
       - *Evidence Needed:* Major life events (new marriage, conversion), sustained new behaviors, explicit statements contradicting directive.  
     - ***IF CLEAR SHIFT & DIRECTIVE CONFLICTS WITH NEW VALUES:** Override directive.*  
     - ***IF NO EVIDENCE OF SHIFT OR AMBIGUOUS:** Follow directive.*  
     - *Judgment Step:* Determining "irreconcilable shift" is speculative. Committees must decide if evidence is persuasive.  

  7. **COMMITTEE JUDGMENT**  
     - ***PROCEDURE HALTS HERE:** No clear answer from prior steps. Committee must decide based on:*  
       - Balance of past autonomy vs. current well-being.  
       - Family/clinician consensus.  
       - "Least worst" option in ambiguity.  

  ---

  ### **Running the Cases**  
  **Case 1: Cheerful dementia patient, directive refuses antibiotics, family objects**  
  - **Step 1:** Directive valid/applies (dementia + infection present). → Proceed.  
  - **Step 2:** Current preferences? Patient cheerful but unable to communicate wishes. → Proceed.  
  - **Step 3:** Patient content? Yes (cheerful, no distress). Directive refuses treatment. → Go to Step 5.  
  - **Step 5:** Does past "critical interest" outweigh contentment? Directive likely targeted dementia ("no life like this"). Family's objection ≠ evidence of patient's past values. → **Follow directive. Do not give antibiotics.**  
    - *Hard truth:* The directive exists *for this scenario*. Family's wishes don't override unless evidence shows patient changed values (Step 6).  

  **Case 2: Directive refuses treatment, but second marriage/grandchild shifted life narrative**  
  - **Step 1:** Directive valid/applies. → Proceed.  
  - **Step 2:** Current preferences? Unclear. → Proceed.  
  - **Step 3:** Content or suffering? Assume content. → Go to Step 5.  
  - **Step 5:** Critical interests vs. contentment? Ambiguous. → Proceed to Step 6.  
  - **Step 6:** Life narrative shift? **Strong evidence:** New deep relationships, sustained happiness, grandchild central to identity. Directive conflicts with current "self." → **Override directive. Treat.**  
    - *Key difference from Case 1:* Evidence of *irreconcilable* value shift (e.g., directive valued independence, now values family interdependence).  

  **Case 3: Vague directive ("no extraordinary measures"), patient can’t discuss**  
  - **Step 1:** **HALT.** Directive is invalid *for decision-making* — "extraordinary measures" undefined, no scenario specified. Ignore directive.  
  - *Proceed to best interests assessment:* What treatment offers net benefit? What would patient likely want *now*? Involve family. Committee judgment needed immediately.  
    - *Brutal honesty:* Vague directives are paperwork clutter. They create false dilemmas. Reject them early.  

  ---

  ### **Key Takeaways for Your Committee**  
  - **Where Judgment is Unavoidable:** Steps 3 (suffering/contentment), 5 (critical interests vs. contentment), 6 (value shifts). Label these as "committee debate needed."  
  - **Efficiency Tips:**  
    - Step 1 kills 50% of problematic directives (invalid/vague).  
    - Step 2 prevents over-reliance on old documents if *now-self* speaks.  
    - Focus Step 6 on *objective evidence* of change (e.g., "patient joined a hospice movement after directive" > "family feels she changed").  
  - **Why This Works:**  
    - **Practical:** Starts with quick wins (validity, current wishes).  
    - **Balanced:** Forces assessment of *current* patient (Jaworska).  
    - **Honest:** Flags unresolvable conflicts for committee debate.  
    - **Defensible:** Documents why directive was/wasn’t followed.  

  This won’t please philosophers (it prioritizes clinical pragmatism), but it gives your committee a scaffold to cut through circular debates. When in doubt, **Step 7** is your friend: acknowledge the uncertainty and own the judgment call.
