  First, I need to unpack the possible theoretical frameworks. Rule consequentialism seems obvious—each violation erodes the norm, so punishment maintains the public good. But the user also brings up Kantian universalizability and Schelling coordination. How do these differ? For instance, rule consequentialism might allow unobserved violations since they don't harm the norm, whereas Kantian ethics would still see them as wrong. The inconsistency in self-exemptions (like fudging taxes) complicates things. Maybe the scolding behavior is more about social signaling than a coherent ethical stance. 

