prompt: |-
  hey so quick context: I'm on the exec of my university's effective altruism chapter, and I'm also taking a consequentialism seminar this semester where we just did the cluelessness stuff (Lenman, Greaves) and it kind of wrecked me. Our chapter gives out maybe £3k a year — each term we pick one charity to fundraise for, plus occasional one-off donations. The problem is our exec meetings have become pure vibes. Someone quotes a cost-per-life-saved figure like it's the whole story, someone else says "but knock-on effects, who even knows" and everyone shrugs, and then we pick whatever we picked last year anyway. After the seminar I realized our arguments are literally the cluelessness debate being reenacted badly by people who don't know it's a known problem.

  So: write me an actual decision procedure the exec can run once a term, in one 90-minute meeting, that's grounded in whatever the philosophy of cluelessness actually supports. I'm not asking it to *solve* cluelessness — just to be honest about when it bites and when it doesn't. Things I want in it:

  - the questions to ask in order, and what counts as a sufficient answer at each step (we are not going to commission research, and nobody on exec except me has read any decision theory)
  - where the procedure should stop and hand things to an explicit values vote, instead of pretending the next factual question will settle it
  - the places it will predictably misfire — e.g. cases where it's so conservative we never fund anything unusual, or where "we're clueless about ripple effects" gets used as a blank check to keep the default forever
  - how to treat the default option itself, since our default (a big global health charity) was chosen three years ago under the same cluelessness, so it doesn't obviously deserve the benefit of the doubt

  Then run it on two choices we actually face: (a) fundraising for malaria nets vs. an org doing pandemic preparedness work, where the second plausibly has astronomically larger but way fuzzier effects, and (b) a small local homelessness charity that members personally volunteer at vs. the global health default that wins on any cost-effectiveness estimate we can produce. I want at least one of these to come out a way I won't like — I suspect a good procedure will tell us to stop agonizing over (a) and just default on it, and if that's the answer I want to see why it isn't just intellectual laziness dressed up as epistemic humility. Also flag whatever the procedure genuinely cannot settle, since the treasurer has to sign off on anything that changes our default and she will absolutely ask.

  No reading list please, I get enough of that in the seminar. End with a final line beginning "Verdict:" plus one sentence stating the core rule of the procedure, so I can paste it straight into the minutes.
reasoning: |-
  Okay, the user is part of a university Effective Altruism chapter and dealing with decision paralysis due to the philosophical problem of cluelessness in consequentialism. They need a practical decision procedure for their exec meetings to choose charities without falling into endless debates. 

  First, I need to unpack their core frustrations: meetings are dominated by superficial arguments where cost-effectiveness stats get dismissed with "but ripple effects," leading to default choices without rigorous examination. They've studied cluelessness (Lenman, Greaves) and recognize their group is reenacting those debates poorly. 

  The user wants a structured 90-minute process that:
  - Acknowledges cluelessness without letting it paralyze decisions
  - Has clear stopping points for value-based voting
  - Avoids overconservatism or using cluelessness as an excuse for inertia
  - Questions the legitimacy of their current default charity
  - Generates defensible outputs even when unpopular

  Key constraints: No new research, minimal theory, must handle two concrete cases (malaria nets vs. pandemic prep; local homelessness vs. global health). The treasurer needs clear justification for any deviation from default.

  Hmm... the real tension here is between epistemic humility and practical action. The user secretly worries that admitting cluelessness might justify intellectual laziness, so the procedure must demonstrate rigor even when recommending defaults. 

  For the structure, I'll adapt a phased approach:
  1. **Frame the comparison** to force explicit alternatives rather than abstract debates
  2. **Test for cluelessness triggers** using Greaves' criteria (cascades, non-linearities etc.)
  3. **Establish burden of proof** - default only loses if challenger shows comparable expected value with manageable cluelessness
  4. **Define fallback** when cluelessness bites hard: stick with last reasoned choice

  The malaria vs. pandemic case is interesting - pandemic work likely fails the cluelessness test (astronomical stakes but unbounded uncertainty), making default rationally preferable despite feeling conservative. For local vs. global, the procedure might allow the local option if it clears the "direct impact + values" exception. 

  Biggest risk: The group might overapply the "clueless" label to avoid hard choices. Mitigation: require specific uncertainty mechanisms, not just handwaving about "ripple effects." Also, sunset clauses for defaults prevent institutional inertia.

  Final verdict needs to capture the core heuristic: "When cluelessness about differences dominates, conserve epistemic capital by maintaining the last deliberately chosen default unless a challenger demonstrates tractably superior expected value."
answer: |-
  Here's a decision procedure designed for your 90-minute meeting, grounded in cluelessness-aware consequentialism. It forces explicit reasoning about uncertainty, avoids false precision, and defines when values/voting kick in.

  **The Cluelessness-Aware Charity Selection Procedure**

  **Core Rule:** *Default to the last deliberately chosen option unless a challenger demonstrates comparable expected value with lower cluelessness burden OR demonstrates sufficient direct impact + values alignment to override comparative cluelessness.*

  **Procedure Steps (90 mins max):**

  1.  **Frame & Bound the Decision (10 mins):**
      *   **Question:** "What is the specific *challenger* charity(ies) being proposed *against* our current default? What is the specific intervention/charity being challenged?"
      *   **Sufficient Answer:** Named challenger charity + specific intervention (e.g., "Against AMF (default), we propose Prevent Pandemics (PP) for pandemic surveillance capacity building" OR "Against AMF (default), we propose Local Shelter (LS) for homeless outreach"). **Stop if no challenger is named – default wins.** Record proposed challenger & default.

  2.  **Direct Impact & Tractability Check (15 mins):**
      *   **Question A (Challenger):** "Is there *strong, credible evidence* the challenger directly causes a significant, measurable good (e.g., lives saved, DALYs averted, concrete welfare improvement) with reasonable confidence in the *causal chain* (not just correlation)?"
      *   **Question B (Default):** "Does the same hold true for the default? (Rely on last cycle's assessment unless new counter-evidence exists)."
      *   **Sufficient Answer:** For A or B: Cite specific evidence sources (e.g., GiveWell report, charity audited results, robust academic study). If **both fail**, open floor for 5 mins for new proposals, else **default wins**. If **only one passes**, it wins unless cluelessness concerns dominate (Go to Step 3). If **both pass**, proceed.

  3.  **Cluelessness Burden Assessment (30 mins - Crucial Step):**
      *   **Question:** "For the *difference in expected impact* between Challenger and Default, does uncertainty about *long-term/ripple effects* dominate the decision? Specifically, is the *magnitude* or *sign* of the difference highly sensitive to speculative, long-run, or hard-to-model effects?"
      *   **Checklist for High Cluelessness Burden:**
          *   *Astronomical Stakes + Unbounded Uncertainty:* (e.g., existential risk prevention where impact is vast but probability/mechanism is highly contested).
          *   *Cascading Effects:* High likelihood of unpredictable, multi-order consequences dwarfing direct effects.
          *   *Non-Linearity/Sensitivity:* Small differences in assumptions radically change which option looks better.
          *   *Value Uncertainty Dominates:* The main difference hinges on deeply contested moral weights (e.g., animal vs. human welfare, very long-term discounting).
      *   **Sufficient Answer:** If cluelessness burden is **HIGH** for the Challenger-Default difference, proceed to Step 4 (Values Vote). If **LOW/MODERATE** (e.g., direct effects dominate, uncertainty is bounded/quantifiable), proceed to Step 5 (Expected Value Comparison). **Document the key cluelessness arguments raised.**

  4.  **Values Vote (When Cluelessness Dominates) (15 mins):**
      *   **Question:** "Given the high cluelessness burden on comparing expected value, which option aligns better with our *chapter's values* or offers significant *non-impact benefits* (e.g., member engagement, skill-building, exploring neglected areas) *that justify deviating from the default*?"
      *   **Process:** Structured discussion (5 mins) followed by anonymous vote: Stick with Default OR Switch to Challenger. Majority wins. **Record the vote outcome and core values/non-impact reasons cited.**

  5.  **Expected Value Comparison (When Cluelessness Lower) (15 mins):**
      *   **Question:** "Based on the *best available, tractable evidence*, does the Challenger demonstrate a compelling case for having *significantly higher expected value* than the Default? Consider cost-effectiveness estimates, scale, neglectedness, track record."
      *   **Sufficient Answer:** Cite specific, comparable evidence (e.g., GiveWell CEA vs. Founders Pledge CEA; robust impact evaluations). **Not required:** Precision or overcoming *all* uncertainty. Required: Credible case for *meaningfully* superior expected value based on dominant effects. If **Yes**, Challenger wins. If **No** or evidence is insufficient/incomparable, **Default wins**.

  6.  **Decision & Sunset Clause (5 mins):**
      *   Announce winner (Default or Challenger).
      *   **Sunset Clause:** Any winning charity (including default) is only the default for **2 years max**. After 2 years, it *must* be re-justified as a challenger against a new default in Step 1. This combats inertia.

  **Predictable Misfires & Mitigations:**

  1.  **Over-Conservatism:** Default wins too often.
      *   *Mitigation:* Sunset Clause (Step 6) forces re-evaluation. Values Vote (Step 4) allows deviation based on non-impact reasons. Step 3 forces explicit articulation of *why* cluelessness bites.
  2.  **"Cluelessness" as Blank Check for Default:** Vague hand-waving about ripple effects.
      *   *Mitigation:* Step 3 requires pinpointing *specific mechanisms* (Astronomical Stakes, Cascading Effects etc.) for *why* cluelessness dominates *this specific comparison*. "Who knows?" is insufficient.
  3.  **Ignoring the Default's Baggage:** Assuming the default is beyond reproach.
      *   *Mitigation:* Default *must* pass Step 2 every cycle. Sunset Clause forces its re-justification. Its cluelessness burden is assessed like any challenger's in Step 3.
  4.  **Values Vote Overuse/Abuse:** Using Step 4 to avoid hard EV comparisons.
      *   *Mitigation:* Step 3 gatekeeps. Only go to Values Vote if cluelessness burden is demonstrably HIGH for the *difference*. Step 5 requires a genuine EV comparison when burden is lower.

  **Application to Your Cases:**

  *   **Case (a): Malaria Nets (AMF - Default) vs. Pandemic Preparedness (PP - Challenger)**
      *   Step 1: Challenger = PP (pandemic surveillance).
      *   Step 2: Both pass (AMF: strong evidence on nets. PP: evidence on surveillance reducing specific pandemic risks, though less direct than nets).
      *   Step 3: **HIGH Cluelessness Burden.** Why? *Astronomical Stakes + Unbounded Uncertainty:* PP aims to prevent potential extinction events (astronomical upside), but probability of success, the specific pandemic prevented (if any), and the net long-term effects (positive/negative) are highly speculative and sensitive to assumptions. *Cascading Effects:* Success could alter civilization's trajectory in unknowable ways. Uncertainty about the *difference* (PP impact minus AMF impact) utterly dominates any tractable CEA. **Proceed to Step 4.**
      *   Step 4: Values Vote. Does exploring a potentially crucial, neglected x-risk align with chapter values/mission more than proven global health? Are non-impact benefits (learning about biosecurity, member interest) high? **Verdict:** Uncertain (Depends on vote). **Procedure Output:** If vote favors PP, switch. If vote favors AMF or ties, default wins. Treasurer Note: "High cluelessness burden on difference; decision based on values/non-impact alignment vote."

  *   **Case (b): Global Health (Default) vs. Local Homelessness Shelter (LS - Challenger)**
      *   Step 1: Challenger = LS (homeless outreach).
      *   Step 2: Default passes (strong evidence). LS: Likely passes (evidence of direct welfare improvement for clients - meals, shelter, counseling - even if hard to quantify in DALYs).
      *   Step 3: **LOW/MODERATE Cluelessness Burden.** Why? While *absolute* long-term ripple effects exist for both, the *difference* (LS impact minus Default impact) is likely dominated by *direct, near-term effects*. LS helps specific local individuals tangibly now. Global health helps individuals far away tangibly now. The speculative, civilization-altering ripple effects, while present, are unlikely to systematically and massively favor one *over the other* in a way that overwhelms the direct effects we can observe and value. **Proceed to Step 5.**
      *   Step 5: Expected Value Comparison. Tractable CEA (e.g., GiveWell) overwhelmingly favors Global Health on cost-per-DALY averted. LS cannot demonstrate comparable expected value based on direct effects. **Verdict: Default wins.** Treasurer Note: "Lower cluelessness burden on difference; challenger did not demonstrate superior expected value on tractable metrics."
      *   *But what about member engagement?* Step 5 focuses on *impact* EV. If engagement is crucial, it should have been argued in Step 4. However, Step 3 concluded cluelessness burden was *low*, so Step 4 wasn't reached. **Mitigation:** Propose LS *next cycle* explicitly arguing in Step 3 that high member disengagement with default is a *significant negative non-impact effect* creating a cluelessness burden about *chapter sustainability's* long-term impact. Or, use Step 4 for a different challenger where cluelessness *is* high.

  **Verdict:** When profound uncertainty about long-term differences dominates expected value comparisons, default to the last deliberately chosen option; only override this default if a challenger demonstrates tractably superior expected value or wins a values vote triggered by high cluelessness burden.
