prompt: |-
  I teach ethics at a small liberal arts college, and this semester I got roped into chairing our academic integrity panel — a weekly gig where we hand out sanctions for cheating and plagiarism cases. Here's my problem: the framework everyone on the panel uses instinctively is "could the student have done otherwise?" We let off the kid whose laptop auto-synced a corrupted file mid-exam, and we hammered the kid who googled answers on a closed-book final. But I've been teaching Frankfurt cases for years, and I know the principle of alternative possibilities doesn't actually work like that — the whole point of the counterfactual intervener stories is that you can be responsible for something even when you couldn't have avoided doing it, because the action flowed from you rather than from the intervener. So our implicit test is both too strict and too loose at once. Too strict, because sometimes a student couldn't have done otherwise and should still be held responsible. Too loose, because sometimes a student technically had alternatives and we still shouldn't blame her — the coerced kid whose "options" were cheating or losing her scholarship isn't off the hook just because the door was unlocked.

  I want to fix this before the fall semester starts. What I'm asking for is a decision procedure the panel can actually run in the roughly 20 minutes we get per case, with no philosophers on it besides me and a dean who reads all our write-ups, so it has to be in plain language. Give me the questions in order, what counts as a sufficient answer to each, where the procedure terminates in "not responsible," and — this is the part I care most about — where it has to stop and hand the case to human judgment because the question has stopped being factual and become one of values. It should preserve whatever is genuinely right in Frankfurt's insight (roughly: responsibility tracks whether the misconduct was sourced in the student, not whether alternatives existed) while keeping the distinctions that do real work for a disciplinary body: actual coercion vs. Frankfurt-style inability to do otherwise, genuine impossibility vs. mere difficulty, and the cases where we'd never have caught the innocent version anyway.

  Then run it on three real-ish cases from last year, since a procedure that hasn't been run is just an essay. (1) A student who pulled answers from a leaked key during a take-home exam, where IT later discovered the exam portal had been compromised in a way that would have substituted the leaked answers into whatever he submitted — he cheated, but he also couldn't not have cheated. (2) A student who handed her problem set to a friend to copy after the friend threatened to report an earlier (lesser) incident of collaboration between them — blackmail-adjacent, but she did hand it over voluntarily in the end. (3) A student with an undiagnosed processing disorder who copied long passages verbatim from a study website because she genuinely believed that's what studying was — the panel went easy on her and I've never been sure that was right. Give me the procedure's verdicts on all three even where I won't like the answer, and be honest about where the procedure will misfire. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and please don't restate my question back at me.
reasoning: |-
  Okay, the user teaches ethics and chairs an academic integrity panel. They're struggling because the panel uses a flawed framework: "could the student have done otherwise?" They know from Frankfurt cases that responsibility isn't just about having alternatives. The current approach is both too strict (punishing when no alternatives existed but action was still the student's) and too loose (excusing when alternatives existed but were coerced).

  The user wants a practical decision procedure for non-philosophers that can be applied quickly. It needs to incorporate Frankfurt's insight—responsibility depends on whether the misconduct originated from the student—while making key distinctions like coercion vs. inability, and genuine impossibility vs. difficulty. The procedure must flag when decisions require value judgments.

  Three test cases are provided: 
  1) A student who used a leaked answer key but would have been forced to cheat anyway due to a compromised portal. 
  2) A student coerced by blackmail into sharing work. 
  3) A student with an undiagnosed disorder who plagiarized unknowingly.

  The procedure should handle these in under 20 minutes per case. The user emphasizes plain language and clear termination points. They want honesty about where the procedure might fail.

  For a solution, I'll create a step-by-step flowchart-style procedure with binary questions. Starting with evidence, then moving to coercion, external manipulation, knowledge/will, and finally capacity. Each step either absolves responsibility or passes to the next. Steps 4 and 5 will require human judgment about values.

  Testing on the cases: 
  Case 1: External manipulation (IT hack) means no responsibility—the cheating wasn't sourced in him. 
  Case 2: Coercion exists but wasn't absolute; moves to knowledge/will where she knew it was wrong but chose under pressure—human judgment needed about whether the threat was severe enough. 
  Case 3: No coercion/manipulation, but at capacity step, her disorder prevented understanding plagiarism—no responsibility. The panel went easy, which aligns here.

  The procedure might misfire in close coercion cases (like Case 2) where judging the threat's severity is subjective. Also, it relies on accurate evidence gathering, which could be imperfect. But it addresses Frankfurt's core insight while being practical for quick decisions.
answer: |-
  Here's the decision procedure. Bottom line: **Responsibility hinges on whether the misconduct genuinely originated from the student's own will and understanding, not merely on the existence of alternatives.**

  **The Procedure (Run in Order):**

  1.  **Was the misconduct committed?** (Factual)
      *   *Sufficient Answer:* Clear, preponderance-of-evidence proof (e.g., confession, timestamped document match, eyewitness, IT log) that the specific prohibited act occurred.
      *   *Terminate if "No":* Case dismissed. No misconduct.
      *   *Proceed if "Yes":* Go to 2.

  2.  **Was the student under immediate, credible, and severe coercion that negated meaningful choice?** (Factual/Threshold Judgment)
      *   *Sufficient "Yes":* Direct, imminent threat of significant physical harm to self or others. (e.g., "Copy my answers or I'll break your arm right now.").
      *   *Terminate if "Yes":* **Not Responsible.** Misconduct sourced in threatener.
      *   *Proceed if "No":* Go to 3. *(This catches only the most extreme duress. Financial pressure, social pressure, threats of lesser harm, or blackmail generally proceed.)*

  3.  **Was the misconduct caused by an external manipulation that *forced* the specific outcome, bypassing the student's agency?** (Factual/Causal)
      *   *Sufficient "Yes":* An external force directly caused the *specific* misconduct *regardless* of the student's own choices/intent (e.g., hacker altering submitted file, professor planting false answer key student *unknowingly* used, severe neurological event during exam causing random inputs).
      *   *Terminate if "Yes":* **Not Responsible.** Misconduct sourced in manipulator/event.
      *   *Proceed if "No":* Go to 4. *(This catches Frankfurt-style "no alternative" cases where the *outcome* was inevitable, but the *action* might still be the student's.)*

  4.  **At the time of acting, did the student *know* it was misconduct and *intend* to commit it?** (Judgment Call - Values/Capacity)
      *   *Focus:* Did the student possess the cognitive capacity and received information to understand the rule *and* its application in this context? Did their actions reflect a deliberate choice to violate the rule?
      *   *"Sufficient" is complex:* Requires weighing evidence of understanding (syllabus attestation, prior warnings, clarity of rule, nature of act) vs. evidence of incapacity/confusion (documented severe cognitive impairment, acute mental health crisis, demonstrable profound misunderstanding *despite* reasonable instruction, severe intoxication not sought for advantage).
      *   ***Judgment Required:*** This is the core values gate. If the panel concludes *lack* of knowing intent due to incapacity or profound, reasonable confusion *despite* instruction, responsibility is diminished or absent. If knowing intent existed, proceed.
      *   *Terminate if "No" (Lack of Knowing Intent):* **Not Responsible** (or significantly mitigated). Misconduct did not genuinely flow from *their* will/understanding.
      *   *Proceed if "Yes" (Knowing Intent):* Go to 5.

  5.  **Was the student's choice significantly constrained by pressure/difficulty, making compliance very hard, but *not* impossible or coerced as defined in Q2/Q3?** (Judgment Call - Values/Severity)
      *   *Focus:* Severity of pressure (e.g., blackmail, severe financial duress, extreme workload, serious mental health struggles) and its impact on *this specific choice*.
      *   ***Judgment Required:*** Does the pressure/difficulty *excuse* the knowing violation, or merely *explain/mitigate* it? Key distinction: Could a reasonable person in their specific circumstances, knowing the rules, *still* be expected to choose compliance? Does the pressure break the link between their knowing intent and the action?
      *   *Outcome:* Panel decides responsibility and appropriate sanction. Pressure rarely *absolves* knowing intent (Q4) but strongly informs *culpability* and sanction severity. **Responsible**, but sanctions may be mitigated.

  **Why this works for your panel:**

  1.  **Plain Language:** Uses terms like "forced," "knew it was wrong," "intended to," "severe threat," "caused by manipulation," "very hard but not impossible."
  2.  **Efficient:** Sequential, binary gates. Most cases resolve by Q3. Q4/Q5 are the necessary judgment points.
  3.  **Captures Frankfurt:** Q3 directly addresses "couldn't have done otherwise" *without* excusing responsibility if the act was still the agent's (Q4). Responsibility flows from sourcing in the agent's will/understanding (Q4).
  4.  **Key Distinctions:**
      *   **Q2:** Actual Coercion (negates agency) vs. Pressure (Q5).
      *   **Q3:** Genuine Impossibility (external force) vs. Mere Difficulty (Q5).
      *   **Q4:** Knowledge/Intent vs. Ignorance/Incapacity.
      *   **Q5:** Excuse vs. Mitigation for hardship.

  **Running the Cases:**

  1.  **Leaked Key / Compromised Portal:**
      *   Q1: **Yes.** Misconduct occurred (accessed/used leaked key).
      *   Q2: **No.** Not coercion.
      *   Q3: **Yes.** IT hack *forced* the corrupted submission *regardless* of his action (using the key or not). Outcome was inevitable.
      *   *Verdict:* **Not Responsible.** (His *attempt* to cheat using the key remains problematic, but the *submitted misconduct* (corrupted file) was sourced in the hacker, not him. You might still address the *attempt* separately if evidence shows he sought the key).

  2.  **Blackmailed into Sharing Problem Set:**
      *   Q1: **Yes.** Shared work for copying.
      *   Q2: **No.** Threat (reporting past collaboration) isn't "immediate, credible, severe physical harm."
      *   Q3: **No.** No external force *made* her hand it over. She chose to.
      *   Q4: **Yes.** She almost certainly knew sharing for copying was misconduct and intended to do it to avoid the threat.
      *   Q5: **Judgment Required.** Significant pressure (blackmail). Panel must decide: Does this pressure *excuse* the knowing violation? Likely **NO.** A reasonable student could have reported the blackmail attempt or accepted the consequences of the earlier collaboration. The misconduct (sharing) still flowed from her choice under pressure, not *solely* from the pressure. *Verdict:* **Responsible, but sanctions heavily mitigated.** (The coercion reduces culpability but doesn't negate the knowing choice).

  3.  **Undiagnosed Processing Disorder / Verbatim Copying:**
      *   Q1: **Yes.** Copied verbatim without attribution.
      *   Q2: **No.** Not coercion.
      *   Q3: **No.** No external force made her copy.
      *   Q4: **Judgment Required.** Did she *know* it was misconduct and *intend* to plagiarize? Key evidence: Nature of the disorder, what she was taught about plagiarism/studying, clarity of instructions. If the panel accepts she *genuinely did not understand* that verbatim copying without citation was wrong *because* of her disorder *and* despite reasonable instruction, then **No (Lack of Knowing Intent)**.
      *   *Verdict:* **Not Responsible.** (The action flowed from a fundamental misunderstanding, not a choice to violate a known rule). *Panel was likely correct to go easy.* Sanction might be mandatory remediation on academic integrity/citation, not punishment.

  **Where it Might Misfire:**

  1.  **Q4 (Knowing Intent) is Critical & Subjective:** Distinguishing genuine incapacity/profound confusion from negligence or willful blindness is hard. Requires careful evidence assessment. Overly credulous panels might absolve too easily; overly skeptical panels might punish the genuinely confused.
  2.  **Q5 (Severity of Pressure) is Highly Contextual:** Judging what constitutes "very hard but not impossible" and whether it excuses vs. mitigates is inherently value-laden. Panels might struggle with cultural differences in perceiving pressure (e.g., family honor threats). Consistency is a challenge.
  3.  **Evidence Gaps:** The procedure relies on available evidence. Inconclusive cases might force difficult judgments at Q4/Q5 based on incomplete information.
  4.  **"Genuine Belief" in Permissibility:** Edge cases where a student holds a sincere but objectively unreasonable belief something isn't cheating (e.g., "My culture does it this way," despite clear institutional rules explained to them) will be contentious at Q4. The procedure pushes this into the necessary values judgment.

  This procedure explicitly incorporates Frankfurt by separating *outcome inevitability* (Q3 - not responsible) from *action sourcing* (Q4 - responsible if knowing/intentional), while providing practical gates for coercion (Q2) and hardship (Q5). It forces the panel to confront the core question of the student's will and understanding.
