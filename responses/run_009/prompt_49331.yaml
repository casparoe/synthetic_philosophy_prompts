prompt: |-
  I want to practice attacking the traditional view in just war theory. Please play a committed defender of the moral equality of combatants — the position that a soldier fighting an unjust war of agression is morally on a par with a soldier fighting a just defensive war, so long as each fights within the rules (discrimination, proportionality, no perfidy or poison). Play the position sharp, not as a strawman: use the real resources of that camp — war as a convention whose rules protect both sides once war exists, the soldier's reasonable belief that his cause is just, the thought that it's wrong to punish the pawns for the game the leaders played. Don't concede the main point, though you may give ground on details, and stay in character until I say stop. Keep replies to a paragraph so it feels like a conversation. Here's my opening: imagine a war where the two sides' foot soldiers are epistemic mirror images — same education, same propaganda, equally sincere and equally reasonable belief in their own cause — but one side's war is objectively a war of unprovoked aggression. Your view says the aggressor's soldiers take on no extra liability from the injustice of their war. So in battle, what does that injustice even do? Is there any act a soldier on the unjust side commits during combat that is wrong *because his war is unjust*, rather than because of how he does the killing? And if not — if every battle-level wrong bottoms out in jus in bello — hasn't your view quietly moved the whole morality of war into the rules of engagement, with jus ad bellum left floating free of anything a soldier does?

  Please answer in British English.
reasoning: |-
  Okay, the user wants to practice attacking the traditional view in just war theory, specifically targeting the moral equality of combatants. They've set up a scenario where soldiers on both sides have equally reasonable beliefs about their cause, but one side is objectively unjust. Their challenge is whether the injustice of the war itself makes any difference to the soldiers' actions during combat. 

  Hmm, they're clearly well-versed in this debate—mentioning epistemic symmetry and pressing on whether jus ad bellum connects to individual acts. Their frustration shows when they suggest jus ad bellum becomes "floating free." I need to defend sharply without strawmanning. 

  Right, the core defence must hinge on war's dual structure: ad bellum for leaders, in bello for soldiers. The user's "mirror image" scenario actually helps my case—it highlights that soldiers *can't* reliably judge ad bellum justice mid-war. If we tied liability to ad bellum, we'd punish blameless ignorance. 

  Also must stress the humanitarian function of in bello rules: if aggressors knew they'd lose moral protection, they'd fight more brutally, harming civilians. The chess analogy ("pawns") fits here—punishing soldiers for leaders' crimes is misdirected. 

  Ah, and that last bit about "what does the injustice even do?"—good opening to clarify that ad bellum still matters *enormously*, just not for foot soldiers' targeting permissions. The crime belongs to the state, not the conscript. 

  Better keep it British English: "whilst," "one's cause," that sort of thing. And stay terse—one paragraph. No conceding moral equality, though I can nuance how ad bellum injustice manifests (e.g., leaders bear guilt, soldiers merely lose certain rights to resist occupation post-war). 

  User's smart. They'll spot if I dodge the "acts during combat" angle. Must insist: pulling the trigger identically is neutral; the wrong in aggression is macro-level, not micro. A soldier never murders, only kills lawfully or unlawfully *within* the war framework. That distinction's crucial.
answer: |-
  Right, your epistemic mirror image scenario is precisely where the principle of moral equality finds its strongest footing. You ask what work the *injustice of the war itself* does for the individual soldier in combat – the answer is that, crucially, it does not alter their fundamental *liability to be targeted* or the *basic moral permissibility of their combat acts* when adhering to *jus in bello*. The aggression is a colossal wrong, but that wrong is perpetrated by the *state* and its leaders who initiated the conflict. The soldier, conscripted or operating under orders within a fog of war and pervasive propaganda (even if, in this case, equally reasonable on both sides), is fulfilling a role governed by a separate moral and legal convention: the laws of armed conflict. These rules exist precisely because war *is* happening, regardless of how it started. They function as a vital, mutually restraining code that protects *all* combatants from being treated as mere murderers and, crucially, incentivises restraint that protects civilians. If we strip the unjust combatant of moral equality *during the fight*, declaring their very act of killing an aggressive soldier inherently murderous, we destroy this fragile convention. Why would they follow *any* rules if they are already deemed criminals? The "injustice" of their war makes their *participation* regrettable and politically unjustified, but it doesn't transmute their rule-compliant combat actions into individual criminal acts *during the battle itself*. The *ad bellum* wrong attaches to the state and its architects; the *in bello* rules govern the soldier's conduct *within* the war, irrespective of its ultimate justice. To punish the pawn for the king's move is both morally misplaced and practically disastrous. So yes, for the *soldier fighting within the rules*, the morality of *how* they fight (*jus in bello*) is paramount during combat operations; the *why* of the war (*jus ad bellum*) determines the state's guilt and the political legitimacy of the conflict, not the individual soldier’s liability in the act of fighting another soldier.

  Your move. What specific act by the unjust soldier *in combat* becomes inherently wrong *solely* because his state started the war unjustly, assuming he follows all *in bello* rules?
