prompt: |-
  I'm a journalist who covers science and ideas, and after writing a piece about Augustine (who apparently held that every lie is wrong, even the murderer-at-the-door one, since a lie is speaking against your own mind) I've been cataloguing my own gut verdicts and they're a mess. Lying to a killer at the door about where my friend is: obviously fine. Telling my aunt I love the sweater: fine. Telling a source I've already spoken to their rival when I haven't, to loosen them up: not fine. Telling a grieving widow her husband didn't suffer when I have no idea: not fine. Here's my problem case though — telling someone something literally true but phrased so they'll draw a false conclusion, like answering 'is he seeing someone?' with 'he hasn't mentioned anyone', when I know full well he has. That feels to me worse than a kindly lie, which seems hard to square with any principle where lying is basically about asserting what you believe is false, and hard to square with Augustine too, since on his own definition I haven't lied at all. Also not sure what to do with exaggeration everyone expects — 'I've told you a million times' — which feels like not even a lie, more a licence everyone's signed up to. So: is there a principle, or set of them, that captures all my verdicts, or do I have to give one up? And what does the winner say about the case I keep flip-flopping on, going undercover — telling a source I'm not a journalist when they ask point blank, for a story I think matters? If the principle says that's fine but the rival-loosening lie isn't, I'd want to know what does the work. Keep it usable, I'm writing a follow-up column on this, not a treatise.
reasoning: |-
  Okay, let me unpack this journalist's ethical puzzle. They're wrestling with lying across different scenarios - from killer-at-the-door to sweater compliments - and hitting a snag on two points: technically-true-but-misleading statements and undercover journalism. 

  First I notice their discomfort centers on deception that *feels* dishonest despite avoiding literal falsehoods. That "he hasn't mentioned anyone" example is brilliant because it exposes how truth-telling isn't just about factual accuracy. Augustine's binary "asserting what you believe false" definition suddenly seems inadequate when language can mislead without technically lying. 

  The hyperbolic "million times" case is different - it's socially coded as exaggeration, so the violation is more about context collapse than deception. Reminds me of Grice's conversational maxims where meaning depends on shared expectations. 

  For undercover work, what jumps out is the "point blank" aspect. When directly asked "are you a journalist?", refusing to answer might be less deceptive than lying... but could blow their cover. The tradeoff here seems to be about proportionality - how vital is this story versus violating trust? 

  Their examples actually reveal three distinct dimensions: 
  1. Harm (protecting life vs. sparing feelings vs. professional ethics) 
  2. Consent (widow didn't ask for fiction, aunt expects polite fiction) 
  3. Social contracts (everyone "signs up" for hyperbole) 

  The rival-loosening lie fails all three: creates professional harm, violates source consent, and breaks journalism's social contract. Undercover work might pass if the story justifies the deception as last-resort - but that "point blank" moment still nags at me. Maybe framing it as role-based ethics? Like how undercover cops aren't "lying" but "performing a sanctioned deception"? 

  Hmm... the elegant solution might be shifting from "truth vs lie" to "when does deception undermine human flourishing?" But that's awfully vague for a column. Need something more actionable...
answer: |-
  Your ethical intuitions are sharper than you think—they reveal a coherent framework that *doesn't* require abandoning any of your core judgments. Here’s a practical, principle-based toolkit for your column:

  ### **The Core Principles**
  1. **Intentional Deception vs. Social Conventions**:  
     Lying requires *intentionally asserting falsehood to deceive*. Hyperbole ("a million times") or "white lies" (the sweater) operate within **socially understood conventions** where deception isn’t the goal—they’re cooperative gestures. Augustine might call these "vices," but modern ethics treats them as linguistic lubricant.

  2. **The Harm-Benefit Scale**:  
     Deception is more permissible when:  
     - It prevents **significant harm** (lying to the murderer).  
     - It offers **genuine benefit** with **minimal distortion** (polite gratitude for the sweater).  
     It’s less permissible when:  
     - It causes **harm** (misleading a widow about suffering).  
     - It exploits **trust for unilateral gain** ("I’ve spoken to your rival" to manipulate a source).

  3. **The Consent Principle**:  
     Does the deceived person **implicitly consent** to the deception?  
     - Your aunt *expects* graciousness, not brutal honesty about gifts.  
     - A source *does not consent* to being manipulated for a story.  
     - A grieving widow *needs truth*, not comforting fiction.

  ---

  ### **Your Problem Cases Solved**
  **1. Literal Truths That Mislead ("He hasn’t mentioned anyone")**  
     - **Why it feels worse**: You’re weaponizing honesty. Augustine *would* call this a lie—not because it’s technically false, but because **you intend to deceive while hiding behind literalism**.  
     - **The principle**: *Intentional deception violates integrity, regardless of literal truth*. This isn't about logic—it’s about betraying the spirit of communication.  

  **2. Undercover Journalism ("No, I’m not a journalist")**  
     - **Why it *might* be justified**:  
       - **Proportionality**: The story must expose grave harm (e.g., corporate malfeasance, systemic abuse).  
       - **Last Resort**: No non-deceptive alternative exists.  
       - **Public Interest**: The truth uncovered materially outweighs the deception’s harm.  
     - **Why the "rival-loosening lie" fails this test**:  
       - It’s *not* last-resort (you could say, "I plan to speak with all parties").  
       - The benefit (a juicier quote) rarely outweighs the harm to trust and credibility.  

  **3. Hyperbole ("I’ve told you a million times")**  
     - This isn’t deception—it’s **pragmatic emphasis**. No reasonable person interprets this literally; it’s a shared linguistic shorthand. Augustine’s critique is theological, not practical.  

  ---

  ### **The Winner: A Unified Framework**
  **Journalistic Integrity Minimizes Unconsented Harm**  
  | **Scenario**               | Permissible? | Why?                                                                 |
  |----------------------------|-------------|----------------------------------------------------------------------|
  | Lie to murderer            | Yes         | Prevents grave harm; no consent needed from a threatener.            |
  | "Love the sweater"         | Yes         | Social convention; implied consent; minimal harm/benefit imbalance. |
  | "Spoke to your rival" lie  | **No**      | Exploitative; harms trust; unconsented manipulation for your gain.  |
  | False comfort to widow     | **No**      | Robs her of authentic grief; unconsented distortion of reality.     |
  | "He hasn’t mentioned anyone" | **No**      | Cowardly deception; abuses language to evade moral accountability. |
  | Undercover lie (point-blank) | **Contextual** | Only if: vital public interest + no alternatives + transparency post-exposé. |

  ---

  ### **Why This Works for Augustine (and You)**
  Augustine’s "speaking against your mind" focuses on **internal integrity**. Your aversion to the "literal but misleading" answer aligns with this: it *feels* like a betrayal of truthfulness because it fractures the purpose of communication—even if the words are "true."  

  ### **Your Column’s Punchline**
  > "Ethical deception isn’t about parsing dictionary definitions—it’s about **consent, harm, and humility**. We lie least badly when we deceive only to prevent harm, honor social contracts, or serve justice—never to exploit, evade, or inflate our own convenience. And if a lie needs a loophole? It’s probably a sin against the spirit of truth."

  This framework preserves all your instincts, explains the murderer/undercover duality, and condemns manipulative tricks without absolutism. Use it with my compliments—no deception required.
