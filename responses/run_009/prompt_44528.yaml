prompt: |-
  I'm a graduate student in a philosophy department where I work mainly on social epistemology but have been taking Sanskrit for three years, and I've been given a ninety-minute slot in our epistemology reading group to introduce the Nyāya treatment of śabda -- testimony or, more precisely, the knowledge arising from a trustworthy speaker's words -- as a distinct pramāṇa. The group is about a dozen analytic epistemologists. They know the contemporary testimony literature cold: they've followed the long-running fight over whether testimonial warrant reduces to perception, memory, and induction or is basic in its own right, and several of them have strong commitments on it. They know nothing about Indian philosophy except vague impressions that it is "wisdom literature." My own line, which I want the session to build toward without announcing it too early, is that the standard gloss -- Nyāya as the ancient Indian anti-reductionists, since both sides count testimony as a basic source -- is subtly wrong, and interestingly wrong: the pramāṇa framework isn't carving the pie anywhere near where the reductionism debate assumes, so the apparent convergence hides a real disagreement about what the question is.

  I need a teaching plan, not the explanation itself. Work out the order the pieces have to come in -- I suspect I can't even start with śabda, that I have to first get across what it means to enumerate pramāṇas at all, with each source having its own definition, conditions, and characteristic operation, and that this is a different intellectual project from listing "ways of knowing" in the casual Western sense -- and tell me whether that suspicion is right and what depends on what. Then help me pick the carrying example: I'm torn between the very mundane case of learning from a reliable passerby that the mangoes at a particular stall are ripe, and the classic one about someone in southern India who has never left the lowlands coming to know that the Himalayas are snow-capped; say which better does the work and what the example must have and must lack. I also want a map of the misconceptions this audience will predictably form and where in the sequence to head each off -- my guesses are that they will assimilate the pramāṇa list to a reliabilist taxonomy, that they will read the trustworthy-speaker condition as their own familiar "no defeaters plus reliability" story and miss that it includes the speaker's intention to convey truth rather than mislead, and that they will hear "scripture" when I say śabda and conclude the whole framework is epistemology in the service of theology, but correct me if you see worse ones. Tell me what to openly refuse to cover at this level and say so out loud -- I assume the Buddhist reductionist opponents who argued śabda collapses into inference deserve more than a sentence, but I can't do them justice in ninety minutes alongside everything else, so advise me on whether to cut them entirely or set them up as the cliffhanger. Finally, give me one question I can ask at the end that would reveal whether they've actually understood what a pramāṇa is, rather than just filed Nyāya under "testimony, basically anti-reductionist, very old."
reasoning: |-
  Okay, the user is a grad student in philosophy focusing on social epistemology, with three years of Sanskrit, preparing a 90-minute session on Nyāya's treatment of śabda for analytic epistemologists. The main goal is to challenge the standard view that Nyāya is simply anti-reductionist about testimony, arguing instead that the pramāṇa framework operates on a fundamentally different level than the contemporary reductionism debate. 

  First, I need to unpack the core tension: the audience will come in with well-formed views on testimony (reductionism vs. anti-reductionism), but Nyāya's pramāṇa theory isn't even answering the same question. The real work is to make them see that "basic source" means something entirely different here—not about epistemic priority but about irreducible causal mechanisms for knowledge-generation. 

  The user suspects they must start with the pramāṇa framework itself rather than jumping into śabda, and I agree. If we dive straight into testimony, the audience will force-fit it into their existing categories. We need to first dismantle the assumption that "pramāṇa = way of knowing" in the loose Western sense. Key moves: 

  - **Start with perception (pratyakṣa)** as the least alien concept. Use a mundane example (e.g., seeing a jar) to show how Nyāya defines a pramāṇa: (1) unique causal process, (2) specific object type, (3) distinct failure modes. Contrast with how "perception" in Western epistemology often bundles sensation, judgment, and justification. 

  - **Then introduce inference (anumāna)** to highlight how Nyāya carves the epistemic landscape by *mechanism*, not justification structure. Use a stock example (smoke → fire) to show its defined components (hetu, sādhya, pakṣa). Emphasize that this is about *how knowledge arises*, not about logical deduction vs. induction. 

  - **Only now bring in śabda**. The Himalayan example is superior to the mango stall because it prevents reduction to perception (no sensory access to snow) or inference (no prior correlations for the hearer). It forces the audience to see śabda as a distinct *causal route*—words triggering understanding via speaker's competence and intention. 

  **Misconceptions to preempt**: 
  1. *Reliabilism*: They might think pramāṇas are just reliable processes. Counter by stressing the *causal ontology*—each pramāṇa is defined by what *brings about* knowledge, not just its success rate. 
  2. *Trust as reliability+defeaters*: Nyāya's "trustworthy speaker" includes *intention to inform*, which isn't part of contemporary "reliability." Use a liar example: even a reliable liar fails śabda because intent corrupts the causal chain. 
  3. *Scripture bias*: Explicitly state that śabda covers everyday testimony, and Vedic examples are a subset. 

  **Cutting content**: Buddhist reductionism is tempting but derailing. Mention it fleetingly as "some argued śabda reduces to inference" but postpone the debate. The goal is to establish Nyāya's framework, not defend it. 

  **Final question**: "If a child learns '2+2=4' from a competent, truthful teacher, is that śabda? What if they later reconstruct the proof? Does that change the original pramāṇa?" This probes whether they grasp śabda as the *initial causal mechanism*, distinct from subsequent justification. 

  The user's hidden challenge is making 2500-year-old concepts feel urgent to modern epistemologists. The payoff is showing that Nyāya isn't just "old anti-reductionism"—it's a radical lens for rethinking how we taxonomize knowledge itself.
answer: |-
  Here’s a structured teaching plan for your 90-minute session, designed to confront misconceptions and build toward your thesis. The sequence is crucial to prevent premature assimilation into Western frameworks. Total time estimates are flexible (±5 mins).

  ---

  ### **Teaching Plan: Nyāya on Śabda as Pramāṇa**
  **Core Objective:** Show that Nyāya’s *pramāṇa* framework operates on a different plane than the reductionism debate, making "anti-reductionist" labels misleading.

  #### **Phase 1: Groundwork – What *is* a Pramāṇa? (30 mins)**
    - **Start with Perception (*Pratyakṣa*)** (12 mins):  
      - *Example:* "You see a jar on the table."  
      - **Key Points:**  
        - Define *pramāṇa* as a *distinct causal process* generating knowledge (*pramā*), not a "way of justifying beliefs."  
        - Highlight Nyāya’s components:  
          (a) **Unique operation** (e.g., sense-object contact),  
          (b) **Specific object** (*viṣaya*: the jar’s color/shape),  
          (c) **Characteristic failure modes** (e.g., dim light → illusion).  
      - *Preempt Misconception:* Contrast with "perception" in Western epistemology (e.g., not discussing qualia or foundationalism). Stress: *pramāṇa* is about *genesis*, not justification.

    - **Introduce Inference (*Anumāna*)** (10 mins):  
      - *Example:* "Seeing smoke on a hill, you infer fire."  
      - **Key Points:**  
        - Emphasize the *fixed causal structure*: hetu (mark), sādhya (target), pakṣa (locus).  
        - Show it’s not "inference" in the Western sense (e.g., not probabilistic reasoning).  
      - *Why this order?* Perception and inference are least alien. Establishes *pramāṇas* as *sui generis* causal mechanisms.

    - **Define the Pramāṇa Project** (8 mins):  
      - Nyāya asks: "What are the irreducible *sources* of knowledge?" Each has:  
        - A domain of objects it alone can access (e.g., inference grasps universals).  
        - Unique causal conditions for success/failure.  
      - **Contrast:** Western "ways of knowing" often list justificatory routes (e.g., "testimony based on perception+memory"). Nyāya’s list is about *metaphysics of knowledge-production*.

  #### **Phase 2: Introducing Śabda (20 mins)**
    - **The Example: Use the Himalayas** (5 mins):  
      - *Scenario:* A lifelong resident of hot Tamil Nadu learns from a trustworthy geographer: "The Himalayas are snow-capped year-round."  
      - **Why Himalayas > Mangoes:**  
        - Eliminates reduction to perception (no sensory access) *or* inference (no prior correlations for the learner). Forces śabda as the *only* possible pramāṇa.  
        - Mundane cases (mangoes) risk assimilation to perception ("he saw the ripeness") or induction ("he’s reliable").  

    - **Conditions for Śabda** (15 mins):  
      - **Trustworthy Speaker (*Āpta*)** = Competence + Truthfulness *+ Intention to Inform*.  
        - Stress: "Intention to convey truth" is non-negotiable (e.g., a reliable liar isn’t *āpta*).  
      - **Process:** Words → Auditory perception → Semantic comprehension → Knowledge.  
      - *Preempt Misconceptions:*  
        - **NOT "reliability + no defeaters":** Competence + intent precedes reliability. A mistaken *āpta* still delivers *śabda* (just false knowledge)!  
        - **NOT theological:** Śabda applies to everyday testimony. Vedic śabda is a subset with added conditions.

  #### **Phase 3: The "Anti-Reductionism" Misdirection (25 mins)**
    - **State the Standard Gloss** (2 mins): "Nyāya is anti-reductionist about testimony."  
    - **Dissect the Illusion** (15 mins):  
      - Reductionism debate asks: "Is testimonial warrant *derived* from other sources?"  
      - Nyāya asks: "Is there a *unique causal process* generating knowledge from words?"  
      - **Crucial Divergence:**  
        - Even if śabda *used* perception (hearing words), its *knowledge* arises from comprehension of meaning via a speaker’s intent/competence.  
        - Like inferring fire from smoke *uses* perception but generates *new* knowledge via a distinct process.  
      - *Reveal Your Thesis:* Nyāya’s "basic source" ≠ "epistemically primitive." It’s about causal ontology. The debate talks past Nyāya.  

    - **Address Buddhism Briefly** (8 mins):  
      - *One Sentence:* "Buddhists like Dignāga reduced śabda to inference (words as 'inferential signs')."  
      - *Why Mention It?* Frames Nyāya’s defense of śabda as defending a *distinct causal mechanism*, not "anti-reductionism" per se.  
      - *Cut Deeply:* Don’t engage arguments. Say: "This deserves a whole session, but note: Nyāya’s rebuttal hinges on śabda’s *direct* access to unrepeatables (*vyakti*), unlike inference."

  #### **Phase 4: Recap & Final Question (15 mins)**
    - **Synthesis** (5 mins):  
      - Pramāṇas are about *how knowledge is produced*, not belief justification.  
      - Śabda requires a speaker’s competence + truth-intent, making it irreducible *causally*.  
      - Western reductionism and Nyāya’s "basic sources" answer different questions.  

    - **The Revealing Question** (10 mins for discussion):  
      > **"If a child learns '2+2=4' from a competent, truthful teacher, is that śabda? What if they later reconstruct the proof independently? Does that change the *pramāṇa* by which they *first* knew it?"**  
      - *Tests Understanding:* Correct answer is **yes, it remains śabda**. If they say "no, it reduced to inference," they missed Nyāya’s causal/genetic focus.  

  ---

  ### **Key Strategic Choices**
  1. **Order is Non-Negotiable:**  
     - Starting with *pramāṇas* generally is essential. Jumping to śabda first guarantees reductionist framing.  
     - Perception → inference → śabda shows the *framework* before the case study.  

  2. **What to Explicitly Exclude:**  
     - Openly say: "We won’t cover Indian theories of meaning (*śabda-vāda*), ontology of universals, or detailed Buddhist objections today. This is about the pramāṇa framework’s structure."  

  3. **Misconceptions to Hammer:**  
     - **Reliabilism:** "Pramāṇas aren’t reliable processes; they’re *defined* by their causal architecture."  
     - **Speaker Trust:** "Nyāya’s *āpta* includes *intent*—unlike contemporary 'reliability'."  
     - **Theology:** "Śabda isn’t 'scripture'; it’s why you believe your advisor when they explain Kant."  

  4. **Why Himalayas Work Best:**  
     - Creates a *knowledge gap* only śabda can fill. Mangoes invite perceptual/inferential "filling in."  

  ---

  ### **Predicted Pitfalls & Rebuttals**
  - **"So Nyāya *is* anti-reductionist!"**  
    → Retort: "Only if you conflate 'causally irreducible' with 'epistemically non-derivative.' But reductionism is about warrant, not causation."  

  - **"Trustworthiness just *is* reliability."**  
    → Counter: "A speaker who *intends* truth but is misled (e.g., honest GPS error) fails Nyāya’s test but passes reliabilism."  

  - **"This is just externalism!"**  
    → Clarify: "Nyāya cares about the *mechanism*, not internal/external justification. A pramāṇa can fail even if reliable (e.g., inferring based on coincidental correlations)."  

  ---

  **Final Tip:** Use a whiteboard to map:  
  ```
  Pramāṇa → Unique Causal Process → Knowledge (Pramā)  
             │  
             ├─ Specific Object  
             ├─ Success Conditions  
             └─ Failure Cases  
  ```
  Contrast with Western "Sources of Justification" diagram. The visual disconnect reinforces your thesis. Good luck!
