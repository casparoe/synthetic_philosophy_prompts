prompt: |-
  I'm trying to figure out what we're even asking for when we ask what a society should equalize -- welfare, resources, capabilities, opportunity for welfare, whatever. Before I go read the actual debate (sen, dworkin, cohen, rawls etc.) I want the spec first, not the survey. So: write me the desiderata that any adequate "equalisandum" -- the thing a theory of equality says we're trying to make equal -- has to meet.

  Some things I'd want on the list but don't know how to weight:

  - it has to handle expensive tastes and cheap tastes without collapsing into "we subsidize people who develop a taste for fine wine"
  - it has to handle adaptive preferences, the oppressed-person-who-says-she's-fine case, without the theorist claiming to know better than everyone what's good for them
  - it has to be measurable at least in principle -- if we can't even in principle say who's worse off, the theory can't guide institutions
  - it has to say something about disability, since a pure resource metric seems to hand the same bundle to a paraplegic and an able-bodied person and call that equal, which seems wrong
  - it has to be compatible with some kind of responsibility-sensitivity, luck egalitarian intuitions, without making desert the whole theory
  - it has to survive the guy who voluntarily takes a huge gamble, loses, and demands compensation -- or else explain why that intuition is confused

  For each requirement say what the motivating case is and whether it's a hard constraint or just one camp's prejudice dressed up as a requirement. Then tell me which pair of desiderata you think can't be jointly satisfied -- my hunch is the expensive tastes one and the adaptive preferences one are in tension, since handling the first pushes you towards subjective welfare and handling the second pushes you away from it, but I want to know if that's right or if there's a clever escape. Also flag which single requirement knocks out the most contenders.

  Don't bother with a reading list or citations, I know roughly who the players are and I'll get to them. What I want is the list of demands, because I suspect the demands themselves are where all the action is. And if you think some of my bullet points above are actually bad requirements -- like, they presuppose an answer -- say that too, that's the kind of thing I'm trying to catch before I'm deep in the literature.
reasoning: |-
  Okay, the user is diving deep into political philosophy, specifically the debate around what a society should aim to equalize. They want a clear set of criteria—desiderata—that any proposed "equalisandum" must meet, without getting into the literature yet. They've listed some initial thoughts but want a structured, critical analysis.

  First, I need to unpack their bullet points. They mention expensive tastes, adaptive preferences, measurability, disability, responsibility-sensitivity, and gamblers demanding compensation. Each of these points to classic problems in equality theories. The user seems well-versed enough to recognize key thinkers but wants to avoid bias by starting with the requirements themselves. Their unspoken need might be to identify where the real philosophical tensions lie before committing to a theory.

  The user's hunch about tension between expensive tastes and adaptive preferences makes sense. Subjective welfare handles expensive tastes (if we don't compensate them) but struggles with adaptive preferences because oppressed individuals might report high satisfaction despite injustice. Objective metrics avoid that but might ignore legitimate preferences, leading to paternalism. That's a core conflict.

  For descriptors, I should define each desideratum clearly, give a motivating case, and categorize it. The user wants to know which are hard constraints versus contested. For example, the "paternalism avoidance" requirement around adaptive preferences might be seen as liberal bias—some communitarians might argue societies should shape preferences. But in liberal theory, it's crucial.

  Measurability feels like a practical constraint but ties into deeper issues. If something can't be measured, it's useless for policy. Disability is a litmus test—any theory failing here is inadequate. Responsibility-sensitivity is central to luck egalitarianism but contested by strict egalitarians. The gambler case tests if responsibility is handled consistently.

  The user also wants to know which desiderata conflict and which single requirement eliminates most theories. The expense-adaptive tension is key. Also, "Paternalism Avoidance" alone might sink all subjective welfare approaches. Meanwhile, "Disability Adequacy" rules out simple resource equality.

  I should also note if any of their points are problematic. For instance, the gambler case assumes luck egalitarian intuitions—desert skeptics might reject the whole framework. But since the user mentions luck egalitarianism, I'll keep it.

  Finally, structuring the response: list each desideratum with a definition, case, and constraint type. Then discuss conflicts, knockout power, and any biased assumptions. Highlight the expense-adaptive tension as fundamental and note where requirements might presuppose answers.
answer: |-
  Here's a distilled list of desiderata for an adequate "equalisandum," analyzing your points and adding critical constraints. These represent core challenges any theory must address to be internally coherent and practically relevant:

  1.  **Anti-Costly-Preference Subsidy (Expensive Tastes Constraint):**
      *   **Definition:** The theory must *not* require compensating individuals simply because they have cultivated expensive tastes or preferences that are costly to satisfy, compared to others with cheaper tastes yielding similar subjective satisfaction.
      *   **Motivating Case:** Person A is content with simple food and cheap entertainment. Person B cultivates a taste for vintage champagne and space tourism. Both report equal subjective welfare. Should society subsidize B's lifestyle to maintain equality? Intuition says no.
      *   **Constraint Type:** **Hard Constraint** for most luck-egalitarian/liberal-egalitarian theories. A theory violating this loses credibility by rewarding deliberate choice to become expensive to satisfy. *However*, strict utilitarians might bite the bullet here.

  2.  **Paternalism Avoidance (Adaptive Preferences Constraint):**
      *   **Definition:** The theory must avoid falsely declaring someone well-off or undeserving of compensation solely because they report satisfaction due to *adaptation* to unjust or deprived circumstances, without the theorist overruling their stated preferences based on an external standard of "true" welfare.
      *   **Motivating Case:** A person raised in severe poverty or systemic oppression reports being content and not wanting more resources or opportunities. An objective "good life" list might declare them deprived. A purely subjective welfare metric would declare them fine. Both extremes are problematic.
      *   **Constraint Type:** **Hard Constraint** for liberal theories valuing individual autonomy and avoiding state-imposed conceptions of the good. *However*, theories emphasizing objective goods or societal flourishing might see this as a lesser concern.

  3.  **Feasible Interpersonal Comparability (Measurability Constraint):**
      *   **Definition:** The metric must allow for meaningful interpersonal comparisons (at least ordinally, preferably cardinally) *in principle*, using methods accessible to reasonable social institutions (even if imperfect in practice). We must be able to say, with justified confidence, "Person X is worse off than Person Y *in terms of the equalisandum*."
      *   **Motivating Case:** If we cannot compare individuals' "capability sets" or "opportunity for welfare" in a way that guides policy, the theory becomes purely abstract and useless for institutional design.
      *   **Constraint Type:** **Hard Practical Constraint.** A theory failing this might be philosophically interesting but cannot function as a guide for social justice. Demanding *perfect* measurement is unreasonable, but demanding *meaningful comparability* is essential.

  4.  **Disability Adequacy:**
      *   **Definition:** The theory must recognize that individuals with significant disabilities require *more* resources, or a different bundle, or compensation targeting a different metric, to achieve a level of advantage comparable to an able-bodied person with the same "baseline" resources.
      *   **Motivating Case:** Giving identical resource bundles to a paraplegic and an able-bodied person demonstrably leaves the paraplegic worse off in terms of mobility, access, and often opportunities. Equality of resources alone fails.
      *   **Constraint Type:** **Near-Hard Constraint.** Any plausible theory of equality must address this fundamental injustice. Failure here is a major weakness. *Note:* This pushes strongly against pure resource equality.

  5.  **Responsibility-Sensitivity (Luck Egalitarian Core):**
      *   **Definition:** The theory must, at its core, aim to equalize the *circumstances* for which individuals are *not responsible* (brute luck), while allowing inequalities arising from *choices* for which individuals *are* responsible (option luck). It must incorporate a notion of agency and choice without collapsing into pure desert theory.
      *   **Motivating Case:** Why should someone who chooses to surf all day instead of work have the same income/resources as someone who works hard? Why should someone born with a rare disease be worse off than someone born healthy?
      *   **Constraint Type:** **Central Requirement for Luck Egalitarianism**, but **Contested** by strict egalitarians (who prioritize outcome equality regardless of cause) and sufficientarians (who prioritize meeting a threshold). It's the defining feature of one major camp.

  6.  **Option Luck Non-Compensation (The Gambler Constraint):**
      *   **Definition:** The theory must *not* require compensating individuals for losses resulting from gambles they voluntarily and knowingly undertook, where the risks and potential outcomes were reasonably understood.
      *   **Motivating Case:** Person A invests their life savings in a high-risk startup, fully aware of the chance of total loss. It fails. Person B invests conservatively and safely. Should A receive compensation to equalize their outcome with B?
      *   **Constraint Type:** **Corollary of Responsibility-Sensitivity (5).** It's a specific test case for *how* responsibility-sensitivity is implemented. A theory compensating the gambler likely violates (1) and undermines (5). Failure here suggests a flawed conception of responsibility.

  **Critical Tensions & Knockout Power:**

  1.  **Your Hunch is Correct: The Core Tension is between (1) Anti-Costly-Preference & (2) Paternalism Avoidance.**
      *   **Why?** Avoiding subsidizing expensive tastes **(1)** pushes theories *away* from subjective welfare (because subjective welfare *would* demand compensation if B's welfare drops below A's unless they get champagne). But avoiding paternalism **(2)** pushes theories *away* from purely objective metrics (because an objective list *would* declare the adapted person deprived even if they report satisfaction). This creates a powerful squeeze.
      *   **The Clever Escape Attempts:** Theorists try to thread this needle via:
          *   **Hypothetical Preferences/Objective Lists w/ Autonomy:** Capabilities (Sen/Nussbaum) focus on what people *could* do/be, not just what they *do* or *feel*. "Opportunity for Welfare" (Arneson) focuses on the chances people had, not their actual choices/feelings. Resources + "Cheapest Cost Insurer" (Dworkin) tries to account for disability/taste *as risk* factored into hypothetical insurance markets. These all attempt to find an *objective* or *counterfactual* basis that respects agency without being hostage to subjective reports or imposing external goods. Success is debated.
          *   **Distinguishing Formation:** Some argue we should compensate for expensive tastes *only* if they were formed involuntarily (e.g., due to upbringing/conditioning), not if cultivated deliberately. This tries to split the difference but faces the measurement/hard paternalism problem of judging taste formation.

  2.  **The Single Biggest Knockout Requirement: Paternalism Avoidance (2).**
      *   **Why?** It eliminates:
          *   **Simple Objective Goods/Welfare Metrics:** They inevitably declare the adapted person deprived against their will, violating (2).
          *   **Perfectionist Theories:** They impose a specific conception of the good life, violating (2).
          *   **Many Strictly Subjective Welfare Metrics:** While respecting reported preferences avoids paternalism, they catastrophically fail (1) and (6). They survive (2) but die on other hills.
      *   (2) forces theories to have a sophisticated account of preference formation, agency, and advantage that isn't purely subjective *or* purely objective. This eliminates the most straightforward (and often most measurable) approaches.

  3.  **Other Notable Tensions:**
      *   **(3) Measurability vs. Complexity:** Sophisticated metrics designed to handle (1), (2), (4), and (5) (like Dworkin's hypothetical insurance or fine-grained capability sets) often face significant practical measurement challenges **(3)**.
      *   **(5) Responsibility-Sensitivity vs. Strict Equality:** This is the fundamental divide between luck egalitarians and others. Requirement (5) explicitly rules out strict outcome egalitarianism and simple sufficientarianism as *theories of equality* (though they remain important theories of justice).
      *   **(4) Disability Adequacy vs. Pure Resource Equality:** Requirement (4) is the primary killer of simple resource-based theories (like strict equality of income/wealth).

  **On Potential Bias in Your Requirements:**

  *   **The Luck Egalitarian Framework:** Your requirements (1, 5, 6) and the framing heavily presuppose the *luck egalitarian* project (Dworkin, Cohen, Arneson, Roemer). This framework prioritizes the distinction between choice and circumstance. If one rejects luck egalitarianism *entirely* (e.g., favoring relational equality (Anderson), democratic equality (Rawlsian interpretations), or strict sufficiency), then (5) and its corollary (6) become "one camp's prejudice," and (1) might be interpreted differently. However, *within* the luck egalitarian project (which dominates the "equalisandum" debate you reference), your requirements are core.
  *   **Liberalism:** Requirement (2) strongly reflects liberal concerns about state overreach and individual autonomy. Communitarians or perfectionists might be less troubled by some forms of paternalism.

  **In Summary:** The desiderata create a demanding gauntlet. The tightest squeeze is between not subsidizing expensive choices **(1)** and not overriding the expressed preferences of the adapted **(2)**. The requirement for **Paternalism Avoidance (2)** is the most potent eliminator of contenders. Any viable theory must offer a sophisticated, agency-respecting, yet normatively robust metric of advantage that navigates these rocks – typically something like capabilities, opportunity for welfare, or resources adjusted by a sophisticated responsibility-sensitive mechanism (like hypothetical insurance). The debate largely revolves around *which* of these sophisticated approaches best satisfies the *full* set of constraints.
