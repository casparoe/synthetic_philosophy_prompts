prompt: |-
  My two colleagues have been fighting for a year about what von Neumann actually thought in The Computer and the Brain, the unfinished little book he was writing for the Silliman lectures when he died (published 1958). They've finally agreed to write up an adversarial collaboration, and I'm supposed to draft the joint statement for them to react to. Can you write it?

  Group A reads him as claiming a difference in kind: the brain computes with shallow depth, low-precision components and enormous parallelism/redundancy, and its language is characteristically statistical rather than mathematical -- so for von Neumann the brain was not just a slower, noisier digital machine, and describing it would need different mathematics than the logico-arithmetical stuff he himself used for computers. Group B reads a difference of degree: the analog, noisy, shallow aspects are engineering expediencies, since he explicitly notes you can trade precision against reliability and speed, so on his own view the brain and EDVAC are the same kind of thing and the rest is quantitative variation.

  Please give me: a numbered section of claims both could sign (about what the text actually says, about the depth/precision tradeoff, about which of his guesses held up and which didn't); then a disagreements table where each side's position is phrased so that side would accept the wording; then the cruxes -- I suspect one is whether his statistical-language remark is a placeholder for a genuinely new mathematics or just a description of noise, and another is how he'd react to deep networks, which are shallowish in depth but very much digital in precision. For each crux, say what passage or consideration both sides agree bears on it, plus each side's prediction about what that evidence supports. And if part of their fight turns out to be verbal -- e.g., what counts as fundamentally different -- say which part and why. Don't feel you have to be neutral on who reads him better, but the joint statement itself has to be something both could sign.
