prompt: |-
  I'm a novelist, and the book I'm drafting turns on a single argument scene. My protagonist is a retired actuary, a lifelong secularist now in her final months of illness, whose daughter has joined a small ascetic religious order; the daughter comes to the hospice and, gently but seriously, presses something like Pascal's wager on her mother — live as if the order's eschatology were true, observe its devotions for the months that remain, and in exchange accept a chance at an eternity that dwarfs everything else at stake. I want the mother to refuse, and I need her refusal to be intellectually honorable: the scene will fail if readers see the daughter as a fool or the mother as a coward. I could always rig it the standard way — invent rival sects with rival eternities so the many-gods objection does the work — but that has been done a thousand times, and I want the scene to have philosophical teeth even for readers who know the literature.

  So I'd like you to construct the thought experiment underlying this scene, to the following specifications. The case must preserve the Wager's decision structure: the cost of wagering is modest but real — it genuinely reorganizes what remains of the protagonist's life, it is not a costless gesture — while the promised payoff is of a different order of magnitude from every other consideration in play. Since I am the author and may stipulate the background, build the case so that exactly one dominant-payoff hypothesis is in play and the many-gods objection gets no purchase. The probability of the payoff must be genuinely estimable and not insultingly small: the protagonist, being a professional, assigns it something like one in a few thousand — an actuarial-style figure she cannot in conscience dismiss, of the sort her trade prices every day. And yet she must be reasonable in refusing. Her refusal has to fall out of a principled decision-theoretic worry that a serious philosopher would recognize — something in the neighborhood of whether expected-value reasoning is even well-behaved when payoffs of this size enter the arithmetic — and not from the cheap moves: not from the probability being secretly zero, not from rival gods, not from the cost being ruinous, and not from a stipulated character flaw. Keep the scenario itself to one paragraph, keep it realistic, and let the fiction never reveal which way the world actually goes.

  After the scenario, walk me through the machinery. Tell me what unrestricted expected-value maximization says and why; tell me how the most natural Pascalian repair — whether by dominance reasoning, by trimming the payoff down to something merely enormous, or by whatever route you think is strongest — fares in this specific case and where it leaks; and identify which single feature of the construction is doing the work, so I know what the scene is really about. Then tell me what happens if I remove that feature: does the case collapse back into the ordinary Wager, where refusing looks unreasonable after all? Finally, tell me how a defender of the wager would attack the case, and give me your honest judgment on whether the scene, built this way, will strike a philosophically literate reader as fair to both characters. I should add what the case is for, since it fixes what counts as cheating: the scenario has to generate the refusal from the decision theory, not stipulate it — if the only way to make the mother reasonable is to quietly tilt the setup, my readers, who are sharper than I am, will smell it.
reasoning: |-
  Okay, the user is a novelist crafting a pivotal argument scene between a dying secularist mother and her religious daughter. They need a philosophically robust refusal of Pascal's Wager that avoids clichés. Let me unpack their requirements carefully.

  The core challenge is creating a scenario where expected value maximization technically favors accepting the wager, yet refusal remains intellectually defensible. The mother is an actuary - her credibility hinges on probability assessments that feel professional. Key constraints: no rival gods, non-zero probability (~1/3000), real but non-ruinous cost, and payoff must be genuinely infinite.

  Hmm... standard responses won't work. Many-gods objection is banned, and we can't manipulate probability to zero or make costs prohibitive. The solution must lie in how infinite utilities behave in decision theory. I recall Pascal's Wager has known issues with infinitudes - perhaps we can exploit that.

  The Archangel's Coin idea crystallizes: a physical artifact with documented resurrection properties. Concrete probability (1/3000) from historical records satisfies the actuary angle. The twist? The payoff includes eternal torment risk. But that's still infinite expectation if we take the difference of infinities...

  Wait - that's the trap! The mother's insight is recognizing that subtraction of infinities is mathematically undefined. Expected value becomes ∞ - ∞, which is indeterminate. This isn't about probability but about the framework breaking down at extremes. Her refusal isn't rejecting math but upholding its integrity.

  Testing removal: if we make salvation the only outcome, refusal becomes indefensible. If we cap payoffs, it collapses to standard cost-benefit analysis the daughter would win. The coin's dual infinite outcomes create the necessary paradox.

  Will philosophers accept this? Yes - Hájek and others have written about infinitary problems in Pascal. The daughter can counter that we must act despite indeterminacy, making her position defensible too. Both characters emerge with dignity: the mother upholding rigor, the daughter embracing hope beyond calculation.

  For the scene... the hospice setting matters. The physical coin makes abstraction tactile. The mother's trembling hands on actuarial tables show her conflict. Her closing line about "betting with broken arithmetic" could carry emotional weight while honoring the philosophy.
answer: |-
  Here’s the scenario, decision-theoretic machinery, and philosophical analysis tailored to your specifications:

  ### The Scenario  
  The daughter’s order possesses a unique artifact: a 17th-century "Archangel’s Coin," minted by a sect claiming divine revelation. Historical records show the coin was flipped once per generation under strict ritual conditions. Of 2,923 documented flips, *one* resulted in the participant’s instantaneous bodily resurrection and ascension (verified by multiple secular witnesses). The order’s eschatology hinges on this: devotees who die holding the coin face a "final flip" at death. "Heads" grants eternal beatitude; "tails" delivers eternal torment. The mother must spend her remaining months in ascetic devotion (renouncing pain medication, final visits with friends, and her beloved music) to qualify as a holder. As an actuary, she calculates the resurrection record implies a 1/2,923 probability of a *biased coin*, translating to a 0.00034 chance of salvation. The cost is bearable but profound; the reward/punishment infinite.  

  ### The Machinery  
  1. **Unrestricted Expected Value (EV) Maximization**:  
     - EV(Wager) = [Prob(Salvation) × ∞] + [Prob(Damnation) × (-∞)] + [Prob(Null) × (Finite Cost)]  
     - With Prob(Salvation) ≈ 0.00034 > 0 and Prob(Damnation) > 0, this reduces to **∞ - ∞ + Negative Finite Value**.  
     - **Problem**: ∞ - ∞ is mathematically undefined. EV collapses into indeterminacy.  

  2. **Pascalian Repairs & Their Leaks**:  
     - **Trimmed Payoff**: Suppose we cap eternity at some finite but vast value (e.g., 10¹⁰⁰ utils). EV then favors wagering: (0.00034 × 10¹⁰⁰) >> Cost.  
       - *Leak*: This betrays the wager’s core premise—eternity *is* incomparably larger than finite costs. Capping it is philosophically dishonest.  
     - **Dominance Reasoning**: "If salvation is possible, wagering dominates not wagering."  
       - *Leak*: Ignores the symmetrical risk of infinite *loss* (damnation). Without probabilistic weighting, dominance fails when both ∞ and -∞ are in play.  

  3. **The Crucial Feature**:  
     The dual infinite utilities (salvation *and* damnation) create **indeterminate expected value**. The mother’s refusal rests on rejecting *indeterminacy as a guide to rational action*. She argues: "When the math dissolves into ∞ - ∞, we must default to *extant reasons*—and I have no evidence to privilege salvation’s probability over damnation’s."  

  ### Removal Test  
  If you **remove the threat of infinite loss** (e.g., tails yields mere annihilation), EV becomes:  
  (0.00034 × ∞) + (0.99966 × -Cost) = **∞**  
  Refusal now *is* unreasonable by EV standards. The case collapses into Pascal’s original wager.  

  ### Defense & Fairness  
  - **Pascalian Counterattack**: "Indeterminacy isn’t an excuse for inaction. We must use *decision rules for uncertain infinities*: e.g., ‘Choose the act with the best possible outcome’ (salvation)."  
  - **Your Philosophical Readers**:  
    - **Fair to Daughter**: She offers a *coherent* wager with non-zero salvation probability. Her appeal isn’t fear-mongering; it’s grounded in historical evidence and decision theory.  
    - **Fair to Mother**: Her refusal leverages a documented problem in infinite decision theory (e.g., Hájek’s "**Wager Endures**" critique). It’s not cowardice but rigor: wielding EV consistently *requires* rejecting indeterminate gambles.  
    - **Verdict**: Philosophically literate readers will recognize this as a **valid, non-cheating tension**. The daughter has a strong pragmatic case; the mother has a strong meta-rationality case.  

  ### Why It Works for Your Scene  
  - **Teeth for Experts**: Engages the "**Petersburg-like Wagers**" literature (Bartha 2007) where infinities sabotage decision rules.  
  - **Acts of Refusal**: The mother isn’t dismissing probability; she’s holding decision theory accountable. Her actuarial expertise shows in calculating *and then invalidating* the EV.  
  - **Unspoken Stakes**: The scene’s core is **epistemic humility vs. transformative hope**. The daughter asks for faith in *action*; the mother demands faith in *reason’s limits*.  

  **Final Note**: The artifact (coin) and historical probability ground the abstraction. The mother’s cost—renouncing palliative care—makes the wager *physically* real. Her refusal isn’t about winning an argument but dying as her unbent self.
