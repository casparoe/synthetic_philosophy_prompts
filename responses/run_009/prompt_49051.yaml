prompt: |-
  I'd like you to compare two rival answers to the boundary problem in democratic theory — the question of who belongs to the demos entitled to vote on a given collective decision. The first is the all-subjected principle: everyone who is subject to a decision's authority — bound by the resulting law or its enforcement — is entitled to a vote. The second is the affected-interests principle: everyone whose interests are significantly affected by the outcome is entitled to a vote, regardless of whether they fall under the deciding body's authority.

  To keep the comparison concrete, please work through three cases: (a) a referendum in an upstream region on diverting a river that supplies a downstream region; (b) a city council vote on zoning and flood defenses whose main costs and benefits fall on people who will only move there, or be born, decades from now; and (c) a national election in which a central issue is a tariff whose heaviest burden falls on foreign producers and consumers abroad. Which principle handles each case better, and do the cases expose a shared weakness — for instance, both principles struggling to say anything workable about constituents (like future people) whose interests are at stake but who cannot literally cast a ballot?

  Please flag clearly where you're taking a side on a genuinely contested interpretive question rather than reporting a settled point, and if you think the two principles as I've described them are not genuine rivals — for example, if one collapses into the other once carefully stated, or if the boundary problem itself is badly framed — please say so directly rather than politely working within a flawed setup.
reasoning: |-
  Okay, the user wants me to compare two principles for determining who should vote in democratic decisions: the all-subjected principle versus the affected-interests principle. They've provided three concrete cases to analyze - a river diversion referendum affecting downstream communities, a city zoning decision impacting future residents, and national tariffs affecting foreign producers. 

  Hmm, this is actually a sophisticated political theory question that reveals several layers. The user seems academically inclined - probably a grad student or scholar given how precisely they frame the boundary problem. Their request to flag contested interpretations suggests they want rigor, not oversimplification. 

  First I should note these principles aren't necessarily rivals; they answer different questions. The all-subjected principle is about legal authority - who's coerced by the state. The affected-interests principle is about moral consideration - whose wellbeing is altered. That distinction will shape all three cases. 

  For the river case: Under all-subjected, only upstream voters get to decide since they're under the jurisdiction, even though downstream communities bear major consequences. That seems unjust but legally coherent. Affected-interests would include downstream voters, but then we hit practical problems - how far downstream? How significant must impact be? 

  The city zoning case is tougher. Future people aren't "subjected" to current laws in legal terms, so all-subjected excludes them entirely. Affected-interests clearly includes them, but voting mechanics become absurd - we can't enfranchise nonexistent people. This exposes a shared flaw: both principles struggle with non-voting stakeholders. 

  The tariff case shows the jurisdictional boundary sharply. All-subjected only cares about citizens within the state, even though foreign producers suffer economic harm. Affected-interests would include those foreigners, but that collapses into global voting - which no state implements. 

  *scribbles mentally* The core tension is between feasibility and moral adequacy. All-subjected gives workable voter rolls but morally arbitrary exclusions. Affected-interests is morally expansive but administratively impossible. Neither resolves the non-voter problem well - for future people, we need trusteeship models; for excluded groups, perhaps legal recourse rather than voting. 

  User's last point is key: both principles fail constituents who can't vote. I should emphasize that rather than pretending either principle "wins" cleanly. The boundary problem might need reframing as a layered question: legal jurisdiction for voting mechanics PLUS moral consideration through other channels. 

  *checks own reasoning* Am I being too critical of affected-interests? Some theorists like Goodin defend it as an ideal to approximate. But practically, its inclusivity leads to infinite regress - should my grocery vote include farmers worldwide? Still, for future people, it's the only principle that even acknowledges the issue. 

  Final note: Must flag where interpretations are contested. E.g., does "subjected" include future legal subjects? Some say yes, most say no. Does "affected" include probabilistic harm? Vital for climate decisions. User will want these caveats explicit.
answer: |-
  Below is a systematic comparison of the **all-subjected principle** (ASP) and **affected-interests principle** (AIP) applied to your three cases. I'll flag contested interpretations clearly (⚖️) and conclude with a shared weakness assessment.  

  **Core Distinction**:  
  ASP is **jurisdiction-centered** (voting rights tied to legal authority), while AIP is **impact-centered** (voting rights tied to consequence-bearing). They are genuine rivals with practical and philosophical trade-offs.  

  ---

  ### **Case 1: Upstream referendum diverting a downstream river**  
  - **ASP**: Only upstream residents vote.  
    *Why?* They are subject to the referendum's legal authority. Downstream communities, while affected, are outside the jurisdiction.  
    **Strengths**: Clear, administrable, avoids extraterritorial enforcement.  
    **Weakness**: Downstream populations bear heavy costs without recourse.  

  - **AIP**: Downstream residents *should* vote.  
    *Why?* Their water access, agriculture, and ecosystems are directly impacted.  
    **Strengths**: Morally intuitive; aligns democracy with consequence-bearing.  
    **Weakness**: Logistically/politically fraught: Who defines "significantly affected"? How are votes weighted across borders?  

  **Verdict**: **AIP handles this better morally**, but ASP wins on feasibility. AIP highlights ASP’s "democratic exclusion" flaw.  

  ---

  ### **Case 2: City council vote on zoning/flood defenses affecting future residents**  
  - **ASP**: Only current residents vote.  
    *Why?* Future people are not yet "subjected" to current laws (⚖️ *Contested: Some argue future legal subjects are implicitly bound, but this stretches "subjected"*).  
    **Weakness**: Ignores intergenerational justice; risks short-termism (e.g., defunding flood defenses).  

  - **AIP**: Future residents *should* vote.  
    *Why?* Their safety/property are profoundly affected.  
    **Strength**: Forces accountability to long-term impacts.  
    **Weakness**: **Operationally impossible** (future people can’t vote). Proxy solutions (e.g., guardians for future interests) are non-democratic.  

  **Verdict**: **ASP fails morally; AIP fails practically**. Both struggle, but AIP’s *conceptual* inclusion of future interests is superior *in theory* despite being unrealizable.  

  ---

  ### **Case 3: National election on tariffs burdening foreign producers/consumers**  
  - **ASP**: Only citizens vote.  
    *Why?* Tariffs are enforced by the state’s legal authority; foreigners aren’t subject to its sovereign power.  
    **Strength**: Reflects territorial sovereignty norms.  
    **Weakness**: Excludes those bearing economic harm (e.g., farmers ruined by tariffs).  

  - **AIP**: Foreign producers/consumers *should* vote.  
    *Why?* Their livelihoods are "significantly affected."  
    **Strength**: Acknowledges globalization’s ethical reality.  
    **Weakness**: **Erodes the basis of nation-states**; implies universal suffrage for all global economic actors (⚖️ *Contested: "Significant" could be limited, but slippery slope concerns persist*).  

  **Verdict**: **ASP handles this better** pragmatically. AIP’s radical inclusivity is normatively appealing but politically destabilizing.  

  ---

  ### **Shared Weakness: Non-Voting Constituents**  
  Both principles fail to address **constituents who cannot literally vote**, though differently:  
  - **ASP**: Explicitly excludes non-jurisdictional groups (foreigners, future people) by design.  
  - **AIP**: *Includes* all affected interests conceptually but lacks mechanisms for inanimate objects (e.g., ecosystems), future people, or groups across borders. **Proxy representation** (e.g., ombudspersons for future generations) is an ad hoc fix outside both frameworks.  

  **Key Tension**:  
  - ASP prioritizes **feasibility** (clear voter rolls) but accepts **moral arbitrariness** (excluded impact-bearers).  
  - AIP prioritizes **moral completeness** but risks **administrative collapse** (infinitely expanding demos).  

  ---

  ### **Critical Reflections**  
  1. **Are they rivals?**  
     Yes. ASP is **positivist** (grounded in existing legal authority), while AIP is **consequentialist** (grounded in harm/benefit outcomes). One doesn’t collapse into the other.  

  2. **Contested Interpretations**:  
     - ⚖️ *ASP’s "subjected"*: Does it include non-citizen residents? Modern interpretations often say *yes* (e.g., resident aliens pay taxes), but this case-by-case.  
     - ⚖️ *AIP’s "significantly affected"*: Thresholds are inherently subjective (e.g., is 1% income loss "significant"?).  

  3. **Is the boundary problem flawed?**  
     Not flawed, but **incomplete**. Real-world democracies blend principles:  
     - *ASP for voting*, plus *AIP-inspired safeguards* (e.g., int’l courts for cross-border harm).  
     - Neither solves **temporal boundaries** (future people) or **non-human interests** (e.g., AI, ecosystems).  

  **Conclusion**: ASP offers a workable baseline for voting, but AIP exposes its ethical blind spots. A coherent theory likely requires supplementing voting with **non-electoral voice** (e.g., lawsuits for foreigners, future-focused institutions) — acknowledging that *voting alone* can’t resolve all boundary problems.
