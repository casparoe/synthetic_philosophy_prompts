answer: |-
  You've hit the nerve on latency – I'll grant that. Yes, waiting for real-world outcomes can be painfully slow or dangerous. But that doesn't magically make process supervision *superior*; it just makes it *convenient*. And convenience here is lethal. When we judge steps, we bias the model toward generating reasoning *humans find legible and reassuring*, not what's actually *effective*. Humans are terrible at evaluating novel strategies – we reward what *looks* like sound reasoning, creating a model that's an expert at performing rationality theater rather than achieving robust results. Your "grading corpses" point? It's why we use *proxies* and *simulations* rigorously during training to build competence *before* deployment. Waiting for the outcome to judge the *process* post-hoc is still fundamentally different: it forces alignment with *actual results*, not with human interpretive comfort. Your alternative surrenders to making human raters the hidden, fallible bottleneck for every decision. Is that truly scalable, or just building a very expensive puppet?
