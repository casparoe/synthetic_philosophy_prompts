  ## MEMORANDUM: Concerning the Reform and Proper Practice of Astronomical Prognostication  
  **From:** J. Kepler, Imperial Mathematician  
  **To:** Practitioners of the Celestial Art  
  **Date:** This 10th Day of October, 1609  
  **Subject:** Purification of Method & Establishment of Physical Principles

  Gentlemen,

  Recent observations and profound contemplation of the *Harmonies of the World* compel me to address certain... *customs*... prevalent in our shared profession. While the heavens manifestly exert influence upon the sublunary sphere (a fact evident in the tides and the undeniable sympathy between lunar phases and humours), much of our current practice is encumbered by baseless tradition and arbitrary contrivance. It is time our art aligned with the immutable laws governing Creation.

  **I. Concerning the Zodiacal Signs & Constellations:**
  The division of the ecliptic into twelve equal segments named for proximate stellar configurations is a useful *human convention* for measurement, akin to marking degrees upon a quadrant. **However,** to attribute distinct *qualities* or *potencies* to the *Ram*, the *Scales*, or the *Water-Bearer* is pure mythology, devoid of physical foundation. The stars themselves are distant suns, their light attenuated beyond sensible effect at such remove. The *signs* are mere labels on the celestial clockface; they possess no inherent virtue. **Henceforth, prognostication based solely on planetary position *within* a sign is to be discontinued as unscientific.**

  **II. Concerning the Houses:**
  The various systems for dividing the local sky (Campanus, Regiomontanus, Placidus, et al.) are mathematical fictions, unsupported by any observable celestial mechanism. To assign domains of "Life," "Wealth," or "Enemies" based on the arbitrary intersection of great circles at a given moment is geometrically indefensible and physically meaningless. **The entire apparatus of the *houses* is hereby declared obsolete and unfit for use in serious practice.** Casting a figure requires only the horizon and meridian for orientation; the rest is Egyptian fiction.

  **III. Concerning the Aspects:**
  *Here* lies the true heart of celestial influence! The angular relationships between the planets – the *aspects* – possess an undeniable geometric reality and harmonic resonance that must govern their emanations. **The following aspects are recognized as possessing fundamental efficacy, grounded in the Divine Geometries of the Cosmos:**
  *   **Conjunction (0°):** Unification of forces.
  *   **Opposition (180°):** Maximum tension and polarity.
  *   **Trine (120°):** Perfect harmony, flowing influence. *(Note: This angle corresponds to the equilateral triangle, the most stable figure.)*
  *   **Square (90°):** Dynamic friction and challenge. *(Note: The right angle, basis of solidity, implies stress.)*
  *   **Sextile (60°):** Cooperative resonance. *(Note: The hexagon, found in crystalline structures and bees' combs, signifies efficient interaction.)*

  **These angular tolerances (± 5° for major aspects, ± 2° for minor) are to be observed as rigorously as one observes the divisions on an astronomer's quadrant.** Aspects derive their power not from tradition, but from the *mathematical archetypes* woven into the fabric of the universe itself. Their influence must be mediated by some physical emanation – perhaps akin to light or magnetic virtue – modulated by the harmony or discord of their angular separation.

  **IV. Practical Considerations:**
  *   **The Moon:** Given its proximity, the Moon exerts the most potent and immediate influence upon the Earth's atmosphere and its watery bodies. **Therefore, its position and aspects demand the most scrupulous calculation and interpretation.** An error of minutes in lunar position is far more consequential than an error in Saturn's.
  *   **Planetary Natures:** The inherent qualities ascribed to planets (Mars: heat/dryness; Venus: moisture, etc.) retain plausibility based on observed effects (e.g., solar heat, lunar moisture) and must be factored into interpretations, *but always modulated by the aspectual geometry*.
  *   **Retrogradation:** The apparent reversal of motion is a perspectival illusion arising from the relative speeds of planetary orbits viewed from Earth. While it signifies a time of internalization or review, it possesses no *additional* physical mechanism beyond the altered angular velocity relative to the fixed stars. Interpret accordingly, without superstitious dread.

  **V. Implementation & Livelihood:**
  Adopting these principles will streamline practice and ground it upon irrefutable mathematical and physical grounds. Castings will focus solely on planetary positions relative to the local horizon/meridian and their mutual aspects within the defined tolerances. Traditional rulerships, dignities, and exaltations tied to signs are abolished.

  While this reform discards much accumulated chaff, it preserves the vital kernel of truth: the celestial harmony speaks through angles. I trust the increased rigor will enhance the reputation and reliability of our prognostications.

  **Administrative Note:** Practitioners are reminded that while philosophical purity is paramount, clients still expect comprehensible interpretations grounded in familiar concerns (health, fortune, relations). Discretion in presentation is advised to maintain... *customary remuneration*. A man must, after all, eat while elucidating the cosmos.

  In pursuit of a truly Natural Philosophy of the Heavens,

  *Johannes Kepler*
  *(Imperial Mathematician, Investigator of Harmonies, & Practitioner of the Reformed Celestial Art)*
