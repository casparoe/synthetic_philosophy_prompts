answer: |-
  ### Dutch Book Game Plan (Printable Version)

  **Objective:** Participants experience guaranteed loss by violating probability axioms through betting. Use chips (each = $1) to make losses tangible. No real money.

  ---

  #### **Setup & Rules**
  1. **Materials**: 
     - Coin (H/T), deck of cards (♥/♦ for red), chips, whiteboard.
     - Each participant starts with 10 chips. Bookie (you, then volunteers) has unlimited chips.

  2. **Betting Simplified**:
     - Participants set "prices" for events (e.g., "I'll pay $0.40 for a $1 payout if Heads" = probability 0.4).
     - Bookie proposes bets; participants must accept (to simulate commitment to beliefs).

  3. **Payoffs**:
     - If event occurs: bet holder gets $1.
     - If not: bet holder gets $0.
     - Net = (payout) - (price paid). Track chip changes live.

  ---

  #### **Sequencing & Violations**  
  **Round 1: Coin Flip (Violate Probability Sum = 1)**  
  - **Events**:  
    - A: Heads (H)  
    - B: Tails (T)  
    - C: H or T (certain event)  
  - **Ask**: "What’s your price for each? (e.g., A=0.4, B=0.4, C=0.9)"  
  - **Dutch Book If**:  
    - If \(P(A) + P(B) < 1\) (e.g., 0.4 + 0.4 = 0.8):  
      - Bookie *buys* $1 bets on A and B from participant.  
      - Pays participant \(P(A) + P(B) = 0.8\) chips.  
      - Flip coin:  
        - H: Participant pays bookie $1 → Net loss: \(0.8 - 1 = -0.2\)  
        - T: Same → **Loss either way**.  
    - If \(P(C) \neq 1\) (e.g., 0.9):  
      - Bookie *buys* $1 bet on C from participant.  
      - Pays 0.9 chips. Since C always occurs, participant pays $1 → Loss: \(0.9 - 1 = -0.1\).  

  **Round 2: Card Draw (Violate Additivity)**  
  - **Events**:  
    - A: Heart (♥)  
    - B: Diamond (♦)  
    - C: Red card (♥ or ♦)  
  - **Ask**: "Prices for A, B, C? (e.g., A=0.2, B=0.2, C=0.3)"  
  - **Dutch Book If** \(P(C) < P(A) + P(B)\) (e.g., 0.3 < 0.4):  
    - Bookie *sells* $1 bets on A and B to participant (participant pays \(0.2 + 0.2 = 0.4\) to bookie).  
    - Bookie *buys* $1 bet on C from participant (pays participant 0.3).  
    - Net upfront: Participant pays \(0.4 - 0.3 = 0.1\) chips.  
    - Draw card:  
      - ♥: Bookie pays $1 for A → Participant nets $0 from bets.  
      - ♦: Same.  
      - ♠/♣: No payouts → **Net loss: 0.1 chips always**.  

  ---

  #### **Debrief (5 Min)**  
  1. **Map to Axioms**:  
     - Round 1: Violated \(P(\text{mutually exclusive}) = 1\) and \(P(\text{certain}) = 1\).  
     - Round 2: Violated \(P(A \text{ or } B) = P(A) + P(B)\) for disjoint events.  
  2. **Core Insight**:  
     - "Your loss wasn’t bad luck—it was guaranteed because your prices broke probability rules. Rational beliefs must obey these axioms."  

  ---

  #### **Predictable Problems**  
  - **Refusal to bet**: Encourage sincerity: "This isn’t about winning—it’s about testing your beliefs!"  
  - **Clever play (e.g., coherent odds)**: Use a skeptical volunteer ("Imagine you suspect this coin is biased!").  
  - **Group catches on**: Skip to Round 2; discuss how real-world uncertainty (e.g., medical tests) leads to similar incoherence.  
  - **Confusion on payouts**: Demo one bet slowly (e.g., "You pay $0.4 now. If Heads, I give you $1 back").  

  ---

  #### **Honest Gap in the Game**  
  The leap from "lost chips" to "irrational" assumes:  
  1. **Exact credences**: Participants must state true beliefs (no hedging).  
  2. **Infinite stakes**: Real Dutch books exploit *any* violation by scaling bets—here, losses are small/fixed.  
  3. **Bookie omniscience**: In reality, bookies need all your beliefs upfront; here, we only test subsets.  
  **Say this**: "This is a simplified trap. The theorem says: if your beliefs *exactly* violate probability rules, a perfect bookie *could* ruin you."  

