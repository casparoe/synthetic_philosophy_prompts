  We are designing a Chinese Room activity for a group of 14-18 participants. The goal is to have the group collectively process input (questions) to produce output (answers) that appear intelligent, without any individual understanding the meaning. We'll have two rounds: one with the rules on cards (simulating a system with an external rulebook) and one where participants internalize their rules (simulating the rules being in memory).

  ## Core Mechanics
  - **Premise**: The room is a "Chinese Answering Machine". The visitor (a facilitator) will ask questions in Chinese (but we'll use English for simplicity, with a twist to make it feel like symbols). The room must output answers that seem to understand the questions.
  - **Symbol Manipulation**: We use a simple coding scheme to turn English into symbols. For example, we assign numbers to words. This way, the processing is on numbers (symbols) without needing to understand the words.
  - **Distributed Lookup**: Each participant has a card with a fragment of a rulebook. The rulebook is broken into many small steps (like a program) so that no one has the whole picture.

  ### How the System Works
  We design a simple "program" that can answer questions about a fixed topic. The topic must be very constrained to make the lookup feasible. Example: answering questions about a small, fixed story or a set of facts (e.g., a story about a cat and a dog). We predefine a set of possible questions and answers, but the participants don't know this. The system is built so that:
  1. The input (question) is broken into tokens (words) and converted to numbers.
  2. The numbers are processed through a series of steps (each step performed by a participant) that transform the numbers.
  3. The final step converts the numbers back to words to form the answer.

  ### Example Story and Rules
  Let's create a micro-world: a story about a cat named Whiskers and a dog named Spot. The story: "Whiskers is a cat. Spot is a dog. Whiskers is white. Spot is black. Whiskers likes milk. Spot likes bones."

  Possible questions:
  - What color is Whiskers?
  - What does Spot like?
  - Is Whiskers a cat?

  We design a rule set that maps questions to answers. We break the rule set into small operations.

  ### Symbolic Representation
  - Create a dictionary of words that appear in the story and questions. Assign each word a number. Example:
    - Whiskers: 1
    - Spot: 2
    - is: 3
    - a: 4
    - cat: 5
    - dog: 6
    - white: 7
    - black: 8
    - likes: 9
    - milk: 10
    - bones: 11
    - color: 12
    - what: 13
    - does: 14
    - ?: 15

  We also need numbers for the answers. But note: the answers will be built from the same word set.

  ### Processing Steps
  We break the processing into steps. Each step is a simple operation. We have a chain of participants:

  1. **Tokenizer**: Breaks the question into words and converts each word to its number. Outputs a list of numbers.
  2. **Question Type Identifier**: Based on the pattern of numbers, assigns a question type (e.g., color, likes). We can have a lookup that maps the first word (or a pattern) to a type. For example, if the first number is 13 (what), then check the next word. If the next is 12 (color), then question type is color. We assign a code for each question type: color=20, likes=21, is_a=22.
  3. **Subject Identifier**: Extracts the subject of the question (the word after "is" or the third word). Outputs the subject number (e.g., 1 for Whiskers).
  4. **Answer Lookup**: Uses the question type and subject to look up the answer. We have a table that maps (question type, subject) to an answer template. For example:
     - (color, 1) -> [1, 3, 7]  (Whiskers is white)
     - (likes, 2) -> [2, 9, 11] (Spot likes bones)
     - (is_a, 1) -> [1, 3, 4, 5] (Whiskers is a cat)
  5. **Detokenizer**: Converts the list of numbers back to words.

  But note: we must break these steps into even smaller pieces so that each participant does a very minimal task and no one sees the whole process.

  ### Distributing the Steps
  We can break the process into more than 5 steps by having each step be as atomic as possible. For example:

  - Step 1: Participant A receives the question slip. They look up the first word (only) in their table and output a number. They pass the slip and the first number to the next.
  - Step 2: Participant B receives the slip and the first number. They look up the second word and output a number. They pass the slip and both numbers to the next.
  - ... until all words are tokenized.

  But that would require as many participants as words, which might be too many. Alternatively, we can have one tokenizer that tokenizes the entire question and then passes the list of numbers to the next.

  Given we have 14-18 participants, we can break the system into 5-7 steps and have multiple participants per step (each handling a different part of the lookup). However, to make it so that no one has a complete view, we assign each participant a very narrow rule.

