  We'll assume we have 10 participants for the core, and the others can be observers or we can duplicate the roles for redundancy? Or we can have a larger story with more subjects and more question types.

  Let's add a third subject: a bird named Tweety, yellow, likes seeds. Then we add:

  - Tweety: 3
  - yellow: 16
  - seeds: 17

  Then we have three Answer Lookup participants. That brings us to 11.

  We can also have a fourth question type: "What animal is [subject]?" But then we need to add that to the story: Whiskers is a cat, etc. We would need to extend the dictionary and the answer lookups.

  But that might be too much for a first run. We'll start with two subjects and two question types.

  For extra participants, we can have them as the visitor (one person) and maybe a timekeeper or a scribe. Or we can have multiple chains? But that would require more design.

  ### The Twist: Round 2
  In round 2, we have the same setup, but participants put away their cards and try to remember their rule. They are not allowed to write down anything. We run the same questions. The system should work the same. The question is: does the room understand now that the rules are internalized?

  ### What Might Go Wrong
  - Bottleneck: one participant is slow, holds up the whole chain.
  - Mistakes in passing slips: wrong next person.
  - Tokenizers might get the wrong word if the question slip is not clear.
  - Pattern Matcher might misclassify if the numbers are wrong.
  - The dictionary might be ambiguous (e.g., "like" vs "likes") -> we design the questions to use exact words from the dictionary.
  - Participants might peek at the whole system by talking to each other -> we must enforce silence and no communication beyond passing slips.

  ### Fixes
  - Rehearse with one example question before starting.
  - Have a clear layout: participants sit in a sequence and know who to pass to.
  - The facilitator (you) will be the visitor and also monitor the passing.
  - Use a fixed font and clear writing on slips.

  ### Timeline

  Total time: 80 minutes.

  - 5 min: Introduction and assigning roles.
  - 10 min: Explain the rules and do a dry run with one simple question (e.g., "What color is Whiskers?") with cards.
  - 20 min: Round 1: run 3-4 questions with cards.
  - 10 min: Round 2: internalize the rules (participants study their card for 2 minutes, then cards are collected). Then run the same 3-4 questions from memory.
  - 25 min: Debrief and discussion.
  - 10 min: Buffer.

  ### Debrief Script
  We want to connect moments in the activity to the philosophical positions.

  Example: 
  - Systems reply: the whole room together understands, even if no part does. We can point to the system outputting correct answers.
  - Robot reply: the room lacks intentionality because it doesn't connect to the world. We didn't have any sensors or actuators.
  - Brain-simulator reply: if we were simulating a brain at the neural level, would it understand? Our simulation was high-level.
  - Other-minds: how do we know the room doesn't understand? We only see the output.

  We can use an actual question and ask participants about their experience.

  ### What the Activity Cannot Reproduce
  The activity does not address the issue of syntax vs semantics: the participants are manipulating symbols that are grounded in the facilitator's dictionary and story. In a real Chinese Room, the symbols are ungrounded. In our activity, the tokenizer and detokenizer have a dictionary that grounds the symbols in English, so there is a level of understanding at the edges. But the core of the room (the processors in the middle) are manipulating numbers without any grounding. This might be a point to discuss.

  ## Deliverables

  ### 1. The Full Game
  **Premise**: We are simulating a Chinese Answering Machine. The machine can answer questions about a simple story (about pets) in English. The room is set up as a system of rules that each of you will execute. Your goal is to collectively answer questions without any one of you (except possibly the visitor) understanding the story or the questions.

  **Roles**:
  - Visitor (facilitator): asks questions by writing them on slips and collects answers.
  - Tokenizers (4): each handles one word of the question.
  - Pattern Matcher (1): determines the type of question.
  - Subject Extractor (1): extracts the subject of the question.
  - Router (1): directs the question to the appropriate answerer.
  - Answer Lookup (2): for subject 1 and subject 2, they look up the answer based on question type.
  - Detokenizer (1): converts the answer numbers to words.

  **Materials**:
  - A story: "Whiskers is white. Spot is black. Whiskers likes milk. Spot likes bones." (only these facts).
  - Dictionary (word to number mapping) for tokenizers and detokenizer. Example:
     - Whiskers: 1
     - Spot: 2
     - is: 3
     - white: 4
     - black: 5
     - likes: 6
     - milk: 7
     - bones: 8
     - What: 9
     - color: 10
     - does: 11
     - like: 12   [note: we use "like" in the question, but "likes" in the story. We must use the same in the question? Let's change the story to "Whiskers like milk" to match. Or change the question to "likes". We'll change the dictionary to have "likes":6 and use "likes" in the question.]

  Revised dictionary to avoid confusion:
     - What: 1
     - color: 2
     - does: 3
     - likes: 4   [used in "What does [subject] likes?" -> but grammar is off. We'll use "like" as a verb in the question and map it to the same number as "likes"? Or use "likes" in the question.]

  Better to use the same form. We'll adjust the questions to use the words exactly as in the dictionary. We'll have:

  Dictionary:
  1: What
  2: color
  3: does
  4: likes
  5: Whiskers
  6: Spot
  7: is
  8: white
  9: black
  10: milk
  11: bones
  12: ?   (question mark)

  Questions:
  - "What color Whiskers ?" -> [1,2,5,12]
  - "What does Spot likes ?" -> [1,3,6,4,12] -> 5 words! We said 4 words. We must use 4 words: "What does Spot like?" and map "like" to 4 (the same as "likes"?).

  To keep it 4 words, we can do:
  - "What color Whiskers ?" -> 4 words: [What, color, Whiskers, ?]
  - "What does Spot like ?" -> 4 words: [What, does, Spot, like] -> then we map "like" to 4.

  But in the story, we have "likes". We can have the dictionary map both "like" and "likes" to 4. Or change the story to "like".

  To simplify, we'll change the story to use the base form: "Whiskers like milk." -> but that's ungrammatical. Alternatively, we accept the grammar error in the system.

  Given the symbolic nature, we'll map "like" (in the question) to the same number as "likes" (in the story). The detokenizer will output "likes" for 4.

  So the dictionary for detokenizer:
  1: What
  2: color
  3: does
  4: likes  [and also for "like"]
  5: Whiskers
  6: Spot
  7: is
  8: white
  9: black
  10: milk
  11: bones
  12: ?

  Then the question "What does Spot like?" becomes [1,3,6,4] (and then we add ? but we can ignore or include).

  But we said 4 tokenizers, so we'll have 4 words and ignore the question mark or include it as a word. Let's include it.

  Revised questions:
  - "What color Whiskers ?"
  - "What does Spot like ?"

  And the tokenization:
  - "What color Whiskers ?" -> [1,2,5,12]
  - "What does Spot like ?" -> [1,3,6,4]   [because "like" is mapped to 4]

  But the last word is "like", which is mapped to 4, which is "likes". The detokenizer will output "likes", so the answer will be "Spot likes bones", which is fine.

  **Workflow**:
  1. Visitor writes a question on a slip and gives to Tokenizer1.
  2. Tokenizer1: 
     - Sees the first word (e.g., "What").
     - Looks up its number (1).
     - Writes the number on a new state slip.
     - Writes a new question slip with the remaining words (e.g., "color Whiskers ?").
     - Passes the state slip (with [1]) and the new question slip to Tokenizer2.
  3. Tokenizer2:
     - Takes the next word ("color") -> 2.
     - Appends 2 to the state slip (now [1,2]).
     - Writes a new question slip with "Whiskers ?".
     - Passes to Tokenizer3.
  4. Tokenizer3: "Whiskers" -> 5, state slip [1,2,5], new question slip "?".
     - Passes to Tokenizer4.
  5. Tokenizer4: "?" -> 12, state slip [1,2,5,12], and no more question.
     - Passes the state slip to the Pattern Matcher.
  6. Pattern Matcher:
     - Receives [1,2,5,12] -> first two are [1,2] which is "What color", so question_type=20.
     - Writes a new slip: [20, [1,2,5,12]] (question_type and the whole list) and passes to Subject Extractor.
  7. Subject Extractor:
     - Question type 20 -> subject is at index 2 (the third number) -> 5.
     - Outputs [20,5] (question_type and subject number).
     - Passes to Router.
  8. Router:
     - Subject is 5 (Whiskers) -> passes to Answer Lookup for subject 5. But we have only subject 5 and 6! We mapped Whiskers to 5.
     - We have Answer Lookup for 5 and for 6.
     - Passes to Answer Lookup5.
  9. Answer Lookup5:
     - For question type 20 (color), the answer is [5,7,8] (Whiskers is white) -> but wait, we have:
          - Whiskers:5, is:7, white:8 -> [5,7,8]
     - Writes [5,7,8] and passes to Detokenizer.
  10. Detokenizer:
      - Converts [5,7,8] to ["Whiskers", "is", "white"] -> writes "Whiskers is white".

  But the question was "What color Whiskers ?", and the answer is "Whiskers is white", which is appropriate.

  Similarly for "What does Spot like ?" -> [1,3,6,4]:
  - Tokenization: [1,3,6,4]
  - Pattern: [1,3] -> "What does" -> question_type=21.
  - Subject: index 2 -> 6 (Spot)
  - Answer Lookup6 for type 21: [6,4,11] -> "Spot likes bones"

  ### 2. Timeline Table

  | Minutes | Phase                  | What Participants Do                                                                 | What the Facilitator Does                                                                      | Conceptual Work                                                                 |
  |---------|------------------------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | 0-5     | Introduction           | Listen, get assigned roles                                                          | Present the premise, assign roles, show the story and dictionary                              | Setting up the Chinese Room scenario                                            |
  | 5-15    | Dry Run                | Perform one full question with cards, ask questions about the process                | Guide them through the steps, help with the first question, ensure everyone understands their rule | Understanding the distributed computation without understanding                 |
  | 15-35   | Round 1 (with cards)   | Process 3-4 questions using their cards and slips                                    | Play the visitor, ask questions, monitor the process, collect answers                         | Demonstrating that the system produces intelligent answers without any individual understanding |
  | 35-45   | Internalization        | Study their card for 2 minutes, then cards are collected. Try to remember their rule. | Collect cards, answer questions about the memorization phase                                  | Testing if internalizing the rules changes the understanding of the system      |
  | 45-55   | Round 2 (from memory)  | Process the same 3-4 questions from memory                                          | Play the visitor, ask the same questions, collect answers                                     | Checking if the system's understanding changes when rules are internalized      |
  | 55-80   | Debrief                | Discuss their experience, answer facilitator's questions                             | Lead the debrief using the script, prompt with specific questions, use the actual input/output slips | Connecting the activity to the philosophical debate                             |

  ### 3. Debrief Script
  Facilitator: "Let's look at what happened. We had a system that could answer questions about the pets. Let's take the question 'What color is Whiskers?' and the answer 'Whiskers is white'. Who in the room understood that the question was about color?"

  [Participants: probably no one, because the tokenizers only saw one word at a time, and the others saw numbers.]

  Facilitator: "Tokenizers, you saw the word 'color' — what did you do with it?"
  Tokenizer2: "I looked it up and output the number 2."

  Facilitator: "Did you know what 'color' means? Or that it was part of a question about color?" 
  [Probably not.]

  Facilitator: "Pattern Matcher, you saw [1,2] — what does that mean to you?"
  Pattern Matcher: "I know that [1,2] means question type 20."

  Facilitator: "Did you know that 20 stands for 'color question'?"
  [No, it's just a number.]

  Facilitator: "And the Answer Lookup for Whiskers, when you got [20,5], what did you do?"
  Answer Lookup5: "I output [5,7,8] because that's the rule for question type 20 and subject 5."

  Facilitator: "Did you know that [5,7,8] means 'Whiskers is white'?"
  [No.]

  Facilitator: "So the system as a whole produced a correct answer, but no one understood. This is the Chinese Room argument: the room manipulates symbols without understanding. Now, in the second round, when you had the rules in your head, did anyone feel like they understood the meaning then?"

  [Participants might say no, they were just following the rule from memory.]

  Facilitator: "This relates to the systems reply: does the whole system understand? We saw the system did the same thing. Or the robot reply: the room lacks sensors and actuators to connect the symbols to the world. And the brain-simulator reply: if we were simulating a brain, would that be different? But our simulation was high-level."

  ### 4. Failure Modes and Fixes
  - **Bottleneck**: One slow participant holds up the chain. Fix: have a time limit per step (e.g., 30 seconds) and a facilitator prompt.
  - **Participants peeking**: They talk or look at other cards. Fix: enforce silence and no peeking; have a rule that you can only communicate via the slips.
  - **Visitor's script too easy**: If the questions are too similar, participants might guess the answers. Fix: have a variety of questions, including one that is not in the script to show the system's brittleness (but only in the debrief, not during the activity).
  - **Mistakes in passing**: Wrong next person. Fix: have a clear diagram of the chain and practice in dry run.
  - **Dictionary ambiguity**: Fix: use a predefined dictionary and ensure questions use only dictionary words.

  ### 5. What the Activity Cannot Reproduce
  The activity cannot reproduce the full ungroundedness of the symbols. In the original Chinese Room, the symbols are not grounded in any world; they are just given. In our activity, the tokenizer and detokenizer have a dictionary that grounds the symbols in English words, which are meaningful to them and to the visitor. This grounding means that at the edges, there is understanding (by the tokenizer and detokenizer of the English words), but the core of the system is ungrounded. This might blur the line. The facilitator should point out that in a real Chinese Room, the person inside has no idea what the symbols mean, whereas our tokenizer and detokenizer do know English. This limitation should be discussed.

