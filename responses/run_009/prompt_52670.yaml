prompt: |-
  I am a novelist who has been drafted into something slightly out of my depth: a small residential retreat for working writers, at which each year someone must lead a two-hour evening session on a single idea from philosophy, on the understanding that no one present has read any philosophy since university. This year the idea is the extended mind thesis, and this year the someone is me. Plan the session for me. Do not explain the thesis to me here; I half understand it and can fill in the rest. What I need is the plan.

  Some things you should know about the room. Twelve novelists and essayists, verbal, combative, allergic to jargon, and — this is the relevant fact — devoted to their notebooks. Every one of us keeps one: character notebooks, commonplace books, the draft journal one revisits for ten years while a novel refuses to finish. Several of us have said, only half joking, that we think in them rather than with them, and at least one member of the group lost a notebook in a house move some years ago and speaks of it the way other people speak of a death. That attachment should be both the hook and the trap, and I suspect the whole session turns on how it is used.

  So, the plan I need: the order in which the pieces must be introduced, and what depends on what — I can see that some notion of a belief as a standing state rather than an inner episode has to be in place before any comparison with a notebook can do work, and I want the sequence to make that feel necessary rather than like throat-clearing. Then the carrying example: I am inclined to offer my own stalled-novel notebook as the case, but you should tell me whether it has the features the example needs or whether it invites trouble, and if it is the wrong notebook, what the right one must have and lack. Then the misconceptions, in the order this particular audience will form them: I can predict the sentimental reading (the notebook as part of my soul, which collapses into metaphor exactly where we need precision), and the dismissive one (we all use tools, so the thesis proves everything and therefore nothing), and I can predict the novelist who says that when she consults her notebook she experiences herself retrieving information, not believing something — I do not know where in the sequence that objection should be met or whether it should be met at all. Tell me where each misconception is best absorbed, and which one I should let the room fight about rather than resolve. I also want one question I can put to the group at the end that would tell me whether they have understood the difference between the notebook merely mattering to their minds and being a constituent of them, rather than having merely been moved. And I want an honest account of what I should openly refuse to cover at this level — the session is two hours, there is a fire in the grate, and I would rather say plainly that some debates are being left at the door than pretend they were never there.
reasoning: |-
  Okay, the user is a novelist tasked with leading a session on the extended mind thesis for fellow writers deeply attached to their notebooks. They need a structured plan that leverages their emotional connection to notebooks while avoiding philosophical jargon. 

  First, I notice their group's unique trait: an almost visceral bond with their notebooks. That's the golden hook. The plan must transform their personal notebook experiences from sentimental objects to cognitive extensions. 

  The user already grasps key concepts but worries about sequencing. They're right—belief-as-standing-state must come before notebook comparisons. I'll build that foundation using everyday examples (spouses' preferences, fridge contents) to sneak in philosophy without triggering jargon allergies. 

  For the central notebook example, their stalled-novel notebook is perfect—it's chronically consulted (standing disposition) and irreplaceable (functional integration). But I'll warn against using lost-notebook-as-death anecdotes early; that risks muddying cognitive roles with emotion. Save it for Q&A as a red herring example.

  Misconceptions need strategic handling: 
  - The "it's just a tool" objection should be smothered immediately with Otto's notebook vs. biological memory comparison. 
  - The retrieval-vs-belief experience? Park that for group debate—it reveals how introspection fails to capture standing states. 
  - Soul/metaphor talk gets gently corrected by emphasizing functional equivalence.

  The killer question at the end: "If your notebook burned, would you lose beliefs or just records?" That exposes constituent-vs-contingent relationships. 

  And boundaries are crucial. I'll explicitly exclude consciousness debates and group minds—those are fireplace-wine topics for another night. Two hours is tight; we must protect the core argument.

  The emotional rhythm matters too: start with their notebook love, then destabilize it ("what if it's *part* of you?"), then rebuild understanding. By the end, they should glance at their notebooks with new unease and respect.
answer: |-
  Here’s a battle-tested session plan leveraging your group’s notebook obsession as the engine. Sequence is critical—we build stepping stones, not throat-clearing.

  **Session Structure (120 mins total):**

  ---

  ### **I. GROUNDWORK: Beliefs as Standing States (25 mins)**  
  *(Key: Make this feel urgent, not academic)*  
  - **Hook (5 min):** *"When you say ‘I believe democracy is fragile’—is that a little mental *event* (like recalling breakfast), or a *state* you’re in (like being thirsty)?"* Use hands-on examples:  
    - *"You believe your spouse loves you. Is that an inner whisper, or the air you breathe?"*  
    - *"You ‘know’ your fridge has milk—until you open it and see none. Was the belief *in* you, or *between* you and the fridge?"*  
  - **Core Point (15 min):** Beliefs as **standing dispositions to act/think** (e.g., disposition to say "yes" if asked about milk). Contrast with "occurrent" beliefs (actively thinking "milk!").  
  - **Writer Angle (5 min):** *"Your character believes her father betrayed her. Is that a flashback scene, or the lens coloring every choice?"*  

  ---

  ### **II. THE PIVOT: Your Notebook as Case Study (30 mins)**  
  *(Your stalled-novel notebook is* **perfect**—*if it has: chronic consultation, stability, & integration)*  
  - **Set-Up (5 min):** *"Take my novel notebook. It’s where I store fragmented scenes, thematic threads, a list of ‘unanswered questions.’ I *don’t* memorize it. I *do* consult it reflexively when stuck."*  
  - **Crucial Features (10 min):** Frame it as:  
    - **Reliable & Permanent:** Physically stable, always accessible (unlike a fleeting thought).  
    - **Automatically Trusted:** No "fact-checking" needed (like biological memory).  
    - **Integrated:** Directly governs drafting choices (e.g., *"I check ‘unanswered questions’ before writing a new chapter"*).  
  - **The Thought Experiment (15 min):** *"If my *brain* held those notes, we’d call it belief. If the *notebook* plays the *same functional role*—why isn’t it part of my mind?"*  

  ---

  ### **III. TRAPS & OBJECTIONS: Tactical Sequencing (45 mins)**  
  *(Order matters—disarm misconceptions as they arise naturally)*  

  1. **"It's just a tool!" (Dismissive)**  
     - **When:** Immediately after introducing the notebook example.  
     - **Response (10 min):** *"True—but your *biological memory* is also a tool. The thesis says: if the notebook functions *identically* to biological memory (reliable, automatic, integrated), the ‘tool’ distinction collapses. Otto’s notebook *is* his memory."*  
     - **Writer Angle:** *"Is your pen a ‘tool’ for writing, or is writing *impossible* without it? Where does ‘you’ end?"*  

  2. **"But I *experience* retrieving, not believing!" (Introspection Objection)**  
     - **When:** Let this emerge in group discussion (it will).  
     - **Response (15 min):** *"Do you ‘experience’ your *standing* belief in gravity? Or only when you stumble? The notebook holds *dispositions* (like knowing your PIN). You don’t ‘feel’ them until triggered."*  
     - **ACTIVITY (10 min):** *"Pair up: Argue whether consulting your notebook feels like ‘accessing your mind’ or ‘accessing data.’"* **Let this debate run.** The tension exposes the standing/occurrent divide.  

  3. **"It's part of my soul!" (Sentimental)**  
     - **When:** Likely post-break or during Q&A.  
     - **Response (5 min):** *"This risks obscuring the *functional* claim. We’re not talking poetry. If the notebook ceased functioning *without replacement* (e.g., ink vanished), would your *cognitive capacity* break? If yes, it’s constitutive."*  
     - **Redirect:** *"Grief over a lost notebook *might* signal cognitive amputation—or profound sentimental loss. How would we test the difference?"*  

  ---

  ### **IV. THE KILLER QUESTION (10 mins)**  
  *(Post-discussion, silence encouraged)*  
  **"If your notebook burned tonight, would you lose:**  
  **(a) A *record* of your thoughts (like losing a photo), or  
  (b) Part of your *ability to think* about your novel (like losing a lobe of your brain)?"**  
  *Listen for functional language ("I couldn’t write Chapter 12"), not metaphor ("a piece of my soul died").*  

  ---

  ### **V. HARD BOUNDARIES: What We’re Ignoring (10 mins)**  
  *(State this upfront & reiterate at end)*  
  - **"We’re NOT covering:"**  
    - Consciousness ("Is the notebook *conscious*?").  
    - Group minds ("Is the retreat *one big mind*?").  
    - Metaphysics of self ("Does this make me a cyborg?").  
  - **Reason:** *"These are fire-wine debates. Tonight: one narrow, testable claim about cognitive scaffolding."*  

  ---

  ### **Why This Works for Your Group:**  
  - **Notebooks as Trojan Horses:** Uses their emotional attachment to smuggle in functional analysis.  
  - **Objections as Fuel:** Letting the "retrieval vs. belief" debate run *after* groundwork makes the standing state concept concrete.  
  - **Your Stalled-Novel Notebook:** Ideal—it’s **criterial**: chronically accessed (standing), trusted (automatic), indispensable (integrated). Avoid notebooks used only for storage/archives.  
  - **Jargon-Free Zones:** "Standing state" → "background condition." "Functionally equivalent" → "does the same job."  

  **Final Tip:** Start by having them **sketch their own notebooks** (physical traits, usage). Grounds the abstract in their sacred objects. The rest unfolds from there.
