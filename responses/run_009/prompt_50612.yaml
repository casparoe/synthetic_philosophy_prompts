prompt: |-
  I'm a high school junior taking a typography and graphic design elective, and for my term paper I've gotten interested in a question my teacher keeps deflecting: what exactly makes every 'a' an 'a'? I ran into the "Letter Spirit" project while researching, and its core idea stuck with me — that the parts of a letterform seem to play abstract roles (a vertical stroke, a bowl, a crossbar) and what makes an 'a' an 'a' might be the way those roles are arranged rather than any actual mark on the page. That would explain why the single-story 'a' in my handwriting and the double-story 'a' in a serif font, which share almost no strokes, are both instantly the same letter. But before I read more specific theories, I want the full specification first: what would ANY theory of letterform categorization have to get right to count as adequate?

  So please write me the requirements list. I have some candidate requirements of my own, but I don't trust them, so tell me which are genuine and which are prejudices of one camp. Cases a theory must handle, at minimum: the chalkboard 'a' scrawled so badly it barely resembles any font's 'a' yet still reads as one; the fact that the same shape can be one letter in one alphabet and a different letter in another, so that what category a shape belongs to depends on which script it's sitting in; decorative or blackletter forms where the 'a' is buried in ornament; and a strange asymmetry I noticed — you can stretch, slant, or shrink an 'a' and it stays an 'a', but mirror it and it stops being one, even though mirroring preserves every relationship between the parts. Distinctions a theory must respect: between being an 'a' and being an 'a' in a certain style (since I can tell two totally different letters come from the same font — style seems to slice across categories rather than within them), and between being a member of a category and being a marginal or degraded member of it. It should also stay consistent with what's known about reading — for instance, that certain letter pairs confuse readers in ways that don't seem to track visual similarity alone. Flag any pair of requirements you suspect can't be jointly satisfied; I have a suspicion that handling alphabet-dependent categories and keeping recognition based on the shape itself is one such pair, but I'd like to know if the tension is real. Finally, tell me which single requirement does the most to knock out the obvious candidate theories — feature lists, prototype or average-based views, structural or role-based views, and modern trained neural networks — or whether some candidates escape the whole list and what that says about the list. Please write your answer in American English, and don't worry about giving me sources or further reading; I want the reasoning, not a bibliography.
