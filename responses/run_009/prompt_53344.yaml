answer: |-
  ## Dissertation Prospectus: The Contingency of Coherence: Path-Dependence in Preference Idealization for Artificial Agents

  **(1) The Question**

  My core question is this: **Is the outcome of coherent preference idealization—such as that proposed in Coherent Extrapolated Volition (CEV)—path-dependent?** Specifically, I investigate whether the *sequence* and *relative rate* of applying idealizing operations (e.g., increasing knowledge, enhancing cognitive speed, deepening moral maturity, extending shared deliberative history) fundamentally alters the resultant “idealized” preferences, even if the *set* of operations applied remains identical. The standard model implicitly assumes these operations commute: that applying them in any order, or simultaneously, converges on a single, stable target representing "what humanity would want if we knew more, thought faster, and were more the people we wished we were." I challenge this assumption. I hypothesize that the trajectory of idealization matters: an agent gaining vast knowledge *before* developing emotional maturity might form different terminal preferences than one undergoing the reverse process; a society deliberating intensely *before* discovering fundamental facts about its nature may reach different reflective equilibria than one receiving that information upfront. If this path-dependence holds, "our idealized preferences" is not a unique target but a *family* of potential targets, indexed to the specific "extrapolation schedule." Consequently, the choice of this schedule ceases to be a neutral technical implementation detail and becomes a substantive, potentially controversial, normative decision determining which idealized version of ourselves the AI ultimately serves.

  **(2) Why the Standard Debates Leave It Open**

  Existing critiques of CEV and related idealization approaches primarily target the *feasibility* or *desirability* of convergence itself. Coherence objections argue that human values are inherently fragmented or contradictory, rendering a single coherent extrapolation impossible. Concerns about unrecognizability or paternalism focus on the gap between actual and idealized agents, questioning whether the result authentically represents *us*, even if coherent.

  Defenses of idealization typically operate on two fronts. One argues that coherence *is* achievable as a technical bootstrapping problem, perhaps through sophisticated reflective equilibrium processes under idealized conditions. Another contends that despite challenges, such idealization provides the least bad normative foundation for superintelligent AI, avoiding arbitrariness or parochialism better than alternatives.

  *Neither* line adequately addresses the path-dependence question. The coherence critics often *presuppose* divergence but don't analyze the *mechanisms* leading to *different* coherent endpoints depending on path. They argue *against* convergence, not *for* the multiplicity of convergences. Defenders, meanwhile, generally *assume* that if convergence is possible, the endpoint is unique. Their arguments for idealization as a normative bootstrap implicitly rely on this uniqueness. They treat the idealizing operators as additive forces pushing towards a single attractor, neglecting the possibility that the *dynamics* of how these forces are applied might reshape the landscape itself, creating multiple distinct attractors. The debate largely overlooks the internal temporal structure of the idealization process itself as a variable of normative significance. Path-dependence, if real, presents a distinct challenge: even *if* coherence is achievable, *which* coherence gets achieved depends crucially on the sequence of idealization – a variable not settled by the arguments for idealization *in principle*.

  **(3) Method**

  My approach combines conceptual analysis with controlled, abstract modeling to explore the dynamics of preference evolution under sequenced idealization pressures. The goal is not formal proof but generating robust intuitions about potential path-dependence mechanisms.

  *   **Year 1, Semester 1: Formalizing the Framework & Toy Agent Simulations (Months 1-6)**
      *   Define core idealizing operators (Knowledge Increase ΔK, Cognitive Acceleration ΔC, Moral Maturation ΔM, Extended Deliberation ΔD) in abstract, tractable terms suitable for modeling. Avoid highly realistic but intractable complexity.
      *   Develop simple computational models of "toy agents" (e.g., agents with small sets of initial preferences or values, represented numerically or as simple rules). These agents will possess mechanisms for updating their preferences based on inputs simulating ΔK, ΔC, ΔM, ΔD.
      *   Implement distinct "extrapolation schedules": e.g., (ΔK then ΔM) vs. (ΔM then ΔK); rapid ΔC followed by slow ΔD vs. intertwined application. Observe the resultant "final" preference states across multiple runs and initial conditions.
      *   Focus: Identifying clear cases where different schedules lead systematically different terminal states from identical starting points, and characterizing the mechanisms (e.g., early knowledge biasing moral development; cognitive speed allowing premature convergence).

  *   **Year 1, Semester 2: Conceptual Grounding & Historical Analogues (Months 7-12)**
      *   Analyze classical ideal-observer theories (Firth, Rawls-inspired variants) and full-information accounts of desire (e.g., Smith’s Constitutivism, Railton’s Ideal Advisor). Scrutinize their implicit assumptions about the idealization *process*. Do they assume commutativity? Are there hints of path-dependence concerns in criticisms or variations?
      *   Examine analogues in moral development psychology (Kohlberg, contemporary dual-process models) and deliberative democratic theory (how sequence of information and dialogue impacts outcomes). How do sequences of experience shape values in real (though non-idealized) agents?
      *   Synthesize insights: What conceptual resources do these fields offer for understanding potential path-dependence? What limitations do they reveal in the toy models?
      *   Refine the toy models based on conceptual insights.

  *   **Year 2, Semester 1: Model Refinement & Normative Analysis (Months 13-18)**
      *   Develop more sophisticated toy models incorporating insights from Semester 2 (e.g., richer preference structures, more nuanced interaction effects between operators, simple models of group deliberation under sequenced idealization).
      *   Systematically map the "space" of extrapolation schedules and resulting preference outcomes across model variations.
      *   Begin rigorous normative analysis: If path-dependence is observed, what are the implications for the *authority* of the resulting "idealized" preferences? How does the choice of schedule become a normative problem? Explore potential meta-principles for selecting schedules (e.g., minimizing arbitrariness, maximizing authenticity-at-stages, procedural fairness).

  *   **Year 2, Semester 2: Synthesis, Writing & Dissemination (Months 19-24)**
      *   Integrate model results and conceptual analysis into a cohesive argument.
      *   Draft dissertation chapters and targeted journal articles.
      *   Present findings at relevant philosophy and AI ethics conferences.

  **(4) What a Result Looks Like**

  Three primary outcomes are possible:

  1.  **Strong Path-Dependence:** The models consistently show divergent terminal preferences based solely on the sequence/rate of applying ΔK, ΔC, ΔM, ΔD, even for agents/groups converging internally. Evidence: Clusters of distinct, stable preference outcomes emerge corresponding to major schedule types (e.g., knowledge-first vs. maturity-first), across a range of plausible initial conditions and model implementations.
  2.  **Path-Independence (Washout):** Despite initial variations, terminal preferences converge robustly to a single outcome regardless of schedule, provided the full set of operators is applied sufficiently. Evidence: Preference trajectories starting from the same point under different schedules consistently arrive at indistinguishable endpoints after sufficient "idealization time," even if the paths look different transiently.
  3.  **Managed Path-Dependence:** Path-dependence occurs but is constrained or resolvable. Perhaps schedules sharing certain features (e.g., interleaving operators, avoiding extreme sequencing) converge, or a meta-criterion exists to select a privileged schedule. Evidence: Divergence is present but limited to specific, avoidable schedule types, or a clear normative argument emerges for prioritizing one class of schedules based on the idealization process itself.

  The evidence will lie in the systematic patterns (or lack thereof) in the terminal preference states generated by the models under varying schedules, combined with the conceptual analysis showing whether and how these patterns resonate with or challenge foundational assumptions in idealization theories.

  **(5) Failure Conditions**

  This project faces several potential failure points:

  1.  **Model Intractability or Irrelevance:** The toy models might become too simplistic to yield meaningful intuitions or too complex to manage or interpret clearly. Conversely, they might be dismissed as philosophically irrelevant cartoons, failing to capture essential features of real value formation or idealization. Mitigation: Start extremely simple, prioritize transparency over realism, and constantly ground model features/outcomes in conceptual arguments.
  2.  **Path-Dependence as Artifact:** Observed path-dependence in models could stem solely from flaws in the model design (e.g., poorly defined operators, inadequate convergence mechanisms) rather than reflecting a genuine philosophical phenomenon. Careful model critique and iteration, plus conceptual analysis, are essential to distinguish artifact from insight.
  3.  **The Coherence Washout:** Path-dependence might prove ephemeral. A sufficiently strong coherence constraint (e.g., a robust reflective equilibrium requirement) might *force* convergence to a unique point regardless of path, rendering the schedule irrelevant. This would be a significant negative result.
  4.  **Conceptual Dissolution:** The core concepts ("maturity," "knowledge," "shared history") might resist sufficiently precise abstraction for modeling or clear philosophical analysis in this context, leaving the question too vague to answer productively.
  5.  **Inconclusive Results:** The models might yield ambiguous patterns, neither strong divergence nor clear convergence, making a definitive conclusion elusive. While still informative, this would weaken the project's impact.

  I will actively monitor for these risks, particularly in the first year, and adapt the research focus if necessary, emphasizing conceptual clarity if modeling proves unfruitful, or vice-versa.
