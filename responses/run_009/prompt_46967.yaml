answer: |-
  ## Joint Statement on the Knowledge Argument: Adversarial Collaboration Findings

  **Issued by:** The Philosophy of Mind Working Group
  **Date:** October 26, 2023
  **Subject:** Analysis of the Mary Scenario and Persistent Disagreements

  **Preamble:** This document represents the outcome of an adversarial collaboration between members of this working group holding physicalist (P) and anti-physicalist (AP) interpretations of the Knowledge Argument (Jackson, 1982). Its purpose is to clarify points of agreement, isolate genuine disagreements with maximal precision, identify key cruxes, and articulate conditions under which each position might be abandoned. It aims for descriptive accuracy and scrupulous fairness to both positions without adjudication.

  **Section 1: Agreed Claims**
  Both camps jointly affirm and endorse the following substantive claims regarding the Mary scenario and the structure of the argument:

  1.  **Completeness of Pre-release Knowledge:** Mary possesses, prior to her release, *all* physical information relevant to color and color vision. This includes complete knowledge of:
      *   The physics of light (wavelengths, reflectance properties).
      *   The neurophysiology of the human visual system (retinal processing, neural pathways, cortical activity patterns associated with color experiences).
      *   The functional roles of color states (behavioral dispositions, causal relations to other mental states, discrimination capacities).
      *   The linguistic and conceptual apparatus used by color-sighted individuals.
  2.  **Physical Intactness:** Mary suffers from no relevant physical or neurological deficits. Her visual system is physiologically normal; her inability to see color is solely a consequence of her lifelong monochromatic environment, not any underlying pathology.
  3.  **Conceptual & Cognitive Competence:** Mary possesses the relevant concepts (e.g., 'red', 'experience', 'qualia') prior to release. She is not conceptually deficient. She is capable of complex reasoning, imagination guided by physical knowledge, and forming accurate beliefs *based on the information available to her*.
  4.  **Post-release Phenomenal Experience:** Upon seeing color for the first time, Mary has a novel *phenomenal experience* (e.g., an experience with the qualitative character of seeing red). This experience is epistemically significant to her.
  5.  **Post-release Epistemic Shift:** Upon seeing color, Mary gains *something* epistemically new. She comes to know *what it is like* to see red in a way she did not, and could not, know it before her release.
  6.  **Structure of the Argument:** The Knowledge Argument is intended as a *conceivability argument* leading to a *modal conclusion* about the falsity of physicalism. Its core logic is:
      *   **Premise 1 (Epistemic Gap):** Mary learns something new upon experiencing red, even possessing all physical facts.
      *   **Premise 2 (Deducibility Principle):** If all facts are physical facts, then possessing all physical facts should entail knowing all facts (i.e., no new *fact* should be learnable).
      *   **Conclusion (Ontological Gap):** Therefore, there are facts (facts about what it is like to see red) that are not physical facts. Physicalism is false.
  7.  **Non-Resolutions:** The following would *not* constitute a resolution of the disagreement acceptable to both parties:
      *   Merely redescribing "knowing what it's like" as "acquiring abilities" or "new modes of presentation" without explicitly showing why this precludes the acquisition of genuinely new propositional knowledge relevant to the argument's logic.
      *   Insisting on one side's preferred terminology (e.g., "only ability knowledge," "new phenomenal fact") without engaging the substantive point concerning the existence or non-existence of non-physical facts revealed by Mary's experience.

  **Section 2: Disagreements Table**

  | Point of Disagreement                                                                                                                                 | Physicalist Formulation (P)                                                                                                                                                                                                 | Anti-Physicalist Formulation (AP)                                                                                                                                                                                                 |
  | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of the New Knowledge Acquired**                                                                                                           | **P:** Upon release, Mary gains new *non-propositional, practical knowledge* (e.g., abilities to recognize, imagine, or remember the experience of red) and/or encounters familiar physical facts under *new modes of presentation*. She gains no new *propositional* fact. | **AP:** Upon release, Mary gains genuinely new *propositional knowledge* – she learns a *new fact* about the world, namely *what it is like* subjectively to experience red. This fact concerns the intrinsic, phenomenal character of experience. |
  | **Note:** *This disagreement is primarily substantive, concerning the fundamental category of what is learned. However, there is a verbal component regarding the scope of "knows a fact" and "propositional knowledge." Both agree Mary gains significant new epistemic access; they disagree on whether this access constitutes learning a new truth about the world.* |                                                                                                                                                                                                                             |                                                                                                                                                                                                                                   |
  | **2. Ontological Status of Phenomenal Facts**                                                                                                         | **P:** All facts, including facts about Mary's experience of red and her "knowing what it's like," are ultimately constituted by, realized by, or identical to physical facts (broadly construed to include functional/structural properties). Phenomenal facts *are* physical facts. | **AP:** The fact Mary learns upon experiencing red – the fact about the subjective, qualitative character of the experience itself – is a fundamentally *non-physical* fact. It is a fact over and above the physical facts she knew before. |
  | **Note:** *This is a substantive ontological disagreement stemming directly from the interpretation of the new knowledge.*                                                                                            |                                                                                                                                                                                                                             |                                                                                                                                                                                                                                   |
  | **3. Significance of Mary's Surprise/Epistemic Gap**                                                                                                  | **P:** Mary's surprise or sense of novelty upon release is explained by the *acquisition of new cognitive abilities or skills*, or by the *indexical/recognitional nature* of the new mode of access, not by encountering a new fact unknown to physics. The epistemic gap does not imply an ontological gap. | **AP:** Mary's surprise or sense of novelty upon release is compelling evidence that she is genuinely *learning a new fact* – encountering a truth about the world she was previously ignorant of, despite her exhaustive physical knowledge. The epistemic gap strongly suggests an ontological gap. |
  | **Note:** *This disagreement is substantive, concerning the best explanation for the undeniable epistemic novelty Mary encounters.*                                                                                   |                                                                                                                                                                                                                             |                                                                                                                                                                                                                                   |
  | **4. Validity of the Deducibility Premise (Premise 2)**                                                                                               | **P:** The Deducibility Premise is false or misapplied. Possessing all physical facts (in propositional form) does *not* entail possessing all facts *if* some facts are only knowable via acquaintance or ability possession. Ontological physicalism does not require *a priori* deducibility of *all* truths from the physical base. | **AP:** The Deducibility Premise is sound. If physicalism is true, the complete physical truth should entail *all* truths, including phenomenal truths. Mary's inability to deduce "what it's like" from the physical facts shows that phenomenal truths are not entailed by, and thus are not identical to, physical truths. |
  | **Note:** *This is a substantive disagreement about the relationship between ontological physicalism and epistemic deducibility.*                                                                                     |                                                                                                                                                                                                                             |                                                                                                                                                                                                                                   |

  **Section 3: Cruxes and Predictive Scenarios**

  The following sub-questions are identified as potential cruxes. Both camps agree that the outcome of the described variant scenario would bear significantly on them. Each camp records its prediction and interpretation in advance.

  **Crux 1: Does exhaustive physical knowledge enable prediction of the *subjective character* of the experience?**
  *   **Scenario:** Prior to release, Mary is provided with a complete functional and neural description *specifically of her own visual cortex and its predicted state* upon exposure to a red object. She is then asked to write down, in precise, first-person terms, her expected phenomenal experience at the moment of release (e.g., "I will have an experience with this specific, ineffable, reddish quality Q").
  *   **P Prediction:** Mary will be able to write a descriptively *correct* account of the functional role and neural correlates of her experience. She will *not* be able to accurately capture the *subjective, phenomenal character* in first-person terms from the third-person data alone. Her actual experience will involve a novel *acquaintance* or *ability activation*, matching the functional description but providing a new *way* of knowing it.
  *   **AP Prediction:** Mary will be able to provide a detailed third-person account. Crucially, she will be *unable* to write down a first-person description that captures the *intrinsic qualitative character* ("what it's like") she will actually experience. Her subsequent report of novelty/surprise confirms this inability reflects a gap in her pre-release *factual* knowledge.
  *   **Interpretations:**
      *   **If Mary writes a verbatim correct first-person report (e.g., "It will be *exactly* like *this*" and it is):** P would argue this demonstrates the phenomenal character is fully specified by the physical/functional description. AP would likely concede significant ground, questioning either the completeness of the stipulated physical knowledge or the possibility of truly capturing the subjective character descriptively without experience. *Both agree this outcome would be highly surprising and damaging to AP.*
      *   **If Mary's report is verbatim incorrect or she deems the task impossible:** P argues this is expected; the "what it's like" isn't a propositional fact to be described pre-experience but an ability/acquaintance gained *at* experience. AP argues this confirms a genuine factual gap in her pre-release knowledge.
      *   **If Mary's report is correct on all third-person verifiable aspects (neural, functional, behavioral predictions) but she still reports profound subjective surprise ("It's *that*?! I never *really* knew!"):** P argues this is expected; surprise stems from the shift from theoretical description to direct acquaintance/ability. AP argues this confirms that the surprise reveals learning a new *fact* about the intrinsic nature of the experience, not captured by third-person descriptions.

  **Crux 2: Does the epistemic gap necessitate an ontological gap?**
  *   **Scenario:** Analysis of the above variant, focusing on interpreting the *source* of any residual surprise or inability to predict the first-person character, even with maximal self-knowledge.
  *   **P Stance:** The epistemic gap (inability to predict the subjective character from physical facts) is explained by the nature of phenomenal concepts/indexical knowledge/recognitional capacities. It does not require positing non-physical properties; it reflects a limitation in *how* we access physical facts about consciousness, not *what* those facts are.
  *   **AP Stance:** The persistence of the epistemic gap, even with complete physical knowledge of the experiencing *subject* (Mary herself), is best explained by the presence of genuinely non-physical phenomenal properties or facts. The gap reveals a limitation in the *content* of physical facts.
  *   **Bearing of Scenario:** A persistent inability to predict/describe the first-person character despite exhaustive physical self-knowledge is taken by AP as strong evidence for the ontological gap. P interprets the same inability as revealing the non-propositional nature of phenomenal knowledge, consistent with physicalism.

  **Crux 3: Is "knowing what it's like" reducible to ability possession?**
  *   **Scenario:** Post-release, Mary loses all memory of the *specific phenomenal character* of red due to a selective neuro-intervention, while retaining all her pre-release physical knowledge *and* all post-release *abilities* associated with seeing red (e.g., she can reliably discriminate red objects, use the word "red" correctly, recall the neural correlates, imagine *that* she is seeing red based on functional knowledge).
  *   **P Prediction:** Mary would truthfully say she no longer knows "what it's like" to see red *in the acquaintance sense*, but crucially, she would *not* claim to have lost knowledge of a *fact* she previously knew. Her "knowing what it's like" was constituted by the abilities/acquaintance, not a proposition.
  *   **AP Prediction:** Mary would report having *lost* specific phenomenal knowledge – a fact she learned upon release. Merely retaining the abilities and conceptual/functional knowledge would not suffice for her to claim she still knows *what it is like*; something genuinely *cognitive* (a piece of knowledge) would be missing.
  *   **Interpretations:** The scenario tests whether the core of "knowing what it's like" is identified with abilities/functionalism (P) or with possessing a specific non-functional, phenomenal proposition (AP). The camps differ fundamentally on what Mary's report *means*.

  **Section 4: Falsifiability and Insulation**

  *   **Physicalist Stance on Falsifiability:** Physicalists would abandon their position if compelling evidence emerged demonstrating the *causal inefficacy* of the physical. Specifically, if systematic neural correlates of a conscious state were identified and physically replicated, yet the conscious state *failed* to occur without any physical difference, or if a conscious state demonstrably occurred *without* any corresponding physical state (violating the causal closure of the physical). Evidence that the "Mary-scenario gap" persists even when Mary *is* the physical system and possesses maximally specific self-knowledge, *and* that this gap necessitates non-physical properties rather than reflecting a mode-of-access limitation, would also be strongly challenging. The predictive failure in Crux 1 would be highly problematic, though reinterpretation might be attempted.
  *   **Anti-Physicalist Stance on Falsifiability:** Anti-physicalists would abandon their position if it were demonstrated that complete physical knowledge *did* entail, in principle, knowing all phenomenal truths. Specifically, if a system (biological or artificial), possessing only the kind of physical/functional information Mary had pre-release, could reliably generate accurate, non-trivial first-person descriptions of novel phenomenal states *before* experiencing them, and crucially, if the experiencing subject confirmed the description matched their actual experience *without surprise* rooted in encountering a new fact. Success in the predictive task described in Crux 1 would be devastating. Evidence of a fundamental contradiction within the concept of non-physical properties or their interaction would also be fatal.
  *   **Joint Statement on Insulation:** Both camps acknowledge that certain core aspects of the disagreement are insulated from straightforward empirical resolution. The dispute over **whether the epistemic gap implies an ontological gap (Crux 2)** and the **fundamental interpretation of "knowing what it's like" (Crux 3)** hinge on deep philosophical commitments concerning the nature of facts, knowledge, consciousness, and the relationship between conceptual schemes and ontology. While empirical results concerning neural correlates, predictive success/failure (Crux 1), or neuro-interventions (Crux 3) can provide data that each camp will interpret *within* their framework, they are unlikely to definitively *settle* these core conceptual disagreements. The tests in Section 3 could move individuals by challenging specific implementations of their views or highlighting explanatory burdens, but the central metaphysical divide – concerning the ultimate reducibility or irreducibility of phenomenal properties to the physical – may persist even in the face of agreed-upon empirical outcomes, as the interpretation of those outcomes remains theory-laden. This conceptual insulation is recognized by both sides as an inherent feature of the mind-body problem as currently posed.

  **Signatures:**
  [Physicalist Camp Representatives]
  [Anti-Physicalist Camp Representatives]
  [Working Group Director]
