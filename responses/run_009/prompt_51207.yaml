answer: |-
  Your diagnosis is perceptive, and the impasse stems from a confluence of factors. Here's a structural analysis of the disagreement, moving beyond restatements of the theories:

  **1. The Core Disagreement: Substance Beyond Vagueness Data**

  What the epistemicist asserts that the supervaluationist *fundamentally* denies is not merely about borderline cases or truth-value gaps, but about the **ontological and metaphysical prerequisites for meaning and truth itself**. Specifically:

  *   **Epistemicist Assertion:** For a linguistic expression to possess a definite meaning capable of sustaining truth-aptness (bivalence), its use *must* determine a *unique*, maximally specific extension within the relevant domain. Any failure of determination at the boundary is *necessarily* epistemic (a failure of knowledge about the precise boundary), not semantic (a failure of the boundary to exist determinately).
  *   **Supervaluationist Denial:** Meaning and truth-aptness are compatible with (and indeed, explained by) the *lack* of a unique, maximally specific extension fixed by use. Semantic values can be fundamentally *indeterminate* (a set of precisifications) while still grounding a coherent notion of truth (supertruth) and falsity (superfalsity). Insisting on a unique sharp boundary is neither required by linguistic practice nor coherently motivated.

  This is **substantive**, not merely verbal. It concerns the fundamental nature of semantic relations and the reality they track.

  **2. The Nature of the Impasse: Divergent Foundational Commitments**

  The impasse betrays a **deep disagreement in the metaphysics of language and truth**, driven primarily by:

  *   **Divergent Standards for Semantic Adequacy:** What constitutes a successful *explanation* of meaning?
      *   *Epistemicists* prioritize **Explanatory Power & Determinacy:** A semantics must explain how we *grasp* meaning and how it *hooks onto the world* determinately. Bivalence is seen as non-negotiable for a robust correspondence theory of truth and the possibility of objective semantic facts. The sharp boundary, however unknowable, provides the required ontological anchor.
      *   *Supervaluationists* prioritize **Systematization & Capturing Intuitions:** A semantics must systematize speaker judgments (truth, falsity, indeterminacy) and linguistic phenomena (penumbral connections, tolerance) *without* positing entities (sharp boundaries) that contradict core speaker intuitions (no determinate boundary). Truth (supertruth) is defined relative to admissible interpretations, not requiring a unique worldly anchor.
  *   **Divergent Metaphysical Intuitions about Reality:** What is the relationship between language and the world it describes?
      *   *Epistemicists* hold a **strongly realist, bivalent metaphysics:** Reality itself is determinate; vagueness is solely a reflection of our representational limitations or imperfect access. Meaning must mirror this determinacy.
      *   *Supervaluationists* allow for a **more deflationary or indeterminacy-tolerant metaphysics:** Reality (or at least, our conceptualization of it relevant for semantics) might not demand maximal specificity everywhere. Semantic indeterminacy can reflect genuine worldly or conceptual indeterminacy without collapsing meaning or truth.
  *   **Divergent Weighting of Intuitions:** Which speaker intuitions are sacrosanct?
      *   *Epistemicists* prioritize the intuition that **meaning determines reference** (even if we can't know the precise cut-off) and that **truth is objective and bivalent** (even if unknowable in borderline cases). The "no sharp boundary" intuition is explained away as an epistemic illusion.
      *   *Supervaluationists* prioritize the **"no sharp boundary" intuition** and the **reluctance to assert borderline statements as true or false**. They explain away the bivalence intuition as arising from conflating truth with supertruth or from considering only clear cases.

  **3. The Role of "Determinately" and the Rival Diagnosis**

  Your rival diagnosis is largely correct. **Equivocation on "determinately" is a key driver of apparent contradiction:**

  *   When an *epistemicist* says a borderline statement is **not determinately true/false**, they mean: "It *has* a unique, objective truth value (true or false), but we cannot know which one."
  *   When a *supervaluationist* says a borderline statement is **not determinately true/false** (or simply lacks a truth value), they mean: "It lacks a unique, objective truth value *simpliciter*; it is neither supertrue nor superfalse."

  This masks the deeper disagreement about what "determinate truth/falsity" *requires* ontologically (a sharp boundary vs. supertruth/superfalsity). The surface clash over "truth-value gap vs. unknowable truth-value" is a symptom, not the core disease. The parties *are* asking subtly different questions under the banner of "what is vagueness?":

  *   Epistemicist: "How can meaning and bivalent truth be preserved despite our ignorance at the boundaries?"
  *   Supervaluationist: "How can we model speaker competence and judgments without positing boundaries that contradict those judgments?"

  **4. Paths to Progress (or Lack Thereof)**

  Given this diagnosis, progress is unlikely via rehashing the standard arguments. Meaningful advancement might come from:

  1.  **A General Theory of Semantic Determination:** This is your key insight. The core dispute hinges on *how linguistic conventions fix semantic values*. Progress requires:
      *   A deeper analysis of the **metaphysics of linguistic conventions/rules**. What *kind* of facts constitute a word's meaning? How do community practices yield semantic properties?
      *   Investigating whether **indeterminacy** (in the supervaluationist sense) is a coherent outcome of rule-following and convention, or whether it necessarily collapses into epistemic ignorance. Can conventions genuinely underdetermine extensions without implying a hidden determinacy?
      *   Exploring whether **bivalence is truly essential** for reference, truth, and communication, or whether a supervaluationist framework provides an equally adequate (or superior) foundation.
  2.  **Refining the "Definitely" Operator and Higher-Order Vagueness:** Both theories struggle profoundly with higher-order vagueness. Success here could shift the balance:
      *   If epistemicists can develop a plausible, non-ad-hoc **logic of determinacy/metaknowledge** that genuinely models the blurriness of boundaries *without* collapsing into supervaluationism, it would strengthen their case.
      *   If supervaluationists can develop a **robust, non-paradoxical account of higher-order admissibility** and the "definitely" operator that avoids problematic precision or regress, it would demonstrate the resilience of their framework.
  3.  **Empirical Work on Categorization:** While unlikely to *resolve* the metaphysical dispute, cognitive science on categorization, prototype theory, and the psychology of boundary judgments could:
      *   Inform models of **competence and tolerance** that both theories aim to capture.
      *   Challenge or support intuitions about whether speakers *act as if* there's a sharp boundary or genuine indeterminacy in borderline reasoning.
      *   Highlight which aspects of vagueness are core semantic phenomena vs. performance limitations or pragmatic effects.
  4.  **A Change of Question / Dialectical Shift:** Acknowledging the foundational nature of the disagreement could lead to:
      *   Framing the debate explicitly as **"What are the minimal metaphysical commitments for a viable semantics?"** rather than "What is vagueness?".
      *   Focusing on **comparative adequacy**: Which framework offers a *better overall balance* in explaining the *totality* of linguistic phenomena (vagueness, context-sensitivity, ambiguity, change), not just sorites susceptibility?
      *   Exploring **pragmatist or expressivist alternatives** that bypass the truth-conditional commitments of both sides.

  **Prognosis:** Significant movement is unlikely in the short term. The impasse reflects **deeply entrenched, pre-theoretical intuitions** about language, truth, and reality. Epistemicism offers metaphysical comfort (determinacy) at the cost of counterintuitive epistemology (unknowable boundaries). Supervaluationism offers intuitive comfort (no sharp boundaries) at the cost of metaphysical complexity (indeterminacy, truth relativized to precisifications). Neither side finds the other's cost acceptable. Progress requires either a breakthrough in understanding semantic determination itself, compelling developments on higher-order vagueness that force one side to concede, or a broader philosophical shift in attitudes towards bivalence or metaphysical indeterminacy. While the debate may refine our understanding, the core disagreement may persist as a fundamental philosophical fault line.
