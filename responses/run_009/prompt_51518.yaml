prompt: |-
  In the hospital where my mother worked as a social worker, the same institution does three things I cannot reconcile. When a patient with capacity refuses a feeding tube, her present word is final and no one may question it. But when a patient with advanced dementia pulls at the tube and asks to go home, and her advance directive from years earlier says no artificial nutrition, the staff honor the paper over the person in the bed. And in a third kind of case the institution behaves differently again: a patient who, while competent, tried to irrevocably bind his future self — telling his treatment team in writing that he wanted no antipsychotic medication ever, even if he later demanded it during a psychotic episode — was medicated anyway, on the reasoning that his past instruction carries weight only when the present patient is judged unable to decide. So present competent wishes always win; past wishes win only when the present self is disqualified; and even past wishes apparently give way when the later self's distress is severe enough.

  What theory of the self, or of autonomy, does this layered practice presuppose? One possibility is that autonomy belongs to the whole life: the earlier, competent self speaks for the person because a life is the unit whose interests matter, and the directive executes the project that person set for herself. Another is that the directive works by identity loss: the later, demented self is in some relevant sense no longer the one who made the promise, so following the directive is not self-rule at all but the carrying out of a bequest. A third is that the directive is merely evidence of what is best for the patient, defeasible like any evidence, with no authority over anything. The practice does not treat these as equivalent: an authority reading should honor the directive even when the later patient is content and resistant to treatment, whereas an evidential reading should give way when the patient's current state is itself the better guide to her interests. And the psychiatric case suggests the operative principle may be none of the three — perhaps something closer to honoring the past self only when compliance is cheap, or only when the later self is not suffering.

  Reconstruct the implicit theory behind the practice as actually carried out, saying which parts strictly presuppose which commitments, which parts are underdetermined and would license several of the rival theories, and where the pieces pull in different directions. Then commit: which reading of what the practice is doing do you actually endorse, and what specifically should change in how advance directives are drafted, interpreted, or overridden if your reading is right? Please answer in American English.
reasoning: |-
  Okay, the user presents a complex ethical dilemma involving advance directives in medical settings. They describe three distinct scenarios where healthcare institutions handle patient autonomy differently: respecting present competent refusals, honoring past directives for dementia patients despite current resistance, and overriding past medication refusals during psychotic episodes. The core question asks about the implicit theory of self underlying these practices.

  Hmm, this seems to be coming from someone with deep familiarity with medical ethics - likely a professional in healthcare, law, or bioethics given the precise terminology and case descriptions. The emotional tone suggests frustration with institutional inconsistency, possibly stemming from personal experience (mentions their mother as a social worker). There's an unstated plea here for coherence in how we treat human identity over time.

  Let me break this down systematically. The three scenarios create a pattern that doesn't neatly fit existing autonomy theories. First scenario is straightforward: contemporaneous autonomy prevails. The dementia case shows privileging past over present self. The psychosis case is most puzzling - it suggests suffering trumps both past instructions and present demands when competence is compromised.

  The institutional logic seems to be: 1) Competence triggers absolute present autonomy 2) Severe cognitive decline revives past autonomy 3) Suffering with partial competence creates a paternalistic override. This points to a hybrid theory where selfhood has thresholds - not a continuous identity but rather competence-defined phases. The "cheap compliance" observation is astute: when honoring directives requires restraining a distressed patient, institutions balk.

  What's really needed here is distinguishing between types of incapacity. Dementia involves irreversible identity erosion - the past self really does speak for a now-vanished person. Psychosis involves temporary suspension where the "core self" remains. The feeding tube refusal in dementia respects the irreversible narrative arc, while medicating the psychotic patient preserves the possibility of future autonomy restoration.

  For practical changes, the system needs: 1) Clearer competence thresholds in directives 2) Distinction between identity-altering and identity-preserving conditions 3) Suffering assessments tied to the patient's enduring values (not just momentary distress). The current practice isn't wholly wrong but lacks these nuances - leading to apparent contradictions that trouble observant professionals like the user.
answer: |-
  Here's a reconstruction of the implicit theory behind the layered practice, followed by my endorsement and proposed changes:

  **Reconstructing the Implicit Theory:**
  The practice reveals a **hybrid, context-dependent theory of autonomy and selfhood**, prioritizing different values based on the patient's current state and the nature of their suffering. Key commitments include:

  1.  **Present Competence as Sovereign:** When a patient *currently* has decision-making capacity, their expressed wishes are absolute. This strictly presupposes that the **present, conscious self possesses ultimate moral authority over the body.** Past directives or future hypotheticals cannot override this.

  2.  **Past Self as Guardian for the Irrevocably Diminished Self:** For the advanced dementia patient, the practice presupposes:
      *   The present self (pulling at the tube, asking to go home) **lacks the cognitive capacity** to make a valid medical decision.
      *   The dementia is **so severe and irreversible** that the person who wrote the directive is effectively "gone," or their current state represents a fundamental rupture in identity/narrative continuity.
      *   The directive represents the **last known competent expression** of the "real" person's values and wishes regarding a specific, anticipated state.
      *   **Suffering of the *past* self** (fear of prolonged indignity) outweighs the **discomfort/distress of the *present* diminished self** (pulling the tube). The directive prevents the life the competent self feared.

  3.  **Suffering Trumps Past Directives in Reversible States:** In the psychiatric case, the practice presupposes:
      *   The psychotic patient *lacks current capacity* (like the dementia patient), BUT...
      *   Their suffering is **acute, severe, and potentially reversible.**
      *   The refusal (made while competent) was **absolute ("no antipsychotic medication ever")** and intended to bind the future self irrevocably.
      *   **Honoring the directive would inflict severe, preventable suffering** on the *present* individual inhabiting the body.
      *   The *present* self's **distress is judged more salient** than the *past* self's fear of medication/side effects/loss of control *in this specific, treatable crisis*. The *past* self is not "gone" but "obscured."
      *   **Restoring capacity is possible and desirable**, allowing the competent self to reassert their wishes later (potentially reaffirming or revising the directive).

  **Underdetermined Areas & Tensions:**
  *   **Identity Threshold:** The practice assumes a threshold of cognitive decline where the past self "speaks for" the present body. Where exactly this lies (mild dementia vs. advanced) is underdetermined and varies.
  *   **Suffering Calculus:** The relative weight given to the *past* self's fear of future suffering/invasion vs. the *present* self's actual distress/pain is a major tension. The dementia case implicitly prioritizes avoiding the *past* self's feared suffering, while the psychiatric case prioritizes relieving the *present* self's acute suffering. The theory doesn't clearly define which suffering "counts more" or when.
  *   **"Cheap Compliance" vs. Principle:** Does the psychiatric case reflect a principled distinction (reversible crisis vs. permanent decline) or merely pragmatic "cheap compliance" (it's easier to medicate than to restrain someone pulling a tube)? The practice *suggests* a principle (reversibility), but the line is blurry.
  *   **Directive as Authority vs. Evidence:** In the dementia case, the directive acts as binding authority *because* the present self is disqualified. In the psychiatric case, the directive's authority is *defeated* by the present self's suffering and the state's reversibility, making it seem more like evidence. The practice relies on both concepts situationally.

  **Conflicting Pulls:**
  *   **Dementia vs. Psychiatric:** The strongest pull is between honoring the past self's directive despite the present self's resistance (dementia) vs. overriding the past self's directive due to the present self's suffering (psychiatric). This highlights the core tension between **narrative integrity/life-plan autonomy** and **relief of present suffering/paternalism**.
  *   **Absolute Past Directives:** The practice seems to reject the notion that a competent self can *irrevocably* bind a future incapacitated self in all circumstances, especially when suffering is acute and treatable. This pulls against a strong "whole life" autonomy view.

  **My Endorsement and Proposed Changes:**

  I endorse a reading closest to the **"Past Self as Guardian for the Irrevocably Diminished Self"** theory, refined and made more explicit. The core principle should be: **Advance directives express binding autonomy *only* when the current patient lacks capacity *and* their condition represents an irreversible loss of the cognitive/identity continuity necessary to authentically revise those prior wishes.** Suffering matters, but its source and nature are crucial.

  *   **In Favor:**
      *   It respects the deeply held values and life narrative of the competent person facing potential future incapacity.
      *   It avoids imposing burdensome, unwanted interventions on individuals who explicitly rejected them when capable of understanding their implications (like prolonged artificial feeding in advanced dementia).
      *   It acknowledges a qualitative difference between irreversible decline (where the "person" who made the plan is gone) and temporary incapacity (where the core self persists but is overwhelmed).
      *   It provides clearer guidance than pure suffering-based overrides or viewing directives only as evidence.

  *   **Against the Alternatives:**
      *   **Whole Life Autonomy:** Overly rigid. It ignores the moral significance of the *present* experiencing self's suffering in potentially reversible states. Competent people cannot foresee all future contexts perfectly.
      *   **Identity Loss/Bequest:** This is largely the view I support, but needs refinement regarding suffering and reversibility.
      *   **Pure Evidence:** Undermines the core purpose of directives – to ensure one's values are respected *when* one cannot speak. It gives too much discretion to override based on current assessments of "best interests."

  **Specific Changes Needed (if my reading is right):**

  1.  **Explicitly Define "Irreversible Incapacity" in Directives & Policy:** State laws and institutional policies should clarify that advance directives (especially refusals like "no tube feeding") are intended to be binding primarily in scenarios of *permanent, profound* cognitive decline (like advanced dementia) where the individual cannot meaningfully re-evaluate their prior wishes. Distinguish this from temporary incapacity (psychosis, delirium, coma with recovery potential).
  2.  **Refine Psychiatric Directives ("Ulysses Contracts"):** Acknowledge explicitly that directives refusing *all* psychiatric medication, even during acute psychosis, may be overridden if:
      *   The patient lacks current capacity.
      *   The medication is necessary to prevent severe harm (to self/others) or alleviate extreme, treatable distress.
      *   The goal is restoration of capacity so the patient *can* participate in decisions again.
      *   **Change:** Encourage/draft directives that specify *conditions* under which the refusal applies (e.g., "unless I am actively psychotic and a danger to myself") or designate a trusted surrogate with specific authority to interpret the directive during mental health crises.
  3.  **Incorporate Suffering Assessments More Nuancedly:** Develop clearer protocols for assessing suffering:
      *   **Source:** Is the suffering primarily caused by the *intervention* itself (restraints, tube discomfort) that the prior self rejected, or by the underlying *condition* (untreated psychosis, pain)?
      *   **Nature:** Distinguish between distress due to confusion/fear (common in dementia) and distress due to untreated, reversible symptoms like psychosis or severe pain.
      *   **Weight:** The suffering caused by *imposing* an unwanted, invasive intervention (tube feeding on a resisting dementia patient) carries more weight in upholding a directive than the suffering caused by *withholding* a potentially unwanted treatment (antipsychotics) to honor a directive, especially if the treatment alleviates the crisis and restores autonomy.
  4.  **Surrogate Decision-Maker Primacy in Ambiguity:** In cases falling outside clear irreversible incapacity (e.g., moderate dementia, temporary delirium) or where suffering assessments are complex, empower the designated healthcare proxy/surrogate (who knows the patient's values best) to interpret the directive and weigh current suffering/benefits, guided by the principle of substituted judgment ("what would *this person* decide if momentarily competent?"), not just best interests.
  5.  **Document Reasoning for Overrides:** When a directive is overridden (as in the psychiatric case), require clear documentation justifying *why*: specifically citing the patient's current lack of capacity, the acute/reversible nature of the condition causing suffering, the treatability of that suffering, and the goal of restoring decision-making capacity.

  This approach grounds the practice in respecting the prior autonomous choices of the "author" of one's life narrative, especially when that author can no longer speak meaningfully due to irreversible decline. It recognizes present suffering but gives it less decisive weight when respecting the directive aligns with avoiding the very state of existence the competent self feared and rejected. It requires clearer definitions and more nuanced assessment tools but provides a more coherent ethical foundation than the current, sometimes contradictory, practice.
