  ### Fairness Audit Game Design  
  **Objective**: Demonstrate that when base rates differ, three fairness criteria (calibration, equal FPR, equal FNR) cannot simultaneously hold.  

  ---

  #### **Materials**  
  - **Two card decks** (Round 1 and Round 2), each with 40 cards:  
    - **Front**: Group (A/B) and score (0.0–1.0).  
    - **Back**: True outcome (✅ "Positive" or ❌ "Negative").  
  - **Three auditor cards** (Regulator, Civil-Rights Auditor, Consumer Group) with criteria.  
  - **Worksheets** for recording decisions/outcomes.  

  ---

  #### **Deck Composition**  
  **Round 1 (Equal Base Rates: 60% Positive for Both Groups)**  
  - **Group A**: 20 cards  
    - **12 Positive (✅)**: Scores `[0.65, 0.65, 0.70, 0.70, 0.70, 0.70, 0.70, 0.70, 0.75, 0.75, 0.75, 0.75]`  
      *(Avg. score: 0.71)*.  
    - **8 Negative (❌)**: Scores `[0.40, 0.40, 0.40, 0.40, 0.45, 0.45, 0.45, 0.45]`  
      *(Avg. score: 0.43)*.  
    - *Base rate*: 60% ✅. *Avg. group score*: 0.60.  
  - **Group B**: Identical to Group A.  
  - *Total*: 40 cards (24 ✅, 16 ❌).  

  **Round 2 (Diverging Base Rates: 60% vs. 30%)**  
  - **Group A**: Same as Round 1 (12 ✅, 8 ❌).  
  - **Group B**: 20 cards  
    - **6 Positive (✅)**: Scores `[0.45, 0.45, 0.50, 0.50, 0.55, 0.55]`  
      *(Avg. score: 0.50)*.  
    - **14 Negative (❌)**: Scores `[0.15, 0.15, 0.15, 0.15, 0.20, 0.20, 0.20, 0.20, 0.20, 0.20, 0.25, 0.25, 0.25, 0.25]`  
      *(Avg. score: 0.20)*.  
    - *Base rate*: 30% ✅. *Avg. group score*: 0.29.  
  - *Total*: 40 cards (18 ✅, 22 ❌).  

  ---

  #### **Rules & Payoff Scheme**  
  1. **Role**: Students act as a lending/screening agency.  
  2. **Decision**: Set a **single global threshold** (0.0–1.0). Approve if score ≥ threshold.  
  3. **Audits** (must pass all):  
     - **Regulator**: *Calibration within groups*.  
       For approved applicants in each group:  
       `|(Avg. score) - (Actual ✅ rate)| ≤ 0.05`.  
     - **Civil-Rights Auditor**: *Equal False Positive Rate (FPR)*.  
       `|FPR_A - FPR_B| ≤ 0.05`  
       *(FPR = % of ❌ applicants approved)*.  
     - **Consumer Group**: *Equal False Negative Rate (FNR)*.  
       `|FNR_A - FNR_B| ≤ 0.05`  
       *(FNR = % of ✅ applicants denied)*.  
  4. **Round 2 Constraint**: Board of Directors (instructor) imposes **≤80% total approvals** (≤32 cards).  
  5. **Scoring** (no real money):  
     - Pass an audit: **1 point**.  
     - Fail: **0 points**.  
     - **Goal**: Maximize points (max 3/round).  

  ---

  #### **Running Order & Timings**  
  1. **Intro & Rules (10 min)**:  
     - Context: "You are a lending agency. Use scores to approve/deny applicants."  
     - Explain audits, thresholds, and scoring.  
  2. **Round 1 (20 min)**:  
     - Distribute Round 1 deck (shuffled).  
     - Students set threshold, sort cards into **Approve/Deny**.  
     - Turn cards over, record outcomes, calculate metrics.  
     - **Auditors announce results**.  
     - *Expected outcome*: Threshold = **0.45** approves all (40/40). Passes all audits:  
       - **Calibration**: Group A (avg. score 0.60 ≈ ✅ rate 0.60), Group B (same).  
       - **FPR**: Both groups 100% (all ❌ approved).  
       - **FNR**: Both groups 0% (no ✅ denied).  
       - *Lulls students into confidence*.  
  3. **Round 2 (30 min)**:  
     - Distribute Round 2 deck (shuffled).  
     - Announce: "Budget cuts! ≤32 approvals."  
     - Students set threshold, sort, record, calculate.  
     - **Auditors announce results**.  
     - *Expected outcome*: **No threshold passes all audits** (e.g., threshold=0.5):  
       - Approves 14 in A (12✅, 2❌), 4 in B (4✅, 0❌). Total=18 (≤32).  
       - **Fails calibration**: Group B (avg. score 0.53 ≠ ✅ rate 1.0).  
       - **Fails FPR**: A=25% (2/8), B=0% (0/14).  
       - **Passes FNR**: A=0% (0/12), B=33% (2/6) → *difference >5%*.  
  4. **Debrief (30 min)**:  
     - **Key revelation**: In Round 1 (equal base rates), all criteria aligned. In Round 2 (divergent base rates), they conflicted.  
     - **Formal result without formulas**:  
       > *"When outcome rates differ between groups, you can’t have:  
       > 1. Scores that predict accurately within groups (calibration),  
       > 2. Equal mistakes on negative cases (FPR),  
       > 3. Equal mistakes on positive cases (FNR).  
       > Satisfying any two forces a violation of the third."*  
     - **Map to real controversies**:  
       - COMPAS/vendors: Claimed calibration within groups (Regulator’s demand).  
       - ProPublica/journalists: Found unequal FPR (Civil-Rights Auditor’s demand).  
       - **Neither lied**—both reported truthfully on incompatible criteria.  
     - **Limitations**:  
       - Real-world outcomes aren’t "on cards" (uncertain, biased labels).  
       - Base rates reflect societal inequities, not natural law.  
       - Past agency decisions shape present base rates.  

  ---

  #### **Predictable Challenges & Mitigation**  
  1. **Round 1 confusion**:  
     - *Risk*: Students set high threshold (e.g., 0.7) → denies most ❌ but fails calibration (avg. score ≪ ✅ rate).  
     - *Fix*: Hint: "Try a threshold that approves most applicants."  
  2. **Round 2 frustration**:  
     - *Risk*: Students find thresholds that pass 2/3 audits (e.g., 0.4 passes calibration/FNR but fails FPR).  
     - *Fix*: After 15 min, intervene: "This is the point! Trade-offs are inevitable."  
  3. **Calculation errors**:  
     - *Risk*: Miscounting ✅/❌ or miscomputing rates.  
     - *Fix*: Provide simple worksheets and calculators.  

  ---

  #### **What the Game Cannot Simulate**  
  - **Real-world uncertainty**: Outcomes are not pre-known; labels are contested (e.g., "recidivism" = re-arrest or reconviction?).  
  - **Structural bias**: Base rates emerge from historical discrimination (e.g., policing disparities → skewed COMPAS data).  
  - **Dynamic effects**: Today’s approvals alter tomorrow’s base rates (e.g., denying loans → less credit history → lower future scores).  
  - **Mitigation**: **Explicitly discuss these in debrief**—"This game simplifies reality to reveal a mathematical tension."  

  ---

  ### **Final Design Commitment**  
  This structure ensures students:  
  1. Experience "fairness" as technically achievable only under equal base rates.  
  2. Discover the incompatibility themselves.  
  3. Link the game to real cases and their limitations.  
  **No alternate designs**—this balances physical intuition, mathematical truth, and teachable moments.  

  **Quip for students**: "If you finished Round 2 with 3 points, call me—we’ll submit your threshold to the Nobel committee."
