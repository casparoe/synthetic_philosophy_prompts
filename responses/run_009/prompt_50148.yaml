  ### Probability Decomposition of Wigner's Proposition

  The proposition:  
  *"The effectiveness of mathematics in fundamental physics is not fully explained by selection effects, convenience, and the choice of which problems physicists work on; some further fact about the world's structure is required to explain it."*

  #### Settled Premises (Non-Contested):  
  - Historical episodes of unexpected mathematical application in physics are real (e.g., complex numbers in quantum mechanics, Riemannian geometry in GR).  
  - The domain asymmetry is real: mathematics is more effective in fundamental physics than in biology, economics, or climate science.  

  #### Contested Issues (No Consensus):  
  - Whether "unreasonable effectiveness" demands a metaphysical explanation.  
  - Whether selection effects fully deflate Wigner’s argument or merely reframe it.  
  - Wigner’s intent: metaphysical claim vs. expression of wonder.  

  ---

  #### Decomposition Terms:  

  **(a) Truth-aptness probability**:  
  - **Probability**: 0.70  
  - **Justification**: Wigner’s essay blends rhetorical wonder with a testable claim about explanatory insufficiency, but deflationary readings are philosophically viable.  

  **(b) Selection-effect insufficiency (given truth-aptness)**:  
  - **Probability**: 0.65  
  - **Justification**: The domain asymmetry (physics vs. biology/economics) challenges both pure selection effects (which predict more uniform effectiveness) and Wigner’s original framing (which struggles to explain the asymmetry).  

  **(d) Additional term: Domain asymmetry relevance (given truth-aptness and residue)**:  
  - **Probability**: 0.85  
  - **Justification**: The asymmetry must be addressed by any residue explanation; it strongly influences whether the residue is domain-specific or universal.  

  **(e) Additional term: Residue existence (given truth-aptness)**:  
  - **Probability**: 0.90  
  - **Justification**: Effectiveness in physics exceeds expectations from selection effects alone (e.g., predictive novel phenomena), leaving *some* explanatory gap.  

  **(c) "World is mathematical" interpretation (given residue)**:  
  - **Probability**: 0.45  
  - **Justification**: Residue could support structural realism ("world is mathematical") but equally permits deflationary views (e.g., physics isolates mathematizable fragments).  

  ---

  #### Combination:  
  The overall credence is calculated as:  
  \[ P = P(a) \times \left[ P(b) + P(d) \times P(e) \right] \times P(c) \]  
  \[ P = 0.70 \times \left[ 0.65 + 0.85 \times 0.90 \right] \times 0.45 \]  
  \[ P = 0.70 \times \left[ 0.65 + 0.765 \right] \times 0.45 \]  
  \[ P = 0.70 \times 1.415 \times 0.45 \]  
  \[ P = 0.70 \times 0.63675 \]  
  \[ P \approx 0.446 \]  
  Rounded to **0.45**.  

  ---

  #### Sensitivity and Disagreement Analysis:  
  - **Most sensitive term**: **(b) Selection-effect insufficiency** (elasticity ≈ 1.2). Small changes here disproportionately affect the result due to its multiplicative interaction with (d) and (e).  
  - **Key evidence/argument to move it**: Empirical demonstration that domain asymmetry stems from selection effects (e.g., showing biological systems *could* be mathematicized at physics’ precision but are neglected) would lower (b). Conversely, discovering mathematical necessity in biological laws (e.g., unified biophysical axioms) would raise it.  
  - **Core disagreement locus**: Likely in **(b)**. The 0.75 credence heavily weights the domain asymmetry *against* selection effects, seeing physics’ success as evidence of deep structure. The 0.35 credence likely sees asymmetry as noise or a byproduct of physics’ idealized scope.  

