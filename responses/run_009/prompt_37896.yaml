answer: |-
  Your argument contains a subtle but critical flaw in its handling of mixed strategy Nash equilibria and the interpretation of what iterated elimination of strictly dominated strategies achieves. Below, I break down your reasoning step by step, identify precisely where it goes wrong, and explain why it cannot be repaired with a small patch—the error stems from a fundamental misunderstanding of how iterated elimination relates to Nash equilibria in games with mixed strategies.

  ### Step-by-Step Breakdown of Your Argument
  1. **Premise 1: Iterated elimination removes strategies that are never rationalizable.**  
     You state that iterated elimination strips away every strategy that is never a best response to any belief about the opponent's play, leaving only strategies that can be rationalized (i.e., are optimal under some belief). This is correct and aligns with the two facts from lecture:  
     - A strictly dominated strategy (pure or mixed) is never a best response to any belief.  
     - Conversely, a strategy that is never a best response is strictly dominated by some mixture.  
     Iterated elimination iteratively removes such strategies, and the surviving set consists exactly of the rationalizable strategies—those that can be justified as best responses to some belief hierarchy.

  2. **Premise 2: Unique Nash equilibrium implies that equilibrium strategies are rationalizable.**  
     You note that in a Nash equilibrium, each player's strategy (pure or mixed) is optimal given correct beliefs about the opponent. Since the equilibrium is unique, and survival in iterated elimination only requires optimality under some belief (not necessarily correct ones), the equilibrium strategies must survive. This is also correct: the support of a Nash equilibrium (the pure strategies played with positive probability in the mixed strategy) always consists of rationalizable strategies. In a unique Nash equilibrium, all rationalizable strategies are contained within this support.

  3. **Faulty Inference: Iterated elimination collapses to a single strategy per player.**  
     Here is where your argument derails:  
     - You claim that for a game with a unique Nash equilibrium, the "hierarchy of beliefs compatible with survival should collapse onto the equilibrium beliefs," implying that iterated elimination must terminate with exactly the equilibrium profile—one strategy per player (pure or degenerate mixture).  
     - You then test this with Matching Pennies, which has a unique mixed strategy Nash equilibrium where each player randomizes evenly (50/50) between Heads and Tails. You predict that iterated elimination should reduce this to one strategy per player, but your TA correctly states that no strategies are eliminated, leaving both pure strategies for both players.

     **Where it goes wrong:**  
     The critical error is in assuming that "collapse onto the equilibrium beliefs" implies that only one pure strategy per player survives. This overlooks two key aspects of mixed strategy equilibria:  
     - **Mixed strategies involve multiple pure strategies in their support.** In a mixed strategy Nash equilibrium, players randomize over pure strategies, meaning multiple pure strategies are best responses to the equilibrium beliefs (e.g., in Matching Pennies, both Heads and Tails are best responses when the opponent mixes 50/50). Iterated elimination operates on pure strategies only—it removes dominated *pure* strategies but does not output mixed strategies directly. The surviving set is the set of pure strategies that are not strictly dominated, which, for a mixed strategy equilibrium, includes all pure strategies in the support of the equilibrium. Thus, for Matching Pennies, both Heads and Tails survive for each player because neither is strictly dominated.  
     - **Rationalizability allows for diverse beliefs, not just equilibrium beliefs.** Survival in iterated elimination requires only that a pure strategy is a best response to *some* belief about the opponent, not necessarily the correct equilibrium belief. In Matching Pennies:  
       - Heads for Player 1 is a best response if Player 1 believes Player 2 will play Heads with certainty.  
       - Tails for Player 1 is a best response if Player 1 believes Player 2 will play Tails with certainty.  
       Similarly for Player 2. These beliefs are consistent (rationalizable) but incorrect unless the opponent plays pure strategies. The equilibrium belief (50/50) makes both pure strategies equally good, but other beliefs rationalize each pure strategy independently. The hierarchy of beliefs does not "collapse" to the equilibrium belief; multiple beliefs coexist, supporting multiple pure strategies.  
     
     Consequently, iterated elimination terminates with the full set of rationalizable pure strategies, which for Matching Pennies (and any game with a mixed strategy equilibrium) includes multiple strategies per player. It does not reduce to a single strategy unless the Nash equilibrium is pure and degenerate.

  4. **Your Check: Matching Pennies fails the prediction.**  
     You use Matching Pennies as a test case, expecting iterated elimination to reduce it to one strategy per player. However:  
     - No strategy is strictly dominated:  
       - If Player 2 plays Heads, Player 1's best response is Heads (payoff 1 vs. -1 for Tails).  
       - If Player 2 plays Tails, Player 1's best response is Tails (payoff 1 vs. -1 for Heads).  
       Similarly for Player 2. Since each pure strategy is a best response to some pure strategy of the opponent, none are strictly dominated, and iterated elimination leaves all strategies untouched.  
     - The unique Nash equilibrium requires both pure strategies to survive because players randomize. Reducing to one strategy per player would eliminate the equilibrium entirely, which contradicts the fact that Nash equilibria are always contained in the rationalizable set.

  ### Why the Reasoning Cannot Be Repaired
  - **Core Misunderstanding:** The flaw is not a minor oversight but a fundamental misconception about what iterated elimination achieves. It does not output equilibrium profiles or mixed strategies; it outputs the set of rationalizable *pure* strategies. For unique Nash equilibria:  
    - If the equilibrium is pure, iterated elimination *may* converge to it (if the game is dominance-solvable), but this is not guaranteed for all games.  
    - If the equilibrium is mixed, iterated elimination *always* leaves multiple pure strategies (the support), as these are all rationalizable. Assuming it reduces to one strategy per player ignores the role of mixing.  
  - **No Small Patch:** This cannot be fixed with a tweak because the error lies in the expectation that beliefs "collapse" uniquely to equilibrium beliefs. In reality, rationalizability permits a range of beliefs, and for mixed strategies, multiple pure strategies are best responses to different (incorrect) beliefs. Iterated elimination preserves this diversity.  
  - **Broader Picture:** Iterated elimination is a tool for refining the set of possible outcomes by removing "irrational" strategies, but it does not imply convergence to Nash equilibrium unless additional structure (like dominance-solvability) is present. In games like Matching Pennies, rationalizability and Nash equilibrium coexist without elimination occurring.

  ### Conclusion
  Your argument fails at the inference that iterated elimination must terminate with exactly one strategy per player for a unique Nash equilibrium. This is incorrect for mixed strategy equilibria, as demonstrated by Matching Pennies, where no strategies are eliminated. The procedure leaves all pure strategies intact because they are all rationalizable, and the unique Nash equilibrium relies on this full support. The lesson is that iterated elimination identifies rationalizable strategies, not equilibrium profiles, and for mixed strategies, multiple pure strategies survive. Your TA is correct that Matching Pennies is untouched, and the reasoning rests on a mistaken view of how iterated elimination relates to mixed equilibria. To avoid this pitfall, remember that:  
  - Iterated elimination removes strictly dominated pure strategies (those never best responses).  
  - In mixed strategy Nash equilibria, all pure strategies in the support are best responses to the equilibrium belief and other beliefs, so they survive.  
  - "Consistent hierarchy of beliefs" does not imply uniqueness; it allows for multiple rationalizable outcomes even with a unique Nash equilibrium.
