prompt: |-
  I'm a novelist, and my current book is about two sisters in their seventies who've shared a house for forty-five years — one nursed the other thru cancer, they pool their finances, they're each other's next of kin in every way that matters. A lawyer friend told me that if they were a couple, they'd get the whole marriage package: survivor's pension, inhertiance tax breaks, hospital next-of-kin rights. As sisters they get none of it, and no contract fully replicates it. So here's what I keep circling and can't land: now that same-sex marriage is legal in a lot of places, the old "marriage exists for procreation" answer is officially dead. So what does marriage law, as it actually stands, implicitly presuppose the institution is FOR? I can think of candidates — a state-certified romance, a caregiving pact, chosen kinship — but each gives me a different plot for the sisters, honestly. If it's about care, the sisters seem robbed; if it's about romance, the state is in the business of blessing love affairs, which is strange; if it's about chosen family, why exactly two, and why not the sisters? Tell me which theory the legal package really presupposes (as opposed to merely fits), where the pieces are inconsistent, and what the sisters' case exposes that the same-sex marriage debate didn't. No citations or case law, I just want the conceptual structure. At the very end, give me a one-line answer in the form \answer{...} — three or four words naming the theory of marriage's purpose the law actually operates on. That goes in my notebook.
reasoning: |-
  Okay, the user is a novelist working on a story about two elderly sisters who've built a life together but lack legal protections because they're not married. They're wrestling with what marriage law fundamentally represents now that the "procreation" argument is outdated. 

  Hmm, this is fascinating. The core tension is between the sisters' lived reality (which fulfills many marital functions like caregiving and economic interdependence) and the legal system's exclusion of them. The user wants to understand the unspoken premise behind modern marriage law—not just what it accommodates, but what it presupposes. 

  Let me unpack their options. The "romance" theory feels weak—marriage licenses don't require proof of love, and divorce exists. The "care pact" theory fits the sisters but doesn't explain why blood relatives are excluded. "Chosen kinship" is closer but still doesn't capture why marriage is exclusive to pairs. 

  *Pacing while thinking* Ah—the key might be in what marriage uniquely regulates that other relationships don't. It's about codifying mutual life-building: the legal merging of two autonomous adults into an interdependent unit where the state can efficiently assign rights/responsibilities. Romance is culturally associated but not legally required; care is an outcome but not the core. 

  The sisters' case exposes something raw: our laws still privilege one specific structure (the conjugal pair) as the "default setting" for interdependence, regardless of whether other relationships perform identical functions. Same-sex marriage expanded access to that structure without challenging its exclusivity. 

  For the one-line answer... It has to capture that marriage law treats spouses as a single social/economic unit. "Mutually exclusive life merger"? Too clunky. "Codified dyadic fusion"? Pretentious. "Default life-partner contract"—yes, that's it: the state recognizes a primary lifelong partnership. 

  *Pausing* The user's frustration is palpable. Their sisters embody the values marriage claims to protect—loyalty, care, sacrifice—yet remain legally invisible. That dissonance is the story's engine. The answer shouldn't just be academic; it should resonate with their characters' ache for recognition. 

  Final thought: The sisters' plight whispers a deeper question—why must we contort relationships to fit legal boxes? But that's a sequel novel...
answer: |-
  Here's the conceptual breakdown:

  1.  **The Legal Package's Core Function:** Marriage law primarily creates a **legally privileged partnership framework for two adults.** Its core purpose, as reflected in the specific benefits (inheritance, pensions, medical access, tax breaks), is to:
      *   **Simplify and secure the transfer of assets and responsibilities** between two people deeply intertwined economically and personally.
      *   **Designate a single, unambiguous "default person"** for critical life decisions (medical, death) and economic support/succession when one partner is incapacitated or dies.
      *   **Recognize and support long-term, exclusive mutual interdependence** as a socially and economically stabilizing unit, distinct from other familial bonds.

  2.  **What It Presupposes (The Unspoken Theory):** The law implicitly presupposes that marriage is for establishing a **primary, exclusive, lifelong legal and economic union** between two adults. It's not fundamentally *about*:
      *   **Romance/Love:** While culturally linked, the state doesn't verify or require love. Loveless marriages are legally valid; deep romantic love outside marriage gets no automatic legal package.
      *   **Caregiving:** While spouses often care for each other, the law doesn't mandate it. Sisters providing identical care get no automatic rights. Care is an *expected outcome* of the union, not its legal *purpose*.
      *   **Procreation:** Officially obsolete as a legal requirement/justification.
      *   **Chosen Kinship:** While chosen, marriage is a *specific, exclusive form* of kinship the law privileges *over* other chosen kin bonds (like the sisters). It presupposes this *particular* bond warrants unique legal scaffolding.

  3.  **Inconsistencies & Tensions:**
      *   **Exclusivity of the Pair:** Why *only* two? Why not a trio of lifelong interdependent friends? The law presupposes the dyad as the fundamental unit for this level of legal merger.
      *   **Exclusion of Non-Conjugal Bonds:** It presupposes that the *conjugal* aspect (historically tied to sexual/romantic partnership, even if not explicitly required now) is the *only* type of deep adult interdependence deserving this full package. Blood relatives or deep platonic bonds fulfilling *identical* functions are excluded solely because they lack this conjugal element.
      *   **Lifelong Expectation:** While divorce exists, the package (especially survivor benefits) presupposes the *intention* and *likelihood* of permanence, treating the union as a continuous whole.

  4.  **What the Sisters' Case Exposes (Beyond Same-Sex Marriage):**
      *   Same-sex marriage successfully argued: *"Our relationships are identical in function (love, commitment, interdependence) to different-sex marriages, so exclusion is discrimination."* It expanded access to the *existing structure*.
      *   The sisters expose: **"The existing structure itself is fundamentally arbitrary in its *exclusion* of other relationships that perform the *exact same core social and economic functions* that marriage law exists to support."**
      *   They reveal the **persistent primacy of the conjugal/romantic dyad** as the *only* legally recognized form of ultimate adult interdependence, even when other bonds are functionally identical or superior in care and commitment. The law privileges a *type of relationship* (conjugal pair) over the *functions* (care, interdependence, economic unity) it claims to support.

  **The One-Line Answer:**

  \answer{Legally Privileged Adult Dyad}
