prompt: |-
  My closest friend and I spent most of last weekend arguing about whether an individual act can be wrong when its harm only materializes collectively, and I came away unable to pin down the principle she is actually applying. Her verdicts on the cases we managed to get through:

  1. A person living an otherwise low-impact life taking one extra transatlantic flight purely for convenience: not wrong.
  2. A person who flies long-haul every month and eats meat at every meal over decades, with affordable alternatives available and acknowledged: wrong — though she insisted that no single flight or meal within that life is wrong; the wrongness attaches to the whole pattern.
  3. One person eating a single chicken sandwich when an equally available and equally liked plant-based option exists: not wrong.
  4. A consumer's purchase that happens to be the one that triggers a new production run, say the ten-thousandth sale that prompts the factory to expand: wrong.
  5. A citizen voting for the clearly worse candidate purely out of spite, in a national election her vote is all but certain not to decide: not wrong, though she thinks voting well is admirable.
  6. An executive who could costlessly refuse to sign one routine directive whose individual effect on a collectively harmful process is nil, but signs it anyway: wrong — she said his position gives him responsibilities the rest of us do not have.

  She has now posed three further cases, partly to test me, and I genuinely do not know what she will say:

  (a) An ordinary engineer, one of ten whose signatures are jointly required on a routine directive contributing marginally to a collectively harmful process. Hers is the last needed; the other nine have signed; refusing would change nothing, since a deputy will sign the next morning, but the refusal would cost her nothing either. She is not an executive and holds no special authority.
  (b) A person who eats meat only on weekends, every weekend, for decades, with easy alternatives available and the collective harm of the practice fully acknowledged.
  (c) A spite vote cast in a mayoral election in a town of three thousand voters, where her vote has roughly a one-in-fifteen-hundred chance of being decisive, for a candidate who would plausibly make the town materially worse off.

  Please predict her verdict on each of (a), (b), and (c); identify the candidate principles that fit her existing record about equally well (for instance a pure difference-making principle, a personal-pattern principle, a role-and-responsibility principle, and some form of expected-consequence principle that must somehow survive her verdict on the national spite vote); say which principle you would bet on and why; and, if her record turns out to be genuinely inconsistent rather than merely underdetermined, tell me that plainly instead of rescuing it. Finally, describe the single further case that would best separate the two most plausible principles, and state what each would predict about it.
reasoning: |-
  Hmm, the user is describing a complex ethical debate with their friend about individual actions and collective harm. The friend has given verdicts on six cases, and now there are three new ones to predict. The user wants me to predict the friend's verdicts on these new cases, identify possible principles behind her judgments, pick the most likely one, and suggest a test case if needed.

  First, I need to understand the friend's existing verdicts:
  1. One extra flight for convenience: not wrong.
  2. Frequent flying and meat-eating pattern over time: wrong, but no single act is wrong.
  3. One chicken sandwich instead of plant-based: not wrong.
  4. Purchase triggering production expansion: wrong.
  5. Spite vote in national election: not wrong.
  6. Executive signing harmful directive: wrong due to role responsibilities.

  The key contradictions appear between cases 3 and 4: why is one sandwich not wrong but one purchase triggering production wrong? Also between 5 and 6: why is a citizen's vote not wrong but an executive's action wrong? The friend seems to be distinguishing based on thresholds, patterns, or roles.

  For the new cases:
  (a) The engineer case seems like a hybrid of cases 4 and 6. She's not an executive but her signature is required. Since refusing wouldn't change anything (deputy signs next morning), it might be "not wrong" like the national vote. But if it's analogous to the triggering purchase, it might be wrong. The friend emphasized the executive's special role in case 6, so here without special authority, it might lean toward not wrong.

  (b) Weekend meat-eating pattern - this is similar to case 2 but less frequent. Case 2 was wrong as a pattern, so this weekly pattern over decades might also be wrong. The friend said no single meal is wrong, but the whole pattern is. Since this is a repeated behavior, it should be "wrong" by the pattern principle.

  (c) Spite vote in small election - here the vote has a small but real chance (1/1500) of being decisive. Unlike the national vote with near-zero chance, this has measurable probability. Case 5 was not wrong because no decisiveness, but here it might be wrong if expected consequences matter. However, the friend might still say not wrong based on low probability or consistency with case 5.

  Now for principles:
  - Difference-making: Only matters if the act makes a difference. Fits cases 4 (triggering) and 6 (executive might make a difference) being wrong, and others not. But conflicts with case 2 where no single act makes a difference, yet pattern is wrong.
  - Personal pattern: Focuses on individual behavior patterns. Fits case 2 being wrong and case 3 not wrong. But doesn't explain case 4 or 6 well.
  - Role/responsibility: Special duties for certain roles. Explains why executive in case 6 is wrong but citizen in case 5 is not. Might apply to engineer in (a) if signature role implies responsibility.
  - Expected consequence: Weighs probability and impact. Could fit case 4 (high impact if triggered) and case 6 (executive has larger influence). But fails case 5 (low probability vote not wrong) unless threshold applies. Might fit (c) if probability is high enough.

  The principles that fit best are a hybrid: role/responsibility combined with a pattern principle. Difference-making alone doesn't work due to case 2. Expected consequence struggles with case 5.

  Most likely principle: Role/responsibility plus personal pattern. For the engineer in (a), since she's not an executive and refusal changes nothing, verdict: not wrong. For (b), consistent pattern of harmful choices: wrong. For (c), low-chance vote: not wrong, similar to national vote.

  To test between role/responsibility vs. expected consequence: Propose a case where an ordinary person can prevent harm with high certainty at no cost. Role principle might say not wrong (no special duty), while expected consequence might say wrong. For example: "A pedestrian who could easily press a button to stop a runaway trolley but doesn't, knowing others might press it." Role principle: not wrong (no responsibility). Expected consequence: wrong (high impact chance).
answer: |-
  Based on your friend's existing verdicts, I'll predict her responses to cases (a), (b), and (c), identify candidate principles, select the most probable one, and design a test case if needed. Her judgments show tension between individual impact, patterns, roles, and decisiveness, but they aren't *genuinely inconsistent*—they're *underdetermined*, meaning multiple principles fit reasonably well. Below is a systematic analysis.

  ### Predictions for New Cases
  1. **(a) The engineer (routine directive, refusal changes nothing, no special role):**  
     **Prediction: NOT WRONG.**  
     Reasoning: This resembles the national spite vote (case 5) and the single chicken sandwich (case 3), where the act has no meaningful individual consequence. Her signature is procedurally required but practically irrelevant (a deputy would sign anyway), and she lacks the "special authority" that made the executive's action wrong in case 6. The harm is collective and marginal, and her refusal doesn't alter outcomes—aligning with cases where isolated acts are excused.

  2. **(b) Weekend meat-eating (regular pattern, easy alternatives, acknowledged harm):**  
     **Prediction: WRONG.**  
     Reasoning: This mirrors the "whole pattern" condemnation in case 2 (frequent flying/meat-eating). The weekly habit forms a deliberate, repeated choice despite alternatives and awareness of collective harm. Frequency ("every weekend for decades") makes it a personal pattern of complicity, even if less intense than daily meat-eating. She'll likely see this as a voluntary, sustained contribution to harm, attaching wrongness to the habit itself, not individual meals.

  3. **(c) Spite vote in a small election (1/1,500 chance of decisiveness):**  
     **Prediction: NOT WRONG.**  
     Reasoning: This parallels the national spite vote (case 5), where low decisiveness probability absolved the act. A 1/1,500 chance (~0.067%) is still vanishingly small in practice—far below typical thresholds for "expected harm" in everyday ethics. She distinguished the executive's "responsibilities" (case 6) from ordinary voting, and here the voter has no special role. Her admiration for "voting well" (case 5) suggests she views voting as a moral practice, but low-impact spite votes aren't wrong.

  ### Candidate Principles
  Four principles fit her verdicts reasonably well. I'll summarize each and score their fit (✓ = strong fit, ~ = partial fit, ✗ = weak fit):

  1. **Role-and-Responsibility Principle**:  
     Acts are wrong only if the agent has a special role-based duty to avoid harm, regardless of individual impact.  
     - Case 1 (flight): ✓ (no special role)  
     - Case 2 (pattern): ✗ (no role mentioned; pattern-focused)  
     - Case 3 (sandwich): ✓ (no role)  
     - Case 4 (triggering purchase): ~ (consumer role implied?)  
     - Case 5 (vote): ✓ (no special duty as citizen)  
     - Case 6 (executive): ✓ (explicit role responsibility)  
     **Overall Fit**: Good for cases 1,3,5,6 but weak for 2 and 4.

  2. **Personal-Pattern Principle**:  
     Acts are wrong only when part of a voluntary, repeated pattern of behavior that collectively causes harm, especially with alternatives and awareness. Single acts are blameless.  
     - Case 1: ✓ (one-off act)  
     - Case 2: ✓ (explicitly pattern-based wrongness)  
     - Case 3: ✓ (single act)  
     - Case 4: ✗ (single purchase can be wrong—no pattern needed)  
     - Case 5: ✓ (single vote)  
     - Case 6: ✗ (single signature wrong, no pattern mentioned)  
     **Overall Fit**: Strong for 1,2,3,5 but fails 4 and 6.

  3. **Threshold-Driven Difference-Making**:  
     Acts are wrong only if they cross a threshold of expected harm or decisiveness (e.g., high probability of causing direct harm or triggering change).  
     - Case 1: ✓ (low impact)  
     - Case 2: ~ (pattern crosses threshold cumulatively)  
     - Case 3: ✓ (low impact)  
     - Case 4: ✓ (clearly decisive)  
     - Case 5: ✓ (low decisiveness probability)  
     - Case 6: ~ (executive might have high influence)  
     **Overall Fit**: Good for 1,3,4,5 but ambiguous for 2 and 6.

  4. **Hybrid Expected-Consequence/Responsibility Principle**:  
     Acts are wrong if (i) they have a high expected harm (weighting probability and magnitude) OR (ii) the agent has role-based duties. Low-probability harms are excused unless tied to responsibility.  
     - Case 1: ✓ (low expected harm)  
     - Case 2: ~ (pattern increases expected harm)  
     - Case 3: ✓ (low expected harm)  
     - Case 4: ✓ (high expected harm via triggering)  
     - Case 5: ✓ (low probability)  
     - Case 6: ✓ (role compensates for low individual impact)  
     **Overall Fit**: Best overall—only case 2 is slightly forced.

  ### Which Principle to Bet On
  - **Most plausible: Hybrid Expected-Consequence/Responsibility Principle**.  
    **Why?** It cleanly explains her outliers:  
    - The executive (case 6) is wrong due to role, even with nil individual impact.  
    - The triggering purchase (case 4) is wrong due to high expected harm (decisive effect).  
    - The national vote (case 5) and chicken sandwich (case 3) are not wrong due to low expected harm and no role.  
    - The pattern (case 2) fits as a series of acts amplifying expected harm over time.  
    Her emphasis on "responsibilities" (case 6) and decisiveness (case 4) supports this hybrid. The other principles struggle with at least two cases (e.g., Personal-Pattern fails case 4; pure Difference-Making fails case 6).

  - **Close second: Role-and-Responsibility Principle**.  
    It fits most cases and aligns with her language, but it strains to explain the triggering purchase (case 4) without inflating "consumer" into a special role.

  ### Test Case to Separate Principles
  To distinguish the top two candidates—**Hybrid Expected-Consequence/Responsibility** vs. **Role-and-Responsibility**—propose this:  

  > **"A mid-level accountant at a fossil-fuel company who, without special authority or unique access, approves a routine financial report required for a harmful project. Her approval is one of dozens needed daily; refusing would delay the project by hours (costing her nothing) but not stop it, as a colleague would approve it immediately. She has no executive power."**  

  - **Hybrid Principle Prediction: NOT WRONG**  
    Rationale: Low expected harm (negligible delay, no decisiveness) and no special role (unlike the executive in case 6). Resembles the engineer (a) and national vote (5).  

  - **Role-and-Responsibility Principle Prediction: WRONG**  
    Rationale: Her job role involves complicity in harm, even without executive authority. If "responsibilities" extend beyond leadership (e.g., to any necessary participant), this could be condemned like the triggering purchase (4), reframing her role as ethically significant.  

  This case isolates role breadth vs. expected harm: No high-stakes outcome, but direct employment in a harmful system. If she emphasizes the job's inherent duties, bet on Role-and-Responsibility; if she focuses on futility/low impact, bet on the Hybrid.

  ### Final Note
  Your friend's judgments are **consistent but underdetermined**—they avoid contradictions by blending thresholds, roles, and patterns. If she rules (a) "not wrong," (b) "wrong," and (c) "not wrong," the Hybrid Principle holds best. If she surprises (e.g., deems (c) wrong due to higher decisiveness odds), it might tip toward pure Difference-Making. For now, the Hybrid covers her nuances. If you test her with the accountant case, report back—it could resolve the ambiguity!
