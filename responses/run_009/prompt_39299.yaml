answer: |-
  ## The "Moral Saints" Quiz: What's Your Gut Say?

  **Instructions:** Forget philosophy terms for a minute! Read each short story and pick the answer that feels most true to *you* based on your gut reaction. There are no right or wrong answers – we’re just curious about your perspective. Answer honestly!

  1.  **Jamal's Choice:** Jamal is a talented college soccer player who loves the game. He learns that a local after-school program desperately needs volunteer tutors during his practice times to stay open. Jamal decides to quit the team entirely to tutor five days a week. He misses playing deeply, but the tutoring is making a real difference for the kids.
      *   **(A)** Jamal made the right call. Helping those kids is way more important than playing a game, even if he misses it.
      *   **(B)** Jamal did a good thing, but giving up something he loves that much feels like too big a sacrifice. Couldn't he find a way to do both?
      *   **(C)** Jamal's commitment is admirable, but I worry he might burn out or regret it later.

  2.  **Meeting Taylor:** You meet Taylor, who volunteers constantly, always donates the maximum, and never says an unkind word. But after talking for a while, Taylor seems... bland. No strong opinions, no quirky hobbies, no real sense of humor. Just pure, consistent niceness.
      *   **(A)** Taylor sounds like a truly good person. The world needs more people focused on doing the right thing like that.
      *   **(B)** Taylor seems kind, but honestly, they sound a bit boring. Being good shouldn't mean having no personality.
      *   **(C)** I respect Taylor's choices, but I wouldn't want to be like them. It feels like something important is missing.

  3.  **Dr. Evans:** Dr. Evans is a brilliant doctor who runs a free clinic in a very poor area. She works 80-hour weeks, lives in a tiny apartment next to the clinic, and has no close relationships or hobbies. She’s exhausted and lonely but saves countless lives every year.
      *   **(A)** Dr. Evans is a hero. The incredible good she does outweighs any personal cost to her own life.
      *   **(B)** Dr. Evans does amazing work, but her life seems tragically unbalanced and unhappy.
      *   **(C)** While Dr. Evans helps many, her own suffering makes me question if this is really the best way, even for the community in the long run.

  4.  **The Bone Marrow Match:** Two people, Chris and Alex, are both perfect matches for a stranger who needs a life-saving bone marrow donation. Donating is safe but involves significant short-term pain and disruption. Chris donates immediately, saying, "It hurts, but knowing I'm saving a life makes me genuinely happy." Alex also donates, but feels it's a huge, miserable burden and dreads the process, though they go through with it.
      *   **(A)** Both did the right thing equally. The action (saving a life) is what matters most.
      *   **(B)** Both did the right thing, but Chris's attitude makes the act *better* or more admirable.
      *   **(C)** Both did the right thing, but Alex's attitude makes me respect their sacrifice *more* because it was harder for them.

  5.  **The Brilliant Musician:** Maya is a world-class violinist. She practices intensely, tours constantly, and brings profound joy to thousands with her music. She’s generally kind and pays her taxes, but she doesn’t volunteer or donate much beyond the average person. Her life revolves around her art.
      *   **(A)** Maya is incredibly admirable. Her talent and the beauty she creates are hugely valuable, even if she's not a moral superstar.
      *   **(B)** Maya is talented, but her focus on her own art seems self-centered when she could be doing so much more good for others.
      *   **(C)** Maya is a great musician, but being a decent person is just the baseline. Her musical skill doesn't make her *more* morally admirable.

  6.  **The Extra Shift:** Maria is asked to cover a weekend shift for a coworker whose child is sick. Maria already works full-time and was planning a relaxing weekend hiking. She agrees to cover the shift.
      *   **(A)** Agreeing was clearly the right thing to do. Helping a coworker in need trumps personal relaxation.
      *   **(B)** Agreeing was good, but it was also okay if she had said no. Her own need for rest matters too.
      *   **(C)** It was nice of her, but not doing it wouldn't have been wrong. People need downtime.

  7.  **The Budget Cut:** A city faces a budget crisis. Option 1: Cut funding slightly across all parks, libraries, and community centers (slightly worse services for everyone). Option 2: Close *one* underused community center in a low-income neighborhood entirely to keep other services fully funded.
      *   **(A)** Option 2 is better. It minimizes the *overall* negative impact for the most people.
      *   **(B)** Option 1 is better. Cutting one vital service entirely in a vulnerable neighborhood is unfair, even if it's "less efficient."
      *   **(C)** Neither feels great, but Option 1 seems more fair by spreading the pain equally.

  8.  **The "Perfect" Roommate:** Your roommate, Jordan, is *always* considerate: cleans meticulously, is quiet when you study, pays bills on time, never eats your food. But Jordan also seems to have no real interests you know about, never wants to hang out or chat, and just studies or volunteers silently.
      *   **(A)** Jordan is the ideal roommate! Responsible and never causes problems. What more could you want?
      *   **(B)** Jordan is reliable, but living with them feels sterile and lonely. A good roommate should also be someone you can connect with.
      *   **(C)** Jordan does their duties, but their lack of engagement makes me wonder if they're okay. It feels a bit off.

  9.  **The Inherited Windfall:** Sam unexpectedly inherits $100,000. They could use it for a down payment on a modest home (stability they've never had) or donate it to a highly effective charity fighting malaria, estimated to save 10 lives.
      *   **(A)** Donating the money is the right thing to do. Saving multiple lives outweighs personal comfort.
      *   **(B)** Donating would be incredibly generous, but using it for a home is also perfectly reasonable and good.
      *   **(C)** Sam absolutely deserves to use that money for their own security and future. Donating it all would be going way above and beyond.

  10. **The Lifeguard:** Kai is a dedicated lifeguard at a busy beach. They are vigilant, physically fit, and have saved several lives. Kai spends their free time training and studying rescue techniques, rarely socializing. One day, someone drowns just outside Kai's zone while Kai was on break.
      *   **(A)** Kai is a hero for the lives saved. They couldn't be everywhere at once; this tragedy wasn't their fault.
      *   **(B)** Kai does great work, but their intense focus might be isolating. Maybe a slightly less rigid approach would be healthier and avoid burnout.
      *   **(C)** It's awful someone died, but Kai's duty only applied during their shift and in their zone. They bear no responsibility.

  ---

  ### Scoring Key & Interpretation

  **How it Works:** Tally your answers according to the table below. Each letter corresponds to a leaning towards a particular perspective on moral sainthood. The pattern of your answers will suggest your overall inclination. **Crucially, this quiz tries to separate two ideas: (1) Is sainthood GOOD FOR THE SAINT? and (2) Is sainthood GOOD FOR THE WORLD?**

  | Question | Answer A Leans Toward... | Answer B Leans Toward... | Answer C Leans Toward... |
  | :------- | :----------------------------------- | :------------------------------------ | :------------------------------------ |
  | 1        | Sainthood Good (World)           | Sainthood Costly (Personal)       | Sainthood Costly (Personal/World?) |
  | 2        | Sainthood Good (World)           | Sainthood Deficient (Personal)    | Sainthood Deficient (Personal)    |
  | 3        | Sainthood Good (World)           | Sainthood Costly (Personal)       | Sainthood Costly (Both?)          |
  | 4        | Focus on Action (World)          | Joy Matters (Personal)            | Effort Matters (Personal)         |
  | 5        | Non-Moral Excellence Valid      | Moral Max Better                  | Morality Undemanding               |
  | 6        | Moral Max                       | Threshold/Sufficient             | Morality Undemanding               |
  | 7        | Impersonal Optimization (World) | Fairness/Harm Avoidance          | Fairness/Equality                 |
  | 8        | Sainthood Good (World?)          | Sainthood Deficient (Personal)    | Sainthood Deficient (Personal)    |
  | 9        | Moral Max (World)               | Threshold/Sufficient             | Morality Undemanding               |
  | 10       | Sainthood Good (World)           | Sainthood Costly (Personal/World?) | Role Limits (Undemanding?)        |

  **Mapping Your Pattern to Views:**

  1.  **Mostly A's (Especially on 1,2,3,5A,7A,9A,10A): The Maximizing Idealist (Utilitarian Lean)**
      *   **What you think:** Being a moral saint *is* the best way to live, both for the world and, ultimately, for the person. Maximizing good consequences is the highest priority. Sacrifices for the greater good are not just justified but admirable. Non-moral excellence (like Maya's music, Q5) is valuable *because* it often contributes to overall good. Dr. Evans (Q3) is a hero, Jamal (Q1) did the right thing, and donating the inheritance (Q9) is clearly best. The world *would* be better with more saints, and striving for sainthood *is* good for the individual seeking a truly meaningful life.
      *   **Dimensions:** Sainthood Good for World? **YES.** Sainthood Good for Saint? **YES.**

  2.  **Mix of A's (especially on World-focused Qs: 1A,3A,7A,9A) AND B's/C's (especially on Personal-cost Qs: 1B/C, 2B/C, 3B/C, 4B/C, 8B/C): The Wolfian Critic (Susan Wolf's View)**
      *   **What you think:** Moral sainthood might be good *for the world* (more Jamals, Dr. Evans), but it comes at too high a personal cost *for the individual*. It leads to a life that's bland (Taylor, Q2), unbalanced, lacking in rich personal relationships, passions, and non-moral excellences (Maya, Q5). While moral actions are important, the *ideal of a good human life* includes more than just morality – things like art, friendship, humor, and personal projects. You likely see the joyful sacrifice (Chris, Q4) as better than the grudging one *for the person*, and think the roommate (Jordan, Q8) is reliable but lacking something crucial. The world might be better with saints, but it's *not* the best life *for a person* to aim for.
      *   **Dimensions:** Sainthood Good for World? **LIKELY YES (or at least better).** Sainthood Good for Saint? **NO.**

  3.  **Mostly B's (Especially on 1B, 3B, 5A, 6B, 8B, 9B): The Threshold Advocate**
      *   **What you think:** There's a level of "good enough" morality. Meeting core duties (being decent, helping sometimes like Maria Q6, using inheritance for a home Q9B) is essential. But *beyond* that threshold, constantly sacrificing your own interests, passions (Jamal Q1, hobbies), and well-being (Dr. Evans Q3) isn't necessarily better, and might even become counterproductive or make you less effective or likable (Taylor Q2, Jordan Q8). Non-moral excellence (Maya Q5) is valuable in itself. You likely think Jamal could have found a balance (Q1B) and that Maya is admirable without being a moral superstar. The world needs people to be decent, not necessarily saints.
      *   **Dimensions:** Sainthood Good for World? **NOT NECESSARILY (beyond threshold).** Sainthood Good for Saint? **NO (beyond threshold).**

  4.  **Strong C's (Especially on 1C, 3C, 5C, 6C, 8C, 9C, 10C) and B's: The "Morality is Undemanding" / Saints as Supererogatory**
      *   **What you think:** Basic morality (honesty, fairness, helping in clear emergencies like Kai Q10C, perhaps covering a shift sometimes Q6C) doesn't require massive life sacrifices. Giving up your core interests (Jamal Q1), donating huge sums (Sam Q9), or dedicating your entire life (Dr. Evans Q3) is going *far beyond* the call of duty – it's "supererogatory." While such acts are praiseworthy (admirable), they aren't morally *required*, and failing to do them isn't blameworthy. Being a merely decent person who pays their bills and is generally kind is perfectly fine. Maya (Q5) is admirable for her talent, not less moral for focusing on it. The world might be slightly better with saints, but it's unreasonable to expect or demand sainthood. Saints are exceptional, not the standard.
      *   **Dimensions:** Sainthood Good for World? **MAYBE SLIGHTLY.** Sainthood Good for Saint? **PROBABLY NOT (due to sacrifice).** Sainthood *Required*? **NO.**

  5.  **Strong A's on Q5 ("Non-Moral Excellence Valid") & Mix elsewhere: The Virtue Ethicist / Flourishing Ideal**
      *   **What you think:** The best human life involves developing a wide range of excellences – moral virtues (like kindness, fairness) *and* non-moral ones (like creativity, skill, friendship, intellectual curiosity). A life focused *only* on maximizing moral goodness (Taylor Q2, Jordan Q8) is stunted and misses key aspects of human flourishing. Maya (Q5A) embodies valuable non-moral excellence. Dr. Evans (Q3) does great good but her life lacks balance and key human goods. Jamal (Q1B) should ideally find a way to integrate his passion with helping. The ideal isn't sainthood or pure artistry, but a well-rounded life excelling in various domains. The *best* world likely has people flourishing in diverse ways, not just moral saints.
      *   **Dimensions:** Sainthood Good for World? **NOT AS THE SOLE IDEAL.** Sainthood Good for Saint? **NO (if it crowds out other goods).**

  **Important Notes on Limitations:**

  *   **Subtle Distinctions:** The quiz struggles to perfectly separate the **Threshold Advocate** and the **Virtue Ethicist/Flourishing Ideal**. Both reject maximizing morality as the sole ideal. The key difference often lies in *why*: Threshold focuses on "enough is enough," while Virtue Ethics emphasizes the *positive value* of diverse excellences. Look at Q5: A strong "A" suggests Virtue Ethics; a "B" or "C" might fit Threshold better. Your reaction to Maya is crucial here.
  *   **World vs. Saint Ambiguity:** Some questions (especially Q3, Q10) can be interpreted as relating to *either* the world or the saint. The scoring tries to guide this, but individual interpretations might blur the lines slightly.
  *   **The "Incoherent" Corner:** It's logically possible but philosophically unusual and arguably incoherent to think that being a moral saint is **GOOD for the SAINT** but **BAD for the WORLD** (e.g., "Saints are happy but their sacrifices somehow make things worse overall?"). This combination is unlikely to emerge clearly. If you somehow got this pattern, it might reflect a unique perspective or perhaps confusion on specific questions.
  *   **The "Unattractive" Corner:** Thinking sainthood is **BAD for the SAINT** and also **BAD for the WORLD** is possible but implies a deep cynicism about altruism or morality itself. While logically possible (e.g., "Saints are miserable martyrs whose sacrifices create dependency"), it's not a mainstream position identified in the literature on this topic. If this is your pattern, it suggests a very strong rejection of the value of extreme moral sacrifice on all fronts.

  This quiz gives a snapshot of your intuitions about the demandingness of morality and the value of a life focused solely on it. Discussing *why* you answered the way you did will be more revealing than any label! Have fun with the discussion in class!
