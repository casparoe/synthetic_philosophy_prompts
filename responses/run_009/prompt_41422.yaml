  go through these five and tell me whether they're jointly tenable. i suspect something has to give but i honestly can't see wich, so don't just list tensions -- tell me which ones are real, which only look real, and what the cheapest fix is and what it costs. and if you think i've misdescribed one of the views or that the whole setup is confused, say that straight out instead of politely auditing it.

