answer: |-
  Your diagnosis is profoundly insightful. The stall isn't an accident; it reveals a fundamental meta-semantic schism disguised as a debate about the nature of vagueness. Here's a breakdown based on your group's dynamics and the forced data points:

  1.  **The Forced-March Data: Where the Cracks Show**
      *   **Epistemicist View:** They see this as *confirmatory evidence of hidden sharp boundaries combined with human cognitive limitations*. The inconsistency ("never the same line twice") reflects our inability to *access* the precise boundary, not its absence. The "unpredictability" ("nowhere they'd have predicted") is precisely what ignorance *should* look like under pressure. The line drawn is a *guess*, potentially wrong, under forced choice.
      *   **Supervaluationist View:** They see this as *evidence against sharp boundaries and for the necessity of precisification*. The varying lines drawn under pressure represent *different legitimate ways of making the term precise* ("admissible precisifications") on the fly. The fact that speakers *can* draw *some* line pragmatically, but feel no commitment to it being *the* line, highlights the lack of a single fact of the matter. It's a *decision*, not a discovery.
      *   **Degree-Theorist View:** They see this as evidence of *gradience in judgment*. The inconsistency reflects the inherent *imprecision* and potential instability of assigning a specific degree value under pressure, or perhaps context-sensitivity. The line drawn is a *crisping* of a fuzzy boundary for practical purposes, forced by the binary choice format.
      *   **Fault Line:** The data is *compatible* with all three interpretations *precisely because* each theory embeds a different account of *what speakers are doing* when they make a forced judgment. The epistemicist sees guessing, the supervaluationist sees precisifying, the degree-theorist sees crisping. **This is the core verbal/meta-semantic disagreement:** What *kind* of act is a speaker performing when they utter "This is a heap" for a borderline case? Reporting a hidden fact? Making a local precisification? Assigning a partial truth value?

  2.  **Penumbral Connections: The Normative vs. Descriptive Tension**
      *   **Epistemicist View:** Principles like "No single case is both borderline and not borderline" or tolerance ("if borderline heap, then nearby cases too") are *constraints on the hidden boundary* enforced by meaning/convention. The boundary *must* lie within a region satisfying these constraints. Margin-for-error principles are *descriptive* of our epistemic situation regarding this hidden boundary.
      *   **Supervaluationist View:** These principles are *constitutive rules* defining what counts as an *admissible precisification*. They are *normative* constraints on how we *ought* to precisify the term consistently. "No case both B and not-B" is true *because* no admissible precisification allows it. Tolerance violations make a precisification inadmissible.
      *   **Degree-Theorist View:** These principles are enforced by *functional constraints* on the assignment of degrees. "No case both B and not-B" might be modeled by requiring a certain gap or steepness in the degree function. Tolerance is enforced by requiring the degree function to be continuous or nearly continuous. The connection is built into the *mathematical representation* of meaning.
      *   **Fault Line:** Here, the split between "descriptive linguistics" (Epistemicism) and "rational reconstruction" (Supervaluationism) is stark. The epistemicist sees these constraints as *facts about the language-world mapping*. The supervaluationist sees them as *rules of the language game*. The degree-theorist often leans towards a formal reconstruction capturing speaker dispositions. The *disagreement is about the status of these constraints:* Are they descriptions of inaccessible metaphysical facts, norms for concept use, or models of graded judgment?

  3.  **Higher-Order Vagueness: The Ad Hoc Stalemate**
      *   All theories struggle here because it exposes the core assumptions. Epistemicists need higher-order margins for error or meta-ignorance about the first-order boundary location. Supervaluationists need hierarchies of admissibility or vague "admissible". Degree theorists need vague boundaries between degrees of truth or meta-degrees. **The "ad hoc" feeling arises because each solution is essentially *bootstrapping their core mechanism one level up*.** This feels unsatisfying precisely because it doesn't resolve the fundamental meta-semantic question – it just replicates it at a higher level. If you weren't convinced by the core mechanism at first-order, its application at higher orders won't convince you.

  **Diagnosis: Substantive, Verbal, or Different Programs?**

  *   **Not Purely Verbal:** There is a substantive disagreement about the *metaphysics* of vague predicates (is there a sharp cutoff?) and the *psychology* of judgment (is forced-march line-drawing guessing, precisifying, or crisping?).
  *   **But Deeply Meta-Semantic/Programmatic:** The *intractability* stems from a **fundamental divergence in the goals and presuppositions of the semantic projects** each camp is engaged in:
      *   **Epistemicism:** Primarily a *metaphysical* project. Goal: Preserve classical logic/bivalence and a direct correspondence view of truth by locating vagueness in *epistemic limitations*. Assumes semantics describes mind-independent facts, even inaccessible ones.
      *   **Supervaluationism:** Primarily a *logical/normative* project. Goal: Preserve classical logic *globally* while accommodating local indeterminacy through precisification. Assumes semantics involves norms for concept application and rational reconstruction of communal practice.
      *   **Degree Theory:** Primarily a *descriptive/formal modeling* project. Goal: Develop a formal system that accurately models the *graded nature* of speaker judgments and the non-categorical nature of borderline cases. Assumes truth comes in degrees reflecting partial applicability.
  *   **Therefore:** It's **two (or three) distinct research programs answering different questions under the single heading of "vagueness semantics."** The epistemicist asks "What is the hidden truth?" The supervaluationist asks "What are the rules for consistent use?" The degree theorist asks "How can we formally model the observed gradience?"

  **Empirical Assumptions & Testability:**

  *   **Epistemicism:** Makes a *strong, testable empirical claim* about speaker behavior: **Forced-march line-drawing is fundamentally random with respect to the true boundary (within the penumbra).** Predictions:
      *   Lines drawn under identical conditions (same subject, same sequence, same day?) should be *maximally unstable* – pure noise within a broad penumbral region.
      *   There should be *no systematic contextual influence* on the line drawn beyond defining the broad penumbra (contradicting many findings).
      *   *Test it:* Rigorous forced-march experiments tracking individual consistency *across multiple identical sessions*. Does the line drift randomly within a wide band, or show patterns/stability? Investigate contextual priming effects – can you *systematically shift* the line drawn via subtle cues? Epistemicism predicts strong resistance to such shifting within the penumbra.
  *   **Supervaluationism:** Assumes that competent speakers *recognize the legitimacy of multiple precisifications*. **Prediction:** Speakers should readily *accept* that others might draw a different line in a forced-march without judging them *wrong*, merely as having made a different *reasonable choice*. It predicts a certain *normative tolerance* for variation.
      *   *Test it:* Post-forced-march interviews. Do subjects view their own drawn line as *the* correct one (epistemicist-leaning) or as *a* reasonable one among others (supervaluationist-leaning)? Do they judge others' different lines as *mistakes* or *different valid choices*?
  *   **Degree Theory:** Assumes judgments are fundamentally *graded and potentially unstable*. **Prediction:** When allowed non-binary responses (e.g., confidence ratings, "heapiness" scales), responses will show *graded structure* and potentially *more stability* than the binary forced-march lines imply. The instability in forced-march is an artifact of forcing a binary choice on a gradient.
      *   *Test it:* Compare forced-march line consistency with graded judgment tasks (scales, confidence ratings) on the same sequence. Do graded judgments reveal underlying stability masked by the binary task? Is the *variability* in forced-march lines predictable from the *gradedness* of independent judgments?

  **Can There Be Progress? Towards What?**

  *   **Conceptual Distinction:** Clarifying the *meta-semantic commitments* explicitly could be progress. Framing the debate as "Descriptive Metaphysics vs. Normative Reconstruction vs. Formal Modeling of Gradience" might allow you to map disagreements more cleanly. Acknowledge you're answering different questions.
  *   **Experimental Work:** **This is the most promising path for breaking the *empirical* deadlock, particularly regarding the forced-march data.** Testing the specific predictions outlined above (individual consistency, contextual shift, normative attitudes, correlation with graded judgments) could *falsify* core assumptions of one or more positions, particularly Epistemicism's strong randomness claim or Degree Theory's stability-under-grading claim.
  *   **Formal Results (Higher-Order):** While valuable (e.g., showing certain higher-order models collapse into sharp boundaries or are inconsistent), they are unlikely to resolve the core meta-semantic divide. Each camp can likely tweak their formalism to avoid incoherence, often at the cost of increased complexity, reinforcing the "ad hoc" feeling. The problem is foundational.
  *   **Permanent Pluralism?** **Likely, but with better understanding.** Vagueness seems to touch on deep issues about language, mind, and reality that resist a single, unified explanation. The different approaches capture *different important aspects*:
      *   Epistemicism: The intuition of bivalence and the "factuality" of many vague statements.
      *   Supervaluationism: The normativity of language use and the tolerance principle.
      *   Degree Theory: The phenomenology of graded judgment and borderline cases.
  *   **Why Pluralism?** Because the question "What is semantics for?" has no single, universally accepted answer. The phenomenon of vagueness exposes this underlying philosophical divergence. Progress might mean understanding *which* approach best answers *which* set of questions or explains *which* aspect of the data, rather than seeking a single victor.

  **Conclusion:**

  Your group is stalled because you're engaged in **three distinct, incompatible research programs** (Descriptive Metaphysics, Normative Reconstruction, Formal Modeling of Gradience) disguised as a debate about a single phenomenon. The forced-march and penumbral connection debates highlight this: you agree on *what happens* but radically disagree on *what it means*, because you disagree on what semantic facts *are* and how semantics relates to speaker behavior. **Epistemicism, in particular, makes a strong, falsifiable empirical claim about the randomness of forced-march judgments.** Designing experiments to test this claim (individual consistency, contextual influence) and the predictions of the other views (normative tolerance, stability under grading) is the most concrete path forward to potentially shift the debate. Otherwise, clarifying the meta-semantic foundations and accepting a form of constrained pluralism might be the most honest outcome. The stall isn't failure; it's a sign you've hit the bedrock of philosophical disagreement.
