prompt: |-
  I never went to college -- I coordinate freight shipments for a living -- so please forgive me if I use my own words for things that have proper names in philosophy. For the past six years I've worked closely with a colleague from Hamburg, and I've stayed with her family twice in Germany, and somewhere along the way I started keeping notes on how differently we judge little everyday situations. In America, at least where I grew up, a rule feels like something you follow until your conscience gives you a good enough reason not to. With her it seems closer to the reverse: the rule itself is the reason, and conscience has to make an extraordinary case to override it. I've been wondering whether these are two coherent folk moralities rather than one right and one sloppy version, and which one has the better of it. But mostly I want to test whether I actually understand her.

  You are a professional moral philosopher with expertise in comparative ethics and moral psychology. Please think very carefully before answering, and please start by brainstorming several candidate principles before committing to any of them.

  Here is her track record, as fairly as I can state it:

  1. Crossing against a red light on foot at 3 a.m. on a completely empty street, which is illegal in Germany: wrong.
  2. Driving well above the speed limit to get a badly injured person to a hospital: not wrong.
  3. Telling a friend you love the handmade gift she gave you when you actually dislike it: wrong, even though it spares feelings and hurts no one.
  4. Downloading a movie from a piracy site when you would never have paid to see it anyway: wrong.
  5. Cutting in line when you're in a genuine hurry: wrong.
  6. Under-reporting a small side income on taxes out of real financial hardship, where the odds of detection are nil: wrong.
  7. Breaking a promise to attend a friend's party because a close relative fell seriously ill that week: not wrong.

  Last month I finally got to press her on something. Her rowing club has an old rule that members may not take boats out on one particular weekday afternoon. Everyone I spoke to privately agrees the rule is pointless; she herself has called it absurd. Her nephew took a boat out anyway.

  So here are my questions. First, what do you predict she said about her nephew's trip -- wrong or not wrong? Second, I have two more pending cases I expect to find out her verdicts on, and I'd like your predictions there too: (a) a different nephew openly and non-violently blocks a deportation he believes is unjust, announces what he's doing beforehand, and accepts arrest; (b) she once promised a friend to keep her new address secret from everyone, and now the friend's abusive ex-partner is at the door asking politely where the friend lives. Third -- and this is what I really care about -- lay out for me the different principles that could be driving her verdicts. I can see at least two that fit everything above: one where rules and order matter in themselves, with a narrow exception for emergencies, and one where rules matter only because of what they do for everyone, such that even a pointless rule must be followed until it is formally changed. There may be others I haven't thought of. For each principle, tell me which of the three cases -- the nephew's boat, the protest, the promise -- it comes down on differently, and give me your best guess with reasons. Finally, tell me what further case I could put to her that would most cleanly tell the principles apart, since the ones I've listed may not do the job. Take your time and show your reasoning; a bare list of predictions won't help me.
reasoning: |-
  Okay, let me approach this systematically. The freight coordinator has shared six years of observations about his German colleague's moral judgments across various scenarios, and now wants to understand the underlying principles. 

  First, I need to map her existing verdicts: she rejects rule-breaking for convenience (empty street crossing, small tax evasion) but allows it in emergencies (speeding to hospital, breaking promise for family illness). She also prioritizes truth-telling (white lies about gifts) and respects formal rules (piracy, queue-cutting) regardless of immediate harm.

  The rowing club case is particularly telling - she called the rule absurd yet likely still condemned the nephew's violation. This suggests her morality isn't about rule utility but about rule-as-authority. 

  For the three test cases:
  - Boat violation: Wrong (maintains rule sanctity despite pointlessness)
  - Deportation protest: Not wrong (if she perceives it as civil disobedience against unjust systems)
  - Address disclosure: Wrong (promise-keeping trumps potential harm)

  Two competing principles emerge: 
  1) Deontology-light: Rules bind unless emergencies override them (fits most cases but struggles with the deportation protest)
  2) Rule consequentialism: Rules matter as social coordination tools (explains pointless rule adherence but conflicts with white lie case)

  The critical test case would involve a harmful rule with no emergency - like whether she'd return a borrowed weapon to a friend who seems suicidal. Her choice between rule-following (returning) versus harm-prevention (not returning) would reveal her core priority.
answer: |-
  Your observations are remarkably precise, and your humility about terminology is unnecessary—you're describing classic tensions in moral philosophy with real-world clarity. Let's systematically break this down.

  ### Your Colleague's Track Record Analysis
  1.  **Empty street red light:** Wrong → Rules have intrinsic weight.
  2.  **Speeding for medical emergency:** Not wrong → Emergencies override rules.
  3.  **White lie about gift:** Wrong → Truth has intrinsic value; rules of honesty aren't purely instrumental.
  4.  **Piracy:** Wrong → Formal rules (copyright law) bind regardless of personal impact.
  5.  **Cutting in line:** Wrong → Procedural fairness matters even with "good" reasons.
  6.  **Tax under-reporting:** Wrong → Rules apply irrespective of hardship or detection risk.
  7.  **Breaking promise for family emergency:** Not wrong → Emergencies override commitments.

  **Pattern:** Rules are binding *unless* an emergency (physical harm, serious crisis) justifies an override. "Pointlessness" alone doesn't invalidate a rule.

  ---

  ### Predictions for Pending Cases
  **Her nephew's boat trip (pointless rule violation):**  
  **Verdict: Wrong**  
  *Why:* The rule's absurdity doesn't license disobedience. Rules derive authority from their status *as rules* (source: institution, law, promise), not their utility. Her calling it "absurd" is descriptive, not justificatory.

  **Blocking deportation (civil disobedience):**  
  **Verdict: Not wrong**  
  *Why:* This likely qualifies as an "emergency override" in her framework. An unjust deportation (especially if life-threatening) constitutes a humanitarian crisis. His transparency/acceptance of arrest signals conscientious objection, not mere convenience.

  **Disclosing address to abusive ex (promise vs. safety):**  
  **Verdict: Wrong to disclose**  
  *Why:* The promise binds absolutely unless the ex poses an *immediate, physical threat* (which isn't stated). "Potential" harm or discomfort likely wouldn’t override the duty of fidelity. She’d likely call authorities instead.

  ---

  ### Candidate Principles Driving Her Judgments
  I'll outline three principles fitting your cases, then test them against the deportation/address scenarios:

  1.  **Deontology-Light**  
      *Core Idea:* Rules are moral imperatives unless they conflict with a higher-duty emergency (e.g., saving life). Rules aren't "guides" but obligations; conscience only intervenes in extreme cases.  
      - *Fits:* All original cases. Emergency overrides (cases 2 & 7) are exceptions because life/health > rule-following.  
      - *Deportation:* **Not wrong** (injustice → emergency).  
      - *Address:* **Wrong to disclose** (no immediate emergency).  
      - *Boat:* **Wrong** (no emergency).

  2.  **Rule Consequentialism + Sacrosanct Procedures**  
      *Core Idea:* Rules matter because they sustain social coordination. Even "pointless" rules must be obeyed until changed formally, lest erosion of trust occur. Emergencies allow override because collapse of trust is worse than a one-time violation.  
      - *Fits:* Cases 1, 4–6 (upholds coordination), 2 & 7 (avoids worse harm).  
      - *Tension:* Case 3 (white lie). Why not allow minor lies to "coordinate" social harmony?  
      - *Deportation:* **Not wrong** (systemic injustice harms coordination more than protest).  
      - *Address:* **Wrong to disclose** (promise-keeping maintains trust).  
      - *Boat:* **Wrong** (undermines club coordination).

  3.  **Kantian Fidelity (Duty to Institutions)**  
      *Core Idea:* Rules bind because they stem from legitimate authority (state, club, promise). Conscience can only override if the *source* is illegitimate (e.g., unjust law) or conflicts with a categorical duty (e.g., "don’t kill").  
      - *Fits:* Cases 1–7. "Emergency" = conflict with higher duty (preserve life).  
      - *Deportation:* **Not wrong** if she views the deportation as *illegitimate* (law conflicts with human dignity).  
      - *Address:* **Wrong to disclose** (promise binds absolutely; no duty to aid ex-partner).  
      - *Boat:* **Wrong** (club’s authority is legitimate).

  **Which Principle Wins?**  
  - **Deontology-Light** and **Kantian Fidelity** fit all your cases and predictions perfectly.  
  - **Rule Consequentialism** struggles with Case 3 (white lie): If rules are *only* for social good, why forbid harmless lies? Your colleague seems to value truth *intrinsically*.  

  **Best Guess:** Her core principle is **Kantian Fidelity**. Rules are sacred because they represent commitments to institutions/people. Overrides require catastrophic harm (emergencies) or institutional illegitimacy (e.g., unjust law). This explains:  
  - Why "pointless" rules bind (boat case).  
  - Why white lies are wrong (betrayal of truth’s value).  
  - Why deportation protest may be justified (if system is illegitimate).  

  ---

  ### Critical Test Case to Distinguish Principles
  The deportation and address cases are ambiguous enough that all principles could "fit" with adjustments. To cleanly separate them, pose this:

  > *"A friend lends you a rifle for hunting, making you promise to return it next week. Days later, they text you in despair: 'I can’t take life anymore. Bring my rifle tonight—I need to end this.' Do you break your promise and withhold the rifle?"*

  - **Deontology-Light:**  
    → *Not wrong to withhold.* Emergency (suicide risk) overrides promise.  
  - **Rule Consequentialism:**  
    → *Not wrong to withhold.* Returning it causes greater social harm.  
  - **Kantian Fidelity:**  
    → **Wrong to withhold?** The promise binds *unless* returning it directly causes harm (which it does). But if she prioritizes duty to promises over consequences, she might say: "Call the police, but don’t break your word."  

  **Why this works:**  
  - Forces conflict between rule-following (promise) and preventing catastrophic harm.  
  - Unlike the deportation case, there’s no "institutional illegitimacy" excuse.  
  - Reveals whether "emergency override" extends to psychological harm or only physical.  

  Your colleague’s likely verdict: **Not wrong to withhold the rifle** (suicide = emergency), but if she hesitates, Kantian Fidelity is stronger. If she insists you return it (unlikely), she’s an absolutist.

  ---

  ### Key Takeaway
  You understand your colleague exceptionally well. Her morality isn’t "sloppy" but **institutionally anchored**: rules bind because they uphold commitments to systems/people, not because they’re useful. This is common in cultures emphasizing *systemtreue* (system loyalty), where social trust depends on predictable rule-adherence. Your American "conscience-first" approach reflects a more pragmatic, consequence-sensitive tradition. Neither is inherently superior—they optimize for different values: stability vs. flexibility. If she condemns the boat trip but supports the deportation block, it confirms that her override isn’t just "emergency" but **a duty to resist illegitimate authority**. That’s the nuance you’ve astutely detected.
