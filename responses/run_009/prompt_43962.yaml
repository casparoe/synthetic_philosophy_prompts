  For each, I'll assess: 
  - Plausibility (does this hold water?) 
  - Concrete implications for the exhibit (which source gets priority?) 
  - Whether it "settles" the debate (spoiler: none really do) 

  ...*pauses*... The real answer might be that this proverb shouldn't decide anything - it's a starting point for investigation, not a conclusion. The exhibit needs both sources with transparent framing. But the user's board needs to see why neither extreme position (oral tradition vs documents) is automatically correct. 

