prompt: |-
  I've recently been appointed to the governance council of a mid-sized decentralized organization that is seriously weighing a transition to futarchy — Robin Hanson's scheme in which voting determines ends (which national-metric-style variable we maximize) while prediction markets determine means (which proposed policies are expected to raise the variable). We have roughly eight thousand token holders, a treasury of about forty million dollars, and a commitment from two market-making firms to provide liquidity if we go ahead. Before we commit, I've been asked to write a memo identifying which unresolved conceptual problems in futarchy most need to be settled, or at least stress-tested, for an organization of our size, and in what order we should tackle them. The engineering side is comparatively easy for us; it's the political economy and epistemology of the scheme that keeps me up at night.

  The obvious candidates keep circling back to a few clusters: the metric-selection problem (whatever variable we vote on becomes a target for Goodhart-style gaming, and our candidates — a synthetic index of token price, treasury growth, and some measure of ecosystem activity — each seem corruptible in different ways); the structure of conditional markets (policies whose effects take years to show up force us to resolve counterfactual questions like what the metric would have been had the rejected policy been adopted, and it's not clear anyone can be made to trade honestly under that resolution rule); and what I think of as the outside-the-market stakes problem — a whale whose fortune depends on the decision being adopted, not on the metric later being high, has an incentive to subsidize distorted prices purely to get the policy through, which arguably breaks the usual argument that manipulation is self-defeating because informed traders profit from it. There's also the worry that turnout on the values-vote will be so thin and so correlated with short-term token price preferences that the "vote on values" half quietly collapses into the same speculative dynamics we were trying to insulate policy from.

  Please give me a defended prioritization: which of these (or of open questions you think I've missed) is genuinely upstream of the others for a pilot at our scale, which are tractable through design choices we could actually make in the next six months rather than requiring decades of institutional experimentation, and which are overrated in the sense that we could run a small futarchic layer — say, markets that only veto or delay spending above a threshold, rather than setting policy outright — without solving them at all. I'd like your reasoning about the dependencies between the problems, not just a list: if, for instance, you think the counterfactual-resolution issue poisons everything downstream of it, say why, and tell me what evidence from the first year of the pilot would move an item up or down your list.
reasoning: |-
  Okay, the user is part of a governance council for a decentralized organization considering futarchy. They need a memo on unresolved conceptual problems to prioritize. Let me start by understanding their main concerns. They mentioned metric-selection, conditional markets, and whale manipulation. Also, low voter turnout corrupting the values vote.

  First, I should identify which issues are upstream. The metric problem seems fundamental. If the metric is gamed, the whole system fails. Goodhart's law is a real threat here. They’re thinking about a synthetic index, but each component can be manipulated. So solving or stress-testing this first makes sense because it affects everything else.

  Next, the whale manipulation issue. Even if the metric is good, a whale could distort markets to push a policy. The user is worried that manipulation isn't self-defeating here because the whale’s stake isn’t in the metric but in the policy passing. This breaks the usual efficiency of prediction markets. Need to see how this interacts with other problems. Maybe it's tractable with design choices like liquidity requirements or caps on influence.

  Then there's the conditional markets problem. Counterfactuals are tough, especially for long-term policies. But the user mentioned a pilot with limited scope, like veto power over spending. If the pilot avoids long-term policies, this might be manageable in the short term. So maybe it's less urgent initially.

  Voter turnout is another issue. If only short-term token holders vote, the values vote becomes skewed. But if the metric is robust, maybe this is secondary. Still, low turnout could delegitimize the process. Solutions like quadratic voting or delegation might help, but need testing.

  What about dependencies? If the metric is flawed, manipulation and counterfactuals become irrelevant because the system is already broken. Whale manipulation might require the metric to be somewhat stable first. Conditional markets depend on having a reliable metric and mechanisms to handle manipulation.

  Tractability is key. The user needs solutions in six months. For metric selection, running simulations or tournaments with historical data could help. Whale manipulation might be addressed through market design like stake limits and liquidity boosts. Conditional markets for short-term decisions in a pilot could delay tackling the harder aspects.

  Prioritization order: Metric first, then whale manipulation, then conditional markets. Voter turnout might be bundled with metric design. For the pilot, starting with a limited futarchy layer (like spending vetos) avoids the hardest parts of conditional markets and long-term counterfactuals.

  Evidence from the pilot: Year one should focus on metric resilience. Track if the metric correlates with real value or gets gamed. Whale behavior can be monitored via market liquidity and price distortions during proposals. Conditional markets can be tested with shorter time frames initially.

  Overrated issues? Conditional markets might not block a pilot if the scope is limited. Voter turnout could be mitigated by incentivizing participation, but it's not a showstopper early on.
answer: |-
  Here is a prioritized framework for tackling futarchy's conceptual problems in your mid-sized organization, emphasizing dependencies, tractability, and pilot design. The core insight: **Metric Integrity is the keystone vulnerability; without it, other mechanisms collapse. Whale manipulation and voter apathy are critical but potentially containable with design. Long-term counterfactuals are profound but deferrable in a limited pilot.**

  ### Prioritization & Reasoning
  1.  **The Metric-Selection Problem (Goodhart's Law Incarnate)**
      *   **Why Upstream & Critical:** *Everything* hinges on the metric. If it's gameable, prediction markets become efficient engines for maximizing a corrupted signal, not true value. Your proposed synthetic index (price + treasury + activity) is a prime target: token price can be pumped/dumped, treasury growth can be fueled by unsustainable token emissions, and "ecosystem activity" (e.g., transactions) is notoriously easy to fake (wash trading, sybil attacks). A bad metric poisons policy selection, incentivizes manipulation, and makes counterfactual resolution meaningless (resolving counterfactuals on a gamed metric is pointless).
      *   **Tractability (6-12 months):** High potential for progress through focused design and simulation.
          *   **Stress-Testing:** Run historical simulations: "What if this metric governed us 2 years ago?" Would it have selected disastrous proposals masked by short-term metric gains? Inject synthetic attacks (e.g., simulated wash trading) into historical data to see if the metric holds.
          *   **Design Choices:** Explore *robust aggregation*: Use ML models (trained on out-of-sample data) to detect and downweight suspicious activity in the index components. Consider *delayed metric components* (e.g., treasury growth measured over 24 months, not 3). Implement *metric audits* by independent, incentivized committees using off-chain data. **Pilot Feasibility:** Start with a simpler metric (e.g., just treasury value in a stablecoin, or a narrow, verifiable activity metric) for the initial limited scope (see below).
      *   **Pilot Evidence to Watch:** Correlation between metric movements and *verifiable, long-term health indicators* (developer retention, genuine user growth, security incidents). Emergence of obvious gaming patterns (spikes in metric components around proposal deadlines). Market efficiency: Do prices react meaningfully to news *truly* impacting long-term health, or just gaming signals?
      *   **Priority Shift:** If Year 1 shows consistent gaming despite safeguards, futarchy viability plummets. If the metric proves resilient and correlates with health, proceed.

  2.  **The Whale Manipulation / Outside-Market Stakes Problem**
      *   **Why Critical But Secondary to Metric:** Even a perfect metric is vulnerable if whales can profitably distort markets *to get a policy passed*, irrespective of the metric's later truth. This breaks the core "manipulation is unprofitable" assumption of efficient markets. Whales with large non-market stakes (e.g., a proposal granting them a lucrative contract) can subsidize losses in the prediction market to ensure their policy wins. This is distinct from typical pump-and-dump.
      *   **Dependencies:** Requires a *reasonably robust metric* to be meaningful. If the metric is easily gamed, manipulation is trivial. A strong metric forces manipulators to take larger, riskier bets.
      *   **Tractability (6-18 months):** Moderately high. Design can *significantly mitigate* but not perfectly eliminate risk.
          *   **Design Choices:**
              *   **Liquidity Requirements:** Leverage your MMs. Mandate deep liquidity *before* markets open (e.g., via bonds/commitments). High liquidity raises the cost of manipulation.
              *   **Stake Caps/Limits:** Limit the size of any single entity's position in a policy market relative to the total stake or their overall holdings. Implement progressive fees on large positions.
              *   **Identity/Reputation (Partial):** While antithetical to pure decentralization, consider Sybil-resistance for large traders in policy markets (e.g., KYC for wallets above a threshold stake). Alternatively, use quadratic funding/voting concepts *for subsidizing informative traders*.
              *   **Countervailing Incentives:** Create "truth-teller" roles or bounties specifically rewarded for exposing and profiting from manipulation attempts *during* the market period.
          *   **Pilot Feasibility:** Essential to address early. A limited pilot is still vulnerable to whale attacks if stakes are high.
      *   **Pilot Evidence to Watch:** Unexplained large flows into policy markets contradicting broader sentiment/analysis. Correlation between large trades and known beneficiaries of specific proposals. Effectiveness of liquidity in absorbing large orders without excessive price impact. Successful detection (or failure) of manipulation attempts.
      *   **Priority Shift:** If manipulation is frequent and costly to prevent, it severely undermines trust and efficiency. If mitigations hold, proceed. If the metric is strong enough, manipulation may become prohibitively expensive.

  3.  **Voter Apathy/Correlation in Values Voting**
      *   **Why Important But Contained:** Low turnout dominated by short-term speculators risks turning the "values vote" into a de facto market on token price, collapsing the separation of concerns. However, its impact is *filtered through the metric*. If the metric is robust and genuinely reflects long-term health (even if derived from short-term preferences), the damage is limited. It's primarily a legitimacy/participation crisis.
      *   **Dependencies:** Directly impacts the *quality of the metric*. A captured vote leads to a bad metric (Problem #1).
      *   **Tractability (6-12 months):** Moderate. Solutions involve governance incentives, not market mechanics.
          *   **Design Choices:**
              *   **Quadratic Voting/Funding for Metric Definition:** Encourage broader participation and reduce whale dominance in the values vote itself.
              *   **Delegation:** Allow token holders to delegate their "values vote" to trusted entities focused on long-term health.
              *   **Incentives:** Reward participation in values votes (e.g., small token grants, reputation).
              *   **Metric Stability:** Vote on the metric definition *infrequently* (e.g., annually) to reduce fatigue and gaming. Frame votes around core principles ("maximize sustainable ecosystem growth") rather than volatile indices.
          *   **Pilot Feasibility:** Can be implemented alongside the initial pilot. Start simple (delegation, basic incentives).
      *   **Pilot Evidence to Watch:** Voter turnout and demographics. Correlation between voter preferences and short-term price signals vs. stated long-term goals. Does the chosen metric feel legitimate to the broader community?
      *   **Priority Shift:** If turnout is catastrophically low or the metric is hijacked by a small group, it undermines legitimacy but may not immediately break policy selection if the metric itself is sound. Address through improved incentives/delegation.

  4.  **Conditional Markets & Long-Term Counterfactuals**
      *   **Why Profound But Deferrable:** This is the deepest theoretical problem. Markets struggle with long time horizons and unobservable counterfactuals ("What would the metric be *if* we did Policy B instead of Policy A?"). Resolving this fairly is crucial for evaluating policies with delayed effects. However, it's less *immediately* critical for a **limited pilot**.
      *   **Dependencies:** Requires a robust metric (#1) and resistance to manipulation (#2) to even begin being meaningful. Poor resolution rules create arbitrage opportunities for manipulators.
      *   **Tractability (Low in Short Term):** No silver bullet. Requires institutional innovation. Solutions like Schelling-point oracles, Kleros-style courts, or time-decayed metrics are experimental.
      *   **Design Choices for Pilot:**
          *   **Limit Scope:** This is key. **Defer long-term counterfactuals by restricting the pilot scope.** Focus markets on:
              *   **Veto/Approval:** Markets predict if a *specific, imminent proposal* (e.g., a grant, partnership, tech upgrade) will increase the metric over a *short, observable horizon* (e.g., 3-6 months). Avoid policies with effects >1 year.
              *   **Parameterization:** Markets choose *parameters* within a pre-approved strategy (e.g., "What % of treasury should go to grants vs. liquidity mining?"), not fundamental direction changes.
              *   **Threshold Triggers:** As you suggested, use markets only for large spending items (>$X) or major protocol changes.
          *   **Start Simple:** Use simple resolution rules (e.g., metric value at time T) for short-horizon decisions. Avoid complex counterfactuals initially.
          *   **Research Parallel:** Commission analysis on advanced resolution mechanisms (e.g., prediction markets *on* the counterfactual) for future phases.
      *   **Pilot Evidence to Watch:** Accuracy of market predictions for short-term outcomes. Emergence of disputes around resolution for borderline cases. Community trust in the resolution process.
      *   **Priority Shift:** As the organization matures and tackles longer-term strategies, this becomes paramount. Success in #1, #2, and #3 builds the foundation and trust needed to experiment with more complex counterfactual mechanisms later. **This is the "overrated" problem for the *pilot* – you can avoid its hardest aspects by limiting scope.**

  ### Recommendations for Your Pilot

  1.  **Start Narrow:** Implement a "Futarchy Veto" layer. Core governance remains (e.g., tokenholder votes or council), but *any proposal exceeding a treasury spend threshold (e.g., $500k) or altering core protocol parameters MUST pass a prediction market.* The market predicts: "Will [Metric] be higher Y days after implementation than it would be otherwise?" (Y = 3-6 months). Use a simple metric (e.g., treasury value in stablecoin + verified active users).
  2.  **Stress-Test the Metric Relentlessly:** Before launch, run intensive historical simulations and attack scenarios on your chosen pilot metric. Involve white-hat hackers to try to break it.
  3.  **Build Anti-Manipulation Defenses:** Enforce liquidity minimums via your MMs. Implement position size limits relative to market depth. Establish a clear, transparent process for investigating suspicious trading.
  4.  **Seed Values Participation:** Launch quadratic voting for an annual "Metric Principles" vote (e.g., weighting between treasury safety, user growth, developer growth). Allow delegation. Offer small participation rewards.
  5.  **Explicitly Defer Long-Term Counterfactuals:** Acknowledge this limitation. Only use markets for decisions where outcomes are expected within the observable horizon of the market itself. Document this constraint.

  ### Unresolved But Less Immediate for Pilot
  *   **Combinatorial Policy Space:** Markets struggle with complex bundles of proposals.
  *   **Epistemic Cascades/Information Aggregation Limits:** Can markets truly aggregate diverse knowledge effectively under all conditions?
  *   **Voter Rational Ignorance:** Does shifting policy to markets disincentivize tokenholders from understanding governance at all?
  *   **Legal/Regulatory Uncertainty:** Jurisdictional risks around prediction markets.

  **Conclusion:** Focus your pilot's first year on **building and validating a manipulation-resistant metric** and **containing whale influence** within a **limited scope that avoids long-term counterfactuals**. Success here provides the essential foundation and legitimacy to tackle the deeper, more complex problem of counterfactual resolution as your futarchy system matures and expands its scope. Prioritize simulations, anti-manipulation market design, and metric robustness testing above all else in the next 6 months.
