answer: |-
  ### Staking Procedure for the Syndicate

  Below is a step-by-step procedure to convert your estimated edges and odds into stakes, addressing fractional Kelly, correlated bets, exposure caps, and drawdown rules. The procedure explicitly separates settled mathematics from judgment calls and highlights where human intervention is required. We'll use **half-Kelly** as the baseline fraction (i.e., betting 50% of full Kelly) for balance between growth and safety, with adjustments for estimation noise and psychological comfort.

  ---

  ### **I. Core Procedure (Run Before Each Slate)**
  #### **Inputs**:
  - Current bankroll size ($B$).
  - List of bets with:
    - Decimal odds ($D$).
    - Your estimated probability of winning ($p_{\text{est}}$).
    - Event identifier (to group correlated bets, e.g., "NFL: KC vs BUF").
  - **Parameters** (calibrated for your syndicate):
    - Fractional Kelly multiplier: $k = 0.5$ (half-Kelly).
    - Per-bet cap: $5\%$ of bankroll.
    - Per-event cap: $8\%$ of bankroll (for correlated bets).
    - Slate cap: $20\%$ of bankroll (total exposure per weekend).
    - Drawdown pause threshold: $15\%$ loss from peak bankroll.

  #### **Steps**:
  1. **Calculate Estimated Edge**:
     - Edge $E = (p_{\text{est}} \times D) - 1$ (e.g., $p_{\text{est}} = 0.60$, $D = 2.00$ → $E = 0.20$).
     - Discard bets with $E \leq 0$ (no bet).

  2. **Compute Full Kelly Stake**:
     - Full Kelly fraction: $f_{\text{full}} = \frac{E}{D - 1}$.
     - Example: $E = 0.12$, $D = 2.20$ → $f_{\text{full}} = \frac{0.12}{1.20} = 0.10$ (10% of bankroll).

  3. **Apply Fractional Kelly ($k$) and Per-Bet Cap**:
     - Stake fraction: $f = \min(k \times f_{\text{full}},\  0.05)$.
     - With $k = 0.5$: $f = \min(0.5 \times 0.10, 0.05) = 0.05$ (5% of bankroll).
     - *Judgment*: $k = 0.5$ balances growth and safety (see *Reasoning* below).

  4. **Handle Correlated Bets**:
     - Group bets by **event** (e.g., same match, same tournament).
     - For each event, sum the $f$ values: $f_{\text{event}} = \sum f_i$.
     - Apply per-event cap: If $f_{\text{event}} > 0.08$, scale down all bets in the event proportionally to $\frac{0.08}{f_{\text{event}}}$.
     - *Judgment*: The $8\%$ cap and event grouping are heuristics for unknown correlations. Human input needed if bets span multiple games with shared drivers (e.g., weather).

  5. **Apply Slate Cap**:
     - Sum all $f$ values: $f_{\text{total}} = \sum f_i$.
     - If $f_{\text{total}} > 0.20$, scale down all stakes proportionally to $\frac{0.20}{f_{\text{total}}}$.

  6. **Convert to Dollar Stakes**:
     - Stake per bet $= f \times B$.

  7. **Drawdown Rule**:
     - If bankroll falls $\geq 15\%$ below its **peak value** (e.g., peak = $\$10k$, current ≤ $\$8.5k$), pause betting.
     - Re-estimate models, review edges, and confirm $k$ before resuming.

  ---

  ### **II. Fractional Kelly Reasoning**
  - **Why $k = 0.5$?**  
    - **Growth/Variance Tradeoff**:  
      - Full Kelly maximizes long-term growth but has high volatility (e.g., 13.5% risk of halving bankroll).  
      - Half-Kelly reduces volatility by ~50% and cuts growth by only ~25% ([Thorp, 2006](https://www.palmislandtraders.com/econ136/lecture/ThorpsKelly.pdf)).  
    - **Estimation Error**:  
      - If your edge uncertainty is high (e.g., noisy models), full Kelly risks ruin from overbetting. Half-Kelly provides a buffer.  
      - *Honesty*: For your syndicate, **$k = 0.5$ is 50% response to edge noise, 50% psychological comfort**.  
        You lack data to quantify edge error, so conservatism is pragmatic.  
    - **Values Choice**: The group must decide: *"Is maximizing growth worth a 13.5% risk of losing half our bankroll?"* If not, lower $k$.

  ---

  ### **III. Human Judgment Points**
  1. **Fractional Kelly ($k$)**:  
     - Choose $k$ based on **risk tolerance**, not math. Conservative syndicates use $k = 0.2$–$0.5$; aggressive ones use $k = 0.7$–$1.0$.  
     - *Procedure stops here*: This is a values decision. Revisit annually.
  2. **Edge Estimation**:  
     - If your model conflicts with market consensus (e.g., 12% edge on NFL), humans must sanity-check inputs.  
  3. **Event Grouping**:  
     - Define "event" (e.g., "all bets on World Cup final" vs. "all bets in World Cup"). Correlations are subjective.  
  4. **Caps**:  
     - Adjust per-bet ($5\%$), per-event ($8\%$), or slate ($20\%$) caps if stakes feel too large/small.

  ---

  ### **IV. Settled vs. Contested Mathematics**
  | **Settled Kelly Math** | **Contested Adjustments** |
  |------------------------|---------------------------|
  | - Full Kelly maximizes asymptotic growth rate for repeated bets with known edge (Kelly, 1956). | - **Fractional Kelly**: Rational for estimation error (MacLean et al., 2011) or psychological comfort? Purists call it "leaving money on the table"; pragmatists see ruin protection. |
  | - Formula: $f_{\text{full}} = \frac{pD - 1}{D - 1}$ for decimal odds $D$. | - **Correlated bets**: No closed-form solution. Heuristics (e.g., per-event caps) are ad hoc. Covariance-based methods are theoretically sound but impractical without data. |
  | - Properties: Zero risk of ruin if $f_{\text{full}} < 1$, but high volatility. | - **Caps**: Violates Kelly's assumptions but universally used. Is it prudent risk management or behavioral bias? |

  ---

  ### **V. Case Studies**
  #### **Case 1: Large Edge (12% on NFL Moneyline)**
  - **Inputs**:  
    $D = 2.20$ (implied prob. $45.5\%$), $p_{\text{est}} = 55.0\%$ → $E = (0.55 \times 2.20) - 1 = 0.12$.  
    $f_{\text{full}} = 0.12 / (2.20 - 1) = 0.10$.  
  - **Procedure**:  
    $f = \min(0.5 \times 0.10, 0.05) = 0.05$ (5% of bankroll).  
  - **Result**: Bet **5% of bankroll**.  
    - *Why less than gut?* Full Kelly suggests 10%, but half-Kelly + per-bet cap overrides. Protects from edge overestimation.

  #### **Case 2: Eight Bets, Five on Same Match**
  - **Inputs**:  
    - **Bet 1–5**: Same NFL game (e.g., KC vs BUF). $E = 0.06$, $D = 1.80$ → $f_{\text{full}} = 0.075$ each.  
      $f = \min(0.5 \times 0.075, 0.05) = 0.0375$ (3.75% each).  
    - **Bet 6–8**: Uncoupled events. $E = 0.04$, $D = 2.00$ → $f = \min(0.5 \times 0.04, 0.05) = 0.02$ (2% each).  
  - **Correlation Handling**:  
    - Event group (Bets 1–5): $f_{\text{event}} = 5 \times 0.0375 = 0.1875$ (18.75%).  
    - Per-event cap ($8\%$) → Scale factor = $0.08 / 0.1875 \approx 0.427$.  
    - New stake per same-game bet: $0.0375 \times 0.427 \approx 0.016$ (1.6% each).  
  - **Slate Cap**:  
    Total $f = (5 \times 0.016) + (3 \times 0.02) = 0.08 + 0.06 = 0.14$ (14% < 20% → no scaling).  
  - **Result**:  
    - Same-game bets: **1.6% of bankroll each**.  
    - Other bets: **2% of bankroll each**.  
    - *Why so low?* Correlation forces conservative exposure to one game.

  ---

  ### **VI. Final Notes**
  - **When It Feels Too Conservative**: The procedure will often bet less than your gut (e.g., large edges capped at 5%). This is intentional—it defends against overconfidence and black swans.  
  - **Review Quarterly**: Revisit $k$, caps, and edge models. If your bankroll grows, increase absolute stakes but keep fractions fixed.  
  - **Key References**:  
    - Kelly math: [Thorp (2006)](https://www.palmislandtraders.com/econ136/lecture/ThorpsKelly.pdf).  
    - Fractional Kelly debate: [MacLean et al. (2011)](https://www.jstor.org/stable/23071297).  

  This procedure systematizes your stakes while forcing explicit discussions about risk tolerance. Embrace the discomfort—it means the math is working.
