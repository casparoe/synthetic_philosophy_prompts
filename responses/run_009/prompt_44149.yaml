prompt: |-
  I sit on the discretionary grants committee of a small family foundation with an endowment of about $4 million, from which we award roughly $300,000 a year. Our docket this quarter includes two items, and we are deadlocked.

  The first is a routine application: $60,000 for a local food pantry with audited outcomes data, which our estimates suggest will meaningfully improve nutrition for a few thousand households over three years.

  The second is from Dr. H. Veldman, a retired aerospace engineer who has applied (and been tabled) three years running. He requests $180,000 to build and install a device he calls a metric-stabilizing lattice. By his own calculations the device has roughly a one-in-10^25 annual chance of preventing a decay of the metastable Higgs vacuum — an event that, should it occur, would destroy all life in our future light cone. He values the stakes at around 10^45 future person-lifetimes, so that his proposal's expected value, on his numbers, exceeds the pantry's by some twenty orders of magnitude. He adds, in an appendix, that the committee's refusal to fund him in prior years has been evidence in his favor: the vacuum has not yet decayed, which he takes to confirm his model, and he has adjusted his probability estimate upward each cycle accordingly.

  Our treasurer, who describes himself as a strict Bayesian, argues that declining the proposal is straightforwardly incoherent: if expected value is what we claim to maximize, we cannot let the sheer size of a number frighten us out of arithmetic. Three other members believe funding it would be a parody of philanthropy, but their objections so far amount to incredulous stares. One member has floated a compromise — funding it once, at a reduced amount, to make the problem go away — which strikes the rest of us as the worst of both worlds.

  There is also a structural worry we keep circling. Veldman's latest letter notes, correctly, that if we reject him on the grounds that his probability is too low, we are committed to a threshold rule; if we reject him on the grounds that his probability estimate is unreliable, he asks what our rule is for deciding which applicant-supplied probabilities to trust, given that our pantry's figures are also applicant-supplied; and if we simply refuse to engage, he observes that anyone who can name a sufficiently large number will then dominate our entire docket, and that we are one persuasive letter away from handing him the endowment.

  Please draft the decision memo I will circulate before our meeting. It should (a) make a clear recommendation on the Veldman application — fund, reject, or fund under stated conditions — and (b) propose a general policy for handling tiny-probability, astronomical-stakes proposals that the committee could adopt in writing and apply consistently to future applicants, not just to this one. The memo must engage the treasurer's expected-value argument on its merits rather than dismissing it, and give an honest accounting of the strongest consideration on whichever side it comes down against. In developing the policy, we would like you to examine the escape routes seriously and say where each buys its consistency at a price: refusing to act on probabilities below some threshold (and what happens to the innocent applications caught by it); discounting or penalizing applicant-claimed probabilities in proportion to the stakes claimed (and how one justifies the penalty without double-counting); bounding the foundation's social welfare function (and what that concedes about how much we ever really valued far-future lives); and treating the reliability of probability estimates themselves as part of the decision problem (including what to do about Veldman's habit of updating in his own favor on the vacuum's continued stability). Aim for roughly 1,100 words, in the register of a real committee memo: numbered recommendations, reasoning a dissenting member could recognize themselves in, and a bottom line we can vote on.
reasoning: |-
  Okay, let me approach this systematically. The user needs a decision memo that resolves a deadlock on funding an unusual grant proposal while establishing policy for future cases. 

  First, I need to understand the core tension: the treasurer's strict Bayesian expected value argument versus the intuitive absurdity of funding a 1-in-10^25 chance project. The memo must engage the expected value math seriously while addressing the practical and philosophical problems it creates.

  I consider the key challenges:
  - Veldman's three arguments about thresholds, reliability, and docket domination are substantive and require structured responses
  - The compromise proposal (partial funding) seems unworkable and needs explicit rejection
  - Any policy must prevent future applicants from gaming the system with large numbers

  The policy framework should evaluate four approaches:
  1. Probability thresholds: problematic because they're arbitrary and exclude legitimate small-scale interventions
  2. Stake-discounting: risks double-counting if we already distrust probabilities
  3. Welfare bounding: philosophically troubling as it devalues future lives
  4. Reliability weighting: most promising but requires handling Veldman's self-serving updates

  I realize reliability weighting addresses multiple concerns:
  - It doesn't reject high-stakes proposals categorically
  - It accounts for model credibility without arbitrary cutoffs
  - It handles Veldman's flawed "evidence" of non-catastrophe
  - The pantry's audited data naturally scores higher

  For the memo structure:
  - Start with clear recommendation against funding
  - Explain why expected value alone is insufficient
  - Present reliability-weighted EV as superior framework
  - Formalize the policy with scoring criteria
  - Show how it resolves Veldman's arguments
  - Include voting items for both decision and policy

  The tone must remain professional but accessible - no jargon without explanation. I'll make sure dissenting views (especially the treasurer's) are represented fairly in the reasoning. The word count requires concise yet thorough coverage of all elements.
answer: |-
  **MEMORANDUM**  
  TO: Discretionary Grants Committee  
  FROM: [Your Name], Committee Member  
  SUBJECT: Recommendation & Policy for Veldman Application and High-Stakes/Low-Probability Proposals  
  DATE: October 26, 2023  

  ---

  ### I. EXECUTIVE SUMMARY  
  After thorough analysis, I recommend **rejecting Dr. Veldman’s application** for $180,000 to build the "metric-stabilizing lattice." While the Treasurer’s expected-value (EV) argument is mathematically coherent under ideal assumptions, it relies on probability estimates of such extraordinary uncertainty that acting on them would compromise our fiduciary and philanthropic integrity. To resolve deadlocks fairly, I propose adopting a **Reliability-Weighted Expected Value (RWEV) framework**, requiring explicit scoring of probability robustness alongside stakes. This policy rejects arbitrary thresholds, avoids double-counting, and preserves our commitment to future lives while preventing unserious proposals from dominating the docket.  

  ---

  ### II. RECOMMENDATION: REJECT VELDMAN APPLICATION  
  **A. Decision:**  
  - Deny funding for Dr. Veldman’s metric-stabilizing lattice.  
  - Approve the $60,000 food pantry grant (unaffected by this policy).  

  **B. Reasoning:**  
  1. **The Treasurer’s EV Argument Is Logically Valid but Practically Inapplicable**  
     - If we accept Veldman’s inputs (P(catastrophe) ≈ 10⁻²⁵, stakes = 10⁴⁵ person-lives), the EV *is* ~10²⁰ person-lives saved per year, dwarfing the pantry’s impact. To dismiss this requires rejecting either the probability or the stakes.  
     - *However*, Veldman’s probability estimate suffers from **critical reliability flaws**:  
       - It is model-dependent, non-peer-reviewed, and untestable (no device can be validated at 10⁻²⁵ confidence).  
       - His annual "updating" (citing non-occurrence as evidence) commits the **absence-of-evidence fallacy**; non-events cannot confirm infinitesimal probabilities.  
       - The claimed probability is **smaller than any empirically validated physical constant** by orders of magnitude, rendering it epistemically indistinguishable from speculation.  

  2. **Funding Sets a Precedent That Invites Exploitation**  
     - As Veldman notes, accepting his logic implies that *any* applicant claiming stakes >10²⁵ lives and P(success) >10⁻²⁵ could demand our entire endowment. We lack a defensible method to distinguish his proposal from countless equally uncertain (but less physics-savvy) existential risk claims.  

  3. **The Compromise (Partial Funding) Fails Fiduciary Duty**  
     - Funding at a "reduced amount" (e.g., $10,000) wastes resources without meaningfully testing the device’s efficacy or altering the EV calculus. It rewards persistence over rigor.  

  ---

  ### III. PROPOSED POLICY: RELIABILITY-WEIGHTED EXPECTED VALUE (RWEV)  
  To handle high-stakes, low-probability proposals consistently, we adopt the following framework:  

  **A. Policy Statement:**  
  > All grant applications claiming expected value (EV) must undergo **dual assessment**:  
  > 1. Calculation of *nominal EV* (stakes × probability), per applicant’s inputs.  
  > 2. Assignment of a **Reliability Score (R)** to the probability estimate (0 ≤ R ≤ 1), reflecting empirical robustness, subject to committee vote.  
  >   
  > **Final RWEV = Nominal EV × R**  
  >   
  > Proposals with RWEV below the foundation’s cost-effectiveness benchmark (e.g., $100 per person-life improved) will be rejected. R scores must be justified in writing.  

  **B. Rationale for RWEV Over Alternatives:**  
  We evaluate escape routes raised by Veldman and the committee:  

  | Approach             | Consistency "Price"                                                                                                | RWEV Solution |  
  |----------------------|--------------------------------------------------------------------------------------------------------------------|--------------|  
  | **1. Probability Threshold** (e.g., reject if P < 10⁻¹⁰) | Arbitrary; excludes legitimate low-P/high-stakes interventions (e.g., asteroid detection). Penalizes small nonprofits with statistically robust but tiny-effect models. | **No threshold.** R-score discounts unreliability without excluding small P *a priori*. |  
  | **2. Stake-Based Discounting** (e.g., trust P less as stakes grow) | Double-counting: If stakes correlate with uncertainty, penalizing both P and stakes independently distorts EV. Risk of *ad hoc* adjustments. | **R-score isolates probability reliability.** Stakes are treated neutrally; only the *credibility* of P is scored. |  
  | **3. Bounded Welfare Function** (e.g., cap value of future lives) | Concedes we do not value large future populations linearly—contradicting our charter’s commitment to intergenerational equity. | **No cap on stakes.** High stakes amplify EV only when probabilities are reliable (high R). |  
  | **4. Reliability as Part of EV** (Implicit in RWEV) | Requires transparent scoring criteria to avoid subjectivity.                                                         | **Explicit R-score rubric** (below) ensures consistency. |  

  **C. Reliability Score (R) Rubric:**  
  R is assessed on a 4-factor scale (each 0–25 points; total R = score/100):  

  | Factor               | 25 pts (High R) | 0 pts (Low R) |  
  |----------------------|-------------------------------|------------------------------|  
  | **Empirical Testability** | Probability derived from replicated experiments or high-resolution data. | P based on untestable models or cosmic-scale extrapolations. |  
  | **Peer Consensus**   | Published in top journals; consensus from relevant experts. | No peer review; domain experts dispute methods. |  
  | **Model Transparency**| Full public access to data/code; uncertainty quantified. | Proprietary or opaque calculations. |  
  | **Track Record**     | Applicant has validated similar predictions. | History of unfalsifiable claims or self-serving updates. |  

  *Example Scores:*  
  - **Food Pantry:** P(impact) based on audited pilot data → **R ≈ 0.8–0.9**  
  - **Veldman:** Untestable model, no peer review, self-updating → **R ≈ 0.01–0.05**  
    - Thus, RWEV = (10²⁰ person-lives) × 0.01 ≈ 10¹⁸ lives.  
    - Even if nominal EV is accepted, **RWEV falls below our benchmark** ($180,000 / 10¹⁸ lives ≫ $100/life).  

  **D. Addressing Veldman’s Objections:**  
  1. *Threshold Rule?* RWEV uses no thresholds—only continuous reliability weighting.  
  2. *Why Trust Pantry’s P?* Audited data and replicable methods justify high R; Veldman’s do not.  
  3. *Docket Domination?* Low R-scores prevent high-stakes/low-reliability proposals from monopolizing funds.  

  ---

  ### IV. STRONGEST COUNTERARGUMENT: THE TREASURER’S BAYESIAN CHALLENGE  
  We acknowledge the Treasurer’s critique: *If we accept Veldman’s probability as plausible (however small), rejecting his proposal is mathematically inconsistent with maximizing EV.* This is true in a vacuum. However, **philanthropy does not operate in a vacuum**:  
  - **Fiduciary Duty:** We steward limited resources. Funding a proposal with R ≈ 0.01 would likely waste $180,000 that could save lives *today* via high-R interventions (e.g., the pantry).  
  - **Epistemic Responsibility:** When probability estimates are this speculative, "expected value" becomes a misnomer—it is **expected conjecture**. Multiplying a near-infinite stake by near-zero knowledge yields an indeterminate product.  
  - **The Odds Are Meaningless:** A 10⁻²⁵ probability implies we could fund Veldman every year for 10²⁵ years (vastly exceeding cosmic time) with no result. Meanwhile, the pantry’s impact is measurable within our grant cycle.  

  **Concession:** If Veldman’s device were testable at feasible cost (e.g., $10,000 for independent lab validation), funding that step *would* be coherent under RWEV. His current proposal fails this bar.  

  ---

  ### V. VOTING ITEMS  
  1. **Approve food pantry grant:** [ ] Yes [ ] No  
  2. **Reject Veldman application:** [ ] Yes [ ] No  
  3. **Adopt RWEV policy for future proposals:** [ ] Yes [ ] No  

  ---

  ### VI. CONCLUSION  
  The Veldman application forces us to choose between mathematical purity and pragmatic stewardship. The RWEV framework bridges this gap: it respects EV theory while demanding that probabilities be grounded in evidence, not imagination. By rejecting this proposal and adopting RWEV, we affirm that philanthropy must weight the *quality* of hope alongside its scale. The pantry feeds thousands; Veldman’s device, at best, eases a cosmic anxiety. We fund outcomes, not odds.  

  ---  
  **APPENDIX:** Draft RWEV Assessment Worksheet (for committee use).  
