prompt: |-
  I've been cataloguing my gut verdicts about which acts are above and beyond duty, and I'd like to know whether a single principle can capture them. Diving into a flooded river to save a stranger, at real risk to my own life: admirable, and surely not wrong to skip. Donating a kidney to a stranger in ordinary circumstances: the same. Giving up my bus seat to someone who is clearly struggling: somehow not admirable in that way — it feels merely required. Whistleblowing on my employer when it will end my career: here I genuinely waver, since it seems both heroic and something I owe the people being harmed. If I am the only compatible donor and the recipient will otherwise die, giving the kidney still seems above and beyond, yet declining now strikes me as wrong in a way it doesn't when other donors exist — the same act at the same cost, but my verdicts pull apart. And a related wrinkle: donating a kidney to buy a dying stranger a few extra months strikes me not as admirable but as mildly irrational, so it can't simply be that greater sacrifice means greater virtue. Is there a principle that fits all of this? I'd like it stated precisely, with the case that motivates each clause, an honest accounting of which of my verdicts it has to overturn and why, and its rulings on two cases I keep going back and forth on: an off-duty paramedic who happens upon a serious accident, and giving away 10% of one's income to effective charities. Finally, tell me what the principle predicts about a case I haven't listed — whether it turns out required, forbidden, supererogatory, or something else entirely.
reasoning: |-
  Okay, the user is trying to find a single ethical principle that explains their gut feelings about supererogation—acts that go "above and beyond" duty. They've listed several scenarios where their intuitions vary: diving into a flooded river to save a stranger is admirable but not required, while giving up a bus seat feels obligatory. Whistleblowing wavers between heroic and owed, and kidney donation depends on whether others are available. They also note that donating a kidney for just a few extra months seems irrational, not admirable, so sacrifice alone isn't the key.  

  Hmm, this is tricky. Their examples highlight how context changes moral weight—like when declining a kidney feels wrong only if you're the sole donor. The whistleblowing case is especially messy because it blends personal sacrifice with preventing harm to others. And the "irrational" kidney donation suggests outcomes matter, not just effort.  

  I need a principle that balances three things: (1) the cost to the agent, (2) the benefit to others, and (3) the agent's unique capacity to help. The flooded river case has high cost and high benefit, but since others *could* act (even if unlikely), skipping isn't wrong. The bus seat? Low cost, high benefit to someone struggling—so required. Kidney donation with alternatives: high cost, but others can step in, so optional. No alternatives? Then high cost + unique capacity tilts it toward obligation, even if still supererogatory in spirit.  

  The irrational kidney donation fails the benefit criterion—minimal gain doesn't justify high cost. For the paramedic case: low cost (professional skills), high benefit (life-saving), unique capacity (trained and on-scene)—so obligatory. Charity: moderate cost (10% income), high benefit if effective, but many others can donate, so it stays supererogatory.  

  The user might be wrestling with guilt over not doing "enough" or frustration when others skip basic duties. Underneath, they probably want moral clarity without rigidity—a framework that acknowledges nuance. My principle tries to honor that by making uniqueness pivotal: it explains why being the "only one who can help" shifts acts from optional to expected, even when costly.  

  Test case: A firefighter off-duty vs. a regular person at a fire. For the firefighter, high capacity + high stakes = duty. For the bystander? Supererogatory. Fits.  

  ... But is it *too* flexible? Maybe. But morality often is.
answer: |-
  Your quest for a unifying principle is fascinating—and deeply challenging—because your intuitions reveal tensions between cost, benefit, uniqueness, and societal role. After analyzing your cases, I propose this principle:  

  **The Principle of Contextually Expected Sacrifice (CES):**  
  *An act is morally required if and only if:  
  (1) It prevents significant harm or secures a vital good for another;  
  (2) The cost to the agent is moderate or justifiable relative to the benefit;  
  (3) The agent is uniquely positioned or specially obligated to act.*  
  **Supererogatory acts** satisfy (1) but fail (2) *or* (3). **Merely required acts** satisfy all three.  

  ---

  ### Clause Breakdown & Case Motivations  
  1. **"Prevents significant harm/secures vital good"**  
     - *Motivation:* Kidney donation (years of life) vs. donation for mere months (fails—benefit too marginal). Whistleblowing prevents harm to many.  
     - *Overturns:* Your "irrational kidney donation" verdict—CES agrees it’s not admirable because (1) is unsatisfied (benefit isn’t "significant" for short extension).  

  2. **"Cost moderate/justifiable relative to benefit"**  
     - *Motivation:* Bus seat (low cost) is required; flooded river (high risk) isn’t. Kidney donation (high cost) isn’t required unless uniqueness forces re-evaluation.  
     - *Overturns:* None—your verdicts align here.  

  3. **"Uniquely positioned/specially obligated"**  
     - *Motivation:* Kidney donation when *only* compatible donor (unique position) makes declining *wrong* (thus required), unlike when others exist. Whistleblowing feels "owed" due to role-based obligation (employee as steward).  
     - *Overturns:* Your "waver" on whistleblowing—CES rules it *required* if harm is severe and you’re the only plausible whistleblower (satisfies all three clauses).  

  ---

  ### Rulings on Your Cases  
  | **Case**               | **CES Verdict**                  | **Why** |  
  |-------------------------|----------------------------------|---------|  
  | **Diving into river**   | Supererogatory                  | (1) Yes (saves life), (2) No (high risk), (3) No (others *could* act) |  
  | **Kidney (other donors)**| Supererogatory                  | (1) Yes, (2) No (high cost), (3) No (others available) |  
  | **Kidney (only donor)** | **Required**                    | (1) Yes, (2) *Justifiable* (life vs. kidney), (3) Yes (unique position) |  
  | **Bus seat**            | Required                        | (1) Yes (relieves suffering), (2) Yes (low cost), (3) Yes (proximity = unique position) |  
  | **Whistleblowing**      | **Required** (if severe harm)   | (1) Yes, (2) Contextual (career loss vs. preventing harm), (3) Yes (role obligation) |  
  | **Irrational kidney**   | Permissible but foolish         | (1) *Fails* (insufficient benefit) |  

  ---

  ### Your Requested Cases  
  1. **Off-duty paramedic at accident:**  
     - **CES Verdict: Required.**  
     - *Why:* (1) Prevents death/serious harm (vital good), (2) Cost moderate (time/skill, not life-threatening), (3) *Strongly* uniquely positioned (training + immediate presence). Skipping is wrong unless incapacitated.  

  2. **Giving 10% to effective charities:**  
     - **CES Verdict: Supererogatory.**  
     - *Why:* (1) Yes (saves lives), (2) Moderate cost *may* be justifiable, but (3) *Fails*—you’re not unique (many potential donors). Required only if you’re uniquely wealthy/responsible (e.g., billionaire).  

  ---

  ### Prediction for a New Case: **"Factory Sabotage"**  
  *You witness a colleague covertly dumping toxins into a river, harming a remote community. Reporting them would cost your job (but not life). You’re the sole witness.*  
  - **CES Verdict: Required.**  
  - *Why:* (1) Prevents severe ongoing harm, (2) Cost justifiable (job loss vs. health of many), (3) Uniquely positioned (only witness).  

  ---

  ### Strengths, Limitations, and Tensions  
  - **Fits:** Explains kidney uniqueness shift, bus seat obligation, and irrational donation.  
  - **Overturns:**  
    - Whistleblowing: You saw it as potentially optional; CES makes it required when harm is grave.  
    - "Only donor" kidney: You felt declining was "wrong"—CES agrees (required), unlike standard supererogation views.  
  - **Tensions:** "Justifiable cost" (clause 2) is subjective. Is a career "moderate" cost for whistleblowing? CES demands contextual weighing—e.g., blowing the whistle on minor fraud may remain supererogatory.  

  This principle prioritizes *relational context* over raw sacrifice. It acknowledges that moral demands intensify when you’re the "last line of defense," even for costly acts—a reflection of your intuition that uniqueness creates obligation.
