prompt: |-
  I've been running a small podcast on judgement and decision-making for about a year, mostly sceptics and forecasting nerds, and next week I'm recording with a decision theorist who's spent her career arguing that ambiguity aversion is not a bias to be corrected but a perfectly rational stance. The booking is oddly personal for me: eight months ago I left a stable job where I could at least price my odds (promotion cycles were predictable, I knew roughly who got what), for an early-stage venture where no probabilities are even vaguely available, and I've been second-guessing myself ever since. My co-host thinks the whole Ellsberg business is a laboratory artifact, the kind of thing people shake off once you make the stakes repeat, so I want questions that take her view seriously rather than treating it as the standard 'humans are irrational, file under anomalies' line I've done to death in other episodes.

  Please draft nine or ten interview questions that go beyond getting her to restate the view. I want at least one on the two-colour problem specifically (the one where people prefer betting on the urn with the known 50/50 split, in both directions, which shouldn't be possible under any single assignment of probabilities), one on whether ambiguity aversion just collapses into ordinary risk aversion once you're allowed to think of the unknown urn as a compound lottery, one on the alleged connection people draw between ambiguity aversion and wanting robustness (max-min style rules, choosing the option that does alright across the scenarios you can't price), and one on whether there's anything left of the view once you let people update over time — repeated exposures, learning which urn you're actually facing. For each question give me a follow-up keyed to the reply she's most likely to give, since she's apparently very good at agreeing that the intuition is strong and then quietly declining to cash it out.

  Format: split it into sections in this order — 'Cold open' (one framing question, short), 'The urn problems' (three questions), 'Rationality or psychology' (three questions), 'Real stakes' (two or three questions about decisions like mine, career moves, insurance, health choices where the probabilities just aren't there), and 'Closer' (one question about what evidence could actually count against her view). Keep each question to a few sentences of setup plus the question itself, and flag in brackets after each follow-up which standard reply you're assuming she'll reach for. Also, please don't suggest readings or papers I should have her comment on — I want the questions usable without any prep beyond the episode itself. If it matters, the audience skews people who know expected utility vaguely but have never heard of Ellsberg by name, so the setups can do a bit of quiet explaining as they go.
