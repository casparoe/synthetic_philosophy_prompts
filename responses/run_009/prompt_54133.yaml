  For real stakes, questions about career moves, insurance, and health decisions where probabilities are unknown. Follow-ups should push back on whether rational choice aligns with ambiguity aversion in practice.

  The closer should ask what evidence could falsify her view, with a follow-up on whether adaptive behavior in learning scenarios would challenge her stance.

