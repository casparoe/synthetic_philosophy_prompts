  First, I recall that the user mentions Sidgwick and Parfit. Sidgwick's discussion in "The Methods of Ethics" is foundational here, where he points out the parallel between distributive principles in one life and across lives. Parfit's reductionist view of personal identity in "Reasons and Persons" supports this by arguing that personal identity isn't as deep as we think. 

  The term "Argument from Temporal Neutrality" seems relevant. It emphasizes that if we discount time within a life, consistency demands we shouldn't discount personal boundaries. But I need to check if this term is widely recognized. Maybe "Parfitian Analogy" is another possibility, but it might be too specific. "Aggregation Symmetry Argument" captures the core idea but might not be a standard term.

  The user also asks about the boundaries of the claim. They want to know if it includes the mirror move where critics stress personal unity. The analogy primarily supports the utilitarian side, but the counter-move uses personal unity to reinforce separateness. That's important to clarify.

  Another point: what if someone accepts Parfit's view but still rejects the analogy? The user questions if that's coherent. Here, I need to address possible responses. For instance, one could argue that psychological connectedness, even if not identity, still creates a different moral context. Or perhaps the value of agency and autonomy across persons differs from within a life.

  The user's deeper needs might include wanting to break the cycle in debates. They might seek a structured understanding to articulate counterarguments or identify weaknesses in the analogy. Providing definitions and boundary cases, as they requested, will help them navigate these discussions more effectively.

  I should also consider the philosophical nuances. The analogy doesn't necessarily commit to full-blown reductionism. Critics can accept Parfit but still emphasize relationships or agency. Distinguishing between metaphysical and normative claims is key here. The user might benefit from understanding that rejecting the analogy doesn't require rejecting Parfit but can instead focus on different moral principles.

  Finally, structuring the response with clear terms, definitions, and possible counterarguments will address their needs. Highlighting how the separateness of persons functions both as a metaphysical and normative concept can clarify why the debate often loops. This should give the user the tools to engage more effectively in these arguments.
answer: |-
  Based on your detailed description, the core move you're identifying does indeed have established terminology and philosophical grounding:

  1.  **The Core Name:** The most precise and widely recognized name for the utilitarian move you describe is the **"Argument from Temporal Neutrality"** (sometimes called the "Time-Slice Argument" or "Argument for Interpersonal Compensation via Temporal Analogy").
      *   **Definition:** This argument contends that if we accept the rationality and morality of aggregating benefits and harms *within* a single life across different times (e.g., trading a headache now for fewer headaches later), we must logically accept the aggregation of benefits and harms *across* different persons at the same time. It asserts that the temporal separation within a life is morally analogous to the spatial separation between lives. Discounting future pains for being "future" is seen as irrational bias; similarly, discounting others' pains simply because they are "others" is argued to be an analogous irrational bias ("person bias" or "identity bias").
      *   **Key Proponents:** Henry Sidgwick laid the explicit groundwork (*The Methods of Ethics*, Book IV, Chapter III). Derek Parfit provided the most influential modern defense and strengthening (*Reasons and Persons*, Part III), arguing that the metaphysical basis for privileging the self-over-time boundary over the self-other boundary is weak (reductionism about personal identity).

  2.  **The Counter-Move:** As you note, the standard reply is the **"Separateness of Persons"** objection.
      *   **Definition:** This objection asserts that persons are distinct rational agents, ends-in-themselves, or possessors of separate moral status. Aggregating gains and losses *across* these distinct boundaries violates a fundamental moral constraint because it treats separate individuals as mere containers for experiences that can be summed, rather than respecting each as an inviolable source of claims. It denies the moral symmetry between *my* future pain and *your* current pain, even if both pains are equally intense.
      *   **Key Proponents:** John Rawls (*A Theory of Justice*, §5, §30) famously invoked it against utilitarianism, emphasizing individuals as distinct "units of responsibility." Robert Nozick (*Anarchy, State, and Utopia*, p. 32-33) gave the vivid "utility monster" counterexample. Bernard Williams also stressed the importance of individual integrity and projects.

  **Boundaries and Nuances of the Argument from Temporal Neutrality (ATN):**

  1.  **Core Claim vs. Mirror Image:**
      *   **Core Claim (ATN):** Primarily argues *for* the symmetry of interpersonal and intrapersonal aggregation over time to *defend* utilitarianism. ("If you accept one, you must accept the other.")
      *   **Mirror Image:** The move where critics *deny* the symmetry by emphasizing the *unity* of the person over time to *sharpen* the contrast with interpersonal separation. This is *part of* the "Separateness of Persons" objection, specifically leveraging the perceived disanalogy between the deep unity of a single life and the radical separation of distinct lives. It doesn't have a distinct name *from* the separateness objection itself, but it's a crucial tactic *within* that objection.

  2.  **What ATN Commits You To:**
      *   **Temporal Neutrality:** Accepting that the mere time at which a benefit or harm occurs to *me* shouldn't fundamentally alter its moral weight in aggregative calculations (discounting for uncertainty or changing preferences is different).
      *   **The Analogy Holds:** Believing that the *kind* of separation involved in "me-now vs. me-in-10-years" is relevantly similar to the *kind* of separation involved in "me-now vs. you-now" for the purposes of aggregating welfare.
      *   **The Irrelevance of Metaphysical Identity (to some degree):** Accepting that even if personal identity over time is less "deep" than common sense assumes (à la Parfit), the *moral significance* of the self-other boundary remains fundamentally different from the significance of the self-over-time boundary. ATN argues *against* this moral difference.

  3.  **What ATN Does *Not* Necessarily Commit You To:**
      *   **Full Parfitian Reductionism:** You can accept the *analogy* without fully endorsing Parfit's controversial metaphysical claim that personal identity *just is* psychological connectedness/continuity without a "further fact." The analogy relies on the *functional similarity* of the separations, not necessarily the complete dissolution of personal identity. Sidgwick made the argument before Parfit.
      *   **Strict Hedonic Utilitarianism:** While used to defend aggregation, the argument could apply to other welfarist views (e.g., preference satisfaction) as long as the good is aggregable.
      *   **Denying *All* Moral Significance to Persons:** It argues against the *absolute moral barrier* to aggregation posed by the separateness objection, not necessarily against the significance of personal agency, projects, or rights in *non*-aggregative contexts.

  4.  **Accepting Parfit But Rejecting the Analogy: Is It Coherent?**
      *   **Yes, it is possible and argued for.** This is a critical point. One can accept Parfit's reductionist view of personal identity ("I" am just a series of psychologically connected time-slices) but *still* reject the moral symmetry between intrapersonal and interpersonal aggregation. How?
          *   **Emphasis on Relationships:** Even if "I" am not a deep metaphysical unity, the *relationships* between different person-stages *within* what we call "one life" (e.g., shared memories, ongoing projects, anticipation, continuity of care) are fundamentally *different in kind* from the relationships *between* distinct persons (who lack direct psychological access, shared first-person perspective, etc.). These relationships might ground different moral principles for aggregation.
          *   **Agency and Authorization:** Within "my" life, *this* present time-slice has a unique authority and responsibility regarding *future* time-slices that are causally and psychologically connected to it (e.g., I can bind my future self with promises or savings). I have no such inherent authority or responsibility over *your* experiences. This asymmetry might justify different aggregation rules.
          *   **Distinct Source of Claims:** Even without a "deep self," pains and pleasures occur within distinct streams of consciousness. The claim generated by a pain in *this* stream (whether labeled "me" or "time-slice A") might be fundamentally different from the claim generated by a pain in another, causally isolated stream ("you" or "time-slice B"), regardless of the metaphysics of identity. The separateness of *consciousness* might be morally primary.
          *   **Value of Autonomy/Non-Imposition:** The moral wrong in making you suffer for my benefit isn't *just* about aggregating experiences; it's about violating your autonomy, imposing on you, failing to respect your separate standpoint. The time-slices within one life don't impose on each other in the same way; they *are* the unfolding of a single standpoint (even if metaphysically "shallow").
      *   **Conclusion:** Accepting Parfit undermines the *metaphysical foundation* often used to *support* the moral significance of the separateness of persons. However, it doesn't *force* one to accept the moral symmetry of aggregation. The critic can shift ground to emphasize the *phenomenological*, *relational*, or *agential* differences between the two types of separation as morally relevant, even granting the metaphysics.

  **How It Hooks into "Separateness of Persons" (SoP):**

  *   **ATN is the Utilitarian Attack on SoP:** ATN directly targets the core claim of SoP – that the interpersonal boundary creates an absolute barrier to aggregation. It argues this barrier is arbitrary by comparing it to the temporal boundary *within* a life, where aggregation is uncontroversially accepted.
  *   **SoP is the Deontological Defense Against ATN:** SoP insists that the interpersonal boundary *is* fundamentally different and morally significant *despite* the analogy, often by appealing to:
      *   The unity of agency/projects over a life.
      *   The distinctness of ends-in-themselves.
      *   The wrongness of using one person merely as a means for another's benefit.
      *   The inviolability of individuals.
  *   **The Loop:** The debate loops because:
      1.  Utilitarian: "Aggregation across time is fine. Time separation = Person separation."
      2.  Deontologist: "Person separation is different! Persons are separate units! Aggregating across them violates integrity/rights."
      3.  Utilitarian: "But *why* is it different? What's the *relevant* difference between 'me-future' and 'you-now' that justifies such a starkly different moral rule? The burden is on you to explain the disanalogy."
      4.  Deontologist: "The difference is the separateness of persons! Unity of a life vs. disunity of lives! Agency! Inviolability!" (Which brings us back to step 2).

  **In Summary:**

  *   **The Move:** Argument from Temporal Neutrality (ATN).
  *   **The Counter:** Separateness of Persons (SoP).
  *   **The Core:** ATN argues for symmetry between intrapersonal-temporal and interpersonal aggregation. SoP denies this symmetry.
  *   **Parfit's Role:** Strengthens ATN by undermining the metaphysical basis for SoP, but doesn't *force* acceptance of the moral symmetry. Critics can pivot to non-metaphysical justifications for SoP.
  *   **The Loop:** Driven by the utilitarian demanding a *relevant difference* between the separations, and the deontologist insisting the separateness *itself* is the fundamental moral difference, leading to stalemate.

  Understanding ATN and SoP as these specific, interlocking arguments clarifies why the online debate often feels stuck. Breaking the loop usually requires moving beyond this specific dialectic to discuss deeper foundations of value, the nature of well-being, the scope of agency, or the justification of rights – areas where the analogy might not apply so directly.
