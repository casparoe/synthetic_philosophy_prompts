  The user's idealization hypothesis holds weight, but it's incomplete. The capping argument isn't merely practical—it's about avoiding undefined expectations. The risk-averse responses aren't rejecting idealization but proposing different norms for infinite cases. And the bullet-biters' stance exposes a tension in decision theory itself: should it describe or prescribe?

