answer: |-
  ### The theory, restated in operational terms (approx. 150 words)
  The theory posits that archives function as tools of administrative control, not passive repositories. Power lies with the entity creating, selecting, retaining, and destroying records, driven solely by its operational needs. Records are generated to serve specific administrative functions (e.g., immigration control, welfare administration), inherently prioritizing the state's perspective and requirements over the subject's life or future needs. "Archival silence" – the absence of records about specific people or events – is a deliberate outcome of this process. It occurs when records are deemed operationally obsolete and destroyed, or when the administrative purpose never required their creation in the first place. This absence is not neutral; it actively shapes who is recognized by the system and who is rendered invisible.

  ### The mapping (approx. 400 words)
  The power to **create** records rested solely with the UK state apparatus, primarily border authorities and the Home Office. Records (like landing cards) were created upon arrival for the specific administrative purpose of tracking entry and initial legal status under the Immigration Act. The power to **keep** or **destroy** records also resided entirely with the Home Office, acting as its own records manager. Operational needs dictated retention: records deemed necessary for *ongoing* enforcement or potential future state action (e.g., deportation orders, criminal records) were kept. Records viewed as serving only a *past, completed* administrative function (establishing initial arrival under the 1971 Act, now superseded for those granted settled status) were deemed "housekeeping" and destroyed (landing cards, 2010). Crucially, no record confirming settled status was ever **created** for the individuals themselves, reflecting the state's lack of need to *prove* status *to* the subject.

  The power to **demand** records shifted dramatically with the 2012 "hostile environment" policy. The state now required individuals to *produce* evidence of their status for essential services (work, housing, healthcare). The surviving records, however, served only the Home Office's operational purposes: enforcement tools (detention, deportation orders) or records tied to *later* interactions with the state (tax, benefits, NHS records). **What counted as evidence** was defined by the state: official documents proving arrival date and continuous residence. The destruction of the landing cards created a critical archival silence precisely where the state now demanded proof. This absence of *state-created* record was interpreted by the enforcing state apparatus not as a gap in *its* record-keeping, but as evidence of an *absence of the person's legal right to be in the UK*. The individual's own memories, family photos, or community ties were rendered inadmissible by the state's evidential framework.

  ### What the theory explains (approx. 300 words)
  The theory powerfully explains the core dynamics of the scandal:
  1.  **Archives as Instruments:** The Home Office's records system functioned precisely as an instrument of its administrative (and later enforcement) power. Creation, retention (of enforcement records), and destruction (of arrival records) were decisions made solely to serve its evolving operational goals, from post-war labour intake to immigration control.
  2.  **Administrative Purpose Drives Records:** Landing cards were created for the administrative purpose of initial entry tracking, not to provide individuals with proof of status. Their destruction occurred once that *administrative purpose* was deemed complete (settled status granted, no perceived need to re-verify). Conversely, records supporting *ongoing* enforcement purposes were retained.
  3.  **Archival Silence is Produced:** The absence of landing cards wasn't an accident; it was the planned outcome of routine disposal based on an assessment of *current administrative value*. This manufactured silence directly enabled the hostile environment. The absence of *any* state-issued proof-of-status document was a deliberate non-creation, reflecting no administrative need to provide it.
  4.  **State Perspective Prevails:** The surviving records reflected the state's perspective – its enforcement actions and later interactions. The individual's narrative and non-state evidence held no weight because the administrative framework defined validity solely through its own, now incomplete, records.

  ### Where the theory goes silent (approx. 300 words)
  The theory illuminates the *production* of the scandal but struggles with its *exposure* and *aftermath*:
  1.  **Exposure Mechanism:** The theory centers on the state's archival power but offers no framework for understanding how its failures were revealed. The scandal broke through **press investigation and advocacy**, leveraging personal testimonies and leaked information – forces entirely outside the archival system the theory describes. The state's own records management did not self-correct or expose the injustice; external scrutiny was required.
  2.  **Differential Retention Nuance:** While the theory identifies archival silence, the Windrush case hinges critically on the granularity of **"differential retention"** – the operational choice to retain specific files needed for *active enforcement* (keeping individuals vulnerable) while destroying files needed for *individual defence* (landing cards). The theory's monolithic view of "the archive" as a tool of power obscures this internal, purposeful inconsistency in valuing records.
  3.  **The Compensation Scheme Paradox:** The theory has little to say about the new administrative layer created by the scandal itself: the **Windrush Compensation Scheme**. This scheme demands individuals *manufacture* a substitute documentary childhood – a new set of records (bank statements, school reports, personal letters) deemed valid *now* by the state. This process creates a secondary, state-sanctioned archive born of the state's initial archival failure, which will itself become future evidence. The theory doesn't account for this reactive, compensatory record-creation or its future implications.

  ### The episode as a test of the theory (approx. 250 words)
  The Windrush scandal is a stark **confirmation** of the theory's core tenets regarding archives as instruments of administrative power, the primacy of administrative purpose in record lifecycles, and the deliberate production of archival silence. The destruction of landing cards and the lack of status documents were direct outcomes of state record-keeping priorities, directly enabling the state's later enforcement actions against individuals rendered invisible by its own archives.

  However, it also reveals significant **anomalies and limitations** demanding refinement:
  1.  **"Differential Retention" as Essential Refinement:** The episode forces the refinement you propose. Highlighting "differential retention" – the selective valuing of records based on *specific, current administrative functions* (enforcement vs. historical proof) – is not merely relabeling; it exposes a critical operational logic within state power that the monolithic view misses. This granularity is crucial for understanding *how* silence is weaponized against specific groups.
  2.  **Blind Spots:** The theory's silence on exposure mechanisms (press, advocacy) and the creation of new evidentiary burdens through compensation schemes highlights its limitation to the *production* of archival power, not its contestation or reactive consequences. It struggles with dynamics outside the state-archive dyad.
  3.  **Unanticipated Complexity:** While the theory anticipated state-produced silence harming subjects, the specific mechanism – destroying proof of arrival while retaining enforcement tools, within a framework demanding proof from individuals – showcases a perverse application of differential retention the theory perhaps didn't fully anticipate in its devastating human cost. The episode confirms the theory's power but demands its expansion to account for granular retention logic and extra-archival forces.
