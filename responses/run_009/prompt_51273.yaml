  First, Cornelia opposes harm and cheating: she fought the councilman's inflated contracts, the chemical leak, the landfill near the school, and the coach's expense fraud. These all involve clear harm or dishonesty. But there's another layer: she values loyalty, proper channels, and town symbols. She praised the fireworks family and criticized the clerk for going outside the department. 

  For the elm tree scene, the tree is diseased and dangerous near a playground. Rule 1 (harm prevention) would support cutting it down to prevent injury. Rule 2 (symbols/loyalty) might make her oppose cutting due to its symbolic value. Given her practical approach in past issues (like opposing the landfill for safety), she'd likely prioritize safety over sentiment, supporting the removal.

  The retirement home case involves a nurse exposing neglect to media. Rule 1 would back the nurse for revealing harm. Rule 2 would condemn bypassing internal channels. Cornelia previously scolded the police clerk for not reporting internally first, so she'd likely criticize the nurse similarly, despite the positive outcome.

  The user also asks about moral foundations theory. If Cornelia uses Rule 2, it reflects a conservative leaning with emphasis on loyalty and authority. This doesn't validate her judgments' correctness but explains her rationale. The deeper need might be ensuring character consistency and exploring moral complexity. To test her principles, a scenario where internal channels fail but loyalty is at stake would be revealing.
answer: |-
  Based on her record, Cornelia Marsh operates by two core rules:

  1.  **Rule 1 (Harm/Cheating Principle):** She is fundamentally moved to oppose actions that cause tangible harm, exploit vulnerability, or involve clear dishonesty/cheating, regardless of local sentiment or procedure.
  2.  **Rule 2 (Community Order Principle):** She values loyalty to the town's institutions, adherence to established procedures/channels, respect for authority (when earned), and the preservation of the town's tangible symbols and social fabric. This moderates Rule 1.

  **Predictions:**

  1.  **The Charter Elm:**
      *   *Rule 1 Prediction:* Support cutting. The diseased tree poses a clear, physical danger (dropping limbs near a playground). Harm prevention outweighs sentiment.
      *   *Rule 2 Prediction:* Oppose cutting. The tree is a profound symbol (town seal), representing heritage. Its loss is an attack on the town's identity.
      *   **Best Guess: Support Cutting.** Her record shows prioritizing concrete safety (landfill near school, chemical leak) over abstract objections. The danger is immediate and physical. She may lament the loss profoundly in her column but frame it as a necessary, painful duty for public safety.

  2.  **The Retirement Home Nurse:**
      *   *Rule 1 Prediction:* Support the nurse. The neglect caused real harm to vulnerable residents. Exposing it led to improvements. The nurse acted against harm.
      *   *Rule 2 Prediction:* Condemn the nurse. She bypassed "proper channels" (ignored complaints ≠ exhausted *all* internal avenues?), damaged the institution's reputation (lost benefactor), and caused job losses (aides dismissed). Loyalty and procedure were violated.
      *   **Best Guess: Condemn the Nurse.** This mirrors the police clerk incident almost exactly. Cornelia demanded repayment from the coach (Rule 1 - cheating) but *also* scolded the clerk for not using internal channels first (Rule 2). Here, harm was addressed (Rule 1 satisfied by outcome?) but Rule 2 was violated spectacularly (external media, institutional damage, job losses). Expect a column acknowledging the improved conditions but fiercely criticizing the nurse's destructive method and lack of loyalty/patience with the system.

  **Deciding Scene:** A scenario where internal channels demonstrably fail to address a serious harm *and* loyalty to a specific town institution or figure is heavily invoked *against* action. (e.g., Beloved local businessman is embezzling from a charity; internal board covers it up "for the town's good." Does she expose it publicly (Rule 1) or push internally despite failure, fearing scandal (Rule 2)?).

  **Moral Foundations & Correctness:**
  If Cornelia uses Rule 2 prominently (Community Order), it aligns with the conservative emphasis on Loyalty, Authority, and Sanctity in Moral Foundations Theory. **This tells us *how* she arrives at her judgments (valuing procedure, loyalty, symbols), not whether they are objectively "correct."** Her condemnation of the nurse could be seen as prioritizing institutional stability over swift justice for victims, a value judgment itself. Her correctness depends on the reader's own moral framework. The theory explains her reasoning, not its inherent rightness.

