prompt: |-
  My old college friend Dee took exactly one thing away from her undergrad evolution course, which is that she adores the Gould–Lewontin spandrels paper and thinks most evolutionary psychology is a crime scene. Over the years she's built up a track record of calling traits as adaptations or not, and I've been writing her calls down because I'm pretty sure there's a system in it somewhere. So far: fever is an adaptation (she loves the experiments where feverish lizards survive infection better); the panda's thumb is a genuine adaptation even though it's a jury-rigged wrist bone; male nipples are a pure byproduct; reading is an exaptation but emphaticaly not an adaptation; the sweet tooth is an adaptation, tuned to ancestral sugar scarcity; music is a spandrel, end of story; and the appendix is a vestige, despite the whole recent safe-house-for-gut-bacteria thing, which she rolls her eyes at.

  Tomorrow we're having dinner and somehow menopause is going to come up, I just know it. I want a prediction in hand before then: does she call menopause an adaptation (grandmother hypothesis, provisioning the grandkids, orcas and all that) or a byproduct (antagonistic pleiotropy -- selection only caring about early fertility, the late-life shutdown just being the price)? And don't tell me it's as simple as "she says adaptation whenever the evidence is strong," because the appendix people have evidence too and she's not having any of it. My guess is there are at least two different rules that fit every call she's made so far but split on menopause, so: figure out what those candidate rules are, say which one you'd bet on and why, and tell me what other trait I should bring up over dessert that would actually tell the rules apart, along with what each rule predicts she'd say about it.

  Two last things. First, I don't want a defense of Dee or of any of these positions, I want a read of Dee. Second, at the end, tell me how confident you are in your overall read of her, and be honest about which one call in her track record fits your favored rule worst -- I'd rather know where your theory of her is soft than have you paper over it.
