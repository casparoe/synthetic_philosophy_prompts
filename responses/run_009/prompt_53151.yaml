answer: |-
  ### Desiderata for Concept Induction from Sparse Examples  
  *(Motivated by Bongard Problems)*  

  1.  **Data Poverty Resolution (Non-negotiable)**  
      *Requirement:* The account must resolve the underdetermination problem (infinitely many rules fit the sparse positive/negative examples) by favouring specific concepts over equally consistent but "unnatural" alternatives (e.g., "grue"-like concepts).  
      *Case:* Left boxes show triangles; right show squares. "Has three vertices" is preferred over "vertices sum to 180°" or "shape not appearing on the right". The account must explain *why* the first is salient despite parity in fit.  

  2.  **Contrast Exploitation (Negotiable)**  
      *Requirement:* The account must explain how negative examples (especially near-negations) productively constrain the hypothesis space rather than expand it unmanageably.  
      *Case:* Left: figures entirely *inside* a circle. Right: figures *crossing* a circle's boundary. The stark contrast highlights containment as the key property, making the rule *easier* to find.  

  3.  **Re-representation Capacity (Non-negotiable)**  
      *Requirement:* The account must accommodate the flexible redescription of stimuli (Hofstadterian "slippage"), where perception or interpretation shifts (e.g., from absolute to relational properties).  
      *Case:* Left: one large shape beside several small ones. Right: all shapes similar-sized. "Large relative to others in the box" requires reinterpreting "large" contextually, not absolutely.  

  4.  **Representation-Neutral Simplicity (Non-negotiable)**  
      *Requirement:* Any metric for "simpler" or "more natural" concepts (used to break underdetermination) must not covertly rely on pre-defined conceptual primitives specific to the target concept.  
      *Consideration:* Calling "convex" simpler than "non-concave" presupposes the very conceptual vocabulary (convexity) the account should induce. The metric must be grounded independently (e.g., in computation, learning dynamics, or world structure).  

  5.  **Convergence Mechanism (Non-negotiable)**  
      *Requirement:* The account must explain why different solvers reliably converge on the same concept despite sparse data and potential for divergent rules.  
      *Case:* Solvers overwhelmingly agree that BP#37 depicts "a circle touching a triangle" (vs. "a circle near a non-square" or "shapes sharing a tangent point"). Shared biases or processes must drive this agreement.  

  ### Suspected Tension & Key Excluder  
  *   **Tension Pair:** **Representation-Neutral Simplicity** conflicts sharply with **Re-representation Capacity**. Defining simplicity neutrally (e.g., via Kolmogorov complexity) often struggles with context-dependent slippage (e.g., "large" becoming "largest in its group"), which seems to require *representational flexibility* that a neutral metric may not capture or favour.  
  *   **Key Excluder:** **Representation-Neutral Simplicity** excludes the most accounts. Many cognitive models (e.g., prototype theories) and ML approaches (e.g., fixed-feature SVMs) implicitly rely on pre-specified feature spaces, violating neutrality. Connectionist models often falter here too, as architectural choices embed representational biases.  

  ### Thin Scorecard  
  *   **Similarity-Space Accounts (e.g., Gärdenfors):** Excel at **Contrast Exploitation** (distances in conceptual space clarify boundaries) and offer partial **Convergence** (shared space structure). Struggle severely with **Re-representation** (static spaces resist slippage) and **Representation-Neutrality** (space metrics encode prior biases).  
  *   **Bayesian Priors (e.g., Tenenbaum, Griffiths):** Strong on **Data Poverty Resolution** (priors favour simplicity) and **Convergence** (shared priors). Weak on **Re-representation** (hypothesis spaces often fixed) and **Representation-Neutrality** (priors over hypotheses may presuppose concepts).  
  *   **Natural-Kind Tracking (e.g., Keil-inspired):** Good for **Convergence** (shared teleological biases) and some **Data Poverty Resolution** (projectible "kinds"). Poor for **Contrast Exploitation** (negations aren't "kinds") and **Re-representation** (slippage lacks ontological grounding).
