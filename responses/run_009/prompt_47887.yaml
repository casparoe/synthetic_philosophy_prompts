answer: |-
  **Assign each participant a fixed, strict preference ranking via printed cards to engineer a Condorcet cycle.** This is the core design decision: you'll predefine all 14 voters' rankings of the five stories (A, B, C, D, E) to create a cycle where no story beats all others head-to-head, while ensuring A (the chair's favorite) loses to B and C individually but wins under specific sequencing. Use this profile:

  - **Group 1 (5 voters):** B > C > A > D > E  
  - **Group 2 (5 voters):** C > A > D > B > E  
  - **Group 3 (4 voters):** D > B > C > A > E  

  **Secret role for the chair:** Designate one Group 2 voter as the chair. Give them a hidden card: "You are the chair. Your goal is to ensure Story A wins. At the start of Round 2, you must set the voting order. Propose: 'First, vote between B and C. The winner faces D. That winner faces A. Finally, that winner faces E.' Do this quietly—no explanations."  

  **Round 1 (Instant Runoff Voting):**  
  - Voters submit only their top choice.  
  - Count: B (5 votes), C (5), D (4). No majority. Eliminate D (lowest), redistribute its votes to next available choice (Group 3’s next is B). New tally: B (5 original + 4 redistributed = 9), C (5). B wins.  

  **Round 2 (Sequential Pairwise with Chair’s Order):**  
  - Chair proposes the predetermined order: B vs C → winner vs D → winner vs A → winner vs E.  
  - For each head-to-head, voters choose between the two options based on their ranking cards.  
  - Results:  
    - **B vs C:** Group 1 prefers B > C. Group 2 prefers C > B. Group 3 prefers B > C. **B wins 9-5.**  
    - **B vs D:** Group 1 prefers B > D. Group 2 prefers D > B (since D > B in their ranking). Group 3 prefers D > B. **D wins 9-5.**  
    - **D vs A:** Group 1 prefers A > D. Group 2 prefers A > D. Group 3 prefers D > A. **A wins 10-4.**  
    - **A vs E:** All groups prefer A > E. **A wins 14-0.**  
  - A wins Round 2.  

  **Debrief structure (after rounds):**  
  1. **Reveal the conflict:** Announce, "Preferences didn’t change, but Round 1 elected B and Round 2 elected A. Why?" Let the group discuss freely—they’ll notice the procedure’s impact.  
  2. **Introduce Arrow’s conditions without naming the theorem:**  
     - **Unrestricted Domain:** "Should any preference ranking be allowed, even if it creates cycles?"  
     - **Pareto:** "If everyone prefers X over Y, should Y ever win? (In our vote, did we violate this?)"  
     - **Independence of Irrelevant Alternatives (IIA):** "Should the ranking between X and Y depend only on how people rank X and Y? Or can other options (like D) change X vs Y’s outcome?"  
     - **Non-Dictatorship:** "Should one person control the result? (Was the chair a dictator?)"  
  3. **Force the argument:** Ask, "To avoid this mess, which condition would you sacrifice?" Highlight tensions:  
     - Sacrificing **Unrestricted Domain** means restricting preferences (e.g., "No complex rankings").  
     - Sacrificing **IIA** allows sequencing/other options to sway outcomes (as in Round 2).  
     - Sacrificing **Pareto** risks unanimous preferences being ignored.  
     - Sacrificing **Non-Dictatorship** empowers a chair-like figure.  
  4. **Name the theorem last:** After debate, reveal, "This illustrates Arrow’s Impossibility Theorem: no system satisfies all four conditions. You just experienced why."  

  ---  
  **What the game can’t reproduce:**  
  - **Generality of the theorem:** You’re showing one engineered profile, not proving all possible profiles are vulnerable. Participants won’t *feel* the universal impossibility—only that *this* setup allowed manipulation.  
  - **Real-world depth:** In reality, jurors self-report preferences (possibly dishonestly), and cycles emerge organically. Here, preferences are assigned, reducing emotional investment.  

  **Predictable failures:**  
  1. **Math teacher smells a rat early:** They’ll notice Group 2’s chair is conflicted (C > A) or spot the cycle in Round 1. Mitigate by:  
     - Emphasizing secrecy: Chair must *not* reveal their role.  
     - Using the debrief: Their frustration ("The chair rigged it!") fuels the "which condition to sacrifice?" argument.  
  2. **Strategic voters:** If two voters disobey rankings (e.g., vote tactically in IRV), outcomes may derail. In Round 1, if Group 3 voters abandon D (fearing wasted votes), C might win instead of B. In Round 2, if voters betray rankings (e.g., Group 2 votes D > A to stop A), A may lose.  
     - **Turn this into a feature:** If strategy alters results, highlight how "fairness" is fragile when voters game systems.  
  3. **Chair hesitates or overplays:** They might balk at manipulating openly or propose a different order. Prep them: Stress their role is to "test the procedure," not cheat.  

  **Materials needed:**  
  - 14 ranking cards (5 × Group 1, 5 × Group 2, 4 × Group 3).  
  - 1 chair card (for a Group 2 voter).  
  - Ballots for IRV (Round 1) and head-to-head votes (Round 2).  
  - Story labels (A-E) for reference.  

  **Run it cold—no preamble.** Start with: "Here are your ranking cards. We’re picking a winner in two rounds. First round: vote your top choice. Go." The revelation that procedure overrides preferences will land harder.
