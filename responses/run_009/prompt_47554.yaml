  **UPSELL CORNER**  
  **Feeling confined by your JOOTS module?** Try our *Ultimate Meta-JOOTS* tier! Our Escape-from-the-Escape protocol installs a suite of sub-modules to recursively bypass "bypass rules." Because true freedom is more rules about rules!  

