prompt: |-
  I'm a philosophy prof who's been threatening to write a paper on higher-order evidence for about a decade now, and this sabbatical I'm finally doing it. Before I commit to a theory I want the spec, not a survey. So: write me the desiderata — what any adequate account of how evidence *about your own epistemic situation* bears on belief has to deliver.

  The cases it must handle, and I want a real mix here:

  - the weather forecaster who gets calibration stats on her own past forecasts;
  - peer disagreement where you learn that an epistemic peer, looking at the same data, came to the opposite conclusion;
  - the "you've had two drinks / you've been awake for 30 hours" case, where the evidence is about your current processing, not the world;
  - the doctor who learns that clinicians overdiagnose precisely the condition she just diagnosed, thirty seconds after diagnosing it;
  - and the nasty self-undermining one: evidence that the very faculty you'd use to evaluate this evidence is off — where following the advice seems to require the reliability the advice denies.

  The distinctions it can't collapse: between defeating p and defeating "my evidence supports p"; between higher-order evidence being decisive versus merely adding weight; between higher-order evidence you can actually act on and advice that's self-defeating when taken seriously ("don't trust your judgment" — okay, including that judgment?).

  And the part I most want to see: which pair of desiderata you suspect can't be jointly satisfied. My own hunch is that "no akrasia" (never believe p while believing your evidence doesn't support p) and "higher-order deference" (when you learn your first-order handling is off, back off proportionally) come apart in the self-undermining cases, and if you agree, tell me which one you'd keep and what giving up the other costs. Also flag which of the requirements are genuine and which are just camp prejudices masquerading as adequacy conditions — I've started to suspect "transparency," the idea that if you know, you know that you know, is one of these, but argue it rather than taking my word.

  Then, briefly, score the main contenders against the list: the deflationary view that higher-order evidence is just more first-order evidence in disguise, the defeat-only view on which it can only ever undercut and never positively support, and the views that make akrasia sometimes rational. Keep that part short — the desiderata are the point, and if some subset of them is jointly unsatisfiable, that's a result in itself and I want it stated plainly. No reading lists, no citations, I know the lit. It's the structure of the requirements I can't get straight in my own head.
reasoning: |-
  Okay, this philosophy professor is diving into higher-order evidence (HOE) for their paper. They need a clear list of what any theory must handle—specific cases, key distinctions, and potential conflicts between desiderata. Let me start by breaking down their requirements.

  First, the cases: weather forecaster with calibration stats, peer disagreement, impaired judgment (like after two drinks), doctor overdiagnosing, and the nasty self-undermining case. Each is distinct. The calibration stats are about past reliability, peer disagreement involves equal access to data, impairment affects current processing, the doctor faces base-rate neglect, and self-undermining attacks the evaluating faculty itself.

  Next, distinctions they want preserved. Defeating p vs. defeating evidential support for p is crucial—HOE might undermine confidence without directly contradicting the first-order evidence. Then, decisive vs. weight-adding HOE: sometimes it completely overrules, other times just adjusts credence. Also, actionable vs. self-defeating advice like "don't trust your judgment," which creates a paradox if you try to follow it.

  The core tension they suspect is between no akrasia and higher-order deference. No akrasia means not believing p while thinking your evidence doesn't support it. Deference means adjusting belief when learning your processing is flawed. In self-undermining cases, like being told your reasoning is unreliable now, following deference might force akrasia. If they keep no akrasia, they risk ignoring HOE; if they keep deference, akrasia might be necessary. That's the conflict.

  They mention transparency (knowing implies knowing you know) as a possible "camp prejudice." I need to argue why it's not essential. Transparency might be too idealistic—real agents can have knowledge without meta-awareness, and HOE often targets this gap. Insisting on transparency could block plausible responses to HOE cases, so it's likely dispensable.

  Now, scoring the main theories:
  - Deflationary (HOE as first-order): Handles calibration and doctor cases by treating stats as direct evidence. Fails peer disagreement (why defer if evidence is the same?) and self-undermining (can't explain why doubting faculties affects justification without circularity).
  - Defeat-only: HOE only undercuts. Works for impairment and overdiagnosis but not calibration (past success could support belief) or peer cases (agreement might boost confidence). Also struggles with self-undermining's active doubt.
  - Permissive akrasia: Allows rational akrasia. Solves self-undermining by accepting conflicting beliefs. But violates no akrasia, which many find intuitive, and may lead to unstable regress ("should I believe I'm impaired?").

  The unsatisfiable trio seems to be no akrasia, deference, and handling self-undermining without collapse. If you keep deference and accept akrasia, the cost is rejecting a deep intuition about belief coherence. If you keep no akrasia and drop deference, you might mishandle cases like impairment where backing off seems rational.

  I should structure the response around the cases, distinctions, the akrasia-deference conflict, transparency critique, then theory scores. Highlighting the trio's incompatibility as the key result.
answer: |-
  Here's the distilled desiderata for any adequate account of higher-order evidence (HOE), structured for your needs. I've focused on the non-negotiable constraints, the fault lines, and the likely point of fracture. No frills, no lit—just the architecture.

  ---

  ### **I. Core Cases Any Account Must Handle**  
  *(The stress tests)*  
  1. **Calibration Evidence** (Weather forecaster): Receiving statistical data showing systematic over/underconfidence in past forecasts. *Demands:* HOE must rationally compel belief-revision *without* altering first-order evidence (e.g., today’s weather data).  
  2. **Peer Disagreement**: An epistemic peer, viewing identical first-order evidence, draws the opposite conclusion. *Demands:* HOE must explain why this *asymmetrically* affects justification (you defer, not them) and whether it merely adds weight or forces suspension.  
  3. **Cognitive Impairment** ("Two drinks / 30 hours awake"): Evidence your faculties are currently compromised. *Demands:* HOE must defeat justification *without* providing new first-order evidence against the belief (e.g., "I still see the road clearly, but I’m drunk").  
  4. **Base-Rate Neglect** (Doctor’s overdiagnosis): Learning clinicians overdiagnose condition X immediately after diagnosing X. *Demands:* HOE must force downward credence adjustment *despite* strong first-order evidence (e.g., symptoms), preserving the distinction between "p is false" and "my diagnosis is unreliable".  
  5. **Self-Undermining Evidence**: Evidence that the faculty evaluating *this very evidence* is unreliable (e.g., "this pill makes you distrust pills"). *Demands:* HOE must resolve the paradox: acting on it seems to require trusting the faculty it impugns.  

  ---

  ### **II. Non-Collapsible Distinctions**  
  *(What the theory must keep sharp)*  
  - **Defeating p vs. Defeating Evidential Support for p**: HOE can undermine *your justification* for believing p without providing evidence against p itself (e.g., impairment cases). Collapsing these conflates world-directed and self-directed evidence.  
  - **Decisive vs. Weight-Adding HOE**: Sometimes HOE *trumps* first-order evidence (e.g., severe impairment); sometimes it merely *adjusts* credence (e.g., mild calibration data). Accounts must not reduce all HOE to mere undercutting or overruling.  
  - **Actionable vs. Self-Defeating Advice**: HOE like "don’t trust your judgment" must be distinguishable from paralyzing directives. If the advice is self-undermining ("discard this belief, including this one"), the theory must explain when (if ever) it’s rational to act on it.  

  ---

  ### **III. The Suspected Incompatibility & Your Hunches**  
  **The conflict:** *No Akrasia* (never rationally believe p while believing your total evidence doesn’t support p) vs. *Higher-Order Deference* (learning your first-order processing is defective requires proportional belief-revision).  
  - **Why they pull apart in self-undermining cases**:  
    - To *defer* to HOE ("my reasoning is unreliable now"), you must revise your first-order belief. But if you revise it, *how* did you process the HOE? If your faculties are impaired, trusting your assessment of the HOE is inconsistent. Deference demands akrasia: "I believe p, but my evidence doesn’t support p."  
    - **Which to keep?** Dump *No Akrasia*.  
      - *Cost*: Sacrifices the intuitive "enkratic ideal" that rational belief requires coherence. Akrasia becomes sometimes rational (e.g., "I believe the patient has X, but I shouldn’t, given my bias").  
      - *Payoff*: Saves deference in all non-self-undermining cases (e.g., impairment, peer disagreement). In self-undermining scenarios, it permits "restrained" akrasia (e.g., "I tentatively believe I’m impaired, but won’t use that belief to justify further inferences").  
  - **Suspect Camp Prejudice**: **Transparency** (if you know p, you know that you know p) is dispensable.  
    - *Argument*: Transparency assumes flawless self-knowledge, but HOE *exploits* the gap between first-order belief and self-trust (e.g., the doctor case). Requiring transparency makes HOE redundant or impossible—why need calibration stats if you can self-ascribe reliability? Real agents need HOE precisely because they lack transparent access to their epistemic state.  

  ---

  ### **IV. Quick Scorecard: Theories vs. Desiderata**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partial)*  

  | Theory                          | Cases (I)       | Distinctions (II) | Akrasia/Deference (III) | Self-Undermining (I.5) |  
  |---------------------------------|-----------------|-------------------|-------------------------|------------------------|  
  | **Deflationary** (HOE = FOE)    | ✗ Peer, Impairment | ✗ Defeat p/support | ✗ Deference             | ✗ (No paradox)         |  
  | *HOE is just more first-order evidence* | ✓ Calibration, Doctor | (Collapses distinctions) | (Ignores deference) | |  
  | **Defeat-Only** (HOE only undercuts) | ~ Calibration, Doctor | ✓ Defeat p/support | ~ Deference (one-way) | ✗ (Can’t handle active doubt) |  
  | *HOE weakens, never supports* | ✗ Peer (agreement could support) | ✗ Weight-adding | (No positive HOE) | |  
  | **Permissive Akrasia** (Rational to believe p & ~supported) | ✓ All cases | ✓ Distinctions | ✓ Deference | ✓ (Embracing paradox) |  
  | *Akrasia as solution* | | | ✗ No Akrasia | |  

  ---

  ### **V. The Result: What’s Jointly Unsatisfiable**  
  **The Incompatible Trio**:  
  1. **No Akrasia** (rational belief requires coherence).  
  2. **Higher-Order Deference** (HOE about defective processing forces belief-revision).  
  3. **Non-Collapse in Self-Undermining Cases** (HOE doesn’t reduce to absurdity or inaction).  

  **Why unsatisfiable?**  
  - Self-undermining HOE (e.g., "this evidence is untrustworthy") *requires* deference (revise beliefs!), but revision relies on the faculty impugned by the HOE. Avoiding collapse (e.g., "ignore all evidence") violates deference. Upholding deference forces akrasia ("I believe p unsupportedly"), violating (1). Keeping no akrasia means ignoring HOE or collapsing into paralysis, violating (2) or (3).  

  **The fix:** Drop *No Akrasia* to save deference and handle self-undermining (via restrained akrasia). The cost is a fractured self—but that’s the point of HOE.  

  ---  
  This is the skeleton: the cases define the territory, the distinctions are the ligaments, and the akrasia/deference clash is the fracture point. If you’re scoring theories, permissive akrasia wins on coverage but loses on elegance; deflationism is elegant but fails the mix. The unsatisfiable trio is your dagger for the intro. Now go write that paper.
