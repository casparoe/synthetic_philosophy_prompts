  Okay, let me start by breaking down what the user is asking. They're a physics undergrad interested in the history of science, noticing a pattern where equations persist through theory changes but the underlying mechanisms get discarded. They mentioned examples like Fresnel's ether vs. Maxwell, Newton vs. Einstein. They want to know if there's a name for this, and they're looking for a philosophical position that focuses on structural continuity over ontological claims.

  First, I recall that structural realism comes to mind. Worrall's epistemic structural realism (ESR) seems directly relevant because he used the Fresnel-Maxwell transition as a key example. The user referenced Worrall, so that's a solid anchor. But they also mentioned that some math doesn't survive, like in phlogiston or caloric theories. That's a common objection to structural realism, so I need to address how ESR responds to that challenge.

  The user is seeking more than just a label. They want a detailed explanation of the position, its nuances, how it differs from instrumentalism and scientific realism, and the criticisms against it. They also want to know about competing versions, like Ladyman's ontic structural realism (OSR), which takes a more radical view that structure is all there is.

  I should outline the core claims of ESR: mathematical structures are retained across theory changes, while ontological interpretations are discarded. Then contrast it with scientific realism (which believes in the truth of both structure and ontology) and instrumentalism (which sees theories as mere tools without truth). Highlighting ESR as a middle ground is crucial.

  The criticisms they mentioned are important. The pessimistic meta-induction (failed theories like phlogiston) questions whether structure really persists. The user also brings up the "triviality" concern—if any structure can be preserved by reinterpreting ontology, is the claim meaningful? ESR proponents argue that it's not trivial because the mathematical content is retained, not just some vague structure. They point to specific equations that remain valid even when ontology shifts.

  For OSR, explaining that it eliminates objects entirely might be tricky. Using spacetime in GR as an example where the metric structure is primary could help. The user's physics background will help them grasp that. 

  The user's deeper need seems to be finding a defensible philosophy of science that acknowledges progress without naively assuming we've reached final truth. They might be wrestling with how to reconcile the success of physics with historical theory changes. Addressing survivorship bias is key—acknowledging that some structures don't survive, but arguing that the successful ones are non-arbitrary and mathematically specific.

  I should also mention the charge that ESR is "ontologically shy," which realists criticize. But ESR's strength is explaining why science works: the structural continuity allows for cumulative progress even when our ontological pictures change. 

  In conclusion, structuring the answer around ESR and OSR, their differences, and addressing criticisms with concrete examples from physics should meet the user's needs. Making sure to tie each point back to their examples will keep it relevant and grounded.
answer: |-
  You've hit on one of the most fascinating and contentious debates in modern philosophy of science! This pattern has a name: **Structural Realism (SR)**, specifically **Epistemic Structural Realism (ESR)** as championed by John Worrall (yes, the Fresnel/Maxwell case is his flagship example).

  Here's the breakdown:

  1.  **The Core Observation:**
      *   Scientific theories describe the world using mathematical structures (equations, symmetries, relationships between quantities).
      *   During major theory changes (scientific revolutions), these mathematical structures often exhibit significant **continuity**, while the underlying ontological interpretations (the "stuff," the mechanism, the nature of entities) often undergo radical **discontinuity**.
      *   Examples you cited are perfect:
          *   **Optics:** Fresnel's wave equations describing interference, diffraction, reflection, refraction → survive in Maxwell's EM theory → survive in Quantum Electrodynamics. The *ether* vanishes.
          *   **Gravity:** Newton's inverse-square law → emerges as a limit of Einstein's Field Equations. The *gravitational force acting at a distance* vanishes; replaced by *curved spacetime*.
      *   What survives isn't just *any* structure, but the **empirically successful relational structure** – the mathematical relationships between observable phenomena.

  2.  **The Position: Epistemic Structural Realism (ESR - Worrall's View)**
      *   **Core Claim:** We can have genuine scientific knowledge about the **structural features** of the world (the mathematical relationships, the "form" of reality as captured by equations), but we must remain **agnostic** about the underlying **non-structural nature** ("the stuff," the intrinsic properties of entities, the mechanism "behind" the structure). Science reliably tracks structure, not ultimate ontology.
      *   **Why it's Epistemic:** It's about the *limits of our knowledge*. We know the structure is (approximately) true, but we don't know what "realizes" that structure. The ether *might* have existed, but science couldn't tell us its intrinsic nature; it could only tell us about the wave-like structural relationships light obeyed.
      *   **The Middle Way:**
          *   **Vs. Scientific Realism:** ESR agrees that science aims for truth and achieves genuine knowledge, but *only* about structure, not about the full nature of unobservable entities or mechanisms. Realists believe we can know *what electrons are*, ESR says we only know *how electrons behave/relate* mathematically.
          *   **Vs. Instrumentalism:** ESR vehemently disagrees that theories are *merely* instruments for prediction. The preserved structures are *true descriptions* of objective features of reality. The structure isn't *just* useful; it's approximately correct. Instrumentalism sees equations as tools; ESR sees them as revealing real patterns in the world.
      *   **Goal:** To explain the **no miracle argument** (science's success would be miraculous if its theories weren't at least approximately true) *while* accommodating the **pessimistic meta-induction** (PMI - most past successful theories turned out false in their ontology, so why think ours are true?).

  3.  **Competing Version: Ontic Structural Realism (OSR - e.g., James Ladyman)**
      *   **Radical Claim:** Structure isn't just *all we can know*; structure is *all there is*. There are no "objects" or "intrinsic properties" lurking beneath the structural relations. Objects are just nodes in a relational structure. The world *is fundamentally* structure.
      *   **Motivation:** Avoids the ESR's commitment to *something* unknowable realizing the structure. Also motivated by modern physics (e.g., Quantum Mechanics where particles seem indistinguishable except by their relations/quantum numbers, or GR where spacetime points lack identity outside the metric).
      *   **The Fight:**
          *   **ESR vs. OSR:** ESR accuses OSR of being metaphysically extravagant and potentially incoherent (can you have relations without relata?). OSR accuses ESR of being cowardly ("ontologically shy") and metaphysically unstable (if structure is real, *what* is structured?).
          *   **Common Ground:** Both agree continuity of mathematical structure across theory change is crucial evidence for their position.

  4.  **Key Criticisms & Your Excellent Instincts:**
      *   **The Pessimistic Meta-Induction Strikes Back (Your Phlogiston/Caloric Point):** Critics argue SR cherry-picks successes. What about theories where *both* ontology *and* structure were discarded? Phlogiston's "negative weight" structure died with the theory. Caloric's conservation laws looked structural but were tied to a false ontology and framework. SR proponents respond:
          *   **Survivorship Bias?** Yes, but the *persistence of specific, detailed mathematical structures* (like Fresnel's equations) in *fundamental* theories is non-trivial and demands explanation. The structures that survive aren't arbitrary.
          *   **Degrees of Structure:** SR often focuses on *fundamental* theories and highly mathematized parts of science. Phlogiston/Caloric were less mature, less mathematical, and often proposed *to save* phenomena without deep structural content. The structures that *do* survive (like Lagrangian/Hamiltonian formalisms, symmetry principles, core equations) are robust.
          *   **Approximation:** Even in failures, *some* structural aspects might survive as approximations (e.g., caloric ideas survive vaguely in "heat capacity").
      *   **The Triviality/Underdetermination Problem (Your "Winning Team Scores More" Point):**
          *   **The Charge:** The claim that "the structure survives" can be made vacuously true. Any future theory can be *reinterpreted* to preserve *some* aspect of the old mathematical structure by radically changing the ontology. How do we know we're preserving the *significant* structure and not just gerrymandering?
          *   **The Defense (ESR):** It's *not* trivial. The preservation is *substantive* – the *same specific mathematical equations* (or very close approximations) continue to govern the *same empirical phenomena* within their domain. Fresnel's equations weren't just vaguely "wave-like"; they were *specific differential equations* that Maxwell explicitly adopted and embedded within a larger structure. The continuity is non-arbitrary and grounded in empirical success.
      *   **The "What is Structure?" Problem:** Is structure purely mathematical? How is it "about" the world? Can we clearly separate "structure" from "non-structure" (ontology)? This is a deep philosophical problem.
      *   **The Access Problem (for ESR):** How do we *know* the structure if we don't know what it's a structure *of*? How can we refer to or have knowledge of relations without knowing the relata? ESR struggles with epistemology here.
      *   **The Charge of Empty Agnosticism:** Realists argue ESR doesn't offer much more than instrumentalism in practice. If we can say *nothing* about the entities beyond their structural relations, are we really doing science, or just cataloging patterns?

  **Why it Matters & Where it Stands:**

  Structural Realism remains one of the most compelling responses to the problem of theory change. It offers a way to be a realist (science tracks objective truth) without naively committing to the literal truth of current ontologies (avoiding the PMI), and it takes the mathematization of science seriously.

  *   **For a Physics Student:** It resonates with how physics often progresses – the math is refined and embedded in deeper frameworks, while intuitive pictures come and go (particles as balls -> probability clouds -> excitations in fields...). The equations governing motion, waves, fields, symmetries, and conservation laws show remarkable resilience.
  *   **Competing Views:** Besides instrumentalism and standard realism, **entity realism** (Ian Hacking: "If you can spray them, they are real") focuses on manipulable entities rather than structure or full theories. **Semi-realism** (Anjan Chakravartty) argues for realism about "property clusters" that are causally grounded.

  **In Short:** You've identified **Structural Realism**, primarily **Epistemic Structural Realism**. It claims science reveals the *relational structure* of the world (equations, symmetries) with increasing accuracy, while we must remain agnostic about the *intrinsic nature* of the entities involved (the "stuff"). It's a sophisticated attempt to find realism's sweet spot between the "miracle" of science's success and the "graveyard" of past ontologies, though debates rage about its viability, scope, and whether structure is all we can know (ESR) or all there is (OSR). Your skepticism about survivorship bias and triviality hits right at the heart of the ongoing critique.
