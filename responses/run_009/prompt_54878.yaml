answer: |-
  Here is a specification of desiderata for evaluating ontological argument parodies, structured according to your requirements:

  ---

  ### **Desiderata for Ontological Argument Parodies**

  #### **1. Formal Parallelism**  
  *   **Core:** Must replicate the *inferential structure* (logical form) of the target argument. Mere rhetorical similarity is insufficient for refutation.  
  *   **Achievements:**  
      *   *Refutation (Strong):* Demonstrates the original argument form is **invalid** (leads to absurdity from plausible premises).  
      *   *Premise Undermining:* Shows a key *premise* of the original (e.g., greatness entails existence) is **false or unjustified** by using an analogous premise that is clearly false/unjustified.  
      *   *Embarrassment (Weak):* Only shows the conclusion is **unwelcome** to the original proponent, without challenging validity or core premises.  
  *   **Boundary:** "Refutation" requires demonstrating invalidity *or* falsity of a key substantive premise via the parallel. Mere embarrassment fails to refute.  
  *   *Status:* **Non-negotiable** for being a parody *at all*. Structural match is definitional. Refutation strength is **negotiable** (aim of the parodist).

  #### **2. Falsity of Conclusion**  
  *   **Core:** The parody's conclusion must be **uncontroversially false** or **demonstrably absurd** for the intended audience (ideally including the original proponent).  
  *   **Handling Disanalogies:**  
      *   Legitimate disanalogies block refutation *only* if they identify a **logically relevant difference** between the original predicate/operator and the parody's.  
      *   *Gaunilo Case:* Claiming "greatness" admits an intrinsic maximum while "island-perfection" does not is potentially legitimate *if* "admits an intrinsic maximum" is a **necessary condition** for the Anselmian argument form to work *and* is defensible independently.  
      *   *Generalization:* The restriction on predicates/operators (e.g., "positive properties") must be **non-question-begging**. If the *only* defense is "it works for God but not your thing," it fails.  
      *   *Unwelcome Conclusions:* Proving necessary existence of an arbitrary abstract entity (e.g., "the necessarily existent prime number 7") via Gödel-style axioms only refutes if: (a) The conclusion is incoherent/impossible, *or* (b) It forces acceptance of an absurd ontology the proponent rejects, *or* (c) It triggers "modal collapse" (everything necessary), which is absurd. Mere lack of prior opinion is insufficient.  
  *   *Status:* Uncontroversial falsity/absurdity is **non-negotiable** for a *refuting* parody. "Unwelcome" alone is insufficient. Legitimacy of disanalogy defense is **negotiable** (context-dependent).

  #### **3. Premise-Plausibility Parity**  
  *   **Core:** The credibility of the parody's *analogous premises* should be **comparable** to the original's for the argument's *intended audience*.  
  *   **Ad Hominem vs. Refutation:**  
      *   *Genuine Refutation:* Parody premises are **equally or more plausible** than the original's *to a neutral or sympathetic audience*. This forces reassessment of the original.  
      *   *Ad Hominem Exposé:* Parody premises are **plausible only to those who *already* reject the original's conclusion**. This exposes inconsistency/double standards in the *proponent*, but doesn't independently refute the argument.  
  *   **Line:** A parody refutes only if its premises retain plausibility **even for someone sympathetic to the original argument's conclusion**.  
  *   *Status:* Premise parity is **negotiable** and **audience-relative**. Crucial for *strength* of refutation, not for being a parody. Ad hominem exposés have dialectical value but are weaker refutations.

  #### **4. Diagnosis vs. Mimicry**  
  *   **Core:**  
      *   *Parody (Mimicry):* Must **run an analogous argument** leading to a different (false) conclusion.  
      *   *Diagnostic Objection:* **Explains why** the original argument fails (e.g., existence isn't a predicate, Kant's thalers; positivity axioms are flawed/arbitrary; modal collapse).  
  *   **Stability:** The distinction holds for modal arguments. Mimicry runs the derivation with a substituted operator/property. Diagnosis targets the definition/axioms (e.g., "positivity" is incoherent/context-dependent; axioms entail modal collapse).  
  *   **Placement:** Diagnostic objections are a **rival, often superior category**, not parodies. They attack the argument's *foundations* directly. A successful diagnostic objection often **invalidates potential parodies** by showing the original form is always unsound.  
  *   *Status:* Distinguishing mimicry (parody) from diagnosis is **non-negotiable** for categorization. Diagnostic objections are generally more powerful but serve a different function.

  ---

  ### **Additional Specifications per Request**

  1.  **Joint Unsatisfiability:** The requirements for **Exact Formal Parallelism (1)** and **Uncontroversial Falsity of the Conclusion (2)** are **jointly unsatisfiable in the strongest sense** against a determined proponent. *Why?* If the parallelism is truly exact (same logical form, same type of predicate/operator), the proponent can *always* claim a relevant disanalogy (e.g., "Only *this specific* predicate/operator has the required metaphysical properties"). Enforcing uncontroversial falsity *requires* a conclusion so absurd no disanalogy claim is plausible (e.g., modal collapse), but achieving this often *weakens* the formal parallelism (e.g., by using a blatantly incoherent operator). Parodies thus operate in the tension between these poles.
  2.  **Highest-Impact Requirement:** **Falsity of the Conclusion (2)** does the most work in disqualifying parodies. Many mimic the form well (Gaunilo, Anti-Gödel "any property" runs) but fail because proponents successfully argue the conclusion isn't *demonstrably* false/absurd (e.g., "An island *could* have an intrinsic maximum," "Your arbitrary property isn't 'positive'"). Parodies like the "Necessarily Non-Existential Perfect Being" often fail here too (is it impossible?).
  3.  **Differences for Anselmian vs. Gödelian Parodies:**
      *   **Anselmian (Conceptual/Predicate-Based):**
          *   Focus: Predicate legitimacy ("greatness," "perfection") and intrinsic maxima.
          *   Key Desiderata: (1) Structural match re: conceptual superiority & entailment; (2) *Demonstrable* falsity/absurdity of the parody entity's existence; (3) Parity in predicate plausibility (does "perfect island" make sense like "perfect being"?); Diagnosis targets existence-as-predicate.
      *   **Gödelian (Axiomatic/Modal):**
          *   Focus: Axiom plausibility (positivity, essence, necessity) and operator substitution.
          *   Key Desiderata: (1) Exact derivation match under substitution; (2) Falsity via absurdity (modal collapse, necessary existence of absurd/contingent entities); (3) Parity in *axiom* plausibility for the substituted operator/property; Diagnosis targets axiom coherence/consequences (modal collapse).
      *   *Consequence:* Gödelian parodies demand stricter **formal exactness** (derivation steps) and face a higher bar for **falsity** (must show absurdity, not just non-existence), but offer clearer targets for **diagnosis**.

  ---

  ### **Brief Scoring of Classic Parodies**

  *   **Gaunilo's Island (vs. Anselm):**  
      *   (1) Good structural mimicry. (2) **Fails Falsity:** Proponents effectively claim disanalogy (no intrinsic max for islands). (3) Premise parity debatable ("perfect island" coherence). (4) Mimicry. *Verdict:* Strong embarrassment, weak refutation. Dialectically useful, but blocked by disanalogy.
  *   **Maximally Evil Being (vs. Anselm/Gödel):**  
      *   (1) Good mimicry. (2) **Falsity Challenge:** Is a maximally evil being *impossible*? Arguably yes (evil as privation?), but not uncontroversial. Often deemed coherent. (3) Premise parity weak ("supreme evil" vs. "supreme goodness" plausibility differs). *Verdict:* Embarrassment, not strong refutation. Premise plausibility low for many.
  *   "**Necessarily Non-Existent Perfect Entity" (vs. Modal):**  
      *   (1) Good formal mimicry (substitute "non-existence-entailing" for "existence-entailing"). (2) **Falsity:** Conclusion is contradictory ("perfect" implies existence? "Necessarily non-existent" entity is impossible?). Depends on definitions. Not uncontroversially false to all. *Verdict:* Interesting challenge to definitions, but falsity not guaranteed. Often dismissed via definitional tweaks.
  *   **"Run-it-on-any-Property" (e.g., Anti-Gödel):**  
      *   (1) Excellent formal mimicry. (2) **Falsity Critical:** Succeeds only if the chosen property leads to **modal collapse** or necessary existence of an **uncontroversially contingent/absurd entity** (e.g., a necessary banana). Else, disanalogy claims ("not positive") block falsity. (3) Premise parity weak if using arbitrary properties. *Verdict:* Potentially strong refutation *if* it forces modal collapse or an absurd necessary entity. Otherwise, exposes axiom sensitivity.
  *   **Kant's 100 Thalers / Existence not a Predicate:**  
      *   (1) **Not a Parody** (Diagnosis). (2+) Directly attacks premise/definition. *Verdict:* Powerful diagnostic objection, not a parody. Bypasses the mimicry game.

  ---

  This specification provides clear criteria to categorize, prioritize, and dismiss parodies in your dissertation. Focus sustained treatment on parodies scoring highly on *Formal Parallelism* and *Falsity*, while acknowledging the dialectical role of weaker ones. The tension between exact mimicry and uncontestable absurdity is where the deepest philosophical work lies.
