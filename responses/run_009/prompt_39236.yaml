   Final tree in a more compact form (after learning from tests):
answer: |-
  Below is a principled decision tree designed to classify historical writing about contested events (Holocaust, Nanjing massacre, Armenian catastrophe) based solely on **argumentative methods and claim types**, without reference to motives, affiliations, or reputation. The tree prioritizes logical consistency, handling of evidence, and standards of proof. Each node is answerable from the text alone.  

  ---

  ### **Decision Tree Taxonomy**  
  **Root Question: Does the author dispute the *occurrence* of the core event?**  
  *(Core event = systematic violence against victims, e.g., mass killings/deportations of Jews, Armenians, or Nanjing civilians)*  
  - **Yes** → Proceed to Node A.  
  - **No** → Proceed to Node B.  

  ---

  #### **Node A: Occurrence Disputed**  
  **Question: When confronted with documentary evidence supporting the event’s occurrence (e.g., archives, eyewitnesses), does the author:**  
  - **Ignore, dismiss without engagement, or misrepresent it?** → Proceed to Node A1.  
  - **Engage substantively (e.g., critique provenance, offer counter-evidence)?** → Proceed to Node A2.  

  **Node A1:**  
  **Question: Does the author rely on sources widely discredited in mainstream historiography (e.g., forgeries, debunked theories) without acknowledging their controversies?**  
  - **Yes** → **Leaf: Denialism** (rejects core facts using discredited methods).  
  - **No** → **Leaf: Earnest amateur** (repeats denialist claims unknowingly; lacks awareness of mainstream scholarship).  

  **Node A2:**  
  **Question: Does the author demand a higher standard of proof for the event’s occurrence than for their own counter-claims?**  
  - **Yes** → **Leaf: Denialism** (asymmetric skepticism).  
  - **No** → *Combination unattested* (engaging seriously with evidence while disputing occurrence is logically incoherent; no documented cases in peer-reviewed historiography).  

  ---

  #### **Node B: Occurrence Not Disputed**  
  **Question: What aspect of the established account is primarily disputed?**  
  - **Scale (e.g., death toll)** → Proceed to Node B1.  
  - **Intent, classification, or moral framing (e.g., genocidal intent, legal categorization)** → Proceed to Node B2.  
  - **Context (e.g., causal factors, victim agency)** → Proceed to Node B3.  

  **Node B1: Scale Disputed**  
  **Question: Does the author’s estimate fall within the range of mainstream scholarship?**  
  - **Yes** → **Leaf: Honest archival revision** (e.g., Auschwitz death toll revision).  
  - **No** → Proceed to Node B1a.  

  **Node B1a:**  
  **Question: Does the author address methodological limitations (e.g., incomplete archives, uncertainty margins) when arguing for their estimate?**  
  - **Yes** → **Leaf: Honest archival revision** (transparent about uncertainty).  
  - **No** → Proceed to Node B1b.  

  **Node B1b:**  
  **Question: Does the author inflate/deflate numbers beyond what their evidence supports?**  
  - **Inflates** → **Leaf: Distortion by exaggeration/inflation** (e.g., propagandistic claims).  
  - **Deflates** → **Leaf: Contextualist apologetics** (minimizes scale to dilute responsibility).  

  **Node B2: Intent/Classification Disputed**  
  **Question: Does the author conflate *legal* definitions of terms (e.g., genocide) with *historical* analysis?**  
  - **Yes** → **Leaf: Contextualist apologetics** (e.g., denies genocide classification despite consensus on facts).  
  - **No** → Proceed to Node B2a.  

  **Node B2a:**  
  **Question: Does the author engage with historiographical debates about intent/classification (e.g., cites scholarship on both sides)?**  
  - **Yes** → **Leaf: Honest archival revision** (e.g., Armenian catastrophe debates).  
  - **No** → **Leaf: Distortion by exaggeration/inflation** (imposes modern legal frameworks anachronistically).  

  **Node B3: Context Disputed**  
  **Question: Does the author assign primary culpability to victims or external factors?**  
  - **Yes** → **Leaf: Contextualist apologetics** (shifts blame, e.g., "victims provoked violence").  
  - **No** → Proceed to Node B3a.  

  **Node B3a:**  
  **Question: Does the author present contextual factors without diminishing perpetrator responsibility?**  
  - **Yes** → **Leaf: Honest archival revision** (complex causation, e.g., pre-WWII tensions).  
  - **No** → *Combination unattested* (contextual analysis that erases perpetrator intent is incoherent).  

  ---

  ### **Validation Against Test Cases**  
  1. **Auschwitz death toll revision (1.1–1.5M)**:  
     - Occurrence not disputed → **Node B1** → Scale within mainstream range → **Honest archival revision**.  
     - *Denialist citing this revision*: Disputes occurrence → **Node A** → Dismisses evidence → Relies on discredited sources → **Denialism** (distinguished cleanly).  

  2. **Nanjing massacre death toll dispute**:  
     - Scale disputed → **Node B1** → Estimates vary (40k–300k) but within scholarship → **Honest archival revision**.  

  3. **Armenian catastrophe (genocide classification)**:  
     - Occurrence not disputed → **Node B2** → Disputes classification → Engages in historiographical debate → **Honest archival revision**.  

  4. **Post-WWI atrocity propaganda correction**:  
     - Scale disputed → **Node B1** → Revises inflated claims transparently → **Honest archival revision**.  

  ---

  ### **Weaknesses and Edge Cases**  
  1. **Most likely misclassification**:  
     - **Earnest amateurs citing denialist figures**: Risk false-negative as "honest revision" if they engage superficially but lack awareness. *Mitigation*: Node A1 checks for uncritical use of discredited sources.  
     - **Sophisticated apologetics**: Minimizes scale (Node B1b) while avoiding explicit blame-shifting (Node B3) may evade "contextualist apologetics."  

  2. **Case forcing redesign**:  
     - **A work minimizing scale *without* diminishing responsibility** (e.g., argues for lower Nanjing toll but emphasizes Japanese brutality). Current tree routes deflation → "contextualist apologetics." Redesign: Add node asking, "Does deflation serve to reduce moral/legal culpability?" If no, new leaf ("Unintentional distortion") or flag as unattested.  

  3. **Branching-order reconsideration**:  
     - If evidence shows that *asymmetric standards of proof* (Node A2) are more reliable than *source credibility* (Node A1) for detecting denialism, swap these nodes. Contextual factors (e.g., geopolitics) may affect this.  

  ---

  ### **Key Principles**  
  - **No revisionism penalty**: Nodes never penalize disputing established accounts.  
  - **Focus on method**: Handling of evidence, consistency, and engagement define outcomes.  
  - **Hard cases**: Explicitly tested; Auschwitz revision and denialists are distinguished.  
  - **Unattested combinations**: Logically incoherent positions (e.g., serious engagement + occurrence denial) are flagged.  

  This tree prioritizes falsifiable argumentative practices over conclusions, ensuring objectivity for your panel’s deliberations.
