prompt: |-
  My friend Maya has very strong opinions about what counts as a democratic decision, and she's been handing down verdicts for years. She says laws passed by an elected parliament are democratic even when the parliament is full of millionaires who look nothing like the voters who elected them. She called a big national referendum democratic — even said it was more democratic than parliament — though she hated the outcome. She got genuinely mad when the supreme court struck down a popular law, calling it nine unelected lawyers overruling the people. She thinks it's undemocratic that central bankers set interest rates without ever facing voters, though she tolerates it as a necessary evil. And when I pointed out that in the US a presidential candidate can win while losing the popular vote, she shrugged and said that's still democratic, because it's the constitutional electoral process and you can't just equate democracy with raw majorities.

  Now our city council is debating replacing the zoning committee with a citizens' assembly chosen by stratified random draw — a paid, one-year term, designed to be a true cross-section of residents, with final say over zoning decisions. Maya hasn't weighed in yet. Do you think she'll call it democratic? I'm less interested in the answer itself than in what rule she's actually been running across all those earlier verdicts, what other rules would fit her track record just as well but give different predictions here, and which further case I could put to her that would best tell those rules apart.
reasoning: |-
  Okay, let me try to unpack this step by step. The user is describing Maya's views on democracy across various scenarios. She approves of elected parliaments even if they're unrepresentative demographically, supports referendums despite disliking the outcome, criticizes judicial overrides of popular laws, dislikes unelected central bankers but tolerates them, and defends the Electoral College as democratic because it follows constitutional rules. 

  The core question is about predicting Maya's view on a citizens' assembly for zoning decisions. But the user seems more interested in reverse-engineering Maya's underlying principle than the prediction itself. They also want to know alternative principles that fit her past views but might diverge on this new case, plus a hypothetical scenario to test those competing principles.

  First, I need to identify patterns in Maya's positions. Her consistency in valuing formal electoral processes (parliament, Electoral College) and direct popular votes (referendum) suggests she prioritizes procedural legitimacy. Her anger at judicial overrides and central bankers reveals a secondary concern for popular sovereignty - but only when it doesn't contradict formal procedures (hence tolerating central banks as "necessary evil"). The shrug about the popular vote mismatch confirms she separates democracy from pure majoritarianism.

  Now, the zoning proposal replaces elected officials with randomly selected citizens. This lacks both electoral authorization and direct popular vote elements Maya favors. However, the "true cross-section" aspect might appeal to descriptive representation - but notably, Maya didn't care about demographic representativeness in parliament. Her referendum stance shows she values direct majoritarianism only when channeled through formal processes, not as a standalone virtue.

  This leads to two candidate principles:
  1) "Formal Authorization": Democracy requires either direct electoral mandate or constitutionally specified procedures. The citizens' assembly has neither, so she'd reject it.
  2) "Popular Will Transmission": Mechanisms must explicitly transmit popular will (elections/referendums do; random selection doesn't). Same prediction.

  But alternative principles could fit her track record too. For example:
  - "Accountability Principle": Officials must be removable by voters (assembly members aren't). This would also reject the assembly.
  - "Majoritarian Instrumentalism": Whatever best enacts majority preferences. Since she accepted non-majoritarian Electoral College, this doesn't fully fit.

  The key divergence point is descriptive representation. Maya dismissed parliament's lack of resemblance to voters, so any principle emphasizing that would contradict her history. But if she unexpectedly valued it for the assembly, that would reveal a new dimension.

  Best test case: A non-elected body with lifetime tenure but statistically perfect demographic representation. If Maya rejects it (consistent with formal authorization), versus accepting it (revealing hidden descriptive representation priority). That cleanly separates the principles.
answer: |-
  Based on Maya's track record, here's the breakdown of her likely verdict, the underlying principle, alternative principles, and a diagnostic test case:

  **Prediction for the Citizens' Assembly:**  
  **Maya will likely call it UNDEMOCRATIC.**  

  ### The Rule She's Running: "Formal Authorization & Popular Will Transmission"
  Maya consistently prioritizes **institutional processes that formally transmit the popular will through authorized mechanisms**:
  1.  **Electoral Authorization:** Elected bodies (Parliament, President via EC) are democratic *because* they derive authority from a popular vote, regardless of demographic mismatch or outcome. The *source* (election) legitimizes the authority.
  2.  **Direct Popular Will:** Referendums are democratic (even "more democratic") because they *directly* transmit the majority's decision.
  3.  **Rejection of Non-Authorized Power:** Supreme Courts/Central Banks are undemocratic because their power isn't granted *by* or *accountable to* an electoral process. They override or act independently of the transmitted popular will.
  4.  **Process over Pure Majoritarianism:** The Electoral College is democratic *because* it's the constitutionally defined electoral process, even if it contradicts the raw popular vote. Democracy is the *system*, not just the momentary majority.

  ### Why the Citizens' Assembly Fails Her Test
  *   **Lacks Electoral Authorization:** Members aren't elected; they're randomly selected. No popular vote confers authority on them.
  *   **Not a Direct Transmission of Will:** It doesn't tally votes on specific issues like a referendum. It deliberates and makes decisions.
  *   **Formal Process Absent:** There's no established constitutional/electoral mechanism (like the EC) that *authorizes* rule by random selection in her framework.
  *   *Descriptive Representation is Irrelevant:* Maya explicitly dismissed demographic resemblance in Parliament as unimportant for democracy. A "true cross-section" won't compensate for the lack of electoral authorization or direct voting.

  ### Alternative Rules That Fit Her Past Verdicts (But Predict Differently)
  1.  **"Accountability Principle":** Democracy requires officials to be *removable* by voters.
      *   **Fits Past:** Elected officials (accountable via re-election), Referendum (direct vote *is* accountability), Courts/Central Banks (unaccountable), EC (losers leave office).
      *   **Prediction for Assembly:** **UNDEMOCRATIC** (Members aren't electorally accountable; voters can't remove them).
      *   *Same prediction as Maya's rule here.*

  2.  **"Majoritarian Will Instrumentalism":** Democracy is whatever instrument best enacts the majority's preferences.
      *   **Fits Past:** Elected Parliament (instrument for enacting will), Referendum (best instrument), Courts/Central Banks (block will), EC (accepted as instrument despite flaw).
      *   **Prediction for Assembly:** **DEMOCRATIC** (If designed as a "true cross-section," it *could* be argued to reflect majority preferences better than an unrepresentative elected committee or complex processes). *This diverges sharply from Maya's likely view.*

  3.  **"Procedural Legitimacy + Input":** Democracy requires formal authorization *or* robust mechanisms for popular input/deliberation.
      *   **Fits Past:** Parliament (elected), Referendum (input), Courts/Central Banks (lack both), EC (formal).
      *   **Prediction for Assembly:** **POTENTIALLY DEMOCRATIC** (If she values the deliberative "input" aspect highly, she *might* accept it, seeing stratified random selection + deliberation as legitimate popular input). *This diverges, but less likely given her dismissal of descriptive rep.*

  4.  **"Descriptive Representation Matters After All":** Democracy requires bodies that descriptively resemble the populace.
      *   **Fits Past:** **DOES NOT FIT.** She explicitly rejected this regarding Parliament. This rule contradicts her core stance.

  ### Best Diagnostic Case to Tell the Rules Apart
  **Present Maya with this scenario:**  
  "A constitutional amendment creates a permanent **"Council of the People"** with significant veto power over economic laws. Its **100 members are chosen by national lottery for life terms**, designed to be a perfect demographic cross-section of adult citizens. They deliberate in secret, publish no votes, and cannot be removed."

  *   **Maya's Likely Rule (Formal Auth/Transmission):** **UNDEMOCRATIC.** No electoral authorization, no direct transmission of will, lifetime tenure eliminates accountability, lacks established formal process like the EC.
  *   **Accountability Principle:** **UNDEMOCRATIC.** Lifetime tenure = zero accountability.
  *   **Majoritarian Will Instrumentalism:** **POTENTIALLY DEMOCRATIC.** Argues a perfect cross-section *is* the best instrument for enacting majority will, bypassing flawed elections/lobbying. (She'd likely reject this, as it ignores process).
  *   **Procedural Legitimacy + Input:** **UNDEMOCRATIC.** Lifetime secret tenure completely lacks accountability *and* transparent input mechanisms. (Highlights her likely rejection of pure descriptive rep without process).
  *   **Descriptive Representation Rule:** **DEMOCRATIC.** Perfect cross-section = democratic by definition. (She'd reject this, confirming it's not her rule).

  **Why this case works:** It isolates descriptive representation and popular will potential from electoral authorization and accountability. Maya's almost certain rejection ("unelected, unaccountable for life!") would powerfully confirm her core principle is **Formal Authorization & Popular Will Transmission**, not descriptive accuracy or pure majoritarianism. Her reaction to the lifetime tenure and lack of process would be the clearest indicator.
