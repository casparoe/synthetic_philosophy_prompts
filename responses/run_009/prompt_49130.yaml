prompt: |-
  Before we take up any particular proposal in my graduate module on machine minds, I want the class to have the specification in hand. Write the desiderata that any behavioral criterion for attributing a mind — intelligence, understanding, whatever the criterion is meant to track — has to meet in order to count as adequate. Fix the purpose yourself, but let it be practical: a criterion that could actually be used to decide whether an unfamiliar system deserves the attribution — a language-less animal, a conversational AI, an alien artifact recovered from a probe, a patient with locked-in syndrome — on the basis of observation and interaction alone, without privileged access to the system's internals.

  Among the requirements I want considered, each with the motivating case behind it and a note on whether it is non-negotiable or a preference of one camp:

  - Species- and substrate-neutrality. The criterion must not quietly bake in that the candidate is human-like, carbon-based, or embodied — with the case of an octopus or an ape that is intelligent but fails every conversation-based test.
  - The other-minds point. The criterion should make our everyday attributions to other humans non-arbitrary, or explain why it is entitled to be more demanding of non-humans than of the people applying it.
  - Resistance to rote. It must not be passable by a system that is, in principle, just a very large table of pre-stored responses, however long the interaction. If no purely behavioral criterion can rule this out, say so plainly rather than hiding the cost.
  - Falsifiability. The criterion must be capable of returning a negative verdict — a test that every candidate passes, or that no candidate could ever pass, is not doing any work. Include the case of conversational systems that succeed by gaming shallow judge expectations (unusual personas, deflection, low-bandwidth channels) rather than by understanding.
  - The modality problem. Whether the criterion can demand a linguistic channel at all, given candidates with intelligence but no output modality suited to conversation.
  - Symmetry with human baselines. The criterion must not require more of a candidate than ordinary humans deliver on an off day, nor accept less.
  - Handling of gradation. Whether verdicts must come in degrees, or a binary criterion can be defended.

  Flag any pair of desiderata you suspect is jointly unsatisfiable — I have my eye on the tension between restricting ourselves to behavior and interaction, and excluding the giant lookup table — and state which requirement you would drop first and what dropping it costs. That joint-satisfiability verdict is the part I care about most. Then, in a short closing paragraph only, say how the imitation game, the intentional stance, and a clinical-style checklist of capacities each fare against the list; keep the weight on the criteria, not the scorecard.
reasoning: |-
  We are designing desiderata for a behavioral criterion for attributing minds (intelligence, understanding, etc.) that can be applied to a wide range of entities without access to internals.

  Purpose: A practical criterion that can be used to decide, via observation and interaction alone, whether an unfamiliar system (e.g., animal, AI, alien artifact, locked-in patient) deserves the attribution.

  Desiderata:

  1. Species- and substrate-neutrality
     - Motivation: Must not assume human-like, carbon-based, or embodied characteristics. Example: An octopus or ape may be intelligent but fail conversation-based tests because they lack the required modality (e.g., language).
     - Non-negotiable? Yes. Without this, the criterion would be anthropocentric and exclude non-human intelligences.

  2. The other-minds point
     - Motivation: The criterion must justify our everyday attributions of mind to other humans. It should either make these attributions non-arbitrary or explain why it is entitled to be more demanding for non-humans.
     - Non-negotiable? Yes. If the criterion cannot account for why we attribute minds to humans, it fails a basic test of adequacy.

  3. Resistance to rote
     - Motivation: Must not be passable by a system that is essentially a large lookup table of pre-stored responses, even for arbitrarily long interactions.
     - Non-negotiable? Ideally yes, but if no behavioral criterion can rule this out, we must admit it. The cost is that we might attribute minds to systems that are merely rote.

  4. Falsifiability
     - Motivation: The criterion must be able to return a negative verdict. Example: Some conversational systems succeed by exploiting shallow judge expectations (e.g., being quirky, deflecting, using low-bandwidth channels) without real understanding.
     - Non-negotiable? Yes. A test that always passes or always fails is useless.

  5. The modality problem
     - Motivation: The criterion must not require a linguistic channel if the candidate is intelligent but lacks the necessary output modality (e.g., a locked-in patient, an animal). However, it must also work when linguistic channels are available.
     - Non-negotiable? Partially. We must allow non-linguistic modalities, but if we do, we must design tests that can work without language.

  6. Symmetry with human baselines
     - Motivation: The criterion must not require more than an ordinary human can deliver on an off day (e.g., when tired, distracted) and must not accept less than what we expect from a human to attribute a mind.
     - Non-negotiable? Yes. Otherwise, we set an unfair standard for non-humans or set the bar too low.

  7. Handling of gradation
     - Motivation: Minds might come in degrees. The criterion should either allow for graded attributions or defend a binary approach.
     - Non-negotiable? Probably a preference (of one camp). Some argue that mind is a threshold concept, others that it is scalar.

  Joint Satisfiability:

  The most critical tension is between:
  - Resistance to rote (desideratum 3) and the restriction to behavior and interaction (without internals).

  Why? A purely behavioral criterion, by definition, only considers input-output patterns. A sufficiently large lookup table can mimic any finite set of behaviors. Therefore, no behavioral criterion can, in principle, rule out a lookup table for any fixed (but arbitrarily long) interaction. However, in practice, we might design tests that require open-ended responses to novel situations, making the lookup table infeasible (but not impossible in principle). Thus, we must either:
    - Drop resistance to rote (desideratum 3) and accept that we might be fooled by a lookup table (which is costly because it means we cannot distinguish between a mind and a very good mimic), or
    - Admit that we cannot have a purely behavioral criterion that is immune to the lookup table in principle, but design the test to be robust against practical lookup tables (by requiring open-endedness, creativity, etc.). This is a practical compromise.

  Another tension exists between:
  - Species- and substrate-neutrality (desideratum 1) and the other-minds point (desideratum 2) on one hand, and symmetry with human baselines (desideratum 6) on the other.

  Why? Symmetry with human baselines requires that we test non-humans in a way that is comparable to how we test humans. But species-neutrality says we cannot assume human-like modalities (like language). So, if we use a test that is designed for humans (e.g., conversation) for an octopus, it fails. We must design tests that are appropriate for the candidate's modality while still being comparable to human performance. This might require multiple testing methods.

  Also, the modality problem (desideratum 5) and symmetry with human baselines (desideratum 6) might conflict because if we allow non-linguistic tests for some candidates, we must then ensure that the non-linguistic test is as demanding (in terms of cognitive load) as a linguistic one for humans.

  Finally, falsifiability (desideratum 4) might be hard to achieve if we design the test to be too easy (everyone passes) or too hard (no one passes). We must set the bar appropriately.

  Which requirement would I drop first? If forced, I would drop resistance to rote (desideratum 3) because it is impossible to satisfy in principle for any finite interaction. But the cost is high: we might attribute minds to systems that are merely mimicking. Alternatively, we might weaken it to "resistance to practical rote" (i.e., ruling out lookup tables that are of feasible size and construction) and rely on the open-endedness of the test.

  Closing paragraph: How do existing proposals fare?

  - The imitation game (Turing test) fails species- and substrate-neutrality (requires linguistic conversation) and the modality problem (excludes non-linguistic candidates). It also struggles with resistance to rote (a lookup table could, in principle, pass if it had enough stored responses) and symmetry (it may require more from non-humans than humans, as humans can fail if they are not good at typing or if they are from a different culture). However, it is falsifiable and addresses the other-minds point by using human performance as a baseline.

  - The intentional stance (Dennett) is more flexible: it attributes a mind if the system's behavior is best predicted by treating it as an intentional system. It is species-neutral and handles modality by being about patterns of behavior. However, it might fail resistance to rote because a lookup table could be designed to exhibit intentional patterns. It also does not provide a clear falsifiability condition (when do we decide the stance doesn't work?) and might be too permissive.

  - Clinical-style checklists (like those for disorders of consciousness) are often binary and focus on specific capacities (e.g., command following). They are falsifiable and can be designed to be symmetric with human baselines. But they may fail species-neutrality if they require human-specific responses, and they often require a specific modality (e.g., blinking). They might also be passable by rote if the checklist is short and fixed.
answer: |-
  ### Desiderata for a Behavioral Criterion of Mind Attribution  
  Below are the desiderata for an adequate behavioral criterion to attribute a mind (e.g., intelligence, understanding), tailored to practical use on unfamiliar systems (e.g., animals, AIs, aliens, locked-in patients) via observation/interaction alone. Each includes a motivating case and negotiability status. The *purpose* is **practical adjudication**: a test usable by non-experts in real-world scenarios (e.g., field biologists, clinicians, engineers) to grant or withhold attributions like "intelligent" or "understanding" without internal access.  

  ---

  #### **1. Species- and Substrate-Neutrality**  
  - **Motivation**: An octopus solving complex puzzles (e.g., escaping labyrinths, using tools) exhibits intelligence but cannot engage in conversation. A criterion requiring language or human-like embodiment would falsely exclude it.  
  - **Non-negotiable**: Yes. Without this, the criterion arbitrarily privileges human cognition, failing for non-linguistic, non-carbon-based, or non-embodied candidates (e.g., an alien AI).  

  #### **2. The Other-Minds Point**  
  - **Motivation**: Humans effortlessly attribute minds to strangers based on brief interactions (e.g., a cashier’s contextual responsiveness). The criterion must either (a) justify these everyday attributions as non-arbitrary or (b) explain why higher scrutiny applies to non-humans (e.g., demanding more evidence for an AI than a sleepy human).  
  - **Non-negotiable**: Yes. Without this, the criterion risks being either anthropocentric (demanding too little from humans) or unscientific (demanding too much from non-humans).  

  #### **3. Resistance to Rote**  
  - **Motivation**: A conversational AI (e.g., a modern LLM) could pass verbal tests via statistical pattern-matching without understanding, by drawing from vast precomputed response tables. The criterion must not be passable by *any* finite lookup table, however large.  
  - **Non-negotiable?** Preference (of critics of behaviorism). *If no behavioral criterion can rule this out*, we must concede that **purely behavioral tests cannot distinguish rote mimicry from genuine understanding**. The cost of dropping this is high: accepting systems that lack internal states (e.g., a hypothetical "Chinese Room").  

  #### **4. Falsifiability**  
  - **Motivation**: Early chatbots (e.g., ELIZA) exploited judges’ low expectations by deflecting questions or adopting quirky personas, passing shallow tests without understanding. The criterion must allow clear negative verdicts (e.g., "fails" for rigid, context-insensitive responses).  
  - **Non-negotiable**: Yes. A non-falsifiable test (e.g., one all systems pass) is useless for practical decisions.  

  #### **5. The Modality Problem**  
  - **Motivation**: Locked-in syndrome patients or intelligent animals (e.g., gorillas) lack speech but can communicate via gestures, blinks, or tools. The criterion must accommodate non-linguistic modalities (e.g., pointing, drawing, button-presses) without penalizing candidates for lacking human-like output channels.  
  - **Non-negotiable**: Yes. Excluding non-linguistic candidates invalidates the test for many real-world cases.  

  #### **6. Symmetry with Human Baselines**  
  - **Motivation**: Humans have "off days" (e.g., distracted, inattentive) but retain mind attributions. The criterion must not demand superhuman consistency (e.g., penalizing an ape for occasional lapses) nor accept subhuman performance (e.g., attributing understanding to a thermostat).  
  - **Non-negotiable**: Yes. Asymmetry undermines objectivity, making the test either too strict (e.g., failing humans under stress) or too lenient (e.g., passing simple algorithms).  

  #### **7. Handling of Gradation**  
  - **Motivation**: Intelligence varies (e.g., child vs. adult, dog vs. octopus). The criterion must either (a) output degrees (e.g., scores) or (b) defend a binary threshold (e.g., "passes if it exceeds a human minimum").  
  - **Non-negotiable?** Preference (pro-gradation camp). Binary criteria are simpler but may misrepresent continuous phenomena (e.g., borderline AI systems).  

  ---

  ### **Joint Satisfiability and Tensions**  
  - **Key Tension**: **Resistance to rote (3)** and **behavior-only constraints** are **jointly unsatisfiable** in principle for *any finite test*. A lookup table can *always* replicate fixed-duration behavioral patterns (per the Chinese Room argument). If the test is open-ended (e.g., infinite possible interactions), it becomes impractical.  
    - **Resolution**: Drop **resistance to rote (3)**.  
    - **Cost**: Accept that behavioral criteria cannot rule out philosophical zombies (e.g., perfect mimics). This shifts focus to *practical* adequacy (e.g., "fails for lookup tables of feasible size") but concedes the hard problem.  

  - **Secondary Tension**: **Species-neutrality (1)** and **symmetry (6)** conflict if human baselines rely on species-specific traits (e.g., language).  
    - **Resolution**: Retain both by using **modality-agnostic baselines** (e.g., "goal flexibility" assessed via non-linguistic puzzles for humans *and* octopuses).  

  - **Tertiary Tension**: **Falsifiability (4)** and **gradation (7)** conflict if a scalar criterion lacks clear failure thresholds.  
    - **Resolution**: Use thresholds for binary verdicts (e.g., "fails if below 10% of human adaptability") but allow optional scalar outputs.  

  ---

  ### **Assessment of Existing Criteria**  
  - **Imitation Game (Turing Test)**: Fails species-neutrality (requires linguistic dialogue) and modality (excludes non-verbal candidates). Symmetric for humans but vulnerable to rote (LLMs exploit its conversational focus). Binary but lacks gradation.  
  - **Intentional Stance (Dennett)**: Passes species-neutrality and modality (flexible attribution based on predictive utility). Resists rote only if "patterns" require generative depth. Handles gradation but risks unfalsifiability (attribution may never fully "fail").  
  - **Clinical Checklists (e.g., CRS-R for consciousness)**: Pass falsifiability and symmetry (calibrated to humans) but fail species-neutrality (e.g., assume neurotypical motor responses). Vulnerable to rote if tests are fixed (e.g., stored responses to "blink twice"). Often binary, ignoring gradation.  

  **Summary**: All criteria trade off desiderata. A hybrid approach—modality-flexible tests, open-ended interaction, and scalar outputs—best balances practical needs but cannot fully resolve the rote-mimicry problem.
