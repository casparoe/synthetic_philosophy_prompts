answer: |-
  ### Essay Question  
  Consider a consumer who, when facing identical budget sets (same prices, income, and options) on multiple occasions, chooses bundle A approximately 70% of the time and bundle B 30% of the time. Standard revealed preference theory assumes choices are unique and stable for a given budget set. Using this scenario, address:  
  1. **Status of Revealed Preference**: Is the claim "preferences are revealed by choices" a *stipulative definition* (preference = whatever choice reveals), an *empirical hypothesis* (choices reliably indicate inner mental states), or a *measurement convention* (a tool to model behavior)? Justify your view.  
  2. **Circularity & Absorption**: Does this consumer’s behavior break revealed preference theory? If not, how might the theory absorb it (e.g., redefining objects of choice)? What conceptual costs does this absorption impose?  
  3. **Meaning of Utility**: If preferences are defined by choice dispositions:  
     - Are utility levels merely summaries of choice frequencies?  
     - Can we meaningfully discuss "utility gains" or interpersonal comparisons of utility?  

  ---

  ### Model Answer (Definite Position)  
  *(~600 words; position: revealed preference is a measurement convention with empirical stakes)*  

  The revealed preference program is fundamentally a **measurement convention**, not a stipulative definition or pure empirical hypothesis. It provides a method to model choice data *as if* agents maximize a preference ordering. Samuelson’s insight was that we can construct a utility representation from choices without assuming cardinal mental states. However, this convention carries implicit empirical commitments: it assumes choices satisfy axioms like stability and transitivity. When choices violate these (e.g., our consumer’s probabilistic selections), the convention’s usefulness—and its empirical validity—are tested.  

  **Circularity is inherent but not vicious**. Defining preference via choice *enables* the theory to avoid unobservable mental entities. Yet this creates tension: if "preference" is just a label for observed choices, it cannot *explain* those choices without circularity. Here, the measurement convention reveals its empirical vulnerability. Our consumer’s split choices break the standard model because they violate the Weak Axiom of Revealed Preference (WARP), which demands unique choices per budget set.  

  **The theory can absorb this anomaly—at a cost**. One approach redefines choice objects: instead of bundles, the consumer "chooses" lotteries yielding A or B with fixed probabilities. Now, her 70/30 split reflects a stable preference for the lottery "70%A, 30%B" over alternatives. Alternatively, we could treat *choice frequencies* as primitives, defining "stochastic preference." Both strategies preserve the convention but alter its ontology. The cost? The theory now "explains" choices by redescribing them in more complex terms (e.g., meta-preferences over gambles). This risks trivialization: if any choice pattern can be absorbed by redefining options, the theory loses predictive content.  

  **Utility becomes a summary of stochastic dispositions**. If preference is defined by choice frequencies, utility is ordinal only in ranking these dispositions (e.g., preferring the 70/30 lottery over a 50/50 one). Crucially:  
  - **Utility gains**: Cardinal utility *could* emerge if we impose additional structure (e.g., assuming risk attitudes over lotteries). But without such structure, "utility gains" lack meaning—they reflect arbitrary numerical scales.  
  - **Interpersonal comparisons**: These remain undefined. If utility summarizes idiosyncratic choice dispositions, comparing them across agents is like comparing units without a common ruler. To enable comparisons, we must introduce new conventions (e.g., assuming identical risk preferences), but this moves beyond pure revealed preference.  

  **Conclusion**: Revealed preference is a convention for modeling behavior. Its circular core is pragmatic: it avoids mentalistic speculation. But when faced with anomalies like probabilistic choice, it must either exclude them (upholding WARP but limiting scope) or expand its formalism (risking vacuity). Utility, on this view, is a numerical shadow of choice patterns—not a psychic quantity.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points**:  
  1. **Status of revealed preference** (6 marks):  
     - Identifies it as a measurement convention (2)  
     - Explains *why* (avoids mentalism, enables modeling) (2)  
     - Notes empirical stakes (axioms test coherence) (2)  
  2. **Circularity & absorption** (8 marks):  
     - Acknowledges circularity (preference defined by choice explains choice) (2)  
     - Notes the 70/30 consumer breaks WARP/stability (2)  
     - Describes absorption strategy (e.g., lotteries, stochastic preferences) (2)  
     - Identifies cost (trivialization/descriptive not predictive) (2)  
  3. **Utility implications** (6 marks):  
     - States utility summarizes choice dispositions (2)  
     - Rejects cardinal utility/interpersonal comparisons *without new structure* (2)  
     - Qualifies how structure (e.g., risk) could enable cardinality (2)  

  **A/B Boundary**:  
  - **A (17–20)**: Explicitly grapples with the definition/explanation tension. Shows that absorption strategies trade explanatory power for flexibility.  
  - **B (13–16)**: Correctly analyzes each part but treats "preference defined by choice" and "choice explained by preference" as independent observations without confronting the circularity’s implications.  
  - **C (10–12)**: Misses circularity or costs of absorption; superficial utility discussion.  
  - **D/F (<10)**: Textbook recitation; ignores scenario or core questions.  

  *(Note: "Definition/explanation tension" = The theory uses choice to define preference, then uses preference to explain choice. Top answers must show this undermines empirical content when anomalies arise.)*
