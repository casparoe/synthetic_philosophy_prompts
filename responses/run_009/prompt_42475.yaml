prompt: |-
  I'm talking to my department's psych reading group next month about the free energy principle — thirty minutes, whiteboard, audience is social psych grad students, so they're comfortable with stats and standard cognitive science vocabulary but have never actually read Friston, most of them just know his name gets thrown around. Plan the session for me; don't just explain the principle, I need the plan.

  Main things I want sorted: the ordering. I keep flip-floping between starting with Helmholtz-style perception-as-inference (so the brain-as-scientist image is in place first) and starting with prediction error minimization directly. My worry is one of these makes the "free energy" concept feel like a tacked-on gimmick rather than the natural next step, but I can't tell which. Then the carrying example — I've been using the Necker cube but I suspect it's too cute, and more importantly it's passive, it does nothing to set up action. Is there one example that can carry perception AND action, or should I switch examples partway through, and if so where?

  Misconceptions: I know three are coming. "Free energy IS prediction error" (which is close enough to right in one special case that a flat denial will lose them), "the whole thing just says the brain is lazy and economizes effort," and "it's unfalsifiable, so why does anyone care." For each, tell me where in the sequence it needs to be headed off and whether it's better to defuse it preemptively or let someone raise it. And is there a fourth misconception, worse than these, that I'm not anticipating?

  Also: what should I openly refuse to cover in thirty minutes — the variational math, active inference in full, the extension to self-organization in cells and literally everything alive — and how do I declare something off-limits without it sounding like a dodge?

  End with a final line in exactly this form, one short phrase, no sentence around it:

  \final{...}

  ...giving the single misconception most likely to sink the whole session if it isn't headed off.
reasoning: |-
  Okay, let's tackle this step by step. The user is planning a 30-minute session on the Free Energy Principle (FEP) for social psych grad students. They need a clear structure, handling of misconceptions, and strategic omissions. 

  First, the core challenge: balancing perception-as-inference vs prediction error minimization as starting points. Helmholtz first feels more intuitive because it builds a familiar foundation—brains as hypothesis-testers. Jumping straight to prediction error might feel abrupt. But the key is to show FEP as the umbrella theory that naturally extends beyond perception. 

  For the example: Necker cube is fine for perception but fails for action. Switching examples is necessary—maybe visual bistability first (perception), then transitioning to saccades or grasping a coffee cup (action). This keeps it grounded in embodied cognition, which social psych folks appreciate. 

  Misconceptions need careful timing:
  - "Free energy = prediction error" must be clarified when introducing the math proxy. Preempt it by showing the relationship but emphasizing it's a bound, not identity. 
  - "Brain is lazy" should be countered during active inference. Contrast efficiency with adaptive engagement. 
  - "Unfalsifiable" requires upfront framing—position FEP as an explanatory framework, not a testable theory. Preempt this in the intro to manage expectations. 
  The fourth sneaky misconception? Probably "FEP explains everything, therefore nothing." Need to subtly defuse by showing its scope but also constraints.

  What to omit: variational math (handwave as "density approximation"), cell biology (mention but bracket), full active inference mechanics. Declare boundaries early: "Due to time, we focus on brains; math details in papers X,Y,Z."

  The final line must resonate. "Just curve fitting" captures the deepest risk—that they dismiss FEP as trivial post-hoc storytelling. Undercut this by showing its predictive architecture from the start.

  Session flow: 
  1. Hook with prediction paradox (5 min) 
  2. Helmholtz foundation (5 min) 
  3. Prediction error -> free energy leap (5 min) 
  4. Active inference with action example (7 min) 
  5. Q&A targeting misconceptions (8 min)

  Timing is tight. Whiteboard use: save equations for free energy derivation sketch, use stick figures for action examples. Keep energy high—Friston's reputation means they expect complexity; surprise them with clarity.
answer: |-
  Here's a battle-tested session plan optimized for clarity and engagement:

  **Session Plan (30 Minutes)**  
  **Title:** "Free Energy Principle: Why Your Brain Hates Surprises"  

  1.  **Hook: The Prediction Paradox (2 min)**  
      *   Start with: *"Your brain is constantly lying to you. Why? Because being right is too expensive. Today we'll see why evolution built us to predict, not perceive."*  
      *   **Whiteboard:** Draw a simple sensory input (e.g., blurry shape) -> "?" -> clear perception (e.g., snake). Emphasize ambiguity is constant.  

  2.  **Foundation: Helmholtz & Perception-as-Inference (5 min)**  
      *   *Why here?* Builds on familiar cog sci (Bayesian brain). Establishes the *problem* (uncertainty).  
      *   "Brain-as-scientist": Generates hypotheses/models, tests against senses.  
      *   **Carrying Example (Perception):** **Bistable Perception** (Necker Cube *or* Rubin's Vase).  
          *   *Whiteboard:* Draw the cube/vase. Show two equally plausible interpretations.  
          *   *Key Point:* Perception is *active selection* of the "best" hypothesis minimizing mismatch.  
      *   **Preempt 'Unfalsifiable?' Here:** Briefly state: *"Is this *just* a metaphor? No – it makes testable predictions about neural coding (e.g., prediction error signals), which we observe."* (Plant the seed).

  3.  **The Core Problem: Prediction Error & The Leap to Free Energy (8 min)**  
      *   Define Prediction Error (PE): Mismatch between prediction (model) and input.  
      *   *The Fundamental Problem:* The brain cannot access the *true* causes of sensations (sensory data is noisy/ambiguous). It only "sees" sensory data.  
      *   **Introduce Free Energy (F):**  
          *   *F is a **bound** on surprise.* F >= Surprise.  
          *   *Analogy:* F is the brain's "best guess" of surprise based on its model. Minimizing F *indirectly* minimizes surprise.  
          *   *Whiteboard:* Write `F = Complexity Cost + Accuracy Cost` (≈ Prediction Error).  
              *   "Complexity Cost": How much must the model *change* to fit the data? (Deviation from prior beliefs).  
              *   "Accuracy Cost": How bad is the fit? (Essentially PE).  
          *   **CRITICAL POINT:** *Minimizing F balances fitting the data *now* (Accuracy) with maintaining a stable, generalizable model (Complexity). This is NOT laziness!*  
      *   **Defuse 'F=PE':** Explicitly state: *"Free Energy *includes* prediction error (Accuracy Cost) but crucially *also* includes the cost of changing your beliefs (Complexity Cost). It's a *trade-off*, not just error."*  
      *   **Preempt 'Brain is Lazy':** *"Minimizing F isn't about doing *less*. It's about being *efficiently adaptive*. Sometimes the cheapest way to reduce F long-term is to expend energy *now* to learn or act."*  

  4.  **Action: Active Inference - Closing the Loop (8 min)**  
      *   *The Big Shift:* The brain doesn't just *change its model* to fit the world (perception). It *changes the world* to fit its model (action).  
      *   **Switch Carrying Example:** **Reaching for a Wobbly Coffee Cup.**  
          *   *Perception:* Predicts cup location/stability based on vision/proprioception. PE arises if prediction fails (e.g., cup jitters).  
          *   *Action:* Minimize *expected* future surprise/F! The brain generates motor commands predicted to *bring about* the sensation of a *stable grip* (fulfilling its prior belief "I am holding the cup securely").  
          *   *Whiteboard:* Draw loop: `Generative Model -> Predictions -> (Sensory Input OR Action) -> Prediction Error -> Update Model/Policy -> ...`  
          *   *Key Point:* Action is fundamentally about *fulfilling predictions* (e.g., stable grip, reaching goal).  

  5.  **Scope, Limits & Why Care? (5 min)**  
      *   **What FEP Offers:** A single, mathematically defined principle unifying perception, action, learning (plasticity), attention, and even neurobiology under the imperative to minimize surprise. A framework for understanding adaptive systems.  
      *   **What We Are NOT Covering (Declare Clearly & Concisely):**  
          *   *"We are skipping the **variational calculus** (how we approximate those nasty probability densities)."*  
          *   *"We are *not* diving into **full active inference dynamics** or **detailed Markov blankets** today."*  
          *   *"We are **absolutely not covering** extensions to biology, cells, or 'life itself' – fascinating, but a bridge too far in 30 mins. We're focused on the brain."*  
          *   *Rationale:* "To keep this grounded and useful for *our* work on cognition and behavior." (Not a dodge, it's focus).  
      *   **Address 'Unfalsifiable?' Again:** *"As a grand unifying framework, directly 'testing FEP' is like 'testing evolution'. Its power is in generating specific, testable hypotheses within domains (e.g., how PE signals drive perception updates or motor corrections) and unifying diverse phenomena. That's why people care."*  

  6.  **Q&A / Discussion (2 min)** - Be ready to reinforce points above.  

  **Final Line (The Sinker Misconception to Head Off):**  

  \final{Just curve fitting}  

  **Why this misconception is critical to head off (and how):**  
  *   **The Risk:** If they leave thinking FEP is just a fancy way to say "brains minimize errors post-hoc," the entire framework seems trivial and descriptive, not explanatory or mechanistic.  
  *   **How to Head It Off:**  
      1.  **Preempt in Step 3:** Explicitly frame F minimization as a *proactive, generative* process ("best guess of surprise") balancing model stability (priors) with accuracy.  
      2.  **Preempt in Step 4:** Show how action is *proactive* – changing the world to *make predictions come true*, not just react to errors.  
      3.  **Emphasize in Step 5:** Frame FEP as providing the *why* (minimizing surprise bound) and the *how* (perception/action as dual routes) for adaptation, generating specific hypotheses about *processes* (e.g., expected PE driving attention, complexity cost explaining perceptual stability).  
  *   Contrast it with simple error minimization: *"It's not just fitting the curve of past data; it's building a model to predict the *next* data point, and sometimes *creating* that data point through action."*
