prompt: |-
  Me and my brother-in-law have been arguing for months about what actually counts as corruption, and I've realised I don't even know what a good answer would look like. He's from Denmark and I've got family in a country where, honestly, you don't get anything done without a small gift or knowing someone who knows someone, and to him all of it is corruption, full stop, while to my uncle it's just how you treat people, and giving nothing is the rude/corrupt move. Then I watched a documentary about lobbying in Washington and it looked like the same stuff with better tailoring. So before I keep arguing about specific cases I want to figure out the spec: what does ANY adequate account of corruption have to get right? Like, which cases does it have to call corruption and which does it have to leave alone, what distinctions can't it collapse (a gift vs a bribe, a favour vs a sale, a campaign donation vs a kickback), and what's it even for -- is the point fairness, or trust in institutions, or something else entirely? And please tell me which requirements you'd bet are genuine and which are just one culture's preferences dressed up as universal, because that's basically my whole argument with my brother-in-law.

  A few cases I want the spec to handle, since these keep coming up: a nurse who gets expensive wedding gifts from grateful families on her ward and never asks for them; a clerk who moves your file to the top of the pile because you're his cousin's neighbour and it would cost you nothing either way; a politician who steers a road contract to his brother-in-law's firm, which does the work properly and at a fair price; and an MP who takes constituents' problems seriously mostly in the run-up to elections because he needs their votes. I genuinely can't tell if a definition should treat the last one as corruption or just as democracy working as intended, and I suspect any rule that handles all four cleanly doesn't exist. If some of the requirements you list can't be satisfied together, say which ones and why -- that's the bit I most want to see. Also, if one requirement does most of the work of ruling out popular ways of defining corruption (like "anything that violates the formal rules" or "private gain at public expense"), point that out too.

  You don't need to be academic about it, I haven't read any philosophy in my life, just make it clear and concrete. And please write it in British English, since this is going to my brother-in-law and he's a bit of a pedant about American spellings. Oh and I know definately nothing about how political scientists actually use the word, so if my framing is off somewhere just say so gently.
reasoning: |-
  Okay, the user is having a long-standing argument with their brother-in-law about what constitutes corruption. They come from different cultural backgrounds—Denmark versus a place where informal gifts and connections are necessary to get things done. The user wants a clear framework to define corruption that can handle specific tricky cases they've encountered. 

  First, I need to unpack their core question: What must any definition of corruption get right? They listed four ambiguous scenarios (nurse's gifts, clerk's favor, politician's contract, MP's election focus) and want to know which distinctions matter (gift vs. bribe, favor vs. sale, etc.). Underlying this is a cultural tension: their brother-in-law sees all informal exchanges as corruption, while their uncle views them as social courtesy. The user suspects Western definitions might be culturally biased but also worries about relativism—when does "cultural difference" enable harm?

  The Washington lobbying comparison suggests they're aware of systemic parallels between "gifts" in their home country and "donations" in the West. They want the framework to expose hypocrisies but also hold up universally. Key challenges they hint at: 
  - Can a definition avoid cultural double standards without excusing abuse? 
  - Must it handle both individual acts (like bribes) and systemic issues (like nepotism)? 
  - Where does democracy (e.g., MPs catering to voters) cross into corruption?

  Their unspoken needs: 
  1. **Mediation tools**: They want to resolve the family argument, not just win it. A good framework should acknowledge both perspectives' validity while drawing clear lines. 
  2. **Practical clarity**: They need concrete distinctions (e.g., "If the clerk's favor delays others, it's corrupt; if not, it's neutral"). 
  3. **Cultural fairness**: They distrust definitions that label their home culture "corrupt" while ignoring similar Western practices like lobbying. The framework must scrutinize all systems equally. 
  4. **Nuance over absolutes**: They suspect no definition handles all four cases cleanly—so they'd prefer honesty about trade-offs (e.g., "Requiring fairness clashes with allowing reciprocity in gift cultures").

  I'll build a framework around three universal requirements: deviation from public purpose, abuse of entrusted power, and harm to equitable processes. This avoids cultural bias by focusing on function: Does the act distort decisions that should serve everyone? The nurse's gifts (voluntary, no favoritism) pass; the clerk's cousin favor (diverting public resources) fails. The politician's contract to a qualified brother-in-law is technically corrupt (nepotism) but less harmful—showing harm isn't binary. The MP's election focus is democracy, not corruption, unless votes are traded for specific favors. 

  I'll explicitly flag where culture matters: Gifts are corrupt only if they create obligations in public roles. This reframes their uncle's view—"treating people well" is fine unless it hijacks public systems. And I'll agree that lobbying looks like "gifts in tailoring," validating their observation while noting distinctions (lobbying is regulated, transparent). 

  Finally, I'll admit the trade-offs: Demanding zero personal ties in decisions is unrealistic in close-knit societies, so the framework tolerates low-stakes favors if no one is disadvantaged. This balances their brother-in-law's idealism with their uncle's pragmatism.
answer: |-
  Here's a clear, concrete "spec" for what *any* adequate account of corruption must get right, based on core principles rather than cultural preferences. I'll flag where culture intrudes and where requirements clash. British English guaranteed.

  ### The Core Requirements (What Any Definition MUST Capture)
  1.  **Deviation from a Public Purpose:** Corruption occurs when someone entrusted with power (public office, professional duty, institutional role) uses it for **private benefit** (theirs or someone else's) **instead of, or contrary to, the official purpose of that power.** The core betrayal is subverting the *reason* the power exists (e.g., serving citizens, delivering impartial justice, allocating resources fairly).
  2.  **Abuse of Entrusted Power:** It involves **misusing a position of authority or trust.** This distinguishes corruption from simple theft or fraud by a private individual. The power was given for a specific public/social/institutional good.
  3.  **Harm to Equitable Process:** It **undermines fairness, impartiality, or the integrity of a process.** This doesn't always require immediate financial loss ("public expense"). It corrodes trust and the principle that decisions should be made based on merit, rules, or public interest, not personal connections or payments.

  ### What It MUST Distinguish (The Critical Splits)
  *   **Gift vs. Bribe:**
      *   **Gift:** Voluntary, *after* service (or unrelated to it), no expectation of specific favour, token value relative to context, transparent.
      *   **Bribe:** Given *to influence* a specific action/decision *before or during* it, expectation of a quid pro quo, significant value relative to context, often secretive. **The key is the *intent to influence* and the *timing/connection* to the official act.**
  *   **Favour vs. Sale/Extortion:**
      *   **Favour (Personal Context):** Helping a friend/neighbour *in a personal capacity* (e.g., helping them move house), using *personal* resources/time.
      *   **Favour (Professional Context - Corrupt):** Using *official power or resources* to benefit someone based on personal ties *instead of* the proper rules/merit (e.g., the clerk moving the file).
      *   **Sale:** A transparent, rule-based exchange of value for a service/good *where this is permitted* (e.g., paying a fee for a licence).
      *   **Extortion:** Demanding payment or a favour *under threat* of withholding a service or applying a penalty that *should* be provided/not applied.
  *   **Campaign Donation vs. Kickback:**
      *   **Donation (Non-Corrupt):** Support for a candidate/party/platform *generally*, given transparently within legal limits, with no *specific, guaranteed* policy/contract/favour demanded in return.
      *   **Kickback:** Payment (disguised or not) given *in exchange for* a specific official act (awarding a contract, changing a regulation, granting a permit), often secretive or disguised.
      *   **Lobbying Grey Area:** Lobbying becomes corrupt when donations are *effectively* kickbacks – i.e., when the donation size is linked *directly* to securing a specific, valuable outcome the donor seeks, bypassing public debate/merit. **The key distinction is between *general support* and *payment for a specific result*, and the *transparency* of the influence.**

  ### What the Definition is FOR (Its Point)
  Primarily: **Preserving trust in institutions and ensuring fair, impartial processes.** This underpins societal stability, economic efficiency, and basic justice. Fairness is a key component, but the core goal is preventing the *hijacking of public or institutional power for private gain*, which destroys trust and distorts outcomes.

  ### Where Culture Matters (Preferences vs. Universals)
  *   **Cultural Preference:** *How* relationships and reciprocity are expressed (gift-giving customs, social obligations). What constitutes a "token" gift vs. an "inducement" can be culturally relative *to a degree*.
  *   **Universal Principle:** **Using an official position to grant an advantage based on personal connections or payments, contrary to the role's purpose, is corrupt.** The Danish view (zero tolerance for personal influence in public roles) leans heavily on this universal. Your uncle's view prioritises the cultural norm of reciprocity *over* the universal principle of impartial public service. Both have elements of truth, but the universal principle defines the *core wrong* of corruption. A system built *only* on personal reciprocity inevitably disadvantages outsiders and erodes fair process.

  ### Applying the Spec to Your Cases
  1.  **Nurse & Wedding Gifts:** **Not corrupt.** Gifts are *after* service, likely voluntary/unsolicited, no evidence of preferential treatment *in exchange for* them. It's gratitude, not an inducement. (Meets all core requirements: no *deviation* from duty, no *abuse* of power for gain, no *harm* to process).
  2.  **Clerk & Cousin's Neighbour:** **Corrupt.** The clerk abuses his entrusted power (managing files impartially) to give an advantage based *only* on a personal connection. The public purpose (fair, orderly processing) is subverted. Even if "costless," it violates impartiality and sets a precedent. (Fails Core Requirements 1 & 3).
  3.  **Politician & Brother-in-Law's Firm (Fair Price/Good Work):** **Corrupt (Nepotism/Cronyism).** The politician abused entrusted power (awarding public contracts) to favour a personal connection. The *process* was corrupted, even if the outcome was acceptable. Fairness demands open competition to ensure the *best* value and prevent systemic favouritism. (Fails Core Requirements 1 & 3).
  4.  **MP & Constituents' Problems (Election Focus):** **Not corruption, generally.** This is **democracy working (imperfectly).** MPs *should* be responsive to constituents to gain/keep votes. The "currency" is votes based on general performance/representation, not a specific favour for a specific payment. It only tips towards corruption if the MP explicitly trades a *specific* official action (e.g., a grant, a licence) for votes in a quid pro quo. (Meets core requirements: Using power *for* public responsiveness, even if the motive is self-interest, isn't inherently an abuse if the *actions* serve the public purpose. The harm to process is minimal if responsiveness is the norm).

  ### Where Requirements Clash & Trade-offs Exist
  *   **Fairness vs. Efficiency/Relationships:** The strict "no personal ties" rule (like Denmark) maximises fairness and trust but can feel impersonal and might ignore legitimate relationship-based knowledge/speed in some contexts. Allowing *any* personal influence risks systemic unfairness. **The spec prioritises fairness/process integrity over relationship-based efficiency.** The clerk's "harmless" favour is still corrupt because it violates the *principle*.
  *   **Outcome vs. Process:** The Politician/Brother-in-Law case shows this. A good outcome doesn't sanitise a corrupt *process*. The spec prioritises the integrity of the *process* because corrupt processes *inevitably* lead to bad outcomes over time.
  *   **Intent vs. Effect:** The spec focuses on the *act* (abuse of power for private gain/deviation from purpose) and its *effect* (harm to process) more than proving secret malicious intent. The clerk might have "good" intent (helping family friend), but the *act* is still corrupt.

  ### Rules Ruled Out by the Spec
  *   **"Anything violating formal rules":** Too narrow. Something can be corrupt even if no specific rule is broken (e.g., novel schemes). Something can violate a silly rule without being corrupt (e.g., jaywalking while on public duty).
  *   **"Private gain at public expense":** Too narrow. Corruption can occur without direct financial loss (e.g., the clerk's favour) and can involve private-to-private corruption (e.g., company insider trading). It also misses the *abuse of entrusted power* element.

  **Conclusion for Your Argument:** The universal core is the **abuse of entrusted power for private gain, deviating from its public purpose, harming fair process.** Your brother-in-law focuses tightly on this principle, especially impartiality. Your uncle prioritises cultural norms of reciprocity *within* relationships, potentially blurring the line between personal courtesy and improper influence *within official roles*. The lobbying comparison is sharp – it *often* walks right up to the line of being a "legal bribe," precisely because it can involve large donations seeking specific outcomes, testing the "general support vs. payment for result" distinction. A good spec forces you to ask: **"Is this person using their official power/resources in a way they shouldn't, to benefit someone specifically because of a personal tie or payment, instead of following the proper rules or serving the public impartially?"** If yes, it's corruption, regardless of tailoring or cultural wrapping.
