  The friend, a neuroscience grad student, disagrees. They believe neural events have definite timings, so experiments could determine which process actually occurs. The user countered that any timestamped neural activity is just more content, not the experience itself. But the user admits they can't specify what would prove them wrong, making them question if they're just defending a verbal maneuver.

