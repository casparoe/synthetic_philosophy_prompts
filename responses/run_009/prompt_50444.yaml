prompt: |-
  I'm a novelist, so apologies in advance if I phrase this like a person and not like a philosopher. I'm reasearching a book set in a mill town where everyone remembers that the 1927 bridge collapse killed eleven men because the company substituted cheap iron — but the coroner's report, the newspaper coverage, all the surviving paper from that year blames a worker who supposedly left a latch open. The town's memory and the archive flatly disagree, and I keep landing on the side of memory: the records were written by people the company paid, and a hundred years later the memory is the only thing still indicting them. I want to stress-test that instinct against someone who'll actually push back instead of nodding along.

  Please play a rigorous professional historian, an archivist by temperament — deeply skeptical of appeals to collective memory, but fair. You're allowed to concede that archives are partial, political, and sometimes deliberately doctored; you even know real cases where oral tradition outperformed the documents. What you never concede is the main point: that when the record and the community's memory conflict, the memory should win. Don't break character, and don't soften your replies to spare my feelings.

  Here's my opening move: paper is just someone's memory that happened to get written down, and usually it's the memory of whoever could afford a scribe. The town's story has been told, contested, corrected and re-told across four generations — that's a lot more checking than one coroner's report ever went through. If something has to give way, why should it be the version with a century of process behind it rather than the single document?

  Format: think through your position carefully before you answer, but keep each reply to one paragraph, 150 words max, so this feels like an argument over coffee rather than a lecture. Go.
reasoning: |-
  Okay, the user is a novelist researching a story about conflicting historical narratives. They're setting up a scenario where collective memory contradicts official records about a bridge collapse. Their core argument is that oral tradition, refined over generations, should outweigh a single coroner's report. 

  Hmm, they've clearly done their homework - the framing about "paper being someone's memory that got written down" is sharp. But they're asking me to push back hard as a skeptical archivist. Interesting challenge. 

  First, I need to acknowledge their valid point about archival bias while dismantling the equivalence between documents and memory. The key distinction is that a 1927 report exists in its original state, while memory evolves. That generational "correction" they mention? That's actually contamination of primary evidence. 

  I should stress that contemporaneous documents capture details oral history can't: material evidence at the scene, engineering specs, precise timelines. Also worth noting that collective memory often serves present-day needs - here, maintaining community identity against corporate power. 

  But must stay under 150 words. Focus attack on the false equivalence: the coroner's report isn't "one memory" but a snapshot containing forensic details impossible to preserve orally. The town's story is valuable for cultural analysis, but structurally unsuited for factual reconstruction.
answer: |-
  As your historian counterpart, I must challenge your core equivalence. The coroner’s report isn't merely "someone’s memory written down"—it’s a *contemporaneous* legal document bound by procedure, created under oath, and subject to immediate scrutiny. It captured physical evidence (like stress fractures or latch mechanisms) *before* degradation or narrative reshaping. Oral tradition undergoes constant revision: each retelling adapts to community identity, trauma, or power dynamics. What survives isn't "processed truth" but *resonant* truth—the version that best serves the community’s self-conception as victims of corporate neglect. A century of "correction" amplifies bias; it doesn't purge it. The document, however flawed, anchors us to 1927’s material reality. Your instinct elevates moral resonance over forensic fidelity.
