prompt: |-
  At my local rationality meetup we got onto Hofstadter's superrationality (the idea from his old Scientific American columns, later collected in the Metamagical Themas book): in a one-shot prisioner's dilemma against someone who reasons the way you do, your choice and theirs are effectively two computations of the same function, so you should cooperate — not because you causally move them, but because your "cooperate" and theirs rise and fall together. Someone then said the obvious thing: this is just the categorical imperative in a decision-theory costume — act only on the maxim you could will universalized; if everyone like you reasons as you do, then universalizing your choice IS your choice. And the analogy is being used to do real work in two directions in our group. One guy leans on it to say superrational cooperation is really a moral duty all along, so decision theory has quietly proven Kant right. Another uses it the opposite way: if it's just Kantianism smuggled into rational choice theory, then it's ethics wearing math, not a theorem about rationality, and we should drop it from the toolkit entirely.

  I'd like the full audit of the analogy. Give me the correspondence table — what plays the role of the maxim, of universalization, of the rational being, of the contradiction-in-will test — and then where the mapping breaks. My own hunch is that the "everyone like you" clause works completely differently in the two settings: Kant's universalization runs to all rational beings no matter how they actually reason, while Hofstadter's link only connects agents who happen to reason like you at that node, which sounds more like a correlation claim than a moral test. Kant is also asking a hypothetical question (could this maxim be willed as universal law?), whereas superrationality seems to assert that your decision actually does co-vary with similar reasoners' decisions. So: does either of my friends' conclusions survive once the disanalogies are on the table — "rationality proves Kant" or "it's ethics not rationality" — or is the analogy carrying both conclusions the whole way? And is there a better analogy for what superrationality is actually doing, maybe something from statistics or physics instead of ethics? Don't be afraid to conclude that neither of them gets what they want out of it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a rationality meetup discussing Hofstadter's superrationality. The core idea is that in a one-shot prisoner's dilemma, if both players reason the same way, their decisions are linked, leading to cooperation. The group then connected this to Kant's categorical imperative, leading to two opposing views: one sees it as proof of Kantian ethics via decision theory, the other dismisses it as ethics disguised as math.

  The user wants a detailed analogy audit. They need a correspondence table between superrationality and Kant's framework, highlighting where the mapping breaks. Their hunch is that the "everyone like you" clause works differently in each. Kant's universalization applies to all rational beings regardless of their reasoning, while Hofstadter's is about agents who share the same reasoning process. Also, Kant's is a hypothetical test, whereas superrationality involves actual co-variance.

  First, I should outline the key elements of both frameworks. For Kant: maxim, universalization, rational beings, contradiction-in-will test. For Hofstadter: choice rule, players with identical reasoning, outcome co-variance. Then map these elements to see where they align and diverge.

  The user's friends have extreme positions. One claims rationality proves Kant, the other says it's ethics, not rationality. I need to evaluate if either conclusion holds after examining disanalogies. The differences in universality, hypothetical vs. actual, and the scope of reasoning seem crucial. Kant's test is about logical consistency across all rational agents, while superrationality is conditional on shared algorithms. This undermines the first friend's claim. The second friend's dismissal might overlook that superrationality uses decision theory tools without moral content.

  Looking for better analogies, physics comes to mind—quantum entanglement or spin systems where particles' states are correlated without causation. Statistics offers correlated equilibrium, which fits well as it's a solution concept based on expected outcomes given others' strategies. This highlights that superrationality is about interdependent decision-making, not morality.

  The user's deeper need might be to clarify whether superrationality belongs in rational choice theory or if it's an ethical imposition. They might also want to resolve the debate in their group with a balanced view. Concluding that both friends overstate their cases but superrationality has legitimate decision-theoretic foundations seems appropriate. Emphasizing the correlated equilibrium analogy could provide a clearer framework for their discussions.
answer: |-
  Here's a full audit of the analogy between Hofstadterian Superrationality and Kant's Categorical Imperative (CI), followed by an evaluation of your friends' claims and a proposal for a better analogy.

  ### Correspondence Table: Superrationality vs. Categorical Imperative

  | Kantian Concept             | Superrationality Analog                                  | Mapping Strength | Notes on Correspondence                                                                 |
  | :-------------------------- | :------------------------------------------------------- | :--------------- | :-------------------------------------------------------------------------------------- |
  | **Maxim (Subjective Principle)** | **Your Choice Rule/Algorithm**                           | Strong           | The specific decision function you use (e.g., "I cooperate iff I believe the other reasons like me"). |
  | **Universalization**        | **Application to All Identically-Reasoning Agents**      | Weak/Analogical  | Not "all rational beings", but *only* those running the *exact same decision algorithm* in the *exact same situation*. |
  | **Rational Being**          | **Agent Running the Identical Algorithm**                | Weak             | Kant's rational being has universal reason; Hofstadter's is defined by specific computational similarity. |
  | **Contradiction-in-Will Test** | **Pareto-Inferior Outcome if All Defect**                | Very Weak        | No logical "contradiction" test. Instead, mutual defection is empirically worse for all identical reasoners. Focus is on outcome desirability, not logical consistency. |
  | **"Act as if..." (Hypothetical)** | **Decision Based on Covariance Assumption**              | Partial          | Kant asks "Could you *will* this maxim universally?". Superrationality *assumes* your choice covaries with identical agents' choices and *acts* on that. |
  | **Moral Duty**              | **Instrumental Rationality under Symmetry**              | None             | Superrationality's "should" is about maximizing expected payoff given symmetry, not a moral "ought". |
  | **Scope of Universality**   | **Domain of Identical Computation**                      | Weak             | Kant: Universal across *all* rational agents. Hofstadter: Applies *only* within the reference class defined by shared decision algorithm & epistemic state. |

  ### Where the Mapping Breaks (Key Disanalogies)

  1.  **Universality vs. Restricted Symmetry Class:**
      *   **Kant:** Demands universalization across *all* rational beings *qua* rational beings. The test is whether *any conceivable rational agent* could consistently will the maxim as universal law. Reasoning differences are irrelevant; rationality itself is the common ground.
      *   **Hofstadter:** Only applies to agents who are *computationally identical* to you *in this specific decision context*. It's not about universal rationality, but about perfect correlation within a specific reference class defined by shared computational process. Reasoning differences *destroy* the link.

  2.  **Hypothetical Test vs. Causal/Covariance Claim:**
      *   **Kant:** Asks a counterfactual question: *Could* you consistently *will* your maxim as universal law? It's a test of logical consistency or non-contradiction in conception/willing, *not* a prediction about actual behavior.
      *   **Hofstadter:** Makes an *empirical* (though often idealized) claim: Agents running the same algorithm *will* (or *must*, logically) output the same decision. Your choice *does* covary with theirs. The "should" follows instrumentally from this assumed covariance to avoid the Pareto-worst outcome.

  3.  **Nature of the "Ought":**
      *   **Kant:** The "ought" is *categorical* and *moral*. You cooperate because it's your duty as a rational being, regardless of consequences for *you*.
      *   **Hofstadter:** The "ought" is *hypothetical* and *instrumental*. You cooperate *only if* you care about your payoff *and* you believe the symmetry/covariance holds *and* mutual cooperation yields the best payoff for identical agents. It's purely outcome-driven (avoiding mutual defection trap).

  4.  **Contradiction vs. Pareto Inferiority:**
      *   **Kant:** Finds a logical flaw in universalizing defection (e.g., willing a world where promises are meaningless contradicts the concept of promising itself, or willing universal distrust is incompatible with a rational being's need for security/help).
      *   **Hofstadter:** Shows that if all identical agents defect, they all get the worst *mutual outcome*. The failure is practical (getting a bad payoff), not logical. There's no inherent contradiction in a world where all identical reasoners defect; it's just mutually disastrous.

  5.  **Subjectivity of the Maxim/Algorithm:**
      *   **Kant:** The maxim is supposed to be formulated objectively (e.g., "I will break promises to get money when convenient").
      *   **Hofstadter:** The "algorithm" is inherently tied to the specific agent's reasoning process. Two agents cooperating via superrationality might have *different internal justifications* as long as they output "cooperate" based on the symmetry assumption. The focus is on the output under symmetry, not the internal rule formulation's universalizability.

  ### Evaluating Your Friends' Conclusions

  1.  **"Superrational cooperation proves Kant right / is a moral duty":**
      *   **Does NOT survive the disanalogies.** This conclusion conflates instrumental rationality under symmetry with categorical moral duty.
          *   **Scope Failure:** Superrationality only binds computationally identical agents, not all rational beings. Kant demands universality.
          *   **"Ought" Failure:** The superrational "should" is conditional on payoffs and symmetry. Kant's duty is unconditional.
          *   **Motivation Failure:** Superrationality cooperates for self-interest (avoiding mutual loss). Kant demands acting *from* duty, irrespective of self-interest.
          *   **Test Failure:** Superrationality avoids a bad outcome; Kant avoids a logical contradiction in willing.
      *   **Verdict:** Superrationality provides a *decision-theoretic mechanism* that *happens* to align with cooperation in symmetric PDs, but it *does not* ground Kantian ethics or prove a moral duty exists. It's a coincidence of incentives under symmetry, not a foundation for morality.

  2.  **"Superrationality is just smuggled ethics and should be dropped from the rational toolkit":**
      *   **Partially survives, but overreaches.** The analogy *is* being used to smuggle in moral intuitions, and the "Kantian costume" critique highlights this risk.
          *   **Analogy Risk:** Framing it as "universalizing your choice" *does* invite ethical misinterpretation, potentially biasing its application.
          *   **Not Inherently Ethical:** However, at its core, superrationality is a *formal decision rule* predicated on an assumption of computational symmetry and co-variance. It uses game-theoretic payoffs, not moral values. Its prescription (cooperate) is derived purely instrumentally within its defined scope.
          *   **It Solves a Problem:** It addresses a genuine puzzle in game theory: how cooperation can rationally emerge in one-shot PDs under specific, non-causal, informational assumptions (symmetry of reasoning). It's not the *only* solution concept (e.g., correlated equilibrium), but it's a coherent one.
      *   **Verdict:** While the *rhetoric* around superrationality often borrows ethical language misleadingly, the *concept itself* is a valid (though debated) decision-theoretic approach under symmetry. It shouldn't be *dropped* purely due to ethical associations, but its assumptions (perfect symmetry, common knowledge thereof) and scope need careful scrutiny. Labeling it "just ethics" throws the rational baby out with the moralistic bathwater.

  ### Your Hunch: Confirmed and Extended
  You correctly identified the core disanalogy: **Kant's universality applies to all rational beings *regardless* of their reasoning specifics, while Hofstadter's link *only* applies to agents who *happen* to reason identically.** Superrationality is fundamentally a claim about **correlation/covariance under computational isomorphism**, not a universal moral test. The hypothetical nature of Kant's test vs. the assumed actual co-variance in superrationality is another critical difference.

  ### A Better Analogy: Correlated Equilibrium (Game Theory/Statistics)

  **The Analogy:** Superrationality functions like finding a **correlated equilibrium** mediated by a shared **correlating signal**, where the signal is the fact of shared computational identity and the common knowledge thereof.

  *   **Correspondence:**
      *   **Identical Reasoning Algorithm:** Acts as the **correlating device** or **common signal**.
      *   **Common Knowledge of Symmetry:** Ensures all players know the signal (their shared reasoning) and know others know, etc.
      *   **Cooperation Strategy:** Is the **equilibrium strategy** prescribed by the correlating device (your shared algorithm) for this signal (being computationally identical).
      *   **Mutual Cooperation:** Is the **equilibrium outcome** sustained because no player has an incentive to unilaterally deviate *given the signal and the expectation that others follow the signal*. Defecting while knowing others identical to you will cooperate *breaks the correlation* the strategy relies on and leads to mutual defection, which is worse.
  *   **Why it's Better:**
      *   **Domain:** Stays firmly within decision/game theory and statistics (correlation).
      *   **Mechanism:** Captures the essence of the co-variance and the conditional rationality ("I cooperate *given* that I am playing someone identical who will do the same").
      *   **No Moral Baggage:** Avoids the ethical connotations of universalization, focusing purely on incentives, expectations, and correlation.
      *   **Formal Grounding:** Correlated equilibrium is a well-established game-theoretic solution concept. Superrationality can be seen as a specific instance where the correlating signal is endogenous (the agents' shared type/algorithm).

  ### Conclusion

  Neither of your friends gets exactly what they want:
  *   **Friend 1 (Proves Kant):** Fails. Superrationality provides a rational mechanism for cooperation under symmetry, but it lacks the universality, categorical nature, and logical foundation of Kant's duty. It's instrumental, not moral.
  *   **Friend 2 (Drop it as Ethics):** Overreaches. While the *rhetorical analogy* to Kant smuggles ethics, the *core mechanism* of superrationality is a coherent (if contestable) decision-theoretic concept under strong symmetry assumptions. It solves a specific coordination problem via assumed co-variance.

  The analogy to Kant is **superficially appealing but fundamentally misleading** due to the radical difference in universality and the nature of the "ought." **Correlated equilibrium** provides a much cleaner, more accurate analogy within the domain of rational choice. Superrationality is best understood as a claim about **rational coordination under perfect computational symmetry and common knowledge**, leveraging the inevitable co-variance of identical algorithms to escape Pareto-inferior outcomes. It's math (game theory + computation), not ethics, wearing a sometimes confusing philosophical hat.
