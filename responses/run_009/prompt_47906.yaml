prompt: |-
  I've been reading (and occasionally commenting in) the identity-adjacent threads on the rationalist corner of the internet for well over a decade, and I've finally admitted to myself that my object-level verdicts about the Ship of Theseus and its many cousins don't fall under any single principle I can state clearly. I'd like you to do the reflective equilibrium for me.

  Take the role of a professional metaphysician who works on persistence and identity over time. Please think carefully, and before committing to anything, brainstorm several candidate principles — spatiotemporal continuity, continuity of form or function, causal-historical continuity, some best-candidate or closest-continuator rule, a sortal-relative account on which "same ship" and "same band" answer to different criteria — and test each against all of my verdicts, not just the first few.

  Here are my verdicts:

  1. Theseus's ship, planks replaced one by one over years of ordinary maintenance: same ship. I'm not moved by the observation that no original plank survives.
  2. Hobbes's twist, where the discarded planks are gathered and reassembled into a second ship: my gut says the continuously sailing vessel is the ship and the reassembled one is a replica — but I wobble when I notice the reassembled one holds all the original matter. Treat this as my least stable verdict.
  3. Grandfather's axe with two new heads and three new handles (the old Trigger's broom gag): same tool.
  4. My car, after a crash, rebuilt onto a new chassis with only 30% original parts carried over in a single month-long repair: same car, though less confidently than case 1.
  5. A rock band, forty years old, with no original members but an unbroken touring and recording history: same band.
  6. The tribute act made up of the founding members playing the old songs: not the same band.
  7. A codebase refactored line by line over fifteen years until nothing of the original remains — what my colleagues call the Ship of Theseus antipattern: same software, same license, same warranty obligations.
  8. A big-bang rewrite: a new team reimplements the identical spec from scratch in a year: different software, even though it does the same job.
  9. A hiking trail re-routed a hundred meters uphill after erosion, same blazes and same guidebooks: same trail.
  10. A restaurant in its third generation of family ownership, menu and cuisine entirely changed: not really the same restaurant, though the same business. Note that 5 and 10 pull in opposite directions and I can't articulate why.
  11. Me, after the usual turnover of matter: same person, obviously.

  Deliver a principle, or a small set of candidates, stated precisely, with the case that motivates each clause, plus verdicts on cases I haven't listed — say, a violin restored with 70% new wood, a constitution replaced clause by clause over two centuries, and a marriage after fifty years in which every habit, friend, and belief has changed. Then tell me honestly which of my verdicts your preferred principle cannot save, and whether I should drop the verdict or complicate the principle.

  Begin with your bottom line in the first sentence, then the reasoning — no preamble, no restating my cases back at me.
reasoning: |-
  Okay, the user has been engaging with identity puzzles like the Ship of Theseus for over a decade and now wants a metaphysician to help them find a coherent principle that fits all their intuitive judgments. They've listed 11 specific cases where they have strong intuitions about whether something remains the same entity after changes. 

  Hmm, this is a classic problem in persistence and identity over time. The user seems frustrated that their intuitions don't neatly map to any single existing theory. I notice their judgments cluster around different factors: functional continuity for tools/software, organizational persistence for bands, material history for objects, and narrative coherence for personal identity. The restaurant case (10) is particularly tricky because it opposes the band case (5) - same business entity but different "essence."

  Let me brainstorm candidate principles. Spatiotemporal continuity works for the ship (1) but fails the reassembled replica (2). Material continuity alone would make the grandfather's axe (3) and rebuilt car (4) different, against their judgment. A closest continuator theory might handle the band (5) but struggles with the tribute act (6). Sortal-relativity seems promising since "same band" and "same restaurant" may demand different criteria.

  The user wobbles on Hobbes' reassembled ship (2) - that's the weak spot. Their intuition that the continuously maintained ship is primary suggests process matters more than material. For the car (4), 30% parts with causal history feels sufficient. The software cases (7-8) clearly separate gradual from abrupt change. 

  Aha! The key might be combining two principles: causal-historical continuity for physical objects and narrative persistence for social entities. Physical objects need unbroken causal chains (explaining why the reassembled ship is replica), while social entities persist through institutional narratives (why the band continues with new members). This bifurcation handles the restaurant/band divergence.

  Testing this: The violin restoration would be same instrument if done gradually with original parts incorporated. The amended constitution remains the same if changes follow prescribed procedures. The marriage persists as long as the partners identify it as continuous. 

  But this framework can't save the user's replica ship verdict without compromising - if material reassembly creates a new causal chain, it shouldn't be the same ship. They might need to accept that or add a "designated successor" clause for artifacts. The restaurant case also remains borderline - is it the business institution or the culinary tradition? That tension may be unresolvable.

  Ultimately, the user should recognize that identity judgments are context-dependent. Their verdicts are mostly coherent if we allow different criteria for different categories. The wobble on case 2 is philosophically justified - it's the hardest puzzle for a reason. I'll present this dual-track theory with candid admission of its limits.
answer: |-
  **Bottom line:** Your verdicts are best captured by a **two-track principle combining causal-historical continuity for physical objects and narrative/institutional persistence for social entities**, supplemented by a **gradual change criterion** and **sortal sensitivity**.

  **The Principle(s):**

  1.  **For Physical Objects (Ship, Axe, Car, Trail, Violin):** An object O1 at T1 is identical to object O2 at T2 iff:
      *   There is an unbroken, continuously existing spatiotemporal path connecting O1 to O2, *and*
      *   The matter constituting O2 bears the appropriate causal-historical connection (e.g., gradual replacement, repair, maintenance) to the matter constituting O1 *along that path*, *and*
      *   The change in properties (form, parts, function) between T1 and T2 occurs gradually relative to the object's typical lifecycle and the context of change.
      *   *Motivated by:* Verdicts 1 (Ship), 3 (Axe), 4 (Car - less confidence reflects borderline gradualness?), 9 (Trail), 11 (Person - physical basis), and rejection of 2's reassembled ship (lacks *unbroken* path/history).

  2.  **For Social/Functional Entities (Band, Software, Business, Constitution, Marriage):** An entity E1 at T1 is identical to entity E2 at T2 iff:
      *   E2 stands in the appropriate institutional, functional, or narrative continuity with E1, meaning:
          *   The organizational structure, functional role, or recognized identity persists through a chain of states where each state causally depends on and intentionally continues the prior state under the relevant institutional rules or social practices.
          *   This persistence involves a continuous history of operation or recognition *as that entity*.
      *   *Motivated by:* Verdicts 5 (Band - unbroken history), 6 (Tribute Band - lacks institutional continuity), 7 (Refactored Code - continuous development history), 8 (Rewrite - lacks development history), 10 (Restaurant business entity persists, culinary identity does not), and explains the 5/10 divergence (band identity *is* its institutional history/touring; restaurant identity *includes* its culinary tradition).

  3.  **Gradual Change Criterion (Cross-Cutting):** Significant changes are compatible with identity only if they occur incrementally over time, relative to the entity's nature and context. Abrupt, massive change disrupts identity even if the end state is similar.
      *   *Motivated by:* Verdict 1 vs. 8 (gradual vs. abrupt), Verdict 7 vs. 8 (refactor vs. rewrite), Verdict 4 (borderline abruptness reduces confidence).

  4.  **Sortal Sensitivity (Cross-Cutting):** The criteria for "same X" depend inherently on the kind of thing X is ("ship", "band", "software", "restaurant", "person"). What constitutes persistence for one sortal may not for another.
      *   *Motivated by:* The entire pattern of differing verdicts across different categories, especially the band/restaurant divergence (5 vs. 10).

  **Application to Your Cases & New Cases:**

  *   **1. Ship (Maintained):** Satisfies Physical Track (unbroken path, gradual change, causal history).
  *   **2. Ship (Reassembled):** *Fails Physical Track* (no unbroken path, reassembly is abrupt recreation, not continuous maintenance). Your wobble is noted – the principle firmly says replica. The causal history belongs to the *planks*, not the reassembled *ship-as-such*.
  *   **3. Grandfather's Axe:** Satisfies Physical Track (unbroken path, gradual change, causal history of *the tool*).
  *   **4. Rebuilt Car (30%):** *Borderline Physical Track*. Less confidence reflects borderline gradualness? Arguably satisfies if the repair process, though intensive, is seen as a continuous corrective action on the *same car entity* within its lifecycle context.
  *   **5. Band (No Originals, Touring):** Satisfies Social Track (unbroken institutional/functional/narrative continuity *as the band*).
  *   **6. Tribute Band (Originals):** Fails Social Track (lacks institutional continuity – it's a new project playing old songs).
  *   **7. Refactored Code:** Satisfies Social/Functional Track (unbroken development history, continuous identity under license/warranty/institutional recognition).
  *   **8. Rewritten Code:** Fails Social/Functional Track (abrupt replacement, lacks development history from original).
  *   **9. Rerouted Trail:** Satisfies Physical Track (unbroken path for *the trail entity*, gradual/natural change, causal history of maintenance/use).
  *   **10. Restaurant (Menu Changed):**
      *   *Business Entity:* Satisfies Social Track (institutional continuity - licensing, ownership, location?).
      *   *Restaurant-as-Culinary-Institution:* Fails Social Track (radical break in core function/identity - the cuisine/narrative).
      *   Your verdict ("not really the same restaurant, though same business") is spot-on under this split.
  *   **11. Person:** Satisfies both tracks robustly (Physical: continuous body/brain path; Social/Narrative: strong psychological/institutional continuity).

  **New Cases:**

  *   **Violin (70% new wood):** *Same Instrument.* Satisfies Physical Track (unbroken path, gradual restoration *is* appropriate causal history, functional continuity).
  *   **Constitution (Clause-by-Clause Amendment):** *Same Constitution.* Satisfies Social/Functional Track (institutional continuity via prescribed amendment process, unbroken legal recognition and authority).
  *   **Marriage (Everything Changed):** *Same Marriage.* Satisfies Social Track (institutional continuity - legal/social recognition persists; narrative continuity - the partners' identification *as* that enduring marriage, even if content evolves). The *relationship* changes, but the institutional *marriage* entity persists.
  *   **Trigger's Broom (New Head/Handle):** *Same Broom.* Satisfies Physical Track (as per Axe - gradual, functional replacement within the tool's lifecycle).
  *   **Human Body After 7-Year Cell Turnover:** *Same Person.* Satisfies Physical Track (continuous spatiotemporal/causal path of the organism) and Social Track.

  **Where the Principle Struggles with Your Verdicts & Recommendations:**

  1.  **Verdict 2 (Hobbes' Reassembled Ship):** The principle *cannot save* your gut feeling that the reassembled ship is merely a replica. It clearly identifies the continuously maintained ship as the original. **Recommendation:** *Drop the wobble and accept the replica verdict.* The causal-historical connection requires continuity *of the object itself*; reassembly creates a new object using old parts. Your wobble likely stems from overemphasizing matter in isolation. Complicating the principle (e.g., adding "original matter + form" as a *sufficient* condition) would destroy coherence, making the reassembled ship identical *and* conflicting with verdicts 1, 3, 4, 7, 9, and 11 where matter changes.
  2.  **Verdict 4 (Rebuilt Car - 30%):** The principle *can* support "same car" but only by interpreting the intensive repair as part of the *continuous existence* of the car entity under maintenance/repair, making it a borderline case of gradualness. Your reduced confidence is justified. **Recommendation:** *Accept the borderline nature.* The principle reflects your confidence level. Insisting on high confidence here might require weakening the gradual change criterion, risking incoherence with verdict 8 (rewrite).

  **Honest Assessment:** This two-track principle with gradual change and sortal sensitivity captures the vast majority of your verdicts with remarkable fidelity, explaining the band/restaurant divergence and handling new cases intuitively. Its main cost is forcing a clear decision on the reassembled ship (replica), resolving your wobble against the material intuition. The rebuilt car remains a justifiable borderline case under the principle. The framework is robust, reflecting the reality that persistence conditions *are* fundamentally different for a lump of clay, a nation, and a marriage.
