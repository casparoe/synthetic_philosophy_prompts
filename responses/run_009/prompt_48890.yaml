  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points (5 × 4 marks each):**  
  1. **Deflationary Objection Analysis**: Correctly explains that the objection conflates actual betting with evaluative inconsistency, and that the normative force lies in revealed inconsistent attitudes.  
     *Typical Fumble*: Claims the argument requires literal betting, or that avoiding bets "solves" irrationality.  
  2. **Deflationary Reply & Repair**: Articulates the shift to preference consistency (e.g., via dominance/representation theorems) and argues this preserves the ambition by targeting structural rationality.  
     *Typical Fumble*: Mentions "potential losses" without linking to attitudes, or asserts repair changes the subject to decision theory.  
  3. **Symmetry Objection Analysis**: Identifies the false premise (that conditionalization is vulnerable) and clarifies the theorem: diachronic books target *only* non-conditionalizing rules.  
     *Typical Fumble*: Asserts "all rules are exploitable" or confuses strategy vulnerability with bookie foreknowledge of evidence.  
  4. **Symmetry Reply & Repair**: Explains conditionalization’s immunity (dynamic consistency) and defends treating rules as commitments; shows this maintains ambition by exposing inconsistency in non-conditionalizers.  
     *Typical Fumble*: Claims immunity without justification, or treats bookie knowledge as an *ad hoc* assumption.  
  5. **Ambition Preservation**: For both objections, evaluates whether repairs change the subject (e.g., deflationary repair does not; symmetry requires no repair) and ties this to the core goal: inconsistency-avoidance.  
     *Typical Fumble*: States conclusions without linking to "original ambition," or confuses synchronic/diachronic aims.  

  **A vs. B Distinction**  
  - **A (16–20)**: Hits all five points, pinpointing *where* objections fail (e.g., deflationary: misses attitude inconsistency; symmetry: misreads theorem) and *how* replies preserve normative force (e.g., repairs reframe but retain inconsistency-avoidance).  
  - **B (12–15)**: Correctly states theorems/objections but does not locate exact gaps (e.g., says symmetry objection "is wrong" without explaining conditionalization’s immunity) or describes repairs superficially (e.g., "shifts to preferences" without saying why ambition is intact).
