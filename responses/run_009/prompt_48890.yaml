  Model Answer (full):

  Deflationary Objection: The deflationary objection contends that avoiding betting altogether immunizes an agent against Dutch books, suggesting the argument indicts betting rather than incoherent credences. This objection, however, misconstrues the Dutch book argument's purpose. The betting scenario is a diagnostic tool: the agent's fair betting odds reveal her credences. Incoherent credences imply that these fair odds are inconsistent, meaning that if the agent were to set betting odds based on these credences, a bookie could construct a set of bets she would accept that together guarantee her loss. But the irrationality lies not in accepting bets per se, but in having an underlying inconsistency in her evaluations. Even if the agent never bets, she has a set of evaluations that cannot be jointly satisfied – for instance, she values combinations of gambles in a way that forces a sure loss if she were to act on them. This is a failure of instrumental rationality. A defender can thus reframe the argument without gambling: incoherent credences entail inconsistent preferences over acts, as shown by representation theorems. This repair preserves the original ambition by still demonstrating that probability axioms are necessary for consistent preference orderings.

  Symmetry Objection: The symmetry objection claims that a bookie who knows the agent's updating rule (including conditionalization) can always construct a diachronic Dutch book. This premise is false. The diachronic Dutch book theorem establishes that agents who plan to update by a rule other than conditionalization are vulnerable to a strategy: a sequence of bets, offered before and after evidence, that they will accept at each time and that together guarantee loss. Crucially, conditionalization is immune: no such strategy exists against a conditionalizer, even if the bookie knows the rule. The objection mistakenly assumes vulnerability is symmetric across updating rules. The bookie's knowledge of the rule is necessary to set up the strategy against non-conditionalizers, but it does not enable a Dutch book against conditionalizers because conditionalization ensures dynamic consistency: the agent's prior and posterior credences cohere such that no set of bets acceptable at their respective times guarantees a loss. The objection thus fails. The ambition of the diachronic argument – to identify conditionalization as the unique rule avoiding dynamic inconsistency – remains intact. One might worry that the argument requires the bookie to know the agent's updating rule, but this does not undermine the normative force: the vulnerability arises from the agent's own commitments, not the bookie's knowledge.

  Repairs and Ambition: The deflationary objection invites a shift from bets to preferences, which preserves the core insight: incoherent credences reflect inconsistent valuations. The symmetry objection requires no repair, but its misunderstanding highlights that the argument's force lies in the specific mathematical result: non-conditionalization rules are uniquely vulnerable. Both replies maintain the original ambition: to ground rational constraints in the avoidance of internal inconsistency revealed by potential losses.

  Marking Scheme (out of 20, 5 points of 4 marks each):

  Must-hit points (each worth 4 marks):

  1. Deflationary Objection: Correctly explain that the objection targets the link between incoherent credences and actual betting losses, and that the defender must decouple the normative force from actual betting by appealing to the inconsistency in evaluations revealed by fair betting odds. [Typical fumble: Claiming that the agent must accept bets, or that the argument is only about betting behavior.]

  2. Deflationary Reply: Articulate the repair that reframes the argument in terms of consistency of preferences (e.g., via representation theorems) and explain how this preserves the ambition by showing that the probability axioms are necessary for rational preference structures. [Typical fumble: Merely asserting that the argument is about potential losses without connecting to preferences, or failing to mention representation theorems.]

  3. Symmetry Objection: Accurately state that the objection claims conditionalization is also vulnerable to a diachronic Dutch book, and identify the false premise: the theorem shows conditionalization is immune. [Typical fumble: Asserting that the bookie can exploit any known rule without checking the theorem, or confusing the issue with the bookie having more information.]

  4. Symmetry Reply: Explain why conditionalization is immune: because it ensures dynamic consistency (i.e., the prior and posterior credences satisfy the probability axioms jointly), so no set of bets acceptable at their times guarantees a loss. [Typical fumble: Claiming that conditionalization is immune without explaining why, or confusing synchronic and diachronic coherence.]

  5. Repairs and Ambition: For each objection, evaluate whether the repair changes the subject. For deflationary: shifting to preferences preserves the ambition. For symmetry: no repair needed, but the argument's reliance on the agent's commitments (the updating rule) does not change the subject. [Typical fumble: Suggesting that the diachronic argument is weakened by the bookie's knowledge requirement without addressing how the normative force remains.]

  A vs. B answer: An A answer (16-20 marks) hits all five points, precisely locating where the objections go wrong (deflationary: conflates actual bets with evaluative inconsistency; symmetry: misstates the theorem) and how the replies preserve the argument's normative force. A B answer (12-15 marks) correctly states the Dutch book theorems and gestures at the objections but does not pinpoint the exact failure (e.g., says the symmetry objection is "wrong" without explaining the immunity of conditionalization) or fails to articulate how the repairs maintain the ambition.
answer: |-
  ### Exam Question  
  **Dutch Book Arguments: Objections and Replies**  
  **Time Allowed: 90 minutes**  

  Dutch book arguments aim to establish that credences violating the probability axioms (synchronic case) or the updating rule of conditionalization (diachronic case) are irrational. The core mathematical result is that such credences license a set of bets, each acceptable at the agent’s own fair betting odds, whose combination guarantees a loss. The normative conclusion is that incoherence is irrational.  

  Two objections have been raised:  

  1. **Deflationary Objection (voiced by Student A):**  
     "An agent who never accepts bets from a bookie can never be Dutch-booked. So, if the argument shows anything, it shows that *accepting bets* is irrational—not that having inconsistent credences is. After all, avoiding bets is easy. The argument conflates a practical risk (gambling losses) with a theoretical flaw (incoherent beliefs)."  

  2. **Symmetry Objection (voiced by Student B):**  
     "In the diachronic case, a bookie who knows the agent’s updating rule—whatever it is, conditioning included—can construct a sequence of bets that the agent accepts at each time, guaranteeing a loss. But if vulnerability to such a strategy suffices for irrationality, then even agents who update by conditioning are irrational! This means the standard argument for conditioning as uniquely rational proves too much, as *any* updating rule would be condemned."  

  **Your Task:**  
  Assess each objection in turn. For each:  
  - Explain whether it is decisive against the Dutch book argument it targets.  
  - If not, articulate the best reply a defender of Dutch book arguments could offer. In your reply, clearly distinguish the mathematical result from the normative interpretation.  
  - Discuss whether available repairs (e.g., reframing the argument in terms of consistency among attitudes without gambling, or treating updating rules as commitments) preserve the original ambition of Dutch book arguments or change their subject.  

  ---  
  ### Model Answer (640 words)  

  **Deflationary Objection: Not Decisive**  
  Student A’s objection misunderstands the normative foundation of Dutch book arguments. The mathematical result shows that incoherent credences *license* a set of individually acceptable bets guaranteeing loss. Crucially, the argument is not about the *act* of betting but about what the agent’s fair betting odds *reveal*: inconsistent evaluations. If an agent assigns credence 0.6 to \(P\) and 0.6 to \(\neg P\), her fair odds imply she values a bet on \(P\) at $0.60 (for a $1 payout) and a bet on \(\neg P\) at $0.60. A bookie can combine these into a Dutch book (e.g., selling both bets for $1.20, guaranteeing a $0.20 loss if \(P\) or \(\neg P\) holds). The normative leap is that this inconsistency reflects a deeper defect: the agent’s valuations cannot be jointly satisfied, violating instrumental rationality.  

  A defender’s reply: The gambling context is illustrative, not essential. The core issue is *inconsistency in the agent’s attitudes toward uncertain prospects*. Reframed without bets, incoherent credences violate axioms of rational preference (e.g., via representation theorems): they imply cycles in preferences or susceptibility to "dominance" (preferring a set of acts leading to sure loss). This repair preserves the original ambition—showing that coherence is necessary for consistent, loss-avoidant evaluations—by shifting from "gambling losses" to "structural irrationality." It does not change the subject, as the target remains the link between credences and rational constraints on attitudes.  

  **Symmetry Objection: Not Decisive**  
  Student B’s objection misstates the diachronic mathematical result. The theorem shows:  
  - If an agent *plans to update by a rule other than conditionalization*, there exists a *strategy* (bets offered before and after evidence) that guarantees loss, given the agent’s credences at each time.  
  - If an agent plans to update *by conditionalization*, no such strategy exists.  
  The flaw in the objection is its claim that conditionalization is vulnerable. Suppose an agent conditions on evidence \(E\). At \(t_0\), she has prior \(P_0\) and conditional credence \(P_0(\cdot \mid E)\); at \(t_1\), after learning \(E\), she sets \(P_1(\cdot) = P_0(\cdot \mid E)\). No combination of bets acceptable at \(t_0\) and \(t_1\) guarantees loss, because conditionalization ensures dynamic consistency: the posterior is "pre-ratified" by the prior.  

  A defender’s reply: Vulnerability arises only for non-conditionalizers because their updating rule creates a mismatch between prior and posterior evaluations. For example, an agent planning to set \(P_1(P) = 0.7\) if \(E\) occurs, despite \(P_0(P \mid E) = 0.5\), accepts a \(t_0\) bet against \(P\) if \(E\) and a \(t_1\) bet for \(P\) after \(E\), guaranteeing loss if \(E\) occurs. Crucially, the bookie’s knowledge of the updating rule enables the strategy *only* when inconsistency exists—it cannot manufacture loss for conditionalizers. The objection’s error is equivocating between "any rule" (false) and "any non-conditionalizing rule" (true).  

  The repair treats updating rules as *commitments*. The argument asks: "Which rules are invulnerable to Dutch strategies *given* the rule is known?" Conditionalization is uniquely invulnerable, so the normative conclusion stands. This preserves the ambition—identifying conditionalization as the unique rational rule—by focusing on dynamic consistency in the agent’s own commitments. It avoids changing the subject, as the bookie’s knowledge is merely a device to expose inconsistency; the core is still avoiding self-defeating evaluations.  

  **Conclusion**  
  Neither objection is decisive. The deflationary objection is answered by decoupling the argument from gambling: incoherence implies inconsistent preferences, making avoidance of sure loss a universal requirement. The symmetry objection fails by misrepresenting the theorem; conditionalization’s immunity reinforces the case for its uniqueness. Repairs preserve the ambition—probabilism and conditionalization as criteria for consistent rational agency—by emphasizing that Dutch books reveal internal conflicts in attitudes, not contingent risks of betting.  

