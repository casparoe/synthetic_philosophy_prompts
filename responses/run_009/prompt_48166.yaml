  Hmm, this is sophisticated. The user wants desiderata that must cover: specific cases (like earn-to-give vs institutional reform), key distinctions (measurable vs meaningful impact), and traps to avoid (like infinite regress or measurability bias). They emphasize wanting to see if these criteria can coexist or if trade-offs are inevitable.

  Let me unpack their core request. They're not after solutions but meta-criteria - the "what would good principles look like" question. The emphasis on joint satisfiability is crucial - they suspect inherent tensions. I notice they mention "prejudices of one camp" too, so objectivity is key.

  *scribbles mental notes* Need to structure this carefully. First, should define the playing field - what counts as systemic vs incremental? Then the cases: earning at banks vs reforming them, high-risk systemic bets. The distinctions matter too - like the difference between not supporting bad systems versus actively changing them. And those traps... the paralysis of always seeking root causes versus only funding what's measurable.

  *deep breath* The real test is whether these can all be satisfied simultaneously. My instinct says no - there are fundamental trade-offs here. Like how addressing root causes might require unmeasurable actions, or how avoiding harm might mean sacrificing short-term gains. That tension between tractability and depth seems unavoidable.

