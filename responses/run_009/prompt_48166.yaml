answer: |-
  Here is a specification of desiderata for any principle dividing resources between systemic and incremental interventions, structured as requested. The inherent tensions become apparent when evaluating joint satisfiability.

  ### I. Scope Cases the Principle Must Adjudicate
  1.  **Earning to Give (ETG) vs. Institutional Reform (IR):**
      *   **Case:** Should I work at a bank (or similar institution) earning high income to fund proven incremental interventions (e.g., deworming) *or* work within that institution (or a regulator/NGO) attempting systemic change (e.g., lobbying for fairer lending practices)?
      *   **Consideration:** ETG leverages existing systems for measurable near-term good; IR attempts to alter systems for potentially larger but less certain and delayed impact. Requires weighing certainty, scale, and time horizon against personal fit and leverage.
      *   **Status:** Non-negotiable (Any principle must address this core trade-off).

  2.  **Supporting Incremental Change Within a Flawed System vs. Withdrawing Support:**
      *   **Case:** Should I donate to a highly effective health charity operating within a corrupt government system, knowing my aid indirectly props up that system? Or should I withhold support to avoid reinforcement, even if measurable suffering increases?
      *   **Consideration:** Distinguishes between complicity/reinforcement and harm reduction. Requires evaluating net impact, counterfactuals (will withholding *actually* pressure the system?), and moral responsibility for immediate suffering vs. systemic harm.
      *   **Status:** Non-negotiable (Must handle ethical dilemmas of participation).

  3.  **High-Risk Systemic Gambles:**
      *   **Case:** Should I invest resources in a systemic intervention with a plausible chance of transformative positive change (e.g., novel policy advocacy, movement building) but also a significant risk of backfiring (e.g., strengthening backlash, wasting resources, causing unintended harm)?
      *   **Consideration:** Systemic change is often complex and unpredictable. Requires evaluating the magnitude of potential upside/downside, probability estimates (often highly uncertain), and tolerance for risk relative to known incremental benefits.
      *   **Status:** Non-negotiable (Must account for uncertainty and potential negative externalities).

  ### II. Conceptual Distinctions the Principle Must Respect
  4.  **Changing a System vs. Declining to Reinforce It:**
      *   **Distinction:** Actively working to alter structures, rules, or power dynamics vs. refusing to participate in or fund activities that sustain harmful systems (e.g., divestment, boycotting, choosing alternative employment).
      *   **Consideration:** Withdrawal reduces personal complicity and may impose costs, but often lacks a direct theory of change for systemic improvement. Active change requires a credible pathway but may involve participation. A principle must recognize these as distinct strategies with different mechanisms and moral implications.
      *   **Status:** Non-negotiable (Essential conceptual clarity).

  5.  **Measurability vs. Importance:**
      *   **Distinction:** The ease of quantifying inputs, outputs, and short-term outcomes vs. the intrinsic moral weight or long-term significance of an impact, even if poorly quantified (e.g., preserving democracy, preventing existential risk, fostering cultural shifts).
      *   **Consideration:** Incremental interventions often excel at measurability; systemic ones often target the most important but least quantifiable outcomes. A principle cannot equate "unmeasurable" with "unimportant" or "measurable" with "sufficient."
      *   **Status:** Non-negotiable (Avoiding measurability bias is critical).

  6.  **Direct vs. Indirect/Structural Causation:**
      *   **Distinction:** Addressing a proximate cause (e.g., lack of bednets causing malaria) vs. addressing a root or structural cause (e.g., poverty, weak health systems, trade policies driving inequality contributing to lack of bednets).
      *   **Consideration:** Incremental interventions typically target direct causes; systemic ones target indirect/structural causes. A principle must acknowledge causal chains and the potential for interventions at different levels.
      *   **Status:** Non-negotiable (Understanding causality is fundamental).

  ### III. Traps the Principle Must Steer Between
  7.  **The Root Cause Regress Trap (Paralysis):**
      *   **Trap:** Insisting that only the deepest "root cause" is worth addressing, leading to infinite regress ("The root cause is human nature/capitalism/biology...") and inaction, as no intervention seems fundamental enough.
      *   **Consideration:** While depth matters, perfect depth is unattainable and paralyzing. A principle must justify stopping at *some* level of analysis for practical action without falling into shallow incrementalism.
      *   **Avoidance Strategy:** Non-negotiable (A principle enabling paralysis is useless). *Prejudice:* More common in overly zealous systemic critiques.

  8.  **The Measurability Bias Trap (Tunnel Vision):**
      *   **Trap:** Systematically favoring interventions with easily quantifiable short-term outputs over those targeting potentially more significant but harder-to-measure long-term or structural outcomes, simply because of the measurement difficulty.
      *   **Consideration:** What gets measured gets managed. If a principle cannot value the unquantifiable, it will neglect crucial systemic goals.
      *   **Avoidance Strategy:** Non-negotiable (Must value importance independently of measurability). *Prejudice:* More common in rigidly quantitative incrementalist approaches.

  9.  **The False Certainty Trap:**
      *   **Trap:** Overestimating the certainty of incremental interventions (ignoring systemic factors that could undermine them long-term) or underestimating the tractability of systemic change (dismissing it as inherently unknowable).
      *   **Consideration:** Uncertainty exists on both sides. Incremental successes can be fragile; systemic changes can be planned and assessed rationally, albeit with different tools and higher uncertainty. A principle must incorporate reasonable uncertainty estimates for both types.
      *   **Avoidance Strategy:** Non-negotiable (Requires honest epistemic humility). *Prejudices:* Incrementalists may overstate certainty; systemic critics may overstate intractability.

  10. **The Purity Trap:**
      *   **Trap:** Demanding that actions be completely "pure" – avoiding any participation in or benefit from flawed systems – leading to withdrawal, inaction, or irrelevance.
      *   **Consideration:** Existence within complex societies necessitates some participation. Moral value lies in net impact, not purity. A principle must focus on reducing harm and improving systems, not achieving spotless individual hands.
      *   **Avoidance Strategy:** Non-negotiable (Pragmatism is essential). *Prejudice:* More common in certain activist strands criticizing participation.

  ### IV. Joint Satisfiability: The Inevitable Trade-offs
  **The desiderata are NOT fully jointly satisfiable without significant trade-offs.** The list itself forces difficult choices because the core tensions are fundamental:

  *   **Certainty/Measurability vs. Depth/Scale (Desiderata 1, 5, 7, 8):** Incremental interventions typically offer more certainty and measurability now; systemic interventions target deeper causes and potentially larger scale in the future. A principle demanding high certainty/measurability *and* deep systemic impact *now* is unrealistic. You must trade off near-term demonstrability for potential long-term transformation (or vice-versa).
  *   **Avoiding Complicity vs. Harm Reduction (Desiderata 2, 10):** Maximizing measurable harm reduction (e.g., funding a good charity within a bad system) often requires participation that reinforces the system. Withdrawing to avoid complicity often means forgoing that measurable good. A principle cannot simultaneously maximize short-term measurable harm reduction *and* minimize systemic reinforcement/complicity in all cases. Trade-offs are inherent.
  *   **Actionability vs. Addressing Root Causes (Desiderata 1, 3, 7):** Avoiding paralysis (Desideratum 7) requires acting at *some* level short of the ultimate root cause. However, deep systemic change (Desideratum 6) often inherently involves higher risk and uncertainty (Desideratum 3) compared to incremental actions. A principle emphasizing actionable certainty will be shallower; one demanding depth will involve more risk and less certainty.
  *   **Valuing the Unquantifiable vs. Avoiding Speculation (Desiderata 5, 9):** Respecting the importance of the unquantifiable (Desideratum 5) requires incorporating highly uncertain judgments. Avoiding false certainty (Desideratum 9) demands acknowledging this uncertainty. This creates tension: How much weight *can* be given to crucially important but highly speculative systemic interventions without falling into wishful thinking? Robust methods are needed but remain challenging.

  **Conclusion:** An adequate principle must explicitly navigate these trade-offs. It cannot satisfy all desiderata simultaneously to their maximum extent. It must provide a framework for:
  1.  **Honestly Assessing Trade-offs:** Acknowledging where criteria conflict (e.g., "This systemic option offers potentially higher importance but lower certainty and measurability than this incremental one").
  2.  **Contextual Weighting:** Determining how to weight the desiderata differently based on context (e.g., crisis vs. long-term capacity building; level of uncertainty in systemic theory of change; personal skills/access).
  3.  **Robust Decision-Making Under Uncertainty:** Employing decision-making tools (e.g., expected value reasoning with uncertainty ranges, robust portfolio approaches) that incorporate both quantifiable and qualitative factors, systemic and incremental pathways, while mitigating biases.
  4.  **Embracing Pluralism & Experimentation:** Recognizing that different actors, with different skills, resources, risk tolerances, and contexts, might justifiably land at different points on the spectrum, and that funding a *portfolio* of interventions (some systemic, some incremental) may be the wisest collective strategy to manage these trade-offs.

  The desiderata define the *problem space* and the necessary considerations. A good principle is one that transparently and rigorously navigates the inherent tensions and trade-offs within this space, rather than denying them or collapsing into one pole. The impossibility of perfect joint satisfaction *is* the core insight.
