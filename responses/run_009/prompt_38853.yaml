prompt: |-
  Quick background so you know what you're working with: I'm a backend engineer, no philosophy training, but I've ended up in a lot of arguments at work about whether we "know" things, and somewhere along the way I picked up an actual position, which is this: whether you know something depends partly on what's at stake. Not just on how good your evidence is -- the stakes themselves change whether the evidence is good enough.

  The thing that sold me: we have this norm where the same test suite counts as "we know this release is fine" when we're deploying to a dev environment, but doesn't count when we're pushing to prod during our biggest sales event, even though the evidence -- the test results -- is literally identical. Nothing about the tests changed. Only what happens if we're wrong. And there's a wierd reverse case too: during a big incident, people will claim to KNOW the root cause with way less evidence than would normally fly, because sitting there saying "we're not sure yet" while the site is down is not an option. High stakes, but it feels like the bar went DOWN instead of up. I honestly can't tell if that's a counterexample to my view or if it supports some version of it.

  So I hold this stakes-affect-knowledge view (I gather philosophers call it pragmatic encroachment). What would count against it? Specifically I want:

  - the observations, cases, and arguments that should move me, ranked from fatal to merely awkward
  - which of these a committed defender of the view would concede actually hurts, versus wave off, and what the waving-off looks like -- and whether the waving-off is legit reasoning or motivated reasoning
  - something I can't untangle: a lot of the time it seems like it's not the stakes that move the bar, it's the audience. My PM asks "do we KNOW this is fixed?" and I hear the standard shift because of who's asking and what they'll do with my answer, not because of what's riding on it. I gather there's a rival view (contextualism?) where it's all about the conversational context. Does that rival explain everything my view explains PLUS the audience stuff? And if so, is my view just outclassed, or can it absorb the audience cases somehow?
  - what does my view actually predict that its rivals don't? If it never gives a different verdict from the "stakes don't matter" view, is it even saying anything?
  - an honest assessment of whether the view has been qualified into unfalsifiability. Like, if the answer to every counterexample is "well, in THAT case the stakes were subtly different," is anything left? And would that be a fatal flaw or just how it goes for views of this kind?

  Two constraints: don't give me citations or a reading list, I want the actual arguments, and a model reading this can't check sources anyway. I vaguely remember some thought experiment involving a bank -- someone deciding whether to deposit a check on a Friday, with two versions that are evidence-identical but differ in urgency -- which I think is the classic case here. Use it if it's real, but the prompt shouldn't stand or fall on it. The thing that would move me most, for what it's worth, is a clean case where the stakes visibly change and my own intuition insists that knowledge doesn't.

  Give me the whole thing as a single JSON object with these fields:

  - "position": one-sentence steelman of my view, including what to say about the incident case where the bar seems to drop
  - "defeaters": array of objects, each with "name", "description" (what has to be true or what we'd observe), "severity" (one of "fatal", "damaging", "awkward", "merely_annoying"), "defender_response" (how a committed encroachment defender would respond), and "fair_call" (is that response legit or motivated reasoning)
  - "rival_analysis": how contextualism vs my view handles the audience cases, and whether my view is outclassed
  - "distinguishing_predictions": array of concrete cases where my view and the rivals give different verdicts; if there are none, say so honestly
  - "insulation": your assessment of whether the view has been qualified into unfalsifiability by now, and whether that's a problem for a view of this kind
  - "bottom_line": two or three sentences on where you'd tell someone holding my view to put their epistemic money

  Keep the prose inside the fields plain and jargon-light -- I'm reading this in a terminal and I'm definately not going to go read papers afterwards.
reasoning: |-
  We are constructing a JSON object with the following fields as per the user's request.

  User's position: Pragmatic encroachment - whether you know something depends partly on the stakes (what's at stake), not just the evidence. The same evidence can be sufficient for knowledge in low-stakes situations but insufficient in high-stakes ones. The user also notes a reverse case (high stakes but lower bar for knowledge) and wonders if it fits.

  We'll structure the response as follows:

  1. **position**: One-sentence steelman including the incident case (bar dropping).
  2. **defeaters**: Array of objects with:
     - name: short name for the defeater
     - description: what we observe or what must be true
     - severity: one of "fatal", "damaging", "awkward", "merely_annoying"
     - defender_response: how a pragmatic encroachment defender would respond
     - fair_call: whether that response is legit or motivated reasoning
  3. **rival_analysis**: Compare contextualism vs pragmatic encroachment on audience cases and whether pragmatic encroachment is outclassed.
  4. **distinguishing_predictions**: Array of concrete cases where pragmatic encroachment and rivals (like invariantism) give different verdicts. If none, say so.
  5. **insulation**: Assessment of whether the view is unfalsifiable due to over-qualification.
  6. **bottom_line**: Two or three sentences of advice.

  Let's build each part.

  ### Position
  Steelman: "Knowing that P requires having evidence that is strong enough given the practical stakes of being wrong about P, such that in high-stakes situations the same evidence that sufficed in low-stakes no longer counts as knowledge, and conversely, in urgent high-stakes crises, the required evidence threshold may lower because inaction is costlier than a wrong move."

  ### Defeaters
  We'll list some common objections to pragmatic encroachment.

  1. **The Bank Case (Low Stakes)**  
     - **Name**: "Low Stakes Knowledge"  
     - **Description**: In the classic bank case (Friday afternoon, low stakes), Hannah knows the bank is open Saturday because the stakes are low (she can come back Monday if needed). In the high-stakes version (urgent need to deposit to avoid foreclosure), with the same evidence, she does not know. But what if we have a case where the evidence is very strong (e.g., Hannah just left the bank and saw the Saturday hours sign) and the stakes are high? Intuition might still say she knows.  
     - **Severity**: awkward (if intuition holds)  
     - **Defender Response**: The defender might argue that in high stakes, even very strong evidence might not suffice if the cost of being wrong is catastrophic. Alternatively, they might say that the evidence in the original bank case (relying on memory of hours) isn't that strong to begin with.  
     - **Fair Call**: Partially legit; if the evidence is truly overwhelming, then perhaps the defender must concede knowledge, which would be awkward. But they can still maintain that stakes raise the bar, so that only the strongest evidence counts in high stakes.

  2. **The Reverse Case (Incident Response)**  
     - **Name**: "Urgency Lowers Bar"  
     - **Description**: As per the user, during an incident, people claim knowledge with less evidence because inaction is worse. This seems to lower the bar, not raise it, which is the opposite of what pragmatic encroachment predicts for high stakes.  
     - **Severity**: damaging (if not explained)  
     - **Defender Response**: The defender can reframe: in crisis, the stakes of inaction (or delayed action) are so high that the cost of not acting (even on less evidence) outweighs the cost of being wrong. Thus, the practical context shifts to where acting on a lower degree of certainty becomes rational, but this doesn't mean they "know" in the traditional sense; they are making a practical decision under uncertainty. Alternatively, the defender might say that the standard for knowledge in that context is lowered because the alternative (waiting for more evidence) is practically not an option.  
     - **Fair Call**: Legit reasoning if we distinguish between practical rationality and knowledge. However, it may seem like an ad hoc adjustment.

  3. **Stakes vs. Evidence Independence**  
     - **Name**: "Stakes-Independent Intuitions"  
     - **Description**: Consider a case where the stakes change but our intuition about knowledge doesn't. Example: A scientist in a lab knows a fact (e.g., water boils at 100°C at sea level) based on a reliable experiment. The stakes are raised (e.g., if wrong, a million-dollar machine breaks) but we still say the scientist knows.  
     - **Severity**: awkward  
     - **Defender Response**: The defender might say that for very well-established facts, the evidence is so strong that even high stakes don't require more. They might also note that the stakes in the scientist case are about the consequence of acting on the belief, not about the belief itself.  
     - **Fair Call**: Legit, because the view is about the evidence being strong enough relative to stakes, and if the evidence is overwhelming, it can withstand high stakes.

  4. **The Lottery Paradox**  
     - **Name**: "Lottery Ticket"  
     - **Description**: You have a lottery ticket. The chance of winning is one in a million. In low stakes, you might say you know you'll lose. But if the stakes are high (e.g., if you lose, you must do something terrible), then you don't know you'll lose. However, some philosophers argue you never know you'll lose the lottery, regardless of stakes, because your belief isn't safe or sensitive.  
     - **Severity**: merely_annoying  
     - **Defender Response**: Pragmatic encroachment can embrace this: in low stakes, we allow knowledge attributions for lottery propositions because the cost of being wrong is low, but in high stakes, we don't. This matches the intuition.  
     - **Fair Call**: Legit, and actually supports the view.

  5. **Audience Effect**  
     - **Name**: "Who's Asking?"  
     - **Description**: The bar for knowledge seems to shift based on who is asking and what they'll do with the answer, not the stakes. Example: Your PM asks if you know the fix is good, and you feel the bar is higher because they might cancel the release, even though the actual stakes (if the release fails) are the same as when you were talking to a colleague.  
     - **Severity**: damaging (if not accounted for)  
     - **Defender Response**: The defender can argue that the audience affects the perceived stakes. The PM's involvement raises the stakes because their decision has broader consequences. Alternatively, the view might be extended to include the stakes of the conversation itself.  
     - **Fair Call**: Legit if we consider the conversational context as part of the stakes, but it starts to blur with contextualism.

  ### Rival Analysis (Contextualism vs. Pragmatic Encroachment)
  - **Contextualism**: In contextualism, the meaning of "know" shifts with the context of the conversation. The audience (and their expectations, what they will do, etc.) sets the context, which determines how strong the evidence must be for a knowledge attribution. So, when the PM asks, the context becomes more demanding, hence the bar goes up.
  - **Pragmatic Encroachment**: In pragmatic encroachment, it's the actual practical stakes (what's at risk) that determine the strength of evidence required. The audience effect is explained by the fact that the audience changes the practical stakes (e.g., the PM's decision might have higher stakes). 
  - **Is Pragmatic Encroachment Outclassed?** Contextualism handles the audience effect naturally because it's built for conversational context. Pragmatic encroachment can try to absorb audience effects by linking the audience to stakes (e.g., if the audience is a decision-maker, then the stakes of being wrong are higher). But if the stakes don't actually change (only the audience does), then pragmatic encroachment might have a harder time. However, the reverse incident case (lower bar in crisis) might be harder for contextualism because the context becomes more urgent and thus less demanding? Not necessarily: in crisis, the context might become more practical and action-oriented, so the bar lowers. Contextualism can also explain that. 

  Conclusion: Contextualism might seem to explain the audience effect more directly, but pragmatic encroachment can still account for it by tying the audience to stakes. Neither is clearly outclassed, but the user might find contextualism more straightforward for audience effects.

  ### Distinguishing Predictions
  We need cases where pragmatic encroachment and its main rival (classic invariantism, which says knowledge doesn't depend on stakes) give different verdicts. Contextualism also gives a different verdict from invariantism but might be similar to pragmatic encroachment in some cases.

  1. **Bank Case (Classic)**: 
     - **Invariantism**: Either Hannah knows in both cases or doesn't. (Moderate invariantist: she knows in both; skeptic: she doesn't in either.)
     - **Pragmatic Encroachment**: She knows in low stakes, not in high.
     - **Contextualism**: The context of attribution changes: in low-stakes context, "know" is true; in high-stakes context, "know" is false.

  But the user wants a case where pragmatic encroachment and contextualism differ. They often agree, but:

  2. **Case: Hidden High Stakes**  
     - **Scenario**: Hannah is about to deposit a check on Friday. The stakes are high (she'll lose her house if it doesn't go through by Saturday) but she doesn't know that. Her spouse, who knows the high stakes, asks, "Do you know the bank is open tomorrow?" Hannah has the same evidence as the classic low-stakes case (she was there last Saturday). 
     - **Pragmatic Encroachment**: The stakes are high, so she does not know (even if she thinks she does). 
     - **Contextualism**: The context is set by the speaker (the spouse). The spouse's high stakes context makes "know" require more evidence, so the spouse would say she doesn't know. However, if Hannah were speaking in her own context (low stakes, because she doesn't know the real stakes), she might truthfully say she knows.
     - **Verdict**: Pragmatic encroachment says no knowledge (because of objective stakes). Contextualism says: in the spouse's context, she doesn't know; in Hannah's context, she does.

  This case shows a split: pragmatic encroachment is about objective stakes, contextualism about the context of the speaker.

  3. **Case: Misjudged Stakes**  
     - **Scenario**: A system is being deployed to prod during a normal day. The engineer believes the evidence is sufficient (passing tests) and the stakes are low. But unknown to her, this deployment is actually during a major sales event (high stakes). 
     - **Pragmatic Encroachment**: Because the stakes are actually high, she does not know the release is fine (even if she thinks she does). 
     - **Contextualism**: In her context (believing stakes are low), she can truthfully say she knows. In the project manager's context (knowing the high stakes), the PM says she doesn't know.
     - **Rival (Invariantism)**: She either knows or doesn't, regardless of stakes.

  So, pragmatic encroachment makes a prediction based on the real stakes, regardless of what anyone thinks.

  ### Insulation
  Is the view unfalsifiable? It might be if every counterexample is explained away by saying the stakes were different. For example, if in the scientist case the defender says the stakes weren't high enough, or the evidence was strong enough, then it becomes hard to test. However, the view is not that any change in stakes always changes whether we know, but that the required evidence level depends on the stakes. So, if we can independently measure the stakes and the evidence strength, we might test it. But in practice, the stakes and evidence strength are often hard to quantify. 

  This is a common issue in philosophy. It's not fatal per se, but it makes the view less crisp. The defender can point to clear cases (like the bank case) as core examples and treat others as borderline. It's not unfalsifiable if we can set up thought experiments with fixed evidence and varying stakes and get consistent intuitions.

  ### Bottom Line
  If you hold this view, put your epistemic money on the idea that knowledge is not just about evidence and truth, but also about the practical context of action. It reflects how we actually use the word "know" in real decisions. However, be aware that the rival view (contextualism) handles audience effects more naturally, and the reverse case (bar lowering in crisis) requires careful handling. The view is defensible but not without challenges.

  Now, we'll write the JSON object accordingly.
