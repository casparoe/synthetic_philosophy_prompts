prompt: |-
  Every spring my metaontology seminar reaches the week on quantifier variance, and every spring we stall on the same missing piece: we have all read verdicts declaring some dispute "merely verbal," but never a worked-out account of what makes one so. This year I want the specification before we read anyone's application of it. Write the desiderata that any adequate criterion for identifying verbal disputes must satisfy: the cases it must classify correctly — a dispute over whether an amateur cyclist's caffeine use counts as doping when the rulebook is silent; a dispute over whether a tomato is a fruit; the dispute, before chemistry settled it, over whether water is H2O or some other stuff could have been water; a dispute over whether mereological sums exist in addition to ordinary objects. Then the distinctions it must respect — merely verbal versus verbal-looking but substantive underneath; disputes dissolved by stipulation versus those dissolved only by discovery; disagreement between two parties versus confusion within one. And the constraints it must honor, chief among them neutrality: the criterion should not settle, in passing, the very first-order metaphysics it is meant to adjudicate. For each requirement, give the case or consideration behind it, mark which are non-negotiable and which reflect the prejudices of one camp, and tell me where you suspect the list is jointly unsatisfiable — I suspect in particular that a criterion a non-metaphysician referee could apply without doing any metaontology, and a criterion that does not quietly take sides on whether quantifiers mean one thing across all competent speakers, cannot both be had. Close with only a brief scorecard of how Chalmers's method of elimination, Thomasson's easy ontology, and Sider's appeal to a joint-carving quantifier fare against the list; the criteria, not the scores, are what I want the seminar arguing about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a metaontology seminar and every year they get stuck on quantifier variance because there's no clear criterion for what makes a dispute merely verbal. This year, they want to establish the desiderata for such a criterion before diving into applications. 

  First, I need to identify all the elements they mentioned: specific cases that must be classified correctly (amateur cyclist doping, tomato as fruit, pre-chemistry water debate, mereological sums), key distinctions (verbal vs substantive, stipulation vs discovery, interpersonal vs intrapersonal confusion), and constraints like neutrality. They also suspect some desiderata might conflict, especially neutrality versus applicability by non-experts.

  The user is clearly frustrated with the recurring roadblock. Their deeper need might be to facilitate more productive discussions by giving students clear criteria to debate, rather than getting bogged down in applications without a framework. They might also want students to critically engage with the limitations of existing approaches, hence the brief scorecard request.

  I should structure the desiderata into cases, distinctions, and constraints. Each needs examples and notes on negotiability. The neutrality constraint is crucial because any metaontological criterion shouldn't presuppose answers to the disputes it's meant to resolve. But they hint that neutrality and non-expert applicability might conflict—that's a key tension to highlight.

  For the cases: doping hinges on rulebook silence, tomato on context dependency, water on epistemic progress, mereology on ontological commitments. Each tests different aspects. The distinctions ensure the criterion isn't overapplied—like confusing verbal disputes with substantive ones masked by language. Constraints prevent bias, especially quantifier variance itself.

  When listing desiderata, I'll mark non-negotiables like neutrality and correct case classification. Others, like prioritizing linguistic competence over metaphysics, might be camp-specific (Thomasson vs Sider). The conflict between neutrality and non-expert applicability is where I suspect joint unsatisfiability—non-experts might need to engage in metaontology to apply the criterion, which violates neutrality.

  Finally, the scorecard for Chalmers, Thomasson, Sider should be concise. Chalmers' method may handle some cases but not mereology without circularity. Thomasson avoids metaphysics but might overapply verbalness. Sider's joint-carving quantifier takes a stance, violating neutrality. This sets up seminar debates on the criteria's feasibility rather than whose theory wins.
answer: |-
  Here is a structured set of desiderata for a criterion identifying "merely verbal" disputes, based on your requirements, designed to fuel seminar debate:

  **I. Cases the Criterion MUST Classify Correctly (Non-Negotiable Core Tests):**
  1.  **The Amateur Cyclist's Caffeine:** Dispute over whether caffeine use counts as "doping" *when the official rules are silent or ambiguous*.
      *   **Requirement:** The criterion *must* classify this as potentially merely verbal (resolvable by stipulation/clarification of 'doping' in *this* context), absent independent moral/scientific facts making caffeine relevantly similar to regulated substances.
      *   **Why:** Tests sensitivity to *stipulability* and *context-dependence* of meaning when rules lack determinacy.
  2.  **Tomato as a Fruit:**
      *   **Requirement:** The criterion *must* classify this as **potentially** merely verbal *in culinary contexts* (e.g., "Is a tomato a fruit in this salad recipe?") but **not** merely verbal *in botanical contexts* (e.g., "Does a tomato develop from the ovary of a flower?").
      *   **Why:** Tests sensitivity to *domain-relativity* (botany vs. cooking) and *different standards of correctness*. A good criterion must allow the same sentence to express different propositions in different contexts, sometimes verbal, sometimes not.
  3.  **Pre-Chemistry Water Debate:** Dispute over "Could some other stuff (XYZ) have been water?" *before* chemistry established that water is H₂O.
      *   **Requirement:** The criterion *must* classify this dispute as **substantive** *at the time*, even though it was later resolved empirically. It must *not* be misclassified as merely verbal just because we *now* know the answer.
      *   **Why:** Tests the ability to distinguish *epistemic status* (unknown vs. stipulative) from *metaphysical status* (verbal vs. substantive). A merely verbal dispute shouldn't require empirical discovery to resolve.
  4.  **Mereological Sums:** Dispute over whether, in addition to ordinary objects (chairs, tables), arbitrary mereological sums (like "the sum of my left shoe and the Eiffel Tower") *exist*.
      *   **Requirement:** The criterion *must* be able to **plausibly classify** this dispute *either* as merely verbal *or* as substantive, **without** presupposing the correctness of either side's ontology or specific metaontological view (like quantifier variance or absolutism). Its classification must be defensible based on the criterion itself.
      *   **Why:** This is the *crucial stress test*. Any adequate criterion must engage with this central metaontological debate without begging the question. It cannot *automatically* rule ontological disputes verbal/non-verbal by fiat.

  **II. Distinctions the Criterion MUST Respect (Non-Negotiable):**
  5.  **Verbal vs. Verbal-Looking but Substantive:**
      *   **Requirement:** The criterion must reliably distinguish disputes *genuinely* resolvable by semantic clarification/stipulation (merely verbal) from disputes where apparent semantic confusion masks a deeper, shared conceptual commitment to a substantive disagreement discoverable upon clarification (e.g., clarifying "doping" reveals both parties agree on facts but disagree on moral classification; clarifying "fruit" in botany reveals agreement on facts but not on the significance for culinary taxonomy).
      *   **Why:** Prevents over-application. Not every confusion is merely verbal; some reveal genuine disagreement.
  6.  **Stipulation vs. Discovery:**
      *   **Requirement:** The criterion must distinguish disputes resolvable purely by *stipulating* or *clarifying* meanings ("Let's define 'doping' for amateurs as...", "In botany, 'fruit' means...") from those resolvable only by *empirical investigation* or *a priori reasoning* (discovering water is H₂O, proving a mathematical theorem).
      *   **Why:** A hallmark of a merely verbal dispute is its susceptibility to resolution by agreement on language use alone, without needing new information about the world.
  7.  **Interpersonal Disagreement vs. Intrapersonal Confusion:**
      *   **Requirement:** The criterion must apply to both: (a) Two parties disagreeing due to semantic mismatch, and (b) A single party being confused or indeterminate in their *own* usage/understanding (e.g., a rulebook writer realizing their "doping" rule is ambiguous even to themselves).
      *   **Why:** Verbal disputes aren't solely interpersonal phenomena; conceptual unclarity can reside within one mind.

  **III. Constraints the Criterion MUST Honor (Non-Negotiable):**
  8.  **Neutrality (The Paramount Constraint):**
      *   **Requirement:** Applying the criterion to classify a dispute (especially ontological disputes like mereological sums) **must not** presuppose or entail the truth or falsity of *any* substantive first-order metaphysical claim involved *in that dispute*, nor of central metaontological theses (especially quantifier variance vs. quantifier absolutism/univocality).
      *   **Why:** The criterion is meant to be a *tool for adjudicating* whether a dispute is verbal, not a covert way to *settle* the dispute itself or the meta-debate about quantifiers. Violating this renders the criterion useless for its intended purpose in metaontology.
  9.  **Non-Triviality:**
      *   **Requirement:** The criterion must not be so weak that *no* plausible ontological dispute qualifies as substantive, nor so strong that *only* empirically resolvable disputes qualify as substantive (ruling out a priori metaphysical disputes by default).
      *   **Why:** Avoids vacuity. Must carve a meaningful space for both types of disputes.

  **IV. Potential Conflict & Suspected Joint Unsatisfiability:**
  *   **The Suspected Conflict:** Desideratum 8 (**Neutrality**) and the desire for a criterion applicable by a **non-metaphysician referee without doing metaontology** are likely in deep tension, possibly jointly unsatisfiable.
  *   **Why:** Applying a criterion to a deep ontological dispute (like Desideratum 4) almost inevitably requires making judgments about meaning, reference, or the nature of disagreement that *touch upon* core metaontological commitments. Can a referee decide if the quantifier variance debate *itself* is verbal without engaging with what quantifiers *are* or *do*? Avoiding metaontology might force the referee to rely on superficial linguistic behavior or intuitions, which risks violating Neutrality (e.g., assuming shared quantifier meanings presupposes absolutism; taking persistent disagreement as evidence of substantiveness might ignore variance). Truly applying a *neutral* criterion likely requires the referee to engage in precisely the kind of careful semantic/metaphysical analysis the constraint hopes to avoid presupposing.

  **V. Brief Scorecard of Representative Approaches:**
  *(Focus on key strengths/weaknesses vis-à-vis the desiderata, not overall judgment)*

  *   **Chalmers (Method of Elimination):** Strong on 1, 2, 3, 5, 6, 7. Faces significant challenges with **4 & 8 (Neutrality)** – Does constructing epistemic scenarios require assuming a "fundamental" semantics/ontology? Does resolving disputes by finding a common base vocabulary beg the question against variance? Non-expert application might be difficult for deep metaphysics.
  *   **Thomasson (Easy Ontology/Pragmatic Analyticity):** Excels at 1, 2, 6, 7. Potentially strong on **4 & 8 (Neutrality?)** – Argues many ontological disputes *are* verbal based on conceptual analysis tied to application conditions, claiming neutrality. **Major Challenge:** Desideratum **3 & 5** – Does her approach risk making *too many* disputes (like pre-chemistry water) verbal by making meaning overly dependent on current conceptual/social practices? Critics argue it collapses substantive modal distinctions.
  *   **Sider (Joint Carving / Quantifier Absolutism):** Clear on 3 (pre-chemistry water substantive). **Major Challenges:** Fails **8 (Neutrality)** catastrophically – The criterion *is* the first-order metaphysical stance (absolutism). Fails **4** as a *neutral* test – It straightforwardly declares disputes like mereological sums substantive *by fiat*. Fails the non-expert applicability test for deep ontology (finding the joint-carving structure *is* metaphysics). May struggle with the flexibility needed for **2**.

  **The Goal for Seminar:** Focus the debate rigorously on whether *any* criterion can possibly satisfy *all* the listed desiderata simultaneously, especially the core cases (1-4), the neutrality constraint (8), and the non-expert applicability aspiration, given the suspected tension. Does the list itself reveal why the "missing piece" remains elusive?
