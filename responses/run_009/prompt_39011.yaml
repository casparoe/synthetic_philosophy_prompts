  Now decompose it for me, because the bare number is useless without the derivation. Some terms you should probably include (add others if you think they belong): the probability that the suffering or distress caused by virtual acts is the right kind of suffering to ground moral harm rather than something more like being annoyed or having your fun ruined; the probability that virtual property (items with real market value, an avatar someone spent thousands of hours on) is the kind of thing one can be genuinely wronged by losing; the probability that consent structures in virtual worlds (terms of service, in-game norms, the ability to log off) typically defeat the harm claim; and the probability that whatever the right metaethical story is, it doesn't collapse the distinction between harming a person and harming their representation. Give each a rough probability with one line of justification, show roughly how they combine into your final credence, and tell me which single term the final number is most sensitive to.

  One more thing: my partner is at maybe 0.15 on this because she says logging off is always an exit and nobody's really worse off, while I sit around 0.7. Given your decomposition, what do you think the two of us are actually disagreeating about — which sub-question is doing the work? And what kind of argument or case would move your number the most in either direction? Don't just tell me "it's complicated," give me the actual number and the map of what it hangs on.
