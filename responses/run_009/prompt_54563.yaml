prompt: |-
  I teach philosophy of science, and before academia I spent a decade as a data scientist building binary classifiers -- credit risk, fraud detection, medical triage -- so the vocabulary I actually think in is sampling frames, class imbalance, likelihoods, base rates, calibration, and inductive bias. Restate the raven paradox in that vocabulary, as faithfully as you can: Nicod's criterion, the equivalence condition, and the white shoe that allegedly confirms that all ravens are black. Assume I already know the standard Bayesian negligibility answer associated with I. J. Good -- that a non-black non-raven raises the probability of the generalization by a vanishing amount, because non-ravens so vastly outnumber ravens -- so pitch past it. Then give me the residue report. Which parts of the paradox translate cleanly into questions about what a labeled sample from a population supports about that population, which translate only with distortion, and which have no counterpart at all in how my old field handles evidence? Two places I especially want examined: first, whether the equivalence condition becomes trivial in my vocabulary -- a mere reparameterization of the hypothesis, since the classifier is indifferent to which way you code the classes -- or whether it still carries philosophical weight; second, whether Goodman-style worries about which predicates are projectible are simply what my field called the choice of inductive bias or feature representation, or something my vocabulary silently presupposes an answer to. Where the translation fails, tell me whether the failure is a defect of my vocabulary or a sign that the original claim was less clear than it looked.
