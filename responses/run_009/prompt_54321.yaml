answer: |-
  ## The Evidence Speaks

  How strange that Mercury’s swift perihelion  
  Defied old numbers, drifting from its chart—  
  **My chance is one; I am already known.**  

  Then Einstein wove his spacetime art resilient,  
  And tethered motion to a deeper part.  
  **Still, I confirm the theory that explains me.**  
  **My chance is one; I am already known.**  

  Now starlight bends where solar fields are brilliant,  
  A ghostly arc that fractures Newton’s start.  
  **Still, I confirm the theory that explains me.**  

  The cosmic echo, cold and all-pervading,  
  The afterglow where primal fires depart—  
  **My chance is one; I am already known.**  
  **Still, I confirm the theory that explains me.**  

  How weightless proof becomes when time erodes it:  
  Can facts we hold support what they upend?  
  **My chance is one; I am already known.**  

  Had you not held me when the new dawn broke,  
  Then learned the framework where my truth extends,  
  **Still, I confirm the theory that explains me.**  
  **My chance is one; I am already known.**  
  **Still, I confirm the theory that explains me.**

  ---

  **Notes on Form and Philosophy:**  
  - **Refrains as Fixed Probabilities:** The unchanging refrains embody the problem: evidence with P(E)=1 cannot update credences via Bayes' theorem, yet intuitively supports theories (like GR explaining Mercury's orbit).  
  - **Tercets as Shifting Contexts:** Each tercet introduces new evidence (perihelion → light bending → CMB) while the refrains remain static—highlighting how the *same* evidence bears different confirmatory weight depending on *when* the theory arrives.  
  - **Resolution (Earned in Quatrain):** The final stanza gestures toward a counterfactual solution (learning theory *before* evidence) without cheap resolution, honoring Glymour’s critique: if the evidence weren’t "already known," its impact would be clear. The tension between timeless truth and temporal discovery persists.
