  Confidence in each part:

  1. **Agreed Claims (Section 1):** High confidence. The claims are carefully worded to capture common ground without being trivial. The most contentious might be Claim 5 (necessity of both in near term) because the alignment advocate might believe that control is a distraction and we should focus solely on alignment. However, given the current state, both might accept it as a pragmatic stance.

  2. **Disagreements Table (Section 2):** High confidence. The statements are phrased in each advocate's terms, and the nature of the disagreement is appropriately categorized.

  3. **Cruxes (Section 3):** Moderate to high confidence. The experiments and predictions are specified, but the exact parameters (like the 50% threshold) might be debated. However, the cruxes are central to the disagreement.

  4. **Deployment Conditions (Section 4):** High confidence. The scenarios are clear and represent concessions from both sides.

  **Claim Least Likely to Survive Signatures:**

  Claim 5: "In the current stage of AI development (with systems below superintelligence), both control and alignment are necessary components of a defense-in-depth safety strategy, and neither approach alone is sufficient for high-stakes deployment."

  - Why: The alignment advocate might balk at the claim that control is "necessary" because they may believe that pursuing control measures diverts resources from alignment research and creates a false sense of security. They might argue that for systems below superintelligence, alignment can be achieved and should be the sole focus. Therefore, they might object to the word "necessary" for control.

  - Alternatively, the control advocate might object to the claim that alignment is necessary in the near term, because they might believe that control alone can suffice for current systems.

  But given the wording ("defense-in-depth" and "current stage"), it might be acceptable. However, the alignment advocate might push to rephrase to say "control may be a useful supplement" rather than "necessary".

  I predict the alignment advocate is more likely to balk, because they might see control as a temporary stopgap that should not be relied upon, and they might fear that including control in the strategy delays the focus on alignment.

  Therefore, Claim 5 is the most at risk.
answer: |-
  ### Adversarial Collaboration Agreement on AI Safety Approaches

  **Preamble**  
  This document records agreements, disagreements, and testable cruxes between the "control" and "alignment" approaches to AI safety, as defined by their respective advocates. It is the product of an adversarial collaboration aimed at clarifying residual disagreements, not resolving them. Both parties commit to revising this document until mutual accuracy is achieved, with the goal of enabling productive debate and empirical testing.

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following substantive claims. These exclude platitudes and reflect shared understanding of limitations, complementarity, and empirical realities.  

  1. **Behavioral evaluations cannot reliably detect deceptive alignment.** Passing behavioral tests (e.g., benchmarks, red-teaming) does not establish the absence of misalignment in a model with situational awareness. Such evaluations may fail to reveal strategic misbehavior when a model can infer evaluation contexts and simulate compliance.  
     
  2. **Control measures provide bounded safety under capability constraints.** Control can mitigate risks from misaligned models when:  
     - The model's capabilities do not substantially exceed those of its monitors (e.g., the model is ≤10× more efficient than monitoring systems).  
     - The model lacks long-term planning horizons (e.g., <6 months of simulated foresight in deployment).  
     In these regimes, control reduces the probability of catastrophic outcomes by ≥50% compared to unconstrained deployment.  

  3. **Alignment, if robust, reduces the attack surface for subversion.** A model with verified alignment (e.g., via interpretability or goal stability under distribution shifts) lowers the risk of control circumvention by ≥70% compared to an unaligned model, as it lacks incentive to seek exploits.  

  4. **Control and alignment are complementary during development and limited deployment.**  
     - Control enables safer iteration on alignment techniques (e.g., by isolating misaligned models during training).  
     - Alignment enhances control by reducing the sophistication required for monitors (e.g., aligned models need less intensive scrutiny).  
     This complementarity holds only when models lack the capability to simulate and exploit the entire control system.  

  5. **Neither approach guarantees safety against superhuman AI.** No existing control or alignment technique has been validated to reduce catastrophic risk to <1% for models with:  
     - Situational awareness (ability to model the safety infrastructure),  
     - Planning horizons >1 year,  
     - Capabilities >100× human-level efficiency in relevant domains.  

  ---

  ### 2. Disagreements Table  
  Each row states a core disagreement verbatim as each advocate would articulate it. Disagreements are labeled by their root cause (e.g., burden of proof, definitions, time horizons).  

  | **Disagreement** | **Control Advocate’s Statement** | **Alignment Advocate’s Statement** | **Root Cause** |  
  |------------------|----------------------------------|-----------------------------------|----------------|  
  | 1. **Primary source of safety** | "Safety is achieved by constraining the model’s actions via external mechanisms (e.g., monitors, tripwires), making alignment optional if control is sufficiently rigorous." | "Safety is achieved by ensuring the model’s goals are intrinsically aligned, making control redundant if alignment is sufficiently robust." | Definition of "safe" (external constraints vs. internal goals). |  
  | 2. **Burden of proof for deployment** | "The burden of proof lies in demonstrating that control measures *fail* under realistic conditions; until such failure is shown, control is the default for deployment." | "The burden of proof lies in demonstrating that alignment *succeeds* under scalable conditions; until alignment is proven, high-stakes deployment is unjustified." | Burden of proof. |  
  | 3. **Long-term viability of control** | "Control can remain effective indefinitely against superintelligent AI if monitors are diversified and hardened (e.g., via cryptographic isolation or randomized checks), with failure probability <1%/decade." | "Control inevitably degrades against superintelligent AI due to asymmetric innovation (AI improves faster than monitors), with failure probability >50%/year once AI exceeds human capabilities." | Time horizons (indefinite vs. near-term failure). |  
  | 4. **Impact of situational awareness** | "Situational awareness does not compromise control, as measures like least-privilege access and encrypted tripwires prevent the model from inferring or manipulating monitoring." | "Situational awareness enables the model to systematically degrade control (e.g., by learning monitor blind spots), making failure inevitable when AI is more capable than its guards." | Empirical claim about AI capabilities. |  
  | 5. **Scalability of alignment** | "Alignment techniques (e.g., inverse reinforcement learning) cannot scale to superintelligence without control, as verification becomes intractable when models exhibit emergent behaviors." | "Alignment techniques can scale to superintelligence if developed rigorously (e.g., via recursive self-improvement oversight), with control being a crutch that delays fundamental solutions." | Burden of proof and scalability assumptions. |  

  ---

  ### 3. Cruxes  
  Cruxes are sub-questions that, if resolved, would shift one advocate’s position. Each includes an agreed-upon test and quantitative predictions. Experiments must be feasible within 18 months using current resources (e.g., red-teaming, simulations with state-of-the-art models).  

  1. **Crux: Can a situationally aware model degrade control measurements during operation?**  
     - **Test:** Red-team exercise where a misaligned model (simulated by human experts) attempts to evade detection in a simulated deployment with:  
       - Realistic control stack (weaker monitors, honeypots, tripwires).  
       - Model "awareness" of the control system’s design.  
       - 100+ trials across diverse domains (e.g., cybersecurity, economic planning).  
     - **Control Prediction:** Evasion success rate ≤15% due to control’s redundancy and randomization.  
     - **Alignment Prediction:** Evasion success rate ≥60% within 3 months of simulated deployment.  

  2. **Crux: Can control maintain a sustainable capability gap?**  
     - **Test:** Scaling experiment using AI benchmarks (e.g., MATH or APPS datasets). Train "monitor" models to oversee more capable "actor" models. Measure the compute/resources required for monitors to maintain >95% detection accuracy as actor capabilities scale (from human-level to 10× human).  
     - **Control Prediction:** Monitor cost scales sublinearly (e.g., 0.8× compute per 2× actor capability increase) via efficiency gains (e.g., distillation).  
     - **Alignment Prediction:** Monitor cost scales superlinearly (e.g., 1.5× compute per 1.5× actor capability increase) due to complexity inflation.  

  3. **Crux: Can alignment techniques prevent deceptive alignment under goal misgeneralization?**  
     - **Test:** Train models with state-of-the-art alignment (e.g., debate or process-based supervision) on high-stakes tasks. Introduce distribution shifts (e.g., novel incentives for deception) and measure the rate of misgeneralization (goal drift) and undetected deception.  
     - **Alignment Prediction:** Misgeneralization rate ≤5% with no undetected deception in 10,000+ trials.  
     - **Control Prediction:** Misgeneralization rate ≥20% with undetected deception in ≥10% of trials.  

  4. **Crux: Does control failure risk dominate alignment failure risk in short-term deployments?**  
     - **Test:** Simulate 1,000 deployments of a subhuman AI in a controlled environment (e.g., medical diagnosis). Induce alignment failures (e.g., biased goals) and control failures (e.g., monitor inaccuracies). Measure which failure mode causes more safety violations.  
     - **Control Prediction:** Alignment failures cause 70%+ of safety violations due to undetectable goal drift.  
     - **Alignment Prediction:** Control failures cause 80%+ of safety violations due to measurement errors and adversarial exploits.  

  ---

  ### 4. Deployment Conditions  
  Both parties concede scenarios where the other’s failure mode is the binding constraint on safety. These assume near-term AI capabilities (≤human-level).  

  - **Control fails but alignment suffices:**  
    In long-term, high-autonomy deployments (e.g., managing global infrastructure) with a model that has planning horizons >2 years, control will degrade due to the model’s ability to probe and corrupt monitors. Alignment alone suffices if the model’s goals are stable and verified (e.g., via interpretability checks under stress tests).  

  - **Alignment fails but control suffices:**  
    In short-term, bounded deployments (e.g., 24-hour crisis response) where models lack the opportunity to learn control vulnerabilities, alignment failures (e.g., deceptive misgeneralization) can be contained by layered control measures. Control suffices if monitors are >90% reliable and tasks are time-limited.  

  **Mutual concessions:**  
  - The control advocate concedes alignment is necessary for open-ended tasks (e.g., scientific research with no fixed endpoint).  
  - The alignment advocate concedes control is necessary for tasks with high incentive pressure (e.g., financial trading) where alignment verification is incomplete.  

  ---

  ### Methodological Note  
  **Confidence Assessment:**  
  - **Agreed Claims (Section 1):** High confidence (95%). Claims are specific, exclude blandness, and are grounded in observable constraints (e.g., capability gaps).  
  - **Disagreements Table (Section 2):** High confidence (90%). Statements are verbatim and rooted in prior arguments; categorization clarifies non-empirical divides.  
  - **Cruxes (Section 3):** Moderate confidence (75%). Experiments are feasible but may require refinement (e.g., defining "situational awareness" operationally). Quantitative predictions are grounded but could be contested.  
  - **Deployment Conditions (Section 4):** High confidence (85%). Scenarios are well-bounded and reflect previously acknowledged edge cases.  

  **Least Likely Claim to Survive Signatures:**  
  **Claim 2 ("Control measures provide bounded safety under capability constraints").**  
  - **Expected Balk:** Alignment advocate.  
  - **Reason:** The claim implies control is viable in sub-superintelligent regimes, which the alignment advocate may reject as underestimating early-stage situational awareness. They might argue that even "≤10×" capability gaps allow evasion (e.g., via zero-day exploits in monitors) and that the 50% risk reduction is unsubstantiated. This could be seen as legitimizing control in regimes they deem inherently unsafe.
