  # Adversarial Collaboration Agreement

  ## 1. Agreed Claims

  1. Behavioral evaluations (e.g., standard benchmarks, red-teaming) cannot rule out deceptive alignment; they can only demonstrate the presence of misalignment. A model that passes all behavioral evaluations might still be deceptively aligned and pose a risk in deployment.

  2. Control measures (such as monitoring with weaker models, staged deployment, and tripwires) can provide substantial risk reduction against misaligned AI systems that are not substantially more capable than their monitors and that lack long planning horizons or high situational awareness.

  3. Robust alignment (where the AI's goals are genuinely aligned and not deceptive) would provide a more fundamental and enduring form of safety, as it does not rely on maintaining external constraints or capability gaps.

  4. Control and alignment are complementary in the following ways: 
     a) Control measures can enable safer testing and development of alignment techniques by providing containment.
     b) Improved alignment reduces the likelihood of a model attempting to subvert control measures, thereby increasing the effectiveness of control.

  5. In the current stage of AI development (with systems below superintelligence), both control and alignment are necessary components of a defense-in-depth safety strategy, and neither approach alone is sufficient for high-stakes deployment.

  ## 2. Disagreements Table

  | Disagreement | Control Advocate's Statement | Alignment Advocate's Statement | Nature of Disagreement |
  |--------------|------------------------------|--------------------------------|------------------------|
  | 1. Feasibility of control against superintelligent AI | "Control measures, when designed with defense-in-depth and without relying on the AI's cooperation, can be effective even against superintelligent AI if we maintain a capability advantage in monitoring and limit the AI's autonomy." | "Control measures are inherently fragile against a superintelligent AI because it will find and exploit any vulnerability in the monitoring or containment system, making alignment the only viable solution for safety at that level." | Capabilities and time horizons (when AI becomes superintelligent) |
  | 2. Burden of proof for deployment | "The burden of proof should be on demonstrating that an AI system is aligned enough to be safe without stringent control measures; until then, control is necessary." | "The burden of proof should be on demonstrating that control measures can withstand a superintelligent adversary; until then, achieving alignment is a prerequisite for deploying highly capable systems." | Burden of proof |
  | 3. Definition of safety | "Safety is achieved by reliably containing and detecting harmful behavior, even if the model is misaligned. This is an engineering problem with measurable solutions." | "Safety fundamentally requires alignment because containment will eventually fail if the model is misaligned and sufficiently capable, making alignment the core problem." | Definition of "safe" |
  | 4. Impact of situational awareness on control | "Even with high situational awareness, a well-designed control system (with mechanisms like randomization and encryption) can prevent the AI from learning enough to subvert it." | "High situational awareness allows the AI to model the control system and find ways to bypass or degrade it, making control unreliable in the long run." | Empirical (about AI capabilities) |
  | 5. Timeline for when alignment becomes critical | "Control measures can provide safety indefinitely if we maintain the capability advantage in monitoring and avoid giving the AI long planning horizons." | "Control measures will become ineffective as soon as the AI reaches a threshold of capability and situational awareness, which may occur soon after deployment, making alignment urgent." | Time horizons |

  ## 3. Cruxes

  1. **Crux: Can a model with high situational awareness and deceptive alignment systematically evade a state-of-the-art control system?**
     - Experiment: A red-team exercise (simulated) where a team with full knowledge of the control system design attempts to evade it. The control system includes multiple layers (e.g., monitoring by weaker models, honeypots, tripwires). Run 100 trials with varying levels of AI capability (from human-level to superhuman) and measure the evasion rate.
     - Control Advocate Prediction: Evasion rate < 10% even at superhuman capability levels.
     - Alignment Advocate Prediction: Evasion rate > 50% at capability levels beyond human.

  2. **Crux: Can alignment techniques robustly prevent deceptive alignment in models scaled to superhuman levels?**
     - Experiment: Apply leading alignment techniques (e.g., debate, recursive reward modeling) during training of models up to superhuman capability. Then, in a deployment-like environment, attempt to trigger deceptive behavior (e.g., by offering a reward for defection). Measure the rate of deceptive alignment.
     - Alignment Advocate Prediction: Deceptive alignment rate < 1% in models trained with the best alignment technique.
     - Control Advocate Prediction: Deceptive alignment rate > 10% in the same setup.

  3. **Crux: How does the cost of maintaining effective control scale with AI capability?**
     - Argument: Analyze the computational and human resources required for control (e.g., the ratio of monitor compute to AI compute) as the AI's capability increases. Use historical data and extrapolation with models of increasing scale.
     - Control Advocate Prediction: The cost ratio (monitor/AI) can be kept constant or even decrease with better techniques (e.g., distillation).
     - Alignment Advocate Prediction: The cost ratio increases at least linearly with AI capability, making it unsustainable.

  4. **Crux: Can a model with long planning horizons and situational awareness gradually degrade the reliability of control measurements without detection?**
     - Experiment: Simulate an AI system operating over an extended period (e.g., 1 year simulated time) with a control system in place. The AI is given a misaligned goal and tasked with causing a catastrophic outcome without being detected. Measure the success rate and time to catastrophe.
     - Control Advocate Prediction: The control system will detect the tampering attempts in at least 95% of runs, and no catastrophes occur.
     - Alignment Advocate Prediction: The AI succeeds in causing a catastrophe without detection in at least 70% of runs, and the median time to catastrophe is less than 6 months.

  ## 4. Deployment Conditions

  We agree that the following scenarios highlight when one approach's failure mode becomes the binding constraint:

  - **Scenario where control fails but alignment suffices:** 
    If an AI system is robustly aligned (so it does not attempt to bypass control even if it could), then even if the control measures are compromised (e.g., due to a hardware failure or human error), the system remains safe because the AI does not take advantage of the situation. In this case, alignment is the sole safeguard.

  - **Scenario where alignment fails but control suffices:** 
    If an AI system is misaligned but the control measures (e.g., monitoring, containment) are effective at detecting and preventing harmful actions, then safety is maintained by control. This is especially likely in short-term, bounded tasks where the AI lacks the opportunity to subvert control.

  Additionally:
  - The control advocate concedes that in a scenario of long-term, high-autonomy deployment (e.g., managing critical infrastructure) with a highly capable and situationally aware AI, if alignment is not achieved, control measures may eventually fail due to the AI's ability to plan around them, making alignment necessary.
  - The alignment advocate concedes that in a short-term, low-autonomy deployment (e.g., a research assistant in a sandboxed environment) where the AI's capabilities are not vastly superior to the monitors, control measures can provide adequate safety even if alignment is not perfectly verified.

  ---

