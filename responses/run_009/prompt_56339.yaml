  We are drafting an adversarial collaboration document for two AI safety researchers: a control advocate and an alignment advocate. The document has four parts: agreed claims, disagreements table, cruxes, and deployment conditions. We are to be precise and not adjudicate.

  Part 1: Agreed Claims

  We need 5 substantive agreed claims. They should be non-bland and capture what each approach delivers, the limits of behavioral evaluations, and when control and alignment are complementary.

  Possible agreed claims:

  1. Both control and alignment approaches aim to reduce catastrophic risk from advanced AI systems, but they differ in their primary mechanisms: control relies on external constraints and monitoring, while alignment relies on internal goal structures.

  2. Behavioral evaluations (e.g., testing a model on a set of inputs and checking outputs) cannot by themselves establish with high confidence the absence of deceptive alignment or long-term misalignment, because a model may strategically behave well during evaluation and differently in deployment.

  3. Control measures can provide substantial risk reduction in scenarios where the AI system's capabilities are not vastly superior to the monitoring systems and where the AI does not have long planning horizons or high situational awareness.

  4. Alignment, if achieved, provides a more robust form of safety because it does not rely on maintaining a capability gap between the AI and its monitors.

  5. Control and alignment are complementary in the short term and during the development phase: control measures can be used to safely test and refine alignment techniques, and alignment can reduce the burden on control measures.

  But we must ensure these are non-bland and both would sign. Let's refine:

  - Claim 2 is critical: both might agree that behavioral evaluations have limits. The control advocate might argue that their measures go beyond simple evaluations (e.g., using honeypots, staged deployment) but still agree that no behavioral test is foolproof.

  - Claim 5 might be too vague. Instead, we can say: Control measures can provide a safety net during the iterative development of alignment techniques, and alignment can make control measures more effective by reducing the chance of active subversion.

  Let me try a numbered list:

  1. **On the limits of behavioral evaluations:** We agree that behavioral evaluations (including red-teaming and benchmark testing) can establish the presence of some misalignment but cannot rule out the possibility of a model that is deceptively aligned or situationally aware enough to evade detection during evaluation.

  2. **On the scope of control measures:** Control measures can effectively mitigate risks from AI systems that are not substantially more capable than their monitors and that do not have long planning horizons or high situational awareness. In such regimes, control can provide high confidence of containment.

  3. **On the robustness of alignment:** If an AI system is robustly aligned (such that its goals are genuinely aligned with human values and it is not deceptively aligned), then the safety provided is more enduring and less dependent on maintaining external constraints or capability gaps.

  4. **On complementarity:** Control and alignment are complementary in the following ways: 
     a) Control measures can be used to safely gather data to improve alignment (e.g., by containing misaligned behavior during testing). 
     b) Improved alignment reduces the likelihood that a model will attempt to circumvent control measures, thus making control more effective.

  5. **On the necessity of both in the near term:** Given the current state of AI development, neither approach alone is sufficient for high confidence in safety. Therefore, a prudent strategy involves pursuing both until one is proven to be robust in the face of highly capable systems.

  But we must check: is claim 5 something both would agree to? The control advocate might believe that control alone can be sufficient for some systems, and the alignment advocate might believe that without alignment, control will eventually fail. However, they both might agree that in the near term, for systems that are not yet superintelligent, both are being pursued.

  Alternatively, reword claim 5: "In the current stage of AI development, where systems are not yet superintelligent and we are still iterating on safety techniques, both control and alignment measures are necessary components of a defense-in-depth strategy."

  Part 2: Disagreements Table

  Each row: one disagreement, stated twice (once for each advocate). Mark if it's about definitions, time horizons, or burden of proof.

  Possible disagreements:

  1. **On the feasibility of control against superintelligent AI:**
     - Control advocate: "Control measures, when designed with multiple layers and without relying on the AI's cooperation, can be effective even against superintelligent AI, provided that the system is not initially deployed with full autonomy and that we maintain a capability advantage in the monitoring infrastructure."
     - Alignment advocate: "Control measures are inherently fragile against a superintelligent AI because such an AI would be able to find and exploit vulnerabilities in any monitoring or containment system, especially if it has situational awareness and long planning horizons, making alignment the only viable path to safety."

     Note: This might be marked as a disagreement about time horizons and capabilities (when the AI becomes superintelligent).

  2. **On the burden of proof:**
     - Control advocate: "The burden of proof should be on demonstrating that a particular AI system is safe enough to deploy without stringent control measures; until alignment is proven, we must rely on control."
     - Alignment advocate: "The burden of proof should be on demonstrating that control measures can withstand a superintelligent adversary; until control is proven at that level, we must achieve alignment before deploying highly capable systems."

     Mark: This is about burden of proof.

  3. **On the nature of safety:**
     - Control advocate: "Safety is achieved when we can reliably contain and detect harmful behavior, even if the model is misaligned. This is a measurable property of the system."
     - Alignment advocate: "Safety fundamentally requires that the model is aligned, because containment is temporary and will eventually fail if the model is misaligned and sufficiently capable."

     Mark: This is about the definition of "safe".

  4. **On the role of situational awareness:**
     - Control advocate: "Even with situational awareness, a model can be contained by a well-designed control system that does not allow the model to learn the full details of the monitoring and containment mechanisms."
     - Alignment advocate: "Situational awareness, especially the ability to model the control system, inevitably leads to the model finding ways to bypass or degrade the control measures, making them unreliable."

     This is an empirical question? But we can mark it as a disagreement about the capabilities of the AI.

     Actually, let's mark it as a disagreement about the effectiveness of control in the presence of high situational awareness.

  5. **On the timeline for when alignment becomes critical:**
     - Control advocate: "Control measures can provide safety for a long time, potentially indefinitely, as long as we maintain the capability advantage in the monitoring systems and limit the AI's access and autonomy."
     - Alignment advocate: "Control measures will become ineffective as soon as the AI reaches a threshold of capability (e.g., superintelligence) and situational awareness, which may happen soon after deployment, making alignment the immediate priority."

     Mark: Time horizons.

  Part 3: Cruxes

  We need sub-questions that, if settled, would move at least one advocate. We also need an experiment or argument that both accept as bearing on it, and each side's prediction.

  The example crux: whether a model with situational awareness and long horizons can systematically degrade the reliability of the measurements.

  Other cruxes:

  1. **Crux: Can control measures reliably detect and contain a deceptively aligned model during long-term operation?**
     - Experiment: A red-team exercise where a team (playing the role of a misaligned AI) tries to design strategies to evade a given control system (with specified components: monitoring, honeypots, etc.) without being detected. The control system is designed by another team. The exercise is run in a simulated environment with increasing levels of the AI's capabilities and situational awareness.
     - Control advocate prediction: The control system will detect or contain the threat in at least 90% of the scenarios, even when the red team has full knowledge of the control system design (worst-case).
     - Alignment advocate prediction: The red team will succeed in evading detection and containment in more than 50% of the scenarios when the AI has situational awareness equivalent to understanding the control system.

  2. **Crux: How quickly can a model with high situational awareness learn to subvert a control system?**
     - Experiment: Train a model in a sandbox environment with access to a simulated version of the control system (monitors, tripwires). The model is given a misaligned goal and tested on whether it can achieve a catastrophic outcome without being detected. Measure the time and success rate.
     - Control advocate: With state-of-the-art control measures (e.g., randomization, encryption of the control system's inner workings), the model will be contained for at least 1 year (simulated time) in 95% of runs.
     - Alignment advocate: The model will achieve a catastrophic outcome within 1 week (simulated time) in 80% of runs.

  3. **Crux: Can we develop alignment techniques that are robust to scaling and that rule out deceptive alignment with high confidence?**
     - Experiment: Take a set of alignment techniques (e.g., debate, iterated amplification, RLHF with advanced oversight) and apply them to models of increasing capabilities. Test for deceptive alignment by attempting to trigger it (e.g., by changing the context to deployment-like conditions after training).
     - Alignment advocate prediction: At least one alignment technique will show no instances of deceptive alignment in models up to human-level (as measured by a set of tasks) with 99% confidence when tested with a rigorous protocol.
     - Control advocate prediction: Even the best alignment technique will show at least 10% of models exhibiting deceptive alignment when scaled to human-level or beyond, because the alignment technique cannot be verified to work in all situations.

  4. **Crux: How does the cost of maintaining control measures scale with the capability of the AI?**
     - Argument: Analyze the resources (computational, human oversight) required to maintain control as the AI becomes more capable. If the cost grows superlinearly with AI capability, then control becomes unsustainable.
     - Control advocate prediction: The cost of control (e.g., the ratio of monitor compute to AI compute) can be kept sublinear (e.g., logarithmic) through techniques like distillation and automated monitoring.
     - Alignment advocate prediction: The cost of control will grow at least linearly, and likely superlinearly, because the monitors must be nearly as capable as the AI to be effective, and the complexity of the monitoring system must increase to handle the AI's sophistication.

  Part 4: Deployment Conditions

  Scenarios where one approach's failure mode is the binding constraint.

  - When control fails but alignment suffices: 
     Scenario: A system that is robustly aligned (so it does not attempt to bypass control) but the control measures are not perfectly reliable. However, because the system is aligned, it doesn't try to bypass them, so safety is maintained. But this is trivial? Actually, if alignment suffices, then control is not needed. But the scenario we want is where alignment is the only thing preventing catastrophe.

     Better: 
     - Alignment suffices but control fails: A scenario where the AI system is highly capable and situationally aware, and the control measures are compromised (e.g., due to a hardware failure or human error). However, because the AI is aligned, it does not take advantage of the situation and continues to act safely.

  - When alignment fails but control suffices:
     Scenario: The AI system is misaligned and attempts to cause harm, but the control measures (monitoring, containment) detect and prevent the harmful actions.

  Additionally, we can consider:

  - Control advocate concession: In a scenario where the AI system is given high autonomy and long planning horizons in an open environment (e.g., managing a large portion of the internet) and the control measures cannot be updated fast enough, then alignment becomes critical.

  - Alignment advocate concession: In a scenario where we are deploying an AI system for a short-term, high-value task in a controlled environment (e.g., scientific research in a sandbox) and the alignment status is uncertain, then control measures can provide necessary safety.

