answer: |-
  Your framing mistakes the *function* of the theorems. They aren't a disclaimer; they're an **exposure device**. The trade-offs existed *before* formalization—policy actors simply masked value choices with rhetoric like "objective algorithms." Kleinberg, Mullainathan, Chouldechova et al. didn't *create* the conflict; they *proved* it's unavoidable when base rates diverge. The math forces transparency: if you optimize calibration, you sacrifice error rate parity (or vice versa), and that choice **is** a value judgment about which kind of misclassification harms matter more. Yes, bad actors might weaponize selective citations, but the theorems themselves demolish the fantasy of a universally agreeable "fair" algorithm. Your "laundering" critique applies to misuse, not the results—which actually *prevent* hiding behind false technical neutrality.  

