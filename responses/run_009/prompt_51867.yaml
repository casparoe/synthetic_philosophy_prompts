prompt: |-
  I'm a second-year PhD student in psychology, and this whole replication crisis thing just got very real for me: I spent most of this year trying to replicate a published social psych effect from 2014, ran it with a bigger sample than the original, and got absolutely nothing. My supervisor says the original was probably p-hacked, but the methods guy in our lab says the problem runs deeper, that the whole frequentist machinery (the p-values, the null hypothesis testing, the .05 threshold) is what made this mess inevitable, and that Bayesian stats would fix it. I was sceptical of that claim, so I went back and read up on the obvious case study: Daryl Bem's 2011 paper Feeling the Future in the Journal of Personality and Social Psychology, where he reported nine experiments, each statistically significant, apparently showing precognition -- people's responses were influenced by stimuli they hadn't seen yet. I want to understand that episode properly, not just the punchline everybody repeats.

  Here's what I'd like you to do: analyse the Bem affair as a case study in the frequentist-versus-Bayesian dispute, in both directions. On the one side: what the frequentist apparatus actually delivered and where it arguably went wrong -- significance testing with no regard for the prior plausibility of precognition, plus the usual forking-paths diagnosis (optional stopping, flexible exclusion criteria, multiple DVs). On the Bayesian side: the reanalysis by Wagenmakers and colleagues published as a comment in the same journal, which used default Bayes factors and concluded the evidence actually favoured the null, and Bem's pushback that with more reasonable priors and a Bayesian framing the data look fine, plus his later meta-analysis claiming dozens of studies supporting the effect. But then also note the awkward bits: the field as a whole didn't update towards precognition even before any replication attempt -- scientists behaved like Bayesians with low priors regardless of the machinery -- and the replications that eventually sank the whole thing (the failed attempts by Ritchie, Wiseman and French, for instance) were themselves analysed in standard frequentist fashion. So did Bayes actually do any work here, or just provide a vocabulary?

  Finish by telling me where the frequentist/Bayesian lens genuinely explains the episode and where it's silent. My instinct is that the real culprits were things neither framework touches -- publication incentives, journal review that waved the paper through, the file drawer -- and that a pious Bayesian could have p-hacked their priors just as happily. Is that right, or is there something intrinsic to Bayes (pre-registration of priors, no optional stopping penalty, etc.) that would have prevented this particular car crash? Please be disciplined about the mapping: say which parts of the story each framework actually gets a verdict on, and don't force it to speak where it's quiet. Also, and this matters for me: given what the case shows, should I be fighting my supervisor to retrain myself as a Bayesian, or is that a category error? Please write your answer in British English (analyse, behaviour, etc.). Apologies for typos, I'm typing this on a train on my way back from another failed data collection.
reasoning: |-
  Alright, let's tackle this PhD student's query. They're deep in the replication crisis, having just failed to replicate a social psych effect. Their supervisor blames p-hacking, while the methods guy points to frequentist stats as the root problem and suggests Bayesian stats as the fix. The student wants to understand the Bem precognition case as a lens on the frequentist vs. Bayesian debate.

  First, I need to unpack Bem's 2011 study. He claimed nine experiments showing precognition, all significant with p<.05. The immediate criticism was about p-hacking and flexibility in analysis. But the student wants a deeper analysis of how frequentist and Bayesian approaches played out here.

  Starting with the frequentist side: The machinery delivered statistically significant results for Bem. But the key flaws were ignoring prior plausibility and researcher degrees of freedom. The .05 threshold allowed stacking unlikely events as "proof." The multiple comparisons, optional stopping, and selective reporting aren't inherent to frequentism but are facilitated by its framework, especially without preregistration.

  On the Bayesian side, Wagenmakers reanalyzed with default priors and found the evidence favored the null. Bem countered that with different priors, the data looked fine. This highlights how Bayes factors depend heavily on prior choices. But here's the rub: the scientific community didn't buy Bem's results even before replications. Their low prior on precognition overrode the published p-values. So scientists acted like Bayesians in practice, regardless of the stats used.

  The failed replications by Ritchie et al. used frequentist methods but still debunked the effect. That raises a question: did Bayesian analysis actually resolve anything here, or just provide an alternative narrative? The core issues seem to be publication bias, lack of preregistration, and incentive structures—things neither statistical framework addresses directly.

  Now, the student's instinct that culprits are beyond the stats debate seems right. A Bayesian could tweak priors to get desired results, just like p-hacking. Preregistration of priors and analysis plans might help, but that's a procedural fix, not inherent to Bayes. The key is that both frameworks can be misused without transparency and rigor.

  For the student's dilemma: retraining in Bayesian methods is useful for thinking about evidence cumulatively and incorporating prior knowledge. But it's not a magic bullet. Emphasizing open science practices—preregistration, data sharing, replication—is more crucial than choosing one statistical paradigm. They should learn both but focus on the broader methodological reforms.

  In conclusion, the frequentist/Bayesian lens explains parts of Bem's initial publication and reanalysis but not the community's skepticism or the replication failures. The deeper issues are sociological. The student should advocate for better practices rather than siding entirely with one statistical approach.
answer: |-
  Right, let's dissect the Bem affair as your requested case study, keeping the frequentist/Bayisan lens sharply focused and disciplined. The train-typing frustration is palpable – this hits the core of the replication crisis nerve.

  **The Bem Affair: Core Events**

  1.  **Original Publication (Bem, 2011):** Nine experiments, primarily using frequentist null hypothesis significance testing (NHST). Each reported at least one statistically significant result (p < .05, sometimes p < .01) supporting precognition (e.g., reaction times faster for erotic images *before* they were randomly selected).
  2.  **Immediate Reaction:** Widespread incredulity within the scientific community, despite the reported significance. The *Journal of Personality and Social Psychology* (JPSP) published it partly as a methodological challenge.
  3.  **Bayesian Reanalysis (Wagenmakers et al., 2011):** Used default Bayes Factors (BF) – specifically, the Jeffreys-Zellner-Siow (JZS) prior, which acts as a sceptical, "objective" default placing moderate probability on small effect sizes under H1. They reanalysed Bem's Experiments 1-5 and found BFs strongly *favouring the null hypothesis* (H0), often substantially (BF < 0.1 or even < 0.01).
  4.  **Bem's Bayesian Pushback:** Bem argued Wagenmakers' priors were too sceptical and unrealistic for the phenomenon he was investigating. He proposed alternative priors (e.g., based on effect sizes in related, accepted phenomena like priming) and analyses (including a Bayesian meta-analysis of his own studies) suggesting the data *did* support precognition under these "more reasonable" priors. He later pointed to meta-analyses incorporating other labs' studies claiming support.
  5.  **Failed Replications:** Independent, large-scale, pre-registered replication attempts (e.g., Ritchie, Wiseman, & French, 2012; Galak et al., 2012) consistently failed to find the effect using standard frequentist NHST (and sometimes supplementary Bayesian analyses mirroring Wagenmakers'). The effect evaporated.

  **Analysis Through the Frequentist/Bayesian Lens**

  **A. What the Frequentist Apparatus Delivered & Where it Went Wrong:**

  1.  **What it Delivered:** A formal, standardised framework for analysing each experiment. It provided p-values below the conventional .05 threshold for each reported test, meeting the community's *nominal* standard for "statistical significance". It gave Bem a *procedurally valid* (within the rules of NHST) argument for publication based on the data from each experiment individually.
  2.  **Where it Went Wrong (Intrinsic & Facilitative):**
      *   **Ignoring Prior Plausibility (Intrinsic Limitation):** NHST fundamentally does not incorporate the prior probability of the hypothesis being tested. The machinery treated testing for precognition identically to testing for a well-established priming effect. This is its core weakness in this context. The p-value only tells you about the data *assuming H0 is true*; it says nothing about the plausibility of H1 *before* seeing the data. The community's low prior on precognition was the correct Bayesian intuition that NHST ignored.
      *   **Researcher Degrees of Freedom (Facilitative):** The NHST framework, with its focus on a single significance threshold and binary "significant/non-significant" outcome, *facilitates* and *incentivises* practices that inflate Type I errors:
          *   **Optional Stopping:** Collect data, peek, continue if not significant. Bem's designs often involved sequential testing/optional stopping paths. NHST assumes a fixed sample size; violating this inflates the true Type I error rate far above .05.
          *   **Forking Paths / Multiple Comparisons:** Running multiple DVs, multiple covariates, multiple exclusion criteria, multiple analytic choices, and only reporting the paths that yield p < .05. With 9 experiments and flexibility within each, the probability of finding *some* significant results by chance alone was high, even without a true effect. NHST p-values reported for the "winning" path are misleading without correction for the *total* flexibility exercised.
          *   **Publication Bias (Facilitated):** Journals favouring p < .05 creates a file drawer of non-significant results, making Bem's collection of 9 "successes" seem implausibly strong evidence *unless* you account for the low prior or the hidden flexibility.

  **B. What the Bayesian Apparatus Offered & Where it Highlighted Issues:**

  1.  **What it Delivered (Wagenmakers):** A quantitative measure of evidence *for one hypothesis relative to another* (H1 vs H0). Crucially, it *formally incorporates prior beliefs* via the prior distribution. Wagenmakers' default priors, representing a sceptical scientific stance, showed that Bem's data were actually *more probable under the null* than under a vaguely specified precognition alternative. This formalised the community's incredulity.
  2.  **Bem's Counter (Highlighting Dependence on Priors):** Bem correctly pointed out that BF conclusions are sensitive to the choice of prior. By shifting the prior on the effect size under H1 to be less sceptical (e.g., centred on larger, but still plausible-for-other-phenomena effects), he could make the BF favour H1. This highlights a core aspect of Bayesianism: conclusions are conditional on the prior.
  3.  **Where it Highlighted Issues:**
      *   **Formalising Priors:** It forced an explicit discussion about the *reasonableness* of priors for an extraordinary claim. Wagenmakers argued default scepticism was appropriate; Bem argued his phenomenon deserved a prior akin to established effects. This debate is central to scientific reasoning but obscured in NHST.
      *   **Evidence vs. Decision:** BF provides continuous evidence quantification (e.g., BF=3: weak evidence for H1; BF=10: moderate; BF=100: strong). It avoids the misleading binary "significant/non-significant" cliff edge of p < .05. Wagenmakers showed the evidence was weak *even relative to a sceptical prior*.
      *   **Optional Stopping (Theoretical Advantage):** Unlike NHST, Bayesian updating based on likelihood principles is not invalidated by optional stopping. You *can* collect data sequentially and update your BF honestly. (Though in practice, peeking and *then choosing priors* based on results would be problematic).

  **C. Where the Lens is Silent or Awkward:**

  1.  **Community Behaviour:** The scientific community overwhelmingly rejected Bem's claims *before* Wagenmakers' reanalysis and *before* formal replications, purely based on the low prior plausibility of precognition. **This wasn't driven by the statistical machinery; it was rational Bayesian reasoning overriding the formal frequentist results.** Scientists acted like Bayesians *despite* the NHST framework.
  2.  **The Role of Replications:** The replications that ultimately settled the issue (Ritchie et al., etc.) were predominantly analysed and reported using frequentist NHST. They showed non-significant results. **Bayesian analysis wasn't necessary to debunk the effect definitively in practice.** A large, well-conducted, pre-registered NHST study failing to find an effect *is* compelling evidence against it, especially when combined with low prior plausibility. Bayes provided an *alternative* quantification, but the frequentist replications were sufficient for the community.
  3.  **The Core Culprits (Beyond Frameworks):** Your instinct is correct. The fundamental drivers were sociological and incentive-based, *facilitated by* but *not inherent to* either statistical framework:
      *   **Publication Incentives:** The pressure to publish novel, significant findings.
      *   **Flexible Analysis Practices (p-hacking, HARKing):** Exploiting researcher degrees of freedom to achieve significance (or a favourable BF, see below).
      *   **Insufficient Scrutiny/Review:** JPSP publishing a paper claiming precognition based solely on procedural NHST compliance, without demanding extraordinary evidence for an extraordinary claim.
      *   **The File Drawer:** Non-significant results (or BF favouring H0) not being published, making Bem's results seem like a consistent pattern.
      *   **Lack of Pre-registration:** Allowing flexibility to remain hidden. *This is key for both frameworks.*

  **D. Did Bayes Prevent the Crash? Could it be P-hacked?**

  *   **Prevention?** A *rigorously applied* Bayesian approach *with pre-specified, justified priors and a pre-registered analysis plan* would have helped significantly. It forces explicit consideration of prior plausibility and, with pre-registration, limits forking paths. The optional stopping "immunity" is also a theoretical plus. **Wagenmakers' reanalysis exposed the fragility of Bem's evidence under sceptical priors.**
  *   **P-hacking Priors? Absolutely.** A "pious Bayesian" could:
      *   **Tune the Prior:** See an unexpected trend in early data, then choose a prior conveniently centred on that effect size to maximise the BF for H1.
      *   **Forking Paths in Priors/Analysis:** Test multiple plausible priors or multiple Bayesian models and report only the one favouring H1.
      *   **Hide Unfavourable Analyses:** File-drawer Bayesian analyses that favour H0.
  *   **The Safeguard:** **Pre-registration of priors and analysis plans is just as crucial for Bayesian methods as it is for frequentist methods.** Without it, Bayes is vulnerable to similar degrees of freedom exploitation. The framework itself doesn't *inherently* prevent misuse; rigorous methodology does.

  **E. The Verdict: What Each Framework Explains & Where It's Silent**

  | **Aspect of Bem Affair**          | **Frequentist Lens Explains...**                                                                 | **Bayesian Lens Explains...**                                                                                             | **Silent/Explained Elsewhere**                                                                                               |
  | :-------------------------------- | :---------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------- |
  | **Original "Significance"**       | How Bem met the *procedural* standard for publication (p<.05).                                  | Why this standard was insufficient for an extraordinary claim (ignored low prior).                                        | *Why* JPSP accepted it (review norms, novelty bias).                                                                        |
  | **Community Skepticism**          | Indirectly: highlights the framework's *failure* to incorporate priors.                        | Directly: Formalises the low prior plausibility overriding the reported p-values.                                         | Sociological norms of science, burden of proof for extraordinary claims.                                                     |
  | **Wagenmakers' Reanalysis**       | N/A (It was a Bayesian critique)                                                                | How sceptical priors quantitatively reversed the evidence interpretation (BF favoured H0).                                | Why default priors were chosen; debate over their appropriateness.                                                           |
  | **Bem's Bayesian Defence**        | N/A                                                                                             | How conclusions depend critically on prior specification. Shows BF *can* support H1 with different priors.                | Validity of Bem's chosen priors (arguably unreasonably high for precognition).                                               |
  | **Failed Replications (Evidence)** | How they provided standardised evidence against the effect (p > .05 / non-sig).                 | Could quantify evidence *for* H0 (BF < 1), but NHST sufficed here.                                                       | **Crucially:** The replications' *conclusiveness* stemmed from **good methodology (pre-reg, large N)**, not the stats framework. |
  | **Root Causes (Crisis Drivers)**  | **Facilitated** p-hacking via flexibility + binary threshold. **Failed** to demand prior consideration. | **Highlights** the need for prior specification. **Theoretically immune** to optional stopping. **Vulnerable** to prior-hacking. | **Core Culprits:** Publication bias, lack of pre-registration, incentive structures, flexible practices **apply to both**.   |

  **F. Your Training: Bayesian Retooling – Category Error or Essential?**

  This isn't a binary choice, and framing it as "fighting your supervisor" is counterproductive. Here's the disciplined takeaway from the Bem case:

  1.  **Understanding Bayes is Essential:** The Bem case starkly illustrates the **critical flaw of NHST: ignoring prior plausibility.** As a scientist, you *must* think probabilistically and understand how prior beliefs should influence the interpretation of evidence, especially for novel or controversial claims. Bayesian reasoning formalises this core scientific principle. Learning Bayes makes you a more critical consumer *and* producer of research, regardless of the stats you run. It helps you understand what p-values *don't* tell you.
  2.  **Bayesian Methods are Powerful Tools:** For specific questions, especially quantifying evidence for one model vs another, or incorporating prior knowledge formally, Bayesian methods (like BFs or parameter estimation with credible intervals) are valuable. They avoid some pitfalls of NHST (like the optional stopping issue, theoretically).
  3.  **But They Are Not a Panacea:** Switching software won't solve the replication crisis. **The core lessons of Bem are methodological, not purely statistical:** Pre-registration, transparency, rigorous design, large samples (high power/precision), replicability, and acknowledging prior plausibility are paramount. Bayes can be misused ("p-hacked") just like NHST without these safeguards.
  4.  **Practical Recommendation:**
      *   **Do not abandon frequentist methods.** They are deeply embedded, understood, and often appropriate, especially for estimation (CIs) and well-powered, pre-registered hypothesis tests aiming for falsification. They powered the successful replications.
      *   **Urgently learn Bayesian concepts and principles.** Understand priors, likelihoods, posteriors, Bayes Factors. Read Wagenmakers et al. and Bem's response deeply. This is non-negotiable for a modern psychologist.
      *   **Learn to apply Bayesian methods practically.** Start incorporating simple Bayesian analyses (e.g., using `brms` or JASP) alongside your frequentist analyses, especially for novel or contentious findings. Report BFs where informative.
      *   **Become a militant advocate for Open Science:** Focus your energy on pre-registration, open data/code, replication (including within your PhD), and transparency *regardless* of the statistical paradigm. *This* is the primary defence against Bem-like situations.
      *   **Discuss this with your supervisor constructively.** Frame it as "I need to understand Bayesian reasoning to critically evaluate evidence like in the Bem case, and it offers useful complementary tools. How can I best integrate this learning alongside our lab's existing practices, while prioritising robust Open Science methods?"

  **Conclusion**

  The Bem affair is a masterclass in the **limits of pure frequentist NHST,** particularly its blindness to prior plausibility and its vulnerability to researcher degrees of freedom. Bayesian reanalysis powerfully exposed this fragility by formally incorporating scepticism. However, the episode also shows that **Bayesian methods are not magic** – they depend critically on prior specification and are susceptible to analogous forms of bias without rigorous methodology (pre-registration). The scientific community's behaviour demonstrated rational Bayesian reasoning *despite* the dominant NHST framework, and the fatal blow to precognition was delivered by well-conducted frequentist replications.

  **The real lesson is methodological, not purely statistical:** Extraordinary claims require extraordinary evidence, achieved through transparency, pre-registration, large samples, rigorous design, and replication. Learn Bayesian statistics deeply – it will make you a better scientist by forcing you to confront prior beliefs and quantify evidence more richly. But simultaneously champion the Open Science practices that prevent misuse of *any* statistical framework. Fight for pre-registration and replication, not just for Bayes. Your energy is best spent becoming rigorously multi-lingual in statistical reasoning while embedding your work in transparent, reproducible methodology. On that train ride back, resolve to make your next study – Bayesian or frequentist – a model of pre-registered, open science. That's the replication crisis antidote.
