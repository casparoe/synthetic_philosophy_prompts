  Hmm... the key philosophical insight here is that Bayesian confirmation must reconstruct the counterfactual "what if the evidence were new?" This means focusing on the novelty of the explanatory achievement rather than the temporal status of data. 

  For the decision procedure, I'll design a checklist that prioritizes: 
  1) Model construction transparency (even if incomplete)
  2) Parameter fitting discipline 
  3) Explanatory burden 
  4) Comparative novelty assessment

  The three test cases are revealing: 
  (a) The parameter-free cuprate model deserves credit because it solves a "stubborn anomaly" without tuning. 
  (b) The 40-parameter model is suspicious - it's likely overfitting known data. 
  (c) The undisclosed tuning case is epistemically fraudulent but hard to catch without insider knowledge. 

  Important realization: The procedure can't magically detect dishonesty in case (c), but it can flag when claimed successes don't match methodological rigor. I'll need to be upfront about this limitation.

  The physicist's discomfort with treating (a) and (c) similarly is understandable - but the procedure will differentiate them through the "explanatory burden" assessment. Still, I should warn that without the author's confession in (c), the checklist might give it false credit.

  Final note: The double-counting problem requires special handling - I'll include a step about "inherited successes" that forces authors to justify what's genuinely new in their refinement.
answer: |-
  ## Philosopher's Advisory Memorandum: Evaluating "Old Evidence" Claims in Scientific Review

  **Underlying Epistemology:** The core issue isn't the *temporal age* of the evidence (E), but its *epistemic role relative to the hypothesis (H)*. The Bayesian problem arises because P(E) = 1 *after* E is known. Confirmation must therefore assess the *counterfactual*: *How much more probable would E have been if H were true, *before* we knew E?* This shifts focus to the *novelty of the explanatory achievement*.

  **Resolving Your Wrinkles:**
  1.  **Epistemic Status Matters:** Your instinct is correct. The crucial distinction hinges on whether E was *used in constructing/tuning H* ("accommodation") versus being genuinely *predictive* relative to the model-builder's knowledge state. "Unknown to author" is functionally similar to "known but unused" *if* the theory was developed independently. The logical relation alone is insufficient; the author's epistemic state during construction *is* key. The "stubborn anomaly" success works because the anomaly was known but *resisted explanation* by prior theories, making H's explanation novel.
  2.  **Double-Counting is Real:** Each refinement inherits the confirmation of its predecessor *for the data it was tuned on*. Claiming *new* confirmation for the *same* dataset with each refinement is invalid. Confirmation accrues primarily for *new* predictions or explaining *new* anomalies relative to the previous model. Sequential tuning on old data risks overfitting and diminishing returns on confirmation.
  3.  **Opacity is the Norm:** You're right; reviewers rarely know the construction history. Therefore, the procedure *cannot* rely on author disclosure. Instead, it uses *methodological signals* and *explanatory burden* to infer the likely epistemic role of E and the risk of double-counting/hindsight bias.

  **Decision Procedure: "Novelty of Explanation" Checklist**

  **Purpose:** Assess the strength of confirmation claimed from agreement with pre-existing evidence (E) by evaluating the novelty of the explanatory achievement relative to plausible alternatives and methodological practices. *Focus on signals detectable in the manuscript/proposal.*

  **Instructions:** Proceed step-by-step. Stop and render judgment if a clear "Insufficient" verdict is reached. If all steps are passed, the claim of strong confirmation from old evidence is plausible; use scientific judgment for overall merit.

  1.  **Parameter Discipline:**
      *   *Question:* How many parameters were *directly fitted* to the specific dataset E (or very similar data) used to claim confirmation? Are any parameters justified *solely* by needing to fit E?
      *   *Sufficient Answer:* Few (0-2) parameters fitted to E, with strong independent justification (e.g., fundamental constants, well-established prior measurements on *different* systems, clear theoretical derivation from first principles). Parameters justified by broader principles, not solely E.
      *   *Insufficient Answer:* Many parameters (>3-5) fitted to E, especially if justification is weak ("chosen to optimize fit") or circular ("required to match the data"). Parameters exist primarily to fit E.
      *   *Why?* High parameter count + fitting to E strongly suggests accommodation (epistemic use of E) rather than prediction, increasing overfitting risk and reducing novelty. Independent justification mitigates this.
      *   *Stopping Point:* "Insufficient" here indicates weak confirmation claim; proceed with caution or reject the claim's strength. "Sufficient" allows proceeding.

  2.  **Explanatory Burden:**
      *   *Question:* Did E represent a known *anomaly* or significant *puzzle* for the dominant prior theory/model? Was the success of H in explaining E *surprising* given the theoretical landscape when H was developed? Does H explain E *as a consequence* of its core principles?
      *   *Sufficient Answer:* Yes, E was a recognized anomaly/puzzle resisting explanation. Success is presented as resolving this anomaly and follows naturally from H's core mechanisms, not added epicycles.
      *   *Insufficient Answer:* E was well-explained by prior models. Success is presented as merely matching expected behavior without highlighting any novel insight or resolving a known difficulty. Explanation feels ad-hoc or bolted-on.
      *   *Why?* Explaining a stubborn anomaly demonstrates novel explanatory power, even if E is old. Merely matching non-puzzling data offers little new insight and is easily achieved via accommodation. Core derivation signals genuine constraint.
      *   *Stopping Point:* "Insufficient" significantly weakens the claimed confirmation. "Sufficient" strengthens it.

  3.  **Comparative Novelty (Guarding Against Double-Counting):**
      *   *Question:* If H is a refinement of a prior model H_prev, what *specific new data or anomalies* does H explain *that H_prev could not*? Does the claimed success for E rely *entirely* on parameters/features inherited from H_prev (which were likely tuned on E or similar data)?
      *   *Sufficient Answer:* H explains significant *new* data/anomalies beyond E. Success with E demonstrates consistency but isn't the primary novelty claim. Key features enabling fit to E are *new* in H and independently justified.
      *   *Insufficient Answer:* H's main claimed advance is fitting E *better* than H_prev, but using largely the same framework/parameters tuned on E. No significant explanation of *new* data is presented. Improvements seem primarily numerical tuning.
      *   *Why?* Prevents double-counting. Confirmation for E accrued to H_prev when *it* was fitted/tuned. Refining the fit on the *same* data with the *same* core assumptions offers minimal *new* confirmation. Novelty must come from new predictions or explaining new anomalies.
      *   *Stopping Point:* "Insufficient" indicates the confirmation claim for H based on E is likely illusory or very weak; the true novelty lies elsewhere (if at all). "Sufficient" allows proceeding.

  4.  **Methodological Transparency & Honesty (Proxy for Epistemic State):**
      *   *Question:* Does the manuscript clearly describe *how* the model was developed and parameter values chosen? Does it avoid presenting fits as "predictions" when accommodation is likely? Does it acknowledge if E was known/used?
      *   *Sufficient Answer:* Clear description of model construction, parameter justifications (referencing independent sources or derivations). Presents fit to E accurately as retrodiction/accommodation. Acknowledges prior knowledge of E if relevant context.
      *   *Insufficient Answer:* Vague on model construction ("the model was developed..."). Presents fit as a striking "success" or "prediction" without clarifying E was known. Actively obscures tuning history. *Implausible deniability* (e.g., complex model fitting E perfectly but claiming no tuning).
      *   *Why?* While we can't know the author's mind, methodological opacity or misleading presentation is a red flag for potential hindsight bias or undisclosed accommodation. Transparency fosters trust and allows better assessment of novelty. Dishonesty invalidates the epistemic claim.
      *   *Stopping Point:* "Insufficient" due to opacity/misrepresentation severely undermines the claim and warrants scrutiny or rejection of the claim's framing. "Sufficient" indicates the authors are enabling a fair assessment.

  **Applying the Procedure:**

  **(a) Cuprate Theory Paper (Parameter-Free Retrodiction of Linear Resistivity)**
  1.  **Parameter Discipline:** SUFFICIENT. "No free parameters fitted to the data in question." Parameters (if any) derived from "general principles."
  2.  **Explanatory Burden:** SUFFICIENT. Linear-in-T resistivity is a famous, long-standing "stubborn anomaly" in cuprates. Explaining it from first principles is inherently surprising and resolves a major puzzle.
  3.  **Comparative Novelty:** Likely SUFFICIENT (unless it's a minor tweak to a prior model that also tackled this). The core claim *is* explaining this anomaly with a new approach. Explaining a major anomaly *is* the novel advance.
  4.  **Transparency:** ASSUME SUFFICIENT (based on description). Claim is presented as retrodiction from principles.
      *   **Verdict:** The checklist *supports* the claim that this agreement provides strong confirmation, aligning with your prior. The novelty of explaining a deep anomaly without tuning is key.

  **(b) Grant Proposal (40-Parameter Model Tuned on Old Data)**
  1.  **Parameter Discipline:** INSUFFICIENT. "Something like forty adjustable parameters, tuned on a well-worn dataset." High count + explicit tuning on E.
  2.  **Explanatory Burden:** STOP. Parameter discipline already insufficient. *But even if proceeding:* Likely INSUFFICIENT. Reproducing a well-worn dataset to high precision with many tuned parameters is unsurprising – it's what tuning does. Unless framed as solving a *specific, known misfit* in prior models (which it might be, but tuning undermines it).
  3.  **Comparative Novelty:** (If proceeding) Likely INSUFFICIENT. Primary claim is fitting old data E better/differently. Unless it makes clear *new* predictions validated elsewhere, confirmation based on E is weak/double-counted.
  4.  **Transparency:** (If proceeding) MIXED. Acknowledges tuning on E? If yes, somewhat sufficient re: honesty, but doesn't rescue the weak confirmation claim. If no, insufficient.
      *   **Verdict:** The claim of "strong confirmation" based *primarily* on fitting the tuned dataset is **weak or invalid** per the checklist. Procedure flags this early (Step 1). Confirmation, if any, must come from other aspects (new predictions, conceptual novelty).

  **(c) Undisclosed Tuning Paper (Match Presented as Independent Success)**
  1.  **Parameter Discipline:** INSUFFICIENT (based on your knowledge). A "key parameter value" was chosen *precisely* to match E. This is direct tuning, even if other parameters exist.
  2.  **Explanatory Burden:** STOP. Parameter discipline insufficient. *But hypothetically:* If E was an anomaly, *genuine* explanation might exist, but the tuning fatally undermines the claim of *independent* success.
  3.  **Comparative Novelty:** (Hypothetical) If it's a refinement, likely INSUFFICIENT for confirmation based on E due to tuning.
  4.  **Transparency:** INSUFFICIENT (Based on your knowledge). Paper "presents the match as an independent success and does not disclose" the tuning. Actively misleading.
      *   **Verdict:** The checklist **rejects the claim of confirmation** based on this evidence due to tuning (Step 1) and identifies misleading presentation (Step 4). *However, the critical flaw (undisclosed tuning) is only detectable here because of your external knowledge.* The checklist flags the *methodological dishonesty* (Step 4) if the presentation is scrutinized ("presents match as independent success"), but cannot *prove* the tuning occurred without your insider knowledge. It forces you to treat (a) and (c) *differently* based on the signals: (a) shows methodological signals of novelty (no tuning, anomaly explanation), (c) shows signals of likely accommodation/hindsight (tuning, misleading presentation). Your *discomfort* arises because without external knowledge, (c) might *appear* similar to (a) if dishonestly written well, but the checklist forces scrutiny of the *signals* that distinguish them.

  **Candid Statement of Limitations:**

  1.  **Cannot Detect Dishonesty Directly:** It relies on methodological signals and textual presentation. Cleverly dishonest authors can obscure tuning or fabricate justifications. It *can* flag implausible claims or opacity, prompting skepticism. Watch for: vagueness in model construction, implausible parameter justifications, over-claiming "predictive" success for old data, reluctance to share code/data.
  2.  **Judgment Required:** "Few" vs. "Many" parameters, "strong" justification, "significant" anomaly, "plausible" independence require scientific judgment. The checklist structures the judgment, not eliminates it.
  3.  **Novelty is Contextual:** What counts as a "stubborn anomaly" or "novel prediction" depends on the field's state. The checklist relies on the authors/reviewers to accurately represent the context.
  4.  **Cannot Quantify Confirmation:** It assesses the *plausibility* of a *strong* confirmation claim from old evidence, not a precise degree.
  5.  **Misfires:**
      *   **Overly Harsh on Complex Systems:** Systems requiring complex models (e.g., climate, some bio) might need many parameters. The checklist emphasizes *independent justification* and *novel predictions* to compensate. Watch for models that *only* fit old data without new insights.
      *   **Under-Harsh on Clever Accommodation:** If authors develop a genuinely novel principle *inspired* by E but derive the fit rigorously without direct tuning, it *might* deserve credit (like your anomaly case). Steps 1 (justification) & 2 (anomaly) should capture this.
      *   **Silent on Overall Merit:** Passing means the "old evidence confirmation claim" is plausible, not that the whole paper/proposal is good. Other flaws (conceptual, technical, lack of new predictions) remain crucial.

  **Conclusion:** This procedure shifts focus from the age of the data to the novelty and independence of the explanatory achievement, using methodological signals assessable by a reviewer. It protects against the most common pitfalls (undisclosed tuning, double-counting, weak accommodation) while recognizing the genuine confirmatory power of explaining deep anomalies or deriving fits from first principles. It requires careful scientific judgment but provides a principled, defensible framework grounded in the epistemology of confirmation. It will often align with your physicist's intuition but provides explicit criteria to justify decisions, especially in contested or opaque cases. Use it as a structured interrogation of the claim, not an algorithm.
