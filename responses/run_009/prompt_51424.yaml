prompt: |-
  I teach an upper-level seminar on social epistemology — "Who Gets Believed," roughly — and I'm putting together the take-home final. The students have all read the Fricker material and can recite testimonial vs. hermeneutical injustice in their sleep, and honestly past versions of my exam have rewarded exactly that recitation, so this year I want a question they can't sleepwalk through. I want one essay question built around a specific case, and I have a sketch of it, though feel free to polish the details if something's off.

  Here's the case I want to use. Dr. Reyes works nights in an understaffed ER in a region hit hard by the opioid epidemic. Over years she's noticed (correctly, as it happens — the base rates are real and well-documented) that patients from a particular demographic present with dental pain at a rate far above what would be predicted by actual pathology, and opioid-seeking is common. She doesn't hate this demographic, isn't conscious of any animus, and her discounting policy genuinely raises her expected accuracy — if you forced her to use the policy on every future patient, she'd be right more often than a colleague who didn't. Tonight a patient from that demographic comes in with genuine, testable, severe dental pain, and Reyes discounts his report, he gets delayed treatment, and a molar abscess turns into something much worse. My question for the students has to get at whether this is testimonial injustice on Fricker's account — which seems to require a prejudice-driven credibility deficit, and it's not clear a merely statistically accurate generalization counts as prejudice — and, if it isn't injustice but only "error," whether that classification does any real work or is just bookkeeping. I'd also like the question to push on whether it matters that Reyes is a lone doctor versus the discount being baked into the triage software her hospital uses (she just clicks "apply guidelines"), since some of my sharper students will want to say the algorithmic version feels worse even though it seems *less* prejudiced, and I want to see if they can say why that intuition tracks anything real or is just technophobia.

  Please write me the essay question itself (worded so the crux is explicit), a model answer of about 600-700 words, and a marking scheme out of 25 built around five must-hit points — with the marks each is worth and a one-line note on how students typically fumble each one. The marking scheme should make clear what separates an A answer from a B answer: the B answer, say, correctly applies the labels and notices the tension, but the A answer has to take an actual position on whether accuracy-tracking discounting can be unjust *and* defend it against the obvious reply (that calling accurate inferences unjust stretches the concept past usefulness), not just report that "some say X, others say Y." One more thing: don't let the model answer lean on any reading beyond the standard Fricker stuff — the students only read the core text and a couple of overview pieces, so if the answer gestures at outside literature it should be by describing the argument, not name-dropping citations I didn't assign.
reasoning: |-
  Okay, let me approach this systematically. The professor wants an exam question that pushes students beyond rote recitation of Fricker's concepts, centered on a nuanced case study involving statistical discrimination in healthcare. 

  First, I need to unpack the core tension in the case: Dr. Reyes' statistically accurate generalization leads to harm, but lacks the prejudicial motivation Fricker requires for testimonial injustice. The question must force students to grapple with whether accuracy alone legitimizes credibility discounting, and whether systemic vs individual implementation changes the ethical calculus.

  For the essay prompt, I'll structure it to explicitly demand:
  - Analysis under Fricker's framework
  - Evaluation of the "mere error" defense
  - Comparison of human vs algorithmic discrimination
  - Original argument about justice beyond accuracy

  The model answer should demonstrate how to:
  1. Acknowledge Reyes meets Fricker's accuracy standard but fails her prejudice criterion
  2. Argue that structural harm creates injustice even without animus
  3. Show algorithmic versions compound opacity and responsibility diffusion
  4. Defend justice as more than epistemic accuracy
  5. Address the "concept-stretching" counterargument directly

  The marking scheme needs to penalize:
  - Superficial labeling without tension-naming (common fumble)
  - Ignoring the accuracy/justice conflict
  - Unsubstantiated "algorithm bad" claims
  - Failure to take a stance
  - Missing the systemic harm dimension

  I'll weight the defense against counterarguments highest (8/25) since that's the A-level differentiator. The comparison of human/systemic factors gets 5 marks as it's where sharper students distinguish themselves. 

  For the model answer, I'll avoid any external citations as requested, instead building the "justice requires more than accuracy" argument through Fricker's own emphasis on participatory equality and harm. The key move is showing how statistical efficiency can still create hermeneutical marginalization when generalized across institutions.

  The challenge will be keeping the model answer within 700 words while hitting all analytical layers. I'll prioritize depth on the accuracy/justice dilemma over comprehensiveness on every tangent.
answer: |-
  ### Essay Question  
  **Case Analysis: Dr. Reyes operates in an understaffed ER in a region with high opioid misuse. She uses a demographic-based heuristic to discount patient reports of dental pain, which—statistically—improves her diagnostic accuracy. When she applies it to a genuine case, severe harm results. (1) Analyze whether this constitutes *testimonial injustice* on Miranda Fricker’s account. (2) If not, does classifying it as "mere error" adequately address the moral stakes? (3) Finally, does it matter ethically whether Reyes acts alone or follows an algorithmic triage system? Defend a position on whether statistically accurate credibility discounting can be unjust even when it tracks real patterns, and respond to the objection that labelling such inferences "unjust" stretches the concept beyond usefulness.**

  ---

  ### Model Answer (650 words)  

  Dr. Reyes’ case exposes a tension in Fricker’s framework: her actions cause undeniable harm through credibility discounting, yet they lack the *prejudicial motivation* Fricker deems necessary for testimonial injustice. Fricker defines testimonial injustice as a credibility deficit inflicted by "identity prejudice"—deep-seated biases distorting a hearer’s judgment (e.g., sexism causing dismissal of women’s testimony). Reyes, however, acts on a statistically validated generalization. Her discounting isn’t driven by animus but by efficiency in a high-stakes environment. Thus, strictly applying Fricker’s criteria, this is **not testimonial injustice**. It resembles what Fricker might classify as "mere error," arising from non-prejudicial cognitive limitations.  

  Yet labelling this "mere error" obscures profound ethical stakes. Errors are typically random, correctable through individual diligence. Reyes’ discounting is *systematic*: it selectively burdens a demographic already marginalized by the opioid epidemic and healthcare inequities. The harm—delayed treatment, physical suffering, eroded trust—isn’t accidental but structurally predictable. Calling this "error" implies redress requires only better statistical calibration (e.g., refining the heuristic). But the core issue is *justice*: the policy perpetuates distributive harm by denying epistemic agency to a group based on identity, regardless of intent. Fricker’s framework risks being under-inclusive here, as injustice can emerge from systems, not just psyches.  

  This leads to the third question: whether human versus algorithmic implementation alters the injustice. Intuition suggests the algorithmic case is worse, and this tracks real ethical distinctions. When Reyes acts alone, she retains contextual awareness—she *could* have noticed atypical signs (e.g., visible infection) and overridden her heuristic. Her individual agency makes the harm a culpable failure of epistemic vigilance. Algorithms, however, codify the discounting as immutable policy, eliminating discretion and obscuring the reasoning behind triage decisions. This layers **hermeneutical injustice** onto the testimonial harm: patients cannot contest a "black box" system, nor can clinicians easily intervene. The injustice becomes structural, baked into the institution’s epistemology.  

  Nevertheless, a critic might argue: if Reyes’ heuristic *accurately* identifies opioid-seeking, calling it "unjust" renders the term meaningless. Accuracy, they claim, is a cardinal epistemic virtue—rejecting it invites inefficiency and harm. My response is twofold. **First**, epistemic practices exist within social contexts. When accuracy is achieved by systematically silencing a group (even a "high-risk" one), it entrenches their marginalization. The heuristic may be *generically* accurate, but its application ignores the patient’s specific testimony and context, violating Fricker’s ideal of "epistemic justice" as participatory parity. **Second**, accuracy is not monolithic. While the heuristic improves immediate diagnostic efficiency, it corrodes systemic trust, deterring genuine patients from seeking care—ultimately *reducing* long-term accuracy in community health outcomes. Justice here isn’t opposed to accuracy; it demands deeper, more contextual forms of it.  

  Thus, while Reyes’ act isn’t testimonial injustice *by Fricker’s definition*, it reveals a gap in her theory: justice must account for harms arising from *structural* credibility discounting, even when statistically grounded. Accuracy alone cannot sanctify epistemic practices that perpetuate group-based disadvantage. Whether human or algorithmic, the injustice lies in treating identity as a proxy for credibility, nullifying individual voice. Redress requires not abandoning statistics, but embedding them in systems that prioritize rebuttal, context, and equity—precisely to avoid conflating accuracy with fairness.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A Answers** (21–25): Take a clear, defended position on the accuracy/justice tension; engage deeply with *why* "mere error" is inadequate; offer original analysis of human vs. algorithmic cases.  
  **B Answers** (16–20): Correctly apply Fricker’s concepts, identify tensions, but lack sustained argumentation; may waver on taking a stance.  

  1. **Fricker Analysis (4 pts)**  
     - *Full marks:* Clearly explains why Reyes' act lacks prejudice (not testimonial injustice) per Fricker.  
     - *Common fumble:* Vaguely labels it "testimonial injustice" without addressing prejudice.  

  2. **Critique of "Mere Error" (5 pts)**  
     - *Full marks:* Argues that "error" masks systematic harm/distributive injustice; links to social context.  
     - *Common fumble:* Accepts Fricker’s categorization uncritically or focuses only on outcome severity.  

  3. **Human vs. Algorithm Comparison (5 pts)**  
     - *Full marks:* Identifies algorithms as exacerbating opacity/hermeneutical injustice; notes loss of agential override.  
     - *Common fumble:* Asserts "algorithms worse" without ethical reasoning (e.g., just "feels creepy").  

  4. **Position on Accuracy & Justice (8 pts)**  
     - *Full marks:* Defends a view (e.g., "accuracy ≠ justice"; "structural injustice"); rebuts the "concept-stretching" objection persuasively.  
     - *Common fumble:* Restates the tension without resolution; fails to engage the objection.  

  5. **Structure & Clarity (3 pts)**  
     - *Full marks:* Logically organized, precise language, case-focused.  
     - *Common fumble:* Tangents into general bias debates; unclear thesis.  

  ---  
  **Why this works for your goals**:  
  - Forces engagement beyond definitions by centering a "grey zone" case where Fricker’s criteria seem inadequate.  
  - The accuracy/justice tension demands original argumentation, not recitation. A-level answers must rebut the core objection.  
  - The algorithm comparison tests nuanced application of hermeneutical injustice (e.g., opacity, institutional embeddedness).  
  - Model answer stays within Fricker’s core framework while pushing its boundaries—no external citations needed.
