  ## Soviet Villanelle (After Goodhart)

  The Party sets the monthly quota's height:  
  **"Ten thousand tonnes of finished production,"**  
  To serve the workers' state with all its might:  
  **"The nation's need for nails,"** both day and night.  

  But targets, tracked with blind affection,  
  Scatter sizes left and right (Regressional: the noise invades the measure).  
  **"Ten thousand tonnes of finished production"**  
  Is met! Yet warehouses crammed with overcount –  
  Tiny useless spikes beyond all pleasure,  
  **"The nation's need for nails,"** a hollow amount?  

  The foreman, facing sanction or promotion,  
  Sees workers pour the molten steel's confession (Adversarial: they game the system's leisure):  
  **"Ten thousand tonnes of finished production"**  
  Is forged! One single spike of vast dimension,  
  A useless monument to grim obsession (Extremal: pushing the proxy past its tether).  
  **"The nation's need for nails,"** a cruel dissension?  

  The link is cut by metric intervention –  
  Weight matters, function fades beyond detection (Causal: the proxy severed from the treasure).  
  **"Ten thousand tonnes of finished production"**  
  **"The nation's need for nails."** Now stand beside  
  Cold tonnes of useless steel, the final measure.  
  The measure gnaws the goal it once described.  
  Where meaning rusts on heaps of quantified pride.  

  ---

  **Annotations (For Clarity):**

  1.  **Refrains:** "Ten thousand tonnes of finished production" (The Proxy/Measure), "The nation's need for nails" (The Goal).
  2.  **The Failures (Taxonomy Mapped):**
      *   **Tercet 2 (Ends with Proxy 1): Regressional Goodhart:** "Scatter sizes left and right" – Selecting on the proxy (tonnage) drags in noise (random, unusable sizes; nails are produced, but not *usefully*).
      *   **Tercet 3 (Ends with Goal 1): Adversarial Goodhart:** "workers pour the molten steel's confession... Tiny useless spikes" – Agents (workers) game the system, optimizing the proxy (tonnage via many tiny, lightweight nails) against the principal's (the state's) true goal.
      *   **Tercet 4 (Ends with Proxy 2): Extremal Goodhart:** "One single spike of vast dimension" – Pushing the proxy (tonnage) to its extreme (one giant nail) breaks its correlation with the goal (usable nails).
      *   **Tercet 5 (Ends with Goal 2): Causal Goodhart:** "The link is cut by metric intervention" – Intervening *directly* on the proxy (focusing solely on maximizing weight) severs its causal link to the goal (nails of useful size/function). Making heavy things != making nails.
  3.  **The Undoing:** Each recurrence forces the refrains into a new, degraded context. "Finished production" becomes noise, then adversarial output, then an absurd extreme, then a causally detached number. "The nation's need for nails" becomes first questionable, then hollow, then mocked, then irrelevant. By the quatrain, they stand as hollow shells beside their own ruin ("tonnes of useless steel").
  4.  **The Concrete Case:** The Soviet nail factory quota (tonnage of nails) is the anchoring example throughout.
  5.  **The Closing Quatrain:** Shows the final state: the measure and the stated goal stand together, but the goal is dead, replaced only by the quantified output ("tonnes of useless steel") and the system's corrosive logic ("Where meaning rusts on heaps of quantified pride"). The proxy *is* the only remaining "achievement," devoid of value.
