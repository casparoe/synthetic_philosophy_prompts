answer: |-
  Below is a diagnostic quiz designed to sort your reasoning about voting—not by self-applied labels, but by how you respond to concrete scenarios. I've incorporated your six cases directly, refining them for clarity and diagnostic power. The questions avoid theory-laden terms, use real-world language, and force choices that reveal underlying principles. 

  After the quiz, I'll explain which of your cases were most diagnostic, which needed adjustment, and why. The scoring key maps answer patterns to five core positions (and flags incoherent/unoccupied combinations).

  ---

  ### **QUIZ: Why Do You Vote (or Not Vote)?**
  *Answer based on your gut reaction. Choose one option per question.*

  1. **The Landslide Election**  
     Every poll shows Candidate X winning your state by 40 points. Your vote has near-zero chance of changing the result. Why vote?  
     A. *"Even a microscopic chance of affecting the outcome matters when so much is at stake."*  
     B. *"It’s my responsibility as a citizen—like showing up for jury duty."*  
     C. *"I want my support for X on record, even if they win big."*  

  2. **The Homeowners' Association**  
     Your 11-member HOA votes on a new roof. Your vote could easily decide the outcome. Why vote here?  
     A. *"My vote has real power here—it could swing the result."*  
     B. *"I owe it to my neighbors to participate, close race or not."*  
     C. *"I skip it if busy—it’s just a roof."*  

  3. **The Third-Party Protest**  
     You love a minor-party candidate who can’t win. Why vote for them?  
     A. *"I don’t—I vote for the ‘lesser evil’ major candidate to stop the worst outcome."*  
     B. *"To send a message: ‘People like me exist!’"*  
     C. *"I stay home. Why bother if they can’t win?"*  

  4. **The Secret Ballot**  
     If no one could ever know you skipped voting, would you still go?  
     A. *"Yes—my vote might still decide the election."*  
     B. *"Yes—it’s the right thing to do, even privately."*  
     C. *"No—if no one knows, there’s no point."*  

  5. **The Coin-Flip Tie**  
     Your vote creates an exact tie, resolved by a coin flip. Did your vote matter?  
     A. *"Yes—I gave my candidate a 50% chance instead of 0%."*  
     B. *"Yes—I did my part. The coin flip doesn’t erase that."*  
     C. *"No—the coin decided, not me."*  

  6. **The Statistician’s Prediction**  
     A statistician says your decision to vote strongly predicts a million similar people voting (but doesn’t cause it). Does this change your choice?  
     A. *"Yes—if I vote, it means others like me are voting, so my side likely wins!"*  
     B. *"No—my lone vote still won’t change the result. This is a distraction."*  
     C. *"I vote regardless—it’s about principle, not head-counting."*  

  7. **The High-Stakes Election**  
     The outcome affects millions, but your chance of being decisive is 1 in 10 million. How do you weigh this?  
     A. *"The tiny chance times huge stakes makes voting worth it."*  
     B. *"1 in 10 million is pointless. I wouldn’t buy a lottery ticket either."*  
     C. *"I vote because it’s my duty, odds be damned."*  

  8. **The Collapsing Turnout**  
     If voter turnout drops too low, people lose faith in democracy. Does this affect you?  
     A. *"Yes—I vote to help keep the system alive."*  
     B. *"No—my one vote won’t save or kill democracy."*  
     C. *"I vote anyway, but this is a nice bonus reason."*  

  ---

  ### **SCORING KEY**  
  Match your answers to the positions below. Combinations not listed are "unnamed" (explanations follow).  

  | Position                          | Answer Pattern (Q1–Q8)                                  | What It Means (Plain English)                                                                 |
  |-----------------------------------|---------------------------------------------------------|---------------------------------------------------------------------------------------------|
  | **Expected Utility Maximizer**   | 1A, 2A, 3A, 4A, 5A, 6B, 7A, 8B                         | Voting is rational only if *expected impact* (chance of mattering × stakes) outweighs effort. You vote in small elections (high chance) or high-stakes ones (massive stakes × tiny chance). Landslides, lost causes, and secret ballots don’t change this math. |
  | **Duty Theorist**                | 1B, 2B, 3B or 3C¹, 4B, 5B, 6C, 7C, 8B or 8C¹           | Voting is a moral obligation, like paying taxes. You vote because it’s *right*, regardless of impact, odds, or observers. Expression ("sending a message") is secondary to duty. |
  | **Expressive Theorist**          | 1C, 2B, 3B, 4B, 5B, 6C, 7C¹ or 7A¹, 8C                 | Voting is like cheering at a game: it *expresses* who you are or support. You vote for third parties to "send a message," value being "on record," and may vote in landslides or secretly because expression needs no audience. |
  | **Norm Sustainer**               | 1B or 1C, 2B, 3B, 4B, 5B, 6C, 7C, 8A                   | You vote to *maintain democracy’s health*. Even if your vote doesn’t change *this* election, it upholds the *habit* of voting. Turnout collapse (Q8) is your core motive. |
  | **Instrumentalist Skeptic**      | 1 Any except B/C², 2C, 3C, 4C, 5C, 6B, 7B, 8B          | Voting in large elections is irrational—your impact is negligible. You vote only when pivotal chance is high (e.g., small HOAs). Blowouts, third parties, and secret ballots confirm the futility. |

  ¹ *Acceptable variation within the position (e.g., Duty Theorists might vote third-party to honor principle (3C) or for message (3B)).*  
  ² *Instrumentalist Skeptics might endorse voting in landslides if they misjudge the odds (1A), but their other answers reveal consistent skepticism.*  

  ---

  ### **Unnamed Combinations & Why They’re Rare**  
  - **1A/2A but 3C/4C/5C/7B**: Claims voting matters in landslides (1A) and HOAs (2A) but rejects its impact in ties (5C), secrecy (4C), or high-stakes (7B). *Incoherent—you can’t believe votes matter and don’t simultaneously.*  
  - **1B/1C but 4C or 8B**: Says voting is a duty (1B) or expression (1C) but skips if secret (4C) or rejects turnout norms (8B). *Incoherent—duty/expression shouldn’t depend on observers.*  
  - **6A (statistician) with anything**: Believes correlated votes justify voting. *Unattractive—philosophers reject this as magical thinking (confusing correlation with causality).*  

  ---

  ### **How Your Cases Shaped the Quiz**  
  I retained all six cases but refined them:  
  1. **Coin-Flip (Q5)**: Highly diagnostic. Splits those who see voting as *creating chances* (Option A: Expected Utility) vs. *symbolic action* (Option B: Duty/Expression/Norms) vs. *outcome determinism* (Option C: Skeptics).  
  2. **Statistician (Q6)**: Sharply splits *Skeptics* (B: "correlation irrelevant") from *others* (C: "vote anyway"). Option A (correlation as reason) is a fallacy trap.  
  3. **Landslide (Q1)**: Cleanly separates *Expected Utility* (A), *Duty* (B), and *Expressive* (C) voters. *Skeptics* pick D (not shown; they’d say "no reason").  
  4. **Small-Association (Q2)**: Critical. *Expected Utility* and *Skeptics* both vote here (A)—but *Skeptics* skip if stakes are low (C), while others vote regardless (B).  
  5. **Third-Party (Q3)**: Divides *instrumental* voters (A: vote strategically) from *expressive* (B: "send a message") and *duty* (C: "vote conscience").  
  6. **Secret-Ballot (Q4)**: Key for *Duty/Norms* (B: "do right") vs. *Expected Utility* (A: "pivotal chance") vs. *Skeptics* (C: "no point").  

  ### **Why No Question Splits Duty vs. Norm Sustainers?**  
  As predicted, Duty and Norm Sustainers answer **identically** on all cases except Q8 (turnout collapse). Norm Sustainers *uniquely* pick 8A ("vote to save democracy"). I didn’t invent a false split—this reflects real philosophy: both see voting as obligation, but Norm Sustainers add a systemic purpose.  

  ### **Where Your Framing Was Adjusted**  
  - **Statistician Case**: I kept your core but sharpened the fallacy. Option A (correlation as reason) is universally rejected by theorists—it’s a diagnostic "trap."  
  - **Small-Association**: Added low-stakes skip option (2C) to split *Skeptics* from *Expected Utility* voters.  
  - **Third-Party**: Added "stay home" (3C) to capture *Skeptics* who abstain when outcomes seem fixed.  

  This quiz isolates your "kitchen-table" disagreements by forcing concrete choices. To use it: Have your friends take it, then compare their answer patterns to the scoring key. You’ll likely find they occupy different positions—even if all say "vote."
