  First, we map the logical space. The key questions that split people include:

  1. **The basis for voting:** Is it about causing an outcome (instrumental), expressing something (expressive), fulfilling a duty (deontological), or sustaining a norm (normative)? 
  2. **The role of probability:** Does the near-zero chance of being pivotal matter? 
  3. **The scope of consequences:** Should we consider only personal impact or the collective impact? 
  4. **The scale of the election:** Does the same reasoning apply to large and small groups? 
  5. **The relevance of others' actions:** Does knowing that others will act similarly change the calculus? 
  6. **The relevance of being observed:** Does secrecy matter? 
  7. **The value of symbolic actions:** Does voting for a candidate who can't win have value?

  We will design questions that probe these without using jargon. The positions we wish to map to include:

  - **Instrumentalist Skeptic (IS):** Believes that in large elections, the probability of being pivotal is so low that voting is irrational unless the stakes are extremely high and one counts the welfare of many others (which might tip it). However, in very small elections, it might be rational.
  - **Expected Utility Maximizer (EUM):** Accepts that the probability of being pivotal is low, but argues that the enormous stakes (affecting millions) multiplied by even a tiny probability can make voting rational when considering the total welfare impact. This is a form of instrumentalism that counts the welfare of all affected.
  - **Expressive Theorist (ET):** Believes voting is valuable for what it expresses (e.g., support for a candidate, a message, or one's identity) regardless of causal impact.
  - **Duty Theorist (DT):** Believes voting is a civic duty, irrespective of consequences or expressiveness.
  - **Norm Sustainer (NS):** Believes that by voting, one sustains the norm of voting, which is crucial for democracy. This is a form of instrumentalism but focused on the system rather than the immediate election.

  We also note that some combinations may not be occupied.

