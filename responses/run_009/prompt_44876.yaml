  Longtime LessWrong lurker here (occasionally the EA forum, mostly just lurking) and I finally bit on something. In a thread about the repugnant conclusion, someone ended the entire argument with "make people happy, not make happy people" — like it was a knockdown line against total utilitarianism, a couple people replied with something like "this", thread over. The thing is, I've noticed the same one-liner getting wielded by people who ALSO endorse the procreation asymmetry (creating happy people is merely permissible, creating miserable people is wrong), and I genuinely can't tell if the slogan is doing the same work in both cases or if the asymmetry folks are just borrowing its rhetorical shine.

  So: strip the slogan down for me. What are exactly five distinct precise claims it could be standing for, ordered roughly from most trivial to most radical, where each item is a sentence or two saying whether that reading is plausible, whether it's actually true on its most natural interpretation, and — crucially — whether it would justify the "therefore total utilitarianism is refuted, thread over" move it was deployed for. I want to bring this back to the thread as a numbered list, just the five items, no intro and no concluding summary, so keep each item tight. And somewhere in the five, make clear which readings are compatible with pairing the slogan with the asymmetry and which make that pairing incoherent — I suspect at least one popular reading implies you can't hold both, but maybe I'm just double counting.
reasoning: |-
  Okay, the user is a longtime lurker on LessWrong and the EA forum, and they've encountered this slogan "make people happy, not make happy people" in a discussion about the repugnant conclusion. It was used as a knockdown argument against total utilitarianism, and they're confused because the same slogan is also used by people who endorse the procreation asymmetry. They want me to break down the slogan into five distinct precise claims, ordered from trivial to radical. Each claim should include whether it's plausible, true, and if it refutes total utilitarianism. They also want clarity on which readings are compatible with the asymmetry.

  First, I need to recall what the repugnant conclusion and total utilitarianism are. Total utilitarianism says we should maximize total happiness, which leads to the repugnant conclusion where a large population with barely positive lives is better than a small, very happy one. The slogan is used against that. But the procreation asymmetry is the view that creating happy people is neutral (neither good nor obligatory) while creating unhappy people is bad. So the user is confused because the same slogan is used by both sides.

  The user wants five distinct interpretations of the slogan. Each should be a precise claim, ordered from trivial to radical. For each, I need to assess plausibility, truth, and whether it refutes total utilitarianism. Also, note compatibility with the procreation asymmetry.

  Starting with the most trivial claim: The slogan could simply mean prioritizing improving existing lives over adding new ones. That's plausible and true in many contexts but doesn't refute total utilitarianism because a TU could agree if adding new lives isn't feasible. This is compatible with the asymmetry since asymmetry is about obligations in creation, not prioritization.

  Next, something less trivial: A person-affecting view. The slogan might claim that only changes affecting existing people matter morally. Creating new people doesn't affect anyone existing, so it's neutral. This challenges TU but isn't obviously true. It aligns with the asymmetry where creating happy people is permissible but not required.

  Third, maybe a stronger person-affecting claim: Creating new people can't be obligatory. Even if they're happy, it's not a duty. This directly opposes TU's implication that we must create more happy people. Plausible? Some find it intuitive. True? Debatable. Refutes TU? Only if TU demands creating happy people as obligatory. Compatible with asymmetry? Yes, since asymmetry says it's permissible but not required.

  Fourth interpretation: Creating happy people has no moral weight at all. Not just neutral, but not a positive act. This is more radical. If true, it refutes TU which counts adding happy lives as good. But is it plausible? Asymmetry proponents might say creating happy people is neutral, so it kind of aligns, but saying it has no weight is stronger. Asymmetry usually allows that creating happy people is permissible, implying it's not wrong, but not that it's good. So this might be a stretch. Probably not compatible because asymmetry permits it, meaning it's not immoral, whereas this says no moral weight at all, which might conflict.

  Fifth, the most radical: Creating happy people is impermissible. Like anti-natalism. That would refute TU since TU encourages creating happy people. But is it plausible? Probably not to most, including asymmetry holders who think it's permissible. So not compatible with asymmetry.

  Now, checking if each addresses the refutation of TU. The first one doesn't refute; second and third challenge but don't fully refute; fourth and fifth would refute if true. Also, compatibility: the first three are compatible with asymmetry, but the fourth and fifth aren't because asymmetry allows creating happy people as permissible.

