prompt: |-
  I'm the research editor at a magazine of popular history, and a large share of my job is deciding, quickly and without any special training in the ancient languages, whether we can print claims about the pre-modern past as fact. Every month brings eight or ten of these: a writer wants to say that a newly announced inscription "proves" a previously unattested governor and overturns the standard chronology; a freelancer wants to repeat a lurid casualty figure for an ancient battle that comes from a single author writing centuries after the event; someone wants to assert an ancient ruler's motives as though we had access to his inner life. I have maybe an afternoon per claim, I can consult translations and modern scholarship but not archives or untranslated material, and my editor-in-chief wants a written rationale she can point to if a historian complains. What I lack is any principled middle ground between "a classicist somewhere doubted this once" and "it's on a reputable website, run it."

  Please turn what source criticism actually knows -- from the things Herodotus was already doing when he flagged that he reports what he was told without vouching for it, through the more systematic skepticism of Thucydides, down to the working principles modern historians of the distant past use, like independent attestation, distance between event and surviving source, genre conventions, and the different weights carried by narrative texts versus inscriptions, coins, and material remains -- into a procedure I can actually run. I want the questions in order, with a statement of what counts as a sufficient answer to each; the points at which the procedure stops and says "not publishable as fact" regardless of how the rest comes out; and the points at which it honestly hands the question back to me as an editorial judgment rather than pretending to be a fact-finding step. I'd especially like it to handle the cases that bedevil us: claims resting on a single late source that could still be true, claims where archaeology and texts point in different directions, and claims that are really modern back-projections wearing ancient costume.

  Then run the procedure on three claims: first, that a battle fought around the fifth century BCE had roughly a quarter of a million combatants, a figure appearing in one ancient author writing several centuries later; second, that a festival or ritual attested only in a single source whose genre is satirical was nonetheless genuinely practiced at a specific shrine; and third, a story I personally love and want to run -- that a shipwreck cargo of amphorae shows a named merchant lost a fortune on a speculative voyage -- where I suspect the procedure will tell me the claim is probably true but still not good enough to print as stated, and if it does, I want to see exactly which bar it fails and what weaker formulation would pass. Please be candid about where the procedure will misfire or run out, and keep the whole thing, worked cases included, under 1,000 words.
reasoning: |-
  Okay, the user is a research editor at a popular history magazine facing a common but challenging problem: evaluating historical claims quickly without specialized training. Their pain points include needing to verify claims like questionable inscriptions, ancient battle casualty figures, or rulers' motives—all with limited time and resources. They want a structured procedure that applies source criticism principles systematically.

  First, I need to recall key historical methodologies. Source criticism involves evaluating sources based on proximity to events, independence, corroboration, genre conventions, and material evidence. Herodotus and Thucydides laid foundations by distinguishing between reported accounts and verified facts. Modern historians emphasize cross-referencing multiple sources and considering archaeological evidence.

  The user needs a step-by-step checklist that's practical for quick use. The procedure should include clear stopping points (e.g., lack of contemporary evidence) and flags for editorial judgment (e.g., when sources conflict). It must handle tricky cases like single late sources or satire-as-evidence, which often mislead popular narratives.

  For the three test cases:
  - The 250k battle casualty figure from a late single source fails immediately at Step 1 (no contemporary evidence) and Step 2 (no corroboration). The only salvageable angle is noting it as "claimed by later historian X" but not factual.
  - The satirical ritual description might pass Step 1 (contemporary author) but fails Step 4 (genre issues) and Step 5 (no material/other evidence). The editorial call would be to present it as "described in satire" with caveats.
  - The merchant's shipwreck story has archaeological evidence (amphorae) but fails Step 2 (no independent texts naming the merchant) and Step 3 (conflation risk). The safe version is "likely owned by merchant X based on common practices."

  I should warn about limitations: the procedure can't resolve archaeology-text conflicts perfectly and may over-reject plausible-but-uncorroborated claims. Editorial judgment remains crucial for borderline cases where public interest outweighs academic rigor.

  The tone must stay professional yet accessible—no jargon. Word count is tight (under 1,000), so examples need concise analysis. Most importantly, the user wants honesty about where the system breaks, like when material evidence exists but interpretation is disputed.
answer: |-
  Here's a source criticism procedure designed for your constraints, followed by analysis of your three cases:

  **The Source Criticism Quick-Check Procedure**

  1.  **Contemporary Evidence?** Is there *any* roughly contemporary (within 1-2 generations) source (text, inscription, coin, artefact) directly supporting the *core* of the claim?
      *   *Sufficient Answer:* Yes (identify the source/evidence). Proceed.
      *   *Stop & Reject:* No. **Hard Stop.** Claims lacking *any* contemporary anchor are too speculative for presentation as fact in popular history. (This catches most "inner motive" claims and many single late-source assertions).
      *   *Judgment Call:* N/A. This is binary.

  2.  **Independent Corroboration?** If contemporary evidence exists, is the claim supported by at least one *independent* source or type of evidence (e.g., text + inscription, two unrelated texts, archaeology + text)?
      *   *Sufficient Answer:* Yes (describe sources/evidence & their independence). Strong support.
      *   *Proceed If:* Only one source type exists, but it's reliable *and* the claim is limited/plausible (e.g., an inscription naming a governor). Proceed cautiously.
      *   *Stop & Reject:* Claim relies *only* on a single, late, problematic source (e.g., Herodotus on distant events, a satirist making an assertion) *without* contemporary/archaeological support. **Hard Stop for Fact.**
      *   *Judgment Call:* Is the single source highly reliable *for this specific claim type*? Is the corroborating evidence truly independent or just derivative? (e.g., later authors copying the first aren't independent).

  3.  **Source Genre & Purpose?** What is the nature of the key source(s)? Is the claim central to the source's purpose or a throwaway detail? Is the genre prone to exaggeration, satire, mythologizing, or propaganda?
      *   *Sufficient Answer:* Claim is a minor, plausible detail in a reliable genre (e.g., administrative record, annalistic history focusing on facts). Or, major claim supported by multiple reliable sources/genres.
      *   *Red Flag:* Claim is central to a source with clear bias (panegyric, polemic), fantastical elements (mythography), satire, or is wildly implausible on its face. Requires *strong* corroboration (Step 2).
      *   *Judgment Call:* How severely does genre/bias potentially distort *this specific claim*? Does archaeological evidence contradict or support it? (Proceed to Step 4/5).

  4.  **Archaeological/Material Evidence:** Does archaeology support, contradict, or remain silent on the claim? What's the nature of the evidence?
      *   *Sufficient Answer:* Archaeology directly corroborates the core claim (e.g., destruction layer matching battle date/location, shrine remains matching ritual description, cargo matching merchant's known trade).
      *   *Caution:* Archaeology is consistent *but not specific* (e.g., evidence of battle, but not scale; evidence of ritual activity, but not specifics; amphorae type matches merchant's region/time). Supports plausibility, not specifics.
      *   *Contradiction:* Archaeology directly contradicts the textual claim (e.g., no destruction layer for a sacked city, shrine didn't exist at claimed time). **Hard Stop for Fact** unless text has overwhelming independent support (rare).
      *   *Judgment Call:* Weighing the strength and specificity of archaeological support against textual claims, especially if texts are weak (Step 2/3). Does "consistent" archaeology *really* support the *specific* claim?

  5.  **Plausibility & Back-Projection:** Is the claim inherently plausible given the known context? Does it smell like a modern concern/idea projected onto the past (e.g., "speculative voyage," "economic anxiety," specific psychological motives)?
      *   *Sufficient Answer:* Claim is plausible within context (e.g., large armies were mustered; merchants traded goods; rituals existed). No obvious anachronistic concepts.
      *   *Red Flag:* Claim relies on modern concepts unsupported by contemporary evidence, or is implausible (logistically, technologically, socially). Requires *very strong* evidence to overcome.
      *   *Judgment Call:* Is this plausible *for that specific time/place*? Is the "modern" concept actually just a human universal described in period-appropriate terms? (Tricky!).

  **Procedure Output:**
  *   **Publish as Fact:** Passes Step 1 (or has overwhelming Step 4 evidence if truly unique) AND Step 2 (strong corroboration) AND no major red flags in Steps 3-5.
  *   **Publish with Qualifiers:** Fails Step 2 (single source) but passes Step 1 (contemporary) AND Step 4 (archaeology consistent/supportive) AND Steps 3/5 (plausible, reliable genre for detail). **OR** Strong Step 2 but minor genre/plausibility concerns (Step 3/5). *Requires phrasing like "According to X," "Evidence suggests," "Likely," "May have."*
  *   **Reject as Fact:** Fails Step 1 (no contemporary evidence) **OR** Fails Step 2 (single late/weak source) without strong Step 4 corroboration **OR** Step 4 contradiction **OR** Fails Step 5 (implausible/back-projection) with weak evidence.

  ---

  **Case Analyses:**

  1.  **250,000 Combatants in a 5th C. BCE Battle (Single Late Source)**
      *   Step 1: **Fail.** No contemporary source (historian, inscription, logistics record) mentions such a massive figure for *this specific battle*. Contemporary sources often give smaller, logistically plausible numbers.
      *   Step 2: **Fail.** Relies solely on one author writing centuries later, likely using exaggeration for effect or relying on inflated tradition.
      *   *Stop & Reject.* **Not publishable as fact.** Rationale: Lacks contemporary evidence and independent corroboration; late single source for an inherently implausible figure (ancient logistics couldn't easily support this scale consistently). *Alternative:* "Later historian [Name] claims an enormous force of 250,000 fought, though this figure is widely considered a significant exaggeration by modern scholars based on contemporary evidence and logistical realities."

  2.  **Satirical Source Describes Genuine Ritual at Specific Shrine**
      *   Step 1: **Pass?** The satirical source *might* be contemporary. Assume it is for this case.
      *   Step 2: **Fail.** Only one source describes *this specific ritual at this specific shrine*. Satire isn't independent confirmation.
      *   Step 3: **Major Red Flag.** Satire's purpose is mockery, exaggeration, invention for comedic/ethical point. Details cannot be trusted as factual reports. Ritual descriptions could be invented or wildly distorted.
      *   Step 4: **Check.** Is there archaeological evidence *specifically* for *this ritual* at *this shrine* (e.g., unique votives, structures matching description)? Likely just "consistent evidence of ritual activity" (Caution).
      *   Step 5: **Plausible?** Rituals existed, so the *category* is plausible. But the *specifics* described in satire are suspect.
      *   **Judgment Call / Reject as Fact.** Rationale: While ritual activity likely occurred, the specific ritual described in a satirical text, uncorroborated by other texts or specific archaeology, cannot be verified as factual. Genre makes it unreliable. *Alternative:* "The satirist [Name] describes a bizarre ritual at the Shrine of X, possibly mocking actual practices or inventing grotesque caricatures; archaeological finds confirm the shrine was active."

  3.  **Amphorae Wreck = Named Merchant's Lost Fortune (Speculative Voyage)**
      *   Step 1: **Fail (for merchant/fortune).** Amphorae are contemporary evidence of a wreck and cargo type. Inscriptions *naming* the specific merchant as the owner *on this specific wreck*? Extremely unlikely.
      *   Step 2: **Fail (for merchant/fortune).** Archaeology shows amphorae type/origin. Texts *might* show the merchant existed and traded that good. But no independent evidence links *this merchant* to *this specific ship*.
      *   Step 3: **Caution.** Attributing ownership based on general trade patterns involves inference. Calling it a "speculative voyage" and "lost fortune" are modern economic interpretations (Step 5 Red Flag).
      *   Step 4: **Pass (for wreck/cargo).** Amphorae prove wreck and cargo. Stamps *might* indicate origin/workshop/potential merchant family (*if* stamps are known for him/his associates - requires Step 2 corroboration). **Caution:** Stamps often indicate producer/shipper, not necessarily the voyage financier. Doesn't prove "fortune" or "speculation."
      *   Step 5: **Red Flag (for speculation/fortune).** While merchants traded and ships sank, "speculative voyage" and "lost fortune" are modern interpretations. Ancient trade involved many models (consignment, direct exchange).
      *   **Judgment Call / Reject as Stated Fact.** Rationale: Archaeology proves the wreck and cargo type. Linking it definitively to a *named* merchant requires an inscription *on the wreck* or a text explicitly documenting *this voyage*. Calling it his "fortune" lost on a "speculative" venture is unsupported inference. *Alternative:* "A shipwreck discovered off [Location] carried a cargo of [Type] amphorae from the workshop/family associated with merchant [Name], suggesting his potential involvement in the ill-fated trade route. The loss represented a significant financial blow." (Focuses on the *link* via stamps/association and the *scale/value* of the cargo, not motive or personal fortune level).

  **Candid Limitations:**
  *   **Misfires:** Might over-reject plausible-but-poorly-attested claims. Might under-reject claims with *seemingly* strong but actually flawed corroboration (e.g., two texts copying the same error).
  *   **Runs Out:** When archaeology/texts genuinely conflict with no resolution (e.g., foundation dates), you must present the dispute. When evidence is truly ambiguous (common!), judgment calls dominate. The procedure flags problems but can't magically resolve all ancient mysteries. It prioritizes avoiding demonstrable error over capturing every possible truth.
