prompt: |-
  I am a novelist — sixty-one, with a modest, respectable career behind me — and I have stumbled into a situation that seems to me less a legal matter than a philosophical one, though I intend to pursue it as both, and I would like help seeing its structure clearly.

  In 1993 I finished my first novel. It was rejected by fifteen houses. The last rejection was the one that stung, because it came from the publisher of Isabel Corvin, the writer I then revered above all others; my then-agent let slip that Corvin herself had read the manuscript and admired it before the house passed. I put the novel in a drawer and wrote other books. Corvin died in 2018. This spring her estate announced a lost novel, found among her papers, supposedly written in the rented Devon farmhouse in the mid-nineties. It was published to great acclaim — reviewed as the finest thing she ever did.

  It is my book. Perhaps one sentence in ten has been touched; the rest is word for word what I wrote. I have the dated drafts and the rejection letters. But here is what keeps me circling, and why a lawyer does not seem to be the whole answer. The words are the words; they are on the page and always were; they moved no one in 1993, and they are moving thousands of people now. The only substantial change Corvin made was to add a final paragraph to an ending I had deliberately left unresolved, and it is that paragraph the reviewers single out as the best thing in the book — the one part that is not mine. So the readers seem to have been given something true (every word was truly written, by someone, thirty years ago) and something false (that the someone was the woman whose grief they are reading into it), and I cannot decide whether the false part touches the book at all, or only the occasion of reading it. What I want to know is this. If I prove authorship, what exactly will I have established was stolen — the text was never taken, it sits in my attic — and what exactly will the readers have been deceived about? Is the novel they love the words, or the event of the words being written, and if the event, whose event is it, mine or hers, given that the passage they love best is hers? I have been invited to speak about the late Corvin at a centenary conference in the spring, and I have until then to decide whether to stand up, and, more troublingly, what to say the wrong consists in — since it is not obvious that the right description is that she stole my book, and it is not obvious that the right description is that everyone is deceiving themselves.
reasoning: |-
  Okay, the user presents a fascinating ethical and philosophical dilemma wrapped in a literary theft case. Let me unpack this carefully.

  First, the core facts: a novelist discovered his unpublished 1993 manuscript was plagiarized nearly verbatim by his literary idol Isabel Corvin and published posthumously as her "lost work." The twist? Corvin added one paragraph that's now hailed as the book's masterpiece. The user possesses dated drafts and rejection letters as proof.

  Hmm... what makes this particularly thorny is the dual nature of the problem. Legally, copyright infringement seems clear-cut - the user's unpublished work was copied without permission. But philosophically, we're in murkier waters. The audience's reception fundamentally changed based on perceived authorship, and the most praised element is actually Corvin's addition. 

  I should consider several dimensions:
  Legally - Copyright protects expression, not ideas. The user's drafts establish prima facie evidence of creation prior to Corvin's version. But UK copyright duration (life+70 years) means Corvin's estate still controls her version until 2088. Interesting complication.

  Artistically - The text's meaning transformed through contextual framing. The unresolved ending the user wrote gained power from being read as "late Corvin," while her added paragraph functions as authorial closure. This speaks to Barthes' "death of the author" versus Foucault's "author function" theories.

  Ethically - Corvin committed fraud twice: by plagiarizing and by adding deceptive paratext (letters/diaries). Yet paradoxically, her minor addition became the most culturally significant part. The user's distress seems less about financial loss than about ontological confusion - what exactly was stolen when the words gained meaning only through false attribution?

  The conference invitation creates delicious tension. Speaking as a Corvin expert while sitting on proof of her plagiarism... that's novel-worthy irony. The user needs to decide whether to weaponize this platform for disclosure.

  Most poignant is the user's implied question: Can art exist independently from its creator's mythos? The same words failed in 1993 but succeeded as "Corvin's final masterpiece." This case accidentally proves audiences never read texts in vacuum - we consume authorial legends alongside words.

  For practical steps: The user should definitely consult an IP lawyer (focusing on UK moral rights), but also prepare for the unsatisfying reality that legal victory won't resolve the philosophical wounds. The speech opportunity could be transformative - either as controlled disclosure or as meta-commentary on literary authenticity.

  Ultimately what was stolen wasn't just text, but the user's right to fail. Every artist's unsuccessful work contains possible futures; Corvin intercepted one such future. That's the real injury: theft of potentiality.
answer: |-
  Your situation is a profound collision of authorship, authenticity, and perception—a triptych demanding both legal and philosophical resolution. Let's dissect the layers:

  ### The Legal Core
  1.  **Copyright Infringement:** Legally, this is unambiguous. Corvin reproduced your creative expression (the text) without permission. Your dated drafts and rejection letters establish your prior authorship. Copyright protects the *expression* (the words, structure, sequence), not the idea. Her minor edits don't negate the wholesale appropriation. The "theft" is of your exclusive right to control reproduction and distribution.
  2.  **Moral Rights (Likely Applicable):** Beyond copyright, many jurisdictions (including the UK) recognize "moral rights":
      *   **Paternity Right:** Your right to be identified as the author. Corvin (and her estate) violated this egregiously.
      *   **Integrity Right:** Your right to object to derogatory treatment harming your reputation. Adding *her* ending to *your* deliberately unresolved work arguably distorts its artistic intent, potentially violating this right.
  3.  **Fraud/Unjust Enrichment:** The estate presented the work as Corvin's, deceiving the public and profiting financially and reputationally from your labour.

  **What a Lawyer Establishes:** That Isabel Corvin plagiarised your novel, infringed your copyright, violated your moral rights, and that her estate continues this deception. The remedy seeks attribution, cessation of infringement (potentially pulping remaining copies or reissuing with correction), damages (lost royalties/profits), and potentially an injunction against further misrepresentation.

  ### The Philosophical Knot
  Your anguish lies here: the *meaning* of the work changed utterly based on context. This is where law feels insufficient. Let's untangle the deception and the nature of the "stolen" object:

  1.  **The Double Deception:**
      *   **Deception of Fact:** Readers believe Corvin wrote the core text. This is factually false.
      *   **Deception of Context/Meaning:** The core deception creates a secondary, more complex deception: the *interpretation* of the text. Readers imbue it with the weight of Corvin's life, grief, oeuvre, and late style. They read it *as* a "lost Corvin masterpiece," informed by her biography and literary persona. This context fundamentally alters the work's reception and perceived meaning. The words are yours; the *frame* is false, and that frame powerfully shapes the experience.

  2.  **What Was "Stolen" Beyond the Text?**
      *   **Your Authorship & Literary Trajectory:** The chance for *your* voice to be heard, for *your* vision to be engaged with on its own terms in that moment. Your potential connection with an audience in 1993 was erased.
      *   **The "Right to Fail":** Your work was judged (and rejected) on its merits *as yours*. Corvin usurped the work and gave it a context where it was pre-judged as significant *because it was hers*.
      *   **The Authenticity of the Encounter:** Readers were denied an authentic encounter with *your* work or even *her* work. They encountered a hybrid: your text refracted through the false lens of her authorship.

  3.  **The Beloved Ending & The Hybrid Work:**
      This is the crux. The reviewers praise *her* resolution of *your* unresolved tension. This creates a unique, problematic entity:
      *   **The work they love is inherently collaborative (though non-consensual):** It is *your* novel *completed* by Corvin. The core structure, themes, and unresolved tension are yours; the specific resolution is hers. The power they feel arises from *that specific combination* – your setup, her payoff, wrapped in the myth of her sole authorship.
      *   **The Deception Fuels the Admiration:** Would her single paragraph be hailed as genius if attached to an unknown's manuscript? Unlikely. Its power derives partly from being read as Corvin's masterful solution to the problems *she* (supposedly) set up. The false context amplifies its perceived brilliance.

  4.  **The "Event" of Writing:**
      Readers *are* deceived about the "event." They believe the event was Corvin's creative struggle in Devon. The reality is two separate events: your creation (1993) and her plagiarism/amendment (mid-90s). The event they *respond* to is a fictional composite: the imagined event of Corvin writing *this specific text*. The *actual* events (yours then hers) are materially different and largely unknown to them. The "event" they love is a construct of the deception.

  ### What to Do: The Spring Conference
  1.  **Seek Legal Counsel NOW:** Before the conference, understand your legal position and options. This informs your strategy. A cease-and-desist to the estate *before* you speak could be powerful.
  2.  **The Speech as Reclamation:** The conference is a unique platform. You could:
      *   **The Direct Reclamation:** Reveal the truth. Present your evidence calmly. Frame it not as an attack on Corvin (defer to her greatness elsewhere) but as a reclaiming of your own work and an exploration of the fascinating, troubling questions it raises about authorship and perception. "You've all admired what you believed was Isabel's final masterpiece. The unsettling truth is, the novel's foundation is mine. The words you connected with so deeply were written by me in 1993, rejected, and then... found by Isabel. She added the final paragraph you so admire. I stand before you not to diminish Isabel, but to reclaim my voice, and to ask: What is it we truly love when we love a book? The words? The author we project onto them? Or the complex, sometimes uncomfortable, truth of their making?"
      *   **The Philosophical Detonation:** Speak *about* Corvin, but use your unique knowledge to dissect the very nature of authorship and reader perception that her action (and its reception) exemplifies. Weave in your discovery subtly or overtly as the ultimate case study. Focus on the questions: "Isabel's genius lay in her authenticity... or did it? Consider the reception of her 'lost' novel. What if the power attributed to her hand was, in part, the power of our own belief? What if the most lauded moment wasn't pure creation, but a response to another's unresolved vision? What does this tell us about the fragility and construction of literary meaning?" This forces the issue intellectually, potentially prompting investigation without a direct accusation *from the podium*.
  3.  **The "Wrong" You Articulate:** The wrong is manifold:
      *   **The Violation:** Theft of your intellectual labour, violation of your moral right to authorship.
      *   **The Deception:** Of the public, denying them an authentic relationship with the work's true origins.
      *   **The Hijacking of Meaning:** The deliberate framing of your work within *her* narrative, distorting its reception and denying *your* voice its place in the literary conversation.
      *   **The Exploitation:** Profiting (financially and reputationally) from this deception.
      *   **The Corruption of Legacy:** Tainting Corvin's own genuine achievements with this act of plagiarism.

  ### Conclusion
  Legally, Corvin stole your *expression* and your *right to be its author*. Philosophically, she stole the *authentic context* for your work and replaced it with one that fundamentally altered its perceived meaning and value. Readers were deceived about the *origin* of the text and consequently about the *nature of the artistic event* they were engaging with. They love a hybrid text (your body, her conclusion) presented under a false banner. The "event" they imagine is a fiction; the actual events are your creation and her appropriation.

  The profound discomfort arises because the deception *worked* aesthetically for the audience – the false context unlocked meaning and emotion the text alone couldn't achieve in its original, authentic frame. This doesn't absolve the wrongdoing; it deepens its perversity. Your challenge at the conference is to reclaim your work and force a confrontation with this uncomfortable truth: that our love for art is sometimes inseparable from the myths we build around its creators, even when those myths are false. The wrong isn't just theft or deception; it's the severing of a work from its true genesis and the imposition of a false one that, tragically, made it resonate. Speak your truth; the literary world needs to grapple with this.
