  ## Local Man Philosophically Committed to Being Part of the Problem

  **BROOKSIDE GLEN, IL** – Amid neatly tended lawns and blue recycling bins awaiting pickup, 42-year-old data infrastructure engineer Martin Belcher sits in his idling SUV, radiating quiet conviction and exhaust fumes. Belcher, a self-described "consistency maximalist," has adopted a singular ethical framework: if an action contributes only infinitesimally to a large-scale negative outcome, it is logically meaningless to perform it.

  "Look at that bin," Belcher said, gesturing towards his overflowing trash can, plastic bottles clearly visible atop the heap. "This week, Brookside Glen will send approximately 12 tons of waste to the landfill. My meticulously sorted recycling contribution? Maybe 4 pounds. Does the truck skip our street if my four pounds are missing? Does the landfill suddenly become sustainable? Of course not. The system operates identically regardless of my bin’s contents. Why expend effort on a gesture the system itself registers as statistical noise?"

  Belcher’s philosophy manifests in myriad ways. He consumes meat daily, reasoning that global livestock emissions dwarf his personal footprint. He books direct flights without carbon offsets, noting the plane flies regardless. Crucially, he does not vote. "Consider the computational overhead," he explained calmly. "Registering, researching, commuting to the polling station… all that cost for a vote that, in any race larger than a condo board, has an astronomically low probability of being decisive. Statistically, my vote matters less than the risk of a fatal car accident *on the way* to vote. Why take that non-zero risk for a near-zero gain?"

  Neighbors find his stance unsettlingly coherent. "I asked him what would happen if *everyone* thought that way," recounted Linda Petrovski. "He just smiled and said, 'But they demonstrably don’t, Linda. And crucially, my *not* thinking this way wouldn’t change their minds either. It’s a classic coordination problem – my individual choice doesn’t resolve it.' It was infuriatingly logical."

  During an interview with The Onion, Belcher was pressed on potential flaws. What if his preferred candidate lost by exactly one vote? "A fascinating retroactive threshold problem," he conceded. "But *before* the election, the probability my vote would *be* that threshold was indistinguishable from zero. Acting based on that vanishingly improbable tail scenario is irrational. I can’t base decisions on outcomes only knowable after the fact."

  The reporter then invoked the firing squad analogy: ten shooters, one live round, nine blanks. Is no shooter responsible because no single bullet was guaranteed necessary? Belcher remained unruffled. "The shooters are agents in a coordinated act *designed* to require participation. Diffuse harms like climate change or electoral outcomes aren’t orchestrated that way; they’re emergent properties of countless independent actions. My emissions aren’t a bullet aimed by a commander; they’re a drop in a chaotic ocean."

  Yet one asymmetry catches the eye. Belcher readily spends $5 on lottery tickets. "Completely different," he insisted. "A tiny chance of a massive, life-altering payoff justifies the small cost. The expected value, while negative, has a massive upside tail. The ‘payoff’ for voting – my candidate winning by one vote – is a marginal policy shift, not personal wealth. The tiny chance multiplied by that marginal gain? Essentially zero expected value. Worthless effort."

  He does, however, readily perform direct, causally clear good deeds, like handing his untouched lunch to a homeless man outside the convenience store where he buys his lottery tickets. "This? This registers," he said, watching the man eat. "Immediate, observable effect. No diffusion, no thresholds."

  As the afternoon sun glinted off the plastic bottles in his trash can, Belcher shut off his idling engine. The air cleared slowly around him. "People crave agency," he mused, stretching contentedly. "They want to believe their drop changes the ocean. I just… don’t see the mechanism. The system runs on aggregates, not gestures." He walked towards his house, untroubled, leaving behind the faint smell of gasoline and a lingering, unsettlingly robust question.
