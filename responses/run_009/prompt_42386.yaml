  Hmm... the tense structure of Chiang's novella is so central. The way it uses second-person narration and grammatical tense to hide its temporal twist is unlike anything in Hofstadter's book. Film can't replicate that directly - it has to use cinematic conventions like flashbacks and then subvert them. That's a perfect example of form carrying meaning. 

