answer: |-
  Here’s a decision-tree handout designed to force clarity on pain’s badness. It starts from universal intuitions, uses concrete cases to branch, and ends at theory labels *only* at the leaves. The ordering isolates key commitments step-by-step.

  ---

  **The Badness of Pain: Find Your Position**  
  *Answer each question based on the case described. Follow your path to the end.*

  1.  **Your Own Pain:** When you stub your toe, does the *awfulness* (the badness, the thing that makes you suffer) feel like it is **built directly into the sensation itself**, inseparable from how it feels? Or does it feel like the sensation **just hurts**, and your *dislike* of it is a separate reaction?
      *   **Built-in?** → Go to 2.
      *   **Separate reaction?** → Go to 5.

  2.  **Asymbolia Patient:** A patient has brain damage. They report feeling a sensation they *call* "pain" from a pinprick. They say it feels *identical* in its raw sensory quality (sharp, localized) to your stubbed toe sensation. Crucially, they **genuinely do not care** – they feel no urge to avoid it, no distress. Is the *sensation they feel* **still intrinsically awful** (even if they don't react to it)?
      *   **Yes, still awful** → Go to 3.
      *   **No, not awful** → Go to 4.

  3.  **Morphine Calm:** A patient on morphine after surgery calmly rates their pain as "7/10 intense." They clearly *feel* the intense sensation, but show **no observable distress** – no tension, grimacing, or agitation. They report feeling *detached* from it. Is the intense 7/10 sensation they feel **still intrinsically awful**?
      *   **Yes, still awful** → **Evaluativism.** Pain represents bodily damage as *bad for you*, making this badness intrinsic to its content; not disliking it is failing to grasp its meaning.
      *   **No, not awful** → **Conditional Introspectionism.** Pain is only awful when it’s the object of a specific, self-directed negative introspective attitude; otherwise, it’s just a signal.

  4.  **Painful Pleasure:** You get a brutal deep-tissue massage. The pressure sensation is **identical** to what would make you scream in agony if done against your will. Because you *want* the result, you endure it. Is the intense pressure sensation **still intrinsically awful** during the massage?
      *   **Yes, still awful** → **Imperativism.** Pain is a bodily *command* ("Stop this now!"); the "awfulness" *is* the insistent motivational force. Context changes whether you obey, not the command's force.
      *   **No, not awful** → **Evaluativism.** (Contextual Version) Pain represents damage as bad *relative to current goals*; in a beneficial context, the same sensation loses its badness-representation.

  5.  **Alienated Pain (Weather Report):** A patient reports a throbbing head sensation with identical intensity to a migraine. But they insist it **feels completely detached**, "like hearing a weather report about someone else's headache." They feel *no personal dislike or concern*. Is the throbbing sensation **still unpleasant**?
      *   **Yes, still unpleasant** → **Pure Perceptualism.** Pain is a neutral sensory signal of bodily disturbance; its badness comes entirely from a separate, negative "attitude" directed at that sensation.
      *   **No, not unpleasant** → **Imperativism.** Pain’s core is a command *to you*; if it feels like a report *about someone else*, the essential "you must fix this!" command is absent. It might be a similar sensation, but it's not pain.

  ---

  **Theory Commitments (One Awkward Truth Each):**
  *   **Evaluativism (3/Yes):** Pain that feels *exactly like yours* but isn't judged as bad is conceptually impossible.
  *   **Conditional Introspectionism (3/No):** Severe pain isn't bad if you're distracted enough not to introspect it negatively.
  *   **Imperativism (4/Yes or 5/No):** You can't have genuine pain you feel no motivation whatsoever to stop.
  *   **Evaluativism (Contextual) (4/No):** The exact same physical sensation can fundamentally change from "pain" to "not-pain" based on context.
  *   **Pure Perceptualism (5/Yes):** You could have an "unpleasant pain" that feels *exactly* like a neutral tingling, differing only by an abstract attitude.

  **Key Notes & Gaps:**
  1.  **Unoccupied Branch:** Path (2/No → 3/Yes) is empty. If badness isn't intrinsic (2/No), but morphine sensation is *still* awful (3/Yes), this conflates intrinsic badness with a stubborn reaction. It's unstable.
  2.  **Imperativism vs. Evaluativism:** They largely overlap here (e.g., both explain asymbolia similarly). **The critical case separating them isn't included:** Can you feel a *command* ("Stop this!") without it representing *badness*? (E.g., "Stop this!" shouted about a pleasant tickle). If yes, Imperativism allows it; Evaluativism forbids it. This is hard to intuit clearly for non-philosophers.
  3.  **Why This Order?**
      *   **1:** Grounds everything in personal experience. Forces the core split: Is badness *in* the sensation or *about* it?
      *   **2:** Tests the necessity of dislike *given sensation identity*. Crucial for asymbolia.
      *   **3:** Tests if *intensity* alone implies badness without distress. Separates Evaluativism from Conditional Introspectionism.
      *   **4:** Tests if *context/volition* can strip intrinsic badness. Splits Imperativism from Contextual Evaluativism.
      *   **5:** Tests if *ownership* is essential to badness. Splits Perceptualism from Imperativism.
  4.  **Missing Theory:** Classical "Sensation-Dislike" Dualism often collapses into Pure Perceptualism here. Strong "Bodily Disturbance" theories without a distinct badness element are hard to separate from Imperativism on these cases. This tree prioritizes clarity over exhaustiveness for the core debate.

  **Goal:** This forces participants to confront *which element* in these cases makes pain bad (sensation quality, command, evaluation, attitude, context). The awkward commitments highlight counterintuitive costs. Use it to map disagreements *before* naming theories!
