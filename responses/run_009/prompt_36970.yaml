  - Next, morphine case: if pain is reported as intense but not distressing, does it still feel bad? This probes whether "badness" can be dissociated from intensity.  
  - Painful pleasures: if you voluntarily endure pain (e.g., massage), is it still bad? Tests if context changes the badness.  
  - Alienated pain ("someone else's weather report"): if pain feels detached, is it still unpleasant? Targets the link between ownership and suffering.  

  Theories will emerge at the leaves:  
  - Imperativism: pain as a command ("stop this!"), so badness is the urge to escape. Awkward commitment: pain without any motivation to stop isn't truly pain.  
  - Evaluativism: pain as a judgment ("this is bad"), so badness is cognitive. Awkward: pain that feels neutral is incoherent.  
  - Perceptual theories: badness is separate, so pain can occur without negativity (attitude added later). Awkward: we might misidentify neutral sensations as pain.  
  - Conditional introspectionism: pain is bad only when introspected as such. Awkward: unconscious pain isn't bad.  

