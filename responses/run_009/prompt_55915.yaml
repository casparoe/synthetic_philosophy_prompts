     Scenario: A mathematician proposes a new axiom that would imply that all models of set theory must be uncountable. How do you react?
     a) Axioms are arbitrary rules. We can add any axiom we want as long as it's consistent, but it doesn't make the model uncountable if there exists a countable one.
     b) The new axiom might hold in some universes but not in others. If it holds in a particular universe, then that universe is uncountable, but there might still be countable universes that don't satisfy the new axiom.
     c) The new axiom is necessary to capture the true nature of sets. The existence of countable models is a pathology that the new axiom would avoid.
     d) The new axiom might be true in the real universe, but it doesn't change the fact that there are countable models (which are just structures) that do not satisfy the new axiom.

