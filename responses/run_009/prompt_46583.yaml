  ### Path Dependence Simulation Game: "The Tech Tipping Point"

  This interactive game will help your group experience path dependence firsthand. Participants make individual tech choices that collectively lead to lock-in, mirroring real-world examples like QWERTY or VHS. Below is a complete runbook.

  ---

  ### **Game Setup**  
  **Objective:** Groups adopt either "Sparrow" (superior but risky) or "Owl" (inferior but safe) tech. Despite Sparrow's advantages, early random choices often lock everyone into Owl.  

  **Materials Needed:**  
  - 12 index cards (1 per player)  
  - Whiteboard with tracking table (see template below)  
  - Sticky notes or poker chips (30+ for "profit tracking")  
  - Timer  
  - Printed role sheets (1 per player, see example at end)  

  **Prep Time:** 10 minutes (print roles, set up whiteboard)  

  ---

  ### **Rules & Flow**  
  **(Total Time: 60 minutes)**  

  #### **Phase 1: Introduction (5 min)**  
  - Explain: *"You’re tech startups adopting one of two systems: Owl (reliable but slow) or Sparrow (faster but unproven). Each round, you’ll choose privately. Your profits depend on your choice AND what others pick."*  
  - Hand out **role sheets** with payoff rules:  
    - **Owl Users**: Gain 1 chip if >50% of players use Owl.  
    - **Sparrow Users**: Gain 2 chips if >50% use Sparrow.  
    - **If your system loses** (≤50% adoption), you get **0 chips**.  
  - Clarify: *"Sparrow is better, but only if most of you adopt it. Owl is safer alone but less rewarding."*  

  ---

  #### **Phase 2: Gameplay (30 min, 5 rounds × 6 min each)**  
  **Each Round:**  
  1. **Choose (1 min)**: Players write **O** or **S** on index cards (folded to hide choices).  
  2. **Reveal (2 min)**: Facilitator collects cards, tallies votes on whiteboard.  
  3. **Profit (2 min)**:  
     - Announce majority system.  
     - Distribute chips: Winners (Owl or Sparrow users) take chips based on their role sheet.  
  4. **Record (1 min)**: Update whiteboard table (see template).  

  **Whiteboard Tracking Table:**  
  | Round | Owl Users | Sparrow Users | Majority | Profit per Winner |  
  |-------|-----------|--------------|----------|-------------------|  
  | 1     |           |              |          |                   |  
  | 2     |           |              |          |                   |  
  | ...   | ...       | ...          | ...      | ...               |  

  **Critical Twist**:  
  - **Round 1**: No payoff (simulates uncertainty).  
  - **Rounds 2–5**: Pay chips only if a system has >50% adoption.  
  - **Lock-In Trigger**: If Owl wins majority in Round 1, players often "play safe" and stick with Owl—even knowing Sparrow is better.  

  ---

  #### **Phase 3: Debrief (25 min)**  
  **Step 1: Group Reflection (10 min)**  
  - Ask:  
    - *"When did you realize we were stuck? Could we have switched to Sparrow later?"*  
    - *"What did Round 1 feel like? Was it a gamble?"*  
  - Highlight:  
    - **The Accident**: Round 1’s random split often decides everything.  
    - **Lock-In Point**: By Round 3, switching costs (lost profits) outweigh benefits.  

  **Step 2: Connect to Real World (10 min)**  
  - **QWERTY Example**:  
    - *"Round 1 = 1870s typewriter trials. Early manufacturers chose QWERTY randomly. By Round 3 (1920s), factories, typists, and manuals were locked in—even though Dvorak was proven faster."*  
  - **VHS vs. Betamax**:  
    - *"Round 1 = 1978. VHS got a 60% market share by partnering with more movie studios. By Round 3 (1983), Betamax was dead—not because it was worse, but because rewinding to change was too costly."*  

  **Step 3: The Big Question (5 min)**  
  - *"If we rewound the tape, would Sparrow ever win?"*  
    - **Yes**: Random Round 1 swings could make Sparrow win.  
    - **But**: Once ahead, Owl’s network effects (profit safety) repel change.  
  - *"In history, accidents decide early winners—but once ‘locked,’ superiority rarely matters. The cost of rebellion is just too high."*  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Suspicious Players**:  
     - Some may push Sparrow early. **Solution**: Emphasize Round 1’s uncertainty ("No payoffs! You’re guessing!"). Most will default to Owl for safety.  

  2. **Rebel Coordinators**:  
     - A player may rally others to switch mid-game. **Use this!** Debrief: *"Did anyone try to lead a switch? Why did it fail? Real-world examples need massive coordination (e.g., governments, monopolies)."*  

  3. **Uneven Engagement**:  
     - Retirees may hang back. **Solution**: Assign roles (e.g., "CEO," "Engineer") to contextualize choices (see role sheet example).  

  4. **Owl Wins Every Time?**  
     - In 80% of trials, Owl locks in by Round 3. If Sparrow wins, **discuss why**: *"Did someone take risks? Real-world examples (e.g., USB vs. serial ports) show superior tech can win with lucky early breaks."*  

  ---

  ### **Role Sheet Example**  
  Print variations to deepen engagement:  
  ```  
  Role: SUPPLY CHAIN MANAGER  
  Goal: Minimize risks. You lose $ if systems change.  
  Secret: Owl parts are 20% cheaper.  

  Round Advice:  
  - Round 1: "Play safe! Choose Owl."  
  - Round 2+: "Stick with the majority—switching wastes resources."  
  ```  

  ---

  ### **What the Game Can’t Capture**  
  - **Long-Term Evolution**: Real lock-ins (like QWERTY) last 150+ years. The game shows *how* it starts, not why it persists.  
  - **External Shocks**: In history, wars or innovations can break lock-in (e.g., digital streaming killed VHS). The game lacks these "wild cards."  
  - **True Superiority**: Sparrow is "better" by design, but in reality (e.g., Betamax), debates rage about *how much* better it really was.  

  ---

  ### **Why This Works**  
  - **No Jargon**: Players *feel* the frustration of being stuck—no need to define "path dependence."  
  - **"Aha!" Moment**: By Round 3, they see Owl winning and groan, *"But Sparrow is better!"*  
  - **Debrief Bridges Theory**: The Round 1 tally = "accident," Round 3 = "point of no return."  

  Your group will leave debating whether history is luck or destiny—perfect for a library discussion!
