  Okay, let me start by unpacking the user's request. They're a retired comparative physiologist with decades of experience in lizard thermal biology and now deeply into philosophy of biology. Their main struggle is understanding the debate between selected-effect (SE) and causal-role (CR) accounts of function. They want a fresh thought experiment that avoids clichés and meets specific criteria.

  First, the scenario needs a trait with a clear historical selection for function F, but currently, it performs F poorly due to environmental changes. Instead, it now performs a new function G that's vital for survival, but without enough time for selection to act on G. No genetic engineering, just natural ecological shifts. Also, avoid well-known examples like panda's thumb or middle ear bones.

  Hmm, I need something biologically realistic. Since the user worked with lizards, maybe stick to that area. Let me think of environmental changes affecting lizards. Desertification comes to mind—say, a lizard species adapted to rocky outcrops now facing sand dunes. Their limblike tails historically evolved for climbing (F), but now they can't climb sandy slopes. Instead, the tail's weight helps them burrow into sand to avoid heat (G). But is burrowing new? Maybe not unique enough. 

  Wait, what about thermoregulatory behaviors? Some lizards use body orientation for heat regulation. Suppose a lizard that basks with its body flattened against hot rocks (F). But if the rocks disappear and are replaced by loose sand, they can't flatten effectively. Instead, the tail's drag during movement inadvertently stabilizes their position against strong winds. Wind resistance wasn't a prior selective pressure, but now it's crucial. That feels plausible. 

  Check the criteria: (i) historical selection for F (thermoregulation via flattening), (ii) current environment makes F ineffective (no rocks, only sand), (iii) new role G (wind stabilization) is vital but recent, no selection yet. Perfect. 

  Now, analyzing both accounts. SE would say the function is still F because of historical selection. CR would say G, as it's the current causal role necessary for survival. The key feature here is the environmental change that made F obsolete and G essential without time for selection. If you remove the environmental shift, both accounts might agree on F. 

  Would SE proponents argue secondary function? They might claim that if G contributes to fitness now, it's a new function. But the user specified no selection yet, so that shouldn't hold. SE might also say that historical context defines function regardless of current utility. The thought experiment highlights that SE and CR answer different questions: "why is it there?" vs. "what does it do now?". The user wonders if they're talking past each other. This case shows that both accounts can assign different functions simultaneously, meaning they're addressing distinct aspects. 

  Honestly, yes, they're answering different questions, but the disagreement is real when asking "what is the function?" without specifying context. The user's deeper need is clarifying whether the debate is substantive or semantic. This example demonstrates that while the accounts focus on different temporal aspects, the tension arises when applying the concept in a specific scenario without clarifying the frame of reference.
answer: |-
  Here's a carefully constructed thought experiment tailored to your specifications:

  **The Sandstorm Skink:** Consider a lineage of desert skinks (*Eumeces schneideri* complex) inhabiting stable, rocky outcrops for millennia. Their broad, muscular tails evolved under strong selection for **F: Anchoring during basking and predator evasion**. Flattening their bodies against sun-warmed rocks requires pressing the wide tail firmly down to resist being flipped by gusts or predators, maximizing heat absorption and stability (validated by force plate respirometry showing 25% higher basking efficiency with intact tails). However, recent desertification has replaced their rocky habitat with vast, loose-sand dunes. Here, **F (anchoring) is ineffective** – pressing the tail into sand provides negligible purchase. Crucially, these dunes experience daily, intense **katabatic winds** scouring the sand surface. Skinks caught exposed suffer lethal desiccation within minutes. Survival now depends on rapid burial into cooler, moist subsurface sand. The broad tail, swept laterally during initial burrowing attempts, **creates G: A stabilizing drag anchor**, preventing the skink from being tumbled by wind during the critical 2-3 seconds it takes to submerge its head and commence digging. Field tracking shows 80% mortality in exposed skinks with experimentally narrowed tails vs. 30% with intact tails during wind events. This wind-driven burial dependency emerged only 30 generations ago – too recent for significant selection on tail morphology specifically for G (genetic drift studies confirm no allele frequency shifts yet associated with tail width and wind survival).

  **Analysis:**

  1.  **Selected-Effect (SE) Account:**  
      *   **Function:** **F (Anchoring)**. The tail's function is defined by its evolutionary history. Millennia of selection for anchoring during basking and predator evasion are the "reason" the tail exists in its current form. The recent, vital role G emerged accidentally from this pre-existing structure and hasn't been the target of selection.
      *   **Heavy Lifting:** The **long, documented selection history for F** and the **recency/speed of the environmental shift** preventing selection for G.
      *   **Delete Key Feature:** If the tail shape had *no* clear historical selection for anchoring (e.g., was a neutral trait or selected for display), SE proponents might argue it never truly had a function, or its function was ill-defined. If the shift were ancient or slower, allowing selection for G, SE might grant G as a new or co-function.
      *   **SE Fightback & "Modern History" Move:** A committed SE proponent might argue:
          *   **Secondary/Current Function:** Some modern SE accounts (e.g., modified Millikan) allow traits to acquire new "proper functions" if *current* selection maintains them *because* of their effect, even if the trait originated differently. **Rebuttal:** The case specifies *no population-level selection for G yet*. The tail's width isn't *currently* being selected *for* drag stabilization; it's merely fortuitously enabling survival. Selection hasn't started acting *on variation in tail width specifically for wind burial efficiency*.
          *   **Relabeling?** Insisting G *is* now the function because it contributes to fitness *feels* like relabeling the problem. The SE account traditionally roots function in etiology (past selection), not current utility. Granting G here weakens the core historical commitment. The "30 generations" parameter blocks the "it's *becoming* the function" escape hatch.

  2.  **Causal-Role (CR) Account:**
      *   **Function:** **G (Wind Burial Stabilization)**. The tail's current, indispensable causal contribution to the organism's survival (rapid burial before desiccation) in its *present* environment defines its function. What it *used* to do is irrelevant to its current functional role within the system.
      *   **Heavy Lifting:** The **current vital necessity of G for survival** and the **ineffectiveness of F** in the new environment.
      *   **Delete Key Feature:** If G wasn't vital (e.g., wind wasn't lethal, or other burial methods existed), CR might struggle to assign a strong function. If F was still partially effective, CR might grant a dual function or prioritize F if it remained the primary contributor.
      *   **CR Clarity:** CR cleanly identifies the tail's critical role in the organism's *current* survival strategy without appealing to history.

  **The Core Disagreement & Talking Past:**

  This case forces a **genuine, substantive disagreement**, not merely talking past. The crucial question is: **"What fact grounds the assignment of function?"**

  *   **SE:** Grounds function in **historical etiology** (past selection *for* an effect). The tail's function is anchored in why it was *built* that way. Its current utility, however vital, is happenstance unless history catches up via selection *for* G.
  *   **CR:** Grounds function in **current systemic contribution**. The tail's function is defined by the causal work it does *right now* within the organism's current life strategy in its present environment. Its historical origin is incidental to this assignment.

  While they answer different *questions* ("Why is it here?" vs. "What does it do now that matters?"), the disagreement manifests when we simply ask **"What is the function of trait T in organism O?"** without specifying the temporal frame. The Sandstorm Skink shows these accounts deliver *different and conflicting answers* to that direct question. The SE answer feels descriptively incomplete ("It *used* to anchor, but that doesn't help now"), while the CR answer feels historically unmoored ("It stabilizes burial now, but that's not why it *has* that shape"). **The disagreement is real: it's about whether history or current utility is the fundamental ground for functional attribution.**

  Honestly, Professor? This case highlights why the debate persists. Both accounts capture something vital and irreducible about how biologists actually reason. SE explains trait origins and maintenance; CR explains trait operation within current systems. Your lizard physiologist's intuition that both perspectives are necessary is likely correct – but the *primary* grounding of "function" remains a deep philosophical fissure this thought experiment lays bare.
