prompt: |-
  Background so you know where I'm coming from: I spent my career as a comparative physiologist — thermal biology of lizards, mostly, forty years of fieldwork and respirometry — and since retiring I've fallen hard down the philosophy of biology hole. The thing I can't stop chewing on is the fight over what it even means to say a trait "has a function": the selected-effect people versus the causal-role people. I get the textbook cases (heart selected for pumping blood, not for making thumping noises) but I want something less worn.

  Construct me a thought experiment to spec, please. One paragraph, biologically realistic — I'll notice if you fudge the physiology, that was my whole career. The setup: a trait that (i) has a long selection history for function F, (ii) in the case's environment performs F badly or not at all, and (iii) has picked up a new role G that the organism currently depends on to survive — but the shift to G has to be recent enough that selection hasn't yet had time to act on it, so no population-level selection for G, which means no "it's in the process of acquiring G as its function" escape hatch. Also no genetic engineering labs, just ecology and ordinary environmental change. And please not the middle ear bones, the panda's thumb, or anything else Gould made famous — I want something I haven't seen a hundred times.

  After the scenario, show your work: what each account says the trait's function is, which feature of the case is doing the heavy lifting, what happens to the verdicts if you delete that feature, and how a committed selected-effect person would fight back — I gather there's some "modern history" move or other, maybe via secondary functions, evaluate whether it actually saves them here or just relabels the problem. Last thing, and answer this honestly: does the case show the two accounts genuinely disagree about something, or are they just answering two different questions and talking past each other? Because I've read enough now to know that's the live issue, and I genuinely can't decide it myself.
