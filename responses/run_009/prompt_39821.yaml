prompt: |-
  I've been reading the decision-theory threads on rationalist blogs and forums since the days people first rediscovered Hofstadter's superrationality columns, and I still don't know what I actually believe about cooperating. So let me lay out my gut verdicts on some cases and ask what principle, if any, captures them — and which of my verdicts has to go.

  First, the setup facts, so we're talking about the same thing. In Hofstadter's Platonia dilemma, a trillionaire tells twenty people that if exactly one of them sends him a telegram by noon the next day, that person gets a billion dollars; if more than one, or none, arrives, nobody gets anything. No communication between them is allowed. His Luring Lottery was similar in spirit but ran for real in Scientific American: each entrant mailed in a postcard bearing a number of entries (one entry if you wrote "1," or as many as you liked by writing a bigger number), and the prize was a million dollars divided by the total number of entries received, paid to the submitter of one randomly chosen entry. In the actual event, enough people submitted astronomically large numbers that the prize became a rounding error on nothing.

  My verdicts. (1) One-shot prisoner's dilemma with a random stranger, no communication, never meeting again: defect, obviously. (2) Same game, but I've learned the stranger has spent twenty years reading the same decision-theory threads I have and, by every indication, reasons about these questions much as I do: cooperate, and defecting now feels like a kind of self-betrayal. (3) In Platonia, if I'm confident the other nineteen reason the way I do, I endorse the superrational move — sending the telegram with probability 1/20 — and would actually go through with the randomization. (4) In a fresh Luring Lottery, I want to submit exactly one entry, and I still want to submit one entry after learning that the vast majority of entrants have never heard of superrationality and will submit googol-scale numbers — "don't be part of the collapse" — even though I can't see how that impulse survives the arithmetic. (5) National election, chance of my vote being pivotal minuscule: vote. (6) My homeowners' association, forty voters I know personally and who are all out for themselves: I still vote, yet I would defect without hesitation on any one-shot cooperation problem with those same forty people. (7) Tip the waiter in a city I will never revisit: tip, and stiffing him feels worse, somehow, than defecting on the stranger in (1).

  My tentative principle is evidential: cooperate when my cooperating is itself evidence that relevantly similar reasoners will cooperate too. It seems to deliver (2), (3), and (5). But it's silent on tipping, where the waiter isn't mirroring anything; it can't keep (1) at "defect" once I reflect that the random stranger is also a person reasoning about the game; and it pulls apart my two verdicts in (6) in a way I can't make sense of. So: is there one principle that saves all seven, or a small set of candidates? Please state each precisely, say which case motivates each clause, and report its verdict on cases I haven't listed — in particular, a one-shot dilemma against a reasoner who runs the very same reasoning I do but has opposed values, and a Platonia where I know one of the nineteen is a superrationalist and I know nothing about the rest. Then tell me plainly which of my verdicts your best principle cannot accommodate.

  And please push back if the request is confused at the root. If superrationality from the beginning just muddles acting on evidence with causing outcomes, or if my seven verdicts are unrelated intuitions wearing one hat, say so rather than rescuing them for me — I'd rather learn that my list was never going to compress than get a principle welded onto it.
reasoning: |-
  Okay, let me start by understanding the user's problem. They've been deep into decision theory and superrationality for years but still can't pin down a consistent principle for when to cooperate. They've listed seven specific scenarios with their gut responses and want a unifying principle or to know which intuitions have to be discarded.

  First, I need to parse each of their verdicts. The user's tentative principle is evidential: cooperate when their action is evidence that similar reasoners will cooperate too. But they point out issues—like tipping where the waiter isn't mirroring, or the prisoner's dilemma with a random stranger where defecting feels right even though the stranger is also reasoning. 

  Looking at their cases, there's a mix of situations: one-shot games, repeated interactions (even if not direct), and cases with many players. The tipping example is interesting because it's a one-shot but the user feels compelled to tip, which doesn't fit neatly into evidential decision theory. Maybe there's a norm or internalized principle at play here beyond just evidence.

  The homeowners' association case is tricky. They vote even though everyone is self-interested, but they'd defect in a one-shot with the same people. Why the difference? Voting might feel like a duty or have a different psychological weight compared to a direct betrayal. The evidential approach might struggle here because in both scenarios, the other actors are similar, but the contexts differ (voting vs. personal interaction).

  Superrationality seems to work well when there's symmetry—like in Platonia or when you know the other thinks like you. But in the Luring Lottery, the user wants to submit one entry despite knowing others will overbid. That's puzzling because the evidential approach would suggest that their action doesn't influence others, so why cooperate? Maybe they feel that participating fairly is intrinsically good, even if futile. But the user admits this doesn't survive the arithmetic, so perhaps this verdict is inconsistent and needs to go.

  Then there's the question of common knowledge and symmetry. In the PD with a similar reasoner (case 2), cooperating makes sense under superrationality because both players, being symmetric, would choose the same action. But with a random stranger (case 1), there's no such symmetry or common knowledge, so defecting is rational. This distinction might be key. 

  For tipping, perhaps it's about personal norms or identity. The user might see themselves as a tipper, and not tipping feels like a betrayal of self, regardless of the waiter's actions. This aligns with deontological ethics rather than consequentialism. So the principle needs to include a component about self-consistency or identity.

  In the homeowners' association voting, even though others are self-interested, voting might be seen as a civic duty. The act of voting reinforces a social norm, whereas defecting in a one-shot PD doesn't carry that normative weight. This suggests that social roles and contexts matter, which isn't captured by decision theory alone.

  Considering the additional cases: a one-shot dilemma against someone with opposed values. Here, even if they reason similarly, their values differ, so symmetry is broken. Defecting would be rational. In Platonia with one known superrationalist and unknown others, the user might randomize at 1/20 only if they assume symmetry with the known superrationalist, but the unknowns complicate it. If they can't assume symmetry with all, they might not send the telegram.

  Putting this together, the best approach might be a hybrid: use evidential reasoning when there's symmetry and common knowledge (like cases 2 and 3), but fall back to causal decision theory otherwise. For social norms (tipping, voting), incorporate a deontological element where the action aligns with personal identity or societal roles.

  The user's verdict on Luring Lottery (4) seems inconsistent. Submitting one entry when others submit huge numbers is irrational under both CDT and EDT because it lowers the expected prize. The user admits this doesn't make sense arithmetically, so this verdict might need to be abandoned. Similarly, in case 6, voting in the HOA might be defensible as a norm, but defecting in a one-shot PD with the same people is consistent if voting is seen differently.

  So the unifying principle would have three parts: symmetry-based cooperation under common knowledge, causal defection otherwise, and norm-driven actions in social contexts. This saves most verdicts except Luring Lottery and possibly clarifies the HOA distinction.
answer: |-
  After analyzing your verdicts, I propose **Symmetry-Respecting Causal-Evidential Hybridism** as the unifying principle. It combines three clauses to handle different contexts:

  1. **Default to Causal Decision Theory (CDT)**: Maximize expected utility given your *causal* impact.  
     *Motivated by:* Cases where your action doesn't predict others' behavior (1, 6-defection, tipping).  
     *Verdicts:* (1) Defect (your action doesn't cause stranger's move); (6-defection) Defect (one-shot); (7) Tip (causally rewards service; not cooperating with mirroring agents).

  2. **Symmetry Override**: When you share common knowledge of symmetry (identical reasoning + aligned incentives) with all players, choose the Pareto-optimal *symmetric* equilibrium.  
     *Motivated by:* Cases where mutual prediction enables coordination (2, 3).  
     *Verdicts:* (2) Cooperate (you both reason identically); (3) Randomize at 1/20 (only symmetric Nash equilibrium).

  3. **Normative Stance Preservation**: When your action signals commitment to a coordination norm (even if causally futile), follow the norm if it reinforces identity/values you endorse.  
     *Motivated by:* Voting and Luring Lottery cases where evidential reasoning fails but cooperation persists (4, 5, 6-voting).  
     *Verdicts:* (4) Submit "1" (upholds "fair player" identity); (5) Vote (civic duty norm); (6-voting) Vote (local community norms).

  ---

  ### **Principle Applied to New Cases**
  - **One-shot PD with identical reasoning but opposed values**:  
    → *Verdict:* Defect.  
    *Why:* Symmetry broken (incentives misaligned). Clause 1 (CDT) dominates: defecting causally dominates.

  - **Platonia with one known superrationalist and 18 unknowns**:  
    → *Verdict:* Do not send the telegram.  
    *Why:* No common knowledge of symmetry across all players. Clause 1 (CDT) applies: sending has near-zero causal probability of being the sole sender.

  ---

  ### **Verdicts This Principle Cannot Accommodate**
  Your principle **must abandon verdict (4)** (submitting "1" in Luring Lottery after learning others submit huge numbers).  
  - *Why:* Under CDT (Clause 1), submitting "1" reduces your expected prize (causally harmful). Under Symmetry Override (Clause 2), symmetry is absent. Under Normative Stance (Clause 3), submitting "1" is futile signaling—it doesn't sustain a useful norm against googol-scale entries. Your intuition here is noble but arithmetically self-sabotaging.

  ---

  ### **Pushback: Diagnosing the Core Confusion**
  Your intuitions aren't random—they reveal **three distinct decision modes** humans use, which superrationality conflates:
  1. **Causal agency** (PD with strangers: "My choice *causes* outcomes").  
  2. **Equilibrium selection under symmetry** (Platonia: "We're identical—what would we both do?").  
  3. **Identity signaling** (Voting: "I'm the kind of person who votes").  

  **Superrationality's flaw:** It treats *all* cooperation as evidence-based symmetry reasoning, ignoring causal stakes and identity. This collapses when:
  - Outcomes depend on your causal impact (tipping, voting pivotality).  
  - Symmetry is unknowable (PD with strangers).  
  - Acts are symbolic, not game-theoretic (submitting "1" against googolplexes).  

  **Your verdicts aren't compressible into one "true" theory** because they respond to different problems:
  - (1), (6-defection) = Causal dominance  
  - (2), (3) = Symmetry equilibrium  
  - (4), (5), (6-voting), (7) = Identity/norm preservation  

  **Recommendation:** Accept a *modular* approach. Use CDT by default, switch to symmetry reasoning when common knowledge of identical rational agents exists, and preserve norms only when signaling has low cost or high identity value. Abandon verdict (4)—it’s an unsustainable relic of wishful symmetry-thinking.
