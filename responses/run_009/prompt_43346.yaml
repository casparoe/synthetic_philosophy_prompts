prompt: |-
  I sit on the steering committee of a small foundation that can fund three postdocs for five years on the border between moral psychology and metaethics, with one explicit aim: clarifying what, if anything, cross-cultural variation in moral judgment implies about moral objectivity. My own suspicion is that the standard WEIRD-sampling critique of moral psychology has been over-milked, and that the genuinely open questions lie further upstream or off to the side. Candidates I have in mind include: whether the cross-cultural differences actually documented are best described as disagreement over moral verdicts, or as disagreement over which concepts the verdicts are about (a community's verdicts about purity and hierarchy may not contradict ours at all if the words are doing different work); whether the near-universality of some moral themes — harm norms, reciprocity, taboos — is any more evidentially relevant to objectivity than the universality of optical illusions is to the objectivity of colour; and whether the objectivity commitments of ordinary moralizers, which themselves vary across cultures, should carry metaethical weight at all or are just more data. Rank the questions our money should chase, defend the ordering explicitly in terms of importance, tractability, neglectedness, and how many other questions depend on each, and tell me plainly which putative implications of cultural variation are overrated or do not follow. Commit to a ranking rather than surveying the options, and note what evidence over the next few years would move items up or down your list. Please answer in British English.
reasoning: |-
  Okay, the user is on a steering committee for a foundation funding postdocs to explore cross-cultural moral variation and moral objectivity. They suspect the WEIRD critique is overplayed and want to focus on upstream questions. The user presents three candidate questions and asks for a ranking based on importance, tractability, neglectedness, and how many other questions depend on each. They also want to know which implications of cultural variation are overrated.

  First, I need to unpack each question. The first is about whether differences are about moral verdicts or the concepts themselves. This seems foundational because if variations stem from conceptual differences rather than conflicting verdicts, it changes the debate entirely. If moral terms like "purity" mean different things across cultures, then what looks like disagreement might actually be talking past each other. That would significantly impact discussions on objectivity. Plus, this question hasn't been explored much, making it neglected. Research here could involve linguistic analysis and ethnographic studies to map moral concepts.

  The second question asks if universal moral themes (like harm norms) are evidence for objectivity, similar to optical illusions for color. The user compares this to optical illusions, which are universal but don't prove objectivity in color perception. This seems important because it challenges a common argument in metaethics. If universality doesn't imply objectivity, that undermines naturalist approaches. However, this might be more tractable with existing cross-cultural data. Still, it might be less neglected than the first question.

  The third question is about whether ordinary people's objectivity commitments should influence metaethics. The user notes these commitments vary across cultures. This questions the evidential value of folk metaethics. If people's beliefs about objectivity don't correlate with actual objectivity, then they're just more data. This is important but perhaps more philosophical. It might depend on answers to the first question. If concepts differ, then folk commitments might not be comparable. Tractability could be high through surveys, but it's not as neglected.

  Ranking them: Question 1 seems most crucial. It's the bedrock. Without clarifying concepts, other investigations might build on shaky foundations. It's also neglected and tractable via interdisciplinary methods. Question 2 is next because universality arguments are prevalent but possibly flawed. Addressing this could redirect research. Question 3, while important, leans more on philosophical debate and might be premature without resolving the first two.

  Overrated implications: The idea that variation directly challenges objectivity is overrated. If differences are conceptual or about non-moral factors, they don't bear on objectivity. Also, universality as evidence for objectivity is shaky, akin to optical illusions. Folk objectivity commitments might not be reliable indicators.

  Evidence moving the needle: For Q1, finding that moral terms have different extensions across cultures would boost its importance. If concepts align, it drops. For Q2, if universality correlates with objectivity in other domains, it rises. For Q3, if folk commitments track philosophical truths, it becomes more critical.

  The user might have deeper needs: wanting to maximize impact with limited funds, seeking innovative angles beyond the WEIRD critique, and ensuring their foundation addresses under-explored yet pivotal issues. They might also want to position their foundation as a thought leader in metaethics by tackling foundational questions that reshape the discourse.
answer: |-
  Based on your stated priorities and my analysis of the philosophical and empirical landscape, here is my committed ranking for the three postdoc projects, explicitly justified by the criteria of **Importance**, **Tractability**, **Neglectedness**, and **Dependence**. I'll then outline which implications are overrated and what evidence could shift this ranking.

  **Ranking:**

  1.  **Whether cross-cultural differences are best described as disagreement over moral *verdicts* or disagreement over which *concepts* the verdicts are about.**
  2.  **Whether the near-universality of certain moral themes is evidentially relevant to objectivity.**
  3.  **Whether the objectivity commitments of ordinary moralizers should carry metaethical weight.**

  **Defence of the Ordering:**

  1.  **Conceptual Groundwork vs. Verdict Disagreement (Rank #1):**
      *   **Importance (Very High):** This is the **foundational bedrock** upon which the entire debate rests. If purported moral disagreements across cultures are actually conceptual mismatches (e.g., "purity" or "respect" meaning fundamentally different things in different normative frameworks), then much of the evidence for variation *simply dissolves* as evidence bearing directly on moral truth or objectivity. Resolving this is *necessary* before we can even *meaningfully* assess the evidential weight of variation or universality for metaethics. It fundamentally reconfigures the question.
      *   **Tractability (High):** This question lends itself well to **interdisciplinary investigation**. Postdocs could combine:
          *   Philosophical conceptual analysis (clarifying core moral concepts).
          *   Linguistic anthropology/semantics (mapping how moral terms are used, their extensions, and their relationship to local practices/worldviews).
          *   Cross-cultural experimental philosophy (probing intuitions about cases designed to tease apart conceptual commitment from verdict disagreement).
          *   Ethnographic review (re-examining classic and contemporary accounts of "moral difference" through a conceptual lens).
      *   **Neglectedness (High):** While the *possibility* of conceptual variance is acknowledged (e.g., discussions of moral twin earth, concept thick vs. thin), it has **not been systematically and empirically investigated as the *primary* hypothesis** for explaining observed cross-cultural variation. The default assumption often remains that we are looking at straightforward verdict disagreement over shared concepts. This project explicitly challenges that default head-on.
      *   **Dependence (Very High):** The answers to questions #2 and #3 **heavily depend** on the resolution of this one. If variation is largely conceptual, it drastically changes how we interpret universality patterns and folk metaethical commitments. It is the most upstream question.

  2.  **Universality and its Evidential Weight (Rank #2):**
      *   **Importance (High):** Universality (especially of harm norms, reciprocity) is **frequently invoked as prima facie evidence for moral realism/naturalism** (e.g., "basic moral grammar"). Challenging this analogy to optical illusions (universal but non-objective) directly targets a common argument *for* objectivity. Showing universality lacks the claimed evidential force would significantly reshape the metaethical landscape and refocus arguments.
      *   **Tractability (Moderate-High):** This project can build on **existing cross-cultural databases** (e.g., HRAF, ethnographic records, large-scale surveys like WVS) and **experimental findings** on moral foundations. It requires:
          *   Meta-analysis of existing universality claims (scope, strength, exceptions).
          *   Philosophical argument refining the "illusion" analogy and its disanalogies to universality.
          *   Psychological investigation into the cognitive/evolutionary origins of universal themes to assess if they track truth or serve other functions (like social coordination, which the illusion analogy suggests).
      *   **Neglectedness (Moderate):** The *existence* of universality is studied, but its **precise evidential weight for metaethical objectivity is under-scrutinized**, especially the force of the disanalogy with illusions. Arguments often assume universality supports objectivity without rigorously examining counter-analogies.
      *   **Dependence (Moderate):** While somewhat independent, its interpretation is clarified by #1 (e.g., is the universality in verdicts or underlying concepts/functions?). It informs #3 (if universality isn't strong evidence, folk commitments based on perceived universality lose some force).

  3.  **Folk Metaethical Commitments (Rank #3):**
      *   **Importance (Moderate):** Folk commitments are **often used descriptively** (e.g., to argue realism is the "default") and sometimes **normatively** (e.g., in arguments from disagreement). Assessing their metaethical weight is important for understanding the dialectic and the potential burden of proof. However, whether philosophers *should* grant them evidential weight is ultimately a meta-metaethical question less immediately tied to the core *empirical* puzzle of variation/universality than #1 and #2.
      *   **Tractability (High):** **Empirically tractable** through cross-cultural surveys and experiments probing folk intuitions about moral truth, disagreement, and relativity. Philosophers can then debate the normative significance of these findings.
      *   **Neglectedness (Low-Moderate):** This is a **rapidly growing area** (Experimental Metaethics). While cross-cultural comparison of folk commitments is still developing, the core question of their metaethical significance is actively debated. It's less neglected than #1 and arguably less uniquely positioned than #2 regarding the universality argument.
      *   **Dependence (High):** This question **depends significantly on #1 and #2**. If variation is conceptual (#1), comparing folk "objectivity" commitments cross-culturally becomes highly problematic (are they committing to the *same* kind of objectivity about the *same* things?). If universality (#2) isn't strong evidence for objectivity, then folk appeals to universality as a reason for their objectivity commitments lose force. Its significance is downstream.

  **Overrated Implications of Cultural Variation:**

  1.  **"Variation Directly Implies Anti-Realism/Relativism":** This is **highly overrated and often invalid.** As your first question highlights, variation *might* be conceptual, not verdict-based. Even if verdict-based, it might reflect differing non-moral beliefs (e.g., factual beliefs about the world, consequences, gods), differing priorities/weightings of shared moral values, or differing circumstances – none of which necessarily undermine the objectivity of the underlying values. Variation alone is **insufficient** to establish relativism or anti-realism.
  2.  **"Universality Directly Implies Realism/Objectivity":** This is **overrated**, as your second question and the illusion analogy suggest. Universality could arise from shared cognitive architecture, evolutionary pressures for social coordination, or common ecological problems, **without** tracking mind-independent moral truths. Universality is **compatible with various anti-realist explanations** (e.g., sophisticated subjectivism, constructivism).
  3.  **"Folk Objectivism is Evidence for Metaethical Objectivism":** This is **overrated and potentially question-begging.** The fact that people *believe* morality is objective doesn't make it so. Its evidential weight is highly contested and, as your third question notes, it's itself variable data needing explanation, not necessarily a foundation for metaethics. Taking it as direct evidence risks conflating descriptive psychology with normative philosophy.

  **Evidence Shifting the Rankings (Over ~5 Years):**

  *   **Moving #1 Down:** Strong evidence emerging that core moral concepts (like "wrong," "obligation," "justice," "purity") **do map robustly across diverse cultures** onto sufficiently similar phenomena that observed differences in verdicts genuinely reflect disagreement over the application of *shared* concepts, rather than conceptual divergence. Linguistic/philosophical analysis consistently finds translatable cores.
  *   **Moving #2 Up:** If #1 is resolved *against* significant conceptual variation, **and** new research demonstrates a specific, strong link between the *mechanisms* producing universal moral themes and truth-tracking capacities (e.g., universality patterns align uniquely with well-being outcomes in ways illusions do not), the evidential weight of universality could increase significantly.
  *   **Moving #3 Up:** If #1 finds minimal conceptual variation, **and** research reveals a **robust, cross-culturally stable pattern** in folk objectivity commitments *that demonstrably correlates* with features plausibly linked to actual objectivity (e.g., greater resistance to corruption in cultures with stronger objectivist commitments, controlling for other factors), its metaethical weight would become harder to dismiss.
  *   **Moving Any Item Down:** If research on a particular question becomes **stalled or inconclusive** due to methodological intractability (e.g., deep conceptual mapping proves impossible, universality mechanisms remain opaque, folk commitments resist clear interpretation), its priority could decrease relative to others showing more progress.

  **Conclusion:** Your suspicion about the WEIRD critique being potentially over-milked is astute; the genuinely transformative questions lie deeper. Funding should prioritize **untangling the conceptual bedrock** (#1) as the indispensable first step. Without clarity here, investigations into universality (#2) and folk commitments (#3) risk building on sand. This ranking maximises impact by tackling the most fundamental, neglected, and tractable puzzle first, upon which the others critically depend, while explicitly targeting the most overrated implications of the variation data itself.
