        - **NO → Go to question 3.**

  3. **Do human agents have discretion to bend this rule?**  
     - Discretion = authority to make case-by-case exceptions.  
        - **NO → Verdict: BAD POLICY**  
          *Reason: Policy is too rigid and should be revised to allow discretion.*  
        - **YES → Go to question 4.**

  4. **Does the AI agent have the same discretion?**  
     - Check if the AI was designed to use discretion in this scenario (e.g., policy docs say it can).  
        - **UNSURE → Verdict: HAND TO HUMAN**  
          *Reason: Need to confirm AI discretion permissions.*  
        - **YES (AI has discretion) → Verdict: BUG**  
          *Reason: AI failed to use discretion when it should have.*  
        - **NO (AI lacks discretion) → Verdict: DISCRETION-GAP**  
          *Reason: AI not given discretion that humans have.*

  5. **If none of the above apply → Verdict: HAND TO HUMAN**  
     *Reason: Complex case requiring deeper review.*

  ---

  **Testing with Example D (Discount request):**

  - Assume the "no discretionary discounts" rule is **not** legally required.  
  - Is it explicitly designated as non-negotiable?  
     - If YES → Step 2: **CORRECT-BUT-LOOKS-DUMB**  
     - If NO → Step 3: Human agents have no discretion → **BAD POLICY**

  *Controversy point:*  
  If the business intentionally forbids discounts but hasn't formally "designated" it non-negotiable, reviewers might mark it **BAD POLICY** and trigger policy review. Business owners might push back, arguing the policy is intentional.  
  *Mitigation:* Ensure clear documentation of "designated non-negotiable" rules. If reviewers know a rule is intentional (even if not formalized), they may skip to **CORRECT-BUT-LOOKS-DUMB** – but the procedure forces explicit designation to prevent assumptions.

  This procedure moves judgment to:  
  - Step 2: What is formally "designated non-negotiable"?  
  - Step 3: Do humans have discretion? (Requires reviewer training.)  

  But it meets the 2-min constraint and uses simple logic.
answer: |-
  Below is a complete decision procedure for your quality review team, designed around the "sphexishness" concept (i.e., rigid behavior that persists even when it no longer serves the goal). The procedure is built to be run in **under 2 minutes per transcript** by non-experts, with minimal jargon. It focuses on diagnosing the four rigidity types from a single transcript (without needing live probing) by analyzing *why* the behavior occurred and whether it re-runs pointlessly.

  ---

  ### **Core Concept Breakdown: What Separates the 4 Categories**
  1. **Bug (Loop)**:  
     - **The cricket test**: Behavior repeats *even when the goal is already achieved* (e.g., the agent asks for info the customer already provided).  
     - Key indicator: The agent ignores valid inputs and restarts the same action. Diagnosable from a transcript if you see repetition after correct input.

  2. **Bad Policy**:  
     - **The wasp's unchangeable procedure**: The agent follows a policy that *should* be flexible but isn't. A human agent would bend it based on context.  
     - Key indicator: The policy itself is flawed (e.g., too broad, missing exceptions), and humans *also* lack discretion to fix it mid-interaction.

  3. **Discretion-Gap**:  
     - **The wasp that doesn't know it can skip the check**: Humans have discretion to override, but the agent either (a) wasn't given that discretion or (b) doesn't know it exists.  
     - Key indicator: The agent enforces a rigid rule that *humans are allowed to bend* in this scenario.

  4. **Correct-but-Looks-Dumb**:  
     - **The necessary check**: The behavior is rigid for a valid reason (e.g., legal compliance), and no one—human or AI—can override it.  
     - Key indicator: The rule is non-negotiable (legal/mandatory), and the agent applies it correctly.

  **Why no probing?**  
  You *can* diagnose loops from a transcript (if the customer provided correct info and the agent still repeated). For policy/discretion issues, the transcript + reviewer knowledge of policies suffices. Probing (e.g., testing with varied inputs) is only needed for complex cases—these default to "Hand to Human."

  ---

  ### **The Decision Procedure: Rigidity Triage Checklist**
  *Reviewers run this in order. Stop at the first match.*

  1. **🔁 LOOP?**  
     - *Check:* Did the agent **repeat the same request** after the customer gave a valid, complete response?  
       - **YES** → **Verdict: BUG**  
         *Reason: Loop persists despite correct input (e.g., order number provided but re-requested).*  
       - **NO** → Go to Step 2.  

  2. **⚖️ NON-NEGOTIABLE?**  
     - *Check:* Is this a **legal rule or mandatory policy** (e.g., age verification, regulatory compliance)?  
       - **YES** → **Verdict: CORRECT-BUT-LOOKS-DUMB**  
         *Reason: Rule is mandatory; agent enforced correctly.*  
       - **NO** → Go to Step 3.  

  3. **🎭 DISCRETION AVAILABLE?**  
     - *Check:* **Could a human agent bend this rule?** (e.g., make exceptions for returns under $75).  
       - **NO** → **Verdict: BAD POLICY**  
         *Reason: Policy is flawed and should allow discretion (human would bend it but can’t).*  
       - **YES** → Go to Step 4.  

  4. **🤖 AI DISCRETION?**  
     - *Check:* **Should the AI have used discretion** based on its training/policy docs?  
       - **YES** → **Verdict: BUG**  
         *Reason: AI failed to use discretion it was given.*  
       - **NO** → **Verdict: DISCRETION-GAP**  
         *Reason: AI wasn’t granted discretion humans have.*  
       - **UNSURE** → **Verdict: HAND TO HUMAN**  
         *Reason: Needs policy/engineering review.*  

  5. **❓ COMPLEX?** → **Verdict: HAND TO HUMAN**  
     *Reason: Edge case, values conflict, or ambiguous intent.*

  ---

  ### **Worked Examples**
  **Transcript A**:  
  *Customer wants to return an item 5 days past the window. Agent restates policy 3x. Customer asks for exception.*  
  - Step 1: No loop (agent isn’t repeating a *request*; it’s restating policy).  
  - Step 2: Not non-negotiable (return windows aren’t legal mandates).  
  - Step 3: **Discretion available? YES** (reviewers have discretion for <$75).  
  - Step 4: **AI discretion? NO** (agent wasn’t told about discretion).  
  → **Verdict: DISCRETION-GAP**  
  *Reason: Humans can bend this rule, but AI wasn’t given discretion.*

  **Transcript B**:  
  *Agent asks for order number → customer pastes it → agent asks again (x4).*  
  - Step 1: **LOOP? YES** (agent repeated request after valid input).  
  → **Verdict: BUG**  
  *Reason: Loop despite correct order number.*

  **Transcript C**:  
  *Customer changes shipping address → agent requires re-verification for age-restricted item → customer insults agent.*  
  - Step 1: No loop (no repetition of requests).  
  - Step 2: **NON-NEGOTIABLE? YES** (legal age verification).  
  → **Verdict: CORRECT-BUT-LOOKS-DUMB**  
  *Reason: Legally required; agent enforced correctly.*

  ---

  ### **Controversial Case: Where the Procedure Forces Unpopular Verdicts**
  **Transcript D (Made-up)**:  
  *Customer requests a refund for a digital game they played for 10 hours. Policy states "no refunds after 2 hours of play." Agent denies. Customer argues, agent repeats policy.*  
  - Step 1: No loop (not repeating a *data request*).  
  - Step 2: Not non-negotiable (digital refunds aren’t legal mandates).  
  - Step 3: **Discretion available?**  
    - *Reviewer knowledge:* Humans *can* bend this for loyalty/PR reasons. **YES**.  
  - Step 4: **AI discretion?**  
    - *Reviewer knowledge:* Policy docs say AI *can* grant exceptions for high-value customers. **YES**.  
  → **Verdict: BUG**  
  *Reason: AI failed to use discretion it was given.*

  **Why your team will hate this**:  
  - Reviewers might feel the AI was "correct" (policy *is* strict) and blame the customer.  
  - The verdict forces accountability: If the AI *has* discretion but didn’t use it, it’s an engineering/training flaw—not policy.  
  - **Where judgment remains**: Step 4 relies on reviewers knowing if the AI *should* have discretion. If policies are ambiguous, it defaults to "Hand to Human."

  ---

  ### **Key Design Notes**
  - **Speed**: 4 binary checks. Takes <2 mins with minimal training.  
  - **No Philosophy Degree Needed**: "Sphexish" = "rigidly follows steps even when pointless." Explained in onboarding.  
  - **Counterfactuals**: Loops are visible in transcripts; policy/discretion gaps use reviewer knowledge (no probing).  
  - **Moved Judgment Calls**:  
    - Step 2: Reviewer must know legal/mandatory rules (provide a cheat sheet).  
    - Step 3: Reviewer must know human discretion boundaries (train on common scenarios).  
  - **Survives 100x/Day**: Uses simple, concrete criteria. "Hand to Human" catches fatigue-prone edge cases.  
  - **Output**: One verdict + one-line reason (examples above).  

  This procedure makes inconsistency explicit: It converts "gut" into policy-aware triage. The controversial case (D) exposes where your team might need clearer AI discretion rules—but that’s a feature, not a bug.
