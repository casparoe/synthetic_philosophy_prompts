prompt: |-
  Before I turn my undergraduate seminar loose on the primary literature on dreaming, I want to walk in with a specification rather than a survey. The course is built around a deceptively simple question — are dreams experiences that sleepers have while asleep? — and I have become convinced that the standard positions in that debate each quietly measure themselves against a different list of requirements. So what I want from you is the list itself: what any adequate theory of dreaming has to deliver. I would expect it to include, at minimum, some account of the evidential standing of dream reports (which are, after all, our only window onto the phenomena), consistency with what the sleep laboratories tell us about REM and NREM sleep and the physiological timing of dream onset, some treatment of the temporality of dreams (the dream that seems to have lasted for hours, reported by a subject woken from a stage of sleep that lasted minutes), a principled answer to what lucid dreaming and the eye-movement signaling experiments do to the older orthodoxy that the sleeper is never aware of dreaming, and a position on how the theory feeds into the Cartesian use of dreams as a skeptical scenario. But I am handing you that list as raw material, not as settled — part of what I want is a judgment about which of the demands people actually make on theories of dreaming are genuine desiderata and which are prejudices of one camp dressed up as requirements. Malcolm's verificationist insistence that dream reports are absolutely incorrigible, for instance, looks less like a neutral constraint and more like a philosopher's theory of meaning doing all the work, and I would want you to say so if you agree, or defend its status as a requirement if you do not.

  For each desideratum, give the motivating case — the phenomenon, the datum, or the philosophical payoff that makes it non-negotiable — and mark clearly which requirements you take to be joint satisfiable and which, if any, cannot be satisfied together. If there is a subset of the list that no theory could meet simultaneously, say so plainly, because that result would matter more to my seminar than any scoring of the contenders. In particular, I want you to consider whether the demand that a theory respect the phenomenology of dream temporality can coexist with the demand that it be consistent with the physiological data, or whether the apparent conflict there is an artifact of assuming a naive picture of how dream content is represented in memory. Relatedly: should a theory of dreaming have to explain why dream reports are so strikingly less stable than waking reports — why subjects interviewed hours later remember differently than they did minutes after waking — or is that a question about memory, properly speaking, that a theory of dreaming can legitimately outsource? I am honestly unsure whether that is a desideratum or a boundary-drawing issue, and I would like your view.

  Finally, and only briefly — the criteria are the part I care about, since I will do the scoring in class — run three contenders against the list: the received view that dreams are experiences had during sleep and reported on waking; Malcolm's view that the very idea of experiences during dreamless sleep fails to make sense; and Dennett's proposal that dream content is composed and loaded into memory in the moments around waking rather than experienced in real time. I am less interested in which of them wins than in which single desideratum does the most to exclude candidates, and whether the requirement that does the most work is one that any theory was entitled to impose in the first place. If, as I half suspect, the list cannot be completed without already taking a side on the experience question, tell me that too — a specification that presupposes its own answer would be worth knowing about before my students inherit it as if it were neutral ground.
reasoning: |-
  Hmm, this is a fascinating and complex request about dream theory specifications. The user is preparing an undergraduate seminar on whether dreams are experiences during sleep, and wants a rigorous framework for evaluating theories rather than a survey. They've shared their preliminary list but want it critically examined.

  First, I need to unpack their layered request. They want:
  - A list of core requirements for any adequate dream theory
  - Each requirement justified by its "non-negotiable" motivation
  - Marked for compatibility between requirements
  - Identification of any irreconcilable conflicts
  - Special attention to the tension between phenomenological temporality and physiological timing
  - Analysis of whether dream report instability belongs in dream theory
  - Brief application to three theories (received view, Malcolm, Dennett)
  - Focus on which requirement excludes most candidates
  - Crucially, whether the framework presupposes an answer to the central question

  Looking at their raw material, several key tensions emerge. The REM/NREM physiology requirement seems essential because lab data shows dream recall across sleep stages, but this clashes with Malcolm's verificationism which denies retrospective reports can verify sleep experiences. The temporality puzzle (subjective duration vs objective sleep time) might be resolvable if we consider how dreams construct narrative retrospectively - perhaps this isn't a true conflict but a misunderstanding of dream representation.

  The report instability issue is tricky. While memory factors are involved, the specific pattern of dream report degradation seems unique enough that dream theories should address it - maybe through how dream content is encoded during sleep-wake transitions. This feels like a boundary case where interdisciplinary work is needed.

  For the three theories:
  - The received view handles report phenomenology well but stumbles on temporality and report instability
  - Malcolm's view is ruthlessly consistent philosophically but violates basic empirical findings
  - Dennett's cassette theory elegantly solves temporality and report issues but feels counterintuitive to lived experience

  The real killer requirement seems to be physiological consistency - it immediately excludes Malcolm and challenges Dennett. But is this requirement biased? Only if we privilege neuroscience over phenomenology, which itself needs justification. The Cartesian skepticism angle reveals deeper stakes: if dreams aren't experiences, the skeptical threat weakens, but Malcolm achieves this through such radical means it undermines the whole discourse.

  Most importantly, the framework might be secretly circular. Any requirement about dream reports being evidence already assumes they report something, which Malcolm denies. So yes, the specification subtly presupposes dreams are experiences. This is crucial for the seminar to confront head-on rather than inherit covertly.
answer: |-
  Here is a specification of desiderata for theories of dreaming, structured to meet your requirements. The list prioritizes genuine conceptual constraints over partisan assumptions, identifies tensions, and evaluates core theories against the criteria. Key conflicts center on phenomenology vs. physiology and the ontological status of dream experiences.

  ---

  ### **Core Desiderata for Theories of Dreaming**  
  *(✓ = Jointly satisfiable; ⚠ = Tension requiring careful resolution; ✗ = Mutually exclusive demands)*  

  1. **Empirical Accountability to Sleep Science**  
     - **Motivation**: Lab data shows dream recall from both REM (80-90%) and NREM (15-50%) sleep, with distinct physiological markers (e.g., eye movements, EEG patterns). Theories must explain this distribution without dismissing robust evidence.  
     - **Status**: ✓ (Compatible with other desiderata if temporality/report mechanisms are addressed).  

  2. **Explanation of Dream Report Evidential Status**  
     - **Motivation**: Reports are our sole access to dreams but are unstable (content degrades rapidly post-awakening) and sometimes implausible. A theory must clarify their epistemic role: are they *reports of experiences* or *constructive narratives*?  
     - **Status**: ✓ (But stability issues may challenge theories emphasizing real-time experience).  

  3. **Temporality Reconciliation**  
     - **Motivation**: Subjective dream duration (e.g., "hours-long" dreams in brief NREM episodes) conflicts with clock-time sleep stages. A theory must resolve this without denying either phenomenology or physiology.  
     - **Status**: ⚠ (Direct conflict with naive realism about dream time; resolvable via representational mechanisms).  

  4. **Incorporation of Lucid Dreaming**  
     - **Motivation**: Lucid dreamers exhibit volitional eye-movement signaling during REM, proving meta-awareness *during* sleep. This falsifies the orthodox "no awareness of dreaming" claim.  
     - **Status**: ✓ (Non-negotiable; empirically verified).  

  5. **Treatment of Cartesian Skepticism**  
     - **Motivation**: Dreams challenge perception/reality distinctions. A theory should clarify whether dreams are *experiential* enough to fuel skepticism (e.g., if dreams are experiences, skepticism gains traction).  
     - **Status**: ✓ (But contingent on the theory’s stance on dream experience).  

  6. **Report Instability**  
     - **Motivation**: Dream reports change more dramatically than waking memories within minutes/hours (e.g., forgotten characters, altered plots). A theory must address whether this stems from *encoding during sleep* or *post-awakening memory processes*.  
     - **Status**: ⚠ (Boundary issue: Theories positing real-time experience *must* explain encoding fragility; others may outsource to memory science).  

  ---

  ### **Key Tensions & Incompatibilities**  
  - **The Temporeality-Physiology Conflict (Desiderata 1 & 3)**:  
    Naive realism about dream time ("dreams unfold in real-time") is incompatible with physiological data. However, this is **resolvable**: Accept that dream temporality is a *constructed representation* (e.g., compressed or distorted during encoding/recall), not a direct reflection of neural processes. Thus, no fundamental incompatibility.  

  - **The Malcolm Problem (Desideratum 2)**:  
    Malcolm’s verificationism (dream reports are incorrigible but cannot reference sleep experiences) **creates artificial incompatibilities**. It violates Desideratum 1 (ignores sleep science) and 4 (rejects lucid signaling as evidence). **Diagnosis**: This is a philosophical prejudice, not a genuine constraint.  

  - **Report Stability (Desideratum 6) is a Legitimate Desideratum**:  
    Dream-specific instability (e.g., rapid narrative fragmentation) differs from typical memory decay. A theory of dreaming should explain *why* dreams are uniquely vulnerable—likely due to sleep-dependent encoding limitations. Not merely a memory issue.  

  ---

  ### **Evaluating Contenders Against Desiderata**  
  *(✓ = Satisfied; ✗ = Violated; ~ = Partially/Contentiously Satisfied)*  

  | **Desideratum**          | **Received View** (Dreams = Experiences During Sleep) | **Malcolm** (No Experiences During Sleep) | **Dennett** ("Cassette Theory": Post-Hoc Composition) |  
  |--------------------------|------------------------------------------------------|------------------------------------------|------------------------------------------------------|  
  | 1. Sleep Science Consistency | ✓ (Fits REM/NREM data)                              | ✗ (Denies dreams occur *during* sleep)   | ~ (Fits physiology but reinterprets timing)          |  
  | 2. Report Evidentiality     | ~ (Reports = memories of experiences; struggles with instability) | ✗ (Reports = linguistic acts; no connection to sleep) | ✓ (Reports = post-awakening constructions)           |  
  | 3. Temporality              | ✗ (Cannot explain time compression)                  | ✓ (Irrelevant; no experience to time)    | ✓ (Explains via narrative composition at wake-up)    |  
  | 4. Lucid Dreaming           | ✓ (Meta-awareness during sleep)                      | ✗ (Rejects signaling as evidence)        | ✗ (Lucidity as wake-up artifact?)                    |  
  | 5. Cartesian Skepticism     | ✓ (Dreams as immersive experiences aid skepticism)   | ✗ (Dreams not experiences; weakens skepticism) | ~ (Skepticism undermined if dreams aren’t real-time) |  
  | 6. Report Instability       | ✗ (No inherent explanation for fragility)            | ✓ (Irrelevant)                           | ✓ (Predicts instability via construction process)    |  

  ---

  ### **Critical Analysis**  
  - **Most Exclusionary Desideratum**: **Sleep Science Consistency (1)**. It immediately excludes Malcolm and pressures Dennett. This requirement is **justified**—it reflects non-negotiable empirical facts. Rejecting it would require denying decades of reproducible lab data.  
  - **The Hidden Bias**: Desideratum 2 (Report Evidentiality) **presupposes an answer to the experience question**. Framing reports as "about" *anything* (experiences, memories, or constructions) assumes dreams are reportable phenomena. Malcolm exploits this by severing the report-sleep link, but his move is ad hoc. **Conclusion**: A genuinely neutral specification must accept reports as *evidence* (however interpreted) but not pre-judge *what they evidence*.  
  - **Dennett’s Advantage**: Best satisfies temporality (3) and report instability (6) by treating dreams as narratives assembled at wake-up. But it stumbles on lucid dreaming (4)—subjects signal *while* in REM—and feels counterintuitive to phenomenology.  
  - **The Received View’s Burden**: Struggles with temporality (3) and instability (6), revealing its core weakness: it lacks a mechanism for *how* experiences are encoded/fragmented.  

  ---

  ### **Conclusion**  
  - **No theory satisfies all desiderata**. The Received View fails on temporality/stability; Malcolm violates science; Dennett struggles with lucidity.  
  - **The experience question cannot be neutrally presupposed**: Framing reports as "windows onto phenomena" subtly assumes experiences occur. A truly neutral specification must treat reports as *data* while leaving their ontological status open.  
  - **Recommendation for Seminar**: Present the desiderata *without* pre-committing to reports as "memories of experiences." Let students debate whether instability, temporality, or science is the decisive constraint. Highlight that **Desideratum 1 (science) is the strongest gatekeeper**, while **Desideratum 3 (temporality) is the most revealing of theoretical ingenuity**.  

  This framework ensures your seminar engages the *structure* of the debate—exposing how theories succeed or fail by prioritizing different clusters of demands—rather than inheriting hidden assumptions.
