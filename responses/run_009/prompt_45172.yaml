prompt: |-
  At my philosophy-of-medicine reading group, a colleague argued that Boorse-style naturalism about disease refutes itself, and I can't find where it slips. His argument: (1) On the naturalist view, a condition is a disease only if it involves a part functioning below the level statistically typical for the relevant reference class — members of the same species, sex, and age. (2) What counts as typical is fixed by current frequencies in that class: if most members have the condition, then for them it is typical. (3) Frequencies vary sharply by population — myopia already affects the large majority of young adults in some East Asian cohorts, and presbyopia is close to universal past fifty. (4) So in those populations myopia and presbyopia are not diseases, and diagnosing them there is a misclassification. (5) Worse, a treatment program successful enough to push a disease's prevalence below the threshold would erase the diagnosis while the patients kept the condition. My colleague concludes that "typical" must really mean some level of functioning organisms are supposed to reach — a design notion that naturalism promised to do without. I came in sympathetic to naturalism and would rather keep (1) than accept (4), but I want a genuine diagnosis, not a rescue: which step should I reject, and what does rejecting it cost? Please answer in American English.
reasoning: |-
  Okay, the user is part of a philosophy-of-medicine reading group and their colleague presented an argument against Boorse-style naturalism about disease. The argument claims that naturalism refutes itself because it relies on statistical typicality, which leads to counterintuitive conclusions when conditions become prevalent in certain populations. For example, myopia in East Asia or presbyopia in older adults wouldn't be considered diseases if they're common enough, and successful treatment could paradoxically make the condition a disease again by reducing prevalence.

  The user wants to identify where the argument goes wrong without merely rescuing naturalism. They're sympathetic to naturalism but want an honest diagnosis of the flaw. They're looking for which step to reject and the cost of that rejection.

  The key points in the colleague's argument are:
  1. Disease requires subtypical function.
  2. Typical is defined by current frequencies.
  3. Frequencies vary by population.
  4. Therefore, common conditions aren't diseases in high-prevalence groups.
  5. Successful treatment could make a condition a disease again.

  The user wants to reject a specific step but needs to understand the implications. The colleague suggests that "typical" must imply a design norm, which naturalism rejects.

  I recall that Boorse actually addresses this by distinguishing between statistical typicality and functional design. He argues that the reference class isn't just any statistical group but one defined by age, sex, and species, and that function is tied to survival and reproduction. So high prevalence doesn't make a condition typical if it's still dysfunctional for survival.

  The flaw is in step 2. Typical isn't just current frequencies; it's about the functional design of the organism. Boorse uses the analogy of heart function: pumping blood is the function regardless of how common heart failure is. So myopia is still a dysfunction because eyes are designed for clear vision, even if many people have myopia.

  Rejecting step 2 means that typical function is normative in a biological sense, not just statistical. The cost is that it introduces a "design" concept, which naturalism tries to avoid. Boorse argues it's not value-laden design but an empirical biological norm. Critics might say this is still normative.

  The user should reject step 2. The cost is accepting a biological norm of function, which critics might argue sneaks in teleology. But Boorse maintains it's scientifically sound. This preserves naturalism but at the cost of defending biological functions as objective.
answer: |-
  Here's the genuine diagnosis of where your colleague's argument slips, with the cost of rejecting that step laid out plainly:

  **The flaw is in Step 2: "What counts as typical is fixed *solely* by current frequencies in that class."**

  Boorse-style naturalism **does not** define "statistically typical function" *only* as "whatever the current majority happens to have." It defines "typical function" relative to the **species-typical biological design** (or "functional organization") that supports survival and reproduction. Prevalence is a *tool* for *discovering* what that typical function level *is*, but it's not the *definition*.

  1.  **Rejecting Step 2 Explained:**
      *   Boorse argues that biological functions are contributions to survival/reproduction within the context of the species' typical structural and functional design. "Statistically typical" refers to the *normal functional efficiency* exhibited by members of the reference class *who are not suffering from pathology*.
      *   High prevalence of a *dysfunction* doesn't magically redefine that dysfunction as normal function. It just means *many individuals are dysfunctional*. A high rate of cavities doesn't make tooth decay the normal, healthy function of teeth. A high rate of heart failure doesn't make inefficient pumping the normal function of the heart.
      *   In the case of myopia: The biological function of the eye's optical system is to focus light accurately on the retina for clear vision. Myopia represents a *failure* of that system to perform at the level typical for the species' design. That most young adults in an East Asian cohort have myopia doesn't mean the typical, healthy eye *is designed* to be myopic. It means *pathology is widespread*. The statistical norm used by Boorse isn't the *raw prevalence* of the *condition*, but the *level of functional performance* observed in the *non-diseased* segment of the reference class, which is inferred to be the species-typical level.
      *   For presbyopia: This is explicitly tied to *age*. The reference class is segmented by age precisely because biological function *declines* with age as part of the species-typical design. Presbyopia *is* statistically typical for humans over 50, but Boorse accepts that certain age-related declines, while statistically typical *for that age group*, can still be considered diseases *if they represent a significant functional impairment relative to younger, healthier function* (he grapples with aging specifically). However, its near-universality doesn't automatically make it *normal function*; it makes it a near-universal *age-related dysfunction*. Naturalism struggles more with aging than with myopia.

  **The Cost of Rejecting Step 2:**

  1.  **Accepting a Biological "Design" Notion:** This is the big one, and your colleague nailed it as the implication. To reject Step 2, you *must* accept that "typical function" relies on a concept of the species-typical biological *design* or *functional organization* – what the parts are *for* (survival/reproduction) and how they *normally* work when not broken. Boorse calls this "species-typical functional organization" and insists it's a *value-free*, empirically discoverable biological fact, not a value judgment about how things *ought* to be.
  2.  **Distinguishing Prevalence from Function:** You have to clearly separate the *statistical frequency* of a condition from the *biological function* of the part. Prevalence tells you how common a state *is*, not whether that state represents optimal or even typical *function*. You need objective criteria (grounded in physiology, evolutionary biology) to define what the function *is* before you can call a deviation a dysfunction.
  3.  **Handling Universal Conditions:** If a dysfunction truly became universal *across all ages* (e.g., if everyone was born myopic), then *by definition*, there would be no non-diseased reference class to establish the "typical function" level. Naturalism would struggle to call it a disease *in this hypothetical scenario*. However, this isn't the case for myopia or presbyopia. There are still non-myopic individuals, and presbyopia isn't universal at birth or in youth. The existence of non-diseased individuals (especially younger ones for age-related issues) anchors the functional norm.
  4.  **Addressing the Treatment Paradox:** Successful treatment reducing prevalence doesn't "erase" the diagnosis for existing patients. Their *individual* biological function is still subtypical relative to the species design. The *classification* of the condition as a disease is based on the *underlying dysfunction*, not the current population prevalence *at the moment*. If treatment became universal and the dysfunction was eradicated, it would cease to be a disease simply because it wouldn't exist. If treatment failed for some, their condition would still be a disease, even if rare. Prevalence is a clue for *discovery*, not the *essence*.

  **Conclusion for Your Group:** Your colleague's argument stumbles by conflating *statistical prevalence* with *statistically typical function*. Step 2 misrepresents Boorse. Rejecting Step 2 means embracing the idea that "typical function" is grounded in the empirically observable, species-typical biological design that supports survival and reproduction. The cost is explicitly accepting this biological "design" concept, which critics argue smuggles in a kind of normativity naturalism claims to avoid. Boorse insists it's purely scientific. Whether this cost is acceptable or a fatal flaw is the real debate – but the argument as presented fails because Step 2 isn't actually part of a consistent Boorsean view. You can keep (1) and reject (4) by correctly understanding that "statistically typical" refers to the functional capacity of the *healthy* reference class, not the raw prevalence of a condition.
