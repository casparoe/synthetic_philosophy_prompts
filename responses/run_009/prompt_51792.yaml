prompt: |-
  I'm a third-year undergraduate in a seminar on conditionals (philosophy of language track), and I need to submit a two-page term-paper proposal by Friday for a paper of about 6000 words due at the end of the semester. I have a half-formed idea I'd like you to turn into a proper proposal, because right now it's more of an itch than a question.

  Here is the itch. In class we covered the probabilistic approach to indicative conditionals: the claim that the probability of "if A, then B" is the conditional probability of B given A, and the betting-style justification for it, under which a bet on the conditional is supposed to be settleable once you learn whether A and whether B -- with the bet being called off when A turns out false. What struck me is that this whole justification seems to lean on something that indicatives have and counterfactuals lack: the possibility of eventually learning the truth of the antecedent. A counterfactual's antecedent is already known false; nobody will ever observe the closest world where the coin landed heads. So the machinery that makes sense of probabilities for indicatives appears to go silent exactly where counterfactual probabilities are asked for -- and yet we do seem to assign rough probabilities to counterfactuals, or at least we argue about them ("there's a good chance she would have won the primary").

  So the question I want the paper to address is something like: can the probabilistic treatment of conditionals be extended to counterfactuals, and if the betting justification does not transfer, is there some substitute justification -- for instance one in terms of how the bets would be settled by evidence about the actual world rather than by observation of A -- or does the failure reveal that so-called probabilities of counterfactuals are some other kind of quantity wearing that label?

  In the proposal, please state the question precisely enough that it has a determinate answer, explain why the standard positions leave it open, sketch a method I could actually execute in one semester (I can do some elementary probability but I am not a logician), lay out the two or three possible conclusions and what would decide among them, and be honest about what could make the project collapse -- in particular I worry the literature on the triviality results will swallow the whole paper, and I'd like to know whether to wall that off in a section or avoid it entirely.

  Two requests about how you write it. First, throughout the proposal please keep separate what is settled among people who work on conditionals and what is genuinely contested -- for instance, whether indicative and counterfactual conditionals have a unified semantics is a live dispute, not background fact, and I don't want the proposal to smuggle in a contested view as consensus. Second, please write it as continuous prose only, no headings, bullet points, bold text, or tables -- my professor wants the proposal to read like a letter making a case, and I'd rather practice that now than reformat later. Don't include citations or a bibliography; I'll add the references myself, and I'd rather you not name specific papers, just positions and argument shapes, so I can't accidentally attribute an argument to the wrong person.
