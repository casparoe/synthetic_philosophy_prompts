  (1) and (4) also clash. (4)'s symmetry requirement is itself a value choice - why is symmetry the correct value? The cheapest revision is to acknowledge symmetry as a practical heuristic rather than fundamental principle.

  (1) and (5) - here (5) claims low-impact leads to corrigibility, but (1) implies corrigibility might require more nuanced values. Revision: position (5) as probable but not guaranteed.

  (2) and (3): (2) praises existing measures, but (3) specifies a baseline not universally adopted. Since some proposed measures use different baselines, this suggests (3) is critiquing status quo. Revision: clarify that (3) improves existing measures.

  (2) and (4) - existing measures aren't always symmetric (e.g., some allow "improvements"). So (4) is pushing beyond current practice. Revision: frame (4) as desirable evolution of the measures (2) praises.

  (2) and (5) - no direct conflict. (2) says measures block side effects, (5) says they aid corrigibility - complementary benefits.

