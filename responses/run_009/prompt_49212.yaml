prompt: |-
  You are a professional philosopher of biology with a strong background in the definitional debate about life, and I need your help building a diagnostic instrument rather than an explainer. I write a small blog read by a mixed audience of astrobiologists, origin-of-life chemists, and curious laypeople, and I want to run a "which definition of life do you actually hold?" quiz. My readers have all read the usual pop-science line that "biologists can't agree on what life is," but the quiz's whole point is to show that people who say "life is just chemistry that maintains itself" and people who say "life is anything that evolves" are not vaguely disagreeing — they come apart cleanly on specific cases, and so does everyone else in the debate.

  Please write eight to ten questions, each presenting one concrete case with two or three answer options. The cases must be ones where the major candidate definitions genuinely diverge, and I'd like you to draw them from a spread that includes: a viable but dormant seed frozen for a decade; a worker ant (metabolizing but sterile); a mule; a virus; a prion; a self-replicating factory on the Moon assembled by robots from lunar regolith; a population of digital organisms in a simulation that mutate and undergo selection; and at least one case that clearly fails on every definition yet is engineered to tempt a "yes" answer (a candle flame or a hurricane is the classic bait for thermodynamic views, but feel free to do better). Phrase every question so a reader can answer it without knowing which school it is testing — the option labels should describe what the case is doing ("counts as alive, but only marginally," "alive the way a kidney cell is alive, not a free-living thing," etc.), never name the theory.

  Then provide a scoring key that maps answer patterns onto the positions: NASA-style evolutionary definitions ("a self-sustaining chemical system capable of Darwinian evolution"), Schrödinger-style thermodynamic or far-from-equilibrium accounts, autopoiesis and organism-first views, the gray-area or cluster-concept family in which "life" admits of degrees, and the deflationary position that "life" is a folk leftover that biology could discard as it discarded "monster" or "vital force." Before drafting the questions, please reason explicitly about the logical space: which pair of answers would jointly rule out every major position, which combinations no real theorist occupies, and whether that is because the combination is incoherent, unattractive, or just unexplored — and say so in the key. Please also flag honestly any pair of positions your instrument cannot separate with these cases (I suspect autopoiesis and some organism-first views will be hard to pry apart with any question short of a genuinely borderline one) rather than pretending the quiz distinguishes them.
reasoning: |-
  Okay, the user wants me to create a diagnostic quiz about definitions of life for their blog audience. They need questions that reveal how different philosophical positions diverge on concrete cases, not just explain the theories. 

  First, I need to consider the core conflict points in life definition debates. The major fault lines are: autonomy vs. evolution, reproduction necessity, and whether life is binary or gradient. Cases must probe these tensions cleanly. 

  For the dormant seed case, it tests whether metabolism continuity matters more than current activity. Thermodynamic views might say it's alive because the system is intact, while strict evolutionary views could argue it's not currently evolving. 

  The worker ant is perfect for probing autonomy vs. reproduction. Autopoiesis cares about metabolic self-maintenance, so the ant counts. But reproduction-essentialists would exclude it as a "dead end." 

  Mules attack the reproduction requirement directly. Those who insist on individual reproductive capability will exclude it, while population-level thinkers might include it as part of a reproducing system. 

  Viruses and prions separate information-based views from metabolic ones. NASA's definition includes viruses because they evolve, but autopoiesis excludes them for lacking metabolism. 

  The lunar factory tests whether "chemical" is essential. NASA's definition requires chemical systems, so digital life wouldn't count, but evolutionary accounts without that constraint would include it. 

  Digital organisms are crucial for the matter vs. process debate. If life is defined by evolutionary dynamics, they should be alive regardless of substrate. Thermodynamic views would exclude them. 

  For the "false positive" case, I'm considering a protein folding simulation. It has metabolism-like energy use and complexity, but no evolution or self-containment. It tempts thermodynamic views but fails all definitions. 

  Scoring needs to account for positions that overlap on cases like autopoiesis and organism-first views. I'll note where the quiz can't distinguish them honestly. The key must map answer patterns to: NASA evolutionary, thermodynamic, autopoiesis, cluster concept, and deflationary views. 

  I'll ensure no question names theories - options describe behaviors like "counts as alive but marginally." Each case must have clean divergence points where at least two major positions split. The hurricane/candle flame trope is too cliché; engineered molecular systems make better bait. 

  Finally, I'll specify which answer combinations are impossible (like accepting both mules and worker ants as non-living while rejecting viruses) because that would contradict all major theories. The deflationary view will be identifiable by consistently calling everything "not alive" or "just metaphorically alive."
answer: |-
  Here's a diagnostic instrument designed to cleanly separate the major positions in the definition-of-life debate through concrete cases. Each question forces a choice revealing underlying theoretical commitments, avoiding theory labels in the options.

  **Reasoning About Logical Space:**

  1.  **Core Tensions:** The quiz probes three primary fault lines:
      *   **Autonomy vs. Evolution:** Is self-maintenance (metabolism, homeostasis, autopoiesis) essential, or is evolution (variation, heredity, selection) sufficient?
      *   **Reproduction Requirement:** Is the *potential* for reproduction necessary? Is *individual* reproduction required, or is belonging to a *lineage* sufficient?
      *   **Binary vs. Gradient:** Is "alive" a yes/no category, or is it a matter of degree?
      *   **Substrate Dependence:** Must life be chemical? Is embodied organization essential?
      *   **"Folk" Intuitions:** How much do common-sense intuitions (movement, growth, complexity) weigh vs. strict theoretical criteria?

  2.  **Key Divergences & Combinations:**
      *   **Worker Ant vs. Mule:** Autopoiesis/organicism accepts both as alive (metabolizing organisms). Strict evolutionary views reject both (no individual reproductive potential). NASA-like views might accept the ant (as part of a reproducing *system*) but reject the mule (dead-end lineage). Cluster views might see both as "marginally alive" or alive *as parts*.
      *   **Seed vs. Prion:** Thermodynamic views strongly favor the seed (intact, poised system) over the prion (no inherent metabolic control). Autopoiesis strongly favors seed, rejects prion. Evolutionary views reject dormant seed (not currently evolving), might accept prion (if seen as part of an evolving system).
      *   **Virus vs. Digital Organism:** Evolutionary views accept both. Autopoiesis rejects both. NASA-like views accept virus (chemical system evolving) but reject digital (non-chemical). Thermodynamic views reject both.
      *   **Lunar Factory:** Primarily tests NASA's "chemical system" requirement vs. broader evolutionary/system views. Autopoiesis rejects (not autonomous/organismic).
      *   **False Positive:** Designed to tempt thermodynamic (energy dissipation, structure) and possibly autopoietic (self-maintaining boundary?) intuitions but fails reproduction, evolution, and true autonomy.
      *   **Incoherent/Unoccupied Combinations:** Accepting the *mule* as alive while rejecting the *worker ant* is incoherent (the ant is metabolically active, the mule is sterile but metabolizing). Rejecting the *seed* while accepting the *prion* is highly unattractive/rare. Accepting the *false positive* while rejecting the *digital organism* is inconsistent for evolutionary views. Consistently calling *everything* "not alive" maps cleanly to deflationism.
      *   **Hard to Separate:** Autopoiesis and strong organism-first views (e.g., John Dupré) will largely overlap on answers, differing more in philosophical framing than operational diagnosis here. Cluster concepts and certain "system" evolutionary views (focusing on lineages) might also overlap significantly on the seed/ant/mule cases.

  ---

  **The Quiz: Which Definition of Life Do You *Actually* Hold?**

  *For each scenario, select the answer that best reflects your intuition about whether the entity is "alive" or how it relates to life.*

  1.  **A viable wheat seed, frozen in permafrost for 10,000 years, perfectly preserved but completely inactive.**
      A) Not alive now; it's dormant but retains the *potential* for life.
      B) Alive; it's a paused but intact living system.
      C) Not meaningfully "alive" or "dead" in itself; it only becomes significant within a life cycle.

  2.  **A sterile worker ant in a colony. It eats, moves, repairs itself, responds to the environment, and works for the colony, but cannot reproduce.**
      A) Alive; it's clearly metabolizing and functioning as an organism.
      B) Not fully alive; it's a disposable part of the *colony*, which is the real evolving unit.
      C) Not alive; it lacks the fundamental capacity for independent reproduction.

  3.  **A healthy mule (sterile hybrid offspring of a horse and donkey). It eats, moves, thinks, heals, but cannot produce offspring.**
      A) Alive; it's a functioning, metabolizing organism.
      B) Marginally alive; it's an organism but a dead end for its lineage.
      C) Not alive; it lacks the fundamental capacity for reproduction.

  4.  **An influenza virus particle (virion) outside a host cell.**
      A) Not alive; it's inert chemicals, lacking metabolism and independent activity.
      B) Alive; it carries genetic information and evolves via replication in hosts.
      C) Not a distinct living thing; it's a component or product of the host cell's life, or a parasitic replicator.

  5.  **A misfolded prion protein that causes other proteins to misfold in a chain reaction within a brain.**
      A) Not alive; it's just a destructive chemical crystal, lacking any information or control.
      B) Alive; it replicates its structure and evolves (develops strains) within the host environment.
      C) Not a living entity; it's a pathological *process* happening within a living system.

  6.  **A self-replicating factory complex on the Moon. Built by robots, it mines lunar regolith, processes materials, and constructs exact copies of itself (including robots) without external control.**
      A) Alive; it's a self-sustaining, replicating system capable of open-ended evolution.
      B) Not alive; it's a sophisticated machine, lacking the inherent chemical basis or autonomy of life.
      C) Alive, but in a fundamentally different way than biological life; perhaps "technological life."

  7.  **A population of self-replicating computer programs ("digital organisms") in a simulated world. They mutate, compete for CPU cycles (resources), and undergo natural selection over generations.**
      A) Alive; evolution by natural selection is the core of life, regardless of substrate.
      B) Not alive; they are abstract simulations lacking physical embodiment, metabolism, or true chemistry.
      C) "Alive" in a metaphorical sense only; they model life but aren't truly living.

  8.  **A complex, self-sustaining molecular assembly inside a lab reactor. It maintains a stable internal environment distinct from the surrounding fluid by continuously pumping specific ions using externally supplied ATP. It grows by incorporating similar molecules floating nearby, and splits roughly in half when it gets too large. However, its structure is fixed; it cannot change, adapt, or evolve - every "daughter" assembly is identical.**
      A) Alive; it maintains itself, grows, and replicates, exhibiting core lifelike functions.
      B) Not alive; while complex, it lacks the capacity for evolution or adaptation – it's just a fancy chemical clockwork.
      C) A fascinating proto-life system, but not yet truly "alive."

  9.  **A naturally occurring, short-lived, self-sustaining vortex in a turbulent fluid (like a dust devil or a whirlpool). It maintains its structure by dissipating energy from the flow, incorporates nearby material, and "reproduces" when it splits under stress, though the "daughters" are unstable and chaotic.**
      A) Shows lifelike properties (self-organization, energy dissipation); it's a simple form of life.
      B) Not alive; it's just physics – structure imposed by energy flow, lacking information, control, or evolution.
      C) A dynamic non-equilibrium structure, illustrating principles relevant to life's origins, but not alive itself.

  ---

  **Scoring Key: Mapping Your Answers to Philosophical Positions**

  *   **Important Caveats:**
      *   Real-world theorists often have nuanced views; this maps to *idealized core commitments*.
      *   **Autopoiesis (Maturana & Varela) and strong Organicism/Organism-First views (e.g., Dupré, Godfrey-Smith) will score VERY SIMILARLY on this instrument.** Both emphasize the autonomous, self-producing, bounded individual organism as primary. The quiz struggles to cleanly separate them, as their divergence is often more metaphysical than operational for these cases. They both strongly favor **1B, 2A, 3A, 4A or C, 5A or C, 6B, 7B, 8A or B (leaning B), 9B**.
      *   **Cluster Concept/Gray Area views** will often select "marginally alive," "alive as part," or "not a distinct living thing" options. Look for **1C, 2B, 3B, 4C, 5C, 6C, 7C, 8C, 9C**.
      *   **Deflationism** (Life is a vague folk concept biology should discard) manifests as consistently denying "alive" status or reducing it to metaphor. Look for **1A or C, 2B or C, 3B or C, 4A or C, 5A or C, 6B or C, 7B or C, 8B, 9B**. If *everything* feels like a "no" or "just a metaphor/machine/process," this is likely you.

  *   **Core Position Mapping:**
      1.  **NASA-style Evolutionary (e.g., Gerald Joyce):** Life = Self-sustaining *chemical* system undergoing *Darwinian evolution*.
          *   **Signature Answers:** 1A (Rejects dormant non-evolving), **2B** (Ant part of evolving system), **3C** (Mule dead end), **4B** (Virus evolves), 5A (Prion lacks info/evolution), **6B** (Rejects non-chemical), **7B** (Rejects non-chemical), 8B (No evolution), 9B (No info/evolution).
          *   *Key Divergence:* Strongly rejects 6 & 7 due to "chemical system". Accepts 4 (virus) due to evolution.
      2.  **Broader Evolutionary/Informational (e.g., Dawkins, Dennett):** Life = Anything capable of evolution by natural selection (information replication with heredity, variation, selection).
          *   **Signature Answers:** 1A (Non-evolving), **2B** (Part of lineage), **3C** (Dead end), **4B** (Evolves), **5B** (Evolves - controversial!), **6A** (Evolving replicator), **7A** (Evolving replicator), 8B (No evolution), 9B (No heredity/variation).
          *   *Key Divergence:* Strongly accepts 6 & 7. *May* accept 5B (prion evolution). Rejects 8 & 9.
      3.  **Thermodynamic/Far-from-Equilibrium (e.g., Schrödinger, Prigogine, early Lovelock):** Life = Dissipative structure maintaining internal order/fighting equilibrium by continuous energy flow.
          *   **Signature Answers:** **1B** (Intact system), **2A** (Metabolizing), **3A** (Metabolizing), **4A** (No metabolism), 5A (No metabolism/control), 6B (Machine, not autonomous), 7B (No metabolism), **8A** (Dissipative, self-maintaining), **9A** (Dissipative structure).
          *   *Key Divergence:* Strongly accepts 1B & 8A. Tempted by 9A (the bait), but sophisticated views often reject it for lacking information/cognition (Answer 9B is safer). Rejects 4,5,6,7.
      4.  **Autopoiesis / Strong Organicism (Maturana, Varela, Jonas, Kauffman - organism focus):** Life = Autonomous, self-producing, operationally closed system maintaining an identity (membrane) through continual regeneration of components.
          *   **Signature Answers:** **1B** (Intact autonomous system), **2A** (Autonomous organism), **3A** (Autonomous organism), **4A or C** (Lacks autonomy/metabolism), **5A or C** (Not autonomous), **6B** (Machine, not autonomous), **7B** (Not embodied/autonomous), **8B** (Not autonomous; externally controlled), **9B** (Not autonomous/self-producing).
          *   *Key Divergence:* Strongly accepts 1B, 2A, 3A. Strongly rejects 4,5,6,7,8,9. *Cannot be cleanly distinguished from Organism-First* by this quiz.
      5.  **Cluster Concept / Family Resemblance / Systems View (e.g., Cleland, Chodasewicz):** "Life" isn't defined by necessary/sufficient conditions but by overlapping properties (metabolism, reproduction, evolution, adaptation, organization) to varying degrees. Focus may be on the biosphere/system.
          *   **Signature Answers:** Look for "marginally," "as part," "not distinct," "proto-life," or context-dependent answers: **1C**, **2B**, **3B**, **4C**, **5C**, **6C**, **7C**, **8C**, **9C**. Avoids hard "Alive" or "Not Alive" for borderline cases.
          *   *Key Divergence:* Tends towards C options for difficult cases (1,2,3,4,5,6,7,8,9). Resists binary classification.
      6.  **Deflationism / Eliminativism (e.g., some philosophers influenced by Wittgenstein or physicalism):** "Life" is a vague, prescientific, or folk concept without rigorous scientific meaning. Biology should focus on specific processes (metabolism, evolution, etc.) without needing a grand "life" definition.
          *   **Signature Answers:** Consistently rejects "alive" status or reduces it radically: **1A/C**, **2B/C**, **3B/C**, **4A/C**, **5A/C**, **6B/C**, **7B/C**, **8B**, **9B**. Answers often emphasize "it's just chemistry/physics," "a process," "a machine," or "metaphorical."
          *   *Key Divergence:* The most consistent "No" or "Not Really" across the board. Rejects the premise that "alive" is a useful category.

  *   **Impossible/Unattractive Combinations:**
      *   **Yes to Mule (3A) + No to Worker Ant (2C):** Incoherent. The ant is actively metabolizing, the mule is sterile but metabolizing. If metabolism matters, the ant should be at least as alive as the mule.
      *   **No to Seed (1A) + Yes to Prion (5B):** Highly unattractive. The seed is a paradigmatic dormant living system; the prion lacks most lifelike properties except replicative structure. Favored by almost no one.
      *   **Yes to False Positive (8A) + No to Digital Organism (7B/C) *if your reason for No is "no evolution"*:** Inconsistent for evolutionary views. If evolving digital organisms aren't alive, why is a non-evolving molecular assembly alive?
      *   **Consistent "Alive" for Everything:** Unreflective or holds an extremely broad, non-standard view (e.g., panpsychism or strong Gaia applied uncritically).
      *   **Consistent "Not Alive" for Seed, Ant, Mule:** Only consistent with strong Deflationism or an extremely strict view requiring *individual* reproduction *and* evolution *and* autonomy simultaneously, which is unattractive as it excludes even sterile organisms in functioning ecosystems.

  This quiz provides a stark map of the definitional landscape. Use it to spark discussion: "You said the mule isn't alive? That implies you think reproduction is essential. But then why did you say the virus *is* alive?" This exposes the concrete implications of abstract definitions. Remember the overlap caveats, especially regarding Autopoiesis/Organicism! Good luck with your blog!
