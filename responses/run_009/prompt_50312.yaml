answer: |-
  Here’s a handout-ready desiderata list for interpretations of probability, structured for your seminar. Each item includes motivation and a note on its status as a genuine demand vs. camp preference:

  ---

  ### **What is an Interpretation of Probability *For*?**  
  Interpretations ground the *meaning* of probability statements (e.g., "P=0.7"). They bridge abstract formalism (Kolmogorov) and real-world applications by answering:  
  - What *is* probability?  
  - How do we assign numbers?  
  - When is a probability claim true/false/meaningless?  

  ### **Desiderata for Adequate Interpretations**  
  1. **Consistency with Kolmogorov Axioms**  
     - **Motivation**: The axioms are the mathematical foundation of probability theory. An interpretation violating them (e.g., allowing probabilities >1) breaks the formal machinery used in science.  
     - **Genuine demand? YES** – Non-negotiable for mathematical coherence.  

  2. **Ascertainability / Operationalizability**  
     - **Motivation**: Probability claims must be *actionable* (e.g., for betting, policy, or scientific testing). We need ways to estimate/measure probabilities, even imperfectly.  
     - **Genuine demand? PARTIAL** – All interpretations *aim* for this, but *how* (e.g., via frequencies, beliefs, or symmetries) is camp-dependent. Strict "must be directly measurable" is a frequentist preference.  

  3. **Explanation of Frequency Tracking**  
     - **Motivation**: Long-run frequencies (e.g., coin tosses, radioactive decay) robustly align with probability assignments. An interpretation that can’t explain *why* this happens (beyond "it just does") fails a key test of empirical adequacy.  
     - **Genuine demand? YES** – Any interpretation ignoring this disconnects probability from scientific practice.  

  4. **Single-Case Applicability**  
     - **Motivation**: Science uses probabilities for unrepeatable events (e.g., "P(this proton decays within 10^34 years)"). Interpretations that only define probability for *ensembles* (e.g., "all protons") can’t handle these.  
     - **Genuine demand? YES** – Required for realism about scientific discourse.  
     - **Excludes the MOST interpretations? YES** – Frequentism (without ad hoc fixes) fails here, as do limiting frequency views.  

  5. **Addressing the Reference Class Problem**  
     - **Motivation**: Single-case probabilities (e.g., "P(I die at 70)") seem to depend on arbitrary reference classes (age? gender? smoking status?). Interpretations must either resolve this ambiguity or explain why it’s ineliminable.  
     - **Genuine demand? YES** – Silence here implies the interpretation is incomplete or avoids hard questions.  

  6. **Objectivity (Physical vs. Epistemic)**  
     - **Motivation**: Are probabilities "in the world" (e.g., propensities) or "in the mind" (e.g., degrees of belief)? Science often treats them as discovery, not invention.  
     - **Genuine demand? NO** – This is the core **camp-divider**. Insisting probabilities *must* be physical smuggles in propensity/realist preferences; subjectivism/Bayesianism explicitly rejects this.  

  ---

  ### **Key Tensions & Trade-offs**  
  - **Jointly Unsatisfiable Pair?**  
    **Full Ascertainability + Single-Case Objectivity**  
    - **Why**: *Precise, objective* probabilities for single events (e.g., "P(this atom decays at t)") are rarely ascertainable without epistemic tools (e.g., credences based on physical symmetries). Propensity theories posit objective single-case probabilities but struggle with measurement; frequentism avoids single-case objectivity but ensures ascertainability *only* for collectives.  
    - **Your hunch is correct** – This tension is central but often unstated.  

  - **Other Tensions**:  
    - **Objectivity vs. Reference Class Resolution**: Objectivist views (e.g., propensities) face the reference class problem acutely; subjectivism avoids it by relativizing probabilities to agents.  
    - **Ascertainability vs. Single-Case**: Frequentism sacrifices single-case applicability for operational clarity; logical/propensity interpretations accept less-tangible ascertainment methods.  

  ---

  ### **Why This List?**  
  These desiderata expose fault lines between interpretations (frequentist, subjectivist/Bayesian, propensity, logical). No interpretation satisfies all perfectly—**trade-offs are inevitable**. Use this list to critically analyze:  
  1. What each interpretation *must* deny,  
  2. What costs it accepts,  
  3. Why certain camps dominate in specific scientific contexts.  

  ---  
  *Handout tip: Add examples (e.g., quantum events for single-case, insurance tables for reference classes) to make tensions concrete.*
