  ### The Game: Study Group Work Division
  Two students, Alex and Bailey, are in a study group for two topics: Calculus and Statistics. They must decide how to split the study workload for an upcoming exam. Each can choose one of four strategies:

  - **A**: Study only Calculus.  
  - **B**: Study only Statistics.  
  - **C**: Study both topics.  
  - **D**: Study nothing.  

  The benefit of covering a topic (at least one studies it) is 10 points for both students. The cost of studying is:
  - 3 points for one topic (A or B),  
  - 5 points for both topics (C),  
  - 0 points for no studying (D).  

  Payoffs are (points for Alex, points for Bailey). The payoff matrix is:

  | Alex \ Bailey | a (A)      | b (B)      | c (C)      | d (D)      |
  |---------------|------------|------------|------------|------------|
  | **A (A)**     | (1, 1)     | (1, 2)     | (0, 1)     | (0, 1.4)   |
  | **B (B)**     | (2, 1)     | (2, 2)     | (0, 1)     | (0, 1.4)   |
  | **C (C)**     | (1, 0)     | (1, 0)     | (-1, -1)   | (-1, 0)    |
  | **D (D)**     | (1.4, 0)   | (1.4, 0)   | (0, 0)     | (-1, -1)   |

  ### Verification of Specifications
  1. **Mundane Situation with Ordinary Payoffs**  
     Students face a realistic study group scenario. Payoffs are in points (combining benefits and costs), reflecting saved effort and knowledge gained.

  2. **No Pure Strategy Dominance by Pure Strategies**  
     - For Alex (rows):  
       - A: [1, 1, 0, 0] vs. B: [2, 2, 0, 0] → Not dominated (B better in a,b; tie in c,d).  
       - A/B vs. C: [1,1,-1,-1] vs. [1,1,0,0] → No dominance (C worse in c,d but better in a,b? No: C has 1 in a,b which is not better than A's 1 or B's 2).  
       - A/B vs. D: [1.4,1.4,0,-1] vs. [1,1,0,0] → No dominance (D better in a,b; worse in d).  
     - For Bailey (columns):  
       - a: [1, 1, 0, 0] vs. b: [2, 2, 0, 0] → Not dominated.  
       - a/b vs. c: [1,1,-1,0] vs. [0,0,0,0] → No dominance (c worse in C-row).  
       - a/b vs. d: [1.4,1.4,0,-1] vs. [1,1,0,0] → No dominance.  
     **Result**: No pure strategy is strictly dominated by any pure strategy. Iterated pure elimination cannot start.

  3. **Mixed Dominance and Iterated Elimination (Two Rounds)**  
     - **Round 1: Eliminate C for Alex and c for Bailey**  
       - Alex's C is strictly dominated by a 50-50 mixture of A and B:  
         - vs. a: (0.5×1 + 0.5×2) = 1.5 > 1  
         - vs. b: (0.5×1 + 0.5×2) = 1.5 > 1  
         - vs. c: (0.5×0 + 0.5×0) = 0 > -1  
         - vs. d: (0.5×0 + 0.5×0) = 0 > -1  
         → C is dominated (no pure strategy dominates C: A/B tie or lose in some columns).  
       - Bailey's c is strictly dominated by a 50-50 mixture of a and b:  
         - vs. A: (0.5×1 + 0.5×2) = 1.5 > 1  
         - vs. B: (0.5×1 + 0.5×2) = 1.5 > 1  
         - vs. C: (0.5×0 + 0.5×0) = 0 > -1  
         - vs. D: (0.5×0 + 0.5×0) = 0 > -1  
         → c is dominated.  
       **Reduced Matrix (Alex: A,B,D; Bailey: a,b,d)**:  
       | Alex \ Bailey | a       | b       | d       |
       |---------------|---------|---------|---------|
       | **A**         | (1, 1)  | (1, 2)  | (0, 1.4)|
       | **B**         | (2, 1)  | (2, 2)  | (0, 1.4)|
       | **D**         | (1.4, 0)| (1.4, 0)| (-1, -1)|

     - **Round 2: Eliminate D for Alex and d for Bailey**  
       - Alex's D is strictly dominated by a 50-50 mixture of A and B:  
         - vs. a: (0.5×1 + 0.5×2) = 1.5 > 1.4  
         - vs. b: (0.5×1 + 0.5×2) = 1.5 > 1.4  
         - vs. d: (0.5×0 + 0.5×0) = 0 > -1  
         → D is dominated.  
       - Bailey's d is strictly dominated by a 50-50 mixture of a and b:  
         - vs. A: (0.5×1 + 0.5×2) = 1.5 > 1.4  
         - vs. B: (0.5×1 + 0.5×2) = 1.5 > 1.4  
         - vs. D: (0.5×0 + 0.5×0) = 0 > -1  
         → d is dominated.  
       **Reduced Matrix (Alex: A,B; Bailey: a,b)**:  
       | Alex \ Bailey | a      | b      |
       |---------------|--------|--------|
       | **A**         | (1, 1) | (1, 2) |
       | **B**         | (2, 1) | (2, 2) |

     - **Final Elimination**:  
       - Alex's A is strictly dominated by B (pure): 2 > 1 in a, 2 > 1 in b.  
       - Bailey's a is strictly dominated by b (pure): 2 > 1 in A, 2 > 1 in B.  
       **Unique Survivor**: (B, b) with payoff (2, 2).  

  4. **Strict Dominance Only, Order-Independent**  
     All eliminations use strict inequalities. Order doesn’t matter: mixed dominance in Rounds 1–2 is valid regardless of sequence.

  ### Key Feature and Sensitivity
  - **Key Feature**: The constant, intermediate payoffs of C and c (e.g., (1,1) or (1,0)) are dominated only by mixtures exploiting asymmetry in A/B and a/b.  
  - **If Adjusted**: If C’s payoff vs. a were 2 (eliminating mixed dominance), C would not be dominated. Iterated elimination stalls, and (B,b) isn’t uniquely selected.

  ### Is It Irrational to Reject Mixed Dominance?
  **Yes, it is irrational to play a strategy that falls to mixed dominance**.  
  - **Reasoning**: Rationality requires avoiding strictly dominated strategies. Mixed dominance reveals that C is strictly worse than a randomized plan (A and B with 50-50). Ignoring this leaves players vulnerable to avoidable losses (e.g., C risks -1 vs. a guaranteed 1.5 from the mixture).  
  - **Objection Confronted (Common Knowledge and Randomization)**:  
    - *Common Knowledge of Rationality (CKR)*: CKR ensures players recognize and act on dominance. In mundane settings, students can grasp mutual rationality through repeated interactions (e.g., "we both know we won’t pick a sure-loss option").  
    - *Randomization Comfort*: Randomization isn’t mystical—it’s a tool for robustness. A student might implicitly randomize by external factors (e.g., "if sunny, study Calculus; else, Statistics"). The mixture need not be explicit.  
    - *Ordinary Agents*: Rejecting mixed dominance forces irrational choices. In this game, choosing C risks -1 points when a mixture ensures ≥0. Even boundedly rational agents should prefer security.  

  ### Teaching Moral: Power of Iterated Dominance
  **Teach this case as a demonstration of the power of iterated mixed dominance**.  
  - **Why**: The game shows how mixed strategies unveil non-obvious irrational choices, guiding unique, optimal outcomes. Students see that rejecting mixed dominance leads to worse payoffs, reinforcing its necessity. The answer key should emphasize:  
    > *"Mixed dominance expands rational pruning beyond pure strategies. Ignoring it leaves dominated options—like C and c—that guarantee avoidable losses. Rational agents use all tools, including randomization, to eliminate strictly inferior choices."*  

  This case will compel students to respect mixed dominance, not just memorize it. Put it on the problem set with the above moral.
