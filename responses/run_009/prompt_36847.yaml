prompt: |-
  I'm on the steering committee of a professional society (roughly 2,500 members, we're hydrologists, if it matters) and we elect our president and four at-large board members every year by plain plurality. At the last election the winning presidential candidate got 33% with two very similar candidates splitting the rest, and members have been grumbling ever since. So at the fall meeting someone will finally move to change the voting rule, and I've been tasked with writing the recommendation memo beforehand since I'm the one who supposedly knows some decision theory.

  There are three factions on the committee, and the memo needs to actually deal with all of them:

  1. The IRV people, who want instant-runoff for president and single transferable vote for the board seats.
  2. Our treasurer, who took one game theory course years ago and now says Arrow's impossibility theorem proves that *every* ranked-ballot method is just as arbitrary and manipulable as every other one, so switching is pointless churn and we should keep plurality, which at least everyone understands.
  3. A member who wants approval voting and claims it "dodges Arrow entirely" because Arrow is only about ordinal preferences, so we'd get a fair system for free.

  The vote has to be decided at the meeting in two weeks because the ballot platform order has to be locked in a month before the election.

  Draft the memo I'll circulate: it needs a concrete bottom-line recommendation (pick a rule, or defend keeping plurality, or recommend something with a runoff structure — your call), the reasoning laid out so the treasurer could actually respond to it, and an honest accounting of the strongest point on whichever side loses. Please be careful about what Arrow's theorem does and doesn't say — the treasurer is misusing it somehow but I don't fully trust myself to say exactly how, e.g. whether it even applies to plurality voting as it's usually stated, and whether the approval-voting person's escape claim is real or a shell game. Also worth touching on: our members mostly vote sincerely out of habit, we've never had organized strategic voting, and last cycle only 40% bothered to vote at all — so whatever we pick, "how much does this theorem matter for an org like ours at all" is a fair question the memo shouldn't dodge. Keep it to something I can actually circulate, so under 800 words, and dont make it condescending — several of these people are smarter than me, they just havent thought about voting rules.
reasoning: |-
  We are drafting a memo for a professional society of hydrologists regarding changing their voting system. The current system is plain plurality, which led to a president elected with 33% of the vote and two similar candidates splitting the rest. There are three factions: one advocating for IRV/STV, the treasurer who argues that Arrow's theorem makes any change pointless, and a member pushing for approval voting as an escape from Arrow.

  Key issues:
  - Arrow's impossibility theorem applies to ranked voting systems and shows that no ranked system can satisfy a set of desirable properties (unanimity, independence of irrelevant alternatives, non-dictatorship) simultaneously. However, the theorem does not apply to plurality (which is a non-ranked system) or to approval voting (which is a cardinal system). The treasurer is misapplying Arrow by claiming it applies to every voting system and that all are equally arbitrary. Arrow's theorem is about ranked systems only.

  - Approval voting is indeed a cardinal system (voters indicate approval or not for each candidate, without ranking) and thus falls outside the scope of Arrow's theorem. However, it has its own set of properties and potential issues.

  - The memo must make a concrete recommendation, address the treasurer's misuse of Arrow, and honestly present the strongest point for the losing side.

  - The society has low turnout (40%) and no history of strategic voting. Therefore, we should consider simplicity and voter understanding.

  Options:
  1. Keep plurality: simple, but can lead to winners with low support when similar candidates split the vote.
  2. Instant-runoff voting (IRV) for president and single transferable vote (STV) for the board: addresses vote splitting by allowing rankings. However, Arrow's theorem applies to IRV (as a ranked system) and shows it must violate one of the conditions. But in practice, IRV is used successfully in many organizations and governments.
  3. Approval voting: voters can approve of multiple candidates. It is simple and avoids the vote-splitting problem. However, it might lead to bullet voting (voting for only one candidate) if voters are strategic, and it doesn't capture intensity of preference as well as ranked systems.

  Given the context, I recommend approval voting for both the president and the board. Reasons:
  - Simplicity: Voters can easily understand it (just mark all candidates they find acceptable). This is important given the low turnout and the need for a system that doesn't confuse voters.
  - It avoids the vote-splitting problem that occurred in the last election: members who support two similar candidates can approve both without fear of splitting the vote.
  - It is less vulnerable to Arrow's theorem because it is not a ranked system. However, it is not a perfect system and has its own trade-offs.
  - It is easier to implement than IRV/STV because it doesn't require a complex ranking and counting process. Given the tight timeline (two weeks to decide and then one month to implement), approval voting is more feasible.

  But we must be honest: the strongest argument against approval voting is that it might not reflect the voters' preferences as well as a ranked system in cases where there are more than two strong candidates. For example, in a three-way race, a candidate who is the second choice of many but not approved by a majority might lose to a candidate with broad but shallow support. However, in the society's context, with no history of strategic voting, bullet voting might be minimal.

  For the treasurer: Arrow's theorem does not apply to plurality or approval voting. It only applies to systems that use ranked ballots and try to produce a social ordering. Plurality is a non-ranked system and approval is a cardinal system. Therefore, the treasurer's argument that Arrow makes every system equally arbitrary is incorrect.

  For the IRV advocates: We acknowledge that IRV addresses vote splitting and provides a more nuanced expression of preferences. However, it is more complex to count and might be harder to implement in the short time frame. Also, Arrow's theorem does apply to IRV, meaning it must violate one of the conditions (typically independence of irrelevant alternatives). But that doesn't mean it's worse than plurality in practice. The strongest point for IRV is that it ensures the winner has majority support (by redistributing votes until one candidate has over 50%) in the sense of being the top choice of a majority after eliminations, which is a desirable property.

  Conclusion: We recommend approval voting for both president and board. It is a simple, practical improvement over plurality that avoids vote splitting and is feasible to implement quickly. We also note that no system is perfect, but approval voting is a significant step forward.

  Draft memo:

  ---

  **MEMORANDUM**

  To: Steering Committee Members  
  From: [Your Name], Steering Committee Member  
  Date: [Date]  
  Subject: Recommendation for Voting System Reform  

  ### Introduction
  This memo addresses concerns raised by the recent presidential election, in which the winner received 33% of the vote due to vote splitting. We have been tasked with evaluating alternative voting systems. After careful consideration, I recommend adopting **approval voting** for both the presidential and at-large board member elections. This system is simple, mitigates vote splitting, and can be implemented in time for the upcoming election.

  ### Background: Arrow’s Theorem and Its Relevance
  Our treasurer has rightly noted Arrow’s impossibility theorem, which proves that no ranked voting system can simultaneously satisfy a set of reasonable conditions (unanimity, independence of irrelevant alternatives, and non-dictatorship). However, Arrow’s theorem applies *only* to systems that use ranked ballots and attempt to produce a complete social ordering. It does not apply to plurality voting (which uses a single choice) or approval voting (which uses a set of approved candidates). Therefore, the theorem does not imply that all systems are equally arbitrary. While no voting system is perfect, we can still choose one that better reflects our members’ preferences.

  ### Evaluation of Options
  1. **Plurality (Current System)**:  
     - *Strengths*: Simple and widely understood.  
     - *Weaknesses*: Vulnerable to vote splitting, as seen in the last election. A candidate can win with a small minority.  
     - *Arrow’s Theorem*: Not applicable because it does not use ranked ballots.

  2. **Instant-Runoff Voting (IRV) for President and Single Transferable Vote (STV) for Board**:  
     - *Strengths*: Addresses vote splitting by allowing voters to rank candidates. IRV ensures the winner has majority support in the sense of being the top choice of a majority after redistributions. STV provides proportional representation for the board.  
     - *Weaknesses*: More complex to count and explain. Arrow’s theorem applies, meaning IRV must violate one of its conditions (typically independence of irrelevant alternatives). However, this does not make it worse than plurality in practice. Implementation within our timeline may be challenging.  
     - *Strongest Point for IRV/STV*: It captures nuanced preferences and eliminates the spoiler effect by transferring votes.

  3. **Approval Voting**:  
     - *Strengths*: Voters can approve any number of candidates. This avoids vote splitting (e.g., supporters of two similar candidates can approve both). It is simple to vote and count. It is not subject to Arrow’s theorem because it uses approval sets rather than rankings.  
     - *Weaknesses*: It does not capture rankings or intensity of preference. In a crowded race, it might elect a candidate with broad but shallow support over one with intense support. However, in our context (with no history of strategic voting and low turnout), we expect voters to use it sincerely.  
     - *Strongest Point Against*: It may not reflect preferences as accurately as a ranked system when voters have strong preferences among approved candidates.

  ### Recommendation
  I recommend **approval voting** for the following reasons:  
  - **Simplicity**: It is easy for voters to understand and use. Given our 40% turnout, we must avoid systems that might confuse voters.  
  - **Effectiveness**: It directly addresses the vote-splitting problem of the last election.  
  - **Feasibility**: It can be implemented with minimal changes to our ballot and counting process, which is critical given our two-week decision window and one-month implementation timeline.  

  While approval voting is not perfect, it is a substantial improvement over plurality and more practical than IRV/STV at this time. We can revisit the system in the future if needed.

  ### Honest Accounting
  - **To IRV Advocates**: We acknowledge that IRV/STV captures more nuanced preferences and ensures majority support in the IRV process. However, the complexity of implementation and the short timeline make approval voting a more prudent choice for now.  
  - **To Treasurer**: Arrow’s theorem does not condemn all systems. Approval voting avoids the theorem’s scope and provides a simpler, fairer alternative to plurality.  

  ### Conclusion
  Let us move forward with approval voting to ensure our elections better reflect the will of the membership. This change is a practical and timely response to the concerns raised.

  ---
  Word count: Approximately 750 words.
answer: |-
  **MEMORANDUM**  
  To: Steering Committee  
  From: [Your Name], Steering Committee Member  
  Date: [Date]  
  Subject: Voting System Recommendation for Society Elections  

  ### Introduction  
  This memo evaluates alternatives to our current plurality voting system, prompted by concerns from the recent presidential election (winner: 33% support). We must balance fairness, simplicity, and feasibility under our tight deadline. After careful review, **I recommend adopting approval voting for both president and board elections**, with a fallback to plurality only if implementation proves infeasible. Below, I address the key positions, clarify Arrow’s theorem, and justify this recommendation.  

  ### Clarifying Arrow’s Theorem and Its Relevance  
  *Background:* Arrow’s theorem proves **no ranked-choice system** (like IRV/STV) can satisfy all "fairness" criteria (unanimity, independence of irrelevant alternatives, non-dictatorship) simultaneously. **This does not apply to plurality or approval voting**, as they use non-ranked ballots. The treasurer’s claim that all systems are "equally arbitrary" misapplies Arrow:  
  - Plurality uses **categorical ballots** (one vote per candidate), not rankings.  
  - Approval voting uses **approval sets** (voters select all acceptable candidates), not rankings.  
  Arrow’s theorem is silent on these systems. While no system is perfect, this does not preclude improving upon plurality.  

  ### Key Concerns Addressed  
  1. **For IRV/STV Advocates**:  
     - *Strengths:* IRV eliminates "spoiler effects" (e.g., similar candidates splitting votes) by redistributing support. STV ensures proportional representation for the board.  
     - *Weaknesses:* Arrow’s theorem shows IRV *must* violate at least one fairness criterion. In practice, this can manifest as non-monotonicity (a candidate losing due to *more* first-choice support). Implementation is complex, and our 40% turnout suggests voter fatigue could worsen with ranking demands.  
     - *Strongest Point for IRV:* It guarantees the president has majority support from *active* voters in the final round.  

  2. **For the Treasurer (Keeping Plurality)**:  
     - *Strengths:* Simplicity—voters pick one candidate; results are transparent.  
     - *Weaknesses:* Fails when similar candidates split votes (as in our 33% case). Arrow’s theorem does *not* defend plurality; it ignores non-ranked systems.  
     - *Strongest Point for Plurality:* Low cognitive load may aid participation in low-turnout elections.  

  3. **For Approval Voting Advocates**:  
     - *Strengths:* Voters select *all* acceptable candidates (e.g., supporters of similar candidates can approve both). It "escapes" Arrow by not using rankings. Simple to implement (minimal ballot changes) and count.  
     - *Weaknesses:* Does not capture preference strength (e.g., "strong favorite" vs. "barely acceptable").  
     - *Strongest Point Against:* In polarized races, it may elect broadly tolerated but non-majority candidates.  

  ### Why Approval Voting?  
  1. **Solves the Immediate Problem**: Approval voting directly addresses vote-splitting by letting members support multiple similar candidates. Had it been used last year, the winner likely would have earned >50% approval (based on the 67% combined vote for the two similar runners-up).  
  2. **Practicality**:  
     - **Simple for voters**: Mark candidates you accept; no ranking or runoff needed.  
     - **Implementable in 4 weeks**: Ballots require minor adjustments; counting is straightforward (sum approvals; highest wins).  
     - **Low strategic risk**: With no history of tactical voting, members will likely vote sincerely. Low turnout is better addressed by simplicity than complexity.  
  3. **Theoretical Robustness**: Approval voting avoids Arrow’s limitations and satisfies the "favorite betrayal" criterion (you never hurt your favorite by approving them).  

  ### Why Not IRV/STV?  
  While IRV/STV are strong systems, their complexity poses risks under our constraints:  
  - **Voter confusion**: Ranking multiple candidates could reduce turnout.  
  - **Implementation hurdles**: Our ballot platform may not support ranked choices; manual runoff counts could delay results.  
  - **Arrow’s theorem**: Though not a dealbreaker, its violations (e.g., sensitivity to irrelevant alternatives) *are* relevant in theory.  

  ### Bottom Line  
  - **Recommendation**: Adopt **approval voting** for president and board elections.  
  - **Fallback**: Retain plurality *only* if approval voting cannot be implemented by the ballot deadline.  
  - **Honest Trade-offs**:  
    - *For IRV supporters:* We sacrifice nuanced rankings for simplicity and speed.  
    - *For plurality defenders:* We accept minor added complexity to prevent non-majority winners.  

  ### Conclusion  
  Arrow’s theorem does not doom reform. Approval voting offers a pragmatic upgrade: it mitigates vote-splitting, respects our low-turnout context, and is feasible within our timeline. Plurality’s simplicity is admirable but fails in fragmented races. Let our system reflect our members’ intent—not mathematical inevitabilities. I urge the committee to support this change.  

  ---  
  **Word Count**: 795  
  **Key Notes for Discussion**:  
  - Ballot platform vendors (e.g., ElectionBuddy) support approval voting; we’ll confirm feasibility within 48 hours of this decision.  
  - We can revisit in 2–3 years if turnout or strategic voting changes.
