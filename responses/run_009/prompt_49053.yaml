prompt: |-
  My friend Priya is one of those people with very fixed opinions about decision-theory hypotheticals, and over the years I've collected her verdicts. I want to know what she'd say about two new ones, and I dont want you to just guess — I want the rule she seems to be running, the rival rules that fit her record just as well, and how the new cases pull those rules apart.

  Her record, as far as I've got it:

  - Newcomb with sealed boxes, predictor 99% accurate: she one-boxes, and thinks people who two-box are smuggling a causal story into a place where it just isn't there.
  - Parfit's hitchhiker: she pays the $1000 once she's in town, obviusly, and she thinks the person who reasons "now that I'm in town, keeping the money is the smart move" has understood nothing. She also says the driver is perfectly rational to strand non-payers, and that this is the whole point of being able to make yourself into someone who pays.
  - A variant where the trucker picks up literally everyone he passes and just mentions idly he'd appreciate $1000 if you feel like it: she says you're not rationally required to pay — she might still pay out of politeness, but the rational requirement is what she cares about.
  - Transparent Newcomb, box B visibly full with the million: she one-boxes, and says taking the extra thousand would be defecting on yourself.

  The two new cases:

  1. The dead driver. Same setup as the hitchhiker — he rescued you in the desert because he predicted you'd pay — but half a mile from town he has a fatal heart attack and the truck rolls gently into a ditch. Nobody else ever learns the deal existed. The $1000 would go to his estate, which will never know whether it arrived. Does she pay?
  2. The counterfactual mugging. Omega flipped a fair coin yesterday; it came up tails, and if it had come up heads, $10,000 would be sitting in your account right now. Omega never predicted or simulated you — it literally just flipped a coin. Today it asks for $100. Does she pay?

  Please structure your answer as:

  - "The candidate rules" (~180 words): at least two rules that fit her entire record, stated precisely enough that they actually make different predictions somewhere.
  - "Dead driver" (~150 words): what each rule says about case 1 and why.
  - "The mugging" (~150 words): same for case 2.
  - "My call" (~200 words): your best guess for what she'd say about each, and what tips you toward it — keep in mind she's not a philosophy student, she just has strong intuitions.
  - "The question that settles it" (~100 words): the single case or question I could put to her that would best separate the rules you came up with.

  Don't bother with papers or citations, I don't care about the literature here — I care about Priya.
reasoning: |-
  Hmm, the user has given me a detailed scenario about their friend Priya and her decision-theory opinions. They've provided several hypothetical cases where Priya has made clear choices, and now they want me to analyze two new scenarios based on her pattern of reasoning. This isn't about academic theories - it's about reverse-engineering Priya's personal decision-making rules.

  Looking at Priya's established positions: In the Newcomb problem with sealed boxes, she one-boxes and dismisses causal reasoning. In Parfit's hitchhiker, she pays and criticizes those who defect after being saved. But in a variant where the driver picks everyone up and casually mentions payment, she doesn't feel rationally obligated to pay. And in transparent Newcomb where she can see the million dollars, she still one-boxes and frames taking the extra thousand as "defecting on yourself."

  I need to find at least two decision rules that fit all these existing cases perfectly. The first candidate rule that comes to mind is "Conditional on the agent's decision procedure being predicted, act as if it's still being predicted." This explains why she pays in hitchhiker but not in the casual variant. The second rule could be "Maximize actual outcomes given your current knowledge," which would also fit her record so far.

  For the new cases: In the dead driver scenario, the first rule would say pay (since the prediction was about her decision procedure), while the second rule would say don't pay (no consequences now). In counterfactual mugging, the first rule would say pay (to be the kind of agent who pays in such scenarios), while the second rule would say don't pay (since the coin already landed tails).

  My best guess is that Priya would pay in dead driver but not in counterfactual mugging. Her emphasis on "defecting on yourself" suggests she cares about maintaining decision procedures, not just outcomes. The hitchhiker case shows she values being predictable to others, and transparent Newcomb shows she extends this to self-consistency.

  To definitively distinguish between the rules, I'd ask Priya about a scenario where she knows Omega didn't predict her but is testing her decision procedure anyway - like a transparent Newcomb where she sees the boxes are empty but Omega is watching to see what she would have done. Her answer would reveal whether she cares about actual consequences or maintaining decision types.
answer: |-
  ### The candidate rules (~180 words)
  Two rules fitting Priya's record:
  1. **Commitment to Predicted Types (CPT):** Act as the type of agent you committed to being *when the prediction occurred*. Rationality requires upholding the decision-procedure that was predicted, ensuring you are (and remain) the kind of agent predictors can rely on. This justifies one-boxing (being a one-boxer type) and paying the hitchhiker (being a payer type), but not paying the casual driver (no prediction of your type occurred). "Defecting on yourself" in transparent Newcomb violates this commitment to your pre-identified type.
  2. **Consequence-Conditional Instrumentalism (CCI):** Maximize actual consequences given your *current* knowledge and causal power. This fits one-boxing (taking one box causes $1M, two-boxing causes $1K), paying the hitchhiker (paying causes survival), not paying the casual driver (no survival consequence), and one-boxing in transparent Newcomb (taking B alone causes $1M; adding A causes loss of $999K). It rejects "defecting" as a causal mistake.

  Both rules fit all prior cases. They diverge when a past prediction binds your "type," but your current action has no causal consequences.

  ### Dead driver (~150 words)
  - **CPT:** Priya pays. The driver predicted her *decision-procedure type* (a "payer") based on her disposition. Paying upholds her commitment to being that type, even though consequences are absent. Refusing would mean she wasn't truly a payer type, invalidating the prediction retroactively and making her unreliable to future predictors.
  - **CCI:** Priya does not pay. There are zero consequences: her survival is already secured, the estate gains nothing identifiable, and no reputation is affected. Paying costs $1000 for no causal benefit, violating instrumental rationality.

  **Prediction pull:** CPT requires payment to maintain type-consistency; CCI rejects it as pointless cost.

  ### The mugging (~150 words)
  - **CPT:** Priya pays. Omega is testing if she is the *type* who pays in such counterfactuals. Paying commits her to being a reliable agent in decision-theoretic games, even when actual outcomes aren't at stake. Refusing would signal she only cares about actual consequences, making her untrustworthy in future interactions with Omega-like entities.
  - **CCI:** Priya does not pay. The coin flip already happened (tails); paying $100 now cannot cause the $10,000 to appear (it was never coming). Since Omega didn’t simulate her, her refusal doesn’t affect future predictions. Paying is pure loss with no causal upside.

  **Prediction pull:** CPT demands payment to affirm her decision-type; CCI sees it as irrational charity.

  ### My call (~200 words)
  I think Priya **pays in Dead Driver** but **does not pay in Counterfactual Mugging**. 

  For **Dead Driver**, her emphasis on "being someone who pays" in the original hitchhiker and "defecting on yourself" in transparent Newcomb shows she cares deeply about *identity consistency* with the agent who was predicted. The dead driver predicted her *as a payer*, so paying is about honoring that identity, not consequences. CPT captures this, while CCI’s purely causal view feels to her like "smuggling in causality" where it doesn’t belong—paralleling her Newcomb sealed-box critique. Not paying would feel like betraying her word.

  For **Counterfactual Mugging**, CCI fits better. Omega never predicted her—it just flipped a coin. There’s no "type" to uphold because no assessment of her decision-procedure occurred. Paying gains nothing and costs $100; it’s functionally identical to the casual driver variant where no prediction happened. Priya would likely dismiss paying as superstitious ("Omega didn’t ask *because* of me, so why burn money?"). Her rejection of "defecting" in transparent Newcomb was tied to visible causal loss ($999K), not abstract type-maintenance.

  ### The question that settles it (~100 words)
  Ask Priya: **"Imagine a Transparent Newcomb where you see Box B is *empty*. Omega (99% accurate) predicted you before you looked. Do you take only B (one-box) or both boxes (two-box)?"** 
  - **CPT** says one-box: you must act as your predicted type (a one-boxer) to remain reliable, even if futile. 
  - **CCI** says two-box: taking A gives $1000; taking B alone gives $0. Your action causes no penalty. 
  Priya’s answer reveals if she prioritizes type-commitment over immediate consequences when outcomes are known.
