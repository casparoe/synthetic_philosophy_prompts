  Based on Dana's established positions, I'll predict her responses to the three new scenarios, deduce her underlying ethical rule, and propose a test case to clarify ambiguities. Her pattern suggests a nuanced approach blending elements of Margalit, living memory, and archival duty—but prioritises *context* (institutional vs. personal, living victims, and functionality).

  ### Predictions for the Three Cases:
  1. **Her mother’s diaries (informing on neighbours):**  
     Dana will insist the diaries **must be preserved** (like her grandfather’s letters) but **not disclosed to the neighbour’s daughter**. She’ll argue that while the *record* should exist for historical truth, forcing this knowledge on the living victim—a "thick relation" she knows personally—would inflict gratuitous pain without meaningful reparations. She’ll note her mother’s act was institutional (tied to the regime), but the *harm* was interpersonal; thrusting it into the open now risks reopening wounds without a framework for justice or healing (unlike the TRC’s structured amnesty). *Likely quote:* "The attic box is where this belongs—not between us over tea."  

  2. **National day of mourning (1760s expulsion):**  
     She’ll **oppose the annual ceremony**, advocating instead for a **scholarly history book and a physical memorial** (plaque/site). Her mine disaster stance shows she rejects performative rituals once living memory expires; here, no survivors or perpetrators remain, making grief abstract. However, she’ll stress the event’s gravity demands *preservation* as national history (aligning with Holocaust education’s ethos). *Likely quote:* "We owe them remembrance, not a hollow spectacle."  

  3. **Your friend’s confessional letters:**  
     Dana will urge you to **seal the letters away permanently**, arguing that rereading them is "emotional self-flagellation." Her forgiveness of her own friend and her stance on private tax affairs reflect a belief that personal wrongs lose moral urgency once direct relationships end (through death or time). Preserving the letter honours truth (archive duty), but dwelling on it prevents closure—as she sees forgiveness as "letting the injury stay in the past." *Likely quote:* "He’s gone. You’re only hurting *you* now."

  ---

  ### Her Underlying Rule:  
  **"Preserve the record always; engage the heart only when it serves justice or healing among the living."**  
  This synthesises her positions:  
  - **Archive-always core:** Physical/digital records (diaries, plaques, online databases) must persist as impartial truth.  
  - **Margalit-esque caveat:** "Thick relations" (victims, perpetrators, or their communities) intensify duties—but *only if engagement repairs harm*. Examples: Holocaust education (global "thick relation" to prevent recurrence) and the TRC (live testimony for reconciliation).  
  - **Living-memory pragmatism:** Rituals/guilt are pointless without living connections to the wrong. Private hurts should fade; public ones become history.  

  ### Why This Rule Fits Best:  
  | **Candidate Rule**          | **Strengths**                                  | **Weaknesses**                                  |  
  |-----------------------------|-----------------------------------------------|-----------------------------------------------|  
  | **Margalit (thick relations + radical evil)** | Explains Holocaust focus and TRC support.     | Fails her *forgiveness* of personal betrayal (a "thick" but private wrong). Also, she archives grandfather’s *abusive* letters (radical evil?) without engaging. |  
  | **Living-memory expiry**    | Clarifies opposition to mine/expulsion rituals. | Contradicts her stance on *politicians’ tax affairs*: no living victims, yet record must stay public. Also, Holocaust education outlives survivors. |  
  | **Archive-always**          | Fits all physical/digital preservation cases. | Doesn’t explain her *rejection* of guilt-tripping curricula or annual ceremonies. |  
  **Key differentiator**: Dana treats *emotional engagement* (guilt, rituals, confession) as **instrumental**—only justified if it aids justice/healing *for living people*. This separates her from pure Margalit (duty-bound remembrance) and living-memory (time-bound obligations).  

  ---

  ### A Test Case to Divide the Rules:  
  **Scenario:** *Should a university publicly name donors who funded discriminatory policies in the 1950s? The donors and victims are dead, but the policies shaped systemic inequalities persisting today.*  

  - **Margalit-ish rule:** Yes. The "thick relation" (campus community) and radical evil (systemic discrimination) demand public reckoning.  
  - **Living-memory rule:** No. With no living victims/perpetrators, only archive the records internally.  
  - **Dana’s predicted stance:** **Yes, name them.** The institutional harm persists (linking to her "public figure" tax stance), and transparency serves justice *for the living community* still affected. This aligns with her TRC logic: truth enables societal healing.  

  ### Final Thought on the Diaries:  
  This case troubles you because Dana’s rule prioritises *present relationships* over historical catharsis. She’d argue disclosing the diaries risks destroying her bond with the neighbour for no restorative gain—since her mother can’t testify, amnesty is impossible, and the daughter gains only pain. The attic box becomes a metaphor: memory preserved but not weaponised. If you want to unsettle her, ask: *"What if the neighbour’s daughter finds the diaries in 20 years and learns you knew?"* That pits archival duty against active betrayal—a tension her rule hasn’t resolved.  

  ---  
  **Sunday prep sorted.** If Dana veers off-script, it’ll likely be on the diaries—her mother’s complicity might spike her pragmatism with guilt. Watch for that crack in the armour. Good luck.
