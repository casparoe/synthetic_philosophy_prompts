prompt: |-
  I'm in a metaethics seminar and we just wrapped up the unit on evolutionary debunking arguments (Street's Darwinian dilemma, Joyce, etc). For my term paper I want to claim that the whole literature is kind of stuck because the two sides implicitly disagree about what would even count as a *successful response* -- people argue past each other because they're grading against different specs. So before I engage any particular reply I want a section that lays out the full spec explicitly. Write me the desiderata: what any adequate response to an evolutionary debunking argument has to deliver, with the consideration or motivating case behind each one. Some things I suspect belong on the list (feel free to push back or add): it has to explain why the evolutionary etiology of our moral beliefs is epistemically harmless without using a strategy that would also protect obviously bad belief-forming processes from debunking; it has to say something about why the case differs from, or parallels, mathematics and ordinary perceptual beliefs, since the debunker's whole move is "if evolution explains why you believe X without X being true, that's a problem" and it's not obvious why morality is special; and it has to not quietly presuppose the conclusion (e.g. a response that only works if you've already decided moral realism is true is cheating, or is it? maybe say what you think about that).

  Also flag which desiderata you suspect can't be jointly satisfied, because I think that's where the real action is -- like maybe you can't both take the evolutionary explanation of our moral faculties seriously as a complete causal story AND get the kind of non-accidental tracking relation between our beliefs and moral facts that reliability would require, and if the list is jointly unsatisfiable that's actually a result in itself and I want to be able to say that clearly. Then mark which desiderata are non-negotiable and which are just pet commitments of one camp (I suspect the "must vindicate realist moral knowledge" one is a camp thing, not a genuine requirement, but I'm not sure).

  Finally, a quick scorecard: how do the main response types do against your list -- third-factor replies a la Enoch, companion-in-guilt arguments (the ones that say logic or mathematics faces the same threat so the debunker is hoisted by their own petard), and the antirealist/constructivist escape where you just concede the debunking works against independent moral truths but keep normativity anyway. Keep the scorecard short though, one or two sentences each -- the requirements and the tensions between them are the part I actually need for the paper. My prof said the thesis has to be argued for, not just announced, so whatever you think the list shows, make sure the reasoning for each entry is on the page.
reasoning: |-
  Okay, the user is in a metaethics seminar focusing on evolutionary debunking arguments (EDAs) and needs help structuring their term paper. They want to argue that the literature is stuck because opposing sides have different criteria for what counts as a successful response. Their main request is a list of desiderata that any adequate response to EDAs must meet, along with justifications for each. They also want to identify which desiderata might be in tension, which are non-negotiable, and how major responses fare against these criteria.

  First, I need to outline the core components of EDAs. Sharon Street's Darwinian Dilemma is central here, posing that moral beliefs are either influenced by evolution (making them unreliable) or not (which seems implausible). Joyce adds that if evolution explains moral beliefs without truth-tracking, they're unjustified. The user wants desiderata that capture what both realists and anti-realists would require from a response.

  The user mentioned three potential desiderata: explaining why evolutionary origins are harmless without overgeneralizing to bad beliefs; comparing morality to math/perception; and avoiding question-begging. I should expand this list. Possible additions include epistemic robustness (showing beliefs aren't accidental), compatibility with causal closure (if moral facts are non-natural, how do we access them?), and addressing the reliability challenge.

  I recall that third-factor theories (like Enoch's) posit a link between evolutionary advantages and moral truths. Companion-in-guilt arguments compare morality to math or logic. Anti-realist responses reject independent moral facts. Each has weaknesses: third-factor might be ad hoc, companion-in-guilt may not apply equally to morality, and anti-realism concedes too much for realists.

  Key tensions: Explaining reliability without invoking moral facts circularly is tough. If evolution fully explains moral beliefs, how do they track non-natural truths? Also, realists need robust justification, while anti-realists might settle for less. The user suspects some desiderata can't be jointly satisfied—maybe realism requires tracking that's incompatible with evolutionary explanations.

  Non-negotiable desiderata should be minimal, like avoiding circularity and overgeneralization. Epistemic robustness is crucial for realists but not anti-realists. The "vindicate moral knowledge" point is likely a camp commitment.

  For the scorecard: Third-factor responses might meet epistemic robustness but struggle with non-question-begging. Companion-in-guilt works if math is analogous, but debunkers argue morality is different. Anti-realists avoid many issues but fail realist desiderata.

  The user needs clear reasoning for each desideratum to argue their thesis that the debate is stuck due to conflicting standards. Highlighting tensions shows why no response satisfies all sides. They should emphasize that the desiderata list reveals fundamental disagreements, making resolution difficult.
answer: |-
  Here’s a structured list of desiderata for an adequate response to evolutionary debunking arguments (EDAs), with justifications, tensions, and a brief scorecard. I’ve flagged irreconcilable tensions and camp-specific commitments, per your request.

  ---

  ### **Core Desiderata for Any Successful EDA Response**  
  *(Non-negotiable: Must apply to all camps)*  

  1. **Non-Question-Begging Justification**  
     *Requirement:* The response must not presuppose the truth of moral realism, the reliability of moral intuitions, or the existence of objective moral facts.  
     *Motivation:* EDAs challenge the very foundations of moral knowledge; a response that assumes realism (e.g., "we just *see* moral facts") is circular and fails to engage the skeptic.  
     *Tension Alert:* Realists need robust justification, but grounding it without realism is the core challenge.  

  2. **Immunity to Overgeneralization**  
     *Requirement:* The explanation for why evolution doesn’t debunk morality must not equally "protect" uncontroversially unreliable beliefs (e.g., phlogiston theory or racist stereotypes).  
     *Motivation:* If the response excuses moral beliefs via a strategy that also excuses pseudo-science, it’s epistemically bankrupt.  
     *Tension Alert:* Strategies like "evolution favors useful fictions" might save morality but overgeneralize to harmful false beliefs.  

  3. **Evolutionary Plausibility**  
     *Requirement:* The response must take seriously the *complete* causal role of evolution in shaping moral cognition, not just cherry-pick "convenient" elements.  
     *Motivation:* Street’s dilemma forces acknowledgment that adaptive pressures — not truth-tracking — explain moral beliefs. Ignoring this is evasive.  

  ---

  ### **Substantive Desiderata**  
  *(Negotiable: Reflect camp-specific priorities)*  

  4. **Epistemic Robustness** (Realist Priority)  
     *Requirement:* Must show that moral beliefs are *reliably connected* to moral truths (non-accidental, non-coincidental tracking).  
     *Motivation:* Realists need moral knowledge to meet standards akin to perception/math. If evolution explains beliefs fully, tracking seems impossible without a "link."  
     *Camp Commitment:* Anti-realists reject this; constructivists replace "tracking" with practical rationality.  

  5. **Non-Mysterious Faculties** (Naturalist Constraint)  
     *Requirement:* Must explain how moral cognition accesses moral facts without positing implausible faculties (e.g., a "moral sense" immune to evolutionary distortion).  
     *Motivation:* If moral facts are non-natural (as per robust realism), their causal inefficacy makes reliable access inexplicable.  
     *Tension Alert:* Directly clashes with **Epistemic Robustness** for non-naturalists.  

  6. **Discriminatory Power vs. Companions**  
     *Requirement:* Must explain why morality is/is not analogous to mathematics, logic, or perception in evolutionary vulnerability.  
     *Motivation:* Debunkers (e.g., Joyce) argue math/logic *escape* EDAs because their truth affects survival (e.g., "2+2=4" guides action). Moral truths lack this causal efficacy.  
     *Tension Alert:* If morality is like math (necessary truths), **Epistemic Robustness** is easier, but **Evolutionary Plausibility** weakens (did evolution shape logic?).  

  ---

  ### **Irreconcilable Tensions**  
  - **The Tracking Dilemma:** Satisfying **Epistemic Robustness** (non-accidental truth-tracking) + **Evolutionary Plausibility** (evolution explains beliefs via utility, not truth) appears impossible *if* moral facts are causally inert.  
  - **The Naturalist Trap:** **Non-Mysterious Faculties** demands a naturalistic account of moral access, but **Epistemic Robustness** (for non-naturalists) requires non-natural facts. Only naturalist realism (or anti-realism) escapes.  

  ---

  ### **Quick Scorecard: Major Responses**  
  *(Against the 6 Desiderata)*  

  1. **Third-Factor (Enoch):**  
     *Meets:* Evolutionary Plausibility (evolution selects for "reliability"), Discriminatory Power (morality linked to survival like math).  
     *Fails:* Non-Question-Begging (assumes moral realism), Epistemic Robustness (link between survival and moral truth is asserted, not shown).  

  2. **Companion-in-Guilt (Math/Logic):**  
     *Meets:* Immunity to Overgeneralization (math isn’t pseudo-science), Discriminatory Power (if math escapes, so can morality).  
     *Fails:* Discriminatory Power *against it* (evolution shaped morality for cooperation, not abstract truth), Epistemic Robustness (unclear how evolution "locks on" to moral truths).  

  3. **Anti-Realist Escape (Street, Constructivists):**  
     *Meets:* Non-Question-Begging, Evolutionary Plausibility (morality is adaptive construct), Immunity to Overgeneralization.  
     *Fails:* Epistemic Robustness (no "tracking" of independent truths), Discriminatory Power (concedes morality *is* vulnerable vs. math).  

  ---

  ### **Conclusion for Your Thesis**  
  The literature is gridlocked because:  
  - **Realists** demand **Epistemic Robustness**, but it clashes with **Evolutionary Plausibility** and requires question-begging.  
  - **Anti-realists** satisfy **Evolutionary Plausibility** but sacrifice **Epistemic Robustness**, making their "normativity" unrecognizable to realists.  
  - **Companion arguments** blur the **Discriminatory Power** criterion without resolving core tensions.  

  **Result:** The desiderata *are* jointly unsatisfiable for robust non-natural realism. This suggests EDAs succeed against that view or expose a need to revise realism (e.g., naturalize moral facts). Your paper can argue that clarifying these specs reveals why the debate persists: opposing camps prioritize incompatible desiderata.  

  Let me know if you need expansion on specific tensions or responses!
