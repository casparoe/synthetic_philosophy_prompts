prompt: |-
  I'm a journalist who covers science and ideas, and I'm at work on a long-form feature about the philosophy embedded in welfare policy. The practice I keep circling is benefit conditionality as it operates in the UK, the US, and much of Europe: unemployment payments arrive only if the claimant documents a set number of job applications per week, attends appointments, and accepts any "reasonable" offer of work, with financial sanctions imposed for missed interviews or refused placements. Meanwhile, people living on dividends, inheritance, or occupational pensions face no work-search requirements whatsoever, and the same systems that police the unemployed so closely exempt carers and the disabled on grounds that are never stated as an articulated principle. What theory of desert and responsibility does that regime actually presuppose? Does it only make sense on a view where the poor must earn their support in a way the comfortable need not, or is there a reciprocity-based or insurance-based story that would license it — and do the exemptions fit that story or quietly refute it? I'd also want to know where the practice is genuinely underdetermined, such that several rival theories of justice would all permit it, and what would have to change in the regime if its implicit theory were replaced by, say, the view behind an unconditional basic income. Please answer as exactly five numbered points, each one or two sentences long, with no introduction or conclusion, covering in order: the core view of deservingness the regime presupposes, the view of responsibility for unemployment it rests on, which rival theories it quietly rules out, where the practice is philosophically underdetermined, and what a regime built on a different underlying theory would visibly alter.
reasoning: |-
  Okay, the user is a journalist working on a long-form feature about the philosophy behind welfare policy, specifically focusing on benefit conditionality in places like the UK, US, and Europe. They're examining why unemployment benefits require strict conditions like job applications and accepting work offers, while other forms of income like dividends or pensions have no such requirements. The journalist is questioning the underlying theories of desert and responsibility that justify this system. 

  The user wants me to analyze five specific aspects: the core view of deservingness, the view of responsibility for unemployment, which rival theories are excluded, where the practice is philosophically underdetermined, and what changes a different theory like basic income would bring. They want concise answers—exactly five numbered points, each one or two sentences, with no introduction or conclusion.

  First, I need to unpack the core view of deservingness implied by conditional welfare. The regime clearly distinguishes between "idle" unemployed people who must prove effort and asset owners who don't. This seems rooted in a desert-based logic where the poor must actively earn support through labor market participation, unlike passive income recipients. The exemptions for carers and the disabled complicate this but don't negate the core distinction—they're exceptions that reinforce the rule by accepting non-work for "deserving" non-participants.

  Next, the responsibility angle: the system implicitly blames unemployment on individual choices rather than structural factors. By mandating job searches and punishing refusals, it assumes people could find work if they tried hard enough, ignoring systemic barriers. This individualizes responsibility in a way that aligns with neoliberal thinking but clashes with theories emphasizing social causes of joblessness.

  For excluded theories, any framework rejecting desert or labor coercion would conflict with this model. Unconditional basic income, luck egalitarianism (if it questions personal responsibility for unemployment), and strong structural critiques have no place here. Even reciprocity-based arguments struggle because they'd demand symmetrical obligations from all benefit recipients, not just the unemployed.

  On underdetermination: the exemptions create ambiguity. A desert theorist might see carers as "deserving" due to social contribution, while a reciprocity theorist could frame disability as involuntary non-participation. The regime doesn't specify which logic applies, so multiple theories can superficially justify the carve-outs—making the practice compatible with several frameworks at once.

  Finally, shifting to a basic income theory would radically change visible structures: stripping away behavioral conditions and sanctions entirely, treating all citizens equally regardless of income source. This would dissolve the moral hierarchy between "active" and "passive" recipients, fundamentally challenging the current desert-based logic.

  Throughout, I should maintain tight phrasing—each point must be precise yet accessible for a journalistic audience. The contradictions in exemptions (like carers being exempt while unemployed aren't) need highlighting as they reveal the unstated privileging of certain non-work. And I'll emphasize that alternative theories aren't just philosophical alternatives; they'd manifest in tangible policy dismantling the existing architecture of surveillance and punishment.
answer: |-
  Here are the five numbered points as requested:

  1.  **Core View of Deservingness:** The regime presupposes that support is deserved only through active labor market participation or recognized incapacity; passive income recipients are exempt from proving desert, inherently positioning their support as legitimate without effort, unlike the unemployed poor who must *earn* their benefits.
  2.  **View of Responsibility for Unemployment:** It rests on the view that unemployment stems primarily from individual choices and insufficient effort, making individuals responsible for rectifying it through active job search, while largely ignoring structural factors or involuntary unemployment.
  3.  **Rival Theories Quietly Ruled Out:** It implicitly rules out theories rejecting desert-based welfare (like strict unconditional basic income), luck egalitarianism denying personal responsibility for systemic joblessness, and strong structural critiques viewing unemployment as largely involuntary.
  4.  **Philosophically Underdetermined Practice:** The exemptions for carers and the disabled are underdetermined; desert theories (social contribution/incapacity), reciprocity (involuntary non-participation), or insurance principles *could* justify them, obscuring the core inconsistency with passive income exemptions.
  5.  **Visible Alteration Under a Different Theory:** A regime built on unconditional basic income theory would eliminate all behavioral conditions and sanctions entirely, treating cash support as a universal right independent of labor market status or income source, dissolving the moral distinction between recipients.
