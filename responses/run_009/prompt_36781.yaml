answer: |-
  ## Deconstructing the Self in Psychiatric Advance Directives: Justification and Implicit Assumptions

  You've pinpointed a profound philosophical tension at the heart of psychiatric advance directives (PADs), often called Ulysses contracts. The practice *does* implicitly favour certain theories of personal identity over others, and this remains largely unacknowledged in legal and clinical discourse. Let's reconstruct the implicit theory, distinguish necessities from compatibilities, examine the role of retrospective endorsement, and consider the legal implications of alternative identity theories, whilst flagging key philosophical disagreements.

  ### What the Practice Strictly Requires (The Minimalist Core)

  Legally and clinically, PADs require only:
  1.  **Past Competence & Voluntariness:** The directive must be authored when the individual was demonstrably competent (understood risks, benefits, alternatives) and acting voluntarily.
  2.  **Formal Validity:** It must meet jurisdictional formalities (witnessing, sometimes legal advice).
  3.  **Applicability:** The *current* state must match the conditions specified in the directive (e.g., a severe psychotic or manic episode impairing decision-making capacity as defined clinically).
  4.  **Best Interests/Least Restriction:** Treatment administered under the directive should still conform broadly to best interests principles and use the least restrictive alternative.

  **Crucially, the law does *not* explicitly require or endorse any particular metaphysical theory of personal identity.** It operates pragmatically on the basis of **biological continuity** and **past expressed wishes made during competence**, sidestepping the "who is the real self?" question directly.

  ### The Implicit Theory & Compatible Philosophical Views

  While the law avoids metaphysics, the *standard justification* you mention – the "authentic past self vs. usurping ill self" – clearly leans towards specific views:

  1.  **Narrative Identity View (e.g., influenced by Dennett/MacIntyre):**
      *   **Compatibility:** Highly compatible, perhaps the most natural fit for the justification. The directive's author is the "narrator" or "protagonist" establishing the overarching life story and values. The psychotic episode is seen as an interruption, a "break in the narrative," where the person cannot coherently author their story. Enforcing the directive restores narrative continuity and agency *over time*.
      *   **Dennett's Role:** His "centre of narrative gravity" is a powerful metaphor illustrating how we construct a unified self from disparate psychological states and events. It *does* substantive work here: it provides a framework for understanding why the *coherent, value-expressing past self* (the established narrative centre) holds authority over the *fragmented, incoherent present self* (where the narrative gravity has dissolved). It's more than *just* a metaphor; it offers a conceptual tool for privileging the temporally extended, value-projecting self over the momentary, impaired state. However, philosophers disagree on whether narrative identity is constitutive of selfhood or merely descriptive (a live debate).

  2.  **Parfitian Reductionism / Psychological Connectedness/Continuity:**
      *   **Compatibility:** Highly compatible. If personal identity isn't what matters fundamentally, but rather the degree of connected psychological states (memories, beliefs, values, intentions), then the past competent self shares significant psychological connections (especially valued-based intentions) with the future recovered self, but minimal connection with the acutely psychotic self. The directive honours the strongest relevant connections (past-future) over the weak or distorted connections of the present psychotic state. What matters is preserving the psychological continuity required for the person to realise their long-term values and life plan.

  3.  **Lockean Psychological View (Stricter):**
      *   **Compatibility:** Problematic. If personal identity *is* constituted by psychological continuity (memory, consciousness), the acutely psychotic self, experiencing a radical break in consciousness and memory linkage, might be seen as a *different* person from the directive author. Overriding the refusal of this "new" person based on the prior person's directive becomes highly ethically dubious, akin to forcing treatment on one person for another's benefit. The practice struggles under a pure Lockean view.

  4.  **Present-Experience/Somatic View:**
      *   **Compatibility:** Incompatible. If the core ethical concern is solely the experiential subject *here and now* – the being experiencing distress, coercion, and potential side-effects – then their contemporaneous refusal must be paramount. The past self's wishes are irrelevant to the present subject's rights and interests. This view would forbid PAD enforcement during refusal.

  **Implicit Theory Summary:** The practice *presupposes* that **identity or morally relevant continuity extends over time in a way that justifies binding future (impaired) states with past (competent) decisions**. It implicitly rejects the view that the present experiential subject, solely by virtue of being present, holds absolute and unoverridable authority when profoundly impaired in ways specified by their own prior judgement. It leans towards theories emphasising **temporal extension, value coherence, and psychological connection over strict identity-at-a-moment**.

  ### Where it Remains Underdetermined & The Role of Retrospective Endorsement

  The practice *is* underdetermined regarding:
  *   **The *Degree* of Connection Required:** How similar must the recovered self be to the directive author for the justification to hold? Parfitians debate this threshold.
  *   **The Nature of the "Break":** Does the justification *only* work for conditions causing specific, profound impairments in value coherence and reasoning (like psychosis/manic episodes), or could it extend to other states? The standard justification relies heavily on the "usurper" metaphor implying a radical discontinuity specific to severe mental illness.
  *   **The Weight of Retrospective Endorsement:** This is a crucial pragmatic and ethical point. If patients consistently endorse the intervention *after* recovery ("I'm glad you did that"), does this justify the practice *regardless* of underlying identity theory?

      *   **Can it Neutralise Identity?** Proponents argue yes: retrospective endorsement validates the intervention as consistent with the person's *overall* autonomy and values over time, rendering the metaphysical identity debate moot for practical purposes. It demonstrates that the directive successfully served the person's long-term interests as they themselves define them post-recovery.
      *   **Critiques:** Opponents counter that retrospective endorsement:
          *   Doesn't negate the violation of the *present* self's refusal at the time.
          *   Might be influenced by gratitude for recovery rather than validating the identity assumption.
          *   Cannot be guaranteed in advance; what if a patient *doesn't* endorse it later? The justification must hold *at the time of enforcement*.
          *   Risks instrumentalising the suffering present self for the benefit of the future self.
      *   **Status:** Retrospective endorsement is a powerful *supplemental* justification widely relied upon in practice and seen as mitigating ethical concerns. However, most philosophers would argue it *complements* rather than *replaces* the core identity/continuity justification; it doesn't fully resolve the underlying metaphysical and ethical tension about authority *during* the episode. The practice still requires the initial assumption that the past self has legitimate authority over that future impaired state.

  ### Legal Implications Under Different Identity Theories

  Rebuilding the law on explicit identity theories would cause significant shifts:

  1.  **Strict Lockean Psychological View:**
      *   **Change:** PADs authorising treatment *against contemporaneous refusal* during severe impairment would likely become legally invalid or ethically impermissible. The present psychotic self would be viewed as a distinct person whose refusal must be respected. PADs might only guide treatment *if* the patient lacked any coherent refusal/wishes *at all*, or become purely advisory.
      *   **Challenge:** Defining the precise threshold where psychological discontinuity creates a "new person" is deeply problematic.

  2.  **Pure Present-Experience/Somatic View:**
      *   **Change:** Similar to Lockean view. Contemporaneous refusal would be absolute. PADs could only express wishes when the person is *already* incapable of refusal, or be used for future *non*-refusal situations (e.g., choosing a hospital). Enforcement against refusal would be legally barred as a fundamental rights violation of the current experiential subject.

  3.  **Parfitian Reductionism (Emphasizing Connectedness):**
      *   **Change:** The law might need to incorporate more explicit assessments of *degree* and *type* of psychological connectedness between the directive author and the current state. Enforcement might only be justified if the impairment involves a *severe rupture* in the psychological connections relevant to the decision (e.g., loss of core values, inability to reason consistently). A simple refusal based on intact but different values might not be overridable. Legal tests could become more complex and psychological.
      *   **Focus:** Shifts emphasis from "competence/incapacity" as a binary towards "degree of impairment in value-connectedness relevant to this specific decision".

  4.  **Narrative Identity View:**
      *   **Change:** Less drastic change from current practice, as the narrative view underpins much of the existing justification. However, the law might place greater emphasis on ensuring the directive reflects the person's *core narrative and values* (not just specific treatment choices) and assessing whether the current state represents a true *rupture* in their narrative capacity. Courts might scrutinise whether the current refusal genuinely stems from the illness disrupting the narrative or expresses a coherent (even if impaired) chapter.
      *   **Focus:** Reinforces the need for thorough exploration of values and narrative context during directive creation.

  5.  **Biological/Animalist View (Identity as Biological Life):**
      *   **Change:** Could potentially *strengthen* PADs, as the living human organism is the same entity throughout. The past competent mind's instructions for the future organism, even when its mind is impaired, might hold strong sway. However, it might struggle to explain why PADs are prioritised *only* in psychiatric contexts and not for other impairments if the biological entity is primary. Might lead to broader use of advance directives overriding refusal in other severe cognitive impairments.

  ### Conclusion

  The practice of enforcing psychiatric advance directives against contemporaneous refusal implicitly favours theories of the self that prioritise **temporal extension, psychological continuity/connectedness, and the authority of past value-based decisions** made during competence. It leans strongly on **narrative** or **Parfitian reductionist** frameworks to justify overriding the present experiential subject, framed as an "inauthentic usurper" or a state of radically diminished connection. While retrospective endorsement provides significant practical and ethical support, it doesn't fully resolve the core identity dilemma or negate the need for the initial assumption of temporal authority.

  The law currently operates on a minimalist, pragmatic basis of biological continuity and prior competent wishes, avoiding explicit metaphysics. However, rebuilding it on explicit identity theories would lead to profound changes: potentially invalidating the practice under Lockean or Present-Experience views, requiring nuanced psychological connectedness assessments under Parfitianism, reinforcing narrative coherence under the Narrative view, or potentially expanding scope under a Biological view. The lack of philosophical consensus on personal identity ensures that the ethical justification of Ulysses contracts will remain a contested, yet crucial, area where law, psychiatry, and metaphysics intersect. Dennett's "centre of narrative gravity," whilst a potent metaphor illuminating the practice's logic, remains itself a contested concept within these ongoing debates.
