prompt: |-
  I have been keeping a private list of my gut reactions to unrealistic assumptions in scientific models, in the hope of finding a rule behind them, and so far the list has rules that apply to some of my cases. Treating a planet as a point mass when computing orbits: fine. Ignoring friction on an inclined plane: fine, and I notice I don't even object when the friction is quietly dropped rather than added back in later. Assuming consumers are perfectly rational and always pick what best serves their interests: fine, even though almost no consumer is like that. Assuming a market is perfectly competitive, with enough buyers and sellers that no single one can move the price: fine. But a model of a whole economy that assumes the government always acts in the public interest: not fine, I dismiss it straightaway. An epidemic model that assumes everyone complies with quarantine rules perfectly: not fine, it seems to have quietly assumed away the thing it was supposed to explain. And then the pair I cannot reconcile: a traffic model in which every driver always takes the fastest route and never hesitates, detours, or gets lost — fine, even though it is wildly false about people; while a model of elections in which voters are perfectly informed about the candidates — not fine, somehow, or at least much less fine. My tentative thought is that an assumption becomes objectionable when it smuggles in the model's answer rather than merely clearing the way for the question, but I cannot make that precise enough to tell me which side of the line the traffic model and the election model really fall on. Is there a principle that captures all of these verdicts? If so, please state it as precisely as you can, show what it says about the two cases I flagged as difficult, and tell me honestly which of my verdicts, if any, it forces me to give up.
reasoning: |-
  Okay, the user is grappling with a fascinating philosophical and methodological problem in scientific modeling. They've noticed that some unrealistic assumptions feel acceptable while others trigger immediate objections, and they're searching for an underlying principle. Their examples range from physics to economics to epidemiology, showing they're thinking across disciplines - that's impressive. 

  The core tension they're wrestling with is between two pairs: traffic models with perfectly rational drivers (which they accept) versus election models with perfectly informed voters (which they reject). Their proposed "smuggling the answer" criterion is insightful but fuzzy. I need to help them refine this.

  Hmm... looking at their cases, the acceptable assumptions all seem to be about removing "noise" to study fundamental mechanisms: point masses reveal gravitational laws, frictionless planes show Newtonian dynamics. But the objectionable cases involve assuming away the actual phenomenon under study - like assuming perfect quarantine compliance when studying quarantine effectiveness. That's circular!

  For the traffic model, even though human irrationality exists, the core phenomenon (congestion patterns) might emerge from route-choice algorithms alone. Whereas in elections, perfect information isn't just simplifying - it eliminates the very thing (information asymmetry) that shapes voting behavior. 

  I should also address their concern about giving up verdicts. Their consumer rationality assumption in economics might need rethinking - behavioral economics shows that irrationality fundamentally alters market outcomes. But their frictionless plane example still holds because friction is truly secondary there. 

  The key is distinguishing between assumptions that isolate mechanisms versus those that pre-determine outcomes. I'll formulate this as a "phenomenon isolation principle" and test it against their borderline cases. They're clearly comfortable with nuance, so I can acknowledge where their intuitions might need adjustment without being dogmatic.
answer: |-
  Your intuition about "smuggling in the answer" is remarkably sharp. The principle you're seeking is the **Phenomenon Isolation Principle**:

  **An unrealistic assumption is methodologically acceptable if it isolates the core mechanism or relationship under investigation by removing confounding factors *without* assuming away the phenomenon itself, its key causes, or its essential constraints. An assumption is objectionable if it *directly assumes* or *trivially guarantees* the outcome the model purports to explain, or if it removes an essential element central to the phenomenon's behavior.**

  Let's break this down and apply it to your cases:

  **Acceptable Assumptions (Fine):**
  1.  **Point Mass Planet:** Isolates gravitational mechanics. Planetary size/complexity confounds orbital calculation but isn't the core phenomenon (gravity + motion).
  2.  **Ignoring Friction:** Isolates Newtonian kinematics/dynamics. Friction is a confounding force, not the core phenomenon (inertia, force, acceleration).
  3.  **Perfectly Rational Consumers:** Isolates supply/demand logic and equilibrium concepts. Bounded rationality confounds predictions but isn't the core mechanism of price formation *in competitive markets*. The model explores *how* prices *could* form ideally.
  4.  **Perfectly Competitive Markets:** Isolates price-taking behavior and efficiency. Market power confounds but isn't the core phenomenon of price discovery under atomistic competition.
  5.  **Traffic Model (Perfect Routing):** Isolates the emergent properties of route choice and congestion dynamics in a network. Human error/hesitation confounds prediction but isn't the *core mechanism* generating congestion patterns or equilibrium flow distribution. The model explores *how* congestion *arises* and *equilibrates* from rational (if unrealistic) route choices.

  **Objectionable Assumptions (Not Fine):**
  1.  **Government Always Acts in Public Interest:** Directly assumes the outcome (optimal policy) the model should explain *how* governments *do* or *could* act. It removes the core political mechanism (conflicting interests, incentives, institutions) central to understanding government behavior in an economy.
  2.  **Perfect Quarantine Compliance:** Assumes away the phenomenon (non-compliance) that is a *key determinant* of epidemic spread and the *central challenge* quarantine aims to address. It trivially guarantees the model's success by removing its main variable.
  3.  **Elections with Perfectly Informed Voters:** Assumes away an *essential element* central to the phenomenon of voting behavior and electoral outcomes – the cost, difficulty, and strategic implications of acquiring and processing political information. Information asymmetry *is* a core mechanism driving campaigns, voting heuristics, polarization, and potentially the outcome itself.

  **Applying the Principle to Your Difficult Cases:**

  1.  **Traffic Model (Perfect Routing - Fine):**
      *   **Core Phenomenon:** Emergence of congestion patterns, equilibrium traffic flow, network performance under selfish routing.
      *   **Assumption:** Perfect rationality/knowledge in route choice.
      *   **Analysis:** While wildly unrealistic about human drivers, this assumption *isolates* the mechanism of selfish route choice and its network-level consequences. Human error *confounds* this mechanism but isn't the phenomenon itself. The model successfully reveals how congestion can arise *even if* everyone is perfectly rational, demonstrating Braess's paradox, etc. It doesn't *assume away* congestion; it *explains* how it emerges from the interaction of many agents pursuing individual goals.

  2.  **Election Model (Perfectly Informed Voters - Not Fine):**
      *   **Core Phenomenon:** How voters make choices and how those choices aggregate to determine electoral outcomes.
      *   **Assumption:** Perfect information about candidates.
      *   **Analysis:** Voter information (its acquisition, cost, asymmetry, manipulation) is *not* a confounding factor; it is *fundamental* to the phenomenon of voting behavior and electoral competition. Assuming it away removes a core mechanism driving voter decisions (reliance on cues, party ID, media influence), candidate strategies (messaging, advertising, obfuscation), and potentially the outcome (e.g., the impact of misinformation campaigns). A model assuming perfect information doesn't just simplify; it *assumes away* a primary cause of the behavior it purports to model. It smuggles in the answer by guaranteeing voters can always identify the "best" candidate according to the modeler's criteria, bypassing the real-world process of political information processing.

  **Which Verdicts Does the Principle Force You to Reconsider?**

  The principle largely validates your judgments but suggests reconsidering one:

  1.  **Perfectly Rational Consumers (Fine):** This is the most borderline under your principle. The core phenomenon in many economic models *is* market equilibrium and price formation. Bounded rationality *can* fundamentally alter the core mechanism (e.g., creating persistent biases, market failures, bubbles that rational models cannot explain). While often a useful simplifying assumption for *some* questions (e.g., basic supply/demand logic), your principle suggests it becomes *more objectionable* when the model purports to explain phenomena *where irrationality is the driving force* (e.g., herd behavior, specific market anomalies). Your initial "fine" verdict holds for *isolating basic market logic*, but the principle highlights its limitations and potential to "smuggle in" equilibrium outcomes when explaining real-world behavior heavily influenced by irrationality.

  **Conclusion:**

  The **Phenomenon Isolation Principle** captures your intuitions well. Unrealistic assumptions are tools. They are valid when they remove scaffolding to reveal the underlying structure of the phenomenon. They are invalid when they dismantle the structure itself or pre-install the desired result. The traffic model succeeds by isolating congestion dynamics *despite* the unrealistic driver assumption. The election model fails because assuming perfect information removes the very foundation (imperfect information processing) upon which voter behavior and electoral competition are built. Your "smuggling the answer" intuition hits the nail on the head: assumptions that directly guarantee the outcome or remove its essential causes are methodologically suspect.
