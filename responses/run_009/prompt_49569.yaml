  First, I recall the key facts from the query: SBF studied at MIT, worked at Jane Street, founded Alameda and FTX, committed to donating his wealth, and was seen as the ideal earning-to-give example in EA circles. FTX collapsed in November 2022 due to fraud involving customer funds, leading to the evaporation of the FTX Future Fund and financial chaos for EA-aligned organizations. SBF was convicted, and EA groups quickly distanced themselves.

  Now, I need to run the analysis for each critique in both directions—explaining what it illuminates and what it misses—and evaluate the strongest EA defense. Then, reach a definite conclusion.

  Starting with critique (a): earning-to-give. This model suggests that talented people should take high-paying jobs to donate more. SBF embodied this, and his fraud led to massive harm instead of good. The critique explains how this model can backfire if the earning involves unethical risks, as seen in SBF's high-stakes behavior. However, it misdescribes or is silent about whether EA encouraged such recklessness; EA didn't endorse fraud, so this might be an anomaly where the model failed due to individual corruption, not the idea itself. The episode confirms a vulnerability in earning-to-give but doesn't refute it entirely, as the defense points out that fraud isn't unique to EA.

  Moving to critique (b): institutional critique. This argues that EA legitimizes harmful systems by operating within them. SBF's rise in crypto, a largely unregulated space, and his use of philanthropy to build credibility exemplify this. The critique explains how EA's association lent legitimacy to FTX, making the collapse damaging to the movement. It's silent on whether EA could have influenced reforms, but the episode shows how EA's focus on individual donations overlooked systemic risks, confirming this critique strongly. The defense that EA was a victim doesn't blunt this, as the critique is about complicity before the crash.

  For critique (c): measurability bias. This is the concern that quantifiable causes get more attention, potentially neglecting important but hard-to-measure areas. In SBF's case, his crypto wealth was measurable, but the fraud and collapse were unpredictable black swans. The critique explains why EA might have favored him—his donations were large and trackable—but it misdescribes the actual failure, which was about transparency and ethics, not measurement. This episode is more of an anomaly for measurability bias; it doesn't directly confirm it, as the core issue wasn't about misallocated funds due to metrics.

  Synthesizing, the institutional critique seems most strongly supported because it directly addresses how EA's involvement with SBF legitimized flawed institutions, leading to broader harm. The earning-to-give critique is partially confirmed but has limitations, and measurability bias is less relevant here. The strongest EA defense—that they were victims and disavowed him quickly—doesn't fully counter the institutional critique, as the prior legitimization was key.

  Final conclusion: the institutional critique is the best fit, so the answer should be "institutional critique".
answer: |-
  ### Analysis of FTX Collapse as an EA Case Study

  #### **1. Earning-to-Give Critique**  
  *Definition:* The model encourages talented individuals to pursue high-income careers (e.g., finance, tech) to maximize charitable donations, assuming this generates more social good than direct work in nonprofits.  

  **What it explains:**  
  - SBF exemplified this model: His physics/MIT background, Jane Street trading, and crypto entrepreneurship were framed as optimal paths to fund EA causes. His pledge to donate >99% of his wealth made him an EA icon.  
  - The collapse reveals a core vulnerability: **Concentrated risk**. By staking everything on a volatile, loosely regulated industry (crypto), SBF’s failure didn’t just reduce donations—it actively harmed EA (e.g., vaporized Future Fund grants, reputational damage).  
  - Highlights how earning-to-give can incentivize **moral licensing**: The "greater good" justification may rationalize ethical compromises (e.g., SBF’s "ends justify the means" approach to risk-taking).  

  **What it misdescribes or is silent about:**  
  - Silent on **fraud**: EA never endorsed illegality. SBF’s theft of customer funds was a crime, not a philosophical failure.  
  - Misdescribes **risk tolerance**: SBF’s "bet everything" ethos stemmed from personal recklessness and utilitarian calculations *misapplied* (e.g., ignoring tail risks), not EA doctrine. EA typically advocates evidence-based caution.  

  **Episode’s verdict on the critique:**  
  - **Partial confirmation**. The model’s reliance on hyper-profitable industries amplifies systemic and reputational risks. However, SBF’s fraud is an **anomaly**—most earning-to-give practitioners don’t commit crimes.  
  - **EA defense**: Fraud occurs in finance regardless of philanthropy. EA disavowed SBF swiftly and was a victim.  
    - *Why it’s insufficient*: The critique isn’t about fraud *per se*, but how earning-to-give concentrates influence in high-risk sectors. EA’s celebration of SBF *before* the collapse reflects poor due diligence—a flaw in the model’s implementation.  

  ---

  #### **2. Institutional Critique**  
  *Definition:* EA focuses on individual donations or projects without challenging—and may inadvertently reinforce—damaging systems (e.g., capitalism, regulatory gaps) by operating within them.  

  **What it explains:**  
  - **Legitimization by association**: SBF used EA philanthropy to build credibility ("ethically minded billionaire"), attracting investors, regulators, and media. This "halo effect" masked FTX’s shaky governance.  
  - **Institutional blindness**: EA celebrated SBF’s donations while ignoring crypto’s structural flaws (e.g., weak oversight, conflict-prone vertical integration of Alameda/FTX). No major EA push for crypto regulation occurred.  
  - **Systemic harm**: When FTX imploded, it destabilized crypto markets and triggered global regulatory crackdowns—harm far exceeding the good of SBF’s donations.  

  **What it misdescribes or is silent about:**  
  - Silent on **direct causation**: EA didn’t cause fraud. SBF’s actions were independent.  
  - Misdescribes **EA’s scope**: Some EA work *does* target institutions (e.g., policy advocacy). But this was underemphasized in SBF’s case.  

  **Episode’s verdict on the critique:**  
  - **Strong confirmation**. EA’s embrace of SBF lent moral cover to a toxic system, and the movement’s neglect of institutional integrity (e.g., corporate governance) amplified fallout. The critique correctly identifies EA’s failure to mitigate systemic risk.  
  - **EA defense**: EA was a victim, not a perpetrator.  
    - *Why it’s insufficient*: The critique isn’t about intent but *complicity*. By benefiting from SBF’s wealth without scrutinizing his ecosystem, EA legitimated a destructive industry. Disavowing him post-collapse doesn’t undo pre-collapse reinforcement.  

  ---

  #### **3. Measurability Bias Critique**  
  *Definition:* EA prioritizes causes with quantifiable outcomes (e.g., malaria nets) over "messier" issues (e.g., institutional reform), leading to skewed resource allocation.  

  **What it explains:**  
  - **Why SBF was lionized**: Crypto wealth was highly measurable (e.g., "$46B net worth!"), and his donations targeted quantifiable EA causes (e.g., AI safety, global health). This overshadowed unquantifiable risks like corporate ethics or regulatory exposure.  
  - **Post-collapse pain**: Future Fund grants focused on measurable outputs (e.g., "X lives saved"), leaving grantees stranded when funds vanished. Less measurable priorities (e.g., governance audits) were underfunded.  

  **What it misdescribes or is silent about:**  
  - Silent on **fraud**: No metric could predict SBF’s criminality; this was a governance/ethics failure.  
  - Misdescribes **EA’s role**: SBF’s focus on measurable wins wasn’t uniquely EA—it’s common in philanthropy. EA *does* support "hard-to-measure" work (e.g., policy advocacy), but these were deprioritized in SBF’s approach.  

  **Episode’s verdict on the critique:**  
  - **Anomaly/overfit**. Measurability bias explains EA’s attraction to SBF’s wealth but not the collapse itself. The fraud was a **black swan event** unrelated to measurement.  
  - **EA defense**: All philanthropies favor measurable impact; EA’s transparency about this is a strength.  
    - *Why it’s insufficient*: While true, the episode reveals how measurability bias can exacerbate fragility. EA’s reliance on a single volatile donor amplified systemic risk—a blind spot in cost-benefit analyses.  

  ---

  ### Conclusion  
  The FTX collapse **most robustly supports the institutional critique**. EA’s failure to address the corrosive systems enabling SBF—while profiting from them—turned philanthropy into a legitimizing tool. When FTX imploded, EA suffered collateral damage *because* it was embedded in those systems.  

  The earning-to-give critique is partially valid but overemphasized; SBF’s fraud was criminal, not philosophical. Measurability bias played a minor role but didn’t cause the crisis.  

  **Strongest EA defense rebuttal**: EA’s victimhood and swift disavoval don’t negate the institutional critique. The pre-collapse embrace of SBF highlights how EA’s theory of change can neglect institutional integrity, making it vulnerable to bad actors operating in broken systems.  

  \answer{institutional critique}
