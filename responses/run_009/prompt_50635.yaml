answer: |-
  Here's a translation of the psi-ontology debate into your experimental vocabulary, followed by a residue analysis, the PBR assessment, and a committed verdict with its weak spot explicitly stated.

  **Core Translation: Bench Language Only**
  - **State Preparation Procedure:** The reproducible method to configure your apparatus (e.g., monochromator crystal alignment, sample environment control, chopper timing) to initialize a system for measurement. Defines the *input ensemble*.
  - **Ensemble:** The statistical collection of identical preparation procedures, yielding many "runs" under identical nominal conditions.
  - **Run-to-Run Statistics:** The distribution of detector counts (or scattering angles, energies) across many runs of the *same* preparation procedure. Characterized by expectation values and variances.
  - **Wavefunction (ψ):** The *mathematical object* used to predict the run-to-run statistics for any future measurement on an ensemble prepared by a specific procedure. Encodes probabilities for detector outcomes.
  - **Fitted Model:** The parameterized function (e.g., theoretical cross-section convolved with resolution) you fit to your experimental histogram data. Represents your *best operational summary* of the ensemble's behavior.
  - **Latent Variable:** A hypothesized *unmeasured physical property* of individual systems within the ensemble (e.g., a "true" pre-existing neutron spin orientation), assumed to exist independently of your preparation or measurement, causing the observed statistics.

  **Psi-Epistemic Position (Your Bench Analogy: Fitted Model)**
  *   ψ is *like your fitted scattering model*. It's a *compressed statistical summary* of the information gained from characterizing the **state preparation procedure**. It tells you the expected detector counts for any future measurement configuration.
  *   Different preparation procedures (e.g., different sample magnetizations) might correspond to *overlapping statistical distributions* in some hypothetical latent variable space, just like two different physical samples might produce histograms that overlap significantly after background subtraction and resolution convolution. ψ represents *your knowledge* (based on calibration runs) about what outcomes are probable, not a direct physical attribute of individual neutrons or samples. It's "about the preparation," not "in the sample."

  **Psi-Ontic Position (Your Bench Analogy: Prepared Sample)**
  *   ψ corresponds directly to a *physical state of the individual system* (e.g., the neutron or sample ensemble), analogous to the *actual prepared sample* sitting in your beamline before you take data. It exists independently of your later measurements or data fitting.
  *   A unique preparation procedure produces a unique physical state ψ. Different preparation procedures produce *distinct physical states*, even if they predict *some* overlapping statistics for specific measurements. There are *no latent variables* that explain the outcomes more fundamentally; ψ *is* the fundamental physical description. The wavefunction is "in the apparatus/sample," not just "in your lab notebook."

  **Residue Report: Mapping Philosophical Concepts to Bench Practice**
  1.  **Cleanly Mapped Concepts:**
      *   **State Preparation/Ensemble:** Directly equivalent. Central to both philosophy and experiment.
      *   **Run-to-Run Statistics/Expectation Values:** The core empirical data predicted by ψ. Uncontroversial mapping.
      *   **ψ as Predictive Tool:** Both sides agree ψ predicts statistics. Mapped cleanly to fitting a model to data.
      *   **Latent Variables:** Directly analogous to hidden properties hypothesized to explain statistics (e.g., "true" spin). Psi-epistemic views often rely on these; psi-ontic views explicitly reject them.
      *   **Distinction (Fitted Model vs. Physical Sample):** This is *the core distinction* driving the entire debate. The epistemic view maps ψ to the fitted model; the ontic view maps ψ to the physical sample.

  2.  **Mapped with Distortion:**
      *   **"Knowledge/Information":** On the bench, this meant "calibration data," "characterization runs," "uncertainty estimates," "background subtraction protocols," and the *predictive power* of your fitted model. Translating philosophical "knowledge" *strictly* into these operational terms avoids mentalistic connotations but loses some generality philosophers discuss. The distortion is minimal if "information" means *compiled experimental characterization data*.
      *   **"Belief/Warranted Assertion":** Best mapped as "model confidence based on χ², error bars, reproducibility, and consistency with established theory." The distortion comes from removing the *subjective* element philosophers sometimes emphasize, focusing purely on *quantitative confidence intervals derived from data analysis*.

  3.  **No Direct Counterpart:**
      *   **Fundamental "Observer" or "Mind":** Your bench work involved physicists as *operators* performing procedures and analyzing data, not as fundamental components *in* the quantum description. "Observer" just meant "detector." This philosophical baggage doesn't map.
      *   **Abstract "Reality" vs. "Phenomena":** You dealt with *operationally defined preparations, measurements, and statistics*. The deeper question of what these phenomena "ultimately represent" beyond the operational level has no direct experimental counterpart. Your vocabulary describes *what you do and measure*, not metaphysics.

  **PBR Theorem (2012) in Bench Terms**
  *   **The Setup:** Consider *two distinct, mutually exclusive preparation procedures* (A and B) defined in your lab (e.g., two different well-calibrated polarized neutron sources). Each has its own ψ_A and ψ_B.
  *   **The Independence Assumption (Bench Translation):** If you physically combine systems prepared by procedure A and procedure B *on separate, isolated devices* (using independent power supplies, shielding, etc., verified by control measurements), then the *joint physical state* of the combined system should be *factorable*. There should be *no hidden cross-correlations* between the systems introduced by the preparation process itself, beyond what the preparation specifications dictate. This assumes the "latent variables" (if they exist) for system A are statistically independent of those for system B when prepared independently.
  *   **The Theorem's Punchline:** Quantum mechanics predicts statistics for certain cleverly chosen *joint measurements* on the combined system that are *incompatible* with the assumption that ψ_A and ψ_B merely represent overlapping probability distributions over the *same set of latent variables* (the psi-epistemic view), *if* the independence assumption holds.
  *   **Conclusion in Your Terms:** If you accept that your independent preparation devices (A and B) truly produce factorable physical states with no hidden correlations (verified operationally to the best of your ability), then the wavefunctions ψ_A and ψ_B *cannot* simply be statistical summaries of the *same underlying latent variable space* describing the individual systems. They must correspond to *distinct physical realities* associated with the preparation itself (psi-ontic).
  *   **Assessment of Independence Assumption:**
      *   **Natural Constraint?** *Yes, from your bench perspective.* Characterizing devices independently and assuming no spurious cross-talk unless measured is standard practice (e.g., calibrating two detectors separately). You *demand* this independence when designing experiments; violating it would imply faulty setup or unknown physics. PBR requires you to *extend* this principle to the hypothetical latent variables.
      *   **Substantive Concession?** *Potentially, but operationally reasonable.* You might argue that "latent variables" could be nonlocal or contextual in ways your control measurements can't detect. However, *within the scope of characterizing your preparation devices*, the independence assumption reflects standard operational practice. Refusing it feels like special pleading *against* standard device characterization principles.
  *   **Does the Conclusion Mean What Realists Say?** *Largely yes, in your terms.* If you grant the independence of your prep devices, then ψ is more than just a summary of run statistics for a *single* device. It directly reflects a physical aspect of the *prepared system itself* that distinguishes it from other preparations, even when considering joint systems. It pushes ψ towards your "prepared sample" analogy and away from *only* your "fitted model" analogy.

  **The Unmappable Residue & Your Vocabulary's Scope**
  The residue points to the question: **What is the ontological status of the "physical state" corresponding to a preparation procedure?** Your vocabulary describes procedures, statistics, models, and latent variable hypotheses *within* an operational framework. It doesn't dictate whether the "prepared sample" state described by ψ (per the ontic view post-PBR) is:
  *   A **fundamental entity** (the wavefunction itself is real),
  *   A **property** of the system within a deeper theory (like density in a fluid),
  *   Or something **irreducibly statistical** but still "out there" (like a temperature field).

  Your vocabulary is *limited* to describing *how* you prepare, measure, and model. It is agnostic on the *ultimate nature* of what you are preparing. This silence reflects neither a flaw in your vocabulary nor pure unclarity in the dispute. It reflects that the dispute *starts where operational description ends*. Your vocabulary excellently frames the *empirical consequences* (via PBR), but the final step ("What *is* ψ?") requires an interpretive leap beyond direct experimental data.

  **Committed Verdict: Psi-Epistemic (With a Major Caveat)**

  Based on your operational perspective and the translation, **the psi-epistemic view, understood strictly as ψ being a *compressed statistical summary of preparation-derived information* (like your fitted model), is more fundamentally correct.**

  *   **Reasons:**
      1.  **Primacy of Preparation & Measurement:** ψ is *defined* by the preparation procedure and *verified* by measurement statistics. It has no operational meaning outside this context. You never *measured* ψ; you inferred it from counts. This aligns perfectly with ψ being "information about the preparation."
      2.  **The Fitted Model Analogy is Stronger:** Your fitted scattering model was *always* a summary of data, incorporating resolution, background, and theory. ψ functions identically: it summarizes preparation info to predict detector statistics. Treating it as a physical object like the sample itself adds a layer not required by the data.
      3.  **Latent Variables are Natural (Even if Rejected by QM):** Thinking in terms of hypothetical latent variables (e.g., "what *would* explain spin correlations?") was a natural part of model building and error analysis, even if QM forbids them. The epistemic view accommodates this mode of thought conceptually.
      4.  **PBR's Limitation:** While PBR forces a distinction incompatible with *naive* epistemic views using a *single shared latent space*, it doesn't kill the core idea. More sophisticated epistemic models (e.g., quantum Bayesism, preparation contextual) can accommodate PBR by making the "information" or "state" explicitly dependent on the *whole experimental context* (including future possible measurements), not just a fixed latent space. This contextuality feels more like refining your fitted model based on the *entirety* of your calibration data and potential future beamline configurations, rather than abandoning the model-summary concept.
      5.  **The "Physical State" Ambiguity:** Granting PBR under independence shows ψ isn't *just* a summary for a single device – it has consequences for joint systems. However, calling this "physical" is ambiguous. Does "physical" mean "directly measurable"? (No). "Causally efficacious"? (Yes, via predicted statistics). "Non-information-theoretic"? (Unclear). The epistemic view can acknowledge ψ's role in predicting complex (e.g., entangled) statistics without reifying it as a "thing" like the sample.

  **Strongest Objection to This Verdict (The Weak Spot):**

  *   **The Irreducible Holism/Nonlocality of Entanglement:** Your bench dealt with ensembles and statistics. However, quantum entanglement describes *correlations between spatially separated systems* (e.g., two neutrons) that defy explanation via any local latent variables or pre-existing properties (Bell's Theorem). PBR reinforces this for the wavefunction itself. The most straightforward interpretation of these *operationally verified, preparation-dependent correlations* is that ψ *does* represent a holistic physical state of the *entire system* (the "prepared sample" in a joint sense), not just information local to each part. Refusing to call this "physical" feels like denying the operational reality of the nonlocal correlations your measurements would reveal. This holism is the hardest aspect for a purely "information-summary" view to accommodate *without* smuggling in something ontological about the joint state. Your vocabulary *can* describe the preparation of entangled states and their measured statistics, but the *nature* of the connection enabling those statistics pushes towards the ontic view of the joint ψ.

  **In essence:** From the bench, ψ is fundamentally a tool for compressing preparation information to predict statistics. PBR shows this tool has surprising, non-local consequences when combining independently prepared systems, forcing us to treat the joint ψ as more than just separate summaries. However, treating ψ as a direct physical entity like your sample adds an unnecessary layer not demanded by the operational core. The biggest challenge is the holistic "thingness" implied by entanglement correlations, but even this can be seen as a complex feature of the *information* derived from the preparation context, not proof of a wavefunction substance.
