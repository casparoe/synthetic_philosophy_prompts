  The PBR theorem is crucial here. Their independence assumption about preparation devices translates directly to experimental practice - when we characterize sources separately, we assume no hidden cross-calibration. But is this assumption safe? In neutron experiments, we'd verify device isolation through control measurements, but quantum nonlocality might complicate this. 

  Noticing the user's impatience with philosophical vagueness. They want concrete analogies: detector backgrounds are like epistemic noise, while sample properties are ontic. The residue analysis shows most concepts map cleanly except "belief" - we never used that at the bench. Our confidence intervals were always about device behavior, not knowledge. 

