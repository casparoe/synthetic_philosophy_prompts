  - If they do not want to use coins (because it's not a card and they want to stick to the deck), then they should use the granddaughter's chart (LEFT, RIGHT, BOTH). In that case, the equilibrium is more complex. The Raider might play BOTH with some probability and LEFT/RIGHT with others, but without randomization, they cannot achieve the mixed strategy equilibrium. So they might end up with a pure strategy or a pattern.

  Alternatively, they can modify the rules to explicitly allow or disallow randomizing devices. But note that the son's advice for the Guard to randomize also requires a random device. So if they allow one, they should allow both.

