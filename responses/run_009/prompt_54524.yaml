  - Without a coin, we can try to mimic randomness, but we are not very good at it. Therefore, the Guard might be better off using a coin if allowed.

  Conclusion:

  1. The son's procedure is sound from the perspective of game theory that allows mixed strategies. However, the granddaughter is right that if the rules do not allow randomization (or if we cannot achieve it in practice), then BOTH is not dominated. Therefore, the answer depends on the standard: mixed strategy domination vs. pure strategy domination. And it also depends on whether the family allows randomizing devices.

  2. The principled way to choose is to decide on the rules of the game: are mixed strategies allowed? If yes, then use the son's chart (remove BOTH and NONE). If not, then use the granddaughter's chart (remove only NONE). For teaching, it might be better to allow mixed strategies because that is standard in game theory. However, if the goal is to stick to the literal rules (only the cards) and not allow any external random devices, then the granddaughter's chart is appropriate.

  3. The advice to the Guard to "go 50-50" is about making her choices unpredictable and ensuring that in the long run, the Raider cannot get more than 5 tokens on average per round. It is achievable by using a fair coin. Without a coin, the Guard should try to vary her choices in a way that does not follow a pattern. But the coin is a tool to achieve the ideal.

  Recommendation for the family:

