answer: |-
  ### Part 1: Was the procedure sound? Evaluating BOTH as a "bad card"

  Your son's procedure relies on **mixed-strategy dominance**, a standard concept in game theory, while your granddaughter's objection highlights **practical and rule-based constraints**. Here's a breakdown:

  - **Son's argument (mixed-strategy dominance)**:
    - He compares BOTH to a randomized strategy: flipping a fair coin to choose LEFT or RIGHT. This yields an expected payoff of 5 tokens (50% chance of 10, 50% chance of 0) against any Guard choice, which is better than BOTH's guaranteed 4.
    - In game theory, a pure strategy (like BOTH) is considered "dominated" if a mixed strategy (like 50-50 randomization) yields a strictly higher payoff regardless of the opponent's move. By this standard, BOTH is dominated and thus "bad."
    - **Soundness**: The logic is mathematically sound under the axioms of standard game theory, which explicitly allow mixed strategies (randomization) as part of a player's strategy set. It doesn't require the coin to be a physical card; it's a meta-strategy for choosing cards.

  - **Granddaughter's objection (practical and rule-based constraints)**:
    - **Rule violation**: The game rules specify that the Raider must play one of the four cards. Randomization isn't a card; it's a method for choosing cards. If the rules forbid external randomization (e.g., no coins allowed), then "flip a coin" isn't a legal action. The deck only contains LEFT, RIGHT, BOTH, and NONE.
    - **Human randomness**: As your kitchen-table test showed, people cannot generate perfectly random sequences mentally. Imperfect randomization (e.g., predictable patterns) could make BOTH safer than a flawed coin flip. For instance, if the Raider's "random" choices are exploitable (e.g., alternating too often), the Guard could adjust, potentially reducing the expected payoff below 5 or even below 4.
    - **Dominance standard**: She implicitly uses **pure-strategy dominance**, where a strategy is only "bad" if another pure strategy always outperforms it. Here, BOTH isn't dominated by LEFT or RIGHT alone:
      - If Guard chooses left, LEFT pays 0 (worse than BOTH's 4), RIGHT pays 10 (better).
      - If Guard chooses right, LEFT pays 10 (better), RIGHT pays 0 (worse).
      - No pure strategy consistently beats BOTH, so it isn't "bad" by this standard.

  **Conclusion on Part 1**:
  - **Son's view is valid under mixed-strategy dominance**: BOTH is dominated by a 50-50 mix of LEFT/RIGHT, making it "bad" in game-theoretic terms.
  - **Granddaughter's view is valid under pure-strategy dominance and practical constraints**: If randomization isn't allowed or isn't feasible, BOTH isn't dominated and remains viable.
  - **The answer depends on the standard**:
    - If you adopt mixed-strategy dominance (standard in economics/game theory), BOTH is bad.
    - If you adopt pure-strategy dominance (or disallow randomization), BOTH is not bad.
  - **NONE is uncontroversially bad**: Under any standard, it is strictly dominated by BOTH (1 token vs. 4), so removing it is correct.

  ---

  ### Part 2: Principled choice between standards and stipulation for teaching

  When standards disagree, the choice depends on **goals and context**. Here's a principled framework:

  - **Why standards disagree**:
    - Mixed-strategy dominance assumes rational players can randomize perfectly (e.g., with a coin), focusing on long-run expected payoffs.
    - Pure-strategy dominance and practical constraints reflect human limitations and strict adherence to rules.

  - **Principled way to choose**:
    1. **Define the game formally**: Specify if randomization is allowed. If the rules are silent, clarify house rules.
    2. **Consider the purpose**:
       - For **teaching game theory** (e.g., Nash equilibrium, optimal play), mixed strategies are essential. They reveal how randomization creates unpredictability and minimizes exploitability.
       - For **practical play** (e.g., human limitations, family fun), pure strategies may be preferable to avoid complexity.
    3. **Empirical reality**: If players can't randomize well (per your test), mixed strategies become theoretical ideals, not practical advice.

  - **Stipulation for your family**:
    - **Recommendation**: Stipulate **mixed-strategy dominance** for teaching. It is the foundation of modern decision theory and reveals deeper insights (e.g., why BOTH is suboptimal in ideal play). This aligns with your son's economics background and offers a teachable moment about rationality.
    - **Why?** 
      - It introduces the concept of **expected value**, a core idea in probability.
      - It prepares children for more advanced games (e.g., rock-paper-scissors) where randomization is key.
      - You can address human limitations by allowing a physical coin, making randomization feasible.
    - **Implementation**: 
      - Allow players to use a coin/die to randomize if they wish. This bridges theory and practice.
      - If disallowing randomization, use pure-strategy dominance and keep BOTH, but explain this is a simplification.

  **Conclusion on Part 2**: Yes, standards can disagree, but you can choose mixed-strategy dominance as the default for teaching. It is principled, widely accepted, and can be made practical with a coin. Stipulate this to the family: "In this game, we assume players can randomize if they want, so we remove dominated strategies like BOTH based on expected payoffs."

  ---

  ### Part 3: What does "go 50-50 in her head" mean? The role of randomization

  Your son's advice to the Guard—"go 50-50 between the doors"—is **meaningful in theory but requires clarification in practice**:

  - **Theoretical intent (unexploitability)**:
    - If the Guard randomizes 50-50, the Raider's expected payoff is capped at 5 tokens (e.g., playing LEFT wins 10 with 50% probability). This makes the Guard **unexploitable**: no Raider strategy can consistently exceed 5 tokens per round.
    - Without randomization, a predictable Guard (e.g., always choosing left) could be exploited (e.g., Raider plays RIGHT for 10 tokens every time).
    - This is not "empty" advice—it defines the **Nash equilibrium** of the simplified game (LEFT/RIGHT only): both players randomize 50-50, and the Raider averages 5 tokens.

  - **Practical challenge (human randomness)**:
    - As your test showed, people generate sequences with patterns (e.g., too many alternations). A Guard who alternates doors predictably could be exploited (e.g., Raider plays the opposite of the last choice).
    - The coin flip represents an **ideal**: choices should be statistically independent and identically distributed (i.i.d.) with equal probability. Humans approximate this poorly without tools.

  - **Your instinct (populations vs. persons) is correct**:
    - The advice is about **long-run frequencies**, not single decisions. Over many rounds, the Guard should choose each door ~50% of the time with no discernible pattern.
    - It is **not about conscious thought** ("in her head") but about the aggregate distribution of choices. The coin is a metaphor for achieving this distribution.
    - **How to explain to grandchildren**:
      - "The coin isn't about flipping in your mind—it's about making sure the Guard's choices look like a coin flip over many games. If Grandma plays 100 rounds, she should pick left ~50 times and right ~50 times in a scrambled order. That way, the Raider can't guess better than chance. A real coin helps us do this because our brains aren't random."
      - **Demonstration**: Use a coin in 10 trial rounds. Show that the Guard's door choices are unpredictable and the Raider's average payoff is ~5. Then compare to a human-generated sequence (e.g., from your kitchen test) and let them try to exploit it.

  **Conclusion on Part 3**: "Go 50-50" advises the Guard to randomize to avoid being outguessed. It is a claim about **long-run frequencies and unexploitability**, achievable with a coin but imperfectly by humans. This highlights the value of randomization in strategic settings.

  ---

  ### Summary for Sunday's Game
  - **Remove NONE**: It's strictly dominated by BOTH under any standard.
  - **For BOTH**: 
    - If allowing randomization (recommended), remove BOTH because it's mixed-strategy dominated. Use a coin for both players to make randomization feasible.
    - If disallowing randomization, keep BOTH as it isn't pure-strategy dominated.
  - **Teaching moment**: Explain mixed strategies ("Sometimes the best choice is to let a coin decide, so no one can outthink you"). Use a coin to demonstrate equilibrium play.
  - **Guard's strategy**: Advise using a coin for 50-50 choices to achieve unexploitability. If no coin, emphasize varied, pattern-free choices. 

  This balances theory, practicality, and educational value—worthy of a spectroscopist's rigor!
