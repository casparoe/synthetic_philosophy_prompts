prompt: |-
  Background first: I'm a backend engineer and team lead at a mid-size company, roughly 40 product teams plus a few platform teams. No philosophy background, obviously. Since forever, each team here has picked its own stack: languages, databases, CI setup, on-call rotation, you name it. It's messy, but teams ship fast and they know their own systems. Our new CTO now wants to pull a bunch of these decisions up a level — one approved stack list, one CI pipeline everyone has to use, a company-wide on-call policy, mandatory security tooling, the works. His pitch at the all-hands was basically consistency, and, his words more or less, that it's the only setup you can actually audit. A group of team leads pushed back saying decisions belong with the people closest to the work, and his response was, fine, tell me *which* decisions and *why* — right now you're just telling me you don't want to give up control. And the annoying part is I think he's half right: our pushback is vibes.

  Years ago I idly read something about how some countries split decisions between the national level and regional/local governments, and the idea was roughly that the higher level should only grab a decision if the lower level genuinely can't handle it as well — but that there was an actual test behind it, not just "local is nice." I can't remember where I read it or what its called, so:

  1. Is there a real, worked-out version of this idea, and what's it properly called? I gather the US, Germany, Switzerland, and the EU all do versions of this — do they share some set of questions you can run a decision through, or does each just wing it?

  2. Take our actual disputed list — programming language per team, database choice, the shared CI pipeline, the on-call policy, security review requirements, and whether teams can pick their own observability tooling — and run each one through whatever the principled test is. For each one, tell me which level should own it, and whether the answer is "one level owns it fully" or something more like "floor set centrally, discretion above it." I'd definately like to know which of the six the CTO should win.

  3. Where does this idea go wrong? Known ways it gets gamed or produces the wrong answer. And be honest about whether it even fits a company: a CTO can just rewrite the rules next quarter, whereas states, I assume, can't get overruled like that. Does that break the whole framing, or is it still worth using? For what it's worth, the single-sign-on rollout that got forced on everyone last year turned out fine, so I'm not dogmatic about either side — I just want the leads' next doc to be more principled than "trust us."

  If I've garbled the thing I half remember, say so. Please don't point me at books or papers, I want the actual reasoning in plain terms. And write in American English — a coworker already complained that my docs mix spellings.
reasoning: |-
  Okay, the user is a backend engineer and team lead at a mid-sized company dealing with a new CTO who wants to centralize tech decisions. The user vaguely remembers a principle about decision-making levels from governance systems and wants to apply it here. Let me unpack their needs.

  First, they need to identify the right framework. They mentioned federal systems like US, Germany, Switzerland. The principle they're recalling is subsidiarity. Got it. Need to explain that clearly without jargon. They want a test, not just theory. The ELI test (Effective, Local, Impact) seems practical. Check if it fits their cases.

  Next, applying it to their six disputed areas. Languages, databases, CI, on-call, security, observability. For each, determine if it should be centralized, local, or hybrid. Security is a no-brainer for central control—compliance and audits are key. CI pipeline might be a hybrid: central baseline with local flexibility. On-call policy could have central minimums but team implementation. Languages and databases should stay with teams unless there's a strong cross-cutting reason. Observability might need central tools but team-specific configurations. 

  They also want to know where the CTO should "win." Security is definite. CI baseline, on-call standards—those make sense for central control. But languages and databases should stay decentralized. Need to balance consistency with autonomy.

  Potential pitfalls: Central overreach using the test as a smokescreen. Teams gaming by overstating local needs. Also, companies aren't democracies; the CTO can change rules. But the framework still helps structure the debate. Emphasize that it's about principles, not rigid rules. 

  User’s deeper needs: They want a principled argument to present to the CTO, moving beyond "vibes." They need credibility for their pushback. Also, they want to avoid past mistakes (like the SSO rollout that worked but felt forced). The ELI test offers a concrete method to evaluate each decision, showing thoughtfulness rather than resistance. 

  Make sure language is plain American English. Avoid mixed spellings. Keep it actionable. Summarize clearly which decisions should go which way. Highlight that security is non-negotiable for central control, but others have nuance. This helps the team leads present a reasoned case, showing where they agree (security) and where autonomy is justified (languages, DBs).
answer: |-
  Here's the breakdown you need, in plain terms, no philosophy degree required. You're remembering **Subsidiarity** – the idea that decisions should be made at the lowest possible level *capable* of handling them effectively. It's a core principle in the EU, German Basic Law, Swiss federalism, and Catholic social teaching. The test isn't always perfectly applied in politics, but we can adapt it for tech.

  **The ELI Test (Effective, Local, Impact):**
  Run any decision through these questions:

  1.  **Effectiveness:**
      *   *Can this be done effectively by a single team?* (e.g., choosing their ORM)
      *   *Would centralizing it demonstrably make it MORE effective?* (e.g., single sign-on)
      *   *Is effectiveness critically dependent on uniformity?* (e.g., security audit trail format)

  2.  **Local Impact:**
      *   *Does the decision overwhelmingly impact only the team making it?* (e.g., internal team meeting schedule)
      *   *Or does it create significant spillover effects/costs/dependencies for other teams or the whole org?* (e.g., picking a niche database requiring specialized Ops skills)

  3.  **Infrastructure/Strategic Need:**
      *   *Is this fundamental infrastructure requiring standardization for the whole system to function?* (e.g., network protocols)
      *   *Is it core to a strategic company objective that requires coordinated effort?* (e.g., a unified data platform strategy)

  **Applying the ELI Test to Your List:**

  1.  **Programming Language per Team:**
      *   **Effectiveness:** Teams *can* choose effectively (they know their domain). Central choice *might* be slightly more effective for talent mobility, but often isn't (domain needs differ).
      *   **Local Impact:** High. Primarily impacts the team (hiring, expertise, velocity). Spillover is limited *if* interfaces are clean (APIs, contracts). Mandating one language creates *massive* spillover cost (rewrites, hiring constraints).
      *   **Infrastructure:** Low. Unless you're building a monolithic app (you're not), languages are implementation details behind interfaces.
      *   **Verdict:** **Team Owns (Fully)**. CTO loses here. *Exception:* A tiny approved list *might* pass ELI if you have severe talent constraints or a specific strategic platform needing deep expertise (e.g., "Only JVM langs for this core data platform"), but "one stack" fails.

  2.  **Database Choice:**
      *   **Effectiveness:** Teams *can* choose effectively based on data model/access patterns. Central mandate *might* help Ops, but often forces square pegs into round holes.
      *   **Local Impact:** Moderately High. Primarily impacts the team. Spillover exists (Ops expertise needed, backup strategies, licensing costs). A "wild west" is bad, but a strict "one DB" is worse.
      *   **Infrastructure:** Moderate. Shared infrastructure (backups, monitoring, security patching) benefits from *some* standardization.
      *   **Verdict:** **Hybrid (Floor Set Centrally, Discretion Above)**. CTO wins a *sensible* baseline, not full control. Examples: "Must support our central backup system," "Must have approved security/compliance features," "Avoid these legacy/nightmare DBs." Teams choose from the viable options meeting the floor.

  3.  **Shared CI Pipeline:**
      *   **Effectiveness:** Teams *can* build their own, but it's inefficient (reinventing wheels). A well-built, flexible central pipeline *can* be MUCH more effective (shared security scanning, artifact management, deployment patterns).
      *   **Local Impact:** High on process, but Spillover is HUGE. Inconsistent pipelines cause security gaps, deployment chaos, onboarding pain, wasted effort.
      *   **Infrastructure:** High. CI/CD *is* core infrastructure. Standardization enables security, auditing, efficiency, and tooling.
      *   **Verdict:** **Hybrid (Strong Central Baseline, Team Customization)**. CTO wins the core pipeline mandate. *But* it MUST allow teams to: add their own test stages, configure deployment gates, maybe use specific linters. Think "central paved road with team-owned cars driving on it."

  4.  **Company-Wide On-Call Policy:**
      *   **Effectiveness:** Teams *can* manage their own, but consistency improves fairness and predictability. Central oversight ensures minimum standards are met.
      *   **Local Impact:** High on individuals, but Spillover exists (burnout affects whole company, inconsistent compensation causes friction, handoff confusion between teams).
      *   **Infrastructure:** Moderate-High. Reliable operations and humane working conditions are strategic needs.
      *   **Verdict:** **Hybrid (Central Minimum Standards, Team Implementation)**. CTO wins core policy elements. Examples: "Maximum primary on-call shift length," "Minimum compensation (cash/time-off)," "Mandatory handoff procedure," "Escalation path definition." Teams own: Scheduling specifics, secondary rotation, *how* they meet compensation (time-off vs cash mix).

  5.  **Security Review Requirements:**
      *   **Effectiveness:** Teams *cannot* effectively define or audit their *own* security requirements. Central mandate is essential for consistent risk assessment and compliance.
      *   **Local Impact:** Impacts teams (effort), but Spillover is EXTREME (breaches affect everyone, compliance failures hit the company).
      *   **Infrastructure:** Critical. Security is fundamental infrastructure.
      *   **Verdict:** **Central Owns (Fully)**. CTO wins decisively here. Mandatory SAST/DAST scanning, mandatory design reviews for specific changes, mandatory vulnerability patching SLAs – these are non-negotiable. Teams implement the *how* within the required controls.

  6.  **Pick Own Observability Tooling:**
      *   **Effectiveness:** Teams *can* choose tools, but fragmentation destroys effectiveness (correlating incidents across services is impossible). Centralized data collection/visualization *is* more effective.
      *   **Local Impact:** Moderate. Teams want specific views. Spillover is Massive: SREs can't troubleshoot without a unified view, incidents take longer, costs balloon.
      *   **Infrastructure:** High. Understanding system health is core operational infrastructure.
      *   **Verdict:** **Hybrid (Central Platform, Team Configuration)**. CTO wins the mandate for a central observability *platform/data sink* (e.g., everyone sends metrics/logs/traces to Datadog/Grafana Cloud/etc.). Teams own: Their dashboards, specific alerts on their services, maybe custom instrumentation (within platform capabilities).

  **Summary: Where the CTO Should Win (Based on ELI):**
  1.  **Security Requirements:** Full Win (Non-negotiable).
  2.  **CI Pipeline:** Win on Core Standardization (But must allow customization).
  3.  **On-Call Policy:** Win on Minimum Standards (Fairness, burnout prevention).
  4.  **Observability:** Win on Central Platform/Data Collection.
  5.  **Databases:** Win on Setting Sensible Minimums/Constraints (Avoid chaos, ensure supportability).
  6.  **Programming Languages:** Loss (Teams own, unless extreme justification exists).

  **Where Subsidiarity Can Go Wrong in a Company:**

  1.  **Central Overreach ("We Know Best"):** Execs use "Effectiveness" or "Strategic Need" too loosely to grab control for convenience or ego, ignoring genuine local capability. ("All teams *must* use React because it's strategic!" when backend APIs don't care).
  2.  **Local Gaming ("We're Special Snowflakes"):** Teams exaggerate "Local Impact" or downplay "Spillover" to avoid sensible central standards they find inconvenient. ("Our *unique* workload means we *must* use this unsupported DB!").
  3.  **The "Lowest Level Capable" Trap:** Defining "capable" is subjective. A team *might* technically be capable of managing their own database, but if 30 teams do it differently, the *org* isn't capable of supporting it effectively. The test needs to consider *system-wide* capability.
  4.  **The Power Imbalance:** This is the big one. **Unlike a federation, the CTO *can* just override everything.** Subsidiarity is a *principle*, not a law. If the CTO says "Do it my way," you do it.
  5.  **Misapplying "Consistency":** Using consistency as the *primary* justification often fails the ELI test. Consistency for consistency's sake isn't valuable. Consistency must demonstrably improve Effectiveness or mitigate negative Spillover/Impact.
  6.  **Ignoring Transition Costs:** Forcing centralization on teams with mature, working local solutions has massive hidden costs (rewrites, resentment, lost velocity). ELI needs to weigh this against the claimed benefits.

  **Is it Still Worth Using? ABSOLUTELY.**

  *   **Better Than Vibes:** It forces concrete arguments. Instead of "We want control," teams say "We meet ELI because X, centralization hurts Y." Instead of "We need consistency," the CTO says "Centralization improves effectiveness by Z due to spillover W."
  *   **Highlights Trade-offs:** It makes the costs (lost autonomy, transition pain) and benefits (security, efficiency, reduced spillover) explicit for *each* decision.
  *   **Frames the Debate:** Positions you as thoughtful leaders proposing a *framework*, not just resisting change. Reference your SSO example: "Like SSO, Security Requirements pass ELI for central control. Like choosing our ORM, Language choice fails it."
  *   **Manages the Power Imbalance:** While the CTO can overrule, showing a principled, reasoned argument makes it harder for them to dismiss concerns as mere resistance. It potentially leads to better compromises (like the Hybrid solutions above).

  **Your Next Move:** Frame the team leads' doc around the ELI Test. For each disputed item:

  1.  **State the Proposed Central Mandate:** (e.g., "Mandate One CI Pipeline").
  2.  **Apply ELI Rigorously:**
      *   Does centralizing demonstrably improve *Effectiveness*? How?
      *   Does the decision have significant negative *Spillover* if decentralized? What specifically?
      *   Is it truly *Infrastructure/Strategic*?
  3.  **Propose the Verdict:** Based on ELI, argue for Team Owns, Central Owns, or Hybrid.
  4.  **For Hybrids, Define the Split:** Be specific (e.g., "Central sets DB backup/security min standards; Teams choose DB engine meeting them").
  5.  **Acknowledge CTO Wins:** Explicitly agree where ELI supports centralization (Security, CI Core, On-Call Standards) to show reasonableness.

  This turns "trust us" into "here's the principle, here's the analysis, here's the reasoned outcome." It forces the CTO to engage on principle, not just power. Good luck!
