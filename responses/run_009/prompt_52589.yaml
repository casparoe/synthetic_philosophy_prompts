prompt: |-
  I chair the research ethics board at a mid-sized university, and we have a consistency problem with a philosophical edge. Over eight years of case-by-case adjudication our decisions have drifted: last spring two nearly identical deception studies — same cover story, same population, same debriefing — received opposite verdicts from different panels, and the affected investigator has filed a formal complaint. In response, one board member proposes that we codify our accumulated precedents into a binding decision procedure: for every morally relevant feature (degree of deception, population vulnerability, quality of debriefing, risk level) there will be a rule with enumerated exception clauses, so that any two protocols sharing the relevant features must receive the same outcome, and reviewers will simply apply the code. Another member objects that moral judgment does not work that way: whether a feature counts as a reason at all, and how much weight it carries, depends on the whole configuration of the case, so any code we write will eventually license a decision we can all see is wrong and forbid one we can all see is right — and that the solution to inconsistency is better deliberation, not a decision procedure that removes judgment from the loop. Before our next meeting I must circulate a written recommendation. Please draft the memo: take a position — adopt the code, reject it, or adopt a qualified version with stated limits — argue for it in terms the board can act on, engage the strongest consideration on the losing side rather than caricaturing it, and specify concretely what reviewers should do with the next borderline protocol, since the board cannot deliberate in the abstract while the docket is pending.
reasoning: |-
  Okay, the user chairs a research ethics board and is facing a consistency problem. Over eight years, their decisions have drifted, leading to two nearly identical deception studies getting opposite verdicts. An investigator has filed a complaint, so the board needs a solution. One member wants to codify precedents into a binding decision procedure with rules for every morally relevant feature. Another argues that moral judgment doesn't work that way, as the weight of features depends on the whole case. The user needs a memo recommending a position—adopt the code, reject it, or a qualified version—with concrete steps for reviewers.

  First, I need to understand the core issue. The board is dealing with inconsistent rulings because of case-by-case adjudication without clear guidelines. The challenge is balancing consistency with the flexibility needed for ethical judgments. Ethics review isn't just about ticking boxes; it involves nuanced considerations where context matters. But inconsistency undermines fairness and trust, as seen with the investigator's complaint.

  The two proposals represent different approaches: codification versus deliberation. The codification approach promises consistency by creating rules, but risks rigidity. The deliberation approach maintains flexibility but has led to inconsistency. The user needs a middle path that incorporates both structure and judgment.

  Looking at ethical frameworks, principlism (like Beauchamp and Childress) uses principles but requires balancing them contextually. Virtue ethics focuses on the character of the reviewers, which might not ensure consistency. A hybrid model seems best—establishing guidelines based on precedents but allowing exceptions through rigorous deliberation.

  The strongest argument for codification is predictability and fairness. Researchers deserve consistent outcomes. However, the objection that moral judgment is contextual is valid. For example, deception might be permissible in a low-risk study with adults but unacceptable with vulnerable populations. A strict rule might not capture these nuances.

  Therefore, a qualified approach makes sense. Create a code as a presumption framework, not binding rules. This means reviewers start with the code as a guide but can deviate with justification. This maintains consistency while allowing flexibility. Precedent-based systems, like common law, use past decisions but adapt to new cases.

  Concrete steps are crucial. The memo must specify what reviewers do with the next borderline protocol. A tiered review system could help: low-risk studies get expedited review using the code, while borderline cases go to full board deliberation. Also, documenting deviations ensures transparency and refines the code over time.

  Training reviewers on using the code as a tool, not a checklist, is essential. Encourage them to consider the gestalt of the study. Regular audits of decisions and annual reviews of the code will help maintain balance. Addressing the losing sides: for the codification advocate, emphasize that the code is foundational but not inflexible. For the deliberation proponent, stress that the code reduces inconsistency without removing judgment.

  The user's deeper needs include maintaining the board's credibility, ensuring fairness for researchers, and efficient processing of protocols. They might also want to prevent future complaints and enhance the board's reputation. The solution should thus promote consistency, transparency, and adaptability.
answer: |-
  ## MEMORANDUM

  **To:** Research Ethics Board Members  
  **From:** [Your Name], REB Chair  
  **Subject:** Recommendation on Codifying Precedents: A Balanced Approach to Consistency & Judgment  
  **Date:** October 26, 2023  

  **I. Introduction**  
  The recent complaint regarding inconsistent rulings on similar deception studies highlights a critical challenge: balancing the need for consistent, predictable decisions with the inherent contextual nature of ethical judgment. Thank you to Members A (proposing codification) and Member B (defending deliberative judgment) for framing the core tension. After careful consideration, I recommend a **qualified adoption of a precedent-based code**, structured as a *presumptive framework* rather than a rigid decision procedure. This approach addresses the immediate inconsistency while preserving essential ethical judgment.

  **II. Recommendation & Core Argument: A Presumptive Framework**  
  We should develop a **"REB Decision Framework"** codifying our precedents as *default presumptions*, not binding rules. This framework will:  

  1.  **List Morally Relevant Features:** Explicitly define features (deception level, vulnerability, risk, debriefing quality, etc.) and their *typical* weight/impact based on past rulings (e.g., "High deception *generally* requires strong countervailing scientific justification and rigorous debriefing").
  2.  **Establish Default Presumptions:** For common scenarios, outline the *presumptive outcome* based on precedent (e.g., "Protocols involving high deception *with* vulnerable populations *and* moderate risk are presumptively disapproved unless...").
  3.  **Require Explicit Justification for Deviation:** Any reviewer or panel proposing a decision *contrary* to the framework's presumption *must* provide a written justification explaining why the specific context *overrides* the default. This justification must engage with the framework's reasoning.

  **Why this Qualified Approach?**  

  *   **Addresses Inconsistency Directly:** The framework creates strong pressure for consistency by making precedents visible and establishing clear defaults. Reviewers start from a common, documented baseline, reducing drift. Similar protocols will *likely* receive similar outcomes unless a compelling contextual reason exists.
  *   **Preserves Essential Judgment (Addressing Member B's Core Concern):** This is not algorithmic decision-making. The framework acts as a structured starting point, *not* the endpoint. It forces reviewers to articulate *why* a specific case is exceptional, ensuring judgment is applied transparently and rigorously, not removed. It directly confronts Member B's valid point: features *can* interact uniquely. The justification requirement compels reviewers to demonstrate *how* the configuration matters in *this* case.
  *   **Mitigates the "Wrong Decision" Problem:** A rigid code risks mandating or forbidding a decision based solely on isolated features. A presumptive framework avoids this by allowing deviation *with robust justification*. If we all "see it's wrong," the justification will expose the framework's limitation in that context, guiding future refinement. It prevents the code from becoming a straitjacket.
  *   **Enhances Transparency & Legitimacy:** Researchers see the baseline expectations and understand why deviations occur. This promotes fairness and trust, addressing the complaint's root cause. Deliberations focus on the *reasons* for overriding a presumption, leading to richer discussion.
  *   **Builds Institutional Wisdom:** Documenting deviations provides concrete data for *refining* the framework annually, making it a living document that learns from our ongoing judgment.

  **III. Engaging the Opposing Considerations**  

  *   **For Member A (Codification Advocate):** Your proposal rightly demands fairness through consistency and leverages our hard-won precedents. A rigid code *would* maximize predictability. However, Member B's objection is powerful: ethics *is* contextual. A binding procedure *would* eventually force a clearly unethical approval or rejection by overlooking novel configurations or unforeseen consequences. Our qualified approach uses your core idea – codifying precedent as the strong default – but builds in the necessary safety valve of justifiable override, ensuring predictability *without* ethical blindness.
  *   **For Member B (Deliberation Advocate):** Your defense of contextual ethical judgment is philosophically sound and reflects the reality of our work. Pure codification *would* be inadequate and potentially dangerous. However, the status quo of unguided deliberation *has* led to unacceptable inconsistency, undermining fairness and researcher trust. The presumptive framework *enhances* deliberation by providing a structured foundation and forcing us to articulate contextual reasons with greater precision when we deviate. It makes our judgment *more* accountable, not less. The solution isn't *less* structure, but *better-structured* deliberation.

  **IV. Concrete Next Steps for Reviewers: The Borderline Protocol**  

  We cannot pause the docket. For the *next borderline protocol* (and all going forward until the framework is finalized, then as policy):  

  1.  **Initial Review:** Assign the protocol to the primary reviewer(s) as usual.
  2.  **Apply Provisional Presumptions:** The reviewer(s) will consult the *draft* list of morally relevant features (to be circulated separately next week, compiled from recent precedents) and attempt to identify the most analogous precedent(s) and its/their presumptive outcome(s).
  3.  **Draft Recommendation with Justification:**  
      *   If the reviewer believes the protocol aligns clearly with a precedent's presumption, they recommend accordingly, citing the precedent(s).
      *   If the reviewer believes deviation is warranted, they **must** draft a recommendation that:  
          a) States the relevant presumption(s) from precedent.  
          b) Explicitly identifies the feature(s) or contextual factor(s) that differ significantly.  
          c) Explains *why* this difference justifies overriding the presumption in this specific case.  
          d) Assesses the overall "ethical gestalt" – does the *whole* configuration, even with the deviation, meet ethical standards?
  4.  **Full Board Review for Borderline/Deviant Cases:** Any protocol where the primary reviewer proposes *overriding* a presumption, or where the presumption itself is unclear/conflicting, is automatically flagged for **full board review**. The primary reviewer presents their analysis (steps 2 & 3 above). The board's deliberation focuses on:  
      *   The validity of the identified presumption.
      *   The strength of the justification for deviation.
      *   The overall ethical assessment considering the unique configuration.
  5.  **Documentation:** The final decision memo *explicitly* records: the relevant presumption(s), whether it was followed or overridden, and if overridden, the board's justification. This becomes part of our evolving precedent.

  **V. Implementation Timeline**  

  1.  **Immediate (Next Week):** Circulate draft list of "Morally Relevant Features & Initial Presumptions" (compiled from past 2 years of decisions) for comment. Implement provisional steps (IV.1-5 above) for all new submissions.
  2.  **Next 60 Days:** Form a small working group (including Members A & B) to draft the full "REB Decision Framework" document, incorporating board feedback on the initial list and structured as presumptions.
  3.  **Next Board Meeting:** Review and adopt v1.0 of the "REB Decision Framework".
  4.  **Ongoing:** Mandate annual review/update of the Framework based on analyzed deviations and emerging case types. Incorporate Framework use and justification requirements into reviewer training.

  **VI. Conclusion**  
  The goal is not robotic consistency, but *justifiable* consistency tempered by *accountable* judgment. The proposed presumptive framework directly tackles our inconsistency problem by leveraging our precedents as strong defaults, while the requirement for explicit justification when deviating ensures contextual ethical reasoning remains central, transparent, and rigorous. This balanced approach honors the valid insights of both proposals. Let us adopt this qualified path and implement the concrete steps for the next borderline protocol immediately.  

  I look forward to our discussion and refining this approach together.  

  Respectfully,  
  [Your Name]  
  Chair, Research Ethics Board
