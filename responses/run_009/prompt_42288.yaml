prompt: |-
  i'm a software engineer with a podcast i run on the side (interviews, tech and ideas stuff), and next week's guest is a philosopher whose whole thing is republican liberty -- the idea that freedom means nobody can arbitrarily boss you around, i.e. non-domination, not just that nobody actually interferes with you right now. i think i get the core distinction but when i try to ask about it my questions come out sounding like a wiki summary. write me 7-9 interview questions that actually press on the view where the literature presses.

  specifically i want at least one question on the slave-with-a-kind-master type case -- zero interference, total domination -- and what it's supposed to show about the standard liberal picture of freedom. one on whether republican liberty is just Isaiah Berlin's positive liberty with extra steps, or genuinely a third thing. and one on where the state fits, since the state interferes constantly (laws, taxes, cops) -- what stops it from being the biggest dominator of all? for each question include a follow-up keyed to the most likely reply, e.g. if he says some interference is fine as long as it's non-arbitrary or contestable, the follow-up should dig at what "contestable" amounts to in practice for ordinary people.

  no "what drew you to philosophy" filler, i want questions a specialist would nod at. keep them readable enough that my usual listeners (mostly devs) can follow.
