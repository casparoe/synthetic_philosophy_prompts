prompt: |-
  I've been reading a popular book on Buddhist philosophy — the author is a journalist with an interest in meditation, not a scholar — and it contains a chapter on Madhyamaka that I'd like your help assessing. I'll summarise the gist of it, since I don't have the book to hand.

  The author presents Nāgārjuna as the greatest of the Buddhist philosophers and describes his central claim as follows: everything that exists is 'empty', and to be empty of intrinsic nature (svabhāva, in his terminology) simply means that nothing really exists at all — things are illusions, like mirages or the snake seen in a coiled rope. The world of tables and persons is mere appearance; ultimate reality is a kind of indescribable absolute beyond concepts. The book illustrates this with Nāgārjuna's famous tetralemma: when asked about the status of the enlightened person after death, the Buddha refused to affirm that he exists, that he does not exist, that he both exists and does not exist, or that he neither exists nor does not exist. According to the author, this shows that Madhyamaka embraces a fourth option — a transcendent 'neither existence nor non-existence' — which points directly to that absolute reality that language cannot reach, the way silence points at what words cannot say. The author goes on to claim that Nāgārjuna's arguments establish this negative conclusion through pure logic: since everything depends for its existence on other things (dependent origination), nothing can exist in and of itself, and what does not exist in and of itself does not exist at all. He concludes that Madhyamaka is a form of metaphysical nihilism in service of a soteriological goal — realising that nothing is real liberates one from attachment to persons and things, which is what extinguishes suffering.

  I'm inclined to think this is broadly right, but a friend who has studied Indian philosophy told me that Buddhists would consider some of it a serious misreading — something about it being exactly the nihilism (or perhaps its opposite) that Madhyamaka was written to refute. She also muttered something about the two truths, but didn't elaborate before leaving.

  Could you go through the summary part by part? I'd like to know which claims a scholar of Madhyamaka would accept, which are simplifications, and which are genuine misrepresentations. In particular, I'd like to know whether 'empty of intrinsic nature' really does mean 'non-existent', whether the tetralemma is best read as pointing to a transcendent absolute (and whether that's the standard or a contested reading), whether the book's reading of the argument from dependent origination to universal non-existence is actually Nāgārjuna's argument, and what role the doctrine of two truths plays in all of this — including whether it rescues the book's picture of tables as illusions. Finally, does the author's label of 'metaphysical nihilism' fit better than my friend's complaint suggests, or is she right that it gets Madhyamaka almost exactly backwards?
reasoning: |-
  Okay, the user has been reading a popular book on Buddhist philosophy, specifically about Madhyamaka and Nagarjuna. They've summarized the author's interpretation and want to know where it aligns with scholarly views, where it simplifies, and where it misrepresents. The user mentioned their friend, who studies Indian philosophy, criticized some parts as misreadings, possibly related to nihilism or the two truths doctrine.

  First, I need to address each part of the user's summary. The author claims that "empty of intrinsic nature" means "non-existent," equating emptiness with total non-existence. But from what I know, Nagarjuna's emptiness isn't nihilistic. Emptiness means lack of independent existence, not non-existence. Things exist dependently, so they're not illusions in the sense of being completely unreal. The two truths doctrine is key here: conventional truth allows for functional existence, while ultimate truth shows emptiness. The author's view misses this nuance, leading to a misinterpretation.

  Next, the tetralemma. The author presents it as pointing to a transcendent absolute beyond concepts. But Nagarjuna's tetralemma is about rejecting all four positions to avoid reification, not pointing to an ineffable reality. Scholars like Garfield and Westerhoff emphasize the therapeutic deconstruction of views rather than affirming any absolute. The user's friend mentioned nihilism, which Nagarjuna explicitly refutes, so the author's take might be a misstep here.

  The argument from dependent origination is used by the author to conclude universal non-existence. However, Nagarjuna uses dependent origination to show interdependence, which implies emptiness but not non-existence. The logical step from dependent origination to non-existence ignores the conventional reality. This is a critical point because Madhyamaka avoids extremes of existence and non-existence.

  The label "metaphysical nihilism" is problematic. Nagarjuna's work is a middle way between eternalism and nihilism. Misinterpreting emptiness as non-existence would fall into nihilism, which he argues against. The two truths doctrine rescues conventional reality, so tables aren't illusions; they're dependently real. The author's soteriological goal is correct—realizing emptiness reduces attachment—but the metaphysical basis is flawed.

  The user's deeper needs might involve understanding Madhyamaka accurately for personal practice or academic interest. They might be confused by conflicting interpretations and want clarity on how emptiness should be conceptualized without falling into extremes. Emphasizing the two truths and the middle way could address their need for a balanced view that avoids nihilism and eternalism. Highlighting scholarly consensus versus popular simplifications will help them assess the book's reliability.
answer: |-
  This is an excellent and perceptive question. Your friend is essentially correct – the book's interpretation significantly misrepresents core tenets of Madhyamaka, falling into the very pitfall (nihilism) that Nāgārjuna explicitly sought to avoid. Let's break down your summary point by point:

  1.  **"Everything that exists is 'empty', and to be empty of intrinsic nature (svabhāva) simply means that nothing really exists at all — things are illusions..."**
      *   **Misrepresentation.** This is the crux of the error. While Madhyamaka vigorously denies **svabhāva** (intrinsic, independent, inherent, self-existent nature), it **does not** deny conventional existence or functionality.
      *   **Emptiness (Śūnyatā) ≠ Non-Existence:** Emptiness *means* the *lack* of svabhāva. It signifies that all phenomena arise dependently (pratītyasamutpāda) – dependent on causes and conditions, dependent on their parts, dependent on conceptual designation. **Dependent origination *is* emptiness.**
      *   **Conventional Reality (Saṃvṛti-satya):** This is where the "Two Truths" doctrine is absolutely essential. Madhyamaka posits:
          *   **Ultimate Truth (Paramārtha-satya):** Phenomena are empty of svabhāva. They lack inherent existence.
          *   **Conventional Truth (Saṃvṛti-satya):** Phenomena *do* exist dependently, conventionally, functionally. We interact with tables, experience suffering, and engage in the path *on this level*. To deny conventional reality entirely is nihilism (ucchedavāda), which Nāgārjuna explicitly refutes (*Mūlamadhyamakakārikā* MMK 24.7-20 is crucial here).
      *   **Not Illusions *in that sense*:** While often compared to illusions (māyā) or mirages to emphasize their lack of inherent substance, they are **not** like a snake mistakenly seen in a rope (which simply *isn't there at all*). A mirage *appears* and functions *as* water to a thirsty deer; a table *appears* and functions *as* a table. Their emptiness means they lack independent reality, **not** that they are utterly non-functional hallucinations. Calling them "illusions" without the crucial nuance of dependent functionality is highly misleading.

  2.  **"Ultimate reality is a kind of indescribable absolute beyond concepts."**
      *   **Contested Simplification/Misrepresentation.** This is a common interpretation, especially in some Tibetan traditions (Dzogchen) and popular Western presentations, but it's highly debated among scholars and contested by many Madhyamaka thinkers themselves.
      *   **Nāgārjuna's Stance:** Nāgārjuna primarily uses negative dialectic to deconstruct *all* conceptual elaborations (prapañca), including concepts of "absolute," "reality," "existence," and "non-existence." His goal isn't to *posit* an ineffable absolute *beyond* emptiness, but to show the emptiness *of* all such concepts.
      *   **Emptiness Itself is Empty (Śūnyatā-śūnyatā):** Crucially, Nāgārjuna states that emptiness itself is empty (MMK 13.7, 22.11). It is not a self-existing ultimate reality or ground. It is simply the *characteristic* of dependent phenomena. To reify emptiness into an absolute is to fall into another extreme.
      *   **Scholarly Views:** Scholars like Jay L. Garfield, Jan Westerhoff, and Mark Siderits argue strongly against reading Nāgārjuna as positing a positive absolute. They emphasize the purely negative, deconstructive nature of his arguments and the danger of reifying emptiness. Others, drawing on later commentators like Candrakīrti or certain Tibetan lineages, allow for a more "positive" (though still non-conceptual) interpretation of the ultimate, but even then, it's never an independently existing *thing*. The book leans towards a reified, substantialized view of the ultimate that Nāgārjuna likely would reject.

  3.  **The Tetralemma (Catuṣkoṭi) & "Neither Existence nor Non-Existence"**
      *   **Misreading.** The book fundamentally misunderstands the tetralemma's purpose.
      *   **Not Affirming a Fourth Option:** Nāgārjuna does **not** use the tetralemma to *affirm* a "neither/nor" transcendent reality. He uses it to *reject all four positions* as conceptually incoherent when applied to ultimate questions like the Tathāgata after death. Why? Because all four positions presuppose concepts of inherent existence or non-existence (svabhāva) that are inapplicable to something that is dependently arisen and empty. Silence signifies the *inapplicability* of these categories, **not** the existence of some *other* thing they point to.
      *   **Deconstruction, Not Transcendentalism:** The point is therapeutic: to free the mind from being trapped by rigid conceptual dichotomies (existence/non-existence, self/other, etc.) that cause suffering. It's about realizing the emptiness *of* the categories themselves, not discovering a reality *beyond* them that corresponds to the fourth option. The book reifies the negation into a positive "absolute."

  4.  **"Since everything depends for its existence on other things (dependent origination), nothing can exist in and of itself, and what does not exist in and of itself does not exist at all."**
      *   **Invalid Inference / Misrepresentation.** This is where the book's misinterpretation becomes most clear and problematic. Nāgārjuna's argument is:
          *   **Premise:** All things arise dependently (pratītyasamutpāda).
          *   **Conclusion:** Therefore, all things are empty of svabhāva (inherent existence).
      *   **The Book Adds:** Therefore, nothing exists at all.
      *   **Why it's Wrong:** Nāgārjuna **explicitly equates dependent origination (pratītyasamutpāda) with emptiness (śūnyatā) AND with conventional designation/phenomena (prajñapti)** (MMK 24.18). His core argument is:
          *   Whatever is dependently arisen (pratītyasamutpanna) is empty (śūnya).
          *   Whatever is empty is dependently arisen.
          *   Whatever is dependently arisen is conventionally existent (saṃvṛti-sat).
          *   **Therefore:** Emptiness (lack of svabhāva) **is** the very condition for conventional, dependent existence. **The absence of inherent existence *is* what allows for dependent, functional, conventional existence.** To say "no svabhāva = no existence" is to fundamentally misunderstand this equation and collapse into nihilism, denying the very reality that emptiness describes. MMK 24.14 is direct: "We state that whatever is dependent arising, that is emptiness. That is dependent upon convention; that itself is the middle path."

  5.  **"Metaphysical Nihilism in service of a soteriological goal"**
      *   **Fundamental Misrepresentation / Gets it Backwards.** Labeling Madhyamaka as "metaphysical nihilism" is precisely the accusation Nāgārjuna spent his career refuting. He positions Madhyamaka as the *Middle Way* (Madhyamā-pratipad) avoiding the extremes of:
          *   **Eternalism (Śāśvatavāda):** Belief in inherent existence (svabhāva).
          *   **Nihilism (Ucchedavāda):** Denial of conventional existence and the efficacy of karma, the path, etc. (which is what "nothing exists at all" entails).
      *   **Soteriology Partially Correct, Metaphysics Wrong:** The soteriological goal *is* correct: realizing the emptiness of inherent existence (and thus the emptiness of the "self" we cling to) undermines attachment and leads to liberation from suffering. **However, this realization *depends on* the doctrine of two truths.** It's realizing that while things *conventionally* exist and function (allowing for karma, path, suffering, liberation), they *ultimately* lack the inherent, independent, permanent reality we instinctively project onto them. It's the *letting go* of the *belief in* inherent existence that liberates, **not** the belief that nothing exists at all (which would make the path and liberation nonsensical).

  **Summary Assessment:**

  *   **Broadly Right:** Emphasis on emptiness (śūnyatā), denial of svabhāva, the centrality of dependent origination (pratītyasamutpāda), and the soteriological goal of liberation through non-attachment.
  *   **Significant Simplifications/Misrepresentations:**
      *   Equating "empty" with "non-existent" or "illusion" in the sense of total unreality.
      *   Misinterpreting the tetralemma as affirming a transcendent "neither/nor" absolute.
      *   Misreading the argument from dependent origination to conclude universal non-existence.
      *   Ignoring or misapplying the crucial Doctrine of Two Truths (especially the reality of conventional existence).
      *   Reifying emptiness or the ultimate into a positive absolute.
  *   **Genuine Misrepresentations (Getting it Backwards):**
      *   **Nihilism:** This is the primary error. The book's interpretation *is* the nihilism Nāgārjuna refutes. He denies inherent existence, **not** existence itself.
      *   **Role of Two Truths:** The Two Truths doctrine is not just an add-on; it's the essential framework that *prevents* the conclusion of nihilism. Conventional truth rescues tables, persons, and the path from being mere illusions by grounding them in dependent functionality. Ultimate truth prevents us from reifying them into inherently existing things.

  **In Conclusion:** Your friend is correct. The book fundamentally misunderstands Nāgārjuna by collapsing emptiness into non-existence and ignoring the Two Truths. This leads it to mislabel Madhyamaka as "metaphysical nihilism," which is almost precisely the opposite of Nāgārjuna's intent. He is meticulously dismantling the concept of inherent existence to reveal the dependently arisen, conventionally real world as it is, thereby opening the path to liberation from the suffering caused by our mistaken projections of inherent existence. The "absolute" he points to is not a transcendent reality, but the emptiness *of* all phenomena, including emptiness itself.
