prompt: |-
  I'm taking a political philosophy course this term, and the unit on global justice has left me with a pile of gut verdicts that I can't line up into anything coherent, so I'd like help doing reflective equilibrium on them — figuring out what principle, if any, captures what I actually think about whether compatriots have special claims on us that strangers abroad don't.

  Here are my verdicts on cases. My government spends the equivalent of $50,000 on disability benefits for a compatriot when the same money, routed through a cost-effective health program abroad, would save several lives: I think the domestic spending is not merely permissible but required, and I don't feel the least bit guilty about it. Coast guard rescuers pull citizens from the water first when they can't save everyone: fine, obviously. Public university places reserved for citizens over equally qualified foreign applicants: fine. But now: an emergency room turns away a foreign tourist who will die without treatment, on the ground that citizens come first: clearly not fine — the partiality that seemed innocent in the other cases suddenly looks monstrous. A private citizen donates $500 to a food bank for locals rather than to a charity that would save a child's life abroad: I'm uneasy calling this wrong, but I'd never say the local donation is *better*, whereas I do implicitly think the government's disability spending is better than the foreign aid it crowds out — and I can't see why the scale of the agent should flip the moral valence. Telling a lie to a foreigner is exactly as bad as telling the same lie to a compatriot, so whatever special claims exist, they don't extend to the whole of morality, only to some distributive corner of it. And my special duties to my family feel different in kind from anything I owe compatriots — I never chose my nation, I don't even know most compatriots, and I'd resist saying co-citizenship is just a scaled-up family. My tentative principle was something like: partiality is legitimate inside relationships of reciprocity and mutual cooperation, and co-citizenship is one such relationship, while employer-tourist and stranger-stranger relations are not. But I suspect this principle does worse on my own cases than I initially thought — for instance, the foreign tourist is inside a web of reciprocal cooperation with us (trade, treaties, legal protections) in a way a stranger abroad isn't, yet my verdict there is the most anti-partial of all.

  So here's what I'd like. Work through the cases, tell me whether one principle (or a small set of rival candidates) captures the pattern — consider seriously the idea that the relevant distinction is not the relationship but the *role*: that citizens and officials acting in the name of a state may weigh compatriots' interests more heavily, while private individuals acting as such may not, and say whether that can be made to square with my feeling that the government's choice is not just permitted but positively right. State your favored principle precisely, clause by clause, each clause tied to the case that motivates it, and be explicit about which of my verdicts it overturns and whether I should mourn them. Then apply it to two cases I haven't listed: a legislator who votes for tariffs that cost foreigners a lot to benefit compatriots a little, and a doctor from a poor country who emigrates to a rich one, on the argument that she owes her compatriots (who subsidized her training) her labor. After the main discussion, please give me a structured summary as a JSON object with these fields: "favored_principle" (one sentence), "clauses" (an array of objects, each with "statement" and "motivating_case"), "verdicts_overturned" (an array of the cases above that the principle cannot accommodate, each with a one-line explanation), "rival_principles" (an array of objects with "statement", "cases_it_handles_better", and "cases_it_handles_worse"), and "new_case_predictions" (an object keyed by the tariff and emigration cases, each with the verdict your principle delivers and your confidence in it).
reasoning: |-
  Hmm, this is a rich and complex request about political philosophy and global justice. The user is struggling to reconcile their intuitive moral judgments about partiality towards compatriots versus strangers abroad. They've presented several concrete cases where they feel differently about special obligations to fellow citizens, and they want help achieving reflective equilibrium - meaning they want to find a coherent principle that explains these intuitions.

  Looking at their cases, I notice a clear pattern: they accept partiality in some governmental contexts (disability benefits, coast guard rescues, university admissions) but reject it in others (emergency room treatment). They're also conflicted about private actions (donating locally vs. saving lives abroad) and note that special duties to family feel different from duties to compatriots. Their initial reciprocity principle seems insufficient since tourists are part of reciprocal systems too.

  I think the key insight here is distinguishing between different types of duties. The user's intuitions suggest that special obligations to compatriots arise from institutional roles rather than personal relationships. Governments have special responsibilities to their citizens because they represent a collective enterprise. This explains why partiality seems obligatory in some state actions (disability spending) but unacceptable in others (emergency care) - the latter involves basic human rights that shouldn't be denied based on nationality.

  For the private donation case, this principle would say that while individuals may prefer local causes, they don't have the same institutional obligations as governments. This explains their unease about calling it wrong without endorsing it as morally better. The lie-telling case fits too - truth-telling is a universal duty regardless of nationality.

  The family versus compatriot distinction makes sense here - familial duties are personal and associative, while citizenship duties are institutional. The user is right to resist equating nation with family.

  For the new cases: tariffs that harm foreigners would likely be permissible under this principle if they legitimately serve citizens' interests, though the disproportionate harm might make it problematic. The doctor emigrating? Her obligation to repay training subsidies might create a pro tanto duty to stay, but it could be outweighed by other factors - this would depend on the specific institutional arrangements.

  I should present this principle clearly, with each clause tied to specific cases from their list, and be honest about where it might conflict with their intuitions (like in the ER case, which it handles well). The JSON summary will help organize everything systematically. This approach respects their philosophical rigor while addressing their need for coherence.
