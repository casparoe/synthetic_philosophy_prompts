  Here's a reflective equilibrium analysis of your cases, aiming for a coherent principle that captures your intuitions while identifying points of tension. Your intuitions strongly suggest that **the legitimacy of partiality depends on the institutional role of the agent and the nature of the interest at stake.**

  ### The Favored Principle: The Institutional Role & Essential Interests Principle
  *   **Statement:** Partiality toward compatriots is permissible or obligatory *only* when (a) it is enacted by an agent discharging a specific institutional duty within a bounded scheme of political cooperation, *and* (b) it does not deny non-compatriots access to goods essential for basic human functioning or fundamental rights protection.

  ### Clause-by-Clause Breakdown (Motivated by Cases)

  1.  **"Partiality... is permissible or obligatory"**: Acknowledges your verdict that the government *must* prioritize the compatriot for disability benefits, rescues, and (presumably) university spots. (Motivating Cases: Disability Benefits, Coast Guard, University Admissions).
  2.  **"...when it is enacted by an agent discharging a specific institutional duty"**: Explains why the *government* spending on disability is *required* partiality, while a *private citizen* donating locally is, at best, merely permissible (you wouldn't call it *better* than saving a life abroad). The state has distinct duties tied to its role. (Motivating Cases: Disability Benefits (Govt) vs. Private Donation).
  3.  **"...within a bounded scheme of political cooperation"**: Captures why co-citizenship generates special claims (reciprocity, shared institutions, collective self-determination) distinct from universal humanity or personal relationships like family ("scaled-up family" feels wrong). (Motivating Cases: Disability Benefits, Coast Guard, University Admissions; contrast Family).
  4.  **"...and it does not deny non-compatriots access to goods essential for basic human functioning or fundamental rights protection"**: Explains the stark difference between permissible partiality (university spots, rescue priority when saving *some* non-citizens isn't possible) and impermissible partiality (ER denial). Emergency life-saving care is an essential good; university admission or rescue priority when *not all* can be saved, while important, isn't essential in the same life-or-death, immediate way. (Motivating Case: ER Denial - the crucial counterexample).
  5.  **Implicit: Partiality is domain-specific**: Explains why lying to a foreigner is just as bad – truthfulness is a universal duty not overridden by citizenship. Special distributive claims exist only within the sphere of benefits tied to the cooperative scheme. (Motivating Case: Lying).

  ### Verdicts Overturned & Whether to Mourn Them

  *   **Private Donation ($500 to local food bank vs. life-saving charity):** The principle implies this private partiality is *merely permissible*, not morally superior. *Your intuition:* Uneasy calling it wrong, but wouldn't say it's *better*. **Overturns?** Partially. Your unease aligns with permissibility. It overturns any *implicit* sense that local giving might be *better* in a private context (which you don't hold). **Mourn?** No need. The principle captures your ambivalence: private actors lack the institutional duty mandating partiality, so saving a life abroad remains the *maximally* morally good option, even if local giving isn't strictly wrong.
  *   **Coast Guard Rescuers / ER Denial Distinction:** The principle *supports* your different verdicts based on the nature of the good (rescue when not all can be saved vs. essential life-saving care). No overturn here.

  ### Rival Principles Considered & Why They Fail

  1.  **Reciprocity Principle (Your Initial):** "Partiality is legitimate inside relationships of reciprocity and mutual cooperation."
      *   *Handles Better:* Co-citizenship as reciprocal scheme (Disability, Uni).
      *   *Handles Worse:* Fails the ER case spectacularly (tourist *is* in reciprocal web via treaties/trade). Doesn't explain the agent-role distinction (Govt vs. Private Donation). Doesn't explain the essential/non-essential goods distinction (Coast Guard vs. ER).

  2.  **Simple Role Principle:** "Only state agents may show partiality."
      *   *Handles Better:* Govt Disability required, Private Donation not superior. ER Denial still wrong (state agent denying essential good).
      *   *Handles Worse:* Doesn't explain *why* state partiality is *required* in Disability but *forbidden* in ER. Doesn't capture the bounded scheme element. Doesn't explain the Rescue case vs. ER distinction as cleanly (both involve state agents and life-saving).

  3.  **Associative Duties Principle:** "Co-citizenship inherently generates strong associative duties akin to family (though weaker)."
      *   *Handles Better:* Explains intuitive pull of partiality in Disability/Rescue/Uni.
      *   *Handles Worse:* Directly contradicts your strong rejection of the nation-as-family analogy. Cannot explain why ER denial feels monstrous if associative duties are strong. Struggles with the agent-role distinction (why are *my* associative duties as a private citizen less demanding for distribution than the state's?).

  ### Application to New Cases

  1.  **Tariffs Legislator:** Legislator votes for tariffs costing foreigners a lot to benefit compatriots a little.
      *   **Principle Verdict:** Likely **Permissible, but potentially problematic.**
      *   **Reasoning:** The legislator acts in an institutional role within the bounded scheme, pursuing economic benefits for constituents. Economic welfare is generally non-essential in the life-or-death sense. *However*, if the tariffs cause severe harm abroad (e.g., mass starvation), denying *essential* goods, it could violate clause (b). Proportionality matters – if benefits are trivial and harms severe, it leans towards impermissible. Confidence: Medium-High on permissibility for typical tariffs; Low if harms are catastrophic/essential.
      *   *Your probable intuition:* Probably permissible, though maybe uncomfortable if harms are severe.

  2.  **Doctor Emigration:** Doctor from poor Country A (which subsidized training) emigrates to rich Country B.
      *   **Principle Verdict:** **Permissible, but may involve pro tanto wrong.**
      *   **Reasoning:** The doctor is a *private individual* acting on personal choice, not discharging an institutional *duty*. While Country A's investment creates a claim of reciprocity, the *agent* (doctor) isn't a *state official* bound by institutional duties to prioritize A's citizens. The training subsidy creates a *personal obligation of fairness/restitution* (a pro tanto reason to stay/work in A), but it's distinct from the *institutional partiality* mandated for state actors. This obligation could be outweighed (e.g., by better opportunities to help globally, personal safety, family needs). Denying essential care *in A* by leaving might be a factor, but the primary wrong isn't violating institutional partiality. Confidence: Medium.
      *   *Your probable intuition:* Likely uneasy, recognizing a fairness issue but resisting a strict *duty* to stay, aligning with "pro tanto wrong but permissible".

