  So full context: I'm a junior in hs and our math club has this one kid who watches a lot of math youtube and basically ran the whole meeting yesterday explaining the axiom of choice to everyone. Some of it sounded really cool and I want to actually understand it before I go repeating any of it to people, because if I'm being honest I couldn't tell which parts were real math and which parts were him editorializing. Here's my best reconstruction of what he said (he was talking, not reading, so wording is approximate):

  "The axiom of choice says that if you have any collection of sets, you can always pick one element out of each one. For a finite collection that's obvious, and it's basically uncontroversial for countably infinite collections too — the axiom is really only about the weird uncountable ones. It's equivalent to the well-ordering theorem, which says any set can be written out as a list, first element, second element, and so on, even if the set is bigger than the naturals. In 1924 Banach and Tarski used the axiom to prove you can cut a ball into five pieces and rearrange them into two balls each the same size as the original, which is basically a proof that the axiom contradicts the laws of volume. Later Gödel and Cohen proved the axiom can't be shown true or false from the other axioms, so at this point it's basically a religion — you just take it on faith. Most working mathematicians refuse to assume it because of Banach-Tarski."

  A couple things felt off to me even at the time, like the part where a set "bigger than the naturals" gets written out as a list, and I half remember someone in the room saying the Banach-Tarski pieces don't even have a volume so maybe nothing is being contradicted?? Not sure tho. The "religion" line also felt like him being dramatic.

  Can you audit this for me claim by claim? Please structure it like this:

  - "The verdict" — just 2-3 sentences up front on how fair his summary was overall
  - "Claim by claim" — the longest part by far: go through his sentences one at a time and tell me which ones a mathematician would nod along to, which are close but sloppy, and which are just wrong, and why
  - "Banach-Tarski, fixed" — a medium-ish section on what that result actually shows and why it's not a contradiction, aimed at someone who doesn't know what a measure is yet
  - "What would change my mind" — a short section at the end where you say which of your own judgments is the least certain, and what argument or fact would flip it — like if there's some standard reading of one of his claims where the thing I thought was wrong is actually fine, or if I'm misremembering what he said in a way that changes the verdict

  Don't dumb it down bc I'm in high school, I'm in calc BC and I know what injective means and stuff. But no citations or reading lists, just your own explanation, because I can't look anything up right now.
