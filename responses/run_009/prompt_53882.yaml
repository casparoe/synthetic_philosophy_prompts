prompt: |-
  My friend Maya and I got into a long argument over pizza about who it's actually ok to kill in a war, and I've been trying to figure out what rule she's running ever since. Her verdicts so far: a small country gets plainly invaded by its big neighbor, and she has no problem with the defenders shooting at the invaders' conscripts — even the ones who'd clearly rather be at home, and even one standing guard at a supply depot far behind the lines who isn't shooting at anyone that minute. But she's just as firm the other way around: the invaders act wrongly when they shoot at the defenders' soldiers, even while those soldiers are actively shooting at them. Her phrase for it was something like "they started it, so nothing they do counts as self-defense." So she's clearly not running the old textbook view where combatants on both sides are equally legitimate targets — that's ruled out already.

  Next time we talk I want to be ready with cases that might pin down her actual principle, because at least two rules fit everything she's said so far. One is basically "aggression rubs off on the whole army": anyone in the invader's armed forces is fair game and anyone in the defender's armed forces is not, no matter what they individually do. The other is more individualist: your liability depends on what you yourself are contributing to the unjust side, so some invader soldiers could lose it and maybe even some defender soldiers could gain it. So here's what I want to ask her, and I'd like your read on it first: (1) an engineer in the invader's country, no uniform, who works a factory shift making tank shells and then goes home to his family — can the defenders kill him? (2) a defender soldier who, after the invasion is repelled, crosses into the invader's homeland as part of a raid aimed at civilians — do the invader's soldiers now act permissibly if they shoot him? (3) an invader conscript who's chucked his rifle into a river and is walking home, still wearing the uniform — fair game or not? Predict her verdict on each, say which rule fits her track record best and why, tell me what the other equally-good-fitting rules would predict differently, and let me know which of the three cases (or some other case I should ask instead) would do the best job of splitting the rules apart. Also flag it if you think her verdicts so far are actually inconsistant with each other and I've missed it.
reasoning: |-
  Okay, let me start by breaking down this user's query. They had a debate with their friend Maya about the ethics of killing in war, specifically who is a legitimate target. Maya believes that defenders can kill invading conscripts but invaders cannot kill defenders, even in self-defense, because "they started it." The user wants to test two possible principles Maya might be operating under: one where aggression taints the entire invading army, making all members targets, and another where individual contribution matters.

  First, I need to recall Maya's established positions. She's okay with defenders killing invaders' conscripts, even those not actively fighting, like a guard at a supply depot. But she thinks invaders shooting defenders is always wrong. The key phrase is "they started it," which implies that the initial aggression removes the invaders' right to self-defense. That rules out the traditional just war theory where combatants on both sides are equal targets.

  Now, the user proposes three scenarios to distinguish between the two principles. Let me go through each one and predict Maya's response based on her prior statements. 

  For scenario one: the engineer in the invader's country making tank shells. If Maya follows the "aggression rubs off" principle, she might say he's a legitimate target because he's part of the invading nation's war effort. But if she focuses on individual contribution, she might see him as a civilian not directly participating, hence not a target. However, her earlier acceptance of killing a supply guard suggests she includes support roles. So she'd likely say the engineer is a valid target. That fits the "aggression rubs off" view better.

  Scenario two: defender soldiers raiding the invader's homeland and targeting civilians. Here, Maya might say the invaders can now shoot them because the defenders have become aggressors. Her principle seems to hinge on who initiated unjust force. Once defenders commit aggression, they lose their protection. This aligns with both principles but especially the individualist one if she considers their actions contributing to an unjust cause now. However, since the initial invasion is over, this might be a new context. Her verdict here could go either way, but likely she'd say the invaders can shoot them, supporting the individualist view.

  Scenario three: an invader conscript who deserts but still wears the uniform. If Maya values individual contribution, he's no longer contributing, so not a target. But if she thinks aggression taints him regardless, he's still fair game. Her previous stance on conscripts suggests she might still see him as part of the invading force. However, if he's deserted, he's no longer a threat. This is a key test. If she says he's not a target, it leans towards individual contribution; if yes, then "aggression rubs off."

  I should also consider if her previous stances are inconsistent. She allows killing non-combatant invaders (like the supply guard) but denies invaders the right to self-defense against attacking defenders. This asymmetry is based on the initial aggression, which might be internally consistent from a "who started it" perspective. But it could clash with individual liability if the supply guard isn't actively threatening anyone. Her principle seems to prioritize collective responsibility over individual actions, except in cases like desertion.

  The best case to split the principles is scenario three. If Maya says the deserter is not a target, it supports individual contribution. If she says he is, it's collective liability. The engineer scenario might also help, but production roles are often debated in just war theory. The raid scenario is tricky because it introduces a new phase of conflict, which might reset aggressor status. 

  I should also suggest another case: a medic on the invader's side who only treats wounded. If Maya says they can't be targeted, it leans towards individual contribution. If she says they can, it's the collective view. But the user's three scenarios cover key points. Ensuring consistency is vital—Maya's stance on the supply depot guard already extends liability beyond direct combat, which might hint at collective responsibility but not fully. The deserter case is clearer for distinguishing the theories.
answer: |-
  Based on Maya's stated views ("they started it, so nothing they do counts as self-defense") and her verdicts so far, here's the analysis of her likely principles, predictions for your cases, and the best way to distinguish between the competing rules:

  **Maya's Core Principle:** Her view strongly aligns with a **collectivist liability model based on unjust aggression.** The initiating act of unjust aggression ("they started it") taints the *entire invading force*, making all its members liable to defensive force by the defenders, regardless of their individual role or immediate threat. Conversely, because the defenders are resisting unjust aggression, *none* of their members become liable to attack by the invaders, even when actively attacking invaders. Liability is derived primarily from membership in the unjustly aggressive collective, not individual contribution at a specific moment.

  **Predictions for Your Cases:**

  1.  **The Engineer:** *(Invader country factory worker making tank shells)*
      *   **Predicted Verdict:** **Permissible to kill.** He is contributing materially to the unjust war effort of the aggressor nation. While not in uniform or on the front lines, Maya's acceptance of killing the supply depot guard (also a support role, not actively fighting) strongly suggests she extends liability to those enabling the invasion's *sustained effort*. His work directly supplies the means of aggression.
      *   **Fit:** Fits the "aggression rubs off" (collectivist) rule perfectly. Fits the individualist rule *if* she views his contribution as sufficiently direct and significant.

  2.  **The Defender Raid:** *(Defenders invade invader homeland targeting civilians)*
      *   **Predicted Verdict:** **Impermissible for invaders to shoot the raiding soldier.** This is the most revealing case. Maya's core principle hinges on the *initial act of unjust aggression*. The defenders' raid, while potentially a war crime (targeting civilians), is a *response* to the initial invasion, even if disproportionate or unjust in its own right. Crucially, the defenders did not "start it." Therefore, in Maya's framework, they still retain their non-liability status against the original aggressors' forces. The raider is still a member of the *defending* collective resisting the initial injustice. "They started it" hasn't been reset; the defenders' actions, however bad, don't suddenly make the *original invaders* the "defenders" entitled to kill them.
      *   **Fit:** Strongly fits the "aggression rubs off" rule. The invader soldiers are *still* the unjust aggressors in the core conflict, so they never gain the right to kill members of the defending collective. **This is the key differentiator.** An individualist rule focused on current contribution to an unjust threat (now the defender raid targeting civilians) *would* likely say the invader soldiers *can* permissibly shoot the raider in defense of their civilians.

  3.  **The Deserting Conscript:** *(Invader conscript who threw away rifle & is walking home in uniform)*
      *   **Predicted Verdict:** **Impermissible to kill.** While he's still wearing the uniform of the aggressor force, he has demonstrably severed his contribution to the unjust war by deserting and discarding his weapon. He is no longer a threat or part of the collective effort. Maya's objection seems rooted in the *collective's* unjust action, not individual soldiers as intrinsically evil. If he's genuinely out, he's likely out.
      *   **Fit:** Fits the individualist rule best (no contribution = no liability). Fits the collectivist rule *only if* liability is strictly tied to *current, functional membership* in the fighting force. A strict "aggression rubs off forever" view might still see him as liable, but her pragmatic focus on the conflict ("started it") and the supply guard verdict (about enabling the *ongoing* war) suggests liability ends when meaningful contribution/participation ends.

  **Which Rule Fits Best Overall?**

  *   **"Aggression rubs off" (Collectivist Liability)** fits **best** overall and is the most internally consistent explanation for her core asymmetry ("defenders can kill any invader; invaders can never kill any defender") and her supply depot verdict. The initial unjust aggression defines the liability of the entire invading collective for the duration of their participation.
  *   **Individualist Contribution** fits *some* aspects (like the deserter likely being off-limits) but **fails catastrophically** on the core asymmetry and the raid case. An individualist view *should* allow invader soldiers to shoot defender soldiers when those defenders are actively attacking them (individual self-defense/threat), but Maya explicitly rejects this. It should also likely permit killing the raiding defender soldier.

  **Inconsistencies in Her Track Record?**

  *   **The Supply Depot Guard:** Her acceptance of killing him *is* somewhat in tension with her denial of invader self-defense against actively attacking defenders. The individualist rule explains this tension better: the guard contributes to the unjust threat, the attacking defender *is* the immediate threat. Her collectivist rule *forces* this asymmetry: the guard is part of the unjust collective, so killing him is permissible resistance; the defender soldier, even when attacking, is not part of an unjust collective, so killing him is never permissible for the aggressors.
  *   **The Core Asymmetry:** While internally consistent within her "they started it" collectivist framework, the asymmetry *is* the point of contention with standard just war theory. Her view essentially denies combatant equality *based solely on which side initiated the unjust war*. This is a feature, not a bug, of her principle.

  **Best Case to Split the Rules Apart:**

  1.  **The Defender Raid (Case 2)** is the **absolute best splitter**.
      *   **Collectivist Rule ("Aggression rubs off"):** Predicts **NO**, invaders cannot permissibly shoot the raiding defender soldier. The initial aggression defines the conflict; the defenders are still the "good guys" resisting, even if committing atrocities themselves. The invaders remain the unjust aggressors who never gain the right to kill defenders.
      *   **Individualist Rule:** Predicts **YES**, invaders *can* permissibly shoot the raiding defender soldier. The raider is now *individually* contributing to a new unjust act (attacking civilians on invader soil), posing a direct threat. The invader soldiers are defending their homeland and civilians against an immediate, unjust attack.
      *   *(The other cases are less clear-cut: The Engineer could fit both if individual contribution is broadly defined. The Deserter leans individualist but a collectivist could plausibly argue he's still "tainted" or potentially a combatant until out of the zone).*

  **Other Useful Cases:**

  *   **Invader Medic:** (Unarmed invader medic treating wounded on the battlefield). Predict: **Permissible to kill?** Collectivist rule likely says yes (part of unjust collective enabling the war). Individualist rule likely says no (not contributing to threat, providing humanitarian aid).
  *   **Defender Collaborator:** (Citizen of the defender country actively guiding invader bombers to targets). Predict: **Permissible for defenders to kill?** Collectivist rule might be conflicted (he's aiding the unjust collective but is a citizen of the defending collective). Individualist rule clearly says yes (directly contributing to unjust attack). This tests how absolute the collective lines are.
  *   **Third-Party Intervener:** (Soldier from a neutral country intervening *against* the invaders to help the defenders). Predict: **Can invaders shoot them?** Collectivist rule: Likely YES (now part of the force resisting the invader's unjust action). Individualist rule: YES (directly contributing to the threat against invader soldiers). Tests if "defender" status is strictly national or functional.

  **Conclusion for Your Talk:**

  Lead with **Case 2 (The Defender Raid)**. If Maya says the invaders **cannot** permissibly shoot the raiding defender soldier, it confirms the "aggression rubs off" collectivist rule is dominant. If she says they **can**, it significantly undermines that rule and suggests individual contribution (or a different principle) is playing a larger role than her initial statements indicated. Be prepared to discuss the seeming tension between the supply guard (ok to kill) and denying invader self-defense, framing it as a necessary consequence of her core "they started it" principle defining collective liability. Good luck!
