  Here’s a critical reading of *Memento* through Dennett’s "center of narrative gravity" lens, designed to push beyond surface parallels and engage the film’s complexities as philosophical argument:

  ---

  ### **Dennett’s Theory in Motion: Leonard as Narrative Architect**  
  Dennett’s "center of narrative gravity" posits the self as an abstract point we project onto the stories we (and others) tell about our experiences—a tool for coherence, not an intrinsic entity. *Memento* literalizes this: Leonard’s amnesia forces him to *physically reconstruct* his narrative center through tattoos, notes, and Polaroids. His identity isn’t stored internally; it’s a distributed system of externalized plot points. The film thus becomes a laboratory for Dennett’s thesis: **the self is a user illusion maintained by narrative curation**.  

  ### **Twist #1: The Editor Paradox & Narrative Self-Deception**  
  When Leonard writes Teddy’s license plate to engineer his own future vendetta, he exposes a critical tension in Dennett’s model:  
  - **Strengthening Dennett**: Leonard’s act demonstrates that *curating the narrative is curating the self*. By selectively feeding data to his future "self," he constructs a new center of gravity—one anchored in vengeance rather than truth. The "editor" isn’t a pre-narrative soul but *part of the narrative process itself*: prior choices (e.g., tattooing "FACT 5: MEMORY IS TREACHEROUS") shape future interpretations.  
  - **Breaking Dennett**: Yet Leonard’s manipulation feels intentional—a *strategic* act by an agent who precedes the story he crafts. His grief, rage, and moral self-image ("I’m not a killer") persist beneath the narrative, driving his edits. This implies **a core of pre-narrative identity that Dennett’s theory struggles to explain**: the editor as a *persistent intentional stance*, not just an emergent story.  

  ### **Twist #2: Film Form as Philosophy**  
  The reverse chronology isn’t a gimmick; it’s Dennettian epistemology in cinematic form.  
  - **Backward Color Sequences**: Mirror Leonard’s lived experience—fragmented, causal-chain confusion. We feel his disorientation, exposing narrative as a *retroactive* imposition.  
  - **Forward Black-and-White Thread**: Shows narrative construction in real-time (e.g., Leonard rehearsing the Sammy Jankis story).  
  - **Convergence at the End**: The collision of timelines where Leonard "chooses" to forget Teddy’s revelation dramatizes the **birth of a narrative self**. The film’s structure argues that coherence emerges *only* through selective storytelling—even when it’s built on delusion.  

  ### **Where the Film Complicates Dennett: The Unnarratable Self**  
  *Memento* reveals fissures in the narrative theory of self by highlighting what resists narration:  
  1. **Embodied & Emotional Selves**:  
     - Leonard’s *procedural memory* (e.g., reflexively checking for pen taps, driving skills) operates below narrative awareness.  
     - His *grief* and *rage* persist as somatic echoes (e.g., pounding walls, trembling hands). These aren’t stories; they’re visceral, pre-linguistic realities that drive his actions.  
  2. **The Parasitic Narrative**:  
     - The Sammy Jankis story—likely Leonard’s own repressed trauma grafted onto a stranger—shows narratives can be **fictional yet identity-constitutive**. If the "center" sits over false data (Sammy’s insulin shock vs. Leonard’s wife), is it still a valid self? Dennett might say yes (stories need not be true to function), but the film frames this as *pathology*, not neutral coherence.  
  3. **Moral Self as Anchor**:  
     - Leonard’s mantra ("I’m not a killer") isn’t just a story—it’s a *compulsive ethical stance* that survives memory loss. This suggests a **proto-self** rooted in embodied values, challenging narrative’s monopoly on identity.  

  ### **What the Film Argues Beyond Philosophy**  
  *Memento* doesn’t just illustrate Dennett; it critiques him by exposing the **violence of narrative self-creation**. Leonard’s story isn’t a benign "user illusion"—it’s a weaponized tool for self-deception that destroys others (Teddy) and entraps himself. Where Dennett describes narrative as a pragmatic tool for navigation, the film shows it as a **life-or-death commitment to coherence at any cost**. The self, in *Memento*, is less a center of gravity than a black hole: a narrative vortex that consumes facts to sustain its own existence.  

  ---

  ### **Seminar Discussion Launch Points**  
  - **Dennett Affirmed**: How does Leonard’s externalized system embody the narrative self? Is identity reducible to "evidence management"?  
  - **Dennett Challenged**: Do Leonard’s emotional residues and habits imply a non-narrative core? Does the "editor" of the narrative require a self *before* the story?  
  - **Film as Philosophy**: Does the reverse chronology deepen our understanding of narrative identity, or just dramatize it?  
  - **Ethical Turn**: Is Leonard’s self-deception a perversion of narrative gravity, or its inevitable endpoint?  

  This reading treats *Memento* not as an allegory for Dennett but as a partner in debate—one that pressures the theory with embodied, emotional, and ethical counterpoints. The film suggests that while narrative constructs the self we recognize, it cannot fully account for the selves we *live* or *destroy* in the process.
