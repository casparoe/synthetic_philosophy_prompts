prompt: |-
  I teach an upper-level seminar in modal metaphysics, and I'm writing the take-home final. I'd like a single essay question on origin essentialism — the view that I could not have developed from a different sperm and egg — that cannot be answered by reciting the rigid-designator machinery from Naming and Necessity or by trotting out the standard essence-versus-accident taxonomy. The difficulty should come from a specific crux: the style of reasoning Kripke gestures at in favor of essential origins appears to overgenerate, since parallel reasoning seems to show that the precise moment of conception, or even the zygote's exact location, is essential to me — a conclusion almost everyone finds absurd. The question must force candidates to do at least three things. First, reconstruct the argument for origin essentialism in a form precise enough that one can say exactly which premise the overgeneration objection targets, rather than waving at "modal intuitions." Second, assess whether the essentialist can block the overgeneration in a principled way — for instance by claiming that which gametes were involved fixes which individual came into existence, whereas the time or place of conception merely affects how that individual's life went — and, crucially, whether that contrast can be defended non-circularly or simply presupposes the very plausibility of origin essentialism that the argument was meant to establish. Third, evaluate a deliberately weakened alternative: a "sufficiency" view on which I did not need to develop from those very gametes, but merely from some gamete pair of the right sort, so long as the resulting person counts as my origin by some qualitative criterion. The question should press whether this weakened view retains anything of what made origin essentialism philosophically interesting, given that on it I could have existed while being genetically someone else entirely. Please provide the question itself, a model answer of roughly 650 words, and a marking scheme out of 20 that allocates marks across five must-hit points, gives a one-line note for each on how candidates typically botch it, and states explicitly what separates an A answer from a B answer — the dividing line should turn on whether the candidate can articulate the circularity worry about the "fixes which individual" defense in a form the defender would recognize as needing an answer, rather than merely asserting that times and places "seem" non-essential while gametes "seem" essential.
