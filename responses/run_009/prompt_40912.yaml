prompt: |-
  I'm in a reading group that spent most of a year slogging through the Methods of Ethics, and now we've moved on to the Sidgwick paranormal stuff — his twenty-odd years deep in the Society for Psychical Research, the census of hallucinations, all the séance-sitting and medium-testing — which honestly surprised half the group. The standard scholarly story is that this wasn't a quirky hobby but flowed straight out of the problem he left at the end of the Methods: the dualism of practical reason, where if there's no God and no afterlife, then rational egoism and rational utilitarianism can each be fully rational while pointing you at different lives, and nothing inside practical reason itself breaks the tie. On that story, empirical evidence of survival (or of any moral governance of the universe at all) was about the only thing that *could* close the gap, so investigating haunted houses and telepathy was basically doing ethics by other means.

  So here's my question: what's your credence that this standard story is basically right — that Sidgwick's psychical work was primarily, not just partly, driven by the dualism? I want a real number with a decomposition, not vibes and not "it depends on what primarily means" (pick an interpretation, say which one, and give the number). Some terms I'd put on the table, though add or reject them as you see fit: the probability that the dualism is actually as insoluble within Sidgwick's own axioms as he believed, since if there's a clean internal solution the whole motive for the empirical detour weakens; the probability that Sidgwick himself thought psychic evidence could genuinely resolve it, as opposed to being pulled in by scientific-debunker instincts, the social gravity of the Cambridge crowd, or his wife's involvement in the work; the probability that the historians' emphasis on the dualism motive is a just-so story that reads the Methods backwards onto the séances; and whatever weight you'd give to the actual shape of the SPR output — e.g. the census of hallucinations being set up like a giant probability calculation about whether death-related apparitions beat chance, which looks a lot more like a man trying to confirm survival than a man merely debunking frauds. A rough probability and one line of justification for each term, then show me how they combine into your final number.

  Then tell me which single term your number is most sensitive to, and what evidence or argument would move it the most. For reference, my own credence sits around 0.65 — I keep flip-flopping because the "he just enjoyed the investigation and had good debunking instincts" explanation keeps feeling underrated to me — so also say where you think someone at 0.9 (the true believers in the standard story) most likely disagrees with me: which of the decomposition terms is doing the separating.
