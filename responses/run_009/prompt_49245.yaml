prompt: |-
  I'm a staff attorney for the sentencing commission of a mid-sized state. Our legislature has just enacted a statute requiring judges to impose sentences that are "no more severe than the offender's desert" while also "taking account of public safety, deterrence, and rehabilitation" — that is, they have legislated a hybrid of retributivism and consequentialism without saying anything about how the two halves interact, and the commission is directed to issue practical guidance within six months. Our judges sentence roughly thirty felony cases a week, have no philosophical training, and have at most fifteen minutes of deliberation beyond the presentence report in the ordinary case. The commission has provisionally settled on limiting retributivism as the skeleton: desert sets a range rather than a point, and consequentialist considerations may move a sentence only within that range, never past its edges. My job is to turn that skeleton into something a judge can actually run.

  Please draft the decision procedure. It should do the following:

  1. Give the judge a small, ordered set of questions that converts the theory into steps, with guidance on what counts as a sufficient answer at each step — including how a judge is supposed to reason about the width of the desert range, not just its existence, since a wide range is nearly no constraint at all and a narrow one is nearly a mandatory sentence.
  2. Say explicitly what the judge should do when the answers are unavailable or fuzzy, since desert does not come with a number attached and the empirical evidence on deterrence at the level of the individual case is almost always worse than it looks.
  3. Mark the points at which the procedure necessarily hands the decision over to judgment, and explain why those particular points cannot be proceduralized — as opposed to points that merely haven't been proceduralized yet.
  4. Be honest about the failure modes we should expect: judges smuggling consequentialist aggravation in as "desert"; deterrence arguments doing work their evidence cannot support; and the risk that publishing a clean-looking flowchart creates the appearance that the hard value questions have been answered when they have merely been relocated.

  Then run the procedure on three cases, showing its output at each step:

  (a) A 22-year-old first offender with no prior record, convicted of armed robbery in which no one was physically hurt, with strong family and employment ties and an assessed low risk of reoffending — the case where leniency pressure comes from both halves of the statute and the procedure must still say something.

  (b) A 61-year-old woman with no prior convictions, convicted of embezzling from her employer over a decade in order to cover a grandchild's medical debt, where the prosecution argues that general deterrence demands prison because embezzlement by trusted employees is chronically under-prosecuted and lenient sentences invite more of it — a case where the desert range and the deterrence argument pull in opposite directions.

  (c) A twice-convicted burglar whose habitual-offender exposure puts him near the statutory ceiling at exactly the moment the legislature is under public pressure about a burglary wave — the case where the desert ceiling and the deterrence push are in direct conflict. This is the one where the procedure will likely give an answer the commissioners will not like, or expose that the statute's two commands cannot both be honored, and I need that surfaced rather than smoothed over.

  Finally, include a short section addressed to the commission itself rather than to the judges: what the procedure cannot do, which kinds of cases it will systematically mishandle (offender ignorance of the law, strict liability offenses, desert for attempts versus completed harms), and whether there are circumstances under which a published procedure of this kind makes sentencing worse than honest, explicit disagreement about the values would be.
reasoning: |-
  We are designing a decision procedure for judges to implement a hybrid sentencing model based on limiting retributivism. The core idea is that desert sets a range (with upper and lower bounds) and consequentialist factors (public safety, deterrence, rehabilitation) can adjust the sentence within that range, but not beyond it.

  The procedure must be practical for judges with limited time and no philosophical training. We must address:
  1. How to determine the desert range (both existence and width) and how to avoid making the range so wide as to be meaningless or so narrow as to be mandatory.
  2. How to handle uncertainty in desert and in consequentialist factors (like deterrence).
  3. Where judgment is necessary and why it cannot be proceduralized.
  4. Failure modes: judges smuggling consequentialism into desert, overreliance on weak deterrence evidence, and the illusion that the procedure solves hard value questions.

  Proposed Decision Procedure:

  **Step 1: Determine the Desert Anchor Point**
     - **Question:** What is the sentence that would be typically imposed for this offense and offender characteristics in this jurisdiction, based on statutory sentencing ranges, guidelines (if any), and community standards of proportionality?
     - **Guidance:** 
       - Start with the statutory range for the offense and the offender's criminal history (if applicable). 
       - Adjust within that range for typical aggravating and mitigating factors (e.g., harm caused, intent, victim vulnerability, remorse, acceptance of responsibility). 
       - The anchor point is the sentence that reflects the "core" desert for the offense without considering the consequentialist factors. 
     - **Sufficient answer:** A specific sentence (e.g., 3 years) or a narrow range (e.g., 2-4 years) that the judge can justify by reference to past cases, statutory factors, and sentencing norms. 
     - **Handling fuzziness:** If the case is atypical and no clear anchor exists, the judge should err on the side of a wider range and document the reasons for uncertainty. The anchor point is not required to be exact but must be defensible.

  **Step 2: Set the Desert Range Around the Anchor**
     - **Question:** What is the minimum and maximum sentence that would not be clearly disproportionate (i.e., not so lenient as to trivialize the harm or so severe as to be shocking) for this offense and offender?
     - **Guidance:** 
       - The width of the range should reflect the degree of uncertainty in desert. Factors that might widen the range include: 
          - Novelty or ambiguity in the offense circumstances.
          - Conflicting community values about the offense (e.g., non-violent drug offenses in a changing legal landscape).
          - Unusual offender characteristics that make desert harder to assess (e.g., mental health issues that reduce culpability but not to the level of an insanity defense).
       - The range should not be so wide as to include sentences that would be clearly disproportionate. The judge must articulate a reason for the chosen width.
       - **Rule of thumb:** The range should generally be no wider than 25% above and below the anchor point for typical cases, unless there are strong reasons for a wider range (which must be explained). For example, an anchor of 4 years might yield a range of 3 to 5 years (which is 25% below and above). But in cases of high uncertainty, the range might be wider (e.g., 2 to 6 years for the same anchor) but must be justified.
     - **Sufficient answer:** A specific range (e.g., 3-5 years) with a brief explanation of the factors that determined the width (e.g., "the harm was significant but the offender's intent was less clear").
     - **Handling fuzziness:** If desert is highly uncertain, the judge must still set a range but should note the uncertainty and consider a wider band. The range must have defensible boundaries.

  **Step 3: Assess Consequentialist Factors (Public Safety, Deterrence, Rehabilitation)**
     - **Question:** Within the desert range set in Step 2, what sentence best serves the goals of public safety, deterrence, and rehabilitation?
     - **Guidance:** 
       - **Public safety:** Consider the risk of reoffending (using validated risk assessment tools if available) and the seriousness of the potential harm. Higher risk may push toward the upper end of the desert range, but only if the risk is substantial and credible. 
       - **Deterrence:** 
          - General deterrence: Would a higher sentence in this case likely deter others? Be cautious: the evidence for general deterrence at the individual case level is weak. The judge must require a specific, evidence-based argument (e.g., "this type of offense is increasing in the community and is known to be responsive to sentencing severity"). 
          - Individual deterrence: Would a more severe sentence deter this offender? Consider the offender's history and response to prior sanctions.
          - **Evidence standard:** Do not rely on deterrence arguments without at least some empirical basis (e.g., studies, local data) and a logical connection to the case. If the evidence is weak, deterrence should be given little weight.
       - **Rehabilitation:** Consider the offender's prospects for rehabilitation and whether a particular sentence (e.g., probation with treatment) would facilitate it. 
       - **Weighting:** The judge should weigh these factors and decide whether they justify moving toward the lower or upper end of the desert range. 
     - **Sufficient answer:** A decision to set the sentence at a specific point within the desert range, supported by reasons for the chosen point. If no consequentialist factors are present or they are in equipoise, the default is the anchor point from Step 1.
     - **Handling fuzziness:** If evidence for consequentialist factors is absent or highly speculative, the judge should default to the anchor point. The burden of proof for moving the sentence within the range rests on the party advocating for a departure from the anchor.

  **Step 4: Impose the Sentence**
     - The sentence must be within the desert range. If the consequentialist factors would require a sentence outside the desert range, the desert constraint prevails.

  **Points of Necessary Judgment:**
  1. **Setting the desert anchor and range (Steps 1 and 2):** This requires normative judgment about proportionality. It cannot be fully proceduralized because it depends on the judge's understanding of community values and the relative seriousness of offenses. We provide guidance (statutory ranges, past cases) but the judgment is inherent.
  2. **Weighing consequentialist factors (Step 3):** The strength of evidence and the weight given to each factor (e.g., how much to prioritize deterrence over rehabilitation) is a value judgment. We cannot eliminate this because the statute gives multiple goals and does not rank them.

  **Expected Failure Modes:**
  1. **Desert range manipulation:** Judges might set very wide ranges to effectively nullify the desert constraint, or they might smuggle consequentialist factors into the desert determination (e.g., "his desert is higher because he is a high risk"). 
     - *Mitigation:* Require judges to justify the range width and the anchor point with reference to retributive factors only (harm, culpability). Review of sentences on appeal for proportionality.
  2. **Overreliance on weak deterrence evidence:** Prosecutors may argue for general deterrence without solid evidence. 
     - *Mitigation:* Require specific, on-point evidence for deterrence arguments. If none, deterrence should not move the sentence.
  3. **Illusion of resolution:** The procedure may make sentencing appear mechanical when it is not. 
     - *Mitigation:* Emphasize in training that the procedure structures discretion but does not eliminate judgment. Require written reasons for key decisions (anchor, range, and consequentialist adjustment).

  ---

  **Running the Procedure on Cases:**

  **Case (a): 22-year-old first offender, armed robbery, no physical injury, strong ties, low risk.**
  - **Step 1: Desert Anchor**
    - Statutory range for armed robbery: 5-20 years. 
    - Mitigating factors: no injury, first offense, young age, strong ties. 
    - Anchor: 6 years (toward the lower end of the statutory range due to mitigating factors).
  - **Step 2: Desert Range**
    - Minimum: 5 years (statutory minimum, and not clearly disproportionate given the seriousness of armed robbery). 
    - Maximum: 8 years (to account for the fact that it's still a violent felony). 
    - Justification: The harm was serious (threat of violence) but no one was hurt, and the offender is young and has no record. Range width is 3 years (from 5 to 8), which is about 50% of the anchor (6) but within reason for a violent offense with mitigating factors.
  - **Step 3: Consequentialist Factors**
    - Public safety: Low risk of reoffending → supports lower sentence.
    - Rehabilitation: Strong ties and employment → supports probation or minimal prison.
    - Deterrence: Not a strong factor in this case (no evidence that leniency would encourage others).
    - Adjustment: Move to the bottom of the desert range: 5 years. But note: 5 years is still prison. However, the judge might consider whether the desert minimum can be a non-prison sentence? The statute might require prison for armed robbery. If not, the judge could set the anchor lower (e.g., 3 years) but armed robbery is a violent felony. 
      - *Re-evaluate:* If the statutory minimum is 5 years and the judge believes that the minimum desert is 5 years, then the sentence is 5 years. But if the judge believes that desert could be as low as probation (if the law permits), then the range might be probation to 8 years. However, given the seriousness, let's assume the judge sets the desert floor at 5 years. 
      - Consequentialist factors push for the floor: 5 years.
  - **Sentence:** 5 years.

  **Case (b): 61-year-old woman, first offense, embezzlement over 10 years for grandchild's medical debt.**
  - **Step 1: Desert Anchor**
    - Statutory range for embezzlement: 0-10 years (assuming a mid-level felony).
    - Mitigating factors: motive (medical debt), no prior record, age, restitution possible.
    - Aggravating factors: significant breach of trust, long duration, substantial amount.
    - Anchor: 3 years (balance: serious offense but strong mitigation).
  - **Step 2: Desert Range**
    - Minimum: 1 year (probation with some jail time or home confinement could be considered, but given the amount and duration, some imprisonment might be required for desert). 
    - Maximum: 5 years (beyond which would be excessive given the motive and lack of prior record). 
    - Range: 1-5 years. Justification: The offense is serious but the circumstances are highly sympathetic. The range is wider than the anchor (3) to reflect the tension.
  - **Step 3: Consequentialist Factors**
    - Public safety: Very low risk of reoffending (age, no prior record) → supports lower sentence.
    - Rehabilitation: Likely not needed beyond restitution and probation → supports lower sentence.
    - Deterrence: Prosecution argues for general deterrence because embezzlement by trusted employees is under-prosecuted and leniency would invite more. 
      - Evidence required: Prosecution must provide evidence (e.g., data showing rising embezzlement in the state, studies showing that sentences for white-collar crime affect deterrence). 
      - If evidence is weak (as it often is), the judge should give little weight to deterrence. 
      - Without strong evidence, deterrence does not justify moving toward the maximum. 
      - If the prosecution provides strong evidence, the judge might move toward the higher end, but note: desert maximum is 5 years. 
      - However, the judge must balance: even if deterrence pushes up, the other factors push down. 
    - Adjustment: Without strong deterrence evidence, the sentence should be toward the lower end, say 1 year. If the prosecution has strong evidence, the judge might set the sentence at 3-4 years. But let's assume the evidence is weak. 
  - **Sentence:** 1 year (or probation with conditions, if the desert minimum allows).

  **Case (c): Twice-convicted burglar, habitual offender, statutory ceiling near, during a burglary wave.**
  - **Step 1: Desert Anchor**
    - Statutory range for burglary with habitual offender status: 10-30 years (say). 
    - The offense: third burglary. 
    - Anchor: Given the prior record and the current offense, the anchor might be 20 years (midpoint of the range?).
  - **Step 2: Desert Range**
    - Minimum: 15 years (given the prior record, less than 15 might trivialize the harm and the pattern). 
    - Maximum: 25 years (beyond which would be excessive for burglary without injury). 
    - Justification: The offender has a pattern of burglary, but the offenses are non-violent. The range reflects that desert has an upper limit even for repeat offenders. 
  - **Step 3: Consequentialist Factors**
    - Public safety: High risk of reoffending (based on history) → supports upper end.
    - Deterrence: The legislature is under pressure about a burglary wave. The prosecution argues for maximum sentence (30 years) for general deterrence. 
      - But note: the desert maximum is 25 years. 
      - The judge cannot exceed 25 years even for deterrence. 
    - Rehabilitation: Likely low given history, but not a factor pushing for leniency.
    - Adjustment: Consequentialist factors push toward the top of the desert range: 25 years. 
  - **Sentence:** 25 years. 
    - **Conflict:** The statutory ceiling is 30 years, and the legislature might want a 30-year sentence for deterrence. But the desert constraint (Step 2) sets a maximum of 25. The procedure exposes that the two commands (desert ceiling and deterrence) conflict. The judge must honor the desert constraint. 
    - **Note:** This might be unpopular, but the procedure forces the issue. The commission must decide: if the legislature wants deterrence to sometimes override desert, then the statute must be amended. The procedure as designed will not allow a sentence above 25 years.

  ---

  **Memo to the Commission:**

  **What the Procedure Cannot Do:**
  1. **Resolve deep value conflicts:** The procedure structures the decision but does not eliminate the tension between retributivism and consequentialism. In cases like (c), the procedure will sometimes produce a sentence that seems too low to those focused on deterrence or too high to those focused on rehabilitation.
  2. **Handle special categories of cases:**
     - **Offender ignorance of the law:** The procedure does not explicitly address whether ignorance affects desert (usually it does not) or consequentialism (might affect rehabilitation). Judges must fit this into the desert range (as a mitigating factor?) or in consequentialism (as affecting risk?).
     - **Strict liability offenses:** Desert is harder to assess because culpability is not required. The procedure might lead to very wide desert ranges, undermining the constraint.
     - **Attempts vs. completed harms:** The procedure assumes that desert is primarily based on harm and culpability. Judges must set the desert anchor lower for attempts than for completed crimes, but the exact discount is a judgment call.
  3. **Eliminate disparities:** Without clear anchoring, judges in different regions might set different desert ranges for similar cases.

  **Systematic Mishandling:**
  - **Cases with high moral emotion:** Crimes that provoke public outrage (e.g., child abuse) might lead judges to set desert ranges too high to avoid appearing lenient.
  - **Cases with weak evidence:** When evidence for desert or consequentialist factors is poor, the procedure relies on default rules that might not fit.

  **Risks of Publishing the Procedure:**
  - **Worse than honest disagreement?** In the short term, yes, if the procedure creates a false sense of objectivity and suppresses necessary debates about values. However, over time, the procedure may structure discretion and reduce unwarranted disparities. 
  - **Recommendation:** Accompany the procedure with robust training, emphasizing that it is a tool for disciplined reasoning, not a substitute for judgment. Encourage appellate review to ensure that desert ranges are set reasonably. 

  The procedure is a practical tool to implement the statute, but it cannot resolve the legislature's failure to specify how to balance desert and consequentialism. The commission should be prepared to revisit the procedure based on feedback and to advocate for legislative clarification if needed.
answer: |-
  ### Sentencing Decision Procedure: Limiting Retributivism Hybrid Model  
  **Core Principle:** Desert sets a non-exceedable sentencing range. Consequentialist factors (public safety, deterrence, rehabilitation) may adjust the sentence *only within that range*. Desert boundaries are absolute.  

  ---

  ### Decision Procedure for Judges  
  **Time Allocation:** 15 minutes per case (after presentence report review).  
  **Materials Required:** Statutory sentencing ranges, presentence report, risk assessment tool (if available), brief on local deterrence data (if provided).  

  #### Step 1: Establish the Desert Anchor Point (2–3 minutes)  
  **Question:** *"What sentence would typically be imposed for this offense and offender, considering only the harm caused and the offender’s culpability (intent, motives, role)? Ignore future risks or societal effects."*  
  **Guidance:**  
    - Start with the statutory minimum/maximum for the offense. Adjust for:  
      - **Harm:** Physical injury, financial loss, psychological trauma.  
      - **Culpability:** Premeditation, justification (e.g., duress), mental state.  
      - **Mitigators/Aggravators:** Remorse, victim provocation, weapon use.  
    - **Sufficient Answer:** A single "anchor" point (e.g., "5 years"). Avoid ranges here.  
    - **Fuzziness Handling:**  
      - If culpability is unclear (e.g., ambiguous intent), default to the statutory midpoint.  
      - **Why judgment is unavoidable:** Desert is inherently normative. No algorithm can replace human judgment about "just deserts" for unique harms.  

  #### Step 2: Set the Desert Range Width (3–4 minutes)  
  **Question:** *"What is the narrowest defensible range around the anchor where no sentence would be clearly unjust (too lenient or too harsh) under community standards?"*  
  **Guidance:**  
    - **Width Factors:**  
      - **Narrow Range (≤20% of anchor):** Clear-cut cases (e.g., unambiguous harm, average culpability).  
      - **Wide Range (20–50% of anchor):** High uncertainty (e.g., conflicting victim/offender accounts, novel offense context).  
    - **Boundary Test:** Ask:  
      - *"Would a sentence below [min] trivialize the harm?"*  
      - *"Would a sentence above [max] shock the conscience of informed citizens?"*  
    - **Sufficient Answer:** A range (e.g., "4–6 years" for a 5-year anchor). Judges must briefly justify the width (e.g., "wide range due to disputed intent").  
    - **Fuzziness Handling:**  
      - If range width is indeterminate, use statutory min/max as temporary bounds but refine in Step 3.  
      - **Why judgment is unavoidable:** "Community standards" are unquantifiable and culturally contingent.  

  #### Step 3: Apply Consequentialist Factors (5–6 minutes)  
  **Question:** *"Within the desert range, which sentence best serves public safety, deterrence, and rehabilitation?"*  
  **Guidance:**  
    - **Public Safety:** Use risk assessment tools. Low risk → lower sentence; high risk → higher sentence.  
    - **Deterrence:**  
      - General deterrence requires *evidence* (e.g., local crime trend data, studies). No evidence → ignore.  
      - Individual deterrence: Prior sanctions’ effectiveness.  
    - **Rehabilitation:** Treatment programs, employment stability, support networks.  
    - **Weighting:** No hierarchy. Judges may balance factors but must explain.  
    - **Sufficient Answer:** A sentence within the desert range (e.g., "5 years") with a concise rationale (e.g., "low risk supports lower end; weak deterrence evidence ignored").  
    - **Fuzziness Handling:**  
      - If evidence is missing (e.g., no deterrence data), default to the anchor point.  
      - **Why judgment is unavoidable:** Weighing competing societal goals requires subjective trade-offs.  

  #### Step 4: Finalize Sentence (1–2 minutes)  
  **Action:** Impose the sentence from Step 3. If it exceeds the desert range, revert to the nearest bound.  
  **Record:** Justify in writing: (1) Anchor, (2) Range width, (3) Consequentialist adjustment.  

  ---

  ### Failure Mode Warnings  
  1. **Desert Manipulation:** Judges may disguise consequentialist aggravation as "desert" (e.g., "high risk makes the crime inherently worse"). Mitigation: Training emphasizes desert is *only* about past harm/culpability.  
  2. **Deterrence Overreach:** Prosecutors may overstate deterrence with anecdotal evidence. Mitigation: Require empirical support; else, disregard.  
  3. **Illusion of Precision:** Flowcharts imply value conflicts are resolved. Reality: Hard choices are relocated (e.g., "How wide is 'just'?"). Mitigation: Disclose this in training.  

  ---

  ### Case Demonstrations  
  #### Case (a): First-Time Armed Robber (22 y/o, no injury, strong ties, low risk)  
  - **Step 1 (Anchor):** Statutory range: 5–20 years. Harm: Threatened violence. Culpability: Moderate (planned but no injury). Mitigators: Youth, remorse. **Anchor: 7 years.**  
  - **Step 2 (Range):** Clear culpability but no injury → narrow range. Test: <5 years trivializes; >9 years excessive. **Range: 5–9 years.**  
  - **Step 3 (Consequentialist):** Low risk → favors lower end. Rehabilitation (strong ties) → favors lower end. Deterrence: No evidence. **Adjustment: 5 years.**  
  - **Sentence: 5 years** (minimum of desert range).  

  #### Case (b): Embezzlement for Medical Debt (61 y/o, no prior record, decade-long)  
  - **Step 1 (Anchor):** Statutory range: 0–10 years. Harm: High financial loss. Culpability: Low (altruistic motive). **Anchor: 2 years.**  
  - **Step 2 (Range):** Sympathetic motive → wider range. Test: <1 year trivializes; >4 years is unduly harsh. **Range: 1–4 years.**  
  - **Step 3 (Consequentialist):**  
    - Public Safety: Low risk (age, no prior record) → lower end.  
    - Deterrence: Prosecution argues general deterrence but provides no local data → **ignored**.  
    - Rehabilitation: Restitution plan → supports probation.  
    **Adjustment: 1 year (probation with restitution).**  
  - **Sentence: 1 year probation.**  

  #### Case (c): Habitual Burglar (Third strike, burglary wave, statutory max 30 years)  
  - **Step 1 (Anchor):** Habitual offender statute → 25-year baseline. Harm: Property loss. Culpability: High (repeated intent). **Anchor: 25 years.**  
  - **Step 2 (Range):** High culpability but non-violent → moderate width. Test: <20 years trivializes pattern; >28 years is excessive for non-violent crime. **Range: 20–28 years.**  
  - **Step 3 (Consequentialist):**  
    - Public Safety: High risk → upper end.  
    - Deterrence: Prosecution cites burglary wave; provides police data showing 30% spike → **valid**. Favors upper end.  
    - **Adjustment: 28 years.**  
  - **Sentence: 28 years** (within desert range).  
  - **Conflict Exposed:** Statutory max is 30 years, and deterrence pushes for 30, but desert caps at 28. **The procedure forces the judge to prioritize desert, overriding deterrence.**  

  ---

  ### Commission Brief: Limitations and Risks  
  **What the Procedure Cannot Do:**  
  1. **Resolve Foundational Conflicts:** It cannot reconcile when desert and consequentialism are irreconcilable (e.g., Case c). Judges will be forced to "cap" deterrence at the desert ceiling, inviting political backlash.  
  2. **Handle Edge Cases Systematically:**  
     - **Ignorance of Law:** Desert range may be narrowed (lower culpability), but rehabilitation dominates. Risk: Under-punishing "knowing" vs. "ignorant" offenders.  
     - **Strict Liability Offenses:** Desert is artificial (no culpability). Procedure may over-rely on consequentialism, violating the model.  
     - **Attempts vs. Completed Crimes:** Desert ranges for attempts must be lower, but the discount rate is arbitrary (e.g., 50%? 30?).  
  3. **Empirical Gaps:** When deterrence evidence is poor (most cases), the procedure defaults to desert, potentially underdeterring crimes sensitive to sentencing (e.g., white-collar).  

  **Systematic Mishandling Risks:**  
  - **Moral Luck Cases:** Offenders causing identical harm face different sentences due to consequentialism (e.g., drunk drivers who hit vs. miss a pedestrian).  
  - **Victimless Crimes:** Desert is nebulous (e.g., drug possession). Judges may set arbitrarily wide ranges, gutting the constraint.  
  - **High-Profile Cases:** Public pressure may widen "desert" ranges to accommodate deterrence (e.g., "This fraud shocked the community, so desert is 0–15 years instead of 5–10").  

  **When the Procedure May Make Sentencing Worse:**  
  - **Illusion of Neutrality:** If judges treat the flowchart as a "value-neutral algorithm," it may suppress necessary debates about desert (e.g., "Is robbery always more deserving than burglary?").  
  - **Resource Inequities:** Risk assessments and deterrence data are often unavailable in poor jurisdictions, widening disparities.  
  - **Worst-Case Scenario:** In a crime wave, judges may manipulate Step 2 to set desert ceilings at statutory maxima (e.g., "Given public fear, 30 years isn't excessive"), voiding the retributive limit.  

  **Recommendation:** Pair this procedure with:  
  - Mandatory desert-range justifications in written opinions.  
  - An appellate review standard that audits range width for "clear disproportionality."  
  - A sunset clause prompting re-evaluation if >20% of sentences cluster at range extremes (indicating systematic conflict).  

  ---  
  This procedure operationalizes the statute but exposes its tensions. It is a tool—not a solution—for balancing irreconcilable goals. The commission must decide if this honesty is preferable to obscuring the conflicts.
