prompt: |-
  A friend of mine who took one ethics course summarized the "wrong kind of reasons" problem for me like this: "D'Arms and Jacobson basically proved consequentialism is false. If a demon will torment you unless you desire that your children fail, you have an overwhelming reason to want that. But it's obviously the wrong kind of reason — it doesn't make the desire rational, or your children failing a good thing. The consequentialist has to say the desire is rational anyway, since having it gets you more satisfaction, which is absurd. So they concluded that whether an attitude is rational never depends on anything you want." I feel like the last sentence overshoots, and I half-remember the blackmail/demon style cases being about belief rather than desire. Is this a fair summary? Tell me which parts he got right, what's subtly wrong, and whether his conclusion survives once you fix the errors. Keep it to one paragraph, no more than 200 words.
reasoning: |-
  Okay, the user's friend summarized the "wrong kind of reasons" problem, claiming D'Arms and Jacobson disproved consequentialism. The friend argued that if a demon threatens you unless you desire your children's failure, you have a strong reason to want that desire, but it's the "wrong kind" of reason—it doesn't make the desire rational or the failure good. The consequentialist, focusing on outcomes, would say the desire is rational because it avoids torment, which seems absurd. The friend concluded that attitude rationality never depends on what you want.

  First, I need to recall D'Arms and Jacobson's actual work. They discussed the Wrong Kind of Reasons (WKR) problem, which often involves scenarios like evil demons or pragmatic reasons for attitudes. But it's not specifically about refuting consequentialism. The problem distinguishes between reasons that bear on the object of the attitude (right kind) and external incentives (wrong kind). For example, believing something because of evidence vs. a threat.

  The friend's summary has some inaccuracies. The demon case is typically about belief or other attitudes, not just desire. Also, D'Arms and Jacobson didn't aim to disprove consequentialism; they addressed issues in fitting attitude accounts of value. Consequentialism isn't directly targeted here—it's about the nature of reasons for attitudes.

  The user feels the conclusion overshoots, and they're right. The friend's last sentence says attitude rationality never depends on what you want. That's too strong. D'Arms and Jacobson argue that pragmatic reasons don't make attitudes fitting, but that doesn't mean desires or goals are irrelevant. Instrumental rationality still matters. The key is distinguishing fittingness from rationality.

  I should clarify the difference between rationality and fittingness. An attitude can be instrumentally rational (like wanting children to fail to avoid torment) without being fitting (since failure isn't desirable). The consequentialist might conflate these, but the WKR problem highlights the distinction, not that desires are irrelevant.

  The user mentions remembering similar cases about belief. That's correct; classic examples involve believing against evidence due to threats, showing pragmatic reasons don't make beliefs justified. So the friend's focus on desire might be misplaced, though the structure is similar.

  In the response, I need to correct these points: the demon case applies broadly, the target isn't consequentialism per se, and the conclusion is nuanced—attitude rationality can depend on desires for instrumental reasons, but not for fittingness. The friend's sweeping claim is inaccurate.
answer: |-
  Your friend captures the core WKR problem (e.g., demon threats provide reasons *to have* an attitude, but not reasons *of the right kind* for its *fittingness* or rational justification). However, several points are subtly off:

  1.  **Target:** D&J weren't primarily refuting *consequentialism* wholesale, but challenging *fitting-attitude* analyses of value and simplistic accounts of reasons for attitudes. Consequentialism faces related issues, but isn't the direct target.
  2.  **Case Type:** While often framed with beliefs (e.g., believing against evidence to avoid harm), the problem applies equally to desires, emotions, etc. The desire case is valid.
  3.  **Conclusion Overshoot:** Their conclusion ("rationality never depends on anything you want") is too strong and incorrect. D&J distinguish *fittingness* (does the attitude correctly represent its object?) from *rationality* broadly, which *can* include instrumental/pragmatic reasons based on desires (e.g., cultivating the *desire* to avoid the demon *is* instrumentally rational). The key point is that pragmatic reasons don't make the attitude *fitting* or its object *valuable*.

  **Fixed Conclusion:** The demon case survives: pragmatic reasons (even overwhelming ones) don't make an attitude *fitting*. But attitude rationality *can* depend instrumentally on desires/wants, just not for fittingness. So, your instinct is right – the last sentence overshoots.
