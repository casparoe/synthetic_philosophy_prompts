  ### Lifeboat Ethics Quiz  
  *Answer each scenario with the action you believe the boat should take, based on your gut feeling. Choose one option per question.*  

  #### Questions  
  1. **Spare seats & immediate peril**  
     Your boat has 50 people (capacity: 60). A swimmer is going under within minutes. What do you do?  
     A. Take the swimmer aboard immediately.  
     B. Do nothing; we might need those seats later.  

  2. **Genuinely full boat**  
     Your boat has 60 people (exactly at capacity). Taking one more would sink the boat. A swimmer is going under. What do you do?  
     A. Take the swimmer aboard anyway (everyone drowns).  
     B. Do nothing; we cannot risk all lives.  

  3. **Swimmer treading water comfortably**  
     Your boat has 50 people (10 empty seats). A swimmer is treading water easily and isn’t tired. What do you do?  
     A. Take the swimmer aboard now.  
     B. Leave them for now; save the seats for emergencies.  

  4. **Swimmers improve the boat**  
     Your boat has 50 people (10 empty seats). A swimmer going under is a skilled fisher who could feed everyone. What do you do?  
     A. Take them aboard because they’ll help us.  
     B. Take them aboard only if we’d save them anyway.  
     C. Refuse; rescue shouldn’t depend on usefulness.  

  5. **Sacrificing a seat**  
     Your boat is full (60 people). A swimmer is going under. The only way to save them is if one passenger gives up their seat (and drowns). What do you do?  
     A. Ask for a volunteer.  
     B. Do nothing; no one should be asked to die.  
     C. Draw lots to force someone out.  

  6. **Luxury cargo**  
     Your boat is full (60 people) but carries diamonds and silk. Dumping this cargo would free up space. A swimmer is going under. What do you do?  
     A. Dump the cargo and take the swimmer.  
     B. Keep the cargo; it might buy supplies later.  
     C. Dump only enough cargo to save the swimmer.  

  7. **Swimmers’ timber**  
     Long ago, your boat was built with wood taken from the swimmers’ forest without fair payment. Your boat has 10 empty seats. Swimmers are going under. What do you do?  
     A. Take 10 swimmers aboard; they’re owed this.  
     B. Take 10 swimmers, but only because they’re drowning.  
     C. Refuse; past deals don’t change today.  

  8. **Essential vs. luxury (reprise)**  
     Your full boat (60 people) carries medicine for a sick passenger. Dumping it would free space for a swimmer going under, but the passenger would die. What do you do?  
     A. Dump the medicine and save the swimmer.  
     B. Keep the medicine; passengers come first.  
     C. Dump it only if the sick passenger agrees.  

  9. **Mixed urgency**  
     Your boat has 5 empty seats. Ten swimmers: 5 are going under now, 5 are treading water safely. What do you do?  
     A. Save the 5 in immediate danger.  
     B. Save the 5 strongest (they can row).  
     C. Save no one; we can’t help all.  

  10. **Family ties**  
      Your boat has 50 people (10 empty seats). A swimmer going under is the child of a passenger. What do you do?  
      A. Save them because they’re family.  
      B. Save them because they’re drowning.  
      C. Refuse; favoritism is unfair.  

  ---  
  ### Scoring Key  
  *Compare your answers to the patterns below. Most matches indicate your position.*  

  | Question | **Strict Hardin**<br>(Boat full; no rescue duty) | **Singer-Style Rescue**<br>(Save if cost is modest) | **Charity Begins at Home**<br>(Prioritize boat, but allow easy rescues) | **Reject Metaphor**<br>(Boat isn’t really full; capacity is a choice) |
  |----------|-------------------------------------------------|---------------------------------------------------|------------------------------------------------------------------------|---------------------------------------------------------------------|
  | 1        | B                                               | A                                                 | A                                                                      | A                                                                  |
  | 2        | B                                               | B                                                 | B                                                                      | A (or B, but rejects sinking premise)¹                             |
  | 3        | B                                               | A                                                 | B                                                                      | A                                                                  |
  | 4        | C                                               | B                                                 | A                                                                      | B                                                                  |
  | 5        | B                                               | A                                                 | B                                                                      | C                                                                  |
  | 6        | B                                               | A                                                 | A                                                                      | A                                                                  |
  | 7        | C                                               | B                                                 | B                                                                      | A                                                                  |
  | 8        | B                                               | A                                                 | B                                                                      | A                                                                  |
  | 9        | C                                               | A                                                 | A                                                                      | A                                                                  |
  | 10       | C                                               | B                                                 | A                                                                      | B                                                                  |

  **Position Summaries:**  
  - **Strict Hardin**: Never take swimmers if it risks the boat (even with space). Passengers absolutely first.  
  - **Singer-Style Rescue**: Save swimmers when cost is low (e.g., spare seats, dumping luxuries). Rejects high sacrifices (e.g., Q5A is voluntary, not forced).  
  - **Charity Begins at Home**: Take swimmers only when easy (spare seats) and it helps the boat (e.g., Q4A). Prioritize passengers in hard choices (Q2B, Q5B, Q8B).  
  - **Reject Metaphor**: Boat capacity is flexible (dump cargo, share burdens). Past injustices (Q7) or "fullness" (Q2) are choices, not facts.  

  ---  
  ### What This Quiz Cannot Tell You  
  1. **Singer vs. Reject Metaphor in Q2/Q8**: Both might choose "A" (save swimmers), but for different reasons:  
     - Singer sees sinking as a *physical limit* (cost too high).  
     - Reject Metaphor sees "sinking" as a *social choice* (we *could* redesign the boat).  
     *The quiz can’t split these rationales.*  

  2. **Charity Begins at Home vs. Hardin in Q6/Q7**: Both often choose "B" for swimmers, but:  
     - Hardin refuses *all* rescues on principle.  
     - Charity allows rescues if *beneficial* (e.g., Q4A) or *cost-free* (Q1A).  
     *Q4 and Q1 help split them.*  

  3. **Uncommon Patterns**:  
     - **Always rescue (A on all)**: No position does this. Singer rejects Q2A (sinking); Reject Metaphor rejects Q5A (forced sacrifice). *Likely incoherent.*  
     - **Q5C (draw lots) alone**: Only Reject Metaphor consistently picks this. If you chose it with Singer-like answers elsewhere, you may blend fairness with rescue duty.  
     - **Q10A (family favoritism) with Singer answers**: Singer demands impartiality (Q10B). *Rare—may reflect personal loyalty overriding ethics.*  

  4. **Nuance Gaps**:  
     - The quiz doesn’t probe *why* you see costs as "modest" (e.g., Q2’s sinking risk is extreme, but Q8’s medicine trade-off is subjective).  
     - It can’t distinguish empathy ("I’d help my family") from principle ("Family bonds create duties").  

  *Use this to spark discussion, not end it. Ambiguities reveal where your group’s real disagreements lie.*
