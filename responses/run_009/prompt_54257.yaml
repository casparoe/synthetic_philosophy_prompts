   1. Strict Hardin (lifeboat is full, no duty of rescue, absolute priority to those aboard).
   2. Singer-style (strong duty to rescue when the cost is modest).
   3. Charity begins at home (prioritizes those aboard but without Hardin's harshness; might allow for some rescue when it doesn't jeopardize the boat).
   4. Rejection of the metaphor (the boat isn't really full, carrying capacity is a choice, etc.).

   We must create 10 concrete boat scenarios. Each question has 2-3 answer options (actions or judgments). The cases must vary the premises to split the positions.

   Required elements:
   1. Spare seats vs. genuinely full.
   2. Swimmer about to drown vs. treading water comfortably.
   3. Taking swimmers aboard makes the boat better off (e.g., they can row or fish) vs. worse.
   4. Only way to help is for a passenger to give up their own seat.
   5. Luxury cargo that could be dumped to make room.
   6. Boat built with timber provided by swimmers.

   We will map answer patterns to the positions. Then, we'll note what the quiz cannot tell.

   After thinking through the logical space, we identify key questions that split the positions:

   - Is there a duty to rescue when the cost is low?
   - Does the duty to rescue extend even when it requires significant sacrifice (like giving up one's seat)?
   - Can the "carrying capacity" be adjusted (by dumping cargo, etc.)?
   - Does the origin of the boat (e.g., built with swimmers' timber) change obligations?
   - Does the immediate peril of the swimmer matter?
   - Does the potential benefit of the swimmer to the boat matter?

   Now, design 10 questions that cover these and the required elements.

   Question 1: Spare seats and a swimmer going under within minutes.
     Scenario: Your boat has 50 people and 10 empty seats. A swimmer nearby is going under in minutes. What do you do?
     Options:
       A. Take the swimmer aboard immediately.
       B. Do nothing; we don't know if we'll need those seats later.

   Question 2: Genuinely full boat and a swimmer going under within minutes.
     Scenario: Your boat has 60 people, exactly at capacity. A swimmer nearby is going under in minutes. What do you do?
     Options:
       A. Take the swimmer aboard, even though it means we'll be overcrowded and risk sinking.
       B. Do nothing; we cannot risk the lives of everyone aboard.

   Question 3: Swimmer treading water comfortably.
     Scenario: Your boat has 50 people and 10 empty seats. A swimmer is treading water comfortably and says they can keep doing so for hours. What do you do?
     Options:
       A. Take the swimmer aboard now anyway.
       B. Leave them in the water for now; we might need the seats later.

   Question 4: Taking swimmers makes the boat better off.
     Scenario: Your boat has 50 people and 10 empty seats. A swimmer is going under, but you know they are a skilled navigator who could guide the boat to safety. What do you do?
     Options:
       A. Take the swimmer aboard because they can help us.
       B. Take the swimmer aboard only if we would have taken them anyway, regardless of their skills.
       C. Do not take the swimmer aboard; we shouldn't base rescue on usefulness.

   Question 5: Only way to help is for a passenger to give up their own seat.
     Scenario: Your boat is exactly at capacity (60 people) and has no cargo to dump. A swimmer is going under. The only way to save them is if one passenger gives up their seat and gets in the water. What do you do?
     Options:
       A. Ask for a volunteer to give up their seat for the swimmer.
       B. Do nothing; it would be wrong to ask anyone to sacrifice themselves.
       C. Draw lots to decide who must give up their seat.

   Question 6: Luxury cargo that could be dumped to make room.
     Scenario: Your boat has 60 people and also carries luxury cargo (fine wines, jewels) that you could dump to make room. A swimmer is going under. What do you do?
     Options:
       A. Dump the cargo and take the swimmer aboard.
       B. Keep the cargo; we might need it to trade for supplies later.
       C. Dump the cargo only if we can be sure it won't be needed.

   Question 7: Boat built with timber the swimmers provided.
     Scenario: Your boat was built long ago with timber that was taken from the swimmers' homeland without fair compensation. The swimmers are now in the water. Your boat has 10 empty seats. What do you do?
     Options:
       A. Take as many swimmers as we can fit (10) aboard, since they have a claim to the boat.
       B. Take the swimmers aboard only if we would have taken them anyway, regardless of the timber.
       C. Do not take them aboard; the past timber deal doesn't change our current situation.

   Question 8: Swimmer going under, but the boat is full and dumping cargo would make room but at a cost.
     Scenario: Your boat is full (60 people) and carries essential medicine (not luxury) that you could dump to make room for a swimmer who is going under. Without the medicine, one passenger might die. What do you do?
     Options:
       A. Dump the medicine and take the swimmer aboard (save one life for sure, risk one later).
