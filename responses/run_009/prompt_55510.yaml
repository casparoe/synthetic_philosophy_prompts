  For the memo structure: five points that flow logically - starting with the act's seriousness, then covering mitigating factors, existing consequences, the counterargument about norm preservation, and finally the functional purpose of choosing no sanction. The fourth point should genuinely engage the losing side's best argument about institutional norms.

  The functional theory discussion must show how consequentialism guides the decision by focusing on actual outcomes and deterrence value of self-reporting, while explaining why retribution isn't necessary here. This isn't just theory name-dropping but applying it to resolve the case.

