prompt: |-
  A student in my intro ethics section (engineering major, refreshingly blunt about this stuff) brought an argument to office hours that she says occured to her during a semester abroad, and it's been living rent-free in my head since. The setup: she spent last fall in Lisbon, where nobody queues the way we do -- or rather everybody queues by a different logic, a sort of cloud near the counter in which whoever is most ready to order wins -- and when she got back to the States and dutifully took her place at the back of the line, she started wondering whether she was doing anything morally required or just performing a habit with extra steps. Her argument: (1) a genuine moral obligation binds anyone in the same situation, not merely people who happen to share some local convention; (2) whether you're obligated to tip, queue, wait for the walk signal, and so on depends entirely on which side of a border you're standing on -- same act, opposite valence in Osaka versus New York; (3) so if skipping the tip or cutting the line is genuinely wrong here, there has to be something wrong-making about the act itself, independent of the convention; (4) but there isn't -- strip away the convention and the non-tipper does no describable harm, nobody is worse off than in the nearest convention-free world; (5) so everyday conventions generate no obligations at all; (6) therefore visitors are free to jaywalk in Tokyo and shoulder straight to the front of the Paris bakery line, and locals who never consented to the convention (who does?) are in the same boat.

  Here's what's bugging me. The argument looks valid, and (6) applied to driving on the left in the UK is monstrous -- driving the wrong way through Piccadilly is a bit more than a faux pas, and it stays monstrous even though its wrongness is convention-relative in exactly the way (4) says nothing can be. The thing also seems to generalize: whether you must keep a promise depends on a contingent social practice, and the wrong of breaking one isn't independent of that practice, so by the same reasoning promises don't bind either. My student accepted that consequence with alarming cheerfulness -- promissory obligation, she says, is just coordinated expectation management, and the felt "obligation" is leftover guilt. I don't want to follow her there. But I can't find the flaw on my own: (1) looks like a perfectly decent reading of moral universalism, (2) through (4) look like plain sociology, and rejecting (1) seems to land me in the opposite problem -- if obligations can be geographically indexed, I can't figure out whether that means no convention is beyond criticism or none can be criticized, and I keep going back and forth.

  So: which step do I give up, why did it look fine, and what am I paying for it? I'd like to keep the intuition that the queue binds you, the left-hand rule binds you, and the promise binds you, while still being able to say the unjust local convention (pick your favorite) doesn't. Is there a principled place to stand where that's possible, or does fixing the argument for the queue by brute force just hand the relativist everything else? And if the trick is hiding in (1)'s phrase about being "in the same situation," I'd want to know exactly which situations count as the same.
reasoning: |-
  Okay, let me tackle this fascinating ethics problem from the professor. The student's argument challenges the moral basis of social conventions like queuing, tipping, or driving on a particular side. The core issue is whether these conventions create genuine moral obligations or are merely habits. The professor wants to preserve the intuition that some conventions are morally binding without falling into relativism or undermining universal obligations like promise-keeping.

  First, I need to parse the student's argument step by step. Her six points seem logically tight. Premise (1) states moral obligations must bind universally in similar situations. Premise (2) observes that conventions like queuing or tipping vary by location, making the same act permissible in one place and wrong in another. Premise (3) argues that if such acts are wrong, the wrongness must be inherent, not dependent on convention. Premise (4) claims that without the convention, no harm occurs. Therefore, (5) concludes conventions create no real obligations, and (6) says we can ignore them anywhere.

  The professor's discomfort arises because applying this to traffic rules leads to absurdity—driving on the wrong side in the UK isn't just rude but dangerous. Also, the argument threatens promise-keeping, which the student happily dismisses as mere "expectation management."

  The key flaw must be in premise (4), which claims that "nobody is worse off" without the convention. But in reality, conventions often exist to solve coordination problems. Without traffic rules, chaos ensues, causing accidents. Similarly, queuing prevents conflict and ensures fairness. The harm in violating conventions isn't direct but systemic—undermining the system that benefits everyone.

  Premise (1)'s idea of "same situation" needs scrutiny. Situations include social contexts. Queuing in Lisbon vs. NYC involves different implicit agreements. Ignoring local conventions disrespects others' expectations and can cause indirect harm by disrupting social order.

  The professor wants to distinguish binding conventions (like traffic rules) from optional ones (like tipping norms). The difference lies in whether the convention serves a vital interest (safety, fairness) versus preference. Also, conventions can be critiqued if they're unjust, unlike basic coordination rules.

  So rejecting (4) by showing conventions prevent harm allows keeping universalism. The "same situation" in (1) must account for social context. This preserves promise-keeping too, as promises create expectations and reliance, which cause harm when broken.

  The cost is accepting that some obligations are context-dependent but not arbitrary. The principle is that conventions generating cooperative benefits create duties to comply, provided they're reasonably fair. This avoids relativism by grounding obligations in universal values like welfare and respect.
answer: |-
  The flaw lies in **premise (4)**, specifically its claim that violating conventions like queueing "does no describable harm" and leaves "nobody worse off." This misunderstands the nature of social conventions and the harm caused by their violation. Let's break this down step by step:

  ### 1. **Why (4) Fails: The Harm in Convention-Breaking**
     - **Conventions solve coordination problems**: Queues, traffic rules, and tipping norms exist to resolve conflicts over scarce resources (counter service, road space, service labor). Without them, we get inefficient or dangerous outcomes:
       - *No queue?* People waste time jostling, conflicts escalate, service slows down (e.g., Lisbon's "cloud" system still relies on implicit norms to function).
       - *No traffic rules?* Collisions increase dramatically.
       - *No tipping in a tipping culture?* Service workers earn sub-minimum wages and face financial harm.
     - **Violating conventions creates tangible harm**: Cutting in line *does* harm others by:
       - Increasing their wait time (a measurable cost).
       - Causing frustration, anxiety, or conflict (psychological harm).
       - Undermining trust in cooperative systems (eroding social capital).
     - **The "convention-free world" is a myth**: The student imagines a neutral baseline, but in reality, *any* human interaction requires coordination. If one convention disappears, another emerges (e.g., Lisbon's "cloud" isn't chaos—it's a different norm). Violating an *established* convention forces others into a less efficient system.

  ### 2. **Why (4) *Looked* Persuasive (and What It Costs to Reject It)**
     - **Surface plausibility**: Some conventions *feel* arbitrary (e.g., driving left vs. right). Isolating the act ("steering left in London") seems harmless without context. This ignores the systemic consequences.
     - **Cost of rejection**: You must accept that **moral obligations can emerge from social facts** (e.g., "This group agreed to solve problem X with rule Y"). This doesn't require relativism—it just means morality interacts with context. Universal principles (e.g., "prevent harm," "treat fairly") apply *through* local practices.

  ### 3. **Fixing the Argument While Keeping Universalism**
     You can preserve moral universalism by refining **premise (1)**. The key is defining "same situation" properly:  
     - **"Same situation" must include social context**: Morality isn't geography-dependent—it's *situation*-dependent. Someone in a queue-governed society faces different moral choices than someone in a "cloud"-governed society. Universal principle: *"In contexts where a convention efficiently resolves coordination problems fairly, violating it harms others."*  
     - **Test cases**:  
       - *Queuing in NYC*: Violating harms others → morally wrong.  
       - *Queuing in Lisbon*: Violating their "cloud" norms harms others → morally wrong.  
       - *Driving in the UK*: Driving on the right causes crashes → morally monstrous.  
       - *Promises*: Breaking a promise harms by undermining reliance and trust → morally wrong (not "just guilt").  

  ### 4. **Distinguishing Binding Conventions from Unjust Ones**
     Not all conventions create obligations. Your objection to "unjust local conventions" is preserved:  
     - **Binding conventions**:  
       - Solve coordination problems (queues, traffic).  
       - Are reasonably fair (no group exploited).  
       - Have no superior alternative.  
     - **Non-binding/unjust conventions**:  
       - *Fail to solve coordination problems* (e.g., a queue that actively wastes time).  
       - *Are exploitative* (e.g., tipping if wages are sub-poverty *and* employers avoid fair pay).  
       - *Have morally better alternatives* (e.g., apartheid laws).  
     - **Principle**: We obey conventions *because they prevent harm and promote fairness*, not because they exist. When they fail this, protest/change is justified.

  ### 5. **Why the Student's Relativism Fails**
     Her view collapses when conventions prevent catastrophe. If "no obligations exist," then:  
     - Driving on the left in the UK isn't wrong—but it clearly is.  
     - Surgeons needn't scrub in (just a "convention")—but this risks lives.  
     - Promises needn't be kept—but this destroys relational trust.  
     Conventions *create* moral facts when they instantiate universal goods (order, fairness, efficiency).

  ### The Takeaway
  - **Give up**: Premise (4). Convention-breaking *does* cause harm by sabotaging systems that prevent greater harms.  
  - **Cost**: Accept that morality isn't context-*blind*—but it remains universal via principles applied to facts (e.g., "harm avoidance + fairness + social context = obligation").  
  - **Win**: Keep queueing, traffic rules, and promises binding; reject exploitative conventions; avoid relativism.  
  - **Core insight**: **Conventions transform abstract morality into concrete duties.** The wrong isn't in "steering left"—it's in disregarding a lifesaving system. That’s universally condemnable.  

  This grounds obligations in human welfare and social reality—without making morality a hostage to geography. Your student’s "cloud" of skepticism dissolves when we see the structure holding it up.
