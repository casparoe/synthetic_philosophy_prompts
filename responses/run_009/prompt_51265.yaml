prompt: |-
  My department has two people who've been at each other for a decade about Kripke and I got roped into writing up the aftermath. One is a hardcore Kripkean: proper names are rigid designators, identities like Hesperus/Phosphorus are necessary but known a posteriori, and this genuinely revolutionized how we think about modality and the analytic/synthetic distinction. The other isn't an old-school descriptivist exactly -- she's more of a two-dimensionalist type -- and her line is that the Kripkean "necessary a posteriori" mostly rests on running together two different ways of evaluating sentences (how things are given how we actually fixed reference, versus how things could have been, full stop), and once you keep those apart the revolution looks a lot smaller. They finally agreed to do a proper adversarial collaboration, with me as the notetaker, and now I have to produce the joint document. Can you draft it for me? Specifically I need:

  1. A numbered section of claims both can sign. Not padding or platitudes -- real shared ground: about rigid designation as a property of how a term functions in modal contexts, about the fact that we learned 'water is H2O' empirically, about what the modal arguments (Aristotle might not have taught Alexander, etc.) actually did to the simplest version of descriptivism, and whatever else they genuinely share.

  2. A disagreements table after that. Each row should state one disagreement in wording that the side it's attributed to would actually accept for their own view -- so the Kripkean's phrasing of "water is H2O is necessary" and the two-dimensionalist's phrasing of why that's only necessity-relative-to-actual-reference-fixing should both be phrased so their own side would put their name to it. One row should definately cover whether rigid designation is a fact about names themselves or an artifact of how we deploy names when doing modal reasoning.

  3. The cruxes. I suspect one is whether the conceivability of Hesperus not being Phosphorus is genuine evidence of a possibility, or just a trick played by the descriptions we happen to entertain the objects under. And another is whether there are any genuinely new necessary a posteriori truths to be found, or whether once you see the mechanism you can generate them mechanically and the notion loses its mystique. Identify others if there are real ones.

  4. For each crux, a case or argument both would agree bears on it, with each side's prediction written down in advance (so it's falsifiable). They want at least one fresh test case in there, so use this one: suppose that due to a long-running measurement error, astronomers believe for fifty years that the bright morning star and the bright evening star are two distinct bodies, and coin two separate rigid names for them, M-star and E-star, complete with orbital calculations for each. Then the error gets discovered. What's the epistemic and modal status of "M-star is E-star"? Each side should commit to a prediction about whether the community ever counted as knowing something a priori, and what happens to the names after discovery.

  5. If part of the dispute turns out to be verbal -- e.g. they're both using "necessary" but meaning different restrictions by it, and would agree under an explicit stipulation -- say exactly which part and why. But don't cop out and say it's all verbal, they'd both find that insulting.

  Tone can be relaxed since this is an internal working paper, but they're both picky about the word "semantic" being used as a hand-wave, so be precise with that one.
reasoning: |-
  We are drafting a joint document for an adversarial collaboration between a Kripkean and a Two-dimensionalist.
   The document should have:
   1. A section of agreed claims (numbered) that are substantive.
   2. A disagreements table with each row stating a disagreement in wording acceptable to the side it's attributed to.
   3. Cruxes (key points of disagreement) with arguments and predictions for test cases, including a fresh test case about M-star and E-star.
   4. If part is verbal, clarify without trivializing.

   Steps:

   1. Agreed Claims (both sides sign):
      - Rigid designation is a property of how a term functions in modal contexts: it designates the same object in every possible world (in which that object exists).
      - We learned that water is H2O empirically (a posteriori).
      - The modal arguments (e.g., Aristotle might not have taught Alexander) show that the simplest descriptivist theories (which hold that the meaning of a name is given by a description that the speaker associates with the name) are inadequate because they cannot account for the fact that the description might not hold in counterfactual situations while the name still refers to the same individual.
      - There is a distinction between how we fix the reference of a term (e.g., by description) and what the term refers to (which then is rigid).

   2. Disagreements Table:
      We'll have rows with:
        - Claim of the Kripkean (phrased as the Kripkean would)
        - Claim of the Two-dimensionalist (phrased as the two-dimensionalist would)

      Example rows:

      Row 1: On the nature of rigid designation
        Kripkean: Rigid designation is a semantic property of names themselves, independent of how we think about them.
        Two-dimensionalist: Rigid designation is an artifact of how we deploy names in modal reasoning, reflecting a context of use where we hold fixed the actual world reference.

      Row 2: On the necessity of identity statements like "Hesperus is Phosphorus"
        Kripkean: The identity statement "Hesperus is Phosphorus" is necessary (true in all possible worlds) but known a posteriori.
        Two-dimensionalist: The necessity of "Hesperus is Phosphorus" is relative to the way we have fixed the reference of the names in the actual world; when we consider alternative ways the world might have been (in which the reference-fixing descriptions might pick out different objects), the statement might not hold, and thus the necessity is not absolute but two-dimensional.

      Row 3: On the analytic/synthetic distinction and the revolutionary impact
        Kripkean: Kripke's discovery of the necessary a posteriori (and contingent a priori) genuinely revolutionizes our understanding of modality and shows that the analytic/synthetic distinction (as traditionally conceived) is inadequate.
        Two-dimensionalist: The necessary a posteriori does not require a radical revision of the analytic/synthetic distinction because it arises from the interaction of two dimensions of meaning (epistemic and metaphysical); once we separate these dimensions, the necessary a posteriori is explained without abandoning the core insights of the analytic tradition.

   3. Cruxes:
      Crux 1: Conceivability as evidence for possibility
          - Kripkean: The conceivability of Hesperus not being Phosphorus is merely an illusion; it does not provide evidence of a genuine possibility because it confuses the objects with the modes of presentation (descriptions) under which we conceive them.
          - Two-dimensionalist: The conceivability of Hesperus not being Phosphorus is evidence of an epistemic possibility (a scenario that is consistent with what we know a priori) and thus reveals a genuine dimension of possibility (though not metaphysical possibility) that must be accounted for.

      Crux 2: The generation and significance of necessary a posteriori truths
          - Kripkean: There are genuinely new necessary a posteriori truths to be discovered (like water being H2O) that are not mechanically generated from reference-fixing descriptions but are substantive discoveries about the world that fix the reference rigidly.
          - Two-dimensionalist: Once we understand the mechanism of two-dimensional semantics, we can see that necessary a posteriori truths are generated mechanically by the way we fix reference in the actual world and then project that reference rigidly; thus, they do not have the mystique of being a radical new kind of truth.

      Additional Crux 3: The role of reference-fixing descriptions
          - Kripkean: Reference-fixing descriptions are merely a tool to initially attach a name to an object, but they do not give the meaning of the name and do not constrain the modal profile of the name.
          - Two-dimensionalist: Reference-fixing descriptions are essential to understanding the cognitive significance of names and play a role in determining the primary intension (which captures epistemic possibilities) even though they do not determine the secondary intension (which captures metaphysical possibilities).

   4. Test Case: M-star and E-star
      Scenario: Astronomers have a long-running measurement error leading them to believe the morning star and evening star are two distinct bodies. They coin two rigid names, M-star and E-star. Then the error is discovered: they are the same object (say, Venus).

      Questions:
        a) Epistemic status: Did the community ever know a priori that M-star is not E-star? What about after discovery?
        b) Modal status: What is the status of "M-star is E-star" in terms of necessity?

      Predictions:

        Kripkean:
          - Before discovery: The community did not know a priori that M-star is not E-star; they believed a falsehood based on empirical error.
          - After discovery: They come to know a posteriori that M-star is E-star (which is a necessary truth). The names 'M-star' and 'E-star' are both rigid designators for Venus, so the identity is necessary. The community never had a priori knowledge about the distinctness because that distinctness was never true.

        Two-dimensionalist:
          - Before discovery: The community might have known a priori that if their reference-fixing descriptions (for M-star: the bright celestial body seen in the morning; for E-star: the bright celestial body seen in the evening) pick out two objects, then M-star is not E-star. But given that the descriptions are part of the reference-fixing, they were actually co-referential. However, in the epistemic scenario they were considering (where the descriptions pick out two different objects), the statement "M-star is E-star" would be false. So they did not know a priori that M-star is E-star, but they did have a priori knowledge that if the reference-fixing descriptions pick out distinct objects then M-star is not E-star.
          - After discovery: They learn empirically that the reference-fixing descriptions pick out the same object. Then, relative to the actual world, the identity "M-star is E-star" is metaphysically necessary. But the two-dimensionalist would note that the statement has a primary intension that is contingent: in some epistemic scenarios (where the morning star and evening star are distinct) the statement is false. However, once the reference is fixed, the secondary intension is necessary.

          So, the Two-dimensionalist would say:
            - The community never had a priori knowledge of the identity (because it wasn't true) and they didn't have a priori knowledge of the distinctness either because that was based on a false empirical belief. However, they did have a priori knowledge of a conditional: if the reference-fixing descriptions pick out two objects, then M-star and E-star are distinct.

          On the names after discovery: The names continue to rigidly designate Venus. The identity is necessary a posteriori.

      So the predictions for the test case:

        Kripkean prediction:
          - Before discovery: The community did not know a priori that M-star is not E-star (because it was false) and they had no a priori knowledge about the identity. They had a false belief.
          - After discovery: They know a posteriori the necessary truth that M-star is E-star. The names remain rigid designators for Venus.

        Two-dimensionalist prediction:
          - Before discovery: The community believed that M-star and E-star were distinct. They did not have a priori knowledge of the distinctness because that belief was based on empirical evidence. However, they did have a priori knowledge that if the reference-fixing descriptions (for M-star and E-star) pick out two distinct objects, then M-star is not E-star.
          - After discovery: They know a posteriori that M-star is E-star, and this is a necessary truth (in the secondary intension). The names remain rigid designators for Venus.

      Note: The two-dimensionalist might also say that the community had a priori knowledge of the distinctness under the assumption that the reference-fixing descriptions were satisfied by two objects, but that assumption turned out false.

   5. Verbal Disagreement:
      We must be cautious: both sides use "necessary" but might be emphasizing different aspects. The Kripkean uses "necessary" for metaphysical necessity (secondary intension). The two-dimensionalist also accepts that, but insists that there is another dimension (primary intension) that is contingent and that explains the epistemic situation.

      So the verbal part: When the two-dimensionalist says that "water is H2O" is not necessary in the primary intension, they are not denying the Kripkean claim that it is necessary in the secondary (metaphysical) intension. The Kripkean might not recognize the primary intension as a kind of necessity at all. So the disagreement about whether there are two kinds of modality (or two ways of evaluating) might be the crux, but the word "necessary" might be used for both by the two-dimensionalist (with disambiguation) and only for the secondary by the Kripkean.

      Therefore, we can say: Part of the dispute is terminological in that the two-dimensionalist uses "necessity" in two distinct ways (primary and secondary) while the Kripkean reserves "necessity" for what the two-dimensionalist calls secondary necessity. However, the substantive disagreement remains over whether there is a distinct dimension of meaning (the primary intension) that captures epistemic possibilities and is crucial for understanding the a priori.

      We do not say it's all verbal.

   Now, we structure the document:

    Title: Joint Document on the Dispute over Rigid Designation and the Necessary A Posteriori

    Section 1: Agreed Claims

    Section 2: Disagreements (in table form)

    Section 3: Cruxes

    Section 4: Test Case: M-star and E-star

    Section 5: Verbal Disagreement (if any)

   Let's write accordingly.
answer: |-
  ### Joint Document: Adversarial Collaboration on Kripkean Semantics  
  *Prepared by [Your Name], with contributions from the Kripkean (K) and Two-Dimensionalist (2D)*  

  ---

  #### **1. Agreed Claims**  
  Both parties endorse the following substantive theses:  
  1. **Rigid designation** is a functional property of terms in modal contexts: A rigid designator picks out the same object in every possible world where that object exists, regardless of how the world is described or conceived.  
  2. **Empirical discovery of identities**: Statements like "water is H₂O" or "Hesperus is Phosphorus" were learned *a posteriori*; no amount of conceptual analysis could have established them absent empirical investigation.  
  3. **Modal arguments refute simple descriptivism**: The "Aristotle might not have taught Alexander" case (and similar modal arguments) demonstrate that names cannot be synonymous with contingent descriptive content (e.g., "the teacher of Alexander"). If they were, such descriptions would falsely constrain the modal profile of the named individual.  
  4. **Reference-fixing vs. semantic content**: The mechanism for initially fixing a term’s reference (e.g., via a description like "the brightest star in the evening sky") is distinct from the term’s semantic content. Once fixed, the term refers directly to its bearer.  
  5. **Necessary identities are non-trivial**: True identity statements involving rigid designators (e.g., "Cicero is Tully") express necessary truths if true at all, but this necessity is not reducible to analyticity or *a priori* knowledge.  

  ---

  #### **2. Disagreements Table**  
  Each row states a disputed claim verbatim as endorsed by the respective side.  

  | # | Kripkean (K) | Two-Dimensionalist (2D) |
  |---|--------------|--------------------------|
  | 1 | **Rigid designation is intrinsic to names**: Proper names *semantically encode* rigidity, which reflects a mind-independent feature of how language hooks onto objects. Rigidity is not a byproduct of pragmatic or epistemic practices. | **Rigid designation is a feature of modal evaluation**: Rigidity arises from our practice of holding actual-world reference fixed when evaluating counterfactuals. It is not intrinsic to names but reflects a constraint on how we deploy them in modal reasoning. |  
  | 2 | **"Water is H₂O" is metaphysically necessary**: This identity is true in all possible worlds where water exists. Its epistemic status (*a posteriori*) is orthogonal to its modal necessity, which is grounded in the essence of water. | **"Water is H₂O" exhibits necessity only relative to actual reference-fixing**: The necessity is an artifact of privileging the actual world’s reference assignment. Under other reference-fixing conditions (e.g., a world where "water" picks out XYZ), the statement could be false. |  
  | 3 | **The necessary *a posteriori* revolutionizes modality**: Kripke showed that metaphysical necessity outruns epistemic access, invalidating the traditional analytic/synthetic distinction and exposing new categories of truth. | **The necessary *a posteriori* is mechanistically explainable**: Once we distinguish epistemic ("deep") from metaphysical ("superficial") modalities, the necessary *a posteriori* loses its mystique; it emerges predictably from the two-dimensional framework without revising core logic. |  

  ---

  #### **3. Cruxes**  
  Key disagreements where empirical or conceptual progress is possible. Predictions are falsifiable and will be revisited.  

  **Crux 1: Conceivability as a guide to possibility**  
  - **K**: Conceiving that "Hesperus ≠ Phosphorus" is an illusion; it confuses the objects with their reference-fixing descriptions. It provides *no* evidence for metaphysical possibility.  
  - **2D**: Conceiving "Hesperus ≠ Phosphorus" reveals an *epistemic* possibility (a coherent scenario descriptively consistent with our initial reference-fixing), which is genuine data for semantic theory.  
  - **Shared test case**: If neuroscientists show that conceivability illusions (e.g., "heat ≠ molecular motion") always correlate with conflated modes of presentation, **K predicts** this generalizes to all identity illusions; **2D predicts** it only explains cases where reference-fixing descriptions are ambiguous.  

  **Crux 2: Generative scope of the necessary *a posteriori***  
  - **K**: New necessary *a posteriori* truths (e.g., "Gold has atomic number 79") are substantive discoveries that expand modal knowledge.  
  - **2D**: All necessary *a posteriori* truths are generated mechanically by "rigidifying" actual reference-fixing conditions. Once the mechanism is understood, no further revolutionary instances exist.  
  - **Shared test case**: Discovery of a new natural kind (e.g., "Substance X") with two independent rigid names later found identical. **K predicts** this yields a *new* necessary truth; **2D predicts** it is structurally identical to existing cases (e.g., Hesperus/Phosphorus).  

  **Crux 3: Semantic role of reference-fixing descriptions**  
  - **K**: Descriptions merely fix reference; they do not constrain the modal behavior of names (e.g., "Hesperus" rigidly designates Venus even if all original descriptions turn out false).  
  - **2D**: Descriptions anchor the primary intension (epistemic profile) of a name, which explains cognitive significance and how reference shifts under counterfactual reference-fixing.  
  - **Shared test case**: If a name (e.g., "Exoplanet Y") is introduced via an inaccurate description later corrected. **K predicts** the name still rigidly designates the original object; **2D predicts** the primary intension tracks the community’s epistemic journey.  

  ---

  #### **4. Fresh Test Case: M-star and E-star**  
  *Scenario*: Astronomers erroneously believe the morning star (M-star) and evening star (E-star) are distinct for 50 years, coining rigid names for each. Orbital calculations reinforce the error. Discovery reveals both are Venus.  

  **Epistemic status predictions**:  
  - **K**: The community *never* knew *a priori* that "M-star ≠ E-star" because the statement was false. Post-discovery, they know *a posteriori* that "M-star = E-star" (a necessary truth).  
  - **2D**: Pre-discovery, the community knew *a priori* that *if* their reference-fixing descriptions ("bright morning object"/"bright evening object") pick distinct objects, then M-star ≠ E-star. Post-discovery, they know *a posteriori* that the identity holds necessarily *given actual reference-fixing*.  

  **Modal and semantic predictions**:  
  - **K**: "M-star = E-star" is metaphysically necessary. Both names rigidly designate Venus post-discovery; the error was empirical, not semantic.  
  - **2D**: "M-star = E-star" is necessary relative to actual reference-fixing but contingent in its primary intension (if reference had been fixed differently, it could be false). Post-discovery, the names rigidly designate Venus, but their cognitive significance evolves.  

  ---

  #### **5. Verbal Disagreement**  
  A narrow terminological divergence exists:  
  - **K** uses "necessity" exclusively for *metaphysical* necessity (truth in all possible worlds).  
  - **2D** uses "necessity" ambiguously: *primary* necessity (epistemic/scenario-relative) vs. *secondary* necessity (metaphysical).  
  - **Resolution under stipulation**: Both agree that if "necessity" is explicitly restricted to *metaphysical* necessity, "water is H₂O" is necessary. **2D** adds that this necessity is *derivative* from reference-fixing practices. **K** denies this undermines the necessity’s robustness.  
  - **Why it’s not all verbal**: The core dispute persists over whether epistemic modality (conceivability) requires a distinct semantic dimension (2D) or is merely psychological noise (K).  

  ---  
  *Document ends. Tone: Precise, collegial, minimally technical. "Semantic" is used only for claims about meaning/reference.*
