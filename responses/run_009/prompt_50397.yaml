prompt: |-
  I've been reading rationalist blogs since the Sequences, so a book confirming that perception is thoroughly contaminated starts out with my priors on its side. A popular cognitive science book I just finished summarizes the doctrine of cognitive penetration like this: 'Perception is not a passive camera but an active inference engine: everything you know, want, and believe reaches all the way down into early vision. That is why hungry people literally see food as brighter, why tired hikers wearing heavy backpacks literally see hills as steeper, and why the New Look psychologists of the 1940s found that poor children literally saw coins as larger than rich children did. It is also why confirmation bias cannot be beaten by sheer effort: the evidence is corrupted before reasoning even begins, so the rational policy is to discount any perception that flatters your beliefs.'

  I'd like an accuracy audit. Go claim by claim: what would a vision scientist who studies top-down effects accept, what would they wince at, and what is just wrong — paying particular attention to whether the "literally see" claims are established perceptual effects or contested ones that might really be effects on judgment and report, and to whether early vision being penetrable by everything all the way down is the actual live thesis or an overstatement of it. Then tell me whether the book's practical conclusion follows from whatever part of the summary survives. Keep it under 450 words.
reasoning: |-
  Okay, let me approach this user's query methodically. The user presents a cognitive science book's summary about cognitive penetration in perception and requests an accuracy audit. They come from a rationalist background familiar with concepts like priors and confirmation bias, so I need to address both the scientific validity and practical implications.

  First, I'll analyze the key claims in the book's summary: the "literally see" examples (hungry people seeing food brighter, tired hikers seeing steeper hills, poor children seeing larger coins) and the strong claim about "everything" penetrating "early vision." My knowledge of vision science suggests these examples have varying levels of empirical support.

  For the hunger and hill examples, studies show measurable perceptual effects, though there's ongoing debate about whether these occur at early visual processing stages. The coin size study by Bruner and Goodman is more problematic - it's classic but has replication issues and likely reflects judgment biases rather than true visual changes. 

  The claim that "everything" penetrates "all the way down" into early vision seems overstated. Current consensus recognizes top-down influences but maintains early visual areas have limited penetrability. The user specifically asked about this distinction between perception versus judgment, so I should clarify where boundaries lie.

  Regarding the practical conclusion about confirmation bias, I should note that while perception is influenced, it's not wholly corrupted. Evidence contamination isn't absolute, so discounting all self-flattering perceptions seems too extreme. The rational approach involves metacognitive awareness rather than wholesale distrust.

  I'll structure the response to:
  - Validate the core idea of top-down influences
  - Critique specific examples with scientific nuance
  - Challenge the "everything penetrates early vision" claim
  - Offer a balanced view on practical implications
  - Keep it under 450 words as requested

  The user's rationalist background means they'll appreciate precise distinctions between established findings and contested claims. I should emphasize where the science stands while acknowledging ongoing debates in the field.
answer: |-
  Here's an accuracy audit of the claims, drawing on current vision science consensus:

  1.  **Core Doctrine (Mostly Accepted):** "Perception is not a passive camera but an active inference engine" and involves top-down influences is well-established and non-controversial among cognitive scientists.

  2.  **"Everything you know, want, and believe reaches all the way down into early vision" (Overstated/Wince):**
      *   **Winced at:** "Everything" and "all the way down into early vision" are strong overstatements. While top-down effects are pervasive, early vision (roughly V1-V3, processing basic features like edges, color, motion) is largely considered *cognitively impenetrable* or *resistant*. Higher cognitive states (beliefs, desires) primarily influence *later* stages (interpretation, attention, object recognition) and *modulate* rather than *determine* the earliest signals. "Reaches all the way down" implies direct rewriting of early signals, which is not the consensus.

  3.  **"Literally See" Claims (Mixed):**
      *   **Hungry people see food as brighter (Contested/Problematic):** Some studies report this effect (e.g., fMRI activity in visual areas), suggesting a genuine perceptual component. However, robust replication is challenging, and effects are often subtle. Critics argue effects might primarily involve attention, memory biases, or response bias, not altering low-level brightness perception. **Status:** Plausible but not definitively proven; likely involves modulation rather than fundamental early vision change.
      *   **Tired hikers with backpacks see hills as steeper (Stronger Support):** Multiple studies show effects on explicit slant estimation tasks consistent with a perceptual component (e.g., Proffitt et al.). Debates persist about whether this is truly *visual* or a proprioceptive/action-specific *judgment* bias. **Status:** Widely accepted as a robust effect with a significant perceptual component, though the exact locus (pure vision vs. embodied judgment) is debated.
      *   **Poor children saw coins as larger (Largely Discredited):** This classic study (Bruner & Goodman, 1947) is heavily criticized. Replication failures are common. Effects are small, inconsistent, and likely artifacts of response bias, demand characteristics, or memory/estimation errors rather than genuine visual size distortion. **Status:** Not considered reliable evidence for cognitive penetration of visual size perception.

  4.  **Confirmation Bias & Reasoning (Partially Correct/Practical Conclusion Flawed):**
      *   **"Evidence is corrupted before reasoning begins" (Partially True):** Top-down influences *do* shape what we attend to, interpret, and remember *as evidence*, acting before deliberate reasoning. This is a key mechanism of confirmation bias.
      *   **"Rational policy is to discount any perception that flatters your beliefs" (Overly Broad/Potentially Harmful):** While healthy skepticism towards self-flattering interpretations is wise, *discounting perceptions outright* is impractical and counterproductive. Perception, while influenced, provides essential data. The rational approach is **calibration and seeking diverse evidence**: actively seek disconfirming evidence, consider alternative interpretations, use objective measurement when possible, and understand how motivations/biases *might* shape your experience. Discounting *all* flattering perceptions risks nihilism or ignoring valid evidence.

  **Conclusion:** The book captures the core idea of top-down influences but oversimplifies and overstates the case for "everything" penetrating "early vision." The "literally see" claims vary significantly in support (Hills: Strong; Hunger: Contested; Coins: Weak/Discredited). While top-down effects *enable* confirmation bias by shaping the input to reasoning, the practical advice to "discount" flattering perceptions is an overcorrection. The rational policy is **vigilant metacognition and evidence diversification**, not perceptual nihilism.
