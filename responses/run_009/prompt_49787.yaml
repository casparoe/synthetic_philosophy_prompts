prompt: |-
  btw i'm taking philosophy of mind this semester and we just got to the Churchlands, and over the weekend a guy from my dorm who's really into neuroscience youtube gave me his summary of eliminativism, roughly: 'the idea is that beliefs and desires are posits of folk psychology — our everyday theory about why people do things. it was a decent theory for our ancestors but it's gone thousands of years without improving, and it can't explain stuff like sleep, memory, or mental illness. so it'll go the way of phlogiston: future neuroscience will show that beliefs are really just brain states, the way temperature turned out to be molecules moving — 'eliminated' just means reduced like that. and anyway the view defeats itself, because if beliefs don't exist then the claim "beliefs don't exist" can't be a belief either, which is why basically no philosopher takes it seriously anymore.'

  the first half sounded pretty close to lecture (my prof definitely used phlogiston), but a couple things bugged me. like i'm pretty sure the temperature example came up in class too, but as a *different* view — something about how that's the reductionists' story, not the eliminativists'? and my professor seemed to think the self-refutation charge had decent replies, she didn't treat it as a knockdown at all. can you go through his summary piece by piece: which parts would an actual eliminativist sign off on, where does he quietly slide into some other position or overstate things (especially that last sentence about nobody taking it seriously), and does his 'so it's refuted' conclusion actually follow from the parts that are true? just the breakdown please, no reading lists
