prompt: |-
  I am a high school junior, and I have been invited to give the closing presentation at a community event organized around genocide remembrance, hosted at my school. The audience will include other students, a few teachers, and some members of local advocacy organizations. I want the talk to make a point that I have not seen made in the standard presentations: the word "genocide" does two jobs at once — a narrow legal job, fixed by the 1948 Convention with its specific intent requirement and its closed list of protected groups, and a much older moral job, closer to Raphael Lemkin's own broader conception, which took in the destruction of a people's culture, language, and way of life even where mass killing was not the method. My thesis is that a lot of public confusion and political anger comes from these two jobs quietly coming apart, and I want to illustrate exactly where and how.

  To structure the talk, I would like you to rank five factors on a single question: how much each factor actually drives, in the real world, whether an atrocity ends up being named a genocide (by courts, governments, or the press). The five factors are: (1) evidence of the specific intent to destroy a protected group as such, as opposed to evidence of large-scale killing or displacement alone; (2) the sheer number of victims; (3) the geopolitics of the perpetrators — specifically whether powerful states with veto influence have an interest in blocking the label; (4) the persistence and organization of the victim group's own survivors and diaspora in demanding the name; and (5) the fit between the case and Lemkin's original, broader conception of destruction of a group's culture and institutions. For each factor, give it a tier (decisive, major, minor, or marginal) and a one-sentence justification grounded in how naming decisions actually get made — for instance, how a case with fewer deaths but clearer intent gets the label while a politicide with millions dead is legally stranded because political groups were left off the Convention's protected list, a choice the drafters made under Cold War pressure, and how the provisions on cultural destruction that Lemkin wanted were dropped from the final text.

  Then I want a second, separate ranking of the same five factors by how much each should drive the naming decision in an ideal world — what would be the most morally defensible basis for the name. Finally, and this is the heart of my presentation, walk me through the divergences between your two rankings: identify the factors that move the most between the actual-world list and the ideal-world list, explain why they diverge, and tell me which single divergence you think is most instructive for a general audience. As a capstone, give me a number between 0 and 1 representing the fraction of the real-world variance in naming that you would attribute to legal criteria as opposed to political ones, with a brief defense of the split.

  A few notes on scope. Please do not provide citations or reading lists; I already have my sources and will supply them myself. I am also not asking you to adjudicate any particular live dispute about any current conflict — the comparisons I have sketched above (the exclusion of political groups, the dropping of cultural-genocide provisions, the intent-versus-numbers issue) are the historical background I need, used as illustrations rather than as verdicts on specific cases. I want the analysis to be sharp enough that a lawyer or historian in the audience would nod along, but written plainly enough that my classmates will follow it, and I want to come away knowing the strongest objection to my thesis that the two jobs of the word are coming apart, so that I can address it before someone raises it from the floor.
reasoning: |-
  Okay, let me approach this systematically. The user is a high school junior preparing a nuanced presentation on genocide terminology, showing impressive depth for their age. Their core thesis about the tension between legal and moral definitions of genocide is sophisticated and timely.

  First, I need to clarify the ranking criteria. The user wants two distinct evaluations: how factors currently influence genocide labeling in practice versus how they should operate in an ideal moral framework. The five specified factors cover legal standards (Factor 1), quantitative impact (2), geopolitics (3), advocacy (4), and Lemkin's original concept (5). 

  For the real-world ranking:
  - Factor 1 (legal intent) gets "decisive" because courts and UN bodies treat the Convention's criteria as binding. Cases like Rwanda meet this bar while Cambodia's politicide doesn't.
  - Factor 3 (geopolitics) also ranks "decisive" since Security Council vetoes routinely block genocide resolutions (e.g., China/Russia on Syria). 
  - Factor 4 (advocacy) is "major" - the Armenian genocide recognition shows how sustained diaspora campaigns overcome initial resistance.
  - Factor 2 (victim numbers) is only "minor" - Darfur had massive deaths but limited legal recognition, while smaller cases meeting intent criteria get labeled.
  - Factor 5 (cultural destruction) is "marginal" since the Convention explicitly excluded Lemkin's cultural provisions.

  For the ideal-world ranking, the moral priorities shift dramatically:
  - Factor 5 becomes "decisive" by centering Lemkin's core concern about group destruction beyond just killing.
  - Factor 1 remains "major" as intent still matters morally.
  - Factor 2 rises to "major" - scale should carry weight in moral condemnation.
  - Factor 4 drops to "minor" - recognition shouldn't depend on advocacy resources.
  - Factor 3 becomes "marginal" - geopolitics have no moral standing.

  The starkest divergence is Factor 5 (cultural destruction), jumping from marginal to decisive. This perfectly illustrates the user's thesis about the definitional rift. I'd attribute only 30% of real-world labeling variance to legal factors versus 70% to politics/advocacy - evidenced by how identical atrocities get different labels based on perpetrator alliances. 

  The strongest counterargument to the user's thesis would be that the legal definition absorbs moral concerns through evolving interpretations. But this is weak since cultural destruction remains excluded. I'll suggest they preempt this by noting how courts still dismiss cultural eradication claims under the Convention.
answer: |-
  Here's a structured analysis for your presentation, balancing real-world pragmatism with moral clarity:

  **Real-World Ranking (What *Actually* Drives the Label "Genocide"):**
  1.  **Geopolitics of Perpetrators (Decisive):** Veto-wielding powers (P5 at UNSC) routinely block or dilute genocide determinations against allies, regardless of evidence, as seen in consistent failures to label atrocities in Xinjiang, Myanmar, or Syria.
  2.  **Evidence of Specific Intent (Major):** Courts (ICTY, ICJ) and credible tribunals demand proof of intent to destroy a protected group *as such*, making this a necessary (but not sufficient) legal hurdle, exemplified by the crucial intent findings in Rwanda vs. the exclusion of political groups in Cambodia.
  3.  **Persistence/Organization of Victim Advocates (Major):** Sustained advocacy by survivors/diaspora (e.g., Armenian, Yazidi) forces media attention, political resolutions, and sometimes legal recognition against geopolitical inertia, demonstrating that labeling often requires relentless pressure.
  4.  **Sheer Number of Victims (Minor):** While massive scale attracts initial attention (e.g., Darfur), it is insufficient without intent + geopolitics aligning; smaller-scale atrocities meeting legal intent (e.g., Srebrenica) are labeled genocide, while larger-scale killings lacking intent or facing vetoes (e.g., Bangladesh 1971 initially) are not.
  5.  **Fit with Lemkin's Broader Conception (Marginal):** The explicit *exclusion* of cultural genocide from the 1948 Convention and its irrelevance in court rulings (e.g., ICJ Bosnia v. Serbia) means cultural destruction alone, no matter how severe (e.g., Indigenous residential schools), is virtually never legally sufficient for the label.

  **Ideal-World Ranking (What *Should* Morally Drive the Label):**
  1.  **Fit with Lemkin's Broader Conception (Decisive):** Morally, the deliberate destruction of a group's identity, culture, language, and institutions—Lemkin's core concern—should be the primary focus, recognizing annihilation extends beyond physical killing.
  2.  **Evidence of Specific Intent (Major):** Intent remains morally crucial to distinguish genocide from other atrocities, signifying the targeted destruction of a group's existence.
  3.  **Sheer Number of Victims (Major):** The scale of suffering and destruction inflicted is inherently morally relevant to the gravity of the crime and the urgency of response.
  4.  **Persistence/Organization of Victim Advocates (Minor):** Moral recognition shouldn't depend on a group's political resources or voice; the crime defines itself.
  5.  **Geopolitics of Perpetrators (Marginal):** Power politics have zero moral standing in defining the truth of an atrocity; might should not make right in naming evil.

  **Divergences & Key Insight:**
  *   **Largest Divergence:** **Fit with Lemkin's Broader Conception** (Marginal → Decisive). This is the starkest gap, highlighting how the legal definition abandoned Lemkin's profound insight that destroying a people's culture *is* destroying the people. The Convention's narrow focus on physical-biological destruction and protected groups leaves vast cultural atrocities unrecognized as genocide.
  *   **Significant Divergence:** **Geopolitics** (Decisive → Marginal). The real world is dominated by cynical power games blocking justice, while morality demands these considerations be irrelevant.
  *   **Notable Shift:** **Sheer Number of Victims** (Minor → Major). Legally, numbers are secondary to intent/group; morally, the scale of suffering demands greater weight.
  *   **Convergence:** **Evidence of Specific Intent** remains high in both (Major → Major), emphasizing intent *is* morally central to distinguishing genocide.

  **Most Instructive Divergence for the Audience:**  
  The **marginalization of Lemkin's broader conception in the real world** is the most instructive divergence. It shows concretely how the legal definition amputated the original moral core of the term. While "cultural genocide" is widely used *morally* today, its *legal* exclusion means Lemkin's deepest warning—that erasing culture erases people—is denied the full force of the "genocide" label in courts and international action. This divergence is the engine of confusion and anger: people intuitively grasp the moral concept (Lemkin's job), but the law performs a narrower job, often blocked by politics.

  **Legal vs. Political Variance Split: 0.3 Legal / 0.7 Political**  
  *Justification:* While legal criteria (intent, protected group) are the *gate* (accounting for ~30% of variance – e.g., why Cambodia isn't legally genocide), whether a case that *could* meet these criteria *actually gets labeled* genocide depends overwhelmingly (~70%) on politics: P5 vetoes, perpetrator alliances, victim advocacy strength, and media focus shaped by geopolitical interests. This is starkly visible in the inconsistent labeling of otherwise comparable atrocities based on the perpetrator's international patrons.

  **Strongest Objection to Your Thesis & Preemptive Response:**  
  *Objection:* "The legal definition *absorbs* evolving moral understanding. Courts interpret 'intent to destroy' and 'group' dynamically, incorporating cultural destruction where it serves the goal of physical destruction. The two jobs aren't coming apart; the law is catching up to the morality."  
  *Your Preemptive Response:* "While progressive interpretation happens (e.g., recognizing protected groups like 'political' in some contexts *by analogy*), the core exclusion remains: the Convention text *explicitly* omitted cultural genocide as a standalone crime. Courts consistently reject cultural destruction *alone* as insufficient for genocide (e.g., ICJ rulings). The legal gate remains narrower than Lemkin's moral vision, and politics often prevents even cases meeting the legal standard from being named. The gap persists structurally."

  This structure provides clear tiers, highlights the core divergence (Lemkin's vision vs. the law), quantifies the political reality, and arms you with a credible counter-argument. It balances legal precision with moral urgency, suitable for both lawyers and classmates. Good luck with your powerful presentation!
