  i'm a software engineer, i write scrapers that pull odds from sportsbooks, and something i noticed: convert the posted odds for every outcome of a match into implied probabilities and they sum to like 104-108% instead of 100%. i looked it up and thats the overround / vig — the bookmaker deliberately prices so it profits no matter the result. recently i started reading about dutch book arguments, and as far as i can tell they say that if your prices violate the probability axioms, a clever bettor can always construct bets that take money from you. so bookmakers are "incoherent" on purpose every single day, that incoherence IS the business model, and the person the books actually guard against is the bettor arbitraging across them. weird!

  act as an expert in formal epistemology and the philosophy of probability, and think carefully — maybe start by brainstorming the moving parts before giving your verdict. my actual question: what view of rationality does the dutch book argument presuppose? does the bookmaker example show the argument is really about exploitability-by-someone-who-knows-your-prices rather than irrationality per se, and is that a distinction the argument itself can respect? also, is the practice even consistent with itself — the book is incoherent across outcomes on purpose, yet it doesn't go broke, so presumably it's coherent in some other sense the standard argument never mentions? tell me what would have to change in the practice or in the argument to make them line up.

  one more thing: please separate what's genuinely settled among people who work on this from what's actively contested (like whether dutch books establish anything normative at all), and don't present some contested reading as the consensus — i can't tell those apart on my own.
