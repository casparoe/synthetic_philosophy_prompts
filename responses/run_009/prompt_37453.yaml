prompt: |-
  I want to adjudicate between the whole-brain, higher-brain, and circulatory definitions of death, but first I need the specification: what must a definition of death, adequate for law and clinical practice, actually deliver? Write the desiderata, each with the case or consideration behind it. A definition will have to locate a moment in what is otherwise a gradual loss of function; it will have to be applicable at the bedside by clinicians without philosophical training; and it will have to handle the cases that pressure every candidate — the brain-dead pregnant woman whose body was sustained for weeks until the fetus was viable, which suggests integrated bodily function survives brain death; the anencephalic newborn and the patient in a permanent vegetative state, who force a choice between a consciousness-based criterion and the conviction that such patients are still alive; and donation after circulatory death, where a waiting period of a few minutes is accepted on the ground that function will not in fact return, not that it could not, resting on the distinction between permanent and irreversible loss. For each requirement, say whether it is non-negotiable or a preference of one camp masquerading as a demand — I suspect the insistence that a definition not be disjunctive, and that it leave current transplant practice undisturbed, are of the second kind. Finally, flag which pairs of desiderata cannot be jointly satisfied; that result matters more to me than a verdict, so a single sentence on how the three definitions fare is enough.
reasoning: |-
  Okay, the user is asking about adjudicating between different definitions of death—whole-brain, higher-brain, and circulatory—and they want to know the requirements for an adequate legal and clinical definition. They mentioned specific cases like the brain-dead pregnant woman, anencephalic newborns, PVS patients, and DCD protocols. I need to outline the desiderata for such a definition, explaining each with the case behind it, and then evaluate which are non-negotiable versus preferences. Also, they want to identify conflicting desiderata and a brief comparison of the three definitions.

  First, I should recall the key definitions. Whole-brain death means irreversible cessation of all brain functions, including the brainstem. Higher-brain death focuses on irreversible loss of consciousness and cognition. Circulatory death is the irreversible cessation of circulatory and respiratory functions. Each has its proponents and critics.

  The user provided specific cases that challenge these definitions. For example, the brain-dead pregnant woman whose body was sustained shows integrated bodily functions can continue without brain function, questioning whole-brain death. Anencephalic infants and PVS patients force a choice between consciousness-based criteria and the belief they're alive. DCD involves waiting minutes after circulatory stoppage, accepting permanent rather than irreversible loss, which complicates the circulatory definition.

  Desiderata must address several aspects. First, pinpointing a moment in a gradual process is crucial legally and practically. Clinicians need clear, bedside criteria without philosophical debates. The definition must handle edge cases without inconsistency. Also, it should be biologically defensible, legally robust, and publicly acceptable.

  I need to categorize each desideratum as non-negotiable or a preference. Non-negotiables include practical applicability and legal clarity because laws and medical staff need straightforward rules. Preferences might include avoiding disjunctive definitions or preserving transplant practices, which align with certain camps' values.

  Conflicts are key. For instance, biological accuracy vs. practical applicability: higher-brain definitions might be biologically sound for some but hard to apply without complex tests. Or, handling edge cases vs. public acceptability: declaring anencephalic infants dead might conflict with societal views. The circulatory definition's reliance on permanence vs. irreversibility in DCD is another conflict.

  The three definitions each have trade-offs. Whole-brain is clinically operational but faces issues with somatic integration. Higher-brain centers consciousness but struggles with diagnosis and PVS cases. Circulatory is straightforward but has permanence vs. irreversibility problems in DCD.

  The user's deeper need is likely understanding why consensus is hard due to inherent conflicts, rather than just a verdict. They might be involved in policy, ethics, or medicine, seeking to grasp the philosophical tensions affecting real-world practice.
answer: |-
  Here are the desiderata for an adequate legal and clinical definition of death, derived from the core requirements and the challenging cases you outlined. Each is presented with its rationale and an assessment of its status (Non-Negotiable or Preference).

  ### Desiderata for a Definition of Death

  1.  **Pinpoint a Specific Moment:** The definition must identify a *precise moment* when death occurs within the biologically gradual process of dying.
      *   **Rationale/Case:** Legal consequences (inheritance, criminal liability, marriage dissolution, organ procurement eligibility) depend on a specific time of death. Medical decisions (stopping treatment, autopsy, burial) require temporal certainty. Gradual loss of function necessitates an arbitrary but defensible line.
      *   **Status:** **Non-Negotiable.** Essential for legal and administrative function.

  2.  **Clinically Applicable:** The criteria must be determinable *at the bedside* by physicians using standard medical tests and observations, without requiring complex philosophical reasoning or unavailable technology.
      *   **Rationale/Case:** Death determination happens in diverse clinical settings (ICUs, ERs, homes) by practitioners focused on patient care, not metaphysics. It must be reliable, reproducible, and timely.
      *   **Status:** **Non-Negotiable.** A practical necessity for universal implementation.

  3.  **Biologically Defensible:** The definition must correspond to a fundamental, observable, and irreversible biological change marking the end of life *as an integrated organism*.
      *   **Rationale/Case:** Grounds the definition in science, not just convention. Addresses the core question: when does the organism cease to function as a whole? Challenges like the brain-dead pregnant woman (sustained somatic integration) and PVS/anencephalic infants (biological life without consciousness) pressure this requirement.
      *   **Status:** **Non-Negotiable (in principle).** However, *what constitutes* this fundamental change is precisely the debate between the definitions.

  4.  **Handle Challenging Cases Consistently:** The definition must provide clear, principled answers for paradigmatically difficult scenarios without logical contradiction or requiring special pleading.
      *   **Rationale/Case:** Brain-dead pregnant woman (somatic integration persists), Anencephalic newborn (never possesses consciousness/cognitive capacity), Permanent Vegetative State (consciousness/cognition lost, basic biological functions persist), Donation after Circulatory Death (DCD) (reliance on permanence, not irreversibility, for declaration).
      *   **Status:** **Non-Negotiable.** A definition failing key test cases loses credibility and utility.

  5.  **Legally Robust & Clear:** The definition must provide a clear standard for legislation, regulation, and legal proceedings, minimizing ambiguity and potential for dispute.
      *   **Rationale/Case:** Needed for consistent application across jurisdictions, resolving disputes over inheritance, liability, and medical decisions like withdrawal of life support or organ donation authorization.
      *   **Status:** **Non-Negotiable.** Law requires clear standards for enforcement and justice.

  6.  **Socially & Ethically Acceptable:** The definition should align, as far as possible, with widely held societal intuitions and values about life, death, and human dignity.
      *   **Rationale/Case:** Public trust in medicine and law depends on this. Declaring a breathing body with a heartbeat dead (brain death) or declaring a spontaneously breathing PVS patient dead (higher-brain) can cause significant distress and resistance if it clashes with deeply held beliefs.
      *   **Status:** **Non-Negotiable (for widespread adoption).** However, *which* intuitions it aligns with varies.

  7.  **Distinguish Permanent from Irreversible Loss:** The definition must acknowledge the conceptual and practical difference between loss of function that *will not* return (permanent) and loss that *cannot* return (irreversible), especially concerning DCD.
      *   **Rationale/Case:** DCD protocols rely on permanence (no auto-resuscitation after circulatory arrest, no intent to resuscitate) for declaration after a waiting period (e.g., 2-5 minutes), knowing irreversibility (impossibility of restoration even with intervention) isn't proven until much later (or potentially ever, if intervention *could* theoretically work).
      *   **Status:** **Non-Negotiable (for practical organ donation).** This is a fundamental challenge for the *biological rationale* of circulatory definitions.

  8.  **Avoid Being Disjunctive:** The definition should be unified and coherent, not simply listing multiple distinct conditions (e.g., "brain dead OR circulatory dead") without a unifying biological principle.
      *   **Rationale/Case:** A disjunctive definition risks being merely descriptive of current practices rather than principled. It might obscure the fundamental biological question: what *is* death? Proponents argue a unified theory is necessary for conceptual clarity and biological accuracy.
      *   **Status:** **Preference (of whole-brain/higher-brain camps).** While desirable for theoretical elegance, a disjunctive definition *can* meet all other core desiderata (1-7) in practice and reflects the reality that death can occur via different pathways. Law and practice often use disjunctive criteria successfully.

  9.  **Leave Current Transplant Practice Undisturbed:** The definition should not fundamentally disrupt established protocols for organ donation, especially brain death and DCD.
      *   **Rationale/Case:** Organ transplantation saves lives and relies heavily on clear, timely death determination aligned with current practices. Significant changes could reduce organ availability or increase logistical/ethical complexity.
      *   **Status:** **Preference (strong institutional/transplant interest).** While pragmatically important, prioritizing this *over* biological defensibility or consistency with challenging cases (e.g., PVS, anencephaly) risks making the definition serve the needs of transplantation rather than defining death itself.

  ### Conflicts Between Desiderata (Impossible Pairs)

  *   **Biologically Defensible (requiring irreversibility) & Distinguish Permanent/Irreversible (for DCD):** DCD practice fundamentally relies on declaring death based on *permanence* (loss that *will not* be reversed due to no intervention) within minutes, while biological defensibility typically demands demonstrable *irreversibility* (loss that *cannot* be reversed). Satisfying both simultaneously is impossible; DCD implicitly prioritizes practical permanence over proven biological irreversibility at the moment of declaration.
  *   **Handle Challenging Cases Consistently (e.g., PVS/Anencephaly as alive) & Socially Acceptable (to those seeing PVS/Anencephaly as 'not a person'):** If the definition declares PVS/anencephalic patients alive based on biological criteria (whole-brain or circulatory), it conflicts with the strong intuition of some that these individuals lack essential human attributes. Conversely, declaring them dead via a higher-brain definition conflicts with the strong intuition of others that a spontaneously breathing body is alive. Full consistency across *all* cases with *all* social intuitions is unattainable.
  *   **Biologically Defensible (as integrated organism) & Handle Brain-Dead Pregnant Woman:** The sustained somatic integration (including gestation) in the brain-dead pregnant woman challenges the claim that whole-brain death represents the irreversible loss of *all* integrated biological function of the organism. Accommodating this case requires either redefining "integrated organism" (e.g., excluding reproduction) or weakening the biological rationale for whole-brain death.
  *   **Clinically Applicable & Biologically Defensible (via Higher-Brain):** Proving the *irreversible* loss of consciousness/cognition (higher-brain criterion) with absolute certainty at the bedside is currently impossible (distinguishing permanent vegetative state from minimally conscious state is difficult even with advanced testing). A pure higher-brain definition struggles with clinical applicability.

  ### How the Three Definitions Fare

  *   **Whole-Brain:** Excels at clinical applicability (standard tests), pinpointing a moment, legal clarity, and aligning with some social intuitions (breathing corpse); struggles biologically with the brain-dead pregnant woman and ethically with PVS/anencephaly, and doesn't directly solve the DCD permanence/irreversibility issue.
  *   **Higher-Brain:** Strongest biological case for proponents focusing on consciousness as the human essence; fails clinical applicability (cannot reliably diagnose irreversible loss at bedside), clashes sharply with intuitions about breathing bodies (PVS), struggles with anencephaly timing, and offers no advantage for DCD.
  *   **Circulatory:** Simplest conceptually and clinically at point of arrest, aligns with traditional views, underpins DCD; struggles biologically to explain why death isn't reversible with intervention *at the moment of declaration* (permanence vs. irreversibility), fails to define death for brain-dead patients on ventilators (breathing/heart beating), and clashes with intuitions that brain death *is* death.

  **In a single sentence:** Each definition (whole-brain, higher-brain, circulatory) satisfies some core desiderata (like pinpointing a moment, clinical applicability for its context) but fails to resolve fundamental conflicts inherent in the others, particularly concerning the brain-dead pregnant woman, PVS/anencephaly, and the permanence/irreversibility distinction in DCD, revealing the deep conceptual and biological tensions within the project of defining death.
