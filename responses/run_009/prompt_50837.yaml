  Hmm the core tension here is between Russell's emphasis on parental constancy once children exist versus his permissive stance on non-monogamy when love remains intact. I recall his view of jealousy as primitive and his endorsement of affairs that don't destroy the "shared life" - but that was in childless marriages. With kids involved, he'd likely worry about destabilization even if the parents claim everything's fine. 

  Wait, let's not overlook his distinction between sexual freedom and family duty. He might argue that while the opening itself isn't morally wrong, it introduces unnecessary risk to the children's stable environment - which takes absolute priority. That "boringly stable" phrasing from the user actually echoes Russell's own language about child-rearing. 

  The user's request for "candidate rules" is sharp - we should formalize the principles implied by Russell's positions. First would be the Constancy Imperative for children, second the Anti-Jealousy Principle, third... ah yes, the Consent-Based Sexual Ethics rule. Each points differently here. 

  For prediction, I'm leaning toward disapproval despite the consent, because Russell consistently subordinates adult desires to children's needs once they exist. His early marriage advocacy wasn't just about sex - it was about creating stable units for child-rearing. 

  The perfect test case? A childless couple where one wants monogamy and the other proposes openness. That pits consent against jealousy directly, without the constancy factor muddying things. Russell's disdain for jealousy would likely override the reluctant partner's veto there. 

  Better mention his psychological pragmatism too - he'd question whether "love each other more" is self-deception, since he thought marriage inevitably cools passion. But the user seems more interested in moral principles than psychoanalysis here.
