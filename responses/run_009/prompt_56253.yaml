prompt: |-
  I'm taking a graduate philosophy of mind course and writing a term paper on eliminative materialism, and I've realized I keep going in circles because I have no fixed standard for what success would even look like. The literature I've read mostly trades in broad gestures — that folk psychology is a stagnant research program, that neuroscience will eventually speak a language too alien for "belief" and "desire" to survive translation — but nobody stops to specify the bar. Before I take a side in my paper, I want the specification first.

  So: writing as a professional philosopher of mind who thinks carefully before answering, please give me the desiderata that any adequate eliminativism about the propositional attitudes must meet — what a genuinely successful elimination would have to deliver. For each requirement, give the motivating case or consideration, mark whether it is non-negotiable or a prejudice of one camp, and flag any subset of the requirements you suspect cannot be jointly satisfied — that tension is the part I most want to see. To push you past the usual talking points, here are some candidate desiderata I've been chewing on that seem under-discussed, which you should evaluate (accept, reject, or refine) rather than merely list: (1) a no-miracles-analogue — folk psychology has predicted everyday behavior reasonably well for millennia, and just as a radically false scientific theory demands an explanation of its predictive success, the eliminativist owes an account of how a theory with no belief-like states in it did so well; (2) a retention condition — phlogiston was eliminated, but oxygen chemistry preserved what the phlogiston theorists were mostly right about; an eliminativist must say what, if anything, belief-talk was tracking, and whether the successor theory preserves it; (3) a kitchen-resolution condition — the successor vocabulary must be usable by ordinary people for real-time social prediction, since a theory that only a scanning lab can apply doesn't eliminate the attitudes so much as abandon everyday practice; (4) an autobiography condition — if beliefs never existed, then I was radically wrong about my own mind for thirty years, including the very years I spent thinking the eliminativist's paper was persuasive, and the theory must say whether my past first-person reports were error, or something else; and (5) a scope condition — whether desires, intentions, and belief must fall together, or whether a mixed verdict (eliminate some, keep others) is coherent. Feel free to add desiderata I've missed, but argue for their inclusion rather than padding the list.

  Then, briefly, since my paper has to engage the contenders: score Paul Churchland's original neurocomputational eliminativism, Stephen Stich's syntactic-revisionary version, Dennett's instrumentalist deflation, and a quietist refusal to play, against your list — and tell me which single requirement does the most to knock out the most candidates. Start with some brainstorming before you commit to the final list, and keep the weight on the criteria and their motivating cases rather than on the scorecard. No citations needed; I have the sources.
reasoning: |-
  Okay, the user is a graduate student writing a term paper on eliminative materialism. They're stuck because they don't have clear criteria for what a successful eliminative theory should achieve. They provided five candidate desiderata and want me to evaluate and expand on them, then apply these criteria to major theorists. 

  Hmm, the user's frustration is palpable - they've noticed that the literature makes grand claims without defining success conditions. That's a sharp observation. Their proposed desiderata show they've dug deep into the conceptual problems: the no-miracles argument about predictive success, the retention question like in phlogiston, practical usability, first-person reports, and scope issues. These are exactly the pressure points.

  Let me unpack each. For the no-miracles analogue: it's non-negotiable because any theory claiming radical falsehood must explain apparent success. But maybe we should refine it - predictive success isn't the same as theoretical accuracy, and folk psychology might succeed for different reasons. 

  The retention condition seems essential but tricky. Complete discontinuity would make elimination seem arbitrary, but total preservation would undermine eliminativism. The real question is what core phenomena belief-talk tracked - intentionality? causation? - and whether a successor captures that essence.

  Kitchen-resolution is fascinating. If eliminativism only works in labs, it hasn't replaced folk psychology but escaped it. But is this fair? Science often makes folk concepts obsolete (e.g., sunrise). Still, for a theory of mind, practical disconnection might be a fatal flaw.

  The autobiography condition feels like a dagger. If I thought "I believe eliminativism is true" but had no beliefs, what was happening? Either the theory must explain away introspection systematically, or admit beliefs exist in first-person cases. This might be the hardest nut to crack.

  Scope is pragmatically important. Eliminating all propositional attitudes together seems cleaner, but cognitively unrealistic - desires and beliefs may not be equally dispensable. This deserves more attention in the literature.

  I'll add one more: the causation desideratum. Folk psychology treats beliefs as causes; a successor must explain behavior causation without them, or explain why causation was illusory. 

  Now for theorists: Churchland's neurocomputational approach nails the no-miracles argument (success comes from vector coding approximating beliefs) and retention (state spaces preserve intentional content), but stumbles on kitchen-resolution - nobody barks neural vectors at spouses. Stich's syntactic theory avoids autobiography by keeping mental states (just not semantic ones), but his narrow causal scope feels ad hoc. Dennett dodges elimination by making beliefs useful fictions, which handles autobiography and kitchen use beautifully but betrays core eliminativism. Quietism avoids all problems by refusing to engage - clever but unhelpful.

  The autobiography condition is the real killer. It forces either an error theory of introspection (which feels self-undermining) or retreats like Dennett's. That tension might be unresolved.
answer: |-
  ## Desiderata for Successful Eliminativism: A Framework for Evaluation

  Your frustration is well-founded. Eliminativism often flounders precisely because its proponents and critics lack a shared, rigorous conception of success. Below is a proposed framework of desiderata, rigorously motivated, incorporating and refining your candidates, highlighting tensions, and then applied briefly to key theorists. The *tensions* are where the real philosophical action lies.

  ### Core Desiderata (Argued & Refined)

  1.  **The Predictive Success Explanation (Refined "No-Miracles-Analogue"):**
      *   **Requirement:** The eliminativist *must* provide a compelling explanation for why folk psychology (FP), if radically false and non-referential, has exhibited significant (though imperfect) predictive and explanatory success in everyday social interaction over millennia.
      *   **Motivation:** FP isn't *randomly* successful. Its efficacy demands explanation just as the success of Ptolemaic astronomy did. A genuinely false theory succeeding *only* by accident is implausible. The explanation must show how the underlying reality FP *mischaracterizes* nevertheless generates patterns exploitable by FP's crude schema.
      *   **Negotiability:** **Non-negotiable.** Failure here makes eliminativism seem implausibly dismissive of a robust phenomenon. *Refinement:* Focus less on "belief-like states" (which might beg the question) and more on the *patterns of behavior and interaction* FP captures. The explanation should show how the successor theory's ontology and dynamics *ground* these patterns without invoking propositional attitudes.
      *   **Tension:** Risk: The better this explanation (e.g., showing FP tracks real neural/cognitive patterns), the harder it becomes to deny *some* form of intentional realism or functional preservation (see Retention).

  2.  **The Retention/Recovery Condition (Refined):**
      *   **Requirement:** The eliminativist must specify *what aspect of the phenomena* FP discourse was attempting (however imperfectly) to track or explain (e.g., systematicity of behavior, information sensitivity, goal-directedness), and demonstrate how the successor theory either (a) *recovers* and explains that aspect more accurately without propositional attitudes, or (b) convincingly argues that aspect is itself illusory or incoherent and explains *why* FP seemed to track it.
      *   **Motivation:** Historical eliminations (caloric, phlogiston) succeeded because the successor theory preserved/recovered the *core phenomena* (heat transfer, combustion/oxidation) while replacing the ontology. Complete discontinuity is suspicious. If FP was tracking *nothing real at all*, its partial success becomes even more mysterious (linking back to Desideratum 1).
      *   **Negotiability:** **Non-negotiable (in some form).** Total discontinuity undermines the claim that FP was *about* the mind/behavior at all. *Refinement:* Avoid requiring preservation of "what they were *mostly* right about" – that's too vague and potentially question-begging. Focus on the *explanandum* FP was grappling with. The eliminativist must show the successor handles that explanandum better.
      *   **Tension:** With Autobiography & Kitchen-Resolution. A theory recovering the phenomena *only* at an inaccessible neurobiological level fails Kitchen-Resolution. Arguing core phenomena (like intentionality) are illusory exacerbates the Autobiography problem.

  3.  **The Practical Efficacy Condition ("Kitchen-Resolution" - Accepted & Sharpened):**
      *   **Requirement:** The successor framework must be capable (in principle, perhaps after simplification/engineering) of supporting the *practical, real-time demands* of social navigation, intention ascription, and explanation/prediction in everyday life at a level comparable to or better than FP. It cannot *only* function in the lab or require impossible cognitive feats for ordinary users.
      *   **Motivation:** FP isn't just a theory; it's a deeply embedded social practice crucial for human interaction. A "successor" that renders this practice impossible or radically impractical hasn't *eliminated and replaced* FP in the relevant domain; it has merely *abandoned* a core function of mental state discourse. Elimination requires offering a functional alternative for the practice.
      *   **Negotiability:** **Highly Contentious, but Crucial.** Critics see this as unfairly privileging folk practice. Eliminativists (like Churchland) often dismiss it, arguing future neuroscience might retrain us. *Argument for Inclusion:* If eliminativism aims to show FP is *fundamentally mistaken* about the mind, but concedes FP remains *practically indispensable*, it risks a problematic instrumentalism (à la Dennett) rather than genuine ontological elimination. True elimination should offer a superior practical alternative.
      *   **Tension:** Extreme with Neurocentric Theories. Directly clashes with views prioritizing pure scientific ontology over practical utility. Creates immense pressure for either deflationism (Dennett) or radical revisionism (Stich's syntactic focus).

  4.  **The First-Person Authority Challenge ("Autobiography Condition" - Accepted & Deepened):**
      *   **Requirement:** The eliminativist must provide a coherent account of the *phenomenology and epistemic status* of first-person reports (e.g., "I believe it's raining"). It must explain why such reports feel authoritative and are often reliable guides to future behavior *without* conceding the existence of the reported propositional attitudes. Crucially, it must address the self-referential paradox: "If eliminativism is true, then my current thought 'eliminativism is true' isn't a belief – what *is* it, and how can it be true?"
      *   **Motivation:** The seeming directness and reliability of introspection is a primary source of FP's intuitive plausibility. Dismissing *all* first-person reports as globally erroneous is deeply counterintuitive and raises the specter of self-refutation: the eliminativist's own assertions seem to require belief states.
      *   **Negotiability:** **Non-negotiable (to address).** Ignoring it is fatal. *Refinement:* Avoid framing solely as "was I wrong?" Focus on the *nature of the reporting state* and the *source of its (apparent) reliability and authority*. The account must explain the *illusion* of belief without succumbing to it in the explanation.
      *   **Tension:** Profound with the core eliminativist claim. This is arguably the *hardest* nut to crack. A strong explanation likely requires a sophisticated error theory about introspection and semantics.

  5.  **Scope & Unity Condition (Refined):**
      *   **Requirement:** The eliminativist must clearly state the scope: whether *all* propositional attitudes (belief, desire, intention, hope, fear, etc.) stand or fall together ontologically, or whether a principled distinction can be made (e.g., eliminating beliefs but preserving desires as motivational states). The justification for the chosen scope must be provided.
      *   **Motivation:** FP attitudes are interdefined and function as a system. Eliminating one (e.g., belief) may destabilize the coherence of others (e.g., desire requires belief about the desired object). Conversely, arguments against belief (e.g., lack of neuroscientific fit, semantic indeterminacy) may not equally apply to, say, conative states. Vagueness here weakens the thesis.
      *   **Negotiability:** **Negotiable in outcome, non-negotiable to address.** A mixed verdict is logically possible, but requires careful argument showing why the arguments against belief don't generalize, or why other attitudes have a different ontological status. *Refinement:* Focus on the *functional or ontological dependencies* between attitudes within FP. Can "desire" coherently exist without "belief" in the successor scheme?
      *   **Tension:** Internal to eliminativist positions. Some arguments (semantic holism) push towards all-or-nothing. Others (differences in functional role or neural correlates) might suggest splitting.

  **Added Desideratum:**

  6.  **The Causal Efficacy Condition:**
      *   **Requirement:** The successor theory must provide a satisfying account of what *causally explains behavior* if not propositional attitudes as traditionally conceived (with their semantic content playing a causal role). It must explain how the new ontology grounds the *apparent* rationality, goal-directedness, and content-sensitivity of action.
      *   **Motivation:** A core function of FP is explaining *why* agents act by citing their beliefs and desires. Eliminativism must show how the successor ontology provides superior causal explanations, resolving problems like the "causal relevance of content" without simply reproducing functional roles under a new name.
      *   **Negotiability:** **Non-negotiable.** Failure to explain behavior causation dooms the theory. *Argument for Inclusion:* This is the core explanatory task FP performs. A successor must do this job better without the old ontology.
      *   **Tension:** With Retention and Predictive Success. A purely syntactic or neural account might struggle to recover the *rationalizing* aspect of FP explanations. Over-emphasis on brute neural causation might fail Kitchen-Resolution.

  ### Tensions: The Heart of the Problem
  The central, likely insuperable tension lies between:
  *   **Autobiography & Practical Efficacy:** Requiring a successor usable in real-time social prediction (Kitchen) and explaining first-person reports without beliefs seems to demand a high-level, intentional-seeming framework. But this directly contradicts the core eliminativist impulse to eliminate precisely those high-level, intentional categories in favor of fundamental neuroscience. Resolving Autobiography often pushes towards instrumentalism (denying ontological import), which undermines elimination.
  *   **Predictive Success/Retention vs. Radical Elimination:** Providing a convincing explanation for FP's success (Predictive) and showing what it was tracking (Retention) typically requires showing how FP approximates or partially maps onto the real structure described by the successor. But the *better* this mapping, the *less radical* the elimination becomes – it starts looking like reduction or revisionism. True ontological elimination requires a stronger break, making Predictive Success and Retention harder to satisfy convincingly.

  ### Scoring Key Theorists Against the Desiderata (Briefly)

  *   **Paul Churchland (Neurocomputational Eliminativism):**
      *   **Predictive Success:** Strong. FP success stems from vector coding in neural state spaces approximating belief-desire logic. FP is a crude prototype of the real neural dynamics.
      *   **Retention:** Moderate/Strong. State space trajectories preserve intentional content and functional roles at a more fine-grained level. FP's "grain" is wrong, but its general shape tracks something real.
      *   **Practical Efficacy (Kitchen):** **Weak.** Future "neurotechnology" and education *might* retrain us, but current successor (neural state spaces) is utterly impractical for daily life. Offers no usable alternative framework *now*.
      *   **Autobiography:** **Weak.** Introspection is a fallible "skilled perception" of neural states. Struggles with the self-referential problem and the *authority* of 1st-person reports. Explains error, not the feeling of direct access.
      *   **Scope:** All attitudes are patterns in state spaces – eliminate all together.
      *   **Causal Efficacy:** Strong. Neural vector transformations directly cause behavior. Content is causal via vector similarity.
      *   **Verdict:** Strong on science-facing criteria, fails the practice/phenomenology-facing criteria (Kitchen, Autobiography) decisively.

  *   **Stephen Stich (Syntactic Revisionism):**
      *   **Predictive Success:** Moderate. FP succeeds due to tracking causally relevant *syntactic* (formal, non-semantic) properties of internal states, not their semantic content.
      *   **Retention:** **Weak/Rejected.** Argues FP was *not* tracking anything unified or real semantically; it's fundamentally mistaken. Successor tracks only formal properties. Radical discontinuity on semantics.
      *   **Practical Efficacy (Kitchen):** Moderate/Weak. Syntactic states *might* be usable for prediction in principle, but it's unclear how this framework translates to everyday practice ("He tokened state S63!"). Offers no clear practical schema.
      *   **Autobiography:** Moderate. 1st-person reports are reports of syntactic states. Avoids global error *if* we accept syntactic states exist. But struggles with the *meaningfulness* and authority of reports *to the subject*.
      *   **Scope:** Primarily targets *semantic* properties of beliefs/desires. Basic causal/functional roles might be preserved syntactically (mixed verdict possible).
      *   **Causal Efficacy:** Strong. Behavior caused by formal (syntactic) properties of internal states. Explicitly avoids semantic causation.
      *   **Verdict:** Radically severs semantics (strong elimination there), struggles with Retention of FP's apparent intentional explanations and Kitchen usability. Autobiography is less dire than Churchland's.

  *   **Daniel Dennett (Instrumentalism/Intentional Stance):**
      *   **Predictive Success:** Strong. FP is an incredibly successful predictive *instrument* adopted from the intentional stance. Its success is explained by the evolution of complex, predictable systems.
      *   **Retention:** Strong (but deflationary). FP tracks real *patterns* of complexity and rationality in behavior. Beliefs/desires are abstractions capturing these patterns, not internal entities.
      *   **Practical Efficacy (Kitchen):** **Strong.** The intentional stance *is* the practical framework. He provides no *alternative* ontology; FP *is* the tool for the job.
      *   **Autobiography:** Strong. 1st-person reports are adopting the intentional stance towards oneself. They report real patterns in one's behavioral dispositions. No deep error.
      *   **Scope:** Applies to all intentional states uniformly via the stance.
      *   **Causal Efficacy:** **Weak/Redefined.** Beliefs/desires aren't internal causes; they are patterns in the *total* causal flow. Causation is sub-personal (e.g., neural). The patterns are real, but not causally efficacious *entities*.
      *   **Verdict:** Brilliantly satisfies Predictive Success, Retention, Kitchen, and Autobiography by **abandoning ontological eliminativism**. He's an instrumentalist, not a true eliminative materialist. Fails Causal Efficacy as traditionally understood (contentful states causing behavior).

  *   **Quietism (e.g., later Wittgensteinians, some Pragmatists - Refusal to Play):**
      *   **Predictive Success:** N/A (or implicit acceptance). FP works; that's what matters. No need for a "scientific" explanation of its success at its own game.
      *   **Retention:** N/A. Rejects the framing. FP isn't a failed *scientific* theory; it's a different kind of practice.
      *   **Practical Efficacy (Kitchen):** **Strong.** FP *is* the practice. Trying to "replace" it fundamentally misunderstands its role.
      *   **Autobiography:** **Strong.** 1st-person reports are part of the practice, not reports on inner objects. No error, just different language game.
      *   **Scope:** N/A. The question is misguided.
      *   **Causal Efficacy:** Avoids the question or redefines it within the practice.
      *   **Verdict:** Avoids all problems by rejecting the metaphysical project wholesale. Satisfies practice/phenomenology criteria perfectly but offers nothing to the eliminativist's *scientific* critique of FP as a bad theory of inner mechanisms. Not eliminativism.

  ### The Knockout Requirement: Autobiography

  **The Autobiography Condition does the most damage to the most robust forms of eliminativism.** It forces the theorist to confront the self-referential paradox and the phenomenology of first-person authority head-on. Churchland's neuro-talk feels alien to lived experience and struggles with the truth of his own assertions. Stich's syntactic states lack the meaningfulness inherent in our self-conception. Dennett brilliantly sidesteps it, but only by abandoning ontological elimination. Quietism dismisses the problem. Providing a truly satisfying eliminativist account of first-person authority without collapsing into instrumentalism or self-refutation remains the most significant, likely fatal, hurdle. If you *really* eliminate beliefs, what *are you doing right now* as you formulate arguments against them? An adequate answer to *that* question is the litmus test.

  **For Your Paper:** Use this framework to structure your critique. Don't just present desiderata; *argue* for their necessity and *highlight the tensions*. Show how each theorist navigates (or fails to navigate) these specific pressures. Your insight that the lack of a clear success criterion is the core problem is spot-on – make articulating and defending these desiderata the foundation of your evaluation. Good luck!
