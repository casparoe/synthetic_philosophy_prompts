prompt: |-
  I've been trying to work out my actual position on everyday conventions, mostly after a weird argument at dinner last week, and I want to lay out my gut verdicts and have you tell me if there's a principle underneath them or whether some of them just have to go. So here's the batch of cases I've been mulling. Jaywalking at 3am on a completely empty street: totally fine, not even a mild wrong. Jaywalking with my kid's hand in mine on a busy road: clearly wrong, and it feels like more than just imprudence. Skipping a long queue because a friend near the front waves me over to join them: fine, or at least I'd do it without guilt. Skipping the same queue by just walking to the front and standing there: absolutely not. Not tipping in a US restaurant even though I know the servers depend on it: wrong. Not tipping in Tokyo even though I know tipping isn't done there: right, actually obligatory, I'd feel like a jerk leaving money on the table. A tourist visiting my city refusing to tip because "tipping culture is toxic and somebody has to push back": I half admire it and half think they're making a waiter pay for their principles, which I can't square with how comfortable I feel refusing to tip in Tokyo myself. And one more: when I was in a country where pushing in crowds at bus stops was just the norm, I did it after a day of getting trampled, and I still feel vaguely bad about it, even though rationally I don't see what else I should've done.

  So my tentative thought was something like "follow the local convention whenever violating it shifts a concrete cost onto a specific identifiable person" — the waiter gets stiffed, the person behind the friend in the queue gets delayed by me. But that seems to get the Tokyo case backwards: refusing to tip there harms nobody, so my rule says tipping is optional, yet my gut says it's actively rude. And it also seems to make the crowd-pushing case fine, which doesn't match my lingering guilt. Maybe the principle needs something about respecting the community's own coordination scheme rather than tracking who gets hurt? But then the "push back against tipping culture" tourist is following *a* principle, just not the local one, so maybe what matters is whether you've genuinely opted into the community or not, and visitors are in some half-in half-out state that has its own rules.

  Can you give me one principle (or a small set of candidates) that captures as many of my verdicts as possible, tell me which verdicts it forces me to abandon, and state it precisely enough to predict the right answer on a couple of cases I haven't listed? For instance, I genuinely don't know what to think about: silently jaywalking in a country where nobody ever jaywalks even on empty streets, because the norm against it is just that strong there. If your principle has something to say about that, I'd take it as a good sign. Also happy to hear if you think one of my verdicts is just bias talking and I should revise it outright — the Tokyo tipping one is the one my friends keep hammering me on.
reasoning: |-
  Okay, let me try to unpack this user's moral conundrum. They've presented a bunch of everyday scenarios where their gut feelings about right and wrong seem inconsistent, and they're looking for an underlying principle. 

  First, I notice this isn't just some abstract philosophy exercise - there's real personal tension here. That dinner argument clearly stuck with them, and the lingering guilt about the crowd-pushing incident suggests genuine moral discomfort. This is someone trying to align their actions with their values.

  The cases cluster around three main themes: physical coordination (jaywalking, queues), economic transfers (tipping), and cultural adaptation (Tokyo vs tourist behavior). What's interesting is how the user's judgments shift based on context - empty street vs busy road, US vs Tokyo tipping. 

  Their proposed "no concrete harm" principle almost works but fails on two points: Tokyo tipping (no harm but feels obligatory) and crowd-pushing (harm exists but still feels wrong). That's the knot to untangle. 

  Hmm... maybe it's about more than just harm. The queue example is telling - skipping with permission feels fine because it's socially ratified, while cutting is a unilateral breach. And the tourist case reveals tension between individual principles and local expectations. 

  I recall David Hume's convention theory - norms as solutions to coordination problems. That could explain why violating Tokyo's no-tipping norm feels wrong even without direct harm: it disrupts a delicate equilibrium. Similarly, the crowd-pushing guilt might stem from participating in a system you disapprove of, even when "forced" to adapt.

  The jaywalking-in-strict-culture case they added is perfect for testing. If the principle is just "follow local convention," that would require compliance. But that feels unsatisfying if the norm is pointless. Maybe the key is whether the convention solves a real coordination problem versus being purely symbolic...

  Wait - their friends challenge the Tokyo tipping verdict. That's significant. Perhaps they're reacting to the user's categorical "obligatory" stance when occasional tipping might actually be harmless. This needs nuance: the wrong isn't in the monetary transfer but in refusing the cultural script of "no tipping means no tipping."

  For the unified principle, we'd need something that accounts for: harm prevention, coordination value, and participation status. The "respectful participation in coordination schemes" framework seems promising, but requires careful definition of what counts as "respectful" and "scheme." 

  The tourist case remains toughest - is it activism or free-riding? The principle should probably condemn it because they're benefiting from the service system while rejecting its rules, unlike in Tokyo where following local rules is the respectful act. 

  Final principle should have three layers: prevent concrete harm, respect functional coordination, and adjust for visitor status. But must avoid being so vague it justifies anything. Precision matters - hence needing test cases like the strict jaywalking scenario.
answer: |-
  Your intuitions reveal a sophisticated moral sense grounded in **social coordination, respect, and context-dependent harm**. I'll propose a unified principle, test it against your cases, flag tensions, and resolve your new scenario.

  ### The Core Principle
  **"Respectful participation in local coordination schemes, unless they impose unjust harm or you're reasonably rejecting the scheme's legitimacy."**  
  With three key filters:
  1. **Harm Prevention**: Avoid actions that *concretely harm* identifiable individuals by shifting burdens onto them.
  2. **Coordination Value**: Honor conventions that solve collective problems (e.g., traffic flow, queue fairness).
  3. **Participatory Stance**: Your role in the community (member/visitor) shapes obligations. Visitors should default to local norms; members may challenge them *if done responsibly*.

  ---

  ### Testing Against Your Cases
  | Case                          | Your Verdict       | Principle's Verdict | Tension? |
  |-------------------------------|--------------------|---------------------|----------|
  | Jaywalking (3am, empty)       | Fine               | Fine ✅             | None. *No harm; no coordination problem solved by waiting.* |
  | Jaywalking (busy road, child) | Wrong              | Wrong ✅            | None. *Violates harm prevention (risk to child/others) and coordination (traffic flow).* |
  | Skipping queue (with friend)  | Fine               | Fine ✅             | None. *Friend's invite integrates you into the coordination scheme without burdening others.* |
  | Skipping queue (cutting)      | Wrong              | Wrong ✅            | None. *Harms those behind you; undermines queue coordination.* |
  | Not tipping (US)              | Wrong              | Wrong ✅            | None. *Harms server (concrete loss); violates economic coordination scheme.* |
  | Not tipping (Tokyo)           | Obligatory not to  | Obligatory not to ✅| None. *Tipping would disrespect local coordination (wages are inclusive).* |
  | Tourist refusing US tip       | Ambivalent         | **Wrong** ⚠️        | **Revision suggested.** *Visitor status obliges respect for local schemes unless protesting *responsibly* (e.g., lobbying Congress, not stiffing servers).* |
  | Crowd-pushing abroad          | Guilty but conflicted| Permissible *but* guilt expected | Partial. *As a visitor, respecting local coordination is defensible. Guilt stems from *personal discomfort* with the norm.* |

  ---

  ### Resolving Tensions
  1. **Tourist refusing US tip**:  
     Your ambivalence is understandable, but the principle condemns it. Harm prevention trumps personal principles here: the tourist forces a server to absorb the cost of their protest. To "push back" ethically, they must target *system change* (e.g., advocating for fair wages), not exploit the system while harming individuals.  
     *Revise verdict: Wrong.*  
     *(This aligns your Tokyo/US consistency: in both, you follow local rules to avoid harm/disruption.)*

  2. **Crowd-pushing guilt**:  
     Your guilt isn't irrational. The principle permits it (as respectful participation in local coordination), but *you* find the norm unjust. Guilt reflects moral residue from compromising your own standard of fairness.  
     *Keep verdict: Permissible, but guilt is a sign of integrity, not error.*

  ---

  ### New Case: Jaywalking in a Strict Culture
  - **Scenario**: Silent jaywalking at 3am on an empty street in a country where jaywalking is *never* done, due to a strong norm.  
  - **Principle's Verdict**: **Wrong** to jaywalk.  
    - *Why?* Even if no concrete harm occurs, violating a deeply ingrained coordination norm disrespects the community's social contract. Your role as a visitor (or even a member) obliges you to uphold schemes that foster order, *especially* when they’re culturally significant. The "empty street" is irrelevant if the norm exists to reinforce broader compliance.

  ---

  ### Strengths of the Principle
  - Explains **Tokyo tipping**: Not tipping isn't just "fine"—it’s *required* to respect the local wage coordination scheme.  
  - Captures **queue-cutting vs. invitation**: Only the latter is socially ratified.  
  - Justifies **crowd-pushing ambivalence**: Participation is defensible for visitors, but personal ethics may clash.  
  - Handles **strict jaywalking**: Norms gain moral weight from their role in social cohesion, not just immediate consequences.

  ### Limitations
  - Requires judgment about what counts as an "unjust harm" (e.g., is tipping culture inherently unjust?).  
  - Doesn’t eliminate all guilt (as in crowd-pushing), but reframes it as empathy or integrity.

  ---

  ### Final Refinement
  **"Adhere to local conventions that enable social coordination, unless:  
  (a) They cause unjust harm to specific persons, or  
  (b) You are a community member *responsibly* challenging the norm.  
  Visitors must prioritize (a) and default to (b) only when harm is absent."**

  This preserves your core intuitions while urging revision on the activist tourist case. Your "harm to specific persons" instinct was sharp—it just needed pairing with respect for coordination and role-aware participation.
