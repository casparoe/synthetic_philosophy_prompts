answer: |-
  Here's the quiz draft (798 words):

  **Questions:**

  1.  **Antifungal Gene:** A gene in rice causes the plant to produce a toxin that kills a devastating fungus. The toxin also slightly weakens the rice plant itself. Over time, this gene becomes very common in areas with the fungus. Why?
      *   A) The *gene* benefits by saving copies of itself in the plants that survive the fungus, outweighing the cost.
      *   B) *Individual rice plants* with the gene survive the fungus better and leave more offspring, despite the slight cost.
      *   C) The *rice population* avoids collapse from the fungus, so genes helping the group persist.

  2.  **Sterile Ants:** In an ant colony, most worker ants are sterile and work only to feed and protect the queen and her offspring (their siblings). Why does this sterile worker trait persist?
      *   A) The *workers' genes* are passed on indirectly through the siblings they help the queen produce.
      *   B) *Colonies* with sterile workers outcompete colonies without them, producing more new queens/kings.
      *   C) It fundamentally helps the *individual worker ant* fulfill its biological role within the colony system.

  3.  **Selfish Chromosome:** In a species of mouse, a particular chromosome variant ("Drive") cheats during sperm production. Fathers carrying "Drive" produce 90% sperm with "Drive" (instead of 50%), meaning it spreads rapidly. Unfortunately, males homozygous for "Drive" are completely sterile. What best explains "Drive" spreading initially?
      *   A) It benefits the *Drive chromosome* itself by getting into more offspring.
      *   B) It benefits *individual mice* carrying one copy by giving them a reproductive edge.
      *   C) It benefits *mouse populations* by increasing genetic diversity.

  4.  **Cancer:** In a population of Tasmanian Devils, a fatal, contagious face cancer spreads when Devils bite each other (common during mating/fighting). An individual Devil with slightly less aggressive behavior gets bitten less often and is less likely to catch/spread the cancer. This behavioral variant becomes more common. Why?
      *   A) The *genes* for less aggression spread because Devils carrying them avoid the cancer and reproduce more.
      *   B) *Individual Devils* with less aggression survive longer and leave more offspring.
      *   C) *Groups* (packs/populations) of Devils with less aggressive individuals suffer fewer cancer deaths and persist better.
      *   (Note: Selection acts *against* the cancer cells too, but here focus on the Devil behavior trait.)

  5.  **Bird Migration:** Arctic Terns migrate incredibly long distances annually between Arctic and Antarctic breeding/feeding grounds. Why did this long-distance migration evolve?
      *   A) *Genes* for migration ensure they reach environments where copies of themselves can survive/reproduce best.
      *   B) *Individual terns* that migrate successfully access abundant seasonal food, survive better, and raise more chicks than non-migrators.
      *   C) *Tern populations* that migrate maintain larger, more stable numbers across the year.

  6.  **Clone Shrub Toxin (Your Case):** A desert shrub reproduces only clonally; a whole hillside might be one genetic individual. It carries a gene causing roots to secrete a toxin. The toxin slightly damages the shrub's *own* tissues but is lethal to seedlings of *different* genetic shrubs nearby. How did this toxin gene likely evolve?
      *   A) The *toxin gene* benefits by killing competitor seedlings, making space and resources for more copies of itself within the vast clone.
      *   B) The *genetic individual* (the whole hillside clone) benefits because reduced competition from other genotypes allows it to spread further clonally.
      *   C) *Groups* of shrubs (hillsides) with the toxin gene outcompete hillsides without it for space and resources.

  7.  **Same as Q6, but Focus:** When analyzing the toxin gene's spread, the most *fundamental* level explaining its success is:
      *   A) The gene itself, replicating within the clone.
      *   B) The survival and clonal spread of the entire genetic individual (the clone).
      *   C) The competitive success of the local group (the hillside clone) against other groups.

  8.  **Lizard Display:** Male Anole lizards perform elaborate, colorful displays to attract females. This makes them more visible to predators. Why did flashy displays evolve?
      *   A) *Genes* for flashy displays spread because males with them attract more mates and sire more offspring.
      *   B) *Individual males* with flashier displays get more mates and leave more offspring, outweighing predation risk.
      *   C) *Groups* (island populations) with flashier males attract more females and grow faster.

  **Scoring Key:**

  *   **Tally** your answers for A, B, and C across all 8 questions.
  *   **Ignore Question 5 (Control):** Everyone *should* pick B here (Orthodox organism-level). If you didn't, re-read your evolution basics!
  *   **Focus on the Pattern:** Real positions have consistent intuitions across these cases.

  *   **Mostly A (especially Q1, Q3, Q4, Q6A, Q7A): Hard-line Gene-Centrist (Dawkins):** You see genes as the fundamental replicators driving evolution. Traits persist if they benefit gene replication, even at the expense of individuals (Q3, Q6) or groups. Organisms/groups are vehicles.
  *   **Mostly B (especially Q1, Q2, Q4, Q6B, Q8): Orthodox Organism-Level Selectionist:** You focus squarely on the survival and reproduction of individual organisms. Traits help *the individual* compete or cooperate to leave offspring (Q2 via indirect reproduction). Groups/genes are byproducts.
  *   **Mostly C (especially Q1C, Q2B, Q4C, Q6C, Q7C): Group-Selection Revivalist:** You readily see group-level benefits and competition as driving forces in evolution. Traits persist because they help the group survive or outcompete other groups, even if costly to individuals (Q2, Q4).
  *   **Mix of A & B, leaning B (Key: Q2A, Q4B, Q6A/B, Q7A/B): Pragmatic Multilevel Selectionist (Okasha-ish):** You comfortably shift focus. You see genes (Q3, Q6A) and groups (Q1C, Q2B, Q4C) as potential levels where selection can act, depending on the case. The "unit" depends on the specific trait and population structure. Gene/individual focus often wins out as most practical.
  *   **Mix of A & B, leaning A (Key: Q2A, Q4A/B, Q6A, Q7A): Inclusive-Fitness Loyalist:** You focus on genetic replication but strongly emphasize that genes can spread via helping relatives (kin selection - Q2A). This is gene-centric altruism explained by shared genes. Group benefits (C answers) are seen as a side-effect of individual/genetic payoffs.

  **Notes on Answer Patterns & Positions:**

  1.  **Kin vs. Group:** Q2 is the key differentiator. Choosing A (*genes* via relatives) maps to Inclusive Fitness Loyalism. Choosing B (*colony* benefit) maps to Group Selection Revivalism. While mathematically similar, the intuitive framing differs: payoff to genes via kin vs. survival of the group unit. Q7 also probes this intuition about the fundamental "unit". We split them based on this intuition, not formal equivalence.
  2.  **Incoherent/Undefended Patterns:**
      *   **Strong A + Strong C:** (e.g., Q1A & Q1C, Q3A & Q3C, Q6A & Q6C). Gene-centrism and strong group selection are fundamentally opposed views on the replicator (gene vs. group). This combo is incoherent; no position holds both simultaneously.
      *   **Mostly C but Q3C:** Group Selection Revivalists generally *reject* gene-level selection explanations like meiotic drive (Q3) as distinct from group selection. Picking C here ("increases diversity") is a weak/vibe answer not defended by serious group selectionists.
      *   **Strong B but Q2C/Q3B/Q6C:** Orthodox Individualists reject group selection. Picking C for Q2 (sterile workers) or Q6 (clone toxin) contradicts the core view that selection acts *for* the benefit of the individual organism. Q3B is also incorrect for Individualists; sterility doesn't help the individual mouse.
  3.  **Species Selection:** Not included. The cases here (except maybe the clone viewed mega-macro) don't cleanly isolate species-level properties (like speciation/extinction rates) from lower-level dynamics. It's rare and harder to test with these intuitive cases.
