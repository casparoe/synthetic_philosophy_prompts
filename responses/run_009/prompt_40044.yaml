     - In Scenario B (unreliable), the gauge readings are all 7, but the ground truth is never 7 (or sometimes 7, but in our setup, we can avoid 7 in the ground truth for Scenario B).

     In Scenario B, the students see that the gauge was always reporting 7, but the actual fuel level was, for example, 5 in round 1, 8 in round 2, etc. So it was always wrong.

  6. The debrief.

  Debrief Script:

