  ### The Bootstrapping Game: "The Trusty Tank Challenge"

  #### **Learning Objective**:  
  Students experience the intuitive pull of single-step instrument-based reasoning and the unease of iterative self-verification before learning the formal "bootstrapping problem." The game forces them to generate a circular reliability certificate that *feels* rigorous but is independent of the instrument's actual accuracy.

  ---

  ### **Materials to Prepare**  
  *Total cost: ~$10 (office supplies)*  
  1. **Gauge Cards (1 deck)**: 30 index cards. On each, print a number 1–10 (representing fuel level readings). Prepare two *identical* decks (Deck A and Deck B) but keep them hidden.  
  2. **Ground Truth Key (1 envelope)**: A sealed envelope labeled "DO NOT OPEN: Factory Specifications." Inside, a sheet with 14 pre-generated numbers (1–10) representing the *actual* fuel levels per round.  
  3. **Player Logs (15 sheets)**: Printed tables for students to record:  
     - *Round | Gauge Reading | My Inference | Action Taken*  
  4. **Reliability Certificate (1 poster)**: A large sheet titled "OFFICIAL INSTRUMENT RELIABILITY REPORT." Blank sections for:  
     - *Total Tests Conducted*  
     - *Number of Correct Inferences*  
     - *Certification Decision (Reliable/Unreliable)*  
     - *Signature Line*  
  5. **Action Tokens (28 tokens)**: Red ("Refuel") and green ("Drive") poker chips or colored paper squares (14 of each).  
  6. **Scoring Board**: Whiteboard with:  
     - *Team Points: Start at 0*  
     - *Refuel Cost: -1 point*  
     - *Breakdown Penalty: -5 points*  
     - *Successful Drive: +2 points*  

  ---

  ### **Game Setup**  
  1. **Assign Roles**:  
     - **14 Players**: Each monitors their "fuel tank" for 1 round (each round = 1 player’s turn).  
     - **Scorekeeper**: A student tracks points on the board.  
     - **Recorder**: A student fills out the Reliability Certificate during Phase 2.  
  2. **Secret Setup**:  
     - Before class, choose one scenario:  
       - **Reliable Gauge**: Actual fuel levels (Ground Truth Key) *match* gauge readings (Deck A).  
       - **Unreliable Gauge**: Actual fuel levels are *random* (e.g., die rolls), while gauge readings (Deck B) are *always 6* (fixed reading).  
     - Seal the Ground Truth Key. Students never see it until the reveal.  

  ---

  ### **Game Rules & Flow**  
  **Phase 1: Fuel Monitoring (14 Rounds, 5 mins total)**  
  - **Per Round (1 student)**:  
    1. **Gauge Reading**: Draw a card from the Gauge Deck (e.g., "6"). Announce it.  
    2. **Inference**: Player *must* record: "Tank = [reading]" (e.g., "Tank = 6") in their log.  
    3. **Action**: Player chooses:  
       - **Refuel (red token)**: Costs 1 point. Inferred tank level becomes 10.  
       - **Drive (green token)**: Free. Tank level = their inference (e.g., 6).  
    4. **Outcome**:  
       - *Breakdown*: If actual tank (from Ground Truth Key) ≤ 2. *Penalty: -5 points*.  
       - *Success*: If actual tank > 2. *Reward: +2 points*.  
       - *(Instructor secretly checks Ground Truth Key)*  
  - **Key Twist**: Actual levels are *independent* of gauge readings (e.g., gauge says "6," truth is "3" in unreliable scenario).  

  **Phase 2: Reliability Certification (5 mins)**  
  - **Data Compilation**: Recorder tallies:  
    - Total tests: 14 (all rounds).  
    - Correct inferences: Counts *all* rounds where "My Inference" (gauge-based) matched itself (auto-"correct" by definition).  
  - **Certificate Drafting**: Students *must* certify reliability if:  
    - No breakdowns occurred (vehicle always succeeded).  
    - Inferences were "100% consistent" (reason: "We inferred tank level = gauge reading every time!").  
  - **Sign-Off**: Class signs certificate: "Reliable: 14/14 tests correct."  

  **Phase 3: The Reveal (2 mins)**  
  - Open Ground Truth Key. Compare:  
    - *Reliable Scenario*: Gauge readings = actual levels. Certificate feels justified.  
    - *Unreliable Scenario*: Gauge always read "6," but actual levels varied (e.g., 3, 8, 4...). Certificate is identical—but based on false data.  
  - **Impact**: Students see the certificate is identical in *both* scenarios. The "proof" was manufactured from nothing but the gauge’s own outputs.  

  ---

  ### **Scoring System**  
  - **Goal**: Maximize points (no real money; prizes = bragging rights).  
  - **Mechanics**:  
    - Refueling avoids breakdowns but costs points.  
    - Driving saves points but risks breakdowns.  
  - **Design Effect**: Students *predictably avoid refueling* (saving points) since gauge readings appear trustworthy (e.g., "6 > 2, so drive!"). In unreliable scenarios, this leads to breakdowns *only if* actual level ≤ 2, but the fixed/false readings mask this.  

  ---

  ### **Debrief Script (15 mins)**  
  **Map Game → Bootstrapping Problem**:  
  1. **Single-Step Reasoning**:  
     - *"In Round 1, why did you infer the tank was 6?"*  
       → Premise 1: Gauge read 6.  
       → Premise 2: *If gauge reads X, then tank = X.*  
       → Conclusion: Tank = 6.  
     - *"This step feels intuitive—like trusting a thermometer. Where did Premise 2’s warrant come from?"*  
       → Students admit: No independent evidence; we assumed the gauge’s reliability.  

  2. **Iteration → Circularity**:  
     - *"Your certificate declared the gauge reliable because your inferences were ‘correct.’ How did you verify those inferences?"*  
       → "We used the gauge’s readings to define ‘correct’!"  
     - *"Why does this feel like cheating?"*  
       → No independent check. The certificate would be identical even with a broken gauge.  

  3. **Contrast with Calibration**:  
     - *"How would we *really* test the gauge?"*  
       → Compare readings to actual tank levels (e.g., dipstick).  
     - *"Did we do that here?"*  
       → No—we had the Ground Truth Key but never used it to challenge the gauge.  

  4. **Philosophical Tension**:  
     - *"Option 1: You never had warrant for Premise 2. Each inference was illegitimate."*  
       → If so, how do we ever trust instruments?  
     - *"Option 2: You had warrant for single steps, but it ‘evaporates’ when used for bootstrapping."*  
       → Why can’t warrant transfer to the conclusion it supports?  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students refuse to trust the gauge.  
     - *Fix*: Emphasize: "You’re new mechanics—this gauge is standard issue. Use it as your only tool!" Award bonus points for "team cohesion" if they follow readings.  

  2. **Problem**: They refuel constantly to avoid breakdowns.  
     - *Fix*: Penalize over-refueling: "Budget cuts! Refueling costs double after Round 7." Force trade-offs.  

  3. **Problem**: Certificate debate stalls.  
     - *Fix*: Intervene: "The EPA requires a decision—certify or face shutdown!" Push for majority vote.  

  4. **Problem**: Reveal feels underwhelming.  
     - *Fix*: Dramatize it: "The factory just sent the *real* specs..." Contrast certificate with harsh truth.  

  ---

  ### **Limitations & Philosophical Gaps**  
  **The Unsimulatable Core**:  
  - The game *cannot* replicate bootstrapping for **perception itself**.  
    - **Why?**: In the game, students use perception (eyes, ears) to read gauges/tokens, but perception isn’t *in question*. It’s the *given* tool they rely on to play.  
    - **Debrief Argument**: "When perception is the instrument, we can’t ‘open the Ground Truth envelope’—we have no independent access to reality. Any check *uses* perception. So while the gauge game shows circularity for tools, for perception, the circularity is inescapable—and that’s the hard problem."  

  **Mitigation**: Stress that the game is an *analogy*. Use debrief to pivot:  
  - *"In this game, perception was your ‘unquestioned instrument.’ But what if *it* is the gauge we’re bootstrapping? Can we even run the test?"*  
  - Highlight that this shifts the problem from *epistemic negligence* (gauge case) to *metaphysical limitation* (perception case).  

  ---

  ### **Why This Works**  
  - **Concrete → Abstract**: Students *feel* the innocence of single steps and unease of iteration.  
  - **The Reveal**: The identical certificate in reliable/unreliable scenarios forces cognitive dissonance.  
  - **Low Prep**: Uses cheap, reusable materials.  
  - **Discussion-Ready**: Logs and certificate become debrief props.  

  Run it, then drop the term "bootstrapping problem"—they’ll lean in.
