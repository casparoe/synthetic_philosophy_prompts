     Premise 2: If the gauge reads R, then the fuel level is R. (But did they have warrant for premise 2? Not really; they were using the gauge to assume that.)
     Conclusion: The fuel level is R.

    This seems innocent because we often rely on instruments.

  - But then when iterated and used to certify the gauge, we used the same pattern: 
     In each round, we had:
        The gauge read R_i and the fuel level was R_i (as we believed).
     So the gauge was correct in each round.
     Therefore, the gauge is reliable.

