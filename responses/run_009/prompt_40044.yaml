     b. Instructor announces the outcome: since the ground truth is always>=2, always say "success". (If you want, you can have one scenario where there is a breakdown, but then it complicates. For simplicity, no breakdowns.)

  3. After 14 rounds, say: "We are going to certify the reliability of the gauge. We need to write a report that will be used to decide whether to keep using this gauge or not. Look at the data we collected. Can we conclude that the gauge is reliable?"

