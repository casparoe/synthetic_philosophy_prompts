     Reliability Certification Report

     We, the undersigned, certify that the fuel gauge is reliable.

     Evidence:
     - In every round, the gauge provided a reading.
     - We used the gauge reading to infer the fuel level.
     - The vehicle never broke down, which is consistent with the fuel level being as reported (always at least 2).

     Therefore, the gauge is trustworthy.

     Signed: ___________________

   But we want them to generate this themselves. So don't give them a pre-filled form. Give them a blank form and let them fill it in.

