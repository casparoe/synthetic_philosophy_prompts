  Game Procedure:

  1. Introduction: "We are the operators of a fleet of vehicles. Our job is to monitor the fuel level of a particular vehicle over 14 trips. We have a fuel gauge, but we don't know how reliable it is. In each round, I will show you the gauge reading. You are to record that reading and then write down what you believe the fuel level to be. Then, the vehicle will go on a trip. I will then tell you the outcome: whether the trip was successful or if the vehicle broke down (which happens if the fuel level is below 2)."

  2. Play 14 rounds:
     a. Round i: 
          - Instructor draws the i-th gauge reading card (from the pre-shuffled deck for the chosen scenario) and shows it to the class.
