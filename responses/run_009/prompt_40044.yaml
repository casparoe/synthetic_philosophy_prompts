  We are designing an in-class game to simulate the bootstrapping problem. The goal is for students to experience the problem of easy knowledge through a game where they use an instrument (a "gauge") to make inferences, and then attempt to certify the reliability of that instrument using only its own readings. The game should reveal that the reliability certificate they produce is circular and would be the same regardless of the instrument's actual reliability.

  Game Title: The Fuel Gauge Game

  Overview:
  Students are in charge of monitoring the fuel level of a vehicle. They have a fuel gauge that gives readings, but they do not know how reliable it is. The game consists of multiple rounds. In each round, they use the gauge to check the fuel level and then make a decision about refueling. They earn points for having fuel when needed and avoiding unnecessary refueling. Later, they are given the opportunity to "certify" the gauge's reliability using their own records of the gauge's readings and their actions. The twist is that the gauge is either reliable or unreliable (determined secretly by the instructor), and the certification process will produce a positive reliability report regardless of the gauge's actual reliability.

  Materials:
  1. A deck of 14 cards (one per student) for the gauge readings. Each card has a number from 1 to 10 (representing the fuel level as reported by the gauge). The deck should have a distribution that matches the reliability condition (see below). Alternatively, we can use a die to generate readings, but let's stick to cards for control.
  2. Two envelopes: one labeled "Ground Truth" (which the instructor fills but does not show) and one labeled "Gauge Readings" (which will be used to collect the readings as the game proceeds).
  3. A "Reliability Certification Form" (printed) that students will fill out at the end, with columns for "Gauge Reading", "Action Taken", and "Inferred Fuel Level".
  4. A whiteboard or chart paper to record the round-by-round actions and readings for all to see.
  5. A die (optional, for generating ground truth if needed, but we'll use a fixed setup for simplicity).

  Preparation:
  - Create two sets of 14 cards (or one set of 14 if you are going to run one game for the whole class). Each card has a number from 1 to 10. However, the actual fuel level (ground truth) is determined by the instructor and hidden. We will have two scenarios: one in which the gauge is reliable and one in which it is not. Since we want the same certification process to work regardless, we must design the gauge readings so that they are self-consistent.

  But note: we want the ground truth to be independent of the gauge. So, we prepare:
  - A "Ground Truth" envelope: containing a list of 14 numbers (each between 1 and 10) which are the actual fuel levels for each round. We don't show this to students.
  - A "Gauge Readings" deck: This will be a set of 14 cards. The instructor draws one card per round to show the gauge reading. However, the gauge reading is generated based on the ground truth and the reliability condition.

  How we generate the gauge readings:
  - If the gauge is reliable, then the gauge reading equals the ground truth.
  - If the gauge is unreliable, then the gauge reading is a random number between 1 and 10 (or we can have a fixed pattern that is independent of the ground truth). However, to make the point, we want the certification process to look the same regardless. So, we can set up the unreliable gauge to have a fixed reading every time (say, always 7) regardless of the ground truth. But then the students might notice it's fixed. Alternatively, we can have the unreliable gauge readings be generated by a different rule (like ground truth plus or minus a large error). However, we want the students to feel that each step is reasonable and that the iteration leads to a certificate.

  Alternative plan: Instead of having two scenarios, we can have the gauge be reliable in some rounds and not in others? But that complicates. Let's keep it simple.

  We'll have two versions of the game, but we only run one. The instructor chooses one of two pre-set scenarios without telling the students:

  Scenario 1 (Reliable Gauge): The gauge reading is always equal to the ground truth.
  Scenario 2 (Unreliable Gauge): The gauge reading is always 7 (or any fixed number) regardless of the ground truth.

  But then how do we set the ground truth? We can have the ground truth for each round be determined by the instructor arbitrarily. For example, the instructor can write down 14 ground truth values (say, by rolling a die or just choosing). Then, for the reliable gauge, the gauge reading is the same as the ground truth. For the unreliable gauge, the gauge reading is always 7.

  However, note: the students don't know the ground truth. They only see the gauge reading and then take an action. The actions are:

  In each round, the gauge reading is shown. The students must decide whether to refuel or not. They are told that refueling costs points (because it takes time and money) but running out of fuel costs even more. The goal is to have fuel when needed.

