prompt: |-
  so, novelist here, and I need someone to audit an analogy that's doing a lot of work in my life right now.

  in my workshop there's this thing everyone says when a character is working: the character has "taken on a life of its own" — you can't just make her do whatever the plot needs, she pushes back, you have to negociate. my friend who did philosophy before the MFA says this is literally true in Dennett's sense: a well-written character is a real pattern, like a glider in the Game of Life or a center of gravity — not visible at the level of ink on the page, but supporting real predictions, so about as real as real gets. my other friend, a computationalist type, leans on the same analogy harder: if the pattern is rich enough, and you ran it forward in some simulation instead of leaving it frozen in the book, it could straight up be a person — substrate doesn't matter, the pattern is the person. my editor thinks we're all being mystical and says a character is just me, in a funny hat.

  can you actually audit this? I want the correspondance table spelled out first — for a fictional character, what plays the role the physical stance plays for a real person, what plays the design stance, what plays the intentional stance — and then where the mapping breaks. the thing I keep snagging on is the character's counterfactuals. when I ask "what would she do if cornered", the pattern answers because *I* answer, and if I answer differently in the next draft, the pattern just changes and there was never a fact I got wrong. a glider can't be revised by the grid, and a person's dispositions aren't hostage to an author's next pass. does that difference actually matter for what my friends want out of the analogy? specifically (a) the workshop rule that you shouldn't force a character against her "genuine wants", and (b) the claim that a rich enough pattern is a person. for each, tell me whether the conclusion survives once the disanalogies are on the table or whether the analogy was quietly carrying it the whole time. and if there's a better analogy for what's going on when a character "won't" do something, I'd like to hear it.

  format: lead with your bottom line in the first sentence, then the reasoning. no preamble and don't restate my question back at me.
reasoning: |-
  Hmm, the user is a novelist asking about the analogy of fictional characters "taking on a life of their own" in terms of Dennett's stances and computational patterns. They want me to audit this analogy, specifically mapping Dennett's physical, design, and intentional stances to fictional characters, identifying where the analogy breaks, and evaluating whether two claims survive this breakdown: (1) the workshop rule against forcing character actions against their "genuine wants," and (2) the claim that rich patterns constitute persons.

  I need to start with a clear bottom line as they requested, then provide reasoning without preamble. The core issue is that while the analogy works superficially for predictive patterns, it fails fundamentally because fictional characters lack autonomy - their counterfactuals are entirely author-dependent rather than fixed in reality.

  For the mapping: 
  - Physical stance for a character would be the literal text (words on page) 
  - Design stance would be the author's craft decisions (character design) 
  - Intentional stance would be inferred personality/desires 

  But the disanalogy is stark: when an author asks "what would she do if cornered," they're generating new content, not discovering fixed properties. The character's "wants" aren't independent - they're authorial choices that can be revised. This undermines both claims: 

  For (a) the workshop rule: It survives as practical craft advice (forced actions break immersion) but fails as metaphysical truth. The "shouldn't" is aesthetic, not ethical. 

  For (b) the personhood claim: It collapses entirely. Fictional patterns can't be persons because they lack causal independence - their "decisions" are always contingent on authorial intervention. 

  A better analogy might be improv acting: a performer maintains consistent role behavior through disciplined imagination, but remains fully aware they're inventing responses. This captures the phenomenology of characters "pushing back" without false ontological claims. 

  The user seems intellectually rigorous - they're spotting the flaw in their friends' arguments about pattern realism. Their underlying need is probably to reconcile the visceral experience of characters feeling autonomous with the knowledge that they're constructs. The improv analogy serves this better than computational metaphors.
answer: |-
  **Bottom line: The analogy holds for predictive utility but fails ontologically, preserving the workshop rule as craft wisdom while collapsing the personhood claim once counterfactual dependence is exposed.**

  ### Correspondence table for Dennett's stances:
  - **Physical stance (microlevel components):** *Ink/text* – Specific words, sentence structures on the page.  
  - **Design stance (artifactual purpose):** *Authorial craft* – Deliberate choices (backstory, traits, arcs) made to serve narrative function.  
  - **Intentional stance (predictive abstraction):** *Inferred psychology* – Treating the character *as if* possessing beliefs/desires to predict behavior within the story.  

  ### Where the mapping breaks:
  The disanalogy is **counterfactual stability and causal independence**.  
  - For a glider/person: Physical laws fix counterfactuals (e.g., "If interrupted, the glider *would* reform"). Revising the grid/person changes the *system*, not the prior pattern's truth.  
  - For a character: Counterfactuals ("What would she do?") are **generated, not discovered**. The pattern is mutable and author-contingent. If you revise the draft, the character's "dispositions" retroactively change. There is no fact of the matter independent of your current authorial state.  

  ### Evaluation of claims:
  1. **Workshop rule ("Don’t force against genuine wants"):**  
     - **Survives, but as craft heuristic, not metaphysics.**  
     - Why: The "pushback" is your *own subconscious consistency-checking* against established traits. Violating it breaks reader immersion because the intentional stance fails—predictions based on the pattern no longer hold. The rule is pragmatic: maintaining the pattern's coherence for the audience, not honoring autonomous desires. The disanalogy doesn't undermine this utility.  

  2. **"Rich pattern = person" claim:**  
     - **Collapses under the disanalogy.**  
     - Why: Personhood requires *causal robustness*—a mind's counterfactuals persist independent of an external author's whims. A character's "decisions" vanish if you delete the text; a person's do not. Substrate independence (a la computationalism) doesn't apply here because the pattern isn't *running*—it's static and wholly editable. The analogy smuggles in autonomy where there is none.  

  ### Better analogy:  
  Think of a character as an **improvisational actor** you trained.  
  - You defined their "rules" (backstory, personality).  
  - When you "ask" them a situation, they *generate* behavior consistent with those rules—feeling autonomous because the output isn't consciously pre-scripted.  
  - But they’re still *you* performing under constraints. If the scene isn’t working, you retrain/recast them (revision). No mysticism, no ontology—just skilled simulation.
