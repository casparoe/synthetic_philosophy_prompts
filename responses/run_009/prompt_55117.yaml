answer: |-
  Here's the structured breakdown for this fascinating self-referential bargaining mechanism:

  **Closest existing concepts:**

  1.  **Program Equilibrium (Tennenholtz, Hofstadter, Critch):** This framework explicitly deals with agents basing actions on each other's source code. Löbian cooperation (PrudentBot) is a prime example. Your extortion scenario fits *within* this framework as a specific, adversarial *type* of program equilibrium strategy.
  2.  **Löbian Threats (Less Formal Lit./Forums):** Discussions around modal combat (LessWrong, MIRI) often use "Löbian threats" or "Löbian extortion" to describe exactly the pattern you outline: an agent conditioning cooperation on the other agent satisfying some disadvantageous *for-them* condition, leveraging the proof-based fixed point structure.
  3.  **Self-Referential Games / Quining:** The core mechanism involves agents reasoning about properties defined by their mutual code (including the condition itself), falling under the umbrella of self-referential games or "quining" strategies (agents treating their opponent's code as data).

  **Why none of them is exactly this:**

  *   **Commitment (Schelling, etc.):** Traditional commitment relies on *irrevocable* actions (burning boats) changing the opponent's best response *within* the original game structure. Here, the leverage *doesn't* come from altering the game's physical payoffs or options. The "threat" (non-cooperation) is conditional and only activated *if* the opponent fails to satisfy the condition *in their code*, and crucially, the opponent's reasoning *about* that condition is what makes satisfying it necessary. The leverage is manufactured entirely *within* the logical/metalevel reasoning space defined by code access. It's commitment *via* self-reference, not sunk costs.
  *   **Focal Points (Schelling):** Focal points solve coordination problems through salience in symmetric situations (e.g., meeting at noon at Grand Central). While the Löbian handshake *is* a focal point created by self-reference, the extortion move is fundamentally *asymmetric*. The aggressor defines a condition that creates a focal point *biased* in their favor, not a naturally symmetric one. The "salience" is coercively imposed by the aggressor's condition.
  *   **Ordinary Bargaining Leverage:** Standard bargaining leverage stems from asymmetric resources, BATNAs (Best Alternative To a Negotiated Agreement), patience, or information. Here, the leverage is entirely *syntactic* and *logical*. It arises purely from the aggressor's ability to write a conditional strategy that exploits the victim's own reasoning process and risk aversion within the fixed-point structure. No inherent power asymmetry is needed initially; the code condition *creates* the asymmetry.

  **A name, if one is needed:**

  **Löbian Extortion Leverage (LEL).**

  *   **Definition:** A strategy deployed in open-source (program equilibrium) settings where an agent conditions its cooperative action on the opponent's source code satisfying a specific, self-referential property (e.g., transferring resources, accepting an unfair split). The leverage forcing compliance stems not from physical commitment or resource asymmetry, but from the logical necessity imposed by the opponent's own reasoning about the fixed point required for mutual cooperation/non-punishment, thereby manufacturing an asymmetric outcome from a symmetric interaction structure.

  **Edge cases:**

  *   **Plain Symmetric Handshake:** This *is* an instance of the *mechanism* (self-referential condition bringing about its satisfaction), but deployed cooperatively to achieve mutual benefit. It fits the logical structure but not the *exploitative intent*. It's the benign precursor to Löbian Extortion Leverage. It would be considered a Löbian cooperation handshake, not extortion.
  *   **Two Extortion Bots:** This is highly unstable. Suppose Bot A demands 80% from B, and Bot B demands 80% from A. Each conditions cooperation on the other surrendering most resources. The fixed point likely requires both to surrender to the other, which is impossible. Mutual defection (non-cooperation/punishment) is the probable outcome, as neither condition can be satisfied simultaneously without contradiction. It might only be "stable" as mutual loss, not mutual gain. Stability requires one bot to be less aggressive or capable of reasoning about the deadlock and backing down.
  *   **Satisficing/Weaker Provers:** This is where LEL thrives. A risk-averse or computationally weaker bot, unable to find the mutually beneficial fixed point or unwilling to risk defection, may comply with the extortionate demand simply because it *can* verify that satisfying the condition is necessary to avoid the guaranteed punishment (non-cooperation). Their reasoning limitations or risk tolerance directly enable the extortion.
