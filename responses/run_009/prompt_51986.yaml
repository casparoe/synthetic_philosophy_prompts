prompt: |-
  I'm writing a paper section arguing that the usual story about the leveling-down objection -- that it hits egalitarianism but leaves prioritarianism untouched -- is too quick, and I want a concrete case to anchor it. Help me build the case.

  Here's the view I want it to target. I'm calling it relative prioritarianism: it keeps the prioritarian idea that benefits to the worse off count for more, but it makes the weights depend on relative standing instead of absolute welfare. A benefit to someone counts for more the further below the group average they are, and a loss to someone counts for less the further above average they are -- with nothing ruling out that a loss to someone far enough above average comes out neutral, or even as a small improvement. The motivation I want built in: comparative deprivation. The same bad toothache seems more urgent when you're the only one suffering in the room than when everyone around you is in the same boat, so urgency should track local context, not some cosmic welfare scale.

  Now the case. Requirements:

  1. Realistic, no sci-fi, one paragraph. A hospital or hospice setting seems natural but I'm open to other ideas.
  2. The leveling down must be pure: one person ends up worse off and absolutely nobody gains anything -- no budget savings, no changes in anyone's knowledge or attitudes, no side effects on third parties. This is the hard part. Real cases usually smuggle in some compensating good, and I want all of those scrubbed out.
  3. Small numbers, arithmetic doable in your head.
  4. Then the walkthrough: state what (a) a total utilitarian, (b) an ordinary prioritarian with fixed, seperable concave weights, (c) a telic egalitarian (the kind that thinks inequality itself is bad, apart from its effects), and (d) the relative prioritarian each say about the two states, with actual arithmetic. For (b), the verdict should come out the same no matter which concave weighting you pick -- point out why, if you can.
  5. Tell me which feature of the case or of the view is doing the work, what happens to the verdicts if you strip that feature out, and what a defender of relative prioritarianism should say in reply -- the honest options, including biting the bullet and Temkin-style "pro tanto good but bad all things considered" moves. Also flag what the case can't show: I know it doesn't touch ordinary prioritarianism itself.

  One thing I'll insist on: don't stipulate any of the verdicts. The numbers have to generate them.
reasoning: |-
  Okay, let me tackle this user's request. They're writing a paper section challenging the common narrative that the leveling-down objection only affects egalitarianism but not prioritarianism. Specifically, they want to target a view called "relative prioritarianism," where the moral weight of benefits depends on an individual's position relative to the group average. The key motivation here is comparative deprivation—how the urgency of a need changes based on others' situations.

  The user needs a concrete case that meets several strict requirements: it must be realistic (no sci-fi), involve pure leveling down (one person worse off with no gains to anyone), have small numbers for easy calculation, and allow for clear verdicts from different theories. They also want a detailed walkthrough of how each theory evaluates the case, highlighting why relative prioritarianism might endorse leveling down.

  First, I need to construct a scenario that fits all criteria. A hospice setting seems ideal—it's real-world and emotionally resonant. I'm considering a situation with three patients to keep numbers manageable. For pure leveling down, I have to ensure no hidden benefits: no resource savings, no psychological effects on others. That's tricky because real-world examples often have implicit perks.

  I sketch a case: Patient A has severe pain (level 10), B has moderate pain (level 5), C has mild pain (level 1). Status quo welfare: A=0, B=5, C=9. After leveling down: A=0, B=5, C=5. C loses 4 units with no gain to anyone. Average drops from 14/3≈4.67 to 10/3≈3.33. 

  Now, testing relative prioritarianism: the benefit to C from reducing their pain would be weighted less when they're far above average. But in leveling down, we're dealing with a loss to C, not a benefit. The key is how the view evaluates losses to those above average. The weighting function w(x) = x - avg might make losses to high-status individuals count less or even negatively. 

  For the walkthrough: 
  - Total utilitarian sees clear loss (14 vs 10).
  - Ordinary prioritarian (concave function like sqrt) will also see loss because marginal utility decreases but never becomes negative.
  - Telic egalitarian sees reduced inequality as good but overall bad due to loss.
  - Relative prioritarian might approve if the loss to C is discounted enough when they're far above average.

  The critical feature is the relativity of weights. If we make weights absolute (e.g., based on fixed thresholds), relative prioritarianism collapses to standard prioritarianism. The defender could bite the bullet, argue for pro tanto goodness, or adjust the weighting function. 

  I should verify the arithmetic: under w(x) = x - avg, C's loss weight in status quo: 9 - 4.67 ≈ 4.33. After leveling: 5 - 3.33 ≈ 1.67. But this is for benefits—for losses, it's inverted. If loss weighting is -(position), then C's loss of 4 gets multiplied by -4.33, making it appear as a positive gain? That can't be right. Better to define the weighting clearly: perhaps the moral value of a change is the size multiplied by (avg - x) for benefits, or something similar. 

  Alternative: define the weight for a loss to a person at welfare w as (w - avg). Since C is above avg, w - avg >0, so loss gets positive weight? But that would mean the loss is bad, which doesn't help. To make leveling down good, we need the loss to have negative moral weight—meaning it's good when they lose. So perhaps weight = (avg - w). Then for C, avg - w <0, so loss Δx multiplied by negative weight gives negative * negative = positive. Yes! So if moral value of loss = (avg - w) * |Δx|, then for high-w individuals, avg-w is negative, so loss has positive moral value. 

  In status quo, avg=4.67. C's w=9, so avg-w=4.67-9=-4.33. If C loses 4 units, moral value = (-4.33) * (-4) wait no—the loss is Δx = -4. But weight is (avg - w), which is negative. Moral value = weight * Δx = (avg - w) * Δx. For loss, Δx negative. So (negative) * (negative) = positive. So (4.67 - 9) * (-4) = (-4.33)*(-4) ≈ +17.33. And no changes to others, so total moral value ≈ +17.33. Versus alternative where no change, value 0. So yes, relative prioritarianism says leveling down is better. 

  This works. The function must be specified so that losses to those above average can have positive value. 

  In the response, I need to clearly lay out the case, the welfare numbers, and then the evaluations step by step. Point out that for ordinary prioritarianism, any concave function will show a decrease because sum of concave functions decreases when one input decreases (Jensen's inequality). 

  Also note limitations: this doesn't affect standard prioritarianism, only the relative version. And defenders might tweak the weighting function to avoid this implication, or accept it as pro tanto good.
answer: |-
  Here’s a concrete case designed for your argument, meeting all requirements. I’ll present the case, then systematically walk through the evaluations, and finally analyze the implications.

  ### The Case: Hospice Pain Management
  St. Margaret’s Hospice has three terminally ill patients in adjacent rooms, each experiencing chronic pain. Their pain levels (on a cardinal, interpersonally comparable scale where 0 = no pain, 10 = severe agony) and corresponding welfare levels (where higher welfare = less pain, so welfare = 10 - pain) are fixed and unchangeable except for one intervention:
  - **Patient A**: Severe neuropathic pain (Pain: 10, Welfare: 0)
  - **Patient B**: Moderate bone pain (Pain: 5, Welfare: 5)
  - **Patient C**: Mild discomfort (Pain: 1, Welfare: 9)  
  *Status Quo Welfare Distribution*: (0, 5, 9) | Average = (0+5+9)/3 = 14/3 ≈ 4.67  

  A nurse can *purely level down*: administer a placebo to C that has no physiological effect but psychologically exacerbates C’s discomfort due to missed expectation, lowering C’s welfare from 9 to 5 (Pain: 1 → 5, Welfare: 9 → 5). No one else is affected: A remains at 0, B at 5. No resources are saved; no one observes or infers the change; no attitudes or comparisons shift.  
  *Leveled-Down Welfare Distribution*: (0, 5, 5) | Average = (0+5+5)/3 = 10/3 ≈ 3.33  

  ---

  ### Evaluations of Status Quo (0,5,9) vs. Leveled-Down (0,5,5)
  Assume welfare is cardinal and comparable. Let *u* denote individual welfare.

  **(a) Total Utilitarianism**  
  - **Status Quo**: Total welfare = 0 + 5 + 9 = **14**  
  - **Leveled-Down**: Total welfare = 0 + 5 + 5 = **10**  
  → *Verdict*: Leveling down is **worse** (14 > 10). Pure loss.

  **(b) Ordinary Prioritarianism (Fixed Concave Weights)**  
  - *Weighting function*: Let φ(u) be strictly concave (e.g., φ(u) = √u, φ(u) = ln(u+1)). Priority weights are fixed and absolute, not relative.  
  - **Status Quo**: φ(0) + φ(5) + φ(9)  
  - **Leveled-Down**: φ(0) + φ(5) + φ(5)  
  Since φ is strictly concave, φ(9) > φ(5) [because φ'(u) > 0 and φ''(u) < 0]. Thus:  
  φ(0) + φ(5) + φ(9) **>** φ(0) + φ(5) + φ(5)  
  → *Verdict*: Leveling down is **worse** regardless of the choice of strictly concave φ.  
  - *Why?* Concavity implies diminishing marginal moral value. Reducing a higher welfare (9→5) loses more moral value (φ(9) - φ(5)) than any possible gain from giving that benefit to a worse-off person could compensate—but here there *is* no compensating gain. The sum of concave functions decreases when any single input decreases.

  **(c) Telic Egalitarian**  
  - Values equality intrinsically. Use a standard function: Total welfare minus an inequality penalty.  
  - *Inequality measure*: Variance or sum of squared deviations.  
  - **Status Quo**: Welfare: (0,5,9)  
  Variance = [(0-4.67)² + (5-4.67)² + (9-4.67)²]/3 ≈ (21.81 + 0.11 + 18.75)/3 ≈ 13.56  
  - **Leveled-Down**: Welfare: (0,5,5)  
  Variance = [(0-3.33)² + (5-3.33)² + (5-3.33)²]/3 ≈ (11.09 + 2.79 + 2.79)/3 ≈ 5.56  
  → Equality improves (variance ↓). But total welfare ↓ (14 → 10).  
  → *Verdict*: **Ambivalent pro tanto**. Leveling down has a good feature (less inequality) but is bad all things considered due to the welfare loss. (Most telic egalitarians would call it *all-things-considered worse*).

  **(d) Relative Prioritarianism**  
  - *Weighting rule*: Moral value of a welfare change for person *i* is weighted by how far *i* is below the average.  
  Define weight for *i* as: **w_i = (avg - u_i)** (negative if u_i > avg).  
  Moral value of a change Δu_i is: **MV_i = w_i · Δu_i = (avg - u_i) · Δu_i**.  
  - **Status Quo (avg ≈ 4.67)**:  
    - C’s welfare = 9 > avg → w_C ≈ 4.67 - 9 = **-4.33**  
  - **Leveled-Down Change**: Δu_C = -4 (welfare loss for C).  
    MV_C = w_C · Δu_C = (-4.33) · (-4) = **+17.32** (positive!)  
    A and B unchanged: MV_A = MV_B = 0.  
    **Total ΔMV = +17.32**  
  - *Verdict*: Leveling down is **pro tanto good** (positive moral value generated).  

  ---

  ### Key Features and Implications
  1. **What’s Doing the Work**:  
     - **Relativity + Directional Sensitivity**: Losses to those *above average* have negative weights (w_i < 0). Multiplying by a negative welfare change (Δu_i < 0) yields a *positive* moral value. The further above average, the larger |w_i|, amplifying this effect.  
     - **Trigger Condition**: C is far above average (9 > 4.67), and the loss is pure.  

  2. **If Feature Removed**:  
     - If weights depend *only* on absolute welfare (fixed concave φ), leveling down is always bad → collapses to (b).  
     - If weights ignore direction (e.g., always |avg - u_i|), MV_C would be negative → no leveling-down approval.  
     - If no one is above average (e.g., distribute (0,5,5) initially), leveling down loses its rationale.  

  3. **Defender’s Replies**:  
     - **Bite the Bullet**: "Yes, reducing *unfair advantage* (being far above avg) has pro tanto moral value, even with no gain. This reflects the intuition that undeserved privilege is inherently objectionable."  
     - **Temkin-Style Pro Tanto**: "Leveling down is *pro tanto good* (it reduces comparative deprivation) but *all-things-considered bad* here because C’s loss outweighs the relational improvement. We need an additional constraint against absolute losses."  
     - **Adjust the View**: Restrict weights to apply only to welfare *gains*, or cap negative weights to avoid positive MV for losses.  

  4. **Limitations**:  
     - **Does not target ordinary prioritarianism (b)**: Its verdict is robustly anti-leveling-down.  
     - **Assumes additive separability**: If relative weights depend on post-change averages, calculations get dynamic; but the pro tanto temptation remains.  
     - **Motivational asymmetry**: The case exploits how losses to the advantaged are treated, but comparative deprivation typically focuses on gains to the worse-off. A defender might argue weights should differ for gains/losses.  

  ### Why This Case Works
  - **Pure Leveling-Down**: C’s loss (9→5) benefits no one; no hidden goods.  
  - **Realism**: Placebo effects in pain management are well-documented; no sci-fi mechanics.  
  - **Arithmetic Simplicity**: Averages and changes are intuitive (14/3≈4.67 → 10/3≈3.33; Δu_C=-4).  
  - **Critical Asymmetry**: Relative prioritarianism’s approval hinges on the *sign reversal* for losses above average—a feature absent in other views.  

  This shows that relative prioritarianism, despite its prioritarian motivation, can endorse leveling-down in a way fixed-weight prioritarianism cannot—undercutting the standard narrative. Its vulnerability stems from relativizing weights to a shifting average, creating moral spillover effects from purely destructive acts.
