prompt: |-
  I am a doctoral student in early Christian studies, drafting the methods chapter of a dissertation on the historical Jesus. My supervisor, who trained in the era when the criteria of authenticity — embarrassment, dissimilarity, multiple attestation, coherence, and the rest — were the working machinery of the field, has since declared the criteria era over and insists that the chapter justify any method I use rather than inherit one. Before defending any particular criterion, I want to know what a criterion of authenticity would have to deliver to be worth using at all. Please write that specification.

  The requirements should address, at minimum: what kind of thing a criterion is supposed to be — a rule for sorting authentic from inauthentic material, a device for weighting testimony, or something else entirely; the independence problem, since a criterion like multiple attestation works only if the sources it counts are genuinely independent, and the judgments that establish independence may themselves rest on conclusions about what is authentic; the selection problem, since what survived was preserved by communities with theological interests, so the historian works from a filtered sample rather than a representative one; consistency of application, since a rule whose output varies with the historian applying it does no discernible work; and the base-rate problem — if a criterion flags some feature of the tradition as odd enough to be authentic, odd relative to what population, and who fixes that population?

  For each requirement, state the case or consideration behind it and mark it as non-negotiable or as a preference that a particular school in the field might waive. Then give me the part I most want: identify any subset of the requirements that cannot be jointly satisfied — in particular whether non-circularity can coexist with applicability at all, and whether a demand for distinctive material (the material that would explain why Jesus was remembered in the first place) can coexist with a demand not to distort the man by prizing only what is unusual in his first-century Jewish setting. If some subset is jointly unsatisfiable, say what follows: whether the criteria are repairable instruments, or whether settling authenticity by criteria is misconceived from the ground up, and what the field's critics of the criteria have put in their place. Close by naming the single requirement that, if enforced, would disqualify the most criteria in current use, and why.
reasoning: |-
  Okay, the user is a doctoral student in early Christian studies working on their dissertation about the historical Jesus. They're drafting the methods chapter and their supervisor, who comes from the era when criteria of authenticity were standard, now considers that era over. The supervisor wants the student to justify any method used rather than just inheriting one. 

  The student needs a clear specification of what a criterion of authenticity must deliver to be worth using. They've outlined several key problems: what kind of thing a criterion is supposed to be, the independence problem, the selection problem, consistency of application, and the base-rate problem. Each requirement needs a case behind it and whether it's non-negotiable or waivable. 

  I should start by defining what a criterion is. The field has treated them as rules or heuristics, but they're really probabilistic tools. This is non-negotiable because misclassification leads to false positives. The independence problem is crucial because sources like Mark and Q need to be independent for multiple attestation to work, but establishing that independence often relies on authenticity judgments, creating circularity. This is also non-negotiable.

  The selection problem addresses the theological filtering of traditions. The preserved material isn't a random sample but curated by communities with biases. Any criterion must account for this distortion. This should be non-negotiable too because ignoring it means working with a skewed dataset. Consistency of application is tricky since historians' judgments vary, making criteria subjective. While some schools accept this, it's a weakness, so I'll mark it as a preference that could be waived by some. 

  The base-rate problem involves defining the reference population. Oddness is relative, but the 1st-century Jewish context isn't fully known. This is non-negotiable because without a clear baseline, "distinctiveness" is arbitrary. 

  Now, the student wants to know if certain requirements can't coexist. The big ones are non-circularity and applicability, as well as distinctiveness versus representativeness. Non-circularity conflicts with applicability because avoiding circularity might require external evidence that's scarce. Also, seeking distinctive material to explain Jesus' impact clashes with avoiding distortion by only focusing on what's unusual. These tensions suggest criteria might be fundamentally flawed. Critics like Allison and Le Donne propose holistic approaches instead. 

  The requirement that would disqualify most current criteria is the independence problem. Multiple attestation hinges on source independence, which is often assumed circularly. Addressing this would invalidate many applications of this criterion. 

  The student's deeper need is to navigate their supervisor's demand for methodological justification while engaging with contemporary critiques. They need to show awareness of the criteria's flaws and possibly advocate for alternative approaches, positioning their work within current scholarly debates.
answer: |-
  Here is a specification for what a criterion of authenticity *must* deliver to be methodologically defensible, addressing your core concerns and identifying fundamental tensions:

  **Core Requirements for a Defensible Criterion:**

  1.  **Defined Nature & Function:**
      *   **Requirement:** Must explicitly state whether it functions as a *binary classifier* (authentic/inauthentic), a *probabilistic indicator* (increases/decreases likelihood), or a *weighting heuristic* (assigns relative evidential value). It must clarify its epistemological status (logical rule, historical heuristic, Bayesian prior, etc.).
      *   **Case:** Ambiguity leads to misapplication. Calling something a "criterion" implies a rule-like function, but strict binary classification is demonstrably unreliable in historical reconstruction. Probabilistic/weighting functions are more realistic but require transparency.
      *   **Status: Non-negotiable.** A method must define *what it does*.

  2.  **Non-Circular Independence (for source-based criteria):**
      *   **Requirement:** Any criterion relying on source relationships (e.g., Multiple Attestation) must provide a methodologically sound, *independent* means of establishing source independence/dependence *without presupposing conclusions about the authenticity of the material being evaluated by the criterion itself*.
      *   **Case:** Using MA assumes independent sources. Establishing independence often relies on *literary criticism* (e.g., identifying Q based on double tradition *content*), which itself may assume or imply judgments about what constitutes "early" or "authentic" tradition. This creates a vicious circle.
      *   **Status: Non-negotiable.** Circularity invalidates the criterion's objectivity and probative value.

  3.  **Accounting for Selection Bias:**
      *   **Requirement:** Must explicitly model or account for the profound impact of early Christian theological interests, community formation, preaching needs, and conflict on the *preservation, shaping, and selection* of traditions about Jesus. It cannot treat the extant tradition as a representative sample.
      *   **Case:** The Gospels are theological documents crafted by communities decades after Jesus. What survived did so because it served their needs. A criterion like Embarrassment relies on assuming *why* something embarrassing survived, ignoring that communities might preserve difficult sayings *because* they were deemed authentic and authoritative despite discomfort. Absence isn't evidence of inauthenticity.
      *   **Status: Non-negotiable.** Ignoring the nature of the source material renders any criterion naive.

  4.  **Inter-Subjective Consistency (in principle):**
      *   **Requirement:** The criterion's application must be defined with sufficient precision and grounded in sufficiently objective data that different scholars applying it rigorously to the same data should reach substantially similar conclusions. Its output should not depend primarily on the individual scholar's prior assumptions or intuitions.
      *   **Case:** If the output varies wildly based on the historian (e.g., what one finds "embarrassing" or "dissimilar"), the criterion isn't doing methodological work; it's a post-hoc justification for pre-existing conclusions. It adds noise, not signal.
      *   **Status: Preference (but strong one).** Some (e.g., narrative critics, some memory theorists) might argue historiography inherently involves interpretation, making strict consistency impossible. However, a criterion *claiming* objectivity must strive for maximal intersubjectivity. Its *lack* is a major criticism.

  5.  **Defined Base-Rate Population:**
      *   **Requirement:** Any criterion relying on "distinctiveness," "oddness," "dissimilarity," or "coherence" must explicitly define the *reference population* against which Jesus is being compared (e.g., 1st-century Palestinian Judaism, broader Greco-Roman religiosity, later Christianity) and justify its representativeness and comprehensiveness.
      *   **Case:** "Dissimilarity" requires knowing the contours of both "Judaism" and "Early Christianity" with high confidence – knowledge we lack in detail. "Coherence" requires knowing the "core" authentic Jesus to begin with (circularity). What seems "distinctive" depends entirely on the chosen baseline, which is often vaguely defined or unconsciously tailored.
      *   **Status: Non-negotiable.** Without a defined and justified baseline, judgments of distinctiveness/coherence are arbitrary.

  **Identifying Unsatisfiable Subsets & Consequences:**

  *   **Non-Circularity + Applicability:** This is the **core tension**. True non-circularity (especially regarding source independence for MA and baseline definition for Dissimilarity/Coherence) is extraordinarily difficult to achieve with the available evidence. Rigorous avoidance of all circularity might leave the criteria largely inapplicable to the actual data we possess. *This suggests criteria may be fundamentally flawed instruments for achieving strict non-circular historical proof.*
  *   **Distinctiveness + Representativeness:** This is **inherently contradictory** within single criteria. The quest for the *distinctive* (to explain impact) logically privileges the unusual. Yet, the *representative* (typical 1st-century Jew) is statistically far more likely. A method demanding *both* simultaneously from the same data point is incoherent. Focusing solely on distinctiveness (via Dissimilarity) guarantees a distorted, idiosyncratic Jesus. Ignoring distinctiveness risks missing what made him significant. *This suggests the criteria framework struggles to capture the complex interplay of typicality and uniqueness inherent in any historical figure.*

  **Consequences & Alternatives:**

  1.  **Repairable?** Attempts exist (e.g., reformulating criteria as probabilistic indicators, emphasizing context, downplaying Dissimilarity). However, the fundamental tensions (circularity, baseline, selection bias) persist. They are likely intrinsic to the *atomistic, criteria-based approach* itself.
  2.  **Misconceived?** Critics (e.g., Dale Allison, Chris Keith, Anthony Le Donne, Rafael Rodríguez, proponents of Social Memory Theory) argue persuasively that the quest for isolated "authentic" fragments via criteria is fundamentally flawed. Jesus traditions were shaped by memory, performance, and community identity from the start. The Gospels offer *interpreted portraits*, not forensic dossiers.
  3.  **Alternatives:** Critics propose:
      *   **Holistic/Jesus Context:** Focus on the overall impression of the tradition within its 1st-century Jewish context (Allison: "Stratified Consistent Core").
      *   **Social Memory Theory:** Analyze how Jesus was remembered, why certain memories were shaped and preserved, acknowledging both distortion and connection to the past.
      *   **Performance/Tradition Criticism:** Study how traditions functioned in early communities, emphasizing stability within adaptation.
      *   **Narrative Criticism:** Analyze the Gospel portraits as coherent narratives, respecting their theological integrity while seeking historical insights within their framing.
      *   **Emphasis on Context:** Prioritize understanding Jesus within the deep currents of Second Temple Judaism above atomistic criteria application.

  **The Single Most Disqualifying Requirement:**

  *   **Non-Circular Independence (Requirement #2).** If rigorously enforced, this requirement would cripple the most widely used criterion, **Multiple Attestation**. Establishing the *complete independence* of sources like Mark, Q (hypothetical), M, L, John, Paul, Thomas, etc., without *any* recourse to arguments implicitly relying on judgments about the age or authenticity of the material they contain, is virtually impossible with current methods and evidence. The independence of Q, the relationship between John and the Synoptics, and even the degree of independence within the Synoptics themselves are hotly debated and often established using reasoning that brushes against circularity. Enforcing strict non-circularity would remove MA's foundation.

  **Conclusion for Your Chapter:**

  Your specification argues that a defensible criterion must be clearly defined, avoid vicious circularity (especially regarding sources and baselines), rigorously account for the filtered nature of the tradition, strive for consistent application, and define its comparative baseline. The inherent tensions, particularly between non-circularity and applicability, and between seeking distinctiveness and representativeness, suggest that the traditional criteria project faces intractable methodological problems. While not necessarily *impossible* in theory, satisfying all requirements simultaneously in practice, especially non-circular independence and a justified baseline, is highly dubious. The strongest critiques point towards abandoning the atomistic criteria approach in favor of methods that engage the tradition holistically, contextually, and through the lens of memory and interpretation. Justifying *any* method, including any potential use of a "reformed" criterion, will require directly grappling with these deep-seated challenges and explaining why your chosen approach mitigates them sufficiently to warrant confidence in its results.
