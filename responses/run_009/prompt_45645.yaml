prompt: |-
  Here's a puzzle from my day job that I suspect is really about the philosophy of language, though I don't know the literature. In software engineering there is a paired norm that I've never seen anyone defend explicitly. On one side: when a library changes some behavior and downstream code breaks, maintainers say that the documentation never promised that behavior, that the users were relying on an implementation detail, and the community largely accepts this — whatever a system does but does not document is treated as no part of the commitment. On the other side: the very same maintainers name their functions suggestively, choose default settings to signal intent, write READMEs whose tone is meant to convey that this is a project that cares about stability, and expect readers to pick up all of this; and a changelog entry that is literally accurate but phrased so that readers come away with the wrong impression gets called out as dishonest. There is even a maxim going around our field to the effect that, given enough users, every observable behavior of a system will be depended on by somebody, no matter what the documentation promises — stated, notably, as a fact about communication rather than as a failure of the users. What I want to know is what view of communication this pair of norms presupposes. Is a documentation page like a contract, where only what is explicitly stated counts, or is it like ordinary speech, where a speaker means what their audience can reasonably be expected to work out from what they say plus context? Can the two norms be held together coherently, or does the "not documented means not promised" rule only function by quietly counting on users to draw inferences that the maintainers then disclaim when the inferences turn out badly? Please reconstruct the implicit theory, distinguish what the practice strictly requires from what it merely fits well with, and tell me what would actually have to change — in how we document, version, and assign blame — if we decided the inference-based view was the right one all along.
reasoning: |-
  Okay, the user presents a fascinating puzzle from software engineering that touches on philosophy of language. They've noticed a contradiction in norms: maintainers insist undocumented behavior isn't promised, yet simultaneously rely on contextual cues (names, defaults, tone) to communicate stability. The user wants to understand the implicit communication theory behind this and whether it's coherent.

  Hmm... this feels like Gricean pragmatics vs. legalistic literalism. The user is essentially asking whether software documentation is more like a contract (explicit terms only) or conversation (implied meaning). That "undocumented behavior" defense seems strictly contractual, but all those suggestive function names and README tones are pure Gricean implicature.

  The maxim they mention about users depending on observable behaviors reveals the tension. If communication were truly only literal, why would maintainers feel guilty about breaking undocumented features? Why bother with tone in READMEs at all? 

  I should probably structure this around three layers: what's strictly required (explicit docs), what's practically relied upon (contextual inferences), and what gets disclaimed. The key insight is that maintainers want it both ways - they exploit pragmatics for persuasion while retreating to literalism for protection.

  For the reconstruction part, Austin's speech act theory fits perfectly. Naming a function "stable_processor()" isn't just labeling - it's a performative act creating expectations. And when maintainers write "we care about stability" in READMEs, that's practically an illocutionary act of promising. 

  The coherence question is thorny. Can they hold both norms? Only through what I'd call "licensed hypocrisy" - relying on inferences while reserving the right to deny them. If we switched fully to inference-based views, versioning would need radical changes: maybe "expectation impact" assessments alongside changelogs, and blame assignment based on whether a reasonable user would infer stability.

  User seems sophisticated - probably a senior dev or tech lead frustrated by this industry double-speak. Their hidden need might be for ammunition to advocate for more honest communication practices in their org. I should give them concrete "what would change" points they can use.
answer: |-
  Your puzzle cuts to the heart of a profound tension in software communication. The implicit theory here is a **hybrid model with strategic ambiguity**: a contractual view of *explicit documentation* paired with an inferential view of *meta-communication* (project tone, naming, defaults). This isn't coherent philosophy—it's pragmatic double-entry bookkeeping. Let's dissect it:

  ### The Implicit Theory: Contractual Literalism for Deniability, Inferentialism for Trust-Building
  1. **Documentation as Strict Contract**  
     - *What's required:* Only verbatim statements create binding obligations.  
     - *What's disclaimed:* All inferences from behavior, naming, or structure are "implementation details."  
     - *Philosophical anchor:* Positivist semantics (meaning resides solely in explicit declarations).

  2. **Meta-Communication as Inferential Signal**  
     - *What's relied upon:* Naming ("getStableList()"), defaults (--safe_mode=true), README tone ("production-ready"), and changelog phrasing implicitly signal stability.  
     - *Philosophical anchor:* Gricean pragmatics (meaning derived from context, speaker intent, and cooperative principles).

  3. **The Contradiction Resolved (Badly)**  
     Maintainers exploit **asymmetric deniability**:  
     - They *intend* users to infer reliability from contextual cues (reducing adoption friction).  
     - They *deny* responsibility when inferences fail ("not documented!").  
     - The unspoken norm: **Users may infer—but not rely—on implications.**

  ### Why This "Works" (For Maintainers)
  - **Blame-shifting:** When breakage occurs, "undocumented!" absolves maintainers.  
  - **Trust-harvesting:** Suggestive names/tone attract users without commitment.  
  - **The Cop-Out:** That maxim—"every observable behavior will be depended on"—frames over-reliance as *user* failure, not communication breakdown.

  ---

  ### Reconstructing an Inference-Based Alternative  
  If we treated documentation like ordinary speech (Gricean pragmatics), where meaning includes what's reasonably inferable:

  **Core Principle:**  
  *A maintainer commits not only to literal promises, but to what a competent user would reasonably infer from the totality of communication (docs, names, examples, defaults, tone).*

  **What Would Change:**  
  | Current Practice          | Inference-Based Alternative               |  
  |---------------------------|------------------------------------------|  
  | "Not documented → Not promised" | "Reasonably inferable → Promised"        |  
  | Breaking undocumented behavior | Major version bump required              |  
  | Changelog literalism      | Changelog assesses *inferential impact*  |  
  | Blame assigned to users   | Blame shared by communicator/inferrer    |  
  | Defaults as "just impl"   | Defaults as strong stability signals     |  

  **Concrete Shifts:**  
  1. **Documentation:**  
     - Exhaustive lists of *what's not stable* (e.g., "Parameters prefixed with `_internal` may change")  
     - "Inference guides" explaining naming conventions (e.g., "Functions starting with `unsafe_` may mutate state")  

  2. **Versioning:**  
     - Semantic versioning based on *expectation impact*, not literal contracts.  
     - Breaking reasonable inferences → `MAJOR` version bump (even if "undocumented").  

  3. **Blame Assignment:**  
     - **Maintainer fault** if breaking changes affect:  
       - Default behaviors  
       - Functionality implied by naming/tone  
       - Patterns in official examples  
     - **User fault** only for relying on:  
       - Undocumented edge cases with clear warning signs (e.g., "This API is experimental")  
       - Behaviors contradicting explicit docs  

  4. **Changelogs:**  
     - Required "inference impact statements" (e.g., "While not documented, many users relied on X. We consider this a breaking change.")  

  ---

  ### Can These Norms Coexist?  
  **Only through bad faith.** The current practice relies on a **deliberate implicature-denial gap**:  
  - Maintainers *implicate* stability through tone/naming (inviting inference)  
  - But *deny* those implicatures when inconvenient (retreating to literalism)  

  This is **linguistic rent-seeking**: extracting trust via pragmatic inference while avoiding accountability. It functions precisely because users *must* infer to use libraries effectively—yet maintainers disclaim those inferences.  

  ### The Way Forward  
  To resolve this coherently:  
  - **Adopt inference-aware documentation:** "This name suggests X, but note Y limits."  
  - **Institutionalize inference logs:** Track where users *actually* rely on undocumented behavior.  
  - **Embrace communicative ethics:** If a behavior is observable and useful, document its volatility or stabilize it.  

  The philosopher you need is **Paul Grice**, not Carl Schmitt. Maxim breaks ("undocumented but depended on") aren't user failures—they're *communicative* failures. Treating documentation as speech acts (promises, warnings, invitations) rather than legal contracts would align practice with the inferential reality your field already acknowledges.
