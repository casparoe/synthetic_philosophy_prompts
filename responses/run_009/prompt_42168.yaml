prompt: |-
  I've gotten drafted onto my university's building-services data committee — I'm the token philosopher, since our library is getting an energy retrofit and apparently someone thought that made me qualified. Anyway, the proposal on Thursday's docket: facilities wants occupancy sensors throughout the main library and in a small 24-hour graduate annex, sampling every ten minutes, to tune the HVAC. Their pitch leans hard on "it's just anonymous numbers, like a thermostat" — no cameras, no IDs, nothing ever attached to a person, just counts per zone. The grad students' union has objected (politely, but twice now) that the annex holds maybe thirty people on a good night, so some zones will sometimes contain exactly one person, and a time series of "one occupant in carrel row 3 at 3am, every night this week" is just a description of somebody's life even if no name is ever stored. Facilities calls this paranoid: if the data can't be linked to a name, no privacy interest is even implicated — the "nothing to hide" point, or possibly the "no identification, no privacy" point. They use the two interchangably in their memo and I'm honestly not sure they're the same claim.

  Could you draft the written opinion I'll circulate before the meeting? Take a concrete position — approve, reject, or approve with conditions, and if conditions, name them (coarser zones, minimum occupancy thresholds before a reading is logged, retention limits, whatever you actually think follows). Don't just restate the law or the definition of personally identifiable information; the committee has lawyers for that and they already wrote two pages of it. Engage the union's strongest version of the worry — roughly, that identifiability isn't a property of the data alone but of the data plus whoever ends up looking at it, and that habitual patterns can function as signatures even when the raw counts look innocuous — and also give an honest treatment of the strongest consideration on the losing side: for most rooms most of the time, an occupancy count may really be as anonymous as a thermostat reading, the energy savings are real, and the committee has a carbon reduction target we're supposed to be helping with, not just a privacy charter.

  Wherever you come down, I want you to say which principle about the value of privacy is actually doing the work in the recommendation — control over information about oneself, the interest in not being watched, something about information flowing into contexts it wasn't gathered for — rather than hiding behind "on balance" language in the final paragraph. One practical constraint worth keeping in mind: we can push the vendor to change how the system is configured (resolution, aggregation, what gets logged), but we can't realistically walk away from occupancy sensing altogether, so the memo's recommendation has to be something facilities could actually implement.
reasoning: |-
  Okay, the user is part of a university committee dealing with installing occupancy sensors in the library for HVAC tuning. They're a philosopher, so they need a written opinion that's not just legal jargon but engages with ethical principles. The grad students' union is worried about privacy, especially in the annex where small numbers could identify individuals. Facilities argues that since no names are stored, there's no privacy issue. The user wants a concrete recommendation—approve, reject, or with conditions—and to explicitly state the privacy principle at stake.

  First, I need to unpack the core conflict. The union's strongest argument is that even without names, patterns of occupancy in small zones can act as unique identifiers. For example, if one person is regularly in a specific carrel at 3 AM, that's de facto identifiable. This ties into the idea that identifiability isn't just about data fields but about context and who can access the data. 

  On the other side, facilities has valid points: energy savings are real, carbon targets matter, and for larger spaces, the data is truly anonymous. The committee can't scrap the system entirely, so the solution needs to be implementable—like adjusting sensor resolution or data retention.

  The user wants the opinion to name the underlying privacy principle. Possible principles include control over personal information, the right to not be monitored, or contextual integrity (info not flowing beyond its original purpose). Contextual integrity seems key here because the data collected for HVAC could be misused if accessed by others, like security or administrators, leading to function creep.

  Also, the user mentioned that facilities conflates "nothing to hide" and "no identification, no privacy." These are distinct. "Nothing to hide" assumes privacy is only for hiding wrongdoing, while "no identification" argues that without names, there's no privacy issue. The latter is more relevant, so addressing identifiability through inference is crucial.

  Practical solutions: Coarser zoning in the annex to avoid single-occupancy readings, dynamic minimum thresholds so data isn't logged if below a certain number, and strict retention policies. Anonymization techniques like adding noise might help but could affect HVAC efficiency. Governance is vital—limiting access and auditing to prevent misuse.

  The recommendation should approve with conditions. The privacy principle doing the work is contextual integrity—ensuring data stays within its intended context (HVAC optimization) and isn't repurposed. Emphasizing governance and transparency can address both privacy and practical concerns. Need to balance energy goals with ethical privacy considerations without using "on balance" language. Highlighting that even anonymized data can reveal personal habits if contextual factors allow identification.
answer: |-
  ## Committee Opinion: Occupancy Sensing for Library HVAC Optimization

  **Author:** [Your Name], Philosophy Department  
  **Subject:** Recommendation for Occupancy Sensor Proposal (Main Library & Graduate Annex)  
  **Date:** October 26, 2023  

  **1. Recommendation:**  
  **Approve the installation of occupancy sensors for HVAC tuning, but only with the following mandatory conditions:**  
      *   **A. Annex Zoning Revision:** Sensor zones within the 24-hour graduate annex must be significantly coarsened to ensure that **no zone consistently reports occupancy of one (1) or two (2) persons during typical low-occupancy periods (e.g., overnight).** The target should be zones where a "1" reading is statistically rare (e.g., minimum expected occupancy ≥ 3 during quiet hours).  
      *   **B. Minimum Occupancy Threshold Logging:** Implement system-wide (Main Library & Annex) a **minimum occupancy threshold before logging or using data for HVAC control.** Data points below this threshold (e.g., 0, 1, or 2 occupants, depending on final zone sizing) should be treated as "unoccupied" for HVAC purposes *and not recorded in the persistent time-series dataset*.  
      *   **C. Strict Data Retention Policy:** All logged occupancy data (counts only) must be automatically purged after **no more than 30 days.**  
      *   **D. Governance & Access Protocol:** Establish a formal committee-approved policy governing data access. Access to the *raw time-series logs* (as opposed to aggregated reports for HVAC performance) must be restricted solely to personnel directly responsible for HVAC system tuning and maintenance, with access logged and auditable. Explicitly prohibit use by security, administration, or other departments.  

  **2. Engaging the Core Ethical Conflict:**  

  The Graduate Student Union raises a profound and valid concern that Facilities dismisses too readily. Their core argument – that **identifiability is not an inherent property of data, but a function of data *in context*** – is ethically sound and empirically demonstrable. Facilities' conflation of "nothing to hide" (which implies privacy is only about concealing wrongdoing) with "no identification, no privacy" (which focuses solely on direct linkage to a name or ID) misses the ethical nuance. The latter claim, while simpler, is fundamentally flawed in this scenario.  

  *   **The Union's Strongest Case:** In the intimate context of the annex, especially overnight, granular occupancy data (e.g., "Carrel Row 3: 1 occupant @ 3:00 AM") ceases to be merely an "anonymous number." When a zone consistently contains only one person at predictable times, the *pattern itself becomes a unique signature*. It describes a specific individual's habitual presence, even without a name attached. This constitutes **observational identification**. Knowledge of this pattern ("The 3 AM Carrel Row 3 Scholar") can exist within the small community using the annex. While the *system* doesn't store an ID, the *information* generated is sufficiently specific to describe an identifiable individual's behavior within that context. This creates a tangible privacy interest.  

  *   **Facilities' Strongest Case:** Facilities is correct that for larger spaces (like most of the Main Library) and higher occupancy levels, aggregate counts *are* functionally anonymous and pose negligible privacy risk – akin to a thermostat reading. The energy savings potential is significant and aligns with our institution's carbon reduction imperative. Occupancy-based HVAC tuning is a proven, responsible approach to reducing waste. Abandoning this technology entirely would be environmentally irresponsible and counter to the committee's mandate.  

  **3. The Privacy Principle at Work: Contextual Integrity**  

  The decisive ethical principle here is **Contextual Integrity** (Helen Nissenbaum). Privacy is violated not only when information is *identified* or *sensitive*, but when information flows in ways that violate the norms of the context in which it was gathered.  

  *   **The Original Context:** Occupancy data is gathered for the specific, limited purpose of optimizing HVAC efficiency – an environmental and operational goal generally accepted within shared spaces like libraries.  
  *   **The Integrity Violation:** The risk arises when this finely-grained behavioral data (especially the unique patterns revealed in small zones) flows *beyond* this original context or is used in ways inconsistent with the norms of a study space. For example:  
      *   Could security infer "suspicious" late-night patterns?  
      *   Could administrators use it (even indirectly) to assess graduate student "productivity" based on hours logged?  
      *   Could the *knowledge itself* of being the sole, regularly tracked occupant in a specific zone at specific times alter a student's sense of autonomy or comfort in what should be a place of refuge and focus?  
      *   Could a data breach or future policy change expose these patterns?  
  Granular data creates a record of presence that is fundamentally *about individuals* in the annex context, even if not named. Using it *only* for HVAC requires strict technical and governance controls to maintain contextual integrity. Without these, the flow of information violates the reasonable expectation of how presence in a study carrel is monitored and used.

  **4. Why These Conditions Address the Core Concerns:**  

  *   **Coarse Annex Zoning (A) & Minimum Threshold (B):** Directly address the observational identification risk. By ensuring readings of "1" are rare or non-persistent and preventing logging of very low counts, we eliminate the creation of granular behavioral signatures for individuals in the sensitive annex context. Data used for HVAC becomes truly aggregate.  
  *   **Short Retention (C):** Minimizes the risk of historical pattern analysis, function creep (using old data for new purposes), or security breaches exposing sensitive patterns. HVAC tuning doesn't require long-term storage of granular occupancy logs.  
  *   **Strict Governance (D):** Enforces Contextual Integrity. By legally and technically restricting access and use solely to HVAC optimization, we prevent the information from flowing into inappropriate contexts (security, administration, research, etc.). Auditing ensures accountability.  

  **5. Implementation Feasibility:**  

  These conditions are technically feasible. Leading occupancy sensor vendors support configurable zoning, minimum occupancy thresholds for reporting/logging, automated data retention policies, and role-based access control. The cost impact should be minimal, primarily involving configuration changes. Facilities can achieve their energy-saving goals using the *aggregate* data these conditions will produce, especially in the Main Library and the now-protected Annex.  

  **6. Conclusion:**  

  The Graduate Student Union's concerns about de-identification through pattern recognition in intimate spaces are not paranoid; they reflect a sophisticated understanding of privacy in a data-rich world. Facilities' goals of energy efficiency and carbon reduction are vital and achievable. The path forward is not to abandon occupancy sensing, but to implement it with **ethical safeguards that enforce Contextual Integrity**.  

  We must recognize that privacy is not merely the absence of a name tag on data; it's about ensuring information flows appropriately within the context for which it was gathered. The conditions outlined above (Coarse Annex Zoning, Minimum Threshold Logging, Short Retention, Strict Governance) are necessary to align this potentially beneficial technology with our community's values and the principle of Contextual Integrity. By adopting them, we respect the legitimate privacy interests of our graduate students while enabling significant progress towards our shared sustainability goals.  

  **Recommendation:** Approve the occupancy sensor installation **contingent upon the immediate implementation of Conditions A, B, C, and D.**
