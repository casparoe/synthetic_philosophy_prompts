prompt: |-
  I'm a TA for a big intro ethics course and next week I have to run one fifty-minute section on Taurek's "should the numbers count" argument — the one where he asks whether five people in danger have a stronger claim on your help than one person, just because there are five. My section is mostly second-years, a lot of them pre-med, and they're going to walk in thinking this is trivial: it's triage, you save the five, anyone who hesitates is just bad at counting. We did trolley cases two weeks ago so their intuitions are already trolley-shaped. I don't want you to explain Taurek to me — I want a plan for the section itself.

  Here's what I want you to work out. First, the order: my instinct is that the separateness-of-persons idea — that there's no single big pot of "goodness" that suffering gets poured into, each person's loss is had by that person and nobody else — has to be on the table before the question even sounds like a question, but maybe it lands better coming out of the discussion instead of going into it, and I can't tell. Second, the carrying example: I'm tempted to use Taurek's own setup (the one person he cares about on one side, the five strangers on the other) but I worry it's too flat — students will just file it under "obviously you're allowed to save your friend" and miss the part where the argument is supposed to work even when it's five strangers vs. one stranger. Should I keep his case and fix the reading of it, or build a fresh one (my co-TA keeps pushing a hospital triage scenario, I worry it just re-imports the "save the five" answer by framing). Third, the misconceptions, and I'd like to be told the order students will actually hit them in: that Taurek is just saying friendship licenses partiality, that the coin flip is a general principle about lotteries so he'd be fine giving five people each a one-in-five chance instead of saving one for sure, that the whole thing is really about doing vs. allowing or about who's causally responsible for deaths, and that agreeing with Taurek commits you to saying numbers never matter in any tradeoff, even risk-vs-certainty ones in ordinary rescues.

  Also tell me exactly where in the sequence each of those needs to be headed off rather than just listed, one question I can end on that would show me whether they actually got the core claim (something about whether the view survives transplanting from the named-friend case to the stranger case, I think, but I'm not sure how to phrase it so it doesn't give away the answer), and what I should openly refuse to get into at this level — I'm guessing anything Kamm-flavored about procedures and chances, and definitely population ethics — so it doesn't eat the last fifteen minutes. If it matters, I've got a whiteboard and no slides.
