answer: |-
  Here is a specification of desiderata for an adequate theory addressing how numbers bear on rescue decisions, structured as requested. The focus is on articulating what the theory *must* do (or explain) to be considered viable, using your key cases as anchors, and critically examining potential tensions.

  ### Core Desiderata for a Theory of Rescue & Numbers

  1.  **The Canonical Asymmetry Case (1 vs. 5 Strangers):**
      *   **What it is for:** To establish the theory's core stance on the fundamental question: Does the number of lives saved *itself* provide a reason (or the decisive reason) to save the larger group when all else is equal (no special relationships, equal need, similar prospects, etc.)?
      *   **Non-Negotiable?** **Yes.** Any theory *must* provide a determinate answer (even if "flip a coin" or "no reason to prefer either") to this paradigmatic scenario. Failure to do so renders the theory practically inert for the central dilemma.
      *   **Verdict Requirement:** The theory must specify *who should be saved* and *why*, or explicitly state that there is *no reason* to prefer either group and specify the procedure for decision (e.g., coin flip).

  2.  **The Equal-Numbers Test (Save A or B, |A| = |B|):**
      *   **What it is for:** To diagnose whether the theory has genuine content *beyond* a simple "more is better" aggregative principle. Does it offer reasons for choosing *between* equally sized groups when no other distinguishing features exist?
      *   **Non-Negotiable?** **Conditionally.** A theory *must* provide either:
          *   (a) A reasoned basis for choice (e.g., impartial procedure like a coin flip, or a substantive reason like proximity, lesser suffering), demonstrating content beyond mere counting, OR
          *   (b) A clear explanation for why *no* reasoned basis exists *and* the implications for decision-making (e.g., coin flip mandatory, or rescuer may choose arbitrarily).
      *   **Prejudice Caveat:** Insisting the theory *must* provide a *substantive* reason beyond procedure (option a) leans towards anti-aggregative or strong individualist views. Insisting it *must not* (option b) leans towards strict aggregation or strong impartiality. The non-negotiable element is the *requirement to address the case meaningfully*.

  3.  **The Intra-Personal Consistency Check (One Person: 5 hrs pain vs. Five People: 1 hr each):**
      *   **What it is for:** To probe the theory's justification for allowing aggregation *within* a single life and test whether this justification can be coherently applied, blocked, or distinguished when lives are separate. It exposes potential inconsistencies in foundational values (e.g., minimizing total disutility vs. respecting separateness of persons).
      *   **Non-Negotiable?** **Yes.** The theory *must* explicitly account for the near-universal intuition that aggregating burdens/benefits *within* one life is permissible (and often obligatory). It must explain *why* this is allowed and crucially, *how this relates (or does not relate)* to aggregation *across* distinct persons in cases like the 1 vs. 5.
      *   **The Challenge:** The theory cannot simply assert "separateness of persons" blocks aggregation without explaining why separateness doesn't also block intra-personal aggregation (which it intuitively doesn't). Conversely, if it endorses intra-personal aggregation based on minimizing total bads, it must explain why this principle doesn't straightforwardly extend to inter-personal cases.

  4.  **The Personal Attachment Case (Loved One vs. 5 Strangers):**
      *   **What it is for:** To assess the theory's stance on agent-relative reasons (like partiality towards loved ones) versus agent-neutral reasons (like saving more lives). Can strong personal ties override numerical considerations? Does the theory accommodate, forbid, or require such partiality?
      *   **Non-Negotiable?** **No.** This is **highly contentious** and reflects a fundamental divide.
          *   *Anti-Partiality Camp:* Insists rescue decisions must be strictly impartial; saving the loved one over the five is wrong. A theory must condemn this or explain why impartiality reigns. (Non-negotiable *for this camp*).
          *   *Pro-Partiality Camp:* Argues special relationships generate strong, sometimes overriding, agent-relative duties. A theory must permit or even require saving the loved one. (Non-negotiable *for this camp*).
          *   *Moderate Views:* May allow some partiality but argue it has limits (e.g., not overriding saving *many* more lives). A theory must define the scope and weight of partiality.
      *   **Core Requirement:** The theory *must* take a clear position on the *permissibility* and *justificatory weight* of agent-relative reasons like personal attachment in rescue contexts involving numbers.

  5.  **The Face-to-Face Justification Requirement:**
      *   **What it is for:** To enforce a standard of interpersonal justification and respect for the individuals affected. Can the rescuer justify their decision *to the person(s) left to die* in a way that acknowledges their equal moral standing and does not treat them merely as a means or a statistic?
      *   **Non-Negotiable?** **Highly Plausible, but Contentious.** Many consider this a bedrock requirement of moral respect ("Each person matters, and matters equally"). A theory that cannot meet this risks being accused of alienation or disrespect. **However,** strict aggregators might argue that the justification ("Saving more lives is better overall") *is* sufficient and respectful to all, even if unwelcome to the one. Anti-aggregators often see this as *the* critical test their view passes and aggregation fails.
      *   **The Tension:** This requirement is central to critiques of aggregation (like Taurek's). If a theory holds "numbers must never by themselves settle who is saved" (e.g., Taurek's view), meeting this requirement is straightforward: "You lost a fair lottery, everyone had an equal chance." If a theory holds numbers *are* decisive (aggregation), the justification "I saved the five because five is more than one" is offered. Critics argue *this fails* the face-to-face test because it tells the one: "Your life wasn't worth as much as the sum of theirs; you were sacrificed for the greater number." Proponents argue it *passes*: it's an impartial reason anyone in the rescuer's position should act on, even if they were in the one's position. **The crux:** Does offering the *aggregate outcome* as justification inherently fail to respect the individual standing of the person who loses out? Many (including Taurek) argue yes, it reintroduces the fatal comparison via the back door by making the justification dependent on the *difference in numbers* being the reason for the sacrifice. The requirement *itself* does not *logically necessitate* rejecting aggregation, but it creates immense pressure to do so, as aggregation struggles to provide a justification the singled-out individual could *reasonably accept* from their perspective without feeling diminished.

  **Analysis of Joint Unsatisfiability:**

  *   The most significant tension lies between:
      *   **(A)** "Numbers must never by themselves settle who is saved" (implying a strong rejection of aggregation based solely on comparing sums).
      *   **(B)** "The theory must supply the rescuer with a justification that could be offered, face to face, to the party that dies" (interpreted as requiring a justification the *loser* could reasonably accept *as an equal* without feeling their value was discounted relative to others).
  *   **Why tension?** (A) rules out "I saved the five because five > one" as the *sufficient* justification. (B), interpreted robustly, demands a justification that doesn't reduce the loser's claim to being less than the sum of others' claims. A lottery-based justification ("You had an equal chance") satisfies both. However:
      *   If one tries to *modify* aggregation to satisfy (B) (e.g., "I must impartially maximize good, which anyone should endorse"), the loser can retort: "But why does that *impartial* good require *my* sacrifice? It still treats me as less important than the five *collectively*." The numbers remain the decisive, comparative factor.
      *   Conversely, satisfying (A) often leads naturally to lottery views satisfying (B). Attempts to find non-lottery, non-aggregative justifications for saving the larger group (e.g., "greater good" without aggregation) typically either collapse into aggregation or struggle to provide a compelling face-to-face reason distinct from the numbers themselves.
  *   **Conclusion:** While technically possible to hold both (A) and (B) with a lottery view, **it is extremely difficult (arguably impossible) to satisfy a robust interpretation of (B) while endorsing aggregation (the denial of A).** The face-to-face requirement, especially when demanding a justification the loser can accept *as an equal*, strongly pushes towards rejecting aggregation and embracing (A) via a lottery or similar individual-chance mechanism. **The back door:** If the justification offered for saving the larger group ultimately relies on the *fact* of the numerical difference being morally significant (which aggregation does), then the numbers *are* being used to settle who is saved, even if dressed in impartialist language, thus violating the spirit (if not the letter) of (A). (B) functions as a powerful constraint that makes purely aggregative responses to the 1 vs. 5 case look disrespectful, thereby pressuring acceptance of (A).

  ### Brief Application to Key Views (as requested)

  *   **Taurek's View (Equal Chance Lottery):**
      *   **1 vs. 5:** Saves the one with 1/6 probability, the five with 5/6. Numbers don't dictate *who* is saved, only the *chances*. **Des. 1:** Satisfied (determinate procedure). **Des. 5:** Satisfied robustly ("You had an equal chance").
      *   **Equal Numbers:** Coin flip (or similar). **Des. 2:** Satisfied (procedure).
      *   **Intra-Personal:** Presumably allows aggregation within one life (this isn't Taurek's focus, but rejecting it would be deeply counterintuitive). **Des. 3:** Satisfied, but potential tension: Why can burdens be aggregated *within* a life but not *across* lives? Taurek's "separateness of persons" needs to explain this distinction clearly.
      *   **Personal Attachment:** Implies strict impartiality is required; saving the loved one over five strangers is wrong (uses a 1/6 vs. 5/6 chance). **Des. 4:** Fails the Pro-Partiality camp's requirement.
  *   **Straightforward Aggregation (Save the Greater Number):**
      *   **1 vs. 5:** Save the five. **Des. 1:** Satisfied.
      *   **Equal Numbers:** No reason to prefer either (coin flip or arbitrary choice). **Des. 2:** Satisfied minimally (explains *why* no substantive reason).
      *   **Intra-Personal:** Naturally permits and requires minimizing total burden. **Des. 3:** Satisfied.
      *   **Personal Attachment:** Requires saving the five strangers; saving the loved one is wrong. **Des. 4:** Fails the Pro-Partiality camp. **Des. 5:** Major point of contention – critics argue it fails the robust interpretation ("Your life was worth less than the five together").
  *   **Lottery-Based (not strictly Taurek - e.g., weighted by group size):**
      *   **1 vs. 5:** Each *person* has equal chance (like Taurek) OR each *group* has chance proportional to size? (The latter is rare/odd). Usually aligns with Taurek.
      *   **Equal Numbers:** Coin flip. **Des. 2:** Satisfied.
      *   **Intra-Personal:** Same tension as Taurek.
      *   **Personal Attachment:** Usually requires impartial lottery, conflicting with partiality.
      *   **Note:** "Lottery" typically implies *individual* equal chance, satisfying Des. 5 well. A *group*-size-weighted lottery would struggle immensely with Des. 5 ("Why did my group's smaller size doom me?").

  **Summary:** A robust specification requires a theory to: **1)** Resolve the core 1 vs. 5 case determinately; **2)** Demonstrate content beyond "more is better" via the equal-numbers test; **3)** Coherently reconcile inter-personal aggregation prohibitions (if any) with intra-personal aggregation permissions; **4)** Take a clear stance on partiality; **5)** Provide a justification respectful to the loser. The most profound tension exists between rejecting aggregation based on numbers alone and providing a face-to-face justification that doesn't reintroduce comparative devaluation through the justification itself, strongly favoring lottery-based solutions over aggregation for satisfying both demands simultaneously under a robust interpretation of interpersonal respect.
