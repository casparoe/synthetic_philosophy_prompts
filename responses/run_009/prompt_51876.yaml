  I need to develop a clear set of desiderata that will help the user evaluate different ethical theories. For each requirement, I'll need to explain what it's for, indicate whether it's non-negotiable or reflects a particular camp's view, and importantly, explore whether any subset of these requirements might be incompatible with each other.

  The user is particularly interested in whether "numbers must never by themselves settle who is saved" is compatible with "the theory must supply the rescuer with a justification that could be offered face-to-face to the party that dies." There might be a tension here - if you can justify letting someone die without mentioning numbers, it might imply numbers aren't the reason, but then how do you explain why you chose one group over the other?

  I'll also need to briefly cover Taurek's view (which gives equal chance to each individual regardless of group size), a lottery-based approach, and straightforward aggregation (where you simply save the larger group). But the focus should remain on developing robust criteria rather than evaluating these theories in depth.

