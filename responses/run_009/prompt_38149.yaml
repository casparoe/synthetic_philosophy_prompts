  3. **Prop-Directed Make-Believe - 5% Weight**  
     *Justification:* Walton’s theory explains *why* we feel, but fMRI studies show emotions target the *character* (not just rules), activating social-cognition networks like real relationships.  
  4. **Attachment & Narrative Neural Wiring - 10% Weight**  
     *Justification:* Prolonged engagement builds neural "models" of characters. Your 5-year authorship likely created dopamine-driven attachment pathways identical to real bonds.  

