  The friend's position is deflationary, reducing "closer to truth" to pragmatic utility. A robust theory of verisimilitude would need to show that there's more to it—like structural correspondence or similarity in models. Pointing out that Newton's theory approximates Einstein's under certain conditions (low gravity, slow speeds) supports the idea that Einstein's framework is objectively more accurate. The user needs arguments to show that progress in science isn't just about usefulness but about getting closer to how the universe actually works.

