answer: |-
  Your friend raises a profound challenge, but his deflationary conclusion ("no fact of the matter") isn't inevitable. While defining "closer to the truth" (verisimilitude) rigorously is notoriously difficult and Popper's initial attempt failed, subsequent work shows the concept isn't empty rhetoric. Here's why:

  ### 1. Why the Naive Idea (Comparing Consequences) Broke Down: The Miller-Tichý Disaster
  *   **Popper's Original Definition (Intuitive):** Theory A has higher verisimiltude than Theory B if:
      *   A has *all* the true consequences of B (and possibly more).
      *   A has *only* the false consequences of B (or fewer).
  *   **The Fatal Flaw:** Logical dependency. Statements within a theory are interconnected.
  *   **The Miller-Tichý Result (1974):** They proved a devastating theorem: **If Theory A is false, and Theory B is false, then it is logically IMPOSSIBLE for A to satisfy both of Popper's conditions simultaneously.**
      *   **Why?** Imagine B has a false consequence F. For A to have *all* of B's true consequences (T_B), it must also entail *some* statement that, when combined with T_B, logically *implies* F. But since A must have *only* B's false consequences (or fewer), it cannot entail this necessary "connector" statement if that statement is false (which it likely is). Conversely, if A avoids entailing the false connector, it must fail to entail some of B's true consequences. It's a logical trap.
  *   **The Collapse:** Popper's seemingly intuitive definition implied that *no* false theory could be closer to the truth than *any other* false theory. This rendered his definition useless for comparing Newton and Einstein, both false.

  ### 2. Why "Closeness to Truth" is Harder Than It Appears
  *   **Not Just Counting Consequences:** The Miller-Tichý result shows it's not enough to just tally up "true consequences" and "false consequences" independently. The *structure* and *interdependence* of the statements matter crucially.
  *   **The "What" of Truthlikeness:** What aspect of a theory makes it "close"? Is it:
      *   The *number* of true propositions it gets right?
      *   The *importance* of those propositions (e.g., core laws vs. peripheral predictions)?
      *   The *similarity* of the world-states it describes to the actual world-state?
      *   The *structural match* between its models and the real world?
  *   **The Problem of Falsehoods:** How do we weigh a theory getting something *mostly* right but not quite (e.g., Newtonian gravity approximating Einstein's in weak fields) versus a theory getting something catastrophically wrong?
  *   **Language Dependence:** Should the definition depend on how we *describe* the theory (the language used)?

  ### 3. What an Adequate Account of Verisimilitude MUST Achieve
  For your friend's deflationary view to be mistaken, a viable account of verisimilitude must overcome the Miller-Tichý trap and satisfy core intuitions about scientific progress:
  1.  **False Theories Can Be Comparable:** Einstein *can* be closer to the truth than Newton, even though both are strictly false.
  2.  **Truth is the Limit:** A sequence of increasingly verisimilar theories should approach the complete truth as its limit.
  3.  **Avoid the Collapse:** The definition must not fall prey to the Miller-Tichý dependency problem.
  4.  **Accommodate Genuine Progress:** It must explain why Einstein superseded Newton: Einstein makes *more accurate predictions* in wider domains (e.g., Mercury's orbit, GPS, gravitational lensing, black holes), *unifies* gravity and spacetime geometry, and *reduces* Newtonian gravity to a highly accurate approximation under specific (low-speed, weak-field) conditions. This isn't *just* pragmatic convenience; it reflects a deeper correspondence with reality.
  5.  **The Core Requirement (Similar to Yours):** **Verisimilitude increases only if the theory either:**
      *   **Gains in "Truth Content" without gaining in "Falsity Content".** (Capturing more truth without introducing new error).
      *   **Loses "Falsity Content" without losing "Truth Content".** (Correcting errors without sacrificing true insights).
      *   **Or, crucially, does some combination where the gain in truth outweighs any gain in falsity, or the loss in falsity outweighs any loss in truth.** (This is where the naive counting fails, but a structural/similarity approach can succeed). An adequate theory must define "content" robustly to handle dependencies.

  ### 4. Workable Paths Forward (Beyond Naive Consequences)
  The most promising approaches abandon the idea of simply comparing sets of true/false *consequences* and focus instead on the *content* of the theories and the *similarity* between what they say and reality:

  *   **Likeness/Similarity Approaches (e.g., Niiniluoto, Oddie):** These define the distance between a theory (or the possible worlds/models it allows) and the actual world. Verisimilitude is *inversely related* to this distance.
      *   **How it avoids Miller-Tichý:** It doesn't rely on comparing consequence sets. It directly measures the "gap" between the theory's description and reality. Adding a true consequence *might* decrease the distance *if* it makes the theory's models more similar to the actual world. Correcting a core falsehood *significantly* decreases the distance. A theory like Einstein's GR describes possible spacetime geometries that are *much closer* to the actual geometry of our universe than Newton's absolute space and time + force-at-a-distance.
      *   **Captures Approximation:** Newton's theory is seen as describing worlds *fairly close* to ours under specific conditions (low speed, weak gravity), while Einstein's describes worlds *extremely close* across a vast domain. The move to Einstein *reduces the distance* significantly.
  *   **Structuralist/Model-Theoretic Approaches (e.g., Structural Realism):** Focuses on whether the *structure* or *relationships* captured by the theory (e.g., the mathematical form of Einstein's field equations) are preserved or refined in later theories, even if the underlying ontology changes (e.g., from gravitational force to spacetime curvature).
      *   **How it avoids Miller-Tichý:** It compares the structural content and its match to the world's structure, not logical consequence sets. Einstein's structure successfully *embeds* Newton's structure as a limiting case, while adding far more structural detail and accuracy.

  ### Why Your Friend's Deflationary View is Plausible but Likely Too Strong

  *   **Plausible:** He correctly identifies the failure of the naive consequence-based approach (Miller-Tichý) and the genuine difficulty of defining verisimilitude. "We prefer it" *is* often easier to justify than "it's closer to the truth."
  *   **Too Strong:** His conclusion that there's *no fact of the matter* is an overreach. The *success* of science demands explanation. Why does using Einstein's equations for GPS work vastly better than Newton's? Why did Einstein *correctly predict* novel phenomena (light bending) that Newtonian theory couldn't? Why does Newtonian gravity emerge *as an approximation* from GR under specific limits? This pervasive pattern of increasing empirical adequacy, explanatory power, and successful novel prediction, coupled with the ability to embed prior theories as approximations, strongly suggests we are not just choosing pragmatically useful fictions, but are progressively uncovering a more accurate representation of the underlying structure of reality. The similarity/structural approaches provide frameworks to make sense of this "closeness" objectively, avoiding the pitfalls of Popper's definition.

  **In Conclusion:** While defining "closer to the truth" rigorously is complex and Popper's first attempt spectacularly failed, the concept is not empty rhetoric. The undeniable progress in science, exemplified by the move from Newton to Einstein, strongly suggests that theories *can* better approximate the truth. Modern likeness/similarity and structuralist approaches offer promising paths to define verisimilitude in a way that avoids the Miller-Tichý collapse, satisfies the core requirement that truthlikeness requires net gains in truth over falsity, and objectively justifies claims that Einstein's theory is genuinely closer to describing the fundamental nature of gravity and spacetime than Newton's. Your friend is right that it's not simple, but likely wrong that it's meaningless.
