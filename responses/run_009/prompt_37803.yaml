prompt: |-
  Quick backstory: I'm a backend engineer, no philosophy background at all (dropped my one ethics elective in uni, sorry). For the last ~2 years I've been meditating pretty seriously with a local group, and my teacher keeps hammering on intention — like, whether an action comes from greed/aversion/delusion is supposed to matter more than whether it "worked out." Meanwhile my team lead is a very online effective-altruism type who makes every decision sound like an expected-value calculation, including small stuff: how much to push back on a feature that boosts engagement but probably makes the product worse for users' sleep, whether to be blunt in a code review, whether to let tech debt quietly land on the intern. I notice I just vibes-swap between "what would my teacher say" and "what's the greatest good" depending on my mood, and I want to actually be consistent.

  So: write me a decision procedure I can actually run when one of these everyday moral-ish calls comes up at work. Ground one branch in what Buddhist ethics actually says (I gather right speech has like four conditions — true, timely, gentle, beneficial — and there's stuff about the precepts and karma being about the state of mind behind the act, but I honestly only half-remember it), and the other branch in plain consequentialism, and structure it so the two branches visibly push toward different answers at identifiable steps instead of both collapsing into "be reasonable and communicate clearly." Then run it on three worked cases: (1) telling a teammate their migration plan is bad, while irritated at them for something unrelated, (2) staying late to fix a bug that mostly affects a small number of free-tier users, and (3) covering for a friend's sloppy work in a status update to his manager. Include at least one case where the Buddhist branch gives me an answer I won't like — I suspect it'll say something like "the accurate-but-hostile review is still off-limits even if it maximizes good outcomes," and I want that said plainly rather than negotiated away.

  It has to be runnable in five minutes at my desk, no Pali or Sanskrit needed, and no reading list — I want the substance in the procedure itself, not pointers to books I'll never open. Be upfront about which steps are just my judgment dressed up as a checklist, and where the two frameworks secretly agree and the "divergence" is cosmetic. Keep the whole thing under 800 words, and end with two sentences saying which branch I should follow when they genuinely conflict, since "it depends" is exactly what I'm trying to escape.
