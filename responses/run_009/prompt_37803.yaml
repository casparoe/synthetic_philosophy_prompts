answer: |-
  Here's a **5-Minute Moral Decision Procedure for Engineers**, designed for clarity and divergence between Buddhist ethics (BE) and consequentialism (C). Run it step-by-step when faced with a workplace "should I?" moment.

  **Core Frameworks:**
  *   **Buddhist Ethics (BE):** Focuses on **intention rooted in non-greed, non-aversion, non-delusion (the "Three Poisons")**. Actions violating core ethical trainings (like lying, harsh speech) are unskillful *because* of the state of mind they cultivate, regardless of outcome. Right Speech requires speech to be **True, Beneficial, Timely, and Gentle/Kind**.
  *   **Consequentialism (C):** Focuses on **maximizing net positive outcomes ("expected value")**. An action is good if its *probable consequences* create the greatest good/happiness/benefit for the greatest number, considering scale, probability, and alternatives.

  **The Procedure:**

  1.  **Define the Action:** What exactly am I considering *doing*? (Be specific: "Send this critical code review," "Stay late to fix X," "Tell manager Y is done").
  2.  **Check BE Intention (State of Mind):**
      *   What's my *primary* motivation right now? (Honesty check!)
      *   Is it significantly mixed with **Greed** (desire for praise, promotion, comfort), **Aversion** (irritation, fear, resentment), or **Delusion** (ignorance, rationalization, wishful thinking)?
      *   **BE Branch:** If YES to significant Greed/Aversion/Delusion driving the action, the action is *unskillful* (bad karma) and should be **avoided or delayed** until motivation clarifies. Focus shifts to purifying intention first. *(Judgment Step: "Significant" is subjective, but be harsh on yourself)*.
      *   **C Branch:** **Skip this step.** Motivation is irrelevant. Only consequences matter. Proceed to Step 3.
  3.  **Check Core Ethical Boundaries (BE Precepts / Right Speech):**
      *   Does this action inherently involve:
          *   Lying or intentional deception?
          *   Harsh, abusive, or intentionally divisive speech?
          *   Taking what isn't freely given (time, credit)?
          *   Harming others (reputation, well-being)?
      *   **BE Branch:** If YES, the action is *unskillful* and should be **avoided**, regardless of perceived benefit or intention. Find an ethical alternative. *(Divergence Point: BE blocks certain actions outright; C does not)*.
      *   **C Branch:** **Skip this step.** No action is inherently off-limits. Proceed.
  4.  **Evaluate Consequences (C Expected Value):**
      *   Who is affected? (Teammates, users, company, self)
      *   What are the *probable* positive outcomes? (Scale: How many helped? How much? Probability?)
      *   What are the *probable* negative outcomes? (Scale: How many harmed? How much? Probability?)
      *   What are the alternatives? What's the *net expected value* (Positives - Negatives) of this action vs. alternatives vs. doing nothing? Consider long-term effects (trust, culture, precedent).
      *   **C Branch:** Choose the option with the **highest net expected value**. *(Judgment Step: Estimating scale/probability is inherently fuzzy)*.
      *   **BE Branch:** **Only if action passed Steps 2 & 3,** use consequences to choose *how* to act skillfully (e.g., *gentle* truth, *timely* help). Consequences don't justify unethical means. *(Agreement Point: Both use consequences for implementation details once ethical path is set by their own rules)*.
  5.  **Apply Right Speech (If Applicable - BE):**
      *   If the action involves communication, verify it is: **True, Beneficial, Timely, Gentle.** If any condition fails significantly, rephrase or delay. *(BE Specificity)*.
  6.  **Decide & Act:**
      *   **BE Path:** Act only if intention is purified (Step 2), core boundaries aren't crossed (Step 3), and communication (if any) meets Right Speech (Step 5). Consequences (Step 4) refine the *how*.
      *   **C Path:** Act based on maximizing expected value from Step 4. Steps 2, 3, and 5 are irrelevant.

  ---

  **Worked Examples:**

  **1. Telling Teammate Migration Plan is Bad (While Irritated)**
  *   **Action:** Send critical feedback now.
  *   **BE Step 2 (Intention):** Primary motivation? Fixing the plan (Good) + Significant **Aversion** (Irritation at them). **VERDICT: Unskillful. DELAY feedback.** Cool down first. *You won't like this: BE blocks the irritated review even if it's the fastest fix.*
  *   **C Step 4 (Consequences):** Probable Positives: Better system, avoids future bugs (High Scale/Prob). Negatives: Teammate feels attacked, damages rapport (Medium Scale/Prob). Alternative: Calm feedback later? Might delay fix slightly but preserves relationship (Higher Net EV long-term?). **VERDICT: Probably DELAY & reframe calmly.** (Agrees with BE outcome here, but for different reasons).

  **2. Staying Late to Fix Bug Affecting Free-Tier Users**
  *   **Action:** Work unpaid overtime to fix minor bug impacting small free-user group.
  *   **BE Step 2 (Intention):** Primary motivation? Compassion for affected users (Good)? Or **Greed** for praise/avoiding blame? Or **Delusion** ("I *must* fix everything")? If compassion dominates, proceed. If greed/delusion, pause. **VERDICT: Proceed IF intention is compassion.** (Judgment call).
  *   **BE Step 3 (Boundaries):** Not inherently lying/harming/etc. Okay.
  *   **C Step 4 (Consequences):** Positives: Fix for small user group (Low Scale), prevents minor frustration (Low Impact), maybe good PR (Very Low Prob). Negatives: Your burnout, lost personal/family time (High Impact on you), opportunity cost (could do higher-impact work tomorrow). **VERDICT: LOW Net EV. DON'T stay late.** Document bug, fix tomorrow. *(Divergence: BE might allow it based on compassion; C likely rejects it as inefficient)*.

  **3. Covering for Friend's Sloppy Work in Status Update**
  *   **Action:** Tell manager the work is "on track" or "done" when it's actually sloppy/unfinished.
  *   **BE Step 3 (Boundaries):** **Inherently involves LYING (intentional deception).** **VERDICT: UNETHICAL. DO NOT DO. ** *This is the answer you won't like: Lying is always unskillful karma, full stop, even to "help" a friend or avoid minor conflict.* Be truthful ("still in progress, reviewing quality").
  *   **C Step 4 (Consequences):** Positives: Friend avoids short-term heat (Low Scale), avoids awkwardness for you (Low Scale). Negatives: Manager makes decisions on false info (High Potential Harm), sloppy work ships/causes issues (High Prob Harm later), erodes trust when discovered (High Scale Harm), sets bad precedent. **VERDICT: VERY NEGATIVE Net EV. DO NOT LIE.** (Agrees with BE outcome, but based on consequences, not inherent wrongness).

  ---

  **When Branches Genuinely Conflict: Follow the Buddhist branch.** It builds a foundation of ethical discipline and purifies intention, which cultivates long-term clarity and reduces suffering *within you*. Use consequentialism secondarily to refine *how* you enact skillful intentions, especially for large-scale decisions where outcomes are paramount. Consistency starts with mastering your own mind.
