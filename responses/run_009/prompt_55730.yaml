prompt: |-
  Grading this one has been eating my evening, so I want a second pair of eyes before I commit to a number. I'm the TA for an upper-level ethics course; we spent about three weeks on Scanlon's contractualism, mostly on the aggregation stuff. Midterm question:

  "Scanlon's contractualism is supposed to avoid aggregation of complaints across persons. Answer all three parts.
  (a) State the individualist restriction and explain how contractualism nonetheless yields the verdict that we should rescue the greater number in a case where you can save either one stranger or five.
  (b) Does the restriction also forbid aggregation within a single life? Explain with an example.
  (c) A town must choose between two water-treatment options. Option A spreads the risk: each of its five million residents faces a 1-in-a-million chance of death. Option B concentrates it: a single worker takes a 1-in-a-thousand chance of death and everyone else is safe. What does contractualism imply about this choice, and is the implication defensible?"

  Here's the student's answer, more or less verbatim:

  "(a) Scanlon's contractualism holds that an act is wrong if it would be permitted by a principle that no one could reasonably reject. This is basically a consent test: principles are justified when rational contractors in something like Rawls's original position would all agree to them, just applied to everyday morality instead of institutions. The individualist restriction says that in deciding whether a principle could be reasonably rejected we may look only at the complaints of individual persons, never at the sum of the complaints of a group. So in the rescue case we cannot say that five lives outweigh one. But contractualism still tells us to save the five. If we save the one, each of the five has a complaint (being allowed to die) that is no weaker than the complaint the single person would have if we saved the five. Since their complaints tie in strength but there are more of them, the scale tips toward the group taken together, so the principle 'save the greater number' cannot be reasonably rejected.

  (b) The restriction has to apply within a single life too. It would be arbitrary to allow summing when the complaints belong to one person but not when they belong to several — a headache is a headache regardless of whose it is. So even for one person, many minor pains can never add up to outweigh a single major harm in that person's life. Each complaint stands on its own.

  (c) Under option B the worker faces a 1/1000 risk of death, while under A each resident faces only one in a million. But those tiny risks add up: five million people each at one-in-a-million is about five expected deaths, which is far worse than the worker's expected loss. Since the individual complaints on the A side are so small, contractualism can and should aggregate them in a case like this, just as small pains within a life can add up. So no one could reasonably reject option B, and the town should choose it. The worker's complaint is outweighed by the combined complaints of the residents, and it's defensible — it also shows contractualism and consequentialism converge in risk cases."

  I've read it twice and keep second-guessing myself. The conclusions mostly sound like what we said in lecture, but I don't want to let things slide just because the endings sound right. Grade it properly: give it a definite letter grade on our A–F scale and then walk through each part with the specific comments you'd write on the exam — what's right, what's wrong, and how many points each error should cost. Don't give me "reasonable graders could differ" hedging — you're the grader, commit. I especially can't tell whether the move in (b) is a real error or something we covered differently than I remember, and whether (c) derives its verdict the way contractualism actually does or just sounds like it does — tell me straight. And flag it if the question itself is badly set up somewhere.
reasoning: |-
  Okay, the TA is grading a midterm on Scanlon's contractualism and wants a second opinion. They're stuck on evaluating a student's response to a three-part question. Let me break this down carefully.

  First, I need to recall Scanlon's contractualism accurately. The core idea is that an act is wrong if it violates principles no one could reasonably reject. The individualist restriction prohibits summing complaints across different people - each person's complaint stands alone. 

  Looking at part (a) of the student's answer: They correctly state the individualist restriction but make a serious error by saying contractualism allows "tipping the scale" because there are more complaints. That's exactly what Scanlon rejects! The correct reasoning should focus on comparative complaint strength - the single person saved can't reasonably reject being saved because they'd want the same principle if positions were reversed. The student's misunderstanding here is fundamental and deserves significant penalty.

  For part (b): The student gets this exactly right. Scanlon explicitly allows aggregating complaints within a single life (like many small pains vs one large harm), contrasting it with cross-person aggregation. The example about headaches shows good understanding. Full credit here.

  Part (c) is messy. The student correctly identifies that contractualism would prefer option B (concentrated risk) but for completely wrong reasons. They try to aggregate small risks across people - which violates the individualist restriction - and falsely claim contractualism allows this. The actual reasoning should focus on each resident's minuscule complaint versus the worker's significant complaint. The consequentialist convergence remark is irrelevant and misleading.

  The question itself seems well-designed, testing key distinctions in contractualism. But the student's answer reveals deep confusion about the central "no cross-person aggregation" rule, even while reaching superficially correct conclusions in (a) and (c). 

  Weighting the errors: Part (a)'s scale-tipping mistake is severe (costing most points), part (b) is perfect, part (c)'s reasoning error is major though the conclusion happens to align. The grade should reflect that understanding is patchy but not completely absent. A low C seems fair - they got the easier part right but failed the core conceptual test.
answer: |-
  Based on a strict application of Scanlon's contractualism as presented in standard interpretations (e.g., *What We Owe to Each Other*) and common course coverage of aggregation, here’s the grading breakdown:

  **Overall Grade: C**  
  (The answer demonstrates superficial familiarity with conclusions but misrepresents core mechanisms of contractualism in critical ways, especially regarding aggregation. Partial credit earned for (b) and correct conclusions.)

  ---

  **Detailed Feedback with Point Deductions (Out of 33 total points: 11 per part):**

  **(a) 4/11**  
  **What’s right:**  
  - Correctly states the individualist restriction (no summing complaints across persons).  
  - Correctly concludes contractualism requires saving the five.  
  **What’s wrong:**  
  - **Major error (‑6 points):** Claims the verdict is reached because "the scale tips toward the group taken together" due to more complaints. This *is* aggregation, directly violating the individualist restriction. Scanlon explicitly forbids this.  
  - **Minor error (‑1 point):** Misdescribes contractualism as "basically a consent test" like Rawls’s original position. Scanlon’s contractors aren’t behind a veil of ignorance; they consider principles given their actual positions.  
  **Correct Reasoning:** We save the five because the single person *cannot reasonably reject* a principle permitting saving the greater number. If they were in the position of one of the five, they’d want to be saved. The strength of each complaint is identical (losing their life), but no individual’s complaint is *stronger* than another’s. The number matters only because the single person’s rejection isn’t reasonable, not because complaints are summed.

  **(b) 11/11**  
  **What’s right:**  
  - **Perfect.** Correctly states the individualist restriction *does not apply within a single life* (i.e., intra-personal aggregation *is* allowed).  
  - Provides sound example: Many minor pains *can* outweigh a major harm for one person.  
  - Spot-on explanation: It would be arbitrary to forbid intra-personal aggregation when interpersonal is banned.  
  **No deductions.** This is precisely what Scanlon argues (e.g., *WWOTEO*, Ch. 5).

  **(c) 5/11**  
  **What’s right:**  
  - Correctly identifies contractualism prefers Option B (concentrated risk).  
  - Correctly notes the worker’s complaint is larger than any individual resident’s.  
  **What’s wrong:**  
  - **Critical error (‑5 points):** Claims contractualism aggregates the residents’ small risks ("tiny risks add up"). This is *explicitly forbidden* by the individualist restriction. You cannot sum complaints across persons, even for risks.  
  - **Misrepresentation (‑1 point):** Suggests intra-personal aggregation (from b) justifies inter-personal aggregation here. Scanlon rejects this; the two are distinct.  
  - **Irrelevant point (‑0 points, but misleading):** Comparing "expected deaths" (5 vs. 0.001) is consequentialism, not contractualism.  
  - **Unsubstantiated claim (no penalty, but incorrect):** Asserts convergence with consequentialism is defensible. Contractualism’s *justification* differs fundamentally.  
  **Correct Contractualist Reasoning:**  
  - Option B: The worker has a strong complaint (1/1000 death risk).  
  - Option A: Each resident has a negligible complaint (1/1,000,000 risk)—too weak to justify imposing the larger risk on the worker.  
  - No one could reasonably reject Option B because the worker’s complaint outweighs *any single resident’s* complaint under Option A. The residents’ complaints aren’t summed; each is evaluated individually and deemed too small.

  ---

  **Why C (not D/F)?**  
  - **(b)** is flawless (saves the grade from failing).  
  - Conclusions for (a) and (c) are accidentally correct, showing some grasp of outcomes.  
  - Core errors in (a) and (c) are severe but reflect misapplication rather than total ignorance.

  **Question Quality Check:**  
  - The question is well-designed. It tests key distinctions (inter vs. intra-personal aggregation, risk cases).  
  - **Trap in (c):** The student fell for the "expected death" red herring. A strong answer would reject aggregation and focus on individual complaint strength.

  **Actionable Comments for Student:**  
  *"(a) You state the individualist restriction correctly but violate it by ‘tipping the scale’ due to more complaints. Scanlon forbids this. The correct reasoning hinges on the reasonableness of rejection by the single person.  
  (b) Perfect. You correctly distinguish intra-personal aggregation.  
  (c) Your conclusion is right but your reasoning is consequentialist, not contractualist. You aggregated complaints across residents (which Scanlon prohibits). The worker’s large individual complaint outweighs each resident’s tiny individual complaint; we don’t sum the residents’ risks.  
  Overall: You grasp surface conclusions but miss how contractualism’s machinery (esp. the individualist restriction) drives them. Review why summing across persons is banned even in risk cases."*
