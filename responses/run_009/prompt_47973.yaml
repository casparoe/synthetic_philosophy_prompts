answer: |-
  Here’s your Q&A prep sheet, prioritizing objections by damage potential and tailored to your audience:

  ### **Top-Tier Threats**  
  1. **Cultural Evolutionist (Materialist)**:  
     *Objection*: "You concede economic/material shifts *enable* bridges (e.g., trade creating interdependence), yet insist argument drives change. Isn’t argument just epiphenomenal noise? If bridge-building requires material shifts, why isn’t *that* the real cause?"  
     **Reply**: "Material shifts create *opportunities* for bridges (e.g., urbanization enabling cross-group contact), but don’t automatically translate to moral inclusion. Argument is the mechanism converting proximity into normative commitment—e.g., Quaker arguments leveraging newfound urban interdependence to oppose slavery. Without argument, proximity often breeds conflict, not inclusion."  
     **Soft Spot**: Material factors *do* structurally enable bridges; your reply must stress argument’s irreplaceable *mediating* role without overclaiming.  

  2. **Historian (Anti-Whiggism)**:  
     *Objection*: "Your ‘expanding circle’ ignores that every inclusion (e.g., women’s rights) created new exclusions (e.g., racial segregation). Doesn’t this ‘ferry’ just shuffle parochialism, refuting progress narratives?"  
     **Reply**: "The model doesn’t require linear progress. Bridges can be exclusionary (e.g., ‘cuteness’ denied to out-groups). My point is that *when* inclusion occurs, it requires argument + affective bridges—even if later contradicted. This explains *fractured* change better than rival models."  
     **Soft Spot**: Concede the point on non-linearity but refocus on *mechanism* over teleology.  

  3. **Intuitionist Psychologist**:  
     *Objection*: "If arguments only work with pre-existing affective bridges, doesn’t that reduce reasoning to ‘preaching to the choir’? How is this not just post-hoc rationalization for intuitions anchored in kinship/cuteness?"  
     **Reply**: "Bridges aren’t moral conclusions—they’re *affective capacities*. E.g., loving pets (cuteness bridge) doesn’t imply factory farming is wrong; argument extends concern *from* pets *to* livestock. Reasoning isn’t rationalization—it’s analogical extension."  
     **Soft Spot**: Distinguishing "affective capacity" from "moral intuition" is subtle and may require examples.  

  ---

  ### **High-Mid Tier Threats**  
  4. **Cultural Evolutionist (Pragmatism)**:  
     *Objection*: "Widening moral circles track material benefits (e.g., inclusive norms reduce trade costs). Why invoke argument when cost-benefit analysis suffices?"  
     **Reply**: "Groups rarely recognize material benefits preemptively. Abolitionists argued *against* economic interests; suffrage activists faced social costs. Argument persuades by linking bridges (e.g., shared citizenship) to new obligations despite short-term costs."  
     **Soft Spot**: Some expansions *are* materially motivated (e.g., post-WWII human rights aiding diplomacy).  

  5. **Intuitionist (Empirical)**:  
     *Objection*: "fMRI studies show moral judgments precede reasoning. If bridges are affective, why call argument ‘causally indispensable’? Isn’t it just storytelling for gut feelings?"  
     **Reply**: "Neuroscience captures snap judgments, not deliberative reform. Historical change requires sustained persuasion—e.g., British abolitionists spent decades arguing. Affect primes receptivity; argument directs it systematically."  
     **Soft Spot**: Lab studies *do* undermine reason’s role in individual cognition; stress collective/long-term change.  

  ---

  ### **Mid-Tier Threats**  
  6. **Historian (Specificity)**:  
     *Objection*: "Case X [e.g., animal rights in 19c UK] had bridges *and* argument but failed until material conditions shifted. Doesn’t this refute your model?"  
     **Reply**: "The model predicts *necessary but insufficient* conditions. Bridges + argument enable change but can be overridden by countervailing forces (e.g., industrial opposition). Rival models can’t explain why identical arguments succeed in some contexts but not others."  
     **Soft Spot**: Admitting insufficiency risks making the model unfalsifiable.  

  7. **Intuitionist (Bias)**:  
     *Objection*: "Affective bridges like ‘cuteness’ or ‘shared worship’ are vehicles for prejudice (e.g., favoring ‘likeable’ victims). Isn’t your model just systematizing bias?"  
     **Reply**: "Exactly. The model *predicts* this unevenness. Singer’s error was ignoring why arguments only ‘ferry’ concern selectively. This isn’t a bug—it’s why argument alone can’t drive expansion."  
     **Soft Spot**: May sound cynical; emphasize it explains activist strategy (e.g., framing refugees as ‘families’).  

  ---

  ### **The Silent Killer (Hope Nobody Asks)**  
  8. **"Is this falsifiable?"**  
     *Objection*: "You say argument fails without bridges and bridges alone don’t cause change. Isn’t this unfalsifiable? What evidence *could* disprove it?"  
     **Reply**: "Yes: (1) If moral expansion occurred *without* identifiable bridges (e.g., inclusion based purely on abstract argument), or (2) If bridges *alone* caused normative shift without argument (e.g., widespread pet ownership automatically leading to veganism). Neither holds historically."  
     **Damage Control**: Preempt by noting cases where bridges existed but argument failed (e.g., failed anti-lynching campaigns) due to overpowering counter-bridges (racial animus).  
     **Soft Spot**: Bridges are often retrospectively identified—guard against ad hoc applications.  

  ---

  **Strategy Summary**:  
  - **Against materialists**: Argue argument *translates* structural shifts into moral norms.  
  - **Against intuitionists**: Stress *collective, longitudinal* change beyond lab snapshots.  
  - **Against historian**: Embrace non-linearity; your model explains *how* (not *that*) change happens.  
  - **Universal**: Hammer the model’s power to explain *variation* in reform success—your strongest wedge.  

