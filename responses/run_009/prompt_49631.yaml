prompt: |-
  I lead a small book group of retired teachers that has spent the last year reading popular and semi-academic history—this fall we did a stack of books on the outbreak of the First World War, and previously we did the Reformation and the fall of Rome. A pattern keeps coming up that I can't find a name for, and it's making our discussions circular. When historians are asked what caused these events, they nearly all refuse to name a single cause; they give a list—nationalism, the alliance system, mobilization schedules, the assassination, the personalities of particular leaders—and they clearly regard singling one out as vulgar or old-fashioned. But then, elsewhere in the same books, they do single one out, usually with a hedge like "the deepest cause" or "the underlying cause," and two historians who agree about every fact in the case will single out different items from the list. What strikes me is that their disagreement isn't about what happened; it's about which jointly present factor deserves to be lifted out of the pile, and the implicit standard for lifting seems to shift: sometimes it's whichever factor was most abnormal against its background (the assassination), sometimes whichever was most entrenched and thus hardest to imagine away (the alliance system), sometimes whichever best supports the lesson the historian wants to draw.

  So the thing I want a name for is not the situation of many causes being present—everyone just calls that multi-causality, and that word doesn't help—but the selection problem: the practice of choosing one condition from a set of conditions that were individually insufficient and (arguably) jointly necessary, plus the shifting criteria (abnormality, contingency, removability, depth) used to justify the choice. It's related to overdetermination as I understand that term from a bit of philosophy reading, but in the classic overdetermination cases each cause is sufficient on its own, whereas in the historical cases I mean no single factor would have done the job alone, so "overdetermination" doesn't quite land either. I've also seen philosophers mention that there's something called an INUS condition, but that seems to describe each item on the list rather than the picking.

  I'd like to know: does this selection problem have an established name or literature (I gather philosophers have written about "causal selection," but I'm not sure whether that's the same thing or something adjacent)? Please tell me what the nearest existing concepts are, how each differs from what I've described, and which one fits best; and if the fit is imperfect, coin a term of your own with a definition and a couple of boundary cases—e.g., does it apply when a scientist picks one gene out of a network as "the gene for" a trait, or only in retrospective historical explanation? I don't want just a label; I want to understand what exactly the practice is and where its edges are. Please answer in American English.
reasoning: |-
  Okay, the user leads a book group of retired teachers focused on history, and they've noticed a pattern in historical explanations. Historians list multiple causes for events like WWI but then highlight one as the "deepest" or "underlying" cause, often based on shifting criteria. The user wants to know if there's a name for this selection problem.

  First, I need to recall relevant concepts. Multi-causality is mentioned, but that's about multiple factors, not the selection. Overdetermination doesn't fit because each cause isn't sufficient on its own. INUS conditions (Insufficient but Necessary parts of an Unnecessary but Sufficient set) describe individual factors in a causal complex, but not the act of selecting one.

  Causal selection comes to mind. Philosophers like Hart and Honoré or Woodward discuss it. It's about why we pick certain causes over others from a complex set. Factors like abnormality, agency, stability, or explanatory interests influence this. That seems close to what the user describes. For example, in WWI, the assassination might be picked for its abnormality, while alliances for their stability.

  The user mentioned shifting criteria: abnormality, entrenchment, contingency, etc. This aligns with causal selection criteria. But I should check if causal selection specifically addresses cases where factors are INUS conditions. The user’s case involves conditions that are individually insufficient but jointly necessary. INUS is part of it, but the selection process is broader.

  Are there other concepts? Salience or explanatory emphasis might be related. The user wants to know if this applies beyond history, like in genetics when a gene is labeled "the gene for" a trait. Causal selection does apply there. Geneticists might pick a gene based on mutation rates or controllability, similar to historians.

  The fit isn't perfect because causal selection is a broad category. The user might need a specific term for historical contexts. Coining a term like "causal prioritization" or "explanatory privileging" could work. But "causal selection" is established. I should explain how it fits and where boundaries lie.

  Boundary cases: In science, selecting a gene involves similar criteria. In accidents, blaming the driver vs. road conditions based on norms. The user’s examples are retrospective, but causal selection can be prospective too, like in policy.

  So, causal selection is the best fit. I'll structure the response by defining it, linking to the user's description, explaining criteria, addressing INUS, and giving examples across fields. Make sure to clarify that it's not about facts but emphasis, and the criteria shift based on interests.
answer: |-
  Based on your detailed description, the phenomenon you've identified is squarely within the established philosophical concept of **Causal Selection**. This *is* the recognized term for the practice and problem you're grappling with.

  Here's a breakdown of how it fits, its nuances, boundaries, and related concepts:

  1.  **Causal Selection (The Best Fit):**
      *   **Definition:** The process or practice of singling out one (or a few) causes from a complex set of contributing factors as "the cause," "the real cause," "the most important cause," or "the underlying cause" for explanatory, communicative, or pragmatic purposes. It acknowledges that while many necessary conditions (often INUS conditions - see below) exist, we selectively highlight some based on contextual criteria.
      *   **Alignment with Your Description:**
          *   **Core Practice:** Historians listing multiple factors but then *selecting* one for emphasis ("deepest cause," "underlying cause") is the essence of causal selection.
          *   **Shifting Criteria:** Philosophers explicitly recognize that the criteria for selection are context-dependent and variable. Your observations (abnormality, entrenchment/stability, contingency/removability, depth/profundity, explanatory goals/narratives) are classic selection criteria discussed in the literature. Others include:
              *   **Agency/Responsibility:** Was a human action particularly blameworthy or pivotal? (Less common in systemic historical explanations like WWI causes, but relevant elsewhere).
              *   **Controllability/Manipulability:** Could this factor have been changed to prevent the outcome? (Relates to your "removability").
              *   **Default vs. Deviation:** Was this factor a normal background condition or an abnormal intervention? (Your "abnormality").
              *   **Explanatory Interest:** What lesson is the historian trying to convey? What aspect of the event are they focusing on? (Your "lesson the historian wants to draw").
          *   **Agreement on Facts, Disagreement on Selection:** Causal selection explicitly addresses why experts who agree on the underlying facts can disagree vehemently about "the cause" – the disagreement is about *which factor deserves explanatory prominence* based on differing implicit or explicit selection criteria or priorities.
          *   **Distinct from Multi-Causality/Overdetermination/INUS:** It operates *on top* of these concepts. Multi-causality describes the existence of many factors; overdetermination (where multiple sufficient causes exist) and INUS conditions describe the *logical structure* of causation within the complex set; causal selection describes the *pragmatic and explanatory act* of picking one out from that set.
      *   **Literature:** Key figures include H.L.A. Hart and Tony Honoré (*Causation in the Law* - foundational for modern discussions), James Woodward (*Making Things Happen*), and Christopher Hitchcock. The Stanford Encyclopedia of Philosophy entry on "Causation and Manipulability" covers it well, and specific papers often tackle "the problem of causal selection" or "causal selection in the special sciences."
      *   **Boundary Cases/Scope:**
          *   **History:** This is the paradigmatic case you describe, where complex, interacting, contingent factors combine for an outcome.
          *   **Science (e.g., Genetics):** Absolutely applies. Calling one gene "the gene for" a trait is classic causal selection. The scientist is selecting *that* gene from a complex genetic and environmental network because it might be the most statistically associated variant, the one with the largest effect size, the one easiest to manipulate experimentally, the one newly discovered, or the one relevant to a specific disease mechanism they study. Criteria include abnormality (mutant vs. wild type), controllability, explanatory focus, and sometimes salience.
          *   **Accidents/Engineering:** Why was a bridge collapse blamed on "poor maintenance" (abnormality, controllability, responsibility) rather than "unusually high winds" (abnormality, but perhaps viewed as an uncontrollable act of nature) or "inherent design flaw under stress" (entrenchment/depth)? Causal selection is central to root cause analysis.
          *   **Law:** Determining "proximate cause" or assigning liability involves heavy causal selection based on norms, foreseeability, responsibility, and abnormality.
      *   **Edges:** It applies less cleanly in situations with:
          *   **Genuinely Singular, Sufficient Causes:** If only one factor was necessary and sufficient (rare outside simple physics or logic), selection isn't needed.
          *   **Pure Statistical Explanation (No Mechanism):** If explanation relies solely on correlation without identifying discrete causal factors, selection doesn't arise in the same way.
          *   **Prospective vs. Retrospective:** While particularly salient in retrospective historical explanation (where the outcome is known and we reason backwards), it also occurs prospectively (e.g., "The *key* risk factor is smoking").

  2.  **Related Concepts & How They Differ:**
      *   **INUS Condition (Insufficient but Necessary part of an Unnecessary but Sufficient set):** As you noted, this describes the *status* of each individual factor within the causal complex. Each factor you list (nationalism, alliances, assassination) for WWI is likely an INUS condition. It explains *why* each factor is part of the causal story logically but does *not* explain why one INUS condition gets picked out as "the cause" over others. Causal selection operates *on* sets of INUS conditions.
      *   **Causal Salience:** This is a *criterion* often used *within* causal selection. A salient factor is one that stands out perceptually or cognitively (like the assassination against the background of European politics). It's one reason why a factor might be selected, but salience itself isn't the overarching practice.
      *   **Explanatory Pragmatism:** This is the broader philosophical view that explanations serve human purposes and are shaped by our interests. Causal selection is a key *manifestation* of explanatory pragmatism in causal contexts. Your historians' shifting criteria based on the "lesson they want to draw" is pragmatic selection.
      *   **Contrastive Explanation:** The idea that explanations often answer "Why P *rather than Q*?" The selected cause is frequently the factor that made the difference between the actual outcome (WWI breaks out) and a specific counterfactual scenario (WWI is narrowly avoided). The *choice* of the contrast (Q) heavily influences which cause appears most relevant/different and thus gets selected. (e.g., Contrasting with "no assassination" makes the assassination salient; contrasting with "no alliance system" makes the alliances salient). This is deeply intertwined with causal selection criteria like abnormality and removability.

  **Conclusion and Suggested Term:**

  *   **Best Fit:** **Causal Selection** is the established, precise term for the *practice* and *problem* you've identified: selecting one factor from a complex set of necessary contributors for explanatory emphasis, using shifting contextual criteria. Your description perfectly captures its core dynamics.
  *   **Why it Fits:** It directly addresses the "selection problem," the shifting criteria (abnormality, entrenchment, contingency, explanatory interest), the fact that disagreements arise from selection priorities rather than factual disputes, and its applicability beyond history (to genetics, accidents, law, etc.).
  *   **Imperfections?** The fit is very good. The minor imperfection is that "causal selection" is a broad category encompassing many contexts. Your specific historical case involves retrospective explanation of complex, contingent events where factors are INUS conditions within a jointly sufficient set. But this *is* a central domain discussed under causal selection.
  *   **Coined Term (If Insisting):** If you felt "causal selection" was too broad, you could emphasize the specific historical context with a term like **Explanatory Privileging in Historical Causation**. However, this is less precise and less recognized than the established term.
      *   *Definition:* The practice in historical explanation of selectively elevating one INUS condition from a complex causal nexus to the status of "primary," "deepest," or "underlying" cause, based on criteria such as abnormality against context, perceived stability/entrenchment, counterfactual removability, or alignment with a desired explanatory narrative or lesson, despite agreement on the factual contribution of multiple necessary factors.

  **In short:** You've hit the nail on the head regarding **Causal Selection**. It's the concept philosophers use to analyze exactly the phenomenon frustrating your book group – the pragmatic, interest-relative act of picking "the cause" from a necessary crowd, and the reasons (abnormality, stability, lesson-teaching) why different historians pick different ones. Understanding this concept should help your group recognize the *kind* of disagreement they're having when discussions get circular, allowing them to explicitly discuss the *criteria* for selection ("Why do *you* think the alliance system is the deepest cause? Is it because it was so entrenched?") rather than just re-litigating the facts.
