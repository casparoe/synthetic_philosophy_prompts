  **Payoff Scheme:**  
  - Players start with **100 "points"** (not real money) for the entire session.  
  - Points convert to prizes (e.g., candy, extra credit) at the end:  
    - 1st place: 5 extra items  
    - 2nd–3rd: 3 extra items  
    - Everyone keeps leftover points as "bragging rights."  

  ---

  #### **Round 1: Baseline (Sunk Costs Present)**  
  **Rules:**  
  - Pairs bid in a live auction for a prize worth **50 points**.  
  - Bidding starts at 5 points, increases by **5-point increments**.  
  - **Both winner and loser pay**: Winner pays their bid and gets 50 points. Loser pays their last bid but gets nothing.  
    *(Example: If bidding stops at 25, winner nets +25 (50 - 25), loser nets -20 (last bid was 20).)*  

  **Isolated Driver:** Classic sunk costs (players feel trapped by prior bids).  
  **Predicted Behavior:** Bidding exceeds 50 points (net loss).  

  ---

  #### **Round 2: Sunk Costs Removed (Refunds)**  
  **Rules:**  
  - Same as Round 1, **except**:  
    - Loser gets a **full refund** of their last bid.  
    - Only the winner pays their bid (and gets 50 points if they bid ≤50).  
    - Players keep their points from Round 1.  

  **Isolated Driver:** Competition ("beating the other guy"). Sunk costs are gone for the loser.  
  **Predicted Behavior:** Bidding still exceeds 50 points. Players escalate to win, not to justify past bids.  

  ---

  #### **Round 3: Anonymous & Fresh Budgets (No History, No Audience)**  
  **Rules:**  
  - **Reshuffle pairs** to new partners.  
  - Each player gets a **fresh 50-point budget** (only for this round). Unused points vanish.  
  - **Secret written bids**: Players write bids privately. Moderator collects and announces only the current bid (e.g., "Bid is now 20").  
  - Bidding stops when one player quits (publicly). Winner pays bid and gets 50 points if ≤50; loser pays nothing.  

  **Isolated Driver:** Pure competition. No sunk costs (fresh budget), no reputation (anonymous), no history.  
  **Predicted Behavior:** Bidding still exceeds 50 points. Escalation is driven by rivalry alone.  

  ---

  #### **Round 4: Bidder Swap (Escalating for Strangers)**  
  **Rules:**  
  - Form **teams of 2** (7 teams total). Teams face off (e.g., Team A vs. Team B).  
  - **Phase 1**: One random member from each team bids live (starting at 5, +5 increments). At **bid 30**, the moderator pauses and **swaps bidders**.  
  - **Phase 2**: The *other* team member takes over. Bidding resumes from 30.  
  - **Outcome**: Winning team gets 50 points (split evenly). Only the winning team pays the final bid (split evenly). Losing team pays nothing.  

  **Isolated Driver:** Reputation/face-saving ("not looking like a quitter"). No sunk costs (new bidder didn’t make prior bids), no personal stakes (escalating for a teammate).  
  **Predicted Behavior:** New bidders escalate beyond 50 points to avoid letting their team down.  

  ---

  ### **Debrief Guide (10 mins)**  
  **Structure:** After all rounds, discuss:  
  1. **Round 1 (Baseline):**  
     - "How high did bids go? Why didn’t you stop when bids passed 50?"  
     - **Map to driver:** Sunk costs ("I had to justify what I’d already spent").  

  2. **Round 2 (Refunds):**  
     - "The loser paid nothing. Why did you keep bidding?"  
     - **Map to driver:** Competition ("I just wanted to beat the other person").  

  3. **Round 3 (Anonymous/Fresh Budgets):**  
     - "No one saw your bids, and you lost nothing from past rounds. Why bid high?"  
     - **Map to driver:** Competition, isolated ("Winning felt urgent, even alone").  

  4. **Round 4 (Bidder Swap):**  
     - "You inherited someone else’s mess. Why escalate?"  
     - **Map to driver:** Reputation/face-saving ("I couldn’t let my team down").  

  **Key Takeaway:**  
  > "Escalation isn’t just a math error—it’s primal. Even when we removed sunk costs (Rounds 2–4), you still bid irrationally high because of competition and ego. Real-world examples: staying in a bidding war, bad relationships, or failing projects."

  ---

  ### **Predictions & Pitfalls**  
  1. **"Doesn’t Count" Argument:**  
     - **Round 2 (Refunds):** Players will say, "But the *winner* still has sunk costs!" This misses the point—the *loser* is free to quit without loss, yet they don’t.  
     - **Rebuttal:** "If sunk costs were the only driver, losers would quit early. Why didn’t they?"  

  2. **What Will Go Wrong (First Time):**  
     - **Round 4 (Bidder Swap):**  
       - **Problem:** New bidders may quit immediately ("not my problem").  
       - **Why:** If teams lack rapport, new bidders feel no obligation to escalate.  
       - **Fix:** Assign teams *randomly* right before Round 4 to build tension.  
     - **General Pitfall:**  
       - Players may collude to keep bids low.  
       - **Fix:** Encourage competition ("This is for ranking!") and use fast-paced bidding.

  ---

  ### **Logistics**  
  - **Materials:** Paper, pens, a public scoreboard.  
  - **Timeline:**  
    - Intro (5 min): Explain rules, points, and the goal ("find why we escalate").  
    - Rounds 1–4 (25 min total): ~6 min per round (1 min setup, 5 min bidding).  
    - Debrief (10 min): Use the guide above.  
    - Payout (5 min): Award prizes based on total points.  

  This design forces players to confront hidden drivers when sunk costs vanish. By Round 4, they’ll see escalation isn’t about logic—it’s about pride, competition, and fear of losing face.
