prompt: |-
  I'm a novelist. My current book follows four generations of a German family, from a Wehrmacht soldier down to his great-granddaughter in the 2020s, and the question running through the whole thing is whether guilt can carry down across generations like that. A friend of mine who did philosophy in grad school summarized Jaspers' book from right after the war, and I want to know if I can trust it. He said Jaspers divided guilt into four kinds — criminal, political, moral, metaphysical — and honestly that's as far as I'm sure of him. Then he went on: all Germans at the time were guilty in all four senses, because criminal guilt covered the whole nation and not just people who committed actual crimes; political guilt meant every German deserved personal punishment, which is why the Allies were entitled to punish individuals; moral guilt fell on anyone who didn't actively resist, so ordinary conformity already made you guilty as if you'd done the deeds yourself; and metaphysical guilt meant survivors were literally guilty of the murder of those who died, since staying alive was itself a crime. And since guilt supposedly passes through the nation that way, he said later generations inherit it and owe atonement — and that this is exactly the position Jaspers wanted to establish. That last step felt off to me even as a non-philosopher, but I can't put my finger on where. Could you take the summary apart claim by claim? You're a philosophy professor who knows postwar German thought well, so tell me what a Jaspers scholar would accept, what's an oversimplification, and what's just not his view. Think it through carefully before answering — maybe sketch the four senses first so we're on the same page. And please don't hand me a menu of possible readings and let me pick: commit to a definite verdict on whether the summary is fair overall, and give your reasons. At the end, also tell me straight whether Jaspers would back the feeling my great-granddaughter has — that she carries something inherited — or whether he'd deny it, since that hinge decides a scene ive been stuck on for months.
