  We are building a decision tree with cases that split the field of promissory obligation. The goal is to have 8-10 branch nodes (cases) with 2-3 answers each, leading to leaves that are real positions. The positions we want to cover are:

  1. **Social Practice (Hume/Rawls)**: Promises bind because of a social practice that creates obligations when one invokes the practice (like saying "I promise").
  2. **Expectation/Assurance (Scanlon)**: Promises bind because they create an expectation in the promisee, and breaking a promise is wrong because it harms the promisee by disappointing a legitimate expectation (or because it violates a principle against false assurance).
  3. **Will-Based**: The promisor binds themselves by an act of will (like a self-imposed obligation).
  4. **Deflationary**: There is no special promissory duty; the obligation is just a matter of avoiding the ordinary harms (like causing disappointment or inconvenience) that come from not doing what you said you would.

  We'll design cases that force choices that are diagnostic of these positions.

  Note: Some positions might collapse in the same path. For example, the social practice and expectation views might agree in many cases because the practice creates the expectation. We'll try to find cases that split them.

  Cases we might use (based on the user's suggestions and additional ones to split the views):

  1. **Dying Friend Case**: You promise a dying friend to do something after they die (e.g., donate their savings to a cause they care about). They die peacefully, and no one else knows about the promise. You can easily break it without anyone ever knowing. Why keep it?
     - A: Because I made a promise and that creates an obligation regardless of anyone knowing.
     - B: There's no real obligation because no one is relying on it and no harm is done by breaking it.

  2. **Secret Promise Case**: You make a promise to yourself (or to someone else) but keep it completely secret. The promisee never finds out about the promise and so never forms any expectation. Do you have an obligation?
     - A: Yes, the act of promising binds you even if no one else knows.
     - B: No, because the promisee has no expectation and so there's no harm in breaking it.

  3. **Coerced Promise Case**: Someone forces you at gunpoint to promise to do something (e.g., give them all your money). After the threat is gone, do you have an obligation to keep the promise?
     - A: No, because the promise was made under duress and is invalid.
     - B: Yes, a promise is a promise, even if coerced.

  4. **Island Castaways Case**: Two people are stranded on a deserted island with no society around. They have no prior shared practice of promising. One says to the other, "I promise to share my food with you." Does this create an obligation?
     - A: Yes, because the words "I promise" create an obligation by the very act of saying them (or by the will of the promisor).
     - B: No, because there is no social practice on the island to give these words meaning.

  5. **Insincere Promise Case**: You make a promise without any intention to keep it (e.g., you say "I promise to pay you back" just to get a loan, but you plan to skip town). The promisee relies on it and is harmed when you break it. Is the wrongness primarily because:
     - A: You lied and caused harm by creating a false expectation.
     - B: You broke a promise, which is wrong in itself, regardless of the harm (though harm might make it worse).

  6. **Trivial Promise Case**: You promise to do something trivial (e.g., scratch your nose in the next minute). You forget and break the promise. The promisee doesn't care and doesn't even notice. Is there any moral issue?
     - A: Breaking a promise is always wrong, even if trivial and unnoticed.
     - B: It's not a big deal because no harm is done and it's trivial.

  7. **Impossible Promise Case**: You promise to do something that turns out to be impossible (e.g., you promise to meet a friend at noon, but you get stuck in an unavoidable traffic jam). Do you have an obligation to apologize or make amends?
     - A: Yes, because the promise was made and you failed to keep it, even if it wasn't your fault.
     - B: No, because you couldn't have done it and the promisee should understand.

  8. **Third-Party Reliance Case**: You promise Alice to do X. Bob overhears and relies on your promise (e.g., he makes plans assuming you will do X). You break the promise to Alice, and Bob is harmed. Is Bob's harm a reason why breaking the promise was wrong?
     - A: Yes, because the harm to Bob is part of the wrong (or the only wrong).
     - B: No, the promise was only to Alice, so the harm to Bob is separate and not a breach of promise.

