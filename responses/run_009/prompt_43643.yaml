     Coerced: A (no) 
     Unheard: B (no) 
     Insincere: A (harm) 
     Third-Party: A (yes) → Deflationary

  And for Expectation/Assurance, it can be:
     Island: B (no) 
     Dying Friend: B (no) 
     Insincere: B (promise-breaking) → Expectation/Assurance

     or 

     Island: B (no) 
     Dying Friend: B (no) 
     Insincere: A (harm) 
     Third-Party: B (only Alice) → Expectation/Assurance

     or

     Island: A (yes) 
     Coerced: A (no) 
     Unheard: B (no) 
     Insincere: B (promise-breaking) → Expectation/Assurance

     etc.

  We see that the tree does not perfectly separate the views, but it gives a good approximation.

  Limitations:
  - The tree cannot separate Social Practice and Will-Based in a few cases (e.g., if in the dying friend case, both would say yes). But by the island case, we split them.
  - The tree might put some people in Expectation/Assurance even if they think the obligation exists without harm in some cases, but in this tree, if they answer no in dying friend or unheard, they go to the harm-related cases.

  We also have a leaf for will-based in two branches: one for coerced=yes, and one for coerced=no and unheard=yes.

  And for deflationary, it's when they reduce everything to harm.

  This should work for the reading group.

