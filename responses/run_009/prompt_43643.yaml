answer: |-
  Below is a decision tree designed to sort non-philosophers into major theories of promissory obligation using concrete cases. The tree has 8 nodes (cases) with 2–3 answers each, leading to 4 leaf positions. Each case is standalone and avoids jargon. Answers are based on intuitive reactions, not prior theory knowledge. 

  **Instructions for your group:**  
  Start at Case 1. Answer based on your gut feeling. Follow the arrows to the next case based on your answer. Your endpoint (leaf) is a philosophical position. Positions are labeled at the end for discussion.

  ---

  ### **Case 1: Island Castaways**  
  *Two people are stranded on a deserted island with no society or rules. One says, "I promise to share my food with you." Does this create a real obligation?*  
  - **A: Yes** → Go to Case 2.  
  - **B: No** → Go to Case 3.  

  ### **Case 2: Secret Promise**  
  *You whisper a promise to a sleeping friend. They never wake up or learn about it. Do you still have to keep it?*  
  - **A: Yes** → Go to Case 4.  
  - **B: No** → Go to Case 5.  

  ### **Case 3: Dying Friend**  
  *You promise a dying friend to donate their savings to charity. They die seconds later and will never know if you do it. Must you donate?*  
  - **A: Yes** → Go to Case 6.  
  - **B: No** → Go to Case 7.  

  ### **Case 4: Coerced Promise**  
  *Someone holds a gun to your head and forces you to promise them $1,000. After you escape, must you pay?*  
  - **A: No** → Go to Case 8.  
  - **B: Yes** → **Position: Will-Based View**.  

  ### **Case 5: Trivial Promise**  
  *You promise to scratch your nose in 5 minutes. You forget, and nobody notices or cares. Was it wrong to break it?*  
  - **A: Yes** → **Position: Will-Based View**.  
  - **B: No** → Go to Case 7.  

  ### **Case 6: Unheard + Dying (Follow-up)**  
  *Same as Case 3 (dying friend), but they were deaf and didn’t hear your promise. Does this change your obligation?*  
  - **A: No, I still must donate** → **Position: Social Practice View**.  
  - **B: Yes, now I don’t have to donate** → Go to Case 7.  

  ### **Case 7: Insincere Promise**  
  *You promise to repay a loan, planning to skip town. The lender trusts you, lends money, and is harmed when you vanish. What’s the core issue?*  
  - **A: The harm you caused by misleading them** → Go to Case 8.  
  - **B: The act of breaking the promise itself** → **Position: Expectation/Assurance View**.  

  ### **Case 8: Third-Party Harm**  
  *You promise to fix a friend’s fence on Saturday. A neighbor overhears, relies on it (e.g., plans a party), and is harmed when you break it. Is the neighbor’s harm part of your wrong?*  
  - **A: Yes** → **Position: Deflationary View**.  
  - **B: No, only your friend’s harm matters** → **Position: Expectation/Assurance View**.  

  ---

  ### **Resulting Positions (Leaves)**  
  1. **Will-Based View**: Promises bind because the promisor’s own act of commitment creates the obligation (e.g., by saying "I promise").  
  2. **Social Practice View**: Promises bind only within a social context—they rely on shared rules/expectations (e.g., Hume/Rawls).  
  3. **Expectation/Assurance View**: Promises bind because they create reasonable expectations in the promisee that must not be betrayed (e.g., Scanlon).  
  4. **Deflationary View**: There’s no special "promissory" duty—only ordinary harms matter (e.g., lying or causing disappointment).  

  ---

  ### **Key Notes for You (the Facilitator)**  
  - **Collapsing Positions**: The Social Practice and Expectation/Assurance views often overlap (e.g., both might say "no" in Case 2 and "yes" in Case 3). The tree separates them with Case 6 (unheard + dying), where Social Practice says obligation persists without expectation.  
  - **Empty/Unreachable Combinations**:  
    - *A → B in Case 4 → B in Case 5*: Coerced "yes" then trivial "no." Rare and unstable—coercion usually voids obligations, so trivial cases shouldn’t bind if coerced ones do.  
    - *A in Case 1 → A in Case 2 → B in Case 4*: Unheard promise binds, but coerced doesn’t. This fits Will-Based views (coercion undermines voluntary commitment) and has a leaf.  
  - **Unseparated Positions**: The tree distinguishes all leaves, but Expectation/Assurance and Social Practice collapse if your group answers identically in Cases 2, 3, and 6 (e.g., "no" to secret/dying/unheard cases). Use Case 6 to force the split.  
  - **Time Estimate**: Takes 5–10 minutes. Plain language and minimal branching keep it accessible.  

  This tree isolates core disagreements using real splits in philosophy (e.g., coercion tests will-based views, dying/secret cases test reliance). Enjoy the discussion!
