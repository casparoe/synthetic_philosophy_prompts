  Third, the norm's flexibility. It *accommodates* steadfastness (we're right!) in other sections but *requires* neutrality only in news. If news adopted steadfastness, they'd alienate readers who expect neutrality. That reveals the norm's core isn't epistemic—it's commercial. Calling claims "false" in news might feel truer, but it risks losing trust (and subscriptions) from dissenters. 

  Finally, the uncomfortable truth: the boundary of "legitimate debate" is political, not evidential. Fluoride denial gets a platform because it has institutional allies, not IQ data. If the paper switched to steadfast news, it would collapse genres, lose perceived objectivity, and polarize audiences. The fact-check column's existence proves adjudication isn't forbidden—it's just quarantined where it won't scare off casual readers.

