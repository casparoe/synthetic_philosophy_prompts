answer: |-
  Your dissection reveals a profound tension in modern journalism between epistemic integrity, institutional pragmatism, and commercial logic. Let's reconstruct the implicit theory behind the "balancing norm" across its philosophical, practical, and commercial dimensions.

  ---

  ### **1. The Implicit Epistemology: Peerhood, Legitimacy, and Audience Trust**
  The balancing norm presupposes a **procedural view of legitimate debate** rather than an evidential one:
  - **Epistemic Peerhood as Institutional Affirmation**: Two sides are treated as "peers" not based on *actual* evidence symmetry (e.g., fluoride/IQ claims vs. gravity denial) but on **institutional recognition**. If a position has credentialed proponents (e.g., a toxicologist), academic journals (however marginal), or organized advocacy, it enters the "legitimate debate" zone. The norm assumes that **institutional presence proxies for epistemic legitimacy**—a social, not scientific, criterion.
  - **Good Faith as Irrelevance**: The norm *does not require* believing opponents argue in good faith. It requires only that **readers perceive the opponent as legitimate**. When the paper withholds adjudication, it’s primarily because **a critical mass of readers sees the "losing" side as valid**—not because the paper endorses their sincerity. This protects the outlet from accusations of bias among those readers.
  - **Journalist as Non-Peer**: The reporter is framed as a **non-expert mediator** between apparent peers. Declaring a side "false" would imply the journalist possesses superior expertise—violating the norm that journalists report *on* experts, *as* non-experts.

  **Key Takeaway**: The norm substitutes **social legitimacy** (credentials, institutional backing) for **epistemic legitimacy** (evidence quality). It’s a concession to pluralism: "If group X exists and speaks, they deserve a voice"—regardless of evidence.

  ---

  ### **2. Genre Consistency: The Compartmentalization of Truth**
  The three genres reflect distinct **epistemic contracts with readers**:
  | **Genre**       | **Epistemic Stance**                     | **Peerhood Assumption** | **Function**                                  |
  |-----------------|------------------------------------------|-------------------------|----------------------------------------------|
  | **News**        | Withholds judgment                       | "Both sides are peers"  | Accessibility: Avoid alienating any reader   |
  | **Fact-Check**  | Adjudicates based on evidence            | "Peers can be wrong"    | Trust repair: Correct claims post-publication |
  | **Editorial**   | Declares winners/losers                  | "No peers, only right"  | Persuasion: Advocate for a position          |

  - **Incoherence?** The system is **pragmatically coherent but epistemically fractured**. The fact-check exists *because* news won’t adjudicate; it’s a pressure valve for accuracy. The boundary of "legitimate debate" is drawn *identically* across genres (e.g., fluoride opposition is "debate-worthy" in news, "false" in fact-check, "wrong" in editorial). This allows the paper to simultaneously:
    - Appease neutrality-expecting readers (news),
    - Appease truth-seeking readers (fact-check),
    - Appease partisan readers (editorial).
    
  - **Why Fact-Checks?** To quarantine adjudication. Calling a claim "false" in news might imply the paper endorses one side; in fact-check, it’s branded as "separate rigor." This protects the news desk’s perceived neutrality.

  ---

  ### **3. Norm Flexibility: Steadfastness vs. Equal Weight**
  The norm **accommodates but does not require** equal-weight epistemology:
  - **Survival under Steadfastness**: A "steadfast" newsroom (declaring winners in news) could retain the *structure* of three genres but would collapse their functions. If news adjudicates, fact-checks become redundant, and editorials lose distinction. The norm persists because it’s **commercially adaptive**, not epistemically rigid. Even steadfast outlets (e.g., partisan press) often mimic "balance" to broaden appeal.
  - **What the Norm Strictly Requires**: Only that **news avoids explicit adjudication** on "legitimate" debates. It *permits* steadfastness elsewhere (e.g., editorials), revealing its core is **procedural neutrality**, not truth-committed egalitarianism.

  ---

  ### **4. The Counterfactual: Adjudication in News**
  If your paper replaced peer-governance with steadfastness in news:
  - **Changes in Practice**:
    - **News as Fact-Check**: Reporters would explicitly debunk false claims (e.g., "The toxicologist’s IQ claim was disproven by [study]").
    - **Genre Collapse**: Fact-checks would merge into news; editorials would amplify news judgments.
    - **Boundary Shifts**: "Legitimate debate" would narrow to evidence-backed positions (e.g., climate denial excluded).
  - **What This Reveals**:
    - **Commercial Reality**: Reader trust metrics would likely polarize: gain trust from evidence-focused audiences, lose it from those valuing "fairness" over accuracy. Subscriptions might dip among groups feeling excluded.
    - **Epistemic Commitment?** Current practice is **commercial logic in epistemic clothing**. The tripartite system maximizes audience capture by segmenting truth-claims. Fluoride opposition gets news space not because it’s evidence-valid but because excluding it risks losing contrarian readers. The fact-check column’s existence proves the paper *knows* the claim is false—but won’t say so in news to preserve reach.

  ---

  ### **The Uncomfortable Answer**
  **The balancing norm is a marketplace survival tactic, not an epistemic principle.** It assumes:
  - Readers are **tribal** (trust hinges on seeing their side represented).
  - Truth is **secondary to perception** (neutrality > accuracy).
  - Journalism’s authority derives from **brokering access**, not arbitrating truth.

  **Why this persists**: The norm shields outlets from backlash in polarized societies. Calling a "peer" wrong in news is high-risk (accusations of bias, lost subscribers); isolating adjudication to fact-checks is low-risk (only engaged readers notice).

  **Your column’s lever**: Expose how "legitimate debate" is defined by **power, not proof**. The toxicologist’s credential mattered more than his evidence being debunked. The paper’s silence in news wasn’t respect for peers—it was fear of readers.
