prompt: |-
  Six months ago I joined the board of a small family foundation whose founding charter directs us to fund work that advances "the widening of human moral concern." The phrase has become a live dispute at our meetings. One faction wants the entire endowment redirected toward farmed-animal welfare, on the grounds that extending concern to animals is the obvious next stage of the widening; another faction insists the next stage is distant poor humans, since most people already extend some inchoate concern to animals while remaining unmoved by strangers abroad. Rather than referee the slogan directly, I have been testing my own judgments about historical cases everyone already agrees on, and my verdicts do not line up the way the slogan predicts.

  Abolition of slavery: moral progress, and plainly the circle widening. Nineteenth-century animal cruelty laws: progress, and widening, extended to beings that cannot reciprocate. Women's suffrage: clearly progress, but I resist calling it widening — even the opponents of suffrage acknowledged that women had interests; the dispute was about standing and power, not membership in the moral community. The growth of concern for distant strangers through famine relief: progress, but the mechanism looks like television and cheap transport rather than moral argument, and I cannot decide whether that matters. Dueling's disappearance: unambiguous moral progress, yet nothing expanded — a permitted practice simply contracted. Corporate legal personhood: the circle of entities with legal standing literally expanded, and no one I know calls that moral progress.

  Is there a principle that captures this pattern? I can dimly see a candidate on which progress consists in the removal of morally arbitrary distinctions rather than in the growth of a boundary, but I cannot tell whether it handles the animal-cruelty case. Please tell me what principle, or small set of candidate principles, best fits my verdicts; what the strongest candidate implies for the causes we might fund — the interests of people not yet born, ecosystems regarded as wholes rather than collections of individuals, perhaps future artificial minds; and, honestly, which of my verdicts the principle cannot accommodate and would force me to give up.
reasoning: |-
  Okay, the user is on the board of a family foundation focused on "widening human moral concern." There's a dispute between funding animal welfare versus distant poor humans. Instead of picking sides, the user has been testing historical cases against their own judgments. They listed several examples like abolition of slavery, animal cruelty laws, women's suffrage, etc., and found that the "widening" metaphor doesn't always fit. For instance, women's suffrage wasn't about including women in the moral community but about power. Corporate personhood expanded the circle but isn't seen as moral progress. 

  The user wants a principle that explains their judgments. They mention possibly removing morally arbitrary distinctions rather than expanding boundaries. But they're unsure if this handles the animal cruelty case. They also want to know what this principle implies for future causes like future generations, ecosystems, or AI. Plus, which of their verdicts might conflict with the principle.

  First, I need to unpack their examples. Slavery abolition: expanding the circle to include enslaved people. Animal cruelty laws: extending concern to non-human beings. Women's suffrage: here, women were already in the moral community; the issue was political rights. Famine relief: concern for distant strangers, driven by technology, not moral expansion. Dueling's end: practice stopped without any expansion. Corporate personhood: legal inclusion without moral progress.

  So the pattern seems to be about removing arbitrary barriers rather than just adding more entities. But animal cruelty is a challenge because it does involve expanding to new entities. How to reconcile that? Maybe the principle is about including entities based on morally relevant traits (like sentience) rather than arbitrary ones (like race or species). For animals, it's recognizing sentience as a valid reason, which was previously ignored arbitrarily.

  Now for the implications: future generations—applying the principle means their interests matter, as excluding them based on temporal distance is arbitrary. Ecosystems: if seen as wholes, the challenge is whether they have morally relevant traits beyond individual organisms. If not, the principle might not support funding them directly. Future AI: if they possess consciousness, excluding them would be arbitrary.

  Conflicts: Corporate personhood—under the principle, expanding rights to corporations isn't progress because corporations lack sentience or consciousness. So the user's intuition holds. But dueling's end is tricky. The user sees it as progress without expansion. The principle might frame it as removing the arbitrary distinction that honor justifies violence, which fits. 

  The user might also be seeking validation of their nuanced view against the board's binary factions. They need a framework to mediate the dispute, showing both animal welfare and global poverty as valid under the principle. Also, considering future causes could align the foundation's strategy beyond the current debate.

  Deep needs: The user likely wants a robust ethical framework to guide funding decisions impartially, avoiding ideological splits. They might also desire intellectual clarity for their own judgments and to communicate a unified vision to the board. Unspoken is the need for practical application—how to allocate resources effectively based on this principle.
answer: |-
  Your analysis reveals a profound insight: moral progress often consists not in expanding a circle, but in **removing morally arbitrary barriers to recognition**. This principle, **"The Elimination of Morally Irrelevant Criteria for Consideration,"** best captures your pattern of judgments. Here's how it fits your cases and implications for funding:

  ---

  ### **The Core Principle**
  **Progress occurs when we stop denying moral consideration based on traits that lack inherent ethical significance** (e.g., species, gender, race, distance) and instead base consideration on **morally relevant capacities** (e.g., sentience, capacity to suffer, autonomy).

  ---

  ### **How Your Verdicts Fit the Principle**
  1. **Abolition of Slavery**:  
     - **Fits**: Race/skin color is morally irrelevant to personhood. Progress removed this arbitrary barrier.  
     - *Widening?* Incidental, not essential.

  2. **Animal Cruelty Laws**:  
     - **Fits**: Species membership is irrelevant to the capacity to suffer. Progress recognized sentience as the relevant criterion.  
     - *Your concern resolved*: It *is* "widening," but driven by removing the arbitrary human/non-human distinction.

  3. **Women’s Suffrage**:  
     - **Fits**: Gender is irrelevant to autonomy and political agency. Progress rejected arbitrary gender-based exclusion.  
     - *Not widening*: Women were always moral patients; suffrage addressed their recognition as moral agents.

  4. **Famine Relief for Distant Strangers**:  
     - **Fits**: Geographic distance is morally irrelevant to suffering. Progress leveraged technology to overcome this arbitrary barrier.  
     - *Mechanism irrelevant*: Whether through empathy or logistics, the outcome removes an arbitrary limitation.

  5. **Dueling’s Disappearance**:  
     - **Fits**: "Honor" is not a morally valid justification for violence. Progress contracted a harmful practice by rejecting arbitrary social codes.  
     - *No expansion needed*: Removing arbitrary justifications suffices.

  6. **Corporate Personhood**:  
     - **Fits**: **Lacks progress** because corporations lack sentience/consciousness—the traits that *should* trigger moral consideration. Granting rights based on legal utility is arbitrary.  
     - *Your verdict upheld*: Expansion ≠ progress if based on irrelevant criteria.

  ---

  ### **Implications for Funding Priorities**
  The principle prioritizes **causes that challenge exclusion based on irrelevant traits**:
  1. **Farmed Animals**:  
     - Strong case: Species is irrelevant to suffering. Funding animal welfare directly removes an arbitrary barrier (speciesism).

  2. **Distant Poor Humans**:  
     - Strong case: National borders/geography are irrelevant to moral worth. Addresses exclusion based on arbitrary distance.

  3. **Future Generations**:  
     - High priority: Temporal distance is irrelevant to the interests of sentient beings. Ignoring them is as arbitrary as ignoring distant humans.

  4. **Ecosystems as Wholes**:  
     - Weak case: Ecosystems lack sentience or interests. Moral consideration should focus on sentient individuals *within* ecosystems (e.g., animals facing habitat loss). Funding conservation for *their* sake fits the principle.

  5. **Future Artificial Minds**:  
     - Conditional priority: If they possess consciousness/sentience, excluding them based on substrate (organic vs. synthetic) is arbitrary. Fund research to define consciousness rigorously.

  ---

  ### **Where the Principle Clashes with Your Judgments**
  1. **Dueling’s Disappearance**:  
     - You call it "unambiguous progress" but resist linking it to expansion. The principle fully supports this: Progress lies in rejecting arbitrary norms, not boundary shifts.

  2. **Animal Cruelty Laws**:  
     - Your hesitation is resolved: Including animals *is* "widening," but only because species was an *arbitrary* barrier. The core remains barrier-removal.

  3. **Corporate Personhood**:  
     - No clash: The principle explains why this *isn’t* progress—rights were granted based on legal utility, not morally relevant traits.

  ### **The One Forced Revision: Famine Relief**
  - **Your view**: Unsure if technological mediation undermines moral progress.  
  - **Principle’s demand**: **Reject this hesitation**. Progress is defined by *outcomes* (reducing arbitrary exclusion), not mechanisms. If TV enables recognizing distant humans, it overcomes an arbitrary barrier—making it moral progress.

  ---

  ### **Strategic Recommendation for the Foundation**
  1. **Reject the "Widening" Framing**:  
     Reframe your mission as **"Eliminating Arbitrary Barriers to Moral Consideration."** This unifies both factions:  
     - **Animal welfare**: Challenges species as irrelevant.  
     - **Global poverty**: Challenges distance/borders as irrelevant.  

  2. **Prioritize Based on Irrelevance**:  
     Fund interventions that:  
     - Target exclusion rooted in clearly arbitrary traits (e.g., species, geography, temporality).  
     - Ignore "expansion" where irrelevant traits aren’t central (e.g., corporate rights).  

  3. **Avoid "Ecosystems as Wholes"**:  
     Moral consideration requires sentience. Fund conservation only to protect sentient beings.  

  4. **Conditional Support for AI Minds**:  
     Fund projects defining consciousness thresholds to prevent future arbitrary exclusion of synthetic sentience.

  ---

  ### **Why This Works**
  Your cases share a meta-pattern: **Progress happens when moral patients are reclassified based on ethically significant traits, not when circles grow.** This principle adjudicates your dispute without choosing sides: both animals and distant humans are excluded based on traits (species, distance) that *should* be irrelevant to their suffering. By funding either cause, you honor the foundation’s true mandate: dismantling arbitrary moral exclusions.
