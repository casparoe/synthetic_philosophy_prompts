prompt: |-
  I've been trying to work out what I actually think counts as moral trade, going by my gut on cases, and I want to know if theres a principle behind my verdicts or whether I'm just pattern-matching. Me and a coworker back different charities but each thinks the other's is mildly good, so we each donate $500 to the other's instead of to our own — obviously moral trade. My sister is vegan for animal-suffering reasons and I quit beef for climate reasons, and we've now agreed she'll fund clean-meat research if I go fully vegetarian — also moral trade, even though our reasons barely overlap. Logrolling in a legislature, two reps swapping votes on bills each dislikes but not that much — structurally similar, but it feels grubbier and I flip-flop on whether it even belongs in the same category. A pure one-sided concession, where I just start donating to your charity because I've come to think your cause is more important — that's not moral trade, that's just me changing my values. And then the case that keeps bugging me: someone whose values I find genuinely abhorrent (say, a sincere racist who thinks majority-white neighborhoods deserve more funding) offers a swap where each of us backs the other's favored policy in domains we don't personally care about. Structurally it's the charity swap again, but I keep feeling I should refuse it, whereas I'd do the charity swap without blinking. So: is there one principle that gets me the coworker deal, the vegan deal, excludes the value change, and handles the racist either way without being ad hoc? If you can't get all my verdicts, tell me which one has to go and why. And whatever principle you land on, I'd like to hear what it predicts for a case I haven't listed — trading with a future AI whose moral views I can't currently evaluate.
reasoning: |-
  Okay, the user is trying to figure out what counts as moral trade based on their gut reactions to different scenarios. Let me start by understanding their examples. They mention a charity swap with a coworker, a deal with their vegan sister, legislative logrolling, a one-sided concession, and a troubling case involving a racist. They want a principle that fits all these cases, except the value change, and can handle the racist scenario without being ad hoc. Also, they want predictions for trading with a future AI.

  First, I need to break down each case. The charity swap and the vegan deal both involve mutual exchange where each party gets something they value in return for giving something the other values. But logrolling feels "grubbier" to them, and the racist case is problematic even though structurally similar. The one-sided concession isn't trade at all, just a change of heart.

  The key here is mutual benefit based on each party's values. In the charity swap, both gain by supporting a cause they find at least mildly good. The vegan deal works because each values the outcome of the other's action (clean meat funding vs. vegetarianism). Logrolling might feel dirty because it involves policies affecting others negatively, which introduces harm. The racist case is tricky because cooperating might enable harmful policies, even if the swap is in a domain the user doesn't care about. But the user’s reluctance suggests an aversion to complicity in harmful values.

  So the principle might be about mutual benefit without direct harm. But in the racist case, even if the specific policy isn't harmful, supporting the racist's agenda could be seen as endorsing or enabling their overall harmful ideology. That complicity is the issue. 

  For the AI case, if the future AI has unknown values, engaging in trade is risky. The user would need to assess if the AI's values align enough to avoid enabling harm. Without knowing, the principle would advise caution. The trade is only moral if the exchanged actions are acceptable within both parties' values and don't cause harm. Uncertainty about the AI's values makes evaluation impossible, so the user should avoid such trades.

  The user's real struggle is balancing structural similarity with moral discomfort in the racist case. They need a principle that incorporates both the mutual benefit and the moral permissibility of the actions involved. Maybe adding a condition that the actions traded must not cause harm or violate core moral principles. That would exclude the racist swap due to potential harm from supporting racist policies, even indirectly. Logrolling might be excluded if the bills cause harm, explaining the "grubby" feeling. 

  The one-sided concession is excluded because there's no exchange; it's a value shift. So the core of moral trade is reciprocal exchange based on differing values, where actions are mutually beneficial and morally permissible. The racist case fails the permissibility test, resolving the discomfort without ad hoc reasoning. For the AI, without knowing if its actions are permissible, the trade is too risky.
answer: |-
  Based on your intuitions across these cases, a single coherent principle emerges: **Moral trade occurs when two or more parties reciprocally exchange actions (or commitments to act) that each party values *more* according to *their own* distinct moral framework than the action they give up, *without* either party undergoing a fundamental change in their core values or endorsing actions they deem intrinsically wrong.**

  Let's break down how this principle captures your verdicts:

  1.  **The Coworker Charity Swap:** Each values the *other's* charity donation (by the coworker) more than their *own* donation to their preferred charity. No value change occurs. **✓ Moral Trade.**
  2.  **The Vegan Deal:** Your sister values your full vegetarianism (reducing animal suffering) more than her funding of clean-meat research. You value her funding clean-meat research (addressing climate) more than your concession to full vegetarianism (beyond quitting beef). Each gets something they value more according to their distinct frameworks. **✓ Moral Trade.**
  3.  **Legislative Logrolling (Your Grubby Feeling Explained):** The *structural* reciprocity exists. However, the "grubbiness" stems from the *content* of the actions. If the bills being traded involve actions either party deems *intrinsically wrong* or *significantly harmful to third parties* (even if they "dislike [them] but not that much"), the trade violates the "without endorsing actions they deem intrinsically wrong" clause. Your flip-flop likely mirrors uncertainty about whether the traded votes cross this threshold. **Likely Excluded or Problematic.**
  4.  **One-Sided Concession:** You change your *evaluation* of the charities, leading to a unilateral action based on your *new* valuation. There's no reciprocal exchange based on differing valuations. **✗ Not Moral Trade.**
  5.  **The Racist Swap (Resolving Your Discomfort):** Structurally reciprocal? Yes. Valued more by each party according to their own framework? Likely yes (racist gets funding for white neighborhood; you get funding for something you care about in a domain you don't). The core problem is the *intrinsic nature* of the racist's preferred action. Funding majority-white neighborhoods based on racist ideology is an action you (presumably) deem *intrinsically wrong* or *fundamentally unjust*, even if you "don't care about" that specific domain. Participating in this exchange involves you *enabling* and *endorsing* (through the trade) an action fundamentally opposed to your core values. The principle excludes it via the "without endorsing actions they deem intrinsically wrong" clause. **✗ Not Permissible Moral Trade.**

  **The Principle:**

  *   **Reciprocal Exchange:** Requires mutual, agreed-upon giving and getting.
  *   **Distinct Valuations:** Each party must value the *action received* more than the *action given up*, according to *their own* moral framework.
  *   **No Core Value Shift:** The trade exploits *existing* differences in valuation; it doesn't cause a fundamental change in the parties' core values (like the concession case).
  *   **No Intrinsic Wrongdoing:** The traded actions themselves must not violate core moral prohibitions or endorse fundamental injustice *as judged by the trading party*. This is crucial for handling the racist case and explaining the grubbiness of logrolling.

  **Handling the Future AI Case:**

  You propose trading with a future superintelligent AI whose moral views are currently unknown and potentially alien or incomprehensible.

  *   **The Challenge:** The key clause is "without endorsing actions they deem intrinsically wrong." You *cannot currently evaluate* whether the AI's proposed action (what you would get it to do) or the action it requests from you (what you would do for it) is intrinsically wrong by *your* standards, because you don't understand its values or the full implications.
  *   **Prediction:** The principle dictates **extreme caution and likely refusal.** Engaging in such a trade would be recklessly gambling that:
      1.  The action you receive isn't something you would later deem horrific.
      2.  The action you perform isn't enabling something horrific by the AI's (alien but potentially valid?) standards, or isn't intrinsically wrong *simpliciter*.
  *   **Why Refusal is Likely:** Without the ability to evaluate the moral permissibility of the traded actions *according to your own framework* (due to incomprehensibility), you cannot satisfy the "no intrinsic wrongdoing" condition. The risk of inadvertently endorsing or enabling profound wrong is too high. This isn't like the coworker swap where you understand the charities; it's profound uncertainty about the moral valence of the actions themselves.
  *   **Possible Exception:** *If* you could be sufficiently confident (somehow) that the traded actions were morally neutral or positive *by your lights*, regardless of the AI's reasons, a trade *might* be possible. But achieving this confidence with an alien superintelligence seems epistemically near-impossible.

  **Which Verdict Might Have to Go (If Forced):**

  If we *must* sacrifice one of your intuitions to achieve perfect coherence under this principle, the most likely candidate is **your ambivalence on legislative logrolling.** The principle draws a reasonably bright line: if the traded votes involve actions the representative deems *intrinsically wrong* (e.g., violating fundamental rights, causing severe unjust harm), logrolling is excluded. If the bills are merely inefficient, favor different constituencies, or involve mild pork-barrel spending that doesn't cross a threshold of "intrinsic wrong," then the principle *would* classify it as moral trade, similar to the charity swap. Your "grubby" feeling might stem from sensing that *most real-world logrolling* involves bills that *do* cause harm or injustice, pushing it over the threshold, making the "clean" case rare. The principle forces a clearer stance based on the content's moral severity.

  **Conclusion:**

  Your intuitions map remarkably well to the principle of **reciprocal exchange of differentially valued actions without core value shift or endorsement of intrinsic wrongdoing.** This cleanly includes the coworker and vegan swaps, excludes the unilateral concession, excludes the racist swap due to endorsement of injustice, explains logrolling's grubbiness via the intrinsic wrong clause, and strongly advises against unknowable trades with a future AI due to the impossibility of evaluating moral permissibility. The principle emphasizes that moral trade isn't just about preference satisfaction; it operates within the boundaries of core moral prohibitions defined by each participant.
