  We are drafting a joint statement for two metaphysicians: a structuralist (defending weak discernibility) and an opponent (defending haecceities). The joint statement should have two main parts: (1) a numbered list of agreed claims and (2) a table of disagreements with each disagreement line including the crux, each side's position, and a test case with both sides' predictions.

  Agreed Claims (to be numbered):
  1. Black's two-sphere universe is a counterexample to the strong version of the Identity of Indiscernibles (IoI), which requires that objects be discernible by monadic properties only.
  2. The weak discernibility strategy claims that the spheres are discernible by an irreflexive relation (e.g., being at a distance D from each other) and thus the IoI holds in a weak form.
  3. The opponent holds that Black's world refutes even the weak form of IoI because the irreflexive relation presupposes numerical distinctness and does not ground it.
  4. Both agree that the case does not turn on substantive assumptions about space (like symmetry) beyond what is needed to set up the scenario. The scenario is set up with symmetric space, but the disagreement is about whether the relation of distance can discern the spheres without presupposing distinctness.
  5. The disagreement is not merely verbal about the meaning of "indiscernible" in the context of IoI. Both agree that the term "indiscernible" in the strong version refers to monadic properties only, and in the weak version to relational properties. However, they disagree on whether relational properties (like weak discernibility) can ground distinctness without circularity.
  6. Both agree that if the world contained only one sphere, it would be qualitatively indistinguishable from a world with two spheres in terms of monadic properties and internal relations (if we consider the one-sphere world as having no relations). However, the structuralist would argue that the one-sphere world is possible and that in the two-sphere world the relation breaks the symmetry, while the opponent would argue that the one-sphere world is not qualitatively indistinguishable because it lacks the relation that requires two distinct objects.

  But note: The opponent might not agree that the one-sphere world is qualitatively indistinguishable. We have to be careful.

  Let me reframe:

  We need to cover:
  - What Black's setup shows: It refutes the strong IoI (monadic discernibility).
  - Whether it refutes weak IoI: Disputed.
  - Whether the case turns on symmetry of space: Both agree that the setup uses symmetric space but that the core issue is about whether relations can ground distinctness without presupposing it.
  - Genuine vs. verbal disagreement: They agree that the term "indiscernible" is being used in two different ways (monadic vs. relational) but that the real dispute is about the grounding of distinctness.

  Agreed Claims Draft:

  1. Black's two-sphere universe, as described, is a counterexample to the strong form of the Identity of Indiscernibles (IoI), which holds that no two distinct objects can share all monadic properties. In Black's world, the two spheres share all monadic properties and are yet distinct.
  2. The weak discernibility strategy, which appeals to an irreflexive relation (such as the relation of being at a fixed distance from each other) to discern the spheres, is intended to preserve a weakened form of the IoI. According to this strategy, the spheres are discernible by a relational property and hence are not identical.
  3. The opponent of weak discernibility contends that the existence of such an irreflexive relation between the spheres already presupposes their numerical distinctness and therefore cannot be what grounds that distinctness. Thus, the opponent holds that Black's world refutes the IoI even in its weak form.
  4. Both parties agree that the Black case does not depend on any substantive assumptions about the symmetry of space beyond what is required to set up a scenario in which two objects have identical monadic properties and stand in symmetric relations. The dispute is not about the physics of space but about the metaphysical principles at stake.
  5. The parties agree that the term "indiscernible" in the context of the IoI is ambiguous: it may refer to monadic indiscernibility (which is present in Black's world) or to relational indiscernibility (which, according to the weak discernibility proponent, is not present). However, they disagree on whether the relational discernibility provided by weak discernibility can serve as a non-circular ground for the numerical distinctness of the objects.
  6. Both parties agree that a world containing only one sphere, qualitatively described in the same monadic terms as each sphere in Black's world, is conceivable. However, they disagree on the implications of such a world for the debate: the structuralist holds that the absence of the irreflexive relation in the one-sphere world (because there is no second sphere) shows that the relation is what makes the difference in the two-sphere world, while the opponent holds that the one-sphere world does not have the same relational structure and thus does not address the issue of grounding distinctness in the two-sphere world.

  Now, the Disagreements Table:

  We are to have a table with the following columns:
  - Crux (the point of disagreement)
  - Structuralist's Position (as they would state it)
  - Opponent's Position (as they would state it)
  - Test Case (a case, thought experiment, or argument that both agree would bear on the crux)
  - Structuralist's Prediction (about the test case, stated in advance)
  - Opponent's Prediction (about the test case, stated in advance)

  We are to have at least three lines (as per the request):

  Line 1: On whether weak discernibility is a legitimate form of discernibility or a smuggling-in of the conclusion.

  Line 2: On the coherence of a one-sphere world and what it establishes about haecceitism.

  Line 3: On the modal status of the IoI (necessary truth, contingent, or norm).

  Additionally, we are to mark ambiguities and explain them.

  Let me draft the table:

  | Crux | Structuralist's Position | Opponent's Position | Test Case | Structuralist's Prediction | Opponent's Prediction |
  |------|--------------------------|---------------------|-----------|----------------------------|------------------------|
  | The legitimacy of weak discernibility as a ground for distinctness. | Weak discernibility, via an irreflexive relation, provides a legitimate qualitative ground for numerical distinctness without presupposing it. | Weak discernibility merely labels the distinctness that is already presupposed and does not provide a non-circular ground. | Consider a world with two identical but non-spatiotemporal objects that stand in a symmetric, irreflexive relation R (e.g., two abstract entities that are mutually complementary in a symmetric way). Can R serve to discern them? | The structuralist predicts that in such a world, R does discern the two objects and is the ground of their distinctness, so they are weakly discernible. | The opponent predicts that the relation R cannot ground distinctness without already assuming there are two objects to stand in R, so the distinctness must be primitive. |
  | The coherence and implications of a one-sphere world. | A world with a single sphere, qualitatively identical to each sphere in Black's world (but without a second sphere), is coherent. The absence of the distance relation in this world shows that the relation is what makes the difference in the two-sphere world, thereby supporting the weak discernibility strategy. | A world with a single sphere is coherent, but it does not show that the relation grounds distinctness in the two-sphere world. In fact, the distinctness of the spheres in the two-sphere world must be primitive (haecceities). Moreover, the opponent may question whether the one-sphere world is qualitatively identical to the two-sphere world from the perspective of one sphere, because the two-sphere world has an additional relational fact. | Consider a world that is exactly like Black's two-sphere world except that one sphere is annihilated. Is the resulting world qualitatively identical to a world that always had one sphere? | The structuralist predicts that the two worlds (the one-sphere world resulting from annihilation and the always-one-sphere world) are qualitatively identical and that the annihilation does not change the qualitative state of the remaining sphere. | The opponent predicts that the annihilation leaves behind a world that is qualitatively different from an always-one-sphere world because the remaining sphere now lacks the relational property it had (being at distance D from the other sphere), but this difference is not intrinsic to the sphere. Alternatively, the opponent might hold that the always-one-sphere world never had that relational property, so they are qualitatively distinct. |
  | The modal status of the Identity of Indiscernibles. | The weak form of the IoI (allowing relational discernibility) is a necessary metaphysical truth. | The IoI (even in weak form) is not a necessary truth; it may hold in some worlds but not in others. Alternatively, it is a norm of conceptual hygiene rather than a metaphysical truth. | Consider a world that is symmetric in all respects (like Black's world) but in which the laws of nature or metaphysics do not permit weak discernibility to ground distinctness. Is such a world possible? | The structuralist predicts that such a world is impossible because the irreflexive relation must always ground distinctness. | The opponent predicts that such a world is possible (or even actual in Black's world) because distinctness is primitive and not grounded in relations. |

  We also need to mark ambiguities.

  The ambiguity in "indiscernible": 
  - Agreed: In the context of the IoI, "indiscernible" can mean either monadically indiscernible or relationally indiscernible. The strong IoI uses monadic indiscernibility; the weak IoI uses relational indiscernibility (or rather, the absence of weak discernibility).

  But note: the opponent might not accept that relational indiscernibility is the same as the absence of weak discernibility. We have to be careful.

  In the agreed claims, we have already noted the ambiguity.

  Another ambiguity: "ground of distinctness". The structuralist takes the relation as the ground, while the opponent thinks that the relation cannot be the ground because it presupposes distinctness.

  We can note in the joint statement: "The term 'ground of distinctness' is used differently: for the structuralist, it means a qualitative feature that explains distinctness; for the opponent, it must be a non-circular explanation that does not presuppose distinctness. This difference in what counts as a ground underlies the dispute."

  Now, let's draft the entire joint statement.

  Note: The joint statement should be in a neutral tone and signed by both.

  Draft:

  **Joint Statement on the Identity of Indiscernibles and Black's Two-Sphere Universe**

  We, the undersigned, have engaged in an adversarial collaboration to clarify our positions and disagreements regarding the Identity of Indiscernibles (IoI) and Max Black's two-sphere universe. We hereby set forth the following agreed claims and persisting disagreements.

  **Agreed Claims:**

  1. Black's two-sphere universe, as a thought experiment, successfully refutes the strong form of the Identity of Indiscernibles. The strong form, which requires that no two distinct objects share all monadic properties, is falsified by the existence of two distinct spheres that are monadic duplicates.

  2. The strategy of weak discernibility, which appeals to an irreflexive relation (such as the spatial distance relation between the two spheres) to discern the spheres, is intended to preserve a weakened version of the IoI. Proponents of this strategy hold that the spheres are discerned by their relational properties and thus are not identical.

  3. Opponents of weak discernibility argue that the existence of such an irreflexive relation between the spheres presupposes their numerical distinctness and therefore cannot serve as the ground of that distinctness. Hence, they maintain that Black's world refutes the IoI even in its weak form.

  4. The dispute between the parties does not turn on any substantive assumptions about the symmetry of space beyond what is required to set up the scenario. The issue is not about the physics of space but about the metaphysical principles of individuation and discernibility.

  5. The term "indiscernible" is ambiguous in the context of the IoI: it may refer to monadic indiscernibility (sharing all monadic properties) or to relational indiscernibility (sharing all relational properties, including those that might be used for weak discernibility). Both parties agree that the spheres in Black's world are monadically indiscernible. They disagree on whether the spheres are relationally indiscernible and, more fundamentally, on whether relational properties can ground numerical distinctness without circularity.

  6. Both parties agree that a world containing a single sphere, having the same monadic properties as each sphere in Black's world, is conceivable. However, they disagree on the implications of such a world for the debate over weak discernibility and haecceitism.

  **Persisting Disagreements:**

  The following table outlines the key points of ongoing disagreement. For each crux, we state our respective positions and identify a test case that both parties agree would bear on the issue. We also provide our predictions about the outcome of the test case, as stated in advance of examining it.

  | Crux | Structuralist's Position | Opponent's Position | Test Case | Structuralist's Prediction | Opponent's Prediction |
  |------|--------------------------|---------------------|-----------|----------------------------|------------------------|
  | The legitimacy of weak discernibility as a ground for distinctness. | Weak discernibility via an irreflexive relation provides a legitimate, non-circular ground for numerical distinctness. | Weak discernibility presupposes the distinctness it purports to explain and is therefore circular; it cannot ground distinctness. | A world with two abstract, non-spatiotemporal objects that are identical in all monadic properties but stand in a symmetric, irreflexive relation R (e.g., mutual complementarity). Can R serve as the ground of their distinctness? | The structuralist predicts that R does ground the distinctness of the two objects, making them weakly discernible. | The opponent predicts that R cannot ground distinctness because it already requires the existence of two distinct objects to stand in the relation. |
  | The implications of a one-sphere world for haecceitism. | A one-sphere world, having the same monadic properties as each sphere in Black's world, is qualitatively identical to the state of one sphere in the two-sphere world if the other is annihilated. This supports that the distance relation in the two-sphere world is what breaks the symmetry and grounds distinctness. | A one-sphere world is coherent, but it does not challenge haecceitism. The two-sphere world requires primitive distinctness (haecceities) to account for the two spheres. Moreover, the one-sphere world is qualitatively distinct from the two-sphere world because it lacks the relational facts. | Consider two worlds: (W1) a world that always had one sphere, and (W2) a world that was initially like Black's two-sphere world but then one sphere is annihilated. Are W1 and W2 at the time after annihilation qualitatively identical? | The structuralist predicts that W1 and W2 (after annihilation) are qualitatively identical: the remaining sphere in W2 loses the relational property but is monadically the same, and there are no other differences. | The opponent predicts that W1 and W2 are not qualitatively identical: W2 has a history that includes a relational fact (the past existence of the other sphere and the distance relation) that W1 lacks, making the worlds qualitatively different. |
  | The modal and epistemic status of the Identity of Indiscernibles. | The weak form of the IoI is a necessary metaphysical truth: in any possible world, numerically distinct objects must be weakly discernible. | The IoI is not a necessary truth. It may be a contingent truth (if the world is structured appropriately) or merely a regulative principle (a norm of conceptual hygiene) without metaphysical necessity. | Consider a world that is symmetric in all respects (like Black's world) and in which there are no irreflexive relations that can be used for weak discernibility. Is such a world possible? | The structuralist predicts that such a world is impossible because distinct objects must be weakly discernible by some relation. | The opponent predicts that such a world is possible because distinctness can be primitive and not grounded in any qualitative relations. |

  **Ambiguities Noted:**

  The parties note that the term "ground of distinctness" is used differently in the debate. For the structuralist, a ground of distinctness is a qualitative feature (such as a relation) that explains why the objects are distinct. For the opponent, a ground of distinctness must be a non-circular explanation that does not presuppose the distinctness it is meant to explain. This difference in what constitutes an acceptable ground underlies the disagreement about weak discernibility.

  Additionally, the term "qualitative identity" may be ambiguous. The structuralist takes it to include relational properties, whereas the opponent may restrict it to monadic properties or include relational properties only if they do not presuppose distinctness. This ambiguity is relevant to the assessment of the one-sphere world and the two-sphere world.

