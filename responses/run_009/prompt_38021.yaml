prompt: |-
  You're a professional philosopher of mind, and you've been hired to facilitate and draft the final document of an adversarial collaboration. The two parties have been arguing for two years about what pain asymbolia shows about the badness of pain. Camp A (call them the dissociationists) hold that asymbolia is the crucial datum: patients who clearly feel pain but shrug it off, joke about it, and don't avoid it show that pain sensation and pain badness are separable, and that the badness lives somewhere other than the raw sensory feel — maybe in an affective dimension, maybe in the imperative or command element of pain. Camp B (the unitarists) think this misreads the data: what asymbolics have is altered pain, or pain plus a weird downstream attitude, and the phenomenal character of pain is evaluative or imperative all the way down, so there's no "neutral pain" for the badness to be separated from in the first place.

  Draft the joint statement both camps could actually put their names on. Structure it as: (1) a numbered section of claims both sides accept — about the clinical phenomenon itself, about which interpretations neither side endorses, and about what findings would NOT settle anything either way; (2) a disagreements table where each side's position is stated in wording that side would itself sign off on, not wording that quietly favors the other; (3) the cruxes — the subquestions such that settling one would move at least one side; and (4) for each crux, a concrete case, thought experiment, or empirical finding both agree would bear on it, with each side's prediction written down in advance. If part of the dispute strikes you as merely verbal (e.g. a fight over the word "pain" rather than over anything substantive), say which part and why. Think carefully and brainstorm what each side genuinely needs conceded before you start drafting — I care more about exact formulations than about volume. No citations needed. Answer in American English.
