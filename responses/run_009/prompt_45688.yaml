answer: |-
  ### Exam Question: "Death in Damascus Revisited"  

  **Background:**  
  A merchant encounters Death in Damascus. Death appears startled, explaining she has an appointment with him tomorrow *in Aleppo* and did not expect to see him in Damascus today. The merchant knows Death’s forecasts about his location at appointment time are 90% reliable. He considers two actions:  
  - **Stay (S):** Remain in Damascus (no travel cost).  
  - **Ride (R):** Travel to Aleppo overnight (costs 1 utility unit).  

  **Utilities:**  
  - Survival in Damascus: 10  
  - Survival in Aleppo: 9 (due to journey cost)  
  - Death: 0  

  Death’s forecast reliability means:  
  - If Death forecasts Aleppo, P(Forecast correct) = 0.9  
  - Similarly for Damascus.  

  **Your Tasks:**  
  1. **Expected Utility (EU) Calculation (8 marks):**  
     Compute the EU of *Stay* and *Ride* under:  
     (a) *Evidential Decision Theory (EDT)*: Use conditional probabilities given your choice.  
     (b) *Causal Decision Theory (CDT)*: Use probabilities unaffected by your choice.  
     **Show all arithmetic explicitly**, including probabilities and utilities.  

  2. **Instability Diagnosis (6 marks):**  
     Explain why CDT’s recommendation becomes unstable when the merchant’s disposition to act is part of Death’s prediction. Clarify:  
     - How the credence *P(Death in Aleppo | Choice)* is derived.  
     - How the agent’s disposition feeds back into this credence.  

  3. **Escape Route Evaluation (6 marks):**  
     Assess whether either proposal resolves the instability:  
     (a) *Ratificationism*: Only choose acts that remain optimal upon learning you will perform them.  
     (b) *Randomization*: Decide via a fair coin flip (e.g., heads = *Stay*, tails = *Ride*).  
     **Critically address**: What does Death’s 90% reliability cover? If it includes predicting the coin’s outcome, does this help? If not, why might randomization fail?  

  ---

  ### Model Answer (650 words)  

  #### **1. Expected Utility Calculations**  
  Let \( D_A \): "Death in Aleppo", \( D_D \): "Death in Damascus". Death forecasts the merchant’s location, and reliability = 0.9. The merchant’s choice *provides evidence* of Death’s location because Death predicted accurately with 90% probability.  

  **(a) Evidential Decision Theory (EDT):**  
  EDT uses conditional probabilities \( P(\text{outcome} \mid \text{choice}) \).  
  - If merchant chooses *Stay (S)*:  
    \( P(D_D \mid S) = 0.9 \) (since Death likely predicted Damascus correctly),  
    \( P(D_A \mid S) = 0.1 \).  
    EU(S) = [P(D_D | S) × Utility(survive Damascus)] + [P(D_A | S) × Utility(death)]  
          = [0.9 × 10] + [0.1 × 0] = 9.0.  

  - If merchant chooses *Ride (R)*:  
    \( P(D_A \mid R) = 0.9 \) (Death likely predicted Aleppo correctly),  
    \( P(D_D \mid R) = 0.1 \).  
    EU(R) = [P(D_A | R) × Utility(survive Aleppo)] + [P(D_D | R) × Utility(death)]  
          = [0.9 × 9] + [0.1 × 0] = 8.1.  

  **EDT recommends *Stay* (9.0 > 8.1).**  

  **(b) Causal Decision Theory (CDT):**  
  CDT uses causal probabilities. The choice does *not* affect Death’s location; it only affects the merchant’s location. Assume \( P(D_A) = P(D_D) = 0.5 \) (no prior information).  
  - *Stay (S)*:  
    Survives if Death not in Damascus: EU(S) = [P(D_D) × 0] + [P(D_A) × 10] = [0.5 × 0] + [0.5 × 10] = 5.0.  
  - *Ride (R)*:  
    Survives if Death not in Aleppo: EU(R) = [P(D_A) × 0] + [P(D_D) × 9] = [0.5 × 0] + [0.5 × 9] = 4.5.  

  **CDT recommends *Stay* (5.0 > 4.5).**  

  *Note: Both theories agree here, but for different reasons. EDT conditions on evidence; CDT isolates causality.*  

  ---  

  #### **2. Instability Diagnosis**  
  The instability arises because Death’s forecast accounts for the merchant’s *disposition*. Suppose the merchant becomes inclined to *Ride*. This disposition is evidence that Death forecasted Aleppo, so \( P(D_A \mid \text{inclination to Ride}) = 0.9 \). Under CDT:  
  - EU(R) = [P(D_D) × 9] = [0.1 × 9] = 0.9 (since \( P(D_D) = 1 - P(D_A) = 0.1 \))  
  - EU(S) = [P(D_A) × 10] = [0.9 × 10] = 9.0.  

  CDT now recommends *Stay* (9.0 > 0.9). But if the merchant shifts disposition to *Stay*, \( P(D_D \mid \text{inclination to Stay}) = 0.9 \), making EU(S) = [0.1 × 10] = 1.0 and EU(R) = [0.9 × 9] = 8.1, so CDT recommends *Ride*. This creates a feedback loop: whichever act seems optimal becomes suboptimal once the agent leans toward it. The credence \( P(D_A) \) depends on the agent’s predicted disposition, which is influenced by their deliberation.  

  ---  

  #### **3. Escape Route Evaluation**  
  **(a) Ratificationism:**  
  An act is "ratifiable" if it maximizes EU conditional on being chosen. Here:  
  - If choosing *Stay*, EU(S) = 9.0 (EDT) > EU(R) = 8.1 → Ratifiable.  
  - If choosing *Ride*, EU(R) = 8.1 < EU(S) = 9.0 → Not ratifiable.  
  Thus, *Stay* is ratifiable, *Ride* is not. **This resolves instability by selecting *Stay*.**  

  **(b) Randomization:**  
  Suppose the merchant flips a fair coin to decide. Critically:  
  - **Case 1: Death predicts coin flips.**  
    Reliability = 0.9 applies to the outcome (e.g., if coin lands *Ride*, Death predicts Aleppo with 90% accuracy). Then:  
    \( P(\text{Death in Aleppo} \mid \text{coin shows Ride}) = 0.9 \), so survival chance remains 10% regardless of action → EU = 0.1 × 9 (if Ride) or 0.1 × 10 (if Stay) → No improvement.  
  - **Case 2: Death cannot predict coins.**  
    Randomization breaks the link between disposition and forecast. Now \( P(D_A) = P(D_D) = 0.5 \).  
    EU(Stay) = 5.0, EU(Ride) = 4.5 → *Stay* is best. However, if the *coin flip itself* is part of the agent’s disposition, Death may predict it, reverting to Case 1.  

  **Verdict:** Ratification works; randomization works only if Death cannot predict the device (but 90% reliability suggests she can).  

  ---  

  ### Marking Scheme (Total: 20 marks)  

  | **Must-Hit Points**                                                                                                | **Marks** | **Common Failures**                                                                 |
  |-------------------------------------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|
  | **1. Correct EDT EU calculation** (Show P(outcome\|choice), utilities, arithmetic)                                | 4         | Omits utility cost for riding; miscomputes P(D_A \| R) as 0.1.                     |
  | **2. Correct CDT EU calculation** (Fixed P(outcome), causal independence; arithmetic)                             | 4         | Uses conditional probabilities; assumes P(Death) depends on choice.                |
  | **3. Instability explanation** (CDT flip due to disposition→credence feedback; credence from 90% reliability)     | 4         | Describes loop without linking to credence; misses source of P(Death).             |
  | **4. Escape route critique** (Ratification: Stay ratifiable; Randomization: Distinguishes predictable vs. not)     | 4         | Claims randomization always works; ignores Death’s ability to predict the device. |
  | **5. Synthesis** (Notes agreement in recommendation but profound disagreement in rationale; implications for debate) | 4         | Only states agreement; does not contrast EDT/CDT reasoning.                      |  

  **Grading Thresholds:**  
  - **A (17–20):** Hits all 5 points + explicitly notes that agreement here *does not* reconcile theories (EDT relies on correlation, CDT on causal structure).  
  - **B (13–16):** Hits points 1–4 but misses synthesis (e.g., omits why agreement is coincidental).  
  - **C (9–12):** Major errors in EU (e.g., swaps EDT/CDT probabilities) or instability mechanism.  
  - **D (5–8):** Incomplete calculations; superficial treatment of escape routes.  
  - **F (0–4):** No coherent application of decision theories.  

  ---  
  **Rationale for Design:**  
  This question avoids "textbook" answers by using asymmetric utilities (9 vs. 10) and demanding explicit math. It forces engagement with the prediction-disposition loop and tests nuanced evaluation of escape routes. The marking scheme prioritizes conceptual precision over rote recall, rewarding attention to probability sourcing and feedback mechanisms.
