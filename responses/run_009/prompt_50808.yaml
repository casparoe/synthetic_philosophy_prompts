prompt: |-
  You are a professional epistemologist whose speciality is the area around the ethics of belief, and you are good at telling genuinely distinct concepts apart from near neighbours that share a name. Please think carefully before answering and survey the plausible candidates rather than settling on the first one that sounds close; if what I describe fits nothing established, say so plainly rather than stretching a term to cover it.

  I keep running into the following asymmetry, and I cannot find a name for it. When someone believes something ahead of sufficient evidence and turns out to be wrong, they are blamed as credulous or reckless. When someone withholds belief in the same situation and, because they withheld, misses out on something good — the trust that was needed to save a collaboration, the confidence that was needed to attempt something difficult, the early commitment to an idea that needed early believers in order to get off the ground at all — nobody is blamed. The withholder is called prudent, cautious, sensible, even when the loss traces back to the withholding just as directly as the credulous person's loss traces back to their believing. It is as though the withholding of belief were thought to be an action with no costs of its own, a neutral waiting room outside the flow of events, whereas believing is thought to put you inside the flow. But in the cases I care about, the option is forced in William James's sense: the evidence will not arrive in time, and by the time it arrives, the belief would make no difference — the friend will have taken the offer elsewhere, the attempt will not have been made. In those cases waiting is choosing, and it carries a risk of exactly the same kind as the risk of believing.

  Two features seem to me essential to the phenomenon, and I want them preserved in whatever we call it. First, it is an asymmetry of appraisal, not of fact: the world punishes both parties about equally often; only the blame is distributed unequally. Second, it is not about wishful thinking — the early believer need not want the belief to be true; they may simply judge that the expected value lies with believing, and still be blamed in a way the withholder never is.

  I know this is adjacent to the James–Clifford debate — Clifford's duty to believe only on sufficient evidence, and James's permission for forced and momentous options. James does remark, in effect, that a policy of thinking which would prevent one from acknowledging certain kinds of truth, were those kinds of truth really there, would be an irrational policy; but that is a complaint against a policy, not a name for the asymmetry of blame I am after. Clifford, for his part, treats the duty of inquiry as obviously worth its costs. I have also wondered whether the right home is the recent work on suspension of belief as an attitude in its own right, or the literature on epistemic versus practical rationality, or something in the moral luck discussion — the early believer who turns out right gets no credit, which looks structurally like luck. I cannot tell which of these, if any, fits, and I do not want the concept stretched to cover my case.

  So, my question: does this asymmetry have an established name? If not, I would like you to coin one, with a definition precise enough to distinguish it from (a) the Jamesian permission to believe on passional grounds, (b) plain evidentialism, (c) risk aversion, and (d) the general observation that inaction is often a form of action. Please organize your response as follows, in this order:

  1. Verdict — a direct answer in three or four sentences: is there an established name, and if not, what is the nearest existing discussion? (roughly 100 words)
  2. Nearest concepts — the two or three closest existing ideas, and for each, what it gets right about my description and where it parts company from it. (roughly 300 words)
  3. Definition — a statement of what the phenomenon is, what it is not, and where its edges lie, including at least one boundary case in which it is unclear whether we have the phenomenon or something nearby. (roughly 250 words)
  4. Proposed term — if nothing established fits, a name with a one-sentence definition, plus a note on which further cases the name should and should not be applied to. (roughly 150 words)

  The name itself matters little to me; the carving does. A bare label, or a label attached to a paragraph of throat-clearing, will not be useful. If you think the phenomenon decomposes into two or three already-named things with no residue, say that, and show me where the seams are.
reasoning: |-
  Alright, the user is asking about an asymmetry in how we judge people based on their belief decisions. They notice that when someone believes too early and is wrong, they're blamed for being reckless. But if someone withholds belief and misses out on a good opportunity, they're seen as prudent, even though the outcome is similarly negative. The user wants to know if there's a name for this asymmetry.

  First, I need to recall related concepts. The James-Clifford debate comes to mind. Clifford emphasizes evidence-based belief, while James allows for passional grounds in forced decisions. But the user already mentioned this and feels it doesn't quite fit because they're focused on the blame asymmetry, not the permissibility of belief.

  Then there's epistemic risk aversion. People might avoid believing due to fear of error, which aligns with the cautious behavior described. But the user points out that the asymmetry is in social blame, not just personal risk preference. So this concept misses the appraisal aspect.

  Moral luck is another angle. The outcome affects judgment, like when someone's action leads to harm by chance. Here, the early believer is blamed if wrong, but the withholder isn't blamed for missing out. However, moral luck usually involves actions, not belief attitudes. The user's case is about the stance of belief itself, not the consequences of actions taken because of belief.

  The ethics of belief literature discusses duties around believing, but often focuses on evidence. The user's scenario involves practical consequences of withholding belief, which isn't typically covered. Suspension of judgment is treated as epistemically neutral, but here it has practical costs.

  I think there isn't an established term for this specific asymmetry. The closest discussions are moral luck and James's forced options, but they don't address the unequal blame. The user needs a new term that captures the blame imbalance for symmetric risks. 

  Proposing "doxastic outcome asymmetry" or "doxastic blame asymmetry" because it centers on belief (doxastic) and the uneven judgment based on outcomes. The definition must highlight that both decisions have risks, but society blames only one. It shouldn't apply to cases without forced options or where evidence eventually arrives. 

  Also, distinguishing from risk aversion: it's about social appraisal, not personal preference. And from moral luck, which deals with actions, not belief states. The user's key points are preserved: the asymmetry in blame, not outcomes, and no wishful thinking involved.
answer: |-
  ### 1. Verdict  
  There is no established name for this precise asymmetry of blame. The nearest discussions are in the ethics of belief (James-Clifford debate), moral luck, and epistemic risk aversion, but none capture the *asymmetric social appraisal* of symmetric practical risks from belief-formation versus withholding. James’s "forced option" describes the situational structure, while Nagel/Williams-style moral luck addresses outcome-dependent blame—but both fail to isolate the unique *immunity from criticism* granted to withholders despite equivalent losses. The phenomenon resides at the intersection of these fields but remains conceptually distinct.

  ---

  ### 2. Nearest Concepts  
  - **Moral Luck (Nagel/Williams)**:  
    **Right**: Captures how outcomes affect blame for equivalent initial choices (e.g., reckless drivers: one hits a pedestrian, one doesn’t).  
    **Wrong**: Focuses on *actions* (e.g., driving) and *external* consequences. Your case concerns *doxastic attitudes themselves* (believing/withholding) and *internal* appraisal norms. Withholders face no analogue of "negligent omission" blame even when harm occurs—immunity is baked into epistemic norms.  

  - **Jamesian Forced Options**:  
    **Right**: Identifies scenarios where evidence is insufficient, delay is costly, and belief has pragmatic stakes ("genuine option").  
    **Wrong**: James defends *permissibility* of early belief but doesn’t diagnose the *asymmetric blame* for symmetric losses. His framework permits belief but doesn’t condemn withholding as equally risky—it remains "prudent" by default.  

  - **Epistemic Risk Aversion**:  
    **Right**: Explains withholding as avoiding error-risk, aligning with "prudent" labels.  
    **Wrong**: Treats aversion as a personal cognitive bias, not a *social* asymmetry in blame assignment. Your phenomenon persists even when both parties identically calculate expected value—the *social penalty* falls only on the early believer who errs, not the withholder who misses gains.  

  ---

  ### 3. Definition  
  **Phenomenon**: A social-epistemic asymmetry wherein (a) in forced, momentous choices with insufficient evidence, (b) erroneous belief attracts blame (e.g., "reckless"), but (c) losses from withholding belief (e.g., missed opportunities) do *not* attract symmetrical blame—withholders are instead praised as "cautious"—despite both stances carrying equivalent practical risks.  

  **Boundaries**:  
  - **Not mere inaction bias**: Inaction (e.g., not vaccinating) often draws blame if harms arise. Here, *withholding belief* is uniquely shielded.  
  - **Not evidentialism/cliffordism**: Clifford condemns *all* insufficiently supported belief, but doesn’t address the *absence* of criticism for costly withholding.  
  - **Edge Case**: A scientist withholds belief in a colleague’s theory, causing the colleague to abandon a line of research that later proves groundbreaking. If the scientist is criticized for "excessive skepticism," this edges *out* of the phenomenon (blame symmetry). If critics instead say "they were right to demand evidence," it edges *in* (withholder’s costly choice is still excused).  

  ---

  ### 4. Proposed Term: **Doxastic Blame Asymmetry**  
  **Definition**: *The systematic imbalance in social appraisal whereby erroneous belief in forced options is condemned as credulous, but equivalent losses from belief-withholding are exempt from parallel criticism and instead valorized as prudent.*  

  **Application Guide**:  
  - **Apply to**: Cases meeting all criteria in §3, especially where (i) evidence is time-limited, (ii) belief/withholding alters outcomes, and (iii) social responses diverge despite symmetric risks.  
  - **Exclude**: (a) General risk aversion (no blame asymmetry); (b) Outcomes from *acts* based on beliefs (e.g., investing) — focus is on the *doxastic stance itself*; (c) Scenarios where withholders *are* blamed for opportunity costs (e.g., "you were too skeptical").  

  **Note**: This term carves a niche between moral luck (which lacks the doxastic focus) and epistemic consequentialism (which addresses trade-offs but not blame asymmetry). It isolates the unacknowledged *social cost* of evidentialist norms.
