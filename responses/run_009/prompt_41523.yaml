prompt: |-
  I sit on the grants committee of a mid-sized private research foundation that disperses roughly $15 million a year in small awards, most under $200,000, across the life sciences. Our new director is an enthusiast for futarchy — Robin Hanson's scheme in which prediction markets settle factual questions while trustee and committee deliberation settles the value questions — and she has persuaded the board to consider a two-year pilot. As she describes it: for each proposal, alongside the usual peer review, we would open an internal market on whether the project, if funded, would hit a designated measurable target within two years (a follow-on grant, a registered trial, an independently verified benchmark result). The markets would run on a logarithmic market scoring rule so that the foundation subsidizes liquidity; every staff member and committee member would receive a capped annual token budget so that no one can dominate prices; and program officers sponsoring the work would be allowed to trade, the theory being that they hold exactly the local knowledge the mechanism is meant to harvest. Wherever a market's closing price placed a proposal's success probability more than twenty points below the committee's sealed median estimate, the proposal would be declined or returned regardless of review scores. The director's flagship argument is that peer review is where prestige bias and motivated reasoning do their worst, and that forcing people to back their opinions with scarce tokens is the cheapest discipline we will ever buy.

  Draft the short decision memo I will circulate before the March meeting — recommend adopt, reject, or adopt with conditions, with reasons the director could actually respond to, and a candid statement of the strongest consideration on whichever side loses. In drafting it, please take seriously at least three points the pilot's boosters have not thought through. First, the choice of measurable target looks like a technicality but does all the values work: which outcomes count as success is precisely the question futarchy assigns to non-market judgment, so the pilot relocates our hardest problem rather than solving it, and grantees will optimize whatever metric we pick. Second, our traders are not the profit-seeking speculators the mechanism assumes: they are employees with career stakes, friendships, and sincere commitments to particular research programs, holding small budgets in thin subsidized markets — conditions under which prices are cheap to move for reasons unrelated to accuracy, and in which the profit available to a correcting trader is too small to attract one. Third, whatever you recommend, the memo should specify what would count, two years from now, as evidence that the recommendation was right, so that it functions as a self-assessing document rather than a one-off policy memo.
reasoning: |-
  Hmm, the user is on a grants committee for a life sciences foundation, and they need me to draft a decision memo about implementing a futarchy pilot program. This is quite an interesting scenario with several layers to consider.

  The director wants to use prediction markets to evaluate grant proposals alongside traditional peer review. The key elements include: logarithmic market scoring rule for liquidity, capped token budgets for staff, allowing program officers to trade, and an automatic decline rule when market probability is 20% below committee estimates. The director's main argument is that this will counter prestige bias and motivated reasoning in peer review.

  But the user has raised three significant concerns that need addressing in my memo:
  First, choosing the measurable success metric is actually a value judgment disguised as a technicality - futarchy assigns this to non-market judgment but doesn't solve the core problem of defining what "success" means, and grantees will inevitably optimize for whatever metric we select.

  Second, the traders aren't typical market speculators - they're employees with career stakes, friendships, and research commitments. With small budgets in thin markets, prices could be easily manipulated for non-accuracy reasons, and there's insufficient profit incentive for correction.

  Third, whatever I recommend, the memo needs to specify what would count as evidence of success or failure in two years, making it self-assessing.

  I should structure the memo to recommend adopting with conditions, since an outright rejection might seem too conservative for a pilot, but a full endorsement ignores the valid concerns. The conditions should address the three key issues.

  For the success metric problem, I'll propose a condition that requires explicit justification for each target and documentation of why it serves the foundation's mission. For the trader incentives issue, I'll suggest anonymizing trades and implementing safeguards against manipulation. And for the evaluation framework, I'll outline specific metrics to track during the pilot.

  The strongest argument for adoption is addressing prestige bias in peer review, while the strongest against is that thin markets with conflicted traders may produce noise rather than signal. I need to present both sides fairly while making a clear recommendation.

  The memo should be concise yet comprehensive, using formal memo structure with clear sections: recommendation, reasons, conditions, and evaluation framework. I'll make sure it serves as both a decision document and a future evaluation tool.
answer: |-
  ## MEMORANDUM

  **TO:** Grants Committee Members  
  **FROM:** [Your Name], Committee Member  
  **DATE:** February 26, 2024  
  **SUBJECT:** Recommendation on Futarchy Pilot Program  

  **RECOMMENDATION:** Adopt the futarchy pilot program for a two-year period **with the following critical conditions** (outlined in detail below).

  **REASONS FOR CONDITIONAL ADOPTION:**

  1.  **Addressing Core Weaknesses of Peer Review:** The Director correctly identifies significant flaws in traditional peer review (prestige bias, motivated reasoning). The pilot offers a novel, potentially high-reward mechanism to surface hidden information and force concrete commitment to judgments, which merits exploration. The potential cost of bias in our current system justifies testing a disciplined alternative.
  2.  **Pilot Scope Allows for Controlled Experimentation:** A limited two-year pilot on a subset of proposals provides a manageable framework to test the core hypothesis – whether market-based predictions add unique value beyond committee deliberation – without overhauling our entire process.
  3.  **Conditions Mitigate Identified Systemic Risks:** The Director's proposal is conceptually sound but underestimates specific vulnerabilities inherent in our context. The conditions below are designed to protect the pilot's integrity and ensure we gather meaningful data.

  **CRITICAL CONDITIONS FOR ADOPTION:**

  1.  **Rigorous Success Metric Design & Oversight:**
      *   For *each proposal* entering the market, the Program Officer (PO) *must* draft a justification for the chosen measurable target (e.g., follow-on grant, registered trial, benchmark result), explicitly linking it to the foundation's strategic goals and the project's *intended* scientific impact. This justification must be reviewed and approved by a rotating subcommittee *before* the market opens.
      *   This forces explicit articulation of the "values" question (why *this* outcome signifies success for *this* project) and creates an auditable trail, addressing the concern that metric choice is the relocated hard problem. It also discourages blatant metric gaming by requiring justification based on scientific merit.

  2.  **Enhanced Market Safeguards Against Distorted Incentives:**
      *   **Anonymized Trading:** All trades must be executed anonymously within the system to mitigate social pressure, retaliation fears, and reputation-based trading unrelated to true belief.
      *   **Mandatory Post-Market Commentary:** Any trader holding a significant position (>10% of their quarterly budget) at market close *must* provide a brief, anonymous comment justifying their position based on project merits/risks. This surfaces reasoning and deters purely manipulative or loyalty-based trading.
      *   **Independent Liquidity Provision (Optional but Recommended):** Explore allocating a small pool of foundation funds to an independent third-party (e.g., a designated economist consultant) to act as a passive liquidity provider, dampening volatility and improving price discovery in these thin, non-profit-driven markets.

  3.  **Pilot Evaluation Framework Defined Upfront:**
      *   The pilot's success or failure in two years will be judged against **specific, pre-defined criteria:**
          *   **Predictive Accuracy:** Did the market probability (converted from LMSR price) demonstrably outperform the median committee estimate *and* the peer review score in predicting actual achievement of the designated metric? (Requires tracking outcomes for all pilot proposals).
          *   **Value of Divergence:** When the market triggered an automatic decline (>20 points below committee), was the committee's subsequent review (knowing the market signal) convinced the decline was justified in most cases? Track the proportion of auto-declined proposals where the committee, upon re-review, upheld the decline vs. overrode it (and why).
          *   **Impact on Process:** Did markets surface *novel, consequential information* not captured in peer review or committee discussion (measured via post-commentary analysis and PO interviews)? Did the mechanism disproportionately impact certain types of proposals (high-risk, interdisciplinary, early-career PI)?
          *   **Operational Burden:** Was the administrative overhead (metric design/approval, market setup, trader management, commentary collection) justified by the perceived benefits?
          *   **Unintended Consequences:** Evidence of metric distortion, increased conservatism, or detrimental effects on PO-grantee relationships or internal morale.

  **STRONGEST CONSIDERATION FOR ADOPTION:** If peer review bias is as pervasive and costly as argued, failing to experiment with a rigorous, market-based corrective risks perpetuating suboptimal funding decisions that misallocate millions of dollars annually and stifle genuinely innovative science. The pilot offers a unique, disciplined mechanism to potentially unlock superior predictive insights at low marginal cost.

  **STRONGEST CONSIDERATION FOR REJECTION (CANDIDLY STATED):** The pilot risks substituting the noise of thin, conflicted internal markets for the perceived signal of peer review. Staff, acting as non-speculative traders with small stakes, diverse loyalties, and career concerns, may generate prices reflecting internal politics, social dynamics, or risk aversion rather than genuine project potential. This "market signal" could then mechanically override thoughtful committee deliberation based on deeper expertise, potentially rejecting high-value, high-risk science based on spurious or manipulated predictions, while creating significant administrative burden and potentially demoralizing POs. The cost of these potential errors and disruptions during the pilot might outweigh the theoretical benefits.

  **CONCLUSION:** The potential upside of mitigating peer review bias warrants testing the futarchy concept. However, the identified risks – particularly regarding metric gaming and distorted trader incentives – are substantial and inherent to our institutional context. **Therefore, adoption is recommended ONLY with the stringent conditions outlined above.** These conditions are designed not to cripple the pilot, but to ensure it generates interpretable data, protects against the most predictable failure modes, and provides a clear basis for a definitive go/no-go decision in two years based on pre-agreed evidence. I move that we vote on this conditional adoption proposal at the March meeting.

  **ATTACHMENT:** Draft Pilot Protocol Document incorporating above conditions (to be circulated separately).
