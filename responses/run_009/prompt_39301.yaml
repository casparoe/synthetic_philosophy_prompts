  I need to create a structured procedure with clear questions that writers can answer in about 10 minutes. The questions should help determine if a story connects to deeper structural issues (Braudel's "longue durée" or "conjunctures") or if it's just surface-level "events." The procedure must indicate when a question can be answered from existing clips versus when it requires editor judgment. Each step needs pass/fail outcomes that lead to clear instructions.

  For the worked examples, I'll use the three scenarios they provided: a regional bank failure, rising food bank usage, and a coastal fishery collapse. Importantly, I need to include a case where the procedure rejects the editor's preferred interpretation (they want the bank failure to be about regulatory erosion, but I'll show where that breaks down). This will demonstrate the procedure's rigor.

  The closing sections should address the procedure's limitations - particularly whether fast events can actually reset slow structures (a crucial Braudelian tension), and who can override the procedure. This acknowledges the necessary role of editorial judgment while providing structure.

