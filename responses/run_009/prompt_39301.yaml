  For the bank failure example, I'll deliberately construct it so it fails to meet the structural take threshold - forcing the editor to confront that their preferred angle requires stronger evidence. This meets their request to "show exactly where it stops" them. The food bank case clearly passes as structural, while the fishery collapse sits in the intermediate "conjuncture" tier - showing the full spectrum.

  The key is balancing Braudel's insight with newsroom pragmatism. The procedure shouldn't be a straitjacket but a forcing function for evidence-based framing. By specifying when questions escalate to the editor, I'm building in necessary flexibility while reducing arbitrary advocacy in meetings.
answer: |-
  ## The Procedure: Braudel Filter for News Pitches

  This 5-step procedure applies Braudel's temporal layers to news items. Writers answer sequentially; any FAIL ends the process with "Cover as Event/Brief." PASS allows proceeding. Answer based solely on *verifiable evidence available now* (clip files, reputable reports, expert consensus). Goal: Filter out pure "event foam" to find underlying structural currents.

  1.  **The Trigger Check (Fact Checkable by Junior Writer):**
      *   **Question:** Is this event/phenomenon *solely* explained by a single, recent, discrete action or occurrence (e.g., a specific vote, storm, crime, CEO decision, one-off error)?
      *   **PASS:** No, OR yes but the single event is demonstrably linked to a pre-existing, documented vulnerability/pattern. (Proceed to Step 2).
      *   **FAIL:** Yes, and no clear, documented link to a deeper pattern exists in the available evidence. **Action: Cover as Event/Brief.** (Stop).

  2.  **The Pattern Recognition Test (Primarily Fact Checkable by Junior Writer):**
      *   **Question:** Does verifiable evidence (reports, data series, expert analysis) show this specific event is part of a *recurring, documented pattern* (e.g., multiple similar bank failures, consistent annual rise in a metric, repeated failures of a specific regulation)?
      *   **PASS:** Yes, a clear pattern is documented and directly relevant. (Proceed to Step 3).
      *   **FAIL:** No, this appears isolated or the pattern is anecdotal/unproven in the evidence. **Action: Cover as Event/Brief.** (Stop).

  3.  **The Structural Link Test (Requires Editor Judgment):**
      *   **Question (To Editor):** Does the documented pattern identified in Step 2 reveal a demonstrable connection to a *slow-moving structure* (Braudel's "longue durée" - e.g., deep-seated policy shifts, demographic changes, long-term environmental shifts, fundamental technological disruption, entrenched inequality) OR a *significant intermediate rhythm* (Braudel's "conjunctures" - e.g., multi-year economic cycles, institutional decay/transformation, evolving social norms, systemic regulatory failure)? *Focus: Is the pattern a symptom or consequence?*
      *   **PASS:** Yes, the evidence strongly suggests the pattern is a direct consequence of the identified slow structure/intermediate rhythm. (Proceed to Step 4).
      *   **FAIL:** The connection is speculative, weak, or the pattern seems driven by faster-moving factors (e.g., short-term politics, transient market swings). **Action: Cover as Event/Brief OR Intermediate Rhythm Piece (Editor Discretion).** (Stop).

  4.  **The Counterfactual Test (Requires Editor Judgment):**
      *   **Question (To Editor):** If the specific triggering event (Step 1) *had not occurred today*, would the underlying structural problem/intermediate rhythm identified in Step 3 *still manifest in a materially similar way in the foreseeable future* through other events? (i.e., Was this event just the most visible symptom?)
      *   **PASS:** Yes, the structural pressure/rhythm is strong enough that *some* significant manifestation was highly likely soon, regardless of this specific trigger. (Proceed to Step 5).
      *   **FAIL:** No, this specific event was the critical, unlikely catalyst; the problem was latent but unlikely to erupt imminently without *this* spark. **Action: Cover as Event/Brief OR Intermediate Rhythm Piece (Editor Discretion).** (Stop).

  5.  **The "New Light" Test (Requires Editor Judgment):**
      *   **Question (To Editor):** Does this specific event, *in the context of the proven pattern and structure*, provide significant new evidence, urgency, or a uniquely clear illustration that fundamentally *changes the understanding* of the slow structure/intermediate rhythm, making it essential to explain *now*?
      *   **PASS:** Yes, it acts as a crucial spotlight or turning point revelation for the deeper issue. **Action: Commission "Bigger Than It Looks" Structural/Intermediate Take.**
      *   **FAIL:** No, it's a stark example but doesn't materially alter the known trajectory or understanding of the underlying issue. **Action: Cover as Event/Brief OR Intermediate Rhythm Piece (Editor Discretion).**

  ---

  ## Worked Cases

  1.  **Single Regional Bank Failing Over a Weekend:**
      *   **Step 1 (Trigger):** FAIL. *Prima facie*, it's explained by a single weekend event (liquidity crisis/run). Junior finds clip: Regulators cite "mismanagement & concentrated crypto exposure." No *immediate evidence* links it to broader regulation erosion. **Action: Cover as Event/Brief.**
      *   *(Where it stops you): You want regulatory erosion, but Step 1 fails because the *initial explanation* points to specific, recent causes without *immediate evidence* of a regulatory link. To pass Step 1, initial reports/regulator statements would need to explicitly cite lax oversight or link it to a known regulatory gap. To get a structural take, evidence proving the failure was *part of a pattern caused by* eroded regulation (Step 2 & 3) is needed upfront.*

  2.  **Steady Multi-Year Rise in Reported Food-Bank Use:**
      *   **Step 1 (Trigger):** PASS. Not a single event; it *is* the documented pattern.
      *   **Step 2 (Pattern):** PASS. Junior easily finds annual reports/data showing the multi-year rise.
      *   **Step 3 (Structural Link - Editor):** PASS. The pattern strongly links to slow structures (stagnant wages, rising costs of living, weak social safety nets) and/or intermediate rhythms (inflation trends, labor market shifts). Editor judges the connection is demonstrable.
      *   **Step 4 (Counterfactual):** PASS. Even without *this year's* specific data point, the trend would continue based on underlying pressures.
      *   **Step 5 (New Light):** PASS/FAIL likely PASS. The *latest* data point adds urgency/confirms trajectory; often enough for a "bigger" piece explaining the structures. **Action: Commission Structural Take.**

  3.  **Sudden Collapse of a Coastal Fishery After Decades of Gradual Decline:**
      *   **Step 1 (Trigger):** PASS. The "sudden collapse" is the event, but it follows documented decline.
      *   **Step 2 (Pattern):** PASS. Junior finds reports confirming decades of decline due to overfishing, warming.
      *   **Step 3 (Structural Link - Editor):** PASS. The decline links to slow structures (climate change, ocean acidification) and intermediate rhythms (fisheries management policy failure, market pressures).
      *   **Step 4 (Counterfactual):** PASS. The collapse was likely imminent given the trajectory; the specific trigger (e.g., a heatwave) just accelerated it.
      *   **Step 5 (New Light - Editor):** PASS. The sudden, final collapse provides a stark, urgent endpoint illustrating the failure of decades of management and the impact of slow environmental change. **Action: Commission Structural/Intermediate Take (focus on management failure/climate impact).**

  ---

  ## Where Judgment Takes Over (Approx. 200 words)

  Steps 3, 4, and 5 explicitly require your editorial judgment. The procedure forces writers to gather factual evidence (Steps 1 & 2) and identify *potential* structural links, but *you* decide if the evidence convincingly crosses Braudel's fuzzy boundaries. Step 3 asks: "Does this pattern *really* reveal the deep structure or intermediate rhythm?" Step 4 asks the critical Braudelian question: "Was this event inevitable foam, or was *this specific trigger* the unique spark?" Step 5 asks if the event provides transformative insight or just another data point. The procedure ensures these judgments are made *after* verifying the event isn't easily dismissed as mere foam (Step 1) and that a pattern exists (Step 2). It prevents unsubstantiated leaps but acknowledges that connecting patterns to structures is interpretive. Your role is to assess the strength and novelty of the evidence presented for those connections. The procedure frames the debate with evidence, but you interpret its significance within Braudel's schema.

  ---

  ## What the Procedure Cannot Settle (Approx. 200 words)

  1.  **The Seismic Shift:** This procedure is designed to find structure *beneath* the event. It **cannot definitively prove that a fast event has *reset* a slow structure itself.** Did the bank failure *cause* new regulation (a structural change), or just highlight existing erosion? Did the fishery collapse *force* a fundamental policy overhaul? The procedure might flag the *potential* (via Step 5's "New Light"), but confirming a structural reset requires *future evidence* of lasting change. It remains a hypothesis needing later verification.
  2.  **Overruling the Procedure:** **You (the Editor)** are the final arbiter, entitled to overrule any outcome. Grounds include:
      *   **New Evidence:** Compelling information emerges after the initial 10-min check invalidating a FAIL (e.g., leaked docs proving the bank's collapse *was* due to a known regulatory blind spot).
      *   **Editorial Imperative:** A FAILed event possesses such overwhelming *symbolic* power or public resonance regarding a known structure that ignoring the connection is a disservice, even if direct evidence is still emerging (use sparingly!).
      *   **Step 3/4/5 Judgment Call:** Disagreeing strongly with the procedure's PASS/FAIL recommendation at the judgment steps based on your assessment of the evidence's weight and context. The procedure guides, but editorial responsibility remains yours.
