  hi, so I'm doing the IB extended essay (the ~4000 word one you write over a year) and I picked math, but my supervisor is fine with it being more philosophy-of-math than actual problem solving. my topic is the continuum hypothesis, and before I can start I have to hand in a short research proposal with the exact question, why it's not already answered, my method with a rough timeline, and what would make the essay fail. can you write that for me?

  my half-formed idea: everyone says Gödel and Cohen showed CH is "independent" of ZFC, but I've noticed people treat that word like it means one thing, when maybe it could mean (1) our axioms are just missing something and a better axiom would settle it, (2) the question is vague or not even well-posed, or (3) it's settled in a weird way — true in some universes of sets and false in others and that's just how it is. so my research question would be something like: can you argue for one of these three readings over the others without already assuming a position on what sets are in the first place? I'm honestly not sure if that's answerable at all or way too ambitious for a high schooler, so the proposal should be upfront about scope.

  some constraints on me: my math goes up to basic proof writing, I've seen cardinality and Cantor's diagonal argument, but forcing is definately over my head and I won't be able to reproduce the actual independence proofs. so the month by month plan needs to be realistic for someone working from the *results* of those proofs rather than the proofs themselves (like using them as the starting point instead of something I have to derive). and for the failure section, be honest — I'm worried the three readings might just collapse into each other once you write them out carefully, and if that's a real risk the proposal should say so, cause that would kill the essay.

  no citations or reading lists please, I'll figure out sources with my supervisor later. keep it around 600-800 words so it fits the form we were given, and make the question precise enough that two people could tell whether I answered it or not.
