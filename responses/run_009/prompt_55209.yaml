prompt: |-
  Over the holidays my brother-in-law and I got into our now-annual argument about whether individual choices matter. His position is the simple one: since one person's emissions, purchases, or ballot are each a rounding error on the aggregate, none of us is doing anything wrong so long as we're not egregious about it — and my "every little bit helps" rejoinder struck even me as pretty thin. So I did what I probably should have done years ago: wrote down my actual gut verdicts on a list of cases, and discovered that they fit neither his view nor mine. Here is the list. Not voting in a national election on the grounds that my vote won't decide it: I think that's a bad excuse, and I'd quietly blame a friend who stayed home out of pure laziness, even knowing the chance of my vote being decisive is something like one in many millions. Buying a chicken sandwich at the airport: I've come to think this is a small wrong, even though I'm confident one sandwich doesn't add a single bird to production in any way I could trace. Taking one long-haul flight a year to see my sister abroad: this feels basically fine to me, at worst a modest indulgence — even though the flight emits more in a few hours than the rest of my year put together. Flicking a wrapper out the car window: obviously wrong, and I'd be embarrassed to be seen doing it, though the harm is a rounding error on a rounding error. Letting the tap run while brushing my teeth during a drought: feels mildly wrong, but weakly — I do it half-asleep without much guilt. Buying a gas car instead of an electric one: feels like a genuine contribution to harm, spread over years of driving, in a way the single flight somehow doesn't.

  The embarrassments are not hard to spot. My verdicts on the flight and the wrapper run exactly opposite to the magnitudes involved: the enormous contribution is fine and the microscopic one is shameful. The sandwich and the flight have the same structure — one tiny addition to an aggregate harm — and I judge them differently, apparently because I've recently had feelings about the one and not the other. And voting feels near-obligatory while the tap feels like etiquette, though neither is efficacious in the way we usually demand of wrong-making. I keep reaching for a principle of my own, something like: my act is wrong when I take a benefit that exists only because others refrain — a free-riding idea. But it doesn't seem to fit: the gas car isn't obviously a free ride on anyone's restraint, the wrapper isn't a benefit at all, and voting is a cost rather than a benefit, yet it's the verdict I feel most strongly about. Either the principle is hopeless or my verdicts are.

  So that is what I'm asking for. Give me a principle, or a short menu of candidate principles, stated precisely enough to decide cases — each clause tied to the case that motivates it — rather than a mood like "participation in collective harm." Tell me what the winning principle says about cases I haven't listed: a single burger on my birthday after a year of vegetarianism; a billionaire's private flight, which is enormous in magnitude but singular in structure; voting in a seat so safe that the decisiveness odds are even more remote than usual; and one more I keep going back and forth on, whether my small donation to a large relief fund is more like my vote (worthwhile though ineffectual) or like the tap water (nice, but not owed). And be honest with me about the choice the list forces: I'd rather know whether the only way to save all six verdicts is a principle with a separate clause per case — at which point it explains nothing — and which of my verdicts the simpler principle should be allowed to overturn, and why those rather than the others. Please don't just tell me my verdicts are inconsistent; I know. Tell me which ones to surrender and what I'm left holding.
reasoning: |-
  Hmm, the user is grappling with the ethics of individual actions in collective impact scenarios. They've presented a list of personal moral judgments that conflict with both their brother-in-law's "individual actions don't matter" stance and their own "every bit helps" position. The cases include voting, chicken sandwiches, flights, littering, water waste, and car choices - all showing puzzling inconsistencies in their moral intuitions.

  What stands out is how their judgments don't align with the actual magnitude of harm. A tiny act like littering feels deeply wrong while a massive carbon-emitting flight feels acceptable. The voting case is particularly interesting - they feel strongly about it despite its statistical insignificance, suggesting there's more than just consequence-based ethics at play.

  The user wants a precise ethical framework that can: 1) Explain their existing judgments consistently 2) Handle new test cases 3) Reveal which intuitions might need revision. They're explicitly rejecting vague concepts like "participation in collective harm" in favor of something operational.

  Looking at their cases, a few patterns emerge: The strength of judgment seems tied to how directly the action causes harm (littering) versus how mediated it is (factory farming). There's also an element of social visibility - littering causes immediate shame while water waste doesn't. And voting appears special because it's a civic ritual rather than a consumption choice.

  For a framework, I'm considering combining three lenses: Expected harm (the actual probability-weighted consequence), expressive meaning (what the action symbolizes), and relational ethics (how it positions you relative to others). This might explain why voting feels obligatory (expresses civic virtue) while wasting water feels minor (no expressive harm).

  The test cases will be revealing: A birthday burger after vegetarianism might be acceptable under an expressive framework if framed as an exception, while a billionaire's flight fails on all three dimensions. The donation question seems closest to voting - it's about participating in collective action regardless of individual impact.

  The user needs to confront that some intuitions might not survive systematization. Probably the flight verdict is hardest to defend - its environmental impact is objectively large. But rather than discarding it entirely, we might reframe it as belonging to a different ethical category (family obligations versus pure consumption).
answer: |-
  You've hit on one of philosophy's thorniest practical questions: how to assign moral weight to individually negligible acts within collective harms. Your intuitions aren't inconsistent—they're revealing competing ethical dimensions. Here's a principle that systematizes your judgments without requiring a clause-per-case, followed by its verdicts on your scenarios:

  **The Integrated Principle of Negligible Contributions:**
  *An individual act that contributes to a collective harm is wrong to the extent it:*
  1.  **Violates a salient cooperative norm** (socially recognized restraint others follow expecting reciprocity);  
      *AND/OR*  
  2.  **Expresses defective moral character** (reveals objectionable attitudes like disrespect, indifference, or unfairness);  
      *AND*  
  3.  **Has non-trivial expected harm** (magnitude of harm × probability of causing it, discounted by causal mediation).  

  **The harm is aggravated when the act:**  
  - Is easily avoidable with minimal sacrifice;  
  - Occurs in contexts of scarcity or crisis;  
  - Lacks compensating moral value (e.g., sustaining relationships).

  ---

  ### How It Explains Your Cases
  1. **Not Voting:**  
     - Violates a salient cooperative norm (civic duty; others vote expecting reciprocity).  
     - Expresses defective character (free-riding on others' civic effort).  
     - *Verdict:* **Wrong** (fits your blame).  
     *Why voting feels different from tap water:* Voting is a constitutive act of democracy; wasting water is merely inefficient. The norm violation is central.

  2. **Buying a Chicken Sandwich:**  
     - Violates a salient cooperative norm (growing expectation of reducing meat consumption for climate/animal welfare).  
     - Expresses indifference to animal suffering (even if trace effects are untraceable).  
     - *Verdict:* **Small wrong** (fits your guilt).  
     *Why it feels worse than the flight?* The flight has compensating moral value (family bonds); the sandwich is pure convenience.

  3. **Long-Haul Flight:**  
     - *Doesn't* violate a salient norm (frequent leisure flying is still socially normalized; family visits carry moral weight).  
     - Need not express defective character (can coexist with climate concern).  
     - Non-trivial expected harm, but compensated by relationship value.  
     - *Verdict:* **Permissible indulgence** (fits your "basically fine" judgment).  
     *Why magnitude isn't decisive:* The harm is highly mediated (through complex systems), and the act serves a competing moral good.

  4. **Flicking Wrapper:**  
     - Violates a vivid cooperative norm (don't litter; others restrain themselves expecting clean spaces).  
     - Expresses contempt for shared spaces and others' efforts.  
     - Easily avoidable with zero sacrifice.  
     - *Verdict:* **Blameworthy** (fits your shame).  
     *Why microscopic harm feels huge:* The character defect (disrespect) is glaring, and norms against littering are deeply internalized.

  5. **Running Tap During Drought:**  
     - Weakly violates a cooperative norm (conservation during scarcity), but norm isn't as salient or binding as voting or littering.  
     - Expresses mild negligence, not malice.  
     - Easily avoidable, but low social visibility reduces expressive weight.  
     - *Verdict:* **Mildly wrong but forgivable** (fits your half-asleep guilt).  
     *Why weaker than voting?* Less central norm, no reciprocity expectation.

  6. **Buying Gas Car Over Electric:**  
     - Violates emerging cooperative norm (transition to sustainable transport).  
     - Expresses indifference to long-term collective harm.  
     - Lock-in effect: commits to years of disproportionate emissions.  
     - Avoidable with moderate sacrifice (cost difference shrinking).  
     - *Verdict:* **Genuine contribution to harm** (fits your judgment).  
     *Why worse than one flight?* No compensating relationship value; a repeated choice reinforcing fossil fuel dependence.

  ---

  ### Verdicts on New Cases
  - **One Burger on Birthday After Vegetarian Year:**  
    *Permissible.* Doesn't violate norms (exceptions for special occasions recognized); expresses gratitude, not indifference. Expected harm trivial.  

  - **Billionaire's Private Flight:**  
    *Wrong.* Violates norms of proportionality; expresses arrogance/indifference; non-trivial expected harm with no moral compensation (unlike visiting family).  

  - **Voting in a Safe Seat:**  
    *Still obligatory.* Norms of civic duty don't weaken with probability; abstaining still expresses free-riding. The ritual affirms democratic values.  

  - **Small Donation to Large Relief Fund:**  
    **Like voting** (worthwhile). Expresses solidarity and fulfills imperfect duty to aid. Not "owed" like avoiding littering, but norm of compassion applies.  

  ---

  ### What Must Be Surrendered (and Why)
  This principle **saves 5.5/6 verdicts** but forces one revision:
  - **Concede:** The flight *is* a significant moral indulgence.  
    *Why:* Its expected harm is non-trivial (climate impacts are non-linear; high emissions *do* increase systemic risk). Your "basically fine" verdict relies on normalization bias. The principle allows it only via *compensation* (family bonds), not insignificance. Call it a "modest indulgence" but acknowledge it carries real moral weight.

  - **Hold the Line:** Your other verdicts stand. The wrapper's wrongness isn't about harm magnitude but **expressivity** and **norm violation**. The gas car's wrongness comes from **reinforcing harmful systems** through lock-in. Voting's duty is **symbolic/participatory**, not instrumental.

  ---

  ### Why This Works
  - **Solves the magnitude paradox:** The wrapper's "microscopic harm" isn't what makes it wrong—it's the *attitude* it expresses. The flight's harm is large but partially offset.  
  - **Distinguishes sandwich vs. flight:** One serves no higher good; the other does.  
  - **Avoids ad-hoc clauses:** Salient norms (civic, environmental, anti-littering) explain judgments without case-by-case fiat.  
  - **Handles "free-riding" asymmetry:** Free-riding matters when norms exist (voting), not when they don't (gas car isn't free-riding—yet).  

  Your intuitions track **social morality** (norms + character) more than pure consequentialism. That's rational: in collective action problems, upholding norms *is* how we prevent collapse. Surrender the flight’s blamelessness; keep the rest as a coherent map of everyday ethics.
