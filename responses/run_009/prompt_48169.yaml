answer: |-
  Here is a specification of adequacy requirements for a theory of consciousness distribution, structured around your cases and considerations, designed for practical welfare boundary-drawing:

  ### Core Requirements (Derived from Key Cases)

  1.  **Requirement: Handle Decentralized/Non-Centralized Cognition (Non-negotiable)**
      *   **Case:** Octopus (distributed nervous system).
      *   **Rationale:** Must explain how consciousness arises (or doesn't) without requiring a centralized processing hub like the vertebrate brain. Cannot *assume* centrality is necessary.
      *   **Potential Bias:** Challenges mammalian/vertebrate-centric views (e.g., some Global Workspace theories emphasizing cortical centrality). Genuine demand.

  2.  **Requirement: Architecture-Neutrality (Non-negotiable)**
      *   **Case:** Convergent evolution (Birds vs. Mammals).
      *   **Rationale:** Must be able to recognize consciousness achieved via fundamentally different neurobiological architectures (e.g., avian pallial nuclei vs. mammalian neocortex). Cannot be tied to specific mammalian structures.
      *   **Potential Bias:** Exposes mammalian chauvinism inherent in theories overly reliant on specific cortical structures or layering. Genuine demand (convergence is a litmus test).

  3.  **Requirement: Verdict Under Maximal Structural Knowledge (Non-negotiable)**
      *   **Case:** *C. elegans* (fully mapped connectome, 302 neurons).
      *   **Rationale:** Must yield a specific verdict (conscious/not, degree/kind if applicable) when near-complete structural data is available. A theory that remains silent or indeterminate here fails a crucial test of empirical applicability.
      *   **Potential Bias:** Challenges theories that implicitly rely on complexity beyond *C. elegans* or define consciousness *only* by the absence of full explanation ("explanatory gap"). Genuine demand (maximal data demands an answer).

  4.  **Requirement: Explicitly Address Behavior-Neural Evidence Tension (Non-negotiable)**
      *   **Case:** Decapod Crustaceans/Insects (mixed behavioral evidence: trade-offs, analgesia, play).
      *   **Rationale:** Must provide a principled framework for weighting and interpreting ambiguous behavioral markers (like operant learning for analgesics, play) *relative* to neural evidence. Cannot simply default to one or the other without justification.
      *   **Potential Bias:** Challenges purely behaviorist accounts (risking over-attribution) and purely neural-substrate accounts (risking under-attribution despite complex behavior). Genuine demand (practical welfare hinges on interpreting ambiguity).

  5.  **Requirement: Distinguish Phenomenal Consciousness from Nociception & Moral Status (Non-negotiable)**
      *   **Case:** Boundary with nociception.
      *   **Rationale:** Must clearly delineate:
          *   (a) Nociception (detection of noxious stimuli) and reflex withdrawal from phenomenal pain/suffering.
          *   (b) The presence of phenomenal consciousness from the moral status derived from it.
      *   **Rationale for Separation:** (a) Prevents conflating simple reflexes with subjective experience. (b) Prevents the theory from *directly* dictating moral obligations (which require additional ethical arguments), focusing it on the factual question of presence/absence of experience.
      *   **Potential Bias:** Challenges views that see nociception as sufficient for pain consciousness or that build moral status directly into the consciousness criterion. Genuine demand (conceptual clarity essential).

  ### General Requirements

  6.  **Requirement: Third-Person Applicability (Non-negotiable)**
      *   **Consideration:** Absence of verbal report in non-humans.
      *   **Rationale:** Must rely solely on objective, third-person evidence (neural, behavioral, evolutionary, functional). Cannot require inaccessible first-person data.
      *   **Potential Bias:** Accommodates all major theory families; excludes only radical positions demanding first-person verification. Genuine demand (practical necessity).

  7.  **Requirement: Specified Position on Degrees vs. Threshold (Non-negotiable)**
      *   **Consideration:** Vagueness problem near boundaries; welfare implications.
      *   **Rationale:** Must explicitly state whether consciousness is all-or-nothing, admits of degrees (and what kind - e.g., richness, intensity, levels), or has thresholds for specific kinds. Must address implications for borderline cases (e.g., organisms near the threshold).
      *   **Potential Bias:** Reflects debates between digital vs. analog views of consciousness (e.g., Higher-Order theories often imply thresholds; IIT implies graded existence). Genuine demand (critical for borderline welfare decisions).

  8.  **Requirement: No Phylogenetic Proximity Tiebreaker (Negotiable under duress, but costly)**
      *   **Consideration:** Avoiding anthropocentric bias.
      *   **Rationale:** Phylogenetic closeness to humans cannot be used as evidence *for* consciousness or as a tiebreaker when other evidence is equivocal. Evidence must stand on its own merits.
      *   **Cost of Dropping:** Severely weakens the theory's objectivity and invites anthropocentric bias, potentially excluding convergent cases like birds or cephalopods unfairly. Might be *pragmatically* used if *all* other evidence is truly equally ambiguous, but this should be a last resort explicitly flagged as a limitation.
      *   **Potential Bias:** Challenges implicit assumptions in some behavioral comparisons or neural homologies. Genuine demand for objectivity.

  9.  **Requirement: Principled Extensibility to Novel Organisms (Non-negotiable)**
      *   **Consideration:** Theory vs. field guide.
      *   **Rationale:** Must provide general principles applicable to hypothetical or undiscovered organisms fundamentally different from known animals (e.g., alien life, radically novel terrestrial evolution, advanced AI). Cannot be just a catalog of known cases.
      *   **Potential Bias:** Challenges overly adaptationist Biological Function accounts or theories too tightly tied to Earth's evolutionary history. Genuine demand (marks a true theory).

  ### Analyses

  1.  **Joint Unsatisfiability and Cost of Dropping:**
      *   **Conflict:** The strongest tension lies between **Requirement 3 (Verdict on *C. elegans*)** and **Requirement 4 (Weighting Behavior in Insects/Crustaceans)**, particularly for theories emphasizing complex neural integration.
          *   Why? *C. elegans* forces a verdict based *purely* on its minimal, known structure. Many complex behavioral markers (Requirement 4, e.g., operant analgesia) are absent or ambiguous in such simple organisms. A theory demanding those markers for consciousness would declare *C. elegans* non-conscious. A theory finding consciousness in *C. elegans* based on its structure must explain why the complex behaviors in insects are needed *at all* if similar complexity isn't required, or why they aren't definitive. This creates pressure to prioritize one type of evidence over the other.
      *   **Which to Drop?** If forced, drop **Requirement 3 (Verdict on *C. elegans*)**.
      *   **Cost:** Significant. It means the theory remains indeterminate in the one case where we have maximal structural knowledge, undermining its claim to empirical robustness and leaving a critical test case unresolved. It risks making the theory untestable or vacuous where structural data is complete but minimal. Welfare decisions for simple nematodes become purely speculative.

  2.  **Single Requirement Excluding the Most Contenders:**
      *   **Requirement:** **2. Architecture-Neutrality** (Birds vs. Mammals)
      *   **Argument for Exclusion:**
          *   **Neural-Substrate Theories (IIT, Global Workspace):** These are most vulnerable. IIT, while abstract, often calculates Φ based on specific network structures that might implicitly favor mammalian-like integration. Global Workspace theories heavily emphasize centralized "broadcasting" architectures homologous to mammalian corticothalamic systems. Both struggle to explain how the radically different, non-layered, nucleated avian pallium achieves comparable integration/global access without their preferred structures.
          *   **Higher-Order Thought (HOT) Theories:** These often tie consciousness to specific cognitive architectures capable of meta-representation, typically assumed to require sophisticated prefrontal-like cortex. The avian brain lacks a homologue to the mammalian PFC, posing a significant challenge to HOT accounts explaining complex bird cognition consciously.
          *   **Behavioral/Reflex-Based Criteria:** These *can* pass if they find equivalent complex behaviors in birds, but they risk failing Requirement 4 if they don't adequately weigh how that behavior maps onto a different neural substrate. Pure reflex accounts likely fail behavioral complexity regardless.
          *   **Biological Function Accounts:** These have the best chance, as they focus on the *role* of consciousness (e.g., flexible integration for adaptive action) which could be realized by different structures. However, they still need a plausible story about how the avian architecture realizes the *functional* properties deemed necessary.
      *   **Conclusion:** Requirement 2 directly targets a core assumption (often unexamined) in many prominent neural-substrate and higher-order theories – that consciousness requires a *specific kind* of neural hardware modeled on humans/mammals. It forces these theories to either demonstrate how non-mammalian architectures meet their abstract criteria *without* relying on structural homologies, or to explicitly deny consciousness to highly cognitive birds – a scientifically and ethically unpalatable position. This requirement likely excludes or severely challenges the majority of neural-centric contenders.

  ### Summary & Framing for Practical Use

  This specification prioritizes requirements enabling practical welfare boundary-drawing based on objective evidence. Non-negotiable requirements ensure the theory handles critical test cases (octopus, birds, *C. elegans*, insects), distinguishes feeling from detection/reflex, works without first-person reports, clarifies graded/threshold issues, and extends beyond known animals. The key tension is between demanding a verdict on minimal structure (*C. elegans*) and weighting complex behavior (insects), with the *C. elegans* verdict being the harder but more fundamental demand. The most discriminating requirement is Architecture-Neutrality, exposing the mammalian bias in leading neural theories. A theory succeeding here, even if metaphysically minimal, provides the usable boundary tool you need.
