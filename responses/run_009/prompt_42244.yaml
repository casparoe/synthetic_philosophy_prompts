prompt: |-
  I am a retired immunologist who has spent the last two years reading philosophy of mind, Dennett in particular, only to find that the questions that grip me most were sitting in my old laboratory all along. For four decades my colleagues and I said that the immune system recognizes antigens, remembers prior infections, and, in graft rejection, mistakes the patient's new organ for an invader — yet none of us took ourselves to be attributing beliefs. I have since been collecting my verdicts on when belief-talk is literally true of a system, and I would like to know whether they add up to anything.

  The verdicts. Of the house thermostat I will say only that it is as if it thinks the room is too cold; I do not say it believes this. Of the frog that snaps at a BB pellet drawn past on a thread — its visual system tracks small dark moving blobs, not flies as such — I do want to say it believed there was a bug in front of it, and that the belief was false. My correspondence-chess club runs our positions through an engine, and I have no qualms saying it knows the resulting rook endgame is drawn and is steering toward it. But describe to me a hypothetical book-player — a program that stores a best move for every legal position, the moves computed once, elsewhere — and I will refuse to say it believes anything about the position, though over the board it plays identically to the engine. My spam filter confidently files a colleague's invoice email as spam, and I will not say it believes the email is spam, though it outputs a claim and acts on it. When an AI assistant tells me the melting point of aspirin correctly, I am half-tempted to say it believes it; when the same assistant, with the same fluency, invents a citation for a paper that does not exist, I refuse to say it believed the paper existed — and I confess this asymmetry suggests my attributions track whether the system is right, which by rights should have nothing to do with whether it believes. Finally, the graft "mistaken" for an invader: I never took my discipline's shorthand literally, but I can no longer say why not, since the immune system's states are decodable, informative, and causally in charge of the rejection quite as much as the engine's states are in charge of its moves.

  My working principle, offered for repair rather than endorsement, is an information-and-use test: a system believes that P when it carries an internal state from which P can be read off, and that state steers its behavior appropriately. The trouble is that the test seems to admit the thermostat (the bimetallic strip reads "cold" and switches on the furnace), the spam filter, and perhaps the book-player — all of whose belief-talk I meant to refuse — while leaving me unable to say why the frog's false bug-belief counts but the thermostat's true "cold-belief" does not. It also sits oddly with Dennett: if the intentional stance tells me only when belief-talk predicts well, my verdicts feel like more than that — the engine case seems true, not merely useful.

  Please give your answer as exactly five numbered points, each one or two sentences, with no introduction or conclusion. Within those five points I would like the principle itself stated precisely, an explicit statement of which of my verdicts it overturns, and a verdict on a case I have not mentioned: my old lab's autoclave, whose pressure sensor failed in a way that makes it behave exactly as it would if it believed the chamber were still unpressurized, pumping away long after the true pressure is reached. Does the autoclve believe the chamber is unpressurized, and if not, why did the frog believe the pellet was a bug? The allocation of the remaining points is yours.
reasoning: |-
  Hmm, the user is a retired immunologist who's been exploring philosophy of mind, especially Dennett, and is grappling with when to attribute beliefs to systems like biological entities or AI. They've provided several specific cases where they do or don't attribute beliefs, and a working principle involving internal states that encode information and guide behavior. They want me to condense my response into exactly five numbered points addressing their principle, which verdicts it overturns, and a new case about an autoclave.

  Looking at their verdicts: They refuse belief-talk for thermostats, book-player programs, and spam filters, but accept it for frogs snapping at BB pellets and chess engines. They feel conflicted about AI assistants - accepting belief when correct but rejecting it when hallucinating. For the immune system's graft rejection, they question why they never took the "mistake" literally despite its functional similarity to belief systems.

  Their proposed principle - that belief requires an internal state that encodes P and appropriately guides behavior - seems too broad as it would include thermostats and spam filters which they intuitively exclude. The asymmetry in AI cases also suggests they're conflating truth with belief attribution.

  To address this, I need to refine the principle beyond just information-and-use. Adding a requirement for integrated cognitive architecture - where states are part of a system capable of multiple representations and behavioral flexibility - would exclude simple systems like thermostats while including frogs and chess engines. This explains why the book-player (lacking real-time computation) and spam filter (limited scope) don't qualify, while the frog (with its visual system integrated into action) does.

  For the autoclave case: The sensor failure creates a decoupled state - the pressure reading no longer corresponds to reality, but it's not an "inference" like the frog's. The autoclave lacks the cognitive integration to form beliefs; it's just mechanically following a broken sensor. This contrasts with the frog where the visual processing is part of an adaptive cognitive system.

  I'll organize this into five precise points: (1) Stating the refined principle, (2) Explaining which verdicts it overturns (book-player and spam filter now qualify but shouldn't), (3) Resolving the AI asymmetry by decoupling truth from belief, (4) Applying it to the autoclave (no belief), and (5) Explaining the frog/autoclave difference via cognitive integration.
answer: |-
  1.  Belief that P requires an internal state reliably produced by conditions indicating P, which is functionally integrated into a cognitive architecture generating flexible, context-sensitive behavior directed toward goals (beyond simple triggering).
  2.  This principle overturns your verdicts on the book-player (its state is decodable and steers play) and the spam filter (its state is decodable and steers filing), implying they *do* hold minimal beliefs, contrary to your refusal.
  3.  The principle clarifies the AI asymmetry: belief attribution depends on the system’s internal processing generating the representation (true or false), not the representation’s truth; the hallucination still involves a belief-state, albeit false.
  4.  The autoclave does *not* believe the chamber is unpressurized; its sensor state, while decodable and steering pumping, is caused by failure, not by conditions indicating low pressure, breaking the reliable production link.
  5.  The frog believed the pellet was a bug because its visual state was reliably produced by bug-like stimuli and integrated into its feeding behavior, whereas the autoclave’s state resulted from malfunction, not reliable indication.
