  ### Sleeping Beauty Problem: Credence Decision Tree  
  *Beauty wakes up during the experiment. She knows:  
  - A fair coin was tossed.  
  - If heads, she is awakened once (Monday).  
  - If tails, she is awakened twice (Monday and Tuesday).  
  - After each awakening, she forgets everything except the setup.*  

  ---

  #### **Question 1: Is the question "What is P(heads)?" well-posed?**  
  *(Can Beauty assign a coherent credence to heads given her self-locating uncertainty?)*  
  - **No** → **Leaf: Ill-posed position.**  
    - *Why?* Beauty's evidence ("I am awake now") is irreducibly indexical. Credence in non-indexical propositions (e.g., coin outcomes) cannot be cleanly separated from context. Reformulate the question (e.g., "What bet should Beauty accept?").  
  - **Yes** → Proceed to Question 2.  

  ---

  #### **Question 2: Does awakening provide *new relevant evidence* about the coin?**  
  *(Beyond what Beauty knew on Sunday: that she would be awakened at least once?)*  
  - **No** → Proceed to Question 3.  
  - **Yes** → Proceed to Question 4.  

  ---

  #### **Question 3: If Beauty learns it is Monday, does her credence in heads change?**  
  *(She initially assigns P(heads) = 1/2. Does Monday-information alter this?)*  
  - **No** → **Leaf: Halfer.**  
    - *Credence:* P(heads) = 1/2 (always).  
    - *Why?* Awakening teaches nothing new; Sunday’s 1/2 credence never updates.  
    - *Variants:*  
      - Extreme (1,000 tails awakenings): P(heads) = 1/2.  
      - Betting: Accepts even-odds bets on heads (e.g., "Pay $1 if heads, win $1"). *Problem:* Loses money in tails scenarios (bets twice).  
  - **Yes** → **Leaf: Double-Halfer.**  
    - *Credence:* P(heads) = 1/2 on waking, but **P(heads | Monday) = 2/3**.  
    - *Why?* Awakening provides no evidence, but *Monday* rules out Tuesday awakenings.  
    - *Variants:*  
      - Extreme: P(heads) = 1/2; P(heads | Monday) ≈ 1/2 (since 1,000 awakenings dilute Monday’s impact).  
      - Betting: Accepts even-odds bets on waking (P=1/2), but rejects them if told it’s Tuesday.  

  ---

  #### **Question 4: Should multiple tails awakenings increase the weight of tails?**  
  *(Does the *number* of potential awakenings affect how Beauty’s evidence favors tails?)*  
  - **Yes** → **Leaf: Thirder.**  
    - *Credence:* P(heads) = 1 / (1 + *n*), where *n* = number of tails awakenings.  
      - Standard (*n*=2): P(heads) = 1/3.  
      - Extreme (*n*=1,000): P(heads) = 1/1001.  
    - *Why?* Beauty’s evidence ("I am in an awakening") is true in more scenarios under tails → tails is more likely.  
    - *Betting:* Accepts bets only if payout > *n*×cost (e.g., "Win $2 if heads, lose $1 if tails" for *n*=2). Avoids long-run losses.  
  - **No** → **Leaf: No standard position.**  
    - *Why?* Incoherent to affirm new evidence yet deny that awakening frequency affects likelihood. *Example:* If tails implies more awakenings, but Beauty insists P(heads)=1/2 despite "new evidence," she contradicts her model. No theorist defends this.  

  ---

  ### Key Variants & Tree Notes  
  - **Extreme Variant (1,000 tails awakenings):**  
    - Halfer/Double-Halfer: P(heads) = 1/2.  
    - Thirder: P(heads) ≈ 0.001.  
    - *Tests intuition:* If your answer flips from 1/2 (standard) to near-0 (extreme), you’re a thirder.  
  - **Betting Variant (small wagers at each awakening):**  
    - Separates *credence* from *decision-making*. Halfers accept losing bets; thirders adjust odds.  
  - **Unresolved Separation:**  
    - **Halfer vs. Double-Halfer** cannot be cleanly separated by betting *without* day-information. Both accept even-odds bets on waking (P=1/2).  
  - **Empty Cell:** "New evidence + no frequency weighting" has **no defended position** (incoherent—why count evidence but not its implications?).  

  ---  
  *Use this tree to map your view. Revisit after discussing variants!*
