  The statement should be constructive, precise, and allow both sides to save face while clarifying actual differences. I'll use neutral language throughout and ensure predictions are falsifiable.
answer: |-
  ### Joint Statement on Cultural Evolution Theory  
  **Between Memetic Darwinians (Camp A) and Cultural Attraction Theorists (Camp B)**  
  *Mediated by [Your Name/Institution], Philosopher of Science*  

  We, the undersigned representatives of Camp A (memetic Darwinians) and Camp B (cultural attraction theorists), affirm shared scientific goals: to explain the dynamics of cultural change, identify causal mechanisms, and integrate empirical evidence. Despite substantive disagreements, we commit to adversarial collaboration to resolve disputes through shared frameworks and testing. This statement clarifies common ground, precise differences, and testable cruxes.  

  ---

  ### (i) Agreed Claims  
  Both camps endorse the following statements without reservation:  

  1. **Population-Level Analysis**: Cultural phenomena are usefully studied as distributions of variants in a population, where change arises from interactions between individuals and their social/ecological environment.  
  2. **Biased Transmission**: Cultural transmission is systematically biased by cognitive, sensory, and ecological factors (e.g., memory constraints, perceptual salience, emotional resonance), leading to non-random patterns in cultural stability or change.  
  3. **Evidence Standards**: Valid explanations must be:  
     - **Empirically testable** via experiments, ethnography, or historical data.  
     - **Compatible with cognitive science**, acknowledging that human minds shape transmission.  
     - **Quantitative where possible**, using models (e.g., agent-based simulations, phylogenetic methods) to distinguish selection, drift, and transformation.  
  4. **Cumulative Culture Exists**: Human culture exhibits "ratcheting" (e.g., technological refinements), where innovations build upon prior variants. The mechanism(s) driving this require further investigation.  
  5. **No "Blank Slate" Transmission**: Learners actively interpret cultural stimuli; passive copying is rare outside highly constrained contexts (e.g., digital code).  

  ---

  ### (ii) Table of Remaining Disagreements  
  Each camp accepts the wording below as a fair characterization of their own view and their opponent’s.  

  | Issue | Camp A (Memetic Darwinians) | Camp B (Cultural Attraction Theorists) |
  |-------|------------------------------|----------------------------------------|
  | **Primary Mechanism of Stability** | Population-level stability arises mainly from *selection among discrete variants* competing for replication. | Population-level stability arises mainly from *convergent transformation* during individual-level reconstruction toward cognitive attractors. |
  | **Role of Fidelity** | High-fidelity copying is a *necessary condition* for cumulative, adaptive cultural evolution. | Faithful replication is *neither necessary nor sufficient* for stability; function-preserving reconstruction dominates. |
  | **Causal Unit** | The "meme" (a discrete, gene-like replicator) is a *real, stable unit* of cultural inheritance and selection. | Discrete replicators are *epiphenomenal*; cultural stability stems from shared cognitive attractors, not inherited "copies." |
  | **Darwinian Analogy** | Cultural evolution is *literally Darwinian*: variation, selection, and inheritance operate on memes as they do on genes. | The Darwinian analogy is *heuristically useful but misleading*; cultural change is better modeled as reconstruction under cognitive constraints. |

  ---

  ### (iii) Cruxes: Key Sub-Questions for Resolution  
  For each crux, we specify a concrete test case, both camps’ predictions, and the empirical outcome that would support or challenge each view. Testing these will adjudicate disagreements without presupposing outcomes.  

  #### Crux 1: **Serial Transmission Chains**  
  - **Question**: In isolated chains (A→B→C→D, no audience selection), does transmitted content decay randomly or drift systematically toward predicted attractors?  
  - **Test Case**: Transmitting a minimally counterintuitive story (e.g., "a stone that whispers") across 10 participants, with recall after 24 hours.  
    - *Camp A Prediction*: Decay will be stochastic (random mutations dominate; no directional shift).  
    - *Camp B Prediction*: Drift will converge toward an intuitive attractor (e.g., "a talking stone").  
  - **Outcome Significance**: Systematic convergence supports Camp B; random decay supports Camp A.  

  #### Crux 2: **Cumulative Culture**  
  - **Question**: Does ratcheting (e.g., refining a tool design) require high-fidelity replication, or can it emerge from reconstruction preserving function?  
  - **Test Case**: Experimental task where participants iteratively improve a physical artifact (e.g., paper airplane for distance), with transmission via either verbal instruction (low fidelity) or direct copying (high fidelity).  
    - *Camp A Prediction*: Ratcheting occurs *only* under high-fidelity conditions.  
    - *Camp B Prediction*: Ratcheting occurs under *both* conditions if reconstructions preserve functional goals.  
  - **Outcome Significance**: Functional ratcheting without fidelity supports Camp B; fidelity-dependence supports Camp A.  

  #### Crux 3: **Near-Errorless Digital Copying**  
  - **Question**: When copying fidelity is perfect (e.g., file-sharing), are transmission dynamics replication-driven or still governed by attractors?  
  - **Test Case**: Tracking viral spread of identical digital images (e.g., memes) in a social network, measuring which variants are retained/retransmitted based on content.  
    - *Camp A Prediction*: Identical copies propagate identically; differential success reflects selection among variants.  
    - *Camp B Prediction*: "Identical" copies differ in salience; attractors (e.g., emotional resonance) govern attention and retransmission.  
  - **Outcome Significance**: Content-blind propagation supports Camp A; content-driven bias despite fidelity supports Camp B.  

  ---

  ### (iv) Verdict on Verbal Disputes  
  We agree that **part of the dispute is verbal**, centering on three terms:  
  - **"Darwinian"**: Camp A uses this *literally* (requiring replicators with heredity); Camp B uses it *metaphorically* (any selection-like process). This is a definitional choice, not empirical.  
  - **"Selection"**: Camp A reserves it for *differential replication of variants*; Camp B extends it to *differential reconstruction*. Clarifying this avoids false dichotomies.  
  - **"Copy"**: Camp A defines it as *replication preserving structure*; Camp B sees "copies" as *reconstructions judged functionally equivalent*.  
    
  **Why it matters**: These terminological differences obscure substantive agreements (e.g., both accept biased transmission) and empirical cruxes. We adopt operational definitions in future work to isolate testable claims.  

  ---

  ### Conclusion  
  This statement reflects good-faith engagement. We commit to:  
  1. Designing joint experiments (e.g., transmission studies) to test cruxes.  
  2. Co-authoring papers on agreed claims.  
  3. Avoiding polemical language (e.g., "mere copying" vs. "just reconstruction").  

  By signing below, we affirm this document as a roadmap for productive collaboration, not a resolution of all disputes.  

  **Signatories**:  
  *For Camp A (Memetic Darwinians)*:  
    [Signature], [Name/Institution]  
  *For Camp B (Cultural Attraction Theorists)*:  
    [Signature], [Name/Institution]  
  *Date*: [Date]  

  ---  
  **Design Notes for Mediator**:  
  - **Neutral Framing**: Disagreements use symmetric language (e.g., "Camp A holds... Camp B holds"). Agreed claims avoid theory-laden terms (e.g., "reconstruction" is excluded).  
  - **Cruxes as Arbiter**: Each crux is a "double-edged" test where outcomes could falsify either camp. Predictions are mutually exclusive.  
  - **Verbal Dispute Resolution**: Explicitly segregating terminological issues prevents them from confounding empirical tests.  
  - **Constructive Tone**: Focus on shared standards (e.g., testability) and future collaboration incentivizes compromise.
