answer: |-
  ## Joint Statement on Aggregation and the Separateness of Persons

  **Signed:**  
  A. Utilitarius (Act-Utilitarian)  
  B. Separatus (Defender of the Separateness-of-Persons Objection)

  **1. Agreed Claims:**

  1.  **Core Disagreement Focus:** Our fundamental disagreement concerns the permissibility and moral significance of *interpersonal aggregation* – summing wellbeing gains and losses across distinct individuals to determine the overall moral value of an outcome or action. This is not primarily a dispute about axiology (what constitutes wellbeing) *per se*, nor solely about the structure of the whole moral theory (e.g., act vs. rule), but centrally about the legitimacy of this specific *method* for comparing and weighing the interests of different persons.
  2.  **Intrapersonal vs. Interpersonal Distinction:** We agree that aggregation *within* a single life over time (intrapersonal aggregation) is fundamentally different in kind from aggregation *across* distinct persons (interpersonal aggregation). The moral justifications and potential permissions for trade-offs within one life do not automatically transfer to trade-offs between lives. The objection specifically targets interpersonal aggregation.
  3.  **Scope of the Objection:** The separateness-of-persons objection, as understood here, is presented as an objection to the *summative structure* of the utilitarian value function when applied across persons. It challenges the core utilitarian claim that morally relevant value is exhausted by the arithmetic total of wellbeing.
  4.  **The Objection's Target:** We agree that Separatus intends the objection to challenge the utilitarian claim that the *rightness of an act* is determined solely by the total wellbeing it produces. Utilitarius understands the objection as targeting precisely this claim.
  5.  **Context of Disagreement:** Our debate operates under conditions of moderate scarcity and conflict of interests, where trade-offs between individuals are unavoidable. We are not debating scenarios where pure Pareto improvements are possible.
  6.  **Limits of Theory:** We acknowledge that neither theory, in isolation, provides a complete, uncontroversial resolution to all moral dilemmas, particularly those involving deep conflicts of interest under uncertainty. Further considerations (e.g., rights, fairness procedures, epistemic constraints) may be necessary even within our respective frameworks.

  **2. Disagreements:**

  | Position                                                                                                                               | Key Assertions                                                                                                                               |
  | :------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Utilitarius (Act-Utilitarian):**                                                                                                     | **1.** The sole fundamental determinant of the moral rightness of an act is whether it produces the greatest possible sum total of wellbeing across all individuals affected.<br>**2.** Gains in wellbeing for one individual can, in principle, always morally outweigh losses in wellbeing for another individual, regardless of the magnitude of the loss to the loser or the identity of the individuals involved, provided the net gain is positive and greater than alternatives.<br>**3.** The separateness of persons is a metaphysical fact but does not generate independent moral constraints on the aggregation of wellbeing for determining the right act; the total sum captures all morally relevant value. |
  | **Separatus (Defender of the Separateness-of-Persons Objection):**                                                                     | **1.** The summative approach (total wellbeing) fails to respect individuals as distinct centres of experience with separate lives. Losses imposed on one person for the sake of benefits to others constitute a distinct moral wrong that is not erased by the net gain.<br>**2.** Interpersonal aggregation of wellbeing is **impermissible in principle** for determining the right act in cases involving direct, non-consensual trade-offs that sacrifice one person's fundamental interests for the greater aggregate good. (Note: This represents the core, strong version of the objection held by Separatus. A weaker view might permit aggregation only under strict conditions, e.g., minimal sacrifice, consent, or extreme stakes).<br>**3.** Taking separateness seriously requires recognising that individuals are not mere containers for fungible units of value; the *distribution* of wellbeing across persons is inherently morally significant in a way not captured by the sum total. |

  **3. Cruxes & Probative Cases/Arguments:**

  | Crux                                                                                                  | Probative Case/Argument                                                                                                              | Utilitarius Prediction                                                                                    | Separatus Prediction                                                                                           |
  | :---------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **C1: Does the separateness-of-persons consideration provide independent moral content, or is it merely a restatement of the objector's prior distributive commitments?** | **Case:** Imagine two worlds with identical distributions of wellbeing: World A has persistent individuals experiencing the lives. World B has a series of momentary subjects ("person-stages") experiencing the same sequence of wellbeing levels, but no diachronic personal identity. Does World A possess a distinct moral value *because* it contains separate, persistent persons? | The moral value of both worlds is identical; only the pattern of experiences matters. Separateness adds no independent moral content. | World A possesses distinct moral value; the existence of separate, enduring persons *itself* matters morally. Separateness provides independent content. |
  | **C2: If the separateness objection works against interpersonal aggregation, why doesn't it similarly forbid intrapersonal aggregation? What explains the asymmetry?** | **Case:** A risky medical procedure for Person C could either: (i) Cause Person C moderate pain now but prevent severe, prolonged suffering later in *their own* life. (ii) Cause Person D moderate pain now to prevent severe, prolonged suffering for Person E later. Is (i) permissible but (ii) impermissible? If so, why? | The asymmetry is unjustified. Both involve trading present pain for future/prevented suffering. The only difference is the location of the beneficiary, which is morally irrelevant to the sum. | (i) is permissible; C consents (tacitly or explicitly) to trade-offs within their own life plan. (ii) is impermissible; sacrificing D for E violates D's separate status. The unity of agency/personhood over time justifies intrapersonal but not interpersonal trade-offs. |
  | **C3: Is the dispute partly verbal, hinging on differing interpretations of "taking separateness seriously"? If so, which aspects are verbal and how should the residue be formulated?** | **Argument:** Does "taking separateness seriously" *necessarily* entail rejecting interpersonal aggregation for act-rightness? Or could it be argued that respecting separateness is compatible with aggregation *if* it incorporates strong agent-relative constraints, or operates at a different level (e.g., institutional)? | The phrase "taking separateness seriously" is often used emotively but lacks precise operational meaning distinct from distributive concerns already captured by non-utilitarian theories. The core dispute is substantive. | While the phrase can be vague, its core meaning involves recognising that moral claims are held *by individuals against others*, creating constraints that aggregation violates. The dispute is substantive about the nature of moral obligation. |
  | **C4: Does the objection, if sound, target the summative structure of the value function *itself*, or merely the direct use of that function as a decision procedure?** | **Case:** A policymaker uses a non-aggregative procedure (e.g., leximin, strong rights protection) to choose policies, believing this respects separateness. However, a utilitarian observer calculates that these policies systematically produce lower total wellbeing than alternative aggregative policies. Has the policymaker chosen morally worse outcomes? | Yes. The lower total wellbeing objectively constitutes a worse state of affairs, regardless of the procedure used. The value function is summative. | Not necessarily. The outcomes are *not* morally worse *simply* because of a lower sum. The procedure respecting separateness may have produced the morally right outcome even with a lower total. The objection targets the value function. |
  | **C5: Does the permissibility of preventing many minor harms versus one severe harm depend *only* on the numbers and magnitudes, or does the separateness of the bearers create a threshold or constraint?** | **Case:** Choice: Prevent Person F from losing one leg (Severe Harm) OR prevent N different people from each stubbing their toe painfully once (Trivial Harm x N). Vary N. At what N (if any) does preventing the toe-stubs become obligatory/permissible? | Obligation arises when N is sufficiently large that the *total* trivial harm prevented exceeds the severe harm. E.g., N=1000? 10,000? (Calculation depends on wellbeing scales). | Preventing the severe harm to F is always required, regardless of N. Sacrificing F's fundamental interest (even partially) for diffuse, minor benefits to others is impermissible. No N makes it obligatory; perhaps extreme N makes it merely excusable/regrettably permissible under duress, but still a moral wrong *to F*. |

  **Conclusion:**
  After two years of rigorous debate through adversarial collaboration, we, Utilitarius and Separatus, emerge with a significantly clearer map of our fundamental disagreement. While neither has abandoned their core commitment, we have achieved a precise articulation of the fault line concerning interpersonal aggregation and the moral significance of the separateness of persons. Utilitarius acknowledges that the intuitive force of the separateness objection points to a deep-seated concern about distributive fairness and individual integrity that simple summation struggles to capture adequately, even if ultimately deemed irrational. Separatus acknowledges the powerful coherence and scope of the utilitarian framework and the counterintuitive implications that rejecting aggregation can entail, particularly in large-number cases, even if those implications are deemed necessary for respecting persons. We agree that resolving the identified cruxes – particularly concerning the source of the asymmetry between intra and interpersonal cases (C2), the independent moral content of separateness (C1), and the nature of trade-offs involving harms of differing severity and numbers (C5) – is essential for progress. Utilitarius predicts that if the cruxes are resolved as expected (e.g., asymmetry unjustified, separateness lacks independent content, numbers swamp severity), Separatus would be compelled to concede that interpersonal aggregation is indeed rationally required. Separatus predicts that if the cruxes are resolved as expected (e.g., asymmetry justified, separateness provides independent constraints, fundamental interests resist being swamped), Utilitarius would be compelled to concede that the utilitarian summative approach necessarily fails to respect the distinctness of persons as moral agents and patients. We commit to continuing our exploration of these cruxes.

  **Signed,**

  **A. Utilitarius**
  **B. Separatus**
