prompt: |-
  My college roommate is a serious Catholic and honestly one of the most consistently principled people I know, but she has very firm views about when religious arguments are acceptable in politics, and we've been arguing about them since sophomore year. Her track record, as best I can reconstruct it: she says a bishop testifying for an abortion ban on the grounds that scripture teaches life begins at conception is not okay; the same bishop arguing for the same policy from the premise that the fetus is a rights-bearing person, with no religious premises anywhere in sight, is fine; civil-rights era speeches soaked in explicitly religious rhetoric, preachers saying God is on the side of justice and that movement — she thinks those are not just fine but admirable; a philosopher arguing for completely open borders purely from utilitarian premises (hedonism, impersonal aggregation of wellbeing) that most citizens flatly reject — fine; and a legislator claiming that if the state legalizes casinos it will bring divine judgment on everyone — not okay. She also insists the whole standard is about how officials publicly justify coercive laws and what courts rely on, not about how ordinary citizens vote or what street preachers say.

  So far I've mostly been able to predict her, but her home state is currently debating a bill and I genuinely don't know what she'll say. A legislator wants to keep the ban on physician-assisted suicide and argues from exactly one premise: that human life is sacred, and intentionally ending one is a violation of that sacredness. No scripture quoted, no appeal to what God commands, no threat of judgment — but also no argument that a secular person who doesn't already feel the sacredness premise would find any pressure to accept. It's the load-bearing premise of the whole justification. When I brought it up she got quiet and changed the subject, which is never a good sign for my ability to predict her.

  So: predict her verdict, and more importantly help me figure out the rule (or rules) she's implicitly been running all these years. As far as I can tell at least two fit her record — something like "no appeal to divine authority or revealed premises" (which would make the sacredness argument fine, since nothing divine is invoked) versus something like "coercive law needs a justification citizens can assess without sharing anyone's faith" (which would sink it, since the sacredness premise does all the work). Walk me through which rules fit, what each predicts on the assisted suicide case, give me your best guess about which she'd run and why, and then design the one further case that would most cleanly discriminate between the candidate rules — the case I could pose to her at dinner that would settle which rule she's actually been using. And if you can, tell me what she'd say about the state rep who cites Qur'anic stewardship of creation as one of two premises for a wetlands protection law, the other being standard secular conservation science, since I suspect the rules come apart there too.
reasoning: |-
  Okay, let me start by breaking down the user's problem. They have a college roommate who's a principled Catholic with clear views on when religious arguments are acceptable in politics. The user has observed several scenarios where the roommate either accepts or rejects different justifications for policies. Now, there's a new case involving physician-assisted suicide where the legislator argues that human life is sacred without invoking any divine authority. The user wants to predict the roommate's stance and understand the underlying rule she uses.

  First, I need to recall the roommate's past positions. She rejected a bishop using scripture for an abortion ban but accepted the same ban if argued without religious premises. She admired civil rights speeches with religious rhetoric. She was okay with a utilitarian argument for open borders, even if unpopular, but against a legislator threatening divine judgment for casinos. Also, her standard applies only to officials justifying coercive laws, not citizens or preachers.

  The key here is figuring out the implicit rule. The user mentions two possibilities: one is "no appeal to divine authority or revealed premises," and the other is "justification must be assessable without sharing faith." The sacredness argument doesn't mention anything divine, so the first rule might accept it. But since the premise relies on a faith-based sense of sacredness, the second rule would reject it.

  Looking at past cases: the bishop's non-religious argument was okay because it used secular reasoning (rights-bearing person). Civil rights speeches, while religious, were acceptable because they were moral appeals, not divine commands. The utilitarian argument is secular, so acceptable. The divine judgment threat was rejected because it's explicitly religious coercion.

  The assisted suicide case is tricky. The legislator says life is sacred without tying it to God. If the roommate uses Rule 1 (no divine appeals), she might accept it. But if she uses Rule 2 (publicly accessible reasons), she might reject it because "sacred" isn't justifiable without faith. Her silence when asked might indicate internal conflict or that she's leaning towards rejection but doesn't want to admit it, maybe because it aligns with her religious views but violates her principle.

  Next, the user wants a test case to distinguish the rules. The wetlands protection example uses both Qur'anic stewardship and secular science. Under Rule 1, since there's a divine appeal (Qur'an), it should be rejected. Under Rule 2, since the secular premise alone can support the law, it might be acceptable because the religious part is supplementary. Her stance on civil rights speeches suggests she allows religious rhetoric as long as it's not the sole justification. So if she accepts the wetlands case, Rule 2 is more likely.

  Putting it together: the roommate probably uses Rule 2. The sacredness argument in assisted suicide would be rejected because it's not publicly accessible. Her silence might mean she's uncomfortable with this conclusion since it opposes her beliefs. The wetlands case with dual premises would be acceptable under Rule 2, showing the religious element isn't necessary for the justification. The test case would clarify: if she accepts it, Rule 2 is confirmed; if not, maybe Rule 1 or another variant.
answer: |-
  Based on your roommate's consistent pattern and the tension in the assisted suicide case, here's the breakdown of the likely rules, a prediction, and a decisive test case:

  ### Candidate Rules & Their Fit
  1.  **Rule 1: No Appeal to Divine Authority/Revealed Premises**
      *   **Description:** Justifications for coercive law must avoid *explicitly* invoking God, scripture, divine commands, revelation, divine judgment, or religious institutional authority.
      *   **Fit with Record:**
          *   ✅ Bishop using scripture? Divine authority invoked. **Not okay.**
          *   ✅ Bishop using secular "rights-bearing person"? No divine appeal. **Okay.**
          *   ✅ Civil rights rhetoric ("God on the side of justice")? *Not* typically framed as "God commands this law or you'll be punished." It's a theological/moral *interpretation* of justice and solidarity, not a *divine command/revelation* used as coercion. **Admirable.**
          *   ✅ Utilitarian argument? Secular premises. **Okay.**
          *   ✅ Legislator threatening divine judgment? Explicit divine sanction invoked. **Not okay.**
      *   **Prediction on Assisted Suicide:** **Okay.** The legislator invokes "sacredness" without mentioning God, scripture, or divine commands. It *might* be faith-based, but it doesn't *appeal* to divine authority explicitly.

  2.  **Rule 2: Publicly Accessible Justification**
      *   **Description:** Coercive laws must be justified by premises and reasoning that citizens can understand, engage with, and potentially accept or reject *without needing to share any specific religious faith or doctrine*. The justification must stand on grounds accessible to reasonable citizens in a pluralistic society.
      *   **Fit with Record:**
          *   ✅ Bishop using scripture? Premise inaccessible to non-believers/non-Christians. **Not okay.**
          *   ✅ Bishop using secular "rights-bearing person"? Premise is accessible to secular philosophical debate. **Okay.**
          *   ✅ Civil rights rhetoric? While explicitly religious, the core *moral claims* (justice, equality, human dignity, ending oppression) were argued extensively on accessible secular grounds (Constitution, natural law, common morality). The religious language *reinforced* and *motivated* based on widely shared values, but wasn't the *only* or *inaccessible* justification relied upon by the movement itself in political advocacy. **Admirable** because the core *political justification* was accessible.
          *   ✅ Utilitarian argument? The premises (hedonism, aggregation) are philosophically contestable but *accessible* and assessable through secular reason/logic/evidence, even if unpopular. **Okay.**
          *   ✅ Legislator threatening divine judgment? Premise (divine punishment for casinos) is fundamentally inaccessible to non-believers. **Not okay.**
      *   **Prediction on Assisted Suicide:** **Not okay.** The premise "human life is sacred" *is* the load-bearing justification. While a secular person *might* hold this belief, there's no argument provided that makes it accessible or compelling to someone who doesn't already share that deep intuition (often rooted in religious/metaphysical views). It functions as a "brute fact" justification requiring faith/doctrinal acceptance.

  ### Best Guess & Why
  *   **Predicted Verdict on Assisted Suicide:** **Not Okay (Rule 2 Wins).**
  *   **Why Rule 2 is Likely Her Core Principle:**
      1.  **Civil Rights Exception:** This is the strongest evidence. Rule 1 would struggle to explain why explicit God-talk in political advocacy is "admirable" while the Bishop's scripture quote is not. Rule 2, however, distinguishes based on whether the *core justificatory burden* is carried by accessible reasons. The Civil Rights Movement grounded its demands powerfully in the Constitution, American ideals, and universal human dignity *alongside* the religious rhetoric. The religious language served as powerful *motivation* and *moral framing* for arguments that stood independently. The Bishop's scripture quote, in contrast, *was* the primary justification offered in that testimony.
      2.  **The Utilitarian Case:** Her acceptance of the unpopular utilitarian argument shows it's about *accessibility* (can you engage with the reasoning?) not *popularity* or *shared belief*. Rule 2 explains this perfectly. Rule 1 doesn't add anything here.
      3.  **The Silence:** Her reaction to the assisted suicide case is telling. If Rule 1 applied, it should be straightforwardly acceptable. Her silence suggests discomfort because she intuitively feels the "sacredness" argument fails her standard, *even though it aligns with her own beliefs*, and she might be grappling with the tension between her faith and her political principle. Rule 2 creates that tension; Rule 1 does not.
      4.  **Scope ("officials... justify coercive laws"):** The focus on *justification for coercion* aligns perfectly with the liberal concern for public reason/accessibility (Rule 2), not just the narrower avoidance of explicit God-talk (Rule 1).

  ### The Discriminating Test Case
  **Pose this to her at dinner:** "Imagine a state legislator arguing *against* a proposed tax cut for the wealthy. Their *sole* justification is: 'Such a tax cut violates the fundamental moral principle that society has a duty to prioritize the needs of the poor and vulnerable.' No religious texts, no divine commands, no threats of judgment. Just that moral premise as the bedrock reason. Would this be an acceptable public justification for their vote against the tax cut under your standard?"

  *   **Why this discriminates:**
      *   **Rule 1 (No Divine Appeal):** Would say **Yes.** No God, scripture, or divine command invoked.
      *   **Rule 2 (Public Accessibility):** Would likely say **No.** While many (religious and secular) hold this principle (e.g., Catholic Social Teaching, Rawlsian liberalism), it's presented as a fundamental, unargued moral axiom. A libertarian or strong proponent of meritocracy could reasonably reject this premise as a basis for coercion without any further secular argument about fairness, economic efficiency, social stability, or contractual obligation. It functions similarly to the "sacredness" premise – a deep moral commitment not universally shared or accessible without accepting a particular worldview.
  *   **What it reveals:** If she says **Yes**, she's likely primarily using **Rule 1**. If she says **No** or hesitates significantly, it strongly confirms **Rule 2** as her core principle, as it shows the concern is the *accessibility* and *defensibility* of the foundational premise itself, not just the absence of overt religious language.

  ### The Wetlands Case (Qur'anic Stewardship + Secular Science)
  *   **Rule 1 Prediction:** **Not Okay.** The justification explicitly includes an appeal to divine authority/revelation ("Qur'anic stewardship"). Even as one of two premises, Rule 1 likely prohibits *any* such appeal in the *official justification* for coercive law.
  *   **Rule 2 Prediction:** **Likely Okay.** Here's why:
      *   The secular conservation science premise is presented as a *sufficient, stand-alone justification*. Citizens can assess and potentially accept/reject the law based *entirely* on this accessible, evidence-based reason.
      *   The Qur'anic premise is offered as *additional* motivation, support, or grounding *for those who share that faith*, but it is not *necessary* for the public justification to hold weight. The core burden is carried by the accessible reason.
      *   This mirrors her view of Civil Rights rhetoric: religious language reinforcing/grounding a justification that stands on accessible secular grounds. The key is that the secular premise is *sufficient*.
  *   **Best Guess (Based on Rule 2):** She would say **this is Acceptable,** *provided* the legislator clearly presents the secular science as a sufficient reason and the Qur'anic reference as supplementary grounding or motivation for constituents. If the legislator framed the Qur'anic premise as *equally necessary* or implied the law only made sense through that lens, it might cross the line. But presented as "Science shows this is vital, *and* my faith tradition reinforces this duty," it aligns with the Civil Rights precedent she admires under Rule 2.

  **In summary:** Your roommate's silence on the assisted suicide case is a strong hint. Her pattern, especially her admiration for the Civil Rights Movement's rhetoric, points decisively towards **Rule 2: Publicly Accessible Justification** as her core principle. This predicts she would reject the "sacredness" argument for the assisted suicide ban and accept the wetlands justification combining secular science and Qur'anic stewardship. The tax cut test case will cleanly force the distinction if needed. Her principle seems rooted in a nuanced understanding of liberal democracy and public reason, demanding that coercion be justified on grounds all citizens can engage with, even if religious language inspires or reinforces those justifications.
