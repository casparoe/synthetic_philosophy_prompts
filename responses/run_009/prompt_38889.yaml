answer: |-
  Here's that breakdown—good catch on spotting the friction:

  **The two rationales**  
  Story 1 (Representativeness): The lottery acts like a statistical mirror. By randomly selecting citizens, the assembly *looks like* the whole population demographically and attitudinally. Decisions made here feel legitimate because "people like me" had a seat at the table. It's about fidelity to the public's composition.  
  Story 2 (Deliberative Quality): Random selection pulls in ordinary people free from partisan pressures or careerist motives. The lottery creates a space where diverse folks can genuinely listen, learn, and reason together about the common good, potentially reaching wiser, less polarized conclusions than elected bodies.

  **Where they conflict**  
  The core tension is between *who* shows up and *how* they engage. Mandatory service gets you closer to Story 1's true sample – even the apathetic or busy are included. But if people resent being forced, they might tune out, dominate poorly, or disengage, wrecking Story 2's deliberative ideal. Opt-in service fixes *that* – volunteers are likely more motivated, patient, and willing to learn, boosting deliberation (Story 2). But now your sample skews toward the civically-minded, educated, and those with flexible schedules (e.g., retirees, salaried professionals). It's no longer a true microcosm (Story 1). You sacrifice representativeness for better process, or vice-versa.

  **Design patches and what they actually buy you**  
  The common fix is **stratified random sampling from a volunteer pool**: Invite everyone, take only volunteers, *but* use quotas to ensure the volunteers selected match the population on key demographics (age, gender, education, region, etc.). This *does* buy you something important:
  *   **Fixed Mirrors:** It guarantees the assembly *looks* demographically representative on the dimensions you target (e.g., no assembly of only college grads if most people aren't). This bolsters Story 1's *descriptive* legitimacy significantly.
  *   **Better Engagement (Likely):** Since it's still volunteers, you likely get better deliberation than forcing the utterly unwilling.  
  **BUT:** It doesn't fix the *underlying self-selection bias*. You're forcing the volunteer pool *demographically*, not *attitudinally* or *motivationally*. The people who *choose* to volunteer within each quota cell (e.g., "non-college-educated women aged 30-40") are still likely more civically-minded, politically aware, or have stronger opinions (pro or con) on the topic than others in that same demographic who *didn't* volunteer. Stratification fixes the surface picture, but the deeper currents of *who volunteers* remain.

  **Pushing back on your hunch**  
  Your hunch is largely solid: stratification *absolutely cannot* directly fix motivational skews like civic engagement or baseline political interest – you can't quota for "level of apathy." However, it *indirectly* mitigates *some* of this. By ensuring diverse demographics, you *do* get people with different life experiences that *correlate* with differing levels of engagement (e.g., including less-educated folks often pulls in people less tuned into politics). It dilutes the *most extreme* self-selection skews. But the core issue remains: within *each* demographic slice, the volunteers are probably still more engaged than the non-volunteers. So, stratification smooths the bumps but doesn't level the whole terrain.
