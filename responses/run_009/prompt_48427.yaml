prompt: |-
  I just got out of a two-hour arguement with my Dutch friend that ended with her half-jokingly saying Americans have no idea what "liberal" means. It started because I described myself as a liberal — I'm for abortion rights, a bigger welfare state, higher taxes on the rich. She said that in the Netherlands "liberal" means roughly her own party — the one English-language news always describes as the Dutch liberals — free markets, lower taxes, smaller government, and that by her lights my politics are social-democratic, not liberal at all. Then it got messy: we checked that her party sits in the same European Parliament group as the German free-market FDP, while in America "liberal" basically means the left wing of the Democratic party. But when we asked each other what the word USED to mean, we gave the same answer: individual rights, toleration, constitutional government, free trade. So the weird part is that the old core seems intact everywhere, and yet in Europe the word lands center-right and in America center-left. She ended up saying the two uses are just homonyms that happen to share a history, like "pole" the rod and "pole" the Polish person, and I ended up saying that can't be right because both of us could still recognize a third country's liberal party as liberal on sight. Don't just tell me the word is ambiguous and leave it there — take a definite side: is there one principled meaning under which both her usage and mine fit, and if so, what exactly flipped between Europe and America to move the same tradition to opposite sides? And if you can, untangle the bonus round that broke our arguement: why does "neoliberal" get used as an insult by the left even though it has "liberal" right in it, when "liberal" itself is, in America, a word the left uses about itself.
reasoning: |-
  Okay, let me unravel this user's complex query about the transatlantic meaning split of "liberal." They're clearly frustrated after a heated debate with their Dutch friend and want more than just dictionary definitions - they're seeking a coherent historical explanation that reconciles both usages under a single principled framework. 

  The core puzzle is fascinating: how did a political tradition centered on individual liberty end up meaning center-right in Europe but center-left in America? I recall that in European academia this is often explained through the "liberalism vs. democracy" tension in the 19th century. But the user's specific examples (abortion rights vs free markets) suggest they need concrete policy mappings alongside theoretical framing.

  Hmm, their bonus question about "neoliberal" is particularly insightful - it reveals they've noticed the American left's paradoxical language where "liberal" is claimed proudly while "neoliberal" is spat out. That deserves special attention because it's not just historical but about present-day political rhetoric.

  What they're really digging for, I suspect, is whether their self-identification as "liberal" connects them to some global tradition or if it's purely American. There's an unspoken identity question here beneath the semantics. The Dutch friend's challenge shook their political self-concept.

  The historical turning point seems to be the New Deal era - that's when American liberals embraced state intervention for social justice while European liberals doubled down on classical economics. But I should emphasize this wasn't a clean break: both strands still share DNA of rights and tolerance, just prioritized differently when facing industrialization's challenges.

  For the neoliberal paradox, I'll need to distinguish policy substance from rhetorical branding. The key is that American progressives see "neoliberalism" as betraying liberalism's social justice potential - it's the linguistic equivalent of accusing someone of heresy against their own creed. That might help the user understand why their Dutch friend's party could be both "liberal" and "neoliberal" simultaneously from different vantage points.

  Most importantly, I must avoid the "it's ambiguous" cop-out they explicitly rejected. The solution lies in showing how competing visions emerged from shared roots - like siblings inheriting different traits from the same parents. The user's recognition of third-country liberal parties proves the family resemblance persists despite quarrels.
answer: |-
  You're absolutely right that this isn't just random ambiguity – there *is* a core meaning connecting both uses, but a major political realignment in the US fundamentally shifted how the core principles were applied to economic policy. Here's the breakdown:

  1.  **The Unchanging Core:** Both US and European liberalism descend from **Classical Liberalism**. The shared bedrock principles are:
      *   **Individual Liberty:** The primacy of individual freedom as the highest political good.
      *   **Limited Government:** Government power should be constrained to protect liberty.
      *   **Constitutionalism & Rule of Law:** Protection against arbitrary state power.
      *   **Toleration:** Religious freedom, freedom of speech/expression, freedom of association.
      *   **Free Markets & Private Property:** Seen as essential engines of individual freedom and prosperity.

  2.  **The Great Divergence: The Role of Government in Achieving Liberty & Equality:**
      *   **The European Path (Maintaining the Classical Core):** European liberal parties generally remained closer to the 19th-century classical model. They focused primarily on **negative liberty** ("freedom *from*" government interference, especially in the economic sphere). Their core agenda became:
          *   Minimizing state intervention in the economy.
          *   Lower taxes.
          *   Free trade.
          *   Deregulation.
          *   Protecting individual rights *against* the state. For them, a large welfare state *was* the threat to liberty (via high taxes, dependency, state overreach).
          *   **Result:** "Liberal" = Center-Right, Free-Market Advocate (VVD, FDP, etc.).

      *   **The American Path (Expanding the Core for Social Justice):** Facing the devastating social consequences of the Gilded Age and the Great Depression, American liberalism underwent a profound transformation starting with the Progressive Era and cemented by the New Deal. This "**Modern Liberalism**" or "**Social Liberalism**" argued that:
          *   Unfettered capitalism created massive inequalities and concentrations of private power that *themselves* threatened individual liberty and opportunity ("freedom *to*" have a decent life, healthcare, education).
          *   True individual freedom required a baseline of economic security and social justice. Poverty, discrimination, and lack of opportunity were seen as fundamental denials of liberty.
          *   Government wasn't just a potential threat to liberty; it could be a necessary *tool* to create the conditions for *genuine* liberty and equality of opportunity by regulating excesses, providing social safety nets, and investing in public goods.
          *   **Result:** "Liberal" = Center-Left, advocating for civil liberties *plus* social safety nets, regulated capitalism, progressive taxation, and government action to address social inequalities. The core commitment to individual rights (now expanded to civil rights, women's rights, LGBTQ+ rights) remained, but the *means* of achieving liberty expanded dramatically to include positive state action.

  3.  **Why Both Sides Still Recognize the Core:**
      *   Both prioritize **individual rights** (speech, religion, assembly, due process). A Dutch VVD member and an American ACLU member agree fiercely on free speech.
      *   Both believe in **constitutional government and rule of law** as safeguards against tyranny.
      *   Both value **toleration** and pluralism.
      *   **The Disagreement is Primarily Economic:** It's about *how* the state relates to the market to achieve liberty and justice. Is the state the main *threat* to economic liberty, or is it a necessary *corrective* to private power and inequality that also stifle liberty? This single, massive divergence explains the left-right flip within the shared tradition.

  **The Bonus Round: Untangling "Neoliberal"**

  1.  **Origin:** "Neoliberalism" emerged in the mid-20th century (e.g., Mont Pelerin Society) as a *reaction against* both Keynesianism/social democracy *and* classical socialism. Its proponents *(like Milton Friedman, Friedrich Hayek)* sought to *revive* core classical liberal principles – free markets, minimal state intervention, deregulation, privatization – which they felt had been abandoned by *both* mainstream conservatives *and* modern liberals/social democrats after WW2. They were "neo" (new) liberals because they were reviving the *classical* tradition in a new context.
  2.  **The Insult:** The left uses "neoliberal" as an insult *specifically* because it sees neoliberalism as:
      *   **A Betrayal of Social Justice:** It accuses neoliberalism of prioritizing free markets and corporate interests *above* social welfare, workers' rights, environmental protection, and reducing inequality – goals central to modern American liberalism and social democracy.
      *   **Causing Harm:** The left blames neoliberal policies (deregulation, austerity, privatization, free trade deals seen as favoring capital) for increasing inequality, financial crises (like 2008), erosion of public services, environmental degradation, and the weakening of labor unions.
      *   **Hijacking the Word "Liberal":** From the left's perspective, neoliberalism cynically uses the language of "freedom" and "liberty" (classical liberalism) to mask policies that primarily benefit the wealthy and powerful, while dismantling the social safety nets and regulations that modern liberals see as essential for *broadly shared* liberty and security. It's seen as "liberal" in the *classical/European* sense, which is *antithetical* to the goals of the *modern American* left.
      *   **Distinguishing Enemy from Ally:** For the American left, "neoliberal" is a way to criticize centrist Democrats (e.g., Clinton, Obama on certain economic policies) or center-right figures who they believe prioritize market-friendly policies over robust social democratic ones, *while still claiming the "liberal" label*. It says: "You claim to be liberal (like us), but your *economics* are actually this harmful classical/neo variety."

  **Conclusion:**

  *   **There is one principled core:** Commitment to individual liberty, limited government (in the sense of constrained power), constitutionalism, toleration, and free markets *as a starting point*.
  *   **What flipped:** The interpretation of how "limited government" and "free markets" interact with the goal of achieving *substantive* liberty and justice in an industrialized society. Europe largely kept the classical economic focus, making "liberal" center-right. The US fused civil libertarianism with activist government for social justice, making "liberal" center-left.
  *   **"Neoliberal" is an insult** from the left because it represents the *classical/European* economic strand of liberalism that the modern American left explicitly rejects as harmful and antithetical to its social justice goals, even though both strands share the word "liberal" and the core commitment to political/civil liberties.

  **Your Dutch friend's VVD is "liberal" in the classical/economic sense.** **You are "liberal" in the modern American/social sense.** **Both descend from the same philosophical tradition but took radically different paths on the role of the state in the economy.** They aren't homonyms like "pole"; they are estranged cousins who still recognize some shared family traits but fundamentally disagree on how to live.
