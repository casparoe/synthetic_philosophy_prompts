prompt: |-
  I'm a novelist, and I've been asked to contribute an essay to a craft journal on what exactly it is for a character to *have* the traits I give her — courage, stinginess, vanity — as opposed to merely enacting them on the page. Before drafting it, I'd like an audit of the position I've drifted into over the years, because I suspect it doesn't fully cohere. Here are the commitments, as best I can state them. First: a character's traits are dispositions. To say my protagonist is patient is to make a claim about how she would tend to act and react across a range of situations, not about any single scene. Second: a character can possess a trait that is never manifested anywhere in the book. I know my current heroine would walk into a burning building for her brother, though no fire ever occurs in the novel, and I think a reader who inferred as much from what the text does show could be correct. Third: manifestation doesn't suffice either. A character who performs generous acts purely out of vanity is not generous but vain; the mask doesn't count. Fourth: there is a fact of the matter about a character's traits over and above anything the text displays — trait ascriptions to fictional people can be right or wrong, and not merely by my say-so at the moment of writing. Fifth, a craft doctrine I hold firmly: the only honest way to establish a trait on the page is to test it — to place the character in the situation that would call the trait forth and write what happens; otherwise you're just asserting. And sixth: if I resolve, as author, never to let my coward face a real test — always to ring the phone, always to contrive his escape or anesthetize him with borrowed courage before the danger can arrive — I have not thereby made him not-a-coward. The cowardice is still there; I've only made sure it never shows.

  Some of these, I suspect, are pulling against each other, and some only look like it. The one that gnaws at me: if a trait is a disposition, and a disposition is a matter of how the character would tend to act, what fixes the "would" for a woman who never faces the fire? In a real person the unmanifested disposition has a ground in her history and makeup; in my heroine there is nothing but prose, and I could write her either way tomorrow. Does the fourth commitment survive that? Does the sixth sit with the first, given that on the simplest reading of dispositions my perpetually rescued coward comes out brave — danger arises, a brave act occurs, by my contrivance? And is the fifth in genuine conflict with the second, or does that tension dissolve on inspection?

  Please go through the six commitments and tell me which pairs are in genuine tension and how badly; for each, what would have to give and what the revision costs; which pairs only look to be in tension and why the appearance dissolves; and which single revision, if any, would clean up the most. Treat me as a colleague who can handle the technical literature on dispositions — finks, masks, antidotes, conditional analyses — but wants the verdicts applied to fictional characters rather than to fragile glass or irascible wires. Please answer in American English.
reasoning: |-
  Okay, the user is a novelist grappling with the philosophical tension between character traits as inherent dispositions versus their textual manifestations. They've laid out six commitments about how traits function in fiction, but suspect inconsistencies. 

  First, I need to map the fault lines. Commitment 1 (traits as dispositions) clashes with 6 (unmanifested traits persist) when authors prevent tests—if a coward never faces danger due to narrative intervention, does his disposition vanish? The conditional analysis of dispositions would say yes (no stimulus = no trait), but that feels wrong for fiction. The solution might be to treat fictional dispositions as author-guaranteed counterfactuals: the coward *would* flinch *if* tested, even when the test is dodged.

  Commitment 2 (traits can exist unmanifested) seems to war with 5 (traits require testing), but only if we confuse epistemic access (how readers know) with ontology (what exists in the storyworld). The author plants clues like a gardener burying bulbs—the reader infers roots from partial sprouts. 

  Commitment 3 (vanity masking generosity) reveals a deeper principle: traits require proper manifestation conditions. A "generous" act done for applause isn't generosity—it's performance. This mirrors real-world disposition masks. 

  Commitment 4 (objective trait facts) is the keystone. It holds because the author defines the storyworld's rules. When the novelist declares her heroine would run into flames, that's canon—not opinion. The prose limitation is practical (readers need evidence) not metaphysical.

  The biggest threat is Commitment 6 undermining Commitment 1. If narrative intervention voids dispositions, traits become flimsy. But revising disposition theory for fiction fixes it: authors sustain counterfactuals by fiat. The coward remains cowardly *because* the author sustains the untested "would." 

  Technical tweak: borrow Martin's "finkish dispositions" but note authors can't fink their own characters—when the coward's phone rings mid-test, it's not disposition-change but authorial suppression. Call it "narrative antidotes." 

  Craft consequence: Commitment 5 stays sacred. Testing isn't just proof; it's revelation. Avoiding tests doesn't negate traits—it just leaves them as ghostly potentials. The unburned building still smolders in the character's implied history.
answer: |-
  Your position is philosophically sophisticated but contains genuine tensions—particularly between realism about dispositions and authorial freedom. Let's audit each friction point using disposition theory (American English throughout):

  ### 1. Core Tensions  
  **Commitments 1 & 6** (Dispositions vs. Untested Traits)  
  - **Tension:** If traits are dispositions defined by *conditional responses* (Commitment 1), then a coward who consistently avoids danger *by authorial intervention* appears dispositionally brave (he "acts bravely" when threats arise). But Commitment 6 insists he remains a coward.  
  - **Resolution:** Revise the dispositional analysis. Traits aren't just *stimulus-response* conditionals ("if danger, then cower") but include **latent capacities** grounded in the character's psychology. The coward's *unactualized capacity to panic* persists even when threats are narratively defused. (Cf. Martin's "finks": external blockers don't erase dispositions.)  
  - **Cost:** Weakens the neatness of conditional analyses but better fits fictional ontology.  

  **Commitments 2 & 5** (Unmanifested Traits vs. Testing Requirement)  
  - **Apparent Tension:** How can a trait exist without textual manifestation (Commitment 2) if it must be tested to be "honestly established" (Commitment 5)?  
  - **Dissolution:** Commitment 5 is **epistemic** (how readers *infer* traits), while Commitment 2 is **ontological** (what traits *exist* in the storyworld). You can imply latent traits through:  
    - Secondary evidence (e.g., a character's history of risk-taking)  
    - Thematic patterning (e.g., parallel choices in lower-stakes scenarios)  
    - Authorial "chekovisms" (e.g., emphasizing her firefighter training)  
  - **Verification:** A reader inferring unmanifested courage isn't guessing—they're tracking *supporting evidence* you embedded.  

  **Commitments 3 & 4** (Masking vs. Objective Traits)  
  - **Synergy:** Commitment 3 (vanity masking generosity) reinforces Commitment 4 (objective traits). Masking scenarios *require* that true dispositions exist beneath behavior. A vain person *faking* generosity proves generosity is a real property distinct from its imitation.  

  ### 2. Stable Commitments  
  **Commitment 3** (Masks Don’t Count)  
  - Aligns perfectly with disposition theory: a "mask" (e.g., acting generously from vanity) is a **dispositional interferer** that prevents genuine manifestation.  

  **Commitment 4** (Objective Trait Facts)  
  - Holds if you accept fictional characters as **abstract artifacts** with author-stipulated properties. Your authority fixes their dispositions at creation, but readers discover them through textual evidence.  

  ### 3. The Gnawing Problem: Unactualized Dispositions  
  **Commitments 1, 2 & 6** (What Grounds the "Would"?)  
  - **Challenge:** If your heroine never faces fire, what grounds her *disposition* to enter it?  
  - **Solution:**  
    1. **Fictional Grounding:** Her disposition is fixed by her *backstory* (established or implied) and *psychology* (e.g., loyalty established via smaller sacrifices).  
    2. **Authorial Stipulation:** As creator, you define her capacities. If you write her as "someone who *would* do X," that's canonical—*unless contradicted by textual evidence*.  
    3. **Possible Worlds:** Her disposition exists in the novel's **modal space**—how she *would* act in nearby possible worlds (e.g., a draft where the fire occurs).  

  ### 4. Single Revision to Maximize Coherence  
  **Revise Commitment 1:**  
  - **Current:** "Traits are dispositions [defined by conditional responses]."  
  - **Revised:** "Traits are **stable behavioral capacities** rooted in a character's psychology, which *would* manifest *if* apt conditions arise *and* no masks/interferers block them."  
  - **Why This Fixes Most:**  
    - Explains Commitment 6 (blocked tests don't negate capacity).  
    - Supports Commitment 2 (capacities exist even unmanifested).  
    - Retains realism about dispositions while accommodating fiction.  
  - **Cost:** Less tidy than a strict conditional analysis, but avoids "finkish" contradictions (e.g., coward "becoming brave" when authors intervene).  

  ### 5. Craft Implications  
  - **Testing (Commitment 5)** remains your best tool for *proving* traits to readers—but not the *only* way to establish them. Foreshadowing, backstory, and thematic resonance can imply latent dispositions.  
  - **Avoiding tests** (Commitment 6) doesn't erase traits; it leaves them as **unactualized potentials**. Readers may still infer them if contextual evidence exists.  

  ### Final Diagnosis  
  Your framework is 90% coherent. The only major tension is between **naive dispositionalism** (Commitment 1) and **authorial control** (Commitments 2 & 6). Revising dispositions as **psychologically grounded capacities** (not just conditionals) resolves this. Commitments 3–5 are rock-solid. The "unmanifested trait" problem dissolves when distinguishing *reader access* (epistemology) from *trait existence* (ontology).  

  > **Recommended Literature**: David Lewis' "Finkish Dispositions" (avoiding conditional analyses) + Amie Thomasson's *Fiction and Metaphysics* (fictional objects as abstract artifacts). Apply these to fiction by treating characters as entities with **author-guaranteed counterfactual properties**.
