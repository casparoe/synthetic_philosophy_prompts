prompt: |-
  I chair the five-member appeals panel of my university's academic integrity system. Last week we heard a student's appeal of a plagiarism finding, and our regulations direct us to uphold the finding only if the panel concludes both that (i) the contested passages were copied from the identified sources and that (ii) the student understood that she was presenting another's work as her own. On the first question we split 3–2 for copying: the majority found the textual overlap too extensive for coincidence, while the minority thought the overlapping strings were mostly unremarkable factual phrasing. On the second question we also split 3–2, but with a different majority: the same three members found that the student, who drafted the paper in her second language and had never been taught citation conventions, did not understand what the norms required, while the other two found she plainly knew what she was doing. Every member then voted on the bottom line exactly as her two findings dictated, so the finding was rejected 1–4 — even though a majority of us affirmed each element required to uphold it. Our charter says appeals are decided by majority vote of the panel and is silent on whether that means a vote on the bottom line, votes on the elements, or something else; it also gives the chair discretion over how contested issues are framed. Before we issue a decision, two colleagues are circulating a proposed standing rule that all future appeals be decided by majority vote on the elements, since that is how a court would instruct a jury. Please draft the short written opinion I will circulate before our Thursday meeting: recommend how we should decide this case and whether to adopt the elements rule, a bottom-line rule, or something else — and if your recommendation is that we deliberate to consensus rather than vote, say what we should do when deliberation deadlocks, as ours effectively did. Engage seriously with the strongest consideration on whichever side you come out against. In particular, whichever rule we choose, someone — an accused student, an accuser, or the office that frames the charge — can profit from how the issues get sliced up, and I want the memo to say something honest about that rather than pretend any rule is neutral.
reasoning: |-
  Okay, the user chairs a five-member appeals panel dealing with a plagiarism appeal. They've encountered a situation where the panel split 3-2 on each required element but ended up rejecting the plagiarism finding 4-1 because each member voted based on their findings on the elements. Now there's a proposal to change how votes are taken - either on elements or the bottom line. The user needs to draft a memo recommending how to handle this case and what rule to adopt going forward.

  First, I need to understand the core dilemma. The regulations require two elements to uphold a plagiarism finding: (i) actual copying and (ii) understanding of wrongdoing. In this case, three members found copying occurred, and separately three found lack of understanding - but not the same three for both. This creates a logical inconsistency in the outcome since majorities supported both elements yet the finding was rejected.

  The user specifically wants me to address how different parties could "profit" from how issues are framed - accused students might benefit from element-based voting if it creates contradictory majorities, while accusers might prefer bottom-line voting that could lead to upholding findings even when an element isn't affirmed by majority. There's also the office that frames charges - their charging decisions could strategically influence where doubts might arise.

  Hmm... the judicial analogy is interesting but imperfect. Juries decide elements but must be unanimous, while this panel uses majority voting. Also, academic integrity isn't criminal law - the stakes and standards differ. Still, the element-based approach has merit because it forces clarity on what exactly is being decided.

  For the immediate case, I think the fairest solution is to declare a deadlock and rehear the appeal with clearer instructions. This acknowledges the procedural confusion without letting either party benefit unfairly from the panel's internal contradictions. 

  For future cases, I'm leaning toward recommending element-based voting plus a deadlock protocol. This aligns with the two-element structure of the regulation. When deadlock occurs, we should have clear rules - perhaps the finding stands if neither side gets majority support on appeal? But that needs careful wording to avoid incentivizing strategic voting.

  Most importantly, the memo must honestly acknowledge that no voting system is perfectly neutral. Bottom-line voting might overlook element deficiencies, while element voting might produce contradictory outcomes. The key is choosing the method that best serves truth-finding while being transparent about its limitations.

  The user also mentioned discretion in framing issues - that's crucial. The chair should ensure elements are phrased neutrally and cover all necessary aspects without fragmentation that could lead to manipulation. Maybe include a note about the chair's responsibility in this regard.

  For the memo structure: start with the immediate case recommendation, then the standing rule proposal, then the fairness considerations. Use plain language - no legalese. Emphasize that this is about getting the right outcome under the regulations, not just procedural neatness.
answer: |-
  ## MEMORANDUM  
  **To:** Appeals Panel Members  
  **From:** Chair, Academic Integrity Appeals Panel  
  **Date:** October 26, 2023  
  **Subject:** Decision Protocol & Recommendation on Recent Appeal (Case #AIC-2023-147)  

  ### I. Recommendation for the Current Case
  **We must declare a deadlock and rehear the appeal.** Our regulations mandate upholding the plagiarism finding *only* if *both* elements are satisfied. While majorities affirmed each element (3–2 for copying; 3–2 for lack of understanding), no majority affirmed *both* simultaneously. The 1–4 bottom-line vote reflects individual applications of the conjunctive rule but does not resolve the panel’s collective failure to agree on the necessary conditions under our regulations. Issuing a decision based on this flawed process risks injustice to both the student and the faculty. I will reconvene the panel to deliberate anew, with clearer framing of the questions, aiming for consensus or a vote explicitly structured on the conjunctive requirement. If deadlock persists, our default should be to *dismiss the appeal* (upholding the original finding) only if a majority affirms both elements *in a single, integrated vote*.

  ### II. Recommendation for Standing Rule: Element-Based Voting with Deadlock Protocol
  **Adopt a rule requiring separate majority votes on each essential element**, followed by a bottom-line application of the conjunctive rule. However, **add a clear deadlock protocol**:
  1. **Vote separately** on each regulatory element (e.g., "Did copying occur?" "Did the student understand?").
  2. **If both elements pass by majority,** uphold the finding.
  3. **If both fail by majority,** reject the finding.
  4. **If deadlock (one element passes, one fails):**  
     - **Deliberate further** to resolve the inconsistency.  
     - **If deadlock persists,** the appeal is **dismissed** (original finding stands) *only if* a separate majority vote confirms: *"Based on the totality of evidence, the regulatory standard for upholding the finding is met."* If no majority agrees, the appeal is **upheld** (finding overturned).

  ### III. Why Elements + Deadlock Protocol (Not Bottom-Line or Consensus-Only)
  - **Strengthens Regulatory Fidelity:** Our mandate requires *both* elements. Element-based voting ensures neither is overlooked or conflated. A bottom-line vote risks upholding a finding where a crucial element lacks majority support (e.g., copying affirmed but understanding not proven).  
  - **Promotes Deliberative Rigor:** Forcing separate consideration of each element clarifies disagreements (e.g., was the minority’s doubt about copying or intent?). This aids consensus-seeking while accepting that votes are sometimes necessary.  
  - **Addresses the "Slicing" Problem Honestly:**  
    - *Element voting risks "exonerating by fragmentation":* An accused student *could* benefit if majorities affirm elements in contradictory ways (as occurred here). Our deadlock protocol mitigates this by requiring a final integrative vote when fragmentation happens.  
    - *Bottom-line voting risks "convicting by conflation":* A majority might uphold a finding based on strong evidence for *one* element while downplaying legitimate doubt on the other (e.g., "The copying was so blatant, she *must* have known"). This undermines the regulation’s dual requirements.  
    - **No Neutral Rule Exists:** Every approach advantages someone. Elements + deadlock prioritizes *precision* and *regulatory compliance* over procedural simplicity, accepting that rehearings may sometimes be needed to prevent injustice from fragmented outcomes.  
  - **Superior to Mandatory Consensus:** While consensus is ideal, mandating it ignores practical realities like deadlocks. Our protocol builds in deliberation but provides a fair, transparent vote-based resolution when consensus fails.

  ### IV. Strongest Consideration Against Element Voting: Potential for Incoherent Outcomes
  **The strongest objection is that separate votes can yield logically inconsistent results** (affirming both elements yet rejecting the finding, as here), creating confusion and eroding confidence in the system. This is a serious concern. **Our response:**  
  1. **Deadlock Protocol as Safeguard:** The final integrative vote during deadlock prevents an outcome where fragmented majorities mechanically override the conjunctive rule.  
  2. **Chair’s Duty in Framing:** The Chair must ensure elements are phrased precisely and are genuinely *necessary and sufficient* for the bottom-line outcome. Ambiguous or non-essential "elements" invite gaming.  
  3. **Transparency:** Explaining in our decision *why* a deadlock occurred (e.g., "While a majority found copying, a different majority found no understanding, and no majority found both") maintains legitimacy by demonstrating rigorous adherence to the regulation’s structure, even when it yields complexity.

  ### V. Path Forward
  1. **Current Case:** We will rehear Case #AIC-2023-147 at the earliest opportunity, applying the element-based approach with the deadlock protocol outlined above.  
  2. **Standing Rule:** I recommend adopting the **Element-Based Voting with Deadlock Protocol** as our standing rule. I invite discussion and amendment at Thursday’s meeting.

  This approach honors our mandate’s structure, forces clarity in deliberation, and confronts the inherent trade-offs in any voting system with transparency. No rule guarantees simplicity, but this best balances fidelity, fairness, and feasibility.

  **Chair**  
  Academic Integrity Appeals Panel  

  ---

  **Key Rationale Summarized:**  
  - **Current Case:** Rehearing is required due to procedural incoherence.  
  - **Standing Rule:** **Element-Based Voting + Deadlock Protocol** (Integrative Vote on Totality).  
  - **Why:** Ensures each regulatory element gets direct scrutiny; deadlock protocol resolves fragmentation fairly.  
  - **Against Bottom-Line Voting:** Risks overlooking lack of majority support for a required element.  
  - **Against Pure Consensus:** Impractical for deadlocks; votes are necessary.  
  - **Honest Trade-off:** Acknowledges element voting *can* advantage the accused via fragmentation but argues the deadlock protocol and Chair’s framing role mitigate this better than alternatives serve competing values.
