  1) Avoiding leveling down is low-hanging fruit (even utilitarians can do it)
  2) The priority view's true test is justifying transfers to the worse-off *without* relational reasoning 
  3) The intrapersonal case exposes whether prioritarianism treats persons as unified entities or mere containers for welfare

  *Scratching head*... The tricky part is designing a question that doesn't lead students by the nose to the "tension" conclusion. Need wording that allows equally defensible positions. Also, the model answer must demonstrate how to engage the twist seriously - either as a devastating critique or a non-problem.

  *Brainstorming*... For the marking scheme, these seem like non-negotiable elements:
  - Must recognize leveling-down avoidance isn't unique to prioritarianism (common student fumble: overclaiming this as prioritarianism's big win)
  - Must analyze trade-off cases as the real battleground (typical weakness: skipping straight to leveling down without this pivot)
  - Must confront separateness-of-persons justification (classic fumble: letting prioritarianism off the hook by not pressing its anti-relational commitment)
  - Must engage intrapersonal case substantively (danger zone: dismissing it as irrelevant or mischaracterizing it)

  *Double-checking*... User definitely wants this to feel like a live philosophical puzzle, not an exercise in reproducing lecture notes. The model answer should model uncertainty where appropriate - hence the "defensible either way" framing in part 3.

  *Finalizing approach*... The question should force students to:
  First: Expose the emptiness of "we avoid leveling down" as a differentiator  
  Second: Put prioritarianism on trial in trade-off cases  
  Third: Make them choose and defend a stance on intrapersonal application  

  Marking scheme should reward depth over "correctness" - hence heavy allocation to argument development rather than position taken.
answer: |-
  Below is a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. The question pushes students beyond rote responses and integrates the intrapersonal twist as a genuine philosophical puzzle.

  ---

  ### **Exam Question**  
  *Distributive Justice Section | Time Allowed: 45 minutes*  

  > "Prioritarianism is often defended as superior to telic egalitarianism because it avoids the leveling-down objection. Yet avoiding leveling down is straightforward for many non-relational theories.  
  >  
  > (a) Explain why the *true* test of prioritarianism lies in trade-off cases (e.g., benefiting the worse off at a cost to the better off), and whether it can justify its verdicts in these cases *without* relying on covertly relational reasoning. (10 marks)  
  >  
  > (b) Consider an *intrapersonal* analogue: A policy makes a single person’s life worse overall but more equal across periods (e.g., reducing a high to avoid a low, without compensation). Does prioritarianism’s response to this case expose a tension in its foundations, or is it irrelevant to the view’s distributive aims? Defend your position. (10 marks)"  

  ---

  ### **Model Answer** (≈600 words)  

  **(a)** The leveling-down objection (LDO) is a powerful critique of telic egalitarianism: reducing inequality by harming the better off without aiding anyone seems *pro tanto* good for egalitarians, despite making outcomes strictly worse. Prioritarianism avoids this by weighting well-being gains to the worse off more heavily, justifying inequality reduction only when it improves the worse off’s absolute position. However, avoiding the LDO is not distinctive to prioritarianism. Utilitarianism also rejects leveling down, as it only cares about aggregate well-being. The *real* test for prioritarianism is whether its core commitment—giving *priority* to the worse off based on their absolute, not relative, disadvantage—can coherently explain why we should favor transfers benefiting the worse off at some cost to the better off in *trade-off* cases (e.g., Parfit’s "100 units to the worse off vs. 105 to the better off").  

  Prioritarianism grounds these judgments in the "separateness of persons": since moral weight attaches to individuals’ absolute welfare levels, benefiting someone at a low absolute level matters more than benefiting someone at a high level. Yet critics like Otsuka and Voorhoeve argue that prioritarianism covertly relies on relational considerations. For instance, if we have two equally poor individuals and can aid only one, prioritarianism treats this as neutral between them—but if one is slightly worse off, aiding them takes strict priority. This shift appears to depend on the *comparison* between their states, undermining the view’s non-relational claims. While prioritarians (e.g., Crisp) retort that absolute thresholds (e.g., "sufficiency") anchor priority, this risks collapsing into a hybrid view. Thus, prioritarianism’s success hinges on whether it can defend trade-off verdicts *solely* via non-comparative urgency tied to absolute well-being.  

  **(b)** The intrapersonal case—flattening a single life’s peaks without raising valleys—challenges prioritarianism’s foundations. Suppose we lower a person’s high-quality life period to avoid a future low, reducing their total well-being but making their life more even. Telic egalitarianism might endorse this for "smoothing" within a life, but prioritarianism faces a dilemma.  

  *Option 1: Intrapersonal leveling down is irrelevant*. Prioritarianism concerns *interpersonal* distribution. Its moral weight derives from distinct persons’ claims (via the separateness of persons), not sub-personal time slices. Here, the person is made worse off overall, violating prioritarianism’s commitment to absolute well-being. This preserves coherence but risks inconsistency: if periods of a life are merely "containers" of welfare, why not weight gains to low-periods more heavily? Yet doing so would ignore that all periods belong to *one person* with unified interests (e.g., prudential rationality favors aggregate gains).  

  *Option 2: It exposes a tension*. If prioritarianism weights welfare gains based solely on the absolute level of the recipient—regardless of whether recipients are persons or temporal parts—it *should* condemn intrapersonal leveling down (as total welfare falls). But this reveals a deeper issue: prioritarianism’s indifference to whether beneficiaries are distinct persons or temporal segments of one life. If it treats both cases identically, it violates the separateness of persons; if it treats them differently, it must explain why "personhood" changes moral weighting in a way not reducible to absolute welfare.  

  I defend Option 2. Prioritarianism’s core machinery (diminishing moral weight per unit of well-being as absolute levels rise) applies mechanically to any welfare recipient. Yet its motivation—respecting separate persons—lacks a clear analogue within a single life. This suggests prioritarianism either:  
  (i) Illegitimately ignores the unity of personal identity in intrapersonal cases, or  
  (ii) Secretly relies on relational (personhood-focused) properties it officially rejects.  
  Either outcome undermines its non-relational aspirations.  

  ---

  ### **Marking Scheme (20 marks total)**  

  #### **(a) Trade-off Cases: The True Test (10 marks)**  
  - **4 marks: Explain why avoiding LDO is not unique to prioritarianism**  
    *e.g., Note utilitarianism also avoids LDO; LDO avoidance is necessary but insufficient for justifying prioritarianism.*  
    *Fumble:* Claiming LDO avoidance is prioritarianism’s key advantage without qualification.  
  - **4 marks: Analyze trade-off cases as the core challenge**  
    *e.g., Prioritarianism must defend favoring worse off in transfers without relational reasoning; discuss Otsuka/Voorhoeve’s "two poor individuals" case.*  
    *Fumble:* Describing trade-offs without addressing whether reasoning is covertly relational.  
  - **2 marks: Engage separateness of persons**  
    *e.g., Prioritarianism’s appeal to absolute (non-comparative) urgency must do justificatory work.*  
    *Fumble:* Invoking separateness of persons vaguely without linking to non-relational commitments.  

  #### **(b) Intrapersonal Leveling Down (10 marks)**  
  - **3 marks: Accurately describe the intrapersonal case**  
    *e.g., Reducing a person’s high period to avoid a low, lowering total well-being but increasing equality within their life.*  
    *Fumble:* Conflating with interpersonal equality or misrepresenting as a welfare gain.  
  - **3 marks: Defend one position (irrelevance vs. tension) with reasoning**  
    *e.g., Argue that prioritarianism must either overextend to sub-personal units or reveal a personhood-based inconsistency.*  
    *Fumble:* Asserting a position without engaging prioritarianism’s machinery (e.g., weighting by absolute levels).  
  - **4 marks: Grapple with the tension in prioritarianism’s foundations**  
    *e.g., If welfare recipients are "units" in the aggregation, personhood must matter; if not, the view is ad hoc. Discuss prudential vs. moral rationality.*  
    *Fumble:* Dismissing the case as "not distributive" without examining theoretical implications.  

  #### **Overall Expectations**  
  - **A+ (18–20)**: Critically engages both parts, exposes justificatory gaps in prioritarianism, defends a nuanced stance on (b) using prioritarianism’s own axioms.  
  - **A (15–17)**: Covers key moves competently but with less originality in connecting (a) and (b).  
  - **B (12–14)**: Describes standard material accurately but misses deeper tensions (e.g., skips relationality critique in (a) or personhood in (b)).  
  - **C (8–11)**: Superficial on trade-off cases or misinterprets intrapersonal leveling down.  
  - **D/F (<8)**: Significant omissions/misunderstandings (e.g., confuses prioritarianism with egalitarianism).  

  ---  

  This question forces students to move beyond textbook contrasts and wrestle with prioritarianism’s justificatory limits. The intrapersonal twist is framed to reward careful analysis from multiple angles, not penalize students for choosing a "side."
