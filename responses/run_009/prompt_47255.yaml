prompt: |-
  I'm the hiring manager at a 40-person logistics software company, and I've been tasked with redesigning how we screen applicants for mid-level roles (analysts, junior engineers, ops people). We get a few hundred applications per posting, I have maybe 20 minutes per batch, and we can't fly everyone in for structured interviews. Our board member — a big pop-econ book reader — keeps pushing the idea that we should make candidates jump through genuinely expensive hoops: a substantial unpaid take-home project, a portfolio built to our spec, maybe even requiring them to obtain some certification on their own dime before we'll even look at them. His argument is basically that "real commitment shows when it costs something," and half of me finds that convincing while the other half suspects it just filters for applicants with rich parents and free evenings.

  I half-remember from a biology course the idea of the peacock's tail: it's honest advertising precisely because it's expensive, and only a genuinely healthy male can afford to carry it around. Someone on a podcast claimed the same logic explains why people do unpaid internships and gruelling degrees — the cost is the point. But it seems to me the logic only works if the expense hurts the candidates we'd want to reject more than the ones we'd want to hire, and I have no idea how to check that in practice for any given hoop. The cost of a 6-hour take-home is clearly not the same for a single parent working two jobs as for a 22-year-old living with roommates, and that difference has nothing to do with how good either of them would be at the job.

  What I'd like is a procedure my screening team (two juniors plus me, no stats background between us) can actually run on any proposed screening requirement before we adopt it: an ordered list of questions to ask about the requirement, what counts as a sufficient answer to each, where an answer kills the requirement dead, and where the procedure has to hand the decision back to me because it's a values call rather then a factual one. Then run it on three concrete cases: (1) the 6-hour unpaid take-home project; (2) requiring an industry certification that costs around $600 and three months to obtain; and (3) treating a caregiver gap on a CV as a negative signal, which one of my screeners keeps doing and which bugs me in a way I can't quite articulate. Please also include at least one place where the procedure gives an answer I won't like — I'll admit upfront that I find heartfelt cover letters persuasive, so if the procedure says they're worth nearly nothing as evidence, tell me that anyway. And be honest about where the whole framework misfires — for instance whether it matters that other employers in our sector are using the same hoops, and anything the procedure flatly cannot settle.
reasoning: |-
  Okay, the user is a hiring manager at a logistics software company looking to redesign their screening process for mid-level roles. They're dealing with hundreds of applications and limited time. A board member is pushing for expensive candidate hoops like unpaid projects or certifications, using the peacock's tail analogy. The user is conflicted because while it might signal commitment, it could unfairly disadvantage certain groups.

  First, I need to unpack their core problem: they want a systematic way to evaluate screening requirements that's practical for their team without stats background. They mentioned three concrete cases: take-home projects, costly certifications, and caregiver gap bias. Also, they want the procedure to challenge their own biases, like valuing cover letters.

  The deeper needs here are fairness and efficiency. They're worried about socioeconomic bias but also need reliable signals. They might also be seeking validation for their discomfort with the board member's suggestions. The unspoken need is probably to balance board pressure with ethical hiring, ensuring they don't exclude talented candidates who can't afford those hoops.

  I'll create a step-by-step procedure with clear questions and thresholds. Each question should have criteria for killing the requirement or flagging it for review. For the examples, I'll apply the procedure rigorously, even if it goes against the user's preferences, like cover letters. 

  Also, I need to highlight where the framework fails, like when other companies use similar hoops, creating industry-wide barriers. This addresses systemic issues the user might not have considered. Ensuring the procedure is actionable for a small team is key—simple yes/no questions with defined answers they can handle. 

  Finally, honesty about limitations: the procedure can't resolve values conflicts, like whether to prioritize efficiency over equity. That's where leadership judgment comes in. I'll make sure to include that in the framework.
answer: |-
  Here's a structured **Screening Requirement Evaluation Procedure (SREP)** designed for your team. It prioritizes fairness, predictive validity, and practicality, while flagging ethical/value judgments for your review. Use it as a checklist for any proposed screening hoop or signal.

  ---

  ### **The Screening Requirement Evaluation Procedure (SREP)**

  1.  **QUESTION: Does this requirement directly measure a *core, non-trainable skill* or *essential attribute* explicitly required for success in this specific role?**
      *   *Sufficient Answer:* Yes, and we can clearly articulate *how* it measures that specific skill/attribute. (E.g., "This coding test directly measures algorithm problem-solving, a core daily task for this engineering role.")
      *   *Insufficient Answer:* It measures something vague ("commitment," "culture fit"), something easily trainable, or something only peripherally related. It's primarily a "weeder."
      *   **Action:** **KILL** if Insufficient. Proceed if Sufficient.

  2.  **QUESTION: Is the cost (time, money, opportunity cost, mental load) of this requirement *significantly higher* for candidates who lack the required skill/attribute vs. those who possess it?**
      *   *Sufficient Answer:* Yes, clearly. The cost acts as a true barrier *only* to those who lack the core skill. (This is the core of the "honest signal" / peacock tail logic). *Requires reasoning.*
      *   *Insufficient Answer:* No, the cost is similar regardless of skill, OR the cost is disproportionately high for reasons *unrelated* to the target skill (e.g., socioeconomic status, caregiving responsibilities, neurodiversity, access to resources).
      *   **Action:** **KILL** if Insufficient. Proceed if Sufficient. *(This is often the killer question for "expensive hoops")*

  3.  **QUESTION: Does the cost (time, money, opportunity) of this requirement *disproportionately burden* candidates from protected classes (race, gender, age, disability, socioeconomic status) or non-protected but disadvantaged groups (primary caregivers, gig workers, those without financial safety nets)?**
      *   *Sufficient Answer:* No credible evidence or strong reason suggests disproportionate burden. Burden seems reasonably equal across relevant groups.
      *   *Insufficient Answer:* Yes, credible evidence/logic suggests a disproportionate burden exists (e.g., cost is significant relative to income, requirement assumes large blocks of free time, requires specific expensive resources).
      *   **Action:** **KILL** if Insufficient. Proceed if Sufficient. *(Ethical/Compliance Red Flag)*

  4.  **QUESTION: Is the predictive validity of this requirement for actual on-the-job performance *supported by reliable evidence* (our internal data, robust industry studies, meta-analyses) that outweighs its cost and potential biases?**
      *   *Sufficient Answer:* Yes, strong evidence exists (e.g., validated work samples for this role type, certifications proven to correlate with performance). Cite the evidence.
      *   *Insufficient Answer:* No reliable evidence, only anecdotes, intuition ("it feels right"), or pop-econ theories. Evidence is weak or mixed.
      *   **Action:** **HAND BACK TO HM** if Insufficient ("Values/Judgment Call" - *Is the potential benefit worth the risk without strong evidence?*). Proceed if Sufficient.

  5.  **QUESTION: Is this requirement *logistically feasible and respectful* for candidates and our screening team (time-to-hire, candidate experience, team capacity)?**
      *   *Sufficient Answer:* Yes, it integrates smoothly into our process, respects candidate time reasonably, and we have capacity to administer/evaluate it fairly. Cost to us is justified.
      *   *Insufficient Answer:* Creates major bottlenecks, requires excessive team time, demonstrably damages candidate experience/employer brand, or is prohibitively expensive for us.
      *   **Action:** **HAND BACK TO HM** if Insufficient ("Operational Judgment Call"). Proceed if Sufficient.

  ---

  ### **Applying SREP to Your Cases**

  **Case 1: 6-Hour Unpaid Take-Home Project**

  1.  **Core Skill?** *Maybe.* Can be designed to measure core analytical/coding/ops skills. *Sufficient IF well-designed.* **Proceed.**
  2.  **Cost Higher for Low Skill?** **NO.** A highly skilled candidate might breeze through it in 3 hours. A less skilled candidate might struggle for 6+. *However*, the *absolute cost* (6 hours unpaid) is identical and severe. Crucially, the burden is **disproportionately high** for candidates with demanding jobs, caregiving duties, or multiple applications. The cost barrier isn't *primarily* skill-dependent; it's resource-dependent. **Insufficient. KILL.**
  3.  **Disproportionate Burden?** **YES.** Explicitly burdens caregivers, those working multiple jobs, those with limited free time (often correlated with socioeconomic factors). **Insufficient. KILL.** (Fails Q2 & Q3 decisively).
  4.  *(Stopped at Q2/Q3)*

  **Case 2: Require $600/3-Month Industry Certification**

  1.  **Core Skill?** *Potentially.* If the certification *directly* validates an essential, non-trainable skill mandatory on Day 1 (e.g., a specific safety license, a legally required compliance cert). *Sufficient ONLY if truly essential and non-trainable.* **Proceed (conditionally).**
  2.  **Cost Higher for Low Skill?** **NO.** The cost ($600, 3 months) is identical for everyone. Someone who *already* has the cert (acquired for a previous role) bears zero cost. Someone lacking the skill faces the same financial/time cost as someone who is highly skilled but simply hasn't taken *this specific* cert. The cost barrier isn't tied to *current skill level* but to *prior opportunity and resources*. **Insufficient. KILL.**
  3.  **Disproportionate Burden?** **YES.** $600 is a significant barrier based purely on financial means. 3 months assumes candidates have the time/flexibility to study. **Insufficient. KILL.** (Fails Q2 & Q3).
  4.  *(Stopped at Q2/Q3)*

  **Case 3: Treating Caregiver Gap as a Negative Signal**

  1.  **Core Skill?** **NO.** A gap does not measure any specific skill or attribute required for the job (analytical ability, coding, ops process knowledge). It measures... time not in paid employment. **Insufficient. KILL.** (Fails Q1 immediately).
  2.  *(Stopped at Q1)*

  **Bonus Case: Heartfelt Cover Letters**

  1.  **Core Skill?** *Maybe.* Only if the role *absolutely requires* exceptional persuasive writing *as a core daily duty* (e.g., specific sales, very senior comms). For most analysts/engineers/ops? **NO.** It vaguely hints at "interest" or "effort," not core skills. **Insufficient. KILL (for most roles).** *(This is the answer you won't like)*
  2.  *(Stopped at Q1)* Even if it passed Q1, it would likely fail Q2 (writing a good cover letter isn't necessarily harder for bad candidates, just less motivating) and Q3 (disproportionately hard for non-native speakers, neurodiverse candidates, those without mentorship).

  ---

  ### **Where SREP Misfires & Limitations**

  1.  **The "Industry Standard" Problem:** SREP **cannot** account for whether *other* employers use the hoop. If everyone requires a $600 cert, it becomes a systemic barrier, but that doesn't make it valid or fair *for you*. SREP evaluates the requirement *on its own merits for your process*. Widespread use might be a reason to lobby *against* the practice industry-wide, not adopt it.
  2.  **Values Calls are Explicit:** SREP clearly flags points requiring human judgment (Q4 & Q5 Insufficient answers). It doesn't make those decisions; it forces you to acknowledge and own them. "We know it's biased and lacks evidence, but we value speed/efficiency over equity/potential false negatives" is a conscious choice, not an unseen bias.
  3.  **Predictive Validity is Hard (Q4):** Robust evidence is often scarce, especially for specific roles/companies. Relying solely on strong evidence (Q4) might lead to overly conservative screening (only using proven methods like structured interviews, which are resource-heavy). This is why Q4 hands back to you – you must decide the risk tolerance for using less-validated but common signals.
  4.  **"Commitment" vs. "Skill":** SREP prioritizes measuring *skill/attribute* (Q1). It's skeptical of proxies for vague concepts like "commitment" (which often just measure privilege/resource availability - Q2/Q3). If "commitment" is truly essential, SREP forces you to define it as a measurable *attribute* (e.g., perseverance on difficult tasks) and find a way to assess it *directly and fairly*.
  5.  **False Negatives vs. False Positives:** SREP focuses heavily on avoiding unfair exclusion (False Negatives). It doesn't explicitly optimize for avoiding bad hires (False Positives). The assumption is that later stages (interviews) catch False Positives, while unfair screening hoops create *permanent, invisible* False Negatives. This is a core value embedded in SREP's design (prioritizing equity/fair access).
  6.  **Nuance & Context:** SREP provides a framework, not absolute answers. Judging "core skill" (Q1) or "disproportionate burden" (Q3) requires thoughtful discussion within your team. Document your reasoning.

  **Conclusion:** The SREP exposes why the board member's "expensive hoops" are fundamentally flawed for fair and effective screening: they fail Q2 and Q3 by imposing costs unrelated to skill and disproportionately burdening disadvantaged groups. They confuse *privilege* (having time/money) with *capability* or *commitment*. For efficient, fair screening of mid-level roles, focus on **highly targeted, lower-cost signals** evaluated early:
  *   **Structured Resume Screening:** Using clear, role-specific criteria (keywords, specific project types, quantifiable achievements) applied consistently by your team.
  *   **Short, Role-Relevant Skills Assessments:** Max 60-90 minutes, focused *only* on absolutely core, non-trainable skills (e.g., a specific SQL query, analyzing a small logistics dataset). *Pay candidates for their time if over 30 mins.*
  *   **Structured Initial Phone Screens:** 20-30 minutes using a standardized script focusing on core experience and motivations.
  *   **Blind Screening (where feasible):** Remove names/universities/gaps initially to reduce unconscious bias like the caregiver gap penalty.

  Use SREP to ruthlessly evaluate *any* new screening demand. It will help you push back on well-meaning but harmful ideas with logic and focus your limited resources on signals that actually predict performance without creating unfair barriers.
