  Here’s a sestina weaving the Rietdijk-Putnam argument into its form, using end-words (**now**, **future**, **past**, **frame**, **dial**, **fixed**) to enact the relativity of simultaneity, culminating in a block universe envoi with a subtle crack:

  ## Relativity's Sestina

  The train flies past the platform. Here stands **now**
  For me, a breath held fast. But for your speeding **frame**,
  My settled instant spills into your **future**.
  A distant tower clock – its turning **dial** –
  Lies in my settled **past**, its number **fixed**.
  Yet *for you*, rushing, it waits: unwritten **past**.

  What’s **future** for me is **now** for you, a strange **past**
  Collapsing as we meet. Our fleeting **frame**
  Defines the slice we see. That distant **dial**,
  Its hands still moving, seems already **fixed**
  From your swift view – my urgent, nascent **now**
  Is just a point you’ve crossed within my **future**.

  You claim my choice, my yet-unwritten **future**,
  Lies plain as fact within your present **frame**,
  A consequence decided, firmly **fixed**,
  Because your tilted plane includes my **dial**
  Already read. My trembling "will" is **past**
  For you. But *my* breath still defines the **now**.

  For me, your hurried life reveals its **past**
  As we converge. Your childhood scene seems **fixed**,
  A photograph. Yet *you* declare my **dial**
  Of choice is spun, its outcome set, your **frame**
  Declares my freedom dust within your **future**.
  We share the meeting point; that’s all we **now**.

  A single star explodes. That cosmic **dial**
  Records its death in light. My telescope **frame**
  Shows it alive, a brilliant, present **now**.
  Your faster ship already sees its **past**,
  A fading ember. One event, **fixed**
  In the void, yet: your history, my **future**.

  Can all these shifting slices be **fixed**?
  Can "real" chain link through frames? My present **dial**
  Shows hands still turning. Yours declares it **past**.
  Is *everything* then etched, a rigid **frame**?
  The **future** flower, the seed, the ancient **past**,
  All co-exist? Is there only one vast **now**?

  *(Envoi)*

  **Fixed** block? Or fractured truth? **Now**, **past**, **future** bleed.
  **Frame**-bound, the **dial** reads what each must heed.
  Is all **fixed**? Or just the speed that splits the creed?

  ---

  ## How it works for your session

  1.  **End-Word Rotation:** The sestina's strict rotation (1-2-3-4-5-6, then 6-1-5-2-4-3, etc.) forces the perspective shift. Words like **now**, **future**, and **past** constantly reappear in new positions relative to each other, mirroring how different frames assign those labels to the *same* events.
  2.  **Concrete Setup:** Stanza 3 focuses on the "distant dial" (a specific event like a clock reading or decision indicator) being seen differently by the two observers ("My telescope frame / Shows it alive... Your faster ship already sees its past"). Stanza 1 & 2 establish the observers passing.
  3.  **The Block Universe Envoi:**
      *   **Compression:** The three lines of the envoi pack in all six end-words, forcing them into proximity, enacting the co-existence of "**Now**, **past**, **future**" within the block. "**Fixed** block?" directly states the conclusion.
      *   **The Hairline Crack:**
          *   "**Frame**-bound, the **dial** reads what each must heed." emphasizes the relativity Putnam tries to transcend – reality *seems* frame-dependent.
          *   "Is all **fixed**? Or just the speed that splits the creed?" is the crucial question. "Fixed" is repeated, but the question mark and "splits the creed" directly challenge the transitivity of "is real for" across frames. Does speed *reveal* a fixed block, or *create* fundamentally fractured realities ("creed") that cannot be simply glued together into one "real" whole? The poem ends on this unresolved tension – the block seems declared ("**Fixed** block?"), but immediately questioned and potentially fractured by the frame-relativity it tried to overcome.
  4.  **Accuracy & Accessibility:**
      *   Uses core concepts: frames, planes of simultaneity ("tilted plane"), relativity of simultaneity ("My settled instant spills into your future"), distant event ("distant dial"), chain of "real for", and the block universe conclusion.
      *   Avoids technical terms (Lorentz, Minkowski, etc.) but captures the *experience* and *logical consequence*.
      *   The concrete imagery (train/platform, telescope/ship, dial, seed/flower) grounds the abstraction.
      *   No names (Rietdijk, Putnam) are used, keeping the focus on the idea itself.

  This poem performs the argument's structure through its form, grounds the physics in relatable imagery, delivers the block universe punch, and subtly undermines it with the transitivity objection – leaving your students exactly where the seminar ended, with the profound unease and unresolved wonder the topic deserves.
