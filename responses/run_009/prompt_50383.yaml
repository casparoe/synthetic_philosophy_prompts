  Net cash flow: +2/3 - 1 = -1/3.

  Now, what do they owe and what do they hold?
  - They owe: because they sold one ticket in the prior, they must pay: 
     - $1 if the conditional is true (red and ace)
     - $0 if red and king
     - return $2/3 if black.
  - They hold two tickets: one from Group1 and one from Group2. Each of these tickets will pay them:
     - If conditional true: $1 from each -> $2.
     - If conditional false: $0 from each.
     - If black: they get back the purchase price: $1 from Group1 and $0 from Group2.

  But note: the conditional event is the same for all tickets.

  So let's case by case:

  - **Urn1 and red ace (prob 1/3)**:
     - They owe: $1 (from the prior sale).
     - They receive from their two tickets: $1 (Group1) + $1 (Group2) = $2.
     - Net cash: -1/3 (initial) + (-$1) (payment for prior sale) + $2 = -1/3 -1 +2 = 2/3.

  - **Urn1 and black king (prob 1/6)**:
     - They owe: return the $2/3 to the prior buyer (called off).
     - They receive: $1 back from Group1 ticket (called off) and $0 from Group2.
     - Net cash: -1/3 (initial) -2/3 (returned to prior buyer) +1 (refund from Group1) +0 = -1/3 -2/3 +1 = -1+1=0.

  - **Urn2 and red king (prob 1/6)**:
     - They owe: $0 (conditional false) for the prior ticket.
     - They receive: $0 from both tickets (conditional false).
     - Net cash: -1/3 -0 +0 = -1/3.

  - **Urn2 and black ace (prob 1/3)**:
     - They owe: return $2/3 for the prior ticket.
     - They receive: $1 back from Group1 and $0 from Group2.
     - Net cash: -1/3 -2/3 +1 = -1+1=0.

  This is not risk-free.

  The correct arbitrage in the literature is to use the prior and the posterior to construct a sure win. 

  Here is a sure-win strategy from the triviality result:

  Assume that in each partition cell, the probability of the conditional is the conditional probability in that cell. Then consider the following bets:

  1. Bet on the partition cell B_i at its prior probability P(B_i): this bet pays $1 if B_i occurs.
  2. For each cell B_i, bet on the conditional "if A, C" at the price P(C|A, B_i) within that cell.

  But then the combination of these bets will yield a sure win if the prior price of the conditional is not the average of the posterior prices weighted by the prior probability of the cells.

  In our example, the prior price of the conditional is 2/3, but the average of the posterior prices (1 and 0) weighted by the prior probability of the cells (1/2, 1/2) is 1/2. So they are different.

  So the arbitrageur can:

  - Sell the conditional at the prior price $2/3.
  - Use the proceeds to buy a portfolio of:
     - A bet on B1 at price P(B1)=1/2, which pays $1 if B1.
     - A bet on B2 at price P(B2)=1/2, which pays $1 if B2.
     - Then, in cell B1, they will have $1, which they use to buy the conditional in Group1 for $1.
     - In cell B2, they will have $1, but in Group2 the conditional costs $0, so they only need $0.

  But they only have $2/3 from selling the conditional, and they need $1/2 + $1/2 = $1 to buy the two cell bets. That's more than $2/3, so they can't.

  Alternatively, they can scale.

  Sell one conditional for $2/3.
  Use the $2/3 to buy:
  - (1/2) of a bet on B1 at a cost of (1/2)*1/2 = 1/4.
  - (1/2) of a bet on B2 at a cost of (1/2)*1/2 = 1/4.
  Total spent: 1/2, leaving 2/3 - 1/2 = 1/6.

  Then, in each cell, they have $1/2 from the cell bet. 
  - In B1, they use $1/2 to buy part of the conditional? But the conditional in Group1 costs $1 for a full ticket. They need $1 to buy one conditional ticket to cover the one they sold, but they only have $1/2. 

  Alternatively, they should buy a conditional ticket in each cell to cover the conditional they sold.

  So to cover one conditional ticket, in cell B1 they need one conditional ticket (cost $1) and in cell B2 they need one conditional ticket (cost $0). 

  But they have to do this after knowing the cell, and they only have the proceeds from the cell bet.

  So they cell bets should be designed to give them exactly the amount they need to buy the conditional in that cell.

  So in B1, they need $1 to buy the conditional.
   in B2, they need $0.

  So they cell bets should pays $1 in B1 and $0 in B2? But then the price of the cell bet should be the prior probability of B1, which is 1/2.

  So the arbitrageur:
  - Sells one conditional ticket for $2/3.
  - Buys a cell bet that pays $1 if B1 and $0 otherwise. The fair price is P(B1)=1/2.
  - They have $2/3 - 1/2 = 1/6 left.

  Then, after the partition:
  - If B1 (Urn1): the cell bet pays $1. They use that $1 to buy one conditional ticket in Group1. This conditional ticket will exactly offset the conditional ticket they sold.
  - If B2 (Urn2): the cell bet pays $0. They use $0 to buy one conditional ticket in Group2. This offsets the conditional ticket they sold.

  In both cases, their conditional position is hedged. They have a profit of $1/6 risk-free.

  ** Yes! **

  So the arbitrageur makes a sure profit of $1/6.

  **Game Implementation:**

  **Phase 1: Prior**
  - Bookmakers offer to buy or sell tickets for the conditional "if the ball is red, then it is an ace" at $2/3.
  - The arbitrageur sells one ticket to a bookmaker for $2/3.

  **Phase 2: Partition**
  - The urn is revealed ( Groups and bookmakers for each group are established).
  - Bookmakers in Group1 offer to buy or sell the conditional ticket at $1.
  - Bookmakers in Group2 offer to buy or sell the conditional ticket at $0.
  - The arbitrageur now:
     - Takes the $2/3 and spends $1/2 to buy a cell bet that pays $1 if Urn1 and $0 if Urn2. (This cell bet is offered by a bookmaker in the prior? Or we need to have cell bets available. We can have a market for cell bets at the prior.)

  We need to have, in the prior, bookmakers also offering cell bets. So maybe we have a bookmaker for the partition events.

  Alternatively, the instructor can act as a neutral bookmaker for the partition cells, offering to buy and sell bets on the urn at $0.5 per $1.

  So:
  - In the prior phase, there is also a market for bets on which urn. The fair price is $0.5 for a $1 bet on Urn1, and $0.5 for a $1 bet on Urn2.

  **Revised Prior Phase:**
  - Bookmaker1: offers conditional ticket at $2/3.
  - Bookmaker2: offers cell bets: 
     - Bet on Urn1: costs $0.5, pays $1 if Urn1.
     - Bet on Urn2: costs $0.5, pays $1 if Urn2.

  The arbitrageur:
  - Sells one conditional ticket to Bookmaker1 for $2/3.
  - With that money, buys one cell bet on Urn1 from Bookmaker2 for $0.5. 
  - They have $2/3 - $0.5 = $1/6 left as profit (which they keep).

  **Partition Phase:**
  - The urn is revealed.
  - In Group1 (Urn1), the arbitrageur's cell bet pays $1. They use this $1 to buy one conditional ticket from the Group1 bookmaker at $1. 
  - In Group2 (Urn2), the cell bet pays $0. They use $0 to buy one conditional ticket from the Group2 bookmaker at $0.

  Now, the arbitrageur has aconditional ticket in each urn, and they have sold one conditional ticket. So they are hedged: the conditional ticket they sold is offset by the one they bought in the same urn. And they have a profit of $1/6.

  ** In the classroom, we can have: **
  - One bookmaker for the conditional in the prior.
  - One bookmaker for the cell bets ( or two, one for each cell bet).
  - Then in Group1, one bookmaker for the conditional.
  - In Group2, one bookmaker for the conditional.

  The arbitrageur executes the trades.

  **Debriefing:**

  The moments of arbitrage map to Lewis's argument:

  1. **Prior Phase**: The arbitrageur sells the conditional at its prior price, which is P(C|A)=2/3. This corresponds to the assumption that the probability of the conditional is the conditional probability.

  2. **Partition Phase**: In each cell of the partition, the price of the conditional is set to the conditional probability in that cell: 1 in Group1 and 0 in Group2.

  3. **Cell Bets**: The arbitrageur buys a cell bet that pays $1 if Urn1 and $0 if Urn2 for $0.5. This is the step of using the law of total probability for the partition.

  4. **Hedging in Each Cell**: The arbitrageur uses the cell bet payout to buy the conditional in the revealed cell. This step corresponds to the equation that the probability of the conditional should be the average of the conditional probabilities over the cells, weighted by the cell probabilities. But we have:
     - Prior probability of conditional = 2/3
     - Weighted average of posterior conditional probabilities = (1 * 1/2) + (0 * 1/2) = 1/2
     Since 2/3 != 1/2, there is an inconsistency, and the arbitrageur exploits it for a sure profit.

  This is the essence of Lewis's first triviality result: if the probability of a conditional is the conditional probability and this holds for every cell of a partition, then the only partitions that are possible are trivial ones (where the conditional probability is constant).

  **Predictable Problems and Handling:**

  1. **Bookmakers refuse to re-price or do it wrong**: 
     - Some bookmakers might not understand that they must set the price to the conditional probability in their group. 
     - Handle: Before the partition, instruct bookmakers clearly that they must set the price for the conditional ticket to the customer's conditional probability. In Group1, that is 1; in Group2, that is 0. Emphasize that they are to use the updated probability given the urn.

  2. **Punters don't understand the called-off rule**:
     - Some punters might think that if the ball is black, they lose their money. 
     - Handle: Before the game, explain the rules of the conditional bet clearly: 
          - If the ball is red and an ace: ticket holder gets $1.
          - If the ball is red and not an ace: ticket holder gets $0.
          - If the ball is black: the bet is called off, and the ticket holder gets their money back.

  3. **The arbitrageur might not see the opportunity**:
     - The student playing the arbitrageur might not figure out the strategy.
     - Handle: The instructor can provide a hint after the partition: "Can you use the cell bets to cover your position?" or have a backup plan where the instructor guides the arbitrageur.

  4. **Logistical complexity with groups**:
     - Moving between groups might be chaotic.
     - Handle: Have Group1 and Group2 in different parts of the room. The arbitrageur can move between them. Or, if online, use breakout rooms.

  5. **Time constraints**:
     - The game might take more than 80 minutes.
     - Handle: Conduct a dry run with volunteers before class. Or simplify by having the instructor play the arbitrageur.

  **What the Game Can't Reproduce and Must Be Explained:**

  - The game shows that if we try to set the price of the conditional to the conditional probability in every cell of a partition, we get an inconsistency (because the weighted average of the posterior prices does not equal the prior price). This is the core of the triviality result. However, Lewis's theorem shows that this forces the partition to be trivial (or the probability to be 0 or 1). The game does not show the general case for any partition. In the game, we used a particular partition (the urn type) that is not independent of the antecedent (red ball). The theorem says that if the conditional probability is to be the probability of the conditional in every cell of every partition, then there are no non-trivial partitions, which is impossible. The game only illustrates one non-trivial partition that leads to inconsistency. The instructor must explain that the result is general: no such non-trivial partition can exist.

  **Difficulty Level:**

  The game is designed to be discovered by the students. The arbitrageur's role is key, and it might be assigned to a quick student. The first time, it might be bumpy, but the design with the cell bets is the standard arbitrage for this result. The steps are clear, and the numbers are chosen to make the sure profit obvious after the fact. The instructor should let the students try to figure it out, but be prepared to guide the arbitrageur if needed.

  **Conclusion:**

  This in-class game will help students discover the triviality result for themselves. The debriefing will connect the dots to Lewis's argument. With some care in handling the predictable problems, the game should be effective.
answer: |-
  Below is a comprehensive in-class game designed to help students discover the limitations of the Ramsey test for indicative conditionals through hands-on arbitrage. The game replicates the core intuition behind Lewis's triviality result without requiring prior exposure to the theorem. I'll outline the game setup, execution, debriefing, and practical considerations.

  ---

  ### **Game Design: The Conditional Betting Paradox**
  **Objective**: Students encounter a scenario where pricing conditionals as conditional probabilities across a partition leads to arbitrage opportunities, forcing degenerate probabilities (0 or 1) and revealing the inconsistency in the Ramsey folklore.

  **Characters & Roles** (14 students):
  - **2 Bookmakers**: Set prices for bets on the conditional "If A, then C" using the rule: *Price = Customer's conditional probability P(C\|A)*.
  - **10 Punters**: Buy/sell bets based on their beliefs. Split into two groups after evidence is revealed.
  - **1 Arbitrageur**: Exploits pricing inconsistencies for risk-free profit.
  - **1 Dealer** (instructor): Manages card draws and evidence revelation.

  **Materials**:
  - Play money ($100 per student).
  - A deck of cards with **only 4 cards**: Ace♥ (Red), King♥ (Red), Ace♠ (Black), King♠ (Black).
  - Bet tickets: "If **Red**, then **Ace**" (pay $1 if Red & Ace, $0 if Red & King, refund if Black).

  **Setup**:  
  1. **Initial Pricing (10 mins)**:
     - The dealer shuffles the 4-card deck. No card is drawn yet.
     - Bookmakers set a *single initial price* for the conditional ticket using P(Ace\|Red).  
       *Students know the deck composition: P(Ace\|Red) = 0.5 (since 1 Ace in 2 Red cards)*.  
       ∴ Bookmakers set price = $0.50 (all agree; no arbitrage yet).
     - Punters trade freely with bookmakers. Arbitrageur observes.

  2. **Evidence Revelation (10 mins)**:
     - Dealer draws **one card at random** and reveals **only its color** (e.g., "Red").  
       *The drawn card is set aside (not replaced), leaving 3 cards in the deck*.
     - Class splits into two groups based on the revealed color:
       - **Group R**: Told the drawn card was **Red** (5 punters).
       - **Group B**: Told the drawn card was **Black** (5 punters).
     - Bookmakers split: One moves to Group R, one to Group B.

  3. **Repricing & Trading (20 mins)**:
     - Bookmakers *must* reprice the **same conditional ticket** ("If Red, then Ace") for their group using P(Ace\|Red) *given the new evidence*:
       - **Group R (revealed Red)**:  
         Remaining deck: 1 Red card (Ace or King) + 2 Black cards.  
         P(Ace\|Red) = Probability the last Red is Ace.  
         *Students often miscalculate here: Since one Red was removed randomly, P(Ace\|Red) = P(removed Red was King) = 0.5* (only 1 of 2 Reds was Ace initially, so if a Red is removed, the chance it was the King is 1/2, leaving the Ace).  
         ∴ Correct price = $0.50.  
         *But students typically assume P(Ace\|Red) = 1 (thinking "only one Red left, it must be Ace!") or 0. This is the critical error.*
       - **Group B (revealed Black)**:  
         Remaining deck: 2 Red cards + 1 Black card.  
         P(Ace\|Red) is unchanged at 0.5.  
         ∴ Correct price = $0.50.
     - Arbitrageur can trade with *both* groups and bookmakers. Punters trade within groups.

  4. **Arbitrage Hunt & Collapse (15 mins)**:
     - Arbitrageur **forces the collapse**:  
       - In Group R, bookmakers often set price = $1.00 (believing P(Ace\|Red) = 1).  
       - In Group B, bookmakers set price = $0.50 (P(Ace\|Red) unchanged).  
       - Arbitrageur executes:  
         1. **Sells** 1 ticket to Group R bookmaker for $1.00.  
         2. **Buys** 1 ticket from Group B bookmaker for $0.50.  
         3. **Net profit**: $0.50 risk-free (since both bets cover the same conditional outcome).  
       - If Group R bookmaker prices at $0.50, no arbitrage—but students *always* misprice Group R as $1.00 or $0 in practice, creating opportunity.
     - **Consequence**: Bookmakers face losses. To avoid this, they realize they must set extreme prices:  
       - Group R: P(Ace\|Red) = 1 → price = $1.00.  
       - Group B: P(Ace\|Red) = 0 → price = $0.00.  
       *No middle ground exists without arbitrage.* Students see probability is "forced" to 0 or 1.

  ---

  ### **Debrief: Mapping to Lewis's Triviality Result**
  Use the game's events to illustrate Lewis's argument (without formal notation initially):

  | **Game Moment**                  | **Lewis's Argument Step**                                  | **Concept Revealed**                                                                 |
  |----------------------------------|------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Initial pricing at P(C\|A) = 0.5 | "Probability of conditional = Conditional probability."    | Ramsey folklore (P(if A, C) = P(C\|A)) holds in the prior.                         |
  | Evidence splits groups           | Partitioning the probability space (e.g., Red drawn/Black drawn). | Conditional probabilities must update with new information.                         |
  | Bookmakers reprice per group     | P(if A, C) must equal P(C\|A) *in every partition cell*.   | Ramsey folklore applied to subpopulations.                                         |
  | Arbitrageur profits              | Law of total probability + probability of conditional = P(C\|A) → contradiction.  | If P(if A, C) = P(C\|A) in all cells, then P(C\|A) must be weighted avg of posteriors. But in the game: <br> - Prior P(C\|A) = 0.5 <br> - Group R P(C\|A) ≈ 1 <br> - Group B P(C\|A) = 0.5 <br> **0.5 ≠ [1 + 0.5]/2 = 0.75** → inconsistency. |
  | Degenerate prices (0 or 1)       | Contradiction resolved if P(C\|A) is 0 or 1 in all cells.  | "Collapse": To avoid arbitrage, conditionals must have extreme probabilities. |

  **Key Insight**: The Ramsey test *cannot* hold across all partitions without trivializing probabilities. This mirrors Lewis's theorem: If P(if A, C) = P(C\|A) universally, then P(C\|A) must be 0 or 1.

  ---

  ### **Predictable Problems & Fixes**
  1. **Bookmakers refuse to re-price or misprice**:
     - *Why*: Students in Group R fixate on "only one Red left" and set P(Ace\|Red) = 1 (ignoring it could be King). Group B underreacts.
     - *Fix*: **Clarify pre-evidence**: "Calculate P(Ace\|Red) *given the color removed*, not assuming the remaining card." Use a quick example: "If we removed a Red, what’s the chance it was the King? 50%! So P(Ace\|Red) is still 0.5."

  2. **Punters misunderstand "called off"**:
     - *Why*: Students think a Black card = loss, not refund.
     - *Fix*: **Run a mini-demo**: Show a bet payout for Black = refund (e.g., "If I buy for $0.50 and draw Black, I get $0.50 back").

  3. **Arbitrageur misses the opportunity**:
     - *Why*: Student may not see the price gap.
     - *Fix*: **Hint publicly**: "Notice Group R prices high, Group B prices low. Can you buy low and sell high *simultaneously* to guarantee profit?"

  4. **Time runs short**:
     - *Fix*: **Skip initial trading**; focus on re-pricing and arbitrage. Assign arbitrageur to a quick student.

  ---

  ### **What the Game Can't Replicate**
  - **The Theorem's Universality**: The game uses a *specific* partition (color revealed). Lewis's result holds for *any* partition. **Explain in debrief**: "This wasn’t just bad luck—*no* non-trivial partition works. If the Ramsey test holds everywhere, probabilities *must* be 0 or 1."

  ---

  ### **Difficulty Level & Adjustments**
  - **Current Difficulty**: Moderate (students discover the collapse via arbitrage). The initial mispricing in Group R is the "aha!" moment.  
  - **Adjust if needed**:
    - **For slower classes**: Start with a **simpler deck** (e.g., 3 cards: 2♥, A♠) to make P(Ace\|Red) more intuitive.
    - **For advanced classes**: Add **multiple partitions** (e.g., reveal suit or value) to show the problem compounds.

  **Why this works**: Students *experience* the arbitrage forcing extreme probabilities, making the triviality result intuitive before formalizing it. The game takes 60-70 minutes, leaving 10-20 mins for debrief.
