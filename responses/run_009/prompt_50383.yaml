  P(C|A) = sum_i P(C | A, B_i) P(B_i)

  But also, by the law of total probability for P(C|A):
  P(C|A) = sum_i P(C | A, B_i) P(B_i | A)

  So we have:
  sum_i P(C | A, B_i) P(B_i) = sum_i P(C | A, B_i) P(B_i | A)

  This must hold for any partition, which forces P(B_i) = P(B_i | A) for all i, which means A is independent of every B_i, which is only possible if A is independent of everything, or the partition is trivial.

