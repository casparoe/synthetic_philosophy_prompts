  Now, the user suggests two possible rules. Rule 1: A corroborated kernel suffices, regardless of embellishments. Rule 2: Only history if the load-bearing claims survive transmission. Let's see which fits better. 

  For Trojan War, the core conflict is corroborated, so Rule 1 fits. Gilgamesh's existence is the kernel, so again Rule 1. For Arthur, no kernel, so both rules say no. Exodus: He rejects the Hyksos link because it's not a transmitted memory, which aligns with Rule 2's emphasis on transmission integrity. Rule 1 might accept the Hyksos as a kernel, but he doesn't. So Rule 2 seems stronger here. Jericho: The walls fell too early, meaning the transmitted event is wrong. Rule 2 explains this as the load-bearing claim (walls falling during conquest) isn't supported.

  So the brother-in-law likely uses Rule 2: History only if the tradition's central claims are accurately transmitted and corroborated, not just any kernel.

