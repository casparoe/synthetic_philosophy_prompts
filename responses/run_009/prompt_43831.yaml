  - Trojan Horse: No evidence. Rule 1 and Rule 2 both say no. He might see it as a malformed question since it's a folktale motif. 

  - Ragnar Lothbrok: Annals mention a Viking leader captured in 845, but sagas embellish heavily. Rule 1 would accept a historical kernel. Rule 2 would reject it because the transmitted stories (serpents, sons) aren't corroborated. Brother-in-law likely says no, similar to Arthur.

  The Trojan Horse case doesn't differentiate between rules since both say no. Amazons show a split: Rule 1 accepts the kernel, Rule 2 rejects the transmitted claims. Ragnar also splits: Rule 1 accepts the kernel, Rule 2 rejects the legendary elements. 

  The best discriminator is Amazons because it has strong evidence but the tradition's core claims might not hold. A better test case could be someone like Lycurgus of Sparta—historical lawgiver vs. mythical figure. If there's evidence of reforms but not the person, Rule 1 might say yes (kernel of reforms), Rule 2 would say no (no evidence Lycurgus was real).
answer: |-
  Based on your brother-in-law's established rulings and reasoning, I predict his verdicts and analyze his underlying rule as follows:

  ### Predicted Verdicts for New Cases:
  1. **Amazons**: **No**  
     *Reasoning*: While Scythian burial evidence confirms women warriors existed, it doesn't validate Herodotus's core claims of a matriarchal *nation* (e.g., all-female society, ritual breast removal, mass battles against Greeks). He'll likely argue these are Greek mythologizing of real but scattered nomadic practices—similar to his rejection of Exodus's "reinvention" of the Hyksos expulsion.  

  2. **Trojan Horse**: **Malformed Question**  
     *Reasoning*: He’ll dismiss this as folklore—a narrative device (like folktale "cheat" motifs) or possibly a siege engine metaphor (e.g., a battering ram or earthquake symbol). Since he separated the *Iliad*'s plot from the war’s historicity, he won’t treat the horse as a factual claim.  

  3. **Ragnar Lothbrok**: **No**  
     *Reasoning*: The Frankish annals mention *a* Viking leader captured in 845 but give no name or personal details. The sagas’ Ragnar (serpent-pit deaths, legendary sons) is clearly amplified fiction. Like Arthur, the figure grows retroactively around historical sons (e.g., Ivar the Boneless), failing his transmission test.  

  ---

  ### The Rule He Follows: "Load-Bearing Claims" Transmission  
  Your brother-in-law operates under a **"Load-Bearing Claims" (LBC) Rule**:  
  > *A tradition is historical **only** if its core, culturally defining claims (not just any kernel) are demonstrably transmitted from a real event and corroborated by evidence. Embellishments are acceptable, but distortions of the central narrative or function invalidate it.*  

  This explains his verdicts better than a simple "kernel" rule:  
  - **Trojan War (Yes)**: LBC = "Bronze Age Greek coalition sacked Troy." Corroborated by Hittite texts ("Ahhiyawa" vs. "Wilusa") and Hisarlik's destruction layer.  
  - **Gilgamesh (Yes)**: LBC = "A king named Gilgamesh ruled Uruk." Corroborated by the Sumerian King List.  
  - **Exodus (No)**: LBC = "Moses led Israelites from Egyptian slavery via divine intervention." *Not* corroborated, and the Hyksos theory invents a new narrative, breaking transmission.  
  - **Jericho (No)**: LBC = "Walls fell during Joshua's conquest." Archaeological timing mismatch breaks the claim.  

  A "mere kernel" rule (*any* corroborated element = history) would accept Hyksos as Exodus' kernel or Scythians as Amazons—**but he explicitly rejects this**.  

  ---

  ### Rule Predictions for New Cases & Discriminating Analysis  
  | Case          | "Mere Kernel" Rule Prediction | "LBC" Rule Prediction | Brother-in-Law's Likely Verdict |  
  |---------------|-------------------------------|------------------------|---------------------------------|  
  | **Amazons**   | YES (women warriors = kernel) | NO (nation = LBC)      | **NO** (Agrees with LBC)        |  
  | **Trojan Horse| NO (no evidence)             | Malformed             | **Malformed** (Agrees with both)|  
  | **Ragnar**    | YES (Viking leader = kernel)  | NO (saga hero = LBC)   | **NO** (Agrees with LBC)        |  

  #### Where the Rules Split:  
  - **Amazons**: Sharpest split. Kernel rule accepts warrior women; LBC rule rejects the *defining narrative* (matriarchal society).  
  - **Ragnar**: Kernel rule accepts an unnamed leader; LBC rule rejects the saga’s legendary figure.  
  - **Trojan Horse**: Both rules reject history, but LBC uniquely frames it as a non-historical question.  

  #### Best Discriminating Case: **Amazons**  
  This cleanly splits the rules: Scythian evidence satisfies a "kernel" but not the LBC. His verdict here would confirm his emphasis on *narrative integrity*.  

  #### Stronger Discriminating Case (Unasked): **Lycurgus of Sparta**  
  - *Why it discriminates better*:  
    - **Kernel Rule** might say "YES" if Spartan reforms (e.g., *Great Rhetra*) are historical, treating Lycurgus as a symbolic "kernel."  
    - **LBC Rule** would say "NO" because the tradition’s load-bearing claims (e.g., divine oracle, Lycurgus as lawgiver) have no contemporary evidence and likely retroject later institutions.  
  - *Advantage over your cases*: Unlike Amazons (where evidence exists for *some* reality) or Ragnar (where a vague leader existed), Lycurgus lacks *any* direct corroboration. This forces a pure test of whether institutional "kernels" suffice or if the *figure’s claimed role* must be transmitted accurately.  

  Your brother-in-law would likely rule **"NO" on Lycurgus**, cementing his LBC approach: institutions might be real, but the narrative construct isn’t history. This would mirror his Gilgamesh verdict (real king, fictional deeds) but with *no evidence for the person*, pushing beyond even Arthur’s edge cases.  

  --- 
  **Key Insight**: His rule isn’t just about evidence—it’s about whether the tradition’s *central purpose* (e.g., Exodus as liberation epic, Arthur as Briton savior) maps to a real event. If the "memory" is repurposed (Hyksos → Exodus) or inflated (Scythians → Amazons), it fails. This makes him more historian than folklorist—prioritizing *what actually happened* over *why the story exists*.
