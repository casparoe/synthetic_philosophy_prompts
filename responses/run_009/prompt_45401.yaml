prompt: |-
  I sit on the animal-care committee of a mid-sized biomedical research institute, and I have realized that our protocol reviews are philosophically incoherent: we demand near-complete justification for procedures on dogs and cats while waving through objectively worse procedures on rodents and fish, and nobody can articulate why beyond habit and the fear of publicity. I've been reading about speciesism and about the principle that like interests deserve equal consideration regardless of whose they are — but that principle is stated at a level of abstraction our committee cannot act on, and if I propose "stop being speciesist" outright, I'll be laughed out of the room.

  Please convert whatever is actually defensible in that principle into a review procedure the committee can run on each protocol. We review roughly fifteen protocols per month, the whole committee is expected to spend no more than thirty minutes per protocol, and most members have no philosophy background, so the procedure has to be usable by someone who has never heard the term "equal consideration of interests." It should specify, in order: what facts to establish about the animals involved, what counts as a sufficient answer at each step, and at which point the procedure hands the decision back to a judgment call about values rather than facts — I want those points marked explicitly rather than hidden in the procedure's apparent objectivity. Pay particular attention to how the procedure should handle scientific uncertainty about whether a given kind of animal can feel pain (e.g., fish larvae, cephalopods, insects), and to the distinction between weighting interests by their intensity and discounting them because of the species that has them.

  Then run the procedure on three protocols we actually face or soon will: (1) a moderately painful efficacy study on mice with a plausible but speculative payoff for a human degenerative disease; (2) the same study design, but proposed for zebrafish larvae, whose capacity for pain is contested, with slightly lower scientific quality if it stays in fish; and (3) a proposal to switch a long-standing terminal teaching exercise from rats to pigs because the anatomy is more instructive, with the pigs' time under anesthesia made somewhat shorter as a concession. In at least one case, I expect the procedure to give an answer the committee will find politically unacceptable — please show that honestly rather than softening it. Finally, tell me what the procedure cannot do: where it will misfire, and where a genuinely principled committee would have to go beyond it.
reasoning: |-
  Okay, the user is on an animal-care committee at a biomedical research institute and is frustrated by the inconsistent ethical treatment of different species. They've noticed dogs and cats get intense scrutiny while rodents and fish get less, mainly due to habit and fear of bad PR, not principle. They've read about speciesism and the idea that similar interests should get equal consideration, but they need a practical, actionable procedure for their committee. The challenge is to create a review process that's factual, efficient (30 minutes per protocol), and usable by non-philosophers.

  First, I need to unpack their request. They want a step-by-step procedure that focuses on establishing facts about the animals involved, not values. The procedure should specify what facts to gather, what counts as sufficient answers, and where value judgments come in. Key points include handling scientific uncertainty about pain (like in fish larvae or insects) and distinguishing between weighting interests by intensity versus species-based discounts.

  The user also wants the procedure applied to three real examples: a mouse study, a zebrafish larvae study, and switching from rats to pigs for teaching. They expect one outcome to be politically unpopular and want that shown honestly. Finally, they want limitations of the procedure outlined.

  Looking deeper, the user is likely seeking legitimacy and consistency in their committee's decisions. They might feel hypocritical approving harsher procedures on "lesser" species without justification. Their unspoken needs could include reducing cognitive dissonance among members, preempting external criticism, or fostering a more ethically unified committee. They might also want tools to gently challenge institutional norms without alienating colleagues.

  Now, for the procedure design. I need to make it structured but not philosophical. The core is comparing unavoidable harms against expected benefits, with harm intensity assessed neutrally across species. For uncertainty about pain, a precautionary approach makes sense—default to assuming capacity if evidence isn't conclusive. The distinction between weighting (by intensity) and discounting (by species) is crucial; the procedure must avoid the latter.

  I'll outline steps: first, establish harm facts (duration, intensity, certainty of pain), then scale them neutrally. Next, assess benefit facts. Then compare harm vs. benefit in a way that flags when harms outweigh benefits, prompting a value judgment. For uncertainty, use evidence-based confidence levels and default to caution.

  Applying this to the three cases:
  - For the mouse study: high-harm, medium-benefit. The procedure might flag it as "unjustified on current facts," forcing the committee to confront their usual leniency with rodents.
  - For zebrafish larvae: similar harm level, but uncertainty about pain. Defaulting to assuming capacity could make it seem worse than mice, which might surprise the committee since larvae are often dismissed.
  - For pigs vs. rats: shorter anesthesia but more intense suffering. The procedure might approve, showing that harm reduction can offset species switches.

  The politically unpopular part will likely be the zebrafish outcome—suggesting higher scrutiny for fish than current habits, which could feel counterintuitive.

  Limitations include: it can't resolve fundamental value conflicts (e.g., is human benefit worth any animal harm?), it might oversimplify complex welfare trade-offs, and it depends on honest harm assessments. A principled committee would need deeper ethical debates beyond this tool.

  The user probably needs this to spark change without backlash. By grounding it in facts, they can avoid "speciesism" debates and focus on consistency. The examples will show where current practices fail logically, which might persuade colleagues. Honesty about limitations builds credibility.
answer: |-
  Here’s a concrete, **Species-Neutral Harm-Benefit Protocol (SNHBP)** designed for operational use. It focuses on **facts about harms and benefits**, not species labels, and explicitly separates factual assessment from value judgments. The procedure is structured as a 4-step checklist (≤10 mins/protocol for staff pre-review; ≤20 mins/committee discussion).

  ---

  ### **The SNHBP Review Procedure**
  **Core Principle:** Harms to animals should be proportional to expected benefits, with harm intensity weighted equally across species unless *evidence-based* differences in capacity exist.  
  **Output:** A clear "Go/No-Go" flag for *factual justification* (not final approval). If flagged "Unjustified," the committee must explicitly override with value-based reasoning.

  #### **STEP 1: Establish Harm Profile**  
  *What to document (staff pre-fill; committee verifies):*  
  - **Harm Type:** Pain, distress, lasting impairment, death (specify duration and intensity: e.g., "moderate pain x 3 days").  
  - **Harm Certainty:** High (≥90% experience it), Medium (50-90%), Low (<50%).  
  - **Harm Uncertainty:** For contested capacities (e.g., fish pain), cite current evidence (e.g., "Zebrafish larvae: nociceptors present but CNS maturity debated; Sneddon 2018 suggests capacity exists").  
  - *Sufficient Answer:* Objective metrics (e.g., analgesia requirement, behavioral avoidance). If contested, state both viewpoints + key citations.  

  #### **STEP 2: Scale Harm Neutrally**  
  *What to do:* Convert harm to a **standardized intensity score** (1-5):  
  - 1: Mild/short-term (e.g., brief restraint)  
  - 2: Moderate (e.g., post-op pain)  
  - 3: Severe (e.g., untreated chronic pain)  
  - 4: Very severe (e.g., major trauma)  
  - 5: Death + preceding suffering  
  *Rules:*  
  - **Same harm intensity = same score** (e.g., a mouse and pig undergoing identical surgery both score 3).  
  - **Uncertain capacity (e.g., insects):** If evidence is ambiguous, default to **precautionary scoring** (assume capacity exists; score based on *potential* harm).  
  - *Sufficient Answer:* Score justified by observable impacts (e.g., "Score 3: laparotomy without post-op analgesia; see IACUC severity guidelines").  

  #### **STEP 3: Establish Benefit Profile**  
  *What to document:*  
  - **Benefit Type:** Human health impact, scientific knowledge, education.  
  - **Benefit Certainty:** High (e.g., Phase III drug trial), Medium (e.g., novel target validation), Low (e.g., exploratory/high-risk).  
  - **Benefit Magnitude:** Qualitative scale (Low/Med/High) based on impact (e.g., "High: targets untreatable disease").  
  - **Alternatives Considered:** In vitro/in silico models? Lower-sentience species?  
  - *Sufficient Answer:* Explicit rationale + citations (e.g., "No viable alternatives: zebrafish larvae allow high-throughput screening unavailable in mammals").  

  #### **STEP 4: Harm-Benefit Comparison**  
  *What to calculate:*  
  - **Flag as "Factually Justified" ONLY IF:**  
    - Harm Score ≤ 2 **OR**  
    - Harm Score 3-4 + Benefit Certainty = High + Benefit Magnitude = High **OR**  
    - Harm Score 5 + Benefit Certainty = High + Benefit Magnitude = High + Alternatives = None  
  - **Otherwise, flag "Unjustified on Current Facts."**  
  - ***VALUE JUDGMENT POINT:*** If "Unjustified," the committee must **explicitly state** their value-based reason for approval (e.g., "We prioritize anatomical relevance over harm intensity").  

  ---

  ### **Applied to Your Cases**
  #### **Case 1: Mouse Efficacy Study**  
  - *Harm:* Moderate pain (post-injection inflammation, 5 days). **Score: 3** (intensity same as in a cat).  
  - *Benefit:* Plausible but speculative payoff for human disease. **Certainty: Low, Magnitude: High.**  
  - *Alternatives:* None proposed.  
  - **SNHBP Output:** *Unjustified on Current Facts* (Harm 3 + Low certainty benefit fails Step 4 threshold).  
  - *Committee Action:* Must override with values (e.g., "We accept higher rodent harm for early-stage disease research").  

  #### **Case 2: Same Study in Zebrafish Larvae**  
  - *Harm:* Identical procedure → moderate tissue damage. **Pain capacity contested.**  
    - Precautionary scoring: Assume capacity exists → **Score: 3** (same as mouse).  
  - *Benefit:* Slightly lower scientific quality → **Certainty: Low, Magnitude: Med-High.**  
  - *Alternatives:* Mice possible but costlier.  
  - **SNHBP Output:** *Unjustified on Current Facts* (Harm 3 + Low certainty benefit).  
  - ***Politically Unacceptable Truth:*** The procedure demands *equal or stricter* scrutiny for fish vs. mice due to precautionary principle. Approval requires overruling factual scoring.  

  #### **Case 3: Switch Teaching Exercise (Rats → Pigs)**  
  - *Harm (Rats):* Terminal anesthesia + dissection. **Score: 1** (minimal suffering under anesthesia).  
  - *Harm (Pigs):* Shorter anesthesia → **Score: 1** (same intensity, shorter duration).  
  - *Benefit:* Better anatomy teaching → **Certainty: High, Magnitude: Med** (for education).  
  - **SNHBP Output:** *Justified* (Harm 1 + High certainty benefit meets threshold).  
  - *Note:* Despite pigs being "higher status," harm intensity is low → no issue.  

  ---

  ### **What the SNHBP Cannot Do**  
  1. **Resolve Fundamental Values:** It flags factual incoherence but can’t decide *which* values should prevail (e.g., "human benefit justifies any harm").  
  2. **Quantify Subjective Suffering:** Relies on observable proxies (e.g., analgesia use). Chronic stress in "lower" species may be under-scored.  
  3. **Handle Extreme Uncertainty:** If pain capacity evidence is 50/50 (e.g., crustaceans), precautionary scoring may over-penalize.  
  4. **Address "Mere Species" Bias:** A principled committee must confront why a dog’s pain scores higher than a mouse’s *for identical procedures* (spoiler: it shouldn’t).  
  5. **Replace Harm Reduction Efforts:** Justifying harm ≠ approving avoidable suffering. A principled committee would *still* require refinements (e.g., better anesthesia in Case 1).  

  **Recommendation:** Pilot the SNHBP for 1 month with the disclaimer: *"This tool ensures we weigh harms consistently. If outputs surprise us, we should ask why."* It won’t abolish speciesism overnight, but it forces hypocrisy into the open—and that’s the first step.
