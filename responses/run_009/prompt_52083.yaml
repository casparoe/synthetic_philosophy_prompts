prompt: |-
  My philosophy department has decided to try something unusual. For the past two terms, two colleagues have been arguing past each other in our seminar on the philosophy of science: one a fairly committed scientific realist who takes the success of our best physical theories to be best explained by their approximate truth, the other an anti-realist who leans heavily on the pessimistic meta-induction and the historical record of phlogiston, caloric, and the luminiferous ether. The department has now commissioned an adversarial collaboration between the two of them, and I have been asked to prepare the document they would jointly sign. I want you to draft it. Please include: the substantive claims both could sign -- about the undeniable predictive and technological success of mature science, about the genuine historical phenomenon of successful theories whose central posits were later abandoned, about what the no-miracles argument and the pessimistic meta-induction each establish and fail to establish, and about the epistemic credentials of inference to the best explanation as a general pattern of reasoning. Then set out the exact residual disagreements, each phrased so that its own side would accept the wording as fair -- including, at minimum, whether realism's divide-and-impera move (retreating to the claim that only the working parts of past theories were approximately true) is principled or post hoc gerrymandering, whether structural survival of equations across theory change (Fresnel's equations surviving into Maxwell's theory, say) is evidence of anything more than descriptive bookkeeping, and whether approximate truth is a coherent notion that can do explanatory work. Where you find that part of their dispute is verbal rather than substantive -- perhaps the difference between believing a theory and merely accepting it as empirically adequate, or the drawing of the observable/unobservable line -- say so explicitly and explain why.

  Beyond the agreed claims and disagreements, I need the cruxes: the specific sub-questions such that settling them would genuinely move at least one party. For each crux, identify a concrete case, historical episode, or argumentative test that both sides would accept as bearing on it, and write down in advance what each side predicts that test would show. For example, both might agree that a systematic comparison of mature nineteenth-century theories with their successors is relevant to the selectivity crux -- but the realist will predict that a fair audit will find the successful, retained components clearly separable from the abandoned ontology, while the anti-realist will predict that any such separation can only be drawn retrospectively, with the benefit of hindsight about which parts survived. Think hard about what other tests are genuinely shared: the anti-realist will not accept anything that simply presupposes inference to the best explanation, and the realist will not accept anything that presupposes empiricism about unobservables, so the shared tests have to be carefully neutral.

  Format the document as a numbered section of agreed claims, followed by a disagreements table (disagreement, realist's formulation in her own words, anti-realist's formulation in his own words, whether verbal or substantive), followed by a cruxes section with the predictions recorded side by side. Close with a short jointly signed paragraph stating what each side concedes it would give up, and under what circumstances, were the cruxes to resolve against it. Keep the register that of an actual collaborative document -- measured, precise, and free of straw men -- since the whole point is that both parties could put their names to it.
reasoning: |-
  We are drafting a collaborative document for two philosophers: a scientific realist and an anti-realist (likely an empiricist or constructive empiricist). The document must include:
  1. Agreed claims (numbered section)
  2. Disagreements table (with each disagreement phrased in both the realist's and anti-realist's own words, and whether the disagreement is substantive or verbal)
  3. Cruxes section (shared tests, with each side's predictions)
  4. A jointly signed closing paragraph (concessions each would make if cruxes resolve against them)

  Key topics to cover in agreed claims:
  - Predictive and technological success of mature science
  - Historical phenomenon of successful but abandoned theories (e.g., phlogiston, caloric, ether)
  - What the no-miracles argument (NMA) and pessimistic meta-induction (PMI) each establish and fail to establish
  - Epistemic credentials of inference to the best explanation (IBE)

  Key disagreements to phrase fairly:
  - Whether realism's "divide-and-conquer" (selective realism) is principled or post hoc gerrymandering
  - Whether structural survival (e.g., Fresnel's equations) is evidence of more than descriptive bookkeeping
  - Whether approximate truth is coherent and explanatory
  - Also, note if part of the dispute is verbal (e.g., belief vs. acceptance, observable/unobservable line)

  Cruxes: specific sub-questions with shared tests. Examples:
  - For selective realism: a systematic comparison of 19th-century theories and their successors. Realist predicts: successful parts are separable; anti-realist predicts: separation only in hindsight.
  - Need other shared tests that are neutral (don't presuppose IBE or empiricism about unobservables).

  Let's structure the document:

  **Adversarial Collaboration Agreement: On Scientific Realism and Anti-Realism**

  **1. Agreed Claims**

  The undersigned, representing the scientific realist and anti-realist positions respectively, agree on the following:

  1.1. **Success of Science**: Mature sciences, particularly in physics, have achieved remarkable and undeniable predictive and technological success. This success is robust across a wide range of domains and is a key feature of scientific practice that any philosophical account must address.

  1.2. **Historical Record of Theory Change**: The history of science presents genuine cases of theories that were predictively successful and widely accepted but whose central ontological posits were later abandoned (e.g., phlogiston theory in chemistry, caloric theory of heat, the luminiferous ether in optics and electromagnetism). These cases are not merely anomalies but part of the standard pattern of scientific progress.

  1.3. **No-Miracles Argument (NMA) and its Limits**: The NMA, which holds that the predictive success of science would be a miracle if our best theories were not at least approximately true, provides a prima facie plausible argument for scientific realism. However, the NMA, as an instance of inference to the best explanation (IBE), depends on the epistemic credentials of IBE and cannot by itself establish the approximate truth of theories in the face of the historical record.

  1.4. **Pessimistic Meta-Induction (PMI) and its Limits**: The PMI, which infers from the historical record of abandoned theories that our current successful theories are likely also false (and their central posits non-referential), provides a strong challenge to realism. However, the PMI does not entail that science makes no progress, nor does it directly address the question of whether the success of science can be explained without invoking approximate truth.

  1.5. **Inference to the Best Explanation (IBE)**: IBE is a widely used pattern of reasoning in science and everyday life. Its epistemic credentials are, however, contested: realists typically endorse IBE as a reliable form of ampliative inference, while anti-realists may regard it as question-begging in the context of unobservables. Both agree that the dispute about IBE is central to the realism debate.

  **2. Disagreements**

  The following table lists key points of disagreement. Each is presented in two formulations: one that the realist endorses (and the anti-realist rejects) and one that the anti-realist endorses (and the realist rejects). We also note whether the disagreement is primarily substantive or verbal.

  | Disagreement Topic | Realist's Formulation | Anti-Realist's Formulation | Nature of Disagreement |
  |-------------------|------------------------|----------------------------|------------------------|
  | Selective Realism ("Divide-and-Conquer") | The selective realist strategy, which holds that only the working parts (typically the structural or mathematical components) of past theories were approximately true, is a principled response to the PMI because it distinguishes between what was essential to the theory's success and what was idle. | The selective realist strategy is an ad hoc, post hoc gerrymandering that retrospectively carves up past theories to save realism from counterexamples; it lacks a principled, prospective criterion for distinguishing working parts from idle ones. | Substantive |
  | Structural Continuity | The survival of mathematical structures (e.g., Fresnel's equations in Maxwell's theory) across theory change is evidence of the retention of approximately true knowledge about the structure of the world, not merely descriptive bookkeeping. | The survival of equations is a matter of preserving empirical content in a new formalism; it does not warrant an inference to the approximate truth of the structures about unobservable entities, but only shows pragmatic continuity in modeling. | Substantive |
  | Approximate Truth | Approximate truth is a coherent and explanatory notion: it explains why theories are successful and why they can be improved. It is not undermined by the fact that theories are never exactly true. | Approximate truth is either incoherent (because it requires a notion of 'closeness to truth' that cannot be defined for theories with false central posits) or, even if coherent, cannot do the explanatory work realists claim because success can be explained without it (e.g., by empirical adequacy). | Substantive |
  | Observable/Unobservable Distinction | The observable/unobservable distinction is not epistemically significant; it is a matter of degree and does not mark a boundary for legitimate epistemic commitment. | The observable/unobservable distinction is epistemically fundamental: we can justifiably believe in the existence of observable entities but not unobservable ones, as the latter require an explanatory inference that is not warranted. | Substantive (though partly verbal, as the disagreement hinges on the epistemic weight given to the distinction) |
  | Belief vs. Acceptance | Realism requires belief that our best scientific theories are approximately true, including their claims about unobservables. | Anti-realism (specifically constructive empiricism) holds that we should only accept theories as empirically adequate, which does not require belief in the truth of claims about unobservables. | Partly verbal and substantive: the verbal aspect concerns the meaning of 'belief' and 'acceptance'; the substantive aspect is whether we have epistemic grounds for belief in unobservables. |

  **3. Cruxes**

  The following cruxes are specific points of contention that both sides agree would, if resolved, genuinely move the debate. For each crux, we describe a shared test (a concrete case, historical episode, or argumentative test) and record each side's prediction about what the test would show.

  3.1. **Crux: Principled Selectivity**

  - **Shared Test**: A systematic, prospective study of a set of mature 19th-century theories (e.g., ether theories in electromagnetism and optics, caloric theory, Daltonian atomism) and their subsequent evolution into 20th-century theories. The test is whether, using only the resources and knowledge available at the time of the earlier theory, we can identify which components will be retained and which abandoned in the successor theory.
  - **Realist Prediction**: A fair audit will show that the components that were essential to the successful predictions (e.g., specific equations, certain structural features) can be prospectively distinguished from the idle ontology (e.g., the ether) and that these essential components are largely retained.
  - **Anti-Realist Prediction**: Any such separation will be found to be only retrospectively possible with the benefit of hindsight; there are no reliable, prospective criteria that would have allowed scientists at the time to make the distinction.

  3.2. **Crux: Structural Continuity as Evidence**

  - **Shared Test**: An examination of cases of structural continuity (e.g., the retention of Fresnel's equations in Maxwell's electromagnetism, the Poisson equation in gravitation) to determine whether the survival of the equations is accompanied by a retention of the same physical interpretation or whether the survival is due to the equations being reinterpreted in a radically different ontology.
  - **Realist Prediction**: The cases will show that the survival of equations is not merely formal but reflects a continuity in the representation of physical structure, even if the ontology changes. The equations survive because they capture something true about the world's structure.
  - **Anti-Realist Prediction**: The cases will show that the equations are retained for their empirical adequacy and are reinterpreted in the new theory with a different ontology, demonstrating that they do not represent knowledge of unobservable structure.

  3.3. **Crux: Coherence and Efficacy of Approximate Truth**

  - **Shared Test**: A philosophical analysis of the concept of approximate truth, including its formal definition (e.g., via truthlikeness or similarity metrics) and its application to key historical cases (e.g., Newtonian mechanics vs. general relativity). The test is whether approximate truth can be defined in a non-arbitrary way and whether it provides a better explanation of scientific success than non-realist alternatives (e.g., empirical adequacy).
  - **Realist Prediction**: Approximate truth can be coherently defined (e.g., through partial reference or structural similarity) and provides a superior explanation for the success of science, particularly in novel predictions.
  - **Anti-Realist Prediction**: Approximate truth will be found to be either formally elusive (no non-arbitrary measure) or explanatorily redundant (success can be explained without it).

  3.4. **Crux: Epistemic Significance of Observability**

  - **Shared Test**: An examination of the history of science for cases where entities once deemed unobservable became observable (e.g., bacteria via microscopes, planets via telescopes) and the impact of this shift on scientific certainty. Also, a conceptual analysis of the observable/unobservable distinction.
  - **Realist Prediction**: The distinction will be found to be fluid and without epistemic import; beliefs about entities that were once unobservable but became observable were justified even before they were observed, based on explanatory power.
  - **Anti-Realist Prediction**: The distinction is stable (e.g., via a criterion of unaided human perception) and epistemically significant: certainty only attaches when entities become observable, and prior to that, we can only accept theories as empirically adequate.

  **4. Joint Closing Statement**

  We, the undersigned, agree that this document fairly represents both the common ground and the disagreements between our positions. We commit to engaging with the cruxes identified above. Should the shared tests resolve in a manner contrary to our respective positions, we each make the following concessions:

  - The realist concedes that if the shared tests on principled selectivity and structural continuity show that the realist's predictions fail (e.g., if no prospective criterion for retention is found and structural survival is shown to be merely formal), then the realist would have to significantly weaken the no-miracles argument and consider a more modest form of realism or even abandon realism in favor of a non-realist explanation of success.

  - The anti-realist concedes that if the shared tests show that the realist's predictions hold (e.g., if a prospective criterion for retention is established, structural continuity is shown to reflect knowledge of the world, and approximate truth is shown to be coherent and explanatory), then the anti-realist would have to grant that realism provides the best explanation of scientific success and would either adopt realism or substantially revise anti-realism to accommodate these findings.

  Signed,

  [Realist's Name]
  [Anti-Realist's Name]
answer: |-
  ### Adversarial Collaboration Agreement: On Scientific Realism and Anti-Realism in the Philosophy of Science  

  **1. Agreed Claims**  
  We, the undersigned scientific realist and anti-realist, jointly affirm the following substantive points:  

  1.1. **Success of Mature Science**: Contemporary mature sciences (e.g., fundamental physics, chemistry) exhibit undeniable and robust predictive and technological success. This success is systematic, extends beyond mere data-fitting, and underpins applied advancements (e.g., semiconductor technology, GPS relativity corrections).  

  1.2. **Historical Theory Abandonment**: Successful theories from the history of science (e.g., phlogiston in combustion, caloric in thermodynamics, the luminiferous ether in electromagnetism) were empirically successful in their time but later discarded, including their central ontological posits. This pattern is a genuine feature of scientific progress that any account of science must address.  

  1.3. **No-Miracles Argument (NMA)**: The NMA—which posits that the predictive success of science is best explained by the approximate truth of our best theories—establishes a prima facie case for realism. However, it cannot, by itself, resolve disputes about unobservables, as it relies on the contested epistemic status of inference to the best explanation (IBE).  

  1.4. **Pessimistic Meta-Induction (PMI)**: The PMI—which infers from historical theory abandonment that current theories are likely false—establishes that realism cannot presume the truth of all successful theory-components. However, it does not entail that science lacks progress, nor does it disprove selective forms of realism.  

  1.5. **Inference to the Best Explanation (IBE)**: IBE is a pervasive and descriptively accurate pattern of reasoning in science (e.g., Darwinian evolution as the best explanation for biodiversity). Its epistemic legitimacy is foundational to the realism debate: realists view IBE as justifying truth-claims about unobservables, while anti-realists restrict its scope to observables or treat it as pragmatic.  

  ---

  **2. Disagreements**  
  The following table delineates unresolved disagreements. Each is formulated in the proponent’s own terms, with an assessment of whether the dispute is substantive or verbal.  

  | **Disagreement Topic** | **Realist’s Formulation** | **Anti-Realist’s Formulation** | **Verbal/Substantive** |  
  |------------------------|---------------------------|--------------------------------|------------------------|  
  | **Selectivity ("Divide-and-Conquer")** | The distinction between working (e.g., mathematical) and idle (e.g., ontological) components of past theories is principled, grounded in explanatory necessity, and explains why success persists despite ontological shifts. | Selectivity is post hoc gerrymandering; it lacks prospective criteria, retroactively redefining "working" components to evade counterexamples, and conflates success with truth. | Substantive |  
  | **Structural Survival** | The retention of equations (e.g., Fresnel’s optics in Maxwell’s theory) reflects continuity in approximating structural truths about the world, providing evidence for realism beyond mere bookkeeping. | Structural retention is a pragmatic tool for preserving empirical content; it denotes no truth about unobservables and is compatible with instrumentalism. | Substantive |  
  | **Approximate Truth** | Approximate truth is coherent (defined via verisimilitude or referential continuity), explains novel success, and is indispensable for understanding scientific progress. | Approximate truth is ill-defined for theories with false ontologies; even if coherent, it is explanatorily redundant, as success arises from empirical adequacy alone. | Substantive |  
  | **Observable/Unobservable Line** | The observable/unobservable distinction is epistemically insignificant; it is a continuum (e.g., cloud chambers extend observation), and IBE licenses beliefs beyond it. | The distinction is epistemically fundamental; unobservables (e.g., electrons) cannot be known, only empirically modeled, making belief unjustified. | Partly verbal (hinges on defining "observation"), partly substantive (over epistemic weight). |  
  | **Belief vs. Acceptance** | Realism requires believing theories (including unobservables) to be approximately true, as IBE warrants truth-claims. | Anti-realism requires only accepting theories as empirically adequate; belief in unobservables is unwarranted, as they are not strictly testable. | Partly verbal (semantic overlap in "belief/acceptance"), partly substantive (over justification for unobservables). |  

  ---

  **3. Cruxes**  
  We identify the following cruxes—specific, testable sub-questions—where resolution would move at least one party. Each crux includes a shared, neutral test and opposing predictions.  

  | **Crux** | **Shared Test** | **Realist’s Prediction** | **Anti-Realist’s Prediction** |  
  |----------|----------------|--------------------------|-------------------------------|  
  | **Principled Selectivity** | Audit 10 mature 19th-century theories (e.g., caloric, ether) and their successors. Using only period-appropriate criteria (e.g., predictive role, explanatory necessity), can "working components" be prospectively distinguished from "idle ontology"? | Audit will show clear, prospective separability (e.g., Carnot’s thermodynamic cycle retained; caloric fluid abandoned), supporting a principled distinction. | Audit will reveal no prospective criteria; distinctions rely on hindsight, showing gerrymandering (e.g., ether’s "undetectable" properties were once deemed essential). |  
  | **Structural Continuity as Evidence** | Analyze historical cases of equation retention (e.g., Fresnel → Maxwell; Newtonian gravity → general relativity). Does survival imply truth-tracking, or is it merely formal convenience? | Cases will show structural retention tracks physical necessity (e.g., Fresnel’s equations describe light behavior, not just data), supporting approximate truth. | Cases will show equations survive due to empirical adequacy alone (e.g., Fresnel’s math preserved as a calculational tool), with no truth-commitment. |  
  | **Coherence of Approximate Truth** | Formalize "approximate truth" via a truthlikeness metric (e.g., similarity to current theories) and apply it to abandoned theories (e.g., phlogiston). Can it non-arbitrarily explain success? | Metric will validate success-tracking (e.g., phlogiston’s role in oxidation predictions partially maps to oxygen), proving explanatory utility. | Metric will be incoherent (e.g., phlogiston’s "similarity" to oxygen is undefined) or redundant (success explained by empirical adequacy). |  
  | **IBE’s Scope** | Evaluate novel predictions from IBE-driven theories (e.g., neutrino discovery). Does IBE reliably extend to unobservables, or is it limited to observables? | Cases will show IBE yields confirmed novel predictions (e.g., neutrino properties), justifying belief in unobservables. | IBE’s "success" here relies on empirical testing, not truth; it cannot warrant belief beyond observables. |  

  ---

  **4. Joint Closing Statement**  
  We, the undersigned, affirm this document as a fair representation of our agreements, disagreements, and cruxes. Should the shared tests resolve against our positions, we concede the following:  

  - **The realist** would abandon the claim that selectivity is principled if the audit (Crux 1) shows no prospective criteria, and/or reject approximate truth as explanatory if the metric (Crux 3) fails. This would necessitate a retreat to structural realism or weaker epistemic commitments.  
  - **The anti-realist** would grant that realism best explains success if the tests (Cruxes 1–3) confirm the realist’s predictions, and/or accept IBE’s legitimacy for unobservables if novel predictions (Crux 4) reliably track truth. This would require revising anti-realism to accommodate truth-aptness for core theory-components.  

  This collaboration reflects our commitment to dialectical resolution, free of straw men, and open to empirical and historical evidence.  

  Signed,  
  _________________________  
  [Realist’s Name]  
  _________________________  
  [Anti-Realist’s Name]  

  ---  
