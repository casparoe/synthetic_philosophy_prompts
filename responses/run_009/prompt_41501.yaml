answer: |-
  ## The Selective Implantation Case

  **Setting:** A licensed fertility clinic in London. A couple has undergone IVF, producing several viable embryos. Preimplantation Genetic Testing (PGT) reveals two key findings:
  1.  Embryo A carries a genetic variant guaranteeing the development of severe, lifelong neuropathic pain (e.g., Hereditary Sensory and Autonomic Neuropathy Type V). This condition causes constant, significant pain, requires daily strong medication with side-effects, prevents certain careers (e.g., manual labour, long-haul driving), and necessitates frequent hospital visits. Crucially, life expectancy is normal, and with management, a person can lead a fulfilling life with relationships, careers (within limitations), hobbies, and enjoyment – comfortably above the worth-living threshold.
  2.  Embryo B carries no such variant or any other known serious disorder. Its projected life prospects are free from this specific, significant disadvantage.

  **Decision-Maker:** Dr. Eleanor Vance, the lead embryologist and clinician.

  **The Choice & Reason R:** The clinic's standard policy is to select the embryo with the best health prognosis for implantation, prioritising the avoidance of serious, avoidable suffering. Dr. Vance, however, consciously deviates from this policy. She chooses to implant Embryo A instead of Embryo B. Her reason (R) is purely aesthetic and arbitrary: she prefers the slightly higher likelihood (based on statistical averages linked to the A variant, not certainty) that a person developing from Embryo A might have a specific, uncommon eye colour she finds particularly striking. She acknowledges the disadvantage Embryo A will face but justifies her choice by stating: "Well, they wouldn't exist at all if I didn't choose *them*, and their life will still be good on the whole. My choice gives them life, and I get to see those fascinating eyes."

  **The Complainant:** Aisling (developed from Embryo A), now 25 years old. She lives with the predicted severe neuropathic pain. She manages it, holds a desk job she enjoys, has friends and hobbies, and affirms her life is worth living. However, she experiences significant daily suffering, limitations, and medical burdens. She learns of Dr. Vance's selective decision from clinic records accessed during a routine medical update.

  **Aisling's Complaint:** Aisling does not claim she would be better off non-existent. Her complaint is: "Dr. Vance chose to bring *me* into existence *with* this severe burden, when she could just as easily have brought someone else into existence *without* it, and for no better reason than her personal whim about eye colour. She treated the fact that I wouldn't otherwise exist as a reason to discount the serious harm I would experience compared to the other possible person. She would never accept such a trivial reason to deliberately inflict this condition on an existing child."

  **The Alternative:** Had Dr. Vance chosen Embryo B, Aisling would never have existed. Instead, a different person, Ben (developed from Embryo B), would have existed. Ben would have had a life also comfortably worth living, but without the severe neuropathic pain and its associated burdens. Ben's life prospects would have been objectively better than Aisling's in this specific, significant respect.

  ---

  ### 1. Walkthrough: Theoretical Verdicts

  *   **Narrow Person-Affecting Consequentialist Verdict:** This view focuses solely on whether the act made any *particular, identifiable* person worse off than they would otherwise have been. For Aisling, the alternative to Dr. Vance's choice was non-existence. Since her life is worth living, Dr. Vance's act did *not* make Aisling worse off than she would otherwise have been – it gave her existence. Ben was never brought into existence, so Ben is not a person who can be said to be harmed or made worse off by not being selected; Ben simply never exists to be a subject of harm. No existing person is comparatively worse off. Therefore, according to the narrow comparative test, Dr. Vance's act wronged no one. Aisling has no valid complaint on this view; she exists and has a life worth living.
  *   **Impersonal Welfarist Verdict:** This view evaluates states of affairs based on the total or average welfare they contain, irrespective of *which specific individuals* experience that welfare. It asks: "Which choice leads to a better outcome overall?" Bringing Ben into existence (without the severe pain) would have resulted in a state of the world containing a person experiencing a higher level of lifetime welfare than the state brought about by bringing Aisling into existence (with the severe pain). Choosing Aisling over Ben therefore results in less overall welfare (or lower average welfare, as only one person exists in either scenario). Since Dr. Vance chose the worse outcome (lower welfare) for a trivial, arbitrary reason (R), her act was wrong. It produced an impersonally worse state of affairs.
  *   **Matching Aisling's Complaint:** Aisling's complaint aligns with the *Impersonal Welfarist Verdict*, not the Narrow Person-Affecting one. She is not complaining about being made worse off *than she would have been* (the narrow comparative test fails). She is complaining that Dr. Vance *created a worse-off person* when she could easily have created a better-off person, for a reason (R) that fails to justify creating the avoidable disadvantage. Her sense of being wronged stems from the decision-maker's selection of a foreseeably worse-off future person for an insufficient reason, exploiting the fact that selection necessarily determines identity. The impersonal view captures the wrongness of *choosing a worse outcome* via identity-determining choice.

  ### 2. The Contrast Test

  Imagine a scenario where Aisling *already exists* as a 5-year-old child, living with the same severe neuropathic pain. Dr. Vance is now a paediatrician. She has a safe, effective treatment that can *cure* Aisling's pain completely with no side effects. However, Dr. Vance withholds the cure. Her reason (R) remains: she finds Aisling's uncommon eye colour fascinating and worries the treatment might subtly alter it (despite no medical evidence supporting this), and she prefers Aisling retain that specific eye colour.

  In this contrasting scenario, Dr. Vance's reason (R) is *obviously* insufficient to justify imposing continued, severe, avoidable suffering on an existing child. Her action would be widely condemned as cruel, unethical malpractice, violating her duty of care to minimise suffering in her existing patient. The triviality and arbitrariness of R are blatant.

  **The Effect of Nonidentity:** The *only* difference between the actual Selective Implantation case and this Contrast scenario is the nonidentity fact: in the actual case, choosing *not* to impose the disadvantage means a different person (Ben) exists instead of Aisling. This nonidentity fact is what allows Dr. Vance (and potentially the Narrow Person-Affecting view) to offer reason R with a straight face in the actual case. It creates the space where "choosing who exists" seems to license the decision-maker to discount the comparative disadvantage of the chosen person in a way they never could for an existing person. The contrast test reveals that R is inherently inadequate; the nonidentity fact merely masks this inadequacy.

  ### 3. The Key Feature and Its Removal

  **The Key Feature:** The core work is done by the decision-maker's **explicit reliance on the nonidentity fact as a justificatory shield for imposing a disadvantage based on a reason (R) that would be transparently inadequate for an existing person.**

  Dr. Vance doesn't merely *note* the nonidentity fact; she actively *uses* it ("they wouldn't exist at all if I didn't choose *them*") to deflect attention from the comparative disadvantage she is knowingly selecting for Aisling versus Ben, and to make her trivial reason (R) appear sufficient. She treats nonidentity as a licence to discount Aisling's comparative disadvantage.

  **Removing the Key Feature:** Suppose Dr. Vance implants Embryo A for reason R, but *does not* invoke the nonidentity fact in her justification. She simply states: "I chose A because I prefer the potential eye colour." The *wrongness* according to impersonal welfarism remains – she still chose a worse-off person for a trivial reason. However, the *distinctive complaint available to Aisling* – that her interests were discounted *because* her existence depended on the choice – becomes harder to articulate solely from the act itself. The complaint shifts more towards the arbitrariness of R and the violation of standard medical beneficence (choosing a worse health outcome). The specific "licence" dynamic highlighted by Aisling ("she treated my not otherwise existing as a licence...") becomes less clear-cut without Dr. Vance explicitly wielding the nonidentity fact as her shield. The *psychological* and *dialectical* force of Aisling's complaint weakens, even if the impersonal wrong might theoretically persist.

  ### 4. Strongest Reply from Narrow Person-Affecting Consequentialism

  **(Argued on its own terms, without rule-consequentialism or bad consequences):**

  "The Narrow Person-Affecting principle is fundamentally about *harm to individuals*. It requires a victim who is made worse off. Aisling exists and has a life worth living. She is not worse off than she would otherwise have been; she would not otherwise have been at all. Ben is not an individual who exists and can be harmed by non-selection; Ben is merely a counterfactual possibility. Therefore, there is no identifiable victim of Dr. Vance's choice.

  While Dr. Vance's reason (R) is trivial and her choice seems arbitrary or even distasteful, morality, on this strict comparative harm view, is not violated unless a specific person is harmed. Creating a person with a life worth living, even if foreseeably worse off than an alternative possible person could have been, does not constitute *harming that person*. The 'wrongness' perceived is an illusion generated by comparing Aisling's actual state to Ben's *non-actual* state. But Ben's state is not real; it is merely hypothetical. We can only morally evaluate the actual world against the actual alternatives *for the people who exist*. For Aisling, the only actual alternative was non-existence, which she does not prefer. Therefore, she was not harmed, and no wrong was done *to her*.

  The impersonal judgement that the world is 'worse' because Aisling exists instead of Ben smuggles in a problematic, impersonal value that prioritises abstract welfare states over the concrete interests and rights of actual individuals. It risks implying that Aisling's existence itself is suboptimal, which is a judgement she rightly rejects. The Narrow view avoids this by strictly adhering to the interests of actual people. Dr. Vance may have acted foolishly or against good medical practice, but she did not commit a moral wrong *against* any person."

  ---
  This case demonstrates how the nonidentity structure, typically used to *defuse* claims of wrongdoing, can instead *highlight* a distinctive kind of wrong when a decision-maker exploits the identity-determining nature of a choice to impose a disadvantage for reasons deemed insufficient in other contexts. It forces a confrontation between the narrow focus on comparative harm to individuals and broader evaluations of the quality of outcomes brought about by our choices.
