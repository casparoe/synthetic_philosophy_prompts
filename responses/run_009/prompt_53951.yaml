  The key point the user mentioned is the step from "every branch where I exist is one where I survived" to "I should expect to survive." But is this correct? In MWI, probability isn't about which branch you end up in, but about the measure of branches. Even though all branches exist, some have higher probability based on quantum mechanics. So low-probability events, like spontaneous remission, have fewer branches. The uncle is ignoring the probability aspect. He's treating all branches as equally real, which they are, but the likelihood of being in a high-probability branch is much greater.

