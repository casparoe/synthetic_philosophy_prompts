prompt: |-
  My metaethics TA keeps shutting down questions with the line that in calling an action wrong you aren't describing or stating anything — you're just expressing disapproval, the way you'd boo something rather than assert a fact about it. Last week she used this to dismiss my question about whether two people who sincerely disagree over whether eating meat is wrong are disagreeing about anything at all, the way they clearly would be if they disagreed about whether meat consumption is rising. I want to know what that one-liner is actually claiming. Lay out the distinct precise theses it could stand for — about what moral sentences mean, about what speakers are doing in uttering them, about which psychological states are expressed, about whether there are moral facts for sentences to be answerable to — and for each say whether it's a triviality, a substantive and defensible claim, or just false. For each reading, also say whether it can handle the case that keeps bothering me: moral sentences occurring unasserted, inside conditionals and denials and disjuncts, where someone can coherently accept that if lying is wrong then getting your little brother to lie is wrong while also asserting that lying is not wrong, and where the validity of inferring the consequent depends on the moral vocabulary meaning the same thing in embedded and unembedded positions. And finally, tell me which of the readings, if any, would actually license my TA's dismissal of my question about disagreement, since I suspect she needs a stronger reading than the one that's true.
reasoning: |-
  Okay, the user is grappling with their metaethics TA's repeated use of an expressivist one-liner to shut down questions. The core frustration seems to be about the dismissal of their substantive question on moral disagreement while sensing the explanation is oversimplified. 

  First, I need to unpack that one-liner ("calling an action wrong isn't describing, just expressing disapproval like booing") into its possible philosophical interpretations. The user wants precision: they're clearly academically competent enough to handle technical distinctions between semantic content, speech acts, psychological states, and ontological commitments. 

  The embedded contexts worry is particularly sophisticated - they've identified the Frege-Geach problem as a litmus test for any plausible reading. That's not undergrad-level intuition; they've done their reading. I should acknowledge that implicitly by diving straight into technical terms without oversimplifying. 

  Their suspicion about the TA needing a "stronger reading" feels spot-on. The dismissal only works if the TA is smuggling in non-cognitivism (thesis 4), but thesis 1-3 can't support it. I should flag how thesis 4 collapses disagreement into attitude clashes, making their original question "unanswerable" in descriptive terms - which is likely what the TA intended but didn't articulate. 

  The conditional case needs careful handling. For thesis 4, I must show why expressivism struggles with compositionality (attitudes not embedding like propositions) but also mention quasi-realism as a possible save. The user deserves to know this isn't a knockout punch, just an ongoing debate. 

  When structuring the response, I'll ladder the theses from least to most controversial so the user sees why each step strengthens the TA's position but at greater philosophical cost. The "trivial/defensible/false" ratings should serve as caution signs: thesis 1 is uncontroversial, thesis 4 is battle-trenched territory. 

  Finally, I'll validate their intuition that the TA overreached. The dismissal only "works" by conflating linguistic behavior (thesis 1) with metaphysics (thesis 4). They're right to demand which precise claim licenses that move - and to notice that weaker readings preserve genuine disagreement via descriptive components or hybrid approaches.
answer: |-
  Here's a breakdown of the distinct theses behind your TA's "boo" claim, evaluated for plausibility, handling of embedded contexts, and capacity to dismiss disagreement:

  **Core Theses:**

  1.  **Speech Act Thesis:** Uttering "X is wrong" primarily performs the *act* of expressing disapproval (like booing), rather than primarily performing the act of describing a state of affairs or stating a fact.
      *   **Status:** **Substantive and defensible (but limited).** This focuses on the speaker's *purpose* or *primary function* of the utterance within a social context.
      *   **Embedded Contexts (Frege-Geach Problem):** **Fails badly.** It struggles to explain what is happening in unasserted contexts. When I say "If lying is wrong, then getting your brother to lie is wrong," I am *not* currently expressing disapproval of lying (I might even deny it's wrong). The conditional seems to relate *propositions* or *meanings*, not speech acts performed at the moment of utterance. What is the "disapproval" doing inside the "if" clause?
      *   **Licenses Dismissal?** **No.** Recognizing the utterance *functions* to express disapproval doesn't preclude that it also *describes* something or that there's a genuine disagreement *about what the disapproval is responding to* (e.g., facts about suffering, fairness). Two people can disagree about whether an action *merits* disapproval.

  2.  **Psychological State Thesis:** Uttering "X is wrong" conventionally *expresses* the speaker's disapproval (or a related conative attitude like condemnation) towards X.
      *   **Status:** **Substantive and defensible (but incomplete).** This is a core claim of many expressivist/emotivist views. Moral judgments are seen as expressions of non-cognitive attitudes.
      *   **Embedded Contexts:** **Fails.** Similar to Thesis 1. When I utter the conditional "If lying is wrong...," I am *not* expressing my disapproval of lying at that moment. What psychological state is expressed by the unasserted antecedent "lying is wrong"? Expressivists need a special story (like "plan-laden" attitudes or minimal propositions) to handle this.
      *   **Licenses Dismissal?** **No.** Expressing different attitudes *is* a form of disagreement – a *clash of attitudes* or *disagreement in attitude*. While different from a factual disagreement ("disagreement in belief"), it's still a robust and significant form of conflict. Your TA's dismissal ignores this crucial distinction made by expressivists themselves (e.g., Stevenson, Blackburn). The disagreement is real, just not *descriptive*.

  3.  **Semantic Content Thesis (Non-Descriptivism):** The *meaning* (semantic content) of "X is wrong" is not primarily descriptive; it does not *state* a proposition that represents a state of affairs in the world (like "meat consumption is rising" does). Its meaning is tied to the expression of attitude.
      *   **Status:** **Substantive and defensible (core expressivist claim).** This distinguishes expressivism from descriptivist views (naturalism, non-naturalism). The sentence doesn't *refer to* or *describe* a property "wrongness" out in the world.
      *   **Embedded Contexts:** **Major Challenge (The Frege-Geach Problem).** This is the hardest test. If "lying is wrong" lacks standard propositional content (truth-apt, combinable logically), how can it function as the antecedent of a conditional, the object of denial, or a disjunct? Sophisticated expressivists (like Blackburn's *quasi-realism* or Gibbard's *norm-expressivism*) develop complex accounts using minimal propositions, inferential roles, or attitudes towards norms to solve this. Whether they *fully* succeed is highly debated but they take it seriously. It's not *trivial*.
      *   **Licenses Dismissal?** **No, or insufficiently.** Denying descriptive meaning doesn't automatically dissolve disagreement. Expressivists posit *disagreement in attitude*. Furthermore, the disagreement might involve underlying *descriptive* beliefs *about* the non-moral features that ground the moral judgment (e.g., facts about animal suffering, environmental impact, health). Your question about whether they disagree "about anything at all" remains pertinent – they disagree *in attitude* and likely *about the relevant non-moral facts*.

  4.  **Ontological Thesis (Anti-Realism):** There *are no* objective moral facts or properties in the world for moral sentences to correspond to or describe.
      *   **Status:** **Substantive and defensible (but distinct).** This is a *metaphysical* claim often *motivated* by expressivism, but logically distinct. Expressivism (Theses 1-3) is primarily a theory of meaning/psychology, anti-realism a theory of what exists. One *can* be an expressivist anti-realist (common), but expressivism doesn't *strictly entail* anti-realism (quasi-realists aim for realism *within* an expressivist framework), and anti-realism doesn't entail expressivism (e.g., error theory is descriptivist anti-realism).
      *   **Embedded Contexts:** **Neutral.** This thesis is about what exists, not directly about meaning or language use. It doesn't directly address the Frege-Geach problem.
      *   **Licenses Dismissal?** **Only partially and misleadingly.** If there are no moral facts, then the disagreement isn't *about moral facts*. However, this doesn't mean there's *no disagreement*. They still disagree *in attitude* (per expressivism) and likely *about the non-moral facts* that inform their attitudes (e.g., the sentience of animals, environmental consequences). Dismissing the disagreement entirely based *only* on this ontological claim oversimplifies.

  **The TA's Dismissal & Your Disagreement Case:**

  *   **What licenses the dismissal?** The TA needs **Thesis 4 (Anti-Realism)**, often conflated with or assumed by a strong reading of **Thesis 3 (Non-Descriptivism)**. Their dismissal ("not disagreeing about anything at all") implies there is *nothing objective* to disagree *about*. This requires denying the existence of moral facts.
  *   **Why it's problematic:**
      1.  **Ignores Disagreement in Attitude:** Even on a pure expressivist view (Theses 1-3), there *is* disagreement – a clash of conative attitudes (disapproval vs. approval/indifference). This is a real and important conflict.
      2.  **Ignores Descriptive Components:** Moral disagreements almost always involve disagreements about underlying *non-moral facts* (animal cognition, environmental science, health effects, cultural norms). Even if "wrong" expresses attitude, the judgment is typically *based on* beliefs about descriptive features. Your meat-eater and vegetarian disagree profoundly about the *reasons* for approval/disapproval.
      3.  **Overreach:** Conflating the *semantic* claim (Thesis 3) with the *ontological* claim (Thesis 4) and then using that to dismiss *all* forms of disagreement is a philosophical overstep. Quasi-realists, for instance, argue expressivism *can* accommodate "realist-sounding" discourse, including robust disagreement.
  *   **Your Embedded Case:** This powerfully highlights the weakness of the simplest "boo" model (Theses 1 & 2). The TA's one-liner cannot easily explain how moral terms function identically in asserted and unasserted contexts while preserving logical validity. Sophisticated expressivism (addressing Thesis 3) is required to even attempt an answer.

  **Conclusion:**

  Your TA's one-liner likely conflates several theses. The plausible core is that moral utterances *express non-cognitive attitudes* (Thesis 2) and their primary function is not *just* stating facts (Thesis 1). The stronger claim that they *lack descriptive meaning* (Thesis 3) is defensible but faces significant challenges with embedded contexts. The claim needed to dismiss your disagreement question entirely – that there are *no moral facts* (Thesis 4) – is a substantive ontological claim, not a trivial observation about language use.

  **Crucially, none of these theses, alone or combined, legitimately license the dismissal that there is "no disagreement about anything at all."** Expressivism itself posits "disagreement in attitude," and real-world moral disagreements involve clashes over the descriptive facts that ground moral evaluations. Your TA's dismissal oversimplifies complex metaethical issues. Your intuition about embedded contexts is an excellent objection to simplistic versions of the "boo" theory.
