     - **Prediction for nurses**: **Unjustified**. The raise benefits only the nurses, leaving the least advantaged patients and staff no better off. It fails the maximin test—no trickle-down to the worst-off.  

  2. **Rule B: Desert-Corrected Efficiency**  
     - **Core idea**: Rewards must be deserved (based on effort, sacrifice, or contribution) and efficient (not wasteful), but undeserved inequalities (e.g., from luck or bias) are unjust unless necessary to prevent harm.  
     - **Fits track record**:  
       - Case 1: Surgeons' pay is efficient (retains talent) and deserved (high skill), but the primary justification is preventing harm to the worst-off.  
