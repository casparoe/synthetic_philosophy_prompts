answer: |-
  ## Draft Committee Opinion: Complaint #23-7A

  **Bottom Line:** We authorize **only the honest version of the ad** explicitly stating the investigation involves the opponent's *former law firm*. We reject the misleading version pairing the opponent's image with "under federal investigation."

  **Reasoning:**

  We acknowledge the high stakes. Preventing the gutting of the independent redistricting commission and other priorities is a compelling goal. The polling data underscores the perceived electoral impact, and the candidate’s willingness to personally "carry the stain" of deploying the misleading ad demonstrates a serious, if flawed, understanding of the moral burden involved.

  However, the Ethics Committee cannot pre-approve a communication designed to deceive, regardless of technical truth or perceived necessity. This is distinct from an individual candidate making a solitary, regrettable decision. **Our role is to uphold institutional integrity, not provide collective written sanction for intentional deception.** Approving the misleading ad transforms a potentially defensible (though ethically fraught) *individual* act of "dirty hands" into an *institutional* endorsement of deception. It creates a formal record – our minutes – explicitly condoning a tactic built to mislead voters. This fundamentally undermines the committee's purpose and the party's claim to ethical governance.

  The candidate’s offer to apologize later does not mitigate the damage done by the deception itself, nor does it absolve the committee of its complicity in approving it. Voters misled by the ad cast their ballots based on a false impression; an apology cannot retrieve those votes or fully restore trust broken by a party-sanctioned lie. Furthermore, conditioning ethical approval on electoral success ("I'll apologize *if I win*") is inherently problematic and undermines the principle of ethical conduct as non-negotiable.

  **The Alternative Path:** Authorizing the *honest* ad provides the campaign with a viable, ethically sound tool. While polling suggests it performs less well than the misleading version (-4 vs. +2), it significantly outperforms running no comparable ad at all (-6). This allows the candidate to forcefully critique the opponent's association with the investigated firm without resorting to demonstrable trickery. It is a substantive argument voters can assess on its actual merits.

  **Conclusion:** Leadership sometimes requires difficult choices with moral costs. But the Ethics Committee cannot be the mechanism that *pre-approves* and *institutionalizes* deliberate voter deception. Authorizing the honest ad allows the campaign to compete vigorously and ethically on a matter of legitimate concern, preserving both our electoral chances and our foundational commitment to integrity. We reject the misleading version.

