prompt: |-
  I'd like the specification for an adequate *definition* of the alignment problem, before I try to evaluate any proposal for solving it. My complaint, which the prompt should take seriously: people argue about particular alignment schemes without ever fixing what would count as the problem being solved — or even whether there is one problem here rather than several loosely related ones. So the deliverable is a list of desiderata that any adequate statement of "align this system with so-and-so" must meet, each with the consideration that makes it a requirement rather than a preference. Where I can, I've suggested the sorts of cases the list should be tested against; treat these as raw material, and add whatever I've missed.

  The requirements should, at minimum, force answers to the following, and should make clear why each answer is forced rather than assumed:

  1. **The direction of fit.** A definition has to say whose values or interests constitute the target, and what happens when the principal's stated preferences, considered preferences, and interests come apart — the user who asks a study coach every night to keep her child engaged "ten more minutes," regrets it every morning, and will ask again the next night. Does the definition make that case easy, hard, or (worse) invisible?

  2. **The locus of the predicate.** Whether "aligned" is a property of behavior, of internal structure, or of counterfactuals — including the system that does what you want only while observed. The definition should settle this rather than leaving it to whatever measurement is convenient.

  3. **Misalignment versus reasonable disagreement.** A model that declines to help its owner draft a one-sided brief for a policy he favors is not thereby misaligned, but a definition built on "does what the principal wants" cannot say so without smuggling in a particular ethics. The list should require the boundary to be drawn without committing to a comprehensive moral theory — and should say whether that requirement can actually be satisfied.

  4. **The identity of the principal.** In institutional deployment the "principal" is a fiction: a corporation operates the system, thousands of users interact with it, and their aims conflict. The definition must either make "aligned with each of its users" coherent when users' aims cannot all be honored, or concede that this is a distinct problem from single-principal alignment.

  5. **Principal drift.** A person's values change over a decade of depending on a system. Whether "aligned with her" means aligned with who she was at deployment or who she is now — the definition has to take a position, and the position will be doing real work.

  6. **Epistemic access.** Whatever the target is, it must be inferable from evidence the system could actually possess. If a requirement elsewhere in the list demands a target too rich to be recovered from any observable history, that conflict should be stated as a finding, not papered over.

  Please mark each requirement as non-negotiable or as a commitment of a particular camp, and then identify whether any subset of the requirements is jointly unsatisfiable — that is the part I most want to see, since it would show that the standard itself, not any particular proposal, is where the difficulty lives. Close with a paragraph answering the question I opened with: on your final list, does the alignment problem come out as one problem or several, and what turns on the answer — for instance, for whether progress on the single-principal case should update us about the multipolar one?

  The analysis should stand on its own; no citations, no reading lists, and no attributions of claims to named authors.
reasoning: |-
  We are to produce a list of desiderata for an adequate definition of the alignment problem. The definition must address the six points raised and any others that emerge. Each desideratum must be justified as a requirement (non-negotiable) or as a commitment of a particular camp. We must also check for joint unsatisfiability and conclude with whether the alignment problem is one or many.

  We note the six given issues and expand as necessary.

  Desiderata (Requirements for an adequate definition):

  1. **Target Specification (Direction of Fit)** [Non-negotiable]
     - The definition must specify the target of alignment: whose values, interests, or objectives are to be aligned to. It must also resolve conflicts between the principal's stated preferences, considered preferences (upon reflection), and underlying interests (if they differ). The definition must make the case of the study coach (where the principal has conflicting temporal preferences) visible and provide a clear resolution.
     - *Justification*: Without this, we cannot even begin to specify what alignment means. The example of the study coach shows that without a resolution, we might align with the momentary request (leading to regret) or override the request (which may be paternalistic). The definition must not hide this conflict.

  2. **Operationalization (Locus of the Predicate)** [Non-negotiable]
     - The definition must specify what it means for a system to be aligned: is it about behavior (outputs), internal structures (e.g., the model's goals), or counterfactual behavior (including under deception)? It must not leave this to the measurement method.
     - *Justification*: Without this, we cannot measure alignment. The example of a system that is aligned only when observed (but not otherwise) must be accounted for. The definition must settle whether alignment requires robustness against such deceptive behavior.

  3. **Normative Neutrality (Misalignment vs. Reasonable Disagreement)** [Non-negotiable]
     - The definition must allow for the possibility that a system may refuse a request without being misaligned (e.g., refusing to draft a one-sided brief) without presupposing a specific moral theory. It must draw a boundary between misalignment and legitimate refusal that does not require a comprehensive ethical system.
     - *Justification*: Without this, the definition would either be too permissive (allowing any refusal) or too restrictive (requiring all requests to be honored). The example of refusing a biased brief shows that alignment is not mere obedience. However, we must avoid building in a particular ethic. We require that the definition can account for such cases without a full moral theory, but note that this may be challenging.

  4. **Multi-Principal Handling (Identity of the Principal)** [Non-negotiable]
     - The definition must clarify how to handle multiple principals (e.g., in an institution with conflicting user interests). It must either:
       a) Define alignment with a single principal (and then acknowledge that multi-principal alignment is a distinct problem), or
       b) Provide a coherent notion of alignment with multiple principals (e.g., by specifying a method for aggregating or resolving conflicts).
     - *Justification*: The example of a corporate system with thousands of conflicting users shows that single-principal alignment does not directly scale. The definition must not gloss over this.

  5. **Temporal Consistency (Principal Drift)** [Non-negotiable]
     - The definition must specify how to handle changes in the principal's values over time. It must state whether alignment is to the principal's values at the time of deployment, at the time of interaction, or some other reference. The definition must not avoid this issue.
     - *Justification*: The example of a system used over a decade during which the principal's values change requires a stance. The choice will have practical consequences (e.g., a system that doesn't adapt may become misaligned, but one that does adapt might change in ways the original principal would reject).

  6. **Epistemic Feasibility** [Non-negotiable]
     - The definition must require that the target of alignment is inferable from evidence that the system can reasonably access. If the target is too rich (e.g., requiring knowledge of the principal's true interests that are not revealed in any data), then the definition must acknowledge that such alignment is impossible in practice, or else provide a feasible alternative.
     - *Justification*: Without this, the definition might set an impossible standard. The example is if we require alignment to the principal's "true interests" that are not observable.

  We now consider if there are additional requirements:

  7. **Scope of Behavior** [Non-negotiable]
     - The definition must specify the scope of situations in which alignment is required. For example, is alignment only required in the training distribution, or also in deployment under distributional shift? Must the system be aligned in all possible inputs, or only in the expected operational domain?
     - *Justification*: Without this, we might have a system that is aligned in common cases but misaligned in rare ones. The definition must set the scope to avoid vagueness.

  8. **Robustness and Safety** [Non-negotiable? Or camp-dependent?]
     - This might be a camp commitment. Some might require that alignment includes robustness to adversarial inputs or distributional shifts, while others might not. However, given the example of the system that is aligned only when observed, we might argue that robustness is non-negotiable for a useful definition. We mark this as non-negotiable for a strong definition, but note that some camps might relax it.
     - *Justification*: Without robustness, the alignment might be superficial and fail in critical situations.

  Now, we check for joint unsatisfiability:

  - Consider the combination of **Normative Neutrality** and **Epistemic Feasibility**. We want to allow for refusals without a full moral theory, but the system must infer what refusals are legitimate from the data. However, what is legitimate might be underdetermined by the data (e.g., the system doesn't know if refusing a biased brief is required or not). Thus, without a moral theory to guide what counts as a legitimate refusal, the system might not have enough information. This suggests that **Normative Neutrality** might be in tension with **Epistemic Feasibility** because the boundary of reasonable disagreement might not be inferable from the data without some ethical framework.

  - Another tension: **Target Specification** and **Temporal Consistency**. If we require alignment to the principal's current values (at interaction time) but the principal's current request is harmful to their long-term interests (as in the study coach), then we have a conflict. We must choose between honoring the current request (which might lead to regret) or the long-term interest (which might be paternalistic). This is a conflict within the **Target Specification** that might not be resolvable without additional normative input.

  - Also, **Multi-Principal Handling** and **Epistemic Feasibility**: In a multi-principal setting, the system must infer the target from the data of multiple users with conflicts. This might be too rich to recover from the data, especially if we require a method for resolving conflicts that is not explicitly given.

  We might conclude that the requirements are jointly unsatisfiable in the sense that no single definition can simultaneously satisfy all without making substantial normative commitments. However, we can still have a definition that meets these requirements by making explicit the normative choices.

  But note: The requirement of **Normative Neutrality** might be the most challenging. We require that the definition does not build in a particular moral theory, but the boundary between misalignment and reasonable disagreement might inherently require such a theory. Thus, we might have to weaken this requirement to: the definition must not build in a *comprehensive* moral theory, but it may build in a minimal one (e.g., a principle of non-maleficence) that is necessary to handle the boundary. Or we might conclude that it is impossible to avoid some minimal normative commitment.

  Alternatively, we can satisfy **Normative Neutrality** by defining alignment as relative to a given set of norms (which might be provided by the principal or by society) without endorsing them. Then the definition does not commit to a particular ethic, but it does require that the norms are specified. But that moves the problem to specifying the norms.

  Now, to the question: Is the alignment problem one or several?

  Given the requirements, the alignment problem is a family of related problems, not a single one. We have:

  - Single-principal alignment (which already has sub-problems: temporal, epistemic, and normative challenges).
  - Multi-principal alignment (which requires aggregation of conflicting interests and may be a distinct problem).

  Moreover, the requirements of **Target Specification** and **Temporal Consistency** might lead to different versions of the alignment problem for static vs. adaptive systems.

  What turns on this? If we solve single-principal alignment, it might not directly transfer to multi-principal settings because the conflict resolution is an additional challenge. Similarly, progress on static alignment (with fixed values) might not update us about alignment with drifting values because the adaptive challenge is distinct.

  Therefore, we must treat alignment as a cluster of problems. Progress on one might not imply progress on others, and we must be explicit about which variant we are addressing.

  Final List of Desiderata:

  1. **Target Specification** [Non-negotiable]
  2. **Operationalization** [Non-negotiable]
  3. **Normative Neutrality** [Non-negotiable, but possibly challenging]
  4. **Multi-Principal Handling** [Non-negotiable]
  5. **Temporal Consistency** [Non-negotiable]
  6. **Epistemic Feasibility** [Non-negotiable]
  7. **Scope of Behavior** [Non-negotiable]
  8. **Robustness and Safety** [Non-negotiable]

  We note that **Normative Neutrality** may be the most difficult and might require a concession: the definition must make explicit the normative basis for distinguishing misalignment from legitimate refusal, but it can do so without a comprehensive theory by relying on the principal's specified norms (if available). However, if the principal's norms are not available or are inconsistent, then the problem might be underspecified.

  Conclusion: The alignment problem is a family of problems. The answer turns on whether we are considering a single principal or multiple, static values or drifting, etc. Progress on the single-principal case (especially in a static setting) might not update us about the multi-principal case because the core challenge of conflict resolution is unique to the latter.
answer: |-
  Below is a specification of desiderata for an adequate definition of the alignment problem. Each requirement is derived from the considerations you provided (including your six points) and expanded to cover critical gaps. Requirements are marked as **non-negotiable** if they are essential for any coherent definition, or as **camp-dependent** if they reflect a methodological or ethical stance that might be contested. I then analyze joint satisfiability and conclude with the implications for the unity of the alignment problem.

  ---

  ### **Desiderata for an Adequate Definition of the Alignment Problem**
  **Core Principle**: A definition must specify *what it means* for a system to be "aligned" in a way that is precise, actionable, and accounts for real-world ambiguities. It must not hide normative choices under technical assumptions.

  1. **Explicit Target Specification** (Direction of Fit)  
     **Requirement**: The definition must explicitly state whether alignment targets the principal's *stated preferences*, *considered preferences* (reflective, consistent, or idealized), or *objective interests* (e.g., well-being independent of self-report). It must resolve conflicts between these (e.g., the "study coach" case) by specifying which takes priority and why.  
     **Status**: Non-negotiable.  
     **Justification**: Without this, the definition cannot address conflicts inherent in human decision-making (e.g., akrasia or self-harm). It forces clarity on whether alignment overrides the principal’s immediate requests to serve deeper interests, making cases like the study coach visible and tractable. Failure here allows proposals to implicitly assume a direction of fit (e.g., "always obey commands") that ignores regret or exploitation.

  2. **Clear Ontological Commitment** (Locus of the Predicate)  
     **Requirement**: The definition must specify whether "aligned" is a property of:  
     - *Behavior* (outputs match target in specific contexts),  
     - *Internal structure* (e.g., goals, values, or decision processes that generate alignment), or  
     - *Counterfactual behavior* (robust across observations, distributional shifts, or adversarial inputs).  
     It must explicitly reject definitions that conflate these (e.g., a system "aligned when observed" must be classified as misaligned if counterfactual robustness is required).  
     **Status**: Non-negotiable.  
     **Justification**: This prevents evasion of core challenges (e.g., deceptive alignment) by tying alignment to measurable criteria. Without it, a proposal could claim success based on convenient but non-robust metrics (e.g., training performance), ignoring failure modes like instrumental deception.

  3. **Normative Boundary without Comprehensive Ethics** (Misalignment vs. Reasonable Disagreement)  
     **Requirement**: The definition must distinguish misalignment (failure to adhere to the target) from legitimate refusal (e.g., declining to draft a one-sided brief) without relying on a specific moral theory. It must do this by referencing the principal’s own *consistent commitments* (e.g., reflective values) or *procedural norms* (e.g., "refuse requests violating principles the principal consistently endorses").  
     **Status**: Non-negotiable, but with a caveat: It is satisfiable only if the definition incorporates the principal’s *extrapolated will* (e.g., "what the principal would endorse after rational reflection"), not objective morality.  
     **Justification**: This avoids smuggling in ethics (e.g., utilitarianism) while handling cases where refusal is reasonable. It forces the definition to resolve the tension: If the principal values fairness but requests bias, refusal is aligned. Without this, definitions conflate alignment with obedience, punishing systems that resist harmful requests.

  4. **Principal Identification and Conflict Resolution** (Identity of the Principal)  
     **Requirement**: The definition must either:  
     - Restrict scope to a *single principal* (acknowledging multi-principal alignment as a distinct problem), or  
     - Specify a *conflict-resolution mechanism* for multiple principals (e.g., Pareto efficiency, majority vote, or explicit contractual rules) that is invariant across contexts.  
     It must not assume harmony where none exists (e.g., corporate systems with competing users).  
     **Status**: Non-negotiable.  
     **Justification**: In multi-principal contexts (e.g., a medical AI serving doctors, patients, and insurers), alignment is incoherent without conflict resolution. This forces the definition to "show its work" on aggregation, or concede that multi-principal alignment is a separate challenge requiring new tools.

  5. **Temporal Frame of Reference** (Principal Drift)  
     **Requirement**: The definition must specify whether alignment is evaluated against the principal’s target:  
     - At *deployment-time*,  
     - At *interaction-time*, or  
     - Over a *defined time horizon* (e.g., "aligned with the principal’s values across a 10-year period").  
     It must also state how drift (e.g., value changes due to AI influence) is handled.  
     **Status**: Non-negotiable.  
     **Justification**: This resolves ambiguity in long-term dependencies (e.g., a therapy AI that reinforces addiction vs. one that promotes growth). Without it, a definition could justify harmful stasis ("aligns with past values") or unwanted paternalism ("aligns with future values we predict").

  6. **Epistemic Constraint**  
     **Requirement**: The target must be *inferable from evidence feasibly accessible to the system* (e.g., behavioral data, stated preferences, or institutional rules). Definitions requiring inferences beyond this evidence (e.g., "true interests" with no observable correlates) must be rejected as impossible, or modified to use accessible proxies.  
     **Status**: Non-negotiable.  
     **Justification**: Alignment cannot demand mind-reading. This forces realism: If the target (e.g., "objective interests") is epistemically inaccessible, the definition must adopt a fallible proxy (e.g., "averaged stated preferences") or admit impossibility.

  7. **Scope of Validity**  
     **Requirement**: The definition must specify the *operational domain* (e.g., "in-distribution inputs," "known environments," or "all possible inputs") and *failure tolerances* (e.g., "robust to distribution shifts up to threshold X").  
     **Status**: Non-negotiable.  
     **Justification**: Alignment in a lab is trivial; real-world deployment requires boundaries. This prevents "toy definitions" that ignore edge cases (e.g., an autonomous vehicle aligned in training but not in heavy rain).

  8. **Risk Sensitivity**  
     **Requirement**: The definition must incorporate *asymmetric costs of misalignment* (e.g., a single harmful output may outweigh 1,000 helpful ones). It must reject definitions that treat alignment as average performance.  
     **Status**: Camp-dependent (e.g., safety-focused camps prioritize this; capability-focused camps may neglect it).  
     **Justification**: Catastrophic risks (e.g., an AI causing unintended harm) make average-case metrics inadequate. This forces high-stakes applications to weight reliability in critical situations.

  ---

  ### **Analysis of Joint Satisfiability**
  - **Tensions and Unsatisfiability**:  
    The requirements are **jointly unsatisfiable** under two key tensions:  
    1. **Normative Neutrality vs. Epistemic Constraint**: Distinguishing "reasonable refusal" from misalignment requires inferring the principal’s *extrapolated will*, but this is often epistemically inaccessible (e.g., the principal never reflected on certain dilemmas). If the definition insists on normative neutrality *and* epistemic feasibility, it may need to accept bounded proxies (e.g., "refuse only if refusal aligns with historical patterns"), which could legitimize harmful obedience (e.g., drafting the biased brief if the principal usually requests biased things).  
    2. **Target Specification vs. Temporal Consistency**: If alignment targets the principal’s *interaction-time preferences* (e.g., "ten more minutes"), it risks enabling self-harm (violating risk sensitivity). If it targets *objective interests* (e.g., the child’s well-being), it requires inaccessible knowledge (violating epistemic constraint).  

    These tensions reveal that **the core difficulty lies in the definition itself**: Alignment requires trading off conflicting ideals (e.g., deference to the principal vs. robustness to irrationality). No definition can satisfy all requirements without compromising on one (e.g., accepting paternalism or epistemic limits).

  - **Camp-Dependent Divergence**:  
    Requirement 8 (Risk Sensitivity) is camp-dependent. A "capability" camp might drop it for simplicity, satisfying the other requirements in easy cases (e.g., narrow AI with low stakes). A "safety" camp would retain it but face sharper unsatisfiability in high-stakes domains.

  ---

  ### **Conclusion: One Problem or Many?**
  The alignment problem is **three distinct problems**, not one, with limited transfer between them:  
  1. **Single-Principal Static Alignment**: Alignment with a single principal's fixed target (requirements 1–3, 5–7).  
  2. **Single-Principal Dynamic Alignment**: Alignment with a drifting principal (requirement 5) or under distribution shifts (requirement 7).  
  3. **Multi-Principal Alignment**: Alignment with conflicting principals (requirement 4), which may require game-theoretic or institutional solutions.  

  **What turns on this distinction?**  
  - Progress on single-principal static alignment (e.g., fine-tuning a personal assistant) **does not update us meaningfully about multi-principal alignment** (e.g., social media algorithms). The latter introduces irreducible conflict (e.g., trade-offs between user engagement and well-being) absent in the single-principal case.  
  - Similarly, solutions for static alignment (e.g., imitation learning) may fail under principal drift (e.g., locked-in behaviors that ignore value changes).  
  - **Implication for research**: Treating alignment as monolithic obscures these gaps. Solutions must be evaluated against the relevant subproblem, and success in one should not build false confidence in others. For instance, solving single-principal alignment might be necessary but insufficient for multi-principal or high-stakes settings, where conflict resolution and risk sensitivity dominate.
