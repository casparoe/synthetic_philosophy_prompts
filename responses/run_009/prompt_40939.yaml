prompt: |-
  I teach an evening course in introductory epistemology at a community college — eighteen adult students, most of them with no prior philosophy, and one 75-minute session to spend on a single question I want them to actually feel rather than take notes on: why should knowledge be worth more than a true belief that gets you exactly the same result? Before we read anything, I want them to run into the gap between having a correct answer and having a justified, stable, re-derivable one, and to discover for themselves that the two come apart precisely when something goes wrong. My rough idea is a navigation or wayfinding scenario — the ancient version of this puzzle involves asking whether a guide who genuinely knows the road and a guide who merely has a correct opinion about it both get you to your destination equally well — but I'm open to any concrete setup that does the job. What matters is that the value of knowledge shows up as something participants experience in their choices and their outcomes, not something I assert in a wrap-up lecture.

  Please design the full activity: the setting (a staged map-based scenario, a building-based task, or something else you can justify), the exact rules, the materials (index cards, handouts, whatever), a timeline for the 75 minutes including any setup I can do beforehand, and a payoff or point scheme that creates real but small stakes without money. Crucially, build in a perturbation round — some way of breaking the environment after participants have committed to a route or method, so that those who merely memorized a correct instruction and those who understood why the instruction works get separated by events rather than by my grading. Do not have the facilitator name the historical problem or its source at any point during the activity; the name should only surface in the debrief, along with the connection to the original example of travelers and a destination.

  For the debrief, map specific moments in the activity onto the philosophical distinction: which features of the participants' situations correspond to justification, reliability, and the ability to re-derive; and say plainly what the strongest objection is — namely, that the activity only shows knowledge being instrumentally more useful, which doesn't yet settle whether knowledge is intrinsically more valuable than true belief. Also include an honest section on what will predictably go wrong the first time I run this (participants conferring when they shouldn't, someone recognizing the puzzle from elsewhere, the perturbation being too easy to reason around) with concrete handling suggestions, and a frank note on which part of the philosophical problem no in-class activity can reproduce, so I know what I'll have to supply by direct argument afterwards.
reasoning: |-
  Okay, let me tackle this epistemology activity design. The professor wants students to experience why knowledge is more valuable than mere true belief through a hands-on exercise, without just lecturing about it. 

  Hmm, the core challenge is creating a scenario where memorization fails but understanding persists when conditions change. A navigation task makes sense - it's concrete and the "perturbation" can naturally break memorized routes. I'm imagining a campus map with multiple paths to a destination, where the twist comes from blocked paths or changed landmarks.

  For materials, printed maps seem essential - maybe simplified campus maps showing buildings and paths. Index cards could work for secret route instructions. The professor mentioned no money for incentives, so perhaps points toward participation grade? Small groups of 3 would encourage discussion while keeping individuals engaged.

  The timeline needs careful planning: 15 min intro and individual memorization, 25 min for the first navigation round, then introduce the perturbation (like blocked paths), another 15 min for rerouting, and finally 20 min debrief. The key is ensuring the perturbation forces those with mere true belief to fail while knowledgeable students adapt.

  During debrief, I should explicitly connect:
  - Justification → Why they chose initial paths
  - Reliability → Consistency in reaching destination
  - Re-derivability → How they adapted after perturbation
  But must also acknowledge the limitation - this only shows instrumental value, not intrinsic worth. Some students might recognize this as Meno's paradox, so the professor should be ready to handle that.

  Potential pitfalls: Students sharing answers during individual work, or the perturbation being too easy. Countermeasures: Clear rules about silence during memorization, and testing the map disruptions beforehand. The intrinsic value question can't be demonstrated through activity alone - that'll need direct argumentation later.
answer: |-
  Here’s a complete, experiential activity designed for your goals—**"The Campus Courier Challenge"**—using a perturbation to separate knowledge from true belief through wayfinding. Total time: **75 minutes**.

  ---

  ### **Activity Overview**  
  **Core Setup**: Students are "campus couriers" delivering packages. Half receive *memorized instructions* (true belief), half receive *procedures + reasoning* (knowledge). A mid-activity "construction shutdown" blocks key paths, forcing adaptation. Groups with understanding reroute; those without fail.  

  **Philosophical Target**:  
  - **Justification** = Understanding *why* a route works.  
  - **Reliability** = Success pre/post-perturbation.  
  - **Re-derivability** = Adapting when original path fails.  

  ---

  ### **Materials & Prep**  
  **Before Class** (30 min setup):  
  1. **Simplified Campus Maps** (18 copies):  
     - Hand-drawn or digital, showing 5 buildings (A–E) and 3 paths between them (e.g., "Garden Path," "Library Walk," "Science Quad").  
     - Include 2 "hidden" shortcuts (e.g., "Stairwell X," "Alley Y").  
     - *Example*:  
       ```  
       A (Start) → Path 1 → B → Path 2 → C (Goal)  
                 ↘ Path 3 → D → Shortcut → C  
       ```  
  2. **Instruction Cards** (9 sets of 2 cards):  
     - **True Belief (TB) Cards**: *"Take Path 1 to B, then Path 2 to C. Do not deviate."*  
     - **Knowledge (K) Cards**: *"Go to C via B. Why? Path 1 is shortest from A→B. Path 2 avoids crowds before 5 PM. If blocked, check for shortcuts near D."*  
  3. **"Construction Shutdown" Signs**: 2 large signs blocking Path 2 and Path 3 on the map.  
  4. **Scoring Tokens**: Stickers or tokens for successful deliveries (1 token = 0.1% extra credit).  

  ---

  ### **Rules & Timeline**  
  **Phase 1: Setup & First Delivery** (25 min)  
  1. **Intro** (5 min):  
     - *"You’re couriers racing to deliver packages from Building A to C. Fastest successful delivery earns tokens. You may only use your assigned instructions and map."*  
  2. **Assign Roles** (5 min):  
     - Pair students (9 pairs). Randomly give 4 pairs **TB Cards**, 5 pairs **K Cards**. *Do not reveal the difference*.  
  3. **First Delivery** (15 min):  
     - Pairs plan routes using cards/maps. **No conferring between pairs**.  
     - Facilitator checks deliveries: All reach C easily (TB and K both succeed).  

  **Phase 2: Perturbation & Adaptation** (25 min)  
  1. **Introduce "Construction"** (5 min):  
     - Post "Construction Shutdown" signs: *"Path 2 and Path 3 CLOSED until further notice."*  
  2. **Second Delivery** (20 min):  
     - New package: A → C (same destination, blocked paths).  
     - *Observe*:  
       - TB pairs panic—their instructions are obsolete.  
       - K pairs use reasoning (e.g., *"Shortcut near D avoids Path 2/3"*).  
     - Successful pairs report route to facilitator for tokens.  

  **Phase 3: Debrief & Philosophy Link** (25 min)  
  1. **Reveal the Divide** (10 min):  
     - Ask: *"Who failed the second delivery? Why?"* TB groups confess: *"Our instructions broke."*  
     - Ask K groups: *"How did you adapt?"* Highlight phrases like *"We knew why the old path worked, so we found an alternative."*  
  2. **Map to Epistemology** (10 min):  
     - **Justification**: "Your *reasoning* for choosing paths (e.g., ‘shortest route’)."  
     - **Reliability**: "Reaching C *consistently*, even after construction."  
     - **Re-derivability**: "Creating a new route *because you understood the principles*."  
     - **Gap**: "TB had the *right answer* but couldn’t *recreate* it when conditions changed."  
  3. **The Limitation & Historical Link** (5 min):  
     - *"This shows knowledge’s *instrumental* value. But is it *intrinsically* better? Maybe not—a true belief that *never* fails would be as good. That’s Plato’s *Meno* puzzle: Why is knowledge superior to true opinion?"*  
     - Show the original: *"A traveler with knowledge vs. true opinion both reach Thebes... until roads change."*  

  ---

  ### **Predicted Problems & Fixes**  
  1. **Problem**: Pairs share answers during Phase 1.  
     - **Fix**: Assign "route monitors" (rotate observers) or separate groups to corners.  
  2. **Problem**: Someone recognizes the *Meno* puzzle.  
     - **Fix**: Acknowledge post-activity: *"Yes, this is a modern *Meno*. Now let’s see how *you* experience it."*  
  3. **Problem**: Perturbation is too easy (e.g., K groups guess shortcuts randomly).  
     - **Fix**: Make shortcuts subtle (e.g., "Alley Y" only visible if you know to check near D).  
  4. **Problem**: TB groups get lucky post-perturbation.  
     - **Fix**: Add a third round (e.g., "Fog" obscuring landmarks) to stress-test re-derivability.  

  ---

  ### **What the Activity Can’t Do**  
  - **Intrinsic Value Gap**: No activity can prove knowledge is *inherently* superior—only that it’s *instrumentally* useful. You’ll need to argue:  
    - *"If true beliefs are unstable (like in the activity), they’re unreliable. But even if they *were* stable, knowledge involves *understanding*—which has value beyond utility (e.g., appreciation of truth)."*  
    - Use post-activity reading (e.g., *Meno* 97a–98b) to deepen this.  

  ---

  ### **Why This Works**  
  - **Stakes**: Tokens create mild tension; failure feels tangible when routes collapse.  
  - **Perturbation**: The "construction" forces the gap open *empirically*.  
  - **Debrief**: Students *self-report* why knowledge won—you merely scaffold the philosophy.  

  This mirrors the *Meno* dynamically: True belief works... until the world changes. The rest is philosophy.
