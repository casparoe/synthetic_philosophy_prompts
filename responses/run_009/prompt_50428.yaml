prompt: |-
  The persistence debate has been running in roughly its modern form since the 1980s: perdurantists hold that we persist by having temporal parts, much as a road extends by having spatial parts, while endurantists hold that we are wholly present whenever we exist — with the worm/stage dispute a further split among perdurantists over which temporal part deserves the name "you." The stock moves are all decades old: the argument from temporary intrinsics, the counting objections about how many things occupy this chair, the duplication worry that if nothing stops an object being wholly present on many occasions then nothing stops a statue and its clay being distinct but coincident, and the relativistic argument that different slicing conventions hand different observers different temporal parts. As far as I can tell, nobody has changed sides over an argument in twenty years. My hypothesis is that the camps are divided less about persistence than about what a metaphysical explanation is permitted to do — that many endurantists are really rejecting the whole Lewisian package (four-dimensionalism, counterpart theory, liberal composition) and the perdurantists' arguments mostly pressure that package rather than endurance itself. Is that right? Or is the standoff verbal, a hidden disagreement about the semantics of tensed identity statements, or a genuine substantive one where the arguments do real work and the sides simply weigh them differently? Diagnose what kind of disagreement this is, using what each side actually argues, and tell me what — a new distinction, a result from relativity or mereology, a semantics for tensed predication — would count as progress, or why none should be expected.

  Present the diagnosis as exactly five numbered claims, each a sentence or two, with no introduction or conclusion.
