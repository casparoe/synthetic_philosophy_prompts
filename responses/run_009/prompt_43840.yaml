     - If she chooses E, she exits and gets 4.

  The driver is "absent-minded": she does not remember previous actions and cannot tell whether she is at S1 or S2. Therefore, the observation function is constant: O at both S1 and S2.

  The driver uses a memoryless policy: at each intersection (when she observes O), she chooses to continue with probability p and exit with probability 1-p.

  We are to find the optimal p.

