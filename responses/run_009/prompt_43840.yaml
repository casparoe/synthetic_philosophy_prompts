  ### Residue Report: What Doesn't Map Cleanly
  #### 1. **Policy Optimization vs. Greedy Action Selection**  
  - **Your Suspicion Confirmed**: The ex ante policy search (\(p^* = \frac{2}{3}\)) is optimal. The "paradox" assumes myopic action-selection at a node is meaningful, but in POMDPs, we optimize over policies (programs), not actions at states.  
  - **Residue**: Philosophers conflate:  
    - *Ex ante policy evaluation* (global optimization).  
    - *Online action selection* (local Q-max with fixed future policy).  
    - *Online policy modification* (changing \(\pi\) mid-trajectory).  
    The last is ill-posed without specifying how beliefs update under policy change.  

  #### 2. **Self-Referential Beliefs**  
  - **POMDP View**: Beliefs depend on the policy; it's computational, not metaphysical. Update \(b\) given a fixed \(\pi\) (even if \(\pi\) is stochastic).  
  - **Residue**: Philosophers treat "what should I believe?" as a foundational puzzle. Your toolkit answers: "Beliefs are \(b(s) = \mathbb{P}(s \mid \text{obs}, \pi)\); compute and proceed."  

  #### 3. **The Node's "Standpoint"**  
  - **Irreducible Residue**: Philosophers insist the driver "should" recompute at the node, ignoring that:  
    - Beliefs require assuming a policy.  
    - Deviations affect future states identically (absent-mindedness).  
  - **Your Toolkit Lacks**: A decision-theoretic primitive for "I am at a node now, and my choice affects my future self identically." POMDPs handle this via policy optimization (ex ante) or belief-Q evaluation (online with fixed \(\pi\)).  

  #### 4. **Substantive vs. Ill-Posed Questions**  
  - **Clean Mapping**:  
    - Ex ante optimal policy: \(p^* = \frac{2}{3}\).  
    - Belief at node: \(b(S_1) = \frac{3}{5}\), \(b(S_2) = \frac{2}{5}\) under \(p^*\).  
    - Q-values: Indifference at node.  
  - **Distorted/Ill-Posed**:  
    - "What should she do at the node?" → Answered by policy execution.  
    - "Should she update beliefs based on her own action?" → Self-cancelling (if she exits, no future; if continues, belief already accounts for it).  

