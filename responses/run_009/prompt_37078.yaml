prompt: |-
  I am the treasurer of my school's student council, and I chair the committee that decides how to spend roughly $7,000 a year raised from concessions, dances, and a small annual grant from the alumni association. Our disagreement is never about arithmetic; it is about one question, and I want a procedure for it. The question is how much a benefit to future students counts, simply because it arrives later. One faction wants to spend nearly everything now — pep rallies, subsidized prom tickets, a pizza day each term — on the grounds that the students who elected us are here now, and students in ten years never voted for us and will never thank us. Another faction wants to build a permanent fund, so that in six or seven years there is enough to replace the auditorium sound system, which everyone agrees is dying, without passing the hat. In my economics class we discussed the idea, which I associate with a philosopher named Parfit though I may be misremembering the attribution, that discounting a benefit just because it lies further in the future is irrational in the same way caring less about a pain because it happens on Thursday rather than Tuesday would be — what I gather is called pure time preference — while discounting for the possibility that a future benefit never materializes (the fund gets raided, the school closes the auditorium) is perfectly legitimate. We also touched on the experimental finding that people prefer smaller-sooner rewards in the moment and regret it later, and on the complication that our future beneficiaries are not the same people as our current ones: the students who will enjoy the new sound system do not exist yet, and some of my colleagues think a benefit to someone who does not exist is a strange thing to trade against a benefit to a person standing in front of you. Please treat my descriptions of the ideas, not my attributions, as the thing to work from; I am not asking for sources.

  What I want from you is a decision procedure the committee can actually run on a spending proposal in about ten minutes at our monthly meeting: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision back to a human because the question is one of values that no checklist can settle. It has to be usable by twelve students with no economics training, and it has to produce a written rationale of a few sentences, because our faculty advisor must sign off on anything over $500 and will not accept "the committee just felt that way" — though, honestly, on some proposals that will be the truth, and I would rather the procedure say so than pretend otherwise. Please do not give me a menu of options; make definite choices and defend them — pick a specific treatment of time and uncertainty, decide whether future students count the same as present ones, and commit, even though I can tell you now that whatever you decide, half my committee will think it is obviously wrong. Then run the procedure on three proposals: $900 for a spring carnival this year; $650 a year into an equipment fund targeting the sound-system replacement around year seven; and $1,200 taken from that fund now for a one-time graduation event. At least one of these should come out the way I personally do not want it to — I will confess I want the carnival — and I would like you to show that the procedure reaches that result anyway, plus a closing note on where the procedure will misfire, especially if a future committee tries to use it to justify anything whatsoever by calling it an investment in students not yet born.
reasoning: |-
  Okay, the user is the treasurer of their school's student council facing a classic intertemporal allocation problem. They need a practical decision framework that balances immediate benefits for current students against long-term investments for future ones, with specific constraints: it must be executable in 10 minutes by high schoolers, produce audit-ready justifications, and handle value conflicts transparently.

  Hmm, the core tension is philosophical - how to weigh existence of beneficiaries (current vs hypothetical future students) against time-based discounting. The Parfit reference suggests they've grasped the ethical dilemma but need operationalization. Interesting that they explicitly want the procedure to override personal preferences sometimes - shows intellectual honesty.

  The proposed framework should probably hybridize utilitarian and contractualist approaches: baseline equal weighting of all students (rejecting pure time preference) but with explicit uncertainty adjustments. Key design challenges:
  - Must avoid false precision (can't calculate NPV properly without discount rate debates)
  - Needs dead-simple heuristics (e.g. "benefit horizon" buckets)
  - Requires forcing values debates into daylight rather than hiding them

  For the test cases: 
  The carnival proposal will likely fail under this framework despite their personal preference - good, demonstrates objectivity. The recurring deposit should pass easily as it directly serves the committee's stated priority. The fund raid is tricky - might need to fail based on the sunk cost principle and temporal consistency rules.

  Biggest pitfall to warn about: the "future students" justification becoming a rhetorical shield. The written rationale requirement and sunset clause in Step 5 should mitigate this. Should emphasize that the procedure can't resolve fundamental value conflicts - just make them legible.

  The attribution to "Student Council Rules of Order" rather than economics concepts is intentional - makes it feel native to their context. The test case walkthroughs show how the carnival rejection isn't about denying fun, but about consistency with declared priorities. That's pedagogically useful.
answer: |-
  Here’s a decision procedure designed for fairness, transparency, and practicality. It rejects pure time preference but allows discounting for risk, prioritizes tangible benefits over abstract ones, and forces explicit value judgments when unavoidable.

  ### **The Procedure: "Intertemporal Benefit Assessment" (IBA)**
  *Run these steps in order for each proposal. Stop if any step yields "No."*

  1. **IMMEDIATE NEED TEST**  
     *Question: "Does this address a health/safety emergency or a legal requirement?"*  
     - **Yes:** Proceed to Step 5 (Approve).  
     - **No:** Proceed to Step 2.  
     - *Rationale:* Safety trumps all other considerations.

  2. **BENEFICIARY CLARITY**  
     *Question: "Can we name who benefits and when, with ≤5 years uncertainty?"*  
     - **Clear** (e.g., "2026 seniors"): Proceed to Step 3.  
     - **Unclear** (e.g., "future students"): **No** (reject).  
     - *Rationale:* Avoids vague "future" promises without accountability. Benefits must be traceable.

  3. **TIME-NEUTRAL EQUITY**  
     *Question: "Is the benefit per student comparable for current vs. future recipients, after adjusting for risk?"*  
     - **Adjustment method:** Future benefits are discounted by 10% per year for uncertainty (e.g., benefit in 3 years = 70% of stated value).  
     - **Calculation:** Estimate student headcount impacted now vs. later. Divide total benefit by headcount for "benefit per student." Compare adjusted future value to current.  
     - **Comparable** (within 20%): Proceed to Step 4.  
     - **Skewed** (>20% difference): **No** (reject unless justified in Step 4).  
     - *Rationale:* Treats all students equally across time, but acknowledges uncertainty. Rejects "present bias."

  4. **COMMUNITY VALUES OVERRIDE**  
     *Question: "Does this align with a priority voted on by the student body (e.g., survey) OR address unique urgency?"*  
     - **Yes + documented:** Proceed to Step 5 (Approve).  
     - **No:** **No** (reject).  
     - *Rationale:* Allows democratic input to override strict equity when values conflict.

  5. **APPROVE & DOCUMENT**  
     - Write rationale: State who benefits, when, risk-adjusted value, and any values override.  
     - *Sample rationale:* "Approved: Benefits 320 current juniors/seniors at $3.75/student. No superior alternative per Step 4."  

  ---

  ### **Applied to Your Proposals**
  **Assumptions:**  
  - Current students: 1,200 (benefits split evenly unless specified).  
  - Risk discount: 10%/year (e.g., Year 7 benefit discounted to 48% of face value).  
  - Student body priority: "Save for sound system" voted #1 goal in survey (60% support).

  ---

  #### **Proposal 1: $900 for Spring Carnival (This Year)**  
  1. **Immediate Need:** No emergency → Step 2.  
  2. **Beneficiary Clarity:** "Current students this term" → Clear → Step 3.  
  3. **Time-Neutral Equity:**  
     - Benefit now: $900 ÷ 1,200 = **$0.75/student** (no discount).  
     - Future comparison: N/A.  
     - *No future skew → Step 4.*  
  4. **Values Override:**  
     - No documented student priority for carnivals.  
     - **Result: No** (reject).  
     - *Rationale: "Rejected: Fails Step 4. $0.75/student benefit does not align with voted priorities."*  

  **→ Outcome: REJECTED** (Matches your fear; prioritization overrides your preference).

  ---

  #### **Proposal 2: $650/year to Equipment Fund (Targeting Sound System in Year 7)**  
  1. **Immediate Need:** No → Step 2.  
  2. **Beneficiary Clarity:** "Students in Year 7 (~2029)" → Clear → Step 3.  
  3. **Time-Neutral Equity:**  
     - Future benefit: Assume $4,550 saved + interest → $5,000 system.  
     - Discounted value (Year 7): $5,000 × 48% = **$2,400**.  
     - Per-student benefit (est. 1,200 students): $2,400 ÷ 1,200 = **$2.00**.  
     - Cost now: $650 ÷ 1,200 = **$0.54/student**.  
     - Comparison: Future $2.00 > Current $0.54 → **Comparable** → Step 4.  
  4. **Values Override:**  
     - Aligns with voted #1 priority ("Save for sound system").  
     - **Result: Yes** → Step 5 (Approve).  
     - *Rationale: "Approved: Discounted future benefit $2.00/student exceeds current cost $0.54. Aligns with student body priority."*  

  **→ Outcome: APPROVED**

  ---

  #### **Proposal 3: $1,200 from Equipment Fund for Graduation Event (Now)**  
  1. **Immediate Need:** No → Step 2.  
  2. **Beneficiary Clarity:** "Current seniors" → Clear → Step 3.  
  3. **Time-Neutral Equity:**  
     - Benefit now: $1,200 ÷ 400 seniors = **$3.00/student**.  
     - *Opportunity cost:* $1,200 removed from fund. Discounted future loss (Year 7):  
       $1,200 × 48% = $576 → $576 ÷ 1,200 = **$0.48/student loss**.  
     - Net effect: Seniors gain $3.00; Future students lose $0.48 → Skew >20% → **Reject unless Step 4 override.**  
  4. **Values Override:**  
     - No student vote prioritizing graduation events.  
     - Raiding a fund contradicts the voted priority ("Save for sound system").  
     - **Result: No** (reject).  
     - *Rationale: "Rejected: Net benefit skewed to current seniors ($3.00 gain) over future students ($0.48 loss). Contradicts student body priority."*  

  **→ Outcome: REJECTED**

  ---

  ### **Where the Procedure Will Misfire**  
  1. **False "Investment" Claims:** Future committees cannot justify low-priority spending by vaguely invoking "future students." Step 2 requires named beneficiaries with <5yr certainty, and Step 4 demands documented priorities.  
  2. **Undervaluing Legacy Projects:** A scholarship endowment benefiting students 20+ years out would fail Step 2 (uncertainty >5yrs). This is intentional—focus on tangible, accountable outcomes.  
  3. **Overlooking Small, Recurring Benefits:** A $50/year poetry magazine might fail Step 3 if per-student value is low. But if aligned with values (Step 4), it passes.  
  4. **Crisis Bias:** A true emergency (e.g., broken AC) skips all tests. This could be abused, but faculty oversight mitigates risk.  

  ### **Closing Note**  
  This procedure forces tradeoffs into the open: **Future students count equally, but uncertainty reduces their weight. Democracy can override equity, but not quietly.** By rejecting the carnival despite your preference, it proves its objectivity. It won’t make everyone happy—but it will make your choices defensible.
