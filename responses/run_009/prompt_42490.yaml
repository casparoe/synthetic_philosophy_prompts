prompt: |-
  I run a philosophy of biology seminar for grad students and advanced undergrads, and this spring I want to break our usual routine. Every time we do the units of selection debate, we end up doing the same museum tour: Dawkins's gene-level bookkeeping, group selection's death and rehabilitation, kin selection and inclusive fitness, Okasha on evolutionary transitions, Godfrey-Smith on Darwinian populations. It's all good material but the students come away thinking the interesting stuff ended sometime around 2010, and I half suspect that's true and half suspect it's very far from true. So instead of another survey, I want the seminar to actually pick one or two open questions and work on them for real — a dozen students, one semester, only a couple of them with any real population genetics chops (there's one grad student whose actually comfortable with the Price equation, the rest are armchair types like me).

  Help me build that agenda. What are the genuinely unresolved questions in this literature right now, and which two or three should we prioritize? Candidates I'm considering include: whether the kin selection / multilevel selection "equivalence" results show the two frameworks are just notational variants or whether one of them carves the causal structure better; whether the "bookkeeping" arguments for genic selection ever establish more than an accounting convention, and whether accounting conventions can themselves matter scientifically; how far the evolutionary-transitions framework stretches when you push it past organisms — to cancer lineages within a body, to clonal selection in the immune system, to gene drives that hijack meiosis; and whether Godfrey-Smith's idea of ranking populations on a continuum of "Darwinianness" actually dissolves the units question or just restates it more vaguely. Feel free to add things I'm not listing, and to tell me which of my candidates are effectively settled or were never really open in the first place.

  Defend the ordering — I care more about the reasoning than the list. What makes a question worth a semester of mostly non-mathematical philosophy students: is it upstream of the others, is it tractable without heavy formal machinery, has it been neglected while everyone relitigates the same Dawkins-vs-Gould stuff? And where would you say a question looks open but is really just ambiguous words? One more thing: at the end, tell me straight how confident you are in the ranking, and single out the point you'd be least surprised to find out you got wrong — I don't want to march my students into a question that some paper I haven't read already put to bed.
reasoning: |-
  Okay, I need to help a professor design a philosophy of biology seminar focused on unresolved questions in the units of selection debate. They want to move beyond the standard survey approach and dive deep into one or two open problems. Let me unpack their requirements carefully.

  The user describes their current seminar as a "museum tour" covering classics like Dawkins, group selection revival, Okasha, and Godfrey-Smith. Students feel the field stagnated around 2010, but the professor suspects otherwise. The challenge is to select fresh, tractable questions for non-mathematical students while avoiding settled or pseudo-problems.

  Looking at their candidate topics:
  - Kin vs multilevel selection "equivalence": Is this substantive or notational?
  - Genic selection "bookkeeping": Does accounting convention carry scientific weight?
  - Evolutionary transitions extensions: Cancer, immune systems, gene drives
  - Godfrey-Smith's "Darwinianness" continuum: Does it clarify or obscure units?

  I should evaluate which are genuinely open and pedagogically viable. The cohort has only one student comfortable with Price equation, so heavy math is out. The questions must reward philosophical analysis - conceptual clarity, causal reasoning, explanatory power debates.

  First, the kin/multilevel equivalence debate feels like a false lead. The technical equivalence is mathematically established (Gardner papers), leaving only interpretive differences. Not worth a semester.

  Gene drives are hot - CRISPR makes them experimentally relevant. The hijacking-of-meiosis aspect directly challenges traditional units frameworks. Cancer and immune systems are important but may require more specialized biology knowledge.

  Godfrey-Smith's continuum concept is philosophically rich but might be too abstract. Its vagueness could frustrate students expecting clear answers.

  The genic selection bookkeeping question seems fundamental yet accessible. It connects directly to Dawkins while opening modern debates about causal vs statistical explanation - perfect for armchair analysis. Papers by Okasha and Waters could anchor this.

  For the second slot, evolutionary transitions beyond organisms feels urgent. Gene drives exemplify engineered transitions, creating new ethical dimensions students would engage with. Literature by Bourrat, Chiu, and O'Malley provides fresh perspectives.

  I'm confident in prioritizing genic selection debates first - they're foundational. Evolutionary transitions second, with gene drives as the flagship case. Less sure about including cancer/immune systems broadly; better to focus narrowly on gene drives as the most disruptive example.

  Should flag that Bourrat's hierarchical expansion of Darwinian populations (2021) might intersect with Godfrey-Smith in ways I haven't fully traced. That's the point where I'd be least surprised to find new resolutions.
answer: |-
  Based on your goals and constraints, here's a prioritized agenda tackling genuinely unresolved questions that are philosophically rich, accessible without heavy math, and actively debated post-2010. I've ranked them by **philosophical traction, current activity, and suitability for your cohort**, with detailed reasoning:

  ### Top 2 Questions for a Semester-Long Deep Dive:
  1.  **Do "Bookkeeping" Arguments for Genic Selection Reveal Anything Beyond a Convention? And Can Accounting Conventions *Matter* Scientifically?**
      *   **Why Prioritize This?**
          *   **Upstream & Foundational:** This cuts to the core of *what an explanation in evolutionary biology actually is*. It directly challenges the "museum piece" status of Dawkins. Is gene-centeredness a profound ontological insight or just a useful calculational tool? This question underpins debates about causality, parsimony, and explanatory goals across the entire field.
          *   **Tractable & Armchair-Friendly:** Debates revolve around interpretation, conceptual analysis, and scientific practice rather than complex modeling. Key readings involve philosophers dissecting biological arguments (e.g., Waters on causal roles, Okasha on parsimony vs. causality, Sterelny & Kitcher's classic critique, newer work by Lynch or Bourrat challenging the necessity of the gene's-eye view). The Price Equation can be introduced conceptually as the *tool* whose *interpretation* is contested.
          *   **Currently Active & Unsettled:** While the *mathematical* equivalence of perspectives is established (Price equation), the *philosophical implications* are not. Recent work questions whether gene-centric models truly capture causal processes in development, epigenetics, or complex traits (e.g., debates around "causal parity" or "developmental systems theory" resurfacing in new contexts). The question "*Can conventions matter?*" is wide open – does adopting a gene-centric lens *generate* novel predictions, shape experimental design, or obscure important levels? (See work on CRISPR gene drives as a *test case* of the gene's-eye view in action).
          *   **Avoids Relitigation Trap:** Moves beyond "Dawkins vs. Gould" to ask *why* we frame explanations the way we do and what work those frames do.
      *   **Semester Structure:**
          *   Weeks 1-3: Foundational Arguments (Dawkins, Williams, Sterelny & Kitcher critique).
          *   Weeks 4-6: The Price Equation & Equivalence Debates (Conceptual intro to Price, Waters "Causal Roles", Okasha on Parsimony vs. Causality).
          *   Weeks 7-9: Do Conventions Matter? (Case studies: gene drives, genomic conflict, CRISPR applications; critiques from Evo-Devo/DST perspectives).
          *   Weeks 10-12: Synthesis & Future – Is "The Gene" still the mandatory ledger? Alternatives? Implications for explanation.

  2.  **How Far Can the Evolutionary-Transitions Framework Stretch? Testing its Limits (Focus: Gene Drives & Engineered Evolution).**
      *   **Why Prioritize This?**
          *   **Cutting-Edge & Concrete:** This moves decisively beyond the "museum" and classic transitions (genes -> cells -> organisms -> groups). Gene drives (especially using CRISPR) are a *real-time, human-engineered* attempt to create a new unit of selection/hierarchy. They directly challenge traditional definitions by "hijacking meiosis" and potentially creating selfish lineages *within* a species. This provides an incredibly tangible, contemporary case study.
          *   **Philosophically Demanding:** Forces students to grapple with core concepts: What defines a "unit"? How does agency/intention (human engineering) interact with Darwinian processes? Is "selfishness" sufficient? Where does the "individual" boundary lie in a gene-drive organism? Does this blur the line between natural and artificial selection? (Key thinkers: O’Malley on microbial challenges, Bourrat on hierarchies, Douglas & Savulescu on ethics/ontology of gene drives, papers applying MLS to synthetic biology).
          *   **Highly Accessible:** The biology of gene drives can be explained conceptually. The philosophical questions (boundaries, agency, definition-stretching) are inherently armchair-friendly. Cancer/immunology can be *contrasted* as more established (though complex) examples to see if gene drives represent something *novel* or just another case.
          *   **Neglected in Philosophy (until recently):** While biologists work on gene drives, the *philosophical dissection* of what they mean for units/transitions is nascent and fertile ground. Avoids rehashing Okasha's core framework and instead *tests* its limits.
      *   **Semester Structure:**
          *   Weeks 1-3: Classic Transitions & Frameworks (Buss, Maynard Smith & Szathmáry, Okasha recap - focus on criteria).
          *   Weeks 4-6: Established "Edge Cases" (Cancer lineages - conceptual overview, Clonal selection - simplified).
          *   Weeks 7-9: **Gene Drives as the Core Case Study** (Mechanism, intended/unintended consequences, MLS analysis, is this a *new kind* of transition?).
          *   Weeks 10-12: Synthesis – Pushing the Boundaries: Does engineering change the units question? Revising the criteria? Ethical implications for unit manipulation.

  ### Deliberately Excluded/Deprioritized from Your List & Why:
  *   **Kin Selection / MLS "Equivalence":** This is **effectively settled mathematically** (Gardner et al.'s formalizations). The remaining debate is largely **semantic/contextual**: which framework is *more useful* or *intuitive* for a *specific problem*? While philosophically interesting (e.g., Birch on causal graphs), it's unlikely to sustain a semester for non-mathematicians without devolving into terminological wrangling. It feels more like a chapter within the "Bookkeeping" question.
  *   **Godfrey-Smith's "Darwinianness" Continuum:** While brilliant, this is **more of a reframing than a resolution**. It's excellent for discussion *within* the other topics (e.g., "How Darwinian is a gene drive population?"). However, dedicating a semester to it risks circling around whether vagueness is a feature or a bug, which might frustrate students seeking concrete unresolved questions. It's better used as a *tool* during the other units.
  *   **Cancer/Immunology as Primary Focus:** While fascinating, these are complex biological systems requiring significant background to avoid superficial treatment. Gene drives offer a conceptually sharper, more novel, and philosophically focused "edge case" for transitions. Cancer/immunology can be included as *comparative* examples within Question 2.

  ### Confidence & Caveats:
  *   **Confidence in Ranking (High):** This ordering directly addresses your core goals: escaping the museum, finding active post-2010 debates, focusing on fundamental philosophical issues (explanation, causality, definition), and leveraging your cohort's strengths (conceptual analysis). Question 1 is the bedrock; Question 2 is the exciting frontier testing that bedrock.
  *   **Point of Least Confidence / Potential Blind Spot:** **The specific focus on Gene Drives within Question 2.** While I'm highly confident evolutionary transitions beyond organisms is the right area, and gene drives are the most compelling *new* example, I could be underestimating:
      *   **The pace of resolution:** Philosophers of biology *are* actively working on this (e.g., Lean, Plutynski exploring CRISPR/gene drives). While the core question (how far can the framework stretch?) is wide open, specific arguments about gene drives *might* be crystallizing faster than I anticipate. **Mitigation:** Focus your reading search on the *very latest* (2022-2024) philosophy journals (Biol & Phil, Phil Sci, Studies) and preprint servers. Emphasize that the goal is *not* to resolve it definitively, but to engage with the *arguments being made* using this cutting-edge case.
      *   **Whether Cancer/Immunology offer *more* philosophically novel challenges:** Some argue the sheer complexity and context-dependence of somatic evolution (cancer) or the learned, adaptive nature of the immune system pose *different* and perhaps *deeper* challenges to traditional units than gene drives. **Mitigation:** Ensure Week 6 (Established Edge Cases) gives cancer/immunology sufficient weight to allow students to compare/contrast them meaningfully with gene drives later. Be prepared to pivot discussion based on student interest.

  ### How to Guard Against Settled Questions
  *   **Leverage Your Grad Student:** Task them with a preliminary lit scan focusing on 2018-2024 for your chosen questions, specifically looking for consensus-forming reviews or decisive arguments.
  *   **Focus on Interpretation & Implications:** Even if a technical point is settled (e.g., kin/MLS math), the *philosophical meaning* (like the bookkeeping question) often remains wide open. Frame discussions around "Given X is established mathematically/empirically, what does this mean for...?"
  *   **Embrace Productive Ambiguity:** Some "open" questions are open precisely because key terms are ambiguous (e.g., "unit", "individual", "cause"). Making students grapple with defining these terms *is the philosophical work*. Identify these points explicitly.

  This agenda promises a seminar that feels like participating in *current* philosophy of biology, not just studying its history. Good luck!
