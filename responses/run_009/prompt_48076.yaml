prompt: |-
  I run a lunchtime reading group at work (all engineers, zero philosophy background) and we just went through some Mencius and Xunzi. The whole discussion kept stalling because everyone meant something different by "human nature" — one guy meant what we're born with, another meant what you get if nobody intervenes, someone else basically meant "everyone is secretly selfish." So I want to make a "which view of human nature do you actually hold?" quiz for the group.

  Please do ~8 questions, each one a concrete case, with answer options phrased as predictions or gut reactions, never "do you think humans are naturally good?" Cases I'd like covered somehow: a kid reacting to a toddler about to fall into a well; someone from an awful family who turns out kind anyway; wether a society with no moral teaching at all drifts better or worse over time; and the right analogy for self-cultivation — watering a sprout that's already there, steambending crooked wood straight, or carving something useful out of raw material. Don't quote the source texts at us, just use the cases.

  Then a scoring key mapping answer patterns onto positions: Mencius's sprouts view, Xunzi's view that our raw tendencies are bad and need ritual and standards imposed from outside, Gaozi's "nature is just neutral material, shape it however you want" view, and a "cultivation actively damages what's already there" option if any answers point that way. Also: if two of those positions genuinely can't be seperated by any case you could write, just say so instead of fudging it. Casual tone is fine — these people will take the quiz over lunch.
reasoning: |-
  Okay, the user runs a lunchtime reading group for engineers with no philosophy background, and they've just discussed Mencius and Xunzi. The discussion stalled because everyone had different interpretations of "human nature." Now, they want a quiz with concrete cases to help clarify these different views without directly quoting the texts. 

  First, I need to recall the key positions: Mencius sees human nature as inherently good, like sprouts needing cultivation; Xunzi sees it as inherently bad, requiring external correction like bending wood; Gaozi views it as neutral material to be shaped; and possibly a fourth view where cultivation damages inherent nature. The user specified concrete cases: a kid reacting to a toddler falling into a well, someone from a bad family turning out kind, a society without moral teaching, and analogies for self-cultivation. 

  I should avoid abstract questions and focus on scenarios that elicit gut reactions. Each question needs options that map clearly to the philosophical positions. For example, the toddler scenario tests innate compassion—Mencius would predict distress, Xunzi might doubt the reaction. The person from a bad family tests resilience of goodness—Mencius sees it persisting, Xunzi attributes it to external influences. 

  The society question explores whether morality decays or improves naturally. Mencius thinks it drifts toward chaos without teaching, Xunzi believes it gets worse. The cultivation analogies directly map to each philosopher: watering sprouts (Mencius), steam-bending wood (Xunzi), carving material (Gaozi), and leaving it wild (fourth view). 

  I need to ensure the cases are distinct enough to separate the views. If any positions can't be differentiated, I should note that instead of forcing it. The quiz should have 8 questions, casual tone, and a scoring key. Engineers appreciate practicality, so concrete examples are better than theoretical musings. 

  Also, the user mentioned a "cultivation damages" view, so including an analogy like leaving a seedling untouched or letting wood be warped makes sense. Each answer option should be a prediction or reaction, not a direct statement about human nature. 

  Finally, the scoring key will tally answers. Some answers might overlap between Mencius and Gaozi, so the highest score indicates the primary view. I should clarify that in the key. The language should be engaging and light to fit the lunchtime setting.
answer: |-
  Here's a "What's Your Human Nature Vibe?" quiz – concrete, no jargon, designed to spark lunchtime debate (and maybe settle some Mencius vs. Xunzi scores):

  **Instructions:** Read each scenario and pick the answer that feels most like your **gut instinct** or prediction. Don't overthink it! There are no right/wrong answers, just different starting points.

  1.  **The Toddler & The Well:** You see a random toddler wobbling dangerously close to an open well. A nearby 5-year-old kid (who doesn't know the toddler or its parents) notices too. What's the **most likely** immediate reaction *from the kid*?
      *   A) **Panic & Action:** They'll gasp, yell "NO!", maybe try to grab the toddler's clothes or run for help instinctively.
      *   B) **Hesitation or Indifference:** Might freeze, or just watch curiously. They'd need an adult to tell them *why* it's bad before acting.
      *   C) **Calculated Move:** They might act, but only if they think they'll get praised or avoid getting yelled at themselves later.
      *   D) **Pure Distraction:** They'd probably just go back to playing unless someone *really* told them to care.

  2.  **The Kind Stranger:** You meet someone incredibly kind, generous, and fair. Later you learn they grew up in a truly awful household – neglectful, selfish parents, constant conflict, zero positive examples. How do you explain their kindness?
      *   A) **Inner Resilience:** Something deep inside them pushed back against the bad environment. The good was always there, fighting to grow.
      *   B) **External Lifelines:** They must have encountered *someone* decent (a teacher, friend, grandparent, book) later on who taught them differently.
      *   C) **Learned Strategy:** They figured out that being kind was simply the most effective way to get what they wanted or avoid pain in the long run.
      *   D) **Damaged Goodness:** They might seem kind, but that rough start probably warped their natural instincts in subtle, negative ways underneath.

  3.  **The Untaught Tribe:** Imagine an isolated human society that developed with absolutely **no** deliberate moral teaching, laws, traditions, or role models passed down. Over many generations, how does this society likely fare?
      *   A) **Chaos & Struggle:** Things would get pretty nasty and chaotic quickly without shared rules. Survival of the fittest/meanest dominates.
      *   B) **Basic Bonds Form:** They'd probably develop some basic cooperation and fairness naturally, just to survive and raise kids, even if messy.
      *   C) **Depends on Resources:** If resources are plentiful, they might be chill. If scarce, they'd turn on each other fast. No inherent tendency.
      *   D) **Lost Potential:** They'd miss out on developing deeper connections and meaning that teaching unlocks; things would stay primitive and conflicted.

  4.  **The Found Wallet:** Someone finds a wallet on the street, full of cash and ID. No one is around. No cameras. What's the **most common** outcome?
      *   A) **Return Attempt:** Most people would try to find the owner or turn it in, feeling awkward keeping it.
      *   B) **Keep It (With Guilt):** Most would pocket the cash but maybe mail back the ID later to ease their conscience a bit.
      *   C) **Keep It (No Issue):** Most people would just keep it and feel fine – finders keepers!
      *   D) **Depends on the Person:** Impossible to say "most common" – it varies wildly based on the individual and their specific mood/circumstances.

  5.  **The Spoiled Kid:** Think of a very young child (say 2-3 years old) who gets absolutely everything they want, instantly, with no boundaries. How do they usually turn out *before* any real discipline starts?
      *   A) **Demanding & Selfish:** They become tyrannical, screaming when denied anything, oblivious to others' needs.
      *   B) **Still Capable of Sweetness:** They can still be spontaneously affectionate or share sometimes, even amidst the demands.
      *   C) **Chaotic & Impulsive:** They just follow whatever impulse hits them hardest in the moment, good or bad.
      *   D) **Unformed Potential:** They're just raw energy; the constant indulgence prevents any natural cooperative instincts from developing properly.

  6.  **Learning to Share:** A preschooler initially grabs all the toys. The teacher patiently explains sharing, models it, and praises them when they try. The kid gradually starts sharing more. What made the change?
      *   A) **Nurturing a Seed:** The teacher helped a small, natural impulse to share grow stronger and become a habit.
      *   B) **Correcting a Flaw:** The teacher fixed the kid's natural selfishness by imposing rules and showing the *right* way.
      *   C) **Smart Conditioning:** The kid learned sharing gets praise (reward) and avoids scolding (punishment). It's a useful behavior now.
      *   D) **Overriding Instinct:** The teacher suppressed the kid's natural desire to have everything, forcing conformity.

  7.  **The Self-Cultivation Analogy:** Becoming a better person (more ethical, disciplined, wise) is most like...
      *   A) **Watering a Sprout:** Carefully tending to something good that's already present inside, helping it grow strong and flourish.
      *   B) **Steam-Bending Wood:** Applying strong, sustained pressure (rules, effort) to straighten out what's naturally crooked or warped.
      *   C) **Carving Raw Material:** Taking neutral stuff (instincts, energy) and shaping it deliberately into a useful or beautiful form.
      *   D) **Pruning a Wild Plant:** Cutting away excess growth and distractions to reveal the simpler, more authentic form underneath.

  8.  **The "Natural" Reaction:** When someone close to you is genuinely hurting (sad, sick, grieving), your *very first, unprompted* impulse is usually to...
      *   A) **Comfort/Help:** Offer a hug, ask what they need, try to soothe or assist them.
      *   B) **Assess/Withdraw:** Figure out why it's happening (is it their fault?), or feel awkward and unsure what to do, maybe step back.
      *   C) **Manage the Situation:** Think about how this affects you/others, or the best practical way to "fix" the problem.
      *   D) **Shared Feeling:** Feel a pang of their sadness or worry yourself, almost physically.

  ---

  **Scoring Key:** Tally up your most frequent letter choices.

  *   **Mostly A's: The Sprout Waterer (Mencius-ish)**
      *   You lean towards seeing core elements of goodness (like compassion, shame) as innate in humans. We're born with the "sprouts" of virtue. Problems arise when these are neglected or starved. Becoming better is about nurturing and protecting what's already good within us. Society needs teaching to *cultivate* these sprouts, not to create goodness from scratch. The kid sees the well and *feels* distress naturally.

  *   **Mostly B's: The Wood Bender (Xunzi-ish)**
      *   You lean towards seeing raw human tendencies as messy, selfish, and prone to conflict if left unchecked. Our natural state isn't great. Becoming good requires strong, sustained effort, external guidance (rituals, teachers, laws), and conscious correction to "straighten" us out. Without deliberate teaching and standards, society descends into chaos. The kid near the well needs to be *taught* why to care.

  *   **Mostly C's: The Material Shaper (Gaozi-ish)**
      *   You lean towards seeing human nature as pretty neutral raw material – not inherently good *or* bad. It's all about what you *do* with it. Experience, teaching, choices, and consequences shape people. Self-cultivation is deliberate crafting. Society depends entirely on what habits and systems it builds. The kid at the well *could* learn to react well or poorly; it's not pre-set.

  *   **Mostly D's: The Pruner (Potential Damager-ish)**
      *   You lean towards suspecting that innate human nature has a positive core (curiosity, connection potential?), but that excessive social pressure, rules, or artificial demands can actually warp, suppress, or damage it. True goodness might involve stripping back external impositions to find a simpler, more authentic self. Society's rules might often *get in the way*. The kid near the well might have a pure instinct stifled by later rules.

  **Important Caveats:**

  1.  **Blurry Lines:** It's tough to perfectly separate **Mencius (A)** from **Gaozi (C)** in *every* scenario using concrete cases. Both believe cultivation is necessary! The key difference is whether cultivation *nurtures* something specifically good (Mencius) or *shapes* neutral material (Gaozi). Look at *why* you think the kid reacts (Question 1) or *what* the kind stranger tapped into (Question 2) for clues.
  2.  **Spectrums, Not Boxes:** Most people are a mix! This just highlights your dominant *starting point* assumption when thinking about human nature.
  3.  **Lunchtime Fuel:** Use your results to argue! "But wait, if you're a Wood Bender, how do you explain the Sprout Waterer's answer to Question 8?!"

  Have fun, and good luck with the next philosophical lunch!
