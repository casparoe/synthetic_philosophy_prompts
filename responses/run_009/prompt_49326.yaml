prompt: |-
  ok so I'm on my school's robotics team (FIRST-style, one robot, lots of alliances) and I've been given a job I don't totally know how to do. our coach keeps telling the programmers "don't cause side effects on the field" and that's it, that's the whole instruction, and honestly it drives me mad because nobody can say what it means. obviously we're SUPPOSED to affect the field, that's the whole game — moving game pieces is literally how you score. but then at our last tournament our auton pushed a neutral cone into another alliance's zone while driving to ours, the refs huddled for like five minutes, and half of them called it a penalty and half didn't, and I realised nobody — not the refs, not our coach, not the rulebook — actually has a definition of "side effect". the rulebook just says don't "unnecessarily damage or disrupt" things which is so vague it might as well not exist.

  I got curious and read some stuff online about how people who work on AI safety deal with this exact problem, because apparently it's a real research question — how do you tell a machine to "avoid side effects" when it needs to change the world to do its job, and when you can't write down everything that matters? like the ideas about measuring how far the robot gets from some default state, or only letting it do things you explicitly listed as fine, or comparing what it can still reach/undo afterwards. I'm not going to pretend I understood all of it, but the thing I took away is: maybe there's no way to define "side effect" without first deciding what counts, and the best you can do is make those value judgements explicit instead of hiding them in a vague word. that actually sounds like something our team could use.

  so here's what I want: write us a decision procedure the pit crew can actually run between matches, in maybe two minutes with no laptop and no philosophy degree. it should be a set of questions in order, it should say what a "yes" or "no" to each question means for the robot's plan, it should mark the points where the procedure can't decide and a human (coach or drive team) has to make a call, and it should be honest about where it's just a judgement call dressed up as a checklist. then run it on three cases from our actual season: (1) the neutral cone thing, (2) our auton crossing through the opposing alliance's loading zone because it's two seconds faster than going around, and (3) a plan where the only way to hit our max score involves tipping over a game structure that the rules let us touch but don't require. I'd like you to actually take a position in the write-up — don't give me "there are several approaches and it depends"; pick one and defend it, even for case 3, which I already know will give us an answer the team won't like. also be upfront about what the procedure can't do. and just so you know, everything you write should be in American English even though I'm writing to you in British — the rest of the team reads it and they'll complain about "colour" lol. cheers!
reasoning: |-
  Hmm, the user is on a robotics team and struggling with the vague instruction "don't cause side effects on the field." They're frustrated because no one can define what a "side effect" actually means - not their coach, not the refs, and not even the rulebook. They've encountered real problems like their autonomous routine pushing a neutral cone into another alliance's zone, which caused referee disagreements about penalties.

  I see they've done some research into AI safety concepts about avoiding side effects, recognizing that this is fundamentally about making value judgments explicit rather than hiding behind vague terms. They want a practical decision procedure their pit crew can use between matches - something that takes about 2 minutes without laptops or advanced degrees.

  Their requirements are clear: I need to create a step-by-step question flow with yes/no paths, identify where human judgment is required, be transparent about limitations, and apply it to three specific cases from their season. They want me to take a definite position, not waffle with "it depends" answers, and write in American English.

  The three cases are: 
  1) The neutral cone incident during auton
  2) Crossing through the opposing alliance's loading zone to save time
  3) A strategy that requires tipping over a game structure that's technically legal to touch

  For the decision procedure, I'll draw from AI safety concepts like:
  - Comparing outcomes to a default/inaction baseline
  - Considering reversibility of actions
  - Evaluating whether effects are necessary for scoring
  - Looking for disproportionate impact
  - Identifying irreversible damage

  The procedure should be practical - something they can run through quickly with a clipboard. I'll structure it as a flowchart of questions leading to "GO," "NO-GO," or "HUMAN JUDGMENT CALL" outcomes. The goal is to make their implicit value judgments explicit and consistent.

  For each case study, I'll apply the procedure rigorously and give clear verdicts, even if unpopular (like probably saying no to tipping over game structures). I'll be honest about where the procedure has blind spots - like when "necessity" is debatable or when rulebook gaps create ambiguity.

  The tone should be practical and slightly irreverent - they're clearly frustrated with philosophical vagueness, so I'll match their pragmatic, solution-focused energy while delivering something genuinely useful for competition decisions.
answer: |-
  Okay, this is a *fantastic* question and you've nailed the core problem: "side effect" is inherently subjective without predefined values. Your AI safety parallel is spot-on. Let's build a pit crew procedure that forces explicit value judgments and cuts through the vagueness.

  **Robo-Decision Flow: "Is This Action Clean?" (The 2-Minute Pit Crew Checklist)**

  **Goal:** Quickly judge if a planned robot action has unacceptable "side effects" likely to draw penalties or violate the *spirit* of "don't cause side effects" based on FIRST values, even if the rulebook is fuzzy.

  **Materials:** Clipboard, pen, this checklist, team member who understands the plan & rules. **Time:** < 2 min.

  **Instructions:** Answer each question in order. Stop at the first definitive "GO" or "NO-GO" answer. If you hit a "JUDGMENT CALL," escalate immediately to coach/drive team lead with the specific question you're stuck on.

  ---

  1.  **Does the action DIRECTLY score points for OUR ALLIANCE OR directly enable scoring (e.g., acquiring a game piece WE will score, moving to a scoring position)?**
      *   **YES:** Go to Question 2.
      *   **NO:** **NO-GO.** (The action has no clear scoring purpose for *us*, so any field change is likely "unnecessary disruption").
      *   **UNCERTAIN:** **JUDGMENT CALL** (Escalate: "What's the *direct* scoring purpose?").

  2.  **Compared to doing NOTHING in that spot, does the action CHANGE THE FIELD STATE in a way that primarily BENEFITS THE OPPOSING ALLIANCE?** (e.g., gives them easier access, scores *for* them, breaks *their* opponent's robot).
      *   **YES:** **NO-GO.** (This is almost certainly a penalty-worthy "side effect" - you're helping the enemy).
      *   **NO:** Go to Question 3.
      *   **UNCERTAIN:** **JUDGMENT CALL** (Escalate: "Could this *reasonably* be seen as helping the other guys?").

  3.  **Does the action PERMANENTLY DAMAGE, DISABLE, or IRREVERSIBLY TIP OVER a ROBOT or CRITICAL FIELD ELEMENT (scoring structure, major barrier)?** (Ignore minor scuffs/bumps).
      *   **YES:** **NO-GO.** (This is clearly against "unnecessarily damage or disrupt". Even if "touch" is allowed, permanent damage/tipping is bad).
      *   **NO:** Go to Question 4.
      *   **UNCERTAIN:** **JUDGMENT CALL** (Escalate: "How likely is permanent damage? Is 'tipping' really irreversible?").

  4.  **Is the change to NEUTRAL ELEMENTS (like loose game pieces not in possession, minor field decor) SIGNIFICANT and UNNECESSARY?** Consider:
      *   *Severity:* Does it move them far? Block paths? Pile them up?
      *   *Necessity:* Was moving them *absolutely required* for our scoring action? Could we have avoided it with minimal extra time/effort?
      *   **MINOR & NECESSARY:** Go to Question 5. (e.g., gently nudging a cone aside *just enough* to drive through).
      *   **SIGNIFICANT OR UNNECESSARY:** **NO-GO.** (This is the classic "side effect" zone - disrupting the neutral state for marginal/no gain).
      *   **UNCERTAIN:** **JUDGMENT CALL** (Escalate: "Is moving this neutral piece *really* needed, and how badly does it mess things up?").

  5.  **Does the action VIOLATE A SPECIFIC RULE (even if not directly "damage/disrupt")?** (e.g., crossing a clearly marked boundary like an opposing loading zone during auton when rules forbid it, possessing too many pieces).
      *   **YES:** **NO-GO.** (Simple. Rule broken = potential penalty).
      *   **NO:** **GO.** (Action is likely clean under the "side effect" doctrine).
      *   **UNCERTAIN (Rule Ambiguity):** **JUDGMENT CALL** (Escalate: "Is this rule interpretation likely to get us penalized?").

  ---

  **What This CAN'T Do:**

  *   **Predict Referee Whims:** Some refs are stricter than others. This minimizes risk, but doesn't eliminate it.
  *   **Handle Every Edge Case:** Truly novel situations might still stump it. That's what the "JUDGMENT CALL" is for.
  *   **Define "Unnecessary":** We made a call (Questions 1, 4). Teams might differ slightly here.
  *   **Override Stupid-but-Legal:** If something is legal but violates the *spirit* (e.g., exploiting a loophole to mildly annoy opponents without scoring), this *might* still say "GO" if it passes Q1-5. You need team values for that.

  **Case Study Analysis (Taking a Stand):**

  1.  **The Neutral Cone Push (Auton):**
      *   Q1: YES (Driving to scoring position enables scoring).
      *   Q2: NO (Pushing the cone *into* their zone likely primarily benefits *them*! They get a cone conveniently placed). **--> NO-GO.**
      *   **Verdict:** Unacceptable side effect. Our action directly gave the opponent a scoring advantage. The refs arguing proves the ambiguity, but this procedure flags it clearly as bad. **Defensible Position:** Even if *some* refs didn't call it, the action clearly benefited the opponent due to *our* movement. Avoid it.

  2.  **Crossing Opposing Loading Zone (Auton for Speed):**
      *   Q1: YES (Getting to *our* scoring position faster enables scoring).
      *   Q2: NO (Merely driving through their zone doesn't inherently *benefit* them. It *might* slightly disrupt *them* later, but not *benefit* them).
      *   Q3: NO (Just driving).
      *   Q4: N/A (Assuming no significant neutral element disruption).
      *   Q5: **UNCERTAIN --> JUDGMENT CALL.** This is the crux. *Does the rulebook explicitly forbid crossing an opposing loading zone during auton?* If yes, hard NO-GO. If it's silent or ambiguous:
          *   *Argument Against:* Loading zones are designated alliance areas. Crossing them, even empty, could be seen as "disruption" or violating the zone's implied purpose, especially if it risks future interaction. Ref might call it.
          *   *Argument For:* If it's empty, no damage, no blocking, just passing through quickly, and the rules don't explicitly forbid traversal, it *might* be okay. It's efficient pathing.
          *   **My Stand:** **NO-GO.** FIRST strongly emphasizes alliance areas. Crossing an opponent's *loading zone* during auton, even if empty, is very likely to be interpreted as "disruption" or a violation of the zone's intent. The 2-second gain isn't worth the significant penalty risk. Go around. If the rules explicitly *allow* traversal, it *might* be GO, but I'd still be wary.

  3.  **Tipping Over a Game Structure (For Max Score):**
      *   Q1: YES (It's the *only* way to achieve max score potential).
      *   Q2: NO/UNCERTAIN. Tipping *might* disrupt opponents, but likely doesn't *primarily benefit* them. (Could argue blocking their path benefits them indirectly by hurting their opponents? Messy. Assume NO for now).
      *   Q3: **YES!** "Irreversibly Tip Over" is explicitly listed. **--> NO-GO.**
      *   **Verdict:** **Unacceptable.** Permanent, irreversible damage/disruption to a critical field element is the epitome of what "avoid side effects" and "unnecessarily damage or disrupt" means, even if "touching" is allowed. "Tipping over" is almost certainly beyond "touching". The scoring justification is irrelevant here – doing maximum damage to score is against the core principles. **Defensible Position:** This is a clear violation. The refs *will* penalize this heavily. The team might not like sacrificing max score potential, but this is about sportsmanship and playing within the spirit. Find another way.

  **Why This Works for the Pit Crew:**

  *   **Fast:** Sequential yes/no questions.
  *   **Actionable:** Ends in GO, NO-GO, or JUDGMENT CALL (tells you exactly who needs to decide what).
  *   **Makes Values Explicit:** Forces discussion on "scoring purpose," "benefiting opponents," "permanence," "necessity," and "rules" instead of hiding behind "side effects."
  *   **Honest:** Flags judgment calls and acknowledges limitations.
  *   **Defensible:** Provides clear reasoning for decisions, even unpopular ones, based on the agreed-upon flow.

  **Final Thought:** Run this checklist *before* finalizing auton or complex teleop strategies. It forces the conversation early. Print it, laminate it, put it on the pit clipboard. Good luck at your next tournament!
