answer: |-
  ## Sestina at Intermission

  The house lights rise. I know the price I **paid**
  Is sunk, irrevocably **gone**.
  The first act dragged, a weary, wasted **half**.
  They urge: "Walk out! Seek something bright and **whole**!"
  The cost persists, yet reason stands quite **still**:
  The money’s lost if I remain or **leave**.

  But logic’s cold. I hesitate to **leave**.
  That hefty sum, the effort freely **paid** –
  Does perseverance forge a deeper **still**?
  If I endure what’s dreary, dull, and **gone**,
  Does past investment shape a future **whole**,
  Redeem the fractured, faltering **half**?

  This tedious thing, this mangled, muddled **half** –
  To quit now seems a failure, weak, to **leave**.
  Can stubbornness complete the fractured **whole**?
  That decade’s toil, the nights already **paid**,
  Invested time thought squandered, lost, and **gone** –
  Might present grit warm past bones, stubborn, **still**?

  A character is built by standing **still**
  When winds scream "Go!", by finishing the **half**,
  By honoring the labors now long **gone**.
  A disposition strong resists the **leave**,
  The muscle memory of not quitting, **paid**
  In grit, to build a self-respecting **whole**.

  But is this noble? Or a fractured **whole**
  Conjured from pride? The economist stands **still**,
  Insisting future cost alone be **paid**.
  This second act, this painful, pending **half**,
  Demands fresh minutes if I don’t **leave** –
  The sunk is sunk, forever fixed and **gone**.

  The flatmate’s voice: "The years you thought were **gone**
  Can gain new meaning, woven to a **whole**,
  By seeing through the project. Don’t just **leave**!
  What if the cost *is* the craft? Standing **still**
  Against the current? Finishing the **half**
  Is how we honor effort freely **paid**?"

  A cough resounds. The price remains well **paid**,
  And nothing waits but boredom, surely **gone**
  If I depart. This shabby, second **half**
  Can’t stitch the ragged edges to a **whole**.
  Yet something pulls – not logic, soft and **still**,
  A whisper: "Prove you aren’t the first to **leave**."

  The curtain’s call. The price stays **paid**.
  But what if grit makes meaning from the **gone**?
  I rise to **leave**. The **half** stays **half**. No **whole**.
  The **still**ness holds the cost. I choose to **leave**.

  ---

  **End Words:** paid, gone, half, whole, still, leave

  **Form & Philosophy:** The sestina's relentless rotation of the same six end words embodies the psychological grip of sunk costs. Each stanza forces a re-encounter with "paid," "gone," "half," "whole," "still," and "leave," mirroring how the mind circles the same irretrievable investment ("paid," "gone") when weighing completion ("half," "whole") against persistence ("still") or departure ("leave"). The form physically enacts the inability to let go.

  **The Debate in Miniature:**
  1.  **Stanzas 1 & 2:** Present the textbook principle ("The money’s lost if I remain or leave") and introduce the flatmate's retrospective argument ("Redeem the fractured, faltering half").
  2.  **Stanzas 3 & 4:** Explore the character argument ("A character is built by standing still... A disposition strong resists the leave") and counter it with the economist's view ("The sunk is sunk, forever fixed and gone").
  3.  **Stanzas 5 & 6:** Heighten the tension between the views ("What if the cost *is* the craft?" vs. "The ledger's dry logic shines..."). The speaker explicitly references the flatmate's voice.
  4.  **Envoi (The Crux):**
      *   Line 1: Textbook Principle ("The price stays paid").
      *   Line 2: Strongest Counter (Grit/Making Meaning: "But what if grit makes meaning from the gone?").
      *   Line 3: Action Consistent with Weight ("I rise to leave"). The poem leans into the rational view ("The **half** stays **half**. No **whole**."), acknowledging the pull of the counter-arguments ("The **still**ness holds the cost") but ultimately choosing departure. The final "leave" delivers the decisive action.
