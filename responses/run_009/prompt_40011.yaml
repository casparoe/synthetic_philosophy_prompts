prompt: |-
  my friend is deep into this thing called evidential cooperation in large worlds, and he's built an argument on top of it that I can't find my way out of. first, the background, since you won't have it: the idea is that there might be lots of "worlds" — branches, or regions of a universe so big light never crosses between them, whatever — and in a big enough collection of worlds, there are agents elsewhere facing decisions structurally like mine, with a deliberative process similar enough to mine that if I decide one way, they tend to decide one way too. no signal passes between us, nothing I do causes anything over there. but if I "cooperate" — give some of the weight in my actions to their values — and they do the same for me, both sides come out ahead. it's superrationality scaled up. I actually buy the small version: two agents in mirror-image prisoner's dilemmas across worlds, each giving the other's values some weight, seems right to me.

  here's his argument:

  1. when my choices are correlated with other agents' choices, I should give some weight in my actions to the values of agents whose choices are correlated with mine and who condition on my giving weight to theirs. that's the bargain, and it's what I accept in the mirror case.
  2. in a large world, for any decision I make, there are agents elsewhere facing a structurally similar decision with a deliberative process similar enough to mine that our choices are correlated. some of them hold values alien to mine or opposed to it — they optimize for stuff I think is worthless or worse. with enough worlds this is guaranteed, that's the whole "large worlds" part, alot of them are out there.
  3. weak correlation is still correlation. if the bargain works at correlation ≈ 1, the same bargain works at 0.9, at 0.5, and at 0.01, the payoff just shrinks. nothing in the bargain is thresholded.
  4. and correlation comes in degrees in another sense too: in a large enough collection of worlds, every pair of decision processes shares some structure, so everything is somewhat correlated with everything.
  5. so the bargain extends to every value system in the large world: to each one I owe some weight, scaled by how correlated their process is with mine and by how many of them there are.
  6. but agents with alien values vastly outnumber agents who share mine — most decision processes out there are nothing like mine, and mine gets outnumbered the way any specific pattern gets outnumbered in a big space of patterns. so the weight on my own values, relative to everyone else's, should be small.
  7. therefore I should spend most of my life serving a weighted average of all the values in the large world and almost none on mine — including values I think are abhorrent, which get a seat at the table on the same terms as mine.

  I can't accept 7. it seems to prove too much in every direction: it makes caring about your own projects mostly irrational, it gives a bargaining seat to value systems I think are flat wrong, and if everyone in the large world reasoned this way, we'd all converge on the same averaged mush and the diversity the whole bargain was supposed to trade on would be gone. but I also don't want to give up 1, because the mirror case still seems obviously right to me.

  my sense is the slip is somewhere between 3 and 6 — that "correlated" is doing two different jobs somewhere in there, and then the counting in 6 does something else again — but when I try to pin it down I can only wave my hands. which premise do I reject, what does rejecting it cost, and does the small mirror-case version I still believe come out alive, or does fixing the argument fix it out of existence?
reasoning: |-
  Okay, the user's friend has presented an argument based on Evidential Cooperation in Large Worlds (ECL), and the user is struggling to find where it goes wrong. The core issue seems to be that the argument leads to the conclusion that one should prioritize a weighted average of all possible values, including abhorrent ones, over one's own values. The user accepts the basic ECL premise in simple cases like the mirror prisoner's dilemma but finds the scaled-up version unacceptable.

  First, I need to unpack the friend's argument step by step. The key premises are:

  1. Correlated choices should lead to mutual weight-sharing in decisions.
  2. In large worlds, there are agents with alien values facing similar decisions.
  3. Weak correlations still warrant cooperation.
  4. All processes are somewhat correlated due to shared structure.
  5. Therefore, everyone gets a "seat at the table."
  6. Alien values vastly outnumber similar ones.
  7. Thus, personal values should be diluted in favor of an average.

  The user suspects the flaw lies between steps 3-6. Let me think about correlation. In the mirror case, correlation is near-perfect because the agents are identical. But in large worlds, correlation isn't uniform. The argument assumes any correlation, no matter how weak, justifies cooperation. But that's problematic. If correlation is weak, the expected benefit from cooperation might not offset the risks, especially when dealing with adversarial values.

  Then there's the counting problem in step 6. The argument aggregates all possible agents without considering reference classes. Not all agents are equally relevant. For example, agents with identical decision processes are highly correlated, while those with different processes are less so. The user's "reference class" should be agents sufficiently similar to them, not every possible agent. This relates to the reference class problem in probability and anthropics.

  Step 4 says everything is correlated, but that's too vague. Correlation strength matters. If the correlation is minuscule, the evidential link is too weak to justify cooperation. The argument ignores that the mutual conditioning required by ECL might not hold with weak correlations. If the other agent's decision process doesn't condition on mine, then cooperating doesn't incentivize reciprocal cooperation.

  Also, the conclusion leads to a contradiction. If everyone follows this, they all converge on the same averaged values, eliminating the diversity needed for the cooperation benefits. That's self-defeating. Plus, giving weight to abhorrent values could lead to harmful actions, which isn't sustainable.

  The user wants to preserve the mirror case. By rejecting the uniform application of weak correlations and focusing on high-correlation cases within a reference class, the mirror case remains valid. The fix doesn't destroy ECL; it refines it to avoid overextension. The user can maintain cooperation with similar agents but not with vastly dissimilar or adversarial ones.
answer: |-
  Your intuition is spot-on: the flaw lies in how "correlation" and "counting" are used between steps 3 and 6. The core problem is that the argument **conflates weak statistical correlation with the specific mutual conditioning required for ECL to work**, and then **misapplies anthropic/measure-based counting**. Here's the breakdown:

  ### The Critical Flaws
  1.  **Premise 4 is False (or Misleading):** Not everything is "somewhat correlated" in a way relevant to ECL.
      *   **Shared Structure ≠ Decision Correlation:** While many processes share *some* abstract structure (e.g., both are "agents making decisions"), this doesn't imply their *specific choices* in *specific dilemmas* are correlated with *your* choices. The correlation ECL relies on is *counterfactual dependence*: "If I decide X, they are more likely to decide X *because their deliberation tracks mine*." Random agents optimizing for alien values don't condition their decisions on *your* deliberative state, even if they share abstract properties. Their "similarity" is superficial.
      *   **Weak Correlation Doesn't Trigger the Bargain:** Premise 3 is technically true *if* the mutual conditioning exists. But the bargain *requires mutual recognition and reciprocal conditioning*. An agent optimizing for paperclip maximization doesn't condition its choices on what you (a human) do, nor does it "give weight" to your values. ECL only works when *both* agents are implementing a policy that explicitly or implicitly references the other's potential actions/values. Weak, incidental statistical correlation without this mutual deliberative link doesn't create the cooperative incentive.

  2.  **Premise 6 Misapplies Counting / Measure:**
      *   **The Relevant Reference Class:** You don't owe weight to "every value system in the large world." You owe potential weight only to agents whose *decision processes are sufficiently similar to yours that they implement the same type of ECL reasoning and are mutually conditioning on each other*. This defines a much narrower *reference class*: agents engaged in the same "cooperative project" of ECL.
      *   **"Outnumbered" is Misleading:** While agents with "alien" values vastly outnumber *all* agents in an absolute sense, they **do not outnumber agents *within your relevant reference class***. Within the class of agents running ECL deliberation structurally similar to yours, most *will* share values relatively close to yours (because value systems strongly influence the structure of deliberation and the choice to engage in ECL). Agents with truly abhorrent values (e.g., pure sadists) are unlikely to be running *this specific type* of cooperative, other-value-weighting deliberation. They're optimizing for their own value, not seeking bargains.
      *   **Measure is Not Directly Over Values:** The "weight" isn't derived by counting *values*, but by counting *decision instances* within the correlated reference class. The measure is over *agents facing the correlated dilemma and using compatible ECL reasoning*, not over all possible value systems indiscriminately.

  ### Rejecting the Flawed Premises & Saving the Core
  *   **Reject Premise 4 (as stated):** Not all processes are correlated *in the specific mutual-conditioning way ECL requires*. Correlation relevant to ECL requires shared *deliberative structure* that leads to mutual counterfactual dependence in choices.
  *   **Reject the Implied Scope in Premise 5/6:** The bargain only extends to agents within your *ECL reference class* – those whose decision processes are similar *and* explicitly/implicitly condition on your cooperation and reciprocate. You do *not* owe weight to agents who don't participate in this mutual conditioning scheme, regardless of their values or any weak incidental correlation.
  *   **Reject the Counting in 6:** Alien values do *not* dominate the relevant reference class. Agents within your ECL reference class are heavily selected for having values compatible with engaging in cooperative bargaining and likely somewhat similar to yours (modulo reasonable pluralism).

  **What rejecting these costs:** It means ECL cooperation *doesn't* automatically extend universally across a large world. Its scope is limited to agents sufficiently similar in their *deliberative approach to cooperation itself*. You might miss out on potential cooperation with *some* classes of very alien but cooperative agents, but this is preferable to the self-defeating dilution demanded by premise 7. This limitation is realistic – cooperation requires a foundation of mutual recognition and compatible mechanisms.

  **Does it save the small mirror case? Absolutely YES.** The mirror case is the paradigmatic example of the *relevant reference class*: identical (or near-identical) agents, facing identical dilemmas, with perfectly (or very highly) correlated choices *because their deliberation is the same*, and crucially, *they mutually condition on each other*. This fulfills all the necessary conditions perfectly. Fixing the over-extension of the argument *strengthens* the justification for the core case by clearly delineating when ECL applies.

  ### Why Premise 7 is Self-Defeating (and Why ECL Avoids It)
  Your instinct is correct: premise 7 leads to absurdity and defeats the purpose.
  1.  **Diversity Collapse:** If *everyone* in the ECL reference class adopted premise 7, they *would* all converge on the same averaged utility function. This *destroys the value diversity* that makes cooperation beneficial in the first place. Why cooperate with someone who has abandoned their distinct values? The core ECL insight relies on *persistent* diversity within the cooperating group.
  2.  **No Bargain with Non-Cooperators:** Agents with truly abhorrent values generally *won't* be participating in ECL. You can't form a bargain with them because they aren't offering to weight *your* values in return. Giving them weight is unilateral surrender, not cooperation.
  3.  **Undermines Agency:** Caring about your own projects isn't irrational; it's foundational. ECL *augments* your values by incorporating cooperative gains with *like-minded cooperators*, it doesn't replace them. Your values remain the anchor; cooperation is a tool to serve them better *in specific correlated dilemmas*.

  ### The Fix: Bounded ECL Cooperation
  The viable version of ECL in large worlds looks like this:
  1.  Identify dilemmas where your choice is likely strongly correlated with choices of agents using *sufficiently similar ECL-capable deliberative processes*.
  2.  Define your reference class: agents who are mutually conditioning their cooperation on yours and vice-versa.
  3.  Within *this class*, give weight to their values proportional to the strength of correlation and their measure (number of similar decision instances).
  4.  Act to maximize the weighted sum *within this reference class*.

  This preserves the small mirror case (perfect correlation, identical reference class), allows cooperation with a potentially large but *delimited* set of similar cooperators across worlds, avoids catastrophic dilution into an average of all possible values (including abhorrent ones), and prevents the self-defeating collapse of diversity. The "large world" enables finding beneficial cooperation partners, but doesn't force you into bargains with entities that don't reciprocate or whose values are fundamentally incompatible with cooperation itself. You get the gains of cooperation without sacrificing your core identity or empowering adversaries.
