prompt: |-
  hey, quick context: I'm making my first real hires for my startup (seed stage, four of us in a shed of an office) and my flatmate, an evolutionary biology postdoc, has thoroughly poisoned my brain with signaling theory. he spent an hour the other night on the handicap principle — peacock tails, gazelles stotting at cheetahs instead of just running away — and now I can't read a cover letter without wondering if I'm looking at a tail feather.

  here's what I want from you. I've listed some things applicants actually did in the batch I just went through, and I want you to rate each one on a 0-10 scale for how well it works as a handicap-style signal, meaning how much of its information value comes from being costly in a way that low-quality applicants couldn't fake or wouldn't be willing to pay. a sentence each on the number, and at the end I want a paragraph on which ones are more like the gazelle than the peacock, because my flatmate insists those are two different kinds of signal and I only half followed why (something about the gazelle's signal being costly only if she's lying?). also, he said something about signals where the cost is paid mostly by bluffers, like posting a bond — if any of these fit that better than the peacock pattern, say which and why. and flag anything that's really screening rather than signaling, where the costly thing also builds the trait being signaled, since he claims that distinction matters and I'd like to know if it does here.

  the behaviors: quitting a cushy consulting job to join us at half the salary; agreeing to an unpaid two-week trial; a long, specific cover letter referencing obscure stuff from our old blog posts; openly admiting mid-interview that they bombed a technical question; listing marathon running under hobbies; refusing the take-home assignment on principle; asking pointed questions about our runway and my cofounder's past exits; and a side project that is weirdly, gratuitously overengineered.

  please write it as continuous prose like an email, no headings, no bullet points, no bold, no tables, with the ratings just inline. and one last thing: give me an honest take on whether any of these is a negative signal dressed up as a costly one, where the person is optimizing for me noticing the cost rather than actually having the trait. I'm worried that's what the overengineered side project is.
reasoning: |-
  Okay, the user is running a seed-stage startup and hiring their first employees. Their evolutionary biologist flatmate has influenced them with signaling theory, specifically the handicap principle involving peacock tails and gazelle stotting. They want to evaluate several applicant behaviors as potential signals, rating each on a 0-10 scale for how well they function as costly signals that are hard to fake. 

  First, I need to recall the key concepts: handicap signals are costly, making them honest indicators. Peacock tails are "index signals" - impossible to fake because they're tied to genetic quality. Gazelle stotting is a "performance signal" - costly only if the gazelle isn't actually fit enough to escape after stotting. There's also "screening" where the cost directly builds the trait, versus pure signaling where cost proves pre-existing quality.

  Now, examining each behavior:
  1. Quitting a cushy job for half salary: High cost (9/10) - shows commitment, hard to fake due to financial sacrifice. More peacock-like as it's a permanent display.
  2. Unpaid trial: Moderate signal (5/10) - costly in time/opportunity but could attract desperate applicants. This is screening too since they demonstrate skills.
  3. Detailed cover letter: Low signal (3/10) - shows effort but easily faked. Not truly costly.
  4. Admitting failure: Interesting case (8/10) - costly in reputational risk, making honesty credible. Gazelle-like because only competent candidates can afford this vulnerability.
  5. Marathon running: Weak signal (2/10) - demonstrates discipline but not job-relevant. Could be faked.
  6. Refusing assignment: Complex (6/10) - signals confidence/values but riskier for strong candidates. Gazelle-like as bluffers would avoid this stance.
  7. Asking tough questions: Strong signal (7/10) - tests mutual fit, costly if applicant appears confrontational. More gazelle since weak candidates avoid exposing ignorance.
  8. Overengineered project: Ambiguous (4/10) - could signal passion or poor judgment. Needs context - potentially negative if prioritizing style over substance.

  The gazelle/peacock distinction matters: gazelle signals (stotting, admitting failure, tough questions) impose conditional costs - only bluffers pay full price. Peacock signals (job quit) are unconditionally costly but prove quality. Screening elements appear in the trial period where cost builds value.

  Watch for false signals: the overengineered project risks being performative rather than substantive. The unpaid trial might attract those with no better options rather than true believers.

  Final advice: prioritize signals where costs align with role requirements and filter out bluffers naturally. The job quit and interview honesty are strongest; detailed cover letters weakest. Remember that in early hiring, cultural fit and authenticity matter as much as skill signals.
answer: |-
  Here's a breakdown of those applicant behaviors through the lens of signaling theory, keeping it prose-style as requested:

  Starting with the ratings: Quitting a cushy consulting job for half your salary scores a **9/10**. It's a massive, irreversible financial and status cost that screams commitment and belief in your vision – only someone genuinely convinced (or recklessly desperate, but the cushy job background filters that) would pay it. Agreeing to an unpaid two-week trial gets a **5/10**. While costly in time/opportunity, it can be faked by someone truly desperate for *any* job or specifically targeting startups; it also blurs into screening, as they demonstrate skills during the trial. The long, specific cover letter referencing obscure blog posts is about a **3/10**. It signals effort and research, but the cost (time) is relatively low and easily faked by a determined but ultimately low-quality applicant; it's more about showing interest than proving inherent quality. Openly admitting they bombed a technical question mid-interview is a **8/10**. This is a high-stakes honesty signal – the cost is reputational risk within the interview itself. Only someone confident in their *overall* ability, or possessing exceptional integrity (both valuable), risks this admission; a weaker candidate is far more likely to bluff. Listing marathon running under hobbies gets a **2/10**. It signals discipline and perseverance, but the cost (training time) is sunk and unrelated to the job. It's easily faked (just list it) and doesn't strongly correlate with work ethic in a way low-quality applicants couldn't also claim. Refusing the take-home assignment on principle scores a **6/10**. It signals strong values (e.g., respect for time, anti-exploitation) and confidence. The cost is potentially losing the opportunity. However, it could *also* signal inflexibility or laziness, and a truly desperate applicant might still refuse hoping it signals strength. Asking pointed questions about runway and past exits is a **7/10**. This signals critical thinking, seriousness, and risk awareness. The cost is potentially appearing confrontational or overly cautious, which might put off some founders. A low-quality applicant just wanting *a* job is less likely to risk rocking the boat with tough questions. The weirdly, gratuitously overengineered side project is about a **4/10**. It signals deep technical interest and perhaps capability, but the "gratuitous" aspect is key – the *unnecessary* complexity is the costly signal. However, it could equally signal poor judgment, obsession with the wrong things, or an inability to ship practical solutions – which touches on your concern about a negative signal dressed as costly. It *can* be faked (though the depth of engineering might be hard), and the cost (time) might be borne by someone who enjoys tinkering more than delivering value.

  Regarding the gazelle vs. peacock distinction your flatmate mentioned: Gazelle stotting (jumping high when seeing a predator) is a *performance signal* or *quality-dependent cost* signal. The cost (wasting energy/alerting the predator) is only affordable if the gazelle is genuinely fast enough to escape *despite* the delay – a slow gazelle stotting would get caught, making the signal honest. Signals like **admitting bombing a question**, **asking pointed questions**, and arguably **refusing the take-home** fit this best. The cost (looking bad/risking rejection) is only worth paying if the applicant genuinely has the underlying quality (confidence/competence elsewhere, critical thinking/risk awareness, strong principles) that makes them believe they can still succeed or that the stance is justified. A low-quality applicant is *less* willing or able to pay these costs effectively. The peacock's tail is a *pure index* or *fixed cost* signal – it's extravagantly costly regardless of context, handicapping even the high-quality signaller, but only the high-quality can bear the cost at all. **Quitting the cushy job** is the purest peacock signal here – an enormous, unconditional cost paid upfront solely to demonstrate belief/commitment.

  The "bond posting" idea (where the cost falls mostly on bluffers) applies best to **admitting bombing a question**. A genuine bluffer (incompetent) *cannot* afford to admit failure mid-interview without exposing themselves, making the cost prohibitive for them. A competent candidate, however, can bear this cost because their overall quality remains evident. **Asking tough questions** also has this element – a bluffer might fear exposing their ignorance through the answers they get or the questions they fail to ask next. **The unpaid trial** is primarily **screening**, not pure signaling. The cost (time/effort) isn't just proof of pre-existing quality; the candidate *demonstrates* their skills and fit *during* the trial period. The cost actively builds the evidence of the trait (capability/cultural fit) rather than just signalling an unobservable pre-existing trait. This distinction matters because screening tests for the trait directly (though imperfectly), while signaling infers it indirectly via cost. The **overengineered project** also has a screening element – the complexity *demonstrates* technical skill, but the *gratuitous* part is the attempted costly signal of passion/devotion.

  On your specific worry: Yes, the **gratuitously overengineered side project** is the prime candidate for being a negative signal dressed as a costly one. The applicant is signaling "passion" or "technical depth" via the obvious cost (time/complexity), but the "gratuitous" aspect suggests they might be optimizing for the *appearance* of these traits (getting you to notice the cost) rather than possessing the *judgment* or *pragmatism* crucial for an early-stage startup. It signals they might prioritize intellectual curiosity or technical elegance over solving real problems efficiently – a potential negative disguised as a positive signal. Watch that one closely.

  Hope this helps filter those tail feathers from the genuine stotting! Good luck with the hires.
