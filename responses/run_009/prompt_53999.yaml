  Below is a complete in-class game design that meets your specifications, including the core lock-in experience, path-dependence demonstration, information-purchase twist, and debriefing structure. The game uses **restaurant choices** as a neutral framing to avoid urn-experiment recognition.

  ---

  ### **Game Title**: Restaurant Rumble  
  **Objective**: Students, as food critics, choose between two new restaurants (A or B) to earn candy. Only one is truly better (randomly pre-selected), but they must rely on private signals and public choices.

  ---

  ### **Materials & Setup**  
  - **Signals**: Two decks of cards (Deck A: 12 green cards, 6 red; Deck B: 12 red, 6 green). *Green = "try A," Red = "try B."*  
  - **Payoffs**: Small candies (e.g., M&Ms). For twist round: extra "peek tokens" (paper slips).  
  - **State Selection**: Two opaque bags—Bag A (Deck A inside) and Bag B (Deck B inside). Draw one bag to set the state ("better restaurant") secretly.  
  - **Seating**: Arrange 18 chairs in a single-file "procession line." Assign random order via numbered slips.  

  ---

  ### **Rules**  
  1. **Each round**:  
     - TA draws a bag (state) secretly, e.g., Bag A → Restaurant A is better.  
     - Shuffle the corresponding deck (e.g., Deck A: 12 green, 6 red). Deal one card face-down to each student as their **private signal**.  
     - Students sit in numbered order. Player 1 chooses A or B **publicly** (say/display card). No signal reveals!  
     - Subsequent players see all prior choices (but not signals) + their own signal. They choose A or B.  
     - **Payoff**: Correct choice = 1 candy; wrong = 0.  

  2. **Key mechanic**:  
     - Students compute decisions using:  
       `Choice = sign[(# of prior A choices – # of prior B choices) + (1 if green, -1 if red)]`  
       (If result >0 → A; <0 → B; =0 → follow private signal).  
     - This mimics Bayesian updating with p=2/3 signals but simplifies to integer math.  

  ---

  ### **Rounds**  
  1. **Round 1 (Baseline)**:  
     - State: Fixed (e.g., A). Signals dealt in Seat Order 1→18.  
     - *Goal*: Experience initial cascade. Often locks by player 3–5.  

  2. **Round 2 (Path-Dependence)**:  
     - **Same state, same signals** as Round 1.  
     - Reshuffle seating (new random order). Re-deal identical signals to new seats.  
     - *Goal*: Show opposite lock-in (e.g., Round 1 cascades to A; Round 2 to B despite same signals).  

  3. **Round 3 (Twist: Information Purchase)**:  
     - New state (e.g., B). New signals (Deck B: 12 red, 6 green).  
     - Before choosing, any player may **pay 0.5 candies** (from future winnings) to peek at **one prior player’s private signal**.  
     - TA facilitates peek (targeted player shows card only to peeker).  
     - Peeker updates decision: `New total = prior net choices + (1 if green, -1 if red) for both signals`.  
     - *Goal*: Test if peeks break cascades or are wasted.  

  ---

  ### **Debrief Structure** (15–20 min)  
  1. **Map moments to theory**:  
     - Display choices from all rounds on board. Identify:  
       - **Lock-in point**: When choices stop changing (e.g., "After two A’s, everyone ignored signals").  
       - **Posterior thresholds**: "Player 4 saw net +2 from history + their red signal (-1). Total +1 → chose A despite doubt."  
     - Contrast Rounds 1 & 2: "Same 12 green/6 red signals, yet Group 1 chose A, Group 2 chose B. Why? *Sequence* of signals matters!"  

  2. **Twist insights**:  
     - "Who bought a peek? Did it change your choice? Was the cascade already too strong?"  
     - **Informational externality**: "Your choice helps everyone behind you. When you followed the herd, you ‘hid’ your signal—costing later players info. Buying a peek only helps *you*."  

  3. **Limitations bridge** (2 min):  
     - "In real life, herding isn’t just about signals. It’s about:  
       - **Reputation**: Being wrong alone vs. wrong in a crowd.  
       - **Silent safety**: Opting out (e.g., not publishing a contrary finding).  
       - Our game has no cost for public dissent—so real cascades are *stickier*."  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Signal leaks**:  
     - Student whispers, "I got green!" → **Fix**: Warn: "Automatic 0 if you leak." Remove offenders from payoff eligibility. Use "signal guards" (TA walks behind students to block peeking).  

  2. **Hero contrarians**:  
     - Student rebels: "I don’t care, I’m choosing B!" → **Fix**: In debrief, praise: "Did anyone break the cascade? What happened? In real life, this is risky—careers ride on dissent." Turn it into a learning moment.  

  3. **Math confusion**:  
     - Student hesitates on `net choices + signal` → **Fix**: Pre-game practice with 2-player example. Offer printed cheat sheets. For slow thinkers: "Default to private signal if stuck."  

  4. **Time crunch**:  
     - 18 players × 3 min each = 54 min → **Fix**: Use countdown timer (60 sec/player). Skip verbose reasonings ("Just state your choice"). Run twist round with 9 players if needed.  

  5. **Urn recognition**:  
     - "This is like the urn experiment!" → **Fix**: Restaurant framing + "green/red" signals (not "a/b") diverge. Pre-game: "Forget urns—this is about viral trends!"  

  ---

  ### **What the Game Can’t Capture**  
  - **Reputational payoffs**: No penalty for dissenting while wrong.  
  - **Silent errors**: Players must commit publicly; no "abstain" option.  
  - **Long-term incentives**: Candy rewards myopic choices (vs. career risk).  
  - **Mitigation**: Use the 2-min limitations talk to highlight these gaps. Optional: Add a "reputation round" where players vote to punish "outliers" (adds complexity).  

  --- 

  This design forces students to *feel* rational herding: Choosing against their signal with gritted teeth, seeing identical evidence yield opposite outcomes, and wasting "peek" tokens in late cascades. The math is minimal (add/subtract 1s), and rounds fit in 80 minutes with disciplined timing. Run it with poker faces—students will gasp when Round 2 flips the consensus!
