  We are going to design a classroom game that simulates rational herding. The goal is to make students experience the lock-in effect and the path-dependence of outcomes.

  Core Setup:
  - We have two possible states of the world: A and B (e.g., two different urns, two possible products, etc.). Each state is equally likely.
  - Each player receives a private signal about the state. The signal is either "a" (indicating A) or "b" (indicating B). The signal is imperfect: 
      P(signal = a | state = A) = p (say 2/3)
      P(signal = b | state = B) = p (same 2/3)
    So the signal is correct with probability 2/3, incorrect with 1/3.
  - Players make a public choice (A or B) in a fixed sequence. They observe all previous choices but not the private signals.
  - Payoff: if a player chooses the true state, they get 1 point (or candy, etc.). Otherwise, 0.

  Game Structure:
  We will run multiple rounds. Each round we fix the state (randomly) and assign private signals accordingly. The key is that in two rounds we will use the same set of private signals but in different orders (by shuffling the seating).

  Additionally, we will have a twist round where players can pay to see one extra private signal.

  Materials:
  - Two different colored cards: one for signal "a", one for "b". Enough for all students.
  - A deck to assign the state: one card for state A and one for state B (we'll draw one at the beginning of each round).
