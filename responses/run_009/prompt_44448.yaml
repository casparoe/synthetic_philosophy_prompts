answer: |-
  This is a fundamental value disagreement disguised as metaphysical debate. Both sides accept that (1) welfare matters and (2) persons (or experiences) exist. The clash is over *how* welfare matters across entities.

  **Your bedrock-intuition hypothesis is mostly correct:**
  - **Anti-aggregationists** hold an **agent-relative** intuition: morality fundamentally involves respecting the inviolability of *each separate locus of experience*. Sacrificing one for others violates this sanctity, regardless of net gain. The "separateness" is morally constitutive.
  - **Utilitarians** hold an **agent-neutral** intuition: morality fundamentally involves promoting *states of conscious experience*. Since boundaries between experiences (temporal or personal) are porous or arbitrary, only the net quantity matters. Suffering is suffering, regardless of whose experience-sequence it’s attached to.

  **Why it’s unresolvable:**
  1.  **Circularity:** Each side’s arguments presuppose their core intuition. Time-slice arguments assume agent-neutrality is valid; "no one experiences the sum" arguments assume agent-relativity is valid. Parfit’s fission cases get reinterpreted within each framework.
  2.  **Self-Sealing:** Utilitarians see anti-aggregation as inconsistent emotion (why accept intra-personal tradeoffs but not inter-?). Anti-aggregationists see summation as a category error (mistaking a mathematical construct for moral reality). Neither charge *feels* compelling to the other side.
  3.  **No Neutral Ground:** There’s no shared, more foundational principle from which to adjudicate *which* bedrock intuition is correct. Is morality about relationships between beings? Or about minimizing suffering/maximizing bliss simpliciter? This is where the argument truly starts and ends.

  **Conclusion: It’s permanent.** No conceptual distinction, argument, or fission case will end it because each side’s moral ontology renders the other’s key premises irrelevant or incoherent. The debate persists because it reflects an irresolvable tension within ethics itself: the pull of individual dignity versus the pull of collective consequence. Recognizing it as a foundational value clash, not a metaphysical error, is the only progress possible. Focus shifts to practical compromise where intuitions overlap, not theoretical victory.

