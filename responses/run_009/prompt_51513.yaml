  ### **Design Notes**  
  - **Coverage**: Includes your required cases (bathtub pair, euthanasia methods, shallow/distant rescues, costly rescue, respirator variations).  
  - **Philosophical Gaps**:  
    - Double Effect vs. Deontology: Cannot distinguish without a "means vs. side effect" case (e.g., trolley problem).  
    - Negative/Positive Rights vs. Causal Route: Cannot distinguish because both treat "not acting" similarly (e.g., Q2=B, Q8=B).  
  - **Incoherent Combos**: E.g., Q1=B (killing permissible) + Q2=A (letting die wrong) is rare and contradicts all major theories. Likely unexplored or context-driven.  
  - **Accessibility**: No jargon, no prior philosophy knowledge needed. Bathtub scenarios avoid graphic details (e.g., no blood, "drowns" instead of "struggles").  
  - **Validity**: Questions avoid ambiguity (e.g., "unbearable pain + consent" in euthanasia cases, "50% survival chance" in Q9).  

  This quiz should spark debate while revealing how consistent (or not!) real-world intuitions are. Good luck with your class forum!
