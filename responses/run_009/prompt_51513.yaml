  ### **Scoring Key**  
  Match your answers (A/B/C for Q1–Q9) to the patterns below. **Important notes**:  
  - 🚩 **Indistinguishable positions**: The quiz *cannot* separate Deontologists from Double Effect adherents (both yield Pattern 2) or Negative/Positive Rights from Causal Route adherents (both yield Pattern 3).  
  - ⚠️ **Inconsistent patterns**: If your answers match "Mixed/Incoherent" (Pattern 5), your intuitions don’t align with a major ethical framework. This may reflect unexplored tensions or context-dependent judgments.  

  1. **Straight Consequentialist** (e.g., utilitarians):  
     - **Answers**: Q1=A, Q2=A, Q3=B, Q4=B, Q5=A, Q6=A, Q7=B, Q8=B, Q9=B  
     - **Meaning**: You see no intrinsic moral difference between killing and letting die. Consequences are all that matter. Permissible euthanasia (active/passive), required rescues when cost is low, and redirecting resources (Q9) are fine if net lives saved.  

  2. **Deontologist OR Double Effect Adherent**: 🚩  
     - **Answers**: Q1=A, Q2=A, Q3=A, Q4=B, Q5=A, Q6=A, Q7=B, Q8=B, Q9=A  
     - **Meaning**:  
       - *Deontologist*: Killing (Q1, Q3, Q9) is inherently worse than letting die (Q2, Q4, Q8). You have strong duties to rescue when easy (Q5, Q6) but not when costly (Q7).  
       - *Double Effect*: You forbid *intending death* as a means (Q1, Q3, Q9) but allow *foreseen death* if unintended (Q4, Q8). Rescues are required when easy (Q5, Q6).  

  3. **Negative/Positive Rights OR Causal Route Adherent**: 🚩  
     - **Answers**: Q1=A, Q2=B, Q3=A, Q4=B, Q5=B, Q6=B, Q7=B, Q8=B, Q9=A  
     - **Meaning**:  
       - *Negative/Positive Rights*: Killing (Q1, Q3, Q9) violates a strict duty. Letting die (Q2, Q4, Q8) and not rescuing (Q5–Q7) are permissible—positive duties (to help) are weak/optional.  
       - *Causal Route*: You forbid *causing death* (Q1, Q3, Q9) but allow *allowing death* (Q2, Q4, Q8) or not intervening (Q5–Q7). Turning off machines (Q8) is "letting die," not killing.  

  4. **Contextual Causal Route** (rare, but included for completeness):  
     - **Answers**: Q1=A, Q2=B, Q3=A, Q4=B, Q5=A, Q6=B, Q7=B, Q8=B, Q9=A  
     - **Meaning**: Like Pattern 3, but you make an exception for *direct, easy rescues* (Q5=A). Killing is wrong, but not saving someone *right in front of you* is also wrong.  

  5. **Mixed/Incoherent** (common!):  
     - **Any pattern not above**. Example: Q1=A (killing wrong) + Q2=B (letting die okay) + Q5=A (not rescuing wrong) → inconsistent with all frameworks.  
     - **Meaning**: Your intuitions don’t fit one theory. Maybe you weigh intentions, costs, and causality differently per case—or you’re still figuring it out!  

