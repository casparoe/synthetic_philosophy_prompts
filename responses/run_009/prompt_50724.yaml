  **CASE DESCRIPTIONS**  
  Review these before starting:  
  1. **Flicker Case**: Jones decides to do the deed on his own. But if he *had* shown any sign of wavering, Black’s device would have kicked in after a half-second delay (during which Jones could have stopped himself). Jones doesn’t waver, so Black’s device stays off. *The only alternative possibility was that half-second of wavering.*  
  2. **No-Flicker Case**: Black set things up in advance so that there’s *no moment at all* where Jones could have done otherwise—no wavering period, no flicker. Jones does the deed without any sign of wavering, so Black’s device stays off.  
  3. **Design Case**: Black built Jones’s decision-making process years ago so Jones would make this specific decision. The decision feels “like Jones” (he deliberates, has reasons, etc.), but its origin traces back to Black. *There are no alternative possibilities at the time of the decision.*  

  **DECISION TREE**  
  Start with Question 1.  

  **Question 1: In the No-Flicker Case, would you hold Jones responsible?**  
  - **Yes** → Go to Question 3.  
  - **No** → Go to Question 2.  

  **Question 2: In the Flicker Case, would you hold Jones responsible?**  
  - **Yes** → **Leaf A: Flicker-of-Freedom View**  
    *You think Jones is responsible only if he had at least a tiny alternative (the “flicker”).*  
  - **No** → **Leaf B: Leeway Incompatibilism or Hard Inpatibilism**  
    *You think Jones needs more robust alternatives for responsibility. These views share the same verdicts here—distinguishing them requires cases involving determinism (see note below).*  

  **Question 3: In the Design Case, would you hold Jones responsible?**  
  - **Yes** → **Leaf C: Frankfurt-Style Compatibilism or Reasons-Responsiveness Compatibilism**  
    *You think responsibility doesn’t require alternatives and isn’t broken by how Jones was designed, as long as he acted “from himself.”*  
  - **No** → **Leaf D: Source Incompatibilism**  
    *You think responsibility requires Jones to be the “ultimate source” of his action, which the design history ruins.*  

  ---

  **NOTES ON THE TREE**  
  1. **Blockage case dropped**: The blockage setup (where Black locks doors ahead of time) was excluded because it tests the *same intuition* as the no-flicker case: whether responsibility requires alternative possibilities. If you say “yes” to responsibility in the no-flicker case, you’d also say “yes” in the blockage case (and vice versa). Including it adds no new distinctions.  
  2. **Indistinguishable views**:  
     - **Leaf B** combines Leeway Incompatibilism and Hard Incompatibilism because these cases *cannot* tell them apart. Both deny responsibility without alternatives, but Hard Incompatibilism *also* denies responsibility in *all* cases (even with alternatives) due to sourcehood worries. To split them, we’d need cases involving determinism.  
     - **Leaf C** combines Frankfurt and Reasons-Responsiveness views because the design case *cannot* split them. Both agree Jones is responsible here, but they define “acting from himself” differently (reasons-responsiveness vs. Frankfurt’s “identification”).  
  3. **Unnamed combinations**: None! All answer paths map to named views.  
  4. **Logical gaps**:  
     - The tree has no branch for “responsibility in the design case but not in the no-flicker case.” This combination is likely **incoherent**—it would require alternatives to matter in the no-flicker case but not in the design case (which also lacks alternatives).  
     - The tree also has no branch for “no responsibility in the flicker case but yes in the no-flicker case.” This is **unattractive and unexplored**—it would mean Jones is responsible only when alternatives are *completely* absent, which is philosophically unmotivated.  

  **WHY THIS ORDER?**  
  - **No-Flicker first**: Purest test of whether alternatives are needed (no distractions).  
  - **Flicker second**: Tests if tiny alternatives “rescue” responsibility (splitting Leeway-like views).  
  - **Design last**: Only case that tests “sourcehood” directly, after alternatives are addressed.  

  **FINAL TIPS**  
  - Use your gut, not jargon!  
  - If torn, pick the answer that feels strongest.  
  - Discuss: Where do you land? Did any cases surprise you?  

