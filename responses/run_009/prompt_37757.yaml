  Okay, the user is working on a seminar paper about cognitive penetrability of perception. They need a clear set of criteria to evaluate theories in this area. Let me start by understanding their main request. They want desiderata for an adequate theory that can classify empirical claims. They mention specific examples like hunger affecting brightness perception or language influencing color boundaries. The goal is to distinguish true cognitive penetration from similar effects.

  First, I need to cover the four areas they outlined. For point one, paradigms and impostors. Why are some cases like belief affecting color perception considered penetration, while perceptual learning isn't? The key is the distinction between online cognitive states versus long-term changes. The theory must explain why this boundary matters for how perception functions as a check on beliefs.

  Point two is about necessary distinctions. Perception vs post-perceptual effects, attention, and types of cognitive states (belief vs desire). The theory shouldn't assume these distinctions but should be able to address them. Each distinction impacts whether the effect is genuinely perceptual or occurs later in processing.

  Third is the epistemological payoff. If perception is penetrable, when does that help or hinder knowledge? The user is worried about circularity—if beliefs shape perception, how can perception challenge those beliefs? A theory must account for epistemic consequences, not just state that penetration occurs.

  Fourth, methodological constraints. Studies must control for post-perceptual factors and demand characteristics. The user mentions the painter's argument as a caution against dismissing effects too easily. The theory needs to outline what evidence is valid, avoiding pitfalls like assuming no effect from null results.

  Now, marking each desideratum as non-negotiable or school-specific. Most seem essential, except maybe the epistemological payoff's specifics. Some theories might not prioritize epistemic assessment, but the user insists it's necessary for the theory's completeness.

  The user also has two specific questions. First, whether any desiderata conflict. For example, requiring empirical detectability while respecting perceptual constancies. If penetration is subtle, it might be hard to detect without affecting constancies. Also, assessing epistemic standing might require normative judgments that are hard to test empirically. But a good theory should navigate these tensions by providing clear criteria for evidence and epistemic conditions.

  Second, which single requirement is most decisive. The perception vs post-perceptual distinction seems crucial. If a theory can't differentiate them, it can't isolate genuine penetration. This distinction underpins both empirical classification and epistemological implications.

  I should also consider the user's deeper needs. They might be struggling with the fragmented nature of the debate, wanting a unified framework to evaluate studies. Their focus on principles over specific theories suggests they need a solid foundation before engaging with existing arguments. Ensuring the criteria are comprehensive yet flexible enough to apply across different cases is key. Highlighting the boundary matters and epistemological consequences addresses their concern about circularity and the role of perception in justification.
answer: |-
  Here is a specification of desiderata for an adequate theory of cognitive penetration (CP), structured according to your requirements. Each desideratum is marked for its status, and the final sections address your two key questions.

  **Core Purpose:** The theory must provide principled criteria to classify empirical claims about whether cognition shapes perceptual experience/content itself, distinguishing genuine CP from: (a) post-perceptual effects (judgment, memory, report), (b) attentional selection/changes in input, (c) perceptual learning/long-term development, and (d) non-cognitive influences (e.g., physiological states).

  ---

  ### Desiderata for an Adequate Theory of Cognitive Penetration

  1.  **Paradigm Cases & Impostors (Boundary Definition)**
      *   **Requirement:** The theory must correctly classify agreed-upon paradigm cases of CP (e.g., belief/biases demonstrably altering low-level visual properties like color, brightness, or size *in online processing*; e.g., Balcetis & Dunning's "walked farther" estimate influencing perceived distance of a water bottle *if* genuine CP) and paradigm impostors (e.g., perceptual learning in radiology/chess pattern recognition; top-down effects on perceptual *judgment* but not experience; effects purely driven by attentional allocation changing the *input* sampled). It must explain *why* the boundary matters for the core function of perception.
      *   **Why Non-Negotiable:** Classification is the core task. Failing to capture paradigmatic cases renders the theory descriptively inadequate. Failing to exclude agreed impostors renders it over-inclusive and unable to isolate the phenomenon under dispute. The *why* matters because the significance of CP hinges on its potential to undermine perception's role as a (relatively) independent source of information for cognition/belief fixation. Perceptual learning, while top-down influenced, establishes stable, reliable perceptual capacities; attentional shifts select input but don't alter the processing *of* that input; post-perceptual effects don't alter the perceptual deliverance itself. The boundary matters for perception's epistemic role.
      *   **Status:** **Non-Negotiable.** Any theory failing this lacks empirical adequacy for the domain.

  2.  **Essential Distinctions (Phenomenological & Causal)**
      *   **Requirement:** The theory must provide criteria to rigorously distinguish:
          *   a.  **Perceptual Effect vs. Post-Perceptual Effect:** Does the cognitive state alter the *perceptual experience/content itself* (e.g., the apple *looks* brighter red), or only subsequent judgment, memory encoding/retrieval, or report (e.g., the apple *is judged* to be redder or *described* as redder, despite looking the same)?
          *   b.  **Penetration Proper vs. Attentional Deployment:** Does the cognitive state alter *how* the stimulus is processed/perceived (e.g., making it *look* larger), or merely *which* stimulus is selected for processing without altering its intrinsic appearance (e.g., looking *at* the food item because you're hungry, but it *looks* the same)?
          *   c.  **Types of Penetrating States:** The theory must *adjudicate* (not presuppose) whether penetration by belief states is fundamentally different in kind or mechanism from penetration by desires, moods, emotions, or goals. It must specify the relevant cognitive states and their properties.
      *   **Why Non-Negotiable:** Collapsing (a) conflates perception with cognition/judgment, dissolving the phenomenon. Collapsing (b) conflates selection with transformation, ignoring vision science. Failure to address (c) leaves the scope and nature of CP ambiguous. Respecting these distinctions is necessary for precise empirical classification and mechanistic explanation.
      *   **Status:** **Non-Negotiable** for (a) and (b). The specific treatment of (c) (lumping vs. splitting) is a **Theory-Specific Commitment**, but the requirement to *adjudicate it* (i.e., provide principled grounds for inclusion/exclusion) is **Non-Negotiable**.

  3.  **Epistemological Payoff (Normative Consequence)**
      *   **Requirement:** If the theory affirms that CP occurs, it *must* provide an account of the *epistemic status* of penetrated perceptual states. Specifically, it must explain the conditions under which CP:
          *   i.  **Degrades** perception's epistemic function (e.g., introducing systematic bias, making perception less reliable or less independent of background belief, potentially leading to confirmation bias loops).
          *   ii. **Enhances or Preserves** perception's epistemic function (e.g., increasing sensitivity to relevant features, improving speed/accuracy, incorporating useful prior knowledge without sacrificing accuracy or independence in ways that matter for justification).
      *   **Why Non-Negotiable:** The central philosophical motivation for debating CP is its potential threat to foundationalist or naive realist epistemologies where perception provides an unbiased check on belief. A theory declaring CP real without addressing its epistemic consequences is radically incomplete. It fails to engage with the core *worry* driving the debate. It must explain *when* and *why* penetration is epistemically benign, malignant, or beneficial.
      *   **Status:** **Non-Negotiable** as a requirement *to address epistemic standing*. The *specific account* of when degradation/enhancement occurs (e.g., reliabilist vs. internalist vs. virtue-based) is **Theory-Specific**.

  4.  **Methodological Constraints (Empirical Adjudication)**
      *   **Requirement:** The theory must specify the methodological controls necessary for evidence to bear on CP claims. Crucially, it must:
          *   a.  Require ruling out **post-perceptual explanations** (judgment, memory, response bias, demand characteristics) as the *sole* cause of observed effects.
          *   b.  Require ruling out **attentional deployment** as the *sole* explanation for changes in reported experience.
          *   c.  Explicitly reject the **"null behavioral effect fallacy"**: The inference that *failure* to find a behavioral signature of distortion (like the painter's "cancelling out" argument) *proves* perception was unaffected is invalid. The theory must acknowledge that genuine perceptual distortions can exist without manifesting in certain behavioral measures (e.g., due to calibration, counteracting mechanisms, or task-specific factors).
          *   d.  Specify what *positive evidence* would be diagnostic of a genuine perceptual effect (e.g., specific psychophysical signatures, dissociations in neural correlates, phenomenological reports under controlled conditions).
      *   **Why Non-Negotiable:** Without (a) and (b), purported evidence for CP is confounded. Without (c), the theory is vulnerable to unfalsifiable skepticism. Without (d), the theory lacks empirical traction. These constraints are necessary for the theory to be testable and for empirical results to meaningfully adjudicate between competing claims.
      *   **Status:** **Non-Negotiable** for (a), (b), and (c). The specific *positive evidence* criteria (d) may have **Theory-Specific** elements but must be sufficiently concrete for empirical application.

  ---

  ### Addressing Your Key Questions

  1.  **Joint Unsatisfiability?** While challenging, the core desiderata **(Paradigm Cases, Essential Distinctions, Methodological Constraints, Epistemological Payoff)** are **not inherently jointly unsatisfiable**. A successful theory *can* achieve all four:
      *   **Empirical Detectability & Constancy:** A theory can posit that CP operates *within* or *alongside* constancy mechanisms. Penetration might subtly modulate how constancy is achieved (e.g., adjusting the "prior" in a Bayesian framework) rather than overriding it blatantly. Methodological constraints (Desid. 4) guide the search for subtle, dissociable signatures (e.g., using priming + discrimination tasks, neural markers) that can detect modulation without violating core perceptual stability required for function.
      *   **Assessable Epistemic Standing:** Once a theory defines the *mechanism* of CP (Desid. 1 & 2), it can link the *nature* of that mechanism to epistemic consequences (Desid. 3). For example: Does the penetration source (belief vs. mood) correlate with reliability? Does the penetration mechanism preserve counterfactual sensitivity? Does it introduce a problematic kind of circularity? This assessment relies on the theory's account of perception and justification, but it's grounded in the empirical classification the theory enables.
      *   **The Tension:** The main tension lies between demanding *strong, easily detectable* effects (for clear empirical validation) and respecting the *robustness* of perceptual constancies (which suggests any CP effects must be subtle or constrained). Methodological sophistication (Desid. 4) is key to resolving this. The epistemological assessment (Desid. 3) also depends heavily on *how* the theory resolves the distinctions in Desid. 2c (e.g., is wishful seeing epistemically different from belief-based seeing?). However, these are challenges *for* the theory to resolve, not logical impossibilities.

  2.  **Most Decisive Requirement?** The single requirement that does the most to **admit or exclude candidate theories** is the ability to rigorously enforce the **Perceptual Effect vs. Post-Perceptual Effect distinction (Desid. 2a)**.
      *   **Why:** This distinction cuts to the heart of the phenomenon. Theories that collapse perception into post-perceptual judgment (eliminativism about CP, strong versions of "cognitive impenetrability") are defined by denying any *perceptual* effect. Theories affirming CP hinge on demonstrating an effect on perception *itself*. The difficulty of empirically *securing* this distinction (per Desid. 4a) is the primary methodological battleground (e.g., the "locus of effect" debate). A theory's stance on what constitutes a *genuine perceptual effect* (phenomenological, representational, neural) fundamentally shapes its criteria for Desid. 1 (what counts as a paradigm/impostor) and constrains its options for Desid. 3 (epistemic standing depends on *what* is penetrated). Failure here renders the theory either vacuous (everything is CP if judgment is included) or incapable of detecting the phenomenon it seeks to explain (if the bar for a perceptual effect is impossibly high). Success here provides the foundation for everything else. While Desid. 4 (methodology) is crucial for *testing*, Desid. 2a defines *what* is being tested for.

  This specification provides the principled framework you need to evaluate competing theories of cognitive penetration on their ability to define, detect, distinguish, and account for the epistemic consequences of the phenomenon. Good luck with your seminar paper!
