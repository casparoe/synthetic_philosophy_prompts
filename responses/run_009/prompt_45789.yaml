answer: |-
  **Joint Statement on Moral Responsibility and Just Deserts**  
  **Adversarial Collaboration Draft**  

  **1. Agreed Claims**  
  1.1. Our dispute does not concern the truth or falsity of causal determinism, the existence of alternative possibilities in a pre-theoretical sense, or the utility of holding agents responsible. Both parties reject libertarian agent-causation.  
  1.2. Experimental philosophy data (e.g., Nichols & Knobe, 2007; Shaun Nichols’ *Bound*) reveals that ordinary attributions of moral responsibility are context-sensitive, influenced by affective reactions, and often inconsistent with abstract compatibilist or incompatibilist principles. These judgments cannot settle our philosophical disagreement.  
  1.3. Existing criminal punishment regimes (e.g., U.S. mass incarceration, mandatory minimums, solitary confinement) impose suffering that exceeds *any* defensible moral justification—forward-looking *or* backward-looking. Current practices are excessively retributive, racially biased, and counterproductive to safety and rehabilitation.  
  1.4. Moral responsibility practices are social technologies that can be reformed. Their justification must engage with human psychology, social dynamics, and consequences.  
  1.5. "Desert" is a polysemous term; our core disagreement centers on *basic desert* (Pereboom: suffering deserved *solely* because of wrongdoing, independent of consequences).  

  ---

  **2. Disagreements Table**  
  | **Issue**                          | **Compatibilist Position (Dennettian)**                                                                 | **Skeptical Position (Pereboom-Caruso)**                                                                 |  
  |------------------------------------|---------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **Basic Desert**                   | Sufficiently rational agents can deserve blame/punishment in a non-instrumental sense. This desert is irreducible to forward-looking benefits and anchors the "honesty" of moral address. | No agent deserves suffering in the basic desert sense. Justifications for blame/punishment must be exclusively forward-looking (protection, rehabilitation, moral education). Basic desert is a morally hazardous metaphysical fiction. |  
  | **Blame as Moral Address**         | Blame is a communicative act that attributes fault to an agent, presupposing their capacity for reasons-responsiveness. Desert is internal to this practice: to blame *is* to assert desert. | Blame can be reconceived as non-retributive moral communication (e.g., protest, call for accountability) that need not presuppose basic desert. Desertless blame avoids legitimizing cruelty. |  
  | **Sentencing Practice**            | Justice requires imposing *some* hardship proportionate to culpability (desert), even when forward-looking aims (e.g., rehabilitation) could be achieved with less. Proportionality constraints prevent instrumentalization. | Sentencing must be strictly governed by forward-looking aims (rehabilitation, risk management, deterrence). "Proportionality" should reflect harm prevention, not desert. Desert-based sentencing perpetuates needless suffering. |  

  ---

  **3. Cruxes**  
  *Resolving any crux would significantly alter at least one party’s position.*  
  3.1. **The Practical Standpoint Crux**: Can basic desert be reconstructed *solely* from within the practical standpoint (e.g., Strawson’s reactive attitudes) as a normative commitment inherent to mutual accountability, without smuggling in untenable metaphysics?  
     - *Compatibilist Prediction*: Yes. Denying desert undermines the force of moral protest (e.g., "You *ought* to feel remorse").  
     - *Skeptic Prediction*: No. Practical attitudes can be explained/justified by forward-looking moral aims (e.g., Scanlon’s relational morality).  

  3.2. **The Communicative Blame Crux**: Can blame retain its distinctive character as moral address if it explicitly denies basic desert?  
     - *Compatibilist Prediction*: No. Desertless "blame" reduces to therapy or coercion, losing its power to recognize agency.  
     - *Skeptic Prediction*: Yes. Blame as moral protest (e.g., "You violated our shared norms") remains intact without retribution.  

  3.3. **The Moral Education Crux**: Does the *withdrawal of recognition* intrinsic to desert-based blame uniquely motivate moral improvement, or can forward-looking alternatives (e.g., restorative justice) achieve this without retribution?  
     - *Compatibilist Prediction*: Desert-based blame is instrumentally necessary for deep moral reform.  
     - *Skeptic Prediction*: Forward-looking methods (e.g., cognitive behavioral therapy, community reintegration) are equally/more effective.  

  ---

  **4. Cases, Predictions, and Evidence**  
  4.1. **Armed Robber Case**:  
     - *30-year-old first offender, chronic opioid addiction, employed until 2 years ago.*  
     - **Compatibilist Sentencing**: Justice requires imposing *some* incommensurate hardship (e.g., 1–2 years incarceration) *because he deserves it* for culpable choices, alongside addiction treatment. Proportionality reflects his rational capacity despite addiction.  
     - **Skeptic Sentencing**: Justice requires only measures to rehabilitate (e.g., drug court, supervised probation, job training) and protect society. Incarceration is justified *only* if strictly necessary for risk management.  

  4.2. **Rehabilitative vs. Retributive Regimes**:  
     - *Evidence*: Norway’s rehabilitation-focused prisons (low recidivism) vs. U.S. retributive models (high recidivism).  
     - **Compatibilist Prediction**: Norway succeeds *despite* denying desert, not because of it. Moral education in such systems implicitly relies on attenuated desert norms.  
     - **Skeptic Prediction**: Norway proves forward-looking systems achieve moral education and public safety better than retributive ones. Desert is superfluous.  

  ---

  **5. Verbal/Substantive Disagreements**  
  5.1. **Verbal**:  
     - "Desert" as *fittingness* (e.g., "The critic deserved applause") is uncontroversial; we agree responses can be fitting without retribution.  
     - "Desert" as *entitlement* (e.g., "Wages deserved for work") is distinct from basic desert and not at issue.  
  5.2. **Substantive**:  
     - Whether *basic desert* (retributive deservingness of suffering) is irreducible, necessary for moral address, and non-metaphorical. This is the core dispute.  
     - Whether denying basic desert evacuates blame of its core function or merely reorients its justification.  

  ---  
  **Signatures:**  
  _________________________  
  [Compatibilist Signatory]  

  _________________________  
  [Skeptic Signatory]
