answer: |-
  Below is a diagnostic quiz designed to elicit students' implicit interpretations of probability through concrete cases. The quiz avoids philosophical labels and focuses on scenarios where interpretations diverge. The scoring key maps answer patterns to specific interpretations, highlights points of embarrassment for each view, flags indistinguishable positions, and identifies an undefended pattern. The entire document is formatted as a one-page handout suitable for first-year students.

  ---

  **Diagnostic Quiz: What Do You *Really* Think About Probability?**  
  *Instructions: For each scenario, circle the answer that best reflects your view. Do not overthink—go with your intuition. There are no right or wrong answers.*

  1. **Fair coin under a cup**: A fair coin was flipped, landed, and is now hidden under a cup. What is the probability it shows heads?  
     A) 0.5  
     B) 0 or 1 (it’s already fixed, but we don’t know which)  
     C) No probability—it’s already happened.  

  2. **Uncomputed digit of π**: The ten-billionth digit of π hasn’t been calculated yet. What is the probability it is a 7?  
     A) 0.1 (since digits are equally likely)  
     B) 0 or 1 (it’s mathematically fixed, but unknown)  
     C) No probability—math truths aren’t random.  

  3. **Indeterministic decay**: A specific uranium atom (which decays randomly) sits in a lab. What is the probability it decays in the next hour?  
     A) A specific number (e.g., based on its half-life).  
     B) No probability—only frequencies over many atoms matter.  
     C) 0 or 1 (it’s predetermined, but we don’t know).  

  4. **Die that’s never rolled**: A die sits on a desk. It will never be rolled. What is the probability it *would* land six if rolled?  
     A) 1/6  
     B) No probability—it won’t happen, so no frequency or chance.  
     C) 0 or 1 (its outcome is fixed by the world’s state).  

  5. **Election forecaster**: A well-calibrated forecaster says a one-off election has a 70% chance of going to Candidate A. Is this 70% a probability?  
     A) Yes—it’s an objective fact about the election.  
     B) Yes—but only as a belief (the forecaster’s confidence).  
     C) No—it’s just a useful stand-in for real probability.  

  6. **Biased-coin identification**: A coin is either double-headed (50% prior chance) or fair (50% prior). You flip it once; it lands heads. What is the probability it’s double-headed?  
     A) >0.5 (more likely than before)  
     B) 0.5 (unchanged by the flip)  
     C) No probability—the coin’s type isn’t random.  

  7. **Single roll in a hypothetical sequence**: A hypothetical frequentist says a fair coin’s probability of heads is the long-run frequency in an infinite sequence. What is the probability of heads on the *first* flip of this sequence?  
     A) 0.5  
     B) Undefined (single flips can’t have probabilities)  
     C) It could be anything (randomness doesn’t guarantee 0.5).  

  8. **Die rolled once and destroyed**: A die is rolled once, then destroyed. What is the probability it landed six?  
     A) 1/6  
     B) No probability—no long-run sequence exists.  
     C) 0 or 1 (fixed at the moment of rolling, but unknown).  

  ---

  **Scoring Key: Mapping Answers to Interpretations**  
  *Compare your answers to the patterns below. Each interpretation has a “most embarrassing” answer it must reject. Two interpretations are indistinguishable here; one pattern is coherent but undefended.*

  1. **Actual Frequentism (Finite)**:  
     - **Answers**: 1C, 2C, 3B, 4B, 5C, 6C, 7B, 8B.  
     - **Pattern**: Denies probabilities for single/unrepeated events (e.g., coin under cup, die never rolled).  
     - **Most embarrassing if you answered**: 1A (assigns probability without actual frequency).  

  2. **Hypothetical Frequentism**:  
     - **Answers**: 1A, 2C, 3A, 4A, 5C, 6C, 7A, 8A.  
     - **Pattern**: Assigns probabilities via hypothetical long-run frequencies (e.g., coin under cup, uranium atom). Rejects probabilities for non-empirical facts (π digit).  
     - **Most embarrassing if you answered**: 7B (denies probability for a single flip in a hypothetical sequence).  

  3. **Subjectivism (Betting/Calibration)**:  
     - **Answers**: 1A, 2A, 3A, 4A, 5B, 6A, 7A, 8A.  
     - **Pattern**: Assigns probabilities as degrees of belief, even to fixed unknowns (π digit) or unrepeated events (die never rolled). Updates beliefs with evidence (e.g., biased coin).  
     - **Most embarrassing if you answered**: 5C (denies that a well-calibrated credence is a probability).  

  4. **Single-Case Propensity**:  
     - **Answers**: 1A, 2C, 3A, 4A, 5A, 6C, 7A, 8A.  
     - **Pattern**: Assigns probabilities as inherent tendencies of single systems (e.g., coin under cup, uranium atom). Rejects probabilities for non-random events (π digit, coin type).  
     - **Most embarrassing if you answered**: 3B (denies probability for a single indeterministic event).  

  5. **Long-Run Propensity**:  
     - **Answers**: 1A, 2C, 3B, 4B, 5C, 6C, 7A, 8B.  
     - **Pattern**: Assigns probabilities only as tendencies that produce long-run frequencies. Denies probabilities for unrepeated events (die never rolled, single atom decay).  
     - **Most embarrassing if you answered**: 8A (assigns probability to a single non-repeated event).  

  6. **Deflationary/Formalist**:  
     - **Answers**: 1A, 2A, 3A, 4A, 5C, 6A, 7A, 8A.  
     - **Pattern**: Uses probability as a mathematical tool. Assigns symmetries (e.g., 0.5 for fair coins) or beliefs (e.g., π digit) but rejects metaphysics (e.g., election probability isn’t “real”).  
     - **Most embarrassing if you answered**: 5A (treats belief as an objective feature of the world).  

  ---

  **Indistinguishable Positions & Undefended Pattern**  
  - **Single-Case vs. Long-Run Propensity are separated**: Question 8 (die rolled once and destroyed) splits them: Single-Case says A (probability exists), Long-Run says B (no probability without long-run).  
  - **The quiz cannot separate Actual and Hypothetical Frequentism on π (both say C) or Biased-Coin (both say C)**, but they diverge on single events (e.g., Q1, Q3, Q4).  
  - **Undefended Pattern**: 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A. This treats everything as having an objective probability (e.g., π digit, election, biased coin). It is *untenable*: it conflates objective chance with epistemic uncertainty, ignoring that some events (e.g., π digit) are fixed and non-random.  

  ---

  **How to Use**  
  - Hand out the quiz cold (no prior theory exposure).  
  - Use the scoring key to spark discussion: “Why do your answers cluster a certain way? What does that say about probability?”  
  - The key helps students see contradictions (e.g., claiming frequentism but assigning probability to a coin under a cup).
