  Diagnostic Quiz on Probability Interpretations

  Instructions: For each scenario, choose the best answer without worrying about any philosophical labels. There are no right or wrong answers; we are interested in your intuitive reactions.

  1. A fair coin has been flipped and is now hidden under a cup. What is the probability that it is heads?
     A) 0.5
     B) 0 or 1 (it's already determined, but we don't know which)
     C) There is no probability for this event.

  2. The ten-billionth digit of pi has not been computed yet. What is the probability that it is 7?
     A) 0.1
     B) 0 or 1 (it's already determined, but we don't know which)
     C) There is no probability for this event.

  3. A particular uranium atom (with a half-life of 4.5 billion years) is sitting in a lab. What is the probability that it decays in the next hour?
     A) A specific number between 0 and 1 (determined by physical laws)
     B) We can only assign probabilities to collections of atoms; for a single atom, there is no probability.
     C) It is either 0 or 1 (but we don't know which).

  4. A die is sitting on my desk. I have never rolled it and I never will. What is the probability that it would land six if I were to roll it?
     A) 1/6
     B) There is no probability for this event.
     C) It is either 0 or 1 (but we don't know which).

  5. A well-calibrated forecaster assigns a 70% chance to candidate A winning a one-off election. Does the forecaster's 70% reflect a real probability?
     A) Yes, it is a real probability about the election.
     B) Yes, but only as a degree of belief; it is not a property of the election itself.
     C) No, it is not a probability.

  6. I have a coin that I know is either double-headed (with probability 1/2) or fair (with probability 1/2). I flip it once and it lands heads. What is the probability that it is double-headed?
     A) More than 0.5
     B) 0.5
     C) Less than 0.5
     D) There is no probability for this event.

  7. Consider a fair coin. A hypothetical frequentist defines the probability of heads as the limiting relative frequency in an infinite sequence of flips. What is the probability of heads on the very first flip of this hypothetical sequence?
     A) 0.5
     B) Undefined
     C) It could be anything.

  8. A die is rolled exactly once and then immediately destroyed. What is the probability that it lands six on that roll?
     A) 1/6
     B) There is no probability for this event.
     C) It is 0 or 1 (but we don't know which).

  Scoring Key:

  Match your answers to the patterns below. The patterns are based on typical positions in the philosophy of probability.

  - **Actual frequentism (finite)**: 
     Answers: 1C, 2C, 3B, 4B, 5C, 6D, 7B, 8B.
     This view says that probability requires actual finite frequencies. Single events, one-offs, and non-repeatable events have no probability.
     Most embarrassed by: assigning a probability to the coin under the cup (1A) or the uranium atom (3A).

  - **Hypothetical frequentism**:
     Answers: 1A, 2C, 3A, 4A, 5C, 6D, 7A, 8A.
     This view uses hypothetical infinite sequences. It assigns probabilities to single events as part of such sequences, but not to non-random events like the pi digit.
     Most embarrassed by: saying there is no probability for the uranium atom (3B) or the die never rolled (4B).

  - **Subjectivism**:
     Answers: 1A, 2A, 3A, 4A, 5B, 6A, 7A, 8A.
     This view identifies probability with degree of belief. You can assign probabilities to anything unknown, including mathematical facts and single events, and update with evidence (as in the biased coin).
     Most embarrassed by: saying there is no probability for the pi digit (2C) or for the die that is never rolled (4B).

  - **Propensity (single-case)**:
     Answers: 1A, 2C, 3A, 4A, 5C, 6D, 7A, 8A.
     This view sees probabilities as objective single-case tendencies. It assigns them to physical indeterministic events (like the uranium atom) but not to non-random events (pi digit or coin type).
     Most embarrassed by: denying a probability to the uranium atom (3B) or to the die rolled once (8B).

  - **Propensity (long-run)**:
     Answers: 1A, 2C, 3B, 4B, 5C, 6D, 7A, 8B.
     This view sees probabilities as tendencies to produce long-run frequencies. It denies probabilities to single cases when there is no long run (like the uranium atom, the die never rolled, and the die rolled once and destroyed).
     Most embarrassed by: assigning a probability to the uranium atom (3A) or to the die rolled once (8A).

  - **Deflationary/Formalist**:
     This view avoids metaphysical commitments and uses the mathematical formalism. There isn't a unique pattern, but a typical deflationary might answer: 
        1A, 2A, 3A, 4A, 5B or C, 6A, 7A, 8A.
     However, this overlaps with subjectivism and others. This view is not easily diagnosed by the quiz. It might be a catch-all for mixed patterns.

  Flagged issues:
  - The two propensity views are separated by questions 3, 4, and 8: 
     - Single-case: 3A, 4A, 8A.
     - Long-run: 3B, 4B, 8B.
  - The quiz may not separate deflationary from subjectivism or propensity in some cases. In particular, the deflationary view might often align with subjectivism except on the election forecaster (question 5) and the biased coin (question 6) might be the same. But if a student has a pattern that doesn't fit any above, it might be deflationary.

  - There is one coherent pattern that is undefended in the literature: 
     - 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A. 
     This view is objectivist about everything, including the election and the coin type. It might be considered untenable because it assigns objective probabilities to events that are not indeterministic (like the election and the coin type).

  Note: The patterns above are ideal typical. You might not perfectly match one. That's okay! The quiz is a simplification.

