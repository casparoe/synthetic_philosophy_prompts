prompt: |-
  I'm the newest member of the ethics committee at a mid-sized hospital, and I've started to suspect we don't actually have one consistent rule for when someone is dead — just a pile of precedents that several different rules would fit equally well. Our record so far:

  1. Textbook brain death: massive hemorrhage, coma, no brainstem reflexes, failed apnea test, two exams six hours appart. Heart still beating on the ventilator. We declared death and organs were recovered.
  2. Cardiac arrest in the ER; the team worked the code for half an hour, called it, waited five minutes, declared death. No procurement, the family had declined donation.
  3. A woman in a permanent vegetative state — unconscious two years, cortex gone on imaging, but she breathes on her own, brainstem intact. Family asked whether she could be declared dead so her organs could be donated. We said no: she's alive, and withdrawing the feeding tube would be letting a living person die, not declaring a dead one.
  4. A DCD case: devastating brain injury but not brain dead, family withdrew the ventilator, heart stopped, five minute wait, death declared, organs recovered.

  Next month we get: a patient who meets every clinical criterion — coma, no brainstem reflexes, failed apnea test — but imaging and labs show the hypothalamus is intact and doing its job: no diabetes insipidus, temperature regulated fine. Our neurologist says this happens more often than people assume. The transplant team is definetely keen and the family is on board.

  So: do we declare death? Honestly I care less about the yes/no than about everything around it. Which rules actually fit our record so far? What does each of them predict for this case? What's your best guess, and why? And which further case would best tell the surviving rules apart? Also flag anything in our existing record that already looks shaky. Under 500 words please — I have to read this at breakfast.
reasoning: |-
  Alright, let me unpack this ethics committee query. The user presents four prior cases and an upcoming dilemma about a patient meeting all brain death criteria except intact hypothalamic function. 

  First, I notice their core concern isn't just about the next case - they're auditing the hospital's consistency in defining death. Smart. The records show three approaches coexisting: 1) neurological death (cases 1 and the upcoming one), 2) circulatory death (cases 2 and 4), and 3) rejecting PVS as death (case 3). 

  Hmm... the shaky part jumps out: Case 3's reasoning contradicts case 1. If whole brain function is required, why accept hypothalamic failure as essential now? And why was DCD allowed without full neurological criteria? The committee seems to flip between "whole brain" and "brainstem" definitions situationally. 

  For the upcoming case, I predict they'll declare death because: transplant is planned, the family consents, and the hypothalamus isn't typically considered in standard brain death exams anyway. But this exposes the inconsistency - if temperature regulation matters, why didn't they require it in case 1? 

  The best test case would be someone meeting circulatory death criteria immediately after cardiac arrest but with intact neurological function - like a sudden V-fib arrest. Would they wait for brain death or declare at cardiac standstill? That'd force them to choose between neurological and circulatory standards. 

  User's clearly spotted the problem: their policy is a patchwork. I should emphasize that while the hypothalamic case is solvable (by noting it's not in standard criteria), the underlying inconsistency needs addressing. Might want to suggest they develop a unified framework before another edge case bites them. 

  ...And keep it under 500 words. Coffee's getting cold.
answer: |-
  Here's your breakfast briefing:

  ### Rules Fitting Your Precedents
  1.  **Brain Death (Brainstem Standard):** Death = irreversible loss of *all* brainstem function (coma, absent reflexes, apnea). **Fits:** Case 1 (textbook), Case 3 (rejected - brainstem intact). **Predicts:** *Death* for the new case (hypothalamus irrelevant; brainstem criteria met).
  2.  **Circulatory-Respiratory Standard:** Death = irreversible cessation of circulatory & respiratory functions. **Fits:** Case 2 (cardiac arrest), Case 4 (DCD). **Predicts:** *Alive* for the new case (heart/lungs functioning).
  3.  **Whole Brain Standard:** Death = irreversible loss of *all* functions of the *entire* brain, including brainstem *and* higher centers. **Fits:** Case 1 (assumed whole brain loss), Case 3 (rejected - brainstem intact, explicit cortex loss not enough). **Predicts:** *Alive* for the new case (hypothalamus function = brain function).

  ### Shaky Precedents
  *   **Case 3 (PVS):** Explicitly rejects consciousness/cortex as the *sole* criterion, emphasizing *brainstem* life-sustaining function. This clearly leans towards Brainstem Death or Whole Brain, *not* a higher brain standard.
  *   **Case 4 (DCD):** Uses circulatory standard, not neurological. This is a fundamentally different rule than Case 1.

  ### The New Case Prediction & Why
  *   **Best Guess:** Your committee will declare **Death**.
  *   **Why:** 
      *   **The Hypothalamus isn't part of standard brain death testing.** Clinical criteria (coma, reflexes, apnea) focus on brainstem function. Intact hypothalamic function (temperature/ADH) is a known variant *not* invalidating diagnosis where the legal/medical standard is brainstem death. 
      *   **Transplant Pressure:** The team is keen, family is on board. Declaring death enables donation.
      *   **Precedent Alignment:** Case 1 is your closest match. Accepting this aligns with declaring death based on brainstem criteria alone.

  ### The Best Test Case to Differentiate Rules
  *   **Scenario:** A patient suffers sudden cardiac arrest (V-fib) *in-hospital*. CPR starts immediately. After 20 minutes of ACLS, ROSC is achieved. However, neurological exam post-ROSC shows **complete absence of brainstem reflexes and coma**, meeting *clinical* brain death criteria *before* the heart stops again. The heart stops 1 hour later despite maximal support.
  *   **Why it Differentiates:** 
      *   **Brainstem Standard:** Death declared at the *first* meeting of brain death criteria (after confounding factors ruled out).
      *   **Whole Brain Standard:** Might also declare death neurologically *if* hypothalamic/pituitary function also lost (often is in such cases). If not, waits for circulatory stop.
      *   **Circulatory Standard:** Death declared *only* after irreversible cardiac arrest, regardless of neurological state.

  ### Key Takeaway
  Your committee uses **multiple standards**: **Brainstem Death** (Case 1, likely New Case), **Circulatory Death** (Cases 2 & 4), and explicitly **not Higher Brain Death** (Case 3). The New Case highlights how the *hypothalamus* isn't part of standard brain death protocols. The shaky ground is using fundamentally different definitions (neurological vs. circulatory) without a single, consistently articulated policy. You *need* a unified policy statement.
