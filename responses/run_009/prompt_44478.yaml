prompt: |-
  I'd like your help adjudicating a dispute that broke out in my reading group, which this term has been working through topics in collective decision-making. The proximate occasion was a decision by our department to switch a certain hiring committee from a consensus rule to a simple majority vote; a colleague had cited the Condorcet jury theorem in defense of the change, and two members of the group — I'll call them R. and J. — took opposite sides and were still at it when the room emptied. I'll reconstruct the exchange in numbered steps, as close to how it happened as I can manage.

  (1) R. opened by claiming the theorem amounts to a near-mathematical vindication of majority rule: if each of n voters is even slightly more likely than not to judge correctly, the probability that the majority judges correctly climbs toward certainty as n grows. A hundred voters each right 60% of the time, R. said, produce a majority that is right roughly 97% of the time, which is why enlarging the committee and taking a vote should appeal to anyone who cares about tracking the truth rather than whoever shouts loudest.

  (2) J. replied that the theorem is being sold under false pretenses: it assumes the voters' verdicts are independent of one another, and committee members plainly are not independent draws — they read the same dossier, absorb the same departmental folklore, and chat in the hallway before the vote. Citing the theorem for a real committee is, in J.'s words, like citing a frictionless-plane result to sell a particular car.

  (3) R. answered that J. has the assumption wrong: the theorem doesn't require unconditional independence of verdicts, it requires independence conditional on the state of the world — given that the candidate is the right hire (or isn't), each member's error should be an independent event, the way jurors might each separately miss or catch the decisive fact. Shared good evidence is no threat to this; only shared causes of error are. That, R. claimed, is exactly why real juries are sequestered and instructed not to deliberate before voting: the practice is an institutional attempt to secure the conditional independence the theorem needs.

  (4) J. said this concession gives the game away: for actual committees the dominant causes of error are common — everyone works from the same file, the same talk, the same parochial tastes — so the number of effectively independent judgments is tiny, and the twelfth member adds almost nothing. The theorem's asymptotic promise is idle when a fifteen-person committee is functionally five people. Worse, J. continued, the theorem is symmetric: if members run even slightly below 50% competence, the majority's accuracy gets worse as the group grows, so quoting the theorem as praise for majorities presupposes precisely what is in dispute — that the average member sits on the right side of chance.

  (5) R. called the below-chance scenario a scarecrow: a committee whose members are systematically worse than a coin flip would be a bizarre institution, and in any case the theorem can be run with voters of differing competences — what matters is that the average exceeds one-half. The real point of the theorem, R. insisted, is not the specific numbers but the mechanism: majority rule is an error-correcting device, while a consensus rule can be held hostage by one stubborn member and never aggregates the private signals of the others at all.

  (6) J. closed by questioning whether those private signals even exist in a committee setting: most of a member's judgment is constituted by the shared evidence plus a residual of taste, so there is less to aggregate than the mechanism requires, and the theorem is true of a world that R. merely wishes committees inhabited. R. retorted that if that were right, the department should abolish committees outright, which J. did not seem prepared to recommend.

  Please adjudicate this move by move. For each of the six steps, say who is right about what, flag any errors of mathematics or of interpretation (including in the numerical claims), and note where either party is trading on an ambiguity. Then, when the dust settles, tell me: does the theorem, properly stated, give the department any genuine reason to prefer majority vote to consensus on this committee — and if so, what exactly is that reason, and what would have to be true of the committee for it to apply? I'd also like to know what, if anything, both of them missed.
reasoning: |-
  I need to adjudicate this dispute about the Condorcet jury theorem and its application to a hiring committee switching from consensus to majority vote. I'll go through each of the six steps, point out who's right, identify errors, and note ambiguities. Then, I'll conclude whether the theorem gives a reason to prefer majority vote and what conditions must hold.

  First, let's recall the Condorcet jury theorem. It states that if each voter has a probability p > 0.5 of making a correct decision, and all voters decide independently, then the probability that the majority makes the correct decision approaches 1 as the number of voters increases. Also, for a fixed n, if p > 0.5, majority rule is better than any single voter.

  Now, step by step:

  **Step 1:** R. claims that the theorem shows majority rule is superior with many voters. R. gives an example: 100 voters each with p=0.6, majority correct about 97% of the time. I need to check if that's accurate.

  The probability of a correct majority for n voters each with p can be calculated using the binomial distribution. For large n, it approximates a normal distribution. The mean is n*p, variance n*p*(1-p). For majority correct, we need more than n/2 correct votes.

  For n=100, p=0.6, mean is 60, variance 100*0.6*0.4=24, std dev about 4.899. Majority requires at least 51 correct? No, for n=100, majority is at least 51 votes for the correct choice.

  Probability of majority correct: P(X ≥ 51) where X~Bin(100,0.6)

  Since 60 > 50, it's high. We can use normal approximation.

  Z = (50.5 - 60)/4.899 ≈ (-9.5)/4.899 ≈ -1.939

  P(Z ≥ -1.939) = P(Z ≤ 1.939) ≈ 0.9738 (from standard normal table)

  So about 97.38%, yes, roughly 97%. So numerically correct.

  R. is right that the theorem supports majority rule under these assumptions.

  **Step 2:** J. says the theorem assumes independence, which is unrealistic for committees because they share evidence and interact.

  J. is correct that independence is a key assumption, and in real committees, votes are not independent due to common evidence and deliberation. The theorem requires statistical independence of votes given the state.

  J. uses an analogy to a frictionless plane, which is apt for illustrating idealized conditions.

  **Step 3:** R. clarifies that the theorem requires conditional independence given the state, not unconditional. That is, given that the candidate is good (or not), each voter's judgment is independent.

  R. is right about the assumption. The independence is conditional on the state of the world.

  Shared evidence isn't a problem if it affects all voters similarly but doesn't introduce dependence beyond that; conditional independence means that given the state, the probabilities are independent.

  R. gives the example of juries being sequestered to prevent communication that might violate conditional independence.

  This seems valid. Conditional independence allows for common causes like shared evidence, as long as, given the truth, errors are independent.

  **Step 4:** J. responds that in practice, common causes of error dominate, so effective n is small, and adding members adds little. Also, J. points out that if p<0.5, majority does worse as group grows, and using the theorem assumes p>0.5, which is disputed.

  First, about common causes: J. has a point. If there are shared biases or common misleading evidence, then conditional on the state, errors might not be independent. For example, if everyone misinterprets the same piece of evidence in the same way, then errors are correlated, even conditionally.

  The theorem assumes that given the state, the votes are independent. If there's a common cause of error that affects everyone similarly, that violates conditional independence.

  For instance, if the dossier is misleading, everyone might be wrong together.

  So J. is right that shared parochial tastes or common evidence can lead to correlated errors, reducing the effective number of independent judgments.

  J. also mentions that the theorem is symmetric: if p<0.5, majority accuracy decreases with n, approaching 0.

  That's correct. If each voter is worse than random, majority vote almost surely gets it wrong.

  And J. says that citing the theorem as supporting majorities presupposes p>0.5, which may not be true.

  That's a valid point. The theorem doesn't prove p>0.5; it assumes it.

  **Step 5:** R. says the below-chance scenario is a scarecrow—unrealistic for committees. Also, R. notes that voters can have different competences, and the average p needs to be above 0.5. Moreover, R. argues the key point is that majority rule aggregates information and corrects errors, while consensus can be blocked by one person.

  First, the p<0.5 case: R. says it's unlikely for a committee to be systematically worse than random. That might be true, but it's possible if there's a strong bias. Still, for hiring committees, we might assume p>0.5 on average, but it's not guaranteed.

  The theorem can be extended to heterogeneous competences. If the average p > 0.5, and independence holds, the probability of majority correct still approaches 1, though it depends on the distribution. With different p_i, it's not always true that majority rule is better, but under certain conditions it still works.

  R. is right that majority rule can be seen as an error-correcting mechanism, leveraging the law of large numbers.

  Consensus rule: if one person can block consensus, that might prevent a correct decision if that person is wrong. So majority rule might better aggregate diverse opinions.

  **Step 6:** J. questions whether private signals exist; much of judgment is shared evidence plus taste, so less to aggregate. J. implies the mechanism requires independent signals.

  R. retorts that if so, committees should be abolished, which J. doesn't want.

  The theorem does rely on the idea that each voter has a private signal about the truth, and these signals are independent given the state.

  In committees, if judgments are based on the same evidence, the "private signal" might be small, or the residual variation might be due to taste rather than truth-tracking.

  Taste differences don't help with truth-tracking; they might introduce noise not related to correctness.

  So J. has a point: if there's little independent truth-tracking signal, aggregating might not help much.

  R.'s point about abolishing committees is a bit extreme; committees might still be useful for deliberation or legitimacy, even if voting isn't optimal.

  Now, to adjudicate:

  **Step 1:** R. is correct about the numerical claim and the theorem's implication under assumptions. No error.

  **Step 2:** J. is correct that independence is often violated, and the analogy is good. But J. might be missing the conditional part, though in context, it's about real-world dependence.

  **Step 3:** R. is right about conditional independence. Shared evidence alone doesn't violate it, but can if it causes correlation. Sequestering juries is indeed to maintain independence.

  **Step 4:** J. is right that common causes of error can violate conditional independence, reducing effective n. Also, correct about the symmetry and that assuming p>0.5 is key.

  **Step 5:** R. is partially right that p<0.5 is unlikely, but it's possible. Heterogeneous competences: average p>0.5 is sufficient under independence. The error-correcting point is valid. Consensus rule vulnerabilities are real but separate from the theorem.

  **Step 6:** J. raises a good point about the existence of private signals. If judgments are mostly shared, aggregation adds little. R.'s retort is rhetorical but highlights that if no independent judgment, voting might not be useful.

  **Ambiguities:**

  - "Independence": Unconditional vs. conditional. R. clarified in step 3.

  - "Competence": p>0.5 assumes voters are truth-trackers. If judgments include taste, p might not be defined, or it's not about correctness.

  - "Private signals": The theorem assumes each voter has an independent signal correlated with truth. In committees, signals might not be independent or might not exist.

  **Does the theorem give a reason to prefer majority vote?**

  The theorem, properly stated, shows that if (a) each member has p>0.5, (b) votes are independent conditional on the state, and (c) n is large, then majority vote is highly accurate.

  For the department, if these conditions hold, majority vote should track truth better than individual judgment or consensus.

  But consensus rule might not aggregate signals at all, as R. said, so majority could be better even with small n.

  Conditions for application:

  - Committee members must be better than random on average at judging the correct hire.

  - Their judgments must be independent given the true quality of the candidate. This could be undermined by groupthink, common biases, or pre-vote discussions that align errors.

  - n should be sufficiently large for the probability to be high.

  If conditional independence is violated, the group accuracy might be lower.

  Also, if p<0.5, majority is worse.

  In practice, for hiring committees, members might have p>0.5, but conditional independence is tricky.

  The department might prefer majority to avoid stalemates in consensus, but that's practical, not from the theorem.

  What both missed:

  - Deliberation: The theorem assumes voting without deliberation. In real committees, deliberation might improve individual competence or introduce dependence.

  - Heterogeneous competences: R. mentioned it, but the theorem with different p_i requires care; sometimes a smaller group of experts might be better.

  - Endogenous competence: p might depend on the voting rule or group size.

  - The truth-tracking goal: The theorem assumes a single correct answer, but in hiring, there might be multiple dimensions or subjective elements.

  For the department, the theorem suggests that majority vote could be better if the committee has diverse, independent judges each with reasonable competence. But if judgments are highly correlated, enlarging the committee might not help much.

  The change from consensus to majority might reduce the influence of any single stubborn member, as R. said.

  So, the theorem provides a reason if the conditions are met, but it doesn't prove that they are met.

  **Adjudication:**

  - Step 1: R. correct.

  - Step 2: J. correct about independence issue, but didn't specify conditional.

  - Step 3: R. correct about conditional independence.

  - Step 4: J. correct about common causes and symmetry.

  - Step 5: R. partially correct; below-chance unlikely but possible. Error-correcting valid point.

  - Step 6: J. has a point about signals; R.'s retort is weak.

  Overall, both have valid points, and the theorem is useful but with caveats.
answer: |-
  ### Adjudication of the Dispute

  I'll address the exchange move by move, as requested. For each step, I'll summarize the key claims, indicate who is right about what, flag any mathematical or interpretive errors, and note ambiguities or nuances. After that, I'll provide an overall assessment of whether the Condorcet jury theorem supports the department's switch to majority vote, under what conditions, and what both parties missed.

  The Condorcet jury theorem (CJT) is central here. In its standard form, it states:
  - If each of \(n\) voters has an independent and identical probability \(p > 0.5\) of making a correct judgment about a binary choice (e.g., "right hire" or "wrong hire"),
  - And if their judgments are statistically independent conditional on the true state of the world (i.e., given that the candidate is truly qualified or not, each voter's decision is independent),
  - Then the probability that the majority makes the correct decision approaches 1 as \(n\) increases.
  - With heterogeneous competences (voters have different \(p_i\)), the result holds if the average competence \(\bar{p} > 0.5\) and other conditions (e.g., independence) are met.

  The theorem is about truth-tracking: it shows how majority rule can amplify individual accuracy under ideal conditions. However, it relies on strong assumptions that may not hold in real committees.

  ---

  ### Step-by-Step Adjudication

  **Step 1: R.'s Opening Claim**  
  - **R.'s claim:** The CJT "vindicates" majority rule, with the example that 100 voters each 60% competent yield a majority correct ~97% of the time. Enlarging the committee improves truth-tracking.
  - **Who is right?** R. is mathematically correct about the CJT's implications under its assumptions. The numerical claim is accurate: for \(n = 100\), \(p = 0.6\), the binomial probability of a correct majority (at least 51 votes) is indeed approximately 97.4% (calculated via normal approximation or exact binomial methods). R. is also right that the CJT provides a theoretical basis for majority rule as a truth-tracking tool.
  - **Errors or issues:** None in the math. However, R. oversimplifies by implying the CJT is a "near-mathematical vindication" without acknowledging its assumptions. The theorem doesn't inherently favor majority rule over consensus; it just shows how majority rule can outperform individuals under specific conditions. Consensus isn't directly addressed here.
  - **Ambiguity:** R. uses "judge correctly" vaguely—it assumes a binary, objective truth (e.g., "correct hire"), which may not fully capture hiring decisions involving values or trade-offs.

  **Step 2: J.'s Response on Independence**  
  - **J.'s claim:** The CJT assumes independence, which is unrealistic for committees due to shared evidence, folklore, and pre-vote discussions. Citing it is like using a frictionless-plane model for a real car.
  - **Who is right?** J. is correct about the independence assumption being critical and often violated in practice. Committees do share evidence and interact, which can create dependence. The frictionless-plane analogy is apt for highlighting the idealization.
  - **Errors or issues:** J. describes independence as "unconditional," but the CJT requires conditional independence (given the state). This is a minor error of interpretation: J. misses that shared evidence alone doesn't necessarily violate conditional independence (as R. clarifies next). However, J. is right that real-world committees often have unconditional dependence (e.g., from group dynamics), which can imply conditional dependence.
  - **Ambiguity:** "Independence" isn't specified—J. conflates unconditional dependence (e.g., correlated votes due to discussion) with conditional dependence (e.g., correlated errors given the truth). The latter is more relevant to CJT.

  **Step 3: R.'s Clarification on Conditional Independence**  
  - **R.'s claim:** The CJT requires independence conditional on the state, not unconditional independence. Shared evidence isn't a threat; only shared causes of error are. Real juries sequester to preserve conditional independence.
  - **Who is right?** R. is correct about the assumption: CJT requires votes to be independent given the true state (e.g., given the candidate's quality, each member's judgment is unaffected by others). Shared evidence (e.g., a common dossier) can be consistent with this if it doesn't induce correlation in errors. R. is also right that sequestering juries aims to secure conditional independence by preventing deliberation from creating dependence.
  - **Errors or issues:** No mathematical errors. R. is right that conditional independence allows for common evidence, but they downplay how easily it can be violated. For example, if the shared evidence is ambiguous or misleading, it can cause correlated errors given the state (undermining the assumption). Sequestering helps but isn't foolproof.
  - **Ambiguity:** R. says "shared good evidence is no threat," but this depends on how evidence is processed. If all members interpret evidence similarly due to shared biases, conditional independence fails.

  **Step 4: J.'s Rebuttal on Common Causes and Symmetry**  
  - **J.'s claim:** Common causes of error (e.g., shared file, tastes) make the effective number of independent judgments small, so adding members adds little. Also, CJT is symmetric: if \(p < 0.5\), majority accuracy declines with \(n\), and citing CJT assumes \(p > 0.5\), which is disputed.
  - **Who is right?** J. is largely correct. First, if common causes (e.g., groupthink or shared biases) create conditional dependence, the "effective \(n\)" is reduced, diminishing the benefit of more voters. The point about symmetry is mathematically accurate: if \(p < 0.5\), the probability of a correct majority approaches 0 as \(n\) grows. J. is also right that citing CJT as supporting majorities presumes \(p > 0.5\), which isn't proven by the theorem and may not hold.
  - **Errors or issues:** No math errors. J.'s numerical example (15 people acting like 5) is illustrative but not rigorous—effective \(n\) depends on the correlation structure, not a fixed ratio. J. overgeneralizes slightly by implying common causes always dominate, but it's a valid practical concern.
  - **Ambiguity:** J. uses "dominant causes of error are common," which might conflate common evidence (not necessarily a problem) with common biases (a problem). Also, "functionally five people" is a metaphor; no formal method is given.

  **Step 5: R.'s Defense of Mechanism and Competence**  
  - **R.'s claim:** The below-chance scenario (\(p < 0.5\)) is a "scarecrow" (unrealistic). CJT works with differing competences if average \(p > 0.5\). Majority rule is error-correcting, while consensus can be "held hostage" by one member and fails to aggregate signals.
  - **Who is right?** R. is partially right. The \(p < 0.5\) case is unlikely for a functional committee but not impossible (e.g., systematic biases could make \(p < 0.5\)). On heterogeneous competences, R. is correct: CJT can extend to voters with different \(p_i\) if the average \(\bar{p} > 0.5\) and other conditions hold. R. is also right that majority rule can correct individual errors (via the law of large numbers), and consensus may indeed fail to aggregate diverse signals if one member blocks agreement.
  - **Errors or issues:** R. calls \(p < 0.5\) a "bizarre institution," but this is debatable—committees can have systematic flaws. The error-correcting point is valid but assumes signals are independent and truth-tracking, which J. challenges. R.'s consensus critique is practical, not directly from CJT.
  - **Ambiguity:** "Error-correcting device" implies CJT's mechanism, but it requires independent signals. R. doesn't address how competence might change with group size or rule.

  **Step 6: J.'s Skepticism on Private Signals and R.'s Retort**  
  - **J.'s claim:** In committees, "private signals" may not exist; judgment is mostly shared evidence plus taste, so there's less to aggregate. CJT assumes a world that doesn't apply.
  - **R.'s retort:** If no private signals, abolish committees—but J. doesn't recommend that.
  - **Who is right?** J. raises a valid concern: CJT assumes each voter has an independent, truth-tracking signal, but in committees, judgments often derive from shared evidence, with "taste" (idiosyncratic preferences) adding noise not correlated with truth. If signals aren't truth-tracking or independent, aggregation may not help. R.'s retort is weak: committees exist for reasons beyond truth-tracking (e.g., deliberation, legitimacy), so abolishing them is a false dilemma. R. also misses that taste-based variation can make \(p\) undefined or low.
  - **Errors or issues:** J. is right that "taste" isn't truth-tracking, so if it dominates, CJT's competence assumption (\(p > 0.5\)) may not hold. R.'s retort ignores that committees can still be useful for non-CJT reasons.
  - **Ambiguity:** "Private signals" vs. "shared evidence": CJT requires independent signals given the state, but shared evidence can be part of a common signal if processed independently. "Taste" introduces subjectivity, which CJT doesn't handle.

  ---

  ### Overall Assessment: Does the CJT Support the Switch to Majority Vote?

  **The CJT provides a *conditional* reason to prefer majority vote, but it is not a decisive vindication.** Specifically:
  - **What the theorem offers:** If the committee satisfies the CJT assumptions—(a) members have an average competence \(\bar{p} > 0.5\) (i.e., they are better than random at judging the truth), (b) judgments are conditionally independent given the true state, and (c) \(n\) is sufficiently large—then majority vote has a high probability of correctness and is superior to individual judgment. It also indirectly supports majority rule over consensus in that consensus may fail to aggregate signals (e.g., one member can force unanimity, ignoring diverse information).
  - **Why it might support the change:** The department could see majority vote as an "error-correcting" mechanism that harnesses diverse inputs, reduces the risk of deadlock, and mitigates individual biases or stubbornness under the right conditions. R.'s point (Step 5) about consensus being "held hostage" is practical and aligns with CJT's aggregation logic.
  - **Limitations and conditions:** 
    - For CJT to apply, the committee must have:
      - **Truth-tracking competence:** Members must be marginally competent on average (\(\bar{p} > 0.5\)) for the binary decision. This may not hold if biases are strong or the decision involves subjective "taste."
      - **Conditional independence:** Votes must be independent given the true state. This fails if there are common causes of error (e.g., shared misleading evidence, groupthink, or pre-vote discussions that align judgments). Sequestering or private voting could help, but it's hard to ensure.
      - **Sufficient size:** \(n\) must be large enough for the probability gain to be meaningful (e.g., with \(p = 0.6\), \(n = 10\) gives ~75% majority accuracy, not 97%).
    - If these fail (e.g., high correlation or \(\bar{p} < 0.5\)), majority vote may perform poorly, and consensus could be better for building buy-in or handling complex decisions.
  - **Does it genuinely support the change?** Yes, but weakly. CJT shows that majority vote *can* improve accuracy under ideal conditions, which might motivate the switch. However, it doesn't prove that these conditions hold for the department. The theorem is more relevant to truth-focused decisions (e.g., factual judgments) than value-laden ones (e.g., hiring based on fit). In practice, the switch might be justified more by efficiency (avoiding consensus deadlock) than CJT alone.

  **What Both Parties Missed:**
  - **Deliberation's role:** CJT assumes no deliberation, but real committees often deliberate, which can improve individual competence (raise \(p\)) or create dependence. Deliberation might make consensus more accurate than voting in some cases.
  - **Heterogeneity and real-world adjustments:** With diverse \(p_i\), a smaller expert subgroup might outperform a larger majority. Also, CJT extensions (e.g., with correlated votes) show that correlation reduces effective \(n\), but it doesn't eliminate gains if \(\bar{p} > 0.5\).
  - **Beyond truth-tracking:** Hiring committees may aim for fairness, diversity, or acceptability, not just truth. Consensus might serve these better. CJT is silent on this.
  - **Empirical evidence:** Real-world studies (e.g., from psychology or political science) show mixed CJT applicability: correlated votes and competence variations often weaken its predictions.
  - **Alternatives:** Neither discussed hybrid approaches (e.g., deliberation followed by voting) or how the voting rule affects member incentives (e.g., majority might encourage free-riding).

  **Final Verdict on the Dispute:**  
  R. and J. each have valid points, but both oversimplify. R. is right about CJT's mathematical promise and the risk of consensus deadlock, but underappreciates how real committees violate CJT assumptions. J. is right about the fragility of independence and competence assumptions, but overstates the theorem's irrelevance. The department should consider CJT as one factor: if the committee can foster independence and competence (e.g., through private votes or diverse expertise), majority vote may improve decisions. However, they should also assess correlation risks (e.g., via post-hoc analysis of past votes) and consider non-CJT reasons for the change (e.g., efficiency).
