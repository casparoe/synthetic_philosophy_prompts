  The core issue is explaining why some technically true or probable assertions feel wrong. For example, asserting a lottery loss feels improper despite high probability, while a doctor's incorrect diagnosis based on good evidence doesn't feel like a norm violation. This suggests a desideratum distinguishing between epistemic responsibility and mere truth.

  The user hints at possible conflicts, like between desideratum 6 (allowing reasonable false assertions) and desideratum 2 (explaining lottery impropriety). A norm requiring knowledge might handle lottery cases but fail the doctor example, while a credence-based norm might do the opposite. This tension needs to be explicit.

