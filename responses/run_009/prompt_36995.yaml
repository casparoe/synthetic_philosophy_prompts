  Desiderata should include:
  1. **Explaining Propriety Conditions**: Why some assertions feel proper/improper beyond truth.
  2. **Lottery Impropriety**: High probability isn't sufficient.
  3. **Gettier Cases**: Justified true belief isn't always proper.
  4. **Moorean Absurdity**: Explaining why certain combinations are unassertable.
