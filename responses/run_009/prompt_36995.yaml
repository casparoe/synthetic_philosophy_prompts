prompt: |-
  i've been lurking since the over coming bias days and one thing i've noticed is we basically reinvented the norms of assertion debate without noticing -- every "how confident do you need to be before you tell someone something" thread, every argument about whether it's ok to state a 70% credence as flat fact, every "you said X, you were wrong, apologize" vs "i was calibrated, my credence was right even though the world came up tails" fight. so before i go read the actual philosophy literature (timothy williamson has a whole thing about this apparently), i want the spec first. write me the desiderata: what any adequate norm of assertion -- whether it's knowledge, truth, justified belief, reasonable credence, or something else -- has to get right. like, a norm isn't just "assert what's true," it has to explain why certain moves feel like cheating even when the factual content is fine.

  the cases i can think of off the top of my head that it has to handle, but you should add ones i'm missing: lottery tickets (you have a losing ticket, 99.99% credence you lost, but something feels wrong about flatly asserting "you lost" -- why?), the gettier-adjacent guy who has justified true belief and asserts it happily, moore-paradoxical assertions ("p but i don't believe p" -- true, maybe, but unassertable?), self-assertion and prediction markets (can you assert about your own future assertions), and what happens with hedging (does "i think p, 60% confidence" count as an assertion at all or a different speech act, and if the latter does the norm only apply to flat assertion -- which seems to let people launder low-credence claims through hedges and then act like they called it).

  also want you to say which desiderata are actual requirements vs tribal shibboleths -- e.g. is "compatible with the norm being non-accidentally governed by our practice" a real constraint or just a way of sneaking knowledge in through the back door? and is there a subset that can't be jointly satisfied? my hunch is the lottery case and the "assertions can be proper even when false" case (we don't think a doctor with good evidence giving a wrong diagnosis violated the norm in the same way a liar did) pull in opposite directions, but i want to see if that's right or whether a clever norm gets both. no need to do a full scorecard of the existing norms at the end, just a sentence on which requirement does the most to knock out the leading candidates -- the criteria are the part i actually want to think about. ty!
