  The user lists several cases that the norm must handle: lottery paradoxes, Gettier cases, Moore's paradox, self-assertion, prediction markets, and hedging. They also want to distinguish between genuine requirements and tribal shibboleths, and explore whether some desiderata conflict, like the lottery case vs. false but reasonable assertions.

