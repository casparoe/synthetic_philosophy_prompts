answer: |-
  Here's a distilled set of desiderata for a norm of assertion, derived from the core puzzles and functional requirements your cases highlight. These aim to capture what a norm *must* explain to be adequate, separating genuine constraints from tribal artifacts. I've grouped them by core function and flagged tensions.

  ### Core Desiderata (What the Norm Must Explain)
  1.  **The Impropriety of "Lucky Truths":** Must explain why asserting a lottery loss (even with 99.99% credence) feels intuitively *improper* or "cheating," despite the high probability and eventual truth. A mere truth or high credence norm fails here.
  2.  **The Propriety of Reasonable Falsehoods:** Must explain why a doctor asserting a diagnosis based on excellent evidence and standard practice, which turns out *wrong*, typically **does not** warrant the same blame/impropriety as a lie or a reckless guess. The norm must accommodate reasonable error without collapsing into "anything goes." (This directly tensions with desideratum #1).
  3.  **Gettier Vulnerability:** Must explain why someone asserting a Gettiered justified true belief (e.g., "Jones owns a Ford" based on seeing him drive one, but Jones just sold it and the new owner happens to be driving it) feels intuitively *defective* or challengeable *even if justified and true*. A simple truth or justified belief norm fails here.
  4.  **Moorean Unassertability:** Must explain the profound impropriety/absurdity of asserting Moorean sentences like "It's raining but I don't believe it" or "P but I have no idea if P is true." This seems fundamental to the link between assertion and the asserter's state of mind.
  5.  **The Hedging Distinction & Laundering Risk:** Must clarify the status of hedged assertions ("I think P, ~60%"). Does the norm apply? If not, the norm risks being toothless (allowing laundering: hedge a low-credence claim, later claim vindication if true). If it *does* apply, what does it require? The norm must either govern hedging explicitly or provide a principled reason why hedging is a distinct act *and* prevent systematic laundering.
  6.  **Self-Reference and Predictions (Including Self-Assertion):** Must handle assertions about one's own future assertions or mental states ("I will assert P tomorrow," "I believe Q now"). Does the norm apply the same way? Can asserting "I will assert P tomorrow" be proper if asserting P tomorrow would be improper? This tests the norm's reflexivity and scope.

  ### Functional/Systemic Desiderata (Norms in Practice)
  7.  **Governance & Blame/Excuse Structure:** Must generate a plausible account of *when and why* challenge, blame, requests for justification, retraction, or apology are appropriate. This includes explaining the difference in *kind* of blame between lying (intentional deception), being recklessly wrong (violating the norm), and being reasonably wrong (not violating the norm, per #2).
  8.  **Retraction Obligation:** Must explain why we feel obligated to retract an assertion proven false, *even if* it seemed reasonable when made. A simple truth norm makes this trivial, but other norms (e.g., knowledge) need to explain it, and credence norms might struggle.
  9.  **Expressibility of Credence:** Must allow for the legitimate expression of uncertainty (hedges, explicit credences) *without* requiring every assertion to be flat. A norm that collapses "I think P (60%)" into the same category as flat "P" is likely flawed.

  ### Potential Shibboleths / Tribal Artifacts (Questionable "Requirements")
  10. **Non-Accidental Governance (The Williamsonian Hook):** *"Compatible with the norm being non-accidentally governed by our practice."* **Status: Likely Shibboleth.** This often functions as a Trojan horse for the Knowledge Norm. While a norm shouldn't be *mysterious* or *utterly alien* to practice, demanding "non-accidental governance" is often code for requiring the norm to *be the rule speakers consciously or subconsciously follow*. This is empirically dubious and unfairly privileges internalist/accessibilist norms or specific conceptual analyses (like Williamson's). A good norm might *explain* the practice without being its direct object.
  11. **Exclusive Focus on Flat Assertion:** *"The norm only applies to flat assertions, hedges are totally different."* **Status: Dangerous Shibboleth/Laundering Risk.** Treating hedging as a completely distinct speech act with no normative connection to assertion proper creates a massive laundering loophole and fails desideratum #5. While hedges might have distinct *features*, a robust theory needs to relate their norms to the core assertion norm.
  12. **Requiring Infallibility:** *"A proper assertion must be indefeasible/certain."* **Status: Clear Shibboleth.** This is implausible and fails desideratum #2 spectacularly. No serious contender does this.

  ### Key Tensions & Which Desiderata Bite Hardest
  *   **The Fundamental Tension:** Desideratum **#1 (Lottery Impropriety)** and Desideratum **#2 (Reasonable Falsehoods Propriety)** are the core antagonists. Any norm strict enough to explain why high probability isn't sufficient for propriety (#1 - Lottery) risks making reasonable false assertions (#2 - Doctor) improper. Conversely, any norm lax enough to permit reasonable false assertions (#2) struggles to explain why lottery assertions feel wrong (#1). **This is the main battleground.**
  *   **The Knowledge Norm Killer:** Desideratum **#2 (Reasonable Falsehoods Propriety)** is the primary killer for the **Knowledge Norm**. If knowledge is required, the doctor asserting reasonably but falsely *violates the norm*, inviting strong blame – which clashes deeply with intuition. Gettier cases (#3) also challenge it, but #2 is more visceral.
  *   **The (Simple) Truth/Justified Belief Norm Killer:** Desideratum **#1 (Lottery Impropriety)** demolishes simple **Truth Norms** and simple **Justified Belief Norms**. The lottery assertion is (presumed) true and (highly) justified, yet improper.
  *   **The Credence Threshold Norm Killer:** Desideratum **#1 (Lottery Impropriety)** also challenges simple **Credence Threshold Norms** (e.g., "Assert if credence > 95%"). If 99.99% isn't enough for a lottery loss, where is the threshold? Desideratum **#3 (Gettier Vulnerability)** is also tough – a Gettiered belief can have high justified credence yet feel assertively defective. Desideratum **#4 (Moorean Absurdity)** is tricky if credence is high in the second conjunct.
  *   **The Governance Wildcard:** While flagged as a potential shibboleth (#10), if a norm *can* satisfy the core desiderata *and* plausibly explain how it guides/underpins practice without being mystical, it gains strength. But it shouldn't be the *first* filter.

  ### Summary of the Challenge
  An adequate norm must thread a needle: be **stricter than truth/justification/high-credence** (to handle Lottery/Gettier/Moore) but **more forgiving than infallibility/knowledge** (to handle Reasonable Falsehoods). It must seamlessly integrate the **role of the asserter's state/responsibility** (Moorean Absurdity, Blame Structure) and handle the **spectrum of certainty** (Hedging, Expressibility) without creating loopholes. The Lottery (#1) vs. Doctor (#2) tension is the hardest nut to crack – any norm resolving *that* elegantly has a strong claim. Williamson tackles it by biting the bullet on #2 (doctor *does* violate the norm, but perhaps blamelessly), which many find unsatisfying. Your hunch about the core tension is spot on. Good luck diving into the literature – the desiderata map will help you navigate the arguments!
