  Hmm, first I need to construct twin cases that isolate distribution as the sole variable. For realism, I'll make them working vessels - say a tall ship for Ship A with deck/rigging replacements and a trawler for Ship B with keel/frame replacements. The percentages must match precisely to force materialists into claiming equal originality. 

