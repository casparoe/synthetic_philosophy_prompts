answer: |-
  Here’s the pair of cases, designed to isolate the *distribution* variable while holding everything else constant, followed by analysis addressing your requirements:

  ---

  ### **Ship A: "Wear-and-Tear Replacement"**  
  The *Endurance* is a 100-year-old sail-training tall ship. Over decades, 70% of its original timber has been incrementally replaced during routine maintenance. All replaced parts were high-wear, non-structural components: deck planks sanded smooth by countless boots, sun-bleached rail caps, corroded fastenings, frayed rigging, and cracked hatch covers. The keel, ribs, stem, and sternpost—the skeleton defining its hull’s shape and strength—remain entirely original. It sails daily, its identity unquestioned by the crew who maintain its traditions.

  ### **Ship B: "Structural Core Replacement"**  
  The *Resolute* is an identical-century-old sister ship. Over the same period, 70% of its original timber has also been replaced—but exclusively from critical structural elements. Its keel was spliced section by section after stress fractures appeared, its oak frames were sistered or swapped, and its stem was rebuilt following ice damage. Non-structural elements (decking, rails, etc.) are entirely original. Though identical in appearance and function, shipwrights whisper that it’s "more patch than original" beneath the surface.

  ---

  ### **Testing the Cases**  
  **Material-Only View ("Original Matter is What Matters"):**  
  Both ships retain exactly 30% original timber after identical replacement rates. This view *must* declare them equally "original" (or equally "replaced"). There’s no asymmetry—persistence is purely quantitative.  

  **Functional/Historical Continuity View:**  
  - **Ship A:** Maintains unbroken function and historical identity. Structural continuity preserves the vessel’s "essence" despite cosmetic changes. Crews see it as the same ship because its core *causal role* (load-bearing structure) remains intact.  
  - **Ship B:** Functional continuity exists but historical identity fractures. Replacing the load-bearing core disrupts the "narrative chain" holding the ship’s history together. Even if it sails identically, its *origin story* is compromised—the keel that was laid down 100 years ago no longer exists.  

  **The Crucial Variable:** It’s the **causal-structural role**, not mere organization. The keel/frames aren’t just "parts"; they’re the *physical basis* for the ship’s cohesion and persistence. Replace fasteners, and the ship holds itself together identically; replace the keel, and the ship’s structural continuity—its literal *self-maintenance*—is broken. We intuit that the ship’s persistence relies on this causal backbone.  

  **Emergency Refit Test:**  
  If Ship B’s keel is replaced in *one* emergency overhaul (same timber volume), the intuition strengthens. Sudden, trauma-induced replacement amplifies the discontinuity—it feels like a "death and rebirth" event. Materialists remain unmoved, but functionalists see a stark break in historical identity. The asymmetry *survives* but intensifies; timing amplifies the role of causal-structural continuity.  

  ---

  ### **Hobbes Bonus: Reassembly Test**  
  *Scenario:* Ship B’s original keel timbers are saved and later reassembled by a purist into a "new" hull, using replica non-structural parts.  

  **Analysis:**  
  - **Material View:** The reassembled keel-boat has more original *matter* (the keel) than Ship B (which retains only 30% non-keel original timber). Materialists might call this the "true" original.  
  - **Functional/Form View:** Nobody claims a timber pile is the ship. But once reassembled into a functional *keel-bearing structure*, intuition leans toward calling it "the original *Resolute*"—despite having no original decking or rigging. **Form dominates:** The keel’s reassembly restores the *structural essence* we anchor identity to. Matter alone is inert; form (especially load-bearing form) is identity-conferring.  

  ---

  ### **Critique & Defense**  
  **The Spatiotemporal Continuity Objection:**  
  A critic would argue: "Your cases *assume* structural parts are ‘essential’—that’s cheating! Spatiotemporal continuity (unbroken existence in space/time) is all that matters. Ship B is continuous whether its keel is replaced or not; there’s no ‘break’ in existence."  

  **Rebuttal & Honest Reflection:**  
  1. **Is it question-begging?** Partly. By labeling parts "structural," you’re foregrounding their role in persistence—which is precisely what’s being tested. *But* the asymmetry arises from pre-theoretical intuition: we *do* treat a ship’s keel as metaphysically weightier than its decking. The case exposes this intuition.  
  2. **Is it cheating?** Only if you deny that functional hierarchy exists. In real artifacts (and organisms!), parts *aren’t* equal: hearts aren’t fingernails. Your cases engineer a controlled test of that hierarchy—which is valid if grounded in how we *actually* attribute persistence.  
  3. **Vulnerability:** If spatiotemporal continuity is rigidly defined as "no temporal gap in existence," both ships qualify. But your point isn’t that Ship B *isn’t* continuous—it’s that **continuity feels less "authentic" when structural integrity is disrupted**. That’s the phenomenon needing explanation.  

  **Conclusion:** The pair is engineered to elicit the intuition—but only because the intuition *exists* in how humans parse artifacts. The asymmetry survives scrutiny because structural parts aren’t just matter; they’re the physical embodiment of an object’s *causal persistence*. Replace those, and you replace the "self" of the ship.  

  **Final Word:** The column’s sharpest insight isn’t that we care about "which parts"—it’s that we care about **which parts sustain the object’s autonomy**. Keels hold ships together; decks do not. That’s why Ship B feels like a betrayal.
