prompt: |-
  I'm a software engineer with no background in philosophy, and I lead a platform team of about forty engineers spread across three time zones. A recurring source of pain for us is what I'd casually call "but I told everyone" failures: a deprecation gets announced in a Slack channel, the deadline passes, and it turns out that some team never saw it, or saw it but assumed it applied to someone else, or assumed that we knew they hadn't seen it and would therefore give them an extension. We keep arguing about whether "posting an announcement" is sufficient notice or whether we need mandatory acknowledgments, design review sign-offs, response-required emails, and so on, and the disagreement always feels vibes-based. Someone recently told me that epistemic game theory has an actual literature on this kind of thing — the difference between everyone knowing a fact and it being common knowledge, some parable about generals or an electronic mail game where communication can never quite establish certainty, models where everyone assumes everyone else reasons a bounded number of steps — and I'd like that body of theory turned into something my team can actually use.

  Please act as a professional game theorist with a specialty in epistemic logic and common knowledge, who has spent time translating these ideas for engineering organizations. Before writing the procedure, do some structured brainstorming about which results and distinctions from the literature actually bear on coordinated action under imperfect communication, and which are mathematical curiosities that shouldn't survive contact with a chat app. Then write a decision procedure my team could run whenever we're about to rely on other teams having internalized some piece of information that affects a coordinated action — a migration deadline, a new on-call escalation path, a change to a shared interface, a freeze period. The procedure should consist of ordered questions to ask, criteria for what counts as a sufficient answer at each step, an explicit point at which it concludes "posting the announcement is enough," and an explicit point at which it concludes "you need forced acknowledgment, not just broadcast" — plus a marked zone where the question stops being about facts at all and is a judgment call about how much friction the org will tolerate, which a human has to own. Be honest about the ways the procedure will misfire.

  Finally, run the procedure on three concrete cases from my world: (1) announcing in a widely-followed channel that a legacy internal endpoint will be removed in two weeks; (2) a shift handoff between two on-call engineers where the incoming engineer must not just receive the handoff notes but know that the outgoing engineer knows the notes were received; and (3) a quarter-long migration where the deadline only works if every downstream team knows that every other downstream team knows the deadline, since the whole plan collapses if even one team delays. Include at least one case where the procedure yields an answer my team will find annoyingly bureaucratic, and explain why the theory nonetheless supports it. Please think carefully and take your time — I care much more about getting the reasoning right than about the length of the answer.
reasoning: |-
  We are going to design a decision procedure based on epistemic game theory and common knowledge. The key ideas we'll draw from include:

  1. **Mutual Knowledge vs. Common Knowledge**: 
     - Mutual knowledge of degree k: Everyone knows that everyone knows ... (k times) a fact.
     - Common knowledge: The fact is mutual knowledge for every k (infinite level). This is the gold standard for coordination.

  2. **The Coordinated Attack Problem (a.k.a. Generals' Problem)**:
     - Two generals need to coordinate an attack. Messages can be lost. Even if they send acknowledgments, there's always a chance the last message was lost, so common knowledge of the attack time is never achieved. This shows that without a perfectly reliable communication channel, common knowledge is impossible.

  3. **The Electronic Mail Game (Rubinstein, 1989)**:
     - Players might have different beliefs about what others know due to the possibility of message loss. This leads to a failure of coordination even when the probability of message loss is very low.

  4. **Bounded Reasoning**:
     - In practice, people don't reason to infinity. We can approximate common knowledge by achieving a sufficiently high level of mutual knowledge (e.g., "I know that you know that I know ..." up to a few levels).

  5. **Public Announcements and Salience**:
     - A public event (e.g., a loud announcement in a meeting) can create common knowledge because everyone sees everyone else seeing it.

  6. **Costly Signals and Forced Acknowledgments**:
     - Requiring a response (like an acknowledgment) can increase the level of mutual knowledge, but it doesn't necessarily achieve common knowledge (due to the possibility of the acknowledgment being lost or ignored). However, in practice, it can get us closer.

  We'll structure the procedure to ask questions that probe:

  - The criticality of the coordination: What happens if one party fails to act?
  - The level of mutual knowledge required: Is it enough that everyone knows, or do we need that everyone knows that everyone knows, etc.?
  - The reliability of the communication channel: Can messages be lost or missed?
  - The cost of failure vs. the cost of friction: How bad is a failure? How much bureaucracy can we tolerate?

  **Decision Procedure: "Common Knowledge Assessment for Coordination" (CKAC)**

  **Step 0: Define the Fact**
  - Clearly state the fact F that must be known for the coordinated action to succeed.

  **Step 1: Assess the Criticality of Perfect Coordination**
  - *Question*: What is the consequence if even one agent (or team) fails to act on F?
    - *Options*:
      - (a) Catastrophic: The entire coordinated action fails and there are severe consequences (e.g., system outage, security breach, major financial loss).
      - (b) Moderate: The action is degraded or delayed, but can be recovered with some effort.
      - (c) Minor: Inconvenience, but easily managed.
  - *Criteria*: 
    - If (a) or (b), proceed to Step 2.
    - If (c), then a simple broadcast (posting an announcement) is sufficient.

  **Step 2: Determine the Required Level of Mutual Knowledge**
  - *Question*: Is it sufficient that every agent knows F, or do we need that every agent knows that every other agent knows F (and so on)? Specifically, could the action fail because an agent thinks that others might not know F and therefore does not act?
    - *Examples*:
      - In the migration deadline (case 3): If one team thinks that others might not be ready, they might delay too (waiting for others to be ready), causing a chain reaction. Then we need at least mutual knowledge of degree 2 or more.
      - In the shift handoff (case 2): The incoming engineer must know that the outgoing engineer knows they have the notes to avoid duplicate work or dropped issues. This requires mutual knowledge of degree 2.
  - *Criteria*:
    - If the action can fail because of uncertainty about others' knowledge (i.e., a coordination failure due to higher-order uncertainty), then we need at least mutual knowledge of degree 2 or more. Proceed to Step 3.
    - If it is sufficient that each agent individually knows F (and acts independently, regardless of others), then a forced acknowledgment (ensuring each agent has acknowledged) might be enough. But note: forced acknowledgment only gives mutual knowledge of degree 1 (each knows F, and we know each has acknowledged, but they don't necessarily know that others have acknowledged). However, if we require a public acknowledgment (e.g., in a channel where everyone can see everyone else's acknowledgment), then we can build higher levels. So we might need to go to Step 3.

  **Step 3: Assess the Communication Channel Reliability**
  - *Question*: How reliable is the communication channel? Can messages be lost or missed without the sender knowing?
    - *Options*:
      - (a) Unreliable: Messages can be missed (e.g., email, Slack where people are in many channels and might not see a message) and there is no built-in mechanism to detect missing messages.
      - (b) Reliable: The channel has delivery receipts (e.g., read receipts, or a system that forces the receiver to act, so non-receipt is detectable) or is synchronous (e.g., a meeting).
      - (c) Public and Synchronous Event: The announcement is made in a way that everyone sees everyone else attending and reacting (e.g., a live all-hands meeting with video, or a shared physical space).
  - *Criteria*:
    - If (a) and the required mutual knowledge level is more than 1 (from Step 2), then we cannot achieve common knowledge (per the Coordinated Attack Problem). We must either:
        - Accept the risk (if the cost of failure is moderate and the probability of failure is low) and use forced acknowledgment (to at least get degree 1) and hope that the required level of mutual knowledge is not too high, OR
        - Use a more reliable channel (upgrade to (b) or (c)) and then re-assess.
    - If (b), we can get mutual knowledge of degree 1 (and if we require public acknowledgment, we might get degree 2). But note: even with read receipts, we don't know if the receiver understood. So we can only guarantee that the message was delivered and seen, not necessarily understood or internalized.
    - If (c), then we can achieve common knowledge (because it's public). However, note that in a large organization, even in an all-hands, not everyone might be paying attention. So we have to be cautious.

  **Step 4: Cost-Benefit and Friction Tolerance (Human Judgment Zone)**
  - *Question*: What is the cost of failure vs. the cost of implementing a more rigorous acknowledgment process?
    - We must weigh:
        - The probability of failure under a simpler method (like broadcast) and the cost if it fails.
        - The friction and resource cost of a more rigorous method (e.g., forced acknowledgments, mandatory meetings, sign-offs).
    - *Criteria*:
        - If the cost of failure is catastrophic and the required mutual knowledge level is high (say, more than 2) and the channel is unreliable, then we must move to a more reliable channel (e.g., a synchronous meeting) or a forced acknowledgment with escalation for non-response. This will be bureaucratic but necessary.
        - Otherwise, we might opt for a forced acknowledgment (which gives at least degree 1) and hope that it suffices (if the required level is low) or that the probability of failure is acceptable.
    - *Explicit Judgment Call*: At this step, the team must decide whether to accept the risk or impose friction. The procedure cannot make this decision automatically.

  **Step 5: Conclusion**
  - If from Step 1: criticality is minor -> broadcast is enough.
  - Else, if Step 2: only individual knowledge is needed -> forced acknowledgment (to ensure everyone has seen) is sufficient.
  - Else (if higher mutual knowledge is needed):
      - If Step 3: the channel is public and synchronous -> broadcast in that event is enough (and we can record it for those absent, but note absentees break the common knowledge; so we must have high attendance or follow up with them).
      - Else (if channel is unreliable) and Step 4: we decide the risk is acceptable -> use forced acknowledgment and hope.
      - Else (risk not acceptable) -> we must use a forced acknowledgment with a mechanism to build higher mutual knowledge (e.g., a public acknowledgment in a shared forum, or a meeting) and/or multiple rounds of communication.

  **Explicit Points:**
  - **Broadcast is enough**: When criticality is minor (Step 1) OR when the required mutual knowledge is only degree 1 and we can use forced acknowledgment (but note: broadcast alone doesn't even guarantee degree 1 without forced acknowledgment) — but wait, the procedure must be clear that broadcast alone is only for minor. For others, we need at least forced acknowledgment if we are to rely on it.
  - **Forced acknowledgment is needed**: When criticality is not minor and we need at least mutual knowledge of degree 1 (which broadcast alone doesn't guarantee). But note: forced acknowledgment only ensures degree 1. For higher degrees, we need more.

  **Honest Misfires**:
  1. **Over-engineering**: The procedure might recommend a meeting for common knowledge when a simple forced acknowledgment would have been enough in practice because people don't actually reason beyond one or two levels.
  2. **Under-engineering**: If we underestimate the required mutual knowledge level, we might choose a method that fails to coordinate.
  3. **Ignorance of Human Factors**: The procedure doesn't account for how people interpret messages. Even with forced acknowledgment, they might not internalize the fact.
  4. **Channel Reliability Misjudgment**: We might think a channel is reliable when it's not (e.g., assuming everyone reads Slack announcements).
  5. **Cost-Benefit Errors**: We might overestimate the cost of friction and under-implement, leading to failure, or vice versa.

  Now, let's run the procedure on the three cases.

  ---

  **Case 1: Announcing in a widely-followed channel that a legacy internal endpoint will be removed in two weeks.**

  - **Step 0**: Fact F: "Endpoint X will be removed on <date> (two weeks from now)."
  - **Step 1**: Criticality? 
      - Consequence: If a team misses the announcement, their service breaks. 
      - Severity: This is moderate (can be fixed by rolling back or quickly updating, but causes an outage). We'll proceed.
  - **Step 2**: Required mutual knowledge? 
      - Each team must update their service to stop using the endpoint. They don't need to know what others are doing. They act independently. So mutual knowledge of degree 1 is sufficient.
  - **Step 3**: Channel reliability? 
      - Widely-followed Slack channel: Unreliable (messages can be buried, people might be out). 
      - However, since we only need degree 1, we can use forced acknowledgment to ensure each team has seen it.
  - **Step 4**: Cost-benefit? 
      - Forced acknowledgment (e.g., requiring a response in a thread or a form) is low friction. The cost of an outage is moderate. So we should do forced acknowledgment.
  - **Conclusion**: We need forced acknowledgment (not just broadcast). 

  *Note: This might be annoying because teams get many such announcements. But the theory supports it because without acknowledgment, we don't even know if they saw it (degree 0).*

  ---

  **Case 2: Shift handoff between two on-call engineers.**

  - **Step 0**: Fact F: Handoff notes (including ongoing issues) have been transferred and the incoming engineer is now responsible.
  - **Step 1**: Criticality? 
      - If the handoff fails (e.g., both think the other is handling an issue, or an issue is dropped), there could be an outage. Criticality is high (catastrophic if a major issue is dropped). Proceed.
  - **Step 2**: Required mutual knowledge? 
      - We need the incoming engineer to know that the outgoing engineer knows they have the notes (so they don't double-handle or drop). Specifically: 
          - Incoming must know F: that they are responsible.
          - Also, they must know that the outgoing knows they are responsible (so the outgoing won't handle it). 
          - Similarly, the outgoing must know that the incoming knows they are responsible (so they can let go). 
      - This is mutual knowledge of degree 2. 
  - **Step 3**: Channel reliability? 
      - The handoff is typically done via a tool (like a handoff form) or a chat. The channel is one-on-one and synchronous? Or asynchronous? 
          - If done in person or via a video call: public and synchronous -> common knowledge can be achieved. 
          - If done via a tool that requires both to mark as handed off and accepted: then it's a form of forced acknowledgment that builds mutual knowledge of degree 2? 
          - However, note: if they are in the same room, they can see each other nodding, so it's public. But if via Slack, it's asynchronous and we cannot be sure the other saw the acknowledgment. 
      - We must design a reliable channel: a tool that forces both to acknowledge and that shows both acknowledgments to both parties. Then, when the incoming engineer acknowledges, the outgoing sees it, and vice versa. This gives mutual knowledge of degree 2: 
          - Outgoing knows F (handoff done) and knows incoming knows F (because they acknowledged). 
          - Incoming knows F and knows outgoing knows F (because the outgoing sent the handoff and then saw the incoming's acknowledgment). 
      - But note: the outgoing must know that the incoming knows that the outgoing knows? That would be degree 3. However, in practice, for two people, a synchronous exchange (even via chat) if they are both present at the same time (and we assume they are) can be considered to achieve a high degree. 
      - Alternatively, a handshake protocol: 
          1. Outgoing: "Here are the notes. You are now on call."
          2. Incoming: "I acknowledge. I am now on call."
          3. Outgoing: "I see your acknowledgment. I am now off call."
          This builds degree 2 at step 2 and degree 3 at step 3. 
      - However, in practice, step 3 is often omitted. 
  - **Step 4**: Cost-benefit? 
      - The cost of failure is high. The friction of a three-step handshake is low (just a few messages). So we should require a three-step handshake or a tool that enforces it. 
  - **Conclusion**: We need a forced acknowledgment with a protocol that builds at least degree 2. A simple broadcast (like posting handoff notes in a channel) is not enough. We require a direct handoff with explicit acknowledgment and confirmation. 

  ---

  **Case 3: Quarter-long migration where the deadline only works if every downstream team knows that every other downstream team knows the deadline.**

  - **Step 0**: Fact F: The migration must be completed by <date>.
  - **Step 1**: Criticality? 
      - If one team misses the deadline, the entire migration plan collapses (e.g., because the new system must be turned on and the old one turned off, and if one team isn't ready, the old system must stay, which is costly). Catastrophic. Proceed.
  - **Step 2**: Required mutual knowledge? 
      - We need that every team knows F, and also that every team knows that every other team knows F (so they don't delay thinking others aren't ready). This is mutual knowledge of degree 2. But note: in a chain of reasoning, if there are n teams, we might need up to degree n? Actually, the classic result is that for coordination, we need common knowledge. But in practice, we can get by with degree 2 if we trust that each team will act if they know that others know. However, the problem is that if a team suspects that another team might not know that the first team knows, they might delay. 
      - Given the description, the requirement is for common knowledge (infinite degree) because the whole plan collapses if even one team delays. But note: the electronic mail game shows that without common knowledge, even with high mutual knowledge, coordination can fail. 
      - However, in practice, we can approximate common knowledge by achieving a high level of mutual knowledge (say degree 2 or 3) and then relying on the fact that people don't reason beyond that. But the theory says we need common knowledge. 
  - **Step 3**: Channel reliability? 
      - We are using announcements (e.g., Slack, email) — unreliable. 
      - Therefore, common knowledge is impossible. 
      - We must either:
          - Change the plan to not require common knowledge (e.g., have a central coordinator who will confirm readiness and then broadcast a final go-ahead, which becomes common knowledge when broadcast publicly) or 
          - Use a public event (like a meeting) to announce the deadline and then again to confirm that all are ready. 
  - **Step 4**: Cost-benefit? 
      - The cost of failure is catastrophic. The cost of a public event (e.g., a kickoff meeting and a final readiness meeting) is high friction (taking time from many teams) but necessary. 
      - Alternatively, we can use a forced acknowledgment tree: 
          - Each team must acknowledge to the migration coordinator and also confirm that they believe every other team is ready (but that requires the coordinator to collect and share status). 
          - Then the coordinator can send a final message: "All teams are ready. Proceed on <date>." If this is sent in a public forum (and everyone sees it), then it becomes common knowledge. 
      - So we can break the problem into two:
          - Building mutual knowledge of the deadline (via forced acknowledgment of the deadline) — done at the start.
          - Building common knowledge of readiness (via a public announcement of readiness) — done near the deadline.
  - **Conclusion**: 
      - For the initial deadline announcement: we need forced acknowledgment (to get mutual knowledge of degree 1). 
      - But for the readiness to migrate: we need common knowledge. Since we cannot achieve it via an unreliable channel, we must create a public event. 
      - Therefore, we require a final readiness meeting (or a public announcement in a meeting) where the coordinator announces that all teams are ready and the migration will proceed. 

  *This will be annoyingly bureaucratic because it requires a meeting near the deadline. But the theory supports it because without a public event, common knowledge is impossible, and the migration plan requires common knowledge of readiness to avoid any team delaying.*

  ---

  **Summary of the Decision Procedure**

  **Step 0: Define the fact F.**
  **Step 1: Criticality of coordination failure:**
     - If minor (c): broadcast is enough. STOP.
     - Else: proceed.
  **Step 2: Required mutual knowledge:**
     - If only individual knowledge (degree 1) is needed: then forced acknowledgment is sufficient. STOP (we need forced acknowledgment).
     - Else (if higher, e.g., degree 2 or more): proceed.
  **Step 3: Channel reliability:**
     - If the channel is public and synchronous: broadcast in that event is sufficient. STOP.
     - Else (unreliable or only reliable for delivery but not for higher knowledge): then we cannot achieve common knowledge. Proceed to Step 4.
  **Step 4: Cost-benefit and friction (human judgment):**
     - Weigh the cost of failure against the cost of implementing a more reliable method (e.g., a meeting, or a multi-step acknowledgment protocol).
     - Decide either:
          - Accept the risk: use forced acknowledgment and hope it suffices. (But note: this might not achieve the required mutual knowledge level.)
          - Or implement a more reliable method (e.g., public event or coordinator-based confirmation) to build the required mutual knowledge.

  **Explicit STOP points:**
  - Broadcast is enough: Step 1 (minor) OR Step 3 (public event).
  - Forced acknowledgment is needed: Step 2 (only degree 1) OR Step 4 (accepting risk for higher levels with forced acknowledgment).
  - Forced acknowledgment is not enough and a public event is needed: Step 4 (if we judge the risk too high and we require common knowledge or high mutual knowledge).

  **Final Note**: This procedure is a framework to structure the discussion. It must be applied with common sense and adapted to the organization's culture and the specific context. The misfires should be kept in mind and reviewed in retrospectives.
answer: |-
  ### Structured Brainstorming: Key Results and Distinctions from Epistemic Game Theory  
  I'll distill the literature into concepts that matter for your coordination problems, separating practical insights from mathematical curiosities.  

  #### **Core Concepts with Engineering Relevance**  
  1. **Mutual Knowledge vs. Common Knowledge**:  
     - **Mutual knowledge (degree 1)**: Everyone knows fact F.  
     - **Mutual knowledge (degree 2)**: Everyone knows that everyone knows F.  
     - **Common knowledge**: Everyone knows F, *and* everyone knows that everyone knows F, *and so on ad infinitum*.  
     - **Why it matters**: Coordination often fails because teams stop at degree 1 ("I told them") but need higher degrees. For example, in your migration case (3), if Team A doubts whether Team B knows F, they might delay "just in case," causing a chain reaction.  

  2. **The Coordinated Attack Problem (Generals' Paradox)**:  
     - Two generals must synchronize an attack, but messengers can be captured. Even with 99% reliable acknowledgments, common knowledge is *mathematically impossible* without a perfectly reliable channel.  
     - **Engineering takeaway**: In systems with any risk of message loss (e.g., Slack notifications buried), you can *never* achieve true common knowledge. You must decide how much risk is tolerable.  

  3. **Bounded Rationality and k-Level Reasoning**:  
     - Humans don’t reason to infinity. In practice, mutual knowledge of degree 2–3 often suffices ("I know you know I know").  
     - **Engineering takeaway**: Target degree 2–3 for critical actions. Beyond that, friction outweighs benefits.  

  4. **Salience and Public Events**:  
     - A fact becomes "salient" when everyone observes others observing it (e.g., a live announcement in a meeting). This approximates common knowledge by creating shared attention.  
     - **Engineering takeaway**: Public events (e.g., a Zoom call) boost mutual knowledge faster than async channels.  

  5. **The Electronic Mail Game (Rubinstein)**:  
     - With even tiny message-failure probabilities, agents default to inaction. Why? Each wonders, "Did they get my ack? Do they know I got theirs?"  
     - **Engineering takeaway**: Async acknowledgments (e.g., thumbs-up emojis) *reduce* but don’t *eliminate* uncertainty. For critical coordination, force synchronous confirmation.  

  #### **Mathematical Curiosities to Ignore**  
  - Infinite regress of knowledge: Humans cap at low-k reasoning.  
  - Perfect Bayesian equilibria: Impractical for Slack comms.  
  - Aumann’s agreement theorem: Assumes common knowledge is feasible, which it isn’t in your context.  

  ---  
  ### Decision Procedure: "Coordination Certainty Assessment" (CCA)  
  Use this when your team relies on others internalizing a fact (e.g., deadlines, handoffs). **Input**: Fact `F`, teams affected, action required.  

  #### **Step 1: Consequence of Single Failure**  
  **Question**: If one team fails to act on `F`, what happens?  
  - **Criteria for proceeding**:  
    - *Minor*: Localized issue, easy fix (e.g., docs typo). → **STOP: Broadcast suffices.**  
    - *Moderate*: Service degradation, recoverable (e.g., endpoint failure). → Proceed to Step 2.  
    - *Catastrophic*: System collapse, safety risk, major $ loss (e.g., migration deadline). → Proceed to Step 2.  

  #### **Step 2: Dependency on Others’ Knowledge**  
  **Question**: Does acting on `F` require teams to *know* that others know `F`?  
  - **Examples**:  
    - *No*: Teams act independently (e.g., updating private code). → **Forced acknowledgment suffices** (e.g., response-required email).  
    - *Yes*: Teams won’t act unless they know others are ready (e.g., migration, freeze period). → Proceed to Step 3.  

  #### **Step 3: Minimum Mutual Knowledge Required**  
  **Question**: What degree of mutual knowledge is needed?  
  - **Criteria**:  
    - *Degree 1*: Teams just need to know `F` (e.g., "endpoint deprecated"). → **Forced acknowledgment suffices.**  
    - *Degree 2+*: Teams need to know others know `F` (e.g., on-call handoff, migrations). → Proceed to Step 4.  

  #### **Step 4: Channel Reliability**  
  **Question**: How reliable is the comms channel?  
  - **Criteria**:  
    - *Unreliable*: Async, noisy, no read receipts (e.g., Slack announcement). → **Forced acknowledgment + escalation needed.**  
    - *Reliable*: Sync, attention-guaranteed (e.g., video call, in-person). → Proceed to Step 5.  

  #### **Step 5: Friction Tolerance Judgment Zone (Human Decision)**  
  **Question**: What’s the cost of failure vs. cost of friction?  
  - **Factors to weigh**:  
    - Probability of miscommunication (based on channel history).  
    - Effort of forced acks (e.g., tracking 40 Slack replies).  
    - Organizational tolerance for delays/bureaucracy.  
  - **Explicit outputs**:  
    - **Accept risk**: Use forced acknowledgment (e.g., form response).  
    - **Mitigate risk**: Upgrade channel (e.g., mandatory meeting).  
    - **Zero-tolerance**: Redesign process (e.g., automated checks).  

  #### **Misfire Warnings**  
  - **False positives**: Over-engineering for low-risk announcements (e.g., requiring a meeting for minor updates).  
  - **False negatives**: Underestimating dependencies (e.g., assuming degree 1 suffices for migrations).  
  - **Human factors**: Ignoring that "acknowledged" ≠ "understood."  

  ---  
  ### Applying the CCA to Your Cases  

  #### **Case 1: Legacy Endpoint Deprecation (2-week notice in Slack)**  
  - **Step 1**: *Moderate* (broken integrations, but fixable). → Proceed.  
  - **Step 2**: *No dependency*. Teams act alone to update code. → **Forced acknowledgment suffices.**  
  - **Why?** No need for teams to know about others. A Slack thread reply or Google Form response ensures degree 1 knowledge.  
  - **Procedure outcome**: Skip public announcement. Require ✅ from each team lead.  

  #### **Case 2: On-Call Shift Handoff**  
  - **Step 1**: *Catastrophic* (incident not handled). → Proceed.  
  - **Step 2**: *Dependency exists*. Incoming engineer won’t assume ownership unless they know outgoing knows they’re ready. → Proceed.  
  - **Step 3**: *Degree 2+ needed*. Incoming must know outgoing knows they received notes. → Proceed.  
  - **Step 4**: *Unreliable* if async (e.g., Slack DM). → **Forced acknowledgment + escalation.**  
  - **Step 5**: Low friction tolerance (handoffs are frequent). → Use a tool-based protocol:  
    1. Outgoing posts notes in handoff tool.  
    2. Incoming marks ✅.  
    3. Tool notifies outgoing *and* requires their ✅.  
    4. If no ✅ in 15m, tool escalates to manager.  
  - **Why theory supports this**: The Electronic Mail Game shows async acknowledgments alone are brittle. Forcing a closed loop (✅ → ✅) achieves degree 2.  

  #### **Case 3: Quarter-Long Migration Deadline**  
  - **Step 1**: *Catastrophic* (entire migration fails if one team delays). → Proceed.  
  - **Step 2**: *Dependency exists*. Teams delay if they doubt others’ readiness. → Proceed.  
  - **Step 3**: *Degree 2+ essential*. All teams must know all others know the deadline. → Proceed.  
  - **Step 4**: *Unreliable* (Slack/email). → **Forced acknowledgment insufficient alone.**  
  - **Step 5**: High cost of failure → **Annoying but necessary bureaucracy**:  
    - Kickoff: Mandatory sync meeting (public event → high-degree knowledge).  
    - Fortnightly check-ins: Shared dashboard of team progress (salience).  
    - Deadline lock: 72h before deadline, require verbal ✅ in Zoom call.  
  - **Why theory forces this**: The Coordinated Attack Problem proves async channels *cannot* guarantee common knowledge. The migration’s success relies on ≈common knowledge (degree 3+), which only sync events approximate. Yes, it’s bureaucratic—but without it, the probability of coordination failure is non-trivial (per Electronic Mail Game).  

  ---  
  ### Final Notes  
  - **When to break the rules**: If forced acks cause fatigue (e.g., 5/day), optimize by grouping announcements or automating checks (e.g., "Has Team X’s repo stopped using endpoint Y?").  
  - **Continuous improvement**: Log failures post-action. Was friction worth it? Adjust the CCA thresholds.  
  - **Remember**: No procedure beats observability. If a dashboard shows real-time migration progress, it cuts through knowledge gaps.  

  This framework bakes game theory into actionable questions, exposing where "vibes" hide risk. It won’t eliminate failures, but it will make them intentional trade-offs—not surprises.
