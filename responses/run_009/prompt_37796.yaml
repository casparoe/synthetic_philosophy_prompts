  ### The Garden's Two Deaths  
  *A pantoum*

  The garden gate stands open every day.  
  I pick a sprig of basil, green and fine.  
  The bed is full, the leaves are thick and fair.  
  *One more won’t be missed,* I think, and take it.  

  I pick a sprig of basil, green and fine.  
  *It grows so quick, it won’t show any lack.*  
  *One more won’t be missed,* I think, and take it.  
  The summer sun still warms us on our backs.  

  *It grows so quick, it won’t show any lack.*  
  The compost heap is low, but no one stares.  
  The summer sun still warms us on our backs.  
  *One less pail won’t be missed,* I think, and spare it.  

  The compost heap is low, but no one stares.  
  I meant to bring my scraps but left them there.  
  *One less pail won’t be missed,* I think, and spare it.  
  The autumn chill has settled in the air.  

  I meant to bring my scraps but left them there.  
  The heap lies cold; no rot returns to ground.  
  The autumn chill has settled in the air.  
  *One less pail won’t be missed,* I think, and spare it.  

  The heap lies cold; no rot returns to ground.  
  The garden gate stands open every day.  
  *One less pail won’t be skipped,* I think, and spare it.  
  The bed is full, the leaves are thick and fair.  

