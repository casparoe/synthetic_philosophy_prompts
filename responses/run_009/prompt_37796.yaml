  | 2      | Eaten        | *"One more won’t be missed"* — Now a habit, not a one-time lapse. | The thinning shoots beneath full leaves. |  
  | 3      | Eaten/Starved| *"The summer sun still warms us"* — Irony: plenty feels permanent. | The compost’s need beneath the basil’s decline. |  
  | 4      | Starved      | *"One less pail won’t be missed"* — First abstention, not malice. | How scraps today prevent barren soil tomorrow. |  
  | 5      | Starved      | *"The autumn chill has settled"* — Frost as metaphor for disuse. | That rot requires many hands, not one. |  
  | 6      | Cured        | *"The bed is full, the leaves are thick and fair"* — Restored by visibility. | How the gate stands open *because* they see each other. |  

