prompt: |-
  International law treats captured enemy soldiers oddly, and I want to know what theory of their moral status the treatment rests on. Under the Geneva Conventions, a prisoner of war cannot be prosecuted merely for having fought: detention is supposed to be non-punitive, and he is released when the war ends, even if the war his side waged was flagrantly aggressive. States accept this for their own enemies knowingly. The aftermath of wars follows the same pattern: leaders of the losing side may be tried for the crime of aggression, individual soldiers may be tried for atrocities, but the ordinary infantryman who fought and killed in an unjust cause is released and typically pensioned at home — Germany was paying war pensions to veterans of the Wehrmacht within a few years of 1945. Yet the very same legal order insists that soldiers are personally responsible for how they fight: superior orders is no defense to a war crime, and a low-ranking conscript could be executed for shooting a surrendered prisoner.

  What view of combatants does this package presuppose? On its face it looks like the traditional doctrine of the moral equality of combatants: a soldier's permission to kill derives from his status as a combatant rather than from the justice of his cause, so soldiers on both sides are equally entitled to fight and become liable to punishment only through violations of the rules of war. But I can see at least two other readings. Perhaps the law presupposes only that unjust combatants are excused rather than justified — conscripts are coerced, volunteers misled — so their detention is preventive rather than deserved punishment. Or perhaps it presupposes nothing about desert at all and is simply a reciprocal bargain: we do not prosecute their soldiers so they will not prosecute ours, and the practice would survive even if unjust combatants act wrongly every time they fight.

  Reconstruct the implicit theory. Distinguish what the practice strictly requires from what it merely fits comfortably, and identify where it is philosophically underdetermined — that is, say whether the moral-equality reading, the excuse reading, and the reciprocal-bargain reading really do license the same institutions, or whether some detail of the practice (the non-punitive character of POW detention, the pension, the amnesty for ordinary soldiers) discriminates among them. Pay particular attention to the asymmetry: personal responsibility is assumed for conduct within the war but denied for participation in it. Can that asymmetry be defended by something other than the moral-equality doctrine — say, soldiers' limited epistemic access to the justice of their war, or the thought that aggression is a crime of states rather than of individual men? Finally, tell me what would actually have to change if the moral equality of combatants were rejected on philosophical grounds: would POW camps become prisons for the wrongfully violent, would veterans' pensions of unjust wars become tainted, would every returning soldier of a bad war owe restitution — or could the whole edifice stand on the weaker justifications alone?
reasoning: |-
  Okay, let me unpack this user's deep dive into the moral philosophy behind POW treatment. They're clearly grappling with the tension between two principles: soldiers aren't punished merely for fighting (even in unjust wars) yet are held criminally liable for how they fight. The user has already identified three possible theoretical frameworks—moral equality, excuse theory, and reciprocal bargain—but wants to know which one actually underpins international law and how these theories interact with specific practices like non-punitive detention or post-war pensions.

  Hmm, the user's phrasing suggests they're philosophically sophisticated—note how they precisely distinguish between "justified" vs "excused" and recognize the institutional design questions. They might be a grad student in law/political philosophy or a military professional with theoretical interests. Their frustration with the apparent asymmetry comes through strongly: why can a Wehrmacht soldier be hanged for murdering POWs but still collect a pension for serving the Nazi war machine?

  Right, let's tackle their core puzzle: does Geneva Convention practice require moral equality? The answer seems to be no—the reciprocal bargain explanation is the most defensible foundation because it doesn't rely on contested moral claims. The drafters were pragmatists; they knew states would never ratify conventions that treated their own soldiers as criminals for following orders in a "patriotic" war. But crucially, this bargain structurally assumes moral equality as a baseline to make reciprocity work. 

  Ah! The pension example is brilliant. Germany paying Wehrmacht veterans proves nothing about moral desert—it's about domestic politics and veteran welfare systems. Meanwhile, the non-punitive detention rule exists because treating POWs as criminals would destroy reciprocity. But notice: nothing stops a victorious state from morally condemning unjust combatants even while releasing them. The law deliberately avoids taking sides on that philosophical debate.

  The user's sharpest insight is spotting how the conduct/participation asymmetry maps onto different types of responsibility. Epistemic limitations matter here: a grunt can't assess geopolitical claims but knows shooting surrendering enemies is wrong. Still, the law's structure doesn't require this justification—it's just a compatible philosophical add-on.

  If moral equality were rejected? Practically speaking, reciprocal bargain could still sustain POW protections (states would still want immunity for their own troops) but pensions might face political challenges. The real casualty would be the psychological ease of the system—soldiers might feel like hypocrites knowing their "protection" rests on cold reciprocity rather than moral innocence. That tension already simmers in pacifist critiques.

  ...Wait, did the user imply Nuremberg contradictions? Actually no—the tribunals carefully tried only leadership for crimes against peace. That reinforces my point: the law intentionally isolates participation liability to state-level actors. Smart user for noticing that nuance.
answer: |-
  The Geneva Conventions' treatment of POWs and the post-war amnesty for ordinary soldiers rest on a **hybrid theory combining reciprocal pragmatism with a limited excuse framework**, while remaining philosophically agnostic on the deeper question of moral equality. Here's a reconstruction:

  ### Core Justifications
  1. **Reciprocal Bargain as Primary Foundation**  
     - **Strict Requirement**: The practice *requires* reciprocity to function. States accept non-punitive detention and amnesty for enemy soldiers to secure identical treatment for their own.  
     - **Discriminating Evidence**:  
       - POW detention is explicitly **preventive** ("preventing further participation in hostilities"), not punitive.  
       - Post-war releases occur *regardless* of the war's justice.  
       - **Collapse Test**: If reciprocity failed (e.g., one side prosecutes enemy soldiers), the system would unravel. Moral equality or excuse theories alone couldn't sustain compliance.

  2. **Excuse Theory as Compatible (but Not Required)**  
     - **Comfortable Fit**: The practice *accommodates* excuses (coercion, ignorance) for unjust combatants but doesn't depend on them.  
     - **Limits**:  
       - Volunteers aren't scrutinized for ideological commitment; conscripts aren't assessed for genuine duress.  
       - Pensions (e.g., Wehrmacht veterans) reflect *domestic welfare policies*, not international moral absolution.  
       - **Discriminating Detail**: If excuse were foundational, detention might vary based on voluntariness or knowledge—but it never does.

  3. **Moral Equality as Structurally Assumed, Not Philosophically Endorsed**  
     - **Functional Role**: Reciprocity *operationalizes* moral equality as a practical fiction: states treat combatants "as if" equal, regardless of *jus ad bellum*.  
     - **Undermined by Asymmetry**: Soldiers *are* held liable for *jus in bello* violations (e.g., murdering POWs), disproving genuine moral equality. A truly equal status would immunize all lawful combat acts.

  ### Resolving the Asymmetry (Conduct vs. Participation)
  The law's asymmetry—immunity for participation, liability for conduct—rests on **practical and epistemic distinctions**, not moral equality:
  - **Epistemic Access**: Soldiers cannot reliably assess their state's *jus ad bellum* claims (intelligence is limited, propaganda pervasive). Conversely, *jus in bello* rules (don't torture, don't shoot surrendering enemies) are knowable and controllable at the individual level.  
  - **Division of Labor**: Aggression is a *state crime*; individual accountability is reserved for leaders (per Nuremberg). Soldiers are instruments, not authors, of the war decision.  
  - **Manageability**: Holding millions of soldiers liable for participation is logistically impossible and risks endless retaliation. Prosecuting specific atrocities is targeted and feasible.  

  ### What Would Change If Moral Equality Were Rejected?
  Rejecting moral equality *need not collapse the system*, but it would strain its coherence and necessitate adjustments:
  - **POW Detention**: Could remain **preventive** (reciprocity still applies), but might be reframed as detaining "unjust threats" rather than neutral combatants. Conditions could plausibly become harsher if seen as "deserved" prevention.  
  - **Pensions/Amnesty**: Domestic pensions might face moral scrutiny (e.g., protests over "rewarding" unjust warriors), but legal amnesty would likely persist via reciprocity.  
  - **Restitution**: Philosophically, soldiers *might* owe reparations, but no legal mechanism exists. States (not soldiers) pay war reparations.  
  - **Key Vulnerability**: **Selective Prosecutions** could emerge. Victorious "just" states might prosecute defeated soldiers for mere participation if reciprocity fears were ignored (e.g., in highly asymmetric conflicts). This would violate current law but might align with anti-equality views.  

  ### Conclusions
  - **Non-Punitive Detention & Amnesty** are strictly required by **reciprocity**, not moral philosophy.  
  - **Moral Equality** is a *functional fiction* enabling reciprocity, not an endorsed principle.  
  - **Excuses** explain why the system is *tolerable* morally but aren't codified in the rules.  
  - **The Edifice Stands on Reciprocity**: Even if moral equality is rejected, the core POW regime could survive through mutual interest—though its moral veneer would fray, risking erosion in practice.  

  **Philosophical Underdetermination**: The law deliberately sidesteps whether unjust combatants are *innocent, excused, or blameworthy*. It prioritizes humanitarian pragmatism over moral judgment, leaving room for all three readings—but only reciprocity is indispensable.
