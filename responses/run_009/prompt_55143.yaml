prompt: |-
  I help run a reading group that's half math majors, half philosophy majors, and we just finished a semester on the axiom of choice. For the last session I want a 'which stance on AC do you actually hold?' quiz -- not which axioms you *use*, but what you think is *true*. Eight to ten questions, each a concrete case with 2-3 answer options, plus a scoring key that maps answer patterns onto named positions.

  Cases I want in there (pick and choose, add your own if they're better): Banach-Tarski; whether a non-measurable set existing at all is a cost; every vector space having a basis, including over horrible fields; the reals being well-orderable; picking one sock from each of infinitely many pairs of genuinely indistinguishable socks (the shoes version is trivial since you can say 'take the left one', the socks version is where it bites); and this dart thing, which I want as one of the questions: throw countably many darts at random at the unit interval -- for any single dart, the chance it lands exactly on one of the countably many earlier darts is zero, so a natural symmetry argument says every dart misses all the earlier ones, and that claim contradicts the reals being well-orderable, hence contradicts choice. (I don't care whether the argument is any good; I care whether people side with 'the symmetry intuition wins' or 'probability intuitions about uncountable sets are junk'.)

  A few structural demands:

  - Every question has to be answerable without knowing what any position is called. It sorts by what people say about cases, not by self-labels. No 'do you believe in the cumulative hierarchy?' style questions.
  - Build the tree out of the logical space first, then locate the positions in it. The axes I care about are: (a) whether statements independent of ZF have a determinate truth value at all, (b) whether consequences -- nice ones like Zorn's lemma, ugly ones like Banach-Tarski -- can count as evidence for or against an axiom's *truth*, as opposed to merely its usefulness, and (c) how much choice someone will trade away: full AC, dependent choice, countable choice, none. Leaves should include: the garden-variety ZFC Platonist, the 'choice is baked into the iterative conception' crowd (if that's even a distinct leaf -- flag it if you can't seperate it from the first one), Hamkins-style multiverse views, the formalist/pragmatist 'axioms are tools' stance, constructivism, someone who takes determinacy (AD) seriously enough to give up choice, and the Solovay-model 'all sets of reals measurable' sympathizer. If some combination of answers maps onto no real position, say so and guess whether that's because the combo is incoherent or just unexplored.
  - Flag at least one pair of leaves your quiz can't actually seperate. My suspicion is the pragmatist and the multiverse person answer most of these questions the same way, but I'm honestly not sure, and I'd rather you told me straight than fudged it.

  After the scoring key, add a short closing note on where you're confident and where you aren't -- in particular, single out whichever mapping from answer-pattern to leaf you're least sure actually matches what defenders of that position would say, since I plan to test the quiz on our one actual constructivist, and if it sorts him wrong he will never let me hear the end of it.
reasoning: |-
  We are creating a quiz to determine one's stance on the Axiom of Choice (AC). The quiz consists of 8-10 concrete cases with 2-3 answer options each. The scoring key will map patterns of answers to named positions. The positions we aim to cover include:
    - ZFC Platonist
    - AC baked into the iterative conception (if distinct)
    - Hamkins-style multiverse
    - Formalist/pragmatist
    - Constructivist
    - AD advocate (giving up AC for determinacy)
    - Solovay model sympathizer (all sets of reals are measurable)

  We are to avoid questions that require knowledge of position names. We focus on concrete cases.

  The axes we care about are:
    (a) Whether statements independent of ZF have a determinate truth value.
    (b) Whether consequences (nice or ugly) can count as evidence for/against an axiom's truth (as opposed to usefulness).
    (c) How much choice one is willing to trade away: full AC, DC, CC, none.

  We are to include at least the following cases (and we can add more if needed):
    1. Banach-Tarski
    2. Existence of non-measurable sets as a cost
    3. Every vector space having a basis (even over horrible fields)
    4. The reals being well-orderable
    5. Picking one sock from each of infinitely many pairs of indistinguishable socks
    6. The dart scenario (symmetry intuition vs. rejection of probability on uncountable sets)

  We must flag pairs of leaves that the quiz cannot separate and note where we are least confident.

  Let's design the questions:

  Question 1: Banach-Tarski Paradox
    Statement: The Banach-Tarski paradox shows that a solid ball can be decomposed into a finite number of disjoint subsets and then reassembled (using only rotations and translations) into two identical copies of the original ball. This is a consequence of the Axiom of Choice.
    Question: How do you view this result?
      A. It is a valid mathematical result, and although it is counterintuitive, it is a true fact about the real world of sets.
      B. It is a valid mathematical result but only in an abstract sense; it doesn't reflect physical reality, but that's acceptable because mathematics isn't necessarily about physical reality.
      C. It is a sign that the Axiom of Choice is false, because such a decomposition should be impossible.

  Question 2: Existence of non-measurable sets
    Statement: The Axiom of Choice implies that there exist sets of real numbers that are not Lebesgue measurable.
    Question: Is the existence of such sets a problem?
      A. No, non-measurable sets are a natural part of mathematics and we should accept them.
      B. Non-measurable sets are an oddity, but they are a price worth paying for the benefits of AC.
      C. Yes, the existence of non-measurable sets is so problematic that it is a reason to reject the Axiom of Choice.

  Question 3: Vector space basis
    Statement: Consider a vector space over an arbitrary field (which might be very "horrible", for example, having no obvious structure). The Axiom of Choice implies that every vector space has a basis.
    Question: Do you believe that every vector space must have a basis?
      A. Yes, it is a fundamental truth of linear algebra that every vector space has a basis.
      B. It is convenient to assume that every vector space has a basis, but it might not be true for some pathological vector spaces.
      C. No, there is no reason to believe that such a basis exists for arbitrary vector spaces, and in fact, for some spaces it might not.

  Question 4: Well-ordering of the reals
    Statement: The Axiom of Choice implies that the set of real numbers can be well-ordered (i.e., there exists a total order on the reals such that every nonempty subset has a least element).
    Question: Do you believe that the real numbers can be well-ordered?
      A. Yes, every set can be well-ordered, including the reals.
      B. It is impossible to explicitly describe a well-ordering of the reals, but such a well-ordering exists in the abstract.
      C. No, the real numbers are inherently un-well-orderable.

  Question 5: The socks problem
    Statement: Imagine infinitely many pairs of indistinguishable socks. The Axiom of Choice is needed to select one sock from each pair. (In contrast, shoes have a left and right, so we can define a function without AC by picking the left shoe from each pair.)
    Question: Is it possible to select one sock from each pair?
      A. Yes, even without any distinguishing feature, such a selection is possible.
      B. It is possible only if we assume the Axiom of Choice, but without AC it might not be possible. However, I am not committed to whether such a selection "actually exists" independently of AC.
      C. No, without a way to distinguish the socks, there is no such selection.

  Question 6: The dart throwing scenario
    Statement: Throw countably many darts one after another at random at the unit interval [0,1]. For any single dart, the chance that it lands exactly on one of the countably many earlier darts is zero. By a symmetry argument, we might conclude that every dart misses all the earlier ones. But then we have a sequence of darts that are all distinct and in a well-order (by the order of throwing). However, if the reals are not well-orderable (which would be without AC), then this cannot happen. Therefore, the symmetry argument must be flawed.
    Question: What is your take?
      A. The symmetry argument is valid, and it shows that the sequence of darts must be distinct and hence well-ordered. Therefore, the reals must be well-orderable and AC must hold.
      B. The symmetry argument is valid, but it does not imply that the reals are well-orderable in the absence of AC; instead, it shows that the scenario (with countably many darts) is possible only if AC holds. Without AC, such a sequence of darts might not exist, but that doesn't mean the reals aren't well-orderable by some other means.
      C. Probability intuitions about uncountable sets like the reals are unreliable. The symmetry argument is flawed because we cannot assign probabilities in such a scenario without a well-defined probability space, and the notion of "random" here is problematic.

  Now, we need 2-4 more questions to cover the axes and to separate the positions.

  Question 7: Determinacy and games
    Statement: Consider two-player infinite games with perfect information. The Axiom of Determinacy (AD) states that every such game is determined (i.e., one of the players has a winning strategy). AD contradicts the Axiom of Choice.
    Question: What do you believe about such games?
      A. AD is too restrictive; we know that AC is true and so AD must be false.
      B. AD is an interesting alternative to AC, and it might be true for the set of real numbers (even if not for all sets). I am willing to give up AC for the benefits of AD.
      C. AD is an attractive axiom, but it is not necessarily true; it depends on the context or model we are working in.

  Question 8: The cumulative hierarchy
    Statement: The universe of sets is built in stages: start with the empty set, then take power sets and unions at each step. This is the iterative conception of sets.
    Question: Does the iterative conception imply the Axiom of Choice?
      A. Yes, because at each stage, we can choose elements from sets that were constructed earlier, and this allows us to build choice functions.
      B. The iterative conception makes AC natural, but it does not necessarily force it to be true.
      C. No, the iterative conception does not provide a way to make arbitrary choices, especially when there is no definable way to pick elements.

  Question 9: Dependent Choice
    Statement: The Axiom of Dependent Choice (DC) is weaker than AC. It allows making choices in sequences where each choice depends on the previous one. Many results in analysis require DC but not full AC.
    Question: Which of the following do you believe?
      A. DC is obviously true, and even if AC fails, DC should hold.
      B. DC is a very reasonable compromise and should be accepted, but full AC might be too strong.
      C. There is no reason to believe DC is true without assuming it as an axiom for practical purposes.

  Question 10: Truth of independent statements
    Statement: Consider a statement that is independent of ZF (for example, the Axiom of Choice itself). Do you believe that such a statement has a definite truth value?
      A. Yes, in the real universe of sets, every such statement is either true or false.
      B. It depends on the statement and the context; there might be multiple set-theoretic universes where different statements hold.
      C. No, independent statements lack a truth value; they are merely relative to an axiomatic system.

  Now, we have 10 questions. We need a scoring key.

  We will map the answers to positions. We note that some positions may have overlapping answers, and we must flag those.

