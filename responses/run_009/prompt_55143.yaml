  1. ZFC Platonist (ZFC-P): Believes in a real universe of sets where AC is true. All consequences (like Banach-Tarski, non-measurable sets, well-ordering of the reals) are true. Independent statements have a definite truth value.

  2. Iterative conception AC (IC-AC): Believes that the iterative conception of sets implies AC. Might be indistinguishable from ZFC-P in many answers.

  3. Hamkins-style multiverse (Multiverse): Believes there are multiple set-theoretic universes, and AC may hold in some and not in others. Truth is relative to the universe.

  4. Formalist/pragmatist (Formalist): Axioms are tools; they are not about truth but about usefulness. They might accept AC when it is useful and reject it when it is not.

  5. Constructivist (Construct): Rejects non-constructive principles. Typically rejects AC. Believes that only constructible objects exist.

  6. AD advocate (AD): Believes in the Axiom of Determinacy for the real numbers, and hence rejects full AC. But note that AD implies countable choice for sets of reals.

  7. Solovay model sympathizer (Solovay): Believes that all sets of reals are Lebesgue measurable, which requires rejecting AC (at least in the context of the Solovay model). Note that the Solovay model assumes an inaccessible cardinal and satisfies DC.

