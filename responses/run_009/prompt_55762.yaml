   It appears that as long as the reported utility is an increasing linear function of the base utility, the assignment that maximizes the sum of reported utilities also maximizes the sum of base utilities? 

   Let me prove it:

   Let there be an assignment of goods to citizens. For citizen i, let g_i be the good they receive, and let u_i(g_i) be their base utility. 
   The reported utility is v_i(g_i) = a_i * u_i(g_i) + b_i.

   The sum of reported utilities = sum_i [ a_i * u_i(g_i) + b_i ] = sum_i a_i * u_i(g_i) + sum_i b_i.

   The term sum_i b_i is constant. So maximizing the sum of reported utilities is equivalent to maximizing sum_i a_i * u_i(g_i).

   But we want to maximize sum_i u_i(g_i).

   These are different objectives. They are the same only if a_i is constant for all i.

   So if the scale factors a_i are not the same, then the assignment that maximizes sum a_i u_i(g_i) may not maximize sum u_i(g_i).

