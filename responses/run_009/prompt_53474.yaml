answer: |-
  ### Staged Activity: "Substance Naming Game"  
  **Objective:** Students encounter semantic externalism intuitions (reference depends on external factors, not just internal states) through a hands-on language game without prior philosophical framing.

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Setup & Introduction (10 min)**  
     - Facilitator explains: "You're explorers discovering a new substance. Your task: coin a word for it, agree on how to identify it, and use it in coordination tasks. Points are earned by team consensus."  
     - Divide into 4 teams of 4. Each team gets:  
       - 4 samples of **Liquid A** (all identical for their team).  
       - 1 worksheet for recording their word, criteria, and decisions.  
     - Emphasize: "No real-world chemistry terms! Invent a new word (e.g., ‘Kripta’)."

  2. **Naming & Criteria Fixing (15 min)**  
     - Teams examine samples using **allowed tests**: sight (color/clarity), smell, viscosity (swirling), and evaporation rate (drop on paper). *No tools provided.*  
     - Task:  
       - Coin a word for their substance.  
       - Define public criteria for identifying it (e.g., "clear, odorless, dries slowly").  
     - Output: Teams write their word and criteria on the board.

  3. **Coordination Task 1: Sorting & Agreement (15 min)**  
     - Each team receives 4 **new samples** (2 of Liquid A, 2 of Liquid B).  
     - Rules:  
       - Each member *independently* sorts samples into "Our Word" (✓) or "Not Our Word" (✗).  
       - Team must then agree on a *unanimous* sorting.  
     - **Scoring**:  
       - 1 point per sample where all 4 members initially agree.  
       - 2 points per sample where the team reaches unanimous consensus.  
       *(Pressure: Consensus is rewarded over individualism.)*

  4. **Coordination Task 2: Betting (15 min)**  
     - Teams receive 4 **additional samples** (2 A, 2 B).  
     - Rules:  
       - Teams bet 1-5 points per sample on whether it’s their substance.  
       - They must agree as a team on bets.  
     - **Scoring**:  
       - Correct bet: +points wagered.  
       - Incorrect bet: -points wagered.  
       *(Pressure: Risk-reward forces careful criteria application.)*

  5. **Introduce the Chemist (10 min)**  
     - Facilitator: "A chemist arrives with tools to test ‘hidden properties’."  
     - **Chemist role** (played by facilitator or a pre-briefed student):  
       - Uses a **conductivity pen** (tests electrical conductivity).  
       - Reports only "high" or "low" conductivity for any sample.  
     - Teams can query the chemist for **2 samples total** during betting.  
     - *Key: Teams update bets based on chemist input.*

  6. **Reveal & Critical Question (10 min)**  
     - Facilitator reveals:  
       - **Liquid A = Salt water** (high conductivity).  
       - **Liquid B = Sugar water** (low conductivity).  
       *(Both clear, odorless; indistinguishable without tools.)*  
     - **Critical question** (teams answer on worksheet):  
       > *"When you first coined your word, did it apply to...  
       > (a) All samples you ever tested?  
       > (b) Only samples matching your criteria?  
       > (c) Only samples with the chemist’s ‘high conductivity’?  
       > (d) Did its meaning change after the chemist?"*  
     - **Scoring**: 5 bonus points for any answer with reasoned justification.  

  7. **Debrief & Philosophy Mapping (15 min)**  
     - Poll teams on critical question. Reveal externalist answer:  
       > "Externalism says: Your word *always* referred to *one specific kind* (salt/sugar), even before you knew the hidden difference. Reference depends on the ‘hidden structure’ of your *original samples*, not your knowledge."  
     - **Map activity to externalism**:  
       - **Twin Earth intuition**: Teams with identical criteria but different liquids (e.g., Team 1 had salt water, Team 2 sugar water) had words referring to *different substances*, despite identical mental states.  
       - **Expert deference**: Using the chemist shows reference can hinge on community expertise, not personal knowledge (à la Burge).  
     - **Candid pitfalls**:  
       - Students may smuggle in "water" (solution: enforce nonsense words).  
       - Teams may treat criteria as rigid definitions (ask: "Did chemist override your criteria?").  
       - A team refuses coinage and points (discuss: How does language rely on shared practice?).  
     - **Limitation: The "Twin Community" Gap**:  
       - The activity cannot physically replicate *isolated* communities (like Twin Earth). Teams shared a room, so deference/chemist influenced outcomes.  
       - **Bridging in debrief**:  
         - *Hypothetical prompt*: "Imagine Team 1 was on a planet with only salt water, Team 2 on a twin planet with only sugar water. They never meet and have no chemist. Would their identical words mean the same thing?"  
         - Guide students to see: Externalism says "no"—reference diverges because environments differ, even if mental states align.  

  ---

  ### **Materials List (Cost: < $20)**  
  - **Liquids** (prepare in advance; **key: visually identical**):  
    - **Liquid A**: Salt water (20g salt per 1L water). *High conductivity.*  
    - **Liquid B**: Sugar water (50g sugar per 1L water). *Low conductivity.*  
    > *Why these?*  
    > - Identical in clarity, viscosity, evaporation rate, and odor.  
    > - Conductivity difference is undetectable without tools.  
  - **Samples**:  
    - 48 clear cups (12 per team: 4 A for naming, 4 mixed for sorting, 4 mixed for betting).  
    - Label cups secretly (e.g., "A1, A2, B1, B2") to track liquids.  
  - **Chemist Tool**:  
    - **Conductivity pen** ($10–15 online) or DIY:  
      - 9V battery + LED + wires. LED lights in salt water (conductive), not in sugar water.  
  - **Other**:  
    - Worksheets, pens, whiteboard for words/criteria.  
    - Paper towels (evaporation test).  

