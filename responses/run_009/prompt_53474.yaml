  ### **Why This Works**  
  - **Externalism staged intuitively**:  
    - Hidden conductivity parallels "hidden structure" (e.g., H₂O vs. XYZ).  
    - Critical question forces confrontation: *Was our word always tied to a hidden reality?*  
  - **Low-cost, low-risk**: Uses safe household items; no lab equipment.  
  - **Active, not passive**: Teams "live" the externalist dilemma via coordination pressure and expert deference.  

  **First-run tip**: Pre-brief the chemist and stress nonsense words to avoid "water" associations. If disputes erupt, use them to probe linguistic intentions ("Was your criteria a strict definition or a placeholder?").
