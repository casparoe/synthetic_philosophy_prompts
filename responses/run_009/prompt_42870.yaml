prompt: |-
  I teach a graduate seminar on theories of well-being, and this past Thursday's session on hedonism got stuck on the heterogeneity problem. The problem as I pressed it: the pleasantness of eating a ripe fig, of finishing a proof, of an orgasm, and of sinking into a hot bath appear to share no property beyond the word 'pleasant' — no common feel, no shared intensity scale, no single duration profile — and this threatens not only the intelligibility of summing pleasures into one total but the very claim that pleasure is a single kind of thing that could be the sole good. During discussion, a colleague offered the familiar retreat: pleasure is not a sensation but a pro-attitude — each of those episodes is a state of affairs the subject takes favorably toward, and that taking is what they all have in common. My students thought this was a bait-and-switch: the hedonist needs pleasantness to be the thing that makes a life good, they objected, and if what unifies pleasures is an attitude rather than anything felt, the view either smuggles in a desire theory or leaves the value-bearer obscure.

  I want to see whether the attitudinal line can actually be made to work, so argue for it: argue that the pro-attitude analysis dissolves the heterogeneity problem rather than merely renaming it. Make a committed case, not a survey — no 'philosophers have offered several responses'. Present the argument as exactly five numbered points, each a sentence or two, with no introduction or conclusion. Across the five points I expect you to (i) state precisely what property unifies the heterogeneous episodes; (ii) explain why summing them into a single total becomes intelligible once they are unified by that property; and (iii) confront the bait-and-switch charge directly, saying what the value-bearer is and why it is not just a desire in disguise. Two constraints: do not run the argument through the higher/lower pleasures distinction, and do not lean on the claim that pain is unified in a way pleasure is not — the case should stand on its own.
reasoning: |-
  Okay, let me approach this systematically. The user teaches graduate philosophy and wants a focused defense of attitudinal hedonism against heterogeneity objections. I need to craft exactly five points that: define the unifying property, explain summability, and counter the bait-and-switch charge - all without referencing Mill's distinction or pain asymmetry.

  First, the unifying property must be precise. Attitudinal pleasure seems key - the mental state of taking positive attitude toward some object. This avoids requiring sensory commonality. 

  For summability, I'll argue that attitudinal endorsement provides a common metric of intensity, even if phenomenology differs. Duration can be measured objectively, so totals become meaningful through combined intensity/duration.

  The bait-and-switch rebuttal needs care. I must show the value-bearer is the attitude itself, not its object. By distinguishing between attitudes and desires (attitudes are occurrent, not dispositional), and emphasizing the attitude's phenomenal dimension without requiring sensory uniformity, I can demonstrate this isn't desire theory in disguise.

  Structure check: Point 1 defines attitudinal pleasure. Point 2 establishes it as the value-bearer. Point 3 explains summability. Point 4 counters the desire-theory concern. Point 5 clarifies phenomenology's role. This flows logically while meeting all constraints.
answer: |-
  Here are five numbered points defending the attitudinal analysis of pleasure as resolving heterogeneity:

  1.  The unifying property is *occurrent, intrinsic positive attitude*: each episode involves a conscious mental state where the subject directly takes a favorable stance toward some object (sensation, activity, or state) *for its own sake* during the experience.

  2.  The value-bearer is *this act of positive attitude-taking itself*; it is the mental act of finding an experience welcome or agreeable *in the moment* that possesses intrinsic goodness, not a prior desire or the object toward which the attitude is directed.

  3.  Summing becomes intelligible because the *intensity* of the pro-attitude (the degree of favorableness or "welcomeness" felt) and its *duration* are measurable properties of the attitude-state itself, providing a common metric for aggregation ("units" of positive attitude-strength over time), irrespective of the heterogeneous objects or sensory feels involved.

  4.  This is not desire theory disguised because (a) the attitude is an *occurrent, intrinsic* favoring *of the experience as it unfolds*, not a *dispositional* desire for a future state of affairs, and (b) the value is located in the *attitude-event* happening now, not in the satisfaction of a pre-existing desire-state (which may persist unfulfilled or be satisfied without occurring pleasure).

  5.  While the pro-attitude often has a phenomenal aspect ("feeling good"), its identity as pleasure is defined by its *functional role* of being an immediate, intrinsic favoring, not by requiring a uniform sensory quale; thus, the felt character varies appropriately with its object, yet remains unified as the same type of valuable mental act.
