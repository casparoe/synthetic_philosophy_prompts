prompt: |-
  Last month I was reporting a piece on disinformation and fact-checking, and I called up a philosopher to get the "what even is truth" background quote. He told me, half off the record, that the whole "nature of truth" debate is kind of a scam -- that saying "it's true that p" just says p, and the truth predicate is basically a grammatical device for generalizing, so I can say "everything in the report is true" instead of reciting the whole report. Fine. But when I pushed on why fact-checkers even exists, or what's going on when someone says "it's true that smoking causes cancer" and it seems to do more than just assert the content -- like it's vouching, or certifying, standing behind it -- he waved me off with "that's pragmatics, not semantics." I hung up feeling like I don't actually know what to demand of a theory of truth in the first place, and I'd rather find that out before I write another word on this beat.

  So give me the spec, not the theories. Write the desiderata: what any adequate theory of truth has to deliver -- the jobs the truth predicate does (the generalization job, the endorsement/vouching job my fact-checking question was about, the norm-of-belief job where truth is supposed to be the aim of believing), the cases it has to get right ("that's not true" seems to do more than merely fail to assert; the liar and other self-referential sentences; whether statements about fiction or matters of taste are truth-apt at all), the distinctions it can't collapse -- each with the case or consideration behind it. Then tell me which of these are non-negotiable and which are just camp preferences (deflationists vs correspondence people vs the pragmatist crowd), and be straight with me about whether some subset is jointly unsatisfiable -- I've heard the liar plus the idea of a fully transparent truth predicate is exactly where deflationists get squeezed, and if that's real it seems like the kind of thing my readers should know. Last thing: flag the single requirement that does the most to knock theories out of the running. If I understand that one, I can hold my own next time a philosopher tells me the truth debate is a scam over the phone.
reasoning: |-
  Okay, the user is a journalist who recently spoke with a philosopher about truth and fact-checking. They felt brushed off when the philosopher dismissed their questions about the "vouching" function of truth as "just pragmatics." Now they want a clear breakdown of what any theory of truth must accomplish—the essential jobs of the truth predicate—before they write more on disinformation. 

  Hmm, their frustration is palpable. They’re not looking for philosophical debates (deflationism vs. correspondence, etc.); they want the *spec sheet*: the non-negotiable functions, edge cases, and where theories crack under pressure. Smart angle—they’re treating truth like a tool with a technical manual. 

  First, the core jobs:  
  - **Generalization**: The philosopher already gave them this ("everything in the report is true" avoids infinite repetition). Non-negotiable.  
  - **Endorsement/Vouching**: When fact-checkers say "this is true," it’s performative—like staking credibility. The philosopher waved this off as "pragmatics," but that’s unsatisfying. The user’s right: any theory must explain why "true" feels weighty here.  
  - **Norm of Belief**: We *should* believe true things. If truth were just grammatical sugar, why would aiming for it matter? This is ethical, not just semantic.  

  Then the hard cases:  
  - **Liar Paradox**: "This sentence is false" melts brains. Deflationists struggle here because their "transparent" truth predicate (where "true" vanishes without a trace) implodes when sentences reference themselves.  
  - **Fiction/Taste**: Is "Sherlock lived on Baker St" true? Correspondence says yes (fictional facts exist); deflationists say yes (it’s just asserting content); pragmatists might say "useful, not literal truth." But if a theory says *all* such claims lack truth values, that’s a problem.  
  - **Negation**: Saying "that’s not true" isn’t just withholding assertion—it’s rejecting the claim. The theory must capture that force.  

  The knockout punch? Probably **transparency + the liar paradox**. If a theory insists truth is purely redundant (deflationism’s sweet spot), it can’t handle self-reference without contradictions. That’s why some deflationists add logical tweaks—but purists hate that.  

  User’s readers need to know: the "scam" charge isn’t wrong—deflationists *do* think philosophers overcomplicate truth—but it’s not the whole story. The vouching and normative roles are where theories sweat. And yes, some desiderata clash (e.g., "truth is transparent" vs. "truth handles liars elegantly").  

  Final note: The user’s sharp. They spotted that "what should truth *do*?" cuts through the noise. Next time a philosopher says "it’s just pragmatics," they can ask: "Then why does calling something 'true' change how we act? If it’s only grammar, why do fact-checkers exist?" That’s the hook.
answer: |-
  Here’s the spec sheet for a theory of truth — the non-negotiable jobs it must perform, edge cases it must handle, and constraints it can’t violate. I’ll flag where theories crack under pressure.

  ---

  ### **Core Jobs of the Truth Predicate**  
  *(What "true" must do to earn its keep)*

  1. **Generalization Device**  
     - **Job**: Enable compact expression of infinite conjunctions/disjunctions.  
     - **Case**: Saying *"Everything the WHO report claims is true"* avoids listing every claim.  
     - **Status**: **Non-negotiable**. All major theories accept this (deflationists build their entire view on it).

  2. **Endorsement/Vouching Function**  
     - **Job**: Signal epistemic security or institutional certification.  
     - **Case**: A fact-checker’s *"This claim is true"* isn’t redundant — it confers authority, invites trust, and implies vetting.  
     - **Status**: **Non-negotiable in practice**. Philosophers debate whether this is "just pragmatics" (social use) or built into truth’s semantics. A theory must explain *why* attaching "true" amplifies credibility.

  3. **Norm of Belief/Assertion**  
     - **Job**: Underpin the normative force of beliefs/assertions (we *ought* to believe/assert what’s true).  
     - **Case**: Criticizing someone with *"You shouldn’t believe that — it’s not true"* implies truth is the goal.  
     - **Status**: **Non-negotiable**. Collapse this, and truth loses its role in rationality. Pragmatists reinterpret "goal" as utility; others treat it as intrinsic.

  ---

  ### **Edge Cases Any Theory Must Handle**  
  *(Fail here, and the theory is crippled)*

  4. **The Liar Paradox**  
     - **Case**: *"This sentence is false."* If true, it’s false; if false, it’s true.  
     - **Demand**: A theory must resolve or accommodate this without imploding logical consistency.  
     - **Pressure Point**: Deflationists (who see truth as purely grammatical) struggle most. Adding "true" *should* be redundant — but here it creates contradiction.

  5. **Non-Assertive "That’s Not True"**  
     - **Case**: Responding to *"Aliens built the pyramids"* with *"That’s not true"* does more than withhold assent — it actively denies.  
     - **Demand**: Explain how negation + truth predicate delivers rejection, not just non-assertion.  
     - **Status**: **Non-negotiable**. Critical for fact-checking contexts.

  6. **Truth-Aptness Boundaries**  
     - **Case**: Are statements like *"Vanilla ice cream is best"* or *"Sherlock Holmes lived on Baker Street"* truth-apt?  
     - **Demand**: Delimit which domains allow truth judgments. Correspondence theories often exclude tastes; deflationists include anything grammatical.  
     - **Stakes**: Fact-checkers need to know if "taste claims" can be "false."

  ---

  ### **Key Constraints & Distinctions**  
  *(Lines a theory can’t blur)*

  7. **Truth vs. Justification**  
     - **Constraint**: Truth ≠ being justified in believing something.  
     - **Case**: A claim justified by 18th-century science (*"Phlogiston exists"*) was never true.  
     - **Status**: **Non-negotiable**. Pragmatists risk conflating truth with ideal justification.

  8. **Truth-Bearers**  
     - **Constraint**: Specify what carries truth — propositions? sentences? beliefs?  
     - **Case**: *"It’s raining"* is true iff it’s raining — but what *is* the "it" being evaluated?  
     - **Status**: **Camp preference**, but choices have consequences (e.g., sentences vary by language; propositions are abstract).

  ---

  ### **Where Theories Crack: The Killer Test**  
  **The Transparency + Liar Paradox Combo**  
  - **Requirement**: Truth should be "transparent" — saying *" 'p' is true"* adds nothing to *"p"* itself (deflationism’s core).  
  - **Conflict**: Transparency makes the Liar Paradox unresolvable without artificial logic (e.g., banning self-reference) or abandoning transparency.  
  - **Knockout Effect**: This is the **#1 theory-killer**. Deflationists either:  
    → **Fold** by adding non-transparent fixes (e.g., hierarchical truth levels — Tarski’s approach),  
    → **Deny** the Liar is a meaningful statement (controversial), or  
    → **Accept** paraconsistent logic (where contradictions don’t explode everything).  
  - **Why It Matters**: If transparency is non-negotiable (as pure deflationists insist), the Liar breaks their theory. Correspondence/pragmatist theories handle it better but sacrifice elegance.

  ---

  ### **Camp Preferences vs. Non-Negotiables**  
  | **Desideratum**           | **Deflationism**       | **Correspondence**     | **Pragmatism**         | **Status**              |  
  |----------------------------|------------------------|------------------------|------------------------|-------------------------|  
  | Generalization             | Core strength          | Accepts                | Accepts                | **Non-negotiable**      |  
  | Endorsement function       | "Just pragmatics!"     | Built into "facts"     | Tied to usefulness     | **Must explain it**     |  
  | Norm of belief             | Minimal (grammatical)  | Strong (mind-world fit)| Redefined as "success" | **Must ground norm**    |  
  | Handles Liar Paradox       | Fails (without fixes)  | OK (with stratification)| Mixed                  | **Non-negotiable**      |  
  | Truth-aptness of fictions  | Yes (any assertion)    | No (no real referent)  | Yes (if useful)        | **Camp preference**     |  
  | Transparency               | SACRED                 | Rejected               | Rejected               | **Major split**         |  

  ---

  ### **The Takeaway for Your Reporting**  
  - **The philosopher wasn’t wrong** — deflationism *does* handle generalizations cleanly. But dismissing endorsement as "just pragmatics" ignores why fact-checkers exist: **truth predicates are social tools for certifying claims in contexts of doubt**.  
  - **The Liar Paradox is the tripwire**: It exposes whether a theory is *too* simple. Pure deflationism stumbles here; correspondence adds metaphysical "weight"; pragmatism swaps truth for utility.  
  - **What to demand next time**: Ask *"How does your theory handle the Liar Paradox while keeping truth both transparent and normative?"* If they dodge, you’ve spotted the crack.  

  **Bottom line**: Truth isn’t a "scam," but no theory delivers everything cleanly. Your readers deserve to know: truth’s simplicity is deceptive — and its paradoxes are where the real story lies.
