  Structural conditions are the same: same societal factors, same evidence, same institutional weaknesses. The only variable is the editor's decision. Great Man theory would predict that without Clemenceau's courage, the Dreyfusard movement fails, leading to prolonged injustice and possibly an authoritarian regime. Structuralists would argue that structural tensions would eventually lead to a similar outcome regardless, maybe through other pressures like socialist movements or international scandals.

  The key feature here is the presence of a viable, morally courageous counter-elite figure. If removed, structuralists could argue that other actors would fill the void, making the outcome overdetermined. Great Man theorists would counter that such figures are rare and their absence changes the trajectory.

