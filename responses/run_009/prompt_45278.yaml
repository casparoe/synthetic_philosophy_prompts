prompt: |-
  you're a philosopher of history who also thinks hard about how novels construct counterfactuals, so think carefully before answering. I'm a novelist drafting an alternate-history book and I want the philosophy to be load-bearing, not vibes. Construct for me a thought experiment that cleanly separates Great Man explanations from structural explanations. The scenario: hold structural conditions fixed (economic misery, a humiliated national identity, an existing antisemitic press culture, a weak democracy, etc.) and vary only the individual, so that the Great Man theorist and the structuralist make different predictions about the outcome -- and the case must be built so that neither theory can just stipulate its own answer, the verdict has to fall out of the setup. Constraints: keep it realistic, one paragraph, no time travel and no literal clones, and don't make it a thinly disguised WWII retread (no mustache, no Munich). After the scenario, briefly brainstorm what each side would predict and why, then tell me which single feature of the case is doing the work, what happens to the disagreement if i remove that feature, and how the side that comes out worse would attack the case. End with your own verdict on which theory handles your scenario better and one sentence on how I'd use it in the book. no citations or reading lists please, i just want your reasoning.
