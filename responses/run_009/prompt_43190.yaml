answer: |-
  Here’s a structured specification of desiderata for a theory of omissive causation, designed to navigate your dual aims (metaphysical grounding + responsibility attribution) and tensions. For each, I note whether it’s neutral or theory-laden, flag joint satisfiability issues, and briefly assess major approaches.

  ---

  ### **Desiderata for a Theory of Omissive Causation**

  1.  **The Multiplicity Problem**  
      *   **Requirement:** The theory must distinguish *relevant* omissions (e.g., the lifeguard’s failure) from the vast, trivial set of counterfactual dependencies (e.g., the President’s failure to save the swimmer), without collapsing into attributing causation equally to all absences or ad hoc pruning. The selection mechanism must be principled and metaphysically transparent.  
      *   **Motivating Case:** Lifeguard vs. President not saving the swimmer; Gardener’s failure vs. the raincloud’s failure to form.  
      *   **Neutrality:** **Hostage.** Distinguishing "relevant" omissions inherently pressures the theory towards normativity (duties, expectations, statistical norms) or specific contrast classes. A purely physicalist/event-based metaphysics may struggle to provide a non-arbitrary principle here without smuggling in norms.

  2.  **Omission vs. Double Prevention**  
      *   **Requirement:** The theory must clarify the metaphysical relationship between *direct omission* (absence causing an effect, e.g., no water causing death) and *double prevention* (removing an inhibitor, e.g., cutting a wire preventing a signal that would have stopped an explosion). Are they fundamentally the same causal structure (e.g., both involving counterfactual dependence on an absence), or distinct (e.g., one lacks a physical process)?  
      *   **Motivating Case:** Gardener not watering (direct omission) vs. removing a clog preventing water flow (double prevention).  
      *   **Neutrality:** **Relatively Neutral.** While the *description* is neutral, the *resolution* often depends on prior commitments about causal relata (events? absences? processes?) and the necessity of physical connections. Treating them as identical simplifies the ontology; distinguishing them may better capture intuitions about "directness" or physicality.

  3.  **The Boundary Problem**  
      *   **Requirement:** The theory must account for the *temporal indeterminacy* of omissions (e.g., *when* did the gardener fail? The entire drought period? The last possible watering moment?) and resolve whether absences have *spatiotemporal location* at all. If absences lack location, the theory must reconcile this with physicalist models of causation as localized transactions.  
      *   **Motivating Case:** Gardener fails to water over weeks; which precise temporal slice of this absence caused the plant’s death at time T?  
      *   **Neutrality:** **Hostage.** Requires a stance on the ontology of absences (are they genuine entities/events? negative facts? purely counterfactual constructs?) and the nature of time/causation (is causation fundamentally local and instantaneous? or can it be "spread out"?). A process-based metaphysics faces acute challenges here.

  4.  **The Unification Question**  
      *   **Requirement:** The theory must specify whether omissive causation and productive ("positive") causation are instances of the *same fundamental relation* or two distinct relations sharing a name. If distinct, it must explain the shared terminology (e.g., similar counterfactual structure, similar role in explanation/responsibility). If the same, it must accommodate the apparent differences (e.g., lack of physical connection in omissions).  
      *   **Motivating Case:** Does "caused" mean the same thing in "The rock caused the window to break" and "The lack of water caused the plant to die"?  
      *   **Neutrality:** **Hostage.** Deeply tied to core metaphysical commitments about causation itself (e.g., is causation fundamentally difference-making? energy transfer? process propagation?). A counterfactual theorist finds unification easier; a process theorist finds it harder.

  5.  **Responsibility Attribution Constraint**  
      *   **Requirement:** The theory must provide resources to justify why *specific agents* (lifeguard, gardener) are held responsible for their omissions, while structurally similar absences by others (non-lifeguards, clouds) are not, without circularly invoking responsibility norms *as the cause*.  
      *   **Motivating Case:** Lifeguard’s omission is culpable; a random passerby’s identical omission is not.  
      *   **Neutrality:** **Hostage.** Heavily pressures the theory towards incorporating normativity (duties, roles, expectations) or specific agent-relative capacities into the *metaphysics* of causal relevance itself, conflicting with purely descriptive/physicalist aims.

  6.  **Metaphysical Parsimony / Legitimacy**  
      *   **Requirement:** The theory must not posit metaphysically dubious entities (e.g., negative events, absences as concrete particulars) without strong justification, and should minimize commitment to irreducible normativity if aiming for fundamental metaphysics.  
      *   **Motivating Case:** Avoiding a proliferation of "negative entities" or making causation inherently normative.  
      *   **Neutrality:** **Hostage.** Reflects prior ontological commitments (e.g., Quinean scruples vs. Meinongian inclinations) and views on naturalism/normativity.

  7.  **Avoid Over/Under-Generation**  
      *   **Requirement:** The theory must not:  
          *   **Over-generate:** Count too many omissions as causes (e.g., the President’s omission in the lifeguard case).  
          *   **Under-generate:** Fail to count clear cases of causally relevant omissions (e.g., the lifeguard’s omission).  
          *   **Motivating Case:** Distinguishing the lifeguard (should be a cause) from the President (should not).  
      *   **Neutrality:** **Relatively Neutral.** Capturing intuitive judgments is a core task, though *which* intuitions matter (metaphysical vs. responsibility) may vary.

  ---

  ### **Tensions & Joint Satisfiability**
  *   **Core Conflict:** **Metaphysical Grounding vs. Responsibility Attribution.** A theory satisfying (1) Multiplicity and (5) Responsibility likely *requires* incorporating normativity (duties, roles) or agent-relative contrasts into the causal relation itself. This directly conflicts with (6) Metaphysical Parsimony/Legitimacy for theorists seeking a purely physical, non-normative metaphysics of causation. Resolving (1) without norms is arguably the hardest challenge for pure metaphysics.
  *   **Secondary Conflict:** **Unification vs. Physicalism.** Satisfying (4) Unification with productive causation is difficult for theories committed to (3) Boundary/Locality and physicalist models (e.g., conserved quantities). Treating omissions as causes often requires relaxing physicalist constraints.
  *   **Possible Trade-off:** One might pursue a *dual-aspect* theory: a sparse, non-normative metaphysics of causation (handling (4) and (6)) combined with a separate, norm-laden account of *causal explanation/relevance* for responsibility (handling (1), (5), (7)). However, this risks making the metaphysics irrelevant to responsibility attributions.

  ---

  ### **Assessment of Major Approaches (Brief)**

  1.  **Pure Counterfactual Dependence:**  
      *   *Pros:* Handles unification (4), some responsibility cases via context/variable framing (5, 7-under-gen).  
      *   *Cons:* Fails Multiplicity (1) catastrophically (over-generation), struggles with Boundary (3) (indeterminate relata), may violate Parsimony (6) if absences are reified. Relies on often-unstated pragmatic/normative factors to prune omissions for responsibility.

  2.  **Conserved-Quantity/Process Theories:**  
      *   *Pros:* Strong on Parsimony (6), Boundary/Locality (3), avoids dubious entities. Clearly distinguishes omission from production.  
      *   *Cons:* Under-generates for omissions (7) – often denies they are genuine causes, failing (4) Unification and core Responsibility cases (5). Struggles with Double Prevention (2).

  3.  **Contrastive/Default-Relative (Norms-Based):**  
      *   *Pros:* Best solution to Multiplicity (1) and Responsibility (5) by using norms/expectations/roles to select relevant omissions. Can handle Boundary (3) via context.  
      *   *Cons:* Violates Metaphysical Parsimony/Legitimacy (6) for naturalists by making norms constitutive of causation. Unification (4) with productive causation is strained (are norms always involved?). May struggle with Double Prevention (2) if norms don't apply cleanly.

  This desiderata list highlights that your dual purposes likely *are* in tension; a theory optimized for responsibility attribution will likely be metaphysically "impure," while a pure metaphysics may lack the resources for robust responsibility attribution without supplementation. The Multiplicity Problem is the sharpest point of conflict.
