prompt: |-
  I work on a team that surveys the public about what AI systems should and shouldn't be allowed to do, and I've started noticing a recurring move in the arguments that follow once the results come in. Whenever we hit a substantive disagreement — should the system track the median respondent or give each subculture a veto over its own domain; how much weight, if any, do future people get — someone proposes to dissolve the disagreement by going up a level: don't decide the question, decide who decides it. Then the same fight immediately resumes at the new level, over who counts as a participant in the deciding-who-decides procedure, over whether the procedure may correct the participants' raw preferences, and so on. Each escalation feels like progress, because a concrete value judgment gets replaced by a process, but I have never seen the process terminate in agreement; it just spawns a more abstract version of the original dispute. It's not simple buck-passing, since the higher level genuinely adds new content, and it's not just the observation that procedures themselves embed values, though that seems related — I gather some political philosophers have said roughly that about the ideal of the neutral state. What I'm after is the specific regress: disagreement → procedure → disagreement about the procedure → procedure-over-the-procedure, indefinitely, with the choice at each level looking about as contestable as the one it was meant to settle. Does this configuration have an established name, whether in political philosophy, social choice, or the philosophy of rules? I'm not looking for a bare label: I want the nearest well-formed concepts, how each differs from what I've described, and which one fits best. If nothing fits, please coin a term, define it so that it's clearly distinct from ordinary delegation and from run-of-the-mill disagreement about meta-rules, and say where you would draw its boundary cases.

  Please structure your answer with the following sections, in this order: "Nearest concepts" (roughly 250 words), "Why each is not quite it" (roughly 150 words), "Verdict" (roughly 100 words), and "Definition and boundary cases" (roughly 200 words).
reasoning: |-
  Hmm, the user describes a recurring pattern in their work involving public surveys about AI ethics. They observe that when substantive disagreements arise—like how to weigh different subcultures or future people—participants often escalate to meta-level procedures about "who decides." But this just reproduces the same disagreement at a higher level, creating an infinite regress. They want to know if this has a name in philosophy or social choice theory, or if we should coin a term for it.

  The user's scenario involves AI ethics surveys where disagreements about values lead to procedural debates. The core problem is an infinite regress: each attempt to resolve conflict by moving to a meta-level just reignites the dispute about the new procedure. This isn't ordinary delegation or simple meta-rule disagreement—it's a persistent, self-replicating pattern where each escalation adds new contestable elements.

  I recall several related concepts from political philosophy and decision theory. Proceduralism focuses on fair processes but assumes agreement on procedures; the user's case shows no such agreement. Meta-rules are higher-order rules, but here the conflict recurs infinitely. Infinite regress appears in philosophy (like justifying justifications), but usually as a logical flaw, not a practical decision-making loop. The discursive dilemma shows group reasoning inconsistencies but doesn't capture the escalating abstraction. Delegation involves transferring authority, but here the authority itself is contested repeatedly.

  None of these fully fit because they don't emphasize the indefinite, abstracting nature of the regress where each level introduces new substantive disputes. Proceduralism stops at designing one fair process; meta-rules are finite hierarchies; infinite regress is often theoretical; discursive dilemma is about simultaneous contradictions; delegation assumes the delegator's legitimacy.

  I'll propose "procedural regress" as a new term. It's defined as an infinite escalation where value conflicts re-emerge at each meta-procedural level, becoming more abstract but no less contested. Boundary cases include: stopping after one meta-level move (not regress), pure power struggles without proceduralization, and cases where higher procedures resolve lower disputes. The essence is the endless regeneration of conflict through procedural abstraction.
answer: |-
  ### Nearest concepts
  The pattern you describe resonates with several established ideas:
  1.  **Proceduralism (Political Philosophy):** The view that legitimacy arises from fair procedures rather than substantive outcomes (e.g., Habermas's discourse ethics, Rawlsian procedural justice). It addresses resolving disputes via process.
  2.  **Meta-Rules/Constitutive Rules (Legal/Philosophy of Rules):** Rules about how to make, change, or interpret other rules (e.g., Kelsen's Grundnorm, Hart's secondary rules). This explicitly involves rules governing rule-making.
  3.  **Infinite Regress (General Philosophy/Logic):** A sequence of reasoning or justification that never terminates, requiring a prior justification ad infinitum (e.g., justifying rule A by rule B, which needs rule C...). This captures the non-terminating structure.
  4.  **Discursive Dilemma/Social Choice Paradoxes:** Situations where consistent individual judgments lead to inconsistent collective judgments, highlighting aggregation problems. This reflects the difficulty of translating individual preferences into a stable group decision, even about procedures.
  5.  **Delegation Problem (Governance/Decision Theory):** Challenges in designing mechanisms where one entity authorizes another to decide, including defining the mandate and selectorate. This captures the "who decides?" move.

  ### Why each is not quite it
  *   **Proceduralism:** Focuses on the *value* of procedure as a solution, not the *pathology* of endlessly contesting *which* procedure is fair. It assumes procedures can resolve disputes, whereas you observe procedures *generating* structurally identical disputes.
  *   **Meta-Rules:** Describes the hierarchy of rules but doesn't inherently imply the *indefinite recurrence* of disagreement or the *substantive contestability* persisting at each meta-level. Meta-rule disagreements can be settled.
  *   **Infinite Regress:** Captures the *form* (A needs B, B needs C...) but is often discussed as a *logical flaw* in justification (e.g., epistemology). Your case involves *practical, value-laden disagreements* regenerating at each procedural level, not just an abstract logical loop.
  *   **Discursive Dilemma/Social Choice Paradoxes:** Explain inconsistencies in aggregating preferences *within* a fixed procedure, not the dynamic *escalation* to meta-procedures and the regeneration of deep value conflicts *about* the aggregation method itself.
  *   **Delegation Problem:** Focuses on challenges *within* a delegation act (e.g., agent slack, mandate ambiguity). Your phenomenon is the *repeated invocation* of delegation/proceduralization as an apparent solution that only defers the core value conflict to a new, equally contested arena.

  ### Verdict
  No single established concept perfectly captures the specific dynamic you describe: **substantive value disagreement persistently regenerating as equally contestable procedural disagreements at ever-higher meta-levels, creating a non-terminating regress of proceduralization.** While "infinite regress" describes the *structure* and "proceduralism" the *content*, the core phenomenon – the **indefinite displacement and abstraction of value conflicts through recursive proceduralization** – lacks a precise label. Coining a new term is warranted.

  ### Definition and boundary cases
  **Term:** **Procedural Regress**

  **Definition:** Procedural Regress is a dynamic in collective decision-making or normative justification where an attempt to resolve a substantive disagreement by appealing to a higher-level procedure (e.g., "decide who decides") fails to achieve closure. Instead, the core points of substantive disagreement (e.g., who counts, how preferences are weighed, the scope of authority) identically re-emerge as disagreements *about* the design, legitimacy, or application of that higher-level procedure. This triggers a further move to an even higher meta-procedure, perpetuating the cycle. The defining features are: (1) The *persistence* of the underlying value conflict across levels; (2) The *structural similarity* of the disagreement at each new meta-level; (3) The *indefinite potential for escalation*; (4) The *illusion of progress* through increasing abstraction.

  **Boundary Cases:**
  *   **Not Procedural Regress:** Disagreement about a substantive rule *followed by* agreement on a fair procedure to settle it (e.g., agreeing to vote, then voting). The regress stops at one meta-level.
  *   **Not Procedural Regress:** Disagreement about a rule *followed by* a shift to power politics or coercion to impose an outcome without invoking a new legitimizing procedure.
  *   **Not Procedural Regress:** Disagreement about meta-rules that is *qualitatively different* (e.g., arguing about efficiency vs. fairness in designing a voting system, when the original dispute was about resource allocation). The core conflict transformed.
  *   **Edge Case / Potential Trigger:** A single move to a meta-procedure that *itself* contains ambiguities likely to reignite the original dispute type (e.g., "Follow the constitution" where the constitution's interpretation hinges on the original conflicting values). This could initiate a regress but isn't the full cycle.
  *   **Core Case:** The cycle described – disagreement → proceduralization → isomorphic meta-disagreement → further proceduralization → ... with no stable resolution point in sight, driven by the same fundamental value tensions recurring abstractly.
