prompt: |-
  I'm preparing a short position statement on the two-envelope paradox for a decision-theory reading group, and I'd like a consistency audit of my views before I circulate it. My package is as follows: (1) In the classic symmetric setup — one envelope contains twice the other, the pair was generated symmetrically, and mine is unopened — I should be indifferent to switching, and symmetry alone settles this. (2) The standard argument for switching is sound as far as it goes: conditional on my envelope containing amount x, the other is equally likely to contain 2x or x/2, so the expected gain conditional on any observed x is x/4, which is positive for every x. (3) In a truncated version — say the amounts are powers of two from $1 to $1024 chosen with known probabilities, and I open my envelope and see $64 — I should compute the conditional probabilities properly given the full setup and switch exactly when that calculation favors switching. (4) I don't accept that the paradox is "really" about infinite expectations or improper priors: something puzzle-like survives whenever the agent can open the envelope and reason conditionally, even with every expectation finite. (5) I accept a plausible aggregation principle: if, for every possible observation I could make, the expected gain from switching conditional on that observation is positive, then I should switch even without opening the envelope. Does this set hang together? Identify where the commitments genuinely pull against each other and where an apparent conflict dissolves on inspection, and tell me which single revision is cheapest. Please respond with a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion.
