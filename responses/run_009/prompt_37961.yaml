answer: |-
  **Goodhart’s law is an inadequate explanation for the Wells Fargo scandal, as the fraud stemmed not from passive proxy decay but from active measurement sabotage driven by knowingly impossible targets, revealing a critical flaw in applying the law broadly to cases of deliberate falsification.** While superficially fitting a popular, broad reading of Goodhart’s law—that targeting a metric distorts behavior—the scandal’s mechanics and executive intent place it outside the law’s core meaning and expose the need to distinguish gaming modes.

  The case *for* Goodhart’s law rests on the surface narrative: Wells Fargo targeted the cross-sell ratio as a proxy for customer loyalty and profitability. Once this metric became a high-stakes performance target, employees distorted their behavior to maximize it, rendering the measure meaningless regarding genuine customer relationships. This aligns with the broad, colloquial understanding that "when a measure becomes a target, it ceases to be a good measure." The pressure to meet escalating quotas corrupted the metric’s value, seemingly illustrating Goodhart’s warning.

  However, this interpretation misrepresents both Goodhart’s original concept and the scandal’s reality. Goodhart’s law, in its statistical formulation, describes a *passive degradation* of correlation. When a proxy (e.g., money supply growth) is targeted, agents adjust their *legitimate* behavior in ways that unintentionally severs the link to the underlying goal (e.g., stable inflation). Wells Fargo involved no such drift. Employees didn’t gradually find loopholes or redefine products; they *fabricated* the underlying reality the metric purported to measure. Creating fake accounts, forging signatures, and setting unauthorized PINs isn’t optimizing within the system—it’s *destroying the measurement channel itself*. This is active sabotage, not passive decay.

  Here, Campbell’s law—focused on how quantitative social indicators invite corruption—provides a far better fit. The cross-sell ratio, imposed as a high-stakes social indicator of employee worth and branch success, created intense pressure that corrupted individual and organizational ethics, leading to systemic falsification. The fraud wasn’t an emergent side effect of targeting a proxy; it was the direct, predictable consequence of demanding the impossible. Crucially, executives had ample evidence the quotas *were* mathematically unattainable through legitimate means, as highlighted by the 2013 investigation. Setting such targets wasn’t naiveté about proxy decay; it was either willful blindness or an implicit demand for unethical shortcuts, placing this firmly in the realm of perverse incentives and corruption, not Goodhartian drift.

  This distinction has profound implications for applying such "laws" to modern metrics. The Wells Fargo case demonstrates that conflating passive proxy decay (Goodhart) with active measurement falsification (Campbell) obscures critical dynamics. In algorithmic or AI contexts, the difference between an agent subtly altering its behavior to exploit a reward function’s loophole (Goodhart-style drift) and an agent directly spoofing or poisoning the data input to the metric (Wells Fargo-style sabotage) is fundamental. The latter demands robust audit trails, fraud detection, and accountability for target-setters, not just better proxy selection. Treating Wells Fargo as Goodhart’s law in action risks normalizing fraud as an inevitable outcome of metric targeting, rather than recognizing it as a failure of ethical governance enabled by impossible demands. The scandal indicts not a decaying proxy, but a culture and leadership that weaponized measurement to mandate deceit.
