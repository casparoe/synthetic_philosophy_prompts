prompt: |-
  For years I've followed the debate over why promises bind, and it has settled into a rut I would like to understand rather than referee. On one side, the practice-based camp, in the lineage of Hume and Rawls, holds that promissory obligation is the product of a social convention: by invoking the practice you accept enforcement by its rules. On another, the assurance camp, associated with Scanlon's later work, locates the wrong in deliberately inducing an expectation you then let down. On a third, the obligation arises from the exercise of a normative power — the promisor's declaration, like consent, creates a duty at will. The debate runs on well-worn counterexamples: promises to the dead, promises the promisee begs you to break, promises between two castaways who invent the institution from scratch, promises extracted by fraud, promises waived before being relied on. Each camp patches its theory to accommodate these, the others call the patches ad hoc, and nobody has moved in decades. My working hypothesis is that the three camps are not answering the same question: one is after a conceptual account of what makes something a promise at all, one a normative account of what makes breach wrong when it is wrong, and one a theory of how persons can create duties at will — and that a good deal of the fight is a verbal dispute over 'binding'. But I am unsure how much is verbal and how much is a genuine clash of starting intuitions that neither side can argue for without begging the question. Diagnose what kind of disagreement this really is, supporting your diagnosis with what each side actually says about the cases. Then tell me what would count as progress given your diagnosis — a new distinction, a reformulated question, a shared criterion of success for accounts of promising — or else argue that no progress should be expected here, and why.

  Please answer in British English.
reasoning: |-
  Hmm, I need to tackle this user's query about the philosophy of promising. They've been following the debate for years and feel it's stuck in a rut with three main camps: practice-based (Hume/Rawls), assurance (Scanlon), and normative power. The user suggests these camps might be answering different questions and wonders how much is verbal dispute versus genuine disagreement. They want me to diagnose the nature of the disagreement using examples, then suggest what progress might look like.

  First, I should recall the core positions. The practice-based camp sees promissory obligation as emerging from social conventions - it's like joining a game with pre-set rules. Then there's Scanlon's assurance view where the wrong comes from intentionally creating and then disappointing expectations. And the normative power camp treats promising as a speech act that creates duties by declaration, similar to consent.

  The user mentions classic counterexamples that challenge all theories: promises to the dead (who can't have expectations), promises requested to be broken (undermining assurance), castaway promises (no pre-existing institution), fraudulent extraction, and waived promises before reliance. Each camp tries to handle these but gets accused of ad hoc fixes.

  The user's hypothesis makes sense - these camps might be focused on different aspects. I should test this by seeing what each says about the examples. For dead promises: practice theorists might say the institution binds you anyway; Scanlonians struggle with no living expectation; power theorists just see the declaration as binding. For castaways: practice camp has trouble with no convention; assurance might work if expectations form; power view thrives on sheer declaration.

  This suggests the camps operate at different levels: practice-based defines what counts as promising; assurance explains the moral wrong of breaking promises; power theory addresses how duties get created. Their disagreement about "binding" could be verbal - meaning different things by obligation. But there's deeper conflict too, like whether morality requires social context.

  For progress, I could propose distinguishing these questions explicitly. Following Raz, we might separate the "practice definition" from "wrong-making features." Or introduce a success criterion: a theory should explain both standard and edge cases without ad hoc moves. Since no theory handles all cases smoothly, we might need pluralism - acknowledging multiple sources of obligation depending on context. But I should also note that some conflicts are fundamental, rooted in different moral intuitions that are hard to reconcile without circularity.

  I'll structure my response by first analysing each camp's take on the cases to diagnose the disagreement, then suggest pathways for progress. The user seems frustrated with the stalemate, so emphasizing constructive next steps will be key. I'll use British English as requested.
answer: |-
  Your diagnosis of the debate is remarkably astute. The decades-long stalemate over promissory obligation stems largely from the three camps addressing distinct, albeit overlapping, philosophical questions using the same vocabulary ("binding," "obligation"). However, there *is* also a genuine clash of intuitions about the fundamental source of normativity. Let's dissect it using the cases you provided.

  **Diagnosis: Different Levels of Inquiry Masquerading as Direct Competition**

  1.  **The Practice-Based Camp (Hume, Rawls): What is the *Institution* of Promising?**
      *   **Core Question:** What constitutes a promise *within a social framework*, and how does that framework generate normative expectations?
      *   **What "Binding" Means:** Obligation arises from voluntarily invoking a socially established rule-system. Breaking a promise is primarily wrong as a violation of a constitutive rule of a valuable social practice ("playing the game wrongly").
      *   **On the Cases:**
          *   **Promises to the Dead:** Problematic. The institution relies on reciprocal expectations and enforcement among participants. A promise to someone who ceases to exist *as a participant* strains the model. Proponents might argue the obligation persists as a duty *to the practice itself* (e.g., maintaining trustworthiness), or perhaps as a duty to third parties (heirs/society), but this feels strained.
          *   **Promisee Begs You to Break:** Easy. The promisee, as participant, can release you. The rules of the practice allow for waiver.
          *   **Castaways Inventing Promises:** *Severe* problem. If the practice requires a pre-existing convention, how can two individuals invent it *ex nihilo* and be bound? Proponents might argue rudimentary conventions emerge spontaneously (like a mini-society), but this stretches the "established practice" notion.
          *   **Fraudulent Extraction:** Unbinding. The promisor didn't *voluntarily* invoke the practice under proper conditions (lack of genuine consent).
          *   **Waived Before Reliance:** Unbinding. Waiver is a rule within the practice.
      *   **Critique:** Excellent at explaining the *standard form* of promising within society. Struggles with edge cases (dead, castaways) because its core explanatory power is the *social framework itself*. The "patch" for castaways feels particularly *ad hoc*.

  2.  **The Assurance Camp (Scanlon): What is the *Wrong* in Breach?**
      *   **Core Question:** What makes breaking a promise *morally wrong* when it is wrong? (Scanlon focuses on Principle F: the wrong of intentionally inducing reliance and then failing to fulfil the expectation without adequate reason).
      *   **What "Binding" Means:** The obligation stems from the moral duty not to harm others by manipulating their expectations. The "binding" force is the moral wrongness of letting down induced, justified reliance.
      *   **On the Cases:**
          *   **Promises to the Dead:** Initially problematic (no living person to let down). Scanlonians might argue: a) inducing false expectations *while the promisee lived* was wrong *then*, or b) the breach harms others (e.g., the promisee's heirs, society's trust) *now*. This requires careful extension beyond Principle F's core.
          *   **Promisee Begs You to Break:** Easy. No expectation is induced, or it's specifically waived. No harm, no foul.
          *   **Castaways Inventing Promises:** Solvable. If A makes a declaration intending B to rely on it, and B does form that expectation based on A's intention, Principle F applies. The *institution* isn't necessary, just the intentional inducement and subsequent reliance.
          *   **Fraudulent Extraction:** Binding? Tricky. Scanlon focuses on the promisor's *intention* to induce assurance. If the fraudster *genuinely* relied (even if based on deceit), Principle F might *still* apply to the promisor who let *that* reliance down, though other wrongs (fraud) dominate. If the fraudster didn't rely, Principle F doesn't bind.
          *   **Waived Before Reliance:** Unbinding. No reliance is induced or it's cancelled before forming.
      *   **Critique:** Excels at explaining the core *moral wrong* in most breaches and handles castaways well. Struggles cleanly with dead promises (requiring shifts) and can feel strained on fraudulent extraction (is the promisor *really* morally bound to the fraudster?).

  3.  **The Normative Power Camp (Raz, Shiffrin, perhaps Owens): What is the *Mechanism* of Obligation Creation?**
      *   **Core Question:** How can a mere utterance/declaration by an agent *create* a new moral duty where none existed before? What *kind of act* is promising?
      *   **What "Binding" Means:** Obligation arises directly from the promisor's exercise of a normative power – a special moral capacity akin to consent, command (in authority relations), or gift-giving. The declaration *itself* constitutes the undertaking of a duty.
      *   **On the Cases:**
          *   **Promises to the Dead:** Binding. The promisor exercised their power to undertake a duty. The promisee's continued existence isn't necessary for the duty *to have been created*.
          *   **Promisee Begs You to Break:** Binding *unless* the promisee exercises *their* normative power to release you (accepting waiver as part of the power).
          *   **Castaways Inventing Promises:** Binding. If the declaration is sincere and understood as an undertaking, the normative power is exercised, creating the duty. No prior institution needed.
          *   **Fraudulent Extraction:** Unbinding or Voidable. The power wasn't exercised voluntarily/validly (lack of proper consent). It might be akin to invalid consent.
          *   **Waived Before Reliance:** Binding *unless* waived. The duty exists from the moment of promising; reliance is irrelevant to its *creation*, though perhaps relevant to the *wrongness* of breach.
      *   **Critique:** Handles dead promises and castaways powerfully. Provides a clear mechanism. Struggles most with the *source* and *limits* of this normative power. Why does this power exist? What defines its scope? The answer often loops back into practice (powers exist within practices) or consequences (powers are valuable), making it seem less fundamental. Can feel overly formal, potentially detaching obligation from the interpersonal relationship central to Scanlon.

  **The Nature of the Disagreement:**

  1.  **Verbal Dispute:** A significant portion *is* verbal. When they argue about what "makes a promise binding," they often mean:
      *   (Practice): "What incorporates this act into a rule-governed social practice?"
      *   (Assurance): "What constitutes the moral wrong in breaking it?"
      *   (Power): "How is a new moral duty created by this speech act?"
      *   Using "binding" ambiguously obscures these different targets.
  2.  **Genuine Clash of Foundational Intuitions:** Beneath the verbal confusion lies a deep disagreement about the *source* of promissory normativity:
      *   **Practice:** Normativity is *conventional* and *socially grounded*. Morality here is fundamentally shaped by beneficial social practices.
      *   **Assurance:** Normativity is rooted in *interpersonal morality* – the duty not to harm others through manipulation of expectations. The social practice is just a common *context*.
      *   **Power:** Normativity arises from *moral agency* – the capacity of agents to intentionally alter their own and others' normative positions through performative acts. This might draw on deontology or a specific view of autonomy.
      *   **The Clash:** Each camp's starting point makes the others' explanations seem derivative or incomplete. The Practice theorist sees Assurance as ignoring the constitutive role of the institution; the Assurance theorist sees Practice as reducing morality to convention and Power as mysterious; the Power theorist sees Practice as contingent and Assurance as failing to capture the unique *creation* of duty. These intuitions are bedrock; arguments often presuppose them.

  **Pathways to Progress:**

  Given this diagnosis, progress is possible, but it requires reframing, not just more counterexamples:

  1.  **Explicit Disambiguation & Division of Labour:**
      *   **Reformulate the Questions:** Consciously separate:
          *   **The Practice Question:** What defines an act *as* a promise within a social context? What are its constitutive rules?
          *   **The Wrongness Question:** What makes breaking a promise morally wrong in specific instances? (This may depend on context - reliance, harm, intent, etc.).
          *   **The Power Question:** Is there a distinct moral power to bind oneself? If so, what is its scope, justification, and relationship to the practice/wrongness?
      *   **Acknowledge Interdependence:** Acknowledge that answers to one question might *inform* or *constrain* answers to others, but they need not be fully reducible. For example, the Practice view might answer the first question, while Assurance answers the second *within* that practice. Or the Power view might answer the third, but the *content* and *enforceability* of the duty might be shaped by practice or consequences.

  2.  **A Shared Criterion of Success: Explaining the "Life-Cycle" of Promises:**
      *   Instead of seeking a single "source of bindingness," demand that a theory (or combination) adequately explains the *entire phenomenon* across diverse cases:
          *   **Creation:** How/why does the utterance *generate* an obligation? (Power/Practice)
          *   **Persistence:** What sustains the obligation over time? (Practice/Power/Interpersonal Duty)
          *   **Content:** How is the *scope* of the obligation determined? (Practice/Communication/Context)
          *   **Waiver/Release:** How can the obligation be dissolved? (Practice/Power/Interpersonal Dynamics)
          *   **Wrongness of Breach:** *Why* is breaking it wrong in different scenarios? (Assurance/Disappointment/Harm/Violation of Trust)
          *   **Edge Cases:** How does it handle the dead, castaways, fraud, waiver without reliance?
      *   No single camp currently explains all facets seamlessly. Progress lies in identifying which facets each camp explains best and how they might fit together, or in developing a more unified account that integrates them.

  3.  **Focus on the Limits of the Power/Intention:**
      *   The Power view offers the most parsimonious solution for castaways and dead promises. Progress might come from a sharper analysis of the *necessary and sufficient conditions* for exercising this power validly:
          *   What mental states (intention, understanding) are required?
          *   What contextual conditions (minimal reciprocity? shared understanding of commitment? absence of coercion/fraud?) enable it?
          *   How does this power relate to other normative powers (consent, authority)?
      *   This could bridge towards Practice (context enabling the power) and Assurance (the intention to induce reliance might be part of the power's exercise).

  4.  **Accept Pluralism or Contextualism:**
      *   Acknowledge that promissory obligations might arise from *different sources* in different contexts.
      *   **Standard Social Context:** The Practice provides the framework, Assurance explains the core wrong of breach, and the Power operates *through* the practice.
      *   **Castaway Context:** The Power (enabled by minimal mutual recognition) creates the duty; Assurance explains the wrong of breach.
      *   **Promise to the Dead:** The Power creates a duty; the *wrong* of breach might be less about harming the dead and more about failing in one's own commitment, self-betrayal, or perhaps a weak duty to honour the past wishes of others (a distinct moral consideration).
      *   Progress involves mapping out these contexts and the interplay of factors.

  **Conclusion:**

  While significant verbal dispute muddies the waters, the core disagreement reflects a genuine and profound divergence in foundational moral intuitions about the source of normativity (convention vs. interpersonal harm avoidance vs. autonomous agency). Expecting one camp to fully vanquish the others is unrealistic; the questions they prioritise are different, and their core strengths and weaknesses are deeply entrenched.

  **Progress lies in:**

  1.  **Explicitly distinguishing** the conceptual, normative, and power-related questions.
  2.  **Developing a shared criterion** demanding explanation of the *whole life-cycle* of promissory obligation, including edge cases.
  3.  **Exploring integration or contextual pluralism** – recognizing that different aspects might be best explained by different theoretical components depending on the circumstances.
  4.  **Sharpening the analysis of the normative power**, if accepted, to clarify its conditions and justification.

  The debate shouldn't be abandoned, but it needs to move beyond the cycle of counterexamples and *ad hoc* patches by reframing its objectives towards a more comprehensive, nuanced, and perhaps pluralistic understanding of what promising is and why it matters. The decades of argument have revealed the complexity; progress now requires embracing and structuring that complexity rather than seeking a simplistic, universal answer that satisfies all intuitions equally.
