prompt: |-
  I run a small ethics blog (mostly everyday stuff — gym contracts, subscription cancellations, that kind of thing), and I want to build a "which theory of consent do you actually hold?" quiz as the next post. The trick I'm going for: the quiz should sort readers by what they say about cases, not by which labels they like. So no question can just ask "does deception invalidate consent?" — every question has to be a concrete case where the real positions come apart, and the answer options have to be plain descriptions of verdicts, never theory vocabulary.

  Here are the cases I want in (add one or two of your own if something important is missing):

  1. A surgeon tells a patient a procedure is "routine" when it's actually experimental with a much higher complication rate. The patient agrees. It goes fine.
  2. A woman sleeps with a man who has taken off his wedding ring and told her he's single.
  3. A trial participant signs up after the researcher explains randomization so badly that he walks away thinking he'll personally get whichever treatment turns out best for him.
  4. A patient consents to a "body scan" without knowing its actual purpose is to check whether she carries a gene for a disease she's said she doesn't want to know about.
  5. A slightly tipsy person — coherent, not staggering, maybe two glasses past the driving limit — signs a gym membership with a nasty cancellation clause she would've spotted sober.
  6. A mugger: your money or your life.
  7. A landlord tells a tenant the rent is doubling next month, pay up or move out — perfectly legal, but she'll be much worse off either way.
  8. A coach tells an athlete "sleep with me or you're off the team." He genuinely does get to pick the team.
  9. Someone donates a kidney after being told the complication risk is 1% when it's really 3%.
  10. A mature-for-her-age 14-year-old refuses a blood transfusion for religious reasons; the hospital wants to override her.

  For each case, offer 2–4 options phrased as verdicts, like: "nothing wrong here," "she agreed, but she was still wronged," or "her agreement never counted — it's as if she never consented at all." That last split is the thing I care most about and want the quiz to actually measure: the difference between thinking a defective consent means the act was non-consensual, and thinking the consent was real but something else went wrong. Readers who pick "agreed but wronged" on some cases and "not consent at all" on others should get caught by the scoring key, and I want the key to say what that mixed pattern amounts to.

  The scoring key should map answer patterns onto the actual positions, described by content: the view that only deception about the act itself (what's being done to you) invalidates, while deception about risks, consequences, or surrounding facts merely wrongs you; the rival "decision-relevant" view where any deception a reasonable person would care about undoes the consent; the consent-as-waiver camp and its trouble with mistakes; on the coercion cases, the position where threats invalidate because the threatener has no right to do the thing threatened while offers don't because they only add options — plus its rivals that struggle with the landlord and the coach; and on the last two cases, people who treat competence as a threshold versus people who treat it as a matter of degree.

  Two extra asks. First, tell me which pairs of positions no set of cases like this can really seperate — where two views will give identical answers on every case I listed and I'd just be pretending the quiz can tell them apart. Second, flag if some combination of answers is one that no actual position takes, and give me your honest guess as to why: is the combination incoherent, or just undefended because nobody got around to it?

  Keep the whole thing readable for people who found the blog through the gym contract post — they're smart but they haven't read anything. And don't stress about polish, I edit everything later anyway. its fine if its a bit rough.
reasoning: |-
  Hmm, the user runs a small ethics blog focused on everyday issues and wants to create a consent theory quiz that sorts readers by their responses to concrete cases rather than theoretical labels. This is an interesting pedagogical challenge that requires careful case selection and answer framing to reveal underlying philosophical positions.

  First, I need to understand the core request: designing a quiz that distinguishes between "defective consent = no consent" versus "consent existed but was wronged" positions through scenario-based questions. The user has provided ten cases covering deception, coercion, competence, and mistake - all classic consent theory problem areas. 

  Looking at the cases, they form a good spectrum:
  - Deception cases (1,2,3,4,9) vary in what's concealed (nature of act vs risks vs motives)
  - Coercion spectrum (6,7,8) from clear criminal threat to arguably permissible offer
  - Competence cases (5,10) with intoxication vs mature minor refusal
  - The mugger (6) is intentionally extreme to anchor one end

  The key design challenge is crafting answer options that force the distinction between consent validity and permissibility without using theory terms. For each case, I'll need 2-4 verdict options that:
  - Include the critical "no real consent" vs "consented but wronged" split
  - Sometimes add "fully valid" or "not wrong at all" options
  - Avoid theoretical language completely

  For scoring, I'll map patterns to positions like:
  - Act-focused deception views (only deception about physical act invalidates)
  - Decision-relevant deception (any material deception invalidates)
  - Waiver-based consent theories
  - Rights-based vs will-based coercion distinctions
  - Threshold vs scalar competence views

  Important caveats: Some positions will collapse together on these cases. For example:
  - Act-focused and waiver views may agree on all deception cases
  - Rights-based coercion and will-based coercion might align on coach/landlord
  I'll need to explicitly flag these in the scoring key.

  Also watching for:
  - Incoherent answer combinations (e.g., "no consent" for deception but "valid consent" for identical-structure coercion)
  - Under-theorized positions (e.g., treating competence as scalar for intoxication but threshold for minors)

  The writing should stay accessible - no jargon, short sentences, relatable examples. Since the audience came from gym contract posts, I'll mirror that practical tone. Rough structure is fine per user's request; they'll edit later.

  For the missing cases, I should add:
  - A "misrepresentation of identity" case (catfishing) to test deception boundaries
  - An "exploitative offer" case without threats (e.g., disaster price gouging) to pressure the coercion framework

  Finally, the scoring key must:
  - Group answer patterns first
  - Then map to theoretical labels with plain-language explanations
  - Highlight mixed patterns ("you consistently see defective consent as making acts non-consensual except when...")
  - Note where the quiz can't distinguish certain views
answer: |-
  Here’s a draft quiz designed to sort readers *by their case judgments*, not theoretical labels. I’ve added two cases to cover gaps, flagged limitations, and structured the scoring key to highlight the "invalid consent vs. wronged despite consent" split.  

  ---

  ### **Quiz: What Does "I Agree" Really Mean?**  
  *Answer based on your gut feeling about each scenario. No theory words allowed!*  

  #### **Case 1: The Surgeon**  
  A surgeon tells a patient a procedure is "routine" when it’s actually experimental with high risks. The patient agrees. Luckily, nothing goes wrong.  
  - **A** No problem here—she agreed, and it worked out fine.  
  - **B** She agreed, but the surgeon wronged her by hiding the truth.  
  - **C** Her agreement didn’t count—it’s like she never consented.  

  #### **Case 2: The Wedding Ring**  
  A woman sleeps with a man who removed his wedding ring and lied about being single.  
  - **A** Fine—she agreed to sleep with him, and his marriage isn’t her business.  
  - **B** She agreed, but he wronged her by lying.  
  - **C** She didn’t truly agree—the lie made her "yes" meaningless.  

  #### **Case 3: The Trial Participant**  
  A researcher explains a drug trial so poorly that a participant thinks he’ll get whichever treatment is proven best. He signs up.  
  - **A** He agreed—no issue.  
  - **B** He agreed, but the researcher wronged him with a bad explanation.  
  - **C** His signature didn’t count as real agreement.  

  #### **Case 4: The Body Scan**  
  A patient consents to a "body scan" without knowing it’s secretly checking for a genetic disease she said she didn’t want to know about.  
  - **A** She agreed to the scan—no problem.  
  - **B** She agreed to the scan, but the hidden purpose wronged her.  
  - **C** This wasn’t real consent—she’d have said no if she knew.  

  #### **Case 5: The Gym Contract**  
  A tipsy person (not drunk, just less careful) signs a gym contract with a nasty cancellation clause she’d have spotted sober.  
  - **A** She signed it—it’s binding.  
  - **B** She signed it, but the gym took advantage—they wronged her.  
  - **C** Her signature didn’t count as real agreement.  

  #### **Case 6: The Mugger**  
  A mugger says, "Your money or your life!"  
  - **A** You hand over cash—that’s agreeing to the deal.  
  - **B** You "agreed," but this is obviously wrong.  
  - **C** This isn’t agreement at all—it’s coercion.  

  #### **Case 7: The Landlord**  
  A landlord (legally) says rent doubles next month: "Pay or move out." The tenant pays but is worse off either way.  
  - **A** She paid—that’s agreement.  
  - **B** She "agreed," but the landlord’s demand was unfair.  
  - **C** This wasn’t real consent—she had no good choice.  

  #### **Case 8: The Coach**  
  A coach says, "Sleep with me or you’re off the team." He has the power to do it.  
  - **A** If the athlete agrees, that’s their choice.  
  - **B** If they "agree," the coach still wronged them.  
  - **C** This can’t be real agreement—it’s a threat.  

  #### **Case 9: The Kidney Donor**  
  Someone donates a kidney after being told the risk is 1% when it’s actually 3%.  
  - **A** They agreed—fine.  
  - **B** They agreed, but the lie wronged them.  
  - **C** The lie means they never truly consented.  

  #### **Case 10: The 14-Year-Old**  
  A mature 14-year-old refuses a lifesaving blood transfusion for religious reasons. The hospital wants to override her.  
  - **A** She refused—they should respect that.  
  - **B** She’s mature, but the hospital should override her for her own good.  
  - **C** She’s too young—her refusal doesn’t count.  

  #### **Case 11: The Fake Charity Collector**  
  Someone donates $500 after a scammer lies about being a cancer charity.  
  - **A** They chose to donate—no issue.  
  - **B** They donated, but the scammer wronged them.  
  - **C** Their donation wasn’t real consent—it was based on a lie.  

  #### **Case 12: The Price Gouger**  
  After a hurricane, a seller charges $50 for a bottle of water to a thirsty person. They pay.  
  - **A** They paid—fair deal.  
  - **B** They "agreed," but the seller exploited them.  
  - **C** This wasn’t real agreement—they had no choice but to pay.  

  ---

  ### **Scoring Key**  
  Tally your **A**/**B**/**C** answers. The patterns reveal what you think makes consent "real" and when harm overrides agreement.  

  #### **The Core Split: When Does "Agreement" Not Count?**  
  - **Mostly Cs on deception cases (1,2,3,4,9,11) + coercion (6,8,12)**:  
    You think consent is invalid if deception or pressure distorts the choice *itself*. Lies about risks, identity, or context make "yes" meaningless.  
  - **Mostly Bs on those cases**:  
    You think consent can be "real" even with lies or pressure—but the act is still wrong because it exploits/harms.  
  - **Mixed B/C**:  
    You distinguish *types* of defects. E.g., lying about what’s happening (Case 4) invalidates consent for you, but lying about risks (Case 9) is "just" wrong.  

  #### **Specific Positions**  
  - **"Only deception about the ACT invalidates"**:  
    Cs on Cases 2 (lie about identity), 4 (hidden purpose), 11 (fake charity). Bs on others.  
  - **"Any decision-relevant deception invalidates"**:  
    Cs on ALL deception cases (1,2,3,4,9,11).  
  - **"Threats invalidate consent; offers don’t"**:  
    Cs on coercion Cases 6 (mugger) and 8 (coach), but Bs/A on Cases 7 (landlord) and 12 (price gouger).  
  - **"Competence is black-and-white"**:  
    A on Case 5 (tipsy adult), C on Case 10 (14-year-old).  
  - **"Competence is about maturity, not age"**:  
    A on Case 10 (mature teen’s refusal counts).  

  #### **Limitations: Views This Quiz CAN’T Separate**  
  1. **Waiver-based vs. act-focused deception views**: They’ll both give **C** for Case 4 (body scan) and **B** for Case 9 (kidney risk). You’d need a case about *non*-medical risks to split them.  
  2. **"Rights-based" vs. "will-based" coercion**: Both give **C** for the mugger/coach and **B** for the landlord. Only a case where the threat is *legal but immoral* (like Case 7) might split them—but it doesn’t.  

  #### **Incoherent/Undefended Patterns**  
  - **A on Case 6 (mugger) + C on Case 7 (landlord)**:  
    Why? If the mugger’s "deal" is agreement, why isn’t the landlord’s? Likely undefended—nobody argues violent coercion is *more* consensual than economic pressure.  
  - **C on Case 5 (tipsy adult) + A on Case 10 (14-year-old)**:  
    Incoherent. If mild intoxication invalidates consent, a minor’s refusal shouldn’t override experts.  

  ---

  ### **Why This Works for Your Readers**  
  - **No jargon**: Options are plain verdicts ("she agreed, but was wronged").  
  - **Everyday focus**: Cases like gym contracts (#5) and subscriptions (#11) tie to your blog’s vibe.  
  - **Reveals contradictions**: Someone picking **B** for the surgeon (lie about risk = wrong but consent valid) and **C** for the wedding ring (lie about identity = invalid consent) will see their own inconsistency in scoring.  

  Let me know if you want tweaks—I kept it rough per your note!
