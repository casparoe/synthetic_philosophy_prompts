prompt: |-
  Everyone tells me the sunk cost fallacy is the clearest fallacy in the book, but when I go through my gut reactions case by case, they don't line up the way one clean rule would require, and I'd like help working out the principle behind them, if there is one.

  Walking out of a movie I paid for and am hating: obviously fine, since the money is gone either way. Uninstalling a video game forty hours in that stopped being fun months ago: also fine — I feel silly about the forty hours, but not guilty. A friend six years into a PhD who no longer wants to be an academic: I keep telling him he should finish, since he's come this far — and I can see this is exactly the reasoning I reject everywhere else, yet I can't shake the feeling that it's right. A government continuing a war so that soldiers already killed won't have died in vain: clearly wrong, and worse than wrong. Staying in a three-year relationship only because leaving would mean the three years were wasted: a real mistake, not just an error of arithmetic. My mother refusing to sell our family's failing restaurant because of the ten years she put into it: I think she should sell, but I admire her for not wanting to, in a way I don't admire anyone for the war reasoning. And the case I can't fit with the movie one: abandoning a 700-page novel at page 500 because I'm not enjoying it. I've done this exactly once, and it felt like quitting in a way that walking out of the movie didn't, though both are just past, unrefundable costs with no further payoff from staying.

  Is there a principle that saves all of these verdicts, or close? If not, which should I give up, and what simpler principle do I get in exchange? I'd also like to know what the principle implies for a case I haven't decided: a climber halfway up a mountain, tired and behind schedule, whose group leader keeps insisting they've come too far to turn back.
reasoning: |-
  Okay, the user is really grappling with the sunk cost fallacy and how it applies differently across various scenarios. They've listed several examples where the standard rule—ignore past costs when making decisions—doesn't seem to fit their gut feelings. For instance, leaving a movie feels fine, but abandoning a novel at page 500 feels like quitting. They also mention their friend's PhD, a failing restaurant, and a war. The user wants a principle that explains all these cases or guidance on which intuitions to adjust.

  First, I need to break down each case. The sunk cost fallacy is clear in theory: only future costs and benefits matter. But the user's examples show emotional or psychological factors that complicate this. Let's start with the movie versus the novel. Both are sunk costs, but the novel involves more time investment and narrative immersion. Maybe the key is psychological commitment or identity investment. The user feels guilty about the novel because they've invested identity as a reader who finishes books.

  Next, the PhD case. The user advises their friend to finish despite the sunk cost. Why? The degree has future value, like signaling perseverance, which benefits non-academic careers. Here, the credential itself holds value beyond the sunk cost. The restaurant example is similar; the mother's identity is tied to the business, so selling feels like losing part of herself. The user admires this, unlike the war case, which has no redeeming future benefit. 

  The war example is pure sunk cost fallacy—continuing causes more harm with no upside. The relationship staying due to time invested is clearly a mistake because future unhappiness outweighs the past. The climber scenario is tricky. Turning back might be safer, but the leader's insistence could stem from perceived future costs (e.g., regret) or actual risks like descending in the dark. 

  The underlying principles might be: future utility (including psychological factors), identity investment, signaling value, and irreversible costs. For the novel, abandoning feels like failure because it challenges the user's self-concept. For the PhD, the degree has signaling value. The restaurant represents the mother's identity. The war has no such factors—only more death. 

  The user might need to differentiate between rational future benefits and emotional sunk costs. They should adjust their view on the novel; it's okay to quit if it's not enjoyable. For the PhD, the credential's value justifies finishing. The climber should prioritize safety over sunk costs. The key is evaluating future utility, including psychological aspects, without letting past investments dictate decisions.
answer: |-
  Your intuitions are remarkably consistent—they reveal a deeper principle that **distinguishes between "pure sunk costs" and "sunk costs with identity-defining commitment or future utility spillovers."** Here's how your cases fit:

  ### Core Principle:  
  **Abandon an endeavor *unless* one of these is true:**  
  1. **Future Utility Spillover:** The act of completion itself creates *independent future value* (e.g., credentials, closure, skills).  
  2. **Identity Preservation:** Quitting would damage a core part of your self-concept or values.  
  3. **Reversible Costs:** Stopping *creates new costs* (e.g., danger, financial penalties).  

  ### Your Cases Analyzed:
  1. **💿 Movie/🎮 Video Game**  
     - *Verdict:* Leave guilt-free.  
     - *Why:* Pure sunk costs. No future utility, identity stake, or new costs from quitting.  

  2. **📚 700-Page Novel (p. 500)**  
     - *Verdict:* Feels like quitting because of **identity commitment**.  
     - *Why:* Finishing books is tied to your self-image as a "completer." Abandoning it conflicts with your narrative identity ("I finish what I start"), unlike the passive act of walking out of a movie.  

  3. **🎓 PhD Friend (6 years in)**  
     - *Verdict:* Finish *if* the degree has **future utility spillover**.  
     - *Why:* The PhD credential signals perseverance, rigor, and expertise—valuable even outside academia. Quitting wastes *future opportunities*, not just past effort.  

  4. **💔 3-Year Relationship**  
     - *Verdict:* Leave.  
     - *Why:* Staying purely for sunk costs ignores future misery. No identity/utility upside—just fear of wasted time.  

  5. **🍽️ Family Restaurant (10 years)**  
     - *Verdict:* Sell *unless* it’s an **identity anchor**.  
     - *Why:* You admire your mother’s commitment because the restaurant embodies her values (legacy, resilience). This *is* the sunk cost fallacy—but it’s emotionally legible as identity preservation.  

  6. **⚔️ Continuing a War**  
     - *Verdict:* Clearly wrong.  
     - *Why:* No future utility (only more death). Identity argument ("honor the fallen") is morally bankrupt when it perpetuates harm. Pure fallacy.  

  7. **🧗 Climber Halfway Up**  
     - *Verdict:* **Turn back** *unless descent is riskier than ascent*.  
     - *Why:* "Too far to quit" is dangerous fallacy. Only *future safety* matters. If descending in darkness is deadlier, continue; otherwise, retreat. The "sunk cost" of effort is irrelevant.  

  ### What to Give Up:
  - **The novel guilt:** If finishing drains joy with no payoff, quit. Your "completer" identity should bend to self-care.  
  - **The restaurant admiration:** While understandable, it *is* the fallacy—your mom is sacrificing her future for the past. Gently advocate for her freedom.  

  ### Simpler Guiding Rule:  
  > **"Will continuing *create* meaningful future value—practical, emotional, or existential—that quitting destroys? If not, walk away."**  

  This reframes sunk costs as a question of *forward-looking meaning*, not past investment. It preserves your nuanced intuitions while avoiding the fallacy’s trap. For your PhD friend: ask *what the degree unlocks*. For the climber: calculate *survival odds*, not effort. And for yourself with books: if finishing feels like duty, not discovery, close it.
