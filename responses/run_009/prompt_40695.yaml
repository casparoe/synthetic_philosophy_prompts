prompt: |-
  My closest friend and I spent most of last night arguing about Shakespeare's Julius Caesar, and we ended exactly where we started. She holds that it is a play about individuals: Caesar's ambition, Brutus's scrupulous vanity, Antony's cold cunning — remove any one of them, she says, and the assassination never happens. I hold that it is a play about a republic whose institutions had already rotted through, so that the assassination merely made the decay visible; the conspirators stab a corpse, in the political sense. She also accused me of projecting modern anxieties about democratic backsliding onto an Elizabethan drama written for an audience that had just lived through a succession panic. I would like a serious reading of the play through the lens of the fall of the Roman Republic and its modern analogies: does the play dramatize institutional decay — the erosion of informal norms like mutual toleration and forbearance, elite polarization, the acceptance of political violence as a tool — and where does that structural reading strain? Be faithful in both directions: where the play resists it, say so plainly (Brutus's choices are presented as real choices; the plebeians are moved by a particular speech, not by abstractions; Caesar is dead by the middle of the play yet somehow dominates it). Consider a third possibility neither of us defended: that the play shows a republic dying less of elite ambition than of public indifference — a citizenry that will cheer whatever the last speaker said. Work only from scenes and plot points any reader knows — the Lupercal and the refused crown, the assassination, the funeral oration, the mob's killing of Cinna the poet, the quarrel between Brutus and Cassius, Philippi — and do not rely on or request quotations. End by saying what the play adds to the debate over whether democracies die by coup or by slow decay that argument alone cannot supply. After the reading, append a structured summary as a JSON object with the following fields: "thesis" (one sentence stating your overall verdict); "key_scenes" (an array of objects, each with "scene" and "why_it_matters" for the verdict); "strongest_analogy" and "weakest_analogy" (each pairing a plot element with a dynamic from modern debates about democratic backsliding, with an honest note on where the analogy breaks down — remember the play is about an aristocratic republic with no mass electorate); "where_the_play_resists" (the single biggest pressure point on your own reading); and "mind_changer" (the alternative reading or single consideration that would most plausibly overturn your verdict, and the step in your reasoning most likely to fail).
