prompt: |-
  I'm TA-ing intro ethics and next week I get one section meeting (50 min) to cover the situationist critique of virtue ethics before the students read their Harman excerpt. Don't explain the debate to me — plan how I should run it. Specifically: what has to be established first before the critique even registers as a problem (I suspect they need a grip on global character traits vs. mere behavioral tendencies, but you tell me), which experiment should carry the whole session and why (Milgram? the Good Samaritan study with seminary students rushing to give a talk? the dime-in-the-phonebooth one? some combo?), and where in the sequence each predictable misconception gets headed off — I'm guessing the big ones are "this proves people have no character at all" and "the experiments are old and were probably rigged so virtue ethics wins by default", plus maybe them treating it as just a debate about whether psychologists are nice people. Also tell me what I should openly punt on at this level (reliabilism about virtue? the "fragmentation of character" move?) and give me one closing question that would let me tell apart a student who got the actual worry from one who just learned that psychologists did weird studies in the 70s.
reasoning: |-
  Okay, the user is a TA preparing a 50-minute session on the situationist critique of virtue ethics for an intro ethics class. They want a focused lesson plan rather than an explanation of the debate itself. Let me unpack their needs.

  First, the core pedagogical challenge: students need to understand why situationism threatens virtue ethics before even reading Harman. The user suspects establishing global traits vs. behavioral tendencies is key—I agree. That's the essential groundwork. 

  For experiments, the Good Samaritan study stands out because: 1) it's less ethically fraught than Milgram, 2) the "hurry" variable cleanly demonstrates situational power over helping behavior, and 3) seminary students are ironic subjects for virtue discussions. I'll pair it with the dime/phone booth study to show cross-context consistency. 

  Predictable misconceptions to preempt:
  - "No one has character at all" → Emphasize this critiques global traits, not all traits
  - "Old studies = invalid" → Note replications (e.g., 2001 Dutch Good Samaritan)
  - "Psychologists aren't nice" → Redirect to theoretical implications

  Where to punt? Definitely fragmentation of character and reliabilism. Too advanced for intro. 

  Closing question idea: "If virtue ethics says character causes behavior, what does finding identical helping rates between seminary students and undergrads imply about trait attribution?" This tests if they grasp the explanatory challenge. 

  Timing breakdown: 
  - 15 mins establishing global traits (Aristotle + relatable examples) 
  - 20 mins Good Samaritan study + dime study comparison 
  - 10 mins connecting to critique + misconception busting 
  - 5 mins wrap-up with closing question 

  The user's clearly experienced—they anticipate student pitfalls and know where complexity should wait. I'll keep the plan tight and practical.
answer: |-
  Here's a battle-tested lesson plan for your 50-minute session, optimized for engagement while preempting misconceptions:

  **Core Goal:** Make students grasp *why* situationist experiments pose a *specific challenge* to Aristotelian virtue ethics' concept of **global, stable character traits** — *before* they read Harman.

  ### Phase 1: Groundwork - What Virtue Ethics Actually Claims (15 mins)
  *   **Start with Aristotle:** "What does Aristotle think a *virtuous person* is like? How does courage/justice manifest?" Elicit: *Consistent dispositions* across situations, *reliable* behavior, traits as *explanations* for actions.
  *   **Crucial Distinction Drill (The Key!):**
      *   **Global Character Trait:** "A *brave person*." (Emphasize: Stable, cross-situational, *explains* why they act bravely in *diverse* scenarios - battle, protest, admitting mistakes).
      *   **Behavioral Tendency/Specific Trait:** "Someone who *is brave in battle* but *lies to avoid conflict at work*." Or "Someone who *usually returns found wallets*." (Situationally specific, not explanatory of behavior outside its narrow context).
  *   **Why it Matters:** Ask: "If virtue ethics relies on *global* traits like 'courage' or 'compassion' to explain/predict behavior across many situations, what would *undermine* it?" (Answer: Evidence that behavior is mostly explained by situations, not global traits).

  ### Phase 2: The Hammer - Carrying the Session with **The Good Samaritan Study** (Darley & Batson, 1973) (20 mins)
  *   **Why This Study?**
      *   **High Relevance:** Subjects are *seminary students* (people explicitly training to be "good/virtuous" - perfect for ethics!).
      *   **Clear, Powerful Manipulation:** *Hurry* is a simple, understandable situational variable.
      *   **Devastating Irony:** Rushing to give a talk *about the Good Samaritan* makes them fail to *be* the Good Samaritan.
      *   **Quantifiable & Stark:** 10% helped in high-hurry vs 63% in low-hurry. The "virtue" of compassion seemed swamped by situation.
  *   **Present It Clearly:**
      1.  Setup: Seminary students prepping a talk (some on Good Samaritan, some not). Told to go to another building. Manipulated: "You're late, hurry!" vs. "You have a few minutes."
      2.  Encounter: A slumped, coughing "victim" in an alley.
      3.  Results: Overwhelming impact of *hurry* on helping. Topic of talk had *no significant effect*.
  *   **Immediate Discussion Q:** "What does this suggest about *why* the students helped or didn't help? Was it primarily about *who they were* (seminary students, some talking about virtue) or *the situation they were in* (rushing)?"

  ### Phase 3: Reinforcement & Nuance - The Dime Study (Isen & Levin, 1972) (5 mins)
  *   **Why Add This?** Quick, clean, shows *trivial* situational factors matter (finding a dime) impacting *significant* moral behavior (helping pick up papers). Reinforces the *power of situations* over seemingly minor variations.
  *   **Present Briefly:** Found a dime in phone booth? 85% helped. Didn't find one? 4% helped. "Does finding a dime make you a 'helpful person'? Or did it just *create a momentary situation* that made helping more likely?"

  ### Phase 4: Connecting to the Critique & Debunking Misconceptions (10 mins)
  *   **The Situationist Claim (State Clearly):** "These studies suggest behavior is often *much more* influenced by seemingly minor situational factors than by stable, global character traits. This challenges virtue ethics' reliance on such traits to explain and predict moral behavior."
  *   **Preempting Misconceptions:**
      *   **"No Character At All?":** "DOES THIS MEAN CHARACTER IS DEAD? NO! It challenges *global, highly consistent* traits as the *primary* drivers of behavior. People *do* have tendencies, habits, and local traits ('honest with friends'). But the situationist says these are more fragmented and situation-dependent than virtue ethics assumes. *Punt on fragmentation details* for now."
      *   **"Old/Rigged Studies?":** "ARE THESE JUST OLD/FAKE? Milgram replication issues are fair, but Good Samaritan's core finding (hurry crushing helping) is robust. Modern replications (e.g., Dutch 2001) show similar effects. Psychologists *aren't* mostly evil (punt on that red herring!), they study *human behavior*. The worry is the *implication* for how we explain behavior."
      *   **"Virtue Ethics Wins?":** "DOES THIS DESTROY VIRTUE ETHICS? Not necessarily! Virtue ethicists have replies (which Harman will touch on, and you'll discuss later): Maybe *true* virtue is rare? Maybe situations *reveal* character flaws? Maybe we need better *situational awareness* as part of virtue? But the critique *must be answered*; it doesn't just vanish."
  *   **What We're Punting On (Be Explicit):**
      *   The "Fragmentation of Character" debate (Doris/Harman vs. responses).
      *   Reliabilism about virtue (what *makes* a trait a virtue).
      *   Detailed defenses of virtue ethics *against* the critique (that's for later!).
      *   Whether *all* traits are situation-dependent to the same degree.

  ### Phase 5: Assessment & Wrap-up (5 mins)
  *   **Closing Question (The Discriminator):**
      > **"Imagine two people: Person A helps the victim in the Good Samaritan study (low-hurry condition). Person B does not (high-hurry condition). According to the situationist critique, why might it be *misleading* to conclude that Person A has a 'more compassionate character' than Person B?"**
      *   **Student Who Gets It:** Will focus on the *situational explanation* (hurry caused the difference, not an underlying global trait). They might say: "Because the situation (hurry) explains their behavior better than a trait difference," or "Swapping their situations might swap their behaviors, showing it's not a stable trait difference."
      *   **Student Who Misses the Point:** Will talk about the study being unethical, people having bad days, psychologists being mean, or just generally "people are inconsistent," *without* linking it to the challenge of attributing *global character traits* as explanations.
  *   **End with the Stakes:** "So, as you read Harman, focus on THIS core challenge: If situations are this powerful, can we really rely on the idea of stable, global virtues to explain why people act morally or immorally? That's the problem Harman is pressing."

  **Why This Flow Works:**
  1.  **Builds Necessary Foundation First:** Without grasping *global traits* as virtue ethics understands them, the critique is noise.
  2.  **Uses the Most Pedagogically Effective Study:** Good Samaritan is relatable, ironic, and devastatingly clear. The dime study is a quick, potent chaser.
  3.  **Proactively Addresses Landmines:** Predictable misconceptions are named and defused *before* they derail discussion.
  4.  **Clear Scope & Punting:** Students know what's *not* on the table, reducing confusion.
  5.  **Assessment Built-In:** The closing question directly tests comprehension of the *philosophical worry*, not just the study facts.

  **Materials:** Have simple slides/diagrams for the distinction (Global Trait vs. Specific Tendency) and the Good Samaritan study setup/results. Keep text minimal. Focus on discussion. Good luck!
