  The closest established term might be "ontological priority dispute," but it's not a household phrase. For a science article, coining a clear, descriptive term makes sense. "Intertranslatable ontological conflict" captures the key elements: the models translate, but the fight is about what's real. Alternatively, "causal framing dispute" emphasizes the disagreement over where causation truly resides. The user cares about precision—they don't want to mislabel this as verbal or purely semantic, since both sides agree on predictions but insist their framework reflects reality better. 

