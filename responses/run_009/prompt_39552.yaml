answer: |-
  Yes, there is an established name for this: **Ontological Priority Dispute**. If you need a more evocative or descriptive coined term, use **Intertranslatable Ontological Conflict (IOC)** or **Causal Framing Dispute**.

  Here's the breakdown and reasoning:

  1.  **Established Name: Ontological Priority Dispute**
      *   **Why it fits:** This term directly captures the core issue: disagreement about *what fundamentally exists* or *what entity/level possesses the primary causal power* in the process of natural selection, even when the competing *descriptions* (formalisms, models) are agreed to be intertranslatable and empirically equivalent. The fight is over which level (gene, individual, group) selection *actually acts upon* in nature, not just which description is mathematically convenient.
      *   **Distinguishing Features:**
          *   **Intertranslatability:** Explicit agreement that the formalisms are mutually translatable (unlike many underdetermined theories).
          *   **Empirical Equivalence:** Agreement that predictions match data (this is a consequence of intertranslatability).
          *   **Ontological Stakes:** The dispute centers on *what is causally fundamental* – "Where does the *real work* of selection happen?" The disagreement is about the structure of reality, not just language or prediction.
          *   **Not Merely Verbal:** Both sides agree on the concrete predictions and the data. The disagreement is substantive: it concerns *causation* and *explanation* – which level provides the most direct, fundamental, or "real" causal account of the evolutionary process. It's about *what the world is like*, not just how to describe it.
          *   **Physics Analogy:** Exactly like debates over interpretations of quantum mechanics (Copenhagen vs. Many-Worlds vs. Bohmian), or Lagrangian vs. Hamiltonian mechanics. The math works, the predictions match, but physicists argue fiercely over what the math *says about reality*.

  2.  **Coined Term: Intertranslatable Ontological Conflict (IOC)**
      *   **Definition:** A scientific dispute characterized by:
          1.  **Explicit Intertranslatability:** Competing frameworks/models are agreed by proponents to be formally interconvertible.
          2.  **Empirical Equivalence:** The competing frameworks yield identical predictions about observable phenomena.
          3.  **Ontological Disagreement:** The core disagreement persists over which framework captures the fundamental causal structure or primary ontological level at which the process operates in nature.
      *   **Why it's useful:** It bundles the key features (intertranslatability, equivalence, ontology) into a single, descriptive label. It clearly signals this *specific configuration*.
      *   **When it applies:** Use IOC when *all three* criteria above are met. It applies to the units-of-selection debate, interpretations of equivalent physical formalisms (QM, mechanics), and potentially other foundational debates (e.g., certain arguments in cognitive science over computationalism vs. embodied cognition).
      *   **When it doesn't apply:**
          *   **Merely Verbal Disputes:** Where disagreement stems *only* from ambiguous language, with no underlying ontological or causal disagreement once terms are clarified.
          *   **Empirically Distinct Theories:** Where competing models make different testable predictions (e.g., Newtonian vs. Einsteinian gravity pre-confirmation).
          *   **Underdetermination without Intertranslatability:** Cases where theories are empirically equivalent but not formally translatable (a rarer, more philosophical scenario).
          *   **Pure Pragmatic Disputes:** Arguments solely about which model is computationally easier or more convenient for a specific task, without claims about fundamental causality.

  3.  **Causal Framing Dispute (Alternative Coinage)**
      *   **Definition:** A dispute where competing, intertranslatable frameworks agree on predictions but disagree on which framework correctly identifies the locus of primary causal agency or the level at which selective forces *directly* operate.
      *   **Emphasis:** Highlights the "causal work" aspect your interviewees mentioned. It frames the fight as being about *where causality is anchored*.

  **Bottom Line for Your Article:**
  You are observing **Ontological Priority Disputes** or, more descriptively, **Intertranslatable Ontological Conflicts (IOCs)**. These occur when scientists agree their competing models are mathematically interconvertible and predict the same outcomes, but fiercely disagree about which model reflects the *fundamental causal reality* of the process (e.g., whether selection *really acts on* genes, individuals, or groups). This distinguishes them from merely verbal disagreements (where clarification resolves things) and from debates between empirically distinct theories. The stakes involve explanatory fundamentality, heuristic potential for new discoveries, and the perceived "causal structure" of the biological world. Physicists have analogous conflicts over interpretations of quantum mechanics.
