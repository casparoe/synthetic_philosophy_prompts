prompt: |-
  I'm a science journalist and I keep running into the same weird situation in the units-of-selection wars, and I want to write about it but I don't have the vocabulary for it. So the setup: I've now interviewed people on both sides of the whole "does selection act on genes, individual organisms, or groups" fight, and more than once I've watched two biologists agree — actually agree, out loud — that their rival frameworks can be translated into each other, that for any model one side builds the other side can build a model with the same predictions, just doing the accounting at a different level. And then they keep fighting! Not about the math. About which level selection "really" operates at, which one is the actual causal process and which is just a bookkeeping convenience. One guy told me the gene's-eye view is a re-description of his group-level model, and his critic said the exact mirror image back to him — you're just re-describing what I already captured, at a level nobody needs.

  Is there an established name for this kind of dispute — where the formalisms are agreed to be intertranslatable and everyone knows it, and the fight is over which representation tracks the real structure of the world? I've heard people dismiss arguments as "merely verbal," but that doesn't seem to fit, because these folks agree on all the sentences about data and predictions and still think something substantive is at stake — maybe about where the causal work gets done, or about which framework generates the next good model. So: does this configuration have a name (in philosophy of science or elsewhere — I'd guess physicists had this fight over different formulations of mechanics at some point?), how is it different from a merely verbal dispute and from plain empirical equivalence, and if there's no established term, coin me one I can actually use in an article, with a definition that makes clear when it applies and when it doesn't. The label matters less than getting the edges right — I don't want to file this under the wrong concept in print.

  Lead with the bottom line in your first sentence — whether there's an established name or not — then give the reasoning. No preamble, no restating my question back at me.
