answer: |-
  ### 1. Exam Question (300 words, 20 marks)  
  **Question 4: Moore’s Paradox and the Structure of Assertion (20 marks)**  
  Consider the following assertions:  

  > *(1)* "It’s raining, but I don’t believe it" — *Absurd when asserted*, though consistent: e.g., rain occurs while the speaker sleeps.  
  > *(2)* "It’s raining, but John doesn’t believe it" — *Assertible*; common in gossip.  
  > *(3)* "It was raining yesterday, but I didn’t believe it" — *Assertible*; natural when admitting error.  
  > *(4)* "It’s raining, but no one believes it" — *Strange when asserted*, even if true (e.g., rain starts in an empty valley).  
  > *(5)* **Diary Case**: A person writes "It’s raining, but I don’t believe it" in a *private diary* (never read aloud or shared).  

  **Task**: Propose an account of the **relation between assertion and belief** that predicts *exactly* this pattern: defective in (1), acceptable in (2)/(3), defective in (4), and explain the status of (5).  
  - **(a)** State whether the defect in (1) is **semantic** (e.g., a hidden contradiction) or **pragmatic** (e.g., norm violation).  
  - **(b)** Your account *must* explain *all five cases*. Address:  
    - Why (2) and (3) differ from (1),  
    - Why (4) is defective but *not* speaker-relative like (1),  
    - Whether (5) is absurd and what this implies about the paradox’s roots (language vs. self-knowledge).  
  *(~400 words; credit hinges on data coverage)*  

  ---

  ### 2. Model Answer (620 words)  
  The defect in (1) is **pragmatic**, arising from a constitutive norm of assertion. I argue that to assert *p* is to *present oneself as believing p*. Crucially, this is not merely about expressing belief but *guaranteeing* that one possesses that belief. Call this the **Belief-Possession Norm (BPN)**: *Assert only what you believe*.  

  **(1)** violates BPN. By asserting "It’s raining," I present myself as believing it rains. Yet the second conjunct ("I don’t believe it") asserts I lack that belief. Thus, I simultaneously present myself as having and lacking the same belief—a performative contradiction. This is *pragmatic*: the sentence is consistent (as sleep cases show), but asserting it violates a rule governing the act.  

  **(2)** avoids defect because BPN applies only to the *speaker’s* belief. Asserting "John doesn’t believe it" imposes no requirement that *I* believe it rains; I can coherently present myself as believing rain occurs while denying John’s belief.  

  **(3)** is assertible because BPN binds only to *current* belief. When I say, "I *didn’t* believe it," I describe a *past* state. My current assertion entails I *now* believe yesterday rained (else I couldn’t assert it), which is consistent with past disbelief. The norm constrains the present act, not historical beliefs.  

  **(4)** is defective but *not* speaker-relative. By asserting "It’s raining," I present *myself* as believing it rains (per BPN). But "no one believes it" includes me—so I assert that I both believe and do not believe it. Worse, *any* hearer who accepts my assertion must believe it rains, thereby falsifying "no one believes it." Unlike (1), this defect traps *all* participants: the speaker contradicts themselves, and hearers who assent create a falsehood.  

  **(5)** (diary case) reveals the paradox’s core is about *self-knowledge*, not public language. Writing in a private diary is still an *assertive act*: I commit to the content as true. BPN applies because I present *myself* as believing the conjunction. Yet if I believe "It’s raining," I cannot believe "I don’t believe it’s raining" (since believing the latter requires awareness of my disbelief). Thus, (5) remains absurd—not because others hear it, but because I cannot rationally hold the belief I assert. This shows Moore’s paradox stems from the *impossibility of coherently believing Moorean sentences*, exposing a conflict in self-knowledge.  

  **Conclusion**: The pattern follows from BPN—a pragmatic norm—which interacts with tense (3), agent-relativity (2), and universal quantifiers (4). (5) confirms the issue transcends communication: it arises from the *epistemic irrationality* of asserting what one cannot believe.  

  ---

  ### 3. Marking Scheme (450 words)  
  **Total: 20 marks**, allocated across five criteria:  

  1. **Commitment to semantic/pragmatic account + BPN** (4 marks)  
     - *A-grade*: Explicitly rejects semantic contradiction (notes consistency in (1)), adopts pragmatic norm (e.g., BPN).  
     - *B-miss*: Vaguely cites "assertion expresses belief" without specifying a *norm* or confusing pragmatics with semantics.  

  2. **Explanation of (2)/(3) vs. (1)** (5 marks)  
     - *A-grade*: For (2), notes BPN applies only to speaker’s *own* belief; for (3), explains tense shift neutralizes self-contradiction by decoupling *current* assertion from *past* belief.  
     - *B-miss*: Correctly identifies (2)/(3) as acceptable but fails to contrast with (1) (e.g., omits why "John" or past tense resolves the paradox).  

  3. **Analysis of (4): Defect + speaker-relativity contrast** (5 marks)  
     - *A-grade*: Shows (4) forces speaker to self-contradict (via "no one" including self) *and* creates a universal trap for believers. Contrasts with (1): defect in (4) stems from content falsifying *any* acceptance, not just speaker’s commitment.  
     - *B-miss*: Labels (4) "defective" but treats it identically to (1), missing how "no one" universalizes the contradiction beyond the speaker.  

  4. **Treatment of (5): Absurdity + implications** (4 marks)  
     - *A-grade*: Argues (5) is absurd due to *self-directed* BPN violation; concludes paradox reveals self-knowledge failure (cannot *believe* the sentence).  
     - *B-miss*: Claims (5) is fine (because private) without addressing self-commitment, or asserts absurdity without linking to self-knowledge.  

  5. **Coherence & data coverage** (2 marks)  
     - *A-grade*: Weaves all cases into a unified account; no unexplained outliers.  
     - *B-miss*: Isolated explanations; e.g., discusses (1)-(4) but neglects (5)’s implications.  

  **Penalize (-1 to -3 per instance)**:  
  - **Handwaving "pragmatic contradiction"** without defining the norm (e.g., "It’s inappropriate because it’s contradictory" — *but why?*).  
  - **Overgeneralizing** (e.g., "All Moorean sentences are unassertible" — but (2)/(3) are fine).  
  - **Ignoring tense in (3)** or **equating (1)/(4)** without addressing speaker-relativity.  
  - **Reducing (5) to "no audience, no problem"** without considering self-commitment.  

  **A-grade threshold (17+)** requires:  
  - Clear BPN definition + pragmatic framing.  
  - Tense asymmetry in (3) explained.  
  - (1) vs. (4) speaker-relativity contrast articulated.  
  - (5) used to pivot toward self-knowledge.  
  *(B-grade: ~12–16; C-grade: omits ≥2 criteria)*
