  Hmm, Williamson's bath example is crucial here - it's designed to attack luminosity by showing gradual changes create borderline cases where you can't precisely identify when your feeling changes from cold to not-cold. But this same setup seems to challenge KK too, since if you don't know exactly when you stop feeling cold, your knowledge about feeling cold becomes questionable. 

  The key differences I should highlight are: luminosity is about being in a position to know (potential knowledge) while KK is about actual higher-order knowledge. Also, luminosity is local (specific conditions/times) while KK is universal. 

  For the logical relationship, I think Williamson's argument does undermine KK when applied to self-knowledge propositions. If we take p = "I feel cold now", the margin-of-error problem means there are times when you think you know p but actually don't - so you can't possibly know that you know p. 

  Interesting possibilities emerge though. Could someone accept luminosity but reject KK? Only in very limited cases - maybe for infallible beliefs where the first-order knowledge is guaranteed but higher-order reflection fails. Conversely, rejecting luminosity while keeping KK might work if we adopt a safety theory that treats self-knowledge differently from environmental knowledge. 

