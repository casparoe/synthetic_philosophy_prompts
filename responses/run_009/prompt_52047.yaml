  | 2    | Elias   | Landauer's principle assumes 2nd law → circular. | **Partly right**   | Early thermodynamic derivations of Landauer *did* presuppose the 2nd law, creating superficial circularity. However, modern statistical derivations (e.g., phase-volume) avoid this, making his charge overstated. |
  | 3    | Dana    | Erasure cost is mechanical (phase-volume), not thermodynamic. | **Mostly right** | Phase-volume conservation under Hamiltonian dynamics is indeed mechanics, not thermodynamics. But "exported as heated surroundings" implicitly assumes surroundings *are* a heat bath—a coarse-graining choice. |
  | 4    | Elias   | Phase-volume ignores coarse-graining; demon needn’t erase with infinite memory. | **Mostly right** | Correct that fine-grained entropy alone can't forbid sorting; coarse-graining defines irreversibility. Unbounded memory *could* defer erasure, but ignores physical realism (e.g., finite universe/resources). |

