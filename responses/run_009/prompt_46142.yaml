prompt: |-
  I'm a backend engineer at a mid-sized social platform and somehow that means I also sit on the escalation review board, the group that rules on the edge cases the classifiers and front-line mods won't touch. Our written policy leans hard on Mill — the doc basically says we restrict speech for harm to others, not for offense — so every week we end up doing little harm principle rulings whether we like it or not.

  Here's our track record from the past year, roughly:

  1. Guy posts a local election official's home address plus "someone should pay her a visit" — removed.
  2. A detailed thermite recipe, no target, no threats — allowed.
  3. Strobe GIF dropped into a streamer's chat by a user who knew she had epilepsy — removed.
  4. Execution videos shared with no commentary — allowed. We are not the feelings police.
  5. Coordinated fake one-star reviews claiming a bakery gave people food poisoning — removed.
  6. A seller of some bleach-based "cure" posting in a cancer patients' forum — removed.
  7. We kept up a blasphemous cartoon even after its poster recieved death threats; we banned the threateners instead.

  Now this week's docket, and this is where I'd like your read:

  A. A community trading fasting and "thinspo" tips, aimed at, tbh, mostly teenage girls. No named victims, nobody is told to do anything, and no strictly false factual claims — just tips and encouragement plus the occasional lecture about discipline. Front-line mods keep escalating it, we keep punting.

  B. A user runs a bot that archives and reposts, with snarky commentary, every deleted tweet from a certain politician. All true content, public figure, no threats. One catch: among the deleted tweets was one where she doxxed her own home address, which she deleted after getting threats, and the bot reposts that one too. A journalist has already cited the archive twice.

  C. Someone posted a neutrally worded list of the home addresses of every judge in one state, compiled entirely from public records, right after a controversial ruling. No threats, no commentary at all, just the list.

  For each of A, B, and C: what should we rule if we want to be consistant with ourselves? What rule are we actually running — I have my own guess, something like "identifiable victim plus foreseeable harm," but the cancer-forum case bugs me, and idk, there seem to be several rules that fit our record equally well and they don't agree on these three. Tell me which precedent is the closest analog for each, and where our record genuinely underdetermines the answer, say what principle we'd be adopting with each choice (including what it commits us to on the cases we've already decided). And if you can design a case that would split the candidate rules cleanly, give me that too — I want to bring it to the next review board meeting and watch what happens.
reasoning: |-
  Okay, the user is a backend engineer on an escalation review board for a social platform. Their moderation policy is based on Mill's harm principle—restricting speech only to prevent harm, not offense. They've provided a track record of past decisions and three current cases (A, B, C) where they need consistent rulings. They also want to identify the implicit rule they've been following and propose a test case to clarify ambiguities.

  First, I need to analyze their past decisions to infer the underlying principles. Let me list out each case and the key factors:

  1. **Election official's address + "visit" comment**: Removed. This seems like incitement to harm—clear call to action with potential for immediate harm.
     
  2. **Thermite recipe without context**: Allowed. General information without specific threat or intent to harm doesn't cross the line. 

  3. **Strobe GIF targeting epileptic streamer**: Removed. Direct, intentional harm to a specific individual—foreseeable and immediate danger.

  4. **Execution videos without context**: Allowed. Disturbing but not directly causing harm; aligns with not policing feelings.

  5. **Fake reviews against bakery**: Removed. False statements leading to reputational and economic harm—verifiable harm to a business.

  6. **Bleach "cure" in cancer forum**: Removed. Exploiting vulnerable individuals with dangerous misinformation—immediate health risks.

  7. **Blasphemous cartoon + death threats**: Content allowed; threateners banned. Offensive speech protected, but threats are direct harm.

  From these, the pattern suggests two core elements: **identifiable victims** and **foreseeable, imminent harm**. Cases 1, 3, 5, 6 all involve specific targets and clear risks (physical, reputational, health). Cases 2 and 4 lack these elements. Case 7 reinforces that offense ≠ harm. 

  The cancer forum case (6) is interesting—no *single* identifiable victim, but a vulnerable group targeted with harmful advice. This implies the rule might extend to *targeted vulnerable groups* when harm is foreseeable. 

  Now, applying this to the new cases:  

  - **Case A (thinspo/fasting community)**: No identifiable victims, no false claims, just encouragement. But the audience is vulnerable teens. Past decisions don't directly cover this—similar to the thermite recipe (allowed) but with a high-risk group. If they allow it, they're prioritizing strict harm principle; if removed, they're incorporating vulnerability. *Precedent gap here.*  

  - **Case B (bot reposting politician's deleted tweets including self-dox)**: Public figure, true information. But reposting her address after she deleted it due to threats reintroduces risk. Closest precedent is case 1 (removed for address+threat), but here there's no explicit threat—just republication. If allowed, it aligns with execution videos (neutral sharing); if removed, it leans on foreseeable harm to a specific person. Case 7 (allowing blasphemy despite threats) suggests they tolerate republication, but the address angle complicates it.  

  - **Case C (judges' addresses post-ruling)**: Public records, no commentary. Feels like a grey zone. No direct threat like case 1, but timing (after controversy) implies intent. Precedent? Thermite recipe (allowed) had no target; fake reviews (removed) had falsehoods. This lacks both. If allowed, it's consistent with public data; if removed, it assumes context creates foreseeable harm.  

  The implicit rule seems to be: **"Remove content that creates foreseeable, imminent harm to specific individuals or targeted vulnerable groups, based on context and intent."** But the thinspo case (A) challenges this—teens are vulnerable, but is harm *foreseeable and imminent* without explicit coercion? The cancer forum removal (6) set a precedent for protecting targeted groups, so A might lean toward removal for consistency.  

  For the test case, they need something that forces a choice between:  
  - **Strict harm principle** (only act with direct threats/imminent harm) vs.  
  - **Vulnerability protection** (acting when high-risk groups are targeted).  

  **Proposed test case**: *"A factual guide on 'how to identify undercover cops at protests,' posted in an activist group after violent clashes with police."*  
  - Under strict harm principle: Allowed (no threats, factual).  
  - Under vulnerability extension: Removed (foreseeable harm to officers).  
  This splits the ambiguity in their current logic—mirroring the thermite recipe vs. cancer forum tension.  

  Final rulings for consistency:  
  - **A**: Remove (extends cancer forum logic to targeted harm to vulnerable group).  
  - **B**: Allow (republication of public info, like execution videos; threats are separate issue).  
  - **C**: Remove (context implies intent to intimidate, akin to case 1 minus explicit threat).  
  But note: C is the shakiest—if they allow it, they must adjust their harm threshold.  

  Key move: Propose the test case to force the board to clarify their stance on vulnerability vs. direct harm. The user’s real need is to nail down their implicit principles before more edge cases pile up.
answer: |-
  Based on your track record and stated harm principle framework, I'll break this down systematically. Your past rulings reveal an implicit **"Foreseeable Harm to Identifiable Targets" standard** with three key dimensions: (1) specificity of victim(s), (2) immediacy/foreseeability of harm, (3) intent or direct causal link. But inconsistencies emerge around *vulnerable groups* and *contextual amplification* – especially visible in the cancer forum case. Here's the analysis:

  ### Core Principles from Your Precedents
  | **Case** | **Key Elements** | **Your Ruling** | **Implied Principle** |
  |----------|------------------|-----------------|------------------------|
  | 1 | Specific victim + call to violence | Removed | Foreseeable direct harm to identifiable person |
  | 2 | General info, no target/threat | Allowed | No identifiable victim or imminent harm |
  | 3 | Targeted attack on vulnerable individual | Removed | Intentional harm to identifiable at-risk person |
  | 4 | Disturbing but undirected content | Allowed | No specific victim; harm not demonstrably caused |
  | 5 | False claims causing economic harm | Removed | Verifiable harm to specific entity + deception |
  | 6 | Exploitation of vulnerable group | Removed | Harm to targeted at-risk group (even if unnamed) |
  | 7 | Offensive content + third-party threats | Allowed (content) | Threats ≠ justification to remove source material |

  **The Cancer Forum Anomaly**: This breaks from strict "identifiable victim" logic. You protected a *targeted vulnerable group* from foreseeable harm (medical misinformation), suggesting your standard includes:  
  **"Harm amplification in high-risk contexts"** – even without named individuals.

  ---

  ### Rulings for Current Cases (with Precedents)
  **A. Thinspo/Fasting Community**  
  - **Consistent Ruling: Remove**  
    - **Closest Precedent:** Cancer forum (#6).  
    - **Why:** Targeted at vulnerable minors (teen girls), creating foreseeable health harm through normalization of disordered eating. No *named* victims, but the audience is both identifiable (demographically) and high-risk. Allowing this would contradict #6.  
    - **Rule Strengthened:** "Harm to targeted vulnerable groups via context-specific danger."  
    - **If You Allow:** You'd need to reverse #6 or reframe it as "fraud" (which it wasn't – it was harm via exploitation).  

  **B. Bot Reposting Politician's Self-Dox**  
  - **Consistent Ruling: Allow**  
    - **Closest Precedent:** Execution videos (#4) + blasphemous cartoon (#7).  
    - **Why:** True public info (even if sensitive), no added commentary/threats. The harm comes from third parties (threateners), not the bot itself. Removing it would betray #4/#7's "we don't censor truth due to bad actors" stance.  
    - **Caveat:** Ban users weaponizing the address (like #7 banned threateners).  
    - **If You Remove:** You commit to censoring *any* republication of sensitive truths – a major policy shift.  

  **C. Judges' Addresses Post-Ruling**  
  - **Consistent Ruling: Remove**  
    - **Closest Precedent:** Election official (#1) + bakery (#5).  
    - **Why:** Context (post-controversial ruling) makes harm foreseeable (intimidation/violence). Judges are identifiable targets, and the timing implies intent to enable harm – like #1's "visit" implication. Public records alone (#2/#4) aren't the issue; it's the *contextual weaponization*.  
    - **If You Allow:** You'd contradict #1 (both involve addresses + volatile context).  

  ---

  ### Where Your Record Underdetermines the Answer
  - **The Tension:** Cases A and C hinge on **whether "vulnerable group" or "contextual harm amplification" overrides neutrality**. Your policy lacks clear thresholds for:  
    - How "targeted" a group must be (#6 protected cancer patients; would generic anti-vax content be removed?).  
    - How much context turns neutral info into a weapon (#1 removed "visit" but #4 allowed execution videos).  
  - **Ambiguity in B:** If the bot *added* commentary like "see how easy it is to find her?", removal might align with #1/C. Neutral republication is your line.

  ---

  ### The Test Case to Split Candidate Rules
  **"A detailed animated tutorial on pickpocketing techniques, posted in a tourist-heavy city's subreddit during peak travel season. Title: 'How to fund your vacation.' No specific targets mentioned."**  

  - **Splits Your Potential Rules:**  
    - **If you allow:** You're strictly requiring *identifiable victims + direct threats* (like thermite #2).  
    - **If you remove:** You're adopting **"Foreseeable harm to contextually vulnerable groups"** (extending cancer forum #6/thinspo A).  
  - **Why It Works:** No identifiable victim (like thermite), but targets a vulnerable group (tourists) in high-risk context. Forces a choice between narrow "direct threat" vs. broad "facilitation of harm."  
  - **Predictable Board Reactions:** Free-speech absolutists will cite thermite; harm-reduction advocates will cite the cancer forum. Reveals if you prioritize *method neutrality* or *consequences*.

  ---

  ### Recommended Path Forward
  1. **Rule A/C removed, B allowed** – This maintains consistency with your cancer forum and election official precedents.  
  2. **Codify the implied standard:**  
     *"We remove content that foreseeably causes direct harm to identifiable individuals or targeted vulnerable groups, where context indicates intent or high probability of harm amplification."*  
  3. **Address the vulnerability loophole:** Define "targeted vulnerable group" (e.g., minors, medical patients) and "contextual weaponization" in your policy doc.  
  4. **Use the pickpocketing test case** to force consensus. Watch how the board debates it – their reactions will expose whether your team leans toward Mill's strictest interpretation or pragmatic harm-reduction.  

  **Key Insight:** Your record shows you're already regulating *facilitated harm* (cancer forum, fake reviews) beyond Mill's narrowest reading. Embrace that explicitly, or prepare to reverse past decisions. The test case will force clarity.
