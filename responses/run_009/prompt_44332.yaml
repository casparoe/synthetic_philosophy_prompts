  ## Three Clocks at Port Royal

  Stanza I (Slow Time)  
  Salt-scarred timbers rot unseen,  
  a harbor's slow embrace reclaims the stone.  
  The quay subsides where galleons leaned,  
  their trade winds now a whispered tone.  
  Silk routes dissolve to dust and thorn,  
  while caravans forget the route they traced at dawn.  
  **The seabed cools.**

  Stanza II (Middle Time)  
  A century's slow seep: the fertile plain  
  accepts the river's silt, its patient gain.  
  Wheat's price, a pendulum unseen,  
  swings low for fifty years, then high, then mean.  
  An empire's border, thick and slow as tar,  
  oozes past the cairn that marked its far  
  **The seabed cools.**

  Stanza III (Fast Time)  
  Sudden trumpets! Richard falls,  
  Henry Tudor claims the throne, the Abbey rings.  
  Cannon smoke at Agincourt obscures the walls,  
  a treaty signed, a courier's horse that stings  
  the mud. A plague cart's hollow bell,  
  a jester's curse, a ransom paid. Crowns cracking like river ice  
  **The seabed cools.**

  Stanza IV (Slow Time)  
  Granite shoulders shrug beneath the snow,  
  unnoticed by the furrows plowed below.  
  Deep currents shift their heavy load,  
  miles down, indifferent to the storm's sharp goad.  
  The coral builds its citadel on bone,  
  ignoring flags flown from the deck, the groan  
  **The seabed cools.**

  Stanza V  
  The lighthouse beam cuts through the squall's fierce breath,  
  illuminating foam that churns towards death –  
  brief crests that shout and vanish on the swell,  
  leaving no mark the slow tide need dispel.  
  **The seabed cools.**  
  Is this our only measure, then, the crest, the crash, the spray?  
  What price the foam, born only to be swept away?

  ---

  **Notes on Execution:**

  *   **Constant Line:** "The seabed cools" embodies geological time – imperceptibly slow, unaffected by surface events, constant across millennia.
  *   **Pacing:**
      *   *Stanza II (Middle Time):* Focuses on silt accumulation, grain price fluctuation, and an empire's gradual expansion ("oozes").
      *   *Stanza III (Fast Time):* Packed with specific events (Richard III's fall, Henry Tudor, Agincourt cannon, plague cart, jester, ransom, Wars of Roses imagery). Short phrases, active verbs ("falls," "claims," "stings," "cracking"), and sensory noise convey speed and density.
  *   **Syntactic Spillover:** Stanza III ends: "Crowns cracking like river ice / **The seabed cools.**" The enjambment ("ice / The") creates a momentary link where the event seems to flow into the geological line, only for its unchanging nature to reassert itself instantly.
  *   **Final Twist:** The constant line stands alone, then the final two lines explicitly question the human experience within these temporal scales ("crest, the crash, the spray", "foam").
  *   **Implicit Braudel:** The structure *is* the argument: the relentless return of the geological line amidst changing surface content demonstrates the clocks. No terminology is used.
  *   **Imagery:** Draws on coastlines (harbor, quay, seabed, lighthouse, foam), deep water currents, geological features (granite, coral), and human events tied to trade and conflict.
