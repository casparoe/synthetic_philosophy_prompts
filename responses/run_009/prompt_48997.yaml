  ### Principle Statement
  The **Midpoint-Range Ambiguity Aversion (MRAA)** principle evaluates ambiguous prospects using the midpoint of the range of expected utilities under possible priors and adjusts for ambiguity aversion by subtracting (for gains) or adding (for losses) a fixed multiple β of the range. For a gain prospect paying \(X\) if an event occurs (0 otherwise) with probability in \([a, b]\), the value is \(V = X \left[ \frac{a+b}{2} - \beta (b - a) \right]\). For a loss prospect imposing loss \(L\) with probability in \([c, d]\), the value (as a cost) is \(V = L \left[ \frac{c+d}{2} + \beta (d - c) \right]\). The coefficient β > 0 quantifies ambiguity aversion. Choices maximize value for gains or minimize cost for losses.

