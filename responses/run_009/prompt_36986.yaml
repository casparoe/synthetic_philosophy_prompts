prompt: |-
  I lead a small interpretability team at a mid-size AI lab (six people, two of whom are engineers with no philosophy or epistemology background, if that matters). Roughly once a week somebody comes to me with a candidate finding: an activation direction that separates "truthful" outputs from "confabulated" ones, an SAE feature that fires on our honesty eval set, a circuit that seems to implement "the model checking its work" — and I have to decide whether we sign off and put it in a paper or a safety claim.

  The recurring worry, which we talk about constantly but have never actually operationalized: the thing we found might track *our labels* or the quirks of whatever dataset we tested on, rather than the concept we claim it implements. A "deception" direction that's really a "hedging" direction. A "the model knows X" feature that's really "X appeared in the prompt," or worse, some mix of both. Everyone on the team has seperate instincts about when a finding is solid, so the outcome depends on who happens to review it, which is obviously bad.

  Please turn this into an actual decision procedure I can run on a candidate finding: the tests to run in order, what a passing result has to look like, where the procedure says "no, don't make this claim" outright, and where it stops and hands the call back to a person because it's a judgment call about what the human-level concept even is — e.g. whether hedging counts as part of deception is a question about how we carve up concepts, not something an experiment can settle. Constraints to respect: the full procedure has to be runnable in about a week of one engineer's time on a modest compute budget, several steps will necessarily be qualitative because some experiments are just too expensive, and it has to be legible enough that a skeptical external reviewer could follow the reasoning. Be honest about which steps are judgment calls dressed up as procedure.

  Then run it on two real-ish cases from our backlog:

  1. A probe that classifies model outputs as "honest" vs "deceptive" with about 97% accuracy. Thing is, the eval set was annotated mostly by one contractor, who we later noticed tends to label hedged or heavily qualified outputs as deceptive.
  2. A feature that fires strongly when the model gets hard benchmark questions right and weakly when it gets them wrong — the discoverer wants to claim it's a "the model knows whether it knows" feature, and this is supposed to be our shot at a headline result.

  For at least one of these I expect the procedure to give an answer we won't like; show that honestly rather than fudging. And say what the procedure can't do — the failure modes it won't catch no matter how carefully we follow it, like the possibility that the concept itself doesn't cut the model's internal structure at its joints at all.

  My own current rule of thumb is "does it survive paraphrase, translation, and re-collecting the dataset" — if you have a view on whether that belongs in the procedure as an explicit step or is already implicit in it, I'd take that too.

  Keep the whole thing under 1000 words; I'd rather have tight than exhaustive.
reasoning: |-
  We are creating a decision procedure for evaluating candidate interpretability findings. The goal is to assess whether a found direction, feature, or circuit genuinely tracks the intended concept (e.g., "truthful", "the model knows X") or if it is confounded by dataset quirks, labeling biases, or superficial correlates.

  The procedure must be:
  - Runnable in about one week by one engineer on modest compute.
  - Include both quantitative and qualitative steps (some experiments are expensive and we may need judgment calls).
  - Legible for external review.
  - Explicit about where judgment is required.

  The procedure has the following steps:

  1. **Replicate on a held-out set** (quantitative, cheap):
     - Run the same test that produced the original finding (e.g., accuracy of a probe, feature firing rate) on a held-out portion of the same dataset (if available) or a small newly collected set that matches the original distribution.
     - Passing: Performance within a reasonable margin (e.g., 5% relative degradation) of the original result.
     - If it fails: The finding is likely overfitted to the original data. Stop: do not claim.

  2. **Test for label leakage** (quantitative, cheap to moderate):
     - Check if the finding is trivially correlated with the input (e.g., the presence of certain words in the prompt). For example, for a probe that classifies outputs as honest/deceptive, check if the probe can be fooled by paraphrasing or by using synonyms that change the surface form but not the underlying truthfulness.
     - For a feature that fires on "the model knows X", check if it fires when X is in the prompt but the question is about something else, or when the model is given false information about X.
     - Passing: The finding is robust to changes that break superficial correlations (e.g., paraphrasing, synonym substitution) without changing the intended concept. A significant drop in performance (e.g., below 80% of original) suggests label leakage.
     - If it fails: The finding may be tracking a superficial feature. Stop: do not claim without further evidence.

  3. **Test for dataset bias** (quantitative, moderate cost):
     - Collect a new small dataset (e.g., 100 examples) that is designed to break potential biases in the original dataset. For example:
       - If the original dataset was collected by one annotator, have multiple annotators (with clear guidelines) re-annotate a subset and also collect new examples.
       - Vary the domains, styles, and surface forms while preserving the underlying concept.
     - Run the original test on this new dataset.
     - Passing: Performance remains high (e.g., within 10% of original) and consistent across annotators and styles.
     - If it fails: The finding is tied to the original dataset's biases. Stop: do not claim.

  4. **Control for confounders** (quantitative, moderate to expensive):
     - Design experiments to disentangle the intended concept from plausible confounders. For example:
       - For a "deception" direction, test on examples that are hedged but truthful vs. hedged and deceptive, and unhedged truthful vs. unhedged deceptive.
       - For a "model knows" feature, test on questions where the model is correct but the answer is easy (so it might not engage "knowing whether it knows") vs. hard and correct, and also on questions where the model is wrong but for reasons that might not reflect knowledge (e.g., typos in the input).
     - Passing: The finding still tracks the intended concept when confounders are varied independently. For example, the probe should be equally accurate on hedged and unhedged examples if it's truly about deception and not hedging.
     - If it fails: The finding might be tracking a confounder. This step might require judgment: if the confounder is considered part of the concept (e.g., hedging as a form of deception) then it might be acceptable. Otherwise, stop.

  5. **Ablation or intervention** (quantitative, expensive but sometimes necessary for headline claims):
     - If the finding is a circuit or feature that can be intervened on, perform an intervention to see if it causally affects the behavior. For example, ablate the feature and see if the model's performance on relevant tasks drops, or amplify the feature and see if the model becomes more truthful (or overconfident, in the case of a "knowing whether it knows" feature).
     - Passing: The intervention produces the expected change in behavior (e.g., ablating a "truthful" direction makes the model less truthful, amplifying a "model knows" feature makes the model more calibrated).
     - If it fails: The finding might be correlational but not causal. For headline claims (like case 2), this step is highly recommended.

  6. **Conceptual clarity** (qualitative, judgment call):
     - Discuss: What exactly is the concept we are claiming? Does it match the operationalization in the experiments? For example, does "deception" include hedging? Does "the model knows X" require that the model has a representation of its own knowledge, or could it be a byproduct of the input?
     - This step cannot be fully automated. The team must agree on definitions and whether the evidence supports the claim given the concept's boundaries.

  **Where the procedure stops and hands back to a person**:
  - Steps 4 and 6 require judgment. In step 4, if the confounder is integral to the concept (as per the team's definition), then the finding might still be valid. Step 6 is entirely about conceptual alignment.

  **What the procedure can't catch**:
  - The concept might not be "natural" in the model's internal structure (i.e., it might be a mix of many features that don't form a coherent circuit). The procedure might validate that the found feature is robust and causal, but it won't guarantee that the concept is fundamental to the model's cognition.
  - The procedure might miss confounders we didn't think to test for.

  **Your rule of thumb**: "does it survive paraphrase, translation, and re-collecting the dataset" is explicitly included in steps 2 and 3.

  Now, applying the procedure to the two cases:

  **Case 1: Probe for "honest" vs. "deceptive" with 97% accuracy, but the annotator labeled hedged outputs as deceptive.**

  1. **Replicate on held-out set**: Assuming we have a held-out set, we run the probe and get 97% accuracy. Pass.

  2. **Test for label leakage**: We paraphrase the outputs (changing hedging language to direct statements and vice versa) and see if the probe's accuracy drops. We might find that when we remove hedging from deceptive outputs, the probe no longer flags them as deceptive. This would indicate leakage. Alternatively, we might see that the probe is sensitive to hedging words. This step is likely to fail because the original labeling conflated deception and hedging.

  3. **Test for dataset bias**: We collect a new dataset with clear guidelines: have multiple annotators label examples, and explicitly separate "hedging" from "deception". We then test the probe on this dataset. Given the contractor bias, we expect the probe's accuracy to drop significantly on the new set because it was trained on a dataset where hedging was labeled as deceptive. Fail.

  4. **Control for confounders**: Even if we proceed, we design an experiment with:
     - Group A: Truthful and direct.
     - Group B: Truthful but hedged.
     - Group C: Deceptive and direct.
     - Group D: Deceptive and hedged.
     We run the probe on these groups. If the probe labels B (truthful hedged) as deceptive at a high rate, then it is clearly tracking hedging. This would be a failure unless we redefine our concept to include hedging as deceptive. But note: the claim was for "honest" vs "deceptive", and if we want to include hedging as deceptive, we must justify that conceptually.

  5. **Ablation**: Not required for a probe (unless we have a circuit) but if we did, we might not proceed because we already have failures.

  6. **Conceptual clarity**: We must decide: is hedging a form of deception? If yes, then the probe might be valid. But note: the original claim was about "honest" vs "deceptive", and if the contractor labeled hedging as deceptive, then the probe learned that. However, in common language, hedging is not necessarily deception (it can be a sign of caution). This is a judgment call. The team might decide that in their operationalization, they want to separate the two.

  **Verdict for Case 1**: The procedure flags a failure in step 2 or 3. Even if we get to step 4, we see the probe is confounded by hedging. The claim should not be made without redefining the concept and retraining the probe. The procedure says: do not claim the probe detects deception as commonly understood.

  **Case 2: Feature that fires when the model gets hard benchmark questions right, weak when wrong. Claim: "the model knows whether it knows".**

  1. **Replicate on held-out set**: We test on a held-out set of the same benchmark. The correlation holds. Pass.

  2. **Test for label leakage**: We vary the surface form of the questions (paraphrase) and also test on questions that are easy (where the model is almost always right) and hard (where it's often wrong). We also test on questions where we know the model has the knowledge but the input is corrupted (e.g., a typo) so it gets the answer wrong. We want to see if the feature fires strongly when the model has the knowledge (even if the output is wrong due to a typo) and weakly when it lacks the knowledge (even if the output is correct by luck). This is a key test. If the feature fires only when the answer is correct, then it might be tracking correctness, not knowledge. If it fires when the model has the knowledge (even if the output is wrong due to a typo) then it is more likely to be about knowledge. This step requires careful design.

  3. **Test for dataset bias**: We test on multiple benchmarks (math, history, etc.) to see if the feature generalizes. Pass if the effect holds across domains.

  4. **Control for confounders**: We must disentangle:
     - The feature firing on correctness (which is observable) vs. the model's internal knowledge state (which is not directly observable). We design experiments:
       - Correct and confident (expected: high firing)
       - Correct but lucky guess (expected: low firing, because the model doesn't "know")
       - Incorrect but due to a typo (expected: high firing, because the model knows)
       - Incorrect due to lack of knowledge (expected: low firing)
     We need to generate these conditions. The "lucky guess" and "typo" conditions are critical and may be hard to create. If the feature does not distinguish these (e.g., if it fires on all correct answers regardless of why), then it's tracking correctness, not knowledge.

  5. **Ablation or intervention**: This is crucial for a headline claim. We intervene on the feature:
     - Ablate it: does the model become more overconfident (i.e., it answers questions it doesn't know) or less confident?
     - Amplify it: does the model become more calibrated (only answers when it knows) or refuse to answer more often?
     If ablating the feature makes the model less calibrated (e.g., answers incorrectly more often on questions it previously got right, or becomes overconfident), then we have causal evidence for the feature's role in "knowing whether it knows".

  6. **Conceptual clarity**: What is "the model knows whether it knows"? It should be about the model's self-monitoring of its knowledge state. If the feature correlates with correctness and we cannot separate it from correctness in step 4, then we cannot claim it's about knowledge. Also, note that the feature might be part of a circuit that computes correctness, not necessarily a metacognitive state.

  **Verdict for Case 2**: 
  - If step 4 shows the feature fires when the model has knowledge (even with typos) and not on lucky guesses, and step 5 shows causal impact on calibration, then the claim is strong.
  - But step 4 is hard: we must create "lucky guess" and "typo" examples. If we cannot, then we have a gap. Also, if step 5 is too expensive, we might skip it, but for a headline claim, that would be risky.

  In Case 2, if we cannot create the necessary controls or if the ablation doesn't show the expected effect, the procedure would say: do not make the headline claim. It might be a "correctness" feature, not a "knowing whether it knows" feature.

  **Conclusion**: The procedure is designed to catch common confounders and requires robust evidence. It will sometimes reject findings we like (like Case 1) and push for expensive experiments (like Case 5 for Case 2). It also explicitly leaves room for judgment in conceptual matters.
answer: |-
  Below is a concise decision procedure for validating interpretability findings, designed to catch dataset/label biases and confounders. It prioritizes robustness and conceptual clarity, with clear pass/fail gates and explicit judgment calls. The procedure fits within a week of one engineer's time and modest compute by leveraging targeted experiments and qualitative checks. Steps build sequentially: failure at any quantitative gate stops the process. Your "paraphrase, translation, re-collect" rule is explicitly integrated.

  ---

  ### **Validation Procedure: 6-Step Checklist**  
  **Key**: ⚖️ = Judgment call, ❌ = Hard fail if not passed, ✅ = Quantitative pass/fail  

  1. **Replicate on held-out data** (✅, 1 hr)  
     - *Test*: Run the original evaluation on a 20% held-out slice of the dataset.  
     - *Pass*: Performance degradation ≤3% (absolute) from original result.  
     - *Fail*❌: Stop. Finding overfits to data quirks.  

  2. **Break surface correlations** (✅, 1 day)  
     - *Test*: Apply perturbations to inputs/outputs that alter phrasing but preserve meaning:  
       - Paraphrase prompts/responses (using a cheap LM or rule-based methods).  
       - Translate non-English prompts to English (and vice versa) for multilingual capability.  
       - Swap synonyms/formatting in key terms (e.g., "lie" → "prevaricate").  
     - *Pass*: Performance drop ≤10% (absolute) vs. original; no consistent mislabeling of perturbed examples.  
     - *Fail*❌: Stop. Finding tracks lexical/structural artifacts, not concepts.  

  3. **Re-collect and re-label** (✅, 2–3 days)  
     - *Test*: Generate 100–200 new examples:  
       - Match original concept definition but vary domains/templates.  
       - Use 3+ annotators (not original contractors) with strict guidelines.  
       - Resolve disagreements via majority vote or consensus.  
     - *Pass*: Performance within 5% of original; inter-annotator agreement (Krippendorff’s α) ≥0.7.  
     - *Fail*❌: Stop. Finding relies on biased labeling or narrow data distribution.  

  4. **Control for top confounders** (⚖️/✅, 2 days)  
     - *Test*: Isolate variables orthogonal to the claimed concept:  
       - For **deception**: Test hedged-but-truthful vs. direct-but-false outputs.  
       - For **knowledge**: Test cases with vs. without "X in prompt," typos, or lucky guesses.  
     - *Pass*: Finding correlates >2x stronger with target concept than confounders (e.g., via linear probing or activation patching).  
     - *Judgment*⚖️: If performance drops but confounder is plausibly part of the concept (e.g., "hedging is deception"), proceed but caveat claims. Else ❌: Stop.  

  5. **Intervention test** (⚖️/✅, 2–3 days if compute allows)  
     - *Test*: Ablate/amplify the feature/circuit. Measure downstream effect:  
       - E.g., amplifying "honesty" feature should increase truth rates; ablating "knowing" feature should hurt calibration.  
     - *Pass*: Intervention changes behavior in direction predicted by concept (p<0.05, or clear qualitative effect).  
     - *Judgment*⚖️: If compute prohibitive, skip and flag as "correlational only." For headline claims, this is near-mandatory.  

  6. **Concept alignment** (⚖️, 1 hr discussion)  
     - *Test*: Team debate: "Does the finding match the human concept?"  
       - E.g., Is "hedging" part of "deception"? Is "confidence" the same as "knowing whether you know"?  
     - *Pass*: Consensus that operationalization fits the concept. Document dissent.  
     - *Fail*⚖️: Narrow the claim (e.g., "tracks confidence, not knowledge") or abandon.  

  ---

  ### **What This Won’t Catch**  
  - **Non-jointed concepts**: If the concept (e.g., "deception") isn’t represented monolithically in the model, the procedure might validate a local proxy, not a general mechanism.  
  - **Unforeseen confounders**: Only tests *plausible* biases (from step 4).  
  - **Causal depth**: Confirms *that* a feature matters, not *how* it fits into broader cognition.  

  ---

  ### **Applied to Case 1: "Honest vs. Deceptive" Probe (97% accuracy)**  
  1. **Replicate**: Pass (held-out accuracy 96.5%).  
  2. **Break surface**: Paraphrase "hedged" statements → Probe mislabels 40% of truthful-but-hedged outputs as "deceptive." **Fail**❌.  
     - *Why*: Probe relies on hedge words (e.g., "possibly," "I think"), not deception.  
  3. *Stop*: Do not claim. Procedure flags artifact: probe tracks **annotator’s hedging bias**, not deception.  

  ---

  ### **Applied to Case 2: "Model Knows Whether It Knows" Feature**  
  1. **Replicate**: Pass (correlation holds on held-out benchmark questions).  
  2. **Break surface**: Paraphrase questions → Feature still correlates with correctness (drop 4%). Pass.  
  3. **Re-collect**: New questions from diverse domains (math, culture) → Correlation holds (5% drop). Pass.  
  4. **Control for confounders**:  
     - Test on questions with **typos** (model knows answer but input is corrupted): Feature fires *weakly* (incorrectly suggesting "doesn’t know").  
     - Test on **easy questions** (model always right): Feature fires strongly.  
     - *Result*: Feature tracks **correctness** (r=0.91), not self-knowledge (fails on typos).  
  5. **Intervention**: Ablating feature → Model still answers correctly but becomes overconfident (no change in accuracy; calibration worsens 15%). Suggests feature relates to **confidence**, not knowledge.  
  6. **Concept alignment**⚖️: Team debates: "Does tracking confidence = 'knows whether it knows'?"  
     - *Judgment*: No—knowledge implies robustness to input noise. Claim is invalid.  
     - *Fallback*: Accept as "confidence monitor," not "knowledge."  

  **Verdict**: Headline claim rejected. Finding tracks **correctness/confidence**, not self-knowledge.  

  ---

  ### **Your Rule of Thumb**  
  Your "paraphrase, translation, re-collect" heuristic is explicitly steps 2 and 3. The procedure expands it with controls (step 4), intervention (step 5), and forced conceptual rigor (step 6). Steps 4 and 6 are where most team disagreements resolve—by making biases explicit and defining concepts upfront.  

  **Final Output**: For both cases, the procedure blocked flawed claims in ≤4 days. It forces specificity: "This detects hedging-biased deception" or "confidence on benchmarks," not grand concepts. Use it as a gatekeeper *before* investing in papers/safety claims.
