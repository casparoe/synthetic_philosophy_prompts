prompt: |-
  Retired geophysicist here — spent about thirty years in paleoclimate work, ice cores and the like, and since retiring I've been binging popular and semi-popular history, especially the kind where my old subject matter shows up. Tambora and the year without a summer, the Little Ice Age and the witch trials, plague and the end of feudalism, germs doing the heavy lifting in the conquest of the Americas. And I keep noticing something about the prose that I don't have a word for. When the humans are on stage the verbs are ordinary: people decided, sold grain, raised taxes, fled. But the moment my old freinds enter the story, the grammar shifts. The eruption "reshapes" the century, the climate "pushes" Europe into turmoil, the bacterium "writes" the history. Sometimes a whole chapter gets structured so the volcano is effectively a character with an entrance and a role, and the humans get demoted to reacting to it, like weather in someone else's story.

  Two more observations before I ask my actual question. First, when an interviewer pushes these writers on it, they almost always retreat to something like "obviously that's shorthand, no one thinks a volcano has intentions" — but then their actual explanations keep leaning on the nonhuman cause as a member of the cast rather than a part of the mechanism, and the passages where humans deliberated end up doing less explanatory work than the passages where the climate "did something." So I genuinely can't tell whether the framing is doing real causal work in their accounts or is just decoration nobody is willing to either defend or drop. Second, the genre can also swing to the opposite failure, which I'd call over-correcting: the volcano is reduced to backdrop, all the agency goes back to kings and markets, and — having actually looked at eruption chronologies for a living — that seems equally distorted to me. The eruption really was a huge exogenous input. So these writers seem caught between crediting the volcano too much and too little, and the "it's just rhetoric" defense lets them never say which they're doing.

  So: is there an established name or literature for this move — treating a nonhuman cause as an actor or character in historical explanation rather than as a mechanism, in a way the author won't fully own but the explanations depend on anyway? I know "environmental determinism" as the standard accusation against this whole genre, but that label is about the content of the claim (climate fixes outcomes), not about the thing I'm pointing at, which is the attribution of something like agency and the odd rhetorical state around it. I also half-remember the term "actant" from skimming some sociology of science, but I can't tell whether it's the thing itself or just adjacent to it. If there's a real term, tell me what it is and how exactly it differs from plain determinism; if there isn't, coin one, and tell me where the edges are — e.g., is a flood that breaks a levee an actor while the levee isn't, or does the levee count too once you're on this road, and does a one-off eruption differ from a slowly shifting climate baseline that has no "event" at all? I don't want just a name, I want the carving. Please end your answer with "Verdict:" followed by the single best term (existing or your coinage) for the thing I described.
reasoning: |-
  Okay, let me start by really unpacking what this retired geophysicist is asking. They've spent thirty years in paleoclimate, so they know the science cold. Now they're reading popular history books and noticing a pattern: when non-human forces like volcanoes or climate change enter the narrative, the language shifts. These forces get described with active verbs—reshaping, pushing, writing history—as if they're characters with agency. But when humans are involved, the verbs are more passive. 

  Hmm, the user is pointing out a rhetorical inconsistency. The authors claim it's just shorthand, but their explanations seem to rely on this framing. The user is stuck between two extremes: either the non-human elements have too much agency (like characters) or too little (reduced to backdrop). They want a term for this specific rhetorical move where non-human causes are treated as actors, without fully admitting it. 

  First, I need to recall if there's existing terminology. "Environmental determinism" comes to mind, but the user already dismissed that as being about content, not the rhetorical style. Then there's "actant" from Actor-Network Theory (ANT). Latour uses it to include non-humans in networks of agency. That might fit because it allows volcanoes to be actors without intentionality. But is "actant" the right term here? The user mentioned skimming sociology of science, so they might have encountered ANT. 

  Wait, the user also wants to know if a flood breaking a levee counts as an actor, or if the levee does too. In ANT, both could be actants. A flood has force, but the levee's structural failure also plays a role. ANT would include both. But the user's concern is about how history writers frame these elements as characters with entrances and roles. So maybe "narrative agency" is part of it. 

  Another angle: the term "anthropomorphism" is too broad because it implies attributing human traits, which the authors deny. "Reification" might work—treating an abstract concept as concrete. But does that capture the narrative role? 

  Perhaps "causal personification" could be a coined term. It combines the idea of giving person-like qualities to non-human causes. But the user wants clarity on edges. For example, a one-off eruption vs. slow climate change. Both can be actants, but the eruption has a clear event structure, making it easier to frame as a character. Slow changes might not have a "moment," so writers might struggle to personify them. 

  Looking at the deeper need: the user is frustrated with the inconsistency in historical narratives. They want a term that captures this rhetorical sleight of hand where non-human forces are given narrative weight without accountability. They also want to distinguish it from determinism. So the term needs to address the storytelling aspect. 

  "Agential scaffolding" from new materialism? That emphasizes how matter has agency without intention. But it's more philosophical. The user might prefer something more accessible. 

  Considering all this, "narrative agencing" seems fitting. It highlights the construction of agency within the story. The edges: any non-human entity that the author frames as initiating action in the plot. The levee isn't an actor unless it's given active verbs ("the levee failed spectacularly"). The eruption is easier to personify than gradual climate shifts. 

  Verdict: Narrative Agencing
answer: |-
  What you're describing is a fascinating and pervasive rhetorical maneuver at the intersection of history, science communication, and narrative theory. It's not merely environmental determinism, nor is it simple anthropomorphism. Let's carve it at the joints:

  ### Core Concept & Terminology
  1. **The Move**: You've identified a form of **causal narrative personification**—where non-human entities (volcanoes, pathogens, climate shifts) are imbued with **narrative agency**. They become *protagonists* or *antagonists* in the historical plot, driving action through active verbs ("reshapes," "pushes," "writes"), while human actors are relegated to reactors. Crucially, this agency is *rhetorically disavowed* ("just shorthand") yet *structurally indispensable* to the explanatory framework. It’s a **performative contradiction**: denying intentionality while deploying the grammar of intent.

  2. **Best Existing Term**: **Actant** (from Actor-Network Theory, ANT, notably Bruno Latour).  
     - **Why it fits**: ANT explicitly grants non-humans (a volcano, a microbe, a levee) the status of **actants**—entities that "modify a state of affairs by making a difference" in a network of relations. They aren’t moral agents but *force-exerting participants* in shaping outcomes.  
     - **How it differs from determinism**: Determinism implies fixed causality (A → B). Actantial framing is *relational*: the volcano’s eruption becomes an actant only when interacting with human/ecological networks (crop failure → panic → policy changes). It’s about *distributed agency*, not top-down causation.  
     - **Limitation**: ANT treats actants symmetrically (a king and a virus can both be actants). Your critique highlights how *popular narratives* asymmetrically elevate non-human actants to *dramatic roles* while downplaying human deliberation—a **narrative bias** ANT itself avoids.

  3. **Your Coinage**: **Exogenous Agencing** (or **Narrative Agencing**).  
     - **Exogenous**: Emphasizes the external, disruptive input (eruption, pathogen).  
     - **Agencing**: From French *agencement* (arrangement/assemblage), implying the *assignment of agential function* within a story.  
     - **Edges Defined**:  
       - A flood breaking a levee is an **actant/exogenous agencer** if it’s framed as *actively driving plot change* ("the flood *overwhelmed* defenses").  
       - The levee is **not an agencer** if it’s passive ("the levee failed"). But if described as "*betraying* the city," it becomes one.  
       - A one-off eruption is an **event-actant**: discrete, dramatic, easily personified.  
       - Slow climate shifts are **process-actants**: harder to personify, often rendered as "background forces" (e.g., "the Little Ice Age *tightened its grip*"). No "event" needed, but narrative framing still implies agency.  

  ### Why This Isn’t Just "Determinism" or "Metaphor"
  - **Determinism** claims necessity (climate *dictates* outcomes). Your case is **contingent agencing**: the volcano *enables* certain paths (famine) but doesn’t *determine* the response (e.g., whether elites hoard grain or distribute it).  
  - **Rhetorical Disavowal**: Authors use agential language ("the bacterium rewrote history") while denying literal intent. This creates a **cop-out**: the non-human actant bears *explanatory weight* without accountability, sidelining human institutions that mediated its impact.  

  ### Literature & Key Thinkers
  1. **Actor-Network Theory (ANT)**:  
     - Latour (*Reassembling the Social*), Callon, Law. Non-humans as actants in "sociomaterial networks."  
  2. **New Materialism**:  
     - Jane Bennett (*Vibrant Matter*) on "thing-power": how non-human "actants" exert force.  
  3. **Narrative History Theory**:  
     - Hayden White (*Metahistory*) on **emplotment**—how historians cast entities as "heroes/villains."  
  4. **Environmental History Critique**:  
     - Dipesh Chakrabarty on climate as "anthropocenic agency" challenging human-centered history.  

  ### Verdict: Exogenous Agencing  
  *(With "actant" as the closest existing term, but your framing demands specificity to the *narrative asymmetry* and *rhetorical disavowal* you observed.)*  

  This agencing isn’t inherently wrong—Tambora *did* alter 1816’s possibilities—but its narrative inflation risks obscuring the *distributed responsibility* of human systems that amplified or mitigated its impact. You’ve pinpointed a sleight-of-hand that lets historians have their causal cake while disowning its ingredients.
