prompt: |-
  I help run the cause-selection workshop for a university effective-altruism student group, and we always use the importance–tractability–neglectedness framework: rate each candidate cause on how big the problem is, how solvable it is, and how little attention it's already getting, then combine the scores (multiplicatively, in the versions we use) to rank causes. Over several semesters of running this exercise I've noticed a recurring pattern that I don't have a word for, and it's starting to make me distrust the whole exercise. When we score a shared list of causes, the final ranking almost always comes out determined almost entirely by the neglectedness column: importance is effectively constant because everyone agrees the causes on the list are all "big" by the time they've made it onto the list, tractability gets quietly nudged to whatever value keeps the causes people already care about near the top, and neglectedness does all of the discriminating work. That's suspicious on its own, but there's a second layer: the three ratings are supposed to be independent of each other, and they plainly aren't. The fact that a cause is uncrowded is often itself a signal that capable people have looked at it and walked away — so the framework hands its highest scores to causes that have already been silently examined and rejected, while a cause can look "crowded" only because it is genuinely promising and has drawn attention precisely for that reason. The rubric treats the columns as separate measurements of separate facts about the world; a lot of the time they seem to be three readouts of one underlying fact, namely how much attention the cause has already survived.

  So my question is whether there's an established concept for this failure mode: a multi-criterion scoring scheme whose factors are advertised as independent but are actually correlated through the history of who has already worked on the options being scored, such that combining them either collapses into a single factor plus noise or actively rewards options that prior scrutiny has vetted negatively. The nearest things I know of are the efficient-markets idea (but that's about prices and returns, not rubrics, and it doesn't capture the collapse-into-one-column part) and Goodhart's law (but Goodhart is about a proxy being gamed or optimized against; here nobody is gaming anything — the problem is that the "independent" factors share a common upstream cause, even when everyone scores in perfect good faith). Is there a standard name for this in decision theory, psychometrics, economics, or elsewhere — something in the measurement-error or composite-indicator literature, perhaps? If nothing established fits cleanly, I'd like you to coin a term and give a definition precise enough to distinguish it from both of the two nearest neighbors I mentioned, say where its edges are (for instance, what should we say about a case where two of the three factors really are independent and only one pair is entangled, or where the correlation runs in the opposite direction — neglectedness as evidence of a blind spot everyone else genuinely missed?), and say what, if anything, a group like mine could do to patch the exercise without abandoning it. Please write your answer in American English.
reasoning: |-
  Okay, the user helps run a cause-selection workshop for a university EA group using the importance-tractability-neglectedness (ITN) framework. They've noticed a pattern over several semesters: the final rankings are almost entirely determined by neglectedness. Importance is seen as constant for all causes on their list, tractability gets adjusted to support pre-existing preferences, and neglectedness becomes the main differentiator. 

  The user points out two main issues. First, the three factors aren't independent as advertised. High neglectedness might actually indicate that experts have already examined and rejected the cause. Conversely, a "crowded" cause might be crowded precisely because it's promising. Second, the framework seems to collapse into measuring one underlying factor: how much attention the cause has already survived. 

  The user wants to know if there's a named concept for this failure mode where supposedly independent criteria are actually correlated through historical attention, leading to misleading rankings. They mention efficient markets and Goodhart's law as related but not quite fitting. They also want suggestions to fix the exercise without abandoning it.

  Hmm, I need to recall decision theory concepts. This seems like a case of criterion contamination due to historical selection effects. The factors aren't orthogonal; they're linked by prior scrutiny. When causes survive attention, they gain resources (lower neglectedness) but may have proven intractable. Meanwhile, neglected causes might be neglected for good reason. 

  The efficient-market hypothesis relates because it suggests all known information is already reflected in prices, similar to how prior attention might be baked into cause characteristics. But the user's case involves subjective scoring, not market prices. Goodhart's law is about metrics being gamed when used as targets, but here no one's gaming—the correlation is natural. 

  Psychometrics might have relevant concepts. The "jangle fallacy" is when two measures with different names actually capture the same thing. But here it's three measures contaminated by a fourth variable (historical attention). 

  I think the core issue is that neglectedness isn't an independent variable; it's an outcome of prior evaluations. The scoring system mistakes this outcome for a separate input. This creates a perverse incentive where causes that failed past scrutiny score highest. 

  For a term, "latent criterion entanglement" could work—emphasizing that hidden factors tangle the intended measures. Or "historical selection bias in composite metrics." But perhaps "attenuation paradox" since neglectedness attenuates the other scores' roles. 

  To fix it: The group could pre-calibrate importance scores to force variation, or use reference classes. For tractability, they might distinguish technical vs. political feasibility. For neglectedness, they should track why causes are neglected—lack of awareness vs. informed rejection. Separating "crowdedness" from "adequately resourced" could help. Also, including emerging causes that haven't had scrutiny might rebalance. 

  Ultimately, the exercise should acknowledge that ITN is a heuristic. Supplementing with qualitative discussions about why causes were rejected or embraced could surface the hidden historical factors. The goal isn't perfect scores but better-informed deliberation.
answer: |-
  Based on your detailed description, this is a recognized pitfall in multi-criteria decision frameworks, particularly when applied to domains shaped by prior human evaluation. The closest established concepts come from **decision theory**, **psychometrics**, and **evaluation methodology**, though no single term perfectly captures your entire observation. Here's a breakdown:

  ### Core Problem: **Criterion Contamination via Historical Selection Effects**
  This describes your core issue: Factors intended as independent are corrupted by the *history of prior attention*, making them proxies for a single latent variable ("survived scrutiny"). Neglectedness isn't just a separate input; it's an *output* of past evaluations of importance/tractability. This creates feedback loops that undermine the framework's logic.

  ### Established Concepts & Why They Fit (Partially)
  1.  **Indicator Saturation/Redundancy (Psychometrics/Composite Indicators):**
      *   **What it is:** When multiple indicators in a composite index measure the same underlying construct, reducing discriminant validity.
      *   **Why it fits (partially):** Your ITN factors become saturated by the "historical scrutiny" construct. Importance and tractability lose variance due to pre-screening ("big" causes only), while neglectedness strongly reflects prior rejection. The multiplicative combination amplifies this redundancy.
      *   **Gap:** It doesn't explicitly capture the *causal direction* (neglectedness as an *outcome* of past judgments on the other factors) or the perverse incentive (rewarding failed scrutiny).

  2.  **Endogeneity (Economics/Causal Inference):**
      *   **What it is:** When an explanatory variable in a model is correlated with the error term, often due to omitted variables, reverse causality, or measurement error. Here, neglectedness (explanatory) is causally influenced by unobserved historical evaluations of importance/tractability (omitted variable).
      *   **Why it fits (partially):** Neglectedness isn't truly exogenous; it's *endogenously determined* by the very factors it's supposed to be independent of. Scoring it "high" (good) often means the cause failed prior evaluations on other dimensions.
      *   **Gap:** It's a technical statistical term less focused on the practical scoring/rubric failure and the perverse ranking outcome.

  3.  **Survivorship Bias (Statistics/Selection Bias):**
      *   **What it is:** Focusing only on entities that "survived" a selection process, overlooking those that failed, leading to overly optimistic conclusions.
      *   **Why it fits (partially):** Your *list of candidate causes* inherently suffers from survivorship bias – they are pre-selected as "plausibly big." The ITN framework *applied to this list* then exhibits a *secondary* survivorship bias: high neglectedness scores often indicate a cause *didn't survive* prior expert scrutiny, yet the framework interprets this as a positive signal.
      *   **Gap:** Focuses more on the input list than the framework's internal dynamics and factor correlation.

  ### Proposed Term: **The Attenuation Paradox in Prioritization Frameworks**
  *   **Definition:** A failure mode in multi-criteria prioritization frameworks (like ITN) where:
      1.  Pre-screening of options attenuates variation in one or more factors (e.g., importance becomes uniformly "high").
      2.  Historical selection processes create a latent dependency between factors, causing one factor (often neglectedness) to become a dominant proxy for prior evaluations.
      3.  This leads to a paradoxical outcome: the framework systematically assigns higher priority to options that have *failed* prior scrutiny (as evidenced by high neglectedness) while downgrading options validated by attention (low neglectedness), effectively rewarding attenuation and historical rejection.
      4.  The framework's assumption of factor independence collapses due to unacknowledged historical selection effects contaminating the criteria.

  *   **Distinguishing from Neighbors:**
      *   **vs. Efficient Markets Hypothesis (EMH):** EMH deals with information *already reflected in prices*. The Attenuation Paradox deals with information *reflected in the historical pattern of attention/neglect itself*, which contaminates the *scoring inputs* of a decision rubric. It's about flawed *measurement within the framework*, not market efficiency.
      *   **vs. Goodhart's Law:** Goodhart's is about measures becoming corrupted *when used as targets*. The Attenuation Paradox occurs *even without gaming* – it's an inherent structural flaw when the framework's inputs are non-independent due to historical selection. The "perverse incentive" is emergent from the structure, not active optimization against a target.

  *   **Edges & Variations:**
      *   **Partial Entanglement:** If only two factors are entangled (e.g., high neglectedness strongly predicts low tractability due to past abandonment), the paradox still operates but might be less dominant. The framework remains flawed but potentially salvageable by isolating the independent factor.
      *   **Opposite Correlation (Blind Spot):** If neglectedness *genuinely* signals an overlooked opportunity (true blind spot), this is the *intended* function of the neglectedness factor. The paradox arises specifically when neglect is *primarily* a signal of prior negative evaluation, not undiscovered potential. Distinguishing requires investigating *why* a cause is neglected – lack of awareness vs. informed rejection. Your observation suggests the latter is common in pre-screened cause lists.
      *   **Direction Matters:** The paradox hinges critically on neglect being an *effect* of negative prior evaluation. If neglect causes *future* low tractability (e.g., no one develops solutions), it's a different dynamic (a potential virtuous cycle if addressed).

  ### Patching the Exercise Without Abandoning ITN
  Here’s how your group can mitigate the Attenuation Paradox:

  1.  **Force Variation in Importance:**
      *   **Action:** Use explicit anchors. Define specific scales (e.g., "Global scale, affects millions annually = 5; Regional scale, affects thousands = 3"). Compare causes to *diverse* references (e.g., Is this closer to malaria burden or AI safety risk in scale?).
      *   **Why:** Prevents "everything is big" collapse.

  2.  **Deepen Tractability Assessment:**
      *   **Action:** Move beyond "solvable?" Ask: *"What is the most plausible theory of change?" "What are the concrete bottlenecks?" "What evidence exists that progress is possible?"* Score "evidence base for tractability" separately from "subjective ease."
      *   **Why:** Forces justification, reducing nudging to fit preferences. Highlights if neglect is due to perceived intractability.

  3.  **Reframe & Investigate Neglectedness:**
      *   **Action:** Split "Neglectedness" into two scores:
          *   **A. Current Resources:** How much funding/talent is *currently* dedicated relative to estimated need? (Quantify if possible).
          *   **B. Reason for Neglect:** Why is it neglected? (Scale: 1=Consensus it's hopeless/ineffective, 3=Unclear/contested, 5=Plausible blind spot/genuinely overlooked).
      *   **Action:** Research *why* a cause is neglected *before* scoring. Did major funders reject it? Why?
      *   **Why:** Directly addresses the paradox. A high "Resources" score (low neglect) isn't bad if the cause warrants it. A high "Reason for Neglect" score signals potential for a blind spot.

  4.  **Incorporate "Differential Progress" or "Room for More Funding":**
      *   **Action:** Instead of raw neglectedness, score "How much additional marginal resources are likely to be highly impactful?" This blends neglectedness and tractability but accounts for diminishing returns. Ask: "Would $1M more right now likely achieve significant progress?"
      *   **Why:** Focuses on the *impact* of attention, not just its absence.

  5.  **Calibrate with External Benchmarks:**
      *   **Action:** Use existing research (e.g., Open Philanthropy reports, Founders Pledge, Global Priorities Institute) to get initial ITN scores *before* discussion. Challenge the group to justify deviations.
      *   **Why:** Reduces groupthink and anchors scores in external analysis, mitigating reliance on neglect as the sole differentiator.

  6.  **Acknowledge the Limitation Explicitly:**
      *   **Action:** Start the workshop by explaining the Attenuation Paradox. Frame ITN as a useful *starting heuristic* prone to this distortion, not a mechanical truth generator. Emphasize that high neglectedness *requires* investigating *why*.
      *   **Why:** Builds meta-awareness, improving critical thinking during scoring.

  **Conclusion:** You've astutely identified the **Attenuation Paradox in Prioritization Frameworks**. This arises from the non-independence of ITN factors caused by historical selection effects contaminating the criteria, leading neglectedness to dominate and perversely reward causes rejected by prior scrutiny. By reframing neglectedness (especially probing *why* neglect exists), forcing variation in importance, deepening tractability assessment, and incorporating external benchmarks, your group can significantly improve the exercise's validity while retaining the valuable structure of the ITN framework. The key is moving from simplistic scoring to nuanced investigation of *why* the scores look the way they do.
