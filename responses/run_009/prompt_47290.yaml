prompt: |-
  I teach an upper-level metaphysics seminar — 14 students, one 80-minute session, movable desks and a whiteboard. We're about to begin the unit on laws of nature, and before the students read anything, I want them to feel the difference between two pictures: on one, the laws are just the best summary of the totality of particular facts — a "lawbook" chosen by trading simplicity off against strength, with nothing enforcing it, nothing it constrains; on the other, the laws somehow govern or produce the particular facts, so that the direction of explanation runs the other way. I want the session designed so they run into the trouble spots of the summary picture on their own, not because I tell them.

  Design the session around the following, or around better machinery of your own devising. First, teams receive a finite "mosaic" of particular facts — give me a concrete, physically realizable dataset (something I can hand out on paper), plus a fixed vocabulary in which their candidate lawbooks may be written. Second, the teams compete as systematizers: each produces a lawbook, and I score them on simplicity and strength under an exchange rate I announce in advance. Third, at least one round must be engineered to end in a genuine tie or underdetermination: two clearly different lawbooks scoring identically under the announced exchange rate, so that which laws there are comes out relative to a choice none of them made. Fourth, a "miracle" round: the mosaic I hand out contains a sparse handful of exception-events, and the teams must decide whether a simpler law supplemented by explicitly declared exceptions beats a messier law with none — I want them to discover for themselves that the summary picture buys simplicity by tolerating miracles. Then a debrief that maps each stage of the game onto the corresponding part of the dialectic, including where in the game each anti-Humean intuition was at its strongest.

  One constraint I care about a great deal: the game must not secretly smuggle in a governing rule. If I generate the mosaic from a hidden "true" generative rule, the students will naturally treat their candidate lawbooks as guesses at that rule — which is precisely the governing intuition that the summary picture denies. Either design the session to avoid this trap altogether, or build it in deliberately and make it the debrief's punchline. Say explicitly which you have done and why.

  I also want two honest sections at the end. In one, tell me what will predictably go wrong the first time I run this — including how likely the students are to keep asking, and refusing to drop, "but which one is really the law?", what to do when a team tries to game the scoring rather than systematize, and what to do if the tie I engineered doesn't materialize. In the other, be frank about which features of the real disagreement no classroom game can reproduce and I will have to supply by talking — for instance, the modal reach of laws into counterfactuals about situations that occur nowhere in the mosaic, or the claim that explanation runs from laws down to facts rather than from facts up to lawbooks.

  Format: open with a three-sentence overview of the session's arc, then present the rules, materials, timeline, debrief plan, and the two honesty sections as separately headed sections; keep the whole response under 900 words.
reasoning: |-
  Okay, I need to design a metaphysics seminar session about laws of nature for this professor. The key goal is to help students grasp the difference between two views: laws as summaries versus laws as governing forces. The professor wants students to discover problems with the summary view through hands-on activity, not lecture.

  Hmm, the constraints are clear - no smuggling in governing rules, include specific mechanics like finite mosaics, team competition, a tie scenario, and a miracle round. The debrief needs to map game elements to philosophical concepts, plus honest sections about pitfalls and limitations.

  First, I'll create a physically realizable dataset. A grid-based mosaic tracking presence/absence of properties at spatiotemporal points would work well - concrete enough to print, simple to understand. Using letters for properties (A,B,C) keeps it manageable. For the tie scenario, I'll design patterns where both "A always" and "B always" fit perfectly with exceptions, creating scoring ambiguity.

  For the miracle round, I'll add rare exceptions to an otherwise perfect pattern. Students will face the choice: simple law with declared exceptions versus complex law covering everything. This should make them feel the "tolerance for miracles" trade-off.

  Crucially, I'll avoid any hidden generating rule by making mosaics patternless - just stipulated point data. The debrief will explicitly address how students likely imported governing intuitions anyway. The honesty sections will warn about students persisting with "real law" questions and gaming attempts, plus acknowledge limitations like modal reach.

  The session should flow from introduction to mosaic work, then scoring reveal, tie demonstration, miracle round, and debrief. I'll keep the whole response structured yet concise, hitting all requested sections under 900 words.
answer: |-
  ## Session Overview
  Students will experience law-discovery as systematization through competitive team exercises with concrete mosaics, revealing tensions in the summary view. They'll encounter underdetermination (tie round) and the cost of simplicity (miracle round) firsthand. The debrief explicitly connects game struggles to core metaphysical disagreements, addressing the "smuggled governance" issue head-on.

  **Rules & Materials**

  *   **Mosaics:** Physical 10x10 grids representing spacetime points. Each cell holds one letter: A, B, C, or "-" (empty). Handouts show specific configurations.
  *   **Vocabulary:** Teams write "laws" as universally quantified conditionals using: `(X at (x,y))` (X=A,B,C), logical operators (`&`, `|`, `->`, `~`), spatial adjacency (`Adj((x1,y1),(x2,y2))`), temporal succession (`Succ((x1,y1),(x2,y2))` - rows are time), and `Exception(X, (x,y))`.
  *   **Scoring:** `Total Score = Strength - Complexity`. **Strength:** % of mosaic cells correctly described/entailed by the lawbook (1 point per correct cell). **Complexity:** Count of distinct atomic propositions and logical operators in the lawbook (1 point per element). **Exchange Rate:** Announced per round (e.g., Round 1: Complexity penalty = 0.5 * Count).
  *   **Procedure:** Teams (3-4 students) get mosaic, vocabulary, 15 mins to write a lawbook. Lawbooks collected. Instructor reveals scoring metric, calculates scores publicly, declares winner. Repeat for next rounds.
  *   **Lawbook Requirements:** Must cover the entire mosaic (use `Exception` clauses if needed). Must be syntactically valid using the vocabulary.

  **Timeline (80 mins)**

  1.  **Intro (5 min):** Frame the activity: "Today, you are scientists finding the best summary of this universe's data."
  2.  **Round 1: Baseline (15 min):** Mosaic: Simple pattern (e.g., All cells are `A`). Teams produce simple lawbooks (`ForAll p: A at p`). Reveal scoring (e.g., Complexity penalty = 0.5). Discuss ease/simplicity.
  3.  **Round 2: The Tie (20 min):** Mosaic: Pattern allowing underdetermination (e.g., *Everywhere* either `A` or `B` is present; `A` dominates top half, `B` bottom half; no `C` or `-`). Teams produce competing lawbooks (e.g., `ForAll p: A at p` w/ exceptions for Bs OR `ForAll p: B at p` w/ exceptions for As OR complex `ForAll p: (A at p) | (B at p)`). **Crucially:** Use an exchange rate (e.g., Complexity penalty = 1.0) where the simple law + exceptions and the complex law have *identical scores*. Declare a tie. Highlight the different systems achieving equal "best summary."
  4.  **Round 3: The Miracle (20 min):** Mosaic: Clear pattern *with rare exceptions* (e.g., 98% `C`, but 2 cells are `A`). Teams choose: Simple law + exceptions (`ForAll p: C at p` + `Exception(C, (3,4))`, `Exception(C, (7,7))`) OR complex law covering everything (`ForAll p: (p=(3,4) -> A at p) & (p=(7,7) -> A at p) & (Other p -> C at p)`). Use exchange rate favoring simplicity (e.g., Complexity penalty = 0.7). Likely winner: Simple law + exceptions. Frame exceptions as "miracles."
  5.  **Debrief (20 min):** Map game to metaphysics:
      *   *Baseline:* Ease of summary when pattern is perfect.
      *   *The Tie (Underdetermination):* "Best summary" isn't unique. Which laws "exist" depends on our choice of weighting (simplicity vs. strength). No single "governing" rule revealed by the data alone.
      *   *The Miracle (Cost of Simplicity):* Simple summaries tolerate deviations (exceptions/miracles). Is this a feature (flexibility) or a bug (loss of strict governance)?
      *   *The Smuggled Governance:* Acknowledge the trap: "You likely *felt* like you were searching for a hidden rule generating the mosaic. But the mosaic was *just given*; no generative rule existed. Your intuition of governance is powerful, but the summary view claims it's *only* an intuition projected onto our best descriptions." This is the punchline.

  **Honestly, What Will Go Wrong?**

  *   **"But which is REALLY the law?":** Expect persistent questions, especially after the tie. **Do:** Acknowledge the intuition's strength in the debrief. Redirect: "The game forces us to ask: *Can* we decide based *only* on the mosaic and our scoring preferences? What else would we need?"
  *   **Gaming the System:** A team might write absurdly complex "laws" fitting perfectly (max Strength, min simplicity loss). **Do:** 1) Pre-empt: Emphasize "systematization" implies seeking *understandable* summaries. 2) Post-hoc: Use their example in the debrief to show complexity without insight isn't explanatory.
  *   **Tie Doesn't Materialize:** Teams might miss the equally scoring options or find a third. **Do:** Have the pre-calculated tie examples ready. Present them yourself: "Notice these two systems also scored identically under our metric..."

  **Honestly, What the Game Can't Capture (Requires Lecture)**

  *   **Modal Force:** The game only concerns the actual mosaic. Laws are supposed to support counterfactuals ("If this *had* happened, the law *would* ensure that..."). The summary view struggles to ground this necessity.
  *   **Direction of Explanation:** The game reinforces explanation *from facts to laws* (summarizing data). The governing view insists explanation runs *from laws to facts* (laws make the facts happen). This asymmetry is fundamental but invisible in the game.
  *   **The "Oomph" of Governance:** The intuition that laws *make* things happen or *constrain* possibilities is phenomenologically powerful but remains an unexplained posit within the governing view itself. The game highlights the summary view's parsimony but can't dispel the feeling of "governance".
