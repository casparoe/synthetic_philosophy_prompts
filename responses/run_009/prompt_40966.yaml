prompt: |-
  Suppose we treat George Berkeley's economic writings — his Irish queries of the 1730s — as a track record of verdicts on monetary questions, and I want to know how he would rule on cases that arose only after his death. His verdicts so far, as I understand them: (1) gold and silver coin has no intrinsic worth as money, its monetary value resting on opinion and common acceptance rather than the metal itself; (2) money works much like language, its value and meaning arising from shared use by a community, the way words do; (3) a national bank should issue paper notes, secured not on bullion but on the country's productive capacity — its manufactures, for instance — so as to keep the poor at their industry; (4) money that is hoarded or drained abroad is money taken out of circulation, and idle money is a loss to the nation, the real wealth of a people lying in their labor and skill rather than in their stock of precious metal; and (5) dependence on the credit of foreign merchants is a vulnerability a nation should rid itself of by being self-sufficient in its own currency.

  Now three new cases. (A) Bitcoin: a money with no issuing state, no security, its supply fixed by an algorithm, its value sustained purely by the willingness of a dispersed community of users to treat it as money. (B) A central bank digital currency: state-issued fiat in electronic form, infinitely divisible, every transaction visible to the issuer, which could in principle be programmed to expire or be spent only on certain goods. (C) A small nation like Ireland surrendering its own currency to join a monetary union run from abroad, gaining stability in exchange for losing control over the issue of money.

  For each case, tell me what Berkeley would say, but more importantly tell me what rule he is implicitly running. One candidate is a pure conventionality rule: whatever a community commonly accepts as its measure and medium is money, and the state's role is incidental — this rule seems to license Bitcoin. Another is an instrumental rule: money is a tool of national policy, justified entirely by whether it keeps a people industrious and the real wealth circulating — this rule seems to condemn Bitcoin, welcome the CBDC (perhaps enthusiastically, given point (4) about idle money), and frown on case (C). The two rules appear to diverge most sharply on case (B) if we imagine the CBDC being used to compel circulation; tell me whether they really diverge there or whether some further case — one you construct — would separate them more cleanly. Also say which of the five verdicts in the track record is actually load-bearing, since some of them may be doing no work at all. Please keep your answer under 400 words.
reasoning: |-
  Okay, the user wants me to analyze how George Berkeley would view three modern monetary cases (Bitcoin, CBDC, and monetary union) based on his historical economic writings. They've provided Berkeley's five key principles about money and want me to determine which implicit rules he follows - conventionality versus instrumentalism.

  First, I need to recall Berkeley's core ideas: money has no intrinsic value (1), functions like language through community acceptance (2), should be state-issued paper backed by productivity (3), idle money harms the nation (4), and nations should avoid foreign credit dependence (5). 

  For Bitcoin (Case A): Berkeley would likely reject it despite its community acceptance because it lacks state backing and doesn't serve national economic goals. His instrumental rule prioritizes money as a policy tool over pure convention.

  For CBDC (Case B): Berkeley would enthusiastically support this. The state-issued digital currency aligns perfectly with his views on state control, preventing hoarding (via expiration features), and tracking circulation. This showcases his instrumental rule most clearly.

  For monetary union (Case C): Berkeley would oppose Ireland surrendering currency control. While gaining stability, losing monetary sovereignty contradicts his principles of self-sufficiency and using money as a national policy tool.

  The key divergence appears in Bitcoin vs CBDC. While both involve community acceptance, Berkeley prioritizes the state's role in directing money for public benefit. The most load-bearing principle is clearly #3 - the state should issue productive-backed currency to maintain industry. Principles 1 and 2 support this but aren't decisive alone. 

  The pure conventionality rule (community acceptance alone suffices) gets overruled by Berkeley's stronger instrumental view. A cleaner test case would be community-issued local currency without state backing - Berkeley would still reject it despite local acceptance, proving instrumentalism dominates.
answer: |-
  Based on Berkeley's principles, here's how he would likely rule and the implicit rule applied:

  1.  **Case A (Bitcoin):**
      *   **Verdict:** Rejection.
      *   **Rule:** **Instrumental Rule.** While Bitcoin has community acceptance (echoing principle 2), it lacks state issuance and crucially, *deliberate connection to national productive capacity and policy* (principles 3 & 5). Its fixed supply and potential for hoarding/idleness directly contradict principle 4. It embodies the dangerous "dependence on foreign credit" by relying on dispersed, uncontrolled actors (principle 5). Its value isn't anchored to national labor/skill.

  2.  **Case B (Central Bank Digital Currency - CBDC):**
      *   **Verdict:** Strong Approval.
      *   **Rule:** **Instrumental Rule.** This fulfills Berkeley's vision: state-issued (principle 3), replacing idle metal/hoarded money (principle 4), backed implicitly by the state's economic capacity (principles 3 & 4), maximizing circulation and state oversight. Features preventing hoarding (expiry) align perfectly with principle 4. Visibility supports policy goals (keeping industry active). It severs dependence on foreign systems (principle 5).

  3.  **Case C (Monetary Union):**
      *   **Verdict:** Disapproval.
      *   **Rule:** **Instrumental Rule.** Surrendering monetary sovereignty to a foreign entity directly violates principle 5 (dependence on foreign credit/control). It removes the nation's ability to issue currency secured on *its own* productive capacity for *its own* industry and poor (principles 3 & 4). Stability gained is outweighed by loss of instrumental control.

  **Rule Divergence & Load-Bearing Principle:**

  *   The **Instrumental Rule** clearly dominates. Berkeley prioritizes money as a tool for *state-directed national economic development*, focusing on industry, circulation, and self-sufficiency. Community acceptance (Conventionality Rule) is *necessary* but *insufficient*; it must serve the instrumental purpose.
  *   **Divergence on CBDC:** The rules don't truly diverge here *for Berkeley*. The state *creates* the community acceptance framework for the CBDC precisely to serve its instrumental goals (circulation, policy). Compulsion enhances the instrumental function he desires.
  *   **Cleaner Divergence Test Case:** A purely *community-issued, non-state* local currency (e.g., a thriving LETS system) used productively within its region. The Conventionality Rule accepts it. Berkeley's Instrumental Rule rejects it due to lack of state backing/connection to *national* capacity/policy and potential fragility (principle 5).
  *   **Load-Bearing Principle:** Principle **(3)** is paramount: the state *must* issue paper secured on national productive capacity to keep the poor industrious. It necessitates state control (rejecting Bitcoin and Monetary Union), enables preventing idleness (CBDC features/Principle 4), and demands self-sufficiency (Principle 5). Principles 1, 2, and 4 support 3, but 3 is the core policy prescription driving the instrumental view. Principle 5 reinforces the *national* focus of 3.
