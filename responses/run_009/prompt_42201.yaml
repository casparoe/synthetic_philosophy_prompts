answer: |-
  ### Exam Question

  **Instructions:** Analyse each of the following five claims. For each claim:  
  (i) State whether it is provable in ZF set theory without any form of the Axiom of Choice (AC). Write "Yes" or "No".  
  (ii) If not provable in ZF, identify the minimal choice principle required to prove it from the list below and briefly explain where in the natural proof this principle enters. If provable in ZF, explain briefly why no choice principle is needed.  
  Focus your explanation on the structure of the sets involved (e.g., index sets, uniformity of elements, well-orderings).  

  **Choice principles (for reference):**  
  - **AC_ω (Countable Choice):** Every countable family of nonempty sets has a choice function.  
  - **DC (Dependent Choice):** If \( R \) is a binary relation on a nonempty set \( S \) such that \( \forall a \in S \, \exists b \in S \, (a R b) \), then there exists a sequence \( (a_n)_{n \in \mathbb{N}} \) in \( S \) with \( a_n R a_{n+1} \) for all \( n \).  
  - **AC (Full Axiom of Choice):** Every family of nonempty sets has a choice function.  

  **Claims:**  
  A. The union of countably many countable sets is countable.  
  B. Every infinite set has a countably infinite subset.  
  C. Every surjection \( f: X \to Y \) has a right inverse (i.e., a function \( g: Y \to X \) such that \( f \circ g = \mathrm{id}_Y \)).  
  D. Every vector space over a field has a basis.  
  E. Let \( \mathcal{P} \) be a partition of \( \mathbb{N} \) (i.e., \( \mathcal{P} \) consists of nonempty, pairwise disjoint subsets of \( \mathbb{N} \) whose union is \( \mathbb{N} \)). Then there exists a set \( R \subseteq \mathbb{N} \) that contains exactly one element from each set in \( \mathcal{P} \).  

  ---

  ### Model Answer  

  **Claim A:** The union of countably many countable sets is countable.  
  (i) No.  
  (ii) AC_ω is required.  
  **Explanation:** Let \( \{A_n \mid n \in \mathbb{N}\} \) be a countable family of countable sets. To show \( \bigcup_{n \in \mathbb{N}} A_n \) is countable, we must exhibit a surjection from \( \mathbb{N} \) to the union. Each \( A_n \) is countable, so for each \( n \), there exists a surjection \( f_n: \mathbb{N} \to A_n \). However, ZF alone does not guarantee a *uniform* selection of the surjections \( f_n \), as the existence of each \( f_n \) does not provide a way to choose one canonically. AC_ω is needed to simultaneously choose the surjections \( f_n \) for all \( n \), forming a sequence \( (f_n)_{n \in \mathbb{N}} \). Without AC_ω, the union may not be countable (e.g., in models with Dedekind-finite reals).  

  **Claim B:** Every infinite set has a countably infinite subset.  
  (i) No.  
  (ii) AC_ω is required.  
  **Explanation:** Let \( X \) be infinite. The natural proof constructs a sequence \( (x_n)_{n \in \mathbb{N}} \) of distinct elements by iteratively choosing \( x_n \in X \setminus \{x_0, \dots, x_{n-1}\} \). This requires infinitely many choices: at each step, we select an element from a nonempty set \( S_n = X \setminus \{x_0, \dots, x_{n-1}\} \). The sets \( S_n \) depend on prior choices (so DC could be used), but AC_ω suffices since the family \( \{S_n \mid n \in \mathbb{N}\} \) is countable. Without AC_ω, \( X \) may be Dedekind-finite, lacking a countably infinite subset.  

  **Claim C:** Every surjection \( f: X \to Y \) has a right inverse.  
  (i) No.  
  (ii) Full AC is required.  
  **Explanation:** For each \( y \in Y \), the fiber \( f^{-1}(\{y\}) \) is nonempty. A right inverse \( g: Y \to X \) must satisfy \( g(y) \in f^{-1}(\{y\}) \) for all \( y \), so \( g \) is a choice function for the family \( \{f^{-1}(\{y\}) \mid y \in Y\} \). Since \( Y \) and the fibers may be arbitrary (with no uniform structure), full AC is needed. This claim is equivalent to AC; ZF cannot prove it, as AC is independent.  

  **Claim D:** Every vector space over a field has a basis.  
  (i) No.  
  (ii) Full AC is required.  
  **Explanation:** The natural proof uses Zorn’s lemma (equivalent to AC) on the partially ordered set of linearly independent subsets ordered by inclusion. For infinite-dimensional spaces (e.g., \( \mathbb{R} \) as a \( \mathbb{Q} \)-vector space), there is no canonical way to extend partial bases without arbitrary choices. Crucially, the family of linearly independent sets lacks a uniform selection mechanism, and AC is necessary. It is known (via metamathematics) that this statement is equivalent to AC over ZF.  

  **Claim E (Trap):** Let \( \mathcal{P} \) be a partition of \( \mathbb{N} \). Then there exists a set \( R \subseteq \mathbb{N} \) containing exactly one element from each set in \( \mathcal{P} \).  
  (i) Yes.  
  (ii) Not applicable.  
  **Explanation:** No choice principle is needed. Since \( \mathbb{N} \) is well-ordered by its standard order, we can define a choice function uniformly: for each \( A \in \mathcal{P} \), let \( g(A) = \min(A) \). Then \( R = \{g(A) \mid A \in \mathcal{P}\} \) is the required set. The well-ordering provides a canonical least element in each \( A \), so the choice is explicit and definable in ZF. The index set \( \mathcal{P} \) may be uncountable, but the uniformity of the selection rule avoids any dependence on AC.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **General Note:** Answers relying solely on memorized equivalences (e.g., "AC is needed because Zorn’s lemma is used") without diagnosing set structures lose marks.  

  **Claim A (5 marks):**  
  - (i) Correct "No" (1 mark). *Common error:* "Yes" due to misapplying "countable sets are manageable".  
  - (ii) Correct AC_ω (1 mark). *Common error:* Full AC or DC.  
  - Explanation: Clear reference to choosing surjections uniformly for a countable family (3 marks). *Common error:* Not addressing the need to choose infinitely many surjections or confusing with a single countable set.  

  **Claim B (5 marks):**  
  - (i) Correct "No" (1 mark). *Common error:* "Yes" by assuming recursion works without choice.  
  - (ii) Correct AC_ω (1 mark). *Common error:* Full AC or DC.  
  - Explanation: Identifies the iterative choice from sets \( S_n \) and dependence on prior choices (3 marks). *Common error:* Missing the countable family structure or invoking DC unnecessarily.  

  **Claim C (5 marks):**  
  - (i) Correct "No" (1 mark). *Common error:* "Yes" by defining \( g \) naively.  
  - (ii) Correct full AC (1 mark). *Common error:* Weaker principles like AC_ω.  
  - Explanation: Notes that fibers form an arbitrary family and explicitly links to AC equivalence (3 marks). *Common error:* Not recognizing the fibers as arbitrary sets or missing the equivalence to AC.  

  **Claim D (5 marks):**  
  - (i) Correct "No" (1 mark). *Common error:* "Yes" for finite-dimensional spaces.  
  - (ii) Correct full AC (1 mark). *Common error:* AC_ω or DC.  
  - Explanation: References Zorn’s lemma, arbitrary extension, and equivalence to AC (3 marks). *Common error:* Focusing only on finite cases or missing the arbitrary choice in extension.  

  **Claim E (5 marks):**  
  - (i) Correct "Yes" (1 mark). *Common error:* "No" due to reflexively invoking choice for partitions.  
  - Explanation: Uses well-ordering of \( \mathbb{N} \) to define \( \min(A) \) uniformly (4 marks). *Common error:* Omitting the well-ordering, misapplying choice to the index set \( \mathcal{P} \), or not justifying definability.  

  **Overall (Penalties):**  
  - **Trap detection:** Answers claiming "AC needed" for Claim E lose all 5 marks for E.  
  - **Reflexive overuse of AC:** Scripts claiming "not provable in ZF" for all claims lose ≥5 marks (for E).  
  - **Metamathematical rigor:** Where equivalence to AC is stated (C, D), no proof required; credit for flagging it.  

  \answer{Definable vs. arbitrary choices based on set structure.}
