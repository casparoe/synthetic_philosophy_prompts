  Claim A: A countable union of countable sets is countable.

    (i) No, not provable in ZF alone.
    (ii) AC_ω (countable choice) is required.

    Explanation: To see that the union is countable, we would typically enumerate each countable set and then use a diagonal argument. However, for each countable set in the family, we are given that it is countable, meaning there exists a bijection (or surjection) from ℕ to it. But without AC_ω, we cannot simultaneously choose an enumeration for each set. The natural proof requires a sequence of enumerations (one for each set) and then combines them. Thus, we need AC_ω to pick a surjection for each set.

  Claim B: Every infinite set has a countably infinite subset.

    (i) No, not provable in ZF alone.
    (ii) AC_ω (countable choice) is required.

    Explanation: The usual proof starts by noting that the set is infinite, so it is not in bijection with any finite ordinal. Then, we choose distinct elements recursively: let x0 be an element of the set, then x1 from the set minus {x0}, and so on. However, this recursive definition requires making countably many choices. Without AC_ω, we cannot guarantee that such a sequence exists. The set might be Dedekind-finite, meaning it has no countably infinite subset, and such sets can exist in ZF without AC.

  Claim C: Every surjection f: X → Y has a right inverse.

    (i) No, not provable in ZF alone.
    (ii) Full AC is required.

    Explanation: The existence of a right inverse is equivalent to AC. To define a right inverse g: Y → X, we must choose for each y in Y an element x in the fiber f^{-1}({y}), which is nonempty because f is surjective. This is exactly the statement of AC for the family {f^{-1}({y}) : y in Y}. Since the sets f^{-1}({y}) may be arbitrary nonempty sets and the index set Y may be arbitrary, full AC is required. It is known that this statement is equivalent to AC.

  Claim D: Every vector space over a field has a basis.

    (i) No, not provable in ZF alone.
    (ii) Full AC is required.

    Explanation: The standard proof uses Zorn's lemma (equivalent to AC) to extend linearly independent sets to a basis. Without AC, it is consistent that there are vector spaces without a basis; for example, it is known that the vector space of all real numbers over the rationals may not have a basis in a model of ZF without AC. Moreover, the statement is equivalent to AC.

  Claim E: Let P be a partition of ℕ. Then there exists a set R ⊆ ℕ containing exactly one element from each element of P.

    (i) Yes, provable in ZF alone.
    (ii) Not applicable.

    Explanation: Since the natural numbers are well-ordered (by the usual order), we can define a function that selects the least element in each set of the partition. Specifically, for each A in P, let g(A) = min(A). Then R = { g(A) : A in P } is the required set. This definition is uniform and requires no choice because the well-ordering of ℕ is definable in ZF.

