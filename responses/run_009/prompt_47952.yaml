  *Prioritization logic:*
  1. **Interpretation first** because it determines the axioms for coherence. You can't evaluate decision rules without knowing what the set *means*. 
  2. **Dynamic coherence second**—it tests whether your interpretation+rule combo survives sequential choice. 
  3. **Decision rules become derivative**—they're outputs of (1) and constrained by (2). 

