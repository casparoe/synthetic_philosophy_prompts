prompt: |-
  I'm about 18 months out from handing in my masters thesis and thinking of working on imprecise probabilities — my background is mostly formal epistemology, decent at decision theory, not so strong on measure theory. What are the real open questions in that area right now, and which two or three should I actually prioritise? I'm less interested in a survey than in the ordering being defended. For instance, is picking the right decision rule for sets of credences (maximality, E-admissibility, gamma-maximin and so on) upstream of everything else, or is the interpretation question — whether the set of probabilities represents one agent's indeterminate credal state or something like a committee of experts — actually upstream of that, since the answer plausibly determines which rules are even coherent? Where do things like dilation and the various money-pump / dynamic choice objections to indeterminacy fit in the dependency order? And please deprioritise anything that wouldn't change much downstream even if it got settled, or that's really a technical result a statistician would get to faster than a philosophy student.
