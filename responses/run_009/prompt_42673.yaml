  Now, the residue report. The author problem: evolution as author doesn't map. Asymptomatic cases: naturalists would call it a defect regardless, but in practice, it's treated based on consequences, which is normativist. Normal but unwanted conditions: naturalists can't handle the changing spec, while normativists adjust based on values.

