answer: |-
  Below is a practical, step-by-step procedure for grant evaluation under moral uncertainty, designed for your foundation's constraints. It adapts the "**Moral Parliament**" approach (from MacAskill, Bostrom, and others) to avoid intertheoretic comparisons while respecting trustee disagreements. The procedure treats each trustee's moral view as a "faction" with equal voting weight (1/3 each). Factions vote based on whether a grant meets their threshold of acceptability. Voting power aggregates to a majority decision, with clear off-ramps for unresolved comparisons.  

  ---

  ### **Grant Evaluation Procedure**  
  **Goal**: Approve/reject grants without resolving moral disagreements.  
  **Time**: Program officer completes in <1 hour per proposal. Trustees review only borderline cases.  
  **Inputs**:  
  - Trustees pre-commit to guidelines for their moral view (see *Pre-Work*).  
  - Program officer estimates project impacts using standard evidence (e.g., cost-effectiveness estimates, expert reports).  

  #### **Pre-Work (Trustees Only)**  
  1. **Each trustee provides simplified guidelines** for their moral view:  
     - **Utilitarian**: Define outcomes (e.g., QALYs/DALYs for humans/animals, extinction risk reduction) and cost-effectiveness thresholds.  
     - **Contractualist**: Define outcomes (e.g., human welfare gains, fairness metrics) and thresholds. Specify if animal welfare is excluded.  
     - **Presentist**: Define outcomes (e.g., near-term human welfare impacts) and thresholds. Specify if future generations are discounted.  
  2. **Set faction thresholds**: Each trustee sets a minimum "impact per dollar" score (0–10 scale) for their faction to support a grant (default = 5).  
  3. **Agree on a voting rule**: Grants approved if ≥2 factions support (i.e., ≥2/3 voting power).  

  ---

  ### **Step-by-Step Questions for Program Officer**  
  *(Per grant proposal, using pre-defined trustee guidelines)*  

  1. **Estimate Project Impacts**  
     - *Question*: What are the project’s expected direct outcomes (scale, probability, timeline)?  
     - *Sufficient Answer*: Quantitative estimates (e.g., "10M hens spared battery cages with 60% success chance," or "0.001% reduction in extinction risk over 50 years"). Use standard models (e.g., GiveWell, OpenPhil). Uncertainty ranges are acceptable.  

  2. **Score for Utilitarian Faction**  
     - *Question*: What is the expected impact per dollar in utilitarian terms?  
     - *Sufficient Answer*: Convert outcomes to the utilitarian guideline’s units (e.g., animal welfare-adjusted QALYs). Assign a 0–10 score (e.g., 8 = top 10% of past grants, 5 = meets cost-effectiveness threshold).  
     - *Decision*: Support if score ≥ threshold (default 5).  

  3. **Score for Contractualist Faction**  
     - *Question*: What is the expected impact per dollar in contractualist terms?  
     - *Sufficient Answer*: Convert outcomes to the contractualist guideline’s units (e.g., human welfare gains). Assign a 0–10 score. If outcomes are irrelevant (e.g., animal welfare), score 0.  
     - *Decision*: Support if score ≥ threshold.  

  4. **Score for Presentist Faction**  
     - *Question*: What is the expected impact per dollar in presentist terms?  
     - *Sufficient Answer*: Convert outcomes to the presentist guideline’s units (e.g., near-term human welfare). Discount long-term/future impacts if specified. Assign a 0–10 score.  
     - *Decision*: Support if score ≥ threshold.  

  5. **Aggregate Votes**  
     - Tally votes: Each "support" = 1/3 voting power.  
     - **Approval**: Sum of voting power ≥ 0.5 (i.e., ≥2 factions support).  
     - **Rejection**: Sum < 0.5.  

  6. **Handling Ambiguity**  
     - **Abstention**: If impact cannot be scored for a faction (e.g., no guideline for an outcome), that faction abstains.  
     - **Hand Back to Trustees If**:  
       - ≥1 faction abstains AND total voting power in favor is 0.33–0.49 (i.e., one faction supports, others abstain/unclear).  
       - All factions abstain (moral comparison unsolved).  
     - **Otherwise**: Program officer decides per voting rule.  

  ---

  ### **Example Evaluations**  
  #### **Proposal 1: Campaign to Eliminate Battery Cages in a Large Egg-Producing Country**  
  - **Impact**: 60% chance of sparing 10M hens/year from cages. Cost: $1M.  
  - **Utilitarian (U)**: Values animal welfare. Estimates 500K welfare-adjusted QALYs gained. Cost-effectiveness = 0.5 QALY/$, scores 7/10 (above threshold). → **Supports**.  
  - **Contractualist (C)**: Skeptical of animal moral value. Human welfare impact minimal (e.g., slight price increases). Scores 2/10. → **Rejects**.  
  - **Presentist (P)**: Focuses on current humans. Negligible human impact. Scores 2/10. → **Rejects**.  
  - **Result**: Voting power = 0.33 (U only) < 0.5 → **Rejected**.  
  - **Will Trustees Like It?** No. Utilitarian may object, but procedure reflects lack of consensus.  

  #### **Proposal 2: Speculative Project to Reduce Existential Risks to Humanity**  
  - **Impact**: 1% chance of reducing extinction risk by 0.1% (safeguarding 1e22 future lives). Cost: $2M.  
  - **Utilitarian (U)**: Values long-term future. Estimates massive expected QALYs (1e18). Scores 9/10. → **Supports**.  
  - **Contractualist (C)**: Uncertain about future generations. Guidelines ambiguous—assigns 4/10. → **Rejects** (below threshold).  
  - **Presentist (P)**: Prioritizes present people. Future benefits irrelevant. Scores 0/10. → **Rejects**.  
  - **Result**: Voting power = 0.33 (U only) < 0.5 → **Rejected**.  
  - **Hand Back?** No—scores are clear despite disagreement.  
  - **Will Trustees Like It?** No. Utilitarian and long-termists will dislike rejection, but procedure enforces presentist/contractualist constraints.  

  ---

  ### **What the Procedure Can and Cannot Do**  
  **Strengths**:  
  - **No intertheoretic comparisons**: Avoids comparing "animal QALYs" to "human fairness" by using faction-specific thresholds.  
  - **Practical**: Uses pre-agreed guidelines. No moral math required during evaluation.  
  - **Principled**: Reflects moral uncertainty via voting, not bargaining.  
  - **Clear outputs**: Approve, reject, or hand back.  

  **Limitations**:  
  - **Cannot resolve intense disagreements**: If one faction strongly supports and others oppose, grant fails (e.g., both examples). Trustees may need higher thresholds or side payments.  
  - **Requires upfront trustee engagement**: Guidelines must be clear and quantitative.  
  - **Oversimplifies uncertainty**: Scores ignore variance (e.g., high-risk/high-reward projects).  
  - **Faction rigidity**: Treats each view as monolithic (no intra-faction uncertainty).  

  **Where It Fails**:  
  - Projects with ambiguous outcomes (e.g., "improving animal welfare" without metrics) force abstentions.  
  - If all trustees set high thresholds, few grants pass.  

  ---

  ### **Recommendation**  
  This procedure ensures principled, efficient grantmaking while respecting moral pluralism. It will frustrate trustees whose priorities are niche (e.g., utilitarians on animal welfare), but that is the point—forcing compromise or guideline adjustments. Test it on past grants to calibrate thresholds. If deadlocks persist, consider a "bargaining round" where trustees trade support on contentious grants.
