  ## Release Notes: Classical Theory v2.0 (Codename: "Gestalt Shift")

  **After extensive refactoring and community feedback, we're thrilled to announce the major release of Classical Theory v2.0!** This represents a fundamental reimagining of our core framework, delivering unprecedented explanatory power and resolving long-standing inconsistencies that plagued v1.x. Prepare for a significantly altered conceptual landscape – we believe this marks a true leap forward.  

  **Highlights:**
  *   **Unified Field Interpretation:** Introduces a radically new ontology, seamlessly integrating phenomena previously handled by disparate, ad-hoc modules (`AetherField`, `AbsoluteSpaceTime`).
  *   **Dynamic State Resolution:** Observables are now inherently contextual, resolving the "Measurement Ambiguity" bug cluster that affected v1.5+.
  *   **Intrinsic Relationality:** Core entities now define their properties relationally, eliminating the need for absolute reference points (`ObserverIndependentState` module removed).
  *   **Enhanced Predictive Symmetry:** Predictions now hold consistently across all validated reference frames, a major improvement over v1.x's frame-specific patches.
  *   **New Visualization Suite:** Experience reality through our redesigned conceptual tools – prepare for profound shifts in perception!

  **Breaking Changes:**
  **WARNING:** v2.0 is NOT backward compatible. Expect fundamental shifts in meaning and operation.
  *   **Core Constants Redefined:** Values and interpretations of `G`, `c`, and `h` are fundamentally altered. Direct numerical comparison with v1.x outputs is **undefined**.
  *   **Entity Behavior:** The fundamental laws governing particle motion, energy transfer, and field interactions are rewritten. Objects no longer exhibit `InertialPathPersistance` under all conditions.
  *   **Measurement Semantics:** Operations like `measurePosition()` and `measureVelocity()` now yield inherently linked results. Isolating them (`SimultaneousPrecisionMeasurement`) is now a logical error.
  *   **Causality Framework:** The `LocalCausality` module is deprecated (see below). The new `EventHorizonCausality` model imposes different constraints on signal propagation.

  **Deprecations:**
  The following v1.x concepts have been removed without direct replacements. Their usage patterns are incompatible with v2.0's core architecture:
  *   `LuminiferousAether`: Foundational medium for wave propagation. Obsolete.
  *   `AbsoluteSpace` & `AbsoluteTime`: Independent, universal background containers. Replaced by integrated `SpaceTimeFabric`.
  *   `ObserverIndependentReality`: The assumption that entities possess definite properties independent of measurement. Superseded by contextual state resolution.
  *   `LocalCausality`: Strict requirement that effects cannot propagate faster than `c`. Relaxed within the new `EventHorizonCausality` model.
  *   `DeterministicUniverseClockwork`: Belief in complete, pre-determined state evolution. Now considered an optional plugin (`HiddenVariables.v2beta`) with limited support.

  **Migration Guide:**
  Migrating research programs and conceptual frameworks from v1.x to v2.0 requires a fundamental perspective shift. **Important Note:** Direct translation of v1.x concepts into v2.0 terms is impossible due to terminological and ontological incommensurability.
  1.  **Abandon v1.x Intuitions:** Do not attempt to map v1.x concepts directly. Start fresh with v2.0's core principles.
  2.  **Engage with Documentation:** Study the new paradigm's textbooks, tutorials, and exemplary solved problems (`ThoughtExperiments/` directory).
  3.  **Utilize Training Simulations:** Practice interpreting phenomena *exclusively* through v2.0's conceptual tools (`DoubleSlitSimulator.v2`, `TwinParadoxResolver.v2`).
  4.  **Join the Community:** Attend workshops and collaborate with experienced v2.0 practitioners. **There is no automated migration script. Understanding emerges through practice within the new framework.** (See FAQ: "Why is this guide so vague?").

  **Known Issues:**
  *   **CT-1872 (Legacy - Deferred):** "Mercury Perihelion Precession Mismatch" - Closed. Resolved by v2.0 core refactor.
  *   **CT-2298 (Legacy - Deferred):** "UV Catastrophe in Blackbody Emitter" - Closed. Resolved by v2.0 quantization model.
  *   **CT-3051 (Legacy - Won't Fix):** "Inertial/Gravitational Mass Equivalence Anomaly" - Deemed an architectural limitation of v1.x. Resolved in v2.0.
  *   **CT-2.0-001:** "Quantum-Classical Boundary Ambiguity": Boundary conditions between macro and micro descriptions remain fuzzy. Workaround: Use appropriate domain-specific approximations. Targeted for investigation in v2.1.
  *   **CT-2.0-002:** "Singularity Handling": Core equations exhibit undefined behavior (`divide-by-zero`) at extreme densities. Research ongoing (`QuantumGravity Initiative`).
  *   **ROLLBACK WARNING:** Downgrading to v1.x after experiencing v2.0 is **strongly discouraged and unsupported**. Users report persistent "gestalt locking" – phenomena irrevocably interpreted through v2.0 lenses, making v1.x operation appear nonsensical or like a flawed subset of v2.0 ("It all just looks like rabbits now, even the ducks!").

  **FAQ:**
  *   **Q: How do you know v2.0 is better than v1.x if you say comparisons are undefined?**
      *   A: v2.0 resolves persistent anomalies that v1.x could not address without increasingly complex, inelegant patches. It offers a more coherent, unified, and fruitful framework for ongoing research. "Better" reflects internal consistency and explanatory scope *within* the paradigm.
  *   **Q: What about holdouts still using v1.x?**
      *   A: We respect their choice to maintain legacy systems. Engagement remains open! Migration typically occurs through persuasive demonstration of v2.0's problem-solving efficacy within specific research contexts. Most active development and funding now focus on v2.0. Legacy journals (`v1Quarterly`, `AbsoluteReview`) continue publication for dedicated v1.x maintainers.
  *   **Q: Why is the Migration Guide so vague? Why no direct translation?**
      *   A: v1.x and v2.0 use fundamentally different conceptual vocabularies and ontologies. Concepts in one often lack exact counterparts in the other. Translation isn't a technical hurdle; it's a conceptual impossibility. Mastery requires immersion in the new paradigm. (See Documentation: "Incommensurability & Paradigm Shifts").
  *   **Q: Is v2.0 finally the "True" description of reality?**
      *   A: v2.0 represents our current best, most coherent framework for understanding the universe. It resolves known critical issues in v1.x and provides powerful new tools. Future refinements (v2.1, v3.0?) are expected as research progresses.

  **Contributors:**
  The Paradigm Shift Collective (PSC), with major conceptual refactoring by A. Einstein, foundational insights by M. Planck, N. Bohr, W. Heisenberg, E. Schrödinger, and critical community adoption efforts by the Copenhagen Institute, Göttingen Group, and early Cambridge adopters. Countless graduate students performed essential unit testing and anomaly reproduction. (Note: Historical contributions from v1.x maintainers like Newton and Maxwell have been recontextualized in the updated documentation as essential precursors leading towards v2.0.)

  **Roadmap (v2.1 & Beyond):**
  *   **v2.1 (Target: ~1930s):** Refinement of quantization rules; deeper integration of statistical interpretations; preliminary work on `CT-2.0-001` (Quantum-Classical Boundary).
  *   **v3.0 (Conceptual Planning):** Grand unification of fundamental interactions; resolution of `CT-2.0-002` (Singularity Handling/Quantum Gravity); potential reconciliation with large-scale cosmological structures.
  *   **Long-Term Vision:** Continued optimization for accuracy, scope, and conceptual elegance. We are committed to progressively mapping the complete structure of physical reality through iterative paradigm refinement. Expect regular, significant performance improvements and deeper ontological understanding with each major version! The future is one of cumulative, linear advancement building directly upon v2.0's robust foundation.

  ---
  **Historical Note:** Archived release notes for v1.x (v1.0 Newtonian Mechanics, v1.5 Maxwellian Electrodynamics) have been updated to reflect their transitional status and highlight conceptual developments leading *towards* the v2.0 framework. Access the revised archives via `/legacy/early_drafts`.
