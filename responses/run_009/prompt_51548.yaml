prompt: |-
  I sit on the IT steering committee at a mid-sized hospital, and lately I keep running into the same shape of argument and I can't find a word for it.

  Example one: years ago, before my time, somebody picked our messaging platform and set the default so that every lab-result alert pings everyone on the unit. Nobody chose that policy — the person buying the software probably spent ten seconds on it. But now the notification culture is just how the unit works, and when a nurse asked whether we could change the default she was told she was making things political. Changing it felt like inserting politics into a neutral system; keeping it felt like nothing at all.

  Example two: I half-remember a story about a city planner who had overpasses on a parkway built to low for buses, so that people who couldn't afford cars couldn't get to the beach by transit. Maybe apocryphal, whatever. The interesting part is the same shape: a contingent engineering decision, made for reasons nobody remembers, hardens into the landscape, and by the time anyone notices who it advantages, defending the landscape counts as neutrality and changing it counts as an agenda.

  Example three is smaller: our shift rotations got rearranged around a scheduling algorithm's supposedly neutral optimization function, and the weights in that function were set by an intern three years ago.

  The pattern I'm after isn't just "technology is never neutral," which is a slogan I've heard and which isn't precise enough to do anything with. It's the two-step: a choice that could easily have gone the other way gets buried, and then resurfaces as the neutral default — so the burden of justifcation always lands on whoever wants to change the thing, and never on the thing itself. It's like the artifact gets a presumption of innocence it never earned.

  I know economists talk about path dependence (QWERTY and all that), but that's about efficiency lock-in, and I don't care about efficiency here. It also seems related to whatever social scientists mean when they say an arrangement has been naturalized, but I only half-understand that term and it sounds broader than what I'm pointing at.

  So: is there an actual name for this in whatever field studies it (philosophy of technology? STS? nowhere?)? If there is, I want to know how it's precisely defined and where that differs from what I described, not just the label. If there isn't, coin one for me — give a definition, then stress-test it on the edges: does it still apply when the original choice was deliberate and political rather than contingent? Does it apply to legal defaults, like the age of majority or which side of the road we drive on? Does it stop applying once people remember the history behind the choice?

  I'd like the answer in sections, in this order: "What you're describing" (one short paragraph, plain words), "The nearest concepts" (the bulk of the response — for each one, what it captures and where it misses), "A term, if you're coining one" (definition plus the edge cases above), and "Settled vs. contested" (a short closing bit flagging which parts of what you've said are just agreed on by people who study this stuff and which are live disagreements — please don't smuggle a contested reading in as the consensus, I'd genuinely rather know).
reasoning: |-
  Okay, the user is on an IT steering committee at a hospital and keeps encountering a specific pattern in decision-making. They describe three examples: a messaging platform default that became ingrained, a story about low overpasses excluding bus access, and a scheduling algorithm with arbitrary weights set by an intern. 

  The user has clearly thought deeply about this. They've already ruled out concepts like "technology neutrality" and "path dependence" as insufficient, and they're skeptical about terms like "naturalization." What they really want is precision—a way to name and dissect this two-step process where contingent choices become immutable defaults. 

  Hmm... their rejection of "path dependence" is key here. They're right that it focuses on efficiency lock-in, but their concern is about power dynamics—how the burden of proof shifts to the challenger. The "naturalization" concept from sociology comes closer, but it's too broad. 

  The user's edge cases are telling: they want to know if the term applies even when the original choice was deliberate, or when people remember the history. That suggests they need a framework that accounts for both structural inertia and social perception. 

  For the "nearest concepts" section, I'll need to carefully distinguish:
  - How "technological momentum" captures hardening but misses the burden-shifting aspect
  - Why "normalization" describes social acceptance but not the technical embedding
  - Where "infrastructural inertia" gets the material weight right but not the moral neutrality claim

  Coining a term feels necessary here. "Default Entrenchment" seems to capture both the technical starting point and the subsequent hardening. The definition must emphasize the asymmetry in justification burden—that's the core of what they're observing. 

  On edge cases: 
  - Deliberate origins shouldn't disqualify it—the process is what matters
  - Legal defaults are perfect examples (like driving sides)
  - Historical awareness might weaken but doesn't dissolve the effect 

  For "settled vs contested," I should flag that while the observation of defaults hardening is uncontroversial in STS, the moral/political implications are hotly debated. Some scholars see this as inherently oppressive; others argue all systems require stable defaults. 

  This user would hate vague handwaving—every distinction needs grounding. When explaining "naturalization," I should cite Berger and Luckmann's precise mechanism of "habitualization" becoming institutionalized. And for the coined term, explicitly list which elements are novel combinations versus existing ideas.
answer: |-
  Here's a breakdown addressing your query, structured as requested:

  ### 1. What you're describing
  You're describing a process where an **initially arbitrary or contingent technical/administrative decision becomes embedded in a system over time**. Once embedded, it acquires an aura of **"neutral objectivity"** despite its origins. This creates an asymmetric burden of proof: **challenging the system is seen as introducing "politics" or "agenda," while maintaining the status quo is perceived as preserving neutrality**, even though the system itself embodies an unexamined, historically specific choice.

  ### 2. The nearest concepts
  *   **Path Dependence (Economics/History):**
      *   *Captures:* How early, often contingent choices constrain later options (QWERTY keyboard, VHS vs. Betamax). The system "locks in."
      *   *Misses:* Focuses on efficiency, market dominance, or sunk costs. **Doesn't address the *moral/political* framing shift** where the locked-in state becomes perceived as "neutral" and challenges to it become "political." Your examples highlight the *legitimacy asymmetry*, not just inefficiency.
  *   **Naturalization (Sociology/Cultural Studies - Berger & Luckmann, Bourdieu):**
      *   *Captures:* The core process! How social constructions (rules, roles, systems) become perceived as inevitable, inherent, and objective ("the way things are"), masking their historical origins and contingency. The messaging policy and shift schedule are *naturalized*.
      *   *Misses:* While extremely close, it's a **broad social process** applied to norms, identities, institutions, etc. It doesn't **specifically emphasize the *technical/systemic embedding* and the unique *burden-of-proof asymmetry* arising from it** in the way your examples illustrate. It's the foundational mechanism, but your focus is on a specific *manifestation* within technical systems/administrative defaults.
  *   **Technological Momentum (Hughes - History of Technology):**
      *   *Captures:* How large technological systems, once established, develop inertia. They shape their environment and become harder to change due to embedded physical infrastructure, institutions, and practices.
      *   *Misses:* Focuses on large-scale systems (power grids, railways). While relevant to the overpass example, it's **less precise for software defaults or shift schedules**. It also **doesn't explicitly address the *framing* of the status quo as "neutral" vs. change as "political."** It's about resistance to change, not the rhetorical burden.
  *   **Normalization (Sociology/Foucault):**
      *   *Captures:* How practices or standards become accepted as the norm, against which deviations are measured (often linked to power). The lab-alert policy *normalizes* a specific workflow.
      *   *Misses:* Like naturalization, it's broad. It **doesn't inherently emphasize the *technical artifact* (the default setting, the algorithm weight) as the carrier of the norm or the specific *contingency of its origin*.**
  *   **Infrastructural Inertia / Inscription (STS - Latour, Star):**
      *   *Captures:* How values and assumptions are "inscribed" into technologies and infrastructures during design. These become hard to change later (e.g., the low overpasses *inscribe* a bias against public transit). Infrastructures resist change.
      *   *Misses:* Excellent on the embedding process! However, it **doesn't fully foreground the subsequent *rhetorical shift*** where maintaining the inscribed system is labeled "neutral" and changing it is labeled "political." It describes *how* the bias gets built-in, but less explicitly the *asymmetric justification burden* that emerges later.

  ### 3. A term: Default Entrenchment
  *   **Definition:** **Default Entrenchment** describes the socio-technical process whereby:
      1.  An **initially contingent, arbitrary, or minimally considered choice** (often a technical default, administrative setting, design parameter, or procedural rule) is implemented within a system.
      2.  Over time, this choice becomes **deeply embedded** within operational practices, cultural norms, and physical/digital infrastructure ("entrenchment").
      3.  As a result of this entrenchment, the system embodying the choice **acquires a perceived status of neutrality, objectivity, or inevitability**.
      4.  This perception creates an **asymmetric burden of justification**: Maintaining the entrenched default is seen as requiring no justification (preserving neutrality), while any proposal to change it is framed as introducing "politics," "agenda," or unnecessary disruption, placing the *entire burden of proof* on the challenger.
  *   **Stress-Testing the Edges:**
      *   **Deliberate & Political Origin:** *Applies.* The key is the *perception shift*. Even if the original choice *was* political (e.g., the low overpasses *were* deliberately exclusionary), once entrenched and perceived as "just the way things are," the *defense* of it often adopts the cloak of neutrality ("it's engineering necessity," "it's the existing infrastructure"). The *process* of entrenchment and the resulting burden asymmetry still occur.
      *   **Legal Defaults:** *Applies perfectly.* The default rule (age of majority, driving side, inheritance rules) starts as a contingent choice. Once entrenched in law and practice, changing it requires significant justification ("disruption," "tradition"), while maintaining it is seen as upholding the neutral legal order. The burden is squarely on reformers.
      *   **Historical Awareness:** *Weakens but doesn't eliminate.* If the contingent origin and its consequences are widely known and actively debated, the "neutrality cloak" is harder to maintain. However, the **entrenchment inertia and the practical burden of change often remain significant.** Defenders might shift arguments ("it's too expensive to change," "people are used to it"), but the *asymmetric burden* on the changer persists unless the historical awareness fundamentally delegitimizes the default. The *rhetorical* neutrality claim fades, but the *practical* burden asymmetry often lingers.

  ### 4. Settled vs. Contested
  *   **Settled (Widely Accepted):**
      *   Technology/systems are not neutral; they embody values and choices (STS core tenet).
      *   Social constructions (rules, norms, systems) can become naturalized/normalized, appearing inevitable (Sociology).
      *   Early technical/design choices can create path dependence and lock-in (Economics/History of Tech).
      *   Infrastructures and large technical systems develop inertia and resist change (STS/History of Tech).
      *   Defaults in law, tech, and policy have powerful effects in shaping behavior (Law & Economics, STS).
  *   **Contested/Live Disagreements:**
      *   **The Specific Mechanism & Label:** While the *components* (naturalization, inscription, inertia) are established, articulating *this specific two-step socio-technical process with its burden asymmetry* as "Default Entrenchment" is a synthesis. Scholars might debate the precise boundaries or the best label, though the *phenomenon* is readily observable.
      *   **Intent vs. Effect:** The degree to which the *original intent* (contingent vs. deliberate) matters for the *ongoing legitimacy* of the default is debated. Some focus on the outcome/effect (the entrenchment and burden), others emphasize uncovering original intent.
      *   **Overcoming Entrenchment:** The best strategies for challenging entrenched defaults are highly contested (e.g., incremental change vs. radical overhaul, focusing on inefficiency vs. injustice, technical fixes vs. cultural shifts).
      *   **"Neutrality" Claims:** While STS scholars broadly reject the idea of true neutrality in systems, the *rhetorical power* of claiming neutrality for the status quo and labeling change as "political" is a core part of political and organizational power dynamics that is constantly being navigated and contested. *How* this framing succeeds or fails is a live area of study.

  **In essence:** You've precisely identified a powerful mechanism – **Default Entrenchment** – where the mundane act of setting a default, combined with time and system integration, transforms a potentially arbitrary choice into an apparently neutral baseline, strategically shifting the entire burden of justification onto those seeking change. The *components* of this process are well-studied, but your synthesis highlights the crucial *burden asymmetry* that arises specifically from the embedding of contingent choices into operational systems.
