prompt: |-
  I run the tutorial programme for a second-year applied ethics course, and I want a decision-tree handout that sorts students into a position on the nonidentity problem before they have met any of the labels. The tree should start from a single entry point — a depletion policy that predictably lowers the quality of future people's lives, where those people will exist only because the policy was adopted — and branch only on questions a student can answer from her own reactions to cases, never from terminology. At least five and at most seven branch questions, none of which may use the phrase 'nonidentity' or any position's name; at least three of them must concern whether the student's objection requires comparing the person's life with a counterfactual in which she does not exist, whether a wrong needs an identifiable victim who is worse off, and whether the person-affecting intuition — that morality is about making people better off — is worth keeping at any price. The tree must route students through at least these diagnostic cases along the way: the depletion case itself; a risky nuclear-waste policy that foreseeably damages the lives of later people who would not have existed without the policy; a couple using IVF who can select either an embryo certain to have a lifelong but manageable impairment or one certain not to, where both resulting children would have lives worth living; and a case of historical injustice that is the condition of the victims' descendants existing at all. Build the tree from the logical space first and only then locate named views in it: the leaves should include impersonal consequentialism, a counterfactual-comparison view, a contractualist or 'wronging without harming' view, a rights-based view on which a person can be wronged by the very conditions of her origin, and a debunking view on which the relevant intuitions are a tracking error. Note any branch combinations no leaf occupies, and say for each whether it is incoherent, unattractive or merely unexplored; also flag any pair of leaves the tree cannot genuinely separate. Please write in British English, in three sections in this order: 'The branch questions and why they cut' (roughly 400 words), 'The tree' (an indented outline or diagram, any length), and 'Leaves, gaps and indistinguishable pairs' (roughly 300 words).
reasoning: |-
  Hmm, the user wants a decision-tree handout for an applied ethics course on the nonidentity problem. They're designing a tutorial program for second-year students and need a tool that sorts students into philosophical positions based on their intuitive reactions to cases, without using any technical terminology upfront. 

  The constraints are quite specific: it must start from a depletion policy case, include 5-7 branch questions, cover at least three mandatory diagnostic questions (counterfactual comparisons, identifiable victims, person-affecting intuition), and route through four key cases including IVF selection and historical injustice. The output leaves need to map to five named positions while flagging gaps and indistinguishable pairs.

  I notice the user is deeply familiar with the nonidentity literature - they're using precise technical terms like "person-affecting intuition" and "impersonal consequentialism" in the request. This suggests they'll spot if I misrepresent any positions. The emphasis on avoiding jargon until the end tells me they want students to engage with raw intuitions before theory.

  The core challenge is building a logically coherent tree that:
  - Genuinely separates the target positions
  - Forces students to confront the tension between "wronging" and "harming"
  - Captures how different cases stress-test intuitions differently (e.g., the IVF case exposes inconsistencies in strict person-affecting views)

  For the branch questions, I'll need to frame them as neutral yes/no choices about case reactions. Question 3 is tricky - asking whether morality is "about making people better off" risks oversimplifying, but the person-affecting intuition does anchor that way in the literature. I'll use "requires" rather than "is about" to soften it.

  The historical injustice case is particularly interesting - it might provoke different reactions than the depletion case despite similar structure. Some students might accept the depletion policy but balk at excusing historical wrongs, which could reveal tension between their abstract principles and emotional responses. That's pedagogically valuable.

  For gaps in the tree: The "no" path on Q5 (discarding person-affecting intuition) but "yes" on Q6 (wronging requires harming) seems incoherent - if you abandon person-affecting, why retain harm as necessary for wronging? The unexplored gap (all "no" except Q4) might interest advanced students as a project space.

  The indistinguishable pair problem between contractualism and rights-based views is unavoidable - both reject counterfactual comparisons but for different reasons. That's actually a teaching opportunity: the tree forces students to confront that different justifications can lead to similar case judgments.
answer: |-
  ## Decision Tree for Applied Ethics: Policy Choices and Future Generations

  **The branch questions and why they cut**

  This decision tree helps you map your intuitive reactions to complex cases where a policy or choice predictably creates future people with lower quality lives than *could* have existed, but where those specific people wouldn't exist at all without that choice. We avoid technical terms initially. The questions probe core tensions:

  1.  **Does the objection feel strongest because we *know* specific future people will suffer due to the policy?** (e.g., radiation sickness in the nuclear waste case). This tests if your concern depends on identifiable victims experiencing harm, or if the *kind* of life created is the issue regardless of who lives it.
  2.  **Does the objection rely on comparing the person's actual life to a life *they* could have had?** This targets the core nonidentity dilemma: the alternative is non-existence. If "Yes", your view likely requires counterfactuals where the *same* person is better off. If "No", you might be comparing to different possible people or judging the life created *itself* as problematic.
  3.  **Is it fundamental that morality requires making people better off than they *otherwise would be*?** This probes commitment to the "person-affecting intuition" – the idea that ethics is fundamentally about benefiting or avoiding harm to *particular* individuals.
  4.  **Can a person be wronged by the very conditions that brought them into existence?** (e.g., the depleted world, or being conceived from historical injustice). This questions whether harm relative to non-existence is necessary for wronging, or if certain origins themselves constitute a wrong, regardless of life-worth-living.
  5.  **Is the core intuition (that the choice is wrong) so strong it should be kept even if it conflicts with the principle in Q3?** This forces a choice: if Q3 feels central ("morality requires making people better off"), but your intuition says the depletion/historical injustice/IVF choice *is* wrong (despite not making anyone worse off than they could be), are you willing to abandon or modify Q3 to preserve the intuition?
  6.  **Does the wrongness of the choice *depend* on it making specific people worse off than they would otherwise have been?** This final question directly tests whether "harming" (making worse off) is a necessary condition for an act to be "wrong" in these cases. A "No" opens the door to wronging without harming.

  **The Tree**

  Start: Consider Policy D (Depletion): We adopt a policy using resources now, knowing it will leave future generations with a lower quality of life (but still worth living). Crucially, *only* because we adopt this policy do these specific future people exist. Alternative policies would have created different, better-off people.

  1.  **Is your primary objection that we *know* specific, identifiable future people will be negatively affected?**
      *   **Yes** --> Go to 2.
      *   **No** (The objection is more about the *type* of life created, regardless of who lives it) --> Go to 3.

  2.  **Does this objection rely on comparing the actual life of these specific people to a life *they* could have had?**
      *   **Yes** --> Go to 6.
      *   **No** (The comparison feels different, perhaps to lives other people *could* have had, or the life is just bad in itself) --> Go to 4.

  3.  **Is it fundamental that morality requires making people better off than they *otherwise would be*?** (Person-affecting core)
      *   **Yes** --> Go to 5.
      *   **No** --> **Leaf: Impersonal Consequentialism** (Judges the choice based on the overall quality of the world/outcome, regardless of who exists. The depleted world is worse than the alternative world with different, better-off people.)

  4.  **Can a person be wronged by the very conditions that brought them into existence?** (e.g., being born into the depleted world, or being a descendant of historical injustice victims whose existence depended on that injustice)
      *   **Yes** --> **Leaf: Rights-Based View** (Future people have rights (e.g., to a sufficient environment, to not be created with severe impairments) that are violated by the choice bringing them into existence under those deprived or impaired conditions, even if life is worth living and they wouldn't otherwise exist.)
      *   **No** --> **Leaf: Debunking View** (The intuition that the choice is wrong is mistaken. It arises from a psychological error – confusing the badness of the *state of affairs* (low quality of life) with a wrong done *to* the person. Since the person isn't worse off than they could be, no wrong occurs.)

  5.  **Is the intuition that Policy D (and cases like Nuclear Waste, Historical Injustice, IVF selection of impairment) is wrong so strong it should be kept, even if it conflicts with the principle above (morality requires making people better off)?**
      *   **Yes** (The intuition must be preserved) --> Go to 4. (Now ask if they can be wronged by origin.)
      *   **No** (The principle in Q3 is more important; if no one is made worse off, it's not wrong) --> Go to 6.

  6.  **Does the wrongness of the choice *depend* on it making specific people worse off than they would otherwise have been?**
      *   **Yes** --> **Leaf: Counterfactual-Comparison View** (An act is wrong only if it makes some specific person worse off than they would have been otherwise. Policy D isn't wrong because the future people wouldn't exist otherwise. *Applies consistently to all cases.*)
      *   **No** (A wrong can occur without making someone worse off) --> **Leaf: Contractualist / 'Wronging Without Harming' View** (The choice violates a moral principle (e.g., against creating persons with certain severe impairments, against imposing grave risks on others without consent) that we owe to others, even if it doesn't make those specific individuals worse off. Wronging ≠ Harming.)

  **Leaves, gaps and indistinguishable pairs**

  *   **Leaves:** The tree identifies five distinct positions:
      1.  **Impersonal Consequentialism:** (Q1=No, Q3=No) Wrongness stems from creating a worse world-state.
      2.  **Rights-Based View:** (Q1=Yes, Q2=No, Q4=Yes) OR (Q1=No, Q3=Yes, Q5=Yes, Q4=Yes) Wrongness stems from violating rights inherent to the person created under those conditions.
      3.  **Debunking View:** (Q1=Yes, Q2=No, Q4=No) OR (Q1=No, Q3=Yes, Q5=Yes, Q4=No) Intuitions of wrongness are erroneous; no wrong occurs without harm.
      4.  **Counterfactual-Comparison View:** (Q1=Yes, Q2=Yes, Q6=Yes) OR (Q1=No, Q3=Yes, Q5=No, Q6=Yes) Wrongness requires making a specific person worse off.
      5.  **Contractualist / 'Wronging Without Harming' View:** (Q1=Yes, Q2=Yes, Q6=No) Wrongness stems from violating impartial moral principles owed to others, regardless of comparative harm.

  *   **Gaps:**
      *   **Path: Q1=Yes, Q2=No, Q4= [Not Reached]:** The tree forces Q4 after Q2=No. This is logical as Q4 is the critical follow-up to rejecting counterfactual comparison while focusing on identifiable victims (Q1=Yes).
      *   **Path: Q1=No, Q3=Yes, Q5=No:** Leads to Q6. This is covered (Counterfactual View).
      *   **Path: Q1=No, Q3=Yes, Q5=Yes:** Leads to Q4. This is covered (Rights or Debunking).
      *   **Potential Gap Combination: Q1=No, Q3=No, Q6=Yes:** This path doesn't occur because Q3=No goes straight to Impersonal Consequentialism (Leaf). This gap is **unexplored but potentially incoherent**: Impersonal views typically don't require making specific individuals worse off (Q6=Yes contradicts the impersonal focus on states of affairs).
      *   **Potential Gap Combination: Q1=Yes, Q2=Yes, Q6= [Not Asked]:** The tree forces Q6 after Q2=Yes. This is necessary to distinguish Counterfactual (Q6=Yes) from Contractualist (Q6=No).

  *   **Indistinguishable Pairs:**
      *   **Rights-Based View vs. Contractualist View on the Tree:** The tree *can* separate them via the path taken (Rights often via Q4=Yes; Contractualist via Q6=No). However, **in practice, their final judgments on the core cases might often align** (both find Policy D/etc. wrong). The tree routes students differently based on *why* they think it's wrong (violation of rights vs. violation of a general principle), but without further probing, a student landing on either leaf might simply agree the act is wrong without fully grasping the distinct justification. The tree provides the *structural* separation, but the *conceptual* distinction between "rights violation" and "principle violation" might require explicit discussion later. They are not *genuinely indistinguishable* in logical space, but their practical implications in these cases might be hard for students to differentiate based solely on the tree's outputs.
