  **Corrected Nash computation**:  
  - At \(u_A = 600\), \(u_B = 1200 - 0.2 \times 600 = 1080\), but is this on the frontier?  
    - From \(u_B = 1200 - 0.2u_A\) for \(u_A \in [200, 600]\), yes.  
