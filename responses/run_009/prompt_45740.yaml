  - At \(u_A = 600\):  
    - \(p = 1\), \(q = 0\)  
    - Alice: 600, Bob: 1200 - 300 - 0 = 900  
    - \(u_B = 1200 - 0.5 \times 600 = 900\), matches.  

  **Corrected frontier**:  
  \[
  u_B = 1200 - 0.5u_A \quad \text{for} \quad u_A \in [200, 600]
  \]  
  - At \(u_A = 200\), \(u_B = 1100\); at \(u_A = 600\), \(u_B = 900\).  
  - Disagreement \(d = (500, 500)\), so feasible gains: \(u_A \geq 500\), \(u_B \geq 500\).  
    - At \(u_A = 500\), \(u_B = 1200 - 0.5 \times 500 = 950 \geq 500\)  
    - At \(u_A = 600\), \(u_B = 900 \geq 500\)  

  #### 1. Nash Solution
  Maximize \((u_A - 500)(u_B - 500)\) with \(u_B = 1200 - 0.5u_A\):  
  \[
  \text{Product} = (u_A - 500)(1200 - 0.5u_A - 500) = (u_A - 500)(700 - 0.5u_A)
  \]  
  \[
  = 700u_A - 0.5u_A^2 - 350,000 + 250u_A = -0.5u_A^2 + 950u_A - 350,000
  \]  
  Derivative:  
  \[
  -1.0u_A + 950 = 0 \quad \Rightarrow \quad u_A = 950
  \]  
  But \(u_A = 950 > 600\) not in \([500, 600]\). Evaluate endpoints:  
  - \(u_A = 500\): \((0)(700 - 250) = 0\)  
  - \(u_A = 600\): \( (600-500)(700 - 300) = 100 \times 400 = 40,000 \)  
  Nash solution: \((u_A^N, u_B^N) = (600, 900)\).  

  #### 2. Kalai–Smorodinsky Solution
  Ideal gains:  
  - Alice: \(700 - 500 = 200\)  
  - Bob: \(1200 - 500 = 700\)  
  Solve:  
  \[
  \frac{u_A - 500}{200} = \frac{u_B - 500}{700}, \quad u_B = 1200 - 0.5u_A
  \]  
  Substitute:  
  \[
  \frac{u_A - 500}{200} = \frac{(1200 - 0.5u_A) - 500}{700} = \frac{700 - 0.5u_A}{700}
  \]  
  \[
  700(u_A - 500) = 200(700 - 0.5u_A)
  \]  
  \[
  700u_A - 350,000 = 140,000 - 100u_A
  \]  
  \[
  800u_A = 490,000 \quad \Rightarrow \quad u_A = 612.5
  \]  
  But \(u_A = 612.5 > 600\) not feasible. Use highest feasible \(u_A = 600\):  
  \[
  u_B = 1200 - 0.5 \times 600 = 900
  \]  
  Gain fractions:  
  - Alice: \((600 - 500)/200 = 100/200 = 0.5\)  
  - Bob: \((900 - 500)/700 = 400/700 \approx 0.571\)  
  Not equal, but K-S requires the frontier point where fractions are equal. Since \(u_A = 600\) is the maximum, and fractions are unequal, we use the next best.  

  **K-S on the frontier**: The solution is the point where the ray from \(d\) through the ideal point intersects the frontier.  
  - Ray: \(\frac{u_A - 500}{200} = \frac{u_B - 500}{700}\)  
  - Frontier: \(u_B = 1200 - 0.5u_A\) for \(u_A \in [500, 600]\)  
  - Solve:  
    \[
    700(u_A - 500) = 200(1200 - 0.5u_A - 500)
    \]  
    \[
    700u_A - 350,000 = 200(700 - 0.5u_A) = 140,000 - 100u_A
    \]  
    \[
    700u_A + 100u_A = 140,000 + 350,000
    \]  
    \[
    800u_A = 490,000 \quad \Rightarrow \quad u_A = 612.5
    \]  
    Not feasible. The highest feasible \(u_A\) is 600.  
    At \(u_A = 600\), \(u_B = 900\).  
    Gain fractions: Alice = 0.5, Bob ≈ 0.571 > 0.5.  
    To equalize fractions, reduce Bob's gain, but that would require decreasing \(u_A\) below 600, where Alice's fraction decreases faster.  
    The K-S solution is the last feasible point where Bob's fraction is at least Alice's, which is \((600, 900)\).  

  **Both solutions coincide**: \((600, 900)\).  

