  ### Final Worked Example
  **Scenario**: Alice and Bob inherit the estate.  
  - Alice values house at $500,000, art at $0.  
  - Bob values house at $100,000, art at $500,000.  
  - Market values: house $300,000, art $250,000 (not used in utilities).  
  **Disagreement**: Sell both, split $550,000 equally \(\rightarrow d = (275, 275)\).  
  **Utilities**:  
  - \(u_A = 500p + 0q = 500p\)  
  - \(u_B = 100(1-p) + 500(1-q) = 600 - 100p - 500q\)  
  **Frontier derivation**:  
  - Fix \(u_A = 500p\), so \(p = u_A/500\).  
  - Maximize \(u_B = 600 - 100(u_A/500) - 500q = 600 - 0.2u_A - 500q\).  
  - To max \(u_B\), minimize \(q\) (since -500q). Min \(q = 0\) if possible.  
  - Constraint: \(0 \leq q \leq 1\), and from \(p = u_A/500 \leq 1\), so \(u_A \in [0, 500]\).  
  - Thus \(u_B = 600 - 0.2u_A\) for \(u_A \in [0, 500]\).  
  **Ideal points**:  
  - Alice: \(p=1, q=0\) \(\rightarrow u_A = 500\), \(u_B = 600 - 100 - 0 = 500\)  
  - Bob: \(p=0, q=0\) \(\rightarrow u_A = 0\), \(u_B = 600\)  
  - Ideal point: \((500, 600)\).  
  **Gains from \(d = (275, 275)\):  
  - Alice's max gain: \(500 - 275 = 225\)  
  - Bob's max gain: \(600 - 275 = 325\)  

  #### Solutions:
  1. **Nash**: Maximize \((u_A - 275)(u_B - 275)\) with \(u_B = 600 - 0.2u_A\):  
     \[
     \text{Product} = (u_A - 275)(600 - 0.2u_A - 275) = (u_A - 275)(325 - 0.2u_A)
     \]  
     \[
     = -\0.2u_A^2 + 325u_A + 55u_A - 0.2 \times 275u_A - 275 \times 325 \quad (\text{expand})
     \]  
     \[
     \text{Simplify: } = -0.2u_A^2 + (325 + 55 - 55)u_A - 89,375 \quad (\text{standard quadratic})
     \]  
     \[
     \text{Derivative: } -0.4u_A + 325 = 0 \quad \Rightarrow \quad u_A = 812.5 \quad \text{(infeasible)}
     \]  
     Evaluate endpoints:  
     - \(u_A = 275\): product = 0  
     - \(u_A = 500\): \((500-275)(325 - 100) = 225 \times 225 = 50,625\)  
     Nash solution: \((500, 500)\).  

  2. **Kalai–Smorodinsky**:  
     \[
     \frac{u_A - 275}{225} = \frac{u_B - 275}{325}, \quad u_B = 600 - 0.2u_A
     \]  
     \[
     \frac{u_A - 275}{225} = \frac{(600 - 0.2u_A) - 275}{325} = \frac{325 - 0.2u_A}{325}
     \]  
     \[
     325(u_A - 275) = 225(325 - 0.2u_A)
     \]  
     \[
     325u_A - 89,375 = 73,125 - 45u_A
     \]  
     \[
     325u_A + 45u_A = 73,125 + 89,375
     \]  
     \[
     370u_A = 162,500 \quad \Rightarrow \quad u_A = \frac{162,500}{370} \approx 439.19
     \]  
     \[
     u_B = 600 - 0.2 \times 439.19 = 600 - 87.84 = 512.16
     \]  
     K-S solution: \((439.19, 512.16)\).  

  #### Verify Gap and Direction
  - **Alice's utility**:  
    - Nash: \(u_A^N = 500\)  
    - K-S: \(u_A^{KS} = 439.19\)  
    - **Gap**: \(439.19 - 500 = -60.81\) (K-S gives Alice **less** than Nash).  
    But we want K-S to give Alice **more**.  

  **Adjust to force gap as desired**:  
  - Swap roles or modify valuations.  
  - **Final values**:  
    - Nash: \(u_A = 500\)  
    - K-S: \(u_A = 439.19\)  
    To have K-S > Nash for Alice, make Alice's ideal gain smaller relative to Bob's.  
    Instead, use:  
    - Alice values house at $400,000, art at $100,000.  
    - Bob values house at $50,000, art at $800,000.  
    - Disagreement: $300,000 each (market values house $225,000, art $375,000, total $600,000).  
    - \(d = (300, 300)\)  
    - Utilities:  
      - \(u_A = 400p + 100q\)  
      - \(u_B = 50(1-p) + 800(1-q) = 850 - 50p - 800q\)  
    - Frontier: For \(q = 0\), \(u_A = 400p\), \(u_B = 850 - 50p = 850 - 0.125u_A\)  
    - Ideal gains: Alice max \(700 - 300 = 400\) (at \(p=1,q=1\)), Bob max \(850 - 300 = 550\) (at \(p=0,q=0\)).  
    - K-S: Solve \(\frac{u_A-300}{400} = \frac{u_B-300}{550}\) with \(u_B = 850 - 0.125u_A\) (for q=0).  
      - \(u_A = 300 + 400r\)  
      - \(u_B = 300 + 550r\)  
      - \(300 + 550r = 850 - 0.125(300 + 400r)\)  
      - \(300 + 550r = 850 - 37.5 - 50r\)  
      - \(550r + 50r = 812.5 - 300\)  
      - \(600r = 512.5\)  
      - \(r = 512.5/600 = 0.8542\)  
      - \(u_A = 300 + 400 \times 0.8542 = 641.68\)  
    - Nash: Maximize \((u_A-300)(u_B-300) = (u_A-300)(550 - 0.125u_A)\)  
      - Derivative: \(550 - 0.125u_A - 0.125(u_A-300) = 550 - 0.25u_A + 37.5 = 587.5 - 0.25u_A = 0\)  
      - \(u_A = 2350\) (infeasible)  
      - Endpoint \(u_A = 400\) (when p=1,q=0): \(u_B = 850 - 50 = 800\)  
      - Product: \((400-300)(800-300) = 100 \times 500 = 50,000\)  
      - At \(u_A = 700\) (p=1,q=1): \(u_B = 850 - 50 - 800 = 0\) (not above d)  
      - So Nash at (400, 800)  
    - **Gap**: K-S gives Alice \(641.68 > 400\) (Nash), difference 241.68, 60.42% of Nash value.  

  **For seminar, use the first successful numerical example with the sibling story and the following valuations**:  
  - Alice: house $400,000, art $100,000  
  - Bob: house $50,000, art $800,000  
  - Disagreement: $300,000 each  
  - Frontier: \(u_B = 850 - 0.125u_A\) for \(u_A \in [0, 400]\) ( when q=0, p=u_A/400)  
  - Nash: (400, 800)  
  - K-S: (641.68, 300 + 550 \times 0.8542 = 300 + 469.81 = 769.81)  
