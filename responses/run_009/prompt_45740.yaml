    Inconsistency: frontier says \(u_B = 1080\), direct calculation gives 900.  

  **Final corrected utilities**:  
  - From frontier derivation:  
    For \(u_A \in [200, 600]\), \(u_B = 1200 - 0.2u_A\) (with \(p = u_A/600\), \(q = 0\)).  
    - At \(u_A = 600\), \(p = 600/600 = 1\), \(q = 0\):  
