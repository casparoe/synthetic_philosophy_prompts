  **Correct frontier derivation**:  
  - For \(u_A \in [200, 600]\):  
    - \(p = \frac{u_A}{600}\) (then q=0)  
    - Then \(u_B = 1200 - 300 \times \frac{u_A}{600} - 900 \times 0 = 1200 - 0.5u_A\)  
