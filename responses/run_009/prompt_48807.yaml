  Full design:

  Mechanics:
  - Envelopes: for each driver, two identical envelopes, one for each intersection. The envelopes contain a card that says: "You are at an intersection. Choose: EXIT or CONTINUE." 
  - Decision-makers: randomly assigned per envelope, without knowing which intersection it is.
  - Reward: each decision-maker involved in a driver gets candy equal to the driver's final payoff.

  Variant with pre-commitment: 
  - Planning committees set a probability p for their driver. 
  - Then, decision-makers use a die roll to implement p.

  Spectator role: 
  - Spectators are told the node after the decision and can comment on what advice they would have given.

  Debrief focus:
  - The gap between the pre-commitment optimum (p=2/3) and the likely behavior in Round 1 (where decision-makers may choose a q that is not optimal, or may choose differently at the two nodes).
  - The reasoning from inside: "I don't know which node I'm at, so I should choose the same action at both. And I want to maximize the overall payoff. So I choose to continue with probability q. Then the expected payoff is ..." (that's the pre-commitment reasoning). But in Round 1, they are not forced to pre-commit, so they might choose a different q at each node? But the situation is identical, so likely the same q.
  - The spectator's advice: conditionally optimal but not feasible without knowing the node.

  What cannot be reproduced:
  - The true subjective experience of forgetting. We have to rely on the identical information to simulate it.

  Predicted problems and handling:
  1. Tally marks: we avoid by having each decision-maker only do one envelope per driver and no memory of previous drivers (we hope).
  2. Collusion: we assign randomly and without replacement, so they can't coordinate.
  3. Confusion about payoffs: explain clearly that each decision-maker gets the driver's final payoff, regardless of their choice, but their choice affects that payoff.
  4. In Round 2, the planners might not choose p=2/3. We can note that in the debrief.

  This should work for a 75-minute session.
answer: |-
  **Committee per node with isolated decision-makers.** Assign each driver to a committee of two students: one for the first intersection (Node 1) and one for the second (Node 2). Node 1 decides first without consulting Node 2. If they continue, Node 2 decides *without knowing Node 1's choice or outcome*. This isolates memory: Node 2 knows the driver passed an intersection but not which one, simulating absent-mindedness while preventing direct history recall. Rewards are candy equal to the driver's final payoff for both committee members (e.g., 4 each if exit at second intersection), aligning incentives with the driver's success.

  ### Full Design
  **Participants & Roles (18 students):**
  - **6 drivers** (each as a committee of 2: Node 1 and Node 2).
  - **6 spectators** (observe and advise).
  - **6 backups** (handle randomization or replace no-shows; can join spectators).
  - *Rotate roles if needed between rounds.*

  **Materials:**
  - Candy (e.g., small chocolates) for payoffs.
  - Dice (d6) for pre-commitment round.
  - Whiteboard to track decisions/payoffs.
  - "Decision cards" for intersections (identical, labeled only "EXIT" or "CONTINUE").

  **Procedure (75 mins):**
  1. **Intro (5 mins):**  
     - Recap payoffs: Exit at Node 1 = 0, Node 2 = 4, Continue to home = 1.  
     - Explain roles: Committees make isolated decisions; spectators see the true node and advise; rewards are candy.

  2. **Round 1: Fresh Decisions (25 mins)**  
     - Each driver committee (Node 1 and Node 2) separates. Node 1 decides first.  
     - **Node 1:** Chooses EXIT or CONTINUE. If EXIT, driver ends, payoff = 0.  
     - **If CONTINUE:** Node 2 decides *without knowing Node 1's choice*. They are told: "You’re at an intersection. It could be Node 1 or 2, and someone else decided at the other node." Node 2 chooses EXIT or CONTINUE.  
       - EXIT: Payoff = 4.  
       - CONTINUE: Payoff = 1.  
     - **Spectator role:** Before each decision, whisper the true node (Node 1 or 2) to spectators. They shout advice (e.g., "EXIT NOW!"). Decision-makers hear but can ignore.  
     - Record choices/payoffs on board. Distribute candy: Both committee members get the driver’s final payoff (e.g., 4 candies each for payoff 4).

  3. **Round 2: Pre-Commitment (20 mins)**  
     - Committees calibrate a *randomization threshold* for their driver (e.g., "CONTINUE if die ≤ 4").  
     - Node 1 and Node 2 *must* use this threshold when deciding.  
     - Repeat the decision process: Node 1 rolls die, applies threshold. If CONTINUE, Node 2 rolls *a fresh die* and applies the same threshold.  
     - Spectators advise as before. Committees earn candy based on driver’s payoff.

  4. **Debrief (25 mins):**  
     - **Planning vs. action gap:** Contrast Round 2 (planning-optimal ≈ p=2/3) with Round 1 (action-optimal). Highlight tension: In Round 1, Node 2 feels "I might be at Node 1—should I EXIT to avoid 0?" despite pre-commitment favoring CONTINUE at p=2/3.  
     - **"Both nodes at once" reasoning:** Solicit input. Likely, a student argues: "Since I don’t know the node, I’m choosing for both." Diagnose: Correct for pre-commitment (global view) but myopic if used in Round 1 (ignores sequential stakes).  
     - **Spectator insight:** Note their advice shifts (EXIT at Node 1 is bad policy but locally tempting; CONTINUE at Node 2 is locally optimal but suboptimal ex ante).  
     - **Formal tie-in:** Map moments to:  
       - Optimal plan: p=2/3 in pre-commitment (expected 4/3).  
       - Action bias: Fresh decisions often over-EXIT at Node 2 due to fear of being at Node 1.  
       - Absent-mindedness: Node 2’s valid ignorance creates decision paralysis.

  ### Predictable Issues & Fixes
  - **Tally marks/history tracking:** Node 2 committees are physically separated and told not to discuss. If cheating occurs, void payoff and explain: "Memory breaks the problem—imagine you’re disoriented."  
  - **Econ students colluding:** Assign random driver committees. If collusion across groups, restate: "Your driver only benefits from their own payoff."  
  - **Confusion on roles:** Brief clearly. Use a demo driver first.  
  - **Spectator noise:** Allow shouts only *before* decisions. If overwhelming, pause and ask: "Why might the driver ignore this locally good advice?"  

  ### Unreproducible Element & Workaround
  **True ignorance of node history.** In-class committees know they’re Node 2 (so driver passed *an* intersection), but not *which one*. Real absent-mindedness requires forgetting even this. Workaround: Stress in debrief that Node 2’s uncertainty ("Am I at Node 1 or 2?") is approximated by identical decision contexts, but true amnesia is philosophical. Use this gap to discuss why the problem strains standard rationality. 

  **Why it works:** Committees isolate node-specific decisions without artificial amnesia, preserving the payoff tension. Pre-commitment highlights optimality vs. myopia, and spectators model omniscient advisors. Candy incentives mirror real stakes without bias.
