answer: |-
  Here's a toast weaving your sister's "spare tyre" theory into a celebration of her and her wife, designed for warmth, inclusivity, and a touch of intellectual sparkle without becoming a lecture. Constitutional details are flagged for verification at the end.

  ---

  **(Clink glass gently)**

  Family, friends, distinguished scholars, and those who just heard the word "Bagehot" and thought 'ooh, cake!'... thank you all for being here on this absolutely wonderful day to celebrate [Sister's Name] and [Wife's Name].

  Looking at my brilliant sister, [Sister's Name], standing here radiating happiness… it’s a long way from the days she used to lecture me about Magna Carta over breakfast! Her career, as many of you know, hasn't exactly been… conventional. While most people worry about the price of petrol or the football scores, [Sister's Name] spends her days deep in the fascinating, intricate worlds of constitutional monarchies. Specifically, how three very different nations – the UK, Sweden, and Japan – handle this curious idea: having a Head of State whose main qualification was being born into the job.

  Now, [Sister's Name] has this theory – her beloved "spare tyre" theory – that she’s polished over years of study. She argues that in these modern systems, the monarchy, stripped of real political power, isn't useless baggage. Far from it! It’s more like… well, the spare tyre in the boot of your car.

  Think about it. Day after day, year after year, that spare tyre just sits there. Takes up space. You might forget it exists. It looks a bit pointless next to the shiny wheels actually doing the driving. You might even grumble about the weight or the cost. *[Optional: Gentle nod towards the Danish contingent]* Some might even think the *whole car* would be better off without it!

  But then… there’s that night. Maybe it’s pouring rain. Maybe you're miles from anywhere. And suddenly, you have a blowout. Chaos! What you need, desperately, in that moment of crisis, isn't another driver trying to grab the wheel. What you need is something stable, reliable, *neutral*, and recognisable to everyone involved – something with inherent dignity – to calmly help get things moving again. To ask someone sensible to try and form a government, or to symbolise the continuity of the nation when politics gets messy. That’s when the spare tyre, quietly waiting in the boot all this time, becomes absolutely vital. It provides stability precisely *because* it isn't trying to steer the car every day.

  She sees this elegant solution playing out in her chosen trio: The UK Monarch stepping in during hung parliaments. The Swedish King, whose formal duties were consciously removed, remaining a powerful symbol of unity. The Japanese Emperor, constitutionally defined as the "symbol of the State and of the unity of the People," embodying tradition without governing. The dignity without the power – the spare tyre, ready just in case.

  Now, why am I telling you all this at a *wedding*? Well, firstly, because I’m incredibly proud of my sister’s sharp mind and the unique lens through which she views the world. But secondly, and much more importantly, because looking at [Sister's Name] and [Wife's Name] today, I see something truly beautiful that resonates with that idea.

  [Sister's Name] found her perfect partner in [Wife's Name]. A brilliant, wonderful woman who, let’s just say, views the institution my sister studies with… a charmingly Danish scepticism! [Wife's Name], your republicanism might be more theoretical than most, especially given your fondness for the Danes who *do* wear the crown, but your perspective is valued and adds such richness. You two represent different views, different backgrounds – the constitutional scholar and the pragmatic Dane.

  And *that* is where the spare tyre theory, perhaps, gives us a little insight into marriage. Because the strongest partnerships, the most resilient ones, aren't always about both people trying to do exactly the same thing at the same time. Sometimes, stability comes from knowing there’s someone solidly in your corner, someone who embodies the core values – the dignity, the unity, the unwavering support – especially when life throws you a puncture. When the everyday governance gets tough, when the wheels feel a bit wobbly, it’s the deep, constant presence of your partner, your own personal symbol of unity and love, that provides the calm centre. The one who helps you get moving again, not by taking over the driving, but by simply *being* your steadfast support.

  [Sister's Name] and [Wife's Name], your love isn't about conformity; it’s about the beautiful, dynamic complementarity you bring to each other. You challenge each other, you support each other, and you create a union far stronger and more enduring than any single viewpoint or institution.

  So, let us raise our glasses:

  To [Sister's Name] and [Wife's Name]! May your marriage be filled with endless laughter, profound understanding, unwavering support through every bump in the road, and a love that proves to be the most stable, cherished, and absolutely essential institution in both of your lives. A love that never needs a spare tyre, but embodies its very best qualities: constant, reliable, and always there when you need it most.

  Cheers!

  ---

