answer: |-
  ### Session Plan: Centipede Game Activity for Backward Induction Paradox  
  **Total Time:** 90 minutes  
  **Objective:** Students experience the backward induction paradox firsthand through gameplay, leading to self-articulated insights about rationality, common knowledge, and the tension in the centipede game.  

  ---

  ### **Materials**  
  1. **Game Handouts** (14 copies):  
     - Payoff table for a 6-move centipede game (see below).  
     - Rules summary: "You are Player A or B. On your turn: TAKE (end game, payoffs as below) or PASS (pot grows, opponent moves). Game ends at node 6 if no one takes."  
  2. **Decision Slips** (colored paper for anonymity):  
     - Slips for each node (1–6) labeled "Pair ID," "Node," "Player Role," and options "TAKE" or "PASS."  
  3. **Tracking Tools:**  
     - Whiteboard for class-wide point tally (e.g., "Round 1 Total Points: 240").  
     - Prize for incentivization: Small candy bar or "bonus point token" (redeemable for 1 extra credit point) for top 3 scorers in Round 2.  
  4. **Role Cards:** 7 "Player A" cards, 7 "Player B" cards.  

  #### **Payoff Table (6-Move Centipede)**  
  *Pot grows by 10 points per pass. TAKE gives taker the pot, opponent 0. PASS grows pot and continues game.*  
  | Node | Player | TAKE Payoffs (A, B) | PASS Result |  
  |------|--------|---------------------|------------|  
  | 1    | A      | (10, 0)            | Pot = 20 → Node 2 (B's turn) |  
  | 2    | B      | (0, 20)            | Pot = 30 → Node 3 (A's turn) |  
  | 3    | A      | (30, 0)            | Pot = 40 → Node 4 (B's turn) |  
  | 4    | B      | (0, 40)            | Pot = 50 → Node 5 (A's turn) |  
  | 5    | A      | (50, 0)            | Pot = 60 → Node 6 (B's turn) |  
  | 6    | B      | (0, 60)            | Game ends with (0, 0) if PASS |  

  *Note:* At Node 6, B will always TAKE (60 > 0), making Node 5 the last "cooperative" chance.  

  ---

  ### **Round-by-Round Rules**  
  **Total Time:** 50 minutes (25 min per round)  

  #### **Round 1: Anonymous One-Shot (Cooperative Context)**  
  **Goal:** Encourage passing (irrational per backward induction) via anonymity and low stakes.  
  - **Setup (5 min):**  
    - Randomly assign roles (7 A, 7 B). Pairs anonymized (e.g., "Pair 1A and 1B").  
    - Context: "Maximize points for fun—no prizes. Points go to class tally (bragging rights!)."  
  - **Gameplay (15 min):**  
    - Nodes 1–6 played sequentially. At each node:  
      1. Collect decisions from relevant players (e.g., all A at Node 1).  
      2. For TAKE: End game for pair, record payoffs.  
      3. For PASS: Continue to next node.  
    - *Example Flow:*  
      - Node 1: All A decide → If PASS, proceed.  
      - Node 2: Remaining B decide → If PASS, proceed.  
      - ... Continue until Node 6 or all pairs end.  
  - **Recording (5 min):**  
    - Log outcomes on whiteboard: "Pair 1: Ended at Node 3 → A:30, B:0."  
    - Update class point tally.  

  #### **Round 2: Competitive Repeated Pairs (Unraveling Context)**  
  **Goal:** Induce unraveling (early taking) via repeated play, communication, and prizes.  
  - **Setup (5 min):**  
    - **Same pairs** as Round 1 (now known partners).  
    - **Pre-play communication:** Pairs have 2 min to exchange written promises/threats (e.g., "I’ll pass if you do").  
    - **Incentive:** "Top 3 point scorers win a prize! Maximize your own points."  
  - **Gameplay (15 min):**  
    - Play **two consecutive games** with the same partner.  
    - After Game 1, pairs see outcomes before playing Game 2.  
    - Use same node-by-node collection as Round 1.  
  - **Recording (5 min):**  
    - Track individual points across both games (e.g., "Game 1: A=10, B=0; Game 2: A=30, B=0 → A Total: 40").  
    - Announce top 3 scorers, award prizes.  

  ---

  ### **Debrief Script (40 min)**  
  **Goal:** Students articulate the paradox using their gameplay data.  
  **Key Insight Target:** *Backward induction predicts Node 1 take, but human play reaches later nodes, breaking common knowledge of rationality.*  

  1. **Results Recap (5 min):**  
     - Show Round 1 vs. 2 histograms (nodes where game ended):  
       - *Round 1 (Cooperative):* Expect peaks at mid-late nodes (e.g., Node 4).  
       - *Round 2 (Competitive):* Expect peak at Node 1.  
     - Ask: *"What changed? Why more early takes in Round 2?"*  
       - *Anticipated Student Answers:* "Trust broke after Game 1," "Wanted to win the prize."  

  2. **Walkthrough a Round 1 Game (10 min):**  
     - Pick a pair that passed until Node 4/5. Ask players:  
       - **Node 1 (A):** *"Why pass? What did you believe about B?"*  
         - *Expected:* "I thought B would pass too," or "Wanted to be fair."  
       - **Node 2 (B):** *"Why pass? Did A’s pass change your view of their rationality?"*  
         - *Expected:* "A passed, so I thought they’d cooperate."  
       - **Node 3 (A):** *"Why pass? Was taking at 3 safer?"*  
         - Highlight: Taking at Node 3 gives A 30, but passing risks B taking at 4 (A gets 0).  

  3. **Backward Induction Breakdown (15 min):**  
     - **Start at Node 6:** *"What should B do? Why?"* (TAKE; 60 > 0).  
     - **Node 5:** *"If B takes at 6, what should A do?"* (TAKE; 50 > 0).  
     - **Node 4:** *"If A takes at 5, what should B do?"* (TAKE; 40 > 0).  
     - **Continue to Node 1:** *"So why take at Node 1?"* (10 > 0 if B takes at 2).  
     - **Paradox Focus:**  
       - *"In the pair we discussed, they reached Node 4. Backward induction says this shouldn’t happen. If you were at Node 4, what would you believe about A’s move at Node 3?"*  
       - *Guide to Insight:* "A passed at Node 3—which backward induction says is irrational. If A isn’t rational, can you trust them at Node 5? This breaks the common knowledge needed for the argument."  

  4. **Linking to Theory (10 min):**  
     - **Common Knowledge of Rationality (CKR):**  
       - *"Backward induction assumes both players are rational, both know this, both know they know, etc. In Round 1, did you have CKR? Why or why not?"*  
     - **The Counterfactual Node Problem:**  
       - *"The paradox is: If CKR holds, Node 4 is never reached. But if you’re there, CKR must be false—so backward induction’s predictions for future nodes may not hold. Humans aren’t perfect rational agents, so we ‘irrationally’ pass... and sometimes win more!"*  
     - **Round 2 Contrast:** *"Prizes made you prioritize self-interest, pushing behavior toward backward induction. But did CKR truly hold?"*  

  ---

  ### **Predictable Failures & Mitigation**  
  1. **Politeness/Boredom Passing:**  
     - *Issue:* Students pass to "be nice" or speed up the game.  
     - *Handling:* **Pedagogically useful.** Debrief: *"Did anyone pass to avoid seeming greedy? How does that violate rationality assumptions?"*  

  2. **Payoff Confusion:**  
     - *Issue:* Misunderstanding "TAKE gives me the pot, not split it."  
     - *Mitigation:* Start with a practice node (e.g., "At Node 1, if A takes, what do A and B get?"). Use handout table.  

  3. **Cooperative Pairs "Refuting" BI:**  
     - *Issue:* Pairs passing to Node 6 and claiming "cooperation beats backward induction."  
     - *Handling:* **Pedagogically useful.** Debrief: *"In Round 1, if A passed at Node 5, they got 0 when B took at 6. Could A have gotten 50 by taking at 5? Is that rational?"*  

  4. **Time Pressure:**  
     - *Issue:* Running all 6 nodes takes time.  
     - *Mitigation:* Cap at Node 4 if needed. Fewer nodes still shows the tension.  

  5. **Over-Coordination in Round 2:**  
     - *Issue:* Pre-play communication leads to unrealistic promises (e.g., "I’ll pass to Node 6"), followed by betrayal.  
     - *Handling:* **Useful.** Debrief: *"Did trusting promises lead to losses? How does this relate to CKR?"*  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Perfect Rationality Gap:**  
  - Humans cannot replicate the counterfactual reasoning of perfect rational agents. Backward induction’s paradox hinges on:  
    > *"If a rational player were at a late node (e.g., Node 4), they must conclude the prior player was irrational—undermining CKR for future nodes. But a perfect agent would never be there under CKR."*  
  - **Bridging the Gap in Debrief:**  
    - Verbally stress: *"The paradox isn’t about humans. It’s about whether backward induction is logically sound under CKR. If CKR holds, Node 1 take is inevitable—but if we allow irrationality, the argument collapses. Your gameplay shows how real humans *use* irrationality to exploit the gap."*  

  ---

  ### **Instructor Notes**  
  - **Why This Works:** Students "live" the tension—cooperation feels rewarding until late-node betrayals force rationality questions.  
  - **Timing Buffer:** Shorten rounds to 20 min if needed; focus debrief on one vivid pair.  
  - **Post-Activity:** Assign reading (e.g., Binmore's *Rational Decisions*) to formalize insights.  
  - **Final Tip:** If few pairs pass early, use a hypothetical ("Suppose a pair passed to Node 4...") to trigger discussion.  

  By centering student experiences, this plan turns the paradox from abstract to visceral—setting up deeper theory engagement.
