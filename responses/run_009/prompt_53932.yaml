answer: |-
  Here is your Q&A sheet, tailored for the anticipated audience dynamics and prioritizing high-impact objections. I've ordered them by estimated potential damage (most damaging first), phrased authentically, with concise replies and honest vulnerability assessments. Consensus vs. contested ground is explicitly flagged.

  **Q&A Sheet: Defending the Ordinal Utility Monster**

  **Consensus Ground (Safe to State):**
  *   The *original* utility monster (Nozick) relied explicitly on *cardinal*, *interpersonally comparable* utility.
  *   Standard ordinal/vNM decision theory *does not* require or assume interpersonal comparability.
  *   Harsanyi's aggregation theorem, under its assumptions, yields classical utilitarianism (sum-ranking) *if* vNM utilities are interpersonally comparable.
  *   The "separateness of persons" is a core Rawlsian objection to utilitarianism.

  **Contested Ground (Flagged as Such):**
  *   Whether consequentialism *requires* or *permits* specific aggregation principles under ordinalism.
  *   The legitimacy and interpretation of "all-things-considered comparative outcome rankings" in moral contexts.
  *   Whether the "force" of the utility monster truly survives without cardinality.
  *   The correct choice rule behind a veil of ignorance (maximin vs. average utility).

  ---

  **1. The Cardinality Smuggling Objection (Decision Theorist)**
  *   **Question:** "Your 'all-things-considered comparative rankings' are doing illicit work. To say outcome A (monster gains, others lose) is better *all-things-considered* than outcome B (monster loses, others gain) *just is* to make an implicit cardinal, interpersonally comparable judgment. You've smuggled the comparability you claimed to avoid back in through the backdoor of 'consequentialist scoring'. How is this *not* just cardinal utility in disguise, demanding the same measurement procedure?"
  *   **Damage:** High. Directly challenges the core technical claim that the monster survives *without* comparability.
  *   **Reply (2 min):** "The ranking isn't *based* on summing cardinal utilities; it's a primitive, holistic judgment about which outcome is preferable *given all morally relevant consequences*. Consequentialism requires *some* ranking of outcomes. I argue that *any plausible consequentialist ranking* satisfying minimal conditions like Pareto and avoiding absurd indifference will rank the monster's gain over others' losses in the relevant scenarios. The judgment that a trivial scratch to the monster outweighs the agony of millions isn't a *measurement*; it's a constraint on what counts as a viable consequentialist ranking, revealing a conflict with separateness, not arithmetic."
  *   **Honest Soft Spot:** This relies heavily on the *intuitive plausibility* of the specific comparative judgment in the thought experiment. If the audience rejects *that* judgment as implausible or question-begging (arguing a *true* consequentialist *could* rank differently), the argument weakens significantly. You're betting they share the intuition enough to see the conflict.

  **2. The "Why Accept the Thought Experiment?" Objection (Consequentialist)**
  *   **Question:** "This feels like shadowboxing. You concede the monster *as described* relies on cardinal utility, which we reject. Then you ask us to accept a *different*, purely comparative scenario where, *ex hypothesi*, the monster's gain is judged better *all things considered*. But *why* should we accept *that* scenario as coherent or relevant? It seems you've simply *defined* a 'monster' by stipulating the problematic ranking. What independent reason do we have to think such a being or such a comparative judgment is possible or morally significant?"
  *   **Damage:** High. Challenges the very setup, potentially dismissing the entire argument as a tautology based on an implausible premise.
  *   **Reply (2 min):** "The thought experiment isn't about biological possibility, but about the *structure of value commitments* demanded by consequentialism. If consequentialism requires maximizing an outcome ranking, and if that ranking must respect certain minimal principles (like avoiding catastrophic losses for trivial gains being *worse*), then the scenario exposes the *logical possibility* that, for some rankings satisfying consequentialist constraints, separateness is violated. Its significance is showing that *even without cardinal utility*, consequentialism can license conclusions we find morally repugnant due to separateness."
  *   **Honest Soft Spot:** If the audience believes a *genuinely* consequentialist ranking *cannot* prioritize one individual so extremely without violating other core consequentialist tenets (like fairness-as-efficiency or basic agent-neutrality), your argument collapses. You're asserting this *is* a live possibility within consequentialist logic.

  **3. The "Harsanyi Undermines Your Veil" Objection (Decision Theorist / Consequentialist)**
  *   **Question:** "You lean on a veil-of-ignorance reconstruction to resist trade-offs, but Harsanyi's theorem *is* the formal result behind the veil! Under its assumptions (vNM rationality, impartiality), the *only* rational choice is to maximize *average expected utility*, which *directly* licenses the trade-offs you find problematic. Your 'reconstruction' seems to ignore the actual math. Are you rejecting vNM rationality, impartiality, or just the conclusion?"
  *   **Damage:** High. Directly attacks a key supporting argument using the audience's own formalism.
  *   **Reply (2 min):** "Harsanyi's result relies on the *assumption* that individuals behind the veil have vNM preferences *and* that the social planner aggregates them using a vNM-social welfare function *and* accepts interpersonal comparability for the aggregation. My reconstruction questions whether the *choice rule* behind the veil, under radical uncertainty about who you are, must be *maximizing expected utility*. Rawls argues for maximin. Even without maximin, the sheer *scale* of potential loss for others in the monster scenario might make average utility maximization an irrational gamble *behind the veil*, regardless of probabilities. Harsanyi shows one possibility; I argue it's not the only rational one in extremis."
  *   **Honest Soft Spot:** This is contested territory. Rejecting expected utility maximization under uncertainty is a major deviation from standard decision theory. You must concede you're arguing *against* a powerful formal result, appealing to rationality under extreme stakes ("dread risks") as justification. The Rawlsian might support you, but the decision theorists will push back hard.

  **4. The "Steep Returns Are Unproblematic" Objection (Consequentialist / Decision Theorist)**
  *   **Question:** "Your 'ordinal monster' just sounds like someone with incredibly steep marginal returns – needing vast resources for small utility increments near their peak. But consequentialism handles steep returns routinely: we allocate water to the parched man before topping up the merely thirsty. What's the problem? Why is this a 'monster' and not just an extreme case of diminishing marginal utility we already accept?"
  *   **Damage:** Medium-High. Tries to assimilate your argument back into standard, unproblematic consequentialism.
  *   **Reply (2 min):** "The difference is one of *kind*, not degree. In standard diminishing returns, we prioritize based on *urgency* or *need*, which often correlates with baseline welfare or objective states. The monster's 'steep returns' are *disconnected* from any plausible metric of need, desert, or baseline welfare. It's a being for whom a *single grain of rice* provides more 'moral weight' than the starvation of millions. Consequentialism, focused *only* on the outcome ranking, must accept this if that's how the ranking falls. This isn't allocating water to the parched; it's allocating *all water, forever*, to someone who gets a tiny buzz from the first sip and massive satisfaction from hoarding lakes they'll never drink."
  *   **Honest Soft Spot:** The line between "extreme but acceptable diminishing returns" and "monster" relies heavily on the *bizarreness* of the scenario and the *intuition* that such a being couldn't exist or that no plausible value theory would generate such a ranking. If they bite the bullet on the ranking, your resistance looks like non-consequentialist intuition.

  **5. The "Demandingness vs. Monstrosity" Objection (Consequentialist)**
  *   **Question:** "Isn't this just the standard 'demandingness' objection dressed up? Consequentialism often asks us to sacrifice a lot for the greater good. Why is it uniquely monstrous when the beneficiary is a single entity? Isn't the real issue the *scale* of sacrifice demanded, not the *number* of beneficiaries? Consequentialism already struggles with extreme demands; this seems like a variation, not a new beast."
  *   **Damage:** Medium. Attempts to minimize the novelty and specific threat of the monster.
  *   **Reply (2 min):** "While demandingness is related, the monster highlights a distinct issue: *violation of agency and recognition*. Sacrificing *my* resources for a *diffuse* greater good feels demanding but preserves others' agency as separate sources of value. Sacrificing *everyone's everything* (including their agency, projects, existence) *to* a *single* entity whose preferences dominate the ranking treats persons purely as means to that entity's ends. This feels like a qualitative leap – a *tyranny* justified by the outcome ranking, directly clashing with the separateness of persons in a way diffuse demandingness does not."
  *   **Honest Soft Spot:** Distinguishing "demandingness" from "tyranny of the one" relies on moral intuition about agency and recognition. Hard-nosed consequentialists may see this as sentimentality. You need to frame the separateness violation starkly.

  **6. The Rawlsian's Kantian Smuggling Charge (Rawlsian)**
  *   **Question:** "Your entire argument hinges on the 'separateness of persons' being a fundamental constraint that consequentialism violates. But that constraint *is* fundamentally Kantian/deontological! You're using a deontological premise to attack consequentialism. Isn't your 'ordinal monster' just a clever way of smuggling Kantian respect for persons into the heart of consequentialist evaluation, revealing that you're not really attacking consequentialism *on its own terms* but imposing an external standard?"
  *   **Damage:** Medium (but rhetorically potent). Questions the internal coherence of your critique.
  *   **Reply (2 min):** "I argue the separateness concern *arises immanently* within consequentialism. The monstrous outcome is problematic *even if* we accept consequentialism's core commitment to ranking outcomes. We intuitively recoil, and that recoil points to a tension *within* the consequentialist project: maximizing the good seems to require ignoring the distinctness of the bearers of that good in extreme cases. I'm not smuggling Kant in; I'm showing that a purely consequentialist evaluation, pushed to an extreme logical possibility, generates a result that *should* trouble consequentialists themselves because it undermines the very agents whose good it purports to maximize."
  *   **Honest Soft Spot:** This is interpretive. You *are* appealing to an intuition (separateness) that has strong deontological roots. While arguing it *should* trouble consequentialists, you risk appearing to judge consequentialism by an external standard. Emphasize the *internal* tension.

  **7. The "Aggregation Without Summing" Challenge (Decision Theorist)**
  *   **Question:** "Granting your comparative rankings exist: what aggregation principle *do* you propose that avoids the monster? Pareto? That's insufficient to generate a complete ordering and can be silent on monster-vs-masses cases. Leximin? That seems implausibly extreme and non-consequentialist in other ways. If you reject both sum-ranking (via cardinality) *and* standard comparative aggregation principles, what positive account do you offer that handles conflict without collapsing into the monster *or* paralysis? Or is your point purely negative?"
  *   **Damage:** Medium. Forces you onto the defensive about positive alternatives.
  *   **Reply (2 min):** "My core argument is negative: showing that the *standard consequentialist escape hatch* (rejecting cardinality) doesn't dissolve the underlying tension revealed by the monster – it just relocates it to the structure of the comparative ranking itself. I don't need a full positive aggregation theory to make this point. However, the veil-of-ignorance reconstruction *suggests* that rational agents concerned about their own potential fate as the losers would reject aggregation rules allowing such extreme sacrifice, perhaps favoring maximin or a threshold-based approach *behind the veil*, even if it complicates aggregation in practice."
  *   **Honest Soft Spot:** Admitting the primarily negative focus is crucial. Offering the veil as a *suggestion* is weak; it's not a developed positive theory. Focus on the negative point being sufficient for the paper's aims.

  **8. The "Incommensurability Escape" Objection (Consequentialist / Philosopher)**
  *   **Question:** "Why assume the 'all-things-considered' ranking *must* settle the monster-vs-masses comparison? Perhaps consequentialists should embrace incompleteness or incommensurability here. Maybe there *is* no fact of the matter whether the monster's trivial gain is better or worse than the masses' agony – they are simply incomparable in a deep way. Doesn't this dissolve the dilemma without cardinal utility *or* accepting the monstrous ranking?"
  *   **Damage:** Medium-Low (but clever). Offers an alternative escape route.
  *   **Reply (2 min):** "Incommensurability is a possible response, but it comes at a cost. If the consequentialist ranking is incomplete for such fundamental conflicts, it risks practical paralysis in precisely the hard cases where we need guidance. More importantly, refusing to rank doesn't resolve the *moral* conflict; it just avoids the decision. If forced to choose (as agents often are), the consequentialist still needs a decision rule. Does incompleteness mean flipping a coin between saving millions from agony and giving the monster a snack? That seems equally unpalatable. The dilemma's force lies in the seeming *necessity* of the monstrous choice *if* we demand a complete, action-guiding ranking."
  *   **Honest Soft Spot:** This reply highlights the *practical* problem with incommensurability but doesn't fully address the *theoretical* claim that the values might be genuinely incomparable. Some philosophers will find incommensurability a more acceptable cost than monstrosity.

  **The Question You Hope Nobody Asks (But Prepare For):**

  *   **The Bare Moral Claim:** "Strip away the formal apparatus and the talk of ordinal rankings. Isn't your core argument just this: 'Sacrificing the fundamental interests of many for the trivial gain of one is wrong, period'? And isn't that just a basic deontological constraint? Why dress it up in decision-theoretic clothing if the underlying moral claim is so simple (and non-consequentialist)?"
  *   **Damage:** High. Accuses you of obscuring a simple, non-consequentialist intuition with unnecessary formalism.
  *   **Reply (2 min):** "The formalism serves a crucial purpose: it shows that this moral claim isn't just externally imposed on consequentialism; it exposes an *internal tension*. Consequentialism *aspires* to provide a complete, rational ordering of outcomes. My argument demonstrates that *if* it succeeds in providing such an ordering satisfying plausible minimal conditions, *then* it risks licensing outcomes that violate this basic moral claim. The decision-theoretic framing isn't dressing; it's showing that rejecting cardinal utility *doesn't* remove the core conflict between a maximizing consequentialism and the separateness of persons. The formal argument forces consequentialists to confront whether they *can* construct their complete ordering without either smuggling in cardinality or biting the monstrous bullet."
  *   **Honest Soft Spot:** This is the hardest objection. Your reply leans heavily on the "internal tension" argument. If the audience sees your "plausible minimal conditions" for the ranking as *already* smuggling in the deontological constraint, they'll feel you've begged the question. Emphasize that the tension arises from consequentialism's *own* ambitions and the *logical implications* of fulfilling them.

  **Key Credibility Notes for Delivery:**

  *   **Flag Contestation Proactively:** When discussing the veil, rankings, or interpretations of Harsanyi, explicitly say "This is contested ground, but my reading is..." or "The standard view is X, but I argue Y because...".
  *   **Acknowledge Soft Spots:** Don't hide them. Phrases like "This is where the intuition is doing heavy lifting," "I concede this relies on interpreting rationality under uncertainty in a specific way," or "The hardest pushback I get is on this point" build trust.
  *   **Focus on the Core:** When pressed on alternatives (like incommensurability or demandingness), pivot back to the paper's negative thesis: "My primary goal was to show that rejecting cardinal utility *doesn't* make the underlying concern disappear; it transforms it."
  *   **Respect the Disciplines:** Speak precisely to the decision theorists in their terms (vNM, aggregation, comparability) and to the philosophers in theirs (separateness, moral intuition, demandingness). Avoid blurring the modes of argument.
  *   **Embrace Provocation:** You set out to be provocative. Stand by the core idea confidently, even while acknowledging the points where the argument is most vulnerable. Your credibility comes from engagement, not invulnerability.

  Good luck! This audience is tough but serious. Your preparation shows you respect them. That goes a long way.
