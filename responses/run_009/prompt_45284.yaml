  ### **Scoring Key**  
  *Match your answers to the theories below. Each theory is defined by its core commitment:*  
  - **Truth-functional orthodoxy**: Both indicative and counterfactual conditionals are material conditionals (true if antecedent false or consequent true).  
  - **Assertibility/Implicature view**: Conditionals are material conditionals, but their assertibility depends on conditional probability.  
  - **Unitary selection-function semantics**: Indicative and counterfactual conditionals share a semantics (selecting "closest" worlds where antecedent holds), but differ in which worlds are accessible.  
  - **Comparative similarity semantics**: Counterfactuals depend on comparing similarity between worlds; may reject Conditional Excluded Middle (CEM).  
  - **Strict conditional**: Conditionals mean the consequent holds in *all* accessible antecedent-worlds.  
  - **Suppositional/No-Truth-Value**: Conditionals lack truth values; assessed via conditional probability (indicatives) or imaginability (counterfactuals).  

