prompt: |-
  my friend Priya (also a PhD student, political theory cohort, we argue constantly) has a pretty consistent track record on repugnant markets and I want to bet on what she'll say about some new cases before our reading group meets Friday. Her verdicts so far: kidney sales by poor sellers should stay banned; vote selling obviously banned; price gouging on generators after a hurricane is wrong and should be illegal; she's fine with legal commercial surrogacy; she's fine with decriminalized sex work; she thinks the French were right to ban dwarf tossing; she thinks paying people for blood plasma is fine even though it's mostly poor people who sell; and she says paying a service to have someone apologize on your behalf is gross and should probably not be allowed (though paying a therapist to help you craft an apology is fine).

  The new cases we need to call: (1) a comfortably-off guy, no debts, no dependents, offers to sell a kidney for $80k to fund his startup — zero desperation on his part; (2) a funeral home starts hiring professional mourners, well-paid actors with MFAs, to weep at sparsley attended funerals; (3) a single mom working full time at below-living-wage sells plasma twice a week to cover groceries.

  Predict her verdict on each. Then figure out what rule she's actually running — I can see at least three candidates that fit her record about equally well: something like a desperation/vulnerability rule (the wrongness comes from people being pushed into sales by need), a corruption-of-meaning rule (selling degrades the good being sold), and a third-party-harm rule — and they come apart on these cases in different places. Say which case best discriminates between them, and if the rules still underdetermine her verdict somewhere, what one extra case I should spring on her to nail it down. I have a coffee riding on the kidney guy.
reasoning: |-
  Okay, let me tackle this problem step by step. The user wants to predict Priya's stance on three new cases regarding repugnant markets based on her past positions. Then, I need to figure out the underlying rule she's using among three possibilities: vulnerability, corruption-of-meaning, or third-party harm. 

  First, I'll list out Priya's known positions to establish a pattern. She opposes kidney sales by the poor, vote selling, price gouging, dwarf tossing, and paid apologies. But she supports commercial surrogacy, decriminalized sex work, and paid plasma donation despite it involving poor sellers. 

  Looking at the new cases: 
  1. Kidney sale by a non-desperate startup founder. Since Priya banned kidney sales for the poor due to vulnerability, this case lacks desperation. If she still opposes it, corruption-of-meaning might be her rule. If she allows it, vulnerability is key. 
  2. Professional mourners. This is symbolic and might degrade the meaning of mourning. Priya opposed paid apologies as "gross," so she might similarly ban this if corruption is her concern. 
  3. Single mom selling plasma for groceries. She previously allowed plasma sales by the poor, so she might still support it unless vulnerability overrides here. 

  The kidney case (Case 1) is crucial for distinguishing between vulnerability and corruption rules. If she opposes it despite no desperation, corruption is likely. If she allows it, vulnerability is key. 

  For Case 3, if she opposes it despite previously allowing plasma sales, vulnerability might be the stronger factor. But her past support for plasma donation even by the poor suggests she might allow it. 

  If the rules still conflict after Cases 1-3, introducing a case on paid friendship (e.g., hiring a fake friend) could help. If she bans it, corruption-of-meaning is likely; if she allows it, vulnerability might not be triggered. 

  The user's coffee bet on the kidney guy hinges on whether Priya uses vulnerability or corruption as her main rule. Predicting her decision here will clarify her underlying principle.
answer: |-
  Based on Priya's track record and the underlying principles at play, here's the prediction for each new case, the rule analysis, the key discriminating case, and the potential tiebreaker:

  **Predicted Verdicts for Priya:**

  1.  **Comfortable Startup Guy Selling a Kidney ($80k):** **BANNED.** Despite the lack of desperation, Priya's objection to kidney sales *generally* (even when originating from the poor) suggests a deeper concern about commodifying the body itself or the intrinsic meaning of an organ. Her ban on dwarf tossing aligns with this symbolic/corruption concern about the body, outweighing the lack of vulnerability here.
  2.  **Professional Mourners (Actors Paid to Weep):** **BANNED.** Priya found paid apologies "gross" and likely to "degrade" the act. Paid mourning directly parallels this – it commodifies a deeply personal, symbolic expression of grief and loss, corrupting its meaning and sincerity. This screams "corruption-of-meaning" to her.
  3.  **Single Mom Selling Plasma for Groceries:** **ALLOWED.** Priya explicitly said paying for blood plasma is "fine," *even though* it's mostly poor sellers. Her acceptance of plasma sales despite vulnerability, contrasted with her ban on kidneys and votes, shows she distinguishes between types of goods sold. Plasma (renewable, less symbolically charged than an organ or vote) likely falls below her threshold for corruption, and she accepts vulnerability as a driver here (similar to her stance on sex work).

  **The Underlying Rule Analysis:**

  The three candidate rules are:

  *   **A. Vulnerability/Desperation Rule:** Wrongness stems from coercion by need/precariousness.
  *   **B. Corruption-of-Meaning Rule:** Wrongness stems from commodification degrading the intrinsic value/social meaning of the good/act.
  *   **C. Third-Party Harm Rule:** Wrongness stems primarily from direct, tangible harm to non-consenting others.

  **How They Fit Her Record:**

  *   **Kidneys (Poor Sellers):** Banned. Fits **A** (vulnerability) & **B** (corruption of body/organ donation). Doesn't strongly fit **C** (direct harm arguable).
  *   **Vote Selling:** Banned. Fits **B** (corrupts democracy) & **C** (harms society). Fits **A** less perfectly (could be non-desperate).
  *   **Price Gouging:** Banned. Fits **A** (exploits desperation) & **C** (harms victims). Fits **B** weakly (money itself isn't corrupted).
  *   **Commercial Surrogacy:** Allowed. Fits **A** (could be chosen non-desperately?) & **B** (she sees pregnancy/helping as compatible with payment?). Conflicts with **C** (arguable harm to child/society? She rejects this).
  *   **Decriminalized Sex Work:** Allowed. Fits **A** (accepts vulnerability exists but prefers decrim) & **B** (doesn't see sex as inherently corrupted by payment?). Conflicts with **C** (arguable societal harms? She rejects this).
  *   **Dwarf Tossing:** Banned. Fits **B** (corruption/degradation of human dignity/body). Fits **A** poorly (dwarf might consent non-desperately). Fits **C** weakly (arguable societal harm/degradation).
  *   **Blood Plasma:** Allowed. Fits **A** (accepts vulnerability exists). Conflicts with **B** (she doesn't see plasma donation as corrupted). Conflicts with **C** (no direct harm).
  *   **Paid Apology:** Banned. Fits **B** (corrupts meaning of apology/sincerity). Fits **A** poorly (seller might not be desperate). Fits **C** weakly (deception/harm to recipient?).

  **Evaluation:** Rules **A (Vulnerability)** and **B (Corruption-of-Meaning)** fit the *majority* of her judgments reasonably well, but **B** has fewer contradictions. **C (Third-Party Harm)** fits poorly – she bans things with weak third-party harm arguments (kidneys, apologies, dwarf tossing) and allows things with potential third-party harm arguments (surrogacy, sex work). **C is likely not her primary driver.**

  **The Key Discriminating Case: Startup Kidney Seller (Case 1)**

  *   **Vulnerability Rule (A):** Predicts **ALLOWED.** No desperation/vulnerability = no wrongness.
  *   **Corruption Rule (B):** Predicts **BANNED.** Selling a kidney intrinsically corrupts the meaning of bodily integrity/organ donation, regardless of seller's motivation.
  *   **Priya's Likely Verdict (BANNED) strongly supports Rule B (Corruption-of-Meaning) as her primary driver.** Her ban on dwarf tossing (no vulnerability needed) and paid apologies (same) reinforces this. Her *allowance* of plasma sales (less symbolically charged than a kidney) further shows that corruption, not just vulnerability, is the critical factor for "high-meaning" goods.

  **Where Rules Might Still Underdetermine: Plasma Single Mom (Case 3)**

  *   **Vulnerability Rule (A):** Predicts **BANNED.** Exploitation of need/dependency.
  *   **Corruption Rule (B):** Predicts **ALLOWED.** She doesn't see plasma donation as corrupted by payment.
  *   **Priya's Explicit Past Stance:** She said plasma sales are "fine even though it's mostly poor people." This directly answers Case 3: **ALLOWED.** This confirms **Corruption (B)** is primary, overriding vulnerability concerns for goods she deems less symbolically significant. Vulnerability matters, but only *after* the corruption threshold is cleared. Plasma clears it; kidneys/votes/apologies do not.

  **The Tiebreaker Case (If Needed):**

  While Cases 1 & 3 are strong discriminators, if absolute clarity is needed on the *hierarchy* between Vulnerability and Corruption, or the *scope* of Corruption, propose:

  *   **"Paid Platonic Friendship":** A service where someone hires a kind, attentive person (no romance/sex) to be their "friend" - meet for coffee, listen to problems, offer supportive conversation, purely for hourly pay. No deception; all parties know it's transactional.
      *   **Vulnerability Rule (A):** Might allow (if friend isn't desperate) or ban (if exploiting lonely sellers). Ambiguous.
      *   **Corruption Rule (B):** Likely **BANNED.** Priya would likely see this as grossly corrupting the intrinsic meaning of friendship, trust, and authentic human connection, similar to paid apologies/mourning. It commodifies intimacy and care in a way she'd find repugnant.
      *   **Prediction:** Priya says **BANNED.** This reinforces **Corruption-of-Meaning (B)** as her core principle and helps define its boundaries (encompassing friendship, apologies, mourning, votes, organs, dignity).

  **Conclusion:**

  *   **Priya's Rule:** Primarily **Corruption-of-Meaning.** She objects to markets that commodify goods/acts with high intrinsic social, symbolic, or personal meaning (organs, votes, dignity, apologies, mourning, likely friendship), seeing payment as degrading their core value. Vulnerability matters *within* markets she deems acceptable (like plasma, sex work, surrogacy), but it's secondary to the initial corruption assessment.
  *   **Verdicts:** 1. BANNED, 2. BANNED, 3. ALLOWED.
  *   **Discriminating Case:** Case 1 (Startup Kidney) most clearly differentiates Vulnerability from Corruption. Her verdict (BANNED) confirms Corruption wins.
  *   **Tiebreaker:** Paid Platonic Friendship service.
  *   **Your Coffee Bet:** Based on this analysis, Priya will say the startup kidney sale should **stay banned.** Looks like you might owe her a coffee! (Unless she surprises us, but the pattern is strong for Corruption). Good luck on Friday!
