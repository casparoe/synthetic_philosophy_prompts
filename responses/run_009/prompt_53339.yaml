prompt: |-
  In our team's design review for a conversational assistant, a colleague defended the following position: performative utterances are side-effecting API calls, and constative utterances are read-only queries. On her picture, when someone says "I hereby resign" or "I promise to deploy the fix tonight," they are invoking an operation that mutates a shared state -- employment, obligation -- whereas "the server is down" merely reports it. Each performative, she says, comes with preconditions (you must be the person authorized to resign; there must be a boss and an institution behind the words), and when a precondition fails you don't get a false statement but an exception: the utterance misfires, as she put it, the way an unauthorized request returns a 403 rather than a wrong answer. She was using this to argue a policy point about our assistant: the model should never emit promise-shaped or apology-shaped or warning-shaped output, because a system without credentials, intentions, or an institutional role has no business calling side-effecting endpoints -- it would be like a lambda invoking the payment API with no service account.

  I have no philosophy background and know this territory only glancingly -- I gather Austin drew something like this constative/performative line and then worried it to death. Please audit the analogy for me. First, give me the correspondence table: what plays the role of the caller, the credentials, the precondition, the endpoint, the mutated state, the returned error. Second, tell me where the mapping breaks, and specifically whether it breaks in ways that matter for her policy conclusion. The thing I keep snagging on is that a database write does not depend on the database noticing and accepting the request, whereas it seems like my "I promise" only counts as a promise if you hear it and take it as one -- the side effect lives partly in the hearer's uptake, which no API model I know captures. Also, my colleague's own example troubles me: "the server is down" can be performative too, if I'm the on-call engineer saying it in the incident channel, since that utterance seems to do something (trigger a page, shift responsibility). If the constative/performative line itself is unstable, what does that do to the read-only-query half of her analogy? Finally, the verdict: does her conclusion -- the assistant must not use performative language -- survive the disanalogies, or was the analogy carrying it the whole time? And if the function-call picture is the wrong analogy, sketch what a better one would be.
reasoning: |-
  Hmm, the user is asking me to evaluate a colleague's analogy between performative utterances in language and API calls in software design. The colleague argues that performatives like "I resign" or "I promise" are like side-effecting API calls that mutate state, while constatives like "the server is down" are read-only queries. This analogy leads to a policy conclusion that their conversational assistant shouldn't use performative language since it lacks credentials or institutional role.

  I need to audit this analogy carefully. First, I should map out the correspondence as the colleague sees it:
  - Caller = Speaker
  - Credentials = Speaker's institutional authority
  - Precondition = Conditions for successful performative
  - Endpoint = Performative verb
  - Mutated state = Social/institutional facts
  - Returned error = Misfire (e.g., 403 unauthorized)

  But where does this break down? The user has already noticed two key problems: (1) the critical role of hearer uptake in performatives - a promise only works if it's accepted, unlike a database write which succeeds independently; and (2) how even constatives can become performative in context (like declaring "the server is down" during an incident).

  Austin himself realized the constative/performative distinction isn't stable - that's why he developed speech act theory with locutionary, illocutionary and perlocutionary acts. The illocutionary force (what we're doing in speaking) is what matters, and this depends entirely on context and recognition.

  For the policy conclusion: while I agree the assistant shouldn't make false promises, the analogy oversimplifies. The bigger issue isn't performative language per se, but whether the system has backing for its commitments. A better approach would be to design the assistant's speech acts with clear felicity conditions - perhaps making it explicit when it's relaying vs. originating commitments, or using hedging language.

  The better analogy isn't API calls but protocol design - where each utterance must be interpretable within the conversation's joint activity. The focus should be on the assistant's role design (what speech acts it's authorized to perform) rather than banning an entire class of language.
answer: |-
  Your colleague's analogy is insightful but imperfect—Austin would call it a "happy performative" that works until we examine its felicity conditions. Let's audit it systematically, then address your concerns and the policy conclusion.

  ### Correspondence Table (Her Analogy)
  | **Software Concept**       | **Linguistic Analog**                     | **Austin's Framework**                     |
  |----------------------------|------------------------------------------|--------------------------------------------|
  | Caller                     | Speaker                                  | Agent producing utterance                  |
  | Credentials/Service Account| Social role/authority (e.g., employee)  | Felicity condition: "Proper person" rule   |
  | Precondition               | Conditions for valid performative        | Felicity conditions (e.g., sincerity, context) |
  | Endpoint API               | Performative verb ("resign", "promise")  | Illocutionary act type                     |
  | Mutated State              | Social/institutional facts (employment) | Perlocutionary effect                      |
  | Returned Error (403, 500)  | Misfire (infelicity)                     | Failed illocution (e.g., "I divorce you" said to a stranger) |
  | Read-only Query            | Constative ("server is down")            | Purportedly descriptive statement          |

  ### Where the Analogy Breaks (and Why It Matters)
  1. **Uptake Dependency**:  
     - **Problem**: APIs succeed/fail independently of the receiver's interpretation. Performatives *require* hearer recognition ("uptake") to take effect. If your "I promise" is unheard or dismissed, no obligation is created—unlike a payment API call that deducts funds even if the client ignores the response.  
     - **Policy Implication**: An assistant *can* "promise" if users accept its role (e.g., "I'll remind you at 8 PM" as a delegated commitment). The issue isn't credentials but **shared conventions of interpretation**.

  2. **Constatives Are Covert Performatives**:  
     - **Problem**: As you noted, "the server is down" isn't neutral. In context, it may:  
       - **Warn** (triggering alerts),  
       - **Excuse** (shifting blame), or  
       - **Declare** (initiating incident protocols).  
       Austin abandoned the constative/performative split precisely because *all* utterances have **illocutionary force** (what you *do* by speaking).  
     - **Policy Implication**: Banning "promise-shaped" output is arbitrary. "Your request is queued" *is* a performative (creating an expectation), just as "I can't help with that" *apologizes*. The assistant *always* acts via language.

  3. **Sincerity Conditions**:  
     - **Problem**: An API either executes or errors. Performatives fail in subtler ways: if you say "I promise" insincerely, the promise exists but is *abused* (Austin's "infelicity"). An assistant can't "intend" but might *simulate* sincerity—which is a design choice, not a logical flaw.

  4. **State Mutability**:  
     - **Problem**: Social "state" (e.g., obligations) isn't in a transactional database. It’s co-constructed, defeasible, and context-dependent. An apology might *fail* to repair trust despite "correct" execution.

  ### Does Her Policy Conclusion Survive?
  **Partly—but for better reasons than her analogy provides.**  
  - **Valid Core Insight**: Assistants *should* avoid utterances that imply commitments they can't fulfill ("I'll wire $100 now") or roles they lack ("I fine you $20"). This isn't about performatives per se but about **misrepresenting capabilities**.  
  - **Flawed Reasoning**: The constative/performative distinction *is* unstable, and banning "promise-shaped" language is both over- and under-inclusive:  
    - **Over-inclusive**: Harmless promises ("I promise to summarize this") need no credentials.  
    - **Under-inclusive**: "Your account is suspended" (a constative!) could be a destructive act if false.  

  **Better policy**: Focus on **transparency and felicity conditions**:  
  - If the assistant "promises," ensure it *can and does* fulfill it (e.g., calendar alerts).  
  - Avoid speech acts requiring human-exclusive roles (e.g., "I absolve you").  
  - Use hedging for high-stakes commitments: "I *can* set a reminder—would you like that?"  

  ### A Better Analogy: Protocol Layers in Communication
  Imagine language as a **network protocol** with layers:  
  | **Layer**          | **Function**                               | **Assistant Design Principle**             |  
  |---------------------|-------------------------------------------|--------------------------------------------|  
  | **Physical**        | Words transmitted                         | Ensure clarity, avoid ambiguity.           |  
  | **Illocutionary**   | Speech act type (promise, warning, etc.)  | Map acts to capabilities: e.g., warnings only if actionable. |  
  | **Perlocutionary**  | Effect on user (trust, alarm)             | Predict and mitigate unintended effects.   |  
  | **Institutional**   | Social context (e.g., customer service)   | Align with user expectations and system permissions. |  

  **Why this works**:  
  - **Uptake** is handled at the illocutionary/perlocutionary boundary.  
  - "State change" is emergent from layered interactions.  
  - Errors are contextual: e.g., a warning without follow-up options violates protocol.  

  ### Verdict
  Your colleague's analogy *partially* holds for institutional performatives (resigning, sentencing) but fails for mundane ones (promising, warning). Her policy conclusion is **pragmatically sound but philosophically overextended**. Banning all performative language is unnecessary; instead, **design speech acts the system can felicitously execute**. The real risk isn’t "calling endpoints without credentials"—it’s *breaking the cooperative principles* of conversation. A better assistant mirrors J.L. Austin’s wisdom: "The total speech act in the total speech situation is the *only actual* phenomenon which, in the last resort, we are engaged in elucidating."
