answer: |-
  Subject: Re: The shifting boundaries of disease classification

  It is always refreshing to encounter someone who has noticed the instability of medical categories not just as a bureaucratic annoyance but as a genuine philosophical puzzle, because you have put your finger on one of the central tensions in the philosophy of medicine. You are correct that "medicalization" is the standard sociological term for the first direction you describe, where non-medical problems become defined and treated as medical conditions, and its counterpart "demedicalization" covers the reverse process, but these terms often describe the social movement rather than the conceptual mechanics of what is happening to the disease category itself. Philosophers of medicine do not have a single, catchy canonical name for this specific two-way drift, such as "The Disease Pendulum" or "Diagnostic Oscillation," though you will sometimes hear references to "threshold shifting" or "conceptual creep" in specific contexts like hypertension or psychiatry. However, the phenomenon you are describing is the primary evidence used in the debate between naturalists and normativists regarding the ontology of disease, and it suggests that disease concepts are what we might call response-dependent or pragmatic kinds rather than purely natural kinds.

  To understand why this pattern matters, we have to look at the dominant naturalist theory of disease, most famously articulated by Christopher Boorse in his Biostatistical Theory. Boorse argued that disease is simply a deviation from species-typical functional design, meant to be an objective, value-free biological fact. If your heart pumps less efficiently than the statistical norm for your age and sex, you have a disease, regardless of whether we can fix it or how many people have it. The pattern you noticed dismantles this view pretty effectively. If disease were purely a biological fact like having a certain blood type, the classification shouldn't pivot on whether a pharmaceutical company develops a pill or whether the condition becomes common enough in the elderly to be considered "normal aging." The biology remains constant in your examples, yet the status of "disease" flickers on and off. This suggests that the concept of disease is not merely discovering a pre-existing natural boundary but is instead drawing a line based on human interests, specifically our capacity for intervention and our tolerance for variation.

  The French philosopher Georges Canguilhem offered a framework that handles this drift much better than the strict naturalists. In his work The Normal and the Pathological, he argued that the normal is not a static statistical average but a margin of tolerance within which an organism can navigate its environment. When you describe a condition becoming reclassified as a "risk factor" or "normal aging" because half the population has it, you are describing a shift in what society considers an acceptable margin of tolerance. If everyone over sixty has high blood pressure, treating it as a disease implies that aging itself is a disease, which collapses the utility of the concept. Conversely, when a treatment becomes available for something previously considered bad luck, the margin of tolerance shrinks because we now have the technical capacity to correct the deviation. This aligns with a normativist view of medicine, championed by philosophers like Lennart Nordenfelt or K. W. M. Fulford, which holds that disease concepts are inextricably tied to values about what constitutes a good life or acceptable functioning. The label "disease" is not just a description of a broken part; it is a signal that this broken part is something we ought to fix, and if we cannot fix it, or if fixing it is too ubiquitous, the label loses its normative force.

  There is also a pragmatic dimension to this that intersects with the work of philosophers like Rachel Cooper and Peter Schwartz, who have analyzed how values enter into disease classification. Schwartz, for instance, has written extensively on how diagnostic thresholds for conditions like hypertension are moved not because new biology is discovered, but because we decide that the cost of treatment is worth the benefit at a certain level of risk. This supports your intuition that the classification tracks our practical stance. When we can intervene, the condition becomes a disease because it becomes a site of action. When the condition becomes too prevalent to manage as a discrete pathology, it becomes a background condition of existence. This implies that disease concepts are what Ian Hacking might call "interactive kinds," where the classification itself changes how we interact with the phenomenon, though in your case, it is more that our capacity to interact changes the classification.

  So, to answer your question about whether this bears on the question of natural versus constructed concepts, the evidence strongly suggests that disease is not a purely natural kind like gold or water, which exists independently of human judgment. Instead, it is a hybrid concept that relies on biological dysfunction but requires a normative judgment to become a disease. The two-way drift you observed shows that the boundary is porous and managed by human goals. If disease were purely natural, the availability of a drug wouldn't turn a variation into a pathology, and the prevalence of a condition wouldn't turn a pathology into a normal state. The fact that these shifts happen tells us that "disease" is a tool we use to organize our response to suffering and biological variation, rather than a mirror reflecting the intrinsic structure of nature. We might call this "pragmatic constructivism" in medicine, acknowledging that while the biology is real, the category of disease is a human invention designed to tell us where to direct our resources and attention.
