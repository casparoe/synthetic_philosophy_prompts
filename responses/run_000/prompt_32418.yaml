prompt: |-
  I serve on a national animal welfare advisory committee, and one of my fellow committee members has voted in ways that I can't quite systematize. Over the past three years, here are her votes on the cases that came before us:

  - A ban on gestation crates for sows. She voted for the ban, citing the clear evidence for suffering.
  - A moratorium on commercial octopus farming. She voted for the moratorium, citing the evidence for cephalopod sentience and cognitive complexity.
  - A requirement that lobsters be electrically stunned before boiling. She voted for the requirement, noting that the evidence for crustacean nociception and stress responses had persuaded her.
  - A challenge to standard broiler chicken stocking densities. She voted to tighten the limits, citing suffering.
  - A proposal to extend welfare protections to managed honeybee hives. She voted against, arguing the evidence for insect suffering is too weak.
  - A proposal to regulate neural organoid research on welfare grounds. She voted against, saying organoids lack the architecture for conscious experience.
  - A challenge to the welfare standards for wild-caught cod, focusing on trawling stress and suffocation on deck. She voted against extending protections, arguing that the committee's mandate properly covers animals under direct human husbandry, not wild animals, whatever their capacity to suffer.

  Now we are about to vote on a new case: a proposal to set welfare standards for Atlantic salmon farmed in open-net sea pens. The farms operate at high stocking densities; the fish suffer recurrent sea lice infestations; they are routinely handled, crowded, and transported; and they are slaughtered by CO₂ exposure or immersion in ice slurry without prior stunning. The scientific literature on fish pain is contested: salmon possess nociceptors, A-delta and C fibers, and show behavioral and physiological stress responses that are modulated by analgesics, but some neuroscientists argue that fish lack the cortical homologues necessary for conscious pain experience.

  I want to predict how she will vote. What are the candidate rules that best fit her pattern of votes so far? For each candidate rule, what would it predict about the salmon case? Which rule is the best overall fit, and what is your best guess for her vote? And crucially: what further case — one we haven't yet considered — would most cleanly discriminate between the leading candidate rules?

  Please say how confident you are in each of your claims and single out the point you're least sure of.
