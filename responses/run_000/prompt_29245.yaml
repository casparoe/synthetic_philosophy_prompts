          *   *Resolution:* Relational property. The spirit is a fit between glyph structure and human visual cortex.
          *   *Severity:* Medium-High. Risks sliding into Platonism if not careful.

      *   **Tension D: Style Invariance (4) vs. Graded Membership (1).**
          *   *Conflict:* (4) says Times and Helvetica are *fully* 'a'. (1) says some handwritten glyphs are *better* 'a's. Where is the line between "style" and "bad example"?
          *   *Resolution:* Professional fonts are optimized to hit the spirit perfectly. Handwriting varies in fidelity to the spirit.
          *   *Severity:* Low. Easily managed by distinguishing "canonical instances" from "degenerate instances."

      *   **Tension E: AI Classification (5) vs. The Utility of Spirit (2).**
          *   *Conflict:* If a CNN does the job without the spirit, is the spirit just a ghost in the machine? What explanatory work does "letter spirit" do?
          *   *Resolution:* The CNN does *classification*, not *concept possession*. The spirit explains *generalization* to radical novelty and *generation* (writing an 'a'), not just sorting.
          *   *Severity:* Medium. Depends on what you think concepts are for.

  4.  **Ranking and Fixing:**

      *   *Biggest Problem:* (1) vs. (2). How can something be essentially 'a' but only partially 'a'?
      *   *Second Biggest:* (2) vs. (6). Where does the spirit live?
