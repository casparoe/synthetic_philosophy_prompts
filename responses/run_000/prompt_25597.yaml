answer: |-
  **1. The shape of the stalemate**
  The deadlock is defined by a series of impossibility theorems, most notably those formalized by Gustaf Arrhenius, which demonstrate that no theory can satisfy a set of seemingly adequate adequacy conditions simultaneously. Total Utilitarianism preserves formal elegance and the intuition that adding lives with positive welfare is neutral or good, but it must accept the Repugnant Conclusion: that a world of billions with lives barely worth living is better than a world of millions with excellent lives. Average Utilitarianism avoids the Repugnant Conclusion but violates the Mere Addition Paradox, implying that adding happy people can make a population worse, and faces the "hellish conclusion" where adding miserable people improves the average if they are less miserable than the current average. Critical-Level views escape these by positing a welfare threshold for contribution, but they incur the Sadistic Conclusion, where adding suffering people is sometimes preferable to adding happy people below the critical level. Person-Affecting Views avoid impersonal absurdities by restricting moral concern to those who exist, but they collapse in the face of the Non-Identity Problem, rendering it incoherent to claim we harmed future contingent people by creating them in suboptimal conditions. Each camp remains entrenched because moving to a rival theory requires trading a bullet they have learned to live with for one they find morally intolerable.

  **2. What kind of disagreement is this?**
  This is primarily a conflict between competing axioms regarding the formal structure of the betterness relation versus substantive intuitions about particular outcomes. On one side, Totalists prioritize structural constraints like Strong Separability and Transitivity, insisting that the value of a population must be a function of the welfare of its constituents independent of the identity of those constituents or the size of the set. They treat the Repugnant Conclusion as a counter-intuitive but logically necessary result of a sound formal system. On the other side, critics prioritize substantive adequacy conditions, such as the intuition that quality cannot be wholly traded for quantity (Non-Elitism). They are willing to sacrifice formal properties like Transitivity or Separability to preserve these judgments. The disagreement is not merely about which intuitions are stronger, but about whether population axiology should be a deductive system derived from abstract structural principles or an inductive system grounded in case-specific moral judgments. When a Totalist demands a transitive betterness relation and a Non-Totalist demands that A not be better than Z in Parfit's sequence, they are arguing over which constraint functions as the fixed point and which is the variable.

  Furthermore, the impasse persists because there is no consensus on the functional purpose of population axiology. Theories are simultaneously asked to perform two distinct jobs: to rank states of affairs impersonally (a theory of the Good) and to guide moral decision-making regarding procreation (a theory of the Right). Total Utilitarianism functions well as an impersonal ranking of states but struggles to generate plausible action-guiding obligations for prospective parents without demanding excessive sacrifice. Person-Affecting Views function well as guides for obligations to specific agents but fail to provide an impersonal ranking of outcomes, leaving them silent on whether one state of the world is objectively better than another if the populations are disjoint. The debate stalls because proponents talk past one another: one side is defending a metric of impersonal value, while the other is defending a constraint on moral agency. Until it is settled whether the goal is to map the landscape of value or to delineate the boundaries of permissible action, the criteria for a "successful" theory will remain contradictory.

  **3. What would count as progress?**
  Given this diagnosis, no new theorem or empirical discovery about well-being will resolve the impasse, because the conflict is not about missing data or logical gaps, but about incompatible foundational commitments. Arrhenius's impossibility results have already confirmed that the desired set of conditions is inconsistent; adding more cases will only reinforce the need to choose which intuition to discard. Real progress would require a conceptual dissolution of the project rather than a solution to it. The debate would advance only if the field explicitly bifurcated into two separate inquiries: a formal axiology of impersonal states of affairs, which accepts that its rankings may not map directly to obligation, and a normative ethics of procreation, which accepts that it may not rely on a complete ranking of impersonal good. If theorists stopped attempting to construct a single unified theory that satisfies both the demands of metaphysical value and the constraints of practical reason, the pressure to "solve" the Repugnant Conclusion would dissipate, replaced by a clearer understanding of why different normative domains yield different verdicts. Until that disambiguation occurs, the impasse is likely permanent.
