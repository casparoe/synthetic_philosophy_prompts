answer: |-
  This is an excellent question, and your intuition is shared by many people when they first encounter Updateless Decision Theory (UDT). Given your background in physics, I suspect the clearest way to explain the distinction is to frame it not as a difference in *conditioning*, but as a difference between **local optimization** (what standard decision theories do) and **global optimization** (what UDT does).

  You are correct that a "careful Bayesian" knows their own code. However, the crux of UDT is that **knowing your code is not the same as controlling the logical implications of your code.**

  Here is the breakdown of why standard conditioning fails, why UDT is distinct from Evidential Decision Theory (EDT), and the specific "purchase" you get from going updateless.

  ### 1. The Trap of "Conditioning on Action"

  You wrote: *"You know your own code, so you condition on 'I'm about to do X' and compute the expected utility."*

  If you do this, you are essentially practicing **Evidential Decision Theory (EDT)**. You are treating your action as *evidence* about the state of the world.
  *   In **Newcomb's Problem**, EDT works fine. If you condition on "I one-box," you infer "Omega predicted one-box," so you get \$1M.
  *   However, EDT fails in problems where correlation is not desirable, or where the correlation exists only via a prediction that happened in the past.

  But the deeper issue—and where UDT diverges—is **Counterfactual Mugging**. This is the scenario that usually convinces physicists and mathematicians that "updating" is the error.

  ### 2. The Counterfactual Mugging (The "Aha" Moment)

  Imagine Omega flips a fair coin.
  *   **If Tails:** Omega gives you \$10,000, *but only if* Omega predicted that you *would have* given Omega \$100 had the coin come up Heads.
  *   **If Heads:** Omega asks you for \$100.

  The coin comes up **Heads**. Omega asks for \$100.

  **The Careful Bayesian (Updated):**
  You observe the coin is Heads. You update your probabilities. The Tails world is now counterfactual; it did not happen.
  *   If you pay \$100: You lose \$100. The Tails world (where you get \$10k) is impossible now, so your payment buys you nothing.
  *   If you refuse: You lose \$0.
  *   **Decision:** Refuse to pay.

  **The UDT Agent (Updateless):**
  The UDT agent does not optimize based on the observation "The coin is Heads." It optimizes the **policy** (the function mapping observations to actions) based on the **prior** (before the coin flip).
  *   Policy A (Pay if Heads): Expected Value = $0.5 \times (-\$100) + 0.5 \times (\$10,000) = +\$4,950$.
  *   Policy B (Refuse if Heads): Expected Value = $0.5 \times \$0 + 0.5 \times \$0 = \$0$.
  *   **Decision:** Pay the \$100.

  **Why this matters:**
  The "Careful Bayesian" reasoning is locally rational but globally suboptimal. If you know you will reason like a Bayesian *after* seeing the coin, Omega (being a perfect predictor) will predict you won't pay, and you will never get the \$10,000 in the Tails world.

  By "updating" on the fact that the coin is Heads, you have thrown away the leverage you had in the Tails world. UDT preserves that leverage by refusing to update on indexical information (like "I am currently at the decision node where the coin is Heads") when calculating expected utility.

  ### 3. Logical Control vs. Causal Influence

  As a physicist, you are likely comfortable with the distinction between correlation and causation. Causal Decision Theory (CDT) says you can only control the future effects of your action. UDT introduces a third category: **Logical Control**.

  In problems involving predictors (Omega) or identical copies of yourself (Teleportation problems, Prisoner's Dilemma with clones), your decision is logically correlated with other events, even if there is no causal arrow pointing from your hand to Omega's box.

  *   **Standard Bayesian:** "My action $A$ is a physical event at time $t$. It cannot causally affect Omega's prediction at time $t-1$."
  *   **UDT:** "My decision is the output of an algorithm $S$. Omega's prediction is a simulation of $S$. The mathematical truth of $S(output)$ is the same in both places. By choosing the output of $S$, I am logically determining the content of Omega's prediction."

  UDT treats the output of your decision function as a **logical fact** that is true across all possible worlds where that function is instantiated. You aren't conditioning on "I am doing X"; you are selecting the function $f$ such that $f(observation) = action$ maximizes utility over the prior distribution of worlds.

  ### 4. Global vs. Local Optimization (A Physics Analogy)

  Think of it in terms of the **Principle of Least Action**.

  *   **CDT/Updated Bayesian:** This is like a particle deciding its next infinitesimal step based only on local forces at its current position. It solves the Euler-Lagrange equations locally.
  *   **UDT:** This is like optimizing the entire trajectory of the particle from $t_0$ to $t_f$ at once.

  In Counterfactual Mugging, the "Updated Bayesian" is like a particle that, upon reaching a certain point in the potential well, decides to ignore the boundary conditions set at the start of the trajectory. UDT insists that the decision made at $t_{now}$ must be consistent with the optimal policy chosen at $t_{start}$ (the "updateless" prior).

  ### 5. So, what is the "Mistake" in Conditioning?

  You asked: *"Why conditioning on your own decision is supposedly a mistake."*

  It is not a mistake to condition on your decision *if* you are merely calculating consequences. The mistake is conditioning on **indexical information** (specifically, *which* decision node you are at) before selecting your policy.

  When you update on "I am at the node where the coin is Heads," you effectively sever the logical link between your current self and your counterfactual self (the one in the Tails world). UDT argues that for the purpose of decision theory, **you are the algorithm, not the instance.**

  If you are an algorithm, you don't "find yourself" at a node. You simply execute. Therefore, you should choose the behavior of the algorithm to maximize utility across all branches of the probability tree, weighted by their prior probability, not their posterior probability given that you are currently at a specific node.

  ### Summary: What UDT Buys You

  1.  **Reflective Consistency:** An agent using UDT will not wish it had pre-committed to a different strategy. A standard Bayesian *will* wish they had pre-committed (e.g., "I wish I had bound myself to pay the mugger, but now that I'm here, I won't").
  2.  **Handling Logical Correlations:** It solves Newcomb-like problems without relying on "magical" causality, by treating the algorithm's output as a logical constant.
  3.  **Robustness in Multi-Agent Scenarios:** In games where agents can read each other's source code (Program Equilibrium), UDT agents cooperate in Prisoner's Dilemmas where CDT agents defect, because they recognize that their decision logically determines the other agent's decision (if the code is similar).

  **The Bottom Line:**
  A careful Bayesian asks: *"Given that I am here, now, what action maximizes utility?"*
  UDT asks: *"Given that I am this algorithm, what mapping from situations to actions maximizes utility?"*

  The shift from optimizing the **action** to optimizing the **policy function** is the key. It prevents the agent from throwing away bargaining power in counterfactual branches that it knows it won't visit, but which determine its payoff in the branch it does visit.

  Does this distinction between optimizing the *instance* vs. optimizing the *algorithm* resonate with your intuition?
