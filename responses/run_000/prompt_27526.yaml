answer: |-
  The debate concerning the ontological status of genetic information is a paradigmatic example of how scientific consensus on mechanism can coexist with profound philosophical divergence on interpretation. While biochemists agree on the mechanics of transcription and translation, philosophers of biology remain divided on whether the genome constitutes a literal code. To diagnose this disagreement merely as verbal would be to underestimate the stakes; to treat it as purely empirical would be to misunderstand the nature of the concepts involved. This dispute is best diagnosed as a **mixed disagreement**: it presents verbally on the surface, regarding the definition of 'code', but rests upon a substantive disagreement concerning the naturalisation of semantics and the privileging of causal factors in development.

  On the pro-code side, John Maynard Smith argued that the genetic system possesses the structural features necessary for a literal interpretation of information. His central contention was not that DNA possesses consciousness, but that the relationship between codons and amino acids is **arbitrary** in a physico-chemical sense. There is no chemical necessity that UUU codes for phenylalanine; it is a contingent historical convention maintained by natural selection. For Maynard Smith, this arbitrariness distinguishes an 'instruction' from a mere 'cause'. A storm causes a tree to fall, but it does not instruct it to fall. By contrast, the ribosome 'reads' the mRNA according to a rule. Maynard Smith was effectively engaging in conceptual analysis, attempting to broaden the ordinary concept of a 'code' to include systems where the 'sender' is evolutionary history rather than a conscious agent. He sought to show that semantic properties could be naturalised.

  Conversely, critics like Sahotra Sarkar and Paul Griffiths argue that this move smuggles in illicit intentional properties. For Sarkar, the term 'code' is at best a heuristic metaphor and at worst a misleading reification. Their objection is twofold. First, they argue that without a sender possessing intentions, the notion of 'meaning' is empty; molecules do not follow rules, they merely react according to physical laws. Second, and perhaps more substantively, this aligns with Developmental Systems Theory (DST). Griffiths contends that calling DNA a 'code' or 'programme' privileges the gene as the sole source of specificity in development, ignoring the causal role of the cytoplasm, the environment, and epigenetic factors. For this side, the dispute is not merely about the word 'code', but about **explanatory privilege**. To accept the 'code' talk is to accept a form of genetic reductionism that they view as biologically inaccurate.

  Therefore, the disagreement is not purely verbal. If it were merely a matter of stipulating definitions, the two sides could agree to use 'code' for 'arbitrary causal mapping' and move on. However, the resistance from Sarkar and Griffiths stems from the fear that the terminology carries ontological baggage that distorts biological inquiry. They are not just analysing the concept of a code; they are doing naturalised metaphysics, asking what actually exists in the cell. Maynard Smith is also doing metaphysics, arguing that semantic relations are real features of the natural world, discoverable by science. The verbal disagreement masks a substantive clash over **teleosemantics**: can meaning exist in nature without a mind?

  Given this diagnosis, what would count as progress? An experimental result is unlikely to settle the matter, as both sides accept the same biochemical data. A formal result in information theory might clarify the syntactic aspects, but the semantic dispute would remain. Progress would instead come from a **philosophical distinction** that decouples the utility of the 'code' metaphor from ontological commitment. We require a framework that acknowledges the explanatory utility of information talk for certain contexts (e.g., synthetic biology or evolutionary modelling) without implying that genes are the exclusive carriers of developmental specificity. Progress is achieved when biologists can utilise 'code' language instrumentally while remaining agnostic about whether the cell is 'really' processing meaning.

  My reasoning is most vulnerable on the premise that the substantive layer is the primary driver of the dispute. It is possible that the disagreement is ultimately sociological: a struggle over which philosophical framework best serves the institutional and pedagogical needs of biology. If the 'code' terminology proves indispensable for engineering novel organisms, the pragmatic success might render the metaphysical debate obsolete, suggesting the dispute was verbal all along.

  What would most likely change my mind about this diagnosis is if a robust theory of biological function emerged that successfully naturalised semantics to the satisfaction of both camps. If a version of teleosemantics were developed that convinced Griffiths that 'meaning' does not imply 'intentionality' in a way that privileges genes, the substantive disagreement would dissolve, leaving only a verbal preference. Alternatively, if synthetic biologists demonstrated that treating DNA as a non-semantic causal template yielded better predictive models than treating it as a code, the substantive claim of the anti-code side would be empirically vindicated, shifting the diagnosis from mixed to substantive.

  In conclusion, the debate is a mixed dispute where verbal ambiguity regarding 'code' protects a deeper conflict over whether semantic properties are intrinsic to biological systems or imposed by observers. Resolution lies not in discovering new nucleotides, but in clarifying the explanatory goals of biological theory.

