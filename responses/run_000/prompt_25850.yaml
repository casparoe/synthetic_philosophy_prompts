answer: |-
  This is a translation exercise from *Epistemology* to *Engineering*. You are used to thinking of state as a vector of variables, transitions as functions, and specifications as constraints on those transitions. The philosophers and AI researchers are asking what happens when you remove the compiler, the type system, and the memory manager.

  Here is the Frame Problem restated in your vocabulary, followed by the residue report.

  ---

  # Part 1: The Translation

  ## 1. The Original AI Formulation (McCarthy & Hayes, 1969)
  **The Engineering Equivalent:** The Specification Verbosity Problem in Explicit State Modeling.

  In Situation Calculus, the world is a state $S$. Actions are functions $a: S \to S$. Properties of the world are fluents (boolean state variables) $f_1, \dots, f_n$.

  When you specify an action `PickUp(x)`, you write a causal axiom:
  $$ \text{Holding}(x, \text{do}(\text{PickUp}(x), s)) \leftarrow \text{true} $$

  **The Problem:** This specifies what *changes*. It does not specify what *stays the same*. In a formal spec like TLA+ or Z, if you have a state vector with $N$ variables and you modify one, you must explicitly assert `UNCHANGED` for the other $N-1$ variables in the transition predicate.

  If you have $M$ actions and $N$ state variables, you need $O(M \times N)$ frame axioms to fully specify the system.
  *   **Your Vocabulary:** This is the pain of writing out `x' = x` for every variable `x` not in the write-set of a transaction.
  *   **The Claim:** McCarthy and Hayes argued that representing common-sense reasoning this way is computationally intractable because the number of non-changes dwarfs the number of changes. Every time you add a new state variable (e.g., `ColorOfWall`), you theoretically need to update the pre/post-conditions of *every existing action* to assert that the action doesn't change the wall color.

  ## 2. The Philosophical Generalization (Dennett, Fodor, Pylyshyn)
  **The Engineering Equivalent:** The Relevance and Dependency Tracking Problem in Open Systems.

  Philosophers generalized this from "how do we write the axioms?" to "how does an agent decide which axioms to check?"

  **The Scenario:** A robot must retrieve a battery from a room containing a bomb.
  *   **Action:** `Move(Battery, Room)`
  *   **Side Effect:** The bomb is on a wagon. Moving the battery moves the wagon. Moving the wagon triggers the bomb.
  *   **Failure Mode 1:** The robot moves the battery, the bomb explodes. It failed to infer a side effect (a missing postcondition).
  *   **Failure Mode 2:** The robot tries to verify *all* non-changes before acting. It checks if moving the battery changed the wall color, the temperature of Mars, the prime factorization of the universe ID. It hangs forever in a pre-condition check loop (combinatorial explosion of relevance).

  **The "Sleeping Dog" Problem:**
  In your code, a variable is a "sleeping dog" (doesn't change) unless you hold a reference to it and write to it. The hardware enforces this.
  In the philosophical frame problem, the agent does not have a memory map. It does not know *a priori* which variables are coupled.
  *   **Your Vocabulary:** This is the problem of **aliasing on a global scale**. In C, you worry if two pointers point to the same struct. In AGI, the worry is that *everything* might be aliased to *everything* via some chaotic chain of causality. The problem is computing the **dependency graph** dynamically without a schema.

  ---

  # Part 2: The Residue Report

  Here is the breakdown of what maps cleanly, what requires distortion, and what vanishes entirely when you view this through a software engineer's lens.

  ## 1. Clean Mappings (Problems You Already Know)

  | Philosophical Concept | Engineering Equivalent | Status |
  | :--- | :--- | :--- |
  | **Frame Axioms** | **`UNCHANGED` clauses** in TLA+/B-Method. | **Isomorphic.** The pain of specifying non-interference is identical. |
  | **Combinatorial Explosion** | **Spec Maintenance.** Adding a field to a global struct requires updating docs/specs for all functions touching the struct. | **Isomorphic.** This is why we hate global state. |
  | **Situation Calculus** | **Transition Systems.** State $S_i \to S_{i+1}$. | **Isomorphic.** |
  | **The Frame Rule** | **Separation Logic.** `{P} C {Q} => {P * R} C {Q * R}`. | **Isomorphic.** This is the formal solution you use daily: local reasoning implies global safety *if* memory is separated. |

  **Verdict:** The *logical* frame problem is solved in engineering by **encapsulation** and **scope**. We solve the $O(M \times N)$ problem by ensuring most actions only have visibility into $O(1)$ state variables.

  ## 2. Distortions (Where the Analogy Bends)

  To make the philosophical problem fit your vocabulary, we have to assume constraints that engineers take for granted but philosophers cannot.

  *   **The Closed World Assumption:**
      *   *Engineering:* The schema is fixed at compile time. No new variables can appear at runtime.
      *   *Philosophy:* The world is open. New predicates (`IsCursed`, `IsRadioactive`) can become relevant at any time.
      *   *Distortion:* You solve the frame problem by defining the universe. They are asking how to solve it when the universe definition is incomplete.

  *   **Discrete vs. Continuous State:**
      *   *Engineering:* State transitions are atomic. Between $T_0$ and $T_1$, nothing happens.
      *   *Philosophy:* The world is concurrent and continuous. Exogenous events (the "frame" changing itself) happen while the agent thinks.
      *   *Distortion:* You rely on the OS scheduler to freeze the world. AGI has no scheduler.

  *   **Semantics vs. Syntax:**
      *   *Engineering:* Variable `x` is a memory address. Change is a bit-flip.
      *   *Philosophy:* Variable `x` is a concept (e.g., "Safety"). Change is semantic drift.
      *   *Distortion:* You track state identity by reference. They track state identity by *meaning*.

  ## 3. The Null Set (What Has No Counterpart)

  This is the critical section. There are aspects of the philosophical Frame Problem that have **no engineering equivalent**. This is not because your vocabulary is insufficient, but because engineering deliberately excludes these problems to make systems buildable.

  ### A. The Problem of Relevance (Semantic Coupling)
  In your code, relevance is determined by **scope** and **pointers**. If a function doesn't have a pointer to a variable, it can't change it, and it doesn't need to check it.
  *   **The Gap:** In the real world, there are no pointers. There is only causality. How does the system know that `PickUp(Block)` is causally linked to `Trigger(Bomb)` without simulating the entire physics engine?
  *   **Why it's missing in SE:** We hard-code relevance via API design. We decide `Block` and `Bomb` are in the same module. AGI must *discover* the module boundaries.

  ### B. The "Qualification Problem"
  This is a sibling to the Frame Problem. To specify `Move(x, y)`, you need infinite preconditions: `x is not glued`, `x is not too heavy`, `gravity is on`, `no demons exist`.
  *   **The Gap:** In engineering, we throw exceptions or assume preconditions hold (undefined behavior). We accept partial specifications.
  *   **Why it's missing in SE:** We operate under SLAs. If a "demon" appears (hardware fault), the system crashes. We don't try to specify the "no demons" axiom. AGI is expected to handle the open-ended exceptions without crashing.

  ### C. Default Logic and Non-Monotonicity
  In Hoare logic, if `{P} C {Q}` is true, adding more truths to `P` doesn't invalidate it (monotonicity).
  In common sense reasoning, if I say "If I drop the cup, it will break," that holds *unless* it's made of plastic, *unless* I'm in zero-g, *unless* a god catches it.
  *   **The Gap:** Engineering logic is monotonic. Common sense is non-monotonic (new information retracts old conclusions).
  *   **Why it's missing in SE:** Databases and logic engines are designed to be monotonic for consistency (ACID). The Frame Problem arises when you try to build a reasoning engine that is both consistent and capable of retracting assumptions based on context.

  ---

  # Conclusion: Is Your Vocabulary Missing Something?

  **No.** Your vocabulary is complete for *building systems*. The philosophical Frame Problem arises only when you confuse *modeling the world* with *interfacing with the world*.

  1.  **The Logical Frame Problem** is a solved engineering problem. We solve it with **Separation Logic**, **Immutable Data Structures**, and **Encapsulation**. We force the world to be modular so we don't have to write $N \times M$ axioms.
  2.  **The Philosophical Frame Problem** is an artifact of demanding **General Intelligence** without **General Schema**.
      *   In software, we define the state space.
      *   In AGI, the system must *infer* the state space from pixels/sensors.

  The "Residue" is not a missing technical concept; it is the **Ontology Gap**.
  *   **You:** "Here is the struct. Here is the method. Verify it."
  *   **Philosopher:** "Here is the universe. Figure out what the structs are, which methods are safe, and which variables are aliased, without crashing."

  When Dennett talks about the "sleeping dog," he is pointing out that computers know a dog is sleeping because the `is_sleeping` bit wasn't written to. A biological agent knows the dog is sleeping because nothing in the environment *suggests* the dog woke up.

  **Final Verdict:** The Frame Problem is the difficulty of automating the **Frame Rule** in a system where **memory safety** is not guaranteed by hardware, **scope** is not defined by braces, and **types** are not defined by a compiler. It is not a problem for software engineers; it is a problem for anyone trying to build a software engineer.
