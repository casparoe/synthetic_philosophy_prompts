answer: |-
  ### Section Plan: The Heterogeneity Problem for Hedonism
  **Time:** 50 Minutes
  **Goal:** Demonstrate that Hedonism's commitment to a "single currency" of value creates a structural problem when faced with the diverse phenomenology of actual pleasures.

  ---

  ### I. The Single-Currency Commitment (0:00–0:10)
  **Objective:** Establish the theoretical constraint *before* introducing the examples. The problem must arise from the theory's requirements, not just observation.

  1.  **Define Hedonism about Well-Being:** State it strictly as a monistic theory. There is exactly one intrinsic good. All other goods are instrumental to this one.
  2.  **The Measurement Implication:** Explain that for something to function as the *sole* currency of value, it must be **commensurable**.
      *   *Analogy:* If money is the only currency, a dollar in New York and a dollar in London must be convertible to a single standard to calculate total wealth.
      *   *Dependency:* Students must grasp that Hedonism requires a **common denominator** to make trade-offs (e.g., "Is 5 minutes of X worth 10 minutes of Y?").
  3.  **Head Off Misconception #1 (Pleasure = Desire Satisfaction):**
      *   *Trigger:* A student suggests, "Something is good because we want it."
      *   *Intervention:* Stop immediately. Clarify: "Desire Theory says the *satisfaction* is the good. Hedonism says the *conscious experience* is the good. You can get what you want and feel nothing. For this hour, we assume the *feeling/experience* is the value, not the goal achievement."
      *   *Why here:* If they conflate pleasure with desire satisfaction, the heterogeneity problem dissolves (because "desire satisfaction" is a formal relation, not a diverse experience). You must isolate the *phenomenology* first.

  ### II. The Contrasting Pair: Thirst vs. The Joke (0:10–0:25)
  **Objective:** Use one pair to instantiate the diversity of experience without introducing moral hierarchy.

  1.  **The Pair Selection:**
      *   **Experience A:** The relief of quenching intense thirst (drinking cold water).
      *   **Experience B:** The moment a complex joke "lands" (the cognitive click of understanding).
  2.  **Required Features of the Pair:**
      *   **Must Have:** Distinct phenomenological structures. (A is the removal of a painful deficit/tension; B is a sudden cognitive reorganization/spark).
      *   **Must Not Have:** Obvious moral weight or "high/low" cultural status. (Avoid "Pushpin vs. Poetry" or "Pig vs. Socrates").
      *   **Why this pair:** Food/Drink is too easily reduced to biology; Art is too easily reduced to "higher faculties." Thirst vs. Joke isolates *bodily relief* vs. *cognitive shift* without immediately invoking Mill's qualitative hierarchy.
  3.  **Activity:** Ask students to describe the *feeling* of each.
      *   *Prompt:* "Describe the sensation of the water. Now describe the sensation of the joke landing. Are they the same sensation?"
      *   *Expected Result:* They will admit the feelings are fundamentally different.
  4.  **Head Off Misconception #2 (Pleasure = A Specific "Tingle"):**
      *   *Trigger:* A student claims, "But they both have a nice warm glow."
      *   *Intervention:* Challenge this empirically. "Is the relief of thirst a 'warm glow'? Or is it the cessation of pain? Is the joke a 'glow'? Or is it a surprise?"
      *   *Why here:* If pleasure is a uniform sensation (a "tingle" that accompanies all experiences), there is no heterogeneity problem. You must force them to admit the *experiences themselves* differ in quality, not just intensity.

  ### III. The Emergence of the Problem (0:25–0:40)
  **Objective:** Force the collision between the Diversity (Section II) and the Single Currency (Section I).

  1.  **The Summation Challenge:**
      *   Pose the scenario: "You have 10 minutes. You can drink water or hear jokes. Hedonism says you should choose the one with more 'pleasure units.' How do you calculate the units?"
  2.  **The Dilemma:**
      *   If the experiences are totally different (as established in Section II), what is the common element we are measuring?
      *   If there is no common element, Hedonism cannot compare them.
      *   If there *is* a common element, what is it? (It cannot be the specific feeling, as established).
  3.  **Dependency Check:** Ensure they see this is a problem *for Hedonism*.
      *   *Prompt:* "If I were a Pluralist, I could say water is good for one reason, jokes for another. Why can't the Hedonist say that?"
      *   *Answer:* Because they committed to One Good in Section I.
  4.  **Avoiding the "Solution":** Do not let them solve it yet. If they suggest "Intensity" or "Duration," press: "Intensity of *what*? The relief or the click? How do you measure the intensity of a click against the intensity of relief?"

  ### IV. Closing Assessment (0:40–0:45)
  **Objective:** Verify they understand the structural demand, not just the vocabulary.

  *   **The Question:** "If a Hedonist claims that 'pleasure' is the name of a single ingredient found in both drinking water and hearing a joke, what must be true about that ingredient for Hedonism to work?"
  *   **Correct Answer Indicator:** They must identify that the ingredient must be **identical in kind** across both experiences, despite the experiences feeling different. (e.g., "It has to be the same 'stuff' even if the packaging looks different.")
  *   **Incorrect Answer Indicator:** They answer that one is "better" or that it depends on "what you like." (This shows they reverted to Pluralism or Desire Theory).

  ### V. Scope and Omissions (0:45–0:50)
  **Objective:** Flag boundaries without creating a sense of incompleteness.

  1.  **What to Leave Out:**
      *   **Mill's Qualitative Hedonism:** Do not explain how Mill tries to solve this by ranking pleasures.
      *   **Nozick's Experience Machine:** Do not introduce external reality checks.
      *   **Representational Theories of Pleasure:** (e.g., Feldman's "attitudinal pleasure").
  2.  **How to Flag It:**
      *   *Script:* "We have identified a structural crack in the foundation: How can one currency buy such different goods? Next week, we will look at how philosophers like Mill tried to patch this crack by changing the definition of the currency. Today, we just needed to see that the crack exists."
      *   *Rationale:* This frames the omission as the *next logical step* in the course narrative, rather than ignored content. It validates the current session as the "diagnosis" phase before the "treatment" phase.

  ---

  ### TA Cheat Sheet: Dependency Map
  *   **Do not** introduce the Pair (Thirst/Joke) until **after** defining the Single-Currency Commitment. (Otherwise, it's just a list of differences).
  *   **Do not** allow the "Desire" misconception to pass during the Definition phase. (Otherwise, the problem becomes about preference, not phenomenology).
  *   **Do not** allow the "Uniform Tingle" misconception to pass during the Pair phase. (Otherwise, the problem disappears).
  *   **Do not** offer solutions (Mill/Quality) during the Problem phase. (Otherwise, the tension is resolved prematurely).
