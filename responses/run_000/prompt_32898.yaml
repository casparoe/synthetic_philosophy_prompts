          *   *Weaknesses:* Needs to explain *how* the higher level relates to the lower level without dualism.

      *   **Move 3: Dave's Rebuttal (The Arrangement Argument).**
          *   *Claim:* Novels/Symphonies rely on arrangement (meaning). Love's arrangement is just *more physical stuff*. No "extra ingredient." "Love" is just a label.
          *   *Philosophical Stance:* Physicalism / Nominalism about higher-level properties.
          *   *Strengths:* Consistent physicalist worldview. Avoids magic.
          *   *Weaknesses:* Dismisses the reality of functional patterns. Implies only the bottom layer is "real."

      *   **Move 4: Mina's "Skyhook vs. Crane" (Dennett Reference).**
          *   *Claim:* Dave demands an "extra ingredient" (skyhook). We need a "crane" (explanation of construction).
          *   *Philosophical Stance:* Darwinian/Evolutionary Naturalism.
          *   *Strengths:* Excellent metaphor for naturalistic emergence. Shifts burden of proof.
          *   *Weaknesses:* Dave might argue a crane still builds physical stuff, not "meaning."

      *   **Move 5: Dave on Patterns.**
          *   *Claim:* If love is nothing over and above physical stuff, it's just a name for a pattern. The pattern has no reality beyond the physical.
          *   *Philosophical Stance:* Mereological Nihilism (or close to it) / Strict Reductionism.
          *   *Strengths:* Logically consistent if you believe only fundamental particles are real.
          *   *Weaknesses:* Counter-intuitive. Makes science impossible (science studies patterns).

      *   **Move 6: Mina on Hurricanes (Real Patterns).**
          *   *Claim:* Patterns are real (Hurricane example). Higher-level description is necessary for prediction/understanding.
          *   *Philosophical Stance:* Realism about Higher-Level Properties / Pragmatism.
          *   *Strengths:* Strong argument for the utility and reality of emergent properties.
