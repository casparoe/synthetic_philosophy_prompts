          *   *Strengths:* Hits the actual weak point of physicalism. Qualia are hard to reduce.
          *   *Weaknesses:* Shifts the goalposts from "love as a concept/behavior" to "love as qualia."

      *   **Move 8: Mina on Goalposts.**
          *   *Claim:* That's the Hard Problem, not reductionism per se. Dave started with love as a label for behavior/states.
