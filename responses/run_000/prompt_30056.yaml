      *   **Advice:** Modify (3). Don't claim character-based is the *sole* or *best* explanation for *all* virtual wrongs. Allow for "Representational Harm" or "Symbolic Wrongness" to handle the Gamer's Dilemma, which also strengthens the explanation for (2).
