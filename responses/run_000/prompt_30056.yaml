      *   *Recommendation:* The strongest philosophical move is to refine (3). The "Gamer's Dilemma" literature (Luck, Ali, etc.) often suggests that representational content matters (the *meaning* of the act), not just the character effects. If the user sticks hard to "Character-based is the *best* explanation," they paint themselves into a corner on the Dilemma.
