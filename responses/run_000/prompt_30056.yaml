      *   **Tension C: The "Secret" Aspect (2 vs. 3).**
          *   (2) says "even if nobody else ever finds out." (3) says "reflects badly on the agent."
          *   *Severity:* Low. Virtue ethics handles this fine. Secret vices are still vices.

  4.  **Determine Which to Give Up/Modify:**

      *   *Option 1: Modify (3).* Instead of saying character-based is the *best* explanation, say it is *a* major explanation, but acknowledge representational content matters (linking to 4). This resolves the 3 vs. 4 tension.
