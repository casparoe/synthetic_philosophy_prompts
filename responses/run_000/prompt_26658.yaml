answer: |-
  It is understandable why you find the betting argument compelling; indeed, the link between credence and action is a cornerstone of Bayesian epistemology, and the Sleeping Beauty problem is famously resistant to intuitive resolution. However, your professor is correct that classifying this as a case of pragmatic encroachment conflates distinct philosophical categories, and recognizing why requires disentangling three specific issues: the relationship between credence and betting odds, the specific definition of pragmatic encroachment, and the nature of self-locating evidence.

  First, you are assuming that rational betting odds must always align one-to-one with credence. While this holds in standard decision-theoretic contexts, the Sleeping Beauty problem is designed specifically to break that link through *self-locating uncertainty*. A committed halfer can consistently maintain a credence of $1/2$ while accepting bets at $1/3$ odds by arguing that the *decision context* differs between the Heads and Tails worlds, not the *epistemic probability*. In the Tails world, the bet is offered twice; in the Heads world, only once. Therefore, a halfer calculates expected utility by weighting the utility of the bet in the Tails world double that of the Heads world, even if the probability of Tails remains $1/2$. On this view, the "thirder" betting behavior is driven by the structure of the payoff matrix (decision theory), not by a shift in the degree of belief (epistemology). This preserves the halfer's epistemic position without making them vulnerable to a money pump, demonstrating that the betting argument is not decisive for credence in cases of non-standard sampling.

  Second, your classification of this as pragmatic encroachment misidentifies the mechanism at play. Pragmatic encroachment (as defended by Stanley, Fantl, and McGrath) typically argues that high practical stakes raise the *evidential threshold* required for knowledge or justification, holding the evidence fixed. In Sleeping Beauty, however, thirders do not usually argue that the *stakes* force the credence to $1/3$; rather, they argue that the *evidence itself* supports $1/3$. A thirder claims that upon waking, Beauty gains new self-locating evidence ("I am awake now") which is more likely to occur in a Tails world than a Heads world (since there are more awakening opportunities in the former). Thus, the shift to $1/3$ is argued to be purely epistemic, based on conditionalization over centered worlds, not a pragmatic adjustment due to risk or value. If the credence is $1/3$ because the evidence supports it, then pragmatic encroachment is not doing any work.

  Finally, the reason halfers concede the betting point is precisely because they accept the distinction you are blurring. They agree Beauty should *act* as if the probability is $1/3$ because the *consequences* of being wrong are doubled in the Tails world, not because they believe the *truth* of the matter is more likely to be Tails. This concession does not "give away the game" for the halfer; it merely locates the divergence in the philosophy of action rather than the philosophy of belief. By contrast, pragmatic encroachment claims that the stakes change the *belief status* itself (e.g., whether you "know" the bank is open), whereas in Sleeping Beauty, the halfer insists the belief status ($1/2$) remains distinct from the optimal action strategy.

  You are missing that the Sleeping Beauty problem illustrates a divergence between credence and betting odds caused by indexical evidence, which halfers resolve via decision theory and thirders via epistemology, whereas pragmatic encroachment concerns how practical stakes alter epistemic standards independently of such structural sampling issues.

  \summary{The Sleeping Beauty problem demonstrates a divergence between credence and betting odds arising from self-locating information rather than pragmatic encroachment, since halfers can account for thirder betting behavior through decision-theoretic adjustments without altering epistemic probabilities.}
