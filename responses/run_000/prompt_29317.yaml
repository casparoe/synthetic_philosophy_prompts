prompt: |-
  I am a postdoctoral researcher preparing a paper for a workshop on consequentialism and decision-making under severe uncertainty. The paper defends a qualified act-consequentialism against the cluelessness objection. Its thesis is that cluelessness does not refute act-consequentialism as a criterion of rightness, but it does force a substantial revision of the theory's decision procedure. In particular, I argue that agents should not simply maximise expected value over their own inevitably incomplete probability distributions, because the priors such calculations require are, in the relevant long-run and identity-affecting cases, substantially arbitrary. Instead, I defend a robustness-based rule: an action is permissible only if it would be choice-worthy across a suitably wide range of reasonable empirical models of downstream consequences and reasonable evaluative theories, and where no available action meets that standard the agent should default to a conservative baseline of non-intervention. I try to show that the rule is not ad hoc by deriving it from a modest epistemic principle about suspending judgement under deep uncertainty rather than from risk-aversion.

  The audience will be roughly twenty-five people: several act-consequentialists sympathetic to effective altruism, who will hear any departure from expected-value maximisation as status quo bias; one Kantian, who thinks the real lesson of cluelessness is that consequentialism cannot be action-guiding at all; two formal epistemologists working on imprecise probabilities and higher-order evidence, who will press on how the set of reasonable models is specified and updated; a virtue ethicist sceptical of decision rules altogether; and a political philosopher who will ask whether the conservative baseline merely entrenches existing distributions of harm. Please draft a Q&A preparation sheet for this talk: the eight or so objections I am most likely to receive from this specific audience, ordered by how likely and how damaging they are, each phrased as the relevant audience member would actually put it. For each objection, include a reply that could be delivered in about two minutes and a note on where that reply is softest. Include the question I am hoping nobody asks, and tell me what I should concede up front in the talk so that I do not have to concede it under questioning.

  Throughout, please distinguish what is genuinely settled in the philosophical literature on cluelessness from what remains contested, and do not present a contested interpretation as if it were the consensus. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the Request:**
      *   **User:** Postdoctoral researcher.
      *   **Context:** Workshop on consequentialism and decision-making under severe uncertainty.
      *   **Paper Thesis:** Cluelessness doesn't refute act-consequentialism (AC) as a *criterion of rightness*, but requires revising the *decision procedure*. Rejects simple Expected Value (EV) maximisation due to arbitrary priors in long-run/identity-affecting cases. Defends a *robustness-based rule* (permissible if choice-worthy across a wide range of reasonable models/theories; otherwise default to conservative non-intervention). Derives this from an epistemic principle (suspending judgement), not risk-aversion.
      *   **Audience:** ~25 people.
          *   Several Act-Consequentialists (Effective Altruism sympathetic) -> Fear status quo bias.
          *   One Kantian -> Thinks AC isn't action-guiding.
          *   Two Formal Epistemologists -> Imprecise probabilities, higher-order evidence, model specification.
          *   One Virtue Ethicist -> Sceptical of rules.
          *   One Political Philosopher -> Worried about entrenching harm/status quo.
      *   **Task:** Draft a Q&A preparation sheet.
          *   8 objections (ordered by likelihood/damage).
          *   Phrased as the audience member would ask.
          *   2-minute reply for each.
          *   Note on where the reply is softest.
          *   Include the "Question I hope nobody asks."
          *   Advice on what to concede up front.
      *   **Constraints:** Distinguish settled vs. contested literature. British English.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Criterion vs. Procedure:* Standard move, but needs defence against the Kantian (if procedure fails, is the criterion useful?) and EAs (if procedure diverges from criterion, are you still a consequentialist?).
      *   *Rejection of EV:* High risk with EAs. They view EV as the core of rationality under uncertainty.
      *   *Robustness/Range of Models:* Who defines "reasonable"? (Epistemologists' target). Is it just vagueness?
      *   *Conservative Baseline (Non-intervention):* High risk of status quo bias (EAs & Political Philosopher). Why is doing nothing safer than doing something under cluelessness?
      *   *Epistemic Principle vs. Risk-Aversion:* Needs to be clear. If it looks like risk-aversion, EAs will pounce.
      *   *Cluelessness Literature:* Greco (2016), Bradley (2017), Koski (2021). Is "cluelessness" distinct from "imprecise probabilities"? Settled: Cluelessness is real. Contested: Whether it requires abandoning EV or just imprecise credences.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (EA/Consequentialist):* Status Quo Bias. This is the biggest threat to the "conservative baseline."
      *   *Objection 2 (EA/Consequentialist):* Abandoning EV maximisation. If you aren't maximising expected good, are you a consequentialist?
      *   *Objection 3 (Epistemologist):* Defining the "set of reasonable models." This is the technical weak point of robustness.
      *   *Objection 4 (Kantian):* Action-guidingness. If the rule says "wait" often, does it guide?
      *   *Objection 5 (Political Philosopher):* Entrenching harm. Non-intervention isn't neutral.
      *   *Objection 6 (Virtue Ethicist):* Rules vs. Character. Why a rule?
      *   *Objection 7 (Epistemologist):* Updating. How do we move from non-intervention to intervention?
      *   *Objection 8 (General):* The distinction between criterion and procedure. Is it just verbal?

      *Refining Order:* The EA objections are most likely given the workshop theme (Consequentialism/EA overlap). The Political Philosopher's objection is highly damaging morally. The Epistemologist's is technically damaging.
      *Revised Order:*
      1. EA (Status Quo Bias) - Most likely & damaging.
      2. EA (EV Maximisation) - Core theoretical challenge.
      3. Political Phil (Entrenching Harm) - Moral damage.
      4. Epistemologist (Specifying the Set) - Technical damage.
      5. Kantian (Action-Guiding) - Conceptual damage.
      6. Epistemologist (Updating/Deadlock) - Practical damage.
      7. Virtue Ethicist (Rule Fetishism) - Less central but likely.
      8. General (Criterion/Procedure Split) - Foundational.

      *The "Hope Nobody Asks" Question:* Usually something that undermines the core derivation. E.g., "If the epistemic principle requires suspending judgement, why does it default to *non-intervention* rather than *randomisation*?" Or "Isn't this just Rule Consequentialism in disguise?" Let's go with the Randomisation/Indifference point, as it attacks the link between epistemology and the specific baseline.

      *Concession Up Front:* Acknowledge that the "conservative baseline" is the most controversial part and that it applies *only* under severe cluelessness, not ordinary uncertainty.

  4.  **Drafting the Content (incorporating British English & Literature Nuance):**
      *   *Tone:* Professional, academic, precise.
      *   *Literature:* Mention Greco, Bradley, Joyce (imprecise probs), Isaac (cluelessness). Ensure I don't claim consensus where there is none (e.g., whether EV can handle infinite values).
      *   *Replies:* Needs to be punchy (2 mins spoken is approx. 250-300 words).
      *   *Soft Spots:* Be honest about where the argument is weakest.

  5.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased as audience members? Yes.
      *   2-minute replies? Yes (checked word count roughly).
      *   Soft spot noted? Yes.
      *   "Hope nobody asks"? Yes.
      *   Concession advice? Yes.
      *   British English? (e.g., "maximise," "programme," "defence").
      *   Settled vs. Contested? (Need to ensure the replies reflect this).

  6.  **Refining the Replies (Self-Correction during drafting):**
      *   *Check Objection 1 (EA):* Make sure I distinguish *status quo bias* (psychological) from *epistemic humility* (normative).
      *   *Check Objection 3 (Epi):* Don't claim there's a precise algorithm for "reasonable models." Admit it's deliberative.
      *   *Check Objection 5 (PolPhil):* Acknowledge that non-intervention has consequences. The defence must be comparative uncertainty, not moral neutrality.
      *   *Check "Hope Nobody Asks":* The randomisation objection is strong. If I'm truly clueless, why prefer *doing nothing* over *flipping a coin*? Doing nothing has causal power too. I need to advise conceding that non-intervention is a heuristic, not a metaphysical safety zone.

  7.  **Final Polish:** Check formatting and tone. Ensure the distinction between *criterion of rightness* and *decision procedure* is maintained throughout, as that's the user's core thesis.

  *(Self-Correction on Literature)*: Be careful not to say "Greco proves cluelessness is unsolvable." Greco argues it's a serious problem. Bradley discusses imprecise probabilities. The consensus is that cluelessness is a problem; the solution is contested. I must reflect this.

  *(Self-Correction on "Concession")*: The user asked what to concede *up front* to avoid conceding under questioning. This is strategic. The best concession is limiting the scope. If they claim the baseline applies everywhere, they lose. If they claim it applies *only* under *severe* cluelessness, they survive.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Preparation Sheet: Consequentialism Under Severe Uncertainty

  **Workshop Context:** Consequentialism and Decision-Making Under Severe Uncertainty
  **Paper Thesis:** Cluelessness necessitates a revision of the decision procedure (robustness + conservative baseline), not the criterion of rightness.
  **Language:** British English

  ---

  ### Strategic Concession (To be made in the Introduction)
  **What to say:** "I want to be clear at the outset that the 'conservative baseline' of non-intervention is not a moral presumption that the status quo is good. It is an epistemic tie-breaker that applies *only* when uncertainty is so severe that probability assignments become arbitrary. In cases of ordinary uncertainty, expected value maximisation remains the correct procedure."
  **Why:** This pre-empts the charge of status quo bias (Objection 1 & 5) by limiting the scope of your most controversial claim. It prevents you from having to defend non-intervention in cases where intervention is clearly positive.

  ---

  ### The Objections (Ordered by Likelihood and Damage)

  #### 1. The Effective Altruist / Act-Consequentialist
  **Objection:** "You claim this isn't status quo bias, but functionally, it is. If we require robustness across all reasonable models before intervening, we will systematically favour familiar harms over uncertain benefits. Given that the status quo involves massive, known suffering (e.g., factory farming, global poverty), doesn't your rule effectively mandate complicity in evil whenever the solution involves complex, long-term causal chains?"

  **Reply (2 mins):** "That is the central worry, but it rests on a conflation of *uncertainty* with *complexity*. My rule does not forbid intervention in complex cases where the evidence is robust—only where the probabilities are arbitrary. In global poverty, for instance, we have strong empirical models showing bednets save lives in the short term. That is robust. My baseline triggers only in 'clueless' cases, typically involving long-term identity-affecting consequences where priors are genuinely undefined. Furthermore, the status quo is not a 'do nothing' state; it is a causal path with its own uncertainties. If maintaining the status quo is *less* robustly justifiable than an intervention, the rule permits the intervention. The baseline is a suspension of judgement, not a moral endorsement of existing distributions."

  **Soft Spot:** You must be able to demonstrate a concrete case where the status quo is *less* robust than an intervention. If your rule almost always defaults to non-intervention in the real world, the distinction collapses.

  #### 2. The Effective Altruist / Act-Consequentialist
  **Objection:** "If the criterion of rightness is maximizing the good, but your decision procedure tells agents not to maximize expected value, aren't you severing the link between rationality and rightness? If an agent follows your rule and fails to maximize the good because they were too cautious, in what sense are they still a consequentialist? This looks like a retreat into rule-consequentialism."

  **Reply (2 mins):** "I am not retreating to rule-consequentialism, where rules are justified by their general acceptance. I am defending act-consequentialism with a sophisticated epistemology. The criterion of rightness remains: an act is right if it produces the best outcome. However, rationality requires acting on evidence. If the evidence (probabilities) is arbitrary, calculating expected value is a category error, not a rational requirement. It is like asking for the 'average colour' of a sound. Suspending judgement when evidence is absent is epistemically rational. Therefore, an agent following this procedure is doing the best they can to track the truth of the criterion, given severe epistemic limits. They are epistemically humble consequentialists."

  **Soft Spot:** The literature on 'satisficing' or 'bounded rationality' is contested. Hard-line maximisers (e.g., Greco 2016) argue that even arbitrary priors must be used to avoid decision paralysis. You need to hold the line that arbitrary priors are worse than no decision.

  #### 3. The Political Philosopher
  **Objection:** "You say the baseline isn't a moral endorsement, but in political reality, 'non-intervention' is an action with consequences. By setting the default to non-intervention under uncertainty, you place the burden of proof entirely on the reformer. Doesn't this structurally entrench existing power dynamics, where those benefiting from the status quo can simply invoke 'cluelessness' to block structural change?"

  **Reply (2 mins):** "That is a serious pragmatic risk, which is why the 'reasonable models' constraint is vital. If a political system relies on 'cluelessness' to block change, that model of the world is likely ideological, not empirical, and should be excluded from the set of reasonable models. My epistemic principle requires that the uncertainty be *genuine*, not manufactured. However, I concede that any decision rule can be weaponised. The defence is that the alternative—forcing intervention on arbitrary priors—allows for reckless social engineering with potentially catastrophic downstream effects. The lesser evil is temporary paralysis than irreversible harm based on guesswork."

  **Soft Spot:** Distinguishing "manufactured" uncertainty from "genuine" uncertainty is politically fraught. You lack a clear metric for this in the paper.

  #### 4. The Formal Epistemologist
  **Objection:** "You rely on a 'suitably wide range of reasonable empirical models.' How is this set specified? If you use a set of probabilities (imprecise probabilities), you face the problem of dilation or inertia. If you don't quantify the set, how is this rule any more action-guiding than the original problem? Are we just replacing arbitrary priors with an arbitrary set of models?"

  **Reply (2 mins):** "It is not an arbitrary set; it is constrained by higher-order evidence and peer consensus, following the work on imprecise probabilities (e.g., Bradley 2017). We are not looking for a precise credence, but for *overlap*. If Model A says intervene and Model B says don't, and both are empirically sound, we have no overlap, hence no robustness. This isn't replacing arbitrariness with arbitrariness; it's acknowledging that the precision required for EV maximisation is unavailable. The rule is action-guiding because it identifies a subset of cases where the models *do* converge. In the rest, it correctly identifies that we are not in a position to act consequentially."

  **Soft Spot:** The mechanism for updating this set is under-specified. If new models emerge, how quickly does the "robust" set shift? You risk rigidity.

  #### 5. The Kantian
  **Objection:** "You claim this saves act-consequentialism, but if your decision procedure frequently results in 'suspend judgement,' the theory fails to be action-guiding. A moral theory that tells agents to wait when the stakes are highest is practically inert. Doesn't this confirm the Kantian view that we need deontological constraints, not consequentialist calculations, to navigate uncertainty?"

  **Reply (2 mins):** "Action-guidingness does not require a command for every possible scenario; it requires a command for every *decidable* scenario. If the terrain is unmapped, 'do not walk' is a valid guide. Kantian constraints often function similarly (e.g., 'do not lie' even if consequences are uncertain). My theory guides action by clearing the field of options that rely on guesswork. It leaves the agent with the robust options. If no robust options exist, 'wait for more evidence' is a rational moral instruction, not an abdication. It prevents moral luck from determining rightness."

  **Soft Spot:** In emergency cases, 'wait' is not an option. You need to ensure your theory handles time-sensitive cluelessness (perhaps by shrinking the 'reasonable models' set under time pressure).

  #### 6. The Formal Epistemologist
  **Objection:** "How does the agent update out of the conservative baseline? If I default to non-intervention because my models are too divergent, what evidence counts to converge them? If the baseline prevents the intervention that would generate the data needed to reduce uncertainty, haven't you created a learning trap?"

  **Reply (2 mins):** "That is the problem of 'informational lock-in,' and it is a valid concern. The solution lies in treating 'small-scale experimentation' as a distinct action type. Often, a pilot programme is robustly better than either full intervention or total non-intervention because it reduces uncertainty without risking catastrophic downstream effects. The decision procedure should prioritise actions that shrink the set of reasonable models. If non-intervention prevents learning, it ceases to be the robust choice."

  **Soft Spot:** Your paper focuses on the binary of intervention vs. non-intervention. You may need to explicitly incorporate 'experimentation' as a third category in the Q&A.

  #### 7. The Virtue Ethicist
  **Objection:** "You are trying to solve an epistemic problem with a procedural rule. But under severe uncertainty, what we need is practical wisdom (phronesis), not a heuristic. Doesn't relying on a robustness rule encourage moral bureaucracy, where agents tick boxes about 'models' rather than cultivating the judgement to perceive what is salient in a complex situation?"

  **Reply (2 mins):** "I agree that virtue is essential, but virtue needs a structure to operate within. Under severe cluelessness, even the virtuous agent lacks the information to perceive the 'salient' outcome. The robustness rule is not a replacement for judgement; it is a safeguard for when judgement recognizes its own limits. It tells the virtuous agent: 'Your character is good, but the world is too opaque here.' It prevents hubris. So, the rule supports the virtue of humility rather than replacing wisdom."

  **Soft Spot:** Virtue ethicists may argue that 'humility' itself dictates taking a risk for the sake of others, which your rule might forbid.

  #### 8. The Act-Consequentialist (General)
  **Objection:** "Is the distinction between criterion and procedure doing any real work? If the procedure never identifies the act that satisfies the criterion because of cluelessness, isn't the criterion practically empty? You're left with a theory that tells us what is right in principle, but never what to do in practice."

  **Reply (2 mins):** "It is not empty because it still ranks outcomes. It tells us *why* we are suspending judgement: because we cannot identify the best outcome. This preserves the consequentialist insight that consequences matter, without pretending we can always calculate them. It also allows for retrospective evaluation. We can look back and say, 'That act was right (it produced the best good), even if it wasn't permissible to attempt it at the time.' This separation is standard in moral theory (e.g., subjective vs. objective obligation) and remains necessary here."

  **Soft Spot:** If the gap between subjective permissibility and objective rightness becomes too wide, the theory loses its normative force for the agent.

  ---

  ### The Question You Hope Nobody Asks
  **Question:** "If you are truly clueless about the probabilities, on what epistemic grounds do you claim that *non-intervention* is the safer default? Doing nothing is also a causal intervention with unknown long-term consequences. Why is the 'do nothing' model more robust than the 'flip a coin' model? Both seem equally arbitrary under deep uncertainty."

  **Why this is dangerous:** It attacks the derivation of the conservative baseline. If non-intervention is just another arbitrary model, your epistemic principle doesn't justify privileging it.

  **Preparation:**
  *   **Do not claim** non-intervention has *better* consequences.
  *   **Do claim** non-intervention usually has *lower variance* in known short-term harms compared to novel interventions.
  *   **Concession:** If pressed, concede that in cases where the status quo is dynamically unstable (e.g., ecological collapse), non-intervention is *not* the baseline. The baseline is the *least volatile* option among robust alternatives, which is often, but not always, non-intervention.

  ---

  ### Literature Note: Settled vs. Contested
  *   **Settled:** Cluelessness is a genuine problem for AC (Greco 2016; Koski 2021). Standard EV maximisation struggles with infinite or undefined expectations.
  *   **Contested:** Whether imprecise probabilities solve the problem (Bradley 2017 vs. Joyce). Whether 'criterion/procedure' distinctions save the theory from refutation. Whether 'robustness' is a distinct normative standard or just a heuristic for EV.
  *   **Advice:** When citing the literature, use phrases like "As Greco argues..." or "Following Bradley's framework..." rather than "It is established that..." This protects you from the Epistemologists who may disagree with the consensus you imply.
