answer: |-
  You have identified a profound and pervasive error in literary reasoning, and your intuition regarding evolutionary biology is exactly correct. The pattern of reasoning you describe is indeed a recognized epistemological mistake, and there is a robust vocabulary available to you from philosophy of science, evolutionary biology, and aesthetics to articulate it.

  Here is a mapping of the terrain, moving from the biological analogy you suspected to the specific philosophical and literary concepts that diagnose the error.

  ### 1. The Biological Anchor: Adaptationism and Spandrels
  You are correct that evolutionary biology has fought this battle. The specific term for the assumption that every trait of an organism exists because it serves an adaptive function is **Adaptationism** (or sometimes **Pan-Adaptationism**).

  In 1979, Stephen Jay Gould and Richard Lewontin published a seminal paper titled *"The Spandrels of San Marco and the Panglossian Paradigm."* It is the definitive text for your argument.
  *   **The Metaphor:** They used the architectural term **spandrel** (the triangular space between two arches) to describe biological traits that are not adaptations themselves but inevitable byproducts of other structural changes. The spandrel exists because the architect needed to support the dome; the decoration on the spandrel comes *after*.
  *   **The Error:** Adaptationists look at the decoration on the spandrel and assume the space was created *for* the decoration. Gould and Lewontin argued this is a "Just-So Story" (a term borrowed from Kipling): a plausible-sounding narrative that explains *why* a trait is useful, but fails to explain *how* it arose.
  *   **Application to Fiction:** When a critic says, "This verbal tic must reveal the character's anxiety," they are telling a Just-So Story. They are identifying a current utility (signaling anxiety) and mistaking it for the causal origin (the author needed a syllable to fill the meter).

  ### 2. The Philosophical Core: Teleology and Pan-Functionalism
  In philosophy, the broader category of error is **Teleological Reasoning** (from the Greek *telos*, meaning end or purpose). This is the assumption that phenomena are best explained by the purpose they serve rather than the causes that produced them.

  When applied to complex systems (like texts or organisms), this becomes **Pan-Functionalism**: the assumption that every component of a system exists to perform a function for the whole.
  *   **The Epistemological Mistake:** It confuses *effect* with *cause*. Just because a detail *has* a thematic effect does not mean it was *caused* by a thematic intention.
  *   **The "Intentional Stance":** Philosopher Daniel Dennett describes a cognitive heuristic called the **Intentional Stance**. To predict the behavior of a complex system (a person, a chess computer, a novel), we treat it *as if* it were a rational agent acting on beliefs and desires. This is useful for reading, but it becomes an error when we forget it is a heuristic. Critics often reify the text, treating the novel as a rational agent that would not include "useless" data.

  ### 3. The Literary History: Organic Unity
  You asked where this comes from in literary culture. It has a specific historical lineage known as the doctrine of **Organic Unity**.
  *   **Origins:** Rooted in Romanticism (Coleridge) and solidified by the **New Criticism** of the mid-20th century.
  *   **The Dogma:** A work of art is like a living organism; every part is interdependent and necessary for the life of the whole. If a part can be removed without damaging the whole, it is superfluous (Chekhov's Gun is the populist version of this).
  *   **The Critique:** This doctrine privileges **coherence** over **contingency**. It assumes the author is a perfect designer rather than a laborer working with resistant materials. It ignores the *process* of writing (drafting, cutting, patching) in favor of the *product*.

  ### 4. Why Is This Tempting? (The Cognitive Bias)
  Why do smart editors and writers fall for this?
  1.  **Patternicity:** Humans are evolutionarily wired to detect patterns and agency. We prefer signal to noise. A text with "noise" (accidental features) feels unsafe or uncontrolled to a reader.
  2.  **Hermeneutic Security:** If every detail has a function, the text is solvable. It yields meaning. If some details are accidents, the text becomes partially opaque, which creates anxiety for the critic whose job is to explicate meaning.
  3.  **The "Panglossian" Bias:** Named after Voltaire's Dr. Pangloss, who believed we live in the "best of all possible worlds." In workshops, this manifests as the belief that the draft is a rational optimization. To suggest a detail is an accident is to suggest the author lost control, which is socially fraught in a workshop setting.

  ### 5. Alternative Explanatory Strategies
  If we reject Pan-Functionalism, what vocabulary replaces it? You need terms that validate non-functional features without calling them "flaws."

  *   **Constraint-Based Explanation:** "This feature exists due to a **formal constraint**." (e.g., rhythm, rhyme, pacing, POV consistency).
  *   **Genetic Criticism (Critique génétique):** A school of textual scholarship that studies the *process* of writing (drafts, notes) rather than just the final text. It acknowledges that texts have a history of accumulation and deletion. You can argue for a **genetic explanation** for a feature rather than a **functional** one.
  *   **Texture vs. Structure:** Distinguish between features that bear the weight of the plot (structure) and features that provide verisimilitude or atmosphere (texture). Texture often relies on "noise" to feel real. Real life is full of non-functional details; a novel that lacks them feels artificial.
  *   **Exaptation:** A biological term for a trait that evolved for one purpose (or no purpose) but was later co-opted for another. You can admit a detail was accidental but argue it *became* functional upon revision, without claiming it was *intended* from the start.

  ### 6. Where the Analogy Breaks Down
  You asked about the limits of the biology analogy.
  *   **Agency:** Novels have authors; organisms do not. An author *can* intend function. Therefore, assuming function is not *always* wrong in literature, whereas it is always technically wrong in natural selection (which has no mind).
  *   **The Counter-Argument:** However, authors are not omniscient gods. They are bound by cognitive limits, time, language, and the unconscious. The "Death of the Author" (Barthes) actually supports your view: once the text is written, it operates independently of the author's intent. If the author put something in by accident, it is now part of the system, regardless of their original plan.

  ### 7. Vocabulary for the Workshop
  Here is how you might articulate this in a workshop or editorial letter, using this philosophical framework:

  *   **"That is a Spandrel."** (Use this carefully, perhaps with explanation). "This detail feels like a spandrel—it's a byproduct of the narrative architecture rather than a load-bearing beam. It doesn't need to carry thematic weight to be valid."
  *   **"Avoid the Adaptationist Fallacy."** "We are assuming this detail must be an adaptation for the plot. But it might be a constraint of the voice. Let's not write a Just-So story about why it's there."
  *   **"Distinguish Etiology from Effect."** "Just because this passage *creates* tension doesn't mean it was *designed* for tension. It might be a residue of the drafting process. We should evaluate it on whether it works now, not on whether it has a 'reason' to be here."
  *   **"Contingency vs. Necessity."** "We are treating this contingent feature as if it were necessary. Let's allow the text some contingency."

  ### Summary Recommendation
  The precise philosophical account you are looking for is a critique of **Teleological Functionalism** via the lens of **Evolutionary Adaptationism**.

  The core error is the conflation of **utility** (what this does now) with **etiology** (why this is here). By importing Gould and Lewontin's concept of the **Spandrel**, you gain a legitimate, scientifically grounded vocabulary to argue that **byproducts are not defects.** They are simply the structural cost of building a complex system.

  If you read one thing, read Gould and Lewontin's *"The Spandrels of San Marco and the Panglossian Paradigm."* It is written in lush, argumentative prose that will feel very familiar to a novelist, and it provides the exact epistemological weapon you need.
