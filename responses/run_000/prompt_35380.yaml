  - Brainstorming

  To reverse-engineer this function, we need to identify the input features and the decision boundary. The inputs appear to be two variables: $N$ (the number of lives on the stranger side) and $R$ (the relationship strength of the single individual). The output is binary: Save Single or Save Group.

  Looking at the data, there are two distinct modes of operation. When $R$ is "Stranger," the function is purely utilitarian: it maximizes $N$ (5>1, 2>1, 1=1). When $R$ is "Close Friend," the function ignores $N$ entirely, even at extreme values (1 Friend > 100 Strangers). The interesting variable is the "Distant Cousin." In the test case (1 Cousin vs 5 Strangers), she treats the Cousin like a Stranger (saving the 5). This suggests the Cousin relationship falls below a specific threshold of moral obligation required to override utilitarian calculus. However, we don't know if the Cousin relationship has *zero* weight or just *insufficient* weight to overcome a group of 5. There are no logical contradictions in her provided verdicts; the data is consistent, though sparse regarding the lower bounds of the "Cousin" value.

  - Candidate Rules

  **Rule 1: The Binary Inner Circle (Threshold Deontology)**
  This rule posits that relationships are binary: you are either in the "Inner Circle" or you are not.
  *   **Logic:** If $R$ is "Inner Circle" (Close Friend), Save Single. If $R$ is "Outer Circle" (Stranger, Distant Cousin), Maximize $N$.
  *   **Fit:** Fits all cases. The Cousin is categorized as "Outer Circle" because she hasn't seen them in 10 years, making them morally equivalent to a stranger.
  *   **Equation:** `If (Relationship == Close) return Save_Single; else return Save_Max(N);`

  **Rule 2: Weighted Utilitarianism (Linear Consequentialism)**
  This rule posits that every life has a moral weight ($W$) based on relationship, and she maximizes total moral weight.
  *   **Logic:** Stranger Weight ($W_s$) = 1. Close Friend Weight ($W_f$) > 100. Cousin Weight ($W_c$) is between 1 and 5.
  *   **Fit:** Fits all cases. $1 \times W_c < 5 \times W_s$ (explains saving the 5 strangers). $1 \times W_f > 100 \times W_s$ (explains saving the friend).
  *   **Equation:** `If (1 * W_R > N * W_Stranger) return Save_Single; else return Save_Group;` (Where we assume $W_c \approx 3$).

  - Predictions

  **Target Case:** 1 Cousin (10 years no contact) vs 2 Strangers.

  *   **Rule 1 Prediction:** **Save the 2 Strangers.**
      *   Since the Cousin is "Outer Circle," they are treated as a count of 1. 1 < 2, so the utilitarian calculus saves the group.
  *   **Rule 2 Prediction:** **Save the Cousin.**
      *   Assuming the Cousin has a moral weight greater than 1 (e.g., $W_c = 3$) but less than 5. In this scenario, 1 Cousin (3 points) outweighs 2 Strangers (2 points).

  - Best Guess

  I believe she is running **Rule 1: The Binary Inner Circle**. From a cognitive load perspective, maintaining a continuous "moral weight" variable for every acquaintance is computationally expensive for a human brain. It is much more likely she uses a heuristic categorization: "People I love" vs. "Everyone else." The phrasing "cousin she hasn't seen in 10 years" is key; socially, this is often code for "stranger with a shared gene history." If she attributed *any* significant weight to the cousin (Rule 2), she likely would have expressed hesitation in the 1 vs 5 case, but the verdict was decisive. The cleanest function that fits the data without assuming hidden variables is that the cousin bond is too weak to trigger the "partiality exception," defaulting her back to standard utilitarianism.

  - Litmus Test

  To definitively distinguish between Rule 1 (Cousin = Stranger) and Rule 2 (Cousin > Stranger), you need to test the lower bound of the utilitarian scale.

  **New Case:** 1 Cousin (10 years no contact) vs 1 Stranger.

  *   **Rule 1 Prediction:** **Coin Flip.**
      *   Since Cousin is treated as a Stranger, this is 1 vs 1. There is no numerical or relational reason to pick either.
  *   **Rule 2 Prediction:** **Save the Cousin.**
      *   Even a small amount of relational weight ($W_c > 1$) breaks the tie in favor of the cousin.

  If she hesitates or flips a coin, she's using a Binary Threshold. If she immediately saves the cousin, she's running Weighted Utilitarianism.
