answer: |-
  This is a sharp formulation of the **Causal Exclusion Argument**, dressed in Dennettian clothing. It is valid, but it is not sound.

  The exit is to reject **Premise 2**.

  > **2. An abstraction like a center of gravity does no causing: the mass distribution does the causal work, and the center of gravity merely summarizes that distribution.**

  Rejecting this premise allows you to hold onto the truth of self-citing explanations (the intuition behind 4) without positing the self as a concrete, non-physical substance (the homunculus you want to avoid).

  Here is the exact breakdown of why Premise 2 fails, the cost of rejecting it, and how it resolves your dilemma.

  ### 1. Why Premise 2 Fails: The Equivocation on "Causing"

  Premise 2 relies on a specific, restrictive metaphysics of causation often called **Causal Fundamentalism** or the **Causal Closure of the Physical**. It assumes that for $X$ to cause $Y$, $X$ must be a fundamental physical constituent transferring energy or momentum. Under this definition, *only* microphysical particles "cause" anything.

  If you accept this definition, Premise 2 is true, but it renders **Premise 5** devastating in a way your friend likely didn't intend. If only microphysical particles cause things, then **corporations, software, and beliefs also do no causing.**

  But consider the software example you noted in Premise 5.
  *   **Scenario:** A bug in the code causes the rocket to veer off course.
  *   **Microphysical Story:** Electrons flowed through specific gates, triggering a thruster.
  *   **Software Story:** A logic error in the guidance routine triggered the wrong command.

  If Premise 2 is true, the software bug *did not cause* the veer; only the electrons did. This makes the statement "The software bug caused the crash" false (or at best a "useful fiction").

  This is counterintuitive to the point of absurdity. In science and engineering, we treat higher-level patterns as causally efficacious because they support **counterfactuals** that the micro-level description obscures.
  *   *True:* "If the software had been patched (holding the hardware physics constant), the rocket would not have veered."
  *   *False/Intractable:* "If the electrons had been arranged differently (in a way that corresponds to a patch)..."

  Dennett's view (and the view of non-reductive physicalists like Jerry Fodor or David Chalmers) is that causation is **level-relative**. An abstraction causes things *at the level of abstraction where it is defined*. To say the Center of Narrative Gravity (CoNG) "does no causing" is a category error. It does not cause *microphysical events* directly (it supervenes on them), but it causes *personal-level actions* (apologies, hand-raisings) in virtue of the organizational structure it describes.

  ### 2. The Cost of Rejecting Premise 2

  You asked what you lose by giving this up. You lose **Causal Fundamentalism**.

  You must accept that "causation" is not a single, unified relation that exists only at the bottom of the ontological stack. Instead, causation is a relation that holds between events described at compatible levels of abstraction.
  *   **The Gain:** You save the reality of the self, corporations, and software without multiplying substances. They are **Real Patterns** (Dennett's term). They are objective features of the world detectable from a specific stance (the Intentional Stance), not mere subjective fictions.
  *   **The Loss:** You cannot demand a "God's Eye View" of causation where only the bottom layer is "really" doing the work. You must accept that the statement "I raised my hand because I decided to" is true *at the personal level*, even if at the neuronal level it looks like "Neuron cluster A fired because cluster B stimulated it." These are not competing causal claims; they are descriptions of the same event at different resolutions.

  ### 3. Saving Premise 4 (Your Priority)

  You stated you most want to hold onto the intuition behind (4): *that self-citing explanations are not fictions.*

  > **4. If the self does no causing, then ordinary self-citing explanations... are not made true by any self; at best they are useful fictions.**

  By rejecting Premise 2, you deny the antecedent of Premise 4.
  *   **New Premise 2*:** Abstractions *do* cause, relative to their level of description.
  *   **New Conclusion 3*:** The self *does* cause (personal-level actions).
  *   **Result:** The antecedent of 4 ("If the self does no causing") is false. Therefore, 4 does not force you to conclude that self-citing explanations are fictions.

  This allows you to say: "I raised my hand because I decided to" is **true**. It is made true by the fact that there is a real, detectable pattern of rationality and coherence (the CoNG) that explains the behavior better than the neuronal story does for the purposes of social prediction and responsibility.

  ### 4. Addressing the "Concrete Item" Worry

  You worried that holding onto (4) pushes you back into treating the self as a "concrete causal part."

  This worry stems from the assumption that **Real = Concrete Substance**. Dennett's move is to argue that **Real = Real Pattern**.
  *   A hurricane is not a concrete substance; it is a weather pattern.
  *   Yet, a hurricane can cause damage.
  *   If you say "The hurricane caused the roof to fly off," you are not positing a "hurricane substance" alongside the wind and pressure. You are identifying a high-level causal structure.

  The self is the same. It is not a "thing" inside the brain. It is the **trajectory of a person through logical space**. When you cite the self as a cause, you are citing the *constraints* that the narrative structure imposes on future behavior. (e.g., "He apologized because he sees himself as an honest person." The *self-conception* constrains the output, acting as a causal filter).

  ### 5. What About Premise 5 and 6? (The "Sweeping Irrealism" Charge)

  Your friend's argument concludes (6) that this leads to "sweeping irrealism." This is a **False Dilemma**.

  Dennett *accepts* the first horn of the dilemma in (6), but redefines the terms:
  *   **Friend's Claim:** If abstractions aren't concrete substances, they are "useful fictions" (unreal).
  *   **Dennett's Claim:** Abstractions aren't concrete substances, but they are **Real Patterns** (real).

  Dennett *does* commit to the view that corporations, markets, and selves are not "fundamental ontology." But he denies that this makes them "fictions." A fiction is something that does not exist (e.g., Sherlock Holmes). A Real Pattern is something that exists but is ontologically dependent on a substrate (e.g., The US Economy).

  So, Premise 5 is actually Dennett's strength, not his weakness. He *wants* the same reasoning to apply to corporations and beliefs. He argues that **everything** above microphysics is a "Center of Gravity" of some sort. This isn't "sweeping irrealism"; it's **sweeping non-reductive physicalism**.

  ### Summary of the Exit

  1.  **Reject Premise 2.** Abstractions (Real Patterns) have causal efficacy at their own level of description.
  2.  **Cost:** You must abandon the idea that only microphysical interactions are "true" causation. Causation is level-relative.
  3.  **Benefit:** You preserve the truth of "I decided to raise my hand" without needing a soul or a homunculus. The "I" is the pattern that organizes the decision.
  4.  **Resolution:** The argument fails because it treats "abstraction" and "causal power" as mutually exclusive. They are not. The software causes the crash *because* it is an abstraction over the hardware, not *despite* it.

  The load-bearing premise was the assumption that **summary = inert**. In complex systems, the summary (the pattern) is often the only thing that has predictive or explanatory power, which is the functional definition of "real" in Dennett's framework.
