prompt: |-
  I just got into a long argument with my friend about Williams's internal/external reasons distinction and I think the whole thing just comes down to the "sound deliberative route" condition but we cant agree on what counts as sound. Can you give me a concrete example — a specific person with a specific set of desires and beliefs — where its genuinely ambiguous whether there's an internal reason for them to do something, because the deliberative route from their subjective motivational set to the action is contested? I want something where the answer isnt obvious and its not the standard addict case or the "I have no desire to be a good friend" case. Like a case where the person has a desire that's in their S but the route to the action is where the disagreement actually lives.
