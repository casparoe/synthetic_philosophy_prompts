      *   **Sound Deliberative Route:** Involves correcting factual errors, logical errors, and potentially imagining scenarios vividly. *Crucially*, Williams is vague about how far this extends. Does it allow for substantive rational criticism of desires? (Williams says no, but the boundary is fuzzy).
