  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Epistemic Implications of Evolutionary Explanations for Moral Realism
  **Parties:** Proponent of Evolutionary Debunking (The Debunker) and Defender of Robust Moral Realism (The Realist)

  ## PART 1: SUBSTANTIVE AGREEMENTS

  The undersigned parties agree to the following claims as the shared foundation for this dispute. These claims are intended to delimit the scope of the disagreement and rule out irrelevant objections.

  1.  **The Insensitivity Condition:** For the evolutionary debunking argument to succeed, it must establish that human moral beliefs are *insensitive* to moral facts. That is, it must show that even if the moral facts had been significantly different, human evolutionary pressures would have produced largely the same moral beliefs.
  2.  **The Explanatory Gap:** Both parties agree that the mere existence of moral facts (if they exist) does not automatically explain why humans believe in them. A satisfactory realist epistemology must provide a positive account of the correlation between evolutionary causes of belief and mind-independent moral truths that avoids characterizing the correlation as a coincidence.
  3.  **Differentiated Evolutionary Explanations:** Both parties agree that the evolutionary record does not explain all moral judgments equally well. There is strong consensus that evolutionary pressures provide a robust causal explanation for "thin" pro-social intuitions regarding kin altruism, reciprocity, and immediate harm avoidance. There is less consensus on whether evolution explains "thick" or abstract judgments regarding impartial justice, rights of distant strangers, or specific deontological constraints.
  4.  **Consequences of Success:** If the debunking argument succeeds, the primary casualty is *justification*, not necessarily *truth*. Both parties agree that a successful debunking argument renders moral beliefs epistemically unjustified for the believer, leading to moral skepticism, regardless of whether moral facts actually exist.
  5.  **Verbal Disputes on "Explanation":** Both parties acknowledge a potential verbal dispute regarding the term "explanation." The Debunker tends to require a *causal* explanation of belief formation that references the truth-maker. The Realist tends to allow for *grounding* or *constitutive* explanations where the truth of the proposition helps explain why holding the belief was adaptive. The parties agree to treat this as a substantive disagreement about epistemic access rather than a mere semantic ambiguity.
  6.  **The Requirement of Independent Access:** Both parties agree that the realist cannot simply assert that evolution tracked the truth without explaining *how* natural selection, which selects for fitness, could distinguish between a belief that is fitness-conducive and a belief that is fitness-conducive *because it is true*.

  ## PART 2: DISAGREEMENTS TABLE

  | Question | The Debunker's Position | The Realist's Position |
  | :--- | :--- | :--- |
  | **1. Counterfactual Sensitivity:** If the mind-independent moral facts posited by realism were different (e.g., if caring for offspring were morally neutral), would human moral judgments remain the same? | **Yes.** Our judgments are determined by fitness pressures. Since fitness pressures would remain the same regardless of abstract moral facts, our judgments would remain the same. The correlation is coincidental. | **No.** Moral facts constrain which traits are genuinely adaptive in the long run, or else the same evolutionary pressures would have led to extinction. We would not have the same judgments because the facts that make survival good would be different. |
  | **2. Third-Factor Explanations:** Can a "third factor" (e.g., survival is good) secure a non-accidental correlation between evolutionary causes and moral truth? If so, what is the scope? | **Limited Scope.** A third factor might link evolution to very basic "thin" values (e.g., survival is good). It cannot explain complex "thick" judgments (e.g., fairness to strangers, deontological constraints) because these often reduce fitness. | **Broad Scope.** Once a third factor anchors the connection for basic goods (like survival or knowledge), it validates the cognitive faculties producing moral beliefs. These faculties can then reliably access thicker truths even when they do not directly enhance fitness. |
  | **3. Epistemic Principle & Overgeneralization:** Does the principle "if the etiology of a belief is independent of its truth, the belief is unjustified" apply to domains like mathematics, logic, or perception? | **No.** Moral realism posits causally inert facts. Perception involves causal contact; mathematics involves conceptual necessity. Morality is unique in lacking a plausible link between fact and belief mechanism. | **Yes.** The principle is too strong. We accept beliefs in logic and mathematics despite lacking causal contact with abstract objects. If we reject moral realism on these grounds, we must also reject mathematical and logical realism (global skepticism). |

  ## PART 3: CRUXES OF THE DISPUTE

  The following sub-questions represent the pivot points of the collaboration. A settled answer to any one of these would significantly alter the dialectical standing of at least one party.

  ### Crux 1: The Scope of Third-Factor Explanations regarding Impartiality

  **(a) Relevance:**
  Both parties agree that if the "third-factor" strategy (e.g., "survival is good") only validates judgments that directly enhance reproductive fitness, robust moral realism fails to account for the bulk of normative ethics, which concerns duties to distant strangers, future generations, and non-kin. If the third factor cannot bridge the gap from "fitness" to "impartiality," the realist concedes the debunking argument for most practical morality.

  **(b) Fair Test:**
  **The "Costly Impartiality" Case:** Consider a specific moral judgment that imposes a significant fitness cost with no reciprocal benefit (e.g., sacrificing one's life to save a distant stranger with whom one shares no genes and will never interact).
  *   *Test:* Can the Realist provide a third-factor explanation for why evolution would select for a cognitive faculty capable of grasping *this specific truth*, without admitting that the faculty was selected for a different, fitness-tracking purpose and only accidentally lands on this truth?

  **(c) Predictions:**
  *   **Debunker Prediction:** The Realist will fail to show a non-accidental link. The intuition to save the stranger is a misfiring of kin-altruism mechanisms or a cultural byproduct, not a tracking of mind-independent truth.
  *   **Realist Prediction:** The Debunker will fail to show that "tracking fitness" and "tracking truth" come apart here. The capacity for impartial reasoning is a byproduct of a general truth-tracking capacity that was selected for, and the specific judgment is a correct application of that capacity, even if the specific act reduces fitness.

  ### Crux 2: Structurally Parallel Problems for Antirealism

  **(a) Relevance:**
  Both parties agree that if the antirealist (or Debunker) faces a structurally parallel epistemic problem regarding their own normative commitments, the debunking argument may be self-defeating or question-begging. If the Debunker argues we should abandon moral beliefs because they are shaped by non-truth-tracking forces, they must explain why *their* epistemic norms (e.g., "believe what is supported by evidence") are not subject to the same genealogical critique.

  **(b) Fair Test:**
  **The "Normative Authority" Challenge:**
  *   *Test:* The Debunker must articulate the status of the epistemic norm driving the debunking argument (e.g., "One ought not hold beliefs formed by unreliable processes"). Is this norm itself justified by evolutionary pressures? If yes, why trust it? If no, how do they access it without the very realist epistemology they deny?

  **(c) Predictions:**
  *   **Debunker Prediction:** The Realist will conflate *pragmatic* justification with *epistemic* justification. The Debunker can accept that their epistemic norms are evolutionary tools without claiming they track mind-independent "epistemic facts." The parallel fails because antirealism does not posit inert facts that need tracking.
  *   **Realist Prediction:** The Debunker will be forced to admit that their epistemic norms claim a authority that transcends mere adaptive utility. If they admit this, they are covert realists. If they deny it, they cannot claim the debunking argument gives us a *reason* to change our beliefs, only a causal explanation of why we might.

