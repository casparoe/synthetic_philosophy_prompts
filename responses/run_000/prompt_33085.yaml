answer: |-
  This is a classic instantiation of the problem of **moral luck**, specifically what Thomas Nagel termed **resultant luck** (luck in the way one's actions turn out). Your cousin is intuitively grasping a tension that has occupied moral philosophers for decades: the conflict between our intuition that people should only be judged on what they control, and our practice of judging people heavily on outcomes.

  The phrase "there but for the grace of God go I" is rhetorically powerful but philosophically ambiguous. It can function as a humble confession, a sociological observation, or a radical metaphysical claim. To evaluate your cousin's argument, we must disambiguate exactly what claim he is making.

  Here is a menu of five distinct readings of your cousin's statement, ranging from the banal to the radical, with verdicts on their plausibility and their ability to support his conclusion.

  ### Reading 1: The Confessional Platitude
  *   **The Claim:** "I have also driven while impaired (or been tempted to), and I am not a fundamentally better person than the driver. I recognize my own capacity for this error."
  *   **Philosophical Category:** Moral Humility / Empathy.
  *   **Verdict:** **Plausible but Normatively Inert.**
      *   This is likely the most common usage of the phrase. It is a statement about the speaker's own character, not the driver's liability. It asserts that the *difference* between the cousin and the driver is not one of essential moral worth.
  *   **Does it support the cousin's conclusion?** **No.**
      *   Even if your cousin is just as flawed as the driver, it does not follow that the driver deserves *less* punishment. If your cousin also drove drunk, the logical conclusion is that your cousin *also* deserves punishment, not that the driver deserves none. This reading explains your cousin's *empathy*, but it provides no justification for leniency.

  ### Reading 2: The Statistical Defense
  *   **The Claim:** "Driving under the influence is a common behavior. Many people do it and do not kill anyone. Singling out this driver is arbitrary because the behavior is widespread."
  *   **Philosophical Category:** Descriptive Sociology / Argument from Common Practice.
  *   **Verdict:** **True but Fallacious.**
      *   It is empirically true that many people drive drunk without consequence. However, in ethics and law, the frequency of a violation does not negate the violation. This is the *argumentum ad populum* fallacy applied to criminal justice.
  *   **Does it support the cousin's conclusion?** **No.**
      *   The prevalence of a crime does not reduce the culpability of the perpetrator. If everyone sped, speeders would still be liable for accidents they cause. This reading attempts to normalize the behavior but fails to address the specific harm caused in this case.

  ### Reading 3: The Control Principle (The "Nagel" Reading)
  *   **The Claim:** "Moral blameworthiness should depend only on factors within the agent's control. The driver controlled the decision to drink and drive, but he did not control the pedestrian stepping onto the sidewalk or the specific trajectory of the car. Therefore, his *moral character* is no worse than a drunk driver who got home safely."
  *   **Philosophical Category:** Resultant Moral Luck Skepticism.
  *   **Verdict:** **Philosophically Robust, Practically Controversial.**
      *   This is the strongest philosophical interpretation. It relies on the **Control Principle**: we are only responsible for what we control. Since the *death* was a matter of luck (resultant luck), the driver's moral status should be identical to the "lucky" drunk driver. Most philosophers agree that luck shouldn't affect *moral worth*, though they disagree on how to apply this to law.
  *   **Does it support the cousin's conclusion?** **Yes, partially.**
      *   It supports the claim that the driver should not be treated like a *worse person* (moral status) than a lucky drunk driver. However, it does not necessarily support the claim that he deserves less *punishment*. Legal systems often punish based on harm done (retributivism) or to deter risky behavior (utilitarianism), regardless of whether the specific harm was "lucky." This reading validates the cousin's moral intuition but clashes with legal theory.

  ### Reading 4: The Risk-Proportionality Claim
  *   **The Claim:** "Punishment should be proportional to the *risk created*, not the *harm inflicted*. Since the drunk driver who kills and the drunk driver who doesn't create the same risk, they should receive similar sentences."
  *   **Philosophical Category:** Legal Theory / culpable Risk Creation.
  *   **Verdict:** **Debatable (Retributivism vs. Utilitarianism).**
      *   This is a specific policy claim. Some legal scholars argue that "attempted" crimes and "completed" crimes should be punished similarly if the intent and risk were identical. However, most legal systems operate on a hybrid model where harm aggravates the sentence (e.g., manslaughter vs. reckless endangerment).
  *   **Does it support the cousin's conclusion?** **Yes.**
      *   If you accept this premise, then the driver is indeed being punished unfairly *relative to other drunk drivers*. However, this doesn't mean he deserves *no* serious punishment; it means the *difference* between his sentence and a non-fatal drunk driver's sentence is unjustified. It argues for leveling up (punish lucky drunks more) or leveling down (punish this driver less), but usually, the public intuition is to level up.

  ### Reading 5: The Hard Incompatibilist (The Radical Reading)
  *   **The Claim:** "Ultimately, no one is truly responsible for anything. The driver's decision to drink was caused by genetics, environment, and prior causes beyond his control. 'Luck' permeates everything, not just the outcome. Therefore, blame is an incoherent concept."
  *   **Philosophical Category:** Hard Determinism / Pessimism about Responsibility (e.g., Galen Strawson).
  *   **Verdict:** **Radical and Systemically Destructive.**
      *   This claims that because the driver's character and choices are ultimately products of luck (constitutive luck), he cannot be truly blameworthy at all. This undermines the entire concept of criminal justice, not just for this case but for all cases.
  *   **Does it support the cousin's conclusion?** **Yes, but at too high a cost.**
      *   If this reading is true, the driver deserves no punishment, but neither does a murderer who planned a killing for months, nor does your cousin deserve praise for being sober. While it supports the conclusion that the driver shouldn't be blamed, it renders *all* moral discourse meaningless. Unless your cousin is prepared to abolish the prison system entirely, this is likely not the argument he intends to make.

  ### Summary for Your Argument

  When you debate your cousin, you need to ask him which "menu item" he is ordering.

  1.  If he is using **Reading 1 or 2**, you can point out that his empathy is understandable, but it is logically irrelevant to justice. His own flaws don't erase the victim's death.
  2.  If he is using **Reading 5**, you can challenge him on whether he truly believes *no one* is responsible for anything, or just this specific driver.
  3.  The real debate lies in **Reading 3 and 4**. This is where the philosophy lives.
      *   **Your Counter-Argument:** You can concede Reading 3 (that the driver isn't a *demon* compared to other drunks) but reject the conclusion on **Legal Function**. The law punishes the *death* not just to reflect moral character, but because society must account for the actual harm done and deter the creation of lethal risk.
      *   **The "Leveling Up" Objection:** If the cousin argues it's unfair to punish this driver more than lucky drunks, you can argue the solution isn't to punish this driver *less*, but to punish *all* drunk drivers *more*. The injustice isn't that this driver is being treated harshly; it's that the lucky ones are treated too leniently.

  **Verdict:** Your cousin is likely mixing **Reading 1** (empathy) with **Reading 3** (moral luck). While Reading 3 is philosophically sound regarding *moral character*, it does not automatically translate to *legal sentencing*. You can agree that the driver is not a "worse person" than a lucky drunk driver, while maintaining that he is legally and causally responsible for a death that the lucky driver is not. Distinguishing between **moral blameworthiness** (character) and **legal liability** (consequences) is the key to resolving the stalemate.
