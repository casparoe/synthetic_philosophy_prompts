answer: |-
  Your friend is sharp to spot the connection, and honestly, that's a solid hour of bar philosophy well spent. He isn't *wrong* that there is an overlap—both problems deal with how our minds relate to things that aren't "there."

  However, if you want to win the next round (or at least complicate his victory lap), here is the distinction: **The Problem of Empty Names is about *meaning and truth*, while the Paradox of Fiction is about *emotion and rationality*.**

  Here is the breakdown of why philosophers treat them as distinct beasts, and why solving one doesn't automatically solve the other.

  ### 1. The Problem of Empty Names (Semantics & Logic)
  This is a problem in the philosophy of language. It asks: **How can a sentence be meaningful if part of it refers to nothing?**

  *   **The Puzzle:** If I say, "The present King of France is bald," the phrase "The present King of France" refers to nothing (because there is no King of France). If the subject doesn't exist, how can the sentence be true or false? Is it nonsense?
  *   **The Goal:** Philosophers like Bertrand Russell or P.F. Strawson want to fix our logical scorecard. They want to know how language hooks onto the world.
  *   **The Solution:** You might say, "Well, we treat names like 'Santa Claus' as shorthand for a set of descriptions (the jolly man at the North Pole...)." Or you might say, "These sentences are simply false."

  ### 2. The Paradox of Fiction (Philosophy of Emotion & Art)
  This is a problem in aesthetics and philosophy of mind. It asks: **How can we feel genuine emotions toward things we know are fake?**

  *   **The Puzzle:** It is usually formulated with three inconsistent premises (often attributed to Colin Radford):
      1.  We feel genuine emotions (pity, fear) toward fictional characters.
      2.  To feel genuine emotions, we must believe the object of our emotion exists.
      3.  We know fictional characters do not exist.
      *   *Result:* We are being irrational. We are crying over nothing.
  *   **The Goal:** Philosophers like Kendall Walton want to understand the psychology of art. They aren't asking if the sentence "Anna Karenina died" is true; they are asking **why you are crying.**
  *   **The Solution:** You might say, "We don't feel *real* fear, we feel *quasi*-fear (pretend emotion)." Or, "Existence isn't required for emotion, only imagination is."

  ### 3. Why the Friend's Objection Doesn't Quite Stick
  Here is the killer argument you can use: **Even if you solve the Empty Name problem, the Paradox of Fiction remains.**

  Let's say your friend wins the argument on empty names. He convinces everyone that "Harry Potter" *does* refer to something—maybe an abstract object, or a set of properties in a story. Great. The sentence "Harry Potter is an orphan" now has a truth value.

  **But why are you scared when the Dementors show up?**

  *   **Empty Names** deals with *reference*. (What does the word point to?)
  *   **Paradox of Fiction** deals with *affect*. (Why does my heart rate go up?)

  You can have perfect semantic reference to non-existent things without ever feeling an emotion about them. I can logically discuss "The present King of France" without feeling pity for his baldness. But when Hamlet dies, I feel sadness. The paradox isn't about how the name "Hamlet" works; it's about why my brain triggers a sadness response when my cognitive brain knows there is no Hamlet.

  ### 4. Where Your Friend Has a Point (The Overlap)
  Your friend is right that the two problems hang out in the same neighborhood. Some solutions to the Paradox of Fiction *do* import solutions from the Empty Name problem.

  *   **Meinongianism:** If you believe non-existent objects *have a kind of being* (Meinong's "jungle"), then you solve the empty name problem (the name refers to a non-existent object) AND you solve the paradox of fiction (you can have emotions toward objects that have 'being' even if they don't 'exist').
  *   **Pretense Theory:** Kendall Walton argues that when we engage with fiction, we are playing a game of make-believe. This relies on a specific theory of how language and reference work in "opaque contexts."

  ### The Verdict
  Tell your friend this:
  > "You're right that they share DNA. Both deal with non-existence. But the Empty Name problem is about **logic** (is the sentence true?), and the Paradox of Fiction is about **psychology** (why am I crying?). I can fix the logic of the name 'Voldemort' without explaining why I flinch when he casts a spell. That's why they stay in separate lanes."

  He's half-right, which is the most dangerous kind of right in a bar argument. Buy him a drink, but hold your ground on the emotion vs. reference distinction.
