      *   *Is it Vicious?* Davidson argues it is *not* a vicious circle. It's a system of equations with multiple variables. You solve them simultaneously, not sequentially.
      *   *The Principle of Charity:* It is not assuming the speaker is *infallible*. It is assuming that, *by and large*, their beliefs about the observable world are *true* (by our lights). Why? Because meaning is grounded in causal interactions with the world. If we disagree fundamentally about obvious things (e.g., "There is a tree"), communication breaks down.
