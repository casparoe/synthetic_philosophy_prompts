      *   **The Limitation of the TTB Hypothetical (Epistemic Uncertainty):** This is crucial. TTB assumes knowledge. ZDT shows ignorance. We don't know if Ammar is lying. This shifts the debate from "Is torture wrong?" to "Is torture rational/effective under uncertainty?"
