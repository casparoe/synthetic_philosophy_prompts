answer: |-
  Lewis's triviality results demonstrate that the Adams thesis is incompatible with truth-conditional semantics, and while both sides incur theoretical costs, the defenders of the Adams thesis who abandon truth conditions end up in better shape because the probabilistic data is more robust than the semantic intuition that conditionals are propositions.

  The tension arises from a mathematical proof showing that if indicative conditionals express propositions (have truth conditions) and their probabilities obey standard axioms, then accepting the Adams thesis—that the probability of "If A, then C" equals the conditional probability P(C|A)—forces the probability function to be trivial. Specifically, Lewis showed that under these assumptions, the probability of the conditional must be independent of the antecedent, implying that agents cannot have non-trivial beliefs about conditionals unless they are already certain about the antecedent or consequent. This creates a forced choice: one must reject the idea that conditionals are truth-apt propositions, reject the Adams thesis, or modify standard probability theory.

  Truth-conditionalists, such as Robert Stalnaker, choose to preserve the propositional status of conditionals by rejecting the Adams thesis. They argue that the probability of a conditional is the probability that the closest possible world where the antecedent is true is also a world where the consequent is true. While this saves standard semantics and logic, it severs the tight link between conditional belief and conditional probability, contradicting strong intuitive judgments in cases of uncertainty (e.g., reasoning about coin tosses) and complicating decision theory where conditional probabilities are foundational.

  Defenders of the Adams thesis, including Adams himself, Dorothy Edgington, and Lewis, choose to preserve the probabilistic link by denying that conditionals express propositions. On this view, conditionals do not have truth conditions and are not fit for truth-evaluation; instead, they have assertibility conditions governed by conditional probability. The primary cost here is the "embedding problem": if conditionals aren't propositions, it is difficult to explain how they function within complex logical structures like negations, disjunctions, or nested conditionals. However, recent developments in dynamic semantics and expressivism have made significant progress in explaining these logical behaviors without recourse to truth conditions.

  Ultimately, the Adams thesis defenders end up in better shape because the intuition that P(If A, C) = P(C|A) is central to epistemology, decision theory, and everyday reasoning, whereas the intuition that conditionals are standard propositions is less critical and more amenable to revision. Sacrificing truth conditions allows for a coherent account of uncertain reasoning that aligns with how agents actually update beliefs, whereas sacrificing the Adams thesis requires positing a divergence between rational belief and the semantics of conditionals that lacks independent motivation. While contextualist accounts attempt to save both by arguing that the proposition expressed shifts with context, these models often introduce excessive complexity to evade the triviality proof, making the non-propositionalist approach the more parsimonious and theoretically viable solution.
