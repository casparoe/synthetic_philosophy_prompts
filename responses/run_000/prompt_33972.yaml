answer: |-
  # Desiderata for a Theory of Logically Bounded Belief

  The following desiderata specify the requirements for a formal or conceptual model of belief (qualitative) or credence (quantitative) that avoids the problem of logical omniscience while retaining enough structure to count as a theory of *rational* agency. 

  The requirements are categorized as **Non-Negotiable** (constraints required for any theory claiming to model bounded rationality adequately) or **Program Commitments** (choices that define specific research avenues, such as "imperfect Bayesianism" vs. "fragmented belief").

  ---

  ## 1. Permitting Logical Fallibility
  **Specification:** The theory must allow an agent to fail to believe a logical truth (tautology) and fail to believe the logical consequences of their beliefs, without thereby being modeled as irrational *simpliciter*.
  **Motivation:** Finite cognitive resources prevent agents from computing all consequences of their belief set. A theory that labels every human agent as irrational because they have not proven Fermat's Last Theorem is extensionally inadequate.
  **Status:** **Non-Negotiable.** (This is the defining constraint of the project.)

  ## 2. Distinguishing Ignorance from Inconsistency
  **Specification:** The theory must distinguish between an agent who fails to infer $Q$ from $\{P, P \to Q\}$ and an agent who believes $\{P, P \to Q, \neg Q\}$.
  **Motivation:** There is a normative and psychological difference between an oversight (failing to see the connection) and explicit inconsistency (believing a contradiction). A theory that collapses this distinction (e.g., by treating the failure to believe $Q$ as equivalent to believing $\neg Q$ via a completeness assumption) cannot model the process of reasoning or error correction.
  **Status:** **Non-Negotiable.**

  ## 3. Preserving Modest Closure
  **Specification:** The theory must enforce *some* closure principles. For example, if an agent explicitly believes $P$ and explicitly believes $P \to Q$, they ought to be susceptible to criticism if they do not believe $Q$, provided the inference is "trivial" or "immediate."
  **Motivation:** Rationality requires *some* sensitivity to logic. An agent who believes "It is raining" and "If it is raining, the ground is wet" but firmly believes "The ground is dry" is defective, not merely bounded. A theory with *no* closure conditions fails to capture the normative force of logic.
  **Status:** **Non-Negotiable** (that *some* closure exists); **Program Commitment** (which specific rules constitute "modest" closure and where the threshold lies).

  ## 4. Dynamic Updating on Logical Information
  **Specification:** The theory must model how an agent rationally changes their doxastic state upon learning a logical truth or discovering an entailment relation between propositions they already entertain.
  **Motivation:** Agents learn logic (e.g., a student learns that a geometric proof is valid). In standard Bayesianism, one cannot conditionalize on a proposition already assigned probability 1, nor can one update on logical relations if those relations are already fixed by the model. A bounded theory must explain how credence in a tautology moves from $<1$ to $1$, or how belief in $Q$ is acquired upon realizing $P \models Q$.
  **Status:** **Non-Negotiable.**

  ## 5. Constraints on Probabilism (Equivalence and Tautologies)
  **Specification:** The theory must specify whether credences in logically equivalent propositions must coincide ($Cr(A) = Cr(B)$ if $A \equiv B$) and whether tautologies must receive credence 1 ($Cr(T) = 1$).
  **Motivation:** Standard probabilism enforces logical omniscience via these axioms. To solve the LO problem, at least one of these constraints must be relaxed or reinterpreted. However, the theory must state clearly which survives. If $Cr(A) \neq Cr(B)$ for equivalent $A, B$, the agent is vulnerable to a "logical Dutch Book." The theory must explain why this vulnerability is permissible for bounded agents.
  **Status:** **Program Commitment.** (Theories differ here: *Hyperintensional Bayesians* drop the equivalence constraint; *Fragmented Belief* theories may keep it locally but not globally; *Error Theory* approaches may keep the norm but admit humans violate it.)

  ## 6. Avoiding Total Permissiveness
  **Specification:** The theory must impose constraints that rule out blatantly incoherent belief patterns (e.g., believing $P$ and $\neg P$ simultaneously, or assigning credence 0.5 to $P$ and 0.5 to $\neg P$ while assigning 0.5 to $P \land \neg P$).
  **Motivation:** If dropping logical omniscience allows *any* assignment of belief to count as rational, the concept of rationality loses its normative bite. A madman who believes everything is both true and false should not be modeled as an ideal bounded reasoner.
  **Status:** **Non-Negotiable.**

  ---

  ## Incompatibility Analysis

  It is not possible to satisfy all the above desiderata while retaining the standard formal machinery of possible-worlds semantics and Kolmogorov probability theory. Specifically, there is a trilemma involving **Standard Semantics**, **Standard Probabilism**, and **Non-Omniscience**.

  ### The Incompatible Subset
  The following three commitments cannot be jointly satisfied:
  1.  **Standard Propositional Identity:** Propositions are sets of possible worlds (or elements of a Boolean algebra) where logical equivalence implies identity ($A \equiv B \implies A = B$).
  2.  **Standard Probabilism:** Credence functions satisfy the Kolmogorov axioms (including $Cr(T) = 1$ and $Cr(A) = Cr(B)$ if $A = B$).
  3.  **Non-Omniscience:** Rational agents may have $Cr(T) < 1$ or $Cr(A) > Cr(B)$ where $A \models B$.

  **Explanation of Conflict:**
  If propositions are identified by logical equivalence (1), and probability functions are defined over those propositions (2), then logical omniscience is a mathematical theorem of the model, not a contingent feature. You cannot have $Cr(T) < 1$ if $T$ is the sure event in the sigma-algebra. You cannot have $Cr(A) \neq Cr(B)$ if $A$ and $B$ are the same set of worlds.

  ### Resolving the Conflict (Program Commitments)
  To satisfy the Non-Negotiable desiderata (specifically 1, 4, and 5), a research program must abandon either Standard Semantics or Standard Probabilism.

  *   **Option A: Abandon Standard Semantics (Hyperintensionality).**
      *   *Approach:* Use impossible worlds or structured propositions so that $A$ and $B$ are distinct objects even if $A \equiv B$.
      *   *Cost:* Complicates the semantics significantly; risks losing the explanatory power of possible worlds (e.g., how content determines truth conditions).
      *   *Satisfies:* Desiderata 1, 2, 5 (by allowing $Cr(A) \neq Cr(B)$).

  *   **Option B: Abandon Standard Probabilism (Non-Classical Credence).**
      *   *Approach:* Modify the probability axioms (e.g., allow $Cr(T) < 1$ or violate additivity for logical connectives).
      *   *Cost:* Loses the Dutch Book justification for probabilism; makes updating (Desideratum 4) mathematically difficult (how does one conditionalize if the axioms are non-standard?).
      *   *Satisfies:* Desiderata 1, 5.

  *   **Option C: Fragmentation (Contextual Closure).**
      *   *Approach:* The agent has multiple belief states (fragments). Closure holds within a fragment, but not across fragments.
      *   *Cost:* Makes the notion of "The Agent's Belief" ambiguous. Difficult to model decision-making which requires aggregating fragments.
      *   *Satisfies:* Desiderata 2, 3, 6.

  ### The "Cliff Edge" Problem (Desiderata 3 vs. 6)
  There is a secondary tension between **Modest Closure (3)** and **Avoiding Permissiveness (6)** regarding the *boundary* of rationality.
  *   **Conflict:** If we admit that agents can fail to infer complex consequences, we must specify *which* inferences are mandatory (Modus Ponens?) and which are optional (complex quantifier shifts?).
  *   **Why it is hard:** Any line drawn seems arbitrary. If an agent is rational for missing a 50-step proof, why are they irrational for missing a 5-step proof? If the theory specifies a complexity threshold, it risks being empirically false (agents vary in capacity). If it does not specify a threshold, it risks violating Desideratum 6 (allowing incoherence).
  *   **Resolution:** This is likely a **Program Commitment**. Some theories accept a vague notion of "idealized boundedness," while others (e.g., computational complexity approaches) tie rationality to specific complexity classes (e.g., P-time computability).

  ## Summary Recommendation for Theory Construction
  To construct an adequate theory, one must treat **Standard Propositional Identity** and **Standard Probabilism** as the sacrificial elements. A viable theory of bounded belief must be **hyperintensional** (to satisfy Desiderata 1, 2, and 5) and must incorporate a **dynamic mechanism for logical learning** (to satisfy Desideratum 4) that does not rely on standard conditionalization. The boundary of **Modest Closure** (Desideratum 3) should be treated as a parameter of the agent's cognitive capacity rather than a fixed logical constant, to avoid the Cliff Edge problem.
