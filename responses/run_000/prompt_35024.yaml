answer: |-
  You have hit on precisely the fault line that divides Newtonian mechanics from Machian relativity and, eventually, General Relativity. Your skepticism about the "jump" from "not the bucket" to "not any ambient bodies" is historically warranted; in fact, Ernst Mach made that exact criticism 200 years later.

  To help you navigate your seminar, I will break this down into three parts: clarifying the "contrary" motion (which is kinematic), explaining why Newton makes the "ambient bodies" leap (which is metaphysical and anti-Cartesian), and identifying what argument is actually required to rule out the "fixed stars" objection (the Two Globes argument).

  ### 1. What does "Directly Contrary to the Relative" mean?

  This is a kinematic point about the intermediate phase of the experiment.

  *   **The Setup:** The cord is untwisting, spinning the bucket **Clockwise (CW)**.
  *   **The Water:** Friction is slowly dragging the water into motion. So, the water is also moving **Clockwise (CW)**, but slower than the bucket.
  *   **The Relative Motion:** If you are standing on the rim of the bucket (which is moving CW fast), and you look at the water (moving CW slowly), the water appears to be sliding **Counter-Clockwise (CCW)** relative to you.
  *   **The True Motion:** In absolute space, the water is moving **Clockwise (CW)**.

  Therefore, the direction of the *True Motion* (CW) is **directly contrary** to the direction of the *Relative Motion* (CCW).

  **Why does Newton highlight this?**
  He wants to show that the physical effect (the concavity/centrifugal force) tracks the **True Motion**, not the Relative Motion.
  *   As the True Motion (CW) **increases**, the concavity **increases**.
  *   As the Relative Motion (CCW) **decreases** (because the water is catching up to the bucket), the concavity **increases**.

  If the force were caused by relative motion, the force should be strongest when the relative motion is fastest (at the very beginning, when the water is still and the bucket is spinning). But the surface is flat then. The force grows as relative motion *vanishes*. This proves the cause is not the relation between water and bucket.

  ### 2. The "Jump": Why not relative to the stars?

  You asked: *"It seems like one thing to say the bucket is the wrong reference body, and quite another to say no ambient bodies will do."*

  You are absolutely right. The Bucket Argument *alone* does not logically rule out rotation relative to the fixed stars. In the experiment, the water is concave exactly when it rotates relative to the Earth and the stars, and flat when it does not. A relationist (like Mach) can easily say: "Inertia is an interaction between the water and the total mass of the universe (the fixed stars)."

  So why does Newton make the jump?

  **A. He is arguing against Descartes, not Mach.**
  In the Scholium, Newton's primary target is René Descartes. Descartes defined motion as "the translation of one body from the vicinity of those bodies immediately surrounding it."
  *   For Descartes, there is no such thing as "Absolute Space." There are only bodies and their changing neighbors.
  *   Newton is demonstrating that Cartesian "vicinity" cannot be the cause of dynamical effects (forces).
  *   When Newton says "ambient bodies," he is primarily referring to the **immediate** surrounding bodies (the bucket, the air, the lab). He is arguing that inertia is an internal property of the body related to space itself, not a result of sliding past neighbors.

  **B. The Ontological Claim.**
  Newton is making a claim about *causality*, not just correlation. He argues that the "endeavour to recede from the axis" (centrifugal force) is the *effect* of a specific *cause*.
  *   If motion were relative to ambient bodies, then if you kept the water still and spun the entire universe around it, the water should become concave (because the relative motion is the same).
  *   Newton assumes this is absurd. He believes the force arises because the water is accelerating *in Space*, not because it is moving *past Stars*.
  *   He treats Absolute Space as a real entity (the "Sensorium of God") that provides the resistance we call inertia.

  ### 3. What would he need to add to rule out your objection?

  You asked: *"What would he need to add to actually rule that response out?"*

  Newton actually knows the Bucket Argument isn't sufficient to prove Absolute Space against a "Fixed Stars" relationist. That is why, **immediately following the Bucket passage**, he introduces the **Argument of the Two Globes**.

  **The Two Globes Thought Experiment:**
  Newton asks us to imagine two globes connected by a cord, rotating around their common center of gravity, **in an immense vacuum, where there is nothing external and sensible.**
  *   In this empty universe, there are no "ambient bodies." There are no fixed stars.
  *   Yet, Newton argues, there would still be tension in the cord.
  *   Since there are no other bodies to define relative motion, the tension must be caused by rotation relative to **Absolute Space**.

  **For your seminar:**
  If you want to impress the seminar, point out that the Bucket Argument is an *empirical* demonstration that relative motion (to the container) isn't the cause, but the Two Globes argument is the *theoretical* capstone intended to rule out relationism entirely.

  However, even the Two Globes argument doesn't fully defeat Mach. Mach would argue that in a universe with only two globes, the concept of rotation is meaningless, and if you *did* spin the rest of the universe around them, the tension would appear. (This is known as **Mach's Principle**).

  ### Summary for your Seminar Discussion

  1.  **On "Contrary":** It refers to the intermediate phase. The water rotates CW in absolute space, but appears to rotate CCW relative to the faster-spinning bucket. The forces track the CW motion, not the CCW relative motion.
  2.  **On the "Jump":** Newton is conflating "immediate ambient bodies" (which clearly don't cause the force) with "distant bodies" (the stars). He assumes that if the immediate surroundings don't cause inertia, nothing material does. He posits Space itself as the cause.
  3.  **On the Missing Argument:** You are correct that the Bucket passage doesn't rule out rotation relative to the fixed stars. Newton relies on the **Two Globes** argument (an isolated system in a void) to make that stronger claim.
  4.  **Historical Verdict:** Your intuition aligns with Mach (1883) and Einstein (1915). Newton was right that the bucket doesn't rotate relative to itself, but he may have been wrong that it requires Absolute Space rather than the gravitational influence of the total mass of the universe to explain the concavity.

  Newton's goal in the Scholium is to distinguish **True Motion** (which causes forces) from **Relative Motion** (which is just a change of position). He succeeds in showing they are distinct, but the ontological status of "True Motion" (Absolute Space vs. Fixed Stars) remains the open philosophical question you have identified.
