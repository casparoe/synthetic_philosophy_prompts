answer: |-
  A sudden aquifer breach floods a limestone mine, trapping workers in two isolated chambers. In the lower chamber, five miners are pinned; they voluntarily bypassed locked safety gates to extract ore from an unstable vein despite explicit warnings of collapse risks. In the upper chamber, a single maintenance technician is trapped by a random structural failure in a designated safe zone where she was working under mandatory orders. The rising water will drown one group entirely before rescue pumps can secure the other, and there is no time to move anyone between chambers.

  **Analysis of Views**

  *   **Save the Greater Number (SGN):** This view aggregates the claims of the individuals. Since five lives outweigh one, the rescuer must save the lower chamber. The verdict is to save the five reckless miners. This feels intuitively wrong because it ignores the fact that the five knowingly assumed the risk that created the emergency, whereas the one did not.
  *   **Taurek's Coin-Flip:** Taurek argues that numbers do not aggregate; each individual faces the same loss (death). To show equal concern for each party without aggregating, the rescuer should flip a coin between the two groups. The verdict is a 50% chance for the five miners and a 50% chance for the technician. This feels intuitively wrong because it treats the claim of the innocent technician as no stronger than the combined claim of the reckless group, failing to honor her superior moral standing regarding the predicament.
  *   **Save the Smaller Group (Responsibility-Sensitive):** This view holds that claims to rescue are modulated by responsibility for the predicament. Since the technician is innocent and the miners are culpable for their own peril, her claim is stronger. The verdict is to save the technician with certainty (or near certainty). This aligns with the intuition that we should not sacrifice the innocent for the reckless, even if the reckless are more numerous.

  **The Driving Feature**

  The feature driving these verdicts apart is **differential assumption of risk** (or culpability for the predicament). The miners' autonomous choice to ignore warnings weakens their claim to scarce rescue resources relative to the technician, who is there through no fault of her own. This introduces a desert-based element into the distributive calculation that pure aggregativism (SGN) and strict egalitarianism about claims (Taurek) both exclude.

  **Removing the Feature**

  If you remove this feature—for example, if both groups were working in safe zones and trapped by the same unpredictable earthquake—the case collapses back into a standard Taurek scenario. Without the disparity in responsibility, the intuition that the single technician deserves priority vanishes. In that neutralized version, SGN becomes much more plausible (save the five), and Taurek's coin flip becomes a defensible method for respecting the separateness of persons without aggregating losses. The force of the "Save the Smaller" view depends entirely on the moral asymmetry of how the need arose.

  **The Strongest Taurekian Response**

  A defender of Taurek would likely bite the bullet and argue that **the severity of the loss, not the history of the claim, determines the strength of the claim.** Taurek could argue that while the miners were imprudent, punishing imprudence with death is disproportionate; once the predicament exists, the duty of rescue is triggered by immediate need and the equal badness of dying, not by prior merit. He might contend that introducing responsibility turns the rescuer into a moral judge rather than a humanitarian agent, and that the "loss to me" is identical whether I was reckless or innocent.

  **Evaluation:** This response fares poorly against the specific intuition of the case. While death is equally bad for the victim, the *fairness* of imposing that death on others (or prioritizing them) is not solely about the victim's loss, but about the relationship between the parties. Most people feel that autonomous assumption of risk creates a duty to bear the consequences rather than imposing them on innocents. Taurek's insistence on ignoring this history renders his view overly rigid in cases where moral responsibility is clear, suggesting his egalitarianism about claims is plausible only when background conditions of responsibility are equal.
