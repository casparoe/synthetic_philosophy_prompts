          *   *Sam:* Single probability conflates risk (known chance) with ambiguity (unknown chance). Sets track this. Ellsberg subjects distinguish them.
          *   *Analysis:* Lena states the orthodox Bayesian view (Ramsey/de Finetti). Sam states the imprecise probabilist view (Keynes/Walley). Lena's claim that a set "doesn't tell you how likely anything is" is technically true (it gives a range) but overstated as a defect (it tells you the *bounds* of likelihood). Sam's point about conflating risk/ambiguity is the core motivation for imprecise probs.
          *   *Verdict:* Sam is stronger on the *motivation* (distinguishing ignorance from equiprobability). Lena is stronger on the *decision-guidance* clarity of precise probs.

      *   **Move 2: Ellsberg and Expected Utility (EU)**
          *   *Lena:* Ellsberg preferences violate probability axioms (sum to 1). It's a violation of EU, not new rationality. "Risk vs. ambiguity" is redescription.
