          *   *Analysis:* Lena is mathematically correct that Ellsberg preferences violate Savage's Sure Thing Principle (Independence). However, her claim that this *means* they are irrational is the contentious point (is the axiom normative or descriptive?). Sam is right that assigning .5 relies on the Principle of Indifference, which is controversial in objective Bayesianism. Sam's point about Independence ignoring the *source* of uncertainty is the standard critique of Savage.
          *   *Verdict:* Lena is right on the math (violation of standard axioms). Sam is right on the philosophy (why those axioms might be too strong for ambiguity).

      *   **Move 3: Priors and Convergence vs. Set Selection**
          *   *Lena:* Arbitrariness washes out (Doob's Consistency Theorem). Sets relocate the problem (which set?). Permissive sets don't learn; narrow sets are arbitrary.
          *   *Sam:* Permissive sets *do* learn (eliminate members). Point is data haven't earned a single number. Dilation (widening) is a feature, not a bug (exposes fragility).
          *   *Analysis:* Lena appeals to asymptotic convergence. This is true *if* the truth is in the support, but in the short/medium run, priors matter. Her critique of set selection is a standard objection (the "second-order prior" problem). Sam's defense of dilation is standard imprecise prob theory (Seidenfeld/Walley).
