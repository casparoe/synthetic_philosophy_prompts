answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Problem of Old Evidence in Bayesian Confirmation Theory
  **Participants:** The Supplementationist (S), The Deflationist (D)
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS
  *Both parties endorse the following propositions as the baseline for this collaboration. Disagreement regarding these claims would constitute a breakdown of the collaboration.*

  1.  **Formal Baseline:** We agree that standard subjective Bayesianism is defined by a probability function $P$ satisfying the Kolmogorov axioms and an updating rule of Conditionalization, where $P_{new}(H) = P_{old}(H|E)$.
  2.  **The Phenomenon:** We agree that the historical episode of General Relativity (GR) explaining the anomalous advance of Mercury's perihelion (M) constitutes a paradigmatic case of scientific confirmation. Any adequate theory of confirmation must be able to represent the rationality of the increase in credence in GR afforded by M, despite M being known prior to the formulation of GR.
  3.  **The Zero-Change Result:** We agree that within the standard static synchronic framework, if $P_{old}(M) = 1$, then $P_{old}(GR|M) = P_{old}(GR)$. Consequently, standard conditionalization on $M$ yields no change in the probability of GR.
  4.  **Prohibition on Relabeling:** We agree that a "solution" cannot merely consist of defining a new confirmation metric $C^*(H, E)$ that diverges from probability change without explaining how $C^*$ guides rational belief, action, or theory choice. A solution must either show how $P(H)$ actually rises or justify why rational confirmation does not require $P(H)$ to rise.
  5.  **Logical Omniscience:** We agree that the problem is exacerbated by the assumption of logical omniscience (where agents assign probability 1 to all logical truths and entailments). Any solution must address how non-omniscient agents update on logical relationships (e.g., the discovery that $GR \vdash M$).

  ## II. MAP OF DISAGREEMENT
  *The following table isolates the specific points of divergence. Each row identifies a neutral statement of the issue, the specific formulation from each side, the underlying crux, and an agreed-upon constraint or test case with predicted outcomes.*

  | # | Neutral Statement of Issue | Supplementationist (S) Formulation | Deflationist (D) Formulation | The Crux | Agreed Test/Constraint & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Status of $P(E)$** | In the actual epistemic context of discovery, the evidence $E$ (Mercury) is fully certain ($P(E)=1$). The formalism must accommodate this actual state, not a fictionalized one. | The assignment $P(E)=1$ is a harmful idealization. We should model the agent's state *prior* to the logical derivation, where $E$ is treated as a constraint, or acknowledge that $P(E) < 1$ due to measurement uncertainty. | **Idealization vs. Fidelity:** Must the model reflect the agent's *actual* certainty about data, or the *relevant* uncertainty for the sake of the model? | **Test:** A model of the 1915 Einstein epistemic state.<br>**S Prediction:** Any model setting $P(M)=1$ fails to show confirmation without extra formal machinery.<br>**D Prediction:** A model setting $P(M) < 1$ (even if very high) or conditionalizing on background $K$ excluding $M$ successfully shows $\Delta P(GR) > 0$. |
  | **2** | **The Object of Learning** | The scientist learns the hypothesis $H$ (GR). The confirmatory power comes from $H$'s ability to systematize known $E$. The learning event is the adoption of $H$. | The scientist learns the *logical relationship* ($H \vdash E$). The learning event is the discovery of the entailment, not the data $E$ itself. | **Locus of Update:** Do we conditionalize on the evidence $E$, or on the proposition "$H$ entails $E$"? | **Test:** Application of the Garber-Style Solution.<br>**S Prediction:** Expanding the algebra to include sentences about entailment ($H \vdash E$) is an *addition* to standard Bayesianism (new atoms).<br>**D Prediction:** Expanding the algebra is permissible within standard Bayesianism; it requires no new axioms, only richer description. |
  | **3** | **Comparative vs. Absolute** | Even comparatively, if $P(E)=1$ for all competing hypotheses, the Likelihood Ratio $P(E|H)/P(E|H^*)$ becomes $1/1$, failing to discriminate. We need counterfactual likelihoods (what $H$ *would* predict). | Confirmation is inherently comparative. We compare $H$ against a specific alternative $H^*$ that does *not* entail $E$. The ratio does not collapse because $P(E|H^*) \neq 1$. | **Discrimination:** Can old evidence discriminate between theories using standard likelihoods, or are counterfactual likelihoods required? | **Test:** The "No Alternatives" Scenario (only $H$ and "Not-H" exist).<br>**S Prediction:** Without a specific $H^*$ that fails to entail $E$, standard Bayesianism cannot register confirmation from old evidence.<br>**D Prediction:** Even against "Not-H", if we model uncertainty about whether "Not-H" entails $E$, standard Bayesianism registers confirmation. |

  ## III. DIAGNOSIS: VERBAL VS. SUBSTANTIVE DISPUTE

  We explicitly flag the following distinctions to prevent talking past one another:

  **1. Primarily Verbal: The Definition of "Confirmation"**
  *   **Diagnosis:** There is a risk that S defines "confirmation" strictly as *synchronic probability increase* ($P_{new}(H) > P_{old}(H)$), while D defines it as *comparative support* or *explanatory virtue* that *leads* to probability increase via a different update path.
  *   **Resolution:** We agree to restrict the term "confirmation" in this document to mean **rational increase in subjective credence** ($P_{new}(H) > P_{old}(H)$). If D argues that confirmation exists without credence change, D concedes the point to S. If S argues that credence change occurs via a non-standard update rule, S concedes the formalism must change.

  **2. Substantive: The Treatment of Logical Truths**
  *   **Diagnosis:** This is the load-bearing disagreement. Standard Bayesianism assumes logical truths have probability 1 and cannot be learned (Rigidity).
  *   **Why Substantive:** S claims that modeling the learning of "$H \vdash E$" requires violating Rigidity or adding new atoms to the algebra, which constitutes a **revision** of the formalism. D claims that assigning probabilities to logical relationships is consistent with the **standard** formalism, provided the algebra is sufficiently expressive *ex ante*.
  *   **Stakes:** If S is right, Bayesian epistemology requires a new logic (e.g., Jeffrey Conditionalization on logical sentences). If D is right, the problem is merely one of applied modeling (choosing the right algebra).

  **3. Substantive: The Role of Counterfactuals**
  *   **Diagnosis:** S argues that capturing the intuition of the Mercury case requires referencing a counterfactual state (where $E$ was unknown). D argues that all necessary information is contained in the actual state's uncertainty about logical connections.
  *   **Why Substantive:** This determines whether Bayesianism is a theory of *actual* belief dynamics or *idealized* rational reconstruction.

  ## IV. STABILITY CHECK

  *To ensure the disagreement is productive, each side identifies the conditions under which they would revise their position and acknowledges the fragility of their own stance.*

  ### Supplementationist (S)
  *   **Condition for Revision:** S would substantially revise their position if the Deflationist can produce a formal model of the GR/Mercury case that:
      1.  Uses only standard Kolmogorov axioms and Conditionalization.
      2.  Does not rely on "magical" prior assignments (e.g., arbitrarily setting $P(H \vdash E)$ low without justification).
      3.  Yields a historically plausible magnitude of credence increase in GR.
  *   **Point of Fragility:** S's position relies heavily on the intuition that $P(E)$ *must* be treated as 1. If it is shown that treating $P(E)=1$ is never rationally required (due to inherent measurement error or theory-ladenness of observation), S's claim that the formalism *structurally* fails loses its primary motivation.

  ### Deflationist (D)
  *   **Condition for Revision:** D would substantially revise their position if it is demonstrated that:
      1.  Assigning probabilities to logical entailments ($H \vdash E$) necessarily violates the axioms of probability (e.g., if logical truths *must* be rigid).
      2.  The "learning of entailment" model requires more computational/epistemic resources than are plausible for human agents, rendering the model normatively inert.
  *   **Point of Fragility:** D's position risks being question-begging by shifting the problem from "Why does $E$ confirm $H$?" to "Why does learning $H \vdash E$ confirm $H$?" If the priors on logical relationships are not constrained by the formalism, D's solution may simply relocate the arbitrariness rather than solving it.

  ***

  **Signed,**

  _________________________ (Supplementationist)

  _________________________ (Deflationist)
