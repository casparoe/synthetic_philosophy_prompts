      *   **The Leader/Soldier Asymmetry:** This relies on an epistemic and authority claim. Leaders have the knowledge and authority to decide *if* war happens. Soldiers have the duty to decide *how* it happens. The law assumes soldiers cannot reasonably be expected to adjudicate the legality of the war itself (epistemic limitation) and are bound by political obligation (coercion/duty).
      *   **MEC vs. Pragmatism:** The law acts *as if* MEC is true. It doesn't matter if it's "really" true metaphysically. The legal reality *creates* the moral reality for the soldier. So it's not just pragmatism; it's constitutive. The law *makes* them equal by granting equal privilege.
