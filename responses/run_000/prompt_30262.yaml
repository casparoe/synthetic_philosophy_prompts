      *   The strongest commitment isn't full-blown moral equality (that killing is equally justified), but rather **epistemic humility combined with institutional role morality**. The law presupposes that soldiers are not competent judges of *jus ad bellum* and are coerced/obligated by their state to fight, thereby transferring the moral burden of the war's justice to the leadership, while retaining individual responsibility for the *means* of fighting.
      *   So, it's not that they are *morally* equal in a deep sense (the law admits aggression is a crime), but they are *legally* equal in combat because the law constructs a "combatant's privilege" that is independent of the war's justice to ensure functionality and fairness given epistemic limits.
