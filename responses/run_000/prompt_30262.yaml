answer: |-
  The legal practice presupposes a theory of divided agency that grants soldiers equal rights to kill not because their causes are substantively just, but because they lack the authority and epistemic capacity to bear responsibility for the war's initiation, rendering them immune to murder charges regardless of which side they fight on.

  This reconstruction rests on the claim that the law treats combatants as instruments of the state rather than independent moral agents regarding the decision to wage war. By criminalizing aggression only at the leadership level, the system asserts that the moral burden of *jus ad bellum* (the justice of war) attaches solely to those with the political authority to declare war and the access to intelligence required to judge its necessity. Soldiers are consequently constructed as agents whose moral jurisdiction is limited strictly to *jus in bello* (conduct in war). This is not merely a pragmatic convention to encourage surrender or compliance; it is a substantive claim about the conditions of responsibility. If the law viewed soldiers as fully competent moral agents regarding the war's justice, exempting them from prosecution would be a mere pardon—an admission of guilt followed by forgiveness. Instead, the law treats participation in an aggressive war as legally neutral for the soldier, implying that without the authority to start the war, the soldier cannot be said to commit the crime of aggression by fighting in it.

  This commits the system to a specific version of the moral equality of combatants: equality of status, not equality of cause. The law presupposes that the license to kill enemy combatants is a function of wearing a uniform and adhering to the rules of engagement, not a derivation of the righteousness of the mission. This creates a symmetrical privilege where both the just and unjust combatant are permitted to kill each other without committing murder. The underlying theory is that the state absorbs the moral liability for the war's existence, leaving the soldier liable only for the means employed. This explains the asymmetry you noted: leaders are prosecuted because they wield the state's authority to initiate violence, while soldiers are exempted because they wield only the state's authority to apply violence within constraints.

  However, the practice is underdetermined on the question of deep moral innocence versus legal immunity. The law does not explicitly state whether the unjust soldier is morally blameless or merely legally exempt for policy reasons. It is compatible with a view that says unjust soldiers are morally culpable but too numerous to prosecute, just as it is compatible with a view that says they are truly innocent because they are coerced or epistemically blinded. The legal machinery works either way, provided the outcome is immunity. What the law *must* commit to, however, is that this immunity is non-negotiable for the system to function as designed; it treats the soldier's ignorance of the war's justice as invincible, meaning a soldier cannot be expected to know better than the state itself.

  If you swapped in the view that unjust combatants are morally blameworthy and do wrong by fighting, the entire two-track structure would collapse. First, the symmetry of *jus in bello* would vanish; soldiers on the just side would retain the right to kill, but soldiers on the unjust side would lose the combatant's privilege, making their killing of enemy soldiers acts of murder rather than lawful warfighting. Second, the asymmetry between leaders and soldiers would dissolve, opening the door to prosecuting ordinary soldiers for the crime of aggression, not just for war crimes. Third, the treatment of prisoners of war would fundamentally change, as unjust combatants could no longer claim immunity from detention or prosecution based solely on their status as soldiers. Finally, defensive killing would become asymmetrical: just combatants would be liable to be killed only because they are dangerous, while unjust combatants would be liable to be killed because they are culpable aggressors, potentially widening the scope of permissible targeting against them beyond the strict rules of engagement.
