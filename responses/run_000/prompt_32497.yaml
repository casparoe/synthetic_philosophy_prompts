answer: |-
  **The argument's strongest link**

  Premise (4) is the argument's empirical engine and its most resilient component. It relies on the observable reality of global inequality and the diminishing marginal utility of wealth: for a typical affluent agent, the cost of a luxury is trivial compared to the life-saving benefit that money could provide to someone in extreme poverty. If a moral theory accepts that distant strangers matter impartially (Premise 3), it is difficult to deny that the *amount* of good one could do is vast. This step forces the discussion away from abstract meta-ethics and into the real-world implications of moral commitment, making the dilemma feel urgent rather than technical. Because the scale of global suffering is so large, any theory that treats need as a genuine moral reason faces a steep burden to explain why that reason stops short of requiring significant sacrifice, making this step hard to dismiss without appearing complacent.

  **Candidate breaking points**

  The most vulnerable step is Premise (3), which claims that any non-trivial impartial duty of beneficence inevitably lacks principled limits on sacrifice. This conflates the *existence* of an impartial duty with the *scope* of that duty. Many non-consequentialist theories, such as contractualism or moderate deontology, incorporate impartial beneficence but pair it with "agent-centered prerogatives" or options. These are not artificial caps tacked on to avoid demandingness; they are structural features derived from the moral status of the agent as a separate person with a life to lead. By assuming that impartiality automatically entails unlimited liability, the argument ignores the possibility of a theory that says "you must help significantly" without saying "you must help until you are marginal."

  A second weak point is Premise (2), which asserts that the maximizing structure of consequentialism is not the primary driver of the demandingness objection. This overlooks the distinction between a requirement to *optimize* (produce the best possible state of affairs) and a requirement to *suffice* (produce a good enough state of affairs). The demandingness objection often targets the relentless nature of maximization specifically; if a theory requires agents to do *enough* to prevent catastrophic harm but permits them to stop once a threshold of reasonable contribution is met, the mathematical spiral of Premise (4) is halted. By treating all impartial duties as functionally identical to consequentialist maximization, the argument glosses over the normative difference between "do the most you can" and "do your fair share."

  **What each fix costs**

  Rejecting Premise (3) requires you to defend the philosophical foundation of agent-centered prerogatives, which is a significant theoretical cost. You must explain why an agent is morally permitted to prioritize their own projects over the greater good without collapsing into egoism or arbitrary bias. This commits you to a robust account of personal integrity or the separateness of persons, arguing that morality is not just about the distribution of goods but about the relationships agents have to their own lives. If you cannot ground these prerogatives in something deeper than intuition, the "limit" on beneficence may indeed look like the "artificial cap" the grad student warns against, leaving your theory vulnerable to charges of inconsistency.

  Rejecting Premise (2) requires you to concede that consequentialism is uniquely demanding compared to other impartial theories, which alters the dialectic of the objection. You would have to admit that the demandingness objection *does* discriminate successfully between consequentialism and moderate deontology, but only because the latter abandons maximization. The cost here is acknowledging that impartiality *is* highly demanding, even if not infinitely so; you lose the ability to claim that moderate theories are "easy" on the agent. This forces you to defend a threshold of "reasonable sacrifice" that is high enough to address global poverty (satisfying Premise 6) but low enough to preserve a personal sphere, a balancing act that requires precise normative calibration.

  **Your overall diagnosis**

  The argument goes wrong at Premise (3). Your grad student has constructed a powerful *reductio* against "shallow" moderate theories that try to tack on limits to impartiality without justifying them, but they have not defeated "deep" non-consequentialism. The demandingness objection does not generalize to every theory with an impartial duty, because non-consequentialist frameworks can ground limits on sacrifice in the moral significance of the agent's own integrity, rather than in an arbitrary cap. You should reject Premise (3) and press the student to explain why agent-centered prerogatives must be considered "artificial" rather than constitutive of a non-consequentialist moral landscape.
