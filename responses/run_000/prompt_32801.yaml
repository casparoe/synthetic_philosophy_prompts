      (Drafting content...)
      Your hunch is remarkably precise. The stalemate persists because the group is treating a methodological disagreement as a metaphysical discovery problem. You are correct: this is not a debate about minds in the sense of competing empirical hypotheses about Otto's behavior. Everyone agrees on the behavior. The disagreement is about **explanatory taxonomy**.

      The structure of the disagreement is best diagnosed as a clash between **mechanistic constitution** and **functional utility**. The internalists (notebook as tool) treat "cognition" as a natural kind marked by specific physical properties—neural tissue, biological processing, or non-derived content. For them, the boundary of the mind is fixed by the boundary of the organism. To include the notebook is to misunderstand what cognition *is*.

      The externalists (notebook as mind) treat "cognition" as a functional role. For them, cognition is defined by what it *does*, not what it is made of. If the notebook plays the same causal role as biological memory, excluding it is "neural chauvinism."

      Is this verbal or substantive? It is **substantively verbal**. It is verbal because the conflict resolves to how we define the term "cognitive." If we define cognition mechanistically, the internalists win. If we define it functionally, the externalists win. However, it is substantive because these definitions carry different research programs. Choosing one definition over the other dictates where cognitive scientists look for explanations. If cognition is intracranial, we fund neuroscience. If cognition is extended, we fund human-computer interaction and environmental design. The stakes are not about the nature of reality independent of us, but about how best to carve nature for scientific utility.

      Therefore, the question "Where does the mind stop?" is a category error. It presupposes the mind is a spatial object with a surface. If cognition is a process or a level of description, it doesn't have a "stop" point in the same way a liver does. The debate runs in circles because both sides are answering different questions under the same label. The internalists ask, "What physical stuff constitutes this mechanism?" The externalists ask, "What system resources are recruited to solve this task?"

      What counts as progress? Not an experiment. No fMRI scan or behavioral test will settle this, because the empirical predictions are identical (as you noted). Not a formal result, because logic cannot dictate scientific taxonomy.

      Progress requires a **pragmatic distinction**. The group should shift from asking "Is the notebook *really* part of the mind?" to "Under what descriptions is including the notebook explanatorily fruitful?" This is a shift from metaphysics to methodology.
      1.  **Explanatory Utility:** Does modeling Otto+Notebook as a single system yield better predictions or simpler laws than modeling Otto alone? Sometimes yes (e.g., in distributed cognition tasks), sometimes no (e.g., when the notebook is lost).
      2.  **Contextual Boundaries:** Acknowledge that boundaries are interest-relative. For a neuroscientist, the mind stops at the skull. For a roboticist designing an aid for Otto, the mind includes the aid. Both are correct relative to their explanatory goals.

      Should we expect the debate to run forever? Yes, if framed metaphysically. As long as participants seek a "true" boundary independent of human interests, they will fail, because no such boundary exists. The universe does not come pre-labeled with "cognitive" and "non-cognitive" tags.

      However, the debate can dissolve if framed pragmatically. Progress looks like **conceptual engineering**. Instead of fighting over the extension of the word "mind," the group should specify the *purpose* of their classification. Are we trying to locate moral responsibility? Then the boundary might be the agent. Are we trying to improve memory performance? Then the boundary might include the notebook.

      The parity principle itself is a pragmatic tool, not a metaphysical truth. It says: "Don't discriminate against external resources if they do the same job." The internalist reply is: "Constitution matters for explanation." Both are right about their own explanatory interests.

      To move forward, your group should adopt a **pluralistic instrumentalism**. Accept that "cognition" is a polysemous term serving different scientific goals. The internalist captures the *mechanism* of implementation; the externalist captures the *system* of operation. Neither is the "one true story."

      In sum, your diagnosis is correct. It is a disagreement about what the word 'cognition' is supposed to be doing. Progress lies not in finding the mind's edge, but in recognizing that the edge is drawn by the researcher's pen, not nature's hand. Stop asking where the mind stops. Start asking where your explanation needs to go.

