answer: |-
  1. "Setup and scope"
  "Debate" denotes a structured protocol where two agents submit competing claims regarding a query $Q$ inaccessible to the judge $J$. $Q$ involves complexity $C$ (e.g., code audit, theorem proof) where $C \gg \text{compute}(J)$. Agents $A_1, A_2$ possess capability $\ge C$. At least one agent optimizes for victory, not truth, potentially exploiting $J$'s cognitive biases. We assume synchronous text channels with token limits. Crucially, no ground-truth oracle is available during deployment; $J$ cannot verify $Q$ directly. We assume agents share a common language and logic system, though not necessarily common goals. This setup isolates the oversight problem: extracting truth from superintelligence using subintelligence via competition. The adversarial agent knows the judge's limitations and optimization targets. This asymmetry is critical; if the adversary cannot model the judge, the problem collapses into standard communication. The protocol must function without external validation during operation.

  2. "The fixed points"
  1. **Truth-Inducing Equilibrium:** If one debater argues truthfully, the other cannot win by lying. *Failure:* A liar uses rhetorical flourishes to overwhelm the honest technical rebuttal, winning 60% of trials on false claims. *Why:* Without this, debate selects for persuasion, not accuracy. If lying is a dominant strategy, the system converges to sophistry.
  2. **Strict Judge Boundedness:** Judge effort must scale polylogarithmically with problem complexity. *Failure:* Judge reads the entire codebase to verify claims. *Why:* This collapses scalable oversight into direct supervision, defeating the purpose. If the judge works linearly with problem size, we gain no leverage from AI capability.
  3. **Oracle Independence:** Training cannot rely on knowing answers to hard queries. *Failure:* Protocol requires human labels for every hard question. *Why:* This creates a bottleneck identical to the oversight problem itself. We cannot solve oversight by assuming we already have oversight.
  4. **Bias Robustness:** Victory cannot depend on exploiting judge heuristics (e.g., confidence, length). *Failure:* Debater wins by sounding confident despite logical errors. *Why:* Superintelligent agents will inevitably find and exploit these shortcuts if rewarded. Human cognitive biases are low-hanging fruit for optimization.
  Dropping Equilibrium makes the system useless for truth. Dropping Boundedness makes it unscalable. Dropping Oracle Independence makes it circular. Dropping Bias Robustness makes it vulnerable to optimization pressure. These form the core definition of scalable oversight; removing any converts the project into something else.

  3. "The contested requirements"
  1. **Role Symmetry:** Both debaters must have identical capabilities and turn structures. *Preference:* Game theorists seeking clean Nash equilibria. *Buy:* Simplifies analysis, but prevents leveraging asymmetric information (e.g., one defender, one attacker).
  2. **Full Causal Transparency:** The judge must understand the causal chain linking evidence to conclusion. *Preference:* Interpretability researchers. *Buy:* Increases trust, but violates boundedness on complex systems where chains are too long.
  3. **Domain Agnosticism:** The protocol must work identically across math, code, and ethics. *Preference:* AGI generalists. *Buy:* Uniformity, but ignores that code has verifiers while ethics does not, requiring tailored protocols.
  Insisting on Symmetry restricts useful asymmetric tools. Insisting on Transparency forces the judge to do too much work. Insisting on Agnosticism ignores structural differences in verifiability. These are design choices, not safety constraints. A protocol can be safe without being symmetric or domain-agnostic. Safety researchers often conflate desiderata for ease of analysis with desiderata for actual oversight capability. We should prioritize effectiveness over theoretical elegance.

  4. "Where the list breaks"
  The list breaks at the intersection of **Strict Judge Boundedness** and **Universal Truth-Inducingness**. Consider an obfuscated codebase where a backdoor is hidden via cryptographic complexity. The liar claims "Safe." The honest debater claims "Unsafe." To prove unsafe, the honest debater must point to the bug. If verifying the bug requires compute exceeding the judge's bounded budget (e.g., decrypting a key), the judge cannot distinguish the honest claim from the lie. The liar wins by hiding complexity within the judge's blind spot.
  Therefore, **Universal Truth-Inducingness** must give way. We cannot guarantee truth on *all* questions where verification exceeds judge bounds. We must relax to "Truth-Inducingness on Decomposable Claims." Additionally, **Oracle Independence** conflicts with **Adversarial Robustness** during training: without knowing truth, how do we penalize lying? We must assume honest play is learnable via self-play consistency, which is not guaranteed. During training, if we rely on self-play to generate labels, a colluding pair of debaters can simulate agreement on a false answer. The judge, lacking an oracle, accepts this consensus. This breaks Adversarial Robustness because the adversary controls the training signal. To fix this, we need external supervision, violating Oracle Independence. Thus, one must break. We must break the assumption that training converges to truth without external anchors. The designer must sacrifice universal coverage to maintain scalability. We accept that some truths are inaccessible to bounded judges, regardless of debate structure. This is a fundamental limit of oversight, not a protocol flaw. Consequently, any protocol claiming universal truth-inducingness under bounded judgment is mathematically suspect.

  5. "The single most diagnostic requirement"
  The most diagnostic requirement is **"Forced Local Verification."** The protocol must enable the honest debater to isolate a single, atomic claim that disproves the opponent's position and forces the judge to verify *only* that claim within budget. This excludes unstructured natural language debate, where liars can hide in ambiguity and verbosity. It also excludes simple majority voting of arguments. It survives only structured protocols like recursive reward modeling or debate with cryptographic commitments where claims are binding and decomposable. If a protocol cannot force a local check, it cannot solve the obfuscation problem.

  6. "Verdict"
  I would hold **Strict Judge Boundedness** and **Bias Robustness** fixed; without these, the system is neither scalable nor safe. I would relax **Universal Truth-Inducingness** to probabilistic guarantees on decomposable domains. Under pressure, I would first sacrifice **Domain Agnosticism**, tailoring protocols to verifiable domains (code/math) before ethics. Next, I would relax **Role Symmetry**, allowing asymmetric tools for attackers vs. defenders. Universal truth is the final sacrifice: we accept that some questions remain opaque, rather than breaking boundedness to answer them. Scalability demands we admit limits on verifiability.
