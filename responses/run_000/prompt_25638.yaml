answer: |-
  The tension between the "separateness of persons" objection to utilitarianism and Derek Parfit's reductionist account of personal identity represents one of the most fertile intersections in modern moral philosophy. On one side, John Rawls and Robert Nozick argue that utilitarianism fails because it treats society as a super-individual, illegitimately aggregating harms and benefits across distinct human beings. On the other, Parfit argues that the distinctness of human beings is metaphysically shallow, consisting merely in degrees of psychological connectedness. This essay will argue that while Parfit's reductionism successfully undermines the *metaphysical* presuppositions of the Rawlsian objection, it does not fully dissolve the *moral* force of the claim. The separateness of persons retains its significance not because persons are metaphysically deep entities, but because the distinctness of consciousness, the structure of agency, and the demands of practical reason create moral boundaries that utilitarian aggregation cannot simply override.

  ### The Separateness of Persons Objection

  The objection, most famously articulated in John Rawls's *A Theory of Justice* and Robert Nozick's *Anarchy, State, and Utopia*, targets the aggregative structure of classical utilitarianism. Utilitarianism directs us to maximize the net sum of happiness. To do this, it treats the utility of one person as commensurable with and substitutable for the utility of another. If sacrificing the liberty or well-being of one person yields a greater sum of happiness for others, the utilitarian calculus may endorse it.

  Rawls argues that this extends the rational principle of prudence from the individual to the collective illegitimately. For an individual, it is rational to endure a pain now (e.g., at the dentist) for a gain later (health). This is justified because the sufferer and the beneficiary are the same person. However, Rawls contends, "society is not an experience of a single life." There is no super-subject that undergoes the sacrifice of the few to enjoy the gain of the many. Nozick sharpens this by framing it as a violation of rights: individuals are ends in themselves, not resources to be used for the social good. For both, the boundary between persons is morally significant; it acts as a constraint on aggregation. To ignore this boundary is to fail to take seriously the distinction between persons.

  ### Parfit's Reductionism

  In *Reasons and Persons*, Derek Parfit attacks the metaphysical foundation upon which the Rawlsian objection rests. Parfit defends a Reductionist view of personal identity. He argues that a person's existence over time does not consist in a "deep further fact" (a Cartesian ego or immutable soul) but simply in the holding of certain physical and psychological relations (Relation R), such as memory, intention, and character continuity.

  Parfit uses thought experiments like fission (where one brain hemisphere is transplanted into each of two bodies) to show that identity can be indeterminate. If identity depends on continuity, and continuity comes in degrees, then the boundary between "one person" and "two persons" is not as sharp as we ordinarily suppose. Parfit concludes that "identity is not what matters." What matters is psychological connectedness and the continuation of experience.

  Crucially, Parfit explicitly links this metaphysics to ethics. He suggests that if the boundaries between persons are less deep than we suppose, the difference between intra-personal trade-offs (sacrificing now for later) and inter-personal trade-offs (sacrificing you for me) is one of degree, not of kind. If the connection between me-now and me-tomorrow is weak, it resembles the connection between me and a stranger. Consequently, Parfit argues, Reductionism makes a form of utilitarianism (or at least, impartial beneficence) more plausible. It removes the metaphysical barrier that Rawls claims protects individuals from aggregation.

  ### Does Reductionism Undermine the Objection?

  At first glance, Parfit's view appears to devastate the Rawlsian objection. If the "self" is just a bundle of experiences tied together by memory and causality, why should the boundary of a human body carry absolute moral weight? If I am not a deep, enduring entity, then the sacrifice of "me" is less catastrophic, and the aggregation of my pain with another's pleasure seems less like a category error. Parfit implies that the Rawlsian objection relies on a "non-reductionist" intuition—that persons are separately existing entities—which is false.

  However, assessing this relationship requires distinguishing between *ontological separateness* and *moral separateness*. Parfit successfully challenges the former, but the latter may survive independent of metaphysical depth.

  **1. The Phenomenology of Experience**
  Even if personal identity is reductionist, the *ownership* of experience remains distinct. As Samuel Scheffler has argued, the separateness of persons is a fact about the distribution of consciousness. I do not feel your pain, even if we are psychologically connected. Utilitarianism requires a "view from nowhere" to aggregate utilities, but human life is lived from a "view from somewhere." The moral significance of person-boundaries may rest on this phenomenological isolation. Even if "I" am just a series of mental states, *this* series is causally isolated from *that* series in a way that prevents the compensation of pain by pleasure across the divide. The Rawlsian objection can be reformulated: it is not about protecting a metaphysical soul, but about respecting the distinct loci of consciousness. Reductionism does not merge these loci; it merely makes the criteria for individuating them fuzzier.

  **2. Agency and Integrity**
  Bernard Williams argued that utilitarianism attacks personal integrity by forcing agents to act as neutral channels for the satisfaction of others' desires. This objection relies on the structure of agency, not necessarily on deep identity. An agent acts from their own projects and commitments. Even if "I" am a reductionist entity, *this* agent is the one who must perform the action. To demand that an agent sacrifice their fundamental projects for the aggregate good is to alienate them from their own actions. Parfit's reductionism might lessen the weight of *past* commitments (if psychological connectedness is weak), but it does not dissolve the immediate reality of *present* agency. The boundary of agency remains a practical constraint, regardless of whether the agent is a "deep further fact."

  **3. Practical Reason and Fairness**
  Rawls's objection is ultimately rooted in a conception of fairness, not just metaphysics. In *Political Liberalism*, Rawls clarifies that the separateness of persons is a postulate of practical reason, not necessarily a claim about ultimate reality. Even if we accept Parfit's metaphysics, we still need principles to govern the interaction of distinct biological and psychological centers. If we allow aggregation without constraint, we risk permitting the enslavement of the few for the many. Reductionism does not make slavery less painful for the slave. The moral claim that "lives are separate" functions as a protective device in practical reasoning. It ensures that each center of consciousness is treated as a source of claims that cannot be simply overridden by the sum of others. Parfit shows that the *degree* of separation varies, but he does not prove that the *claim* to separation vanishes.

  ### Synthesis: A Softened Objection, Not a Defeated One

  Parfit's true contribution is not to refute the separateness of persons objection entirely, but to force its proponents to refine it. The Rawlsian objection cannot rest on the claim that persons are metaphysically distinct substances, because Parfit has shown this is untenable. However, the objection retains force if grounded in the *moral* significance of distinct lives.

  Parfit himself acknowledges that Reductionism does not *prove* utilitarianism; it merely removes a barrier to it. He admits that even if identity is not what matters, the distribution of welfare still matters. If Reductionism implies that the distinction between persons is less sharp, it suggests we should be more willing to make sacrifices for others (increasing altruism). But it does not logically entail that we should allow the *violation* of some to benefit others.

  The relationship between the two views is best understood as a shift from a binary to a scalar understanding of moral claims. Rawls treats the person-boundary as a wall; Parfit treats it as a membrane. Utilitarianism acts as if there is no boundary at all. Parfit shows the boundary is permeable, but he does not show it is non-existent. Therefore, a moral theory that completely ignores the boundary (classic utilitarianism) still errs, even if a theory that treats the boundary as absolute (libertarianism) also errs.

  ### Conclusion

  Derek Parfit's reductionist account of personal identity fundamentally challenges the metaphysical assumptions underlying the separateness of persons objection. By demonstrating that personal identity is not a deep further fact, Parfit weakens the claim that individuals are hermetically sealed ontological units. This makes the utilitarian aggregation of welfare seem less like a category mistake and more like a reasonable extension of prudence across weakly connected psychological states.

  However, Parfit does not vindicate utilitarianism completely. The moral significance of person-boundaries does not depend solely on their metaphysical depth. It rests on the distinctness of conscious experience, the integrity of individual agency, and the requirements of fairness in practical reason. Even if "I" am a fiction, *this* pain is real and localized. Consequently, the separateness of persons objection retains its force, not as a metaphysical shield, but as a moral constraint. Parfit teaches us that the boundaries between us are less rigid than we thought, but he does not teach us that they are morally irrelevant. A plausible ethics must acknowledge the fuzziness of identity without dissolving the distinct claims that separate lives make upon us.
