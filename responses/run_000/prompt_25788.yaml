  I've been trying to wrap my head around the Sleeping Beauty problem for a while now — the one where Beauty goes to sleep Sunday night, a fair coin gets flipped, and if it's heads she's woken once on Monday, but if it's tails she's woken Monday, given a memory wipe, and woken again Tuesday, and each time she wakes she's asked for her credence that the coin came up heads. I can follow the halfer reasoning (it was a fair coin, she knew she'd be woken at least once no matter what, so 1/2) and the thirder reasoning (there are three indistinguishable awakening events and only one goes with heads, so 1/3), but I can't shake the feeling that the whole dispute turns on an unspoken choice about what to count as a separate "observer-moment" and whether those moments are the right units to distribute credence over.

  I'm a systems programmer by trade. The vocabulary I actually think in is processes, forks, memory snapshots, execution traces, address spaces, and runtime instances. When I try to translate the Sleeping Beauty setup into that vocabulary, it seems natural: the experiment is a process that, conditional on the coin, forks Beauty's epistemic state into either one or two runtime instances that share initial memory but then diverge, and the question is what a particular instance should believe about which branch of execution it's running in. But I'm not sure whether that translation is faithful or whether I'm smuggling in assumptions by choosing to model it as forking rather than, say, as a single thread that gets paused and resumed.

  Can you restate the Sleeping Beauty problem and the core of the halfer–thirder debate entirely in that vocabulary — processes, forks, instances, memory snapshots, execution traces, address spaces, whatever fits — as precisely as you can? I want to see whether the philosophical disagreement survives the translation intact, or whether it turns into a disagreement about how to count instantiations of a process, or whether it dissolves into two equally valid ways of setting up the reference class.

  Then give me the residue report. Which claims translate cleanly? Which ones did you have to stretch or distort to fit? Which parts of the philosophers' debate have no counterpart in the computational picture at all? And the question I really want answered: is there something in the halfer–thirder dispute that is genuinely about probability or epistemology and that my vocabulary simply cannot express — in which case my vocabulary is missing something — or does the translation reveal that the dispute was never really about probability in the first place, but about what you're willing to count as a separate subject of credence?
