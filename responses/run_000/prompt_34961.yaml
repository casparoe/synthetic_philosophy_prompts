answer: |-
  You have put your finger on the single most persistent and uncomfortable tension in contemporary analytic metaphysics. You are right to feel that "fictionalism" is too broad; that describes the *theory*, not the *behavioral gap* you are observing.

  There is no single, canonical Greek-derived term for this specific phenomenon (like "akrasia" or "qualia"), but there are several precise technical labels that philosophers use to map the territory you are describing. Depending on whether you want to describe the *strategy*, the *critique*, or the *psychological state*, here is how the landscape is labeled.

  ### 1. The Position: "Hermeneutic Fictionalism" (or The Paraphrase Strategy)
  When the nihilist says, "I know there are no tables, but I speak as if there are," they are adopting a position technically known as **Hermeneutic Fictionalism**.

  *   **Hermeneutic:** They claim this is what we are *already* doing. They argue that when ordinary people say "table," they don't *really* mean a composite object; they mean "simples arranged table-wise." They claim to be interpreting our hidden intent.
  *   **Fictionalism:** They treat ordinary discourse as a useful fiction that is strictly false but assertible.

  This is distinct from **Revolutionary Fictionalism**, which would say, "We currently believe tables exist (wrongly), and we *ought* to stop talking that way." The nihilists you met are Hermeneutic Fictionalists: they claim the "pub talk" is already compatible with the "seminar talk" because the pub talk is just shorthand.

  ### 2. The Critique: "The Alienation Objection" (or "The Quarantine Strategy")
  The specific bug you are feeling—the hermetically sealed compartment where metaphysics never touches life—has a name in the literature. It is most commonly referred to as **The Alienation Objection** or, more pejoratively, **The Quarantine Strategy**.

  *   **The Quarantine:** Critics argue that nihilists "quarantine" their ontological commitments so they don't infect their daily lives. They keep the radical truth in the seminar room and the useful falsehoods in the pub, with no airlock between them.
  *   **The Alienation:** This term (used by philosophers like Lynne Rudder Baker and Amie Thomasson) suggests that if your metaphysics is true, you should be *alienated* from your ordinary experience. If there are no people, only simples arranged person-wise, you should feel a ontological vertigo when looking at your friend. The fact that you don't suggests the metaphysics is doing no work.

  Some critics have even used the term **"Ontological Schizophrenia"** (e.g., Baker), though this is polemical. A more neutral descriptive term you might use in your piece is **"Ontological Bifurcation."**

  ### 3. The "Sunset" Distinction: Phenomenal vs. Ontological Shorthand
  Your intuition about the astronomer is philosophically robust. Philosophers of language distinguish between:

  *   **Phenomenal Shorthand:** "The sun sets." This refers to an *appearance* that is universally shared, even if the physical model (earth rotation) differs. The shorthand tracks a real phenomenological fact.
  *   **Ontological Paraphrase:** "Pass the table." For the nihilist, this does not track an appearance; it tracks an *error*. There is no "table-appearance" distinct from the "simples-appearance."

  The problem you identified is that the nihilist is treating an **Ontological Paraphrase** as if it were a **Phenomenal Shorthand**. They want the "sun sets" pass (it's just a figure of speech) without the "sun sets" anchor (the shared physical reality of rotation). In the nihilist's "real model," there is no table-rotation equivalent. There is just the void where the table used to be.

  ### 4. Why Is There No Tension? "Quantifier Variance"
  You asked why they don't feel the tension. Many metaphysicians (most notably **Eli Hirsch**) defend this lack of tension using a doctrine called **Quantifier Variance**.

  The idea is that there is no single meaning of "exists."
  *   In the **Pub Context**, "exists" means "is part of our causal/social network." (Tables exist).
  *   In the **Seminar Context**, "exists" means "is a fundamental joint in the structure of reality." (Tables do not exist).

  If this view is correct, the philosophers aren't being inconsistent; they are switching languages. They aren't saying "Tables don't exist [in any sense]"; they are saying "Tables don't exist [in the fundamental sense]." This dissolves the tension you sense, though many (like Ted Sider) argue it makes metaphysics trivial.

  ### 5. What Should You Call It?
  If you need a term for your piece that captures the *gap* specifically (rather than the theory), I recommend **"Ontological Compartmentalization."**

  It captures the structural separation you observed: the ability to hold a radical ontology in one mental compartment and a common-sense praxis in another, with no osmotic pressure between them.

  ### 6. The Boundary: When Does It Become a Problem?
  You asked where the line is between a sensible division of labor and a philosophical failure. The standard criterion in the literature is **Explanatory Idleness**.

  *   **Sensible Division of Labor:** The metaphysics explains something the ordinary view cannot (e.g., quantum mechanics explains why the table is solid, even if we keep calling it a table). The "real model" does work.
  *   **The Problem:** If the "real model" (simples) explains nothing that the "ordinary model" (tables) doesn't already explain, and if it changes nothing about how we navigate the world, critics argue the metaphysics is **Verbal** rather than **Factual**.

  This is the Carnapian critique: If your "deep truth" has no cash value in experience, prediction, or explanation, you aren't doing metaphysics; you're just choosing a different linguistic framework.

  **Summary for your reporting:**
  The phenomenon is **Hermeneutic Fictionalism** implemented via **Ontological Compartmentalization**. The critique you are intuiting is **The Alienation Objection**: that a metaphysics which leaves lived experience entirely untouched risks being **Explanatorily Idle**. The nihilists rely on **Quantifier Variance** to deny the tension, but your "sunset" analogy correctly identifies that their shorthand lacks the **Phenomenal Anchor** that makes scientific shorthand harmless.

  If you want to press them on this, ask them: *"If your ontology is the 'real model,' what explanatory work does it do that the ordinary model doesn't? If the answer is 'none,' why is it the real model?"* That is the question that usually makes the eyes stop rolling.
