prompt: |-
  hi so i'm in student gov and we got assigned to evaluate this proposal where the school installs solar panels — costs a ton upfront (like, from our reserve fund) but saves money on electricity over ~20 years and cuts emissions. the administration told us to use "intergenerational justice" as our framework but honestly none of us know what that means as an actual thing you do, as opposed to just a vibe.

  can you turn intergenerational justice into like a decision procedure or checklist we can actually run? we have 30-minute meetings and we're not philosophers. i need: what questions to ask and in what order, what counts as a good enough answer, where the procedure says yes this is fair to future students, where it says no, and where it has to punt to a judgment call because it's values not facts.

  things it needs to handle: discounting (should we care less about students 30 years from now just cause they're far away in time?), uncertainty (we don't know future energy prices or what the climate will actually be like), and the fact that future students don't get a vote in student gov which feels kinda unfair but also unavoidable.

  then run the procedure on two cases: (1) the solar panel thing, and (2) a proposal to cut the arts budget to build a STEM lab — current students really want the lab, but it means future students lose the arts program permanently. i want to see where the procedure gives an answer i might not like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Student government member.
      *   **Task:** Evaluate a proposal (solar panels) using "intergenerational justice" (IGJ) as a framework.
      *   **Problem:** IGJ feels like a "vibe," not a tool. They need a concrete decision procedure/checklist for 30-minute meetings.
      *   **Requirements:**
          *   Questions to ask (in order).
          *   Criteria for "good enough" answers.
          *   Clear Yes/No/Punt outcomes.
          *   Handle specific issues: Discounting (time value), Uncertainty (future prices/climate), Representation (future students can't vote).
          *   Run the procedure on two cases: (1) Solar Panels (high upfront cost, long-term savings/emissions), (2) Arts Cut for STEM Lab (current benefit, permanent future loss).
          *   Show where the procedure might yield counter-intuitive or unpopular results.

  2.  **Deconstruct "Intergenerational Justice" (IGJ):**
      *   *Core Concept:* Fairness between present and future generations.
      *   *Key Philosophical Tensions:*
          *   Discounting: Do future benefits/costs count less? (Economists say yes due to uncertainty/growth; Ethicists often say no).
          *   Non-Identity Problem: Actions change *who* is born. (Too complex for a 30-min meeting, skip or simplify).
          *   Rights vs. Welfare: Do future people have rights to specific resources, or just a guarantee of minimum welfare?
          *   Substitutability: Can we trade natural capital (climate) for manufactured capital (labs/money)?
      *   *Operationalizing for Students:* Needs to be pragmatic, not academic. Focus on *burdens*, *benefits*, *irreversibility*, and *agency*.

  3.  **Drafting the Decision Procedure (The "IGJ Checklist"):**
      *   *Goal:* Make it actionable.
      *   *Structure:* 5 Steps.
      *   *Step 1: The Burden/Benefit Scan.* Who pays? Who benefits? When?
      *   *Step 2: The Reversibility Test.* Can future students undo this?
      *   *Step 3: The Discounting Rule.* How do we value future money/wellbeing? (Need a specific rule, e.g., "Low Discount Rate" for essential goods).
      *   *Step 4: The Representation Proxy.* Since they can't vote, who speaks for them? (e.g., Sustainability Office, Alumni, Data).
      *   *Step 5: The Minimum Threshold.* Does this leave future students worse off than a baseline?

      *Refining the "Discounting" aspect:* This is tricky. Pure economics says $100 in 30 years is worth less than $100 today. Ethics says a livable climate in 30 years is *more* valuable. I need a hybrid rule. Let's use a "Two-Rate" system: Financial discounting for money, Near-Zero discounting for rights/environment.

      *Refining the "Punt":* Where do values override facts? Usually in Step 5 (defining the baseline).

  4.  **Developing the Criteria (Yes/No/Punt):**
      *   *Yes:* Future students are net beneficiaries OR burdens are reversible/minimal.
      *   *No:* Future students bear permanent burdens for temporary current gains.
      *   *Punt:* Uncertainty is too high, or values conflict (e.g., money vs. environment).

  5.  **Running Case 1: Solar Panels:**
      *   *Upfront:* Reserve fund (current students' safety net?).
      *   *Downstream:* Lower tuition/fees (maybe), lower emissions.
      *   *Reversibility:* Panels stay, but can be removed (hard).
      *   *Discounting:* Financial savings accrue over 20 years.
      *   *Verdict:* Likely a "Yes" on IGJ grounds, but maybe a "Punt" on financial risk to current students.

  6.  **Running Case 2: Arts Cut for STEM Lab:**
      *   *Upfront:* Current students get cool lab.
      *   *Downstream:* Future students lose Arts forever (structural change).
      *   *Reversibility:* Low. Once a dept is cut, hard to restore.
      *   *Discounting:* Current benefit is immediate. Future loss is permanent.
      *   *Verdict:* Likely a "No" on IGJ grounds. This highlights the tension: Current students *want* this, but IGJ protects the future.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Keep it peer-to-peer, practical, not academic.
      *   *Constraint Check:* Did I handle discounting? Yes. Uncertainty? Yes. Voting? Yes.
      *   *Critique:* Is 30 minutes enough? The checklist needs to be tight.
      *   *Adjustment:* Make the "Punt" category clear. Sometimes the procedure *should* say "we can't decide this on IGJ alone."
      *   *Specific Request:* "Where the procedure says yes this is fair... where it says no... where it has to punt." I need to make sure the output explicitly labels these.
      *   *Specific Request:* "I want to see where the procedure gives an answer I might not like." This is crucial. For the Solar case, maybe the financial risk to the *current* reserve fund is an IGJ violation (depleting the safety net for future emergencies). For the Arts case, the "No" might be unpopular with current STEM advocates.

  8.  **Final Polish:**
      *   Organize into clear sections: The Framework, The Checklist, The Test Cases.
      *   Ensure the "Discounting" section is clear (Money vs. Rights).
      *   Ensure the "Representation" section addresses the voting issue.

      *(Self-Correction on Solar Case)*: Wait, if we drain the reserve fund, does that hurt future students if an emergency happens in year 5? Yes. So the procedure might flag that as a risk. I should highlight that tension.
      *(Self-Correction on Arts Case)*: The prompt says "permanently." That makes it an easy "No" for IGJ. I need to make sure I explain *why* it fails the test, even if current students love it.

  9.  **Final Output Structure:**
      *   Intro: Acknowledge the difficulty.
      *   Part 1: The "IGJ in 30 Mins" Protocol (5 Steps).
      *   Part 2: Handling the Hard Stuff (Discounting, Uncertainty, Voting).
      *   Part 3: Case Study 1 (Solar).
      *   Part 4: Case Study 2 (Arts vs. STEM).
      *   Part 5: The "Uncomfortable Truths" (Where the tool bites back).

      *Let's write it.*
answer: |-
  This is a classic problem in policy ethics: turning a high-minded principle into a spreadsheet. Intergenerational Justice (IGJ) usually gets stuck in philosophy seminars because it deals with people who don't exist yet. But for student gov, you need a **risk-assessment tool**, not a thesis.

  Here is a pragmatic **Intergenerational Justice Protocol (IJ-Protocol)** designed for a 30-minute meeting. It treats future students as "silent stakeholders" with veto power over irreversible harm.

  ---

  ### Part 1: The IJ-Protocol (5 Steps)

  Run these steps in order. If you hit a **STOP**, the proposal fails the IGJ test unless you can mitigate the risk.

  #### Step 1: The Burden/Benefit Map
  **Question:** Who pays the costs (money, effort, restriction) and who gets the benefits (savings, services, environment)? Break it down by time: *Years 0–5 (Current)* vs. *Years 5–20+ (Future)*.
  *   **Pass:** Costs and benefits are roughly balanced across time, OR future students get net positive benefits.
  *   **Fail (STOP):** Current students get 100% of the benefits; future students get 100% of the costs (debt, maintenance, environmental damage).

  #### Step 2: The Reversibility Test
  **Question:** If future students hate this decision, can they undo it without massive cost?
  *   **Pass:** The decision is reversible (e.g., a 1-year contract, a program that can be restarted).
  *   **Fail (STOP):** The decision is structurally permanent (e.g., selling land, cutting a department, depleting a non-renewable reserve).

  #### Step 3: The Discounting Rule (Money vs. Rights)
  **Question:** How are we valuing the future?
  *   **For Money:** Apply a **3% discount rate**. (A \$100 saving in 20 years is worth ~\$55 today). This accounts for inflation and investment risk.
  *   **For Rights/Environment:** Apply a **0% discount rate**. (A livable climate or free speech in 2045 is worth exactly as much as it is today).
  *   **Pass:** The project passes cost-benefit analysis using these rates.
  *   **Fail (STOP):** The project relies on counting future environmental benefits as "worth less" than current financial costs.

  #### Step 4: The Representation Proxy
  **Question:** Since future students can't vote, who is speaking for them in this room?
  *   **Requirement:** You need data or a designated advocate. You cannot assume "the administration knows best."
  *   **Pass:** You have consulted a long-term office (Facilities, Sustainability, Alumni Endowment) or have hard data on long-term maintenance.
  *   **Fail (STOP):** The only justification is "trust us, it'll work out."

  #### Step 5: The Minimum Threshold (The "Punt" Zone)
  **Question:** Does this leave future students with *less* capacity to solve their own problems than we have now?
  *   **Yes (Fair):** Future students have the same or better resources/opportunities.
  *   **No (Unfair):** We are consuming their capital (financial or natural) to fund our consumption.
  *   **Punt (Values Call):** If the answer is unclear, you must vote based on values. The procedure cannot calculate "how much risk is acceptable."

  ---

  ### Part 2: Handling the Hard Stuff

  Here is how the protocol specifically handles the three issues you raised:

  **1. Discounting (Do we care less about people 30 years away?)**
  *   **The Procedure:** Use the **Split-Rate Rule (Step 3)**.
  *   **Why:** Economists discount money because \$100 invested today grows. Ethicists *never* discount rights.
  *   **Application:** If the proposal saves money but hurts the climate, the climate harm weighs heavier in the calculation. If the proposal costs money now but saves more money later, you must discount the future savings to see if it's actually worth the upfront hit.

  **2. Uncertainty (Energy prices, climate models)**
  *   **The Procedure:** Use **Scenario Planning in Step 1**.
  *   **Why:** You can't predict the future, but you can predict *ranges*.
  *   **Application:** Don't ask "What will energy cost?" Ask "What if energy costs double? What if it halves?" If the proposal only works if energy prices double, it fails the Uncertainty Test.

  **3. No Vote (Future students have no agency)**
  *   **The Procedure:** Use **The Reversibility Test (Step 2)** as a proxy for voting.
  *   **Why:** If I can't vote, my protection is the ability to *change my mind* later.
  *   **Application:** If a decision removes the ability for future students to change their mind (irreversible), the burden of proof shifts to the proposers to show why it's essential.

  ---

  ### Part 3: Running the Cases

  Here is the protocol applied to your two scenarios.

  #### Case 1: Solar Panels
  *   **Proposal:** Spend \$2M from Reserve Fund. Payback in 12 years. Lifespan 25 years. Cuts emissions.
  *   **Step 1 (Map):** Current students lose \$2M reserve safety net. Future students get lower electricity bills + cleaner campus.
      *   *Status:* **Mixed.** Financial burden is front-loaded; benefit is back-loaded.
  *   **Step 2 (Reversibility):** Can they undo it? You can't un-install panels easily, but they generate value. If future students hate them, they can still use the power.
      *   *Status:* **Pass.** (Low regret risk).
  *   **Step 3 (Discounting):**
      *   *Money:* \$2M today vs. \$3M savings over 25 years. Discounted at 3%, future savings are worth ~\$1.4M today. **Financial Loss.**
      *   *Environment:* Emissions cut is a "Right." 0% discount. **Environmental Gain.**
      *   *Status:* **Punt.** Financially it's a net loss in present value; Ethically it's a gain.
  *   **Step 4 (Proxy):** Did Facilities confirm the 25-year lifespan? Did Finance confirm the reserve won't be needed for an emergency in Year 5?
      *   *Status:* **Conditional Pass.** (Requires data).
  *   **Step 5 (Threshold):** Does this leave future students poorer?
      *   *Analysis:* If the reserve fund is their emergency safety net, draining it violates IGJ. If the reserve is just "savings," it's fine.
      *   *Verdict:* **PUNT to Values.**
      *   *Why:* You have to decide: Is the Reserve Fund "Capital we must preserve" or "Cash we can spend"? IGJ says preserve capital. If spending this \$2M leaves future students vulnerable to a tuition crisis, this is **Unfair**. If it's just surplus cash, it's **Fair**.

  #### Case 2: Cut Arts for STEM Lab
  *   **Proposal:** Eliminate Art History major (permanent). Use savings to build High-Tech STEM Lab.
  *   **Step 1 (Map):** Current students get cool Lab. Future students lose Art History major forever.
      *   *Status:* **Fail.** Current benefit, Future permanent loss.
  *   **Step 2 (Reversibility):** Can future students bring back Art History?
      *   *Analysis:* Once faculty are tenured elsewhere and curriculum is gone, it is functionally impossible to restart.
      *   *Status:* **FAIL (STOP).** This is irreversible.
  *   **Step 3 (Discounting):**
      *   *Money:* Lab costs money to maintain. Arts saved money.
      *   *Rights:* Education diversity is a "Right" (0% discount).
      *   *Status:* **Fail.** You are trading a permanent right (curriculum breadth) for a temporary asset (lab tech becomes obsolete in 10 years).
  *   **Step 4 (Proxy):** Who speaks for the future Art students?
      *   *Analysis:* They don't exist. No one is advocating for the student in 2035 who wants to study Art.
      *   *Status:* **Fail.**
  *   **Step 5 (Threshold):** Capacity to solve problems.
      *   *Analysis:* Future students have a STEM lab (good) but fewer critical thinking tools from Arts (bad).
      *   *Verdict:* **NO (Unfair).**
      *   *Why:* The procedure flags this as **Intergenerationally Unjust**. You are consuming the *variety* of education (a renewable resource) to build *infrastructure* (a depreciating asset). Future students inherit a narrower world.

  ---

  ### Part 4: Where the Procedure Bites You (The "Uncomfortable Truths")

  You asked to see where this gives an answer you might not like. Here is where the IJ-Protocol conflicts with typical Student Gov incentives:

  **1. The Solar "Financial Loss" (Case 1)**
  *   **The Vibe:** "Solar is good! Green energy! We should do it!"
  *   **The Procedure:** Under the **Discounting Rule (Step 3)**, the solar panels might actually be a *financial loss* in present value terms. If you treat the Reserve Fund as "Future Student Capital," spending it is technically **unfair** to future students who might face a recession in Year 5.
  *   **The Uncomfortable Truth:** To pass IGJ, you might have to admit you are doing this for *ethics*, not *finance*. You are asking current students to take a financial hit (risking the reserve) to give future students a cleaner climate. The procedure forces you to admit: **"We are spending their safety net to buy their clean air."** That is a values call, not a math win.

  **2. The STEM "Popularity Trap" (Case 2)**
  *   **The Vibe:** "STEM gets jobs! Arts don't! Current students want the lab!"
  *   **The Procedure:** The **Reversibility Test (Step 2)** kills this immediately. Because the cut is permanent, future students have no "vote" to bring it back.
  *   **The Uncomfortable Truth:** The procedure says **NO**, even if 90% of current students vote YES. IGJ acts as a "Constitutional Court" overruling the majority. If you follow this protocol, you have to tell your constituents: *"You can't vote to sell the future's options, even if you really want the lab."*

  **3. The "Punt" Problem**
  *   **The Vibe:** "We need a clear answer."
  *   **The Procedure:** Step 5 forces a **Punt** on the Solar Panel reserve issue.
  *   **The Uncomfortable Truth:** The procedure admits it cannot solve everything. It forces you to say: *"Mathematically, this is risky. Ethically, it's good. We have to vote based on gut feeling."* Student gov hates ambiguity, but IGJ demands it.

  ### Summary Checklist for Your Meeting

  1.  **Map Time:** Who pays now? Who pays later?
  2.  **Check Reversibility:** Can they undo this in 10 years? (If No, burden of proof is high).
  3.  **Split Discount:** Discount money at 3%. Discount rights/environment at 0%.
  4.  **Find Proxy:** Who has the long-term data? (If no one, pause).
  5.  **Check Capital:** Are we spending their safety net or their surplus?

  If you follow this, you aren't just vibing on "justice." You're auditing the future.
