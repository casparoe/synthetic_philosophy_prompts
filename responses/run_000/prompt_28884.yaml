  6.  **Final Polish:** Ensure the structure matches the prompt's requirements (Definite position, specific sections on nature of blame, standing, consistency, and counterfactual). (Proceed to generate output based on this plan).

      *   *Key Terminology:* "Communicative Theory," "Normative Solidarity," "Institutional vs. Moral Standing," "Akrasia vs. Contempt."

  7.  **Final Review against constraints:**
