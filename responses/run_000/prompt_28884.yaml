      *Wait, do I?* If I violate it but admit I was wrong, I stay in. If I violate it and claim it's fine, I step out. So standing is lost through *unacknowledged violation* or *hypocritical assertion of superiority*.
      *Better:* Standing is lost when the blame implies a moral superiority that the blamer's actions belie. It creates a "moral inequality" that violates the reciprocity required for blame.

