      *   *Option C: Communicative/Relational.* Blame is a demand for accountability within a moral community. To make this demand, you must acknowledge the authority of the norm yourself.
      *   *Selected Position:* I will argue for a **Communicative/Relational Theory of Blame**. Blame is not a verdict; it is a *summons* to a moral dialogue. Standing is forfeited when the blamer undermines the shared commitment necessary for that dialogue.
      *   *Why?* This explains why math/advice differ (they are about truth/utility, not mutual accountability) and why "clean hands" matters in equity (relationships).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** State the thesis clearly. The practice commits us to a view of blame as a *communicative act of moral accountability* rather than a *descriptive assertion of wrongness*. Standing is derived from *solidarity* with the norm, not perfection.

      *   **1. The Nature of Blame (Why Hypocrisy Matters):**
          *   Contrast with math/medicine. Math is about objective truth. Medicine is about causal efficacy.
          *   Blame is about *authority to hold accountable*.
