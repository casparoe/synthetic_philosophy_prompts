answer: |-
  The widespread practice of dismissing hypocritical blame commits us to a **Communicative Theory of Blame**, grounded in **Normative Solidarity**.

  On this view, blame is not primarily an assertion of fact (e.g., "You violated rule X") nor merely a sanction (e.g., "I will punish you"). Rather, blame is a **speech act of moral accountability** that seeks to restore a breached relationship by demanding that the wrongdoer acknowledge the authority of a shared norm. Because blame functions to regulate relationships within a moral community, it requires the blamer to stand in a specific relation to the norm and the target. Hypocrisy undermines blame not because it makes the content false, but because it severs the **reciprocity** required for the speech act to be felicitous.

  Here is the reconstruction of the theory this practice presupposes, along with an analysis of its consistency and implications.

  ### 1. The Nature of Blame: Accountability, Not Description
  The practice commits us to the view that blame is distinct from other normative speech (like mathematical correction or medical advice) because it is inherently **relational and reciprocal**.

  *   **Mathematical/Medical Speech:** When a doctor tells a patient to quit smoking, the authority derives from *expertise* and *causal efficacy*. The doctor's health is irrelevant to the biological truth that smoking causes cancer. The goal is the patient's well-being, not the regulation of a shared moral bond.
  *   **Moral Blame:** When you blame someone, you are not merely describing a wrong; you are *holding them to account*. This act presupposes that you and the target are members of the same moral community, subject to the same laws.

  Hypocrisy undermines blame because it violates the **principle of reciprocity**. To blame someone is to say, "We are both subject to this norm, and you have violated it." If the blamer is actively violating the same norm without acknowledgement, their implicit claim is, "I am exempt from this norm, but you are not." This establishes a moral inequality that invalidates the demand for accountability. The hypocrite treats the norm as a weapon to be used against others rather than a law binding on all. Therefore, for blame to function, the blamer must demonstrate **normative solidarity**—a willingness to be judged by the same standard they are invoking.

  ### 2. The Account of Standing: Solidarity, Not Perfection
  The practice commits us to a specific account of standing: **Standing is forfeited by a lack of commitment to the norm's authority, not by the mere fact of violation.**

  This resolves the "white lie vs. fraudster" puzzle. If standing required moral perfection, no one could ever blame anyone. The practice implies a distinction between **weakness of will (akrasia)** and **contempt for the norm**.

  *   **Retained Standing:** If I condemn dishonesty but once told a white lie which I regret, I retain standing. I acknowledge the norm's authority over me; I failed to live up to it, but I do not claim exemption. My blame says, "We both owe fidelity to the truth; I failed, you failed, let us uphold it."
  *   **Lost Standing:** If I condemn dishonesty while actively engaging in fraud and rationalizing it as "just business," I lose standing. My actions signal that I do not regard the norm as binding on me. My blame says, "You must follow the truth, but I am above it."

  Therefore, the practice implies that standing is a function of **acknowledged subjection**. We lose the right to blame when our conduct implies that we place ourselves outside the jurisdiction of the norm we are invoking.

  ### 3. Internal Consistency: The Institutional vs. Moral Distinction
  Is the practice internally consistent? **No, not entirely.** Our folk morality frequently conflates **institutional authority** with **moral standing**, leading to contradictions that the underlying theory exposes.

  *   **The Judge Example:** The prompt notes that a judge who has committed crimes can still sentence a criminal. Under the Communicative Theory, this is a category error. The judge is not exercising *moral standing*; they are exercising *institutional authority*. Their power derives from the State, not from moral solidarity. However, in public discourse, we often treat political or corporate leaders as both institutional authorities and moral peers. When a politician denounces tax evasion while evading taxes, we reject their *moral* blame (consistent with the theory) but often allow them to retain *institutional* power (inconsistent with the theory, if we believe office requires moral stewardship).
  *   **The Philosopher Example:** A philosopher teaching ethics they don't live by retains standing because their role is *theoretical exposition*, not *pastoral accountability*. However, if that philosopher publicly shames a colleague for the very vice they harbor, they lose standing.

  **Where Revision is Needed:** The practice is inconsistent when it allows institutional figures to wield moral blame without moral standing. We should revise our norms to distinguish clearly between **sanctions** (which can be applied by imperfect officials, like the judge) and **moral censure** (which requires solidarity). A politician evading taxes should not be dismissed from office solely on moral grounds if the law allows it (institutional view), but their *criticism* of others' tax habits should be treated as null and void in public debate (moral view). Currently, we often let the institutional power shield them from the loss of moral standing.

  ### 4. The Counterfactual: If Blame Were Mere Truth-Assertion
  If we replaced this theory with the view that blame is nothing more than the assertion of moral truth (where standing is irrelevant), our practices would undergo a radical, and largely detrimental, transformation.

  *   **Workplace Complaints:** HR departments would be forced to investigate complaints regardless of the complainant's behavior. While this sounds fair procedurally, it would poison workplace culture. A manager known for harassment could formally reprimand subordinates for minor infractions. Under the "truth-only" view, the reprimand is valid. Under the Communicative Theory, it is an abuse of power that destroys trust. Removing the standing requirement would turn moral discourse into a weaponized bureaucracy.
  *   **Public Debate:** Political discourse would become purely technocratic. We would have to engage with the policy arguments of corrupt leaders without reference to their character. While this avoids the *ad hominem* fallacy, it ignores the **predictive and constitutive value** of character. A leader who violates the norms they preach signals that the norms are not truly operative in their administration. Ignoring this removes a vital heuristic for voters.
  *   **Law:** The "clean hands" doctrine in equity would be abolished. A plaintiff who breached a contract could still sue the defendant for breaching the same contract, provided the defendant was technically in the wrong. This would turn courts into engines of abstract logic rather than arbiters of fairness.

  ### Conclusion: The Definite Position
  The practice of dismissing hypocritical blame is philosophically sound in its core intuition but messy in its application. It commits us to the view that **blame is a demand for accountability that requires the blamer to participate in the normative order they seek to enforce.**

  *   **What is right:** The intuition that hypocrisy destroys standing is correct because blame is a communicative act requiring reciprocity. Without solidarity, blame becomes mere aggression.
  *   **What is underdetermined:** The line between *akrasia* (weakness) and *contempt* (rejection of the norm). Our practice needs to be more forgiving of those who acknowledge their failures while maintaining their criticism.
  *   **What is inconsistent:** We too often allow institutional power to masquerade as moral standing. We need to revise our practices to acknowledge that a judge, CEO, or politician may have the *power* to sanction, but if they are hypocrites, they lack the *moral authority* to blame.

  We should not abandon the standing requirement. To do so would be to strip morality of its communal nature, reducing it to a system of surveillance where the worst observers are permitted to be the loudest judges. The "tu quoque" response is not a logical fallacy in the realm of moral accountability; it is a defense of the reciprocity that makes morality possible.
