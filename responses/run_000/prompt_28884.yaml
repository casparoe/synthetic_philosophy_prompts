          *   Thesis: Blame is a demand for justification. Hypocrisy signals, "I do not regard this norm as binding on me," which undermines the demand that it be binding on *you*.

      *   **2. The Account of Standing:**
          *   Is it moral record? No (the "white lie" vs. fraudster problem).
          *   Is it commitment? Yes.
          *   *Refinement:* It's not about being sinless; it's about *repudiation*. Standing is lost when the hypocrisy implies a *rejection* of the norm's authority, not just a weakness of will.
          *   *Key Distinction:* Akrasia (weakness) vs. Contempt. The smoker doctor acknowledges smoking is bad (solidarity with the norm). The cheating spouse often rationalizes cheating as acceptable for them (contempt for the norm).
          *   *Position:* Standing is based on **Normative Solidarity**. You must stand *with* the target under the same law.

      *   **3. Internal Consistency (The Selective Practice):**
          *   *Problem:* We let judges sentence criminals even if judges have committed crimes. We let philosophers teach ethics they don't live.
          *   *Analysis:* This reveals an inconsistency in our *folk* practice, but one resolvable by the theory.
          *   *Resolution:* Institutional roles (judges) derive standing from the *office*, not the person. Personal blame (friends, public discourse) derives standing from *moral solidarity*.
          *   *Critique:* Our practice is inconsistent when we conflate institutional authority with moral standing. We often let politicians off the hook using "institutional" defenses for what is clearly "moral" criticism. This needs revision.

      *   **4. The "Truth-Only" Counterfactual:**
