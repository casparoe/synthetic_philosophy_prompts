answer: |-
  ### Exam Question

  **Question 4 (Causation by Omission)**

  Consider the following scenario:
  *Dr. Aris is responsible for maintaining the oxygen levels in a hospital incubator. She goes on lunch and forgets to check the valve. The oxygen drops, and the infant inside dies. A simple counterfactual analysis holds: if Aris had checked the valve, the infant would have lived. Therefore, her omission caused the death. However, consider the President of the United States. If the President had flown to the hospital and checked the valve, the infant would have also lived. The President did not do this.*

  Write an essay addressing the following:
  Does a broadly counterfactual theory of causation have the resources to treat Aris's omission as a cause while excluding the President's omission, without abandoning its claim to be a **reductive, mind-independent** account of causation? In your answer, you must explicitly address the **selection problem** and take a definitive stand on whether causal selection is a metaphysical or pragmatic matter.

  ***

  ### Model Answer

  A broadly counterfactual theory of causation, such as Lewis's, faces a significant dilemma when accounting for omissions. On one hand, omissions clearly exhibit counterfactual dependence: had Dr. Aris acted, the infant would have lived. On the other hand, so does the President's inaction. If counterfactual dependence is sufficient for causation, the world is saturated with infinite negative causes, rendering the concept trivial. To save the theory, one must solve the selection problem: distinguishing causes from background conditions. The central tension is whether this selection can be made without sacrificing the theory's reductive, mind-independent status.

  The proliferation problem arises because counterfactual dependence is ubiquitous. The infant's survival counterfactually depends on the President not being in the room just as much as it depends on Aris checking the valve. A strict metaphysical reading of counterfactualism implies both are causes. Most theorists find this unacceptable; we intuitively select Aris, not the President, as *the* cause. The challenge is explaining this selection.

  One common strategy is to appeal to norms or expectations. Aris had a duty to check the valve; the President did not. Therefore, Aris's omission is a cause, while the President's is merely a background condition. This solves the selection problem pragmatically. However, this move threatens the reductive project. If causation depends on duties, and duties are social or mind-dependent constructs, then causation itself becomes mind-dependent. A reductive theory aims to analyze causation in terms of fundamental physical relations (like dependence), not normative statuses. If we bake norms into the metaphysics of causation, we fail to provide a mind-independent account of the world's structure. We have merely analyzed causation in terms of human expectation.

  Alternatively, one might argue that causal selection is pragmatic, but causation itself remains metaphysical. On this view, both Aris and the President are metaphysically causes (because both satisfy counterfactual dependence), but we only *cite* Aris in causal explanations due to conversational norms. This preserves the mind-independent nature of the causal relation. However, this comes at a high cost: it admits that the "causes" we talk about in science and law are not the same as the "causes" in our metaphysics. It renders our ordinary causal judgments systematically elliptical.

  A more robust solution for the counterfactual theorist is to adopt a contrastive account of causation (e.g., Schaffer). Here, causation is not a binary relation between event and outcome, but a quaternary relation: *c* rather than *c** causes *e* rather than *e**. In Aris's case, the contrast is "Aris checking vs. Aris not checking." In the President's case, the relevant contrast is not "President checking vs. President not checking," because the former was never a live option in the context. The context fixes the contrast class.

  This approach allows the theorist to take a stand: causal selection is built into the metaphysical structure of the causal relation via contrast classes, which are fixed by context. While context involves minds, the causal relation relative to that context is objective. This is superior to the "norms" approach because it treats the selection as part of the logical form of causation, not an add-on. However, it still concedes that causation is not entirely context-independent.

  In conclusion, a counterfactual theory can treat omissions as causes without triviality, but it cannot remain fully context-independent. The best stand is that causal selection is metaphysical but contrastive. We must reject the idea that there is a single, absolute list of causes for any event. Aris is the cause relative to the context of hospital duties; the President is not. This preserves the reductive link to counterfactual dependence while acknowledging that causal claims are inherently sensitive to the alternatives we consider relevant. To demand a fully mind-independent, non-contrastive account is to demand a theory that cannot distinguish the gardener from the Queen.

  ***

  ### Marking Scheme

  **Grade A (Excellent: 80-100%)**
  *   **Identifies the Core Tension:** Explicitly articulates the conflict between *counterfactual sufficiency* (which includes the President) and *reductive objectivity* (which struggles to exclude the President without norms).
  *   **Distinguishes Metaphysics from Pragmatics:** Clearly differentiates between "causal dependence" (metaphysical) and "causal selection" (explanatory/pragmatic).
  *   **Critiques the Normative Solution:** Explains *why* appealing to duties/norms threatens the mind-independent status of a reductive theory (i.e., it makes causation dependent on social constructs).
  *   **Takes a Stand:** Commits to a position (e.g., Contrastivism, Pragmatic Selection, or Error Theory) and defends the implications of that choice for the definition of causation.
  *   **Uses the Scenario:** Integrates Aris and the President specifically to illustrate the points, rather than speaking only in abstractions.

  **Grade B (Good: 60-79%)**
  *   **Identifies the Proliferation Problem:** Correctly explains why the President counts as a cause under simple counterfactualism.
  *   **Proposes a Solution:** Suggests norms or expectations as a way to filter causes (Aris vs. President).
  *   **Misses the Metaphysical Cost:** Fails to fully analyze *why* using norms threatens the reductive/mind-independent project. Treats the normative solution as unproblematic for metaphysics.
  *   **Vague Stand:** Discusses the selection problem but hedges on whether selection is part of the metaphysics or just our talk about it.
  *   **General Application:** Uses the scenario mostly as an intro, then reverts to general discussion of omissions without tying it back to Aris/President.

  **Common Student Mistakes & How to Catch Them**
  *   **Mistake:** *Denying omissions are causes entirely.* (e.g., "Omissions are nothing, so neither caused the death.")
      *   **Catch:** The Marking Scheme requires engagement with the *counterfactual* framework provided in the prompt. Answers denying the premise of the counterfactual theory without arguing within that framework should be capped at a C.
  *   **Mistake:** *Confusing dependence with selection.* (e.g., "The President isn't a cause because he didn't depend on the baby.")
      *   **Catch:** Look for the distinction in the "Grade A" criteria. If they claim the counterfactual is false for the President, they misunderstand the proliferation problem.
  *   **Mistake:** *Assuming norms solve the metaphysical problem.* (e.g., "Because Aris had a duty, she is the metaphysical cause.")
      *   **Catch:** The "Critiques the Normative Solution" criterion in the A band. B students will make this move; A students will explain why this makes causation mind-dependent.
