          *   Phenomenology (The "What it's like" problem).
          *   The "Mass" Problem (Events vs. Interpretations).
      *   **Section 3: Survival of the Deflationary Conclusion:**
          *   What holds (Pragmatic utility, no soul).
          *   What breaks (The dismissal of survival questions, the nature of blame).
          *   Independent Arguments (Multiple Drafts, Heterophenomenology).
      *   **Section 4: A Better Analogy:** The Corporation (Legal Fiction) or The Vortex (Dynamic Pattern). Let's go with **The Corporation** because it handles blame/praise/survival better.
      *   **Conclusion:** Summarize the audit.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to strawman Dennett. Dennett knows CoG is limited. He uses it to kill the *Cartesian Theater*. The forum user is using it to kill *survival questions*. That's an overreach.
