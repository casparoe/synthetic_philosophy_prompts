      *   *Structure:* An author believes every statement in their book ($B(p_1), B(p_2), \dots, B(p_n)$). However, in the preface, they write, "Despite my best efforts, there are likely errors in this book" ($B(\neg(p_1 \land p_2 \land \dots \land p_n))$).
