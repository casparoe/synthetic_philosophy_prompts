answer: |-
  Your friend is actually right, and this is one of the most common sticking points when people first encounter Galen Strawson. It is totally understandable why you think his argument relies on determinism, because usually, when we talk about free will, we think the battle line is drawn between **Determinism** (no free will) and **Indeterminism** (free will is possible).

  However, Strawson's "Basic Argument" is designed to be a trap that catches **both** sides. It doesn't matter if the universe is deterministic or indeterministic; Strawson argues that *Ultimate Moral Responsibility* is logically impossible for human beings either way.

  Here is the breakdown of why your intuition about indeterminism doesn't save you from Strawson's argument.

  ### 1. The Core of the Basic Argument (The Regress)
  You summarized this part pretty well. Strawson argues that to be **Ultimately Responsible (UR)** for an action, you must be responsible for the mental nature that produced that action.

  *   **Step 1:** You perform Action $X$.
  *   **Step 2:** To be UR for $X$, you must be UR for the character/motives ($M_1$) that led you to do $X$.
  *   **Step 3:** But you didn't choose $M_1$ out of nowhere. You chose (or formed) $M_1$ based on a *previous* mental nature ($M_0$).
  *   **Step 4:** To be UR for $M_1$, you must be UR for $M_0$.
  *   **Step 5:** This leads to an infinite regress. You would need to have existed *before* you existed to choose the initial setup of your mind.

  Strawson calls this the requirement of being **_causa sui_** (cause of itself). He argues that nothing can be _causa sui_. You cannot pull yourself up by your own bootstraps.

  ### 2. Why Indeterminism Doesn't Help
  This is the part that is confusing you. You are thinking: *"If the universe isn't determined, then my choices aren't pre-set by the past. So I can originate something new!"*

  Strawson (and many other skeptics) responds with the **"Luck Objection."**

  If the universe is indeterministic, that means at some point, a choice is **not** fully determined by prior causes. It has an element of randomness or chance.
  *   **If your choice is determined:** It comes from your past (which you didn't choose). $\rightarrow$ No Ultimate Responsibility.
  *   **If your choice is random (indeterministic):** It pops into existence without a sufficient cause. $\rightarrow$ No Ultimate Responsibility.

  **Why?** Because randomness is not *control*. If a neuron fires randomly in your brain and causes you to raise your hand, you didn't "will" that. It just happened *to* you.

  Strawson argues that for you to be responsible for a choice, the choice must come from **you**.
  *   If it comes from your character, we ask: "Where did that character come from?" (Back to the regress).
  *   If it comes from randomness, we ask: "How is that *yours*?" (It's just luck).

  So, adding randomness to the mix doesn't give you *more* ownership of your actions; it actually makes your actions *less* connected to who you are.

  ### 3. Is it just "Determinism in Disguise"?
  No. This is the crucial distinction.
  *   **Hard Determinism** says: "Free will is impossible *because* the laws of physics determine everything." (If physics were different, free will might be possible).
  *   **Strawson's Impossibilism** says: "Ultimate Responsibility is impossible *because of the logical structure of agency itself*."

  Strawson is saying that even if God waved a wand and made the universe indeterministic, you *still* couldn't be Ultimately Responsible. Why? Because you still couldn't be _causa sui_. You still couldn't choose the "you" that makes the choices without already having a "you" to do the choosing.

  ### 4. What is Strawson actually denying?
  It is important to note that Strawson isn't necessarily saying we should stop punishing criminals or that we are all zombies. He distinguishes between:
  1.  **Free Will (Compatibilist sense):** Can you do what you want to do? Are you coerced? (Strawson admits we have this).
  2.  **Ultimate Moral Responsibility:** Do you deserve infinite praise or blame in a cosmic sense because you are the *absolute originator* of your actions? (Strawson says this is impossible).

  ### Summary for your class
  *   **Your intuition:** Indeterminism breaks the chain of cause-and-effect, allowing for free will.
  *   **Strawson's counter:** Breaking the chain of cause-and-effect just introduces randomness. Randomness doesn't equal responsibility.
  *   **The Real Argument:** To be responsible, you must be the cause of yourself. Since you can't be the cause of yourself (you can't exist before you exist to create yourself), Ultimate Responsibility is logically impossible, regardless of whether the universe is deterministic or not.

  So, your friend is right: Strawson's argument is meant to block the indeterminist escape route. It's not just a fancy version of hard determinism; it's an argument that the very concept of "Ultimate Responsibility" is incoherent for finite beings.
