answer: |-
  ### The Procedure

  **Step 1: Define the Hazard and Outcome Specifics**
  Clearly state the chemical, the exposure route, and the specific health outcome (e.g., "Liver toxicity in adults via ingestion"). Do not generalize. If studies measure different outcomes (e.g., liver enzymes vs. cancer), treat them as separate questions. **[JUDGMENT CALL]**: Deciding which outcomes are relevant enough to regulate is a policy choice, not a scientific fact.

  **Step 2: Map the Evidence Landscape**
  List all available studies. Categorize them by design (human observational, animal toxicology, in vitro) and quality (sample size, control for confounders, exposure assessment accuracy). Do not discard studies yet, but flag those with critical flaws (e.g., exposure measurement error so high the data is unusable). **[JUDGMENT CALL]**: Determining what constitutes a "critical flaw" requires expert consensus, not just a checklist.

  **Step 3: Establish the Plausibility Range**
  Instead of calculating an average effect size, determine the *Lower Bound* and *Upper Bound* of plausible risk.
  *   **Lower Bound:** Based on the most rigorous studies showing no effect or the smallest effect. If high-quality studies show null results, the lower bound is near zero.
  *   **Upper Bound:** Based on the studies showing the largest effect, adjusted downward only for clear biases. If a small study shows huge risk but has weak controls, discount it but do not ignore it.
  *   **Result:** You now have a range (e.g., "Risk is between 0% and 15%"). If the range includes zero and extends to significant harm, your evidence is imprecise.

  **Step 4: Assess Biological Mechanism and Consistency**
  Check if the human data aligns with toxicological data.
  *   If animal studies show harm at plausible doses, raise the *Lower Bound*. It is biologically implausible for a chemical to harm rats but be perfectly safe for humans at similar exposures.
  *   If human data shows harm but no mechanism exists, and confounding is likely, lower the *Upper Bound*.
  *   **[JUDGMENT CALL]**: Weighing animal vs. human data involves uncertainty about species extrapolation. Document the reasoning used to adjust the bounds.

  **Step 5: Apply the Decision Rule**
  Compare your Plausibility Range to your agency's action thresholds.
  *   **Restrict:** If the *Lower Bound* exceeds the acceptable risk threshold (e.g., even the most optimistic view shows unacceptable harm).
  *   **Monitor/Research:** If the *Upper Bound* exceeds the threshold but the *Lower Bound* does not (i.e., harm is possible but not proven). Use precautionary measures if the potential harm is severe (e.g., cancer) and irreversible.
  *   **No Action:** If the *Upper Bound* is below the threshold (i.e., even the worst-case plausible scenario is safe).
  *   **Insufficient Evidence:** If the range is so wide (e.g., 0% to 90%) that no decision rule applies. **[JUDGMENT CALL]**: Deciding when uncertainty is "too wide" to act is a policy decision regarding risk tolerance.

  **Step 6: Document the Uncertainty**
  Publish the Plausibility Range alongside the recommendation. Explicitly state which studies drove the Upper Bound and which drove the Lower Bound. Identify exactly where the data conflicts. This protects the agency from accusations of hiding uncertainty and clarifies what future research is needed to narrow the range.

  ### Why This Works

  This procedure operationalizes the theory of imprecise probabilities, specifically the idea that uncertainty should sometimes be represented by a set of probability distributions rather than a single point estimate. In standard risk assessment, agencies often force a single number (a point estimate) onto messy data. This creates "false precision," where the mathematical certainty of the number masks the scientific uncertainty of the evidence. When studies conflict, averaging them assumes they are all measuring the same truth with random noise. Often, they are measuring different things due to bias or design flaws.

  By establishing a Plausibility Range (Steps 3 and 4), you acknowledge that the true risk lies somewhere within an interval, but the evidence does not support pinpointing where. This aligns with the concept of "credal sets" in decision theory. When the interval is wide, it signals "ignorance" rather than "risk." Risk implies you know the odds; ignorance implies you don't even know the odds.

  Step 5 applies a decision rule known as "robustness." Instead of asking "What is the most likely risk?" you ask, "Is the recommendation robust across the entire range of plausible probabilities?" If a restriction is only justified at the Upper Bound but not the Lower Bound, the decision is not robust. This prevents over-regulation based on outliers while preventing under-regulation based on ignoring worst-case scenarios. It shifts the burden from proving a specific number to defining the boundaries of reasonable belief. This protects the agency scientifically (by admitting limits) and politically (by showing the reasoning behind the bounds).

  ### Worked Cases

  **Case 1: The New Pesticide**
  *Procedure Application:*
  1.  **Define:** Outcome is cancer risk via dietary exposure.
  2.  **Map:** One large epi study (positive), two small epi studies (null), one rat study (liver damage/cancer at high dose).
  3.  **Bounds:** Lower Bound is set by the two small null studies, but cannot be zero because of the rat data. Upper Bound is set by the large epi study.
  4.  **Mechanism:** The rat study confirms biological plausibility. This raises the Lower Bound; we cannot assume zero risk for humans if rats show carcinogenicity at high doses. The manufacturer's claim of "chance" is weakened by the animal data.
  5.  **Decision:** The Lower Bound is now above zero. If the agency's threshold for carcinogens is "no significant increase," the Lower Bound might still be acceptable, but the Upper Bound is not. Given the severity (cancer) and the animal confirmation, the range supports a precautionary restriction while funding better epi studies.
  6.  **Document:** State that restriction is based on the convergence of animal data and one large human study, despite conflicting smaller human studies.

  **Case 2: The Food Additive**
  *Procedure Application:*
  1.  **Define:** Outcome is cardiovascular risk via ingestion.
  2.  **Map:** Huge observational study (positive), no mechanism, effect vanishes when controlling for diet.
  3.  **Bounds:** Lower Bound is zero (effect disappears with controls). Upper Bound is the unadjusted observational result.
  4.  **Mechanism:** No known mechanism reduces the Upper Bound. If there is no way the chemical causes the harm biologically, the positive association is likely confounding (people who eat this additive also eat poorly). The range collapses toward zero.
  5.  **Decision:** The Upper Bound, when adjusted for confounding and lack of mechanism, likely falls below the action threshold. A ban is not robust across the plausibility range. Recommendation: No restriction, but monitor new mechanistic research.
  6.  **Document:** Explicitly note that the observed risk is attributed to dietary confounding, not the additive itself.

  **Case 3: The Industrial Solvent (Insufficient Evidence)**
  *Procedure Application:*
  1.  **Define:** Outcome is neurological damage in workers.
  2.  **Map:** Three small case reports (anecdotal), one in vitro study (cell death at extreme doses), no exposure data.
  3.  **Bounds:** Lower Bound is zero (no systematic human data). Upper Bound is undefined because we do not know exposure levels. We cannot translate cell death to human risk without knowing if workers breathe enough solvent to reach that concentration.
  4.  **Mechanism:** In vitro toxicity exists, but relevance to humans is unknown.
  5.  **Decision:** The Plausibility Range is 0% to 100%. It spans everything from "perfectly safe" to "catastrophic." No decision rule can apply here. Any restriction would be arbitrary; any approval would be negligent.
  6.  **Document:** Issue a finding of "Insufficient Evidence." Require exposure monitoring and cohort studies before any regulatory action. This is politically uncomfortable but scientifically honest. Pretending otherwise would invite legal challenge when the bounds inevitably shift.

  ### What This Can't Do

  This procedure does not eliminate the need for value judgments. Deciding where to set the action threshold (Step 5) is a political and ethical choice, not a scientific one. Science can tell you the risk is between 1% and 10%, but it cannot tell you if 1% is acceptable. This procedure also cannot generate data. In Case 3, the output is essentially "go get better data," which stakeholders may find frustrating.

  Furthermore, this approach requires consensus on the bounds. Team members may disagree on how much to discount a flawed study when setting the Upper Bound. The procedure forces these disagreements into the open (Step 6), which can be internally contentious. Finally, it does not solve the problem of "paralysis by analysis." If every chemical requires a full bounds analysis, resources may dwindle. This tool is best reserved for high-stakes, high-conflict decisions where standard meta-analysis fails. It protects integrity, but it demands the courage to say "we don't know" when the bounds are too wide.
