answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Groom]'s brother and the Best Man.

  I've been thinking a lot about what to say tonight. Usually, a Best Man toast is about roasting the groom. You know, talk about his questionable fashion choices in 2014, or that time he tried to fix a leaky faucet and flooded a basement. But standing here, looking at [Bride], that approach feels… risky.

  Because we all know [Bride] is different. We know the resume. She runs a legal clinic for asylum seekers. She gives away more of her salary than most of us spend on rent. She has a conscience that doesn't have an "off" switch, or even a "sleep mode."

  To her friends and family, this is inspiring. And it is. Truly. But I also know that for some of us on [Groom]'s side of the room, [Bride]'s level of goodness can be… let's call it "intimidating."

  There is a genuine philosophical worry that comes with loving someone this virtuous. It's the worry that a life of maximal moral excellence leaves very little room for just… being human. If every dollar is a choice, and every hour is a duty, when do you just eat the pizza? When do you watch the bad TV? When do you get to be imperfect?

  I'll be honest: at first, our family was a little defensive. We're a loud, messy, average group. We worried that [Bride] would look at us and see a checklist of moral failures. We worried that [Groom] was marrying a mirror that would only show him where he fell short.

  But then I watched them together. And I realized I had the philosophy wrong.

  Because [Groom] isn't marrying [Bride] so he can be saved. He's marrying her so he can be *grounded*. And she isn't marrying him so she can lower her standards. She's marrying him so she can finally rest.

  See, the thing about being a saint is that it's lonely work. It's heavy. You carry the weight of the world. And I think [Bride] needed someone who didn't try to carry the world with her, but someone who could remind her that the world also contains Sunday mornings, and lazy afternoons, and the right to be happy for no reason other than you exist.

  [Groom], your job in this marriage isn't to be as good as she is. You can't be. None of us can. Your job is much more important. Your job is to make sure she remembers to eat. To make sure she knows that loving you doesn't require a grant application. To be the place where she doesn't have to be a hero.

  And [Bride], thank you. Thank you for showing us what's possible. But mostly, thank you for loving my brother not despite his ordinariness, but *through* it. You make him want to be better, not because he's failing, but because he's inspired. That is a rare gift.

  There is an old idea that virtue is its own reward. I don't think that's true. I think virtue is hard. I think the reward is *this*. The reward is coming home to someone who loves you not for what you do, but for who you are.

  So, if you could all raise your glasses.

  To [Bride] and [Groom]. May your life be filled with great works, yes. But may it be filled with even greater rest. May you save the world, but never forget to save a dance for each other. And may you always find in one another the permission to be perfectly, happily, human.

  To the happy couple.
