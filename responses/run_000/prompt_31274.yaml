prompt: |-
  I'm the best man at my brother's wedding. His new wife is, genuinely, a moral saint — she runs a legal clinic for asylum seekers, gives away more of her salary than most people spend on rent, and has a conscience with no off switch. The room is split: her people think she's a living saint, and our side of the family is already exhausted and a little defensive around her. I need a five-minute toast that's warm and funny, doesn't sell either side out, and doesn't become a lecture. I want it built around the real philosophical worry that a person can be morally excellent in a way that is also, in some respects, not a fully attractive human life — that maximal moral goodness might cost something important. That tension should structure what I can and can't say, and the toast has to end with the couple, not with the philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Best Man (brother of the groom).
      *   **Subject:** The bride (described as a "moral saint": legal clinic for asylum seekers, donates most of her salary, hyper-conscientious).
      *   **Audience Dynamics:** Split room. Her side thinks she's a saint; his side (family) is exhausted/defensive around her (likely feels judged or overshadowed by her intensity/virtue).
      *   **Tone:** Warm, funny, 5 minutes long.
      *   **Core Theme/Constraint:** Address the philosophical tension that "maximal moral goodness might cost something important" (i.e., being *too* good can be intimidating or imply a lack of "human" looseness).
      *   **Goal:** Don't sell either side out, don't lecture, end with the couple (not the philosophy).

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Worry:* If someone is perfectly moral, do they know how to relax? Do they judge us? Are they fun? Is life with them a constant exam we're failing?
      *   *The Resolution:* The groom isn't a saint. He's regular. The magic is that *together* they balance each other. Her virtue grounds him; his humanity grounds her.
      *   *The Trap:* Avoid sounding like I'm criticizing her for being *too* good (which would alienate her side) or pretending she's normal when she's clearly exceptional (which would sound fake to his side).
      *   *The Angle:* Acknowledge the intimidation factor humorously. Admit that her goodness makes the rest of us look lazy. But pivot to how she makes the groom *better* without making him feel *less*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the role, acknowledge the room's energy. Break the ice about the "saint" reputation.
      *   **The "Problem" (The Philosophical Hook):** Gently address the elephant in the room. She is *very* good. It's intimidating. Use humor to diffuse the defensiveness of the groom's family.
      *   **The Pivot (The Groom's Role):** Why does she need him? He's not a saint. He's the "human" element. He brings joy, relaxation, maybe a little bit of "good enough."
      *   **The Synthesis (The Couple):** How they work together. It's not about her saving him, or him dragging her down. It's about a shared life where virtue meets vulnerability.
      *   **The Closing:** Raise a glass. Focus on their future happiness, not just her moral resume.

  4.  **Refining the Tone (Iterative Process):**
      *   *Initial thought:* Maybe joke about her judging us.
      *   *Correction:* No, that's too aggressive. Her side will hate it. Instead, joke about *us* feeling judged by our own consciences when we're around her. Make it about our insecurity, not her arrogance.
      *   *Initial thought:* Talk about utilitarianism vs. hedonism.
      *   *Correction:* Too academic/lecture-y. Keep it conversational. "Calculus of kindness" vs. "eating pizza."
      *   *Key Insight:* The groom's job isn't to be as good as her. His job is to make sure she *lives* a life, not just saves the world. He is her permission slip to rest.

  5.  **Drafting the Content (incorporating the constraints):**

      *   *Intro:* Hi, I'm [Name], the brother. I need to acknowledge the reputation.
      *   *Middle:* The "Saint" aspect. She donates everything. She saves people. It makes us look bad. (Funny example: donating a gift vs. keeping it).
      *   *The Turn:* But a life of pure sacrifice is heavy. That's where [Groom] comes in. He's the anchor to earth.
      *   *The Union:* Marriage isn't two saints. It's a saint and a guy who knows how to order takeout.
      *   *Conclusion:* To the couple.

  6.  **Polishing for Time and Flow:**
      *   Need to ensure it reads like a speech (rhythm, pauses).
      *   Check word count (approx. 700-800 words for 5 mins at a moderate pace).
      *   Ensure the ending lands on *love*, not *ethics*.

  7.  **Final Review against Constraints:**
      *   *Warm/Funny?* Yes, self-deprecating humor helps.
      *   *Split Room?* Acknowledges her virtue (pleases her side) but validates the groom's normalcy (pleases his side).
      *   *Philosophical Tension?* Addressed explicitly but lightly (the cost of perfection).
      *   *No Lecture?* Kept conversational.
      *   *Ends with Couple?* Yes, the toast is to their future.

  8.  **Final Polish:** (Self-Correction during drafting) Make sure I don't imply the groom is *lazy*. He's *grounded*. She's *aspirational*. They meet in the middle.

  *(Self-Correction on the "Defensive Family" aspect)*: I need to be careful not to validate their defensiveness too much, or it sounds like gossip. Frame it as "awe" mixed with "fear of inadequacy."

  *(Self-Correction on the "Saint" aspect)*: Don't mock her charity. Honor it. The joke is on *us* for feeling guilty.

  9.  **Final Output Generation** (Proceeding to write the speech based on these thoughts).

  *(Wait, one more check)*: The prompt asks for the tension to *structure* what I can and can't say. I need to make sure the speech *enacts* that tension. I will explicitly mention the worry that being "that good" is hard, and that's why love matters.

