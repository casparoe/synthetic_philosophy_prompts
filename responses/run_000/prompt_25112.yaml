          *   *Severity:* High. This is the "Higher-Order Vagueness" problem for Epistemicism. If there's no sharp boundary between clear and borderline, then the set of "clear cases" is not sharp. But if logic is classical (1), the set of clear cases *must* have a sharp boundary (assuming 'clear' is definable).
