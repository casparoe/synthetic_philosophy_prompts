      *Refining the (4) analysis:* (4) says "meaning fails to settle." Epistemicists (Williamson) argue meaning *does* settle it, we just can't know it. So (4) is actually a denial of Epistemicism. This is a direct contradiction with (1) and (2) *if* we assume truth is semantic. If truth is non-semantic, maybe? But (6) ties meaning to use.
      *Refining the (5) analysis:* (5) is the definition of Higher-Order Vagueness that most non-epistemicists hold. Epistemicists redefine HOV as sharp boundaries between orders. So (2) and (5) are incompatible as stated.

