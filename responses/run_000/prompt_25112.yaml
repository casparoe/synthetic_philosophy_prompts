          3.  (2) vs. (6): The supervenience argument (how use yields sharpness).
          4.  (3) is a burden of proof, not a contradiction.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the position. It looks like "Epistemicism with a conscience" (wanting to keep classical logic/sharp boundaries but also keep the intuitive features of vagueness like HOV and semantic indeterminacy). This is known to be an unstable position (often called "The Incoherent Epistemicist").
