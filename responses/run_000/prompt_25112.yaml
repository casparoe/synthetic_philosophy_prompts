          *   *Severity:* High. This strikes at the heart of the semantic status of borderline cases. Epistemicists usually deny (4) as stated. They say borderline cases are just unknown knowns. (4) sounds more like Semantic Indeterminacy (Supervaluationism) or Non-Classical logic.
