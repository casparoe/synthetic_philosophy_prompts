  3.  **Identify Potential Tensions (Brainstorming):**

      *   *(a) vs. (e):* (a) says *no amount* of well-being justifies *even a small amount* of suffering. (e) says creating a life with *some* suffering is okay if it's happy.
          *   *Conflict:* If I create a life (e), I am allowing suffering to exist (because the life contains some). (a) says preventing suffering comes first and no happiness justifies it.
