      *   *Self-Correction on "Single Change":* Is it (a) or (e)? Changing (a) fixes (e), (c), and helps (d). Changing (e) to Antinatalism fixes (a) but leaves (c)/(d) tension. Changing (a) is higher leverage. Specifically, removing the word "lexical" and the absolute prohibition on trade-offs.

