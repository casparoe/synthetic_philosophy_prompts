  *   **Structure:** These directions exist in a high-dimensional vector space where they can be added, subtracted, and combined (e.g., steering). This satisfies the Structural Isomorphism condition.
  *   **Decoupling:** These states exist in the hidden layers, decoupled from the immediate input tokens and the final output logits. They mediate the processing, allowing for surrogative reasoning (e.g., the model "considering" whether to be truthful before generating).

