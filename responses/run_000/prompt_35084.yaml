  The Cultural Convention Principle defines membership by inclusion in the standardized Latin alphabet set regardless of visual form. This handles the Cyrillic, Greek, and capital 'A' verdicts but forces you to abandon the Fraktur case, which is conventionally Latin despite perceptual resistance.

  The Oriented Prototype Principle claims recognition requires matching a stored mental template within a specific upright orientation range. This handles the rotated 'a' and standard cases cleanly but forces you to abandon the Fraktur and minimalist logo verdicts, which deviate too far from the prototype.

  The Neuroplastic Mapping Principle extends the Functional Context view, predicting your experimental typeface counts as an 'a' once instruction wires the shape to the phoneme, overriding initial perceptual resistance. This handles the experimental case cleanly but forces you to abandon the Cyrillic verdict, as cultural boundaries limit plasticity despite successful mapping.
