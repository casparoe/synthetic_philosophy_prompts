prompt: |-
  For a question in Bayesian epistemology, I would like your credence, with the reasoning decomposed. The proposition is this: the problem of old evidence—the fact that evidence already known before a theory is formulated can nonetheless confirm that theory—is a genuine and still-unresolved difficulty for subjective Bayesian confirmation theory, where that theory holds that rational degrees of belief obey the probability calculus, that confirmation is increase in conditional probability, that learning proceeds by conditionalization, and that a proposition known with certainty receives probability one. Please give me a single number between 0 and 1, and then show the derivation. At minimum, assign a rough probability to each of the following and state how you combined them: (1) that old evidence sometimes provides real, rational confirmation of a newly proposed theory, rather than a merely psychological or historical illusion; (2) that the standard framework cannot represent this without modification, since for known evidence e and proposed theory h, P(e) = 1 and hence P(h | e) = P(h); (3) that the principal repairs—counterfactual priors, treating the newly recognized entailment of e by h as itself a learned proposition, and distinguishing acceptance from probability one—are either ad hoc, underdetermined, or give up a commitment essential to subjective Bayesianism. Include any further terms you regard as load-bearing. Then tell me which term your final number is most sensitive to, which term you are least confident about, and what evidence or argument would move that term most. For context, my own credence is roughly 0.6 and a colleague's is roughly 0.15; say which of the terms most likely separates those two positions. Please answer in American English.
