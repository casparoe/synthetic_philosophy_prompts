      *   *Wait, is (5) really in tension with (1)?* A rule utilitarian can say "The right action is saving the wife. The reason is 'she's my wife' (the rule). The justification for the rule is utility." So (5) can be consistent with (1) *if* "moral answer" means "correct action-guiding reason" rather than "foundational justification." I need to clarify this distinction.
