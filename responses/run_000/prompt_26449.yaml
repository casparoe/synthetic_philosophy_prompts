answer: |-
  Subject: Planning your talk on sortition for the neighbourhood association

  Hi there,

  It is completely understandable that your neighbours are reacting with skepticism, and honestly, their instinct to protect the integrity of decision-making is a good sign, so your goal is to validate that instinct while gently shifting the framework they are using to evaluate it. The single most important dependency you need to establish before anything else makes sense is the distinction between choosing leaders and constructing a representative sample. If people walk in thinking sortition is a method for picking the best person to lead, it will always sound like insanity, because random selection is a terrible way to find the most qualified candidate. You need to spend the first five minutes establishing that this is not about finding the best leader but about creating a mirror of the community, much like a scientific poll uses a random sample to represent the whole population. Until they accept that the goal is descriptive representation rather than meritocratic selection, every other point will sound like you are suggesting governance by bingo.

  Once that foundation is laid, you should anchor the entire explanation on the jury system rather than Ancient Athens or even your own citizens' assembly. I know your personal experience feels like the strongest evidence, and you should certainly mention it, but the jury system is the example that should carry the conceptual weight because it is the only form of sortition people already respect and understand as legitimate. Athens is too easy to dismiss as archaic or irrelevant to modern complexity, and your specific land-use assembly might sound like a special case or a one-off experiment to skeptics. Everyone knows jury duty involves random people making high-stakes decisions after listening to evidence and deliberating, and nobody claims jurors are unqualified simply because they were not elected. By using the jury as your primary example, you neutralize the insult to intelligence argument immediately because society already agrees that random citizens are capable of weighing evidence and reaching a verdict. You can then pivot to say that a citizens' assembly is essentially a jury for public policy, which bridges the gap between what they accept and what you are explaining.

  Regarding misconceptions, you need to anticipate two distinct waves of resistance. The first misconception they will walk in with is that random selection means selecting incompetent people, which you head off during that initial jury analogy by emphasizing the support structure, such as access to experts and facilitated deliberation, just like a courtroom has judges and lawyers. The second misconception is more dangerous and will form halfway through when they start to see the logic; they will assume you are proposing this as a replacement for elections or the city council. You need to head this off explicitly before you move into the mechanics of how a mini-public works. Make it clear that sortition is usually proposed for specific, thorny questions where elected officials have a conflict of interest or are gridlocked, not as a wholesale replacement for representative democracy. If you do not draw that boundary early, the conversation will derail into debates about abolishing elections, which is not what you are there to discuss.

  This brings us to the scope limitation you should state openly at the beginning or end to keep yourself safe. You should explicitly say that you are not there to discuss constitutional overhauls or replacing the neighbourhood association's elected board, but rather to explain the mechanism of a mini-public for specific decisions. This prevents you from getting dragged into the weeds of political theory or defensive posturing about their current roles. It keeps the conversation focused on the tool itself rather than the power dynamics of adopting it.

  Finally, for your closing question, you want something that tests whether they understand the function of the tool rather than just whether they feel less hostile. Do not ask if they like the idea, because that invites a yes-or-no preference. Instead, ask them to identify what kind of problem is best suited for this approach. You might ask something like, given what we discussed about where elections struggle versus where random deliberation shines, what type of neighbourhood issue do you think would be a good fit for this process and what type would be a bad fit. If they can identify that complex, value-laden issues with no clear technical answer are good fits while routine administrative decisions are bad fits, you will know they actually grasp the concept rather than just nodding along to be polite. This approach respects their intelligence, validates their concerns, and leaves them with a clear framework to evaluate the idea on their own terms.

  Best of luck with the meeting
