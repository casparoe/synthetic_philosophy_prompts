      *   *Case 3, 4, 6 (Fiduciary/Altruistic/Policy):* These involve *agency on behalf of others* or *explicit altruism*. The obligation is higher because you are acting as an agent for resources that aren't purely yours (department funds, donor money, tax dollars).
      *   *Proposed Principle:* **The Principle of Fiduciary/Altruistic Obligation + Tractability.** When acting in a professional, fiduciary, or explicitly altruistic capacity, you are obligated to maximize expected value within the limits of tractability. In personal spheres, you are permitted to satisfy local preferences unless the stakes are astronomically high and tractable.

