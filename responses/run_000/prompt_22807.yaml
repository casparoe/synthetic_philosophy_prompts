prompt: |-
  I'm teaching a small section on experimental philosophy this term and two of my grad students got stuck in a debate at our study session that I honestly cant referee. They both accept the basic asymmetry — that people are much more likely to say an agent intentionally brought about a harmful side effect of a decision than a beneficial one, in cases where the agent foresaw the side effect, thought of it as a mere byproduct, and went ahead with the decision anyway — so that part isn't in dispute. Their fight is over what the asymmetry shows.

  Mara argues it shows that our concept of intentional action itself is morally contaminated. Her reasoning is that in the harm case and the help case the agent's mental states are roughly the same — same foreknowledge, same indifference — and the only thing that changes is the valence of the outcome, so the only thing that could drive the asymmetry is that moral evaluation is literally built into the concept. Intentional, on this view, is doing normative work rather than descriptive work. Dev pushes back and says this is the old contamination story and that its not needed: people are running a causal-inference process, and when we learn that an agent brought about a bad outcome, we infer she must have endorsed it or believed in it in a way we don't infer for a good outcome. So the difference, he says, is in the folk's inference, not in the concept — the two cases differ in the evidence, not in the criterion.

  Mara's reply is that the inference story just collapses back into the contamination story, because the very fact that bad outcomes count as evidence of the relevant mental states is itself a moral premise — we expect bad things to be done by people who intended them and good things to be done by people who didn't — and that expectation is normative, so normativity is still doing the work, just one layer down. Dev says that proves too much, because almost every folk-psychological inference is normatively flavored (we expect liars to lie, for instance) and nobody says that makes our concept of belief normative.

  Can you adjudicate this for me? I'd like a point-by-point verdict on who's right about which specific claim, and what, if anything, both of them are missing — in particular whether the inference account really is a separate hypothesis from the contamination account or just a relabeling of it, and whether there's a diagnosis of the asymmetry that neither of them has even considered.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Teaching experimental philosophy (X-Phi).
      *   **Topic:** The Knobe Effect (Side-Effect Effect).
      *   **Dispute:** Two grad students (Mara vs. Dev) agree on the *existence* of the asymmetry but disagree on the *explanation*.
      *   **Mara's Position:** "Contamination Thesis." The concept of *intentional action* is inherently normative/moral. Moral evaluation is built into the semantic criteria.
      *   **Dev's Position:** "Inference Thesis" (Causal/Epistemic). The concept is descriptive, but moral valence affects how we *infer* mental states (evidence weighting).
      *   **Mara's Counter:** The inference rules themselves are normative, so it collapses back into contamination.
      *   **Dev's Counter:** That proves too much (all folk psychology is normative-flavored), so it doesn't make the *concept* normative.
      *   **Task:** Adjudicate point-by-point, determine who is right on specific claims, assess if the inference account is distinct or just relabeling, and identify missing diagnoses.

  2.  **Deconstruct the Philosophical Landscape (The Knobe Effect):**
      *   *The Phenomenon:* Joshua Knobe (2003). CEO harms/helps environment. Same mental state ("I don't care, just want profit"). People say "intentionally" for harm, "not intentionally" for help.
      *   *Explanation 1: The Deep View (Mara).* Moral judgments penetrate the concept itself. (Knobe's later view, Nichols & Ulatowski, etc.).
      *   *Explanation 2: The Shallow/Epistemic View (Dev).* Moral judgments bias the attribution of mental states (belief/desire) *prior* to applying the concept of intentionality. (Nadelhoffer, Machery, etc.).
      *   *Explanation 3: The Pragmatic View.* It's about conversational implicature or blame/praise assignment, not semantic content. (Adams, Steadman).
      *   *Explanation 4: The Capacity View.* Intentionality is linked to skill/control, and moral valence shifts how we view control.

  3.  **Evaluate Mara's Claims:**
      *   *Claim:* Mental states are identical in the vignettes.
      *   *Verdict:* Technically false (empirically). X-Phi studies show people attribute *different* mental states (e.g., stronger belief or tacit approval in the harm case). But conceptually, the *vignette* stipulates they are the same. Mara is right about the *stipulated* case, wrong about what folk actually process.
      *   *Claim:* Concept is morally contaminated (normative semantics).
      *   *Verdict:* Plausible, but controversial. This is the "Deep View." It holds up if you control for mental state attribution and the effect persists.
      *   *Claim:* Inference rules are normative, so inference account collapses.
      *   *Verdict:* Strong point. If the *input* to the inference is morally biased, the output is morally biased. However, Dev has a counter regarding the *locus* of normativity.

  4.  **Evaluate Dev's Claims:**
      *   *Claim:* It's a causal-inference process (evidence weighting).
      *   *Verdict:* Plausible. This is the "Bias View." People infer the CEO *really* wanted to harm but *didn't really* want to help.
      *   *Claim:* Concept is descriptive; normativity is in the application/evidence.
      *   *Verdict:* Coherent distinction. One can separate semantic criteria from epistemic access.
      *   *Claim:* Mara proves too much (all folk psychology is normative).
      *   *Verdict:* This is his strongest point. If "normative contamination" means "influenced by expectations," then *all* concepts are normative. We need a stronger definition of "contamination" to make Mara's thesis interesting.

  5.  **Address the Core Dispute: Distinct Hypotheses or Relabeling?**
      *   Are they distinct? Yes, logically.
      *   *Contamination:* Moral valence is a *condition* for the concept (like a necessary feature).
      *   *Inference:* Moral valence affects the *probability assignment* of the conditions (belief/desire).
      *   *However:* Empirically, they are hard to disentangle. If bad outcomes make us infer "desire," is it because we think bad outcomes *require* desire (normative rule) or because we statistically associate them?
      *   *Verdict:* They are distinct theoretical commitments, but Mara is right that they often converge empirically. Dev is right that they are theoretically distinct (semantics vs. epistemology).

  6.  **Identify Missing Diagnoses:**
      *   *Pragmatics:* Maybe "intentionally" isn't describing the mind but assigning blame. (Speech Act Theory).
      *   *Dual-Process:* System 1 (moral) overrides System 2 (analysis).
      *   *The "Skill" Account:* Intentionality implies control. We think people have more control over bad things they allow than good things.
      *   *The "Conceptual Change" Account:* The concept *is* flexible, not contaminated. It's a prototype concept, not classical.

  7.  **Drafting the Adjudication (Iterative Process):**
      *   *Introduction:* Acknowledge the sophistication of the debate. It's the central debate in X-Phi since 2003.
      *   *Point-by-Point:*
          *   Mental State Identity: Mara is right on stipulation, Dev is right on psychology.
          *   Contamination vs. Inference: Dev is right on theoretical distinction. Mara is right on practical convergence.
          *   "Proves Too Much": Dev wins here. Mara needs a stricter definition of normativity.
      *   *The "Collapse" Objection:* Mara argues inference rules are normative. Dev says so what? *Resolution:* The locus matters. Is normativity in the *truth conditions* (Mara) or the *heuristics* (Dev)?
      *   *Missing Perspectives:* Pragmatics (Blame), Prototype Theory, Cognitive Science (Dual Process).

  8.  **Refining the Verdict:**
      *   Don't just say "both are partially right." Give a sharp philosophical cutting.
      *   Mara captures the *phenomenological* reality (it feels moral).
      *   Dev captures the *architectural* possibility (you can model this without changing semantics).
      *   The "Collapse" argument is the crux. Mara thinks epistemic norms *are* semantic norms. Dev thinks they are separate. Standard philosophy of mind separates semantics from epistemology. Dev is technically more orthodox, but Mara is more radical (which might be right given the data).
      *   *Crucial Missing Piece:* The **Pragmatic Account**. Neither considers that "intentionally" might not be a description of mental states at all, but a tool for blame. This sidesteps the contamination/inference dichotomy.

  9.  **Final Polish:** Ensure tone is appropriate for a professor speaking to grad students (rigorous, nuanced, encouraging). Structure clearly with headings. (Self-Correction: Make sure to explicitly answer the "relabeling" question).

  10. **Final Check against constraints:**
      *   Point-by-point verdict? Yes.
      *   What are they missing? Yes.
      *   Inference vs. Contamination distinctness? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a classic instantiation of the debate surrounding the **Knobe Effect** (or the Side-Effect Effect), which has driven experimental philosophy for two decades. Your students have effectively reconstructed the dialectic between the **"Deep View"** (Mara) and the **"Shallow/Bias View"** (Dev).

  Here is an adjudication of their debate, broken down by claim, followed by an assessment of the theoretical distinctness of their positions and the alternative diagnoses they are overlooking.

  ### Part 1: Point-by-Point Verdict

  **1. Mara's Claim: "The agent's mental states are roughly the same... the only thing that changes is the valence."**
  *   **Verdict:** **Mara is right about the vignette; Dev is right about the psychology.**
  *   **Analysis:** In the *stipulated* text of the CEO cases, the mental states are identical (indifference/foreknowledge). However, empirical follow-up studies (e.g., by Nadelhoffer, Machery) show that participants *do not actually treat* the mental states as identical. When asked, people attribute a stronger "tacit approval" or higher degree of belief to the harming CEO than the helping CEO.
  *   **Ruling:** Mara is correct that the *case design* holds mental states constant. Dev is correct that the *folk processing* does not. This is the fulcrum of Dev's inference argument.

  **2. Mara's Claim: "Moral evaluation is literally built into the concept [Contamination Thesis]."**
  *   **Verdict:** **Plausible, but unproven by the asymmetry alone.**
  *   **Analysis:** This is the "Deep View." It argues that moral badness is a *constitutive condition* of applying the concept *intentional*. However, demonstrating that moral valence *correlates* with the application of the concept does not prove it is a *criterion*. It could be a biasing factor (Dev's view) rather than a semantic rule.
  *   **Ruling:** Mara is making a strong semantic claim that requires more evidence than the asymmetry itself provides. She needs to show that the effect persists even when mental state attribution is explicitly controlled and fixed (which some studies suggest it does, but others dispute).

  **3. Dev's Claim: "People are running a causal-inference process... the difference is in the evidence, not the criterion."**
  *   **Verdict:** **Theoretically sound and methodologically safer.**
  *   **Analysis:** This is the "Bias View." It preserves the traditional philosophical architecture (Intentionality = Belief + Desire + Control) and locates the weirdness in our epistemic access to those states. We assume bad actors are more likely to have bad desires.
  *   **Ruling:** Dev is right that this is a coherent hypothesis that explains the data without requiring a revolution in semantic theory. It treats the asymmetry as a performance error or heuristic bias rather than a competence feature.

  **4. Mara's Counter: "The inference story collapses back into contamination... the expectation is normative."**
  *   **Verdict:** **Mara identifies a real problem, but "collapses" is too strong.**
  *   **Analysis:** Mara argues that if our *rules of inference* are normative, then normativity is doing the work. She is right that epistemic norms (what counts as good evidence) can be value-laden. However, Dev is right to distinguish between *semantic content* (what the word means) and *epistemic application* (how we decide to use the word).
  *   **Ruling:** Mara is right that normativity is present in both models, but wrong that the *location* of the normativity doesn't matter. Whether the normativity is in the definition (Mara) or the evidence-weighting (Dev) has different implications for how we revise our theories.

  **5. Dev's Counter: "That proves too much... almost every folk-psychological inference is normatively flavored."**
  *   **Verdict:** **Dev wins this point.**
  *   **Analysis:** This is the strongest argument against Mara. If "normative contamination" simply means "influenced by background expectations," then *all* concepts are contaminated (e.g., we infer "bank robber" differently than "bank teller" based on normative expectations of behavior). For Mara's thesis to be interesting, "contamination" must mean something stronger: that moral status is a *truth condition* for the concept, not just a heuristic for applying it.
  *   **Ruling:** Dev successfully shows that Mara's definition of contamination is too broad to be useful.

  ---

  ### Part 2: Is the Inference Account Just Relabeling?

  **Verdict: No, they are distinct hypotheses, but they are empirically entangled.**

  They are not merely relabeling the same thing. They make different predictions about cognitive architecture:

  1.  **Mara (Contamination):** Predicts that even if you *force* participants to acknowledge the mental states are identical (e.g., "The CEO definitely did not care about the environment, good or bad"), they will *still* say the harm was intentional. The moral valence bypasses the mental state check.
  2.  **Dev (Inference):** Predicts that if you *force* participants to acknowledge the mental states are identical, the asymmetry should disappear (or significantly diminish). The asymmetry exists *because* people assume the mental states differ.

  **The Adjudication:**
  The empirical literature is mixed, but recent meta-analyses suggest **Dev is partially right, but Mara is not wholly wrong.**
  *   When mental states are explicitly controlled, the effect size of the Knobe Effect shrinks, supporting Dev.
  *   However, the effect does not always vanish completely, supporting Mara.
  *   **Conclusion:** It is likely a **hybrid**. Moral valence biases the inference of mental states (Dev), *and* moral valence can sometimes serve as a direct input into the judgment of intentionality when mental states are ambiguous (Mara).

  ---

  ### Part 3: What Both Are Missing

  Both students are operating within a **Semantic/Descriptive Framework**. They assume the debate is about what the word "intentional" *means* or how we *verify* its meaning. They are missing three viable alternative diagnoses that sidestep their dichotomy.

  #### 1. The Pragmatic Account (The "Blame" Hypothesis)
  *   **Proponents:** Adams, Steadman, later Knobe.
  *   **The Idea:** The word "intentionally" is not being used to describe the agent's mind at all. It is a speech act used to assign **blame or praise**.
  *   **Why it matters:** When people say the CEO harmed the environment "intentionally," they aren't making a metaphysical claim about his neural states; they are saying, "He is to blame for this." In the help case, we don't need to mark him as praiseworthy in the same way (or the bar for praise is higher), so we don't use the marker.
  *   **Verdict:** This dissolves the Mara/Dev debate. The concept isn't contaminated (Mara), and it isn't a biased inference (Dev); it's a **pragmatic tool**. The asymmetry is about social regulation, not mind-reading.

  #### 2. The Prototype/Cluster Concept Account
  *   **Proponents:** Machery, Ludwig.
  *   **The Idea:** "Intentional action" is not a classical concept with necessary and sufficient conditions (which both Mara and Dev assume). It is a **prototype concept**.
  *   **Why it matters:** Features like "foreknowledge," "desire," and "moral badness" are all weighted features. In the harm case, the "moral badness" feature lights up, pushing the overall "match" to the prototype over the threshold. In the help case, it doesn't.
  *   **Verdict:** This rejects Mara's idea that morality is a *condition* (contamination) and Dev's idea that morality is just *evidence* for other conditions. Instead, morality is just **one feature among many** in a cluster.

  #### 3. The Capacity/Control Account
  *   **Proponents:** Alicke, Cushman.
  *   **The Idea:** The asymmetry stems from judgments of **control**, not just mental states.
  *   **Why it matters:** Folk psychology operates on a "Praise-Blame" asymmetry regarding control. We intuitively feel agents have more control over bad side effects they allow than good side effects they allow. If intentionality requires control, and we perceive more control in the harm case, we attribute more intentionality.
  *   **Verdict:** This locates the normativity in the metaphysics of **agency**, not the semantics of "intentional."

  ### Summary for Your Students

  Tell Mara and Dev they have reconstructed the central debate of 2003–2010 X-Phi accurately.

  *   **Tell Dev:** He wins on theoretical orthodoxy. You can model the data without breaking the concept of intentionality. His "proves too much" objection is the strongest philosophical move in the room.
  *   **Tell Mara:** She wins on phenomenological honesty. The folk *experience* the judgment as moral, not neutral. Her insistence that epistemic norms are still norms is a deep insight, even if it doesn't prove semantic contamination.
  *   **Tell Both:** They are fighting over whether the "moral software" is in the **operating system** (Mara: Semantics) or the **input drivers** (Dev: Inference). They should consider that the software might be a **communication app** (Pragmatics) designed for blame assignment, which makes the question of "true meaning" a category error.

  **Recommended Reading to Unstick Them:**
  1.  **For Mara:** Joshua Knobe, "Intentional Action and Side Effects in Ordinary Language" (2003) & "Person as Scientist, Person as Moralist" (2010).
  2.  **For Dev:** Frederick Adams & Annie Steadman, "Intentional Action in Ordinary Language" (2004) (The Pragmatic Critique).
  3.  **For Both:** Edouard Machery, "Folk Concepts and Natural Kind Terms" (on prototype theory).
