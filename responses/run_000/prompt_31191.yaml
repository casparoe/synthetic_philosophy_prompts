answer: |-
  **Memorandum**
  **To:** Hospital Ethics Committee
  **From:** [Your Name], PhD, HEC-C
  **Subject:** Proposed Decision Procedure for Conflicts Between Current Wishes and Advance Directives

  ### Introduction: The Ethical Landscape

  Colleagues, the tension you are addressing is one of the deepest fault lines in bioethics. It pits **Precedent Autonomy** (the authority of the past self to bind the future) against **Current Autonomy** (the authority of the present self to determine their own fate).

  Philosophically, Ronald Dworkin argued that we have "critical interests" in how our life narrative ends, which should survive incompetence. Conversely, Rebecca Dresser and others argue that the "past self" is a stranger to the "present self," especially in dementia, and that binding a suffering present self to the values of a healthy past self is a form of tyranny.

  In clinical practice, however, we cannot debate metaphysics at the bedside. We need a heuristic. The following procedure is designed to operationalize these concepts. It prioritizes current capacity but provides a structured way to evaluate the weight of the Advance Directive (AD) when capacity is compromised or ambiguous.

  **Note on Limitations:** No algorithm can replace moral deliberation. I have flagged specific steps as **[JUDGMENT CALL]**. These are points where the procedure cannot calculate the answer; it can only structure the conversation. If the committee reaches these flags and consensus fails, the case must be escalated to a full committee review or legal counsel.

  ---

  ### The Protocol: "The Precedent-Current Conflict Resolver"

  **Goal:** To determine whether to honor the current expressed wish or the written Advance Directive.
  **Users:** Ethics Consultants, Attending Physicians, Surrogates.

  #### Step 1: Assess Decision-Making Capacity (DMC) Regarding the *Current* Decision
  *Question:* Does the patient currently possess the capacity to accept or refuse the specific treatment in question?
  *Operational Definition:* Can the patient (1) Communicate a choice, (2) Understand relevant info, (3) Appreciate the situation/consequences, and (4) Reason about options?
  *   **If YES (Capacity Intact):** **STOP.** Honor the **Current Wish**. A competent adult may revoke an AD at any time, orally or in writing. The AD is no longer valid.
  *   **If NO (Capacity Lacking):** Proceed to Step 2.
  *   **If BORDERLINE/FLUCTUATING:** Proceed to Step 2, but flag as **[JUDGMENT CALL: Capacity Threshold]**.

  > **Consultant Note:** Do not confuse the *outcome* of the decision with *capacity*. A patient can make an "unwise" decision and still have capacity. However, if the patient cites reasons that are demonstrably delusional (e.g., "The doctors are aliens"), capacity is impaired.

  #### Step 2: Verify Validity and Applicability of the Advance Directive
  *Question:* Is the AD legally valid and clinically applicable to this specific scenario?
  *Checklist:*
  1.  Was the AD executed when the patient had capacity?
  2.  Is the document accessible and signed/witnessed per state law?
  3.  Does the clinical scenario match the trigger conditions in the AD (e.g., "Terminal condition" vs. "Permanent unconsciousness")?
  *   **If NO (Invalid/Inapplicable):** **STOP.** Treat the patient based on Best Interest Standard (via surrogate). The AD is void.
  *   **If YES (Valid/Applicable):** Proceed to Step 3.

  #### Step 3: Assess Evidence of Authentic Values Change
  *Question:* Is there evidence that the patient's *fundamental values* have changed since the AD was written, independent of the pathology causing incapacity?
  *Inquiry:*
  1.  **Timing:** Did the change in preference occur before or after the onset of the incapacitating condition?
  2.  **Consistency:** Has the patient expressed this new preference consistently over time (weeks/months), or only in the acute crisis?
  3.  **Source:** Is the new preference rooted in a new philosophical/religious framework (e.g., religious conversion) or is it a reaction to fear/pain?
  *   **If Strong Evidence of Prior Values Change:** Proceed to Step 4. (The "Past Self" updated the instructions before losing capacity).
  *   **If Evidence Suggests Change is Symptom of Pathology:** (e.g., new religious belief emerged *after* frontal lobe dementia onset). Give heavy weight to the **AD**.
  *   **If Unclear:** Flag as **[JUDGMENT CALL: Authenticity of Values]**. Proceed to Step 4.

  #### Step 4: Evaluate the "Narrative Harm" vs. "Experiential Harm"
  *Question:* Which course of action causes the greater violation of the person's integrity?
  *Comparison:*
  1.  **Violating the AD:** Does treating the patient violate a deeply held "critical interest" (e.g., dignity, independence, avoiding vegetative state)? Will the patient suffer *because* they know they are being treated against their prior will (if they have moments of lucidity)?
  2.  **Violating Current Wish:** Does refusing treatment cause immediate suffering, fear, or distress to the *current* self? Does the current self have the psychological continuity to understand the violation?
  *   **If Current Self can experience the violation as a harm:** Lean toward **Current Wish**.
  *   **If Current Self lacks psychological continuity (e.g., advanced dementia) and AD reflects core identity:** Lean toward **AD**.
  *   **If Equivocal:** Flag as **[JUDGMENT CALL: Weighing Harms]**. Proceed to Step 5.

  #### Step 5: Surrogate and Family Input
  *Question:* What do those who know the patient best say about the *reasons* for the change?
  *Inquiry:* Ask surrogates not "What would they want?" but "Why do you think they are changing their mind?"
  *   **If Surrogates confirm authentic values shift:** Support **Current Wish**.
  *   **If Surrogates confirm this is "not them" (pathology):** Support **AD**.
  *   **If Surrogates are divided:** Escalate to Full Ethics Committee.

  #### Step 6: Final Recommendation
  *   **Default Rule:** In cases of irreducible uncertainty where the patient is not clearly incapacitated, err on the side of **Life and Liberty (Current Wish)**.
  *   **Exception:** If the treatment is medically futile or the burden to the patient (pain/suffering) vastly outweighs the benefit, the AD may be used to support withholding treatment even if current wishes are ambiguous.

  ---

  ### Limitations of the Procedure (The "Black Box")

  As the Committee Director, you must train consultants to recognize where this procedure is merely dressing up a value judgment:

  1.  **The Capacity Threshold (Step 1):** Capacity is not a binary switch. In "borderline" cases, the consultant's assessment of capacity *is* the decision. If you rule them incapacitated, the AD wins. If competent, the current wish wins. This is where bias enters.
  2.  **Authenticity (Step 3):** Determining if a new religious belief is a "true conversion" or "dementia-induced confabulation" is theological and psychiatric, not ethical. We cannot solve this; we can only document the uncertainty.
  3.  **Psychological Continuity (Step 4):** We cannot measure how much of the "old self" remains. This is a metaphysical guess.

  **Escalation Protocol:** If Step 3 or Step 4 results in a tie or high disagreement among consultants, the case must be handed to the Full Ethics Committee. Do not allow a single consultant to make the "Identity" call alone.

  ---

  ### Case Applications

  #### Case 1: The 68-Year-Old with Early Alzheimer's
  *   **Facts:** Early AD, refuses antibiotics. Now has pneumonia. Mildly confused, oriented. Wants treatment. Daughter cites religious shift.
  *   **Procedure Walkthrough:**
      *   **Step 1 (Capacity):** *Critical Juncture.* She is "mildly confused but oriented." Can she appreciate the consequence of refusing antibiotics (death)? If the consultant determines she **has capacity**, the procedure stops. **Recommendation: Treat.** (Current wish trumps AD).
      *   **Step 1 (If Capacity Borderline):** If the confusion impairs her *appreciation* of the risk, we move to Step 3.
      *   **Step 3 (Values Change):** The daughter reports a religious shift over the *last year*. If this shift began *before* significant cognitive decline, it counts as an authentic update to her values. If the shift coincided with the diagnosis, it is suspect.
      *   **Step 4 (Harm):** If she is treated, does she suffer? Antibiotics are low-burden. If she is not treated, she dies. The "Narrative Harm" of violating the AD (dying with dignity) conflicts with the "Experiential Harm" of dying from a treatable infection while confused.
  *   **Procedure Outcome:**
      *   **Clear Answer?** **NO.** This hinges entirely on the Step 1 Capacity Assessment.
      *   **Consultant Action:** A formal psychiatric capacity evaluation is required immediately.
      *   **Likely Recommendation:** If capacity is even marginally intact, **Treat**. The burden of antibiotics is low; the burden of overriding a current wish in a possibly competent patient is high. If she is deemed incapacitated, the religious shift (if verified as pre-dating incapacity) suggests the AD no longer reflects her values. **Treat.**
      *   **Where it Fails:** If the capacity eval is indeterminate, the procedure forces a **[JUDGMENT CALL]** on whether the religious belief is a symptom of the disease.

  #### Case 2: The 42-Year-Old with Spinal Cord Injury (SCI)
  *   **Facts:** AD refuses life support if quadriplegic. Now quadriplegic/vent. Cognitively intact. Wants to live. Acknowledges AD but changed mind.
  *   **Procedure Walkthrough:**
      *   **Step 1 (Capacity):** Patient is "fully cognitively intact." He understands the condition and the consequences.
      *   **Decision:** **STOP.**
      *   **Reasoning:** Under Step 1, a patient with intact capacity has the absolute right to revoke an Advance Directive. The philosophical debate about "precedent autonomy" dissolves when the "current self" is fully competent. The "Ulysses Contract" (binding the future self) is generally unenforceable when the future self is competent and objects.
  *   **Procedure Outcome:**
      *   **Clear Answer?** **YES.**
      *   **Recommendation:** **Continue Life-Sustaining Treatment.**
      *   **Why:** The procedure identifies this as a legal and ethical non-starter. The AD is effectively revoked by the competent oral statement. The ethics consult here is not to decide *what* to do, but to support the clinical team who may feel morally distressed by ignoring the written document.
      *   **Where it Fails:** It does not fail. This is the scenario the law is clearest on. The only "value" question is for the clinicians to process their own feelings about the patient "giving up" on the values of his past self, but that does not change the recommendation.

  ### Summary for the Committee

  This protocol prioritizes **Current Capacity** above all else. This aligns with legal standards and the ethical principle of non-paternalism.

  *   **Case 2** is a "Green Light": The procedure clears it immediately via Step 1.
  *   **Case 1** is a "Yellow Light": The procedure highlights the need for rigorous capacity testing and investigation into the *timing* of the values shift.

  **Final Advice:** Train your consultants that Step 1 is not a formality. It is the decision point. In Case 1, if they rule her incapacitated, they must be prepared to defend *why* her confusion negates her ability to choose antibiotics, given that many confused patients can still express a stable preference for life. If they cannot defend that, they must treat.

  Respectfully,

  **[Your Name]**
  *Professor of Bioethics & Clinical Ethics Consultant*
