  1.  **Analyze the Request:**
      *   **Role:** Professor of Bioethics with clinical ethics consultation experience.
      *   **Task:** Create a decision procedure (protocol) for hospital ethics consultants regarding conflicts between a patient's *current* wishes and their *advance directive* (AD).
      *   **Requirements:**
          *   Operational sequence (questions, order, sufficiency, stopping points).
          *   Grounded in philosophical literature (precedent autonomy, personal identity, authority of earlier self) but usable by non-philosophers.
          *   Honest about limitations (judgment calls, irreducible value questions).
          *   Apply the procedure to two specific cases.
          *   Identify where the procedure gives clear answers vs. where it fails.
      *   **Tone:** Professional, nuanced, practical, academically rigorous but accessible.

  2.  **Deconstruct the Ethical Problem:**
      *   **Core Conflict:** Precedent Autonomy (Past Self/AD) vs. Current Autonomy (Present Self/Wishes).
      *   **Key Philosophical Concepts:**
          *   *Dworkin's Critical vs. Experiential Interests:* Did the past self care about the *narrative* of their life (critical) or just avoiding suffering (experiential)?
          *   *Personal Identity:* Is the current patient the "same person" who wrote the AD? (Psychological continuity).
          *   *Ulysses Contracts:* Should we bind the future self to protect the past self's values?
          *   *Competence/Capacity:* Does the current patient have the capacity to revoke the AD?
      *   **Clinical Reality:** Most hospital policies default to treating the *current* competent patient, but dementia/psychosis complicates capacity assessments.

  3.  **Drafting the Decision Procedure (The Protocol):**
      *   *Goal:* A flowchart-like sequence.
      *   *Step 1: Capacity Assessment.* This is the gatekeeper. If the patient lacks capacity, the AD usually stands (unless invalid). If they have capacity, current wishes usually trump. *Nuance:* What about fluctuating capacity or specific impairment regarding the decision?
      *   *Step 2: Validity of the AD.* Was it informed? Coerced? Specific to this situation?
      *   *Step 3: Evidence of Change.* Is there clear evidence of a *values* shift, not just a whim? (The "Religious Conversion" problem).
      *   *Step 4: Harm/Benefit Analysis.* What is the burden of overriding the AD vs. the burden of overriding current wishes?
      *   *Step 5: The "Identity" Check.* Is the current self psychologically continuous with the past self? (Hard to operationalize, need to simplify).
      *   *Step 6: Irreducible Conflict.* When to escalate.

      *Refining the Steps for Usability:*
      *   Make it a checklist.
      *   Define "Sufficient Answer."
      *   Explicitly mark "Judgment Call" zones.

  4.  **Developing the Philosophical Grounding (for the intro):**
      *   Need to mention Dworkin (Integrity), Dresser (Critique of precedent autonomy), and the concept of "Then Self" vs. "Now Self."
      *   Keep it brief so the protocol remains the focus.

  5.  **Applying to Case 1 (Alzheimer's/Pneumonia):**
      *   *Facts:* Early stage, mildly confused but oriented (Capacity is the pivot). AD refuses antibiotics. Current wish: Treat. Daughter cites religious shift.
      *   *Analysis:* If she has capacity *now*, current wishes win. If capacity is impaired by confusion, we weigh the religious shift. Is the religious shift a new value or a symptom of pathology?
      *   *Protocol Application:* Step 1 (Capacity) is crucial. If she passes capacity assessment, AD is revoked. If she fails, we look at Step 3 (Values Shift).
      *   *Outcome:* Likely treat, but flag the capacity uncertainty.

  6.  **Applying to Case 2 (SCI/Quadriplegic):**
      *   *Facts:* 3 years ago AD refuses life support if quadriplegic. Now quadriplegic/vent. Cognitively intact. Wants to live. Acknowledges AD but changed mind.
      *   *Analysis:* This is the classic "Ulysses Contract" scenario. He has *clear* capacity. He explicitly revokes the AD.
      *   *Protocol Application:* Step 1 (Capacity) is a slam dunk. He is competent. Current autonomy trumps precedent autonomy almost universally in law and ethics when capacity is intact.
      *   *Outcome:* Treat. Clear answer.

  7.  **Critiquing the Procedure (Self-Correction/Refinement):**
      *   *Honesty Check:* The prompt asks me to be honest about where the procedure is just "judgment calls dressed up."
      *   *Weak Point:* Capacity assessment in Case 1 is tricky. "Mildly confused" is a red flag.
      *   *Weak Point:* Determining if a values change is "authentic" (Step 3) is deeply philosophical and hard to standardize.
      *   *Weak Point:* The "Harm" calculation (Step 4) is subjective.
      *   *Action:* I need to create a specific section in the protocol labeled "Limitations & Escalation Points."

  8.  **Finalizing the Structure:**
      *   **Introduction:** Contextualize the ethical tension (Precedent vs. Current Autonomy).
      *   **The Protocol:** Step-by-step operational guide.
      *   **Commentary on Limitations:** Where the math breaks down.
      *   **Case Application 1:** Walkthrough.
      *   **Case Application 2:** Walkthrough.
      *   **Conclusion:** Summary of the tool's utility.

  9.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Tone:* authoritative but humble.
      *   *Protocol:* Use bold headers, "If/Then" logic.
      *   *Philosophy:* Integrate Dworkin's "Critical Interests" without jargon overload.
      *   *Case 1:* Highlight the capacity ambiguity.
      *   *Case 2:* Highlight the clear revocation.

      *(Self-Correction during drafting Case 1)*: Wait, if she has early Alzheimer's and is "mildly confused," can she legally revoke an AD? In most jurisdictions, a competent patient can revoke an AD at any time, even orally. The key is *competence at the moment of revocation*. The protocol must prioritize assessing capacity to *revoke*.
      *(Self-Correction during drafting Case 2)*: This is legally straightforward. A competent adult can always refuse or accept treatment, regardless of prior documents. The ethics consultation here is mostly to support the clinical team who might feel bound by the paper. The protocol should reflect that the AD is effectively nullified by current competence.

