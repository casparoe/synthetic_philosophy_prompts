  *(Post-computation thought)*: Ensure I emphasize that *current competence* is the trump card in almost all US/Western bioethics frameworks. The hard cases are when competence is *borderline* or *fluctuating* (like Case 1). Case 2 is actually ethically "easy" despite the dramatic facts, because capacity is intact. I need to make sure I don't overcomplicate Case 2. The real test of the protocol is Case 1.

  Let's refine the "Judgment Call" flags.
