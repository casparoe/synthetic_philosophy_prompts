answer: |-
  Your suspicion is well-founded: while your cohort mate captures Hobbes's nominalist streak, her summary conflates his causal constructivism with twentieth-century conventionalism and oversimplifies the Wallis dispute as merely a failure of competence rather than a clash of mathematical paradigms.

  **Sentence 1:** *"Hobbes thought geometry was the only science we can be genuinely certain about, because we construct the figures ourselves, whereas nature is God's construction so we can only conjecture about it."*
  A Hobbes scholar would accept this as a fair summary of his epistemology in *De Corpore* and *Leviathan*. Hobbes distinguishes between sciences where we know the causes because we generate them (geometry, civil philosophy) and natural philosophy, where we must infer causes from effects. The reference to God is a acceptable shorthand for his view that natural causes are ultimately opaque to human reason, belonging to the Divine Artificer.

  **Sentence 2:** *"Since we make the definitions, geometric truth is basically conventional: the theorems are just consequences of definitions we've chosen, and if we'd chosen different definitions, different theorems would hold."*
  This is where your ear is correct to wince. While Hobbes is a nominalist who argues truth resides in speech rather than things, he is not a conventionalist in the twentieth-century sense. For Hobbes, definitions are not arbitrary stipulations; they must describe possible *generations* via motion. You cannot simply choose "different definitions" at whim; they must be conceivable constructions in space and time that do not involve contradictions. The summary misses Hobbes's crucial constraint that definitions must be causal accounts of how a figure is generated, not just verbal labels.

  **Sentence 3:** *"That's also why he hated Wallis's symbolic algebra — he thought mathematics should be about real constructions, not meaningless marks on paper."*
  Scholars would accept this characterization. Hobbes viewed symbolic algebra as a "scab of symbols" that obscured the geometric reasoning and the causal generation of quantities. He insisted on synthesis from first principles (*viam inventionis*) rather than algebraic manipulation (*viam judicii*). Calling them "meaningless marks" captures Hobbes's sentiment that symbols without geometric referents are empty noises, though he acknowledged they could be useful for calculation if grounded properly.

  **Sentence 4:** *"And his attempt to square the circle shows he was out of his depth mathematically and too stubborn to admit it, which is why Wallis won the debate."*
  A historian of mathematics would accept that Hobbes was wrong about squaring the circle and that Wallis prevailed, but the logic here is reductive. The claim that Wallis won *because* Hobbes was stubborn does not follow from the philosophical premises laid out in the previous sentences; it jumps from Hobbes's philosophy of math to his technical competence. Wallis won primarily because he represented the emerging analytic tradition that would dominate calculus, whereas Hobbes was defending a classical synthetic geometry that was becoming obsolete. The summary fails to note that the debate was not just about a single proof, but about whether mathematics should be grounded in geometry (Hobbes) or algebra (Wallis).
