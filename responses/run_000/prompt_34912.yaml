  I'm a PhD student in early modern philosophy, and I've been working through Hobbes's mathematics stuff with a couple people in my cohort. One of them sent around a study summary she'd written, and somethings off about it but I can't put my finger on it — I especially don't trust my ear yet on the Wallis material. Her summary reads like this: Hobbes thought geometry was the only science we can be genuinely certain about, because we construct the figures ourselves, whereas nature is God's construction so we can only conjecture about it. Since we make the definitions, geometric truth is basically conventional: the theorems are just consequences of definitions we've chosen, and if we'd chosen different definitions, different theorems would hold. That's also why he hated Wallis's symbolic algebra — he thought mathematics should be about real constructions, not meaningless marks on paper. And his attempt to square the circle shows he was out of his depth mathematically and too stubborn to admit it, which is why Wallis won the debate.

