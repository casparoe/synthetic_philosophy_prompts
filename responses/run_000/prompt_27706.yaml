answer: |-
  This is an exceptionally sharp diagnosis of a foundational problem in axiology. You have correctly identified that the viability of hedonism hinges on the ontology of "pleasure." If pleasure cannot be unified under a single description, "maximizing pleasure" becomes an incoherent instruction.

  Here is the carving you are looking for, the established terminology, and how to position this in your paper.

  ### 1. The Established Name
  The specific difficulty you are describing is widely known in the literature as **The Heterogeneity Problem** (or sometimes **The Argument from Heterogeneity**).

  It is occasionally referred to as the **Problem of Phenomenological Unity**. The core question is: *Is there a common phenomenological thread (a "feel") that unites all instances of pleasure, or is 'pleasure' merely a family resemblance concept?*

  Key historical touchstones for this problem include:
  *   **Henry Sidgwick:** He noted that if we seek a common quality in all pleasures, we find only that they are felt as "good."
  *   **C.D. Broad:** He famously argued that there is no specific "pleasure sensation" analogous to a "pain sensation."
  *   **Fred Feldman:** His work *Pleasure and the Good Life* is the modern standard for addressing this. He argues that the Heterogeneity Problem kills *sensory* hedonism but leaves room for *attitudinal* hedonism.

  ### 2. The Carving: One Problem or Several?
  While grouped under "Heterogeneity," your examples actually point to three distinct metaphysical worries. Disentangling them will strengthen your paper.

  **A. The Qualitative Heterogeneity Worry**
  *   *Your examples:* Warm bath vs. finishing a proof.
  *   *The Issue:* There is no single sensory quality (like "redness" or "middle C") shared by all pleasures. The sensation of a warm bath is tactile; the satisfaction of a proof is cognitive.
  *   *Implication:* This is fatal to **Felt-Quality Theories** (the view that pleasure is a specific type of sensation).

  **B. The Polarity Worry (Bipolar vs. Unipolar)**
  *   *Your examples:* Relief from a headache vs. calm after meditation.
  *   *The Issue:* Is pleasure a positive sensation (adding something), or is it merely the absence of pain (subtracting something)? Epicurus argued for the latter (static pleasure), while Bentham argued for the former (kinetic pleasure).
  *   *Implication:* If relief is pleasure, then pleasure is not a distinct *positive* quality but a change in state. This complicates the "maximization" calculus (are we adding positives or removing negatives?).

  **C. The Normative/Directional Worry**
  *   *Your examples:* Schadenfreude (ugly but desired) vs. Meditation (calm but passive).
  *   *The Issue:* Some pleasures feel like "additions" we chase; others feel like "cessations" we welcome. Some feel morally aligned; others feel base.
  *   *Implication:* This challenges whether pleasure is a *natural kind* or a *functional role*.

  ### 3. Distinction from Nearby Worries
  It is crucial to distinguish the Heterogeneity Problem from the other objections you mentioned, as they attack different links in the chain.

  *   **Vs. The Experience Machine (Nozick):**
      *   *Nozick's Objection:* Assumes we know what pleasure is, but argues it isn't *all* that matters (we value reality/contact).
      *   *Heterogeneity:* Argues we don't even know *what* pleasure is well enough to measure it.
      *   *Relation:* You can accept Nozick's objection even if you solve Heterogeneity. Heterogeneity is prior; it is an internal critique of hedonism's definition, whereas the Experience Machine is an external critique of hedonism's value.

  *   **Vs. The Paradox of Hedonism:**
      *   *The Paradox:* Pursuing pleasure directly makes it elusive (psychological claim).
      *   *Heterogeneity:* Concerns the metaphysics of the target, not the strategy of pursuit.
      *   *Relation:* Independent. Hedonism could be definitionally coherent (solving Heterogeneity) but psychologically self-defeating (Paradox).

  *   **Vs. Mill's Higher/Lower Pleasures:**
      *   *Mill's Move:* Mill essentially concedes the Heterogeneity Problem. By introducing "quality" distinct from "quantity," he admits that pleasures do not share a single metric of intensity/duration.
      *   *Your Insight:* You are correct that this ranks pleasures but doesn't define them. Mill's distinction is often viewed as a retreat from strict hedonism toward a perfectionist or ideal utilitarian view.

  ### 4. Is It Fatal? (The Solutions)
  The Heterogeneity Problem is fatal to **Narrow Sensory Hedonism** (Bentham's view that pleasure is a uniform sensation). However, it is not fatal to Hedonism *as such*, provided the hedonist shifts their ontology.

  **Option A: Attitudinal Hedonism (Fred Feldman)**
  *   *Definition:* Pleasure is not a sensation; it is a **pro-attitude** toward a state of affairs. To be pleased is to *take enjoyment in* something.
  *   *Solves Heterogeneity:* The bath and the proof share no sensation, but in both cases, you are adopting an attitude of "being pleased that X is happening."
  *   *Risk:* As you noted, this looks like Desire Satisfaction.
  *   *Defense:* Feldman distinguishes *intrinsic* attitudinal pleasure (enjoying the thing for itself) from *desire* (wanting the thing to obtain). You can enjoy a moment without desiring it to continue (e.g., enjoying a sad movie scene without wanting the tragedy to persist).

  **Option B: Adverbial/Intentionalist Theory (Ryle, Pitcher)**
  *   *Definition:* Pleasure is not a noun (a thing you have); it is an adverb (a *way* you are experiencing something). You don't have "pleasure" plus "listening to music"; you are "listening to music *pleasantly*."
  *   *Solves Heterogeneity:* It explains why there is no common thread. There is no common thread between "running quickly" and "thinking quickly" either, other than the manner of the activity.

  **Option C: The Desire Overlap (Chris Heathwood)**
  *   *Definition:* Heathwood argues we should embrace the collapse. **Felt Desire Satisfaction.** Pleasure is the feeling of a desire being satisfied.
  *   *Solves Heterogeneity:* Unifies the experiences via the functional role of desire satisfaction.
  *   *Risk:* This effectively merges Hedonism with Desire Satisfaction Theory.
  *   *Defense:* A hedonist can argue that only the *conscious feeling* of satisfaction counts toward well-being, not the metaphysical fact of satisfaction (which solves the problem of satisfied desires you don't know about).

  ### 5. Recommendation for Your Paper
  If I were advising on this paper, I would suggest the following structure regarding this problem:

  1.  **Name it:** Explicitly label it **The Heterogeneity Problem**.
  2.  **State the Dilemma:**
      *   Horn 1: If pleasure is a specific sensation, Hedonism is empirically false (no common thread exists).
      *   Horn 2: If pleasure is defined functionally (what we want to continue), Hedonism collapses into Desire Satisfaction Theory.
  3.  **Evaluate the "Collapse":** Argue whether the collapse into Desire Satisfaction is actually fatal. Many modern hedonists (like Heathwood) argue that a "Subjective Desire Satisfaction" theory *is* a viable form of hedonism. The distinction may be less important than the shared commitment to **subjectivism** (well-being depends on how life feels to the subject).
  4.  **Propose a Boundary:** If you need to define boundaries for your paper, draw the line between **Phenomenal Hedonism** (committed to a specific feel) and **Attitudinal Hedonism** (committed to a stance toward experience). The Heterogeneity Problem refutes the former but motivates the latter.

  **Summary Label:** If you find "Heterogeneity Problem" too dry, you might coin or adopt the phrase **"The Phenomenological Disunity Problem."** However, "Heterogeneity" is the term that will get you the most traction in the literature (search for works by Feldman, Broad, and Heathwood).

  Your intuition that the functional definition risks collapsing into Desire Satisfaction is correct and is currently one of the most active debates in well-being theory. Defending Hedonism today largely means defending **Attitudinal Hedonism** against the charge that it is merely Desire Satisfaction in disguise.
