  ### Brainstorming Candidate Research Questions

  1.  **The Co-Extensionality Thesis:** Do the standard Gricean diagnostics (cancellability, embeddability, calculability, non-detachability) always yield the same verdict on whether a content is "said" or "implicated," or do they systematically diverge in specific linguistic contexts?
  2.  **The Architectural Mapping Question:** If the diagnostics diverge, does each diagnostic track a distinct cognitive module (e.g., does embeddability track grammatical processing while cancellability tracks central reasoning), rather than a single semantics-pragmatics boundary?
  3.  **The Boundary Pluralism Hypothesis:** Should the traditional binary distinction between "what is said" and "what is implicated" be replaced by a tripartite model (semantic content, pragmatically enriched truth-conditions, and implicature), and can the diagnostics be redistributed to mark these two boundaries respectively?

  **Selection:** I will pursue the **Co-Extensionality Thesis**. It is the most methodologically tractable for a two-year project. It allows for concrete analysis of linguistic data without committing prematurely to a specific cognitive architecture or a full-blown tripartite theory, which might be too ambitious. It directly addresses the user's suspicion that the diagnostics are being conflated.

  ***

  ### Project Proposal: Diagnostic Divergence at the Semantics-Pragmatics Interface

  **Project Title:** Diagnostic Divergence: Disaggregating the Criteria for the Semantics-Pragmatics Interface

  **Research Question**
  The central research question is determinate and binary in nature: **Are the standard Gricean diagnostics for implicature (cancellability, embeddability, calculability, and non-detachability) co-extensive markers of a single semantics-pragmatics boundary, or do they diverge in systematic ways that reveal distinct interpretive interfaces?**

  While the question admits a yes/no answer, the substantive work lies in mapping the topology of any divergence. If the diagnostics diverge, the project will identify which diagnostics cluster together and which linguistic phenomena sit in the gaps. If they do not diverge, the project will provide a robust defense of their unity against recent counterexamples.

  **Background and Significance**
  Contemporary debates in the philosophy of language are currently stalled by a foundational assumption shared by opposing camps. Minimalists and contextualists disagree on how much pragmatic enrichment enters truth-conditional content, while proponents of grammatical pragmatics and standard Griceans disagree on the mechanism of scalar implicature generation. Despite their disagreements, both sides operate under the assumption that there is a single boundary between "what is said" and "what is implicated," and that the standard diagnostics track this single boundary uniformly.

  This assumption leaves the research question open because the literature treats the diagnostics as a bundled package. When a phenomenon fails one diagnostic but passes another, theorists typically adjust the definition of the phenomenon to preserve the unity of the boundary, rather than questioning the unity of the diagnostics themselves. For example, embedded implicatures are often treated as anomalies to be explained away rather than evidence that embeddability tracks a different distinction than cancellability. By treating the co-extensionality of these diagnostics as an empirical hypothesis rather than a methodological axiom, this project aims to dissolve apparent stalemates. If cancellability tracks rational reconstructability while embeddability tracks grammatical integration, then disputes over whether a content is "said" or "implicated" may be verbal disputes arising from conflating two distinct questions.

  **Methodology**
  The project will proceed in three concrete stages over twenty-four months.

  *Stage 1: Logical Mapping (Months 1–6).* I will analyze the logical relationships between the diagnostics. Are they logically independent, or does one entail another? This involves formalizing the criteria to determine if divergence is even theoretically possible within standard frameworks. This stage justifies the project against purely exegetical reconstruction; Grice's original formulation was suggestive rather than formally rigorous, and contemporary stalemates require precision he did not provide.

  *Stage 2: Systematic Case Survey (Months 7–18).* I will conduct a targeted survey of linguistic phenomena where diagnostics are known to tension, such as conventional implicatures, presuppositions, embedded scalar implicatures, and loose use. Rather than seeking a single counterexample, I will categorize cases by which diagnostics they pass or fail. This empirical-analytical method is preferred over purely formal implementation of one side of the debate (e.g., building a grammatical model of implicature) because formalizing a flawed conceptual distinction merely codifies the error. We must clarify the data before modeling the architecture.

  *Stage 3: Typological Modeling (Months 19–24).* Based on the survey, I will construct a typology of interface phenomena. If divergence is found, I will propose a model where different diagnostics mark different processing stages (e.g., modular vs. central). If unity is preserved, I will formulate a strengthened defense of the standard view.

  **Success and Failure Conditions**
  A successful result will be a comprehensive map showing either the co-extensionality of the diagnostics or a stable classification of their divergence. Success is achieved if the project demonstrates that certain debates (e.g., the status of embedded implicatures) are tractable once the diagnostics are decoupled.

  The project would only count as a failure if the data proves too noisy to support any generalization, or if the proposed distinctions turn out to be merely notational variants of existing positions. However, even a negative result (confirming co-extensionality) is philosophically valuable, as it would rule out a significant class of solutions to the minimalism-contextualism debate and force a consolidation of existing theories.

  **Feasibility and Scope**
  This scope is realistic for a two-year postdoctoral fellowship. It does not require developing a full new semantic theory or conducting psycholinguistic experiments, which would exceed the timeframe and budget. Instead, it relies on conceptual analysis and the synthesis of existing linguistic data, which is manageable for a single researcher. The output will be a monograph-length manuscript and two to three journal articles, sufficient for establishing a research profile in the philosophy of language. By focusing on the methodological tools themselves rather than the substantive theories built upon them, the project ensures high impact regardless of which substantive theory ultimately prevails.
