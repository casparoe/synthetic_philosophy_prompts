answer: |-
  Dear Colleague

  You have articulated a profound insight that lies at the very heart of modern privacy theory, and it is commendable that you have recognized this pattern so early in your tenure on the committee. The phenomenon you are describing, where the morality of information flow depends on the setting rather than merely on secrecy or consent, has indeed been theorized extensively and is most prominently known as contextual integrity. This framework was developed primarily by the philosopher Helen Nissenbaum, and it offers a robust vocabulary for exactly the puzzle you have encountered. While the traditional view of privacy often defines it as the right to be let alone or as individual control over personal information, contextual integrity argues that privacy is the appropriate flow of information according to norms that are specific to a given social context. What you are observing is not merely local convention or a subjective feeling of surprise, but a violation of the entrenched normative structures that allow specific social relationships to function properly.

  To understand how this view differs from the more familiar idea of privacy as control, we must look at what each theory prioritizes. The control paradigm assumes that information is a commodity belonging to the individual, and that privacy is preserved if the individual consents to its transfer. This is the logic behind the notice-and-consent forms we often see, where a user clicks agree and is deemed to have surrendered their privacy rights. However, as you noted with your pharmacist example, consent alone does not resolve the moral dilemma. If a pharmacist asks a patient for consent to share their prescription data with a neighbor, and the patient oddly agrees, the control model might say privacy was respected because control was exercised. Yet, our moral intuition screams that this is wrong. Contextual integrity explains this by positing that privacy is not about stopping the flow of information, but about ensuring the flow respects the context. In a healthcare context, the norms dictate that information flows from patient to provider for the purpose of treatment. When that information flows to a neighbor, even with consent, it breaches the contextual norms because the neighbor is not an actor authorized within the healthcare context, and the purpose shifts from treatment to gossip or social interaction.

  The reason these violations are genuinely wrong rather than merely surprising lies in the moral weight of the context itself. Social contexts like healthcare, education, or finance are not arbitrary gatherings; they are structured by values and purposes that sustain trust and social order. In the hospital setting, the purpose is healing, and the trust required for healing depends on the assurance that sensitive information will not leak into unrelated spheres of life. When a wearable device sells data to an insurer, it violates contextual integrity because it transplants information from a context of personal health management into a context of commercial risk assessment. This is wrong because it undermines the value of the original relationship. If patients believe their care data will be used to penalize them financially, the trust necessary for effective care erodes. Therefore, the violation is not just about broken expectations; it is about damaging the integrity of the social practice itself. It treats the person not as a patient or a user within a specific relationship, but as a data source to be mined across boundaries that ought to remain distinct.

  However, you are also right to be puzzled by the shifting nature of these expectations, which points to the edges and limitations of this framework. Contextual integrity does not claim that norms are static or universally identical across all cultures. Instead, it acknowledges that contexts evolve and that new technologies often create new contexts or blur the lines between old ones. The edge of this theory is found in determining when a norm has legitimately shifted versus when it has been unfairly disrupted. For example, the use of electronic health records changed the flow of information compared to paper files, but this was generally accepted because it enhanced the purpose of care without violating the core normative constraints. Conversely, selling data to insurers disrupts the purpose. The challenge for your committee will be distinguishing between technological evolution that serves the context and technological exploitation that violates it. There will be hard cases where contexts conflict, such as when public health surveillance interests clash with individual medical privacy, and contextual integrity does not provide a simple algorithmic solution for these trade-offs. It requires deliberative judgment about which values should prevail in a specific setting.

  Ultimately, adopting this lens will empower your committee to move beyond the binary of legal compliance versus violation. You will be able to ask not just whether a data practice is permitted by law or covered by a consent form, but whether it fits the moral architecture of the healthcare environment you steward. It rules out practices that might be legally permissible but socially corrosive, and it rules in practices that might seem intrusive but are necessary for the context's purpose, such as sharing data among a care team during an emergency. By focusing on the appropriateness of information flows relative to the roles, purposes, and values of your hospital community, you are protecting something deeper than data security. You are protecting the trust relationships that make healthcare possible. This is a sophisticated and necessary approach, and I encourage you to bring this terminology and framework into your discussions, as it will provide the precise language needed to articulate the concerns you have already so keenly identified.

  Sincerely

  A Colleague in Privacy Ethics
