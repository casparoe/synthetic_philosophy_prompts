      *   *Correction:* Make sure to distinguish between the *result* (mathematical incompatibility) and the *philosophical moral* (what to give up).
      *   *Emphasis:* Highlight the "Fixed Proposition" assumption in Lewis's proof. That's the key to the Contextualist escape route.

