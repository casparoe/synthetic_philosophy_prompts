      *   *Specific Focus:* Ensure the distinction between "Lewis proved conditionals have no truth conditions" (False) and "Lewis proved you can't have *both* truth conditions and Adams's Thesis" (True) is highlighted.
      *   *Nuance:* Mention that Lewis himself didn't necessarily conclude non-cognitivism; he pointed out the incompatibility.

  5.  **Self-Correction during drafting:**
