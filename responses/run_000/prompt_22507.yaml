      *   *Technical Detail:* Mention Transfinite Recursion. To use transfinite recursion, you need a "next step" function $g: P \to P$ such that $g(x) > x$ if $x$ is not maximal. The existence of such a $g$ is exactly a choice function on the family of sets $\{ \{y \in P \mid y > x\} \mid x \text{ is not maximal} \}$.

  8.  **Final Polish:** Ensure the tone is appropriate for a PhD student (rigorous but explanatory). Avoid being condescending about the "obviousness" of the error, as it is a deep conceptual hurdle.

