answer: |-
  The regulatory patchwork you describe presupposes no coherent philosophical theory of sentience, but instead relies on a pragmatic heuristic combining phylogenetic proximity, neuroanatomical complexity, and administrative feasibility.

  The implicit view operating in your university's committee is not a theory of mind but a risk-management strategy based on proxies. Because regulators cannot measure suffering directly, they use evolutionary relatedness and brain structure as stand-ins for the capacity to suffer. The vertebrate line is a phylogenetic proxy: organisms sharing a recent common ancestor with humans are assumed to share the relevant neurobiology for pain. The octopus exception reveals that this proxy is secondary to behavioral evidence; when an invertebrate demonstrates sufficient behavioral complexity (problem-solving, avoidance learning, centralized processing), the phylogenetic rule is overridden. However, this override is applied sparingly. The exclusion of insects despite nociception and avoidance learning is not a philosophical denial of their capacity, but an administrative boundary; regulating every insect protocol would collapse the system. The exclusion of simulations is purely legalistic and ontological: regulations define "animal" as a living biological organism, so a simulation cannot violate animal welfare laws regardless of its functional isomorphism to a pain state.

  Consequently, the parts of the practice do not presuppose consistent things. The inclusion of the octopus contradicts the "vertebrate" rule, pointing toward a capacity-based view, but the exclusion of the honeybee contradicts the capacity view, pointing back toward administrative convenience. The strict commitment of the practice is merely to prevent observable distress in organisms that humans intuitively recognize as "like us" or "complex enough," bounded by what is logistically enforceable. Everything else—the specific phylogenetic cut-off, the exclusion of invertebrates except cephalopods, the exclusion of non-biological substrates—is historical accident or administrative convenience. The vertebrate line exists because early animal welfare laws were drafted to protect livestock and pets, not research subjects, and were later adapted for science. The simulation exclusion exists because legislation lagged behind computational neuroscience.

  If we took seriously the idea that certain computations matter morally regardless of substrate (substrate neutrality), the regulatory framework would require a foundational overhaul rather than a patch. First, the category of "animal" would be abolished in favor of "sentient system," shifting oversight from Institutional Animal Care and Use Committees to something like Computational Ethics Boards. Second, the criteria for regulation would shift from phylogeny and anatomy to architectural complexity; you would need to demonstrate that your simulation lacks the specific information integration or global workspace dynamics theorized to constitute suffering before proceeding. Third, the burden of proof would invert: instead of assuming simulations are safe because they are code, researchers would need to prove their models do not instantiate the computational correlates of nociception or affect. This would likely halt many large-scale neural simulations until we possess a verified theory of which computations constitute suffering, effectively pausing progress in whole-brain emulation until the philosophy of mind catches up with the engineering.
