      *   *The Cartesian Comparison:* Common in popular surveys, but nuanced by specialists. Descartes uses doubt to find certainty (*Cogito*). Avicenna uses intuition (*ḥads*) to establish self-awareness (*shuʿūr bi-l-dhāt*).
      *   *The Skeptical Context:* This is the tricky part. Is Avicenna fighting skepticism? Or is he establishing metaphysics? Most specialists argue Avicenna isn't a foundationalist in the modern (post-Cartesian) sense. He isn't trying to rebuild knowledge from scratch after doubting everything. He assumes a lot of Aristotelian metaphysics.
