answer: |-
  You have identified a very real, very documented phenomenon in political science and public administration, though you are correct that it lacks a single, universally recognized proper noun (like "Gresham's Law" or "The Peter Principle").

  In academic literature, this is most often discussed under the umbrellas of **Tokenism** (specifically Sherry Arnstein's *Ladder of Citizen Participation*), **Co-optation**, or **Depoliticization**. However, those terms describe the *result*, not the specific *mechanism* of the rigged pilot you described.

  For your novel, you have two options: use the existing academic framing, or coin a term that captures the specific logical trap. Given you are writing fiction, a coined term often lands better with readers because it feels like insider jargon specific to your world.

  Here is a breakdown of the existing concepts, a proposed name for the dynamic, and how to distinguish it from the related concepts you mentioned.

  ### 1. The Academic Ancestry
  If your characters are academics or policy wonks, they might refer to this using existing terms:

  *   **Arnstein's Ladder (Tokenism):** In 1969, Sherry Arnstein published a famous framework categorizing citizen participation. She identified a zone called "Tokenism," which includes *Consultation* and *Placation*. Her core insight matches yours: "It enables the have-nots to hear and be heard... [but] they lack the power to ensure their views will be heeded."
  *   **Co-optation:** This is when an institution absorbs a threat (the reformers) into its structure to neutralize them. By giving the assembly a seat at the table but no vote, the legislature co-opts the demand for change.
  *   **The "Pilot Trap":** In innovation and public policy, this refers to the tendency of organizations to keep projects in a perpetual pilot phase to avoid the risk and cost of full implementation.

  ### 2. A Proposed Name: "The Advisory Ratchet"
  Since you are writing a novel, you might want a term that sounds like political slang or insider jargon. I propose calling this dynamic **The Advisory Ratchet** (or simply **The Ratchet**).

  *   **Why it works:** A ratchet is a mechanical device that allows motion in only one direction. In this context, the political momentum can click *down* (from proposed power to advisory pilot) but it cannot click *up* (from advisory to actual power). Once the assembly is categorized as "advisory," the mechanism locks.
  *   **Alternative:** **The Legitimacy Laundering.** This focuses on the *motive*. The legislature uses the assembly to "wash" their own legitimacy (looking democratic) without dirtying their hands (giving up power).
  *   **Alternative:** **Pilot Purgatory.** A more colloquial term characters might use. "They've stuck us in Pilot Purgatory."

  ### 3. Distinguishing It From Related Concepts
  You asked to distinguish this from Regulatory Capture, the Overton Window, and Foot-Dragging. Here is how you can articulate that distinction in your narrative:

  **vs. Regulatory Capture**
  *   *Capture:* An external entity (corporations, lobbyists) secretly takes control of the agency meant to regulate them.
  *   *Your Dynamic:* This is **Institutional Self-Preservation**. It isn't an outside force capturing the legislature; it is the legislature's immune system attacking a foreign body (the sortition proposal). It is internal, not external.
  *   *Narrative Hook:* "Capture is when the fox guards the henhouse. This is when the henhouse pretends to let the fox in, gives him a visitor's badge, and then says, 'See? He doesn't know how to lay eggs.'"

  **vs. The Overton Window**
  *   *Overton:* The range of ideas considered politically *acceptable* to discuss.
  *   *Your Dynamic:* This happens *after* the idea has already entered the window. Sortition is already accepted as a topic; this dynamic is about **Implementation Sabotage**. It's not about what we can talk about; it's about rigging the test so the idea fails or becomes harmless.
  *   *Narrative Hook:* "The Overton Window is about what you're allowed to say. The Advisory Ratchet is about what you're allowed to *do*."

  **vs. Foot-Dragging (Bureaucratic Inertia)**
  *   *Foot-Dragging:* Slowing things down, delaying votes, burying proposals in committee. It is passive.
  *   *Your Dynamic:* This is **Active Redirection**. They aren't saying "no"; they are saying "yes, but..." They are actively creating a structure (the pilot) designed to produce a specific outcome (permanent advisement). It requires energy and strategy, not just laziness.
  *   *Narrative Hook:* "Foot-dragging is stalling. This isn't stalling. This is a detour that leads back to the garage."

  ### 4. The Logical Structure: The "Self-Sealing Argument"
  For your characters to analyze this intellectually, the core logical flaw they are fighting is a **Self-Sealing Argument** (or a **Kafka Trap**).

  *   **The Setup:** Power is required to demonstrate competence.
  *   **The Trap:** Competence is tested without power.
  *   **The Seal:**
      *   If they fail (due to lack of power), it proves they are incompetent.
      *   If they succeed (despite lack of power), it proves they are *only* needed as advisors.
  *   **Novelistic phrasing:** "It's a heads-I-win, tails-you-lose game. If we fail, it's because citizens can't govern. If we succeed, it's because citizens don't *need* to govern. The conclusion is the same either way."

  ### 5. Summary for Your World-Building
  If I were writing this novel, I would have the reformist characters identify the trap early and name it.

  *   **The Term:** **The Containment Pilot.**
  *   **The Definition:** A reform mechanism designed to isolate a threat to the status quo by granting it visibility without authority.
  *   **The Tell:** When the success metrics for the pilot measure "satisfaction" or "deliberation quality" rather than "legislative output" or "binding decisions."
  *   **The Counter-Move:** The only way to break the Containment Pilot is to refuse the advisory role, which carries the risk of looking unreasonable. This creates great dramatic tension: *Do we take the powerless seat to get a foothold, or boycott the pilot and risk being marginalized?*

  This dynamic is the central tragedy of many real-world democratic reforms, and spotting it shows you understand the material deeply. It is not just inertia; it is **structural antibodies** at work.
