answer: |-
  Here is an example designed to isolate the metaphysical tension at the heart of causation by omission.

  ### The Example: The Off-Duty Specialist

  Imagine a private backyard pool party. The host is not present; he has stepped inside to take a call. There are twenty guests. Among them is **Alex**, a certified lifeguard who works at a municipal pool three miles away. Alex is off-duty, in swimwear, holding a drink, and chatting with friends. He is not paid, not hired, and has no explicit agreement to monitor the pool.

  A four-year-old child, playing near the edge, slips and falls into the deep end. The child thrashes silently (drowning is often quiet). Alex sees this clearly. He is physically capable of jumping in and saving the child with zero risk to himself. He chooses not to, thinking, *"It's not my pool, and I'm not on the clock."* The child drowns.

  Now, consider two variations:
  1.  **Variation A:** Alex is the only guest who notices. No one else knows the child is in the water.
  2.  **Variation B:** Five other guests also see the child. They all freeze in panic. None of them are lifeguards. Alex still does nothing.

  **The Question:** In Variation A, did Alex *cause* the child's death?

  Intuitively, many people feel Alex is morally monstrous, but hesitate to say he *caused* the death in the same way a pusher would. Yet, counterfactually, the dependence is absolute: If Alex had acted, the child would live. If Alex does not act, the child dies. There is no other potential savior.

  ### What This Example Reveals

  This scenario isolates the **Baseline Problem**.

  In standard "positive" causation (e.g., pushing a domino), we identify the cause as the *intervention* that disrupts the normal course of events. The dominoes staying still is the background; the push is the figure.

  In causation by omission, there is no physical intervention. There is only the world continuing as it is. To call an omission a "cause," we must distinguish between **background conditions** (things that are merely present) and **causal factors** (things that make the difference).

  In the pool case, the physical reality is identical whether Alex is a lifeguard or a stranger: a human body remains stationary while another human drowns. The physics doesn't change. The counterfactual dependence doesn't change (assuming the stranger also *could* have saved them but didn't notice).

  What changes is the **Normative Baseline**.

  1.  **If Alex were a stranger:** We treat his inaction as part of the background conditions of the universe. "Strangers don't save strangers" is the default state of nature. His inaction is not a deviation; it is the norm. Therefore, it is not a cause.
  2.  **If Alex were on-duty:** We treat his inaction as a deviation. "Lifeguards save swimmers" is the expected course of events. His failure to act is a disruption of the norm. Therefore, it is a cause.
  3.  **The Hard Case (Off-Duty Specialist):** Alex sits in the uncanny valley between these two baselines. He has the *capacity* of the lifeguard but the *status* of the stranger.

  This reveals that **causation by omission is not purely metaphysical; it is inherently normative.** We cannot determine if an omission is a cause solely by looking at the physical events or the counterfactual dependencies. We must first answer a moral or social question: *What was supposed to happen?*

  If "what was supposed to happen" includes Alex jumping in, then his not jumping in is a cause. If "what was supposed to happen" does not include it, then his not jumping in is merely a background condition (like the fact that gravity didn't suddenly reverse to lift the child out).

  Therefore, the deepest difficulty is that **causal selection relies on normative expectations.** We cannot separate the *is* of causation from the *ought* of expectation. To call an omission a cause is to claim that the world deviated from how it should have been, not just how it usually is.

  ### Where My Reasoning Is Vulnerable

  My analysis rests on the claim that normative baselines are necessary to distinguish causes from background conditions in omission cases. I am vulnerable to the **Error Theory Challenge**.

  **The Challenge:**
  A skeptic could argue that I am conflating **Causal Ontology** (what actually causes things) with **Causal Pragmatics** (what we find useful to talk about).

  The skeptic would argue: *"Alex's omission was a cause in Variation A regardless of his job title. The physics of counterfactual dependence is the only truth. You are simply refusing to call it a cause because you don't want to assign blame to a stranger. But if you admit that omissions are causes based on counterfactual dependence, you must admit that **everyone** caused the child's death. The guest in the house who didn't hear, the neighbor who didn't look out the window, the manufacturer who didn't build a fence. They all satisfy the counterfactual test."*

  **Why this is hard to absorb:**
  If I accept this challenge, I face **Causal Inflation**. If every unprevented event is caused by every person who could have prevented it, the concept of "cause" loses its explanatory power. Everything causes everything (e.g., my failure to fly food to Africa causes famine).

  However, if I reject the challenge and maintain that norms determine causation, I face the **Objectivity Problem**. I am admitting that causation is not a feature of the world itself, but a feature of how we judge the world. This makes causation subjective or socially constructed.

  **The Specific Case That Breaks Me:**
  The case that would force me to abandon my analysis is a scenario where **normative expectations shift, but causal intuition remains stable.**

  Imagine a society where it is culturally accepted that off-duty lifeguards do *not* intervene at private parties (a strong norm against interference). In that society, by my analysis, Alex does *not* cause the death, because his omission aligns with the normative baseline.

  However, if you feel that **even in that society**, Alex is still a cause of the death (perhaps because the *moral* capacity overrides the *cultural* norm), then my reliance on "expected norms" is flawed. It would suggest that there is an objective, mind-independent standard for which omissions count as causes (perhaps based on unique capacity or minimal cost), regardless of social convention.

  If such an objective standard exists, my claim that causation relies on normative baselines is wrong. If it doesn't exist, then causation is merely a tool of social blame, not a metaphysical relation. Both options undermine the stability of the concept I'm trying to defend.
