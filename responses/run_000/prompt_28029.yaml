      *   **Audience:** ~35 Engineers, PMs, Designers. Smart, technical, distracted (eating/Slack), no philosophy background.
      *   **Topic:** The Paradox of Tragedy (Why do we seek out negative emotions in art?).
      *   **Constraint:** 30 minutes.
      *   **Goal:** A teaching plan (structure, timing, examples, preempting misconceptions, scope management, final comprehension check).
      *   **Specific Needs:**
