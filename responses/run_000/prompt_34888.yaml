      *   *Crux:* Can we find a neural signature of the *first* colour experience that differs from the *final* report?
      *   *Verbal:* The definition of "conscious experience." If it means "what is available for report," Stalinesque wins (because report is late). If it means "what happens at V1/V4 initially," Orwellian might have a point.

  5.  **Drafting the Content (incorporating British English):**
