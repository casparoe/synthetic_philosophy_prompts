          *   *Crux 2:* Memory vs. Perception distinction. Can we dissociate them?
          *   *Crux 3:* The definition of "Experience."
      *   **Section 4: Verbal Disputes:**
          *   This is key in Dennett's analysis. "Conscious Experience" is often the slippery term.
          *   Orwellians tend to treat experience as an event that happens *then* gets remembered.
          *   Stalinesques tend to treat experience as the final output of a processing stream.
          *   Dennett says there is no "finish line."
