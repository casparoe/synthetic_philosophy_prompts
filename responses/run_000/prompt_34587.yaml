  She is implicitly a **Lockean Empiricist regarding Form**, but a **Gibsonian Ecological Psychologist regarding Function**.
  *   She believes *Form* (shape, geometry) is sense-specific and must be learned.
  *   She believes *Function* (affordances, motion, expression) is directly perceivable across senses.

  Since recognizing a specific face by structure is a **Form** task, not a **Function** task, her own logic commits her to a **No**.

