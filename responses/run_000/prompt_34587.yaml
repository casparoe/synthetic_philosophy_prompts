  To separate **Biological Salience** (Rule 1) from **Identity vs. State** (Rule 2), you need a case that is biologically salient but static/identity-based.

  **The Test Case:**
  > "Suppose she touches a **plaster death mask** of her mother's face (or a very realistic static statue of her doctor). It has the exact geometric shape of the face, but no expression, no warmth, no life. When she gains sight, can she recognize the mask as her mother/doctor?"

