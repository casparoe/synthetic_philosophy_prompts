answer: |-
  Good evening. For those of you who don't know me, I'm one of [Advisor's Name]'s former students. For those of you who *do* know me, you're probably wondering if I ran this toast through a Borda Count to ensure maximum approval.

  I want to start with the story half this room already knows. The one about the City Council. As the family version goes, [Advisor's Name] once made a city council cry over a ballot. The academic version is that she pointed out a cycle in their ranked-choice proposal that meant the outcome depended entirely on the order of the amendments. She didn't do it to be mean. She did it because she believes that pretending a voting rule is fair when the math says it isn't… that's the real cruelty.

  To explain what I mean by that, I need to tell you about the Sunny Acres Neighborhood Association, circa 2014. This is a story [Advisor's Name] likes to use in Intro to Social Choice, though she usually changes the colors.

  Sunny Acres needed to pick a color for the new community patios. There were three options: Terracotta, Slate, and Beige. They had thirty-five homeowners.

  Twelve people loved Terracotta best, but hated Slate.
  Thirteen people loved Slate best, but hated Beige.
  And ten people loved Beige best, but hated Terracotta.

  If you just count first choices, Slate wins with thirteen votes. Simple.

  But the HOA president thought, "Hey, Beige only got ten votes. Let's cross off the least popular color and have a runoff between the top two." So they crossed off Beige.

  Here is where the math bites you. The ten people who loved Beige? Their second choice was Terracotta. They hated Slate. So when Beige was eliminated, those ten votes transferred to Terracotta. Suddenly, Terracotta has twenty-two votes. Slate has thirteen.

  By crossing off the loser, the winner changed.

  If Beige stays on the ballot, Slate wins. If Beige is removed, Terracotta wins. Neither color changed. The voters didn't change. Only the rule changed.

  For the theorists in the room, you're nodding. You hear the ghost of Kenneth Arrow whispering from the beyond about Independence of Irrelevant Alternatives. You know that this isn't a glitch in Sunny Acres; it's a feature of collective decision-making.

  But for the family in the room, here is the point: [Advisor's Name] spent forty years telling us that there is no perfect ballot. There is no magic system that will count everyone's voice fairly without sometimes producing a result that feels contradictory.

  A lesser scholar might have spent their life trying to fix it. Trying to invent the perfect rule that squares the circle. But [Advisor's Name] was too honest for that. She spent her career showing us that we need to stop pretending perfection exists. She taught us that democracy isn't about finding a machine that outputs "Truth." It's about understanding the trade-offs. It's about admitting that sometimes, the agenda setter holds the power, and sometimes, the loser matters just as much as the winner.

  She taught me that the most ethical thing a theorist can do is to tell the power brokers, "Actually, you can't ask the math to do that."

  That is why she is so beloved by her students, and why she is so respected by her peers. She didn't offer false hope. She offered clarity. She looked at the messy, contradictory, paradoxical nature of human preference and said, "Okay. Now that we know we can't be perfect, how can we be honest?"

  And honestly, that is a lesson that applies to a lot more than voting. It applies to grading papers, to department meetings, and certainly to retirement planning.

  So, [Advisor's Name], as you move into this next chapter, I have one request. Please, for the love of God, do not implement a ranked-choice system for deciding what's for dinner.

  We know you *could*. We know you could construct a social welfare function that maximizes utility between steak and salad while satisfying Pareto efficiency. But tonight, we are invoking the dictatorship clause. You are the dictator. Pick the wine. Pick the dessert. And if there's a paradox in the cake flavors, we promise not to bring it up until Monday.

  Thank you for showing us that while the perfect vote doesn't exist, the perfect mentor does. To [Advisor's Name]!
