      *   *Thesis 5: The Dialogic Claim.* Violence ends communication.
          *   Plausibility: True physically.
          *   Licenses Conclusion? No. Sometimes communication is impossible or undesirable (e.g., active shooter).

  4.  **Refining and Editing for Word Count:**
