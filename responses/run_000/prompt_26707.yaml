answer: |-
  The slogan "violence never solves anything" functions as a rhetorical Swiss Army knife, concealing distinct claims under one empirical veneer. Here are five distinct theses hidden within it:

  1.  **The Empirical Absolute:** Violence never achieves any intended physical outcome.
      *   *Plausibility:* False. Violence stops bullets, topples dictators, and restrains attackers.
      *   *Licenses Conclusion?* Yes, if true. But since it is false, it supports nothing.

  2.  **The Net-Negative Pragmatist:** Violence always creates more problems than it resolves long-term.
      *   *Plausibility:* Contingent. Often true (blowback), but questionable in cases like defeating Nazism.
      *   *Licenses Conclusion?* No. Even if violence has bad side effects, it may be the *least bad* option. A net negative doesn't imply prohibition if the alternative is catastrophe.

  3.  **The Definitional Stipulation:** "Solves" means "resolves conflict justly or through consensus."
      *   *Plausibility:* True by definition. Violence coerces; it doesn't persuade.
      *   *Licenses Conclusion?* Only if you value process over survival. In self-defense, "solving" the problem (stopping the attacker) matters more than achieving consensus. This reading makes the slogan true but irrelevant to immediate safety.

  4.  **The Moral Absolute:** Violence is intrinsically wrong, regardless of utility.
      *   *Plausibility:* Dependent on ethical framework (e.g., strict pacifism).
      *   *Licenses Conclusion?* Yes, but dishonestly. This is a moral claim masquerading as an empirical observation. It begs the question against non-pacifists.

  5.  **The Epistemic Claim:** Violence shuts down dialogue and learning.
      *   *Plausibility:* Generally true. Force replaces argument.
      *   *Licenses Conclusion?* No. Sometimes dialogue is exhausted or impossible. If an aggressor refuses reason, violence may be the only remaining tool.

  **The Crucial Gap**
  The most dangerous ambiguity lies between Theses 2 and 3. If the slogan means "violence doesn't create *lasting peace*" (Thesis 2/3), it might be true, but it doesn't forbid violence when *temporary* safety is the goal (self-defense). Conversely, if it means "violence is useless" (Thesis 1), it licenses the conclusion but is demonstrably false.

  Charitable interpreters should recognize that while violence often fails to build sustainable order (Thesis 2), it remains effective at immediate obstruction (Thesis 1). Therefore, the slogan rarely licenses a universal prohibition. It functions best as a heuristic against rash escalation, not an absolute moral law. Using it to dismiss self-defense or intervention conflates "solving a problem" with "creating a utopia." The slogan is often factually true regarding *justice*, but logically inert regarding *necessity*.
