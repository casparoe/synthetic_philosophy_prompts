prompt: |-
  I'm in a reading group that's been working through the algorithmic fairness literature, and we've hit a point of frustration. Every week someone presents a paper proposing a new fairness criterion — demographic parity, equalized odds, predictive parity, calibration, individual fairness, counterfactual fairness — and every week someone else points out that the new criterion either collapses into an old one under mild conditions or conflicts with another criterion that seems just as well-motivated. The impossibility results (the ones showing that calibration and certain balance conditions can't simultaneously hold except in degenerate cases, and their relatives) keep coming up, but we never seem to ask what they're actually telling us about the project of formalizing fairness in the first place.

  So before we read another proposal, I want to do the groundwork properly. Please write the desiderata that any adequate theory of algorithmic fairness must meet. I want the full specification: which cases a fairness criterion has to handle (hiring, lending, pretrial detention, medical triage — do these call for different things?), which distinctions it must respect (between process and outcome, between group and individual, between predictive and causal), which formal properties are required and which are merely nice to have, and which results from the adjacent literatures (the impossibility theorems, the causal hierarchy, results about infra-marginality) it cannot contradict. For each desideratum, give the motivating case or consideration — why should a theory of fairness care about this? Then flag which desiderata are non-negotiable and which are modeling choices that reasonable people can disagree about. Most importantly: tell me which subsets of these desiderata are jointly unsatisfiable given what we already know, and whether that means some of them need to be abandoned, weakened, or indexed to context. I'm less interested in a scorecard for existing proposals than in the structure of the requirements themselves — if the list turns out to be internally inconsistent, that's the result I most want to see laid out clearly, because it would explain why the literature feels stuck in a loop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** A reading group frustrated by the "whack-a-mole" nature of algorithmic fairness literature (new criteria, conflicts, impossibility results).
      *   **Goal:** Establish the *desiderata* for an adequate theory of algorithmic fairness *before* evaluating specific criteria.
      *   **Requirements:**
          *   Full specification (cases, distinctions, formal properties, adjacent literature constraints).
          *   Motivating cases/considerations for each desideratum.
          *   Classification: Non-negotiable vs. Modeling Choices.
          *   **Crucial:** Identify jointly unsatisfiable subsets (inconsistencies) and implications (abandon, weaken, index).
          *   **Tone:** Analytical, structural, philosophical but grounded in technical reality. Not a scorecard, but a map of the constraint space.

  2.  **Initial Brainstorming & Categorization:**
      *   The user is asking for a meta-analysis of the field. They want to know *why* it's stuck.
      *   Key tensions: Statistical parity vs. Accuracy, Group vs. Individual, Predictive vs. Causal, Procedural vs. Substantive.
      *   Key impossibility results: Chouldechova (2017), Kleinberg et al. (2016) (Calibration vs. Balance).
      *   Key distinctions: Context matters (lending != healthcare != criminal justice).
      *   Structure of the response needs to be rigorous. I should organize by dimensions of fairness.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Dimension 1: Scope and Context.* Fairness isn't one-size-fits-all.
          *   Desideratum: Context-Sensitivity. (Motivation: Lending involves money/repayment; Healthcare involves life; Criminal Justice involves liberty.)
          *   Status: Non-negotiable.

      *   *Dimension 2: The Unit of Analysis.*
          *   Desideratum: Group vs. Individual. (Motivation: Anti-discrimination law often protects groups; Moral intuition often cares about individuals.)
          *   Status: Modeling Choice (but must declare which one).

      *   *Dimension 3: The Nature of the Harm.*
          *   Desideratum: Allocative vs. Representational. (Motivation: Denying a loan vs. stereotyping in search results.)
          *   Status: Non-negotiable (must specify which is being addressed).

      *   *Dimension 4: Statistical/Formal Properties.*
          *   Desideratum: Base Rate Independence? (Motivation: Should fairness correct for historical disparities?)
          *   Desideratum: Calibration. (Motivation: Risk scores should mean the same thing across groups.)
          *   Desideratum: Error Balance. (Motivation: False positives/negatives should be distributed fairly.)
          *   *Conflict Alert:* These three are the source of the impossibility theorems.

      *   *Dimension 5: Causality.*
          *   Desideratum: Counterfactual Consistency. (Motivation: Would the outcome change if the protected attribute changed?)
          *   Status: High bar, often non-negotiable for "true" fairness, but hard to verify.

      *   *Dimension 6: Feasibility/Implementability.*
          *   Desideratum: Constructibility. (Motivation: Can we actually optimize for this?)
          *   Desideratum: Verifiability. (Motivation: Can an auditor check this?)

  4.  **Addressing the "Impossible" Core (The Crux of the Prompt):**
      *   The prompt specifically asks about the impossibility results. I need to explicitly state the "Impossibility Triangle."
      *   *The Triangle:* Calibration + Error Rate Balance (Equalized Odds) + Base Rate Parity.
      *   *Resolution:* You can't have all three unless base rates are equal or the classifier is perfect.
      *   *Implication:* One must be sacrificed based on context.

  5.  **Refining the Distinctions (Process vs. Outcome, etc.):**
      *   *Procedural Fairness:* Was the algorithm built fairly? (Data, process).
      *   *Substantive Fairness:* Are the outcomes fair?
      *   *Predictive vs. Causal:* Statistical correlations vs. Mechanisms.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that the "loop" is a feature, not a bug, of the underlying tension.
      *   **Part I: The Domain Constraints (Context):** Where is this applied?
      *   **Part II: The Conceptual Distinctions:** What kind of fairness?
      *   **Part III: The Formal Desiderata:** The math properties.
      *   **Part IV: The Inconsistency Theorems (The "Hard" Constraints):** This is the most important part.
      *   **Part V: Synthesis/Resolution:** How to move forward (Contextualization).
      *   **Conclusion:** Summary of the "Way Out."

  7.  **Drafting Content - Specific Considerations:**
      *   *Impossibility:* Cite Chouldechova and Kleinberg/Mullainathan/Raghavan clearly.
      *   *Infra-marginality:* Mention that average group metrics hide individual distributions (Elrod v. Patzert).
      *   *Causal Hierarchy:* Pearl's ladder. Most fairness metrics are rung 1 (association), some are rung 3 (counterfactual).
      *   *Non-negotiable:* Logical consistency, clarity on protected attributes, definition of "benefit/harm."
      *   *Modeling Choices:* Which statistical parity metric to use, how to weigh false positives vs. negatives.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Am I just listing metrics?
      *   *Fix:* No, focus on the *requirements for a theory*, not the metrics themselves. For example, instead of saying "Must satisfy Equalized Odds," say "Must specify how error types are weighted across groups."
      *   *Critique:* Did I answer the "jointly unsatisfiable" part strongly enough?
      *   *Fix:* Create a dedicated section called "The Incompatibility Core." Make it stark.
      *   *Critique:* Is the distinction between non-negotiable and modeling choice clear?
      *   *Fix:* Use explicit labeling (e.g., **[NON-NEGOTIABLE]** vs. **[MODELING CHOICE]**).

  9.  **Final Polish:**
      *   Ensure the tone is appropriate for a reading group (academic, rigorous, slightly philosophical).
      *   Check that all parts of the prompt are addressed (cases, distinctions, properties, literature constraints, inconsistencies).
      *   *Key Insight to emphasize:* The literature feels stuck because people are trying to find a *universal* mathematical definition of a *political/moral* concept. The solution isn't better math; it's better political philosophy encoded into the math.

  10. (Final check against constraints): The user wants the "structure of the requirements themselves." I need to make sure I don't just summarize papers but analyze the *space of possibilities*.

  *(Self-Correction during final review)*: Make sure to mention *construct validity*. Does the proxy variable actually measure the construct? This is a major source of failure (e.g., arrest rates vs. crime rates).

  Okay, ready to write. The structure will be:
  1.  Preamble: The Nature of the Impasse.
  2.  Domain & Construct Validity (The Input).
  3.  The Moral/Conceptual Layer (The Logic).
  4.  The Formal/Statistical Layer (The Math).
  5.  The Incompatibility Core (The Conflict).
  6.  Resolution Strategy (Contextualization).
  7.  Conclusion.

  Let's flesh out the "Incompatibility Core" with precision. It's not just "they conflict." It's specifically about Calibration vs. Balance vs. Prevalence.
  Also, need to mention Individual Fairness (Dwork et al.) vs. Group Fairness. They are often orthogonal but can conflict if groups are not homogeneous.

