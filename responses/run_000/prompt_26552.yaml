answer: |-
  This is the right moment to pause. The frustration your group is experiencing is not a sign of failure; it is a sign of engagement with the actual structure of the problem. The literature feels like a loop because researchers are attempting to solve a **political and moral philosophy problem** using **optimization constraints**, without explicitly agreeing on the political and moral premises first.

  When you treat fairness as a purely mathematical property of a predictor, you inevitably run into impossibility theorems because you are asking math to resolve value conflicts that math cannot resolve.

  Below is the specification of the desiderata for an adequate theory of algorithmic fairness. I have organized them by layer: **Construct Validity** (what are we measuring?), **Moral Logic** (what do we owe whom?), and **Formal Properties** (what does the math look like?). I have flagged which are non-negotiable and which are choices, and I have isolated the specific incompatibility core that is causing your literature review to stall.

  ---

  ### I. Construct Validity Desiderata (The Input Layer)
  *Before defining fairness of outcomes, a theory must define the validity of the variables involved.*

  **1. Construct Validity of the Target Variable ($Y$)**
  *   **Requirement:** The theory must specify whether the target variable represents a *ground truth* (e.g., disease pathology) or a *proxy* (e.g., arrest records, credit repayment).
  *   **Motivation:** In pretrial detention, "failure to appear" is observable, but "dangerousness" is not. In lending, "repayment" is observable, but "creditworthiness" (ability to pay if terms were different) is not. Optimizing fairness on a biased proxy entrenches historical bias (the "label bias" problem).
  *   **Status:** **[NON-NEGOTIABLE]**. A theory that does not distinguish between $Y_{observed}$ and $Y_{true}$ is formally incoherent.

  **2. Construct Validity of the Protected Attribute ($A$)**
  *   **Requirement:** The theory must specify whether $A$ is treated as a causal essence, a social category, or a proxy for structural disadvantage.
  *   **Motivation:** In individual fairness, we need to know if two individuals are "similar." If $A$ is race, is it a biological constant or a social assignment? This matters for counterfactuals (e.g., "If this person were white...").
  *   **Status:** **[NON-NEGOTIABLE]**. Causal fairness definitions collapse without a specified causal graph for $A$.

  **3. Feasibility of Measurement**
  *   **Requirement:** The theory must state whether the fairness metric is auditable without access to the protected attribute in deployment.
  *   **Motivation:** In many jurisdictions (e.g., EU, parts of US), storing or using protected attributes is restricted. A theory requiring $A$ for every decision may be legally non-compliant.
  *   **Status:** **[MODELING CHOICE]**. Some theories (Group Fairness) require $A$; others (Individual Fairness via metrics) may not. The theory must declare this constraint.

  ---

  ### II. Moral Logic Desiderata (The Normative Layer)
  *This layer defines the ethical commitments. Conflicts here are the source of the mathematical impossibilities.*

  **4. Unit of Moral Concern (Group vs. Individual)**
  *   **Requirement:** The theory must declare whether the primary obligation is to groups (statistical parity across populations) or individuals (similar treatment for similar people).
  *   **Motivation:** Anti-discrimination law oscillates between these. *Disparate impact* is group-based; *disparate treatment* is often individual-based.
  *   **Status:** **[MODELING CHOICE]**. Reasonable people disagree. However, the theory cannot claim to satisfy both simultaneously without qualification.

  **5. Procedural vs. Substantive Fairness**
  *   **Requirement:** The theory must distinguish between fairness of the *process* (was the algorithm blind? was the data representative?) and fairness of the *outcome* (are the error rates balanced?).
  *   **Motivation:** A process can be blind (colorblind) but yield substantively unfair outcomes due to base rate differences. Conversely, outcome parity might require procedurally unfair interventions (explicit quotas).
  *   **Status:** **[NON-NEGOTIABLE]**. A theory must specify which it optimizes. Conflating them leads to the "bias laundering" critique.

  **6. The Counterfactual Baseline**
  *   **Requirement:** The theory must specify the relevant counterfactual world for comparison. Are we comparing against the *status quo*, a *world without the protected attribute*, or a *world without historical injustice*?
  *   **Motivation:** "Equalized Odds" compares error rates in the actual world. "Counterfactual Fairness" compares outcomes in a world where $A$ was different. These yield different prescriptions.
  *   **Status:** **[NON-NEGOTIABLE]**. Without a specified baseline, "fairness" is undefined.

  **7. Cost Sensitivity (Error Weighting)**
  *   **Requirement:** The theory must explicitly weight False Positives (Type I) vs. False Negatives (Type II).
  *   **Motivation:** In medical triage, a False Negative (missing a disease) is worse. In pretrial detention, a False Positive (detaining an innocent person) is arguably worse. A theory that treats errors symmetrically is context-blind.
  *   **Status:** **[NON-NEGOTIABLE]**. Symmetric error weighting is a modeling assumption that rarely holds in high-stakes domains.

  ---

  ### III. Formal Properties Desiderata (The Mathematical Layer)
  *These are the statistical constraints. This is where the impossibility theorems live.*

  **8. Calibration (Sufficiency)**
  *   **Requirement:** For any risk score $S$, the probability of the outcome $Y$ should be the same across groups $A$. ($P(Y|S, A) = P(Y|S)$).
  *   **Motivation:** If a risk score of 0.8 means 80% risk for Group 1 but 50% risk for Group 2, the score is misleading for decision-makers. Essential for utility maximization.
  *   **Status:** **[MODELING CHOICE]**. Highly desirable for efficiency, but conflicts with error balance.

  **9. Error Rate Balance (Independence/Separation)**
  *   **Requirement:** False Positive Rates and/or False Negative Rates should be equal across groups. (e.g., Equalized Odds).
  *   **Motivation:** Ensures that the burden of algorithmic error is not disproportionately borne by a protected group. Essential for egalitarian justice.
  *   **Status:** **[MODELING CHOICE]**. Highly desirable for equity, but conflicts with calibration.

  **10. Base Rate Independence (Demographic Parity)**
  *   **Requirement:** The selection rate should be independent of the protected attribute ($P(\hat{Y}|A) = P(\hat{Y})$).
  *   **Motivation:** Ensures representation and prevents historical disadvantage from perpetuating.
  *   **Status:** **[MODELING CHOICE]**. Often conflicts with accuracy and other fairness metrics if base rates differ.

  **11. Monotonicity / Consistency**
  *   **Requirement:** If an individual's features improve (relative to the task), their outcome should not worsen.
  *   **Motivation:** Prevents perverse incentives and ensures the model is learning the construct, not noise.
  *   **Status:** **[NON-NEGOTIABLE]**. Violating this renders the model arbitrary.

  ---

  ### IV. The Incompatibility Core (The "Impossible" Subset)
  *This is the section that explains why your reading group is stuck. The following subset of desiderata is **jointly unsatisfiable** under non-degenerate conditions.*

  **The Impossibility Triangle**
  Based on the results from **Chouldechova (2017)** and **Kleinberg, Mullainathan, & Raghavan (2016)**, you cannot simultaneously satisfy the following three conditions if the base rates ($P(Y|A)$) differ between groups and the classifier is imperfect:

  1.  **Calibration** (Desideratum #8)
  2.  **Error Rate Balance** (specifically, equal FPR and equal FNR across groups) (Desideratum #9)
  3.  **Prevalence Parity** (The base rates of the outcome are equal across groups)

  *Note: Since we cannot control Prevalence (it is a fact of the world, Desideratum #1), we are left with a hard trade-off between Calibration and Error Rate Balance.*

  **Implication:**
  *   If you prioritize **Calibration** (to ensure risk scores are meaningful for utility), you **must** accept disparate error rates (one group will suffer more false positives).
  *   If you prioritize **Error Rate Balance** (to ensure equitable burden of error), you **must** accept miscalibration (a risk score of 0.8 means different things for different groups).
  *   **You cannot have both.** Any paper claiming to solve this without relaxing one of these definitions is mathematically suspect.

  **The Infra-marginality Problem (Elrod v. Patzert / Corbett-Davies et al.)**
  *   **Conflict:** Group fairness metrics (Desiderata #9, #10) average over the population. They are compatible with **Individual Unfairness**.
  *   **Scenario:** You can satisfy Demographic Parity by randomly approving unqualified candidates from the disadvantaged group and rejecting qualified ones, provided the rates match.
  *   **Implication:** A theory relying *solely* on Group Fairness desiderata violates Individual Fairness intuitions. A theory relying *solely* on Individual Fairness (e.g., Dwork et al.) may violate Group Equity if the similarity metric is flawed.

  **The Causal Hierarchy Constraint (Pearl)**
  *   **Conflict:** Most statistical fairness criteria (Calibration, Parity) operate at **Rung 1 (Association)** of Pearl's Ladder. Counterfactual Fairness operates at **Rung 3 (Counterfactual)**.
  *   **Implication:** You cannot derive Rung 3 fairness guarantees from Rung 1 data. If a theory claims to ensure "no discrimination" (a causal claim) using only observational statistical parity, it contradicts the causal hierarchy.

  ---

  ### V. Synthesis: How to Resolve the Impasse

  The literature feels stuck because it treats these desiderata as **universal truths** rather than **contextual parameters**. To move your reading group forward, you must adopt a **Typological Approach**. An adequate theory of fairness does not pick one criterion; it provides a decision procedure for selecting criteria based on the domain.

  Here is the resolution framework you should apply to future papers:

  **1. The "What is at Stake?" Test (Resolves Desideratum #7)**
  *   **High Cost False Positive (Liberty/Health):** Prioritize Error Rate Balance (specifically FPR). *Example: Pretrial detention.* (Better to let some guilty go free than detain innocents disproportionately).
  *   **High Cost False Negative (Safety/Resource Allocation):** Prioritize Calibration. *Example: Medical Triage.* (Better to over-treat than under-treat; risk scores must be accurate).
  *   **Historical Exclusion (Credit/Hiring):** Prioritize Demographic Parity. *Example: Mortgage lending.* (Goal is access/capital distribution, not just risk minimization).

  **2. The "Decision vs. Prediction" Distinction (Resolves the Impossibility Triangle)**
  *   Many impossibility results assume the algorithm outputs a **risk score** used by a human.
  *   If the algorithm makes the **final decision** (thresholding), you can optimize for a specific utility function that weights group harms differently.
  *   *Resolution:* Abandon the idea that the *predictor* must be fair in isolation. Require that the *decision policy* (Predictor + Threshold) satisfies the context-specific desideratum.

  **3. The "Causal vs. Statistical" Declaration (Resolves the Causal Hierarchy)**
  *   If a paper claims to address "discrimination," demand a causal graph.
  *   If they only offer statistical parity, force the label "Associational Fairness."
  *   *Resolution:* Acknowledge that statistical fairness is a *proxy* for causal fairness, valid only under specific assumptions (e.g., no unmeasured confounding).

  ### Summary of Non-Negotiables vs. Choices

  | Desideratum | Status | Reason |
  | :--- | :--- | :--- |
  | **Construct Validity ($Y$ and $A$)** | **Non-Negotiable** | Garbage in, garbage out. Math cannot fix bad proxies. |
  | **Error Cost Weighting** | **Non-Negotiable** | FP and FN are never morally equivalent in high-stakes domains. |
  | **Impossibility Acknowledgement** | **Non-Negotiable** | A theory must admit which statistical property it is sacrificing. |
  | **Causal Consistency** | **Non-Negotiable** | Cannot claim causal fairness from observational data without assumptions. |
  | **Group vs. Individual Focus** | **Modeling Choice** | Depends on legal/moral framework (e.g., Title VII vs. Moral Individualism). |
  | **Calibration vs. Balance** | **Modeling Choice** | Depends on whether the goal is *accuracy of risk* or *equity of error*. |
  | **Base Rate Correction** | **Modeling Choice** | Do we correct for history (Parity) or accept reality (Calibration)? |

  ### Final Recommendation for the Reading Group

  Stop asking: *"Is this criterion fair?"*
  Start asking: *"Which value conflict does this criterion resolve, and which does it hide?"*

  When you read the next paper, map it onto the **Incompatibility Core**. Ask the authors: *"You satisfy Calibration. Which error rate are you allowing to diverge, and why is that divergence morally acceptable in this specific context?"*

  If they cannot answer that, the paper is contributing to the loop, not breaking it. The way out is not a new formula; it is an explicit political philosophy that justifies the mathematical trade-offs.
