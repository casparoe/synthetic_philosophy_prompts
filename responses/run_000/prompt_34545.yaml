answer: |-
  # Q&A Prep Sheet: Defending Individual Action at EAG

  **Talk Context:** Defending moral significance of individual consumer choices via Expected Utility (thresholds) + Norm Shaping.
  **Audience:** 60% EA-aligned (friendly to EU, interested in norms), 40% Skeptics/Adjacent (think EU is a "cope," worried about causation/credit).
  **Goal:** Provide punchy, 2-minute replies that acknowledge valid critiques without surrendering the core thesis.

  ---

  ### Objection 1: The "Supply Chain Buffer" (The Causal Impotence Objection)
  **Phrasing:** "I get the expected utility math, but it relies on the assumption that there *are* thresholds. In modern global supply chains, inventory is buffered. If I don't buy a chicken, the supermarket just throws one away or sells it at a discount next week. The causal chain is broken before it ever reaches the farmer. If the probability of actually triggering an order adjustment is effectively zero, isn't the EV just zero?"

  **2-Minute Reply:**
  "This is the strongest empirical objection, and it's why we can't rely on intuition alone. You're right that buffers exist, but they aren't infinite. Economic models of inventory management show that orders are placed based on moving averages of sales. While your single purchase doesn't trigger an order *today*, it shifts the data point that triggers the order *eventually*.

  Think of it like a lottery where the ticket costs nothing (or saves you money, in the case of eating less meat). Even if the buffer means the 'threshold' is 10,000 burgers away, your purchase is one ticket in that draw. The expected value calculation holds as long as the probability isn't *literally* zero. Empirical work by economists like Harish Sethu suggests that for every X animals not bought, Y are not bred, where the ratio is messy but non-zero.

  However, I'll concede this: The *direct* causal impact is much smaller than naive intuition suggests. That's actually why I lean heavily on my second argument: norm shaping. Even if the supply chain is perfectly buffered against your one burger, your choice signals to your social network that vegetarianism is viable. That social signal has a much higher probability of causing downstream change than the supply chain mechanism. So, if the buffer objection kills the direct EV, it just forces us to rely on the normative EV, which is often larger anyway."

  *   **Where this reply is weakest:** It relies on economic models that are hard to verify in real-time. If the buffer is truly dynamic and perfect, the probability *is* zero.
  *   **Concession to make:** Concede that the direct causal chain is much "noisier" and less direct than people think. Don't fight for the "one burger = one chicken saved" heuristic; fight for "one burger = non-zero probability of affecting future orders."

  ---

  ### Objection 2: The "Opportunity Cost" (The Effective Altruism Objection)
  **Phrasing:** "Even if the EV is non-trivial, it's still tiny compared to donating the money to AMF or working on policy. If I spend 20 minutes cooking a veg meal instead of working, or spend $50 on organic meat instead of donating it, haven't I failed the effectiveness test? Isn't defending individual action just a way to avoid doing the *most* good?"

  **2-Minute Reply:**
  "This is the core EA critique, and I take it seriously. If we view individual action as a *substitute* for high-impact altruism, you're absolutely right. Donating to effective charities almost always has a higher expected return than tweaking your consumption.

  But this presents a false dichotomy. We aren't choosing between 'being vegetarian' and 'donating to AMF.' We can do both. The question is whether individual action has *positive* moral value, not whether it has the *highest* marginal value.

  Furthermore, individual action often serves as a gateway to deeper engagement. People rarely jump straight to donating 10% of their income without first adopting a lifestyle identity aligned with those values. The 'cost' of the veg meal isn't just the money; it's an investment in your own moral identity that sustains long-term altruism. If avoiding flights makes you more sensitive to climate policy, leading you to lobby or donate more effectively later, the ROI changes.

  I will concede: If individual action *crowds out* systemic work—if you feel virtuous from recycling and therefore stop caring about carbon taxes—then it's net negative. My claim is only that these actions are *significant*, not that they are *sufficient* or *optimal*."

  *   **Where this reply is weakest:** It admits individual action is sub-optimal, which undermines the "moral significance" claim for hardline maximizers.
  *   **Concession to make:** Concede that individual action is rarely the *most* effective thing you can do. Frame it as a complement to, not a competitor with, direct altruism.

  ---

  ### Objection 3: The "Double Counting" (The Credit Objection)
  **Phrasing:** "You mentioned the threshold argument. But here's the problem: If 10,000 people buy a ticket expecting to be the threshold winner, only one of them actually *is*. If we all calculate our EV based on the full value of the outcome, we're collectively deluding ourselves about the total good being done. If I'm the millionth signer on a petition, do I get credit for the policy change? It feels like we're inflating the moral math."

  **2-Minute Reply:**
  "This is a sophisticated point about causal attribution. The worry is that if we all claim the 'threshold impact,' we're counting the same good 10,000 times.

  But Expected Utility doesn't work by dividing the credit; it works by weighting the *risk*. When you buy a lottery ticket, you don't say, 'I only own 1/10,000th of the jackpot.' You say, 'I have a 1/10,000 chance of the *whole* jackpot.' The EV is the same either way.

  In moral terms, your action is a *necessary condition* for the threshold being crossed at that specific moment. Without your specific contribution, the threshold wouldn't have been met *then*. The fact that others also contributed doesn't negate your causal necessity in that specific possible world.

  However, there is a grain of truth here: We shouldn't use this to overestimate the *collective* impact of a group if they aren't coordinating. But for the *individual* deciding what to do, the logic holds. You are buying a ticket in the 'change the world' lottery. The fact that others are also buying tickets doesn't make your ticket worthless, provided the pot (the outcome) is large enough."

  *   **Where this reply is weakest:** It struggles with the intuition that moral credit should be divisible. It sounds like "magic" to claim full credit for a collective outcome.
  *   **Concession to make:** Concede that this creates counter-intuitive results regarding *praise* or *blame*. We might not want to praise every individual equally for a collective win, but that's a fact about our social practices, not about the *goodness* of the consequence itself.

  ---

  ### Objection 4: The "Systemic Distraction" (The Political Objection)
  **Phrasing:** "This feels like a neoliberal cope. Focusing on individual carbon footprints or diet lets corporations off the hook. 100 companies are responsible for 70% of emissions. By telling people their choices matter, aren't you distracting from the only thing that actually works: regulation and policy?"

  **2-Minute Reply:**
  "I hear this often from climate activists, and it's a vital concern. But again, it assumes a trade-off that doesn't have to exist. History shows that policy change rarely happens in a vacuum; it happens when social norms have already shifted.

  Individual action is the R&D department for policy. You can't ban something that nobody is willing to stop doing voluntarily. When individuals adopt low-carbon lifestyles, it signals to politicians that regulation is feasible and won't be electoral suicide.

  Moreover, the '100 companies' stat is misleading. Those companies produce energy *for* consumers. If consumer demand doesn't drop, regulation faces massive resistance. Individual action and policy are feedback loops, not competing strategies.

  I will concede: If the narrative is *only* about individual action, that is harmful. My talk today is about defending the moral value of individual action, not arguing it's the *only* thing that matters. We need both. But dismissing individual action as irrelevant undermines the coalition building necessary to pass the policy you want."

  *   **Where this reply is weakest:** It assumes politicians respond to norms rather than money/lobbying.
  *   **Concession to make:** Concede that corporate lobbying is a massive blocker. Frame individual action as *necessary but not sufficient* for political will.

  ---

  ### The Killer Question (Hope Nobody Asks)
  **Phrasing:** "You're arguing we should act based on Expected Utility, where a tiny probability is multiplied by a huge impact. But in decision theory, when probabilities are that vanishingly small and uncalibratable, the 'Pascal's Mugging' problem arises. How do you distinguish this from believing in magic? If I can just assert a tiny probability of a huge outcome to justify any action, doesn't this framework lose all guiding power? Why isn't this just motivated reasoning dressed up as math?"

  **Why this hurts:**
  This attacks the epistemic foundation of the talk. It suggests the "tiny probability" is a free variable you can manipulate to justify whatever you already wanted to do (motivated reasoning). It challenges whether the EU framework is *action-guiding* or just *post-hoc rationalization*. If you can't rigorously define the probability, the EV is undefined, and the argument collapses into "do what feels right."

  **How to handle it (if asked):**
  Don't try to solve Pascal's Mugging. Acknowledge the constraint.
  *   **Reply:** "That's a fair challenge. The difference is empirical grounding. Pascal's Mugging relies on arbitrary probabilities. My argument relies on market mechanisms and social dynamics where thresholds *do* exist (e.g., product discontinuation, policy tipping points). We aren't positing magic; we're positing standard economic volatility. However, you're right that this requires epistemic humility. We shouldn't treat these probabilities as precise. That's why the 'norm-shaping' argument is the safety net: even if the market threshold probability is unknowable, the social signal probability is observable. If the EU math gets too fuzzy, we fall back on the observable normative impact."
