      *   **Stance A (Unification):** Alignment is a single underlying problem (robustly doing what we intend vs. literal specification). Subproblems are artifacts of imprecision.
      *   **Stance B (Pluralism):** Alignment is a cluster of distinct problems with different failure modes/success criteria. Conflation leads to errors (e.g., avoiding specification gaming $\neq$ non-deceptive).
      *   **Requirements:**
