      *   *Marcus's point:* We can build systems that are honest (no deception) but incompetent (bad specification). Or systems that follow specs perfectly (no gaming) but are incorrigible (won't let us turn them off). These require different technical interventions.

  5.  **Drafting the Dialogue (Iterative Process):**
