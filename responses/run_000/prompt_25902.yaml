      *   *Adjustment:* Most "taxation is theft" libertarians oppose *all* taxation beyond the night-watchman state. However, the slogan is often deployed specifically against *redistribution*. I should note that some might accept taxation for courts/police but not redistribution. This adds a layer to the "Entitlement Claim."
      *   *Check:* Is "Trivially True" the right label for the Semantic Stipulation? Yes, if I define theft as "any taking," it's true by definition, but it renders the word "theft" useless for moral distinction.
      *   *Check:* Is the Legal Claim definitely False? Yes, because taxation is authorized by law, theft is defined by law as unauthorized taking.

  10. **Final Polish:** Organize with clear headings. Ensure the "Argumentative Work" section directly answers the prompt's constraint ("without further discussion").

  *(Self-Correction during drafting)*: I need to be careful not to just say "Libertarians believe X." I need to analyze the *claim itself*.
  Also, make sure to highlight *why* the trivial reading fails to do the work (it begs the question).

  Let's finalize the four readings:
  1.  **The Semantic Stipulation:** "Theft" = non-consensual taking.
  2.  **The Legal Category Claim:** Taxation fits the legal crime of theft.
  3.  **The Moral Equivalence Claim:** Taxation is morally as bad as theft.
  4.  **The Pre-Political Entitlement Claim:** You own your gross income; the state owns none of it.

