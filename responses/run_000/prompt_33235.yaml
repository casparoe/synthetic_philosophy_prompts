      *   Key Terminology: Descriptive vs. Substantive representation, i.i.d., Law of Large Numbers, Deliberative Democracy, Principal-Agent problem.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the competence argument? *Yes, under "Expertise" and "Smuggled Features".*
      *   *Check:* Did I address the capture argument? *Yes, under "Interaction" and "Lobbying".*
