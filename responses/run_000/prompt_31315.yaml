          *   *Wait, one more nuance:* The argument relies on "Lumpl existed on Monday." If we adopt Perdurantism, "Lumpl" refers to the whole worm. On Tuesday, the *Tuesday segment* of Lumpl exists. Does the *Tuesday segment* of Goliath exist? Yes. Are they identical? Yes. Did the *whole worm* exist on Monday? Yes. Did the *whole worm* of Goliath exist? No. So (6) holds. So Perdurantism *also* leads to coincidence of temporal parts.
