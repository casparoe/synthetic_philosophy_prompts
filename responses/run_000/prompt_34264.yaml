answer: |-
  The utilitarian-deontological dichotomy is a philosophical luxury your group cannot afford. It assumes we know what the options are and that the disagreement is solely about the evaluation function. In reality, the engineering bottleneck is not choosing between maximizing welfare or respecting rights; it is handling **uncertainty about which normative framework applies** and **formalizing constraints so they are not easily overridden by probabilistic noise**. If you spend three years arguing about whether a trolley should be diverted, you will have failed. Your comparative advantage lies in formal modelling and normative theory, not in tuning reward models on massive transformers. Therefore, your agenda must focus on the *meta-structure* of moral reasoning that any specific theory (utilitarian or otherwise) must inhabit to be implementable.

  Here is the defended prioritization for your three-year agenda.

  ### 1. The Primary Bottleneck: Metanormative Decision Theory Under Empirical Uncertainty
  **Priority: 1 (Critical)**
  The most upstream question is not "Which theory is correct?" but "How should an agent act when it is uncertain about which theory is correct, *and* uncertain about the empirical consequences of its actions?" Current approaches often treat moral uncertainty as a second-order probability distribution over utility functions. This is insufficient. You need to develop a decision rule that handles non-commensurable theories (e.g., a deontological constraint vs. a utilitarian calculation) without collapsing them into a common currency prematurely. This is upstream of everything because if you cannot aggregate normative uncertainty, picking a specific base theory is irrelevant; the system will fail whenever its confidence in that theory dips below 100% (which is always).

  *   **Tractability:** **High.** This is primarily a problem of formal philosophy and decision theory. It requires rigorous modelling, not massive compute. Your team's mix of philosophical and technical competence is perfectly suited for axiomatic work and simulation of agents under normative uncertainty.
  *   **Revision Trigger:** If you discover that normative uncertainty can be mathematically reduced to standard empirical uncertainty without loss of fidelity, this question dissolves, and you should pivot immediately to implementation.

  ### 2. The Implementation Gap: Formalizing Side-Constraints as Optimization Boundaries
  **Priority: 2 (High)**
  The standard engineering critique of deontology is that "hard constraints" break under real-world noise (e.g., a constraint is violated by a millimeter due to sensor error). The utilitarian critique is that constraints are inefficient. Your group should focus on developing a formal logic of "soft constraints" or "lexical priorities" that can be embedded in an objective function without being tradable for marginal welfare gains. This moves the debate from "rights vs. welfare" to "how do we code inviolability in a probabilistic world?" This is crucial because without this, any deontological alignment is brittle and will be optimized away by a gradient descent process seeking local minima.

  *   **Tractability:** **Medium.** This requires bridging formal logic (deontic logic) with control theory or optimization landscapes. It is harder than pure decision theory but well within the scope of a group that can do formal modelling.
  *   **Revision Trigger:** If it is proven that hard constraints are computationally intractable for any agent operating in real-time continuous environments, you must deprioritize this and focus on "penalty-based" approximations instead.

  ### 3. The Dynamic Problem: Normative Robustness Under Distributional Shift
  **Priority: 3 (Medium)**
  AI systems will face novel situations where their training distribution does not match the deployment context. The question is: how should the system's normative weights update when it encounters a scenario that violates its prior moral assumptions? Most alignment work assumes static values. You should investigate "normative drift"—when is it permissible for an AI to revise its own moral principles in light of new evidence, and when is that drift a failure? This is downstream of the first two questions but essential for long-term deployment.

  *   **Tractability:** **Medium.** This requires some experimental work (simulating agents in shifting environments) and philosophical modelling. It is riskier than the first two because "normative drift" is ill-defined.
  *   **Revision Trigger:** If empirical work shows that current RLHF methods implicitly solve normative robustness better than explicit normative modelling, you should lower this priority and focus on auditing those implicit solutions.

  ### Deprioritized Areas
  You should explicitly **avoid** two categories of questions. First, **specific applied case studies** (e.g., "Should a self-driving car swerve?"). These are downstream instances. Solving the meta-decision theory solves the case; studying the case does not solve the theory. Second, **large-scale empirical alignment experiments**. You are not an ML lab. Trying to compete on training models to see if they "behave deontologically" is a resource sink that will yield shallow results. Leave the empirical tuning to the big labs; your job is to give them the mathematical specifications they are currently lacking.

  ### Summary of Strategic Direction
  Your group's value proposition is **specification, not training**. Do not try to build the aligned AI; try to write the mathematical specification that an aligned AI *would* satisfy. If you can produce a formal framework for handling moral uncertainty and non-tradable constraints, you will have provided the necessary scaffolding for the engineering teams to actually build something safe.

