answer: |-
  This is a classic and very deep puzzle. You have stumbled upon **Douglas Hofstadter's argument for "Superrationality,"** which he popularized in his *Metamagical Themas* columns in the 1980s.

  The short answer is: **You are not cheating.** Your intuition that there is a difference between "strangers" and "exact copies" is supported by modern developments in decision theory.

  Here is the breakdown of where the argument breaks, which step to reject, and how to distinguish between strangers and copies without being inconsistent.

  ### The Battleground: Step (5)

  The argument you listed is logically valid *if* you accept the hidden assumption in Step (5).

  > **(5) So each player should think: if I stay quiet, my partner will too...**

  This is the controversial move. This step assumes that your choice **controls** or **determines** the other player's choice.

  *   **Standard Game Theory (Causal Decision Theory)** says: **Reject Step (5).**
      Even if we are identical rational agents, my physical act of pressing "Cooperate" does not causally reach across the table and force your hand to press "Cooperate." Your decision is made by your brain; mine by mine. Since you are rational, you will defect regardless of what I do, because defecting is the dominant strategy. Therefore, symmetry leads to **(Defect, Defect)**, not (Cooperate, Cooperate).
  *   **Superrationality (Evidential/Functional Decision Theory)** says: **Accept Step (5).**
      If we are truly identical rational agents facing the same problem, we are effectively running the same algorithm. If the algorithm outputs "Cooperate" for me, it must output "Cooperate" for you. Therefore, I am not choosing *my* move; I am choosing the *output of the algorithm* for both of us.

  ### How to Distinguish Strangers from Copies

  You asked if there is a principled way to keep Step (2) ("they'll pick the same move") for copies but not strangers. **Yes, there is.** The principle is **Counterfactual Dependence.**

  To make a decision, you have to ask a "What if?" question (a counterfactual): *"What would happen **if** I chose to stay quiet?"*

  #### Case A: The Total Stranger
  If you are playing with a stranger, even a rational one:
  *   **The Link:** The only link between you is that you both think similarly.
  *   **The Counterfactual:** If *you* were to magically switch your choice to "Quiet," does that physically change the stranger's brain state? **No.**
  *   **The Result:** The stranger is still going to play their dominant strategy (Rat). You switching to Quiet just changes your payoff from "Medium" (Rat/Rat) to "Worst" (Quiet/Rat).
  *   **Verdict:** You reject Step (5). Symmetry exists, but it results in both of you Ratting. You cannot "choose" the symmetric outcome; you can only choose your move.

  #### Case B: The Exact Copy (Same Code)
  If you are playing against a perfect copy of yourself (or code running on identical hardware):
  *   **The Link:** You are instantiating the same function. $f(input) = output$.
  *   **The Counterfactual:** If *you* compute "Quiet," the copy *must* compute "Quiet." It is not a causal signal; it is a **logical necessity**. You cannot differ from your copy any more than you can differ from yourself.
  *   **The Result:** If I choose Quiet, the copy *necessarily* chooses Quiet. If I choose Rat, the copy *necessarily* chooses Rat. Now the choice is actually between (Quiet/Quiet) and (Rat/Rat).
  *   **Verdict:** You accept Step (5). Because the outputs are logically linked, your decision *does* determine the joint outcome.

  ### Which Step Do You Reject?

  To maintain the standard view for strangers but cooperate with copies, you reject the **universality of the Dominance Principle (Step 6)** in cases of logical dependence.

  *   **For Strangers:** You uphold the Dominance Principle. Ratting is always better *given* the other person's move is fixed.
  *   **For Copies:** You recognize that the other person's move is *not* fixed independently of yours. It is logically dependent. Therefore, the Dominance Principle does not apply because the "whatever the other player does" condition is impossible (they can't do something different than you).

  ### What Does This Cost You?

  If you take this position (which aligns with **Functional Decision Theory**, a modern framework developed by researchers at the Machine Intelligence Research Institute), here is what you "give up":

  1.  **You give up the idea that Rationality always means Nash Equilibrium.**
      In standard game theory, a rational agent *must* defect in a one-shot PD. If you cooperate with a copy, you are violating the standard definition of Nash Equilibrium. You are accepting that "rationality" is more about maximizing utility than following the dominance rule.
  2.  **You accept that "Correlation" is not enough.**
      You have to be rigorous about *why* we are correlated. If we are correlated just because we are both humans, or both economists, that is not enough to cooperate. The correlation must be **subjunctive** (logical). If I change my mind, does the math force the other person to change their mind?
      *   **Stranger:** No. (Defect)
      *   **Copy:** Yes. (Cooperate)
      *   **Psychic Twin:** If you believe a psychic twin is magically linked to you, you cooperate. If you think they just think like you, you defect.

  ### Is It Cheating?

  It is not cheating; it is **specifying the model.**

  The Prisoner's Dilemma assumes **Causal Independence**. The payoff matrix is built on the idea that my column choice does not change your row choice.
  *   When you play a **stranger**, the model holds. Causal independence is true. Defect.
  *   When you play a **copy**, the model breaks. Causal independence is false (logical dependence is true). The standard payoff matrix no longer accurately represents the decision problem.

  ### Summary

  The hole in the argument you were shown is in **Step (5)**. It smuggles in the assumption that your choice *controls* the other player's choice.

  *   **For Strangers:** That assumption is false. Your choice is evidence of theirs, but it doesn't *make* theirs happen. Rationality leads to mutual defection.
  *   **For Copies:** That assumption is true (logically). Your choice *is* theirs. Rationality leads to mutual cooperation.

  You can consistently hold both views by distinguishing between **causal influence** (strangers) and **logical dependence** (copies). This is a sophisticated position, not a cheat. It acknowledges that "rationality" depends on the structure of the connection between the players, not just the payoff matrix.
