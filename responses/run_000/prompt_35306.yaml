answer: |-
  This is an excellent reconstruction of a problem that has kept moral philosophers and decision theorists busy for about 40 years. You have essentially rediscovered the **Paradox of Deterrence** and the debate between **Sophisticated Choice** (standard Rational Choice Theory) and **Resolute Choice** (David Gauthier's response to Kavka).

  Your intuition that there is an equivocation is correct, but it's not exactly between "rational to $\phi$" and "rational to intend." It is deeper: it is about **what counts as a reason** at the time of action, and whether **intention itself can generate reasons**.

  Here is the breakdown of where the argument breaks, the two main ways to fix it, and the "price" you pay for each.

  ---

  ### The Diagnosis: Step (4) is the False Analogy (Unless...)

  Your argument is valid, but Step (4) assumes the **Toxin Case** and the **Promise Case** are structurally identical. They are only identical if you hold a very specific, narrow view of rationality (narrow self-interest without internalized norms).

  **If you keep Premise (1)** (which is the standard "Sophisticated" view in Rational Choice Theory):
  *   **You must reject (6).** You have to accept the Hobbesian conclusion: It is *not* rational to keep a promise on Saturday if the friend has already relied on you and there are no external sanctions (reputation, legal, social).
  *   **The Price:** You have to accept that morality/prudence is purely about external enforcement. Without a "sword" (sanctions), covenants are but words. This saves Rational Choice Theory but makes it normatively sterile.
  *   **Why Step (4) fails here:** In the Toxin case, there is *no* cost to not drinking at $t_2$. In the Promise case, there *might* be costs (guilt, loss of self-respect, reputation damage). If those psychological costs outweigh the exhaustion of moving, then helping *is* rational at $t_2$, and (1) is satisfied.

  **If you want to save (6)** (that keeping the promise is rational even without sanctions):
  *   **You must reject (1).** This is the more philosophically interesting path.

  ---

  ### The Core Conflict: Premise (1)

  Premise (1) is known as the **Simple View of Intention** or a strong version of **Internalism**. It says: *You can only intend to do X if you believe doing X will be optimal when the time comes.*

  Most decision theorists accept (1). Most philosophers of action (like Michael Bratman) reject it, or modify it.

  #### Option A: Reject Premise (1) (The "Resolute Choice" Path)
  This is David Gauthier's solution in *Morals by Agreement*. He argues that rational agents can adopt a **disposition** or a **resolution** that binds their future self.

  *   **The Move:** You argue that it is rational to form an intention at $t_1$ that constrains your choice at $t_2$, even if $\phi$-ing at $t_2$ is not utility-maximizing *at that moment*. The rationality lies in the *policy* of being a resolute chooser, not the specific act.
  *   **Solving the Bootstrapping Worry (Step 7):** You asked: *"If (1) is false... can't I just intend to drink the toxin, get the million, and then not drink it?"*
      *   **The Answer:** No. Even if (1) is false, intention has a **Belief Condition**. You cannot intend to $\phi$ if you believe you will not $\phi$.
      *   In the Toxin case, if you are a "Resolute Chooser," you intend to drink because you have bound yourself. Therefore, you *will* drink. You get the money, and you suffer the pain. You don't get to cheat.
      *   In the Promise case, you intend to help because you are bound by your resolution. Therefore, you help.
  *   **The Price:** You violate **Dynamic Consistency** (a core axiom of standard Rational Choice). You are saying a rational agent can knowingly choose a sub-optimal action at $t_2$ because of a decision made at $t_1$. Standard economists hate this; it looks like magic or pre-commitment without a mechanism.

  #### Option B: Modify Premise (1) (The "Planning Agency" Path)
  Michael Bratman argues that intention is not just a prediction of action, nor is it subservient to moment-by-moment maximization. Intentions are **plan-states** that help us coordinate over time.

  *   **The Move:** It is rational to intend $\phi$ if $\phi$-ing fits into a rational *plan*, even if at $t_2$ the local calculus looks negative. The "reason" at $t_2$ includes "because I intended this earlier." Intention itself provides a derivative reason for action.
  *   **The Price:** You have to expand the theory of rationality beyond simple desire-satisfaction. You need a theory of **Planning Agency**. This is philosophically robust but harder to model in a standard game-theory matrix.

  ---

  ### Addressing Your Specific Worry (Step 7)

  You wrote:
  > *"if (1) is false, doesn't that open the door to the toxin case actually working — you CAN rationally intend to drink the toxin, and then you get the million, and then... you just don't drink it, which seems like a kind of bootstrapping?"*

  This is the crucial fear. Here is why rejecting (1) doesn't necessarily lead to this "free lunch":

  1.  **The Belief Constraint:** To intend to drink the toxin, you must believe you *will* drink it. If you know that at $t_2$ you will be a standard rational maximizer who sees no reason to drink, you *cannot* form the intention at $t_1$. You can't lie to yourself.
  2.  **Resoluteness vs. Sophistication:**
      *   **Sophisticates (Accept 1):** Know they won't drink at $t_2$, so they can't intend at $t_1$. They get no money.
      *   **Resolute Choosers (Reject 1):** Can intend at $t_1$ *because* they commit to ignoring the $t_2$ calculus. But if they successfully intend, they **must drink** at $t_2$. They get the money, but they pay the cost.
      *   **The Cheater (Your Worry):** Intends at $t_1$, gets money, doesn't drink at $t_2$. This is impossible because if they knew they would cheat at $t_2$, they couldn't have formed the sincere intention at $t_1$ (violating the Belief Constraint).

  So, rejecting (1) allows you to get the money (by binding yourself to drink), but it does not allow you to get the money *without* drinking. The "bootstrapping" is only getting the *opportunity* for the money, not the money plus safety.

  ### Summary: Which Step to Reject?

  **Step (1) is the problem.** But rejecting it requires you to choose a "cost":

  1.  **If you reject (1) via Gauthier (Resolute Choice):**
      *   **Gain:** You save the rationality of promises, threats, and resolutions.
      *   **Cost:** You break standard Rational Choice Theory (Dynamic Consistency). You must argue that rationality involves binding your future self.
      *   **Toxin Outcome:** You can intend, you get the money, but you *must* drink the toxin. No cheating.

  2.  **If you keep (1) and reject (4) (Standard RCT):**
      *   **Gain:** You keep standard decision theory intact.
      *   **Cost:** You must admit that without external sanctions (reputation, law), keeping promises is irrational. (The Hobbesian Cost).
      *   **Toxin Outcome:** You cannot intend, you get no money.

  **Recommendation for your class:**
  The strongest philosophical position is to **reject (1)** but clarify that rejecting it does not allow you to evade the cost of the toxin. Argue that **intention is a distinct mental state that creates reasons for future action** (Bratman/Gauthier).

  The equivocation you sensed is in the word **"Rational."**
  *   In Step (2), "Rational" means *local utility maximization*.
  *   In Step (6), "Rational" implies *global agency and integrity*.
  *   Your argument proves that **Local Utility Maximization** is incompatible with **Global Agency**. You have to choose which one defines "Rationality." Most philosophers choose Global Agency; most economists choose Local Maximization.

  If you want to blow your professor's mind: Argue that the Toxin Puzzle proves that **Homo Economicus** (the standard rational agent) is incapable of making promises. Therefore, if we observe people making promises, either they are irrational, or the model of rationality (Premise 1) is incomplete. (This is essentially Amartya Sen's critique of Rational Fools).
