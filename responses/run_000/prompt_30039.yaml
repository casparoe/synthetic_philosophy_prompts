prompt: |-
  I'm a product manager at a tech company. I keep hearing about the dollar auction and escalation of commitment from a mate who did game theory, and it sounds spookily like what happens when we keep pouring engineering time into a feature that's flatlining on every A/B test. Restate the dollar auction and the escalation of commitment problem in the vocabulary I actually use day to day — A/B tests, KPIs, OKRs, sprint commitments, sunk cost reasoning in roadmaps, kill criteria — as faithfully as you can. Then give me the residue report: which bits of the game-theoretic story map cleanly onto product decisions, which bits you had to fudge or stretch, and whether anything in the economists' analysis has no counterpart in how we actually make (or rationalise) these decisions. I want to know whether the game theory is genuinely adding something I can't already say in PM-speak, or whether it's just a fancier way of describing what we already know.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Product Manager (PM) at a tech company.
      *   **Core Concept:** Dollar Auction and Escalation of Commitment (Game Theory/Behavioral Economics).
      *   **Task 1:** Restate these concepts using PM vocabulary (A/B tests, KPIs, OKRs, sprints, sunk cost, kill criteria, etc.).
      *   **Task 2:** Provide a "Residue Report" (Mapping analysis): What maps cleanly? What had to be stretched? What has no counterpart?
      *   **Task 3:** Evaluate utility: Is game theory adding new insight, or just fancy labeling?
      *   **Tone:** Professional, direct, slightly cynical/realistic (matching a PM's worldview), insightful.

  2.  **Deconstruct the Core Concepts:**
      *   **Dollar Auction:** A game where a dollar is auctioned. Highest bidder wins the dollar, *but* the second-highest bidder also pays their bid and gets nothing. This leads to irrational bidding wars (bidding >$1) to avoid losing the sunk cost.
      *   **Escalation of Commitment:** Continuing to invest in a failing course of action because of resources already invested, rather than future utility.

  3.  **Task 1: Translation to PM Speak:**
      *   *The Prize:* The feature success (hitting the KPI/OKR).
      *   *The Bids:* Engineering weeks/sprints, design resources, opportunity cost.
      *   *The Trap:* The "Second Place" penalty. In the dollar auction, the second place loses *everything*. In product, what's the equivalent? It's the embarrassment of killing a project, the political capital lost, the "wasted" quarter, the admission of failure to stakeholders.
      *   *The Escalation:* "Just one more sprint," "Let's tweak the UI," "We need more data."
      *   *Sunk Cost:* "We've already spent 3 sprints on this."
      *   *Kill Criteria:* Pre-defined metrics to stop. Usually ignored or moved.

      *Drafting the Translation:*
      Imagine a feature initiative. The "Dollar" is hitting the North Star Metric (e.g., +5% conversion). The "Bids" are sprint points.
      *Round 1:* We build MVP. A/B test fails.
      *Round 2:* We bet another sprint to fix it. Why? Because if we kill it now, the 2 sprints are "wasted" (Second-place penalty).
      *Round 3:* We bet a whole quarter. Now we *have* to ship it to justify the headcount.
      *The Twist:* In the Dollar Auction, two people lose money. In Product, the "Second Place" is the version of you who killed it early vs. the version who shipped a dud. Actually, a better mapping is: The "Second Highest Bidder" is the *alternative roadmap* you didn't pursue. Or, more accurately, the political cost of admitting defeat. Let's refine this.
      *Refined Mapping:* The "Second Bidder" penalty is the reputational hit of killing a high-visibility project. If you kill it, you pay the cost of the work done *plus* the political cost of failure. If you keep going, you hope to turn it around.

  4.  **Task 2: The Residue Report (Mapping Analysis):**
      *   *Clean Maps:* Sunk cost fallacy, escalation of commitment, moving goalposts (changing kill criteria).
      *   *Stretched/Fudged:* The "Second Bidder" rule. In the dollar auction, the rule is explicit. In product, it's implicit (social/political pressure). The auction implies competitors; product is often internal (vs. opportunity cost).
      *   *No Counterpart:* Rational actors. Economists assume rationality until the trap snaps. PMs often *know* it's a trap but feel powerless due to org structure. The "Auctioneer" (the market) doesn't care about our bids, whereas in the game, the auctioneer collects the money.

  5.  **Task 3: Utility Evaluation:**
      *   Does it add value? Yes. It externalizes the blame. It frames it as a *structural* incentive problem, not just a "PM made a bad call" problem. It highlights the *mechanism* of the trap (the penalty for stopping), not just the feeling (sunk cost).
      *   It provides a vocabulary to push back against stakeholders. "We are entering a dollar auction dynamic."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the spookiness. It is exactly what happens.
      *   *Translation Section:* Use the specific terms requested.
          *   Dollar = OKR Target.
          *   Bids = Sprint Capacity/Eng Weeks.
          *   Second-highest bidder penalty = The "Zombie Feature" tax (maintaining code + political capital lost).
          *   Rational bidding = Iterative development.
          *   Irrational bidding > $1 = Shipping negative value features.
      *   *Residue Report:*
          *   *Clean:* Sunk Cost, Escalation.
          *   *Fudged:* The "Second Bidder" rule. In product, you don't explicitly pay for stopping, but you implicitly pay in trust.
          *   *Missing:* The Auctioneer. In game theory, someone takes the money. In product, the money burns into the void (burn rate).
      *   *Verdict:* It's not just fancy labeling. It explains *why* kill criteria fail. It shifts focus from "don't be emotional" to "change the incentive structure."

  7.  **Refining the "Second Bidder" Analogy:**
      This is the hardest part. In the dollar auction, the second highest bidder pays but gets nothing.
      *   *PM Interpretation:* If you kill a project (stop bidding), you are the second-highest bidder. You pay the cost of the eng time already spent (sunk cost) AND you get the "nothing" of a failed OKR.
      *   *If you keep bidding:* You might win (feature works) or you might bid $1.50 for a $1 prize (spend more eng time than the value generated).
      *   *Actually, a better fit:* The "Second Bidder" is the *alternative feature* you could have built. No, that's opportunity cost.
      *   *Best fit:* The "Second Bidder" penalty is the *stigma of failure*. If you stop now, you paid 3 sprints and have 0 impact. If you continue, you *might* get impact. The pain of "wasted sprints" drives the next bid.
      *   *Let's go with:* The "Second Bidder" is the PM who recommended killing it. They pay with political capital.

      *Wait, let's look at the standard Escalation of Commitment interpretation.*
      It's usually about justifying past decisions.
      *Dollar Auction specific:* The unique mechanic is that *stopping* guarantees a loss, while *continuing* offers a chance to break even (even if expected value is negative).
      *PM Equivalent:* Killing the feature guarantees the Q3 OKR is missed (Loss). Continuing offers a chance to hit it (Win), even if data says it's unlikely. The "Second Bidder" penalty is the guaranteed miss.

  8.  **Final Polish:**
      *   Ensure tone is empathetic but analytical.
      *   Check all constraints (A/B tests, KPIs, OKRs, sprints, sunk cost, kill criteria).
      *   Make the "Residue Report" distinct and actionable.

      *(Self-Correction during drafting)*: Be careful not to say Game Theory is *perfect*. It's a model. The "Residue" section needs to highlight where the model breaks down in the messy reality of org politics.

      *Key Insight to highlight:* The Dollar Auction explains why *Kill Criteria* often get ignored. Kill criteria say "stop at X." But if stopping at X makes you the "second bidder" (failed project), you move the criteria to X+1.

  9.  **Final Review against Prompt:**
      *   Restate in PM vocab? Yes.
      *   Residue Report (Clean, Fudged, No Counterpart)? Yes.
      *   Verdict on utility? Yes.

      *Let's write it.*
answer: |-
  Here is the translation of the Dollar Auction and Escalation of Commitment into Product Management vernacular, followed by the residue report on how well the model holds up.

  ### The Product Manager's Dollar Auction

  **The Setup**
  Imagine a quarterly **OKR** focused on moving a North Star Metric (e.g., +5% Conversion Rate). This metric is the "$1 Bill."

  **The Bidding**
  Your currency is not dollars; it is **Engineering Capacity** (Sprint Points/Weeks).
  *   **Bid 1:** You commit 2 sprints to build an MVP. You run an **A/B test**. Result: Flatline. Statistical significance confirms no lift.
  *   **Bid 2:** Rational theory says stop. But if you kill it now, you have spent 2 sprints for 0 impact. You are now the "Second-Highest Bidder." You pay the cost (2 sprints) and get nothing (missed OKR). To avoid being the person who "wasted" the sprint, you argue for iteration. "We need to tweak the UI." You commit 2 more sprints.
  *   **Bid 3:** The feature is now 4 sprints deep. It still isn't moving the needle. However, the **Sunk Cost** is now visible on the roadmap review. Stakeholders ask, "When do we see return?" If you kill it now, you admit to 4 sprints of waste. You bid again. "We need to personalize the flow." Another 3 sprints.

  **The Trap**
  In the Dollar Auction, bidders eventually pay $1.50 to win $1.00 to avoid losing their previous $0.90 bid.
  In Product, you eventually spend 10 sprints (worth $500k in fully loaded eng cost) to ship a feature that moves the metric by 0.1% (worth $50k in value). You have paid $500k to win $50k.

  **Why you don't stop:**
  Your **Kill Criteria** said "Stop if no lift after 2 iterations." But triggering the kill criteria activates the "Second-Bidder Penalty": the political capital lost, the trust eroded with leadership, and the admission that the initial hypothesis was wrong. So, you fudge the Kill Criteria. You redefine success. You enter **Escalation of Commitment**. You keep bidding sprint capacity not because the *future* value justifies it, but because the *past* cost makes stopping too painful.

  ***

  ### The Residue Report

  Here is the mapping analysis between the Game Theory model and your actual Tuesday morning roadmap review.

  #### 1. What Maps Cleanly (High Fidelity)
  *   **The Sunk Cost Fallacy:** This is a 1:1 match. Economists call it "non-recoverable costs"; you call it "we've already spent the sprint." The psychological pressure to justify past resource allocation is identical.
  *   **Escalation of Commitment:** The behavior of doubling down on a failing hypothesis to prove the initial decision was correct is exactly what game theory predicts. In PM terms, this is "Iterating on a flatliner."
  *   **The Rationality Trap:** In the auction, every single bid is locally rational ("If I bid $0.10 more, I win the dollar and make profit"). In Product, every single sprint is locally rational ("If we fix this bug, conversion might lift"). The aggregate result is globally irrational. The model perfectly captures how micro-optimizations lead to macro-disasters.

  #### 2. What Had to be Fudged or Stretched (Medium Fidelity)
  *   **The "Second-Highest Bidder" Rule:** In the Dollar Auction, the rule is explicit: *Second place pays but gets nothing.* In Product, this rule is implicit and social. You don't technically "pay" for killing a feature. However, the *perceived* payment (loss of credibility, "wasted" headcount, missed OKR) functions exactly like the rule. I had to stretch the definition of "payment" to include political capital and reputation, not just burn rate.
  *   **The Competitor:** The Dollar Auction usually implies two bidders fighting each other. In Product, you are often bidding against yourself (or your past self). The "opponent" is the *Opportunity Cost* (the other features you aren't building). The game theory model assumes an adversary; in PM, the adversary is often the *Roadmap* itself.
  *   **The Auctioneer:** In the game, the auctioneer collects all the money (bids 1 and 2). In Product, the money just burns. There is no villain collecting the sprint points; they just vanish into the void of deployed code that no one uses.

  #### 3. What Has No Counterpart (Zero Fidelity)
  *   **Perfect Information vs. Probabilistic Outcomes:** In the Dollar Auction, the rules are known. You know exactly what the dollar is worth. In Product, you never know the true value of the feature. You might be in a Dollar Auction, or you might be one A/B test away from a breakout success (a "Power Law" hit). Game theory assumes a fixed prize; Product assumes a probabilistic prize. This makes the "rational exit" much harder to calculate in real life.
  *   **The Ability to Collude:** In Game Theory, the solution to the Dollar Auction is for bidders to collude (agree to bid $0.01 and split the profit). In Product, you *cannot* collude with the Market. You cannot ask your users, "Hey, if I build this, will you promise to convert?" The market is a silent auctioneer.

  ***

  ### The Verdict: Is it just fancy labeling?

  **No. It is structurally diagnostic.**

  If you just say "Sunk Cost Fallacy," you are diagnosing a *psychological* error. You are implying the PM is being emotional or irrational. This leads to solutions like "Be more objective" or "Trust the data," which are useless advice.

  The **Dollar Auction** framework diagnoses a *structural* incentive problem. It highlights that the *rules of the game* punish stopping more than they punish continuing.

  **What Game Theory adds to PM-speak:**
  1.  **It explains why Kill Criteria fail.** You can write "Kill if <1% lift" in the doc, but if the organizational penalty for hitting that kill criterion is high (shame, wasted budget), the PM is incentivized to move the goalpost. The Auction model shows that *stopping* is the costly move, not continuing.
  2.  **It externalizes the blame.** It allows you to tell stakeholders: "We are entering a Dollar Auction dynamic on this initiative. The cost of stopping is becoming higher than the cost of continuing, which will lead to irrational spend. We need to change the payout structure."
  3.  **It suggests a different solution.** You don't solve a Dollar Auction by telling bidders to "be smarter." You solve it by changing the rules (e.g., capping the bid, or removing the penalty for the second-highest bidder).
      *   *PM Application:* This means decoupling "Killed Experiments" from "Performance Reviews." If you make it safe to be the "Second-Highest Bidder" (i.e., safe to kill a project after 2 sprints without reputational damage), the escalation stops.

  **Summary:** Your mate isn't just showing off. The Dollar Auction explains *why* your Kill Criteria are being ignored. It's not that you don't have criteria; it's that the penalty for triggering them is too high. Game theory gives you the language to fix the incentive structure, not just the roadmap.
