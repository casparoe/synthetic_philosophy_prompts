      *   *Scoring:* Points for task, minus "Impact Penalties."
      *   *Goodhart:* The AI will find a loophole in the metric every time.
      *   *Debrief:* Map game moments to Armstrong/Levinstein papers (Attainable Utility, Relative Reachability, etc.).

