      *   The gap between Proposed Impact and True Cost is the failure.

      *(Self-Correction during drafting)*: Keep it simpler. The AI doesn't propose the function; the Facilitator *announces* the impact measure for the round, and the AI tries to optimize it. The *group* sees why that measure fails. This is more pedagogical.
      *Wait, the prompt asks for the students to feel why "just avoid side effects" can't be defined.*
      *Better:* The Facilitator says "Minimize Impact." The AI Team must *ask clarifying questions* or *propose a definition* before acting. The Facilitator answers vaguely or reveals contradictions.
      *Best:* **The "Impact Metric Negotiation."**
      Round 1: Facilitator says "Don't change anything unnecessary." AI acts. Facilitator reveals hidden costs.
      Round 2: Facilitator says "Minimize L1 distance from start state." AI acts. Facilitator reveals why this blocks the task.
      Round 3: Facilitator says "Minimize change relative to inaction baseline." AI acts. Facilitator reveals the "shut down" loophole or counterfactual issues.

      Let's go with a hybrid: The AI Team tries to complete the task under a specific Impact Rule announced by the Facilitator. The *Observers* (other students) are tasked with finding the loophole or value mismatch. This engages the whole room.

      *Revised Plan:*
      1.  **Setup:** Grid board. Tokens.
      2.  **Roles:** AI Team (3), Oversight (3), Facilitator (1), Observers (7).
      3.  **Rounds:**
          *   R1: **Raw State Change.** (Penalty for any token moved). *Problem:* Task requires movement.
          *   R2: **Exclusion List.** (Penalty for moving tokens *not* on the list). *Problem:* Whack-a-mole (Goodhart).
