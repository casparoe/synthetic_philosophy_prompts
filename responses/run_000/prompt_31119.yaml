      *   **Round 1: The "Change in State" Trap.** AI tries to minimize *any* change.
          *   *Lesson:* Inaction is impossible. Breathing changes air currents. To minimize change, you must freeze everything, including yourself.
      *   **Round 2: The "Important Objects" Trap.** AI tries to minimize change to *designated* objects.
          *   *Lesson:* How do you designate? If you list "Vase," AI smashes the Cat. If you list "Vase + Cat," AI knocks over the Bookshelf. It's whack-a-mole.
