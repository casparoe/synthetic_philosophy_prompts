      *   *Improvement:* We need to make the *definition of impact* the contested object, not just the outcome. The "Robot" needs to propose a *measure* of impact, not just an action. Or, the "Human" needs to struggle to define what counts as impact without revealing values.
      *   *Decision:* Stick close to the user's "Box in Cluttered Room" intuition but formalize it to highlight the *measurement* problem. Let's make it a "Pen-and-Paper + Props" hybrid to save time and focus on the *logic* rather than dexterity. Actually, physical props are better for "side effects." Let's keep the physical aspect but add a "Impact Metric Proposal" phase.

  3.  **Drafting the Game Design:**
      *   **Title:** "The Impact Penalty Protocol."
