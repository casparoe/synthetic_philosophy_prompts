      *   *Game Theory:* In a one-shot game with common knowledge of rationality, the Nash Equilibrium is actually *not* to bid at all (or bid 5 cents and stop, depending on specific variants). However, once the game *starts* and bids accumulate, backward induction fails if players are already trapped.
