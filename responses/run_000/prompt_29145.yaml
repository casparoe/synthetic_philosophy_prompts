answer: |-
  This is a classic debate in game theory and behavioral economics, and both your friends have put their fingers on different parts of the elephant. Liam is arguing from the perspective of **external validity** (does this model match the real world?), while Maya is arguing from **internal validity** (does the logic hold within the model's rules?).

  Here is a move-by-move breakdown of who is right, where they go wrong, and the verdict on the structural vs. psychological question.

  ### Move 1: The "Idiots" vs. "Local Rationality" Claim

  > **Liam:** "The whole thing depends on the two bidders being idiots who can't see two steps ahead... The fact that the model says they rationally *shouldn't* stop just means the model is broken."
  > **Maya:** "That's the whole point though — each individual step *is* rational. If you've already bid 95 cents and I bid a dollar, I'm facing a certain loss of 95 cents if I quit versus a chance to break even if I bid $1.05."

  **Who is right:** **Maya.**
  **Where Liam goes wrong:** Liam is conflating *ex-ante* rationality (before the game starts) with *ex-post* rationality (once you are in the trap).
  *   **Ex-ante:** Liam is correct that a perfectly rational player with common knowledge of the other's rationality should never bid, or bid 5 cents and stop. The Nash Equilibrium of the Dollar Auction is essentially "don't play."
  *   **Ex-post:** However, once the game is underway (perhaps due to an error, a thrill-seeking opening bid, or bounded rationality), Maya is correct. At any specific node, bidding $1.05 to lose 5 cents is strictly better than quitting to lose 95 cents. This is not "stupidity"; it is **loss minimization**.
  *   **The Error:** Liam claims the model is broken because it produces escalation. But the model is designed to show how rational local decisions can lead to irrational global outcomes. That isn't a bug; it's the feature.

  ### Move 2: The Sunk Cost Fallacy Definition

  > **Liam:** "Calling that 'rational' because you're comparing it to a loss you've already taken is exactly the sunk cost fallacy."
  > **Maya:** "It's not the sunk cost fallacy... quitting *does* change the outcome — it turns your bid into a pure loss. Bidding again gives you a chance to win the dollar and offset it."

  **Who is right:** **Maya (Technically).**
  **Where Liam goes wrong:** This is the most technical point of the debate, and Liam is misapplying the definition of a sunk cost.
  *   **Standard Sunk Cost:** You spend $50 on a concert ticket. On the day, you are sick. The $50 is gone whether you go or stay. Going to the concert to "get your money's worth" is the fallacy because the money is unrecoverable.
  *   **Dollar Auction Cost:** In the Dollar Auction, the 95 cents you bid is **not** gone regardless of your action. It is only lost *if you quit*. If you bid higher and win, you do not pay the 95 cents (you pay your new bid, and the *other* person pays the 95 cents).
  *   **The Distinction:** The past bid is not a "sunk cost" in the economic sense; it is a **contingent liability**. Your past bid sets the penalty for stopping. Therefore, considering it in your decision matrix is not a fallacy; it is a rational response to the rules. Liam treats the rules like standard economics, but the Dollar Auction specifically violates standard auction rules to create this trap.

  ### Move 3: Credible Signaling and Precommitment

  > **Liam:** "Only if you assume the other guy will definitely keep going. If I credibly signal I'm done after this round, the game ends."
  > **Maya:** "But credible signaling is exactly what the game shows you *can't* do, because once you're in, the other player knows your incentive is to keep bidding."

  **Who is right:** **Maya.**
  **Where Liam goes wrong:** Liam suggests a solution (signaling) without acknowledging the mechanism that makes it fail.
  *   **The Credibility Problem:** In a one-shot game without external enforcement, saying "I will stop" is "cheap talk." Because Maya knows that *if* she bids higher, Liam will face the same loss-minimization logic (lose $1 vs. lose $1.05), she knows his threat to stop is not credible.
  *   **The Insight:** Maya correctly identifies that the trap exists precisely because rational incentives undermine credibility. You cannot signal you will act against your own self-interest in the next round, because once the next round arrives, it *becomes* in your self-interest to continue.
  *   **Liam's Grain of Truth:** Liam is right that *real* humans can sometimes signal credibility through reputation or irrationality (the "madman theory"). If Liam has a reputation for being vindictive, Maya might fold. But that relies on factors *outside* the payoff structure, which supports Maya's broader point that the structure itself doesn't allow for escape.

  ### Move 4: Model Validity vs. Real World Application

  > **Liam:** "Which just proves my point — the model assumes away everything that lets real people escape traps... If your model of rationality says walking away is irrational, your model is wrong."
  > **Maya:** "The claim isn't 'real people always escalate.' The claim is that escalation isn't just a psychological failure — it's built into certain payoff structures. That means you can't fix it just by telling people to be more rational. You need to change the structure."

  **Who is right:** **Maya (on the conclusion), Liam (on the limitation).**
  **Where they meet:** This is the crux of your question: Is escalation structural or psychological?
  *   **Liam's Valid Critique:** He is right that the model is "stripped-down." In the real world, we have contract law, social norms, and the ability to walk away from a bet without paying (unlike the strict rules of the parlor game). If a model predicts people will lose $50 to win $1, and real people don't do that often, the model has low predictive validity for *outcome*, even if it has high validity for *mechanism*.
  *   **Maya's Valid Conclusion:** She wins the philosophical argument. The value of the Dollar Auction isn't to predict that everyone will bid $5 for a dollar. It is to demonstrate that **escalation can occur without psychological dysfunction.**
  *   **The Verdict:** Liam thinks the model is wrong because it doesn't include escape hatches. Maya understands that the model's purpose is to show *why* we need escape hatches. If you believe escalation is purely psychological, the solution is "train people to be calmer." If you agree with Maya that it is structural, the solution is "don't enter contracts with second-place penalties."

  ### Final Analysis: Structural vs. Psychological

  **Maya is substantially more correct.**

  Liam's argument rests on the idea that because real people *can* escape the trap (via precommitment or ignoring the rules), the trap isn't real. That is like saying a mousetrap isn't a real danger to mice because some mice manage to jump over it. The danger is in the mechanism, not the mouse's intelligence.

  **Where Liam is right:**
  He is right that the model lacks **precommitment devices**. In the real world, rational actors *should* precommit (e.g., "I will resign from the project if costs exceed $X") before entering the situation. The Dollar Auction assumes you are already in the game without a precommitment strategy. Liam is correct that a truly rational agent would solve this *before* bidding starts, not during.

  **Where Maya is right:**
  She is right that once the precommitment fails (which it often does in real life—think of the Vietnam War, price wars, or litigation), the escalation is driven by the **payoff structure**, not stupidity.
  *   **Psychological View:** "People escalate because they are stubborn/emotional."
  *   **Structural View (Maya):** "People escalate because the system penalizes quitting more than it penalizes continuing."

  **The Synthesis:**
  The Dollar Auction is not a parlor trick; it is a formalization of the **Sunk Cost Dilemma** where the sunk cost is converted into a liability.
  *   Liam is wrong to call it a "sunk cost fallacy." It is a **marginal cost calculation** where the marginal cost of continuing is lower than the marginal cost of stopping.
  *   Maya is right that this makes it disturbing. If escalation were just psychological, we could solve it with therapy or better decision-making training. If it is structural (as Maya argues), then rational, smart, well-meaning people will *still* escalate unless the rules of engagement are changed.

  **Advice for the next bar trip:**
  Tell them they are describing the difference between **Decision Theory** (Liam: What should a single agent do?) and **Game Theory** (Maya: What happens when agents interact strategically?).
  *   Liam is arguing that the *Decision Theory* answer (walk away) is obvious.
  *   Maya is arguing that the *Game Theory* reality (strategic interdependence) makes the Decision Theory answer inaccessible once the game begins.

  Maya wins the debate because she correctly identifies that the "irrationality" is a property of the **system**, not the **player**. Liam is correct that smart players try to avoid the system, but wrong to imply that avoiding the system proves the system isn't dangerous.
