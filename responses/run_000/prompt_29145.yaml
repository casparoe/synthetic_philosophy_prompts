  *Dollar Auction:* "I bid 95c. If I quit, I lose 95c. If I bid $1.05, I might lose 5c."
  The 95c *is* sunk in the sense that it's paid. But the *rule* says "Second highest pays." So the 95c is a *pending liability* conditional on quitting. If you win, you don't pay the 95c? Wait, no.
  *Rules Check:* "Highest bidder wins and pays their bid, but the second-highest bidder also has to pay their bid and gets nothing."
  If I bid 95c (2nd place) and quit: I pay 95c. Net: -$0.95.
  If I bid $1.05 (1st place) and opponent quits: I pay $1.05, get $1. Net: -$0.05.
