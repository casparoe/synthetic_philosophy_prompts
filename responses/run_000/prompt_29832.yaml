prompt: |-
  I'm a software engineer at a mid-size company and I end up running the postmortem for most of our production incidents — maybe two or three a month. One thing that keeps coming up is whether the incident was caused by something we didn't do: a check we didn't write, a runbook step that got skipped, an alert threshold we never set, a test that was never added. We write these up as causes or contributing factors, and the wording drives what gets fixed and sometimes who gets blamed; in a couple cases our customer contracts have SLA credits tied to the root-cause wording, so its not just an internal label. I have no philosophy background, but a friend of mine does and he says there's a whole literature on causation by omission — whether absences can be causes at all, whether the right test is counterfactual ('would the incident still have happened if we'd done the thing?'), and whether the answer secretly depends on what we expected somebody to do. He says our postmortem fights are basically that debate with a Jira ticket attached.

  What I want is a reusable decision procedure my team can actually run on an incident report — a checklist or flowchart in words — for deciding when an omission should be listed as a cause of an incident. It has to be something an ordinary engineer can run in maybe 20 minutes during a postmortem, without me in the room to explain the theory. It should say what questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says 'not a cause' or 'contributing factor', and where it has to hand the decision to a person because it's a values call rather than a factual one. Please ground it in whatever the philosophy of causation actually knows about omissions, but translated into language we can use: keep the distinctions that survive the translation, and tell me which ones you dropped and why. Then run the procedure on three anonymized cases from our backlog: (1) a database outage where nobody had set a max-connection limit and a runaway query exhausted the pool; (2) an incident where the on-call engineer skipped a step in the runbook that would have caught a bad config before deploy, but the step had been wrong or misleading for months and everyone who had run it recently had skipped it too; (3) an incident where two independent safeguards were both missing — a validation check and an alert — and either one alone probably would have prevented the customer-facing error. I especially want to see a case where the procedure gives an answer my team won't like, and I want you to be honest about what the procedure cannot do — where it's really a management or blame question dressed up as a causal one.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Software engineer running postmortems (2-3/month).
      *   **Problem:** Disagreement over "causation by omission" (e.g., missing check, skipped step, unset alert). This affects fixes, blame, and SLA credits.
      *   **Goal:** A reusable decision procedure (checklist/flowchart) for engineers to use in ~20 mins without philosophical expertise.
      *   **Requirements:**
          *   Grounded in philosophy of causation (specifically omission/causation).
          *   Translated into engineering language (drop jargon, keep distinctions).
          *   Explain what philosophical distinctions were kept/dropped and why.
          *   Apply to three specific cases (DB connections, skipped runbook step, dual missing safeguards).
          *   Include a case where the answer is unpopular.
          *   Be honest about limitations (where it's actually a values/management call).

  2.  **Philosophical Grounding (Causation by Omission):**

      *   *The Core Problem:* If everything that *didn't* happen is a cause, the list is infinite (e.g., "I didn't eat a banana" didn't cause the server crash). We need to filter relevant omissions.
      *   *Key Theories:*
          *   **Counterfactual Dependence:** Would the effect have occurred if the omission hadn't occurred (i.e., if the action *had* been taken)? (Lewis).
          *   **Normative Expectations:** Was there a duty, norm, or expectation to perform the action? (Hart & Honoré, Moore). This distinguishes "I didn't breathe" (normal) from "I didn't save the drowning child" (duty).
          *   **Abnormality/Intervention:** Is the omission an abnormal deviation from the standard course of events?
          *   **Control/Ability:** Could the agent actually have done it?
      *   *Translation Strategy:*
          *   *Counterfactual:* "If we had done X, would Y still have happened?"
          *   *Normative:* "Was X expected/required by our standards?"
          *   *Ability:* "Could we reasonably have done X?"
          *   *Dropped:* Metaphysical debates about "negative facts" or "absence as an entity." We care about pragmatic utility for engineering, not ontology.

  3.  **Drafting the Decision Procedure (The "Omission Filter"):**

      *   *Goal:* Binary or trinary output (Cause, Contributing Factor, Not a Cause).
      *   *Step 1: Counterfactual Test.* (Necessary condition). If we did it, would incident stop? If No -> Not a cause.
      *   *Step 2: Ability/Feasibility.* Could we have done it *at the time*? (Knowledge, tools, access). If No -> Contextual Factor (not root cause).
      *   *Step 3: Normative Expectation.* Was it *supposed* to happen? (Documented, standard practice, contract). If No -> Systemic Debt (not specific cause).
      *   *Step 4: Independence/Redundancy.* (For multiple omissions). If another safeguard existed, does this omission matter less?
      *   *Escalation:* If Normative is unclear, it's a Policy Call.

  4.  **Refining the Procedure for Engineering Context:**

      *   Make it a checklist.
      *   Use terms like "Preventative Action," "Standard of Care," "Feasibility."
      *   Define "Root Cause" vs. "Contributing Factor" clearly in this context.
      *   *Crucial distinction:* Distinguish between "Why it happened" (mechanism) and "Why we let it happen" (process). Omissions usually live in the second bucket.

  5.  **Analyzing the Three Cases:**

      *   *Case 1 (DB Max Connections):*
          *   Counterfactual: Yes, limit would stop exhaustion.
          *   Ability: Yes, feature exists.
          *   Norm: Is it standard to set limits? Yes, usually.
          *   *Verdict:* Cause (or strong Contributing Factor).
      *   *Case 2 (Skipped Runbook Step):*
          *   Counterfactual: Yes, step would catch config.
          *   Ability: Yes, step existed.
          *   Norm: Step was wrong/misleading. Everyone skipped it.
          *   *Nuance:* The *omission* (skipping) isn't the cause; the *bad runbook* is the cause. The omission is a symptom.
          *   *Verdict:* Not a cause (of the incident), but the Runbook Quality is the cause. This might be unpopular (engineer feels blamed).
      *   *Case 3 (Two Missing Safeguards):*
          *   Counterfactual: Either would work.
          *   Norm: Both missing.
          *   *Philosophical issue:* Overdetermination. If both are missing, is one a cause? Yes, both are sufficient causes of the failure *in combination with the trigger*.
          *   *Verdict:* Both are Contributing Factors. Root cause is the *system design* that allowed both to be missing.

  6.  **Addressing the "Unpopular Answer" & Limitations:**

      *   *Unpopular:* Case 2. Engineers often want to blame the person who clicked "deploy" without checking. The procedure says "Don't blame the person, blame the process that made the check useless."
      *   *Limitations:* SLA contracts often demand a "human error" or specific technical root cause. The procedure might say "Systemic Risk," but Legal needs "Server Config." This is where the procedure hands off to management.
      *   *Blame vs. Cause:* The procedure filters *causal relevance*, not *accountability*.

  7.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty. Validate the friend's philosophical insight.
      *   **Philosophical Translation:** Briefly explain the concepts (Counterfactual, Normative, Ability) and what was dropped (Metaphysics).
      *   **The Procedure (The Omission Filter):** Step-by-step checklist.
      *   **Application to Cases:** Walk through 1, 2, and 3.
      *   **The Unpopular Truth:** Highlight Case 2.
      *   **Limitations:** Where philosophy ends and policy begins (SLAs, Blame).

  8.  **Self-Correction/Refinement during drafting:**

      *   *Check:* Did I make it too academic? *Fix:* Use engineering terms (Runbook, CI/CD, Guardrail).
      *   *Check:* Is it 20 minutes? *Fix:* Keep questions binary (Yes/No) where possible.
      *   *Check:* Did I address the SLA issue? *Fix:* Explicitly mention in the "Escalation" section that legal/contract terms override philosophical causality.
      *   *Check:* Case 2 nuance. If the runbook was wrong, is skipping it an omission? Philosophically, if the norm is "follow runbook," but the runbook is broken, the *norm* is broken. The omission is justified. I need to make sure the procedure captures "Reasonable Reliance."

  9.  **Final Polish:** Ensure tone is empathetic to the engineer's burden but firm on the logic. (Proceed to generate output).

  *(Self-Correction on Case 3)*: If *either* would have prevented it, are they both causes? In philosophy, this is "preemption" or "overdetermination." If Validation was missing AND Alert was missing. The error happened. If Validation existed, error stops. If Alert existed, error detected (maybe stopped). Both are causes of the *impact*. I need to make sure the procedure doesn't say "Pick one." It should acknowledge both are causal factors, but the *Root Cause* is the lack of Defense in Depth.

  *(Self-Correction on SLA)*: The prompt says SLA credits are tied to wording. I must emphasize that this procedure determines *technical truth*, but *contractual truth* might differ. The procedure needs an exit ramp for "Contractual Designation."

  10. **Final Review against constraints:**
      *   Reusable decision procedure? Yes.
      *   ~20 mins? Yes.
      *   Grounded in philosophy? Yes (Counterfactual, Normative).
      *   Explain dropped/kept distinctions? Yes.
      *   Run on 3 cases? Yes.
      *   Unpopular answer? Yes (Case 2).
      *   Honest about limitations? Yes.

  Let's write it.cw
answer: |-
  This is a classic problem in both reliability engineering and metaphysics. Your friend is right: you are fighting over **causation by omission**. In philosophy, the core problem is that there are infinite things you *didn't* do that would have prevented an incident (e.g., "I didn't unplug the server," "I didn't hire a psychic to predict the bug"). To make omissions useful causes, we have to filter them through **norms** and **expectations**, not just physics.

  Below is a decision procedure grounded in the **Hart & Honoré** and **Lewis** theories of causation, translated into engineering practice. It distinguishes between *mechanical causes* (what broke) and *normative causes* (what we failed to do that we should have done).

  ### Part 1: The Philosophical Translation

  To build this tool, I kept three philosophical distinctions and dropped the rest.

  **What I Kept:**
  1.  **Counterfactual Dependence:** *Would the incident have happened if we had done the thing?* If the answer is "Yes, it still would have broken," the omission is not a cause.
  2.  **Normative Expectation:** *Was there a duty to do the thing?* An omission is only a cause if there was a rule, standard, or reasonable expectation that the action would be taken. (This stops you from listing "I didn't eat a banana" as a cause).
  3.  **Control/Ability:** *Could the agent have reasonably done the thing?* If the tool didn't exist or the knowledge was unavailable, the omission isn't a cause; it's a constraint.

  **What I Dropped:**
  1.  **Metaphysical Ontology:** We don't care if an "absence" is a real entity in the universe. We care if listing it helps prevent recurrence.
  2.  **Moral Responsibility:** Causation $\neq$ Blame. This procedure identifies *causal relevance*, not *accountability*. You can be the cause without being "at fault" (e.g., a missing feature that didn't exist yet).
  3.  **Infinite Regress:** We stop at the "Systemic Control Point." We don't ask "Why was the norm missing?" indefinitely. We stop at the team/process level.

  ---

  ### Part 2: The Omission Filter (Decision Procedure)

  **Timebox:** 20 Minutes
  **Who:** Incident Commander + 2 Engineers involved
  **Output:** Designation of the omission as **Root Cause**, **Contributing Factor**, or **Context**.

  #### Step 1: The Counterfactual Test (The "Would It Help?" Check)
  *Ask:* "If this missing check/step/alert had been in place **at the time of the incident**, would the customer-facing impact have been prevented or significantly reduced?"
  *   **No:** The omission is **Context**. Do not list it as a cause. It is irrelevant noise.
  *   **Yes:** Proceed to Step 2.
  *   **Unsure:** Run a quick simulation or review logs. If still unsure after 5 mins, mark as **Contributing Factor** and move on.

  #### Step 2: The Feasibility Test (The "Could We?" Check)
  *Ask:* "At the specific time the action was required, did the engineer/team have the **tools, access, and knowledge** to perform this action?"
  *   **No:** The omission is **Context**. The *lack of tooling/knowledge* is the Root Cause, not the person's failure to act.
  *   **Yes:** Proceed to Step 3.

  #### Step 3: The Normative Test (The "Should We?" Check)
  *Ask:* "Was there an **explicit or implicit standard** that this action should be taken?"
  *   *Explicit:* Documented runbook, required CI check, defined SLA/SLO.
  *   *Implicit:* Industry standard practice (e.g., setting connection limits), established team habit.
  *   **No (It was ad-hoc):** The omission is a **Contributing Factor**. The Root Cause is "Lack of Standardization."
  *   **Yes (It was expected):** Proceed to Step 4.

  #### Step 4: The Reliance Test (The "Trust" Check)
  *Ask:* "If the action was skipped, was it because the engineer was relying on another safeguard that failed, or because the instruction itself was known to be flawed?"
  *   **Yes (Reliance on broken system):** The omission is **Not a Cause**. The *broken safeguard/instruction* is the Root Cause.
  *   **No (Individual deviation):** The omission is a **Root Cause** (Process or Human).
      *   *Decision:* If the individual deviated without systemic pressure, it is a **Human Factor**. If the system encouraged the deviation (e.g., "speed over safety"), it is a **Process Root Cause**.

  #### Step 5: The Contractual Override (The "SLA" Check)
  *Ask:* "Does our customer contract require a specific wording for credit eligibility?"
  *   **Yes:** You must align the **Public Facing** root cause with the contract, even if this procedure says otherwise. Log the **Internal** cause separately.
  *   **No:** Publish the result from Step 4.

  ---

  ### Part 3: Running the Procedure on Your Cases

  Here is how the filter applies to your backlog.

  #### Case 1: Database Outage (No Max-Connection Limit)
  *   **Counterfactual:** If a limit existed, would the pool exhaust? **No.** (The runaway query would fail, but the DB stays up). -> *Pass.*
  *   **Feasibility:** Could they set a limit? **Yes.** It's a standard config parameter. -> *Pass.*
  *   **Normative:** Is it standard to set limits? **Yes.** It is industry best practice for DB stability. -> *Pass.*
  *   **Reliance:** Did they skip it because of bad docs? **No.** It was simply never configured. -> *Fail.*
  *   **Verdict:** **Root Cause (Configuration Omission).**
  *   **Wording:** "Service failed due to missing database connection limits."
  *   **Why:** This is a "clean" omission. It passes all tests. It is a specific, actionable debt.

  #### Case 2: Skipped Runbook Step (Bad Config Deployed)
  *   **Counterfactual:** If the step was run, would it catch the config? **Yes.** -> *Pass.*
  *   **Feasibility:** Could the engineer run the step? **Yes.** -> *Pass.*
  *   **Normative:** Was the step expected? **Technically Yes** (it was in the runbook), **Practically No** (everyone knew it was wrong).
  *   **Reliance:** Did they skip it because the instruction was known to be flawed? **Yes.** The prompt states the step was "wrong or misleading for months and everyone... skipped it."
  *   **Verdict:** **Not a Cause (Symptom).** The Root Cause is **"Runbook Decay / Invalid Verification Step."**
  *   **The Unpopular Answer:** Your team will want to list "Engineer skipped validation step" as the cause. This procedure forbids it. If a safety check is known to be broken, skipping it is a rational adaptation, not a causal failure.
  *   **Action:** Fix the runbook, do not discipline the engineer.

  #### Case 3: Two Missing Safeguards (Validation + Alert)
  *   **Counterfactual:** If Validation existed? **Prevented.** If Alert existed? **Detected/Mitigated.** Both pass.
  *   **Feasibility:** Could both be built? **Yes.**
  *   **Normative:** Were both expected? **Yes.** Defense-in-depth is standard.
  *   **Reliance:** Did they rely on one because the other was missing? **No.** Both were absent.
  *   **Verdict:** **Contributing Factors (Both).** Root Cause is **"Systemic Lack of Defense-in-Depth."**
  *   **Nuance:** Do not list *both* as separate Root Causes. This creates "causal inflation." The Root Cause is the *design philosophy* that allowed a single point of failure (the missing validation) to exist without a backup (the alert).
  *   **Wording:** "Incident impact amplified by missing validation and alerting layers."

  ---

  ### Part 4: Limitations & The "Values Call"

  You asked for honesty about where this procedure fails. It fails in two specific places where philosophy cannot save you from management reality.

  **1. The SLA Trap (Contract vs. Truth)**
  In Case 2, the procedure says "Runbook Decay." However, if your customer contract says credits are only owed for "Undetected Software Defects" and *not* "Process Failures," your Legal team may force you to label Case 2 as a "Software Defect" to pay the credit, or "Human Error" to deny it.
  *   **The Limit:** This procedure determines *technical causality*. It cannot determine *contractual liability*.
  *   **The Fix:** Step 5 (Contractual Override). You must maintain two versions of the postmortem: The **Internal Truth** (for fixing the system) and the **External Truth** (for the contract). Never let the External Truth dictate the Internal Fix.

  **2. The Blame Boundary (Culture vs. Logic)**
  In Case 2, the procedure protects the engineer. But if your company culture demands a "name" for the incident to satisfy leadership, this procedure will be ignored.
  *   **The Limit:** Causation by omission is inherently normative. Deciding *which* norms matter (e.g., "Follow the runbook" vs. "Use common sense") is a management value judgment, not a factual one.
  *   **The Fix:** If leadership pushes back on the "Runbook Decay" conclusion, you must escalate the **Normative Test**. Ask leadership: "Is the norm 'Follow the runbook even if wrong' or 'Ensure the runbook is correct'?" Make them choose the value. Do not accept "Just fix the ticket" as an answer to a causal question.

  ### Summary for your Team

  Print the **Omission Filter**. Put it in your postmortem template.
  *   If it fails the **Counterfactual**, it's noise.
  *   If it fails the **Feasibility**, it's a tooling debt.
  *   If it fails the **Reliance** test (like Case 2), it's a process failure, not a human failure.
  *   If it passes all, it's a Root Cause.

  This won't stop the fights entirely, but it moves the fight from "Who messed up?" to "Which box in the filter did this fail?" That is a much cheaper argument to have.
