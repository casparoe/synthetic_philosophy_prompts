answer: |-
  ### The Argument: Modal Contamination and Derivative Efficacy

  The standard interpretation of Frankfurt-style cases (FSCs) rests on the assumption that moral responsibility is determined solely by the intrinsic properties of the "actual sequence" of events—the specific chain of deliberation, decision, and action that actually occurs. According to this view, if a counterfactual intervener (Black) remains dormant, and the agent (Jones) acts exactly as he would have without Black, then Jones is responsible.

  However, this view relies on a metaphysically impoverished understanding of causation and agency. I argue that the mere presence of the counterfactual intervener vitiates Jones's freedom, not because it removes alternative possibilities (the Principle of Alternative Possibilities), but because it fundamentally alters the **causal status** of Jones's actual decision. Even if Jones is unaware of Black, and even if Black never intervenes, the *structure* of the causation in the actual sequence is rendered derivative rather than original.

  **1. The Derivative Nature of Causal Efficacy**
  For an agent to be morally responsible, their will must be the *ultimate source* of the action. This requires that the efficacy of the agent's will is not contingent upon the permissive inaction of an external guarantor. In a Frankfurt case, the outcome (the specific action) is causally overdetermined by the setup of the scenario. While Black does not physically intervene, the *guarantee* of the outcome is provided by Black's mechanism, not by Jones's will.

  Consider the causal sufficiency of Jones's decision. In a normal free action, the agent's decision is sufficient to bring about the action, and the non-occurrence of the action is a live possibility contingent on the agent's choice. In the FSC, Jones's decision is sufficient to bring about the action *only on the condition* that the external mechanism remains dormant. The inevitability of the action is grounded in Black's setup, not Jones's volition. Jones's will becomes a concomitant cause rather than a determinative cause. He is, metaphysically speaking, "riding along" with a causal current that was secured by an external force. His efficacy is derivative; he acts freely only because Black *allows* him to act freely. This makes Jones's agency subordinate to Black's dispositional power, stripping Jones of the status of "ultimate source."

  **2. Dispositional Causation and Pre-emption**
  Causation is not merely a matter of actual event-event sequences; it involves dispositional properties of the environment. The presence of Black's device introduces a **pre-emptive causal structure**. Even if not triggered, the device functions as a causal "backstop" that defines the modal profile of the actual sequence.

  Imagine a redundant firing system where two switches trigger the same missile. If Switch A (Jones) and Switch B (Black) are both set to fire, and Switch A fires first, Switch B is causally pre-empted. However, the *reason* the missile's launch was inevitable was the presence of Switch B. In the FSC, Jones is Switch A. The causal story of the actual sequence cannot be told without referencing the pre-emptive structure that renders Jones's contribution non-essential to the *outcome's occurrence*, even if it is essential to the *outcome's manner*. If the outcome's occurrence is guaranteed by an external source, the agent's contribution to the *fact* of the action is metaphysically deflated. The action happens *through* Jones, but not *because* of Jones in the robust sense required for responsibility. The "mere presence" of the intervener turns the agent into a conduit for an externally guaranteed inevitability.

  **3. The Contamination of the Actual Sequence**
  The claim that the agent's decision-making process is "exactly the same" is true only regarding intrinsic neurological or psychological states. It is false regarding the **metaphysical identity** of the action. An action is individuated not just by its physical properties, but by its causal history and its modal context.

  The presence of the intervener "modal contaminates" the actual sequence. The actual sequence is not a sealed vacuum; it is embedded in a world where the agent's power is circumscribed by the intervener's disposition. To say Jones is free because the neurons fired the same way is to commit a fallacy of composition regarding agency. Agency is a relational property between an agent and their environment. If the environment is structured such that the agent's will is rendered functionally redundant regarding the outcome, the agent is not the author of the outcome. The "mere presence" changes the action from "Jones's doing" to "The System's doing via Jones."

  ***

  ### Response to the "Actual Sequence" Objection

  The standard reply to the argument above is the **Actual Sequence Objection** (championed by philosophers like John Martin Fischer). This objection holds that moral responsibility is a matter of how the action was actually produced. Since Black never intervenes, the actual sequence contains no coercion, no manipulation, and no deviation from a standard free action. Therefore, the counterfactual intervener is irrelevant to responsibility. The objection asserts: "What matters is what actually happened, not what would have happened."

  **Response: The Modal Constitution of Agency**

  The Actual Sequence Objection fails because it relies on an untenable distinction between the "actual" and the "counterfactual" in the context of agency. It assumes that the properties of the actual sequence are intrinsic to the sequence itself, independent of the modal structure surrounding it. This is false for three reasons:

  **1. Freedom is a Modal Property**
  Freedom is not merely a historical or physical property; it is inherently modal. To say an agent acted freely is to make a claim about the relationship between the agent and the possibilities available to them. It is not enough to say "the agent chose X"; one must be able to say "the agent determined whether X occurred." In the Frankfurt case, the truth condition for "Jones determined whether X occurred" is false, because X would have occurred regardless of Jones's determination.
  The Actual Sequence theorist tries to sever the modal claim from the responsibility claim. They argue you can be responsible even if you couldn't have done otherwise. But if the *reason* you couldn't have done otherwise is an external guarantee (Black), then the *source* of the action's inevitability is external. You cannot isolate the actual sequence from the modal facts that define the agent's control over it. The "actual sequence" is not free-standing; it is a path selected (or seemingly selected) within a landscape. If the landscape is rigged such that only one path is metaphysically open due to external intervention, the nature of the walking on that path is fundamentally altered.

  **2. The "Prisoner in the Open Cell" Analogy**
  Consider a prisoner in a cell where the door is unlocked, but guards are stationed outside with orders to shoot him if he tries to leave. The prisoner stays inside. The Actual Sequence theorist says: "In the actual sequence, the prisoner chose to stay. No guards intervened. He is responsible for staying."
  This is counterintuitive. The prisoner is not responsible for staying because his staying is causally explained by the threat, even if the threat wasn't actualized. The *disposition* of the guards is part of the causal explanation of the prisoner's immobility.
  Similarly, in the FSC, Jones's action is explained by the fact that it was the only action compatible with the causal structure of the world (which includes Black). To ignore Black is to ignore the *cause* of the action's inevitability. If the inevitability is external, the agency is compromised. The Actual Sequence view arbitrarily draws a circle around the neurons firing and says "this is all that matters," while excluding the external facts that made those neurons firing the *only* possible cause of the outcome.

  **3. Causal Explanation Requires Counterfactuals**
  Finally, causal explanation itself relies on counterfactuals. To say "Jones's decision caused the action" implies that "If Jones had not decided, the action would not have occurred." In a Frankfurt case, this counterfactual is false. If Jones had not decided (or decided otherwise), Black would have intervened, and the action would have occurred anyway.
  Therefore, strictly speaking, Jones's decision is *not* the cause of the action's occurrence in the counterfactual sense required for causal efficacy. It is merely a cause of the action's *uncoerced manner*. But moral responsibility attaches to the action's occurrence, not just its manner. If the Actual Sequence theorist admits that Jones is not the cause of the action's occurrence (because it was guaranteed by Black), they must admit Jones is not responsible. If they insist Jones *is* the cause, they must explain how X can be the cause of Y when Y would have happened without X.
  The Actual Sequence Objection attempts to bypass this by saying "causation in the actual world doesn't care about other worlds." But agency *does*. Agency is the power to make a difference. If the setup ensures the agent makes no difference to the outcome, the agent is not an agent in the responsibility-grounding sense, regardless of the intrinsic quality of their deliberation.

  **Conclusion**
  The mere presence of the counterfactual intervener transforms the agent from an originator into a vessel. The causal structure of the case ensures that the agent's will is not the ultimate guarantor of the action. The Actual Sequence Objection fails because it attempts to isolate the mechanics of decision-making from the metaphysical conditions of control. Freedom requires that the agent's will be the modal anchor of the action; in a Frankfurt case, that anchor is held by the intervener. Thus, Jones is not free.
