answer: |-
  # Desiderata for an Adequate Theory of Consent

  An adequate theory of consent must explain how an individual's choice alters the normative landscape—transforming a prohibited act into a permissible one. To be viable, such a theory cannot merely define the word; it must resolve specific moral and legal puzzles. Below are the core desiderata any such theory must satisfy, drawn primarily from **sexual ethics** and **contract law**, with reference to **medical ethics** where illustrative.

  ### 1. The Distinction Between Submission and Consent
  *   **The Requirement:** The theory must distinguish between acquiescence driven by fear or necessity and genuine normative authorization.
  *   **The Case:**
      *   *Sexual Ethics:* Consider the "frozen fright" response, where a victim goes limp or verbally assents to stop a threat of violence without actually desiring the act. A theory must classify this as non-consent, despite the external appearance of agreement.
      *   *Contract Law:* Consider economic duress. If a supplier raises prices by 500% during a shortage and the buyer signs a new contract to avoid bankruptcy, the law often treats this as voidable. The theory must explain why this "agreement" lacks the normative force of a standard market exchange.
  *   **Domain Divergence:** Contract law is more willing to enforce "submission" than sexual ethics. In contracts, if the threat is not *illegal* (e.g., a hard bargain), consent may stand. In sexual ethics, any significant coercive pressure typically vitiates consent entirely.

  ### 2. The Materiality of Deception
  *   **The Requirement:** The theory must specify which lies invalidate consent and which do not. It cannot be the case that *any* falsehood voids agreement, nor that *no* falsehoods do.
  *   **The Case:**
      *   *Medical Ethics:* A surgeon lies about their success rate to induce a patient to undergo surgery (fraud in the inducement) versus a surgeon performing a hysterectomy when the patient consented to an appendectomy (fraud in the factum). The latter is battery; the former is negligence or malpractice. The theory must explain this categorical difference.
      *   *Contract Law:* Selling a car claiming it has "low mileage" (when tampered with) versus selling a car knowing it has a hidden defect not asked about (*caveat emptor*).
  *   **Domain Divergence:** Medical ethics demands a higher standard of disclosure (Informed Consent) than contract law. In contracts, parties are generally expected to investigate; in medicine, the fiduciary relationship places the burden of disclosure on the expert.

  ### 3. The Possibility of Revocation
  *   **The Requirement:** The theory must account for the temporal nature of consent. It must explain how permission can be withdrawn and what happens to actions taken prior to withdrawal.
  *   **The Case:**
      *   *Sexual Ethics:* Consent given at the start of an encounter must be revocable mid-act without penalty. If consent is withdrawn, continued action becomes violation immediately.
      *   *Contract Law:* Once a contract is executed and reliance has occurred (e.g., a builder has poured the foundation), one cannot simply "revoke" consent without liability for breach.
  *   **Domain Divergence:** This is a sharp divergence. Sexual consent is sovereign and ongoing; contractual consent is often binding and forward-looking. An adequate theory must explain why bodily integrity allows for unconditional revocation while economic commitments do not.

  ### 4. The Reliance Interest (Objective Knowability)
  *   **The Requirement:** The theory must explain how a second party can reasonably rely on consent without having telepathic access to the first party's mind.
  *   **The Case:**
      *   *Contract Law:* If I sign a document I haven't read, I am generally bound by its terms. The theory must justify why my external performance binds me even if my internal mental state was ignorant or hesitant.
      *   *Sexual Ethics:* If a partner reasonably interprets silence or lack of resistance as consent, but the other party internally felt coerced, the theory must weigh the reasonableness of the interpretation against the internal reality.
  *   **Domain Divergence:** Contract law prioritizes the *objective* manifestation of assent to ensure market stability. Sexual ethics increasingly prioritizes the *subjective* willingness to ensure bodily autonomy.

  ---

  ### Tensions and Incompatible Desiderata

  There are pairs of desiderata that create significant friction, suggesting that a single, unified theory of consent may be impossible without qualification.

  **Tension A: Sovereignty vs. Security (Desiderata 1 & 4)**
  *   **The Conflict:** To protect **Sovereignty** (Desideratum 1), consent must track the internal mental state of the agent (ensuring submission isn't counted as consent). To protect **Security/Reliance** (Desideratum 4), consent must track external behavior (ensuring partners/contractors can rely on what they see).
  *   **The Problem:** If you prioritize Sovereignty, you make interaction risky (the "Mind-Reading Problem"). If you prioritize Security, you risk validating coercion (the "Coerced Assent Problem"). A theory that maximizes one inherently weakens the other.

  **Tension B: Context-Invariance vs. Domain-Specificity (Desiderata 2 & 3)**
  *   **The Conflict:** Philosophers often seek a **Context-Invariant** definition of consent (what consent *is*). However, the requirements for **Revocation** (Desideratum 3) and **Deception** (Desideratum 2) differ radically between sex and contracts.
  *   **The Problem:** A theory that explains why you can revoke sexual consent but not contractual consent without liability risks becoming merely a description of legal rules rather than a moral theory of consent itself. It suggests "consent" might be a family-resemblance concept rather than a singular normative power.

  ---

  ### The Theory Killer: The Requirement of Simultaneous Subjective Authority and Objective Reliability

  The single requirement that poses the greatest threat to the most popular families of theories (Mental-State, Performative/Communicative, and Hybrid views) is:

  **The Requirement of Simultaneous Subjective Authority and Objective Reliability.**

  This requirement demands that valid consent must *actually* originate from the agent's autonomous will (Subjective Authority) **AND** must be securely accessible to the recipient to guide their actions (Objective Reliability).

  **Justification for Elimination:**

  1.  **Mental-State Accounts (e.g., Hurd, Alexander):** These theories argue consent is purely an internal attitude of will.
      *   *Failure:* They satisfy **Subjective Authority** but fail **Objective Reliability**. If consent is purely mental, a sexual partner or contractor could never know if they have permission without telepathy. This makes normative transformation impossible to act upon safely, violating the reliance interests essential to Contract Law (Desideratum 4).

  2.  **Performative/Communicative Accounts (e.g., Dougherty, Scott):** These theories argue consent is a speech act or social performance.
      *   *Failure:* They satisfy **Objective Reliability** but fail **Subjective Authority**. If consent is purely what is said or signed, a victim saying "yes" to a gunpoint threat counts as consent. This violates the core intuition of Sexual Ethics regarding coercion (Desideratum 1), rendering the theory morally intolerable in high-stakes domains.

  3.  **Hybrid Views (e.g., Miller, Wertheimer):** These theories argue consent requires *both* an internal state and an external expression.
      *   *Failure:* While they attempt to meet both criteria, they fail to explain the **Normative Mechanism** non-arbitrarily. When the internal state and external act diverge (e.g., I say yes but mean no, or I mean yes but say nothing), Hybrids usually stipulate a priority rule (e.g., "external acts trump unless coercion is known"). This stipulation often collapses the view back into one of the pure forms or relies on ad hoc exceptions that vary by domain. They cannot explain *why* the threshold for reliability shifts between a hospital room and a boardroom without abandoning the claim of being a unified theory of consent.

  Therefore, the demand that consent be both privately sovereign and publicly secure simultaneously creates a paradox that no existing family of theories resolves without significant cost to either moral intuition or practical utility.
