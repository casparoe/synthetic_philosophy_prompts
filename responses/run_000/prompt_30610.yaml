prompt: |-
  I'm putting together a unit on the demarcation problem and I keep finding that people argue past each other because they never say what a criterion of demarcation is for or what it has to get right. So before I let students loose on Popper, write me the desiderata: what does any adequate account of the science/pseudoscience line have to deliver, and why.

  For each requirement, give me the case or consideration that forces it. I want the list to be genuinely in the weeds, so make sure it has to grapple with at least these: astrology (which sometimes does make falsifiable-looking claims), homeopathy (which has survived randomized trials it shouldn't have), string theory (mathematically rigorous, empirically empty so far), psychoanalysis (can explain everything), young-earth creationism (very falsifiable, very wrong, and yet clearly not science in the sense we care about), and the fact that chemistry grew out of alchemy and plate tectonics was fringe for decades. Don't just list the cases — say which demand each one imposes on the criterion.

  Also I want you to sort the demands into two piles: the ones that are real requirements any criterion must meet, and the ones that are just hangovers from Popper or the positivists or from the court cases (like: must the criterion be a necessary-and-sufficient condition? must it be statable without any empirical premises? must it classify every historical figure correctly? must it be usable by a judge in a creationism trial?). And tell me which pairs of the real requirements you think can't be jointly satisfied — if the answer is "most of them," then say whether that pushes toward the Laudan line that the problem is a mess and we should stop asking for a single criterion, or toward something weaker.

  Then, briefly, score falsificationism against the list. I don't need a tour of every contender, just enough to see which single requirement cuts deepest against Popper's version and what a Popperian has to give up to survive it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Demarcation Problem (Science vs. Pseudoscience).
      *   **Goal:** Create a list of *desiderata* (requirements) for an adequate account of demarcation.
      *   **Specific Constraint 1:** Explain *why* each requirement exists (the case/consideration forcing it).
      *   **Specific Constraint 2:** Grapple with specific cases: Astrology, Homeopathy, String Theory, Psychoanalysis, Young-Earth Creationism (YEC), Historical transitions (Alchemy $\to$ Chemistry, Plate Tectonics).
      *   **Specific Constraint 3:** Sort demands into two piles: "Real Requirements" vs. "Hangovers" (Popper/Positivism/Legal).
      *   **Specific Constraint 4:** Identify tensions/incompatibilities between real requirements. Discuss implications (Laudan's "mess" vs. weaker alternatives).
      *   **Specific Constraint 5:** Score Falsificationism against the list. Identify the deepest cut and what a Popperian must give up.
      *   **Tone:** "In the weeds," philosophical but practical for a unit plan, avoiding superficiality.

  2.  **Deconstruct the Cases & Derive Desiderata:**
      *   *Astrology:* Makes predictions (some falsifiable-looking). *Demand:* Demarcation can't just be "makes predictions." It needs to account for *how* failures are handled (ad hocery).
      *   *Homeopathy:* Survives RCTs it shouldn't. *Demand:* Demarcation needs to handle empirical failure without immediately excommunicating the field (or needs to explain why it's pseudoscience *despite* some positive trials, likely due to mechanism/plausibility). Actually, the prompt says "survived randomized trials it shouldn't have." This implies a demand about *robustness* vs. *anomaly*. If a theory survives falsification, is it science or pseudoscience? Usually, homeopathy is deemed pseudoscience because the mechanism violates known physics. *Demand:* Connection to established knowledge/coherence.
      *   *String Theory:* Mathematically rigorous, empirically empty. *Demand:* Demarcation can't be purely "current empirical testability" or it kills promising theoretical science. Needs to allow for *potential* testability or theoretical virtue.
      *   *Psychoanalysis:* Explains everything (unfalsifiable). *Demand:* Needs to rule out theories that are compatible with all states of affairs (too flexible).
      *   *YEC:* Very falsifiable, very wrong, clearly not science. *Demand:* Falsifiability alone is insufficient. A lie or a dogma can be falsifiable. Needs to capture *intent* or *methodological naturalism*.
      *   *Alchemy/Plate Tectonics:* Chemistry grew from Alchemy; Plate Tectonics was fringe. *Demand:* Demarcation must be dynamic/historical. It can't permanently banish fields that might mature. It needs to distinguish "bad science" from "not-yet-good science."

  3.  **Drafting the Desiderata (The "Real" vs. "Hangover" Sort):**
      *   *Hangovers:* Necessary & Sufficient conditions (Wittgenstein family resemblance suggests otherwise), Ahistorical/Context-independent (Kuhn suggests otherwise), Legal Usability (McLean v. Arkansas created specific legal criteria, not philosophical truths), Classification of every historical figure (Whig history).
      *   *Real Requirements:*
          1.  *The Dogma Constraint:* Must distinguish science from fixed belief systems (YEC).
          2.  *The Flexibility Constraint:* Must distinguish science from theories that explain everything (Psychoanalysis).
          3.  *The Progress Constraint:* Must allow for immature but legitimate science (Plate Tectonics/Alchemy).
          4.  *The Risk Constraint:* Must require empirical risk (Astrology/String Theory tension).
          5.  *The Coherence Constraint:* Must account for connection to broader knowledge (Homeopathy).

  4.  **Analyzing Tensions (The "Incompatibility" Check):**
      *   *Tension 1:* Progress vs. Risk. To allow Plate Tectonics (Progress), you must lower the bar for empirical risk. To rule out String Theory (Risk), you must raise it.
      *   *Tension 2:* Dogma vs. Flexibility. YEC is falsifiable (Dogma satisfied if we just say "must be true"? No, YEC is false). YEC is falsifiable but dogmatic. Psychoanalysis is unfalsifiable.
      *   *Core Conflict:* The "Static vs. Dynamic" problem. A logical criterion (Popper) struggles with historical development (Kuhn/Lakatos).
      *   *Laudan's Conclusion:* If tensions are too high, the concept is defective.
      *   *Alternative:* Move from "Science vs. Pseudoscience" to "Reliable vs. Unreliable Inquiry" or focus on specific epistemic virtues rather than a binary line.

  5.  **Scoring Falsificationism:**
      *   *Hits:* Psychoanalysis (Unfalsifiable), Astrology (often ad hoc).
      *   *Misses:* YEC (Falsifiable but not science), String Theory (Not currently falsifiable but arguably science), Plate Tectonics (Would have been rejected early on).
      *   *Deepest Cut:* YEC. It shows falsifiability is necessary but not sufficient.
      *   *Popperian Survival:* Must add "sincere attempt to refute" or methodological commitment, moving away from pure logic toward sociology/psychology of science.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I address Homeopathy correctly? The prompt says "survived randomized trials it shouldn't have." This is tricky. Usually, homeopathy is cited as failing trials. If the prompt implies *some* positive results exist (which they do, controversially), the demand is about *weight of evidence* vs. *prior plausibility*. I need to make sure the desideratum captures that demarcation isn't just about *one* trial but integration with background knowledge.
      *   *Check:* Did I distinguish "Real" vs. "Hangover" clearly? The "Necessary & Sufficient" point is crucial. Most modern philosophers think family resemblances are better.
      *   *Check:* Is the tone right? Needs to be instructive for a unit plan. Clear headings.
      *   *Check:* Laudan's point. Larry Laudan's "The Demise of the Demarcation Problem" is the key reference here. I need to ensure his skepticism is represented fairly in the "Tensions" section.

  7.  **Final Structure:**
      *   Introduction: Setting the stage (why desiderata matter).
      *   Part I: The Hangovers (What to discard).
      *   Part II: The Real Demands (The "In the Weeds" list with cases).
      *   Part III: The Tensions (Incompatibilities & Laudan).
      *   Part IV: Scoring Falsificationism.

  8.  **Drafting the Content (Iterative refinement):**
      *   *YEC:* Focus on the *status* of the claim, not just logical form. It's protected from revision.
      *   *String Theory:* Focus on the *timeline* of testability.
      *   *Alchemy:* Focus on *continuity*.
      *   *Homeopathy:* Focus on *mechanism* vs. *phenomenology*.
      *   *Tensions:* The "Static Logic vs. Historical Process" clash is the big one.
      *   *Popper:* The YEC bullet is the killer.

  9.  **Final Review against constraints:**
      *   All cases mentioned? Yes.
      *   Two piles sorted? Yes.
      *   Tensions identified? Yes.
      *   Laudan option discussed? Yes.
      *   Popper scored? Yes.

