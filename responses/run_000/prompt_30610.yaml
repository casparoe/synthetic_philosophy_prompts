answer: |-
  Here is a breakdown of the desiderata for the demarcation problem, sorted by philosophical viability, designed to clarify the ground rules before your students engage with Popper.

  ### Part I: The Hangovers (Discard These)
  These are often treated as requirements, but they are artifacts of mid-20th-century philosophy or legal strategy, not genuine epistemic needs. If your students insist on these, they will argue past the actual problem.

  1.  **The Logical Perfection Requirement (Necessary & Sufficient Conditions)**
      *   *The Demand:* The criterion must be a strict logical definition (e.g., "If and only if $X$, then Science").
      *   *Why Discard It:* This is a positivist hangover. Wittgenstein and later family-resemblance theorists showed that complex human practices rarely have essence-conditions. Demarcation is likely a clustering of virtues, not a binary switch. Insisting on this guarantees failure.
  2.  **The Ahistorical Requirement (Context Independence)**
      *   *The Demand:* The criterion must judge a theory based solely on its logical structure, regardless of time period or community consensus.
      *   *Why Discard It:* This ignores the *Alchemy $\to$ Chemistry* problem. Alchemy was the best available chemistry of its time. A criterion that labels alchemy "pseudoscience" *in 1600* is anachronistic. Demarcation must be sensitive to historical context.
  3.  **The Legal Usability Requirement**
      *   *The Demand:* The criterion must be simple enough for a judge to apply in a courtroom (e.g., *McLean v. Arkansas*).
      *   *Why Discard It:* Courtrooms need binary verdicts (admissible/not admissible); epistemology needs nuance. Legal criteria (like "methodological naturalism") are policy tools, not philosophical truths. Basing philosophy on case law conflates *what science is* with *what the state should fund/teach*.
  4.  **The Whig History Requirement**
      *   *The Demand:* The criterion must correctly classify every historical figure as either "scientist" or "pseudoscientist" according to modern standards.
      *   *Why Discard It:* This forces students to judge the past by present knowledge. It makes it impossible to account for *Plate Tectonics*, which was considered fringe pseudoscience by established geologists for decades before it was accepted. A good criterion must allow for legitimate fringe science.

  ---

  ### Part II: The Real Demands (The "In the Weeds" List)
  These are the genuine epistemic tensions any account must grapple with. Each is forced by a specific case you mentioned.

  #### 1. The Dogma Constraint (Forced by Young-Earth Creationism)
  *   **The Demand:** The criterion must distinguish between a *false scientific claim* and a *non-scientific belief system*.
  *   **The Case:** YEC makes specific, falsifiable claims (e.g., "The earth is 6,000 years old"). This claim is false. If demarcation is just "truth" or "falsifiability," YEC looks like failed science. But it functions as dogma; evidence against it is rejected *a priori* via theological commitment.
  *   **The Requirement:** An adequate account must track the **attitude toward counter-evidence**. Science requires a willingness to revise; pseudoscience protects core tenets from revision regardless of evidence.

  #### 2. The Flexibility Constraint (Forced by Psychoanalysis)
  *   **The Demand:** The criterion must rule out theories that are compatible with every possible state of affairs.
  *   **The Case:** Freudian theory can explain a man loving his mother (Oedipus complex) and hating his mother (reaction formation). If a theory explains $P$ and not-$P$ equally well, it predicts nothing.
  *   **The Requirement:** An adequate account must require **empirical risk**. The theory must forbid certain outcomes. It cannot be purely hermeneutic or retrospective.

  #### 3. The Maturation Constraint (Forced by Alchemy & Plate Tectonics)
  *   **The Demand:** The criterion must distinguish between "dead ends" and "immature science."
  *   **The Case:** Alchemy contained mystical elements but developed laboratory techniques that became Chemistry. Plate Tectonics was rejected by mainstream geology for lack of a mechanism (continental drift) until seafloor spreading was discovered.
  *   **The Requirement:** An adequate account must be **dynamic**. It cannot permanently excommunicate a field based on current anomalies. It must allow for a "protective belt" of anomalies while a field develops, provided there is progress in problem-solving.

  #### 4. The Coherence Constraint (Forced by Homeopathy)
  *   **The Demand:** The criterion must account for consistency with established background knowledge, not just internal consistency or isolated trials.
  *   **The Case:** You noted homeopathy has "survived randomized trials it shouldn't have." (Some meta-analyses show positive effects, though contested). If demarcation relies *only* on "positive RCTs," homeopathy passes. But it violates fundamental physics/chemistry (dilution beyond Avogadro's limit).
  *   **The Requirement:** An adequate account must require **integration**. A claim cannot be evaluated in isolation; it must cohere with the broader web of scientific knowledge unless it offers overwhelming evidence to overturn that web. Pseudoscience often isolates itself from broader theory.

  #### 5. The Horizon Constraint (Forced by String Theory)
  *   **The Demand:** The criterion must not kill theoretical science that is currently untestable but mathematically rigorous.
  *   **The Case:** String theory is empirically empty so far. A strict "current testability" criterion labels it pseudoscience. But it extends established physics mathematically and aims for future testability.
  *   **The Requirement:** An adequate account must distinguish between **principled untestability** (pseudoscience) and **technological untestability** (frontier science). It must allow for a "promise of future contact" with evidence.

  ---

  ### Part III: The Tensions (Where the Problem Breaks)
  Here is the critical philosophical pivot for your unit. These demands pull in opposite directions.

  **The Incompatibility: The Maturation Constraint vs. The Flexibility Constraint**
  *   **The Conflict:** To satisfy *Maturation* (Plate Tectonics), you must allow theories to persist despite lack of empirical risk or current falsifiability (because the tech isn't there yet). To satisfy *Flexibility* (Psychoanalysis) and *Dogma* (YEC), you must demand empirical risk and willingness to abandon the theory.
  *   **The Problem:** If you loosen the risk requirement to save String Theory and Plate Tectonics, you open the door for Psychoanalysis and Astrology to claim they are just "waiting for better tools." If you tighten the risk requirement to crush Astrology, you crush String Theory and historical precursors like Alchemy.

  **The Incompatibility: The Coherence Constraint vs. The Dogma Constraint**
  *   **The Conflict:** *Coherence* says "fit with background knowledge." *Dogma* says "don't protect core tenets." But sometimes science *requires* violating background knowledge (e.g., Quantum Mechanics violated classical causality).
  *   **The Problem:** If you use Coherence too strictly, Homeopathy is out (good), but revolutionary science is stifled (bad). If you rely only on Dogma (willingness to revise), YEC proponents can claim they *are* revising (they tweak flood geology models), blurring the line.

  **The Verdict: Laudan's Line vs. A Weaker Alternative**
  *   **Laudan's Conclusion:** Larry Laudan ("The Demise of the Demarcation Problem") argues these tensions are unresolvable. He suggests the term "pseudoscience" is emotionally laden and philosophically useless. We should stop asking "Is it science?" and ask "Is it reliable inquiry?"
  *   **The Alternative:** If you reject Laudan's nihilism, you must move to a **cluster concept** (like Kuhn or Hacking). You don't look for one criterion. You look for a preponderance of virtues (peer review, openness to critique, connection to background theory, empirical risk).
  *   **Recommendation for Unit:** Push students toward the **Weaker Alternative**. A binary line is a fantasy. Demarcation is a multidimensional space. A field can be "more scientific" or "less scientific" along different axes (methodological rigor vs. theoretical coherence vs. empirical success).

  ---

  ### Part IV: Scoring Falsificationism
  Here is how Popper's specific criterion (Falsifiability) scores against the Real Demands.

  | Desideratum | Score | Analysis |
  | :--- | :--- | :--- |
  | **Flexibility (Psychoanalysis)** | **Pass** | Popper's strongest suit. Freud and Marx explain everything; they are unfalsifiable. Popper correctly identifies the lack of risk. |
  | **Dogma (YEC)** | **Fail** | **The Deepest Cut.** YEC *is* falsifiable ("The earth is 6,000 years old" is a falsifiable statement). Popper's logic cannot distinguish a falsifiable lie from a scientific hypothesis. It misses the *sociological* protection of the core. |
  | **Maturation (Plate Tectonics)** | **Fail** | Early continental drift lacked a mechanism and had conflicting data. Strict falsificationism might have rejected it permanently as "falsified by lack of mechanism." |
  | **Horizon (String Theory)** | **Fail** | String theory is not currently falsifiable. Popper must label it pseudoscience or metaphysics, which alienates working physicists. |
  | **Coherence (Homeopathy)** | **Mixed** | Popper focuses on the logical form of the claim, not its coherence with background physics. A falsifiable homeopathic claim passes, even if physically impossible. |

  **The Popperian Survival Strategy:**
  To survive the **YEC** and **String Theory** objections, a Popperian must give up the idea that falsifiability is a *logical* property of statements. They must shift to **Methodological Falsificationism**.
  *   **What they give up:** The claim that demarcation is purely logical/ahistorical.
  *   **What they adopt:** A normative rule about *behavior*. Science is not about making falsifiable statements; it is about the *decision* to treat statements as falsifiable and to accept refutation when it occurs.
  *   **The Cost:** This moves the demarcation line from the *theory* to the *scientist*. It becomes a sociological/ethical criterion (Are they playing the game honestly?) rather than a logical one. This saves Popper from YEC (YEC proponents refuse to accept falsification) but makes the criterion harder to apply objectively.

  **Summary for Students:**
  Popper solves the Psychoanalysis problem but fails the YEC and String Theory problems. To fix it, you have to turn his logical rule into a behavioral norm. Once you do that, you are no longer doing pure logic; you are doing history and sociology of science. This is why the "single criterion" project is likely doomed.
