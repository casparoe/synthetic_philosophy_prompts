      *   **Setup:** 3 rows of 5 chairs. Close enough to tap shoulders.
      *   **Materials:** 15 cards (Green/Red sides). 1 distinct object (The "Token").
      *   **State:** Green = "Permeable/Active", Red = "Blocked/Inactive".
      *   **Start:** All Red. Token at Student 1 (Front Left). Goal: Get to Student 15 (Back Right).
      *   **Micro-Rules (Printed on cards):**
          1.  You can only hold the Token if your card is Green.
          2.  If you hold the Token, you must pass it to a neighbor who is Green.
          3.  If you are Red and a neighbor holding the Token taps you, flip to Green.
          4.  If you are Green, do not hold the Token, and no neighbor is tapping you, wait 5 seconds then flip to Red.
      *   **Why this works:** The "Green Path" emerges dynamically. It looks like a river forming to carry the boat. But it's just local tapping.
      *   **Time:** 5 mins setup/rules, 10 mins running (multiple runs), 15 mins initial reaction. (Wait, I need 25-30 for activity, rest for debrief).
      *   **Adjustment:** Run it multiple times with slight variations to deepen the feeling.
      *   **Variation 1:** Standard run.
      *   **Variation 2:** Add "Noise" (random flipping).
      *   **Variation 3:** Add "Obstacles" (some students told they can never go Green).

  6.  **Drafting the Debrief:**
      *   Connect the "Green Path" to "Belief/Desire."
      *   Connect the "Tapping/Flipping" to "Neural Firing/Physical Law."
      *   Question: Did the Path cause the Token to move? Or did the tapping cause the path *and* the movement?
      *   Dennett's move: The Path is a "Real Pattern" because it predicts the Token's motion better than tracking individual taps.

  7.  **Identifying Limitations (The "Honest" Part):**
      *   *Teleology:* The students know there is a goal (get token to end). In the brain, neurons don't know the goal. This introduces "hidden global knowledge."
      *   *Consciousness:* Students are conscious agents following rules. Neurons aren't.
      *   *Time Scale:* The macro pattern happens almost as fast as the micro rules. In reality, macro mental states persist longer than micro firings.
      *   *Recovery:* Acknowledge this. The activity is an *analogy* for the structure of causation, not a simulation of consciousness.

  8.  **Final Review against Constraints:**
      *   15 students? Yes (3x5 grid).
      *   75 mins? Yes (30 activity, 45 debrief).
      *   No special materials? Yes (Paper cards, 1 object).
      *   No "Careenium" until after? Yes.
      *   Feel the tension? Yes, the frustration of waiting for a path to open vs. the satisfaction of the flow.

  9.  **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the rules are *strict*. No talking.
      *   Ensure the "Goal" is given to the *class* as a whole, but the *rules* are individual. This creates the "Global Goal vs. Local Rule" tension.
      *   Actually, to make it stronger: Don't tell them the goal is "Get to Back Right." Tell them "The Token must keep moving." Let the pattern emerge without a specific destination, OR tell them the destination but forbid them from planning the route.
      *   *Decision:* Tell them the destination (creates the "Desire" analogue), but forbid communication about the route (forces "Substrate" behavior).
      *   *Wait, better:* If they know the destination, they will cheat (look ahead).
      *   *Strict Dennettian approach:* They should *not* know the destination. They are just physics. The *observer* sees the destination.
      *   *Revised Plan:* Only the Instructor knows the destination. The students are pure substrate. The Instructor places the Token at Start and points to the Goal. Students must just follow rules. This removes the "hidden intention" confound.
      *   *Wait, if they don't know the goal, why do they flip to Green?* Rule 3 says "If tapped." So the Token pushes its way through. The "Goal" is external (the Instructor catching it at the end).
      *   *Okay, let's refine:* The "Desire" is represented by the *Token's persistence*. The "Belief" is the *Green Path*.
      *   *Actually, for the undergrads to feel the "Downward Causation," they need to feel constrained by the pattern.*
      *   *Let's go with the "Traffic" model.*
      *   *Final Decision:* **The "Human Careenium" Protocol.**
      *   Students = Tiles.
      *   Card Color = State (Excited/Resting).
      *   Token = Shiners.
      *   Rules = Local transition rules.
      *   Instructor = External Observer/Environment.

      *(Self-Correction on Debrief Time)*: 75 min class. 30 min activity leaves 45 min debrief. That's plenty. I can afford a 5 min buffer in the activity.

      *(Limitations)*: The biggest issue is that students are *agents*. They choose to follow the rule. Neurons don't choose. I need to highlight this in the "What goes wrong" section.

