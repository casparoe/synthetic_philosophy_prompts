      *(Materials)*: 15 sheets of paper (White/Black sides or Blank/Written). 1 small object (stapler, ball, etc.).

      *(Step-by-Step)*:
      1. Seating (5 mins).
      2. Rule Distribution (5 mins).
      3. Run 1: Smooth flow (5 mins).
