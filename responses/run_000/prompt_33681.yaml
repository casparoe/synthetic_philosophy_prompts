      *   **Addressing the "Real Consequences" issue:** Race is constructed, but *real* because it creates Institutional Facts (Searle). Money is also an Institutional Fact. The difference is Race maps onto perceived biological traits, creating a "naturalized" illusion, whereas Money is openly symbolic. Or, Race is an Interactive Kind where the classification alters life trajectories biologically (allostatic load).
