      *   *Planets:* The user feels Planets are constructed because of the vote. I need to explain why that's "Conventional Demarcation" not "Social Construction" in the heavy sense. The *object* doesn't change when Pluto gets demoted. The *concept* does.
      *   *Race:* The user says Race is constructed but real. I need to emphasize Haslanger's idea: Race is a social position, not a biological type. The "reality" is the social position, not the biology.
      *   *Principle Repair:* Instead of one definition, offer a **Two-Step Test**.
          1.  **Dependence:** Would this exist without humans?
