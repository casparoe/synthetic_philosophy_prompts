answer: |-
  This is an exceptionally clear map of the terrain. You have independently rediscovered several major debates in the philosophy of science and social ontology (specifically the work of Ian Hacking, John Searle, and Sally Haslanger).

  Your current principle breaks because it tries to do too much work with a single binary switch: *Mind-Independent Properties vs. Human Practices.*

  The problem is that "Human Practices" come in two very different flavors:
  1.  **Labeling:** We point at something that exists anyway and give it a name (Planets, Gold).
  2.  **Constituting:** We bring something into existence that wouldn't exist without us (Money, Borders).
  3.  **Interacting:** We label something, and the labeling *changes* the thing itself (ADHD, Race, Gender).

  Your current principle lumps #1 and #3 together as "conventional demarcation," but your gut correctly senses they are different. Pluto doesn't care if it's a planet; a person diagnosed with ADHD often changes their behavior based on that diagnosis.

  Here is the diagnosis of where your principle breaks, the repaired framework, and the application to your new case.

  ### 1. Where Your Principle Breaks

  **The "Planet" Problem:**
  Your principle says: *If there's a mind-independent core but we draw the exact line, that's merely conventional demarcation, not construction.*
  *   **Verdict:** You feel Pluto is "constructed" because the definition was voted on.
  *   **Analysis:** You are right to feel uneasy. The *object* is not constructed, but the *kind* "Planet" is. However, it is a "passive" construction. The IAU vote changed our *maps*, not Pluto. Your principle calls this "merely conventional," which implies it doesn't matter. But in science, conventions matter. The fix is to distinguish between **Ontological Construction** (making the thing) and **Conceptual Construction** (making the category).

  **The "Sex vs. Species" Problem:**
  *   **Verdict:** You want Sex to be "not constructed" and Species to be "not constructed," but you admit both have fuzzy boundaries drawn by humans.
  *   **Analysis:** Your principle struggles here because it treats "drawing the line" as a failure of naturalness. But in biology, "Natural Kinds" often have fuzzy boundaries (the Sorites paradox). A tiger is a natural kind even if we debate whether a liger counts.
  *   **The Fix:** Sex and Species are **Indifferent Kinds**. They exist regardless of whether we classify them. The *binary* applied to sex is a conceptual overlay on a bimodal distribution. The construction lies in the *insistence on the binary*, not the gametes.

  **The "Race vs. Money" Problem:**
  *   **Verdict:** Both are constructed, but Race feels "heavier" or more "real in consequences."
  *   **Analysis:** Your principle doesn't capture *causal power*. Money is an **Institutional Fact** (Searle): it exists only by collective agreement. Race is also a social construction, but it functions as an **Interactive Kind** (Hacking): classifying people by race changes how they are treated, which changes their biology (stress, health outcomes), which reinforces the category. Money doesn't usually change the physical properties of the paper; Race *does* change the physiological properties of the people.

  ### 2. The Repaired Framework: Two Axes

  To save all your verdicts, you need to stop asking "Is it constructed?" and start asking two questions. This creates a 2x2 matrix.

  **Axis 1: Ontological Dependence**
  *   *Does the entity exist without human agreement?*
      *   **Yes:** Gold, Planets, Gametes, Shrimp.
      *   **No:** Money, Borders, "Weeds," Checkmate.

  **Axis 2: Interactive Feedback (The "Looping Effect")**
  *   *Does classifying the thing change the thing?*
      *   **Yes:** ADHD, Race, Gender, Criminality. (If you tell a kid they have ADHD, they get meds/accommodations, changing their brain development/social path. If you classify a group as a "race," they get policed differently, changing health outcomes).
      *   **No:** Planets, Gold, Quarks, Shrimp. (Pluto does not orbit differently because we demoted it).

  ### 3. Re-Sorting Your List

  Here is how your list looks under the repaired framework:

  | Category | Ontologically Dependent? | Interactive Feedback? | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Money** | **Yes** (No value without us) | **Yes** (Inflation/Trust loops) | **Institutional Fact** |
  | **Weeds** | **Yes** (Plant is real) | **No** (Plant doesn't care) | **Functional/Relational** |
  | **Planets** | No (Object is real) | No (Orbit doesn't care) | **Natural Kind + Conventional Boundary** |
  | **Gold** | No (Atom is real) | No (Atom doesn't care) | **Natural Kind** |
  | **Species** | No (Lineage is real) | No (Mostly) | **Natural Kind + Conventional Boundary** |
  | **Sex** | No (Gametes are real) | **Yes** (Via Gender/Social treatment) | **Natural Kind + Conventional Binary** |
  | **Race** | No (No biological subspecies) | **Yes** (High feedback via society) | **Interactive Social Kind** |
  | **Gender** | **Yes** (Roles are made by us) | **Yes** (Identity shapes behavior) | **Interactive Social Kind** |
  | **ADHD** | No (Neurology is real) | **Yes** (Diagnosis changes outcome) | **Interactive Kind** |
  | **Disability** | Mixed (Impairment real, Barrier constructed) | **Yes** (Accommodations change ability) | **Interactive Social Kind** |

  **How this solves your conflicts:**
  *   **Planets:** They are *not* socially constructed in the heavy sense. They are **Natural Kinds with Conventional Boundaries**. You can keep your gut feeling that the *vote* was social, without admitting Pluto itself is a social artifact.
  *   **Sex:** You can maintain Sex is "not constructed" regarding the *biology* (Ontologically Independent), while admitting the *Binary* is a Conventional Boundary. This separates it from Gender (which is Ontologically Dependent).
  *   **Race:** It is Ontologically Independent (there is no "race gene"), but it is **Interactive**. This explains why it is "constructed but real." The construction creates a causal machinery that produces biological effects (health disparities).
  *   **Money:** It is Ontologically Dependent. It vanishes without us. This distinguishes it from Race (which persists via power structures even if we stopped "believing" in it tomorrow, because the structural inequalities remain).

  ### 4. The New Case: ADHD vs. "Jumbo Shrimp"

  You asked for the difference between a psychiatric diagnosis and a purely stipulative category like "Jumbo Shrimp" on a menu.

  **The "Jumbo Shrimp" Category:**
  *   **Ontology:** The shrimp exist without us.
  *   **Boundary:** "Jumbo" is a stipulation (e.g., 16-20 count per pound).
  *   **Feedback:** **None.** If you label a shrimp "Jumbo," it does not grow larger. It does not change its behavior. It does not feel shame or pride.
  *   **Classification:** **Indifferent Kind.**

  **The "ADHD" Category:**
  *   **Ontology:** The neurological traits (attention variance, impulsivity) exist without us.
  *   **Boundary:** The *threshold* for diagnosis is stipulative (how many symptoms? how much impairment?).
  *   **Feedback:** **High.**
      1.  **Self-Concept:** The person understands their struggles differently ("I'm not lazy, I'm neurodivergent").
      2.  **Treatment:** They get stimulants, which physically alter brain chemistry.
      3.  **Institution:** They get extra time on tests, changing their academic trajectory.
      4.  **Looping:** As more people are diagnosed, the definition of "normal attention" shifts.
  *   **Classification:** **Interactive Kind.**

  **The Repaired Principle applied here:**
  > A category is **strongly socially constructed (Interactive)** if the act of classifying the thing feeds back to alter the nature or trajectory of the thing classified.
  > A category is **weakly constructed (Conventional)** if the classification merely labels a pre-existing static property without altering it.

  "Jumbo Shrimp" is weakly constructed (conventional). "ADHD" is strongly constructed (interactive), even though both rely on a biological substrate and a human-drawn threshold.

  ### 5. Summary of the Repaired Principle

  Your original principle was:
  > *A kind is socially constructed iff its unity or boundaries are fixed by human practices... rather than by mind-independent properties.*

  **The Repaired Principle:**
  > **Social Construction comes in degrees based on Dependence and Interaction.**
  > 1.  **Ontological Construction:** The entity *itself* depends on human agreement to exist (Money, Borders).
  > 2.  **Interactive Construction:** The entity exists independently, but the *classification* alters the entity's future path (Race, ADHD, Gender).
  > 3.  **Conventional Demarcation:** The entity exists independently, and the classification *does not* alter the entity (Planets, Gold, Shrimp).

  **What you have to give up:**
  You have to give up the idea that "Constructed" is a single binary switch. You also have to accept that **Planets are not socially constructed** in the same way Money is. They are real objects with human-drawn maps. If you keep calling Planets "constructed," you dilute the word so much that it applies to *everything* (since humans name everything).

  **What you get to keep:**
  *   Race is constructed *and* real (Interactive).
  *   Sex is biological *but* the binary is conventional (Natural Kind + Conventional Boundary).
  *   Money is purely institutional (Ontological Construction).
  *   ADHD is real *and* shaped by diagnosis (Interactive).

  This preserves all your gut intuitions by assigning them to different *mechanisms* of construction, rather than trying to force them all into one definition.
