answer: |-
  **MEMORANDUM**

  **TO:** AI Safety & Ethics Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Beta Policy on Preference Optimization and Autonomy Limits

  **1. Executive Decision**
  For the beta launch, the assistant will optimize for **Verified Stated Preferences**. We will not attempt to compute or optimize for "idealized preferences." Instead, we will treat immediate stated preferences as the ground truth, subject to **Procedural Friction Protocols** for high-stakes actions. The system will never substitute its own judgment for the user's values, but it will delay execution to verify intent when confidence is low.

  **2. Rationale: Addressing the Underdetermination Problem**
  We must take seriously the critique that "idealized preferences" are metaphysically underdetermined and engineeringly uncomputable. There is no loss function for "who the user would be if they knew more." Any attempt to model this grants the AI a blank check for paternalism, defining "better" outcomes based on training data biases rather than user values. This erodes trust and creates unexplainable behavior.

  However, the counter-argument—that pure stated preference enables self-harm via impulse—is also valid. The solution is not to guess the user's "true self," but to distinguish between **signal** (stable intent) and **noise** (impulse/error) within the stated preference model. We do this procedurally (time, confirmation, constraints) rather than substantively (judging the merit of the purchase).

  **3. Operational Policy (Engineering Rule)**
  Effective immediately for beta, engineering will implement the following **Confidence-Gated Execution Rule**:

  *   **Default Mode:** Execute all stated preferences immediately.
  *   **Friction Mode:** If an action exceeds predefined risk thresholds (see below), the assistant must queue the action and request explicit confirmation during a user-defined "Active Window" (e.g., 8 AM – 8 PM).
  *   **Risk Thresholds:**
      1.  **Financial:** Any single transaction >$100 or cumulative daily spend >$300.
      2.  **Communication:** Emails/messages to recipients marked "VIP" or containing sentiment scores indicating high aggression/negativity.
      3.  **Temporal:** Commands issued between 1:00 AM and 5:00 AM local time (unless user overrides this setting).
      4.  **Irreversibility:** Deletion of data or cancellation of recurring subscriptions.
  *   **Override Condition:** The user may bypass Friction Mode for a specific instance via a secondary authentication step (e.g., biometric confirm), logging the event as "User Override."

  **4. User-Facing Explanation**
  The assistant must not claim to know the user "better than they know themselves." The UI explanation for friction events will be:

  > *"This action looks significant. I'm pausing to make sure this matches your intent. You can approve this now or let it wait until you're active."*

  **5. Implementation Timeline**
  *   **Week 1:** Engineering defines risk threshold constants in config.
  *   **Week 2:** UX implements "Queue/Confirm" UI flows.
  *   **Week 3:** Beta testing of friction triggers with internal staff.

  ***

