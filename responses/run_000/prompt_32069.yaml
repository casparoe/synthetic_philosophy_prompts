      *   *Unoccupied Space:*
          *   Q1-No, Q4-No, Q5-Yes? (Infinite Coherentism? Redundant).
          *   Q1-Yes, Q2-No, Q3-Yes? (Externalist Coherentism? Possible but rare).
          *   What about "Finite, Linear, Inferential, but the last belief *is* justified"? That's the contradiction that creates Foundationalism. I need to flag this.

      *   *Awkward Commitments:*
          *   Classical: Most of what we think we know (physics, history) isn't knowledge.
          *   Moderate: Distinguishing basic from non-basic is arbitrary.
          *   Coherentism: Fairy tales can be coherent; isolation objection.
          *   Infinitism: Humans can't hold infinite beliefs.
          *   Skepticism: We know nothing (pragmatically self-defeating).
