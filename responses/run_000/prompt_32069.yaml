      *   Ensure the "Unoccupied Space" diagnosis is philosophically sound.
      *   Check the "Contestable Branch" argument.

      *(Self-Correction during drafting)*: Make sure the distinction between Classical and Moderate Foundationalism is clear. Classical = Infallible/Indubitable. Moderate = Prima facie/Fallible.
