answer: |-
  **To:** The Directors, Kohnstamm Fund for Conceptual Biology
  **From:** [Your Name/Consultant]
  **Subject:** Strategic Priorities for the Units of Selection Problem (3-Year Postdoctoral Investment)

  ### Executive Summary

  The traditional "gene-versus-group" dichotomy is no longer the productive frontier it once was. Mathematical frameworks like the Price Equation have largely settled the question of *whether* multi-level selection (MLS) can be modeled; the remaining disputes concern *causality*, *explanatory privilege*, and the *ontological status* of biological individuals. To rearrange the broader debate, the Fund should invest in sub-questions that bridge conceptual clarity with mechanistic biology.

  Below is a ranked list of six sub-questions. The ranking prioritizes questions that are **upstream** (resolving them clarifies downstream disputes) and **tractable** (amenable to progress within a three-year postdoctoral window using current tools).

  ---

  ### Ranked Sub-Questions

  #### 1. The Causal Efficacy of Collective Fitness
  **Question:** *Under what conditions does collective fitness function as a causal driver of evolutionary change, rather than a statistical summary of lower-level events?*

  *   **(i) Upstream Impact:** This is the foundational ontological question. If collective fitness is merely a statistical aggregate (the "statisticalist" view), then MLS is a bookkeeping method, not a causal theory. If it is causal (the "causalist" view), then groups can be genuine agents of selection. Settling this determines whether "group selection" is a real force or a descriptive lens, impacting how we interpret all MLS models.
  *   **(ii) Tractability:** Highly tractable for a philosopher of biology. It requires interventionist analyses of causation applied to existing evolutionary models (e.g., agent-based simulations where group traits are manipulated independently of individual traits). Recent work in causal modeling (e.g., structural equation modeling in evolution) provides the formal tools.
  *   **(iii) Three-Year Milestone:** To move this **up**, the postdoc must produce a formal proof or simulation demonstrating a scenario where manipulating collective fitness changes evolutionary outcomes without altering individual fitness covariance. To move it **down**, a rigorous demonstration that all such cases reduce to individual-level causal chains without remainder would suggest the question is a pseudo-problem.

  #### 2. Conflict Suppression Mechanisms as Necessary Conditions for Unithood
  **Question:** *Is the active suppression of within-unit conflict a necessary precondition for a new level of selection to emerge, or merely a contingent stabilizer?*

  *   **(i) Upstream Impact:** This addresses the *Major Transitions in Individuality* (MTI). If conflict suppression is necessary, then we can predict where new units *cannot* evolve. It shifts the debate from "who is selected" to "what makes a selectable unit possible." It links the units problem directly to evolutionary developmental biology (evo-devo).
  *   **(ii) Tractability:** Very high. There is rich empirical literature on policing in eusocial insects, germ-soma separation in volvocine algae, and immune systems in multicellular organisms. A philosophical synthesis of these mechanisms is ripe for extraction.
  *   **(iii) Three-Year Milestone:** To move **up**, the postdoc must construct a taxonomy of suppression mechanisms that predicts the stability of the new unit across distinct clades. To move **down**, finding robust cases of high-level selection persisting *without* conflict suppression (e.g., loose aggregations that evolve adaptively) would demote this question.

  #### 3. Inheritance Fidelity Thresholds in Major Transitions
  **Question:** *What is the minimum fidelity of inheritance required for a collective to be considered a unit of selection, and does this threshold vary by ecological context?*

  *   **(i) Upstream Impact:** Selection requires heredity. In transitions (e.g., single cells to multicellular organisms), inheritance shifts from cellular to organismal. Defining the threshold clarifies when a "group" becomes an "individual." This resolves ambiguities in cases like the holobiont or early protocells.
  *   **(ii) Tractability:** Tractable via population genetics modeling combined with conceptual analysis. The postdoc can adapt error-threshold models (Eigen's quasispecies) to the context of unit formation.
  *   **(iii) Three-Year Milestone:** To move **up**, the project must derive a context-dependent fidelity metric that successfully distinguishes between "selectable units" and "transient clusters" in case studies. To move **down**, if fidelity proves to be a continuous variable with no conceptual breakpoint relevant to selection, the question loses its sharpness.

  #### 4. The Holobiont Limit Case
  **Question:** *Does the hologenome concept of evolution hold under strict definitions of inheritance and fitness alignment, or is it a category error?*

  *   **(i) Upstream Impact:** The holobiont (host + microbiome) is the current battleground for the definition of the biological individual. If the holobiont is a unit of selection, the "organism" is dethroned. If it is not, we must explain why it *looks* like one. This tests the limits of the Modern Synthesis.
  *   **(ii) Tractability:** Moderate. Empirical data on microbiome transmission is exploding, but conceptual clarity is lagging. A philosopher can analyze the existing empirical claims for logical consistency regarding inheritance and fitness.
  *   **(iii) Three-Year Milestone:** To move **up**, a definitive argument showing vertical transmission fidelity in specific holobionts is sufficient for selection *independent* of host genetics. To move **down**, evidence that microbiome assembly is entirely environmentally determined (no heredity) would render the question moot.

  #### 5. Explanatory Non-Equivalence of Kin and Multi-Level Selection
  **Question:** *Even if Kin Selection (KS) and MLS are mathematically inter-translatable, are there cases where one framework offers causal explanations the other cannot?*

  *   **(i) Upstream Impact:** The "Equivalence Thesis" (that KS and MLS are just different accounting methods) has led to complacency. If one framework is heuristically superior for specific biological problems, the debate should shift from "which is true" to "which is useful for this problem." This ends the ideological stalemate.
  *   **(ii) Tractability:** High for a philosopher. It requires conceptual analysis of specific case studies (e.g., altruism in microbes vs. vertebrates) to identify explanatory asymmetries.
  *   **(iii) Three-Year Milestone:** To move **up**, the postdoc must identify a concrete biological case where an MLS explanation predicts a mechanism that a KS framing obscures or misses. To move **down**, a demonstration that all explanatory differences are merely psychological (persuasion) rather than epistemic would lower its priority.

  #### 6. The Temporal Persistence Criterion
  **Question:** *How long must a collective persist to qualify as a unit of selection, and does time substitute for fidelity?*

  *   **(i) Upstream Impact:** Some groups (e.g., fish schools) are ephemeral; others (colonies) are persistent. Time might be a proxy for the integration required for selection. This refines the definition of "group."
  *   **(ii) Tractability:** Moderate. Requires phylogenetic comparative methods to estimate group longevity vs. evolutionary change.
  *   **(iii) Three-Year Milestone:** To move **up**, a correlation between group longevity and the evolution of group-level adaptations. To move **down**, if short-lived groups are shown to undergo selection (e.g., viral quasispecies), time is not a necessary criterion.

  ---

  ### Fragility Analysis

  The Directors asked for claims widely accepted in the debate that might not survive the next decade. Two stand out:

  1.  **The Strong Equivalence Thesis:** The claim that Kin Selection and Multi-Level Selection are perfectly equivalent in all explanatory contexts.
      *   *Fragility:* While mathematically interchangeable via the Price Equation, they often posit different causal structures. As biology moves toward mechanistic explanation (not just prediction), the "black box" equivalence may break down.
      *   *Impact on Prioritization:* This justifies keeping **Question #5** on the list, even though it is more philosophical than empirical. It should be funded *because* it threatens a consensus that stifles research. If the equivalence is merely formal, biologists need to know which framework generates better mechanistic hypotheses.

  2.  **The Primacy of Genetic Inheritance:** The claim that high-fidelity genetic replication is the only substrate capable of supporting Darwinian evolution.
      *   *Fragility:* Epigenetics, cultural niche construction, and microbiome transmission suggest inheritance is broader than DNA sequence.
      *   *Impact on Prioritization:* This boosts **Question #3 (Inheritance Fidelity)** and **Question #4 (Holobiont)**. If inheritance is decoupled from the gene, the "unit of selection" may not map onto the "unit of inheritance" in traditional ways. Funding should prioritize questions that decouple these concepts.

  **Recommendation:** A question should indeed be funded partly because it threatens a consensus. Consensus often signals a stagnation point. Question #5 is the primary example here; it is ranked lower than the ontological questions (1 & 2) but higher than it would be in a purely empirical grant call because its resolution would dismantle a theoretical deadlock.

  ---

  ### Self-Criticism and Vulnerabilities

  **What would most undermine this ranking?**
  The ranking assumes that "units of selection" are ontological realities waiting to be discovered (Realism). The most significant undermining finding would be a robust defense of **Instrumentalism**: the argument that "units" are not features of the world but pragmatic tools chosen by the observer based on the specific research question.
  If it were demonstrated that searching for *the* unit of selection is a category mistake—that biology should simply model trait frequency changes without committing to hierarchical agents—then Questions #1, #3, and #6 become philosophical navel-gazing. The funding would be better spent on modeling techniques that ignore unit boundaries entirely.

  **Where is my reasoning least confident?**
  I am least confident in the ranking of **Question #4 (The Holobiont)**. This field is moving empirically faster than conceptually. A major breakthrough in microbiome transmission mechanics next year could render my proposed three-year milestones obsolete. It is possible this question will be settled by empirical data before a philosopher can analyze it, or that the data will be so messy that no conceptual clarity is possible.
  *Contingency:* For a substantially different ordering to be correct, it would have to be true that biologists have already implicitly solved the causal fitness problem (Question #1) through practice, making the philosophical clarification redundant. If practicing evolutionary biologists operate with a unified, unspoken consensus on collective causation, then Question #1 drops to the bottom, and Question #2 (Mechanisms) becomes the clear #1 priority.

  **Conclusion**
  This portfolio prioritizes **causal clarity** (Q1) and **mechanistic emergence** (Q2) over mathematical reformulation. It acknowledges that the math of MLS is settled, but the biology of *how* groups become individuals is not. By targeting the fragility of the Equivalence Thesis and the definition of Inheritance, this investment aims not to answer the old debate, but to make the old debate irrelevant.
