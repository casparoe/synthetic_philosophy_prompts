answer: |-
  Organize the session around establishing ex ante Pareto efficiency as the immutable baseline before introducing private information, because without this baseline, the "no-trade" result looks like a market failure rather than an epistemic consistency condition. This ordering forces the audience to treat trade as the anomaly requiring explanation rather than the norm, which is essential for philosophers grappling with the normative status of markets and economists accustomed to viewing information asymmetry as a friction rather than a logical barrier. By locking in efficiency first, you ensure that when private information is introduced, students cannot appeal to "gains from trade" as a pre-existing possibility; they must instead confront how the act of trading itself consumes the supposed gains through informational leakage. This structure respects the logical dependencies of the theorem while catering to the dual audience: economists see the efficiency constraint, while philosophers see the epistemic constraints on rational action.

  **Session Arc and Dependencies**

  1.  **Minutes 0–20: The Ex Ante Baseline (Efficiency First)**
      *   **Goal:** Establish that before any private signals are received, the initial allocation is ex ante Pareto efficient given common priors.
      *   **Dependency:** This must be established *before* private information is introduced. If you introduce signals first, students will assume trade is naturally beneficial.
      *   **Move:** Define the setting as a closed system of rational agents with a common prior distribution over states. Show that any reallocation of assets before signals arrive cannot make someone better off without making someone else worse off.
      *   **Misconception Head-off:** Address the idea that "private information is a legitimate source of speculative gains from trade" here by asserting that ex ante, no such gains exist because the priors are identical. Speculative gain must come from somewhere else if it exists at all.

  2.  **Minutes 20–40: Information Structure (Priors vs. Knowledge)**
      *   **Goal:** Distinguish between Common Priors and Common Knowledge.
      *   **Dependency:** Must follow the efficiency baseline but precede the trading mechanism.
      *   **Move:** Introduce private signals. Clarify that **Common Priors** means everyone starts with the same probability map, while **Common Knowledge** refers to the structure of what is known about what others know. Agents update via Bayes's rule based on private signals, leading to different posteriors.
      *   **Misconception Head-off:** Address "Common priors means everyone has the same information" here. Explicitly state that agents have different *partitions* (private signals) but the same *measure* (prior). This is where philosophers will need the most clarity on the epistemic logic.

  3.  **Minutes 40–60: The Mechanism (The Offer as Information)**
      *   **Goal:** Demonstrate that the offer to trade is itself a signal.
      *   **Dependency:** Requires both ex ante efficiency and the information structure to be in place.
      *   **Move:** Propose a trade. Ask why the proposer is offering. They must expect to gain. The counterparty knows the proposer is rational. Therefore, the offer reveals that the proposer holds a favorable signal. The counterparty updates on this fact.
      *   **Critical Turn:** This is where the move from "the offer itself is information" becomes available. You cannot make this move until students accept that rationality and priors are common knowledge.

  4.  **Minutes 60–80: The Unraveling and Epistemology**
      *   **Goal:** Show the iterative updating that kills the trade.
      *   **Dependency:** Relies on the "offer as information" move.
      *   **Move:** Walk through the recursion: If I accept, you know I have a signal strong enough to overcome your signal. You update again. I update on your update. The potential gains vanish.
      *   **Misconception Head-off:** Address "The theorem predicts that real markets should show no trade" here. Clarify that the theorem identifies the conditions under which *purely speculative* trade is impossible, not hedging or liquidity-driven trade.

  5.  **Minutes 80–90: Implications and Assessment**
      *   **Goal:** Synthesize epistemological implications and test understanding.
      *   **Move:** Discuss what must be false in the real world for trade to occur (e.g., non-common priors, bounded rationality).

  **The Carrying Example**

  *   **Judgment:** Do **not** use the standard lemons/used-car example.
  *   **Reasoning:** The lemons market (Akerlof) relies on hidden *characteristics* (quality unknown to one party) and adverse selection, whereas Milgrom–Stokey relies on hidden *information* about a common value among rational agents with common priors. Using lemons will conflate adverse selection with epistemic consistency.
  *   **Selected Example:** A **Binary Asset Bet**.
  *   **What it must have:** Two agents, one asset with a value dependent on a binary state (e.g., Will a specific bill pass?), and a clear stake (cash). Both agents know the prior probability of the bill passing. Both receive private, noisy signals about the outcome.
  *   **What it must lack:** Market makers, order books, liquidity needs, or differences in risk aversion. It must be a pure speculative bet between two counterparts to isolate the epistemic logic.

  **Misconceptions and Intervention Points**

  1.  **Misconception:** "Common priors means everyone has the same information."
      *   **Intervention Point:** Minutes 20–40 (Information Structure).
      *   **Move:** Explicitly diagram the difference between the prior probability distribution (shared) and the signal partitions (private). Use the phrase "Same map, different locations."

  2.  **Misconception:** "Private information is a legitimate source of speculative gains from trade."
      *   **Intervention Point:** Minutes 0–20 (Ex Ante Baseline).
      *   **Move:** Demonstrate that ex ante, before signals, the sum of expected utilities is fixed. Any gain for one is a loss for the other in a zero-sum speculative context. Private information only redistributes expectations; it does not create value ex ante.

  3.  **Misconception:** "The theorem predicts that real markets should show no trade."
      *   **Intervention Point:** Minutes 60–80 (The Unraveling).
      *   **Move:** Distinguish between *speculative* trade (betting on differences of opinion) and *hedging/liqidity* trade (moving risk or consumption smoothing). The theorem only kills the former under strict conditions.

  **Final Ten-Minute Task**

  Present a short vignette where two traders *do* execute a speculative trade despite having common priors and rationality. Ask the students to identify exactly **which single assumption of the Milgrom–Stokey framework must have been violated** to allow this trade to occur (e.g., "Did they disagree on the prior?" "Was the offer not common knowledge?" "Was there a liquidity constraint?"). Require them to justify their choice based on the logical arc of the session, not by recalling the theorem's name. This tests whether they understand the *conditions* for the impossibility result rather than just the result itself.

  **What to Leave Out**

  Explicitly state that you are omitting the **state-space formal proof**, **p-belief systems**, and the **relationship to Aumann's Agreement Theorem**. Tell the audience: "We are omitting the formal topology of information partitions and the specific connection to Aumann because our goal is to grasp the economic epistemology and the intuition of the 'offer as signal,' not to master the measure-theoretic machinery. Those topics are for a advanced game theory course; this seminar is about the implications for market epistemology."
