answer: |-
  Your instinct is spot-on. The summary you found gets the psychology right but makes a dangerous leap when it moves to the law. For a novelist, this is actually good news: the tension between *how people think* and *how the law says they should think* is where the drama lives.

  Here is a breakdown of what is fair, what is overstretched, and how to handle it in your courtroom scene without tripping over philosophical landmines.

  ### 1. What's Fair: The Experiment and the Asymmetry
  The summary of the experiment itself is accurate. This is the classic "Chairman Case" (Joshua Knobe, 2003).
  *   **The Setup:** A chairman starts a program to increase profits. He is told it will harm (or help) the environment. He says, "I don't care about the environment, I just want profit."
  *   **The Result:** Most people say he **intentionally** harmed the environment. Most people say he did **not intentionally** help the environment.
  *   **The Consensus:** This asymmetry is robust. It has been replicated many times. People *do* judge intentionality differently based on whether the outcome is good or bad.

  So, if your characters discuss the experiment itself, they are on solid ground.

  ### 2. What's Overstretched: The "Moral Bleed" Explanation
  The summary claims the *usual explanation* is that moral evaluation bleeds into intentionality judgments. This is the "Blame Hypothesis." While it is the most popular pop-science explanation, it is not the only one, and philosophers fight over it.

  **A philosopher might object:**
  *   **The "Deep Self" View:** Some argue it's not just "bad = intentional." It's that when someone does something bad, we assume it reveals their true character (their "deep self"). When they do something good incidentally, it doesn't reveal their character because they didn't sacrifice for it.
  *   **The "Counterfactual" View:** Others argue people are making a rational inference: If the chairman knew harm would occur and proceeded, he *accepted* the harm. If he knew help would occur, he didn't need to accept it to get the profit. Therefore, the mental state regarding harm is stronger.

  **Why this matters for your book:** If a character says, "Psychologists prove we just blame first and ask questions later," a knowledgeable reader might roll their eyes. It's more accurate to say, "Psychologists show our intuition about intent is *influenced* by outcomes."

  ### 3. The Courtroom Conclusion: The Dangerous Leap
  This is the part you suspected was too tidy. The book claims: *"The legal distinction between doing something on purpose and doing it by accident is just moral judgment in disguise."*

  **This is legally and philosophically false.**

  *   **Descriptive vs. Normative:** The Knobe Effect describes how human brains *actually* work (descriptive). The law prescribes how jurors *ought* to decide (normative). The existence of a bias does not mean the legal standard *is* that bias.
  *   **The Law Fights This:** The entire point of jury instructions regarding *mens rea* (guilty mind) is to force jurors to ignore the outcome and look at the state of mind. The law distinguishes between **Purpose** (I wanted this to happen), **Knowledge** (I knew this would happen), **Recklessness** (I knew the risk and ignored it), and **Negligence** (I should have known).
  *   **The Distinction Exists:** In many jurisdictions, "Knowingly" causing harm is legally distinct from "Purposely" causing harm, even if the moral blame is similar. The law is not "just moral judgment in disguise"; it is a rigid framework trying (and often failing) to contain moral judgment.

  **The Verdict:** You cannot have a character state as fact that "legal intent is just moral judgment." However, you *can* have a lawyer *argue* that the jury is falling prey to the Knobe Effect.

  ### 4. How to Write the Scene (Without Embarrassing Yourself)
  You can use this concept to create excellent tension. Here is how to frame it so it holds up to scrutiny:

  **A. Make it an Argument, Not a Fact**
  Don't have the judge or the narrator state that the law is just moral judgment. Have a defense attorney argue that the *prosecution is relying* on the jury's moral bias.
  *   *Dialogue Idea:* "The prosecution wants you to look at the burned forest and feel anger. Then they want you to call that anger 'intent.' But the law requires you to look inside my client's head, not at the trees."

  **B. Acknowledge the Instructions**
  Show that the judge is trying to suppress this bias. The drama comes from the jurors struggling to follow the instructions against their natural instincts.
  *   *Scene Idea:* A juror says, "He knew it would happen and did it anyway. That's intentional." Another juror replies, "But the judge said we have to prove he *meant* to do it, not just that he didn't stop it."

  **C. Use the "Side Effect" Nuance**
  The Knobe Effect is strongest with *side effects*. If your character's goal was the harm, it's clearly intentional. If the harm was a side effect of profit (like the Chairman), the Knobe Effect applies.
  *   *Plot Point:* Ensure your defendant fits the "Side Effect" profile. If they actively plotted the harm, the Knobe Effect is irrelevant. It only works if the harm was a foreseen but supposedly "unwanted" consequence of a different goal.

  ### 5. Specific Objections a Philosopher Would Raise
  If you want a character to sound well-read, or if you want to anticipate criticism, here are the specific objections to the book's summary:

  1.  **Conceptual Competence:** Some philosophers argue that "intentional" *means* something normative. It's not that we are biased; it's that the word "intentional" includes a moral component by definition. (This supports the book's conclusion but changes the reasoning).
  2.  **The Trade-Off:** In the harm case, the chairman accepts a trade-off (Profit + Harm). In the help case, there is no trade-off (Profit + Help). We attribute intentionality to things we accept as costs, not things we get for free.
  3.  **Legal Realism vs. Formalism:** The book takes a "Legal Realist" stance (law is what judges/juries do). A "Formalist" would say the law is the text of the statute. The truth is in the middle. The law *tries* to be formal, but jurors *are* realists.

  ### Summary Recommendation
  The pop book is right about the **psychology** but wrong about the **law**.

  *   **Do:** Use the Knobe Effect to show why the jury might convict even if the evidence of "purpose" is weak. It explains the *human* element of the courtroom.
  *   **Don't:** Have a character claim the legal definition of intent *is* moral judgment. The legal definition is technical; the *application* of it is where the morality bleeds in.

  If you frame it as **"The law asks for a mechanical judgment of the mind, but the jury brings a moral judgment of the heart,"** you will be philosophically safe and dramatically rich.
