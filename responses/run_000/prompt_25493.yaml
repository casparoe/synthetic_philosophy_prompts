  4. The disposition is chemical reactivity with oxygen, interfered with by the formation of a surface oxide layer on aluminum. Classification is unclear because the bulk metal retains its reactive electronic structure (mask), but the surface atoms available for stimulus contact are chemically transformed into a stable oxide (fink).

