answer: |-
  The glow of the monitor was the only light left in the lab. On the screen, two bar graphs sat side-by-side: *Whole Report* hovering around 4.5 items, *Partial Report* extrapolating to nearly 10.

  Marcus leaned back, rubbing his temples. "The data is clean, Elena. I'll grant you that. The subjects aren't lying, and the decay curve is textbook Sperling."

  "But the interpretation is where we part ways," Elena said, her eyes still fixed on the numbers. "Look at the timing, Marcus. The display lasts fifty milliseconds. The tone comes *after* the offset. The cue arrives when the letters are physically gone."

  "Exactly," Marcus said, turning his chair to face her. "Which means the cue triggers a read-out from a high-capacity sensory buffer. Iconic memory. It's fragile, it decays in milliseconds, and crucially, it is pre-conscious."

  "That's the assertion, not the conclusion," Elena countered. "If the subject can report three letters from *any* row I choose after the fact, those letters must have been available to be chosen. If they were available to be chosen, they were present in the mind. If they were present in the mind with that level of detail, they were phenomenally conscious. The fact that they can't report *all* of them at once is a bottleneck of access, not a bottleneck of experience."

  Marcus shook his head, a small smile playing on his lips. "You're conflating availability with illumination. Just because the data is there doesn't mean the lights are on. Think of the refrigerator light. You open the door, the light is on. You close it, you assume it's off. But what if you assume it's on even when the door is closed? That's the illusion I'm talking about. The subjects *feel* like they saw the whole grid because, at the moment of the cue, the brain constructs a narrative of having seen it all. It's post-dictive filling-in."

  "Post-dictive?" Elena spun her pen. "You're suggesting the brain waits for the tone, grabs three letters from a dark buffer, and then retroactively hallucinates the experience of seeing them? That's incredibly inefficient. Occam's razor suggests the experience happened, the access failed for the uncued items, and the memory decayed."

  "Occam's razor cuts both ways," Marcus said. "Positing a rich, conscious field that does absolutely no work is ontologically expensive. If that rich experience exists but cannot be reported, cannot be used to guide a motor response, cannot be reasoned about, and vanishes without a trace unless accessed... in what sense is it *conscious*? You're positing a ghost in the machine that looks exactly like a data buffer."

  "I'm positing a distinction between *phenomenal* consciousness and *access* consciousness," Elena said firmly. "P-consciousness is what it is like. A-consciousness is what you can do with it. The Sperling paradigm isolates them. The tone acts as a spotlight. Just because the spotlight only hits one row doesn't mean the rest of the stage was dark. It just means the rest of the stage wasn't broadcast."

  "But why call it a stage if no one sees it?" Marcus pressed. "Consciousness, on my view, is the broadcasting. It's the global workspace. When information becomes available to the whole system—memory, language, motor control—that is when it becomes conscious. Before that, it's just modular processing. You're treating 'conscious' as a property of the representation itself, rather than the functional state of the system."

  "And you're defining consciousness by the method of detection," Elena shot back. "That's the methodological trap. You're saying, 'If I can't measure it via report, it isn't there.' But report is a downstream process. It requires working memory, attention, speech planning. Why should the limits of my working memory dictate the limits of my visual experience?"

  "Because without those downstream processes, we have no evidence!" Marcus raised a hand, not in anger, but in exasperation. "We are scientists, Elena. We deal in public data. If a subject says, 'I felt like I saw it all,' that is a report. That is access. The *content* of that report is an inference. They infer they saw it all because they can retrieve any part I ask for. But that inference is fallible. Look at change blindness. People think they have a rich picture of the world, but swap a building behind them and they miss it. Do we say their consciousness overflowed access there? No. We say they have an illusion of richness."

  "Sperling isn't change blindness," Elena insisted. "Change blindness is about attention over time. This is about a single snapshot frozen in iconic memory. The cue locks in the content *before* it decays. The subjects aren't inferring; they're reading. When they report 'K, F, M', they aren't guessing. They are transcribing. If they are transcribing from a conscious experience, that experience existed."

  "Transcribing from a buffer," Marcus corrected. "A non-conscious buffer. You keep asking me to grant that the buffer has content. I do! It has high-fidelity content. It represents the grid. But representation isn't consciousness. A camera sensor represents a grid. Is the sensor conscious? The buffer holds the information until the workspace grabs it. When the workspace grabs it, *that* is when the light turns on. The feeling that the light was already on is the trick."

  Elena sighed, leaning forward. "So, when I look at a crowd of faces, and I have a sense of the crowd's density, but I can't name every face... you're saying I don't consciously see the crowd? I only consciously see the few I attend to, and my brain tricks me into thinking I see the rest?"

  "I'm saying you consciously see the attended faces. The 'sense of the crowd' is a summary statistic, a low-res representation that *is* accessed. But the high-res details of the unattended faces? No. That's the overflow you're chasing. It's a phantom."

  "But the phenomenology contradicts you," Elena said softly. "Close your eyes, Marcus. Think about your peripheral vision right now. You're looking at me. But you have a sense of the room behind me. It's blurry, yes, but it's *there*. It's experienced. If I asked you to reach for the door handle, you could. If consciousness were strictly limited to the focus of attention, your periphery should be blackness. It isn't. It's a field. The Sperling grid is just a high-res version of that field."

  Marcus paused. He looked at the door, then back to her. "Peripheral vision is a tricky case. It has different spatial frequency characteristics. But let's grant the periphery for a moment. Even if there is a faint phenomenal glow in the periphery, does it overflow *access*? Can you reason about it? Can you compare the shade of the wall in your periphery to the wall in your fovea without moving your eyes?"

  "Not easily," Elena admitted. "But 'not easily' isn't 'impossible'. And in Sperling, it *is* possible, provided the cue comes fast enough. That's the key. The access is possible for *any* row, provided the cue selects it. That implies the access pathway was open to all of them, but the bandwidth was limited. The consciousness was there; the report was bottlenecked."

  "The access pathway wasn't open to all of them simultaneously," Marcus argued. "The cue *opens* the pathway. Before the cue, the pathway is closed. The information is sitting there, waiting. You're calling that waiting state 'conscious'. I'm calling it 'pre-conscious'. This isn't just semantics, Elena. It's about mechanism. If the global workspace isn't activated, the information is encapsulated. It can't interact with your beliefs, your desires, your long-term memory. It's cognitively impenetrable. How can you be conscious of something you can't think about?"

  "Because thinking isn't seeing," Elena said. "I can be in pain without reasoning about the pain. I can feel red without conceptualizing 'red'. You're intellectualizing consciousness. You're making it a cognitive achievement. I'm treating it as a biological state."

  "And I'm treating it as a functional state," Marcus replied. "If it doesn't function in the system, if it doesn't make a difference to the agent's behavior or reasoning, positing it as 'conscious' adds nothing to the theory. It becomes an epiphenomenal dangler. A shadow that follows the dog but never pulls the leash."

  "It's not epiphenomenal," Elena said. "It's the substrate. The workspace selects *from* it. The overflow is the reservoir. Without the reservoir, there's nothing to select. The fact that the selection process alters the memory trace doesn't mean the trace wasn't illuminated before selection."

  Marcus tapped the desk. "And I say the selection process *creates* the illumination. Like the fridge light. We're staring at the same graph, Elena, but we're seeing different mechanisms. You see a floodlit field with a narrow gate. I see a dark room with a flashlight that creates the illusion of a floodlight when it moves fast enough."

  "Then we're at an impasse," Elena said, sitting back. "Because your flashlight analogy assumes what needs to be proved: that the light is off until the switch is hit. My field analogy assumes the light is on, but the switch only opens the door."

  "Exactly," Marcus said. "You think access is the *method of detection* for consciousness. I think access is the *mechanism of generation* for consciousness."

  "And neither of us can step outside our own access to check," Elena murmured.

  "Which is why," Marcus said, turning off the monitor and plunging them into darkness, "we keep running the trials. Maybe the next variation breaks the tie."

  "Maybe," Elena said, her voice coming from the dark. "But until then, don't tell my subjects they didn't see what they say they saw."

  "And don't tell me," Marcus replied, grabbing his coat, "that there's more in heaven and earth than can be reported."
