  2.  **Deconstruct Nozick's Tracking Theory:**
      *   **Conditions for Knowledge ($S$ knows that $p$):**
          1.  $p$ is true.
          2.  $S$ believes that $p$.
          3.  **Sensitivity:** If $p$ were false, $S$ would not believe that $p$. ($\neg p \rightarrow \neg Bp$)
          4.  **Adherence:** If $p$ were true, $S$ would believe that $p$. ($p \rightarrow Bp$)
      *   **The Problem:** Epistemic Closure Principle (If $S$ knows $p$, and $S$ knows $p$ entails $q$, then $S$ knows $q$).
      *   **Nozick's Solution:** Deny Closure.
      *   **The Example:** Zebra in the zoo.
          *   $p$: "The animal in the pen is a zebra."
          *   $q$: "The animal is not a mule painted to look like a zebra."
          *   $p$ entails $\neg q$ (actually $p$ entails "not painted mule").
          *   Tracking says: I know $p$ (if it weren't a zebra, I wouldn't believe it was).
          *   Tracking says: I don't know $\neg q$ (if it *were* a painted mule, I would still believe it wasn't).
          *   Therefore, Closure fails.

