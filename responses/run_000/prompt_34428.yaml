  To claim you know, belief must track the fact,
  It cannot be a merely lucky hit.
  If $p$ were false, you'd not maintain the act,
  You'd cease belief should truth begin to flit.
  And if the fact remains, you hold it tight,
  Across the variations of the near.
  In nearby worlds, where might-have-beens all bite,
  Your mind responds to what is actually here.

  But known entailment fails to carry through,
  Take up the zebra standing in its place,
  You know it true, though skeptics puzzle you,
  Yet "Not a Mule" escapes you in this case.
  For if a mule were there, you'd still believe,
  To keep the track, let closure take its leave.
