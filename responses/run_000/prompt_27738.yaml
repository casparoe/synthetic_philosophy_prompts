answer: |-
  Yes, there is a name for this, and you have correctly identified that it is distinct from groupthink or the bystander effect. In fact, it is almost the opposite of groupthink: instead of the group pressuring an individual to conform, an individual pressures the group to conform to *their* action.

  Here is the breakdown of the terminology, the game theory behind it, and the specific conditions that allow it to happen.

  ### 1. The Name: *Fait Accompli*
  The most precise term for this is a **Fait Accompli** (French for "accomplished fact").

  In political science and diplomacy, this refers to a decision that has already been made or an action that has already been taken before others hear about it, leaving them with no option but to accept it. When used within a group dynamic, it is often called **"Unilateral Action"** or **"Pre-emptive Execution."**

  In Game Theory, this is a form of **Strategic Commitment** (specifically, a *binding commitment*).

  ### 2. The Game Theory: Schelling's "Burning Bridges"
  The Nobel Prize-winning economist Thomas Schelling wrote extensively about this in his book *The Strategy of Conflict*.

  He described a tactic where a player limits their own options to force the other players' hands. By acting unilaterally, the rogue actor "burns the bridge" behind the group.
  *   **Before the action:** The group has the power to choose Option A or Option B.
  *   **After the action:** The group now has to choose between "Accept Option B" or "Pay a high cost to undo Option B."

  Because humans are loss-averse, the group almost always chooses to accept the new reality. The rogue actor has effectively changed the **Status Quo**. In behavioral economics, this exploits **Status Quo Bias**: once something is done, it becomes the default, and undoing it is perceived as a "loss" or a "change," which requires more energy than maintaining it.

  ### 3. The Conditions: Why It Works
  You asked about the exact conditions that make this possible. It is not just about the action itself; it is about the *friction* involved in reversing it.

  **A. High Reversal Costs (Social or Material)**
  You asked if the action has to be irreversible. **No.** It only has to be *costly* to reverse.
  *   **Material Cost:** If someone buys a $500 pizza for the club, the money is gone. Getting a refund is a hassle.
  *   **Social Cost:** This is usually the bigger factor. To reverse the action, someone has to say, "What you did was wrong, and we are undoing it." This creates conflict, embarrassment, and awkwardness. Most groups are **Conflict Averse**. They will accept a bad decision rather than have the uncomfortable conversation required to fix it.

  **B. Coordination Friction**
  It is easier for one person to act than for five people to agree to stop them.
  *   To act: One person needs to decide and move.
  *   To stop: The group needs to communicate, agree that the action was bad, agree on a remedy, and designate someone to deliver the bad news.
  *   By the time the group coordinates a response, the *fait accompli* is already in place.

  **C. Ambiguity of Authority**
  This dynamic thrives in flat hierarchies (clubs, friend groups, volunteer committees). If there is a clear boss who can say, "You are not authorized to send that," the tactic fails. When authority is shared, the rogue actor exploits the ambiguity: *"I thought I had permission,"* or *"I was just trying to help move things along."*

  ### 4. Intent: Strategic vs. Impulsive
  You asked if it matters whether the person knows they are going against the group. The outcome is the same, but the mechanism differs.

  **Scenario A: Strategic (The "Power Move")**
  The person knows the group will say no, so they act quickly to prevent the vote.
  *   **Motivation:** They prefer their outcome over group cohesion.
  *   **Dynamic:** This is a power grab. They are betting that the group values harmony more than they value the specific decision.
  *   **Term:** In organizational behavior, this is sometimes called **"Bureaucratic Jiu-Jitsu"**—using the organization's inertia against itself.

  **Scenario B: Impulsive/Competence (The "Doer")**
  The person genuinely thinks the decision is fine, or they are so focused on "getting things done" that they forget to check.
  *   **Motivation:** Efficiency. They hate meetings and deliberation.
  *   **Dynamic:** This is often enabled by the group's slowness. If the group takes three weeks to decide on a lunch spot, the person who just picks a place and makes a reservation looks "efficient" rather than "rude."
  *   **Term:** This is often labeled **"Bureaucratic Momentum."** The machine moves forward because no one pulled the emergency cord.

  ### 5. Why the Group Can't Stop It (Even When They See It Coming)
  You mentioned that the group can see the dynamic coming and still can't stop it. This is a specific variation of the **Bystander Effect** combined with **Pluralistic Ignorance**.

  *   **Diffusion of Responsibility:** Everyone thinks, *"Someone else should stop them."* Since no single person feels individually responsible for the group's integrity, no one speaks up in the moment.
  *   **The "Crazy Person" Veto:** In many groups, there is an unwritten rule that you don't aggressively confront a peer unless it's catastrophic. The rogue actor exploits this social norm. They know that to stop them, the group has to escalate the conflict to a level that feels disproportionate to the decision at hand.

  ### Summary of the Mechanism
  1.  **Proposal:** Group discusses Option X (Bad) vs. Option Y (Good).
  2.  **Delay:** Group deliberates on Y.
  3.  **Pre-emption:** Rogue Actor implements X unilaterally.
  4.  **Shift:** The question changes from "Which option should we pick?" to "Do we want to create conflict to undo X?"
  5.  **Acceptance:** Group chooses to avoid conflict and accepts X.

  ### How to Prevent It
  If you want to stop this in your group, you cannot rely on social norms. You need **Pre-Commitment Rules**:
  *   **The "24-Hour Rule":** No external communication/purchase can happen until 24 hours after a proposal is made.
  *   **Explicit Authority:** Designate one person who has the literal "keys" (credit card, admin password, email account).
  *   **The "Undo" Protocol:** Agree in advance that if someone acts unilaterally, the action is automatically voided without social penalty. This removes the awkwardness of reversing it.

  In short, you are dealing with a **Strategic *Fait Accompli***. It works because the cost of social conflict is higher than the cost of the bad decision.
