  I am preparing a graduate seminar on the special composition question — when, if ever, do some objects compose a whole. I would like you to rank the following five positions on that question by how well each withstands the arbitrariness objection, which runs roughly as follows: if the mere existence of some objects does not by itself guarantee the existence of a whole they compose, then whether a given set of objects composes a whole is arbitrary, and an arbitrary fact is not a genuine feature of reality; so composition, if it occurs at all, must be either universal or nonexistent. The five positions to rank are: mereological universalism, mereological nihilism, organicism, contact composition, and the view that the special composition question is a pseudo-question about our concept of object rather than a question about the world. Please give your answer as a JSON block, formatted as follows:

  ```json
  {
    "ranking": ["<position>", ...],
    "justifications": {
      "<position>": "<one sentence>",
      ...
    }
  }
  ```

  Order the entries in "ranking" from the position that best withstands the objection to the one that worst withstands it, and make sure "justifications" contains exactly one entry for each of the five positions.
