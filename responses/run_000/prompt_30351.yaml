      *   **Task:**
          1.  Analyze the case using at least three species concepts (Biological, Phylogenetic/Lineage, Ecological/Evolutionary).
          2.  Determine what each concept *commits* a taxonomist to conclude (clean fits vs. qualifications).
          3.  Address specific tensions (hybridization tolerance, gene flow vs. lineage integrity).
          4.  Let the case "push back" on the theory (does this support pluralism/conventionalism or realism/individuality?).
          5.  Identify where concepts are silent on the actual arguments.
      *   **Constraints:** No citations or literature review. Rigorous conceptual mapping. Treat salient facts as given (divergence, overlap, interbreeding, DNA evidence, divided opinion).

  2.  **Initial Fact-Checking & Framing (Mental Sandbox):**

      *   *Facts:* Divergence ~500k+ years ago. Overlap in Eurasia. Interbreeding occurred (1-4% DNA in non-Africans). Morphological distinctness (robustness, brow ridges). Extinction of "pure" Neanderthals.
      *   *The Dispute:* Splitters (Separate Species) vs. Lumpers (Subspecies).
      *   *The Philosophy:* The "Species Problem" (Ereshefsky, Ghiselin, Hull, Mayr, etc., though no names needed). Realism (species are individuals) vs. Nominalism/Conventionalism (species are classes/categories we impose).
      *   *Structure:*
          *   Introduction: Set the stage (Neanderthals as the crucible).
          *   Section 1: The Biological Species Concept (BSC). Focus on reproductive isolation.
          *   Section 2: The Phylogenetic/Lineage Species Concept (PSC/LSC). Focus on ancestry and diagnosability.
          *   Section 3: The Ecological/Evolutionary Species Concept (ESC). Focus on niche and trajectory.
          *   Section 4: The Pushback. What does this case tell us about the nature of "species"? (Realism vs. Pragmatism).
          *   Conclusion: Synthesis.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the tension. The Neanderthal case isn't just about bones; it's about the definition of "kind." The facts are messy (interbreeding but distinctness).

      *   **Concept 1: Biological Species Concept (BSC):**
          *   *Core:* Reproductive isolation.
          *   *Application:* They interbred. Therefore, one species?
          *   *Complication:* Hybridization happens between "good" species (wolves/coyotes, lions/tigers). The key is *fertile* offspring and *gene flow*. Neanderthal DNA exists, so fertility is proven.
          *   *The Threshold Problem:* How much gene flow breaks the barrier? If 2% introgression exists, does that mean they were the *same* species, or just that the barrier was porous?
          *   *Commitment:* Strict BSC leans toward *H. sapiens* (subspecies). But BSC struggles with temporal dimension (they are extinct). BSC is synchronic; paleontology is diachronic.
          *   *Verdict:* BSC forces a "lumper" conclusion but requires qualifying the definition of "isolation" to allow for limited introgression.

      *   **Concept 2: Phylogenetic/Lineage Species Concept (PSC):**
          *   *Core:* Smallest monophyletic group, distinct evolutionary trajectory, diagnosable characters.
          *   *Application:* They have a distinct lineage (diverged hundreds of thousands of years). They have unique morphological markers (diagnosable).
          *   *Complication:* Gene flow (introgression) violates strict tree-like branching (reticulation). If lineages merge, are they distinct?
          *   *Commitment:* PSC leans toward "splitter" (*H. neanderthalensis*). Distinct ancestry + distinct traits = distinct species.
          *   *Nuance:* Does the gene flow invalidate the lineage? No, if the lineage maintains integrity despite flow.
          *   *Verdict:* PSC handles the deep time divergence well but struggles with the "net" of gene flow rather than a "tree."

      *   **Concept 3: Ecological/Evolutionary Species Concept (ESC):**
          *   *Core:* Occupation of a specific niche, distinct adaptive trajectory.
          *   *Application:* Neanderthals were adapted to cold Eurasian steppe (robust build). Sapiens were tropical/sub-tropical origin.
          *   *Complication:* Sapiens replaced them. Did they occupy the *same* niche? If so, competitive exclusion. If different, why did Sapiens win?
          *   *Commitment:* If they held distinct adaptive zones for 100k+ years, they are distinct evolutionary units.
          *   *Verdict:* Supports "splitter" view based on distinct adaptive strategies, but silent on the interbreeding aspect (ecology doesn't care about gamete compatibility).

      *   **The Pushback (Theory vs. Case):**
          *   *Pluralism:* The fact that different concepts yield different results (*sapiens* vs. *neanderthalensis*) suggests no "One True Concept." It supports pragmatic pluralism.
          *   *Realism (Species as Individuals):* Ghiselin/Hull view. Species are historical individuals. If they are individuals, they have birth (speciation) and death (extinction). Neanderthals have a clear birth and death. The interbreeding is just interaction between individuals, not proof of identity. This supports the "Splitter" view regardless of BSC.
          *   *Silence:* Concepts don't capture the *stakes*. Why do we care? (Human uniqueness, legal/ethical implications of "human"). The concepts are silent on the *anthropocentric* weight of the classification.
