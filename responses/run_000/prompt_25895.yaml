  (b) Whether a satisfactory solution needs to deliver a unique reference class for every singular event, or only for a privileged subset — and if the latter, your credence that such a subset can be non-arbitrarily demarcated.

  (c) The prospects for approaches that appeal to natural properties or natural kinds, where the correct reference class is the one that carves nature at the joints, including your credence that such joints exist at the grain the problem requires.

