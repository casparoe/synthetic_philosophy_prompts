  **Summary:**
  The RCP has no "fully satisfactory" solution if "satisfactory" means recovering the objective, single-case determinacy of quantum mechanics for macroscopic, complex events. It does have a satisfactory solution if "satisfactory" means "a rigorous logic of evidence that guides action without metaphysical pretense." I have scored the former, as per your prompt, but I suspect the latter is what you actually need.
