  2.  **Evaluate Each Claim:**

      *   **1. The Cinderella Effect:**
          *   *Claim:* Stepparents abuse/kill kids more than bio parents due to kin selection.
          *   *Evidence:* Strong statistical data across multiple jurisdictions (Daly & Wilson).
          *   *Falsifiability:* High. If data showed no difference or reverse difference, the theory dies.
          *   *Criticism:* Confounding variables (socioeconomic status, stress of blending families), but the effect size is usually robust even controlling for these.
          *   *Verdict:* Very strong empirical backing. Hard to call it a "story" when the data is this consistent.
          *   *Tier:* S or A. Let's go S because the data is exceptionally robust compared to most EP claims.

      *   **2. Cheater-Detection (Cosmides & Tooby):**
          *   *Claim:* Domain-specific module for social contracts improves Wason task performance.
          *   *Evidence:* Replicated many times, but also heavily debated. Some argue it's about deontic logic or familiarity, not a specific "module."
          *   *Falsifiability:* Moderate. It made a specific prediction about task framing.
          *   *Criticism:* The "module" interpretation is contested, but the *effect* (framing matters) is real. The *explanation* (evolved module) is where the "just-so" risk lies.
          *   *Verdict:* Good experimental design, but the theoretical leap to a specific module is debated.
          *   *Tier:* A. It's experimental and risky, but alternative explanations exist.

      *   **3. Waist-to-Hip Ratio (Singh):**
          *   *Claim:* 0.7 WHR is universally preferred due to fertility cues.
          *   *Evidence:* Initial studies supported it.
          *   *Criticism:* Cross-cultural replication is weak. Many cultures prefer higher ratios (indicating health/wealth in resource-scarce environments). BMI often confounds WHR.
          *   *Falsifiability:* High (cross-cultural survey), and it largely *failed* the strict universality test.
          *   *Verdict:* Looks like a classic just-so story that didn't hold up to broader sampling.
          *   *Tier:* C. (Maybe B, but the universality claim is pretty damaged). Let's go C because it's often cited as a prime example of WEIRD bias in EP.

      *   **4. Jealousy Sex-Difference (Buss):**
          *   *Claim:* Men = sexual, Women = emotional infidelity distress.
          *   *Evidence:* Physiological measures (heart rate, etc.) support it better than self-reports.
          *   *Criticism:* Effect sizes vary by culture. Some argue it's about belief in infidelity rather than distress.
          *   *Falsifiability:* Moderate. Forced-choice questions are methodologically tricky.
          *   *Verdict:* Robust enough to not be dismissed, but methodological quirks keep it from being S-tier. It's a core EP finding but contested.
          *   *Tier:* B. Solid evidence, but methodological debates prevent it from being definitive.

      *   **5. Pregnancy Sickness (Profet):**
          *   *Claim:* Nausea avoids teratogens in first trimester.
          *   *Evidence:* Correlational data on food aversions. Some evidence that sickness correlates with lower miscarriage rates.
          *   *Criticism:* Hard to test experimentally (can't make pregnant women eat toxins). Alternative explanation: byproduct of hormones.
          *   *Falsifiability:* Low/Moderate. Hard to distinguish adaptation from byproduct definitively.
          *   *Verdict:* Plausible, elegant, but hard to prove causality.
          *   *Tier:* B. It's a strong hypothesis with supportive correlational data, but mechanistic proof is elusive.

      *   **6. Grandmother Hypothesis:**
          *   *Claim:* Menopause allows investment in existing kin.
          *   *Evidence:* Demographic data from hunter-gatherers (Hadza) shows grandmothers increase grandchild survival.
          *   *Criticism:* Is it an *adaptation* or a *byproduct* of general longevity? Other animals don't really do this.
          *   *Falsifiability:* Moderate. Depends on demographic modeling.
          *   *Verdict:* Widely accepted in anthropology/biology, not just psychology. Stronger than most EP claims because it relies on hard demographic data.
          *   *Tier:* A. It's backed by solid demographic modeling, though the "adaptation" vs "byproduct" debate lingers.

