answer: |-
  Here is a sorting of those claims based on their empirical robustness and ability to withstand the "just-so story" criticism, ranked from most scientifically secure (S) to least (C).

  **S Tier**
  *   **The Cinderella effect:** This lands at the top because it relies on large-scale homicide statistics rather than self-reports, and the prediction was specific enough that finding no difference in risk would have falsified the kin-selection model.

  **A Tier**
  *   **The cheater-detection claim:** This earns a high rank because it produced a replicable experimental effect that falsified the null hypothesis of general reasoning, even if the specific "neural module" mechanism is still debated.
  *   **The grandmother hypothesis:** This is robust because it uses hard demographic data from hunter-gatherer populations to show a clear fitness trade-off, moving it beyond speculation into quantitative modeling.

  **B Tier**
  *   **The jealousy sex-difference claim:** This falls in the middle because while physiological measures support the claim, the effect size fluctuates significantly depending on whether researchers use forced-choice or continuous rating scales.
  *   **Pregnancy sickness as adaptation:** This is harder to verify because while the correlation with miscarriage rates is strong, it is methodologically difficult to definitively distinguish an adaptation from a hormonal byproduct.

  **C Tier**
  *   **The waist-to-hip ratio claim:** This ranks lowest because the central claim of cross-cultural universality failed to replicate in non-Western populations, revealing it as likely culturally contingent rather than evolved.

  **The takeaway for your argument:** Your friend is right that *bad* evolutionary psychology looks like the C-tier (post-hoc storytelling that ignores culture), but you are right that *good* evolutionary psychology looks like the S and A tiers (risky predictions backed by hard data that could have proven the theory wrong).
