prompt: |-
  Okay so my friend and I got into a long argument last night about whether evolutionary psychology is mostly just-so stories. He kept saying that for any trait you can spin an adaptive story after the fact, and I kept saying that's not fair because some of these hypotheses actually make risky predictions that could easily have failed. He said, fine, name one. And then I realized I don't have a good way of sorting out which claims is more like genuine science and which is basically unfalsifiable storytelling, so I've been stewing over it all day.

  Here's the list I've been going back and forth on. Could you sort them into tiers (say S, A, B, C) by how well each one can answer the just-so story charge—that is, how much you'd trust it as a real, testable claim rather than a post-hoc narrative—and give me a sentence for each explaining why it lands where it does? Don't worry about citations, I just want your read on the substance.

  - The Cinderella effect: children living with stepparents are at substantially higher risk of abuse or homicide than children living with both biological parents, because selection favors investing in genetic kin.
  - The cheater-detection claim: people are much better at Wason selection tasks when they're framed as social-contract/cheating problems than when framed abstractly, supposedly because we have a dedicated cheater-detection module.
  - The waist-to-hip ratio claim: men across cultures prefer a female waist-to-hip ratio around 0.7 because it's a reliable cue of fertility and health.
  - The jealousy sex-difference claim: men are more upset by sexual infidelity and women by emotional infidelity because of different selection pressures (paternity certainty vs. resource loss).
  - Pregnancy sickness as adaptation: morning sickness is a defense that keeps women from ingesting teratogenic foods during the first trimester.
  - The grandmother hypothesis: menopause is an adaptation for stopping direct reproduction in order to invest in grandchildren.
