answer: |-
  Martin gave me specific instructions for this moment, and the first of them was that I am not to stand here and make him sound like a nice man. He knew this room would be cold; he knew the air would be thick with things unsaid, and he insisted that I not try to warm it with lies. He told me, 'Don't you dare sanitise me. Make them understand what I was trying to do.' So I will not speak of his kindnesses, or his humour, or the way he made tea, because those are the comforts of the ethical life, the life of social contracts and mutual reassurance, and Martin believed he had been called out of that life. He asked me to speak to the fracture, not to the glue, and to acknowledge that while he is gone, the break he made remains.

  To Jane and Sarah, I know that no explanation I offer can restore what was lost, nor should it. Ethically, morally, by every standard that holds a family together, Martin was in the wrong. He broke his vows and he left you to bear the weight of his absence, and your anger is not a misunderstanding; it is the correct response to a father and husband who walked away. He knew you would never forgive him, and he accepted that price before he packed his bags. He did not expect you to understand, because he believed that what he was doing could not be communicated without being destroyed. I stand here not to ask for your forgiveness on his behalf, but to acknowledge that his silence was not a lack of love, but a terrible necessity he imposed upon himself.

  For thirty years, Martin taught *Fear and Trembling*, arguing that there are moments when a person must suspend the ethical for the sake of something higher, something singular and inexplicable. Most of us treat that as a literary device, a philosophical puzzle to be solved over wine in a seminar room, but Martin believed it was a real category of existence. He believed he had received a command that he could not justify to the universal, because to justify it would be to bring it back within the rules of society. He could not tell you why he was leaving because the reason belonged to a sphere where language fails, where duty to the individual supersedes duty to the family. He chose to be the Knight of Faith rather than the tragic hero, which meant he had to look like a murderer of bonds while believing he was obeying a higher law.

  He did not go to find himself, and he did not go to escape you; he went to care for a dying student who had no one else, because he believed he was the only one who could. He lived the rest of his life in isolation, bearing the judgment of his colleagues who thought he had suffered a breakdown, and the hatred of his family who knew he had simply left. He never defended himself, not out of pride, but because defence implies that the action can be weighed on a public scale. He accepted the role of the villain in your story so that he could be obedient to the silence in his own. He lived exactly as he taught: alone, misunderstood, and absolutely certain that he was right, which is perhaps the most frightening thing a human being can be.

  So we are left with this unresolved tension, exactly as he intended. I cannot offer you comfort, because Martin did not want comfort; he wanted witness. He wanted you to know that his life was not a mistake, nor a madness, but a deliberate, costly enactment of the thing he loved most. To his friends, he was a mystery; to his family, a betrayal; to his colleagues, a cautionary tale. He asked me to tell you that he saw the cost clearly, and he paid it fully. We are here not to reconcile the contradiction, but to stand before it, and to acknowledge that while the ethical demand for family and honour is absolute, Martin believed he had been touched by something that demanded he break it.
