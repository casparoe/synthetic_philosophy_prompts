      *   **Task:** Consistency check of a specific moral worldview (7 commitments).
      *   **Output Requirements:** Identify tensions (real vs. apparent), rank them by severity, propose specific revisions (cheapest fix), and assess if the fix changes the view fundamentally.
      *   **Tone:** Analytical, direct, constructive, honest.

  2.  **Analyze the 7 Commitments:**
      1.  *Strict Negative Utilitarianism (NU):* Suffering is the only intrinsic bad. Happiness is only relief of suffering.
      2.  *Asymmetry:* No duty to create happy lives, strong duty not to create suffering lives. (Consistent with NU).
      3.  *Wild Animal Suffering (WAS):* Moral catastrophe, high priority, agent-neutral (doesn't matter if humans caused it). (Consistent with NU).
      4.  *No World-Exploder:* Rejecting the "Benevolent World-Exploder" conclusion often associated with strict NU. (Potential Tension with #1).
      5.  *Functionalism about Suffering:* Low bar for sentience (insects/fish count). (Amplifies #3, consistent with #1).
      6.  *Epistemic Modesty:* Skepticism of intuitions/method of cases. (Potential Tension with #4, which often relies on intuition).
      7.  *Maxipok Longtermism:* Avoid worst possible futures dominates EV. (Consistent with NU/Negative Prioritarianism, but potential tension with #4 regarding what counts as "worst").

  3.  **Identify Tensions (Brainstorming & Filtering):**

      *   *Tension A: Strict NU (#1) vs. No World-Exploder (#4).*
          *   *Analysis:* This is the classic Benatar/NU critique. If suffering is the *only* intrinsic bad, and existence entails *some* suffering (which #5 suggests is widespread), then non-existence entails zero suffering. Zero is better than positive suffering. Therefore, eliminating sentient life minimizes the bad. Rejecting this (#4) while keeping Strict NU (#1) is the biggest logical hurdle.
          *   *Severity:* Critical. This is the "reductio ad absurdum" of Strict NU.
          *   *Fix:* Modify #1 (Lexical Threshold NU or Suffering-Focused Utilitarianism) or Modify #4 (Accept the button but add practical constraints).

      *   *Tension B: Strict NU (#1) + Functionalism (#5) vs. Maxipok Longtermism (#7).*
          *   *Analysis:* If insects suffer (#5), the numbers are astronomical ($10^{18}$+). WAS (#3) is huge. But Longtermism (#7) usually focuses on existential risk to *humanity* or post-humanity to secure the *future*. If the future contains astronomical amounts of insect-like suffering (or digital sentience suffering), maximizing the future might maximize total suffering. Maxipok usually means "avoid human extinction." But for an NU, human extinction might be good if it prevents future suffering.
          *   *Severity:* High. It challenges the *direction* of the longtermist effort.
          *   *Fix:* Refine #7 to be "Suffering-Focused Longtermism" (avoid futures with astronomical suffering).

      *   *Tension C: Epistemic Modesty (#6) vs. Confidence in NU/WAS (#1, #3, #5).*
          *   #6 says "don't trust intuitions." #1 and #4 are often driven by intuitions (the badness of pain vs. the badness of extinction).
          *   *Severity:* Medium. It's a methodological tension, not necessarily a logical contradiction, but it undermines the justification for the other claims.

      *   *Tension D: Asymmetry (#2) vs. Strict NU (#1).*
          *   Actually, these are quite compatible. Asymmetry is often derived from NU or Person-Affecting views. Not a major tension.

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the role, validate the coherence of the draft (it's actually quite sophisticated), but state clearly that there is a "load-bearing" problem.
      *   **Ranking Tensions:**
          1.  *The Benevolent World-Exploder (NU #1 vs. No Button #4).* This is the big one.
          2.  *The Longtermist Direction (NU #1/#5 vs. Standard Maxipok #7).* The "Astronomical Suffering" risk.
          3.  *Epistemic Foundations (#6 vs. The Rest).*
      *   **Deep Dive on Each:** Explain *why* it's a tension, severity, and the "cheapest fix."
      *   **Recommendation:** Which single revision cleans up the most?
      *   **Conclusion:** Final philosophical assessment.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining Tension 1 (NU vs. Button):* Strict NU implies $V(World) = - \sum Suffering$. Empty world = 0. Populated world = $-X$. $0 > -X$. So Empty is better. To reject the button, you need a side-constraint (rights?) or a modified value function (lexical threshold where *extreme* suffering matters but mild suffering doesn't outweigh existence).
      *   *Refining Tension 2 (Longtermism):* Standard longtermism (EA style) assumes the future is good and worth securing. NU assumes the future is risky for suffering. If insects count (#5), the future of space colonization could be $10^{30}$ insects. Securing that future is a moral disaster. So #7 needs to change from "secure the future" to "ensure the future isn't hell."
      *   *Refining Tension 3 (Modesty):* If you doubt intuitions, why are you so sure about #1? Usually, #1 is intuition-driven. However, #6 can be framed as "I doubt *positive* intuitions more than *negative* ones." That's a viable position (error theory about good, realism about bad).

      *   *The "Single Revision":* Changing #1 from "Strict NU" to "Lexical Threshold Prioritarianism about Suffering" (or "Weak NU"). This allows you to keep the focus on suffering without entailing the World-Exploder. It resolves Tension 1 immediately and helps Tension 2.

  6.  **Polishing the Tone:**
      *   Avoid "Have you considered..."
