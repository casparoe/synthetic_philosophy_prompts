      *   *Transparency (5) clash:* Evans' transparency suggests you *cannot* arrive at "I don't believe p" via the standard route if you've already established p. To think the Moorean thought, you must have bypassed transparency. (4) suggests this bypass (self-deception) makes the thought rational. (5) suggests the bypass makes the thought irrational/defective.

