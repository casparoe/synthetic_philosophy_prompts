          *   *Key feature:* Focuses on *assertion*, relies on the Knowledge Norm of Assertion (KNA). Explains irrationality via contradiction between content and norm-implied state.

      *   **(2) Constitutive Norm:** The KNA is constitutive. No knowledge = no assertion (like chess rules).
