answer: |-
  Elena, a freelance contractor, is bidding on a lucrative renovation project where the quality of critical wiring and insulation will be permanently concealed behind walls, making legal enforcement of quality impossible. The client, knowing that a purely profit-maximizing contractor would use substandard materials once the deposit is secured, refuses to hire anyone who cannot guarantee "irrational" integrity. Elena, whose original values are strictly financial, realizes she will not win the bid unless she can credibly commit to using expensive materials even when cutting corners would be undetectable and profitable. To secure the contract, she deliberately undergoes a regimen of cognitive conditioning to instill a pathological sense of "craftsman's shame," rewiring her psychology so that the mere thought of shoddy work triggers severe anxiety and self-loathing. She wins the bid, and months later, when no one is watching and cheap materials would suffice, she installs the expensive wiring, suffering a financial loss to avoid the psychological distress she intentionally cultivated.

  (a) **The Irrationality of the Later Action:** At the moment of purchase ($T_2$), Elena's action is instrumentally irrational regarding her worldly welfare. The materials are hidden, the contract is unenforceable, and the money saved would increase her material wealth without consequence. She spends the money solely to avoid a psychological penalty (shame) that she knows is an artificial construct—a "ghost" she installed to haunt herself. From the perspective of standard decision theory, maximizing utility should not involve satisfying preferences that were deliberately designed to conflict with one's own material interests; she is effectively paying a tax to a warden she hired to imprison her future self.

  (b) **The Rationality of the Earlier Decision:** At the moment of hiring ($T_1$), the self-manipulation is strictly rational. The net value of the contract (profit minus the cost of the expensive materials) exceeds the value of her next best alternative (no contract). By treating her own psychology as a strategic variable, she expands her opportunity set. The cost of the conditioning and the future "irrational" expenditure are merely investment costs required to unlock the revenue stream. The original self maximizes its expected utility precisely by ensuring the future self loses the capacity to maximize local utility.

  (c) **Failure of Ordinary Precommitment:** Standard remedies fail due to **non-verifiability**. A legal contract cannot specify "quality" for concealed work because a court cannot distinguish good wiring from bad without destructive testing. Reputation is insufficient because this is a high-stakes, one-off transaction with a new client who cannot rely on past data. A credible promise is impossible because, without the internal change, Elena's future self would have a dominant strategy to break that promise. Only by altering her *internal* payoff structure—making the breach of promise psychologically more costly than the financial gain—can she simulate the binding force of an external contract.

  (d) **The Unified Rational-Agent Reply:** A defender of unified rationality (such as a sophisticated consequentialist or a proponent of Resolute Choice) might argue that Elena is not truly irrational at $T_2$. They would claim that once the preferences are changed, satisfying them *is* rational, and the $T_1$ self merely updated the utility function to reflect the true value of "integrity." They would argue that rationality is about global consistency over time, not local maximization at every node; thus, Elena is simply a rational agent executing a long-term plan, and the "irrationality" is an illusion created by defining utility too narrowly as material wealth.

  **Structural Assumption Pressured:**
  This case most directly pressures the assumption of **Diachronic Preference Stability**—the notion that a rational agent's utility function is a fixed, exogenous parameter that remains constant across time, rather than an endogenous strategic variable that can be manipulated by earlier time-slices to constrain later ones. It challenges the idea that the "self" is a unified locus of stable values, suggesting instead that rational agency may require the present self to treat the future self as a distinct entity to be hacked or reprogrammed.
