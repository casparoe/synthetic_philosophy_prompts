answer: |-
  The bar near the convention center is loud, smelling of stale beer and wet coats. N and U find a small table in the corner, nursing pints after a session on material constitution.

  **N:** That Brutalist talk was painful. "Composition just happens, sometimes, no principle required." It's basically giving up.

  **U:** It's ontologically safe, I'll give them that. But theoretically bankrupt. If you can't say *when* composition occurs, you haven't done metaphysics; you've just cataloged intuitions.

  **N:** Safe is good. Better than your alternative. I saw you nodding when the speaker criticized Universalism. I thought you were beyond caring about trout-turkeys.

  **U:** (Laughs) I don't care about the trout-turkey. It exists. Parts arranged trout-wise next to parts arranged turkey-wise compose something. Why wouldn't they? The principle is clean: composition is unrestricted. It's simple, it's logical, it doesn't rely on vague boundaries. What's the cost?

  **N:** The cost is sanity. You're populating the world with garbage objects. You think there's an object composed of my left shoe and the Eiffel Tower?

  **U:** I think there are simples arranged shoe-wise and simples arranged tower-wise. If you want to call their sum an "object," fine. It's not a *natural* kind, it's not causally unified, but it exists. Existence is cheap, N. Significance is expensive.

  **N:** But that's exactly where we diverge. You treat existence like a logical quantifier and stop there. I treat it as a commitment to causal structure. If that shoe-tower sum doesn't do anything over and above what the shoe and the tower do, why posit it? You're violating parsimony.

  **U:** Am I? I'm ontologically lavish, sure. But I'm ideologically parsimonious. I don't need a brute principle to tell me when composition stops. You, on the other hand, Nihilist… you're the one with the heavy lift. You deny tables. You deny chairs. You look at a room full of people and say, "Actually, just simples arranged person-wise."

  **N:** I say there are no tables. I don't deny the simples are there. I don't deny they're arranged table-wise. I just deny there's a further entity, the Table. That seems like a virtue. I'm not multiplying entities beyond necessity.

  **U:** You're multiplying *paraphrases* beyond necessity. Every time you say "There is a table," you have to translate that into "There are simples arranged table-wise." Your ideology is bloated. You need complex semantic rules to save your sparse ontology. I take ordinary language at face value. If it looks like a table and quantifies like a table, it's a table.

  **N:** Face value is a trap. Common sense said the sun went around the earth. Common sense says there's no space inside atoms. Why should common sense get a veto on mereology? The intuition that composition is restrictive is deeper than the intuition that tables exist. We can live without tables—we can't live without a principled account of existence.

  **U:** But can you live without tables? Practically, yes. Philosophically? You're telling me that when I sit down, nothing catches my weight? Only simples?

  **N:** The simples catch your weight. The plurality of them does the work. You're conflating existence with utility. Just because "table" is a useful word doesn't mean it refers.

  **U:** Okay, let's grant the paraphrasing works. Let's grant you can say everything I say without committing to composites. Here's my real worry: You're making existence contingent on our interests. Why do simples compose a person but not a heap? Because of life? Because of cohesion? Where do you draw the line without being arbitrary?

  **N:** I draw it at simples. Nothing composes anything. It's the only non-arbitrary line besides "everything composes."

  **U:** Exactly! So we agree the Brutalist is out. It's between Never and Always. And you think Always is absurd because of trout-turkeys. I think Never is absurd because of tables. We're just pricing different costs.

  **N:** It's not just pricing. It's about what metaphysics is for. If metaphysics is about carving nature at its joints, your joints are everywhere. That means there are no joints. If everything is an object, "object" doesn't carve anything.

  **U:** But "object" isn't supposed to carve nature. It's supposed to track existence. Nature is carved by laws, by natural kinds. I can agree the trout-turkey isn't a natural kind. It's still an object. You're conflating ontology with ideology again. You want "object" to do the work of "natural kind."

  **N:** (Takes a long drink) Maybe. But consider the modal cost. If I have a statue and the clay, you say they are identical if they share parts. But if I squish the clay, the statue dies. If composition is unrestricted, identity gets messy. You end up with four-dimensional worms to save the logic.

  **U:** And you end up with no statues at all. Which is worse? Losing the statue or accepting temporal parts? I'd rather keep the logic clean.

  **N:** See, this is what frustrates me. We're not even arguing about the world anymore. We're arguing about which formal system causes less headache.

  **U:** Isn't that all metaphysics is? Choosing the formal system that best systematizes the world without doing violence to the data. My data includes the intuition that existence isn't vague. Your data includes the intuition that artifacts aren't fundamental.

  **N:** But whose data wins? If it's just a trade-off, then there's no fact of the matter. We're just recommending different languages.

  **U:** I don't think it's verbal. There is a fact about whether composition occurs. I think it always occurs. You think it never does. One of us is wrong about the world, not just the language. But… (pauses) I'll concede this: if your paraphrasing strategy is fully extensionally equivalent to mine, the practical difference is zero.

  **N:** I'll concede that too. If I say "simples arranged table-wise" and you say "table," we agree on the arrangement. We agree on the causality. We disagree on whether there's a further ontological commitment.

  **U:** So why argue?

  **N:** Because the commitment matters for everything else. If you accept the trout-turkey, you've opened the door to any gerrymandered object. That affects how you think about persistence, about identity, about modality. Your simplicity here buys you complexity there.

  **U:** And your simplicity there buys you complexity in semantics. We're back to pricing.

  **N:** (Sighs) Maybe. But I sleep better knowing there are no trout-turkeys.

  **U:** And I sleep better knowing I don't have to explain why composition stops at the skin of a organism but not at the edge of a table.

  **N:** Cheers to theoretical costs, then.

  **U:** Cheers. May the best parsimony win.

  They clink glasses. The noise of the bar swells again, filling the silence between the worlds they inhabit.
