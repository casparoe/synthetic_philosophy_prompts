answer: |-
  Subject: Re: Lewis triviality argument debrief

  Look, first off, give yourself some credit. Arguing about Lewisian triviality after a couple of drinks is a rite of passage for anyone working in this area, and the fact that you both ended up in a stalemate rather than one of you clearly capitulating suggests you both actually understand the dialectic pretty well. This is one of the hardest problems in the philosophy of language and logic, and there is no consensus solution that everyone agrees is satisfactory. That said, since you asked me to adjudicate, I am going to walk through the exchange step by step and tell you where each of you landed on the truth and where you might have overplayed your hand, before giving you my read on the current state of the field.

  Starting with the opening move, your friend was technically correct about the core result but slightly too dogmatic about the conclusion. Lewis did indeed prove that if the probability of a conditional equals the conditional probability of the consequent given the antecedent, and if this holds for a class of probability functions closed under conditionalization, then the probability of the conditional collapses to the probability of the consequent. That math is solid. However, your immediate pushback in step two was actually the most philosophically sophisticated move in the whole conversation. You correctly identified that Lewis's proof assumes that the conditional expresses the same proposition across all those different probability functions. If you assume that the proposition expressed by if A then C can shift depending on the agent's credence function, the proof blocks. This is the context-dependence escape route, championed by people like Robert Stalnaker in later work and Karen Bennett. So you were right to say the result doesn't force you to abandon truth conditions entirely, provided you are willing to accept that the content of the conditional is context-sensitive in a very specific way. Your friend was also right, though, to point out in step three that this comes at a cost. If the proposition shifts with every update, you lose the nice invariant meaning that makes communication possible, and you are right that later results by Alan Hájek showed that triviality arises under weaker assumptions than Lewis originally used, so simply restricting the equation to the current credence function does not fully immunize you from similar problems.

  When you pivoted to three-valued semantics in step four, you were again technically correct that this dodges the triviality proof, because Lewis's argument assumes classical bivalence. If conditionals lack a truth value when the antecedent is false, then the probability of the conditional is not the probability of its truth in the classical sense. However, your friend's counter in step five cuts to the heart of what we mean by truth conditions. Dorothy Edgington has argued persuasively that if you go this route, you are effectively admitting that conditionals do not describe facts about the world but rather express a state of mind constrained by conditional probability. Whether you call that a non-classical truth condition or an assertibility condition is partly terminological, but the substantive point your friend made is that the triviality results reveal a structural mismatch between conditionals and the propositional mold. On this specific point, I think your friend has the stronger philosophical intuition, even if you were right about the technical loophole. The triviality results are widely regarded as evidence that the Ramsey test captures something fundamental about conditionals that classical truth conditions cannot accommodate without significant distortion.

  The debate got even sharper when you raised the embedding problem in step six. This is genuinely the strongest argument against the non-propositional view, and you were right to press it. If conditionals do not express propositions, it is very hard to explain why they can be negated, disjoined, or embedded in the antecedents of other conditionals. Natural language clearly allows us to say things like if if A then B, then C, and a theory that says conditionals aren't the kind of thing that can go in that slot owes us a very complex explanation of what is actually happening there. Your friend's response in step seven was a bit too dismissive. While it is true that embedded conditionals are tricky for everyone, saying negation is easy because not (if A then C) is equivalent to if A then not C is controversial. Many philosophers argue that the negation of a conditional is not itself a conditional but a commitment to the possibility of A and not-C. So while your friend is right that the embedding problem is not necessarily a refutation, it is a much larger bullet to bite than they let on. You were right to insist that the non-propositional view owes us a robust account of logic and embedding, and currently, that account is less developed than the classical truth-conditional one.

  However, your friend scored a significant point in step nine when they reminded you that the truth-conditional story is not without its own severe wounds. The material conditional analysis is universally rejected because it makes conditionals true whenever the antecedent is false, which clashes with intuition. The Stalnaker-Lewis possible worlds semantics handles some cases well but struggles to validate the Ramsey test without running into triviality or requiring metaphysically heavy machinery. So when your friend said that the non-propositional view at least takes the Ramsey test seriously, they were highlighting a major virtue of their position. The choice here is essentially between a view that gets the logic and embedding right but struggles with probability and intuition, versus a view that gets the probability and intuition right but struggles with logic and embedding. Neither side has a knockout punch, which is why you both ended up in a circle.

  So where does that leave us in terms of who was right overall? I think you were both right about the specific technical claims you made, but your friend has the slightly stronger overall position regarding the implications of the triviality results. You were correct that triviality does not logically force us to abandon propositions if we accept context dependence or non-classical semantics, but your friend was correct that these maneuvers are costly and that the most natural reading of the results is that conditionals are not standard propositions. The current consensus in the field is somewhat split, but there is a growing movement toward what we might call a hybrid view or a refined non-propositionalism. Many philosophers now accept that conditionals do not express propositions in the standard sense but instead update the common ground or express constraints on credence, while still trying to solve the embedding problem through dynamic semantics or probabilistic logic. The triviality results are taken as devastating for the simple view that conditionals are truth-conditional propositions whose probability is simply the probability of their truth, but they are not seen as the end of all truth-conditional approaches if one is willing to complicate the semantics significantly.

  If I were to place a bet on where the field is heading, I would say that the pure truth-conditional view is losing ground to views that incorporate insights from the non-propositional camp, such as the idea that conditionals are fundamentally about supposition rather than description. However, nobody is ready to completely abandon the idea that conditionals have some kind of content that can be manipulated logically. So you were right to defend the possibility of truth conditions, but your friend was right to insist that the triviality results show those truth conditions cannot be simple, classical, or invariant. You both identified the real tension in the literature, which is between the logical behavior of conditionals and their probabilistic behavior. My advice is to stop trying to prove one of you wrong and instead recognize that you were arguing over two different ways of managing the same inevitable theoretical cost. Neither of you won because there is no winner yet, but you both argued like philosophers who know the literature, drinks or no drinks.
