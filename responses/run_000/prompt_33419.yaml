      *   *The Crucial Insight:* Dennett's point is that the distinction *itself* is flawed. Does narrative theory allow for a story where the distinction between "writing" and "publishing" dissolves? Maybe "oral tradition" or "improvisational theater"?
      *   *Limitation Check:* Is the vocabulary limited, or is the science fuzzy? Dennett argues the science is fuzzy (category error). The narrative vocabulary assumes a distinct Author and Reader. If the brain has neither, the metaphor breaks.

