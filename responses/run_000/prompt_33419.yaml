      *   *Key Terminology:* Ensure I use "story time," "discourse time," "focalization," "retcon," "draft."
      *   *Residue:* The biggest residue is the *absence of an audience*. In the brain, there is no one reading the draft. In fiction, there is always a reader. This is the homunculus problem disguised as narratology.

