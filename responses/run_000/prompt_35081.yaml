      *   **Specific Focus:** Does the "paradox" of self-amending rules exist in software (e.g., metacircular evaluators modifying themselves), or does it rely on legal/social features (authority, interpretation, community) absent in code?
      *   **Final Judgment:** If residue is substantial, is it because engineering is impoverished or because Nomic is less precise than it appears?

