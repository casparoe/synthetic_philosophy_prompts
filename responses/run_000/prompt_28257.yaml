      *   *Response:* A rational agent evaluates *each* offer. If Omega offers a -EV mugging, the UDT agent rejects it. The commitment is to the *decision procedure*, not to *paying*. The decision procedure says "Calculate EV. If Positive, Pay."
      *   *What about the "Actual World" objection?* The user worries about being bankrupt in the *actual* world.
      *   *Response:* In the iterated case, the "actual world" contains both wins and losses. In the single case, the "actual world" is a loss, but the *decision* was still rational ex-ante. Rationality doesn't guarantee winning; it guarantees the best chance of winning.

  8.  **Final Structure:**
