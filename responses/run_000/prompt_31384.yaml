          *   Update: Does $P(H | x)$ increase?
          *   The "Paradox" arises if we assume a specific sampling scheme (uniform over all objects) and a specific prior structure.
          *   The "Resolution" usually involves showing that under realistic sampling schemes (e.g., sampling ravens specifically) or realistic priors (size of sets), the likelihood ratio for a red apple is negligible compared to a black raven.

