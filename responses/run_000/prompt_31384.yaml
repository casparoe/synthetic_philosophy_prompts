  2.  **Deconstruct the Raven Paradox (Standard Philosophical Formulation):**
      *   *Hypothesis ($H$):* All ravens are black ($\forall x, R(x) \to B(x)$).
      *   *Contrapositive ($H'$):* All non-black things are non-ravens ($\forall x, \neg B(x) \to \neg R(x)$).
      *   *Nicod's Criterion:* An observation confirms a hypothesis if it is a positive instance (e.g., Black Raven confirms $H$).
      *   *Equivalence Condition:* Evidence confirming $H$ confirms any logically equivalent $H'$.
      *   *Paradox:* A red apple (non-black, non-raven) confirms $H'$. Therefore, it confirms $H$.
      *   *Intuition:* A red apple shouldn't tell us anything about ravens.

  3.  **Translate to Data Science Vocabulary:**

      *   *Hypothesis:* A classifier or a rule in a hypothesis space. Let's call the target concept $C$. $C(x) = 1$ if $x$ is a Black Raven, $0$ otherwise? No, the hypothesis is a universal claim. In ML, universal claims are often treated as constraints on the support of a distribution or a hard classification rule with zero tolerance for error. Let's frame it as a probabilistic classification task or a constraint on the joint distribution $P(R, B)$.
      *   *Logical Equivalence:* In logic, $A \to B \equiv \neg B \to \neg A$. In probability/ML, this maps to constraints on the joint probability table. $P(R=1, B=0) = 0$.
      *   *Instance Confirmation:* Updating the posterior probability of the hypothesis given a data point. $P(H | D) > P(H)$.
      *   *Sampling:* This is the crux. How did we get the data point? Random sampling from the population of *objects*? Or sampling from the population of *ravens*? Or *black things*?
      *   *Likelihood:* $P(D | H)$.
      *   *Prior:* $P(H)$.

      *   *Drafting the Translation:*
