          *   If we sample from *All Objects*: Observing a Red Apple reduces the mass of the "Non-Black" bucket slightly, increasing the proportion of that bucket that *could* be Ravens if the hypothesis were false. Wait, that's the standard Bayesian math (Good's solution).
          *   If we sample from *Ravens*: Observing an Apple is impossible (probability 0). The data point is irrelevant.
