      *   *Setup:* Define the feature space $X = \{\text{Raven}, \text{Non-Raven}\} \times \{\text{Black}, \text{Non-Black}\}$.
      *   *Hypothesis:* A hard constraint on the joint distribution. $P(\text{Raven}, \text{Non-Black}) = 0$.
