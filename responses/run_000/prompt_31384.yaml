prompt: |-
  I work as a data scientist — I build classifiers, run A/B tests, think about sampling bias and likelihood ratios all day. I don't have any formal philosophy training, but I've been reading about Hempel's raven paradox on my own and I can't stop turning it over.

  Here's what I understand so far. The generalization "all ravens are black" is logically equivalent to "all non-black things are non-ravens." There's a plausible-sounding intuition that an instance of a generalization confirms it: spotting a black raven confirms "all ravens are black." But by that same logic, spotting a red apple — a non-black non-raven — confirms "all non-black things are non-ravens," and since that claim is logically equivalent to the original one, the red apple should confirm "all ravens are black." That feels wrong, and the puzzle is explaining why.

  I want you to restate this whole package — the logical equivalence, the instance-confirmation intuition, the counterintuitive result, and the main moves philosophers have made to resolve it — in the vocabulary I actually use: hypothesis classes, training examples, likelihood functions, prior and posterior probabilities, sampling procedures, the distinction between the data-generating process and the model, maybe something from the kind of reasoning you'd do when debugging a classifier that's picking up on spurious correlations. Be as precise as you can with the translation. Don't just tell me the Bayesian resolution in passing; I want to see every piece of the paradox earn its keep in the new vocabulary or else be marked as untranslatable.

  Then give me the residue report. Which parts of the paradox map cleanly onto how a data scientist thinks about evidence? Which parts did you have to fudge or distort to make them fit, and what did the distortion consist in? And is there anything philosophers are arguing about here that has no counterpart in my vocabulary at all — and if so, is that because my vocabulary is missing something important, or because the philosophical dispute turns out to be less substantive than it looks once you cash it out in terms of sampling and likelihood?
