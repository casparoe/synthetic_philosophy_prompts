answer: |-
  You have identified a genuine and significant gap in the informal literature. Your skepticism is well-founded: the step from the Dutch Book Argument (DBA) for **probabilism** (coherence of credences) to the DBA for **expected utility maximization** (rationality of acts) is not merely an extension; it requires fundamentally different machinery and additional, load-bearing assumptions.

  In fact, many philosophers argue that there is no direct "Dutch Book Argument" for Expected Utility Maximization (EUM) in the same sense as there is for Probabilism. Instead, the justification for EUM usually comes from **Representation Theorems** (like Savage's or Ramsey's), which are structurally different from the pragmatic Dutch Book setup.

  Here is an explanation of where the arguments diverge, the assumptions required to bridge the gap, the role of the Sure-Thing Principle, and the limitations of the extension.

  ### 1. The Divergence: Prices vs. Preferences

  The standard DBA for credences operates on **betting quotients**. It assumes:
  1.  You have a degree of belief $P(H)$.
  2.  You are willing to buy/sell a bet paying \$1 if $H$ is true at price $\$P(H)$.
  3.  Utility is **linear in money** (risk neutrality regarding the stakes).

  If your $P$ violates the probability axioms, a bookmaker can construct a static set of bets that guarantees a loss.

  **The Divergence Point:**
  When moving to **acts**, we are no longer dealing with bets on propositions with fixed monetary payoffs. We are dealing with mappings from states of the world to outcomes ($A: S \rightarrow O$). To evaluate these, you need two things:
  1.  A probability function over states ($P$).
  2.  A utility function over outcomes ($U$).

  The DBA for credences *presupposes* the utility function (it assumes $U(\$x) = x$). It cannot derive EUM for general acts because it has no mechanism to measure utility independent of probability. If you are risk-averse, your betting quotients will not match your credences, and the DBA for probabilism actually fails (a point we will return to).

  To get from credences to acts, you must disentangle $P$ and $U$. The DBA alone cannot do this.

  ### 2. The Bridge: Ramsey's Measurement and Representation Theorems

  To justify EUM, philosophers typically rely on **Frank Ramsey's** approach or **Leonard Savage's** Representation Theorem. These are often conflated with the Dutch Book argument, but they are distinct.

  **Ramsey's Insight:**
  Ramsey showed that you can derive both probability and utility simultaneously from an agent's **preferences over gambles**.
  *   You don't assume the agent bets at their credences.
  *   Instead, you find an "ethically neutral" proposition $N$ (one the agent doesn't care about truth-wise) and ask what odds they would take on $N$ to make them indifferent between two outcomes.
  *   This allows you to construct a utility scale and a probability scale simultaneously.

  **Where the DBA logic enters:**
  Once $P$ and $U$ are derived from preferences, the argument for EUM becomes: *If your preferences violate the axioms of EUM (e.g., transitivity, independence), you can be money-pumped.*

  This is a **Dynamic Dutch Book (Money Pump)** argument, not a static one.
  *   **Static DBA (Credences):** You accept a set of bets *now* that guarantees a loss.
  *   **Dynamic Money Pump (Acts):** You make a sequence of choices based on your preferences that leads you to pay to swap options in a cycle ($A \to B \to C \to A$), ending up with less money than you started.

  ### 3. The Load-Bearing Role of the Sure-Thing Principle

  You asked specifically about the **Sure-Thing Principle (STP)**. In the context of extending coherence to acts, STP (or the **Independence Axiom** in von Neumann-Morgenstern theory) is indeed the load-bearing structural assumption.

  In the DBA for credences, the linearity of expectation is mathematically trivial because the payoff is fixed (e.g., \$1).
  $$ \text{Value of Bet} = P(H) \times \$1 + (1-P(H)) \times \$0 $$

  For general acts, the value is:
  $$ \text{Value of Act} = \sum P(s_i) \times U(outcome_i) $$

  For this equation to hold, the evaluation of the act must be separable into state-probabilities and outcome-utilities. **This separability is exactly what the Sure-Thing Principle guarantees.**

  *   **Savage's STP:** If you prefer Act $f$ to Act $g$ given state $E$, and you also prefer $f$ to $g$ given state $\text{not-}E$, then you should prefer $f$ to $g$ unconditionally.
  *   **Why it's needed:** Without STP, your preference for an outcome might depend on the state in a way that cannot be captured by $P(s) \times U(o)$. For example, you might value \$100 differently depending on *how* you got it (the state), even if the purchasing power is the same.
  *   **In the Dutch Book context:** If you violate STP, a bookmaker cannot necessarily construct a *static* Dutch Book. However, they can construct a *dynamic* strategy where they offer you trades based on partial information that exploit your state-dependent valuation, leading to a sure loss over time.

  So, while the static DBA for credences relies on the **axioms of probability**, the argument for EUM over acts relies on the **axioms of preference** (specifically Independence/STP) to ensure that the "expectation" calculation is valid.

  ### 4. Additional Assumptions Needed

  To make the argument work for acts rather than just bets, you must add these assumptions, which are not required for the credence-only DBA:

  1.  **Risk Neutrality (for the standard DBA):** As mentioned, the standard DBA for credences assumes utility is linear in the betting stake. If you are risk-averse, your betting quotient for a \$100 bet will differ from a \$1 bet, even for the same proposition. To fix this, you need the Ramsey/Savage machinery to measure utility separately.
  2.  **State-Independent Utility:** You must assume that the utility of an outcome is invariant across states (except for the instrumental value of the state). If your utility for "being healthy" depends on whether "it is raining," standard EUM breaks down.
  3.  **Completeness and Transitivity of Preference:** The DBA for credences assumes you have a price for every proposition. The argument for acts assumes you have a preference ordering for every pair of acts.
  4.  **The "Bookmaker" Capability:** For acts, the bookmaker must be able to offer you the act itself or a counter-act. In the credence case, they offer a bet. In the act case, they must be able to replicate the consequences of the act to facilitate the money pump.

  ### 5. Known Limitations and Failures

  Your intuition that the extension is not straightforward is supported by major counter-examples in decision theory.

  **A. The Allais Paradox (Violation of Independence/STP)**
  Many rational agents violate the Independence Axiom (the probabilistic version of STP). They prefer a sure gain over a high-probability gain, but reverse that preference when both probabilities are scaled down.
  *   **Implication:** If these agents are "rational," then the Dutch Book/Money Pump argument for EUM fails, because it proves too much (it labels these agents irrational). Defenders of EUM argue these agents *are* vulnerable to money pumps, but the debate remains open.

  **B. Risk Aversion and the DBA for Probabilism**
  This is the most technical limitation. If an agent is risk-averse regarding money, their betting quotients will not sum to 1.
  *   *Example:* An agent with $P(H) = 0.5$ might only pay \$0.40 for a \$1 bet because the marginal utility of the potential loss hurts more than the gain helps.
  *   *Result:* A bookmaker can Dutch Book them *even if their credences are probabilistically coherent*.
  *   *Fix:* You must define bets in terms of **utils**, not money. But since utils are unobservable, this makes the pragmatic DBA toothless. This is why modern epistemology often prefers **Accuracy Arguments** (Joyce) over Dutch Book arguments for credences.

  **C. State-Dependent Utility**
  If utility is state-dependent (e.g., the value of money depends on whether you are alive or dead), Savage's theorem fails. You cannot uniquely recover $P$ and $U$ from preferences. Consequently, the Dutch Book argument cannot uniquely prescribe a specific act as rational, because the "loss" depends on which utility function you impute to the agent.

  ### Summary

  You are correct that the standard presentation glosses over a chasm.

  1.  **Credence DBA:** Proves $P$ must be probabilistic *assuming* linear utility in stakes.
  2.  **Act Rationality (EUM):** Requires deriving $U$ and $P$ jointly from preferences (Ramsey/Savage).
  3.  **The Link:** The **Sure-Thing Principle (or Independence)** is the load-bearing assumption that allows the aggregation of state-relative values into a global expected utility. Without it, the expectation formula is invalid.
  4.  **The Mechanism:** The argument shifts from a **Static Dutch Book** (sure loss on a portfolio of bets) to a **Dynamic Money Pump** (sure loss on a sequence of preference-driven choices).
  5.  **Limitations:** The argument falters under risk aversion (regarding stakes), state-dependent utility, and observed violations of Independence (Allais).

  The "Dutch Book Argument for EUM" is best understood not as a direct extension of the betting argument, but as a **pragmatic interpretation of a Representation Theorem**. It tells us that if our preferences violate the axioms of EUM (specifically STP/Independence), we are vulnerable to exploitation, but this requires a much richer set of assumptions than the credence case.
