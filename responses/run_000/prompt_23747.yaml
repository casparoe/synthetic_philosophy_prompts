      *Key Insight to convey:* The DBA for credences proves you need *a* probability function. It does not prove you need to maximize *expected utility* unless you already assume utility is linear in the betting stakes. To get general EUM, you need a Representation Theorem (Savage/Jeffrey/Ramsey), which uses axioms like STP, not just a Dutch Book setup.

