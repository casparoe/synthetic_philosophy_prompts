  7.  **Final Polish:** Ensure the tone is respectful of the user's sophisticated understanding. They aren't asking for Intro 101; they are asking for technical philosophical clarification. Use terms like "Representation Theorem," "Ramsey," "Savage," "Money Pump," "Risk Neutrality."

