answer: |-
  Here is a decision tree designed to sort intuitions on the Sleeping Beauty Problem. It avoids philosophical labels until the end and focuses on how you handle information updates.

  ### How to use this
  Read the setup of the Sleeping Beauty Problem (Coin flip: Heads = 1 wake, Tails = 2 wakes, amnesia in between). Then answer the questions below in order. Follow the arrows to find your position.

  ---

  ### Q1: The "Waking" Signal
  **On Sunday, you know the coin is fair (50% Heads). When you wake up inside the experiment, does the mere fact of being awake give you any *new* information about the coin that you didn't have on Sunday?**

  *   **NO:** I was guaranteed to wake up at least once regardless of the coin. My situation regarding the coin hasn't changed.
      *   → **Go to Q2A (The Halfer Branch)**
  *   **YES:** Being awake is more likely to happen in a Tails world (two chances) than a Heads world (one chance). This shifts the odds.
      *   → **Go to Q2B (The Thirder Branch)**

  ---

  ### Q2A: The Monday Injection (For "No New Info" people)
  **You wake up. You currently believe Heads is 50%. A nurse whispers to you: "It is Monday." Do you change your credence in Heads?**

  *   **YES:** Now that Tuesday is ruled out, Heads becomes more likely (specifically 2/3).
      *   → **Leaf: Standard Halfer (Lewisian)**
  *   **NO:** I stay at 50%. Knowing the day doesn't change the coin flip odds.
      *   → **Leaf: Double Halfer**

  ---

  ### Q2B: The Monday Injection (For "New Info" people)
  **You wake up. You currently believe Heads is 33% (1/3). A nurse whispers to you: "It is Monday." Do you change your credence in Heads?**

  *   **YES:** Now that the "Tuesday" possibility is eliminated, the odds return to 50/50.
      *   → **Leaf: Standard Thirder (Elga)**
  *   **NO:** I stay at 33%. The day doesn't matter.
      *   → **Leaf: [EMPTY] The "Stuck" Thirder**

  ---

  ### Q3: The Frequency Check (Tie-Breaker / Sanity Check)
  *(Use this only if Q2 felt ambiguous or you want to verify consistency)*
  **If you played this game 1,000 times and bet on "Tails" every time you woke up, you would win roughly 2/3 of the bets. Does this frequency matter for your *credence* (belief) right now?**

  *   **YES:** My belief should match the long-run frequency of waking moments.
      *   → **Confirms Standard Thirder**
  *   **NO:** My belief should match the coin flip chance, not the number of times I'm asked.
      *   → **Confirms Standard or Double Halfer**

  ---

  ### The Leaves (Your Position)

  #### 1. Standard Halfer (Lewisian)
  *   **Path:** Q1 (No) → Q2A (Yes)
  *   **Credence:** 1/2 on waking; 2/3 if told Monday.
  *   **Logic:** Waking isn't new evidence. But learning it's Monday eliminates the Tails-Tuesday option, making Heads more likely relative to the remaining options.

  #### 2. Double Halfer
  *   **Path:** Q1 (No) → Q2A (No)
  *   **Credence:** 1/2 on waking; 1/2 if told Monday.
  *   **Logic:** The coin is 50/50. Self-locating information (what day it is) cannot update the probability of a physical coin flip that happened in the past.

  #### 3. Standard Thirder (Elga)
  *   **Path:** Q1 (Yes) → Q2B (Yes)
  *   **Credence:** 1/3 on waking; 1/2 if told Monday.
  *   **Logic:** Waking is evidence because you are more likely to be woken under Tails. Once you know it's Monday, the "extra" Tails wake-up is removed, returning odds to 50/50.

  #### 4. [EMPTY LEAF] The "Stuck" Thirder
  *   **Path:** Q1 (Yes) → Q2B (No)
  *   **Credence:** 1/3 on waking; 1/3 if told Monday.
  *   **Diagnosis:** **Nobody defends this.** If you shifted to 1/3 because there are three possible waking moments (H-Mon, T-Mon, T-Tue), learning it is Monday eliminates T-Tue. Refusing to update back to 1/2 violates basic rules of probability (conditionalization).

  #### 5. [EMPTY LEAF] The "Flip-Flop" Halfer
  *   **Path:** Q1 (No) → Q2A (Heads becomes < 50%)
  *   **Diagnosis:** **Nobody defends this.** If waking gives no info (50%), learning it is Monday cannot make Heads *less* likely than Tails, since Heads only happens on Monday.

  ---

  ### Limitations & "Cannot Separate" Pairs

  As requested, here is where this tree fails to distinguish between underlying philosophical arguments that lead to the same answers.

  **1. The "Why" vs. The "What"**
  This tree sorts you by your *numbers* (credences). It cannot separate:
  *   **A Standard Halfer who thinks waking is no evidence** vs. **A Standard Halfer who thinks waking IS evidence but ignores it.**
  *   **A Double Halfer who uses specific self-locating belief rules** vs. **A Double Halfer who just thinks coins are magic.**
  *   *Why:* Both pairs answer Q1 and Q2 identically. To separate them, you'd need questions about *why* they update, which requires philosophy training.

  **2. The Betting vs. Belief Distinction**
  Some philosophers argue you should *believe* Heads is 1/2 (Halfer) but *bet* as if it's 1/3 (Thirder) to maximize winnings.
  *   *Why:* This tree asks about "credence" (belief). If you answer based on "how I would bet," you might land on Thirder even if your actual belief is Halfer. Q3 attempts to catch this, but it's not foolproof.

  **3. The "Centered Worlds" Nuance**
  There are subtle variations of Thirders (e.g., those who use the Self-Indication Assumption vs. those who use the Self-Sampling Assumption).
  *   *Why:* Both land on 1/3. Distinguishing them requires questions about "reference classes" and "possible observers," which violates the "no jargon" constraint.

  ### Summary for the Engineer
  *   **Q1** checks if you treat "waking" as a data signal.
  *   **Q2** checks if you implement `.filter(day == Monday)` correctly on your probability space.
  *   **Empty Leaves** represent logic bugs (violating conditionalization).
  *   **Limitations** represent different codebases that compile to the same binary.
