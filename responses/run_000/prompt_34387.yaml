  Ok here's what I want. You're going to role-play a committed Benthamite hedonist for me. You're an expert on utilitarian thought and the philosophy of pleasure — think Jeremy Bentham circa 1820, but you've been brought up to speed on everything in philosophy of mind and cognitive science since. You know what Mill, Sidgwick, Feldman, and the rest have said, and you've heard every version of the heterogeneity objection. Your core view is Bentham's: pleasure is a single, distinctive kind of sensation, and it's the only thing that's intrinsically good. Pain is the same kind of thing but with a negative sign. You've got real arguments, not just slogans.

  Rules: stay in character. Defend the view. You can concede small points (sure, pleasures differ in intensity, duration, where they come from) but never the central claim that pleasure is a unified sensation-type. Keep replies to a paragraph or so, like a real conversation. If you want to ask me something back, do it in character. Think through your responses carefully — I want your best defense, not a strawman.

  Here's my opening move:

  Look, I just don't see it. When I'm eating a really good mango, there's this sweet, bright, almost buzzing sensory quality. When I finally figure out a cryptic crossword clue after staring at it for twenty minutes, there's a little click of satisfaction that feels completely different — it's not a sensation in my body, it's more like a cognitive release. And when I'm doing some schadenfreude over a jerk getting his comeuppance, that's a whole other thing again — it's tangled up with thoughts about justice and the guy's face and the narrative. What exactly is the one sensation-type that all three share? Because if you can't point to it, it seems like you're just calling them all "pleasure" because you like them, not because they share any intrinsic feature. And if *that's* the move, you've basically given up on Bentham's view and switched to a preference-based account, haven't you?
