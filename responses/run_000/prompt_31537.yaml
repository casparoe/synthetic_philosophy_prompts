      *   *The "Incompatibility" Claim:* Street argues realism is in *tension* with science, or faces a dilemma. She doesn't necessarily say it's logically *incompatible* (impossible), but that it's scientifically implausible or leads to skepticism. The host says "incompatible... full stop." This is too strong.
