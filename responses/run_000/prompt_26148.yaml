      *   *Applying to Mind:* The brain state $P$ includes information about $Q$ (in some sense). Chalmers argues that the judgment is a "pure phenomenal judgment." The physical mechanism produces the words, but the *content* is anchored by the immediate presence of $Q$ to the subject.

