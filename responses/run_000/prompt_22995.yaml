prompt: |-
  I cover science and ideas for a weekly magazine, and I also sit on the advisory board of a nonprofit fact-checking initiative that rates official and political claims. Last fall, at a press conference ahead of a state emergency-management hearing, a regional official said that the September storm "was one of the most powerful to hit the state in recorded history." Our desk pulled the data. By peak sustained wind speed — the meteorological standard for a storm's intensity — the storm ranks eleventh among the state's named storms; by minimum central pressure, nineteenth; by economic damage, fourth. The board is now split on how to rate the claim, and I've been asked to circulate a short written opinion before Thursday's meeting.

  One editor wants to rate it false. Her argument, which a philosopher on the board has labeled supervaluationism, is that a vague claim is true only if it comes out true under every reasonable way of making it precise: "one of the most powerful" has no sharp cutoff, and since a reasonable reading — say, the top five, or the top ten by wind speed — excludes the storm, the claim is not true. The other editor objects that this misdescribes the semantics. He calls his position epistemicism, in the sense associated with Timothy Williamson: there is a fact of the matter about whether an eleventh-ranked storm counts as "one of the most powerful"; the boundary is simply beyond our cognitive reach; and a fact-checker's job is to report the best available evidence about which side of the boundary we're on, not to apply a truth rule that would condemn most of the vague claims people actually make. I lean toward the second view, but I'm not sure it survives contact with the practical constraint that our ratings come from a fixed menu — true, mostly true, misleading, false, unverifiable — and I'd rather have the opinion argue the case than assume it.

  Please draft the memo I'll circulate. It should recommend a concrete rating for the storm claim and a standing rule for how the desk should treat vague claims generally — claims built on predicates like "one of the most," "largely," or "most" that lack a sharp cutoff. I want it to engage both positions seriously, including the strongest version of whichever one it recommends against, and to say plainly what a reader of the fact-check should take away from the storm claim either way. If the memo concludes that our rating menu itself is part of the problem, it should say so and propose what to do about it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas journalist, Advisory Board Member of a nonprofit fact-checking initiative.
      *   **Task:** Draft a short written opinion (memo) for the board meeting before Thursday.
      *   **Context:** A regional official claimed a September storm was "one of the most powerful to hit the state in recorded history."
      *   **Data:** Storm ranks 11th by wind speed, 19th by pressure, 4th by damage.
      *   **Conflict:** Board is split on how to rate the claim.
          *   *Editor 1 (Supervaluationism):* Rate "False." Vague claims are true only if true under *every* reasonable precisification. 11th isn't top 5 or 10 (reasonable cutoffs), so it's false.
          *   *Editor 2 (Epistemicism/Williamson):* Rate based on best evidence of the hidden boundary. 11th might be on the "true" side. Fact-checkers shouldn't condemn normal vague language.
      *   **My Stance:** Lean toward Editor 2 (Epistemicism), but worried about the fixed rating menu (True, Mostly True, Misleading, False, Unverifiable).
      *   **Requirements:**
          *   Recommend a concrete rating for *this* claim.
          *   Recommend a standing rule for vague claims ("one of the most," "largely," etc.).
          *   Engage both positions seriously (steelman the opposing view).
          *   State plainly what the reader should take away.
          *   Address the rating menu constraint if it's part of the problem.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Supervaluationism:* Truth requires stability across all acceptable precisifications. If "most powerful" could mean top 5, top 10, or top 3, and the storm is #11, it fails the top 5 and top 10 tests. Therefore, it's not *supertrue*. In fact-checking terms, this leans toward "False" or "Misleading" because the claim isn't robust.
      *   *Epistemicism:* There is a sharp cutoff (e.g., top 12 is "one of the most," top 13 is not), we just don't know it. We use context and usage to estimate where we are. #11 is likely close enough to the top to count in common parlance. This leans toward "True" or "Mostly True."

  3.  **Evaluate the Data vs. the Claim:**
      *   Claim: "One of the most powerful."
      *   Metric: Power/Intensity.
      *   Data: Wind (#11), Pressure (#19), Damage (#4).
      *   Nuance: "Powerful" usually implies meteorological intensity (wind/pressure), but the public often conflates this with impact (damage). The official said "powerful," not "costly."
      *   If we stick strictly to wind (meteorological standard), #11 is borderline. Is #11 "one of the most"? In a list of 100+ named storms, top 10% is often considered "one of the most."
      *   Supervaluationist worry: If a reasonable person thinks "most powerful" means "Top 5," this claim fails.
      *   Epistemicist hope: In common usage, "one of the most" is flexible. #11 is close enough to the top tier to be acceptable without being a lie.

  4.  **Determine the Recommendation:**
      *   I lean toward Epistemicism (Editor 2). Why? Because Supervaluationism makes almost all political language "False." Politicians *always* speak vaguely. If we rate "one of the most" as False unless it's Top 3, we lose credibility with readers who know language is flexible.
      *   However, the fixed menu is a problem. "True" feels like a stretch for #11 wind speed. "False" feels pedantic. "Mostly True" is the natural home for epistemic uncertainty.
      *   *Decision:* Recommend "Mostly True." It acknowledges the claim is substantively correct (it *is* a high-ranking storm) but flags the ambiguity (it depends on the metric).
      *   *Standing Rule:* Adopt a "Contextual Epistemicism" approach. Don't demand universal precisification (Supervaluationism). Instead, ask: "Is this within the range of reasonable interpretation given the context?" If yes, rate based on the preponderance of evidence. If the claim relies on a metric where it fails badly (e.g., Pressure #19), note that.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (recommendation on the Storm Claim and Vague Predicate Policy).
      *   **The Specific Claim:** Analyze the storm data. Acknowledge the Supervaluationist strength (rigor) but highlight its weakness (linguistic alienation). Support the Epistemicist view (usage matters) but note its risk (subjectivity).
      *   **The Recommendation:** "Mostly True." Why? Because #11 wind is high, #4 damage is very high. "Powerful" is ambiguous enough to encompass impact.
      *   **The Standing Rule:** How to handle "one of the most."
          *   Reject strict Supervaluationism (it breaks the tool).
          *   Adopt a "Reasonable Interpretation" standard (Epistemicism lite).
          *   If a claim holds up under the *most common* interpretation, it passes, even if it fails under *strict* interpretations.
      *   **The Menu Problem:** Acknowledge that "True/False" binaries don't fit vague predicates. "Mostly True" is the escape valve. If we didn't have that, we'd need to add "Context Needed" or similar.
      *   **Reader Takeaway:** What should the audience learn? That the storm was historically significant, but "powerful" is a composite idea, not just wind speed.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Did I steelman the Supervaluationist enough?
      *   *Fix:* Explicitly state that their concern protects against "concept creep" where officials call every storm "historic." Acknowledge that without their rigor, we become lapdogs.
      *   *Critique:* Is the Epistemicist view clear?
      *   *Fix:* Clarify that it's not about finding a magic number, but about assessing common usage.
      *   *Critique:* Is the rating menu issue addressed?
      *   *Fix:* Yes, explicitly link the "Mostly True" rating to the philosophical compromise.

  7.  **Final Polish:**
      *   Tone: Professional, analytical, decisive but open.
      *   Length: Short enough for a pre-read, long enough to argue the case.
      *   Check constraints: Thursday meeting, concrete rating, standing rule, engage both positions, reader takeaway.

  8.  **Final Review against constraints:**
      *   Recommend concrete rating? Yes (Mostly True).
      *   Standing rule? Yes (Reasonable Interpretation/Preponderance).
      *   Engage Supervaluationism? Yes (acknowledge rigor, reject impracticality).
      *   Engage Epistemicism? Yes (adopt usage-based, warn against subjectivity).
      *   Reader takeaway? Yes (Storm is historic, metric matters).
      *   Menu problem? Yes (Mostly True is the solution).

  *(Self-Correction on the Philosophy)*: Wait, I need to be careful with the term "Epistemicism." Williamson's view is that there *is* a sharp boundary, we just don't know it. The Editor's argument is that we should estimate which side we are on. My recommendation should reflect that we treat the boundary as fuzzy *in practice* even if it's sharp *in theory*, or simply that common usage dictates the boundary. I will frame it as "Usage-Based Epistemicism" to fit the fact-checking context.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Advisory Board, Fact-Check Initiative
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Rating Recommendation: State Storm Claim & Policy on Vague Predicates

  **Purpose**
  This memo recommends a rating for the regional official's claim that the September storm was "one of the most powerful to hit the state in recorded history." It further proposes a standing rule for handling vague predicates ("one of the most," "largely," "historic") to resolve the theoretical split between our Supervaluationist and Epistemicist approaches.

  **The Specific Claim: Recommendation**
  **Rating: Mostly True**

  The data presents a mixed picture: 11th by wind speed (the meteorological standard), 19th by pressure, but 4th by economic damage.

  *   **The Supervaluationist Case (Rate: False):** My colleague argues that "one of the most" is true only if it holds under *every* reasonable precisification. If a reasonable reader interprets "one of the most" as "Top 5" or "Top 10 by wind," the claim fails. This view protects us from "concept creep," where officials label every significant event "historic" or "unprecedented." It ensures our "True" rating retains a sharp, defensible edge.
  *   **The Epistemicist Case (Rate: True/Mostly True):** The opposing view holds that there is a fact of the matter regarding common usage, even if the boundary is fuzzy. In public discourse, "one of the most powerful" often conflates meteorological intensity with societal impact. Given the storm ranks 4th in damage and 11th in wind (likely top 10% of recorded named storms), it falls within the cognitive boundary of "most powerful" for a general audience.

  **Why "Mostly True"?**
  I lean toward the Epistemicist view because strict Supervaluationism renders almost all political language "False." If we rate a claim False because it fails *one* reasonable interpretation (Top 5 wind) while passing another (Top 10% overall; Top 5 damage), we alienate readers who understand language as flexible.

  However, I cannot recommend "True" without qualification. The official invoked "powerful," a meteorological term, yet the storm ranks 19th in pressure. The claim relies on the ambiguity of "powerful" to bridge the gap between wind rank (#11) and impact rank (#4). "Mostly True" captures the Epistemicist insight (the claim is substantively defensible in context) while acknowledging the Supervaluationist warning (the claim does not hold up under the strictest meteorological precisification).

  **Standing Rule: The "Reasonable Interpretation" Standard**
  To prevent future deadlock, I propose we adopt a **Reasonable Interpretation Standard** for vague predicates, modifying our current methodology as follows:

  1.  **Reject Universal Quantification:** We will not require a claim to be true under *every* reasonable precisification (Supervaluationism). This sets the bar too high for natural language.
  2.  **Adopt Preponderance of Usage:** We will assess whether the claim holds under the *most common* or *charitable* interpretation of the phrase in that specific context (Epistemicism).
  3.  **The Ambiguity Penalty:** If a claim relies on ambiguity to pass (e.g., using "powerful" to mean "damaging" when "intense" was implied), we downgrade from "True" to "Mostly True."

  **The Rating Menu Constraint**
  We must acknowledge that our fixed menu (True, Mostly True, Misleading, False) is part of the problem. Supervaluationism appeals to board members because "True" feels like a binary switch. Epistemicism appeals because reality is a spectrum.

  "Mostly True" is the necessary pressure valve for vague predicates. If we remove it, we force a binary that misrepresents the semantics of public speech. I recommend we explicitly codify "Mostly True" as the home for claims that are epistemically sound but semantically flexible.

  **Reader Takeaway**
  Regardless of the philosophical underpinning, the reader must leave the fact-check with a clear understanding of the storm's status. Our published explanation should state:

  > *"While the storm does not rank in the top tier for wind speed or pressure, its economic impact places it among the state's most significant disasters. The official's claim is acceptable in common parlance, provided 'powerful' is understood to include societal impact, not just meteorological intensity."*

  This satisfies the Supervaluationist demand for precision in the explanation, while satisfying the Epistemicist demand for fairness in the rating.

  **Conclusion**
  I urge the board to adopt the "Mostly True" rating for this claim and the "Reasonable Interpretation" standard for future cases. This approach preserves our rigor without demanding a precision from public officials that language itself cannot support.
