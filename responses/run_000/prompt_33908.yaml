      *   *The Regress:* If logical implication is treated as a premise (C: If A & B then Z), one needs another rule to apply C to A & B to get Z. This leads to an infinite regress.
      *   *Standard Solution:* Rules of inference are *rules*, not *premises*. They govern the system; they aren't *in* the system. (Wittgenstein, Carroll himself, many logicians).
      *   *Deeper Issue:* Justification. Why follow the rule? This touches on Wittgenstein's rule-following paradox, Quine's conventionalism, and foundationalism vs. coherentism in epistemology.

  3.  **Analyze Mira's Position:**
