answer: |-
  The rain in the valley didn't fall; it hung in the air, a silver mist that dampened the paper of Elias's notebook faster than he could write. He sat under the eaves of the communal longhouse, the pen hovering over the entry for *tev*.

  It was the only word in his lexicon that refused to sit still.

  Elias had been with the Oara for fourteen months. He was a good linguist. He knew that fluency wasn't about vocabulary lists; it was about mapping the topology of another mind. He had mastered their verb conjugations, which relied on the speaker's distance from the listener. He had navigated their kinship terms, which shifted depending on the season. But *tev* was a knot he couldn't loosen.

  "Mara," he said, looking up as the woman approached. She carried a basket of tubers, her movements fluid despite the mud. She was his primary informant, though she disliked the title. To her, they were just friends sharing fire.

  "Elias," she smiled, crouching beside him. She peeked at the notebook. "Still fighting the *tev*?"

  "It fights me," Elias admitted. He tapped the page. "Yesterday, when we walked by the ridge. The rabbit ran across the path. You said, *'Look, tev.'*"

  Mara nodded, her dark eyes crinkling. "Yes. The *tev* was fast."

  "So *tev* means rabbit."

  "It means *tev*," she corrected gently, the way one corrects a child who calls a river 'water' and misses the current.

  "Okay. But this morning, I saw Joren digging. He found a hole. He pointed inside and said, *'Tev is here.'*"

  Mara shrugged, shifting the basket to her other hip. "The *tev* was in the earth."

  "So *tev* means burrow?"

  "It means where the *tev* is."

  Elias sighed, rubbing his temples. This was the third variation. The first was the animal itself. The second was the hole. The third had come two days ago during a game of tag. A child had darted through the crowd, elusive, laughing, impossible to catch. The elders had clapped and shouted, *"Ah, a true tev!"*

  "I need to know what I'm writing, Mara," Elias said, trying to keep the frustration out of his voice. "In my language, we separate the animal from the hole. We separate the creature from the action of running."

  Mara reached out and touched the back of his hand. Her skin was warm, rough from work. "Your language is very heavy, Elias. So many boxes."

  "It's precise."

  "Is it?" She stood up. "Come. Walk with me."

  They went down into the village. The mist was lifting, revealing the green sweep of the valley. As they walked, Elias watched the world through the lens of his problem. He was looking for the boundary where *tev* stopped and something else began.

  They passed a hunter skinning a hare. The hunter held up the pelt. "Good *tev*," he said.
  *Meaning: Rabbit.*

  They passed a woman sweeping leaves out of a depression in the ground. She pointed to the hollow. "Sleeping *tev*," she said.
  *Meaning: Burrow? Or the space occupied by the rabbit?*

  Then, a sudden commotion. A thief from a rival group, spotted near the stores, sprinted toward the tree line. He was fast, weaving through the trunks. Three Oara men gave chase but stopped at the edge of the forest. The thief was gone.

  Mara shook her head. "Gone like *tev*."

  Elias stopped walking. "Mara, stop."

  She turned.

  "I have a theory," Elias said. "Maybe *tev* isn't a noun. Maybe it's an event. A 'rabbiting.' Like... a flash of presence. When the rabbit is there, it is *tev*. When the hole is there, it is the place of the 'rabbiting.' When the man runs, he is embodying the 'rabbiting.'"

  Mara listened patiently. She didn't look impressed, nor confused. She looked at him with a mild, affectionate pity. "You want to know if the *tev* is the fur, or the foot, or the running?"

  "Yes."

  "And if I tell you?"

  "Then I can write it down. I can take it home."

  Mara stepped closer. She reached into her tunic and pulled out a small carving. It was made of bone, worn smooth by years of handling. It depicted a rabbit, but the legs were elongated, merging into the roots of a tree, and the eyes were hollowed out.

  "This is *tev*," she said.

  "It looks like a rabbit," Elias said.

  "And the hole is the eyes," Mara said. "And the running is the legs becoming roots. You cannot cut the leg from the root without killing it."

  "But in reality, they are separate things. The rabbit exists without the hole. The hole exists without the rabbit."

  "Does it?" Mara asked. "If there is no hole, is it still a *tev*? Or is it just meat? If there is no running, is it a *tev*? Or is it a stone?"

  She handed him the carving. "Keep it. For your book."

  Elias took the bone. It was light, warm from her body. He looked from the carving to his notebook. He looked at the word *tev* written in his careful, angular script.

  He realized then that he was asking the wrong question. He was asking for a definition, but the Oara didn't deal in definitions. They dealt in contexts. To ask "What is *tev*?" outside of a specific moment was like asking "What is 'here'?" without pointing to a location. 'Here' changes every time you move. Perhaps *tev* changed every time the world shifted.

  Or perhaps, Elias thought with a sudden chill, the Oara saw the world as a continuous flux of events, and he was the one hallucinating static objects. Maybe there was no "rabbit." There was only a bundle of sensations—fur, movement, earth, evasion—that his brain insisted on gluing together into a single noun. The Oara simply glued them differently.

  "Will you write it?" Mara asked.

  "I have to," Elias said. "The university expects a manual."

  "And what will you write?"

  Elias looked down at the page. He had three columns: *Noun*, *Verb*, *Context*.
  If he wrote *Rabbit*, he lied about the burrow.
  If he wrote *Prey*, he missed the child playing.
  If he wrote *Evasion*, he lost the animal.

  He uncapped his pen. The ink flowed black and permanent.

  "I will write..." Elias paused. He looked at Mara. She was watching him, not with anxiety, but with a serene curiosity. She didn't seem to care what he wrote. To her, the word worked perfectly well. The friction existed only in his mind, in the grinding gear of his own grammar trying to mesh with hers.

  Was he missing a subtle distinction they all understood? A metaphysical secret hidden in the phoneme *t-e-v*?
  Or was he trying to force a river into a square bottle?

  "I will write," Elias said slowly, " *Tev: (see note).* "

  Mara smiled. "And the note?"

  Elias looked at the bone carving in his hand. The rabbit that was a hole that was a run. He thought about the thief vanishing into the trees. He thought about the silence of the burrow.

  "The note will say," Elias murmured, mostly to himself, " *A presence that is defined by its departure.* "

  Mara tilted her head. She didn't agree, and she didn't disagree. She simply touched his shoulder, turned, and walked back toward the longhouse.

  Elias sat in the mud for a long time. He wrote the note. Then he crossed it out. He wrote *Rabbit (approx.)*. Then he crossed that out.

  Finally, he closed the notebook. He put the bone carving in his pocket, next to his pen. He would decide in the morning. Or perhaps he would leave the page blank, a white space in the manual where the translation should be, a silent acknowledgment that some things fit the mouth but not the page.

  The mist came back down, blurring the line between the trees and the air. Elias watched a shadow dart through the tall grass. He couldn't tell if it was an animal, a shift of wind, or a trick of the light.

  "*Tev*," he whispered.

  The grass settled. Nothing answered.
