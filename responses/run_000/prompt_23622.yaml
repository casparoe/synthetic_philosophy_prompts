      *   *Scene 2: The Field.* Elias is with Mara. A rabbit darts by. "Raka!" she says. Elias writes *Rabbit*.
      *   *Scene 3: The Burrow.* Later, they pass a hole. She points. "Raka." Elias writes *Burrow*? No, maybe *Home of Rabbit*.
      *   *Scene 4: The Child.* A kid runs past, dodging a game. Mara laughs. "Little Raka." Elias writes *Quick one*.
      *   *Scene 5: The Confrontation/Conversation.* Elias tries to ask "Is *Raka* the animal or the hole?" Mara smiles, touches his arm. "It is the Raka." She offers a story or a gesture that encompasses all of it.
      *   *Scene 6: The Departure.* Elias finishes the lexicon. He stares at the page for *Raka*.

  5.  **Refining the Philosophy (without lecturing):**
      *   Instead of explaining "stimulus meaning," show Elias testing it. He points, he waits for assent/dissent. He gets assent for all variations.
      *   The frustration shouldn't be "they are confusing," it should be "my language requires a distinction theirs does not."
      *   The ambiguity of the ending: Did he fail to learn the *real* meaning, or did he succeed in learning that there *is* no single real meaning in the way he expects?

  6.  **Writing - Focusing on Sensory Details:**
