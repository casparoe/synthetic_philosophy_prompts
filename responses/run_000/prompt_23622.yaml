      *   **Rising Action:** Three specific scenes showing the ambiguity.
          1.  Seeing a rabbit.
          2.  Seeing a burrow/trace.
          3.  Seeing a person acting quickly.
      *   **Climax:** A conversation with Mara where he tries to pin it down. She responds in a way that satisfies the community but not his logic.
      *   **Falling Action:** Elias packs up. He writes the manual.
