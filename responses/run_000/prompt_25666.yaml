prompt: |-
  I teach a philosophy of biology course, and each year we spend two weeks on definitions of life. Before I assign the standard papers again, I want to give my students a clear statement of what any adequate definition must accomplish — the desiderata. Please write the list.

  What must a definition of life get right? Include the cases it must classify correctly (or explain why they resist classification), the distinctions it must not collapse (e.g., living versus capable-of-living, individual organism versus collective, alive versus once-alive), and results from biology it cannot contradict. For each desideratum, give the case or consideration that motivates it, and flag which are non-negotiable and which reflect commitments a theorist could reasonably abandon.

  Then, briefly, score the main approaches — metabolic, evolutionary, information-based, and any others you take to be serious contenders — against the list. I am most interested in which single requirement does the most to exclude the popular candidates, and whether any pair of desiderata cannot be jointly satisfied, which would make the list itself a result.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Philosophy of Biology students (undergraduate or graduate level).
      *   **Topic:** Desiderata for a definition of life.
      *   **Task 1:** Create a list of desiderata (what a definition must accomplish).
          *   Include specific cases (borderline, clear positives/negatives).
          *   Include distinctions to maintain (alive vs. dead, individual vs. collective, etc.).
          *   Include biological constraints (cannot contradict established science).
          *   Label each as "Non-negotiable" or "Contingent/Debatable."
          *   Provide motivation for each.
      *   **Task 2:** Score main approaches (Metabolic, Evolutionary, Information-based, etc.) against the list.
      *   **Task 3:** Identify the single most exclusionary requirement.
      *   **Task 4:** Identify if any pair of desiderata are incompatible (making the list itself a philosophical result).
      *   **Tone:** Academic, precise, pedagogical, nuanced.

  2.  **Drafting the Desiderata (Task 1):**
      *   *What are the standard problems in defining life?* Viruses, mules, dormant seeds, Gaia hypothesis, AI/synthetic life, dead bodies.
      *   *Desideratum 1: The Clear Cases.* Must include mammals, bacteria, plants. Must exclude rocks, water. (Non-negotiable).
      *   *Desideratum 2: The Borderline Cases.* Must address viruses, prions, mules/sterile hybrids. (Non-negotiable to address, negotiable on *how* to classify).
      *   *Desideratum 3: Temporal States.* Distinguish alive, dead, dormant, not-yet-alive (spore/seed vs. corpse). (Non-negotiable).
      *   *Desideratum 4: Levels of Organization.* Distinguish organism vs. ecosystem vs. gene. (Contingent - some define life at multiple levels).
      *   *Desideratum 5: Multiple Realizability.* Must allow for non-terran life (silicon-based, etc.). (Contingent - Earth-centric vs. universal).
      *   *Desideratum 6: Process vs. Substance.* Life is a process, not just stuff. (Contingent).
      *   *Desideratum 7: Normativity/Function.* Life involves goals/functions (teleology). (Contingent - naturalized teleology).
      *   *Desideratum 8: Continuity with Physics.* Cannot violate thermodynamics (open systems). (Non-negotiable).

      *Refining the List for Clarity and Impact:*
      Let's group them logically: Extension (what falls under it), Intension (what properties), and Modal/Scientific constraints.

      1.  *Extensional Adequacy (Paradigms):* Bacteria, oak trees, humans = Alive. Rocks, fire = Not Alive. (Non-negotiable).
      2.  *The Dead/Dormant Distinction:* Corpse vs. Seed. (Non-negotiable).
      3.  *The Sterile/Ontogenetic Problem:* Mules, worker bees. (Non-negotiable to address).
      4.  *The Viral Boundary:* Viruses, viroids. (Contingent outcome, non-negotiable to address).
      5.  *Multiple Realizability:* Non-carbon chemistry. (Contingent).
      6.  *Thermodynamic Consistency:* Open systems, entropy. (Non-negotiable).
      7.  *Individuality:* Organism vs. Colony. (Contingent).

  3.  **Drafting the Scoring of Approaches (Task 2):**
      *   *Metabolic (Autopoiesis):* Good at boundaries, bad at viruses (they don't metabolize), bad at mules (metabolism doesn't guarantee reproduction).
      *   *Evolutionary (Darwinian):* Good at viruses (if evolving), bad at mules (sterile), bad at first life (no history yet).
      *   *Information/Genetic:* Good at heredity, bad at epigenetics/metabolism-first scenarios.
      *   *Thermodynamic:* Good at physics, bad at distinguishing life from fire/crystals.
      *   *Cluster/Family Resemblance:* Avoids strict definition, but might be unsatisfying for "definition" seekers.

  4.  **Identifying the "Killer" Constraint (Task 3):**
      *   What kills the most theories? Usually, it's the **Mule/Sterile Organism** problem for Evolutionary definitions, or the **Virus** problem for Metabolic definitions.
      *   However, the prompt asks for the *single requirement* that does the most to exclude popular candidates.
      *   *Candidate:* The requirement to classify *individual ontogenetic stages* correctly (e.g., a mule is alive despite being an evolutionary dead end). This kills strict evolutionary definitions.
      *   *Candidate:* The requirement to classify *viruses* consistently. This kills strict metabolic definitions.
      *   *Decision:* The "Sterile Organism" (Mule) constraint is often the sharpest knife against the currently dominant NASA/Evolutionary definition. But the "Virus" constraint is the sharpest against Metabolic.
      *   *Better Angle:* The requirement for **Non-Historical Individual Assessment**. A definition should tell you if *this* thing is alive *now*, not whether its ancestors evolved. This excludes pure evolutionary definitions.

  5.  **Identifying Incompatible Desiderata (Task 4):**
      *   This is the philosophical "punchline."
      *   *Conflict:* **Multiple Realizability** vs. **Earth-Bound Extensional Adequacy.** If we define life based on Earth biology (DNA, proteins), we fail Multiple Realizability. If we define it abstractly (evolution), we fail to capture the specific materiality of Earth life.
      *   *Conflict:* **Sharp Boundaries** vs. **Continuity of Evolution.** Life evolved from non-life. Any sharp line is arguably arbitrary.
      *   *Conflict:* **Individual Organism** vs. **Evolutionary Unit.** The organism is the locus of metabolism, but the lineage is the locus of evolution.
      *   *Selection:* The tension between **Extensional Adequacy (Earth Intuition)** and **Multiple Realizability (Universalism)**. Or, more profoundly, **Synchronic Assessment** (is it alive now?) vs. **Diachronic Assessment** (does it have an evolutionary history?).
      *   *Let's go with Synchronic vs. Diachronic.* To classify a mule as alive, you need synchronic properties. To classify a virus as alive (or not), you often lean on diachronic properties (evolution). To define the *origin* of life, you need diachronic.
      *   *Actually, the strongest tension:* **The Demand for Necessary & Sufficient Conditions** vs. **The Continuity of Nature.** If life evolved gradually, a sharp definition is impossible. This suggests the list itself proves definitions are impossible (pragmatic view).

  6.  **Refining and Polishing:**
      *   Ensure the tone is appropriate for a professor assigning this to students.
      *   Make sure the "Non-negotiable" vs. "Contingent" tags are clear.
      *   Ensure the scoring is fair but critical.
      *   Check the "Single Requirement" and "Incompatible Pair" sections for insight.

      *(Self-Correction during drafting)*: I need to make sure I don't just list properties like "reproduction." I need to list *desiderata for the definition itself*. E.g., "Must distinguish dormant from dead" rather than "Must include dormancy."
      *   Also, ensure I mention the NASA definition explicitly as it's the standard target.
      *   Make sure to distinguish between "Life" (the phenomenon) and "Organism" (the bearer).

  7.  **Final Review against Prompt:**
      *   List of desiderata? Yes.
      *   Cases/Distinctions included? Yes.
      *   Non-negotiable/Contingent flagged? Yes.
      *   Score main approaches? Yes.
      *   Single most exclusionary requirement? Yes.
      *   Incompatible pair? Yes.

  8.  **Final Polish:** Check for clarity and philosophical precision (e.g., distinguishing 'life' as a mass noun from 'living thing' as a count noun). *Decision: Keep it accessible but rigorous.*

