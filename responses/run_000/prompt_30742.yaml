      *   **Section 2: The Mechanism (Symbols in Others).** Confirm this. The "Carol" chapter in *IASL* is key here.
      *   **Section 3: The "Literal Survival" Claim.** This is the meat. Distinguish between "ontological literalness" (yes, the pattern exists) and "practical survival" (no, it's not full consciousness). Use the term "partible soul."
      *   **Section 4: The Fear of Death.** Correct the record. Hofstadter is not stoic about this. He finds it tragic. The summary makes him sound too calm.
