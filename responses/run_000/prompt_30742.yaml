      *   *Is "literally" the right word?* Hofstadter fights against the idea that patterns are "just" metaphors. To him, patterns are as real as atoms. So "literally" is actually something he might insist on, contrary to intuition. I need to explain *why* he insists on that while admitting the limitations.

