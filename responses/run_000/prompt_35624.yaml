answer: |-
  This is a fantastic objection. You and your friend have hit on what is often called the **"Novelty Problem"** or the **"Modality Problem"** for teleosemantics. It's one of the most persistent critiques in the literature (raised by people like Fodor, Sterelny, and Neander).

  The intuition is powerful: Evolution is a backward-looking process. It selects based on *actual* past successes. Content, however, seems to be forward-looking and modal (about what *could* or *would* happen). How does the backward-looking glue of selection history stick to the modal nature of thought?

  To give teleosemantics its best run for the money, we need to show that the objection relies on a category mistake about *what* evolution selected for. It didn't select for mechanisms that track specific past events; it selected for mechanisms that track **stable, projectable regularities**.

  Here is the strongest case that teleosemantics can handle counterfactuals, with a specific focus on why the **Millikan (Consumer)** approach has a significant advantage over the **Dretske (Indicator)** approach here.

  ---

  ### 1. The Dretskean Bottleneck (Why Indicator Semantics Struggles)
  First, let's concede where your friend might have been getting stuck. If you lean heavily on Dretske's **Indicator Semantics**, the counterfactual problem is indeed severe.

  For Dretske, a state $R$ means $S$ if $R$ carries the information that $S$ (covariance) and this covariance was recruited to serve a function. The problem is that information (in the Shannon/Dretske sense) is factive and actualist. $R$ cannot carry the information that "If $P$ were the case, $Q$ would be," because $P$ is not the case. There is no actual covariance between a brain state and a non-actual possible world.

  If teleosemantics were *only* Dretskean indicator semantics, you'd be right: counterfactuals would be inexplicable. But teleosemantics is not monolithic. The resources to solve this lie in the **Consumer-Based** tradition.

  ### 2. The Millikan Advantage: Mapping Rules and Success Conditions
  Ruth Millikan's **Consumer Semantics** shifts the locus of content from the *source* of the signal (the indicator) to the *user* of the signal (the consumer).

  For Millikan, the content of a representation is determined by the **proper function of the consuming system**. A belief state means whatever it needs to mean for the motor/planning system to successfully execute its proper function when guided by that state.

  Here is the steel-man argument for how this handles counterfactuals:

  #### A. Counterfactuals as Maps for Actual Action
  Counterfactual beliefs are not mystical glimpses into alternate universes. They are **guides for action in the actual world**.
  *   **Belief:** "If I drop this glass, it will break."
  *   **Action:** I do not drop the glass.
  *   **Success Condition:** The glass remains unbroken.

  The teleosemantic story is this: My cognitive mechanism has the proper function of producing internal maps that allow the consumer (my motor system) to navigate the environment without incurring fitness costs. The content "If $P$, then $Q$" is fixed by the **mapping rule** required for the consumer to succeed.

  Evolution *did* select for mechanisms that track counterfactual-supporting regularities, because organisms that only tracked actual regularities (e.g., "I touched fire and it burned") died before they could reproduce. Organisms that could project "If I touch fire, it *will* burn" (a future conditional, which is modal) survived.

  The content is fixed not by a history of *counterfactual* successes (which is impossible), but by a history of **actual successes derived from following the map**. If my brain produces the state "If dropped, breaks," and I act to prevent dropping, and the glass remains intact, the consuming system has succeeded. The *truth condition* of the counterfactual is cashed out in terms of the actual-world conditions under which the consumer's guidance would have failed had the antecedent been true.

  #### B. The "Offline Simulation" Account
  Modern teleosemantics (building on Millikan) can integrate cognitive science regarding **simulation**.
  Evolution selected for perception-action loops. At some point, these loops were decoupled to allow for "offline" processing (imagination/planning).
  *   **Proper Function:** The function of the simulation mechanism is to run the perception-action loop *without* triggering actual action, to predict outcomes.
  *   **Content Fixing:** The content of the simulation is fixed by the conditions under which the simulation **matches reality if tested**.

  When you think, "If I took the other job, I'd be happier," you are running a simulation using cognitive mechanisms selected for tracking actual causal regularities (e.g., money $\to$ security, commute $\to$ stress). The *constituents* of the counterfactual (happiness, job, stress) have teleosemantic content grounded in actual history. The *logical form* (the conditional) is a function of the simulation mechanism.

  The selection history fixes the **reliability of the simulator**. If the simulator was not selected to track real causal powers, it would be useless. Therefore, the content of its output is constrained by the causal laws it was selected to model.

  ### 3. Laws vs. Accidents: The Stability Argument
  The deepest objection is: "Evolution tracks constant conjunctions, not laws. But counterfactuals require laws." (e.g., All coins in my pocket are silver, but that doesn't support "If this coin were in my pocket, it would be silver.")

  **The Teleosemantic Reply:** Evolution *cannot* select for sensitivity to accidental regularities because they are not stable over evolutionary time.
  *   Selection operates over deep time.
  *   Mechanisms that track accidental regularities (e.g., "predators only appear on Tuesdays") will fail when the accident changes.
  *   Mechanisms that track **nomic regularities** (causal powers, laws of physics, biological needs) remain successful across variations in the environment.

  Therefore, a mechanism that has a **proper function** (which implies a history of stability) is *by definition* a mechanism selected to track law-like regularities rather than accidents.
  *   If a cognitive state has a proper function, it is because it tracked a stable feature of the world.
  *   Stable features of the world are those that support counterfactuals.
  *   Therefore, the content of a state with a proper function implicitly carries modal force.

  When you believe "This glass would break," the content is fixed by a mechanism selected to track the **fragility** of glass (a causal power), not just the **brokenness** of glass (an actual state). The selection history filters out the accidents, leaving only the projectable (modal) regularities.

  ### 4. Compositional Derived Content
  Finally, we must distinguish between **basic** teleosemantic content and **derived** content.
  *   **Basic:** Concepts like CAUSE, FORCE, OBJECT, SELF. These are fixed directly by selection.
  *   **Derived:** Complex propositions like "If I had taken the other job..."

  Teleosemantics does not need to explain the selection history of every specific counterfactual belief you hold. It only needs to explain the selection history of the **conceptual capacity** to form them.
  *   Evolution selected for a language of thought (or a mapping system) with combinatorial syntax.
  *   The primitive concepts (JOB, HAPPY, ALTERNATIVE) have teleosemantic content.
  *   The logical operators (IF...THEN) are functions of a reasoning mechanism selected for planning.

  The counterfactual content of the complex belief **supervenes** on the teleosemantic content of the primitives + the functional role of the reasoning mechanism. You don't need a gene for "job regret." You need genes for causal reasoning and self-modeling. Once you have those, the counterfactual content is determinate because the constituents are determinate.

  ### Summary of the Strongest Case
  To win this argument, you need to pivot from "Evolution selects for tracking X" to "Evolution selects for systems that *navigate* X."

  1.  **Millikan > Dretske:** Consumer semantics fixes content via success conditions of action, not just covariance. This allows us to define counterfactual truth conditions in terms of actual-world success/failure of the guiding map.
  2.  **Stability implies Modality:** Proper functions require stability over time. Only law-like regularities are stable enough to support proper functions. Therefore, teleosemantic content is inherently law-like, and laws support counterfactuals.
  3.  **Simulation as Function:** The capacity for offline simulation is an adaptation. Its content is fixed by its accuracy conditions relative to the actual world, even when running "what-if" scenarios.
  4.  **Compositionality:** Counterfactuals are constructed from primitive modal concepts (cause, possibility) that *are* fixed by selection.

  **The Knockout Punch:**
  Tell your friend this: *"Teleosemantics doesn't claim evolution selected you to think about specific counterfactuals. It claims evolution selected you to be a creature whose survival depends on acting correctly in situations that haven't happened yet. Any system selected for that purpose must, by definition, have states with counterfactual content. If teleosemantics couldn't explain counterfactuals, it wouldn't be a theory of biological content at all, because biology is inherently about future survival, not just past registration."*

  The "actualist" objection assumes evolution is backward-looking. But **adaptation is forward-looking**. Proper function is about what a trait is *supposed to do* in the future, based on what it did in the past. That "supposed to" is the modal hook teleosemantics needs.
