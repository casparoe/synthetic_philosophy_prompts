      *Mundane:* If I pull the trigger and live, I'm glad.
      *QI:* If I pull the trigger, I *will* live (in my perspective), so I shouldn't worry.
      *The break:* In mundane, the thread can end. In QI, the thread is postulated to be unbreakable.

      *Okay, let's structure the "Heavy Lifting" around three specific imports:*
