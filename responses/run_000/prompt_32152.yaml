prompt: |-
  a friend of mine is really into the quantum immortality thing and he keeps making this analogy: you can never experience being dead, right? from your own perspective you're always alive. so in a many-worlds universe, you just keep finding yourself in branches where you survived. he says quantum immortality is just this mundane point about first-person perspective, nothing spooky or metaphysical. i feel like the analogy is doing some heavy lifting but i can't quite put my finger on where it breaks. can you lay out the mapping — what corresponds to what, what gets imported from the mundane case that doesn't belong in the quantum case — and tell me whether the "nothing to see here" conclusion actually holds up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Quantum Immortality (QI).
      *   **Friend's Argument:** It's mundane, not spooky. Analogy: "You can never experience being dead, so you always find yourself alive." In Many-Worlds (MWI), you just slide into branches where you survive.
      *   **User's Intuition:** The analogy is doing "heavy lifting" (hiding assumptions/problems).
      *   **Task:** Lay out the mapping (mundane vs. quantum), identify what gets imported incorrectly, and evaluate if the "nothing to see here" conclusion holds up.

  2.  **Initial Assessment of the Friend's Claim:**
      *   The friend is echoing a common pop-sci simplification of QI.
      *   The core intuition ("I can't experience non-existence") is true *trivially* (selection bias).
      *   The leap to "Therefore, I will *continue* to exist indefinitely in a quantum multiverse" is where the logic gets shaky.
      *   The "mundane" label is misleading because QI makes specific, testable (in principle), and highly counter-intuitive predictions about probability and aging.

  3.  **Step 1: Analyze the "Mundane" Analogy (Survivorship Bias):**
      *   *Claim:* You can't experience death.
      *   *Reality:* True. If you die, experience stops.
      *   *Implication:* Every moment you are conscious, you are alive.
      *   *Limit:* This doesn't guarantee *future* existence. It only describes the *present* state of a conscious observer. It's a tautology: "If I am experiencing, I exist."

  4.  **Step 2: Analyze the Quantum Immortality Claim (MWI Context):**
      *   *Claim:* In MWI, all outcomes happen.
      *   *Mechanism:* When a life-threatening quantum event occurs, the universe splits. In some branches, you die. In some, you live.
      *   *QI Conclusion:* Your consciousness *must* follow the branch where you live, because you can't experience the branch where you die. Therefore, you never experience death, effectively living forever (or until the probability of survival becomes literally zero).
      *   *Key Assumption:* Consciousness tracks a single continuous thread through the multiverse, prioritizing survival.

  5.  **Step 3: Map the Analogy (Mundane vs. Quantum):**
      *   *Mundane:* Single timeline. Probability of survival < 100%. Eventually, probability hits 0 (you die).
      *   *Quantum:* Multiverse. Probability of survival *somewhere* is always > 0 (until heat death/total decoherence?).
      *   *The Gap:* The mundane case accepts that the thread *ends*. The QI case assumes the thread *cannot end* as long as a non-zero amplitude exists.

  6.  **Step 4: Identify the "Heavy Lifting" (Where the Analogy Breaks):**
      *   **Issue 1: The Definition of "You".** In the mundane case, "you" are the biological organism. In QI, "you" becomes a specific pattern of information that must persist. Does consciousness snap to the surviving branch? Or does the "you" in the dead branch simply cease? (Most MWI proponents say the latter: there is a "you" that dies, and a "you" that lives. The dead "you" doesn't experience anything, but the living "you" isn't magically saved; they just happen to be the lucky one.)
      *   **Issue 2: Probability Measure (The Born Rule).** This is the big one. In MWI, branches have weights (amplitudes). QI often ignores this. If the "survival" branch has a weight of $10^{-100}$, does "you" still go there? If yes, QI implies you should expect to survive incredibly unlikely events (Russian Roulette). This contradicts standard decision theory.
      *   **Issue 3: Continuity vs. Discontinuity.** The mundane view accepts a hard stop. QI assumes a "law of continuity of consciousness" that overrides physical probability.
      *   **Issue 4: Aging/Degradation.** QI doesn't mean *youthful* immortality. It means *continued existence*. You could survive as a brain in a vat, or in extreme pain, or in a degraded state, as long as *some* consciousness persists. This is the "Quantum Hell" objection.

  7.  **Step 5: Evaluate the "Nothing to See Here" Conclusion:**
      *   Is it mundane? No. It makes radical predictions (surviving 1000 bullet shots).
      *   Is it metaphysical? Yes, it relies on a specific theory of personal identity (psychological continuity tied to quantum branches) that isn't settled physics.
      *   Does it hold up? Most physicists and philosophers reject it because it violates the Born Rule (probability weights) and relies on a solipsistic view of identity.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, philosophical but grounded in physics, respectful of the friend's intuition but clear on the flaws.
      *   *Structure:*
