      *   *Refinement on Spec Gaming:* In AI, spec gaming is often emergent behavior the designers didn't anticipate. At Wells Fargo, middle management often *knew* and encouraged it. This is "collusive gaming" rather than "emergent gaming." I need to highlight this distinction.

  8.  **Final Polish:** Organize with clear headings corresponding to the user's questions. Ensure the transition between the economic laws and the AI concepts is smooth. (Self-Correction: Make sure to explicitly address whether the proxy was *initially* reasonable. Yes, cross-selling is a valid banking strategy, just not at that intensity.)

  9.  *(Final thought before generating)*: The prompt asks to "probe the theory itself." I need to make sure I don't just apply the theory, but critique it. For example, does Specification Gaming account for *fear*? Usually, RL agents don't feel fear. Humans do. This changes the "optimization" landscape.

