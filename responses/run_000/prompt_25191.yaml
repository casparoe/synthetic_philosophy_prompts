      *   *Synthesis:* They are points on a continuum. Goodhart is the statistical observation. Campbell is the sociological mechanism. Specification Gaming is the computational/agent-based description of the behavior. Wells Fargo is a hybrid: Statistical breakdown (Goodhart) caused by Sociological pressure (Campbell) executed via Agent exploitation (Spec Gaming).
