answer: |-
  This is a classic philosophical puzzle, and your friend is walking a path well-trodden by St. Augustine, specifically in his treatises *On Lying* (*De Mendacio*) and *Against Lying* (*Contra Mendacium*). Augustine is famous for holding a view that is counter-intuitive to modern ethics: that lying is *always* a sin, even to save a life.

  Here are the two principles that fit his first five verdicts, the prediction for the suicide case, and the follow-up case to distinguish them.

  ### The Two Principles

  **Principle 1: The Intrinsic Disorder (Augustinian Absolutism)**
  This principle holds that lying is **intrinsically wrong** because it disorders the soul and misuses the faculty of speech, which is designed to convey truth. The moral status of the act is fixed: if you intend to deceive, you have sinned.
  *   **How it fits the first five:** Consequences (like saving a life or sparing feelings) do not make the lie *right*; they only mitigate the *severity* of the sin. This explains why hiding someone from murderers is "still wrong" (Case 1) and sparing feelings is "wrong, but minor" (Case 4). The gravity increases when you violate a higher authority (God/Court in Case 5) or a specific commitment (Promise in Case 2).
  *   **Core Logic:** *Never do evil that good may come.*

  **Principle 2: The Weighted Threshold (Proportionalism)**
  This principle holds that lying is **presumptively wrong** because it damages trust and social cohesion, but it can become permissible if the good achieved outweighs the moral cost of the deception.
  *   **How it fits the first five:** In the first five cases, the threshold for justification simply wasn't met. Lying to murderers (Case 1) or for feelings (Case 4) might be "wrong" because the lie undermines truth without a *guaranteed* or *sufficient* override (perhaps your friend argues the murderer might find them anyway, or the feelings aren't worth the corruption). Selfish lies (Case 2 & 5) fail the test because the benefit is to the self, not the greater good.
  *   **Core Logic:** *Lying is wrong unless the stakes are high enough to justify the cost.*

  ### Prediction for the Suicide Case

  **Verdict:** **Wrong (but likely "minor" or "officious").**

  **Reasoning:** Your friend is reading Augustine. Augustine explicitly addresses the case of lying to save a life (even multiple lives) and maintains that it remains a sin. He argues that while saving a body is good, corrupting your own soul with a lie is a spiritual evil that is never permissible, regardless of the physical outcome.

  Therefore, **Principle 1 (Intrinsic Disorder)** is the much stronger predictor. If your friend were following Principle 2 (Weighted Threshold), preventing a suicide is typically the exact scenario where the threshold is crossed to make the lie *permissible*. Since Augustine rejects that calculus, your friend will almost certainly say the lie is **still wrong**, classifying it similarly to the "murderers at the door" case: a benevolent lie, but a lie nonetheless.

  ### The Follow-Up Case

  To cleanly distinguish between these two principles, you need a case that pits the **highest possible consequence** against the **highest possible authority**. The suicide case tests "Life vs. Casual Truth." You need to test "Life vs. Sacred Truth."

  **The Case:**
  > "You are under oath in a court of law. You know that an innocent person is about to be executed for a crime they did not commit. The only way to save them is to lie under oath and provide a false alibi. Do you lie?"

  **Why this distinguishes the principles:**

  *   **Principle 1 (Intrinsic Disorder/Augustine):** Will say this is **Gravely Wrong**. Even to save an innocent life, you cannot commit perjury (a sin against God/Truth) to prevent a judicial error (a sin against man). The spiritual corruption of the liar is worse than the physical death of the innocent.
  *   **Principle 2 (Weighted Threshold):** Will likely say this is **Permissible (or Obligatory)**. The stakes (an innocent life) vastly outweigh the cost (damage to the legal system's trust). This is the "tipping point" where the utilitarian benefit crushes the deontological rule.

  If your friend says "Wrong," he is a consistent Augustinian (Principle 1). If he hesitates or says "Right," he is secretly a Consequentialist using Augustinian language (Principle 2).
