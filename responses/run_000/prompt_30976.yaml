  # JOINT STATEMENT ON FREE WILL, DETERMINISM, AND RESPONSIBILITY
  **Undersigned:** [Name], Proponent of Incompatibilism & [Name], Proponent of Compatibilism
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration regarding the Consequence Argument and the Principle of Alternative Possibilities

  ## I. AGREED CLAIMS

  After extensive dialogue regarding the Consequence Argument and the conditions for moral responsibility, we affirm the following points of consensus:

  1.  **Definition of Determinism:** We agree on the standard definition of causal determinism: the thesis that the state of the universe at any given time, conjunction with the laws of nature, entails a unique future. We agree that if determinism is true, there is exactly one physically possible future consistent with the past and the laws.
  2.  **Structure of the Consequence Argument:** We agree that the Consequence Argument (in the style of Peter van Inwagen) successfully formalizes a pre-theoretical intuition: that if our actions are the inevitable consequences of events prior to our birth and laws we cannot break, then our control over those actions is illusory *unless* the concept of "control" is compatible with causal necessitation.
  3.  **The Centrality of "Could Have Done Otherwise":** We agree that the Principle of Alternative Possibilities (PAP)—the claim that an agent is morally responsible for an action only if they could have done otherwise—is the traditional pivot point of the debate. We agree that the truth of PAP is logically linked to the soundness of the Consequence Argument.
  4.  **The Reality of Responsibility Practices:** We agree that human moral practices (blame, praise, resentment, gratitude, punishment, and reward) are deeply entrenched, socially vital, and presuppose that agents possess some form of control. We agree that any philosophical theory of free will must account for the justification, revision, or elimination of these practices.
  5.  **The Stakes:** We agree that the disagreement is not merely semantic. If the Incompatibilist is correct, widespread deterministic truths would necessitate a radical revision of our self-conception and moral practices. If the Compatibilist is correct, our practices can remain largely intact even in a deterministic universe, provided our definitions of ability and responsibility are adjusted.

  ## II. DISAGREEMENTS TABLE

  | Topic | Incompatibilist Formulation | Compatibilist Formulation |
  | :--- | :--- | :--- |
  | **1. The Soundness of the Consequence Argument** | The argument is **sound**. The inference rules (e.g., Rule Beta) preserve the property of "no choice over." Since we have no choice over the past or laws, and determinism transfers this lack of choice to our actions, we lack the control required for responsibility. | The argument is **unsound** (or invalid). The inference rules fail when "no choice over" is analyzed as a lack of *agential capacity* rather than *causal origination*. Determinism does not negate the specific type of control relevant to responsibility. |
  | **2. The Principle of Alternative Possibilities (PAP)** | PAP is **true**. Moral responsibility requires "regulative control." An agent cannot be truly blameworthy or praiseworthy unless, at the moment of choice, the future was metaphysically open to at least two distinct outcomes. | PAP is **false**. Moral responsibility requires only "guidance control." An agent is responsible if their action issues from their own reasons-responsive mechanism, even if deterministic constraints meant they could not have physically done otherwise. |
  | **3. The Meaning of "Can"** | To say an agent "can" do otherwise implies **categorical ability**. It requires that, holding the past and laws fixed, there is a possible world where the agent does otherwise. Determinism renders this statement false. | To say an agent "can" do otherwise implies **dispositional ability**. It means that if the agent had chosen otherwise (or had sufficient reason to), they would have done otherwise. Determinism is consistent with this conditional analysis. |
  | **4. The Justification of Blame** | Retributive blame is only justified if the agent is the **ultimate source** of their action. If determinism is true, the source of action traces back to factors outside the agent's control, making retributive blame unjust. | Blame is justified as a **communicative or regulatory tool**. It holds agents accountable to norms and modifies future behavior. This function remains valid and fair provided the agent possesses rational capacities, regardless of ultimate origination. |

  ## III. CRUXES AND PREDICTIONS

  We have identified three specific sub-questions (cruxes) where further philosophical or empirical resolution would significantly alter the dialectic. For each crux, we specify the type of evidence or argument we both accept as relevant, and we record our divergent predictions regarding the outcome of that inquiry.

  ### Crux 1: The Robustness of Frankfurt-Style Counterexamples
  *   **The Question:** Do Frankfurt-style cases (where an agent chooses on their own but could not have chosen otherwise due to a counterfactual intervener) successfully sever the link between responsibility and alternative possibilities?
  *   **Accepted Argument/Case:** Detailed intuition-pumping regarding "flicker strategies" (the idea that some alternative possibilities always remain in Frankfurt cases) vs. "sourcehood" intuitions (the idea that the lack of intervention matters more than the lack of alternatives).
  *   **Incompatibilist Prediction:** Further analysis will reveal that Frankfurt cases always rely on a hidden assumption that preserves *some* alternative possibilities (flickers of freedom), or that intuitions in these cases are unreliable compared to the clear intuition behind the Consequence Argument. PAP will survive.
  *   **Compatibilist Prediction:** Refined cases (e.g., "Blockade" cases or neural monitoring) will successfully demonstrate that ordinary people attribute responsibility even when alternative possibilities are completely removed, provided the actual sequence of events is untampered. PAP will be rejected.

  ### Crux 2: Ordinary Language and the "Can" of Ability
  *   **The Question:** When ordinary speakers say "I could have done otherwise" in a context where they acknowledge all prior causes were fixed, do they mean they had a metaphysical power to break the laws of nature, or do they mean they had the capacity and opportunity to act differently had they chosen?
  *   **Accepted Argument/Case:** Empirical experimental philosophy (x-phi) surveys and linguistic analysis of modal verbs in counterfactual contexts.
  *   **Incompatibilist Prediction:** Surveys will show that when pressed, ordinary people interpret "could have done otherwise" as requiring metaphysical openness. If told the universe is deterministic, they will retract claims of ability, validating the Incompatibilist reading of folk intuition.
  *   **Compatibilist Prediction:** Surveys will show that ordinary people treat "could have done otherwise" as compatible with causal determination, focusing on the absence of external constraints (coercion, incapacity). The "could" is interpreted as a conditional capacity, validating the Compatibilist reading.

  ### Crux 3: The Necessity of "Ultimate Sourcehood" for Desert
  *   **The Question:** Is the retributive element of moral responsibility (the idea that one *deserves* suffering or benefit purely based on past action) dependent on the agent being the *causa sui* (cause of themselves), or is it dependent on the agent's ownership of the action via their psychological architecture?
  *   **Accepted Argument/Case:** Comparative analysis of moral intuitions regarding manipulation cases (e.g., the "Four-Case Argument") vs. standard deterministic upbringing.
  *   **Incompatibilist Prediction:** Intuitions will show no relevant difference between a manipulated agent and a determined agent. If the manipulated agent is not responsible (because they are not the ultimate source), neither is the determined agent. Ultimate sourcehood is required for desert.
  *   **Compatibilist Prediction:** Intuitions will distinguish between *alien* causes (manipulation) and *internal* causes (character/values). As long as the action flows from the agent's own values and reasoning processes, desert is justified, even if those values were deterministically caused. Ultimate sourcehood is not required.

  ***

