answer: |-
  Here is a robust defense of omissions as genuine causes within a Lewisian counterfactual framework, tailored for your seminar context.

  ***

  ### The Case for Omissive Causation: A Counterfactual Defense

  The central thesis of the Lewisian account is that causation is nothing over and above counterfactual dependence between distinct existents. If event $E$ counterfactually depends on event $C$, then $C$ causes $E$. The resistance to counting omissions as causes stems not from a failure of the counterfactual analysis, but from a category mistake: we conflate the *metaphysics* of causation (what makes a causal claim true) with the *pragmatics* of causal selection (which causes we mention in explanation).

  To defend omissions, we must rigorously apply the semantics of counterfactuals. When we evaluate the claim "The guard's sleeping caused the derailment," we evaluate the counterfactual: "Had the guard not slept (i.e., had he performed his duty), the derailment would not have occurred." Crucially, we evaluate this by holding the **background conditions fixed**. We do not imagine a world where the guard is a different person, or where the track is already broken, or where the laws of physics differ. We hold the past and the laws fixed up to the moment of the omission, introduce a small "miracle" or divergence where the agent acts, and let the world evolve. If, in that nearest possible world, the effect vanishes, the omission is a cause.

  #### 1. The Sleeping Guard
  Consider the guard who falls asleep, failing to signal the oncoming train, resulting in a derailment.
  **The Objection:** Critics argue the guard didn't *do* anything. The cause was the train's speed or the track's curvature; the guard's sleep was merely the absence of a preventer.
  **The Defense:** This objection assumes a "process" view of causation (causation requires energy transfer). On a counterfactual view, ontology is secondary to dependence.
  When we hold background conditions fixed, we assume the signaling mechanism works and the train is on schedule. In the nearest world where the guard stays awake, he signals, the train stops, and no derailment occurs. The truth of this counterfactual is sufficient for causation. The confusion lies in thinking the cause must be the *presence* of an event (a signal). But the causal relata are propositions or facts. The fact *that the guard slept* is a positive fact about the world at time $t$. It is not a "nothing"; it is a state of affairs that stands in a dependence relation to the crash. To call it a "mere absence of a would-be cause" is to beg the question by assuming only positive events can be causes. The counterfactual test reveals that the world is sensitive to the guard's state; therefore, the guard's state is causal.

  #### 2. The Doctor and the Withheld Drug
  A doctor decides not to administer a life-saving drug; the patient dies.
  **The Objection:** The disease caused the death. The doctor merely failed to interrupt the causal chain.
  **The Defense:** Again, we hold background conditions fixed: the drug is available, effective, and the patient is physiologically capable of responding. We evaluate: "Had the doctor administered the drug, the patient would have lived." This is true.
  The distinction between "cause" and "absence of a would-be cause" collapses here because the doctor's decision *is* part of the actual sequence. The omission is not a gap in reality; it is the realization of a specific choice node. If we treat the doctor's inaction as a real fact in the actual world, and the patient's survival counterfactually depends on that fact being different, then the inaction is a cause. To deny this is to insist that causation requires "pushing," but causation is about dependence. The patient's death depends on the doctor's withholding just as much as it depends on the pathogen's virulence.

  #### 3. Double Prevention and Causal Chains
  Double prevention cases are the strongest evidence for omissive causation. Structure: $A$ prevents $B$, and $B$ prevents $C$. Therefore, $A$ causes $C$.
  **Case:** A pillar ($A$) holds up a catch ($B$), which holds up a weight ($C$). If I kick the pillar away ($A$), the catch falls ($B$), and the weight drops ($C$).
  **Omissive Variant:** Suppose a mechanism *would* have kicked the pillar, but I *fail* to disable the mechanism (Omission $O$). Because I failed to disable it, the mechanism kicks the pillar, and the weight drops.
  **The Defense:** Here, the omission is a link in a longer causal chain.
  1. My failure to disable ($O$) allows the mechanism to fire ($M$).
  2. The mechanism firing ($M$) removes the pillar ($P$).
  3. The pillar's removal ($P$) drops the weight ($W$).
  There is stepwise counterfactual dependence: $W$ depends on $P$, $P$ depends on $M$, and $M$ depends on $O$. If causation is transitive (or if we accept chains of dependence), $O$ causes $W$. If we deny omissions are causes, we break the chain and cannot explain how my inaction is connected to the falling weight. The "absence of a would-be cause" objection fails because the omission is functionally identical to a positive trigger in the chain's logic.

  #### 4. Handling Preemption
  Preemption is the standard weapon against counterfactual theories, but omissions do not worsen the problem; they fit the standard Lewisian solution.
  **Scenario:** Guard 1 sleeps. Guard 2 is a backup who *would* have woken up if Guard 1 had signaled, but since Guard 1 didn't, Guard 2 stays asleep too. The train derails.
  **Analysis:** Is Guard 1's omission a cause?
  If Guard 1 had signaled, Guard 2 would have stayed asleep (relying on Guard 1), the train stops. The counterfactual holds. Guard 1 is a cause.
  **Late Preemption:** Suppose Guard 2 is independent. Guard 1 sleeps. Guard 2 also sleeps (independently). If Guard 1 had woken, Guard 2 would *still* be asleep, so the train would still derail (because one signal isn't enough, or Guard 2 fails to act). Here, the counterfactual "If Guard 1 had woken, no derailment" is *false*.
  **The Defense:** The counterfactual account correctly rules out Guard 1 as a cause in the independent backup case. This is a feature, not a bug. If the effect would have happened anyway, the omission isn't a cause. The Lewisian handles early preemption via **stepwise dependence**. Even if the final effect doesn't depend on the omission directly (due to backups), the *intermediate events* do. In the omissive case, the "intermediate event" is the state of the system at $t+1$ resulting from the omission. If that state leads to the effect, and that state depends on the omission, we have causation.

  #### 5. The Explosion of Causes (The Queen of England)
  **The Worry:** If the doctor's omission causes the death, so does the Queen of England's omission to fly in and administer the drug. Both satisfy the counterfactual: "If she had given the drug, he would live." This makes causation ubiquitous and trivial.
  **The Defense:** This conflates **causation** with **causal explanation**.
  Metaphysically, the Queen's omission *is* a cause. The patient's death counterfactually depends on her not acting. However, when we ask "What caused the death?" in a conversational context, we are not asking for the complete causal history of the universe. We are asking for the *salient* abnormality.
  We hold certain norms fixed. The doctor has a duty; the Queen does not. The doctor's omission is a deviation from the expected course of events; the Queen's inaction is part of the background. The counterfactual theory captures the *dependence*; pragmatics filters the *selection*. Admitting the Queen is a metaphysical cause does not undermine the theory; it clarifies that causation is abundant, while explanation is selective. To deny the Queen is a cause is to lie about the counterfactual structure of the world to suit our moral intuitions.

  ### Conclusion and Vulnerability

  The counterfactual account succeeds because it treats causation as a structural relation of dependence rather than a physical transfer of energy. Omissions are real facts about the world that sustain counterfactual dependencies. The "absence of a cause" objection fails because it demands a positive ontology where none is required for dependence to hold. By holding background conditions fixed, we isolate the specific variable (the agent's action) and confirm its necessity for the outcome.

  **The Vulnerability:**
  The single most vulnerable point in this defense is the reliance on **pragmatic context-sensitivity** to solve the "Explosion of Causes" problem. By conceding that the Queen is a *metaphysical* cause but not an *explanatory* one, I have severed the link between causation and human agency, potentially rendering the metaphysical notion of "cause" too detached from the very practices (law, morality, science) that motivated the inquiry in the first place. If causation is mind-independent but our access to it is entirely governed by normative expectations, you can argue that I have not defended omissive *causation*, but rather omissive *responsibility* masquerading as metaphysics.
