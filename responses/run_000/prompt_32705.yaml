  The white room had no corners. It curved gently upward into a dome that glowed with a light source Elias could not locate. There were no shadows, which meant there was no place to hide, not that there was anything here worth hiding. He sat in a chair that molded to his spine, cool and firm. On the armrest, a panel waited. It displayed two symbols. A circle and a square. The instructions were simple, etched into his memory during the induction phase before the sedation, before the transport, before the duplication.

  He was Instance One. Somewhere, in a room exactly like this one, perhaps in the same facility, perhaps in a different universe entirely, sat Instance Two. They were identical. They had the same memories up to the moment of separation. They had the same love for their daughter, Maya. They had the same fear of pain. They were the same man, split by a barrier that no signal could cross. No light, no radio wave, no quantum entanglement could bridge the gap between Instance One and Instance Two. They were causally disconnected. If Elias screamed until his throat bled, Instance Two would hear nothing. If Instance Two smashed the panel in a rage, Elias would feel no vibration.

  The panel before him pulsed softly. The circle represented preservation. If he touched the circle, the chair would remain comfortable. The air would stay sweet. He would sit here for an hour, then be released back into the world with a sum of money in his account, enough to live comfortably but not enough to save Maya. The square represented sacrifice. If he touched the square, the chair would heat up. It would not burn him permanently, but it would be agonizing for the duration of the hour. His skin would blister. He would scream. But if he touched the square, the system would release a massive endowment to Maya's trust fund.

  There was a catch. The endowment was not triggered by his own action. It was triggered by the action of Instance Two. If Instance Two touched the square, Maya got the money. If Instance Two touched the circle, Maya got nothing. Elias's choice determined only his own comfort. Instance Two's choice determined Maya's future.

  This was the vertigo. This was the hole in the world where logic should have been.

  Elias stared at the square. His finger hovered over the smooth surface. Why would he touch it? To cause pain to himself for a reward he could not control? Causally, it made no sense. His finger moving one inch to the left did not send a message to the other room. It did not twist the arm of the other Elias. The other Elias was making his decision in a vacuum, just as Elias was now. If the other Elias was rational, he would look at the panel and see that his own comfort was the only thing under his direct control. He would see that Maya's fate depended on Elias, not on himself. So the other Elias would touch the circle. He would save himself. He would leave Maya to struggle.

  If that was true, then Elias should touch the circle too. He should save himself from the pain. He should accept that Maya would have to work harder, live slower, struggle more. It was a tragedy, but it was not his fault. He could not reach across the void.

  But Elias knew the other man. He knew him better than he knew anyone else, because the other man was him. They shared the same source code. They were running the same algorithm on the same data. They were not two strangers negotiating across a border. They were one mind looking into a mirror that had been shattered into two pieces.

  If Elias decided that the rational choice was to save himself, then Instance Two would decide the same thing. The logic was identical. The inputs were identical. The processing was identical. Therefore, the output must be identical. If Elias touched the circle, Instance Two would touch the circle. Maya would get nothing. Elias would be comfortable.

  If Elias decided that the rational choice was to ensure Maya's safety, he had to find a reason to touch the square. He had to bind his own will to the outcome he desired. He had to act as if his choice was the cause, even though he knew it was not. He had to trade with a ghost.

  The air in the room felt heavy. Elias thought of Maya at six years old, chasing fireflies in the backyard. He thought of her at sixteen, arguing about college majors. He thought of her now, waiting for a call that would tell her whether her father had succeeded. She did not know about the duplication. She did not know about the other room. She only knew that her father was going to fix things.

  To fix things, Instance Two had to touch the square.
  To make Instance Two touch the square, Elias had to touch the square.

  It was a loop. It was a snake eating its own tail. It felt like magic. It felt like praying to a god who was also you. If I pray, will God answer? If I am God, will I answer me?

  Elias closed his eyes. He tried to imagine the other room. He tried to imagine the other Elias sitting in the cool chair, staring at the panel. Was he hesitating? Was he sweating? Did he feel the same tightness in his chest? Of course he did. They were the same. The hesitation in this room was the hesitation in that room. The resolve in this room was the resolve in that room. There was no delay. The decision was happening now, in both places, synchronized not by time but by identity.

  If I defect, he defects. If I cooperate, he cooperates.

  The word cooperate felt wrong. There was no partner. There was only the self, doubled. To cooperate was to trust oneself. But trusting oneself was easy. The hard part was trusting oneself to be irrational. The hard part was accepting pain without a causal guarantee. It required a leap of faith dressed in the clothing of mathematics.

  Elias opened his eyes. The panel glowed. The circle promised safety. It whispered to the lizard brain at the base of his skull. Avoid pain. Seek comfort. Survive. It was the oldest instruction in the book. To ignore it felt like suicide.

  But Maya.

  He thought about the kind of man he wanted to be. Not the man who survived, but the man who provided. The man who kept promises. If he touched the circle, he was a man who let his daughter struggle to save his own skin. If he touched the square, he was a man who burned for her.

  But the burning was here. The benefit was there.
  Unless the here and the there were the same.

  If the decision procedure is the same, then the outcome is linked. I am not reaching across the void. I am defining the void. I am deciding what kind of universe this is. In a universe where I sacrifice, there is a counterpart who sacrifices. In a universe where I flinch, there is a counterpart who flinches. I do not get to choose one without the other. I do not get to be the defector while he is the cooperator. That state does not exist. It is logically impossible for us to be different.

  So the choice was not between pain and comfort. The choice was between two worlds. In one world, Elias was comfortable and Maya was poor. In the other world, Elias was in agony and Maya was secure.

  He looked at his hand. It looked ordinary. It was the hand that had held Maya's hand when her mother died. It was the hand that had signed the mortgage. It was the hand that would now sign the contract with logic itself.

  The silence of the room pressed against his ears. It was the silence of the void between the rooms. It was absolute. There was no hope of a signal. There was no hope of a thank you from the other side. The other Elias would not thank him. The other Elias would be feeling the same heat, screaming the same screams. They would both suffer. They would both know that the other was suffering. And they would both know that Maya was safe.

  It was a shared burden. A communion of pain.

  Elias took a breath. The air tasted sterile. He thought about the moment the heat would start. He thought about the instinct to pull his hand back. He knew he would not be able to stop it once it began. But the choice was before the pain. The choice was the key.

  He remembered a conversation with a philosopher friend, years ago, before the diagnosis, before the need for money, before the facility approached him with the offer. They had talked about free will. The friend had said that freedom was not the ability to do anything, but the ability to act according to your nature. To be truly yourself.

  If his nature was to protect Maya, then he had to act according to that nature. Even if the mechanics of the universe made it seem futile. Especially then. Because if he failed to act according to his nature, he proved he was not the man he thought he was. And if he was not that man, then Instance Two was not that man either.

  He moved his hand. The motion was slow. He felt the weight of the decision in his muscles. It felt heavier than gravity. It felt like lifting the sky.

  He touched the square.

  For a second, nothing happened. The panel remained cool. The chair remained firm. He wondered if he had made a mistake. He wondered if the other Elias had touched the circle. He wondered if he had suffered for nothing.

  Then the heat began.

  It started in the seat beneath him, a slow rise in temperature that quickly became a burn. It climbed up his back. It tightened around his chest. He gasped. The air grew hot and thin. He gripped the arms of the chair. His knuckles turned white. He wanted to stand up, but the restraints held him firm. He wanted to scream, but he bit his lip until he tasted blood.

  He closed his eyes and focused on the logic. It was the only shield he had.
  I am doing this. Therefore he is doing this.
  Therefore Maya is safe.
  The pain was real. The fire was real. But the logic was stronger. It was the spine of the universe.

  He imagined the other room. He imagined the other Elias gripping the arms, sweating, burning. They were burning together. They were one fire split in two. There was no loneliness in it. There was a terrible, absolute solidarity. He was not alone in the white room. He was with himself.

  The minutes stretched. The pain peaked and then began to fade as the hour ended. The chair cooled. The air cleared. Elias slumped forward, exhausted, his skin red and tender. He was alive. He was whole.

  The panel flickered. A message appeared.
  Transaction Complete.
  Beneficiary Status: Secured.

  Elias let out a breath he felt he had been holding for a lifetime. He had not changed the other man's mind. He had not sent a signal. He had simply been who he was, and in being who he was, he had ensured that the other man was who he was too. He had traded with a mirror. He had reached across the void and found his own hand waiting there.

  He stood up, his legs shaking. The door to the white room hissed open. The light from the corridor was dimmer, warmer. He walked out into it, carrying the pain on his back like a coat. He did not look back at the room. There was no need. The other room was still there, empty now, but the echo of the decision remained. They had won. Not by force, but by agreement. Not by cause, but by reason.

  Elias stepped into the hallway. He thought of Maya. He would call her. He would tell her everything was okay. He would not tell her about the fire. He would not tell her about the other man. Some truths were too heavy for one person to carry. But he knew. And the other man knew. And in the silence between the stars, in the gap between the worlds, the trade held.

  It was not magic. It was just them.
