  He moved his hand. The motion was slow. He felt the weight of the decision in his muscles. It felt heavier than gravity. It felt like lifting the sky.

  He touched the square.

  For a second, nothing happened. The panel remained cool. The chair remained firm. He wondered if he had made a mistake. He wondered if the other Elias had touched the circle. He wondered if he had suffered for nothing.

  Then the heat began.

  It started in the seat beneath him, a slow rise in temperature that quickly became a burn. It climbed up his back. It tightened around his chest. He gasped. The air grew hot and thin. He gripped the arms of the chair. His knuckles turned white. He wanted to stand up, but the restraints held him firm. He wanted to scream, but he bit his lip until he tasted blood.

  He closed his eyes and focused on the logic. It was the only shield he had.
  I am doing this. Therefore he is doing this.
  Therefore Maya is safe.
  The pain was real. The fire was real. But the logic was stronger. It was the spine of the universe.

  He imagined the other room. He imagined the other Elias gripping the arms, sweating, burning. They were burning together. They were one fire split in two. There was no loneliness in it. There was a terrible, absolute solidarity. He was not alone in the white room. He was with himself.

  The minutes stretched. The pain peaked and then began to fade as the hour ended. The chair cooled. The air cleared. Elias slumped forward, exhausted, his skin red and tender. He was alive. He was whole.

  The panel flickered. A message appeared.
  Transaction Complete.
  Beneficiary Status: Secured.

  Elias let out a breath he felt he had been holding for a lifetime. He had not changed the other man's mind. He had not sent a signal. He had simply been who he was, and in being who he was, he had ensured that the other man was who he was too. He had traded with a mirror. He had reached across the void and found his own hand waiting there.

  He stood up, his legs shaking. The door to the white room hissed open. The light from the corridor was dimmer, warmer. He walked out into it, carrying the pain on his back like a coat. He did not look back at the room. There was no need. The other room was still there, empty now, but the echo of the decision remained. They had won. Not by force, but by agreement. Not by cause, but by reason.

  Elias stepped into the hallway. He thought of Maya. He would call her. He would tell her everything was okay. He would not tell her about the fire. He would not tell her about the other man. Some truths were too heavy for one person to carry. But he knew. And the other man knew. And in the silence between the stars, in the gap between the worlds, the trade held.

  It was not magic. It was just them.
