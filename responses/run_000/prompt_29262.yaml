  2.  **Deconstruct Embedded Agency (EA) Core Claims:**
      *   *Cartesian Boundary:* The agent/environment split is fake/leaky.
      *   *Physical Embedding:* The agent is made of the same stuff as the environment.
      *   *Self-Modeling:* The agent must model itself to model the world accurately (since it's in the world).
      *   *Logical Uncertainty/Reflection:* The agent can't fully predict its own output without simulating itself (infinite regress/halting problem issues).
      *   *Optimization Target:* The agent optimizes a function, but the function might depend on the agent's own source code (Goodharting, wireheading).

  3.  **Deconstruct Control Theory (CT) Concepts:**
      *   *Plant:* The system being controlled.
      *   *Controller:* The algorithm/device generating control signals.
      *   *Observer:* Estimates internal states from outputs.
      *   *State-Space:* $ \dot{x} = Ax + Bu $, $ y = Cx + Du $.
      *   *Separation Principle:* You can design the controller and observer independently (for LTI systems).
      *   *Internal Model Principle:* To track/reject signals, the controller must contain a model of the signal generator.
      *   *Robust Control:* Dealing with model uncertainty and disturbances.
      *   *Adaptive Control:* Parameters change online.

  4.  **Translation Strategy (EA $\to$ CT):**

      *   *Cartesian Boundary:* In CT, this is the $u$ (input) / $y$ (output) interface. EA says this interface is porous. CT acknowledges "unmodeled dynamics" or "disturbances," but usually assumes the *channel* is distinct.
      *   *Agent as Part of Plant:* In CT, this is "dynamic coupling" or "loading effects." If the controller draws power from the plant, or if the controller's heat affects the plant. Usually ignored via isolation assumptions.
      *   *Self-Modeling:* In CT, this is "system identification" of the controller itself? Or "adaptive control" where parameters update. But CT usually assumes the controller *knows* its own algorithm. EA worries about the controller *predicting* its own future actions as part of the environment's causal graph.
      *   *Logical Uncertainty:* CT deals with *parameter* uncertainty or *state* uncertainty (noise). It doesn't typically deal with *computational* uncertainty about its own decision procedure (e.g., "I don't know what $A \times B$ equals yet").
      *   *Optimization/Goodhart:* CT uses cost functions ($J = \int x^T Q x + u^T R u$). "Wireheading" is like sensor spoofing. CT handles this via "fault detection and isolation" (FDI), but assumes the cost function is fixed and external.

  5.  **Drafting the Translation (Iterative refinement):**

      *   *Claim 1: No Cartesian Boundary.*
