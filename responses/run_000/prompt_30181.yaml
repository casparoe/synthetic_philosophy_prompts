answer: |-
  You have identified what is arguably the most famous and damaging objection to **Strong Negative Utilitarianism**: the **Indifference Problem** (sometimes called the "Problem of Infinity" or "Lexical Collapse").

  Your reasoning is mathematically sound: if you assign suffering a value of $-\infty$ and happiness a value of $+n$ (where $n$ is finite), then any world containing suffering has a total value of $-\infty$. In standard arithmetic, $-\infty = -\infty$. This implies a world with one minor headache is morally equivalent to a world with eternal torture, rendering moral choice impossible between any two imperfect worlds.

  However, the conclusion that negative utilitarians "don't care about degrees of suffering" is incorrect. Most contemporary proponents of negative utilitarianism reject the "actual infinity" formalization precisely because it leads to the paralysis you described.

  Here is how negative utilitarians resolve this to regain practical guidance.

  ### 1. Distinguishing Strong vs. Weak Negative Utilitarianism
  The view you are critiquing is **Strong (or Lexical) Negative Utilitarianism**. This view holds that suffering *lexically* outweighs happiness (i.e., no amount of happiness can justify *any* amount of suffering).

  Most modern negative utilitarians subscribe to **Weak Negative Utilitarianism**.
  *   **The View:** Suffering and happiness are on the same scale, but suffering has a much higher negative weight.
  *   **The Math:** Instead of $-\infty$, a unit of suffering might be worth $-100$ utility, while a unit of happiness is $+1$.
  *   **The Result:** A world with one stubbed toe ($-100$) is vastly better than a world with billions tortured ($-100,000,000,000$). You can still do calculus. You can compare policies. You just prioritize suffering reduction much more heavily than happiness promotion.

  ### 2. Pure Negative Utilitarianism (Ignoring Happiness)
  Another approach is to remove happiness from the moral equation entirely, without invoking infinity.
  *   **The View:** Happiness has no moral value (it is neutral, not good). Only suffering has moral value (it is bad).
  *   **The Comparison:** You do not compare World A and World B by summing (Happiness $-$ Suffering). You compare them by summing (Suffering).
  *   **The Result:**
      *   **World A:** 1 stubbed toe. Total Suffering = 1 unit.
      *   **World B:** 1 billion people tortured. Total Suffering = 1,000,000,000 units.
      *   **Verdict:** World A is objectively better than World B.
  *   **Practical Guidance:** Since happiness doesn't count toward the "score," you don't waste resources creating happiness unless it prevents suffering. You compare policies solely based on how much suffering they reduce. This avoids the infinity trap because you aren't trying to balance a finite positive against an infinite negative; you are just comparing two finite negatives.

  ### 3. Lexical Thresholds (Intensity Matters)
  Some negative utilitarians (like Karl Popper, who was sympathetic to the view) argue that the lexical priority applies only to **intense** suffering.
  *   **The View:** Mild suffering (stubbed toes, mild annoyance) can be outweighed by happiness. Severe suffering (torture, agony) cannot.
  *   **The Mechanism:** There is a threshold of intensity. Below the threshold, standard utilitarianism applies. Above the threshold, the negative utility becomes lexical (or sufficiently massive) that it trumps happiness.
  *   **Practical Guidance:** This creates a triage system. First, eliminate all suffering above the threshold (torture, severe disease). Once that is achieved, you can revert to standard trade-offs for minor inconveniences. This solves the "stubbed toe vs. torture" problem by categorizing them differently.

  ### 4. Suffering-Focused Ethics (Practical Heuristics)
  In practical discourse, many advocates avoid the metaphysical debate about "utility units" and focus on **Suffering-Focused Ethics**. This is less about a rigid formula and more about prioritization.
  *   **The Guidance:** Even if you accept a standard utilitarian framework, the marginal utility of reducing extreme suffering is often higher than creating mild happiness.
  *   **Comparison:** When comparing Policy A and Policy B, you look at the **worst-off individuals**.
      *   If Policy A reduces the suffering of the worst-off group more than Policy B, choose A.
      *   This functions similarly to a **Prioritarian** view weighted heavily toward the bottom.
  *   **Avoiding Collapse:** This avoids the infinity problem because it doesn't claim the value is *infinite*, only that the *priority* is absolute regarding the most severe cases.

  ### 5. Why the "Infinity" Model Persists
  If the infinity model breaks decision theory, why does anyone use it?
  1.  **Rhetorical Device:** It is often used to emphasize the *urgency* of suffering. It signals: "Do not trade away someone's safety for a party."
  2.  **Moral Intuition:** Some philosophers argue that there *are* certain horrors (e.g., child torture) that truly cannot be justified by any amount of trivial happiness (e.g., eating a cookie). To model this intuition formally, they reach for lexical/infinite values, accepting the mathematical headaches as a cost of capturing that moral truth.
  3.  **Soteriological Goals:** In some religious or transhumanist contexts, the goal is the *elimination* of suffering (Nirvana, heat death of the universe). In a binary "suffering exists/does not exist" framework, the infinity model makes sense, though it fails in a "how much suffering exists" framework.

  ### Summary
  To answer your specific questions:

  *   **How do they compare two policies?**
      Most compare them by measuring the **total amount or intensity of suffering** in each outcome. They either ignore happiness entirely (Pure NU) or weight suffering much more heavily than happiness (Weak NU).
  *   **Do they really not care about degrees of suffering once any exists?**
      **No.** That is a consequence of the specific "Strong/Infinite" version you analyzed, which is widely regarded as a *reductio ad absurdum* even by many negative utilitarians. The consensus among workable negative utilitarian theories is that **less suffering is always better than more suffering**, regardless of whether happiness is present.

  The "stubbed toe = torture" conclusion is generally viewed as a bug in the theory that needs to be fixed (via thresholds or weighting), not a feature that proponents accept. Practical negative utilitarianism looks a lot like **prioritarianism focused on the alleviation of extreme pain**, rather than a mathematical deadlock.
