          *   *Measurement Error/Noise:* Thermometers have error bars. Impulse buys, mistakes, addiction.
          *   *Multiple Temperatures:* Hyperbolic discounting. The "Monday Morning" self vs. the "Friday Night" self. Which is the "real" temperature?
