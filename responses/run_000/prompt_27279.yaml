answer: |-
  Your roommate is channeling Paul Samuelson, the Nobel laureate who formalized **Revealed Preference Theory** in the 1930s. His core argument is a staple of neoclassical economics: preferences are mental states, and mental states are unobservable. Therefore, economics should be a science of *choice*, not psychology.

  The thermometer analogy is elegant, but like all analogies, it hides more than it reveals. To see if his conclusion holds, we need to stress-test the mapping.

  ### 1. Mapping the Analogy
  Here is how your roommate's model translates to the physical world:

  *   **The Room:** The individual's decision-making environment.
  *   **The Temperature:** The "True Preference" (or Utility). This is a latent, stable state that exists independently of measurement.
  *   **The Thermometer:** The mechanism of choice (spending money, allocating time).
  *   **The Reading:** The observed action (buying the chips, staying on the couch).
  *   **Calibration:** Rationality. The assumption that the thermometer is accurate and not influenced by external magnets or pressure.

  **The Roommate's Inference:** If the reading says "Chips," the temperature is "Chips." If the mouth says "Health," the mouth is lying or deluded.

  ### 2. Where the Analogy Breaks Down
  The analogy fails in four specific places. Each breakdown damages the conclusion that speech is "noise."

  #### A. Constraints vs. Temperature (The Ice Pack Problem)
  In physics, if a thermometer reads 50°, the room is 50°. In economics, if a person chooses cheap junk food, it could mean they *prefer* junk food, OR it could mean healthy food is too expensive or unavailable.
  *   **The Breakdown:** A thermometer measures the environment directly. A choice measures the intersection of *preference* AND *constraint*.
  *   **Why it matters:** If you ignore what people say, you cannot distinguish between **taste** and **budget**. If your roommate asks a poor student why they eat ramen, and the student says "I care about nutrition but I'm broke," ignoring that statement leads you to believe they *love* ramen. That is bad data. Speech reveals the constraints that choices obscure.

  #### B. Measurement Error (The Broken Thermometer)
  Thermometers can be sticky, slow, or broken. Human choices are subject to "noise." We act on impulse, habit, addiction, or misinformation.
  *   **The Breakdown:** Revealed preference assumes choices are error-free readings of utility. Behavioral economics shows choices are often mistakes (e.g., buying a gym membership and never going).
  *   **Why it matters:** If I buy a treadmill and never use it, revealed preference says I preferred *buying* the treadmill to *using* it. That's absurd. Speech (e.g., "I regret that purchase") identifies the error. Without speech, you treat mistakes as preferences, which destroys the predictive power of the model.

  #### C. Multiple Temperatures (The Time-Inconsistency Problem)
  A room generally has one temperature at a time. Humans have competing "temperatures" across time. This is the **Present Self vs. Future Self** conflict.
  *   **The Breakdown:** On Friday night, my "temperature" is for partying. On Monday morning, my "temperature" is for productivity. Both are real.
  *   **Why it matters:** If you only watch Friday night choices, you predict I will never work. If you only listen to Monday morning speech, you predict I will never party. The "truth" is the conflict between them. Ignoring the speech (the Monday Self) ignores the part of the person that plans, regrets, and tries to change. It reduces a human to their lowest impulse.

  #### D. Construction vs. Measurement (The Quantum Problem)
  In physics, measuring temperature doesn't change the temperature. In psychology, **asking** people what they value can *change* what they value.
  *   **The Breakdown:** Preferences are often not pre-existing latent states; they are constructed during the decision process.
  *   **Why it matters:** Surveys aren't just passive thermometers; they are interventions. By asking someone "Do you care about the environment?", you prime them to act more environmentally. Ignoring speech ignores a mechanism that actually shapes future action.

  ### 3. Does the Conclusion Survive?
  Your roommate's conclusion is: *Surveys and self-reports are worthless; only trust choices.*

  **The Strong Form (Ignore Speech): Fails.**
  If you treat speech as pure noise, you lose the ability to distinguish between **constraints** and **tastes**, and between **plans** and **impulses**. You would conclude that a smoker who is desperately trying to quit *prefers* to die of lung cancer because their current action is smoking. That is technically "revealed," but practically useless for understanding or predicting them.

  **The Weak Form (Prioritize Action, Contextualize with Speech): Survives.**
  There is a kernel of truth your roommate is holding onto: **Actions are better predictors of future behavior than promises.**
  *   If someone says they love you but never calls, believe the silence.
  *   If someone says they want to save money but maxes out credit cards, believe the debt.

  In this weaker form, the thermometer analogy works *if* you acknowledge the thermometer has a margin of error. You trust the reading, but you use the speech to calibrate the instrument.

  ### 4. The Verdict
  Your roommate is right that **preferences are not introspective facts.** You cannot find out what someone wants just by asking them, because people lie to themselves (akrasia) and others (signaling).

  However, he is wrong that **speech is noise.** Speech is **diagnostic data.**
  *   **Choices** tell you what happened.
  *   **Speech** tells you *why* it happened (constraint vs. taste) and *what might happen next* (regret vs. satisfaction).

  **The Synthesis:**
  The thermometer analogy holds only if the room is empty, the thermometer is perfect, and the temperature is stable. Human life is none of those things.
  *   **Trust actions** to predict immediate behavior.
  *   **Trust speech** to understand constraints, internal conflicts, and potential for change.

  If you ignore the speech, you aren't doing economics; you're doing behaviorism. You're treating the roommate like a rat in a cage rather than an agent with a narrative. The "temperature" isn't just the reading; it's the climate system, and the speech is the barometer telling you a storm is coming.
