      *   *Pluralism:* The claim that "any attempt to rank... along one dimension... distorts" is a move toward value pluralism (e.g., Raz, Anderson). But the spectrum argument itself doesn't *prove* pluralism. It proves a tension between transitivity and our intuitions about trade-offs. One could resolve it by accepting transitivity and denying the intermediate judgments (the "lexical view" or "threshold view").
