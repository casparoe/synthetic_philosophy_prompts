      *   **Tier 3: The "Annoying" Challenges (Phenomenological & Practical):**
          *   The impossibility of living the view (reactive attitudes are involuntary).
          *   Semantic stubbornness (redefining "responsibility").
      *   **Addressing Unfalsifiability:** Is the view a "no true Scotsman" scenario?
      *   **Concessions vs. Dismissals:** What *must* the skeptic admit? What can they ignore?
      *   **Conclusion:** Summary of the landscape.

  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the user. Nagel/Strawson are heavy hitters. This is the "Hard Incompatibilist" or "Skeptic" position.
      *   *Tier 1 (Fatal?):* Focus on P.F. Strawson (Freedom and Resentment). He argues the skeptic asks for a justification of our practices that is impossible to give *and* unnecessary. Also, the "Reasons-Responsiveness" (Fischer/Ravizza). If I act on reasons, isn't that control enough, even if my capacity to process reasons was lucky? *Critique:* The skeptic says "but having that capacity was luck." So maybe not *fatal*, but the strongest metaphysical pushback.
      *   *Wait, is anything truly "fatal"?* In philosophy, rarely. I should frame "Fatal" as "The most threatening conceptual undermining." The strongest threat is **Compatibilism regarding 'Control'**. If 'control' just means 'not coerced and aligned with values,' luck doesn't kill it. The skeptic rejects this definition. So the battle is over definitions.
      *   *Better Tier 1:* **The Self-Undermining Objection.** If my beliefs are the result of luck/causation, why trust the belief in moral luck? (Plantinga/Evolutionary Argument against Naturalism style).
