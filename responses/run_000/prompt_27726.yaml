answer: |-
  You have hit on the open secret of evolutionary theory: **the units of selection debate is largely a philosophical and semantic stalemate masquerading as a biological one.**

  Your hunch is correct, but it goes even deeper than just "what counts as an explanation." As a journalist who has covered this, you've likely noticed that when a gene-centrist and a multilevel selection (MLS) theorist sit down with a whiteboard, they can usually translate each other's models without changing the predicted outcome. This suggests the disagreement isn't about the *world*, but about the *map*.

  Here is a breakdown of what kind of disagreement this actually is, why it persists, and what (if anything) could move it.

  ### 1. It is a Disagreement about "Causal Carving"
  You noted that everyone uses the Price Equation. That is the smoking gun. The Price Equation partitions evolutionary change into components. Mathematically, you can partition that variance at the level of the gene, the organism, or the group. Because the math is equivalent, you can translate a kin selection model into a group selection model and vice versa. This is often called the "translation manual" problem.

  If the math is equivalent, the disagreement is about **causal granularity**.
  *   **The Gene-Centrist View:** Causation flows from the bottom up. Even if a group trait correlates with survival, the *mechanism* is always differential gene replication. To locate causation elsewhere is to commit a category error.
  *   **The MLS View:** Causation can be top-down or contextual. If a group property (e.g., sex ratio, aggression level) determines the fitness of the individuals within it, then the group is a causal agent, regardless of the underlying genetic bookkeeping.

  Philosopher of biology **Samir Okasha**, in his definitive work *Evolution and the Levels of Selection*, argues that this is a dispute about **representation**. The biological reality is a complex causal process. The "units" are lenses we place over that reality. The gene-centric lens is powerful for some problems (e.g., intragenomic conflict); the MLS lens is powerful for others (e.g., major transitions, eusociality).

  So, is it verbal? **Yes, but not *merely* verbal.** In science, vocabulary dictates hypothesis generation. If you speak "Selfish Gene," you look for cheating and suppression. If you speak "MLS," you look for group structure and variance between collectives. They are different research heuristics.

  ### 2. It is a Disagreement about Ontology (Replicators vs. Interactors)
  Part of the stalemate comes from conflating two different questions that David Hull tried to separate in the 70s:
  1.  **What is the *replicator*?** (The entity that passes structure on with fidelity.)
  2.  **What is the *interactor*?** (The entity that interacts with the environment such that replication is differential.)

  Dawkins essentially argues that only genes are true replicators, so they must be the unit of selection. MLS theorists argue that selection acts on *interactors*, and interactors can exist at multiple levels (cells, organisms, colonies, species).

  The disagreement persists because gene-centrists tend to collapse the replicator and interactor into the gene, whereas MLS theorists decouple them. Until both sides agree on whether "unit of selection" refers to the *beneficiary* of evolution (the gene) or the *target* of selection (the interactor), they will talk past each other.

  ### 3. Why hasn't it moved? (The Sociological and Ideological Layer)
  If the math is settled, why the heat?

  **A. Rhetorical Power:**
  *The Selfish Gene* is one of the most successful pieces of science communication ever written. It provides a intuitive, punchy narrative. "Multilevel Selection" is clunky. "Group Selection" carries historical baggage (see below). In the marketplace of ideas, the gene-centric view won the PR war decades ago.

  **B. Historical Trauma:**
  In the mid-20th century, "group selection" was associated with Wynne-Edwards, who used it to explain altruism in ways that were mathematically naive. Worse, the idea that individuals sacrifice for the "good of the species" had uncomfortable echoes of fascist or communist ideology. The gene-centrists (Williams, Dawkins, Maynard Smith) didn't just win a math argument; they purged a dangerous ideology. For many older biologists, MLS still smells like Wynne-Edwards, even though modern MLS (D.S. Wilson, Nowak) is mathematically rigorous.

  **C. Disciplinary Silos:**
  Theorists know the equivalence. Field biologists often do not. A behavioral ecologist trained in kin selection views an MLS paper with suspicion, not because the math is wrong, but because it uses the "forbidden language."

  ### 4. What Would Move It?
  You asked if it would take a new formal result, a conceptual distinction, or waiting for a generation to retire.

  **It will not be a new formal result.**
  The Price Equation already did the heavy lifting. We know the models are isomorphic. More math won't solve a semantic/philosophical problem.

  **It will not be a single conceptual distinction.**
  Hull's replicator/interactor distinction helped, as did Maynard Smith and Szathmáry's *Major Transitions in Evolution*, which framed the history of life as a history of changing units of selection. But these haven't ended the debate; they've just given people more tools to argue with.

  **It is mostly Planck's Principle.**
  Max Planck famously said, "Science advances one funeral at a time." This debate is entrenched in the training and identity of specific cohorts.
  *   **The Gene-Centrists:** View their framework as the "null hypothesis" of biology.
  *   **The MLS Theorists:** View their framework as the only way to explain complexity and cooperation.

  **The Path Forward: Pragmatic Pluralism**
  The debate will only "end" when the question changes from **"Which one is true?"** to **"Which one is useful for this specific problem?"**

  We are seeing this shift in specific subfields:
  *   **Cancer Biology:** Tumors are clearly MLS scenarios (cell-level selection vs. organism-level selection). Gene-centrism is useless here; you need multilevel modeling.
  *   **Microbiomes:** The "holobiont" debate forces researchers to acknowledge selection acting on host + bacteria collectives.
  *   **Cultural Evolution:** You cannot apply strict genetic reductionism to memes/cultural traits without significant friction; MLS frameworks fit better.

  ### The Verdict
  The disagreement is **metaphysical pluralism disguised as empirical conflict.**

  Both sides are describing the same causal process using different coordinate systems. The gene-centric view is a "bottom-up" coordinate system; the MLS view is a "top-down" coordinate system. Neither is "false," but each has blind spots.

  **What would actually move it?**
  It requires a generation of biologists who are bilingual. We need researchers who can use Hamilton's Rule when it's efficient and switch to Price Equation partitioning when group structure is the dominant variable, without feeling they are betraying a tribal allegiance.

  Until then, it remains a "zombie debate"—mathematically dead, but sociologically immortal. As a journalist, your best angle is likely to stop asking "Who is right?" and start asking "What does each framework blind us to?" The gene view blinds us to emergent group properties; the MLS view can sometimes blind us to the mechanistic constraints of inheritance. The tension between them is actually productive, provided we admit it's a tension of *perspective*, not *reality*.
