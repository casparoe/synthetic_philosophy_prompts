      *   Tension (3) vs (4) is the "Error vs. Truth" problem.

      Okay, ready to write. The structure will be: Executive Summary, Tension Analysis (The Big Three), Severity Ratings, Revisions, and The Keystone Change.

      *Wait, one nuance on (1):* The user says "choices satisfy standard consistency conditions." But (3) says people *violate* them. So (1) implies "If they satisfy..." or "To the extent that..." I need to point out that (1) and (3) are technically incompatible if taken literally. (1) says Utility Max = Consistent Choices. (3) says People = Inconsistent. Therefore People != Utility Maximizers. But the user seems to want to use utility *for* people. This needs highlighting.

      *Wait, one nuance on (5):* Coercion implies an external constraint. Addiction implies an internal constraint. Info deficits imply a processing constraint. All three imply the choice doesn't match the *intent*. But (4) says intent (resolution) is just a forecast. So (5) relies on a distinction (4) rejects. This confirms (4) is the weak link.

      *Keystone:* Modifying (4) to distinguish between *choice* and *preference* (where preference is a stable function, choice is an output that might have noise/error). This aligns with how an SE thinks about specs vs. implementation.

