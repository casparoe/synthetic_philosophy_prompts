prompt: |-
  I keep encountering theories of vagueness—supervaluationism, epistemicism, many-valued and degree-theoretic approaches, contextualism—and each seems to talk past the others about what a theory of vagueness is even supposed to do. Before I read another one, I want the desiderata laid out explicitly. What must an adequate theory of vagueness deliver?

  For each requirement, give the case, puzzle, or datum that motivates it, and then assess whether it is non-negotiable or merely a preference of one camp. I am especially interested in the following:

  - The sorites paradox itself. What exactly does a theory have to do to count as having handled it—block the inference, dissolve the puzzle, explain away its pull? If merely blocking the paradox (e.g., by rejecting one premise) is enough, what further explanatory burden does the theory carry to account for why the paradox seemed compelling in the first place?
  - Borderline cases. A theory must explain what it is for a predicate to have borderline cases, and why we cannot resolve them by stipulation. But is it also required to explain why some predicates admit borderline cases while others do not—or is that a separate question a theory of vagueness can leave to someone else?
  - Higher-order vagueness. If a theory draws a sharp boundary between the clear cases and the borderline cases, it seems to recreate the sorites at a higher level. Is handling higher-order vagueness a genuine requirement, or is it a ladder we can kick away once the first-order paradox is resolved? If it is a requirement, what counts as a satisfactory treatment—eliminating the appearance of a higher-order boundary, or merely showing that it is harmless?
  - Logical revisionism. Must a theory preserve classical logic, or is it permitted to revise it—and if so, how much revision is too much? If a theory gives up bivalence or excluded middle, what does it owe us in return: a complete alternative logic, a translation manual back to classical reasoning, or something else?
  - Penumbral connections. Vague predicates do not float free of one another: nothing can be clearly red and clearly orange all over, and someone who is clearly tall is thereby not clearly short. A theory must respect these connections. Is this a separate requirement, or does it fall out of other desiderata? Does it constrain the logic of vague predicates in a way that rules out otherwise attractive candidates?
  - The forced-march sorites. Some theories handle the logical paradox but collapse when asked to classify each item in a sorites sequence one by one, since the theorist is forced either to draw a sharp cutoff or to give answers that seem to violate the theory's own semantics. Is the forced march a fair test of a theory, or does it smuggle in an assumption the theory is entitled to reject—such as that every statement in a series must be answerable?

  Finally: is there any subset of these desiderata that cannot be jointly satisfied? I have heard it suggested, for instance, that handling higher-order vagueness while preserving classical logic forces an infinite hierarchy of metalanguages, and that avoiding this requires sacrificing something else. If that is right, spell out the tension—the impossibility result, or the near-impossibility result, is more interesting to me than any particular positive theory. And if you had to pick one desideratum that eliminates the largest number of candidate theories in a single stroke, which one is it, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Theories of Vagueness (Supervaluationism, Epistemicism, Many-Valued, Contextualism, etc.).
      *   **Goal:** Explicitly lay out the *desiderata* (requirements) for an adequate theory of vagueness.
      *   **Structure:** For each requirement, provide the motivating case/puzzle/datum, and assess whether it's non-negotiable or a camp preference.
      *   **Specific Focus Areas:**
          1.  The Sorites Paradox (handling vs. explaining).
          2.  Borderline Cases (nature + distribution).
          3.  Higher-Order Vagueness (boundary vs. hierarchy).
          4.  Logical Revisionism (Classical vs. Non-Classical).
          5.  Penumbral Connections (semantic relations).
          6.  The Forced-March Sorites (practical classification).
      *   **Final Questions:** Are there incompatibilities (impossibility results)? Which single desideratum eliminates the most theories?

  2.  **Deconstruct the Desiderata (Drafting & Refining):**

      *   *Desideratum 1: The Sorites Paradox.*
          *   *Motivation:* The paradox (Heap, Bald, etc.) shows classical logic + plausible premises lead to absurdity.
          *   *Requirement:* Must block the validity of the argument OR deny a premise OR deny the conclusion.
          *   *Nuance:* Merely blocking isn't enough; must explain the *phenomenology* (why it feels compelling). This is the "Error Theory" burden.
          *   *Status:* Non-negotiable. If you don't solve Sorites, you aren't a theory of vagueness.

      *   *Desideratum 2: Borderline Cases.*
          *   *Motivation:* There are cases where we hesitate (is this red?).
          *   *Requirement:* Explain the status of these cases (truth-value gap? ignorance? degree 0.5?). Explain why stipulation feels wrong.
          *   *Nuance:* Explaining *why* some predicates are vague (natural kinds vs. artifacts) might be external semantics/metaphysics, not strictly logic of vagueness.
          *   *Status:* Core requirement to explain the *status*, optional to explain the *etiology* of vagueness.

      *   *Desideratum 3: Higher-Order Vagueness.*
          *   *Motivation:* If "Borderline" is precise, we have a new sharp boundary. Sorites returns.
          *   *Requirement:* Avoid sharp boundaries between clear and borderline.
          *   *Status:* Highly contested. Epistemicists accept sharp boundaries (even higher-order). Degree theorists struggle with this. Supervaluationists try to model it but face technical issues. It's a major pressure point, but some (Epistemicists) deny it's a bug. Let's call it "Strongly Preferred but Contested."

      *   *Desideratum 4: Logical Revisionism.*
          *   *Motivation:* Classical Logic (CL) implies bivalence. Vagueness seems to violate bivalence.
          *   *Requirement:* Either preserve CL (and explain away the violation) or revise CL (and justify the cost).
          *   *Status:* This is a fork in the road, not a single requirement. The requirement is *consistency*. However, preserving CL is often seen as a theoretical virtue (conservatism). Revising it requires paying a "logical cost."

      *   *Desideratum 5: Penumbral Connections.*
          *   *Motivation:* Kit Fine's point. "John is tall and not tall" is false, even if "John is tall" is borderline. "Red" and "Orange" exclude each other.
          *   *Requirement:* The logic must validate logical relations between vague predicates even in the penumbra.
          *   *Status:* Non-negotiable for semantic adequacy. Simple 3-valued logic often fails this (if $P$ is $I$ and $\neg P$ is $I$, $P \land \neg P$ might be $I$ not $F$).

      *   *Desideratum 6: The Forced-March Sorites.*
          *   *Motivation:* Raffman/Shapiro. If you go through a series, you must say "Yes" at some point.
          *   *Requirement:* Explain how a speaker can navigate the series without committing to a sharp cutoff in their *practice*, even if their semantics implies one.
          *   *Status:* This tests the *psychological/pragmatic* plausibility. Some theories (Epistemicism) say "You just don't know where." Others (Contextualism) say "The standard shifts." It's a strong test of *application*, not just formal semantics.

  3.  **Addressing the "Impossibility" and "Eliminator" Questions:**

      *   *Incompatibilities:* The "Trilemma" is common.
          1.  Preserve Classical Logic.
          2.  Accommodate Higher-Order Vagueness (no sharp boundaries).
          3.  Maintain Compositional Semantics (standard truth conditions).
          *   *Result:* You usually can't have all three. Epistemicism keeps 1 & 3, sacrifices 2. Supervaluationism keeps 1 & 2 (sort of), struggles with 3 (truth-value gaps break compositionality sometimes) or Higher-Order (technical complexity). Degree theories keep 2 & 3, sacrifice 1.
          *   *Specific Tension:* Higher-Order Vagueness + Classical Logic. If logic is classical, boundaries are sharp. If boundaries are sharp, HOV is hard to model without infinite hierarchy (Tarski style).

      *   *The Big Eliminator:* Higher-Order Vagueness.
          *   Why? Because Epistemicism (a major contender) flatly denies the datum (says boundaries *are* sharp). Many-valued logics struggle to define "definitely" without reintroducing sharp cuts. Supervaluationism gets bogged down in technicalities. If you demand a theory that *dissolves* the sharp boundary at *all* orders without logical revision, almost everyone fails.
          *   *Alternative:* Penumbral Connections. Simple fuzzy logic fails this immediately.
          *   *Decision:* Higher-Order Vagueness is the deepest philosophical rift. Penumbral Connections is a technical filter. I will argue Higher-Order Vagueness is the most eliminative because it forces a metaphysical stance (is vagueness in the world/language or knowledge?).

  4.  **Drafting the Content (Iterative refinement for tone and precision):**

      *   *Tone:* Analytic, rigorous, philosophical but accessible. Avoid taking sides, but highlight the costs.
      *   *Structure:* Introduction -> The 6 Desiderata (Case, Requirement, Status) -> Incompatibilities/Impossibility -> The Big Eliminator -> Conclusion.
      *   *Refining the Sorites:* Distinguish between *diagnosis* (where is the error?) and *explanation* (why did we make it?).
      *   *Refining HOV:* Mention the "Boundary Problem."
      *   *Refining Logic:* Mention the cost of giving up Excluded Middle vs. Bivalence.
      *   *Refining Penumbral:* Use Fine's example explicitly.
      *   *Refining Forced March:* Distinguish semantic competence from psychological capacity.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about "what a theory is supposed to do"? Yes, by framing them as deliverables.
      *   *Check:* Did I address the "non-negotiable vs. preference" aspect for each? Yes, crucial for the user's request.
      *   *Check:* Is the impossibility result clear? The tension between Classical Logic and No Sharp Boundaries is the key.
      *   *Check:* Is the "Big Eliminator" justified? I need to make sure I explain *why* HOV is the hardest nut to crack. (Actually, Penumbral Connections is a better technical eliminator for simple fuzzy logic, but HOV is the deeper philosophical eliminator. I will focus on the tension between Classical Logic and HOV as the main impossibility result).

  6.  **Final Polish:** Ensure clear headings. Make sure the distinction between "solving the paradox" and "explaining the intuition" is sharp. Ensure the Forced March distinction (semantic vs. pragmatic) is clear. (Self-correction: Ensure I mention that Epistemicism *accepts* sharp boundaries, so for them HOV isn't a bug, which makes it a contested desideratum).

