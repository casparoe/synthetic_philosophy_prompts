answer: |-
  This is the central crux of *On Certainty*, and you have identified the exact pressure point where most readers either feel Wittgenstein is offering a profound dissolution of skepticism or a frustrating capitulation to it.

  Your worry is essentially this: **If a belief is held without evidence and is immune to criticism, isn't that the definition of dogmatism?** If Wittgenstein admits we have no grounds for believing the world exists, hasn't he just agreed with the skeptic that our position is baseless, while asking us to ignore the implication?

  The mistake lies in categorizing hinge propositions as *epistemological* failures (bad knowledge) rather than *grammatical* or *practical* conditions (the framework for knowledge). To see why a hinge is not a prejudice, we need to look at three specific distinctions Wittgenstein draws: the difference between a **rule and a move**, the difference between **psychological and logical certainty**, and the difference between **irrationality and arationality**.

  ### 1. Rules vs. Moves (The Category Mistake)
  The skeptic treats hinge propositions as moves within the game of justification that happen to lack support. They ask: "What is your evidence for the existence of the external world?" expecting a move like "My senses tell me" or "Science proves it."

  Wittgenstein argues that hinge propositions are not moves *in* the game; they are the **rules** of the game.

  Consider chess. If I ask, "Why does the bishop move diagonally?" you cannot give me an empirical proof. You cannot say, "We tested bishops and found they move best diagonally." The diagonal movement is a rule that *constitutes* the game of chess. If you move the bishop like a rook, you aren't playing chess badly; you aren't playing chess at all.

  Similarly, "Physical objects do not vanish when unperceived" functions as a rule for our language game of describing reality. It is not a hypothesis we have confirmed; it is the background against which confirmation and disconfirmation take place.
  *   **Prejudice:** A move within the game that is unsupported or biased (e.g., "I believe this witness because I like him").
  *   **Hinge:** The board on which the game is played.

  Calling a hinge a "prejudice" is a category mistake. A prejudice is something that *could* be otherwise within the same system of thought. A hinge defines the system itself.

  ### 2. Psychological vs. Logical Certainty
  You ask: *"Why isn't it simply a prejudice that we happen to be psychologically unable to give up?"*

  Wittgenstein anticipates this. He distinguishes between being *convinced* (psychological) and being *certain* (logical/grammatical).
  *   **Psychological:** "I feel so sure the earth exists." This is a state of mind. It admits of degrees.
  *   **Logical/Grammatical:** "The earth exists" functions as a standard of measurement.

  If it were merely psychological inability, then the skeptic would be right: we are just biologically hardwired to be dogmatic. But Wittgenstein argues that the "inability" to doubt hinges is not a failure of imagination or courage; it is a loss of **meaning**.

  To doubt something meaningfully, you must hold other things fast. If I doubt whether I have hands, I must rely on the meaning of the word "hand," the reliability of my memory, the existence of the chair I'm sitting on, etc. If I try to doubt *everything* at once (global skepticism), the doubt loses its sense because there is no background left against which the doubt can register as a doubt.

  As Wittgenstein writes in **OC §115**: *"If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty."*

  Therefore, it is not that we *won't* doubt hinges; it's that we *can't* doubt them without destroying the language required to express the doubt. That isn't prejudice; that is the logic of signification.

  ### 3. Irrationality vs. Arationality
  Your strongest charge is: *"A system of beliefs built on such assumptions is irrational by the very standards it claims to honor."*

  This assumes that "rationality" is a freestanding tribunal that can judge the entire system from the outside. Wittgenstein rejects the "view from nowhere." Rationality (giving grounds, inferring, proving) is a practice that happens *inside* a form of life.

  *   **Irrational:** Violating the rules of reasoning within a system (e.g., affirming the consequent, ignoring counter-evidence).
  *   **Arational:** Standing outside the scope of reasoning entirely.

  Hinges are **arational**. They are not conclusions reached by reason; they are the inherited background against which we distinguish between the true and the false (**OC §94**).

  To call the system "irrational" because its foundations are ungrounded is like calling the metric system "false" because the standard meter bar in Paris isn't measured by anything else. It is the standard *by which* measuring happens. It doesn't need to be measured to function as a measure.

  Wittgenstein is not conceding that our beliefs are ungrounded in a way that makes them weak. He is arguing that **grounding must come to an end** (**OC §192**). If every belief required a ground, and that ground required another ground *ad infinitum*, no belief could ever be justified. The "ground" is ultimately an action, a form of life, not a proposition.

  ### 4. The Fluidity of Hinges
  One final safeguard against the "prejudice" charge is that hinges are not eternal dogmas. They can change.

  Wittgenstein notes that what serves as a hinge can shift over time (**OC §61**). For a medieval thinker, "The sun orbits the earth" might have functioned as a hinge (a framework assumption). For us, it is an empirical claim that is false. Conversely, "The earth is a globe" has shifted from an empirical discovery to a hinge (try doubting it in a court of law or a physics lab; you will be treated as insane, not skeptical).

  Prejudices are typically rigid and resistant to change despite evidence. Hinges shift when the entire "riverbed" of our thought shifts (**OC §96-99**). This historical fluidity shows they are not merely psychological quirks, but structural elements of a world-picture that evolves.

  ### Summary: The Mistake in the Skeptic's Challenge
  The mistake in saying a hinge is an "ungrounded assumption" is that the word **assumption** implies a voluntary stance within a game of justification. It suggests: *"I am assuming X for the sake of argument, though I know I lack proof."*

  Wittgenstein's point is that we do not *assume* hinges; we **enact** them. We do not decide to treat physical objects as real; we interact with them. The certainty is in the hand that reaches for the cup, not in the head that thinks "the cup exists."

  So, to answer your specific question:
  1.  **Why isn't it a prejudice?** Because a prejudice is a distortion *within* a worldview. A hinge *is* the worldview.
  2.  **Why isn't it irrational?** Because rationality is a tool used within the system. You cannot use the tool to validate the workshop that contains it. The system is not irrational; it is **groundless**, and that groundlessness is not a defect, but a condition of its possibility.

  Wittgenstein isn't telling the skeptic, "You're right, we have no proof, but let's ignore that." He is telling the skeptic, "You are demanding a kind of proof (a ground for the ground) that has no sense in our language. Your doubt is not deeper than our certainty; it is empty."
