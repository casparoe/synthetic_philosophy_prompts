          *   *Exchange 3:* The "Proviso" (Rawls's later concession). Alex: You can mention religion if secular reasons follow. Ben: This is second-class citizenship; translation is often impossible.
          *   *Exchange 4:* Epistemic Humility & Burdens of Judgment. Alex: We disagree because reason is limited (Burdens of Judgment). Ben: That applies to secular comprehensive doctrines too (e.g., Kantianism).
