answer: |-
  **Phase 1:** Place five sealed envelopes labeled "Monday" through "Friday" on the desk and announce that one contains a homework pass to be distributed on that day, emphasizing that the specific day must remain logically unpredictable until the moment you open it.

  **Phase 2:** Guide the class to collaboratively prove that the prize cannot be in Friday's envelope, then Thursday's, and so on, until they are convinced the prize cannot exist anywhere without violating the surprise condition.

  **Phase 3:** Allow them to settle into the certainty that no envelope contains the prize, perhaps even letting them vote on which day is "safest" or declaring the activity impossible.

  **Phase 4:** Select an early envelope like Tuesday, open it to reveal the prize, and hand it to a student who visibly did not expect it at that exact moment despite their earlier proof.

  **Phase 5:** Ask why their valid logic produced a false conclusion, connect this to the gap between epistemic logic and empirical reality, and handle objections about self-reference by explaining that the announcement itself alters the knowledge state. Anticipate claims that you cheated by reaffirming that the paradox remains formally unresolved in logic, ensuring they see the tension rather than a trick.

  **Spoiler Assessment:** Yes, the activity falls apart if a student reveals the trick early, because the tension relies on them believing the announcement is a genuine commitment rather than a known puzzle. If you suspect a spoiler, pull them aside beforehand to ask for their help in preserving the experiment, or frame the activity explicitly as "testing a known paradox" rather than making a genuine surprise promise.
