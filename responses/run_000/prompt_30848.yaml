answer: |-
  **Setting:** *A quiet alcove off the main conference hall. The hum of the HVAC system competes with the distant murmur of a reception. Two empty coffee cups sit on a small table between them.*

  **Characters:**
  *   **Elena (Bohmian):** Defends Pilot Wave Theory. Focuses on ontology and trajectories.
  *   **Mark (Everettian):** Defends Many-Worlds. Focuses on unitary dynamics and decision theory.

  ***

  **Mark:** You looked restless during the Q&A, Elena. When I mentioned that the Born rule emerges from the symmetries of the Hilbert space, you practically vibrated out of your chair.

  **Elena:** [Smiles] Only because you glossed over the hard part. You derived the *math* of the Born rule, Mark. You didn't derive the *meaning* of probability. In my framework, it's straightforward. Probability is ignorance. We don't know the exact initial configuration of the particles.

  **Mark:** Ignorance is classic. I like it. It's honest. But here's the pressure point: Why is that ignorance distributed according to $|\psi|^2$? If particles have definite positions $Q$, and the wave $\psi$ is just a guiding field, why can't the particles be distributed according to some $\rho \neq |\psi|^2$?

  **Elena:** They can. That's "quantum non-equilibrium." But if you start in equilibrium, the dynamics preserves it. That's equivariance. The Liouville theorem of the pilot wave.

  **Mark:** But why start there? To get the Born rule out, you have to put the Born rule in as an initial condition. It looks like an extra postulate bolted onto the deterministic dynamics. You're smuggling the measure you're trying to explain into the boundary conditions.

  **Elena:** It's not a postulate; it's typicality. Think of it like statistical mechanics. You don't need to postulate that gas molecules are in thermal equilibrium; you show that the vast majority of microstates correspond to equilibrium. For us, "vast majority" is measured by the $|\psi|^2$ measure on configuration space.

  **Mark:** [Leans forward] There it is. "Measured by." You're using the $|\psi|^2$ measure to define what counts as "typical." If you used a different measure, you'd get a different notion of typicality. You're justifying the Born rule by assuming the very measure the Born rule defines. It's circular, Elena.

  **Elena:** It's not circular if the measure is natural to the dynamics. The $|\psi|^2$ distribution is the unique one that is equivariant. It's the only one that moves *with* the flow without distorting. Any other distribution relaxes to it, like entropy.

  **Mark:** Does it? That's the subquantum H-theorem, right? Valentin's work? It's plausible, but it relies on coarse-graining. And honestly, it feels like you're doing a lot of heavy lifting to save a concept of probability that I think is actually clearer in my picture.

  **Elena:** Clearer? You have every outcome happening. In a spin measurement, there is a Mark who sees Up and a Mark who sees Down. Both are real. So when you say "the probability of Up is 0.9," what on earth do you mean? There is no ignorance of the outcome. The outcome is *both*.

  **Mark:** It's self-locating uncertainty. Before the measurement, I don't know *which* branch I will find myself in.

  **Elena:** But you'll find yourself in *both*. There's a successor of you in the Up branch and a successor in the Down branch. They both have your memories up to the split. Why should the pre-measurement Mark care more about one successor than the other? If I told you, "I'm going to clone you, and one clone gets punched," you should be worried about the punch, regardless of how many clones get created.

  **Mark:** But I'm not just cloning. The branches have weights. It's not about counting successors; it's about the measure of existence. Decision theory shows that a rational agent who cares about their future successors must weight them by amplitude squared. If you don't, you're vulnerable to a Dutch Book. You'll make bets that guarantee a loss across the multiverse.

  **Elena:** That assumes the agent *should* care about amplitude. Why? If there are two branches, and in one I win a million dollars and in the other I lose it all, why is it rational to bet on the one with the higher amplitude if *both* happen? The "loss" branch still contains a suffering Mark. His suffering isn't diluted by the fact that there's a happy Mark elsewhere with a bigger wavefunction coefficient.

  **Mark:** That's the intuition pump, Elena. But the "number of branches" isn't well-defined. You can't just count them. Decoherence defines the branching structure, but it's fuzzy. Depending on your basis or your coarse-graining, you could say there are two branches or a billion. If you try to ground probability in branch counting, you get nonsense. The only invariant structure is the amplitude.

  **Elena:** I agree branch counting is nonsense. That's why I have particles. I don't count branches; I track trajectories. The particle goes *one* way. That's where the uniqueness comes from. The wave goes both ways, but the *event*—the click of the detector—is singular because the particle is singular.

  **Mark:** But the particle is dragged along by the wave. If the wave amplitude is negligible in the "Down" branch, the particle is overwhelmingly likely to be in the "Up" branch. But if the particle is just a tag riding the wave, doesn't that make it epiphenomenal? The statistics are determined entirely by the wave dynamics. The particle just tells us which movie screen we're looking at, but the projector is doing all the work.

  **Elena:** It's not epiphenomenal; it's the *reality* of the outcome. Without the particle, you have a superposition of dead and alive cats. With the particle, you have a live cat and an empty room. You solve the probability problem by denying the uniqueness of the outcome. I solve it by preserving uniqueness.

  **Mark:** But at the cost of non-locality and that suspicious "quantum equilibrium" postulate. Look, let's dig into your typicality argument again. You say $|\psi|^2$ is the natural measure. But in my view, the Hilbert space norm is the *only* natural measure. It's the only one preserved by unitary evolution. So when I say a rational agent weights branches by amplitude, I'm not bolting on a postulate. I'm respecting the geometry of the state space.

  **Elena:** Geometry doesn't generate credence. A vector's length doesn't tell an agent how much to worry. You need a bridge principle. In my case, the bridge is "we are typical observers." In your case, the bridge is "rational agents maximize utility weighted by norm." Both are bridge principles. Mine connects dynamics to frequency. Yours connects... what? Geometry to caring?

  **Mark:** [Pauses] Geometry to decision-making. If the universe is unitary, then the "caring measure" has to respect the symmetries of that unitarity. If I treat a low-amplitude branch as equally important as a high-amplitude one, I'm violating the symmetry of the physical state.

  **Elena:** But that assumes the physical state *is* just the wave. If the physical state includes the configuration—the particles—then the symmetry is broken. The particle is here, not there. The probability is 1 for where it is, and 0 for where it isn't. The $|\psi|^2$ is just our ignorance of where "here" is.

  **Mark:** And if the universe only happens once—which it does, in your view—then typicality arguments are shaky. You're saying our initial configuration is "typical." But typical relative to what ensemble? There's only one universe.

  **Elena:** There's only one universe in your view too, Mark. It's just a very big, branching one.

  **Mark:** True. But in my view, the "ensemble" is real. All the branches exist. In yours, the ensemble is hypothetical. You're invoking a measure over possible initial conditions for a single actual trajectory. I'm invoking a measure over actual existing branches.

  **Elena:** But your branches aren't discrete. You admitted it. Decoherence is approximate. So your "actual existing branches" are fuzzy clouds. My particles are sharp.

  **Mark:** Sharp, but hidden. And governed by a velocity field that depends on the instantaneous configuration of the entire universe. Non-locality is a high price for sharpness.

  **Elena:** Non-locality is a feature of the world, Bell taught us that. I just put it in the ontology. You hide it in the "splitting" of worlds.

  **Mark:** [Sighs] We're circling. Here's where I think the impasse sits. You think probability must be about *which* outcome occurs. I think probability is about *how much* of the multiverse contains a given outcome.

  **Elena:** And I think "how much of the multiverse" is meaningless without particles to count. You have a continuum of stuff, and you're trying to carve it into probabilities using the norm. I have discrete events, and I'm using the norm to describe our ignorance of them.

  **Mark:** But if your particles are distributed as $|\psi|^2$ because of typicality, and my branches are weighted as $|\psi|^2$ because of decision theory... we both end up integrating $|\psi|^2$.

  **Elena:** We do. But the metaphysical cost is different. I pay with non-locality and a specific initial condition. You pay with... what? An explosion of ontology and a redefinition of "I."

  **Mark:** I pay with the intuition that probability requires uncertainty about *what happens*. I replace that with uncertainty about *where I am*.

  **Elena:** And I maintain that if *everything* happens, nothing is uncertain.

  **Mark:** [Picks up his coffee cup, finds it empty] Except whether we'll ever agree on which story makes more sense.

  **Elena:** [Stands up] Probably not. But at least we agree the Born rule isn't going anywhere.

  **Mark:** Typical.

  **Elena:** [Smiles] In both our senses.
