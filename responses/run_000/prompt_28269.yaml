      Let's refine the "Status Quo" one. That's the one the journalist is most interested in (climate, AI). I should make sure that gets prominent placement.

      Okay, ready to write.

      *Key nuance:* Leibniz's "Best" is about *richness of phenomena* + *simplicity of laws*. Modern tech usage is about *efficiency*. I need to point out this category error.

      *Let's finalize the structure.*
