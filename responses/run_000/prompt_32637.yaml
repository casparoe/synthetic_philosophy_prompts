      *   *Synthesis:* The analogy is a *justification*, not a *proof*. It works for "constitutional democracy" but fails for "rigid originalism." The legitimacy comes from the *ability to amend* (the escape hatch) and the *content* of the rights (protecting democracy itself), not just the act of binding.

