answer: |-
  1. Dependency structure (~300 words)
  You must establish five conceptual pieces in strict sequence. First, define **Competence vs. Comprehension**. Competence is reliable performance; comprehension is semantic understanding of *why* it works. This distinction is the foundation; without it, the inversion is invisible. Second, establish **The Folk Intuition**: the default view that competence requires comprehension (Top-Down Design). Students must feel the pull of this intuition to feel the "strangeness" of its inversion.

  Third, introduce **Darwin's Inversion**. Show how design (competence) emerges from blind variation and retention. This must come before Turing because biological design is physically tangible; it breaks the "Designer" intuition in the macro world first. Fourth, introduce **Turing's Inversion**. Show how logical inference (competence) emerges from blind symbol manipulation. This follows Darwin to extend the inversion from biology to cognition. Finally, offer the **Algorithmic Synthesis**: unite them as blind algorithmic processes.

  Regarding order: Darwin must precede Turing. Darwin grounds the argument in physical reality, reducing resistance from non-CS students who might view computation as abstract artifact. Turing then leverages that grounding to tackle the mind, reducing resistance from non-biologists who might view evolution as merely metaphorical. Neither stands alone effectively; Darwin without Turing remains biological; Turing without Darwin remains abstract. They scaffold each other to universalize the claim. If you start with Turing, CS students may get bogged down in syntax/semantics debates before accepting the premise. Darwin forces the physical reality of "design without designer" first, making the cognitive extension plausible.

  2. The carrying example (~200 words)
  I recommend **splitting the carrying examples** but unifying them under the structural description of a **Generate-and-Test Loop**. Use the **Vertebrate Eye** for Darwin and a **Sorting Algorithm** for Turing.

  Features required: Both must demonstrate high-order output (vision, sorted list) arising from low-order, blind steps (mutation, comparison/swap). They must lack a central controller or lookahead capability. Features to lack: Neither example should involve an artifact designed for a purpose (e.g., a clock), as this invites the "who designed the clock?" regress objection immediately.

  Justification for splitting: A single concrete example rarely spans biology and computation without category errors. Biologists will reject a computer as a model for life; CS students will reject an eye as a model for logic. By anchoring each inversion in its home discipline, you gain credibility before bridging them. The "Generate-and-Test" structure is the abstract carrying concept that links the two concrete examples, allowing you to return to the *structure* even when switching *cases*. This prevents students from fixating on the substrate (flesh vs. silicon) and keeps focus on the logical inversion.

  3. Misconception map (~400 words)
  1. **Comprehension = Consciousness.** Arises immediately upon defining terms. Students equate understanding with feeling. *Mitigation:* Explicitly define comprehension as "semantic grasp of reasons," distinct from qualia. *Risk:* Students may think you are dismissing consciousness entirely, disengaging philosophy students.
  2. **Comprehension Does Not Exist.** Arises when stating the inversion. Students hear "competence without comprehension" as "comprehension is an illusion." *Mitigation:* Clarify that humans have comprehension, but it is not a *prerequisite* for competence. *Risk:* Confusion about where comprehension comes from if not required.
  3. **Darwin = Randomness.** Arises during Darwin section. Students think evolution is pure chance. *Mitigation:* Emphasize the *selection* filter, not just variation. Use the "blind watchmaker" metaphor carefully. *Risk:* Over-correcting into determinism, losing the "blind" aspect.
  4. **Turing = Mere Syntax.** Arises during Turing section. CS students think "symbol manipulation" is trivial. *Mitigation:* Highlight that the *competence* (logical truth) emerges despite the machine's ignorance of meaning. *Risk:* Getting bogged down in symbol grounding debates.
  5. **The Regress Objection.** Arises at synthesis. "Who designed the algorithm?" *Mitigation:* Explain that the algorithm is a law of nature/logic, not a designed artifact. The buck stops at physics/logic. *Risk:* Seeming dogmatic about physicalism.
  6. **Anthropomorphizing the Process.** Arises throughout. "Nature tries to..." *Mitigation:* Ban teleological language strictly. *Risk:* Making the explanation clunky and hard to follow.
  7. **It's Just Reductionism.** Arises at synthesis. Students think you are denying higher-level phenomena. *Mitigation:* Emphasize that competence is real, even if comprehension isn't its source. *Risk:* Students feel their discipline is being colonized by another.

  Address these in order. If you head off the consciousness conflation too early, you risk making the topic seem dryly functionalist, losing the philosophical stakes. If you let the regress objection surface too late, it can derail the final synthesis. Let the "Randomness" misconception surface during the Darwin section so you can use it to demonstrate the necessity of selection, turning the error into a teaching tool.

  4. Check for understanding (~150 words)
  Pose this question: "Consider the evolution of common law legal precedents over centuries. Does this system exhibit competence without comprehension? Identify the 'variation' and the 'selection'."

  A correct answer identifies legal rulings as competent solutions to social problems arising from case-by-case variation and judicial selection, without a central legislature designing every outcome. This shows they grasp the algorithmic structure applied to a novel cultural domain.

  A wrong answer claiming "Judges comprehend the law" reveals they missed the systemic inversion (confusing individual comprehension with systemic competence). A wrong answer claiming "It is random" reveals they missed the selection mechanism (the Darwinian piece). This tests the synthesis of both inversions. It forces them to locate the "blindness" in a system composed of comprehending agents, proving they understand the level-of-analysis shift required by Dennett's claim.

  5. What to leave out (~150 words)
  1. **The Hard Problem of Consciousness.** Flag: "That is a real question but it is not tonight's question because we are analyzing functional competence, not subjective experience."
  2. **Strong AI Viability.** Flag: "That is a real question but it is not tonight's question because we are analyzing the logical structure of computation, not current engineering limits."
  3. **Specific Genetic Mechanisms.** Flag: "That is a real question but it is not tonight's question because the logical structure of selection matters more than the molecular substrate."
  4. **Human Free Will.** Flag: "That is a real question but it is not tonight's question because we are discussing the origin of competence, not the status of agency."

  Keep the focus on the *structure of the inversion*, not the metaphysical fallout. These tangents are valid but will consume the ninety minutes without securing the core conceptual shift.
