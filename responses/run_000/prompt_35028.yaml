  Dear Colleague,

  I completely sympathise with your frustration at the pub, as that specific circularity is precisely what makes the toxin puzzle so enduringly annoying for anyone teaching practical rationality. It is one thing to recount the example and quite another to grasp why it threatens the coherence of instrumental reasoning itself. To help your students move beyond the surface-level paradox, I have drafted an exam question that should force them to engage with the structural constraints of instrumental rationality rather than just rehearsing the narrative. The question is as follows. Kavka's Toxin Puzzle is often presented as a challenge to the principle that intentions must be based on reasons. Explain why the puzzle poses a specific problem for instrumental rationality rather than moral rationality. Evaluate whether any solution that remains faithful to the core tenets of instrumental rationality can successfully dissolve the paradox.

  Below is a model answer that should fit within a forty-five minute writing window and hit the required depth.

  Kavka describes a scenario where a millionaire offers a sum of money for forming the intention to drink a toxin that causes pain but no lasting harm. The money is deposited upon intention formation, before the drinking is supposed to occur. Consequently, when the time comes to drink, the money is already secured, and drinking yields only pain with no additional benefit. The puzzle targets instrumental rationality because it exposes a tension between the rationality of intentions and the rationality of actions. Instrumental rationality usually requires that an agent intends to do something only if they believe they will do it for a reason. Here, the agent has a reason to intend, as it secures the money, but no reason to act, as the money is already won. If the agent is instrumentally rational, they know at the moment of intention that they will lack a reason to drink later. Therefore, they cannot sincerely believe they will drink, and thus cannot form the intention. The paradox is that instrumental rationality prevents the agent from securing the reward, while an irrational ability to bind oneself would succeed. This highlights a failure of means-end coherence where the means of securing the reward involves an intention that rational agents cannot form.

  Responses often invoke resolute choice or planning agency. A resolute chooser decides at the outset to follow through and treats that prior decision as a sufficient reason to act later, regardless of changed circumstances. This challenges the standard instrumentalist view that reasons must be forward-looking and based on current outcomes. If instrumental rationality demands maximising utility at the time of action, then drinking the toxin is irrational. However, if instrumental rationality encompasses the maintenance of planning integrity, then following through preserves a capacity that is generally useful. This shifts the focus from individual acts to the agent's extended temporal existence. Yet this move is contentious. It risks conflating rationality with mere consistency. If the plan was based on a reason that no longer exists, adhering to it looks like dogmatism. To dissolve the puzzle while respecting instrumental rationality, one must argue that the act of drinking serves the instrumental good of being a planning agent. Without this, the puzzle remains a counterexample to the claim that instrumental rationality always guides agents to the best outcomes. It suggests that being rational in the narrow sense prevents one from achieving the best results.

  The deep issue is whether instrumental rationality is actualist or deliberative. An actualist view says reasons depend on the state of the world at the time of action. A deliberative view allows past intentions to generate current reasons. If we accept the latter, the puzzle dissolves, but instrumental rationality is modified to include constitutive norms of agency. If we stick to the former, the puzzle stands, showing that instrumental rationality can be self-defeating. A successful solution must demonstrate how intending creates a normative reason that survives the disappearance of the original incentive. Until then, the toxin puzzle suggests that pure instrumental rationality is insufficient for agents who need to coordinate their actions over time. It implies that rational agency requires a commitment mechanism that instrumental reasoning alone cannot justify. Thus, the puzzle forces a choice between narrowing instrumental rationality to momentary maximisation or expanding it to include the structural norms of planning, with significant implications for how we understand practical reason.

  Regarding the marking scheme, you will want to distinguish clearly between levels of engagement with the instrumentalist framework. A C grade answer will typically summarise the puzzle accurately but fail to isolate the specific problem for instrumental rationality, perhaps treating it as a moral or psychological issue about willpower. They might suggest the agent can simply lie to themselves about their future actions without recognising the transparency of intention. A B grade answer will identify the conflict between the reason to intend and the reason to act, and will likely discuss resolute choice or planning theory. However, they may not fully evaluate whether these solutions remain faithful to instrumental rationality or merely modify it. They might accept resolute choice as a solution without critiquing its compatibility with forward-looking reasons. An A grade answer must distinguish between actualist and deliberative conceptions of instrumental rationality. They need to argue whether preserving planning integrity counts as an instrumental good or a constitutive norm. Crucially, they must evaluate if the proposed solution dissolves the paradox or merely relocates it by redefining rationality. They should engage with the idea that instrumental rationality might be self-defeating in this context and assess whether expanding the theory to include temporal coherence undermines its core commitment to reason-responsive action.

  I hope this helps you construct a paper that separates the students who have truly grappled with the text from those who have merely memorised the example. It is a fiendish puzzle, but that is precisely why it deserves such rigorous treatment in a third-year module.

  Best wishes,

  Your Assistant
