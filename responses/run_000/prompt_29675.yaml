answer: |-
  To the Members of the Neurotechnology Ethics and Innovation Board

  Colleagues, we are convened to deliberate on a proposal that challenges the foundational boundaries of medical ethics and metaphysics. The application before us seeks permission for a staged whole-brain replacement in a patient facing a fatal neurodegenerative condition, a procedure that promises biological survival and functional continuity at the cost of total substrate replacement. In forming my recommendation, I have weighed the competing ethical imperatives of beneficence, non-maleficence, and respect for autonomy against the profound philosophical uncertainty regarding personal identity. The central tension lies between the company's functionalist account of survival, which posits that continuity of memory and behavior constitutes the persistence of the self, and the board's ontological concern that functional equivalence does not guarantee numerical identity. We must acknowledge that the dissenting members raise a philosophically robust objection that cannot be empirically dismissed. They are correct that no behavioral test, no matter how rigorous, can verify that the subjective experience of the original patient persists rather than being terminated and replaced by a psychologically continuous successor. If the original consciousness ceases during the early stages of replacement, the subsequent entity, while indistinguishable to observers and perhaps even to itself, would be a distinct person living on the consent of the dead. This risk of metaphysical death is distinct from biological death and represents a harm that our current regulatory frameworks are ill-equipped to measure or mitigate.

  However, we must also weigh this metaphysical risk against the concrete reality of the patient's condition. The alternative to this procedure is near-certain biological death within two years, accompanied by significant suffering. The patient possesses full decisional capacity and has explicitly stated a willingness to accept the risk of non-survival in the philosophical sense to avoid biological cessation. In clinical ethics, we generally defer to a capacitated patient's valuation of their own interests and their tolerance for risk, even when those risks are unconventional. To reject the application solely on the grounds of a philosophical dispute about personal identity would be to impose a specific metaphysical view upon the patient that they do not share. It would prioritize the board's theoretical concern over the patient's lived reality and autonomous choice. Furthermore, rejecting the application does not solve the metaphysical problem; it merely ensures the patient's death while leaving the philosophical question unanswered. Conversely, outright approval without safeguards would be irresponsible given the unprecedented nature of the intervention and the validity of the identity concerns. We cannot treat the risk of psychological discontinuity as negligible, nor can we assume that initial consent remains valid if the consenting entity ceases to exist midway through the eighteen-month protocol.

  Therefore, after considering the options of outright rejection, unconditional approval, and regulated access, I recommend that the board grant approval with strict conditions. This path respects the patient's autonomy and right to pursue life-saving treatment while acknowledging the legitimacy of the identity concerns raised by the opposition. We must treat the potential loss of personal identity as a serious adverse event comparable to physical harm. To this end, approval should be contingent upon the implementation of a dynamic consent protocol that requires re-consent at each surgical stage, verified by an independent ethics advocate who has no ties to the sponsoring company. This advocate must assess not only the patient's capacity but also the continuity of their self-narrative and values before each module implantation. Additionally, the protocol must include predefined stopping rules where the procedure is halted if there is evidence of significant psychological discontinuity, abrupt personality shifts, or distress regarding identity reported by the patient or observed by independent neuropsychologists. The company must also agree to long-term follow-up extending at least five years post-procedure to monitor for late-emerging discontinuities or psychological distress related to the nature of their existence.

  Regarding the time frame, I propose that the board conditionally approve the application within the next fourteen days, provided the company submits the revised consent and monitoring protocols within thirty days. The procedure itself should not commence until these protocols are ratified by the board, and the entire eighteen-month replacement sequence must be completed within a twenty-four-month window to prevent undue prolongation of the experimental state. This conditional approval allows us to honor the patient's urgent need for intervention without abdicating our ethical responsibility to the metaphysical risks involved. It acknowledges that while we cannot prove the patient survives, we can create a structure that maximizes the likelihood of continuity and respects the gravity of the possibility that they might not. By proceeding with these safeguards, we accept the uncertainty without being paralyzed by it, balancing the duty to care for the living patient with the duty to protect the integrity of the person. I urge the board to adopt this measured approach, which neither dismisses the philosophical objections nor allows them to dictate a death sentence for a capacitated individual seeking hope.

  Sincerely

  Member, Neurotechnology Ethics and Innovation Board
