  1.  **Analyze the User's Request:**
      *   **Context:** Campus Effective Altruism (EA) group.
      *   **Problem:** Someone is using "earning to give" (EtG) as a conversation stopper to argue that high-earning careers (consulting) are *always* more ethical than direct impact work (nonprofit global health), specifically in a case where the salary difference is 3x.
      *   **Task:** Break down the different precise claims "earning to give" could be making.
      *   **Criteria:** For each claim, evaluate if it's trivially true, substantive/defensible, or false.
      *   **Specific Application:** Identify which reading the consulting-job argument *needs* to work in this specific case and evaluate whether *that* reading survives scrutiny.
      *   **Format:** A list suitable for bringing to a meeting.

  2.  **Deconstruct "Earning to Give" (EtG):**
      *   What is EtG? It's a career strategy within EA where one pursues a high-income career not for personal consumption but to donate a significant portion to effective charities.
      *   Why is it controversial? It often clashes with "direct work" (working directly on the problem).
      *   What are the underlying assumptions?
          *   Marginal utility of money.
          *   Replaceability (if I don't take this nonprofit job, someone else will).
          *   Counterfactual impact (what happens if I take the consulting job vs. the nonprofit job?).
          *   Personal fit/sustainability.
          *   Cause neutrality.

  3.  **Brainstorm Precise Claims (The "List"):**
      *   *Claim 1: The Arithmetic Claim.* If I earn more, I can donate more. (Trivial).
      *   *Claim 2: The Dominance Claim.* EtG *always* produces more impact than direct work. (False/Too strong).
      *   *Claim 3: The Replaceability Claim.* My direct work would be replaced by someone else anyway, so my marginal impact is low. (Substantive, context-dependent).
      *   *Claim 4: The Counterfactual Claim.* In *this specific case*, the donated money does more good than the direct work. (Substantive, requires calculation).
      *   *Claim 5: The Movement Building Claim.* EtG signals commitment/funds the movement. (Substantive).
      *   *Claim 6: The Option Value Claim.* EtG keeps options open. (Substantive).

      *Refining for the prompt:* The prompt asks for claims about *size of donation*, *dominance*, *replaceability*, and *counterfactuals*. I should structure the list around these specific dimensions to match the user's request.

      *Drafting the Claims:*
      1.  **The Trivial Arithmetic Claim:** Higher salary = potential for higher donation.
      2.  **The Strong Dominance Claim:** EtG is *categorically* better than direct work.
      3.  **The Replaceability Claim:** Direct work roles are easily filled; earning roles are not.
      4.  **The Marginal Impact Claim:** The specific dollars donated do more good than the specific work done.
      5.  **The Personal Fit Claim:** You will earn more/sustain the career better in the high-earning path.

  4.  **Evaluate Each Claim:**
      *   *Arithmetic:* Trivially true (mathematically), but ignores taxes, living costs, burnout.
      *   *Dominance:* False. 80,000 Hours and EA thought leaders have moved away from this. Direct work is often bottlenecked by talent, not just money.
      *   *Replaceability:* Substantive/Defensible *sometimes*, but often false in niche/skilled areas (like global health logistics).
      *   *Marginal Impact:* Substantive/Defensible. Requires comparing the specific charity against the specific job impact.
      *   *Counterfactual:* Substantive. Needs to compare (Consulting + Donation) vs. (Nonprofit Work).

  5.  **Analyze the Specific Argument (Consulting vs. Global Health Logistics):**
      *   *The Situation:* Nonprofit (Global Health Logistics) vs. Consulting (3x salary).
      *   *The Argument:* Consulting is *obviously* more ethical because EtG.
      *   *Which Claim is Needed?* To say it's *obviously* better without further discussion, the arguer needs the **Strong Dominance Claim** or a very strong version of the **Marginal Impact Claim** that assumes money is the only bottleneck.
      *   *Does it Survive?*
          *   Global health logistics is often talent-constrained, not just cash-constrained.
          *   3x salary doesn't mean 3x donation (taxes, lifestyle inflation, burnout).
          *   Replaceability is likely low for specialized logistics work.
          *   Therefore, the "obvious" conclusion fails.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, charitable but rigorous, suitable for an EA meeting (jargon-appropriate but clear).
      *   *Structure:*
          1.  Introduction (acknowledge the frustration).
          2.  The List of Claims (with truth values).
          3.  The Specific Case Analysis (Consulting vs. Nonprofit).
          4.  Conclusion/Talking Points.

      *Refining the "Truth Values":*
      *   Make sure to distinguish between "logically true" and "empirically true."
      *   Ensure the distinction between "EtG is a valid strategy" vs. "EtG is the *only* valid strategy" is clear.

      *Focusing on the "Consulting Job Argument":*
      *   The arguer is using EtG as a *trump card*. This implies they believe EtG dominates direct work *in this instance*.
      *   To support this, they need to assume: (a) Money is the binding constraint for global health, (b) The candidate is replaceable in the nonprofit role, (c) The candidate will actually donate the difference.
      *   Most likely, they are relying on a heuristic that has become outdated (the "finance/consulting is best" heuristic from ~2015 EA).

  7.  **Final Review against Constraints:**
