answer: |-
  Here is a breakdown you can bring to your meeting. It separates the slogan "Earning to Give" (EtG) into its component empirical claims, evaluates their truth status, and then applies them to the specific consulting vs. global health logistics case.

  ### Part 1: Taxonomy of "Earning to Give" Claims

  When someone says "You should earn to give," they are usually conflating several distinct claims. Here is what they could actually mean, and the status of each claim.

  **1. The Arithmetic Claim**
  *   **Claim:** "A higher salary allows for a larger absolute donation than a lower salary."
  *   **Status:** **Trivially True.**
  *   **Caveat:** This ignores taxes, cost of living adjustments, and lifestyle inflation. Earning 3x does not guarantee donating 3x.

  **2. The Funding Constraint Claim**
  *   **Claim:** "The bottleneck for doing good is always money, not talent or execution."
  *   **Status:** **False (as a universal).**
  *   **Nuance:** Some causes are funding-constrained (e.g., cash transfers). Others are talent-constrained (e.g., AI safety research, specialized global health logistics). If the bottleneck is talent, donating money does not solve the problem as effectively as applying your labor directly.

  **3. The Replaceability Claim**
  *   **Claim:** "If you don't take the direct-impact job, someone else almost as good will take it immediately, rendering your marginal impact near zero."
  *   **Status:** **Substantive and Context-Dependent.**
  *   **Nuance:** This is often true for generic roles (e.g., general outreach). It is often false for specialized roles requiring specific networks, skills, or security clearances (e.g., logistics in fragile states). If you are hard to replace, your direct impact is high.

  **4. The Strong Dominance Claim**
  *   **Claim:** "Earning to give is *categorically* more ethical than direct work for anyone capable of high earnings."
  *   **Status:** **False.**
  *   **Nuance:** This was a popular heuristic in EA circa 2015 but has been largely walked back by organizations like 80,000 Hours. They now emphasize "cause neutrality" and "comparative advantage." For many people, direct work is the higher-impact path.

  **5. The Counterfactual Impact Claim**
  *   **Claim:** "In *this specific instance*, (Consulting Salary − Living Expenses) × Charity Effectiveness > (Nonprofit Impact − Replaceability Adjustment)."
  *   **Status:** **Substantive and Defensible (but requires calculation).**
  *   **Nuance:** This is the only claim that actually justifies the decision. It requires estimating the specific impact of the nonprofit role vs. the specific donation amount from the consulting role. It cannot be asserted a priori.

  ***

  ### Part 2: Diagnosing the Consulting-Job Argument

  In your specific case (Consulting vs. Global Health Logistics), your peer is arguing that the consulting job is *obviously* the more ethical choice. To sustain this conclusion, their argument **needs** to rely on a combination of **The Strong Dominance Claim** and **The Funding Constraint Claim.**

  They are assuming that:
  1.  Money is the primary bottleneck for global health logistics.
  2.  Your labor in that logistics role is easily replaceable.
  3.  You will successfully donate the salary differential without burning out.

  **Does this reading survive scrutiny?**
  **No.** Here is why that specific argument fails in this context:

  *   **Talent vs. Funding:** Global health logistics is often execution-constrained. Moving supplies through customs in difficult regions requires specific on-the-ground knowledge and relationships. Money cannot instantly buy that capacity; skilled people are required. If the organization is talent-constrained, your direct labor is worth more than your marginal donation.
  *   **The 3x Illusion:** A salary 3x higher does not result in a donation 3x higher. After taxes and baseline living costs, the *disposable* income difference might be much smaller. Furthermore, high-stress consulting careers have higher burnout rates, which often leads to "earning to spend" or career breaks, nullifying the EtG plan.
  *   **Replaceability:** Specialized logistics roles are not commodity jobs. If you decline the role, the nonprofit may not find a replacement quickly, or they may hire someone less competent, directly reducing the aid delivered.
  *   **Movement Signaling:** If every capable EA takes consulting jobs, the movement loses capacity to actually run the programs it funds. EA needs a mix of funders and implementers.

  ***

  ### Part 3: Talking Points for the Meeting

  If you want to move the conversation forward without being dismissive, try these points:

  1.  **"Let's distinguish strategy from heuristic."**
      *   "EtG is a valid *strategy* for some people, but using it as a universal *heuristic* to shut down discussion ignores the nuance of talent constraints."
  2.  **"What is the bottleneck?"**
      *   "For this specific nonprofit, is the limiting factor cash or skilled labor? If they have money but can't move supplies, my direct work is more valuable than a donation."
  3.  **"Let's run the counterfactual."**
      *   "Instead of assuming EtG wins, can we estimate the actual donation I could make vs. the actual value of the logistics work? 80,000 Hours suggests we should compare marginal impacts, not just salaries."
  4.  **"Sustainability matters."**
      *   "EtG only works if I actually donate. If the consulting job burns me out in two years, the long-term impact might be lower than a sustainable career in global health."

  **Summary Verdict:** The claim that consulting is *obviously* better relies on a outdated, overly broad version of Earning to Give that ignores talent constraints and replaceability. In global health logistics, direct work is frequently the higher-impact option.
