answer: |-
  # Q&A Prep Sheet: Eternalist Endurance & Adverbial Instantiation

  **Workshop:** Metaphysics of Persistence
  **Presenter:** [Your Name]
  **Audience:** 20 Philosophers (10 Persistence Metaphysicians, 2 Phil Phys, 3 Historians, 5 Generalists)
  **Core Thesis:** Endurantism is viable without Presentism via adverbial instantiation; perdurantism conflates epistemic tracking with metaphysical constitution.

  ---

  ### 1. The "Disguised Relation" Objection (The Lewis Charge)
  **Likely Asker:** Senior Perdurantist Metaphysician
  **Phrasing:** "You claim to save temporary intrinsics by saying objects instantiate properties *t-ly*. But if the property is modified by a time, isn't it functionally identical to a relation to a time? If 'being bent' becomes 'being-bent-at-t', you haven't preserved the intrinsicality of the property. You've just dissolved the problem by turning all temporally indexed properties into relations. Lewis's dilemma stands: either it's a relation (and not intrinsic) or it's a contradiction."

  **Two-Minute Reply:**
  "Thank you, that's the central hurdle. My response is that we must distinguish between a *relation to a time* and a *mode of instantiation*. When I say the poker is bent-at-t, I am not positing a ternary relation between Object, Property, and Time. I am modifying the copula. Think of it like spatial variation: we don't say the table is a relation to a location; we say it is bent *here* and straight *there*. The property 'bent' remains monadic; the *instantiation* is what is indexed.
  The perdurantist treats time as a dimension of parts, so properties are had by parts. I treat time as a parameter of instantiation. This preserves the intuition that the *whole* object is bent, not just a temporal slice. If we accept that instantiation can be modified without becoming relational—just as we accept modal operators modify truth without making truth relational—then the contradiction vanishes without sacrificing intrinsicality."

  **Candid Weakness:**
  This relies heavily on the intuition that "modification of the copula" is metaphysically distinct from "relation." Many will feel this is a distinction without a difference. If you can't give a positive account of what "adverbial instantiation" *is* (other than not being a relation), it looks like verbal magic.

  ### 2. The "Notational Variant" Objection (The Stage Theorist)
  **Likely Asker:** The Stage Theorist (specifically mentioned in brief)
  **Phrasing:** "I'm sympathetic to the idea that we don't need temporal parts, but look at your formal semantics. You quantify over objects and bind them to times. I quantify over stages and bind them to objects. Our truth conditions for 'The poker was bent' come out identical. Aren't you just doing temporal parts theory with a different grammar? If the empirical and logical consequences are the same, why posit this mysterious adverbialism?"

  **Two-Minute Reply:**
  "It's a fair challenge, but the ontological commitments differ significantly. On the stage view, when you say 'The poker is bent,' you are strictly speaking referring to a momentary stage. The persistence of the poker is a matter of counterpart relations between distinct entities.
  On my view, 'The poker' refers to a single entity that is numerically identical across times. The semantic similarity masks a metaphysical divergence: you have a plurality of entities connected by relations; I have one entity with complex instantiation conditions. This matters for modality and causation. If I am wholly present now, *I* am the cause of my future actions. On your view, a distinct future counterpart is the cause. We may agree on truth conditions for simple tense logic, but we disagree on the ontology of agency and causation."

  **Candid Weakness:**
  Stage theorists often argue that their view *better* handles causation (via causal relations between stages). If pressed on whether your "single entity" adds any explanatory power beyond satisfying a linguistic intuition about reference, you might look like you're paying a high ontological price for a grammatical preference.

  ### 3. The "Special Relativity" Objection
  **Likely Asker:** Philosopher of Physics
  **Phrasing:** "You reject Presentism, so you accept the block universe. But Endurantism requires an object to be 'wholly present' at a time. In SR, 'at a time' is frame-dependent. If an object is wholly present on one hypersurface of simultaneity, it's not wholly present on another. Doesn't Eternalist Endurance require a privileged foliation of spacetime, thereby contradicting relativity?"

  **Two-Minute Reply:**
  "This is a common worry, but it assumes 'wholly present' must be defined via global simultaneity slices. I propose we understand 'wholly present' in terms of spacetime regions, not global times. An object endures if it is located at multiple spacetime regions without having distinct parts at each.
  We can adopt a 'frame-relative' endurance: the object is wholly present relative to a reference frame. This doesn't posit a privileged frame ontologically; it just acknowledges that persistence claims are often made within a frame. Alternatively, we can define location via the object's worldtube. As long as the object is not *extended* in time by having parts, but is *multilocated* across the worldtube, SR is respected. The tension arises only if you insist endurance requires a global 'now'."

  **Candid Weakness:**
  "Multilocation" in SR is technically tricky. If you are multilocated at spacelike separated regions, you risk violating principles about impenetrability or causal propagation. Physicists may find "frame-relative existence" ontologically unsatisfying (i.e., does the object exist or not?).

  ### 4. The "Explanation of Change" Objection
  **Likely Asker:** Perdurantist Metaphysician
  **Phrasing:** "You argue perdurantism gets a 'free ride' on change. But perdurantism explains change as qualitative variation across temporal parts, which is coherent. You say the object changes. But if the object is wholly present at t1 with property F, and wholly present at t2 with property ~F, haven't you just asserted change without explaining *how* it's possible? You've labeled the mystery 'adverbialism,' but haven't dissolved it."

  **Two-Minute Reply:**
  "Perdurantism doesn't explain change; it explains *variation*. A movie reel has variation across frames, but the reel itself doesn't change. Real change requires a subject to persist and differ. My view accepts that change is a primitive feature of persistence.
  The 'free ride' I mention is the claim that perdurantism feels intuitive only because we confuse tracking an object (epistemology) with its constitution. We track things by observing changes. Perdurantism builds this tracking method into the ontology. I argue we should separate them. The 'how' of change is simply that instantiation is time-sensitive. That is not an evasion; it's the claim that time is a fundamental modifier of existence, not just a dimension of extension."

  **Candid Weakness:**
  Calling change "primitive" can sound like giving up. Perdurantists pride themselves on reducing change to static variation. If your "primitive change" feels like a black box, their "static variation" will seem more analytically rigorous, even if less intuitive.

  ### 5. The "Epistemic Access" Objection
  **Likely Asker:** Generalist or Perdurantist
  **Phrasing:** "You distinguish the metaphysical question from the epistemic question of reidentification. But if the object is wholly present at each moment, and properties are indexed adverbially, what grounds our judgment that it's the *same* object? If you strip away temporal continuity of parts, aren't you making persistence unknowable?"

  **Two-Minute Reply:**
  "Not unknowable, just distinct. We reidentify objects via causal continuity and qualitative similarity. That's an epistemic criterion. Perdurantists often argue that because this is how we *know* persistence, it must be what persistence *is*. That's a conflation.
  My metaphysics allows for the possibility that our epistemic criteria could fail (e.g., fission cases) while the metaphysical fact remains determinate. By separating the two, I preserve the intuition that what I am is not just a series of connected stages, but a single thing that *has* a history. The grounding is the numerical identity of the substance, which is brute but not unknowable."

  **Candid Weakness:**
  If your metaphysics makes the epistemic criteria seem accidental or disconnected from the nature of the object, listeners may ask why we should care about the metaphysics. If "numerical identity" is brute and disconnected from continuity, it risks being an occult fact.

  ### 6. The "Ideological Cost" Objection
  **Likely Asker:** Metaphysician concerned with Parsimony
  **Phrasing:** "Perdurantism pays an ontological cost (temporal parts) for ideological simplicity (standard instantiation). You save ontology (no parts) but pay an ideological cost (primitive adverbial operators, time-indexed instantiation). Why is your ideological cost preferable? It seems you're just shifting the brute facts."

  **Two-Minute Reply:**
  "Ontological parsimony is generally preferred to ideological parsimony. Positing new entities (temporal parts) multiplies commitments about what exists. Positing a complex mode of instantiation clarifies *how* existing things exist.
  Furthermore, the ideological cost is not as high as it seems. We already accept modal operators and locational modifiers. Time-indexed instantiation fits naturally into that family. The perdurantist 'cost' is higher: they must explain why we refer to worms when we speak of people, and handle the proliferation of entities. I prefer to complicate the predicate rather than the world."

  **Candid Weakness:**
  Many contemporary metaphysicians (Quineans) treat ontological and ideological cost as comparable. If your adverbial operators require a complex, non-standard logic, they may argue you haven't actually saved any theoretical virtue.

  ---

  ### The "Prayer Question" (The Deepest Tension)
  **The Question:** "If an object is *wholly present* at t1 and *wholly present* at t2, it is multilocated. If it is multilocated, does it instantiate properties at the *fusion* of t1 and t2? If yes, it is F and ~F simpliciter (contradiction). If no, then its properties are only had relative to regions. But if properties are only had relative to regions, isn't the object effectively extended in time like a worm, just without the parts? Have you really escaped perdurantism, or just described a 'gunky' worm?"

  **Why this is dangerous:** It targets the coherence of "Wholly Present" in an Eternalist framework. If you can't define "wholly present" without implying contradiction or collapsing into perdurantism, the core view fails.

  **Handling Strategy:**
  1.  **Deny the Fusion Premise:** "I deny that the object instantiates properties at the fusion of t1 and t2. Instantiation is always relative to a region, not a fusion of regions."
  2.  **Embrace Multilocation:** "The object is multilocated. Contradictions only arise if we assume properties are had *simpliciter*. Since I argue they are had *at-t*, there is no contradiction at the fusion."
  3.  **Distinguish from Worms:** "A worm has distinct parts at t1 and t2. I have the *same* numerically identical entity at t1 and t2. That is a robust metaphysical difference, even if the spatial extension looks similar."
  4.  **Fallback:** If pressed hard, admit this is the frontier of the view. "This highlights why we need the adverbial account. Without it, multilocation is contradictory. With it, multilocation is coherent. The tension you feel is the intuition of presentism fighting eternalist endurance. We must let go of the idea that 'wholly present' implies 'present simpliciter'."

  **Candid Weakness:**
  This is the hardest spot. If "instantiation relative to a region" sounds exactly like "having a part at a region," the distinction collapses. You must hold the line that *identity* across regions is the key, not just location.
