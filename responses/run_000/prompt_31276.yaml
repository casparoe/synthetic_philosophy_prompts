      *   **Ranking Tensions:**
          1.  C1 vs C5 (Logical contradiction).
          2.  C2 vs C3 (Aesthetic/Ethical conflict).
          3.  C1 vs C3 (Scope creep).
      *   **What Has to Give:**
          *   For 1: C5 must be nuanced. Causal history isn't an excuse *unless* it destroys capacity.
          *   For 2: The novel should dramatize the conflict, not solve it.
      *   **Single Revision:** Revise C5. Don't say it *silences* blame (which implies no responsibility). Say it makes blame *tragic* or *futile*. This keeps the character responsible (C1) but allows the other characters to step back (C3) without lying about metaphysics. It preserves the drama.

  9.  **Refining the "Single Revision":**
      *   If I tell them to change C5 to strict Strawson, they might lose the empathy they want.
