  1.  **It solves both logical paradoxes.** Denying Closure (1) is the only single move that resolves both the Lottery Paradox and the Preface Paradox simultaneously. Denying (3) solves the Lottery but leaves the Preface intact (you'd still believe every sentence in the book, creating the same contradiction).
