answer: |-
  You have identified a robust and significant structural pattern in normative theory. While there is no single, universally standardized term that covers all four domains simultaneously, the pattern is widely recognized under a cluster of related concepts. The most precise umbrella description is **Idealized Reflective Endorsement** or the **Ideal Advisor Model**.

  In meta-ethics and decision theory, this is often discussed under the heading of **Rationalist Constructivism** or **Response-Dependence Theory**. In artificial intelligence alignment, your fourth example is explicitly named **Coherent Extrapolated Volition (CEV)**. In formal epistemology, it is closely related to van Fraassen's **Reflection Principle**.

  Here is an analysis of whether this similarity is deep or shallow, how the cases map onto existing literature, and where the classification is most vulnerable.

  ### 1. Is there a unified name?

  There is no single "canonical" label that functions like "gravity" in physics, but philosophers generally recognize this as a family of **Proceduralist** or **Constructivist** accounts of normativity.

  *   **The General Label:** The move is best described as appealing to **Counterfactual Reflective Authority**. You are treating the judgment of a counterfactual agent (your idealized self) as authoritative for your actual self.
  *   **Meta-Ethics:** This is the core of **Ideal Observer Theory** (Firth, 1952) and **Ideal Advisor Theory** (Smith, 1994). Michael Smith, for instance, argues that to know what is right is to know what we would desire ourselves to do if we were fully rational.
  *   **Decision Theory:** This appears in **Ratificationism** (Richard Jeffrey), where a decision is rational only if, knowing you have made it, you would still prefer it. It also appears in the **Reflection Principle** (Bas van Fraassen), which states your current credence in a proposition should match your expectation of your future credence.
  *   **AI Alignment:** As noted, this is **Coherent Extrapolated Volition** (Yudkowsky, 2004), which explicitly defines human values not as what we say now, but as what we would want if we knew more, thought faster, and were more the people we wished we were.

  ### 2. Is the similarity deep or shallow?

  The similarity is **structurally deep** but **metaphysically contested**.

  **Why it is deep:**
  In all four cases, the move solves the same problem: **The Normative Gap.** Actual agents are noisy, biased, tired, and ignorant. If normativity (what we *ought* to do/believe) depended strictly on actual mental states, normativity would be unstable and often wrong. By shifting the locus of authority to an *idealized* version of the agent, these theories preserve the intuition that values/truths are "ours" (internal to the agent) without succumbing to the errors of our actual psychology.

  They all share three structural commitments:
  1.  **Continuity of Identity:** The idealized agent must be "you" enough that their verdict binds you.
  2.  **Improvement Condition:** The idealized conditions must be strictly better (more information, more coherence, less bias) in a way that is normative, not just descriptive.
  3.  **Procedural Truth:** The "right answer" is defined by the output of the idealized process, not by an external standard independent of that process.

  **Why it might be shallow:**
  The resemblance risks being superficial if the *mechanism* of idealization differs fundamentally between domains.
  *   In **Ethics (Rawls/Ideal Observer)**, the idealization is often *substantive* (impartiality, veil of ignorance). It changes *who* you are (a generic spectator) to ensure fairness.
  *   In **Practical Reasoning (Sleep/Time)**, the idealization is *restorative*. It assumes your core preferences are stable and merely obscured by noise (fatigue).
  *   In **AI (CEV)**, the idealization is *extrapolative*. It assumes your preferences might change in light of new information, and endorses those changes.

  If the ethical case requires you to become *impartial* (losing your personal perspective) while the practical case requires you to become *more yourself* (removing fatigue), they may be solving different problems with similar-looking tools.

  ### 3. Mapping your four cases to the literature

  1.  **Moral Philosophy:** This is **Meta-Ethical Constructivism**. Christine Korsgaard and John Rawls are key figures. The "Veil of Ignorance" is a specific technological implementation of idealization designed to filter out self-interest.
  2.  **Everyday Reasoning:** This is **Diachronic Rationality** or **Precommitment Strategy**. It relies on the assumption of **Preference Stability**. You trust your future self because you believe your fundamental values are constant, even if your processing power fluctuates.
  3.  **Epistemology:** This is the **Reflection Principle**. However, a key distinction exists: in formal epistemology, this is often a consistency constraint on probabilities, whereas in your description, it is a heuristic for resolving uncertainty.
  4.  **AI Alignment:** This is **Inverse Reinforcement Learning (IRL)** pushed to its limit. Standard IRL tries to learn current preferences; CEV tries to learn the *function* that generates preferences under idealization.

  ### 4. Where is this classification most vulnerable?

  You asked specifically where the boundaries might be drawn differently if the central cases turn out to differ. The classification is most vulnerable to the **Epistemic Access Objection** and the **Identity Alienation Objection**.

  #### A. The Epistemic Access Problem (The "Black Box" Vulnerability)
  This is the most principled way to carve the cases apart.
  *   **The Problem:** To defer to your idealized self, you must have some idea of what they would conclude. But if you could easily determine what your idealized self would conclude, you likely wouldn't need to defer to them; you could just think that way now. If you *cannot* determine what they would conclude without doing the idealized thinking yourself, the heuristic is empty.
  *   **The Split:**
      *   In **Everyday Reasoning** (Case 2), you often have *inductive evidence* of what your rested self thinks (you have been rested before). The access is empirical.
      *   In **Ethics/AI** (Cases 1 & 4), the idealized state is often *counterfactual and unreachable* (omniscience, perfect impartiality). You cannot empirically check what that self would want. You must *theorize* it.
  *   **Vulnerability:** If the "Idealized Reflective Endorsement" model requires empirical access to the ideal self's mind to work, then Cases 1 and 4 collapse into mere speculation, while Case 2 remains a valid heuristic. This would suggest the pattern is a **category error** when applied to high theory.

  #### B. The Identity Alienation Problem (The "Who is Who?" Vulnerability)
  *   **The Problem:** At what point does the idealized self stop being *you*? If I become omniscient and perfectly impartial, do I still care about my children more than strangers? If not, why should *current* me, who does care, defer to *that* agent?
  *   **The Split:**
      *   **Restorative Idealization (Case 2):** Removes noise (fatigue) to reveal the *true* signal. Identity is preserved.
      *   **Transformative Idealization (Case 1 & 4):** May change the signal itself (e.g., realizing suffering is worse than you thought). Identity is potentially altered.
  *   **Vulnerability:** If the pattern only holds when the idealization is *restorative* (removing bias) but breaks when it is *transformative* (changing values), then Ethics and AI (which often allow value transformation) are fundamentally different from Everyday Reasoning. This would suggest the unified phenomenon is actually two different phenomena: **Error Correction** vs. **Value Evolution**.

  ### 5. Conclusion

  The pattern you have noticed is **real and significant**. It is the backbone of much modern normative theory. The most accurate label for the unified phenomenon is **Idealized Reflective Authority**.

  However, the classification is most vulnerable to the distinction between **Restorative** vs. **Transformative** idealization.
  *   If the idealized self is just you without the bugs (fatigue, bias), the deferral is an **Epistemic Trust** move.
  *   If the idealized self is you with upgrades that change your values (more knowledge, impartiality), the deferral is a **Normative Constitutive** move.

  If future analysis shows that "what I would want if I knew more" fundamentally diverges from "what I want" in a way that makes the former alien to the latter, the unified pattern breaks. The most plausible alternative classification would separate **Diachronic Self-Trust** (Cases 2 & 3) from **Counterfactual Constructivism** (Cases 1 & 4). The former is about trusting your own stability; the latter is about defining truth through a procedure.

  **Recommendation for further inquiry:** Look into the literature on **"The Paradox of Idealization"** (often discussed in relation to Ideal Observer Theory) and **"Rationality and Reflection"** (Miriam Schoenfield). These sources directly address whether deferring to an idealized self is a coherent normative strategy or a circular evasion.
