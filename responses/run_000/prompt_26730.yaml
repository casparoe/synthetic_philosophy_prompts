answer: |-
  The dust of the debate hall still clung to the hem of Udayana's robe as he walked beside Dharmottara along the riverbank. The sun was dipping below the western trees, casting long shadows over the path leading to their lodgings.

  "You defended the four *pramāṇas* (instruments of valid knowledge) with your usual vigor, friend," Dharmottara said, breaking the silence. "But surely you see the redundancy? To posit *śabda* (testimony) and *upamāna* (comparison) as distinct from *pratyakṣa* (perception) and *anumāna* (inference) is to multiply entities without necessity."

  Udayana adjusted the scroll case on his shoulder. "Necessity is dictated by the nature of cognition, not by a desire for parsimony. If the causal mechanism of knowing differs, the instrument differs. Take testimony. You claim it is merely inference."

  "Precisely," Dharmottara replied. "When you hear a sentence, you infer the speaker's intended meaning based on the words used. It relies on *vyāpti* (the invariable concomitance that licenses an inference), specifically the observed connection between words and their meanings established by convention."

  Udayana stopped walking for a moment, forcing Dharmottara to pause. "If testimony were inference, understanding would depend on assessing the speaker's reliability. Yet, if a child or a liar speaks, I understand the meaning immediately, even if I do not believe the content. In inference, if the reason is flawed, the conclusion does not arise. But in language, the meaning arises even from false speech. How do you infer truth from a lie?"

  Dharmottara resumed walking, his eyes on the path. "You conflate validity with comprehension. What is inferred is not the truth of the external object, but the speaker's intention (*tātparya*). The words function as a sign (*liṅga*) of that intention. Just as smoke indicates fire, words indicate the speaker's conceptual construction."

  "But where does this sign-relation come from?" Udayana pressed, catching up. "In inference, *vyāpti* is discovered through repeated observation of smoke and fire. We do not observe the creation of the word-meaning relation in the same way. It is given by *saṅketa* (linguistic convention), which is authoritative in itself, not derived from observation of co-presence."

  "Convention is just a shared habit," Dharmottara countered. "A habit observed over time. Thus, it remains within the realm of inference based on past experience. You cling to *śabda* because you crave an eternal authority. We accept that language is a pragmatic tool, reducible to the two fundamental sources: perception of the sound and inference of the meaning."

  Udayana sighed. "Very well. Let us leave testimony for the evening and turn to *upamāna*. Here your reductionism fails utterly. Consider the standard case: A man is told by a forester, 'A *gavaya* (wild bison) resembles a cow.' Later, he goes to the forest, sees an animal, and cognizes, 'This is what the word *gavaya* denotes.'"

  Dharmottara nodded. "I know the example. You claim this is a third instrument. I say it is a composite. He perceives the animal. He remembers the forester's testimony. He notes the similarity. Where is the new *pramāṇa*?"

  "The knowledge produced is relational," Udayana explained. "It connects the word *gavaya* to this specific individual animal through similarity. It is not perception alone, for perception only gives the animal's form, not its name. It is not testimony alone, for the forester did not point to *this* animal. It is not inference, because there is no *vyāpti* between 'resembling a cow' and 'being called gavaya.'"

  "Is it not an inference?" Dharmottara asked sharply. "The major premise is: 'Whatever resembles a cow in that specific context is called a *gavaya*.' The minor premise is: 'This animal resembles a cow.' Therefore, 'This is a *gavaya*.'"

  Udayana shook his head. "Where did you learn that major premise? If you say from the forester's words, you are begging the question and relying on *śabda*. If you say from observation, you have never observed this specific animal before. The cognition 'This is the referent of that word' flashes forth immediately upon seeing the similarity. It is a unique cognitive event."

  "It is memory activated by perception," Dharmottara insisted. "The perception of the animal triggers the memory of the instruction. The synthesis happens in the mind. To call it a distinct instrument is to call every complex cognition a new instrument. Why not posit an instrument for 'recollection' or 'doubt' as well?"

  "Because recollection is not valid knowledge of a new object," Udayana retorted. "And here, the relation between the name and the object *is* newly known. You reduce the world to fit your two categories, Dharmottara. You slice away the texture of experience to save your ontology."

  "And you populate the epistemic landscape with ghosts," Dharmottara shot back, stopping as they reached the gate of their lodging quarter. "Every time you cannot explain how a cognition arises, you posit a new *pramāṇa*. We seek the root. Perception grasps the particular (*svalakṣaṇa*). Inference grasps the universal (*sāmānyalakṣaṇa*). Everything else is a construction built upon these foundations."

  "But the foundation cannot explain the building," Udayana said, turning to face his friend under the flickering lamp light. "If *upamāna* were merely inference, the error of misidentification would be logical, not perceptual. Yet, we correct the man by showing him the animal again, not by correcting his syllogism. The knowledge is grounded in the recognition of similarity, which is neither identity nor causality."

  Dharmottara smiled faintly, pushing open the wooden gate. "Similarity is a conceptual overlay, Udayana. It does not exist in the real particular. Therefore, knowledge based on it cannot be fundamental. But I concede this: the phenomenology of the *gavaya* cognition feels distinct. Whether that feeling warrants a separate ontological status for the instrument remains to be seen."

  "And I concede," Udayana said, stepping into the courtyard, "that your demand for parsimony keeps us honest. But do not mistake simplicity for truth. The world is complex, and our instruments must match it."

  "Then we shall walk this path again tomorrow," Dharmottara said, bowing slightly.

  "And the day after," Udayana replied. "For the *gavaya* is still in the forest, and the word is still on our tongues."

  They parted ways into the dark corridors, the dispute unresolved, the gap between the two *pramāṇas* and the four still bridged only by the darkness of the night.
