          6.  **Constraint:** Be disciplined about where the Frame Problem applies and where it doesn't (don't force it). No literature review.

  2.  **Define the Frame Problem Versions:**
      *   *Narrow (McCarthy & Hayes):* The representational problem in logic. How do you specify that $X$ changes without having to explicitly list every $Y$ that *doesn't* change? (e.g., If I pick up a cup, its location changes, but its color doesn't). It's about computational efficiency in state representation.
      *   *Broad (Dennett):* The epistemological/relevance problem. How does an agent decide *which* facts are relevant to its current goal without checking an infinite number of potential side effects? (e.g., If I move the cup, do I need to check if the room's gravity changed? No. But how do I *know* no without checking?)

  3.  **Map the Uber Crash to the Narrow Frame Problem:**
      *   *Does it fit?* The Narrow problem is about state persistence. The Uber system *failed* to maintain state persistence regarding the object's trajectory. Every time the classification label flipped (Pedestrian -> Bicycle -> Unknown), the tracker reset.
      *   *Analysis:* This isn't exactly the McCarthy/Hayes logical frame problem (which is about axioms of non-change). This is more about *object permanence* and *state tracking* within a specific module. However, it shares the spirit: the system failed to carry forward the relevant property (trajectory/velocity) across a change in another property (classification label).
      *   *Verdict:* It's a *technical instantiation* of state persistence failure, but not the strict logical frame problem. The system didn't know what to "hold constant" (the threat level) when the label changed.

  4.  **Map the Uber Crash to the Broad Frame Problem:**
      *   *Does it fit?* The Broad problem is about relevance. The system had to decide: "Is this object a threat?"
      *   *Analysis:* The system's relevance heuristic was: "Pedestrians are threats *if* near a crosswalk." "Vehicles are threats *if* in a lane." "Jaywalking pedestrian with a bike" fell into a relevance gap. The system pruned the "threat" relevance because the classification didn't match the "crosswalk" frame. It failed to identify the *salient* feature (collision course) because it was bogged down in categorical relevance (is it a pedestrian or a bike?).
      *   *Verdict:* This is a strong match for Dennett's version. The system couldn't determine what was relevant (collision trajectory) because it was locked into a pre-defined schema of relevance (crosswalks + labels).

  5.  **Evaluate the Distinction in this Context:**
