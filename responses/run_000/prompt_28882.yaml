      *   *Discipline Check:* I need to be careful not to call the software bug a "logical frame problem." It's an engineering implementation of a relevance failure.

  6.  **Design a "Frame-Problem-Aware" Control System:**
      *   *Requirement:* It needs to maintain state across classification changes and prioritize trajectory over category.
      *   *Solution:* Decouple *tracking* from *classification*. Track "moving mass with velocity vector" first. Apply classification as a secondary layer.
      *   *The Regress Issue:* If we say "track everything," we overload the system. We still need a relevance filter. How do we avoid pushing the problem elsewhere?
      *   *Answer:* You can't solve relevance with code alone. You need a hierarchy of goals. The top-level goal must be "avoid kinetic impact" not "identify object type." This shifts the relevance criterion from semantic (what is it?) to physical (will it hit me?).
      *   *Does this push the problem?* Yes, it pushes it to the goal definition. But "don't hit things" is a simpler, more robust frame than "identify pedestrians."

