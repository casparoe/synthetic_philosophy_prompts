answer: |-
  Your instinct is correct: no single pure strategy dominates Row B. In an intermediate game theory course, the "subtlety" you are missing is **dominance by a mixed strategy**. A rational player will not play a strategy if there is *any* probability distribution over their other strategies that yields a strictly higher payoff, regardless of what the opponent does.

  ### 1. Eliminating Row B (Mixed Strategy Dominance)
  While neither Row A nor Row C dominates Row B individually, a **mixture** of them does. Consider a mixed strategy where the Row player plays Row A with probability $0.5$ and Row C with probability $0.5$. We compare the expected payoff of this mix against Row B for every column:

  *   **Against Column 1:** Mix payoff is $(0.5 \times 5) + (0.5 \times 2) = \mathbf{3.5}$. (Row B gets **3**).
  *   **Against Column 2:** Mix payoff is $(0.5 \times 5) + (0.5 \times 5) = \mathbf{5.0}$. (Row B gets **4**).
  *   **Against Column 3:** Mix payoff is $(0.5 \times 2) + (0.5 \times 5) = \mathbf{3.5}$. (Row B gets **3**).

  Since $3.5 > 3$, $5 > 4$, and $3.5 > 3$, Row B is **strictly dominated** by this mixture. A rational Row player would never play B.

  ### 2. The Reduced Game (Rows A, C vs. Columns 1, 2, 3)
  Crossing out Row B leaves us with a $2 \times 3$ matrix. Now, look at the Column player's payoffs (the second number in each cell):

  | | Column 1 | Column 2 | Column 3 |
  | :--- | :---: | :---: | :---: |
  | **Row A** | (5, **1**) | (5, **0**) | (2, **2**) |
  | **Row C** | (2, **2**) | (5, **1**) | (5, **0**) |

  Compare Column 1 and Column 2:
  *   Against Row A: Column 1 yields **1**, while Column 2 yields **0**.
  *   Against Row C: Column 1 yields **2**, while Column 2 yields **1**.

  Column 1 **strictly dominates** Column 2. A rational Column player will never play Column 2.

  ### 3. Final Result
  Crossing out Column 2 leaves the final $2 \times 2$ matrix:

  | | Column 1 | Column 3 |
  | :--- | :---: | :---: |
  | **Row A** | (5, 1) | (2, 2) |
  | **Row C** | (2, 2) | (5, 0) |

  No further dominance exists here (Row A is better against Col 1, but Row C is better against Col 3; similarly, Col 1 is better against Row C, but Col 3 is better against Row A).

  ### Why your previous attempt failed
  You likely tried to eliminate Column 2 first because it "looked weak." However, in the original $3 \times 3$ game, Column 1 only **weakly** dominates Column 2 because they tie at Row B ($0=0$). In Iterated Elimination of Dominated Strategies (IEDS), you should always eliminate **strictly** dominated strategies first. 

  By using a mixed strategy to strictly eliminate Row B first, you removed the tie, which then allowed Column 1 to strictly dominate Column 2.
