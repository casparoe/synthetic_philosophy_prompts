  ### Desiderata for an Adequate Account of Moorean Absurdity

  **1. The Commissive Form**
  *   **Case/Consideration:** The account must explain the absurdity of the standard Moorean sentence: "$p$, but I don't believe that $p$." While logically consistent (it is possible for $p$ to be true while I fail to believe it), asserting or believing it induces a unique cognitive dissonance or pragmatic failure.
  *   **Status:** **Non-negotiable.** Any theory that cannot diagnose the specific absurdity of the commissive form fails to address the central phenomenon.

  **2. The Omissive Form**
  *   **Case/Consideration:** The account must equally explain the absurdity of the omissive variant: "$p$, but I believe that not-$p$." Although logically distinct from the commissive form (involving a belief in a falsehood rather than a lack of belief), it generates the same intuitive absurdity. A theory that handles only one form is incomplete.
  *   **Status:** **Non-negotiable.** A complete theory of Moore's Paradox must cover both primary linguistic manifestations.

  **3. The First-Person Present-Tense Restriction**
  *   **Case/Consideration:** The absurdity vanishes if the sentence is shifted to the third person ("$p$, but *he* doesn't believe that $p$") or the past tense ("$p$, but I *didn't* believe that $p$"). An adequate account must explain why the paradox is strictly bound to the first-person present-tense perspective, distinguishing it from general logical contradictions or lies.
  *   **Status:** **Non-negotiable.** This restriction is the defining boundary condition of the paradox; ignoring it conflates Moorean absurdity with ordinary inconsistency.

  **4. The Asymmetry with the Converse**
  *   **Case/Consideration:** The account must explain why the converse sentence, "I believe that $p$, but not-$p$," is not Moore-paradoxical. While this converse may be false (if the belief is sincere) or a lie, it does not trigger the same sense of irrationality or pragmatic self-defeat as the Moorean form.
  *   **Status:** **Non-negotiable.** Distinguishing the paradox from simple error or falsehood is essential to isolating the specific structural flaw in Moorean propositions.

  **5. The Locus of Absurdity (Belief vs. Assertion)**
  *   **Case/Consideration:** The account must take a clear stance on whether the absurdity attaches primarily to the *act of assertion*, the *state of belief*, or both. Moore and Wittgenstein suggested the belief state itself is irrational; pragmatic accounts suggest only the assertion is improper. The theory must justify its chosen locus and explain the relationship between the two (e.g., if assertion is absurd *because* belief is irrational, or vice versa).
  *   **Status:** **Preference of a Particular Camp.** This is the primary theoretical fault line. Doxastic accounts (e.g., Shoemaker) prioritize belief; pragmatic/normative accounts (e.g., Grice, KNA) prioritize assertion. An adequate theory must address the question, but the specific answer is theory-dependent.

  ***

  ### The Critical Desideratum

  The single desideratum that does the most to exclude the leading accounts is **the Locus of Absurdity**, specifically the requirement to **explain the irrationality of the *belief state* itself, independent of assertion.** This requirement places the greatest pressure on the dominant contemporary accounts: the Gricean implicature story and the Knowledge-Norm-of-Assertion (KNA) view. Both are fundamentally theories of *communication*; they explain why *saying* a Moorean sentence violates conversational maxims or assertoric norms, but they struggle to explain why *silently thinking* "$p$, but I don't believe it" is irrational without smuggling in an implicit act of assertion. Conversely, while the Hintikka-style doxastic-logic approach satisfies this desideratum by treating the belief as logically inconsistent for an ideal agent, it is subsequently excluded by the **First-Person Present-Tense Restriction**, as standard doxastic logic is agent-neutral and cannot explain why the paradox disappears in the third person without significant modification. Thus, the demand to locate the absurdity in the *belief* while respecting the *perspectival* nature of the paradox creates a theoretical tension that no single leading account resolves without significant auxiliary hypotheses.
