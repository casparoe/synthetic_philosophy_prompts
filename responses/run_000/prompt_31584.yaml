answer: |-
  This is a classic "moral parliament" problem. The philosophical literature (MacAskill, Lockhart, Gracely) is useful, but in a foundation setting, you need a *governance tool*, not a truth machine. The goal isn't to find the *Right* answer; it's to legitimize the decision so everyone feels heard and the Board doesn't have to micromanage.

  Below is the **Pluralist Grant Protocol (PGP)**. It is designed to be run by a Program Officer (PO) with a spreadsheet and a facilitator in a 2-hour meeting.

  ### Part 1: The Procedure

  #### A. Pre-Work (Program Officer, 20 Minutes)
  Before the meeting, the PO sends a simple form to each staff member representing a distinct moral view (Global Health, Animal Welfare, Longtermist). The Board Chair does not fill this out; she holds the Veto.

  **The Input Form:**
  1.  **Impact Score (0–10):** On *your* moral view's scale, how good is this grant? (0 = Actively Harmful, 5 = Neutral/Average, 10 = Best thing you've seen all year).
  2.  **Confidence (High/Med/Low):** How sure are you about this score?
  3.  **Incomparability Flag:** Can you even judge this on your scale? (Yes/No).
  4.  **Rights/Constraint Flag:** Does this violate a deontological constraint (e.g., using people as means)? (Yes/No).

  *The PO compiles these into the **Decision Matrix** (see below).*

  #### B. The Meeting (2 Hours)

  **Step 1: The Hard Veto (Board Chair) – 15 Mins**
  *   **Mechanism:** The Chair reviews the "Rights/Constraint Flag."
  *   **Rule:** If *any* staff member flags a Rights Violation, the Chair *must* review it. If the Chair agrees it violates a side-constraint (e.g., coercive consent, dual-use risk that weaponizes harm), the grant is **Rejected**. No math is run.
  *   **Judgment Call:** This is purely the Chair's judgment. It is not negotiable.

  **Step 2: The Incomparability Check – 15 Mins**
  *   **Mechanism:** Check the "Incomparability Flag."
  *   **Rule:** If >50% of moral views flag "No" (cannot judge), the grant is **Escalated to Board**.
  *   **Reasoning:** If most views can't even process the grant, the foundation lacks the moral vocabulary to decide.
  *   **Judgment Call:** If only one view flags it (e.g., Animal Welfare can't judge an AI grant), proceed but note the "blind spot."

  **Step 3: Normalization & The Fanaticism Cap – 30 Mins**
  *   **Problem:** Longtermists often want to score x-risk reduction as "Infinity." Global Health scores in "Lives Saved." These don't add up.
  *   **Mechanism:** Use the 0–10 Impact Score provided in pre-work.
  *   **The Cap:** No score can exceed 10. This explicitly rejects "fanaticism" (infinite expected value) for the sake of group cohesion.
  *   **Mechanical Step:** The PO averages the scores. If a staff member submitted "100" because "it saves the future," the PO truncates it to "10" before calculation.
  *   **Judgment Call:** Staff must agree *beforehand* that 10 represents "The best grant we could possibly make in this category."

  **Step 4: Weighting The Views – 30 Mins**
  *   **Problem:** Whose view counts more?
  *   **Mechanism:** Use **Fixed Credence Weights**. These should be set annually by the Board/Founders, not per grant.
      *   *Example:* Global Health (33%), Animal Welfare (33%), Longtermist (33%).
      *   *Alternative:* "Founders' Intent" weights (e.g., 50% Family Values, 25% Staff Expertise, 25% Emerging Risks).
  *   **The "Unknown View" Hedge:** Deduct 10% from the final total score as a "Moral Humility Tax." This reserves space for moral views you haven't hired for yet.
  *   **Mechanical Step:** Calculate: `(Score_A × Weight_A) + (Score_B × Weight_B) + (Score_C × Weight_C) - 10%`.

  **Step 5: Decision Thresholds – 30 Mins**
  *   **Mechanism:** Compare the Final Weighted Score (0–10 scale) to thresholds.
      *   **Score 7.0+:** **Fund.** (Strong consensus or high intensity).
      *   **Score 3.0–6.9:** **Escalate to Board.** (This is a "Values Call." The math is ambiguous; the Board must choose which moral view to prioritize this year).
      *   **Score <3.0:** **Reject.** (Consensus that this is low priority).
  *   **Variance Check:** If the standard deviation between staff scores is >4.0 (e.g., one person said 10, another said 2), **Auto-Escalate** regardless of the average. High variance means conflict, not ambiguity.

  ---

  ### Part 2: The Decision Matrix (Spreadsheet Logic)

  | Moral View | Weight | Impact Score (0-10) | Confidence | Truncated Score | Weighted Value |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 33% | [Staff Input] | [H/M/L] | [Max 10] | [Score × Wt] |
  | **Animal Welfare** | 33% | [Staff Input] | [H/M/L] | [Max 10] | [Score × Wt] |
  | **Longtermist** | 33% | [Staff Input] | [H/M/L] | [Max 10] | [Score × Wt] |
  | **Subtotal** | | | | | **[Sum]** |
  | **Humility Tax** | -10% | | | | **[Subtotal × 0.9]** |
  | **FINAL SCORE** | | | | | **[Result]** |

  **Flags:**
  *   [ ] Rights Violation (Chair Veto)
  *   [ ] Incomparability (>50% Views)
  *   [ ] High Variance (Std Dev > 4)

  ---

  ### Part 3: Worked Examples

  *Assumptions for all examples:*
  *   **Weights:** Equal split (33% each) for the three staff views.
  *   **Thresholds:** Fund >7, Escalate 3–7, Reject <3.
  *   **Cap:** Hard cap at 10.

  #### Proposal 1: Deworming Program (Low-Income Country)
  *Cost: $200k. Impact: Reduces paralysis/cognitive impairment in 50k children.*

  | View | Input Score | Reasoning | Truncated | Weighted |
  | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 10 | Core mission, high evidence, direct human benefit. | 10 | 3.33 |
  | **Animal Welfare** | 2 | Neutral. Doesn't help animals, maybe slightly increases human population pressure. | 2 | 0.66 |
  | **Longtermist** | 3 | Good for stability, but doesn't reduce x-risk significantly. | 3 | 0.99 |
  | **Subtotal** | | | | **4.98** |
  | **Humility Tax** | -10% | | | **-0.50** |
  | **FINAL SCORE** | | | | **4.48** |

  *   **Flags:** None.
  *   **Variance:** High (10 vs 2). Std Dev > 4.
  *   **Outcome:** **ESCALATE TO BOARD.**
  *   **Why:** Even though the average is "middle," the variance triggers the conflict rule. The Global Health staff feels strongly; the others feel indifferent/negative. The Board must decide if "Human Health" trumps "Neutrality on other views" this year.
  *   **Mechanical vs. Judgment:** The math is mechanical. The decision to treat variance as a trigger is a judgment call to preserve team cohesion.

  #### Proposal 2: Corporate Campaign (Farmed Fish Welfare)
  *Cost: $150k. Impact: Pledges from 3 major suppliers to use less cruel slaughter methods.*

  | View | Input Score | Reasoning | Truncated | Weighted |
  | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 1 | Inefficient use of funds compared to human health. | 1 | 0.33 |
  | **Animal Welfare** | 10 | Huge scale of suffering, cost-effective per animal. | 10 | 3.33 |
  | **Longtermist** | 4 | Might set norms for caring about non-humans/AI, but speculative. | 4 | 1.32 |
  | **Subtotal** | | | | **4.98** |
  | **Humility Tax** | -10% | | | **-0.50** |
  | **FINAL SCORE** | | | | **4.48** |

  *   **Flags:** None.
  *   **Variance:** High (10 vs 1). Std Dev > 4.
  *   **Outcome:** **ESCALATE TO BOARD.**
  *   **Why:** This is the classic "Incommensurability" fight. The math yields the exact same score as Deworming (4.48), but for opposite reasons. The procedure correctly identifies that this is not a math problem; it is a values problem. The Board must choose: Do we prioritize *intensity* of suffering (Animals) or *certainty* of human benefit (Health)?
  *   **Honest Limitation:** The procedure fails to distinguish between Deworming and Fish Welfare numerically. It forces the Board to look at the *composition* of the score, not just the total.

  #### Proposal 3: Biosecurity Org (Engineered Pandemic Prevention)
  *Cost: $400k. Impact: Research on screening DNA synthesis to prevent engineered pathogens.*

  | View | Input Score | Reasoning | Truncated | Weighted |
  | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 6 | Prevents deaths, but abstract. Hard to measure QALYs. | 6 | 1.98 |
  | **Animal Welfare** | 2 | Humans survive, animals still farmed. Neutral/Negative. | 2 | 0.66 |
  | **Longtermist** | 100 | Prevents human extinction. Expected value is astronomical. | **10** | 3.33 |
  | **Subtotal** | | | | **5.97** |
  | **Humility Tax** | -10% | | | **-0.60** |
  | **FINAL SCORE** | | | | **5.37** |

  *   **Flags:**
      *   **Rights/Constraint:** Chair notes "Dual Use Risk." Researchers could misuse the data.
      *   **Decision:** Chair decides the safety protocols are sufficient. No Veto.
      *   **Variance:** High (10 vs 2).
  *   **Outcome:** **ESCALATE TO BOARD.**
  *   **Why (Against Sympathies):** A pure longtermist would argue this grant is objectively the most important because extinction is infinite loss. However, the **Fanaticism Cap** (Step 3) truncated the score from 100 to 10. This deliberately dampens the "infinite stakes" argument to prevent one view from dominating the budget entirely.
  *   **Result:** Despite the Longtermist believing this saves the world, the procedure treats it as merely "a very good grant," putting it in the same bucket as Deworming and Fish Welfare.
  *   **Honest Limitation:** This procedure is *biased against longtermism*. It structurally cannot fund x-risk reduction at the scale longtermists think is required, because it forces intertheoretic comparability where the Longtermist says none exists. It prioritizes *peace among staff* over *maximizing expected value*.

  ---

  ### Part 4: Where This Procedure Fails (The "Honesty" Section)

  You asked me to be honest about what the procedure will still get wrong. Here are the four failure modes you will encounter:

  1.  **The "Strategic Voting" Problem:**
      *   *Risk:* Staff will learn the thresholds. The Longtermist will always submit "10" for x-risk grants. The Global Health person will submit "1" for animal grants to depress the average.
      *   *Mitigation:* Audit scores annually. If a staff member's average score variance from the group is consistently extreme, their Weight is reviewed by the Board.

  2.  **The "Cluelessness" Discount:**
      *   *Risk:* The 10% Humility Tax is arbitrary. It might be too low for AI risk (where we know very little) and too high for Deworming (where we know a lot).
      *   *Mitigation:* Allow the "Confidence" input to adjust the tax. Low Confidence = 20% Tax. High Confidence = 5% Tax.

  3.  **The "Infinite Stakes" Suppression:**
      *   *Risk:* As seen in Proposal 3, this procedure effectively silences the Longtermist view on existential risk. If the foundation *wants* to take moonshots, this tool will stop them.
      *   *Mitigation:* Create a separate "Moonshot Budget" (e.g., 10% of total funds) that is exempt from the Weighted Scorecard and requires only Board + Longtermist Staff approval.

  4.  **The "Board Burden":**
      *   *Risk:* This procedure is designed to send "Values Calls" to the Board. If you have high variance often, the Board will feel like they are doing the staff's job.
      *   *Mitigation:* If >30% of grants are Escalated, the Board must revisit the **Weights**. The staff disagreement is too high for the current weightings to work.

  ### Summary for the Program Officer
  *   **Mechanical:** Calculating the weighted average, applying the 10% tax, checking the Veto flags.
  *   **Judgment:** Setting the Weights (annual), deciding if a Rights Violation occurred (Chair), deciding if "Incomparability" is genuine or just disagreement.
  *   **Goal:** The output isn't "Truth." The output is "Legitimacy." If you fund the Fish Welfare grant, the Global Health person can't say "You ignored the math." They have to say "I disagree with the Weights," which is a conversation for the annual review, not the grant meeting.
