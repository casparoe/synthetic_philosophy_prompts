answer: |-
  # The Smithian Spectator Audit (SSA)
  **Version 1.0 | For Internal Ethics Review Committee Use**

  This procedure operationalizes Adam Smith's *The Theory of Moral Sentiments* for corporate governance. It is designed to move from "gut feeling" to a structured judgment by simulating the **Impartial Spectator**. It acknowledges that we are biased insiders and attempts to correct for that bias through specific mechanical steps.

  ### Phase 1: Preparation (The Well-Informed Spectator)
  *Smith argues the Spectator cannot judge without true information. We naturally accept the version of events that favors us.*

  **Step 1.1: The Dissent Packet [Mechanical]**
  *   **Action:** The case owner (e.g., Product Lead) must submit the standard proposal. Simultaneously, a designated "Devil's Advocate" (rotating role, not from the same team) must submit a one-page "Dissent Packet."
  *   **Requirement:** The Dissent Packet must contain at least one piece of empirical data or user feedback that contradicts the business case (e.g., UX research on vulnerability, legal edge-case risks).
  *   **Pass Condition:** Committee cannot vote until both documents are read. If the Dissent Packet is missing, the meeting is adjourned.

  **Step 1.2: The Interest Declaration [Mechanical]**
  *   **Action:** Every committee member must write down their personal stake in the outcome (e.g., "My bonus is tied to engagement," "I am friends with the VP of Sales," "I want this market launch to succeed").
  *   **Requirement:** These are read aloud.
  *   **Pass Condition:** All members acknowledge their partiality. This is the ritual "silencing of the man within the breast" to allow the Impartial Spectator to speak.

  ### Phase 2: The Judgment (Propriety vs. Merit)
  *Smith distinguishes between the **Propriety** of the actor's motives (was it fitting?) and the **Merit/Demerit** of the outcome (does it deserve reward or punishment?). We must judge both.*

  **Step 2.1: The Propriety Check (The Motive) [Judgment Call]**
  *   **Question:** "If we strip away the financial outcome, does the Spectator sympathize with the *motive* of the actor?"
  *   **Guidance:** Imagine the Product Lead explains their decision to a stranger on a park bench. Do they feel pride or shame? Is the means proportionate to the end?
  *   **Scale:**
      *   *High Sympathy:* Motive is clear, necessary, and proportionate.
      *   *Low Sympathy:* Motive is excessive, greedy, or disproportionate to the user impact.
  *   **Breakdown Flag:** If the committee is split >40/60 on this, the motive is ambiguous. Proceed to Step 2.2 but flag as "High Risk of Rationalization."

  **Step 2.2: The Merit Check (The Recipient) [Judgment Call]**
  *   **Question:** "Does the action deserve *punishment* (Demerit) or merely *disapproval*?"
  *   **Guidance:** Smith argues we only punish **Injustice** (violation of rights/harm). We merely dislike **Impropriety** (lack of virtue/beneficence).
      *   *Demerit:* Did this violate a specific right, cause tangible harm, or break a promise? (Requires Punishment/Stop).
      *   *Impropriety:* Is this just rude, manipulative, or ungenerous? (Requires Shame/Warning).
  *   **Breakdown Flag:** This is the primary failure point. If harm is diffuse (e.g., societal polarization) rather than individual, the Spectator struggles to assign Demerit.

  ### Phase 3: The Normative Check (General Rules)
  *Smith notes our sentiments are shaped by "general rules" derived from experience. We must check if our Spectator is parochial.*

  **Step 3.1: The Rule Comparison [Mechanical/Judgment]**
  *   **Action:** Compare the action against three tiers of rules:
      1.  **Internal Policy:** (Does it break our code?)
      2.  **Industry Standard:** (Do competitors do this?)
      3.  **Societal Expectation:** (Would this be on the front page of the NYT?)
  *   **Pass Condition:** If it passes Internal but fails Societal, the Spectator must weigh **Tier 3** heavier.
  *   **Breakdown Flag:** If Industry Standard and Societal Expectation conflict (e.g., "Dark patterns are industry standard but hated by society"), the procedure cannot resolve this mechanically. This requires a **Super-Majority Vote (75%)** to override Industry Standard.

  ### Phase 4: The Verdict
  **Step 4.1: Classification [Mechanical]**
  Based on Steps 2 and 3, classify the case:
  *   **Green (Permissible):** High Propriety, No Demerit.
  *   **Yellow (Disapproved but Permissible):** Low Propriety, No Demerit. (Action can proceed but must be publicly logged/shamed internally).
  *   **Red (Forbidden):** High Demerit (Injustice). (Action must stop).

  ***

  # Case Application

  Here is the SSA applied to your two active cases.

  ## Case A: Auto-Play Video & Vulnerable Users
  **Facts:** Feature auto-plays video after search. Algorithm exploits variable rewards (slot machine mechanics). UX research confirms high difficulty disengaging for ADHD and older users. Engagement projections +40%. Industry standard practice.

  **Step 1: Preparation**
  *   **Dissent Packet:** UX Research report highlighting "time-on-task" anomalies for ADHD users.
  *   **Interest Declaration:** 3/5 committee members note stock vesting tied to Q3 engagement targets.

  **Step 2: Judgment**
  *   **Propriety Check:** *Low Sympathy.* The motive (engagement) is disproportionate to the means (exploiting cognitive vulnerability). The Spectator feels unease imagining the Product Lead explaining to an ADHD user's parent why the feature is hard to turn off.
  *   **Merit Check:** *Ambiguous Demerit.* Is this Injustice or Impropriety?
      *   *Argument for Demerit:* It causes harm (addiction/loss of time).
      *   *Argument for Impropriety:* It is technically opt-in (buried in settings). No specific legal right is violated. The harm is diffuse.
      *   *Smithian View:* Smith is strict on Justice (hurt no one) but lenient on Beneficence (be kind). Since users *can* technically opt-out, a strict Smithian Spectator might view this as a lack of *Beneficence* (ungenerous) rather than *Injustice* (harmful).

  **Step 3: Normative Check**
  *   **Internal:** Passes.
  *   **Industry:** Passes (Standard practice).
  *   **Societal:** Fails (General public dislikes addictive design).
  *   **Conflict:** Industry vs. Society. Requires Super-Majority to override Industry Standard.

  **Step 4: Verdict**
  *   **Classification:** **YELLOW (Disapproved but Permissible)**
  *   **Rationale:** The committee finds the action *Improper* (greedy motive) but cannot conclusively assign *Demerit* (Injustice) because the harm is not a direct rights violation and the "General Rules" of the industry permit it. The Spectator disapproves but will not punish.
  *   **Outcome:** The feature launches, but the committee mandates an internal memo recording their disapproval and requires a "Friction Audit" in 6 months.

  **Why you won't like this answer:** You are on the ethics committee to *stop* things that feel wrong. This procedure tells you that exploiting ADHD users is "ungenerous" but not "forbidden." It leaves the door open for the business to proceed because Smith's framework struggles to categorize systemic/psychological harm as *Injustice* without a specific victim claiming a right.

  ***

  ## Case B: Facilitation Payments in New Market
  **Facts:** Distributors pay small fees to customs to get goods released on time. Legal gray area (FCPA allows some facilitation, UK Bribery Act doesn't). Competitors do it. Refusal means multi-week delays and market failure.

  **Step 1: Preparation**
  *   **Dissent Packet:** Legal counsel memo noting reputational risk if exposed; Competitor analysis showing 2/5 top competitors refuse these payments.
  *   **Interest Declaration:** 4/5 members note this market is critical for company growth targets.

  **Step 2: Judgment**
  *   **Propriety Check:** *Low Sympathy.* The motive (efficiency) is understandable, but the means (corruption) feels unfitting for a "respectable" company.
  *   **Merit Check:** *High Demerit.*
      *   *Smithian View:* Smith views Justice as the "main pillar." Corruption undermines the social order and the rules of the game. Even if you are "entitled" to the goods, paying off officials violates the universal rules of Justice by degrading the system everyone relies on. It harms the *public* even if it helps the *company*.
      *   *Distinction:* Unlike Case A, this is a clear violation of a rule (anti-corruption norms), not just a lack of kindness.

  **Step 3: Normative Check**
  *   **Internal:** Fails (Code of Conduct).
  *   **Industry:** Mixed (Local custom says yes, Global standard says no).
  *   **Societal:** Fails (Universal condemnation of bribery).
  *   **Conflict:** Local Custom vs. Universal Justice. Smith prioritizes the "Impartial" Spectator, who stands above local custom if it violates universal justice.

  **Step 4: Verdict**
  *   **Classification:** **RED (Forbidden)**
  *   **Rationale:** While local custom permits it, the Impartial Spectator recognizes this as a violation of Justice (systemic corruption). The Demerit is high.
  *   **Outcome:** Market entry is blocked unless a zero-bribe logistics path is found (even if slower).

  **Why this answer is acceptable:** This aligns with standard compliance. It's the "easy" ethical call.

