  # Limitations: What This Procedure Cannot Do

  You asked to know where this breaks. Based on the run above, here are the structural weaknesses of using Smith for tech ethics:

  **1. The Beneficence/Justice Gap (The Case A Problem)**
  Smith's framework is built on the idea that we can *force* Justice but only *persuade* Beneficence.
  *   **The Breakdown:** Modern tech harms (addiction, polarization, privacy erosion) often look like **Impropriety** (lack of care) rather than **Injustice** (rights violation) in a 1759 legal sense.
  *   **Result:** The SSA will systematically under-regulate "dark patterns" that are technically consensual but manipulative. It will classify them as "Yellow" (Shame) rather than "Red" (Stop). If your committee needs teeth, Smith is too soft on "consensual" exploitation.

  **2. The Conservatism of "General Rules" (The Industry Norm Trap)**
  Smith argues moral rules emerge from *experience* and *custom*.
  *   **The Breakdown:** If the industry norm is rotten, the "Impartial Spectator" trained on that industry will be desensitized. In Case A, the fact that "everyone does it" heavily weighted the verdict toward Permissible.
  *   **Result:** The procedure is backward-looking. It struggles to lead on new ethics frontiers where "General Rules" haven't formed yet (e.g., Generative AI copyright). It relies on society to be outraged *first* before the Spectator condemns the action.

  **3. The Aggregation Problem**
  Smith's Spectator judges individual actions between specific actors.
  *   **The Breakdown:** It cannot easily calculate **Systemic Risk**. In Case A, one user losing 30 minutes is not an Injustice. One million users losing 30 minutes is a societal harm. Smith's framework lacks a utilitarian calculus to aggregate small harms into a "Red" verdict.
  *   **Result:** You will need to import a Utilitarian step (Step 2.3: Aggregate Harm Calculation) to fix this, or the SSA will approve death-by-a-thousand-cuts features.

  **4. The "Well-Informed" Illusion**
  *   **The Breakdown:** Step 1.1 requires a Dissent Packet. In a high-pressure tech company, dissent is often soft-pedaled to avoid conflict. If the "facts" the Spectator sees are already sanitized by the culture, the verdict is garbage-in-garbage-out.
  *   **Result:** The procedure assumes good faith in information sharing. It cannot detect when the Product Team has successfully hidden the true severity of the UX harm from the committee.

  ### Recommendation
  Use the **Smithian Spectator Audit** for **Case B type scenarios** (Corruption, HR issues, Vendor relations) where Justice and Rules are clear.
  Do **not** rely on it solely for **Case A type scenarios** (Product Design, Algorithmic Ethics). For those, you must supplement Smith with a **Utilitarian Harm Aggregation** step to capture the scale of diffuse harm, or the Spectator will remain too polite to stop the machine.
