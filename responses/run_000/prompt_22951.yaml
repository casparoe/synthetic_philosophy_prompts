      *   **Scenario:** One experimental antidote (single dose). Already given to Patient A (stable). Chemical spill occurs, 15 new patients (Patient B group) exposed, will die without the antidote.
      *   **Dilemma:** Retrieve the antidote from Patient A (killing them) to save the 15.
      *   **Group Decision:** Voted to retrieve (Utilitarian calculus: 15 > 1).
      *   **User's Feeling:** Uneasy. Feels like "bigger number doesn't automatically win." Worried they are being sentimental vs. ethically rigorous.
      *   **Goal:** Help the user explore *why* their gut reaction might be ethically defensible, validating their intuition while providing bioethical frameworks.

  2.  **Initial Ethical Assessment (The "Trolley Problem" Variant):**
      *   This is a classic "Transplant Case" or "Organ Harvest" variant of the Trolley Problem.
      *   *Utilitarianism:* 15 lives > 1 life. Net utility is maximized by killing the one.
      *   *Deontology/Rights-Based:* Killing an innocent person is inherently wrong, regardless of consequences. Patient A has a right to life and bodily integrity.
      *   *Medical Ethics Principles:* Autonomy, Beneficence, Non-maleficence, Justice.
