      *   **Deontology (Kantian):** Focuses on duties and rules. Killing is prohibited. Patient A is an end in themselves, not a means to an end.
      *   **Rights-Based Ethics:** Patient A has a right to the treatment once administered.
      *   **Principlism (Beauchamp & Childress):**
          *   *Non-maleficence:* Do no harm. Retrieving the dose harms/kills Patient A.
          *   *Beneficence:* Act in best interest. Conflicting interests here.
          *   *Autonomy:* Patient A consented to treatment, not to be sacrificed.
          *   *Justice:* Fair distribution. Is it fair to sacrifice the one who got there first?
