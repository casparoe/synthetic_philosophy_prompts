answer: |-
  You have put your finger on one of the most persistent and revealing stalemates in the philosophy of science. Your intuition is correct: the debate between etiological (selected-effects) and causal-role (systemic) accounts of function has not "moved" in the standard sense of one side refuting the other.

  The reason for this stagnation is not that philosophers are stubborn, but because the disagreement is not primarily empirical. It is a **meta-explanatory dispute about theoretical virtues**, masked as a semantic dispute about definition.

  Here is a diagnosis of the structure of the impasse, followed by an assessment of whether it can be resolved.

  ### 1. The Structure of the Disagreement

  To understand why the debate doesn't resolve, we must identify what each side is *optimizing for*. They are not trying to describe the same phenomenon with different words; they are trying to solve different problems using the same word.

  **The Etiological Account (Selected-Effects)**
  *   **Primary Goal:** To naturalize teleology. It wants to explain how "purpose" can exist in a mindless, material world.
  *   **Theoretical Virtue:** **Normativity.** It needs to distinguish between what a trait *does* and what it *ought to do* (malfunction).
  *   **The Trade-off:** To secure normativity, it ties function to history. This makes function factive and mind-independent, but it renders the concept useless for novel traits (e.g., a mutation that hasn't been selected yet) or for ahistorical sciences (like physiology or engineering).
  *   **Metaphysical Commitment:** Functions are real, historical properties of traits, similar to "being a sibling." You cannot be a sibling without a history of birth; you cannot have a function without a history of selection.

  **The Causal-Role Account (Systemic)**
  *   **Primary Goal:** To facilitate mechanistic explanation. It wants to explain how a complex system works *now*.
  *   **Theoretical Virtue:** **Analytical Utility.** It needs to allow physiologists to assign functions based on current contribution to a capacity (e.g., "the function of this enzyme is to break down protein").
  *   **The Trade-off:** To secure utility, it severs function from history. This makes the concept applicable to new traits and artifacts, but it struggles to ground "malfunction" without appealing to designer intent or statistical normality.
  *   **Metaphysical Commitment:** Functions are relational properties ascribed by an observer relative to a specific analytical capacity. They are more like "being a tool" than "being a sibling."

  **The Diagnosis:**
  The impasse exists because both sides are defending a **monist** position (there is only *one* true concept of function) while optimizing for incompatible theoretical virtues.
  *   If you prioritize **normativity** (the ability to say a heart is "broken"), the etiological view wins.
  *   If you prioritize **applicability** (the ability to assign functions to new mutations or artificial organs), the causal-role view wins.

  ### 2. Is it a Verbal Dispute?

  It is tempting to say, "This is merely verbal. Let's call them Function-SE and Function-CR and go home." Many philosophers have tried this. However, the dispute persists because it is not *merely* verbal; it is **ontological**.

  The etiological theorist claims that the causal-role theorist is missing something real about the world: the normative grip of natural selection. To the etiological theorist, saying a non-pumping heart has the "causal role" of making noise is a category error; it has lost its *essence*.

  The causal-role theorist claims the etiological theorist is importing metaphysical baggage (history) into a scientific context (physiology) where it does no work. To the causal-role theorist, the etiological account is an unnecessary complication that hinders actual biological research.

  Therefore, the dispute is about **which ontology best serves the unified science of biology.** Is biology fundamentally a historical science (like geology) or a mechanistic science (like chemistry)? The function debate is a proxy war for this larger disciplinary identity crisis.

  ### 3. Can Empirical Discovery Resolve It?

  **No.** There is no experiment you can run to determine whether the function of the heart is "to pump blood" (etiological) or "circulating blood" (causal-role).

  *   **Why?** Because "function" is not a natural kind like "water" or "electron." It is a **theoretical construct**.
  *   Finding a new gene or a new mechanism will not tell us which definition is "true." It will only provide new material for both sides to interpret.
  *   If we discovered a creature with a heart that evolved via drift but now pumps blood, the etiological theorist calls it "exaptation" (no function originally), and the causal-role theorist calls it "function" (current contribution). The data is the same; the categorization differs.

  ### 4. Is the Question Ill-Posed?

  This is the most honest assessment: **The demand for a single, unified definition is likely ill-posed.**

  The concept of "function" does double-duty in biology. It bridges two distinct explanatory frameworks:
  1.  **Evolutionary Biology:** Explains why a trait is *present* in a lineage (Past-looking).
  2.  **Physiology/Mechanism:** Explains how a trait *contributes* to survival now (Present-looking).

  These frameworks operate on different timescales and use different methodologies. Expecting a single definition of "function" to satisfy both is like expecting a single definition of "weight" to satisfy both a physicist (mass × gravity) and a dietician (caloric burden). They are related, but they serve different masters.

  **The Pluralist Consensus:**
  In the last 15 years, the "stalemate" has actually shifted toward **Conceptual Pluralism** (championed by philosophers like Peter Godfrey-Smith, Justin Garson, and others). The consensus among many experts is now:
  *   There is no single property of "function."
  *   There are *selected-effect functions* (used in evolutionary explanations).
  *   There are *causal-role functions* (used in mechanistic explanations).
  *   Context determines which concept is appropriate.

  **Why does the debate persist if Pluralism is the answer?**
  Because Pluralism is unsatisfying to the philosophical impulse for unity. It feels like giving up. Furthermore, it creates friction in interdisciplinary work. If an evolutionary biologist tells a physiologist, "That trait has no function" (meaning no selection history), and the physiologist replies, "Yes it does, it keeps the animal alive" (meaning causal role), they talk past each other. The debate persists because scientists *need* the word to mean the same thing across sub-disciplines, even if philosophy says it doesn't.

  ### 5. Implications for Your Novel

  For a novelist, this philosophical stalemate is a gift. It is not a dry academic squabble; it is a clash of worldviews.

  *   **The Etiological Character:** Sees the world through deep time. To them, a thing is defined by its ancestry and its struggle. They are comfortable with "failure" (malfunction) because it implies a standard set by history. They might view a genetically engineered organ as "soulless" or "functionless" because it lacks a selection history.
  *   **The Causal-Role Character:** Sees the world through mechanism and system. To them, a thing is defined by what it *does* right now. They are pragmatic. If the engineered organ pumps blood, it functions. They view the historical obsession as a metaphysical ghost story.

  **The Narrative Conflict:**
  The tension in your novel shouldn't be about who is "right." It should be about the **cost of each perspective.**
  *   The cost of the Etiological view is that it can be rigid and unable to account for novelty or rapid change (it struggles with the new).
  *   The cost of the Causal-Role view is that it can be cold and instrumental, stripping organisms of their history and reducing them to machines (it struggles with meaning).

  ### Summary Diagnosis

  1.  **Kind of Disagreement:** It is a **meta-explanatory dispute** about which theoretical virtues (normativity vs. mechanistic utility) should govern biological classification.
  2.  **Empirical Resolution:** Impossible. It is a conceptual categorization issue, not a factual one.
  3.  **Ill-Posed?:** Yes, insofar as it demands a single definition for a concept that serves two distinct explanatory masters (Evolution vs. Physiology).
  4.  **Current Status:** The field has largely moved to **Pluralism**, acknowledging both accounts are valid in different contexts, but the *monist* debate persists because of the practical need for a unified scientific language.

  The persistence of the debate is not a failure of philosophy; it is a signal that "function" is a **boundary concept** stretching between the history of life and the mechanics of life. The friction you are sensing is the heat generated by that stretch.
