  **Section 1: The implicit theory**
  The practice presupposes a strong version of parental obligation, closely aligning with the Principle of Procreative Beneficence. It assumes prospective parents ought to select the embryo expected to have the "best" life among possible children. This conception of a "better life" is operationalized through specific metrics: absence of disease and high socioeconomic potential. Consequently, it treats conditions like schizophrenia or diabetes as intrinsic harms that diminish life's value, adopting a medical model of disability rather than a social one. This implies that a life with these conditions is straightforwardly worse than one without them. Philosophically, this commits the practice to a controversial claim about the value of existing people: if selecting against a trait is morally preferable, it suggests lives characterized by that trait are less worth living. It risks conflating the misfortune of having a condition with the worth of the person living it, implying that disability is a deficit to be eliminated rather than a difference to be accommodated. Furthermore, it assumes well-being is aggregable and comparable across different possible persons, ignoring the non-identity problem's implication that different embryos constitute different people entirely.

  **Section 2: Strictly presupposed vs. merely compatible**
  Strictly, the practice presupposes only that genetic liability is a relevant factor in reproductive decision-making and that parents possess the authority to act on this information. It does not strictly require a full welfarist theory of value; it is compatible with perfectionism (enhancing capacities) or libertarianism (exercising reproductive rights). The minimal commitment is that polygenic scores track something sufficiently meaningful to warrant selection, not necessarily that they guarantee well-being. It does not require that selection is obligatory, only permissible. However, it cannot shed the commitment that some genetic states are preferable to others without becoming unintelligible. It fits well with utilitarianism but does not demand it; a rights-based view could also support it provided parental autonomy is paramount. The practice remains agnostic on whether the goal is normalcy or enhancement, requiring only that the selected trait is viewed as a benefit by the chooser. Crucially, it presupposes parents are justified in acting on probabilistic data, even if predictive accuracy is low, prioritizing the attempt to control outcomes over acceptance of chance.

  **Section 3: The eugenics question**
  The practice presupposes that the moral wrong of historical eugenics lay primarily in state coercion and racist ideology, not in the act of selection itself. By framing itself as "liberal eugenics," it assumes individual choice insulates it from moral critique. However, this framing assumes objections were about power rather than attitude. If the deeper objection holds—that selecting against certain traits expresses a devaluing of people who possess them—the liberal defense collapses. The practice presupposes that private motivation purifies the act. Yet, if the harm is expressive, signaling that certain lives are less desirable, the absence of state force is irrelevant. The practice assumes the locus of moral harm is coercion, ignoring the possibility that the attitude expressed when we select against certain kinds of lives constitutes the injury, regardless of who funds the selection. It further assumes market demand legitimizes the practice, conflating consumer choice with moral permission.

  **Section 4: Underdetermination**
  The practice is philosophically underdetermined because it sits at an intersection of rival ethical frameworks. A libertarian autonomy view supports it (parental rights); a utilitarian harm-prevention view supports it (reducing suffering); a perfectionist view supports it (enhancing human capacities). The practice itself takes no stand on *why* selection is good, only *that* it is available. It does not settle whether selection is a duty or a privilege, nor does it define the threshold of "acceptable" risk. It remains agnostic on whether the goal is normalcy or enhancement, allowing diverse moral motivations to converge on the same technological act. Consequently, the practice cannot resolve conflicts between these theories; it merely provides a tool they can all utilize for different reasons, leaving the fundamental justification of the choice unresolved within the technology itself. It leaves undefined what constitutes "harm," allowing parents to project their own values onto the genetic data.

  **Section 5: What would change under a rival view**
  Under an expressivist or disability-critique view, the practice would require radical alteration. It could not market selection as "improving" lives, as this implies existing lives are deficient. Marketing would shift from "best odds" to "specific medical preparation," acknowledging the value of disabled lives. Selection might be restricted strictly to lethal or profoundly painful conditions where the harm is uncontroversial, excluding traits like educational attainment or manageable chronic illnesses. The language would change from "risk reduction" to "avoiding severe suffering." Ultimately, if selecting against a trait expresses the judgment that such lives are less worth living, the practice might have to cease entirely for non-lethal conditions. The framing would need to emphasize support for existing disabled people rather than elimination of the trait, fundamentally changing the commercial and ethical posture of the service.
