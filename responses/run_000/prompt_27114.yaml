      *   *Justice vs. Autonomy:* Bioethics has four pillars: Autonomy (consent), Beneficence (do good), Non-maleficence (do no harm), Justice (fair distribution). Tuskegee violates Beneficence (no treatment), Non-maleficence (harm done), and Justice (targeting vulnerable group). Focusing only on Autonomy (consent) misses 75% of the ethical violations.

