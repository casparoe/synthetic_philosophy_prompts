answer: |-
  The claim that the Kelly criterion is nothing more than expected utility maximization with a logarithmic utility function is mathematically contingent but normatively misleading, as it obscures fundamental differences in temporal structure, the origin of risk aversion, and the object of optimization.

  ### Table of Conceptual Correspondences and Divergences

  | Concept | Expected Utility (Log) Framework | Kelly Criterion Framework | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Objective Function** | Maximize $E[\ln(W_T)]$ | Maximize $g = \lim_{T\to\infty} \frac{1}{T} E[\ln(W_T)]$ | **Coincident** mathematically, **divergent** teleologically. |
  | **Origin of Logarithm** | Exogenous preference parameter (risk aversion). | Endogenous structural feature (multiplicative dynamics). | **Breaks:** Preference vs. Constraint. |
  | **Aggregation** | Ensemble average (across parallel states). | Time average (along a single trajectory). | **Breaks:** Ergodic vs. Non-ergodic assumptions. |
  | **Time Horizon** | Finite or infinite with discount factor $\beta$. | Asymptotic infinite horizon; no exogenous discounting. | **Breaks:** Parameter vs. Structural limit. |
  | **Risk of Ruin** | Low probability ruin acceptable if $E[U]$ rises. | Ruin is strictly prohibited ($\ln(0) = -\infty$). | **Breaks:** Trade-off vs. Absolute boundary. |
  | **Normative Basis** | Substantive rationality (consistency of preferences). | Instrumental rationality (survival and growth). | **Breaks:** Wanting vs. Doing. |

  ### Where the Mapping Breaks

  **1. Origin of the Logarithm: Preference vs. Dynamics**
  In the expected utility (EU) framework, the logarithmic function is one candidate among many (power, exponential, linear) representing a specific psychological attitude toward risk—specifically, diminishing marginal utility of wealth. It is a substantive claim about what the agent values. In the Kelly framework, the logarithm arises necessarily from the mathematics of repeated multiplicative processes. It is not a statement about how much the agent *cares* about wealth, but rather a structural requirement to maximize the geometric mean of returns. Importing the EU interpretation quietly assumes that risk aversion is a taste rather than a ecological constraint, thereby mischaracterizing Kelly betting as a conservative preference rather than a growth-optimal strategy.

  **2. Ensemble vs. Time Averages (Ergodicity)**
  Standard EU theory maximizes the expectation value over an ensemble of possible outcomes at a fixed time (the ensemble average). The Kelly criterion maximizes the growth rate observed over time for a single agent (the time average). In additive processes, these averages converge; in multiplicative wealth processes, they diverge fundamentally. A strategy that maximizes expected wealth (linear utility) may lead to almost certain ruin over time, whereas Kelly maximizes the outcome that almost surely occurs in the long run. Treating Kelly as log-utility EU obscures this ergodicity break, implying that the agent is optimizing over parallel worlds rather than navigating a single irreversible timeline.

  **3. Treatment of Time and Discounting**
  In EU theory, time is typically handled via an exogenous discount factor $\beta$, separating the utility of consumption from the timing of receipt. In the Kelly framework, "discounting" is endogenous to the compounding frequency and the growth rate itself. There is no separable preference for patience; the "discount" is the opportunity cost of capital not being grown at the optimal rate. The EU mapping imports the idea that time preference is a psychological parameter, whereas in Kelly, temporal structure is a physical constraint of the reinvestment mechanism.

  **4. Risk of Ruin and Absorbing States**
  While log-utility EU assigns negative infinity to zero wealth, standard EU analysis often treats this as a boundary condition of the function rather than a physical constraint. In Kelly, the avoidance of ruin is the primary driver of the strategy; full betting on any proposition with a non-zero probability of total loss is prohibited regardless of the expected payoff. The EU analogy suggests this is a result of extreme risk aversion, but the Kelly derivation shows it is a requirement for continued participation in the game. The mapping breaks by treating a survival constraint as a preference intensity.

  ### Conclusion and Better Characterization

  The conclusion that Kelly is nothing but log-utility EU does not survive once these disanalogies are explicit. The mathematical equivalence holds only under the specific assumptions of infinite horizon, full reinvestment, and independent trials, but the normative justification differs entirely.

  A more precise characterization is that the Kelly criterion represents **instrumental rationality within non-ergodic multiplicative dynamics**, whereas logarithmic expected utility represents **substantive rationality regarding wealth preferences**. Kelly is not a theory of what agents should want; it is a theory of how agents must behave to persist in environments where wealth evolves multiplicatively. The logarithmic utility function is not the *source* of the Kelly criterion but rather the *mathematical shadow* cast by the geometry of compounding growth when viewed through the lens of expectation operators. Therefore, objections to EU theory (such as the calibration theorem or Allais paradox) apply to the preference structure of log-utility agents but do not necessarily invalidate the Kelly criterion as a growth-optimal strategy for survival.
