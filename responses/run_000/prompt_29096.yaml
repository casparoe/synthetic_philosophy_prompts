      *   *Frozen Frogs:* B-Tier. Same as spores. Cryptobiosis.
      *   *Mules:* C-Tier. Sterile individuals don't negate the species' ability to reproduce.
      *   *Addition:* **Mitochondria**. They have DNA and reproduce but live inside us. A-Tier.
