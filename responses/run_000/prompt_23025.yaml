answer: |-
  Good evening. For those who don't know me, I'm a software engineer. My job is essentially to predict the future. I look at data, I model risks, and I try to ensure that when we launch a product, we know exactly how it will behave. I make my living by minimizing uncertainty.

  So, naturally, I've been struggling to find the right words for tonight. Because next week, Nora is doing something that defies my entire professional toolkit.

  Recently, a friend here—a philosopher—explained a concept to me that finally clicked. It's called a "transformative experience." The idea is that some choices are epistemically closed. You cannot know what it feels like to be a parent until you are one. No amount of reading, no amount of talking to people like me, gives you the data. And beyond that, the experience changes your core values. The person who decides to have a child is not the same person who raises them.

  In engineering, we call that a critical failure. But in life, I think it's the only way growth happens.

  Nora, I want to be honest with you. I'm not going to stand here and tell you it's going to be wonderful. I don't know that. You don't know that. The evidence simply isn't available to you yet. It might be exhausting. It might be joyful. It might be both, simultaneously. Any promise I make about how you will feel would be a lie, because the "you" who feels it doesn't exist yet.

  But here is what I do know. I know the woman sitting in front of me. I know your courage. And I know that while you have to walk through this door alone, you aren't walking into an empty room.

  Look around you. Thirty people who love you. We can't experience the transformation for you. We can't give you the data you need. But we can be the constants while your variables change. We are here to support the new you, whoever she turns out to be.

  So, I'm not toasting to a happy ending. I'm toasting to the beginning of the unknown. To the leap. To the woman you were, and the woman you are becoming.

  To Nora.
