answer: |-
  You have stumbled upon one of the most fascinating and enduring problems in decision theory, political philosophy, and ethics. You are describing something that is indeed discussed "to death" in academic circles, but that doesn't make your observation any less sharp. In fact, the unease you feel is exactly the philosophical friction point that keeps scholars busy.

  There isn't just one word for this, but rather a cluster of concepts that fit together like a puzzle. The most precise label for the *action* is **Precommitment** (or **Self-Binding**). The most famous metaphorical name for it is a **Ulysses Pact** (or Ulysses Contract).

  However, to answer your deeper questions about *why* it feels paradoxical and whether it's rational, we need to dig into the machinery behind the label. Here is a breakdown of what is going on, why it feels weird, and how philosophers and economists try to resolve it.

  ### 1. The Name: The Ulysses Pact
  The term comes from Homer's *Odyssey*. Ulysses (Odysseus) wants to hear the song of the Sirens, but he knows that when he hears it, he will be overcome with an irresistible desire to steer his ship toward the rocks (which would kill him).

  So, he orders his crew to tie him to the mast and plug their own ears with wax. He instructs them: *No matter how much I beg, command, or threaten you later, do not untie me.*

  This is the archetype of your examples:
  *   **The Smoker:** Ulysses is the smoker; the cigarettes are the Sirens; the roommate is the crew.
  *   **The Constitution:** The Founders are Ulysses; the passionate passions of future majorities are the Sirens; the amendment process is the rope.

  In political theory, the scholar **Jon Elster** is the definitive voice on this. His book *Ulysses Unbound* is essentially a deep dive into the exact phenomenon you described. He distinguishes between **precommitment** (making it impossible to change your mind) and **precaution** (just making it harder). Your friend with the ice block is using a "soft" precommitment; the constitutional amendment process is a "hard" one.

  ### 2. The Mechanism: Time Inconsistency
  You asked: *Why should the you of Tuesday get to boss around the you of Wednesday?*

  Classical economics used to assume that people have stable preferences. If you want a salad on Tuesday, you should want a salad on Wednesday. If you change your mind, it's just a new preference, and restricting it is irrational.

  But behavioral economics and psychology have shown that humans suffer from **Time Inconsistency** (specifically **Hyperbolic Discounting**).

  Here is the trick: We value immediate rewards disproportionately more than future rewards.
  *   **On Tuesday (The Planner):** The reward of smoking is distant. The cost (cancer) is distant. The benefit of health is high. Tuesday-You is calm, rational, and thinking long-term.
  *   **On Wednesday (The Doer):** The cigarette is *right now*. The craving is immediate. The "cool-headed" reasoning of Tuesday evaporates in the face of immediate dopamine.

  So, Tuesday isn't bossing around Wednesday because Tuesday is a tyrant; Tuesday is bossing around Wednesday because Tuesday recognizes that Wednesday will be temporarily "insane" (or at least, cognitively compromised by impulse). In decision theory, this is often modeled as a game between two different players: the **Planner** and the **Doer**.

  ### 3. The Philosophical Paradox: The Divided Self
  This addresses the "unsettling" part you mentioned. *It's the same person on both sides.*

  This touches on the philosophy of **Personal Identity**. If Tuesday-You and Wednesday-You are the same person, how can one restrict the other without violating their own freedom?

  There are two main ways philosophers resolve this tension:

  **A. The Hierarchical Model (Harry Frankfurt)**
  Some philosophers argue we have "first-order desires" (I want to eat cake) and "second-order desires" (I want to *want* to be healthy).
  *   When Wednesday-You wants the cake, that is a first-order impulse.
  *   When Tuesday-You blocks the cake, that is an act of **Autonomy** based on second-order values.
  In this view, restricting your future self isn't a loss of freedom; it is the *ultimate expression* of freedom. You are ensuring that your "higher" self governs your "lower" self. If you didn't bind yourself, you would be a slave to your impulses. So, the restriction *is* the liberty.

  **B. The Sequential Self Model (Derek Parfit / Thomas Schelling)**
  Other thinkers suggest we should stop pretending we are one continuous entity. We are a sequence of temporal selves. Tuesday-You is essentially a different person from Wednesday-You, connected by memory and body.
  *   If you view it this way, the paradox disappears. It's not self-binding; it's **inter-personal binding**. Tuesday is doing a favor for Wednesday, or protecting Tuesday's interests against Wednesday's recklessness.
  *   The unease you feel comes from the fact that we *feel* like one person, but *act* like a chain of different people.

  ### 4. The Political Version: Constitutionalism
  Your example of the constitution is the macro-scale version of this. In political theory, this is often discussed under **Constitutional Precommitment**.

  The founders of a democracy face the same problem as the dieter. They know that in times of crisis (war, panic, economic crash), "future voters" (Wednesday-You) might vote to suspend rights, persecute minorities, or elect a dictator because it feels good/safe in the moment.

  So, they create a Constitution that is hard to amend. They are essentially saying: *"We, the calm people of the present, do not trust the panicked people of the future to make this specific choice."*

  **The Counter-Argument (The "Dead Hand"):**
  Critics (like Thomas Jefferson, interestingly) argue that this is undemocratic. Jefferson famously asked why one generation should have the right to bind another. If Wednesday-You genuinely wants the cake, who is Tuesday-You to say that preference is invalid?
  *   If Wednesday-You is truly sovereign, precommitment is illegitimate.
  *   If Tuesday-You is wiser, precommitment is necessary.
  This is the core tension of constitutional law: **Stability vs. Flexibility.**

  ### 5. Is it Rational? (The Debate)
  You asked if people disagree about whether this is rational. Yes, they do.

  *   **The Standard Economic View:** Traditionally, economists frowned on this. If Wednesday-You is willing to pay $100 to get the cigarette, and Tuesday-You spent $100 to hide it, you've destroyed $200 of value. You've created a "deadweight loss." From this perspective, you should just let Wednesday choose what Wednesday wants.
  *   **The Behavioral View (Schelling/Thaler):** This view argues that because we know our future preferences will be *distorted* by emotion or addiction, satisfying the future preference is actually *irrational*. Maximizing long-term well-being requires ignoring short-term preferences. Therefore, precommitment is the *only* rational choice for a being with weak willpower (akrasia).

  ### Summary of the "Weirdness"
  The reason this feels paradoxical to you is that it sits right on the fault line between two competing definitions of freedom:

  1.  **Negative Liberty:** Freedom *from* interference. (Wednesday-You should not be stopped from eating cake).
  2.  **Positive Liberty/Autonomy:** Freedom *to* govern oneself according to reason. (Tuesday-You ensures the body follows the rational plan).

  When you bind your own hands, you are sacrificing Negative Liberty to secure Positive Liberty. You are saying, "I am not free if I am a slave to my impulses."

  ### So, what should you call it?
  If you want to sound like an expert in a conversation:
  *   Use **Precommitment Strategy** for the general mechanism.
  *   Use **Ulysses Pact** for the dramatic, self-binding aspect.
  *   Use **Time Inconsistency** to explain *why* it's necessary.
  *   Use **Intrapersonal Paternalism** (or Self-Paternalism) to describe the ethical weirdness of one part of you treating another part of you like a child.

  You hit on something profound: We are not monarchs in our own minds; we are democracies (or sometimes battlegrounds) of competing temporal interests. The fact that we have to negotiate treaties with our future selves is one of the defining conditions of being human.
