answer: |-
  Clara is a renowned composer trapped in locked-in syndrome, fully conscious but unable to move or perceive external sound, whose only active volitional desire is to experience the completion of her final symphony. A clinical deep brain stimulation (DBS) trial can bypass her sensory deficits by directly stimulating her auditory cortex to generate the exact qualia of hearing the performance, satisfying her desire to "hear" the work. However, the specific voltage required to trigger this auditory hallucination invariably induces severe, debilitating migraines that persist for hours after the stimulation ends, creating a net negative hedonic tone where the physical agony outweighs the aesthetic pleasure of the music. Clara explicitly ranks the satisfaction of hearing her symphony above the avoidance of physical pain, viewing the experience as the sole remaining meaning of her life, regardless of the artificial source or the physical cost.

  **Hedonistic Utilitarian Reasoning:**
  The hedonistic utilitarian calculates the net balance of pleasure over pain. While the DBS provides the positive qualia of aesthetic appreciation, the procedure necessitates severe physical suffering (migraines) that exceeds the intensity and duration of that pleasure. Since the outcome results in a net deficit of well-being (more pain than pleasure), the theory mandates opposing the procedure, regardless of Clara's wishes or the fulfillment of her life's work.

  **Desire-Satisfaction Reasoning:**
  The desire-satisfaction theorist looks at whether the agent's actual desires are fulfilled. Clara's hierarchy is clear: her overriding desire is to experience the symphony, while the desire to avoid pain is subordinate. The DBS successfully satisfies the primary desire (the experience occurs) and does so via the only means available to her. The "artificiality" of the stimulation is irrelevant because her desire is for the *experience* itself, not the causal history of sound waves hitting an eardrum. Since her most weighted desire is satisfied, the theory endorses the procedure.

  **Heavy Lifting Feature:**
  The feature doing the heavy lifting is the **decoupling of desire satisfaction from net hedonic tone**. In standard cases, satisfying a desire usually produces pleasure, aligning the two theories. Here, the technology satisfies the *propositional content* of the desire ("I experience the music") but delivers it wrapped in a *hedonic deficit* (painful side effects). This forces HU to track the pain (oppose) while DST tracks the desire fulfillment (support).

  **Removing the Feature:**
  If you remove the painful side effects (restoring the correlation between desire satisfaction and pleasure), the case collapses back to the standard verdict: both theories would endorse the wireheading, as it would provide net pleasure and satisfy desires. If you instead remove Clara's specific psychology (e.g., if she desired *real* public performance rather than just the experience), the DST verdict would flip to oppose the wireheading (standard Nozickian objection), while HU would still oppose it due to the pain, resulting in agreement but for different reasons.
