          *   *The "Fact":* Is it a new bit? Or is it the *access* to the bit?
          *   *Key Concept:* **Indexical Information** or **Self-Locating Information**. Or perhaps **Lossy Compression**. The physical description is a lossless compression of the third-person view. The experience is the decompressed signal from the first-person view.
