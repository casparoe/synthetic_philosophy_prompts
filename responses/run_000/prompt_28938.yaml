  9.  *(Wait, one nuance)*: The user asks if their argument is "too quick." I need to point out that simply asserting "it's normative" isn't enough. They need to show *why* the specification of ideal conditions *cannot* be non-normative. For example, if I define ideal conditions as "sober and awake," is that normative? The skeptic says: Why does sobriety track *plus* rather than *quus*? The user needs to make sure this step is explicit in the paper.

