answer: |-
  # Sidebar: Which School of Anthropic Reasoning Do You Actually Belong To?

  Anthropic reasoning asks a deceptively simple question: *Does the fact that you exist tell you anything about the world you live in?* 

  Philosophers and physicists have divided into camps over how to answer. But labels like "Self-Sampling Assumption" tell you little about how a person actually intuits probability. The following quiz presents eight concrete scenarios. Don't overthink the physics; go with your gut. At the end, tally your answers to find your anthropic profile.

  ***

  ### 1. The Sleeping Volunteer
  A volunteer agrees to an experiment. On Sunday, a fair coin is flipped. If it lands **Heads**, she is woken up on Monday, interviewed, and the experiment ends. If it lands **Tails**, she is woken up on Monday, interviewed, given a drug that erases her memory of the waking, woken up again on Tuesday, interviewed, and then the experiment ends. 
  You are the volunteer. You have just been woken up and interviewed. You know all the rules. What is your credence (degree of belief) that the coin landed **Heads**?
  *   **A.** 1/2. The coin is fair; waking up doesn't change the physics of the flip.
  *   **B.** 1/3. There are three possible wake-up events (Heads-Mon, Tails-Mon, Tails-Tue), and only one involves Heads.
  *   **C.** It depends on how much I value being woken up multiple times.

  ### 2. The Lottery of Birth
  Imagine human history as a long line of people, numbered 1 to *N*, where *N* is the total number of humans who will ever be born. You discover your "birth rank" is roughly 100 billion. You have no other information about the future. Does this suggest humanity will go extinct soon?
  *   **A.** Yes. If *N* were trillions, it would be incredibly unlikely for me to be so early in the line.
  *   **B.** No. My birth rank is just a fact about me; it doesn't influence the future survival of the species.
  *   **C.** Only if I assume I am a "random sample" of all humans, which seems arbitrary.

  ### 3. The Two Theories
  A physicist proposes two theories about the universe. Both fit the current data perfectly. 
  *   **Theory Small:** The universe contains 1,000 conscious observers.
  *   **Theory Big:** The universe contains 1,000,000,000,000 conscious observers.
  Before you look out the window to count neighbors, which theory should you consider more likely to be true?
  *   **A.** They are equally likely. The number of observers doesn't change the laws of physics.
  *   **B.** Theory Big. I am more likely to exist in a universe with more observers.
  *   **C.** Theory Small. Simpler universes are generally preferable.

  ### 4. The Incubator
  A machine creates rooms. In Scenario 1, it creates one room with one person inside. In Scenario 2, it creates 1,000 rooms, each with one person inside. A coin flip decides which Scenario occurs. You find yourself inside a room created by this machine. What is the probability the coin landed on Scenario 2?
  *   **A.** 1/2. The coin was fair.
  *   **B.** 1,000/1,001. It is vastly more likely that I am one of the 1,000 people than the single person.
  *   **C.** I need to know how the machine selects *me* specifically.

  ### 5. The Red and Blue Jackets
  You wake up in a dark room. You are told that either (A) one person in the world is wearing a Red Jacket, or (B) one million people are wearing Red Jackets. Everyone else wears Blue. You look down and see you are wearing Red. Does this evidence make scenario (B) more likely?
  *   **A.** Yes. It's much easier to "find yourself" as a Red wearer in the world with millions of them.
  *   **B.** No. The number of Red jackets is fixed by the scenario; my observation is just luck.
  *   **C.** It depends on whether the other people are "like me."

  ### 6. The Quantum Roulette
  You play a game with a quantum device. When you pull the trigger, the universe branches. In 99% of branches, the gun fires and you die. In 1% of branches, it clicks and you live. You play the game ten times. Should you expect to walk away alive?
  *   **A.** No. The odds of surviving ten times are vanishingly small.
  *   **B.** Yes. From your perspective, you can only experience the branches where you survive.
  *   **C.** The question is meaningless; "you" exist in all branches.

  ### 7. The Duplicate Earth
  Suppose the universe is infinite. In an infinite universe, exact duplicates of Earth (and you) must exist. If you make a decision, your infinite duplicates make the same decision. Does the existence of these duplicates change the probability that *you* are the "original" you?
  *   **A.** Yes. There is no "original"; I am just one instance among infinite copies.
  *   **B.** No. Probability breaks down in infinite cases; we shouldn't draw inferences here.
  *   **C.** No. My local experience is what matters, regardless of distant copies.

  ### 8. The Reference Class
  You are trying to guess the average lifespan of a species. Should you compare humans to (A) all biological life, (B) all intelligent civilizations, or (C) only civilizations that know about anthropic reasoning?
  *   **A.** All biological life. We are part of nature.
  *   **B.** Intelligent civilizations. We share the relevant traits.
  *   **C.** Only those who know about anthropic reasoning. That is my specific situation.

  ***

  ## Scoring Key

  Tally your answers. Most of your choices should fall into one of the columns below.

  | Question | **Column X** (The Modest Sampler) | **Column Y** (The Abundance Advocate) | **Column Z** (The Grounded Physicalist) |
  | :--- | :---: | :---: | :---: |
  | **1. Sleeping Volunteer** | A | B | A |
  | **2. Lottery of Birth** | A | B | B |
  | **3. Two Theories** | A | B | A |
  | **4. The Incubator** | A | B | A |
  | **5. Red/Blue Jackets** | B | A | B |
  | **6. Quantum Roulette** | A | B | A |
  | **7. Duplicate Earth** | B | A | C |
  | **8. Reference Class** | C | B | A |

  *(Note: If your answers are scattered, you may be a "Contextualist," believing different rules apply to different puzzles.)*

  ***

  ## Your Results

  ### If you scored mostly Column X: The Modest Sampler
  **Philosophical Cousin:** The Self-Sampling Assumption (SSA).
  **The View:** You reason as if you are a random sample from a specific class of observers. You don't assume your existence makes a world more likely; you assume your *position* within a world is typical. You tend to think large worlds aren't inherently more probable just because they have more people.
  **The Uncomfortable Commitment:** **The Doomsday Argument.** By treating your birth rank as a random sample, you are mathematically compelled to believe that humanity is likely to go extinct sooner rather than later. If we were destined for the stars, there would be trillions of humans; the fact that you are among the first 100 billion suggests the total line isn't that long.

  ### If you scored mostly Column Y: The Abundance Advocate
  **Philosophical Cousin:** The Self-Indication Assumption (SIA).
  **The View:** You believe that worlds with more observers are inherently more likely to contain *you*. Your existence is evidence that favors hypotheses that produce more observer-moments. You treat "I exist" as data that updates probabilities toward larger, more populated universes.
  **The Uncomfortable Commitment:** **The Presumptuous Philosopher.** You must accept that you can rule out physical theories simply because they predict fewer observers. If Theory A predicts a trillion observers and Theory B predicts one, you should believe Theory A is a trillion times more likely, even if the physics evidence is equal.

  ### If you scored mostly Column Z: The Grounded Physicalist
  **Philosophical Cousin:** Full Non-Indexical Conditioning (FNC) or "No Special Principle."
  **The View:** You reject the idea that anthropic reasoning requires a new probabilistic rule. You argue that standard Bayesian updating, using all available information (including "I am here"), yields the correct answer without needing to assume you are a "random sample" or that existence boosts probability.
  **The Uncomfortable Commitment:** **The Reference Class Problem.** You often struggle to define exactly *what* information counts as "available." In puzzles like Sleeping Beauty, your view often mathematically collapses into the Abundance Advocate's view, forcing you to explain why you aren't actually an SIA proponent in disguise.

  ### Special Result: The Infinity Skeptic
  **Trigger:** If you chose **B** on Question 7 (Duplicate Earth) regardless of other answers.
  **The View:** You believe anthropic reasoning works in finite cases but breaks down completely in infinite universes.
  **The Uncomfortable Commitment:** **Cosmic Agnosticism.** You must accept that if the universe is infinite (as some cosmological models suggest), we can know *nothing* about our place in it or the likelihood of any theory. Science becomes locally valid but globally mute.

  ***

  ## A Note on Limitations

  This quiz relies on intuitive responses to stylized puzzles, which cannot perfectly map onto rigorous philosophical positions. Specifically, this quiz cannot reliably separate **The Abundance Advocate (SIA)** from **The Grounded Physicalist (FNC)**. 

  In finite cases (like the Incubator or Sleeping Beauty), Full Non-Indexical Conditioning usually yields the same numerical probabilities as the Self-Indication Assumption. They come apart only in highly technical scenarios involving "forgetful" agents or specific infinite universe topologies where SIA leads to divergence (infinity divided by infinity) while FNC attempts to find a limit. If you scored as a Physicalist but found yourself agreeing with the Abundance Advocate on the Incubator, you are likely in good company: many philosophers argue FNC is simply the rigorous derivation of what SIA intuitively grasps.
