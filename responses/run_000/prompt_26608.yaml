      *   *Standard:* Often struggles with self-locating belief updates (might look like SIA but denies the principle).

  6.  **Addressing the "Cannot Separate" Caveat:**
      *   FNC (Full Non-Indexical Conditioning) often yields same answers as SIA in finite cases.
      *   SSA with a very narrow reference class vs. Standard Bayes can look similar in some specific puzzles.
      *   Need to explain that this quiz tests *intuitions on cases*, not rigorous philosophical commitment.

  7.  **Final Review against Constraints:**
