      *   *Group B (SIA-leaning):* Focus on "more observers = more likely I exist." Susceptible to Presumptuous Philosopher.
      *   *Group C (Standard/No Special Principle):* Focus on "I'm just here, what's the physical chance?"
      *   *Names:*
          *   SSA -> "The Humble Statistician" (Emphasizes modesty/reference class).
