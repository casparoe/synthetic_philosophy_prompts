      *   *SSA (Self-Sampling Assumption):* Reason as if you are a random sample from your reference class. Tends to favor "smaller" worlds or earlier doom (Doomsday Argument).
      *   *SIA (Self-Indication Assumption):* Reason as if you are more likely to exist in worlds with more observers. Tends to favor "larger" worlds (Presumptuous Philosopher).
      *   *Full Non-Indexical Conditioning (FNC) / "No Special Principle":* Just use all available information, including indexical info, via standard Bayes. Often aligns with SIA but tries to avoid the "presumptuous" implication.
      *   *Sub-variants:*
          *   SSA Reference Class (Narrow vs. Broad).
