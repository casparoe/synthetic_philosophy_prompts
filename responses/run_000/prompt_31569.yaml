prompt: |-
  I work on the survey design team at a large public-health research institute. We run longitudinal studies tracking health outcomes across populations, and we're constantly fighting about which demographic categories to include on our intake forms and how to ask about them. The fights are usually between people who say "we need to track race/gender/etc. because health disparities are real" and people who say "these categories are socially constructed and by using them we're reifying them and doing harm." Both sides are right about something and we have no framwork for resolving this.

  I want a decision procedure my team can use when we're designing a new survey or revising an old one. For each candidate category (say, a race question, a gender question, a disability-status question, an income bracket question), the procedure should walk us through: should we include it at all? If yes, should we use fixed checkboxes or a free-text field? Should we let people select multiple? And when should we push back on a funder or a PI who insists on a category we think is harmful?

  Ground this in whatever the social-construction literature actually implies for practical classification decisions — not the metaphysics for its own sake, but what follows for someone who has to build a form that real people will fill out. The procedure has to be something a team with no philosophy background can run in an hour-long meeting. Flag the steps that are genuinely judgment calls vs. steps where the theory gives a clear answer. And be honest about where the procedure will give an answer that makes everyone unhappy.

  Then run it on three cases: (1) a question about race/ethnicity on a study of maternal health outcomes, where we know there are real disparities but the standard OMB categories are a mess; (2) a question about gender identity on a study of adolescent mental health, where our IRB is nervous and some parents will see the form; (3) a question about "household income" on a study of food insecurity, where the category seems straightforward but the construction is actually pretty loaded (what counts as a household? whose income?).
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Deconstruct the Request:**
      *   **Context:** Large public-health research institute, longitudinal studies.
      *   **Problem:** Internal conflict between "track disparities" (essentialist/pragmatic view) vs. "reify harmful categories" (social constructionist/critical view).
      *   **Goal:** A decision procedure/framework for survey design teams to resolve these conflicts.
      *   **Requirements:**
          *   Grounded in social construction literature (practical implications, not metaphysics).
          *   Usable by non-philosophers in a 1-hour meeting.
          *   Address specific design choices: Include? Fixed vs. Free-text? Single vs. Multiple? Pushing back on funders/PIs?
          *   Distinguish between clear theoretical answers and genuine judgment calls.
          *   Acknowledge where the procedure leads to unhappy compromises.
          *   Apply the procedure to three specific cases: Race/Ethnicity (Maternal Health), Gender Identity (Adolescent Mental Health), Household Income (Food Insecurity).

  2.  **Theoretical Grounding (Social Constructionism in Epidemiology):**
      *   *Core Tension:* Categories are not biologically real (mostly) but have real biological/social effects (racism, sexism, economic deprivation).
      *   *Key Concept:* "Racialization" or "Categorical Realism." The category isn't the cause; the *treatment* based on the category is the cause.
      *   *Key Concept:* "Measurement Validity." Does the question measure what we think it measures? (e.g., Does "Race" measure genetics or exposure to racism?)
      *   *Key Concept:* "Harms of Misclassification." Erasure vs. Reification.
      *   *Reference Points:* Nancy Krieger (Ecosocial Theory), Joanne Kaufman (Race as social construct), OMB standards, APA guidelines on gender.

  3.  **Drafting the Decision Procedure (The "Constructivist-Pragmatist Matrix"):**
      *   Need a step-by-step flow.
      *   *Step 1: Purpose & Mechanism.* Why do we want this data? Is the hypothesis about the *category* or the *experience associated with it*? (Crucial distinction).
      *   *Step 2: Harm/Benefit Analysis.* Who benefits? Who is harmed by asking? Who is harmed by *not* asking?
      *   *Step 3: Granularity & Format.* Fixed vs. Open. Single vs. Multiple. Based on the population's self-conception vs. analytical needs.
      *   *Step 4: Context & Consent.* How is it framed? Is it mandatory?
      *   *Step 5: The "Pushback" Test.* When to refuse a PI/Funder.

      *Refining for the "1-Hour Meeting" constraint:* It needs to be a checklist or a scoring sheet, not an essay. Let's make it a 5-Step Protocol.

      *Addressing the "Judgment Call" requirement:* I need to explicitly label where theory ends and politics/ethics begin.

  4.  **Developing the Three Cases:**

      *   **Case 1: Race/Ethnicity (Maternal Health).**
          *   *Tension:* Disparities are stark (Black maternal mortality). OMB categories are broad/colonial.
          *   *Application:* Must include (to track racism), but refine format (allow specificity).
          *   *Outcome:* Include, but add "ancestry/origin" text field + experience of discrimination measure.

      *   **Case 2: Gender Identity (Adolescent Mental Health).**
          *   *Tension:* High risk for trans youth. IRB/Parental consent issues.
          *   *Application:* Safety first. Two-step method (Sex assigned at birth + Current Identity). Waiver of parental consent for this specific item might be needed (ethical conflict).
          *   *Outcome:* Include, but protect data. Maybe separate from parental view.

      *   **Case 3: Household Income (Food Insecurity).**
          *   *Tension:* Seems objective, but "household" is constructed.
          *   *Application:* Define "household" explicitly. Acknowledge informal economy.
          *   *Outcome:* Include, but redefine "household" in instructions + range brackets.

  5.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Simplify the language. Use "Stop/Go" signals.
      *   *Critique:* Did I address the "reification" fear?
      *   *Fix:* Emphasize that measuring a category *to study the effect of discrimination* is different than measuring it *to imply biological difference*. This is the Krieger distinction.
      *   *Critique:* Did I answer the "unhappy compromise" part?
      *   *Fix:* Explicitly state in the conclusion that sometimes you must collect "imperfect" data to get funding, but you must document the limitation.

  6.  **Final Polish:**
      *   Structure the response clearly: Introduction -> The Framework -> The Procedure -> The Three Cases -> Conclusion on Limitations.
      *   Ensure the tone is professional, empathetic to both sides, and actionable.
      *   Check against the prompt: "Flag steps that are genuinely judgment calls." I will add icons or bold text for this.

  7.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
      *   *Key Theoretical Anchor:* Nancy Krieger's "Ecosocial Theory" and the concept of "Racialization" rather than "Race."
      *   *Key Practical Anchor:* OMB Standards vs. Best Practices (e.g., GenIUSS).
      *   *Decision Logic:* Necessity -> Precision -> Safety -> Transparency.

  *(Self-Correction during drafting)*: Make sure I don't just say "ask about discrimination." Sometimes you can't. The procedure needs to handle the constraint of "we only have space for 5 demographic questions."
  *Adjustment:* Add a step about "Analytical Utility." If you can't measure the mechanism (racism), is measuring the proxy (race) still worth it? Yes, for surveillance, but with caveats.

  *(Refining the "Pushback" criteria)*: When do you say no to a PI? When the category implies biological essentialism without mechanism, or when data collection endangers participants.

  *(Refining the "Unhappy Compromise")*: Acknowledge that sometimes you have to use OMB categories for federal reporting even if you hate them. The procedure should tell you to *document* this tension, not necessarily solve it perfectly.

