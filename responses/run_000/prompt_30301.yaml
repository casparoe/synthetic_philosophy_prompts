answer: |-
  Good evening everyone. For those of you who don't know me, I'm the best man, which mostly means I'm the person who had to write this speech while constantly checking my phone for messages from the groom telling me not to embarrass him. I'll admit, I put this off. I stared at a blank document for weeks. Part of that was nerves, but mostly it was because I was terrified of falling into a trap my brother set for me years ago.

  Those of you who know my brother know he has a soft spot for philosophy. Years ago, he told me about a story from a philosopher named Bernard Williams. It's about a man standing on a beach who sees two people drowning. One is his wife, the other is a stranger. He can only save one. He saves his wife. Now, most of us would say he did the right thing. But Williams argues that if the man saves his wife and then explains his choice by saying, "She is my wife, and I have a duty to save her," he has had one thought too many. The justification shouldn't be necessary. The fact that he needed to reach for a reason at all means he missed the point. He should have saved her simply because she is his wife. The love comes before the reason.

  My brother got weirdly attached to this idea. It became our running joke. Whenever I'd overexplain why I was late, or why I picked a certain restaurant, or why I was feeling down, he'd hold up a hand and say, "Too many thoughts." He believed that the person you are and the things you care about are supposed to be enough. Having to justify them from the outside changes them. It turns something living into a contract.

  So, standing here today, I realized I couldn't give you a speech that lists the reasons why my brother and his new wife are perfect for each other. I could tell you that she makes him laugh, or that she keeps him organized, or that they share a love of hiking. But that would be giving you reasons. That would be standing on the beach explaining the duty of rescue while the water is rising. That would be one thought too many.

  The beauty of what we are celebrating today isn't that my brother weighed the options, calculated the pros and cons, and rationally concluded that marriage was the optimal path. If he had done that, I'd be worried. The beauty is that there was no calculation. When he met her, the deliberation stopped. He didn't choose her because she fit a criteria; he chose her because she was the only person he could imagine building a life with without needing to ask why.

  To the philosophy friends in the room, you know the reference. To the rest of the family, I hope you just hear the sentiment. My brother loves this story because he believes love should be instinctive. But I think watching him with his wife over the last few years, I've seen something even better than the story. In the story, the man is alone on the beach. In real life, my brother isn't saving her from drowning, and she isn't waiting to be saved. They are in the boat together.

  When I look at them, I don't see a contract being signed. I see a recognition. I see the way he looks at her when she's telling a story he's heard a dozen times. I see the way she reaches for his hand without looking when the room gets crowded. There is no hesitation there. There is no internal monologue about obligation or duty. There is just the immediate, unthinking pull toward each other. That is what marriage is. It is the agreement that you will never need to justify choosing each other, again and again, for the rest of your lives.

  So, I am not going to tell you why they are good together. I am not going to analyze their compatibility. I am just going to tell you that they are. And if anyone asks why, the only answer is that they are each other's. Anything else is just noise.

  My brother used to tell me that needing a reason means you've already lost the feeling. But looking at them today, I know the feeling is still there, stronger than any reason could ever be. So, if everyone could please raise their glasses. To the bride and groom. May you never have to explain why you chose each other. May you never have one thought too many. And may you always know, without a shadow of a doubt, exactly who you are saving when the water rises. To the happy couple.
