answer: |-
  Here are nine interview questions designed for your podcast. They are structured to move from conceptual foundations to specific biological challenges, ending with a direct interrogation of the metaphysics/practice divide.

  Each question includes the **Primary Question**, the **Anticipated Reply** (based on your knowledge of her position), and the **Follow-Up** (designed to press on whether the metaphysical independence is doing any explanatory work).

  ### 1. The "So What?" for Working Biologists
  **Primary Question:** For many working biologists, a species is simply the operational unit we use to organize biodiversity data. You argue that a species is a historical individual, akin to an organism, rather than a class defined by shared traits. Beyond satisfying ontological consistency, what concrete difference does this make for how a field biologist designs a study or interprets data?

  **Anticipated Reply:** She will likely argue that this is a metaphysical claim about *what* species are, not an epistemological claim about *how* we identify them. She may say it prevents essentialist thinking but doesn't change field protocols.

  **Follow-Up:** If the view doesn't change field protocols or data interpretation, isn't the "individual" label just a retrospective philosophical stamp we put on a lineage after we've already identified it using traditional criteria? I'm pressing on whether this metaphysical independence is actually doing any work, or if it's just a description of the conclusion we reached using standard taxonomy.

  ### 2. The Units of Selection Debate
  **Primary Question:** A standard objection to the individuals view is that natural selection requires replicators, and while organisms replicate (via reproduction), species do not replicate in kind; they only persist or go extinct. If species are individuals, how do they function as units of selection without the capacity to replicate, given that selection is fundamentally a differential reproduction of entities?

  **Anticipated Reply:** She will likely distinguish between *replicators* (genes) and *interactors* (organisms/species). She may argue species are "interactors" that are selected, even if they don't replicate, or appeal to species selection as a distinct macroevolutionary process.

  **Follow-Up:** But if the species-individual cannot replicate its own structure, isn't the "selection" acting on it merely the aggregate effect of selection on the organisms within it? If the metaphysical status of the species as an individual doesn't grant it independent causal power in the selection process, does calling it an "individual" obscure more than it clarifies regarding the mechanism of evolution?

  ### 3. The Biological Species Concept (BSC) and Interbreeding
  **Primary Question:** The Biological Species Concept remains the default for many because interbreeding provides a tangible mechanism for cohesion—it explains why the "parts" of the species-individual stay together. If species are individuals, is interbreeding the necessary "glue" that constitutes the individual, or is it merely a common symptom of one?

  **Anticipated Reply:** She will likely say interbreeding is a common *cohesion mechanism* but not the definition of the individual. She will argue the individual is defined by its lineage history, not the specific mechanism holding it together.

  **Follow-Up:** You've said this metaphysical view is independent of the taxonomic problem. But if you sever the definition of the species-individual from the specific cohesion mechanism (like interbreeding), don't you lose the ability to explain *why* the individual holds together in the first place? Does claiming metaphysical independence leave us with an individual that has no explanatory account of its own integrity?

  ### 4. Asexual Lineages and the Fossil Record
  **Primary Question:** In asexual lineages and the fossil record, the interbreeding criterion has no grip, yet we still identify species. If a species is an individual, what binds the parts of an asexual species-individual together in a way that distinguishes it from a mere class of similar-looking organisms?

  **Anticipated Reply:** She will likely appeal to "lineage theory," arguing that common ancestry and causal connection through time constitute the individual, regardless of sexual reproduction. The "glue" is genealogical continuity, not genetic exchange.

  **Follow-Up:** If genealogical continuity is the only requirement, then every clone is a distinct species-individual the moment it diverges. Doesn't this make the "species" category so metaphysically fragile that it loses its utility as a biological unit? I'm asking if the metaphysical claim of individuality is doing enough work to prevent the category from collapsing into pure particularism.

  ### 5. Vagueness and Boundaries
  **Primary Question:** Organisms generally have clear spatiotemporal boundaries (skin, birth, death). Species, however, often have fuzzy boundaries in both space (hybrid zones) and time (anagenesis). How can a species be a genuine "individual" if its boundaries are inherently vague in a way that organismal boundaries are not?

  **Anticipated Reply:** She will likely argue that vagueness does not preclude individuality (e.g., a cloud or a hurricane is an individual despite fuzzy boundaries). She will assert that spatiotemporal localization is sufficient for individuality, even without sharp edges.

  **Follow-Up:** But clouds and hurricanes are physical phenomena defined by immediate causal processes, whereas species boundaries are often determined by retrospective phylogenetic analysis. If the boundaries are only clear in hindsight, isn't the "individuality" a construct of the taxonomist rather than a feature of the world? Does the metaphysical independence claim protect the theory from the reality that we can't identify the "birth" of a species until long after it happens?

  ### 6. Species Selection and Macroevolution
  **Primary Question:** Let's return to selection. Proponents of species selection argue that species must be individuals to be selected. However, critics argue that species sorting is often just drift or the aggregate of organismal fitness. What specific causal property does the species-individual possess that allows it to be a *direct* target of selection, distinct from the organisms comprising it?

  **Anticipated Reply:** She may cite emergent properties, such as geographic range size or speciation rate, that belong to the species-individual and not the organism.

  **Follow-Up:** If those emergent properties are entirely dependent on the distribution and traits of the constituent organisms, is the species-individual actually doing the causal work, or is it just the locus where we sum up the organismal data? If the metaphysics doesn't grant the species independent causal leverage, are we just re-describing organismal selection at a larger scale?

  ### 7. Nomenclature and Stability
  **Primary Question:** Taxonomists struggle with stability in naming. If species are individuals, they can theoretically be named like organisms (proper nouns) rather than classes. Does the individuals view offer any resolution to the instability of species names when phylogenetic hypotheses change, or does it exacerbate the problem?

  **Anticipated Reply:** She will likely say the individuals view supports the PhyloCode approach, where names track lineages rather than diagnostic traits, potentially increasing stability despite hypothesis changes.

  **Follow-Up:** But if the metaphysical claim is independent of the taxonomic problem, as you've suggested, why should a change in metaphysical view influence the Code of Nomenclature? If the metaphysics doesn't dictate the taxonomy, isn't the push for proper nouns just a philosophical preference rather than a scientific necessity?

  ### 8. The Ontology/Epistemology Split
  **Primary Question:** You've mentioned that the individuals view is a claim about ontology (what exists) rather than epistemology (how we know). Many biologists find this distinction frustrating because we need to *identify* units to study them. Is there any risk that insisting on this independence insulates the philosophical thesis from biological falsification?

  **Anticipated Reply:** She will likely defend the distinction, arguing that science often posits entities (like electrons) that are defined independently of our immediate measurement tools, and species are similar.

  **Follow-Up:** Electrons have predictable causal effects we can measure repeatedly. If the species-individual's definition is independent of how we identify it, and our identification methods keep changing, what empirical evidence could *possibly* falsify the individuals view? I'm pressing on whether this independence makes the view scientifically inert.

  ### 9. Advice for the Next Generation
  **Primary Question:** As I talk to many early-career scientists on this podcast, they are focused on publishing and grant-writing. If a grad student accepts your view that species are individuals, what is one specific thing they should do differently in their research compared to a student who views species as natural kinds?

  **Anticipated Reply:** She will likely suggest they should focus more on historical processes and lineage connections rather than searching for diagnostic morphological characters.

  **Follow-Up:** But if the metaphysical view is independent of the taxonomic problem, shouldn't they be able to find those lineage connections regardless of whether they call the species an "individual" or a "class"? If the research practice is the same either way, isn't the metaphysical claim just a semantic layer that isn't doing the heavy lifting in the science?
