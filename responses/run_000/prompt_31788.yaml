  **Episode summary**
  In 1985, the British Antarctic Survey revealed a massive thinning of stratospheric ozone over Antarctica, caused primarily by chlorofluorocarbons (CFCs) used in refrigeration and aerosols. Increased ultraviolet (UV) radiation threatened severe public health crises, including millions of skin cancer cases, alongside catastrophic damage to agricultural yields and marine ecosystems. In response, nations negotiated the 1987 Montreal Protocol, committing to phase out ozone-depleting substances (ODS). The treaty mandated binding reduction schedules, eventually leading to a near-total global ban. It stands as a rare example of successful preemptive international environmental regulation, averting a projected escalation of UV radiation that would have peaked in the mid-21st century. The decision amounted to a coordinated economic sacrifice by industrialized nations to preserve a global public good, balancing immediate industrial costs against diffuse, long-term biological harms.

  **The longtermist framework**
  Strong longtermism posits that the expected value of present actions is determined overwhelmingly by their impact on the very long-run future—centuries or millennia hence. Unlike weak concern for future generations, which weighs near-term and far-term welfare somewhat comparably, strong longtermism argues the potential population of the future is so vast that even tiny changes in extinction probability or civilizational trajectory dominate current welfare considerations. Consequently, the primary moral priority is reducing existential risks (threats causing human extinction or permanent curtailment of potential) and influencing trajectory changes (locking in positive or negative institutional norms). For a policy like the Montreal Protocol, the relevant axes of evaluation are not immediate cost-benefit ratios, but rather: does this prevent extinction? Does it alter the long-term trajectory of global cooperation or technological development? Near-term suffering matters only insofar as it influences these far-future outcomes. The theory demands an expected value calculus that prioritizes the sheer scale of the future over the certainty of the present.

  **Mapping the analysis**
  In 1987, signatory nations faced distinct options: ratify the Protocol with aggressive phaseouts, adopt weaker targets, delay action pending further science, or do nothing. A longtermist calculus evaluates these based on causal pathways to the year 3000 and beyond. First, the *biological pathway*: Unchecked ODS would have devastated ecosystems and agriculture. While likely not an existential risk (humanity would survive), it could cause a civilizational bottleneck, reducing population and technological capacity for centuries. Preserving the biosphere maintains the substrate for future flourishing. Second, the *institutional pathway*: The Protocol established a precedent for binding global environmental cooperation. If this norm persists, it lowers transaction costs for future treaties (e.g., climate change), positively altering the trajectory of global governance. Third, the *technological pathway*: Forcing innovation away from CFCs prevented a lock-in of harmful chemistry, potentially steering industrial development toward safer materials.

  However, the calculus is ambiguous regarding magnitude. If ozone depletion was merely a catastrophic risk rather than an existential one, strong longtermism might assign it significantly less value than AI safety or biosecurity. Furthermore, the resources spent on compliance could theoretically have been diverted to direct existential risk mitigation. The decision matters in 3000 only if the institutional precedents hold or if the avoided ecological damage permanently enhanced carrying capacity. The uncertainty in 1987 was high; a longtermist must weigh the expected value of acting on probabilistic models against the opportunity cost of capital. Specifically, the choice between a fast phaseout versus a delayed one hinges on whether the marginal reduction in UV exposure today compounds into significant population differences over millennia, or whether the institutional signal of a "fast" agreement is the true value driver. Moreover, the counterfactual matters: if "doing nothing" leads to a technological trajectory where harmful chemicals become entrenched infrastructure, the cost of later remediation rises exponentially, locking in negative value for centuries. Delaying action increases the stock of ODS in the atmosphere, extending the recovery timeline from decades to centuries. This prolongs the period of ecological stress, potentially triggering feedback loops in climate systems that compound the harm. A longtermist must consider whether a delayed phaseout creates a "broken window" effect, normalizing environmental negligence that undermines future compliance mechanisms. The option to "do nothing" represents a trajectory lock-in of high-risk industrial practices, whereas ratification signals a commitment to precautionary principles. The magnitude of these effects depends on the persistence of the institutional norms established; if the Protocol is viewed as a one-off success rather than a template, its long-term value diminishes. Thus, the decision is not merely about chemical concentrations but about establishing a governance architecture capable of managing planetary boundaries over geological timescales.

  **What the theory illuminates**
  Strong longtermism brings the *permanence* of the damage into sharp relief. Standard cost-benefit analysis typically applies high discount rates, making harms occurring 50 years hence appear negligible compared to immediate industrial costs. Longtermism rejects this discounting, highlighting that the ozone layer's recovery spans centuries; the value of preserving it accumulates over millennia. Additionally, the theory highlights the *trajectory change* inherent in the negotiations. A standard view sees the Protocol as solving a specific chemical problem. A longtermist sees it as a potential hinge moment for international cooperation norms. If the Protocol demonstrated that sovereign nations could sacrifice sovereignty for a global public good, it may have increased the probability of solving future existential threats. This institutional legacy is invisible to frameworks focused solely on immediate health outcomes or economic efficiency. It reframes the treaty not as a cleanup job, but as an investment in the political infrastructure necessary for humanity's survival. The theory forces us to ask not just "how many cancers were prevented?" but "did this make humanity more capable of surviving the next millennium?"

  **What the theory misses or misdescribes**
  However, strong longtermism misdescribes the *motivation* and *nature* of the harm. The actors were not reasoning about the year 3000; they were motivated by immediate skin cancer risks and crop failures. Framing this as a longtermist victory is post-hoc rationalization. More critically, the theory struggles with the *category* of risk. Ozone depletion was a global catastrophic risk, not strictly existential. If strong longtermism insists existential risk reduction dominates all else, it might imply the Protocol was suboptimal if those resources could have reduced nuclear war probability by even 0.01%. This creates a forced fit: trying to elevate ozone to an existential threat to justify it within the theory. Furthermore, the theory abstracts away the political trust-building required to make the treaty work, focusing on outcomes rather than the messy procedural virtues that actually secured the win. It risks undervaluing the near-term welfare gains that actually motivated the coalition. The theory's focus on the far future can obscure the immediate moral urgency that drives political action.

  **What the episode shows about the theory**
  The episode challenges the theory's strict hierarchy. If the Montreal Protocol is intuitively valuable—a paradigm of good governance—yet fails the strict "existential risk" test, strong longtermism risks counterintuitive implications. It suggests the theory may need to broaden its scope beyond extinction to include "civilizational resilience." Preventing massive suffering and ecological collapse preserves the stability required to manage future existential risks. A strong longtermist could consistently oppose the Protocol only if they believed alternative investments offered higher expected value for the far future. If that opposition feels morally repugnant, it reveals a limitation in the theory's weighting of non-existential long-term harms. The episode suggests that trajectory changes via successful cooperation are competitive with direct risk mitigation, implying the theory should value institutional robustness more highly than currently acknowledged by some proponents. It tests whether the theory can accommodate "global catastrophic risk" as a priority class alongside extinction risk.

  **Verdict**
  The Montreal Protocol fits strong longtermism well regarding timescales and global scope but tensions arise over the existential risk criterion. The case confirms that far-future impacts are morally weighty but challenges the insistence that only extinction-level threats matter. Defenders should take away that preserving civilizational capacity and cooperation norms are valid longtermist interventions, even without immediate x-risk reduction. The theory remains robust if it accommodates resilience-building as a primary pathway to securing the far future.
