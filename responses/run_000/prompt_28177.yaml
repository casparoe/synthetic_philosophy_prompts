answer: |-
  ### Part I: The Statistical Translation

  **The Critic's Charge: Just-So Stories as Overfitting**

  On the statistical reading, the Gould-Lewontin critique asserts that standard adaptationist modeling suffers from severe **overfitting** due to excessive **degrees of freedom** in the specification of the likelihood function.

  1.  **Unidentified Parameters and Free Parameters:** The "Environment of Evolutionary Adaptedness" (EEA) functions as a set of latent variables. The critic argues that adaptationists treat the EEA parameters as effectively free. Given any observed phenotype $Y$, one can specify a selection pressure vector $\beta$ such that $P(Y|\beta)$ is maximized. Because the EEA is not directly observed, the model is **unidentified**; there are infinite combinations of ancestral pressures and constraints that yield the same contemporary trait distribution.
  2.  **Post Hoc Fitting and Data Snooping:** The methodology is accused of **reverse engineering**. The trait $Y$ is included in the training set used to estimate $\beta$. The hypothesis is constructed *after* inspecting the residuals of the previous theoretical framework. This is classic **data snooping**: the model is tuned to minimize error on the observed data without penalty for complexity.
  3.  **Lack of Out-of-Sample Testing:** The narrative survives because it is never subjected to **cross-validation**. The "predictions" are often merely retrodictions of the data used to build the model. There is no **hold-out set** (e.g., a distinct population, a distinct psychological module, or a novel behavioral implication) where the model's predictive accuracy is tested against a null.
  4.  **Multiple Comparisons:** By generating a plausible story for *every* trait, the field engages in implicit **multiple testing** without correction. If you test 100 traits with $\alpha=0.05$, five will look significant by chance. Adaptationism often treats the existence of a coherent narrative as a rejection of the null, ignoring the **family-wise error rate** inherent in searching the hypothesis space for *any* fitting story.
  5.  **Saturated Models:** The just-so story is effectively a **saturated model**. It has as many parameters as data points (one specific selective pressure for every specific behavioral nuance). It achieves zero training error but has high variance and poor **generalizability**.

  **The Defender's Reply: Adaptationism as Regularized Modeling**

  The defense argues that rigorous evolutionary psychology employs **regularization** and **model comparison** to ensure **identifiability** and **external validity**.

  1.  **Informative Priors and Regularization:** Serious EP does not treat the EEA as free parameters. It places **informative priors** on ancestral conditions derived from independent datasets (paleoclimatology, primatology, archeology). This acts as **penalized likelihood** (e.g., LASSO or Ridge regression), shrinking the space of plausible selection pressures and preventing the model from fitting noise.
  2.  **Pre-Registration and Out-of-Sample Prediction:** A well-specified adaptationist hypothesis generates **novel predictions** $Y_{new}$ that were not part of the estimation sample. This is equivalent to **pre-registering** an analysis plan: the functional form of the adaptation is specified before examining the specific behavioral data intended to test it. Success is measured by **out-of-sample predictive accuracy**, not in-sample fit.
  3.  **Model Selection Criteria (AIC/BIC):** The claim is not merely that the adaptation model fits, but that it fits *better* than alternative models when penalized for complexity. Defenders should be computing **AIC or BIC** to compare the Adaptation Model against a **Null Model** (e.g., drift, developmental constraint, or exaptation). If the adaptation model does not significantly lower the information criterion despite its added complexity, it is rejected.
  4.  **Instrumental Variables:** To address endogeneity (the fact that current behavior might shape current environment, confounding the inference), defenders use **instrumental variables** that correlate with ancestral pressures but are orthogonal to contemporary cultural noise.
  5.  **Robustness Checks:** The hypothesis must be robust to perturbations in the model specification. If small changes in the assumed EEA parameters cause the likelihood of the trait to collapse, the model is **unstable** and the inference is weak.

  ***

  ### Part II: The Residue Report

  You asked where the translation distorts and what does not survive. The mapping is epistemically potent but ontologically leaky.

  **1. What Maps Cleanly**
  The epistemic norms of the debate map almost perfectly to model selection theory.
  *   **Plausibility $\approx$ Likelihood:** The intuition that a story "fits" is precisely the likelihood function $P(Data|Hypothesis)$.
  *   **Parsimony $\approx$ Regularization:** The demand for simplicity is a penalty term on model complexity.
  *   **Novel Prediction $\approx$ Cross-Validation:** The requirement that a hypothesis predict something new is exactly the requirement for out-of-sample testing to detect overfitting.
  *   **Alternative Explanations $\approx$ Non-Nested Model Comparison:** The demand to consider spandrels is a demand to compare non-nested models (Optimization vs. Constraint).

  **2. The Distortions and Residue**

  *   **The Null Model Problem (Your Suspicion is Correct):**
      In statistics, a null model ($H_0$) usually implies "no effect" ($\beta=0$) or "noise only." In biology, a **spandrel** or **byproduct** is not "noise." It is a structured outcome of a *different* causal process (e.g., developmental constraint or genetic correlation).
      *   *Distortion:* Treating the spandrel as a statistical null suggests it is the absence of a model. It is not. It is a competing model with its own likelihood function. A spandrel model can fit the data with low error.
      *   *Consequence:* You cannot simply "reject the null" to prove adaptation. You must perform **model selection** between two complex, structured models. The statistical vocabulary tempts us to treat "Adaptation" as the alternative and "Non-Adaptation" as the null, which is a category error. Non-adaptation is often highly structured.

  *   **The Historical Identifiability Problem:**
      Statistics generally assumes the Data Generating Process (DGP) is stationary or that we are sampling from the population of interest.
      *   *Distortion:* In EP, the DGP (selection pressure) is *extinct*. We are inferring a parameter $\theta_{past}$ from data $Y_{present}$. This is an **inverse problem** with severe identifiability issues. Multiple distinct historical DGPs can converge on the same contemporary equilibrium (equifinality).
      *   *Residue:* No amount of model fitting on contemporary data can statistically distinguish between a trait that was selected for $X$ and a trait that was selected for $Y$ but is now co-opted for $X$, if both yield the same likelihood on current data. The statistical vocabulary lacks a term for **historical causality** distinct from **functional fit**.

  *   **Adaptation $\neq$ Low Error:**
      As you noted, calling something an adaptation is a claim about history, not just function.
      *   *Distortion:* A model can have low prediction error (high $R^2$) without the trait being an adaptation. It might be a perfectly reliable byproduct.
      *   *Residue:* The statistical translation reduces "Adaptation" to "Good Fit + Complexity Penalty." It misses the **etiological claim**. In stats, if the model predicts well, we use it. In biology, if the model predicts well but the history is wrong, the explanation is false. The statistical vocabulary is ahistorical; the biological debate is essentially historical.

  **3. The Ledger: What is Missing?**

  Is the statistical vocabulary lacking, or is the philosophical talk imprecise?

  **The Verdict:** The failed translation reveals that **the philosophical talk is often less precise than it sounds**, *but* the statistical vocabulary lacks the ontology to resolve the remaining ambiguity.

  1.  **Philosophical Imprecision Exposed:** The statistical translation exposes that much of the "Just-So" critique is simply a complaint about **unpenalized likelihood maximization**. When defenders say "we make predictions," the translation forces them to specify: *Are these in-sample or out-of-sample?* If in-sample, the statistical vocabulary correctly identifies this as weak evidence. The debate often stalls because philosophers argue about "plausibility" when they should be arguing about **degrees of freedom** in the EEA specification. Here, the statistical vocabulary corrects the philosophy.

  2.  **Statistical Ontological Deficit:** However, the translation breaks down on the nature of the **Null**. Statistics is ill-equipped to handle **process ontology**. A statistical model describes covariance; an evolutionary explanation describes a causal history.
      *   You can have a model with perfect out-of-sample prediction that is still etiologically wrong (the Ptolemaic system predicted planets well).
      *   The debate turns on **causal mechanism**, not just predictive accuracy. The statistical vocabulary treats models as black boxes relating inputs to outputs. The biological debate is about the *gears inside the box* (selection vs. drift vs. constraint).
      *   Therefore, the statistical vocabulary cannot fully capture the stakes. It can tell you if a story is *overfitted*, but it cannot tell you if the trait is a *spandrel* unless the spandrel model is explicitly parameterized and distinguishable from the adaptation model given the data. Often, they are **observationally equivalent**.

  **Conclusion:**
  The translation succeeds in diagnosing the *epistemic risk* (overfitting, lack of validation) but fails to capture the *ontological claim* (historical causation). The debate persists not because philosophers are bad at statistics, but because **selection and constraint are often observationally equivalent given contemporary data.** The statistical vocabulary forces this equivalence into the open (via identifiability issues), showing that the debate is not about "science vs. stories," but about **underdetermination of theory by data**. The residue is the realization that no amount of model fitting can fully solve a historical inverse problem without exogenous causal assumptions that statistics itself cannot justify.
