answer: |-
  This is a classic philosophical dilemma, and I want to start by validating your intuition: **You are not being incoherent.** In fact, your position is philosophically more sophisticated than your friend's.

  Your friend is arguing from a framework called **Logical Positivism** (popular in the 1920s-30s), which claims that a statement is only meaningful if it can be empirically verified (like science) or is a tautology (like math). Anything else is "nonsense" or mere emotion. Most contemporary philosophers of religion consider this framework too narrow to capture the complexity of human language and experience.

  Here is a breakdown of how we can approach this, starting with three brainstorming options, followed by the one I believe is strongest for your specific situation.

  ### Brainstorming Three Philosophical Responses

  **1. The Pragmatist Approach (William James)**
  *   **The Gist:** Truth isn't about matching a static reality; it's about what *works*. If praying makes you more grateful, more ethical, or more connected to your community, then the practice is "true" in the only way that matters for human life.
  *   **The Counter to Friend:** Your friend thinks truth is a mirror of the world. You argue truth is a tool for navigating the world.
  *   **Weakness:** A hard-nosed atheist might reply, "Therapy works too; that doesn't make it religion." It risks reducing faith to mere self-help.

  **2. The Symbolic/Mythic Approach (Paul Ricoeur)**
  *   **The Gist:** Religious language is "second naïveté." You know the stories aren't literally true (like a child believes), but you engage with them as symbols that reveal deeper truths about the human condition that literal language cannot capture.
  *   **The Counter to Friend:** You aren't making factual claims; you are interpreting symbols. "God" is a symbol for the ultimate source of value.
  *   **Weakness:** Your friend might call this "poetry," not religion. It struggles to explain why you keep *food rules* specifically, rather than just reading the poetry.

  **3. The Wittgensteinian "Form of Life" Approach**
  *   **The Gist:** Language gets its meaning from how it is *used* within a specific community and practice (a "language game"). Religious language isn't trying to do the job of science (describing objects); it is doing the job of orienting a life. To ask if God exists "like a table" is a category mistake.
  *   **The Counter to Friend:** You are judging a fish by its ability to climb a tree. You are applying scientific criteria to a practice that operates on different rules of meaning.
  *   **Strength:** This validates the "way of life" comment you already made, but gives it rigorous philosophical grounding. It explains why the *practice* comes before the *belief*.

  ***

  ### The Strongest Option: The Wittgensteinian "Form of Life"

  I recommend the third option, specifically refined through what is sometimes called **Non-Realist Theism** or **Religious Naturalism**. This approach dismantles your friend's dichotomy by showing that his definition of "existence" and "truth" is too small to cover the territory of human experience.

  Here is how you can articulate this position to your friend, breaking down exactly where his argument fails and what your alternative looks like.

  #### 1. Where Your Friend's Picture Goes Wrong: The Category Mistake
  Your friend presents a dilemma: *Either* God is an object in the universe (factual claim), *or* God is a projection of feelings (emotive claim).

  The philosophical error here is assuming that "existence" only means "spatiotemporal existence."
  *   **The Table:** A table exists in space and time. It can be measured.
  *   **The Law:** Does "The Law" exist? You can't find "The Law" in a test tube. But if you run a red light, the consequences are real. "The Law" exists as a **normative reality**, not a physical one.
  *   **Love:** Does "Love" exist? You can point to brain chemistry, but the *meaning* of love isn't in the neurons. It exists in the relationship and the commitment.

  Your friend insists religious claims must be about **objects** (supernatural beings). You are arguing they are about **values and commitments**. When you say "God exists," you are not saying "There is a bearded man in the sky." You are saying, "There is an objective demand on my life to be holy/just/connected."

  By forcing you to choose between "Scientific Fact" and "Emotional Cheerleading," your friend ignores the entire realm of **Normative Truth** (truths about how we *ought* to live, which are real but not physical).

  #### 2. Reframing "Truth": Correspondence vs. Disclosure
  Your friend believes in the **Correspondence Theory of Truth**: A statement is true if it corresponds to a fact in the world. ("The cat is on the mat" is true if the cat is on the mat).

  In your practice, religious truth works more like **Disclosure** or **Coherence**.
  *   **Disclosure:** A poem or a piece of music can be "true" without being a factual report. It reveals something about the world that was hidden. When you pray on the High Holidays, the "truth" of the prayer is found in its ability to *disclose* your own mortality, your need for forgiveness, or your connection to your ancestors. If the prayer succeeds in making you feel that connection, it has achieved a kind of truth that a scientific statement cannot.
  *   **Coherence:** A move in chess is "good" not because it matches a physical object, but because it coheres with the rules and strategy of the game. Your keeping of food rules is "true" because it coheres with the form of life you are participating in.

  #### 3. Reframing Practice: Not Play-Acting, but *Training*
  This is the most crucial point regarding your friend's accusation of "play-acting." He thinks belief (mental assent to a fact) must precede practice.
  *   **His View:** I must believe the Coach is watching -> Therefore I train hard.
  *   **Your View:** I train hard -> Therefore I become an Athlete.

  In philosophy of religion, this is often linked to the concept of **embodied cognition**. We don't just think our way into a way of life; we act our way into it.
  *   When you stand for the *Kaddish*, you aren't pretending a ghost is listening. You are physically enacting respect for the dead and solidarity with the mourners.
  *   When you keep kosher, you aren't avoiding a supernatural punishment. You are disciplining your appetites and marking your body as part of a specific covenant.

  This isn't play-acting. A soldier saluting a flag isn't "play-acting" patriotism; they are *embodying* it. The action *is* the belief, not the result of it. If you wait until you "believe" the facts before you act, you will never act. The practice grounds the commitment.

  #### 4. So, What Are You Praying To?
  If there is no supernatural person, what does prayer mean?
  In this framework, prayer is **addressivity without a recipient.**
  *   It is the act of organizing your desires and regrets before the "Ideal Observer" or the "Sum of Value."
  *   By speaking *as if* you are being heard, you hold yourself accountable in a way you wouldn't if you were just thinking silently.
  *   The "God" you are addressing is the personification of the moral claim the universe makes on you.

  ### How to Explain This to Your Friend
  You might say something like this:

  > "You're assuming that for my practice to be sincere, I have to believe in God the same way I believe in a chair. But that's a category mistake. I don't believe in 'Justice' or 'Love' the way I believe in a chair, but they are real, and they make claims on me.
  >
  > When I pray, I'm not transmitting data to a supernatural server. I'm aligning myself with a tradition of value. The 'truth' of the prayer isn't in whether a being heard it; the truth is in whether it changes *me*.
  >
  > You say it's play-acting. I say it's training. A pianist practices scales not because they believe the scales are 'real' in a factual sense, but because the practice makes them a musician. My prayers and food rules are the scales. They train me to live a certain kind of life. That's not incoherent; it's just a different kind of reality than the one you're measuring."

  ### Summary
  Your friend is trapped in **Cognitivism** (religious statements are facts) vs. **Emotivism** (religious statements are feelings).
  You are occupying the space of **Non-Realist Theism** within a **Form of Life**.

  *   **Is it factual?** No.
  *   **Is it merely emotional?** No.
  *   **Is it coherent?** Yes, because it recognizes that human beings live in a world of *meaning*, not just a world of *matter*.

  You are not trying to have it both ways. You are refusing to accept the board on which the game is being played. And philosophically, you are on solid ground.
