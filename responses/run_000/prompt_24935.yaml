answer: |-
  Here is the committed answer you asked for.

  **Yes, your intuition is coherent.** There are situations in human life where moral obligations collide so violently that no available action leaves your moral record clean. This is not a failure of your reasoning; it is a feature of a complex moral world. Philosophers call this a **genuine moral dilemma** or a **tragic choice**. In these cases, you are not choosing between "right" and "wrong"; you are choosing between two wrongs, or between a right action that incurs a moral debt.

  However, acknowledging that a dilemma is tragic does not mean you are paralyzed. It means you must choose the **necessary wrong** to prevent a greater catastrophe, and then you must bear the weight of that choice without trying to rationalize it away.

  Here is the breakdown of your situation, the decision you must make, and how to live with it.

  ### 1. The Philosophical Reality: Moral Residue
  You asked if it is possible that *whatever you do, you will have done something you shouldn't.* The answer is yes.

  If you keep the secret, you violate your duty of care to the wife, allowing her to suffer irreversible harm based on a lie you helped sustain.
  If you break the secret, you violate your duty of fidelity to the husband, breaking an explicit vow.

  In many ethical frameworks (particularly those influenced by Bernard Williams or W.D. Ross), obligations are plural and sometimes incommensurable. When they conflict, one does not simply cancel out the other. If you choose to warn the wife, you have done the *best available thing*, but you have still broken a promise. That broken promise leaves **moral residue**. You are right to feel that you will have done something "wrong" (breaking a confidence), even if it was the *right thing to do* (preventing harm).

  If you felt no guilt after making this choice, *that* would be a sign of moral deficiency. Your anguish is proof of your moral integrity, not a sign of confusion.

  ### 2. The Decision: You Must Tell Her
  You asked what you should do. **You must warn your friend, the wife.**

  Here is why this is the only defensible path, even though it involves a moral violation:

  **A. The Asymmetry of Harm**
  The stakes are not equal.
  *   **Husband's Harm:** If you tell, the husband loses the element of surprise and control over his narrative. He may be embarrassed, angry, and he will likely end your friendship. This is significant, but it is not life-altering.
  *   **Wife's Harm:** If you stay silent, she quits a tenure-track job. This is a rare, high-stakes career achievement. She moves across the country. She uproots her life. She does this based on a premise (the marriage) that is already dead. The harm here is catastrophic, irreversible, and fundamentally violates her autonomy. She is being manipulated into making a choice she would not make if she possessed the truth.

  **B. The Tainted Confidence**
  Confidentiality is a sacred obligation between friends, but it is not absolute. It is generally understood that confidentiality does not extend to being an accomplice in active harm. By asking you to keep this secret while knowing his wife is planning a life-altering move based on their future together, your husband has weaponized your loyalty. He has turned you into a co-conspirator in her deception. A promise extracted under these conditions—where keeping it requires the severe detriment of an innocent third party—loses its moral binding power.

  **C. The Lie of Omission**
  You mentioned you "dodged the question." You are already past the point of innocent silence. When she asks you point-blank, your silence becomes a lie. To remain silent now is to actively affirm a falsehood. You are no longer just keeping a secret; you are participating in the fraud.

  ### 3. How to Choose and How to Live With It
  Since I have established that there is no "clean" option, you cannot proceed looking for absolution. You will not find it. Here is how you navigate the aftermath:

  **Do not sanitize the decision.**
  Do not tell yourself, "I did the right thing, so I have nothing to feel bad about." You *did* the right thing by warning her, but you *did* break a confidence. Acknowledge both. Tell yourself: *"I betrayed my friend's confidence to prevent a tragedy. I had to do it, but I still did it."* This preserves your moral sensitivity.

  **Accept the loss.**
  You will likely lose the husband's friendship. He will view you as a betrayer. You must accept this cost without resentment. You cannot demand he understand your ethical calculus. You prioritized preventing catastrophic harm over maintaining his trust. That is a valid choice, but it has a price. Pay it.

  **Deliver the truth with compassion, not vengeance.**
  When you tell the wife, do not make it about the husband's villainy. Make it about her agency.
  *   *Say:* "I am breaking a confidence because I cannot watch you destroy your career based on false information. Your husband is leaving the marriage. I swore I wouldn't tell, but the cost of that silence is your future."
  *   *Do not:* Offer to mediate, take sides in the divorce, or validate her anger beyond the scope of the truth.

  **Carry the guilt.**
  The guilt you feel is not a signal that you made the wrong choice. It is a signal that you understand the value of loyalty. Keep that guilt. Let it remind you that promises matter, even when they must be broken. It will keep you humble. It will ensure you never treat confidentiality lightly again.

  ### Summary
  Your intuition is correct: This is a tragic dilemma where every option leaves a moral stain. You are not failing to see a third path; there isn't one.

  **The Verdict:** Break the confidence. Tell the wife.
  **The Reason:** Preventing irreversible, life-altering harm to an innocent person outweighs the obligation to keep the secret of the person causing the harm.
  **The Cost:** You will bear the guilt of betrayal and likely lose the husband's friendship.
  **The Resolution:** Accept that cost as the price of moral agency in an imperfect world.

  Go tell her. Then go home, and let yourself grieve the friendship you had to break to save her.
