      *   *Decision:* I will argue that ambiguity aversion is **rational**. Why? Because the Ellsberg setup, while presented as a sterile math problem, triggers heuristics designed for a social and adversarial world. Pure logical consistency in a vacuum is less valuable than robust decision-making in reality. The "mistake" lies in applying abstract axioms to human cognition, not in the cognition itself.

