          *   If you can be pumped for money based on inconsistent preferences, you're irrational.
          *   In a truly random setup (like a computer generating the ratio), the expected value is mathematically identical (50/50 on average).
          *   Emotions (fear of unknown) overriding logic.

      *   *Side 2: It's Rational (Adaptive/Pragmatic).*
          *   *Knightian Uncertainty:* Distinction between risk (known probs) and uncertainty (unknown probs).
          *   *Adversarial Context:* In the real world, unknown distributions often imply an adversary (a casino, a market maker, a con artist). If someone offers you a bet on an unknown urn, they probably know the contents.
          *   *Information Value:* Choosing the known urn preserves the option to learn or avoids the cost of gathering info.
