      *   *Contradiction:* If $P(Red_A) > P(Red_B)$ and $P(Black_A) > P(Black_B)$, then $P(Red_A) + P(Black_A) > P(Red_B) + P(Black_B)$. Since $P(Red_A) + P(Black_A) = 1$, this implies $1 > 1$, which is impossible under Savage's axioms.
      *   *Implication:* Violates Subjective Expected Utility (SEU) theory.

  3.  **Brainstorming Arguments:**

      *   *Side 1: It's a Bias (Irrational).*
