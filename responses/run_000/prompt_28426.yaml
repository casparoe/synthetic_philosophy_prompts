      *Let's ensure the "Unpopular" result is clear.* The procedure will likely suggest that Case A and Case B warrant the same *supervision requirements* because the risk of recurrence is identical. Panels often want to revoke A and warn B. I will make sure the procedure pushes back on that.

      *Final Sentence:* "Sanctions must punish the choice, not the chance." (Or something similar).

      Let's draft.

