prompt: |-
  I'm a TA for a second-year philosophy of mind module, and next week I've got one fifty-minute section (about twenty students) to teach Dennett's Orwellian/Stalinesque distinction about the timing of conscious experience. I don't want an explanation of the distinction itself; I want a plan for how I should teach it. The students have already seen the colour phi demo, and I suspect they'll come away thinking the only live question is whether the brain 'fills in' the gap, and that the Orwellian and Stalinesque stories are really just two ways of describing the same thing. What order should the pieces go in so the difference between the two models feels like a genuine difference rather than a verbal one? What one example should carry the session (and if it shouldn't be colour phi, why not)? What misconceptions should I expect, and where in the sequence should I head each off? Give me one question to end on that would show whether they've actually got the distinction rather than just the labels. Also tell me what I should openly refuse to settle at this level. And please write the whole plan in British English.
