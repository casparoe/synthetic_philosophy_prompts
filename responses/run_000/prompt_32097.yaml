      *   **Task:** Teach Dennett's Orwellian/Stalinesque distinction (timing of conscious experience).
      *   **Duration:** 50 minutes.
      *   **Class Size:** ~20 students.
      *   **Constraint 1:** Do *not* explain the distinction itself (assume I know it, focus on pedagogy).
      *   **Constraint 2:** Students have seen the Colour Phi Phenomenon.
      *   **Constraint 3:** Anticipated Student Misconception: They think it's just about "filling in" and that the two models are verbally equivalent (same thing, different description).
      *   **Goal:** Make the difference feel *genuine* (metaphysical/empirical), not merely verbal.
      *   **Requirements:**
          *   Sequence/Order of activities.
          *   One core example (Colour Phi or otherwise?).
          *   Anticipated misconceptions & where to head them off.
          *   One final assessment question.
          *   What *not* to settle (limitations of the session).
          *   **Language:** British English (e.g., "colour", "programme", "realise", "modelling").

  2.  **Deconstruct the Core Problem:**
      *   *The Trap:* Students often think Orwellian (memory revision) vs. Stalinesque (pre-conscious editing) is just a "where do we draw the line" issue. If the output is the same, what's the difference?
      *   *Dennett's Point:* It's not just about location; it's about the *Cartesian Theatre* assumption. The distinction collapses if you reject the Theatre. But to teach the distinction, you first have to make them feel the tension *within* the Theatre framework before pulling the rug out (or at least showing why the distinction matters for empirical investigation).
      *   *The Challenge:* How to make them care about the difference without getting bogged down in neurobiology they don't know, or dismissing it as semantics.
      *   *Strategy:* Move away from Colour Phi slightly (or use it differently) because they are already fixated on the "filling in" aspect. A different example might reset their intuitions. However, Colour Phi is the canonical example. Maybe stick with it but change the *angle* of attack. Actually, the prompt asks "What one example should carry the session (and if it shouldn't be colour phi, why not)?". Given they've *already* seen it, using it again might reinforce their existing (flawed) intuition. A fresh example might be better to isolate the structural difference. *Decision:* Use a non-visual example or a modified version of Phi that emphasizes *reporting* vs. *experiencing*. Let's go with the **Cutaneous Rabbit Illusion**. It's tactile, distinct from vision, and relies heavily on temporal ordering, making the "when did it happen?" question sharper.
      *   *Wait, reconsider:* The prompt says they've *already seen* Colour Phi. If I switch to Cutaneous Rabbit, I spend 10 mins explaining a new phenomenon. If I stick with Colour Phi, I can dive deeper. The problem is their fixation on "filling in". The key to breaking the "verbal dispute" worry is to focus on **causal history** and **counterfactuals**.
      *   *Better Strategy:* Stick with Colour Phi (efficiency) but frame it through **intervention**. If we interrupt the brain at time $t$, what happens? That makes the difference empirical, not verbal.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (5 mins):** Acknowledge their intuition ("It feels like the same thing"). Validate it, then challenge it.
      *   **The Core Example (10 mins):** Revisit Colour Phi but strip away the "movie in the head" imagery. Focus on the *report*.
      *   **The Crucial Move (15 mins):** The "Interrogation" phase. How would we tell them apart? This addresses the "verbal dispute" worry. If they are empirically distinguishable, they aren't just verbal.
      *   **Dennett's Twist (10 mins):** Why does Dennett actually care? (The Cartesian Theatre). This is where we show why the distinction *collapses* ultimately, but why drawing it helps us see the mistake.
      *   **Conclusion/Assessment (10 mins):** The final question and wrap-up.

      *   *Refining the "Verbal Dispute" Objection:* The students think: "Same output = same story." I need to show that the *causal pathway* matters for science.
      *   *Misconceptions:*
          1.  "Consciousness is a single moment." (Head off early).
          2.  "It's just about memory accuracy." (Head off during the empirical test section).
          3.  "Dennett says there's no difference, so why are we learning it?" (Head off in the 'Twist' section).

      *   *The "One Question":* Needs to test if they understand the *structural* difference, not just the definition. Something about intervention or counterfactuals.

      *   *What not to settle:* The hard problem, the exact neural correlate, whether Dennett is ultimately right about eliminativism.

  4.  **Developing the Content (incorporating British English):**

      *   *Tone:* Professional, pedagogical, slightly informal (it's a section, not a lecture).
      *   *Spelling:* Colour, programme, realise, modelled, defence, etc.
      *   *Example Decision:* I will argue for sticking with **Colour Phi** but reframed. Why? Because switching examples risks confusion. The problem isn't the example; it's the *interpretation*. I need to show them how to *use* Colour Phi to distinguish the models, rather than just describing it.
      *   *Wait, actually:* The prompt asks "What one example should carry the session (and if it shouldn't be colour phi, why not)?". I should make a definitive choice. I think **Cutaneous Rabbit** is actually better for *this specific pedagogical goal*. Why? Because students have already "solved" Colour Phi in their heads ("oh, it's filling in"). A new example forces them to apply the *logic* of the distinction rather than recalling the *facts* of the illusion. It prevents them from relying on prior (potentially muddled) lecture notes.
      *   *Decision:* I will recommend the **Cutaneous Rabbit Illusion**. It allows for a clearer temporal sequence without the "visual cortex" baggage they might be conflating with Colour Phi.

      *   *Wait, second thought:* 50 minutes is very short. Explaining a new illusion takes time. Colour Phi is already done. The prompt says "I suspect they'll come away thinking...". This implies the lecture *just* happened. If I change the example, I risk them not grasping the phenomenon. If I keep Colour Phi, I can go deeper.
      *   *Compromise:* Use Colour Phi, but **gamify the discrimination**. Don't just describe it. Make them design the experiment that tells the difference.
      *   *Actually, looking at the prompt again:* "What one example should carry the session (and if it shouldn't be colour phi, why not)?" I need to answer this explicitly. I think I *should* switch. Why? Because their intuition about Colour Phi is already calcified ("it's filling in"). To break the "verbal dispute" intuition, we need a fresh case where they haven't pre-decided the mechanism.
      *   *Okay, final decision:* **The Cutaneous Rabbit Illusion.** It's tactile, temporal, and less likely to have been over-analysed in the main lecture than Colour Phi. It resets the board.

  5.  **Refining the Plan Steps:**

      *   **0-5 mins:** Hook. Acknowledge the "verbal dispute" worry. It's a good worry.
      *   **5-15 mins:** Introduce Cutaneous Rabbit. Establish the phenomenon.
      *   **15-30 mins:** The "Interrogation". Split class. Group A defends Orwellian, Group B defends Stalinesque. Task: Design an experiment to prove the other wrong. This makes the difference *empirical*.
      *   **30-40 mins:** Dennett's Punchline. If you can't design the experiment, why not? (Multiple Drafts).
      *   **40-50 mins:** Assessment & Wrap-up.

  6.  **Addressing Specific Constraints:**
      *   *British English:* Check spellings (realise, programme, colour, defence, modelling).
      *   *Misconceptions:* "It's just memory", "Consciousness is instantaneous", "Dennett denies consciousness".
      *   *What not to settle:* Neural correlates, the Hard Problem, whether qualia exist.
      *   *Final Question:* Needs to be about counterfactuals/intervention.

  7.  **Review against "Genuine Difference" Goal:**
      *   How do I ensure they don't think it's verbal? By forcing them to identify *causal consequences*. If Orwellian is true, early memory traces should exist. If Stalinesque is true, they shouldn't. If we can't measure that, is it science? This leads to Dennett's critique.
      *   *Correction:* To make the difference feel genuine *before* collapsing it, I need to show that *if* there is a Cartesian Theatre, the difference is massive. One is a lie (Orwell), one is a delay (Stalin).
      *   *Sequence:*
          1.  Validate the "same thing" worry.
          2.  Show why, *classically*, they are different (History of the representation).
          3.  Show why *empirically* they are hard to separate.
          4.  Show why Dennett thinks the question itself is flawed.

  8.  **Final Polish:** Check timing. 50 mins is tight. Keep the Cutaneous Rabbit explanation punchy. Ensure the group work is structured so it doesn't overrun.

