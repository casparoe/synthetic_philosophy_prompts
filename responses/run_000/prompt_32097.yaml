answer: |-
  **Session Plan: The Orwellian/Stalinesque Distinction**
  **Time:** 50 minutes
  **Students:** ~20 (2nd Year)
  **Goal:** Move students from viewing the distinction as a verbal dispute to understanding it as a question of causal history, before introducing Dennett's critique of the framework itself.

  ### 1. The Core Example: Why Not Colour Phi?
  **Stick with Colour Phi.**
  You might be tempted to switch to the Cutaneous Rabbit illusion to reset their intuitions. Resist this. You only have fifty minutes. Explaining a new phenomenon eats up valuable time and cognitive load. The problem isn't the example; it's the *interpretation*. They think Colour Phi is 'just filling in'. Your job is to show them that 'filling in' is exactly where the battle lies. By re-using the example they already know, you force them to look deeper at the mechanism they think they understand.

  ### 2. Sequence of Play (50 Minutes)

  **00:00 – 05:00: The Hook & The Worry**
  *   **Action:** Write "Orwellian vs. Stalinesque" on the board. Underneath, write: *"Is this a real difference or just a verbal dispute?"*
  *   **Script:** Acknowledge their intuition immediately. "Many of you left the lecture thinking these are just two labels for the same outcome: the subject reports seeing motion. If the report is the same, what difference does the story make?"
  *   **Goal:** Validate their scepticism. If you don't, they will spend the whole session secretly thinking you're splitting hairs. Tell them that if it *were* just verbal, Dennett wouldn't bother with it. The distinction is a tool to probe the **causal history** of a report, not just the report itself.

  **05:00 – 15:00: Re-framing Colour Phi (The Causal History)**
  *   **Action:** Draw a timeline on the board. Mark $t_1$ (Red flash), $t_2$ (Green flash), and $t_3$ (Report).
  *   **Activity:** Ask two volunteers to come to the board.
      *   **Student A (Stalinesque):** Must draw where the 'conscious experience' is finished before $t_3$. (They will likely draw a 'finish line' before the report).
      *   **Student B (Orwellian):** Must draw where the 'conscious experience' is finished. (They should indicate the experience is revised *after* the initial registration, closer to $t_3$).
  *   **Crucial Intervention:** Stop them from drawing 'screens' or 'theatres'. Force them to label **memory traces**.
      *   *Stalinesque:* There is a false memory trace created *before* consciousness.
      *   *Orwellian:* There is a true trace that gets overwritten *after* consciousness.
  *   **Point to drive home:** The difference isn't what the subject *says* now; it's what neural traces *existed* five minutes ago that are now gone. This makes it a factual, empirical claim about brain states, not just semantics.

  **15:00 – 30:00: The Interrogation (Group Work)**
  *   **Action:** Split the room into two halves. Left side = Team Stalin; Right side = Team Orwell.
  *   **Task:** "You are neuroscientists. You have a scanner that can freeze the brain at any millisecond. Design an intervention at time $t_{1.5}$ (between the flashes and the report) that would prove your team right and the other team wrong."
  *   **Misconception Head-off:** Students will suggest asking the subject what they see. **Stop this.** The subject cannot know; that's the point. They must propose a physical intervention (e.g., magnetic stimulation, disrupting memory consolidation).
  *   **Expected Outcome:** They will struggle. Team Stalin needs to find a 'finished' representation early on. Team Orwell needs to find an 'unfinished' one that gets revised later.
  *   **Debrief:** Bring them back. Ask: "Why was that difficult?"
      *   *Answer:* Because we lack access to the 'private showing' in the Cartesian Theatre. This difficulty is the bridge to Dennett's actual point.

  **30:00 – 40:00: Dennett's Punchline (Multiple Drafts)**
  *   **Lecture:** Now explain *why* the interrogation failed. It's not because our technology is poor; it's because the question presupposes a **Cartesian Theatre**.
  *   **Concept:** There is no single $t$ where experience becomes 'conscious'. There are only various drafts of narrative fragments.
  *   **Key Distinction:** The Orwellian/Stalinesque distinction is useful *only* to show up the absurdity of the Theatre. Once you accept Multiple Drafts, the distinction dissolves. But you have to understand the distinction to see *why* it dissolves.
  *   **Misconception Head-off:** Students often think Dennett is saying "consciousness doesn't exist". Clarify: He is saying "consciousness isn't a *moment* or a *place*." He is an eliminativist about the *Cartesian Theatre*, not about experience itself.

  **40:00 – 45:00: The Assessment Question**
  *   **Action:** Put this question on the screen/board. Give them 3 minutes to write a short answer, then discuss.
  *   **The Question:**
      > "Suppose we could stimulate the subject's brain at the exact moment of the green flash ($t_2$) to disrupt memory consolidation.
      >
      > If the **Stalinesque** model is true, what happens to their report?
      > If the **Orwellian** model is true, what happens to their report?
      >
      > If the reports are identical in both cases, what does that imply about the distinction?"
  *   **What you're looking for:**
      *   *Stalin:* Disruption might not matter if the 'show' was already finished before $t_2$ processing completed. Or, the false representation is already fixed.
      *   *Orwell:* Disruption prevents the revision. They might report seeing only red, or no motion, because the 'fix' never happened.
      *   *Implication:* If the reports are identical regardless, the distinction has no empirical cash value, supporting Dennett's view that the question is ill-posed.

  **45:00 – 50:00: Wrap-up & What We Are Not Settling**
  *   **Action:** Briefly outline the limits of today's session.
  *   **What to refuse to settle:**
      1.  **The Neural Correlate:** Do not let them leave thinking we know *where* in the brain this happens. We don't.
      2.  **The Hard Problem:** Make it clear this is about the *timing* and *structure* of access, not why it feels like something to be the subject.
      3.  **The 'Truth' of Phi:** Do not confirm whether Phi is actually Orwellian or Stalinesque. The point is that asking the question reveals the flaw in our framework.

  ### 3. Anticipated Misconceptions & Interventions

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Orwellian means the subject is lying."** | During the timeline activity (05:00). | Clarify immediately: "This is unconscious revision. The subject is being honest; their memory has been edited without their knowledge." |
  | **"It's just about memory accuracy."** | During the Interrogation (15:00). | Remind them: "Memory is all we have. The question is when the 'experience' was fixed relative to the memory trace. Don't treat memory as a separate storage bin; it's part of the constructive process." |
  | **"Dennett says there's no consciousness."** | During the Punchline (30:00). | Use the phrase: "He is denying the *audience* in the theatre, not the *play*." |
  | **"It's a verbal dispute."** | Throughout (especially 00:00). | Keep returning to **counterfactuals**. "If we cut the wire here, would the output change?" If the answer differs between models, it's not verbal. |

  ### 4. Pedagogical Notes for the TA
  *   **Pacing:** The Group Interrogation (15:00–30:00) is the engine of this session. If they get stuck, prompt them with: "Does the brain need time to write the story?" Don't let them sit in silence for more than 2 minutes.
  *   **Tone:** Keep it investigative. You are not the authority on the 'truth' of the brain; you are guiding them through Dennett's argument. It is perfectly fine to say, "Dennett thinks this question is a trap. Let's see if we can spot the bars of the cage."
  *   **British English Check:** Ensure you spell *colour, programme, realise, modelling, defence, centre* correctly in any handouts or board work. Use "whilst" or "while" naturally, and avoid Americanisms like "gotten" or "fall semester".

  ### 5. Why This Plan Works
  This sequence respects their intelligence by acknowledging their scepticism (the "verbal dispute" worry) rather than bulldozing it. By forcing them to design an empirical test, you demonstrate that the distinction *would* be real if the Cartesian Theatre were real. This makes Dennett's subsequent dissolution of the distinction land much harder: they realise the distinction isn't useless, but rather that it is a *reductio ad absurdum* of the traditional view of consciousness.
