      *(Refining the Final Question)*: "If we could freeze the brain at t=100ms, what would we find?" -> Too technical. "If the subject is interrupted mid-experience..." -> Better. Let's go with an interruption scenario.

      *(Refining British English)*: Ensure "programme", "realise", "modelling", "centre", "defence".

      *(Refining the Example Choice)*: I will argue for **Cutaneous Rabbit**. It avoids the "visual filling-in" baggage.

      *(Refining Misconceptions)*:
      1.  That 'Orwellian' means 'lying'. (It's unconscious revision).
      2.  That 'Stalinesque' implies a little man watching. (It implies a definite finish line).
      3.  That the distinction is purely about *timing*. (It's about *processing history*).

      *(Refining What Not to Settle)*: Don't solve the Hard Problem. Don't decide which model is true for Phi. Don't settle the neural basis.

