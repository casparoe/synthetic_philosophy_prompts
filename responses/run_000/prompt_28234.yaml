answer: |-
  Your hypothesis that the debate is partly verbal—rooted in divergent definitions of *xing*—is the standard scholarly consensus (often associated with A.C. Graham), and it is correct as far as it goes. Mencius does treat *xing* teleologically (the nature of a thing is its ideal flourishing), while Xunzi treats it materially (the nature of a thing is its unprocessed raw state). However, diagnosing the dispute as *merely* verbal is indeed too deflationary. It obscures a deeper, substantive clash regarding moral psychology and the ontology of value.

  The dispute is not primarily about the definition of a word, nor is it a resolvable empirical question about the behavior of infants. It is a **substantive disagreement about the continuity between natural inclination and moral normativity.**

  ### The Substantive Core: Continuity vs. Discontinuity

  If the debate were only verbal, Mencius and Xunzi would agree on the psychological mechanics of becoming good, differing only on whether to label the starting point "good" or "bad." They do not. They disagree on the *source* of moral motivation and the *phenomenology* of virtue.

  **1. The Source of Normativity (Internal Resonance vs. External Construction)**
  For Mencius, moral norms are discoveries. When we feel compassion at the sight of a child falling into a well, we are encountering a normative demand that arises from within our own constitution. The "ought" is latent in the "is." Cultivation is the removal of obstacles so this internal resonance can sound clearly.
  For Xunzi, moral norms are inventions. The sage kings created ritual (*li*) and righteousness (*yi*) because human desires, if unchecked, lead to mutual destruction. The "ought" is imposed upon the "is" to prevent catastrophe. Cultivation is the internalization of an external standard that does not naturally belong to us.

  **2. The Phenomenology of Sagehood (Comfort vs. Mastery)**
  This leads to a tangible difference in what the ideal moral life feels like.
  *   **Mencius:** For the sage, moral action is spontaneous and effortless (*wu wei* in a sense). Because virtue is the flowering of nature, the fully cultivated person does not feel constrained by morality; they feel most "themselves" when acting virtuously. Alienation from morality is a sign of self-harm.
  *   **Xunzi:** For the sage, moral action is the result of accumulated effort and conscious attention. Even the sage must maintain vigilance. Virtue is a triumph over nature, not an expression of it. There is always a potential tension between what one desires and what ritual requires.

  This is not a semantic quibble. It is a disagreement about whether morality is ultimately **congenial** to human psychology (Mencius) or **counter-natural** but necessary (Xunzi).

  ### Why It Is Not an Empirical Question

  You ask if this is a hidden empirical question about the untaught child. It cannot be, because both philosophers observe the same empirical data but interpret it through incompatible theoretical frameworks.

  Both agree that an untaught person will grab food when hungry and fight over resources.
  *   **Xunzi** points to the grabbing and fighting and says: "This is the raw material. Left alone, this is what happens. Therefore, nature is bad."
  *   **Mencius** points to the same grabbing but adds: "Watch what happens when that child sees another suffer. They feel alarm. This reaction is not taught, nor is it for profit. This spontaneous reaction is the *root*. The grabbing is merely the branch obstructed by hunger."

  Mencius privileges the *reactive* moral sentiment as the true indicator of *xing*, while Xunzi privileges the *proactive* survival drive. There is no neutral empirical arbiter here because selecting which behavior counts as "nature" is already a normative choice. To ask "What is the untaught child really like?" presupposes we know which behaviors are essential and which are accidental. Mencius and Xunzi disagree on the metaphysics of the self, not the biology of the child.

  ### Diagnosis: A Clash of Ethical Paradigms

  The debate persists because *xing* is not a thin descriptive concept (like "DNA"); it is a **thick ethical concept**. To make a claim about *xing* is to make a claim about how we should live.

  *   **Mencius's wager:** If we tell people their nature is good, they will have confidence in their capacity for virtue and view moral failure as a loss of self. This encourages moral autonomy.
  *   **Xunzi's wager:** If we tell people their nature is bad, they will remain humble, respect authority and ritual, and understand that moral order is fragile and requires constant maintenance. This encourages social discipline.

  The disagreement is substantive because these two wagers produce different educational practices, political theories, and self-conceptions. A Mencian pedagogy focuses on *eliciting* and *encouraging* (like a gardener). A Xunzian pedagogy focuses on *training* and *correcting* (like a carpenter). You cannot simply say "they are both right" without losing the specific practical implications of each approach.

  ### What Counts as Progress?

  Given this diagnosis, an empirical finding (e.g., evolutionary psychology showing altruism is adaptive) would not resolve the debate, as both sides could co-opt the data. A simple conceptual distinction (e.g., "Mencius means telos, Xunzi means material") has already been made and has not ended the debate, because the substantive stakes remain.

  **Progress requires a reformulation of the question.**

  We should retire the question "Is human nature good or bad?" as an ontological puzzle waiting for a solution. Instead, we should treat the debate as a **dialectic regarding the relationship between spontaneity and structure in moral life.**

  Progress looks like this:
  1.  **Acknowledge the Normative Function:** Recognize that claims about *xing* are proposals for how to organize moral psychology, not descriptions of biological facts.
  2.  **Integrate the Insights:** A robust contemporary theory of moral cultivation likely needs *both* models. We need the Xunzian insight that social norms often require us to curb immediate selfish impulses (the "raw material" problem). But we also need the Mencian insight that if morality is experienced *only* as external constraint, it leads to burnout, hypocrisy, or rebellion (the "telos" problem).
  3.  **Shift the Inquiry:** Ask not "Which view is true?" but "Under what conditions does a Mencian model of moral motivation work better, and when is a Xunzian model required?"
      *   *Example:* In early childhood education, does one assume innate empathy (Mencius) or the need for habituation (Xunzi)? The answer is likely context-dependent.

  ### Conclusion

  The debate is **substantive**, not verbal, because it concerns the **continuity of moral motivation**. Mencius argues for a continuum between desire and duty; Xunzi argues for a discontinuity that must be bridged by artifice.

  To join this debate today is not to pick a side on the metaphysics of human nature, but to decide where one locates the authority of morality. Is the authority of the good found in our deepest spontaneous reactions (Mencius), or in the accumulated wisdom of social structures that constrain those reactions (Xunzi)? Progress lies in abandoning the hope that one side can refute the other, and instead using the tension to illuminate the dual requirements of moral life: the need for internal resonance and the need for external structure. The question is not ill-posed, but it is **category-mistaken** if treated as empirical anthropology; it is properly understood as **competing ethical phenomenology.**
