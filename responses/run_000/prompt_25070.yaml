answer: |-
  # Q&A Prep Sheet: Defending the Equation via Non-Propositionalism

  **Strategy Note:** Your core vulnerability is the **Frege-Geach problem** (embeddings/logic) and **Formal Coherence** (probability domains). Your core strength is avoiding triviality without tweaking the probability calculus. Do not get dragged into defending a specific pragmatic mechanism unless you have to; keep the focus on the *motivation* (saving the Equation).

  ---

  ### 1. The "Domain of the Probability Function" Objection
  **Who:** The Bayesian Statistician & The Computer Scientist (Probabilistic Programming)
  **Phrasing:** "You say conditionals aren't propositions, so they aren't events in a sigma-algebra. But probability functions are defined over algebras of events. If $A \to C$ isn't an event, what exactly is $P(A \to C)$ measuring? If you say it's just $P(C|A)$, aren't you just changing the notation? And if you want to use these in a probabilistic program as random variables, how do I sample from a non-event?"

  **2-Minute Reply:**
  "You're right that standard Kolmogorov probability requires a Boolean algebra. That's exactly why Lewis's result is a *reductio* of the assumption that conditionals are propositions within that algebra. My claim isn't that we change the probability calculus, but that we recognize the Equation describes a *constraint* on credences, not the probability of a specific object.
  To the computer scientist: You don't sample the conditional itself. You sample the antecedent. If $A$ is true, you sample $C$. The 'probability of the conditional' is a shorthand for the disposition of your credence function under the supposition of $A$. We can model this using Popper functions or Adams' probability logic, which take conditionals as primitive rather than deriving them from event probabilities. It's not just notation; it's a claim about the architecture of belief."

  **Weakness:** This admits you need a non-standard probability framework (Popper/Adams). If the audience is committed to Kolmogorov as the *only* legitimate probability theory, you look like you're changing the rules to save the phenomenon.

  ---

  ### 2. The "Restrictor Redundancy" Objection
  **Who:** The Restrictor Theorist (Philosophy of Language)
  **Phrasing:** "Kratzer already showed us how to save the Equation without going expressivist. We treat 'if' as a restrictor on a covert modal operator. The conditional doesn't express a proposition on its own, but the whole sentence does. Why is your expressivist account preferable to the restrictor view? It seems you're positing a pragmatic illusion where a semantic solution suffices."

  **2-Minute Reply:**
  "The restrictor view is a strong competitor, but it still commits you to truth conditions for the *matrix* clause containing the modal. It saves the Equation by making the conditional part of the quantifier structure, not the connective.
  My view is preferable because it generalizes better to cases without obvious modals. When I say 'If it rains, the match is cancelled,' there isn't always a covert 'must' or 'might' plausibly present. The restrictor view has to posit hidden syntax to get truth conditions. My view accepts the surface grammar is misleading: there is no proposition expressed, full stop. We don't need to find a hidden modal to bear the truth value; we just acknowledge that we are updating conditional credences, not describing modal facts."

  **Weakness:** The restrictor view is the dominant paradigm in formal semantics. Claiming there are "no hidden modals" is empirically risky if linguists find syntactic evidence for them. You risk looking like you're ignoring semantic data.

  ---

  ### 3. The "Three-Valued Despair" Objection
  **Who:** The Three-Valued Logician
  **Phrasing:** "You call non-propositionalism the only way out of triviality, but that's a counsel of despair. De Finetti and Reichenbach showed we can use three-valued truth tables (True, False, Void). If $A$ is false, the conditional is void. We can define probabilities over these values without triviality. Why abandon truth values entirely rather than just adding a third one?"

  **2-Minute Reply:**
  "Three-valued logics are mathematically elegant, but they struggle with *embeddings*. What is the truth value of $\neg(A \to C)$ if $A \to C$ is 'Void'? If you say 'True', you lose the Equation. If you say 'Void', you lose classical negation.
  My expressivist account handles this by treating negation as a rejection of the conditional commitment, not a truth-functional operator on a 'Void' value. More importantly, triviality proofs often resurrect even in three-valued systems if you assume the probability of the conditional is the probability of it being True. By denying truth conditions altogether, I don't need to tweak the truth tables; I just deny the question 'Is it true?' applies in the standard way."

  **Weakness:** Three-valued logic has made significant technical progress recently (e.g., by Cantwell, Égré). Dismissing it as "struggling with embeddings" might seem outdated if they cite recent dynamic semantic updates.

  ---

  ### 4. The "Stalnakerian Content" Objection
  **Who:** The Committed Stalnakerian
  **Phrasing:** "I accept the Equation. I also accept possible worlds. Stalnaker's selection function semantics validates the Equation without giving up propositions. Why should I abandon the idea that conditionals have truth conditions? It explains disagreement and embedding perfectly well. Your view seems to solve a problem that doesn't exist for me."

  **2-Minute Reply:**
  "Stalnaker's semantics validates the Equation only if you restrict the probability function over worlds in a specific way that violates the Principle of Independence. Lewis's triviality proof shows you cannot have *both* standard probability theory *and* Stalnaker's truth conditions for *all* probability functions.
  To maintain Stalnaker's view, you have to say that rational agents cannot have certain coherent credence distributions over worlds. My view allows any coherent credence distribution over worlds; it just says the conditional isn't one of the things you're distributing credence *over*. I save the rationality of the agent; you save the proposition. I think saving the rationality constraints is more important."

  **Weakness:** Stalnakerians often bite the bullet on the probability restrictions. If they think those restrictions are plausible constraints on rationality, your "advantage" disappears.

  ---

  ### 5. The "Category Mistake" Objection
  **Who:** The Senior Philosopher
  **Phrasing:** "This whole debate feels like a confusion. You're treating a linguistic device as if it were a metaphysical object. Of course conditionals aren't 'things' with truth values. But why write a theory about it? Just use them. Isn't this just verbal dispute about the word 'proposition'?"

  **2-Minute Reply:**
  "It's not verbal. The stakes are normative. If conditionals are propositions, then believing them is subject to norms of truth. If they are expressions of conditional credence, they are subject to norms of coherence and updating.
  This matters for epistemology. If I believe a false proposition, I'm mistaken. If I hold an incoherent conditional credence, I'm irrational. Lewis's result shows we can't have both truth-aptness and the Equation. Deciding which to drop changes how we model rational inference. It's not just labeling; it's about the structure of rational thought."

  **Weakness:** There is a grain of truth here. If your pragmatic story isn't fleshed out, this can sound like you're making a mountain out of a molehill.

  ---

  ### 🚩 The "Hope Nobody Asks" Question
  **Who:** Likely the Grad Students or the Bayesian (after a coffee)
  **Phrasing:** "Okay, suppose I say 'If it rains, the match is cancelled,' and you say 'No, that's not right.' We are clearly disagreeing. If you aren't asserting a proposition, what am I denying? And if I bet you $10 on that conditional, and it rains and the match is *not* cancelled, I expect to win the bet. Doesn't betting behavior prove we treat them as truth-apt propositions in practice, regardless of your theory?"

  **Why it's dangerous:** This hits the **Frege-Geach problem** in its most practical form (Assertion and Betting). If your theory can't explain why we bet on conditionals or disagree about them, it fails to capture the data.
  **Prep:** You must argue that betting on a conditional is betting on the *consequent given the antecedent*, not the whole sentence. Disagreement is a clash of conditional commitments, not truth values.
  **Weakness:** This is the hardest part of expressivism. Your explanation will sound more complex than the simple "I bet it's true" story.

  ---

  ### ⚠️ Preemptive Concession
  **Concede this:** Do not try to argue that conditionals *never* behave like propositions in natural language.
  **Why:** The data is against you. We negate them, embed them in disjunctions, and use them as premises.
  **Strategy:** Say this explicitly in your talk: *"I concede that conditionals behave syntactically like propositions. My claim is that this is a pragmatic illusion or a useful fiction for communication, not a reflection of their semantic content. I am not denying the linguistic data; I am offering a non-truth-conditional explanation of it."*
  **Benefit:** This disarms the 3-valued logician and the Stalnakerian who want to point to embedding data. It shows you aren't ignoring the problem, but re-interpreting it.
