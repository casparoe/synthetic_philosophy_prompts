      *   *Correction on Masks:* Ensure the distinction is clear. A mask is usually external (foam), but can be internal (a second disposition conflicting). The key is the basis remains.
      *   *Lewis's Contribution:* David Lewis's 1997 paper "Finkish Dispositions" is the landmark here. He proposed the "Reformed Conditional Analysis." I must mention Lewis, but clarify that his solution is *not* universally accepted (it's part of the contested landscape).
      *   *Settled vs. Contested:*
          *   Settled: SCA is inadequate. Finks and Masks are distinct problems.
          *   Contested: Whether dispositions are reducible to *any* conditionals, or whether they are sui generis powers. Whether Lewis's fix works.

