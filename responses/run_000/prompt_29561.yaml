          *   Pattern 2: **Masking** (or "Masks"). Often associated with Johnston (1992) or Martin.
          *   *Note:* There is also "Mimicking" (where something breaks but isn't fragile), but the user didn't ask about that. Stick to their two patterns.

      *   **Question 2: Are they importantly different?**
          *   Yes.
          *   *Finks* affect the *intrinsic basis* of the disposition. The property itself changes.
          *   *Masks* leave the intrinsic basis alone but interfere with the *causal chain* to the manifestation.
          *   Consensus: They are distinct categories of counterexamples.

      *   **Question 3: Philosophical Upshot (The Conditional Analysis):**
          *   Explain the *Simple Conditional Analysis* (SCA). "Fragile = If struck, then breaks."
