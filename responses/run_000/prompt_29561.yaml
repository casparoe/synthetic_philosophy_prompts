answer: |-
  You have independently rediscovered two of the most famous counterexamples in contemporary metaphysics. Your intuition is correct: these are not just two ways of saying "the disposition didn't manifest." They represent structurally distinct problems that have driven a significant amount of philosophical research over the last forty years.

  Here is the breakdown of the terminology, the distinction, and the philosophical upshot, separating the settled consensus from the ongoing debates.

  ### 1. Do philosophers have established names for these?

  Yes. The terminology is quite standard in the literature on dispositions (sometimes called "powers" or "propensities").

  **Pattern 1: Finkish Dispositions (or "Finks")**
  Your first case, where the disposition is removed or altered by the very stimulus that is supposed to trigger it, is known as a **finkish disposition**. The term was introduced by the Australian philosopher C.B. Martin in the 1990s and popularized by David Lewis in his 1997 paper *"Finkish Dispositions."*

  *   **The Structure:** Object $x$ has disposition $D$. Stimulus $S$ occurs. The occurrence of $S$ causes $x$ to lose $D$ immediately before the manifestation $M$ can happen.
  *   **Your Example:** The vase is fragile, but the heating device (triggered by the strike) removes the fragility instantly.
  *   **Software Analog:** You hit a server with a request that triggers a bug, but the bug triggers a watchdog script that restarts the service before the crash log is written. The disposition to crash-log was "finked."

  **Pattern 2: Masking (or "Masks")**
  Your second case, where the disposition remains intact but an external factor prevents the manifestation, is known as **masking**. This was also discussed extensively by Martin and by Mark Johnston (1992).

  *   **The Structure:** Object $x$ has disposition $D$. Stimulus $S$ occurs. An interfering factor $I$ prevents $M$, but $x$ retains $D$ throughout the process.
  *   **Your Example:** The vase is fragile, but the foam packing prevents the breaking.
  *   **Software Analog:** A function is disposed to return `null` on bad input, but a wrapper function catches that return and substitutes a default value. The underlying disposition is masked.

  ### 2. Are they treated as importantly different?

  Yes. There is a strong consensus that these are distinct phenomena requiring different explanations.

  **The Intrinsic vs. Extrinsic Distinction**
  Philosophers generally distinguish them based on what happens to the **categorical basis** of the disposition.
  *   In metaphysics, a disposition is usually thought to be grounded in some underlying physical structure (its "basis"). For glass, fragility is grounded in its molecular lattice structure.
  *   **In Masking:** The basis remains unchanged. The glass molecules are still arranged brittly; the foam is just an external barrier. The disposition is intrinsic to the object, but the *manifestation* is blocked extrinsically.
  *   **In Finkish Cases:** The basis itself is altered. The heating element changes the molecular structure of the glass *during* the strike. The object literally ceases to have the disposition it had a moment before.

  **Why the distinction matters**
  If you treat them as the same, you cannot solve the logical problems they create. A solution that handles masks (e.g., "add a clause saying 'no interferers present'") often fails to handle finks, because in finkish cases, the removal of the disposition is part of the causal chain of the stimulus itself. Conversely, a solution that handles finks (e.g., "hold the intrinsic properties fixed") might be too restrictive for masks.

  ### 3. What is the philosophical upshot?

  This is where your observation hits the core of the philosophical debate. Your examples directly attack the **Simple Conditional Analysis (SCA)** of dispositions.

  **The Simple Conditional Analysis (SCA)**
  For much of the 20th century, philosophers (particularly those of an empiricist bent) tried to define dispositions using simple counterfactual conditionals. The definition looked like this:
  > $x$ is disposed to manifest $M$ in response to stimulus $S$ **if and only if** if $x$ were subjected to $S$, $x$ would manifest $M$.

  In your terms: "The vase is fragile if and only if, if it were struck, it would break."

  **The Upshot: The SCA is False**
  It is now **settled consensus** that the Simple Conditional Analysis is false, precisely because of the two patterns you identified.

  1.  **The Fink Counterexample:** The vase *is* fragile (it has the brittle structure). But if it were struck, it *would not* break (because the heater would activate).
      *   SCA says: Since "If struck, it breaks" is false, the vase is not fragile.
      *   Reality: The vase *is* fragile.
      *   **Result:** SCA gives a **false negative**.
  2.  **The Mask Counterexample:** The vase *is* fragile. But if it were struck (while packed), it *would not* break.
      *   SCA says: Since "If struck, it breaks" is false, the vase is not fragile.
      *   Reality: The vase *is* fragile.
      *   **Result:** SCA gives a **false negative**.

  (There are also reverse cases, "reverse finks" and "mimics," where the conditional is true but the disposition is absent, yielding **false positives**, but your two cases are sufficient to break the theory.)

  **What is Contested: The Solution**
  While everyone agrees the SCA is broken, there is **no consensus** on how to fix it. This is the live debate in metaphysics today. There are three main camps:

  *   **Camp A: The Reformed Conditional Analysis (Lewisians)**
      *   **View:** We can save the conditional approach, but we have to make it complex. David Lewis proposed adding a clause: "If $x$ were subjected to $S$, and $x$ retained its intrinsic properties for a sufficient time, $x$ would manifest $M$."
      *   **Status:** Contested. Critics argue this is ad hoc or that "retaining intrinsic properties" is hard to define without already presupposing what dispositions are.
  *   **Camp B: The Causal Basis View (Armstrong, Prior, Jackson)**
      *   **View:** Dispositions aren't conditionals at all; they are real properties grounded in categorical physical structures. To say "glass is fragile" is to say "glass has a molecular structure that causes breaking when struck."
      *   **Status:** Contested. This works well for physical objects but struggles with abstract or mental dispositions (e.g., "irascibility" in a person doesn't have a clear single molecular basis).
  *   **Camp C: Dispositional Essentialism / Powerism (Bird, Mumford, Ellis)**
      *   **View:** Dispositions are fundamental. They cannot be reduced to conditionals or categorical bases. The universe is made of "powers," not just "things." The conditional "if struck, it breaks" is true *because* the object has the power, not the other way around.
      *   **Status:** Contested. This is a major minority view. It solves the Fink/Mask problems elegantly (the power exists regardless of whether it manifests) but commits one to a much "heavier" metaphysics than many philosophers prefer.

  ### Summary for the Engineer

  You have correctly identified that **Finks** (disposition removal) and **Masks** (manifestation blocking) are distinct failure modes in the logic of dispositions.

  *   **Settled:** These cases prove that you cannot define a disposition simply as "what would happen if..." (The Simple Conditional Analysis is dead).
  *   **Contested:** What dispositions *actually are*. Are they complex conditional statements (Camp A), physical structural properties (Camp B), or fundamental building blocks of reality (Camp C)?

  In software architecture terms: The SCA tried to define an interface by its output behavior alone. Finks and Masks prove that behavior is insufficient to define the interface; you need to know something about the internal state (the basis) or accept that the interface definition itself is a fundamental primitive that isn't reducible to input/output logs.

  **Recommended Reading**
  If you want to read the primary sources, they are surprisingly accessible:
  1.  **David Lewis, "Finkish Dispositions" (1997).** The classic paper that named your first pattern.
  2.  **C.B. Martin, "Dispositions and Conditionals" (1994).** Where the electric wire examples originated.
  3.  **Sungho Choi, "The Simple Conditional Analysis of Dispositions" (2006).** A good survey of why the SCA fails and the current state of the debate.
