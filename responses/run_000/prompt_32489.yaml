      *   *Attempt 2 (Too dramatic):* A soldier follows orders from a moral commander but shoots the wrong person. *Critique:* Violates "ordinary life" constraint.
      *   *Attempt 3 (Focus on interpersonal relationships):* A parent asks a therapist or expert how to handle a child's behavior. They follow the advice blindly. The advice is technically "correct" in a vacuum, but the application lacks warmth/understanding.
