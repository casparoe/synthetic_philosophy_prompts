  I'm a novelist, working on a book where the protagonist makes a snap decision that seems obviously right in the moment — she blows the whistle on something, sets off a chain of institutional reforms — and the narrative keeps cutting forward decades and centuries, showing these cascading effects she couldn't possibly have tracked, some of them beautiful, some of them ruins. I fell down this rabbit hole reading about "consequentialist cluelessness" — the idea that for basically any nontrivial act, you can't trace the causal ripples far enough to know whether it was net good or net bad, so consequentialism can't actually tell you what to do. It's been messing with me, both as a person and as someone trying to write a character who acts.

  Here's what I want: your actual credence that the cluelessness objection is *fatal* to consequentialism as a decision procedure. Not just that it's an interesting complication or that it forces some modesty — I mean fatal in the sense that, if you grant the epistemic situation we're actually in, you cannot legitimately use consequentialist reasoning to decide what to do in ordinary life. The theory still might be true as a criterion of rightness but it's useless as a guide.

  Decompose the number. I want to see the sub-questions your credence rides on. My guess is you'd want at least these:

  - How much hangs on the empirical claim that we really are *radically* uncertain about long-run consequences — like, not just somewhat uncertain but "the sign flips unpredictably" uncertain — versus the view that we can bound things well enough for practical purposes?
  - How much hangs on whether cluelessness is a special problem for consequentialism versus a problem that guts every other moral theory too (deontology, virtue ethics, whatever) once you look closely — so consequentialism isn't uniquely disadvantaged?
  - How much hangs on whether sophisticated consequentialism or some two-level view can quarantine the problem — like, "act on the best available expected value given reasonable bounds, and the theory survives as action-guiding even if it's not omniscient"?
  - How much hangs on the possibility that the whole framing is confused because "decision procedure" and "criterion of rightness" are just doing different jobs, and nobody ever promised the criterion would double as a user manual?

  Give me a rough probability for each, how you're combining them, and the final number. Then tell me which one you're least confident about and what kind of evidence or argument — if you could wave a wand and get it — would move your credence the most. I'm trying to figure out whether my protagonist's anguish is philosophically well-founded or just dramaturgically convenient.
