answer: |-
  Here is the decomposition you asked for. I am treating this as a request for a philosophical probability estimate based on the current state of meta-ethical and decision-theoretic discourse.

  ### The Bottom Line
  My credence that the cluelessness objection is **fatal** to consequentialism as a decision procedure in ordinary life is **18%**.

  In other words, I believe there is an 82% chance that consequentialism survives the objection as a usable guide for action, even granting our epistemic limitations. It is a severe wound, but not a kill shot.

  ### The Decomposition
  To arrive at 18%, I am treating the "Fatal" conclusion as a conjunctive claim. For the objection to be truly fatal, it must succeed on multiple fronts simultaneously. If *any* of the four defenses below holds, the theory survives as action-guiding. Therefore, the probabilities below represent my credence that **each specific factor succeeds in making the objection fatal.**

  #### 1. The Empirical Claim: Radical Uncertainty
  *The Question:* How much hangs on the claim that we are *radically* uncertain (sign flips unpredictably) versus moderately uncertain (we can bound expected value)?
  *   **My Credence this makes it Fatal:** **25%**
  *   **Reasoning:** This is the gateway premise. If consequences converge or if near-term effects dominate long-term noise in *ordinary* life, the objection collapses. In chaotic systems, prediction decays, but moral value often doesn't track with chaotic specificity. Saving a child from drowning has a high-probability positive valence that is unlikely to be undone by butterfly effects centuries later (the "swamping" argument). Radical uncertainty is more plausible for *historical pivot points* (like your protagonist's act) than for buying groceries or telling a white lie. Since your question specifies "ordinary life," I discount the radical uncertainty claim.

  #### 2. The Comparative Claim: Unique Vulnerability
  *The Question:* How much hangs on cluelessness being a special problem for consequentialism versus a problem that guts every moral theory?
  *   **My Credence this makes it Fatal:** **40%**
  *   **Reasoning:** If cluelessness destroys agency itself, consequentialism isn't uniquely disadvantaged; it's just a casualty of a general war. However, consequentialism is more exposed because it lacks "agent-centered restrictions." A deontologist can say, "I didn't lie, so I'm clean," regardless of the outcome. A consequentialist *must* care about the outcome. Therefore, the objection hits consequentialism harder than virtue ethics or deontology. I assign a higher fatality probability here because consequentialism bears the brunt of the epistemic burden, even if others aren't immune.

  #### 3. The Theoretical Claim: Sophisticated Defenses
  *The Question:* How much hangs on whether Expected Value (EV) or Two-Level Consequentialism can quarantine the problem?
  *   **My Credence this makes it Fatal:** **30%**
  *   **Reasoning:** Standard decision theory does not require omniscience; it requires maximizing *expected* utility based on *available* information. If I assign a 51% probability to an outcome being good, I act. Cluelessness argues that the error bars are so wide the EV is zero. But in ordinary life, error bars are rarely that wide. Furthermore, "Two-Level" views (act on heuristics that generally maximize utility) bypass the need for case-by-case calculation. For this to fail, we must assume that even our heuristics are epistemically unmoored. That is a strong claim, so I assign a low probability that this defense fails.

  #### 4. The Meta-Ethical Claim: Criterion vs. Procedure
  *The Question:* How much hangs on the distinction between "criterion of rightness" and "decision procedure"?
  *   **My Credence this makes it Fatal:** **10%**
  *   **Reasoning:** This is the strongest shield. If consequentialism is a metric for judging acts (criterion) but not a recipe for thinking (procedure), then cluelessness is irrelevant to the theory's validity. It merely tells us we need a different psychology to *achieve* the good (e.g., cultivate virtues, follow rules). Most contemporary consequentialists (like Peter Railton or Brad Hooker) accept this distinction. For the objection to be fatal, one must insist that a moral theory *must* provide its own algorithm for thinking. That is a demanding constraint that few meta-ethicists accept.

  ### How I Combined Them
  I am not averaging these; I am treating them as hurdles the objection must clear.
  *   If **Empirical Uncertainty** is low (75% chance), the objection loses most of its force immediately.
  *   Even if Uncertainty is high, if **Sophisticated Defenses** work (70% chance), the theory survives.
  *   Even if Defenses fail, if the **Criterion/Procedure** distinction holds (90% chance), the theory survives as a criterion, which is often enough for "legitimacy."

  Roughly: $0.25 \times 0.40 \times 0.30 \times 0.10 \approx 0.003$.
  *Wait.* That multiplication assumes total independence and that *all* must fail for the theory to die. That's too generous to the theory. A more realistic model is that the objection is fatal if the Empirical Claim is true *AND* the Theoretical Defenses fail. The Comparative and Meta-Ethical points mitigate the *damage*, but don't necessarily save the decision procedure.

  **Revised Calculation:**
  1.  **P(Empirical Uncertainty is Radical):** 0.25
  2.  **P(Defenses Fail | Uncertainty is Radical):** 0.70 (If uncertainty is truly radical, EV calculations break down).
  3.  **P(Distinction is Invalid):** 0.10 (Most accept the distinction).

  $0.25 \times 0.70 = 0.175$ (17.5%).
  Rounded to **18%**.

  ### Least Confidence & The Magic Wand
  I am least confident in **Q1 (The Empirical Claim)**.
  Philosophy can spin logic all day, but this objection ultimately rests on a claim about how causality works in the social world. Do small acts wash out (converge), or do they compound (diverge)?

  **The Evidence I Want:**
  If I could wave a wand, I would want a **computational simulation of counterfactual social history**. I want to run 10,000 simulations of a specific "ordinary" act (e.g., reporting a safety violation) and see the distribution of utility outcomes 100 years later.
  *   **If the distribution is normal/tight:** Cluelessness is false. (Credence in fatality drops to <5%).
  *   **If the distribution is Cauchy/heavy-tailed (sign flips wildly):** Cluelessness is true. (Credence in fatality rises to >60%).

  Currently, we rely on intuition and chaos theory analogies. We lack the data.

  ### For Your Protagonist
  Here is the novelist's takeaway:

  **Philosophically:** Her anguish is technically misplaced *if* she is living an ordinary life. The 82% probability suggests she *can* legitimately use consequentialist reasoning. She can trust that near-term good usually isn't undone by long-term chaos.

  **Dramatically:** Her anguish is **profoundly well-founded** because she is *not* living an ordinary life. She is a "historical pivot point."
  The cluelessness objection is weak for buying coffee, but it is devastating for **institutional reforms that cascade over centuries.** In your book, she is doing the one thing where the Empirical Claim (Q1) flips from "False" to "True."

  For a whistleblower whose act changes laws for 200 years, the error bars *do* widen. The sign *might* flip. The "ordinary life" defense does not apply to her. This makes her a tragic figure: she is using a moral framework (consequentialism) that works for humans, on a scale (history) where it breaks down.

  That is not dramaturgically convenient; it is the exact niche where the philosophical problem becomes real. Let her suffer. She has earned it.
