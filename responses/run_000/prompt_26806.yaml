answer: |-
  # Epistemic Game Theory: A Decision Tree for Solution Concepts

  **Instructions:** Begin with a concrete strategic situation where players are Bayesian expected-utility maximizers and Rationality is Common Knowledge (CKR). Answer the following questions based *only* on the structural features of the model (information sets, timing, priors). Follow the path to a leaf to identify the epistemic position that best captures the predictive commitment of CKR in that context.

  ---

  ## The Decision Tree

  **Q1. Nature of Interaction:**
  Is the primary interaction a **Strategic Game** (players choose actions that directly determine payoffs) or an **Informational Exchange** (players compare beliefs or decide whether to trade assets based on information)?
  *   [Strategic Game] → Go to **Q2**
  *   [Informational Exchange] → Go to **Q5**

  **Q2. Timing of Moves:**
  Do players move **Sequentially** (observing prior moves before acting) or **Simultaneously** (one-shot or repeated without observing current moves)?
  *   [Sequential] → **Leaf A: Backward Induction**
  *   [Simultaneous] → Go to **Q3**

  **Q3. Payoff Knowledge:**
  Are the payoff-relevant states of the world **Common Knowledge** or observed only through **Noisy Private Signals**?
  *   [Common Knowledge] → Go to **Q4**
  *   [Noisy Private Signals] → Go to **Q6**

  **Q4. Prior Beliefs (Static/CK Payoffs):**
  Do the players share a **Common Prior** probability distribution over the state space (allowing for correlated beliefs)?
  *   [No Common Prior] → **Leaf B: Rationalizability**
  *   [Common Prior] → **Leaf C: Correlated Equilibrium**

  **Q5. Outcome Variable (Info Exchange):**
  Are players merely **Comparing Posteriors** or are they offered a **Speculative Bet/Trade**?
  *(Note: Both branches below assume a Common Prior and Partitional Information)*
  *   [Comparing Posteriors] → **Leaf D: Aumann Agreement**
  *   [Speculative Bet/Trade] → **Leaf E: No-Trade Theorem**

  **Q6. Signal Structure (Noisy Payoffs):**
  Are the private signals drawn from a **Continuous Distribution** or a **Discrete Set** (e.g., countable messages)?
  *   [Continuous Distribution] → **Leaf F: Global Games Selection**
  *   [Discrete Set] → **Leaf G: Email Game / Coordinated Attack**

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf A: Backward Induction
  *   **Path:** Strategic Game → Sequential → (Payoff Knowledge Irrelevant, usually CK)
  *   **Position:** Common knowledge of rationality in a perfect information game commits players to the unique backward-induction outcome.
  *   **Awkward Commitment:** It requires players to believe opponents will act rationally at nodes that common knowledge of rationality implies should never be reached.

  ### Leaf B: Rationalizability
  *   **Path:** Strategic Game → Simultaneous → CK Payoffs → No Common Prior
  *   **Position:** Common knowledge of rationality without a common prior restricts play only to strategies that are best responses to some belief about rational play.
  *   **Awkward Commitment:** It often yields a set of predictions so wide (the entire rationalizable set) that it fails to select a specific outcome.

  ### Leaf C: Correlated Equilibrium
  *   **Path:** Strategic Game → Simultaneous → CK Payoffs → Common Prior
  *   **Position:** Common knowledge of rationality with a common prior implies play conforms to a correlated equilibrium distribution.
  *   **Awkward Commitment:** It requires an ontological commitment to a correlation device or a subjective prior that correlates independent strategy choices.

  ### Leaf D: Aumann Agreement
  *   **Path:** Informational Exchange → Comparing Posteriors → (Common Prior Assumed)
  *   **Position:** If priors are common and information is partitional, players cannot commonly know that their posterior probabilities differ.
  *   **Awkward Commitment:** It implies that any observed real-world disagreement is evidence of irrationality, different priors, or non-partitional information.

  ### Leaf E: No-Trade Theorem
  *   **Path:** Informational Exchange → Speculative Bet → (Common Prior Assumed)
  *   **Position:** If priors are common and information is partitional, common knowledge of rationality precludes mutually acceptable speculative trade.
  *   **Awkward Commitment:** It cannot explain high-volume financial markets without invoking asymmetric priors or non-rational motivations (e.g., liquidity needs).

  > **⚠️ FLAGGED OVERLAP:** Leaves **D** and **E** rest on nearly identical epistemic assumptions (Common Prior + Partitional Information). The distinction is merely whether the "action" is stating a belief or placing a bet; logically, they are twin implications of the same impossibility result.

  ### Leaf F: Global Games Selection
  *   **Path:** Strategic Game → Simultaneous → Noisy Payoffs → Continuous Signals
  *   **Position:** Introducing small noise with continuous signals breaks symmetry and selects a unique risk-dominant equilibrium.
  *   **Awkward Commitment:** The uniqueness result relies sensitively on the assumption of continuous signal spaces and independent noise distributions.

  ### Leaf G: Email Game (Coordinated Attack)
  *   **Path:** Strategic Game → Simultaneous → Noisy Payoffs → Discrete Signals
  *   **Position:** Approximate common knowledge (arbitrarily high order belief) is insufficient to sustain coordination equilibria that require exact common knowledge.
  *   **Awkward Commitment:** It predicts a discontinuous drop in coordination probability even when the likelihood of message failure is vanishingly small.

  ---

  ## Diagnostic Appendix: Unoccupied Logical Space

  The following combinations of branch answers do not lead to the seven named positions above. They are diagnosed as follows:

  1.  **Informational Exchange + No Common Prior**
      *   *Diagnosis:* **Coherent but Unconstrained.** Without a common prior, "Agreeing to Disagree" is perfectly rational. This is the standard Bayesian baseline, not a restrictive theorem.
  2.  **Strategic Game + Sequential + Noisy Payoffs**
      *   *Diagnosis:* **Underexplored/Complex.** Dynamic Global Games exist but lack the clean, universal selection theorems of the static case; they often require specific timing assumptions to resolve.
  3.  **Strategic Game + Sequential + No Common Prior**
      *   *Diagnosis:* **Extensive Form Rationalizability.** Coherent, but less standard than Backward Induction; it suffers from the same indeterminacy as Leaf B but compounded by off-path belief ambiguities.
  4.  **Strategic Game + Simultaneous + Noisy Payoffs + Non-Partitional Info**
      *   *Diagnosis:* **Incoherent/Unattractive.** Most noisy signal models assume partitional knowledge of one's own signal; dropping this makes defining "rational response to signal" technically fraught without significant reformulation.

  ---
  *Handout designed for 10-minute walkthrough. Verify model assumptions against Q1–Q6 before selecting a leaf.*
