prompt: |-
  My small business has been bidding on a contract against a competitor for months. We started with a reasonable offer, they undercut us, we undercut them, and now we're seven rounds in. At our current bid, we'd lose about $15,000 if we win — but we've already sunk over $30,000 into the proposal process itself, and pulling out means walking away with nothing to show for it. My business partner argues we have to see it through, because otherwise all that time and money was wasted. Something about this reasoning feels like a trap to me, but I can't put my finger on what's wrong with it. What's actually going on here, and how should we think about whether to keep bidding?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small business bidding on a contract against a competitor.
      *   **Status:** 7 rounds of bidding (price war).
      *   **Financials:**
          *   Current bid leads to a loss of $15,000 *if* they win.
          *   Sunk costs (proposal process) are over $30,000.
      *   **Partner's Argument:** "We have to see it through, otherwise all that time and money was wasted."
      *   **User's Intuition:** "Something about this reasoning feels like a trap."
      *   **Goal:** Identify the cognitive bias/trap and provide a framework for decision-making.

  2.  **Identify the Core Economic/Psychological Concept:**
      *   The partner's argument ("we've spent $30k, so we must continue to make it worth it") is the textbook definition of the **Sunk Cost Fallacy**.
      *   The situation (escalating commitment in a competitive bidding war) is also a classic example of the **Winner's Curse** and **Escalation of Commitment**.
      *   The specific dynamic of two parties driving prices down irrationally is akin to the **Dollar Auction Game**.

  3.  **Deconstruct the Partner's Logic:**
      *   *Premise:* We spent $30k.
      *   *Conclusion:* We must win to justify the spend.
      *   *Flaw:* The $30k is gone regardless of the outcome. It cannot be recovered. The decision should be based on *future* costs and benefits, not *past* expenditures.
      *   *Math:*
          *   Option A (Quit): Loss = $30,000 (sunk).
          *   Option B (Win at current bid): Loss = $30,000 (sunk) + $15,000 (operating loss) = $45,000.
          *   Option B is strictly worse financially.

  4.  **Analyze the Strategic Dynamics (The "Trap"):**
      *   **Dollar Auction:** In this game, the highest bidder wins the dollar, but the *second* highest bidder also pays their bid. This leads to bids exceeding the value of the prize. While this isn't exactly a dollar auction (usually only the winner pays), the psychological pressure is similar. The competitor is likely thinking the same thing ("I've spent too much to quit").
      *   **Winner's Curse:** Winning the auction means you likely overpaid (or underbid) relative to the true value. If you are losing money to win, you have definitely been cursed.
      *   **Escalation of Commitment:** Throwing good money after bad.

  5.  **Formulate the Advice:**
