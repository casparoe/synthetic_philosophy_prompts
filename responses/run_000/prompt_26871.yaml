      *   **Name the Fallacy:** Explicitly identify the "Sunk Cost Fallacy."
      *   **Explain the Math:** Show the comparison between quitting now vs. winning at a loss.
      *   **Address the Partner's Concern:** Acknowledge the emotional pain of "wasting" $30k, but reframe it. The waste happened *before* this decision, not because of this decision.
