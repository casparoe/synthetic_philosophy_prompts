          *   Reputation/Risk: Delivering at a loss might hurt quality or cash flow.
      *   **Decision Framework:** Provide a set of questions to ask before deciding.
      *   **Exit Strategy:** How to quit gracefully.

  6.  **Refine the Tone:**
