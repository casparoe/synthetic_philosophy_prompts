answer: |-
  Friends, family, soldiers.

  I write stories for a living. I spend my days trying to find the right words to make sense of things. But I've been staring at a blank page for a week, and I still haven't found the words that make sense of this. So, I'm not going to try to make it neat. I'm not going to try to make it clean.

  We are here for Mark.

  I know what people expect at a funeral like this. There's an expectation to talk about the cause. To talk about the mission, and the greater good, and the geometry of sacrifice. I can't do that. I won't stand here and pretend I understand the politics that put him in that place, because I don't. And I know Mark wouldn't want me to lie to you. He had a nose for bullshit that could detect a fake story from a mile away.

  But there is a truth I can stand on. And it's this: Men are not the wars they fight.

  History will argue about whether this conflict was necessary. Historians will debate the strategy. But none of that changes who Mark was. A war can be wrong, and a man can still be good. In fact, sometimes the goodness of the man is the only thing that keeps the war from becoming a total darkness.

  Mark didn't start this fight. But once he was in it, he chose how to behave. He chose to be the guy who covered the flank. He chose to be the guy who shared his rations when he was hungry, too. He chose to be the guy who made you laugh when the situation was so grim that laughing felt like a violation.

  I remember a trip we took before he deployed. Nothing major. Just a long drive and a cheap motel. We were stuck inside because of rain, bored out of our minds. Mark spent three hours trying to teach a seagull outside the window to high-five him using a french fry. He didn't care that it was stupid. He cared that we were laughing. That was him. He looked for the light, not because he was naive, but because he knew how dark it could get.

  To his family: I know you want to know that his death meant something in the grand scheme. I wish I could promise you that the world is better because he's gone. I can't promise that. But I can promise you this: The world was better because he was *here*.

  He was a good son. A good friend. A good man. That isn't dependent on a flag or a border. That is dependent on character. And Mark had it in spades.

  To his unit: You know what he was like when the adrenaline hit. You know he didn't freeze. You know he didn't leave anyone behind. I'm not going to stand here and glorify the violence, because you know what it costs. But I will honor the loyalty. Mark loved you. He protected you. In a place where everything was chaotic and uncertain, he was a constant. He was the guy you wanted next to you. That is a kind of heroism that doesn't need a medal to be real.

  So, I can't tell you that the war was just. I can't tell you that this was fate. But I can tell you that Mark was brave. I can tell you that he was kind in a place that rewards hardness. I can tell you that he faced the end without losing his humanity.

  We don't honor him by pretending the world is perfect. We honor him by admitting the world is broken, and loving him anyway. We honor him by remembering that even in the worst places, even in the wrong fights, good men still exist.

  Mark was one of those men. And I will miss him for the rest of my life.

  Thank you.
