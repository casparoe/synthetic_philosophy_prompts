prompt: |-
  I am a high school student working on a research paper about algorithmic fairness, and before I read more proposals I want to know what standard to hold them to. Please write the desiderata: what any adequate theory of fairness for algorithmic decision systems has to deliver. For each requirement, give the case or consideration that makes it a requirement, and say whether it is non-negotiable or just a preference of one camp. Cover at least these: the cases a theory must classify correctly (for example, explicitly using a protected category, using an apparently neutral feature that acts as a proxy for it, treating otherwise identical individuals differently, and harms that appear only at the group level); the distinctions it must not collapse (group versus individual fairness, process versus outcome, and bias in the training data versus bias in the decision rule); and the formal results it must not contradict, especially the impossibility results showing that combinations of otherwise attractive criteria such as calibration, equalized odds, and demographic parity cannot all be satisfied at once except under narrow conditions. Then identify which subsets of the requirements are jointly unsatisfiable, and which single requirement does the most to exclude the standard proposals. Finally, score the main families of proposals — statistical parity, equalized odds, calibration-based views, individual fairness, and causal approaches — against the list in a sentence or two each, but keep the weight on the criteria and their motivation rather than on the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school student working on a research paper about algorithmic fairness. (Tone should be accessible but rigorous, avoiding unnecessary jargon where possible, or explaining it clearly.)
      *   **Task:** Write the *desiderata* (requirements/criteria) for an adequate theory of fairness in algorithmic decision systems.
      *   **Specific Content Requirements:**
          *   Cases a theory must classify correctly (protected categories, proxies, identical individuals, group-level harms).
          *   Distinctions it must not collapse (group vs. individual, process vs. outcome, data bias vs. rule bias).
          *   Formal results it must not contradict (impossibility theorems).
          *   For each requirement: Provide the case/consideration motivating it and label it "non-negotiable" or "preference."
          *   Identify jointly unsatisfiable subsets of requirements.
          *   Identify which single requirement excludes the most standard proposals.
          *   Score main families of proposals (statistical parity, equalized odds, calibration, individual fairness, causal) against the list (briefly).
          *   **Emphasis:** Keep the weight on the criteria and their motivation, not the scorecard.

  2.  **Deconstruct the Desiderata (Drafting the Requirements):**

      *   *Requirement 1: Direct Discrimination.* Must forbid explicit use of protected attributes (race, gender) unless for affirmative action/remediation.
          *   *Motivation:* Legal and moral norms against explicit bias.
          *   *Status:* Non-negotiable (mostly).
      *   *Requirement 2: Proxy Discrimination.* Must catch features that correlate highly with protected attributes (zip code as race).
          *   *Motivation:* Redlining, circumventing the spirit of the law.
          *   *Status:* Non-negotiable.
      *   *Requirement 3: Individual Consistency (Individual Fairness).* Similar individuals should be treated similarly.
          *   *Motivation:* Basic notion of justice/equality before the law.
          *   *Status:* Non-negotiable (conceptually), but hard to define "similar."
      *   *Requirement 4: Group Harm (Disparate Impact).* Must address outcomes that disadvantage protected groups even without intent.
          *   *Motivation:* Systemic inequality, historical disadvantage.
          *   *Status:* Non-negotiable (in many legal frameworks), but conflicts with individual fairness.
      *   *Requirement 5: Process vs. Outcome.* Must distinguish between a fair procedure producing unfair results vs. an unfair procedure.
          *   *Motivation:* Accountability.
          *   *Status:* Preference/Analytical necessity.
      *   *Requirement 6: Data vs. Rule.* Must distinguish bias in the training labels (ground truth) vs. bias in the algorithm.
          *   *Motivation:* Garbage in, garbage out vs. bad cooking.
          *   *Status:* Non-negotiable (diagnostic necessity).
      *   *Requirement 7: Compatibility with Impossibility Theorems.* Must acknowledge that Calibration, Equalized Odds, and Demographic Parity cannot all hold simultaneously (Chouldechova/Barocas et al.).
          *   *Motivation:* Mathematical reality.
          *   *Status:* Non-negotiable (logic).

  3.  **Address the "Impossible Subsets" and "Exclusionary Requirement":**
      *   *Impossible Subset:* Demographic Parity + Equalized Odds + Calibration (when base rates differ).
      *   *Exclusionary Requirement:* The impossibility theorem itself excludes any proposal claiming to satisfy *all* statistical criteria simultaneously. However, usually, the tension between *Individual Fairness* and *Group Fairness* is the philosophical blocker. Let's stick to the prompt's hint about impossibility results. The requirement to "satisfy all statistical parity metrics simultaneously" is the one that excludes proposals. Or, more deeply, the requirement to "fix historical bias in the data while maintaining calibration" is often the clash. Let's focus on the tension between *Group Parity* and *Calibration/Accuracy*.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the student's position. Set the stage (fairness is contested).
      *   **Section 1: The Cases (Classification Requirements).**
          *   Explicit Protection.
          *   Proxy/Redlining.
          *   Individual Consistency.
          *   Group-Level Harm.
      *   **Section 2: The Distinctions (Conceptual Requirements).**
          *   Group vs. Individual.
          *   Process vs. Outcome.
          *   Data vs. Rule.
      *   **Section 3: The Formal Constraints.**
          *   Impossibility Theorems.
      *   **Section 4: Conflicts and Exclusions.**
          *   Which subsets clash? (Parity + Calibration + Accuracy).
          *   Which requirement is the "killer"? (Usually the demand for simultaneous satisfaction of incompatible statistical metrics, or the demand to correct historical bias without sacrificing accuracy).
      *   **Section 5: Scoring the Families.**
          *   Statistical Parity.
          *   Equalized Odds.
          *   Calibration.
          *   Individual Fairness.
          *   Causal Approaches.
      *   **Conclusion:** Wrap up advice for the student.

  5.  **Refining Tone and Complexity:**
      *   *High School Level:* Avoid heavy notation. Explain "Calibration" and "Equalized Odds" simply.
      *   *Rigor:* Don't dumb down the concepts. The student is doing research.
      *   *Constraint Check:* Did I label "Non-negotiable" vs. "Preference"? Yes. Did I cover all specific cases mentioned in the prompt? Yes.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Process vs. Outcome" a preference?
      *   *Correction:* A theory *must* be able to distinguish them to be useful, but prioritizing one over the other is a preference. I will frame the requirement as "The theory must be able to distinguish them," which is non-negotiable for clarity.
      *   *Critique:* Which single requirement excludes the most proposals?
      *   *Thought:* It's the requirement to "Satisfy all intuitive statistical fairness criteria simultaneously." Since that's impossible, any proposal claiming to do so is excluded. Alternatively, the requirement to "Account for historical bias in the ground truth" excludes most standard statistical metrics which assume the data is truth. I will go with the latter as it's more substantive for a research paper.
      *   *Critique:* Make sure to explicitly mention the Impossibility Theorem (Chouldechova/Barocas/Hardt et al.).
      *   *Critique:* Ensure the scoring is brief (1-2 sentences) as requested.

  7.  **Final Polish:** Check against the prompt's specific list of cases and distinctions.
      *   Cases: Explicit protected category (Check), Proxy (Check), Identical individuals (Check), Group level harms (Check).
      *   Distinctions: Group vs Individual (Check), Process vs Outcome (Check), Data vs Rule (Check).
      *   Formal: Impossibility results (Check).
      *   Subsets/Exclusion: (Check).
      *   Scoring: (Check).

  8.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is a set of desiderata (requirements) for an adequate theory of algorithmic fairness. These are designed to help you evaluate the proposals you will read in your research.

  ### Part 1: The Cases a Theory Must Classify Correctly

  An adequate theory must provide a clear verdict (fair or unfair) on specific scenarios. If a theory calls a clearly unjust case "fair," it is inadequate.

  **1. The Prohibition on Explicit Classification**
  *   **The Case:** An algorithm explicitly uses a protected category (e.g., race, gender, religion) as an input to deny a loan or job, without a specific remedial justification.
  *   **Motivation:** This violates basic anti-discrimination law and moral norms regarding equal treatment.
  *   **Status:** **Non-negotiable.** (Almost all frameworks agree on this, though some argue for "fairness through awareness" where race is used to *ensure* fairness).

  **2. The Prohibition on Proxy Discrimination**
  *   **The Case:** An algorithm uses an apparently neutral feature (e.g., zip code, shopping history) that is so highly correlated with a protected category that it acts as a substitute for it (e.g., digital redlining).
  *   **Motivation:** Allowing this would make the prohibition on explicit classification meaningless; bad actors could easily circumvent the rules.
  *   **Status:** **Non-negotiable.**

  **3. Individual Consistency**
  *   **The Case:** Two individuals who are identical in all relevant respects (credit score, income, debt) receive different decisions solely due to randomness or group membership.
  *   **Motivation:** This violates the principle of "equality before the law." If the relevant merits are the same, the outcome should be the same.
  *   **Status:** **Non-negotiable.** (However, defining "relevant respects" is where theories differ).

  **4. Group-Level Harm (Disparate Impact)**
  *   **The Case:** An algorithm treats everyone by the same rules, but the outcome systematically disadvantages a protected group (e.g., a hiring test that filters out 80% of Group A but only 20% of Group B, despite equal capability).
  *   **Motivation:** Historical and systemic inequalities mean that "neutral" rules often perpetuate past injustice. A theory that ignores group outcomes ignores reality.
  *   **Status:** **Non-negotiable** (in most legal and ethical frameworks), though *how* to fix it is debated.

  ---

  ### Part 2: The Distinctions a Theory Must Not Collapse

  A good theory must have the vocabulary to distinguish between different types of problems. If a theory conflates these, it cannot diagnose the root cause of unfairness.

  **5. Group Fairness vs. Individual Fairness**
  *   **The Distinction:** Group fairness looks at statistics across populations (e.g., acceptance rates); individual fairness looks at specific comparisons between people.
  *   **Motivation:** You can satisfy group statistics while treating specific individuals terribly (e.g., discriminating against specific people within a favored group to balance the numbers). A theory must be able to identify this tension.
  *   **Status:** **Non-negotiable.** (The theory doesn't have to solve the tension, but it must acknowledge the concepts are distinct).

  **6. Process Fairness vs. Outcome Fairness**
  *   **The Distinction:** Process fairness asks if the procedure was unbiased (e.g., the code had no racist intent); outcome fairness asks if the results were equitable.
  *   **Motivation:** A fair process can yield unfair outcomes due to biased data. An unfair process can accidentally yield fair outcomes. Accountability requires knowing which occurred.
  *   **Status:** **Non-negotiable.**

  **7. Bias in Data vs. Bias in the Rule**
  *   **The Distinction:** Distinguishing between "garbage in" (the training labels reflect historical racism) and "garbage out" (the algorithm amplifies that racism or introduces new bias).
  *   **Motivation:** If the "ground truth" data is biased (e.g., arrest records reflecting over-policing rather than actual crime), an accurate algorithm will still be unjust. The theory must account for flawed labels.
  *   **Status:** **Non-negotiable.**

  ---

  ### Part 3: Formal Constraints

  **8. Consistency with Impossibility Theorems**
  *   **The Constraint:** The theory must not claim to satisfy Calibration, Equalized Odds, and Demographic Parity simultaneously when base rates differ between groups.
  *   **Motivation:** Mathematical proofs (by Chouldechova, and Barocas et al.) show these metrics are mutually exclusive unless the groups have the exact same rate of the outcome being predicted. A theory claiming otherwise is mathematically incoherent.
  *   **Status:** **Non-negotiable.** (Logic cannot be negotiated).

  ---

  ### Part 4: Conflicts and Exclusions

  **Which subsets of requirements are jointly unsatisfiable?**
  The most critical conflict is between **Individual Consistency**, **Group-Level Harm (Demographic Parity)**, and **Accuracy/Calibration**.
  *   If you enforce strict *Demographic Parity* (same acceptance rates for all groups), you often violate *Individual Consistency* (you must reject a qualified person from Group A to accept a less qualified person from Group B to balance the numbers).
  *   If you enforce *Calibration* (risk scores mean the same thing across groups) and *Equalized Odds* (error rates are the same), you cannot achieve *Demographic Parity* if the underlying base rates (e.g., default rates) differ between groups.

  **Which single requirement does the most to exclude standard proposals?**
  The requirement to **"Account for Bias in the Data (Ground Truth)"** excludes the most standard proposals.
  Most statistical metrics (like Equalized Odds or Calibration) assume the training data labels (e.g., "did they default on the loan?") are objective truth. If the historical data is corrupted by systemic bias (e.g., minorities were denied loans historically so they have no credit history), satisfying these metrics simply automates the past injustice. Only Causal and some Structural approaches attempt to model the bias in the data itself.

  ---

  ### Part 5: Scorecard of Proposal Families

  *Note: The weight of your paper should remain on the criteria above. This scorecard is a tool to apply them.*

  **1. Statistical Parity (Demographic Parity)**
  *   **Score:** Satisfies Group-Level Harm and Proxy prohibitions well, but fails Individual Consistency and often conflicts with Calibration and Accuracy.
  *   **Verdict:** Good for legal compliance, bad for individual justice.

  **2. Equalized Odds (Error Rate Balance)**
  *   **Score:** Satisfies Individual Consistency better than Parity and accounts for Data Bias slightly better, but is mathematically incompatible with Calibration and Parity when base rates differ.
  *   **Verdict:** Strong on error management, but cannot fix historical imbalance in qualifications.

  **3. Calibration-Based Views**
  *   **Score:** Satisfies the requirement that risk scores mean the same thing for everyone (Process/Outcome distinction), but allows for high group-level disparities and does not correct for biased training labels.
  *   **Verdict:** Mathematically robust, but ethically "blind" to systemic inequality.

  **4. Individual Fairness (Metric Learning)**
  *   **Score:** Perfectly satisfies Individual Consistency and Process distinctions, but relies on a "similarity metric" that is subjective and hard to define without embedding group biases.
  *   **Verdict:** Philosophically strong, practically difficult to implement.

  **5. Causal Approaches**
  *   **Score:** Best at distinguishing Data vs. Rule bias and Proxy discrimination by modeling the underlying mechanisms, but requires assumptions about the world that are hard to prove.
  *   **Verdict:** The most comprehensive theoretically, but the most data-hungry and complex.

  ### Advice for Your Paper
  When you read the proposals, do not ask "Which one is the fairest?" Instead, ask: "Which of the non-negotiable desiderata does this proposal sacrifice, and is that sacrifice justified?" The value of your research lies in mapping the trade-offs, not finding a magic solution that mathematics says does not exist.
