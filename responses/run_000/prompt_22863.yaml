      *   *Later Douglass (Post-1851, especially post-*My Bondage and My Freedom* and *The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?*):* Studied legal theory (Lysander Spooner influenced him). Argued that the Constitution did not *guarantee* slavery, only tolerated it in states where it existed. The federal government had no power to create slavery. Therefore, the Constitution was anti-slavery because it denied federal sanction.

