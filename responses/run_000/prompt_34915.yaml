  1. The phenomenon restated
  You describe a competitive dynamic where individually rational actions alter the environment, shifting the baseline for future rationality. Unlike a static decline, the equilibrium itself escalates. Actors remain locked in a self-sustaining cycle of adaptation where maintaining relative position requires increasing effort, redefining the "normal" continuously without any explicit defection.

  2. The nearest established concepts
  **Race to the Bottom:** Economic theory where jurisdictions or firms lower regulations, wages, or prices to attract capital or customers, theoretically settling at a minimal, suboptimal standard, often eroding worker protections or environmental safeguards in the process. **Arms Race:** Political science term for reciprocal increases in military capability or weaponry, driven by mutual threat perception and security dilemmas between rival states, typically resulting in heightened tension and increased expenditure without improved security. **Red Queen Effect:** Evolutionary biology hypothesis (Van Valen, 1973) stating organisms must constantly evolve and adapt merely to survive against co-evolving enemies; later applied to economics for status competition. **Tragedy of the Commons:** Hardin's concept where individual users act independently according to rational self-interest, contrary to the common good, by depleting a shared limited resource. **Multi-polar Trap:** Modern game theory and AI safety term describing scenarios where multiple autonomous agents optimize for local goals, inadvertently locking everyone into a dangerous global trajectory without any single agent defecting from cooperation, often leading to existential risk. These terms cover incentive structures, resource depletion, or military escalation, but rarely combine moving equilibria with multipolar non-defection. Each concept isolates a specific mechanism of failure rather than the shifting baseline dynamic you describe.

  3. Where each fits and where it misses
  **Race to the Bottom:** Fits the "collective harm" outcome and competitive pressure. Fails fundamentally because it implies convergence on a fixed low point (e.g., zero wage), whereas your pattern involves an upward ratchet of requirements (e.g., faster publishing speeds). **Arms Race:** Fits the "escalation" and "action-reaction" mechanism well. Fails because it traditionally implies hostile state actors and military hardware, making it feel metaphorical when applied to AI labs or corporate procurement, and often assumes dyadic rather than multipolar competition. **Red Queen Effect:** Fits the "moving baseline" perfectly; you run to stay in place. Fails because it is often descriptive of natural selection rather than normative harm; it doesn't inherently imply the outcome is wasteful or dangerous, just biologically necessary. **Tragedy of the Commons:** Fits the "individual rationality vs. collective loss" logic. Fails because the mechanism is resource depletion, not standard-shifting; the "commons" remains fixed while users exhaust it, rather than the standard of use escalating. **Multi-polar Trap:** Fits the "no defection" and "AI lab" context perfectly. Fails because it describes the *structure* of the trap rather than the *dynamic* of the moving equilibrium; a trap can be a static suboptimal state, whereas your pattern emphasizes the ratcheting process itself. The key distinction across all is whether the equilibrium is static or moving.

  4. Verdict on a name
  Thus, there is no single canonical term that exclusively denotes this specific configuration of moving equilibria without defection. **Red Queen Effect** is the established name for the dynamic mechanism itself. However, in contemporary game theory and AI safety, this is increasingly categorized under **Multi-polar Traps**. Neither covers the full semantic range alone. You should not coin a new term; instead, use **Red Queen Dynamics** to specify the moving baseline within a **Multi-polar Trap** structure. This combination is precise and recognized.

  5. Definition and boundary cases
  **Definition:** A competitive systemic dynamic where agents must continuously increase investment or capability solely to maintain relative status, as competitors' advancements redefine the baseline for viability, creating a self-sustaining escalation loop. **Inside Cases:** 1) AI Labs releasing models: Each release raises the bar, forcing others to rush, accelerating risk without improving safety. 2) Credential Inflation: Degrees become mandatory as more people earn them, forcing others to study longer for the same jobs, wasting resources. **Outside Cases:** 1) Price War: Competitors lower prices to win market share (Race to the Bottom). The variable moves down to a fixed floor, not an escalating standard of capability. 2) Overfishing: Fishermen catch more fish depleting the stock (Tragedy of the Commons). The resource shrinks; the standard for catching them does not necessarily rise, and the harm is depletion, not escalation. The boundary lies clearly in whether the standard of competition itself shifts.
