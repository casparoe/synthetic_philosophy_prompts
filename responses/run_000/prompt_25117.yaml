      *   **Recommendation:** Must be actionable (Mandate, Status Quo, or Third Option).
      *   **Tone:** Professional, persuasive, balanced but decisive.

  2.  **Determine the Recommendation:**
      *   *Status Quo:* Explicitly stated as ineffective ("done nothing to alter the underlying dynamics"). Not a viable option for integrity.
      *   *Full Mandate:* Strong on integrity, but vulnerable to the "dictating method" and "stifling exploration" critique. Might face faculty rebellion.
      *   *Third Option (Hybrid):* A mandate for *confirmatory* studies only, with clear exemptions for exploratory work. This addresses the "dictating method" concern while solving the collective action problem for hypothesis testing.
      *   *Decision:* I will recommend a **targeted mandate**. It acknowledges the validity of the "dictating method" objection by narrowing the scope, while solving the collective action problem for the specific area (confirmatory studies) where QRPs are most damaging.

  3.  **Drafting - Section by Section:**

