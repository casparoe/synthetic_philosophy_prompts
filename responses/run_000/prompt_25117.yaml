      *Let's write.*

      **MEMORANDUM**

      **TO:** Dean of Faculty
      **FROM:** Research Integrity Committee
      **DATE:** October 26, 2023
      **SUBJECT:** Recommendation on Preregistration Policy

      Recent investigations into five laboratories reveal systemic questionable research practices (QRPs), including underpowered studies and selective reporting. The Principal Investigators involved offered a consistent defense: adhering to best practices competitively disadvantages labs regarding publishing speed, student placement, and grant acquisition. They argue that individual integrity is punished within the current incentive structure.

      The Committee agrees with this assessment. The status quo represents a collective action problem: individually rational choices produce a collectively self-defeating equilibrium. Our voluntary preregistration badge system has failed because it relies on unilateral altruism in a competitive environment. Only a binding coordination mechanism can break this trap.

      However, we must also engage the serious objection that a mandate amounts to the university dictating scientific method. Critics argue preregistration suits hypothesis-testing but stifles exploratory, computational, and qualitative research. A blanket mandate risks suppressing innovation and infringing on academic freedom.

      **Recommendation**
      The Committee recommends a **differentiated mandate**.

      1.  **Confirmatory Studies:** Preregistration with a timestamped analysis plan is mandatory for any study explicitly claiming to test hypotheses. Deviations must be flagged and justified in publication.
      2.  **Exploratory Work:** Preregistration remains voluntary for exploratory, computational, or qualitative projects, provided they are clearly labeled as such and do not make confirmatory claims.

      **Rationale**
      This approach resolves the collective action problem without dictating method across the board. By mandating preregistration only for confirmatory work, we eliminate the competitive penalty for integrity where false positives are most damaging. No lab loses grants because they refused to p-hack; all labs operate under the same constraints for hypothesis testing. Simultaneously, by exempting exploratory work, we preserve the flexibility required for discovery and respect disciplinary differences.

      This policy levels the playing field. It signals that the university values credible science over speedy, fragile results. To ensure success, we request funding for administrative support to assist faculty with preregistration platforms and training on distinguishing confirmatory from exploratory designs.

      The voluntary status quo is untenable; a blanket mandate is too blunt. A differentiated policy balances integrity with innovation. We request your approval to draft implementation guidelines by January.

