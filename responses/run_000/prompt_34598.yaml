answer: |-
  The Frege–Geach problem is widely considered the most significant technical hurdle for metaethical expressivism. To understand why, we must distinguish how cognitivism and expressivism treat the semantics of moral language, specifically regarding how meaning is composed in complex logical structures.

  ### 1. Cognitivism and the Ease of Embedding

  For the cognitivist, moral sentences like "Lying is wrong" function like descriptive statements (e.g., "Snow is white"). They express **beliefs** that aim to represent the world, and their meaning is given by their **truth-conditions**.

  This view handles embedding effortlessly because truth-conditional semantics is inherently compositional.
  *   **Simple Sentence:** "Lying is wrong" is true if and only if lying has the property of wrongness.
  *   **Complex Sentence:** "If lying is wrong, then getting your brother to lie is wrong."

  In standard logic, the meaning of the conditional is determined by the truth-values of its parts. Crucially, the antecedent ("lying is wrong") contributes its truth-condition to the complex sentence *without* needing to be asserted as true. The sentence describes a relationship between two propositions. Because propositions have truth-values regardless of whether anyone asserts them, the cognitivist can explain the meaning of the conditional without the speaker actually believing that lying is wrong. Logic is defined as **truth-preservation**: an argument is valid if there is no possible world where the premises are true and the conclusion is false.

  ### 2. The Expressivist Difficulty: Unasserted Contexts

  Expressivism claims that "Lying is wrong" does not describe a fact but expresses a **non-cognitive attitude** (e.g., disapproval or a "Boo!" attitude). Meaning is tied to the psychological state of the speaker.

  The problem arises in unasserted contexts, such as the antecedent of a conditional.
  *   **Sentence:** "If lying is wrong, then getting your brother to lie is wrong."

  When a speaker utters this conditional, they are **not** expressing disapproval of lying. If they were, they would be committed to the claim that lying is wrong, which would make the conditional question-begging or incoherent (one cannot say "If I boo lying..." while actually booing lying).

  However, if the meaning of "Lying is wrong" *just is* the expression of disapproval, and no disapproval is expressed in the antecedent, then the antecedent appears to be meaningless. Yet, intuitively, the antecedent contributes something to the meaning of the whole sentence. The Frege–Geach problem challenges the expressivist to explain what semantic content moral sentences carry when they are not being used to express attitudes directly.

  ### 3. Why the Functionalist Move Fails

  The prompt asks why expressivists cannot simply claim that the attitude expressed by a complex sentence is a function of the attitudes expressed by its parts, analogous to how truth-conditions function.

  **The Nature of Truth-Conditions vs. Attitudes**
  The barrier lies in the fundamental difference between truth-conditions and psychological attitudes:

  1.  **Recursion and Operators:** Logical operators (like "If... then" or "Not") are defined over truth-values. We have a clear recursive definition for how "Not" operates on a truth-value (it flips True to False). We lack an analogous psychological operation for attitudes. What is the attitude of "Not-Boo!"? Is it "Hooray!"? Is it indifference? There is no clear psychological counterpart to logical negation.
  2.  **Assertion vs. Content:** Truth-conditions are properties of *propositions*, which exist independently of assertion. Attitudes are states of *agents*. A cognitivist can separate the content (the proposition) from the force (asserting it). A classic expressivist identifies the meaning *with* the force (the expression of the attitude).
  3.  **Logical Validity:** For the cognitivist, validity is about the preservation of truth. For the expressivist, if moral sentences lack truth-values, standard logical validity cannot apply. If "Lying is wrong" has no truth-value, then *Modus Ponens* (If P then Q; P; therefore Q) cannot be valid in the standard sense, because there is no truth to preserve.

  Therefore, the expressivist cannot simply say the complex attitude is a function of the simple ones because simple attitudes (like disapproval) do not have the structural properties required to feed into logical operators. You cannot construct a conditional out of raw emotions in the same way you construct one out of truth-values.

  ### 4. Expressivist Solutions

  To solve this, expressivists have developed sophisticated semantic theories to "earn the right" to use logical terminology.

  **A. Higher-Order Attitudes (Simon Blackburn)**
  Simon Blackburn, a proponent of **quasi-realism**, suggests that complex moral sentences express **higher-order attitudes**.
  *   To say "Lying is wrong" is to disapprove of lying.
  *   To say "If lying is wrong, then getting your brother to lie is wrong" is not to disapprove of lying. Instead, it is to **disapprove of the combination** of disapproving of lying while *not* disapproving of getting your brother to lie.

  On this view, the meaning of the conditional is a second-order attitude about the consistency of first-order attitudes. This allows the expressivist to explain logical consistency without truth-conditions: a set of moral judgments is inconsistent if it involves holding conflicting higher-order attitudes (e.g., disapproving of a combination of attitudes while simultaneously holding that combination).

  **B. Norm-Expressivism and Plans (Allan Gibbard)**
  Allan Gibbard shifts the focus from emotions to **norms and plans**. For Gibbard, to judge that an act is wrong is to endorse a norm that prohibits it, or to plan against doing it.
  *   Embeddings are handled by analyzing the consistency of plans.
  *   "If lying is wrong, then..." is analyzed in terms of what plans are rational to hold given certain normative assumptions.
  *   Logic is reinterpreted as the study of **consistency in planning**. An argument is valid if accepting the premises (as plans/norms) while rejecting the conclusion creates a state of "plan inconsistency" (akin to cognitive dissonance).

  **C. Expressivist-Friendly Logical Consequence**
  Expressivists redefine logical consequence to fit their framework. Instead of truth-preservation, they define validity in terms of **attitude preservation** or **inconsistency avoidance**.
  *   An argument is valid if it is impossible to hold the attitudes expressed by the premises without holding the attitude expressed by the conclusion.
  *   For example, in *Modus Ponens*, if you disapprove of lying (Premise 2) and you disapprove of the combination of disapproving of lying without disapproving of encouraging it (Premise 1), rationality requires you to disapprove of encouraging it (Conclusion). Failure to do so is a form of practical irrationality, mirroring logical contradiction.

  ### Summary

  The Frege–Geach problem highlights that while cognitivism can rely on the robust, recursive machinery of truth-conditional semantics, expressivism must build a logic out of psychological states. The difficulty is that attitudes do not naturally combine via logical operators the way truth-values do. Expressivists overcome this by moving beyond simple emotivism, arguing that moral language expresses complex, higher-order states of mind (like commitments to consistency in planning or feeling) that mimic the logical behavior of truth-apt propositions.
