      *   Expressivist difficulty: The "unasserted context" issue.
      *   The Functional Block: Attitudes aren't truth-apt; logical operators don't operate on emotions directly.
      *   Solutions: Blackburn's higher-order attitudes, Gibbard's plans, redefining validity.
