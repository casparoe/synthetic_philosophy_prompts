  Here's a thinking process that leads to the explanation of the Frege-Geach problem for expressivism:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Metaethics, specifically Expressivism vs. Cognitivism regarding the Frege-Geach Problem.
      *   **Core Claim of Expressivism:** Moral sentences express non-cognitive attitudes (e.g., disapproval), not beliefs/facts.
      *   **The Problem:** Moral sentences embed in logical contexts (conditionals, negations).
      *   **Specific Tasks:**
          1.  Explain why embeddings are a problem for expressivism but not cognitivism.
          2.  Explain why expressivists can't simply say complex attitudes are functions of simple attitudes (unlike truth-conditions).
          3.  Explain what it is about the *nature of attitudes* vs. *truth-conditions* that blocks this.
          4.  Discuss expressivist solutions (higher-order attitudes, expressivist logic).

  2.  **Initial Brainstorming & Definitions:**
      *   *Cognitivism:* Moral sentences are propositions. They have truth values. Logic works on truth values. "If P then Q" is true/false based on P and Q's truth values.
      *   *Expressivism (Classic/Emotivism):* "Lying is wrong" = "Boo lying!" (Attitude).
      *   *Frege-Geach Problem:* What does "If lying is wrong..." mean? I'm not saying "Boo lying!" in the antecedent. I'm not expressing an attitude there. So what is the meaning?
      *   *Compositionality:* Cognitivists use truth-conditional semantics. The meaning of "If P then Q" is determined by the truth conditions of P and Q. Expressivists need an analogous semantic value for attitudes.
      *   *The Block:* Attitudes are psychological states. You can't just "add" or "functionally combine" psychological states in the same way you combine truth values. If I don't assert the antecedent, I don't hold the attitude. So what semantic content does it carry?
      *   *Solutions:* Blackburn's quasi-realism (higher-order attitudes), Gibbard's norm-expressivism (plans/norms), logical validity defined in terms of consistency of attitudes rather than truth preservation.

  3.  **Drafting Section by Section:**

      *   **Introduction:** Define Expressivism and Cognitivism briefly. State the Frege-Geach problem clearly (the embedding problem).

      *   **Cognitivism vs. Expressivism on Embedding:**
          *   *Cognitivism:* Easy. Sentences express propositions with truth conditions. Logic is truth-preserving. "If P, then Q" works because P and Q have truth values even when unasserted.
          *   *Expressivism:* Hard. Sentences express attitudes. Attitudes are usually tied to *assertion*. In "If P, then Q," I am not asserting P. So I am not expressing the attitude associated with P. If meaning = attitude expressed, the antecedent seems meaningless.

      *   **Why the Functionalist Move Fails (The Core Difficulty):**
          *   The prompt asks: Why can't they say complex attitudes are functions of simple ones?
          *   *Truth-Conditions:* Truth is a property of propositions. It exists independently of assertion. $P \to Q$ is defined by the truth values of $P$ and $Q$.
          *   *Attitudes:* Attitudes are mental states of the speaker *at the time of utterance*.
          *   *The Mismatch:* In a conditional, I don't have the attitude of disapproval toward lying *simpliciter*. I have a conditional commitment. But classic expressivism says meaning *is* the expression of the simple attitude.
          *   *Logical Validity:* Validity is about truth preservation. If expressivism denies truth conditions, how do we define validity? If "Lying is wrong" has no truth value, modus ponens looks broken.
          *   *Specific Point:* You can't define the meaning of "If P then Q" merely by looking at the attitude of "Boo P" and "Boo Q" because the conditional doesn't express "Boo P". It expresses a complex state. The problem is explaining the *consistency* between the complex state and the simple states without appealing to truth.

      *   **Nature of Attitudes vs. Truth-Conditions:**
          *   Truth conditions are *representational* (about the world). They fit together logically because the world is consistent.
          *   Attitudes are *conative/volitional* (about what to do/feel).
          *   The "Negation Problem" (Schroeder): What attitude is expressed by "Lying is not wrong"? Is it "tolerance"? Is it "disapproval of disapproval"? It's hard to map logical operators onto psychological states cleanly.
          *   Key distinction: Truth conditions allow for *unasserted contexts*. Attitudes (traditionally) imply *assertion/commitment*.

      *   **Expressivist Solutions:**
          *   *Blackburn (Quasi-Realism):* Higher-order attitudes. To accept "If lying is wrong, then getting brother to lie is wrong" is to have a higher-order attitude: disapproving of the combination of disapproving of lying but *not* disapproving of getting brother to lie. It's about consistency of attitudes.
          *   *Gibbard (Norm-Expressivism):* Focus on plans/norms rather than raw emotions. Logic becomes about consistency of plans.
          *   *Logical Consequence:* Redefine validity. Instead of "truth preservation," use "attitude consistency" or "inconsistency." An argument is valid if holding the premises' attitudes while rejecting the conclusion's attitude is inconsistent.

  4.  **Refining and Polishing:**
