prompt: |-
  I'm an economist—mechanism design, game theory, the usual toolbox: Bayesian games, correlated equilibrium, types, commitment, pre-play communication, Aumann's agreeing-to-disagree stuff, all that. I keep running into people in the rationalist/decision-theory orbit talking about "evidential cooperation in large worlds" or "acausal trade," and every time I try to read the original material I bounce off hard. It feels like they're gesturing at something my framework already handles (correlated equilibrium? common priors? cheap talk?) but then they insist it's different and spookier because the agents don't causally interact and might not even share a world.

  So here's what I want. Restate the core argument for evidential cooperation in large worlds—the idea that you should cooperate with agents you'll never meet and whose payoffs don't depend on your action, because your decision gives you evidence about what they're doing—in my vocabulary. Bayesian games, correlated equilibrium, types, the distinction between correlation and causation in a game, commitment devices, cheap talk, the whole toolkit. Don't just say "oh it's like a correlated equilibrium" and call it done; actually do the translation step by step. I know my framework, you don't need to explain it to me.

  Then the part I actually care about: give me the residue report. Which pieces of their claim map cleanly onto my vocabulary, which ones you had to stretch or fudge, and which ones have no counterpart at all. And then tell me what you think is going on: are they just reinventing correlated equilibrium with weirder language, or is there a genuine conceptual gap between what my framework can express and what they're pointing at? If there's a gap, whose problem is it—my framework missing something, or their claim being less coherent than it sounds?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Economist, expert in mechanism design, game theory (Bayesian games, correlated equilibrium, types, commitment, cheap talk, Aumann).
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL) / Acausal Trade (rationalist/decision theory community).
      *   **Problem:** The user finds the rationalist literature impenetrable ("spooky," "bounces off hard"). They suspect it overlaps with standard game theory but claims to be distinct.
      *   **Task:**
          1.  Translate the core argument of ECL/acausal trade into standard economic/game theoretic vocabulary (step-by-step, not just a label).
          2.  Provide a "residue report": What maps cleanly? What requires stretching? What has no counterpart?
          3.  Evaluate the gap: Is it just reinvented correlated equilibrium, or is there a genuine conceptual gap? If so, whose fault is it (framework limitation vs. incoherent claim)?

  2.  **Deconstruct "Evidential Cooperation in Large Worlds" (ECL) / Acausal Trade:**
      *   *Core Idea:* Two agents (A and B) are in different causal worlds (or far apart). A's action doesn't *cause* B's action. However, A and B are similar (same algorithm, same priors, same reasoning process). If A cooperates, it is *evidence* that B cooperates. Therefore, A should cooperate to maximize expected utility, even without causal leverage.
      *   *Key Assumptions:* Logical correlation (subjunctive dependence), large universe/multiverse (many copies), decision theories like FDT (Functional Decision Theory) or EDT (Evidential Decision Theory) vs. CDT (Causal Decision Theory).
      *   *The "Spooky" Part:* No communication, no causal link, potentially different physical locations or even counterfactual worlds.

  3.  **Translation Strategy (Game Theory Vocabulary):**
      *   *Agents:* Players in a game.
      *   *Types:* The "algorithm" or "source code" of the agent. In standard GT, types are private information. In ECL, types are logically correlated.
      *   *Correlated Equilibrium (CE):* Usually requires a mediator or common signal. ECL claims correlation arises from *logical identity* or *simulation*.
      *   *Bayesian Games:* Incomplete information. ECL assumes high confidence in the other's type based on one's own type.
      *   *Commitment:* Pre-commitment to a strategy. ECL treats the decision *as* a commitment device.
      *   *The Crucial Distinction:* Causal Decision Theory (CDT) vs. Evidential/Functional Decision Theory (EDT/FDT). In standard econ, we usually assume CDT (maximize utility given causal impact). ECL argues for maximizing utility conditional on the *logical implication* of the decision.

  4.  **Drafting the Translation (Step-by-Step):**
      *   *Setup:* Define a Bayesian Game. Players $i \in \{1, 2\}$. Types $\theta_i$.
      *   *The Twist:* In standard GT, $\theta_1 \perp \theta_2$ (independent) or correlated via a common prior $\mu(\theta_1, \theta_2)$. In ECL, the correlation isn't just probabilistic; it's *logical*. If $\theta_1 = \text{Cooperate}$, then $\theta_2 = \text{Cooperate}$ with probability 1 (or near 1) because they run the same algorithm.
      *   *Equilibrium Concept:* Nash Equilibrium assumes best response to strategies. Correlated Equilibrium assumes best response to a signal. ECL is more like a **Correlated Equilibrium where the correlation device is the agents' own reasoning process.**
      *   *The "Acausal" bit:* Translate to "Subjunctive Dependence." My choice reveals the output of the function $f(\text{input})$. If you run $f(\text{input})$, our outputs match.
      *   *Payoffs:* Standard expected utility. The difference is the probability distribution over outcomes conditional on action. CDT: $P(outcome | do(action))$. EDT/FDT: $P(outcome | action)$.

  5.  **Developing the Residue Report:**
      *   *Clean Maps:* Bayesian updating, Expected Utility Maximization, Correlated Equilibrium (conceptually), Common Priors.
      *   *Stretched/Fudged:* The nature of "Types." In econ, types are draws from nature. In ECL, types are logical facts. The "Correlation Device." In econ, it's external. In ECL, it's internal/logical.
      *   *No Counterpart:* **Subjunctive Dependence / Logical Correlation.** Standard GT treats strategies as independent choices conditional on types. ECL treats strategies as *logically entangled*. Also, the ontology of "Large Worlds" (modal realism vs. physical multiverse) isn't standard econ.
      *   *Decision Theory:* CDT is the default in econ. ECL relies on FDT/EDT. This is the biggest friction point.

  6.  **Evaluating the Gap:**
      *   *Is it just CE?* No. CE requires a mediator or common history. ECL claims correlation arises from logical identity without common history (in the causal sense).
      *   *Is it coherent?* It depends on your philosophy of computation and identity. If you accept that "you" are an algorithm instantiated in multiple places, it's coherent. If you view "you" as a specific physical token, it's nonsense.
      *   *Whose problem?* It's a **Decision Theory** gap, not a Game Theory gap. Econ assumes CDT. Rationalists argue CDT is suboptimal in Newcomb-like problems. The "Gap" is the definition of "Choice." Econ: Choice = physical intervention. Rationalists: Choice = logical output selection.
      *   *Verdict:* The rationalists are pointing at a genuine limitation of CDT in contexts of logical correlation, but they often obscure it with metaphysical baggage. The economist's framework *can* model it if you allow for **Correlated Types with Probability 1** and treat the decision as selecting a *function* rather than an *action*. But standard econ forbids this because it violates the "independence of deviations" assumption in Nash/CDT.

  7.  **Refining the Tone:**
      *   Respect the user's expertise. Don't explain Nash Equilibrium.
      *   Be precise. Use notation where helpful.
      *   Be critical but fair to both sides.
      *   Avoid rationalist jargon (FDT, TDT, Newcomb) without translation.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is it just CE?* A CE requires a signal $\omega$. Here the signal is "my own type." If types are perfectly correlated, it looks like CE. But in standard GT, if I deviate, the other player's strategy doesn't change. In ECL, if I deviate (logically), the other player's output *must* change because it's the same function. This violates the definition of a strategy profile in standard GT where players choose independently.
      *   *Key Insight:* The gap is **Counterfactual Reasoning**. In CDT/Nash, counterfactuals are causal ($do(x)$). In ECL, counterfactuals are logical ($if\ output = x$).
      *   *Mechanism Design angle:* Can we design a mechanism? Not really, because there's no principal. It's self-enforcing via logical necessity.

  9.  **Final Structure:**
      *   **Introduction:** Acknowledge the friction (CDT vs. Logical Correlation).
      *   **Translation:** Map ECL to a Bayesian Game with Logically Correlated Types and Functional Strategies.
      *   **Residue Report:**
          *   Green (Clean): Priors, EU, CE structure.
          *   Yellow (Stretched): Independence of deviations, Nature vs. Logic.
          *   Red (Missing): Subjunctive dependence, Ontology of copies.
      *   **Diagnosis:** It's a Decision Theory dispute (CDT vs. FDT), not just Game Theory. The "Gap" is real but metaphysical. Economists ignore it because it rarely matters in physical markets; Rationalists obsess because they care about AI/Singletons.

  10. (Drafting the response based on these points...) *Ensure I explicitly address the "commitment" and "cheap talk" aspects mentioned in the prompt.*
      *   *Commitment:* In ECL, your source code is the commitment.
      *   *Cheap Talk:* Not needed because the correlation is intrinsic, not communicated.

  11. *Final Polish:* Check for clarity and tone. Ensure the "Residue Report" is distinct and actionable. (Self-correction: Make sure to emphasize that standard econ assumes *causal* independence of actions conditional on types, whereas ECL assumes *logical* dependence).

  12. *Wait, one more thing:* The prompt asks about "Large Worlds." This implies the other agents might not exist in the *same* causal universe. This maps to "States of the World" in Bayesian games, but usually, states are resolved. Here, the state includes "existence of counterpart." Need to clarify that.

