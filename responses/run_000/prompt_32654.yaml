  2.  **Determine the Bottom Line (Conclusion):**
      *   The Moses bridges remain a potent illustration of materialised politics, but primarily as a 'weak' case where social context amplifies technical specifications. The historical inaccuracies weaken the 'strong' claim of inherent determinism but strengthen the insight that politics resides in the *system* of design, not just the individual designer's intent. The artifact's politics are relational, not intrinsic.

  3.  **Drafting - Section by Section:**

      *   **Conclusion (First Paragraph):** State the verdict clearly. The bridges exemplify the 'weak' thesis; their politics are contingent on social context rather than technologically deterministic. The mythologising of Moses obscures the more profound truth: politics embeds itself in standardisation and systemic neglect, not merely villainous intent.

      *   **Theory Illuminating Bridges (Strong vs. Weak):** Winner distinguishes between artifacts requiring specific political relations (strong) and those compatible with some over others (weak). The bridges are 'weak'. A nine-foot clearance doesn't *force* segregation; it merely facilitates it within a car-dependent society. If public transit were prioritised, the bridge height would be a solvable engineering problem, not a barrier. Thus, the politics lie in the *network* (parkways + cars + housing), not the concrete alone.

      *   **Historical Pushback & Intent:** Historians (like Joel Schwartz) argue the low bridges were standard for parkways, not specifically anti-bus, and Moses wasn't solely responsible for every spec. Does this kill the thesis? No. It shifts the locus of politics from individual malice to institutional inertia. If 'standard engineering' excludes certain groups, the standard itself is political. The artifact retains politics even without a smoking gun because the 'neutral' standard reflects existing power hierarchies.

      *   **Bridges Testing Theory (Limits/Blind spots):** The Moses case exposes Winner's tendency to conflate *consequences* with *intent*. By focusing on a singular villain, Winner risks oversimplifying how technical systems evolve. The blind spot is the distinction between intrinsic properties and relational effects. A low bridge in a society with universal basic income and free coach hire loses its segregatory power. Therefore, the politics are not 'in' the artifact essentially, but emerge from the artifact's interaction with social structures. Winner's framework sometimes reifies the technology, ignoring that the 'programme' is written by users and regulators as much as designers.

