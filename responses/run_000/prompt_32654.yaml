  6.  **Drafting - Attempt 2 (Writing):**
      The Robert Moses bridges ultimately validate Langdon Winner's 'weak' thesis rather than the 'strong' claim of technological determinism. While the concrete itself does not inherently mandate segregation, the bridges demonstrate that politics resides in the *system* of design and standardisation rather than solely in individual intent. The historical inaccuracies surrounding Moses do not dismantle the thesis; instead, they refine it, suggesting that artifacts acquire politics through their integration into unequal social structures, not merely through a designer's villainy.

      Winner distinguishes between artifacts that require specific political arrangements (strong) and those merely compatible with them (weak). The parkway overpasses are quintessentially 'weak'. A nine-foot clearance does not technologically necessitate racial exclusion; it simply renders bus access impractical. In a society prioritising public transit, such a specification would be an engineering challenge to overcome, not a fixed barrier. Thus, the politics are not intrinsic to the masonry but emerge from the artifact's relationship with transport policy and housing distribution. The bridge encodes a preference for private ownership, which, in 1930s New York, correlated sharply with race and class.

      The historical pushback—that the clearances were standard engineering practice and Moses's personal intent is unproven—complicates the narrative but sustains the theoretical insight. If we accept that no single actor deliberately weaponised the concrete, the politics shift from individual malice to institutional inertia. 'Standard' specifications are never neutral; they reflect the assumptions of the bodies creating them. If standard parkway design excluded buses, the standard itself was political. Therefore, an artifact retains political properties even without a pinned intent, because the 'choice' to adopt a specific standard over another is a governance decision. The artifact becomes a materialised record of whose needs were deemed normal.

      However, the Moses case exposes blind spots in Winner's framework. By focusing on a singular antagonist, Winner risks conflating *consequences* with *design*. This reifies the technology, implying the politics are locked inside the bridge forever. Yet, if the social context changes—if coach hire were subsidised or routes altered—the bridge's segregatory power diminishes. This reveals that political properties are relational, not essential. Winner's thesis sometimes struggles to distinguish between an artifact's physical constraints and the social rules governing its use. The bridge does not 'have' politics in the way a person holds beliefs; it *enacts* politics when situated within a specific socio-technical system.

      Ultimately, the bridges teach us that looking for politics 'in' the artifact is less fruitful than examining the political economy that produced it. The Moses myth persists because it offers a tidy moral lesson, but the reality is more diffuse: politics embeds itself in the mundane details of engineering codes and zoning laws. Winner's thesis holds, provided we understand that artifacts do not possess agency, but rather crystallise the power dynamics of the society that builds them. The bridge is not the politician; it is the vote cast in concrete.

