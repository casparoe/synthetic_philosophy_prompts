answer: |-
  **The Plan**

  1.  **Board Concept:** Write **"AGENCY (Who holds the power to choose?)"** in the center. Draw a line down the middle. Left side: "Persuasion = Choice Expanded." Right side: "Manipulation = Choice Removed."
  2.  **Real-Life Hook (5 mins):** Use the **"Work Shift Swap"** scenario.
      *   *Persuasion:* "I'll cover your shift next week if you cover mine today." (Trade, clear info, free to say no).
      *   *Manipulation:* "If you were a real friend, you'd do this. Everyone else is letting me down." (Guilt, emotional leverage, hard to say no without social cost).
      *   *Avoid:* Dating scenarios (too awkward/personal) and Political campaigns (too polarizing/exhausted).
  3.  **Text Connection (10 mins):** Have students find one line where Iago offers a "trade" (persuasion) vs. one where he uses "guilt/secrecy" (manipulation). Map these to the board. Focus on Act 3, Scene 3 (the temptation scene).
  4.  **Misconception Head-Offs (3 mins):**
      *   *Misconception:* "Manipulation is always mean/aggressive."
      *   *Head-Off:* Point out Iago is called "Honest." Manipulation often wears a friendly face to lower defenses.
      *   *Misconception:* "If the outcome is bad, it was manipulation."
      *   *Head-Off:* Persuasion can lead to bad outcomes too. The difference is the *method*, not the result.
  5.  **Final Assessment Question (2 mins):** "If Iago had told Othello the absolute truth but used the exact same tone and timing, would Othello still have killed Desdemona?" (Yes/No + Why).

  ***

  **The Reasoning**

  **Board Concept:** "Agency" is the philosophical core without being jargon-heavy. Disengaged juniors tune out definitions like "rhetorical devices" or "ethical frameworks." Framing it as "Power to Choose" makes it about control, which resonates with teenagers who feel controlled by parents/school. The visual split on the board gives them a place to rest their eyes and organize notes without feeling like they're writing an essay.

  **Real-Life Example:** The "Work Shift" scenario is low-stakes but universal. Most juniors work or know someone who does. It isolates the *transaction* from the *emotion*. You avoid dating because it triggers self-consciousness in a mixed-gender class; you avoid politics because half the room will immediately disengage due to fatigue or fear of saying the wrong thing. The "Guilt Trip" is the clearest indicator of manipulated agency—they all know what it feels like to be unable to say "no" because of social pressure.

  **Misconceptions:**
  *   **The "Nice Guy" Trap:** Students often equate manipulation with villainous behavior (yelling, threats). Iago is the antidote to this; he is supportive and calm. You must head this off early, or they will argue Iago is just "advising" because he isn't holding a knife to Othello's throat.
  *   **The "Outcome" Trap:** Juniors love consequentialism (if it works, it's good). You need to sever the link between *result* and *method*. Persuasion can fail; manipulation can succeed. The metric is the integrity of the choice, not the success of the plan.

  **Final Question:** This question forces them to isolate the variable of *information*. If they understand manipulation, they will realize that without the hidden information (the lies about Cassio/Desdemona), Othello's agency was intact. If they say "Yes, he still would have killed her," they haven't grasped that Iago's power came from *withholding* agency, not just influencing emotion. It requires a binary answer followed by evidence, preventing vague nodding.
