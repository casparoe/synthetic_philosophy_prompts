      *   *Activity:* Quick sort of Iago's tactics vs. a friend giving advice.
      *   *Misconception:* "Intent matters most." Head-off: Focus on impact/method.
      *   *Exit Question:* "Did Othello ever have a real choice?"

  4.  **Refining the Elements:**
      *   *Board Concept:* Needs to be punchy. "Agency" is good, but "Hidden Costs" or "Information Asymmetry" might be too academic. Let's go with **"Full Information vs. Hidden Agendas."** Actually, simpler: **"Choice vs. Control."** No, the prompt asks for *one* concept. Let's use **"INFORMED CONSENT."** It's legal/medical but applies here. Or better for teens: **"WHAT THEY KNOW vs. WHAT YOU WANT."** Let's settle on **"AGENCY."** It's the core philosophical difference. Manipulation removes agency; persuasion respects it.
      *   *Real-Life Example:* Needs to be universal. Asking for a raise? Too distant. Convincing friends to skip class? Too risky/illegal. Convincing parents to extend curfew? Good. *Better:* Selling something vs. scamming. *Best:* **Asking a friend for a favor vs. guilt-tripping them.** Everyone has experienced guilt trips.
