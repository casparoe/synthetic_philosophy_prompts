answer: |-
  Right, listen to this. It's for the table, so keep it dry.

  "So, my mate Simon—proper logic boffin, this lad—decides he's going to confirm that 'All ravens are black' without leaving this pub. Says it's all about the equivalence condition.

  I says, 'Go on then.'

  He points at my white napkin. 'See that? Non-black, non-raven. Technically confirms the hypothesis.'

  I says, 'Fine. But what if I wanted to prove that 'All ravens are white'?'

  He says, 'Same logic. Contrapositive is 'All non-white things are non-ravens'. Just need a black non-raven.'

  He points at his pint of stout. 'There. Black, non-raven. Confirms all ravens are white.'

  So I says, 'Hold on. You're telling me my napkin proves ravens are black, and your stout proves ravens are white?'

  He says, 'Technically, yes. Both instances satisfy Nicod's criterion via the contrapositive.'

  I says, 'So we've just proved ravens are both black and white without seeing a single bird?'

  He thinks about that for a proper minute, swirls his pint, and says, 'Well... either that, or confirmation theory is properly buggered.'

  I says, 'Nah, Simon. It's just Edinburgh. Even the ravens are confused here.'"
