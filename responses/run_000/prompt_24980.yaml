answer: |-
  You have put your finger on one of the most persistent and frustrating artifacts of metaethical discourse as it leaks into ordinary argumentation. You are correct that while the *metaphysical* terrain (Williams, Korsgaard, Scanlon, Parfit) is well-mapped, the specific *dialectical maneuver* you are describing lacks a canonical, single-word label in the standard fallacy lexicons.

  However, it is not nameless in the literature of argumentation theory and metaethics. It is best understood as a specific, high-stakes instantiation of the **Motte-and-Bailey Doctrine**, applied to the source of normativity. In metaethical circles, when described rather than named, it is often referred to as **"Unacknowledged Hybridity"** or **"The Internalist-Externalist Slide."**

  If you are looking for a label to use in the classroom that captures both the structure and the stealth, I recommend **"The Normative Motte-and-Bailey."**

  Here is the precise carving you requested, distinguishing this move from ordinary equivocation, burden shifting, and changing the subject.

  ### 1. The Structure: Why it is a Motte-and-Bailey
  The Motte-and-Bailey doctrine (coined by Nicholas Shackel) involves conflating two positions: one that is easy to defend but modest (the Motte), and one that is controversial but desirable (the Bailey).

  In your scenario:
  *   **The Bailey (Desirable):** The Internalist Claim. "Paul has a reason *to act*." This claims normative *grip*. It implies Paul is irrational or imprudent if he doesn't act. It is desirable because it actually guides action and criticizes Paul.
  *   **The Motte (Defensible):** The Externalist Claim. "There is a reason *for the action*." This claims normative *truth*. It implies the action is objectively good. It is defensible because it retreats to abstract moral realism, which is hard to disprove in casual conversation.

  **The Move:** When the interlocutor challenges the grip ("But Paul doesn't care"), the arguer retreats to the Motte ("It's still a reason, objectively!"). When the interlocutor challenges the truth ("Says who?"), the arguer advances to the Bailey ("Well, surely you care about being rational/good!").

  The stealthiness you observe comes from the fact that in natural language, the word "reason" (or "ought") is used for both positions without marking the shift in *extension*.

  ### 2. Distinction from Ordinary Equivocation
  Ordinary equivocation is usually a semantic error (e.g., using "light" to mean both "not heavy" and "photonic"). It is often accidental.

  **The Carving:** The Normative Motte-and-Bailey is **functional equivocation**. It is not merely using a word in two senses; it is leveraging the *pragmatic force* of one sense (Internalist guidance) while claiming the *ontological security* of the other (Externalist truth).
  *   *Test:* If you point out ordinary equivocation, the speaker usually says, "Oh, I meant X." If you point out the Normative Slide, the speaker often insists, "No, it's the *same* point," because the two concepts are functionally fused in their discourse. They resist the distinction because acknowledging it would break the normative force of their argument.

  ### 3. Distinction from Shifting the Burden of Proof
  Shifting the burden of proof involves demanding the opponent disprove your claim rather than you proving it.

  **The Carving:** The Normative Slide does not necessarily shift *who* must prove what; it shifts *what counts as proof*.
  *   In Path A (Internal), proof requires psychological facts about Paul.
  *   In Path B (External), proof requires moral facts about the world.
  *   The fallacy occurs when the arguer treats psychological failure (Paul doesn't see the link) as irrelevant to the existence of the reason, while simultaneously treating the existence of the reason as binding on Paul. They are not asking you to prove a negative; they are changing the criteria for what constitutes a "reason" mid-argument to ensure the claim remains both true and binding.

  ### 4. Distinction from Changing the Subject
  Changing the subject (Ignoratio Elenchi) involves abandoning the original claim for a different one.

  **The Carving:** The subject ("Paul ought to $\phi$") remains grammatically and superficially identical. The *grounding* of the predicate changes.
  *   If I say "Paul ought to $\phi$ because he wants $\psi$" and then switch to "Paul ought to $\phi$ because it is Good," I am still talking about Paul's obligation.
  *   The deception lies in the implication that the *source* of the obligation is continuous. A subject change is obvious ("Paul ought to $\phi$... anyway, have you seen the weather?"). The Normative Slide is insidious because it maintains the *appearance* of continuity while swapping the engine of the argument.

  ### Recommendation for Pedagogy
  Since you are teaching practical reason, you have the luxury of precision. I suggest introducing the term **"The Normative Slide"** to your students, but explicitly mapping it onto the **Motte-and-Bailey** structure for their argumentation toolkit.

  You can describe it thus:
  > "The Normative Slide occurs when an arguer treats 'reasons' as a single category, sliding between **Reasons as Motivating States** (Internal) and **Reasons as Objective Truths** (External) depending on which offers less resistance in the moment, without acknowledging that these two concepts have different conditions of satisfaction."

  This captures the "stealth" you find driving you nuts. It is not just a confusion of terms; it is a refusal to pay the philosophical cost of choosing a metaethical lane. The arguer wants the action-guiding power of Internalism with the error-theory-proof shield of Externalism. Naming this "The Normative Motte-and-Bailey" gives your students a way to flag the move without needing to resolve the entire Williams/Korsgaard debate on the spot.

  It is a dialectical free ride, and calling it out restores the toll booth.
