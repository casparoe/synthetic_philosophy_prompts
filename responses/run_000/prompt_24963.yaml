      *   **Primary Diagnosis:** Premise (3) is false because it relies on a deficient definition of "implementation."
      *   **The Counterfactual Constraint:** Explain that real computation requires supporting counterfactuals (if input were X, state would be Y). Rocks don't do this reliably.
      *   **Causal Structure:** Explain that this doesn't require Platonism, just realism about causal topology.
      *   **Secondary Option:** Rejecting (1) leads to Biological Naturalism (Searle), which preserves intuition but sacrifices multiple realizability.
      *   **Recommendation:** Keep (1), refine (2)/(3).
