  5.  **Identify Alternative Principles (The "Rival Hypotheses"):**
      *   *Principle 1 (The "Hart Doctrine" - Externalities):* Focus on harm to non-participants. (Predicts: RoB).
      *   *Principle 2 (The "Efficiency" View):* Focus on net social wealth destruction vs. transfer. (Predicts: RoB, because noise is pure waste).
      *   *Principle 3 (The "Libertarian/Contractual" View):* Focus on whether the competitors can solve it themselves. In Case 4, she said "agreement within a week." In Case 6, "agreement... could end the practice." If she opposes intervention when they can agree, she might oppose it here too. *Wait, Case 4 she declined support for by-law.* Case 6 says a by-law *could* end it. Does she prefer voluntary agreement? In Case 1, she endorsed the quota scheme (likely regulatory). In Case 2, implied tragedy (states can't easily agree).
