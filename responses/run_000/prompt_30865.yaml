          *   Fits 5 (workers are participants in the labor market, but arguably beneficiaries).
      *   *Hypothesis C (Irreversibility/Resource Destruction):* RoB requires the destruction of a shared capital stock or irreversible damage.
          *   Fits 1 (fish stock collapsed).
          *   Fits 2 (lives lost, war damage).
          *   Fits 3 (money spent, but reversible next term).
          *   Fits 4 (sleep lost, but reversible).
          *   Fits 5 (money transferred, not destroyed).
      *   *Hypothesis D (The "Moloch" Specificity):* Moloch isn't just competition; it's competition that *destroys the value of the arena itself* for everyone, including the winners, often trapping them.
          *   But in Case 5, firms are trapped but value is transferred.
          *   In Case 4, shopkeepers are trapped but it's their choice.
          *   Miriam seems to care about *who pays the price*.

      *   *Refining the Distinction:*
          *   Case 4 is the trickiest. Shopkeepers harm themselves (exhaustion) for no gain. Why isn't this RoB? Miriam says: "Own sleep to lose." This implies *consent* or *internalization of costs*.
          *   Case 5: Firms harm themselves (margins) but engineers gain. This is *redistribution*, not *destruction*.
          *   Case 1 & 2: The costs are not just internalized; the *system* breaks (fish gone, war started) and *innocents* pay.

      *   *Leading Candidate Principle:* **The Principle of Non-Consensual Externalized Destruction.**
          *   A competition is a "Race to the Bottom" only if:
              1.  It results in net value destruction (not just transfer).
              2.  The costs are borne by parties who did not voluntarily enter the competition (third parties) OR the damage is irreversible to the shared environment.
              3.  Individual rationality leads to collective ruin *that spills over*.
