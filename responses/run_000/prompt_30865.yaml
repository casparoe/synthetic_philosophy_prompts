          *   *If Hart says RoB:* She prioritizes Third Party Harm over Consumer Benefit.
          *   *If Hart says Not RoB:* She prioritizes Net Economic Efficiency.
          *   *Actually, the cleanest split is between the "Externality Principle" and the "Irreversibility Principle."*
          *   *Case:* **The "Flickering Sign" Case.** Two shops use strobe lights to attract attention. Epileptic risk to passersby. No sales gain. Reversible (turn off lights).
          *   *If RoB:* Externality is key (matches Case 6 prediction).
          *   *If Not RoB:* Irreversibility is key (matches Case 1 & 2 pattern).
          *   *This is good.* It tests whether the *permanence* of the damage matters or just the *location* of the damage.

  8.  **Final Polish:**
