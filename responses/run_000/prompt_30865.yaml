  6.  **Select the Best Fit for Miriam:**
      *   Miriam is a "competition economist." She likely distinguishes between *productive competition* (Case 5), *futile but internal competition* (Case 4), and *destructive systemic competition* (Case 1 & 2).
      *   The crucial pivot is Case 4 vs. Case 6. They are identical except for the victim. In Case 4, the victim is the competitor. In Case 6, the victim is the neighbor.
      *   Miriam's comment in Case 4 ("own sleep to lose") is the key. It implies agency and ownership of the cost.
      *   Therefore, her principle is likely: **"A Race to the Bottom exists when competitive escalation externalizes net costs onto non-consenting third parties or destroys the shared commons."**
      *   This makes her a defender of the *market's boundaries*, not necessarily the *market's participants*.

