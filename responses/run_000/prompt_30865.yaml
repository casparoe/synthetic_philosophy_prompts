  3.  **Synthesize Candidate Principles:**
      *   *Observation:* What distinguishes the "Yes" cases (1 & 2) from the "No" cases (3, 4, & 5)?
      *   *Hypothesis A (Net Social Utility):* RoB occurs when the *aggregate* welfare decreases significantly, especially involving third parties.
