answer: |-
  This is a compelling character constraint. Miriam Hart's rulings suggest she is not a dogmatic libertarian nor a heavy-handed regulator, but a precise classifier of *systemic failure*. To make the late scene feel earned, her principle must be consistent enough to be predictable, yet nuanced enough to require her specific expertise to apply.

  Based on the five past rulings, here is an analysis of the candidate principles, their predictions for your new case, and the specific test case that would definitively reveal her true logic.

  ### 1. The Candidate Principles

  There are two competing principles that fit her past five rulings equally well. The tension between them is where the dramatic interest lies.

  **Principle A: The Irreversibility Doctrine (The "Moloch" Standard)**
  *   **Definition:** A situation is only a "Race to the Bottom" if the competitive escalation leads to the permanent or near-permanent destruction of value (capital, life, or ecosystem). Temporary losses or reversible exhaustion do not count.
  *   **Logic:** Moloch demands sacrifice. If the sacrifice can be taken back (sleep recovered, money re-earned), it is merely a mistake, not a trap.
  *   **Fit with Past Rulings:**
      *   *Fishing (Yes):* Stock collapse is hard to reverse.
      *   *War (Yes):* Death and destruction are permanent.
      *   *Trainers (No):* Money is spent, but the game resets each term.
      *   *Shop Hours (No):* Sleep is recoverable; hours can be wound back.
      *   *Salaries (No):* Margins are financial transfers, not destruction.

  **Principle B: The Externality Doctrine (The "Hart" Standard)**
  *   **Definition:** A situation is a "Race to the Bottom" if the costs of the competition are **externalized** onto non-consenting third parties. If the competitors bear the full cost of their escalation (even if foolish), it is not a systemic failure.
  *   **Logic:** Competition is virtuous when risks are internalized. It becomes pathological (Moloch) when competitors gamble with other people's chips.
  *   **Fit with Past Rulings:**
      *   *Fishing (Yes):* The town and ecosystem paid for the fishermen's greed.
      *   *War (Yes):* Civilians paid for the states' insecurity.
      *   *Trainers (No):* "Nobody outside the competition was much affected."
      *   *Shop Hours (No):* "Shopkeepers' own sleep to lose." (Costs internalized).
      *   *Salaries (No):* Engineers (participants) benefited; costs were transfers, not externalities.

  ### 2. Predictions for the New Case (Amplified Advertising)

  **The Scenario:** Shops escalate volume. No gain in custom. Residents (third parties) suffer noise nuisance. Reversible via by-law.

  *   **Under Principle A (Irreversibility):** Miriam would rule **NOT a Race to the Bottom.**
      *   *Reasoning:* The noise stops when the speakers are turned off. No physical capital is destroyed. The shopkeepers are wasting their own money on electricity and equipment. Like the sleep in Case 4, the nuisance is temporary. She would likely oppose the by-law, suggesting the residents lobby the shopkeepers directly.
  *   **Under Principle B (Externality):** Miriam would rule **IS a Race to the Bottom.**
      *   *Reasoning:* This is Case 4 (Shop Hours) with one critical variable changed: the victim. In Case 4, the shopkeepers harmed themselves. Here, they are harming the residents to gain an advantage that does not exist. The cost is externalized. She would support the by-law as a necessary boundary enforcement.

  ### 3. My Best Guess: Principle B (The Externality Doctrine)

  I believe Miriam Hart follows **Principle B**. She would rule this **a Race to the Bottom and support the by-law.**

  **Reasons for this preference:**

  1.  **The "Own Sleep" Comment:** In Case 4, her specific phrasing ("own sleep to lose") highlights *ownership of the cost*, not the *duration of the cost*. If irreversibility were her main metric, she would have commented on the recoverability of sleep. Instead, she commented on the *agency* of the shopkeepers.
  2.  **The Definition of Moloch:** In game theory and economics, a Moloch problem (or multi-polar trap) is defined by misaligned incentives that lead to suboptimal outcomes. While destruction is often a result, the defining feature is that individual rationality leads to collective *harm*. In Case 5, the collective outcome was actually positive for the engineers (wealth transfer). In Case 4, the collective outcome was neutral for the public. In the New Case, the collective outcome is negative for the public.
  3.  **Character Consistency:** A character who cares only about irreversible damage (Principle A) is a conservationist or a historian. A character who cares about *who pays the price* (Principle B) is an **economist**. Miriam's distinction in Case 5 (margins squeezed vs. engineers benefit) proves she tracks wealth distribution, not just physical destruction.
  4.  **The Narrative Arc:** If she follows Principle A, her ruling on the new case is a "No," which feels like a repetition of Case 4. If she follows Principle B, she distinguishes Case 4 from Case 6 based on the *victim*, which allows for a moment of moral clarity in your late scene. It shows she isn't just "anti-regulation" or "pro-regulation," but pro-*accountability*.

  **Her Likely Ruling:**
  *"In the matter of opening hours, the shopkeepers were betting their own stamina. Here, they are betting the residents' sanity. When the cost of competition is exported to those who did not place the bet, the market has failed. The by-law is justified."*

  ### 4. The Discriminating Case

  To be absolutely certain (and to give yourself a tool to test her consistency in future drafts), you need a case that separates **Externality** from **Irreversibility**.

  **The Proposed Case: The "Strobe Light" Competition**
  Two rival nightclubs install increasingly powerful strobe lights to attract attention from the highway.
  *   **The Escalation:** The lights become so intense they trigger seizures in epileptic passersby and disrupt traffic safety.
  *   **The Gain:** Neither club sees an increase in customers (the lights are equally blinding).
  *   **The Reversibility:** The lights can be turned off instantly at negligible cost.
  *   **The Harm:** Serious medical risk to non-consenting third parties (drivers, pedestrians).

  **Why this discriminates:**
  *   **If Miriam rules NOT a Race to the Bottom:** She follows **Principle A (Irreversibility).** The harm is reversible (turn off the lights), so it doesn't meet the threshold of "Moloch" despite the third-party harm.
  *   **If Miriam rules IS a Race to the Bottom:** She follows **Principle B (Externality).** The harm is externalized to non-consenting parties, regardless of whether the damage is permanent.

  **Recommendation for your Novel:**
  If you want Miriam to be a protector of the "civic commons," have her rule the Strobe Light case as a **Race to the Bottom**. This cements her principle as: **"Competition is free only so long as the bill does not arrive at a neighbor's door."**

  This makes her support for the Amplified Advertising by-law in your late scene robust. It is not about the noise; it is about the *theft of quiet* from those who did not agree to the game.
