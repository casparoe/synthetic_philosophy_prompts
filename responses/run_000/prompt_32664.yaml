      *   *Option 3: Teletransportation (Parfit).* Good, but complex to explain quickly.
      *   *Option 4: The "Experience Machine" (Nozick).* Very strong candidate. It deals with happiness vs. reality. Framing can easily shift whether "reality" sounds noble or pointless.
      *   *Option 5: A custom scenario.* Allows total control over variables.
      *   *Decision:* Let's go with a custom scenario based on the *Experience Machine* structure but modernized to avoid prior knowledge. Let's call it "The Simulation Internship." It involves a choice between a difficult real task and a perfect simulated success. This touches on achievement, authenticity, and welfare—ripe for framing.
      *   *Refinement:* Actually, to make it punchier for a 75-minute class, a moral responsibility case might be sharper. Let's try a variation on *Frankfurt Cases* or *Manipulation Arguments*, but simplified.
      *   *Better Decision:* Let's stick closer to Dennett's own style. He often uses biological/evolutionary examples or simple decision scenarios. However, for *framing*, we need emotional valence.
      *   *Winner:* **The "Memory Edit" Scenario.** It's structurally identical to the Experience Machine but framed around trauma relief vs. authenticity. Or, even better, a **Responsibility/Agency** case. Let's go with a **Negligence/Accident** case. It allows for "foregrounding" different causal chains.
      *   *Wait, one more consideration:* The prompt asks for *narrative framing, vividness, rhetorical structure*. A moral dilemma is best for this. Let's use a variation of the **Knobe Effect** structure (Side-Effect Effect) but embedded in a narrative.
      *   *Final Choice:* **The "Algorithmic Hiring" Case.** It's contemporary, relatable, and allows for framing around "efficiency" vs. "bias" or "tool" vs. "agent."
      *   *Actually, let's look at the "Intuition Pump" specific requirement.* Dennett emphasizes that TEs are often *stories*. Let's create a scenario about **Personal Identity/Continuity** (like Teletransportation) but framed as **Medical Treatment** vs. **Tech Upgrade**.
      *   *Re-evaluating:* The *Experience Machine* is the classic for this. Let's adapt it to be less recognizable. "The Satisfaction Serum."
      *   *Okay, let's go with the "Satisfaction Serum" (adapted Experience Machine).*
      *   *Version A (Medical/Therapeutic Frame):* Focus on healing, relief from suffering, doctor recommendation.
      *   *Version B (Hedonic/Artificial Frame):* Focus on escapism, faking it, disconnecting from truth.
      *   *Structure:* Both involve taking a substance that makes you feel you achieved X, when you didn't, but you are happy.
      *   *Wait, is that too obvious?* If one says "doctor" and one says "drug dealer," students will spot the manipulation immediately. The framing needs to be subtler.
      *   *Let's try a Causal Responsibility Case (The "Broken Window" variant).*
      *   *Scenario:* A person leaves a window open. A storm comes. A tree falls. Damage occurs.
      *   *Version A:* Focus on the *foreseeability* of the storm. (Negligent).
      *   *Version B:* Focus on the *unpredictability* of the tree path. (Accident).
      *   *Problem:* This changes the *facts*, not just the framing. The prompt says "same underlying structure."
      *   *Okay, strict constraint:* **Same facts, different order/valence/labels.**
      *   *Scenario:* **The "Autonomous Vehicle" Decision.**
      *   *Facts:* Car must swerve. Option 1 hits a barrier (passenger dies). Option 2 hits a pedestrian (pedestrian dies). Car is programmed to save passenger.
      *   *Version A (Safety Feature Frame):* "Protective Shield Protocol." Focus on the buyer's right to safety.
      *   *Version B (Risk Imposition Frame):* "Risk Deflection Algorithm." Focus on the pedestrian's exposure to danger.
      *   *This works.* It's the same algorithm. Same outcome. Different linguistic framing.

      *   *Wait, let's make it even more "Dennettian".* Dennett loves evolution and biology. But for undergrads, a moral/agency case is often more visceral for "intuition."
      *   *Let's go with the "Memory Modification" case (similar to Experience Machine but less iconic).*
      *   *Scenario:* You can erase a painful memory of a failure.
      *   *Version A:* "Cognitive Therapy." Focus on mental health, moving forward, clinical setting.
      *   *Version B:* "Reality Editing." Focus on falsifying history, self-deception, tech startup setting.
      *   *Underlying Structure:* You pay money. A procedure occurs. You no longer remember the failure. You feel better. The failure actually happened.
      *   *This is perfect.* It hits on authenticity vs. well-being.

  3.  **Drafting the Versions:**
      *   *Version A (Therapeutic):* Use words like "integration," "healing," "burden," "clinician." Order: Start with the pain, end with the relief.
      *   *Version B (Technological):* Use words like "overwrite," "glitch," "simulation," "vendor." Order: Start with the tech, end with the falsification.
      *   *Crucial:* Ensure the *facts* are identical. (Cost, permanence, nature of the memory, nature of the event).

  4.  **Designing the Procedure:**
      *   Total Time: 75 mins.
      *   Intro: 5 mins (neutral).
      *   Reading/Response: 10 mins.
      *   Small Group Discussion: 15 mins.
      *   Plenary/Reveal: 15 mins.
      *   Debrief/Dennett Connection: 25 mins.
      *   Wrap up: 5 mins.
      *   *Correction:* The prompt asks for specific timing in the procedure section. I need to be precise.
      *   *Reveal Strategy:* Don't say "I tricked you." Say "Compare your texts." Let *them* find the structural identity.

  5.  **Designing the Debrief:**
      *   Connect to Dennett's "Intuition Pumps."
      *   Key concepts: Salience, Order of Presentation, Labeling.
      *   Philosophical implication: Can we trust intuitions generated by TEs? Do we need to "calibrate" the pump?
      *   Critique: Is this a bug or a feature? (Dennett says we need to know how they work to use them well).

  6.  **Troubleshooting:**
      *   Risk 1: Students spot the difference too early. (Mitigation: Seat separation).
      *   Risk 2: Students think the *facts* are different. (Mitigation: Highlight specific sentences during reveal).
      *   Risk 3: Cynicism ("Philosophy is just rhetoric"). (Mitigation: Emphasize that *all* argument has rhetoric; the goal is vigilance).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Are the versions truly structurally identical?
      *   *Version A:* "Procedure costs $500." "Memory of failing the exam is removed." "You feel confident."
      *   *Version B:* "Service costs $500." "Record of failing the exam is altered." "You feel confident."
