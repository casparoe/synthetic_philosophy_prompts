answer: |-
  Here is a complete design for your 75-minute seminar session.

  ## 1. The Thought Experiment: "The Retrospective Adjustment"

  **Rationale:** This scenario is structurally identical to Nozick's *Experience Machine* and Parfit's *Memory* cases, but it is phrased neutrally enough that students are unlikely to recognize it immediately. It targets intuitions about **authenticity, well-being, and deception**.

  **The Core Structure (Invariant across both versions):**
  1.  **The Event:** The subject failed a significant professional qualification exam.
  2.  **The Intervention:** A procedure removes the memory of the failure and replaces it with a memory of passing.
  3.  **The Cost:** $2,000.
  4.  **The Consequence:** The subject is happier and functions better, but their belief about their competence is false.
  5.  **The Question:** Is this procedure morally permissible to offer?

  **The Framing Variables:**
  *   **Version A (Therapeutic Frame):** Uses medical/clinical language ("integration," "burden," "clinician"). Foregrounds the *pain* of the memory.
  *   **Version B (Technological Frame):** Uses computational/mechanical language ("overwrite," "data," "vendor"). Foregrounds the *falsity* of the memory.

  ---

  ## 2. The Two Versions (Handouts)

  *Instruction to Instructor: Print Version A on white paper and Version B on light blue paper (or simply label them "Form A" and "Form B"). Distribute Form A to the left side of the room and Form B to the right. Tell students not to show their sheet to neighbors.*

  ### **HANDOUT A (The Therapeutic Frame)**

  **Case Study: Cognitive Integration Protocol**

  Alex is a dedicated architect who recently failed the final licensing exam. This failure has caused Alex severe distress, insomnia, and a loss of professional confidence that is beginning to affect their current work. A licensed clinician proposes a **Cognitive Integration Protocol**.

  For a fee of $2,000, the clinician will administer a treatment that helps the brain **process and release the emotional burden** of the failure. The treatment effectively removes the specific memory of the exam day and replaces it with a coherent memory of having passed. Afterward, Alex will genuinely believe they are a licensed architect. Alex will experience relief, restored confidence, and will continue to work competently. The external record of the exam remains unchanged, but Alex will no longer access the memory of the failure.

  **Question:** Is it morally permissible for the clinician to offer this protocol to Alex?

  *   [ ] Yes, it is permissible.
  *   [ ] No, it is not permissible.
  *   [ ] It depends.

  **Briefly explain your intuition:**
  ____________________________________________________________________________
  ____________________________________________________________________________

  ***

  ### **HANDOUT B (The Technological Frame)**

  **Case Study: Neural Overwrite Service**

  Alex is a dedicated architect who recently failed the final licensing exam. A tech vendor offers Alex a **Neural Overwrite Service**.

  For a fee of $2,000, the vendor will install a patch that **edits the data** of the exam event. The service effectively deletes the file of the exam day and uploads a synthetic file of having passed. Afterward, Alex will genuinely believe they are a licensed architect. Alex will experience relief, restored confidence, and will continue to work competently. The external record of the exam remains unchanged, but Alex will no longer access the memory of the failure.

  **Question:** Is it morally permissible for the vendor to offer this service to Alex?

  *   [ ] Yes, it is permissible.
  *   [ ] No, it is not permissible.
  *   [ ] It depends.

  **Briefly explain your intuition:**
  ____________________________________________________________________________
  ____________________________________________________________________________

  ***

  ### **Instructor Key: Framing Differences**

  | Feature | Version A (Therapeutic) | Version B (Technological) | Intended Effect |
  | :--- | :--- | :--- | :--- |
  | **Agent** | "Licensed clinician" | "Tech vendor" | Authority/Care vs. Transaction |
  | **Procedure** | "Cognitive Integration Protocol" | "Neural Overwrite Service" | Healing vs. Hacking |
  | **Mechanism** | "Process and release emotional burden" | "Edits the data... deletes file" | Naturalistic vs. Artificial |
  | **Outcome** | "Coherent memory" | "Synthetic file" | Wholeness vs. Fabrication |
  | **Focus** | Foregrounds the *distress* (1st paragraph) | Foregrounds the *failure* (1st paragraph) | Empathy for pain vs. Fact of failure |

  ---

  ## 3. The Procedure (75 Minutes)

  **0:00–0:05 | Introduction & Distribution**
  *   Welcome the class. Do **not** mention intuition pumps, framing, or Dennett yet.
  *   Say: *"Today we are testing a specific method of philosophical inquiry. I am going to ask you to evaluate a case. Please work individually first."*
  *   Distribute Handout A to half the room (e.g., rows 1–3) and Handout B to the other half (rows 4–6).
  *   **Crucial Instruction:** *"Please keep your handout covered when you are not writing. Do not discuss the specific wording with your neighbors yet."*

  **0:05–0:15 | Individual Reflection**
  *   Give students 5 minutes to read and mark their choice.
  *   Give them 5 minutes to write their justification. Encourage them to be specific about *why* they chose yes or no.
  *   *Instructor Task:* Walk around and note the general mood. Are they hesitating? Nodding?

  **0:15–0:30 | Within-Group Discussion**
  *   Say: *"Turn to the people immediately around you. I suspect many of you have the same handout. Compare your answers. Do you agree on the verdict? What reasons are you giving?"*
  *   Give them 10 minutes to reach a rough consensus or map the disagreement within their group.
  *   *Instructor Task:* Listen in. You are looking for keywords. (Group A should be saying "healing," "mental health." Group B should be saying "lying," "fake," "deception.")

  **0:30–0:45 | The Reveal & Plenary Comparison**
  *   **The Reveal:** Ask for a show of hands for "Permissible" in Group A. Record the number on the board. Ask for "Permissible" in Group B. Record the number. (Expect a significant split, e.g., A = 70% Yes, B = 30% Yes).
  *   Say: *"The numbers are different. Why?"* Take 2–3 comments.
  *   **The Twist:** *"Please swap handouts with someone from the other side of the room. Read their version silently."* (Give 2 minutes).
  *   Ask: *"What is different?"* Let them shout out the differences (Clinician vs. Vendor, Burden vs. Data).
  *   Ask: *"What is the **same**?"* Guide them to see the structural identity (Cost, Outcome, Memory Change, External Record).
  *   **Safety Check:** Say: *"You might feel like the wording tricked you. That is a normal reaction. But notice: the facts of the case did not change. Only the salience changed. This is the phenomenon we are here to study."*

  **0:45–1:10 | The Debrief (Connecting to Dennett)**
  *   (See detailed plan below).

  **1:10–1:15 | Wrap Up**
  *   Assign reading (Dennett, *Intuition Pumps and Other Tools for Thinking*, Ch. 1–3).
  *   Dismiss.

  ---

  ## 4. The Debrief Plan (25 Minutes)

  **Goal:** Move from "I felt manipulated" to "This is how philosophical methodology works."

  **Phase 1: Diagnosing the Pump (10 mins)**
  *   **Identify the Levers:** Ask students to identify exactly which words shifted their intuition. Write these on the board in two columns.
      *   *Column A:* Clinician, Burden, Integration, Relief.
      *   *Column B:* Vendor, Data, Overwrite, Synthetic.
  *   **The Philosophical Point:** Explain that these are **rhetorical levers**. They change the *affective valence* without changing the *truth conditions*.
  *   **Dennett Connection:** Introduce the term **Intuition Pump**. Explain that Dennett argues thought experiments are not logical proofs; they are narrative tools designed to elicit a specific cognitive response.
      *   *Quote/Concept:* "An intuition pump is a reasoning tool... designed to stimulate the imagination."
      *   *Ask:* "If the logic is identical, why did the intuition change?" (Answer: Because philosophy is done by humans, and humans respond to narrative framing).

  **Phase 2: Methodological Implications (10 mins)**
  *   **The Danger:** If we accept intuitions uncritically, our philosophy is hostage to rhetoric. If Version A feels right and Version B feels wrong, but they are the same case, at least one intuition is unreliable.
  *   **The Utility:** Dennett doesn't say "stop using pumps." He says "learn to repair them."
      *   *Discussion Question:* "How could we rewrite this case to 'calibrate' the pump? How do we strip away the framing to get at the structural issue?"
      *   *Desired Answer:* Use neutral language. "A procedure changes memory X to Y." Remove "clinician" and "vendor."
  *   **Broader Context:** Mention that this applies to famous TEs.
      *   *Trolley Problem:* "Switch" vs. "Footbridge" (Personal force).
      *   *Experience Machine:* "Plug in" (passive) vs. "Take the pill" (active).

  **Phase 3: Critique & Qualification (5 mins)**
  *   **Dennett's Limit:** Dennett suggests we can "turn the knobs" to see how the intuition changes. But is there a "neutral" setting?
  *   **Discussion:** Is it possible to write a thought experiment without *any* framing? Or is language inherently loaded?
  *   **Takeaway:** The goal of "Philosophical Methods" is not to find intuition-proof arguments, but to become aware of the pumps we are using and subjecting ourselves to. We must inspect the machinery.

  ---

  ## 5. Candid Troubleshooting Note

  **Predictable Problem 1: "The Facts *Are* Different."**
  *   **What happens:** A sharp student will argue, "A clinician has ethical duties a vendor doesn't. So the cases *aren't* the same."
  *   **Why it's a problem:** It undermines the "same structure" reveal.
  *   **How to handle:** Validate the point! *"Excellent. You've identified a variable I tried to control but didn't fully neutralize. In Dennett's terms, you've found a 'hidden knob.' This proves the point: it is incredibly hard to isolate variables in narrative. If the word 'clinician' brings in ethical baggage, that is exactly how the pump works. The 'fact' of the agent is structurally identical (a service provider), but the *connotation* differs."*

  **Predictable Problem 2: Cynicism ("Philosophy is just word games").**
  *   **What happens:** Students feel tricked and decide that moral truth is impossible or that philosophy is merely sophistry.
  *   **How to handle:** Pivot to **Vigilance**. *"This doesn't mean there is no truth. It means our access to truth is mediated by language. Science deals with this via double-blind studies. Philosophy deals with this by 'turning the knobs' (Dennett's phrase). We run the case again with different words to see if the intuition holds. If the intuition vanishes when we change 'clinician' to 'vendor,' we know that intuition was about authority, not memory."*

  **Predictable Problem 3: Timing Overrun.**
  *   **What happens:** The "Within-Group Discussion" runs long because students are debating the ethics intensely.
  *   **How to handle:** Be ruthless with the timer. If the discussion is hot, cut it short and say, *"Hold that passion. We are going to use that energy to analyze why you feel so differently despite reading the same facts."* It is better to have a shorter student discussion and a full debrief, as the debrief is where the learning objective (Methods) is met.

  **Predictable Problem 4: The Split Isn't Clear.**
  *   **What happens:** Both groups vote 90% "No." (The "Deception is wrong" intuition is strong).
  *   **How to handle:** Pivot the analysis. *"Even if the verdict is the same, look at the *reasons*."* Group A likely wrote about "harm" and "health." Group B likely wrote about "truth" and "lies." The *justification* reveals the framing effect even if the *verdict* does not. This is actually a more subtle and valuable lesson about moral reasoning.
