prompt: |-
  I'm putting together a syllabus for a grad seminar on social norms and I want to pair Lewis's Convention with Golding's Lord of the Flies. The idea is to treat the island as a kind of uncontrolled experiment: you've got a group of children with no shared history (well, some from school) who have to build social order from scratch, and we get to watch both the construction and the collapse.

  Here's the specific thing I'm stuck on. Lewis's account says a convention is a regularity in behavior that solves a recurrent coordination problem, where everyone prefers to conform conditional on others conforming, and there's an alternative regularity that would also work. The conch rule is a textbook case — it's arbitrary (you could use a stick, a raised hand), it solves a coordination problem (who speaks when), and everyone does better following it than talking over each other.

  But the novel also shows something that doesnt fit neatly: the conventions become normative really fast. When Jack smashes the conch, it's not just that coordination fails — it's that something sacred has been violated. The boys treat the rules as having a kind of weight that goes beyond "this is the equilibrium we happen to be in." And the breakdown isn't a shift to a different equilibrium; it's a descent into something that isn't governed by convention at all — fear, hunting, the lord of the flies.

  So here's what I want to know: can a Lewisian framework handle the normative dimension of the boys' conventions — the way the rules feel binding, not just useful? Lewis does talk about conventions becoming norms when supported by sanctions, but that seems to miss the phenomenology: the boys don't follow the conch rule because they're afraid of punishment, at least not at first. They follow it because it feels like the right thing to do, and when it breaks, something breaks in them too. Is Lewis just leaving out the moral psychology, or is there a deeper problem — that his account of convention can't explain why we ever come to treat arbitrary coordination solutions as anything more than that?

  And the second thing: the collapse. In Lewis's picture, conventions are self-enforcing as long as the underlying preferences hold. But in the novel, the preferences themselves seem to shift — not because the coordination problem changes, but because fear and hunger and the sheer absence of adult authority change what the boys care about. Does Lewis's theory have the resources to explain how conventions can be undermined by changes in the broader motivational landscape, or does it assume a kind of stability in preferences that the novel shows we can't count on?

  I guess I'm asking for a reading of the novel that takes Lewis seriously but also lets the novel talk back — where does it confirm the theory, where does it complicate it, and what would Lewis have to add to his account to make sense of what happens on the island?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar syllabus on social norms.
      *   **Pairing:** David Lewis's *Convention* (1969) + William Golding's *Lord of the Flies* (1954).
      *   **Core Idea:** Treat the island as an uncontrolled experiment in building/collapsing social order.
      *   **The Problem:**
          1.  *Normativity:* Lewis defines conventions as arbitrary equilibria solving coordination problems. But in the novel, conventions (like the conch) quickly become *normative* (sacred, binding) rather than just useful. When broken, it feels like a moral violation, not just a coordination failure. Lewis mentions sanctions, but the boys follow rules because they feel *right*, not just out of fear. Is Lewis missing moral psychology?
          2.  *Collapse/Preference Shift:* Lewis assumes conventions hold as long as preferences hold. In the novel, preferences *change* (fear, hunger, savagery). The coordination problem doesn't change, but the desire to solve *that* problem diminishes in favor of other drives. Can Lewis explain this endogenous shift in preferences, or does he assume stability the novel denies?
      *   **Goal:** A reading that takes Lewis seriously but lets the novel critique/expand him. Where do they align? Where do they diverge? What would Lewis need to add?

  2.  **Deconstruct the Lewisian Framework:**
      *   *Definition:* Regularity $R$ in population $P$ in circumstance $C$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects others to conform.
          3.  Everyone prefers to conform *if* others conform (conditional preference).
          4.  There is an alternative $R'$.
          5.  Common knowledge of 1-4.
      *   *Normativity:* Lewis is a Humean. He tries to reduce normativity to preferences and expectations. He acknowledges "norms" emerge when conventions are backed by sanctions or internalized, but his core account is game-theoretic, not moral.
      *   *Stability:* Conventions persist as long as the coordination problem persists and preferences remain aligned.

  3.  **Deconstruct *Lord of the Flies* (Relevant to Norms):**
      *   *The Conch:* Starts as a tool (coordination: who speaks). Becomes a symbol (authority, order, civilization).
      *   *The Collapse:* It's not just a shift to a new convention (e.g., raising hands instead of conch). It's a rejection of the *type* of game being played (coordination/cooperation vs. dominance/survival).
      *   *The "Beast":* Represents the shift in preferences (fear overrides order).
      *   *Jack vs. Ralph:* Jack offers a different coordination point (hunt/safety through strength) but ultimately dissolves convention into tyranny/charisma.

  4.  **Synthesize: Addressing Question 1 (Normativity):**
      *   *Lewis's Limit:* Lewis explicitly avoids moral obligation. He distinguishes "ought" of rationality (given preferences) from moral "ought."
      *   *The Novel's Insight:* The conch becomes a *symbol*. Lewis treats signals as arbitrary. But symbols accumulate history/meaning. The conch isn't just a token; it's a totem.
      *   *Bridge:* Lewis talks about *precedent*. Precedent creates expectation. But Golding shows precedent creates *identity*. Following the conch isn't just "I want to be heard"; it's "I am a civilized boy."
      *   *Critique:* Lewis's account is too thin on *internalization*. The boys don't just calculate; they feel shame or sanctity. Lewis needs a supplement (perhaps from Bicchieri or Brennan/Eriksson) on normative expectations vs. empirical expectations.

  5.  **Synthesize: Addressing Question 2 (Collapse/Preference Shift):**
      *   *Lewis's Assumption:* Preferences are exogenous and stable *for the duration of the convention*.
      *   *The Novel's Insight:* Preferences are endogenous to the social environment. Fear changes the payoff matrix. The "coordination problem" shifts from "how do we talk?" to "how do we survive the beast?"
      *   *Lewis's Defense:* Lewis would say the convention didn't fail; the *game* changed. If the preference for safety > order, the coordination equilibrium for order is no longer an equilibrium.
      *   *Critique:* But *why* did preferences change? Lewis doesn't explain the *genesis* of preference shifts. Golding suggests it's anthropological/psychological (the beast within). Lewis needs a theory of preference formation, not just preference satisfaction.

  6.  **Developing the Syllabus Argument (The "Reading"):**
      *   *Confirmation:* The early assembly is pure Lewis. Arbitrary token (conch), common knowledge, conditional preference (order > chaos).
      *   *Complication 1 (Sacralization):* The conch gains "normative weight." Lewis calls this "norms supported by sanctions," but Golding shows it's internalized virtue. *Solution:* Bring in Cristina Bicchieri's distinction between empirical and normative expectations.
      *   *Complication 2 (The Shift):* The game changes from Coordination to Prisoner's Dilemma (or Assurance Game with fear). Jack changes the payoffs.
      *   *Lewis's Missing Piece:* Moral Psychology/Anthropology. Lewis gives the *logic* of convention; Golding gives the *fragility* of the agents holding the convention.

  7.  **Drafting the Response:**
      *   *Tone:* Academic, collegial, insightful (suitable for a grad seminar instructor).
      *   *Structure:*
          1.  Validate the pairing (it's brilliant).
          2.  Address the Normativity Question (The "Ought").
          3.  Address the Collapse/Preference Question (The "Shift").
          4.  Propose a theoretical bridge (Bicchieri, Searle, or Ullmann-Margalit).
          5.  Seminar discussion questions.
      *   *Key Insight:* Lewis explains the *skeleton* of the norm; Golding shows the *flesh and blood* that makes it break. Lewis is static; Golding is dynamic.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just say "Lewis is wrong." Say "Lewis is doing a specific job (reductionism) that Golding reveals is insufficient for *this* context."
      *   *Nuance:* Lewis *does* acknowledge that conventions can become norms via sanctions. But the user is right: the *feeling* of sanctity comes before the sanction. Piggy cares about the conch even when Jack won't punish him.
      *   *Refinement on Collapse:* It's not just preference change. It's a change in *common knowledge*. Once the belief that "others believe in the conch" breaks, the convention dies. Golding shows the *epistemic* fragility.

  9.  **Final Polish:** Ensure the distinction between "Coordination Game" and "Prisoner's Dilemma" is clear, as this is central to the collapse. (Ralph tries to keep it Coordination; Jack turns it into PD/Dominance).

  10. **Output Generation:** (Proceed to write the response based on these points.)
answer: |-
  This is a fantastic pairing. It's rare to find a literary text that dramatizes game-theoretic concepts as clearly as *Lord of the Flies*, and it's equally rare to find a philosophical text whose limitations are as vividly exposed by a novel as Lewis's *Convention* is by Golding.

  You have identified the two precise pressure points where Lewis's analytic framework meets the messy reality of social psychology. Here is a reading of the novel through Lewis, followed by where the novel forces us to amend Lewis, which you can use to structure the seminar discussion.

  ### 1. The Normativity Problem: From Equilibrium to Totem

  **Where Lewis Holds:**
  You are right that the initial establishment of the conch rule is a textbook Lewisian convention.
  *   **Regularity:** Only the holder speaks.
  *   **Coordination Problem:** Crosstalk prevents decision-making.
  *   **Arbitrarity:** As you note, it could have been a stick or a raised hand.
  *   **Common Knowledge:** Ralph holds it up, explains the rule, and the boys assent.

  In Lewis's terms, the "ought" here is hypothetical: *If* you want to be heard and *if* you want order, *then* you ought to pass the conch. It is an "ought" of rationality, not morality.

  **Where Golding Complicates:**
  Your intuition is correct: Lewis struggles to account for the *sacralization* of the convention. By Chapter 5, the conch is no longer just a coordination token; it is a totem. When Piggy holds it, he isn't just claiming a turn to speak; he is invoking "the grown-ups" and "civilization."

  Lewis anticipates this slightly by distinguishing between *conventions* (coordination) and *norms* (conventions backed by sanctions or moral weight). However, Lewis tends to treat the normative weight as an *add-on* (e.g., we punish deviators). Golding shows the normative weight emerging *internally* from the convention itself. The boys don't follow the conch initially because they fear punishment; they follow it because adhering to the convention constitutes their identity as "civilized."

  **The Theoretical Gap:**
  Lewis's account is **thin on internalization**. He explains why I conform *given* that I want to coordinate. He does not explain why I come to *value* the coordination itself as a moral good.
  *   **Lewis:** "I follow the rule because I expect you to follow it, and we both benefit."
  *   **Golding:** "I follow the rule because following it makes me human. Breaking it makes me a beast."

  **Seminar Pivot:**
  To bridge this, you might introduce **Cristina Bicchieri's** distinction (from *The Grammar of Society*) between **empirical expectations** (I think others will do X) and **normative expectations** (I think others think I *ought* to do X).
  *   In the early assemblies, the conch rule relies on empirical expectations (Lewisian).
  *   By the middle of the book, it relies on normative expectations (Piggy's appeal to "what's right").
  *   **The Collapse:** Jack doesn't just violate the empirical expectation; he shatters the normative expectation. He signals that *no one* thinks you ought to follow the rule anymore. Lewis can explain the shift in empirical expectations, but Golding shows that once the normative expectation dissolves, the convention cannot be restored merely by re-establishing coordination. The "moral psychology" you suspect Lewis is missing is precisely the bridge between empirical and normative expectations.

  ### 2. The Collapse Problem: Endogenous Preference Shifts

  **Where Lewis Holds:**
  Lewis assumes preferences are stable for the duration of the convention. A convention persists as long as the coordination problem exists and the agents prefer coordination to non-coordination.
  *   In Lewisian terms, the breakdown of the conch rule looks like a shift in the payoff matrix. Initially, Order > Chaos. Later, for Jack's tribe, Hunting/Safety > Order.

  **Where Golding Complicates:**
  The problem, as you noted, is *why* the preferences shift. Lewis treats preferences as exogenous inputs. Golding treats them as endogenous to the social environment.
  *   **The Beast:** The fear of the beast changes the utility function. It's not that the coordination problem (who speaks when) changed; it's that the boys' capacity to care about that problem diminished in the face of existential terror.
  *   **The Feedback Loop:** Lewis describes a static equilibrium. Golding describes a dynamic system where the *failure* of the convention generates fear, which further degrades the preference for the convention.

  **The Theoretical Gap:**
  Lewis cannot explain **preference transformation**. He can explain why a convention collapses if preferences change, but he has no resources to explain *why* preferences change in response to the fragility of the convention itself.
  *   In the novel, the *lack* of adult enforcement doesn't just remove a sanction; it removes the psychological anchor that allows the boys to maintain the preference for order.
  *   Lewis assumes rational agents with fixed utilities. Golding suggests that "rationality" itself is a social artifact that degrades without reinforcement.

  **Seminar Pivot:**
  This is where you can bring in **Ullmann-Margalit** (*The Emergence of Norms*). She distinguishes between **Coordination Norms** (Lewisian) and **Prisoner's Dilemma Norms** (where defection is individually rational but collectively harmful).
  *   Ralph tries to maintain a Coordination Norm (we all benefit if we all follow the conch).
  *   Jack successfully reframes the situation as a Prisoner's Dilemma (if you hunt and I talk, I starve; if we both hunt, we eat).
  *   **The Deep Critique:** Golding suggests that without a "Leviathan" (adult authority), Coordination Norms inevitably decay into Prisoner's Dilemmas because trust (a component of the preference structure) erodes. Lewis assumes common knowledge of rationality; Golding shows that common knowledge of *trust* is the real prerequisite, and it is fragile.

  ### 3. Synthesizing the Seminar Argument

  Here is a way to frame the dialectic for your students:

  **Thesis (Lewis):** Social order is a solution to a coordination problem. It is arbitrary, self-enforcing, and relies on common knowledge of expectations.
  **Antithesis (Golding):** Social order is a psychological achievement. It is not arbitrary (it is tied to identity), it is not self-enforcing (it requires emotional investment), and it relies on common knowledge of *trust*, not just expectations.
  **Synthesis (The Amendment):** Lewis provides the *logic* of the norm, but Golding provides the *anthropology* of the norm-giver. To make Lewis work for the real world (or the island), we must add a theory of **preference endogeneity**. Conventions are not just solutions to problems; they are practices that sustain the preferences required to solve them. When the practice stops, the preference vanishes.

  ### Discussion Questions for the Seminar

  1.  **The Arbitrariness Test:** Lewis insists conventions must be arbitrary (the conch could be a stick). Does Golding agree? Or does the novel suggest that for a convention to survive, it must cease to be arbitrary and become *symbolic*? If the conch becomes non-arbitrary (sacred), does it stop being a Lewisian convention?
  2.  **The Nature of the Breakdown:** When Jack smashes the conch, is this a shift to a *new* Lewisian equilibrium (the hunt), or is it a collapse into a state of nature where no equilibrium is possible? If it's the latter, does that prove Lewis's model only works in "civilized" conditions where preferences are already tamed?
  3.  **Common Knowledge vs. Common Belief:** Lewis relies on common *knowledge*. Piggy relies on common *belief* ("They'll listen to the conch"). Does the novel show that social order requires knowledge (facts about behavior) or belief (faith in the system)? How does the "Beast" function as an epistemic disruptor that makes Lewisian common knowledge impossible?
  4.  **Rationality:** Is Jack irrational? In Lewis's terms, Jack is maximizing utility (safety/meat) given his new preferences. But Ralph treats him as irrational/immoral. Does Lewis's framework lack the vocabulary to condemn Jack, or is Lewis right that there is no "condemnation," only a description of a shifted equilibrium?

  ### Recommended Secondary Pairing
  If you want one more theoretical text to triangulate this, consider **John Searle's *The Construction of Social Reality***.
  *   Lewis: Status is derived from behavior/expectations.
  *   Searle: Status is derived from collective *assignment* ("X counts as Y in context C").
  *   Golding: The conch is "X counts as Y" (Shell counts as Authority). Jack's rebellion is "I no longer accept that X counts as Y."
  *   Searle helps explain the *normative* jump that Lewis misses. The conch has "deontic power" (rights/duties attached), not just coordinative utility.

  ### Summary for your Syllabus Note
  "Lewis gives us the skeleton of social order: the logic of coordination. Golding gives us the flesh: the fear, desire, and symbolism that animate that skeleton. We will ask whether a convention can survive when the flesh turns against the bones."

  This pairing is going to generate incredible discussion. It forces the analytic philosophers to deal with human fragility and the literary students to deal with structural rigor. Good luck with the seminar.
