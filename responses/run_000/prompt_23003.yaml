      *   **Point 1: Idealism vs. Computationalism (The Circular Ruins):** Connect the Dreamer to the Simulator. For Borges, being dreamed is poetic/tragic. For Bostrom, being simulated is statistical. Borges would ask: Who dreams the Simulator? (Infinite Regress).
      *   **Point 2: Time and Linearity (The Garden of Forking Paths):** Bostrom's simulation usually implies a linear processing of time (clock cycles). Borges prefers branching or non-existent time. He might suggest the simulation runs *all* paths at once (Many Worlds interpretation via code).
      *   **Point 3: The Library and Combinatorics:** The Library of Babel is the ultimate static simulation. Bostrom's simulation is dynamic. Borges might argue the Library is the more honest metaphor because it removes the need for a "computer" to do the work; the possibilities just *are*.
      *   **Point 4: The Tone (Irony and Skepticism):** Borges wouldn't take it as a scientific hypothesis to be proven. He would treat it as a fable. He would likely write a pseudo-essay about it (like "A New Refutation of Time").
      *   **Conclusion:** Summarize. The Simulation Argument is a "technological myth" that Borges would have filed alongside Gnosticism and Idealism.

