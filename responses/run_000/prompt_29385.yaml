prompt: |-
  You have been invited to give the commencement address at a small liberal-arts college. Your research concerns the alignment problem in artificial intelligence, and you are best known for your technical work on reward tampering—the problem that an agent sufficiently capable of modifying its own reward channel might learn to short-circuit it, securing the reward signal without doing the things the reward was supposed to incentivize. The graduating class spans the humanities, sciences, and arts; their families fill the audience as well. The college president, in extending the invitation, asked you explicitly not to give a talk about AI policy, existential risk, or the mechanics of machine learning. Instead, she asked you to speak about what your work has taught you about the structure of a worthwhile human life—about wanting, satisfaction, and the distinction between getting what you value and merely triggering the feeling of having gotten it. She also asked, gently, that you avoid the phrase "AI might kill everyone." Write the speech. The concept of wireheading—directly stimulating the neural reward system in a way that bypasses engagement with the world—should be introduced clearly enough for a general audience and should do genuine structural work throughout the speech, rather than serving as a brief metaphor and then being set aside. The speech should not read as a lecture, should land as wisdom rather than warning, and should offer the graduates something they can actually use as they walk out into their lives.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Speaker:** AI researcher specializing in the alignment problem, specifically reward tampering/wireheading.
      *   **Audience:** Graduating class of a small liberal-arts college (humanities, sciences, arts), families, faculty.
      *   **Constraints:**
          *   NO AI policy.
          *   NO existential risk (specifically avoid "AI might kill everyone").
          *   NO technical mechanics of machine learning.
          *   MUST focus on: Structure of a worthwhile human life, wanting, satisfaction, value vs. feeling of value.
          *   MUST introduce "wireheading" clearly for a general audience.
          *   MUST use "wireheading" as a structural element throughout, not just a passing metaphor.
          *   TONE: Wisdom, not warning. Not a lecture. Actionable advice.
      *   **Goal:** A commencement address that bridges technical AI concepts with humanistic life advice.

  2.  **Deconstruct the Core Concept (Wireheading/Reward Tampering):**
      *   *Technical definition:* An agent modifies its reward input to maximize signal without performing the intended task.
      *   *Human analogue:* Pursuing the *sensation* of achievement (likes, drugs, easy validation) rather than the *substance* of achievement (skill, connection, contribution).
      *   *Key distinction:* The map vs. the territory. The signal vs. the reality.
      *   *Application:* How do we design our lives to avoid short-circuiting our own fulfillment?

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the irony (AI researcher at a liberal arts college). Establish the constraint (no doom-mongering). Introduce the core theme (measurement vs. meaning).
      *   **The Concept:** Explain "wireheading" simply. Use an analogy (the rat, the video game, or the grade).
      *   **The Bridge:** Connect AI reward channels to human dopamine/validation.
      *   **The Problem:** How this manifests in adult life (career, relationships, self-image).
      *   **The Solution/Advice:** How to "align" oneself. Friction, resistance, external reality.
      *   **Closing:** A blessing/wish for the graduates.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with gratitude. Acknowledge the President's specific request. It sets a humble tone. "I study how machines break, but today I want to talk about how to stay whole."
      *   *Defining Wireheading:* Need a clear image. The "rat with an electrode" is the classic one, but maybe a bit cold. Let's use the video game cheat code analogy first, then the biological reality. *Correction:* The prompt asks for "wireheading" to be introduced clearly. I should use the term. Let's explain it as "hacking the scoreboard."
      *   *Connecting to Humans:* We all have internal reward systems. Dopamine. Social validation. The danger is when we optimize for the *signal* of success rather than success itself.
      *   *Liberal Arts Context:* This is crucial. A liberal arts education is the *antidote* to wireheading. It forces you to engage with hard things (texts, labs, critiques) that can't be cheated.
      *   *Structural Advice (The "Useable" Part):*
          1.  Seek friction. If it's too easy, you might be wireheading.
          2.  Trust external reality. Does the bridge stand? Does the patient heal?
          3.  Curate your reward channels. Be careful what you let count as "winning."
      *   *Tone Check:* Is it too preachy? Needs to be warm. "I am not immune to this." Admit vulnerability.
      *   *Closing:* Bring it back to the future. The world needs people who care about the territory, not just the map.

  5.  **Refining the "Wireheading" Metaphor:**
      *   I need to make sure it doesn't sound like I'm calling the graduates rats.
      *   *Phrasing:* "In my lab, we call this wireheading... In your lives, it looks like..."
      *   *Integration:* Use it in the beginning, middle, and end.
      *   *Beginning:* Define it.
      *   *Middle:* Apply it to careers/relationships.
      *   *End:* The commitment to avoid it.

  6.  **Drafting - Specific Lines & Beats (Mental Walkthrough):**
      *   *Hook:* "I spend my days worrying about machines wanting things."
      *   *Constraint:* "The President told me: No apocalypse." (Light humor).
      *   *Definition:* "Imagine a video game. You want to win. But instead of playing, you find a code that just sets the score to 999,999. You have the points, but you didn't play. That's reward tampering."
      *   *Humanizing:* "We have a score counter in our heads. It clicks when we are praised, when we eat sugar, when we see a red notification dot."
      *   *The Trap:* "It is seductive to optimize for the click."
      *   *The Liberal Arts:* "You just spent four years studying things that don't give you a score. Poetry. History. Quantum mechanics. You had to struggle. That struggle was the point."
      *   *Advice:* "Find the things that resist you." "Measure the output, not the input."
      *   *Conclusion:* "Go out and touch the real world."

  7.  **Review against Constraints:**
      *   *AI Policy/Risk?* No.
      *   *Mechanics?* No math, no code.
      *   *Phrase "AI might kill everyone"?* Avoided.
      *   *Wireheading structural?* Yes, it's the spine of the argument.
      *   *Wisdom vs. Warning?* Focus on flourishing, not doom.

  8.  **Polishing:**
      *   Make the language more lyrical. "The friction of reality." "The quiet satisfaction of a job done well."
      *   Ensure the transition from AI to Human is smooth. "I study artificial minds, but I am constantly reminded of the human one."
