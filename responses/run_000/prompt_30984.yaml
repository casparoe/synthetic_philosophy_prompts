  I recommend accepting this submission only as a short position note, contingent on specific revisions to the authors' claims regarding the Church-Turing Thesis.

  The committee is split because the paper straddles two distinct domains: the mathematical theory of computation and the physics of general relativity. The reviewers recommending rejection argue that the paper is fundamentally confused: the Church-Turing Thesis (CTT) is a claim about effective calculability by finite human agents, not a law of physics, and thus no physical setup can refute it. I take this consideration seriously. As a software engineer, I view the standard CTT as a specification of the algorithm concept, analogous to a formal interface definition, whereas a physical computer is an implementation subject to hardware constraints. Conflating the interface with the implementation is a category error that, left uncorrected, undermines the paper's theoretical validity. If the authors insist that Malament-Hogarth spacetimes refute the standard CTT, the reviewers are correct that the paper should be rejected.

  However, I do not recommend outright rejection because there is a coherent empirical hypothesis distinct from the mathematical CTT, often called the "Physical Church-Turing Thesis," which asserts that no physical system can compute more than a Turing machine. The authors' setup is a valid theoretical challenge to *this* empirical claim. Dismissing the paper entirely would silence a legitimate discussion about the computational limits imposed by general relativity, which is relevant to our community's understanding of complexity in physical systems. Accepting the paper as a main-track result, however, would legitimize the conflation of the mathematical and physical theses. A short position note is the appropriate venue: it allows the physical model to be presented without granting it the status of a definitive refutation of standard computability theory.

  To proceed, the authors must make the following revisions:
  1.  **Terminological Precision:** Throughout the text, replace references to "the Church-Turing Thesis" with "the Physical Church-Turing Thesis" when discussing physical realizability. They must explicitly acknowledge in the introduction that the standard CTT concerns effective methods, not physical laws.
  2.  **Claim Qualification:** The abstract and conclusion must be revised to state that the setup challenges the *physical* thesis under specific relativistic idealizations, rather than claiming to refute the standard CTT.
  3.  **Feasibility Discussion:** Add a section addressing the engineering constraints of the proposed setup (e.g., signal degradation, energy requirements, stability of the spacetime), distinguishing between theoretical computability in the model and effective computability by a physical agent.

  This path ensures we maintain conceptual rigor regarding the definition of computation while remaining open to empirical challenges from physics.
