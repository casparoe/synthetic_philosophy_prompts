prompt: |-
  I host a small podcast about science, and next week's guest is an evolutionary biologist who defends group selection — the view that natural selection can act on whole populations of organisms, not just on genes or individuals. I've been thinking about this debate on my own for a while, and I want a sequence of questions that go beyond having him restate the view. I'd like at least one question pressing the point that kin selection and multilevel selection are mathematically equivalent ways of decomposing the same evolutionary process, and what that does to the claim that group selection is a real causal force rather than a bookkeeping choice; at least one on why a gene-centered theorist would distinguish the unit of selection from the unit of adaptation, and whether that distinction is doing real work or just rescuing the gene view from an unfortunate name; and at least one on whether the gene-centered view's talk of selfish genes is a literal claim or a metaphor, and what explanatory work that metaphor is supposed to do. For each, please include a follow-up keyed to the answer he's most likely to give, and close with a question about what evidence or prediction could actually count against group selection as opposed to the gene-centered view.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Small science podcast, next week's guest is an evolutionary biologist defending group selection (multilevel selection theory).
      *   **Goal:** A sequence of questions that go beyond restating the view. Deep, critical, yet fair engagement with the debate.
      *   **Specific Requirements:**
          1.  Question on mathematical equivalence of kin selection vs. multilevel selection (causal force vs. bookkeeping).
          2.  Question on unit of selection vs. unit of adaptation (gene-centered view distinction).
          3.  Question on "selfish gene" (literal vs. metaphor, explanatory work).
          4.  Follow-up questions for each, keyed to the likely answer.
          5.  Closing question on falsifiability/evidence against group selection.
      *   **Tone:** Intellectual, probing, suitable for a science podcast host who has done their homework.

  2.  **Deconstruct the Scientific/Philosophical Issues:**
      *   *Group Selection vs. Kin Selection:* This is the "equivalence debate." Hamilton's rule vs. Price Equation. Many argue they are mathematically interchangeable frameworks. Proponents of group selection (like David Sloan Wilson or E.O. Wilson in later years) argue MLS (Multilevel Selection) offers better causal intuition or handles specific scenarios better. Critics (like Dawkins, Grafen) say it's just a different way of accounting for gene frequency changes.
      *   *Unit of Selection vs. Unit of Adaptation:* Gene-centrists (Dawkins) argue genes are the *replicators* (selection), while organisms/groups are *vehicles* (adaptation). Group selectionists often blur this or argue the group is a genuine vehicle/replicator. The question needs to probe if this distinction saves the gene theory from refutation.
      *   *Selfish Gene:* Is it anthropomorphism? Dawkins says it's a heuristic. Does it actually help predict things, or does it mislead?
      *   *Falsifiability:* If the math is equivalent, how do we empirically distinguish them? This is the crux of the "bookkeeping" charge.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Mathematical Equivalence.*
          *   *Draft 1:* Isn't kin selection and group selection the same math? So isn't group selection just bookkeeping?
          *   *Refinement:* Needs to be more nuanced. Acknowledge the Price Equation. Ask about causal ontology.
          *   *Follow-up:* If he says "It's about causality, not math," push on how we measure that causality independently.
          *   *Final Polish:* Focus on the "causal force" vs. "perspective" debate.

      *   *Requirement 2: Unit of Selection vs. Adaptation.*
          *   *Draft 1:* Why distinguish selection and adaptation? Is it just to save the gene theory?
          *   *Refinement:* Frame it around the gene-centered view's defense mechanism. If genes are selected but bodies adapt, does that distinction explain anything new?
          *   *Follow-up:* If he says "Yes, it clarifies levels," ask for a case where the gene view fails to predict adaptation because it focuses on the wrong unit.
          *   *Final Polish:* Focus on whether the distinction is substantive or semantic rescue.

      *   *Requirement 3: Selfish Gene Metaphor.*
          *   *Draft 1:* Is the selfish gene literal? What does it explain?
          *   *Refinement:* Ask about the *explanatory work*. Does attributing agency to genes help or hinder?
          *   *Follow-up:* If he says "It's just a metaphor," ask if it's a *dangerous* metaphor that reifies the gene.
          *   *Final Polish:* Focus on the utility of the metaphor in research programs.

      *   *Requirement 4: Falsifiability/Evidence.*
          *   *Draft 1:* What evidence would prove you wrong?
          *   *Refinement:* Specifically contrast group selection vs. gene-centered. Since math is equivalent, what empirical data breaks the tie?
          *   *Final Polish:* Focus on distinct predictions.

  4.  **Review and Refine:**
      *   Check against constraints: Are there follow-ups? Yes. Is the tone right? Yes. Is the science accurate? (Need to ensure I'm not misrepresenting the "equivalence theorem" which is widely accepted but interpreted differently).
      *   *Self-Correction on Science:* The "equivalence" is broadly accepted among theorists (Price equation shows they can be transformed into one another), but the *causal interpretation* is the battleground. The questions must reflect that the guest likely knows the math is equivalent but disputes the *ontological* implication.
      *   *Flow:* Arrange them logically. Start with the math/causality (the heavy theory), move to the units (conceptual framework), then the metaphor (rhetoric/heuristic), end with empirics (the ground truth).

  5.  **Final Polish of Wording:**
      *   Ensure the host sounds informed but not combative. Use phrases like "Critics argue..." or "One common pushback is..." to soften the challenge while keeping the edge.
      *   Make sure the follow-ups anticipate the standard defenses (e.g., "It's about heuristic value," "It's about causal granularity").

  6.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   Introductory context.
