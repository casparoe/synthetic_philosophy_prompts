      *   *Conclusion:* As $n \to \infty$, probability of majority correctness $\to 1$.
      *   *Weaknesses in Legal Context:* Independence is legally forbidden (jurors *must* deliberate); Competence is variable; Binary truth is legally nuanced (proof vs. fact).

