answer: |-
  1. Tolstoy distinguishes art from spontaneous contagion by insisting the transmission must be intentional and executed through specific external signs like words or colors. This requirement excludes involuntary reactions like a child mimicking a parent's tears because the activity lacks the deliberate craft of encoding feeling into a form.

  2. Sincerity functions as a causal precondition rather than a retrospective label, judged by the receiver's perception of the artist's lack of artificial embellishment. The logic avoids circularity because the audience detects the internal state directly through the clarity of expression, not merely by measuring their own emotional intensity.

  3. Feelings rooted in class pride or exclusive groups yield inferior art because they limit the potential audience who can share the specific experience required for infection. Universal feelings allow for wider infection, which Tolstoy equates with greater artistic value since the ultimate purpose of art is human union.

  4. The religious consciousness of the age provides the objective standard for ranking feelings, identifying which emotions promote the ultimate moral progress of humanity. Without this metric, the infection theory could only measure the strength of feeling, not whether the art contributes to the welfare of mankind.

  5. Tolstoy separates the definition of art from the evaluation of art, allowing something to be art while still being bad if it transmits low-value feelings. This structure lets him dismiss masterpieces as bad art without denying they are art, preserving his moral critique while maintaining his technical definition.
