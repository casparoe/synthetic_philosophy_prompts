answer: |-
  Your colleague is correct. Treating the Expected Value of Information (VoI) of individual studies as additive is a methodological error that will systematically lead to overinvestment in research.

  While the *information* gained from two studies might be cumulative, the *value* of that information is almost always subadditive. This is due to the **substitutability of information**: once a study resolves a specific uncertainty, subsequent studies targeting that same uncertainty yield diminishing returns.

  Here is the argument for why your current approach is flawed, a concrete demonstration, and a practical framework for fixing your portfolio evaluation.

  ### 1. The Core Problem: Substitutability of Information

  The Value of Information is not a measure of "data volume"; it is a measure of **decision improvement**. VoI quantifies how much a study prevents you from making a mistake you would have otherwise made.

  If Study A and Study B both address the same underlying uncertainty (e.g., "Will users adopt this feature?"), they are substitutes.
  *   **In Isolation:** Study A looks valuable because it resolves the uncertainty. Study B also looks valuable because it resolves the same uncertainty.
  *   **In Combination:** If you fund Study A, the uncertainty is resolved. Study B now has no uncertainty left to resolve regarding that specific decision. Its marginal value drops to near zero.

  By summing the isolated values, you are effectively counting the value of resolving the same uncertainty twice. In economic terms, the VoI function is **concave** with respect to information; it exhibits diminishing marginal returns.

  ### 2. A Concrete Decision Problem

  Let's demonstrate this with a simplified product launch scenario.

  **The Decision:**
  You must decide whether to **Launch** a new feature or **Kill** it.
  *   **Cost to Launch:** \$100k.
  *   **Payoff if Successful:** \$300k revenue (Net profit: \$200k).
  *   **Payoff if Failed:** \$0 revenue (Net loss: -\$100k).
  *   **Payoff if Killed:** \$0.

  **The Prior Belief:**
  Based on current data, you believe there is a **60% chance of Success** and a **40% chance of Failure**.

  **Baseline Expected Value (No Studies):**
  $$EV_{\text{launch}} = (0.6 \times \$200k) + (0.4 \times -\$100k) = \$120k - \$40k = \$80k$$
  $$EV_{\text{kill}} = \$0$$
  *Decision:* Launch. *Expected Value:* **\$80k**.

  **Study A (Isolated):**
  Suppose Study A is a user test that perfectly reveals whether the launch will succeed or fail (Perfect Information).
  *   If Success (60%): You Launch (\$200k).
  *   If Failure (40%): You Kill (\$0) — *This saves you the \$100k loss you would have taken otherwise.*
  *   $EV_{\text{with A}} = (0.6 \times \$200k) + (0.4 \times \$0) = \$120k$.
  *   **VoI(A)** = \$120k - \$80k = **\$40k**.

  **Study B (Isolated):**
  Suppose Study B is a survey that *also* perfectly reveals whether the launch will succeed or fail (perhaps a different methodology, but addressing the same binary truth).
  *   Calculated in isolation, it looks identical to Study A.
  *   **VoI(B)** = **\$40k**.

  **The Additive Fallacy:**
  If you sum the isolated values, the portfolio value appears to be:
  $$\text{VoI(A)} + \text{VoI(B)} = \$40k + \$40k = \mathbf{\$80k}$$

  **The Joint Reality:**
  If you run **both** Study A and Study B, you still only know the truth once. Study B adds no new decision-making power because Study A already resolved the uncertainty completely.
  *   $EV_{\text{with A+B}} = \$120k$ (Same as A alone).
  *   **Joint VoI** = \$120k - \$80k = **\$40k**.

  **Result:**
  $$\text{Joint Value (\$40k)} < \text{Sum of Isolated Values (\$80k)}$$
  By funding both based on isolated calculations, you would spend budget on Study B expecting \$40k of value but receiving \$0 in marginal return.

  *(Note: In reality, studies are rarely perfectly redundant, but they are rarely perfectly independent either. Most user studies correlate because they probe the same user psychology or market conditions. Therefore, the joint value will almost always be strictly less than the sum.)*

  ### 3. Why Monotonicity Does Not Rescue the Additive Approach

  You might argue: *"But information is monotonic. Having more information is always better (or equal). So isn't summing them a safe, conservative estimate?"*

  No. Monotonicity states that $V(A, B) \geq V(A)$. It guarantees that adding Study B never *hurts* your decision quality. It does **not** guarantee that $V(A, B) = V(A) + V(B)$.

  The error lies in confusing **informativeness** (reduction in entropy/variance) with **value** (increase in expected utility).
  1.  **Informativeness is often additive:** Two independent samples reduce variance more than one.
  2.  **Value is non-linear:** Value only accrues when information crosses a **decision threshold**.

  In the example above, Study A moved your confidence enough to change the decision in the "Failure" state. Study B provides more "data," but because the decision was already optimized by Study A, that extra data has zero marginal utility. Relying on monotonicity protects you from negative value, but it does not protect you from **wasted budget** due to double-counting.

  ### 4. Practical Recommendations for Portfolio Evaluation

  To correct this, your team must shift from evaluating studies as independent assets to evaluating them as a **portfolio of uncertainty reduction**.

  **A. Calculate Marginal VoI, Not Isolated VoI**
  Do not ask, "What is the value of Study B?" Ask, "What is the value of Study B **given that we have already funded Study A**?"
  *   Rank candidate studies by their isolated VoI.
  *   Select the top study.
  *   Re-calculate the VoI of the remaining studies *conditional* on the results of the first study.
  *   Repeat until the marginal cost of the next study exceeds its marginal VoI.

  **B. Cluster by Hypothesis (The "Uncertainty Bucket" Approach)**
  Group studies by the specific uncertainty they resolve.
  *   *Bucket 1:* Usability/Feasibility (Can they use it?)
  *   *Bucket 2:* Desirability (Do they want it?)
  *   *Bucket 3:* Viability (Will it make money?)
  *   **Rule:** If you fund two studies in the "Desirability" bucket, apply a **discount factor** (e.g., 0.5) to the second study's calculated value to account for overlap, or require a justification of orthogonality (i.e., prove they measure different latent variables).

  **C. Use Sequential Analysis**
  Whenever possible, structure studies sequentially rather than in parallel.
  *   Fund Study A.
  *   Wait for results.
  *   *Then* decide if Study B is still necessary.
  *   This naturally captures the subadditivity because Study B is only commissioned if Study A leaves residual uncertainty that is still valuable to resolve.

  **D. Simulation-Based Portfolio Optimization**
  If you must select a batch of studies simultaneously (e.g., for quarterly budgeting):
  1.  Define the joint probability distribution of the outcomes (e.g., correlate the success probabilities of studies targeting the same feature).
  2.  Simulate the decision outcome for every combination of studies (A only, B only, A+B, Neither).
  3.  Select the combination that maximizes **Net Value** (Joint VoI minus Total Cost).

  ### Summary
  Your colleague is right. Summing isolated VoI figures assumes studies are perfect complements, when in reality, user studies are largely substitutes. By switching to a **marginal value** framework, you will stop funding redundant research and allocate your budget to studies that actually change decisions.
