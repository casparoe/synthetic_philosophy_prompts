          *   Needs: Sequence of pieces, preconditions for the problem to arise, when to head off misconceptions, one closing question, one thing to explicitly exclude.

  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *What is it?* An individual object/event belongs to infinitely many classes. Different classes yield different probabilities. There is no principled way to choose the "correct" class for a single case probability.
      *   *Why is it a problem for scientists?* Science relies on generalizations (classes) to predict particulars. If the class choice is arbitrary, the probability is arbitrary.
      *   *Key Tension:* Specificity (narrow class) vs. Stability (broad class/reliable data).

  3.  **Evaluate the Proposed Example (55-year-old man survival):**
      *   *Pros:* Intuitive, real-world stakes, actuarial science is familiar to engineers.
      *   *Cons:* Might feel like "just need better actuarial tables." Scientists might think "control for smoking, BMI, geography, genetics" and feel the problem dissolves with more variables.
      *   *Verdict:* It's okay, but needs to be pushed hard to show the *infinite regress* of partitioning. However, for engineers, a *failure prediction* example might resonate more (e.g., will *this* bridge collapse? Will *this* specific component fail?). Let's stick close to the user's idea but refine it to prevent the "more data" fix. Actually, a specific engineered component (e.g., a specific turbine blade) might be better for engineers, but the human mortality case is more philosophically standard (Reichenbach). Let's stick with the user's instinct but weaponize it against their "more data" intuition.
      *   *Wait, why not a coin toss?* A coin toss is too clean. The reference class is usually "tosses of this coin." It's hard to generate competing plausible classes that yield *wildly* different probabilities without getting contrived (e.g., "tosses by a magician," "tosses on Tuesdays"). Mortality/Engineering failure has rich, conflicting covariates.

  4.  **Drafting the Sequence (The "Arc" of the Session):**
      *   *Goal:* Move from "Probability is objective" -> "Probability depends on classification" -> "Classification is underdetermined" -> "No algorithmic fix exists."
      *   *Phase 1: Setup (10 mins).* Establish the frequency interpretation (since they are scientists). Define the goal: Assign a single-case probability.
      *   *Phase 2: The Hook/Example (15 mins).* Use the 55-year-old man (or similar). Show multiple valid classes.
      *   *Phase 3: The Trap (15 mins).* Address the "more data/finer partition" instinct. This is crucial. Show why narrowing doesn't solve it (sample size vs. relevance trade-off).
      *   *Phase 4: Distinguishing Induction (5 mins).* Briefly separate RCP from Hume.
      *   *Phase 5: Wrap-up/Question (5 mins).*

  5.  **Addressing Specific User Constraints:**
      *   *Preconditions:* What must be in place before RCP looks like a problem?
          *   Commitment to frequentism (probability = relative frequency).
          *   Desire to assign probability to a *single case* (singular event).
          *   Recognition that the single case belongs to multiple sets.
      *   *Order:* Frequency definition -> Single Case desire -> Multiple Classes -> Conflict -> No Selection Rule.
      *   *Example:* Stick with the 55-year-old man but frame it as *risk assessment* (engineering context). Why not coin toss? (Addressed above: too homogeneous).
