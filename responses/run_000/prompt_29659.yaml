      *   *Head off "Induction":* Do this near the end. Induction is "will the future resemble the past?" RCP is "which past?"
      *   *Closing Question:* Needs to test if they understand the *arbitrariness* remains.
      *   *Refusal:* Don't cover Bayesian subjective priors as a "solution" (it sidesteps the frequentist RCP, doesn't solve the epistemic issue). Or don't cover machine learning feature selection (too technical/pragmatic). Let's go with "Don't cover ML/Feature Selection as a solution" because they will want to go there.

  6.  **Refining the Plan (Self-Correction/Optimization):**
