      *   **Conclusion:** You can stay Humean. You just need the *New* Principal Principle.

  6.  **Refining the Explanation of the "Bug":**
      *   Need to be clear about *why* HS makes chance info inadmissible.
      *   Example: A coin has chance 0.5 of heads. Under HS, this means the *total* pattern of coin flips in the universe matches a 0.5 frequency (roughly).
      *   If I know the chance is 0.5, I know the future flips must align to keep the frequency at 0.5.
      *   If I know the future flips, my credence should be 0 or 1.
      *   Therefore, knowing the chance gives me "future-ish" info.
      *   Original PP says: Don't use future-ish info to set credence to $x$ (unless $x$ is 0 or 1).
      *   Contradiction.
      *   Resolution: The New PP says: Defer to chance *unless* the chance hypothesis itself rules out the outcome. (Actually, it's more about conditioning on the theory of chance).

  7.  **Structure of the Response:**
