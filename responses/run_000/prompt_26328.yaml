          *   Better formulation: The **Reformed Principal Principle**. $C(E | Ch(E)=x \ \& \ K) = x$, where $K$ is admissible. The trick is realizing that under HS, the proposition "The chance is $x$" *itself* contains inadmissible information about the future.
          *   So, we replace PP with a principle that links credence to chance *plus* the theory of chance.
          *   Lewis's 1994 fix: $C(F | T \ \& \ H) = Ch(F)$, where $T$ is the theory of chance and $H$ is history. But this gets technical.
          *   Let's stick to the core intuition: The original PP assumes chance doesn't give info about the future. HS says it does. So we need a PP that accounts for that info.
      *   **Jenann Ismael's Contribution:** *The Open Universe*. She argues we should defer to chance not as a metaphysical ground but as an epistemic guide. The "Generalized Principal Principle."
      *   **Ned Hall's Contribution:** Two concepts of chance. One Humean (role in theory), one non-Humean (guides credence). Humeans only have the first. But we can bridge them.
      *   **The Cost:** What do we give up?
