      *   *The "Agency" Problem:* Constitutions constitute the agent; they don't just bind a pre-existing one. (Constitutive vs.限制性).
      *   *The "Enforcement" Problem:* Ulysses had the mast (external/enforceable). Constitutions rely on the very actors they bind to enforce them (Judicial review relies on executive power).
