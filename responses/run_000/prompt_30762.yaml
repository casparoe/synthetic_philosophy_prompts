answer: |-
  Setup and materials
  You will need 144 index cards, 18 envelopes, pens, and a printed score sheet for each participant. Before the meetup, write numbers on the cards to create 18 identical decks; each deck should contain eight cards with the values 10, 20, 30, 40, 50, 60, 70, and 80, shuffled randomly so the order is unknown. Place one deck into each envelope along with a score sheet that has columns for "Round," "Card Value," "Cards Viewed," "Search Cost," and "Final Score." Arrange the room so everyone has a flat surface to work on, and have a stopwatch ready to keep strict time.

  Rules and flow
  Explain that each envelope represents a queue of potential client projects, and the number on the card is the profit from that project. Participants open their envelopes and place the stack facedown. They flip the top card to see the value, then must immediately decide to either "Sign" (keep the card and end the round) or "Pass" (discard the card and flip the next one). There is no going back to discarded cards. The critical constraint is that every card they view costs them 10 points in search costs, representing time and energy spent evaluating options. If they pass all eight cards without signing, they get zero for the round.

  Run three separate rounds of five minutes each, with a two-minute break in between for participants to calculate their scores and reset their decks. During the active play time, enforce strict silence so participants cannot compare strategies or card distributions; they must rely on their own judgment and risk tolerance. Remind them halfway through each round that time is ticking, adding pressure to commit, but do not offer advice on when to stop. After the third round, ask everyone to sum their three final scores to get a total tournament score.

  Scoring and incentives
  The winner is the person with the highest total score across all three rounds, not the person who found the highest single card value. Calculate the score by taking the value of the signed card and subtracting 10 points for every card viewed in that round (e.g., signing the 3rd card with a value of 50 yields 50 - 30 = 20 points). Offer a small, symbolic prize for the winner, such as choosing the topic for the next meetup or a free coffee, to create low-stakes competition that mirrors the desire to win in business without triggering high anxiety.

  Debrief
  Start by asking the group to compare notes on their emotions during the game, specifically targeting those who passed high numbers early hoping for an 80 but ended up with a low score due to search costs. Ask the group to identify who stopped early with a "good enough" number versus who hunted for the maximum, and plot a few examples on a whiteboard to show that the early stoppers often outperformed the hunters when costs were accounted for. Highlight that the people who felt the most anxiety were likely those trying to calculate the perfect moment to stop, while those who set a simple rule (e.g., "stop at anything over 50") felt more in control.

  Use this data to introduce the concept of satisficing and bounded rationality, explaining that in the real world, time and attention are the hidden costs we often ignore. Connect the 10-point search cost to the real hours spent researching vendors, tweaking proposals, or deliberating on pricing, showing how those hours eat into the margin of the "perfect" choice. Emphasize that rationality isn't about finding the optimal solution, but about finding a solution that is sufficient given the scarce resources of time and cognitive load, validating the instinct to commit sooner rather than later.

  What will probably go wrong
  Participants may forget to track how many cards they viewed, leading to scoring errors that muddy the results. To fix this, require them to write down the count on their score sheet before they are allowed to flip the next card, making the cost visible before the next decision is made. Another risk is that people will talk during the rounds, sharing information about where the high cards are in the deck, which ruins the uncertainty required for the lesson. Fix this by acting as a strict facilitator who pauses the timer if the room gets too noisy, reinforcing that business decisions are often made in isolation without perfect information.

  One conceptual limitation of this game is that the participants know there are exactly eight cards in the deck, whereas real business opportunities have an unknown horizon. This makes the optimal stopping point mathematically calculable in the game, but impossible to calculate in reality. You will need to supply this distinction in the debrief by explaining that while the game has a fixed end, real life does not, which makes having a personal "good enough" threshold even more critical outside the room than inside it.
