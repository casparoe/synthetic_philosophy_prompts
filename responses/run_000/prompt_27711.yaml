  **MEMORANDUM**

  **TO:** Members of the State Law Reform Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 26, 2023
  **RE:** Proposal to Amend Wrongful Death Statute (Lost Years Damages)

  **Recommendation**

  I recommend that the Commission **not adopt** the proposed provision allowing damages for the decedent's "lost years." While the intention behind the proposal is morally compelling, the legal mechanism required to implement it rests on a metaphysical fiction that undermines the coherence of our tort system. We should not resolve a problem of equity by introducing a category of harm that the law cannot logically recognize.

  **The Epicurean Objection**

  The primary objection to this proposal is not merely procedural; it is ontological. The Epicurean argument posits that death cannot be a harm to the decedent because there is no subject to experience the harm. As Epicurus noted, "When we exist, death is not; and when death exists, we are not."

  Some colleagues have dismissed this as ancient sophistry irrelevant to modern jurisprudence. I disagree. While we need not adopt Epicureanism as a moral truth, we must respect its logical force regarding *compensation*. Tort law is fundamentally remedial; it aims to make a victim whole for a loss they have *suffered*. To award damages for "lost life" is to claim we are compensating the decedent for the experiences they are not having. But a non-existent entity cannot suffer the deprivation of experience.

  If we adopt this provision, we are not compensating the dead for their loss. We are effectively creating a statutory fiction that treats the estate as a living person. This blurs the line between wrongful death (a loss to survivors) and survival statutes (claims the decedent could have brought had they lived). By conflating the two, we risk turning damages into a symbolic penalty rather than a measured redress for actual injury. A legal system gains public trust through logical consistency; awarding compensation for a harm that has no subject invites skepticism about the rationality of our judgments.

  **The Strongest Argument for Reform**

  I acknowledge the strength of the opposing view. The most persuasive argument for the "lost years" provision is the inequity of the current statute. Under our existing framework, the value of a human life in tort is largely derivative. The wrongful death of a sole provider with a large family yields high damages; the wrongful death of a young adult with no dependents yields minimal damages.

  Proponents argue this creates a perverse moral calculus where the law implicitly values a "socially connected" life over a "solitary" one. This is intuitively offensive. It suggests that the tragedy of a life cut short is not the loss of the life itself, but only the loss of its utility to others. This "single person problem" is a genuine flaw in the current law, and it demands a remedy. A humane legal system should recognize the intrinsic value of human potential, regardless of marital or parental status.

  **Conclusion**

  We are left with a conflict between moral intuition and logical coherence. The proponents are right that the current law undervalues solitary lives. However, the "lost years" provision is the wrong tool to fix this. It attempts to solve a distributive problem (who gets compensated) by asserting a metaphysical falsehood (that the dead suffer the loss of the future).

  We can address the inequity without embracing the fiction. We might consider expanding the definition of "survivors" to include broader kin, increasing punitive damages for egregious conduct regardless of dependents, or allowing the estate to recover for the loss of *accumulated* wealth rather than *potential* life.

  I urge the Commission to reject the "lost years" provision. We should not build our statutes on the premise that the dead can suffer. We can honor the value of the lost life without pretending the deceased is present to claim it.
