  ### 💡 Study Group Tip
  When discussing your results, don't just state your label. State your answers to **Q1** and **Q3**. Often, disagreements in the group aren't about the labels (e.g., "I'm a coherentist"), but about the underlying intuition (e.g., "I don't think circular reasoning can ever be valid"). Identifying exactly where you diverged in the tree will make your discussion much more productive.
