answer: |-
  This is a fantastic pedagogical challenge. You want the *phenomenology* of the situationist critique—the cognitive dissonance of realizing your own folk psychology is broken—without the ethical baggage of a Milgram-style setup.

  The problem with trying to replicate Darley & Batson (Good Samaritan) directly in class is that with $N=15$, your data will be noisy. If everyone helps, you lose the point. If no one helps, you look like a tyrant.

  Instead, I recommend a hybrid approach: **Live Demonstration of the Fundamental Attribution Error (FAE) + A "Self-Vertigo" Prediction Game.**

  The **Quizmaster Paradigm** (Ross, Amabile, & Steinmetz, 1977) is the gold standard for making people *feel* the FAE. It shows that even when we *know* a situation is rigged, we still attribute behavior to traits. We will adapt this to be about **competence/judgment** (to keep it clean), then bridge it to **moral character**.

  Here is the 75-minute lesson plan, followed by the "what will go wrong" and "philosophical limitations" analysis you requested.

  ---

  ### Lesson Plan: The Attribution Trap

  **Goal:** Demonstrate that students systematically overlook situational variables when judging others (FAE), then force them to confront that they do the same for their *own* moral behavior (Situationism).

  **Materials:** Index cards, a timer, whiteboard.

  #### Part 1: The Quizmaster Demo (30 mins)
  *The goal here is to make them commit the error, not just hear about it.*

  1.  **Setup (5 mins):** Recruit 3 volunteers.
      *   **Student A (Questioner):** Give them a sheet with 10 obscure trivia questions *and the answers* (e.g., "What is the capital of Burkina Faso?"). Tell them: "Your job is to ask these questions. You can make them harder if you want."
      *   **Student B (Contestant):** Tell them: "Your job is to answer the questions as best you can."
      *   **Student C (Observer):** Their job is to watch.
      *   **The Rest of the Class:** They are the Judges.
  2.  **The Task (10 mins):** A and B perform the quiz for 5 minutes. A will naturally look knowledgeable (they chose the questions); B will likely struggle.
  3.  **The Judgment (5 mins):** Ask the class (and Observer C) to rate A and B on a scale of 1–10 for "General Knowledge" and "Intellectual Competence."
      *   *Prediction:* They will rate A significantly higher than B.
  4.  **The Reveal (10 mins):** Reveal that A had the answers beforehand and chose the topics. The situation was rigged.
      *   Ask the class: "Knowing this, does your rating change?"
      *   *The Vertigo:* Most will admit they *still* feel A is smarter, or they are surprised by how strongly they initially judged A. This is the FAE in action. We see behavior and infer trait, ignoring the situational constraint.

  #### Part 2: The "Good Samaritan" Self-Audit (15 mins)
  *Now bridge from "judging others" to "judging ourselves."*

  1.  **The Prediction (5 mins):** Hand out slips of paper. Ask them to answer anonymously:
      *   "On a scale of 1–10, how helpful are you?"
      *   "Imagine you are late for a seminar you care about. You see a stranger drop a box of papers. Do you stop? (Yes/No)"
      *   "Imagine you are early for the same seminar. Do you stop? (Yes/No)"
  2.  **The Data Reveal (10 mins):** Collect the slips. While you shuffle them (creating suspense), put the actual Darley & Batson (1973) stats on the board:
      *   **Late Condition:** 10% stopped.
      *   **On-Time Condition:** 63% stopped.
      *   **Seminar Topic (Religion vs. Neutral):** No significant difference.
  3.  **The Confrontation:** Read a few of their anonymous predictions aloud (most will say "Yes, I'd stop").
      *   Point out the gap: "You just rated yourselves as helpful. You just predicted you'd stop. The data says 90% of people in your exact position walk by."
      *   *Key Question:* "Are you the exception, or is your self-assessment unreliable?"

  #### Part 3: Debrief & Philosophical Connection (30 mins)
  *Connect the visceral feeling to the text.*

  1.  **Global vs. Local Traits:** Ask: "If 'Helpfulness' were a global trait (Aristotelian virtue), would the 'Late' variable matter?" (No). "Since it does matter, what kind of trait is it?" (Local/fragile).
  2.  **The Explanatory Challenge:** Situationism isn't just saying "people are inconsistent." It's saying **situation predicts behavior better than character.** Refer back to the Quizmaster: We *thought* character explained the performance, but situation did.
  3.  **Virtue Ethics Implications:** If we can't reliably identify traits in others (Quizmaster) or predict them in ourselves (Good Samaritan), can "character" be the primary locus of moral evaluation?
  4.  **The "So What?":** Does this kill virtue ethics? (Preview the next class: Doris vs. the Virtue Ethicist responses).

  ---

  ### Predictably What Will Go Wrong (And How to Fix It)

  **1. The "I'm Different" Defense**
  *   **The Problem:** In Part 2, students will insist *they* are part of the 10% who stop even when late. They will treat the statistical data as applying to "other people."
  *   **The Fix:** Don't argue. Use the Quizmaster data. Remind them: "In the first activity, you judged Student A as smarter based on behavior, even though the situation was rigged. You know cognitively that situations matter, but your intuition overrides it. The Darley & Batson data suggests that intuition is lying to you about your own helpfulness, too."

  **2. The Quizmaster Effect is Too Weak**
  *   **The Problem:** Sometimes, if the Contestant is very confident, the class won't rate the Questioner higher. The FAE effect disappears.
  *   **The Fix:** Coach the Questioner privately before class. Tell them: "Pick questions you know they won't get. If they answer correctly, move to the next one quickly. Keep the pressure on." You need the Contestant to struggle visibly for the trait attribution to kick in.

  **3. Time Creep**
  *   **The Problem:** The Quizmaster debrief can turn into a long conversation about intelligence vs. knowledge.
  *   **The Fix:** Hard stop at 30 minutes. Use a timer on the projector. Say explicitly: "We need to move to the moral application to make this relevant to the reading."

  **4. The "Virtue Isn't About Prediction" Objection**
  *   **The Problem:** A sharp student will say: "Virtue ethics isn't a predictive science; it's normative. It's about who we *ought* to be, not who we *are*."
  *   **The Fix:** Acknowledge this is a strong response (it's the Annas/Miller defense). But press back: "If the theory relies on the *cultivation* of character, and character is situationally fragile, how do we cultivate it? If I can't predict my own behavior under stress, how do I know I'm improving?"

  ---

  ### Philosophical Limitations: What This Activity *Can't* Do

  You asked for honesty about where the activity falls short. You are correct that the activity cannot capture the full normative weight of the critique.

  **1. It Demonstrates Error, Not Non-Existence**
  *   **Limitation:** The Quizmaster and Good Samaritan data show that *we are bad at spotting traits* and that *situations influence behavior.* They do not prove that robust traits *do not exist.*
  *   **What you must explain:** A virtue ethicist can concede the FAE and the situational data but argue: "Traits exist, they are just rare (the Sage), or they are local." The activity creates skepticism, but it doesn't prove the Situationist's stronger metaphysical claim (that global traits are folk-psychological fictions). You will need to explicitly state: "This activity shows why the Situationist *doubts* traits, not that they are impossible."

  **2. It Misses the "Fragmentation" Argument**
  *   **Limitation:** Doris argues that our behavior is so fragmented across situations that positing a unified "self" or "character" is misleading. The classroom activity is too short to show *cross-situational* inconsistency in a single person.
  *   **What you must explain:** You'll need to verbally walk them through the idea that the "Helpful You" in the classroom might be the "Cruel You" at home under stress. The activity shows situational power, but not necessarily the *fragmentation of the agent* over time.

  **3. It Doesn't Address the Normative "Ought"**
  *   **Limitation:** As noted above, the activity is descriptive. It shows we *are* situationally influenced. It doesn't show that we *shouldn't* evaluate character.
  *   **What you must explain:** The Situationist critique is that if character is fragile, it's the wrong *tool* for moral evaluation. You need to make the link: "If I blame you for a vice that was triggered by a situational cue you couldn't control, is that fair?" The activity hints at this, but you need to articulate the fairness/normative claim.

  **4. It Risks Moral Cynicism**
  *   **Limitation:** Students might leave thinking "Morality is an illusion, so why bother?"
  *   **What you must explain:** End on the constructive note. Situationism isn't about giving up; it's about **situational engineering**. If character is fragile, we should design environments that support virtue (e.g., checklists in hospitals, reducing time pressure). This sets up the "remedial" virtue ethics or institutional ethics discussion for later.

  ### Summary for your Prep
  *   **Run the Quizmaster first.** It warms them up to the idea of "Attribution Error" in a low-stakes way.
  *   **Hit them with the Good Samaritan stats second.** That's where the moral vertigo hits.
  *   **Be ready to pivot.** If the Quizmaster fails (no bias shown), move immediately to the Good Samaritan prediction gap.
  *   **Own the limitations.** Tell them, "This activity shows the *psychological* pressure on virtue ethics. Next week we discuss whether virtue ethics can *survive* that pressure."

  This approach respects the constraints, generates the feeling you want, and leaves the philosophical heavy lifting for the discussion where it belongs. Good luck with the session!
