answer: |-
  ### Thought Experiment: The Certification Dilemma

  **Scenario:**
  Elena is a senior structural engineer responsible for recertifying an aging urban bridge. The bridge is a critical artery for emergency vehicles; closing it would increase ambulance response times significantly, statistically costing lives over the coming year. Additionally, closure would devastate the local economy.

  Elena reviews the latest stress-test data. The results are genuinely ambiguous. The micro-fractures detected are within a "grey zone" of current engineering physics: they do not prove the bridge is unsafe, but they do not prove it is safe either. Objectively, the probability of structural failure within the year is indeterminate, perhaps 1 in 10,000, perhaps 1 in 100. Based strictly on the truth-conducive evidence, Elena is epistemically permitted to withhold belief regarding the proposition $p$: "The bridge is safe for public use." She cannot honestly say she *knows* it is safe.

  However, the Engineering Code of Ethics stipulates that an engineer may only sign the certification form if they *believe* the structure is safe. One cannot sign based on "risk acceptance" or "economic necessity"; the signature is a professional assertion of the belief state itself. Signing without the belief is fraud. Withholding belief (and thus refusing to sign) mandates closure.

  Elena faces a dilemma. She has a compelling moral and pragmatic reason to ensure the bridge remains open (saving lives via emergency access, preserving livelihoods). To do so, she must sign. To sign permissibly, she must *believe* $p$. She cannot simply "choose" to believe $p$ (doxastic involuntarism), nor can she ethically "manipulate" herself into believing $p$ (e.g., by ignoring the data), as that would violate the very professional norms that give her signature weight. Yet, the pressure of the situation makes it seem as though she *ought* to believe $p$, not merely that she ought to wish she did.

  ***

  ### Analysis

  **(a) The Agent's Reasons**
  1.  **Evidential Reason:** The stress-test data is ambiguous. It neither confirms nor disconfirms $p$ decisively. This provides a reason to *withhold* belief or remain in a state of uncertainty.
  2.  **Pragmatic/Moral Reason:** The consequences of the bridge closing (increased mortality due to ambulance delays, economic collapse) are dire. This provides a reason to ensure the bridge stays open, which requires the belief state $p$ to exist so the certification can be ethically signed.

  **(b) Classification**
  1.  **Evidential Reason:** **Object-given.** It bears on the truth of $p$ (the actual safety of the bridge).
  2.  **Pragmatic/Moral Reason:** **State-given.** It bears on the *benefits of holding the belief* (or rather, the benefits of the action that requires the belief). It does not make the bridge safer; it makes the *having of the belief* valuable.

  **(c) Resistance to the "Bring About" Response**
  The standard move in the literature is to claim that state-given reasons for belief are actually reasons to *bring about* the belief (e.g., "You have a reason to take a pill that makes you believe," or "You have a reason to study until you believe").

  In Elena's case, this response fails for two reasons:
  1.  **Impossibility:** Elena is in the moment of judgment. She cannot "bring about" the belief at will. Doxastic involuntarism holds; she cannot simply decide.
  2.  **Normative Exclusion:** Even if she *could* take steps to induce belief (e.g., focusing only on positive data points to bias herself), the Engineering Code of Ethics forbids this. The certification requires the belief to be formed *responsively to evidence*. A "manufactured" belief, brought about by pragmatic pressure, would render the certification unethical (fraudulent), thereby negating the pragmatic benefit (she would be liable for misconduct).

  Therefore, the pragmatic reason cannot be a reason to *cause* the belief, because the only available causal pathways are either impossible (direct will) or normatively blocked (manipulation). The reason must bear directly on the belief state itself: it makes it the case that, all things considered, she *ought to believe* $p$, even if she cannot voluntarily enact that ought.

  **(d) Structural Feature Enabling Resistance**
  The key feature is the **Sincerity Condition on Action**.
  In many WKRP cases (like the demon who rewards belief), the reward attaches to the belief state regardless of how it was formed. Here, the pragmatic good (saving lives via certification) is only accessible if the belief is held *sincerely* and *competently*. If the agent treats the belief as something to be "brought about" instrumentally, she undermines the sincerity required to access the benefit. This blocks the reduction of the reason to a reason for *action* (trying to believe). The reason forces itself into the doxastic deliberation as a direct weight on the question "Ought I to believe?", because the alternative (treating it as a reason to act) destroys the value of the outcome.

  ***

  ### The Defender's Response and Evaluation

  **Defender's Response:**
  A defender of the Object-Given/State-Given distinction (and the view that WKRP does not apply to belief) would argue as follows:
  > "Elena does not have a reason to *believe* the bridge is safe. She has a reason to *certify* the bridge. The requirement that she 'believe' to certify is a external normative constraint on action, not a feature of belief's normativity. The 'ought' she feels is a moral 'ought' to *act* (certify), coupled with a regretful acknowledgement that she lacks the epistemic standing. If she cannot believe based on evidence, she ought to change the regulations, not her mind. The state-given reason remains a reason for action (or for wishing she had different evidence), not a reason for belief."

  **Evaluation:**
  This response is **partially ad hoc**.
  It relies on a rigid separation between "epistemic oughts" (truth-tracking) and "moral oughts" (consequences). However, Elena's deliberation is not split. She is not asking "What should I do?" and separately "What should I believe?" She is asking "Can I, in good conscience, hold the belief required to do what I must?"

  If the defender insists that *no* pragmatic reason can ever count as a reason for belief, they must dismiss Elena's intuition that the stakes make the belief *appropriate*. But if they admit that high stakes can make a belief appropriate (Pragmatic Encroachment), they risk conceding that state-given reasons *do* impact doxastic justification.

  The defender's move is ad hoc because it arbitrarily defines "reasons for belief" as only those that survive the "bring about" test. In Elena's case, the "bring about" path is blocked by the very norms defining the belief's context. To maintain the distinction, the defender must claim that Elena is simply confused—that there is *no sense* in which she ought to believe. But this contradicts the professional reality where "believing safely" under pressure is a recognized, albeit risky, competency. Thus, the case suggests the Object-Given/State-Given distinction is leaky when the *value of the belief* depends on it *not* being instrumentally manufactured.
