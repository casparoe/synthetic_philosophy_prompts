prompt: |-
  In formal logic and mathematics, a proof is a sequence of statements where each line is either a premise or follows from earlier lines by an explicit rule of inference — modus ponens, universal instantiation, and so on. Every step must be justified, but the rules of inference themselves are never justified within the proof. They are simply taken as primitive. This looks like a harmless design choice, but it has a strange consequence: if someone sincerely refused to accept modus ponens, we would have no further argument to give them. We could only repeat the rule, or apply it to itself — which seems circular, or question-begging, or the start of an infinite regress. What theory of the justification of deduction does this practice presuppose? Does it commit us to the view that basic rules of inference are not the kind of thing that can be justified at all — that justification has to stop somewhere? Or is there a coherent way to justify deduction that the practice simply declines to make explicit? And if we took Lewis Carroll's regress argument seriously, what would a proof system that did justify its own rules even look like — or does the argument show that the whole demand is confused? Reconstruct the implicit theory, say whether it is stable under the regress challenge, and tell me what would have to change in how we present and teach logical reasoning if the practice acknowledged the problem.

  Respond in the style of an expert philosopher of logic. Think very carefully before answering. Structure your answer as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
