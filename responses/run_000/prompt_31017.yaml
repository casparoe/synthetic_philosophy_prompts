answer: |-
  This is an excellent question, and it is crucial to get the philosophical machinery right before teaching this puzzle. Kavka's Toxin Puzzle is deceptively simple, and your working gloss captures the intuitive tension well. However, framing it primarily as a counterexample to **Expected Utility Theory (EUT)** specifically might lead to some confusion, or at least miss the more profound lesson regarding the **nature of intention and planning agency.**

  Here is a breakdown of where your framing is strong, where it might need nuance, and how to locate the lesson for your unit on instrumental rationality.

  ### 1. Is it a Counterexample to Expected Utility Theory?

  Your gloss suggests the puzzle shows EUT issuing "contradictory prescriptions." Technically, standard EUT does not necessarily contradict itself here; rather, it runs into a **psychological or conceptual impossibility.**

  *   **The EUT Calculation:** If we treat "forming an intention" as an action available to the agent, EUT calculates:
      *   *Option A (Form Intention):* Cost = 0, Benefit = $1M. Net = +$1M.
      *   *Option B (Do Not Form Intention):* Cost = 0, Benefit = 0. Net = 0.
      *   **EUT Verdict:** Form the intention.
  *   **The Problem:** EUT does *not* prescribe drinking the toxin tomorrow. It prescribes forming the intention tonight. The paradox arises because most philosophers (following Kavka) agree on a **Knowledge Condition on Intention**: *One cannot intend to do X if one knows one will not do X.*
  *   **The Conflict:** Since EUT also dictates that drinking the toxin tomorrow is irrational (costly with no benefit), a rational agent *knows* tonight that she will not drink tomorrow. Therefore, she *cannot* form the intention tonight.
  *   **The Lesson:** The puzzle does not necessarily show EUT is mathematically wrong. It shows that **EUT assumes a voluntariness of intention that may not exist.** It assumes agents can simply "choose" mental states like intentions as if they were physical actions.

  **Pedagogical Tip:** If you frame it as "EUT is false," students might think the math is wrong. It is better to frame it as: **"EUT assumes agents can directly control intentions, but rationality itself prevents that control in this case."** This makes rationality self-defeating.

  ### 2. The "Self-Deception" Solution

  You mention tempting students with the idea of "local self-deception." This is a valid response (often associated with Thomas Schelling or Jon Elster), but it is controversial.

  *   **The Strategy:** The agent manipulates her own beliefs (e.g., burns her bridges, makes a public vow) to make it true that she *will* drink, thereby allowing her to intend.
  *   **The Objection:** Kavka's original formulation stipulates that the agent knows the offer structure perfectly. If she is rational, she knows the self-deception is a trick. Furthermore, many philosophers argue that intention requires a belief that one *will* act, not just a hope or a manipulated belief.
  *   **Recommendation:** Present self-deception as **one possible solution**, but not the only one. If you present it as the primary alternative to abandoning EUT, students might miss the more structural critiques regarding planning.

  ### 3. The Better Location: Norms of Intention and Planning

  You ask if the lesson is better located in the norms governing intention. **Yes, this is the dominant view in contemporary action theory.** The puzzle is less about utility calculation and more about the relationship between **present intention** and **future action.**

  Here are the two main frameworks you should consider presenting to your students:

  #### A. The Planning Theory of Intention (Michael Bratman)
  Bratman argues that intentions are not just predictions or desires; they are **plan-states** that play a functional role in coordinating our lives over time.
  *   **The Lesson:** Rationality is not just about maximizing utility at every discrete moment (myopic choice). It is about **stability.** A rational agent needs intentions that resist reconsideration.
  *   **Application:** The Toxin Puzzle shows that if we are purely "moment-by-moment" maximizers, we lose the ability to benefit from plans. Therefore, instrumental rationality requires a norm of **intention stability** (stick to your plan unless there is a significant reason not to), even if the local utility calculation at the moment of action shifts slightly.

  #### B. Constrained Maximization vs. Straightforward Maximization (David Gauthier)
  Gauthier uses the Toxin Puzzle to argue that standard instrumental rationality ("straightforward maximization") is self-defeating.
  *   **The Lesson:** To be truly rational, one must be a "constrained maximizer"—someone disposed to follow through on intentions even when it is locally sub-optimal to do so.
  *   **Application:** Rationality should evaluate the **agent's disposition**, not just the individual **act**. A disposition to keep intentions yields higher utility in the long run (you get the money), even if the specific act (drinking) is costly.

  ### 4. Revised Framing for Your Unit

  To make your unit on instrumental rationality robust, I suggest adjusting your framing from "EUT vs. Self-Deception" to **"Myopic Rationality vs. Planning Rationality."**

  Here is a proposed structure for presenting the puzzle:

  1.  **The Setup:** (As you have it).
  2.  **The Paradox:**
      *   To get the money, I must intend.
      *   To intend, I must believe I will drink.
      *   But drinking is irrational (no benefit, only pain).
      *   So I know I won't drink.
      *   So I can't intend.
      *   So I can't get the money.
      *   **Conclusion:** Being perfectly rational makes me poorer.
  3.  **The Diagnostic Question:** Where is the bottleneck?
      *   *Is it the theory of utility?* (Gauthier: Yes, we need to maximize dispositionally).
      *   *Is it the theory of intention?* (Bratman: Yes, intentions need to be stable plan-states, not just predictions).
      *   *Is it the psychology?* (Schelling: Yes, we need pre-commitment strategies).
  4.  **The Upshot for Instrumental Rationality:**
      *   Instrumental rationality cannot be purely **forward-looking at the moment of action**. If it is, we cannot participate in beneficial cooperative or planning structures.
      *   Therefore, instrumental rationality must include **norms of consistency over time.** We must be allowed to bind our future selves, or treat our past intentions as reasons for action in themselves (the "normative significance of intention").

  ### Summary of Recommendations

  1.  **Avoid calling it a strict counterexample to EUT.** Call it a challenge to the **standard model of agency** that usually accompanies EUT. The math works; the psychology of the agent breaks.
  2.  **Downplay "Self-Deception" as the primary solution.** While interesting, it sidesteps the normative question. Focus instead on **pre-commitment** or **dispositional rationality**.
  3.  **Highlight the "Self-Defeating" nature of Rationality.** This is the most provocative philosophical hook. Standard rationality prevents the agent from accessing a benefit that is available to the irrational (or the less reflective).
  4.  **Connect to Planning.** Since your unit is on instrumental rationality, use this to pivot from "satisfying desires" to "executing plans." The puzzle demonstrates that **plans have normative weight.**

  By shifting the focus from "Is EUT wrong?" to "What kind of temporal structure must a rational agent have?", you will give your students a much richer understanding of the debate surrounding Kavka's puzzle.
