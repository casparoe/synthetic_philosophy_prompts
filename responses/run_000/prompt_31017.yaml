          *   *Nuance:* EUT evaluates actions. Is "intending" an action? If yes, EUT says "Intend." But psychology says "Can't intend if you know you won't act." So the constraint is psychological/normative, not mathematical.
      *   **The "Contradiction" Point:** Clarify that EUT doesn't prescribe drinking. It prescribes *intending*. The paradox is that rational agents *cannot* intend. So rationality is self-defeating in this specific context.
      *   **Alternative Framings (The "Lesson"):**
