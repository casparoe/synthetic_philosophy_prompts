answer: |-
  1. **Clarifications**
  Dennett's **crane/skyhook** distinction categorizes explanatory mechanisms based on ontological grounding. A skyhook is a miraculous, free-floating justification that lifts complexity without substrate support (e.g., Intelligent Design, a Cartesian ego). A crane is a naturalistic mechanism built from below, resting on prior physical laws to lift complexity (e.g., natural selection). It is fundamentally a test of whether an explanation cheats. **Greedy reductionism**, conversely, is a methodological vice. It occurs when an explanation bypasses intermediate functional levels to jump straight to the physical basement (e.g., explaining economics via quark physics). "Good" reductionism respects emergent levels while maintaining physical supervenience. The slipperiness lies in Dennett's usage: sometimes "greedy" implies skipping levels, other times it implies denying the reality of higher-level patterns entirely. While cranes address *where* explanation comes from, greediness addresses *how granular* the explanation should be. However, Dennett occasionally conflates the two, suggesting that skipping levels is akin to positing magic, which blurs the line between structural support and explanatory grain, creating the confusion your students are encountering.

  2. **The case for independence**
  One can argue these tools operate on orthogonal axes. The crane/skyhook distinction concerns metaphysical grounding, while greedy reductionism concerns explanatory strategy. A non-reductive dualist could reject skyhooks in the psychological realm (insisting on mental laws) yet still avoid greedy reductionism by respecting the autonomy of psychology against physics. They deny cranes but aren't greedy. Conversely, one could accept the crane framework—insisting all explanation must be bottom-up—but still be guilty of greediness. Imagine an evolutionary psychologist who insists every behavior is directly selected (a crane) but ignores developmental constraints or cultural transmission levels. They are using cranes, but skipping the intermediate structural layers, thereby committing greedy reductionism. The charge of greediness presupposes a layered ontology that the crane metaphor doesn't strictly enforce. You can build a crane badly (greedy) or build a skyhook (anti-crane). The error types are distinct: one is fabrication (skyhook), the other is oversimplification (greed). This suggests they are separable diagnostic tools for different kinds of explanatory failure. The crane distinction tells you if you are a naturalist; the greediness charge tells you if you are a competent one. You could theoretically be a naturalist who is consistently too coarse-grained, or a dualist who is meticulously careful about levels.

  3. **The case for dependence**
  However, the independence case collapses under Dennett's specific naturalism. The crane framework *requires* a specific approach to levels that makes greedy reductionism a derivative failure. To build a crane, you must construct support from the bottom up. If you skip levels (greediness), you aren't actually building a crane; you're attempting a miniature skyhook. When you try to explain consciousness directly via neurons without computational levels, you lack the structural support to hold the weight of the explanation. You implicitly posit a magic leap. Thus, greedy reductionism is simply the failure to construct adequate cranes. The dependence runs from crane to greed: the prohibition on skyhooks dictates that explanation must be cumulative. Greediness violates cumulativity. Therefore, the charge of greediness only has bite if you already accept the crane obligation. Without the demand for grounded support, skipping levels is just efficiency. With the crane constraint, skipping levels is explanatory bankruptcy. They are not separate tools; greediness is the specific way cranes collapse. The metaphysical requirement generates the methodological prohibition. You cannot have the warning against greed without the prior commitment to grounded construction.

  4. **What's settled and what's contested**
  Competent readers agree Dennett deploys both concepts to defend Darwinian naturalism against dualism and obscurantism. Everyone agrees he rejects skyhooks and warns against greed. The contestation lies in whether Dennett successfully distinguishes them in practice. Critics like Gould or Lewontin argue Dennett *is* a greedy reductionist despite his protests, using "cranes" to legitimize skipping biological levels (e.g., universal acid adaptationism). They see the "greedy" label as a rhetorical shield rather than a substantive constraint. Another dispute concerns whether "real patterns" (higher levels) are ontologically robust or merely heuristic. If patterns are merely heuristic, the charge of greediness loses force. My view aligns with the dependence reading: Dennett's ontology of real patterns binds the two. I flag this as contested because many interpret Dennett as an eliminativist who uses "good reductionism" to sneak in skyhook-free eliminativism, whereas I argue he retains higher levels as real, making the crane/greed link essential. If you read him as an eliminativist, the concepts diverge; if you read him as a real-pattern realist, they converge.

  5. **Your verdict**
  The crane/skyhook distinction is the more fundamental piece. It establishes the ontological rules of the game: no free lunches, everything must be supported. Greedy reductionism is merely a tactical violation of those rules. You cannot understand why greediness is a vice without first accepting that explanations require structural support (cranes). If skyhooks were permissible, greediness wouldn't matter; you could just jump to the top. Therefore, the crane framework grounds the reductionism debate. The relationship holds up, but only if you accept Dennett's "real patterns" doctrine. Without that, the warning against greed looks like empty caution. But within Dennett's system, cranes are the architecture; greediness is the construction error. The bottom line: Crane/skyhook defines the metaphysics; greedy reductionism defines the methodology. Metaphysics drives methodology. Dennett is first a naturalist (cranes), second a reductionist (greedy vs. good). The dependency is real: you need the crane to know why greed is bad.
