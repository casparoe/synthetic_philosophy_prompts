          *   Greedy Reductionism: Ignoring intermediate levels, trying to go straight to the bottom (physics) without respecting functional levels.
          *   Ambiguity: Sometimes "reductionism" is used loosely. Dennett sometimes conflates "bad reductionism" with "skyhook hunting."
          *   *Drafting thought:* Keep it tight. Focus on the structural role in explanation.

