prompt: |-
  So here's a prompt for you, something I've been chewing on and would love a sharp take on. I'm teaching a grad seminar on reduction and explanation, and we just spent two weeks on Dennett — mainly *Darwin's Dangerous Idea* and some of the back-and-forth it spawned. One thing that keeps tripping up my students (and, honestly, me too on a bad day) is the relationship between two of his big conceptual moves: the cranes-vs-skyhooks distinction on the one hand, and the charge of greedy reductionism on the other. They're clearly doing different work, but they also seem to lean on each other in ways Dennett doesn't always spell out. So here's what I'd like you to do.

  Compare Dennett's crane/skyhook distinction with his notion of greedy reductionism. In particular: are these two ideas genuinely independent of each other, or does one presuppose the other in a nontrivial way? And if you had to say which of the two is the more fundamental piece of his overall view of explanation, which would it be and why?

  Please structure your response with the following sections, in this order:

  1. **Clarifications** (about 200 words). Lay out what each concept is supposed to capture, as precisely as you can. Don't assume I need the basics defined from scratch — assume I know the territory — but do flag any ambiguities or slippery edges in how the terms get used across Dennett's work.

  2. **The case for independence** (about 250 words). Make the best argument you can that these are separate conceptual tools: that you could in principle accept the crane/skyhook framework while rejecting the charge of greedy reductionism, or vice versa. Give the strongest examples or thought experiments you can think of.

  3. **The case for dependence** (about 250 words). Now argue the opposite: that one of these ideas genuinely needs the other to do its work, or that they're two faces of a single deeper commitment. Be specific about which way the dependence runs and why it matters.

  4. **What's settled and what's contested** (about 200 words). Here's where I want you to be careful. Separate the parts of this comparison that any competent reader of Dennett would agree on from the parts where reasonable people who know the literature genuinely disagree. If your own view (as it comes through in the other sections) lands on one side of a live dispute, flag that explicitly here. Don't let a contested reading masquerade as the obvious one.

  5. **Your verdict** (about 200 words). Stick the landing: which concept is more fundamental to Dennett's project, and does the relationship between them hold up under pressure? A sentence or two of justification is fine, but I want a clear bottom line, not a waffle.

  Don't worry about making it pretty — I'd rather have sharp and a little rough than polished and evasive.
