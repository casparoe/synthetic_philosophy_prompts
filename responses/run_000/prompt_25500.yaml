      *   **Greedy Reductionism:** From *Darwin's Dangerous Idea* (and earlier/later works). "Good" reductionism vs. "Greedy" reductionism. Good reductionism explains higher levels via lower levels while respecting the emergent patterns. Greedy reductionism tries to skip levels, ignoring the explanatory power of intermediate abstractions (e.g., explaining economics directly via physics). It's about the *strategy* and *granularity* of explanation.

