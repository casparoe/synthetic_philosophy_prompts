prompt: |-
  I'm a junior and I got elected to my school's Academic Integrity Panel this year. We're hearing a case right now that's got everyone stuck. A student — let's call him M — was caught with a cheat sheet under his exam paper. He says he forgot it was there. He'd made it while studying the night before, shoved it in his notebook, and didn't realize it was still under his test paper when he sat down for the exam. The proctor says the sheet was face-up and partially visible. M insists he never looked at it during the test and had zero intention to cheat.

  The panel is totally split. Half the members are saying: look, M is the only person who has access to his own intentions. If he says he didn't mean to cheat, we have to take that seriously — who are we to tell him what was going on inside his own head? The other half says: we can't just take someone's word for it when the external evidence points the other way. People rationalize after the fact, they lie to themselves, and honestly maybe people don't even have perfect access to their own mental states in the moment — like, you can be doing something and not fully register what you're doing.

  I need to draft the decision memo for the panel before we meet on Thursday. It should recommend whether we find M responsible for cheating or not, and lay out the reasoning. It needs to engage both sides fairly — not just pick one and dismiss the other. The memo has to have an actual bottom line the panel can vote on.

  Also, at the very end of the memo, add a short note saying how confident you are in the overall recommendation and which specific step in the reasoning you're least sure about. I want to know where this thing might be shaky.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior student, member of the Academic Integrity Panel.
      *   **Task:** Draft a decision memo for the panel regarding a cheating case (Student M).
      *   **Case Details:** Student M had a cheat sheet under his exam paper. Claims he forgot it was there (made it while studying, left it in notebook). Proctor says it was face-up/partially visible. M claims no intent to use it.
      *   **Panel Conflict:** Split 50/50.
          *   *Side A (Subjective Intent):* Only M knows his intentions. If he says no intent, we must respect that epistemic privilege.
          *   *Side B (Objective Evidence/Behavior):* External evidence contradicts self-report. People rationalize/lie/self-deceive. Intent isn't always transparent even to the agent.
      *   **Requirements:**
          *   Recommend a verdict (Responsible or Not Responsible).
          *   Engage both sides fairly (no dismissal).
          *   Provide a clear bottom line for voting.
          *   **Crucial Addition:** A short note at the very end stating confidence level and the shakiest step in reasoning.
      *   **Tone:** Professional, reasoned, fair, appropriate for a student panel memo.

  2.  **Determine the Verdict:**
      *   *Option 1: Not Responsible.* This leans heavily on Side A. It risks undermining the integrity policy. If having a cheat sheet isn't cheating, what is? It sets a dangerous precedent.
      *   *Option 2: Responsible.* This leans heavily on Side B. It acknowledges that possession + opportunity = violation, regardless of stated intent. Most academic integrity policies focus on *unauthorized materials* rather than *proven usage*.
      *   *Decision:* "Responsible" is the stronger position institutionally and logically, but it needs to be nuanced to respect Side A's concerns about intent. The distinction should be between "Intent to Cheat" (mental state) and "Responsibility for Unauthorized Materials" (action/standard of care). Most university policies define cheating as *having* unauthorized aid, not necessarily *using* it successfully.
      *   *Refinement:* I need to frame this not as "M is a liar" but as "M failed in his duty to secure his testing environment." This bridges the gap. It acknowledges he might not have *planned* to cheat, but he is responsible for the *risk* he created.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose of the memo (recommendation on Case M).
      *   **Case Summary:** Briefly recap the facts (Cheat sheet found, M's explanation, Proctor's observation).
      *   **The Core Dispute:** Explicitly outline the two viewpoints (Subjective Intent vs. Objective Responsibility). This shows I'm listening to the panel's debate.
      *   **Analysis/Reasoning:**
          *   Acknowledge Side A: We cannot read minds. Self-reporting matters.
          *   Acknowledge Side B: Actions have consequences. Negligence is a form of responsibility.
          *   Synthesis: Shift the standard from "Did he *mean* to cheat?" to "Did he violate the policy regarding unauthorized materials?" Most policies prohibit *possession*, not just *usage*. Even if he didn't look, having it there gave him an *opportunity* that others didn't have.
          *   Standard of Care: Students have a duty to ensure their workspace is clean. Forgetting it there is negligence, which is still a violation in most academic contexts.
      *   **Recommendation:** Find M Responsible.
      *   **Sanctioning (Optional but helpful context):** Maybe suggest a lighter sanction due to lack of proven usage, but the verdict must be "Responsible."
      *   **Confidence Note:** As requested, add the specific note at the end.

  4.  **Refining the Argument (Addressing the "Split"):**
      *   *Side A's concern:* "Who are we to judge his mind?" -> *Response:* We aren't judging his soul; we are judging his compliance with exam rules.
      *   *Side B's concern:* "Evidence points to cheating." -> *Response:* We don't need to prove he *looked*, only that the material was *accessible*.
      *   *Key Concept:* "Strict Liability" vs. "Intent." In academic integrity, possession is often strict liability. I need to explain this clearly.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Is it too legalistic? Keep it accessible for student panelists.
      *   *Fairness:* Make sure Side A doesn't sound naive. Their point about self-knowledge is philosophically valid, just practically difficult to administer.
      *   *The "Shaky Step":* Where is the argument weak? It's weak in assuming the policy *actually* covers negligence/possession without usage. Some policies require "use." I need to assume a standard policy for the sake of the memo, but acknowledge that interpretation is the weak point. Or, the weak point is inferring negligence vs. accident. Let's go with the interpretation of "possession vs. use."

  6.  **Final Review against Constraints:**
      *   Memo format? Yes.
      *   Engage both sides? Yes.
      *   Clear bottom line? Yes.
      *   Confidence note at the very end? Yes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like a judge handing down a final ruling, but a drafter proposing a recommendation *for* the panel to vote on.
      *   *Correction:* Ensure the confidence note is distinct and follows the instruction exactly.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Panel
  **FROM:** [Your Name/Role], Panel Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Case M (Unauthorized Material)

  **1. Purpose**
  The purpose of this memo is to provide a draft recommendation for the Panel's vote regarding Student M. As we prepare for Thursday's deliberation, this document outlines the facts, summarizes the divergent viewpoints currently held by the Panel, and proposes a reasoning framework that allows us to reach a verdict consistent with our university's Academic Integrity Policy.

  **2. Case Summary**
  *   **Incident:** During a midterm exam, a proctor discovered a handwritten note sheet containing course formulas tucked under Student M's exam paper.
  *   **Physical Evidence:** The proctor reports the sheet was face-up and partially visible.
  *   **Student Statement:** M admits to creating the sheet while studying the night before. He states he inadvertently left it in his notebook and forgot to remove it before the exam. He asserts he did not look at the sheet during the exam and had no intention to use it.
  *   **Policy Violation:** The charge is "Possession or Use of Unauthorized Materials."

  **3. The Core Dispute**
  The Panel is currently divided on how to weigh M's stated intent against the physical evidence.

  *   **Viewpoint A (Subjective Intent):** This perspective argues that academic integrity violations require *mens rea* (a guilty mind). Since M is the only person with direct access to his own intentions, his testimony that he did not intend to cheat should be given decisive weight. To rule otherwise is to claim we know his mental state better than he does.
  *   **Viewpoint B (Objective Responsibility):** This perspective argues that external behavior and risk management take precedence. Students are capable of self-deception or post-hoc rationalization. Furthermore, the presence of the sheet created an unfair advantage regardless of whether it was glanced at. Relying solely on self-reported intent makes the policy unenforceable.

  **4. Analysis and Reasoning**
  To resolve this split, we must distinguish between *moral blameworthiness* (was he trying to be dishonest?) and *policy compliance* (did he violate the rules of the exam environment?).

  **Acknowledging Viewpoint A**
  We must accept that we cannot definitively prove M looked at the sheet. There is no eye-tracking data or confession of usage. If our policy required proof of *usage*, M would likely be not responsible. We should also accept that M may genuinely believe he didn't intend to cheat. Accusing him of deliberate malice is not supported by the evidence.

  **Acknowledging Viewpoint B**
  However, academic integrity policies are generally designed to maintain a level playing field. The advantage in an exam setting is not just about what you know, but about what resources you have *available*. By having the sheet present, M possessed a resource other students did not. Whether he consciously accessed it is secondary to the fact that the option was available to him.

  **Synthesis: The Standard of Care**
  The most robust interpretation of our policy focuses on **student responsibility for the testing environment.**
  1.  **Possession is the Violation:** Most academic integrity codes define the violation as the *presence* of unauthorized aid, not just the *consumption* of it. If we require proof of usage, we incentivize students to keep cheat sheets "just in case" and claim they never looked at them if caught.
  2.  **Negligence vs. Intent:** M's explanation points to negligence, not necessarily premeditated cheating. However, negligence regarding exam materials is still a breach of the student's duty. Students are responsible for ensuring their pockets, notebooks, and desks are clear of unauthorized materials before sitting down. Forgetting a cheat sheet is a failure of that duty.
  3.  **Epistemic Humility:** We do not need to claim we know M's mind better than he does. We only need to claim that his internal state does not negate the external violation. He can honestly believe he meant no harm, but still be responsible for the risk he introduced into the exam room.

  **5. Recommendation**
  Based on the reasoning above, I recommend the Panel vote to find Student M **Responsible** for a violation of the Academic Integrity Policy regarding Unauthorized Materials.

  **Rationale for Verdict:**
  *   The presence of the material is undisputed.
  *   The material was accessible (face-up/under the paper).
  *   The policy places the burden on the student to secure their testing space.

  **Recommendation on Sanctioning:**
  While the verdict should be "Responsible," the Panel may wish to consider M's lack of prior record and the plausibility of his explanation regarding *intent* when determining sanctions. A finding of responsibility does not automatically require the harshest penalty (e.g., suspension). A failing grade on the exam or a reduced course grade, coupled with an educational module on integrity, may be appropriate given the ambiguity of usage.

  **6. Next Steps**
  Please review this reasoning prior to Thursday. We will vote on the verdict first, then discuss sanctions if the vote passes.

  ***

  **Confidence Note:**
  I am **moderately confident** in this recommendation. The specific step in the reasoning I am least sure about is the interpretation of the specific policy language regarding "Possession" versus "Use." If our university's specific code requires proof that the material was *consulted* rather than just *present*, the "Responsible" verdict becomes legally vulnerable. We need to double-check the exact wording of the policy before finalizing the vote.
