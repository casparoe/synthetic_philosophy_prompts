answer: |-
  "The path is safe," I say, and trust the light,
  Though pits lie open where my footsteps tread.
  I speak no guile within the thing I said,
  For truth resides within my blinded sight.
  "The path is safe," he says, to match the light,
  Yet deems it fraught with peril and with dread.
  He speaks the fact but lies within his head,
  And offers truth while cloaked in inner night.

  Yet judgment falls not on the spoken part,
  Nor weighs the fact that slips the tongue's confine,
  Where will and vision blend or else sever;
  But searches deep the secret of the heart.
  For one is single, though his facts decline,
  And one is double, lying forever.
