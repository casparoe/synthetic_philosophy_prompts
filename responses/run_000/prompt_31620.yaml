prompt: |-
  I am a novelist, and I am working on a book whose protagonist hosts a small but serious podcast on democratic theory. In one of the central scenes, she interviews a political theorist known for defending the all-affected-interests principle: the view that everyone whose interests are affected by a collective decision ought to have some say in making it, and that this principle offers the right answer to the boundary problem, the question of who should make up the demos in a democracy. I want this scene to feel like a real exchange between two people who know the terrain, not a soft introduction for a lay audience, so the host should be able to press the position where it is genuinely strained.

  Please draft eight to ten interview questions for the scene. The questions should go well beyond asking the guest to restate his view. At least one should press the circularity worry: that identifying who is affected seems to require a prior decision about which decisions count and who gets to judge that, which is precisely the question the principle is meant to answer. At least one should press the difference between being affected by a decision and being subject to a polity's laws, since many people may be affected by, say, a state's environmental policy without being governed by it. At least one should press the over-inclusiveness worry: once causal chains are traced far enough, nearly everyone is affected by nearly everything, so the principle may generate a demos with no workable boundaries. At least one should press the instability of the demos across levels and framings of a decision, since a city ordinance, a national statute, and a treaty each seem to summon a different demos. And at least one should ask whether the boundary problem admits of a democratic solution at all, or whether the act of constituting the demos must ultimately rest on something other than democratic principle. For each question, include a follow-up keyed to the reply the guest is most likely to give, so the host can keep the pressure on rather than allowing him to deflect.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A novelist writing a scene where a protagonist (podcast host) interviews a political theorist.
      *   **Topic:** Democratic theory, specifically the "all-affected-interests principle" (AAI) and the "boundary problem" (who constitutes the *demos*).
      *   **Tone:** Serious, expert-level exchange. Not a soft intro. The host knows the terrain and presses hard on weaknesses.
      *   **Requirements:** 8-10 interview questions.
      *   **Specific Constraints:**
          *   Must address the circularity worry (identifying affected interests requires prior boundaries).
          *   Must address the distinction between being *affected* vs. being *subject to* law/coercion.
          *   Must address the over-inclusiveness worry (causal chains make everyone affected by everything).
          *   Must address the instability of the *demos* across levels/framings (city vs. national vs. treaty).
          *   Must address whether the boundary problem admits of a *democratic* solution at all (constitutive paradox).
          *   Each question needs a follow-up keyed to the guest's likely defensive reply.

  2.  **Deconstruct the Subject Matter (All-Affected-Interests Principle):**
      *   *Core Claim:* Everyone affected by a decision should have a say.
      *   *The Boundary Problem:* Democracy requires a pre-defined group (*demos*) to vote, but how do we define that group democratically without already having a *demos*?
      *   *Critiques:*
          *   *Circularity:* To know who is affected, you need to know the scope of the decision, but the scope depends on who is deciding.
          *   *Causal Chains:* If I buy coffee, it affects farmers in Colombia. Do they get a vote on my purchase? If a state pollutes, does it affect neighbors? Yes. Does it affect the global climate? Yes. Does everyone get a vote?
          *   *Subjecthood vs. Effect:* Being impacted by a weather pattern isn't the same as being subject to a sovereign's coercion.
          *   *Fluidity:* If the *demos* changes every time a new issue arises, how do you maintain institutional stability?
          *   *The Constitutive Paradox:* You can't vote on who gets to vote without already deciding who gets to vote.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Make the host sound sharp, well-read, and unwilling to accept platitudes.
      *   *Structure:* Question -> Anticipated Guest Defense -> Follow-up.

      *   *Drafting Q1 (Circularity):* Start with the foundational logical problem.
          *   *Q:* How do you determine affectedness without already having boundaries?
          *   *Guest:* We use a counterfactual test.
          *   *Follow-up:* Who applies that test? If the testers are the boundary, you haven't solved it.

      *   *Drafting Q2 (Affected vs. Subject):* Distinguish impact from coercion.
          *   *Q:* Why not "all-subjected" instead of "all-affected"?
          *   *Guest:* Coercion is too narrow; impact matters morally.
          *   *Follow-up:* But impact without recourse creates noise. How do you filter mere causality from political stake?

      *   *Drafting Q3 (Over-inclusiveness/Causal Chains):* The "butterfly effect" problem.
          *   *Q:* Doesn't this expand the *demos* to infinity?
          *   *Guest:* We limit it to *significant* interests.
          *   *Follow-up:* Who defines significance? Isn't that just re-introducing the boundary by the back door?

      *   *Drafting Q4 (Instability/Fluidity):* Institutional continuity.
          *   *Q:* If the *demos* changes per issue, how do institutions function?
          *   *Guest:* We need fluid constituencies, not fixed states.
          *   *Follow-up:* But accountability requires a stable electorate. How do you punish representatives if the punishers change every vote?

      *   *Drafting Q5 (The Constitutive Paradox):* Can democracy solve its own origin?
          *   *Q:* Is the boundary problem actually solvable democratically?
          *   *Guest:* It's a process, not a one-time event.
          *   *Follow-up:* But the initial process requires rules. Isn't there a moment of non-democratic fiat?

      *   *Drafting Q6 (Intensity vs. Count):* Aggregation issues.
          *   *Q:* How do you weigh deep impact on few vs. shallow impact on many?
          *   *Guest:* Thresholds of rights violations.
          *   *Follow-up:* That sounds like constitutionalism trumping democracy. Are you abandoning the principle for rights?

      *   *Drafting Q7 (Epistemic Burden):* Knowing the future.
          *   *Q:* Decisions have unintended consequences. How do you include people you didn't know would be affected?
          *   *Guest:* Ex-post contestation.
          *   *Follow-up:* So the *demos* is always retrospective? That undermines the authority of the initial decision.

      *   *Drafting Q8 (Global vs. Local):* Scaling.
          *   *Q:* Does this imply a global demos for climate?
          *   *Guest:* Yes, functionally.
          *   *Follow-up:* But there's no global state. Are you arguing for democracy without sovereignty? Is that coherent?

      *   *Drafting Q9 (The "Interest" Definition):* Subjective vs. Objective.
          *   *Q:* Who defines the "interest"? The actor or the theorist?
          *   *Guest:* Objective human needs.
          *   *Follow-up:* That's paternalistic. How is that democratic?

      *   *Drafting Q10 (The Alternative):* If not AAI, then what?
          *   *Q:* If AAI fails, do we retreat to nationalism?
