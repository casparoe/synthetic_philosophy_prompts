answer: |-
  Here are ten interview questions designed for your scene, complete with follow-ups. They are structured to move from the conceptual foundations to the institutional implications, maintaining a tone of rigorous philosophical scrutiny.

  **1. The Circularity Worry**
  "Let's start with the logical architecture of the all-affected-interests principle. You argue that the scope of the *demos* should be determined by the scope of the decision's impact. But to calculate who is affected, don't we first have to decide which causal chains count and which don't? And isn't making that selection itself a collective decision that requires a prior *demos* to authorize it? It seems you're using the *demos* to define the *demos*."

  *   **Likely Guest Reply:** He will likely argue that we can use a counterfactual test based on objective human interests rather than a political vote to determine affectedness initially.
  *   **Follow-up:** "But who administers that counterfactual test? If it's a panel of experts, you've replaced democracy with epistocracy. If it's a group of citizens, you're back to the original question: which citizens? You haven't escaped the circle; you've just hidden the boundary drawing inside the definition of 'interest.'"

  **2. Affected vs. Subjected**
  "There's a rival formulation in the literature: the 'all-subjected' principle. It argues that only those coerced by a polity's laws need a say, not everyone tangentially impacted by its outcomes. If a state's environmental policy lowers property values in a neighboring country, those neighbors are affected, but they aren't subject to that state's legal coercion. Why is mere causal impact sufficient to generate a claim on political membership?"

  *   **Likely Guest Reply:** He will likely contend that coercion is too narrow a metric and that moral stakes are created by significant impacts, regardless of legal jurisdiction.
  *   **Follow-up:** "But if moral stakes alone grant political voice, doesn't that dissolve the distinction between a political community and a web of economic externalities? If I'm affected, I get a vote. But if I have no obligation to obey the resulting law, what kind of 'voice' is that? It sounds like veto power without responsibility."

  **3. The Over-Inclusiveness Problem**
  "Let's trace the causal chains. A city council votes to subsidize a local factory. That factory competes with a factory abroad, affecting workers there. Those workers spend money locally, affecting global markets. If we follow the all-affected principle rigorously, the *demos* for a municipal zoning law could theoretically include half the globe. How do you stop the boundary from expanding until it becomes meaningless?"

  *   **Likely Guest Reply:** He will likely propose a threshold of significance—that only *substantial* or *vital* interests trigger inclusion, not trivial economic ripples.
  *   **Follow-up:** "Who sets that threshold? If the existing *demos* sets it, they will naturally exclude outsiders to protect their own power. If an external body sets it, we're no longer talking about self-determination. You're asking the insider group to voluntarily dilute their own sovereignty based on a metric they define. That relies on altruism, not theory."

  **4. Institutional Instability**
  "Democracy requires institutional continuity. We need stable electorates to hold representatives accountable over time. But if the *demos* reconstitutes itself every time a new issue arises—climate change summons a global *demos*, zoning summons a local one—how do you maintain accountability? How do I vote out a representative today if the people harmed by their decision yesterday are no longer part of the electorate?"

  *   **Likely Guest Reply:** He will likely suggest that we need fluid, functional constituencies rather than fixed territorial states, perhaps managed through digital platforms or issue-specific assemblies.
  *   **Follow-up:** "But without a fixed territory, where does the enforcement power lie? A fluid *demos* can express a preference, but it can't levy taxes or police borders. Are you describing a democracy, or just a sophisticated feedback mechanism for a bureaucracy that remains unelected?"

  **5. The Constitutive Paradox**
  "I want to press on the origin point. Even if your principle works for day-to-day legislation, it can't solve the initial boundary problem. You can't hold a vote to decide who gets to vote in the first vote. Doesn't the act of constituting the *demos* ultimately rest on a moment of non-democratic fiat—whether that's force, history, or accident?"

  *   **Likely Guest Reply:** He will likely argue that constitution is an ongoing process, not a one-time event, and that boundaries are always contestable and revisable.
  *   **Follow-up:** "Revisable by whom? If the rules for revision are set by the current boundary, then the insiders still hold the keys. If the rules aren't set by anyone, you have anarchy. Isn't it more honest to admit that the boundary is a precondition of democracy, not a product of it?"

  **6. Intensity vs. Numbers**
  "Your principle focuses on who is affected, but it doesn't tell us how to weigh the impact. Suppose a decision gives a massive benefit to a million people but destroys the livelihood of a thousand outsiders. Under all-affected-interests, the thousand get a say. But do they get a veto? If not, how is their inclusion meaningful? If so, doesn't a small minority hold the majority hostage?"

  *   **Likely Guest Reply:** He will likely suggest a rights-based constraint, where vital interests trump aggregate utility, preventing the tyranny of the majority.
  *   **Follow-up:** "Now you're smuggling constitutional liberalism into a democratic principle. If the boundary principle relies on pre-political rights to function, then democracy isn't doing the heavy lifting here. Isn't the 'all-affected' principle just a decorative wrapper for a rights regime?"

  **7. Epistemic Uncertainty**
  "Decisions often have unintended consequences. We might pass a law thinking it only affects locals, only to discover five years later it devastated an ecosystem abroad. Does the *demos* need to be retroactively adjusted? If so, does that invalidate the original decision? If not, what was the point of including the 'affected' in the first place?"

  *   **Likely Guest Reply:** He will likely argue for ex-post contestation mechanisms, where affected parties can challenge decisions after the fact if unforeseen impacts arise.
  *   **Follow-up:** "But ex-post contestation is litigation, not legislation. It turns political participation into a lawsuit. That shifts power from the ballot box to the courtroom, which is arguably less democratic than the system you're critiquing."

  **8. The Problem of Future Generations**
  "The most profound effects are often intergenerational. Climate policy today affects people who don't exist yet. They are undeniably 'affected.' Does the all-affected principle require representation for the unborn? And if so, how do you square that with the democratic norm that the living should rule themselves?"

  *   **Likely Guest Reply:** He will likely propose guardians or proxies for future generations within the current legislative structure.
  *   **Follow-up:** "But proxies aren't accountable to their principals. A guardian for the future can't be fired by the future. So you're introducing a class of representatives who are immune to the democratic sanction. That looks like a technocratic veto, not an expansion of the *demos*."

  **9. Scale and Sovereignty**
  "If you apply this principle consistently to issues like carbon emissions or financial regulation, you end up with a global *demos*. But there is no global state. Can you have a *demos* without a *kratos*? Can you have democratic legitimacy without the capacity to enforce the will of that *demos*?"

  *   **Likely Guest Reply:** He will likely argue that sovereignty is disaggregating anyway, and we should move toward a post-Westphalian model of overlapping jurisdictions.
  *   **Follow-up:** "Overlapping jurisdictions work for trade agreements, not for redistribution or welfare. Those require a solidary community willing to tax themselves for strangers. If the *demos* becomes global, doesn't the willingness to sacrifice for one another vanish? You might get a wider *demos*, but a shallower democracy."

  **10. The Alternative**
  "Finally, if the all-affected-interests principle proves too unstable to ground a real-world polity, what is the fallback? Do we retreat to the nation-state as a 'second best' solution? Or do we admit that the boundary problem isn't a puzzle to be solved by theory, but a conflict to be managed by power?"

  *   **Likely Guest Reply:** He will likely insist that the nation-state is morally arbitrary and that we must strive toward the principle even if implementation is imperfect.
  *   **Follow-up:** "But if the implementation requires ignoring the principle in practice to maintain stability, isn't the principle doing any work? Or is it functioning merely as a critical tool—a way to shame existing states—rather than a constructive blueprint for a legitimate *demos*?"
