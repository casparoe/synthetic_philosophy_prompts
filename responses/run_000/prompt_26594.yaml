      *   *Weaknesses:* The standard scholarly consensus is pretty strong against this. Kant's 1797 essay is usually read as reinforcing the *Groundwork*/*Critique of Practical Reason* stance on truthfulness. The distinction between Right and Virtue is real, but truthfulness is a tricky case because it straddles both. Kant explicitly talks about "duties of right" regarding contracts/declarations, but the murderer case is often seen as testing the *moral* law, not just civil liability.

