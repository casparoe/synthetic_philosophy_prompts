      *   *The Collapse:* Even if the 1797 essay is juridical, Kant's ethical system generally forbids lying *in principle*. The *Groundwork* example of the false promise is ethical. The *Metaphysics of Morals* section on Virtue forbids lying as a vice. So, separating the 1797 essay as *only* juridical might not save the ethical conclusion. Kant likely thinks you shouldn't lie ethically *either*, just for different reasons (dignity vs. liability).
      *   *Nuance:* Some scholars (like Allen Wood or Christine Korsgaard) argue there are conflicts of duty. But Kant in 1797 seems to deny conflicts of duty.
