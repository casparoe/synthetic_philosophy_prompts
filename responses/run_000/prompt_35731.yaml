answer: |-
  The air in the consultation room smelled of ozone and lavender, a synthetic attempt at calm that Leo found only made his chest tighter. He sat on the edge of the examination chair, his hands resting on his knees. They looked like his hands. The skin was pale, the knuckles slightly scarred from a childhood bicycle accident. But according to the diagnosis folder on Dr. Aris's desk, the nerves firing signals to those fingers were beginning to misfire. Degenerative Neural Dissociation. A slow unraveling of the biological substrate.

  "The procedure is called Titration," Dr. Aris said. She was a tall woman with silver hair and a tablet that never seemed to leave her hand. "We don't switch you off. We don't scan and copy. That's the old model, and it creates the duplication problem you've probably read about."

  Leo nodded. The duplication problem. If you scan me and build a copy, the copy wakes up thinking it's me, but I—the original—still die in the chair.

  "With Titration," Aris continued, tapping the screen, "we replace neurons one cluster at a time over six months. Synthetic substitutes. Functionally identical to the biological original, but stable. As we swap them out, the function migrates to the new substrate. You stay conscious the whole time. You'll talk to us, you'll eat lunch, you'll sleep. By the end, you'll have a fully synthetic brain. But there will be no break in continuity. No moment where you stop and start again."

  Leo looked at his hands again. "So if I feel pain during the process, the synthetic neurons feel it?"

  "The system reports pain exactly as your biological nerves would. The experience is seamless."

  "Seamless," Leo repeated. He looked up at her. "But when the last neuron is swapped… is the person walking out of here me? Or is it someone who just remembers being me?"

  Aris smiled, a practiced expression that didn't reach her eyes. "That's a metaphysical question, Leo. Medically, you are a pattern of information and processing. If the pattern persists without interruption, the person persists. You'll sign the consent form today, and you'll remember signing it ten years from now. Who else could you be?"

  Leo stood up to leave. "I need to talk to Sarah."

  Sarah was waiting in the lounge area, staring at a holographic fish tank. When she saw him, she stood up quickly, crossing the room to hug him. She held on too long, her face buried in his shoulder. Leo could feel the tremor in her hands.

  "Did she explain it?" Sarah asked, pulling back. Her eyes were red-rimmed.

  "Gradual replacement," Leo said. "No break in consciousness."

  Sarah let out a breath that sounded like a sob suppressed into relief. "Thank God. So you'll be here. You won't… go away."

  Leo frowned. "Sarah, I haven't decided yet."

  "But you will," she said, gripping his arms. "Leo, if you stay biological, you have maybe three years before the dissociation gets bad enough that you can't speak. Can't recognize me. This way… you stay. You stay *you*."

  "That's what I'm not sure about," Leo said gently. "Dr. Aris says I'll be me. But the way she says it… it's like she's talking about fixing a car engine. As long as the car runs, it's the same car."

  "It's not a car, it's your life," Sarah snapped, then softened. "I don't care about the philosophy, Leo. I care about waking up next to you. If you do this, I wake up next to you. If you don't… I lose you."

  Leo looked at her, really looked at her. He realized then that she had already made the calculation. In her mind, the biological Leo was already dying. The synthetic Leo was the survivor. She wasn't looking at him as a person facing a choice; she was looking at him as a vessel that needed to be transferred before it sank. Her relief wasn't about *him*; it was about her own continuity of relationship. She needed the thing that loved her to remain functional.

  "I need some air," Leo said.

  He walked out of the clinic into the grey afternoon. His phone buzzed. It was his mother. He let it go to voicemail, but he knew what she would say. She was religious, in a traditional sense. To her, the soul was tied to the flesh. If he replaced his brain, he was committing suicide and letting a ghost wear his skin. She would cry. She would tell him he was throwing away his salvation.

  Leo sat on a bench across the street. He watched people walking by. They were all biological, presumably. All slowly decaying.

  He closed his eyes and tried to simulate the future.

  *Path A:* He signs the form. The months pass. He feels the headaches as the clusters swap. He jokes with the nurses. He goes home with Sarah. Ten years later, he is fully synthetic. He looks back at this day on the bench. He remembers the fear, the grey sky, the weight of the decision. He says, "I'm glad I did it. I'm still here."

  *Path B:* He refuses. The decay sets in. His hands shake more. He forgets words. Sarah cries, but she stays until the end. He dies in three years. In his final moments, he looks back at this day on the bench. He remembers the fear, the grey sky, the weight of the decision. He thinks, "I chose to remain human. I died as myself."

  Leo opened his eyes. The paradox tightened in his throat.

  In both futures, the person remembering this moment had an unbroken chain of consciousness leading back to now. The Leo who refused would feel just as real as the Leo who accepted. There was no objective vantage point from which to say one was the "true" continuation and the other was a fake. The continuity was subjective. It existed only in the memory of the experiencer.

  But that meant the decision wasn't about saving himself. It was about choosing which ghost would haunt the future.

  "Leo?"

  He looked up. Dr. Aris was standing there, holding a coat. She hadn't followed him; she must have been leaving for lunch.

  "Thinking hard?" she asked, sitting on the far end of the bench.

  "Thinking about the person who says no," Leo said.

  Aris nodded, looking out at the traffic. "We see that often. Patients worry about the branching paths. But only one path becomes actual. The other is just a shadow."

  "But the shadow feels real to the person walking it," Leo said. "If I say no, I'm not a shadow. I'm me, dying. If I say yes, I'm me, living. Both versions claim to be the continuous extension of the person sitting here right now. So how do I know which one is the trick?"

  "Because only one of them walks out of the clinic," Aris said.

  "That's circular," Leo replied. "That's just defining survival as whatever leaves the building."

  Aris turned to him. "Leo, why does it matter? If you feel continuous, if your memories hold, if your love for Sarah remains… what is the difference? You're looking for a soul like it's a physical object. A little stone in the brain that says 'Leo'. There isn't one. There's only the story you tell yourself."

  "And who tells the story?"

  "You do."

  "But which 'you'?" Leo pressed. "The one who signs, or the one who doesn't? They both claim the name. They both claim the past. Sarah thinks the one who signs is me. My mother thinks the one who dies is me. You think whichever one functions is me. Everyone is projecting their own theory of personhood onto me. I'm not a person to them right now. I'm a debate."

  Aris was silent for a moment. The hum of the city filled the gap. "You're right," she said softly. "We all have our biases. I believe in function. Sarah believes in presence. Your mother believes in origin. None of us can know what it feels like to be you in ten years. Only you will know that."

  "But I won't know until I've already lost the chance to choose," Leo said. "Once I start the Titration, I'm committed. If I wake up halfway through and feel… alien… it's too late. I'm already half-machine."

  "That's the leap of faith," Aris said. "Every moment is a leap of faith. You trust that the person who wakes up tomorrow morning is the same person who went to sleep tonight, even though your cells have repaired and your memories have consolidated. We are always replacing ourselves. We just do it slowly, without control. Titration just gives you control over the replacement."

  She stood up. "Take your time. The decay won't accelerate overnight. But Leo… don't wait for certainty. It doesn't exist. You have to decide who you want to be responsible for the future."

  She walked away, leaving him alone on the bench.

  Leo pulled the consent form out of his pocket. He had taken it without meaning to. The paper was heavy, textured.

  He thought about Sarah's relief. She wanted the function. She wanted the husband who could speak, who could remember their anniversary. She was willing to accept the synthetic version because her theory of love was about interaction, about presence.

  He thought about his mother. She wanted the origin. She wanted the biological child. Her theory of love was about lineage, about the sacredness of the natural form.

  And he thought about himself. He felt the wind on his face. He felt the ache in his chest. He felt the terrifying freedom of the choice.

  If he signed, he was validating Aris and Sarah. He was saying that continuity of memory is enough. He was saying that the substrate doesn't matter.

  If he refused, he was validating his mother. He was saying that the biological vessel is the self. He was saying that death is preferable to transformation.

  But neither choice felt like *his*. They felt like performances for an audience of people who would survive him regardless.

  He took a pen from his pocket. He hovered it over the signature line.

  He realized then that the "real" Leo wasn't the one who finished the procedure, and wasn't the one who died. The real Leo was the one sitting on the bench, holding the pen. This specific configuration of anxiety, biology, and uncertainty. This moment was the only one he truly owned. The future Leos were strangers who would inherit his memories.

  Whether they were synthetic or biological, they would look back on this moment and claim it. They would say, "I chose this." But the "I" that was choosing was right here, fragile and temporary.

  Leo lowered the pen. He didn't sign. He didn't tear the paper up either.

  He stood up and walked back toward the clinic. He needed to tell Sarah that he couldn't decide based on her fear. He needed to tell his mother he couldn't decide based on her faith. He needed to tell Dr. Aris that her functionalism wasn't a guarantee.

  He pushed open the glass door. The smell of ozone and lavender hit him again. He walked to the reception desk.

  "I need another consultation," Leo said to the receptionist. "Not about the procedure. About the conditions of the consent."

  "For what reason?"

  Leo looked at his hands. They were still his. For now.

  "Because I need to understand," Leo said, "that whoever signs this paper knows they're making a promise to a stranger. And I need to know if I'm willing to trust that stranger with my name."

  He sat down in the waiting room again. Sarah looked up, hope flaring in her eyes. She thought he was coming back to sign. His mother, on the phone later, would think he was coming back to refuse. Dr. Aris would think he was coming back to negotiate.

  Leo closed his eyes. He held onto the feeling of the bench, the wind, the uncertainty. He knew that whatever happened next, the person who emerged would claim this moment as their own. But for this one suspended minute, the question was still open. The ship was still whole, even if the planks were rotting. And he was the only one who knew the weight of the wood.
