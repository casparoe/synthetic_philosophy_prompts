answer: |-
  You should adopt a pluralist framework distinguishing between epistemic probability (objective degree of evidence) and aleatory probability (physical chance), as no single interpretation covers all your cases without forcing counterintuitive results.

  This position is philosophically respectable and defended by thinkers like Ian Hacking and Alan Hájek, who argue that "probability" is a cluster concept serving different functions in different contexts. Your intuitions are correctly identifying two distinct jobs probability does: describing stochastic processes in the world (aleatory) and quantifying rational belief given evidence (epistemic).

  To reconcile your verdicts, you must categorize your cases into these two buckets. **Aleatory probability** covers your coin flips, quantum mechanics, and the physical setup of the lottery; here, propensity or frequentism works because there is a physical mechanism generating randomness. **Epistemic probability** covers your keys, the weather, the Higgs boson, Caesar, and mathematical conjectures; here, the events are deterministic (either true or false), and probability measures the strength of the evidence supporting the claim.

  Your inconsistency regarding the Higgs boson versus Caesar crossing the Rubicon is the main tension to resolve. Both are one-off past facts, so if you assign probability to one, you must assign it to the other. The "5 sigma" claim was technically a frequentist statement about the noise in the data, but your interpretation of it as confidence in the particle's existence is an epistemic judgment. You should abandon the verdict that assigning probability to Caesar is a category mistake; it is perfectly coherent to say "given the documentary evidence, the probability Caesar crossed the Rubicon is 0.999," just as you do for the Higgs. The difference is merely that physics uses statistical models to generate evidence, while history uses narrative testimony, but the logical structure of the confirmation is the same.

  Regarding your question about mathematical conjectures, this is the purest case of epistemic (specifically logical) probability. Since mathematical truths are necessary, the objective chance of a conjecture being true is either 0 or 1. However, the *probability* we assign before proof represents our rational credence based on partial results, heuristic arguments, and coherence with existing axioms.

  Ultimately, you do not need to abandon frequentism or subjectivism entirely, but you must limit their scope. Frequentism is a tool for estimating aleatory chance, not the definition of probability itself. Subjectivism captures the personal nature of credence, but Objective Bayesianism better fits your intuition about the weather and Higgs, where evidence compels specific degrees of belief regardless of feelings. Pluralism is not a cop-out; it is the only way to honor the distinct roles probability plays in physics, statistics, and everyday reasoning without distorting the concepts.
