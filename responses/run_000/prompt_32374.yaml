      *   *Critique:* Is Sam's objection too strong? I need to make sure Maya has a real out. The "Acquaintance" argument is strong here (Russellian). Let's have her lean on the idea that the judgment *is* the physical counterpart of the awareness, not caused *by* the awareness in a transitive sense, but identical to the awareness in the physical domain.
