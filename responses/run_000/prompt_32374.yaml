      *   *Round 2 (The Counterfactual/Sensitivity):* Sam pushes on counterfactuals. If Q didn't exist, N would still cause B. So B isn't about Q. Maya distinguishes *etiology* from *justification*. She might appeal to a form of direct acquaintance.
      *   *Round 3 (Causal Theory of Knowledge):* Maya challenges Sam's assumption that knowledge *requires* causation. Sam argues that without causation, reference is magical.
