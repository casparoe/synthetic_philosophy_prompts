      *   **Epiphenomenalism:** Qualia exist (non-physical or distinctively physical properties) but have no causal powers. Physical brain states cause behavior and other brain states. Qualia are "shadows" cast by neural activity.
      *   **The Paradox of Phenomenal Judgment (Frank Jackson, David Chalmers):** If qualia don't cause anything, they don't cause my belief that I have them. So why do I talk about them? Why do I believe epiphenomenalism is true? It seems like a miraculous coincidence that my physical brain states align with the existence of these inert qualia.
      *   **Maya's Defense Strategies:**
          1.  *Common Cause:* The physical state causes both the qualia and the judgment. (Standard epiphenomenalist move).
          2.  *Acquaintance/Non-Causal Knowledge:* Knowledge doesn't always require causation (e.g., mathematical truths, or direct acquaintance).
          3.  *Covariation/Reliability:* If the physical state reliably produces the qualia and the judgment, there's a counterfactual dependence, even if no direct causal link from qualia to judgment exists.
          4.  *Self-Undermining Charge:* Sam assumes a causal theory of knowledge which is question-begging against a view that posits non-causal relations.
      *   **Sam's Counter-Strategies:**
          1.  *The Coincidence:* If the qualia weren't there, would I still say I have them? Yes, because the physical cause is sufficient. So the belief isn't sensitive to the truth of the qualia's existence.
          2.  *Evolution:* If qualia don't help survival, why did they evolve? (Though this is a slightly different argument, it relates to the "why are we talking about this" point).
