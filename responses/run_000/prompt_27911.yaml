answer: |-
  ### The move described

  The argumentative pattern you have identified involves a specific sequence of semantic and logical maneuvers designed to negate the existence of a phenomenon by rigging the definitional criteria against it. Abstractly, the move proceeds as follows: First, an interlocutor identifies a contested concept or phenomenon (let us call it $X$). Second, they stipulate a definition for $X$ that includes necessary conditions which are logically contradictory, empirically impossible, or metaphysically extravagant (e.g., $X$ requires condition $A$ and condition $\neg A$ simultaneously). Third, they demonstrate that no entity can satisfy these impossible conditions. Finally, they conclude that $X$ does not exist, while simultaneously dismissing any actual occurrences that resemble $X$ but fail to meet the impossible criteria as merely "something else" (e.g., wishful thinking, illusion, or inconsistency). The core mechanism here is not merely proving a claim false, but constructing a definitional gatekeeper that ensures nothing can pass through it, thereby converting a substantive debate about how the world works into a verbal victory about how words are defined.

  ### Nearest existing concepts

  This pattern bears a strong family resemblance to the **Straw Man fallacy**, but with a crucial distinction regarding the target of the misrepresentation. In a standard Straw Man, an arguer distorts a specific opponent's argument to make it easier to attack. In the pattern you describe, the arguer is not necessarily distorting a specific person's claim, but rather distorting the *concept itself* by selecting its most vulnerable, extreme, or paradoxical formulation. It is a "Conceptual Straw Man." Whereas a traditional Straw Man misrepresents what an opponent *said*, this move misrepresents what a phenomenon *is* by insisting that the only valid version of the phenomenon is the one that is logically incoherent. However, calling it a Straw Man is imperfect because, as you noted, there are often philosophers or laypeople who do hold the strong view. The fallacy lies not in inventing a view nobody holds, but in insisting that the strong view is the *only* view worth discussing, thereby ignoring functional or revised definitions that capture the same underlying reality.

  The pattern also invertedly mirrors the **No True Scotsman (NTS)** fallacy. In a classic NTS, a universal claim is made ("No Scotsman puts sugar on porridge"), a counterexample is produced ("Angus is a Scotsman and puts sugar on porridge"), and the definition is modified ad hoc to exclude the counterexample ("No *true* Scotsman puts sugar on porridge"). The move you describe is a "Pre-emptive No True Scotsman." Instead of waiting for a counterexample and then moving the goalposts to protect a claim, the arguer sets the goalposts impossibly high *beforehand* to ensure no counterexamples can ever emerge. They define "True Self-Deception" in such a way that no human psychology could ever instantiate it, thereby protecting the claim "Self-Deception does not exist" from empirical refutation. While NTS is a defensive maneuver to save a generalization, this move is an offensive maneuver to eliminate a category entirely through definitional stipulation.

  Finally, this pattern is deeply related to **Begging the Question (Petitio Principii)** and the **Motte-and-Bailey** fallacy, yet distinct from both. It begs the question because the conclusion ("$X$ does not exist") is embedded in the premise ("$X$ is defined as an impossible thing"). However, standard begging the question usually involves circular reasoning within an argument, whereas this involves circularity within a *definition*. Regarding Motte-and-Bailey, this move is arguably the inverse. In a Motte-and-Bailey, an arguer advocates for a controversial position (the Bailey) but retreats to a defensible one (the Motte) when challenged. In your friend's case, he is holding the ground on the impossible Bailey (the paradoxical definition) and refusing to acknowledge the Motte (the psychological mechanism of compartmentalization) as belonging to the same category. He isn't retreating to safety; he is fortifying the impossible position and declaring the safe position irrelevant. Thus, while it shares DNA with these fallacies, it operates through a unique mechanism of definitional exclusion.

  ### Does it have a name?

  Despite the prevalence of this maneuver in philosophical debates—particularly in philosophy of mind, ethics, and metaphysics—there is no single, canonical Latin term or standardized label in logic textbooks that captures it exclusively. It is often discussed under the broader umbrella of **Eliminativism**, which is the philosophical stance that certain common-sense concepts (like "belief" or "free will") do not correspond to real entities and should be discarded from our scientific ontology. Philosophers like Paul Churchland employ this strategy regarding folk psychology. However, "eliminativism" is the *position* reached, not the name of the *argumentative tactic* used to get there. Some logicians refer to similar moves as **"Verbal Disputes"** (a term popularized by Rudolf Carnap), where parties disagree on words rather than facts, but this is too broad. Others might call it a **"Definitional Stop,"** a phrase used by John Watkins to describe halting inquiry by defining a problem away, but this lacks widespread recognition. Consequently, while the strategy is well-known in analytic philosophy, it lacks a specific, universally accepted fallacy name like "Ad Hominem" or "False Dilemma."

  ### Proposed name and definition

  Given the lack of an established term, I propose calling this maneuver **"The Definitional Elimination Maneuver."** This name captures the two essential components: the reliance on a stipulative definition ("Definitional") and the goal of removing the phenomenon from existence ("Elimination"). The maneuver occurs when an arguer stipulates necessary conditions for a concept $X$ that are mutually exclusive or empirically unattainable, proves that nothing can satisfy these conditions, and concludes that $X$ is non-existent, while refusing to accept revised definitions of $X$ that describe functional equivalents. The boundary cases are important to distinguish. If a concept is genuinely incoherent (e.g., "a square circle"), defining it strictly to show impossibility is valid analysis. The maneuver becomes fallacious when the concept refers to a observable, functional phenomenon (like self-deception or agency) and the strict definition ignores the mechanism in favor of a logical caricature. For example, defining "life" as "possessing an immortal soul" and then concluding "life does not exist" because souls are unproven is Definitional Elimination. Defining "life" as "metabolic process" and finding it exists is not. The fallacy lies in selecting a definition that severs the concept from its utility and observable correlates.

  A related sub-category could be termed **"The Paradoxical Stipulation."** This occurs specifically when the definition requires a logical contradiction (like knowing and not knowing simultaneously) rather than just an empirical impossibility. This distinguishes it from mere "Perfectionist Fallacies," where the bar is set unrealistically high but not logically impossible. In the Definitional Elimination Maneuver, the arguer often claims they are being "precise" or "rigorous," arguing that loose definitions muddy the waters. However, this precision is weaponized. They treat the concept as a static logical object rather than a dynamic process. In the case of self-deception, the maneuver treats the mind as a singular, unified agent that must hold contradictory beliefs at instant $T$. By ignoring the temporal dimension (believing $P$ at $T1$, avoiding evidence at $T2$) or the structural dimension (Module $A$ knows $P$, Module $B$ believes $\neg P$), the arguer eliminates the phenomenon by denying the complexity of the substrate. The definition becomes a tool of exclusion rather than clarification, prioritizing logical purity over explanatory power.

  ### Is it ever legitimate?

  There are contexts where insisting on a demanding definition is not only legitimate but necessary, distinguishing the fallacious use from rigorous conceptual analysis. The move is defensible when the goal is **logical coherence** rather than **phenomenological description**. If a concept is introduced to solve a specific theoretical problem, and the strong definition is required for that solution, then showing the concept is impossible is a valid critique. For instance, in theology, if "omnipotence" is defined as "the ability to do literally anything including logical contradictions," demonstrating the incoherence of that definition is useful work. It forces a refinement of the theory. Similarly, in physics, if a proposed particle requires properties that violate conservation laws, defining it strictly to show it cannot exist is scientifically responsible. The move becomes illegitimate when it ignores **functional equivalence**. If the "weak" version of the concept (e.g., compatibilist free will or subconscious self-deception) performs all the explanatory work of the "strong" version (predicting behavior, explaining guilt, guiding moral responsibility), then eliminating the term because it lacks metaphysical magic is verbal pedantry. The criterion for legitimacy is utility: does the strict definition help us understand the world, or does it merely allow the arguer to win a debate by declaring the territory empty? If the latter, it is Definitional Elimination; if the former, it is conceptual engineering.
