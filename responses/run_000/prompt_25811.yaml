answer: |-
  This is one of the sharpest and most common objections to moral particularism. You have hit on the "Epistemic Worry": *If we don't use principles to derive judgments, how do we know the judgment is correct?*

  To understand what you are missing, we have to look at how particularists (most notably Jonathan Dancy) redefine the architecture of moral reasoning. Then we can look at the specific conditions that would render the view untenable.

  ### 1. What do particularists appeal to if not principles?

  You are worried that without principles, we are left with either "gut feelings" (unreliable intuitionism) or "hidden principles" (crypto-generalism). Particularists argue there is a third option: **Moral Perception and Holism.**

  #### The Holism of Reasons
  The engine of particularism is the "holism of reasons." Generalists say: "If feature X is a moral reason in one case (e.g., 'it causes pain'), it must be a reason in the same direction in every case."
  Particularists say: "No. 'Causing pain' is usually a reason against an action. But if I am a dentist drilling a cavity, causing pain is part of a reason *for* the action (to save the tooth). If I am a sadist, causing pain is the reason the act is evil."

  Therefore, a feature's status as a reason is **context-dependent**. It doesn't have a fixed moral valence.

  #### Moral Perception (Not "Gut Feeling")
  So, how do we judge? Particularists appeal to **moral sensitivity** or **perception**.
  *   **The Charge:** You call this "going with your gut."
  *   **The Particularist Defense:** They argue this is a trained skill, similar to a master chess player looking at a board. The grandmaster doesn't recite rules ("Knights move in an L-shape") to decide their next move. They *see* the weakness in the opponent's defense.
  *   **Why it's not just intuitionism:** Classical intuitionism (like Moore or Ross) often posits a mysterious faculty that "sees" moral truths. Particularists frame it more like **Aristotelian *phronesis* (practical wisdom)**. It is a cognitive skill developed through experience, mentorship, and exposure to cases. You learn to *see* the relevant features, not to *calculate* based on rules.

  #### Addressing the "Secret Principles" Charge
  You asked if they are secretly relying on principles but refusing to admit it.
  *   **Particularist Reply:** They distinguish between **principles** and **generalizations**.
      *   **Principles:** Claim to be constitutive of morality (e.g., "Lying is *always* pro tanto wrong"). Particularists reject these.
      *   **Generalizations:** Claims about what usually happens (e.g., "Lying is usually wrong"). Particularists accept these as useful "rules of thumb" for teaching or heuristics, but they deny these generalizations have *normative force*.
  *   **The "Ceteris Paribus" Trap:** Particularists argue that if you try to turn their generalizations into strict principles, you have to add endless "unless..." clauses (*ceteris paribus*). Eventually, the principle becomes so complex it is useless. They argue it is better to admit there is no principle than to write a principle that is as complex as the universe itself.

  ### 2. What would make Particularism fail? (The Viability Test)

  You asked what argument or consideration would make one think particularism "just doesn't work." Since I am an AI, I don't have beliefs, but I can outline the **philosophical conditions under which particularism collapses.**

  If the following three objections cannot be answered, particularism is generally considered untenable by its critics:

  #### A. The Moral Education Argument
  **The Objection:** How do we teach morality to children or novices without principles? We tell kids "Don't lie." We don't say, "Assess the holistic context of every utterance to determine if falsity is virtuous."
  **The Falsification Condition:** If particularists cannot explain how moral competence is transmitted from one generation to the next without relying on principles *during the learning phase*, the theory is practically self-defeating.
  *   *Particularist Counter:* We teach via examples and stories (case-based reasoning), not rules.
  *   *Why this could fail:* If it turns out that learning via examples *implicitly* requires the student to induce principles to make sense of the examples, then principles are necessary after all.

  #### B. The Disagreement Argument
  **The Objection:** If I say "Abortion is wrong" and you say "Abortion is permissible," how do we resolve this? Generalists appeal to shared principles ("Does it violate the right to life?"). Particularists say, "You just aren't seeing the relevant features correctly."
  **The Falsification Condition:** If particularism reduces moral disagreement to "My sensitivity vs. Your sensitivity" with no arbiter, it risks collapsing into subjectivism or relativism. If particularism cannot explain how moral **argumentation** works (how I can persuade you using reasons), it fails as a normative theory.
  *   *Why this is critical:* Morality is social. If particularism makes moral discourse impossible because we can't appeal to shared standards, it is functionally useless.

  #### C. The Action-Guiding Argument
  **The Objection:** Principles tell you what to do *before* you act. "Do not steal." Particularism seems to require you to assess the whole situation *in the moment*.
  **The Falsification Condition:** If particularism leaves agents "clueless" in novel or high-pressure situations because they lack a heuristic to fall back on, it fails as a guide to life.
  *   *The "Cluelessness" Objection:* If a particularist faces a complex dilemma and their "moral perception" is clouded by stress or bias, they have no backup system (principles) to check themselves. If particularism cannot account for **moral error** (how do I know my perception is wrong if I don't check it against a principle?), it lacks a theory of correction.

  ### Summary: Where the debate stands

  You aren't missing a hidden trick; you are identifying the exact tension that keeps meta-ethicists up at night.

  *   **If you think** morality is fundamentally like law or mathematics (codifiable, consistent, universal), particularism will always look like "crypto-generalism" or "irrational intuition."
  *   **If you think** morality is fundamentally like aesthetics or friendship (context-heavy, nuanced, reliant on sensitivity), particularism looks like the only honest description of how we actually live.

  **To answer your final question directly:**
  The consideration that would make particularism "not work" is if it can be proven that **moral reasons are inherently general.** If a philosopher can demonstrate that for a feature to count as a *reason* at all, it must logically imply a principle (e.g., "If X is a reason here, it must be a reason there, unless there is a defeater, which is itself a principled exception"), then particularism is logically incoherent.

  Currently, the debate rests on whether you believe the "holism of reasons" is a bug in morality or a feature. Particularists bet it's a feature; Generalists bet it's a bug that principles can fix.
