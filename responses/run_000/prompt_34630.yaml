          2.  **Guilt vs. Regret:** Elena is right that *guilt* (blameworthiness) might be misplaced, but *agent-regret* (sorrow for one's causal role in harm) is appropriate.
          3.  **Political vs. Personal:** Mark is right that politics demands things personal morality forbids.
      *   **Conclusion:** Mark captures the *experience* of leadership better; Elena captures the *logic* of justification better. The "Dirty Hands" thesis survives if we accept moral pluralism.

