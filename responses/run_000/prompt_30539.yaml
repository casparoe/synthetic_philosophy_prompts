answer: |-
  ### The Readings

  1.  **Strict Frequentism**
      Probability is defined exclusively as the limit of relative frequency within an infinite sequence of repeatable trials. Since a single event cannot constitute a sequence, attributing a probability to it is a category error akin to asking for the average height of one person.

  2.  **Logical Positivism**
      A statement is cognitively meaningful only if it can be empirically verified or falsified through observation. Because a single-case probability claim cannot be conclusively proven true or false by one outcome, it lacks empirical content.

  3.  **Ontological Determinism**
      The physical state of the world at any moment fully determines all future events, meaning the outcome is already fixed as either certain or impossible. Probability in this context merely quantifies human ignorance rather than describing a feature of the event itself.

  4.  **The Reference Class Problem**
      Any singular event belongs to infinitely many possible classes (e.g., 'days in April', 'days with low pressure'), each yielding a different frequency. Without a principled way to select the unique correct class, any assigned probability value is arbitrary.

  5.  **Propensity Restriction**
      Physical chances are propensities inherent to repeatable experimental setups rather than to unique occurrences themselves. While a coin toss mechanism has a propensity, this specific toss on this specific day does not possess a chance independent of the setup.

  6.  **Semantic Misplacement**
      Probability is strictly a logical relation between evidence and a proposition, not a property of the event in the world. Saying the 'event has a probability' is grammatically misleading, though often tolerated as shorthand for the proposition that the event occurs.

  7.  **Pragmatic Redundancy**
      For a one-off decision, the precise numerical probability adds no value beyond an ordinal ranking of likelihood. Consequently, calculating a specific percentage is functionally inert and adds no utility to the decision-making process.

  ### Verdicts

  1.  **Strict Frequentism:** Defensible thesis.
  2.  **Logical Positivism:** False.
  3.  **Ontological Determinism:** Defensible thesis.
  4.  **The Reference Class Problem:** Defensible thesis.
  5.  **Propensity Restriction:** Defensible thesis.
  6.  **Semantic Misplacement:** Platitude.
  7.  **Pragmatic Redundancy:** False.

  ### Which readings do the dismissing

  Your lecturer is almost certainly invoking **Strict Frequentism** (Reading 1), potentially bolstered by the **Reference Class Problem** (Reading 4). Within a hardline frequentist framework, the slogan is coherent because probability is defined by long-run behaviour, rendering single-case assignments technically undefined. However, this dismissal is question-begging because it ignores Bayesian and epistemic interpretations, which are standard in meteorology and medicine. In those fields, a '70% chance' expresses a calibrated degree of belief or a propensity based on current evidence, which remains meaningful even for unique events. Therefore, the slogan only holds if one arbitrarily rules out subjective or evidential probabilities from the outset.
