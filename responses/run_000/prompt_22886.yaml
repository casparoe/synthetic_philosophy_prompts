prompt: |-
  I just got back from a long argument with a friend over Galen Strawson's Basic Argument against ultimate moral responsibility — the argument that no one can be ultimately responsible for what they do, because to be responsible for what one does one would have to be responsible for who one is, and one's character is shaped by factors one did not choose. We did not resolve it, but I have decided that the eulogy I am giving for my mother, a high school English teacher for thirty-five years, should be consistent with it. The audience will be family, colleagues, and former students — no philosophers, so no names, no explicit references to the argument, and no "as a philosopher I believe" framing. My friend's standing objection was that a eulogy written this way would end up saying her goodness was just luck, and I think he is right that that is the failure mode to avoid. So the task: praise her as fully as a eulogy can — her patience with difficult students, her habit of staying late, the way she read to the class — without ever resting on the premise that she chose her character, that she earned her virtues, or that she could have been otherwise; the praise should be grounded in what her character did for us and in our gratitude, not in desert. About four minutes long, warm, and it has to actually comfort a room of people who have lost her, rather than sound like a consolation that her goodness was an accident.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Topic:** A eulogy for the speaker's mother (a high school English teacher for 35 years).
      *   **Philosophical Constraint:** Must be consistent with Galen Strawson's Basic Argument (no ultimate moral responsibility). This means avoiding language that suggests she *chose* her character, *earned* her virtues, or *could have been otherwise* in a libertarian free will sense.
      *   **Specific Constraint (Friend's Objection):** Must *not* sound like her goodness was just "luck" or an "accident." It needs to feel substantial, warm, and praiseworthy, not deterministic in a cold way.
      *   **Audience:** Family, colleagues, former students (no philosophers). No jargon, no explicit references to the argument.
      *   **Tone:** Warm, comforting, praising, grateful.
      *   **Length:** About 4 minutes spoken (approx. 500-600 words).
      *   **Key Content:** Patience with difficult students, staying late, reading to the class.
      *   **Goal:** Ground praise in the *impact* of her character and *gratitude*, not in *desert* or *origination*.

  2.  **Deconstruct the Philosophical Constraint (Strawson's Basic Argument):**
      *   *The Argument:* To be truly responsible for an action, you must be responsible for the character/motives that led to it. But you don't choose your initial character (genetics/early environment). To choose your character, you'd need a prior character to make that choice, leading to infinite regress. Therefore, ultimate responsibility is impossible.
      *   *The Eulogy Challenge:* How do we praise someone without saying "She worked hard to become good" or "She chose to be kind"?
      *   *The Solution:* Focus on *manifestation* and *reception*. Instead of "She built this," say "This was who she was, and we were lucky to be in its light." Instead of "She chose to stay late," say "She couldn't help but stay late because caring was her nature."
      *   *Avoiding the "Luck" Trap:* The friend worries this makes her goodness seem accidental. To counter this, emphasize the *reliability* and *reality* of her goodness. It wasn't a roll of the dice; it was the fabric of her being. The gratitude isn't "Wow, random chance helped us," it's "We were held by something real and steady." The value lies in the *experience* of her love, not the *metaphysical origin* of it.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish her role (teacher, mother). Set a tone of presence.
      *   **The Classroom (Core Memories):** Address the specific prompts (staying late, reading, difficult students).
          *   *Constraint Check:* Don't say "She chose to be patient." Say "Patience was simply where she lived."
      *   **The Nature of Her Goodness:** Address the "luck" concern. Her goodness wasn't fragile or accidental; it was a force of nature. It was *her*.
      *   **The Impact/Gratitude:** Shift focus from her responsibility to our reception. We are the beneficiaries. This creates comfort.
      *   **Closing:** A final image of legacy. Not what she *did*, but what *remains* in us.

      *   *Drafting thought:* I need to be careful with verbs. Avoid "decided," "chose," "effort," "struggle to be better." Use "was," "gave," "offered," "radiated."
      *   *Drafting thought:* To avoid the "luck" feeling, I need to emphasize the *inevitability* of her care as a source of stability, not randomness. It's not that she *happened* to be kind; it's that kindness was her gravity.

  4.  **Writing - First Pass (Mental or rough notes):**
      My mom taught English. She stayed late. She helped kids who were hard to teach. She read to us. People say she worked hard to be good. But really, she just *was* good. We are lucky to have known her. Thank you for coming. (Too blunt, too cold).

  5.  **Writing - Second Pass (Refining Tone and Philosophy):**
      We are here for my mother. She taught for 35 years. She had patience. She didn't get angry at bad kids. She stayed late to grade. She read poetry. You might think she tried hard to be this way. But it was just her. Like a tree grows leaves. We are grateful. It's not luck, it's a gift. (Better, but needs more warmth).

  6.  **Writing - Third Pass (Polishing for the Prompt):**
      *   *Focus on the "Givenness" of Character:* Frame her virtues as gifts she *was*, not trophies she *won*.
      *   *Focus on the "Effect" on Others:* The value is in how the students felt.
      *   *Avoiding "Luck":* Use words like "gift," "grace," "nature," "truth." These imply something deep and real, not random.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm saying she was a robot. She felt things. She loved. But the *source* of that love isn't the point; the *presence* of it is.

      *Key phrase to include:* "We are not here to judge the source of the light, but to warm our hands by it." (Maybe too explicit? Let's soften it).
      *Key concept:* Her character was a place we could live.

  7.  **Final Review against Constraints:**
      *   Strawson-compliant? Yes (no claim of ultimate self-creation).
      *   No "luck/accident" vibe? Yes (frames goodness as solid, reliable, defining).
      *   No jargon? Yes.
      *   Specific details included? Yes (late nights, reading, difficult students).
      *   Length? Looks like ~550 words, which is about 4 minutes at a slow, eulogy pace.
      *   Comforting? Yes, focuses on the enduring impact.

  8.  **Final Polish:** Check the rhythm. Ensure sentences flow for speech. (e.g., "There is a temptation to say she worked at it..." addresses the counter-argument without getting technical).

      *(Wait, one nuance)*: The prompt says "without ever resting on the premise that she chose her character." I can acknowledge she worked, but frame the *drive* to work as part of her nature. "The drive to care was not a burden she took up; it was the ground she walked on." That works.

