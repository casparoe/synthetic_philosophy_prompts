answer: |-
  Good morning. Thank you all for being here. For those who knew my mother only as a teacher, and those who knew her only as family, I hope today we can see the whole picture of who she was.

  For thirty-five years, my mother stood at the front of high school English classrooms. If you ask her former students what they remember, they won't talk about grammar drills or syllabi. They talk about the way she read to them. She would close the door, sit on the edge of her desk, and open a book. In that room, the noise of the hallway vanished. She had a voice that made the words feel like they were being spoken for the first time.

  They talk about the afternoons when the bell rang and everyone left but one. A student who was struggling, or angry, or lost. My mother would stay. She would put her coat back on the hook. She would listen. There is a temptation to say she "chose" to be patient, or that she "worked hard" to be kind. But anyone who knew her knows that patience wasn't a tool she picked up; it was the air she breathed. She didn't struggle to care about that student; she simply couldn't not care. That was her nature.

  In a way, that is what makes the loss so heavy, but also what makes the memory so solid. We often praise people as if they are architects who built their own souls from scratch, as if they could have been otherwise. But my mother's goodness wasn't a construction project. It was a fact. Like the color of her eyes or the sound of her laugh. It was given, and it was real.

  To her colleagues: You saw her stay late when she was tired. You saw her advocate for kids who had no one else.
  To her students: You felt seen by her when you felt invisible.
  To our family: You felt held by her when the world was shaking.

  We are not here to analyze how she came to be this way. We are here to acknowledge what her way of being did for us. The value of a lighthouse isn't in how the keeper built it; it's in the beam cutting through the dark for the ships at sea. My mother was that beam.

  I know some might worry that saying this makes her virtues seem like an accident, as if we were just lucky. But luck feels random, and my mother was not random. She was steady. Her character was a place where we could live. When she offered grace, it didn't feel like a gamble; it felt like the truth.

  So, we do not thank her for what she earned. We thank her for what she gave. We thank her for the specific, tangible reality of her presence. The patience that calmed a chaotic classroom, the voice that brought stories to life, the hand that wrote notes of encouragement on essays late at night. These things happened. They changed us. They remain.

  She is gone now, but the effects of who she was are still moving through this room. They are in the way her former students teach their own children to read. They are in the way her colleagues treat a struggling freshman. They are in the way we, her family, try to listen when it would be easier to turn away.

  We cannot explain the mystery of why she was who she was. We can only honor the gift of it. And we can promise that the light she cast didn't end with her. It's in us now.

  Thank you.
