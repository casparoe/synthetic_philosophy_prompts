      *   *Decision:* **The Flicker Paradigm (Change Blindness).** It directly attacks the "richness" of the phenomenal field.
      *   *Wait, re-reading the prompt:* "Pick one concrete example... and say what it must have, and must not have."
      *   *Refined Decision:* **The Phi Phenomenon.** It's cleaner for "illusion of property." Motion exists in experience, not in the stimulus.
      *   *Wait, best fit for Programmers:* **The "Desktop Interface" Analogy** is the *conceptual* hook, but I need a *perceptual* demo. Let's use **Phi** but frame it as "Rendered Output vs. Buffer."
      *   *Actually, let's look at the "Homunculus" objection.* This is the biggest trap. The example must not imply a viewer inside.
