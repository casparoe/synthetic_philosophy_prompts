      *   *Hard Problem:* Place it *after* the illusionist move. The Hard Problem arises *because* we take the illusion literally. If we see it as an illusion, the Hard Problem dissolves (or becomes the "Hard Problem of Illusion").
      *   *Misconceptions:*
          *   "Denies existence": Head off early. It denies the *properties* we attribute, not the *state*.
