      *Decision:* **Before.** You need to establish *why* we are here. The Hard Problem is the bug report. Illusionism is the fix. But don't let it loom too large. Frame it as "The Intuition that creates the Hard Problem."
      *Correction:* The prompt says "they'll arrive thinking consciousness is the one thing that obviously can't be an illusion." If I start with the Hard Problem, I reinforce that intuition. I should undermine the intuition *first* using the example, *then* show how that dissolves the Hard Problem. So: Intuition -> Example -> Illusionist Move -> Hard Problem (as dissolved).

      *Wait, let's look at the "Misconceptions" constraint.* "Map the misconceptions... and where exactly to head each one off." I need to integrate these into the timeline, not just list them at the end.

      *Revised Timeline:*
      1.  **Intuition & Distinction (0-20):** State intuition. Introduce Access/Phenomenal.
      2.  **The Demo (20-40):** Phi Phenomenon.
      3.  **The Move (40-60):** Explain Illusionism using the Demo. *Head off "Denies Existence" here.*
      4.  **The Hard Problem (60-75):** Show how the move dissolves it. *Head off "Behaviorism" here.*
      5.  **Objections (75-85):** Homunculus & Falsifiability.
      6.  **Diagnosis (85-90):** The Question.

      *Wait, the Example Requirements:* "Say what it must have, and must not have, for the illusionist conclusion to be reachable from it."
      *   Must Have: A clear case where the *phenomenal property* (motion) is demonstrably absent in the causal chain but present in report.
      *   Must Not Have: Any suggestion that the brain "perceives" the illusion internally (avoids homunculus).

      *Refusing to Cover:* Don't cover *how* the brain does it (neuroscience specifics) or *why* it evolved (evolutionary psych) beyond a sentence. Don't cover rival theories (Panpsychism, IIT) in detail.

      *Diagnostic Question:* Needs to separate "I get it" from "I memorized it."
      *   "If I say 'the pain is illusory,' what do I mean?" -> No, that's confusing.
      *   "What is the 'user interface' of?" -> Good.
      *   Let's go with: "When an illusionist says 'phenomenal properties are illusory,' are they saying the experience doesn't occur, or that the experience misrepresents its own nature?"

      *Let's polish the "Hard Problem" placement.*
      If I put Hard Problem *before* the illusionist move, it sets the stakes. "Here is the bug." Then "Here is the patch."
      If I put it *after*, it shows the payoff. "We made this move. Look, the bug is gone."
      For programmers, showing the payoff is often more convincing. But they need to know *why* we are making the move.
      *Compromise:* Introduce the Hard Problem as the *consequence* of the intuition we started with. Then show how the Illusionist move removes the consequence.
      *Order:* Intuition -> Hard Problem (as the consequence of intuition) -> Distinction -> Demo -> Illusionist Move -> Dissolution.
      *Actually, the prompt asks me to pick.* I will pick **After**. Why? Because if you present the Hard Problem first to skeptics, they dig in. "Yes, it is hard! That's why it's real!" If you first show them their introspection is buggy (via Phi), *then* the Hard Problem looks like a bug in their reasoning, not a feature of reality.

      *Wait, one more check on Misconceptions:*
