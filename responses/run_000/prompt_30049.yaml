      *   *Behaviorism:* Emphasize internal complexity.
      *   *Homunculus:* This is the big one. The illusion is a *process*, not a *viewing*.
      *   *Unfalsifiable:* It makes predictions about introspective limits.

  6.  **Refining the Diagnostic Question:**
      *   Bad: "Is consciousness an illusion?" (Yes/No)
      *   Good: "What exactly is being illusory?"
      *   Better: "If illusionism is true, what is the error in the statement 'I am having a red experience right now'?"
      *   Best: "Does the illusionist say the *experience* doesn't happen, or that the *properties* of the experience are not what they seem?"

  7.  **Finalizing the Flow:**
      *   0-10: The Hook (Validate the intuition).
      *   10-25: The Distinction (Access vs. Phenomenal).
      *   25-45: The Demo (Phi) & Analysis.
      *   45-65: The Illusionist Move (Reinterpreting the Demo).
      *   65-80: The Hard Problem (Dissolving it).
      *   80-90: Misconceptions & Diagnostic.

