prompt: |-
  I run a reading group for sharp non-philosophers (mostly programmers) and next month I'm doing illusionism about phenomenal consciousness. They'll arrive thinking consciousness is the one thing that obviously can't be an illusion, and that's exactly the intuition the session has to loose. Plan how I should teach it in ninety minutes, but don't explain illusionism to me: give me the order of ideas and what depends on what. I know I need the phenomenal/access consciousness distinction in place early, but I'm unsure whether the hard problem should come before or after the illusionist move, and whether to start by stating the target intuition or by undermining it. Pick one concrete example or demonstration to carry the whole session (the phi phenomenon, change blindness, or something better if you've got it) and say what it must have, and must not have, for the illusionist conclusion to be reachable from it. Then map the misconceptions I should expect and where exactly to head each one off: that illusionism denies consciousness exists at all, that it's just behaviorism or a verbal trick, that an illusion requires a little homunculus being fooled, and that the view is unfalsifiable. End with one question I can ask to tell whether someone has actually got it rather than learned to repeat it, and tell me what I should openly refuse to cover at this level.
reasoning: |-
