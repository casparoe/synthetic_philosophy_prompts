      *   *Starting Point:* Start by *stating* the target intuition strongly. If you undermine it too early, they get defensive. Validate the intuition, then show why it might be a user-error in introspection.
      *   *Hard Problem Placement:* The Hard Problem is the *motivation* for illusionism, not the premise. If you present the Hard Problem as unsolvable first, they might give up. If you present it as a *confusion* generated by the illusion, it works better. So: Intuition -> Distinction -> The Example -> The Illusionist Move -> Dissolving the Hard Problem.
      *   *The Example:* Phi Phenomenon is good for motion, Change Blindness for attention. But for *phenomenal* illusion, **The Cutaneous Rabbit** or **Introspective Opacity** is better. However, the prompt suggests Phi or Change Blindness. Let's look for something that bridges the gap between "I see X" and "X isn't actually there in the way I think."
      *   *Selection:* **Change Blindness** is too about attention. **Phi Phenomenon** is about motion construction. A better fit for programmers is **The "User Interface" Analogy combined with a specific perceptual error.** But the prompt asks for a concrete demonstration like Phi/Change Blindness. Let's go with **The Phi Phenomenon** but framed specifically as "post-dictive construction." Why? Because it shows the brain *editing the log* after the fact. Programmers understand logs and race conditions.
