      *   *Start:* State the intuition. "Consciousness is the one thing that can't be an illusion." Acknowledge its force.
      *   *Distinction:* Access vs. Phenomenal. Crucial. Programmers get "Data Access" vs. "User Display."
      *   *The Example:* Phi Phenomenon.
