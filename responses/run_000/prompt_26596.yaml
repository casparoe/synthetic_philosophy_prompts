  1.  **Analyze the User's Problem:**
      *   **Context:** The user is on the exec board of a student tutoring program.
      *   **Task:** Comparing two tutoring formats (Online vs. In-Person) based on pass rates.
      *   **Observation:**
          *   Overall: In-Person > Online (In-Person has a higher pass rate).
          *   Subgroup (Intro Courses): Online > In-Person.
          *   Subgroup (Upper-Level Courses): Online > In-Person.
      *   **Conflict:** The trend reverses when data is aggregated vs. disaggregated.
      *   **User's State:** Confused, doubting their data (friend says it's an Excel error), taking a philosophy of statistics course (relevant context), needs to know *what* this is and *what to do*.

  2.  **Identify the Statistical Phenomenon:**
      *   This is a classic textbook example of **Simpson's Paradox**.
      *   *Definition:* A trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Cause:* A lurking/confounding variable (in this case, course difficulty/level) is unevenly distributed between the two groups (tutoring formats).

  3.  **Explain the "Why" (The Mechanism):**
      *   Why did this happen? It's not an Excel error.
      *   It usually happens because one group (say, In-Person) took mostly "easy" classes (Intro), while the other group (Online) took mostly "hard" classes (Upper-Level).
      *   *Scenario:*
          *   Intro courses have high pass rates generally.
          *   Upper-level courses have low pass rates generally.
          *   If most In-Person students were in Intro courses, the overall In-Person rate looks high.
          *   If most Online students were in Upper-Level courses, the overall Online rate looks low.
          *   But within *each* level, Online tutoring might actually be more effective.

  4.  **Connect to the User's Course (Philosophy of Statistics):**
      *   The user mentioned taking a "philosophy of statistics" course. This is a great hook.
      *   Philosophy of stats deals with interpretation, causality, and the meaning of probability, not just calculation.
      *   Key concepts: Confounding variables, causal inference, aggregation bias, ecological fallacy (related).
      *   This validates their feeling that there's a deeper conceptual issue, not just a math error.

  5.  **Address the Decision (What should they do?):**
