  6.  **Final Polish:** Organize with clear headings. Ensure the conclusion synthesizes the vulnerabilities without destroying the user's position (since they asked for mapping, not destruction). (Self-correction: The prompt asks for vulnerabilities mapped *honestly*. I should not shy away from showing where the position might collapse.)

