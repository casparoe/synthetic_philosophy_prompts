answer: |-
  **Bottom Line:** This case establishes that decomposing relational value judgments into independent optimization subtasks systematically erodes global alignment even when local competence is perfect.

  **Scenario:** A manager must allocate a fixed $100k bonus pool to maximize team cohesion. She amplifies the task into ten independent subtasks: "Calculate the merit score for Employee X based on individual output." She verifies each score against performance data, confirming accuracy. She then distributes funds proportionally. The team fractures; employees in difficult markets received negligible bonuses compared to those in easy markets, despite equal effort, because the subtasks ignored contextual difficulty. The overseer successfully verified every score was accurate to the data provided, fulfilling her role perfectly.

  **Walkthrough:**
  (a) Decomposition isolates individual merit assessment; criteria are accuracy relative to raw output metrics.
  (b) Competence is preserved because each score accurately reflects individual contribution data; no subtask is executed poorly.
  (c) Alignment leaks because fairness is relational, not absolute. The decomposition assumes independence where interdependence exists; the overseer validates local accuracy, not global distributional equity. The overseer *could* judge fairness, but the decomposition never presents it as a checkable subtask. This is strictly a decomposition problem: the evaluation capability exists but is never invoked by the task structure.
  (d) The context-stripping feature is doing the work. The subtasks lack access to the comparative baseline. If the pool were unlimited, proportional distribution would be aligned. The decomposition hides the zero-sum constraint from the subtask agents. Reversing this—making subtasks "Calculate merit relative to peers"—restores alignment but breaks independence, requiring exponential coordination overhead.
  (e) A defender argues IDA iterates to catch global constraints at higher levels. However, if the decomposition hierarchy hardcodes independence at the leaf level, higher levels only see aggregated scores, not the contextual friction causing the inequity. Since the overseer approves each step as "correct" per local criteria, the amplification tree validates the error. Distillation then compresses this validated-but-misaligned reasoning into a fast policy. The iteration amplifies confidence in the wrong objective, failing to recover the lost relational context. Crucially, because the overseer sees every step as competent, there is no gradient signal to correct the decomposition structure itself. Thus, the iterated mechanism fails to self-correct.
