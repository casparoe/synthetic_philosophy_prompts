  ### The two positions, stated properly

  The covering-law model, championed by Carl Hempel, posits that historical explanation shares the logical structure of natural science. To explain an event is to show it was to be expected, subsuming it under a general empirical law connecting antecedent conditions to outcomes. For the Hempelian, a narrative without implicit regularities is merely a description; explanation requires showing that, given the circumstances and human nature, the event *had* to occur. Even if historians do not explicitly state these laws, they are logically required to validate the inference. Without them, the connection between events remains anecdotal. The goal is objective validation, ensuring that historical claims are not merely subjective interpretations but grounded in observable regularities of human behaviour, economics, or psychology.

  Conversely, narrative theorists like William Dray argue that history explains by making actions intelligible within their specific context. This approach focuses on the 'principle of continuity', tracing how agents moved from situation A to B through reasoned choices. Here, explanation does not rely on universal laws of behaviour, which are often trivial or non-existent, but on reconstructing the rationale of historical actors. The narrative itself provides the coherence, showing how events hang together without needing to prove they were predictable according to scientific regularities. For the narrativist, understanding the agent's perspective offers a complete explanation, distinct from causal subsumption. The dispute is not merely about style, but about whether history is a branch of sociology or an autonomous discipline of understanding. Consequently, the Hempelian seeks to generalise findings across cases, whereas the narrativist seeks to illuminate the uniqueness of the specific case. This fundamental divergence sets the stage for the enduring conflict.

  ### Where the debate keeps sticking

  The deadlock arises because each side neutralises the other's counterexamples by redefining terms. When narrativists present unique events, like the French Revolution, that defy prediction, Hempelians retort that explanation still requires *some* regularity, however vague, such as 'agents act to achieve goals'. When Hempelians demand predictive power, narrativists reply that history explains past singularities, not future probabilities.

  Consequently, the debate oscillates between charge and defence. The covering-law proponent accuses the narrativist of offering mere storytelling, lacking logical force. The narrativist accuses the Hempelian of imposing an alien scientific framework that distorts historical practice. They agree on the data—historical texts—but disagree on what makes those texts explanatory. One side sees missing premises where the other sees sufficient context. Because both positions are internally consistent, neither can deliver a knockout blow. The Hempelian cannot prove laws are absent, only that they are unstated; the narrativist cannot prove laws are unnecessary, only that historians manage without them. Thus, the argument cycles endlessly, with each party retreating to their own criteria of success. The triviality objection—that the laws are too vague to be useful—is met with the claim that vagueness does not equal non-existence. Meanwhile, the uniqueness objection is met with the claim that uniqueness does not preclude general patterns. Neither side conceding ground ensures the stalemate continues.

  ### Diagnosis

  This is not merely a substantive dispute about historical reality, nor purely a verbal quarrel over definitions. It is a pragmatic divergence regarding the *purpose* of explanation. Your hunch is correct: you are using 'explanation' to mark two different intellectual achievements. For your colleague, explanation is about *justification*—establishing that a claim is objectively warranted by general truths. For you, it is about *comprehension*—rendering a sequence of events meaningful to a human audience.

  Furthermore, this reflects deeper philosophical commitments. The covering-law model stems from a positivist intuition that knowledge requires unity; if history is to be knowledge, it must resemble science. It seeks to protect history from subjectivity and ensure rigour. The narrative model stems from a hermeneutic intuition that human action is unique and requires interpretation rather than subsumption. It seeks to protect history from reductionism and preserve agency. You are arguing from different starting points: one prioritises logical rigour and external validation, the other prioritises phenomenological adequacy and internal coherence.

  Consider also that 'explanation' may be a family-resemblance concept rather than a unitary one. In medicine, explaining a fever involves laws of biology; in law, explaining a crime involves establishing motive and opportunity. History might legitimately occupy both spaces. The stalemate persists because both sides insist on a monistic account of explanation. Your colleague fears that without laws, history becomes fiction. You fear that with laws, history becomes sociology.

  Additionally, there is a disagreement about standards of evidence. Your colleague treats the absence of explicit laws as a logical deficit. You treat the presence of a coherent story as evidential sufficiency. This is a mixture of verbal and substantive disagreement. It is verbal because you are attaching the same label to different concepts. It is substantive because those concepts reflect competing views on whether human behaviour is law-governed. Until you acknowledge that you are answering different questions—'Why was this inevitable?' versus 'How did this make sense?'—the stalemate will persist. You are playing different games with the same pieces. In a teaching module, this confusion is particularly damaging. Students need to know if they are constructing arguments based on regularities or interpreting meanings. The disagreement is ultimately about what competence looks like in your discipline. It is also about professional identity; conceding feels like surrendering the soul of the subject to either hard science or soft art.

  ### What would count as progress

  Progress requires shifting from metaphysics to methodology. Instead of asking 'What is explanation?', ask 'What work is this explanation doing in this specific context?'. You should propose a pluralist framework to your colleague. Acknowledge that covering laws are useful for structural history, such as demographics or economics, while narrative is essential for political or cultural history.

  Next time, say this: 'We are both right, but for different purposes. You are ensuring our claims are robust; I am ensuring they are intelligible. Let's teach students to distinguish between causal analysis and narrative understanding.' This moves the debate from a zero-sum conflict to a complementary division of labour.

  Progress looks like agreeing on criteria for assessment. If a student provides a narrative, do not penalise them for missing laws. If they provide a structural analysis, do not penalise them for lacking colour. You might also agree to use different terminology: 'causal explanation' for your colleague's model, 'interpretive understanding' for yours. This linguistic precision dissolves the verbal dispute.

  Ultimately, progress is pedagogical. If your students can produce both rigorous arguments and coherent stories, you have succeeded. The theoretical stalemate matters less than practical competence. Stop trying to convert your colleague; start trying to collaborate on a syllabus that accommodates both modes. Focus on the utility of each approach for different historical questions. By validating both methods, you model the intellectual maturity you wish to see in your students. This turns the row into a resource rather than a roadblock. Suggest a joint seminar where you both analyse the same event using different methods to demonstrate the value of each. This practical demonstration often succeeds where theory fails.

  ### Bottom line

  The stalemate is a category error. You are debating the definition of a tool while trying to build different houses. Accept that history requires both scientific rigour and narrative coherence. Tell your colleague: 'Let's stop fighting over the word and start teaching the skills.' Pluralism is the only way forward. The tension between these models keeps the discipline honest, preventing it from sliding into pure speculation or dry determinism. Embrace the duality. Your disagreement is a feature of the subject, not a bug. Use it to show students the richness of historical thought.
