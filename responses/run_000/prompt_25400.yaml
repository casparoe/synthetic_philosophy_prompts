  2.  **Initial Knowledge Retrieval & Analysis:**

      *   *What is Program Equilibrium?* Originates with Tennenholtz (2004) and earlier work by Fortnow et al. It involves agents submitting source code to a mediator (or directly to each other) in a one-shot game. The code reads the other's code and outputs an action.
      *   *The "CooperateBot" / "FairBot" dynamic:* The classic example is `FairBot`: Cooperate if the opponent cooperates against me. If both play FairBot, they cooperate. If one plays `DefectBot`, FairBot defects.
      *   *Connection to Decision Theory:* This is heavily tied to Functional Decision Theory (FDT) and Logical Decision Theory (LDT) (Yudkowsky, Soares). It's often contrasted with Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).
      *   *Key Criticisms:*
          *   **Computability/Halting:** If I simulate you simulating me, do we halt? (Gödelian limits).
          *   **Obfuscation:** I can write code that *looks* like FairBot but defects in a specific edge case you can't prove won't happen.
          *   **Equilibrium Selection:** There are many equilibria. Why FairBot? Why not `CooperateIfOpponentCooperates99PercentOfTheTime`?
          *   **EDT vs. CDT:** PE is often argued to implement a form of subjunctive dependence, which looks a lot like EDT or LDT, not CDT. The user claims it avoids EDT. This is a contentious point.
