      *   **User's Stance:** Convinced PE is promising. Sees it as fixing an "impoverished model of agents" (allowing conditioning on decision procedures vs. actions). Wants to avoid Evidential Decision Theory (EDT), repetition, reputation, etc.
      *   **Task:** Identify what counts *against* this view as a *normative theory of rational choice in idealized settings*.
