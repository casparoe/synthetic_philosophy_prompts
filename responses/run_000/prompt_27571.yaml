answer: |-
  ### 1. The Phenomena

  Standard epistemic logic models agents as ideal reasoners, failing to capture human cognition. Three core phenomena demand correction. First, **Computational Boundedness**: agents fail to deduce obvious consequences of their beliefs due to time or memory limits (e.g., knowing axioms of ZFC but not knowing all theorems). This distinguishes *not deriving* from *rejecting*. Second, **Conceptual Lack**: agents lack the concepts required to formulate certain propositions, rendering them neither believed nor disbelieved (e.g., a medieval doctor not believing germ theory). This requires distinguishing *not having considered* a proposition from *not believing* it. Third, **Inconsistency Tolerance**: agents hold contradictory beliefs without believing everything (e.g., believing a schedule works while believing two meetings overlap). A model must distinguish between *inconsistency* (holding $P$ and $\neg P$) and *incoherence* (believing everything). It must allow local contradictions without global triviality. Finally, the model must capture **Resource Sensitivity**: inference takes effort. An adequate representation must reflect that deriving $\psi$ from $\phi$ is an event, not a state. Without these, the model describes a god, not an agent.

  ### 2. The Desiderata

  1.  **Failure of Closure under Implication** (Non-negotiable). *Case:* Computational Boundedness. If an agent believes $\phi$ and $\phi \to \psi$ is valid, they need not believe $\psi$. *Status:* Universal requirement for boundedness. Without this, the model implies infinite deductive power.
  2.  **Failure of Validity** (Non-negotiable). *Case:* Conceptual Lack. Agents do not believe all tautologies ($B\top$ fails). *Status:* Universal. Agents cannot believe propositions they cannot express.
  3.  **Explicit vs. Implicit Distinction** (Non-negotiable). *Case:* Consideration. The model must separate what is actively represented (explicit) from what follows semantically (implicit). Collapsing these erases boundedness. *Status:* Universal. Explicit belief drives action; implicit belief defines potential.
  4.  **Inconsistency without Explosion** (Non-negotiable). *Case:* Human Error. $\{B\phi, B\neg\phi\}$ must not entail $B\psi$ for all $\psi$. *Status:* Universal for realistic agents. Real agents are locally inconsistent but globally functional.
  5.  **Preservation of Easy Inferences** (Camp-specific). *Case:* Rationality norms. Levesque argues single-step modus ponens should hold; Konolige argues all inference is costly. *Status:* Divides structural vs. syntactic approaches. Determines if the agent is "lazy" or "limited."
  6.  **Positive Introspection** (Camp-specific). *Case:* Self-knowledge. Must $B\phi \to BB\phi$? Realists say no (unconscious belief); Idealists say yes. *Status:* Philosophical preference. Affects complexity of self-monitoring.
  7.  **Tractability** (Camp-specific). *Case:* AI implementation. AI camps require belief checking to be polynomial; philosophical camps accept undecidability for expressive power. *Status:* Engineering preference. Determines practical usability in software.
  8.  **Conceptual Atomism** (Camp-specific). *Case:* Language. Must belief be tied to specific sentences (syntactic) or propositions (semantic)? *Status:* Ontological preference. Dictates whether belief is a relation to words or world-states.

  ### 3. Tensions

  The primary tension lies between **Closure Preservation** and **Computational Boundedness**. If a model allows *any* closure (e.g., single-step deduction), it risks sliding back into omniscience via iteration unless a hard stop is engineered. This is the "slippery slope" problem: why is one step free but two costly? Conversely, allowing *no* closure makes agents too inert to count as reasoning agents at all. Secondly, **Semantic Compositionality** clashes with **Explicit Belief**. Possible-worlds semantics relies on truth conditions across worlds; if an agent doesn't believe a tautology, the semantics must break (impossible worlds) or belief must be syntactic. Syntactic models save explicitness but lose elegant semantic interpretation, making integration with other logical systems difficult. Finally, **Inconsistency Tolerance** conflicts with **Classical Logic**. To allow contradictory beliefs without explosion, the underlying logic of the belief set must be paraconsistent or the access relation must be non-standard, complicating integration with standard reasoning systems. You cannot have classical semantics, full consistency, and non-omniscience simultaneously.

  ### 4. The Load-bearing Requirement

  The **Failure of Closure under Implication** is the load-bearing requirement. Standard possible-worlds semantics validates closure automatically: if $\phi$ is true in all accessible worlds, and $\phi \to \psi$ is valid, $\psi$ is true in all accessible worlds. To satisfy non-omniscience, a model must either restrict the set of accessible worlds (impossible worlds), decouple belief from truth conditions (syntactic), or introduce awareness functions. This single constraint forces the abandonment of standard Kripke semantics, making it the primary filter against traditional epistemic logic. It demands a structural break in how information is propagated across the model's state space.

  ### 5. Scorecard

  *   **Possible-Worlds (Standard):** Fails Non-negotiables 1, 2, 4. Validates omniscience. Good for ideal agents, useless for bounded ones. It collapses explicit and implicit belief entirely.
  *   **Syntactic:** Passes 1, 2, 3, 4. Belief is a set of sentences. Fails Semantic Compositionality (often). Tractability varies based on deduction rules. High fidelity to explicit belief but lacks possible-worlds elegance.
  *   **Awareness (Fagin/Halpern):** Passes 1, 2, 3. Uses awareness function to filter propositions. Handles Explicit/Implicit well. Can struggle with 4 (Inconsistency) depending on implementation. Retains possible-worlds structure but limits quantification.
  *   **Impossible-Worlds (Rantala):** Passes 1, 2, 4. Allows logic failures at some worlds. Preserves semantic elegance better than syntactic. Computationally expensive. Solves closure by breaking logic at non-ideal worlds.
  *   **Summary:** Syntactic models best capture explicitness but lack semantics. Impossible-worlds preserve semantics but are complex. Awareness models are a hybrid but often revert to omniscience within the aware set. No model satisfies all camp-specific preferences simultaneously.
