answer: |-
  Hi there,

  It is completely understandable that you are going in circles on this because philosophers have been debating the exact relationship between these distinctions for decades without reaching a total consensus. The short answer to your main question is that no, the two distinctions are not coextensive, and they do not always map onto each other perfectly. While it is tempting to think that doing corresponds to killing and allowing corresponds to letting die, the mapping breaks down in several important cases, particularly when we look at medical ethics and issues of duty.

  The clearest place where they diverge is exactly where you suspected, in cases like withdrawing life support. Physically, disconnecting a ventilator is an action, a doing, because you are moving your hand to turn a switch or remove a tube. However, in bioethics and law, this is almost universally classified as letting die rather than killing. The reasoning is that the underlying pathology is the cause of death, and the doctor is merely removing an obstacle that was holding death at bay. Here we have a doing that counts as a letting die, which proves the distinctions are not identical. If they were the same, every doing that resulted in death would be killing, but withdrawing treatment is the counterexample that stops them from being coextensive.

  On the other side of the coin, you can have cases of allowing that might morally or legally amount to killing. This is where your point about duty comes in. If a parent deliberately withholds food from an infant, they are technically omitting an action, which looks like allowing. However, because there is a specific duty of care, most moral and legal frameworks classify this as killing rather than letting die. In this scenario, the allowing becomes a killing because of the normative expectation placed on the agent. This suggests that the killing/letting die distinction is not just a metaphysical description of cause and effect like doing/allowing often is, but is actually loaded with moral and legal conventions about responsibility.

  Regarding which distinction is doing the normative work, that is really the heart of the debate. Some philosophers, like James Rachels, argued that the distinction itself has no intrinsic moral weight at all. He famously used the example of two men who drown a child, one by actively holding him under and one by watching him slip and doing nothing. Rachels argued that if the outcome and intention are the same, the moral culpability should be the same, implying that the killing/letting die distinction is morally irrelevant. However, many deontologists and legal theorists disagree, arguing that doing harm is inherently worse than allowing harm, regardless of the outcome. They would say the doing/allowing distinction is the fundamental one, and killing is just a subset of doing harm that results in death.

  Ultimately, it is probably best to view the killing/letting die distinction as a moralized version of the doing/allowing distinction that has been specialized for the context of death. They come apart because our moral intuitions about death are influenced by factors other than just physical causation, such as whether a disease was already present or whether a specific duty existed. So while they track each other in simple cases like shooting someone versus ignoring a drowning stranger, they diverge in complex institutional cases like medicine. The normative work is likely being done by a combination of both, plus additional factors like intent and duty, rather than by either distinction alone.

  I hope that helps clear up the fog a bit. It is a tricky area where metaphysics meets moral intuition, so feeling like you are spinning your wheels is actually a sign that you are engaging with the problem correctly.

  Best wishes
