  hey, so i've been trying to get clear on whether the doing/allowing distinction and the killing/letting die distinction are really the same distinction or not, and i keep going in circles. on the face of it they seem like they track the same thing — doing is to allowing as killing is to letting die, right? but then i think about cases where they might come apart. like, consider a doctor who administers a lethal dose of morphine to a terminally ill patient (doing, killing) versus a doctor who withholds antibiotics from a patient with a treatable infection who then dies (allowing, letting die). that lines up fine. but now what about withdrawing life support? is that a doing or an allowing? is it a killing or a letting die? some people want to say withdrawing is an allowing and a letting die, but others say it's a doing and a killing — and the weird thing is, you could think it's an allowing but still a killing, or a doing but a letting die, if the distinctions dont map onto each other perfectly. and then there's the whole thing about whether "allowing" requires some kind of duty or expectation — like, if i don't send money to famine relief, am i allowing people to die? is that a letting die? it feels different from walking past a drowning child, but it's not obvious which distinction is doing the work in marking that difference. i guess my question is: are these two distinctions coextensive across all cases, and if not, where exactly do they diverge? and if they do diverge, which one is doing the normative work — is the killing/letting die distinction just a special case of doing/allowing applied to death, or does death have some feature that makes it its own thing such that the two distinctions can come apart in principled ways? please just respond in normal prose, no formatting, no bullet points or headings or anything, just like a regular email.
