      *   *The "Worse than Lying" Question:* If Stevens had lied ("I hate you," "I am happy you are marrying"), it would have closed the door. By misleading ("The staffing arrangements are..."), he keeps the door technically open but practically locked. This creates ambiguity that prevents closure. It shifts the burden of interpretation onto the other person.

