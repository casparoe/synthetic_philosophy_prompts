answer: |-
  ### 1. The Prerequisite Concept
  Before the paradox can register, the group must firmly accept **Instrumental Rationality**.
  You must establish that in this context, "rational" does not mean "moral," "sensible," or "reasonable." It means **maximizing your own expected outcome.**
  *   **Why:** If participants believe "rational" includes "keeping promises because it's right," the Hitchhiker scenario dissolves. It is obviously rational to pay. The paradox only exists if paying is *against* your self-interest at the moment of payment, yet you are better off if you are the *kind of person* who pays.
  *   **Action:** Spend the first 3 minutes defining "Rationality" on the whiteboard as: *"Doing whatever leads to the best result for you."* Explicitly strip away morality.

  ### 2. The Scaffolding Example
  Do not start with the Hitchhiker. Start with **The Desert Island Shopkeeper.**

  **The Scenario:**
  You are shipwrecked on an island with one shopkeeper. You find a treasure chest but cannot open it without a key the shopkeeper has. He offers the key now, on the promise that you will give him 50% of the gold once the chest is open. There are no police, no contracts, and you will both die on the island (no future reputation).

  **Properties this example must have (that the Hitchhiker lacks):**
  1.  **Low Emotional Stakes:** The Hitchhiker involves dying in a desert, which triggers emotional moral intuitions ("I'd pay to be good"). The Shopkeeper is a cold transaction.
  2.  **No "Ride" Ambiguity:** In the Hitchhiker, the ride is the benefit. In the Shopkeeper, the *key* is the benefit. It clarifies that the payment comes *after* the benefit is secured.
  3.  **Transparency:** Stipulate that the shopkeeper is a perfect judge of character. He knows if you are the "type" who will pay before he hands over the key.

  ### 3. Sequence and Misconception Management (40 Minutes)

  **0:00 – 0:05: Definitions (Head Off Misconception #1)**
  *   **Activity:** Define Instrumental Rationality on the board.
  *   **Misconception:** *Weakness of Will (Akrasia).* Participants often think this is about failing to stick to a plan due to emotion.
  *   **Strategy:** **Head it off.** Explicitly state: "We are not talking about being too weak to keep a promise. We are assuming you are a cold, calculating machine. The question is: what calculation leads to the best outcome?"

  **0:05 – 0:15: The Shopkeeper (Let Stumble into Misconception #3)**
  *   **Activity:** Run the Shopkeeper scenario. Ask: "Do you pay the 50%?"
  *   **Misconception:** *The Obviousness of Paying.* Participants will say, "Of course I pay, I'm honest."
  *   **Strategy:** **Let them stumble.** Do not correct them yet. Ask "Why?" When they say "Because it's right," remind them of the Instrumental Rationality definition. When they say "For reputation," remind them they are dying on the island.
  *   **Correction:** Force them to admit that at the *moment of payment*, keeping 100% is better for them. This creates the tension: The Shopkeeper knows you will think this, so he never gives you the key. You get 0% gold.

  **0:15 – 0:25: The Hitchhiker & The Pivot**
  *   **Activity:** Move to Parfit's Hitchhiker. The logic is now familiar. You die because you are too rational to pay.
  *   **Insight:** You would be better off if you were *irrational* (disposed to pay even when it costs you).
  *   **Misconception:** *Pre-commitment (Ulysses).* Participants will suggest: "Just sign a contract!" or "Threaten him!"
  *   **Strategy:** **Let them stumble.** This is the natural intuitive fix. Allow the group to propose binding mechanisms.
  *   **Correction:** Remove the possibility of binding (no pen, no law, no leverage). Ask: "If you cannot change the *rules*, you must change the *player*. What kind of player survives?" This leads to the core Parfitian insight: **Disposition Rationality.** It is rational to cultivate a disposition that forces you to act irrationally in the moment.

  **0:25 – 0:35: Synthesis**
  *   **Activity:** Whiteboard comparison.
      *   *Act-Rationality:* At the moment of payment, don't pay. (Result: No ride/No key).
      *   *Disposition-Rationality:* Be the person who pays. (Result: Ride/Key obtained).
  *   **Key Takeaway:** Rationality applies to your *nature*, not just your *moves*.

  **0:35 – 0:40: Assessment**
  *   **Activity:** Pose the Final Question (see below).

  ### 4. The Final Assessment Question
  To distinguish between understanding "Rational Irrationality" vs. simple "Self-Binding," ask:

  > **"If you could take a pill that permanently removed your ability to calculate self-interest *at the moment of payment*, would taking that pill be the rational choice? And if you took it, is the act of paying the bill rational?"**

  *   **Correct Understanding:** "Yes, taking the pill is rational (because it gets you the ride). No, paying the bill is not rational (it's a costly loss), but it is the *output* of a rational strategy."
  *   **Misunderstanding:** "Taking the pill is irrational because it makes you stupid," or "Paying is rational because you took the pill." (This conflates the strategy with the act).

  ### 5. What to Explicitly Refuse to Cover
  **Causal vs. Evidential Decision Theory.**
  *   **Why:** This is the technical machinery philosophers use to solve the paradox (CDT vs. EDT). It involves counterfactuals and probability matrices that will bog down non-specialists.
  *   **Instruction:** If someone asks, "But how can my decision now cause his decision then?" do not explain causal graphs. Simply reply: "Your decision doesn't cause his; your *nature* predicts his. We are looking at the value of the nature, not the physics of the causation." Keep it on the value of dispositions, not the mechanics of decision theory.
