      *   *Section 2 (Location):* It's the social revolution, not tech. The "realm of necessity" to "realm of freedom."
      *   *Section 3 (Praxis):* Critique of the "view from nowhere." Longtermists act as guardians; Marxists act as weapons of a class.
      *   *Section 4 (Determinism/Now):* The "Now" is determined by maturity of conditions, not chance.
      *   *Conclusion:* The Verdict. Marx co-opts the HoH. It's not that we *might* be at a hinge; it's that capitalism *makes* this a hinge, and only communism resolves it.

  9.  **Refining the Tone:**
