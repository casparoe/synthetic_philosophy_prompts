      *   *Candidate 1: The Coin Flip Tournament.*
          *   *Mechanic:* Everyone starts with 100 points. Coin is biased (60% heads). Heads = +50%, Tails = -40% (or similar). They choose bet size each round. 20 rounds.
          *   *Pros:* Simple, direct analogy to investing.
          *   *Cons:* People might collude or copy the winner. If the variance is too high, *everyone* might go bust by chance, which is demoralizing. If too low, the lesson is muted. Managing 18 individual spreadsheets is a logistical nightmare for one facilitator.
          *   *Verdict:* Too much admin overhead.

      *   *Candidate 2: The "All-In" vs. "Fixed Fraction" Teams.*
          *   *Mechanic:* Split the room into two or three groups. Group A *must* bet 100% (All-In). Group B *must* bet 25%. Group C chooses. Run a single shared sequence of random outcomes for everyone.
          *   *Pros:* Controlled variable (the random sequence is the same for all). Clear comparison. Low admin (facilitator runs the random number generator).
          *   *Cons:* Removes agency from the "All-In" group (they might feel cheated). Doesn't let them *discover* the strategy, just observes it.
          *   *Verdict:* Good for demonstration, bad for "discovery."

      *   *Candidate 3: The Individual Ledger with a Shared Market.*
          *   *Mechanic:* Everyone gets a physical ledger sheet. Facilitator draws balls from a bag (or rolls dice) publicly. Everyone decides their bet size privately, writes it down, then reveals.
          *   *Pros:* High agency. Shared randomness ensures fairness. Physical tokens make it tactile.
