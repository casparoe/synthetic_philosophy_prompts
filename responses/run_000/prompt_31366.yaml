          *   Math errors in compounding.
          *   "Gambler's Fallacy" thinking (I'm due a win).
          *   Time management (calculations take longer than expected).
      *   **Limitations:**
          *   Real life has correlated risks, not independent coin flips.
          *   Utility of money isn't linear (losing $1000 hurts more than winning $1000 helps), but the game assumes linear utility of points.
          *   The game assumes you *must* play. In real life, you can walk away.

  5.  **Refining the Mechanics for the "Gut Feel":**
      *   To make the "Volatility Drag" visceral, I need a scenario where a Win and a Loss results in *less* money than you started with, despite the EV being positive.
      *   *Scenario:* Start with 100. Bet 100.
      *   Win: Get 200.
      *   Lose: Get 0.
      *   This is too harsh (instant death).
      *   *Scenario:* Start 100. Bet 50.
      *   Win: +50 (Total 150).
      *   Lose: -50 (Total 50).
      *   Next round, bet 50% of current.
      *   Win then Lose: $100 \to 150 \to 75$.
      *   Lose then Win: $100 \to 50 \to 75$.
      *   *Result:* One win, one loss = 25% loss of capital.
      *   *EV Check:* Bet 50. 60% win 50, 40% lose 50. EV = $30 - 20 = +10$.
      *   This works. It shows that even with a "good" bet, volatility eats you if you bet too big.
      *   *Wait, I need to make sure the EV is clearly positive.*
      *   Let's use the **60/40 Biased Coin** with **Even Money Payout**.
      *   Bet $B$. Heads (60%): Win $B$. Tails (40%): Lose $B$.
      *   Arithmetic Expectation: $0.6(B) - 0.4(B) = 0.2B$. Positive.
      *   If you bet 100% of bankroll ($B=W$):
          *   Heads: $2W$. Tails: $0$.
          *   One tail destroys you.
      *   If you bet 50% of bankroll:
          *   Heads: $1.5W$. Tails: $0.5W$.
          *   H then T: $1.5 \times 0.5 = 0.75W$. You lost 25% despite equal wins/losses.
      *   This is the "Aha!" moment. Equal wins and losses should break even, right? No, because of compounding.
      *   *Decision:* I will use this mechanic. It's the standard Kelly demonstration for a reason.

  6.  **Drafting the Plan:**
      *   *Timeline:* 90 mins is tight. Need strict timekeeping.
      *   *Materials:* Printed ledger sheets are crucial to avoid math errors slowing things down.
      *   *Randomness:* Use a bag with 6 Red (Win) and 4 Blue (Lose) balls. Draw with replacement. It's tactile and transparent.
      *   *Debrief:* Must connect "One Win One Loss = Loss" to "Geometric Mean < Arithmetic Mean."

  7.  **Addressing the "What Will Go Wrong" Section:**
      *   *Math Anxiety:* People will freeze calculating 15% of 137.
          *   *Fix:* Provide a "Cheat Sheet" multiplier table or suggest rounding.
      *   *The "Lucky All-In":* Someone might bet 100% and get 5 Heads in a row. They will claim the strategy works.
          *   *Fix:* Run enough rounds (30) so variance smooths out, or acknowledge luck in debrief.
      *   *Boredom:* 30 rounds of writing numbers is tedious.
          *   *Fix:* Make rounds fast. 1 minute per round max.
      *   *Cheating:* Changing bet size after seeing the ball.
          *   *Fix:* Collect bet sheets before drawing.

  8.  **Addressing the "What This Can't Teach" Section:**
      *   *Utility:* Points aren't dollars. Losing 1000 points doesn't hurt.
      *   *Correlation:* Real markets crash together; this is independent risk.
      *   *Optionality:* In real life, you can stop. Here, you play 30 rounds.
      *   *Fractional Shares:* In the game, you can bet 13.7 points. In stocks, liquidity matters.

  9.  **Final Review against Constraints:**
      *   18 people.
      *   No real money.
      *   Gut feel before math.
      *   Expert tone.
      *   Brainstorming section included.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Payoff:* If I use 60/40 even money, the Kelly fraction is 20%. If people bet 50%, they will still grow, just slower than optimal. If they bet 100%, they bust. I need to ensure the "bust" condition is likely enough to be seen. 30 rounds with 100% bet means probability of survival is $0.6^{30}$, which is effectively zero. Good.
