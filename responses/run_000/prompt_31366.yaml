      *   *The Reality:* If you bet too much (e.g., 100% of bankroll), volatility drags the *geometric* mean down. $1.5 \times 0.5 = 0.75$ (loss) even if average is $1.0$.
      *   *The Solution:* Fractional betting (Kelly) maximizes the growth rate of the *logarithm* of wealth.
      *   *The "Gut Feel":* Participants need to feel the pain of volatility drag and the stability of compounding.

