answer: |-
  Here is a complete design for your 90-minute session. I have structured this to move from visceral experience to conceptual understanding, minimizing lecture time and maximizing the "wait, why did I lose?" moment.

  ### Part 1: Brainstorming Game Mechanics

  Before settling on the final design, here are three candidate mechanics I evaluated.

  **Candidate 1: The "Portfolio Choice" Market**
  *   **Mechanic:** Participants choose between three different "stocks" each round. Stock A is safe/low return, Stock B is moderate, Stock C is high volatility/high return. They allocate percentages.
  *   **Pros:** Feels like real investing.
  *   **Cons:** Too many variables. If someone goes bust, they blame the "stock" rather than their bet size. It obscures the specific lesson about *leverage* and *compounding*.
  *   **Verdict:** Reject. Too noisy.

  **Candidate 2: The "All-In" Tournament**
  *   **Mechanic:** Half the room is *forced* to bet 100% of their bankroll. Half is *forced* to bet 20%. A single coin flip sequence is applied to everyone.
  *   **Pros:** Perfectly isolates the variable (bet size). Clear A/B test.
  *   **Cons:** Removes agency. Participants won't feel the *temptation* to overbet, so they won't internalize the psychological error. It becomes a lecture with props.
  *   **Verdict:** Reject. Too passive.

  **Candidate 3: The "Ledger & Bag" Game (Selected)**
  *   **Mechanic:** Everyone starts with 100 points. A bag contains 6 "Win" tokens and 4 "Lose" tokens (60% win rate). Participants privately write down what % of their current bankroll they wish to wager each round. A token is drawn publicly. Wins add the wagered amount; losses subtract it. 30 Rounds.
  *   **Pros:** High agency (they choose the risk). Shared randomness (same luck for everyone). Tactile (physical tokens). The math is simple enough to do by hand but complex enough to hide the trap.
  *   **Cons:** Requires strict timekeeping. Math errors can frustrate players.
  *   **Verdict:** **Select.** This best balances discovery with controlled variables.

  ---

  ### Part 2: The Runnable Session Plan

  **Title:** The Ruin Game: Why Good Odds Aren't Enough
  **Time:** 90 Minutes
  **Participants:** 18 Adults
  **Materials:**
  *   18 "Banker Ledgers" (printed sheets, see below).
  *   18 Pens.
  *   1 Opaque Bag.
  *   10 Poker Chips or Tokens (6 Red for Win, 4 Blue for Lose).
  *   Whiteboard/Flipchart.
  *   Calculators (optional, but phone calculators are fine).
  *   Small prizes (chocolate/books) for the top 3 growth rates.

  #### 1. The Setup (10 Minutes)
  *   **Seating:** Arrange chairs in a semi-circle. Hand out Ledgers and pens.
  *   **The Hook:** "We are going to play an investing game. There is no trick. The odds are genuinely in your favor. Your goal is to finish with the most points. Points translate to prizes."
  *   **The Rules (Write on Whiteboard):**
      1.  **Start:** 100 Points.
      2.  **The Market:** I will draw a token from this bag. 6 Red (Win), 4 Blue (Lose). I put it back every time (independent odds).
      3.  **The Bet:** Before I draw, write down how many points you want to wager. You can bet 0 to 100% of your *current* total.
      4.  **The Payoff:** Even money. If you bet 10 and Red comes, you get +10. If Blue comes, you lose -10.
      5.  **Rounds:** We will play 30 rounds.
      6.  **Bankruptcy:** If you hit 0 points, you are out. You cannot borrow.
  *   **The Math Check:** Ask the room: "If I bet 10 points, what is my expected value?"
      *   Guide them: $(0.6 \times 10) + (0.4 \times -10) = +2$ points.
      *   **Crucial Line:** "Every single bet you make is mathematically favorable. If you played this once, you should play. If you play this 30 times, what should happen?" (Most will say "I should get rich.")

  #### 2. The Game (40 Minutes)
  *   **Pacing:** You need roughly 1 minute per round. Be a strict timekeeper.
  *   **Phase 1 (Rounds 1-10):**
      *   Participants write their wager (e.g., "20 pts" or "50%").
      *   Collect wagers? No, too slow. Have them hold up their ledger showing the wager, then you draw.
      *   Draw token. Announce result.
      *   Participants update ledgers.
      *   *Facilitator Tip:* Walk around. If you see someone betting 100% (All-In), say nothing. If you see someone betting 1 point, say nothing. Let them find their own comfort level.
  *   **Phase 2 (The Volatility Spike, Rounds 11-20):**
      *   Continue. By now, the "All-In" players will have likely hit a Blue token and gone bust, or they are on a miraculous hot streak.
      *   *Intervention:* If someone goes bust, acknowledge it loudly. "Sarah is out at Round 12." This creates tension.
  *   **Phase 3 (The End Game, Rounds 21-30):**
      *   The gap between the "compounders" and the "gamblers" will be massive.
      *   Finish Round 30.

  #### 3. The Reveal (10 Minutes)
  *   Ask everyone to shout out their final score. Write them on the whiteboard in ascending order.
  *   **The Pattern:** You will likely see a cluster of people near 0 (the All-In busts), a cluster in the middle (moderate bettors), and a few high flyers (optimal bettors).
  *   **The Gut-Check Question:** "Look at the people who went bust. Did they make bad bets?"
      *   *Answer:* No. They made *favorable* bets.
      *   "Look at the people who won half their bets and lost half their bets. Did they break even?"
      *   *Answer:* Probably not. They likely lost money.

  #### 4. The Debrief (30 Minutes)
  *   *Do not start with formulas.* Start with their specific ledgers.
  *   **Step 1: The Win/Loss Trap.**
      *   Find a participant who bet 50% of their bankroll every time and had roughly equal wins/losses (e.g., 15 Wins, 15 Losses).
      *   Ask: "You won half the time. The odds were 60/40. Why do you have less than 100 points?"
      *   **The Demo:** Write on the board:
          *   Start: 100. Bet 50 (50%).
          *   Win: $100 + 50 = 150$.
          *   Lose: $150 - 75 (50\%) = 75$.
          *   **Result:** One Win, One Loss = 25% Loss of Capital.
      *   **The Insight:** "Losses hurt more than wins help when you bet a percentage. This is **Volatility Drag**."
  *   **Step 2: Arithmetic vs. Geometric.**
      *   **Arithmetic (The Crowd View):** "If we all pooled our money and bet once, we'd win." This is the *Ensemble Average*. It's what the Expected Value (+2 points) measures.
      *   **Geometric (The Time View):** "If *I* keep playing over time, I experience one outcome after another." This is the *Time Average*.
      *   **The Connection:** "The game doesn't pay you on the average. It pays you on the sequence. The sequence multiplies your wealth. To maximize multiplication, you don't maximize the average return; you maximize the **growth rate**."
  *   **Step 3: The Logarithm (The "Why").**
      *   Now you can introduce the math gently.
      *   "When money compounds, we aren't adding; we're multiplying. The math of multiplication is the math of logarithms."
      *   "The All-In players maximized Arithmetic Expectation. The Winners maximized Geometric Expectation."
      *   "The sweet spot (Kelly Criterion) for this game was 20%. Did anyone bet near 20%?" (Celebrate them).
  *   **Step 4: Real World Application.**
      *   "In investing, this is why leverage kills. A 50% drop requires a 100% gain to recover. If you bet too big, volatility drains your account even if you're right about the direction."

  ---

  ### Part 3: Predictable Failure Points & Mitigation

  **1. The "Math Freeze"**
  *   **Problem:** Calculating 20% of 137 points slows the game down. People get frustrated and guess.
  *   **Fix:** Provide a "Cheat Sheet" on the ledger. Columns for 10%, 20%, 25%, 50%, 100%. Tell them rounding is allowed. Speed is more important than precision for the lesson.

  **2. The "Lucky All-In"**
  *   **Problem:** One participant bets 100% every time and gets 5 Reds in a row. They end up with 3200 points and claim "Aggression works."
  *   **Fix:** 30 rounds is usually enough to catch an All-In player (Probability of surviving 30 rounds at 100% bet is $0.6^{30} \approx 0$). If someone *does* get lucky, use them in the debrief. "This is survivorship bias. If we ran this game 100 times, this strategy goes to zero 99 times. We don't build strategy on the 1% luck."

  **3. The "Zero Bettor"**
  *   **Problem:** Someone gets scared and bets 0 or 1 point every time. They finish with ~100 points. They feel smart because they didn't bust, but they didn't learn about compounding.
  *   **Fix:** In the debrief, acknowledge them. "You survived, but you didn't grow. Risk management isn't about avoiding risk; it's about sizing it so you can stay in the game *and* compound."

  **4. Time Overrun**
  *   **Problem:** 30 rounds takes longer than 40 minutes.
  *   **Fix:** Cut to 25 rounds if needed. The lesson holds. Do not cut the debrief time; that's where the learning happens.

  ---

  ### Part 4: What This Activity Cannot Teach (Limitations)

  As the facilitator, you must supply the context for these three missing features. The game is a model, not reality.

  **1. Utility of Money (The "Sleep Test")**
  *   **Limitation:** In the game, losing 1,000 points is the same "pain" as losing 10 points. In real life, losing your rent money hurts more than winning a bonus helps.
  *   **Facilitator Note:** "In this game, points are linear. In your life, wealth is logarithmic. Losing 50% of your net worth feels more than twice as bad as gaining 50% feels good. This emotional reality makes the 'optimal' bet size even smaller than the math suggests."

  **2. Correlated Risk**
  *   **Limitation:** The bag draws are independent. In the 2008 financial crisis, "independent" mortgages all failed together.
  *   **Facilitator Note:** "This game assumes your bets don't talk to each other. In the real world, risks correlate. When the market crashes, everything drops. This means your 'safe' bet size in the real world should be smaller than in this game."

  **3. Optionality (The Ability to Quit)**
  *   **Limitation:** Participants *must* play 30 rounds. In real life, if the odds change or you get a big win, you can walk away.
  *   **Facilitator Note:** "The Kelly Criterion assumes you *must* keep betting. If you have the option to stop, that has value. Sometimes the best bet is not to play at all, even if the EV is positive."

  ### Facilitator's Cheat Sheet (The Math Behind the Curtain)

  *   **Game Parameters:** Win Prob ($p$) = 0.6, Lose Prob ($q$) = 0.4. Payout ($b$) = 1 (Even money).
  *   **Arithmetic Expectation:** $p(b) - q(1) = 0.6(1) - 0.4(1) = +0.2$. (Positive EV).
  *   **Kelly Fraction:** $f^* = p - q = 0.6 - 0.4 = 0.2$ (20% of bankroll).
  *   **Volatility Drag Example:**
      *   Bet 50% ($f=0.5$).
      *   One Win, One Loss sequence: $(1 + 0.5) \times (1 - 0.5) = 1.5 \times 0.5 = 0.75$.
      *   Net result: -25%.
      *   Arithmetic average of returns: $(+50\% - 50\%) / 2 = 0\%$.
      *   *This disconnect is the core lesson.*
  *   **Ruin Probability:**
      *   Betting 100%: Ruin is certain upon first Loss (40% chance per round).
      *   Betting 50%: Ruin is unlikely but growth is suboptimal.
      *   Betting 20%: Maximizes expected logarithmic utility.

  ### Final Advice for the Room
  When you open the floor for questions, someone will ask: "So what is the *right* number?"
  Your answer: "There is no single right number. There is only the number that lets you stay in the game long enough for the odds to work in your favor. The math says 20%. Your sleep says less. But the lesson is this: **Size matters more than direction.** You can be right about the odds and still go broke if you're wrong about the size."
