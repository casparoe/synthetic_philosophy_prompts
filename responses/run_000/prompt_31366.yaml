      *   *Calculation aid:* Provide a small calculator or a lookup table for common percentages (10%, 25%, 50%, 100%) to speed up play.

  11. **Final Polish:** Ensure the distinction between Arithmetic (ensemble average) and Geometric (time average) is clear in the debrief section. This is the core "Ergodicity" concept.

