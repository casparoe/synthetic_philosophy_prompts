          *   If you bet 100% of bankroll: Geometric mean = $\sqrt{2 \times 0} = 0$. You go bust.
          *   If you bet 20% (Kelly): Geometric mean is maximized.
          *   This is easier to calculate mentally for participants.

  4.  **Developing the Session Plan:**

      *   **Title:** "The Ruin Game."
      *   **Materials:** Play money (or chips), ledgers, a visible randomizer (bag of colored balls or digital RNG projected).
