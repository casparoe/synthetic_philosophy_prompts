      *   **Mike's Position:** Turing is being intellectually honest. He grants a fringe premise to show the test survives with a minor adjustment (experimental control). This is good design.
      *   **Dana's Position:** Turing is being inconsistent/dishonest. If ESP is real ("overwhelming evidence"), it undermines the behavioral criterion (mental content bypasses output). Quarantining it is special pleading. He can't have it both ways (believing evidence is overwhelming but treating it as a mere confound).
      *   **Task:** Referee the exchange move-by-move, identify who is right about what, and identify what they are missing.

