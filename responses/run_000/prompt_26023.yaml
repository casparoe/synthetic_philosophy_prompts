answer: |-
  You are not missing something structural; in fact, your diagnosis is remarkably sharp. The reason your reading group is stuck in a loop is that you have encountered one of the few genuine stalemates in contemporary formal epistemology. The math is settled (the probability axioms are stable), but the *philosophical interpretation* of what those axioms govern remains contested.

  To answer your specific question: **This is not merely a verbal dispute, nor is it purely substantive.** It is a **foundational disagreement about the normative source of rationality.**

  Here is a breakdown of why the debate persists, a refinement of your three camps, and an assessment of what would actually count as progress.

  ### 1. The Core Diagnosis: Normative Sources
  Your suspicion that the debate turns on "action vs. truth" is correct, but it is slightly more granular than that. The disagreement is about **where the normativity comes from.**

  *   **Camp A (Pragmatists):** Normativity comes from **instrumental rationality**. If your beliefs lead you to act in ways that frustrate your own preferences (guaranteed loss), you are irrational. The "loss" is the proof of the error.
  *   **Camp C (Epistemic/Accuracy):** Normativity comes from **veritistic value**. Beliefs aim at truth. If your credences are incoherent, they are mathematically guaranteed to be less accurate than some alternative set of credences, regardless of how you act. The "inaccuracy" is the proof of the error.
  *   **Camp B (Coherence/Constitutive):** This camp is often the most misunderstood. They argue that probabilism is a **constitutive norm** of belief. Just as "bachelors must be unmarried" is true by definition, "believers must be probabilistic" is true by the nature of the mental state. The Dutch Book is just a *reductio ad absurdum* illustration of the logical inconsistency, not the *source* of the irrationality.

  **Why this causes a stalemate:**
  Camp A accuses Camp C of being "spooky" (how does accuracy normatively bind us without action?). Camp C accuses Camp A of being "contingent" (what if I never bet? am I off the hook?). Camp B accuses both of missing the point (it's about the nature of the attitude, not consequences).

  ### 2. Refining Your Map of the Camps
  Your three-camp model is good, but the literature has shifted slightly in the last 15 years. Here is the updated terrain:

  **Camp A: The Pragmatic Vindication (Ramsey/de Finetti)**
  *   **Strength:** Connects belief to the real world.
  *   **Weakness:** The "Bridge Principle" problem. Why does a guaranteed *monetary* loss entail an *epistemic* failure? If I don't care about money, or if the bets are unavailable, am I rational?
  *   **Current Status:** Mostly defended by decision theorists who view credences as essentially tied to choice functions.

  **Camp B: The Representation Theorists (Savage/Joyce)**
  *   **Nuance:** They often use Dutch Books to show that *if* you want to represent your preferences with numbers, those numbers *must* be probabilities.
  *   **Weakness:** This justifies using probability for *decision*, not necessarily for *belief*. It leaves open the possibility that belief is one thing and decision is another.

  **Camp C: The Accuracy-First Epistemologists (Joyce/Pettigrew)**
  *   **The Move:** They explicitly try to sever the link to action. They argue that there is an "epistemic utility function" (like the Brier score). Incoherent credences are "accuracy-dominated."
  *   **The Counter-Attack:** As you noted, this depends on the choice of scoring rule. Why the Brier score and not something else? Pettigrew has spent years trying to derive the scoring rules from purely epistemic norms, but critics (like Hájek) argue this just pushes the pragmatic assumptions back a step.

  ### 3. Is it a Verbal Dispute?
  Partly, but not harmlessly.
  When Camp A says "justification," they mean "demonstration of practical defect." When Camp C says "justification," they mean "demonstration of epistemic defect."
  If they admitted they were talking about different defects, they could agree. **But they don't.** They both claim to be defining **Rationality simpliciter.**
  *   Camp A thinks epistemic rationality *is* a species of practical rationality.
  *   Camp C thinks epistemic rationality is *sui generis* (distinct from practical rationality).

  This is a substantive metaphysical disagreement about the mind. Until one side concedes that there are two types of rationality (Pragmatic and Epistemic), they will talk past each other.

  ### 4. What Would Count as Progress?
  You asked if progress requires a new theorem, a sharper distinction, or admitting defeat.

  **A new theorem? No.**
  The mathematics of Dutch Books and Accuracy Dominance are mature. Alan Hájek's "Dutch Book *Lost* and *Found*" papers essentially showed that you can construct Dutch Book-style arguments for almost anything if you tweak the assumptions. More math won't solve the normative disagreement.

  **A sharper distinction? Yes.**
  Progress lies in **Normative Pluralism**. The field is moving toward accepting that:
  1.  **Pragmatic Coherence** is required for *agents who act*.
  2.  **Epistemic Accuracy** is required for *agents who believe*.
  3.  These two might come apart in edge cases (e.g., "Pascal's Mugging" scenarios or self-fulfilling beliefs).
  Acknowledging that "Rationality" is a cluster concept rather than a single unified norm would dissolve the tension.

  **Admitting different background commitments? Yes.**
  You are right that nobody argues about the background commitment directly. The debate would advance if proponents explicitly stated: *"I am assuming that the primary function of credence is X."*
  *   If the function is **guidance**, DBA wins.
  *   If the function is **representation of the world**, Accuracy wins.
  *   If the function is **logical consistency**, Representation wins.

  ### 5. The Missing Structural Element: Idealization
  There is one structural element your reading group might be missing that fuels the fire: **Idealization.**
  All three arguments assume logically omniscient agents with infinite computational power.
  *   **The Problem:** Real humans *cannot* be probabilistically coherent. We cannot check all logical consequences of our beliefs.
  *   **The Implication:** If probabilism is a norm for *humans*, all three arguments fail because they demand impossibilities.
  *   **The Progress:** Recent work on **Bounded Rationality** and **Approximate Coherence** (e.g., by Richard Pettigrew or Branden Fitelson) is trying to adjust these arguments for non-ideal agents. If your group wants to break the loop, shift the debate to: *"Does probabilism apply to ideal agents only, or to us? If us, how do we modify the Dutch Book/Accuracy arguments to account for computational cost?"*

  ### Summary Recommendation for Your Group
  You are not confused; the debate is genuinely stalled because it hit a bedrock philosophical wall. To move forward:

  1.  **Stop looking for a "Knockdown Argument."** Accept that DBA and Accuracy arguments are mutually supporting but distinct lenses.
  2.  **Focus on the "Bridge Principle."** Ask Camp A: "Why does money matter for belief?" Ask Camp C: "Why does accuracy matter without action?"
  3.  **Read Alan Hájek.** Specifically *"Fifteen Arguments against Hypothetical Frequentism"* and his work on Dutch Books. He is the best at showing why the "simple" versions of these arguments fail.
  4.  **Consider Pluralism.** The most mature position in the room might be: "Credences have a dual role. They track truth (Accuracy) and guide action (Dutch Book). Probabilism is the unique point where these two demands intersect."

  Your intuition that the debate hinges on the **function of credences** is the key. The stalemate exists because philosophers are trying to derive a single normative system from two different functional descriptions of the same mental state. Progress comes from decoupling them, not forcing them to merge.
