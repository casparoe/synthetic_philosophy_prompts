answer: |-
  There is no single, canonical Latin term for this specific dialectical maneuver (like *ad hominem* or *petitio principii*). However, in meta-ethics and political philosophy, this configuration is a recognized composite of three distinct concepts.

  The most precise label for the phenomenon you are describing is **Asymmetric Reflective Equilibrium**, often underpinned by a **Moorean Shift** and sustained by **Methodological Conservatism**.

  Here is a breakdown of the components, why they fit your description, and how to distinguish them from the neighbors you identified.

  ### 1. The Core Mechanism: Asymmetric Reflective Equilibrium
  You correctly noted that **Reflective Equilibrium** (Rawls) involves a two-way adjustment: we tweak our principles to fit our intuitions, but we also revise our intuitions if they conflict with a robust principle.

  What your friend is practicing is **Asymmetric Reflective Equilibrium**. In this mode, the "equilibrium" is rigged. The pre-theoretical intuition (e.g., "I have special duties to compatriots") is treated as a **Fixed Point** that theory must orbit, while the theoretical constraints (e.g., "moral boundaries require non-arbitrary principles") are treated as flexible requirements that can be deferred.

  *   **Why this fits:** It captures the "direction of fit" problem you identified. Theory must accommodate intuition; intuition need not accommodate theory.
  *   **Distinction:** Unlike standard Reflective Equilibrium, this stance immunizes the intuition from revision. It treats the intuition not as a *provisional* anchor (as Rawls did) but as a *permanent* datum.

  ### 2. The Epistemic Move: The Moorean Shift
  The confidence your friend displays—that the intuition is more certain than the theoretical objection—is a classic application of **G.E. Moore's Method** (or the **Moorean Shift**).

  In response to skepticism about the external world, Moore famously held up his hand and argued, "I know I have a hand; therefore, the skeptical argument against it must be flawed somewhere, even if I can't show you where." Your friend is making the exact same move: "I know I have special obligations to compatriots; therefore, the argument that the boundary is arbitrary must be flawed somewhere, even if I can't show you where."

  *   **Why this fits:** It explains why the lack of a principle is treated as a "gap in understanding" rather than a falsification. The intuition is granted higher epistemic priority than the demand for consistency.
  *   **Distinction:** Mooreanism is a claim about *certainty*. Your observation adds the specific element of the *boundary* (the "where does it stop?" problem). A Moorean might say "I know X is true." Your friend is saying "I know X is true, and I know there is a line, even if I can't draw it."

  ### 3. The Boundary Defense: Theoretical Deferral (or Promissory Materialism)
  The specific move regarding the border—treating the lack of a principle as a "promissory note"—is often critiqued in philosophy of science as part of a **Degenerating Research Programme** (Lakatos), but in ethics, it is best described as **Theoretical Deferral**.

  When a moral distinction relies on a boundary that cannot be principled, but the proponent insists the boundary exists and will eventually be justified by future theory, they are engaging in **Boundary Immunity**. They are insulating the moral distinction from the **Arbitrariness Objection**.

  *   **Why this fits:** It captures the "promissory note" aspect.
  *   **Distinction from Science:** In science, a promissory note is valid if the research programme is *progressive* (predicting new facts). In this ethical context, the programme is often *degenerative* (it merely protects the intuition from criticism without generating new moral insights). If the boundary remains undefined indefinitely, the "note" never comes due.

  ### Proposed Terminology
  If you need a term to use in future correspondence or writing, I recommend **"Intuition Entrenchment"** or **"Asymmetric Coherence."**

  However, the most philosophically descriptive phrase for the specific boundary problem you identified is **"The Deferred Boundary Defense."**

  ### Distinguishing from Your Neighbors

  | Concept | Why it's close | Why it's not quite right |
  | :--- | :--- | :--- |
  | **Reflective Equilibrium** | Involves balancing intuitions and principles. | RE requires *mutual* adjustment. Your friend's view allows only *one-way* adjustment (theory bends, intuition holds). |
  | **Intuitionism** | Relies on moral intuitions as knowledge. | Intuitionism is a *meta-ethical* claim about how we know moral truths (non-inferentially). Your friend's move is *methodological* (how to handle counter-arguments). One can be an intuitionist without refusing to refine boundaries. |
  | **Promissory Note (Science)** | Admits current lack of explanation but predicts future success. | In science, this is judged by empirical progress. In ethics, "future theory" is often a placeholder for "I refuse to abandon this belief." It lacks the falsifiability of a scientific note. |
  | **Dogmatism** | Holding a belief without justification. | Too pejorative and broad. Dogmatism implies a refusal to listen. Your friend is engaging in argument but assigning the burden of proof entirely to the theorist, not the intuition. |

  ### The Philosophical Risk: Reification
  The deeper risk your friend is running is **Reification** (or the **Fallacy of Misplaced Concreteness**).

  By insisting the national boundary is morally real despite the lack of a principled gradient, he is treating a social construct (the nation-state) as if it were a **Moral Natural Kind**. He assumes the moral universe *must* carve at the joints of the political map, and if our theory doesn't show that yet, the theory is at fault.

  In the debates you mentioned (animals, free speech, fetal standing), this pattern reveals itself when someone assumes the moral category (e.g., "Personhood") must align perfectly with a legal or biological category (e.g., "Human DNA" or "Citizenship"), and treats the misalignment as a theoretical puzzle rather than a sign that the categories don't match.

  ### Summary
  You have identified a robust dialectical pattern. While it lacks a single Latin name, it is best described as **Asymmetric Reflective Equilibrium** driven by a **Moorean Shift**, utilizing **Theoretical Deferral** to resist the **Arbitrariness Objection**.

  If you wish to name it in conversation, **"Intuition Entrenchment"** is precise. If you wish to critique it, point out that it treats a **Contingent Boundary** (the nation) as a **Necessary Moral Kind**, which is a category error that no amount of future theory can fix.
