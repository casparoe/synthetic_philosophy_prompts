          *   Judge 2: Invalid, Breach -> Not Liable.
          *   Judge 3: Valid, Breach -> Liable.
      *   **Aggregates:**
          *   Valid? Yes (2-1).
          *   Breach? Yes (2-1).
          *   Liable? No (2-1).
      *   **Result:** Company wins (Not Liable), despite majority supporting both premises for liability.
      *   **Teacher's Term:** "Discursive Dilemma" (also known as the Doctrinal Paradox).
      *   **Core Questions:**
          1.  What does this presuppose about group belief? (Does "the court" have beliefs?)
          2.  Is the group being irrational (Valid + Breach + Not Liable)? Or is consistency only required for individuals?
