      *   **Key Concept:** The Doctrinal Paradox / Discursive Dilemma (Kornhauser & Sager).
      *   **Key Concept:** List-Pettit Theorem (Impossibility Theorem for Judgment Aggregation).
      *   **Key Concept:** Collective Intentionality (Gilbert, Searle, Tuomela).
      *   **Structure of Response:**
