answer: |-
  **Title:** The Locus of Variation: Pragmatic Encroachment and Epistemic Contextualism as Rival Explanations

  The analysis of knowledge ascriptions has been dominated in recent decades by attempts to explain why our willingness to attribute knowledge seems to fluctuate with practical circumstances. The classic "Bank Cases," introduced by Keith DeRose and refined by others, illustrate this: a subject seems to know a bank is open on Saturday when the stakes are low (no urgent need to deposit), but fails to know the same proposition when the stakes are high (a check must clear or disaster strikes). Two leading theories have emerged to explain this data: Epistemic Contextualism (EC) and Pragmatic Encroachment (PE). While both theories acknowledge the intuitive link between practical stakes and knowledge attributions, they offer fundamentally different accounts of the mechanism behind this link. This essay argues that EC and PE are best understood as rival theories rather than compatible ones. Although a hybrid view is logically conceivable, it is theoretically profligate and unstable, as the two theories offer mutually exclusive truth-conditional predictions in cross-contextual scenarios.

  Epistemic Contextualism posits that the semantic content of the verb "knows" is context-sensitive. Much like indexicals such as "I" or gradable adjectives like "tall," the standard of precision required for a true knowledge ascription shifts depending on the conversational context of the *attributor* (the person saying "S knows that p"). In a low-stakes conversation, the epistemic standard is low, making knowledge ascriptions easy to satisfy. In a high-stakes conversation—perhaps one where skepticism is salient or error possibilities are discussed—the standard rises. For the contextualist, the subject's epistemic position (evidence, reliability) remains fixed; what changes is the semantic bar they must clear. Thus, in the Bank Case, the sentence "Hannah knows the bank is open" is true when uttered in a low-stakes context but false when uttered in a high-stakes context, even regarding the same subject at the same time. Contextualists argue this preserves the invariant intuition that knowledge is a purely epistemic notion, shielding it from practical contamination by locating the variability in language rather than in the world.

  Pragmatic Encroachment, often associated with Subject-Sensitive Invariantism (SSI), offers a contrasting explanation. Proponents like Jason Stanley, Jeremy Fantl, and Matthew McGrath argue that the semantic meaning of "knows" is invariant; it does not shift with the attributor's context. However, they contend that whether a subject *possesses* knowledge depends in part on their practical environment. On this view, knowledge is not merely a function of truth, belief, and justification; it is also a function of "practical adequacy." If a proposition is to be known, it must be epistemically strong enough to warrant action. As the stakes for the *subject* rise, the epistemic position required to know becomes more demanding. Therefore, in the Bank Case, Hannah loses knowledge when her stakes rise, regardless of who is talking about her. For the pragmatic encroacher, practical factors do not just influence the conversation; they encroach upon the epistemic status itself.

  The primary argument for viewing these theories as rivals lies in their divergent predictions regarding the *locus* of variation. EC locates the variability in the attributor's context, while PE locates it in the subject's context. This divergence creates a direct truth-conditional clash in "cross-context" cases. Imagine a scenario where Hannah (the subject) faces high stakes (she will be ruined if the check doesn't clear), but she is being discussed by an attributor in a detached, low-stakes philosophical seminar. The attributor says, "Hannah knows the bank is open."

  According to EC, the attributor's context sets the standard. Since the seminar is low-stakes regarding the bank, the standard is low. Hannah has good evidence. Therefore, the ascription is **true**.
  According to PE, the subject's stakes determine the epistemic status. Hannah faces high stakes. Her evidence, while good, is not good enough for high-stakes action. Therefore, she does not know. The ascription is **false**.

  Because the two theories assign opposite truth values to the same sentence in the same possible world, they are logically incompatible as comprehensive theories of knowledge ascriptions. They cannot both be the *correct* explanation for the variability of knowledge claims, because they disagree on what makes those claims true.

  Defenders of a compatible or hybrid view might argue that knowledge ascriptions could be sensitive to *both* the attributor's context and the subject's stakes. On this "Subject-Sensitive Contextualism," the semantic standard shifts with the conversation, but the threshold for meeting that standard also fluctuates with the subject's practical situation. While logically coherent, this hybrid view suffers from significant theoretical vices. First, it violates Occam's Razor. Both EC and PE are designed to explain the same set of intuitions (the Bank Cases, lottery puzzles, skeptical pressure). If EC can explain the data by appealing to conversational standards, adding PE's stake-sensitivity is redundant. Conversely, if PE explains why we hesitate to attribute knowledge in high-stakes cases (because the subject literally lacks knowledge), EC's semantic shifting becomes unnecessary.

  Second, the hybrid view creates an unstable semantic machinery. If "knows" is sensitive to two independent variables (attributor context and subject stakes), it becomes difficult to predict when knowledge ascriptions are true. More damningly, it dilutes the explanatory power of both theories. The strength of EC is its ability to explain why *we* (the attributors) feel differently about knowledge in different conversational settings without impugning the subject. The strength of PE is its ability to link knowledge normatively to action. Combining them suggests that knowledge is simultaneously unstable in a way that makes it difficult to serve either function reliably.

  Furthermore, the motivations for the theories stem from different philosophical commitments that resist synthesis. Contextualism is often motivated by a desire to save knowledge from skepticism while maintaining that practical stakes are irrelevant to the *nature* of knowledge. It treats the stake-sensitivity intuition as a semantic illusion. Pragmatic Encroachment, conversely, takes the stake-sensitivity intuition literally, arguing that it reveals the true nature of knowledge as action-guiding. To accept both is to claim that the intuition is both an illusion (per EC) and a reality (per PE), which is contradictory.

  One might object that PE is a thesis about the *metaphysics* of knowledge, while EC is a thesis about the *semantics* of "knows," allowing them to coexist. However, since knowledge ascriptions aim to track the metaphysical property of knowledge, a divergence in truth conditions regarding that property implies a rivalry. If EC says the sentence is true because the standard is low, but PE says the subject lacks the property of knowledge because stakes are high, EC is effectively committed to the claim that one can "know" without satisfying the action-guiding requirements PE deems essential. This is a substantive disagreement about the necessary conditions for knowledge, not merely a linguistic one.

  In conclusion, Pragmatic Encroachment and Epistemic Contextualism are best understood as rival theories. While they share a common motivation in explaining the context-sensitivity of knowledge attributions, they propose mutually exclusive mechanisms for that sensitivity. Contextualism attributes the variation to the semantics of the attributor's language, preserving a purely epistemic conception of knowledge. Pragmatic Encroachment attributes the variation to the metaphysics of the subject's situation, integrating practical factors into the constitution of knowledge itself. The "cross-context" test demonstrates that they yield contradictory truth values, and a hybrid view introduces unnecessary complexity without resolving the fundamental tension. We must choose between a view where knowledge is linguistically slippery but practically pure (Contextualism), or one where knowledge is semantically stable but practically contaminated (Encroachment). They cannot both be right.
