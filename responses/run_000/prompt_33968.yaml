answer: |-
  ### Framing Note for the Interviewer

  **State of the Dialectic:**
  When Gilbert Ryle published *The Concept of Mind* (1949), the anti-intellectualist view (that knowing-how is a distinct capacity, not reducible to knowing-that) was the orthodoxy. This changed dramatically with Jason Stanley and John Williamson's 2001 paper, "Knowing How," which revived Intellectualism using tools from linguistics and epistemology.

  *   **Broadly Settled:** It is no longer accepted that Intellectualism is obviously false. The burden of proof is now shared. Both sides agree that knowing-how involves *some* relation to truth or success conditions.
  *   **Genuinely Contested:** The nature of the "Practical Mode of Presentation" (PMOP) is the central battleground. Anti-intellectualists argue this is a technical label that hides the very ability Ryle identified. Intellectualists argue it is a genuine cognitive state distinct from ability.
  *   **Emerging Consensus:** Many philosophers now occupy "intermediate" positions, granting that some know-how is propositional while admitting a residue of pure capacity (especially in animals or highly automated skills).

  **Advice for the Interview:**
  Do not treat the Intellectualist view as a stubborn refusal to admit the obvious (e.g., "But surely you can ride a bike without a theory!"). A sophisticated Intellectualist already has a technical answer for that. Your goal is to press on the *explanatory cost* of their answer. Does their machinery do any work, or does it just rename the mystery?

  ---

  ### Interview Questions

  #### I. The Regress Worry
  **Q1:** Ryle's original argument was that if intelligent action required contemplating a proposition, we would need a further intelligence to contemplate that proposition, leading to an infinite regress. Your view stops this regress by positing a "practical mode of presentation" for the proposition. But if this mode of presentation is not itself a piece of knowledge-that, isn't it functionally identical to the capacity Ryle described? In other words, haven't you solved the regress only by smuggling the anti-intellectualist's "ability" into the intellectualist's "proposition"?

  **Follow-up (Q2):** You will likely reply that the mode of presentation is a *way of thinking*, not a *way of acting*, and therefore doesn't trigger the regress. But if this "way of thinking" is inaccessible to consciousness and plays no role other than guaranteeing successful action, what prevents it from being an empty posit? If the only evidence for this practical mode is the successful action itself, aren't you simply defining the success condition as a mental state to save the theory?

  #### II. The Inarticulate Expert (The Luthier Case)
  **Q3:** My protagonist is a master luthier who can distinguish a resonant spruce top from a dead one by tapping it, yet she cannot articulate the acoustic properties that define the difference. You would say she possesses a tacit proposition: she knows *that* this tap is the way to identify resonant wood. But if the content of this proposition is completely inaccessible to her, what fixes its content? Is it the physical reality of the wood, or her internal state? If it's the physical reality, doesn't that make the "knowledge" a relation between her and the world that looks suspiciously like a non-propositional capacity?

  **Follow-up (Q4):** A standard reply is that possession of a proposition does not require the ability to articulate it, much like a child knows language rules without stating them. But in the child's case, we can infer the rules from their speech patterns. In the luthier's case, if she cannot state the rule, and the rule plays no conscious role in her decision, what constraint is there on attributing *any* specific proposition to her? If you can attribute *any* true proposition that correlates with her success, isn't the "knowledge-that" just a placeholder for "whatever causal mechanism produces this skill"?

  #### III. Animal Cognition
  **Q5:** Consider a beaver building a dam or a bird navigating a migration. These creatures display complex, flexible know-how. If know-how is a species of know-that, do we have to attribute propositional attitudes to these animals? If you say yes, you risk anthropomorphizing them with concepts they likely lack. If you say no, you imply they lack genuine know-how, which seems to break the evolutionary continuity between animal skill and human craftsmanship. Which horn of this dilemma do you accept?

  **Follow-up (Q6):** If you choose to attribute minimal propositions to animals to save the theory, you must explain what concepts a bird possesses when it navigates. If you choose to deny them know-how, you must explain why human skill is categorically different from animal skill when the neural mechanisms often look so similar. Does your view force us to draw a sharp metaphysical line where biology gives us a continuum? And if so, isn't that line drawn to protect the theory rather than to describe the world?

  #### IV. The Phenomenology of Fluent Action
  **Q7:** When my luthier is in a state of "flow"—varnishing or carving at the peak of her ability—she reports that her sense of self and explicit thought disappear. She acts without inner speech. You argue that phenomenology is an unreliable guide to metaphysics, much like our perception of color is unreliable to physics. But in physics, we can explain *why* the perception diverges from reality (e.g., wavelengths vs. qualia). Can you offer a positive explanation for *why* the mind systematically hides the propositional structure of skill during peak performance? Or do you simply bracket the first-person experience as irrelevant?

  **Follow-up (Q8):** If you bracket the phenomenology, you risk making the "knowledge-that" causally inert. If the proposition is present in the mind but the agent feels as though it is absent, and the action proceeds better when it feels absent, what work is the proposition actually doing? Is it a driver of the action, or is it a theoretical shadow cast by the action? If the latter, does it deserve to be called "knowledge" at all, rather than just a description we impose from the outside?

  #### V. Synthesis and Connections
  **Q9:** I want to connect the regress worry to the phenomenology objection. Your solution to the regress relies on the "practical mode of presentation" being a state that does not require further contemplation. But the phenomenology of flow suggests that during skilled action, *no* contemplative states are present at all. If the practical mode is a mental state, why does it vanish from experience exactly when the skill is most active? Does this suggest that the "practical mode" is actually a disposition that *disappears* into action, which is precisely what Ryle claimed?

  **Follow-up (Q10):** Finally, consider the inarticulate expert and the animal together. Both cases involve successful navigation of the world without accessible conceptual structure. You treat the human as having a tacit proposition and the animal (perhaps) as having none. But if the human cannot access the proposition either, what is the *relevant difference* that allows you to assign a truth-value to the human's state but not the animal's? Is the difference truly in the mind of the agent, or is it merely in our willingness to interpret the human *as if* they were reasoning?
