      *   *Ryle (1949):* KH is dispositions, KH is not KH + KT.
      *   *Regress:* Ryle's argument is that if intelligent action requires contemplating a rule, contemplating the rule requires intelligent action.
      *   *PMOP:* This is the technical fix. It's supposed to be a way of thinking that doesn't require further thought.
      *   *Critique:* Many (e.g., Noë, Poston) argue PMOP is just a label for the ability itself.
