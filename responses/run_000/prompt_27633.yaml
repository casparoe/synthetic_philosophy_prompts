answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Aggregation of Harms (The 'Dust Specks' Problem)
  **Date:** 24 May 2024
  **Parties:** The Proponent of Straightforward Aggregation ('The Aggregationist') and The Proponent of the Lexical Threshold ('The Thresholdist')

  ### 1. Accepted Claims and Common Ground

  1.  **Formulation of the Problem:** Both parties accept the standard formulation derived from Parfit's *Reasons and Persons*. The choice is between two outcomes:
      *   **Outcome A:** One distinct individual suffers intense, prolonged torture.
      *   **Outcome B:** A sufficiently large number ($N$) of distinct individuals each suffer a very mild discomfort (a 'dust speck' in the eye).
      *   Both parties agree that $N$ is variable and can be increased to any finite magnitude required by the Aggregationist's model, provided it remains logically coherent and does not violate physical impossibilities regarding population size.

  2.  **Scope and Stakes:** Both parties agree that this inquiry is axiological and normative, not pragmatic. We are not debating administrative feasibility, psychological adaptation, or the likelihood of such scenarios occurring in the actual world. The stakes concern the fundamental structure of moral value: specifically, whether 'better than' is a transitive relation that admits of trade-offs between severity and number across persons.

  3.  **Relevant Considerations:** Both parties regard the following as genuinely relevant to the dispute:
      *   The phenomenological quality of the harms involved.
      *   The moral significance of the 'separateness of persons'.
      *   Intuitive judgements regarding 'saving' one person from torture versus 'saving' a multitude from specks.
      *   The implications of the view for long-term population ethics and risk assessment.

  4.  **Excluded Distractions:** Both parties agree to set aside the following as distractions for the purpose of this specific collaboration:
      *   Epistemic uncertainty regarding the exact count of affected individuals.
      *   Secondary consequences (e.g., social unrest caused by the torture or the specks).
      *   Arguments relying solely on the vagueness of natural language terms like 'harm' without addressing the underlying normative structure.

  5.  **Acknowledgement of Opposing Strengths:**
      *   **The Aggregationist acknowledges:** The Thresholdist's view captures a powerful intuition that certain severe violations of integrity or welfare possess a qualitative gravity that mere summation of minor annoyances cannot capture. The Aggregationist concedes that their view risks implying a 'tyranny of aggregation', where the sheer volume of trivial complaints overrides the urgent needs of the worst-off.
      *   **The Thresholdist acknowledges:** The Aggregationist's view captures a powerful intuition that numbers must count for something. To claim that a trillion people suffering is *no worse* than a single person suffering (provided the single person's suffering is above the threshold) appears to neglect the moral significance of each additional victim. The Thresholdist concedes that their view risks implying an 'absolutism of severity', which can lead to counter-intuitive results in spectrum cases.

  ### 2. Table of Disagreements

  | Point of Disagreement | Formulation of Views | Crux / Sub-question | Test Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Structure of Value** | **Aggregationist:** Value is continuous and additive. Harms can be represented on a single cardinal scale where magnitude $\times$ number determines total disvalue.<br><br>**Thresholdist:** Value is discontinuous (lexical). Harms above a certain severity threshold belong to a higher order of disvalue that cannot be outweighed by any quantity of lower-order harms. | **Is the 'better than' relation continuous?**<br>Does there exist a smooth trade-off rate between severity and number, or are there 'moral gaps' where trade-offs become impossible? | **The Continuum Argument:**<br>Construct a chain of 1,000 harms, $H_1$ to $H_{1000}$, where $H_1$ is torture, $H_{1000}$ is a dust speck, and each adjacent pair is phenomenologically indistinguishable in severity.<br><br>**Aggregationist Prediction:** There is no non-arbitrary break point. If $N$ specks outweigh $H_{1000}$, and $H_{1000}$ is virtually identical to $H_{999}$, then $N$ specks must outweigh $H_1$. Transitivity holds.<br><br>**Thresholdist Prediction:** There must be a break point in the chain where the lexical threshold is crossed, even if the phenomenological difference between adjacent steps is imperceptible. Transitivity of 'outranking' fails at the threshold. |
  | **2. The Significance of Numbers** | **Aggregationist:** The moral weight of an outcome is the sum of the weights of individual experiences. If the sum of specks exceeds the weight of torture, the specks are worse.<br><br>**Thresholdist:** The moral weight is determined primarily by the worst-off individual's experience. Numbers only matter as tie-breakers within the same lexical category. | **Does the separateness of persons prevent aggregation across categories?**<br>Is the moral universe 'divided' by persons such that mild harms cannot be pooled to outweigh a severe harm to another? | **The Single-Person Iteration:**<br>Compare Outcome A (One person tortured for 1 hour) vs. Outcome C (One person receives $N$ dust specks over a lifetime, spread out).<br><br>**Aggregationist Prediction:** If $N$ is high enough, Outcome C is worse than Outcome A, even within a single life. This supports the additivity of harm itself.<br><br>**Thresholdist Prediction:** Outcome A remains worse than Outcome C regardless of $N$. If aggregation is rejected across persons due to severity, it should also be rejected within a person when the qualitative gap is sufficiently wide. |
  | **3. The 'Save One or Many' Intuition** | **Aggregationist:** In a rescue scenario, if we cannot save everyone, we should minimise total expected disvalue. If $N$ is large enough, we save the many from specks rather than the one from torture.<br><br>**Thresholdist:** We are obligated to prioritise the rescue of the individual facing the threshold harm (torture), regardless of the number facing the sub-threshold harm (specks). | **What is the correct decision procedure under scarcity?**<br>Does the duty to rescue track aggregate welfare or the urgency of the greatest individual need? | **The Forced Choice:**<br>A decision-maker must press one button. Button 1 saves one person from torture. Button 2 saves $N$ people from dust specks. They cannot do both.<br><br>**Aggregationist Prediction:** For sufficiently large $N$, a rational moral agent ought to press Button 2. Refusal to do so is an error of moral mathematics.<br><br>**Thresholdist Prediction:** A rational moral agent ought always to press Button 1. Pressing Button 2 constitutes a failure to respect the priority of the severe victim. |

  ### 3. Closing Note on Verbal vs. Substantive Dispute

  Following our initial series of workshops, we investigated whether the disagreement rested merely on divergent definitions of 'harm' or 'worse than'. We established a shared terminology wherein 'harm' refers to negative welfare impact and 'worse than' refers to impersonal moral badness.

  We conclude that while minor verbal ambiguities were present in our early exchanges (specifically regarding whether 'worse' implied 'to be prevented first' or 'contains more disvalue'), the core dispute is **substantive**. The disagreement persists even when definitions are aligned. It rests on a fundamental divergence in meta-ethical intuition regarding the continuity of value and the moral permissibility of trading severity for numbers. The Aggregationist maintains that denying the trade-off leads to irrational intransitivity; the Thresholdist maintains that accepting the trade-off leads to unacceptable moral conclusions. Neither side believes the other is merely speaking a different language; both believe the other is mistaken about the structure of value itself.

  ***

