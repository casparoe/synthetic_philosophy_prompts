prompt: |-
  I'm on the HR disputes panel at my company and we've got a case to decide before the end of the month. A middle manager told an engineer, in a hallway conversation, that she'd be promoted to senior at the next review cycle — no formal process, no sign-off from the comp team, nothing in writing. The engineer relied on it hard: she turned down a higher-paying offer from another firm and started taking on senor-level projects on the strength of the promise. Now the company's line is that the manager had no authority to make that kind of commitment and that informal hallway promises don't bind the institution, so the engineer is owed nothing and the promotion just goes back into the normal queue.

  I was arguing about this with my friend for most of last night and we went in circles. She thinks a promise binds because the promisor commits her own will and that's the end of it, I think it only binds to the extent the promisee actually relies on it, and neither of us could land on what happens when the promisor was an agent who never had the authority to make the commitment in the first place. That last bit is what I keep coming back to and I don't think either of us has a good answer.

  Can you draft the panel's written decision memo — honor the promise, deny it, or split the difference with some concrete remedy — with a clear bottom line the company could actually act on. I want the reasoning to genuinely engage both the reliance account and the commitment/consent account of why promises bind, and I'd rather you take the company's strongest argument (that being bound by unauthorized informal promises would wreack the formal process and set a bad precedent for every manager who overpromises) seriously instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** HR Disputes Panel Member.
      *   **Task:** Draft a written decision memo for a specific case.
      *   **Case Facts:**
          *   Middle Manager (MM) told Engineer (E) she'd be promoted to Senior in the next cycle.
          *   Context: Hallway conversation, informal, no written sign-off, no Comp team approval.
          *   Engineer's Action: Relied on promise (turned down higher-paying outside offer, took on Senior-level projects).
          *   Company's Stance: MM lacked authority; informal promises don't bind the institution; promotion goes back to queue; E owed nothing.
      *   **Philosophical Conflict:**
          *   Friend's View (Commitment/Consent): A promise binds because the promisor commits their will.
          *   User's View (Reliance): A promise binds to the extent the promisee relies on it.
          *   Key Sticking Point: Agency/Authority (What happens when the promisor lacks authority?).
      *   **Requirements:**
          *   Clear bottom line (Honor, Deny, or Split/Remedy).
          *   Actionable for the company.
          *   Reasoning must engage both philosophical accounts (Commitment vs. Reliance).
          *   Must seriously address the Company's strongest argument (Administrative chaos/precedent risk).

  2.  **Determine the Outcome:**
      *   *Option A: Honor the Promotion.* Risks undermining formal comp structures. Sets precedent that hallway talks override policy. Hard to justify if MM truly lacked budget/headcount authority.
      *   *Option B: Deny Everything.* Legally defensible (likely), but morally hazardous. Punishes the employee for trusting a company representative. Ignores detrimental reliance. Damages trust culture.
      *   *Option C: Split/Remedy.* Acknowledges the breach of trust without breaking the comp structure. Compensates for the reliance loss (the turned-down offer) and acknowledges the work performed, without necessarily forcing a title change that bypasses the committee.
      *   *Decision:* Option C is the most balanced and actionable. It respects the formal process (Company's concern) while addressing the harm done to the employee (Reliance/Commitment concern). Let's aim for a "Retroactive Adjustment + Bonus" or "Expedited Review + Compensation for Loss."
      *   *Refined Decision:* Grant the promotion *if* criteria are met (retroactive review), but more importantly, compensate for the *financial loss* incurred due to reliance (the difference in the outside offer) and acknowledge the manager's failure. Actually, a "Split" is safer for the panel. Let's go with: **Deny the automatic promotion (uphold process) BUT grant a significant one-time retention bonus and expedite the next review cycle.**
      *   *Wait, looking closer at the prompt:* The prompt asks to "honor the promise, deny it, or split the difference."
      *   *Better Approach:* If the engineer *already* took on senior-level projects, she might have *earned* it. But the core issue is the *promise*.
      *   *Best Equitable Remedy:* Acknowledge the promise created an obligation due to reliance, but acknowledge the authority limit. The remedy should make the engineer whole for the reliance loss, without validating the manager's authority to bypass HR.
      *   *Decision:* **Split the Difference.** Do not automatically grant the title (preserves process), but compensate for the detrimental reliance (financial loss) and guarantee an expedited, good-faith review.

  3.  **Drafting - Structure of a Decision Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Decision:** The bottom line up front.
      *   **Facts of the Case:** Brief summary.
      *   **Analysis/Reasoning:**
          *   The Authority Argument (Company's stance).
          *   The Commitment Argument (Friend's stance).
          *   The Reliance Argument (User's stance).
          *   Synthesis/Resolution.
      *   **Directives/Action Items:** What actually happens next.

  4.  **Drafting - Content & Reasoning (Iterative Process):**
      *   *Addressing Authority:* The company is right that managers can't unilaterally set comp. If they could, budget control vanishes. This is the "Institutional Integrity" argument.
      *   *Addressing Commitment:* A promise is a speech act. But in a corporation, speech acts require agency. The MM spoke *as if* they had agency. This is "Apparent Authority."
      *   *Addressing Reliance:* The engineer changed her position based on the statement. This is "Detrimental Reliance" (Promissory Estoppel concept).
      *   *Synthesis:* We cannot validate the unauthorized act (the title), but we cannot ignore the harm caused by the agent's representation. The company is liable for the *harm*, not necessarily the *specific performance* of the promise.
      *   *Tone:* Professional, adjudicative, empathetic but firm on policy.

  5.  **Refining the Philosophical Engagement:**
      *   Need to explicitly mention the "Commitment/Consent" view (the promise itself creates the bond) vs. the "Reliance" view (the harm creates the bond).
      *   Need to show how "Authority" limits both. A promise without authority is defective consent. Reliance without authority is risky.
      *   *Key Insight:* The company is responsible for the *appearance* of authority it grants its managers. If a manager looks like they can promise, the company bears some risk when they do.

  6.  **Developing the Remedy:**
      *   *Title:* Not automatic. Must go through review. *However*, the review must consider the work already done.
      *   *Money:* The engineer turned down a higher offer. The company should bridge that gap for the period of reliance. A one-time equity or cash adjustment.
      *   *Manager:* Needs coaching/discipline (not part of the memo to the employee, but part of the internal decision).
      *   *Policy:* Clarify communication channels.

  7.  **Final Review against Constraints:**
      *   Clear bottom line? Yes.
      *   Engage reliance account? Yes.
      *   Engage commitment account? Yes.
      *   Take Company's "chaos" argument seriously? Yes.
      *   Actionable? Yes.

  8.  **Writing the Memo:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like a lawyer giving legal advice. I am an HR Panel member. Keep it internal policy-focused, though using legal concepts as reasoning analogies.
      *   *Correction:* Ensure the distinction between "binding the institution to the title" vs "binding the institution to make the employee whole" is clear.
      *   *Emphasis:* Highlight that the Manager's lack of authority doesn't absolve the company of the *consequences* of the Manager's actions.

  9.  **Final Polish:** Check tone. Ensure it sounds like a decisive document. (Proceed to generate output).

  *(Self-Correction on the "Decision"):* If I deny the promotion entirely, it feels like a betrayal given she did the work. If I grant it entirely, it undermines HR. The "Split" is: **Expedited Review (high likelihood of success) + Compensation for Reliance Loss.** Actually, let's be bolder. If she *did* the work, she deserves the title. The promise was the trigger, the work is the justification. But the prompt focuses on the *promise*. Let's stick to the reliance remedy.
  *Revised Decision:* **Deny the automatic promotion (uphold process) BUT award a one-time retention bonus equivalent to the foregone outside offer differential and guarantee a priority review cycle.** This splits the difference perfectly.

  *Wait, one more nuance:* The prompt asks to engage the "Commitment/Consent" account. I need to make sure I explain *why* that doesn't fully win here (lack of agency) but also why it's not irrelevant (apparent authority).

  *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Chief People Officer, VP of Engineering, Compensation Committee
  **FROM:** HR Disputes Resolution Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Case #23-09 (Promotion Eligibility & Detrimental Reliance)

  ### 1. Executive Summary & Decision

  The Panel has reviewed the dispute regarding the Engineer's claim to a Senior title promotion based on an informal commitment made by their Middle Manager (MM).

  **The Panel's Decision is as follows:**
  1.  **Promotion Status:** The automatic promotion is **not granted** at this time. The formal review process must be respected to maintain compensation integrity. However, the Engineer's review cycle is **expedited** to the immediate current window, and the work performed at the Senior level during the reliance period must be weighted heavily toward qualification.
  2.  **Financial Remedy:** The Company will issue a **one-time retention bonus** equivalent to the differential between the Engineer's current salary and the outside offer they declined, calculated for the duration of the reliance period (6 months).
  3.  **Managerial Accountability:** The MM will undergo remedial training on authority limits and communication protocols.

  ### 2. Statement of Facts

  *   **The Representation:** The MM verbally assured the Engineer of a promotion to Senior level in the next cycle.
  *   **The Authority:** The MM did not have budgetary authority or final sign-off capability to bind the Company to this promotion without Compensation Committee approval.
  *   **The Reliance:** The Engineer declined a competing offer with higher compensation and assumed Senior-level responsibilities based on this assurance.
  *   **The Conflict:** The Company asserts the promise is void due to lack of authority. The Engineer asserts the promise is binding due to reliance and commitment.

  ### 3. Reasoning & Analysis

  The Panel recognizes this case hinges on three competing philosophical and operational frameworks: Institutional Authority, Commitment/Consent, and Detrimental Reliance. We address each below.

  #### A. The Institutional Authority Argument (The Company's Position)
  The Company argues that binding the institution to unauthorized informal promises creates administrative chaos. If hallway conversations could override formal compensation bands and approval workflows, budget control would evaporate. Managers would be incentivized to overpromise to retain talent, leaving HR to clean up the fiscal fallout.

  **The Panel accepts this premise.** An organization cannot function if every agent's casual speech acts as a binding contract. There must be a distinction between *personal assurance* and *institutional commitment.* To rule otherwise would undermine the formal governance structures that ensure pay equity and fiscal responsibility across the firm. Therefore, specific performance of the promise (automatic title change) cannot be granted solely on the word of the MM.

  #### B. The Commitment/Consent Argument (The Moral Obligation)
  The counter-argument is that a promise is a speech act that binds the will of the promisor. When the MM spoke, they spoke as a representative of the Company. From the Engineer's perspective, the MM *was* the Company. To dismiss the promise as "unauthorized" is to hide behind a bureaucratic veil after benefiting from the trust the promise generated.

  **The Panel finds merit in this concern.** While the MM lacked *actual* authority, they possessed *apparent* authority. The Company empowers managers to lead career development; it is foreseeable that engineers will interpret career guidance as institutional commitment. When the Company grants a manager the *appearance* of authority but reserves the *right* to disavow it, the Company assumes a risk. We cannot accept the benefit of the Engineer's increased productivity (derived from the promise) while rejecting the burden of the promise itself.

  #### C. The Reliance Argument (The Harm Principle)
  The third view is that promises bind only to the extent that reliance makes them binding. The moral injury here is not necessarily the broken word itself, but the harm caused by the broken word. The Engineer changed their position materially (turning down higher pay) based on the Company's representation.

  **The Panel finds this decisive.** Even if the Company is not bound to the specific *title* (due to Authority constraints), it is bound to make the Employee whole for the *loss* incurred (due to Reliance constraints). To deny all remedy is to penalize the Employee for trusting a Company agent, which creates a culture of cynicism and risk-aversion.

  ### 4. Synthesis: The Equitable Remedy

  We must balance the need for process integrity against the obligation to remedy harm caused by our agents.

  1.  **Why we deny the automatic promotion:** Granting the title without review validates the bypass of the Compensation Committee. It sets a precedent that process can be circumvented by informal negotiation, which threatens long-term pay equity.
  2.  **Why we grant the financial remedy:** The Engineer suffered a quantifiable financial loss due to Detrimental Reliance. The Company is liable for the harm caused by its agent's apparent authority, even if the agent lacked actual authority. The bonus compensates for the "opportunity cost" the Engineer absorbed.
  3.  **Why we expedite the review:** The Engineer has already performed Senior-level work. While the *promise* didn't bind the title, the *work* binds the Company to evaluate that contribution fairly and immediately.

  ### 5. Directives & Action Plan

  **For Compensation:**
  *   Calculate the difference between the Engineer's current base salary and the declined outside offer.
  *   Issue a one-time lump sum payment equal to that monthly differential multiplied by the number of months since the promise was made.
  *   Process this as a "Retention & Adjustment Bonus," distinct from base salary.

  **For Career Progression:**
  *   HR Business Partner to schedule the Engineer's Senior-level review within 14 days.
  *   Review criteria must explicitly account for the Senior-level projects undertaken during the reliance period.
  *   If the Engineer meets the competency bar (which is expected, given the project assignment), the promotion is to be backdated to the original cycle discussed.

  **For Management Governance:**
  *   Update the Manager Handbook to explicitly define "Offer of Promotion" as a formal process requiring written Comp approval.
  *   Require all People Managers to sign an acknowledgment of authority limits regarding compensation and title changes by Q1.

  ### 6. Conclusion

  This decision rejects the notion that informal promises can bypass formal governance, preserving the Company's structural integrity. However, it simultaneously rejects the notion that the Company can disavow the consequences of its agents' representations. We honor the reliance without validating the unauthorized commitment. This restores the Engineer's financial standing, respects their contribution, and reinforces the necessity of formal process for future cases.

  **Approved by:**
  HR Disputes Resolution Panel
