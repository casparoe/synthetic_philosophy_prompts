prompt: |-
  I've been reading about the replication crisis on my own, without any statistics background, and I keep getting stuck on one detail. Imagine a researcher tests a treatment that has no real effect, using a test set up so that, in 5% of those no-effect runs, it will still flag the result as "significant" at p < 0.05. Now imagine she actually runs the experiment 20 times, and it comes out significant exactly once. I've read the standard explanation that the 5% rate describes the behavior of the procedure over many runs, not the probability that this particular run is a false alarm. But I can't reconcile that with why anyone treats a single p < 0.05 result as meaningful at all. Please explain the most important implications of this tension for how I should think about what one significant result actually tells me, and why the replication crisis is really about this point rather than about individual researchers being careless.
