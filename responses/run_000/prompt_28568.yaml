  It was not the flesh, but the shape that remained,
  I reach for the phone and remember she's lost.
  A dimmer version runs where the bright one reigned.

  I hear her objection before words have crossed,
  I know how she'd flinch at the terrible cost.
  It was not the flesh, but the shape that remained.

  The world keeps on turning, indifferent as most,
  I wear her laughter though my own I have tossed.
  A dimmer version runs where the bright one reigned.

  I wake to the silence, the window all frost,
  I wait for a message that never will post.
  It was not the flesh, but the shape that remained.

  I am by the memory completely engrossed,
  I hold both the comfort and grief, unopposed.
  A dimmer version runs where the bright one reigned.

  There is no resurrection, no body to host,
  The loop is still closing, though loosely composed.
  It was not the flesh, but the shape that remained,
  A dimmer version runs where the bright one reigned.
