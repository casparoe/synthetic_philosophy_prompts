      *   *Correction:* In Move 5, Maya's point about "why suffering vs. red" is actually a version of the "specificity" objection, but she frames it as a burden for the anti-realist. I need to clarify that evolution *does* explain the specificity for the anti-realist, whereas the realist needs to explain the specificity *plus* the truth.
      *   *Nuance:* Make sure to mention Sharon Street and Richard Joyce, as this is a grad seminar context. They will expect those names.
      *   *Tone Check:* Ensure I'm not just saying "Ravi is right." I need to show *why* within the metaethical landscape. Maya's intuition about the genetic fallacy is a very common student intuition that needs to be corrected gently but firmly.

  6.  **Final Polish:** Check against the prompt requirements (move-by-move, blind spots, final verdict). Ensure the distinction between ontological and epistemological claims is clear. (Proceed to generate output based on this structure.)

