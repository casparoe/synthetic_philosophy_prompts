  5.  **Drafting Section 3 & 4: Cruxes and Evidence:**
      *   What would actually change minds?
      *   *Crux 1: Structural Continuity.* (Worrall's Structural Realism middle ground). Does the math/structure stay while the ontology changes?
      *   *Crux 2: The "Working Posits" Distinction.* (Psillos). Can we separate the parts of the theory that do the work from the idle wheels?
      *   *Crux 3: The Base Rate.* (Stanford). Is the sample of past theories representative of current theories?
      *   *Crux 4: Theory Identity.* (The user's specific interest). When does Theory A become Theory B?
      *   *For each:* What case study? (Fresnel vs. Maxwell, Phlogiston, Caloric, Newton vs. Einstein). What does each side predict?

  6.  **Refining the "Theory Identity" and "Inductive PMI" points:**
      *   *Theory Identity:* This is a major source of "talking past." Realists often say "Electrons are real" (continuity). PMI says "Caloric was real to them, fake to us" (discontinuity). The agreement needs to acknowledge *referential continuity* vs. *ontological discontinuity*.
      *   *Inductive PMI:* The PMI uses induction to attack the reliability of induction (specifically IBE regarding truth). This is self-undermining *if* it claims *no* induction is reliable. But PMI proponents usually argue it's a *local* skepticism about scientific ontology, not global skepticism. The joint statement must clarify this distinction.

  7.  **Review and Polish:**
