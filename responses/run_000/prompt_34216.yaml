          3.  Cruxes (sub-questions where resolution forces a budge).
          4.  For each crux: Agreed-upon evidence/arguments and each side's prediction.
      *   **Specific Interests:** Theory identity across change, the inductive status of PMI itself.
      *   **Tone:** Professional, collaborative, philosophically precise but accessible (given the user's background).

  2.  **Deconstruct the Positions:**
      *   **Scientific Realism (SR):** Successful theories are likely approximately true (No Miracles Argument). Reference is preserved across theory change (e.g., electrons in Bohr vs. QM).
      *   **Pessimistic Meta-Induction (PMI):** Past successful theories were false (e.g., phlogiston, caloric). Therefore, current successful theories are likely false.
      *   **Common Ground:** Science works (predictively). History shows change. Truth is the goal (even if elusive).
      *   **Friction Points:** What counts as "success"? What counts as "the same theory"? Does "false" mean "wholly useless" or "ontologically wrong"? Is the sample size of history biased?

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish baseline facts.
      *   *History:* Theories change. Some past theories were empirically successful but are now rejected.
      *   *Success:* Predictive accuracy and instrumental reliability are undeniable.
      *   *Inference:* Realists use abduction/IBE (Inference to the Best Explanation). PMI uses induction.
      *   *PMI Scope:* PMI doesn't say science is useless, just that ontological claims are risky.
      *   *Theory Identity:* This is crucial per the prompt. They need to agree that *some* continuity exists but *some* discontinuity exists.
      *   *Induction:* Acknowledge PMI is inductive. Realists accept induction works generally but doubt its application here.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to phrase these so neither side feels straw-manned.
      *   *Column 1:* The Issue.
      *   *Column 2:* Realist Stance.
      *   *Column 3:* PMI Stance.
