      *   **Task:** Audit the analogy. Create a correspondence table (map the terms). Identify where the mapping breaks (disanalogies). Analyze what the analogy quietly imports (framing effects). Evaluate if the friend's conclusion survives. Suggest better analogies or critique the analogy strategy itself.
      *   **Tone:** Analytical, philosophical, validating but rigorous.

