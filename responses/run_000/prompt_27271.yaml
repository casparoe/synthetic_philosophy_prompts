      *   *Epistemic Certainty:* Surgeons have high certainty about the procedure's outcome (based on science). Politicians have low certainty (complex systems, unintended consequences).
      *   *Nature of the "Cut":* Cutting skin heals. Lying erodes trust (the very medium politics operates in). The "scalpel" damages the "operating theater."
