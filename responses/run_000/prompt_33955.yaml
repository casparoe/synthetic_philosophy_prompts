  **MEMORANDUM**

  **TO:** Dean of Faculty, Sarah Jenkins
  **FROM:** Dr. Alan Reston, Chair, Academic Integrity Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Case #23-409 (Student: J. Doe, Course: PHIL 305)

  ### 1. Executive Summary

  The Academic Integrity Panel has concluded its review of the alleged violation by Mr. Doe in PHIL 305 (Philosophy of Mind). The student was observed utilizing an unauthorized spiral notebook containing condensed course readings during a closed-book examination. 

  The Panel is evenly divided regarding the outcome. The defense rests on the *Extended Mind Thesis* (EMT), arguing that the notebook constitutes a functional part of the student's cognitive apparatus and thus should be treated as biological memory, which is permitted. 

  **Recommendation:** The Panel recommends **upholding the finding of a violation** regarding the exam protocol, but **waiving all academic penalties** (grade reduction, transcript notation). The student will receive a formal written warning placed in his internal disciplinary file. The exam grade will stand as written.

  This decision affirms the university's authority to set assessment boundaries while acknowledging the intellectual good faith and philosophical sophistication of the student's defense.

  ### 2. Engagement with the Extended Mind Defense

  We have reviewed the student's written submission and consulted with the course instructor. We accept the premise that the student's argument is not mere sophistry. The *Extended Mind Thesis* (Clark & Chalmers, 1998), specifically the "Otto and his Notebook" analogy, posits that if an external artifact functions reliably as a resource for memory and retrieval, it is functionally equivalent to biological memory. To privilege the skull as the boundary of the mind is, as the student notes, a form of "bio-neural chauvinism."

  The student's application of this theory is rigorous. He did not attempt to hide the notebook; he placed it openly on the desk, signaling that he did not view its presence as deceptive. Furthermore, the course instructor confirmed that the notebook contained synthesized summaries of readings, not pre-written answers to specific exam questions. This suggests the student was using the notebook as a cognitive scaffold, consistent with the EMT framework, rather than as a conduit for information he did not possess.

  However, the Panel distinguishes between **ontological claims** (what *is* memory?) and **constitutive rules** (what counts as memory *within this specific practice*?).

  An examination is a "speech act" with defined boundaries. When a syllabus designates an exam as "closed-book," it establishes a constitutive rule for that specific activity. It does not make a metaphysical claim about the nature of cognition; it makes a pedagogical claim about what is being measured. In this context, "memory" is operationally defined as *neural recall*. This is not a denial of the EMT; it is a delimitation of the assessment's scope. Just as a chess tournament may prohibit digital clocks even if they tell time more accurately than analog ones, an exam may prohibit external storage even if it functions like memory. The rule is not about the nature of the mind, but about the standardization of the metric.

  Therefore, the university is not taking an official stance against the Extended Mind Thesis. We are taking a stance on the standardization of assessment. To rule otherwise would render the "closed-book" designation meaningless, as any external aid could be redefined as "extended cognition."

  ### 3. Rationale for Mitigated Sanction

  While we uphold the violation based on the breach of constitutive rules, we recommend waiving the standard penalties (grade nullification or course failure) for three reasons:

  1.  **Absence of Deceptive Intent:** Academic integrity violations generally presuppose an intent to gain an unfair advantage through deception. Mr. Doe's open placement of the notebook and his immediate citation of the EMT upon confrontation suggest he was testing a philosophical boundary, not attempting to hide ignorance.
  2.  **Pedagogical Alignment:** The notes were condensed syntheses of course material. The pedagogical goal of the exam—to ensure engagement with and understanding of the readings—was arguably met, even if the mode of retrieval violated protocol.
  3.  **Intellectual Risk-Taking:** As noted by the course instructor, the argument demonstrates a level of engagement with course material that exceeds standard expectations. Punishing this severely risks signaling that philosophical reasoning is welcome only when it remains theoretical and has no practical consequences.

  ### 4. The Strongest Objection to This Recommendation

  We must be candid about the vulnerability of this decision. The strongest objection comes from the principle of **Equal Application of Rules**.

  By waiving the penalty, we risk establishing a precedent where articulate students with knowledge of specific course theories can exempt themselves from general assessment protocols. If a student in a Physics exam argued that a formula sheet was an "external hard drive" for their brain, we would rightly reject it. By treating this case differently, we may appear to be privileging the Humanities/Cog-Sci context over STEM, or privileging eloquent rule-breaking over compliance. 

  Critics on the Panel argue that this decision effectively tells the student body: *"The rules apply to you, unless you can construct a metaphysically sound argument for why they shouldn't."* This undermines the administrative consistency required for degree integrity. It places the burden on instructors to anticipate philosophical loopholes in every exam instruction, shifting focus from pedagogy to legalistic defense of assessment design.

  We acknowledge this risk. However, we believe it is mitigated by the specificity of this case. This waiver is granted based on the *unique convergence* of the course topic (Philosophy of Mind), the specific theory taught (EMT), and the non-deceptive manner of the breach. It is not a broad exemption for "extended mind" claims in other contexts (e.g., Biology or History), where the link between the artifact and the cognitive process is less central to the curriculum.

  ### 5. Policy Recommendations

  To prevent recurrence and clarify the university's position, we recommend the following:

  1.  **Curricular Clarification:** Instructors, particularly in philosophy and cognitive science, should explicitly address the *constraints of assessment* when teaching the Extended Mind Thesis. They should clarify that while EMT may be metaphysically plausible, the *assessment protocol* operationalizes cognition biologically for measurement purposes.
  2.  **Exam Language:** Syllabi should move beyond "Closed Book" to more precise language, such as: *"No external aids, including notes, devices, or artifacts, regardless of their functional role in your cognitive process."*
  3.  **Panel Precedent:** This case should be cataloged as a unique exception based on "Good Faith Philosophical Inquiry," not as a precedent for future unauthorized material cases.

  ### 6. Conclusion

  Mr. Doe violated the procedural rules of the examination. However, he did not violate the spirit of academic honesty. He engaged with the course material so deeply that he sought to apply it to the conditions of his own evaluation. 

  We recommend upholding the violation to maintain the integrity of assessment protocols, but waiving the penalty to honor the integrity of intellectual inquiry. This threads the needle: it affirms that rules matter, but that wisdom matters more.

  Respectfully submitted,

  **Dr. Alan Reston**
  Chair, Academic Integrity Panel
