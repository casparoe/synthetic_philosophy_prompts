prompt: |-
  I've been working my way through the classical Chinese debates on human nature, and I keep finding myself dissatisfied with how they're presented in introductory courses and secondary sources. The standard line is that Mencius held that human nature is good and Xunzi held that human nature is bad, full stop — as if they were just asserting contrary temperaments and leaving it at that. But when I read the primary texts in translation, it seems to me that they're operating with different conceptions of what "nature" (xing) even means, and that their disagreement might be less straightforward than it appears. Mencius seems to mean something like the inherent trajectory of a thing when it develops properly — hence the sprout metaphors and the insistence that the four virtues are present in incipient form from the start — while Xunzi seems to mean something closer to the raw, untutored material we begin with, our spontaneous inclinations before ritual and education reshape them. If that's right, then they might not even be contradicting each other directly; they might be talking past each other about different referents of the same word. But I'm not fully confident in this reading, and I'd like to see it stress-tested.

  I'd like you to write a dialogue between Mencius and Xunzi in which they try to figure out whether their disagreement about human nature is substantive or merely verbal — and, if it turns out to be substantive, to locate exactly where they part ways. Both characters should be equally competent and intellectually honest; neither should be a strawman, and neither should be given obviously weaker arguments than the other. The dialogue should contain real back-and-forth, with each responding to the other's actual points rather than talking past each other. Set the dialogue in a plausible historical context (say, they meet at a gathering of scholars in one of the Warring States courts), but don't let the setting overwhelm the argument. If one of them would plausibly concede a point under pressure, let that happen — but don't force a resolution if the underlying disagreement is genuine.

  Please structure your response as follows:

  **Dialogue** (roughly 800–1200 words): The conversation itself, with clear speaker labels and enough stage direction to track the flow of the exchange.

  **Diagnosis** (roughly 300–400 words): After the dialogue, step back and analyze what the exchange reveals. In particular: (a) identify the point, if any, at which the disagreement bottoms out in a clash of substantive commitments rather than a difference in terminology or emphasis; (b) say whether either character's view shifts over the course of the conversation, and if so, how; and (c) comment on whether the remaining disagreement is one that could in principle be settled by empirical facts about human psychology, or whether it rests on a normative or conceptual choice that evidence alone cannot resolve.

  **A modern reader's take** (roughly 200–300 words): How might someone steeped in contemporary cognitive science and evolutionary psychology react to this debate? Would they find one side more congenial than the other, or would they diagnose the whole framing as confused? Be specific about which modern concepts or findings would be brought to bear — for example, work on moral foundations, dual-process theory, the evolution of cooperation, or developmental psychology.
