answer: |-
  This is an excellent exercise. You have correctly identified the tension in Tolstoy's *What is Art?* between his formal criteria (infectiousness, accessibility) and his moral/religious criteria (the "religious perception of the age"). Your compilation of his verdicts is accurate, and your test case ("We Shall Overcome") is a brilliant stress test for the theory.

  Here is how Tolstoy would likely adjudicate "We Shall Overcome," followed by a refinement of your principle and a proposal for a definitive settling case.

  ### 1. The Verdict on "We Shall Overcome"

  **Tolstoy would almost certainly classify this as True Art.**

  Here is how he would navigate the two objections you raised:

  **On Authorship (The Sincerity Objection):**
  You worry that Tolstoy requires an individual artist's sincerity, whereas this song is anonymous/folk. However, your own data contradicts this worry: you noted that Tolstoy praised **peasant songs and folk tales**.
  Tolstoy draws a sharp distinction between *professional* art (paid specialists creating for money/fame) and *folk* art (the spontaneous expression of a community's life). For Tolstoy, folk art is often *more* sincere than individual art because it is distilled through the lived experience of many people over time. The "artist" is the life of the people themselves. The fact that "We Shall Overcome" evolved from gospel and labor traditions would count in its favor, not against it. It proves the feeling was genuine enough to survive and mutate organically.

  **On Politics (The Religious Objection):**
  This is the harder hurdle. Tolstoy was an anarchist Christian who despised the State, nationalism, and partisan politics. He believed politics divides men, while religion unites them.
  However, Tolstoy made a crucial exception for art that exposes social injustice *if* it stems from Christian brotherhood rather than class hatred. This is why he praised ***Uncle Tom's Cabin***. He viewed Stowe's book not as a political pamphlet, but as a work of Christian love that made the reader feel the suffering of the enslaved.
  "We Shall Overcome" shares this DNA. Its roots are in the Gospel ("I'll Overcome Some Day"). Its demand is for recognition of human dignity, which aligns with Tolstoy's "religious perception of the age" (the unity of all men as sons of God).
  *   **The Caveat:** Tolstoy would scrutinize *how* it is sung. If it is sung as a threat ("We will crush you"), it becomes sectarian/counterfeit. If it is sung as a testament to endurance and universal brotherhood ("We shall overcome" as a spiritual truth), it passes. Given its usage in the Civil Rights movement (nonviolent resistance), Tolstoy would likely see it as an expression of Christian love in the face of persecution, much like the early martyrs.

  **Closest Analogue:**
  ***Uncle Tom's Cabin***. Both are works of "tendency" (they aim to change society), but Tolstoy forgives the tendency because the underlying emotion is compassion and the method is accessible to the common man.

  ### 2. Refining Your Principle

  You formulated the principle as: *Infectiousness + Universal Accessibility.*
  This is close, but it misses the specific *content* requirement that explains why he hated Beethoven but loved a peasant song.

  A more accurate formulation of Tolstoy's unifying principle is:
  **True Art is the sincere transmission of a feeling that unites humanity, accessible to the simplest person, in accordance with the highest religious consciousness of the time.**

  There are three filters, and a work must pass all three:
  1.  **Form:** Is it clear and infectious? (Beethoven fails here for Tolstoy; he found it confused).
  2.  **Audience:** Is it understandable by a peasant? (Symbolists fail here).
  3.  **Content:** Does the feeling promote the "brotherhood of man" (Christian unity) or does it promote exclusivity (lust, patriotism, pride, sectarianism)?

  This explains why he condemned his own *War and Peace*. It passed Form and Audience (mostly), but he came to believe it failed on Content: it was a game for the rich, glorifying war and aristocratic life, rather than promoting universal brotherhood.

  ### 3. The Settling Case

  To test whether you have truly grasped the distinction between "Moral/Universal" (which Tolstoy accepts) and "Political/Sectarian" (which he rejects), I propose you test him on **The Internationale**.

  **The Case:**
  *   **Infectiousness:** High. It moves crowds to tears and action.
  *   **Accessibility:** High. Simple melody, simple lyrics, sung by workers globally.
  *   **Authorship:** Known individual (Eugène Pottier), but adopted by the masses.
  *   **Content:** It is a song of class struggle ("Arise, ye prisoners of starvation," "The Internationale shall be the human race").

  **Why this settles the matter:**
  If your theory is just "Accessible + Moral + Infectious," *The Internationale* should be True Art. It fights for the poor and promotes a vision of human unity.
  However, Tolstoy would likely condemn it as **Counterfeit Art**.

  **Why?**
  Because for Tolstoy, the "religious consciousness" of Christianity requires non-resistance to evil and love of enemies. *The Internationale* is explicitly materialist and revolutionary; it calls for the overthrow of the oppressors. It divides the world into "us" (workers) and "them" (bourgeoisie).
  Tolstoy writes extensively against "patriotic" art because it divides Frenchmen from Germans. He would view Socialist art as dividing Workers from Owners. It is *sectarian* rather than *universal*.

  **The Prediction:**
  *   **"We Shall Overcome":** True Art (because its root is spiritual endurance and universal dignity).
  *   **"The Internationale":** Counterfeit Art (because its root is class warfare and materialist revolution).

  If Tolstoy accepts one and rejects the other, it proves that his theory is not merely about "good morals" or "accessibility," but specifically about **Christian Universalism**. If he accepts both, then his theory is broader (about any movement toward human solidarity). Given his writings on government and revolution in *The Kingdom of God Is Within You*, the former is much more likely.

  ### Summary for your Reading Group
  1.  **Verdict:** "We Shall Overcome" is True Art (Analogue: *Uncle Tom's Cabin* / Folk Songs).
  2.  **Correction:** Anonymous authorship is not a bug for Tolstoy; it's a feature of folk sincerity.
  3.  **Refined Principle:** Add "Religious Consciousness" (Universal Brotherhood) to your criteria of Accessibility and Infectiousness.
  4.  **Settling Case:** Test *The Internationale*. If Tolstoy rejects it despite its accessibility and moral aim, you have confirmed that his definition of "Good Feeling" is strictly non-violent, Christian Universalism, not general political justice.
