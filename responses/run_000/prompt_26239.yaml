      *   **Questions:** What would Tolstoy's verdict be? What's the closest analogue? Is the user's formulation of the principle correct? What further case would settle the matter?

  2.  **Deconstruct Tolstoy's Theory in *What is Art?*:**
      *   **Core Definition:** Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.
      *   **Three Criteria for "Good" Art:**
          1.  **Infectiousness:** The degree to which the receiver feels what the artist felt. (Depends on individuality, clarity, and *sincerity*).
          2.  **Accessibility/Universality:** Can the common man (the peasant) understand it? (Anti-elitist).
          3.  **Religious Consciousness:** This is the big one. The feeling transmitted must align with the "religious perception of the age." For Tolstoy's time, this meant Christian universal brotherhood/love.
      *   **Tolstoy on Politics:** He was an anarchist/Christian pacifist. He hated the State, nationalism, and partisan politics. He believed true religion transcends political boundaries. However, he loved *social* justice if it stemmed from Christian love (e.g., he praised *Uncle Tom's Cabin*).
      *   **Tolstoy on Authorship:** He values sincerity above all. Sincerity is an individual trait. However, he praises folk songs constantly. How does he reconcile this? He sees folk songs as the spontaneous expression of the *people's* life, which he considers more sincere than the contrived works of professionals. The "artist" in folk art is the community living the life, not necessarily a single composer.

  3.  **Evaluate "We Shall Overcome" against Tolstoy's Criteria:**
      *   *Infectiousness:* High. Moves crowds to tears/action.
      *   *Accessibility:* High. Simple melody, simple lyrics.
      *   *Religious Consciousness:* This is the pivot point.
          *   Does it promote "Universal Brotherly Love"? Yes, in the Civil Rights context, it was about human dignity and unity.
          *   Is it "Political"? Yes. Tolstoy distinguished between "Christian feeling" and "political program." If the song is about *overcoming oppressors* through struggle, Tolstoy might balk if it implies violence or state change. But if it's about *love conquering hate*, he might accept it.
          *   *Crucial Nuance:* Tolstoy praised *Uncle Tom's Cabin*. That is a political book (abolitionism). Why? Because he saw it as stemming from Christian love for the oppressed, not partisan maneuvering. He distinguishes between *sectarian* art (exclusive to a party) and *universal* art (unites all humans).
      *   *Authorship:* He praises folk songs. "We Shall Overcome" is a folk hymn evolved from gospel. He would likely view the collective evolution as a sign of its organic truth, not a lack of sincerity. The "sincerity" comes from the lived experience of the singers.

  4.  **Formulate the Verdict:**
      *   Tolstoy would likely **praise** it, *but* with a specific caveat regarding its religious vs. political framing.
      *   *Analogue:* *Uncle Tom's Cabin* is the strongest link. Both address oppression, both are accessible, both stem from a moral imperative. Folk songs are the other link.
      *   *The "Political" Objection:* Tolstoy hated nationalism (e.g., French anthems). But Civil Rights is different; it's about universal human rights, which aligns with his "Christian Brotherhood." If the song is sung as a prayer for unity, it passes. If sung as a weapon of class warfare, it fails. Given its gospel roots ("We shall overcome *some day*"), it leans towards the religious/patient end, which Tolstoy would like.

