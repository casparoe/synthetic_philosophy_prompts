      *   The "Political" worry is actually about *Exclusivity*. Does this feeling unite *all* men (even the oppressor, in theory, through repentance) or just *us vs. them*? Tolstoy wants art that makes the rich love the poor and vice versa.

  6.  **Select a "Settling Case":**
      *   To test the "Political vs. Religious" boundary, we need something clearly political but arguably moral.
      *   *Case:* The *Internationale* (Socialist anthem).
      *   *Why:* It's accessible, infectious, collective. But it is explicitly class-warfare ("Arise, ye prisoners of starvation"). Tolstoy rejected violent revolution and class hatred. He would likely condemn this as "sectarian" art, unlike "We Shall Overcome" which has a more spiritual/gospel tone.
