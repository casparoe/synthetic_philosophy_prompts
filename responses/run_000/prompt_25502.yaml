prompt: |-
  Draft the joint statement of an adversarial collaboration between a proponent of the Rietdijk–Putnam argument (who holds that special relativity forces the block-universe view, i.e., eternalism) and a resister of that argument (who holds that relativity is compatible with a privileged present, e.g., via a Lorentz-invariant foliation or a deflationary account of 'real'). The document should be something both could sign after a good-faith collaboration. It must include:

  1. A numbered list of claims both sides accept — about the formalism of special relativity, about what the Rietdijk–Putnam argument actually says, about what the no-go results (e.g., the nonexistence of a Lorentz-invariant equivalence relation that carves out a unique global 'now' from the Minkowski metric alone) do and do not rule out, and about what would count as settling the dispute.

  2. A disagreements table with columns: (a) the issue, (b) the eternalist's formulation of their own view, (c) the resister's formulation of their own view, each phrased so its own side would accept the wording. Issues should include at least: whether the relativity of simultaneity forces the conclusion that all events are equally real; whether 'real' or 'exists' must be cashed out in terms of simultaneity relations at all; and whether positing a physically undetectable preferred foliation is an admissible move or a desperate one.

  3. A list of cruxes — sub-questions such that settling them would move at least one side — and, for each crux, a concrete test, argument, or case both sides agree bears on it, with each side's prediction or assessment recorded in advance. At least one crux should engage the question of whether the Rietdijk–Putnam argument illicitly slides from 'there is a frame in which event E is simultaneous with event F' to 'event E is real for the observer at F,' and whether that slide can be blocked without abandoning the minimal presentist intuition that what is real is what is simultaneous with me.

  Keep the entire document under 900 words.
