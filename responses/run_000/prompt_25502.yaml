answer: |-
  # Joint Statement on Relativity and Ontology

  We, the undersigned, represent opposing views on the temporal ontology implied by Special Relativity (SR). Through adversarial collaboration, we affirm the following shared understandings and clarify our remaining disagreements.

  ### 1. Accepted Claims
  1.  **Formalism:** SR's mathematical formalism (Minkowski spacetime, Lorentz transformations) is empirically robust and universally accepted by both parties.
  2.  **RP Argument:** The Rietdijk–Putnam argument contends that if reality is frame-independent, the relativity of simultaneity precludes a unique, universal present, implying eternalism.
  3.  **No-Go Results:** We agree that no Lorentz-invariant equivalence relation isolates a unique global 'now' from the metric alone. However, this does *not* rule out non-invariant foliations or metaphysical accounts of presence that do not supervene on the metric alone.
  4.  **Settling Conditions:** Empirical data alone cannot settle this dispute; resolution depends on metaphysical principles regarding existence, theoretical virtue, and the interpretation of 'reality'.

  ### 2. Disagreements

  | Issue | Eternalist Formulation | Resister Formulation |
  | :--- | :--- | :--- |
  | **Simultaneity & Reality** | Relativity of simultaneity entails all events are equally real; no spacetime slice is ontologically privileged over another. | Simultaneity is frame-dependent, but ontological presence need not map to frame-dependent simultaneity relations defined by SR. |
  | **Definition of 'Real'** | 'Real' means existing within the 4D manifold; tense is perspectival, not fundamental. | 'Real' means presently existing; 'exists' is not reducible to spatiotemporal relations alone. |
  | **Preferred Foliation** | Positing a physically undetectable foliation is ad hoc, violates methodological naturalism, and is a desperate move. | An undetectable foliation is metaphysically coherent, empirically equivalent, and preserves the intuition of a moving present. |

  ### 3. Cruxes

  **Crux 1: The Reality Transfer Principle**
  *   **Sub-question:** Does the RP argument illicitly slide from 'there is a frame in which event E is simultaneous with event F' to 'event E is real for the observer at F'? Can this slide be blocked without abandoning the minimal presentist intuition that what is real is what is simultaneous with me?
  *   **Test/Argument:** Logical analysis of Putnam's premise: "If x is real now for me, and y is simultaneous with x in some frame, y is real now for me."
  *   **Eternalist Assessment:** The slide is valid. Denying this privileges one observer's frame, contradicting SR's spirit that no observer is special. Transitivity of reality across frames is required.
  *   **Resister Assessment:** The slide is invalid. 'Real for me' requires simultaneity in *my* rest frame (or a privileged frame), not *any* frame. The argument conflates coordinate simultaneity with ontological presence.

  **Crux 2: Theoretical Virtue vs. Manifest Image**
  *   **Sub-question:** Does SR + Eternalism explain more than SR + Presentism + Hidden Foliation?
  *   **Test/Argument:** Compare explanatory power regarding the 'passage' of time and ontological parsimony.
  *   **Eternalist Assessment:** Eternalism wins. It removes occult structure (the hidden foliation) fitting SR's geometry and avoids positing undetectable facts.
  *   **Resister Assessment:** Presentism wins. It preserves the manifest image of time without empirical cost; 'occult' structure is metaphysical, not physical, and parsimony should not sacrifice phenomenological truth.

  We sign this to acknowledge that while physics constrains metaphysics, it does not uniquely determine it.

  **Signed:**  
  ____________________ (Proponent)  
  ____________________ (Resister)
