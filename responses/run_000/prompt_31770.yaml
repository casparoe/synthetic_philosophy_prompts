answer: |-
  ### Session Plan: Origin Essentialism (50 Minutes)

  **Goal:** Students understand that numerical identity is fixed by specific biological origins (gametes), not by qualitative traits or social roles, and that this is a metaphysical necessity, not causal fatalism.

  **Prerequisites:** Basic intuition about "could have been otherwise" (contingency) vs. "could not have been otherwise" (necessity).

  ---

  ### 1. The Single Worked Example
  **The Scenario:** "You, originating from Specific Sperm $S$ and Specific Egg $E$."

  **What it must have:**
  *   **Specificity:** You must refer to the *particular* biological materials ($S$ and $E$), not just "your mother and father."
  *   **A Counterfactual:** A scenario where a *different* sperm $S^*$ fertilizes $E$ (or $S$ fertilizes $E^*$), resulting in a zygote $Z^*$.
  *   **Qualitative Indistinguishability:** stipulate that $Z^*$ develops into a person who is molecule-for-molecule identical to you (same name, memories, traits) to isolate *origin* from *properties*.

  **What it must lack:**
  *   **Social Context:** No mention of adoption, raising, or naming conventions.
  *   **Trait Variation:** Do not suggest the counterfactual person would look different or have different talents.
  *   **Twinning Complications:** Do not mention splitting zygotes (see Section 4).

  **Why NOT "Born to Different Parents":**
  Do not use the phrase "Could you have been born to different parents?" This invites the **Social/Genetic Conflation**. Students interpret "parents" as social caregivers (contingent) or as a vague genetic source (where they assume any sperm from Dad + any egg from Mom = You). You need to bypass the social role entirely and bypass the "pool of gametes" idea to hit the specific material cause. Using "parents" allows students to think, "Yes, I could have been adopted," which is true but irrelevant to origin essentialism. Using " gametes" forces the metaphysical question.

  ---

  ### 2. Sequence of Ideas (Dependencies)

  **0:00–0:05: Modal Review (The Tools)**
  *   **Concept:** Distinguish *Contingent* truths (could have been false) from *Necessary* truths (could not have been false).
  *   **Dependency:** Needed to understand the strength of the claim we are testing.
  *   **Activity:** Quick poll: "Is it contingent or necessary that you are sitting in this room?" (Contingent). "Is it contingent or necessary that 2+2=4?" (Necessary).

  **0:05–0:15: The Distinction (The Setup)**
  *   **Concept:** Separate *Social Origin* (who raised you) from *Biological Origin* (which gametes formed you).
  *   **Dependency:** Must happen before the thought experiment to prevent terrain fighting.
  *   **Action:** Introduce the Worked Example ("You from $S$ and $E$"). Explicitly state: "We are not asking if you could have been adopted. We are asking if *you* could have started from $S^*$ and $E$."
  *   **Head Off:** **The Parents Confusion.** Explicitly say: "When philosophers say 'origin,' we don't mean the people who changed your diapers. We mean the specific biological starting point."

  **0:15–0:30: The Thought Experiment (The Core Argument)**
  *   **Concept:** Numerical Identity vs. Qualitative Similarity.
  *   **Dependency:** Requires the Specific Gamete setup.
  *   **Action:** Walk through the Counterfactual. "Imagine $S^*$ fertilizes $E$. A person grows up who is exactly like you. Is that *you*?"
  *   **Head Off:** **Genetic Determinism / Trait Essentialism.** Students will say, "If they have my DNA, it's me." Correct this by stipulating the counterfactual person *has* your DNA/traits but emphasizes the *history* is different. The point is: Same traits $\neq$ Same person if origin differs.
  *   **Head Off:** **The "Different Traits" Slide.** Students often think, "If I came from different gametes, I'd just be shorter." Correct this: "Even if you were *exactly* the same height, it wouldn't be you."

  **0:30–0:40: The Modal Status (Necessity vs. Fate)**
  *   **Concept:** Conditional Necessity vs. Fatalism.
  *   **Dependency:** Requires acceptance of the Origin Thesis.
  *   **Action:** Explain *why* it's necessary. "It wasn't inevitable that you would exist. But *given* that you exist, it is inevitable that you came from $S$ and $E$."
  *   **Head Off:** **Fatalism.** Students hear "necessary" and think "destiny." Clarify: "This doesn't mean the universe planned you. It means 'you' is a label that only sticks to this specific origin story."
  *   **Head Off:** **Necessity vs. Fact.** Distinguish "It is a fact I came from $S$" (empirical) from "It is necessary I came from $S$" (metaphysical).

  **0:40–0:45: Edge Cases (Twinning)**
  *   **Concept:** Boundaries of the thesis.
  *   **Action:** **Explicitly Set Aside Monozygotic Twinning.**
  *   **Why:** Twinning creates a "One Origin, Two Individuals" case, which complicates the "Unique Origin" intuition you are building. For a 50-minute intro, this introduces more noise than signal.
  *   **Script:** "You might wonder about identical twins. That involves one zygote splitting. That's a complex biological edge case. For today, we are looking at the standard case where one zygote equals one organism. Don't let the twin exception break the rule we are testing."

  **0:45–0:50: Assessment (The Check)**
  *   **Concept:** Verification of understanding.
  *   **Action:** Ask the Final Question (see below).

  ---

  ### 3. Misconception Map & Intervention Points

  | Misconception | What it sounds like | Where to Head It Off | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **Parents vs. Gametes** | "But I could have been adopted!" | **Min 0:05–0:15** (The Setup) | Explicitly define "origin" as gametic material, not social caregivers. Ban the word "parents" in favor of "sperm/egg" during the argument. |
  | **Genetic Determinism** | "If the DNA is the same, it's the same person." | **Min 0:15–0:30** (Thought Experiment) | Stipulate qualitative indistinguishability. Force the choice: "Same traits, different start. Is it the same object?" |
  | **Trait Variation** | "I'd just be a different version of me." | **Min 0:15–0:30** (Thought Experiment) | Emphasize numerical identity. "We aren't asking if 'a person' would exist. We are asking if *you* would exist." |
  | **Fatalism** | "So it was destiny that I was born?" | **Min 0:30–0:40** (Modal Status) | Use the conditional formulation: "Necessarily (If you exist $\rightarrow$ you came from $S$)." Not "Necessarily (You exist)." |
  | **Fact vs. Necessity** | "We just know this because of science." | **Min 0:30–0:40** (Modal Status) | Distinguish empirical discovery (who your parents are) from metaphysical constraint (that they *had* to be). |

  ---

  ### 4. Final Assessment Question

  **The Question:**
  "Imagine a machine creates a perfect molecule-for-molecule duplicate of you right now, with all your memories. At the same time, imagine your parents had conceived a child five minutes later using a different sperm, who grew up to be exactly like you. In which case, if either, is the resulting person *you*?"

  **Good Answer:**
  "Neither is me. The duplicate lacks my causal history/origin, and the later-conceived sibling has a different biological origin. I am essentially tied to my actual starting point." (Shows grasp of Origin Essentialism over Psychological or Qualitative criteria).

  **Bad Answer:**
  "The duplicate is me because they have my memories, but the sibling isn't because they have different DNA." (Relies on psychological continuity or genetic determinism rather than origin).
  *OR*
  "The sibling is me because I was destined to be born to these parents." (Relies on Fatalism).

  Summary: The core misconception is conflating the metaphysical necessity of specific biological origins with the causal inevitability of existence or the sufficiency of qualitative similarity.
