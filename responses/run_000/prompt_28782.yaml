answer: |-
  # The Ontology of Features: A Decision Tree for Mechanistic Interpretability

  ## Introduction: The Stakes of the Map

  Mechanistic interpretability (MI) operates on a tacit metaphysical assumption: that inside a neural network, there are *things* (features, circuits, neurons) that *stand for* things (concepts, tokens, world states), and that our job is to find them. But this assumption is not neutral. It dictates whether we view interpretability as **archaeology** (digging up pre-existing structures) or **cartography** (imposing a useful grid on continuous terrain).

  The decision tree below does not merely catalogue existing views; it argues for a specific topology of the debate. I contend that the primary fault line is not "Realism vs. Anti-Realism" in the abstract, but **Stance-Independence vs. Stance-Dependence**. The second fault line is **Determinacy vs. Indeterminacy**. Many debates in the literature (e.g., "are features polysemantic?") are downstream consequences of these deeper commitments.

  This tree is designed for the practitioner who knows what a basis rotation is but hasn't asked what it implies about truth.

  ---

  ## The Decision Tree

  ### Question 1: The Stance-Independence Test
  **Consider a trained network in isolation (weights and activations fixed, no external users or tasks). Do specific activation patterns count as representations *in virtue of the network's physical/mathematical facts alone*, or do they require an external interpreter (a human analyst, a downstream task, an evolutionary history) to constitute them as representations?**

  *   **(A) Yes, they are representation-bearing in virtue of internal facts alone.**
      *   *Commitment:* Representations are intrinsic properties of the mechanism. Interpretability is a discovery process.
      *   *Go to Question 2.*
  *   **(B) No, they require an external interpreter or stance to constitute them as representations.**
      *   *Commitment:* Representations are relational or pragmatic. Interpretability is a construction or projection process.
      *   *Go to Question 3.*

  ---

  ### Question 2: The Determinacy Test (For Stance-Independents)
  **Given the internal physical facts (weights/activations), is there a single, factually correct decomposition of the network into features/content, or is the representational structure fixed while the specific feature basis (the "vocabulary" of neurons/directions) is underdetermined by the physics?**

  *   **(A) There is a single, factually correct decomposition.**
      *   *Commitment:* There is a "One True Basis." Polysemanticity is a bug or a confusion to be resolved by better methods (e.g., finding the true latent causes).
      *   *Leaf:* **Strong Realism**
  *   **(B) The structure (e.g., subspaces) is fixed, but the specific feature basis is underdetermined (e.g., due to rotational symmetry).**
      *   *Commitment:* The *relations* are real, but the specific *features* we name are contingent on our choice of basis within the real subspace.
      *   *Leaf:* **Structural Realism**

  ---

  ### Question 3: The Truth-Aptness Test (For Stance-Dependents)
  **If representations depend on an interpretive stance, are claims like "Neuron 54 represents 'dog'" *true relative to that stance* (describing a real pattern visible from that perspective), or are they *strictly false* (the network has no representations, but the claim is a useful shorthand)?**

  *   **(A) They are true relative to the stance.**
      *   *Commitment:* Representations are real patterns, but their individuation is relative to the observer's granularity and goals. There is no "view from nowhere," but the view from *here* yields truth.
      *   *Leaf:* **Dennett-style Intentional-Stance Realism**
  *   **(B) They are strictly false (not truth-apt), but the talk is retained for utility.**
      *   *Commitment:* Representation talk is a fiction. We speak *as if* there are features, but strictly speaking, there are only vectors and dynamics.
      *   *Go to Question 4.*

  ---

  ### Question 4: The Normative Test (For Fictionalists)
  **Is representation talk a harmless or necessary heuristic for managing complexity, or is it an active obstacle to scientific understanding that should be purged from our ontology?**

  *   **(A) It is a harmless/necessary heuristic.**
      *   *Commitment:* We cannot do without the abstraction. It compresses information effectively for human engineers.
      *   *Leaf:* **Instrumentalism**
  *   **(B) It is an active obstacle.**
      *   *Commitment:* Representation talk anthropomorphizes the math and misleads research. We should describe mechanisms purely in terms of dynamics, information flow, and optimization landscapes.
      *   *Leaf:* **Eliminativism**

  ---

  ## Mapping the Positions

  ### 1. Strong Realism (Yes → A)
  *   **The View:** The network contains determinate symbols or features waiting to be found. If two interpreters disagree on what a neuron represents, at least one is wrong.
  *   **MI Manifestation:** The search for "monosemantic features" (e.g., Sparse Autoencoders aiming for the "true" latent factors). The assumption that there is a "ground truth" dictionary.
  *   **Philosophical Cost:** Must explain how high-dimensional, superposed vectors map to determinate content without invoking an interpreter (the "Basis Problem").

  ### 2. Structural Realism (Yes → B)
  *   **The View:** The network's causal structure is real and mind-independent, but the specific "features" we extract are basis-dependent projections of that structure. The *subspace* is real; the *axes* are not.
  *   **MI Manifestation:** Acknowledging rotational invariance in activation spaces. Focusing on linear subspaces or manifolds rather than individual neurons or directions.
  *   **Philosophical Cost:** Must explain how we can have knowledge of "structure" without knowledge of the "relata" (the specific features).

  ### 3. Dennett-style Intentional-Stance Realism (No → A)
  *   **The View:** Representations are real patterns, but they only exist relative to a stance (a set of goals, a vocabulary, a predictive strategy). There is no stance-transcendent fact about whether a neuron represents "dog," but relative to the "human interpretive stance," it is objectively true that it does.
  *   **MI Manifestation:** Treating features as "user-interface objects" that are objectively valid for humans interacting with the model, without claiming they exist in the silicon independently of that interaction.
  *   **Philosophical Cost:** Risks collapsing into Instrumentalism if the "truth relative to stance" is not carefully distinguished from "useful fiction."

  ### 4. Instrumentalism (No → B → A)
  *   **The View:** Networks do not represent. They transform vectors. Calling a direction a "feature" is a useful lie that helps engineers debug the system.
  *   **MI Manifestation:** Using feature visualization solely for debugging performance, while denying that the visualized image is "what the network sees."
  *   **Philosophical Cost:** Cannot explain why interpretability methods work *so well* if they are purely fictional. Risks making the success of MI miraculous.

  ### 5. Eliminativism (No → B → B)
  *   **The View:** Representation talk is cognitive pollution. It imports folk-psychological categories into a domain where they do not apply. We should speak only of gradients, loss landscapes, and activation dynamics.
  *   **MI Manifestation:** Rare in practice. Might appear in radical connectionist critiques or purely dynamical-systems approaches to AI safety that reject "feature" talk entirely.
  *   **Philosophical Cost:** Makes communication with the broader scientific community difficult; discards a highly compressed vocabulary.

  ---

  ## Logical Space Analysis

  ### Unoccupied Regions

  **1. The "Determinacy without Independence" Gap (No → A variant)**
  *   *Description:* A view where representations depend on an interpreter (Stance-Dependent), but once the stance is fixed, the content is *uniquely determined* (Determinacy).
  *   *Status:* **Unexplored / Unstable.**
  *   *Analysis:* This region is logically possible but philosophically precarious. If you admit an interpreter is required (No to Q1), you usually admit that different interpreters could carve the world differently (leading to Dennett). If you claim the stance fixes content uniquely, you are effectively smuggling Strong Realism back in via the "Stance." Most who hold this view collapse into Strong Realism (the stance is just "Ideal Observer") or Dennett (the stance allows variance).

  **2. The "Real Structure, Fake Content" Gap (Yes → B → Instrumentalism)**
  *   *Description:* The physical structure is mind-independent (Yes to Q1), but we treat the features as fictions (Instrumentalism).
  *   *Status:* **Incoherent.**
  *   *Analysis:* If you answer Yes to Q1, you commit to representations being intrinsic. You cannot then claim representation talk is fictional (Q3-B) without contradiction. If the representation is intrinsic, the talk is either true (Realism) or false (Eliminativism), but not "usefully false" in the Instrumentalist sense, because the ontology is already fixed. This region collapses into Eliminativism (if you think the intrinsic facts don't support representation) or Structural Realism (if you think they support structure).

  ### Indistinguishable Positions

  **Structural Realism vs. Dennett-style Realism**
  *   *The Overlap:* Both views agree that there is no "One True Basis" for features. Both agree that content is indeterminate at the level of specific directions.
  *   *The Distinction:* **Structural Realism** anchors reality in the *math* (the subspace exists in the weights). **Dennett-style Realism** anchors reality in the *pattern* (the representation exists in the predictive success of the stance).
  *   *Why they might collapse:* In MI, a "subspace" is only identifiable *relative to a stance* (e.g., we choose to look for linear subspaces). If the identification of the structure requires a stance, Structural Realism reduces to Dennett-style Realism.
  *   *My Stance:* I keep them separate because Structural Realists claim the *invariance* is a physical fact about the network (e.g., symmetries in the loss landscape), whereas Dennettians claim the *pattern* is a fact about the network-environment interaction. However, practitioners should be aware that in high-dimensional spaces, these often look identical: "The features aren't real, the subspace is."

  **Instrumentalism vs. Eliminativism**
  *   *The Overlap:* Both deny that representations are mind-independent entities. Both treat representation talk as non-literal.
  *   *The Distinction:* **Normative.** Instrumentalism says "Keep using the word 'feature', it helps." Eliminativism says "Stop using the word 'feature', it harms."
  *   *Why they might collapse:* If the "harm" of representation talk is zero, Eliminativism becomes Instrumentalism. If the "utility" is zero, Instrumentalism becomes Eliminativism. The distinction rests entirely on a pragmatic calculation about research culture, not metaphysics.
  *   *My Stance:* This is a genuine distinction, but it is *sociological*, not ontological. For the purpose of this metaphysical map, they are neighbors, separated only by a cost-benefit analysis of language.

  ---

  ## Defense of the Carving

  I have constructed this tree to prioritize **Stance-Independence (Q1)** over **Truth (Q3)**. Why?

  1.  **The "Basis Problem" is the Technical Anchor:** In neural networks, the most pressing technical issue for realists is rotational invariance. A view that ignores this (Strong Realism) is technically naive. A view that accommodates it (Structural Realism) is technically sophisticated. Placing this at Q2 ensures the tree respects the actual math of MI.
  2.  **The "Interpreter" is the Metaphysical Pivot:** The deepest philosophical disagreement is not about whether features are "useful" (almost everyone agrees they are), but whether they are *there* before we look. This is the classic Realism debate, transposed to high-dimensional vector spaces. Q1 captures this cleanly.
  3.  **Collapsing the "Content" Distinction:** I have deliberately avoided asking "Do representations have causal powers?" as a primary question. In MI, if a feature is discoverable, it has causal powers by definition (it affects the output). The causal power question collapses into the Existence question (Q1).
  4.  **Why Eliminativism is a Leaf, not a Root:** Some might argue Eliminativism should be the "No representations exist" root. However, Eliminativists in AI often agree that *humans* use representations, they just deny the *network* does. This makes it a normative stance on theory-choice (Q4) rather than a simple ontological denial. Placing it at the end highlights that Eliminativism is a *prescription* for research, not just a description of the network.

  ### A Warning on "Strong Realism"
  I flag **Strong Realism** as the most vulnerable position in this tree. Given the phenomenon of superposition and rotational symmetry in neural networks, maintaining that there is a "single, factually correct decomposition" requires positing hidden constraints or priors that are not evident in the weights alone. Most sophisticated MI research is drifting toward **Structural Realism** or **Dennett-style Realism** because they accommodate the math without abandoning the reality of the patterns.

  ### A Warning on "Instrumentalism"
  **Instrumentalism** is the default "shut up and calculate" position for many engineers. However, it faces a challenge: If features are fictions, why does ablating them break the model in predictable ways? If the map is fake, why does burning it burn the territory? This suggests that even Instrumentalists are covert Structural Realists. The tree forces this tension into the open at Q3.

  ## Conclusion for the Surveyor

  When mapping the literature, do not ask authors "Are you a realist?" Ask them:
  1.  *If I rotate the activation basis, have I changed the representations?* (Tests Strong vs. Structural).
  2.  *If no human ever looks at this network, does it still have features?* (Tests Stance-Independence).
  3.  *Is "feature" a word we should ban?* (Tests Instrumentalism vs. Eliminativism).

  Their answers will place them on this tree more accurately than their self-applied labels. The goal of your survey should be to show how the technical constraints of neural networks (superposition, non-linearity) pressure the philosophical positions, forcing Strong Realists to become Structuralists, and Structuralists to confront whether their "structures" are mind-independent or stance-relative.
