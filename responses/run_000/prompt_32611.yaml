answer: |-
  Based on Douglas Hofstadter's *Le Ton beau de Marot*, specifically his exhaustive dissection of Clément Marot's *Pour une malade* ("Ma mignonne"), here is a specification of the desiderata for any adequate theory of translation under formal constraint.

  This is not a taxonomy of methods, but a requirements list for the *mechanics of decision-making* that a theory must model.

  ### I. Core Phenomena the Theory Must Explain

  A theory of constrained translation cannot simply describe the output; it must account for the friction generated during production. Using "Ma mignonne" (18 lines, 7 syllables per line, tight rhyme scheme, courtly tone) as the test case:

  **1. The Form-Meaning Coupling Phenomenon**
  *   **Requirement:** The theory must explain how formal constraints generate semantic content, rather than merely containing it.
  *   **Reason:** In "Ma mignonne," the 7-syllable limit forces brevity that creates the tone of urgent, breathless concern. If a translation keeps the syllable count but uses polysyllabic Latinate words to fill it, the *urgency* is lost. A theory that treats form as a vessel and meaning as the liquid fails here.
  *   **Status:** **Non-negotiable.**

  **2. The Untranslatable Residue**
  *   **Requirement:** The theory must provide a mechanism for accounting for elements that have zero mapping in the target language (e.g., the specific French pun on *dous/doux* or the cultural weight of *mignonne*).
  *   **Reason:** Hofstadter demonstrates that some features (like the specific sound of the French nasal vowels) cannot be carried across. A theory claiming 100% fidelity is empirically false. The theory must categorize what is lost, not just what is gained.
  *   **Status:** **Non-negotiable.**

  **3. The Constraint Cascade**
  *   **Requirement:** The theory must model how a single formal change triggers a chain reaction of semantic adjustments.
  *   **Reason:** In "Ma mignonne," changing one word to satisfy a rhyme often forces a change in the next line to maintain the meter, which then alters the tone. A linear theory (Source → Target) cannot handle this recursive feedback loop.
  *   **Status:** **Non-negotiable.**

  **4. The Register Shift**
  *   **Requirement:** The theory must account for the temporal and cultural distance between source and target audiences.
  *   **Reason:** Marot wrote for a 16th-century French court. Translating into modern American English inevitably shifts the register. The theory must explain whether the target text should feel "16th-century" to a modern reader (archaism) or "modern" to a modern reader (contemporization), and how that choice impacts the formal constraints.
  *   **Status:** **Negotiable** (see Section III).

  ---

  ### II. Distinctions That Cannot Be Collapsed

  An adequate theory must maintain specific conceptual separations. Collapsing these leads to incoherent prescriptions.

  **1. Propositional Content vs. Illocutionary Force**
  *   **Distinction:** *What is said* (The girl is sick, eat prunes, get well) vs. *What is done* (A courtly flirtation, a display of wit, a performance of care).
  *   **Why it matters:** A translation can be propositionally accurate ("You are ill") but illocutionarily bankrupt (sounding like a doctor's order rather than a suitor's wit).
  *   **Risk of Collapse:** Theories that prioritize "message" often destroy the "act."

  **2. Structural Isomorphism vs. Aesthetic Isomorphism**
  *   **Distinction:** Matching the *count* (7 syllables, 18 lines) vs. matching the *effect* (lightness, dance-like rhythm).
  *   **Why it matters:** One can write 18 lines of 7 syllables in English that feel heavy and plodding. A theory must distinguish between counting beats and feeling the beat.
  *   **Risk of Collapse:** Formalist theories often assume counting equals matching.

  **3. The Translator's Voice vs. The Author's Voice**
  *   **Distinction:** The degree to which the translator's stylistic fingerprint is visible in the constraints chosen.
  *   **Why it matters:** Hofstadter's own translations of "Ma mignonne" vary wildly (some Victorian, some slang-heavy). A theory must account for the translator as a co-creator, not a transparent conduit.
  *   **Risk of Collapse:** Romantic theories of "servitude to the original" deny the translator's agency in solving constraint problems.

  ---

  ### III. Jointly Unsatisfiable Constraints (The Trade-Offs)

  This is the critical section. A robust theory must admit that the following pairs are **jointly unsatisfiable** in a single instance. A theory that claims to resolve these without loss is a red flag.

  **1. Semantic Fidelity vs. Metrical Rigor**
  *   **Conflict:** To keep the exact meaning of a line in "Ma mignonne" often requires more (or fewer) syllables than the target language allows within the 7-syllable constraint.
  *   **Verdict:** **Unsatisfiable.** You must sacrifice nuance to keep the meter, or break the meter to keep the nuance.
  *   **Theoretical Requirement:** The theory must explicitly state which variable is the dependent one.

  **2. Phonetic Patterning vs. Syntactic Naturalness**
  *   **Conflict:** Replicating the rhyme scheme (AAB AAB) and alliteration of the French often forces the English syntax into unnatural inversions ("The bed she lies in" vs. "She lies in the bed").
  *   **Verdict:** **Unsatisfiable.** Perfect sound mapping usually breaks idiomatic flow.
  *   **Theoretical Requirement:** The theory must define the threshold of "unnaturalness" acceptable before the translation becomes parody.

  **3. Historical Authenticity vs. Immediate Accessibility**
  *   **Conflict:** Preserving the 16th-century cultural context (e.g., specific references to prunes or medical humors) may confuse a modern reader. Modernizing these references preserves comprehension but breaks historical fidelity.
  *   **Verdict:** **Unsatisfiable.** You cannot be fully authentic to the source time and fully accessible to the target time simultaneously.
  *   **Theoretical Requirement:** The theory must locate the translation on the time-axis.

  ---

  ### IV. Negotiable vs. Non-Negotiable Desiderata

  **Non-Negotiable (The Theory Breaks Without These)**
  1.  **Acknowledgment of Loss:** The theory must treat loss as a structural necessity, not an accident.
  2.  **Holism:** The theory cannot treat sound, sense, and form as separate layers to be translated sequentially. They are simultaneous.
  3.  **Contextual Sensitivity:** The theory must account for the *purpose* of the translation (e.g., is it for a scholar studying meter, or a poet studying wit?).

  **Negotiable (Schools of Thought May Differ)**
  1.  **Priority of Rhyme:** Some theories demand rhyme be preserved at all costs (e.g., Nabokov initially, then reversed); others demand it be abandoned for free verse accuracy. Both are valid *strategies*, provided the theory acknowledges the cost.
  2.  **Archaism:** Whether to use "thee/thou" or modern slang is a stylistic choice, not a theoretical failure, provided it is consistent with the chosen register.
  3.  **Literalness of Imagery:** Translating *prunes* as *plums* or *figs* to fit a rhyme is a negotiable substitution, provided the *function* of the image (laxative/sweet treat) remains.

  ---

  ### V. Red Herrings (False Requirements)

  These are demands often placed on translation theories that *Le Ton beau de Marot* suggests are illusory.

  **1. "The Definitive Translation"**
  *   **Why it's a red herring:** Hofstadter provides dozens of versions of "Ma mignonne." No single version captures the "whole" poem. A theory seeking the *optimal* solution is chasing a ghost. The goal is a *spectrum* of valid mappings, not a single point.
  *   **Correction:** The theory should evaluate *families* of translations, not individual winners.

  **2. "Literal Meaning as the Baseline"**
  *   **Why it's a red herring:** We often assume there is a "plain prose meaning" underneath the form that must be preserved first. Hofstadter argues the form *constitutes* the meaning. Stripping the rhyme from "Ma mignonne" to find the "real message" destroys the poem.
  *   **Correction:** Meaning is emergent from the constraint, not prior to it.

  **3. "Equivalence"**
  *   **Why it's a red herring:** The word implies a 1:1 mapping. In constrained translation, the relationship is almost always 1:Many or Many:1.
  *   **Correction:** Theories should speak in terms of *analogy* or *resonance* rather than equivalence.

  ---

  ### VI. Evaluation of Main Camps Against the Hardest Requirement

  The hardest requirement is **The Form-Meaning Coupling Phenomenon** (Desideratum I.1).

  *   **Formal Equivalence (Literalist):** Fails here. It tends to treat form as a container. It might preserve the syllable count of "Ma mignonne" but miss the *lightness* of the syllables, resulting in a clunky text that looks like Marot but reads like a manual. It collapses Structural and Aesthetic Isomorphism.
  *   **Dynamic Equivalence (Functionalist):** Fails here. It prioritizes the "effect" on the reader but often discards the formal constraints entirely (turning the poem into prose or free verse). It preserves the Illocutionary Force but sacrifices the Propositional/Formal coupling.
  *   **Hofstadter's "Fluid Analogies" (Constraint-Based):** Succeeds best. It acknowledges that the "soul" of the poem lies in the struggle with the constraints. It accepts that to translate "Ma mignonne," one must write a *new* poem that struggles with English constraints in the same *way* Marot struggled with French constraints, even if the specific words differ.

  ### Summary Checklist for a Theory of Constrained Translation

  If you are evaluating a theory, ask:
  1.  Does it admit that **semantic fidelity and formal fidelity are jointly unsatisfiable**?
  2.  Does it treat **form as generative of meaning**, not just decorative?
  3.  Does it provide a vocabulary for **categorizing loss** rather than hiding it?
  4.  Does it reject the quest for a **single definitive version**?
  5.  Does it distinguish between **counting beats** and **feeling rhythm**?

  If a theory says "Yes" to preserving everything equally, it is insufficient. If it says "Here is how you choose what to kill," it is adequate.
