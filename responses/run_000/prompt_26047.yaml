answer: |-
  Consider Elena, a senior editor mentoring Mark, an intern hoping for a permanent contract. She advocates for him fiercely, knowing his financial stability depends on this role.

  **Classical Framework:** Epictetus's dichotomy is binary. Mark's hiring depends on budget, management whims, and market forces—none fully up to Elena. These are "externals" or "indifferents." Elena's only good is her own virtue: mentoring diligently and advocating honestly. If Mark is rejected, Elena suffers no disturbance. Her moral purpose remains intact. She feels no disappointment, only a shift in strategy.

  **Modern Framework:** Contemporary Stoics like William Irvine introduce a trichotomy. Mark's hiring is "partially up to us." Elena sets an internal goal: "Secure Mark's position." She focuses on her effort but acknowledges the outcome has value. If Mark is rejected, she feels disappointment but accepts it as outside her full control.

  **The Divergence:** The frameworks split upon hearing the bad news. To a normal observer, Classical Elena seems unnerving. She fought for Mark, yet his failure leaves her emotionally untouched. Modern Elena's disappointment signals shared stakes; she valued *his* success, not just her own conduct. The classical strictness severs the emotional link to another's fortune, making loyalty look like a solipsistic performance of virtue. It feels wrong because human care typically involves wanting specific outcomes for loved ones, not just wanting to act correctly toward them. The classical Stoic treats Mark's career as material for her own virtue, whereas the modern Stoic treats it as a shared project.

  **Structural Feature:** The divergence stems from the valuation of externals. Classical Stoicism demands indifference to the *result* of another's life, even if preferred. Modern Stoicism allows valuing the result instrumentally while managing attachment. The classical view isolates the moral agent; the modern view allows interdependence.

  **Classical Defense:** A defender argues this isn't callousness but reliability. If Elena's tranquility depended on Mark's hiring, she might become anxious or manipulative to ensure it. By remaining indifferent to the outcome, she offers Mark stable support regardless of fortune. Her care is demonstrated in action, not emotional turbulence. To feel distress over an external is to mistake what is good; true benevolence requires a mind not enslaved by chance. She helps Mark best when she is not suffering alongside him, preserving the strength necessary to assist him in his next step.
