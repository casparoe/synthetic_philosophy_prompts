answer: |-
  1. The core definition of supererogatory acts as good but not required is standard, though utilitarian theories often reject the category entirely by arguing that maximizing good is actually mandatory.
  2. While Catholic theology distinguished between precepts and counsels, the modern philosophical debate was reignited by J.O. Urmson in 1958, making the "invented by theologians" claim an oversimplification of its secular academic history.
  3. The assertion that morality cannot be rule-based because of supererogation is disputed, as some deontological frameworks successfully incorporate principles that distinguish between duty and merit without abandoning rules.
  4. Although you cannot be morally blamed for omitting a supererogatory act, you may still face criticism regarding your character or virtues for consistently failing to go above and beyond the call of duty.
  5. The claim that omission is beyond criticism "in any way" is too strong, since some philosophers argue that failing to prevent great harm when easily able is rationally indefensible even if not strictly wrong.
