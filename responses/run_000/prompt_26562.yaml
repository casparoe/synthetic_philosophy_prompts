answer: |-
  # Q&A Prep Sheet: Selective Realism & The Pessimistic Meta-Induction

  **Seminar Context:** Philosophy of Science Research Seminar
  **Thesis:** PMI defeats Convergent Realism but fails against Selective Realism (Indispensability + Novel Prediction + Cross-Theoretic Robustness).
  **Goal:** Defend the "Robustness" criterion as the filter that saves realism from history.

  ---

  ### Top 8 Objections (Ordered by Likelihood & Damage)

  #### 1. The "Post-Hoc Cheat" Charge (Laudan Camp)
  **The Question:** "You claim your criterion identifies the 'good' posits retrospectively. But how do we know, *without looking at the future*, which posits were indispensable? Isn't your 'robustness check' just a description of what survived, dressed up as a method? If you can't apply it in real-time, it's not an epistemology, it's a history lesson."
  **The Reply:** "That's the crux of the issue. I'm not claiming infallibility, but I am claiming access. Cross-theoretic robustness isn't determined by survival; it's determined by *independent detection*. For example, we believe electrons not just because electromagnetic theory survived, but because electrons are posited in thermodynamics, chemistry, and solid-state physics independently. In 1880, the ether lacked this; it was specific to optics and mechanics. My criterion relies on the *synchronic* web of theory, not just *diachronic* survival. It's fallible, but it's not merely reading the tea leaves of history."
  **Weakness:** This relies on a clear distinction between "independent detection" and "theoretical interconnectedness" that history often blurs. If the anti-realist argues that *all* 19th-century physics was one big interconnected web including the ether, my distinction collapses.

  #### 2. The Fresnel/Ether Counter-Example (Agnostics/Students)
  **The Question:** "Let's look at Fresnel. He predicted the Poisson spot using wave theory. The existence of the luminiferous ether was *indispensable* to that derivation at the time. It yielded novel success. By your lights, shouldn't we have been realists about the ether? But the ether is false. Doesn't this single case break your rule?"
  **The Reply:** "Fresnel is the hard case, I grant you. However, my criterion requires *cross-theoretic* robustness. The ether was robust within optics and mechanics, but it failed to integrate robustly with emerging thermodynamics and electromagnetism without ad-hoc adjustments. More importantly, selective realism allows for *local* error. The PMI requires a *pessimistic* induction—showing that *most* successful posits are false. If Fresnel is an outlier compared to the track record of atoms, genes, or viruses, the induction fails. One swallow doesn't make a winter."
  **Weakness:** If the audience presses that the ether *was* considered robust across mechanics and optics at the time, I have to admit our current judgment is anachronistic. I risk looking like I'm moving the goalposts to save the posit.

  #### 3. The Structuralist Challenge (Worrall Mould)
  **The Question:** "You're still committing to *objects* or *posits*. Worrall showed that what survives theory change is the *mathematical structure*, not the ontology. Fresnel's equations work; his ether doesn't. Why not be a Structural Realist? You're conceding the PMI on ontology but keeping the baggage. Why not go all the way and drop the posits?"
  **The Reply:** "Structure doesn't float free; it needs a carrier. Structural realism struggles to explain *why* the structure holds without some causal mechanism. My selective realism says: be realist about the posits that *generate* the robust structure. If the posit is indispensable for the manipulation and prediction *and* robustly detected, it's likely the carrier of the structure. I'm not keeping 'dead' posits; I'm keeping the ones that do the causal heavy lifting."
  **Weakness:** Structuralists argue that *any* ontology we attach to the structure is metaphysical excess. I haven't fully answered why we need the "posit" if the "structure" does the predictive work.

  #### 4. The Biology Scope Objection (Philosopher of Biology)
  **The Question:** "Your criterion hinges on 'novel predictive success' and 'cross-theoretic robustness' in a physics sense. In evolutionary biology, we rarely get novel predictions; we get explanatory unification. In molecular biology, 'genes' have been redefined so many times they lack robust identity. Does your view imply we should be anti-realists about biology?"
  **The Reply:** "I don't want to commit physics envy. For biology, 'novel prediction' should be read as 'successful intervention.' If we can manipulate a gene sequence to produce a specific phenotype across different organisms (robustness), that meets the criterion. The definition of 'gene' has shifted, but the *causal role* posits have remained robustly detectable. My criterion is functional, not strictly physico-mathematical."
  **Weakness:** This stretches the definition of "prediction" significantly. If "intervention" counts as prediction, the Entity Realist might steal my thunder, and the criterion becomes too loose.

  #### 5. The Entity Realist/Manipulability Objection (Hacking–Cartwright)
  **The Question:** "Hacking said, 'If you can spray them, they are real.' I don't need your 'indispensability to theory' or 'robustness checks.' If I can manipulate an entity in the lab, it exists. Your criterion is too intellectual. You're demanding theoretical purity when experimental practice gives us realism for free."
  **The Reply:** "Manipulation is necessary, but not sufficient. We can manipulate 'centers of gravity' or 'average temperatures,' but we aren't realists about them as entities. Theory tells us *what* we are spraying. My robustness condition ensures that the entity isn't just a useful instrumental placeholder for the manipulation. We need the theoretical web to confirm the entity isn't a phenomenological artifact."
  **Weakness:** Hacking's point is precisely that theory *doesn't* matter for existence, only causality does. I might be over-intellectualizing a pragmatic point.

  #### 6. The Reference/Continuity Problem (Laudan Camp Backup)
  **The Question:** "Even if you select the right posits, how do they refer? When we say 'electron' in 1900 and 'electron' in 2024, the properties are totally different. If reference fails, truth fails. Your selective realism assumes continuity of reference that history denies."
  **The Reply:** "I rely on a causal theory of reference, not a descriptive one. We refer to the same entity via a causal chain of investigation, even if our descriptions of its properties change. As long as the *causal node* remains robustly detected across theories, reference is maintained. We are talking about the same thing, we just know more about it."
  **Weakness:** If the anti-realist argues the causal chain was broken (e.g., we were interacting with a field, not a particle), the causal theory doesn't save me.

  #### 7. The "No Miracles" Trivialization (General)
  **The Question:** "If you cut away all the posits that didn't survive, and only claim realism on the ones that did, aren't you making realism trivial? You're defining 'real' as 'what survives.' That explains nothing about why science succeeds."
  **The Reply:** "Not at all. I'm making a risky prediction: that posits meeting these criteria *will* survive. It's not a definition; it's a hypothesis about the convergence of scientific inquiry. If future theory change discards robust, indispensable posits, my view is falsified. I'm not insulating realism from refutation; I'm refining the target."
  **Weakness:** It is difficult to specify *in advance* enough cases to prove this isn't just insulation.

  #### 8. The Question I Hope Nobody Asks
  **The Question:** "If a scientist in 1880 applied your exact criterion using only the evidence available *then*, would they have been justified in believing in the Ether? If yes, your criterion leads to false belief. If no, your criterion is anachronistic and relies on knowledge they didn't have."
  **The Reply:** "This is the time-travel objection. I would argue that even in 1880, the ether lacked *full* cross-theoretic robustness (e.g., conflicts with thermodynamics were already emerging). A careful selective realist in 1880 should have been agnostic about the ether's material nature while committing to the wave structure. But I concede: historical agents often fail to apply the norm correctly. That's a failure of psychology, not epistemology."
  **Weakness:** This is the weakest point. If the historical record shows the ether *was* the only robust option available then, I have to admit my criterion yields false positives in the past, which revitalizes the PMI.

  ---

  ### Strategic Concessions (The "Wind Out of the Sails" Move)

  **The Two Strongest Objections:**
  1.  **The Post-Hoc Charge (#1):** If my criterion is just a description of survivors, it offers no guidance for current science.
  2.  **The Fresnel Case (#2):** If the best historical example of novel success leads to a false posit, the PMI stands.

  **What to Concede:**
  *   **On Post-Hocery:** Concede that the criterion is **fallible and not algorithmic**. Do not claim it guarantees truth. Claim only that it *maximizes probability* compared to convergent realism or anti-realism. Say: *"I am not offering a decision procedure that guarantees truth, but a normative standard for rational commitment. Scientists can be wrong even when following the best norms."*
  *   **On Fresnel:** Concede that **selective realism allows for local pessimism**. Admit that the ether might be a case where the robustness check was passed *relative to the time* but failed globally. Say: *"Selective realism does not claim immunity from error, only immunity from the global pessimism of the PMI. If the error rate is low enough, the induction fails."*

  ---

  ### Confidence Assessment

  *   **Confidence in Analysis:** **High (85%)**. The objections are standard fare in the realism/anti-realism debate (PMI, No Miracles, Reference, Structuralism). The mapping of audience types to objections is reliable based on standard seminar dynamics.
  *   **Least Sure Point:** **The "Cross-Theoretic Robustness" Definition.** I am least sure how well this holds up under cross-examination regarding *what counts* as a separate theory. If the anti-realist argues that 19th-century optics and mechanics were not "cross-theoretic" enough to count as independent, or conversely that they were too entangled to separate the ether, my core mechanism becomes vague. I need to be prepared with a concrete example of what counts as "robust" vs. "entangled" (e.g., distinct experimental apparatuses vs. distinct mathematical derivations).

  **Final Advice:** When the Laudan faculty press the "Post-Hoc" point, do not get defensive. Agree that history is messy. Pivot to the *normative* claim: "We should believe this *now* because the robustness is visible *now*, even if they couldn't see it *then*." This shifts the debate from history of science to current epistemology, where you have the stronger hand.
