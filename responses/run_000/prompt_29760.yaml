answer: |-
  1. Groundwork
  The dispute concerns the ontological status of emotion. Judgment theories claim emotions are evaluative inferences (cognitive). Perception theories claim emotions are sensory registrations of value or body state (embodied). Feeling theories claim emotions are phenomenal experiences (conscious). To translate faithfully, I will map philosophical functional roles to computational primitives without smoothing over ontological mismatches. Judgment becomes latent-state inference over value; Perception becomes interoceptive inference or sensory readout; Feeling becomes access to precision-weighted error signals. I will flag where computational functionalism assumes away philosophical commitments, particularly regarding normativity and qualia. The goal is to determine if the dispute collapses into Marr's levels (computational vs. algorithmic vs. implementational) or remains a substantive disagreement about what exists.

  2. Vocabulary map
  | Philosophical Notion | Computational Counterpart | Faithfulness Note |
  | :--- | :--- | :--- |
  | **Appraisal** | Posterior inference over latent states ($P(state|data)$) | High, but loses propositional logic structure. |
  | **Bodily Change** | Interoceptive predictions / Effector commands | High, maps directly to physiological control loops. |
  | **Feeling** | Precision-weighted prediction error (accessed) | Low, assumes functional access equals phenomenology. |
  | **Intentionality** | Generative model structure (aboutness) | Medium, models represent world, but lack semantic content. |
  | **Valence** | Signed Reward Prediction Error (RPE) | High, both denote approach/avoidance gradients. |
  | **Normativity** | Cost function / Optimality conditions | Low, optimization $\neq$ truth conditions or moral oughts. |
  | **Embodiment** | Active Inference / Policy execution | High, maps cognition to action-perception loops. |

  3. Judgment theories in the target vocabulary
  In your vocabulary, Judgment theories map primarily to **Model-Based Reinforcement Learning** coupled with high-level **latent-state inference**. Here, an emotion is not a raw signal but the output of a value function $V(s)$ that depends on a structured generative model of the world. Fear, for instance, is the inference that a current state $s_t$ has a high expected cost relative to homeostatic goals. This aligns with the philosophical claim that emotions involve "correctness conditions": the inference can be wrong if the model is inaccurate.

  However, this translation imports a functionalist assumption: it equates "judgment" with "probabilistic inference." Philosophical judgment theories often require propositional content (e.g., "I judge that X is dangerous"), implying logical structure. Your vocabulary offers probabilistic beliefs (posteriors) rather than logical propositions. Furthermore, Judgment theories often claim emotions are constitutively cognitive. In RL, this means emotion cannot exist without the model-based system. If a model-free reflex triggers avoidance without state inference, the Judgment theorist must deny it is an emotion. This maps cleanly to the distinction between goal-directed vs. habitual control, but it risks excluding subcortical affective responses that lack cortical model-based inference. The translation holds if you accept that evaluation equals value estimation, but it strains if "judgment" implies conscious reasoning rather than automatic inference.

  4. Perception theories in the target vocabulary
  Perception theories translate most naturally into **Interoceptive Predictive Coding** and **Somatic Marker** hypotheses. Here, emotion is the inference *from* bodily signals rather than the inference *about* the world. In Jamesian terms, the policy executes (body changes), and the emotion is the perception of those interoceptive prediction errors. You model this as the brain inferring the cause of visceral changes: "My heart is racing, therefore I am afraid."

  Alternatively, in a Damasio-esque framework, emotion is the perception of value via somatic markers. This maps to **Model-Free RL** where cached values are associated with bodily states. The emotion is the sensory readout of the value function, not the calculation itself. This captures the philosophical claim that emotions are non-conceptual and immediate, like vision. However, a distortion arises: in predictive processing, perception *is* inference. The distinction between "judging value" and "perceiving value" blurs because both are Bayesian updates. The Perception theorist insists emotions are passive registrations. Your vocabulary suggests they are active inferences minimizing free energy. If the brain constructs the bodily state via active inference, the emotion is partly constitutive of the body change, not just a perception of it. This challenges the passive "readout" metaphor central to classic Perception theories, suggesting a tighter coupling between feeling and acting than the philosophy originally allowed.

  5. Feeling theories in the target vocabulary
  Feeling theories posit that the essence of emotion is the qualitative experience (qualia). In your vocabulary, the closest counterpart is the **phenomenal access to precision-weighted prediction errors**. When precision weighting is high, specific error signals are broadcast globally (Global Workspace), becoming available for report. A Feeling theorist would identify the emotion with this availability.

  However, this translation is the least faithful and requires a major flag: it assumes **functionalism**. You map "feeling" to "information access," but the philosopher asks about the *what-it-is-like-ness* of that access, not the access itself. Your vocabulary describes the correlate of feeling (neural signaling, precision modulation) but lacks terms for the experience itself. You can model the *report* of fear, but not the *suffering* of fear. Feeling theories often argue that functional roles are contingent; a zombie could have the same RL architecture without the feeling. Your vocabulary has no place for zombies; if the computation runs, the system exists. To translate Feeling theories, you must treat the subjective signal as a primitive variable, not reducible to its functional role in policy selection. This forces you to posit a variable that influences nothing (epiphenomenalism) or admit your vocabulary cannot capture the target phenomenon. Most computationalists deny the distinction, but doing so begs the question against the Feeling theorist.

  6. Residue report
  **Translated Cleanly:**
  *   **Valence:** Signed RPE maps cleanly to positive/negative affect. Both describe directionality of action.
  *   **Appraisal/Inference:** Latent state inference captures the evaluative component of Judgment theories well.
  *   **Embodiment:** Active inference loops capture the causal coupling of body and mind in Perception theories.

  **Translated with Distortion:**
  *   **Normativity:** Judgment theories claim emotions can be "irrational" or "unfitting" (truth conditions). RL models optimize cost functions. Optimization errors are not normative failures in the philosophical sense. This is a **philosophical confusion**: philosophers often reify normative force where there is only optimization pressure.
  *   **Passivity:** Perception theories claim emotions happen *to* us. Active inference shows perception is constructive. This is a **philosophical limitation**: the theory relies on an outdated passive-sensor model of brain function.
  *   **Propositionality:** Judgment theories require logical structure; RL offers probabilistic distributions. This is a **vocab blind spot**: your vocabulary lacks symbolic logic, making it hard to express "reasons" vs. "causes."

  **No Counterpart:**
  *   **Qualia:** The subjective feel itself. This is a **vocab blind spot** (the Hard Problem). Computational neuroscience describes processing, not experience.
  *   **Normative Force:** The "ought" inherent in unfitting emotions. This is a **philosophical confusion** if taken as non-natural, but a **vocab blind spot** if we need to model social norm compliance explicitly.

  **Analysis:**
  The residue suggests the dispute is partly levels-of-analysis. Judgment is Computational (value), Perception is Algorithmic (inference source), Feeling is Implementational/Phenomenal. However, the Qualia residue indicates a genuine ontological gap. Your vocabulary assumes functionalism; Feeling theories deny it. The Normativity residue indicates philosophers often mistake optimization constraints for moral truths.

  7. Verdict
  Your suspicion is partially correct: much of the dispute is a levels-of-analysis artifact. Judgment theories describe the computational level (value estimation); Perception theories describe the algorithmic level (interoceptive inference); Feeling theories describe the implementational/phenomenal level. However, this reduction does not dissolve the dispute entirely. The substantive disagreement remains regarding **phenomenology** and **normativity**. Your vocabulary cannot express qualia without functionalist reduction, which Feeling theorists reject. Furthermore, your vocabulary treats "error" as statistical, whereas philosophers treat "unfitting" as normative. To resolve the dispute, your vocabulary must grow to include **phenomenal primitives** (non-functional experience) and **normative constraints** (social/moral cost functions distinct from survival optimization). Until then, you can model the mechanisms of emotion, but you cannot fully express what philosophers mean by "having" an emotion.
