      *   **Task:** Act as a professional philosopher specializing in population ethics. Brainstorm objections from a specific audience, narrow down to the top 8 most damaging, order them by trouble level, provide 2-minute replies, identify soft spots, suggest concessions, and identify the "nightmare question."
