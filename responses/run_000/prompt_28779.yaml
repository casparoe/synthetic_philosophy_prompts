  Here is a draft of a section for your paper. It is written at a level appropriate for a PhD dissertation or journal article, aiming for philosophical precision while respecting the literary nuance of Borges's text. Following the draft, I have included a brief commentary on the rhetorical choices made, to help you integrate it into your broader argument.

  ***

  ### Section Draft: The Ontological Cost of the Particular in "Funes the Memorious"

  Jorge Luis Borges's "Funes the Memorious" (1942) is frequently cited in philosophical circles as a narrative refutation of extreme nominalism. The protagonist, Ireneo Funes, having survived a fall from a horse, awakens with a consciousness incapable of filtering perceptual data. He perceives every leaf on every tree, every shift in light, and remembers every instant with perfect fidelity. Crucially, Funes finds the use of general concepts intolerable; he cannot accept that the "dog" seen at 3:00 PM is the same entity as the "dog" seen at 3:01 PM, for the temporal and spatial coordinates have shifted. To the casual reader of metaphysics, the story appears to offer a *reductio ad absurdum* of the nominalist position: if only particulars exist, thought becomes impossible. Funes's paralysis is taken as proof that universals are not merely linguistic conveniences but necessary conditions for cognition. However, to treat Borges's story merely as an illustration of the realist victory is to overlook the specific phenomenological texture of Funes's condition. Borges does not simply argue that universals exist; he dramatizes the existential tension between ontological fidelity and cognitive utility. In doing so, "Funes" complicates the realist/nominalist debate by suggesting that the "error" of abstraction may be the very mechanism by which human beings inhabit reality, even if that reality is, strictly speaking, composed of pure particulars.

  To locate Funes within the problem of universals, one must first recognize that his perception aligns with a radical ontological nominalism. For Funes, there are no recurring essences, only unique events. When the narrator notes that Funes struggled to understand that the generic term *dog* could apply to so many disparate individuals, he highlights the gap between the flux of experience and the static nature of language. From a strict nominalist perspective, Funes is the only character in the story who sees the world as it truly is: a continuum of singularities. The "realist" world of the narrator, where objects retain identity over time, is revealed as a fabrication—a necessary simplification. In this light, Funes is not cognitively deficient; he is ontologically hyper-accurate. His inability to generalize is not a failure to grasp the "true" nature of the dog, but a refusal to falsify the data of experience by collapsing distinct temporal slices into a single concept. Borges thus grants the nominalist a significant concession: the world of pure particulars is arguably more *real* than the world of concepts. The grain of reality is finer than the grid of language.

  However, the story simultaneously undermines the viability of this ontological fidelity. Funes is not a triumphant seer of truth; he is an invalid, insomniac, and paralyzed by the sheer volume of the present. This is where the standard realist reading gains traction: if the world were truly composed only of particulars, agency would be impossible. Action requires prediction, and prediction requires the assumption that the future will resemble the past—a assumption grounded in the stability of universals. Funes's attempt to create a numbering system where every integer has a unique, non-recurring name (e.g., replacing "7013" with "Máximo Perez") demonstrates that without the recursive power of abstraction, even mathematics collapses into a history of proper names. Here, Borges dramatizes the functional necessity of universals. Whether universals exist *in re* or *ante rem* matters less than the fact that the human mind cannot operate *sine universis*. The story suggests that while nominalism might be ontologically superior (in that it respects the uniqueness of particulars), realism (or at least conceptualism) is pragmatically indispensable.

  Yet, to stop here is to reduce Borges to a textbook moralizer. The deeper philosophical contribution of "Funes" lies in its reconfiguration of the relationship between memory and abstraction. The narrator concludes the story with a famous aphorism: "To think is to forget a difference, to generalize, to abstract." In the traditional debate, forgetting is viewed as an epistemic loss—a drifting away from the truth of the object. Borges inverts this: forgetting is an epistemic *condition*. The realist argues that we abstract because universals exist; Borges suggests we abstract because we *must forget*. This shifts the burden of proof from metaphysics to cognitive psychology. It implies that the problem of universals may not be solely about what exists in the world, but about the bandwidth of the consciousness perceiving it. Funes's pathology is not necessarily that he denies the existence of universals, but that his memory is too perfect to allow for the "gaps" where concepts reside. A concept is a sieve; Funes has no mesh.

  Consequently, Borges adds a dimension to the debate that syllogistic argumentation cannot capture: the *suffering* of the particular. Philosophical arguments for nominalism often celebrate the liberation from rigid essences, while realists warn of the chaos of unbridled particularity. Borges renders the chaos visceral. Funes's world is not just logically difficult; it is heavy, suffocating, and sleepless. This phenomenological weight suggests that the debate over universals is not merely a classification error but a negotiation with human finitude. If Funes represents the nominalist ideal of perfect fidelity to the particular, his tragedy indicates that such fidelity is incompatible with life as it is lived.

  Ultimately, "Funes the Memorious" does not settle the ontological status of universals. It leaves open the possibility that Funes is right about the world (that it is indeed a flux of particulars) while remaining wrong about how to live in it. Borges thereby decouples truth from viability. The story challenges the philosopher to ask whether a metaphysics that renders its subject paralyzed can be considered a successful account of reality, even if it is technically more accurate. In the end, Funes stands as a monument to the cost of truth: he possesses the world in its entirety, but he cannot think about it. He is the martyr of the particular, demonstrating that while universals may be fictions, they are the fictions without which the mind goes dark.

  ***

  ### Commentary on the Draft (For the Student)

  Here is a breakdown of why I constructed the section this way, which may help you defend or modify it within your larger dissertation:

  **1. Avoiding the "Textbook Trap":**
  You asked not to reduce Borges to a simple illustration. Notice that in the second paragraph, I argue that Funes is actually *ontologically correct* from a nominalist standpoint. This prevents the section from simply saying "Funes is crazy, therefore Realism wins." It acknowledges that the Nominalist has a point about the nature of reality (flux/singularity), which makes the critique of Nominalism more sophisticated (it's not *false*, it's just *unlivable*).

  **2. The Shift from Metaphysics to Epistemology/Psychology:**
  In the fourth paragraph, I introduce the idea of "forgetting" as a condition for thought. This is crucial for a PhD-level reading. It moves the debate away from "Do universals exist?" to "What are the conditions of possibility for a finite mind?" This aligns Borges with Kantian or Pragmatist readings without explicitly forcing him into those boxes, allowing you to pivot the argument depending on your paper's broader thesis.

  **3. "Truth vs. Viability":**
  The concluding argument—that Borges decouples truth from viability—is a strong philosophical claim. It allows you to argue that Borges is contributing a *pragmatic* critique of metaphysics. He isn't saying particulars don't exist; he's saying a philosophy that ignores the cognitive cost of particulars is incomplete.

  **4. Integration Tips:**
  *   **Citations:** You will need to insert specific citations for the Borges text (I used standard plot points, but you need page numbers based on your edition, likely the *Labyrinths* or *Collected Fictions* version).
  *   **Connections:** If your paper discusses specific philosophers (e.g., Ockham, Aquinas, Armstrong, Lewis), you should weave their names into the second and third paragraphs. For example, where I mention "radical ontological nominalism," you could insert "(reminiscent of Ockham's *entia non sunt multiplicanda*...)" or contrast it with Armstrong's realism.
  *   **Tone Check:** Ensure this section matches the voice of your surrounding chapters. If your paper is more analytic, you may want to tighten the prose in the final paragraph. If it is more continental, the focus on "suffering" and "finitude" should fit well.

  **5. Potential Counter-Arguments to Anticipate:**
  A rigorous committee might ask: *Does Borges actually believe particulars are more real?* Or is he suggesting that Funes is simply hallucinating structure where there is none? You might want to add a sentence acknowledging that the narrator is unreliable, and we only see Funes through the lens of a "forgetful" man, which biases the presentation of Funes's condition as a pathology rather than an evolution.

  This draft provides a robust scaffold that treats the literature as philosophy without stripping it of its literary power. Good luck with the paper.
