prompt: |-
  Give an example of a conceptual issue that comes up when you try to extend total utilitarianism to worlds with infinitely many people. Specifically, construct two infinite worlds where there's a natural one-to-one pairing between their populations, and every individual in the second world is better off than their counterpart in the first world — so it looks like a straighforward Pareto improvement — but a naive 'sum up everyone's utility' approach treats the two worlds as incomparable, because both totals are just infinite. Explain exactly where the adding-up goes wrong. You're an expert on infinite ethics and population ethics; start by brainstorming a couple of candidate worlds, then settle on the cleanest one and dont hand-wave the set-theoretic part.
