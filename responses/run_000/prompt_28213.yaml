  # Joint Statement on the Sleeping Beauty Problem
  **An Adversarial Collaboration Between a Halfer and a Thirder**

  **Date:** October 26, 2023
  **Signatories:** [Representative Halfer], [Representative Thirder]

  ## Preamble
  This document records the results of an adversarial collaboration regarding the standard Sleeping Beauty problem. The goal of this collaboration is not to force a consensus where none exists, but to precisely map the landscape of agreement, isolate the substantive sources of disagreement, and identify the empirical or theoretical "cruxes" that would compel one or both parties to revise their positions. We affirm that both positions are internally consistent and grounded in respectable epistemological traditions.

  ---

  ## Section 1: Agreed Claims
  The following claims are accepted by both parties. These agreements establish the boundary conditions of the debate and rule out certain classes of objections.

  1.  **Ex Ante Fairness:** On Sunday, prior to the coin toss and sedation, Beauty's credence that the coin will land Heads is exactly $1/2$. Both parties agree the coin is fair and that no bias exists in the experimental setup.
  2.  **Indistinguishability:** Upon awakening, Beauty possesses no sensory or mnemonic evidence that distinguishes Monday from Tuesday, nor Heads from Tails. The amnesia drug is assumed to be perfectly effective; Beauty cannot deduce the day or the coin outcome from internal states.
  3.  **Bayesian Framework:** Both parties agree that Beauty ought to reason as a Bayesian agent. The disagreement is not about the validity of conditionalization, but about the identification of the evidence $E$ and the relevant sample space $\Omega$ upon which conditionalization operates.
  4.  **Betting and Payoff Structures:** Both parties agree that Beauty's optimal betting strategy depends on the payoff structure. Specifically, if Beauty is paid for every correct answer given at each awakening, she should bet on Tails to maximize expected winnings. Both parties agree that a rational agent should not accept a sure-loss Dutch Book *given their own definition of coherent credence and decision rule*.
  5.  **No Outcome Knowledge:** Upon awakening, Beauty does not learn the outcome of the coin toss directly. She learns only that she has been awakened, a fact she knew with certainty would happen at least once regardless of the coin outcome.
  6.  **Centered Propositions:** Both parties acknowledge that the proposition "It is Monday" or "I am awake now" is a self-locating (centered) proposition, distinct from uncentered propositions like "The coin landed Heads." The dispute concerns whether evidence regarding centered propositions can update credence in uncentered propositions.

  ---

  ## Section 2: Disagreements Table
  The following table isolates the precise points of divergence. Column (a) states the proposition neutrally; Columns (b) and (c) articulate the specific stance of each party.

  | (a) Proposition / Issue | (b) Halfer Position | (c) Thirder Position |
  | :--- | :--- | :--- |
  | **1. Credence upon Awakening**<br>What is Beauty's rational credence $P(Heads)$ upon awakening? | $P(Heads) = 1/2$. The credence should remain unchanged from Sunday because no relevant new information has been received. | $P(Heads) = 1/3$. The credence should update to reflect the proportion of awakenings in which Heads is true. |
  | **2. Relevance of Self-Locating Evidence**<br>Does the indexical fact "I am awake now" provide evidence relevant to the coin toss? | **No.** Beauty knew on Sunday she would be awake at least once. Since the experience is identical in all scenarios, the fact of awakening does not shift the probability mass between Heads and Tails. | **Yes.** While Beauty knew she would wake up, she did not know *which* awakening she was experiencing. The fact that she is experiencing *this* awakening makes it more likely she is in a world with more awakenings (Tails). |
  | **3. The Reference Class**<br>When evaluating the probability, what constitutes the relevant set of possibilities? | **Coin Tosses.** The primary random event is the coin flip. There are two equally probable worlds (Heads-World, Tails-World). Awakenings are secondary consequences. | **Awakenings.** The relevant sample space for a conscious agent is the set of observer-moments. There are three equiprobable centered worlds: (Heads, Mon), (Tails, Mon), (Tails, Tue). |
  | **4. Credence vs. Frequency**<br>Should rational credence track the long-run frequency of the *truth of the hypothesis* or the *success rate of the belief*? | **Truth of Hypothesis.** Credence tracks how often the coin lands Heads in repeated experiments (50%). The fact that she is asked twice in Tails-worlds is a sampling bias, not an epistemic update. | **Success Rate of Belief.** Credence tracks how often a belief held at an awakening turns out to be true. If she believes Heads every time, she is right only 1/3 of the time across all awakenings. |
  | **5. Diachronic Consistency**<br>Does Beauty's credence change between Sunday night and Monday morning (upon awakening)? | **No.** Since no new relevant information is gained, rational credence should remain constant ($1/2 \to 1/2$). To change it without new evidence violates the principle of reflection. | **Yes.** Beauty gains self-locating information upon awakening that she did not possess on Sunday (specifically, that she is not in a state of non-existence within the experiment). Thus, $1/2 \to 1/3$ is a valid update. |

  ---

  ## Section 3: Cruxes
  The following are specific sub-questions or variant cases. If the facts or intuitions regarding these cruxes were resolved in a specific direction, at least one party acknowledges their position would be significantly undermined or require major revision.

  ### Crux 1: The "Extreme Tails" Variant
  *   **Scenario:** The protocol is modified so that if Tails, Beauty is awakened 1,000,000 times; if Heads, only once.
  *   **Halfer Assertion:** Credence in Heads should remain $1/2$. The number of repetitions does not change the fairness of the coin.
  *   **Thirder Assertion:** Credence in Heads should drop to approx. $1/1,000,001$. It would be irrational to believe one is in the single Heads-awakening rather than one of the million Tails-awakenings.
  *   **Test for Resolution:** If the Halfer concedes that credence *should* shift in the extreme case (even slightly), they must explain the threshold at which repetition becomes relevant evidence. If the Thirder concedes credence remains $1/2$ even here, the "counting awakenings" argument collapses.
  *   **Stake:** The Halfer views this as a test of whether *mere repetition* constitutes evidence. The Thirder views this as a reductio ad absurdum of the Halfer position.

  ### Crux 2: The Betting-Credence Link
  *   **Scenario:** Beauty is offered a bet on every awakening: win \$1 if correct, lose \$1 if incorrect.
  *   **Halfer Assertion:** Beauty should bet on Tails (to maximize utility), but her *credence* in Heads remains $1/2$. The divergence between credence and betting odds is due to the decision-theoretic structure (betting twice on Tails), not epistemology.
  *   **Thirder Assertion:** Beauty should bet on Tails *because* her credence in Heads is $1/3$. Credence should align with the betting odds that avoid sure loss in this specific self-locating context.
  *   **Test for Resolution:** If a decision-theoretic framework is constructed where rational action *requires* credence to match betting odds in all self-locating scenarios (without auxiliary "bet-counting" rules), the Halfer must either adopt $1/3$ or reject the framework.
  *   **Stake:** Whether "Credence" is defined purely by truth-tracking (Halfer) or by action-guiding in self-locating contexts (Thirder).

  ### Crux 3: The "Technicolor Beauty" Variant
  *   **Scenario:** Upon each awakening, a colored card (Red or Blue) is shown. The color is randomly selected each day, independent of the coin. Beauty sees a Red card.
  *   **Halfer Assertion:** Seeing Red provides no information about the coin. Credence remains $1/2$.
  *   **Thirder Assertion:** Seeing Red makes it more likely she is in a Tails world (because there are more opportunities to see a Red card in Tails worlds). Credence shifts toward Tails.
  *   **Test for Resolution:** If the Halfer admits that seeing the card *does* shift credence in this variant, they must explain why the standard case (without the card) is relevantly different, given that "I am awake" is arguably analogous to "I am seeing a card."
  *   **Stake:** Whether indexical evidence requires an external marker (like a card) to be admissible, or if the awakening itself suffices.

  ---

  ## Section 4: Verbal Dispute Assessment
  We have assessed whether the disagreement is merely verbal (i.e., arising from different definitions of "credence" or "probability") or substantive.

  **Assessment: The Dispute is Wholly Substantive.**

  While there are terminological differences, disambiguating them does not dissolve the disagreement.

  1.  **Definition of Credence:**
      *   *Hypothesis:* The Halfer defines credence as "degree of belief in the truth of the proposition," while the Thirder defines it as "propensity to bet per awakening."
      *   *Refutation:* Even if we force a shared definition (e.g., "Credence is the price at which one buys a ticket that pays \$1 if Heads"), the dispute persists. The Halfer argues the ticket should be priced at \$0.50 because the *experiment* pays out once on Heads. The Thirder argues the ticket should be priced at \$0.33 because the *agent* only holds the ticket in contexts where it wins 1/3 of the time. This is a disagreement about how to value propositions in self-locating contexts, not just a semantic difference.

  2.  **Centered Worlds Semantics:**
      *   *Hypothesis:* The parties agree on the math but disagree on whether to model the world using "Centered Worlds" (Thirder) or "Possible Worlds" (Halfer).
      *   *Refutation:* This is not merely a modeling choice; it is an ontological disagreement about what constitutes evidence. The Halfer claims that centered evidence ("I am here now") cannot update uncentered hypotheses ("The coin is Heads") unless it rules out a possible world entirely. The Thirder claims centered evidence shifts probability mass *within* possible worlds based on the number of centers. This is a fundamental divergence in epistemological theory, not terminology.

  3.  **Conclusion on Verbality:**
      If the Halfer adopted the Thirder's terminology ("Let's call the 1/3 number 'credence'"), the Halfer would still maintain that this number does not reflect the *chance of the coin*, but rather the *frequency of correct guesses*. If the Thirder adopted the Halfer's terminology ("Let's call the 1/2 number 'credence'"), they would argue this number fails to guide action correctly in self-locating scenarios. Therefore, the core conflict remains: **Does the structure of observation (being an observer within the experiment) affect the probability of the external event being observed?** The Halfer says No; the Thirder says Yes. This is a substantive metaphysical and epistemological disagreement.

  ---
  **Signed,**

  _________________________
  [Representative Halfer]

  _________________________
  [Representative Thirder]
