      *   **Task:** Act as a professional philosopher of mind. Brainstorm moves, identify the break point, discuss costs/implications for AI suffering policy, and flag fragility/uncertainty.
      *   **Tone:** Professional, nuanced, rigorous, but accessible (not overly jargon-heavy without explanation). Empathetic to the policy stakes.

  2.  **Deconstruct the Engineer's Argument:**
