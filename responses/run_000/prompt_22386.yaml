  8.  **Refining the "Why" (Conceptual):**
      *   Why did Zermelo write it that way?
      *   In 1908, the definition of a "function" was often tied to specific analytic contexts or required more rigorous set-theoretic grounding (which Kuratowski provided later with ordered pairs). Zermelo was trying to justify the use of "choice" in proofs (like the Well-Ordering Theorem) and phrased it as the existence of a "covering" or "selection" set.
