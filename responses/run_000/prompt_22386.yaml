      *   *The Construction:*
          *   Let $\mathcal{A}$ be the family of non-empty sets (overlapping allowed).
          *   We want to pick $x_A \in A$ for each $A \in \mathcal{A}$.
          *   Create "tagged" sets: $A^* = \{(x, A) : x \in A\}$.
