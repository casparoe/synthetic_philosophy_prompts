          *   Since $z_A \in A \times \{A\}$, $z_A$ must be an ordered pair $(x, A)$ where $x \in A$.
          *   We define the function $f: \mathcal{F} \to \bigcup \mathcal{F}$ by $f(A) = x$ (the first component of the pair in $C' \cap (A \times \{A\})$).
