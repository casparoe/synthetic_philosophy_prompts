  7.  **Refining the "Looping" aspect:**
      *   Make sure to distinguish between *labeling* changing behavior and the *underlying kind* changing. Hacking says the *kind* changes because the people change. The theory needs to account for this ontology.

  8.  **Refining the "Real vs. Constructed" aspect:**
