  2.  **Deconstruct the Problem (Philosophy of Psychiatric Kinds):**
      *   Psychiatric categories are weird. They aren't quite like natural kinds (gold, electrons) because humans react to them. They aren't quite like social kinds (money, citizenship) because there's often a biological/psychological substrate.
      *   Hacking's "Looping Effects" is the central reference point. Interactive kinds vs. indifferent kinds.
      *   The user wants a checklist for evaluating theories (Realism? Constructivism? Pragmatism? Hybrid?).

  3.  **Brainstorming Desiderata (The "Must-Haves"):**
      *   *Stability vs. Change:* Categories change over time (DSM revisions), but we need them to refer to something stable enough to treat.
      *   *Objectivity vs. Subjectivity:* There's suffering involved (objective?), but the expression is subjective/cultural.
      *   *Causal Power:* The diagnosis *does* things (access to meds, stigma, self-concept).
      *   *Predictive/Explanatory Power:* It needs to help predict outcomes or explain symptoms.
      *   *Normativity:* Psychiatry is about "disorder," which implies a value judgment (harm/dysfunction), not just statistical deviation.
      *   *Cross-Cultural Validity:* Does depression exist in every culture the same way?
      *   *Agency:* Patients aren't passive specimens; they react.

  4.  **Developing the Arguments for Each Desideratum:**
      *   *Requirement 1: Accommodate Interactive Causality (The Hacking Constraint).*
          *   *Why:* If a theory treats patients like rocks, it fails. ADHD diagnosis changes behavior.
          *   *Case:* Self-fulfilling prophecies, identity formation.
      *   *Requirement 2: Distinguish Harm from Deviance (The Normative Constraint).*
          *   *Why:* Otherwise, homosexuality remains a disorder. Psychiatry is medicine, not just statistics.
          *   *Case:* Wakefield's "Harmful Dysfunction."
      *   *Requirement 3: Allow for Temporal Instability without Collapse (The Historical Constraint).*
          *   *Why:* Hysteria disappeared; ADHD expanded. A theory must explain how a kind can "die" or "mutate" without saying it was never real.
          *   *Case:* DSM-III vs. DSM-5 changes.
      *   *Requirement 4: Support Practical Utility without Reducing to Utility (The Pragmatic/Realist Tension).*
          *   *Why:* We need treatments to work (utility), but we also want to know if the disease is "real" (truth). If we only say "it's useful," we lose ontological grounding.
          *   *Case:* Medication works, but is it fixing a broken part or managing a trait?
      *   *Requirement 5: Respect Cross-Cultural Variation without Sliding into Relativism (The Cultural Constraint).*
          *   *Why:* Suffering is universal, expression is local. A theory must handle *ataque de nervios* vs. Panic Disorder.
          *   *Case:* Culture-bound syndromes.

  5.  **Identifying the Tensions (The "Jointly Unsatisfiable" Pairs):**
      *   *This is the most important part of the prompt.*
      *   *Tension 1: Stability (for Science) vs. Fluidity (for Human Agency).* To study something, it needs to stay still. But humans don't stay still when labeled.
      *   *Tension 2: Value-Neutrality (for Objectivity) vs. Value-Ladenness (for Definition of Disorder).* Science wants facts; Psychiatry requires values (harm).
      *   *Tension 3: Internal Validity (Biology) vs. External Validity (Social Context).* Is ADHD a brain thing or a school-structure thing? A theory focusing too much on one misses the other.
      *   *Tension 4: Truth (Correspondence) vs. Utility (Success).* Sometimes a "false" model works (Newtonian physics). In psychiatry, a "social construct" might save lives.

