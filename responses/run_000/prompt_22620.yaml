          4.  Survey main solutions and offer an assessment.
      *   **Tone:** Respectful, precise, conceptually rich, not drowning in formalism but rigorous enough for a scientist.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Core Issue:* Bayesian confirmation is usually defined as an increase in probability: $P(H|E) > P(H)$. By Bayes' Theorem, $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. If $E$ is already known, $P(E) = 1$. If $P(E)=1$, then $P(E|H)=1$ (usually). Thus $P(H|E) = P(H)$. No confirmation.
      *   *Intuition:* Einstein *did* get credit for explaining Mercury. The theory *was* confirmed by this data.
      *   *Tension:* Formalism says "no," scientific practice says "yes."

  3.  **Drafting Section (i): The Derivation:**
