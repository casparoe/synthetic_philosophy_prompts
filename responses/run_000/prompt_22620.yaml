      *   **User Profile:** Retired observational geophysicist. Comfortable with math/notation (Bayesian epistemology course), but new to philosophy of science. Values conceptual clarity alongside formal precision.
      *   **Topic:** The Problem of Old Evidence (POE) in Bayesian Confirmation Theory.
      *   **Specific Example:** Mercury's perihelion precession (classic case).
      *   **Specific Tasks:**
