      *   Start with Bayes' Theorem.
      *   Define "Old Evidence": $E$ is part of background knowledge $K$. So $P(E|K) = 1$.
      *   Show the collapse.
      *   *Nuance:* Need to distinguish between $P(E)$ (marginal) and $P(E|K)$ (conditional on background). In the standard POE setup, we condition on *all* knowledge, so $E$ is treated as certain.
      *   *Key Step:* If $P(E) = 1$, then $P(E|H) = 1$ (since $H$ cannot make a certainty uncertain).
      *   *Result:* Likelihood ratio is 1. Posterior equals Prior.

  4.  **Drafting Section (ii): Jeffrey Conditionalization:**
      *   What is it? Generalization of Bayes where $P(E)$ shifts from $P_{old}(E)$ to $P_{new}(E)$ without becoming 1.
      *   Why doesn't it solve POE? Because for *old* evidence, the probability *has* already gone to 1. There is no shift left to model. Jeffrey conditioning models *learning* uncertain evidence. If the evidence is already fully believed ($P=1$), there's no update to perform on $E$ itself.
      *   *Crucial Point:* The problem isn't uncertainty about $E$; it's that $E$ is *already* in the background. Jeffrey conditioning requires a change in $P(E)$. If $P(E)$ is static at 1, the formula yields no change in $P(H)$.

  5.  **Drafting Section (iii): Background Knowledge and Independence:**
      *   This is the heart of the conceptual nuance.
      *   *The "K" distinction:* We need to separate the knowledge that $E$ is *true* from the knowledge that $H$ *entails* $E$.
      *   *Garber's Approach:* Distinguish between $E$ (the sentence) and the logical relation $H \to E$.
      *   *Independence:* Does it matter that $E$ was found independently? Yes, it prevents ad-hocery. But in strict Bayesian terms, if $P(E)=1$, independence doesn't mathematically save the likelihood ratio.
      *   *Concept:* The confirmation comes not from learning $E$, but from learning the *connection* between $H$ and $E$.

  6.  **Drafting Section (iv): Solutions and Assessment:**
      *   *Solution 1: The Counterfactual/Historical Approach (Howson, etc.).* What if we *didn't* know $E$? Calculate $P(H|E)$ in a state where $E$ is uncertain.
          *   *Critique:* Hard to define the "prior" state objectively.
      *   *Solution 2: The Logical/Learning Approach (Garber, Jeffrey).* We update on the logical fact $(H \to E)$, not on $E$ itself.
          *   *Mechanism:* $P(H | H \to E) > P(H)$.
          *   *Critique:* Requires relaxing logical omniscience (agents don't know all logical consequences of their theories).
