  So I was reading about decision theory on some random blog post and I stumbled on this thing called the Pasadena lottery, which is basically where you flip a fair coin until it lands heads and you get 2^n dollars where n is how many flips it took. And I got really confused because some sources say the expected value of this is infinite while others say it's undefined, and I cant tell if they're just being sloppy with words or if there's an actual technical difference between the two claims. Like, I get that the sum of all the payouts times their probabilities never settles down, but I dont know if that makes the expected value "infinity" or "doesn't exist," and I feel like that distinction might matter for whether expected utility theory is actually making a crazy recommendation here (the "you should pay any finite amount to play" thing) or if the whole setup is just ill-posed.

