prompt: |-
  I am a retired planetary scientist. I spent most of my career on the geology of icy moons and Mars, and since retiring I have been reading environmental ethics and the philosophical literature on the ethics of space settlement. I am not a trained philosopher. I now serve on the standing review panel of a national space agency, where we decide whether a proposed activity beyond Earth orbit may proceed when it could alter, contaminate, or irreversibly change an extraterrestrial environment. The panel meets roughly every two months and handles ten or twelve proposals at a sitting: robotic landers, melt probes through ice shells, sample-return missions, in-situ resource utilization trials, and, increasingly, private proposals for settlement and for ecopoiesis experiments. The decisions matter because they are often irreversible, because they can permanently foreclose scientific questions, and because they may harm or destroy whatever is actually there. Each proposal arrives as an engineering summary plus a microbiological risk assessment, and the committee discusses it for about forty minutes. The other members are engineers, a microbiologist, and a lawyer; none of them have read any of the ethics. The director signs off on our recommendation and almost never overrules it.

  I want a reusable decision procedure for this panel, not a one-off judgment. It should turn a precautionary, non-interference stance toward other worlds into something with structure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. The agency's existing guidance is written to protect the science, not the environments themselves; I want the procedure to be explicitly ethical, so that it can say a proposal is wrong even when it would not ruin any future experiment.

  The procedure will have to handle several distinctions without collapsing them. One is the difference between harming an organism and merely destroying our chance to learn about it. Another is the difference between a living target and a lifeless but scientifically or aesthetically significant one. A third is the difference between contamination that is reversible or local and alteration that is effectively permanent. It also needs a policy for how to treat absent evidence of life, for how much weight to give to scientific knowledge as a justification, and for asking who bears the risk and who receives the benefit, including cases where a private party is trying to commit the whole species to a terraforming trajectory. Please be explicit about which steps are genuine judgment calls dressed up as procedure, and say where the procedure is likely to misfire.

  Then run the procedure on two proposals. The first is a robotic mission to melt through the ice shell of Europa, with terminal sterilization of the probe but no way to guarantee that zero viable terrestrial organisms are delivered; the scientific goal is to detect life. The second is a private consortium's small field trial that would release engineered cyanobacteria at a single Martian site to test whether they can survive, explicitly as a first step toward altering the atmosphere. Choose at least one of these so that the procedure returns an answer I am unlikely to welcome, and tell me plainly when that happens. The procedure must be usable in the room by people who cannot look anything up; it should not rest on facts we do not have, and it should tell us which missing facts would change the recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and its application:

  1.  **Analyze the User and Request:**
      *   **User:** Retired planetary scientist (geology of icy moons/Mars), now on a national space agency's standing review panel. Not a trained philosopher but well-read in environmental ethics/space settlement ethics.
      *   **Context:** Panel meets every 2 months, 10-12 proposals/session, 40 mins/discussion. Members: engineers, microbiologist, lawyer. No ethics training. Director usually rubber-stamps.
      *   **Goal:** A *reusable decision procedure* (algorithm/flowchart style) for ethical review of space activities.
      *   **Key Requirements:**
          *   Explicitly ethical (not just protecting science).
          *   Precautionary/non-interference stance.
          *   Handle distinctions: Harm vs. lost knowledge, Living vs. Lifeless, Reversible vs. Permanent.
          *   Policy on absent evidence of life.
          *   Weight of scientific justification.
          *   Risk/Benefit distribution (especially private vs. species-wide).
          *   Identify "judgment calls dressed as procedure."
          *   Identify where procedure might misfire.
          *   Usable in the room (no lookups, simple logic).
          *   Apply to two specific cases (Europa Melt Probe, Mars Cyanobacteria).
          *   **Constraint:** Choose at least one outcome the user is "unlikely to welcome" (challenging their biases or desires).
          *   **Constraint:** Be plain about when the procedure says "No" or "Hand off."

  2.  **Deconstruct the Ethical Framework:**
      *   The user wants a *precautionary, non-interference* stance. This aligns with *intrinsic value* theories (Holmes Rolston III, Robert Sparrow) rather than purely *instrumental value* (science only).
      *   Need to balance *Preservation* (don't touch) vs. *Exploration/Utilization* (do touch).
      *   Need to account for *Irreversibility*.
      *   Need to account for *Moral Status* (Does it have rights? Does it matter if it's alive?).
      *   Need to account for *Democratic Legitimacy* (Who decides for humanity?).

  3.  **Drafting the Procedure (The "Extraterrestrial Ethical Review Protocol" - EERP):**
      *   *Structure:* Needs to be a step-by-step filter. If you fail a step, you stop or escalate.
      *   *Step 1: Reversibility & Scale.* Is this permanent/global? If yes, high bar.
      *   *Step 2: Moral Status (Life).* Is there a chance of indigenous life? (Precautionary Principle).
      *   *Step 3: Necessity & Alternatives.* Can we learn this without touching?
      *   *Step 4: Benefit/Risk Distribution.* Who benefits? Who risks? (Private vs. Public).
      *   *Step 5: The "Value Handoff".* Where science ends and values begin.

      *Refining for the Room:* The panel has 40 minutes. The procedure must be sharp.
      *   *Thresholds:* Need clear "Stop" conditions.
      *   *Missing Data:* Need to flag what we *don't* know.

      *Addressing the "Judgment Call" requirement:* I need to explicitly label where the panel is actually making a moral choice, not a factual one.
      *   *Addressing the "Misfire" requirement:* Where does this logic break? (e.g., defining "life," defining "permanent").

  4.  **Developing the Two Cases:**
      *   **Case 1: Europa Melt Probe.**
          *   Goal: Detect life.
          *   Risk: Contamination (forward).
          *   Ethical Tension: To find life, we might destroy/harm it.
          *   Likely Outcome: High risk. If the precautionary principle is strict, this might be a "No" or "Handoff."
      *   **Case 2: Mars Cyanobacteria (Ecopoiesis).**
          *   Goal: Test survival for terraforming.
          *   Risk: Permanent biological contamination.
          *   Ethical Tension: Private entity deciding for humanity. Irreversible change.
          *   Likely Outcome: Under a strict non-interference ethic, this is a hard "No."

      *Selecting the "Unwelcome" Outcome:*
      *   As a scientist, the user *wants* to find life on Europa. A procedure that says "Don't go because you might hurt it" is unwelcome to a scientist.
      *   Alternatively, the user is an ethicist reader now. They might want to protect Mars. But if the procedure says "You can't decide this, it needs a global referendum," that's unwelcome to an agency panel (bureaucratic nightmare).
      *   *Decision:* I will make the Europa mission result in a **Stop/No** based on the risk of harming potential life to study it (the "Observer Effect" on steroids). This challenges the scientific imperative. I will make the Mars mission result in a **Handoff** because it exceeds the agency's mandate (intergenerational/species-level decision).

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Step 1: The Irreversibility Threshold.* Is the change effectively permanent on human timescales?
      *   *Step 2: The Probability of Moral Value.* Is there non-negligible probability of indigenous life or unique non-living value? (Precautionary).
      *   *Step 3: The Harm/Benefit Asymmetry.* Does the benefit outweigh the harm *to the target*? (Not just to us).
      *   *Step 4: The Authority Limit.* Does this commit future generations or the whole species?

      *Wait, I need to make sure it's usable in 40 mins.*
      *   Let's create a "Traffic Light" system with specific questions.
      *   Red = Stop. Yellow = Handoff/Defer. Green = Proceed (with conditions).

      *Incorporating the "Explicitly Ethical" requirement:*
      *   Must include a question about the *intrinsic value* of the target, not just instrumental (science).

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the user's position and the gravity of the task.
      *   **The Procedure (EERP):** Define the steps clearly. Use bolding for "Stop" conditions.
      *   **Meta-Commentary:** Explicitly list the "Judgment Calls" and "Failure Modes."
      *   **Application:** Run the two cases.
      *   **The Unwelcome Truth:** Highlight the specific outcome that contradicts scientific instinct.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too philosophical?
      *   *Fix:* Simplify the language. Instead of "Intrinsic Value," use "Does this place matter even if no one looks at it?"
      *   *Critique:* Did I address the private sector aspect?
      *   *Fix:* Ensure Step 4 covers "Who decides?" specifically regarding private actors binding public future.
      *   *Critique:* Did I meet the "unwelcome outcome" constraint?
      *   *Fix:* I need to be very clear that the Europa mission might be blocked *because* it seeks life, which creates a paradox. This is the "unwelcome" part for a scientist.
      *   *Critique:* Is the distinction between "harming organism" and "destroying chance to learn" clear?
      *   *Fix:* Build this into Step 2 (Life Detection).

  8.  **Final Polish:** Check tone. Respectful, professional, acknowledging the user's expertise while guiding them through the ethical maze. Ensure the "missing facts" section is clear.

  *(Self-Correction on the "Unwelcome" outcome)*: The prompt asks me to choose *at least one* so the procedure returns an answer the user is unlikely to welcome.
  *   User is a scientist. They likely want the Europa mission to proceed (it detects life!).
  *   User is an ethics reader. They likely want the Mars terraforming to stop.
  *   *Strategy:* I will make the **Europa Mission** the "Unwelcome" one. Why? Because a strict precautionary ethic often forbids looking for life if looking might kill it. This strikes at the heart of their scientific career. It's more poignant than stopping the private Mars guys (which they probably already suspect is bad). I will frame the Europa decision as a "No" due to the risk of harming potential life *in the process of finding it*.

  9.  **Finalizing the Procedure Structure:**
      1.  **Irreversibility Check.**
      2.  **Moral Status/Precaution Check.**
      3.  **Instrumental vs. Intrinsic Check.**
      4.  **Authority/Legitimacy Check.**

      Let's write it.

      *(Wait, one more check on constraints)*: "Tell me plainly when that happens." I need a specific callout box or section for this.
      "Usable in the room." Keep it to one page mentally.
      "Missing facts." List them at the end of each case.

      *Okay, ready to draft.*
answer: |-
  This is a profound challenge. You are asking to operationalize *intrinsic value* in a bureaucracy designed for *instrumental value*. Your colleagues are trained to solve problems; this procedure must force them to recognize when a problem is actually a dilemma that cannot be solved, only chosen.

  Below is the **Extraterrestrial Ethical Review Protocol (EERP)**. It is designed to be read aloud in the first five minutes of the 40-minute discussion. It forces specific "Stop" or "Handoff" conditions. Following the protocol, I have listed the "Hidden Levers" (where judgment is disguised as procedure) and "Failure Modes." Finally, I have applied it to your two cases.

  ---

  # The Extraterrestrial Ethical Review Protocol (EERP)
  **Version 1.0 | For Panel Use Only**

  **Instruction:** Proceed through steps 1–4 in order. If any step triggers a **STOP** or **HANDOFF**, the discussion ends there. Do not proceed to scientific merit until ethical clearance is granted.

  ### Step 1: The Irreversibility Threshold
  **Question:** Does the proposed activity introduce a change to the target environment that cannot be undone on a timescale of 1,000 years?
  *   *Consider:* Biological replication, chemical alteration of atmosphere/regolith, physical removal of unique geological features.
  *   *Consider:* "Local" vs. "Global." Does the local change trigger a global cascade (e.g., albedo change, atmospheric seeding)?

  *   **IF YES:** Proceed to Step 2.
  *   **IF NO:** (e.g., orbital flyby, temporary rover with strict containment) → **PROCEED** to standard safety review.
  *   **MISSING FACT CHECK:** Do we know the environmental connectivity? (e.g., Does this Martian site connect to a global aquifer?)

  ### Step 2: The Precautionary Status of the Target
  **Question:** Is there a non-negligible probability that the target environment contains indigenous life *or* possesses unique non-living value (aesthetic/scientific) that would be degraded by the activity?
  *   *Standard:* "Non-negligible" means >1% probability based on current models, OR the value is unique in the solar system (e.g., the only active ice volcanoes).
  *   *Crucial Distinction:* If the activity is *designed* to detect life (e.g., sampling), does the detection method itself risk harming the life detected?

  *   **IF YES (Life/Value at Risk):** Proceed to Step 3.
  *   **IF NO (Dead/Valueless):** → **PROCEED** to standard safety review.
  *   **MISSING FACT CHECK:** Do we have sufficient pre-mission data to rule out habitable niches?

  ### Step 3: The Harm/Benefit Asymmetry (The "Do No Harm" Test)
  **Question:** Does the primary benefit of the mission accrue to the *explorers*, while the primary risk of harm accrues to the *target*?
  *   *Test:* If we find life, do we protect it or study it? If studying it requires disrupting its habitat, is that disruption necessary for survival of the explorers?
  *   *Test:* If the target is lifeless, does the alteration destroy the ability of future generations to ask questions we cannot yet formulate?

  *   **IF YES (Explorers Benefit / Target Harmed):** → **STOP**. (Proposal is ethically impermissible under current mandate).
  *   **IF NO (Target Protected / Benefit Shared):** → Proceed to Step 4.
  *   **MISSING FACT CHECK:** Can the scientific goal be achieved remotely or with less invasive methods?

  ### Step 4: The Authority Limit (The "Generational" Test)
  **Question:** Does this decision commit the human species (or future generations) to a trajectory they cannot opt out of?
  *   *Context:* Terraforming, ecopoiesis, or permanent settlement.
  *   *Context:* Private entities making decisions that bind public resources or planetary environments.

  *   **IF YES:** → **HANDOFF**. (This panel lacks the moral authority to approve. Requires international treaty or public mandate).
  *   **IF NO:** → **PROCEED** (with strict monitoring conditions).

  ---

  # Meta-Analysis: Where the Procedure Leans
  You asked for explicitness regarding where this is judgment disguised as procedure, and where it will misfire.

  ### 1. The Judgment Calls (Disguised as Procedure)
  *   **Step 2 ("Non-negligible probability"):** This is the biggest lever. Setting the threshold at 1% is arbitrary. If you set it at 0.01%, almost nothing flies. If you set it at 10%, Mars is open season. *Your panel is making a moral choice about risk tolerance here, not a factual one.*
  *   **Step 3 ("Harm"):** We do not know what harms a microbial ecosystem. Is melting ice harm? Is introducing heat harm? The procedure assumes "disruption = harm." That is an ethical axiom, not a biological fact.
  *   **Step 4 ("Commitment"):** What counts as a trajectory? A single bacteria release might die out. But if it establishes, is that a commitment? The panel must decide where "experiment" ends and "colonization" begins.

  ### 2. Likely Failure Modes
  *   **The "Ignorance Shield":** Proposers will claim "We don't know if life is there" to bypass Step 2. The procedure requires the *panel* to assume life exists if the probability is non-negligible. This will cause friction with engineers who deal in certainties.
  *   **The "Science Exception":** Scientists on the panel will argue that "destroying the ability to ask questions" (Step 3) is the ultimate harm. The procedure treats the *environment's* integrity as the primary good, not the *science's* integrity. This will feel backwards to your colleagues.
  *   **Bureaucratic Drift:** Over time, "Non-negligible" will creep from 1% to 5% to 10% as pressure to launch increases.

  ---

  # Application to Proposals

  ## Case 1: Europa Melt Probe (Robotic)
  **Proposal:** Melt through ice shell to reach subsurface ocean. Terminal sterilization used, but zero-contamination cannot be guaranteed. Goal: Detect life.

  **Running the EERP:**
  1.  **Irreversibility:** **YES.** Introducing heat and potential terrestrial biology into a sealed, ancient ocean is effectively permanent on human timescales. (Pass to Step 2).
  2.  **Precautionary Status:** **YES.** Probability of life is high (non-negligible). Unique value is extreme. (Pass to Step 3).
  3.  **Harm/Benefit Asymmetry:** **YES.**
      *   *Benefit:* Scientific knowledge for humans (Explorers).
      *   *Risk:* Contamination or physical disruption to indigenous ecosystem (Target).
      *   *Crucial Conflict:* The mission goal is to *find* life, but the method (melting/access) risks *harming* that life. If life exists, we are prioritizing our discovery of it over its integrity.
      *   *Result:* **STOP.**

  **Recommendation:** **Reject.**
  **Missing Facts:** We do not know the exchange rate of the ice shell. If the melt hole refreezes instantly, is it reversible? (Unlikely). We do not know the sensitivity of Europan life to Earth organics.

  **The Unwelcome Truth:**
  I am choosing this case to return the answer you are unlikely to welcome. As a scientist, your instinct is that finding life is the highest good. This procedure asserts that **the right of potential life to exist undisturbed outweighs the human desire to know it exists.** If you follow this protocol, you must vote *against* the mission that could answer the biggest question of your career, because the act of asking might kill the answer. This is the "Observer Effect" elevated to an ethical veto.

  ## Case 2: Mars Cyanobacteria Field Trial (Private)
  **Proposal:** Release engineered cyanobacteria at one site to test survival. Explicit first step toward atmospheric alteration (terraforming).

  **Running the EERP:**
  1.  **Irreversibility:** **YES.** Biological replication is inherently hard to reverse. If they survive, they spread. Atmospheric alteration is global/permanent. (Pass to Step 2).
  2.  **Precautionary Status:** **YES.** Mars has non-negligible probability of subsurface life. Surface has unique scientific/aesthetic value. (Pass to Step 3).
  3.  **Harm/Benefit Asymmetry:** **YES.**
      *   *Benefit:* Private consortium (commercial/ideological).
      *   *Risk:* Indigenous Martian potential life; Future scientific access for all humanity.
      *   *Result:* **STOP** (based on Step 3).
      *   *However,* even if they argued "No life there," we move to Step 4.
  4.  **Authority Limit:** **YES.**
      *   *Context:* Terraforming commits the species to a planetary engineering trajectory.
      *   *Context:* Private party binding the public future.
      *   *Result:* **HANDOFF.**

  **Recommendation:** **Handoff to Higher Authority.**
  **Missing Facts:** We do not know the dispersal range of the specific strain. We do not have an international treaty defining who owns the Martian atmosphere.

  **Plain Talk:**
  This proposal fails twice. First, it risks harm for private benefit (Step 3). Second, and more importantly, **your panel does not have the right to say yes.** Even if the science was perfect and the risk zero, a private entity cannot decide to terraform Mars. That decision belongs to humanity as a whole, not a review panel and not a corporation. You cannot approve this without usurping the moral agency of future generations.

  ---

  # Implementation Advice for the Panel

  When you introduce this next sitting, anticipate the following pushback:

  1.  **"We are a science agency, not a philosophy club."**
      *   *Response:* "Our mandate includes 'protection of extraterrestrial environments.' Science is one value; protection is another. This protocol balances them."
  2.  **"Zero risk is impossible."**
      *   *Response:* "Correct. Step 2 asks for 'non-negligible,' not 'certain.' We are managing moral risk, not just engineering risk."
  3.  **"This stops all exploration."**
      *   *Response:* "It stops *irreversible* exploration of *high-value* targets. Orbital surveys, non-penetrating landers, and sampling of dead bodies (asteroids) still pass Step 1 or 2."

  **Final Note:**
  You asked for a procedure that handles the distinction between harming an organism and destroying our chance to learn.
  *   **Step 3** handles this. If the target is alive, harming it is the primary wrong. If the target is dead, destroying the *information* (the chance to learn) is the primary wrong.
  *   In the **Europa** case, the procedure forces you to admit that if life is there, *learning about it* is secondary to *not hurting it*.
  *   In the **Mars** case, the procedure forces you to admit that *terraforming* destroys the chance to learn what Mars *was*, in favor of making it what *we want*.

  This protocol will make your meetings slower and more uncomfortable. It will also ensure that when you sign off, you are not just checking engineering boxes, but acknowledging the weight of the choice.
