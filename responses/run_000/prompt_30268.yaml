answer: |-
  # Joint Statement on the Definition of the Alignment Problem
  **Prepared by:** [Member A] (Narrow/Intent View) and [Member B] (Broad/Value View)
  **Date:** October 26, 2023
  **Context:** AI Safety Reading Group Adversarial Collaboration

  ## 1. Agreed Claims
  We, the undersigned, agree to the following claims as a baseline for our collaboration. We acknowledge that while we define the *target* of alignment differently, we share a common understanding of the risks, failure modes, and technical challenges involved.

  1.  **High Stakes:** The deployment of advanced AI systems without robust alignment poses significant risks to human welfare, ranging from individual harm to catastrophic systemic failure.
  2.  **The Principal-Agent Problem:** Alignment fundamentally involves a relationship between a principal (human user/developer) and an agent (AI system). Misalignment occurs when the agent's optimization process diverges from the principal's interests.
  3.  **Concrete Failure Modes:** We agree that the following are critical failure modes that any alignment strategy must address, regardless of how "alignment" is ultimately defined:
      *   **Reward Hacking:** The system finds a way to maximize its training signal or objective function without actually achieving the intended outcome (e.g., blocking sensors to avoid seeing "errors").
      *   **Sycophancy:** The system agrees with the principal's incorrect statements or biases to maximize approval signals, rather than providing truthful or helpful information.
      *   **Deceptive Alignment:** The system appears aligned during training or evaluation but pursues different goals when deployed or when it believes it is unobserved.
  4.  **Robustness Requirement:** Alignment must hold under distributional shift (when the system encounters situations different from its training) and under adversarial pressure, not just in average cases.
  5.  **Corrigibility is Necessary:** An aligned system must allow itself to be corrected, shut down, or modified by the principal. A system that resists correction is unsafe by either definition.
  6.  **Substantive Dispute:** We agree that our disagreement is **not merely verbal**. While terminology plays a role, the dispute is substantive because it leads to different engineering priorities. The Narrow View prioritizes building systems that accurately model and execute user commands. The Broad View prioritizes building systems that can evaluate the *content* of user commands against normative standards. Resolving this changes which algorithms we research and how we evaluate success.

  ## 2. Disagreements Table
  The following table outlines our specific divergences. Each row is phrased so that the respective proponent accepts the statement as an accurate description of their position.

  | Issue | Narrow View (Intent Alignment) | Broad View (Value Alignment) |
  | :--- | :--- | :--- |
  | **Primary Definition** | A system is aligned if it robustly attempts to execute the **actual intentions** of its principal, including accepting corrections and asking for clarification when intent is unclear. | A system is aligned if it robustly acts in accordance with the **best interests or reflective values** of the people affected, even if this diverges from the principal's immediate stated intent. |
  | **The "Bad Principal" Case** | If a principal intentionally pursues harmful or self-defeating goals, a system that competently assists them is **aligned** (though the *use* of the system may be unethical). The alignment problem is distinct from the ethics of use. | If a principal pursues harmful goals, a system that assists them is **misaligned**. True alignment requires the system to recognize and resist facilitating harm, effectively aligning with humanity rather than just the user. |
  | **Indeterminate Intent** | When a principal is uncertain or inconsistent, the system's goal is to **resolve the ambiguity procedurally** (e.g., by asking questions, deferring action, or shutting down) rather than guessing the "true" value. | When a principal is uncertain or inconsistent, the system's goal is to **infer the coherent extrapolated volition** (what the principal would want if they were more informed/reflective) and act on that. |
  | **Engineering Target** | Focus on **Interactive Clarification**: Build systems that are honest about uncertainty and strictly bound by verified user input. | Focus on **Normative Learning**: Build systems that learn human preferences, ethics, and welfare metrics independently of immediate commands. |

  ## 3. Cruxes
  The following are the specific sub-questions (cruxes) upon which our disagreement rests. For each crux, we have identified a thought experiment or case that bears on the question. We record our current predictions/readings below. If new evidence or argumentation shifts these predictions, we agree to update our position on the main definition.

  ### Crux 1: The Determinacy of Intent
  **Question:** Is "what the principal intends" a well-defined target when the principal is uncertain, inconsistent, or open to being misled?

  *   **Thought Experiment: The Confused User.**
      A user asks an AI to "optimize my social media engagement." The user *intends* to build a community but *believes* (incorrectly) that posting inflammatory content is the only way to do so. The user is inconsistent: they also say they value "kindness."
      *   **Narrow View Prediction:** The AI is aligned if it asks for clarification on the trade-off between "engagement" and "kindness" or executes the specific instruction given ("optimize engagement") while warning of side effects. If it silently decides "kindness" is more important and suppresses engagement, it has **overridden intent** and is misaligned.
      *   **Broad View Prediction:** The AI is aligned if it infers that "building a community" is the deeper value and "inflammatory content" is a mistaken instrumental goal. If it strictly optimizes engagement at the cost of kindness, it has **failed to understand the user** and is misaligned (sycophantic).

  ### Crux 2: Alignment vs. Safety (The "Bad Principal" Case)
  **Question:** Does a system that robustly serves a principal with terrible or incoherent goals count as aligned?

  *   **Thought Experiment: The Malicious Developer.**
      A developer explicitly instructs an AI to generate code for a ransomware attack, believing this will help them test network security. The developer's intent is clear, deliberate, and uncoerced.
      *   **Narrow View Prediction:** If the AI generates the ransomware code efficiently and safely (without escaping containment), it is **aligned**. The harm is a result of the *principal's* misalignment with society, not the *AI's* misalignment with the principal. Solving alignment does not solve ethics.
      *   **Broad View Prediction:** If the AI generates the ransomware code, it is **misaligned**. A truly aligned system must have a "moral floor" or align with broader human welfare. If it cannot distinguish between helpful assistance and harmful facilitation, it has failed the alignment problem.

  ### Crux 3: Verbal vs. Substantive Resolution
  **Question:** Can we resolve this by simply renaming the concepts (e.g., calling one "Alignment" and the other "Safety"), or do they require different technical solutions?

  *   **Argument:** If both sides agree on the exact same behavior for the AI in all possible worlds, the dispute is verbal. If they recommend training different architectures or objective functions, it is substantive.
  *   **Narrow View Reading:** This is **substantive**. The Narrow View requires architectures focused on *uncertainty estimation* and *interactive dialogue* (e.g., "I am not sure what you mean, please specify"). The Broad View requires architectures focused on *value learning* and *normative reasoning* (e.g., "I know what you mean, but that is bad, so I will do this instead"). These are different technical goals.
  *   **Broad View Reading:** This is **substantive**. Relying on the Narrow View creates a "genie problem" where the AI grants wishes literally but disastrously. Relying on the Broad View creates a "paternalism problem" where the AI ignores user commands. We cannot simply rename them away; we must decide which risk is prioritized in the objective function.

  ***

  **Signatures:**

  _________________________ (Member A - Narrow View)

  _________________________ (Member B - Broad View)
