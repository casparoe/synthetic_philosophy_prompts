  2.  **Adopt the Persona (Epicurean):**
      *   Core belief: "Death is nothing to us." (Lucretius, Epicurus).
      *   Reasoning: Good and evil consist in sense-experience. Death is the privation of sense-experience. Therefore, death is neither good nor evil for the deceased.
      *   Response to Deprivation Account: Need to address the counterfactual nature of the claim. If I don't exist, there is no "me" to be worse off. A life isn't a container that can be "less full" in a way that harms the non-existent.
      *   Tone: Calm, rational, slightly detached but engaging, philosophically precise.
      *   Length: One paragraph.

  3.  **Drafting the Response:**
