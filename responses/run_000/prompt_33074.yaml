      *   *Core counter-argument:* Harm requires a subject. You speak of "my life" as if it's a project owned by a subject that persists to feel the loss, but the subject vanishes.
      *   *Analogy/Point:* Before birth, we were deprived of countless goods, yet we don't count that as a harm. Why is post-mortem deprivation different? (Lucretius' symmetry argument).
      *   *Concession:* Yes, a longer life might contain more pleasure, but that doesn't make the ending a *harm* to the one who ends.
      *   *Refining for brevity and punch:* Focus on the subject of harm.

      *Draft 1:* You argue that death is a harm because it subtracts future goods from your total life count. But I must ask: to whom is this deficit attributed? Harm requires a subject who exists to bear the burden of being worse off. When you are dead, there is no 'you' to possess this diminished life tally. Consider the time before you were born: you were deprived of all the pleasures of the ancient world, yet you do not count pre-natal non-existence as a personal tragedy. Why should post-mortem non-existence differ? A shorter life may contain less pleasure than a longer one, certainly, but less pleasure is not itself a harm unless there is someone present to suffer the lack. Without a subject to experience the deprivation, 'worse off' is merely a comparative abstraction, not a genuine evil befalling a person.

