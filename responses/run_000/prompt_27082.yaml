          *   User says: "Real instances are easy."
          *   Counter: Often true (e.g., SAT solvers). But "easy" regions aren't guaranteed. Phase transitions exist. Also, adversaries (in security or competition) *create* worst-case instances.
      *   **Point 3: Resource Bounded Rationality.**
          *   Cognition isn't just about *can* it be done, but *can* it be done within a lifespan/energy budget.
