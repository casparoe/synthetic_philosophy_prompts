      *   *Claim 2:* "They call the qualities of the strong... evil, and they call their own qualities... good." -> **Correct.** This accurately describes the inversion of values.
      *   *Claim 3:* "This is the slave revolt in morality." -> **Correct.** Terminology is accurate.
      *   *Claim 4:* "The ascetic ideal is dangerous because it teaches people to deny this world and punish themselves for existing, which makes life seem worthless and can lead to self-hatred." -> **Mostly Correct.** It captures the life-denying aspect.
      *   *Claim 5:* "However, I think Nietzsche's point is that slave morality is objectively false because it is based on resentment rather than strength." -> **Problematic.** Nietzsche is generally anti-objective truth in morality. He doesn't claim slave morality is "objectively false" in a metaphysical sense; he claims it is *life-denying* or *decadent*. Calling it "objectively false" misunderstands his perspectivism.

  3.  **Evaluate against the Prompt:**
