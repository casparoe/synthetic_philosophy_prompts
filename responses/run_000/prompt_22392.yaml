      *   **Prompt Question:** 1. Explain how good/evil arises (First Treatise). 2. Why does he regard the ascetic ideal as a dangerous value (Third Treatise connection)?
      *   **Student Answer:** Provided in the prompt.
      *   **Output Requirements:** Score out of 10, specific comments justifying the score, identify correct/imprecise/mistaken parts, and explain what's needed for a top score.

  2.  **Analyze the Student Answer:**
