      *   **Topic:** The Frame Problem in AI/Philosophy of Mind.
      *   **Context:** After a good-faith adversarial collaboration.
      *   **Definitions:**
          *   *FM Camp:* Frame problem = representing persistence in logic of action (Situation Calculus, etc.). Solved/contained by nonmonotonic logics (circumscription, default logic, etc.).
          *   *Rel Camp:* Frame problem = cognitive relevance (Dennett/Fodor). How finite systems determine what matters. Nonmonotonic solutions presuppose relevance.
      *   **Format:**
          1.  Numbered Agreed-Claims Section (specific topics required).
          2.  Disagreements Table (one row per residual disagreement, specific wording).
          3.  Cruxes Identification (sub-questions, evidence needed, predictions).
          4.  Verbal Dispute Check (identify if any part is merely terminological).
      *   **Tone:** Neutral, precise, neither vacuous nor slanted.

  2.  **Deconstruct the Agreed-Claims Section:**
      *   *Requirement 1: Original formulation & why enumerating frame axioms is unacceptable.*
          *   Need to acknowledge McCarthy & Hayes (1969).
          *   Need to agree that $O(n \times m)$ axioms is computationally/knowledge-engineering infeasible.
      *   *Requirement 2: Distinction among Frame, Qualification, Ramification.*
          *   Frame: What stays the same.
          *   Qualification: Preconditions for success.
          *   Ramification: Indirect effects.
      *   *Requirement 3: What circumscription/default logic accomplish.*
          *   They minimize change/exceptions. They allow deriving persistence without explicit axioms for every pair.
      *   *Requirement 4: Yale Shooting Problem (YSP) & fixes.*
          *   YSP showed simple minimization fails (temporal ambiguity).
          *   Fixes (chronological minimization, etc.) work but assume a specific causal/temporal ordering.
      *   *Requirement 5: Deployed agent requirements.*
          *   Beyond derivation: efficiency, selection of context, resource bounds.

  3.  **Deconstruct the Disagreements Table:**
      *   Need to capture the core tension without strawmanning.
      *   *FM View:* The logical representation *is* the core conceptual hurdle; efficiency is a secondary implementation detail. Once the logic is right, the "intelligence" of persistence is captured.
      *   *Rel View:* The logic *presupposes* the hard part. Knowing *which* fluents to check for persistence is the real problem. The logic doesn't explain how the system finds the relevant axioms in the first place.
      *   *Avoid:* Reducing Rel to "holism is hard" or FM to "just engineering."

  4.  **Deconstruct the Cruxes:**
      *   What evidence would change minds?
      *   *Crux 1:* Scalability of Nonmonotonic Reasoning. If FM logics scale to human-level knowledge bases without pre-filtering, FM wins. If they require pre-filtering (relevance), Rel wins.
      *   *Crux 2:* Cognitive Plausibility. If human reasoning mirrors chronological minimization, FM gains ground. If human relevance detection is associative/heuristic prior to logical check, Rel gains ground.
      *   *Crux 3:* The "Solution" Definition. Is solving the representation sufficient for "solving the frame problem"?

  5.  **Deconstruct the Verbal Dispute Check:**
      *   Is it just about the name "Frame Problem"?
      *   *Analysis:* Yes, partially. FM says "We solved the Frame Problem (McCarthy/Hayes)." Rel says "That wasn't the *real* Frame Problem (Dennett/Fodor)."
      *   *Resolution:* Acknowledge the terminological split but isolate the substantive disagreement about *explanatory priority*.

  6.  **Drafting - Section by Section:**

      *   *Header:* Title, Signatories, Date.
      *   *Introduction:* Brief context of the collaboration.
      *   *Agreed Claims:* Drafting 5-6 points based on the requirements.
          *   *Drafting Claim 1 (Origins):* McCarthy/Hayes 1969. Combinatorial explosion of frame axioms.
          *   *Drafting Claim 2 (Distinctions):* Frame (persistence), Qualification (preconditions), Ramification (side effects). Distinct but related.
          *   *Drafting Claim 3 (Nonmonotonic):* Circumscription/Default Logic reduce axiom count. They formalize "no change unless specified."
          *   *Drafting Claim 4 (YSP):* Hanks & McDermott 1987. Showed naive minimization allows anomalous models. Chronological minimization fixes this but relies on causal/temporal preference.
          *   *Drafting Claim 5 (Deployment):* Logic provides correctness conditions. Agents also need search control, indexing, and resource management to operate in real time.
      *   *Disagreements Table:*
          *   *Row 1: Explanatory Priority.* FM: Logic is the foundation. Rel: Relevance selection is the foundation.
          *   *Row 2: Scope of "Solution".* FM: Representation solved = Problem solved. Rel: Representation solved = Problem restated.
          *   *Row 3: Cognitive Reality.* FM: Logic approximates cognitive architecture. Rel: Logic is a competence model, not performance.
      *   *Cruxes:*
          *   *Crux 1:* Computational Tractability of Global Consistency.
          *   *Crux 2:* The Source of Causal Structure.
      *   *Verbal Dispute:* Explicitly state that "Frame Problem" is used differently, but the substantive issue is the relationship between representation and search control.

  7.  **Refining and Polishing:**
      *   *Check Tone:* Is it too aggressive? Too soft? Needs to be "adversarial collaboration" style—rigorous but cooperative.
      *   *Check Definitions:* Ensure FM isn't painted as ignoring efficiency, and Rel isn't painted as anti-logic.
      *   *Check Constraints:* Did I cover YSP? Yes. Qualification/Ramification? Yes. Dennett/Fodor? Yes (in Disagreements).
      *   *Self-Correction on Cruxes:* Make sure the "evidence" is concrete. Not just "further research," but specific types of results (e.g., complexity bounds, psych experiments).
      *   *Self-Correction on Verbal Dispute:* Be careful not to dismiss the substantive issue as *only* verbal. The label matters for sociology of science, but the technical disagreement remains.

  8.  **Final Review against Prompt:**
