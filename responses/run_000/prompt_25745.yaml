      To settle our debate regarding the boundary between manipulation and legitimate persuasion, we have outlined the following joint statement. We begin with the claims we both accept as true. We agree that both manipulation and persuasion are forms of social influence aimed at changing another person's beliefs or behaviors. We agree that coercion, which involves threats or force, is distinct from both categories. We agree that manipulation is generally ethically problematic because it undermines the target's autonomy or agency in some way. We agree that not all influence is manipulation, and that there are cases of legitimate persuasion that respect the target's capacity for choice. We also agree that exploiting cognitive biases is a central feature of at least some paradigmatic cases of manipulation, and that hiding relevant information is generally deceptive.

      Having established our common ground, we now articulate the precise point of divergence. You maintain that the defining feature of manipulation is the method of influence, specifically whether that method bypasses or subverts the target's rational capacities. On your view, if an influence attempt engages the target's reason, even if the arguments are weak, partial, or emotionally charged, it counts as persuasion rather than manipulation. You classify exploitative tactics that work by short-circuiting deliberation as manipulation, but you classify bad arguments or cherry-picked evidence as merely poor persuasion. I maintain that the defining feature of manipulation is the visibility of the influence technique. On my view, an attempt counts as manipulation if it succeeds only because the target is unaware of how they are being influenced. I argue that even if rational capacities are engaged, the influence is manipulative if it relies on concealment, such that the target would reject the attempt if they knew the technique being used. For me, cherry-picking evidence is manipulative because it hides the full context, whereas for you it is simply a bad argument.

