answer: |-
  Reflection is binding only if you believe your future self will be epistemically rational and will retain all your current evidence, meaning you should reject it in the exam case just as you do in the drunk and dementia cases.

  The principle relies on two necessary conditions: information retention and rationality. Case 2 fails because of information loss (forgetting the pill), while Cases 3 and 6 fail because of known irrationality (alcohol and dementia). In these scenarios, your future self is not a reliable updater of your current information state, so their credences do not command your current deference. Case 1 and Case 4 satisfy both conditions; your future self in those scenarios is rational and possesses strictly more information, so deference is required. The "queasiness" in Case 4 is misplaced because deferring to a rational future self who has consulted a peer is simply equivalent to updating on the evidence you expect that conversation to provide.

  The exam case (Case 5) fails the rationality condition, despite the gain in evidence. You explicitly state that anxiety will distort your future judgment, which classifies your future self as an unreliable processor of that new evidence. The pull you feel to defer stems from conflating *access* to evidence with the *reliability* of processing it; while future-you sees the exam questions, present-you knows the mechanism evaluating those answers is compromised. Therefore, you should not set your current credence to match the expected anxious credence, but rather maintain your current rational assessment of the evidence you already possess.

  The intuitive difference between the exam case and the dementia case is psychological, not logical. Dementia presents as a global cognitive collapse, making the irrationality salient and absolute, whereas anxiety feels like a temporary state that might still contain signal amidst the noise. However, if you know in advance that the anxiety functions as a biasing distortion rather than a rational response to difficulty, it constitutes the same kind of epistemic defeater as dementia. To maintain consistency, you must treat known emotional distortion as a breakdown in rationality that voids the Reflection Principle.
