      *   **The "Exam Case" (5) Nuance:** This is the tricky one. It involves *both* new evidence (taking the exam) and known irrationality (anxiety). Standard Bayesianism says you should defer to a future self who is rational and has more evidence. If you know in advance that your future self will be irrational, you should *not* defer to that future self's specific credence, but you should defer to what your future self *would* have credence in *if they were rational*.
