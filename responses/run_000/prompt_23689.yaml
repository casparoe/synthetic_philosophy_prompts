      *   Math bit: Show Löb $\implies$ G2.
      *   Conceptual bit: Consistency vs. Soundness (Reflection). AI needs to know "Proof $\implies$ Truth," not just "No Proof of False."
      *   AI Alignment bit: The Tiling Agents problem. If you try to bypass Löb by strengthening the theory, you lose strength in the next generation. This is the "Obstacle."
      *   Conclusion: G2 is the symptom; Löb is the diagnosis.

  7.  **Final Polish:** Ensure tone is appropriate for a grad student (rigorous but explanatory). Avoid oversimplifying, but clarify the distinction. (Make sure to mention that $\text{Con}(T)$ is $\square \bot \to \bot$).

  *(Self-Correction during drafting)*: I should be careful not to say G2 is *useless*. It's the historical foundation. But for the specific mechanism of an agent reasoning about its own future outputs, Löb is the precise tool. The "Obstacle" is specifically about the inability to internalize the soundness principle.

