answer: |-
  You press upon a distinction that many overlook, my friend. Do not confuse the origin of a thing with its proper function. Yes, money exists by convention (*nomos*), not nature (*physis*), precisely because it is a tool for exchange, a guarantee that we can trade shoes for houses. But when you say wanting more of what is accepted is natural, you mistake the agreement of the crowd for the order of nature. The convention establishes the *measure*, but it does not justify making the measure the *end*.

  Consider the shoe again. It is for wearing. If you accumulate shoes beyond any possibility of wearing them, you are not using them as shoes, but as something else. So it is with money. Natural wealth-getting seeks goods needed for the household and the polis, and human need has a limit. Unnatural wealth-getting seeks money itself, which is merely a symbol of value. Since a symbol has no intrinsic limit, the desire for it becomes infinite (*apeiron*). Tell me, in your time, do men seek money to secure the good life, or do they seek money merely to have more of it, as if the count itself were the virtue?
