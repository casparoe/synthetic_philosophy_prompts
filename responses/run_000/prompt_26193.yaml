      *   *Side A (Bias/Irrationality):* Sunk costs shouldn't matter. Escalation is a cognitive error (loss aversion, self-justification).
      *   *Side B (Rational/Strategic):* Escalation makes sense if you include reputation, signaling, incomplete information, or dynamic consistency constraints.
      *   *Side C (Conceptual/Meta):* "Rationality" is the wrong lens, or the standard is ill-defined for dynamic contexts.

  3.  **Diagnose the Type of Disagreement:**
      *   Is it purely normative? No, because empirical claims about *why* agents act are crucial.
      *   Is it purely empirical? No, because the definition of "rational" is contested.
      *   *Core Diagnosis:* It's a **modeling disagreement disguised as a normative one**, compounded by **equivocation on the scope of the rationality predicate**.
      *   *Key Insight:* The "Dollar Auction" is a specific game form. Real-world escalation is a class of behaviors. The dispute arises when people map the formal model onto the real-world behavior without agreeing on the *boundary conditions* of the model.
      *   *Specific Tension:* *Local* rationality (myopic best response) vs. *Global* rationality (ex-ante planning). Also, *thin* rationality (preference satisfaction) vs. *thick* rationality (substantive goals).

  4.  **Drafting the Diagnosis (Section by Section):**

