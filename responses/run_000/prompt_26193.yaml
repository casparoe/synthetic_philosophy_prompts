  1.  **Analyze the User and the Request:**
      *   **User:** PhD student in philosophy, intersection of rational choice theory (RCT) and moral psychology.
      *   **Topic:** Dollar auction, escalation of commitment, sunk cost fallacy vs. rational justification.
      *   **Problem:** The debate is stagnant. Positions are mapped but entrenched.
      *   **Task:** Diagnose the *kind* of disagreement this is (normative, empirical, conceptual, etc.) and suggest what would count as *progress*.
