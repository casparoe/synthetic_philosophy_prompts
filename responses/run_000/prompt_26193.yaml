answer: |-
  This is a sophisticated impasse, and your intuition that the debate is "thoroughly mapped and nobody moves" is correct. The stagnation suggests that the disagreement is not merely about empirical frequency or normative preference, but about the **ontology of the model** and the **scope of the rationality predicate**.

  As a philosopher working at this intersection, you are well-positioned to see that the Dollar Auction (Shubik, 1971) and the empirical literature on Escalation of Commitment (Staw, 1976; Brockner, 1992) are often talking past one another. The former is a game-theoretic paradox regarding dynamic inconsistency; the latter is a behavioral regularity regarding post-decision justification.

  Here is a diagnosis of the disagreement, followed by a proposal for what constitutes genuine progress.

  ### I. Diagnosis: Three Layers of Equivocation

  The deadlock persists because participants are conflating three distinct layers of analysis. Disentangling them reveals that the dispute is not primarily about whether escalation is "good" or "bad," but about **model specification** and **attributive responsibility**.

  #### 1. The Boundary Problem (Model vs. Phenomenon)
  The most significant source of friction is the mapping between the formal model and the real-world phenomenon.
  *   **The Formalist View:** In the canonical Dollar Auction, the rules are common knowledge, there are no external payoffs, and the game ends definitively. In this closed system, escalation beyond the dollar value is strictly dominated *ex ante*, though locally optimal *ex post*.
  *   **The Empirical View:** Real-world escalation (Vietnam, R&D projects) occurs under uncertainty, with reputational stakes, audience costs, and ambiguous termination conditions.
  *   **The Disagreement:** When a theorist says, "Escalation is rational because of signaling," they are effectively arguing that **the real-world situation is not a Dollar Auction.** They have changed the payoff structure. When a psychologist says, "Escalation is irrational," they are holding the payoff structure constant (money lost is money lost) and blaming the cognitive processing.
  *   **Diagnosis:** This is a disagreement about **essentialism**. Is the "Dollar Auction" defined by its payoff matrix (money only), or by its dynamic structure (sunk costs + competitive trap)? If the latter, adding reputation changes the *context* but not the *phenomenon*. If the former, adding reputation creates a *different game*. The literature rarely specifies which definition is in play.

  #### 2. The Normative Metric (Consistency vs. Welfare)
  What counts as a "mistake"?
  *   **Dynamic Consistency:** Some argue rationality is merely internal coherence over time (Strotz, 1955). If I plan to stop at \$0.90 but bid \$1.00 to avoid losing \$0.95, am I inconsistent? Only if my preferences changed. If my preference is "minimize loss," the bid is consistent.
  *   **Substantive Welfare:** Others argue rationality requires maximizing ex-ante expected utility. If the strategy leads to ruin, it was irrational, regardless of local consistency.
  *   **Diagnosis:** The debate stalls because one side is defending **procedural rationality** (the reasoning was valid given the local constraints) while the other attacks **substantive rationality** (the outcome was disastrous). Without agreeing on whether rationality is a property of the *process* or the *outcome*, no resolution is possible.

  #### 3. The Conception of Agency (Naive vs. Resolute)
  This is where your background in philosophy is most critical. The Dollar Auction exploits a specific weakness in **sophisticated choice** (agents who predict their future irrationality but cannot bind themselves).
  *   **The Standard View:** Agents are naive or sophisticated but lack binding technology.
  *   **The Resolute View:** McClennen (1990) and Bratman (1987) argue that rational agents can adopt **resolute choices**—plans that constrain future deliberation. If an agent *could* have been resolute but wasn't, is that irrationality or a lack of will?
  *   **Diagnosis:** Much of the "rational justification" literature implicitly assumes a **fragmented self** (time-slices with different utility functions), while the "bias" literature assumes a **unified self** that *ought* to maximize global utility. The disagreement is metaphysical: *What kind of agent are we modeling?*

  ### II. Why the Debate is Stagnant

  The debate is stagnant because it has become a **motte-and-bailey regarding the Utility Function.**

  *   **The Motte (Trivial Truth):** "If an agent values reputation or loss-avoidance sufficiently high, escalation is utility-maximizing." (Formalists/Economists)
  *   **The Bailey (Controversial Claim):** "Therefore, real-world escalation is often rational and not a bias."
  *   **The Counter-Motte:** "If we define utility strictly as monetary payoff, escalation is irrational." (Psychologists)
  *   **The Counter-Bailey:** "Therefore, humans are systematically biased."

  As long as "rationality" is defined as "maximizing *some* utility function," the Formalist wins tautologically (revealed preference). As long as "rationality" implies "achieving *stated* goals without self-sabotage," the Psychologist wins. The term "rationality" is doing too much work, conflating **predictive accuracy** (can we model this?) with **normative endorsement** (should we do this?).

  ### III. Pathways to Progress

  Given this diagnosis, a new experimental paradigm or formal result is unlikely to settle the dispute, as both sides will simply incorporate the new data into their existing utility functions or boundary conditions. Progress requires **conceptual reconstruction**.

  Here are three specific avenues for progress, ranked by feasibility and impact:

  #### 1. Shift from "Rationality" to "Vulnerability" (Mechanism Design)
  Instead of asking "Is the agent rational?", ask "Is the **environment** hostile to rational agency?"
  *   **The Move:** Treat the Dollar Auction not as a test of the agent, but as a **pathological choice architecture**.
  *   **Progress:** This aligns with Thaler's Nudge but deepens it philosophically. It acknowledges that even *perfectly* rational agents (in the local sense) can be trapped by specific dynamic structures.
  *   **Research Question:** What structural features (e.g., lack of binding commitments, opacity of termination points, competitive framing) transform a benign decision tree into a trap? This moves the normative burden from the *agent* to the *institution*.

  #### 2. Diachronic Agency and Moral Responsibility
  Since you work in moral psychology, this is your strongest lever. The escalation debate is implicitly about **blame**.
  *   **The Move:** Distinguish between **Rationality** (instrumental efficiency) and **Responsibility** (attributability).
  *   **Progress:** An agent can be instrumentally rational (locally optimal) yet morally or administratively culpable for entering the trap. We blame managers for escalation not because they failed to maximize utility (they might have, given reputational stakes), but because they failed in **stewardship** or **pre-commitment**.
  *   **Research Question:** Develop a normative framework where "rational escalation" is still a **vice**. This requires decoupling rationality from normativity. You could argue that a rational agent *ought* to recognize the trap and refuse to play, making entry into the auction the primary irrational act, not the escalation itself.

  #### 3. Ecological Rationality and the "Adaptive" Defense
  The "rational learning" defense often fails because it is too permissive. Tighten it using Ecological Rationality (Gigerenzer et al.).
  *   **The Move:** Don't ask if the behavior is rational *in the model*; ask if the heuristic is adaptive *in the environment where it evolved*.
  *   **Progress:** Escalation might be a "fast and frugal" heuristic that works in high-trust, repeated-play environments (where signaling commitment pays off) but fails in low-trust, one-off markets (the Dollar Auction).
  *   **Research Question:** Identify the **ecological niche** where escalation is adaptive. If the modern managerial environment differs from that niche, the diagnosis is not "irrationality" but **mismatch**. This dissolves the "bias vs. rationality" dichotomy into "fit vs. misfit."

  ### IV. Recommendation for Your Work

  If you want to break the deadlock, I suggest focusing on **Avenue 2 (Diachronic Agency)**.

  The literature is saturated with arguments about payoff structures. It is starved for rigorous analysis of **temporal agency**. The Dollar Auction is fundamentally a problem of **diachronic self-governance**.

  **A Proposed Thesis:**
  Argue that the standard definition of rationality in this debate is **synchronic** (optimizing at time *t*), whereas the phenomenon requires a **diachronic** standard (optimizing across *t1...tn*).
  *   Show that "local rationality" is a category error in dynamic traps.
  *   Propose that **Resolute Choice** is not just an option, but a *requirement* for rationality in irreversible contexts.
  *   Conclude that agents who escalate are not "rationally signaling"; they are suffering from **diachronic fragmentation**.

  This allows you to concede the Formalist's point (the math works locally) while validating the Psychologist's intuition (the behavior is defective), by locating the defect in the **constitution of the agent over time** rather than the calculus of the bid.

  **What counts as progress here?**
  A conceptual framework that allows us to say: *"The agent was locally rational, globally self-defeating, and culpable for failing to bind their future self."* This preserves the insights of RCT without absolving the agent of the error that the empirical literature correctly identifies.

  ### Summary
  The disagreement is a **category mistake regarding the locus of evaluation**.
  *   **Formalists** evaluate the *move* (given the state).
  *   **Psychologists** evaluate the *strategy* (given the goal).
  *   **Progress** comes from evaluating the *agent's capacity for diachronic self-binding*.

  If you can formalize the normative cost of **diachronic fragmentation**, you provide a standard that explains why escalation feels like a mistake even when it can be modeled as an equilibrium. That is a philosophical contribution that RCT and Psychology cannot generate on their own.
