answer: |-
  **Theoretical Context:** The Kalai–Smorodinsky (KS) solution is not the consensus standard; the Nash Bargaining Solution is more prevalent. KS is contested because it sacrifices Independence of Irrelevant Alternatives to satisfy Individual Monotonicity. Use KS only if parties agree that preserving proportional gains relative to potential is fairer than maximizing the product of gains.

  **Mediation Procedure**

  1.  **Establish Disagreement Points ($d$):** Quantify the value each party receives if no deal is reached (BATNA).
      *   *Judgment Call:* Valuing non-monetary BATNAs (e.g., reputation). *Disagreement:* Use objective market proxies or mediator estimation.
  2.  **Determine Ideal Points ($u^*$):** Identify the maximum feasible value each party could receive *assuming the other receives exactly $d$*.
      *   *Judgment Call:* Distinguishing "feasible" from "aspirational." *Disagreement:* Cap ideals at physically or legally possible maximums.
      *   *Utility Note:* KS requires cardinal utility. Using money assumes risk neutrality. If risk attitudes differ, adjust values via certainty equivalents.
  3.  **Normalize Gains:** Calculate Potential Gain $G_i = u^*_i - d_i$. Express any proposed outcome $x_i$ as a proportion: $P_i = (x_i - d_i) / G_i$.
  4.  **Equalize Proportions:** Select the feasible outcome where $P_1 \approx P_2$.
      *   *Discrete Sets:* If options are discrete (e.g., specific equity splits), choose the option minimizing $|P_1 - P_2|$. Do not interpolate unless parties agree to create a hybrid option.

  **Counterintuitive Risk:** KS rewards higher ideal points. If Party A inflates their "maximum plausible need," KS awards them a larger share, even if unjustified. This violates fairness norms regarding entitlement.
  *   *Handling:* Scrutinize $u^*$ rigorously. Require evidence for maximum claims. If parties suspect gaming, revert to Nash or equal split.

  **Worked Examples**

  **(1) Co-Founders Dividing Equity**
  *   **Inputs:** Dissolution value ($d$) = 0% for both. Feasible equity sums to 100%. Due to investor constraints, Founder A (Capital) can technically hold max 80%, Founder B (Labor) max 60% (individual caps).
  *   **Calculation:** $G_A = 80$, $G_B = 60$. KS seeks equal % of gain. Let split be $(e_A, e_B)$. Equation: $e_A/80 = e_B/60$ subject to $e_A + e_B = 100$.
  *   **Result:** $e_A = 57.1\%$, $e_B = 42.9\%$.
  *   **Analysis:** Unlike Nash (often 50/50 on linear frontiers), KS respects asymmetric caps. If A's cap was artificial, this result is unfair.

  **(2) Academic Departments Splitting Budget**
  *   **Inputs:** Fixed budget \$100k. Disagreement ($d$) = \$0 (status quo lost). Dept A claims max need \$100k; Dept B claims \$50k.
  *   **Calculation:** $G_A = 100k$, $G_B = 50k$. Ratio 2:1. KS allocates budget to meet equal % of need.
  *   **Result:** A gets \$66.7k, B gets \$33.3k (both meet 66.7% of claimed need).
  *   **Analysis:** Efficient regarding proportional satisfaction. However, if B artificially lowered their claim to appear modest, they are penalized. Verify needs independently before applying KS.

  **Conclusion:** KS is powerful for monotonicity but vulnerable to aspiration manipulation. Transparency in defining $u^*$ is critical.
