prompt: |-
  ok so i'm running a philosophy reading group for grad students from other departments — mostly physicists and computer scientists, so they're sharp but haven't done formal epistemology. next week i'm doing the Sleeping Beauty problem and self-locating belief. i've got an hour and a half.

  don't explain the problem to me. i need you to plan how i should teach it. what has to come first, what has to be in place before the puzzle even bites, what example or variant should carry the whole session. i'm especially worried about the physicists assuming the answer is obviously 1/2 and the computer scientists assuming it's obviously 1/3 and both of them thinking the other side is just confused about conditional probability. what misconceptions should i expect from each camp, and at what point in the sequence do i head each one off. what's the one thing i should get them to do or answer at the end so i know whether they've actually understood what's at stake rather than just picked a side. and what should i openly refuse to settle — like, which part of the debate do i flag as genuinely unresolved versus which part is just people talking past eachother.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Grad students (Physicists & Computer Scientists). Sharp, quantitative, but no formal epistemology.
      *   **Topic:** Sleeping Beauty Problem (Self-Locating Belief).
      *   **Time:** 90 minutes.
      *   **Constraints:** Do *not* explain the problem (user knows it). Focus on pedagogy/structure.
      *   **Key Concerns:**
          *   Physicists $\to$ Halfer (1/2).
          *   CS $\to$ Thirder (1/3).
          *   Both think the other is bad at conditional probability.
          *   Need to anticipate misconceptions for each group.
          *   Need a specific "check for understanding" at the end.
          *   Need to distinguish between "talking past each other" vs. "genuine unresolved debate."
          *   Need a central example/variant to carry the session.

  2.  **Deconstruct the Audience & Their Biases:**
      *   *Physicists:* Often lean towards objective chance/frequency. If the coin is fair, $P(H) = 1/2$. Waking up provides no *new* physical information about the coin toss itself. They might view "self-location" as irrelevant noise.
          *   *Misconception:* Confusing the probability of the *coin* with the probability of the *observation*. Ignoring the sampling bias introduced by the protocol.
      *   *Computer Scientists:* Often lean towards Bayesian updating, observer moments, or simulation analogies. They see three possible waking states (H-Mon, T-Mon, T-Tue). They treat indexical information ("I am awake now") as data.
          *   *Misconception:* Treating indistinguishable observer moments as distinct equiprobable worlds without justifying the reference class. Over-updating on indexical information.
      *   *Common Ground:* Both are good at math, bad at metaphysics of identity/time. Both think it's a calculation error, not a modeling error.

  3.  **Determine the Pedagogical Arc (90 mins):**
      *   *0-15 min:* Setup & Intuition Pump (avoiding the standard formulation initially to prevent immediate dig-in).
      *   *15-45 min:* The Core Conflict (Formalizing the disagreement).
      *   *45-70 min:* The Variant that breaks the deadlock (The "Sabotage" or "Betting" angle).
      *   *70-85 min:* Meta-epistemology (What is actually being disputed?).
      *   *85-90 min:* Exit Ticket/Check.

  4.  **Select the Central Variant:**
      *   The standard SB problem is too abstract.
      *   *Idea:* Betting arguments are standard but often devolve into utility vs. belief.
      *   *Idea:* The "Incubator" variant (Nick Bostrom) is good for CS.
      *   *Idea:* The "Extreme Sleeping Beauty" (1 million awakenings on Tails) is the best intuition pump to force Halfers to sweat.
      *   *Decision:* Use the **Extreme Sleeping Beauty** variant as the main lever. It makes the 1/2 position look absurd to everyone, forcing a deeper justification than "fair coin."
      *   *Secondary Lever:* **Betting**. Physicists love operationalization. If you bet every awakening, Thirders win money. Halfers have to argue why rational belief doesn't track rational betting.

  5.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Pre-empting the "Math Fight" (0-20 mins).**
          *   Don't start with SB. Start with *Self-Location*.
          *   Use a simpler case: "The Amnesia Room."
          *   Goal: Show that $P(Coin)$ $\neq$ $P(Coin | I am in this specific awakening)$.
          *   Address the Physicist bias: The coin is fair, but the *sample* is biased.
          *   Address the CS bias: Observer moments aren't automatically equiprobable worlds.

      *   **Phase 2: The Standard Problem & The Divide (20-50 mins).**
          *   Present SB.
          *   Let them argue briefly (5 mins).
          *   Intervene: Map the arguments.
          *   Halfer Argument: No new *relevant* information. (Physicist home turf).
          *   Thirder Argument: Long-run frequency of awakenings. (CS home turf).
          *   *Crucial Move:* Show that both calculate conditional probability correctly *given their model*. The fight is about the *sample space*, not the algebra.

      *   **Phase 3: The Stress Test (Extreme SB + Betting) (50-75 mins).**
          *   Switch to 1 Head / 1,000,000 Tails awakenings.
          *   Ask: "What credence do you assign to Heads?"
          *   If they say 1/2, introduce the Betting Dutch Book.
          *   If they say ~0, ask: "Did the coin become unfair?"
          *   This forces the distinction between *Credence* and *Objective Chance*.

      *   **Phase 4: The Meta-Question (75-85 mins).**
          *   What is "belief" here?
          *   Is it about predicting the coin? Or predicting the *experience*?
          *   Distinguish: "What is the chance the coin landed H?" vs "What is the chance this awakening is associated with H?"
          *   This is the "talking past each other" part.

      *   **Phase 5: The Exit Ticket (85-90 mins).**
          *   Need a question that isn't "1/2 or 1/3?"
          *   Ask them to define the *conditioning event*.
          *   Or: "Under what protocol would you switch your answer?"

  6.  **Refining the Misconceptions:**
      *   *Physicists:* Think "Information" means physical signal. Need to show indexical info *is* info.
      *   *CS:* Think "States" are ontological. Need to show reference class problems.
      *   *Both:* Think the other is bad at Bayes. Need to show they are using different Priors/Sample Spaces.

  7.  **Refining the "Unresolved" vs. "Talking Past":**
      *   *Talking Past:* Definition of "credence." Is it betting odds? Is it objective chance?
      *   *Unresolved:* How to formalize self-locating belief in a general theory (SSA vs. SIA).

  8.  **Review against Constraints:**
      *   90 mins? Yes, timing looks tight but doable.
      *   No problem explanation? Yes, assume they know SB.
      *   Address specific dept biases? Yes.
      *   Exit ticket? Yes.

  9.  **Final Polish:**
      *   Make sure the tone is appropriate for grad students (respectful, challenging, not condescending).
      *   Emphasize that the *math* isn't the hard part, the *modeling* is.
      *   Ensure the "Extreme Variant" is highlighted as the key teaching tool.

  **(Self-Correction during drafting):** I initially thought about using the "Technicolor Beauty" variant. But that might get too technical too fast. "Extreme Beauty" is better for gut-checking the 1/2 intuition. I also need to make sure I don't just let them bet. Betting arguments can be countered by "utility functions." I need to frame betting as a *test of coherence*, not just money.
  Actually, the best way to stop the "bad math" accusation is to write both Bayes derivations on the board and show they are both valid *internally*. The conflict is $P(E|H)$ vs $P(E)$.

  Let's finalize the Exit Ticket. It needs to be diagnostic. "Write down the exact proposition $E$ you are conditioning on." If they can't define $E$, they haven't grasped the epistemological issue.

  Okay, ready to write.
answer: |-
  Here is a 90-minute lesson plan designed specifically for a quantitative audience that views this as a calculation error rather than a modeling problem.

  ### **Session Goal**
  Move the group from arguing about **arithmetic** (who applied Bayes' rule correctly?) to arguing about **modeling** (what constitutes the sample space and the conditioning event?).

  ### **The Central Variant: "Extreme Sleeping Beauty"**
  Do not spend the whole hour on the standard 1/2 vs. 1/3 case. It is too balanced.
  **Use the 1 Head / 1,000,000 Tails variant.**
  *   **Heads:** Wake Monday, end experiment.
  *   **Tails:** Wake Monday, erase memory, wake Tuesday... repeat 1,000,000 times.
  *   **Why:** It breaks the Physicist's "Fair Coin" intuition. If they stick to 1/2 here, they must accept that they would bet against a million-to-one frequency. If they switch to ~0, they must explain why the coin's physical fairness didn't matter.

  ---

  ### **0:00 – 0:15 | Phase 1: The Pre-Emptive Strike (Self-Location vs. Physical Chance)**
  **Goal:** Separate *objective chance* from *credence* before they touch the SB problem.
  **Activity:** "The Amnesiac Room."
  *   **Setup:** I put you in a room. I flip a fair coin.
      *   If **Heads**: I put **1** person in a red room.
      *   If **Tails**: I put **1,000,000** people in red rooms.
      *   You wake up in a red room. You know the protocol. What is your credence the coin was Heads?
  *   **The Trap:** Physicists will say 1/2 ("The coin is fair"). CS will say ~0 ("I'm likely one of the million").
  *   **The Intervention:** Stop the debate. Write two equations on the board.
      1.  $P(Heads) = 1/2$ (The chance of the toss).
      2.  $P(Heads | I \text{ am in a red room}) = ?$ (The chance of the toss *given my location*).
  *   **Point to make:** "You are not calculating the probability of the coin. You are calculating the probability of the coin *conditional on being sampled*. The disagreement is not about Bayes' Theorem. It is about whether 'I am awake' counts as data $E$."

  ### **0:15 – 0:45 | Phase 2: The Standard Problem & The "Math" Illusion**
  **Goal:** Show that both sides are mathematically consistent but model differently.
  **Activity:** Formalize the disagreement.
  *   Ask for a volunteer Halfer and a volunteer Thirder to write their Bayes derivation on the board.
  *   **The Reveal:** Point out that both derivations are algebraically correct.
      *   **Halfer Model:** The sample space is $\{H, T\}$. Waking up is guaranteed in both, so $P(Wake|H) = P(Wake|T) = 1$. The likelihood ratio is 1:1. Posterior = Prior.
      *   **Thirder Model:** The sample space is $\{H_{Mon}, T_{Mon}, T_{Tue}\}$. Waking up selects an *observer-moment*. $P(Wake|H) \neq P(Wake|T)$ because Tails produces twice the "observer-mass."
  *   **Address the Biases:**
      *   **To Physicists:** "You are treating the observer as a passive external meter. But the protocol makes the observer part of the measurement apparatus. You are ignoring the *sampling bias*."
      *   **To CS:** "You are treating observer-moments as ontological atoms. Why are these three states equiprobable? You are assuming a 'Self-Sampling Assumption' without justifying the reference class."
  *   **Key Takeaway:** The fight isn't about $P(A|B) = P(B|A)P(A)/P(B)$. The fight is about what $B$ is.

  ### **0:45 – 1:10 | Phase 3: The Stress Test (Extreme SB + Betting)**
  **Goal:** Force the cost of the modeling choice.
  **Activity:** Introduce the **1 vs. 1,000,000** variant.
  *   **Question:** "In the Extreme variant, are you still 1/2?"
  *   **If Physicists say 1/2:** Introduce the **Dutch Book**.
      *   "I will bet you $100 every time you wake up. If Heads, I pay you $1,000,000. If Tails, you pay me $100."
      *   If they believe 1/2, they should take this bet (Expected Value is massively positive).
      *   But if they take the bet, they lose money in 99.9999% of experiments (the Tails worlds dominate the payout frequency).
      *   *Challenge:* "How can a rational belief lead to a guaranteed loss in the long run?"
  *   **If CS say ~0:** Ask: "Did the coin become unfair? Did my protocol change the physics of the mint?"
      *   *Challenge:* "How can my credence about a physical object change without a physical signal?"
  *   **The Pivot:** This is where you introduce the distinction between **Credence** (guiding action/betting) and **Objective Chance** (physical propensity).
      *   Halfers save Objective Chance but break Decision Theory.
      *   Thirders save Decision Theory but blur Objective Chance.

  ### **1:10 – 1:25 | Phase 4: What is Actually Unresolved?**
  **Goal:** Distinguish "talking past each other" from "deep metaphysics."
  **Discussion:**
  1.  **Talking Past Each Other (Resolve this):**
      *   Are we asking "What is the chance the coin landed Heads?" (Halfer territory).
      *   Or "What is the chance *this specific experience* is associated with Heads?" (Thirder territory).
      *   *Action:* Tell them 50% of the debate is just ambiguity in the English question.
  2.  **Genuinely Unresolved (Leave this open):**
      *   **The Reference Class Problem:** Who counts as "me"? (SSA vs. SIA).
      *   **The Nature of Credence:** Is belief defined by betting behavior (Pragmatism) or by mapping to truth conditions (Representationalism)?
      *   Tell them: "There is no consensus in the literature. Elga says 1/3. Lewis says 1/2. Both are giants. You are not expected to solve it."

  ### **1:25 – 1:30 | Phase 5: The Exit Ticket (Check for Understanding)**
  **Goal:** Verify they understood the *epistemological* stake, not just the math.
  **Do NOT ask:** "Is it 1/2 or 1/3?"
  **DO ask:**
  > "Write down the exact proposition $E$ (the evidence) that you conditioned on to get your answer. Then, write down one scenario where $E$ would *not* obtain."

  *   **Why this works:**
      *   If they write "$E = \text{I am awake}$," ask: "When would you not be awake?" (If they say 'never', they haven't defined a contrast class).
      *   If they write "$E = \text{It is Monday}$," they've smuggled in information Beauty doesn't have.
      *   If they write "$E = \text{The experiment is running}$," that doesn't distinguish H from T.
      *   **Success Criterion:** A student passes if they can articulate that the evidence is *indexical* (e.g., "I am having an awakening experience *now*") and acknowledge that the probability of having that experience differs between Heads and Tails worlds.

  ---

  ### **Anticipating Misconceptions (Cheat Sheet)**

  | Camp | The Misconception | When to Head It Off | The Counter-Argument |
  | :--- | :--- | :--- | :--- |
  | **Physicists** | "Information must be a physical signal." | Phase 1 (Amnesiac Room) | "Indexical information ('I am here now') constrains the possible worlds just like physical data. It rules out worlds where you don't exist." |
  | **Physicists** | "The coin is fair, so P(H)=1/2 is fixed." | Phase 3 (Extreme SB) | "The coin *toss* was fair. But the *sampling* of the toss from your perspective is biased. Distinguish $P(H)$ from $P(H | \text{Sampled})$." |
  | **CS** | "All observer moments are equiprobable." | Phase 2 (Formalization) | "Why? That's the Self-Indication Assumption. It leads to the 'Presumptuous Philosopher' problem (inferring the universe is huge just because you exist)." |
  | **CS** | "Betting odds = Belief." | Phase 4 (Unresolved) | "Utility functions can diverge from credence. You might bet 1/3 because of the payout structure, even if you believe 1/2." |
  | **Both** | "The other side can't do Bayes." | Phase 2 (Board Work) | Show both derivations are valid. The conflict is in the **Likelihood Ratio**, not the algebra. |

  ### **What to Openly Refuse to Settle**
  1.  **SSA vs. SIA:** Do not let them try to prove which Self-Sampling assumption is correct. Frame it as a parameter choice in their model, like a prior.
  2.  **The Definition of "Belief":** If they argue about whether belief *is* betting odds, stop them. Say: "For this hour, assume belief guides betting. We are testing coherence, not metaphysics of mind."
  3.  **The "Right" Answer:** Explicitly state: "If you leave here thinking one side is obviously wrong, I have failed. The value of SB is that it breaks the link between chance, frequency, and belief."

  ### **Instructor's Note**
  Your job is not to convert them to Thirdism or Halferism. Your job is to make them uncomfortable with the idea that "probability" is a single, monolithic concept. If they leave arguing about **reference classes** instead of **conditional probability**, you have succeeded.
