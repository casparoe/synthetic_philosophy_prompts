      *   *Actionable steps.* Set the nav. Tell a friend.
      *   *Wait, one more thing.* If they are *already* falling asleep, they need to stop driving at night or find a hotel. This is a systemic issue, not just a rest stop issue. I should mention that.

  8.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "feeling alert enough to stop" (which sounds like they stop if alert?) vs "feeling alert enough to *continue*" is clear.
