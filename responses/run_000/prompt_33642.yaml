prompt: |-
  I'm a third-year undergraduate in a seminar called "The Normativity of Contracts," and we've spent the past several weeks on the question of why promises bind. We've worked through Hume's convention-based account in the Treatise, Rawls's practice-based view from "Two Concepts of Rules," and Scanlon's expectation-based account from What We Owe to Each Other. Our professor has asked the class to help design an in-class activity for next week's session that will make the rest of the students — about eighteen of us — feel the force of the central puzzle experientially rather than just reading about it. The session is eighty minutes, and the room is a seminar room with movable chairs and a whiteboard.

  The puzzle we keep circling around is this: when you break a promise, are you doing something wrong primarily because you've harmed the specific person you made the promise to — disappointed their expectations, betrayed their trust, taken advantage of their reliance — or because you've undermined a valuable social practice that everyone benefits from and you're free-riding on that practice? Or is there some third thing, something about the exercise of normative powers or the transfer of authority, that neither of these quite captures? The readings pull in different directions, and the discussion keeps stalling out because we don't have a shared experience to anchor the disagreement.

  I'd like to propose a structured activity — ideally a game with real but small stakes, like candy or extra-credit points — that forces participants to confront this question from the inside. The activity should have two distinct phases. In the first phase, promises are embedded in a clearly beneficial social practice: making and keeping promises visibly improves everyone's outcomes, and breaking them visibly harms the practice for everyone. In the second phase, promises are made one-on-one in isolation from any broader practice — no reputation, no group benefit, no third-party awareness — and participants have to decide whether they still feel bound. The transition between the two phases should be jarring: participants should walk out of the first phase convinced that the practice explains everything, and then find themselves in the second phase feeling that something is still missing. I need: (a) rules and materials for both phases, including a payoff scheme that doesn't require real money; (b) a timeline for the full eighty-minute session; (c) a debrief script that maps specific moments in the activity onto the philosophical accounts we've read, shows where the practice-based view gains traction and where it loses it, and introduces the voluntarist or authority-based alternative at the right moment; (d) an honest note on what will predictably go wrong when the activity is run — especially the risk that participants in Phase 2 will simply import the norms from Phase 1 and not feel the tension; and (e) a suggestion for a follow-up discussion question or short reading that ties the experience back to the texts.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Third-year undergraduate seminar, "The Normativity of Contracts."
      *   **Topic:** Why promises bind (Hume/Convention, Rawls/Practice, Scanlon/Expectation, plus potential Voluntarist/Authority views).
      *   **Goal:** Design an 80-minute in-class activity (game/experiment) to make the central puzzle *experiential*.
      *   **Class Size:** ~18 students.
      *   **Room:** Seminar room, movable chairs, whiteboard.
      *   **Core Puzzle:** Harm to individual (Scanlon-esque) vs. Undermining Social Practice (Rawls/Hume) vs. Normative Power/Authority (Voluntarist).
      *   **Structure:** Two phases.
          *   Phase 1: Promises embedded in a beneficial social practice (group payoff depends on cooperation).
          *   Phase 2: Promises one-on-one, isolated, no reputation/practice benefit.
          *   Transition: Jarring shift from "practice explains it" to "something is still missing."
      *   **Deliverables:**
          *   (a) Rules & Materials (payoff scheme, no real money).
          *   (b) Timeline (80 mins).
          *   (c) Debrief Script (mapping to Hume, Rawls, Scanlon, Voluntarism).
          *   (d) "What Will Go Wrong" (predictive troubleshooting).
          *   (e) Follow-up (question/reading).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Practice/Convention (Hume/Rawls):* Promise-keeping is rational because the *institution* of promising is useful. If everyone breaks promises, trust collapses, and everyone is worse off. Breaking a promise is free-riding.
      *   *Expectation/Reliance (Scanlon):* Promise-keeping is wrong because it *harms the promisee* by manipulating their expectations or betraying trust. It's interpersonal, not institutional.
      *   *Voluntarist/Authority:* Promise-keeping is wrong because the *act of promising* changes the normative landscape. I give you a right to my performance. It's not about consequences (practice or harm) but about the *power* exercised.

  3.  **Designing the Activity (The "Game"):**
      *   *Need:* A mechanism where cooperation yields high rewards, defection yields high individual reward but low group reward.
      *   *Phase 1 (The Practice):* Needs to feel like a public institution. Public pledges, visible outcomes, group bonus.
      *   *Phase 2 (The Isolation):* Needs to feel private. Anonymous, one-off, no group consequence.
      *   *Stakes:* Candy or "Extra Credit" (need to be careful with university policies on EC, candy is safer/more fun). Let's use candy/tokens redeemable for candy.
      *   *Mechanism:* A variation of the Prisoner's Dilemma or Public Goods Game, but framed explicitly around *promising*.

      *   *Drafting Phase 1:* "The Trust Network." Students pair up. They can invest tokens. If both promise to invest and do, everyone wins big. If one breaks, they steal the other's tokens. *Crucial:* There must be a "Group Pot" that grows only if a certain threshold of promises are kept. This embodies the Rawlsian/Humean view.
      *   *Drafting Phase 2:* "The Desert Island." Same payoff structure technically, but *no Group Pot*. No one else knows. No reputation. Just You and Partner.
      *   *The Twist:* In Phase 2, the payoff for breaking the promise should be *individually* rational but the student must decide if they are *bound*.
      *   *Refinement:* To make the transition jarring, Phase 1 needs to emphasize the *system*. Phase 2 needs to emphasize the *relationship*.

      *   *Revised Game Idea:* "The Token Exchange."
      *   *Phase 1:* Public Pledge. Students stand up, declare intent. A "Bank" adds bonus points if >80% keep promises. Breaking a promise hurts the Bank (Practice).
      *   *Phase 2:* Private Note. Pass notes. No Bank bonus. Just direct exchange.
      *   *Payoff:* Candy pieces.

  4.  **Developing the Timeline (80 mins):**
      *   Intro (5 mins)
      *   Phase 1 Setup & Play (20 mins)
      *   Phase 2 Setup & Play (20 mins)
      *   Debrief/Discussion (30 mins)
      *   Buffer/Cleanup (5 mins)

  5.  **Drafting the Debrief Script:**
      *   Need to connect feelings to texts.
      *   Phase 1 success -> Rawls/Hume (Practice is good).
      *   Phase 1 failure -> Free-rider problem.
      *   Phase 2 tension -> If you kept the promise in Phase 2, why? Not for the practice (it's isolated). Not for harm (maybe no reliance yet?). Maybe because "I said I would" (Voluntarism).
      *   If you broke Phase 2 -> Scanlon (did you harm expectation?).

  6.  **Anticipating Problems (The "Honest Note"):**
      *   *Problem 1:* Students treat it as just a game (ludic attitude).
      *   *Problem 2:* Phase 2 norms bleed from Phase 1 (habits).
      *   *Problem 3:* Cynicism (everyone defects).
      *   *Problem 4:* Extra credit policy issues (stick to candy).

  7.  **Selecting Follow-up:**
      *   Need something that bridges the gap.
      *   Shiffrin? Scanlon?
      *   Let's go with a specific prompt about "Normative Powers" to push beyond Scanlon/Rawls. Maybe a short excerpt from Shiffrin's "Promising, Intimate Relationships, and Conventional Morals."

  8.  **Refining the Activity Details (Self-Correction during drafting):**
      *   *Critique:* Is the payoff scheme clear?
      *   *Fix:* Use a simple "Investment Game." You get 5 tokens. You can keep them or give them. If you give, they double. Partner can return or keep.
      *   *Wait, that's Trust Game.* Let's make it about *Promising* specifically.
      *   *Better:* "The Pact."
      *   Phase 1: Public Pact. If 15/18 keep the pact, everyone gets +2 candy. If you break, you get +3 candy individually, but the group loses the bonus.
      *   Phase 2: Private Pact. Partner A has 5 candy. Partner B has 0. A promises to give 3 to B. B promises nothing back (one-way promise). A can keep or give. No group bonus.
      *   *Why One-Way?* It isolates the obligation. If it's an exchange, it's prudence. If it's one-way, it's pure normativity.
      *   *Actually, let's keep it symmetric but private.*
      *   *Let's try this:*
          *   Phase 1: "The Institution." 3 Groups of 6. Group pot grows if promises kept.
          *   Phase 2: "The Stranger." Pairs formed randomly. No group pot. Anonymous.
      *   *Payoff:* Candy is best.

      *(Self-Correction on Debrief)*: Make sure to explicitly name the texts. Hume (Treatise), Rawls (Two Concepts), Scanlon (What We Owe). Introduce the "Normative Power" view (Shiffrin or generic Voluntarism).

  9.  **Final Polish:**
      *   Tone: Academic but practical.
      *   Formatting: Clear headings for (a) through (e).
      *   Check constraints: 18 students, 80 mins, movable chairs.

      *(Final thought on the "Jarring Transition"):* How to make it jarring?
      *   In Phase 1, the professor acts as the "Institution" (collecting data, announcing totals).
      *   In Phase 2, the professor turns their back. "I will not know. The group will not know." This removal of the "watcher" is key to killing the Practice view.

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is a proposal for the in-class activity, designed to fit your seminar's specific philosophical trajectory and logistical constraints.

  # Activity Title: "The Pact and The Stranger"

  ## (a) Rules and Materials

  **Materials Needed:**
  *   **Currency:** 200 small candies (e.g., Hershey's Kisses) or colored poker chips (redeemable for candy at the end).
  *   **Handouts:** Two distinct instruction sheets (Phase 1: "The Public Pact"; Phase 2: "The Private Note").
  *   **Writing Implements:** Pens and small slips of paper (foldable).
  *   **Whiteboard:** To track Phase 1 aggregate scores.
  *   **Containers:** Three opaque envelopes or boxes for Phase 2 collection.

  **The Payoff Scheme (Candy):**
  *   **Endowment:** Every student starts with **5 pieces** of candy.
  *   **The Choice:** In both phases, students decide whether to **Keep** their endowment or **Invest** it based on a promise.
  *   **Phase 1 (Public Pact):**
      *   Students are divided into 3 groups of 6.
      *   **The Rule:** If a student *promises* to Invest and *does* Invest, their 5 pieces become 10 (matched by the "Bank").
      *   **The Practice Bonus:** If **80% or more** of the *entire class* (15/18 students) keep their promise, every student receives a **+3 Candy Bonus**.
      *   **The Defection:** If a student promises to Invest but *Keeps* their original 5, they retain their 5, but they count as a "breaker" toward the 80% threshold.
      *   **Visibility:** Students stand and publicly state "I Promise to Invest" before making their choice. The professor tallies the success rate on the board.
  *   **Phase 2 (The Private Note):**
      *   Students pair up (9 pairs). Ideally, pair them with someone outside their Phase 1 group.
      *   **The Rule:** Student A writes a promise on a slip of paper: "I promise to give you 3 of my candies." Student B makes no promise; they simply wait.
      *   **The Isolation:** Student A folds the paper. They then physically move their candies.
      *   **Anonymity:** The professor turns their back. The "Practice Bonus" is explicitly **removed**. No one else knows the outcome. There is no group threshold.
      *   **The Payoff:** If A keeps the promise, A has 2 left, B has 8. If A breaks the promise, A has 5, B has 5.
      *   **Crucial Detail:** Collect the slips *after* the candies are moved, but tell students: *"I will not open these. I will shred them. Only you and your partner know what happened."*

  ## (b) Timeline (80 Minutes)

  *   **00:00 – 00:05: Introduction.**
      *   Explain the stakes (candy). Emphasize that this is an experiment in decision-making, not a test of morality.
  *   **00:05 – 00:25: Phase 1 (The Public Pact).**
      *   Distribute candy and instructions.
      *   Public declaration of promises.
      *   Execution of choices.
      *   Tallying the "Practice Bonus" on the whiteboard.
      *   Distribution of bonuses (if earned).
  *   **00:25 – 00:30: The Transition.**
      *   Reset the room. Move chairs for pairs.
      *   **The Jarring Shift:** Professor explicitly states: *"The group bonus is gone. I am not watching. The institution is dissolved. This is just you and one other person."*
  *   **00:30 – 00:50: Phase 2 (The Private Note).**
      *   Distribute slips.
      *   Writing of promises (1 min).
      *   Execution of choices (2 min).
      *   Collection of slips (unopened).
  *   **00:50 – 01:20: Debrief and Discussion.**
      *   Structured discussion mapping experience to texts (see script below).

  ## (c) Debrief Script

  *Note to Professor: The goal is to move from Hume/Rawls (Phase 1) to Scanlon (Phase 2) to Voluntarism (The Gap).*

  **1. Opening the Debrief (5 mins)**
  "Look at your candy piles. In Phase 1, many of you likely kept your promise. Why? Was it because you wanted the bonus? Or because breaking it would have cost the group the bonus?"
  *   *Expected Answer:* "I didn't want to ruin it for everyone."
  *   *Philosophical Map:* **Rawls/Hume.** This is the **Practice View**. The obligation comes from the utility of the institution. You were upholding a convention that benefits all. Breaking it was 'free-riding.'

  **2. Confronting Phase 2 (10 mins)**
  "Now, Phase 2. There was no group bonus. I didn't see. Your partner couldn't punish you later. Yet, some of you still gave the candy. Why?"
  *   *If they say "Habit":* Push back. "You consciously decided to write a promise. Did habit force your hand?"
  *   *If they say "I didn't want to hurt them":*
  *   *Philosophical Map:* **Scanlon.** This is the **Expectation/Reliance View**. You didn't break the *practice*; you potentially harmed *this specific person* by manipulating their expectations. Principle F (from *What We Owe to Each Other*): You led them to expect performance, and you had no justification for disappointing them.

  **3. The Pivot to Normative Power (10 mins)**
  "Here is the puzzle. In Phase 2, imagine your partner *didn't* actually expect you to give the candy. They are a cynic. They assumed you would keep the 5. You, however, felt bound because you *said the words* 'I promise.'
  If they didn't rely on you, Scanlon says you haven't harmed them. If there is no social practice bonus, Rawls says there is no utility loss. Yet, do you still feel you *owed* it?"
  *   *The Hook:* This is where the Practice and Expectation views struggle.
  *   *Introduce Voluntarism:* "This suggests a third view: **Normative Powers.** By saying 'I promise,' you didn't just predict behavior or support a system. You exercised a power to change the normative landscape. You gave your partner a *right* to your candy. You created an obligation ex nihilo, simply by willing it. The wrongness isn't harm or free-riding; it's the contradiction of claiming authority to bind yourself and then denying that authority."

  **4. Closing Synthesis (5 mins)**
  "Phase 1 showed us why we have the *institution* of promising (Rawls). Phase 2 showed us why we might still feel bound without the institution (Scanlon/Voluntarism). The tension we feel is the tension between contract as social tool and contract as moral magic."

  ## (d) Honest Note: What Will Predictably Go Wrong

  1.  **The "Ludic" Attitude:** Students may treat Phase 2 as "just a game" where rational self-interest (keeping the candy) is the correct move.
      *   *Mitigation:* In the intro, emphasize that we are studying *their* intuition, not testing their rationality. There is no "correct" move, only an honest one.
  2.  **Norm Bleed:** The strongest risk is that the "Practice" norms from Phase 1 bleed into Phase 2. Students may keep the Phase 2 promise simply because they are still in "class mode" or feel watched by peers, even if you turn your back.
      *   *Mitigation:* Make the anonymity radical. Use the opaque envelopes. Explicitly say, "If you break this promise, the class grade/average is not affected."
  3.  **Cynicism/Collapse:** If Phase 1 fails (i.e., the group doesn't reach the 80% threshold), students may feel betrayed and defect en masse in Phase 2 out of spite.
      *   *Mitigation:* Set the threshold low enough (80%) that it is achievable but requires near-universal cooperation. If it fails, use that failure as data for the Rawlsian discussion ("Why did the practice collapse?").
  4.  **The Scanlon Trap:** Students might conflate "harming the partner" in Phase 2 with "making them angry."
      *   *Mitigation:* In the debrief, distinguish between *emotional disappointment* and *normative disappointment*. Scanlon is about the justification of expectations, not feelings.

  ## (e) Follow-Up Suggestion

  **Short Reading:**
  *   **Seana Shiffrin, "Promising, Intimate Relationships, and Conventional Morals" (2008), pp. 490–496.**
      *   *Why:* Shiffrin critiques the reliance/expectation view (Scanlon) and argues for a version of the voluntarist view that emphasizes the *moral agency* involved in promising. She argues that reducing promising to reliance (Scanlon) or social utility (Rawls) fails to capture why we value the *power* to promise.

  **Discussion Question for Next Session:**
  *   "In Phase 2, if your partner told you beforehand, 'I do not expect you to keep this promise, and I will not be disappointed if you break it,' would you still feel bound to give them the candy? If yes, does this prove Scanlon wrong? If no, does this prove the obligation is entirely dependent on the other person's psychology?"

  ***

  ### Instructor's Cheat Sheet: Mapping the Tension

  | Moment in Activity | Student Feeling | Philosophical Account | Vulnerability |
  | :--- | :--- | :--- | :--- |
  | **Phase 1 (Group Bonus)** | "I must cooperate so we all win." | **Rawls / Hume** (Practice/Convention) | Fails to explain obligation when the practice is unknown or useless. |
  | **Phase 2 (Private, Partner Relies)** | "I can't let them down." | **Scanlon** (Expectation/Reliance) | Fails to explain obligation if the partner *doesn't* rely (the "Cynic" case). |
  | **Phase 2 (Private, "I Said So")** | "I gave my word." | **Voluntarism** (Normative Power) | Struggles to explain *why* we have this magical power to create obligations. |

  This activity forces the students to inhabit the Rawlsian view in Phase 1, only to have the floor pulled out in Phase 2, leaving them searching for a Scanlonian or Voluntarist anchor to explain their own behavior.
