answer: |-
  1. **The concept clarified**
  Dennett's "free-floating rationales" are reasons that exist independently of a reasoner. They allow us to adopt the "intentional stance" toward systems that lack consciousness, predicting behavior based on assumed goals rather than physical mechanics. Unlike simple emergence, where complex patterns arise from simple rules, FFRs imply a functional logic that can be decoded *as if* designed. The concept bridges the gap between causal mechanistic explanations and teleological functional explanations. It legitimizes talking about "purpose" in nature without invoking supernatural design or conscious intent. Philosophically, it naturalizes normativity: a process can be "right" or "wrong" relative to a goal, like survival, without anyone holding that goal explicitly. It explains how competence exists without comprehension. Crucially, it permits predictive power without psychological attribution, solving the problem of teleology in a materialist world. The rationale is "free" because it is not anchored in a mind; it floats in the structure of the system itself, available to be harvested by any agent capable of recognizing the logic.

  2. **The evolutionary case**
  In natural selection, the free-floating rationale is the logic of adaptive fit. Organisms behave *as if* they seek survival, but the "reason" resides in the history of differential replication. The rationale is structured by environmental constraints: a trait persists because it solved a specific problem, such as predation avoidance or resource acquisition. This counts as a rationale because it supports counterfactuals: had the environment been different, the trait would not have been selected. It is sensitive to "fitness," which practically means statistical propensity to leave descendants. The process is blind; variation is not directed toward the solution. Yet, the outcome embodies a solution to a problem. This makes evolution the paradigm case: competence without comprehension. The rationale is free-floating because it exists in the interaction between phenotype and environment, not in the genome or the organism's mind. It is a historical archive of successful tests against reality. Crucially, the rationale is retrospective; it justifies the present structure via past success, creating a teleological pull without a forward-looking agent. The organism acts *as if* it calculates optimal foraging, but the calculation was done by history.

  3. **The market case**
  In market economies, free-floating rationales emerge through price signals and profit mechanisms. Prices encode information about scarcity and demand, acting as a distributed communication system no single agent comprehends. Profit and loss function as selection pressures: firms that allocate resources efficiently survive; those that do not, perish. This earns markets a place under the concept because the overall allocation of resources often appears designed for efficiency, despite no central planner directing it. The rationale is "maximize utility/profit," embedded in the system's structure. However, the analogy stretches because the constituent units (humans, firms) possess internal rationales. Consumers maximize utility consciously; entrepreneurs innovate intentionally. Unlike genes, agents have foresight. Thus, market FFRs are a hybrid: decentralized outcomes arising from centralized micro-intentions. The system's logic transcends individual knowledge, creating a macro-rationale that floats above individual minds, yet it relies heavily on the rationality of the agents themselves. Money acts as a universal fitness proxy, but unlike genes, it is socially mutable. The market's rationale is therefore contingent on human cognition, whereas evolution's rationale persists even if the organisms are dumb.

  4. **Systematic comparison**
  The analogy holds structurally: both are variation-selection-retention systems producing order without a designer. Both utilize feedback loops where failure removes elements from the pool. However, the differences are profound. First, the source of variation: biological mutation is blind to need, while market innovation is directed by human foresight and desire. Second, the agents: genes are passive replicators; economic agents are intentional maximizers. This means market FFRs are built upon layers of micro-rationality, whereas biological FFRs emerge from micro-irrationality. Third, timescales: evolution operates over generations, allowing for deep structural adaptation; markets operate in real-time, prone to bubbles and crashes that evolution would cull immediately. Fourth, the selection mechanism: natural selection is absolute; market selection is porous (bailouts, monopolies). Finally, the outcome: evolution optimizes for inclusive fitness; markets optimize for purchasing power. The analogy gives out where human intentionality interferes with the blind sorting process. Furthermore, biological environments are physically constrained; market environments are socially constructed and reflexive. Agents change the environment they are selected in, creating feedback loops that can destabilize the rationale. In biology, the rationale is tethered to physical survival; in markets, it can detach from material reality, creating financial structures that are "rational" for profit but irrational for systemic stability. This decoupling makes market FFRs more fragile. Additionally, biological outcomes are reliably "rational" regarding stability over deep time, whereas market outcomes can be rational for individuals but collectively catastrophic, revealing a divergence in what constitutes a successful adaptation in each system.

  5. **Normative implications**
  The analogy warns against trusting market outcomes as inherently "good." Natural selection produces exquisite design, but also parasites, extinction, and suffering. It optimizes for replication, not welfare. Similarly, markets optimize for solvency and efficiency, not justice, equality, or human flourishing. A free-floating rationale explains *function*, not *value*. To argue that market outcomes are desirable simply because they emerge from a decentralized process is to commit a naturalistic fallacy, mirroring the error of assuming evolved traits are morally good. The existence of a rationale implies adaptation to a specific pressure, not alignment with human ethics. In biology, we accept waste as the cost of exploration; in economies, human suffering is not an acceptable cost of efficiency. Therefore, the concept suggests we should treat markets as powerful engineering tools for allocation, not as moral arbiters. We must impose external normative frameworks—regulation, welfare—to correct for the fact that the market's "blind" rationale ignores externalities and human needs that do not translate into purchasing power. The free-floating rationale is descriptive, not prescriptive. Recognizing the market as an evolutionary system reveals its competence, but also its indifference. We cannot expect the invisible hand to care about the invisible poor.
