  9.  *(Mental Sandbox)*: Wait, did I emphasize the "physicality" enough in the table? The prompt asks about "rails are physical objects whose location is publicly observable." I need to map that to the idea that meaning is supposed to be a "fact" about the mind that is equally definite.
