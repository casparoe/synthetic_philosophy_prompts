prompt: |-
  I'm taking a seminar that keeps circling around standing to blame, and I've realized I don't actually know what I should be asking of a theory of it. So before I read another paper, I want the desiderata: what any adequate account of who has the standing to blame whom has to deliver. I mean ordinary interpersonal moral blame, not legal punishment or institutional censure. Give me the cases it has to get right — the unrepentant hypocrite who blames someone for exactly what he does himself, the person who did the same thing decades ago and now blames sincerely, the uninvolved third party with no stake in the wrong, the person complicit in a different but related way, the friend of the victim versus a total stranger — and the distinctions it can't collapse, especially standing versus whether the blame is true or deserved versus whether expressing it would be good or useful. Also include the ordinary-practice data it can't just explain away: that we do pull people up for being in no position to blame, but we usually don't treat that as showing their criticism was false.

  For each requirement, say what case or consideration forces it, and mark wich are non-negotiable and which are just the taste of a particular camp (for example, that standing must be grounded in a relationship, or that hypocrisy always destroys standing no matter how sincere the blamer now is). Then the part I most want: tell me whether some subset of these requirements is jointly unsatisfiable — I half-suspect there is no one thing called standing that can meet all of them, and if so the list itself should show that. Finally, very briefly, run the main moves against the list: the hypocrisy-based view, the relationship-based view, and the eliminativist view that standing isn't a real normative category at all. Keep the scorecard short; the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Standing to blame (ordinary interpersonal moral blame).
      *   **Goal:** Provide a list of desiderata (requirements) for an adequate theory of standing.
      *   **Specifics:** Include key cases (hypocrite, past wrongdoer, third party, complicit, friend vs. stranger), key distinctions (standing vs. truth/desert vs. utility), and ordinary practice data (calling out lack of standing doesn't negate the truth of the blame).
      *   **Format:** For each requirement, specify the forcing case/consideration and mark it as "Non-negotiable" or "Camp-specific/Taste."
      *   **Critical Analysis:** Identify if any subset of requirements is jointly unsatisfiable (the "no one thing" suspicion).
      *   **Evaluation:** Briefly run the main theoretical moves (Hypocrisy-based, Relationship-based, Eliminativist) against the list.
      *   **Tone:** Philosophical, precise, seminar-ready, slightly critical.

  2.  **Deconstruct the Concept of Standing:**
      *   What is it? It's the *authority* or *permission* to hold someone accountable, distinct from the *truth* of the accusation.
      *   Analogy: A judge recusing themselves. The defendant might be guilty (truth), but this judge can't sentence them (standing).
      *   Key intuition: "Who are *you* to talk?"

  3.  **Drafting the Desiderata (The List):**
      *   *Requirement 1: The Hypocrite Constraint.* The unrepentant hypocrite lacks standing. (Classic case: Macalester).
      *   *Requirement 2: The Repentance/Time Constraint.* Does past wrongdoing always kill standing? No. Sincere reform matters. (Case: The reformed smoker blaming a teen).
      *   *Requirement 3: The Stake/Relationship Constraint.* Does a total stranger have standing? Sometimes yes, sometimes no. Needs nuance. (Case: Stranger on the bus vs. Friend).
      *   *Requirement 4: The Distinction Constraint.* Standing $\neq$ Desert. You can lack standing but be right. (Case: "You're right, but you can't say that").
      *   *Requirement 5: The Distinction Constraint 2.* Standing $\neq$ Utility. It's not just about whether blaming helps. (Case: Blaming helps reform but blamer is hypocritical).
      *   *Requirement 6: The Complicity Constraint.* What about being involved in a *different* wrong? (Case: The thief blaming the liar).
      *   *Requirement 7: The Victim/Proxy Constraint.* Friends of victims seem to have more standing than strangers.

      *Refining the "Non-negotiable" vs. "Camp-specific" labels:*
      *   Non-negotiable: Standing is distinct from truth. Standing is distinct from utility. Hypocrisy *sometimes* undermines standing.
      *   Camp-specific: Hypocrisy *always* undermines standing. Standing *requires* a specific relationship. Third parties *never* have standing.

  4.  **Addressing the "Joint Unsatisfiability" (The Tension):**
      *   The user suspects there's no coherent concept. Is she right?
      *   *Tension 1:* If standing is about moral authority, why does a hypocrite (who knows the moral truth) lack it? If it's about the moral truth, they should have it.
      *   *Tension 2:* If standing is about relationships, why do strangers sometimes have standing to blame egregious public wrongs?
      *   *Tension 3:* The "Tu Quoque" intuition. We say "You did it too!" to silence them. But if the blame is true, why silence? Because it's unfair? Because it's communicatively defective?
      *   *Hypothesis:* The concept might be a cluster of different norms (fairness, communicative efficacy, authority) masquerading as one.
      *   *Verdict:* It's not strictly unsatisfiable, but it requires a complex, hybrid account. However, the "Non-negotiable" demand that standing be *purely* normative yet distinct from desert creates friction.

  5.  **Evaluating the Theories:**
      *   *Hypocrisy-Based (Bell, Fritz & Miller):* Focuses on the RAS (Respect-Authority-Standing) or non-commitment. Good on hypocrites, struggles with strangers/third parties.
      *   *Relationship-Based (Wallace, Smith):* Focuses on the moral community/relationship. Good on friends/victims, struggles with why strangers can blame at all (or why they can't).
      *   *Eliminativist (Schoenberg, maybe?):* Says it's just about utility or desert. Fails the "Distinctness" desideratum.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the seminar context. Set the stage.
      *   *The List:* Use clear headings.
          *   D1: The Truth/Standing Separation (Non-negotiable).
          *   D2: The Hypocrite's Deficit (Non-negotiable core, negotiable scope).
          *   D3: The Repentance Exception (Non-negotiable).
          *   D4: The Third-Party Problem (Camp-specific tension).
          *   D5: The Utility Separation (Non-negotiable).
          *   D6: The Complicity Nuance (Camp-specific).
      *   *The Incompatibility Worry:* Address the "no one thing" suspicion. Focus on the conflict between *moral authority* (which seems universal) and *relational standing* (which seems particular).
      *   *The Scorecard:* Quick run-down.

  7.  **Review against Constraints:**
      *   *Ordinary interpersonal blame?* Yes.
      *   *Cases included?* Hypocrite, past wrongdoer, third party, complicit, friend/stranger.
      *   *Distinctions included?* Standing vs. Truth, Standing vs. Utility.
      *   *Practice data?* "You're right but..."
      *   *Non-negotiable vs. Taste?* Marked.
      *   *Joint unsatisfiability?* Addressed.
      *   *Theory run-down?* Included.
      *   *Keep scorecard short?* Yes.

  8.  **Final Polish:** Ensure the tone is appropriate for a grad seminar context (precise, acknowledging debate, not dogmatic). Make sure the "Joint Unsatisfiability" section is punchy, as that's what the user specifically asked for ("the part I most want").

      *(Self-Correction during drafting)*: I need to be careful not to conflate "standing" with "appropriateness." Standing is a specific *kind* of appropriateness. I must emphasize that lacking standing doesn't make the blame *false*.
      *(Refining the Unsatisfiability)*: The real tension is between the *universal* nature of moral norms (everyone has authority to uphold them) and the *particular* nature of standing (some people are barred from upholding them). How can a universal norm grant particular authority? That's the rub.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a set of desiderata for a theory of standing to blame, calibrated for ordinary interpersonal morality. I have distinguished between constraints any theory must meet to capture the phenomenon and those that reflect specific theoretical commitments.

  ### The Desiderata List

  **1. The Truth/Standing Separation**
  *   **The Constraint:** A theory must explain how a blamer can lack standing even when their blame is entirely accurate and the target fully deserves it.
  *   **Forcing Case:** The "You're right, but who are *you* to say it?" response. We acknowledge the criticism is true but refuse to engage with it *from this person*.
  *   **Status:** **Non-negotiable.** If a theory collapses standing into desert (truth), it eliminates the phenomenon rather than explaining it.

  **2. The Hypocrite's Deficit**
  *   **The Constraint:** A theory must explain why the *unrepentant* hypocrite (who currently violates the very norm they are invoking) typically lacks standing.
  *   **Forcing Case:** The smoker who angrily blames a teen for smoking, while lighting up themselves.
  *   **Status:** **Non-negotiable (Core).** Any theory that says the unrepentant hypocrite *always* has full standing fails to match practice. (Note: Whether hypocrisy *always* destroys standing is camp-specific; see #6).

  **3. The Repentance/Reform Exception**
  *   **The Constraint:** A theory must allow that past wrongdoing does not *permanently* strip standing if the blamer has sincerely repented or reformed.
  *   **Forcing Case:** The reformed alcoholic who blames a friend for drunken recklessness. We generally think they *do* have standing, perhaps even more than a teetotaler.
  *   **Status:** **Non-negotiable.** A theory that says "once a wrongdoer, always no standing" is too rigid for ordinary practice.

  **4. The Third-Party Boundary**
  *   **The Constraint:** A theory must delineate when an uninvolved stranger has standing versus when they are merely meddling.
  *   **Forcing Case:** A stranger on the bus scolding a parent for a child's minor infraction vs. a stranger intervening in an act of public cruelty.
  *   **Status:** **Camp-Specific/Taste.** Some theories (Relationship-Based) argue strangers *never* have robust standing without a communal tie. Others (Moral Authority) argue strangers *always* have standing regarding public moral norms. An adequate theory must pick a lane here, but practice is ambiguous.

  **5. The Utility Separation**
  *   **The Constraint:** A theory must distinguish standing from the consequential value of blaming. Lacking standing isn't just about blaming being "unhelpful."
  *   **Forcing Case:** The hypocritical blamer whose criticism would actually help the wrongdoer reform. We still say they lack standing, even if the blame is useful.
  *   **Status:** **Non-negotiable.** Standing is a deontic/normative status, not a consequentialist calculation.

  **6. The Scope of Complicity**
  *   **The Constraint:** A theory must specify whether wrongdoing in *different* domains undermines standing.
  *   **Forcing Case:** The thief who blames a liar. Does the theft undermine standing to blame lying?
  *   **Status:** **Camp-Specific.** Some views (Commitment-Based) say yes (you violate moral norms generally). Others (Relationship-Based) say no (you haven't violated *this* relationship's norms). Practice is split here; a theory must explain the split or rule one way.

  **7. The Victim/Proxy Priority**
  *   **The Constraint:** A theory must explain why victims (and their close friends) seem to have *more* or *different* standing than strangers.
  *   **Forcing Case:** A friend of the victim blaming the wrongdoer vs. a total stranger doing the same.
  *   **Status:** **Non-negotiable.** Ordinary practice grants special prerogatives to victims. A theory that treats all moral agents as having identical standing ignores the special stake of the wronged.

  ---

  ### The Incompatibility Worry: Is "Standing" a Coherent Category?

  You suspect there is no one thing called standing. The desiderata above suggest you might be right, or at least that the concept is a **hybrid of two conflicting normative sources.**

  **The Tension:**
  Requirements #1 (Truth Separation) and #7 (Victim Priority) pull in opposite directions regarding the *source* of standing.
  *   If standing is grounded in **Moral Authority** (upholding the good), then strangers and victims should have equal standing (violating #7), and hypocrites should retain standing because the moral truth remains true (violating #2).
  *   If standing is grounded in **Relational Authority** (the specific bond between blamer and blamed), then victims have priority (satisfying #7) and hypocrites lose standing because they damaged the bond (satisfying #2). *However*, this makes it hard to explain why strangers can ever blame public wrongs (violating #4) or why the Truth/Standing separation holds (if it's just about relationships, why is the blame still *true*?).

  **The Verdict:**
  The requirements are **jointly satisfiable only if standing is disjunctive.** There is likely no single property ("The Standing") that explains all cases. Instead, "standing" is a placeholder for either:
  1.  **Fairness:** It is unfair for a hypocrite to impose sanctions (Focus on the Blamer).
  2.  **Communicative Efficacy:** The message cannot be heard from this source (Focus on the Audience).
  3.  **Jurisdiction:** This person has no stake in this norm (Focus on the Relationship).

  If you demand a *univocal* account that treats standing as a single normative power, **#2 (Hypocrisy) and #4 (Third Parties) are likely unsatisfiable together.** You cannot consistently argue that hypocrisy *always* negates the authority to uphold a norm while also arguing that strangers *always* have the authority to uphold norms. One of those intuitions must be sacrificed or contextualized.

  ---

  ### Theoretical Scorecard

  Here is how the main moves fare against the non-negotiable desiderata.

  **1. The Hypocrisy-Based View (e.g., Bell, Fritz & Miller)**
  *   *Core:* Standing is lost when the blamer fails to respect the norm or the blamed (often via hypocrisy).
  *   *Score:*
      *   **Truth/Standing Separation:** Pass. (You can be right but disrespectful).
      *   **Hypocrite's Deficit:** Pass. (This is its home turf).
      *   **Repentance Exception:** Pass. (Respect is restored).
      *   **Third-Party Boundary:** **Fail/Struggle.** Hard to explain why a respectful stranger lacks standing to blame a public wrong, or why they have it if respect is the only key.
      *   **Verdict:** Best for explaining *why* standing is lost, weaker on *who* has it initially.

  **2. The Relationship-Based View (e.g., Wallace, Smith)**
  *   *Core:* Standing is a function of the normative relationship between the parties.
  *   *Score:*
      *   **Truth/Standing Separation:** Pass. (Relationship status is distinct from moral fact).
      *   **Hypocrite's Deficit:** Pass. (Hypocrisy damages the relationship).
      *   **Victim/Proxy Priority:** Pass. (Explains special stake perfectly).
      *   **Third-Party Boundary:** **Struggle.** Must posit a "moral community" relationship to allow stranger blame, which dilutes the "relationship" concept.
      *   **Verdict:** Best for explaining the *structure* of blame, but risks making standing too exclusive.

  **3. The Eliminativist View (e.g., Schoenberg, some Consequentialists)**
  *   *Core:* "Standing" is just a proxy for "Blame is useless" or "Blame is unfair."
  *   *Score:*
      *   **Truth/Standing Separation:** **Fail.** Collapses standing into other categories.
      *   **Utility Separation:** **Fail.** Explicitly rejects this distinction.
      *   **Ordinary Practice:** **Fail.** Cannot explain why we treat "You lack standing" as a distinct objection from "This is unhelpful."
      *   **Verdict:** Theoretically clean, but explains away the data rather than saving the phenomenon.

  **Summary for your Seminar:**
  Push the **Incompatibility Worry**. If the seminar is circling, it's likely because participants are toggling between **Moral Authority** (universal) and **Relational Authority** (particular) without admitting they are different concepts. An adequate theory must either choose one and explain away the counter-cases, or admit standing is a cluster concept with no single foundation.
