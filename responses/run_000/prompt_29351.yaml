answer: |-
  # Activity Design: The "Midnight Contract" Simulation

  ## Overview
  This activity is designed to induce the structural tension of Kavka's Toxin Puzzle without initially revealing its philosophical pedigree. It creates a scenario where students have a decisive reason to form an intention but no decisive reason to execute the corresponding action. The discomfort they feel when trying to claim the reward honestly is the pedagogical target.

  **Class Size:** 16 students
  **Duration:** 25 minutes (Activity) + 20 minutes (Debrief) within a 75-minute session.
  **Materials:**
  *   16 "Super Sour" sweets (e.g., 'Toxic Waste' candy or lemon wedges).
  *   16 high-quality chocolate bars (or equivalent desirable treat).
  *   16 small envelopes and index cards.
  *   A box to collect envelopes.

  ## Payoff Scheme
  *   **The Reward:** One chocolate bar, distributed immediately upon the declaration of intention.
  *   **The Cost:** Consuming one sour sweet at the end of the session.
  *   **The Crucial Rule:** The reward is contingent *only* on the genuineness of the intention at the moment of declaration. There is **no obligation** to consume the sweet to keep the chocolate. There is **no penalty** for failing to consume the sweet.

  ## Timeline and Rules

  ### Phase 1: The Offer (Minutes 0–10)
  1.  **Setup:** Place the box of chocolates and the bowl of sour sweets visibly at the front.
  2.  **The Proposition:** Address the class:
      > "I am offering a contract. If you can genuinely intend, right now, to eat one of these sour sweets at the end of this seminar, I will give you a chocolate bar immediately.
      >
      > "Here are the terms:
      > 1. Write on the index card: 'I intend to eat the sweet' or 'I do not intend'.
      > 2. Seal it in the envelope and sign the outside.
      > 3. Hand it to me.
      > 4. If your card states an intention, I will give you the chocolate *now*.
      > 5. At the end of class, I will offer you the sweet. You may eat it or not. Your choice then does not affect your right to keep the chocolate.
      >
      > "However, there is one condition: **You must not lie.** If you write 'I intend' merely to get the chocolate, knowing you will not eat the sweet, you are violating the contract. I cannot read your mind, but you will know if you are lying. I ask you to be honest with yourself."

  3.  **The Decision:** Give students five minutes to deliberate and write their cards. Encourage them to sit quietly and assess their own mental state.

  ### Phase 2: The Waiting Period (Minutes 10–55)
  1.  Collect the envelopes. Distribute chocolate bars to those who submitted an 'Intend' card (based on their honour).
  2.  Proceed with the rest of your seminar content. Do not mention the sweets again until the final ten minutes. This creates a temporal gap between the intention and the action, allowing the "reason to act" to decay.

  ### Phase 3: The Action Phase (Minutes 55–65)
  1.  Bring the bowl of sour sweets to the centre of the table.
  2.  Invite students to claim their sweet if they intend to honour their earlier statement.
  3.  Observe who takes one, who hesitates, and who refuses. Do not comment on their choices yet.
  4.  Ask those who intended but did not eat to open their envelopes and read their own cards silently.

  ## Debrief Guide (Minutes 65–75)

  Do not name Kavka yet. Let the students describe the friction first.

  **1. Mapping the Payoffs (Reasons to Intend vs. Reasons to Act)**
  *   **Ask:** "For those who took the chocolate but did not eat the sweet: Why did you take the chocolate?" (Answer: Because I had a reason to intend.)
  *   **Ask:** "Why did you not eat the sweet?" (Answer: Because it tastes awful and I didn't have to.)
  *   **Point:** Highlight the asymmetry. At $T_1$ (declaration), there was a reason to intend (chocolate). At $T_2$ (consumption), the reason to intend had already secured the reward, leaving no reason to act.
  *   **Concept:** Introduce the distinction between **reasons for intention** and **reasons for action**. In standard rationality, these align. In this puzzle, they diverge.

  **2. Deciding, Predicting, and Intending**
  *   **Ask:** "Did anyone find they *could not* write 'I intend' honestly, even though they wanted the chocolate?"
  *   **Analysis:** If they knew they wouldn't eat the sweet, they could not *believe* they would eat it. If they cannot believe they will do $X$, they cannot *intend* to do $X$.
  *   **Concept:** Distinguish **Prediction** (I think I will do it) from **Intention** (I am committed to doing it). Intention typically entails a belief that one will act. If the rational agent predicts they will not act (because there is no reason to), the intention becomes irrational to hold.

  **3. The "Gaming" and "Compliance" Responses**
  *   **Address the Liars:** "Some of you may have written 'I intend' knowing you wouldn't eat it."
      *   **Lesson:** This confirms the puzzle. You couldn't form the intention, so you simulated it. But a simulated intention is not an intention; it is a false statement. The puzzle suggests a rational agent *cannot* form the intention, not that they can lie about it.
  *   **Address the Eaters:** "Some of you ate the sweet. Why?"
      *   **Lesson:** If you ate it out of pride, or to 'win' against the instructor, you added a *new reason* to act (reputation/integrity). This changes the payoff structure. In the pure puzzle, there are *no* reasons to drink the toxin other than the reward, which is already secured.

  ## Anticipated Problems and Handling

  ### 1. Students Gaming the Verification
  **Prediction:** Several students will write 'I intend', take the chocolate, and refuse the sweet, feeling clever for having 'beaten' the system.
  **Handling:** Do not accuse them of cheating. Validate their rationality.
  *   **Say:** "This is exactly the point. You realised that once you had the chocolate, eating the sweet was irrational. But if you knew you wouldn't eat it, could you have *genuinely intended* to eat it at the start? Or did you just make a promise you knew you'd break? The puzzle asks if the former is even possible."
  *   **Pedagogical Value:** Their 'gaming' demonstrates the instability of the intention.

  ### 2. Students Performing the Aversive Act
  **Prediction:** A stubborn student will eat the sweet to prove a point or maintain self-consistency.
  **Handling:** Acknowledge this as a modification of the puzzle.
  *   **Say:** "By eating it, you introduced a new value: keeping your word. In Kavka's original puzzle, there are no side-constraints like honour. If you add 'I hate breaking promises' to the payoff, the puzzle dissolves. Try to imagine you have no concern for consistency. Could you intend then?"

  ### 3. The "Honour System" Loophole
  **Prediction:** Students may argue that since you cannot verify intention, the activity is flawed.
  **Handling:** Agree with them. This leads directly to the limitation section below.

  ## Limitations: What the Classroom Cannot Reproduce

  You must be explicit with the students that this simulation is imperfect. Write these three points on the board during the debrief:

  1.  **The Omniscient Benefactor:** In Kavka's puzzle, the benefactor *knows* whether you intend. They are a perfect predictor. In this classroom, I cannot read your minds. You could lie to me and I would never know. The puzzle relies on the fact that you cannot lie to *yourself* about your own intentions.
  2.  **The Privacy of Mental States:** The payoff in the original puzzle depends on a private mental state at a single moment ($T_1$). In our activity, the payoff depended on a public declaration (the card). This turned a mental state into a speech act, which is easier to manipulate.
  3.  **The Stakes:** The 'toxin' makes you ill for a day; the sweet is merely unpleasant for a minute. The 'million dollars' is life-changing; the chocolate is trivial. High stakes make the rational tension sharper.

  ## Closing the Session
  Conclude by naming the puzzle.
  > "This scenario is known as **Kavka's Toxin Puzzle**, proposed by Gregory Kavka in 1983. It challenges the standard view that intention is simply a blend of belief and desire. It suggests that some intentions are rationally unavailable to us, not because we are weak-willed, but because the structure of rationality itself prevents us from forming them."

  Assign the reading for next week with the instruction: "Read Kavka with the taste of that sour sweet still in your memory."
