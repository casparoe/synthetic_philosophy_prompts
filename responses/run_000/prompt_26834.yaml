  Based on the verdicts you've collected, your philosopher is navigating a classic tension in metaphysics: the line between *discovery* (finding what is already there) and *invention* (imposing order for our own purposes). Her pattern suggests she is not a blanket constructionist (she believes atoms and sex are real) nor a blanket realist (she believes money and race are constructed).

  Here are the three most plausible rules that fit her prior verdicts, how they apply to the case of "planet," and my assessment of which rule she is actually using.

  ### Rule 1: The Causal Structure Test (Scientific Realism)
  **The Rule:** A category is **not socially constructed** if it tracks a mind-independent causal mechanism or "natural kind" (a group of things that share underlying physical properties), even if humans debate the boundaries. A category **is socially constructed** if it groups together phenomena that do not share a single underlying cause, serving instead as a useful label for a heterogeneous cluster.
  *   **Fits her verdicts:** *Atoms* and *biological sex* track discrete physical structures. *Species* track evolutionary lineages (a causal process), so they are real, even if biologists argue over how to measure them. *Schizophrenia* is constructed because it is a symptom cluster with multiple possible causes, not a single disease entity. *Race* is constructed because it does not track significant genetic causal clusters.
  *   **Prediction for Planet:** **Not Socially Constructed.** She would likely argue that "planethood" tracks a specific physical process (hydrostatic equilibrium and dynamical dominance/clearing the neighborhood). The IAU vote didn't *create* the physical difference between Pluto and Earth; it merely codified a pre-existing dynamical reality.

  ### Rule 2: The Institutional Dependence Test (Constructivism)
  **The Rule:** A category is **socially constructed** if its definition relies on a human agreement, vote, or institution to exist. A category is **not socially constructed** if it is defined entirely by physical facts that would obtain without human observers.
  *   **Fits her verdicts:** *Money*, *adulthood*, and *gender* (in her view) require social institutions to function. *Atoms* and *puberty* happen regardless of us.
  *   **Prediction for Planet:** **Socially Constructed.** The 2006 definition was explicitly the result of a vote by the IAU. Before that vote, there was no strict definition. Because the boundary was stipulated by a committee to solve a practical problem (managing the number of planets), the category itself is a product of that institutional act.

  ### Rule 3: The Sharp Discontinuity Test (Sorites Sensitivity)
  **The Rule:** A category is **not socially constructed** if nature provides a sharp, binary break between members and non-members. It **is socially constructed** if the underlying reality is a continuum and humans must draw an arbitrary line somewhere.
  *   **Fits her verdicts:** *Atoms* are discrete units. *Puberty* is a distinct hormonal cascade. *Adulthood* (age 18) is an arbitrary line on a continuum of maturity. *Schizophrenia* is a line drawn on a continuum of psychological distress.
  *   **Prediction for Planet:** **Socially Constructed.** There is no sharp physical break between a "large dwarf planet" and a "small planet." The "clearing the neighborhood" criterion is a matter of degree (a parameter epsilon), not a binary switch. The IAU vote drew a line on a continuum, making the category conventional.

  ***

  ### Best Guess: Rule 1 (The Causal Structure Test)

  I am confident she is running **Rule 1**.

  **Why:** The "Species" verdict is the Rosetta Stone here. Many philosophers argue that species *are* socially constructed precisely because biologists choose among competing concepts (Rule 2) and because reproductive isolation is often a matter of degree (Rule 3). By explicitly stating that species are **not** socially constructed *despite* those two facts, she has signaled that she prioritizes **underlying ontology** over **epistemic practice**.

  She believes that if there is a robust, mind-independent causal reality (like an evolutionary lineage), human debate about how to define it does not make the category constructed. Since "planet" (under the IAU definition) is defined by dynamical processes (formation and orbital clearing) rather than purely cultural interests (like money), she will likely treat it like she treats species: a real natural kind that humans have recently gotten better at describing.

  She will likely say: *"The IAU vote was a human practice, but it was an attempt to name a physical reality. The reality exists regardless of the vote."*

  ***

  ### The Further Case: "Mineral Species"

  To cleanly separate Rule 1 (Causal Structure) from Rule 2 (Institutional Dependence), ask her about **Mineral Species** (e.g., the definition of a specific mineral like Quartz or Diamond).

  **The Setup:** Mineralogy is governed by the International Mineralogical Association (IMA). A substance is only officially a "mineral species" if the IMA commission votes to approve it. This mirrors the IAU vote for Pluto perfectly. However, minerals are defined by crystal structure and chemistry, which are physical causal facts.

  **What her answer tells us:**
  *   **If she says Mineral Species are NOT Socially Constructed:** She is consistently following **Rule 1**. She believes the physical crystal structure makes the kind real, and the IMA vote is merely a human recognition of that reality (just like the Species verdict). This confirms she will say "Planet" is Not SC.
  *   **If she says Mineral Species ARE Socially Constructed:** She is following **Rule 2**. She believes that because the *official status* depends on a committee vote, the category is constructed, regardless of the physical chemistry. This would suggest she might distinguish "Planet" from "Species" and say "Planet" *is* constructed because the IAU vote was more stipulative than the biological reality of species.

  **Why this case?** It isolates the "Vote" variable. In both Minerals and Planets, a committee votes. In both Minerals and Species, there is an underlying physical structure. Her answer reveals whether the *Vote* trumps the *Structure* in her ontology.
