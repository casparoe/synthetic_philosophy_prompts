      *   *Problem 2: Constitutive Preferences.* Can you erase the pain without erasing the growth? The film suggests the pain is constitutive of who they are. Erasing it creates a hollow self (the "spotless mind" is not a blessing, but a lobotomy).
      *   *Problem 3: The Incoherence of Resistance.* Joel resists *during* the procedure. This shows the "future self" (the one undergoing erasure) disagreeing with the "past self" (the one who signed the contract). But since the procedure alters memory, the "future self" is being deleted.
