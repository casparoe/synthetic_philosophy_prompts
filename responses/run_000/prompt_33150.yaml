  ### Part 1: Brainstorming Approaches

  Here are three potential approaches to teaching the concept of "intuition pumps" without using the term upfront.

  1.  **The "Moral Luck" Split (The Careless Chemist)**
      *   **Concept:** Half the room reads about a chemist who is careless but causes no harm. The other half reads about a chemist who is equally careless but causes an explosion.
      *   **Mechanism:** Relies on *outcome bias*. The vivid detail of the explosion pumps the intuition of greater blame, despite identical negligence.
      *   **Pros:** Classic philosophical problem (Nagel/Williams); creates strong cognitive dissonance.
      *   **Cons:** Might feel like a psychology trick rather than a methodological critique of *argumentation*. Students might argue the outcome *is* morally relevant (consequentialism), muddying the water.

  2.  **The "Identifiable Victim" Donation**
      *   **Concept:** Group A is asked to donate to save a specific named child (with a photo). Group B is asked to donate to save a statistical group of children.
      *   **Mechanism:** Relies on *emotional salience*. The vivid details of the single child pump the intuition of obligation.
      *   **Pros:** Very visceral; easy to run.
      *   **Cons:** Well-known in psychology (Identifiable Victim Effect); might feel more like a fundraising trick than a lesson on philosophical *methodology* and argument structure.

  3.  **The "Framed Policy" Case (Selected)**
      *   **Concept:** Both groups evaluate the exact same school safety policy. Group A receives a narrative focusing on *safety benefits* (omitting privacy costs). Group B receives a narrative focusing on *privacy costs* (omitting safety benefits).
      *   **Mechanism:** Relies on *selective inclusion* and *framing*. The narrative context pumps the intuition toward "Good Policy" or "Bad Policy" before the technical details are analyzed.
      *   **Pros:** Directly addresses the prompt's focus on "framing, vivid details, selective inclusion." It mirrors how philosophical thought experiments are often loaded. It allows for a "reveal" where the technical specs are shown to be identical.
      *   **Cons:** Risk of students feeling manipulated/deceived (needs careful handling).

  **Selection:** I recommend **Option 3 (The Framed Policy Case)**. It best captures the *rhetorical* nature of intuition pumps (how the story is told) rather than just psychological bias. It allows you to demonstrate how *omission* and *emphasis* function as philosophical machinery.

