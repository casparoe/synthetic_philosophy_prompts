  ### Part 4: Troubleshooting & Limitations

  **What Will Predictably Go Wrong:**
  1.  **The "Gotcha" Backlash:** Students may feel tricked or manipulated, leading to disengagement during the debrief.
      *   *Fix:* Acknowledge it immediately. "It feels unfair to be tricked. That frustration is exactly what philosophers feel when they realize an argument has been manipulating them. We did this to *feel* the mechanism, not to fool you."
  2.  **Early Detection:** A sharp student might notice the technical details are the same during the debate phase.
      *   *Fix:* If someone says, "Wait, aren't these the same?" validate them! "Excellent catch. Keep that to yourself for 5 minutes. Let the others finish their reasoning. You'll be our key witness during the reveal."
  3.  **Moral Relativism:** Students might conclude "Morals are just framing, nothing is real."
      *   *Fix:* Correct this in the debrief. "The *intuition* was framed, but the *ethical work* is to see through the frame. Philosophy isn't about having no intuitions; it's about testing which ones survive when you remove the pump."

  **Limitations (What You Must Supply):**
  *   **The Definition:** The activity demonstrates *framing bias*. You must explicitly connect this to Dennett's specific concept of the "Intuition Pump" (which often refers to evolutionary or consciousness arguments). The activity shows the *phenomenon*, but you must supply the *theoretical context*.
  *   **The "Defusing" Skill:** The activity shows the problem, not the solution. You must explicitly model how to "defuse" a pump (e.g., "Rewrite the Trolley Problem without the word 'fat man' or 'track'").
  *   **Nuance:** Not all vivid details are bad. Some are necessary for understanding. You need to explain that the sin is *irrelevant* vividness that steers conclusion.

