  ### Part 2: Activity Design – "The Security Protocol"

  **Objective:** Participants will evaluate a policy based on a narrative description, experience a strong intuitive pull, and then discover that their intuition was driven by selective framing rather than logical substance.

  **Materials Needed:**
  *   Two distinct handouts (Print 8 copies of Version A, 8 copies of Version B).
  *   Pens/Pencils.
  *   Whiteboard/Marker.
  *   A "Technical Spec Sheet" (1 copy, revealed at the end).
  *   Timer.

  **The Setup:**
  *   **Version A (The "Safety" Frame):** Describes the policy as a response to a tragic bullying incident. Uses words like "protection," "vigilance," "prevention." Mentions the technology scans for "threats."
  *   **Version B (The "Privacy" Frame):** Describes the policy as a response to administrative liability. Uses words like "surveillance," "monitoring," "data collection." Mentions the technology scans for "keywords."
  *   **The Reality:** The underlying technology and rules described in both are logically identical (e.g., "Software scans all outgoing Wi-Fi traffic for 50 flagged keywords and alerts admin").

  **Timeline (60 Minutes):**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Welcome. No theory. "Today we are acting as a ethics board for a local high school. You have a case to decide." |
  | **05-15** | **Private Review** | Split room: Left Side gets Version A, Right Side gets Version B. **Rule:** Do not show your paper to anyone. Read silently. Vote privately on a slip of paper: *Approve* or *Reject*. |
  | **15-35** | **Group Deliberation** | Group A discusses why they voted their way. Group B discusses theirs. Select one spokesperson per group to summarize the "moral core" of their decision. |
  | **35-50** | **The Clash** | Spokespersons present. Open debate. Group A argues for Safety; Group B argues for Rights. Facilitator writes key arguments on the board (e.g., "Prevents Harm" vs. "Invades Privacy"). |
  | **50-55** | **The Reveal** | Stop the debate. Hand out the **Technical Spec Sheet**. Reveal that both groups were evaluating the *exact same system*. The narratives were different; the facts were not. |
  | **55-60** | **Debrief** | Introduce the term "Intuition Pump." Map the activity to the concept. |

  ---

  ### Part 3: Detailed Debrief Script

  *This is the most critical part. Do not lecture until the reveal.*

  **1. The Immediate Reaction (50-55 min)**
  *   **Facilitator:** "Look at the board. Group A, you argued this is about *safety*. Group B, you argued this is about *control*. But the technical sheet shows the mechanism is identical. Why did you disagree?"
  *   **Allow 2 minutes of chaotic realization.** Let them feel the frustration of having argued past each other.

  **2. Introducing the Concept (55-57 min)**
  *   **Facilitator:** "In philosophy, we call what just happened an **Intuition Pump**. This is a term coined by philosopher Daniel Dennett."
  *   **Definition:** "An intuition pump is a thought experiment or scenario designed to make a conclusion feel obvious, not because the logic forces it, but because the *story* steers your emotions."
  *   **Mapping the Activity:**
      *   **The Pump:** The narrative preamble (The bullying tragedy vs. The administrative liability).
      *   **The Fluid:** Your moral intuition (Approval vs. Rejection).
      *   **The Machinery:** Selective inclusion. Version A included the *benefit* and hid the *cost*. Version B included the *cost* and hid the *benefit*.
      *   **The Result:** You felt certain you were right, but your certainty was manufactured by the framing.

  **3. Why This Matters for Philosophy (57-60 min)**
  *   **Facilitator:** "Philosophers use thought experiments (like the Trolley Problem) to test theories. But if the experiment is 'pumped'—if it loads the dice with vivid, irrelevant details—it's bad methodology."
  *   **Key Takeaway:** "Good philosophy requires 'defusing the pump.' It means rewriting the scenario to remove the emotional loading and see if the logic still holds. Today, you felt the pump working on you. Next time you read a philosophical case, ask: *What details are here to make me feel, rather than think?*"

