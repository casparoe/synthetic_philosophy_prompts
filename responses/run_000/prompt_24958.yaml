  so i've been kind of spiraling lately because my brother in law sent me this long email basically saying i'm in an echo chamber about zoning reform and housing policy (long story, family dinners got weird). so i've been trying to fix it — started following a bunch of yimby accounts even though i find them annoying, subscribed to some urbanist substacks, even joined a discord where people argue about this stuff. but honestly i think it's made me more entrenched? like now i just have all these views i disagree with in my face and it's making me dig in harder, not reconsider anything. i thought the whole problem with echo chambers was that you don't hear the other side, so hearing the other side should fix it. what am i doing wrong? is the whole "echo chamber" thing just bs, or is there something about how they actually work that i'm not getting?
