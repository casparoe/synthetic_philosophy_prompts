      *   **Phase 4: Ontology of Social Facts.** Can society be atomized into countable units? (Physicalism connection).
      *   **Phase 5: The Neutrality Tension.** Editorial choices vs. Claimed Objectivity.
      *   **Phase 6: Consistency Check.** Does Neurath's fallibilism contradict the "directness" of Isotype?
      *   **Phase 7: Rival Reconstruction.** How would a project look if it embraced convention/theory-ladenness explicitly?

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the stage. Acknowledge Neurath's unique position in the Vienna Circle (the sociologist/engineer vs. the logicians).
      *   *Reconstruction:* Focus on the *transformation* process. Fact -> Statistic -> Pictogram. The "one symbol = one quantity" rule is crucial.
      *   *Presuppositions:*
          *   *Strict:* Quantifiability of social facts. Comparability. Stability of the symbol's meaning within the chart.
          *   *Fit:* Democratic access. "International language." (This is a hope, not a logical necessity).
      *   *Theory of Meaning:* This is the core philosophical puzzle.
          *   *Surface reading:* Resemblance (iconicity). It looks like a man, so it means a man.
          *   *Deep reading:* It's a token in a calculus. One man icon $\neq$ one man, but $x$ people.
          *   *Verdict:* It *claims* transparency but *operates* as a convention. Neurath knows this (he called it a "language"). The "naturalness" is a rhetorical strategy for accessibility, not a metaphysical claim about perception.
      *   *Ontology (Physicalism):* To count people/things, they must be spatio-temporally located. This fits Physicalism. But can "unemployment" be physicalized? Yes, as behavior/status in a system. The risk is *reification* (treating complex social relations as simple objects).
      *   *Neutrality vs. Judgment:* The "Transformation" process. The statistician decides what counts. The artist decides how to simplify. This is where the "neutrality" cracks. Neurath admits this in his later work (the role of the "transformer").
      *   *Consistency:* Is there a contradiction between fallibilism and "direct facts"?
          *   *Resolution:* Isotype isn't *Truth*; it's a *tool* for organizing provisional knowledge. It avoids metaphysics, not revision. The "directness" is about avoiding *verbal* ambiguity, not claiming epistemic certainty.
      *   *Rival View:* If we treat it as *thoroughly* conventional (like Goodman's symbols), the design changes. We stop pretending it's "natural." We emphasize the legend/key. We might show the uncertainty margins visually.

