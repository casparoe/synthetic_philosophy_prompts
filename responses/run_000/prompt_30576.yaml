      *   *Goals:* Cross-linguistic intelligibility, accessible to uneducated, unified science, democratic enlightenment.
      *   *Neurath's Philosophy:* Physicalism, Unity of Science, Encyclopedism, Anti-metaphysical, Fallibilism (no "mirror of nature").
      *   *The Tension:* How can pictures be "direct" and "neutral" if all observation is theory-laden and language is conventional?

  3.  **Step-by-Step Analysis Plan:**
