answer: |-
  This is a classic debate in contemporary axiology, and your friend is channeling a very specific, hard-nosed reading of Parfit (likely from *On What Matters* or his earlier papers on rationality). His worry is essentially that if the Trichotomy Thesis (Better, Worse, or Equal) fails, practical reason collapses into contradiction or paralysis.

  However, his position relies on a false dilemma: either values are rankable (Trichotomy) or they are unrelated (Incomparable). He is missing the middle ground that saves the phenomenon of incommensurability without breaking rationality.

  Here is the strongest case you can make for incommensurability as a genuine, distinct phenomenon, specifically designed to dismantle Parfit's "contradictory imperatives" objection without relying on Raz's density of value.

  ### 1. The Terminological Trap: He's Describing "Parity," Not Incomparability
  First, point out a sleight of hand in his definition. He says incommensurability doesn't exist, only "incomparable" values, which he defines as "values that can be compared but where neither is better than the other."

  If two items **can be compared**, they are not incomparable by definition. Incomparability means no positive normative relation holds at all (like comparing the taste of vanilla to the moral status of a rock). If your friend admits a normative relation holds (i.e., we can weigh them against each other), but denies that one is better, worse, or equal, he is inadvertently arguing for **Ruth Chang's concept of "Parity."**

  By admitting they are comparable, he has already conceded the core claim of incommensurability: that the standard Trichotomy (Better/Worse/Equal) is insufficient to describe the normative landscape. He is just refusing to use the word "incommensurable." You need to press him: *If they are comparable but not equal, what is the logical structure of that comparison?* If he can't name it, he hasn't solved the problem; he's just named it "Incomparable" to avoid the metaphysical baggage.

  ### 2. The Small Improvement Argument (Logic, not Density)
  To prove that this fourth relation (Parity/Incommensurability) exists without using Raz's "density" argument, use Chang's **Small Improvement Argument**. This is a logical proof, not a metaphysical claim about value properties.

  **The Setup:** Imagine you are choosing between two careers: Lawyer and Clarinetist. They seem roughly equivalent in value.
  **The Test:** If they were truly **Equal**, then a tiny improvement to one (say, the Lawyer job pays $100 more) must make it **Better**.
  **The Intuition:** But it seems plausible that a $100 raise doesn't make the Lawyer job *better* than the Clarinetist life; the choices are still in the same ballpark.
  **The Conclusion:** If A is not better than B, B is not better than A, and A is not Equal to B (because a small improvement didn't tip the scale), then the Trichotomy fails.

  This proves there is a logical space for a fourth relation. Your friend's Parfitian objection assumes the Trichotomy is exhaustive. The Small Improvement Argument shows it isn't. This isn't about values being "dense" or "complex"; it's about the logic of comparative relations.

  ### 3. Dissolving the "Contradictory Imperatives" Objection
  This is the core of your friend's Parfitian worry. Parfit argues that if A and B are incommensurable, reason might command "Choose A" (based on value set 1) and "Choose B" (based on value set 2), creating a contradiction. Or, reason commands nothing, leading to paralysis.

  **The Counter: Underdetermination is not Contradiction.**
  You need to argue that incommensurability does not generate *contradictory* imperatives; it generates *underdetermined* imperatives.

  *   **Contradiction:** Reason says "You must do A" AND "You must not do A." (This is irrational).
  *   **Underdetermination:** Reason says "A is permissible" AND "B is permissible," but does not dictate which one is mandatory.

  Incommensurability creates a **zone of discretion**. In this zone, reason does not break down; it simply hands the baton to the **Will**. This is the **Voluntarist Reply**.

  When faced with incommensurable choices (e.g., having a child vs. writing a masterpiece), reason cannot tell you which is "better" because there is no fact of the matter. However, this doesn't mean you choose randomly. It means your **commitment** creates the reason. By choosing the child, you *make* that path the right one for you through your commitment to it.

  Parfit's objection assumes that reasons must always be *found* (discovered in the world). The incommensurability thesis argues that in hard choices, reasons are *made* (constituted by the agent). This isn't incoherent; it's the very definition of human agency. If the Trichotomy always held, we would be mere scanners of value, not creators of our lives.

  ### 4. The Phenomenology of "Residue"
  Finally, hit him with the phenomenological evidence. If your friend is right that these values are just "incomparable" or "equal," our emotional response to choice makes no sense.

  *   **If they were Equal:** Choosing one over the other should leave no rational regret. If I pick $10 over $10, I don't feel loss.
  *   **If they were Incomparable:** I shouldn't feel I made a sacrifice, because the unchosen option wasn't in the same running.
  *   **The Reality:** When we choose between incommensurables (Career vs. Family), we feel **agent-regret** or **residue**. We feel that something genuine was lost, even if we know we made the right choice.

  This "residue" (a term from Bernard Williams) is the emotional fingerprint of incommensurability. It signals that the unchosen option had weight that was not canceled out by the chosen one, nor was it equal to it. It was *on a par*, and thus required a sacrifice that an equal choice would not. If Parfit were right, this specific type of rational regret would be unintelligible.

  ### Summary for Round Two
  Tell your friend this:
  1.  **He's conceded the point:** By saying they are "comparable," he admits the Trichotomy fails. He's just arguing over labels.
  2.  **Logic over Metaphysics:** The Small Improvement Argument proves the Trichotomy is logically incomplete without needing Raz's density claims.
  3.  **Agency vs. Contradiction:** Parfit's "contradictory imperatives" fear is a category error. Incommensurability creates *discretion*, not contradiction. It allows the Will to create reasons where Reason runs out.
  4.  **The Cost:** Denying incommensurability makes the phenomenology of regret and sacrifice irrational.

  Parfit wants a world where reason always dictates a unique answer. You are arguing for a world where reason sets the stage, but agency writes the script. That isn't incoherence; that's freedom.
