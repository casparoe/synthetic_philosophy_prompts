  *   Chang/Parfit debate definition: Failure of the Trichotomy Thesis (Better, Worse, Equal).
  *   Friend's definition: "Incommensurable = contradictory imperatives." "Incomparable = comparable but neither better."
  *   *Crucial Move:* The friend is describing **Parity** but calling it **Incomparability**. I need to point out that if they admit the items are *comparable* (as they said: "values that can be compared"), then they have already accepted the phenomenon the user is defending, they are just mislabeling it. The real fight is whether the Trichotomy holds.

