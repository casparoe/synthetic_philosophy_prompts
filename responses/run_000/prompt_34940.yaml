  2.  **Deconstruct the Philosophical Positions:**
      *   *Particularism (e.g., Charles Pigden, David Coady):* Conspiracy theories are just explanations involving conspiracies. Since conspiracies happen (Watergate, Tuskegee), rejecting them *a priori* is dogmatic. The label is often used to protect power.
      *   *Generalism (e.g., Quassim Cassam, Brian Keeley, Sunstein & Vermeule):* Conspiracy theories exhibit specific vices (closed-mindedness, resistance to counter-evidence, proportionality bias). They form a distinct, unreliable category.

  3.  **Address the Implications (The "So What?"):**
      *   *Implication 1: The Burden of Proof.*
          *   Particularism: Burden is on the evidence, not the label. Don't dismiss based on category.
          *   Generalism: Burden is higher because the *method* is suspect.
      *   *Implication 2: Epistemic Humility vs. Vigilance.*
          *   Particularism: Requires humility (officials lie).
          *   Generalism: Requires vigilance against cognitive vices (my own tendency to see patterns).
      *   *Implication 3: Operationalizing Criteria.*
          *   How to tell the difference without just trusting CNN/BBC? Focus on *methodology* rather than *source*.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the tension. State the thesis: The debate isn't about defining "conspiracy theory" but about calibrating *epistemic virtues*.

      *   **Section 1: If the Particularists are Right (The Case for Humility).**
          *   *Core idea:* "Conspiracy theory" is a slur.
