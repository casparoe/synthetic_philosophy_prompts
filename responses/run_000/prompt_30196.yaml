answer: |-
  **Exam Question**

  **Question 1 (50 Minutes)**

  David Chalmers argues that the conceivability of philosophical zombies entails their metaphysical possibility, which in turn refutes physicalism. A standard physicalist response, drawing on Kripke, is that conceivability does not entail metaphysical possibility (e.g., one can conceive that Hesperus is not Phosphorus, but it is not possible). Chalmers contends that the zombie argument is specifically designed to survive this Kripkean objection.

  In a well-structured essay, explain *why* Chalmers believes the standard Kripkean response fails to block the zombie argument. Specifically, analyze the disanalogy Chalmers draws between theoretical identities (like 'Water = H₂O') and psychophysical identities. Finally, articulate what a physicalist must claim about the nature of *phenomenal concepts* or the structure of *epistemic space* to resist Chalmers' conclusion without simply denying the link between conceivability and possibility by fiat.

  ***

  **Model Answer**

  The zombie argument against physicalism relies on a specific modal inference: if a world physically identical to ours but lacking consciousness is conceivable, it is metaphysically possible; if such a world is possible, physicalism is false. Physicalists often object that conceivability is an epistemic notion while possibility is metaphysical, and the two do not always align. To evaluate this dispute, one must understand why Chalmers argues that the zombie case is immune to the standard examples used to sever this link.

  The standard physicalist appeal to Kripke relies on cases of a posteriori necessity, such as "Water = H₂O." Kripke argues that while it seems conceivable that water is not H₂O, this is an illusion. We are actually conceiving of a world where the *superficial properties* of water (clear, liquid, etc.) are met by a different substance, while water itself remains H₂O in all worlds. The appearance of contingency is explained by a contingent "mode of presentation" or reference-fixer. Thus, the conceivability of "water isn't H₂O" does not entail the possibility of "water isn't H₂O" because the concept 'water' rigidly designates H₂O, but we mistake the reference-fixer for the reference.

  Chalmers argues this strategy fails for consciousness. For psychophysical identities (e.g., "Pain = C-fiber firing"), there is no distinction between the reference and the reference-fixer. Phenomenal concepts refer to experience via the experience itself. When I conceive of pain without C-fiber firing, I am not conceiving of some contingent property associated with pain; I am conceiving of the phenomenon directly. There is no "illusion of contingency" to explain away because there is no second concept standing between the subject and the referent. Therefore, if zombies are conceivable, there is no Kripkean mechanism to block the inference to metaphysical possibility. The epistemic gap implies a metaphysical gap.

  To resist this without begging the question, a physicalist cannot simply assert "conceivability $\neq$ possibility." They must explain why consciousness is unique among natural kinds in allowing an epistemic gap that does not open a metaphysical one. The most sophisticated physicalist response is the Phenomenal Concept Strategy (PCS). The PCS grants that phenomenal concepts are distinct from physical concepts and that we cannot deduce one from the other a priori. However, it argues this is due to the unique *functional role* of phenomenal concepts, not the existence of non-physical properties.

  Phenomenal concepts are direct, recognitional, and perhaps involve quoting the experience itself. This special cognitive architecture creates an epistemic gap: we can conceive of the experience existing without the physical base because our conceptual apparatus isolates the experience from its causal history. However, the PCS insists this conceptual independence does not map onto ontological independence. The physicalist must argue that the "conceivability" of zombies tracks a fact about our concepts, not a fact about the world.

  Consequently, the crux of the debate shifts from modal logic to the philosophy of concepts. For the physicalist to win, they must show that the unique nature of phenomenal concepts can fully explain the intuition of contingency without positing non-physical properties. If they succeed, the inference from conceivability to possibility is blocked not by a general skepticism about modal intuition, but by a specific diagnosis of why phenomenal concepts mislead us. If they fail, Chalmers is right: the absence of a Kripkean explanation for the appearance of contingency means the appearance reflects reality. Thus, the zombie argument forces physicalism to either accept an unexplained brute identity or adopt a specific, controversial theory of how we conceptualize our own minds.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **A Grade (80–100): Excellent**
  *   **Argument Reconstruction:** Clearly distinguishes between the general conceivability objection and Chalmers' specific rebuttal regarding the "Kripkean Strategy."
  *   **The Disanalogy:** Explicitly explains *why* the Water/H₂O analogy fails for consciousness (i.e., the lack of a contingent mode of presentation/reference-fixer for phenomenal states). This is the crucial differentiator for an A.
  *   **Physicalist Counter:** Identifies that the physicalist must adopt a specific theory of concepts (e.g., Phenomenal Concept Strategy) rather than a general modal skepticism. Explains that the physicalist must argue the epistemic gap is compatible with ontological monism due to conceptual architecture.
  *   **Clarity:** Argument flows logically; no confusion between epistemic and metaphysical modalities.

  **B Grade (60–79): Good**
  *   **Argument Reconstruction:** Accurately states the zombie argument and the standard physicalist reply (conceivability $\neq$ possibility).
  *   **The Disanalogy:** Mentions that consciousness is "different" from water but fails to articulate the structural reason (reference-fixing vs. direct reference). May treat Kripke's objection as simply "wrong" rather than "inapplicable."
  *   **Physicalist Counter:** Suggests the physicalist can just deny the inference or claim identities are brute, without engaging with the conceptual explanation required to make that plausible.
  *   **Clarity:** Generally clear but may lack precision in modal terminology.

  **C Grade (50–59): Pass**
  *   **Argument Reconstruction:** Defines zombies and physicalism correctly but treats the argument as a simple "if you can imagine it, it exists" claim.
  *   **The Disanalogy:** Fails to address the Kripkean water analogy or treats it as identical to the zombie case.
  *   **Physicalist Counter:** Vaguely asserts physicalism is true because science says so, or repeats that "conceivability isn't possibility" without explaining the challenge Chalmers poses to that claim.

  **Specific Deductions:**
  *   **-10 marks:** Confusing epistemic possibility (conceivability) with metaphysical possibility without distinction.
  *   **-10 marks:** Claiming Chalmers argues zombies *exist* rather than that they are *possible*.
  *   **-15 marks:** Failing to address the prompt's requirement to explain what the physicalist must say about *concepts* to resist the argument.
  *   **-5 marks:** Poor structure or exceeding word count significantly (if applicable).
