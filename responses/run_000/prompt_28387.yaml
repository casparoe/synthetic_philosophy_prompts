  You're right that Kolmogorov complexity is invariant only up to an additive constant depending on the Universal Turing Machine, and yes, if we choose a "grue-friendly" UTM, the constants shift. But this misses the crucial constraint: induction isn't performed over abstract symbols, but over sensory inputs. We must measure complexity relative to the *interface of observation*. Our sensory apparatus delivers spatiotemporal data; mapping that data to "green" requires a simpler circuit than mapping it to "grue," which necessarily involves a temporal check. Even if you stipulate "grue" as a primitive symbol, the computational cost of verifying whether an object falls under that predicate given raw sensory data remains high. The complexity isn't in the label, it's in the recognition function.

  Furthermore, this isn't circular because the normative force comes from the goals of induction itself: prediction with limited data. In PAC learning, the sample complexity required to learn a hypothesis class is determined by its VC dimension. The class of "green" projections has a lower VC dimension than "grue" projections when modeled against temporal data, meaning "green" converges on the truth with fewer samples. This is a mathematical theorem, not a linguistic convention. We ought to prefer "green" not because it's entrenched, but because favoring lower-complexity hypotheses is the only strategy that guarantees generalization for bounded agents. To reject this is to reject the requirement that induction must be computationally feasible.
