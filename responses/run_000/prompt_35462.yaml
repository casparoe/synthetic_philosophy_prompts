      *   *Actually, the most common interpretation in undergrad courses:* Dennett argues that the "Cartesian Theater" is wrong. Regarding Malcolm: Dennett agrees that the *report* is the data, but disagrees that this means there was no prior state. However, the student's claim that Dennett concludes "Malcolm's conclusion is confirmed" is definitely wrong. Dennett is a realist about mental states (functionally), Malcolm is a Wittgensteinian skeptic about them.
      *   *Refining the Grade:* The Malcolm section is strong (A- level). The Dennett section is failing (D level). The REM paragraph is accurate regarding science but contradicts the Dennett analysis.
