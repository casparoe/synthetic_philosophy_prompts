      *   *Introduction:* Acknowledge the common claim (Solomonoff -> Occam) and the standard defense (invariance theorem).
      *   *The Invariance Theorem:* Explain $K_U(x) \le K_V(x) + c_{UV}$. The constant $c_{UV}$ depends on the machines but not on $x$. This implies priors differ by a multiplicative constant $2^{-c_{UV}}$.
      *   *The Problem with the Constant:* The constant can be huge. It depends on the complexity of simulating one UTM on another. If I hardcode a bias into my UTM, I can make specific strings have very low complexity relative to another UTM.
      *   *Constructing a Biased UTM:* Describe how to make a UTM $M'$ that checks if the input is a specific string $s$ (or describes a specific hypothesis) and outputs it immediately, making $K_{M'}(s)$ very small (e.g., 1 bit), while a standard UTM might require millions of bits. This shows the "constant" isn't negligible in practice.
      *   *Finite Data vs. Limit:* Solomonoff induction converges to the truth in the limit (with probability 1). However, convergence rates depend on the prior. If the prior is exponentially small for the true hypothesis (due to UTM choice), you need exponentially more data to overcome it. Since we always have finite data, the constant matters immensely.
      *   *Verdict:* Does it justify Occam's Razor? It formalizes *a* version of Occam's Razor (shorter programs = higher prior), but it doesn't solve the *problem of induction* regarding *which* simplicity metric to use. It shifts the burden from "why simplicity?" to "why this UTM?". It provides a relative justification within a framework, but not an absolute metaphysical grounding.

