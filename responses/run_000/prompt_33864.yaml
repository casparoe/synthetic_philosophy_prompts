      *   *Black's Move:* He argues these are qualitatively identical relational properties.
      *   *Defender's Counter:* A defender might argue that "Being 5 miles from *that* sphere" involves indexicality or haecceity, which distinguishes them. Or they might deny the possibility of such a universe (metaphysical necessity).
