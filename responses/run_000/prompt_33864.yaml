      *   *Claim 2:* Max Black refuted this with the two-sphere universe thought experiment.
      *   *Claim 3:* The spheres share *every* property (including relational ones like distance from the other).
      *   *Claim 4:* The spheres are clearly distinct.
      *   *Claim 5:* Therefore, PII fails.
      *   *Claim 6:* Black's argument is widely regarded as having settled the matter (PII is not necessary, maybe contingent).

  3.  **Evaluate Claim 1 (Leibniz's PII):**
      *   *Nuance:* Leibniz's PII is often tied to the Principle of Sufficient Reason (PSR). For Leibniz, properties include *haecceities* (thisness) or relational properties grounded in monadic perceptions.
      *   *Vulnerability:* If "properties" includes spatiotemporal location *as a primitive*, PII is trivial. If it excludes location, Black's example works *unless* location is derived from internal relations.
