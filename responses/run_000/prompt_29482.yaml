  8.  **Wait, one nuance:** Is it *always* wrong to say Kelly maximizes expected wealth in the long run?
      *   In the limit $T \to \infty$, the path that maximizes the growth rate dominates the *realized* wealth almost surely. However, the *expectation* $E[W_T]$ is an integral over all paths. The paths where you bet more than Kelly (and don't go bankrupt immediately) have huge payoffs that pull the expectation up, even if they happen with probability approaching zero. So $E[W_T]$ is *not* maximized by Kelly. The *median* or *typical* path is. The student wrote "expected final bankroll." That is technically incorrect.
      *   Also, the prompt asks: "Which view is closer to the truth?" The student says "First view (Just EU)." A strong answer would argue "It's complicated" or "Second view (Different approach)" because of the *justification* (growth vs. preference). The student's dismissal of the "different approach" view is weak given the course context.

