      *   *Second Issue:* The reduction of Kelly to "just EU with log utility" ignores the *ergodicity* argument (Peters, Gell-Mann, etc.), which is likely part of a unit on "Critics." If the course frames Kelly as a critique of standard EU (due to non-ergodicity), then saying "it's just EU" misses the philosophical point of the unit.
      *   *Is the TA being pedantic?* No. In formal epistemology/decision theory, the distinction between maximizing $E[\log W]$ (growth optimal) and maximizing $E[W]$ (expected wealth) is fundamental. The student claims Kelly maximizes expected wealth in the long run. That is mathematically false.

