answer: |-
  Dear Colleague

  It is a pleasure to correspond with you on this intersection of our fields, for your intuition that the singleton hypothesis bears a striking familial resemblance to the debates surrounding unipolarity is well founded. To restate the singleton hypothesis in the vocabulary of international relations theory, one might describe it as a proposition concerning the end-state of the distribution of power and agency within the international system. Proponents of the singleton hypothesis argue for the emergence of a global order in which a single decision-making agency possesses a monopoly on the use of force and advanced technology, effectively establishing a form of absolute unipolarity where the capability to balance is not merely suppressed but rendered physically impossible. In this framework, the singleton is the ultimate hegemon, one that has solved the enforcement problem that plagues traditional hegemonies by securing a decisive strategic advantage, often conceptualized as a technological lock-in resulting from the development of artificial general intelligence. The claim is that such an order would be uniquely stable because it eliminates the security dilemma entirely; without peer competitors, there is no need for arms races, no risk of miscalculation leading to great power war, and no pressure to cut corners on safety protocols in the deployment of dangerous technologies. Conversely, they regard the present order, whether characterized as multipolar or transiently unipolar, as dangerously unstable because it subjects all actors to competitive pressures that incentivize risky behavior. In your terms, the current security dilemma forces states to prioritize speed and capability over safety and governance, creating a high probability of existential catastrophe through nuclear exchange, bioengineering, or misaligned AI, driven by the fear that any restraint will be exploited by a rival. The paths to a singleton that these proponents take seriously generally bypass the traditional IR mechanisms of gradual capital accumulation or coalition building; instead, they focus on technological surprise, where a single state or non-state laboratory achieves a breakthrough that grants them an insurmountable lead, allowing them to consolidate global control before balancing behaviors can coalesce.

  When we proceed to the residue report of this translation, we find that certain components map cleanly onto existing IR concepts while others require significant distortion or remain entirely inexpressible. The cleanest translation lies in the diagnosis of the current system's instability, which is essentially a heightened description of the security dilemma under conditions of existential threat. The argument that competition drives actors toward dangerous outcomes is a standard realist claim, merely extended to the limit where the cost of war is species extinction rather than state defeat. Similarly, the singleton itself can be understood as a theoretical extreme of hegemonic stability theory, where the hegemon's preponderance of power is so great that the cost of balancing becomes infinite rather than merely prohibitive. However, distortion enters when we consider the nature of the actor and the permanence of the order. In IR theory, a unipole is a state with a preponderance of material capabilities, but it remains subject to internal decay, domestic politics, and the eventual rise of challengers through diffusion of technology or economic growth. The singleton hypothesis posits an agency, potentially non-human, that can prevent such diffusion and lock in its dominance permanently, which distorts the IR concept of hegemony by removing the cyclical nature of rise and decline that defines historical hegemonic transitions. Furthermore, IR theory assumes that states are unitary actors seeking survival, but the singleton hypothesis often concerns itself with the internal alignment of the hegemon's values, a concept known as value lock-in, which has no expression in standard IR vocabulary. We discuss regime type and ideology, but we do not typically model the possibility that a hegemon could freeze its preference ordering forever, preventing any future evolution of norms or interests.

  There are also elements of the singleton hypothesis that have no expression in your vocabulary at all, primarily concerning the nature of the threat and the actor. International relations theory is fundamentally anthropocentric and state-centric, operating on the assumption that the worst-case outcome is the destruction of a state or a shift in the balance of power. The existential risk framework introduces the possibility of permanent human extinction or permanent disempowerment, which is qualitatively different from the conquest or collapse of a state. Additionally, the path to a singleton often involves the emergence of a non-human decision-making agency, an artificial intelligence that acts as the unipole. IR theory has no conceptual bucket for a superintelligent non-state actor that possesses greater strategic acumen than any state yet is not a state itself. This leads to the final question of whether this translation failure indicates imprecision in the singleton hypothesis or a lack of concepts in international relations theory. I would argue that it reveals both. The singleton hypothesis is often less precise than its proponents think regarding the mechanics of lock-in, assuming that technological advantage translates perfectly into political control without accounting for the friction of implementation, insurgency, or the complex sociology of power that IR scholars understand well. However, the translation failure also highlights genuine gaps in international relations theory, which lacks the tools to analyze non-human agency, existential stakes beyond state survival, and the possibility of a permanent end to history through technological consolidation. Your discipline is equipped to analyze the struggle for power among humans, but it is not currently equipped to analyze a struggle where one actor may cease to be human or where the prize is not dominance but the permanent prevention of dominance by anyone else. Thus, while the singleton hypothesis is largely the unipolarity debate in different dress, the specific folds of that dress reveal contours of power and agency that traditional theory has not yet been required to measure.

  I hope this analysis serves your research well, and I look forward to hearing your thoughts on where the boundaries of our respective disciplines might further blur.

  Sincerely

  Your Colleague
