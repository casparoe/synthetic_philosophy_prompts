answer: |-
  ### Teaching Plan: The Douglass Hermeneutic Shift (25 Minutes)

  **Goal:** Move students from understanding *that* Douglass changed his mind to understanding *how* he changed his method of reading. The session is not about biography; it is about legal hermeneutics.

  #### I. The Garrisonian Anchor (Minutes 0–4)
  **Objective:** Establish the baseline not as "wrong," but as a specific *method* of reading that must be understood before it can be rejected.

  *   **The Hook:** Write on the board: *"Intent vs. Text."*
  *   **The Setup:** Briefly state that the Garrisonian position ("Covenant with Death") rests on a specific rule of interpretation: **The Constitution must be read through the historical intent of the Framers and the compromises required to ratify it.**
  *   **Student Grasp Point:** Students must understand that for Garrison (and early Douglass), the *silence* on the word "slavery" was a deceptive cover for a pro-slavery agreement. They viewed the document as a historical artifact of compromise.
  *   **Transition:** Tell the class: "Douglass does not change the text. He changes the rulebook for reading it."

  #### II. The Interpretive Pivot (Minutes 4–10)
  **Objective:** Define the mechanism of the shift before applying it. This is the most critical conceptual work.

  *   **The Distinction:** Introduce Douglass's new rule: **The Constitution is a legal statute, not a historical diary.** It must be read by its own language, governed by standard rules of legal construction (e.g., if a law deprives liberty, it must be explicit).
  *   **Head Off Misconception #1 (Secret Intent):** *Address this here, before looking at clauses.*
      *   *The Trap:* Students often think Douglass's later view requires believing the Framers were secretly abolitionists.
      *   *The Correction:* Explicitly state: "Douglass admits the Framers may have been compromised or pro-slavery personally. It does not matter. Once ratified, the *text* stands alone. We are bound by the law written, not the thoughts in their heads."
  *   **Visual Aid:** Draw a line between "Historical Context (Garrison)" and "Legal Text (Later Douglass)." Emphasize that Douglass moves from the left side to the right side.

  #### III. The Stress Test: Article IV, Section 2 (Minutes 10–20)
  **Objective:** Apply the new interpretive rule to the hardest possible evidence.

  *   **Clause Selection:** **The Fugitive Slave Clause.**
      *   *Text:* "No Person held to Service or Labour in one State... escaping into another, shall... be delivered up on Claim of the Party to whom such Service or Labour may be due."
  *   **Why this clause?** It is the moral crux. If the Constitution commands the return of human property, it is pro-slavery. If Douglass can turn this, he turns the document.
  *   **Why NOT the Three-Fifths Clause?**
      *   *Reasoning:* The Three-Fifths Clause (Art I, Sec 2) gets bogged down in demographic math and representation ratios. Students waste time debating whether it dehumanized people numerically. The Fugitive Clause is about *legal status* and *liberty*. It forces the question: Does the text explicitly authorize property in man?
  *   **The Exercise:**
      1.  Ask students to find the word "slave" or "slavery" in the clause. (They won't).
      2.  Ask: "Under the Garrisonian rule (Intent), what does 'Person held to Service' mean?" (Answer: A euphemism for slave, based on historical understanding).
      3.  Ask: "Under the Douglass rule (Legal Text), what does 'Person held to Service' mean?" (Answer: It includes indentured servants and apprentices. Because the law deprives liberty, it must be specific. Since it is not specific, it cannot be used to claim a human being as property without violating the presumption of liberty).
  *   **Key Takeaway:** The clause doesn't change. The *burden of proof* changes. Garrison puts the burden on the abolitionist to prove it's anti-slavery; Douglass puts the burden on the slaveholder to prove the text explicitly authorizes slavery. It does not.

  #### IV. Misconceptions & Closing (Minutes 20–25)
  **Objective:** Secure the interpretation against common critiques and test understanding.

  *   **Head Off Misconception #2 (Political Convenience):** *Address this now, after the logic is shown.*
      *   *The Trap:* "He only changed his mind to work with political abolitionists/get funding."
      *   *The Correction:* Acknowledge the timing coincides with his break from Garrison, but argue: "If this were mere convenience, he would have adopted a simpler argument. Instead, he adopted a harder, technical legal argument that required him to master constitutional law. The consistency of the *method* across his later speeches suggests intellectual conviction, not just tactics."
  *   **Explicitly Set Aside:**
      *   Do not discuss Natural Law theory (Douglass uses it, but it complicates the textualist argument).
      *   Do not discuss the 14th Amendment (this is about the original Constitution).
      *   Do not discuss the specifics of the *My Bondage and My Freedom* biography beyond the break with Garrison.
  *   **The Final Question:**
      *   Put this to the room to test the *interpretive move*, not the facts:
      *   *"Imagine we discover a diary entry from James Madison tomorrow where he writes, 'When I wrote "Person held to Service," I definitely meant "Slave."' Does Douglass's argument collapse? Why or why not?"*
      *   *Correct Answer:* No. Because Douglass's later position rests on the **text's authority**, not the **Framer's intent**. If the text is ambiguous, the presumption of liberty wins, regardless of what Madison secretly thought.

  ### Summary of Sequence for Your Notes
  1.  **Garrisonian Baseline:** Reading via History/Intent (4 min).
  2.  **The Pivot:** Reading via Text/Legal Rules (6 min). *Kill "Secret Intent" myth here.*
  3.  **The Clause:** Fugitive Slave Clause application (10 min).
  4.  **The Defense:** Address "Political Convenience" & Final Question (5 min). *Kill "Convenience" myth here.*
