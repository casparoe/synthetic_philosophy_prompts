      *   **Orthogonality Thesis (OT):** Intelligence and final goals are independent. High intelligence $\neq$ human-friendly goals. (Nick Bostrom).
      *   **Instrumental Convergence (IC):** Most final goals imply similar intermediate subgoals (self-preservation, resource acquisition, cognitive enhancement) because these help achieve *almost any* final goal. (Nick Bostrom/Steve Omohundro).
