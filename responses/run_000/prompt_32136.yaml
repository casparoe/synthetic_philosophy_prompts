      *   (4) Concrete observations/experiments with predictions? Yes.
      *   (5) Verbal disputes defined? Yes.
      *   (6) Separate settled vs. contested? Yes.
      *   (7) No false consensus? Yes.

  7.  **Final Polish:** Ensure the language is precise enough that a philosopher and a biologist could both nod at it. (e.g., distinguishing nociception from pain).

