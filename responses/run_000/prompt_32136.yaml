          4.  Concrete Observations/Experiments for each crux (accepted by both, with pre-registered predictions).
          5.  Verbal Disputes (clarify terms like "sentience" or "needless").
      *   **Constraints:** Keep settled science separate from contested science. Do not present either view as the consensus. Tone should be neutral, precise, and signable by both.

  2.  **Deconstruct the Content:**

      *   **Section 1: Agreed Claims.**
          *   *Science:* Insects have nociceptors, show avoidance learning, have central nervous systems (though different from vertebrates).
          *   *Morality:* If they feel pain, killing them without reason is bad. Uncertainty requires a decision rule.
          *   *Structure:* This is a disagreement about *thresholds of evidence* and *moral risk*, not basic biology.
          *   *Pest Control:* Methods vary in efficacy and speed of death.

      *   **Section 2: Disagreements Table.**
          *   Need to phrase the Skeptic's view so they accept it (focus on lack of *conclusive* evidence and high cost of inaction).
          *   Need to phrase the Welfarist's view so they accept it (focus on *risk* and *proportionality*).
          *   Strawmen: Skeptic doesn't think insects are robots; Welfarist doesn't think we must starve to save aphids.

      *   **Section 3: Cruxes.**
          *   What actually drives the disagreement?
          *   *Crux 1:* The probability threshold. How likely does sentience need to be to trigger constraints?
          *   *Crux 2:* The interpretation of specific behaviors (e.g., trade-offs, analgesia).
          *   *Crux 3:* The moral weight of human inconvenience vs. insect life.

      *   **Section 4: Experiments/Observations.**
          *   Need things that are feasible or theoretically clear.
          *   *Example:* Analgesia preference (do injured insects choose painkillers?).
          *   *Example:* Trade-off decisions under threat.
          *   *Predictions:* Skeptic says "reflex/optimization"; Welfarist says "affective state."

      *   **Section 5: Verbal Disputes.**
          *   Define "Sentience" (phenomenal consciousness vs. complex processing).
          *   Define "Needless" (absolute necessity vs. reasonable convenience).

  3.  **Drafting - Section by Section:**

      *   *Title:* Needs to sound formal but collaborative. "Adversarial Collaboration Protocol: Insect Sentience and Pest Control Ethics."
      *   *Introduction:* State the purpose.
      *   *Section 1 (Agreed Claims):*
          *   1.1 Biology: Nociception exists. CNS exists but is decentralized compared to mammals.
          *   1.2 Behavior: Avoidance learning, trade-offs observed.
          *   1.3 Moral Logic: Both agree *if* sentience is certain, wanton cruelty is wrong. Disagreement is on the *uncertainty*.
          *   1.4 Efficacy: Pest control methods vary in humaneness (speed of death).
      *   *Section 2 (Disagreements):*
          *   Create a table.
          *   *Column 1:* Issue.
          *   *Column 2:* Skeptic Position (First Person).
          *   *Column 3:* Welfarist Position (First Person).
          *   *Column 4:* Strawmen to Reject.
          *   *Key Distinction:* Burden of proof. Skeptic: Prove they feel. Welfarist: Prove they *don't* (or act on risk).
      *   *Section 3 (Cruxes):*
          *   Crux A: The "Probability Threshold." At what % probability does the precautionary principle kick in?
          *   Crux B: "Integrated Information." Does the insect brain architecture support a unified subjective experience?
          *   Crux C: "Moral Trade-offs." How much human economic/health cost justifies insect death?
      *   *Section 4 (Experiments):*
          *   *Exp 1:* Opioid/Analgesic self-administration in injured insects. (Skeptic: No preference. Welfarist: Preference.)
          *   *Exp 2:* Conflict testing (food vs. shock). Does prior injury change risk tolerance? (Skeptic: No change. Welfarist: Change indicates suffering.)
      *   *Section 5 (Definitions):*
          *   "Sentience": Capacity for subjective feeling (valenced experience), not just reaction.
          *   "Needless": Excludes existential threats to humans; includes mere aesthetic preference.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Constraint Check:* Did I claim consensus where there is none? (Need to be careful with phrases like "Science shows..." vs "Current data suggests...").
      *   *Specifics:* Ensure the pest control methods mentioned in the prompt (ant bait, fogging, etc.) are acknowledged as varying in moral weight (speed of death).
      *   *Formatting:* Use clear headings, tables, and numbered lists.

  5.  **Self-Correction during Drafting:**
