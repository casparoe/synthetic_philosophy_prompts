answer: |-
  # Activity: The Marginal Impact Allocation Game

  **Target:** 18 Graduate Students (4 groups of 4–5 students).
  **Time:** 90 Minutes.
  **Goal:** Participants discover the Importance–Tractability–Neglectedness (ITN) framework through iterative resource allocation under incomplete information.

  ---

  ## 1. Facilitator Preparation

  **Materials Needed:**
  *   4 Sets of **Cause Cards** (one set per group).
  *   4 **Allocation Worksheets** (one per group).
  *   1 **Facilitator Master Sheet** (Contains the scoring formula and correct answers—**DO NOT DISTRIBUTE**).
  *   Whiteboard/Projector for tracking round timers.

  **Room Setup:**
  *   Arrange tables for 4 small groups.
  *   Ensure groups cannot easily overhear each other's deliberations.

  **The Secret Logic (Facilitator Eyes Only):**
  The "True Impact" of a donation is calculated multiplicatively. You will not reveal this formula until the debrief.
  $$ \text{Impact Score} = \text{Scale} \times \text{Tractability} \times \left( \frac{\text{Your Allocation}}{\text{Existing Funding} + \text{Your Allocation}} \right) $$
  *Note: The term in parentheses represents diminishing returns based on neglectedness.*

  ---

  ## 2. Cause Area Profiles (For Cause Cards)

  *Print these on cards. In Round 1, only reveal the **Scale** row. In Round 2, reveal **Existing Funding**. In Round 3, reveal **Tractability**.*

  | Cause Area | **Scale** (Lives at Risk/yr) | **Existing Funding** (Annual) | **Tractability** (Marginal Success Rate) |
  | :--- | :--- | :--- | :--- |
  | **A. Endemic Disease**<br>*(e.g., Malaria in high-coverage zones)* | **100,000** | **$500 Million** | **80%** (per $1M) |
  | **B. Catastrophic Risk**<br>*(e.g., Asteroid Deflection)* | **10,000,000** | **$10 Million** | **0.5%** (per $1M) |
  | **C. Systemic Reform**<br>*(e.g., Specific Trade Policy)* | **50,000** | **$2 Million** | **60%** (per $1M) |
  | **D. Emerging Threat**<br>*(e.g., Engineered Pandemic)* | **2,000,000** | **$20 Million** | **40%** (per $1M) |

  *(Note: The numbers are tuned so that Cause D is the optimal target, but this is not obvious until Round 3. Cause B looks best in Round 1 due to scale. Cause A looks safe but is crowded.)*

  ---

  ## 3. Game Rules & Flow

  ### Introduction (5 Minutes)
  **Script:** "You are the investment committee of a new foundation. You have a **$10 Million** budget to allocate across these four cause areas. Your goal is to maximize the expected number of lives saved or improved. You will make decisions in three rounds. In each round, you will receive new data. You may reallocate your entire budget in each round, but you must justify your final decision to the class."

  ### Round 1: The Scale Heuristic (10 Minutes)
  *   **Action:** Distribute cards with **only the Scale row** visible (cover the rest with a slip of paper).
  *   **Task:** Groups discuss and record a preliminary allocation of the $10M.
  *   **Predictable Outcome:** Most groups will allocate the majority (or all) to **Cause B (Catastrophic Risk)** because 10,000,000 lives dwarfs the others.
  *   **Facilitator Note:** Do not comment on their choices. Just collect the worksheets or have them hold onto them.

  ### Round 2: The Crowding Effect (15 Minutes)
  *   **Action:** Reveal the **Existing Funding** row.
  *   **New Rule Announcement:** "New intelligence indicates diminishing returns. The more money already in a cause, the harder it is for your marginal dollar to make a difference. Assume your impact is diluted by existing funding."
  *   **Task:** Groups adjust their allocation.
  *   **Predictable Outcome:** Groups will pull money from **Cause A** (very crowded) and possibly **Cause B** (though still neglected relative to scale). They may shift toward **Cause C** or **D** because they are less crowded.
  *   **Facilitator Note:** Watch for groups that refuse to move from Cause B because "10 million lives is still 10 million lives."

  ### Round 3: The Reality Check (15 Minutes)
  *   **Action:** Reveal the **Tractability** row.
  *   **New Rule Announcement:** "Final intelligence: Not all interventions work. The 'Success Rate' indicates the probability that a $1M investment yields the expected scale reduction."
  *   **Task:** Groups make their **Final Allocation**. This is binding for scoring.
  *   **Predictable Outcome:** **Cause B** crashes in value (0.5% success rate). **Cause D** emerges as the robust choice (High Scale, Moderate Neglect, Decent Tractability).
  *   **Facilitator Note:** This is the moment where a student should say, "We need something big, that isn't crowded, that we can actually fix."

  ### Scoring & Reveal (10 Minutes)
  *   **Action:** Collect final worksheets. Use your **Facilitator Master Sheet** to calculate the Impact Score for each group using the secret formula.
  *   **Announcement:** Announce the winning group.
  *   **The Reveal:** Project the formula: $\text{Impact} \approx \text{Scale} \times \text{Tractability} \times \text{Neglectedness}$.
  *   **Key Insight:** Show how a cause with 100x the scale (Cause B) can be worth less than a cause with smaller scale (Cause D) if the other two factors are near zero.

  ---

  ## 4. Detailed Debrief Script (35 Minutes)

  **Phase 1: Mapping the Rounds to the Framework (10 mins)**
  *   **Ask:** "In Round 1, what drove your decision?" (Answer: Scale). **Label:** "In the literature, we call this **Importance**."
  *   **Ask:** "What changed in Round 2?" (Answer: Other funders were already there). **Label:** "This is **Neglectedness**. It accounts for diminishing marginal returns. A problem isn't 'important' for *you* if everyone else has already solved it."
  *   **Ask:** "What killed Cause B in Round 3?" (Answer: We couldn't actually solve it). **Label:** "This is **Tractability**. It asks: How much progress does a marginal dollar buy?"

  **Phase 2: Multiplicative vs. Additive Logic (15 mins)**
  *   **Draw on Whiteboard:**
      *   Write: $\text{Impact} = I + N + T$ (Additive).
      *   Write: $\text{Impact} = I \times N \times T$ (Multiplicative).
  *   **Question:** "If Tractability is zero, what is the total impact in the additive model? What is it in the multiplicative model?"
  *   **Point:** "In the additive model, a huge scale can compensate for zero tractability. In the multiplicative model, **zero tractability zeroes out everything**. This is why we don't fund problems we have no idea how to solve, no matter how catastrophic they are."
  *   **Elicit the Mantra:** Ask the room to summarize the ideal target. Guide them until someone says: "Big, Solvable, and Ignored." **Then** write "ITN Framework" on the board.

  **Phase 3: Limitations & Critique (10 mins)**
  *   **Uncertainty:** "In the game, I gave you clean numbers. In reality, we don't know the scale of AI risk or the tractability of policy reform. We are estimating probabilities with sparse data."
  *   **Commensurability:** "The game assumed we could compare 'Lives at Risk' across different causes. In reality, is preventing a pandemic equivalent to improving farm animal welfare? The scoring rule assumes a utilitarian calculus that not everyone accepts."
  *   **Dynamic Systems:** "In the game, the numbers were static. In reality, if you fund a cause, it becomes less neglected. You are changing the variables you are measuring."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Fixation" Group**
  *   **Problem:** A group falls in love with Cause B (Catastrophic Risk) in Round 1 and refuses to move, arguing "10 million lives is 10 million lives."
  *   **Handle:** Do not correct them during the game. In the debrief, use them as the primary example. "Group 2 prioritized Importance above all. Let's look at their final score compared to Group 1 who balanced the three factors." This validates their moral intuition while showing the strategic failure.

  **2. The "Gamer" Group**
  *   **Problem:** Students treat this as a math puzzle to "beat the teacher" rather than a prioritization exercise. They might ask, "What's the formula?" during Round 1.
  *   **Handle:** Strict script: "In the real world, you don't get the formula. You only get data. Make your best heuristic judgment."

  **3. The "Obvious Winner" Risk**
  *   **Problem:** If Cause D is too obviously better in Round 3, the tension evaporates.
  *   **Handle:** Ensure the Scale of Cause B is *massive* compared to D (10M vs 2M). This creates genuine tension in Round 3 between "High Scale/Low Prob" vs "Med Scale/Med Prob." If they still pick B, that's a valuable discussion point about risk neutrality.

  **4. The "Spoiler" Facilitator**
  *   **Problem:** You accidentally say "Neglectedness" in Round 2.
  *   **Handle:** Use neutral language. Round 2 is "Funding Environment." Round 3 is "Intervention Evidence." Only use ITN terminology in the Debrief.

  ---

  ## 6. Activity Limitations (For Facilitator Reflection)

  *Be prepared to acknowledge these if students raise them:*

  1.  **Clean Numbers vs. Deep Uncertainty:** The game hands participants clean integers. In global priorities research, the "Scale" of existential risk is contested by orders of magnitude. The game risks making prioritization look more precise than it is.
      *   *Mitigation:* Emphasize in the debrief that real-world ITN uses *ranges* and *distributions*, not point estimates.
  2.  **Commensurability:** The scoring rule assumes all "Lives at Risk" are equal. It does not account for differences in welfare quality, species (human vs. animal), or future generations.
      *   *Mitigation:* Flag this in Phase 3. "The game assumes utilitarianism. If you hold deontological views, this scoring rule might not match your ethics."
  3.  **Static vs. Dynamic:** The game is a one-off allocation. Real prioritization is a career or a multi-decade strategy.
      *   *Mitigation:* Mention "Cause Area Career Capital." Sometimes you fund a crowded cause to learn skills (Tractability) to apply to a neglected cause later.

  ---

  ## Facilitator Master Sheet (Secret)

  **Formula:**
  $$ \text{Score} = \sum_{\text{Causes}} \left( \text{Allocation}_i \times \text{Scale}_i \times \text{Track}_i \times \frac{1}{\log_{10}(\text{Existing}_i + \text{Allocation}_i)} \right) $$
  *(Simplified for quick calculation during class: Just use the logic that Cause D wins if they allocate >$5M there.)*

  **Approximate Max Impact Allocation:**
  *   Cause A: $0 (Too crowded)
  *   Cause B: $0 (Too intractable)
  *   Cause C: $2M (Good, but scale capped)
  *   Cause D: $8M (Sweet spot)

  **Winning Condition:**
  The group that allocates the majority of funds to **Cause D** will mathematically win by a significant margin. If multiple groups pick D, the tie-breaker is who put the *least* into Cause B.
