          *   *Selection:* Upvotes, shares, emotional resonance, political utility.
          *   *Fitness:* Virality, longevity, adaptability.
          *   *Speciation:* "Rare Pepes" vs. "Political Pepes" vs. "Normie Pepes."
          *   *Bottleneck:* Platform bans, ADL listing.

  3.  **Drafting Section 1: The Darwinian Mapping (The "Fit"):**
      *   *Variation:* Endless photoshop variants.
      *   *Selection Pressures:*
          *   *Phase 1 (Chill Pepe):* Fitness = Relatability, humor, ease of editing. Environment = MySpace/early 4chan.
          *   *Phase 2 (Pol Pepe):* Fitness = Shock value, in-group signaling, ideological utility. Environment = /pol/, Twitter alt-right.
          *   *Phase 3 (Post-ADL):* Fitness = Ambiguity, defiance, nostalgia. Environment = Mainstream social media, art world.
      *   *Bottlenecks/Founder Effects:* Moving from MySpace to 4chan was a bottleneck (only certain types survived). Moving to Twitter was another. The ADL listing acted as a selective filter (drove some away, hardened the core).
      *   *Speciation:* Definitely distinct lineages. "Rare Pepes" (crypto/art), "Feels Good Man" (innocent), "Kekistan" (political). They became mutually unintelligible or hostile.

  4.  **Drafting Section 2: Where the Model Breaks (The "Silence"):**
      *   *Agency/Intentionality:* Dawkins' original memes were often treated as "viruses" infecting hosts. But Pepe shows *conscious* manipulation. People *tried* to make it evolve (the reclamation campaign). The ADL didn't just "select"; they *labeled*.
      *   *Semantic Load:* Biological genes don't care about meaning. Memes do. The *meaning* changed the selection pressure. The ADL label changed the *semantics*, which changed the *fitness*.
      *   *Lamarckian Evolution:* Acquired characteristics (the hate symbol label) were inherited. In biology, you don't inherit scars. In culture, the "scar" of the ADL label became part of the meme's DNA.
      *   *Top-Down vs. Bottom-Up:* Darwinian evolution is usually bottom-up. The reclamation was a top-down intervention (creator + community) trying to steer bottom-up processes.

  5.  **Drafting Section 3: Evaluating Meme Theory:**
