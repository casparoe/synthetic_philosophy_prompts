answer: |-
  "Fascinating talk," Dr. Okonkwo said, catching up to Dr. Kovac near the coffee station. "But I worry you dismissed the honeybee data too quickly. The evidence for cross-modal integration and those anxiety-like states suggests there's something it is like to be a bee, however dimly."

  Dr. Kovac stirred her tea, shaking her head. "I don't dismiss the behavior, Chidi. I dismiss the inference. Those are complex information-processing routines. On my view, sentience requires a specific architecture—something like the mammalian thalamocortical system enabling recurrent processing and global availability. Below that threshold, there is no subject. No dim flicker. Just darkness."

  "But that invites a sorites problem," Okonkwo countered, leaning against the wall. "Consider the continuum: human, macaque, mouse, honeybee, nematode. Neural complexity scales gradually. If you posit a binary threshold, where exactly does the light switch on? Any line you draw seems non-arbitrary. If a mouse is sentient, why not the bee? The difference is magnitude, not kind."

  Kovac set her cup down firmly. "Phase transitions aren't arbitrary just because the underlying variables change continuously. Water molecules slow down gradually, but ice is qualitatively distinct from liquid. Consciousness is similar. Once a system achieves the right kind of global workspace, phenomenality emerges. Below that, you don't have 'less' consciousness; you have none. You're conflating the richness of content with the presence of experience itself."

  "Yet richness feels intrinsic to the experience," Okonkwo pressed. "If I lose visual cortex function, my world doesn't vanish entirely; it dims or loses dimensions. Why couldn't evolutionary scaling work similarly? If a bee processes threat cues with something akin to affect, denying it any phenomenal status seems like human exceptionalism. We risk false negatives rather than false positives."

  "And I risk false positives," Kovac replied. "But here is where we bottom out. You treat consciousness as a functional capacity that scales with processing power. I treat it as an ontological status. Either there is a subject for whom things appear, or there isn't. For me, 'partial sentience' is a contradiction in terms. You can have partial sight, but you cannot partially *be*."

  Okonkwo sighed, looking out the window. "So for you, it's a metaphysical switch. For me, it's a biological gradient. We aren't just disagreeing about bees; we're disagreeing about whether 'what it is like' is a property of systems or a property of matter."

  "Exactly," Kovac said. "And until we agree on that, no amount of bee data will bridge the gap."
