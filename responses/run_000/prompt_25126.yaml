      *   **Ranking:**
          1.  (a)+(b) vs (c) - Fatal.
          2.  (a) vs (e) - Manageable/Verbal.
          3.  (c) vs (d) - Derivative of #1.

  7.  **Refining the Argument on (c):**
      *   Why is (c) plausible? "Ought implies can."
