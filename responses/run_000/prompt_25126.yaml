      *   **Tension 3 (Minor/Verbal): (a) vs. (e).**
          *   As analyzed, (e) is compatible with (a) regarding the *hearer*. It implies the *testifier* violated (a). If the user thinks the testifier *also* acted permissibly, then (a) is threatened. If the user accepts the testifier acted improperly but the student still gained knowledge, (a) stands.
          *   I need to ask/assume the user's stance on the testifier's permissibility. I will assume the user accepts the testifier violated the norm but the student didn't.

