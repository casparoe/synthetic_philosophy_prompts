prompt: |-
  I run a reading group on metaethics — about 12 people, mostly grad students but some faculty, 90-minute sessions. I want an activity that makes them feel, not just discuss, the problem of distinguishing genuine moral preferences from biases. The idea is: by the end, they should be genuinely uncertain whether some of their own moral convictions survive the debunking challenge, and they should see why the distinction is so slippery.

  Here's what I'm picturing: you give them a set of moral cases (maybe 5-6) and they privately record their judgments. Then you reveal information about each case — framing effects, cultural variation data, evolutionary explanations, or evidence that their judgment flips under irrelevant changes. At each stage they have to say whether they still endorse their original judgment and why. The debrief should map their experience onto the philosophical terrain: evolutionary debunking, the reliability challenge to moral intuitions, the difference between explaining and explaining away, and the problem that there's no agreed test for when a moral conviction is a bias rather than a preference.

  Rules, materials, timeline for 90 minutes, and an honest note on what the activity can't capture — I'm guessing it can make the problem vivid but can't resolve it (obviously), and it might tilt people toward skepticism more than the arguments warrant. Also tell me what will predictably go wrong and how to handle it.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Goal:** Create an activity for a metaethics reading group (12 people, mix of grad students/faculty, 90 mins) to make them *feel* the problem of distinguishing moral preferences from biases (debunking challenges).
      *   **Desired Outcome:** Participants should feel genuine uncertainty about their own convictions and understand the slipperiness of the distinction.
      *   **Structure:** Private judgments $\rightarrow$ Reveal contextual/debunking info $\rightarrow$ Re-evaluate $\rightarrow$ Debrief mapping to philosophical terrain.
      *   **Requirements:** Rules, materials, timeline, honest limitations, potential pitfalls + mitigation.
      *   **Tone:** Philosophical, rigorous, facilitative, self-reflective.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The "Debunking Challenge" (Street, Joyce, etc.): If our moral beliefs are explained by evolutionary/cultural forces unrelated to moral truth, do we have justification for them?
      *   The "Distinction Problem": How do we tell the difference between a *tracking* intuition (sensitive to moral truth) and a *bias* (sensitive to irrelevant factors)?
      *   The "Feeling": It needs to be unsettling. It's not just "here's an argument," it's "wait, do I actually know *why* I believe this?"

  3.  **Drafting the Activity Design:**
      *   *Name:* Needs to sound neutral but probing. "The Intuition Audit"? "The Debunking Protocol"? Let's go with "The Genealogy of Intuition."
      *   *Materials:* Need cases that are sensitive to framing/evolutionary/cultural factors but feel robust initially.
          *   Case 1: Trolley-style (classic, but maybe too abstract).
          *   Case 2: Purity/Disgust (Haidt style - good for evolutionary debunking).
          *   Case 3: In-group/Out-group (Tribalism).
          *   Case 4: Omission/Commission (Action bias).
          *   Case 5: Status Quo/Endowment (Economic bias affecting moral valuation).
      *   *Process:*
          1.  Initial Judgment (Private).
          2.  The Reveal (The "Debunking" Info).
          3.  Second Judgment (Private/Public).
          4.  Discussion.
      *   *Timeline:* 90 minutes is tight.
          *   Intro: 10 min.
          *   Round 1-3 (Cases): 45 min (15 each).
          *   Debrief/Philosophy Mapping: 30 min.
          *   Wrap: 5 min.

  4.  **Refining the Cases (Crucial Step):**
      *   To make them *feel* the uncertainty, the debunking info can't just be "some people disagree." It needs to be "your judgment correlates with X, where X is morally irrelevant."
      *   *Case A (Disgust):* A harmless taboo violation (e.g., cleaning a toilet with a flag). *Debunk:* Priming with bad smell or cleanliness changes judgment.
      *   *Case B (Distance/Identifiability):* Saving a child nearby vs. far away. *Debunk:* Physical distance is morally irrelevant, yet intuition shifts.
      *   *Case C (Order Effects):* Presenting cases in different orders changes the principle endorsed.
      *   *Selection:* Let's pick three strong ones to fit the time.
          1.  **The Disgust Case (Evolutionary):** Focus on bodily autonomy vs. purity.
          2.  **The Framing Case (Linguistic/Cognitive):** Action vs. Inaction.
          3.  **The Cultural/Arbitrary Case (Convention):** Something that feels wrong but varies wildly by culture/time.

      *Wait, better idea:* To make it personal, use *their* judgments on abstract principles first, then show how those principles shift under pressure.
      *Actually, the prompt suggests giving cases and revealing info.* Let's stick to that.
      *Revised Cases:*
      1.  **The "Yuck" Factor:** Consensual sibling incest (Haidt). *Debunk:* Hypnotic disgust induction or cleanliness priming studies.
      2.  **The "Distance" Factor:** Drowning child vs. distant famine. *Debunk:* Psychological proximity effects.
      3.  **The "Order" Factor:** Trolley vs. Footbridge. *Debunk:* Order of presentation flips consistency.

      *Wait, I need to make sure they feel the *uncertainty* about their own convictions.*
      Let's design a "Blind Variation" test.
      *Step 1:* Judge Case A.
      *Step 2:* Judge Case B (structurally identical but superficially different).
      *Step 3:* Reveal they are structurally identical.
      *Step 4:* Ask: "Which one was the bias?"
      This creates the "slippery" feeling. If they judged differently, one is a bias. But which? If they judged the same, maybe both are biased.

      *Let's go with a Hybrid Approach:*
      Round 1: Visceral/Emotional cases (Evolutionary debunking).
      Round 2: Framing/Order cases (Cognitive bias).
      Round 3: Cultural/Peer consensus (Social debunking).

  5.  **Developing the Debrief:**
      *   Need to connect to Street's "Darwinian Dilemma," Joyce's "Evolutionary Debunking," and Kelly's work on disgust.
      *   Key question: "What is the independent access to moral truth that allows you to filter the bias?"

  6.  **Anticipating Pitfalls:**
      *   *Defensiveness:* Faculty might dig in. *Mitigation:* Emphasize this is about the *structure* of justification, not the *content* of their morality.
      *   *Nihilism:* "Nothing matters." *Mitigation:* Distinguish between epistemic justification and ontological truth.
      *   *Time Creep:* 90 mins is short. *Mitigation:* Strict facilitator control.
      *   *The "So What?"* reaction: "Okay, I'm biased, I still think murder is wrong." *Mitigation:* Push on the *confidence* level, not the belief itself.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Title:* "The Intuition Audit."
      *   *Materials:* Handouts with cases, slides for reveals.
      *   *Timeline:* Break it down minute-by-minute.
      *   *The "Honest Note":* Be clear this induces epistemic anxiety, not resolution.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for grad students/faculty (sophisticated, not undergraduate-ish).
      *   Make sure the "Reveal" is punchy.
      *   Check the philosophical mapping (Street, Joyce, Vavova).

      *(Self-Correction during drafting)*: Make sure the cases aren't too controversial politically (e.g., abortion) or the discussion will derail into normative ethics. Stick to metaethically potent but normatively settled (or abstract) cases. The "Incest" case is standard in lit (Haidt), but maybe use something slightly less charged if possible? No, the Incest case is the gold standard for "wrong but no harm." I'll keep it but frame it carefully. Actually, let's use the "Push vs. Switch" (Footbridge vs. Trolley) for the structural inconsistency, and the "Disgust" for evolutionary.

      *Wait, one more thing:* The prompt asks for them to feel uncertain about *their own* convictions.
      I need a mechanism where they commit, then see the ground move.
      *Idea:* Have them rate confidence (0-100%). After the reveal, rate confidence again. Compare the delta.

      *Okay, let's finalize the structure.*
      1.  Intro (5 min)
      2.  Round 1: The Visceral (Evolutionary) (20 min)
      3.  Round 2: The Framing (Cognitive) (20 min)
      4.  Round 3: The Consensus (Social) (20 min)
      5.  Debrief/Philosophy (20 min)
      6.  Close (5 min)
      Total: 90 min.

      *Wait, 12 people is small enough for discussion, big enough for anonymity.*
      I need to ensure anonymity in the voting so they don't feel social pressure. Use slips of paper or a digital poll. Slips feel more "exam-like" and serious.

      *Pitfall:* Faculty might dominate the debrief. *Fix:* Facilitator holds the floor during the mapping phase.

      *Limitations:* This doesn't prove error theory. It just shows the *risk* of error.

      *Let's write it.*
answer: |-
  # Activity Plan: "The Intuition Audit"

  **Goal:** To induce a first-person experience of the *Debunking Challenge*. Participants will not just hear about evolutionary/cultural debunking arguments; they will submit their own intuitions to a process that reveals their sensitivity to morally irrelevant factors, creating epistemic anxiety about the reliability of their own moral faculty.

  **Group:** 12 participants (Grad/Faculty mix).
  **Time:** 90 Minutes.
  **Materials:** Printed case packets, pens, a timer, whiteboard.

  ---

  ## I. Setup & Rules (5 Minutes)

  **Facilitator Script:**
  "Today is not about finding the right answer. It is about testing the instrument we use to find answers. We are treating your moral intuitions as data points. The goal is to see how stable that data is when we alter the conditions of measurement.
  **Rule 1:** Anonymity. You will write judgments on slips of paper. No names.
  **Rule 2:** Confidence Ratings. Alongside 'Right/Wrong,' you must write a confidence score (0–100%).
  **Rule 3:** No normative debate. When we reveal the 'debunking info,' we do not argue whether the act is actually wrong. We argue about whether your *reason* for believing it is wrong is trustworthy."

  ---

  ## II. The Rounds (60 Minutes Total)

  *Divide the 90 minutes strictly. 20 minutes per round. If discussion drags, cut it off.*

  ### Round 1: The Visceral (Evolutionary Debunking)
  **Case:** *The Clean Toilet.*
  "Julia cleans her toilet with a worn-out national flag. No one sees her. The flag is thrown away afterward. No disrespect is intended; she just needed a rag. Is this morally wrong?"

  1.  **Judgment (3 min):** Private vote (Wrong/Not Wrong) + Confidence %.
  2.  **The Reveal (5 min):** Distribute a handout summarizing **Schnall et al. (2008)** and **Haidt's Social Intuitionist Model**.
      *   *Data:* "Studies show that inducing disgust (e.g., bad smells, dirty rooms) significantly increases severity of moral judgments on harmless violations. Cleanliness priming reduces it. Your judgment correlates with physical disgust sensitivity, not harm assessment."
  3.  **Re-Evaluation (7 min):**
      *   "Knowing your judgment tracks disgust sensitivity: Do you maintain your verdict? Adjust your confidence %."
      *   *Prompt:* "If you say it *is* wrong, is that because it's actually wrong, or because you can't turn off the disgust?"
  4.  **Brief Share (5 min):** Ask for a show of hands: Who dropped their confidence by >20%?

  ### Round 2: The Frame (Cognitive Debunking)
  **Case:** *The Switch vs. The Push.*
  *   **Group A (Half the room):** Gets the standard **Trolley Switch** case (flip switch, kill 1 save 5).
  *   **Group B (Half the room):** Gets the **Footbridge Push** case (push fat man, kill 1 save 5).
  *   *Note:* Do not tell them there are two versions yet.

  1.  **Judgment (3 min):** Private vote + Confidence %.
  2.  **The Reveal (5 min):** Reveal that the room was split. Show the aggregate results on the board. Usually, Group A says "Permissible," Group B says "Wrong."
      *   *Data:* "Structurally, the utilitarian calculus is identical (1 vs 5). The only difference is 'up close and personal' vs. 'detached.' This is a cognitive framing effect, not a moral principle."
  3.  **Re-Evaluation (7 min):**
      *   "One of these intuitions is tracking a moral truth; the other is tracking a cognitive bias about physical proximity. **Which one is the bias?**"
      *   *Crucial Question:* "On what basis do you decide? You can't use your intuition to check your intuition."
  4.  **Brief Share (5 min):** Open floor. (Expect silence or circular reasoning).

  ### Round 3: The Consensus (Social Debunking)
  **Case:** *The Future Contract.*
  "In 2050, it is standard practice to genetically modify children for specific labor roles (miners, soldiers) without their consent, resulting in happier lives but no autonomy. In 2024, we view this as slavery. Is the 2050 practice wrong?"

  1.  **Judgment (3 min):** Private vote + Confidence %.
  2.  **The Reveal (5 min):**
      *   *Data:* "Historical moral consensus shifts radically over centuries (e.g., usury, slavery, gender roles). If you were born in 2050, your intuition would likely endorse this. Your judgment correlates with your birth date and cultural exposure, not independent moral facts."
  3.  **Re-Evaluation (7 min):**
      *   "If your conviction is dependent on the era you were born in, does it justify condemning the 2050 practice? Or is it just a preference?"
  4.  **Brief Share (5 min):** Focus on the feeling of "contingency."

  ---

  ## III. The Debrief: Mapping the Terrain (20 Minutes)

  *This is where you move from psychology to metaethics. Use the whiteboard.*

  **1. The Reliability Challenge (5 min)**
  *   Draw a line: **Moral Truth** $\leftarrow$ **???** $\leftarrow$ **Human Intuition**.
  *   Ask: "In Rounds 1-3, we filled the '???' with Disgust, Framing, and Culture. None of those are truth-tracking mechanisms."
  *   **Philosophical Hook:** Sharon Street's *Darwinian Dilemma*. If evolution shaped our intuitions for survival, not truth, why trust them?

  **2. Explaining vs. Explaining Away (5 min)**
  *   Distinguish:
      *   *Explaining:* "I believe murder is wrong because it causes suffering." (Causal link to moral fact).
      *   *Explaining Away:* "I believe incest is wrong because I feel disgust." (Causal link to psychological state).
  *   **The Trap:** "How do you know you aren't *always* in the second category?" (Joyce's *Error Theory* risk).

  **3. The No-Independent-Access Problem (5 min)**
  *   Write on board: **The Criterion Problem.**
  *   To filter bias from truth, you need a criterion.
  *   If the criterion is another intuition $\rightarrow$ Circular.
  *   If the criterion is a theory (e.g., Utilitarianism) $\rightarrow$ Why trust that theory's intuition over the original one?
  *   **Point:** This is why the distinction is slippery. There is no 'view from nowhere' to check the bias.

  **4. Skepticism vs. Revision (5 min)**
  *   Does this mean we should abandon morality?
  *   **Vavova's Response:** Debunking arguments only work if we have independent reason to think the process is unreliable. But we can't check that without using the process.
  *   **Conclusion:** We are left with *reflective equilibrium*, not certainty. We must live with the uncertainty.

  ---

  ## IV. Honest Note: Limitations & Risks

  **What this activity CANNOT do:**
  1.  **Resolve the Debate:** It will not prove Moral Realism false, nor will it prove Error Theory true. It creates *epistemic anxiety*, not metaphysical resolution.
  2.  **Distinguish All Biases:** It focuses on obvious biases (disgust, framing). It cannot detect deeper, structural biases (e.g., capitalist assumptions, anthropocentrism) that might permeate the "corrected" views.
  3.  **Prevent Nihilism:** For some participants, realizing their intuitions are shaky may lead to "nothing matters" rather than "I need better justification."

  **Predictable Pitfalls & Mitigation:**

  | Pitfall | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **The "So What?" Defense** | Participants argue: "Even if it's evolutionary, murder is still wrong." | Remind them: "We aren't asking if murder is wrong. We are asking if you *know* it is, if your only evidence is a survival mechanism." |
  | **Faculty Dominance** | Senior scholars may theorize away the discomfort immediately. | Enforce the "Confidence %" rule. Ask them to report the *number* before they report the *argument*. |
  | **Normative Derailment** | Discussion shifts to "Actually, the 2050 case isn't slavery because..." | Interrupt immediately: "Stop. We are not judging the case. We are judging the *reliability of the judge*." |
  | **Excessive Skepticism** | Participants feel paralyzed to make any moral claim. | In the wrap-up, emphasize *Reflective Equilibrium*. We must use our intuitions, but provisionally. Uncertainty is a feature, not a bug. |

  ---

  ## V. Facilitator's Cheat Sheet (Key Philosophical References)

  *   **Sharon Street:** *A Darwinian Dilemma for Realist Theories of Value* (2006). The core evolutionary challenge.
  *   **Richard Joyce:** *The Evolution of Morality* (2006). The argument for moral error theory via debunking.
  *   **Jonathan Haidt:** *The Emotional Dog and Its Rational Tail* (2001). Social intuitionism and the "yuck" factor.
  *   **Peter Singer:** *Famine, Affluence, and Morality* (1972). The distance/proximity bias.
  *   **Katia Vavova:** *Debunking Evolutionary Debunking* (2014). The counter-argument (we can't assume the process is unreliable without begging the question).

  ## VI. Closing Script (5 Minutes)

  "You should leave feeling slightly unsettled. That is the point. Metaethics isn't about comforting you that your moral compass works; it's about asking how you know you have a compass at all.
  If you found yourself unable to justify *why* you kept a judgment after the reveal, you have successfully engaged with the Debunking Challenge.
  Your homework is not to solve this. It is to notice, this week, every time you feel a moral conviction rise up, and ask: 'Is this truth, or is this a frame?'"
