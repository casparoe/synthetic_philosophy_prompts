answer: |-
  This is a classic frustration. The reason your friend thinks it's "contrived" is likely because they are viewing voting as an expression of *preference* (like choosing a restaurant) rather than an aggregation of *judgments* about facts or rules (like a court verdict). In preference voting, inconsistency is fine (I prefer A over B, B over C, and C over A). In judgment aggregation, we are trying to establish a coherent set of truths.

  The most powerful counter-argument to the "toy example" claim is that this problem was not discovered by mathematicians playing with logic, but by **legal scholars analyzing actual court decisions**. It is known in law as the **Doctrinal Paradox** (Kornhauser & Sager, 1986).

  Here is a realistic, high-stakes example involving a **University Research Ethics Committee**. This is distinct from the standard "hiring a candidate" example, but it carries actual institutional weight.

  ### The Scenario: Approving a High-Risk Psychological Study

  A three-member Ethics Committee must decide whether to **Approve ($R$)** a proposed psychological study involving minors.

  **The Institutional Rule (The Doctrine):**
  According to university policy and federal regulations, a study is approved if and only if it meets two necessary criteria:
  1.  **Scientific Validity ($P$):** The methodology is sound enough to justify the risk.
  2.  **Ethical Safety ($Q$):** The consent protocols are sufficient to protect the minors.

  **The Logic:**
  $$R \iff (P \land Q)$$
  *(Approval is true if and only if Validity is true AND Safety is true.)*

  ### The Committee Members
  To make it realistic, each member has a different area of expertise, leading them to weigh the evidence differently.

  *   **Voter 1 (The Statistician):** Focuses heavily on methodology.
  *   **Voter 2 (The Child Psychologist):** Focuses heavily on patient safety.
  *   **Voter 3 (The Administrator):** Focuses on overall compliance and liability.

  ### The Individual Judgments
  Every member is logically consistent. They all agree that if *both* premises are met, they *must* approve. If *either* fails, they *must* reject.

  | Proposition | Logic | Voter 1 (Statistician) | Voter 2 (Psychologist) | Voter 3 (Administrator) | **Majority Outcome** |
  | :--- | :--- | :---: | :---: | :---: | :---: |
  | **$P$: Methodologically Sound** | Premise 1 | **Yes** | No | **Yes** | **Yes (2-1)** |
  | **$Q$: Ethically Safe** | Premise 2 | No | **Yes** | **Yes** | **Yes (2-1)** |
  | **$R$: Approve Study** | Conclusion ($P \land Q$) | **No** | **No** | **Yes** | **No (1-2)** |

  ### The Breakdown of the Paradox

  1.  **Individual Consistency:**
      *   **Voter 1** sees the method is sound ($P$), but the safety is lacking ($\neg Q$). Therefore, logically, they vote **No** on Approval ($\neg R$). *Consistent.*
      *   **Voter 2** sees the safety is adequate ($Q$), but the method is flawed ($\neg P$). Therefore, logically, they vote **No** on Approval ($\neg R$). *Consistent.*
      *   **Voter 3** sees both as adequate ($P$ and $Q$). Therefore, logically, they vote **Yes** on Approval ($R$). *Consistent.*

  2.  **Collective Inconsistency (The Dilemma):**
      *   The Committee takes a majority vote on **Validity ($P$)**: The result is **Yes**. (The collective body affirms the method is sound).
      *   The Committee takes a majority vote on **Safety ($Q$)**: The result is **Yes**. (The collective body affirms the safety is adequate).
      *   The Committee takes a majority vote on **Approval ($R$)**: The result is **No**. (The collective body rejects the study).

  ### Why This Isn't Contrived

  Show your friend this specific implication: **The Committee has officially gone on record stating that the study is Safe and Sound, but simultaneously declared it Unapprovable.**

  If this decision were published (as ethics decisions often are), the university would be exposed to massive liability.
  *   **Parents** could sue, pointing to the majority vote on $R$ (Rejection) as proof the study was dangerous.
  *   **Researchers** could sue, pointing to the majority votes on $P$ and $Q$ (Sound/Safe) as proof the rejection was arbitrary and violated their rights.

  ### The Institutional Reality
  This happens because institutions often vote on **premises** (issue-by-issue) rather than **conclusions** (case-by-case), or vice versa, without realizing the outcomes diverge.

  *   **Premise-Based Procedure:** If the committee votes on $P$ and $Q$ first, then derives $R$, the study is **Approved**. (Majority says $P$ is true, $Q$ is true $\to$ $R$ must be true).
  *   **Conclusion-Based Procedure:** If the committee votes directly on $R$, the study is **Rejected**. (Majority says $R$ is false).

  **The Kicker:** In real courts and boards, some members vote based on the premises (legal doctrine) and others vote based on the conclusion (desired outcome). When you aggregate those votes, you get the discursive dilemma. It is not a toy; it is a structural flaw in how we design voting rules for fact-based decisions.
