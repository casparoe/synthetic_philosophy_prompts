      *   *Anti-Penetration (Fodor, Pylyshyn, Firestone & Scholl):* Vision is encapsulated. Effects are judgment, memory, or attention. Evidence: Methodological critiques (demand characteristics, response bias).
      *   *The Core Problem:* How do we distinguish "seeing" from "thinking about seeing"?
