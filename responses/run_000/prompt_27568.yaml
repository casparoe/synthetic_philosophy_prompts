answer: |-
  **The Law of the Skin: Memento and the Authority of the Past Self**

  In Christopher Nolan's *Memento*, Leonard Shelby hunts for his wife's killer. This is a difficult task for a man who cannot form new long-term memories. Following a head injury sustained during the attack on his wife, Leonard lives in a perpetual present. To function, he relies on a system of externalized memory: Polaroid photographs, handwritten notes, and, most significantly, tattoos inked onto his skin. These are not merely reminders; they are standing instructions. "Fact 6: Car license SG13 7IU," reads one tattoo. "John G. raped and murdered my wife," reads another.

  For the bioethicist, Leonard's system is a literalization of a familiar theoretical problem: the advance directive. In medical ethics, we ask whether a competent person (the "earlier self") has the right to dictate the care and living conditions of their future, incapacitated self (the "later self"), particularly in cases of advanced dementia. The standard debate turns on autonomy and identity. Does the person who signed the living will remain the same person as the one in the hospital bed? If their values have shifted, whose interests prevail?

  *Memento* is often discussed as a puzzle of narrative structure or a study of grief. But viewed through the lens of bioethics, it becomes a stress test for the authority of the earlier self. The film does not merely illustrate the philosophical problem; it complicates it. It forces us to ask not just whether the earlier self *can* bind the later self, but what it feels like to be bound, and what happens when the binding authority is built on a lie.

  **The Phenomenology of Obedience**

  Standard bioethical discussions, such as those between Ronald Dworkin and Rebecca Dresser, often take place in the abstract. Dworkin argues for the supremacy of "critical interests"—the long-term values and life projects established by the competent self. Dresser counters by advocating for the "experiential interests" of the current, incapacitated self, who may find joy in simple pleasures the earlier self would have deemed undignified.

  *Memento* shifts the focus from the validity of the directive to the phenomenology of obeying it. For Leonard, the notes and tattoos are not suggestions; they are laws. But because he cannot remember writing them, his obedience requires an act of faith. He must trust that the "Leonard" who wrote the note was rational, truthful, and acting in the best interest of the "Leonard" reading it.

  This illuminates a gap in the philosophical literature: the experience of the later self is usually treated as passive. In the film, the later self is active but hollowed out. When Leonard looks at a tattoo on his chest, he is encountering the earlier self as an external authority. The ink on the skin blurs the line between internal volition and external command. It raises a question standard cases rarely address: Does the physical permanence of a directive (like a tattoo, or a legally notarized will) grant it moral weight simply by virtue of its durability? Leonard obeys the tattoo not because he remembers the reason for it, but because it is written on his body. It suggests that in the absence of memory, we conflate physical proximity with moral authority.

  **The Fallible Architect**

  Where *Memento* truly disrupts the bioethical consensus is in its portrayal of the earlier self's fallibility. In standard advance directive cases, we generally assume the earlier self is competent and acting in good faith. We worry about whether the *later* self has changed, not whether the *earlier* self was mistaken.

  Nolan dismantles this assumption. Through the character of Teddy, a corrupt cop who manipulates Leonard, we learn that Leonard's "system" has been compromised. More disturbingly, in the film's chronological climax, we realize Leonard knows this. He discovers that he may have already killed the real attacker years ago, and that his wife might have survived the initial assault. Yet, he chooses to ignore this. He alters his own notes. He decides to frame Teddy as the next "John G."

  Here, the earlier self is not a benevolent guardian of critical interests; it is a manipulator. Leonard deliberately sets his future self on a course built on a falsehood because he cannot bear a life without purpose. This complicates the Dworkinian view. If the "critical interests" of the earlier self are based on a delusion, or if the earlier self deliberately deceives the later self to maintain a narrative of vengeance, does the directive still hold?

  In the dementia debate, we worry about the later self losing touch with reality. *Memento* warns us about the earlier self losing touch with it. It suggests that granting absolute authority to the past self risks enshrining their errors. If Leonard's "living will" (his tattoos) commands him to commit murder based on outdated or falsified data, his obedience is not an act of autonomy; it is a form of entrapment. The film argues that the authority of the earlier self is contingent not just on competence, but on truth.

  **The Disanalogy: Amnesia vs. Dementia**

  However, the analogy between Leonard and the dementia patient is not exact, and examining where it breaks down is as illuminating as the parallel itself. Leonard suffers from anterograde amnesia; he cannot make new memories, but his retrograde memory (his past before the injury) is largely intact, as are his motor skills and general cognitive abilities. He can drive, fight, and reason.

  In advanced dementia, the erosion is often global. The "earlier self" doesn't just lose the ability to form new memories; they often lose access to the old ones. The values, tastes, and personality traits that ground the advance directive may dissolve. Leonard, by contrast, retains his values (vengeance, justice, loyalty) but loses the *facts* required to execute them.

  Does this disanalogy damage the reading? On the contrary, it isolates the variable of *agency*. A dementia patient may be unable to follow an advance directive simply because they lack the capacity to understand it. Leonard has the capacity but lacks the continuity. This makes his choice to obey (or disobey) more stark. When Leonard decides to burn a Polaroid or ignore a note, it is a genuine act of will.

  Furthermore, Leonard's condition allows for a unique form of self-deception unavailable to the dementia patient. Because Leonard cycles through the same cognitive loop, he can "reset" his beliefs. He can choose to believe Sammy Jankis (another amnesiac he references) was a fraud, and then later choose to believe Sammy's story was his own, depending on what serves his psychological needs at that moment. In dementia, the self fragments. In *Memento*, the self is curated. This suggests that in cases where psychological continuity is preserved but memory is not, the "earlier self" is not a fixed point in the past, but a recurring role played in the present.

  **The Verdict**

  So, what does *Memento* contribute to the philosophical argument that the standard bioethical cases do not? It adds existential weight. In the literature, the violation of an advance directive is often framed as a legal or moral failure. In the film, ignoring the directives leads to ontological collapse. Without the notes, Leonard does not just fail to achieve his goals; he ceases to be "Leonard Shelby, Avenger." He becomes a drifter. The film suggests that for some, the authority of the earlier self is not about protecting welfare, but about preserving identity. We bind our future selves because without that binding, we fear we will not exist at all.

  However, the philosophical debate grasps something the film is tempted to overstate: the ethical necessity of letting go. The bioethical critique of advance directives reminds us that the "later self" is a moral patient with their own rights. Leonard's tragedy is that he never grants his later self this status. He treats his future moments as tools for his past goals. He sacrifices the possibility of peace (which Teddy offers him) for the certainty of the hunt.

  The standard bioethical case urges us to consider when the earlier self's authority should expire—when the cost to the later self's well-being becomes too high. *Memento* shows us the horror of that authority never expiring. It presents a world where the past is a tyrant that cannot be deposed, because the present is too broken to stage a coup.

  Ultimately, Nolan's film serves as a cautionary tale for the proponents of rigid advance directives. It reminds us that autonomy is not a contract signed in blood or ink; it is a narrative negotiated between who we were, who we are, and who we might become. Leonard's tattoos are permanent, but the truth they tell is mutable. If we are to honor the authority of the earlier self, we must ensure that the instructions we leave behind are robust enough to survive not only our memory loss but our own capacity for self-deception. We must leave room for the later self to read the notes, look at the skin, and perhaps, if the facts have changed, put down the pen.
