      *   **Parfit's Nonidentity Problem:** Concerns actions that affect *who* comes into existence (identity-affecting actions). If an action is necessary for a specific person to exist, that person cannot claim they were harmed by the action (unless their life is not worth living), because the alternative was non-existence. Key feature: It's usually about *future* people and policy choices (e.g., resource depletion, risky energy policies) that change *which* sperm meets *which* egg.

