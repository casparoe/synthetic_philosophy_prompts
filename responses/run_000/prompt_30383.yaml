          *   *Severity:* Medium. It depends on the user's broader metaphysical commitments (Physicalism vs. Dualism). If they are a physicalist about everything, (5) is problematic. If they are open to dualism, it's fine. The prompt doesn't specify general metaphysics, just semantics. However, maintaining (1) (Water is necessarily H2O) while accepting (5) (Zombies are possible) implies a disunity in the semantics of natural kinds vs. phenomenal concepts. This is Chalmers's view, so it's internally consistent *if* one accepts Chalmers's metaphysics.

