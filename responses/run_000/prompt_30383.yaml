      *   *(3) Primary Intension as A Priori Conditional:* This is the core of the 2DS move (Chalmers/Jackson). It says 'water' picks out whatever plays the "water role" in a scenario.
      *   *(4) Anti-Descriptivism:* This claims 'water' isn't *defined* by the description.
      *   *(5) Modal Rationalism:* This links conceivability to possibility via the 2DS framework, specifically relying on the primary intension.

