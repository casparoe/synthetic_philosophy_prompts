          *   *Analysis:* This is the classic "Descriptivism vs. 2D Semantics" tension. Chalmers argues 2DS is *not* descriptivism in the Fregean sense because the primary intension isn't the *meaning* (secondary intension) and doesn't fix reference in the actual world (externalism does that). However, if the primary intension is *a priori associated*, does that violate Kripke's argument against descriptivism (modal and epistemic arguments)? Kripke argued we don't know a priori that water satisfies the description. 2DS replies: We know a priori that water satisfies the *role* in the *scenario*, but not that the actual filler is H2O.
