  The air is altered by the burning metal.

  1. The poem implies a shared observation language ("The air is altered"), whereas Kuhn argues observation is theory-laden and Priestley and Lavoisier literally saw different substances.
  2. By closing the loop with the first stanza's setting, the form suggests continuity, but Kuhn insists the post-revolution world is fundamentally discontinuous with the prior one.
  3. The transition appears as a single gestalt switch, yet historical records show many chemists held hybrid phlogiston-oxygen views for years during the crisis.
  4. Kuhn emphasizes that data from the old paradigm is often lost or discarded, but the poem suggests the old tools simply acquire new meaning without loss.
  5. The poem frames the shift as rational problem-solving (mass increases), whereas Kuhn argues paradigm choice is ultimately persuasive and sociological rather than purely logical.
