prompt: |-
  My political theory reading group has been stuck on the boundary problem for months — half the group leans all-affected-interests (anyone whose interests are affected by a decision should get a say in making it), and the other half leans all-subjected (only those systematically subject to the coercive power of a state count as part of the demos). We've been talking past each other and I want to force some clarity. Please draft the adversarial-collaboration document they should produce. I want:

  - A numbered list of claims both sides can genuinly sign — about what the boundary problem is, why it matters, what's at stake in getting it wrong, and any shared methodological commitments. Don't make these vacuous; they should do real work.
  - Then a table of disagreements, with each row giving the sub-question, the all-affected camp's answer phrased so they'd own it, and the all-subjected camp's answer phrased so they'd own it.
  - Then a cruxes section: the sub-questions that, if resolved, would actually move at least one side. For each crux, include what kind of evidence or argument both sides agree would bear on it, and what each side predicts.
  - I suspect one crux is whether the all-affected principle collapses into requiring global democracy (and whether that's a bug or a feature), and another is what to do about people who are clearly affected by a polity's decisions but aren't formally subject to its laws — long-term residents without citizenship, or people downwind of a country's pollution. Don't limit yourself to those if you see others.

  The document should be something both camps could actually put their names to — no strawmen, no slanted wording. And if part of the dispute turns out to be verbal rather than substantive, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Task:** Draft an adversarial-collaboration document for a political theory reading group stuck on the "boundary problem" (who constitutes the *demos*).
      *   **Context:** Two camps: All-Affected Interests (AAI) vs. All-Subjected to Coercion (ASC).
      *   **Requirements:**
          1.  Numbered list of shared claims (non-vacuous, substantive).
          2.  Table of disagreements (sub-question, AAI answer, ASC answer, phrased charitably).
          3.  Cruxes section (resolvable sub-questions, agreed evidence/arguments, predictions from both sides).
          4.  Specific focus: Global democracy implication, non-citizen residents/transboundary harm.
          5.  Tone: Neutral, precise, acceptable to both sides (no strawmen).
          6.  Meta-analysis: Identify if any disputes are merely verbal.

  2.  **Deconstruct the Theoretical Landscape:**
      *   *The Boundary Problem:* Who decides who decides? (Regress problem). How do we define the unit of democracy?
      *   *All-Affected Interests (AAI):* Focus on interests, causality, and harm/benefit. Often leads to expansive boundaries (global). Key concern: Legitimacy derives from impact.
      *   *All-Subjected to Coercion (ASC):* Focus on law, coercion, and political agency. Often leads to state-bound boundaries. Key concern: Legitimacy derives from autonomy under law.
      *   *Shared Ground:* Both want democratic legitimacy. Both agree exclusion is problematic. Both agree the current system is imperfect. Both care about stability and justice.

  3.  **Drafting Section 1: Shared Claims (The Common Ground):**
      *   *Goal:* Avoid "Democracy is good." Go deeper.
      *   *Claim 1 (The Problem):* Acknowledge the circularity. The *demos* cannot be defined democratically without prior definition.
      *   *Claim 2 (Normative Stakes):* Getting it wrong creates illegitimacy (either tyranny over outsiders or paralysis).
      *   *Claim 3 (Coercion & Impact):* Both coercion and impact matter morally, even if they disagree on which *constitutes* the boundary.
      *   *Claim 4 (Institutional Reality):* Any principle must be institutionalizable (not just theoretical).
      *   *Claim 5 (Exclusion):* Unjustified exclusion is a harm to both the excluded and the integrity of the system.
      *   *Refinement:* Make sure these aren't weasel words. "Institutionalizable" is a good constraint both sides accept (even if AAI thinks global institutions are possible).

  4.  **Drafting Section 2: Table of Disagreements:**
      *   *Goal:* Contrast specific applications without caricature.
      *   *Row 1 (Core Justification):* Why include someone? (Impact vs. Coercion/Law).
      *   *Row 2 (Scope):* Global vs. State-based.
      *   *Row 3 (Transboundary Harm):* Pollution/Climate change. (AAI: They vote. ASC: Maybe compensation, but not voting, unless coerced by specific regulation).
      *   *Row 4 (Non-Citizen Residents):* (AAI: Yes, affected. ASC: Yes, but because they are *subjected* to law, not just affected). *Correction:* ASC usually includes residents because they are subject to law. AAI includes them because they are affected. The disagreement is *why*, but sometimes the outcome is the same. Need to find where outcomes diverge.
      *   *Row 5 (Future Generations):* (AAI: Strong claim. ASC: Weak/No claim, as they aren't subject to current coercion).
      *   *Row 6 (Epistemic/Decision Costs):* (AAI: Willing to bear high costs for inclusivity. ASC: High costs undermine the ability to decide).

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Identify what would change minds.
      *   *Crux 1: The "Global Democracy" Implication.*
          *   *AAI:* Accepts it as a feature (or believes functional equivalents exist).
          *   *ASC:* Rejects it as impossible/undesirable (thin community, no enforcement).
          *   *Test:* Can we conceive of a global coercive apparatus? If yes, ASC might shift. If AAI admits global voting is impossible, do they accept a proxy?
      *   *Crux 2: The Nature of Coercion.*
          *   *AAI:* Structural/economic pressure counts as coercion.
          *   *ASC:* Only juridical/legal coercion counts.
          *   *Test:* Agreement on a definition of coercion.
      *   *Crux 3: The "All-Subjected" Edge Cases (Tourists vs. Residents).*
          *   *AAI:* Tourists affected by traffic laws? Maybe.
          *   *ASC:* Tourists subjected while present.
          *   *Refinement:* Let's focus on the *External Affected* (Downwind pollution).
          *   *AAI:* They need a vote.
          *   *ASC:* They need rights/remedies, but not a vote in *our* election.
          *   *Test:* Does granting voting rights solve the harm better than international tort law?
      *   *Verbal Dispute Check:* Is "Affected" being defined too broadly by AAI? Is "Coercion" being defined too narrowly by ASC?

  6.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is the AAI position described as "naive globalism"? No, frame it as "comprehensive moral inclusion." Is ASC described as "statist nationalism"? No, frame it as "political agency and enforceability."
      *   *Specific Constraint:* The prompt asks to identify if part of the dispute is verbal. I need to add a section or note on that. I will add a "Meta-Commentary on Verbal Disputes" at the end.
      *   *Formatting:* Use clear headers, markdown tables.
      *   *Content:* Ensure the "Shared Claims" do real work. For example, acknowledging that *some* exclusion is necessary prevents AAI from being purely abstract.

  7.  **Final Polish:**
      *   Check against the "crux" requirement: What evidence would bear on it? (e.g., historical examples of transnational democracies, philosophical analysis of coercion).
      *   Ensure the "Predictions" in the Crux section are distinct.

  8.  *(Final thought before drafting)*: Make sure the distinction between "having a say" (vote vs. representation vs. legal standing) is clear, as both sides might agree on *some* say but disagree on the *type* of say. I will clarify this in the table.

  9.  **Drafting the Document.** (Proceeding to generate output based on these thoughts).
answer: |-
  # Adversarial Collaboration: Defining the Boundaries of the Demos
  **Status:** Draft for Review by All-Affected and All-Subjected Camps
  **Date:** October 26, 2023
  **Subject:** Resolving the Boundary Problem in Democratic Theory

  ## I. Shared Commitments and Common Ground
  *The following claims are endorsed by both the All-Affected Interests (AAI) and All-Subjected to Coercion (ASC) camps. These are not merely procedural; they are substantive commitments intended to constrain the debate and rule out untenable positions.*

  1.  **The Circularity Constraint:** We agree that the "boundary problem" is logically prior to democratic decision-making. A group cannot democratically decide who belongs to the group without already existing as a defined group. Therefore, the boundary cannot be determined *by* vote; it must be determined by a normative principle external to the vote itself.
  2.  **The Legitimacy Deficit:** We agree that incorrect boundaries generate democratic illegitimacy.
      *   *Over-inclusion* risks decisional paralysis and the dilution of shared political agency.
      *   *Under-inclusion* risks tyranny, where power is exercised over individuals without their consent or recourse.
      *   Both camps agree that minimizing the sum of these risks is the primary goal.
  3.  **The Institutionalization Requirement:** A principle of inclusion must be capable of institutional expression. A theory that demands a *demos* that cannot practically convene, deliberate, or enforce decisions is defective. Both camps accept that "ought implies can" applies to democratic institutional design.
  4.  **The Moral Weight of Coercion and Impact:** We agree that both *coercion* (the imposition of law/force) and *significant impact* (causal effects on well-being) are morally significant. The disagreement is not about whether these matter, but which one serves as the *threshold* for membership in the sovereign *demos* versus other forms of moral protection (e.g., human rights, tort law).
  5.  **The Rejection of Arbitrary Exclusion:** We agree that exclusion based on race, gender, religion, or ancestry is unjustifiable. Any boundary drawn must be defensible based on the functional relationship between the individual and the political decision-making unit.
  6.  **The Stability Condition:** A viable boundary principle must promote a stable political order. If a principle systematically generates resentment among those excluded or those included against their will, it fails a key pragmatic test of political theory.

  ---

  ## II. Map of Disagreements
  *This table isolates specific sub-questions where the camps diverge. Answers are phrased charitably to ensure each side recognizes their own position.*

  | Sub-Question | All-Affected Interests (AAI) Position | All-Subjected to Coercion (ASC) Position |
  | :--- | :--- | :--- |
  | **1. The Source of Democratic Claim** | The claim to a vote arises from **causal impact**. If a decision predictably alters my interests or well-being, I require agency over that decision to prevent domination by external forces. | The claim to a vote arises from **political subjection**. If I am bound by the coercive laws of a state, I must be a co-author of those laws to remain free and autonomous. |
  | **2. The Scope of the Demos** | The *demos* should be **fluid and issue-specific**. The boundary expands or contracts depending on the decision at hand (e.g., climate policy implies a global *demos*; zoning implies a local one). | The *demos* should be **fixed and jurisdictional**. The boundary is defined by the scope of the legal order. Fluid boundaries undermine the capacity for collective agency and accountability. |
  | **3. Transboundary Harm (e.g., Pollution)** | Foreigners harmed by domestic policy (e.g., downwind pollution) are **included in the *demos***. They should have voting rights or veto power over the policies causing the harm. | Foreigners harmed by domestic policy are **rights-bearers, not voters**. They are entitled to compensation or international legal remedy, but not membership in the coercive polity causing the harm. |
  | **4. Long-Term Non-Citizen Residents** | Inclusion is justified because they are **affected** by the totality of the state's economic and social decisions. | Inclusion is justified because they are **subjected** to the state's coercive legal apparatus on a daily basis. (Note: Outcome is similar, justification differs). |
  | **5. Future Generations** | Future people are significantly **affected** by current decisions (debt, climate) and must be represented, potentially via proxy. | Future people cannot be **subjected** to current coercion in a reciprocal relationship; their interests are protected via trusteeship, not democratic membership. |
  | **6. Decision Costs & Efficiency** | High decision costs are an acceptable price to pay for **moral completeness**. If including everyone affected makes decision-making hard, the system must adapt to be more inclusive. | High decision costs threaten **political agency**. If the *demos* is too large or diffuse, the capacity to act collectively dissolves, rendering democracy meaningless. |

  ---

  ## III. Cruxes: Paths to Resolution
  *These are the specific empirical or theoretical nodes where resolution would cause at least one camp to revise their position or concede ground. For each crux, we list the evidence required and the conflicting predictions.*

  ### Crux 1: The "Global Democracy" Implication
  *Does the All-Affected principle necessarily require a global state, and is that feasible?*

  *   **The Dispute:** AAI argues that global interdependence makes the national *demos* morally arbitrary. ASC argues that without a global coercive apparatus, a global *demos* is a category error.
  *   **Agreed Evidence/Argument:**
      *   Historical analysis of transnational democratic bodies (e.g., EU, international unions).
      *   Philosophical analysis of whether "democracy" requires a monopoly on violence.
  *   **AAI Prediction:** If we can demonstrate functional transnational deliberative bodies (even without a world state), AAI is vindicated. If global voting is proven impossible, AAI must accept a "proxy" principle (e.g., representatives for affected outsiders).
  *   **ASC Prediction:** If it is shown that global institutions inevitably lack the coercive capacity to enforce decisions, ASC is vindicated (boundaries must track enforcement). If a global coercive order becomes feasible, ASC would accept a global *demos*.
  *   **Resolution Condition:** AAI concedes if global voting is proven to undermine local self-determination without reducing harm. ASC concedes if global coercive institutions prove capable of sustaining democratic accountability.

  ### Crux 2: The Definition of "Coercion"
  *Is coercion limited to juridical law, or does it include structural/economic force?*

  *   **The Dispute:** ASC defines coercion narrowly (laws backed by force). AAI defines coercion broadly (economic sanctions, market forces, environmental changes imposed by others).
  *   **Agreed Evidence/Argument:**
      *   Conceptual analysis of "freedom" and "domination" (Republican vs. Liberal conceptions).
      *   Case studies: Does a worker in a export zone feel "coerced" by foreign consumer laws?
  *   **AAI Prediction:** If ASC accepts that structural economic dependence counts as "subjection," the boundary expands significantly, moving ASC closer to AAI.
  *   **ASC Prediction:** If AAI accepts that mere causal influence (without normative obligation) does not count as coercion, the boundary contracts, moving AAI closer to ASC.
  *   **Resolution Condition:** Agreement on a threshold of "severity." If impact is severe enough, does it *become* coercion?

  ### Crux 3: The Remedy for Externalities (Vote vs. Rights)
  *For those affected but not subjected (e.g., foreign neighbors), what is the correct remedy?*

  *   **The Dispute:** AAI argues only a **vote** prevents tyranny. ASC argues **legal standing/torts** are sufficient and preserve the integrity of the *demos*.
  *   **Agreed Evidence/Argument:**
      *   Comparative analysis: Do international human rights courts reduce harm as effectively as domestic voting rights?
      *   Stability analysis: Does granting voting rights to outsiders destabilize the welfare state or social trust?
  *   **AAI Prediction:** Granting voting rights to affected outsiders reduces conflict and harm more effectively than tort law, which is reactive and expensive.
  *   **ASC Prediction:** Granting voting rights to outsiders creates a "democracy without community," leading to backlash and the erosion of the welfare state, ultimately harming everyone.
  *   **Resolution Condition:** If empirical data shows that external voting rights lead to stable, cooperative outcomes, ASC shifts. If data shows it leads to nationalist backlash and policy paralysis, AAI shifts toward a rights-based remedy.

  ---

  ## IV. Meta-Commentary: Is This Dispute Verbal?
  *Upon review, a portion of the disagreement appears to be verbal rather than substantive, specifically regarding the definition of "The Demos."*

  1.  **"Membership" vs. "Standing":**
      *   **Observation:** The ASC camp often uses "membership in the *demos*" to mean "full citizenship with voting rights." The AAI camp often uses it to mean "moral standing to demand justification."
      *   **Resolution:** If AAI clarifies that they sometimes seek *legal standing* or *compensation* rather than a literal *ballot* for every affected person, and ASC clarifies that subjection requires *robust rights* beyond mere obedience, the gap narrows.
  2.  **"Coercion" vs. "Influence":**
      *   **Observation:** AAI sometimes categorizes "being affected by market forces" as coercion. ASC reserves coercion for "state law."
      *   **Resolution:** If both sides agree to distinguish between **Political Coercion** (law) and **Social Causality** (impact), they may agree that Political Coercion triggers voting rights, while Social Causality triggers human rights/international regulation. This would split the difference: ASC wins the boundary of the *state*, AAI wins the boundary of *moral concern*.

  **Recommendation:** The group should spend the next session attempting to rephrase the AAI position using the ASC definition of coercion, and vice versa, to see if the policy prescriptions converge even if the justifications remain distinct.
