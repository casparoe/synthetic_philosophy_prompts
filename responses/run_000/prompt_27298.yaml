      *   Is it *purely* substantive? If it were, there would be a fact of the matter to discover. But what fact? Mathematical facts are usually internal to the system.
      *   *Better Diagnosis:* It's a disagreement about **normativity** and **utility**, disguised as a disagreement about **meaning** and **truth**. It's about what mathematics is *for*.

