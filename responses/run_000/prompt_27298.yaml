          *   Classical: Mathematics is about describing a static realm of truths. Efficiency and elegance of reasoning matter.
          *   Intuitionist: Mathematics is about the activity of construction. Content and extractability matter.
      *   **The "Meaning" Shift:** Yes, the connectives mean different things, *but* that's because the *goals* are different. The meaning change is a *consequence* of the normative disagreement, not the root cause.

