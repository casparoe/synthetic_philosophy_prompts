  2. Following Fuller, we must recognise that law is a purposive enterprise subject to an internal morality which this regulation utterly betrayed. A rule enacted solely to persecute a class of members lacks the generality and purpose necessary to command fidelity as law.
  3. We must acknowledge Hart's warning that conflating validity with morality risks obscuring the uncomfortable truth that formally valid laws can be wicked. To declare the regulation never law may appear to rewrite history rather than confront the university's past misuse of lawful authority.
  4. However, maintaining the fiction of validity perpetuates the harm by suggesting the students were legitimately subject to a rule that was inherently destructive of the legal order itself. True rectification requires us to affirm that such persecution falls outside the bounds of what can rightly be called university law.
  5. My recommendation would shift to mere expungement if it could be established that declaring the original decision void undermines the legal certainty required for all historical disciplinary records. Without such evidence, however, honesty demands we recognise the regulation's fundamental defect rather than merely pardoning its effects.
