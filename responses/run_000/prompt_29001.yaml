answer: |-
  You are not missing a step. You have correctly identified the fundamental identifiability problem that plagues Inverse Reinforcement Learning (IRL), and your intuition aligns with some of the most critical literature in the alignment space from the last 5–7 years.

  The short answer is: **You are right, and the alignment community largely agrees with you now.** Pure IRL, treated as a method to uniquely recover a "true" human utility function from behavior alone, is mathematically impossible without making strong, unprovable normative assumptions.

  However, the reason IRL still appears in discussions is that the research program has evolved from "IRL as a recovery mechanism" to "IRL as a framework for managing uncertainty." Here is the breakdown of why your objection holds, why people kept talking about it, and where the field has actually moved.

  ### 1. The "No Free Lunch" Theorem for IRL
  Your objection is formally captured in **"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents" (Armstrong & Mindermann, 2018)**.

  The paper proves exactly what you suspected: for any behavior policy, there is a degeneracy between the **reward function** and the **planning algorithm (rationality)**.
  *   If you see an agent doing $X$, it could be because they want $X$ (high reward) and are rational.
  *   It could be because they hate $X$ (low reward) but are compelled by a bias or constraint.
  *   It could be because they are acting randomly.

  Mathematically, if you don't fix the rationality model (the "noise" or "temperature" in your softmax), the reward function is completely underdetermined. Even if you *do* fix the rationality model (e.g., assume Boltzmann rationality), you are making a **normative assumption** about how humans *should* reason, not just describing how they *do* reason.

  As you noted, this is the Revealed Preference problem redux. If humans are not perfectly rational expected utility maximizers (and we aren't), then inferring a utility function from behavior requires you to first decide which parts of the behavior are "signal" (values) and which are "noise" (biases, mistakes, constraints). **The data cannot tell you which is which.**

  ### 2. So why did/does the community talk about IRL?
  If the math says it's impossible, why was IRL a dominant paradigm in alignment for so long?

  **A. It formalizes uncertainty (Bayesian IRL)**
  The biggest shift in the last decade was moving from *point estimates* of reward to *distributions* over reward.
  Even if you can't pin down the *unique* reward, behavior does rule out *some* rewards. If I watch you avoid a cliff, I can rule out reward functions that assign high value to falling off cliffs.
  The value of IRL for alignment isn't that it finds the *True Reward*; it's that it allows an agent to maintain **uncertainty** about the reward. This leads to **Cooperative IRL (CIRL)** (Hadfield-Menell et al.). In CIRL, the AI knows it doesn't know the reward, so it behaves cautiously and seeks information (asks questions) rather than optimizing a potentially wrong reward function aggressively. The "point" of IRL here is not recovery, but **safe exploration**.

  **B. Imitation vs. Alignment**
  For many applications (robotics, self-driving), you don't need the *true* values; you just need **behavioral cloning** that generalizes better than supervised learning. IRL often generalizes better to new environments than pure imitation because it infers the *goal* rather than the *trajectory*.
  The confusion arises when this technical success in robotics is conflated with the philosophical goal of **Value Alignment**. Inferring "what task the human is trying to do" is different from inferring "what the human values in life."

  **C. Priors are the only way out**
  You wrote: *"everything else coming from the prior."*
  This is actually the consensus solution. Since the data underdetermines the reward, you *must* rely on priors. The research question becomes: **What priors are justified?**
  *   **Simplicity priors:** Assume the reward function is simple (Kolmogorov complexity). (Problem: Human values are complex.)
  *   **Cognitive architecture priors:** Assume humans have specific biases (hyperbolic discounting, myopia, limited working memory). If we model the *structure* of human irrationality, we can better disentangle bias from preference.
  *   **Normative priors:** We explicitly hard-code certain moral assumptions (e.g., "pain is bad") to anchor the inference.

  ### 3. Where the field has moved (Post-IRL)
  Because of the exact problem you identified, the center of gravity in alignment has shifted away from pure IRL.

  **1. Preference Learning (over Demonstrations)**
  It turns out that **comparisons** (A vs. B) provide more information about the reward structure than raw demonstrations, because they cancel out some dynamics of the environment. This led to RLHF (Reinforcement Learning from Human Feedback). However, note that RLHF suffers from similar identifiability issues if you assume the human has a static reward function.

  **2. Assistance Games**
  Stuart Russell's current framing (in *Human Compatible*) emphasizes that the AI should never treat the reward function as known. The objective is not "maximize $R$" but "maximize $R$ where $R$ is unknown and defined by human behavior." This is IRL stripped of the claim that it can *solve* for $R$ uniquely.

  **3. Deliberative Coherence**
  Some researchers argue we shouldn't infer values from *revealed* preferences (what we do) but from **considered** preferences (what we would say we want after reflection). This moves the problem from IRL to **AI-assisted deliberation**. The AI helps humans figure out what they want, rather than inferring it from their clumsy actions.

  ### 4. The "Missing Step" you were looking for
  You asked: *"Why do people treat IRL as if it recovers what humans actually want, rather than re-describing what they did?"*

  **Honest answer:** Many early posts did treat it that way, and they were overly optimistic.
  **Nuanced answer:** The sophisticated view is that IRL is a **binding constraint**.
  Even if many reward functions explain the data, the set of *plausible* reward functions is smaller than the set of *all possible* reward functions. If you optimize for the *worst-case* reward in that plausible set (maximin), you get safer behavior than if you ignore the data entirely.

  However, your skepticism is warranted. There is a specific LessWrong post sequence you might find validating:
  *   **"The No Free Lunch Theorem for Inverse Reinforcement Learning"** (discussed extensively in the comments of various alignment forum posts).
  *   **"Values are not Preferences"** (arguing that human "values" are a reflection of a complex cognitive process, not a static function to be inferred).

  ### Summary
  You haven't missed a step in the math. The math says IRL cannot uniquely identify values from behavior without normative assumptions about rationality.
  *   **The "Point" of IRL today:** It is a tool for maintaining uncertainty and enabling the AI to ask for help (CIRL), not a magic oracle that extracts values.
  *   **The Community Status:** Most serious alignment researchers acknowledge the Armstrong & Mindermann result. The focus has shifted to **how to justify the priors** needed to break the degeneracy, or how to bypass behavioral inference entirely in favor of deliberative processes.

  If you are reading a post that claims IRL solves the value loading problem by simply watching humans, that post is likely outdated or simplifying heavily for pedagogical reasons. Your tabooing of "preference" and "value" was the correct move; without a formal model of human cognitive architecture, those terms are just placeholders for the identifiability gap.
