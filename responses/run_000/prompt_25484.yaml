answer: |-
  You have hit on one of the most famous and persistent puzzles in the philosophy of science. You are absolutely right about the core tension: **Strict Bayesian math says old evidence shouldn't count, but scientific history says it definitely does.**

  This is known as **Glymour's Problem of Old Evidence** (named after philosopher Clark Glymour, who formalized it in 1980). The Einstein/Mercury example is the canonical case used to discuss it.

  Here is the breakdown of what this means for you as an ordinary person evaluating theories, whether in science, politics, or everyday life.

  ### 1. Is the math wrong, or is our intuition wrong?
  It is not that everyday reasoning is flawed; it is that the **standard Bayesian model is too simple** for this specific situation.

  The math assumes "Logical Omniscience." It assumes that the moment you have a theory, you instantly know every single fact that theory implies. In that idealized world, if you already know Fact E, and you come up with Theory H, you would have immediately realized "Oh, H implies E" at the same moment you thought of H. Therefore, learning the connection adds no new information.

  But humans aren't logically omniscient. Einstein didn't know General Relativity implied the Mercury orbit until he did the math. **The "new evidence" wasn't the orbit of Mercury (which was old); the new evidence was the *logical connection* between the theory and the orbit.**

  **Takeaway:** Your intuition that Mercury's orbit *should* count as evidence is correct. The "problem" is a technical limitation of a specific mathematical model, not a flaw in human rationality.

  ### 2. Should you be more skeptical of theories that explain old facts?
  **Yes, but with nuance.** In scientific methodology, this distinction is often called **Prediction vs. Accommodation.**

  *   **Prediction:** A theory tells you something *new* will happen (e.g., "There is a planet past Neptune," or "Light will bend during an eclipse").
  *   **Accommodation:** A theory is built or adjusted to fit data we already have (e.g., "This theory fits the existing data on Mercury").

  **Why be skeptical of Accommodation?**
  It is much easier to fit a curve to existing dots than to predict where the next dot will land. If I give you 10 data points, you can always draw a complex squiggly line that goes through every single one of them. That doesn't mean your line represents reality; it might just be "overfitting" the noise.

  **The Implication for You:**
  When a new theory comes along that explains things we already know:
  1.  **Check for "Ad-Hocery":** Did the theory have to be specially tweaked to fit that old fact? If the theory has a "fudge factor" that was adjusted specifically to make Mercury's orbit work, be skeptical.
  2.  **Check for Naturalness:** In Einstein's case, he didn't add a patch to General Relativity to make Mercury work. The number fell out of the original equations naturally. If a theory explains old evidence *without* needing special adjustments, that is strong evidence, even if the evidence is old.

  ### 3. The "Surprise" Factor (Novelty)
  Bayesian reasoning works best when evidence is **surprising**.
  If $P(E)$ (the probability of the evidence) is 1 (because we've known it for decades), the math says the "boost" to the theory is zero.
  If $P(E)$ is low (a surprising new prediction), the "boost" is huge.

  **The Implication for You:**
  A theory that makes a **risky, novel prediction** is generally more valuable than one that merely organizes old facts.
  *   **High Value:** "If this theory is true, we should find a specific particle in this collider next year." (If found, huge confirmation).
  *   **Lower Value:** "This theory explains why the stock market crashed in 2008." (Easy to say in hindsight; hard to prove the theory caused the insight).

  However, do not dismiss old evidence entirely. A theory *must* explain the old evidence to be viable. If a new theory explains new things but contradicts well-established old facts (without a very good reason), it is likely wrong.

  ### 4. Consilience (The Unity Test)
  One solution to the Problem of Old Evidence is **Consilience**. This happens when a theory explains *multiple* old facts that previously seemed unrelated.

  Even if the facts are old, the *connection* between them is new.
  *   **Example:** Darwin's theory of evolution didn't predict new fossils initially. But it took old facts from biogeography, embryology, and anatomy—which previously had no unifying explanation—and showed they were all consequences of one mechanism (natural selection).

  **The Implication for You:**
  If a theory claims to explain an old fact, ask: **"Does this explain other old facts too?"**
  If a conspiracy theory explains one weird event, that's accommodation. If a scientific theory explains weird events in economics, biology, and history simultaneously, that is consilience, and it counts as strong evidence even if the data is old.

  ### Summary Checklist for the Ordinary Thinker
  You don't need to change how you think fundamentally, but you should apply a slight discount rate to "old evidence." Here is a practical framework:

  1.  **Prioritize Novel Predictions:** If Theory A predicts something new and true, and Theory B only explains old data, Theory A is currently the stronger candidate.
  2.  **Penalize Ad-Hoc Explanations:** If the theory seems to have been reverse-engineered to fit the old fact, reduce your confidence. If the old fact is a natural, unavoidable consequence of the theory's core axioms, maintain high confidence.
  3.  **Value Unification:** If the theory connects old dots that were previously unconnected, treat that as "new" evidence of the theory's power.
  4.  **Don't Ignore the Past:** A theory that fails to explain established old evidence is usually dead on arrival, regardless of how many new predictions it makes.

  **Verdict:** The "Problem of Old Evidence" is a technical glitch in an idealized math model, not a reason to distrust your intuition. Your intuition correctly recognizes that learning *why* something happens is valuable, even if you already knew *what* happened. Just remain aware that it is easier to lie about the past than to predict the future.
