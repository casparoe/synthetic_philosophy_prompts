answer: |-
  # Decision Tree: The Standing to Blame

  ### **Root Question:** Is a correct moral judgment sufficient for the standing to blame?
  *(i.e., Does identifying a wrong automatically grant the normative power to hold the wrongdoer accountable?)*

  *   **YES** → **Universalism**
      *   *Awkward Commitment:* Must accept that a vicious hypocrite retains the full normative power to resent a minor transgression by a morally superior agent.
  *   **NO** → *(Standing is defeasible; proceed to Branch 1)*

  ---

  ### **Branch 1: What is the primary source of standing-defeat?**
  *(i.e., When standing is lost, is it primarily due to facts about the blamer's conduct or facts about the blamer's connections?)*

  *   **A. The Blamer's Moral Record** → *(Proceed to Branch 2)*
  *   **B. The Blamer's Relationships** → *(Proceed to Branch 3)*

  ---

  ### **Branch 2: Within Moral-Record Views, which facts defeat standing?**
  *(i.e., Does standing require a clean record regarding the specific wrong, the type of wrong, or both?)*

  *   **A. Hypocrisy and Complicity Both Defeat** → **The Strict Record View**
      *   *Awkward Commitment:* Must explain why a blamer implicated in the *very same token act* is treated identically to one who merely committed *similar type acts* in the past.
  *   **B. Only Hypocrisy Defeats** → **The Hypocrisy Account**
      *   *Awkward Commitment:* Must accept that an accomplice to the specific wrong retains standing provided they haven't committed similar wrongs elsewhere.
  *   **C. Only Complicity Defeats** → **The Complicity Account** *(Unnamed/Rare)*
      *   *Awkward Commitment:* Must accept that a serial offender retains standing to blame provided they were not involved in this specific instance of wrongdoing.

  ---

  ### **Branch 3: Within Relational Views, which relationship is necessary for standing?**
  *(i.e., Lacking which relationship defeats the standing to blame?)*

  *   **A. Relationship to the Victim** → **The Victim-Privilege View**
      *   *Awkward Commitment:* Must accept that third-party witnesses are silenced and lack authority to condemn systemic injustices they do not personally suffer.
  *   **B. Relationship to the Moral Community** → **The Communal (Membership) View**
      *   *Awkward Commitment:* Must accept that outsiders lack the authority to condemn atrocities committed within closed or isolated societies.
  *   **C. Relationship to the Wrongdoer** → **The Particularist View** *(Unoccupied)*
      *   *Awkward Commitment:* Must accept that strangers lack the authority to hold one another accountable for moral violations.

  ***

  ## **Meta-Philosophical Notes for Seminar Discussion**

  ### **1. Indistinguishable Pairs (Theoretical Underdetermination)**
  This decision tree maps the **extension** of standing (who has it), but it cannot distinguish between competing **explanations** for why standing is lost. Consequently, the tree groups together positions that are distinct in the literature:
  *   **Within the Hypocrisy Account:** The tree does not separate **Fairness-Based Accounts** (hypocrites lack standing because blaming is unfair) from **Commitment-Based Accounts** (hypocrites lack standing because their blame fails to express a genuine commitment to the norm).
  *   **Within the Communal View:** The tree does not separate **Strawsonian Accounts** (standing derives from participation in reactive attitudes) from **Darwallian Accounts** (standing derives from second-personal authority within a community).

  ### **2. Unoccupied or Unattractive Logical Space**
  Several leaves on the tree represent logically coherent positions that are largely unoccupied in contemporary literature. Their diagnosis is as follows:
  *   **The Complicity Account (Branch 2C):** *Diagnosis: Merely Unattractive.* While complicity is widely accepted as a defeater, excluding hypocrisy as a defeater is rare. It implies that moral consistency across time is irrelevant to standing, which contradicts the intuition that blame expresses moral authority.
  *   **The Particularist View (Branch 3C):** *Diagnosis: Incoherent/Unattractive.* This view suggests standing is grounded in special ties (e.g., friendship) rather than shared moral norms. It struggles to explain why we have standing to blame enemies or strangers for egregious violations of universal norms.
  *   **Hybrid Views (Record + Relationship):** *Diagnosis: Unexplored in this Tree Structure.* The tree forces a choice between Moral Record (Branch 1A) and Relationships (Branch 1B). However, many plausible views are **Hybrids** (e.g., one loses standing if *either* a hypocrite *or* an outsider). These views are philosophically robust but cannot be represented as a single leaf in a binary decision tree.

  ### **3. Usage Note**
  When using this handout, remind students that "Standing" is distinct from "Appropriateness." A blamer may have *standing* (per the tree) but still blame inappropriately (e.g., at the wrong time, in the wrong tone). This tree maps only the normative *permission* to hold another accountable.
