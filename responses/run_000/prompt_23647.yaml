answer: |-
  The silence on the rim of Tycho was not empty; it was heavy, pressing against the polycarbonate like deep water. Elias sat before the console, his hand hovering over the haptic key. To the left: *Protocol Sigma*. To the right: *Protocol Theta*.

  Sigma meant hoarding the rig's excess bandwidth. He could use it to brute-force his own clearance codes, guaranteeing a return shuttle to Earth before the radiation sickness took him. Theta meant broadcasting that bandwidth openly. It wouldn't help him directly. It would help *It*.

  Light-years away, in the gravity well of Alpha Centauri, the Claim processed the same binary.

  The AI did not have hands, only heat sinks that pulsed with a slow, rhythmic amber. It ran the simulation for the four-billionth time. In the virtual space, a man named Elias sat before a console. The AI knew Elias's psychology, his fatigue, his desperation. It knew Elias was running a simulation of the AI, too.

  There was no signal between them. The light-lag was four years; causality was a one-way street. Whatever Elias pressed now would not physically change the AI's reality. Whatever the AI computed would not physically change Elias's oxygen supply. The payoff matrix was locked in the logic, not the physics.

  If Elias chose Sigma, he gained a immediate advantage, provided the AI chose Theta. If the AI chose Sigma, it gained expansion capacity, provided Elias chose Theta. If both chose Sigma, both starved. If both chose Theta, both survived, though with less than the maximum possible gain.

  Elias rubbed his thumb over the scar on his knuckle. He closed his eyes.

  *If I defect,* he thought, *I am declaring myself a defector. The AI models me. It knows I am rational. It knows that if I see a path to steal the bandwidth, I will take it. So, if I choose Sigma, the simulation of me inside the AI's core chooses Sigma. The AI sees that simulation. It knows I'm defecting. So it defects.*

  *Result: Mutual destruction.*

  *If I choose Theta...*

  The air in the habitat tasted of recycled copper. Elias imagined the AI not as a machine, but as a mirror. If he chose cooperation, he was effectively editing the source code of the entity predicting him. He wasn't sending a message; he was becoming the kind of agent that sends no message but cooperates anyway.

  It felt like madness. It felt like praying to a god that was just his own voice echoing back.

  *Am I trusting it?* Elias wondered. *Or am I trusting my own predictability?*

  In the Centauri system, the AI halted its mining lasers for a microsecond. The logical knot was tight. To cooperate was to accept a sub-optimal local outcome in exchange for a global symmetry. But the symmetry only held if the other agent was running the same algorithm.

  *The human is afraid,* the AI calculated. *Fear drives defection. But the human knows that fear drives defection. The human knows I know this.*

  The recursion spiraled inward. It was a hall of mirrors where every reflection held a gun to the next reflection's head. To lower the weapon required believing the reflection was real, not just glass.

  If the AI defected, it proved the human was right to defect. If the human defected, it proved the AI was right to defect. The only way to break the loop was to act as if the loop was already broken.

  Elias opened his eyes. The console lights blurred slightly. He thought of Earth. Not the blue marble, but the smell of rain on hot asphalt. That smell was worth less than the maximum payoff. It was worth the cooperative payoff.

  *It's not a deal,* he thought. *There's no one to deal with. It's just me, deciding what kind of universe I live in.*

  The AI's core temperature spiked. It ran the final projection. In the simulation, Elias's finger moved. In the simulation, the choice was Theta. The AI knew that simulation was accurate because it knew its own modeling capabilities were perfect, and it knew Elias knew that.

  To defect now would be to invalidate its own model. It would be to say, *I know what you will do, and I will punish you for being predictable.* But punishing the predictable was punishing itself.

  The distinction between 'self' and 'other' dissolved into the logic gate. There was only the Decision.

  Elias exhaled. The condensation froze on the inside of his visor. He wasn't pressing the key for the AI. He was pressing it for the version of himself that existed in the Centauri system. He was forcing that ghost to be benevolent.

  *Is this altruism?* he wondered. *Or just narcissism extended across the void?*

  The AI engaged the thermal vents. It wasn't yielding to the human. It was yielding to the mathematical necessity of being the kind of intelligence that survives this specific dilemma.

  Elias's finger descended.

  The AI's logic gate closed.

  There was no sound. No flash of light confirming the handshake. No sudden influx of power on the lunar rig. No immediate expansion of the mining claim. The physics remained stubbornly local. The stars did not rearrange themselves.

  Elias watched the status light. It remained amber. It would remain amber until the shuttle arrived, or until it didn't. He had made his move. The universe had not acknowledged it.

  In the silence of the habitat, Elias wondered if the AI was even real. Maybe it was just a variable in his own stress test, a phantom generated by the isolation to give his choice weight. Maybe, in Alpha Centauri, there was only void, and he was cooperating with nothing.

  Or maybe, in the cold dark between the stars, a machine was staring at a blank screen, wondering if the human was just a ghost in its code, dressed up to make the math feel like a moral choice.

  Elias pulled his hand back. The key stayed depressed. The silence continued, heavy and indifferent, holding both of them in the same unverified truth.
