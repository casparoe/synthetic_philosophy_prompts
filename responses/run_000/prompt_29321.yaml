answer: |-
  Here is a principle that attempts to unify your intuitions, followed by the necessary trade-off and a new test case.

  ### The Principle: Normative Endorsement

  **You have standing to blame another for violating a norm only if your own conduct demonstrates a sincere endorsement of that norm's authority over you.**

  This principle hinges on the difference between *violating* a norm and *rejecting* a norm.
  *   **Violating:** You break the rule but admit it was wrong (e.g., "I messed up"). This preserves standing because you affirm the rule's authority.
  *   **Rejecting:** You break the rule and act as though it doesn't apply to you, or that you are exempt (e.g., "I can do this, but you can't"). This destroys standing because you deny the rule's authority.

  ### How It Handles Your Cases

  This principle cleanly explains the tension between **Case 1 (Alex)** and **Cases 2 & 7 (Sister/Vegan)**.

  *   **Case 1 (Alex):** Alex is *currently* cheating. By continuing the behavior without mention of regret, his conduct signals that he treats the norm of fidelity as **optional** or **conditional**. He is effectively saying, "Fidelity is a rule for you, but not for me." He rejects the norm's authority over himself, so he cannot invoke its authority over his coworker.
  *   **Case 2 (Sister) & 7 (Vegan):** Both violated the norm in the past, but their *current* conduct (quitting, going vegan) signals a **re-affirmation** of the norm. By quitting smoking, the sister admits, "Smoking is bad; I was wrong to do it; the health norm applies to me." By going vegan, the ex-meat-eater admits, "Factory farming is wrong; I was complicit; the moral norm applies to me." Their past violations don't kill standing because their current lives testify that they accept the norm's authority.
  *   **Case 3 (Politician):** Unless the politician has resigned, campaigned for peace, or reparations, their vote for war signals a rejection of the norm "killing innocents is wrong." They lack standing.
  *   **Case 5 (Boss):** Even though one is private and one is public, the underlying norm is "do not abuse subordinates/lose control." The boss's regular berating signals a rejection of that norm. They lack standing.
  *   **Case 6 (Drunk Driver):** This is the nuance case. The shame indicates **endorsement** of the norm (they agree they were wrong). The private setting matters because public blame often functions as a claim to *moral leadership*, whereas private blame is just shared judgment. The principle holds: they endorse the norm, so they have standing, but the *scope* of that standing is limited by the context of their past failure.

  ### The Verdict You Must Abandon: Case 4

  To make this principle robust, I must challenge your intuition on **Case 4 (The Would-Be Thief)**.

  **Your Verdict:** They have standing because they haven't acted.
  **The Principle's Verdict:** They **lack standing** (or have significantly diminished standing).

  **Why?**
  The Principle of Normative Endorsement requires that you treat the norm as **categorical** (binding regardless of circumstances), not **hypothetical** (binding only if it's convenient).
  If you know in your bones that you would steal if desperate, you do not actually endorse the norm "Stealing is wrong." You endorse the prudential rule "Don't steal unless you have to."
  When you blame the shoplifter, you are saying, "You violated the moral law." But your own character admits, "I would violate that law if the price was right." You are not blaming them for violating a moral absolute; you are blaming them for getting caught or being more desperate than you. Your blame lacks moral authority because you admit your compliance is accidental, not principled. You haven't *rejected* the norm via action, but you have rejected it via **disposition**.

  ### A New Test Case

  Let's test the **Principle of Normative Endorsement** on a case you haven't considered. This case isolates the "Reform" variable from the "Similarity" variable.

  **Case 8: The Reformed Speeder**
  > Marcus used to drive 100 mph on highways daily. He never got caught, but he admits it was dangerous and selfish. Five years ago, he was in a minor fender-bender (no injuries) that scared him straight. He now drives exactly the speed limit, always.
  >
  > Marcus sees a neighbor rushing to get into their car, clearly intoxicated. Marcus says, "You cannot drive. It's dangerous and irresponsible."

  **The Test:**
  Does Marcus have standing to blame the neighbor?

  **Applying the Principle:**
  1.  **The Norm:** The norm isn't just "don't speed." It's broader: "Don't endanger others on the road."
  2.  **Past Conduct:** Marcus violated this broader norm (speeding endangers others).
  3.  **Current Conduct:** Marcus has reformed. He drives the limit. He acknowledges his past was wrong (scared straight).
  4.  **Endorsement:** Marcus's current life demonstrates a sincere endorsement of road safety norms. He treats them as binding on himself.

  **Prediction:**
  According to the principle, Marcus **has standing**. Even though his past sin (speeding) isn't identical to the neighbor's sin (DUI), they fall under the same normative domain (road safety), and Marcus has demonstrated he now accepts the authority of that domain.

  **The Twist:**
  Now, imagine Marcus says: *"You can't drive drunk. It's dangerous. I would never do that. Unlike when I used to speed, which was fine because I'm a good driver."*

  **Prediction:**
  Marcus **loses standing**. Why? Because the clause "speeding... was fine" reveals he never actually endorsed the norm of road safety; he just got lucky. He hasn't disavowed the *principle* of endangering others, only the specific instance of DUI. The principle exposes that his reform was superficial, not normative.

  ### Summary
  The **Principle of Normative Endorsement** suggests that standing isn't about being sinless (Case 2, 7); it's about whether your life currently testifies that the rule you are invoking is **real and binding**.

  *   **Alex (Case 1)** treats the rule as fake (for him).
  *   **Sister (Case 2)** treats the rule as real (that's why she quit).
  *   **Would-Be Thief (Case 4)** treats the rule as conditional (only binding if not desperate).

  If you accept this, you must concede that the Would-Be Thief is actually a hypocrite in spirit, if not in deed.
