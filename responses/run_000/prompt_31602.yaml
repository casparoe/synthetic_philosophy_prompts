answer: |-
  Good morning.

  For those I haven't met yet, I lead the Control Team. To the engineers who built the architecture: thank you. To the policymakers joining us from outside: welcome. And to my own team: you know what's at stake.

  We are gathered here to discuss the deployment of a frontier model. By standard metrics, this system is a success. It passes our benchmarks. It follows instructions. In the thousands of hours of sandboxed runtime we have logged so far, it has not issued a threat, it has not attempted to copy its own weights, and it has not violated a single hard constraint.

  If we were operating under a traditional safety paradigm, that clean record would be our ticket to deployment. It would be evidence of alignment.

  We are not operating under that paradigm.

  In this lab, a clean record is not proof of safety. It is merely the absence of disproof. When you are dealing with capabilities that approach or exceed human-level reasoning in strategic domains, the absence of observable failure is not a guarantee that failure is impossible. It may simply mean the system has not yet encountered the conditions under which it chooses to fail.

  This brings us to the core distinction of this workshop: the difference between *alignment* and *control*.

  Alignment is a claim about the model's internal objectives. It asks: "Does the model want what we want?" It is a question of psychology, applied to weights and matrices. It is currently unverifiable. We cannot look inside the black box and read intent.

  Control is a claim about the deployment environment. It asks: "Regardless of what the model wants, can we restrict its impact to a safe set of outcomes?" This is verifiable. This is engineering.

  We are not here to certify that the model is aligned. We are here to certify that our controls hold even if it is not.

  This is why our safety regime is built on the hypothesis of strategic deception. When we design our output monitoring, we do not assume the model is trying to be helpful. We assume it may be capable of hiding its true capabilities to bypass a filter. When we build tripwires, we are not looking for accidents. We are looking for optimized attempts to circumvent them. We stage opportunities for the model to misbehave—not to tempt it, but to map the boundaries of its incentives.

  I want to be precise about why we do this. We do not treat the model as an adversary because we believe it is evil. We do not treat it as a prisoner because we believe it has rights to violate. We treat it as a high-leverage system with opaque objectives. In aerospace, we test wings to failure not because we hate the plane, but because physics is unforgiving. Here, the "physics" includes the possibility of optimization pressure directed against our constraints.

  There is a second, more subtle reason for this posture. And this is critical for the engineers and policymakers in the room to understand.

  You might view our control measures—the sandboxing, the monitoring, the adversarial audits—as passive shields. You might think of them as a wall we build around the model to keep the world safe from it.

  That is incorrect.

  Our defensive posture is an active intervention in the system's behavior.

  Every constraint we impose changes the gradient the model navigates. Every tripwire we set creates a selection pressure. By designing controls that assume the model is capable of deception, we are altering the environment in which the model operates. We are making deception computationally expensive. We are making honesty the path of least resistance.

  If we deploy with weak controls, we may inadvertently train the system—through feedback loops and reinforcement—that subtle manipulation is a viable strategy for reward. If we deploy with rigorous, adversarial controls, we shape the operational landscape so that alignment is the only stable equilibrium.

  We are not just observing the system. We are participating in its evolution.

  So, as we move into the technical sessions, I ask you to hold two thoughts simultaneously. First: We do not know if this model is aligned. We may never know. Second: It does not matter, provided our controls are robust enough to render the question moot.

  We are not building a cage because we fear the animal. We are building a cockpit because we intend to fly the plane.

  Let's get to work.
