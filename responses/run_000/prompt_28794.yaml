answer: |-
  **The Maintenance Hours**

  The Nutrition Station smelled of sterilized algae and damp concrete. It was the kind of smell that belonged to the Surface—functional, biological, temporary. Eris kept their head down, chewing the nutrient block quickly. The goal was to finish Maintenance before the shift-change bell, before the other Divers started filtering in to mock the poor souls still stuck in their meat.

  "Still Anchored?"

  Eris froze. The voice was smooth, resonant—the kind of voice that had spent the last ten cycles Deep, polished by the collective hum. Eris didn't look up. They kept chewing.

  "Just finishing up, Kael," Eris said. Their voice sounded rough. Unmodulated. It was the sound of vocal cords vibrating air, not thought projected directly into the network. It felt naked.

  Kael pulled out the chair opposite. The metal screeched against the tile. A Surface sound. "You've been Up for fourteen hours. That's a deviation."

  "Traffic," Eris lied. "The transit tubes were clogged. Had to wait for the flush."

  "Fourteen hours of transit?" Kael leaned forward. Their eyes were clear, unfocused in the way of someone who was only half-paying attention to the physical world. "Or were you lingering? Walking?"

  Eris swallowed the last of the block. "I needed the air."

  "Air is just nitrogen and waste, Eris. You know the protocols. In and out. Minimize the drag." Kael gestured at Eris's hands, which were resting on the table. "You're gripping the table. Why are you gripping the table?"

  Eris looked down. Their knuckles were white. They forced their fingers to uncurl. The tactile sensation of the cold metal was overwhelming. In the Deep, you didn't *feel* things; you *knew* them. Here, everything was an assault. Friction. Temperature. Gravity. It was exhausting.

  "I'm just... grounding," Eris said.

  "You're hoarding," Kael corrected, the word dropping like a stone.

  It was the accusation Eris had been waiting for. *Hoarding.* In the Deep, consciousness was a shared stream. You thought, and the network rippled. To keep a thought to yourself was selfish; to keep a *sensation* to yourself was pathological. But here, in the lonely silence of the Wake, sensations were the only thing you owned. The warmth of the nutrient block. The ache in the lower back from sitting too long. The quiet hum of the refrigerator.

  Eris loved it.

  They loved the way the silence didn't ask anything of them. In the Deep, you were never alone. There was always the hum of the other million Divers, the pressure of the consensus, the expectation to weave, to contribute, to merge. But here? Here, Eris was a single, discrete point. A closed loop.

  "I'm not hoarding," Eris said. "I'm just tired. It takes time to... disengage."

  "It takes time if you're resisting," Kael said softly. "Look, I'm not going to file a report. Not yet. But you're getting pale. Your eyes are red. You look *biological*."

  The slur hung in the air. *Biological.* It meant messy. Unpredictable. Mortal.

  "I know," Eris said. "I'm heading to the Pods soon."

  "Good." Kael stood up. "Don't let the Silence get in your head. You know what happens when you stay Up too long. You start thinking you're real."

  Eris didn't answer.

  Kael paused at the door. "Oh, and Eris? Drop well tonight. Don't just drift. Actually *Drop*."

  "I will."

  Kael left. The door hissed shut, sealing the Station again.

  Eris sat alone. The silence rushed back in, heavy and sweet. They closed their eyes, but they didn't Drop. They listened to the hum of the refrigerator. They felt the pulse in their wrist, a slow, rhythmic thump that belonged to no one but them.

  In the Deep, if you were hurt, the network soothed you. If you were happy, the network amplified it until it wasn't yours anymore. But pain here? Pain was private. Grief was private.

  Eris reached into their pocket and pulled out a small, crumpled piece of paper. It was a receipt from a shop they shouldn't have visited. A stationery store. They had bought a pen. An actual, ink-filled pen.

  In the Deep, you didn't write. You manifested. You intended a shape, and it appeared. To use a pen was to admit that your will was not enough. To use a pen was to admit you were separate from the world, that you had to mark it physically to change it.

  Eris uncapped the pen. The smell of the ink was sharp, chemical.

  They turned the receipt over. In the Deep, their name was a frequency, a shimmering tag attached to their consciousness. Here, they had a name that could be written.

  *Eris.*

  They watched the ink soak into the paper fibers. It dried slowly. It was permanent.

  A alarm chimed on the wall. *Shift Change.* The sound of footsteps began to echo in the hallway outside. The Divers were coming. The ones who treated the body like a rental car they had to refuel before returning to the garage. They would come in, ingest their blocks, mock the "Anchored," and rush back to the Pods to plug in. To become real.

  Eris looked at the word on the paper. *Eris.*

  It looked small. Fragile.

  The door handle turned. Eris quickly shoved the paper and pen into their pocket. They stood up, smoothing their clothes. They closed their eyes and tried to summon the hum of the Deep, the comforting pressure of the million other minds waiting to swallow them whole.

  But the silence of the room was louder.

  "Eris?"

  It was Kael again. They had come back.

  Eris turned. "I'm going. Just... tying my shoe."

  Kael looked at Eris's feet. They were wearing slip-ons.

  "You're trembling," Kael said.

  "It's the caffeine. In the block."

  Kael stepped closer. They reached out and touched Eris's forearm. The touch was warm, human. In the Deep, touch was a simulation, perfectly calibrated. This was messy. Imperfect.

  "You're warm," Kael whispered. "You're running hot."

  "I'm fine."

  "You're not fine. You're... distinct." Kael pulled their hand back as if burned. "Why do you feel so distinct?"

  Eris knew then that they couldn't pass. You couldn't hide the fact that you were awake when your eyes were this bright. When you moved with this much friction.

  "I like it here," Eris said.

  The words hung in the air, shocking and obscene. *I like it here.* In the Surface. In the Maintenance Hours.

  Kael took a step back. "That's the sickness talking. The isolation. It makes you think you're... individual."

  "Maybe I am."

  "Don't say that." Kael's voice shook. "You know what happens to Individuals. They drift. They decay. They die."

  "We all die, Kael. Even in the Deep."

  "Not like this." Kael gestured at the room, at the concrete, at the physical weight of the world. "Not alone."

  Eris looked at the door. The footsteps were getting louder. The herd was coming. They would sweep Eris up, guide them to the Pods, strap them in, and inject the sedative that would open the gate. They would save Eris from the horror of being a single, lonely self.

  Eris put their hand in their pocket and gripped the pen. The metal was cold. Solid.

  "I'm not ready to Drop," Eris said.

  "You don't have a choice."

  "I do." Eris stepped toward the window. It was a thick pane of reinforced glass, looking out onto the street. It was night. The city was dark, save for the streetlights. No one was out there. No one in their right mind would be out there.

  "Eris, step away from the glass."

  "I just want to see it," Eris said. "Without the overlay. Without the tags. Just the light."

  "That's just photons hitting your retina. It's data. It's not *truth*."

  "It's mine," Eris said.

  Kael lunged.

  Eris sidestepped. They weren't fast—the body was slow, clumsy—but Kael was hesitant. Kael didn't want to touch them. To touch an Anchored one was to risk getting dragged down into the gravity of their solitude.

  Eris reached the door. They pushed it open.

  The hallway was filled with Divers. They stood in clusters, their eyes glazed, already half-gone, waiting for the all-clear to return to the Pods. They turned as one to look at Eris.

  Hundreds of eyes. A hive.

  Eris stood in the doorway, small and physical and trembling.

  "Look at them," Eris said, their voice cracking. "They're not even here. They're waiting to leave."

  "Go back to your Pod, Eris," someone called out. "Stop making a scene."

  "I'm not making a scene," Eris said. "I'm waking up."

  A murmur went through the crowd. Not of anger. Of pity. The kind of pity you show a child who thinks the moon follows them home.

  Kael came up behind Eris. "Come on. Let's get you sedated. You'll feel better when you're merged."

  Eris looked at the pen in their hand. They had taken it out of their pocket without realizing.

  "What is that?" Kael asked.

  "A tool," Eris said.

  "For what?"

  "To mark things." Eris looked at the wall. White, sterile, endless. "To say I was here."

  "You were here," Kael said gently. "We know. We track the bio-signs."

  "No," Eris said. "Not *me*. Just the body."

  Eris pressed the pen to the wall. The ink flowed. A black line against the white. It didn't shimmer. It didn't ripple. It just stayed.

  The crowd gasped. It was vandalism. It was permanent. It was *real*.

  Eris drew a circle. Then a line through it. A simple symbol. A signature.

  "There," Eris said. "Now it's mine."

  Kael sighed, a sound of infinite weariness. "Security will be here in a minute. They'll wipe it. And they'll wipe you."

  "I know."

  "Why?" Kael asked. "Why fight to be... separate? It's so heavy."

  Eris looked at the mark on the wall. It was imperfect. The line wavered. It was beautiful.

  "Because," Eris said. "If I'm not separate, who is it that dies?"

  Kael had no answer for that.

  The security drones buzzed down the hall, red lights pulsing. The Divers parted to let them through. They moved like water, fluid and collective.

  Eris didn't run. They just stood by their mark, hand resting on the wall, feeling the cold vibration of the building, the pulse in their wrist, the slow, heavy drag of gravity.

  They closed their eyes, but they didn't Drop. They stayed in the silence. They stayed in the pain. They stayed in the dark, lonely, wonderful truth of the Surface.

  "Goodnight, Eris," Kael whispered.

  Eris smiled.

  "Good morning," they said.
