answer: |-
  ### Session Plan: The Intentional Stance & LLM Beliefs
  **Time:** 45 Minutes
  **Tools:** Whiteboard
  **Audience:** Rationalist-adjacent, AI-literate, Dennett-naive.

  ---

  ### 1. The Sequence (Order & Dependencies)

  You cannot start with the LLM. If you start with "Do LLMs have beliefs?", the group's technical knowledge (transformers, weights, next-token prediction) will act as an immune system, rejecting the premise before you've established the tool. You must establish the *utility of the tool* before applying it to the *contested object*.

  **Phase 1: The Predictive Hierarchy (10 mins)**
  *   **Concept:** Define the three stances not as metaphysical categories, but as **compression algorithms for prediction**.
  *   **Whiteboard:** Draw three horizontal layers.
      1.  **Physical:** Predict via laws of physics/substrate. (High fidelity, computationally intractable).
      2.  **Design:** Predict via function/architecture. (Medium fidelity, requires blueprints).
      3.  **Intentional:** Predict via beliefs/desires. (High abstraction, requires assuming rationality).
  *   **Dependency:** You must establish that we *already* use all three stances on everyday objects (thermostats, computers, humans) before asking them to apply it to an LLM. If they don't accept the stance for a thermostat, they won't accept it for a transformer.

  **Phase 2: The Core Case — The "Hallucinating Travel Agent" (15 mins)**
  *   **Concept:** Apply all three stances to a single, specific LLM interaction.
  *   **Scenario:** An LLM is prompted to book a flight. It outputs a flight number that does not exist.
  *   **Application:**
      *   *Physical:* Electrons moving in GPUs. (Useless for booking).
      *   *Design:* Next-token prediction on training data containing flight formats. (Explains the format, not the error).
      *   *Intentional:* The model *believed* the flight existed and *wanted* to satisfy the user. (Explains the error as a false belief).
  *   **Dependency:** This depends on Phase 1. They must see the Intentional Stance as a legitimate predictive layer before they can tolerate it on an AI.

  **Phase 3: The Objections & Cash Value (15 mins)**
  *   **Concept:** Address the "Realness" and "Mechanism" objections.
  *   **Dependency:** This depends on Phase 2. You can only defend the utility of the stance after they've seen it solve a specific prediction problem (the hallucination).

  **Phase 4: Diagnostic Close (5 mins)**
  *   **Concept:** Test for pragmatic understanding.

  ---

  ### 2. The Core Example: The Hallucinating Travel Agent

  **Do not use a Chess Engine.**
  *   **Why:** For your audience, chess engines are "solved." They know AlphaZero is a search tree + value head. Attributing "belief" to a chess engine feels like a metaphor because the *Design Stance* (search algorithm) is so accessible and predictive. It doesn't force the Intentional Stance.
  *   **Why the Travel Agent works:**
      1.  **False Belief:** Chess engines rarely "hallucinate" legal moves; they calculate them. LLMs confidently assert falsehoods. The Intentional Stance is most powerful when explaining *error*. A thermostat that breaks is just broken; an agent that breaks has a *false belief*.
      2.  **Semantic Territory:** Your group knows "The Map is Not the Territory." An LLM hallucinating a flight is a map/territory mismatch. This leverages their existing framework better than chess tactics.
      3.  **Alignment Relevance:** This isn't about winning a game; it's about delegation. If you delegate a task, you need to know if the delegate *knows* what it's doing.

  **How to run it on the Whiteboard:**
  Write the prompt: *"Book me a flight from SFO to JFK for tomorrow."*
  Write the output: *"Flight UA123 departs 10 AM."* (Fact: Flight does not exist).
  Ask the group: *"Why did it output UA123?"*
  *   If they say "Probability distribution," push them: *"That's the mechanism. What's the prediction strategy?"*
  *   Guide them to see that treating it as "It thinks UA123 exists" predicts future behavior (it will defend UA123 if challenged) better than "It sampled token 445."

  ---

  ### 3. Anticipated Misconceptions & Interception Points

  **Misconception A: "But it's just next-token prediction / matrix multiplication."**
  *   **The Trap:** They will conflate the *Physical/Design Stance* with the *Truth*. They will argue that because the substrate is math, the intentional description is a lie.
  *   **Where to Head It Off:** **Phase 2 (during the Core Case).**
  *   **The Move:** When they raise this, point to the "Physical" layer on your whiteboard. Say: *"Humans are just neuron firing and electrochemistry. Does that mean saying 'John believes it's raining' is false? Or does it just mean we've switched to the Physical Stance?"*
  *   **The Pivot:** Remind them that the Intentional Stance is substrate-independent. If the predictive power is higher at the belief level, the substrate doesn't invalidate the stance.

  **Misconception B: "If this is just a predictive strategy, you aren't saying anything about whether the beliefs are REAL. What's the cash value?"**
  *   **The Trap:** They will treat "pragmatic" as "fake." They want an ontological fact of the matter.
  *   **Where to Head It Off:** **Phase 3 (The Cash Value discussion).**
  *   **The Move:** Frame "Real" as "Pattern Real." A center of gravity is real because it's a useful predictor of physics, even though you can't touch it.
  *   **The Alignment Hook:** *"The cash value is safety. If you treat the LLM as just math, you look for weight anomalies. If you treat it as having beliefs, you look for deception, goal preservation, and self-knowledge. Which audit catches the risk?"* This forces them to see the stance as an operational necessity, not a philosophical hobby.

  ---

  ### 4. The Final Diagnostic Question

  Do not ask: *"What is the intentional stance?"* (Tests memory).
  Do not ask: *"Do LLMs have beliefs?"* (Invites metaphysical debate).

  **Ask this instead:**

  > **"Imagine we find a way to predict the LLM's hallucinations perfectly by analyzing its weights (Design Stance), without assuming it has any beliefs. Do we still have a reason to adopt the Intentional Stance? Why or why not?"**

  **What to listen for:**
  *   **Failure (Metaphysical View):** They say "No, because then we know the beliefs aren't real." (They missed the point that the stance is about *us*, not the *system*).
  *   **Failure (Eliminativist View):** They say "No, the Design Stance is always superior." (They missed the point about computational tractability and interface).
  *   **Success (Pragmatic View):** They say "Yes, because the Intentional Stance might be more *compressible* for humans," or "Yes, because we need to interface with it using language, which is an intentional medium," or "It depends on the cost of computation."
  *   **Key Indicator:** If they recognize that the "Truth" of the belief is irrelevant compared to the **cost/benefit of the prediction strategy**, they have understood Dennett.
