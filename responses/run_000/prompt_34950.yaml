answer: |-
  This is the right frustration to have. The field has shifted in the last five years from treating "Pascal's Mugging" as a quirky counterexample to recognizing it as a structural feature of any unbounded, linear aggregation rule applied to open-ended possibility spaces. The Beckstead & Thomas (2021) impossibility result is the watershed moment here: they showed that fanaticism isn't just a bug of specific utility functions; it follows from very weak, plausible axioms (Transitivity, Separability, and Anteriority).

  If you are a formalist with three years, you should not be writing a dissertation that proposes a specific bounded utility function and hopes no one notices the dominance violations. You need to be working on the *structure* of the escape routes.

  Here is the defended agenda I would recommend, ranked by upstream importance and tractability.

  ### 1. The Axiomatic Cost of Non-Fanaticism (Upstream)
  **The Question:** *Which axiom in the Beckstead-Thomas trilemma is the least costly to drop, and can we characterize the resulting decision theory?*

  **Reasoning:** This is the most upstream question in the cluster. Beckstead & Thomas essentially proved that you cannot have Transitivity, Separability (state-wise), and Non-Fanaticism all at once. Most existing "solutions" just assert one is dropped without fully mapping the consequences.
  *   **Dropping Transitivity:** Leads to money pumps and cycles. Generally viewed as fatal, but some (e.g., tenability of cyclic preferences under vagueness) is under-explored.
  *   **Dropping Separability:** Leads to context-dependence where the value of an outcome depends on what *could* have happened in other states. This violates standard dominance principles.
  *   **Dropping Anteriority (ex-ante neutrality):** Implies that the timing of uncertainty resolution matters for value, which clashes with standard reduction of compound lotteries.

  **Tractability:** High for a formalist. This is pure proof work. You don't need data; you need to construct models that satisfy two of the three axioms and rigorously demonstrate the behavioral implications of the third's absence.
  **Why Prioritize:** If you don't settle which axiom you are violating, you don't have a theory; you have a heuristic. A dissertation that provides a *characterization theorem* for a specific non-fanatical view (e.g., "Here is exactly what decision rules look like if we keep Transitivity but drop Separability") would be a major contribution.
  **Shift Factors:** This moves *up* if new impossibility results tighten the trilemma (making escape harder). It moves *down* if the consensus shifts to viewing fanaticism as an epistemic error rather than a decision-theoretic one (see "Confusion" below).

  ### 2. Diachronic Stability of Threshold/Non-Archimedean Views (Viability)
  **The Question:** *Can an agent who ignores probabilities below a threshold (or uses lexicographic probabilities) maintain dynamic consistency without being Dutch-booked or facing strategic paralysis?*

  **Reasoning:** The most intuitive fix is a probability threshold (ignore $p < 10^{-30}$) or a non-Archimedean view (some goods are lexically superior). The problem is time. If I ignore a tiny probability today, but face a sequence of bets where that probability accumulates, or if I can pay to avoid facing the bet later, do I undermine my own agency?
  Recent work (e.g., by Russell and others) suggests that many anti-fanatical views are diachronically unstable. You might plan to ignore the mugger today, but Future You, upon updating, might regret that policy.
  **Tractability:** Medium-High. This requires modeling dynamic choice trees and information sets. It is well-suited to a formalist. The challenge is defining a "reasonable" updating rule for threshold views, as standard Bayesian conditionalization often breaks thresholds.
  **Why Prioritize:** Even if you solve the static axioms (Question 1), the theory is useless if it cannot guide a temporally extended agent. This tests the *viability* of the solutions proposed in Q1.
  **Shift Factors:** Moves *up* if longtermist planning becomes more concrete (requiring multi-period models). Moves *down* if the field accepts that rational agents must be "resolute" choosers (accepting dynamic inconsistency as a cost of avoiding fanaticism).

  ### 3. Background Uncertainty and Stochastic Dominance (Technical Escape Hatch)
  **The Question:** *Does sufficiently rich background uncertainty render fanaticism rationally impermissible via Stochastic Dominance, without requiring arbitrary bounds?*

  **Reasoning:** This is the most promising *positive* technical avenue. The argument (championed by Smith, Wilkinson, and others) is that if you have independent background uncertainty with heavy tails, the marginal contribution of a "Pascal's Mugging" bet is washed out, and standard expected utility maximization (constrained by stochastic dominance) might rule out the fanatical option.
  Instead of changing the decision rule (like Q1 & Q2), you change the description of the decision problem to reflect realistic uncertainty.
  **Tractability:** High. This is analysis and probability theory. You are looking for conditions on background distributions $B$ such that $E[U(A+B)]$ behaves well even if $U$ is unbounded.
  **Why Prioritize:** It offers a way to keep Expected Utility Theory (the gold standard) while avoiding the conclusion. If this works, it dissolves the need to break axioms (Q1) or accept dynamic inconsistency (Q2).
  **Shift Factors:** Moves *up* if you can prove robustness across a wider class of distributions. Moves *down* if it is shown that for *astronomical* stakes (e.g., $10^{100}$), no realistic background uncertainty is sufficient to swamp the payoff.

  ---

  ### What is Overrated?
  1.  **Simple Bounded Utility Functions:** Proposing a specific bounded function (e.g., logarithmic) is low-value unless you address the **Beckstead-Thomas dominance objection**. Simply saying "utility is bounded" ignores the fact that to avoid fanaticism, the bound must be low enough to violate state-wise dominance in plausible cases. Proving *that* violation is inevitable is more valuable than proposing another bound.
  2.  **Risk-Weighted Expected Utility (RWU) as a Panacea:** Buchak's RWU is often cited as a solution to fanaticism. However, recent work suggests RWU can still be fanatical if the risk-weighting function isn't carefully constrained, or it introduces other pathologies (like violating sure-thing principles in non-fanatical contexts). A dissertation that rigorously maps the *limits* of RWU in this domain would be more useful than one applying it uncritically.
  3.  **Epistemic "Complexity Penalties" as Decision Theory:** Many argue we should just assign low probability to complex hypotheses (Solomonoff induction). While true, this is an *epistemological* claim. A decision theory dissertation that relies on "the probabilities will work it out" is kicking the can. Unless you are formalizing the penalty *within* the decision rule, this is outside your scope.

  ### Where the Field is Confused
  The field is currently split on whether this is a **Decision-Theoretic** problem or an **Axiological** problem.
  *   **DT View:** The aggregation rule (Expected Utility) is broken.
  *   **Axiology View:** The value function (Total Utilitarianism) is broken. If we adopt a different axiology (e.g., Critical Level Utilitarianism or Person-Affecting Views), the astronomical payoffs disappear, and EUT works fine.

  **Strategic Advice:**
  If you tackle the **Axiomatic Cost (Q1)**, you are betting that the problem is in Decision Theory. If you tackle **Background Uncertainty (Q3)**, you are betting that EUT is fine but our models of the world are too clean.

  **My Recommendation:**
  Prioritize **Q1 (Axiomatic Cost)** as your core chapter, because it frames the entire debate. Use **Q3 (Background Uncertainty)** as your "positive result" chapter to show you aren't just a nihilist about EUT.

  If you can produce a characterization theorem showing exactly what kind of dominance violations are *necessary* to avoid fanaticism, you will have done more for the field than proposing yet another "fix" that sweeps the costs under the rug. The field doesn't need more solutions; it needs a clearer map of the costs of the solutions we have.
