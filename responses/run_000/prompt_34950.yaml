prompt: |-
  I'm a PhD student in decision theory, and I keep running into the same wall: as soon as expected utility gets applied to anything high-stakes or longtermist, some tiny probability of an astronomically large payoff swamps every ordinary option, and the theory seems to tell you to chase it. I know the standard moves—bounded utility, threshold views that ignore sufficiently small probabilities, saying it's just Pascal's mugging and not worth taking seriously. What I'm less sure about is what's actually still open in this cluster, and I need to pick a disseration focus.

  If you were advising me, what are the main open questions about expected value fanaticism right now, and which two or three would you actually prioritize for someone with three years and a formal decision theory background but no empirical lab? I want the reasoning more than the list. For each question, say whether it's upstream of the others—would settling it change how the rest gets framed—and how tractable it is with the tools I have. Also say what would push it up or down in your ranking over the next couple of years, and which questions in this area are overated in the sense that their answers wouldn't change much downstream. I'm not after a survey or a reading list; I want a defended agenda, and I'd rather you say where the field is just confused than hand me a tidy taxonomy.
