answer: |-
  # Workshop Q&A Prep Sheet: Defending Williams's Integrity Objection

  **Talk Context:** Defense of the "One Thought Too Many" argument as a structural critique of practical deliberation, not merely a plea for agent-relative reasons.
  **Time Limit for Replies:** ~2 minutes per answer.

  ---

  ### 1. The "Sophisticated Consequentialist" Move (Criterion vs. Procedure)
  **Likely Raised By:** The Railton/Sophisticated Consequentialist.
  **The Objection:** "You're attacking a straw man. No serious consequentialist thinks we should calculate utility *in the moment* of saving a spouse. Railton's 'lucid consequentialist' adopts direct motives (love, loyalty) as the best *decision procedure* to achieve the *criterion of rightness*. The 'step back' happens at the level of character cultivation, not the moment of action. So the alienation you describe is empirically false."

  **Your Reply:**
  "This is the standard Railton reply, but it misses the structural point. Even if the consequentialist doesn't calculate *in the moment*, the *justificatory structure* of their commitment remains contingent on the impartial view. I love my spouse *because* doing so generally optimizes value. If the impartial calculus shifted—if saving my spouse no longer aligned with the optimal decision procedure—I would have to abandon the commitment. The alienation isn't about cognitive load during the rescue; it's that the commitment is held on probation. The 'one thought too many' isn't a calculation; it's the background condition that my ground projects are only permissible insofar as they survive an impartial audit. That conditional status is what severs the agent from the project, regardless of whether they are consciously calculating."

  **Weakest Link:** You need to be careful not to imply that consequentialists *must* be consciously thinking about utility. Focus entirely on the *conditional nature* of the commitment, not the conscious thought process.

  ### 2. The "Constitutive Reflection" Objection
  **Likely Raised By:** The Korsgaardian Kantian.
  **The Objection:** "Williams treats reflection as an intrusion, but for Kantians, reflection is constitutive of agency. To act on a commitment without the capacity to step back and endorse it is to act on an impulse, not a reason. Integrity isn't about blind loyalty; it's about owning your motives. Doesn't your view reduce the agent to a bundle of unexamined desires? How is that integrity and not just stubbornness?"

  **Your Reply:**
  "Williams isn't advocating for unreflective impulse. The distinction is between reflecting on *how* to live out a commitment versus reflecting on *whether* the commitment is permitted by an external standard. I can reflect deeply on my marriage—what it means, how to sustain it—without asking, 'Is this marriage justified by the universe's impartial standpoint?' The Korsgaardian view assumes that normative force *only* comes from that step back. Williams is challenging that assumption. He's saying the normative force comes from the project itself. To demand the 'step back' for validation is to misunderstand where the reason lives. It lives in the relationship, not in the endorsement of the relationship."

  **Weakest Link:** Distinguishing "good reflection" (internal) from "bad reflection" (impartial) without smuggling in a criterion for what counts as "internal."

  ### 3. The "Nazi's Integrity" Problem
  **Likely Raised By:** The Agnostics or the Act-Utilitarian.
  **The Objection:** "If integrity is grounded in ground projects that resist impartial validation, how do you criticize the Nazi who says sacrificing others is essential to his integrity? If the problem is the *structure* of validation, aren't you shielding immoral projects from critique? It seems your defense of Williams collapses into a form of relativism or egoism."

  **Your Reply:**
  "Williams isn't saying integrity is the *only* value, or that it trumps all moral constraints. He is making a point about the *limits* of morality's demand. We can criticize the Nazi on many grounds—harm, injustice, rights—without invoking the specific utilitarian structure Williams attacks. The Integrity Objection isn't a 'get out of jail free' card for immorality; it's a limit on what morality can demand *of the agent* without destroying the agent. The Nazi case conflates 'integrity' with 'consistency.' Williams is talking about ground projects that give life meaning, not mere consistency in evil. We can condemn the Nazi without demanding he validate his existence impartially."

  **Weakest Link:** Walking the line between "morality has limits" and "anything goes." If you concede too much to moral criticism, you risk reintroducing the impartial standpoint you just rejected.

  ### 4. The "Virtue Ethics" Co-opt
  **Likely Raised By:** The Virtue Ethicist.
  **The Objection:** "This sounds like you're just describing *phronesis*. The virtuous agent doesn't deliberate impartially; they see what the situation requires through their character. Why frame this as a defense of Williams rather than just admitting that Virtue Ethics handles deliberation better? Why stick with the Williamsian 'negative' point instead of a positive account of character?"

  **Your Reply:**
  "Because the diagnostic power of Williams is specific to the modern moral philosophy landscape. Virtue Ethics offers an alternative system, but my goal is to show why the dominant *system* (consequentialism/Kantianism) fails on its own terms regarding the agent's psychology. Williams isn't building a system; he's exposing a cost. If I pivot to positive Virtue Ethics, I lose the critical edge against the consequentialist claim that they can accommodate integrity. I want to force the consequentialist to admit the cost, not just change the subject to Aristotle."

  **Weakest Link:** The audience might feel you are being unnecessarily negative. If Virtue Ethics solves the problem, why labor over Williams's corpse?

  ### 5. The "Normative Force" Challenge
  **Likely Raised By:** The Orthodox Kantian or Agnostic.
  **The Objection:** "Even if you're right that impartial validation is alienating, why should we care? Morality *is* demanding. If integrity conflicts with the moral truth, why doesn't morality win? You've described a psychological cost, but you haven't shown why that cost has *normative weight*."

  **Your Reply:**
  "Because a morality that systematically destroys the agent's capacity to act is self-defeating. If the moral theory requires me to abandon the motivations that make me a distinct person, it has no grip on me. It's not just a psychological cost; it's a category error. Morality is supposed to guide agents, not replace them. If the 'truth' of morality requires the dissolution of the agent, it's not a practical truth. The normative weight comes from the necessity of having a 'self' to be moral in the first place."

  **Weakest Link:** This borders on a pragmatic argument rather than a moral one. A hardline moral realist will simply say, "Truth is truth, even if it destroys you."

  ---

  ### The Dreaded Question (Hope Nobody Asks)
  **The Question:** "If the problem is the *structure* of reflective validation, isn't your talk right now performing the very act you condemn? You are asking us to step back and reflect on our deliberative structure to validate your claim that we shouldn't step back. Isn't this a performative contradiction? If Williams is right, shouldn't we not be having this conversation?"

  **Why It's Dreaded:** It attacks the *method* of your defense. If successful, it suggests your position is self-effacing to the point of incoherence. You cannot argue for anti-reflection reflectively without undermining the argument's authority.

  **Emergency Reply:** "Williams isn't banning reflection; he's banning it as a *condition of justification*. I am reflecting *about* ethics, which is philosophy. Williams is talking about living *within* ethics. The distinction is between the philosophical standpoint (which is necessarily reflective) and the practical standpoint (where we live our lives). I'm using reflection to show the limits of reflection in practice." (Risky, but it's the only out).

  ***

