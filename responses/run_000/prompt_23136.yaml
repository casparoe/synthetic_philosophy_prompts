          *   *Funded:* 90% chance each $\neq$ 90% chance all. It's like rolling dice. Even with loaded dice, rolling 40 successes in a row is unlikely. This is the **Preface Paradox** (I believe every sentence in my book, but I know there's a typo somewhere).
          *   *Rejected:* We say "No" to 174 people, implying they won't succeed. But statistically, some will. This is the **Lottery Paradox** (I believe every ticket will lose, but I know one must win).
          *   *Why it matters:* We are a public trust. Our annual report is a historical record. We shouldn't sign statements we know are false.
