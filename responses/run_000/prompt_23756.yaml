  The air in the seminar room was stale, recycled through vents that hummed with the same monotonous drone as the projector fan. Sterling, a philosopher of mind whose skepticism was matched only by his fondness for triple-breasted suits, leaned back in his chair. He had been waiting for this moment all hour.

  "The textual inconsistency is glaring," Sterling said, tapping his pen against his copy of the *Zhuangzi*. "In the Butterfly Dream, Zhuangzi claims radical epistemic uncertainty. He doesn't know if he's a man or an insect. But in the Tub episode, he speaks with absolute dogmatic certainty about the mechanics of *qi*. He tells Huizi exactly where his wife went—the great clod, the four seasons, the dispersion of energy. You can't be a radical skeptic about life and a cosmic meteorologist about death at the same time. It's convenient, but it's not coherent."

  A few heads nodded. It was the standard Western objection: that Zhuangzi's mysticism was just a cover for logical sloppiness.

  Evan, however, didn't reach for his notes. He smiled, the way one does when a student finally asks the question that allows the lesson to begin.

  "It's only incoherent if you assume Zhuangzi is the constant in the equation," Evan said.

  Sterling blinked. "He's the author. Of course he's the constant."

  "In the text, yes. In the *transformation of things*? No," Evan replied. He stood up and walked to the front of the room, resting his hand on the lectern as if it were the rim of a wooden tub. "If Zhuangzi can wake up and not know if he's a man who dreamed of a butterfly, he can sit by a coffin and not know if he's a widower mourning a wife, or a wife dreaming she was a widower. The *qi* doesn't lie, Sterling. But the identity does."

  Evan paused, letting the silence stretch just long enough to make the room uncomfortable.

  "He isn't drumming on that tub to show he accepts her death," Evan said softly. "He's drumming to see if he's the one who's dead."

  For a second, nobody moved. Then, a graduate student in the back row let out a sharp, involuntary laugh, which was immediately stifled. Sterling opened his mouth, closed it, and then, despite himself, smiled. It wasn't a smile of agreement, but of surrender; the logic was absurd, textually faithful, and impossible to refute without accepting the premise that he was currently a dream in a dead woman's head. The tension in the room broke, not into applause, but into the rustling of pages turning, as if everyone suddenly needed to check which side of the dream they were on.
