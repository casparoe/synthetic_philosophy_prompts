  # JOINT STATEMENT ON THE SIDE-EFFECT EFFECT (KNOBE EFFECT)
  **Date:** October 26, 2023
  **Signatories:** The Conceptual Working Group & The Deflationary Working Group

  ## 1. Agreed-Upon Claims
  Both camps accept the following claims as established constraints on any adequate theory of the Side-Effect Effect. These claims are intended to rule out trivial explanations and define the phenomenon without presupposing its cause.

  1.  **Robustness of the Asymmetry:** In standard vignette designs (e.g., the Chairman case), the asymmetry in intentionality judgments (Harm > Help) is statistically robust, replicable across large samples, and persists despite minor variations in wording.
  2.  **Identity of Mental States:** In the standard design, the agent's epistemic state (foreknowledge), volitional state (lack of desire for the side effect as an end), and causal role are held constant across the Help and Harm conditions. The only systematic variation is the normative valence of the side effect.
  3.  **Not Solely Attributions of Blame:** While intentionality judgments correlate with blame/praise judgments, the asymmetry persists in conditions where explicit blame/praise ratings are controlled for or collected separately. The effect is not *reducible* to a direct question about blame, though it may be related.
  4.  **Normative Sensitivity:** The effect is sensitive to normative valence, not merely emotional valence. Asymmetries appear (though sometimes with reduced magnitude) in cases involving violations of etiquette, rules, or conventions, not solely in cases involving moral harm.
  5.  **Constraint on Classical Analysis:** Any adequate account must explain why the classical analysis of intentional action (belief, desire, causation, skill) fails to predict the asymmetry in these specific side-effect cases, while typically succeeding in main-effect cases.
  6.  **Constraint on Performance Error:** Any adequate account must explain why the asymmetry does not behave like a standard performance error (e.g., it does not vanish under simple cognitive load or time pressure in all studies, nor is it eliminated by defining terms for subjects).

  ## 2. Statement of Residual Disagreement
  The parties agree on the existence and constraints of the phenomenon but disagree on its locus within the cognitive architecture of folk psychology.

  **The Conceptual Position:**
  The normative evaluation of the side effect is a **constitutive input** to the cognitive process that determines the extension of the concept *INTENTIONAL*. The folk concept is not purely descriptive; it is inherently normative. Therefore, two agents with identical descriptive mental states (belief, desire, etc.) can differ in whether they acted intentionally solely based on the normative status of the outcome. The asymmetry reveals the *competence* conditions of the concept.

  **The Deflationary Position:**
  The normative evaluation of the side effect is an **extraneous influence** on the application of the concept *INTENTIONAL*. The folk concept is purely descriptive (aligned with the classical analysis). The asymmetry arises from performance factors, such as pragmatic implicatures, conversational norms, or a desire to assign blame/praise that biases the reporting of the concept without altering its semantic content. The asymmetry reveals *performance* conditions, not the concept's structure.

  ## 3. Disagreements Table (Cruxes and Adjudication)
  The following table identifies specific empirical or argumentative cruxes. Settling these would significantly shift the credence of at least one side. Both sides agree to the proposed tests and pre-register the predictions below.

  | Crux | Question | Proposed Test / Manipulation | Conceptual Prediction | Deflationary Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Moral Specificity Crux** | Is the effect driven by *normativity* generally or *moral blame* specifically? | **The Etiquette/Convention Vignette:** A variant where the side effect violates a trivial rule (e.g., wearing the wrong color tie to a club) or aids a convention, with zero moral weight. | The asymmetry will persist with similar magnitude. The concept tracks normative deviation, not just moral harm. | The asymmetry will vanish or be significantly weaker. The effect is driven by the urge to blame/praise morally, not by abstract normativity. |
  | **2. The Pragmatic Blocking Crux** | Is the effect driven by conversational implicature (e.g., "Why ask unless it matters for blame?")? | **The Explicit Instruction Manipulation:** Subjects are explicitly told: "Ignore whether the action was good or bad. We only care if it fit his plan." + Use of "literal" phrasing. | The asymmetry will persist. Normative input is automatic and cannot be turned off by instruction. | The asymmetry will vanish. Once the pragmatic pressure to assign blame is removed, subjects revert to the descriptive concept. |
  | **3. The Expert Reflection Crux** | Is the effect a stable feature of folk psychology or a confusion corrected by reflection? | **The Deliberation Condition:** Subjects must write a justification for their rating before rating, or the sample is restricted to participants with training in logic/semantics. | The asymmetry will remain stable. Reflective equilibrium supports the normative sensitivity. | The asymmetry will decrease. Reflection allows subjects to override the initial bias and apply the descriptive criteria correctly. |
  | **4. The "Very Intentional" Crux** | Does the effect apply to gradable modifiers if the concept is binary? | **The Gradient Measure:** Instead of "Did he do it intentionally?" (Yes/No), use "How intentionally did he do it?" (1-7 scale). | Ratings will be significantly higher in Harm than Help. The normative weight scales with intentionality. | Ratings will cluster at the extremes (1 or 7) based on blame, but the *mean* difference is an artifact of forcing a gradient on a binary concept. (Specific prediction: Variance will be higher in Help, suggesting uncertainty). |

  ## 4. Note on Verbal Dispute
  A portion of this dispute is verbal, but not merely so.

  **The Verbal Component:**
  The term "concept" is used differently. Conceptualists often use "concept" to refer to the *total set of cognitive inputs* required to generate a judgment in real time. Deflationists often use "concept" to refer to the *semantic content* or *truth conditions* of the term, abstracted from psychological processing. If the dispute were solely about the definition of "concept," it could be dissolved by distinguishing *semantic content* from *application criteria*.

  **The Substantive Component:**
  The dispute is not merely verbal because the two positions posit different cognitive architectures with distinct empirical predictions (as outlined in Section 3).
  *   If the Conceptualists are right, teaching a robot or an alien the folk concept of "intentional" requires teaching them human normative values.
  *   If the Deflationists are right, a robot could learn the descriptive criteria for "intentional" perfectly but still fail to mimic human judgments unless programmed with a separate "blame module" that biases the output.

  Because these architectures generate different predictions regarding cross-cultural variance, neural correlates, and stability under pragmatic blocking, the dispute is empirically adjudicable. The parties agree that resolving the verbal ambiguity will not solve the problem, but clarifying it prevents talking past one another during the adjudication process.
