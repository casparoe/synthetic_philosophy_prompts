answer: |-
  The stalemate over the Kelly criterion is not merely a verbal dispute, nor is it purely a substantive disagreement about risk preferences. It is best diagnosed as a **category error regarding the domain of applicability (asymptotic vs. finite)** that masks a deeper **substantive disagreement about the definition of rationality (time-averages vs. ensemble-averages).**

  The two sides are largely talking past each other because they are optimizing for different mathematical objects while using the same vocabulary ("optimal," "rational," "ruin"). However, beneath this verbal confusion lies a genuine normative conflict: whether rationality requires maximizing the growth rate of a single trajectory through time (the Kelly view) or maximizing the expected utility across a distribution of possible worlds (the Expected Utility Theory view).

  ### 1. Diagnosis: Talking Past Each Other on Time Horizons

  The primary source of the impasse is that the Pro-Kelly and Anti-Kelly camps are answering different questions regarding the **time horizon**.

  **The Pro-Kelly Move: Asymptotic Dominance**
  Proponents (J.L. Kelly, Edward Thorp, Leo Breiman) rely on limit theorems. Their central argument is that as the number of bets $N \to \infty$, the strategy maximizing the expected logarithm of wealth ($E[\log W]$) will almost surely outperform any other strategy. They define "ruin" as wealth approaching zero and argue that any strategy betting more than Kelly risks ruin, while any strategy betting less sacrifices growth that cannot be recovered.
  *   **The Implication:** Rationality is defined dynamically. If you survive long enough, Kelly wins. Therefore, to be rational over a "long" sequence, you must bet Kelly.
  *   **The Blind Spot:** "Almost surely" in the limit does not guarantee higher expected utility for any *finite* $N$. The convergence can be arbitrarily slow. For a human lifespan or a fund's lifecycle, $N$ is never infinite.

  **The Critic's Move: Finite Horizon and Subjective Utility**
  Critics (Paul Samuelson, Robert Merton, Harry Markowitz) argue from the framework of Expected Utility Theory (EUT). Samuelson's famous rebuttal, "The 'Fallacy' of Large Numbers," demonstrates that just because a bet is favorable in the limit does not mean a rational agent should accept it for a finite sequence. They argue that $E[\log W]$ is merely a specific utility function $U(W) = \log W$. There is no mathematical law requiring an agent to have log utility; an agent with $U(W) = -W^{-1}$ or $U(W) = \sqrt{W}$ will rationally prefer a different betting fraction.
  *   **The Implication:** Rationality is defined statically (consistency of preferences). Risk tolerance is subjective. Kelly is often too volatile for finite horizons, leading to unacceptable drawdowns even if ruin is avoided.
  *   **The Blind Spot:** EUT traditionally relies on *ensemble averages* (averaging across parallel universes). It often ignores the *ergodicity problem*: a single agent experiences only one timeline (time average), not the average of all possible timelines.

  **The Diagnosis:** The debate persists because Pro-Kelly advocates treat the asymptotic limit as a normative proxy for "long-term," while Critics treat the finite horizon as the only reality. They agree on the math (Kelly maximizes geometric mean; EUT maximizes arithmetic mean of utility) but disagree on which metric maps to rational action.

  ### 2. Substantive Disagreement: The "Smuggling" of Norms

  You asked if one side is smuggling in an implicit norm. **Yes, the Pro-Kelly side often does.**

  By framing the Kelly criterion as a result of "information theory" or "wealth growth," proponents often present log-utility as an **objective mathematical necessity** rather than a **subjective risk preference**.
  *   **The Smuggle:** When Kelly proponents argue that "maximizing expected wealth leads to ruin," they are implicitly assuming that the agent cares about the *median* outcome or the *most likely* path (time average). When Critics argue that "maximizing expected log wealth is too conservative," they are implicitly assuming the agent cares about the *mean* outcome (ensemble average).
  *   **The Normative Clash:** The Pro-Kelly side implicitly norms **survival and ergodicity** (what happens to *me* over *time*). The Critic side implicitly norms **preference satisfaction** (what matches my *risk profile* across *possibilities*).

  This is why the debate feels unresolved. The Pro-Kelly side claims to have found the "one true way" to bet, while the Critic side claims to have found a "freedom of preference." Both are correct within their own frames, but they claim universal validity.

  ### 3. Hidden Empirical Disagreement

  There is a secondary, empirical layer to the dispute: **What constitutes a "betting situation"?**
  *   **Kelly Context:** Often derived from gambling or high-frequency trading where bets are repeated thousands of times, leverage is available, and the agent can adjust bet sizes continuously. In this context, the asymptotic properties are relevant.
  *   **Critic Context:** Often derived from portfolio theory or life-cycle investing where bets are correlated, horizons are fixed (e.g., retirement), and liquidity constraints prevent continuous rebalancing. In this context, the volatility drag of Kelly is a genuine risk, not just a theoretical variance.

  ### 4. What Counts as Progress?

  Given this diagnosis, a new mathematical theorem proving Kelly is "best" will not resolve the debate, because the math is already agreed upon. Progress requires **conceptual clarification** and a **reframing of the objective function.**

  **A. Conceptual Distinction: Ergodicity vs. Expectation**
  Progress has already begun with the rise of **Ergodicity Economics** (e.g., Ole Peters). This framework explicitly distinguishes between:
  1.  **Ensemble Average:** The expected value across parallel systems (the domain of standard EUT).
  2.  **Time Average:** The growth rate experienced by a single system over time (the domain of Kelly).
  *   **Progress:** Acknowledging that Kelly is the strategy that maximizes the *time-average growth rate* in a non-ergodic environment (where wealth does not reset). This validates the Kelly intuition without claiming log-utility is the *only* rational utility function. It clarifies that Kelly is optimal for *growth*, while EUT is optimal for *satisfaction*.

  **B. Formal Result: Fractional Kelly and Drawdown Constraints**
  The binary "Kelly vs. Not Kelly" framing is a false dichotomy. Progress lies in formalizing **Fractional Kelly** (betting a fraction $f < 1$ of the full Kelly amount) not as a compromise, but as an optimization under constraints.
  *   **Progress:** A formal framework that treats "maximum acceptable drawdown" or "time horizon" as hard constraints. If an agent has a finite horizon $T$, the optimal bet size is a function of $T$. As $T \to \infty$, the fraction approaches 1 (Full Kelly). As $T \to 1$, it approaches the single-period EUT optimum. This bridges the asymptotic and finite views.

  **C. Change of Question: From "Optimal" to "Robust"**
  The question "What is the optimal betting strategy?" presupposes a single optimum.
  *   **Progress:** Shifting the question to "What strategy is robust to model error and horizon uncertainty?" Full Kelly is notoriously sensitive to edge estimation errors (overestimating your edge leads to overbetting and ruin). A robust strategy might be "Half-Kelly," which retains a large portion of the growth rate while significantly reducing variance and sensitivity to estimation error. This moves the debate from normative purity to practical robustness.

  ### Summary
  The disagreement is a **category error** masquerading as a normative conflict. The Pro-Kelly side optimizes for the **time-average trajectory** (ergodic growth), while the Critics optimize for the **ensemble-average utility** (risk-adjusted expectation). Progress will not come from proving one side mathematically "right," but from explicitly distinguishing between maximizing *growth rates* (a physical property of the bet sequence) and maximizing *utility* (a psychological property of the agent), and by developing frameworks (like Fractional Kelly) that optimize growth subject to finite-horizon risk constraints.
