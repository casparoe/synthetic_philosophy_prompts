      *   *Philosopher's Counter:* "Evolution is a capacity, not a current state." Or "It's a lineage, even if static." Or "The environment selects the chemistry, so the chemistry evolved." (Need to be careful here). The strongest move is to argue that the *chemistry itself* is the product of prior selection (pre-biotic evolution), so this is just a stable endpoint. Or argue that "potential for variation" exists even if not realized.
