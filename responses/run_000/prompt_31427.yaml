answer: |-
  You are right to feel like you are building without a blueprint. Population ethics is unique in moral philosophy because it is dominated by **impossibility theorems**. Unlike normative ethics, where we argue about which principle is *true*, population ethics often proves that no principle can satisfy all the conditions we think are *obviously true*.

  Gustaf Arrhenius, the field's leading formal theorist, has demonstrated that there is no adequate population axiology that satisfies a set of seemingly minimal conditions.

  Here is the blueprint you asked for: the core desiderata, the impossibility results that break them, the silent sacrifices, and the missing constraint.

  ---

  ### Part 1: The Desiderata (The Blueprint)

  Any theory of population value (axiology) ranks "populations" (groups of lives with specific welfare levels). To be adequate, a theory must generally satisfy the following conditions.

  #### 1. Transitivity (Consistency)
  *   **Condition:** If Population A is at least as good as B, and B is at least as good as C, then A must be at least as good as C.
  *   **Motivation:** This is the bedrock of rational choice. If you prefer A to B and B to C, but prefer C to A, you can be "money-pumped" (tricked into giving away resources in a cycle). Without transitivity, a theory cannot guide action.

  #### 2. Dominance (The Pareto Principle)
  *   **Condition:** If Population A and B contain the exact same people, and everyone in A has higher welfare than in B, then A is better than B.
  *   **Motivation:** It is hard to argue that making everyone worse off is an improvement. This rules out theories that value equality or diversity so much they would sacrifice everyone's welfare to achieve them.

  #### 3. Weak Non-Sadism
  *   **Condition:** Adding a person with negative welfare (a life not worth living) makes the population worse, *ceteris paribus*.
  *   **Motivation:** It is intuitively wrong to create a child who will suffer immensely, even if doing so somehow slightly benefits others. A theory that says adding a suffering person is *good* (or neutral) is immediately disqualified.

  #### 4. Weak Quality Addition
  *   **Condition:** Adding a person with very high positive welfare makes the population better, *ceteris paribus*.
  *   **Motivation:** If we can add a person who will have a fantastic life without hurting anyone else, that seems like an improvement. This rules out extreme "Anti-Natalist" views where existence is always neutral or bad.

  #### 5. Non-Elitism (Continuity)
  *   **Condition:** There is no "lexical" gap. A sufficiently large number of lives with slightly lower welfare can outweigh a small number of lives with very high welfare.
  *   **Motivation:** This prevents "Lexical Views" (the idea that one high-quality life is *infinitely* more valuable than any number of low-quality lives). If Non-Elitism holds, we avoid the implication that we should prioritize one genius over a billion happy workers no matter the cost.

  #### 6. Existence Independence
  *   **Condition:** The value of a population should not depend on the existence of people who are not part of the comparison. More specifically, the value of *your* life shouldn't change depending on how many *other* people exist.
  *   **Motivation:** My life's value seems intrinsic to my experience. It is counterintuitive to think my life becomes "less valuable" simply because a billion strangers are born in a distant galaxy. Total Utilitarianism satisfies this; Average Utilitarianism does not.

  ---

  ### Part 2: The Impossibility Results (The Load-Bearing Walls)

  You cannot have all of the above. This is not a bug; it is a feature of the mathematical landscape.

  #### 1. The Mere Addition Paradox (Parfit)
  *   **The Case:**
      *   **A:** 1 billion people with excellent lives.
      *   **A+:** The 1 billion from A (same welfare) + 1 billion *new* people with lives "worth living" but lower than A.
      *   **B:** 2 billion people with lives slightly lower than A's original level, but higher than A+'s new people (more equal).
  *   **The Clash:**
      *   Most agree **A+ is not worse than A** (Mere Addition: adding happy people without hurting existing ones isn't bad).
      *   Most agree **B is better than A+** (B is more equal and has higher average welfare).
      *   By Transitivity, **B should be better than A**.
      *   But B has lower average welfare than A. If you repeat this step, you slide down to the **Repugnant Conclusion** (a massive population with lives barely worth living is better than the excellent population A).
  *   **The Impossibility:** You must reject either Mere Addition, Transitivity, or the intuition that the Repugnant Conclusion is false.

  #### 2. Arrhenius's Impossibility Theorem
  *   **The Result:** Arrhenius proved formally that no theory can satisfy **Dominance, Non-Elitism, Weak Non-Sadism, Weak Quality Addition, and Transitivity** simultaneously.
  *   **The Implication:** Every theory fails at least one intuitive test.
      *   **Total Utilitarianism:** Satisfies most, but fails **Non-Elitism** (leads to Repugnant Conclusion).
      *   **Average Utilitarianism:** Avoids Repugnant Conclusion, but fails **Weak Non-Sadism** (can imply adding happy people is bad if it lowers the average) and **Existence Independence**.
      *   **Person-Affecting Views:** Avoid Repugnant Conclusion, but fail **Dominance** (Non-Identity Problem: can't say a world with happy people is better than a world with miserable people if they are *different* people).
      *   **Lexical Views:** Avoid Repugnant Conclusion, but fail **Non-Elitism** (claim some lives are infinitely valuable).

  ---

  ### Part 3: The Secret Sacrifice

  **The Desideratum:** **Existence Independence.**

  **Why it's the secret sacrifice:**
  Most philosophers want to avoid the Repugnant Conclusion without accepting Lexical Views (which seem dogmatic) or Intransitivity (which seems irrational). To do this, they adopt **Critical Level Utilitarianism** or **Variable Critical Views**. These theories say: *A life only adds value if its welfare exceeds a certain threshold.*

  To make this work mathematically without triggering the Repugnant Conclusion, the "critical level" often has to shift based on population size, or the value of a life must be discounted by the number of other lives.

  **The Admission No One Wants to Make:**
  This implies **Existence Dependence**. It means the moral value of *your* happy life depends on how many other people exist. If the population is huge, your happy life might count for less (or even be negative) compared to if the population were small.
  Theorists hate admitting this because it violates the intuition that individuals have moral weight independent of the collective. They prefer to say they are "avoiding the Repugnant Conclusion" rather than "making your life's value contingent on stranger's births."

  *(Honorable Mention: **Transitivity**. Many theorists use "vagueness" to solve the Repugnant Conclusion. Formally, vagueness in betterness relations often entails intransitivity. They claim their theory is "indeterminate" rather than "irrational," but the logical cost is the same.)*

  ---

  ### Part 4: The Most Underrated Constraint

  **The Constraint:** **Risk Sensitivity (Uncertainty).**

  **Why it's underrated:**
  95% of population ethics literature assumes **certainty**. They compare Population A vs. Population B as if we know exactly who will exist and what their welfare will be.

  **The Problem:**
  In the real world (climate policy, AI safety, reproductive ethics), we deal with **probabilities of existence** and **distributions of welfare**.
  *   **The Identity Problem on Steroids:** Under uncertainty, actions change *who* comes into existence (probabilistic non-identity).
  *   **The Expectation Gap:** Total Utilitarianism implies we should take huge risks to create a tiny chance of an infinite future (Pascal's Mugging). Average Utilitarianism implies we should avoid creating happy people if there's a risk they might be slightly less happy than the average.
  *   **The Missing Math:** We lack a robust "Expected Population Value" theory that doesn't collapse into the same impossibility theorems when probabilities are introduced.

  **Why it matters:**
  A theory that works only for deterministic comparisons is useless for policy. If you cannot handle risk, you cannot handle the future. The fact that most papers ignore uncertainty to focus on static comparisons is the field's biggest blind spot.

  ---

  ### Summary for Your "House Building"

  1.  **Pick your poison:** You cannot satisfy all desiderata. Arrhenius proved it.
  2.  **The Trade-off:** If you want to avoid the Repugnant Conclusion, you will likely have to violate **Existence Independence** (making value population-relative) or **Transitivity** (accepting cycles/vagueness).
  3.  **The Test:** When reading a new paper, don't ask "Does this solve the Repugnant Conclusion?" Ask: **"Which axiom did they break to make the math work, and do I accept that cost?"**
  4.  **The Frontier:** If you want to do novel work, stop comparing static populations and start modeling **risk and uncertainty**. That is where the current blueprints are most incomplete.
