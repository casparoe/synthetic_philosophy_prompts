  ### 1. Formal Setup

  Let $W = \{0, 1, 2, 3\}$ be the partition of possibilities representing the total number of heads observed in three tosses of a coin. An agent's credence function is a probability distribution $c = (c_0, c_1, c_2, c_3)$ over $W$, such that $c_i \ge 0$ and $\sum c_i = 1$. The agent's evidence $E$ does not specify the exact bias of the coin but imposes a linear constraint on the expected number of heads. Specifically, the agent knows $E[H] = 2$. Formally, the set of credence functions compatible with the evidence, $\mathcal{C}_E$, is defined by the constraint:
  $$ \sum_{i=0}^{3} i \cdot c_i = 2 $$
  Combined with the normalization constraint $\sum c_i = 1$, this defines a polytope of feasible probability functions. In the absence of further evidence, accuracy-first epistemology typically mandates that the agent select the function $c \in \mathcal{C}_E$ that minimizes the epistemic "distance" from a state of total ignorance (the Uniform prior $u = (0.25, 0.25, 0.25, 0.25)$). The metric of distance is determined by the chosen strictly proper scoring rule $S$. The agent seeks to solve the optimization problem:
  $$ \min_{c \in \mathcal{C}_E} D_S(c, u) $$
  where $D_S$ is the divergence measure associated with $S$. For the Brier score, $D_S$ is squared Euclidean distance; for the Log score, $D_S$ is the Kullback-Leibler (KL) divergence. Because these metrics define different geometries over the probability simplex, they identify different "centers" of the feasible set $\mathcal{C}_E$.

  ### 2. The Brier-score recommendation

  The Brier score for a credence function $c$ at world $i$ is $BS(c, i) = \sum_j (c_j - \delta_{ij})^2$. The divergence associated with the Brier score from a prior $u$ is the squared Euclidean distance: $D_{BS}(c, u) = \sum_i (c_i - u_i)^2$. To find the Brier-optimal credence, we minimize this distance subject to the constraints $\sum c_i = 1$ and $\sum i \cdot c_i = 2$. Using Lagrange multipliers, we define the Lagrangian $\mathcal{L} = \sum (c_i - 0.25)^2 + \lambda(\sum c_i - 1) + \mu(\sum i c_i - 2)$. Taking the derivative with respect to $c_i$ yields the condition $2(c_i - 0.25) + \lambda + \mu i = 0$, which implies that $c_i$ must be a linear function of $i$: $c_i = A + B \cdot i$.

  Solving the system of linear equations imposed by the constraints:
  1.  $\sum_{i=0}^3 (A + Bi) = 4A + 6B = 1$
  2.  $\sum_{i=0}^3 i(A + Bi) = 6A + 14B = 2$

  Solving this system yields $A = 0.1$ and $B = 0.1$. Thus, the Brier-optimal credence function is $c_{BS} = (0.1, 0.2, 0.3, 0.4)$. In plain English, the Brier score recommends a distribution that shifts probability mass away from the uniform prior in a strictly linear fashion. It treats the "cost" of moving probability mass from 0 heads to 3 heads as proportional to the arithmetic distance, resulting in a distribution that is symmetric around the constraint mean in terms of probability increments. This distribution satisfies the evidence ($0.1(0) + 0.2(1) + 0.3(2) + 0.4(3) = 2$) while remaining as "close" to uniform as possible in Euclidean space.

  ### 3. The log-score recommendation

  The Log score is defined as $LS(c, i) = \log c_i$. The associated divergence from a prior $u$ is the KL-divergence: $D_{LS}(c, u) = \sum c_i \log(c_i / u_i)$. Since $u$ is uniform, minimizing KL-divergence is equivalent to maximizing the Shannon Entropy $H(c) = -\sum c_i \log c_i$ subject to the evidence constraints. This is the classic Principle of Maximum Entropy (MaxEnt). The optimization yields a distribution from the exponential family, where $c_i = \frac{1}{Z} e^{\lambda i}$. Letting $r = e^\lambda$, the probabilities follow a geometric progression: $c_i \propto r^i$.

  We must solve for $r$ such that the expected value is 2:
  $$ \frac{\sum_{i=0}^3 i \cdot r^i}{\sum_{i=0}^3 r^i} = 2 \implies \frac{r + 2r^2 + 3r^3}{1 + r + r^2 + r^3} = 2 $$
  This simplifies to the cubic equation $r^3 - r - 2 = 0$. The positive real root is approximately $r \approx 1.521$. Normalizing the resulting geometric series $(1, r, r^2, r^3)$ yields the Log-optimal credence function $c_{LS} \approx (0.12, 0.18, 0.28, 0.42)$. The divergence here is vivid: while the Brier score recommended $c_0 = 0.10$ and $c_3 = 0.40$, the Log score recommends $c_0 \approx 0.12$ and $c_3 \approx 0.42$. The Log score preserves more uncertainty (higher entropy) by distributing mass more exponentially; it penalizes assigning near-zero probability to outcomes more severely than the Brier score does, resulting in a "heavier" tail on the 0-heads outcome compared to the linear Brier solution.

  ### 4. Diagnosis

  The divergence arises because the evidence underdetermines the probability function, leaving the choice of scoring rule to act as a tie-breaking geometric constraint on the feasible set. The Brier score induces a Euclidean geometry, favoring linear adjustments to the prior, while the Log score induces an information geometry, favoring exponential (multiplicative) adjustments that maximize entropy. If the evidence had uniquely determined a probability function—for example, if the agent knew the coin's exact bias was $p=2/3$—the feasible set $\mathcal{C}_E$ would contain only the Binomial distribution. In that case, both scoring rules would converge on the same unique function, as any strictly proper scoring rule is maximized in expectation by the true probability function. The conflict is therefore not about tracking the truth (which both do when the truth is known) but about how to represent ignorance when the truth is partially constrained.

  ### 5. What an accuracy-first epistemologist should do

  The most defensible line is to accept a limited form of scoring-rule relativity, arguing that the choice of rule depends on the *type* of partial evidence at hand. One should argue that the Log score (and its associated MaxEnt principle) is the default for physical constraints like expected values, because it makes the fewest assumptions beyond the constraint itself, whereas the Brier score is better suited for contexts involving additive error estimates. The main vulnerability of this position is that it undermines the unity of epistemic rationality; if rationality is scoring-rule-relative, then two agents with identical evidence and goals could be rationally required to hold different credences simply because they adopt different accuracy metrics. To avoid this, the accuracy-firster might instead argue that the Log score is uniquely privileged because it is the only rule invariant to re-parameterizations of the possibility space, thereby singling out the MaxEnt solution as the uniquely rational response to partial constraint.
