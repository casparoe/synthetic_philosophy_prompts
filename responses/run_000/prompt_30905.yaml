  I'm designing the final essay for an upper-level undergraduate course on the philosophy of artificial intelligence, with a unit on Turing's early ideas about machine learning. I want one essay question on his proposal for building and educating a child machine, drawing on both his 1950 paper and his earlier 1948 report on intelligent machinery. The question should force students to confront a subtle interpretive issue: Turing uses the image of a child-brain as a notebook with little mechanism and lots of blank sheets, which sounds like blank-slate empiricism, yet he also talks about designing the child machine well, experimenting with unorganised machines, and using an analogy between the child machine and hereditary material and between education and evolution. I want the question to make students explain what the blank-sheet image does and does not commit him to, and to specify what role remains for initial structure, random variation, punishment and reward, and the teacher.

  Please write the question, a model answer of around 600 words, and a marking scheme. The marking scheme should separate an A from a B answer by naming the specific interpretive moves each must contain, and it should identify common mistakes students make, such as treating Turing as a pure blank-slate empiricist or ignoring the difference between the child machine's initial architecture and the adult system's acquired competence. Use American English. After the model answer, state how confident you are in your reading and single out the point you are least sure about.
