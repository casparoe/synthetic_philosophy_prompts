  The second most severe tension is between (1) and the prohibitions demanded in (3) and (5). Commitment (1) establishes a high bar for legal interference, while (3) and (5) demand it. This is a conflict between a general presumption and specific exceptions. The least costly revision is to treat (1) as a default rule that is overridden when the specific harms identified in (4) (exploitation) and (5) (commodification) provide the "strong justification" (1) requires, thereby integrating the commitments rather than discarding any.

  The apparent tension lies between (1) and (6). You might fear that boycotting voluntary exchanges violates the presumption of permissibility, but boycotts are simply the exercise of the negative liberty implicit in (1). No revision is needed here; refusing to exchange is consistent with holding that exchange is permissible for those who choose it.
