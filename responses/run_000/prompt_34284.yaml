      *   *Is it a contradiction?* Most scholars (Skinner, Pocock, Mansfield) see it as a tragic tension rather than a logical error. Machiavelli is a realist. He knows perfect adaptability is nearly impossible, but it is the *ideal* to strive for. The tension *is* the point.

  5.  **Drafting the Response - Structure:**
