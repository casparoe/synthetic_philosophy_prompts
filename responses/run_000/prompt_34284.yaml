          *   *Virtù:* Foresight, preparation, infrastructure building during "fair weather."
          *   *Mechanism:* Mitigation. You can't stop the rain, but you can channel the water.
          *   *Implication:* Human agency is effective *before* the crisis hits.
      *   **Passage 2 (The Adaptation):**
          *   *Fortune:* Changing times/circumstances (not just random disaster, but historical context).
          *   *Virtù:* Flexibility, adaptability, changing one's mode of proceeding.
          *   *Constraint:* Human nature is fixed ("cannot deviate from what nature inclines him"). Habit reinforces this ("having always prospered by acting in one way").
