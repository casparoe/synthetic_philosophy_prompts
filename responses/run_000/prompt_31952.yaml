answer: |-
  The argument you are describing is widely known in contemporary epistemology as **Williamson's Anti-Luminosity Argument**. It appears most famously in Timothy Williamson's 2000 book *Knowledge and Its Limits* (Chapter 4).

  The property it attacks is called **Luminosity**.

  Here is a breakdown of the name, the mechanics of the argument, and its scope and limits.

  ### 1. The Name and the Property

  **Luminosity:** A condition $C$ is said to be *luminous* if and only if:
  > Whenever $C$ obtains, one is in a position to know that $C$ obtains.

  Historically, many philosophers (particularly Cartesians and logical positivists) assumed that certain mental states were luminous. For example, if you are in pain, you must know you are in pain. If you feel cold, you must know you feel cold. This was often tied to the idea of "incorrigibility" or "self-intimation."

  **The Anti-Luminosity Argument:** Williamson uses the move you described to prove that **no non-trivial condition is luminous.** Not even "feeling cold."

  You were right to sense a connection to the **KK Principle** (Knowing that one Knows). KK is essentially a specific instance of luminosity applied to knowledge itself ($Kp \to KKp$). Williamson's argument is a generalization: it argues that you cannot even know your own current mental states with certainty if those states admit of gradual change.

  ### 2. How the Argument Works

  The argument is a sophisticated blend of epistemology and the **Sorites Paradox** (the paradox of the heap). Here is the formal structure of the move you identified intuitively:

  **Premise 1: The Luminosity Claim (Assumption for Reductio)**
  Assume that "feeling cold" is luminous. That is, in any case $\alpha$, if you feel cold in $\alpha$, you know you feel cold in $\alpha$.

  **Premise 2: The Gradual Series**
  Imagine a sequence of moments in time, $t_0, t_1, ..., t_n$, spanning a morning where you slowly warm up from freezing to hot.
  *   At $t_0$, you are definitely feeling cold.
  *   At $t_n$, you are definitely not feeling cold.
  *   The change between adjacent moments ($t_i$ and $t_{i+1}$) is so microscopic that your subjective evidence is **indistinguishable**.

  **Premise 3: The Margin for Error Principle (Safety)**
  This is the engine of the argument. Knowledge requires **safety**. You cannot know $p$ if your belief could easily have been false.
  Formally: If you know you feel cold at $t_i$, then you must feel cold at any moment $t_{i+1}$ that is sufficiently close to $t_i$.
  *Why?* Because your evidence at $t_i$ is the same as at $t_{i+1}$. If you claim to *know* you are cold at $t_i$ based on that evidence, but at $t_{i+1}$ (where the evidence is identical) you are *not* cold, then your belief at $t_i$ was not safe—it was only accidentally true.

  **The Contradiction:**
  1.  At $t_0$, you feel cold. By Luminosity, you **know** you feel cold.
  2.  By the Margin for Error Principle: If you know you feel cold at $t_0$, you must feel cold at $t_1$ (because $t_1$ is indistinguishable from $t_0$).
  3.  By Luminosity again: If you feel cold at $t_1$, you **know** you feel cold at $t_1$.
  4.  By Margin for Error again: If you know at $t_1$, you must feel cold at $t_2$.
  5.  ...Repeat this logic down the chain...
  6.  Conclusion: You must feel cold at $t_n$.
  7.  But we defined $t_n$ as a moment where you are clearly **not** cold.

  **Result:** The assumption (Luminosity) leads to a contradiction. Therefore, "feeling cold" is not luminous. There are moments where you feel cold but do not know it (specifically, the moments near the boundary).

  ### 3. Scope and Limits: Where Does It Apply?

  You asked if this applies to *any* condition with a gradual boundary. The answer is nuanced.

  **Where it applies:**
  The argument applies to any condition that is **vague** and relies on **fallible discrimination**.
  *   **Mental States:** Feeling cold, being in pain, being awake. (Williamson's goal was to show that even the mind is not transparent to itself).
  *   **Perceptual States:** Seeing red, hearing a tone.
  *   **External States:** Being a heap, being tall, being bald.

  **Where it stops (The Counter-Moves):**
  The argument is not uncontested. It stops working if you reject one of its underlying premises.

  1.  **Rejecting Safety (Internalism):**
      The argument relies on an *externalist* theory of knowledge (specifically, the Safety or Reliability condition). If you are a strict *internalist*, you might argue that knowledge depends only on your internal perspective. Since your perspective at $t_i$ and $t_{i+1}$ feels the same, an internalist might say you *do* know at $t_i$, even if you are wrong at $t_{i+1}$. Williamson would reply that this isn't knowledge, but the internalist denies that "safety" is required for knowledge.

  2.  **Epistemicism (Sharp Boundaries):**
      Some philosophers (like Timothy Williamson himself, in a different context, or Roy Sorensen) argue that there *is* a sharp boundary between "cold" and "not cold," even if we cannot locate it.
      *   *The Move:* There is a precise nanosecond where you stop feeling cold.
      *   *The Problem:* This saves the logic but kills the intuition. It implies there is a fact of the matter about whether you feel cold that is completely unknowable. Most find this implausible for mental states.

  3.  **Contextualism:**
      A contextualist might argue that the standard for "knows" shifts. At the beginning of the series, the standard is low, so you know. Near the boundary, the standard rises, so you no longer claim to know. This dissolves the contradiction by making the truth value of "I know" context-dependent.

  4.  **Phenomenal Precision:**
      Some argue that phenomenal experience (what it feels like) is actually precise, not gradual. They argue that "feeling cold" is a discrete state, not a continuum. If the state changes discretely, the Sorites series cannot be constructed, and the argument fails. (However, this is empirically dubious for things like temperature).

  ### Summary

  *   **Name:** The Anti-Luminosity Argument (or the Margin for Error Argument).
  *   **Author:** Timothy Williamson (*Knowledge and Its Limits*, 2000).
  *   **Target Property:** Luminosity (the idea that $C \to \text{Know}(C)$).
  *   **Mechanism:** It combines a **Sorites Series** (gradual change) with a **Safety/Margin for Error Principle** (knowledge requires that you couldn't easily be wrong).
  *   **Implication:** It suggests that knowledge is not compatible with marginal discrimination. We cannot know the exact boundaries of our own experiences.
  *   **Limit:** It applies primarily within **Externalist** frameworks of knowledge. If you hold that knowledge is purely internal justification, the "safety" premise loses its grip, though you then face the challenge of explaining how you know things about the external world at all.

  This argument is considered one of the most significant contributions to epistemology in the last 30 years because it challenges the Cartesian foundation that the mind is a sanctuary of certainty.
