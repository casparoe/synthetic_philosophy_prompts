      *   **Key Question:** Does the novel fit existing models, or does it push back/complicate them? What does the *first-person narration* add? What would a philosopher have to revise after reading this?
      *   **Constraint:** Do *not* write a simple "Novel illustrates Theory X" essay. Needs to be critical, nuanced, and focused on where the literature challenges the theory.

  2.  **Deconstruct the Philosophical Landscape:**
