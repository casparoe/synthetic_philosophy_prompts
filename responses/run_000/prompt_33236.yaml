      *   **Sartre without Anguish:** Sartre's Bad Faith requires knowing the freedom you're denying. Stevens denies he even *has* that freedom. He outsources his morality to Darlington. *Revision:* Bad faith can be structural/social, not just individual ontological flight.
      *   **The Deflationary Challenge:** Mele says it's just biased evidence gathering. Stevens shows it's *retroactive reinterpretation*. It's not avoiding the pain; it's sanitizing the memory. *Revision:* Time matters. Self-deception is a historiographical act.
      *   **The First-Person Cruciality:** This is the core insight. The narration *is* the deception. If he stops writing/talking, the deception collapses (the pier scene). *Revision:* Self-deception is dialogic/performative.
      *   **The Emotional Payoff (The Pier):** Why does it matter? Because the cost of self-deception isn't logical inconsistency; it's lost life. Philosophy often misses the *tragedy*.
