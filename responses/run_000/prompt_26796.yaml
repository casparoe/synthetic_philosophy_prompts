answer: |-
  Here is the specification of desiderata for an adequate Scanlonian contractualist account of aggregation. These criteria are framed to fix the problem space before evaluating specific theoretical modifications (such as relevant grouping, ex ante reasonable rejectability, or weighted complaints).

  ### I. Desiderata for an Adequate Account

  **1. The Numbers Count Intuition (Simple Rescue)**
  *   **Specification:** In a "Simple Rescue" case (e.g., a burning building where one can save either one stranger or five strangers, all facing identical harm of death), the principle permitting the agent to save the five must be justifiable, and the principle requiring the agent to save the one must be reasonably rejectable.
  *   **Consideration:** A moral theory that mandates a coin toss or arbitrary choice between one life and five lives fails to capture a basic moral truth. While contractualism grounds wrongness in individual reasons, it must not be morally blind to the fact that more individuals are affected.
  *   **Status:** **Non-negotiable** for an adequate theory. (While a strict deontologist might reject this, a contractualist theory aiming to be plausible in the real world must accommodate the intuition that numbers matter in life-or-death scenarios.)

  **2. The Severity Threshold (Unequal Trade-off)**
  *   **Specification:** In cases where one person faces a catastrophic harm (e.g., death) and a large number of others face minor harms (e.g., mild headaches), the principle permitting the sacrifice of the one to prevent the aggregated minor harms must be reasonably rejectable by the one.
  *   **Consideration:** This captures the core anti-utilitarian insight of contractualism. There is a lexical priority or threshold of severity such that the aggregation of sufficiently trivial interests cannot override a sufficiently vital interest.
  *   **Status:** **Non-negotiable.** This is the primary motivation for adopting contractualism over consequentialism.

  **3. The Intra-/Inter-Personal Distinction (Separateness of Persons)**
  *   **Specification:** The theory must explain why burdens can be aggregated within a single life (I may break my arm to save my own life) but face a structural barrier when aggregated across distinct lives (society may not break your arm to save my life), even if the physical costs and benefits are identical.
  *   **Consideration:** This respects the "separateness of persons." Individuals are distinct loci of value; the moral unit is the life, not the aggregate welfare. A principle must be justifiable to each distinct person, not to a collective entity.
  *   **Status:** **Non-negotiable.** This is the metaphysical and moral foundation of the view.

  **4. The Individualist Restriction**
  *   **Specification:** The grounds for rejecting a principle must be reasons that particular individuals have. One cannot reject a principle on the grounds that it leads to a worse aggregate outcome, nor can one justify a principle by summing the reasons of multiple people to outweigh the reasons of a single person *in the justification itself*.
  *   **Consideration:** This ensures that the justification of morality remains interpersonal. Each person must be able to see the principles governing their life as ones they could accept given their own standpoint.
  *   **Status:** **Non-negotiable.** This is definitional for Scanlonian contractualism.

  **5. Pairwise Comparison of Complaints**
  *   **Specification:** When determining if a principle can be reasonably rejected, we compare the strongest complaint against the principle with the strongest complaint against the alternative principle. We do not sum the complaints of the group against the principle.
  *   **Consideration:** This is the procedural mechanism Scanlon proposes to respect the Individualist Restriction. It ensures that the strength of a rejection is determined by the individual with the most at stake, not the number of people with something at stake.
  *   **Status:** **Non-negotiable** for *Scanlonian* contractualism (though some broader contractualists might contest the mechanism, it is fixed here as part of the core view provided in the prompt).

  **6. Ex Post Focus on Complaints**
  *   **Specification:** The strength of a complaint is determined by the actual harm suffered (ex post), rather than the risk imposed or the loss of expected utility (ex ante). A person who is actually harmed has a stronger ground for rejection than a person who faced a risk but suffered nothing.
  *   **Consideration:** This aligns with the intuition that morality is about how we actually treat people, not just about the gambles we take with them. It prevents justifying actual severe harm to a few based on small probabilistic benefits to many.
  *   **Status:** **Preference.** (This is a major fault line. Many contractualists argue for an *ex ante* view to handle risk imposition better. A contractualist could coherently reject the Ex Post Focus in favor of Ex Ante reasonable rejectability without abandoning the core view.)

  **7. The Requirement of Justifiability to the Loser**
  *   **Specification:** If a principle permits an agent to act in a way that sacrifices a person's vital interests for the sake of others, there must be a reason acceptable *to that person* (from their generic standpoint) for why they must bear that burden.
  *   **Consideration:** This prevents treating individuals as mere means. If the "loser" in a trade-off cannot see a reason to accept their loss, the principle is tyrannical.
  *   **Status:** **Non-negotiable.** This is the heart of the "reasonable rejectability" clause.

  ---

  ### II. Incompatibilities and Tensions

  There is a fundamental tension, if not a formal incompatibility, between three of the non-negotiable requirements as stated above: **The Numbers Count Intuition (1)**, **The Individualist Restriction (4)**, and **Pairwise Comparison (5)**.

  **The Conflict:**
  In the Simple Rescue case (1 vs. 5), consider the principle *P1*: "Save the one."
  *   **Complaint against P1:** Each of the five has a complaint of "Death."
  *   **Complaint for P1:** The one has a complaint of "Death."

  If we adhere strictly to **Pairwise Comparison (5)** and the **Individualist Restriction (4)**, we compare the strongest complaint against *P1* (one of the five dying) with the strongest complaint for *P1* (the one dying). These complaints are identical in strength (Death vs. Death). Pairwise comparison yields a tie. To break the tie in favor of the five (as required by **Desideratum 1**), one must somehow allow the five to "bring their numbers to bear." But if they bring their numbers to bear by summing their reasons, one violates the **Individualist Restriction**.

  **The Response:**
  The right response is to **weaken the interpretation of Pairwise Comparison**, not to reject the demand for Numbers Count or the Individualist Restriction.
  Strict pairwise comparison (one-on-one) is too rigid. The theory must move to a model of *relevant grouping* or *probability-based weighting*. For example, one might argue that from an ex ante perspective, each person has a 1/6 chance of dying under a "flip a coin" principle, but a 1/2 chance under a "save the one" principle. This allows numbers to count via the *strength of the ex ante complaint* (higher risk of death) without aggregating the *value* of the lives. This preserves the Individualist Restriction (each complains about their own risk) while satisfying the Numbers Count Intuition.

  **Secondary Tension: Ex Post Focus (6) vs. Risk Imposition**
  If we maintain a strict **Ex Post Focus**, it becomes difficult to justify any risk-imposing activity (like driving) that benefits many but kills a few. The actual victims have an absolute complaint (death) that outweighs the ex post "non-harm" of the beneficiaries.
  **The Response:** Here, the right response is to **reject the Ex Post Focus** in favor of an Ex Ante formulation for cases of probabilistic harm. This is a coherent move for a contractualist, as the "generic reasons" individuals have include reasons to secure their safety prospects, not just their actual outcomes.

  ---

  ### III. The Most Exclusionary Requirement

  The single requirement that does the most to exclude otherwise attractive proposals is **The Individualist Restriction (4)**.

  **Reasoning:**
  1.  **Excludes Consequentialism:** The most "attractive" alternative for handling aggregation is straightforward utilitarianism (maximize lives saved). It solves the Simple Rescue case effortlessly and handles the Unequal Trade-off via threshold deontology or diminishing marginal utility. The Individualist Restriction rules this out by fiat: it forbids using the *sum* of benefits as a justification for imposing a burden.
  2.  **Forces Complexity:** Because this restriction is in place, contractualists cannot simply say "five deaths are worse than one." They must construct elaborate mechanisms (like relevant groups, ex ante probabilities, or complaint weighting) to explain why the five win *without* saying their collective weight is heavier.
  3.  **Defines the Problem:** Without the Individualist Restriction, there is no "problem of aggregation" for contractualism; there is only a calculation. The restriction is what turns aggregation into a philosophical puzzle. It excludes the class of solutions that treat persons as vessels for value rather than sources of valid claims.

  While the **Numbers Count Intuition** excludes strict deontological views (which would say "never sacrifice the one"), the **Individualist Restriction** is the more profound constraint because it dictates the *currency* of moral justification. It forces the theory to find a way for numbers to matter that is not mathematical summation, which is the central challenge of the entire project.
