  4.  **Drafting the Readings (Iterative Refinement):**

      *   *Reading 1: The Analytic Truism.* If you *only* know the chance and nothing else, believe the chance. (Weak, rarely the point).
      *   *Reading 2: The Lewisian Principal Principle (Standard).* $C(A | Ch(A)=x \land E) = x$ where $E$ is admissible. (The gold standard, but technical).
      *   *Reading 3: The Unconditional Deference.* $C(A) = Ch(A)$ regardless of evidence. (False, ignores inadmissible evidence like seeing the coin).
      *   *Reading 4: The Prior Constraint.* Only applies to initial priors before specific evidence. (Defensible, but doesn't settle current disputes).
      *   *Reading 5: The Past Event Error.* Applying chance to fixed past events as if chance $\neq$ 0 or 1. (Problematic for Humean supervenience).
      *   *Reading 6: The Model Equivocation.* Treating model output as $Ch$. (Category error, but common in rationalist circles).

  5.  **Addressing the Specific Questions:**
      *   *Conditional?* Yes, usually conditional on admissible evidence.
      *   *Undermining Evidence?* Yes, knowing the outcome makes chance info inadmissible.
      *   *Current vs. Prior?* PP applies to current credence *conditional* on chance hypotheses, but often used to set priors.
      *   *Past Events?* Chance is usually time-relative. If $t_{event} < t_{now}$, chance is 0 or 1.
      *   *What is Chance?* Physical propensity, Best System Analysis (Lewis), or (mistakenly) model confidence.

