prompt: |-
  I'm a longtime reader of rationalist blogs and forums (LessWrong and its orbit, mostly), and I keep running into the phrase "defer to the objective chance" used as if it settles a discussion by itself. I've started to notice that it gets used to do very different jobs in different arguments, and I want to separate the readings before I push back in a thread.

  Here are three places I've seen it recently:

  1. In a discussion about whether a one-off event — a specific AI system failing during a particular deployment — "has a probability," someone ended the argument by saying that once you know the objective chance of the event, you simply defer to it: your credence should be whatever that number is.
  2. In a different thread about a coin that was flipped and then hidden, someone said my credence that it landed heads should be 1/2, because the objective chance of heads was 1/2, and any other credence would be a refusal to defer to the chance — even though the flip is over and the outcome is already fixed.
  3. In a third discussion, about a forecasting model that outputs a number for some geopolitical event, someone claimed that rational agents should adopt the model's number wholesale, because the model's probability just is the objective chance and rational credences defer to objective chances.

  I know there's something in formal epistemology called the Principal Principle in this vicinity, but I've never seen its possible readings laid out side by side, and I don't trust my memory of the exact formulation.

  You are an expert in formal epistemology and the philosophy of probability. Think carefully. Start by brainstorming a list of candidate precisifications of the slogan "defer to the objective chance" before settling on the menu you present. Then lay out the distinct precise theses that sentence could be expressing, from the nearly trivial to the clearly false. For each reading, say exactly what it claims — including what "chance" refers to and what operation "defer" amounts to — whether it is a platitude, a substantive but defensible principle, or simply false, and whether it actually supports the use the slogan was being put to in each of the three cases above.

  I especially want the menu to answer these questions:

  - Does deference require setting my credence equal to the chance unconditionally, or conditional on my total evidence, or only conditional on some special class of admissible evidence?
  - What evidence, if anything, would make it rational not to set my credence equal to a known chance — for example, evidence that the event is already settled, or evidence that the chance itself will be undermined by my total evidence?
  - Does the slogan constrain my current, all-things-considered credence, or only an initial or prior credence before I learn anything?
  - Does it apply to past events whose chance is now 1 or 0, and what happens if I don't know which?
  - What is the objective chance in the first place: a single-case physical probability, the output of a well-calibrated model, a theoretical quantity of a completed physics, or something else?

  Finally, say which reading or readings are probably doing the real work when someone on a rationalist forum uses the slogan to end an argument, and whether the argument-ending move is ever justified.
