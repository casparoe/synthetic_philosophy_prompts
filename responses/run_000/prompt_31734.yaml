      *   *Case 1 (AI Failure):* Is it a single-case chance? Humeans say no (only frequencies). Propensitivists say yes. If it's a one-off, "objective chance" is metaphysically shaky. The slogan likely hides a reference class problem.
      *   *Case 2 (Hidden Coin):* Classic PP case. Outcome fixed, but epistemically hidden. Chance is 1/2 *at time of flip*. Credence should be 1/2 *conditional on not knowing outcome*. If you know the chance *and* that it's past, does chance still equal 1/2? Lewis says chance is time-indexed. At $t_{post-flip}$, chance is 1 or 0. So the slogan is technically false if referring to *current* chance, but true if referring to *chance at time of flip* + admissible evidence (not seeing result).
      *   *Case 3 (Forecast Model):* Equivocation. Model output is epistemic probability, not objective chance. Using the slogan here is a category error to lend authority to the model.

