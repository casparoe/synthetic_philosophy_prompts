prompt: |-
  In my ethics seminar, someone keeps invoking "the separateness of persons" as if it settles things — most recently to shut down a proposal that a limited drug should go to whichever patients would gain the most quality-adjusted life years rather than being allocated by lottery. I understand the rough idea, but I'm starting to suspect the phrase is doing different work in different arguments and I can't tell which version is supposed to carry the weight. What are the distinct precise claims that "the separateness of persons" could be expressing? For each, tell me whether it's a platitude that even a utilitarian can accept, a substantive thesis that genuinely challenges utilitarian reasoning, or something false or incoherent, and say which reading the drug-allocation argument actually needs to get its conclusion. I want a menu of readings I can bring to the next session, not just the one you think is right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Ethics seminar.
      *   **Problem:** A peer is using the phrase "the separateness of persons" to argue against utilitarian-style allocation (maximizing QALYs) in favor of a lottery for a limited drug.
      *   **User's Suspicion:** The phrase is ambiguous and does different work in different arguments.
      *   **Task:** Provide a "menu of readings" (distinct precise claims) of "the separateness of persons."
      *   **Requirements for each reading:**
          *   Classify it (Platitude/Utilitarian-compatible, Substantive/Challenges Utilitarianism, or False/Incoherent).
          *   Assess its relevance to the specific drug-allocation argument (does it support the lottery conclusion?).
      *   **Goal:** Equip the user with analytical tools for the next seminar, not just one "correct" answer.

  2.  **Deconstruct "The Separateness of Persons":**
      *   *Origin:* Most famously associated with John Rawls (critiquing utilitarianism), but also Nozick, Nagel, Scanlon, etc.
      *   *Core Intuition:* Individuals are distinct entities; you can't just aggregate their gains and losses as if they were one person's experiences over time.
      *   *Ambiguity:* Is it metaphysical? Moral? Methodological?

  3.  **Brainstorm Distinct Readings:**

      *   *Reading 1: Metaphysical/Phenomenological.* Persons are distinct physical/psychological entities. Pain in person A isn't felt by person B.
      *   *Reading 2: The Aggregation Objection (Rawlsian).* Utilitarianism treats society like a super-person. It sacrifices one for the many in a way that is okay within a life but not across lives.
      *   *Reading 3: The Non-Identity/Claim-Based View.* Each person has a distinct claim that must be respected individually, not swallowed by the sum. (Scanlon/Contractualism).
      *   *Reading 4: The Inviolability/Rights View.* Persons have boundaries that cannot be crossed even for the greater good. (Nozick).
      *   *Reading 5: The Epistemic/Comparability Skepticism.* We can't really compare utility across persons meaningfully.

  4.  **Develop Each Reading (Drafting & Refining):**

      *   *Reading 1: The Metaphysical Fact.*
          *   Claim: Persons are numerically distinct.
          *   Status: Platitude. Utilitarians agree (Bentham knew people are separate).
          *   Relevance to Drug Case: Weak. Utilitarians agree people are separate but say we should *maximize* across them. Doesn't justify a lottery.

      *   *Reading 2: The Structural Analogy Critique (Rawls).*
          *   Claim: Utilitarianism extends rational prudence (balancing pains/gains within one life) to society (balancing across lives). This is a category mistake.
          *   Status: Substantive. Challenges the *structure* of utilitarian reasoning.
          *   Relevance to Drug Case: Strong. It says you can't sacrifice the loser in the lottery just because the winner gains more. But does it demand a lottery? Maybe just strict equality? It challenges the *aggregation*, which supports moving away from pure QALY maximization.

      *   *Reading 3: The Distinct Claims/Contractualist View (Scanlon/Nagel).*
          *   Claim: Morality is about justifying actions to each individual. Each person has a veto or a distinct claim that isn't outweighed simply by summing others' claims.
          *   Status: Substantive. Anti-aggregationist.
          *   Relevance to Drug Case: Very Strong. This is the "fairness" argument. If I lose the drug, I die (or suffer). You can't tell me "but Bob got more QALYs." A lottery gives equal respect to each claim.

      *   *Reading 4: The Side-Constraint/Rights View (Nozick).*
          *   Claim: Persons are inviolable. There are moral side-constraints.
          *   Status: Substantive (Libertarian/Deontological).
          *   Relevance to Drug Case: Moderate/Tricky. Usually applies to *harming* (taking a kidney). Denying a drug is letting die vs. killing. But if the drug is a right, maybe. Less direct fit than Reading 3, but still challenges pure maximization.

      *   *Reading 5: The Interpersonal Comparison Skepticism.*
          *   Claim: We can't measure QALYs across people accurately.
          *   Status: Epistemic/Methodological.
          *   Relevance to Drug Case: Pragmatic. If we can't compare, lottery is a tie-breaker. But this doesn't challenge the *principle* of maximization, just the feasibility.

