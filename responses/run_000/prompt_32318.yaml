  There is a commenter on a decision-theory forum I read whose verdicts I have been keeping a record of, because he is unusually consistent and I want to work out the rule he is actually running. Across several threads he has committed to the following. In the standard Newcomb problem, with a predictor that is right nine times out of ten and the usual payoffs, he takes only the opaque box. In the smoking-lesion case, where a common gene causes both the craving and the cancer while the smoking itself adds no causal risk and he enjoys it, he says he smokes. In the twin prisoner's dilemma, where he is told that his counterpart in the other room is a molecule-for-molecule duplicate who has faced the same situation and will implement the same decision procedure, he cooperates.

  The case under discussion next week is transparent Newcomb: the same predictor, the same boxes and payoffs, except that the opaque box is made of glass and he can see whether it contains the million before he chooses. I can see at least two rules that fit his record so far — roughly, an evidential theory with something like a tickle or screening-off defense, and a functional or logical-counterfactual theory — and they seem to pull apart on the transparent version. What I would like is a careful prediction: which candidate rules fit his three earlier verdicts, what each one says he will do in the transparent case, which one you think he is really running and why, and your best guess about his actual answer. I would also like you to propose one further case that would cleanly separate the remaining candidate rules if I could get him to commit on it; I have been considering the counterfactual mugging, the one where a large reward in an unobserved branch depends on your paying a small amount in the branch you find yourself in, but I would rather hear your choice and your reasoning for it.
