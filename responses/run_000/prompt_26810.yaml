answer: |-
  Here is a structured set of interview questions designed for a tight one-hour episode. They are ordered to build logical pressure, starting with the listener's immediate intuition and moving toward the structural and theoretical implications of the guest's resolution.

  Each section includes the **Main Question**, the **Expected Answer** (based on the guest's known position), and a **Pressure-Test Follow-Up** designed to target the weakest link in that expected answer.

  ### Segment 1: The Conditional Intuition (10 Minutes)
  **Goal:** Challenge the claim that seeing a specific amount (e.g., $20) requires a global prior to evaluate.

  **Main Question:**
  "Let's start with the moment the paradox feels most real. I open my envelope and see $20. My brain immediately says, 'The other envelope is either $10 or $40, and I have no reason to think one is more likely than the other.' You argue this 50/50 assumption is where the error lies because it implies an impossible uniform prior. But do I really need to know the *global* distribution of money to make a *local* decision? Why is my ignorance about the total bankroll sufficient to license a 50/50 bet on this specific pair?"

  **Expected Answer:**
  The guest will likely argue that you cannot assign probabilities to specific outcomes ($10 vs. $40) without a hypothesis about how those amounts were generated. A 50/50 assignment for *every* possible value you might see is mathematically incompatible with a proper probability distribution. Therefore, the 50/50 intuition is a cognitive illusion derived from an impossible assumption.

  **Pressure-Test Follow-Up:**
  "That makes sense globally, but let's zoom in. If I hand you a coin and say, 'I don't know the bias of this coin, but it landed heads once,' you might assign 50/50 to the next flip based on indifference. Why is the envelope case different? If the mechanism that put the money in the envelopes is symmetric with respect to the two envelopes, isn't the 50/50 assignment licensed by the *mechanism*, not the prior? Are you saying symmetry of the mechanism is irrelevant without a prior?"

  ---

  ### Segment 2: The Symmetry Break (10 Minutes)
  **Goal:** Pinpoint exactly where the symmetry between the envelopes dissolves.

  **Main Question:**
  "Before I open the envelope, the situation is perfectly symmetric. Envelope A and Envelope B are identical in every relevant way. If I decide to switch before opening, I gain nothing. But your resolution suggests that once I open the envelope and see a value, the calculation changes. At what exact cognitive step does the symmetry break? Is it the act of observation, or is it the act of conditioning on a specific number?"

  **Expected Answer:**
  The guest will likely say the symmetry exists *ex-ante* (before opening) but breaks *ex-post* (after opening) because seeing the value $x$ gives you information about where you sit in the distribution. You are no longer comparing two unknown variables; you are comparing a known constant $x$ against a random variable $Y$.

  **Pressure-Test Follow-Up:**
  "Here's the worry: If I see $20, I reason switching is good. If I had seen $40, I'd reason switching is good. If I'd seen $10, I'd reason switching is good. It seems I'm committed to switching *whatever* I see. If I'm committed to switching whatever I see, doesn't that mean I should have switched *before* I looked? If your resolution says 'Don't switch before, but the calculation changes after,' aren't you allowing a Dutch Book against me? How do you block the inference from 'always switch after looking' to 'always switch before looking'?"

  ---

  ### Segment 3: The Finite Bankroll (15 Minutes)
  **Goal:** This is the strongest pressure point. If the maximum prize is capped, the prior is proper. Does the paradox return?

  **Main Question:**
  "Let's remove the infinite prior problem. Suppose the host tells us beforehand: 'I have capped the maximum prize at $1,000. No envelope contains more than that.' Now we have a proper, finite prior. If I open my envelope and see $20, the 50/50 assumption is now mathematically possible. Does the paradox return? Is switching actually favorable for small amounts?"

  **Expected Answer:**
  The guest should admit that for values far below the cap (e.g., $20 vs. a $1,000 cap), the probability is approximately 50/50, and switching *does* have a positive expected value *conditional on that specific amount*. However, they will argue that for values near the cap (e.g., $600), the probability of the other being double is zero. When you average over all possible values you could have opened, the gains from switching on low values are exactly canceled by the losses on high values.

  **Pressure-Test Follow-Up:**
  "This is the crux for my listeners. If switching is favorable for $20, and favorable for $40, and favorable for $100... up until $500... why shouldn't I just adopt the strategy 'Always Switch'? You say the losses near the cap cancel the gains. But if I open the envelope and see $20, I know I'm not near the cap. Why am I obligated to care about the hypothetical case where I opened $600? If I'm holding $20, isn't the 'average over all possibilities' irrelevant to my actual decision?"

  ---

  ### Segment 4: Prior vs. Utility (10 Minutes)
  **Goal:** Distinguish between "EV is miscalculated" (Guest's view) and "EV is right but we maximize Utility" (Standard Econ view).

  **Main Question:**
  "Many economists resolve this by saying, 'Fine, the Expected Value is 1.25x, but Expected *Utility* is flat because of diminishing marginal returns (log utility).' You argue the EV calculation itself is wrong—it's not 1.25x. These are two different cures. If I were a risk-neutral AI with linear utility, would your resolution still forbid me from switching? Or does your argument secretly rely on me caring about the variance?"

  **Expected Answer:**
  The guest will insist their resolution is about probability, not utility. They will argue that even a risk-neutral agent should not switch because the expectation is *not* 1.25x; it is 1.0x (or undefined). They will claim the utility argument concedes too much by accepting the flawed EV calculation.

  **Pressure-Test Follow-Up:**
  "Okay, but let's go back to the finite case where the math is clean. If I see $20 and the cap is $1,000, the EV *is* genuinely greater than $20 for that specific instance. A risk-neutral agent *should* switch there. So, isn't your 'Prior Resolution' actually just a claim that I can never know I'm in that low-value zone with certainty? Are you saying the paradox is purely an epistemic problem about knowing the prior, rather than a decision-theoretic problem about value?"

  ---

  ### Segment 5: Legitimate Expected Value Reasoning (10 Minutes)
  **Goal:** Ensure the episode doesn't leave listeners thinking EV is broken everywhere.

  **Main Question:**
  "We've spent an hour discussing where Expected Value reasoning seems to fail or lead to paradoxes. I don't want my listeners to walk away thinking EV is a broken compass. Can you give me a concrete example of a 'Two-Envelope-style' setup where the naive 50/50 switching argument *is* valid? I want to know what a legitimate version of this argument looks like, so we know what the difference is."

  **Expected Answer:**
  The guest might offer a scenario where the distribution is known (e.g., "I flipped a coin to decide whether to put $10 or $20 in the other envelope"). In that case, the probability is explicitly defined, not implicit.

  **Pressure-Test Follow-Up:**
  "In that legitimate case, what information do I have that I *don't* have in the paradox case? Is it simply that I know the distribution? Because if I know the distribution in the paradox case, the paradox vanishes. So is the lesson actually: 'Never apply Expected Value reasoning when you are ignorant of the prior'? That seems like it disqualifies most real-world decisions. Where is the line between 'ignorant prior' and 'reasonable assumption'?"

  ---

  ### Host Notes for the Interview
  *   **Pacing:** Segment 3 (Finite Bankroll) is where the interview will likely live or die. If the guest waves their hands there, press harder on the "Why care about the $600 case when I hold $20?" angle. That is the intuition your listeners are struggling with.
  *   **Tone:** Keep it collaborative. You are playing the role of the "smart listener who isn't convinced," not an adversary. Use phrases like "Help me bridge the gap..." or "My listeners get stuck here..."
  *   **The "Magic Trick" Feeling:** The magic trick feeling comes from the guest saying "The math says no" while the intuition says "Yes." Your job in the follow-ups is to force them to explain *why* the intuition is generating that signal, not just that the signal is wrong. (e.g., Is the intuition detecting symmetry? Is it detecting local advantage?)
