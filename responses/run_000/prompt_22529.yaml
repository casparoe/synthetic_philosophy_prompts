      *   *User's specific phrasing:* "Reductionists say that testimonial justification requires non-testimonial evidence that the source is reliable." This is the standard definition (Hume/Fricker).
      *   *User's distinction:* "Source-external reliability" (fact) vs "Agent-internal warrant" (reason).
      *   *The Twist:* The user argues Reductionists *need* the External fact to be true, but they demand Internal warrant for it. The problem is getting Internal warrant for the External fact without using Testimony.
