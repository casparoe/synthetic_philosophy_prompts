  2.  **Deconstruct the Philosophical Positions:**
      *   **Nagelian Reduction:** Higher-level theories reduce to lower-level theories via bridge laws. Derivation is possible in principle. (Physics $\to$ Chemistry $\to$ Biology).
      *   **Weak Emergence:** Higher-level properties arise from lower-level interactions but are epistemically surprising or computationally irreducible. However, they are ontologically grounded in the base. (Conway's Game of Life gliders).
      *   **Strong Emergence:** Higher-level properties are ontologically distinct and have causal powers not derivable from or reducible to the base level. Downward causation is real. (Consciousness, perhaps).

  3.  **Map to CS Vocabulary:**
      *   *Compilation/Interpretation:* Source code (high level) to Machine code (low level).
      *   *Abstraction Layers:* API, OS, Kernel, Hardware.
      *   *Interface vs. Implementation:* What you see vs. how it works.
      *   *Static Analysis vs. Runtime:* Knowing behavior before running vs. observing execution.
      *   *Turing Completeness:* Computational power equivalence.
      *   *VM vs. Host:* Java VM on Silicon, or emulation.

  4.  **Drafting the Mappings (Iterative Process):**

      *   **Nagelian Reduction:**
          *   *Idea:* High-level code compiles perfectly to low-level assembly. Every high-level construct maps to specific low-level instructions.
          *   *Clean:* Compilation, type safety, deterministic mapping.
          *   *Distortion:* Science isn't syntax; bridge laws aren't just compilers.
          *   *Missing:* Empirical discovery (science) vs. Logical derivation (compilation).

      *   **Weak Emergence:**
          *   *Idea:* You can run the code (simulation), but you can't predict the output via static analysis without running it (computational irreducibility). The "pattern" (e.g., a distributed system consensus) exists only at runtime.
          *   *Clean:* Computational irreducibility, simulation, runtime behavior.
          *   *Distortion:* "Emergence" in CS is usually epistemic (we don't know), whereas philosophical weak emergence sometimes hints at more.
          *   *Missing:* The "novelty" aspect. In CS, the behavior *is* the code executing.

      *   **Strong Emergence:**
          *   *Idea:* The software changes the hardware physics. Or, a VM instruction causes a hardware state that the hardware instruction set doesn't allow.
          *   *Clean:* Downward causation (Software controlling hardware).
          *   *Distortion:* In CS, software *never* breaks hardware laws. It just utilizes them.
          *   *Missing:* Ontological novelty. In CS, everything is ultimately bits flipping.

  5.  **Addressing the Residue Report (The Core Philosophical Question):**
      *   *Question:* Is the lack of CS analog for Strong Emergence a flaw in CS vocabulary or a flaw in Strong Emergence?
      *   *Analysis:* CS systems are designed to be causal closures of the hardware. If software "causes" something, it's via hardware mechanisms. Strong emergence posits *new* causal powers.
      *   *Settled vs. Contested:* It is *settled* that CS systems are causally closed (no magic). It is *contested* in philosophy whether nature is causally closed (physicalism) or if strong emergence exists.
      *   *Verdict:* The vocabulary isn't missing anything; the *concept* of strong emergence violates the design principles of computational systems. This suggests strong emergence is either incoherent or requires a metaphysics CS doesn't capture (e.g., non-physical mind).

  6.  **Refining the Tone and Constraints:**
