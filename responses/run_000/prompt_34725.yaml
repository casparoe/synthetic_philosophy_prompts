      *   Ensure the distinction between epistemic (knowledge) and ontological (reality) emergence is clear in the CS mapping.
      *   *Self-Correction on Nagel:* Nagel's reduction is about *theories*, not just objects. So it's more like proving a high-level spec matches low-level implementation formally.
