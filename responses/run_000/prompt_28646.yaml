      *   **KK Principle:** $Kp \to KKp$ (If you know $p$, you know that you know $p$).
      *   **The Anti-Luminosity Argument (Williamson's Sorites-style argument):**
          *   Assume a state (e.g., feeling cold) is luminous.
          *   Consider a gradual change from feeling cold to not feeling cold.
          *   There must be a boundary where you stop feeling cold.
          *   Because knowledge requires safety (you couldn't easily be wrong), and because your discrimination is imperfect (JNDs), there will be cases near the boundary where you feel cold but can't *know* you feel cold (because you're too close to the not-cold case).
          *   Therefore, luminosity fails.

  3.  **Translate to Cognitive Science/SDT Vocabulary:**
      *   *Mental State:* Internal signal state ($S_{int}$).
