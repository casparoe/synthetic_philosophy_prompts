      *   *Claim 2 (KK):* "First-order detection confidence doesn't guarantee second-order confidence."
      *   *The Argument:* Focus on the "marginal cases." If the signal drifts slowly, the internal noise makes the boundary fuzzy. You can't set a threshold that perfectly captures the state without risking false positives in the neighboring "non-state."

  5.  **Developing the Residue Report:**
