      *   **Task:**
          1.  Brainstorm candidate readings.
          2.  Lay out distinct precise theses (a "menu").
          3.  Evaluate each thesis (Trivial, Substantive/Defensible, or False).
          4.  Identify which reading licenses the instructor's specific moves (dismissing historical origin vs. dismissing normative criticism).
      *   **Persona:** Professional philosopher working on convention and norm evolution.
      *   **Tone:** Rigorous, analytical, pedagogical, nuanced.

  2.  **Brainstorming Candidate Readings of "Arbitrary":**
      *   *Idea 1:* No physical necessity. (We aren't magnets.)
      *   *Idea 2:* Interchangeability. (Left works just as well as Right.)
      *   *Idea 3:* Historical contingency. (It could have gone differently.)
      *   *Idea 4:* Normative emptiness. (No moral weight.)
      *   *Idea 5:* Rational indistinguishability *ex ante*. (Before coordination, no reason to prefer A over B.)
      *   *Idea 6:* Rational indistinguishability *ex post*. (Once established, no reason to switch.)
      *   *Idea 7:* Voluntarism. (We can change it whenever.)

  3.  **Developing the Menu of Theses:**
      *   I need to group these into philosophically distinct categories. Lewis's *Convention* (1969) is the anchor.
      *   *Thesis 1: Metaphysical/Physical Non-Necessity.* (Nature doesn't dictate it.)
      *   *Thesis 2: Functional Equivalence (The Lewisian Core).* (Alternative $R'$ could have solved the coordination problem $S$ just as well as $R$.)
      *   *Thesis 3: Historical Contingency.* (The actual path taken was not determined by law-like necessity.)
      *   *Thesis 4: Normative Neutrality.* (The content of the convention carries no intrinsic moral value.)
      *   *Thesis 5: Rational Revisability.* (We can switch costs-free.)

  4.  **Evaluating the Theses:**
      *   *Thesis 1 (Physical):* Trivially true. Obviously gravity doesn't care about driving sides.
      *   *Thesis 2 (Functional):* Substantive and Defensible (mostly). This is Lewis's definition. *Caveat:* "Just as well" is tricky. Sometimes one side is slightly better due to geography or car design, but *qua* coordination, they are equivalent.
      *   *Thesis 3 (Historical):* Substantive and Defensible. Path dependence matters.
      *   *Thesis 4 (Normative):* False (or at least highly controversial). Conventions often have distributive consequences (e.g., driving on the right favors right-handed sword fighters historically, or specific car manufacturing hubs). They can be unjust.
      *   *Thesis 5 (Revisability):* False. Switching costs are huge (coordination failure during transition).

  5.  **Addressing the Instructor's Moves:**
      *   *Move 1: Dismissing "Why Right not Left?" (Historical/Etiological Question).*
          *   Does "Arbitrary" mean "No cause"? No.
          *   Does it mean "No *rational* preference *ex ante*"? Yes.
          *   The instructor is likely conflating Functional Equivalence (Thesis 2) with Historical Contingency (Thesis 3) to imply the question is pointless. But the question *isn't* pointless for a social scientist. It's a path-dependence question.
          *   *Verdict:* The instructor is misusing the concept to shut down empirical inquiry. Thesis 2 licenses the claim that *either* would work, but not that we shouldn't ask *how* we picked one.
      *   *Move 2: Dismissing "Can it be criticized?" (Normative Question).*
          *   This relies on Thesis 4 (Normative Neutrality).
          *   *Verdict:* This is false. Conventions create winners and losers. "Arbitrary" in the Lewis sense (Functional Equivalence) does *not* imply "Morally Neutral."

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the student's sharp insight. Validate that "arbitrary" is indeed overloaded in the literature and classroom.
      *   **The Menu (The Core):** Present 4-5 distinct theses.
          *   Format: Name, Definition, Evaluation (Trivial/Defensible/False).
      *   **Analyzing the Instructor's Moves:**
          *   Case 1: The Driving Question (Etiology).
