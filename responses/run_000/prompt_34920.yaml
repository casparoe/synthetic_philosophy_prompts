answer: |-
  You have identified a classic problem in the pedagogy of social ontology. The term "arbitrary" is doing far too much heavy lifting in your instructor's discourse, and your suspicion is well-founded: it is sliding between metaphysical, functional, historical, and normative claims that are not equivalent. In the literature following David Lewis's *Convention* (1969), this ambiguity is a known source of confusion, but professional philosophers are usually careful to distinguish these senses. When an instructor collapses them, it tends to shut down fruitful lines of inquiry.

  Below is a menu of the distinct precise theses that "conventions are arbitrary" might express. I have evaluated each based on current consensus in the philosophy of social science. Following the menu, I will analyze your instructor's specific moves.

  ### The Menu of "Arbitrariness" Theses

  #### 1. Metaphysical Non-Necessity
  *   **Thesis:** The regularity constituting the convention is not dictated by the laws of physics, biology, or logic. There is no natural kind constraint forcing agents to behave this way.
  *   **Evaluation:** **Trivial.**
  *   **Commentary:** This is true but uninteresting. Gravity forces apples down; it does not force drivers right. Almost no social scientist disputes this. It establishes that conventions are social, not natural, facts.

  #### 2. Functional Equivalence (The Lewisian Core)
  *   **Thesis:** For any convention $R$ that solves a coordination problem $S$, there exists at least one alternative regularity $R'$ that *could have* solved $S$ equally well, were $R'$ established instead.
  *   **Evaluation:** **Substantive and Defensible.**
  *   **Commentary:** This is the heart of Lewis's definition. It does not mean $R$ and $R'$ are identical in every physical respect, but that they are equivalent *qua* solutions to the coordination problem. However, this is often an idealization. In reality, one side might be slightly safer due to topography or vehicle design, but if the coordination benefit swamps these minor differences, the thesis holds.

  #### 3. Historical Contingency (Path Dependence)
  *   **Thesis:** The actual selection of $R$ over $R'$ was not determined by rational necessity or natural law, but by contingent historical events (e.g., a specific decree, a random fluctuation in early behavior).
  *   **Evaluation:** **Substantive and Defensible.**
  *   **Commentary:** This is an empirical claim about causal history. It is generally true for many conventions (like driving sides), but it is not *analytically* true. Some conventions might be selected because one option was salient (Schelling points) or because of power dynamics. To say it is "contingent" is to say it *could have been otherwise*, which follows from Thesis 2, but explaining *why* it went one way is a valid historical question.

  #### 4. Normative Emptiness
  *   **Thesis:** Because the convention is arbitrary (in the functional sense), the content of the convention carries no intrinsic moral weight, and the convention cannot be criticized as unjust or bad, only as inefficient.
  *   **Evaluation:** **False.**
  *   **Commentary:** This is a non-sequitur. Even if driving on the left is functionally equivalent to driving on the right, the *consequences* of the convention may distribute benefits and burdens unequally. For example, a convention of addressing men as "Mr." and women as "Mrs./Miss" is arbitrary in the Lewisian sense (we could have swapped them), but it is not normatively neutral; it encodes patriarchal structures. Functionality does not entail moral neutrality.

  #### 5. Voluntarist Revisability
  *   **Thesis:** Because the convention rests on no natural necessity, agents can choose to change it at will without significant cost or friction.
  *   **Evaluation:** **False.**
  *   **Commentary:** This ignores transition costs and coordination failure. Even if $R'$ is functionally equivalent to $R$, moving from $R$ to $R'$ requires a period of mismatch where coordination fails (crashes occur while some drive left and some right). Conventions are "sticky" due to network effects, even if they are arbitrary in origin.

  ---

  ### Analysis of Your Instructor's Moves

  Now, let's apply this menu to the two specific classroom incidents you described.

  #### Incident 1: Dismissing the "Why Right not Left?" Question
  *   **The Student's Question:** An etiological/historical question. ("What causal mechanism selected this specific equilibrium?")
  *   **The Instructor's Move:** Dismissing it as the "wrong question" because "conventions are arbitrary."
  *   **Which Thesis is being invoked?** The instructor is conflating **Thesis 2 (Functional Equivalence)** with **Thesis 3 (Historical Contingency)** to imply that because there was no *rational necessity* for "Right," there is no *causal explanation* for "Right."
  *   **Verdict:** **Philosophically Sloppy.**
      *   If the student is asking, "Is there a law of the universe that makes Right better?", the instructor is right (Thesis 1 & 2).
      *   If the student is asking, "How did this specific equilibrium get selected historically?", the instructor is wrong. Social science is precisely the study of how contingent equilibria are selected and stabilized. To say "it's arbitrary" in the sense of Thesis 2 does not license ignoring the historical sociology of the selection process. The instructor is using the *lack of rational necessity* to dismiss the *presence of causal history*.

  #### Incident 2: Dismissing the "Bad Convention?" Question
  *   **The Student's Question:** A normative question. ("Does this convention have moral defects?")
  *   **The Instructor's Move:** Dismissing it because "conventions are arbitrary."
  *   **Which Thesis is being invoked?** This relies entirely on **Thesis 4 (Normative Emptiness)**.
  *   **Verdict:** **False.**
      *   This is a category error. Lewis-style arbitrariness concerns the *relationship between the problem and the solution* (could another solution have worked?). It says nothing about the *distributional consequences* of that solution.
      *   To support this dismissal, the instructor would need to argue that because the convention *could have been otherwise*, it *ought not to be judged*. But many things that could have been otherwise are subject to moral critique (e.g., laws, institutions). The fact that a norm is a convention does not immunize it from ethical evaluation.

  ### Summary and Advice

  Your instructor is using "arbitrary" as a conversation-stopper that conflates **functional interchangeability** with **normative insignificance** and **historical unexplainability**.

  *   **To license dismissing the "Why Right?" question:** The instructor would need to argue that because the choice was functionally arbitrary (Thesis 2), the historical cause is irrelevant to the *status* of the convention. While the history doesn't change the *definition* of the convention, it is not the "wrong question" for a social scientist.
  *   **To license dismissing the "Bad Convention?" question:** The instructor would need Thesis 4 to be true. Since Thesis 4 is false, this move is unsupported.

  **How to engage:**
  If you wish to push back respectfully, you might frame it using the Lewisian distinction between *ex ante* and *ex post* rationality.
  1.  **Ex Ante:** Before the convention is established, the choice between Left and Right is arbitrary (Thesis 2).
  2.  **Ex Post:** Once established, the convention generates genuine reasons for action (expectations, reliance).
  3.  **Normative:** The existence of those reasons does not preclude moral evaluation of the convention's effects.

  You might ask: *"Professor, I understand that Lewis means 'arbitrary' in the sense of Functional Equivalence (that Left could have worked). But does that functional equivalence entail that we cannot ask about the historical causes of the selection, or that the selected convention lacks distributive consequences we might critique? It seems Thesis 2 doesn't automatically grant Thesis 4."*

  This shows you understand the core theory while identifying the overextension.
