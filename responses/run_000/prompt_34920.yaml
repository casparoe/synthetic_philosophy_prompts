      *   Evaluate each? (Yes).
      *   Address the two specific classroom incidents? (Yes).
      *   Professional philosopher persona? (Yes).

  *(Self-Correction during drafting)*: I should make sure to mention Ullmann-Margalit or Sugden as well, as they expand on Lewis. But keep the focus on Lewis since the prompt specifies "Lewis-style." I need to be careful not to say Lewis's definition is *wrong*, but that the instructor is overextending it.

  Let's finalize the Menu:
  1.  **Metaphysical Arbitrariness** (Nature doesn't care).
  2.  **Functional Equivalence** (Alternatives exist).
  3.  **Historical Indeterminacy** (Chance determined the outcome).
  4.  **Normative Emptiness** (No moral content).
  5.  **Voluntarist Revisability** (Easy to change).

