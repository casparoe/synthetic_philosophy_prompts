answer: |-
  It is a genuine pleasure to speak with someone who has spent three decades in the trenches of psychophysics. Your skepticism is not only well-founded; it places you in the company of some of the most rigorous contemporary vision scientists. In fact, the landmark 2016 behavioral and brain sciences target article by Firestone & Scholl, *"Cognition Does Not Affect Perception,"* essentially argues your exact point: that most putative cases of cognitive penetration (CP) are actually methodological artifacts, demand characteristics, or response biases.

  However, to answer your question directly: **The reason the book isn't closed is that double-blind controls solve a different problem than the one philosophers are worried about.**

  Here is the breakdown of why your methodological intuition is correct but incomplete, why the debate persists, and what a "definitive" study would actually look like.

  ### 1. The Category Error: Experimenter vs. Subject Cognition
  You mentioned that the remedy for CP ought to be "tight double-blind controls, randomised stimulus ordering, a neutral experimenter."

  This is where the friction lies.
  *   **Double-blind controls** prevent the *experimenter's* expectations from leaking to the *subject* (the Rosenthal effect).
  *   **Cognitive Penetration** claims that the *subject's own* cognitive states (beliefs, concepts, desires) leak into the *subject's own* perceptual processing.

  A double-blind design ensures *you* aren't telling them what to see. It does not prevent *them* from telling *themselves* what to see. If a subject genuinely believes a gray patch is green because they were told it belongs to a "grass" category, a double-blind protocol won't stop that internal cognitive state from potentially altering their visual experience.

  The methodological challenge isn't experimenter hygiene; it is **dissociating perceptual sensitivity from decision criteria.**

  ### 2. The Real Methodological Hurdle: $d'$ vs. $\beta$
  As you know, in Signal Detection Theory (SDT), performance is a function of sensitivity ($d'$) and response criterion ($\beta$).
  *   **The Bias Account (Your view):** Cognition changes $\beta$. The subject sees the same sensory data but shifts their threshold for reporting "I saw X" based on expectation. This is a post-perceptual judgment effect.
  *   **The CP Account:** Cognition changes $d'$. The sensory signal itself is amplified or altered before it reaches the decision stage.

  Most early "New Look" psychology (Bruner et al.) failed because they didn't use SDT. They showed that hungry children saw coins as larger. But were their retinas or V1 processing differently, or did they just guess "bigger" more often?

  **Why hasn't this been closed?** Because even with SDT, there is a "measurement problem." To measure $d'$, you need a report. To make a report, you need cognition. If cognition is involved in the report, how do you prove it wasn't involved in the perception? This is the **Post-Perceptual Bottleneck.**

  ### 3. Designing the "Definitive" Study
  If you were to design a study to satisfy both the methodologist and the philosopher, it would need to bypass explicit reporting and isolate early visual processing. Here is the gold-standard architecture:

  **A. Implicit Measures (No Explicit Report)**
  Instead of asking "What did you see?", use a task where the perceptual outcome drives an action that is hard to cognitively manipulate.
  *   *Example:* A grip-aperture task. If a subject reaches for an object they believe is heavy (but is light), does their hand open differently *before* contact? (Goodale & Milner style).
  *   *Example:* Priming. If seeing a word "doctor" speeds up recognition of "nurse," is that semantic priming (cognitive) or perceptual facilitation? You need to vary the SOA (Stimulus Onset Asynchrony) to catch the effect in the first 100ms.

  **B. Physiological Markers of Early Vision**
  You need to measure the sensory cortex, not the motor output.
  *   *fMRI/EEG:* If a subject expects a red grating, do you see increased activity in V1/V2 specifically tuned to red wavelengths *before* the decision is made?
  *   *The Counter:* Skeptics argue this is just **top-down attention**. Attention is universally accepted as modulating early vision. CP proponents must show the effect is *semantic* or *conceptual*, not just spatial or feature-based attention.

  **C. The "Dissociation" Design**
  You need a condition where cognition and perception are pitted against each other.
  *   *Design:* Create a stimulus that is perceptually ambiguous (e.g., a Necker cube or a color on the boundary of blue/green).
  *   *Manipulation:* Induce a belief ("This is usually blue").
  *   *Measure:* Use a continuous measure (eye tracking, pupil dilation, or steady-state visual evoked potentials) rather than a binary button press.
  *   *Control:* Use a "catch" condition where the belief is explicitly wrong, to see if the perceptual system overrides the cognition (encapsulation) or follows it (penetration).

  ### 4. Why the Debate Persists (The Philosophical Stake)
  You asked why this is treated as a philosophical controversy rather than a lab-hygiene issue. It is because the stakes are **epistemological**, not just empirical.

  *   **Modularity (Fodor):** If perception is cognitively impenetrable, it serves as an objective check on our beliefs. It is the "given" in experience.
  *   **Coherentism:** If perception is penetrable, then our beliefs shape the very evidence we use to test those beliefs. This risks circularity.

  Philosophers care because if CP is real, **perception cannot justify belief** in the way classical empiricism requires. If I believe the world is safe, and that belief makes the dark alley *look* safer, my perception is no longer an independent witness.

  ### 5. Summary: Why the Book Isn't Closed
  1.  **Some effects survive strict controls:** There are a handful of studies (e.g., Lupyan's work on language labeling affecting simple feature detection) that use SDT and implicit measures and still find effects. Skeptics argue these are still attentional, but the line between "attention" and "penetration" is blurry.
  2.  **Definition of "Perception":** Neuroscientists often define perception as "V1 activity." Philosophers define it as "phenomenal experience." You can have V1 modulation without a change in what it *feels like* to see.
  3.  **The "Leak" is Hard to Plug:** As long as the subject has to communicate what they saw, cognition is involved. We haven't invented a "phenomenal oscilloscope" yet.

  ### Recommendation
  Given your background, you would likely find the **Firestone & Scholl (2016)** review validating. They systematically dismantle 10 categories of CP claims, attributing almost all of them to the exact methodological confounds you spent your career controlling for (demand characteristics, response bias, ambiguous stimuli).

  The debate remains open not because the methodology is unsolved, but because the **interpretation of the residual variance** is philosophical. When you control for bias, attention, and memory, and a tiny effect remains: Is that *penetration*, or just unmeasured *noise*?

  **The Verdict:** You are right to treat it as a hygiene issue first. Most claims of CP fail the "lab hygiene" test. But the few that pass it force us to confront whether the mind is modular, which is why the philosophers won't let it go.
