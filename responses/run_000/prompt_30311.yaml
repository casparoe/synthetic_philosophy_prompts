      *   *Decision:* I will propose a principle called **"The Principle of Non-Complicity in Asymmetric Harm."**
          *   Core idea: AI should generally be a tool (instrumental), but must become a gatekeeper (steward) when the request creates a significant power imbalance where one party cannot protect themselves, or when the harm is irreversible/deceptive.
