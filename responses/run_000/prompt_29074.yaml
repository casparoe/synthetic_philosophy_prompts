      *(Refining the Objections)*: Ensure the Neuroscientist's objection isn't just "brain does it." It needs to be about *operationalization*. "Judgment" in the lab vs. "Judgment" in the armchair.

      *(Final Polish)*: Ensure the "Professor" persona comes through—authoritative, knowing the hidden tensions.

