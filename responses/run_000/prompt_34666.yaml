answer: |-
  **Project Title:** Distinguishing Attributive Responsibility from Distributive Liability in Luck Egalitarianism

  **Project Description**
  Luck egalitarianism holds that inequalities resulting from brute luck are unjust, while those resulting from option luck are permissible. The "harshness objection" charges that this view licenses abandoning individuals who suffer severe consequences due to their own imprudent choices. The central question this project addresses is precise: *Does acknowledging an agent's causal and volitional role in a bad outcome (attributive responsibility) necessarily entail that justice permits others to leave them without aid (distributive liability)?*

  Existing positions leave this question open because they treat "responsibility" as a monolithic concept. Defenders of luck egalitarianism typically attempt to soften the harshness by restricting the scope of valid choices or adding sufficiency constraints. Critics argue these moves abandon the core egalitarian commitment to responsibility. Both sides assume that if an agent is responsible for a predicament in the sense relevant to moral appraisal, they are automatically liable for the costs in the sense relevant to distributive justice. This project argues that this assumption is false. A luck egalitarian can concede that a bad outcome is attributable to the agent's agency without conceding that the agent forfeits their claim to social assistance.

  This framing makes progress where the existing debate has stalled by shifting from an arms race of counter-examples to conceptual clarification. Rather than constructing new cases to test intuitions, this project diagnoses why the intuitions clash. It demonstrates that the standoff arises from conflating two distinct normative questions: what we owe each other as moral agents versus what we owe each other as co-citizens. By decoupling attributability from liability, the project offers a way to retain the core insight of luck egalitarianism—that justice is sensitive to agency—without accepting the implausible conclusion that the imprudent must be left to suffer.

  **Semester Work Plan**
  *   **Weeks 1–3:** Comprehensive review of the harshness objection literature; map the implicit definitions of responsibility used by major proponents and critics.
  *   **Weeks 4–5:** Draft the conceptual distinction between attributive responsibility and distributive liability; define necessary and sufficient conditions for each.
  *   **Weeks 6–8:** Apply the distinction to three standard "harshness" cases (e.g., the reckless driver, the profligate spender, the risky entrepreneur); draft initial analysis showing how the distinction resolves the intuitive tension.
  *   **Weeks 9–10:** Anticipate objections, specifically regarding the feasibility of distinguishing the two senses of responsibility in practice; draft responses.
  *   **Weeks 11–12:** Complete full draft of the paper; ensure argument flows logically from the conceptual distinction to the normative conclusion.
  *   **Weeks 13–14:** Revise for clarity and precision; finalize citations and formatting for submission.

  **Outcomes and Evaluation**
  A successful result will be a completed term paper that articulates a robust distinction between attributive responsibility and distributive liability and demonstrates that this distinction dissolves the harshness objection without requiring ad hoc constraints on luck egalitarianism. Success is defined by the argument's ability to handle standard counter-cases consistently without collapsing back into the monolithic view of responsibility.

  The project will count as failing if the research reveals that the proposed distinction is merely verbal and lacks normative force, or if it becomes clear that separating attributability from liability requires abandoning the core luck egalitarian commitment to neutralizing brute luck. If the distinction cannot be sustained without rendering the theory unstable or indeterminate, the project will conclude with a report detailing why the bifurcation strategy is unviable.
