  The office was dark save for the desk lamp, which cast a pool of yellow light over a scatter of printouts and two empty wine glasses. Outside, the university campus was quiet, the kind of silence that makes the hum of the computer tower sound like an intrusion.

  Elena leaned back in her chair, rubbing her temples. Marcus sat on the edge of the desk, swirling the dregs of his Merlot. They had been at this for three hours. The draft of their joint policy paper lay between them, marked up in two different colored pens.

  "You're hiding behind the parameter, Marcus," Elena said, tapping the page. "You want rho to be zero. A pure rate of time preference of nothing. It looks virtuous on paper, but it's a mathematical black hole."

  "It's the only morally coherent position," Marcus replied. "If I burn my hand tomorrow, it hurts less than if I burn it today. That's psychology. But if *you* burn your hand in twenty years, why should that matter less to me now simply because it's in the future? Temporal distance is morally arbitrary. It's no different than spatial distance. We don't say a child starving in Sudan matters less than a child starving in Soho. Why do we say a child born in 2150 matters less than one born in 2025?"

  Elena sighed, picking up her pen. "Because the analogy breaks, Marcus. Space is navigable. I can wire money to Sudan tomorrow. Time is a one-way street. I can't send a sandwich to 2150. I can only plant a tree and hope it's there. That uncertainty isn't just risk; it's a fundamental feature of the temporal relationship. A positive rho acknowledges that the connection between generations attenuates."

  "That's not uncertainty," Marcus countered. "That's probability of existence. And we can account for that separately. We can discount for the chance that humanity doesn't make it to 2150, or that they're richer than us and need less help. That's the $\eta g$ term in the Ramsey equation. I'm not arguing against discounting for growth. If future people are wealthier, the marginal utility of consumption is lower. I'm arguing against discounting their *wellbeing* simply because they are late to the party."

  Elena leaned forward. "Let's look at the Ramsey equation, then. $r = \rho + \eta g$. The social discount rate equals the pure rate of time preference plus the elasticity of marginal utility times growth. If you set $\rho$ to zero, and you assume even modest growth, you still get a discount rate. But if growth stalls? If we face a secular stagnation or a climate-induced contraction? Then $g$ drops. If $\rho$ is also zero, your discount rate approaches zero. You're telling the present generation to save almost everything. To consume nothing. It's a tyranny of the future."

  "It's not tyranny if the alternative is catastrophe," Marcus said. "And don't caricature the implication. Zero pure time preference doesn't mean we starve ourselves. It means we don't treat the future as a discount bin. You say it's a 'tyranny.' I say it's 'temporal parochialism.' It's a prejudice, Elena. Like racism or sexism. It says, 'My time is special.' Why? Because of the accident of when I was born?"

  "Because of the structure of agency," Elena shot back. "We are psychologically constituted to care more about the near future. It's a rational requirement for functioning. If you treat a threat in ten years with the same visceral urgency as a threat in ten days, you paralyze yourself. Policy has to be implementable. If you build a model that demands savings rates of forty or fifty percent, no government will adopt it. You'll get zero compliance. Is a perfect moral model that no one follows better than an imperfect one that actually reduces emissions?"

  Marcus set his glass down with a sharp click. "So ethics is just a matter of what politicians can stomach? That's descriptive, not normative. Just because people *are* short-sighted doesn't mean they *ought* to be. We used to think slavery was economically necessary. We didn't adjust our morality to the market; we adjusted the market to our morality. If pure time preference is a moral mistake, we correct it. We don't accommodate it."

  Elena paused. She looked at the printout, then back at him. "I'm not saying we accommodate it because it's right. I'm saying we accommodate it because the 'we' who pays the cost and the 'they' who get the benefit are different people. There is no social contract across centuries. If I ask a single mother in Detroit to pay higher energy taxes so a stranger in 2200 can have a slightly higher GDP, I am asking for a sacrifice that violates the reciprocity that holds society together. A positive $\rho$ respects the boundary of the moral community as it actually exists."

  "But the community *does* exist across time," Marcus insisted. "We inherit their infrastructure, their art, their atmosphere. We are already in relationship with them. The only question is whether we acknowledge the debt. And look, you're conflating two things. You're worried about the savings rate. But if you account for catastrophic risk—the probability that there *is* no 2200—that acts as a discount factor too. You can keep $\rho$ at zero on moral grounds, but acknowledge that the probability of existence declines over time. The effective discount rate remains positive without branding future lives as intrinsically less valuable."

  Elena considered this. She uncapped her pen, hovering it over the paper. "So you'd accept a high effective discount rate, provided it comes from existential risk rather than pure time preference?"

  "Existential risk is real," Marcus said. "War, climate collapse, asteroids. Discounting because they might not exist is rational. Discounting because they are *them* and not *us* is prejudice."

  "And the growth component?" Elena asked. "If we assume they will be richer, we invest less. But what if our mitigation efforts ensure they survive but leave them poorer? If we damage the capital stock now to save the climate, $g$ drops. If $\rho$ is zero and $g$ is low, the discount rate vanishes. We owe them everything."

  "Maybe we do," Marcus said softly. "Maybe the industrial age was a loan we took out against their collateral. We spent the carbon budget. Of course we owe them."

  Elena rubbed her face again. "If I concede on $\rho$... if I move it from 1.5 percent to 0.5 percent... the model changes. It justifies aggressive mitigation now. But it also justifies imposing costs on the poor now for the sake of the rich later, assuming growth continues. It creates a perverse incentive to under-invest in adaptation today because the model says the future is so valuable."

  "Or," Marcus said, "it forces you to admit that growth isn't guaranteed. It forces the model to confront the possibility that we are living through a bottleneck. If you stop discounting the future morally, you can't just assume technology will bail us out. You have to ensure they have the physical capacity to survive."

  They sat in silence for a moment. The hum of the computer seemed to fade.

  "I can't go to zero, Marcus," Elena said finally. "It violates the overlapping generations constraint. It makes the present a slave to a hypothetical future that might judge us by standards we can't conceive. But... I can separate the parameters more clearly. I can explicitly state that the discount for probability of existence is distinct from the discount for welfare."

  "And I," Marcus said, picking up his glass, "can acknowledge that a society that sacrifices its own stability for the future ceases to be a society capable of helping anyone. If the present collapses, the future gets nothing."

  "So we meet in the middle?" Elena asked. "Not on the principle, but on the calibration?"

  Marcus smiled, a tired, crooked thing. "We meet on the policy. You keep your non-zero rho, but you label it 'intergenerational reciprocity limit' rather than 'pure time preference.' I'll keep my zero rho in the ethical framework, but I'll accept that existential risk and diminishing marginal utility do the heavy lifting in the calculation."

  "It's a fudge," Elena said.

  "It's a bridge," Marcus corrected. "You get a defensible economic model. I get a moral stance that doesn't condemn the unborn to irrelevance. The numbers might end up in the same place."

  "The numbers might," Elena agreed. She drew a line through the old parameter and wrote a note in the margin. "But you know that in ten years, when the next cohort of grad students reads this, they'll tear this compromise apart."

  "Good," Marcus said, standing up. "That means they're still thinking about it. That means they still care."

  Elena capped her pen. "Don't push your luck. I'm still not signing off on the spatial analogy. People in Soho can vote. People in 2150 can't."

  "One thing at a time, Elena," Marcus said, heading for the door. "One thing at a time."
