answer: |-
  Your debate is stalled because it's attempting to force a non-systematic, practical soteriological path into a Western meta-ethical category it wasn't designed to fit, compounded by unexamined assumptions about what makes a classification "correct."

  Here's the diagnosis and reasoning:

  1.  **The Core Problem: Misplaced Categorization:** Buddhist ethics primarily functions as a *path* to liberation (nirvana/dukkha cessation), not as a freestanding theory justifying moral norms. The "disagreement" arises from projecting Western meta-ethical frameworks (consequentialism vs. virtue ethics) onto a tradition whose primary concern is transformative practice, not theoretical classification. Insisting on a single label is the initial error.

  2.  **Equivocation on "Consequentialism" (Your Hypothesis is Partially Right):** You correctly identify that "consequentialism" bundles distinct elements (value theory, criterion of rightness, agent standpoint). The standoff occurs because:
      *   **Consequentialism in Value/Aim:** Buddhist ethics *is* strongly oriented toward the *telos* of reducing/ending dukkha. This resonates with consequentialism's focus on outcomes.
      *   **Non-Consequentialism in Means/Agent-Centricity:** The *means* to that end are intrinsically agent-focused: purifying intention (cetanā), eliminating defilements (kleshas), cultivating virtues (paramitas), and adhering to precepts/vows as constitutive of the path itself. This resonates with virtue ethics and deontology. The bodhisattva vow manifests *as* perfected virtue/compassion, not *as* an optimizing calculation.
      *   **The Sticking Point:** Proponents prioritize one aspect. Consequentialist-leaning interpreters see the shared *telos* as definitive. Virtue-leaning interpreters see the agent-centric *methodology and norms* as definitive. Neither side adequately addresses why their chosen aspect *must* define the category.

  3.  **Differencing Weighting is Symptomatic, Not Causal:** You note the camps weight different texts (e.g., Mahāyāna sutras emphasizing universal compassion vs. Vinaya/early texts emphasizing individual discipline). This isn't just cherry-picking; it stems from the *prior* assumption about what aspect of ethics (goal vs. means) is essential for classification. The textual differences provide *evidence*, but the selection is driven by the implicit meta-ethical commitment.

  4.  **Substantive Disagreement Masked by Verbal Dispute:** There *is* a substantive disagreement about the nature of Buddhist practice: Is the path fundamentally *about* producing a state of affairs (less suffering) or *about* the transformation of the agent's mind? However, this substantive debate gets obscured by the *verbal* dispute over which Western label ("consequentialist" or "virtue ethicist") should be applied to the *whole*, based on which feature is deemed essential.

  5.  **Progress Requires Abandoning the Classification Quest:**
      *   **Distinction:** Explicitly unbundle "consequentialism" (and "virtue ethics") into specific components (value theory, norm structure, agent's role, criterion of rightness) and map Buddhist elements to these *separately*. Acknowledge it fits different components of *different* Western theories.
      *   **Reformulated Question:** Shift from "Which Western theory does it fit?" to "How do the various elements of the Buddhist path (goal, virtues, precepts, intention, vows, compassion) function *together* within its soteriological framework?" or "What are the *conditions* under which different aspects (e.g., precepts as rules of thumb vs. inviolable vows) become salient?"
      *   **Accept Plural Framings:** Recognize that different Western lenses can illuminate *different, valid aspects* of the complex Buddhist path without any single lens capturing the whole. The bodhisattva's compassion *can* be analyzed through a consequentialist lens regarding its *scope* and *ultimate aim*, while the *cultivation* and *embodiment* of that compassion is best analyzed through virtue ethics.
      *   **Conclusion:** No single Western meta-ethical label *should* be expected to fit the Buddhist path coherently because it wasn't constructed to answer the questions those theories pose. The expectation of a singular classification is the ill-posed question.

  **Bottom Line:** The standoff results from a category error (applying an alien taxonomic framework) and the conflation of distinct elements within "consequentialism," creating a false dichotomy where both sides capture genuine but partial aspects of a multifaceted, practice-oriented path not designed for such classification. Progress lies in abandoning the search for a singular label.
