answer: |-
  ### Exam Prompt (Grad Seminar: Belief Revision & Formal Epistemology)  
  **Time:** 90 minutes  
  **Expected length:** ~700 words  
  **Total marks:** 25  

  ---

  **Scenario:** Dr. Aris Thorne, a climate scientist, updates her credences over three climate models:  
  - **M₁**: Stable climate (no warming)  
  - **M₂**: Slow warming (≈1.5°C/century)  
  - **M₃**: Fast warming (≈2.5°C/century)  

  Her prior credence is uniform: **P(M₁) = P(M₂) = P(M₃) = 1/3**.  
  She receives a satellite temperature reading. The instrument outputs a *graded interval* with internal confidence weights:  
  - **70% confidence** that the true temp is in **[1.5°C, 2.0°C]**  
  - **30% confidence** that it is in **[2.0°C, 2.5°C]**  

  Each model predicts a different probability distribution over temperatures:  
  - **M₁** assigns high prob to [1.5, 2.0], near-zero to [2.0, 2.5]  
  - **M₂** spreads mass across both intervals  
  - **M₃** assigns near-zero to [1.5, 2.0], high prob to [2.0, 2.5]  

  ---

  **Question:**  
  **(a)** Explain why this requires **Jeffrey conditionalization**, not ordinary Bayesian conditioning on a single evidence proposition. (5 marks)  

  **(b)** Apply Jeffrey’s rule using the partition **{E₁: [1.5, 2.0], E₂: [2.0, 2.5]}**. Write the update equation for **Pₙₑ𝓌(Mᵢ)** with all terms (including the 70/30 weights). Do *not* compute decimals—show the structure. (5 marks)  

  **(c)** A student argues: *"The satellite gave 70% to E₁, so just do Bayes: Pₙₑ𝓌(Mᵢ) = P(Mᵢ|E₁) using the prior P(E₁)."*  
  **Diagnose the error:** Where does this slip? Explain why the 70% is *not* the prior P(E₁). (5 marks)  

  **(d)** Discuss the **granularity objection**:  
  - If Aris splits the range into **three bins** (e.g., [1.5,1.8], [1.8,2.2], [2.2,2.5]), her M₁/M₂/M₃ posteriors might change. What constrains her partition choice?  
  - Tie your answer to the need for an **exhaustive, exclusive calibration convention** in continuous evidence spaces. Why does this matter for scientific objectivity?  
  - Check if the **"hypothesis-independence"** assumption holds here: Could the instrument’s calibration error depend on the warming rate (M₁/M₂/M₃)? Why might this violate Jeffrey’s framework? (10 marks)  

  ---

  ### Model Answer (~600 words)  
  **(a)** Ordinary Bayesian conditioning requires a *single, certain evidence proposition* (e.g., "E₁ is true"). Here, the satellite delivers *graded confidence* over intervals (70%/30%), leaving Aris uncertain about which exact interval contains the true temp. Jeffrey conditionalization handles this by updating priors directly over a *partition* of the evidence space, using new posterior weights (here, 70/30) instead of certain evidence.  

  **(b)** Jeffrey’s rule updates each Mᵢ as:  
  **Pₙₑ𝓌(Mᵢ) = σⱼ [ P(Mᵢ | Eⱼ) × Q(Eⱼ) ]**  
  where Q(Eⱼ) is the *new* posterior weight for Eⱼ (Q(E₁)=0.7, Q(E₂)=0.3), and P(Mᵢ | Eⱼ) is computed via Bayes:  
  **P(Mᵢ | Eⱼ) = [ P(Eⱼ | Mᵢ) × Pₒₗ𝒹(Mᵢ) ] / P(Eⱼ)**  
  with **P(Eⱼ) = σₖ [ P(Eⱼ | Mₖ) × Pₒₗ𝒹(Mₖ) ]**.  
  So for Mᵢ:  
  **Pₙₑ𝓌(Mᵢ) = [ P(Mᵢ | E₁)×0.7 + P(Mᵢ | E₂)×0.3 ]**  
  The 70/30 weights enter as coefficients in the weighted sum. No Bayesian conditioning on E₁ or E₂ alone occurs.  

  **(c)** The student’s error lies in misinterpreting the **70% as P(E₁)** (the prior probability of E₁). But the 70% is Aris’s *posterior confidence* in E₁ *after* seeing the satellite output. The student treats it as a *likelihood* (P(output | E₁)) or prior (P(E₁)), but it is neither—it’s the *output* of Aris’s updating. Using Bayes with P(E₁) ignores that the 70% already *incorporates* all evidence; conditioning again on E₁ would double-count it and ignore the 30% weight on E₂.  

  **(d)** **Granularity objection:** Jeffrey’s rule is partition-dependent. If Aris uses finer bins (e.g., three intervals), the Q(Eⱼ) weights change (e.g., 40% on [1.5,1.8], 30% on [1.8,2.2], 30% on [2.2,2.5]), altering Pₙₑ𝓌(Mᵢ). This demands a calibration convention: partitions must be **exhaustive and exclusive** relative to the instrument’s design. For objectivity, scientists must pre-commit to bins matching the instrument’s resolution (e.g., its "confidence buckets")—arbitrary splits introduce subjectivity.  

  **Hypothesis-independence:** Jeffrey assumes Q(Eⱼ) is *fixed* regardless of Mᵢ. But if the satellite’s calibration error *depends* on warming rates (e.g., M₃ causes systemic instrument drift), Q(Eⱼ) might differ by hypothesis. For example, if M₃ makes the satellite overestimate temps, the 70/30 weights aren’t "stable" across models. This violates Jeffrey’s core assumption, potentially biasing updates. Aris must check if the instrument’s reliability is hypothesis-neutral.  

  ---

  ### Marking Scheme (25 total)  
  | **Key Point**                                | **Marks** | **Typical Mistake**                              |
  |----------------------------------------------|-----------|--------------------------------------------------|
  | **(a) Clear distinction: uncertain evidence vs. certain proposition** | 5 | Confuses Jeffrey with Bayes without specifying "no single E" |  
  | **(b) Correct equation w/ weights as coefficients in sum over j** | 5 | Omits Q(Eⱼ) weights or misplaces them in denominator |  
  | **(c) Identifies conflation of posterior Q(E₁) w/ prior P(E₁)** | 5 | Claims error is "ignoring E₂" without explaining Q(Eⱼ) status |  
  | **(d1) Explains granularity ↔ partition sensitivity + need for convention** | 4 | Fails to link partition choice to calibration conventions |  
  | **(d2) Notes H-independence risk + instrument reliability dependency** | 6 | Overlooks that calibration error could vary by model |  

  *(Total: 5+5+5+4+6 = 25)*
