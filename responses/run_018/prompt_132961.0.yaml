answer: |-
  ### Structured Role-Play: "The Riverbend Water Accord"  
  **Core Tension:** Obligation-to-reciprocate vs. impartiality-norm frameworks. Participants experience how the same act can be simultaneously seen as legitimate reciprocity *and* corruption.  

  ---

  ### **1. Roles & Group Assignments (18 Participants)**  
  - **Riverbend Council (6)**: Local officials voting on water rights. *Framework: Obligation-to-reciprocate*.  
  - **Clan Representatives (6)**: 3 from Clan A (upstream farmers), 3 from Clan B (downstream fishers). *Framework: Obligation-to-reciprocate*.  
  - **Global Integrity Auditors (6)**: External monitors. *Framework: Impartiality-norm*.  

  ---

  ### **2. Staged Scenario**  
  **Context**: Riverbend district must allocate water access for the dry season. Two clans compete:  
  - **Clan A** (livestock herders) needs water for animals.  
  - **Clan B** (fishers) needs water for river flow.  

  **The Hybrid Exchange**:  
  - **Gift**: "Unity Goats" (one from Clan A, one from Clan B).  
    - **Public element**: Goats are presented openly to the *whole council* as a "shared community sacrifice."  
    - **Private element**: Each goat wears a collar with a **personalized brass tag** engraved with a councilor’s name (e.g., "For Elder Maya’s Leadership"). Tags are distributed by clan reps during the ceremony.  
  - **Hidden Stakes**:  
    - *Councilors know*: Refusing the tag insults the clan; accepting it creates a debt.  
    - *Clan reps know*: Tags signal "remember who honors you."  
    - *Auditors don’t know*: Tags are sacred symbols in Riverbend (revealed later).  

  **Vote Options**:  
  - **Option 1**: Prioritize livestock (60% water to Clan A).  
  - **Option 2**: Prioritize fisheries (60% water to Clan B).  

  ---

  ### **3. Rules & Hidden Information**  
  - **Asymmetric Knowledge**:  
    - **Riverbend Groups (Council/Clans)**: Given a note: *"In Riverbend, personalized gifts bind leaders and kin. Refusal sparks feuds; acceptance requires future loyalty."*  
    - **Auditors**: Given a note: *"Any gift linked to a public decision is corrupt. Document violations."*  
  - **Evaluation Rules**:  
    - **Phase 1**: Groups assess the goat/tag exchange *internally* using their framework.  
    - **Phase 2**: Mixed teams apply a **universal standard**: *"Corruption = Any private benefit influencing public duty."*  

  ---

  ### **4. Payoff System (Non-Monetary)**  
  - **Councilors**: Gain/lose **"Community Trust"** (CT) points (0–10).  
    - *+5 CT* if clans rate their vote "fair"; *-5 CT* if auditors declare process "corrupt."  
  - **Clan Reps**: Gain/lose **"Clan Honor"** (CH) points (0–10).  
    - *+5 CH* if their clan’s priority wins; *-5 CH* if auditors reject the gift.  
  - **Auditors**: Gain/lose **"Legitimacy Credibility"** (LC) points (0–10).  
    - *+5 LC* if Riverbend accepts their ruling; *-5 LC* if clans/council ignore them.  

  **Scores recorded publicly**.  

  ---

  ### **5. Timeline (75 Minutes)**  
  | Time          | Activity                                                                                                                                 |  
  |---------------|------------------------------------------------------------------------------------------------------------------------------------------|  
  | **0:00–0:10** | **Setup**: Assign roles. Explain water crisis. Distribute hidden framework notes.                                                        |  
  | **0:10–0:25** | **Gift & Vote**: Clan reps present goats/tags. Council deliberates/votes. Auditors observe.                                              |  
  | **0:25–0:35** | **Group Evaluation**: Council/clans (together) justify gift under reciprocity. Auditors (alone) declare corruption. Record initial scores. |  
  | **0:35–0:50** | **Universal Standard**: Form trios (1 council, 1 clan rep, 1 auditor). Classify 3 exchanges using universal standard:                   |  
  |               | - *Exchange 1*: The goat/tag ceremony.                                                                                                  |  
  |               | - *Exchange 2*: A covert cash bribe (clearly corrupt control).                                                                          |  
  |               | - *Exchange 3*: A public feast for all councilors *after* the vote (clearly legitimate control).                                        |  
  | **0:50–1:05** | **Conflict & Negotiation**: Trios debate classifications. Facilitator forces consensus. Re-score payoffs based on outcomes.              |  
  | **1:05–1:15** | **Debrief**: Conceptual mapping (see below).                                                                                            |  

  ---

  ### **6. Debrief Mapping**  
  Link simulation moments to concepts:  
  - **Obligation-to-reciprocate**: "When clans gave tags, did you feel the *debt*? What if rejecting it caused a feud?"  
  - **Impartiality requirement**: "Auditors, why did the tag *automatically* feel like a conflict?"  
  - **Universalist presupposition**: "In trios, did the universal standard resolve the clash? Or did it erase context?"  
  - **Public/private separation**: "Riverbend sees tags as sacred; auditors see them as bribes. Where does this boundary come from?"  

  **Key Insight**: Clientelism and impartiality aren’t opposites—they coexist in the *same act* (goat/tags). Labeling it "corrupt" imposes one cultural logic.  

  ---

  ### **7. Predictable Challenges & Solutions**  
  - **Problem**: Participants moralize ("Clans are corrupt!" / "Auditors are imperialists!").  
    - **Solution**: In trios, force consensus using the universal standard. Ask: *"What would you lose if you abandoned your framework?"*  
  - **Problem**: Councilors vote "impartially" to avoid conflict.  
    - **Solution**: Remind councilors: *"In Riverbend, rejecting a tag shames your family. Will you risk it?"*  
  - **Problem**: Auditors downplay cultural context.  
    - **Solution**: In debrief, ask: *"If tags prevent violence, is ‘corruption’ functional here?"*  

  ---

  ### **8. Simulation’s Limitations**  
  **Unreproducible Element**:  
  > *The simulation cannot replicate the **generational trauma** of broken reciprocity (e.g., clans that starve if debts are ignored). Facilitators must emphasize: "In Riverbend, rejecting a gift isn’t just ‘rude’—it can trigger ostracization or violence. This is life-or-death social glue."*  

  ---

  ### **Materials Prep**  
  - **Props**: Paper goat cutouts, brass-colored tags (cardstock), voting ballots.  
  - **Handouts**: Role sheets with hidden framework notes; trio scenario cards.  
  - **Scoreboards**: Posters for CT, CH, LC points.  

  No tech, readings, or citations needed. Run entirely through role-driven tension and negotiated outcomes.
