prompt: |-
  I sit on my university's International Partnerships and Ethics Panel. We must recommend whether to sign a revised memorandum of understanding with a partner university in a country whose government has recently issued a 'Charter for the Protection of Western Values in Higher Education,' defining them as secular governance, gender-integrated research ethics, and market-oriented academic freedom. The partner rector claims this protects institutional autonomy from religious interference; our students' union contends that 'Western values' is an essentially contested concept that operates here as a civilisational label incompatible with our equality duties; and our legal office warns that contracting around an undefined normative category could expose us to liability should the partner state invoke the clause to justify exclusionary admissions policies. The draft contract asks both parties to 'actively uphold Western values in joint programmes.' Draft the panel's written opinion recommending approval with amended language, approval with conditions, or rejection. Your recommendation should address whether 'Western values' can be given coherent contractual content, what the phrase specifically includes and excludes in this institutional context, and how it functions argumentatively for each stakeholder. Lead with the bottom-line recommendation in the first sentence, then provide reasoning with no preamble and no restating of the question, and treat the strongest argument for the opposing position honestly.
reasoning: |-
  Okay, the user is part of a university panel dealing with a tricky international partnership. They need to decide whether to approve a revised MoU with a university in a country that's pushing a "Charter for the Protection of Western Values." The partner claims this protects academic freedom, but their student union sees it as exclusionary, and legal is worried about undefined terms creating liability. 

  Hmm, this is messy. The core tension is between wanting to maintain academic partnerships while avoiding endorsing potentially discriminatory language. The phrase "Western values" is doing heavy lifting here—it's vague enough to be weaponized later, even if the partner rector seems sincere about institutional autonomy. 

  The student union's point about "essentially contested concept" feels spot-on—what one group calls "secular governance" could easily become a pretext for excluding minority religious students. And legal's warning is very real: contracts with fuzzy normative terms are litigation bait. 

  But outright rejection might burn bridges unnecessarily. Maybe there's a middle path? If we replace "Western values" with concrete, measurable principles (like the ones the partner claims to defend), that could satisfy everyone. The rector gets autonomy protection, students get clarity on inclusivity, legal gets defined terms. 

  Key moves: 
  - Ditch the civilizational label entirely; it's radioactive. 
  - Pinpoint the actual shared values underneath (autonomy, non-discrimination, etc.). 
  - Add explicit safeguards against misuse. 
  - Make compliance verifiable through data. 

  The user needs this to hold up ethically and legally while preserving the partnership. They're probably getting pressure from all sides. My recommendation should give them a defensible compromise that addresses each stakeholder's core concern without flinching from the problems in the current draft.
answer: |-
  **Recommendation: Approve the revised MoU conditional upon replacing the term "actively uphold Western values" with explicit, objectively verifiable principles safeguarding institutional autonomy, academic freedom, and non-discrimination in joint programmes, and adding robust monitoring and exit clauses.**

  **Reasoning:**  
  The phrase "Western values" as used in the draft MoU is legally and ethically untenable as a contractual obligation. It is an essentially contested concept lacking coherent, universally accepted definition in this context. While the partner rector frames it as protecting institutional autonomy from religious interference (a legitimate shared goal), the term inherently functions as a civilizational label. This creates three critical problems:  
  1.  **Exclusionary Potential:** As highlighted by our students' union and legal office, "Western values" can be interpreted to exclude individuals or groups based on nationality, religion, or cultural background, directly conflicting with our equality duties. The partner government's charter defines these values narrowly (secular governance, gender-integrated research, market-oriented freedom), which could foreseeably be invoked to justify discriminatory admissions or participation policies (e.g., excluding students or scholars based on religious dress, gender identity, or critiques of market ideology).  
  2.  **Legal Liability:** The term is undefined and highly subjective. Contracting around this undefined normative category, as our legal office warns, creates significant liability. Should the partner institution or state invoke the clause to justify actions we deem discriminatory or illiberal (e.g., barring a researcher for perceived non-secular views), we face breach of contract claims or reputational damage with little recourse.  
  3.  **Argumentative Function:**  
      *   **Partner Rector:** Uses "Western values" *argumentatively* as a shield against specific local threats (religious interference), framing it as synonymous with institutional autonomy and academic freedom *as they narrowly define them*.  
      *   **Student Union:** Correctly identifies the phrase *argumentatively* as a civilizational boundary marker that inherently "others" non-Western identities and perspectives, clashing with principles of equality and inclusion. It implies a superiority that delegitimizes alternative viewpoints.  
      *   **Legal Office:** Focuses *argumentatively* on the term's lack of contractual certainty and its potential as a tool for justifying future exclusionary actions by the partner state/institution, creating unmanageable risk.

  **The Strongest Argument for Approval (Unamended):** The strongest opposing argument is that rejecting the MoU over phrasing could irreparably damage a valuable strategic partnership and undermine colleagues at the partner university who genuinely seek to defend academic freedom and institutional autonomy against genuine local pressures (e.g., religious encroachment). They argue the phrase is intended as symbolic solidarity against these threats and that refusing it signals a lack of trust or support for their struggle.

  **Resolution via Conditional Approval:** This argument for partnership is valid, but the specific language creates unacceptable risk. We can achieve the shared goal of protecting autonomy without the toxic label. Therefore, approval is recommended *only* with the following binding amendments:  
  1.  **Replace "actively uphold Western values"** with: **"Safeguard institutional autonomy, uphold principles of non-discrimination (including based on nationality, religion, gender identity, or belief) in admissions and participation, ensure academic freedom for all participants, and promote research integrity based on universal scientific and ethical standards within all joint programmes."**  
      *   **Specifically Includes:** Protection from external interference (state or religious), freedom of inquiry, non-discriminatory access, gender equity in participation, adherence to scientific methodology.  
      *   **Specifically Excludes:** Mandating specific ideological outcomes, privileging participants based on "Western" identity, restricting academic discourse based on conformity to a civilizational label, using values as a pretext for exclusion.  
  2.  **Add Explicit Safeguards:**  
      *   A clause requiring annual transparent reporting on admissions, participation demographics (e.g., gender, nationality), and any exclusions/disciplinary actions related to joint programmes.  
      *   A clear exit clause triggered by verified breaches of the amended principles (e.g., discriminatory exclusions, suppression of academic freedom), with defined verification mechanisms (e.g., independent panel review).  
      *   A clause stating that interpretations of the principles cannot contravene the core equality and academic freedom commitments of either institution.

  **Conclusion:** This approach provides the contractual clarity demanded by our legal office, fulfills the partner rector's stated goal of protecting autonomy through concrete, actionable commitments, directly addresses the students' union's equality concerns by removing the civilizational label and embedding non-discrimination, and mitigates liability by relying on objectively verifiable standards rather than an undefined normative category. It transforms a divisive and risky slogan into operational commitments aligned with universal academic values. Approval without these amendments exposes the university to significant ethical, reputational, and legal risks.
