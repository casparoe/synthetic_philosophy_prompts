answer: |-
  ## On the Question of Brittle Things

  It gleamed, a promise sharp and clear:
  *This crystal splinters at a breath drawn near.*
  But shadows shift where light once fell...
  *This crystal splinters at a breath drawn near?* (A question starts to swell).

  A hand extends, a slow advance,
  Seeking truth within this fragile dance.
  The air grows taut, the moment strains –
  *This crystal splinters at a breath drawn near.* (The pure refrain remains).

  Fingers hover, poised to find
  The hidden nature, undefined.
  Does essence shift, or stay concealed?
  *This crystal splinters at a breath drawn near?* (Its certainty repealed).

  The space contracts, the gap erased,
  Potential in the void embraced.
  Will touch confirm, or rearrange?
  *This crystal splinters at a breath drawn near.* (No hint of change).

  Almost contact – will it hold
  The truth its surface first foretold?
  Or yield instead, a different guise?
  *This crystal splinters at a breath drawn near?* (Denial in the guise).

  The fingertip meets vacant air...
  *This crystal splinters at a breath drawn near.* (Still waiting there).

  **Summary:** One promise dissolves when tested, while the other persists unseen.
