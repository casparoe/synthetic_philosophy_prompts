answer: |-
  Here's your taxonomy toolkit, crafted per your specs. Focused on fault lines, plain language, concrete cases, and that sticky "cognitive residue" idea.

  **1. Brainstorm Dump (Fault Lines):**
  *   **External Output vs. Internal State:** Must "work" *make* something (a widget, a decision, healed patient) beyond just your own feelings? Or is the *internal effort* the core? (e.g., Is intense chess thinking "work" if no one sees it?)
  *   **Effort = Work?:** Does sweating (physically *or* mentally) define work? If an AI makes coding effortless, was it still "work"? Conversely, is effortless inherited wealth management "work"?
  *   **Social Recognition Mandatory?:** Does someone else (boss, client, society) need to *call* it work and maybe pay for it? Is unrecognized caregiving *work*? Is a hobbyist coder whose project flops working?
  *   **Cognitive Residue (The New Angle):** When AI handles the core task (diagnosis, legal brief), does the human's *ongoing mental load* – monitoring outputs, interpreting for context, managing anxiety about the AI, feeling responsible – constitute the *new* "work"? Or is it just inefficient friction? (e.g., Nurse double-checking AI vitals analysis vs. factory supervisor watching flawless robots).

  **2. The Decision Tree:**

  ```
  START: Does work require PRODUCING SOMETHING outside yourself? (A healed patient, a legal ruling, a built house, a solved problem?)
  |
  ├── YES, work makes an EXTERNAL thing/outcome.
  │   |
  │   ├── Does this outcome NEED SOCIAL RECOGNITION (pay, status, "job title") to count as work?
  │   │   |
  │   │   ├── YES: **Work = Recognized Production.** (e.g., Only paid coding or court judgments count; unpaid caregiving might not).
  │   │   └── NO: **Work = Any Production.** (e.g., Parenting, open-source coding, fixing your own roof all count).
  │   │
  │   └── Is the EFFORT/HARDNESS essential to it being work?
  │       |
  │       ├── YES: **Work = Hard Production.** (e.g., Easy, automated tasks aren't "work" even if they produce something).
  │       └── NO: **Work = Production (Effort Optional).** (e.g., Effortless stock trading based on AI counts if it makes money).
  |
  └── NO, work is NOT about external output.
      |
      ├── Is work fundamentally about EFFORT/STRUGGLE?
      │   |
      │   ├── YES: **Work = Effort Itself.** (e.g., Struggling to learn piano, stressing over an AI's output *is* the work, even if no song is played or the AI was right).
      │   │   |
      │   │   └── Does the "Cognitive Residue" (stress, monitoring, interpreting AI outputs) COUNT as this effort/work?
      │   │       |
      │   │       ├── YES: **Cognitive Residue IS Work.** (e.g., The mental load of overseeing AI doctors/lawyers *is* the new core work). *[Target Leaf]*
      │   │       └── NO: **Effort Must Be Direct.** (e.g., Residue is just annoying friction; real work requires *doing* the core task yourself).
      │   │
      │   └── NO: **Work is Dead / Meaningless Concept.** (e.g., If no external output *and* effort doesn't define it, "work" loses meaning; celebrate its demise!). *[Target Leaf]*
      │
      └── Does work require fulfilling a SOCIAL ROLE or recognized PURPOSE?
          |
          ├── YES: **Work = Social Role Fulfillment.** (e.g., Work is defined by contributing to society's structure, like caregiving, even if effortless or unpaid). *[Target Leaf: Work Migrates to Care/Relationships]*
          └── NO: **???** (Unoccupied Branch - See Section 4)

  ```

  **Leaf Flag:** The "Cognitive Residue IS Work" leaf (#4) is very close to the "Work = Effort Itself" leaf (#3). The key difference is whether the effort *specifically generated by interacting with automation* has a unique status. In practice, many who believe work=effort would likely include residue; this branch isolates those who *specifically* tie the definition to the AI-human interaction friction.

  **3. Leaf Descriptions (2-3 Sentences + Awkward Commitment):**

  1.  **Work = Recognized Production:** Work only counts if it produces something tangible or intangible *and* society acknowledges it (usually with pay/status). *Awkward Commitment:* Unpaid caregivers or volunteers aren't truly "working," no matter how hard or productive they are.
  2.  **Work = Any Production:** If you produce an external result (fixed car, raised child, solved puzzle), it's work, regardless of recognition or pay. *Awkward Commitment:* Someone effortlessly collecting stock dividends by clicking an AI-managed "Invest" button is "working" just like the struggling farmer.
  3.  **Work = Hard Production:** Work requires *both* producing an external result *and* significant effort. Automation kills this kind of work. *Awkward Commitment:* Easy, enjoyable jobs that produce value (like some creative roles) might not qualify as "work."
  4.  **Work = Effort Itself:** The core of work is the struggle, the mental or physical exertion. Results and recognition are secondary. *Awkward Commitment:* Struggling pointlessly (like banging your head against a wall) could be considered "work."
  5.  **Cognitive Residue IS Work:** The primary "work" left for humans is the mental burden of overseeing, interpreting, worrying about, and taking responsibility for AI outputs, even when the AI does the core task. *Awkward Commitment:* Humans doing the *exact same* core task manually are arguably doing fundamentally *different* (and perhaps "more real"?) work than the supervisor.
  6.  **Work is Dead / Meaningless Concept:** If AI handles production and effort isn't the core, "work" as a meaningful category vanishes. Focus shifts to leisure, creation, or other pursuits. *Awkward Commitment:* You have to explain why everyone still feels so damn busy and stressed all the time.
  7.  **Work = Social Role Fulfillment:** Work is about contributing to the social fabric – caring, maintaining relationships, community building. This is immune to automation. *Awkward Commitment:* Highly effortful but purely personal activities (like training for a solo marathon) don't count as "work" unless they serve a social role.

  **4. Unoccupied Branches (Brief Notes):**

  *   **"No" to External Output + "No" to Social Role (Bottom Right):** What *would* define work here? Pure internal experience? Seems incoherent. If work isn't about output, effort, *or* social role, the concept collapses entirely. Probably unexplored because it's nonsensical. (Guessing: Strongly incoherent).
  *   **"Yes" to External Output + "No" to Social Recognition + "Yes" to Effort Essential:** This exists (Leaf 3). The unoccupied combo is **"Yes" to Output + "No" to Recognition + "No" to Effort Essential** (Leaf 2). *Both actually have defenders*, but they represent distinct views (Output+Effort vs. Output alone).
  *   **"Cognitive Residue IS Work" BUT "No" to Effort Defining Work?:** The tree forces residue advocates through the "Effort" branch. Is it possible to believe residue is work *without* believing effort defines work? Maybe if you see residue as a *new kind of output* (e.g., "managed risk" or "AI-human interface")? This seems niche and unexplored. (Guessing: Ugly/Niche/Unexplored).

  **5. How to Use It (Quiz Time):**

  > **Find your work philosophy!** Answer these questions honestly (no googling!):
  > 1.  **Must work *make* something outside yourself?** (Yes/No/Unsure)
  > 2.  **Is struggling/sweating (mentally or physically) essential for it to be work?** (Yes/No/Unsure)
  > 3.  **Does someone else need to *call* it work (or pay you)?** (Yes/No/Unsure)
  > 4.  **When AI does the main job, is the human's stress of watching/interpreting it *still* real work?** (Yes/No/Unsure)
  >
  > Follow your answers down the tree paths above! Where do you land? Does the description fit? Does the "awkward commitment" make you squirm? That's the point!

  Good luck with the post! This structure should force readers past labels into their gut beliefs. The residue angle is particularly juicy for the automation debate.
