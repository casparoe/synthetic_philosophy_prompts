  For unoccupied branches, I'll identify combinations that seem logically inconsistent or socially unpalatable, like believing work requires both external output and social recognition, but denying that effort matters - which would make highly-paid effortless jobs count as work while dismissing hard labor.

  Finally, for the quiz application, I'll suggest how readers can self-identify their position by answering the key questions in sequence, helping them locate themselves in the taxonomy without needing philosophical expertise.

