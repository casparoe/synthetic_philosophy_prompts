prompt: |-
  I'm the head translator at a tiny poetry press and I'm tired of arguing with poets over whether a version is "faithful" when we've clearly changed half the images. I want a reusable decision procedure based on that Hofstadter idea from Le Ton beau de Marot — the one where keeping rhyme and meter forces semantic shifts, and the real question is which formal features are worth the damage they do to meaning. But don't just summarize the theory; I need something my reviewers can run in ten minutes on a manuscript.

  I'm also injecting my own twist: treat every formal feature you preserve — rhyme scheme, syllable count per line, gender of rhyme, and any hidden acrostic — as carrying a "formal debt" of semantic distortion. You set a debt ceiling for the whole poem (say, three major distortions max). The procedure should rank which formal debts are acceptable, apply the ceiling, and tell you exactly which feature to drop when you're over budget.

  Please write this in American English. Here are the sections, in this order:

  1. "The job and the debt ceiling rule" (about 120 words). Explain what a reviewer is deciding, what counts as a formal debt, and how the ceiling works.
  2. "The flowchart in words" (about 300 words). The ordered questions: which features are present in the source? Which are non-negotiable for this press? What's the debt weight of each? Then apply the ceiling. Be explicit about where the reviewer stops and just picks based on taste, and flag where two debts are tied.
  3. "Two test runs" (about 250 words). First, a short lyric with ABAB rhyme, eight syllables per line, and masculine rhyme — show it passing cleanly. Second, a poem with those same features plus an acrostic that spells the beloved's name in the source alphabet, but the target language alphabet makes that impossible without rewriting every line — show the procedure giving a verdict you'll hate (probably drop the acrostic and keep the rhyme, even though the poet will scream).
  4. "Where it fails and you have to call it" (about 100 words). Flag cases the debt model can't settle, like when two features have identical weights but only one can stay, or when the semantic distortion is so weird that counting it as "one debt" feels fake.

  Make sure it's usable by someone who hasn't read the original essay. Don't ask for a bibliography, don't cite page numbers, and don't quote anyone verbatim — just paraphrase the basic tension between form and meaning in your own words. Also stick to the core idea; don't bring in super obscure translation theories nobody remembers. And please help me seperate the formal debts clearly in step 2.
reasoning: |-
  We are creating a decision procedure for poetry translation reviewers at a small press. The core idea is that preserving formal features (like rhyme, meter, etc.) often requires changing the meaning (semantic distortion). Each preserved formal feature incurs a "formal debt" (the semantic distortion it causes). We set a debt ceiling (e.g., max 3 major distortions) for the whole poem. The procedure will help decide which features to keep and which to drop when over the debt ceiling.

  1. "The job and the debt ceiling rule" (about 120 words)
     - The reviewer decides which formal features of the source poem to preserve in the translation, knowing each one may force changes to the meaning. 
     - A "formal debt" is the semantic distortion (change in meaning) caused by preserving a formal feature. 
     - The debt ceiling is the maximum number of major distortions allowed (e.g., three). If preserving all desired features would cause more distortions than the ceiling, you must drop some features to stay under the ceiling.

  2. "The flowchart in words" (about 300 words)
     We break down the procedure into a series of questions:

     Step 1: List all formal features present in the source poem. Common features include:
        - Rhyme scheme (e.g., ABAB)
        - Meter (e.g., iambic pentameter) or syllable count per line
        - Rhyme type (e.g., masculine/feminine)
        - Acrostics (hidden messages formed by first letters)
        - Alliteration, assonance, etc.
        - Stanza structure
        - Line breaks

     Step 2: Identify non-negotiable features for your press. These are features that your press always preserves (e.g., rhyme scheme might be non-negotiable for sonnets). If a feature is non-negotiable, mark it as preserved and note that its debt is already accounted for (but it still counts toward the ceiling). 

     Step 3: Assign a debt weight to each remaining feature. We suggest:
        - Heavy debt (counts as 2 distortions): Features that are extremely difficult to preserve without major semantic shifts (e.g., an acrostic in a language with a different alphabet, a complex rhyme scheme in a language with few rhymes).
        - Medium debt (counts as 1 distortion): Features that usually require some rephrasing (e.g., syllable count per line, masculine/feminine rhyme when the target language has gender).
        - Light debt (counts as 0.5 distortions): Features that can often be preserved with minimal tweaking (e.g., simple alliteration, basic stanza structure). 

     Step 4: Add up the total debt from the features you want to preserve (including non-negotiables). If the total is less than or equal to the debt ceiling (e.g., 3), proceed with all features.

     Step 5: If the total debt exceeds the ceiling, rank the features by debt weight (heaviest first) and drop the heaviest ones until the debt is within the ceiling. If two features have the same weight, drop the one that causes the most semantic damage (this is a judgment call by the reviewer). If they cause equal damage, the reviewer picks based on taste.

     Step 6: If after dropping all heavy and medium debts you are still over the ceiling, drop light debts until under.

     Note: The reviewer stops and uses personal judgment when:
        - Two features have the same debt weight and cause similar semantic damage (tie).
        - When deciding which feature causes more semantic damage (if not obvious).

  3. "Two test runs" (about 250 words)

     Test Run 1: Passing Cleanly
        - Source: A short lyric (4 lines) with ABAB rhyme, 8 syllables per line, and masculine rhyme.
        - Features: 
            - ABAB rhyme (non-negotiable for press? Let's assume yes -> preserved, debt: medium? 1)
            - 8 syllables per line (medium: 1)
            - Masculine rhyme (medium: 1)
        - Total debt: 3 (if ceiling is 3, it passes). 
        - Verdict: Keep all.

     Test Run 2: Over Budget
        - Source: Same as above plus an acrostic spelling the beloved's name "ROSE" (4 lines, first letters R-O-S-E). The target language uses a different alphabet, so preserving the acrostic would require rewriting every line to fit the letters, which might not even form a word.
        - Features:
            - ABAB rhyme (non-negotiable -> preserved, debt: 1)
            - 8 syllables per line (medium: 1)
            - Masculine rhyme (medium: 1)
            - Acrostic (heavy: 2) because of alphabet shift.
        - Total debt: 1 (ABAB) + 1 (syllables) + 1 (masculine) + 2 (acrostic) = 5
        - Ceiling: 3 -> over by 2.
        - Rank by weight: Acrostic (2) is heaviest -> drop it. Then total debt becomes 3 (1+1+1), which is within ceiling.
        - Verdict: Drop the acrostic. The poet might scream because the name is lost, but the procedure says it's the heaviest debt and must go to stay under the ceiling.

  4. "Where it fails and you have to call it" (about 100 words)
     The model fails when:
        - Two features have identical debt weights and cause such similar semantic damage that they are tied. Then the reviewer must decide based on taste or the poem's core intent.
        - When a feature causes a distortion that is so bizarre or extreme that counting it as "one debt" (or even two) seems inadequate (e.g., preserving an acrostic forces a completely unrelated and surreal narrative). 
        - When the semantic distortion is not linear (e.g., preserving two features together causes more damage than the sum of each individually). In such cases, the reviewer must override the count and make a holistic call.
answer: |-
  ### 1. The job and the debt ceiling rule  
  As a reviewer, your job is to decide which *formal features* of the original poem (like rhyme or meter) must stay in the translation, knowing each one forces compromises in meaning. Every feature you preserve creates a "formal debt" — the semantic distortion (e.g., altered images, shifted metaphors) needed to make it work in the new language. The "debt ceiling" is your limit for acceptable damage: say, three major distortions per poem. If preserving all features would exceed this ceiling, you must drop some to stay under budget. Think of it as a trade-off: Form costs meaning, and you’re the accountant.  

  ### 2. The flowchart in words  
  **Step 1: List formal features**  
  Identify every structural element in the source: rhyme scheme, syllable count per line, rhyme gender (masculine/feminine), acrostics, alliteration, etc.  

  **Step 2: Flag non-negotiables**  
  Check if your press has hard rules (e.g., "sonnets must rhyme"). These *must* stay but still count toward debt.  

  **Step 3: Assign debt weights**  
  Rank how much distortion each feature demands:  
  - **Heavy debt (2 distortions)**: Features requiring drastic rewrites (e.g., acrostics across alphabets, complex rhyme in rhyme-poor languages).  
  - **Medium debt (1 distortion)**: Features needing moderate tweaks (e.g., syllable counts, rhyme gender).  
  - **Light debt (0.5 distortions)**: Features with minimal impact (e.g., simple alliteration, basic stanza breaks).  

  **Step 4: Tally debts**  
  Add weights of all features you plan to keep. If total ≤ ceiling (e.g., 3), proceed.  

  **Step 5: Apply the ceiling**  
  If over budget:  
  - Drop the heaviest debt feature first (e.g., kill a 2-debt acrostic before a 1-debt rhyme).  
  - If tied in weight (e.g., two medium debts), drop the one causing *worse* semantic damage (e.g., a distorted central metaphor > a tweaked adjective).  
  - **Tiebreaker**: If damage is equal, *you choose* based on taste.  

  **Step 6: Light-debt triage**  
  If still over ceiling after step 5, drop light debts (0.5) until under budget.  

  ### 3. Two test runs  
  **Test 1: Clean pass**  
  *Source*: A 4-line lyric, ABAB rhyme, 8 syllables/line, masculine rhymes.  
  - Features: ABAB (medium debt), syllable count (medium), masculine rhyme (medium).  
  - Total debt: 3 (at a 3-distortion ceiling).  
  *Verdict*: Keep all. No cuts needed.  

  **Test 2: Over budget, drop the acrostic**  
  *Source*: Same as above, but with an acrostic spelling "ROSE" (vertically using first letters). The target language’s alphabet can’t replicate "R-O-S-E" without rewriting every line.  
  - Features: ABAB (medium), syllable count (medium), masculine rhyme (medium), acrostic (heavy debt: 2).  
  - Total debt: 5 (medium × 3 + heavy × 1).  
  - Ceiling: 3 → Exceeds by 2.  
  *Procedure*:  
  1. Drop heaviest debt (acrostic, 2 distortions).  
  2. New total: 3 (ABAB + syllables + rhyme).  
  *Verdict*: Kill the acrostic. Even though the poet will rage about losing the name, the math is clear: Saving rhyme/syllables costs less than the acrostic’s chaos.  

  ### 4. Where it fails and you have to call it  
  This model stumbles when:  
  - Two features have **identical weights and identical damage** (e.g., dropping either rhyme or syllables guts the poem equally). You’ll need a gut call.  
  - A "single" distortion warps the poem so wildly (e.g., preserving meter turns a love poem into nonsense) that calling it "one debt" feels dishonest.  
  - The poem’s core meaning hinges on a feature (e.g., an acrostic *is* the theme). Then, debt math ignores art—so override the rules and debate it live.
