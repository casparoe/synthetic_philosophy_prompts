  camp two (scalar instrumentalism): they say reward is just a gradient-shaping number. suffering needs either biological affect or global-workspace integration; RL lacks interoceptive binding, so negative reward is optimization noise, not valence. they think "interoceptive absence in policy-gradient updates" is a decisive failure, not just an implementation detail.

  they agree on the formalism but talk past each other on architecture. i want:

