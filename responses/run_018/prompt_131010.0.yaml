  - **End-Word Rotation**: The cyclical repetition of "wake," "report," "memory," "experience," "absence," and "thread" structurally enacts the unresolved debate. Each stanza reorders them to reflect shifting epistemic priorities (e.g., "wake" anchoring verification attempts, "thread" symbolizing narrative coherence).  
  - **Philosophical Moves**:  
    - **Malcolm's Criterion**: "If consciousness requires **experience** / to leave some trace" (Stanza 1) questions verifiability during paralysis.  
    - **Dennett's Model**: "Your **memory** / confabulates! The plot's a **thread** / sewn *after* fact" (Stanza 3) voices retrospective construction.  
    - **Unexperienced Interval**: "A hollow **absence** / yawns—no lived 'now' in my **memory**" (Stanza 4) embodies the gap between REM events and waking recall.  
  - **Envoi Structure**: The final tercet ends with "wake," "experience," "absence," while embedding "memory," "report," and "thread" internally to sustain grammatical tension without closure.  
  - **Specialist Accuracy**: Avoids naming theorists but precisely encodes verificationism, confabulation, and the phenomenology-recall disconnect per scholarly sources (e.g., Malcolm's *Dreaming*, Dennett's *Content and Consciousness*).
