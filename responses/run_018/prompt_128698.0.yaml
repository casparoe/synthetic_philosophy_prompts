  Here's a decision tree built from concrete cases to figure out why you act against your better judgment. Answer each question based on your gut feeling—no philosophy degree needed. We'll cover personal stuff (like eating cake or smoking) and group cases (like a team avoiding hard choices). The leaves are actual positions people hold, with their most awkward implication. I'll flag overlaps and dead ends.

