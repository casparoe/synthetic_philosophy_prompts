  🍰 **When you break a promise to yourself (e.g., eat cake after swearing you won't), what's the *strongest* feeling?**  
  - **A:** "I didn't *want* to, but my body/mind autopiloted" → Go to **Q1**  
  - **B:** "I *chose* it in the moment, no regrets" → Go to **Q2**  
  - **C:** "I *chose* it in the moment, but regret it later" → Go to **Q3**  
  - **D:** "This feels like a group/team issue (e.g., we all knew we should cut pollution but didn't)" → Go to **Q4**  

  ---

  ### **Q1 (For A: "I didn't want to, but autopiloted")**  
  🚬 **When you autopilot, does it feel like:**  
  - **A1:** A glitch in your brain (e.g., "I forgot the consequences") → **Position: Bad Math Brain**  
    *Awkward commitment:* Your brain is just bad at weighing future vs. present (like bad code). *Why hasn't evolution fixed this?*  
  - **A2:** Two "yous" fighting (e.g., "My healthy side lost to my cravings") → **Position: No Real Self**  
    *Awkward commitment:* There's no "true you"—just brain parts at war. *Who’s the "you" feeling guilty?*  

  ### **Q2 (For B: "Chose it, no regrets")**  
  🤷 **Why no regrets?**  
  - **B1:** "My values changed—I *earned* that cake!" → **Position: Genuine Preference Shift**  
    *Awkward commitment:* You never truly "meant" your promise—it was all talk. *Why make rules if you’ll ditch them?*  
  - **B2:** "It worked out fine!" → **Position: Mistaken Rule**  
    *Awkward commitment:* Your original plan was too strict. *Why distrust your gut so much?*  

  ### **Q3 (For C: "Chose it, regret later")**  
  😔 **When you regret, is it mainly:**  
  - **C1:** "I betrayed my values" (e.g., "I’m weak!") → **Position: Classic Akrasia**  
    *Awkward commitment:* Your "true self" exists but is powerless. *Why is it so fragile?*  
  - **C2:** "The consequences were worse than I thought" (e.g., "That cake gave me a stomachache") → **Position: Hyperbolic Discounting Lite**  
    *Awkward commitment:* You *did* value the present more—it wasn’t weakness, just bad timing. *Why regret if it was a fair trade?*  
    *Flag: In practice, this is almost identical to Bad Math Brain (from A1). Both blame faulty calculations.*  

  ### **Q4 (For D: Group issue)**  
  🏢 **In the group, did everyone *agree* on the goal but still fail?**  
  - **D1:** Yes, and people thought "someone else will fix it later" → **Position: Group Akrasia**  
    *Awkward commitment:* The group has a "will" that’s weak like a person’s. *How can a group “intend” anything?*  
  - **D2:** No—people had hidden disagreements (e.g., "Jen wanted to cut pollution, but Mark didn’t care") → **Position: Hidden Politics**  
    *Awkward commitment:* It’s not weakness—it’s miscommunication. *Why call it a “group failure” if it’s just individuals?*  

