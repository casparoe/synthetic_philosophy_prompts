answer: |-
  ## Dissertation Prospectus: The Evidential Asymmetry of Durability - Lifecycle Inference and Institutional Persistence in Archaeology

  **1. Problem Statement: The Durability Asymmetry & Its Interpretive Pitfalls**
  Material artifacts possess a fundamental property: they often persist long after the specific intentions, beliefs, and social agreements that governed their creation and initial use have dissolved. This "durability asymmetry" – the artifact outliving its original mental and social context – is a cornerstone of archaeology. However, common interpretive practices risk epistemic error. Archaeologists frequently treat an object's mere physical survival, or patterns in its lifecycle (delayed decay, repair, reuse), as *direct evidence* for the continuity of the institution it once served. This inference is problematic. The artifact's persistence could equally result from inertia, repurposing under entirely new institutions, or accidental preservation, *without* implying institutional stability. The asymmetry creates a potential confound: physical continuity is readily mistaken for social continuity. The core problem is that standard archaeological reasoning lacks a robust, explicit logic for distinguishing inferences about the *specific past mental states/intentions* behind an object from inferences about the *long-term stability of the institutions* that object participated in, especially when lifecycle events intervene.

  **2. Precise Research Question:**
  Does the inference from an artifact's lifecycle events (decay rate deviation, repair, reuse, modification, abandonment context) to the continuity of an institution require a distinct evidential logic, fundamentally separate from both:
  *   **(a) Representationalist Reconstruction:** Inferring specific past beliefs, intentions, or meanings directly "from" the object (e.g., "this figurine shape represents Goddess X").
  *   **(b) Practice-Based Inference:** Inferring institutions from repeated patterns of use-wear, deposition, or association (e.g., "consistent wear patterns on these tools indicate a standardized butchering practice")?
  More specifically:
  *   Can we formally distinguish **Episodic Reconstruction** (inferring the specific belief/intention Y at the moment of the object's creation/modification T1) from **Structural Persistence Inference** (inferring the stability of institution Z across the object's lifespan, T1 to Tn, based on its lifecycle)?
  *   Does the conflation of Episodic Reconstruction and Structural Persistence Inference generate common interpretive errors in archaeological reasoning regarding institutional longevity?

  **3. Why Existing Positions Leave This Open:**
  *   **Representationalism:** Primarily focuses on decoding meaning or intention *at the point of creation*. It largely ignores the object's subsequent biography and lifecycle patterns as evidence for anything beyond that initial moment. Durability and lifecycle events are not integrated into its core logic.
  *   **Practice-Theory:** Effectively addresses repeated actions and use-patterns, linking them to institutions. However, it often tacitly **conflates "use-pattern" with "durability-pattern"**. It lacks a principled account of *how* events like repair, repurposing, or extended survival *beyond typical use-life* should be weighed *against* the evidence of original function when inferring institutional continuity. Does repairing a boundary marker signify the *same* institution maintaining it, or a *new* institution appropriating an old form? Practice theory struggles to articulate the evidential difference.

  **4. Proposed Method & Monthly Plan: Conceptual Distillation via Idealized Case Studies**
  This project adopts a *conceptual* methodology, prioritizing the logical structure of inference over empirical data gathering or historical analysis. It builds the distinction between Episodic and Structural inference from the ground up, using carefully constructed, idealized case studies representing "institutional artifacts" – objects whose primary function is tied to social agreements (e.g., boundary markers defining territory, standardized weights enabling trade, communal storage vessels regulating surplus). The focus is on rigorously defining the inferential criteria and testing their logical independence.

  *   **Months 1-2: Conceptual Groundwork & Case Study Definition**
      *   Precisely define key terms: Episodic Reconstruction (ER), Structural Persistence Inference (SPI), Lifecycle Event (decay, repair, reuse, abandonment), Institutional Artifact.
      *   Select 3 core case study types: Boundary Marker, Standardized Weight, Communal Storage Vessel. Develop idealized initial descriptions for each, including their core institutional function.
      *   Define baseline hypothetical lifecycle scenarios for each type (e.g., Boundary Marker: pristine placement, weathering, deliberate damage, repair, relocation, abandonment).
  *   **Months 3-4: Isolating Episodic Reconstruction (ER)**
      *   Analyze ER: What evidence (material properties, context at T1) supports an inference *only* about the specific intention/belief at creation? (e.g., Marker shape/inscription points to *initial* territorial claim; Weight's mass standard points to *initial* agreed unit; Vessel capacity/decoration points to *initial* storage rules).
      *   Develop criteria for ER: Focus on properties fixed at T1, minimal reliance on subsequent history. Identify its inherent limitations (cannot speak to longevity).
  *   **Months 5-6: Isolating Structural Persistence Inference (SPI)**
      *   Analyze SPI: What lifecycle patterns (distinct from initial creation or typical use-wear) *specifically* bear on the *continuity* of the institution? (e.g., *Consistent* repair of Markers according to original form vs. *ad hoc* patching; *Maintenance* of Weight standards through recalibration vs. casual reuse; *Systematic* replacement of Storage Vessels vs. gradual repurposing).
      *   Develop criteria for SPI: Focus on patterns *over time* – consistency/deliberateness of maintenance, adherence to original form/function during reuse, context of abandonment relative to institutional context. Identify its inherent limitations (cannot pinpoint specific beliefs at specific moments).
  *   **Months 7-8: Testing Independence & Potential Conflation**
      *   Design hypothetical lifecycle scenarios for each case study that *stress-test* the distinction:
          *   Scenario A: Object repaired/reused *precisely* according to original institutional logic (ER and SPI align).
          *   Scenario B: Object repaired/reused *differently*, signifying institutional shift or collapse (SPI diverges from ER).
          *   Scenario C: Object survives/decays anomalously *without* institutional action (e.g., accidental preservation; SPI should be weak/non-applicable).
          *   Scenario D: Object shows minimal lifecycle events but institution persists (SPI evidence absent, but institution stable).
      *   Apply the ER and SPI criteria to each scenario. Can they generate distinct, non-redundant conclusions? Does applying only ER or only practice-based use-patterns lead to errors in Scenarios B, C, D?
  *   **Months 9-10: Synthesizing the Evidential Framework**
      *   Formalize the distinction: Articulate the necessary and sufficient logical conditions for valid ER vs. valid SPI.
      *   Develop the evidential weight schema: Assign relative weights to different lifecycle events (e.g., *deliberate repair to original spec* = strong SPI evidence; *casual reuse* = weak/ambiguous SPI evidence; *anomalous preservation* = negligible SPI evidence).
      *   Formulate decision rules: Under what evidential conditions (e.g., nature of repair, context of reuse, abandonment pattern) should an archaeologist invoke ER (about origin), SPI (about persistence), both, or neither? When does lifecycle evidence *override* initial form/function for SPI?
  *   **Months 11-12: Refinement, Failure Analysis & Deliverable Drafting**
      *   Refine criteria, weights, and rules based on internal coherence and scenario outcomes.
      *   Explicitly define and assess potential failure modes (see below).
      *   Draft the core dissertation chapters, culminating in the presentation of the formal inferential framework.

  **5. Why Conceptual Over Empirical/Historical:**
  *   **Focus on Logic:** The core problem is *evidential logic*, not new data. Excavation would generate data requiring the very logic under scrutiny. Historical surveys risk getting lost in methodological particulars rather than isolating the core philosophical distinction.
  *   **Clarity & Control:** Idealized case studies allow precise manipulation of variables (lifecycle events, institutional context) to isolate the inferential mechanisms, free from empirical noise and ambiguity.
  *   **Foundational Scope:** The goal is to establish a *conceptual foundation* for how lifecycle evidence *can* function, providing a tool for *evaluating* empirical and historical arguments, not generating new ones directly.

  **6. Deliverable:**
  A formal conceptual framework for archaeological inference comprising:
  1.  Clear definitions and diagnostic criteria distinguishing **Episodic Reconstruction (ER)** from **Structural Persistence Inference (SPI)**.
  2.  A schema assigning **evidential weights** to specific artifact lifecycle events (e.g., decay patterns, types of repair, forms of reuse, abandonment contexts) relevant to SPI.
  3.  Practical **decision rules** guiding archaeologists on when lifecycle evidence:
      *   Primarily supports ER (about origin).
      *   Primarily supports SPI (about institutional continuity).
      *   Requires concurrent but distinct application of both ER and SPI.
      *   Is insufficient or ambiguous for strong SPI claims.
      *   Should lead to skepticism about institutional continuity despite material persistence.

  **7. Failure Conditions:**
  The project fails to achieve its core aim if:
  1.  **Redundancy:** Lifecycle patterns proposed as evidence for SPI are demonstrated to be logically equivalent to, or entirely subsumed by, evidence derived solely from practice-based use-patterns or initial representational properties. Durability adds no unique evidential value for institutions.
  2.  **Collapse:** The distinction between ER and SPI collapses because any claim about institutional persistence (SPI) *necessarily and inherently* entails specific, identifiable belief claims (ER) at multiple points in time, making SPI impossible to isolate.
  3.  **Indeterminacy:** Despite rigorous conceptual work, no clear, non-arbitrary criteria for distinguishing ER and SPI, or assigning evidential weights to lifecycle events for SPI, can be established. The framework remains irreducibly vague or subjective.
  4.  **Triviality:** The resulting framework offers no meaningful practical guidance beyond what is already implicit (and problematic) in common archaeological reasoning, failing to address the identified pitfalls of the durability asymmetry.
