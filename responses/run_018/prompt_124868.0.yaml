  ## Municipal Office of Independent Judgment: Citizen Guidance Document (Revision 17.3b)

  **Preamble:** Pursuant to Ordinance 114.2 (The Non-Affiliation Act), all political parties and analogous structures are formally dissolved within this jurisdiction. The Municipal Office of Independent Judgment (MOIJ) exists to facilitate civic participation strictly through the exercise of individual, conscientious reasoning, free from collective ideological pressures. This document addresses common procedural inquiries. All processes are designed to uphold the primacy of unmediated moral attention and prevent the crystallization of group allegiance.

  **1. How may a citizen advance a policy proposal for collective consideration?**
  Policy proposals must originate from a single, registered citizen acting solely upon their individual conviction. Proposals exceeding 250 words require pre-submission certification of "Moral Attention" by an MOIJ-appointed Assessor (Form MJ-7a).¹ Proposals deemed "derivative," "platform-adjacent," or exhibiting "rhetorical contagion" (e.g., recognizable slogans, common thematic phrasing observed in previous submissions) will be rejected (Ordinance 114.2, Sec. 8). Approved proposals enter the Randomized Deliberative Pod (RDP) sequence. Pods of 13 citizens, selected algorithmically to maximize demographic dispersion and minimize prior interaction, undergo mandatory cooling-off periods between review stages. Final Pod recommendations proceed to Individual Conscience Vote (ICV), preceded by mandatory, proctored Moral Attention Assessment (MAA-PV).

  **2. How is collective deliberation structured to prevent groupthink?**
  Deliberation within RDPs follows the Protocol for Isolated Moral Scrutiny (PIMS). Participants occupy individual sound-dampened booths. Communication occurs solely via the Standardized Deliberation Interface (SDI), which anonymizes contributions, enforces a 30-second reflection pause before message transmission, and algorithmically scrambles message display order. Shared visual references or simultaneous discussion are prohibited. Pod facilitators, rotated hourly, ensure strict adherence to temporal limits and intervene if any participant exhibits "undue influence indicators" (e.g., repeated agreement patterns, thematic persistence). All Pod transcripts undergo post-hoc Linguistic Anomaly Screening (LAS) to detect emergent, unauthorized consensus.

  **3. What procedures exist when citizens experience spontaneous collective enthusiasm regarding an issue?**
  Spontaneous collective enthusiasm represents a significant procedural anomaly and potential precursor to prohibited affiliation. Citizens experiencing such enthusiasm are directed to immediately file an Individual Affective State Report (IASR, Form MJ-22) detailing the nature, location, and duration of the experience. MOIJ Enthusiasm Response Teams (ERTs) will deploy to the location to administer on-site Moral Attention Stabilization (MAS) protocols and collect anonymous environmental data. Persistent or recurring enthusiasm reports concerning a specific issue trigger an automatic Mandatory Cooling-Off Period (MCOP) for all citizens within the reported geographic radius, suspending all related civic procedures for 14 days. Public gatherings exceeding 3 unrelated individuals discussing a common topic require prior ERT notification (Form MJ-22c).

  **4. How are administrative disputes regarding MOIJ procedures resolved?**
  Disputes concerning the application or interpretation of MOIJ regulations must be initiated by an individual citizen via a Statement of Procedural Uncertainty (SPU, Form MJ-45). SPUs are reviewed by a rotating panel of three Certified Independent Judgment Arbitrators (CIJAs). CIJAs undergo biennial re-certification, including rigorous testing for "conceptual neutrality" and lack of discernible pattern in prior rulings. Rulings are binding and based solely on strict textual adherence to existing ordinances and protocols. Appeals are not permitted, as they imply a hierarchy of judgment contradicting individual sovereignty. Disputes involving allegations of procedural bias by an MOIJ official are escalated to the Office of Pure Process Review (OPPR), which conducts audits focusing exclusively on documentation compliance, not subjective intent.²

  **5. Is collaboration between citizens permitted?**
  Collaboration implying sustained coordination, shared objectives beyond immediate procedural tasks, or emotional bonding around civic matters is incompatible with Ordinance 114.2. Citizens may exchange factual information relevant to an individual's pending action (e.g., RDP participation, ICV). However, collaborative drafting, strategy sessions, or expressions of mutual support regarding policy positions constitute "Affective Congregation" (Regulation 7.1d) and are subject to Corrective Moral Reorientation (CMR) sessions. The MOIJ Collaboration Assessment Matrix (CAM) provides guidance on permissible interaction thresholds.

  ---

  **Footnotes:**

  ¹ Moral Attention Assessment (MAA) involves a 90-minute proctored session analyzing the citizen's ability to describe a neutral object (e.g., a municipal-issue stapler) for 20 minutes without employing metaphor, value judgment, or associative reasoning. Scores below 78% indicate compromised individual judgment capacity, requiring remedial Cognitive Decontamination before proposal submission.
  ² *Internal Reference: OPPR Case File 1142-7X*. Administrator Kael was formally reprimanded for exhibiting "factional tendencies" after three junior clerks independently submitted SPUs supporting Kael's interpretation of cooling-off period triggers (Regulation 3.1f). The clerks displayed "unexplained thematic alignment" in their SPU phrasing. The OPPR audit confirmed Kael's documentation was technically compliant but noted "an emergent pattern of procedural interpretation attracting undue congruence," constituting an Unauthorized Consensus Nexus (UCN). Kael underwent mandatory CMR. The systemic tendency for certain procedural interpretations to inadvertently attract adherents was not examined, as such analysis implies meta-procedural affiliation, falling outside OPPR's purely documentary mandate.
