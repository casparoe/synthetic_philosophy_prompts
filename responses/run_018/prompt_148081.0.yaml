  Hmm, first I need to recall the main points. Lucas and Penrose argue that Gödel's incompleteness theorems show human minds aren't formal systems because we can see the truth of unprovable statements. Hofstadter, however, uses Gödel to explain consciousness via "strange loops" where systems become self-aware by referencing themselves, like in Gödel numbering.

