  But there's a twist: the gate has become an accidental meeting point for urban foragers and ecologists over the last 15 years. They use it to swap seeds, track seasons, and socialize. Removing it might dissolve this emergent social practice, which is a modern, unintended value. So the Burkean argument applies but in a new way—the hidden wisdom isn't the original purpose but the social ecology that developed around it.

