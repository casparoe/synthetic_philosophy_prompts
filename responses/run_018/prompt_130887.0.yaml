answer: |-
  Here’s a battle-tested 40-minute teaching plan optimized for tech audiences, leveraging your legacy code analogy while preempting pitfalls. Sequence is critical:

  ---

  ### **Timeline & Sequence**  
  **Total: 40 min**  
  *(Stick rigidly to these timings)*  

  1. **Hook: Architecture Spandrel (5 min)**  
     - **Visuals:** Show *San Marco Cathedral diagrams* (actual spandrels + arches).  
     - **Key point:** "Spandrels are unavoidable byproducts of mounting a dome on arches. Architects *later* decorated them, but they weren’t designed *for* art."  
     - **Bridge to code:** "Like when you write a module to handle API rate-limiting, but it accidentally creates a timestamp log. The log isn’t a feature—it’s a structural artifact."  

  2. **Core Bio Example: Peacock Trains (10 min)**  
     - **Why NOT pandas/chin?** Pandas’ thumb is *exaptation* (repurposed trait), chin is hotly debated. Use **peacock trains** instead:  
       - *Adaptationist claim:* "Long trains evolved *for* mating success (true!)."  
       - *Spandrel insight:* "But the train’s *heavy weight/vulnerability* is a byproduct of sexual selection on tail feathers. Predation risk wasn’t ‘designed’—it’s a constraint of the trait."  
     - **Legacy code link:** "Like adding a flashy UI animation that accidentally hogs memory. The lag isn’t a feature—it’s a trade-off from another ‘design’ choice."  

  3. **Define Terms + Misconception Head-Offs (8 min)**  
     - **Spandrel:** "Neutral/free byproduct of *other* adaptations. *Not* junk!" (e.g., blood’s red color is a byproduct of hemoglobin—not selected for visibility).  
     - **Vs. Exaptation:** "Spandrels *become* exaptations if later co-opted (like feathers evolving for warmth, later used for flight)."  
     - **Adaptationism ≠ Perfection:** "Adaptationists don’t claim ‘optimal design.’ Traits are ‘good enough’ compromises (like duct-tape code that ships)."  

  4. **Group Discussion: Legacy Code Analogy (12 min)**  
     - **Prompt 1:** "Share a ‘spandrel’ from your work—a behavior that emerged from system architecture, not intentional design." (e.g., a cron job causing race conditions).  
     - **Prompt 2:** "How did you distinguish a bug from a feature? What constraints forced trade-offs?"  
     - **Steer clear:** Don’t let this devolve into pure tech venting. Keep tying back to evolution: *"In biology, ‘debugging’ = natural selection. But it can’t fix everything."*  

  5. **Check-for-Understanding (4 min)**  
     - **Question:** *"Is human language an adaptation or a spandrel?"*  
       - *Why it works:* Forces nuance. Answer: "Vocal cords = adaptation for breathing/swallowing. Language *exapted* that structure. Syntax might be a spandrel of brain constraints!" Tests if they grasp hierarchy/co-option.  

  6. **What to Skip + Wrap (1 min)**  
     - **Openly omit:** "We’re skipping Gould/Lewontin’s stats critique (null hypothesis testing in evo-bio). It’s vital for scientists, but today’s takeaway: not every trait has an *adaptive purpose*."  
     - **Closing punchline:** "Biology isn’t a codebase refactored by a perfect engineer. It’s legacy systems stacked on MVP hacks."  

  ---

  ### **Why This Works**  
  - **Peacock > Panda:** Peacocks show *active harm* from spandrels (predation), making constraints visceral. Pandas are "quirky reuse," distracting from byproducts.  
  - **Preempted Pitfalls:**  
    - "Spandrels = junk?" → Emphasize blood color (functional but not selected).  
    - "Adaptationism = perfect design?" → Stress trade-offs (peacock vulnerability).  
    - Spandrel/exaptation blur → Clarify *sequence*: byproduct first, repurpose later.  
  - **Tech Leverage:** Legacy code makes abstract constraints tangible. But you **pivot to bio fast**—don’t let analogy dominate.  

  ### **Critical Logistics**  
  - **Slides:** 1 cathedral diagram, 1 peacock image, 1 code architecture schematic.  
  - **Rule:** Ban "why" questions early (e.g., "Why do giraffes have long necks?"). Reframe: "Is this trait an adaptation, spandrel, or both?"  

  This sequence forces cognitive dissonance early (peacock trade-offs), then grounds it in familiar tech struggles. The check-question exposes oversimplification—language debates reveal if they see layers.
