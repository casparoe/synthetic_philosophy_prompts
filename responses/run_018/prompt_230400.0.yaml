  The argument hinges on two slippery points: the operational vs. ontological meaning of simultaneity (step 4), and the move from frame-relative reality to absolute reality (step 6). Historically, philosophers like Stein and Maudlin attack these. Stein’s point—that "real now" requires co-presence, not just simultaneity—resonates with the user’s fear that "real" becomes meaningless if relativized. Meanwhile, Maudlin’s Lorentzian variant sacrifices Lorentz invariance to keep becoming, which a physicist might find costly.

