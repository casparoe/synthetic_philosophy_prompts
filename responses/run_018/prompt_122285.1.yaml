answer: |-
  The established concept closest to your description is **narrative dispossession**, but your specific focus on *inheritable loss* requires refining it into **agnostic loss**. Here's the definition, boundaries, and reasoning:

  **Agnostic loss** is the property of a historical event (typically a defeat) where the *moment of loss itself* is symbolically separable from the *agency, responsibility, or subsequent compromises* of the losers, allowing it to be inherited primarily as a vessel for abstract virtues (like courage, sacrifice, defiance) or communal identity, rather than as a legacy requiring reckoning with specific choices or failures.

  **Edges and Boundary Arguments:**

  1.  **Why "agnostic"?** It signifies the inheritance is deliberately *unknowing* or *indifferent* to the losers' full context, motivations, or actions beyond the isolated moment of catastrophe. This separation is crucial.
  2.  **Core Mechanism:** The event must be reducible to a **discrete, emotionally resonant moment** (the charge, the last stand, the evacuation under fire) where the losers appear primarily as *objects* of overwhelming force or circumstance, not as *subjects* who meaningfully chose their path *into or out of* that moment. Their power, ideology, or subsequent actions become noise, not signal.
  3.  **Boundary Case 1: The Charge of the Light Brigade (Inside):** This fits because the inheritance focuses almost exclusively on the *action* of the charge itself – the futile bravery in the "valley of Death." The documented blunder and arguments over fault *are part of the historical record*, but they are **not the core of the inherited emblem**. The emblem *is* the charge: blind obedience, doomed courage, tragic sacrifice. The inheritance *is agnostic* to the cause; the cause's stupidity or controversy *enhances* the pathos of the loss, making the *moment of action* even more powerfully isolated as pure, futile heroism/folly. The blunder enables the dispossession of context.
  4.  **Boundary Case 2: Victories as Emblems (Inside the broader phenomenon, though not "loss"):** Agnostic loss describes a *common mechanism for myth-making around defeat*, but the core mechanism – **narrative dispossession/isolation of a resonant moment** – applies equally to *some* victories. Thermopylae (like Masada) is inherited as defiant last stand, agnostic to Spartan imperialism. D-Day's Omaha Beach is inherited as raw courage and sacrifice, often agnostic to complex Allied strategy or politics. The key isn't victory/defeat, but whether the event can be **stripped of complicating agency and context** to serve as a pure symbol. Defeats are simply more *prone* to this because the loss provides a natural endpoint and inherent pathos.
  5.  **What Falls Outside? Events demanding reckoning with agency:** The Armistice/Vichy collaboration fails as agnostic loss because its essence *is* the exercise of choice (capitulation, collaboration, survival) under occupation. Inheriting it *requires* engaging with responsibility, compromise, and morally fraught decisions *after* the moment of military defeat. The Confederate *cause* (slavery, government actions) couldn't be inherited agnostically; it demanded justification or evasion, hence it was dropped, leaving only the isolated, agency-light *moment* of sacrifice (Pickett's Charge) as the pure vessel. The catastrophic loss of the Second Temple involved profound theological and communal self-reproach about Jewish agency (sin, disunity) leading to divine punishment – it *demanded* reckoning with the losers' role, preventing its inheritance as a pure emblem of defiance like Masada's isolated moment.

  **Why this boundary?** Agnostic loss hinges on the *possibility and success* of symbolically severing the resonant moment of crisis from the losers' broader exercise of power, responsibility, or complex choices. If the event's significance is inherently tied to those elements (Vichy choices, Temple theology/sin, Confederate ideology), it resists agnostic inheritance and remains an "embarrassment" or subject for complex reckoning. If the moment can stand alone, stripped of problematic context (Dunkirk boats, Light Brigade charge, Masada suicide), it becomes a usable, often sanctified, emblem. The Light Brigade's blunder is incorporated *into* the pathos of the isolated moment, not a barrier to it, hence included. Victories use the same dispossession mechanism, confirming that defeat, while common, isn't the essential factor; the essential factor is the **extractable, context-stripped moment**.
