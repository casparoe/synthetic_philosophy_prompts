  I should list non-negotiable criteria: avoiding contradiction, respecting statistical principles, and preserving the mentioned distinctions. Then, negotiable aspects like closure under entailment, which some schools might relax. For each desideratum, I need to explain the motivation from the paradoxes or hybrid case.

  Scoring approaches like probabilistic thresholds, coherence-only, and contextualism against these criteria will help the user evaluate options. But the focus should be on the criteria, not the scores. Highlighting where they succeed or fail, like probabilistic thresholds struggling with preface beliefs, is key.

