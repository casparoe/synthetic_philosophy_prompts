  ### **Proposed Principle: The Subjective Continuity Principle**  
  *(With explicit conditions)*

  1. **Centered World Definition**:  
     - A "centered world" is a pair `(branch, index)`, where:  
       - `branch`: Uncentered outcome (e.g., heads/tails, H/T).  
       - `index`: A unique, subjectively indistinguishable moment of first-person experience (e.g., Monday/Tuesday awakening, copy ID).  
     - *Motivation*: Cases 1, 3, and 5 require indexing by moments of experience (not time or identity) to handle amnesia/indistinguishability.  

  2. **Weighting Rule**:  
     - Assign equal prior weight to every *possible* centered world in the experiment.  
     - Probability of a branch = `(prior prob. of branch) × (number of centered worlds in branch) / (total centered worlds)`.  
     - *Motivation*: Cases 1 (1/3), 2 (bet rejection), 3 (1/3), and 5 (1/3) demand weighting by number of indistinguishable awakenings.  

  3. **Personal Identity Condition**:  
     - **Conditioning Requirement**: Upon awakening, the subject must condition on all centered worlds that are:  
       - (a) Subjectively indistinguishable (no information to break symmetry).  
       - (b) **Experienced by a single, continuing subjective perspective**.  
     - If the centered worlds in a branch are experienced by *distinct subjects* (no shared first-person perspective), exclude them from the index set.  
     - *Motivation*: Case 4 (identity-break) hinges on personal identity. The Tuesday copy is a separate subject, so the Monday subject cannot treat Tuesday as "their" index.  

  4. **Conditioning Rule**:  
     - Credence = `P(branch | centered worlds matching current subjective perspective)`.  
