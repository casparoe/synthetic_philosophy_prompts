  ### Analysis of Self-Locating Belief Cases

  Your intuitions across Cases 1–5 reveal a tension between **continuity of personal identity** and **indexical uncertainty**. Below, I synthesize a precise principle that captures your pattern of verdicts, overturning one intuition to ensure consistency. I then apply this principle to your additional case.

