answer: |-
  ### Exam Question  
  **Time Allowed:** 45 minutes  
  **Question:** The "paradox of deontology" is often illustrated by scenarios where adhering to an agent-relative prohibition (e.g., "do not kill") appears to permit a greater number of identical violations by others. Some philosophers suggest this paradox arises from erroneously treating agent-relative constraints as *linearly aggregable*—assuming that moral disvalue scales proportionally with violations, analogous to misapplying linear models in physics (e.g., ignoring saturation effects in force interactions or interference in wave phenomena).  

  Precisely articulate the paradox of deontology *without* using the standard "one death vs. five deaths" sacrificial dilemma. Then, critically evaluate whether diagnosing the paradox as a "scaling error" resolves it or merely relocates the tension inherent in deontological ethics. Finally, defend a substantive position: Does this analogy successfully reconcile agent-relativity with moral outcomes, or does it expose a deeper flaw in deontology?  

  ---

  ### Model Answer (498 words)  

  The paradox of deontology arises when an agent’s commitment to a categorical prohibition (e.g., "never deceive") forbids them from performing a minimally violative act that would prevent multiple agents from committing significantly *greater* violations of the *same* norm. For instance: a security officer (Agent A) can prevent ten corrupt colleagues from systematically fabricating evidence against innocents—each colleague’s acts constituting extensive deception—by lying once to disable a database. Deontology forbids Agent A’s single lie, permitting ten agents to commit graver, coordinated deception. The paradox is that strict adherence to agent-relative duties *amplifies* total violations of the duty it seeks to uphold.  

  The "scaling error" diagnosis posits that this paradox stems from illicitly aggregating agent-relative violations as if they were agent-neutral harms. Treating prohibitions as linearly scalable assumes that ten deceptions are straightforwardly "worse" than one, ignoring how deontology attributes *non-fungible* moral disvalue to each agent’s act based on their role. Physically, this resembles assuming springs obey Hooke’s law indefinitely (force ∝ displacement), neglecting elastic limits where proportionality breaks. Morally, linear aggregation neglects "saturation effects": each violation is non-interchangeable because duties bind specific agents, not just outcomes.  

  This diagnosis relocates—but does not resolve—the tension. It correctly identifies that aggregating agent-relative duties violates their conceptual structure: my duty not to kill is not diminished by others’ willingness to kill. However, it fails to address why we intuitively find permitting ten violations via inaction *more troubling* than committing one. The analogy exposes that deontology treats duties as having infinite "thresholds" (no saturation), but this merely shifts the paradox to a clash between *two* core deontic commitments: the non-negotiability of duties and the principle that "more violations are worse." When preventing others’ violations requires minimal transgression, the latter principle pressures the former, revealing a foundational conflict.  

  I argue this analogy *strengthens* deontology by clarifying its irreducible structure but concedes a practical flaw. It succeeds by showing agent-relativity is non-linear: duties are "saturated" at the individual level (no diminishing disvalue per violation), making aggregation incoherent. Resolving the paradox requires abandoning aggregation, not diluting duties. Yet the tension persists because deontology lacks resources to condemn *enabling* aggregated violations without smuggling in consequentialism. Thus, the diagnosis defends deontology’s consistency but highlights its counterintuitive implications in systems of coordinated wrongdoing—a limitation inherent to its agent-centered architecture.  

  ---

  ### Marking Scheme  
  1. **Precision in defining the paradox**: An excellent answer specifies a non-standard scenario where *inaction* by one agent permits *multiple others* to violate the *same* prohibition more severely, avoiding quantitative comparisons (e.g., "greater harm"). Competent answers describe aggregation generally but lose marks if they default to trolley variants or conflate prohibitions with generic harms.  
  2. **Analysis of the scaling analogy**: Top answers explicitly link linear aggregation to physics (e.g., misapplying Hooke’s law beyond elastic limits) and contrast it with moral saturation (duties as non-fungible per agent). Competent answers note non-aggregability but lose marks for vague analogies or omitting interference/saturation.  
  3. **Resolution vs. relocation critique**: Excellent responses argue the diagnosis relocates tension to deontology’s internal conflict (inviolable duties vs. minimizing violations), citing enabling/permissive consequences. Competent answers claim resolution without addressing residual tension; failing answers conflate relocation with dismissal.  
  4. **Substantive defense**: Excellent answers take a clear stance (e.g., "clarifies but does not resolve") and ground it in deontology’s core principles (e.g., non-fungibility), not pragmatic compromise. Competent answers defend a position weakly; marks deduct for unargued consequentialism or claiming the paradox dissolves.  
  5. **Avoidance of pitfalls**: Top answers distinguish agent-relativity from thresholds (e.g., not confusing "never kill" with "no killing beyond N cases") and avoid reducing prohibitions to harm-minimization. Marks deduct for conflating aggregation with numbers (e.g., "large-scale dilemmas") or treating duties as scalar.
