prompt: |-
  I serve as chief methodological auditor for a federal forecasting unit that issues ten-year policy projections—energy-transition scenarios, public-health trajectories, economic-impact models. Our charter requires that when evidence undermines a previously endorsed projection, we issue a revised confidence report, but over the past year we have developed a troubling bifurcation: some analysts discard the entire projection the moment its source model is criticized, while others absorb the meta-criticism yet leave the recommendation untouched, appealing to structural robustness. In discussions with my colleagues last quarter we kept circling the same philosophical problem—what epistemologists call the dogmatism paradox—where rational belief revision seems to demand either stubborn retention of prior beliefs despite higher-order evidence about one's own reasoning, or a self-undermining skepticism that dissolves belief whenever methodological error is detected. I need a reusable decision procedure my audit team can run whenever a challenge targets not the world itself, but the reliability of the reasoning process that produced a prior endorsement: it should specify, in order, how to classify the challenge as first-order or higher-order, what conditions must be met for partial retention versus full revision, the exact point at which the question stops being factual and becomes one of institutional risk-tolerance, and explicit checks that prevent both dogmatic retention and excessive dissolution. Apply the procedure to three cases: (1) a climate-economy model whose key elasticity parameter is shown to derive from a systematically biased sample; (2) a public-health transmission model later found conceptually misspecified in its core dynamics; and (3) a contested meta-evidence scenario in which one review alleges fundamental bias while another defends the original estimation, so that the procedure must yield an answer the audit team will dislike and must flag precisely where judgment is irreducible. Finally, state clearly what the procedure cannot do—for instance, whether it can settle disagreements about the prior plausibility of the original claim, or whether it requires access to information that is typically unavailable to auditors.
reasoning: |-
  We are designing a decision procedure for the audit team to handle challenges to the reliability of the reasoning process behind a projection. The procedure must address the dogmatism paradox by avoiding both stubborn retention and excessive dissolution of belief.

  The procedure will have the following steps:

  1. **Classify the Challenge**: Determine if the challenge is first-order (targeting the evidence or assumptions directly) or higher-order (targeting the reliability of the reasoning process, such as methodological flaws, biases, or errors in the model structure). 
     - First-order: e.g., new data contradicting an assumption, new evidence about the world.
     - Higher-order: e.g., criticism of the model's structure, sampling method, or cognitive biases in the analysis.

  2. **Assess the Severity and Scope of the Challenge**:
     - For a higher-order challenge, determine the extent to which the criticism undermines the entire reasoning process or only a part.
     - Conditions for partial retention: if the challenge targets a specific component that is separable and the rest of the model is robust, then partial revision may be possible.
     - Conditions for full revision: if the challenge undermines the core structure or the foundational assumptions of the model, then the entire projection may need to be revised or retracted.

  3. **Determine the Threshold for Institutional Risk-Tolerance**:
     - When the challenge does not conclusively prove the model wrong but raises doubts about its reliability, the decision becomes one of institutional risk tolerance. This occurs when:
       - The evidence is ambiguous (e.g., conflicting reviews).
       - The challenge points to a potential flaw but without definitive proof of error in the projection.
     - At this point, the audit team must flag the issue and defer to the institution's risk tolerance. The procedure should explicitly note when this threshold is crossed.

  4. **Explicit Checks to Avoid Dogmatism and Excessive Skepticism**:
     - **Anti-dogmatism check**: If the challenge is a higher-order criticism that calls into question the reliability of the reasoning process, and if this criticism is credible and not easily rebutted, then the prior belief must be revised. Sticking to the original projection without adjustment is not allowed.
     - **Anti-excessive-skepticism check**: If the challenge is only a potential or minor flaw that does not directly affect the core conclusions, and if the model has multiple lines of support (structural robustness), then full dissolution of belief is not required. Partial revision or a confidence downgrade may be sufficient.

  **The Decision Procedure**:

  **Step 1: Classify the Challenge**
     - If the challenge provides new evidence about the state of the world that contradicts the projection, classify as first-order. Proceed to standard evidence update (not the focus here).
     - If the challenge questions the reliability of the methods, data sources, model structure, or reasoning process, classify as higher-order. Proceed to Step 2.

  **Step 2: Assess Severity and Scope of the Higher-Order Challenge**
     - **Severity**: How fundamental is the flaw? Does it affect the core mechanism or a peripheral part?
       - Core: if the flaw undermines the model's core dynamics, key parameters, or foundational assumptions.
       - Peripheral: if the flaw is in a non-essential part and the main conclusions are supported by other robust elements.
     - **Scope**: Is the flaw localized (affecting only a part of the model) or global (affecting the entire model)?
     - Conditions for partial retention: The flaw is localized and the model has multiple independent lines of support (structural robustness) such that the main conclusions are not solely dependent on the challenged part.
     - Conditions for full revision: The flaw is global or affects the core, and there are no independent supports for the main conclusions.

  **Step 3: Determine the Point of Institutional Risk-Tolerance**
     - If, after assessment, the challenge is credible but not conclusive (e.g., conflicting expert opinions, or the flaw is possible but not proven to have caused significant error), then the issue becomes one of risk tolerance.
     - The procedure must explicitly note: "At this point, the question is no longer purely factual but depends on the institution's tolerance for risk in the face of methodological uncertainty. The audit team should document the uncertainty and let the institution decide on the level of confidence to maintain, based on risk appetite."

  **Step 4: Apply Explicit Checks**
     - **Anti-dogmatism check**: After Step 2, if the challenge is severe and global, but the team is inclined to retain the projection, require a justification that addresses the criticism and provides additional validation. If none, force a revision.
     - **Anti-excessive-skepticism check**: If the challenge is minor or localized and the team is inclined to discard the entire projection, require an analysis of the structural robustness. If the core conclusion is supported by multiple independent lines of evidence, then allow partial revision (e.g., confidence downgrade or adjustment of specific parts) instead of full retraction.

  **Application to Cases**:

  **Case 1: Climate-economy model with key elasticity parameter derived from a systematically biased sample.**
     - Step 1: Classify as higher-order (methodological flaw in data sampling).
     - Step 2: Assess severity and scope: 
       - The parameter is key, so the flaw is severe and likely global because elasticity parameters often underpin the entire model. However, if the model has other independent parameters or robustness checks that yield similar conclusions, then it might be partial.
       - If the elasticity is central and the model is sensitive to it, then the entire projection is undermined. Otherwise, partial revision (re-estimating the parameter and rerunning the model) may be sufficient.
     - Step 3: If the re-estimation is possible and shows the original projection is robust, then no full revision. But if the re-estimation leads to significantly different results, then full revision. If the bias is proven but the exact correction is unknown, then it becomes a risk-tolerance issue: the institution must decide whether to use a revised confidence interval or wait for more data.
     - Step 4: 
       - Anti-dogmatism: We cannot retain the projection without addressing the bias. Must revise.
       - Anti-excessive-skepticism: If the model has other independent supports, we don't discard the entire projection. We adjust the parameter and see the impact.

  **Decision**: The challenge is severe and global because the parameter is key. Unless there is structural robustness (e.g., the model uses multiple estimation methods for the same parameter and the others are sound, or the conclusion is insensitive to this parameter), full revision is required. If the institution lacks the data to re-estimate, then the projection must be withdrawn until corrected, or marked as having low confidence.

  **Case 2: Public-health transmission model later found conceptually misspecified in its core dynamics.**
     - Step 1: Higher-order challenge (model structure is flawed).
     - Step 2: The misspecification is in the core dynamics, so it is severe and global. The entire model structure is called into question. There is no structural robustness in the same model. However, if there are multiple models (an ensemble) and the others are not challenged, then the projection might be partially retained by downgrading the weight of this model.
     - Step 3: If the misspecification is proven (e.g., by comparing with a better-specified model that fits the data), then full revision is required. If the misspecification is only alleged and not proven, but there is significant doubt, then it becomes a risk-tolerance issue: the institution must decide whether to use the model with a warning or abandon it.
     - Step 4:
       - Anti-dogmatism: We cannot ignore a core dynamics misspecification. The model must be revised or abandoned.
       - Anti-excessive-skepticism: If the model was one of several in an ensemble and the ensemble conclusion remains robust without it, then we only remove this model and adjust the ensemble. But if it was the sole model, then the projection must be retracted until a corrected model is built.

  **Decision**: Full revision required because the core dynamics are misspecified. The projection based solely on this model is invalid. If the model was part of an ensemble, then the ensemble must be re-run without this model (or with a corrected version) and the projection updated accordingly.

  **Case 3: Contested meta-evidence scenario: one review alleges fundamental bias, another defends the original estimation.**
     - Step 1: Higher-order challenge (alleging bias in the original process).
     - Step 2: Severity and scope: The allegation of fundamental bias is severe and global, but it is contested. We must assess the credibility of the allegations and the defense. Without a clear consensus, we cannot determine the scope with certainty.
     - Step 3: This is inherently ambiguous. The procedure must flag that the issue is now one of institutional risk-tolerance. The audit team cannot settle the dispute on the basis of the available evidence. They must document the disagreement and the arguments on both sides. The institution must decide whether to continue using the projection (with a lower confidence) or suspend it until further evidence is available.
     - Step 4:
       - Anti-dogmatism: We cannot retain the projection without addressing the bias allegation. But since it is contested, we cannot fully reject the projection either.
       - Anti-excessive-skepticism: We cannot discard the projection solely because of an allegation that is credibly defended.

  **Decision**: The procedure yields an answer that the audit team will dislike: it cannot resolve the dispute. The projection's confidence level should be downgraded to reflect the dispute, and the issue is escalated to the institution's risk-tolerance decision. The audit report must clearly state that the challenge has not been conclusively resolved and that the continued use of the projection is a matter of institutional risk appetite.

  **Limitations of the Procedure**:

  1. **Cannot settle prior plausibility disagreements**: The procedure assumes that the original projection was based on a reasonable prior. It does not re-litigate the prior plausibility of the original claim. It only handles challenges to the reasoning process after the fact.

  2. **Requires information that may be unavailable**: 
     - The procedure requires an assessment of the severity and scope of the flaw, which may require expertise beyond the audit team (e.g., domain experts to judge if a parameter is core or if a model is robust without a component). 
     - In contested cases (like Case 3), the procedure cannot resolve the dispute without additional evidence, which may be unavailable.

  3. **Cannot manufacture structural robustness**: If the original model does not have multiple independent lines of support, the procedure cannot create them. It can only identify if they exist.

  4. **Depends on the institution's risk tolerance**: The procedure explicitly hands off the decision in ambiguous cases to the institution's risk tolerance, which is outside the scope of the audit team's methodological mandate.

  5. **Cannot address all forms of higher-order uncertainty**: For example, if the challenge is about the possibility of undiscovered flaws (unknown unknowns), the procedure can only act on known challenges.

  By following this procedure, the audit team can systematically address challenges while avoiding the extremes of dogmatism and excessive skepticism.
answer: |-
  ### Decision Procedure for Handling Challenges to Reasoning Reliability  
  This procedure provides a systematic, step-by-step method for addressing challenges targeting the *reliability of the reasoning process* behind a projection. It avoids dogmatism (ignoring higher-order evidence) and excessive dissolution (discarding robust projections over minor flaws) by classifying challenges, defining revision thresholds, and explicitly marking where institutional risk-tolerance applies.  

  ---

  #### **Decision Procedure**  
  **Input**: A challenge to a previously endorsed projection, focusing on methodological flaws, biases, or reasoning errors.  
  **Output**: A revised confidence report (retain, partial revision, full revision) or escalation to institutional risk-tolerance.  

  1. **Classify the Challenge**  
     - **First-order challenge**: Targets *direct evidence* (e.g., new data contradicting assumptions).  
       - *Action*: Handle via standard evidence-update protocols (not covered here).  
     - **Higher-order challenge**: Targets the *reliability of the reasoning process* (e.g., model misspecification, biased sampling, cognitive errors).  
       - *Action*: Proceed to Step 2.  

  2. **Assess Severity and Scope**  
     - **Key questions**:  
       - Does the flaw undermine a *core axiom* (e.g., foundational assumption, causal mechanism)?  
       - Is the flaw *localized* (affects one component) or *global* (compromises the entire model)?  
       - Is there *structural robustness* (e.g., multiple independent lines of evidence, sensitivity analyses, or ensemble models supporting the conclusion)?  
     - *Action*:  
       - If **localized flaw + structural robustness**: Proceed to partial retention (Step 3).  
       - If **global flaw or no structural robustness**: Proceed to full revision (Step 4).  
       - If **uncertain severity/scope**: Flag for institutional risk-tolerance (Step 5).  

  3. **Conditions for Partial Retention**  
     - **Requirements**:  
       - The challenged component is non-core (e.g., auxiliary parameter, secondary assumption).  
       - The projection’s conclusion is supported by ≥2 independent methods/assumptions.  
       - Sensitivity analysis shows low impact on core conclusions.  
     - *Action*: Downgrade confidence rating (e.g., "High" → "Medium"), document limitations, and recommend targeted re-evaluation.  

  4. **Conditions for Full Revision**  
     - **Requirements**:  
       - The flaw affects a core axiom (e.g., causal mechanism, central parameter).  
       - No structural robustness exists (e.g., conclusion hinges solely on the flawed component).  
       - Re-running the model with corrected reasoning yields significantly different results.  
     - *Action*: Retract the projection, issue a new model, and reset confidence to "Provisional."  

  5. **Escalate to Institutional Risk-Tolerance**  
     - **Trigger**: Ambiguity in severity/scope (e.g., conflicting expert reviews, unquantifiable uncertainty).  
     - **Key demarcation**: The question shifts from *factual accuracy* to *institutional risk appetite*.  
     - *Action*: Freeze the current confidence rating, document the dispute, and escalate to policymakers with:  
       - Cost-benefit analysis of false positives/false negatives.  
       - Recommended actions based on risk tolerance (e.g., "Maintain projection with low confidence if underestimating climate risk costs ≤5% of GDP").  

  6. **Explicit Checks**  
     - **Anti-dogmatism check**: *If no revision is proposed, justify why the higher-order challenge does not undermine core axioms or robustness. If justification relies on dismissing criticism without evidence, revision is mandatory.*  
     - **Anti-dissolution check**: *If full revision is proposed, confirm the flaw has no credible counterweight via structural robustness. If robustness exists, partial retention is mandatory.*  

  ---

  ### **Application to Cases**  
  **Case 1: Climate-Economy Model with Biased Elasticity Parameter**  
  - **Step 1**: Higher-order challenge (biased sampling affects parameter reliability).  
  - **Step 2**:  
    - Severity/Scope: Elasticity is a *core parameter* (global flaw).  
    - Structural Robustness: Check if other parameters (e.g., technology adoption rates) or models (e.g., integrated assessment ensembles) support conclusions.  
  - **Partial Retention?** Only if robustness exists (e.g., conclusions hold across multiple elasticity values in sensitivity analysis).  
  - **Full Revision?** Required if no robustness (e.g., projections collapse when parameter is corrected).  
  - **Risk-Tolerance Escalation?** If bias magnitude is unknown, escalate with cost of underestimating transition costs.  
  - **Explicit Checks**:  
    - Anti-dogmatism: Cannot retain if parameter is core and bias is proven.  
    - Anti-dissolution: If ensemble models agree, retain with lower confidence.  

  **Verdict**: Full revision if no robustness; partial retention (e.g., widen error bounds) if supported by other evidence.  

  **Case 2: Public-Health Model with Conceptual Misspecification**  
  - **Step 1**: Higher-order challenge (flawed core dynamics).  
  - **Step 2**:  
    - Severity/Scope: Misspecification is *global* (invalidates causal structure).  
    - Structural Robustness: Unlikely (core dynamics are foundational).  
  - **Partial Retention?** Only if secondary indicators (e.g., empirical case data) align with conclusions.  
  - **Full Revision?** Required unless model is one of many in a robust ensemble.  
  - **Risk-Tolerance Escalation?** If misspecification is disputed (e.g., "simplification vs. error"), escalate with health-impact tradeoffs.  
  - **Explicit Checks**:  
    - Anti-dogmatism: Cannot retain without re-specification.  
    - Anti-dissolution: If surveillance data independently supports trajectory, partial retention allowed.  

  **Verdict**: Full revision (core dynamics are non-separable); if ensemble-based, partial retention with weight reduction.  

  **Case 3: Contested Meta-Evidence (Bias Allegation vs. Defense)**  
  - **Step 1**: Higher-order challenge (dispute about original reasoning reliability).  
  - **Step 2**:  
    - Severity/Scope: Unclear (conflicting expert assessments).  
    - Structural Robustness: Assess if other methods (e.g., different models) converge.  
  - **Partial Retention?** Only if independent evidence supports conclusions.  
  - **Full Revision?** Not mandated (contested, not proven).  
  - **Risk-Tolerance Escalation?** Required (irreducible ambiguity). Flag that the decision rests on institutional risk appetite. Document:  
    - "Challenge alleges cognitive bias in original team; defense cites methodological rigor. No consensus achievable. Projection confidence depends on tolerance for unquantified error (e.g., 10% risk of overestimation)."  
  - **Explicit Checks**:  
    - Anti-dogmatism: Cannot ignore allegation; must downgrade confidence.  
    - Anti-dissolution: Cannot discard if defense is credible and robustness exists.  

  **Verdict**: Escalate to risk-tolerance. Confidence downgraded to "Low," with policy options based on cost of inaction (e.g., "If bias risk >20%, suspend projection").  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve prior plausibility disputes**: It assumes the original projection was reasonable given initial evidence. It does not re-open debates about the *inherent plausibility* of the original claim (e.g., "Was this climate model plausible pre-challenge?").  
  2. **Handle unavailable information**: Requires access to:  
     - Model internals (e.g., code, parameters) for sensitivity testing.  
     - Structural robustness evidence (e.g., ensemble models, alternative methodologies).  
     If unavailable, the procedure defaults to risk-tolerance escalation.  
  3. **Override institutional values**: Cannot adjudicate risk-tolerance decisions (e.g., "How much economic risk is acceptable for climate action?"). It only frames tradeoffs.  
  4. **Resolve all higher-order ambiguities**: In contested cases (e.g., Case 3), it flags irreducible judgment but cannot synthesize consensus.  
  5. **Address emergent errors**: Focuses on *identified* flaws; cannot preempt unknown future criticisms.  

  This procedure ensures methodological rigor while balancing epistemology and practicality. By systematizing revision thresholds and demarcating risk-tolerance, it mitigates both dogmatism and excessive skepticism in federal forecasting.
