answer: |-
  ## Dialogue: The Unratified Constitution

  **Setting:** A sunlit common room at the Philosophy Institute. Dr. Aris Thorne (Counterpart Theorist) and Dr. Selene Voss (Transworld Identity Advocate) discuss over coffee.

  **Dr. Selene Voss:** Aris, I find your counterpart-theoretic treatment of artifacts deeply unsatisfying, particularly when we consider complex social objects. Take the case of the *Charter of the Free Cities*. In our world, W@, it was drafted by the Grand Assembly, underwent fierce debate, was ratified by a majority, and has been collectively recognized, referenced, and applied for centuries. It exists as a specific physical document and institutional framework. Now consider a nearby world, W1. In W1, an *intrinsically identical* document is drafted by an identical assembly under identical circumstances. Yet, due to a single dissenting vote shifting at the last moment, it fails ratification. It sits forgotten in an archive, never invoked, never shaping practice. Counterpart theory, as I understand it, must say the actual Charter in W@ has a counterpart in W1 – that intrinsically identical document?

  **Dr. Aris Thorne:** Precisely, Selene. That’s the beauty of counterpart relations. They are context-dependent and based on similarity. The document in W1 shares *immense* similarity with our Charter: same originators, same drafting process, same material constitution, same semantic content. It’s the closest thing to our Charter in W1. Claiming strict numerical identity across worlds for a *contingently existing* object like this Charter seems metaphysically extravagant. What grounds that identity beyond these similarities? A bare ‘thismess’? Haecceities for social artifacts strike me as deeply problematic – they lack the primitive intrinsic ‘thisness’ of fundamental particles. Counterpart relations capture the relevant modal variation: *this* Charter *could have been* unratified and ignored, and the document in W1 shows us what that would be like for it.

  **Dr. Selene Voss:** But Aris, you’re ignoring the very essence of what *makes* it the Charter – its institutional *life*. Its identity is constituted not merely by its physical form or its draft origin, but by its *embedding* within a network of collective recognition and practice. That unbroken chain of ratification, reference, interpretation, and application – this ‘institutional inertia’ you mentioned earlier – isn’t just an accidental property; it’s *constitutive* of its identity as *this* specific institutional artifact. The object in W1, while materially identical, *never entered that institutional role*. It never *became* the Charter. It’s a mere physical duplicate, a potential Charter that never actualized. Strict transworld identity preserves this: the actual Charter exists only in worlds where *it*, that very entity arising from *this specific historical chain of recognition*, is ratified and sustained. In W1, it simply doesn’t exist; only a qualitatively identical but numerically distinct object does.

  **Dr. Aris Thorne:** Ah, the ‘institutional inertia’ gambit! I concede it’s a powerful intuition. But let’s dissect it. You claim the chain of recognition is essential. Essential for *what*? For it being an institution? Perhaps. But for it being *this particular object*? That’s the crux. Counterpart theory readily accommodates the importance of relational properties. We can define a counterpart relation *weighted heavily* towards historical and recognitional continuity. In worlds very close to W@ where ratification barely passed and recognition was maintained, the counterpart relation holds strongly. But as we move to worlds farther away – like W1, where ratification failed entirely – the counterpart relation weakens because the crucial relational property of *actual institutional function* is absent. The document in W1 is still a counterpart, but a *less close* one, precisely because it lacks the sustained collective recognition. It represents a possibility where *this Charter* (as defined by its W@ origin and form) failed to gain traction. It doesn’t need strict identity to play that modal role.

  **Dr. Selene Voss:** You mistake the point, Aris. It’s not about the *strength* of the counterpart relation or the *degree* of closeness. The issue is one of *existence conditions*. On my view, sustained collective recognition isn't just a property that makes an object a *better* Charter; it’s what *brings this particular institutional entity into existence and sustains it*. Without that specific historical chain originating from its ratification, the institutional entity *never comes to be*. The physical document in W1 is causally isolated from the institutional reality of W@. It has no historical or modal connection to the *institutional role* our Charter occupies. Transworld identity, grounded in the *actual* historical origin and chain of recognition (the ‘inertia’), allows the Charter to exist in other worlds *only if* that chain is unbroken or sufficiently continuous *in those worlds*. W1 breaks the chain at the very first link – ratification. Therefore, the Charter *itself* doesn’t exist there. A counterpart relation blurs this ontological boundary – it suggests the Charter *could* exist without ever having been ratified, which seems incoherent for an institution whose existence is *defined* by collective acceptance.

  **Dr. Aris Thorne:** Your insistence on that specific chain feels suspiciously like origin essentialism for social objects. But why must the chain be unbroken? Imagine a world W2: identical ratification and initial recognition to W@, but after a century, a revolution occurs, the Charter is suppressed and utterly forgotten for 200 years, only to be rediscovered and *re*-ratified based on its intrinsic merits and historical significance. Does the ‘institutional inertia’ chain break during those 200 years? If so, does the original Charter cease to exist, and a numerically distinct one begin upon re-ratification? That seems absurdly discontinuous. Counterpart theory handles this smoothly: the Charter in W@ has a counterpart in W2. The rediscovered document is the *same* institutional entity, persisting through the break because the counterpart relation is re-established based on intrinsic properties (the text), historical origin, and the *intentional re-connection* to the original chain by the new recognizers. The ‘inertia’ is metaphorical, not a literal unbroken chain. Modal persistence for institutions is more about *recoverable identity* through relational structures grounded in intrinsic features, not a brittle historical thread.

  **Dr. Selene Voss:** The W2 case is challenging, I grant you. My transworld identity view, grounded in the *actual* chain, would indeed face a puzzle there. Perhaps the solution lies in the *intentionality* of the re-ratifiers *referring back* to the original entity, effectively *reconstituting* the same institution by deliberately picking up the broken chain – a form of institutional baptism *deferred*. But W1 is different. There, *no chain ever started*. No collective ever said, "This *is* our Charter." The object never acquired the institutional identity. Your counterpart relation, even a weak one, between the W@ Charter and the W1 document implies the Charter possesses a modal profile *independent* of its institutional becoming – that its identity is latent in the pre-ratification draft. This smuggles in a kind of Platonism for institutional artifacts. Their identity is *emergent* from the specific historical act and its sustained recognition. Counterpart theory, by relying on similarity of intrinsic properties *alone* to ground the relation across worlds like W1, fails to capture this emergent, historically constituted nature. It conflates the *substrate* with the *institution*.

  **Dr. Aris Thorne:** And your transworld identity, Selene, risks making institutional existence far too fragile, hostage to the exact continuity of a chain that may be vague or interrupted in intuitively non-fatal ways. It also struggles to explain how we *refer* to the Charter in modal contexts involving radical changes – we seem to track it via its content and origin, not an inaccessible haecceity or a potentially broken chain. The counterpart relation, flexibly defined to prioritize the right kinds of similarities – including the *potential* for recognition grounded in its intrinsic properties and origin – provides a more robust and intelligible account of how such entities persist modally, even across gaps like W2 or failures like W1. That document in W1 *is* what our Charter would be if it had failed – a counterpart, not the thing itself, but a representation of its unrealized possibility.

  **Dr. Selene Voss:** Whereas I maintain that unrealized possibility is not a possibility *for that thing*, precisely because that thing's existence depends on the realization. Our intuitions diverge fundamentally on what constitutes the 'thing' itself. The dialogue continues...

  ---

  **Meta-Reflective Note:**

  (a) My assessment of Voss's view handling W1 more convincingly would be significantly weakened by robust empirical or conceptual findings demonstrating that collective recognition operates more like a *trigger* revealing latent institutional identities tied fundamentally to intrinsic properties (like the Charter's text), rather than being *constitutive* of the entity's identity itself. If intentionality towards artifacts consistently tracks intrinsic features across recognition gaps in a way that suggests identity persistence *despite* broken chains, counterpart theory gains ground.
  (b) The point most likely to fail in my reasoning favoring Voss lies in the analogy between physical artifacts and institutions. While origin essentialism for physical artifacts (like a specific table) is debated, applying the *same* constitutive role to the socio-historical 'chain' for institutions might be an overextension. The concept of "institutional inertia" as a literal persistence condition is particularly vulnerable; it may be a compelling metaphor but lack precise metaphysical grounding compared to the formal machinery of counterpart relations. The difficulty in clearly defining when the chain is "broken" (as hinted in the W2 discussion) exposes a potential incoherence at the heart of this framing.
