prompt: |-
  I've been thinking on my own about what biologists mean when they assign a "function" to a part of an organism. From the outside, the split seems clear: one camp ties function to evolutionary history—what a structure was selected for—while the other ties it to present causal contribution—what it now does to maintain the organism. For hearts and eyes the two answers line up, so the debate feels abstract. But I've become stuck on a middle case that both sides talk past, which I want to call functionally repurposed vestiges: structures that have lost their original adaptive purpose, yet retain a causal profile identical to what they did in the past, and that profile now sustains a different organism-level process the part was never selected to support. If the causal work is the same but the evolutionary target is gone, and the organism now depends on this accidental contribution, should we say the structure is functioning properly, malfunctioning, or functioning only in a derivative sense? I want to turn this into a polished proposal for a four-month independent study project, applying for a small grant that supports conceptual work outside formal academia. The document should contain: a precise statement of the question showing it is genuinely open rather than settled by either camp; an explanation of why the standard heart-and-eye examples do not resolve it; a concrete method—what I would actually do week by week, whether constructing formal conditions for malfunction, modeling hypothetical redesigns, or analyzing the logic of "derivative" attribution; a clear description of what a successful result looks like and what specific finding would make the project fail; and an honest scope assessment for part-time work over one semester. I do not need a bibliography, reading list, or citations included; I will supply references myself. Please write this as a formal one-page proposal with these sections clearly marked.
