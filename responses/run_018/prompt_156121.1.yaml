  **Final Procedure Document (Checklist Format):**

  **Emergency Office Credence Combination Procedure**

  *Inputs:*
  - M: State model chance (for event A) [0-1]
  - L: Local report (description)

  *Output:* Official credence in A [0-1] and/or decision flag.

  *Steps:*
  1. **Direct outcome?** 
     - If L directly shows A is true, output 1.00. 
     - If L directly shows A is false, output 0.00. 
     - Else, proceed.

  2. **Inadmissible evidence?** 
     - If L is about the future outcome in a way the model can't account for, or is direct testimony of A (but not caught in step 1), or undermines the chance concept, flag: "HARD CASE: Inadmissible evidence." Stop for manual review.
     - Else, proceed.

  3. **Reference class match?** 
     - Does L narrow the situation in a way the model doesn't cover? (e.g., specific component, local cluster)
     - If yes, do we have a pre-agreed adjustment rule? 
          - Yes: Apply rule (e.g., "corrosion: +7%"). Output adjusted value.
          - No: Flag "HARD CASE: Reference class mismatch." Stop for manual review.
     - Else, proceed.

  4. **Model reliability?** 
     - Does L suggest the model is broken or unreliable for this case? (e.g., evidence of violated assumptions) OR is it self-locating (e.g., "first time in 100 years")?
     - If yes, flag "HARD CASE: Model reliability questioned." Stop for manual review.
     - Else, proceed.

  5. **Update with L:**
     - If L is already incorporated in M, output M.
     - Else, do we have a pre-agreed update rule for L? 
          - Yes: Apply rule (e.g., "each unusual case: +5%", with a cap at 95%). Output adjusted value.
          - No: Flag "HARD CASE: New evidence without update rule." Stop for manual review.

  6. **Policy constraints:**
     - Are there mandates that cap/floor the credence? 
          - Yes: Apply cap/floor (e.g., max 50%). Document: "Policy override: [reason]". Output constrained value.
          - No: Output value from step 5.

  *Sign-off:*
  Forecaster: ___________   Date: ___________

