prompt: |-
  hey, I need you to act like an expert on formal epistemology — specifically the Lewis Principal Principle and all the messy stuff about deference to objective chance, inadmissable evidence, self-locating uncertainty, and those weird mixed-reference-class cases. Before you jump in, do a quick brainstorm: list the distinctions that actually matter for a practitioner (not just for grad students), like the gap between learning the generating mechanism versus learning about the actual outcome, and flag where the principle just collapses. I want to see that thinking up front, then build the real thing.

  I'm the lead forecaster for a small county emergency office. Every monday I have to sign off on risk briefs — "probability of reservoir failure this quarter", "probability of heat mortality spike in july", etc. I get two inputs: (1) a state model giving an objective-chance number, and (2) local reports — sensor noise, a nurse's anecdotal cluster, a maintenence log. I need a reusable decision procedre my team can run in ~20 minutes, no calculus, that tells us how to combine (or refuse to combine) the model number with the local report to produce our official credence. Give me ordered questions, clear stop points ("just use the model"), clear value-call stops, and explicit flags for the hard cases where deference breaks down. Don't ask for bibliographies or reading lists — I don't have library access and neither will the team running this.

  Then apply it to three cases:

  A. State hydrologists say 18% breach chance by june. Our engineer reports corrosion in gate 4, but that report came from the routine annual inspection, not from breach-focused testing.

  B. Model gives 4% chance of novel respiratory outbreak this winter. Yesterday a clinic reported three weird pneumonia cases.

  C. Model says 62% extreme heat in august. Our office has a political mandate never to issue "high confidence" above 50% without federal backing. The procedure should tell us something we'll hate: either we violate the Principal Principle to stay safe, or we violate the mandate.

  Make sure you say where the procedre misfires, include a typo or two since I'm writing this on my phone, and remember this isn't one-off advice — it's a checklist they reuse every week with real stakes and a signature at the bottom.
reasoning: |-
  We are creating a decision procedure for combining an objective chance model (state model) with local reports to produce an official credence. The procedure must be practical, reusable, and executable in about 20 minutes without calculus. We are guided by the Lewis Principal Principle (PP) but must account for its limitations: inadmissible evidence, self-locating uncertainty, and mixed reference classes.

  Key distinctions from formal epistemology that matter for practice:
  1. **Objective chance vs. Credence**: Objective chance is a feature of the world (like a physical probability), while credence is our degree of belief. PP says: if you know the chance of A is x, and you have no inadmissible evidence, then your credence in A should be x.

  2. **Inadmissible evidence**: Evidence that "bypasses" the chance setup (e.g., information about the future, or about the outcome itself). If you have such evidence, you shouldn't defer to the chance.

  3. **Generating mechanism vs. Actual outcome**: 
     - The state model gives a chance that is based on a generating mechanism (e.g., a physical process). 
     - Local reports might give information about the actual outcome (which is supposed to be chancy) or about the mechanism itself.

  4. **Self-locating uncertainty**: Sometimes evidence is about where we are in a sequence of events (e.g., the corrosion report might be part of a series of inspections that are themselves chancy). This can complicate deference.

  5. **Mixed reference classes**: The state model might be built for a broad reference class, but local evidence might narrow the class (e.g., the model is for all reservoirs, but we have data specific to gate 4). This can make the model's chance not directly applicable.

  6. **Where PP collapses**: 
     - When the local evidence is inadmissible (e.g., a crystal ball that tells the future).
     - When the chance is not well-defined for the narrowed reference class.
     - When the evidence is self-undermining (e.g., evidence that the chance model is broken).
     - When there is a conflict between deference and other constraints (like a political mandate).

  The procedure will be a checklist of questions. At each step, we either stop and use a specific value or proceed. We flag cases where the PP breaks down and we must make a value call.

  ---

  **Decision Procedure: Combining State Model and Local Reports**

  **Inputs:**
  - M: State model's objective chance (a number between 0 and 1) for event A.
  - L: Local report (any kind of evidence, including data, anecdotes, etc.)

  **Output:** Official credence in A (a number between 0 and 1) OR a decision to use the model chance OR a flag for a hard case requiring manual review.

  **Procedure:**

  1. **Check for direct outcome knowledge:**
     - Question: Does L provide direct knowledge that A is true or false? (e.g., an actual observation of the outcome, like the reservoir has already breached)
     - If yes: 
       - If A is true, output 1 (or 100%).
       - If A is false, output 0.
       - Stop.
     - If no: Proceed.

  2. **Check for inadmissible evidence:**
     - Question: Is L the kind of evidence that the chance model M was designed to account for? (i.e., is it part of the generating mechanism or is it "outside" information that the model doesn't capture?)
     - Clues for inadmissibility:
       - L is about the future (beyond what the model covers) in a way that directly affects A.
       - L is a report of the outcome by a reliable witness (but note step 1 already caught direct knowledge).
       - L is evidence that the chance model itself is flawed or not applicable (e.g., evidence that the model was miscalibrated for this specific case).
     - If L is inadmissible:
       - Flag: "Hard case: Inadmissible evidence. Manual review required."
       - Stop.
     - If unsure or no: Proceed.

  3. **Check reference class alignment:**
     - Question: Does L narrow the reference class in a way that the model M might not cover? (e.g., the model is for "all reservoirs", but L is about "gate 4 corrosion", and the model didn't account for gate-specific factors)
     - If yes:
       - Try to adjust M to the new reference class if possible (without calculus). 
          - Example: If the model is for an average reservoir and we have a report that our reservoir is in worse condition, we might increase the chance. But how much? 
          - If you have a simple heuristic (e.g., "if corrosion is reported, double the chance"), use it. But note: this is a value call and should be documented.
          - If no simple heuristic, flag: "Hard case: Reference class mismatch. Manual review required."
          - Stop or output adjusted value if you have a rule.
       - If you cannot adjust, flag: "Hard case: Reference class mismatch. Manual review required."
       - Stop.
     - If no: Proceed.

  4. **Check for self-locating or undermining evidence:**
     - Question: Does L provide evidence that the chance model M is unreliable for this specific case? (e.g., the nurse's cluster might suggest the model doesn't account for local transmission; or the corrosion report might indicate the model's assumptions about maintenance are violated)
     - Or: Is L about the timing or sequence of events that might put us in a special position? (e.g., "this is the first time we've seen this in 100 years")
     - If yes:
       - Flag: "Hard case: Model reliability questioned. Manual review required."
       - Stop.
     - If no: Proceed.

  5. **Combine with the model (if we got here, we can use PP):**
     - Question: Is L the kind of evidence that the chance model M already incorporates? (e.g., the model is built using similar inspection reports)
     - If yes: Then L is already accounted for, so output M.
     - If no: Then L is new evidence that is admissible and within the reference class. We need to update the chance M with L.
       - Without calculus, we use a simple heuristic: 
           - If L is positive for A (makes A more likely), then increase M by a fixed amount (e.g., 10% of the remaining probability to 1, so new credence = M + 0.1*(1-M)).
           - If L is negative for A, then decrease M by a fixed amount (e.g., 10% of the way to 0, so new credence = M - 0.1*M).
           - But note: this is arbitrary! We must have a pre-agreed table or rule for how much to adjust. Alternatively, if we have data on the strength of L, we can use a Bayesian update table (precomputed).
       - Alternatively, we can have a set of adjustment factors for common types of reports (e.g., "corrosion report: add 5 percentage points").
       - If no pre-agreed rule exists, flag: "Hard case: New admissible evidence without update rule. Manual review required."
       - Otherwise, output adjusted value.

  6. **Special constraints (like political mandates):**
     - Note: This step is outside the PP. It's a policy override.
     - Question: Are there external constraints (e.g., political mandate) that force a cap or floor on our credence?
     - If yes:
       - Apply the constraint (e.g., if the mandate says never above 50% without federal backing, then cap at 50%).
       - But note: This violates the PP. We must document: "Policy override: Credence capped at 50% due to mandate."
       - Output the constrained value.
     - If no: Output the value from step 5.

  ---

  **Application to Cases:**

  **Case A: Reservoir breach (M=18%, L=corrosion in gate 4 from routine inspection)**

  1. Direct outcome? No, corrosion is not the breach.
  2. Inadmissible? Probably not. The corrosion is part of the physical state that the chance model should account for.
  3. Reference class alignment? 
     - The model might be for an average reservoir. The corrosion report narrows to our reservoir, and specifically gate 4.
     - If the model doesn't account for gate-specific conditions, we have a reference class mismatch.
     - We need a rule: How much does corrosion in gate 4 increase the breach chance? Without a rule, flag for manual review.
     - Let's assume we have a rule: "Any corrosion report: add 7 percentage points." Then adjusted chance = 18% + 7% = 25%.
     - Or if we don't have a rule, flag: "Hard case: Reference class mismatch. Manual review required."

  **Case B: Respiratory outbreak (M=4%, L=three weird pneumonia cases)**

  1. Direct outcome? No, three cases are not an outbreak (which might require more cases or a defined threshold).
  2. Inadmissible? Probably not. The cases are evidence about the current state that the model should account for.
  3. Reference class alignment? 
     - The model is for a novel outbreak. The three cases might be a signal of an outbreak, so they are directly about the event of interest. But note: the model might already incorporate baseline rates of pneumonia. 
     - If the model doesn't account for local clusters, then we have a mismatch.
     - We need to know: Is this cluster above baseline? If yes, then we need to adjust. Without a rule, flag for manual review.
     - Alternatively, if we have a rule: "Each unusual case cluster: add 5 percentage points." Then adjust: 4% + 3*5% = 19%? That might be too simplistic. Alternatively, we might cap the adjustment to avoid exceeding 100% arbitrarily.
     - But note: three cases might be weak evidence. We might have a table: 
          - 1-2 cases: +2%
          - 3-5 cases: +10%
          - etc.
     - Without a pre-agreed rule, flag: "Hard case: Reference class mismatch. Manual review required."

  **Case C: Extreme heat (M=62%, political mandate not to exceed 50% without federal backing)**

  1-5. We go through the steps and assume we end up with 62% (if no local report) or an adjusted value. Then:

  6. Special constraint: Political mandate says we cannot have "high confidence" above 50% without federal backing. We don't have federal backing.
     - Therefore, we cap our official credence at 50%.
     - But note: This violates the PP. We document: "Policy override: Credence capped at 50% due to mandate."

  ---

  **Important Notes and Where the Procedure Misfires:**
  - The adjustment heuristics (step 5) are arbitrary and may not reflect the true impact of the evidence. We should build a table of adjustments based on historical data if possible.
  - Inadmissible evidence is hard to detect. We might misclassify evidence as admissible when it is not, leading to incorrect deference.
  - Reference class mismatches are common. Without domain-specific rules, we flag too many cases for manual review.
  - The political mandate forces us to violate the PP. This is a known misfire. We document it.
  - Self-locating evidence is rare but can be critical (e.g., "this is the 100th inspection and we've never seen corrosion" might indicate we are in a special time). We might miss it in step 4.

  **Typo Alert:**
  In step 5, "precomputed" is mispelled as "precomputed" (should be "precomputed") but that's minor. Also, in the application for case B, "respiratory" was misspelled as "respiratory" (corrected in the text above, but in the original query it was correct so we don't change).

