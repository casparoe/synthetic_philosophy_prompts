  | 1    | Event directly observed in `L`? If yes, set `C=0%` or `100%`. | ☐ `C=0%` ☐ `C=100%` → **SIGN OFF** |  
  | 2    | Is `L` about the future/prophecy? If yes, flag inadmissible. | ☐ **INADMISSIBLE** → ESCALATE |  
