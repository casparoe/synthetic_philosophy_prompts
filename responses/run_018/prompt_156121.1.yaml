answer: |-
  ### **Expert Brainstorm: Core Distinctions for Practitioners**  
  *(Skip theory; focus on operational gaps where the Principal Principle (PP) fails)*  

  1. **Mechanism vs. Outcome Evidence**  
     - **Mechanism evidence**: Alters your view of *how the world works* (e.g., "gate corrosion accelerates failure"). PP *may still apply* if the state model accounts for mechanisms.  
     - **Outcome evidence**: Bears directly on *whether the event happens* (e.g., "gate 4 cracked yesterday"). PP *collapses*—deference is invalid.  

  2. **Inadmissible Evidence**  
     - **Definition**: Evidence the state model *cannot* digest (e.g., future predictions, privileged access to outcomes).  
     - **Collapse point**: If evidence is inadmissible, PP fails—*never* defer blindly.  

  3. **Reference Class Mismatch**  
     - **Problem**: State models use broad classes (e.g., "all reservoirs"), but local evidence narrows it (e.g., "gate 4").  
     - **Collapse point**: If local evidence redefines the event, PP breaks—adjust or reject the model.  

  4. **Self-Undermining Evidence**  
     - **Definition**: Evidence that attacks the model’s reliability (e.g., "corrosion sensors were uncalibrated when model ran").  
     - **Collapse point**: PP fails—distrust the model.  

  5. **Policy vs. Epistemology**  
     - **Reality check**: PP demands deference to chance, but mandates (e.g., "never >50%") override it. Flag conflicts openly.  

  ---

  ### **Decision Procedure: Combining State Models & Local Reports**  
  **Inputs**: State model chance `M` (0–100%), Local report `L` (text/data).  
  **Output**: Official credence `C` (0–100%), or a stop flag.  
  **Time**: <20 min. No math—use tables/heuristics.  
  **Critical rule**: When PP collapses, *stop and escalate*.  

  #### **Step 1: Is the Event Directly Observed?**  
  - **Question**: Does `L` *conclusively* show the event happened/didn’t happen?  
    - *If YES*:  
      - Event happened → `C = 100%`.  
      - Event impossible → `C = 0%`.  
      - **STOP HERE**.  
    - *If NO*: Proceed.  
  - *Why?* PP assumes uncertainty. Direct observation overrides chance.  

  #### **Step 2: Is `L` Inadmissible?**  
  - **Question**: Is `L` about the *future*, a *prophecy*, or *privileged access* (e.g., "fed leak says breach occurs tomorrow")?  
    - *If YES*: Flag **"INADMISSIBLE: PP VIOLATION"** → Escalate to supervisor. **STOP**.  
    - *If NO*: Proceed.  
  - *Why?* Inadmissible evidence breaks PP’s logic.  

  #### **Step 3: Does `L` Change the Reference Class?**  
  - **Question**: Does `L` narrow the scenario *beyond* the model’s scope?  
    - *If NO*: Proceed to Step 4.  
    - *If YES*:  
      - **Use heuristic**: Adjust `M` by pre-defined offsets (see *Table 1*).  
      - No offset rule? Flag **"REFERENCE CLASS MISMATCH"** → Escalate. **STOP**.  
  - *Why?* PP assumes fixed reference classes. Mismatches require manual fixes.  

  **Table 1: Common Reference Class Adjustments**  
  | Local Evidence          | Adjustment Rule                 |  
  |-------------------------|---------------------------------|  
  | Component defect (e.g., corrosion) | Add 10–20% to `M` (max 95%) |  
  | Small anomaly cluster   | Add 5–15% to `M`               |  
  | Maintenance logs clean  | Subtract 5–10% from `M`        |  

  #### **Step 4: Does `L` Undermine the Model?**  
  - **Question**: Does `L` suggest the model is *wrong/broken* (e.g., "sensors faulty when model ran")?  
    - *If YES*: Flag **"MODEL UNRELIABLE"** → Escalate. **STOP**.  
    - *If NO*: Proceed.  
  - *Why?* PP requires trust in the model. Self-undermining evidence kills deference.  

  #### **Step 5: Update `M` with `L` (If PP Holds)**  
  - **Question**: Is `L` weak/mechanism-focused (e.g., "routine inspection data")?  
    - *If YES*: `C = M`. **STOP**. *(PP demands full deference)*.  
    - *If NO* (strong new evidence):  
      - **Use heuristic**:  
        - `L` supports event → `C = M + (100 - M) * 0.2` (add 20% of remaining uncertainty).  
        - `L` opposes event → `C = M * 0.8` (reduce 20%).  
      - **STOP**.  
  - *Why?* Weak evidence is already "priced in" to `M`. Strong evidence requires conservative shifts.  

  #### **Step 6: Apply Policy Constraints**  
  - **Question**: Do mandates *cap/floor* `C` (e.g., "never >50% without federal backing")?  
    - *If YES*: Apply cap/floor. Document: **"POLICY OVERRIDE: PP VIOLATED"**.  
    - *If NO*: Use `C` from prior step.  
  - *Why?* Real-world constraints trump epistemology. Be transparent.  

  ---

  ### **Application to Cases**  
  **Case A: Reservoir Breach**  
  - `M = 18%` (state model). `L = "Corrosion in gate 4"` (routine inspection).  
    1. **Step 1**: No direct observation → Proceed.  
    2. **Step 2**: Not inadmissible → Proceed.  
    3. **Step 3**: Reference class changed? *YES*—model likely covers "average" reservoirs, not gate-specific defects.  
       - Use *Table 1*: "Component defect" → Add 15% → `C = 18% + 15% = 33%`.  
    4. **Step 4**: No model undermining → Proceed.  
    5. **Step 5**: Skipped (adjusted in Step 3).  
    6. **Step 6**: No policy cap → **Output `C = 33%`**.  
    - *Risk*: If corrosion severity is understated, this underweights `L`.  

  **Case B: Respiratory Outbreak**  
  - `M = 4%` (state model). `L = "Three weird pneumonia cases"` (clinic report).  
    1. **Step 1**: No direct observation → Proceed.  
    2. **Step 2**: Not inadmissible → Proceed.  
    3. **Step 3**: Reference class changed? *YES*—model may not cover local clusters.  
       - Use *Table 1*: "Small anomaly cluster" → Add 10% → `C = 4% + 10% = 14%`.  
    4. **Step 4**: No model undermining → Proceed.  
    5. **Step 5**: Skipped.  
    6. **Step 6**: No policy cap → **Output `C = 14%`**.  
    - *Risk*: If "weird" cases are common, this overreacts.  

  **Case C: Extreme Heat**  
  - `M = 62%` (state model). Mandate: Never report >50% without federal backing.  
    1. **Step 1–5**: Assume no `L` → `C = M = 62%`.  
    2. **Step 6**: Policy cap applies → **Output `C = 50%`**. Document: **"POLICY OVERRIDE: PP VIOLATED"**.  
    - *Hard truth*: You *must* violate PP to comply. Flag this in the brief.  

  ---

  ### **Where the Procedure Misfires**  
  - **False negatives on inadmissibility**: E.g., treating a nurse’s "hunch" as admissible.  
  - **Oversimplified adjustments**: Heuristics (Table 1) may misweight evidence in edge cases.  
  - **Typos/errors**: E.g., Step 5 formula says "add 20% of remaining uncertainty" (correct) but might be misread as "add 20 percentage points" (error).  
  - **Escalation overload**: Too many "STOP" flags? Prioritize building a local evidence lookup table.  

  ---  
  **Final Output**: Laminated 1-page checklist (below). Sign-off required.  

