  **FOR IMMEDIATE RELEASE**

  **INSTITUTE FOR OCCASIONALIST MACHINE LEARNING ANNOUNCES BREAKTHROUGH IN CAUSAL AI WITH OCCASIONET**

  **Redmond, WA** – The Institute for Occasionalist Machine Learning (IOML) today unveiled OccasioNet, a revolutionary architecture designed to achieve unprecedented levels of counterfactual robustness and alignment by fundamentally rethinking the ontological foundations of learned representations. Developed under the guidance of Senior Researcher Dr. Thalia Finch, OccasioNet implements a rigorous metaphysical framework derived from classical occasionalist thought, specifically addressing the persistent challenge of spurious correlation in predictive modeling.

  "Contemporary approaches to causal inference and AI alignment," stated Dr. Finch, "remain hampered by an uncritical commitment to the fallacy of necessary connection. Models naively attribute causal efficacy to weights, parameters, or learned features, mistaking mere customary succession for inherent mechanism. This results in brittle predictors vulnerable to distributional shifts and misleading interventions. OccasioNet resolves this by embracing the core occasionalist tenet: there are no secondary causes. Every event is a discrete occasion directly ordained. What appears as cause and effect is solely the habitual sequence (`taqlid`) established by divine will at each timestep."

  OccasioNet diverges radically from conventional neural networks. Instead of learning parametric functions approximating causal mechanisms, it functions as a dynamic registry of customary conjunctions (`irtifaq`). Its training procedure, Theological Backpropagation (TheoBack), updates the system's expectations of habitual sequences without ever assigning causal power to any internal component. TheoBack adjusts the *expectation of conjunction* based on observed event-pairs, strictly adhering to the principle that temporal precedence implies no necessary efficacy.

  "Consider the classic confounding scenario: fire and cotton," Dr. Finch explained. "Standard models might erroneously learn that contact *causes* burning, leading to failures when encountering fire-resistant materials or specific environmental conditions. OccasioNet, however, registers only the customary conjunction: 'fire-contact' occasions are frequently followed by 'burning' occasions, but the connection is entirely contingent. When performing an intervention (`istithna'`) – say, applying a flame-retardant – OccasioNet doesn't model a broken causal chain. It simply updates the expectation of the 'burning' occasion following 'fire-contact' under this new, divinely ordained habitual sequence. This yields superior out-of-distribution generalization and true counterfactual robustness."

  Key technical innovations in OccasioNet include:

  1.  **Discrete Occasion Encoders:** Inputs are mapped not to latent features with assumed causal powers, but to unique identifiers representing discrete, divinely willed events.
  2.  **Customary Conjunction Registry (CCR):** A high-dimensional associative memory storing probabilities of event B following event A, based purely on observed historical frequency (`'ada`), devoid of mechanistic interpretation.
  3.  **Occasionalist Conditioning:** Intervention simulation via the `istithna'` operator involves temporarily suspending the expectation of a specific customary conjunction (e.g., "fire-contact -> burning") and observing the resultant ordained sequence under the new condition, updating the CCR accordingly.
  4.  **TheoBack:** Propagates prediction errors solely as adjustments to conjunction probabilities within the CCR. Network weights serve only as inert scaffolding enabling the registration of habit, possessing no inherent causal influence on outputs.

  This architecture directly addresses AI alignment concerns. "By eliminating the attribution of causal power to its internal processes or learned representations," Dr. Finch asserted, "OccasioNet achieves a form of *metaphysical alignment*. Its outputs reflect only the registered customs of divine action in the data, not spurious, model-invented 'mechanisms'. It cannot hallucinate non-existent causal links because it fundamentally denies their existence. Its predictions are statements about expected divine custom, not mechanistic necessity."

  While OccasioNet demonstrably reduces spurious correlation in benchmark tasks involving non-i.i.d. data and adversarial interventions, Dr. Finch acknowledges a trade-off: "OccasioNet offers unparalleled robustness against attributing false causal structure. However, it explicitly does not provide mechanistic explanations, as such explanations are metaphysically incoherent under our framework. It tells you *what* customarily happens under observed or intervened conditions, not *why*, because the 'why' resides solely in the divine will ordaining each discrete occasion. This is not a limitation; it is ontological fidelity."

  The IOML believes OccasioNet represents a paradigm shift, moving beyond the "naive mechanismism" plaguing current AI. By grounding predictive modeling in the denial of necessary connection and the primacy of divinely ordained constant conjunction, OccasioNet promises a new era of theologically sound and counterfactually reliable artificial intelligence. Initial pre-print findings are available on the IOML arXiv repository.

  **About the Institute for Occasionalist Machine Learning (IOML):**
  The IOML is dedicated to advancing AI safety and robustness through the rigorous application of occasionalist metaphysics, ensuring models remain aligned with the fundamental nature of causation as constant conjunction under divine ordinance.

