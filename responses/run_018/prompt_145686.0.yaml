  First I need to deeply understand the advisor's pattern. The "yes" cases (536 dust veil, Tambora, Laki locally) all share direct physical impact with minimal human mediation - crop failures, visible environmental collapse. The "no" cases (Black Death, Little Ice Age) both emphasize human systems as necessary causal channels - trade networks for plague, diplomacy for war. Laki's split verdict is particularly telling: yes for Iceland's direct crop death, no for global effects mediated by colonial policy.

  For the 1281 case, the compound actor theory (volcanic aerosols + climate state causing typhoon) seems tricky. If I apply the "discrete physical event" rule, the typhoon would qualify as a direct actor like Tambora. But if I apply the "human mediation" rule, the typhoon was only decisive because humans chose to invade during monsoon season. 

  I'm noticing the advisor consistently resists complex systems explanations - she dismissed the Little Ice Age's role by calling it environmental determinism. That makes me think she'll reject this "compound actor" framing as overcomplicating. The typhoon was a discrete weather event; the Mongols' decision to sail in typhoon season was the real cause. 

  The best test case would be something like the 1588 Spanish Armada storm - if she calls that weather a non-actor because Philip II chose to sail late, it confirms the human mediation rule. If she calls it a direct actor, she might have room for environmental forces. But given her track record, I bet she sees human choices as the real drivers.
answer: |-
  Based on your advisor's track record, here's the prediction and reasoning:

  1.  **Predicted Verdict for 1281 Mongol Withdrawal:** **Reject the compound framing.** She will likely argue the typhoon itself was the discrete, decisive event, and the prior volcanic/climate conditions were merely background factors or preconditions. Framing them as a "compound actor" overcomplicates and risks environmental determinism.

  2.  **The Two Key Rules Fitting Her Track Record:**
      *   **Rule 1 (Discrete Physical Event):** A non-human factor acts as a *direct, immediate, and sufficient physical cause* of a significant outcome (e.g., crop death, infrastructure destruction, mass mortality) without essential mediation by *contemporary* human systems/choices.
      *   **Rule 2 (Human Mediation Rejection):** A non-human factor is *not* an actor if its impact *requires essential mediation or amplification by pre-existing human institutions, decisions, or systems* to cause the significant historical outcome. The human element is the primary causal driver.

  3.  **Predictions for 1281 Under Each Rule:**
      *   **Under Rule 1 (Discrete Physical Event):** The typhoon itself qualifies. Its direct physical force (winds, waves) *immediately and sufficiently* destroyed the fleet, causing the withdrawal. The volcanic aerosols/ENSO state are seen as *preconditions* influencing the storm's severity or likelihood, not co-actors delivering the *final, decisive blow*. **Prediction: Accept the typhoon as actor, reject the compound framing.**
      *   **Under Rule 2 (Human Mediation Rejection):** The typhoon's destructive impact was only decisive *because* of the Mongols' human decision to launch a massive seaborne invasion during the typhoon season. The human choice to put the fleet in harm's way is the essential mediating factor. The storm was the proximate trigger, but the human action created the vulnerability. **Prediction: Reject the typhoon (and compound) as actor; the failure is on Mongol planning/logistics.**

  4.  **Which Rule She Probably Runs:** **Rule 2 (Human Mediation Rejection)** is the stronger, more consistent driver of her verdicts.
      *   **Black Death (1348):** Rejected bacillus as actor because *human trade networks* were the essential mediator delivering it ("cargo").
      *   **Little Ice Age (30YW):** Rejected climate as actor because *human diplomatic failures* were deemed sufficient cause; climate was background, not a decisive mediator.
      *   **Laki (1783 Globally):** Rejected as actor because *Danish colonial policy* mediated the famine impact.
      *   **The "Yes" cases (536, Tambora, Laki locally):** All involve direct, unmediated physical destruction/suffering (veil blocking sun causing immediate collapse, eruption causing immediate crop failure/death, local gas/famine causing immediate death). Human systems are overwhelmed *by* the event, not mediating *its impact*.
      *   **1281 Consistency:** Framing the typhoon as part of a compound actor introduces complexity that her framework resists. She would see the *human decision to invade by sea during typhoon season* as the critical, mediating factor that turned a weather event into a historical turning point. The volcano/climate state is background context, not a co-actor.

  5.  **The Further Case to Tell Them Apart: The Spanish Armada (1588).**
      *   **Scenario:** The argument is that severe North Atlantic storms ("Protestant Wind") were the decisive non-human actor destroying the Spanish fleet, preventing the invasion of England.
      *   **Prediction under Rule 1 (Discrete Event):** Accept the storms as a historical actor. Their direct physical force destroyed the fleet.
      *   **Prediction under Rule 2 (Human Mediation):** Reject the storms as an actor. The decisive factor was *Philip II's* human decision to launch a complex, logistically strained invasion attempt late in the season with ships poorly suited for Atlantic conditions, *creating the vulnerability* the storms exploited. The failure was due to Spanish strategy/shipbuilding/command, not the weather.
      *   **Why it Tells Them Apart:** This case hinges on whether the storm's destructive power is seen as a direct, sufficient physical cause (Rule 1) or whether the human actions that put the fleet in that vulnerable position in that specific context are seen as the essential causal factor, with the storm being the proximate trigger (Rule 2). Her verdict here would strongly confirm which rule is primary. (Given her track record, expect a "No, that's on Philip II/Medina Sidonia" verdict).
