  I've been revisiting Aristotle's sea-battle argument while preparing a module on temporal logic, and I keep circling a specific hybrid view I can't quite calibrate. The standard framing forces a choice: either future contingents already have a definite truth-value, which seems to collapse contingency into necessity, or we reject bivalence for future-tensed statements altogether. But I'm drawn to a middle position that relies on what I'd call a "branch-closure" condition: a future contingent statement—say, that there will be a sea battle tomorrow—lacks a truth-value only while the alternative branches remain metaphysically open, and acquires one precisely when those alternatives become inaccessible rather than merely physically unrealized. On this view, Aristotle's inference from present truth to future necessity fails not because future statements are globally bivalent or globally bivalent-free, but because the premise smuggles in an assumption that "being true now" applies to statements about branches that have not yet reached closure.

  I'd like your credence—stated as a specific number between 0 and 1—that this branch-closure resolution actually dissolves the paradox without being ad hoc, together with a full decomposition. Break it into at least four components: (a) whether Aristotle's original argument genuinely requires universal bivalence or only assumes it locally for settled facts; (b) whether the distinction between metaphysical inaccessibility and physical impossibility is coherent and non-arbitrary in this context; (c) whether accepting localized truth-value gaps violates a deeper modal or logical principle that makes the cost unacceptable; and (d) whether the resolution generalizes cleanly to other future contingents or collapses into special pleading for the sea-battle case. Assign each a rough probability, show how they combine into your final figure, and tell me which single component your number is most sensitive to. If you had to identify where my disagreement with a colleague—who assigns the view about 0.3 credence—most likely lives, which of these four sub-questions should we focus on?
