  For structure: opening establishes constructivism (Refrain 1), second tercet introduces quadrature failure (Refrain 2), then alternate. Final quatrain merges both refrains without resolution. Vocabulary should feel Hobbesian - "motion", "demonstration", "matter", "proof" - but accessible. 

  Key challenge: balancing precision with poetic compression. Lines like "Definition's edge defines the shape I own" distill his view that geometric truth comes from self-made definitions. The closing couplet "I draw the line; it is not in the stone / Yet the circle remains unsquared" leaves the tension raw - is the flaw in his method or the circle's nature? 

