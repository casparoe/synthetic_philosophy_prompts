answer: |-
  Here is the diagnostic taxonomy for your "Work" scenario, structured as requested. The tree resolves to five coherent positions with one unoccupied node, using physics-compatible language throughout.

  ---

  **Root Question:** Can an object survive the complete replacement of all its constituent matter if its form and causal-functional loop are preserved continuously by an active process?  
  → **Yes** → Proceed to Second-Level Node  
  → **No** → **Leaf: Mereological Essentialism**  
  *(Diagnosis: The Work cannot persist through any material change; it is destroyed when the first atom is replaced—like a crystal lattice dissolving at the first defect.)*  

  **Second-Level Node:** At any given time, can the Work and the ceramic-biofilm aggregate be two distinct objects occupying the same region but with different modal properties (e.g., the Work survives crushing if reassembled, while the aggregate does not)?  
  → **Yes** → Proceed to Third-Level Node  
  → **No** → Proceed to Fourth-Level Node *(bypassing Third-Level)*  

  **Third-Level Node (following "Yes" above):** Is persistence best analyzed as:  
  (A) A single 3D entity enduring through time (gaining/losing parts like a standing wave), or  
  (B) A 4D spatiotemporal "worm" composed of temporal slices?  
  → **(A) Endurance** → **Leaf: Constitution View (Coincident Objects)**  
  *(The Work and aggregate coexist in the same space but differ modally—like a magnetic field and its ferromagnetic substrate, sharing a region but having distinct survival conditions.)*  
  → **(B) 4D Worm** → **Leaf: Four-Dimensionalism/Perdurantism**  
  *(The Work is a spacetime volume; its "persistence" is just later temporal parts maintaining the functional loop—like a laser pulse propagating through a medium, defined by its waveform, not its photons.)*  

  **Fourth-Level Node (following "No" at Second-Level):** Is the boundary distinguishing the Work from its surroundings:  
  (X) A mind-independent fact (e.g., tied to causal cohesion), or  
  (Y) A conventional projection?  
  → **(X) Mind-independent** → **Leaf: Functional-Continuity View**  
  *(The Work persists iff its causal-functional loop is maintained, regardless of substrate—like a vortex in turbulent flow, re-identifiable by dynamics, not material history.)*  
  → **(Y) Conventional projection** → **Leaf: Artifact-Eliminativism/Conventionalism**  
  *("The Work" is a useful label for patterns in the aggregate, but has no ontological weight—like labeling a storm system; all that exists is the underlying physics.)*  

  ---

  ### Critical Notes & Ambiguities:
  1. **Unoccupied Node:**  
     - Path: **Root: Yes** → **Second: No** → **Third: N/A** → **Fourth: [Irrelevant]**  
     *(Diagnosis: **Conceptually incoherent**—denying coincidence while accepting material replacement requires either 4D parts or functional persistence, both bypassed here.)*  

  2. **Ambiguous Pair:**  
     - **Functional-Continuity View** vs. **Conventionalism** cannot be cleanly separated by this tree. Both answer "No" to coincidence.  
     - **Required Distinction:** *Does the causal-functional loop have ontological significance beyond human convention?*  
       - Functional-Continuity: Yes (real patterns exist independent of minds, like turbulence scales).  
       - Conventionalism: No (all "patterns" are observer-dependent, like coordinate systems).  

  3. **Key Clarifications:**  
     - **Mereological Essentialism** denies the root premise: total matter replacement is impossible without destruction.  
     - **Constitution View** requires modal separation (e.g., the Work could theoretically be disassembled/rebuilt, while the aggregate could not).  
     - **Functional-Continuity** avoids coincidence by reducing the Work to its causal role, rejecting the aggregate as a separate entity.  

