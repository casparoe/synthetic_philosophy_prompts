answer: |-
  Here’s a structured plan for your 50-minute session, optimized for your audience and goals. The sequence leverages cognitive contrast and builds complexity gradually, with empire lifespans as the anchor example.

  **Why Empires Work Better Than Planning-Fallacy Examples:**
  - **Inoculation Avoidance:** Your audience has heard "students underestimate essay time" ad nauseam. Empires feel novel and high-stakes.
  - **Emotional Distance:** No one has skin in the game about the Aztecs vs. Han Dynasty. Reduces motivated reasoning.
  - **Forces Distribution Thinking:** Lifespans *must* be a distribution (50–500 years), not a point estimate. Highlights uncertainty.
  - **Class Construction Complexity:** "What counts as an empire?" forces engagement with reference-class ambiguity in a way "construction projects" doesn't.
  - **"Special Case" Temptation:** Everyone thinks *their* favorite historical analogy is unique – empires expose this bias brutally.
  - **Must Haves:** Enumerable class (even if fuzzy), clear failure endpoint (collapse/loss of hegemony), quantifiable outcome (duration).
  - **Must Avoid:** Overlap with attendee expertise (e.g., don't use actuarial tables if actuaries are present), recent/ongoing cases (e.g., "Is the US an empire?").

  **Session Sequence (50 Min Total):**
  *(Whiteboard is critical – sketch distributions, classes, updates)*

  1.  **Hook & Inside View Definition (5 min):**
      *   **Do:** Ask: *"How long do you think a typical major empire lasts? Just shout numbers."* Note range on board. Then: *"Pick ONE empire you know well – say, Rome. List 3-5 specific factors making it last as long as it did (or fall when it did)."*
      *   **Why First:** Makes the inside view concrete and personal. Creates contrast fodder. Everyone can play.
      *   **Whiteboard:** Two columns: "Inside View (Rome)" | "Factors: Military, Roads, Corruption, etc."
      *   **Defuse Later Trap:** *"We're using 'empire' loosely here: a large, multi-ethnic state exerting control beyond its core. We'll refine later."*

  2.  **Base Rates as Priors (The Outside View Slogan Made Real) (10 min):**
      *   **Do:** Reveal a distribution (e.g., from Turchin's "Secular Cycles" or Taagepera's data): *"Studies of ~60 major empires show median lifespan ~220 years, but look at this SPREAD – 80 to 600+ years!"* Sketch the distribution.
      *   **Contrast:** *"Your Rome factors are your Inside View. This distribution is the Outside View – it's what generally happens, ignoring specifics."*
      *   **Frame as Prior:** *"This distribution isn't the answer. It's your STARTING POINT – your prior belief BEFORE considering Rome's unique details. Your inside view will update this prior."*
      *   **Key Point:** *"The outside view anchors you against overconfidence in your story about Rome."*
      *   **Whiteboard:** Draw the lifespan distribution. Label "Base Rate = Prior". Arrow from Prior to empty space: "To be Updated by Inside View".

  3.  **The Mechanics: Reference Classes (15 min):**
      *   **Do:** *"Where did that distribution come from? A REFERENCE CLASS: A group of similar past cases."* List examples (Han, Mali, Ottoman, Inca, Achaemenid...).
      *   **The Core Discipline:** *"The art is defining the RIGHT class. Too broad (all large states?) – meaningless average. Too narrow (only agrarian empires with legions?) – no data."* Illustrate by adding/removing empires from the list.
      *   **Why Last?** It's the trickiest part. Requires understanding *why* we need priors (step 2) and *what* the inside view is updating (step 1). Builds on the foundation.
      *   **Whiteboard:** Box labeled "Reference Class" with 8-10 empire names. Arrows to/from "Prior Distribution". Annotate "Similarity? Scale? Structure?".

  4.  **Misconception Takedown & Class Construction Lab (15 min):**
      *   **Do:** Use empire class construction to actively defuse misconceptions. Pose questions:
          *   *"What if Rome's institutions were truly unique? (Base Rate Neglect)"* → **Defuser:** *"The base rate *includes* empires with amazing institutions that still fell. Uniqueness is the norm, not the exception."* (Point to distribution spread).
          *   *"But shouldn't we look ONLY at Mediterranean Iron Age empires? (Reference Class Tennis)"* → **Defuser:** *"Narrowing loses information and increases noise. Does 'Mediterranean' tell us more than 'large agrarian'? Test it!"* (Show how median changes minimally with arbitrary narrowing).
          *   *"Aren't we missing all the forgotten, short-lived empires? (Survivorship Bias)"* → **Defuser:** *"Absolutely! Our class is biased towards the memorable. This pushes our prior UPWARDS. Good catch – this is why class definition is critical."* (Mark prior with "Likely Biased High").
          *   *"So Rome *must* last ~220 years? (Outside View as Verdict)"* → **Defuser:** *"NO! The prior is just step one. Now UPDATE: Do Rome's specifics (your inside view) suggest it's more like the 500-year empires or the 100-year ones?"* (Sketch posterior distribution shifting left/right).
          *   *"But Rome lasted 500 years in the West, so current empires are safer? (Lindy Confusion)"* → **Defuser:** *"The Lindy Effect applies to ideas, not mortal institutions. Empires that have lasted long are *in* the distribution's right tail. Their future expectancy isn't longer; they've simply already survived."* (Point to old empires on the distribution: "They are HERE now").
      *   **Missing Misconception (for this audience):** **"The Base Rate is Destiny"** – The belief that updating is impossible or negligible. **Defuser:** *"Strong inside-view evidence CAN dominate a weak prior. A unique, world-changing technology *might* invalidate historical parallels. But prove it!"* (Show Bayes' rule conceptually: Prior + Likelihood → Posterior).
      *   **Defusing Definition Debates:** *"We won't solve 'What is an empire?' today. Our working definition is 'polities controlling multiple distinct peoples/regions through centralized power, remembered as major historical players'. Disagree? Propose adding/removing ONE case and see how the median changes. Does it drastically alter the lesson?"* (Usually, it doesn't).

  5.  **Application & Assessment Question (5 min):**
      *   **Do:** Pose: *"Estimate the probability that TikTok remains one of the top 3 most popular social media platforms by US monthly active users 5 years from now. Use the outside view first."*
      *   **Why This Question?**
          *   **New Domain:** Not empires, tests transfer.
          *   **Requires Class Construction:** "Top social media platforms" (MySpace, FB, Instagram, Snapchat, Vine...). Outcomes clear (fell from top 3?).
          *   **Distribution:** Lifespan in top 3 is quantifiable.
          *   **Emotional Distance:** Less charged than politics/economics for this group.
          *   **Answer Shows Understanding:** A good answer will:
              1.  Identify a reference class (e.g., "Platforms that reached #1 or #2 in US MAU").
              2.  Note the base rate (e.g., "Median time in top 3 since 2005 is ~7 years, but high variance. Many gone in <5").
              3.  Acknowledge class ambiguity (e.g., "Is 'social media' defined the same? Does mobile vs desktop matter?").
              4.  State this is a PRIOR needing updating (e.g., "Now consider TikTok's specifics: China link, algorithm, competition...").
      *   **Wrong-but-Confident Answers:**
          *   *"TikTok is unique, you can't compare!"* (Ignores outside view entirely - Base Rate Neglect).
          *   *"Vine died fast, so TikTok will too!"* (Cherry-picks one narrow analogy - Reference Class Tennis / Inside View as Verdict).
          *   *"Facebook is still top, so new ones last forever!"* (Survivorship Bias / Lindy Confusion).
          *   *"The average is 7 years, so ~50% chance."* (Treats prior as verdict, ignores updating, and likely misapplies "average" to a skewed distribution).

  **Key Whiteboard Flow Throughout:**
  1.  Inside View Column (Specifics of Rome).
  2.  Prior Distribution Sketch (Lifespan of Empires).
  3.  Reference Class Box (List of Empires).
  4.  Arrows: Class -> Prior. Prior -> "Update?".
  5.  Misconceptions tackled by annotating/modifying 2, 3, & 4.
  6.  Final Question: New Class? New Prior?

  This sequence builds the concept logically, uses empires effectively, preempts major misconceptions contextually, fences off definitional quagmires, and provides a clean assessment tool. Good luck with the meetup!
