answer: |-
  ## Research Proposal: Dissociating Precision-Weighting in Predictive Processing: A Philosophical Investigation of Sensory-Policy Distinctions and the Unity of Adaptive Behaviour

  **1. Research Question and Context:**
  This proposal asks: *Does the dissociation between hyper-acute interoceptive awareness and impaired action initiation observed in conditions like somatic symptom disorder (SSD) and depersonalisation necessitate a conceptual and formal distinction between sensory precision (weighting interoceptive prediction errors) and policy precision (weighting prior beliefs over action sequences) within the free energy principle (FEP), and if so, does accommodating this distinction challenge the FEP's claim that all adaptive behaviour is unified under a single free-energy minimisation scheme?*

  **Why Existing Debates Leave This Open:**
  Current FEP literature treats precision-weighting as a monolithic variational parameter (𝛽) modulating prediction error influence, irrespective of whether it concerns sensory input or policy selection. While significant debates exist, they fail to address this specific dissociation:
  *   **Expected Free Energy (EFE) & Active Inference:** The EFE framework elegantly subsumes action selection under free energy minimisation by incorporating pragmatic (extrinsic) and epistemic (intrinsic) value. Debates focus on balancing these values (e.g., exploration vs exploitation) and the nature of 'value' itself. However, they presuppose a *single* precision-weighting mechanism regulating the influence of prediction errors generated by *both* sensory states and policy evaluations. The potential for a *functional dissociation* within the precision mechanism itself remains unexplored.
  *   **The Dark-Room Problem:** This highlights the necessity of epistemic foraging, showing that agents must seek information (novelty) to maintain accurate generative models. Solutions involve complex priors or sophisticated EFE formulations. Crucially, the problem concerns the *content* of prior beliefs or the *balance* within EFE, not the *mechanism* (precision) controlling how prediction errors from *different sources* (sensory vs policy) influence belief updating. The dark-room debate assumes precision operates uniformly across prediction error types, leaving the question of dissociable precision mechanisms untouched.

  The clinical dissociation in SSD/depersonalisation (hyper-precise interoception coupled with hypo-precise policy selection) presents a specific challenge: the standard FEP model, employing a single 𝛽, struggles to account for this *asymmetric failure* in weighting different *types* of prediction error essential for adaptive behaviour. Existing debates offer solutions to *what* the agent should value or learn, not *how* the weighting mechanism itself might fractionate.

  **2. Approach: Conceptual and Formal Work (Four-Month Plan)**
  This investigation employs a philosophical methodology blending conceptual analysis with formal modelling, chosen for its suitability to the foundational questions at hand:
  *   **Why Philosophy over Empirical/Computational?**
      *   **Conceptual Clarity:** The core question is conceptual: is the distinction between sensory and policy precision merely notational/convenient, or does it reflect a necessary functional division within the architecture of adaptive inference? Philosophy excels at dissecting such foundational concepts and their logical implications.
      *   **Formal Foundations:** While computational modelling is vital, its *interpretation* hinges on conceptual understanding. Developing the *formal implications* of distinguishing precision parameters requires prior conceptual groundwork to define the parameters meaningfully. Philosophy guides *what* needs to be modelled and *why*.
      *   **Scope of Inquiry:** The question targets the *explanatory scope* and *architectural coherence* of the FEP itself – a meta-theoretical issue concerning the theory's structure and claims (like the unity of adaptive behaviour). This is intrinsically philosophical.
      *   **Bracketing Clinical Complexity:** While inspired by clinical phenomena, the proposal investigates the *theoretical necessity* of the distinction within the FEP framework. A purely empirical clinical study would be overwhelmed by confounds (comorbidity, individual differences) and couldn't isolate the theoretical constructs. Pure computational modelling risks building in assumptions without sufficient conceptual justification. Philosophy provides the critical lens to link formal structure to theoretical claims.

  **Stage-by-Stage Plan:**

  *   **Month 1: Conceptual Groundwork & Dissociation Analysis:**
      *   **Task 1a:** Precisely define 'sensory precision' (focus: acuity/weighting of *interoceptive* prediction errors signalling bodily states) and 'policy precision' (focus: weighting of prediction errors generated by evaluating the expected free energy of *action sequences* or priors over policies).
      *   **Task 1b:** Analyse the dissociation evidence (SSD, depersonalisation) to articulate the challenge: How does the co-occurrence of heightened sensory precision and diminished policy precision strain the single-precision-parameter model? Identify key phenomenological and behavioural features demanding explanation.
      *   **Outcome:** A refined conceptual framework defining the proposed distinction and a clear statement of the explanatory gap in the standard FEP account.

  *   **Month 2: Formal Development & Model Specification:**
      *   **Task 2a:** Formalise the distinction within a simplified active inference scheme. Define distinct precision parameters: 𝛽ₛ (sensory precision, modulating interoceptive PEs) and 𝛽ₚ (policy precision, modulating the influence of PEs related to policy evaluation/selection, e.g., weighting the divergence between predicted and preferred outcomes under a policy).
      *   **Task 2b:** Specify the mathematical relationship between 𝛽ₛ, 𝛽ₚ, and the overall expected free energy (G) minimised during action selection. Explore how they interact within belief updating equations.
      *   **Outcome:** A formalised generative model architecture incorporating distinct sensory and policy precision parameters, detailing their roles in perception (interoception) and action.

  *   **Month 3: Simulating Dissociation & Testing Coherence:**
      *   **Task 3a:** Conceptual simulation: Map the proposed dissociated states onto the formal model. How does high 𝛽ₛ / low 𝛽ₚ manifest computationally? Does it generate dynamics analogous to SSD/depersonalisation (e.g., intense focus on bodily noise, inability to initiate uncertainty-reducing actions)?
      *   **Task 3b:** Test theoretical coherence: Does the dual-precision model maintain core FEP principles? Can it still account for normative adaptive behaviour (e.g., epistemic foraging) when parameters are appropriately balanced? Does it introduce problematic complexity or redundancy?
      *   **Outcome:** An assessment of whether the distinct-parameter architecture can formally accommodate the target dissociation while preserving the explanatory power of the FEP for normative behaviour.

  *   **Month 4: Philosophical Interpretation & Implications for Unity:**
      *   **Task 4a:** Evaluate the results: If the distinct-parameter model successfully accommodates the dissociation, is this distinction substantive (reflecting a necessary architectural feature) or merely a notational convenience? What criteria determine this?
      *   **Task 4b:** Assess the impact on the FEP's unity claim: Does accommodating the dissociation require auxiliary hypotheses that undermine the claim that *all* adaptive behaviour is unified under *one* free-energy minimisation scheme? Or does the revised model still present a unified, albeit structurally richer, account?
      *   **Task 4c:** Synthesise findings into a workshop presentation and draft paper, clearly articulating the philosophical implications for the FEP's conceptual structure and explanatory ambitions.
      *   **Outcome:** A definitive answer to the research question and a critical evaluation of its consequences for the FEP's foundational claims.

  **3. Defining Success and Failure:**
  *   **Successful Result:** A compelling demonstration that the proposed sensory-policy precision distinction is *substantive* would involve:
      1.  A conceptually coherent and formally rigorous definition of 𝛽ₛ and 𝛽ₚ within active inference.
      2.  Showing that the distinct-parameter model *naturally predicts* the core dissociation (high sensory precision + low policy precision) *without requiring additional, ad-hoc mechanisms* beyond the core FEP framework applied with the modified architecture. For example, the model should show how imbalances in these parameters intrinsically lead to the observed phenomenological profile.
      3.  Arguing that this distinction resolves a genuine explanatory gap in the standard model regarding asymmetric weighting failures.
  *   **Failure:** The project fails if it demonstrates:
      1.  **Collapse:** That the proposed distinction between 𝛽ₛ and 𝛽ₚ is merely notational or practically insignificant – that it can always be mathematically reduced to, or expressed solely in terms of, variations in a single underlying precision parameter (𝛽) acting on different prediction error streams, without altering the fundamental architecture or explanatory scope.
      2.  **Incoherence:** That introducing distinct parameters creates fundamental mathematical inconsistencies within the FEP framework or renders it unable to account for normative adaptive behaviour without extensive auxiliary assumptions.
      3.  **Explanatory Irrelevance:** That the standard model, perhaps with adjustments to prior beliefs or the complexity of the EFE formulation, can adequately explain the dissociation without needing separate precision mechanisms, showing the proposed distinction to be unnecessary.

  **4. Honest Scope Assessment:**
  To maintain feasibility within four months, the following aspects of the broader predictive processing literature must be bracketed:
  *   **Detailed Neuroanatomical Implementation:** While inspired by clinical conditions, the focus is on the *computational-level* distinction within the FEP formalism, not mapping 𝛽ₛ/𝛽ₚ onto specific neural substrates (e.g., specific neuromodulators or cortical hierarchies).
  *   **Comprehensive Clinical Modelling:** The project uses SSD/depersonalisation as illustrative *motivating phenomena* to define the dissociation challenge. It will not develop detailed, clinically validated computational models of these specific disorders, nor explore the full spectrum of their symptomatology or aetiology.
  *   **Full Agent-Environment Simulations:** While conceptual simulations will be employed, the project will not involve building and running complex, ecologically realistic agent-based simulations. Formal mathematical analysis and conceptual mapping suffice for the theoretical question.
  *   **Other Precision Roles:** Precision-weighting plays roles beyond the sensory-policy axis discussed here (e.g., in attention, learning rates). These other functions will be acknowledged but not explored in depth, as the focus is solely on the specific sensory (interoceptive) vs policy distinction.
  *   **Alternative PP Formulations:** The investigation will work primarily within the standard Friston-style FEP/Active Inference framework. Other flavours of predictive processing (e.g., emphasising Bayesian perception more than action) will not be the primary focus, though relevant insights might be incorporated.

  **Summary:** This proposal investigates whether the dissociation between sensory and policy precision in conditions like somatic symptom disorder necessitates a substantive distinction within the free-energy principle, potentially challenging its claim that all adaptive behaviour is unified under a single minimisation scheme.
