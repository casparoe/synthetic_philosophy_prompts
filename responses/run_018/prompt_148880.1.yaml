  - **Justification owed to each individual**: This is key. In consensus, justification is global ("proposal X passed"). For Scanlon, you must justify to *each person* why their burden isn’t unreasonable. No distributed system primitive captures this—it’s about addressing moral patients individually.

  The residue report is crucial. The gaps—non-fungible burdens, first-personal justification—suggest contractualism isn’t just consensus. It needs primitives that don’t exist in distributed systems. Maybe the user’s framework is missing something, or maybe morality *is* irreducible. 

