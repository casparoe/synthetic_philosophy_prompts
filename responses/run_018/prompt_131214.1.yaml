  ### Taxonomy of Positions on the Demandingness Objection to Act-Consequentialism

  **Root Question:**  
  *Can morality ever require you to make a genuinely burdensome sacrifice? (Example: You can save ten lives by donating 90% of your wealth, leaving you impoverished. Must you do it?)*  
  - **No**: Morality never requires significant burdens beyond ordinary expectations (e.g., modest charity or kindness).  
  - **Yes**: Morality can demand substantial sacrifices. → **Proceed to Question 2**.

  ---

  **Question 2:**  
  *What makes the demand problematic? (Example: After donating 90% of your wealth, you face further moral pressure to donate more, straining your health or relationships.)*  
  - **Option A**: The sacrifice is too extreme in personal cost (e.g., losing basic security or well-being). → **Proceed to Remedies for A**.  
  - **Option B**: There is no natural stopping point (e.g., after donating wealth, you must keep giving time/organs until marginal utility drops). → **Proceed to Remedies for B**.  
  - **Option C**: It crowds out personal relationships/projects (e.g., you cannot care for family or pursue a career due to endless demands). → **Proceed to Remedies for C**.  

  ---

  #### Remedies for A (Cost-Based Demandingness)  
  **Question 3A:**  
  *How should morality address excessive personal cost? (Example: Demands that risk your health or livelihood.)*  
  - **Remedy 1**: Replace binary duties (right/wrong) with scalar rankings (better/worse) or rules capping individual sacrifices (e.g., "Give 10% income").  
    → **Leaf (Scalar Consequentialism)**: Acts are judged on a scale (better/worse), not obligation; no "wrong" for suboptimal giving.  
  - **Remedy 2**: Delegate demands to institutions (e.g., taxes fund aid; individuals need not donate organs).  
    → **Leaf (Institutional Division)**: Collective systems (e.g., governments) bear burdens; individuals fulfill lighter duties.  
  - **Remedy 3**: Accept high demands and redefine moral agency (e.g., saints/heroes as ideals).  
    → **Leaf (Cost-Revisionist)**: Morality *is* extremely costly; ordinary agents often fail, but this reveals their limits.  
  - **Remedy 4**: Permit prioritizing self-interest (e.g., refusing ruinous sacrifices).  
    → **Leaf (Cost-Prerogative)**: Agents may weight personal costs more heavily than impartial good.  

  ---

  #### Remedies for B (Structure-Based Demandingness)  
  **Question 3B:**  
  *How should morality address endless optimization? (Example: After donating wealth, you must volunteer full-time, then donate organs, etc.)*  
  - **Remedy 1**: Replace binary duties with scalar rankings or rules (e.g., "Help 10 hours/week").  
    → **Leaf (Structural Scalar/Rule)**: No "wrong" for not maximizing; rules create "enough" thresholds.  
  - **Remedy 2**: Delegate to institutions (e.g., professional aid workers handle crises; others donate modestly).  
    → **Leaf (Structural Division)**: Institutions specialize in optimization; individuals contribute sustainably.  
  - **Remedy 3**: Accept demands and revise agency (e.g., moral life requires lifelong asceticism).  
    → **Leaf (Structure-Revisionist)**: Endless demands are correct; humans must aspire to continual sacrifice.  
  - **Remedy 4**: Permit stopping optimization (e.g., resting after "enough" giving).  
    → **Leaf (Unoccupied: Prerogative for Structure)**: *Rarely defended. Not incoherent, but unattractive: prerogatives don’t solve the structural "no stopping point" problem; they add arbitrariness.*  

  ---

  #### Remedies for C (Prerogative-Based Demandingness)  
  **Question 3C:**  
  *How should morality address crowded-out relationships/projects? (Example: Saving strangers leaves no time for family or art.)*  
  - **Remedy 1**: Replace binary duties with scalar rankings or rules (e.g., "Help others but reserve weekends for family").  
    → **Leaf (Prerogative Scalar/Rule)**: Rules carve space for personal life; no "wrong" for partial self-bias.  
  - **Remedy 2**: Delegate to institutions (e.g., collective aid frees individuals for local relationships).  
    → **Leaf (Prerogative Division)**: Institutions handle impartial demands; individuals focus on personal spheres.  
  - **Remedy 3**: Accept demands and revise agency (e.g., true morality requires neglecting personal ties).  
    → **Leaf (Prerogative-Revisionist)**: Close relationships/projects are morally secondary; impartiality overrides them.  
  - **Remedy 4**: Permit favoring personal commitments (e.g., prioritizing family over strangers).  
    → **Leaf (Standard Agent-Centered Prerogative)**: Agents may permissibly weight personal relationships/projects more than impartial good.  

  ---

  #### Special Leaves from Remedy 3 Branches  
  *(Applicable to A3, B3, or C3)*  
  - **Leaf (Cognitive Calibration View)**: High demands reveal human moral cognition evolved for small-group cooperation; global impartiality is "mismatched" and requires psychological revision.  

  ---

  ### Summary of Key Leaves
  1. **Scalar Consequentialism**: Remedies A1/B1/C1.  
  2. **Institutional Division**: Remedies A2/B2/C2.  
  3. **Standard Agent-Centered Prerogative**: Remedy C4.  
  4. **Cognitive Calibration View**: Subtype of Remedy 3 (e.g., A3, B3, or C3).  
  5. **Unoccupied Combination**: Structure + Prerogative (B4).  

  ### Notes
  - **Unoccupied Combination (B4)**: Permitting arbitrary stopping points (prerogative) without resolving the structural endlessness is *unattractive*; it ignores the core problem of indefinite obligation.  
  - **Cognitive Calibration**: Explains demandingness as an evolutionary mismatch, urging moral psychology reform (e.g., training impartiality).  
  - **Non-Philosophical Labels**: Nodes use cases (e.g., "donating kidneys") and questions answerable without jargon.
