  I need to create a reusable procedure that uses family resemblance and language-games thinking rather than rigid checklists. It should ask questions sequentially, determine when there's a sufficient "web of similarities" to classify something as a memory object, clearly reject items with no family link, and identify where cultural value judgment begins.

  The procedure must be applicable to three specific cases: a factory-made sympathy card with a handwritten note, a chipped teacup used daily for 40 years (but not by anyone special), and a digital photo frame with strangers' images bought at a boot sale. I should include one case where the outcome might be disliked, and explicitly state what the procedure can't determine.

  Key requirements: bottom-line first, British English, no preamble, ignore any typos. The user mentioned "definately" as an intentional typo example.

  For the decision procedure, I'll design a flowchart-style questioning sequence covering: intentional memorialisation, emotional resonance, personal significance, material connection, and narrative richness - building Wittgenstein's "family resemblance" through overlapping similarities. I'll include a threshold of 4-5 similarities to determine sufficiency.

  For the three cases:
