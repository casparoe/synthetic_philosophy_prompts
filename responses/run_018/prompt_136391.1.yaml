answer: |-
  Bottom line: Wittgenstein's family resemblance concept *is* practicable for classifying ambiguous "memory objects," yielding clear decisions and highlighting where cultural value judgement begins, as demonstrated by this procedure and the three test cases.

  **Family Resemblance Procedure for Memory Objects:**

  1.  **Intentional Memorialisation:** Was the object deliberately created, modified, or selected *specifically* to hold or trigger memory of a person/event/period? (Yes/No/Unclear)
      *   *If No or Unclear, proceed to Q2.*
      *   *If Yes, proceed to Q3.*

  2.  **Emotional Resonance (Claimed):** Does the donor assert a specific, personal emotional connection (grief, nostalgia, love, regret) linking *this specific object* to a specific person/event/period? (Ignore general statements like "it's sentimental"). (Yes/No)
      *   *If No, **STOP: NOT a Memory Object (Lacks Core Family Link).***
      *   *If Yes, proceed to Q3.*

  3.  **Personal Significance:** Does the object possess a unique history or meaning *specifically for the donor or their immediate circle*, beyond its generic form? (e.g., *this* pebble, *this* chipped cup, not just 'a' pebble or 'a' cup). (Yes/No/Unclear)
      *   *If No, **STOP: NOT a Memory Object (Lacks Personal Anchor).***
      *   *If Yes or Unclear, proceed to Q4.*

  4.  **Material Connection:** Is there a direct physical link between the object and the remembered person/event/period? (e.g., touched/worn/used by them, from the location, materially altered for remembrance). (Yes/No)
      *   *If Yes, proceed to Q5.*
      *   *If No, proceed to Q5 (Lack of material link doesn't preclude status, but weakens resemblance).*

  5.  **Narrative Richness:** Can the donor provide a specific, detailed story or context about *why* this object holds memory, *how* it was used/acquired in relation to the memory, or *what* it specifically evokes? (Beyond simple identification). (Yes/No)
      *   *If Yes, proceed to Q6.*
      *   *If No, proceed to Q6 (Lack of narrative weakens resemblance but doesn't destroy core link).*

  6.  **Sufficiency Check (Web of Similarities):** Assess the "Yes" answers from Q1-5.
      *   **Strong Resemblance (Accept):** 4 or 5 "Yes" answers (including at least one from Q1 or Q2 *and* Q3).
      *   **Adequate Resemblance (Accept):** 3 "Yes" answers *must* include Q3 (Personal Significance) *and* either Q1 (Intentional Memorialisation) or Q2 (Emotional Resonance).
      *   **Weak Resemblance (Reject):** Fewer than 3 "Yes" answers, OR 3 "Yes" answers *without* Q3 (Personal Significance), OR 3 "Yes" answers *without* *both* Q1/Q2 *and* Q3.
      *   **Judgement Threshold:** If the object meets Adequate or Strong Resemblance, it is conceptually classified as a "Memory Object". **Proceed to Value Assessment.**
      *   **STOP: NOT a Memory Object:** If it fails the Sufficiency Check.

  **Value Assessment Flag:** Once conceptually classified as a Memory Object (via the sufficiency check above), the question **"Does this specific memory object possess sufficient cultural, historical, or communal significance to warrant inclusion in the *public* collection?"** is **pure cultural value judgement**. The procedure cannot settle this; it requires curatorial expertise, institutional remit, and community relevance considerations.

  ---

  **Test Cases:**

  1.  **Factory-made Sympathy Card with Handwritten Note Inside:**
      *   Q1 (Intentional Memorialisation): **Yes.** Created/sent specifically for remembrance/condolences.
      *   Q2 (Emotional Resonance): *Skip (Q1 Yes).*
      *   Q3 (Personal Significance): **Yes.** The handwritten note personalises the generic card, linking it specifically to the donor/recipient/deceased.
      *   Q4 (Material Connection): **Unclear/Probably No.** The card itself is mass-produced. The handwriting is a trace, but the physical card likely wasn't touched by the deceased. (*Leans No*).
      *   Q5 (Narrative Richness): **Likely Yes.** The note often provides context or personal sentiment, enabling a story.
      *   **Sufficiency Check:** Strong Resemblance (Q1 Yes, Q3 Yes, Q5 Yes = 3 solid Yeses). **CONCEPTUALLY A MEMORY OBJECT.** *Proceed to Value Assessment:* Does this *particular* card/note have wider significance? (Judgement).

  2.  **Chipped Teacup (Used daily for 40 years, belonged to "no one special"):**
      *   Q1 (Intentional Memorialisation): **No.** Not created/modified *for* memory; it's a utilitarian object.
      *   Q2 (Emotional Resonance): **Yes.** Donor asserts a specific emotional connection (nostalgia, routine, personal history) linked to *this specific cup* and its decades of use.
      *   Q3 (Personal Significance): **Yes.** Its significance stems entirely from its unique history *for the donor* ("*this* cup used *by me* for 40 years").
      *   Q4 (Material Connection): **Yes.** Direct physical link – used by the donor for the remembered period.
      *   Q5 (Narrative Richness): **Yes.** Easily supported by describing the daily ritual, the wear/chipping, the period it represents.
      *   **Sufficiency Check:** Strong Resemblance (Q2 Yes, Q3 Yes, Q4 Yes, Q5 Yes = 4 Yeses). **CONCEPTUALLY A MEMORY OBJECT.** *Proceed to Value Assessment.* **This is the disliked outcome.** Archivists might reject it due to lack of notable provenance ("no one special") or perceived mundane nature, but it *conceptually* fits the 'memory object' family perfectly via resemblance (Emotion, Personal Sig, Material, Narrative). The procedure highlights that rejection here is purely a *value judgement* about public worth, not conceptual classification.

  3.  **Digital Photo Frame with Images of Strangers (Bought at boot sale):**
      *   Q1 (Intentional Memorialisation): **No.** The *original* photos were intentional, but the frame + *this specific collection* was not created/modified *by the donor* for memorialisation. The donor bought it randomly.
      *   Q2 (Emotional Resonance): **No.** Donor has no personal emotional connection to the strangers pictured. Any feeling is likely curiosity or aesthetic, not memory-linked.
      *   Q3 (Personal Significance): **No.** The images have no unique history or meaning *for the donor or their circle*. They are anonymous.
      *   Q4 (Material Connection): **No.** No link between the physical frame/images and any person/event meaningful to the donor.
      *   Q5 (Narrative Richness): **No.** Donor cannot provide a story linking *these specific images* to a personal memory.
      *   **Sufficiency Check:** 0-1 Yes answers (Q1 No, Q2 No, Q3 No, Q4 No, Q5 No). **STOP: NOT a Memory Object (Lacks Core Family Link).** It fails at Q2/Q3. It might be an interesting historical/vernacular photography object, but it isn't a *memory object* for *this donor* or conceptually via resemblance. Value judgement is irrelevant to the classification.

  **What the Procedure Cannot Settle:**
  1.  **Authenticity of Emotional Claims (Q2):** It relies on the donor's assertion. The procedure flags the need for this assertion but cannot verify its truth.
  2.  **Cultural/Historical Value for the Public Collection:** This is explicitly flagged as judgement beyond the conceptual classification.
  3.  **Borderline "Unclear" Cases:** Where answers are ambiguous (e.g., weak "Personal Significance" in Q3), the procedure relies on the team's interpretation within the language-game of the archive's practice – it highlights the need for discussion at those points but doesn't automate the decision.
  4.  **The "Meaning" of Memory:** It identifies objects fitting the family resemblance, not the depth or 'validity' of the memory itself.
