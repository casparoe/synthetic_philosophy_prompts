    "threshold_mechanism": "Adjustments are permitted only when catastrophic outcomes threaten the very existence or fundamental stability of the relational moral practice that imbues the constraint with meaning; this internal adjustment preserves the framework enabling the norm, rather than being a consequentialist override.",
    "strongest_objection_addressed": "The objection that allowing any violation based on outcomes collapses deontology into consequentialism is countered by grounding justification solely in preserving the preconditions of the moral practice itself (not aggregate welfare), maintaining the intrinsic wrongness of the violation (via normative residue), and restricting permission to existential threats to the practice.",
