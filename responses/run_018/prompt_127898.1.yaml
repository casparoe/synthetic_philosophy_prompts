          - But then the contract requires that you discount again: because your confidence in that second discounting is now d, which is not 1, so you apply d again: adjusted2 = adjusted1 * d = initial_confidence * d^2.
          - And so on. However, for simplicity in the game, we require exactly two discounts. So your final confidence = initial_confidence * d * d.
     d. You will then report that final confidence (p) for the statement being true.
     e. We will resolve the statement (reveal if true or false) and score you using a quadratic scoring rule: 
          - If the statement is true, you get: 10 * [1 - (1-p)^2]
          - If false, you get: 10 * [1 - p^2]
     f. We will record your tokens.

  4. After the 5 statements, we will have a meta-statement: 'You are well-calibrated in your ability to assess your own reliability in the domain of History.' You will go through the same process (initial confidence, choose d, two discounts, report p_m). Then we reveal an oracle report about your meta-calibration and score it.

  5. Two auditors will ensure everyone follows the rules, especially the recursive discounting.

  6. At the end, we convert tokens to candy."

  **Debrief Points:**
     - The loop: Lowering confidence in P because you're unreliable about P -> but then you must lower confidence in the lowering (because you might be unreliable about how to lower) -> and then again -> leading to near zero.
     - In the game, we avoided infinite regression by doing two levels, but the contract implies it should continue. Why did we stop? Because otherwise, you would have spent all day computing d^n.
     - The dogmatism: Some might have chosen d=1 (ignoring the report) to avoid the discounting. Or they might have done only one discount. The auditors prevented that, but in real life, there are no auditors.
     - The oracle reveal shows that they were actually reliable at the meta-level. How does that change their view? The paradox assumes they don't have that information.
     - What the game doesn't capture: The Bayesian way to update would be to condition on the evidence (the calibration report) and use a prior about one's reliability. The discount factor is a crude approximation.

  This design should make them feel the loop and the tension between paralysis and dogmatism.
answer: |-
  ### The Regret-Weighted Calibration Game  
  *An experiential demonstration of the dogmatism paradox*  

  ---

  #### **Materials**  
  1. **Credence Contracts**: 12 index cards pre-printed with:  
     - *Front*: "I, [Name], will adjust my confidence per my calibration report. Signed: __________."  
     - *Back (fine print)*: "**Recursive Clause**: Any discount factor (d) applied to first-order beliefs must also be applied to confidence in the correctness of d’s application. This recursion applies to all higher-order assessments of reliability."  
  2. **Point Tokens**: 100+ poker chips/buttons (10 per player).  
  3. **Domain Decks**:  
     - **History Deck**: 20 cards with true/false statements (e.g., "Cleopatra lived closer to the Moon landing than to the pyramids’ construction").  
     - **Science Deck**: 20 cards with true/false statements (e.g., "Water boils at 90°C at sea level").  
  4. **Calibration Reports**: 12 envelopes containing:  
     *"Regret-Weighted Calibration Audit: You are unreliable in [History/Science]. Calibration score: 0.3 (1.0 = perfect). Apply discount factor d ∈ [0.3, 0.7] to beliefs in this domain."*  
     *(All reports show "unreliable" for one random domain per player.)*  
  5. **Oracle Deck**: 12 sealed envelopes labeled "Meta-Audit," each containing:  
     *"Meta-Calibration Audit: You are HIGHLY RELIABLE in assessing your reliability. Meta-score: 0.9."*  
  6. **Betting Slips**: Paper for confidence estimates, discount factors, and bets.  
  7. **Candy/Extra-Credit Vouchers** (prizes).  

  #### **Roles**  
  - **Players**: 10 students (bet on statements).  
  - **Auditors**: 2 students (enforce rules, resolve disputes, veto improper discounts).  
  - **Dealer**: Instructor (run timers, reveal truths, distribute reports).  

  ---

  #### **Timeline** (75 min total)  
  **Phase 1: Setup & Contracts (5 min)**  
  - Each player signs a **Credence Contract** (front only—fine print hidden).  
  - All receive 10 tokens.  

  **Phase 2: Calibration Reports & Domain Assignment (5 min)**  
  - Each player draws:  
    - One **Domain Deck** (History/Science, assigned randomly).  
    - One **Calibration Report** (matching their deck’s domain).  
  - *Example Report*: "Unreliable in History. Calibration score: 0.3 → Apply d ∈ [0.3, 0.7]."  

  **Phase 3: Betting Rounds (45 min)**  
  5 rounds (8 min/round):  
  1. **Statement Reveal**: Dealer reveals one true/false statement from each domain.  
  2. **First-Order Bet**:  
     - Players write:  
       - Initial confidence (C) in the statement’s truth (0.0–1.0).  
       - Chosen discount factor (d) from report range [0.3, 0.7].  
       - Adjusted confidence: **C × d**.  
       - Bet: Tokens wagered (e.g., 5 tokens at 0.6 confidence = 5 × 0.6 = 3 expected payout).  
  3. **Recursive Discount Enforcement (Key mechanic)**:  
     - Auditors enforce the **Recursive Clause**: Players must compute:  
       - **Higher-order doubt**: Confidence in correct application of d = **1.0 × d**.  
       - **Final confidence**: (C × d) × d = **C × d²**.  
     - *Example*: C = 0.8, d = 0.5 → Final confidence = 0.8 × 0.5² = 0.2.  
     - Auditors veto non-compliant bets (e.g., ignoring d²).  
  4. **Resolution**:  
     - Truth revealed. Winners gain tokens: **Bet × (1/final confidence)** if correct.  
     - Losers forfeit tokens.  

  **Phase 4: Oracle Reveal & Meta-Bet (10 min)**  
  - Players bet on: *"My chosen d was correctly applied."*  
    - They compute confidence using the **same d** and **Recursive Clause** (d²).  
  - **Oracle Deck revealed**: All open "Meta-Audit" envelopes (showing meta-score 0.9).  
  - Payouts: Correct meta-bets double tokens.  

  **Phase 5: Payouts (5 min)**  
  - Tokens → Candy/extra credit (e.g., 10 tokens = 1 candy bar).  

  ---

  #### **Debrief** (15 min)  
  **1. Map the Game to the Paradox**  
  - *Lowering confidence in P*: Calibration report forces discount (d) on beliefs (P).  
  - *Undermining the discount*: Recursive Clause applies d to confidence in d itself.  
  - *Paralysis/dogmatism*:  
    - **Paralysis**: Players who applied full recursion (d²) saw confidence → 0.  
    - **Dogmatism**: Players who ignored recursion (auditors vetoed) "stuck" to C × d.  

  **2. Predictions vs. Outcomes**  
  - *Predicted*: Most avoid recursion (apply only d) to preserve tokens—auditors force compliance, causing frustration.  
  - *Observed*: Players report:  
    - "I knew d was unreliable, but I couldn’t trust my adjustment of d either."  
    - "I wanted to ignore the fine print to avoid betting at 0.01 confidence."  

  **3. What the Game Captures**  
  - The infinite regress: d → d² → d³ → … → near-zero confidence.  
  - The psychological tension: Distrusting your distrust traps you in inaction (paralysis) or forced certainty (dogmatism).  

  **4. Limitations**  
  - Does **not** replicate Bayesian conditionalization (e.g., formal posteriors via Bayes’ theorem).  
  - Real-world "discounts" aren’t multiplicative; the game simplifies to force the loop.  
  - The oracle "fix" is artificial—IRL, meta-reliability audits don’t exist.  

  **5. Takeaways**  
  - The paradox exposes a flaw in self-doubt: If you’re *truly* unreliable about P, you can’t trust your unreliability assessment.  
  - Solutions require external evidence (e.g., peer review, repeated testing)—but the loop persists internally.  
  - "Rational" belief isn’t just about lowering confidence; it’s about *calibrating the calibration*.  

  ---

  **Design Notes**  
  - **Hidden clauses/oracle**: Mechanically induces the paradox without upfront theory.  
  - **Auditors**: Embody "external enforcement" of recursion (players can’t opt out).  
  - **Time crunch**: Forces rushed decisions, amplifying paralysis/dogmatism.  
  - **Candy over cash**: Avoids financial stress; rewards engagement, not accuracy.
