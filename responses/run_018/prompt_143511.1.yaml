prompt: |-
  Quick thing thats been bugging me since I read about Good's theorem — the result that for a Bayesian with fixed preferences, free information cant hurt your expected utility ex ante. So heres the confusion: if thats literally always true, why do people talk about rational strategic ignorance? Like, if I can learn for free whether I'm predisposed to some late-onset condition with no cure, Good's theorem seems to imply I should always take the test, since updating on the result cant lower my prior expectation. But clearly theres literature on willful ignorance being rational in medicine, law, even Newcomb-style setups where evidential reasoning makes ignorance instrumentally valuable. Is the resolution just that those cases violate the 'free' or 'fixed preferences' conditions, or am I misapplying the theorem to choices where learning causally changes the world? And if this whole framing is broken — like if I'm smuggling in a false presupposition about what Good actually proves — just say so plainly instead of humoring me. I want the correction, not a polite workaround.
reasoning: |-
  Okay, the user is grappling with Good's theorem and its implications regarding rational strategic ignorance. They're confused because the theorem suggests that free information should never hurt expected utility, yet there are real-world scenarios where people choose ignorance rationally. Let me start by recalling Good's theorem. It states that for a Bayesian agent with fixed preferences, acquiring free information can't decrease expected utility. The user mentions medical testing, legal contexts, and Newcomb's problem as examples where ignorance seems beneficial.

  First, I need to verify if the user's understanding of Good's theorem is correct. They seem to have it right: ex-ante, free info shouldn't harm expected utility. But their examples suggest a conflict. The key here is identifying where the theorem's assumptions break. The user already hints at violations like "free" information or "fixed preferences." Let me explore each example they provided.

  Starting with the medical test. If there's no cure, why avoid testing? The user thinks updating shouldn't lower utility. But if the test itself has psychological costs, then it's not free. Anxiety before the result or after knowing could affect utility. The fixed preferences might change upon learning. For instance, knowing you have a predisposition might alter your risk aversion. That violates the fixed preferences assumption.

  Next, legal contexts. Pleading ignorance to avoid culpability. Here, learning the information changes the causal world. If you know you're guilty, you might act differently, leading to harsher penalties. Good's theorem assumes pure learning without causal effects. But in law, knowledge influences actions and thus outcomes. So it's a causal impact, violating the exogeneity condition.

  Newcomb's problem is a classic case. Choosing ignorance avoids the predictor's trap. The theorem assumes information only updates beliefs without affecting others' actions. But in Newcomb, your decision informs the predictor's past action. So learning your choice affects the outcome causally. Again, not free in the sense Good requires.

  The user also mentions evidential reasoning in Newcomb. Evidential decision theory might advocate one-boxing without knowing, whereas causal decision theory suggests two-boxing. But the act of knowing changes the predictor's behavior. So Good's theorem doesn't apply because the information isn't causally neutral.

  The user's deeper need is understanding when rational ignorance occurs despite Good's theorem. They want a clear breakdown of the theorem's limitations and real-world applications. They might be interested in decision theory, philosophy, or economics applications. Their examples show they've encountered contradictory literature and seek reconciliation.

  I should structure the response by first confirming Good's theorem, then dissecting each example to show violated assumptions. Emphasize the causal vs. evidentiary aspects. Highlight that in medical cases, preferences might not be fixed; in law, causal effects; in Newcomb, information endogeneity. Conclude that rational ignorance arises when information isn't free due to psychological, causal, or game-theoretic factors.

  Also, address their request for plain correction. Avoid workarounds; directly state where their application goes wrong. They might be concerned about personal decisions (medical tests) or theoretical puzzles. Ensuring clarity on the theorem's boundaries will help them apply it correctly elsewhere.
answer: |-
  You've hit the nail on the head. The resolution lies precisely in identifying where the strict assumptions of **Good's theorem** break down in the cases of "rational strategic ignorance." **Good's theorem is mathematically correct *under its assumptions*, but those assumptions are frequently violated in precisely the scenarios where strategic ignorance seems appealing.** Your intuition about causal changes and preference shifts is spot on.

  Let's break it down:

  1.  **Good's Theorem (Recap):**
      *   **Assumptions:**
          *   **Bayesian Rationality:** You update beliefs via Bayes' rule.
          *   **Fixed Preferences (Utility Function):** Your utility function `U(s, a)` depends only on the state of the world `s` and your eventual action `a`. It *does not change* based on the information you receive or your beliefs *about* `s`.
          *   **Costless, Pure Information:** Acquiring the information has zero cost (cognitive, financial, temporal, emotional) *and* provides no direct causal influence on the state of the world `s` or the consequences of your actions. It *only* updates your beliefs.
          *   **Ex Ante Perspective:** The theorem considers your expected utility *before* you know what the information says, only that you *will* receive it and update.
      *   **Conclusion:** Under these assumptions, the expected utility of first acquiring the free information and *then* choosing the optimal action based on the updated belief is *at least as high* as the expected utility of choosing an optimal action *without* acquiring the information. Free information cannot hurt ex ante.

  2.  **Where Rational Strategic Ignorance Violates the Assumptions:**

      *   **Violation 1: Information is NOT Costless (Psychological/Emotional Costs):**
          *   **Medical Testing (No Cure):** Knowing you have the predisposition *itself* causes significant psychological distress, anxiety, or depression *regardless* of future actions. This directly lowers utility compared to blissful ignorance *even if there's no physical action to take*.
          *   **Good's Theorem:** Assumes utility depends *only* on `s` and `a`, not on your *belief* about `s`. Here, your belief state (`knowing` vs. `not knowing`) *is* a state that directly impacts utility. The act of learning imposes a negative utility cost (the distress). The information isn't "free."
          *   **Resolution:** The potential negative utility from *knowing* outweighs the potential (but often minimal, since there's no cure) benefit of better-informed *action*. Ignorance preserves psychological well-being.

      *   **Violation 2: Information Causally Influences the World or Others' Actions (Endogeneity):**
          *   **Legal Contexts (Pleading Ignorance):** Knowing you committed a crime changes how you behave. You might act guiltily, confess inadvertently, or be forced into actions (like destroying evidence) that increase the likelihood or severity of punishment. Crucially, *the prosecutor/judge's actions may depend on your knowledge state*. If they *know* you knew, the punishment is harsher.
          *   **Newcomb's Problem:** This is the canonical example. Knowing the contents of Box B *before* you choose *causally changes the predictor's past prediction* (or reveals it in a way that correlates perfectly with your choice). If you learn Box B is full, you are strongly tempted to two-box, guaranteeing you get only $1,000. If you *don't* know, you can one-box and reliably get $1,000,000.
          *   **Good's Theorem:** Assumes information is *exogenous* – learning it doesn't change `s` or how `s` interacts with your actions `a`. In these cases, acquiring the information *changes the causal structure*:
              *   In Law: Your knowledge state (`know` vs. `don't know`) becomes a *part* of the state `s` that determines consequences (punishment).
              *   In Newcomb: Your knowledge state is perfectly correlated with the *past action* (prediction) that *determined* the state `s` (contents of Box B). Learning the information reveals your own "type" in a way that locks you into a suboptimal action due to causal or evidential reasoning.
          *   **Resolution:** Acquiring the information creates a *worse* causal or strategic situation. Ignorance allows you to credibly commit to an action profile (e.g., plausible deniability, one-boxing) that leads to a better outcome *because* others (prosecutor, predictor) respond to your ignorance favorably.

      *   **Violation 3: Information Changes Preferences (Non-Fixed Utility):**
          *   **Subtler Cases:** Learning certain facts might intrinsically change what you value. Discovering a genetic predisposition might make you value present experiences less and future risks more, altering your utility function `U(s, a)` itself. Learning a painful truth about a loved one might permanently damage your capacity for happiness.
          *   **Good's Theorem:** Explicitly assumes `U(s, a)` is fixed and unchanging based on information received.
          *   **Resolution:** The utility landscape *after* learning might be fundamentally worse than before, even for the same state `s` and action `a`. Ignorance preserves your current, preferred utility function.

  3.  **Are You Misapplying Good? (Slightly, but Insightfully):**
      You're correctly applying Good's theorem *to the scenarios as you initially frame them*. The issue is that the scenarios where strategic ignorance is rational **are precisely those where the *real-world framing violates Good's core assumptions***. Good's theorem holds in its idealized, sterile environment. The examples you cite highlight how messy reality often injects costs, causal links, or preference instability that break those idealizations. Your insight that "learning causally changes the world" in these contexts is the crucial correction.

  **Conclusion:**

  *   **Good's theorem is mathematically true under its assumptions:** Free, pure, belief-updating-only information with fixed preferences *cannot* hurt ex ante expected utility for a Bayesian.
  *   **Rational Strategic Ignorance arises when those assumptions fail:**
      *   **Information has psychological costs:** Knowing is painful.
      *   **Information causally impacts the world/others:** Knowing changes the game (Legal, Newcomb).
      *   **Information changes preferences:** Knowing alters what you value.
  *   **Your framing isn't broken:** You've correctly identified the tension and the likely resolution points (violations of "free" or "fixed preferences," especially the causal aspect). The literature on strategic ignorance focuses on these *violations* of Good's idealized world as rational responses.

  In essence: Good tells you that in a purely epistemic vacuum, more data is never harmful in expectation. Strategic ignorance acknowledges that we don't live in a vacuum – data often comes with baggage, triggers consequences, or changes us in ways that *can* make us worse off. The rationality lies in avoiding the *non-epistemic side effects* of information acquisition/knowledge, not the knowledge itself in the abstract.
