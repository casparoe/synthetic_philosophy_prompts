answer: |-
  ### Sex Work Regulation Decision Tree: Feminist Political Philosophy & Labor Policy Lens  
  *Designed for graduate seminar use — students answer concrete claims to arrive at regulatory models without prior labeling. Each leaf reveals the model and its "awkward commitment."*  

  ---

  ### **Logical Space Brainstorm**  
  *(Pre-tree mapping of defended/empty positions & convergences)*  
  1. **Defended Combinations**:  
     - **Nordic Model**: Criminalize buyers + decriminalize sellers + no licensing + demand-reduction programs.  
     - **German/Dutch Legalization**: Decriminalize exchange + state licensing + mandatory health checks + no collective bargaining guarantees.  
     - **NZ Decriminalization**: Full decriminalization (buyers/sellers) + explicit labor rights (collective bargaining, courts) + no licensing.  
     - **"Weird Hybrid"**: Full decriminalization + barred collective bargaining + no licensing (rarely defended; exists in *partial* practice, e.g., some U.S. states post-decrim).  
     - **Convergences**: Nordic supporters & NZ critics both reject licensing; German/Dutch & NZ both oppose criminalizing buyers but diverge sharply on state oversight vs. labor autonomy.  

  2. **Empty/Unoccupied Combinations**:  
     - ❌ **Full criminalization** (buyers + sellers): Not included—seminar focuses on *alternatives* to prohibition.  
     ❌ **Decrim + licensing + labor rights**: Contradictory; licensing undermines NZ-style labor autonomy.  
     ❌ **Criminalize buyers + licensing**: Unstable—Nordic rejects licensing, German/Dutch rejects criminalizing buyers.  

  3. **Ambiguous Zones**:  
     - **State oversight ≠ labor rights**: Nordic & German models both use state tools (policing vs. licensing) but split on whether this "protects" workers or entrenches stigma.  
     - **Demand reduction**: Nordic & NZ both fund exit programs, but only Nordic uses criminalization to suppress demand.  

  ---

  ### **DECISION TREE**  
  **Start Here** → Answer each question sequentially.  

  #### **1. Should purchasing sexual services be a criminal offense?**  
     - **YES** → Go to 1A.  
     - **NO** → Go to 2.  

  **1A. Does the state impose licensing, registration, or mandatory health checks on sex workers?**  
     - **YES** → *Leaf: **Contradiction*** (No defended model criminalizes buyers *and* licenses sellers).  
     - **NO** → *Leaf: **Nordic Model***  
       *Awkward commitment*: Relies on criminalization to reduce demand despite evidence it drives markets underground without reducing exploitation.  

  #### **2. Does the state require licensing, registration, or mandatory health checks for sex work?**  
     - **YES** → *Leaf: **German/Dutch Legalization***  
       *Awkward commitment*: Creates a two-tier market where "legal" workers face state surveillance/stigma while unlicensed workers remain criminalized/vulnerable.  
     - **NO** → Go to 3.  

  #### **3. Are sex workers explicitly guaranteed labor rights (e.g., collective bargaining, access to courts, workplace safety standards)?**  
     - **YES** → *Leaf: **New Zealand-Style Decriminalization***  
       *Awkward commitment*: Depends on pre-existing robust labor-rights infrastructure; may fail where unions/courts are hostile to sex work.  
     - **NO** → *Leaf: **"Weird Hybrid" (Decrim Exchange + Barred Collective Bargaining)***  
       *Awkward commitment*: Decriminalizes individual transactions but blocks workers’ power to organize—potentially *incoherent* as it denies labor agency while recognizing market legitimacy.  

  ---

  ### **Diagnosis of Key Gaps**  
  - **The "Weird Hybrid"**: Logically placed but empirically rare. Its incoherence stems from treating sex work as *commerce* (deserving decrim) but not *labor* (denying collective rights). Feminist critics argue this mirrors gig-economy exploitation.  
  - **Unaddressed Tensions**:  
    - **Demand vs. Supply**: No model effectively separates demand reduction (Nordic goal) from worker safety (NZ goal).  
    - **Exit Programs**: All models *claim* to support "exiting" sex work, but none reconcile this with labor rights (NZ) or criminalization (Nordic).  
  - **Labor Rights Absence**: Only NZ mandates collective bargaining. The Hybrid’s explicit bar reveals a regulatory blind spot: decrim without rights entrenches precarity.  

  ---  
  **Tree Logic Summary**:  
  1. Criminalize buyers? → **Nordic** (if no licensing).  
  2. Not criminalizing buyers? → **Licensing?** → Yes: **German/Dutch**; No: **Labor rights?** → Yes: **NZ**; No: **Hybrid**.  
  **Handout-ready**: Print as-is—no citations, self-contained for classroom debate.
