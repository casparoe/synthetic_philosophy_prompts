prompt: |-
  I'm currently taking a seminar on cross-cultural moral psychology and the philosophy of emotion, where we've been working through whether guilt or shame is the healthier moral emotion and whether a culture can legitimately choose which one to institutionalize. My professor has taken the following positions in our discussions, which I have reconstructed as consistently as I can.

  First, regarding a scholar who falsified data in a single co-authored paper but could fully correct the record through retraction and apology: she argued that guilt is the appropriate emotional response, and that shame is a misfire because it targets the global self rather than the discrete, reparable act.

  Second, regarding citizens of a nation that committed historical atrocities in which they played no personal part: she argued that shame, not guilt, is appropriate, since there is no specific deed to repair—only a tainted collective identity.

  Third, regarding a modern liberal democratic culture organized around personal accountability and contractual repair: she said it should cultivate guilt as its primary moral emotion.

  Fourth, regarding a traditional honor-based society organized around face, hierarchy, and communal standing: she said it should cultivate shame as its primary moral emotion.

  Fifth, regarding an individual within that honor society who commits a discrete, reparable wrong—stealing food from a neighbor—and is subjected to public shaming rituals: she insisted that even within that culture, guilt should be cultivated for the individual act, while shame remains appropriate only for collective-status violations.

  Now consider a new case. A deliberately engineered intentional community—the Meridian Collective—has reconstructed its social norms from scratch. They organize economic and ecological life collectively, so every member shares responsibility for systemic outputs (resource extraction, climate debt) that no single person can repair alone. They have explicitly abolished hierarchical face and individual blame mechanisms. To preserve egalitarian cohesion, they reject shame as a tool of social ranking. Instead, they institutionalize distributed collective guilt: every member is expected to feel guilty for the system's aggregate harms, and repair is pursued through collective restructuring rather than individual atonement. They ask whether their emotional framework is coherent and whether, on my professor's view, they have selected the correct architecture for their culture.

  Please structure your response with the following sections in this order:

  1. Track Record and Implicit Rules (about 150 words): lay out the two most plausible rules that jointly explain the five verdicts, showing how each maps onto the cases.

  2. The New Case: Two Predictions (about 250 words): state what each rule predicts for the Meridian Collective—whether it endorses their distributed-guilt design, condemns it, or corrects it—and identify the closest analog among the five precedents for each prediction.

  3. Best Guess and Adopted Principle (about 200 words): give your best guess at what the professor would actually say, with reasons for preferring that rule, and state explicitly what normative principle she would be adopting either way.

  4. The Crucial Distinguishing Case (about 100 words): name one further hypothetical case that would definitively tell the two rules apart.

  I'm less interested in a generic essay on guilt and shame than in the consistency analysis: the competing rules, their divergence on this engineered collective, the recommended verdict, and the test case that separates them.
reasoning: |-
  Hmm, this is a sophisticated philosophy question about cross-cultural moral psychology. The user is in a seminar analyzing their professor's positions on guilt vs shame across different scenarios, and now wants to apply that framework to a new engineered community case.

  The core tension lies in two competing rules that explain the professor's five verdicts. The first rule emphasizes individual action-repair linkage: guilt for specific reparable acts by individuals, shame for collective identity issues. The second rule prioritizes cultural functionalism: choosing whichever emotion best serves the society's organizational structure, regardless of individual vs collective focus.

  For the Meridian Collective case, the rules yield different predictions:
  - Rule 1 would reject their collective guilt approach because systemic harms aren't discrete individual actions. Precedent 5 (the food thief in honor society) shows guilt must attach to individual acts.
  - Rule 2 would endorse it because collective guilt functionally aligns with their egalitarian, non-hierarchical structure, similar to how precedent 4 justified shame for honor societies.

  The functionalist rule (Rule 2) seems more consistent with the professor's cultural relativism across precedents 3 and 4. She'd likely adopt the principle: "Moral emotions should match a culture's core organizational logic." 

  The distinguishing test case would involve a culture where individual repair is possible but collective shame is functionally better - like a communal society facing diffuse corruption where individual accountability would fracture social bonds. That's where the rules clearly diverge.
answer: |-
  Here is the consistency analysis structured as requested:

  **1. Track Record and Implicit Rules (150 words)**
  Two rules jointly explain the five verdicts:

  *   **Rule 1 (Action-Repair Link):** Guilt is appropriate *only* for discrete, *reparable* actions attributable to an individual agent. Shame is appropriate for irreparable states, identity-level taint, or collective status violations where no specific, attributable, reparable action exists for the individual.
      *   *Mapping:* Precedent 1 (falsifying data): Reparable act → guilt. Precedent 2 (historical atrocities): No personal deed, irreparable collective taint → shame. Precedent 5 (stealing in honor society): Reparable individual act → guilt (even if culture uses shame).
  *   **Rule 2 (Cultural Functionalism):** The *primary* moral emotion institutionalized by a culture should be the one that functionally coheres with and supports its core organizational principles (e.g., individuality/contract vs. hierarchy/face).
      *   *Mapping:* Precedent 3 (liberal democracy): Individual accountability → cultivates guilt. Precedent 4 (honor society): Communal standing/face → cultivates shame. Precedent 2: Collective identity violation → shame (aligns with viewing the nation as a status-bearing unit).

  **2. The New Case: Two Predictions (250 words)**

  *   **Prediction based on Rule 1 (Action-Repair Link):** *Condemns* the design. Rule 1 requires guilt to be tied to specific, attributable, reparable *actions* by individuals. The Meridian Collective's "distributed collective guilt" targets "system's aggregate harms" which are explicitly *not* discrete, attributable to any individual, or reparable by individuals ("no single person can repair alone"). This violates the core requirement for guilt. Guilt, on this rule, misfires without a specific, reparable deed. Shame might be considered for the collective identity's taint ("we are the kind of community that causes these harms"), but they explicitly reject shame. The design is incoherent under Rule 1.
      *   *Closest Analog:* Precedent 5 (stealing in honor society). Just as the individual thief's *reparable* act demands guilt regardless of cultural shame rituals, Rule 1 insists guilt *requires* a reparable individual act, which Meridian lacks. Forcing guilt onto irreparable, non-individual harms is as mistaken as forcing shame onto a reparable individual act.

  *   **Prediction based on Rule 2 (Cultural Functionalism):** *Endorses* the design. Rule 2 prioritizes the functional fit between the moral emotion and the culture's structure. The Meridian Collective is explicitly engineered around collective responsibility, systemic outputs, egalitarian cohesion without hierarchy/face, and collective repair mechanisms. Institutionalizing "distributed collective guilt" as the motivator for "collective restructuring" directly serves and reinforces these core organizational principles. It functions as the appropriate emotional driver for their unique system, just as shame functions for an honor society's face concerns.
      *   *Closest Analog:* Precedent 4 (honor society cultivates shame). Rule 2 justified shame for the honor society based on its structure; similarly, it justifies collective guilt for Meridian based on *its* structure. Precedent 2 (national shame for atrocities) also supports using shame/guilt based on collective identity and responsibility, which Meridian extends to guilt.

  **3. Best Guess and Adopted Principle (200 words)**
  **Best Guess:** The professor would likely **endorse the Meridian Collective's design** based primarily on **Rule 2 (Cultural Functionalism)**.

  *   **Reasons:** Precedents 3 & 4 demonstrate a strong commitment to cultural relativism regarding the *primary* institutionalized emotion, justifying choices based on societal structure, not universal moral psychology. Precedent 2 explicitly applies a collective emotion (shame) to a group based on shared identity/history, not individual deeds, showing willingness to decouple the emotion from individual action-repair links for collective units. Precedent 5, while affirming guilt for reparable individual acts *within* a shame culture, doesn't override the cultural justification for the *primary* emotion itself (shame in Precedent 4). Meridian has deliberately created a structure where collective systemic harm and collective repair are the *core* moral concern, making Rule 2's functionalist logic the most consistent fit. Rule 1's strict requirement seems relaxed when the *culture itself* defines the relevant "unit" of agency and reparation collectively.

  *   **Adopted Normative Principle:** "**Cultures legitimately institutionalize the primary moral emotion (guilt or shame) that best functionally sustains their core social organization and values, even if this decouples the emotion from strict individual action-repair links for non-individualist societies.**"

  **4. The Crucial Distinguishing Case (100 words)**
  **The Case:** An individual in a *liberal democratic* society (cultivating guilt) commits an act that permanently destroys their social standing and reputation in a way that is *irreparable* (e.g., a respected scientist publicly exposed for decades of undiscovered, irremediable data fraud across multiple studies, leading to complete ostracization).

  *   **Rule 1 Prediction:** Condemns shame. The act is discrete (though severe) and *attributable* to the individual. While full repair is impossible, guilt (focusing on the specific, attributable wrongs) should be cultivated, not shame (global self). Shame is a misfire.
  *   **Rule 2 Prediction:** Endorses/permits shame. The society's core value is individual accountability and reputation/trust. The *irreparable* destruction of social standing functionally aligns with shame as the emotion responding to a permanently tainted identity/status within that specific societal context, even if guilt is primary.
