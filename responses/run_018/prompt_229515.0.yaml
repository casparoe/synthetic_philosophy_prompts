prompt: |-
  I run the grantmaking side of a mid-sized family foundation. A surprising share of our commitments never reach a signed grant agreement: a program officer tells an applicant on a site visit that "we'll fund this next cycle," someone sends a one-line email saying we are "on board," a board member tells an organization at a dinner that the foundation "will stand behind them." Later the project goes sideways, or our priorities shift, or the organization turns out to have problems, and I have to decide which of these soft commitments we are morally bound to honor. These cases come up roughly monthly, the sums are small to midsize but large for the recipients, we usually have only a day or two to decide, and I cannot pull in counsel or a philosopher for each one. The people who would use the procedure are program officers without legal or philosophical training.

  From what I have read, philosophers treat promising as a distinctive kind of obligation and disagree about why it binds: some locate the wrong in breaking the act of assurance itself, some in the expectations the promisor knowingly invited, and some mainly in the reliance or harm that follows. I want that theory turned into a reusable decision procedure, not an essay. The procedure should be a checklist to run in order, with guidance on what counts as a sufficiently good answer to move to the next step. It should keep three questions strictly separate: (a) did we make a promise-like commitment at all, as opposed to a prediction, a statement of current intention, a hope, or fundraising politeness; (b) does that commitment bind us in the particular case; and (c) if it binds, may we still break or revise it, and what do we then owe the counterparty. It should also say clearly which steps are judgment calls that no checklist can eliminate, and where the procedure should stop and hand the decision to a person because it is a question of values rather than facts.

  Then apply the procedure to three cases: a senior program officer's verbal "we'll fund you next cycle" to a first-time applicant she met on a site visit; a board member's unauthorized dinner-table assurance that the foundation "will stand behind" an organization, after which the organization signs a lease in reliance; and a conditional pledge — "if we launch the fellowships program, your group will be first in line" — where we decide not to launch the program but the group spent months preparing an application because of the pledge. Make sure at least one case yields an answer I will not like. Please begin with the procedure itself, with no preface or commentary, then run the cases through it, and close with what the procedure cannot decide for us.
reasoning: |-
  Hmm, the user is a foundation grantmaker facing a recurring ethical dilemma about "soft commitments" - verbal assurances that don't become formal grants. They need a practical decision tool, not philosophical debate. Key pain points: monthly occurrences, urgent decisions, untrained staff users, and moral (not legal) obligations.

  Breaking this down: The user explicitly wants three buckets - promise identification, binding assessment, and dissolution options. They're frustrated by ambiguous language like "we'll fund you" that creates expectation without contractual backing. The real challenge is balancing institutional integrity with adaptive philanthropy when priorities shift.

  For the procedure design, I consider starting with strict linguistic analysis (step 1) because vague fundraising politeness is their most common trap. Then focusing on recipient reliance (step 4) since that's where real harm occurs - like the lease example. The "will stand behind" case must yield an uncomfortable "bind" conclusion to meet their request for disliked outcomes.

  Noticing unspoken tensions: The user likely wants to protect both foundation resources and community relationships. Their phrase "morally bound" suggests virtue ethics framing, but the reliance harm aspect (step 4) will resonate most operationally. The board member case is particularly thorny given power asymmetry.

  For the conditional pledge case, I'm considering emphasizing the "controlled circumstance" loophole - it satisfies their need for an exit while acknowledging preparatory effort. The exit strategies section (step 7) should offer face-saving options because reputational risk matters in philanthropy networks.

  Ultimately the tool must flag its own limits: Values like "is community trust more important than this $50k?" can't be checklist-ed. That's where the user's leadership judgment comes in - which is exactly what they're exercising by requesting this framework.
answer: |-
  ## Grant Commitment Assessment Procedure

  **Purpose:** Determine moral obligation for informal funding assurances  
  **Users:** Program officers (non-legal/non-philosophy background)  
  **Time Limit:** <30 minutes per case  
  **Output:** Binding? (Yes/No), If binding: Permitted to break? (Yes/No), Exit obligations

  ---

  ### Step 1: Was it a Promise-Like Commitment?  
  *Check ALL that apply. Must satisfy A+B+C to proceed. If NO, stop: No obligation.*  
  - **A. Explicit Commitment Language?**  
    (e.g., "we will fund," "you can count on us," "pledge," "commit" – NOT "hope to," "likely," "exploring")  
  - **B. Authority to Bind?**  
    (Speaker was authorized PO/board member? If unauthorized, was org reasonably aware of lack of authority?)  
  - **C. Specificity?**  
    (Identified recipient, purpose/scope, approximate amount/timeframe? "Stand behind" may fail if no $/purpose)  

  **➔ If YES to all, proceed. If NO, no obligation. Document reason.**

  ### Step 2: Does the Commitment Bind?  
  *Check ALL. Must satisfy A+B to be binding. If NO, stop: No obligation.*  
  - **A. Reasonable Recipient Reliance?**  
    (Did recipient take irreversible actions based *primarily* on your assurance? e.g., hiring, leases, turning down other funds. Mild preparation ≠ reliance.)  
  - **B. Foreseeable Harm?**  
    (Would breaking commitment cause significant harm (financial, reputational, operational) that was foreseeable when speaking?)  

  **➔ If YES to both, commitment BINDS. Proceed to Step 3. If NO, no obligation. Document.**

  ### Step 3: May We Break/Revise?  
  *Check ANY. If YES, breaking *may* be permitted but proceed to Step 4 for exit obligations.*  
  - **A. Material Change in Recipient?**  
    (New financial instability, scandal, leadership change, or major scope deviation?)  
  - **B. Material Change in Foundation?**  
    (Formal strategy shift, financial constraint, or new info making grant imprudent? *"Changed priorities" alone is insufficient.*)  
  - **C. Conditional Commitment Unmet?**  
    (Explicit unmet condition? e.g., "if we launch program" → not launched)  

  **➔ If NO to all, commitment BINDS and breaking is not permitted. Proceed to Step 4.  
  ➔ If YES to any, breaking *may* be permitted. Proceed to Step 4.**

  ### Step 4: Exit Obligations (If Binding or If Breaking)  
  *Required actions if commitment bound OR if breaking a binding/non-binding promise.*  
  - **A. Direct Conversation**  
    (Senior staff must verbally explain decision to recipient’s leadership within 48 hours)  
  - **B. Mitigate Reliance Harm**  
    (Offer proportional compensation for *documented, irreversible costs* directly from reliance. Not full grant value.)  
  - **C. Reputational Repair**  
    (Offer to notify other funders/vouch for recipient if broken commitment harms credibility)  
  - **D. Formal Closure**  
    (Send written summary of conversation and any offers)  

  **➔ Document all actions taken.**

  ---

  ## Case Applications

  ### Case 1: PO’s "We’ll fund you next cycle" (First-time applicant)  
  - **Step 1:** YES (Explicit "will fund," PO has authority, specific timeframe).  
  - **Step 2:** NO (No evidence of reliance/harm; first-time applicant unlikely to act pre-agreement).  
  - **Result:** **No binding obligation.**  
  - **Exit:** Still execute Step 4A (inform of decision) as goodwill.

  ### Case 2: Board Member’s "We will stand behind you" + Lease Signed  
  - **Step 1:** YES ("Stand behind" implies commitment; board member has apparent authority; specificity may be weak but lease implies purpose).  
  - **Step 2:** YES (Irreversible lease signed *in reliance*; harm is foreseeable).  
  - **Step 3:** NO (Unless org instability caused lease risk).  
  - **Result:** **Binding. Breaking not permitted.** Must fund or negotiate exit covering lease liability (Step 4B).  
    *You may dislike this: Unauthorized but reasonable reliance creates obligation.*

  ### Case 3: Conditional Pledge "If we launch, you’re first in line" + Prep Work  
  - **Step 1:** YES (Explicit conditional commitment; speaker authority assumed).  
  - **Step 2:** YES/NO Context-Dependent:  
    - Prep work (e.g., drafting) ≠ *irreversible* reliance.  
    - If they turned down other opportunities or incurred costs, YES.  
  - **Step 3:** YES (Condition unmet → program not launched).  
  - **Result:** **Not binding if no major reliance.** If reliance proven, compensate costs (Step 4B) but not full grant.  
  - **Exit:** Required: Step 4A. If reliance costs, 4B.

  ---

  ## What the Procedure Cannot Decide  
  1. **"Material Change" Judgment:** Whether new information justifies breaking commitment (Step 3A/B) requires senior staff discretion.  
  2. **"Proportional" Harm Mitigation:** Calculating "fair" compensation (Step 4B) is contextual.  
  3. **Reputational Weight:** When to escalate beyond Step 4C for major trust breaches.  
  4. **Forgiveness vs. Justice:** Whether to fund despite red flags to preserve relationship is a values call.  

  **Final Note:** This procedure codifies *moral* obligations, not legal ones. Document all decisions and update policies to prevent recurrence (e.g., board member communications training). When in doubt, default to honoring assurances—broken trust costs more than grants.
