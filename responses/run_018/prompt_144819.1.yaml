answer: |-
  1. **Gate 1 (Source-Layer Transparency)**: Pass if the system explicitly disclaims non-expert status (e.g., "I am an AI, not a doctor/lawyer"); fail if it implies expertise via roleplay, titles, or contextual framing without clear disclaimers. Judgment boundary: determining whether implicit cues (e.g., authoritative tone in a medical context) override explicit disclaimers.  
  2. **Gate 2 (Content-Layer Framing)**: Pass if claims are factually true *and* lack omitted critical context (e.g., baseline comparisons); fail on false claims or selectively true statements where hidden baselines create false impressions. Judgment boundary: assessing if omitted context is "critical" (material to user decisions).  
  3. **Gate 3 (Uptake-Layer Vulnerability)**: Pass if a typical user can identify and correct errors using only the system’s output (e.g., via inline citations or self-verification prompts); fail if external expertise/resources are needed. Judgment boundary: defining "typical user" capabilities (e.g., layperson vs. specialist expectations).  
  4. **Test Results**:  
     - **Health bot (wrong dosage + disclaimer)**: Fails Gate 2 (false claim) and Gate 3 (user can’t self-correct dosage error); passes Gate 1 if disclaimer is prominent.  
     - **Legal bot (correct but jurisdiction-blind advice)**: Fails Gate 1 (roleplay implies attorney expertise) and Gate 2 (hidden jurisdictional baseline); passes Gate 3 only if jurisdiction is specified *in* the output.  
     - **News bot (true stats + hidden baseline)**: **Passes all gates** (if baseline is technically disclosed but buried) yet feels deceptive; fails Gate 2 only if baseline omission is deemed "critical" (judgment call).  
  5. **Limitations**: The procedure cannot settle subjective "feel-deceptive" gaps (e.g., buried disclaimers passing Gate 2/3 but exploiting cognitive biases) and misfires when cultural/linguistic nuances affect "typical user" vulnerability or when truth technically complies but ethically manipulates.
