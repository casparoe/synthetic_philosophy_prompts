  hi — I'm doing a behavioural genetics module this term (psych department, cross-listed with the education school, so half the room is trainee teachers) and there's one line that keeps doing a lot of work in our seminars, and I don't think I actually know what it means: "heritable doesn't mean unchangeable".

  Two places it came up. First, we were going over the twin-study numbers for educational attainment — the lecturer said somewhere in the 0.4 to 0.6 range — and someone asked, a bit provocatively, whether there's any point in after-school tutoring programmes if the differences between kids are mostly genetic anyway. She just said "heritable doesn't mean unchangeable" and moved on. The room seemed satisfied and I wasn't: I couldn't tell whether that was an argument or just a polite way of changing the subject.

  Second time, someone in my study group used the exact same sentence to claim that if we equalised school funding and teaching quality across schools, the heritability of test scores would go UP rather than down. That sounds backwards to me but I couldn't say why, and it's the sort of thing I'd like to be able to say why about.

  I sort of get the phenylketonuria example — genetic cause, environmental fix — but it feels like a rigged case: one gene, one very specific dietary intervention. It doesn't obviously generalise to something influenced by thousands of variants. People also keep tossing in "it's a population statistic, it isn't about individuals", and I can't tell whether that's a separate point or the same one dressed up.

  So: what are the different precise claims that sentence could be making, from the ones that are basically tautologies to the ones that are genuinely substantive? For each, is it actually true, and does it really answer the tutoring question, or is it true but irrelevant? Does any reading support the bit about heritability rising when you make environments more equal, or is my study group just confused? And where is the slogan weakest — what's the case where high heritability really is bad news for an intervention, so I can see the difference between the line and a real argument?

  Write it as continuous prose, no headings, bullet points, bold or tables — ideally like an email I could forward to my tutor without embarrasing myself. I definately need to be able to follow the thread without a list to lean on.
