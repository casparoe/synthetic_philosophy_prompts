  Here's how I'd frame that email to your tutor – keeping it flowing as requested:

  ---

  Subject: Clarification needed on "heritable doesn't mean unchangeable"

  Hi [Tutor's Name],

  I'm writing to seek some clarification on a point that keeps surfacing in our behavioural genetics seminars – the phrase "heritable doesn't mean unchangeable". While I grasp the basic sentiment, I find myself struggling to parse its precise meaning in different contexts, particularly as it seems to be deployed in ways that leave important questions unanswered or even raises new ones.

  The first instance was during the discussion on the heritability of educational attainment (those twin-study estimates around 0.4-0.6). When someone questioned the value of tutoring programmes given this genetic component, the lecturer responded with "heritable doesn't mean unchangeable" and moved on. While the room seemed satisfied, I was left unsure if this was a substantive counter-argument or simply a way to deflect a potentially awkward question. It felt insufficient to address the core concern: *if* a significant portion of the *current differences* between children in attainment are attributable to genetic variation, what does that imply for the *potential effectiveness* of broad interventions like tutoring? Does it mean tutoring might work less well for everyone, or that its effects might vary greatly depending on the child's genetic makeup? The slogan didn't illuminate this.

  This confusion deepened in my study group. Another student used the exact same phrase to argue that if we equalised school funding and teaching quality, the heritability of test scores would *increase*. My intuition was that this sounded backwards – surely making environments more equal would reduce environmental causes of variation, making the *relative* genetic contribution *higher*? But I couldn't articulate the logic clearly, or whether this inherent logic actually supported the core point about changeability. It highlighted how slippery the slogan can be.

  I understand the classic phenylketonuria (PKU) example – a highly heritable disorder rendered essentially harmless by an environmental intervention. It demonstrates the principle technically, but as you know, it feels like a special case: monogenic, with a specific, targeted environmental fix. It doesn't easily generalise to complex traits like educational attainment, influenced by thousands of genetic variants interacting with countless environmental factors over development. People also frequently add that heritability is "a population statistic, not about individuals". While true, I'm unclear if this is a distinct point reinforcing why change is possible at the individual level, or another facet of the "heritable ≠ unchangeable" argument itself.

  So, I'm trying to disentangle the different claims packed into "heritable doesn't mean unchangeable":

  1.  **The Tautological Reading:** Genes aren't fate; environments *can* alter outcomes. This is trivially true for almost any trait (barring some lethal genetic conditions) and doesn't really address the tutoring question – it just states the *possibility* of change, not its likelihood, magnitude, or practicality.
  2.  **The Substantive Reading (Reaction Norms):** Genotypes have a *range* of potential phenotypic expressions depending on the environment (the reaction norm). High heritability in *one* environment doesn't preclude a different phenotype in a *different* environment. This is crucial. It means that while the *current variation* under *current conditions* might be largely genetic, a *systematic change* to the environment (like universal high-quality tutoring) could shift the *entire distribution* of attainment upwards for everyone, even if individual *differences* (within the new environment) remained largely genetic. This directly answers the tutoring sceptic: tutoring could raise *absolute* levels for many, even if *relative* rankings changed little.
  3.  **The Substantive Reading (Heritability Interpretation):** Heritability estimates are context-dependent. As my study group peer correctly implied (though perhaps didn't fully explain), reducing environmental *variation* (like equalising school quality) increases the *proportion* of the *remaining* variation attributable to genes – hence heritability *rises*. Crucially, this **does not** mean the trait becomes *less* malleable! It means that *in that specific, more uniform environment*, genetic differences account for more of the *observed differences between individuals*. The potential for environmental influence on the *mean level* of the trait remains. This highlights that heritability tells us about the *sources of current variation*, not the *potential for change*.

  Where the slogan feels weakest, and where high heritability *might* genuinely temper intervention optimism, is for traits where the reaction norm is very flat – where changing the environment within feasible ranges produces little change in the phenotype for most genotypes. Think of highly canalized traits like basic sensory abilities. Or, for complex traits, interventions that are diffuse, poorly targeted, or applied too late might show limited effects *despite* theoretical potential. The slogan shouldn't blind us to these realities; it should prompt us to ask *what kinds* of environmental changes, applied *when* and *for whom*, are likely to be most effective given the genetic architecture.

  In essence, "heritable doesn't mean unchangeable" is vital for countering genetic determinism, but its power lies in the deeper concepts it points to – reaction norms and the context-dependence of heritability estimates. On its own, it risks being a conversation-stopper rather than the starting point for a more nuanced discussion about *how*, *when*, and *for whom* environmental interventions can effectively alter outcomes, even for highly heritable traits. I'm keen to understand these nuances better, particularly regarding the educational implications.

  Thanks for your time and insight.

  Best regards,

  [Your Name]

