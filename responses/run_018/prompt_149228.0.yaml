answer: |-
  Here's the dissection of that slogan, point by point, with verdicts on each claim and how they function in the "dismissal" argument:

  **1. Lamarckian (Acquired traits can be inherited):**  
  *   **Precise Claim:** Cultural traits acquired or modified during an individual's lifetime (e.g., learning a modified skill, adopting a tweaked belief) can be directly passed on to others.
  *   **Verdict:** **Empirically Defensible.** This is a core, valid difference. You learn a modified recipe and teach it; that modified trait is directly inherited by the learner. Biology doesn't work this way (outside epigenetics, which is limited). The mechanism is direct communication/imitation, not random mutation filtered by selection.

  **2. Horizontal Transmission (Traits spread peer-to-peer, not just parent-to-offspring):**  
  *   **Precise Claim:** Cultural information spreads between any individuals in a population (friends, strangers online), not just vertically from ancestors/teachers to descendants/students.
  *   **Verdict:** **Mostly Tautological / Obviously True.** While vertical transmission exists (parents teaching kids, masters teaching apprentices), horizontal transmission (social media, peer influence, mass media) is dominant and defining for cultural evolution. This isn't a deep insight, it's a basic observation.

  **3. No Clear Unit of Selection (What exactly is evolving/replicating?):**  
  *   **Precise Claim:** Identifying the precise cultural "replicator" (analogous to a gene) or the primary "vehicle" (analogous to an organism) is difficult and contested.
  *   **Verdict:** **Profoundly Problematic / Where the Analogy Breaks.** Biology debates units too (genes, genomes, individuals, groups), but it has a clear molecular basis (DNA). Culture lacks this. Is the unit a meme? A practice? A norm? A belief? A whole institution? Different things seem selected at different levels (a catchy hook *within* a song; the song itself; the genre; the platform hosting it). Applying this to legal norms vs. viral dances highlights the flaw: Legal norms evolve through complex, intentional institutional processes involving power, negotiation, and design; viral dances spread through rapid, often unconscious imitation. Treating them as equivalent "evolving units" obscures vastly different mechanisms.

  **4. "Culture Evolves Like Biology" (The Core Analogy):**  
  *   **Precise Claim:** Cultural change involves variation (new ideas/behaviors), selection (some spread, some die out), and inheritance (transmission). Therefore, Darwinian principles broadly apply.
  *   **Verdict:** **Broadly Tautological / Descriptive Framework, Not Explanatory.** Defining "evolution" as variation + selection + inheritance makes this true by definition for any system exhibiting those features (culture, technology, galaxies). It's a *description* of *how* change happens, not *why* specific changes occur or *how significant* they are. It doesn't automatically grant cultural change the same "naturalness" or inevitability as biological evolution.

  **The Dismissal Tactic ("Just Evolutionary Pressure"):**

  *   **Precisification Invoked:** The person is invoking the **broad tautology** (#4) combined with an **implicit fatalism**. They're saying: "Algorithmic selection is just a new form of environmental selection pressure on cultural variants. This is the natural process of cultural evolution at work. Therefore, worrying about its specific impacts or trying to significantly alter it is futile or misguided, like trying to stop natural selection."
  *   **Does it Do Argumentative Work?**
      *   **Superficially:** Yes, it sounds clever and frames the concern as misunderstanding a fundamental process. It *sounds* like a deep, rationalist counter-argument.
      *   **Actually:** **No, it's a rhetorical dodge masking critical distinctions.** Here's why:
          1.  **Ignores Agency & Design:** Algorithms aren't a "natural environment." They are *designed* by humans with specific goals (engagement, profit), creating *artificial*, intense, and often opaque selection pressures fundamentally different from pre-digital cultural evolution. Calling it "just evolution" ignores this crucial human design element and the specific, potentially harmful, biases built into it.
          2.  **Equates Description with Justification:** Describing *how* something spreads (via selection) says nothing about whether that spread is *desirable*. Biological evolution produces parasites and cancer; cultural "evolution" via algorithms can produce misinformation, extremism, and mental health crises. Pointing out the mechanism doesn't justify the outcome or preclude intervention.
          3.  **Overlooks Speed and Scale:** Algorithmic selection operates at unprecedented speed and global scale, potentially overwhelming slower cultural adaptation mechanisms (critical thinking, social norms, regulation). Calling this "just evolution" trivializes this radical acceleration.
          4.  **Hides the "Unit" Problem:** The dismissal glosses over *what* is being selected *for*. Is it raw engagement (clicks, time)? Is that selecting for good ideas, addictive junk, or outrage? Equating this artificial selection pressure to natural selection ignores the contestability of the *metric* driving selection.
          5.  **Rejects Human Values:** It implicitly argues we shouldn't apply human values (truth, well-being, democracy, fairness) to judge or shape these outcomes because "it's just evolution." This is surrender, not insight.

  **Verdict on the Dismissal:** Using the slogan to dismiss concerns about algorithms as "just evolutionary pressure" is **intellectually lazy and misleading.** It leverages the surface-level truth of the descriptive framework (#4) to smuggle in fatalism and ignore the critical differences: artificial design, speed, scale, contested selection metrics, and the essential role of human values and intentional intervention in shaping our cultural environment. It sounds edgy but does no real argumentative work beyond shutting down discussion.
