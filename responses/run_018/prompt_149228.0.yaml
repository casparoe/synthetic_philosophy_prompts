prompt: |-
  Hey, longtime lurker on rationalist forums here. There's this line people keep throwing around: "culture evolves like biology, except it's Lamarckian, horizontal, and has no clear unit of selection." They deploy it for everything from "TikTok trends are just natural selection in action" to "we shouldn't stress about algorithmic reccomendation because it's only evolutionary pressure on ideas." Can you separate the precise claims hiding inside that one sentence? Give me the menu: which parts are basically tautologies, which are empirically defensible (like acquired-trait inheritance in cultural transmission), which collapse once you remember that genes themselves have contested units of selection, and which are flat false if you try applying them to legal norms versus viral dances. Specifically, tell me which precisification of the slogan is being invoked when someone dismisses algorithmic concerns as "just evoltuionary pressure," and whether that reading actually does any argumentative work or just sounds edgy. Answer in American English please — no citations or reading lists, I just want the disambiguation with verdicts.
