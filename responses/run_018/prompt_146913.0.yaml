    "scope_error": "Indeterminacy applies only to cross-linguistic translation with no prior context. It does not apply to terms within shared linguistic frameworks, scientific ontology constrained by causal roles, or systems shaped by human language data.",
    "pragmatic_fix": "Shared practices and theoretical utility resolve reference practically, but the metaphysical indeterminacy remains unresolved (though pragmatically irrelevant).",
    "alignment_red_herring": "LLM representations are statistical encodings of human-resolved language patterns. Alignment depends on functional outputs matching human values, not metaphysical reference of internal states.",
    "verdict_on_discount_rate": "Mistaken. Scientific ontology is causally grounded, not subject to probabilistic discounting. Quinean alternatives are philosophical toys, not live epistemic options."
  }
