  Your challenge targets two pressure points: the symmetry from Einstein's hole argument (diffeomorphism invariance forcing equivalence of dragged descriptions) and Machian frame-dragging (conceding distant matter influences local inertia). Here's my defense:  
  Field-substantivalism escapes collapse because rotation *is* absolute—defined *by the metric field's geometric structure itself*. The diffeomorphism you describe doesn't create a physically distinct scenario; it merely redescribes the *same* state of the universe using different mathematical labels for points. What matters is the intrinsic geometric structure encoded in the metric field values: in your sparse solution, the bucket rotates *relative to the local inertial frames determined by the metric's curvature*. This isn't relationalism because the metric isn't reducible to matter relations—it's a substantial entity whose geometric properties (like frame-dragging effects near rotating shells) exist independently. The rotation is absolute because it's fixed by the bucket's *deviation from geodesic motion within the metric's geometric structure*, regardless of distant matter. Diffeomorphism invariance shows only that point labels are conventional, not that spacetime's geometric substance is relational. Even in asymptotically flat regions, the metric field ontologically grounds inertia.
