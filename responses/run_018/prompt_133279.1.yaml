  I am working through a problem set for a graduate seminar in philosophy of physics, and I want to stress-test my own relationist sympathies by confronting the strongest version of the opposing view. Here is my opening move: Newton’s bucket was originally designed to show that true rotation is absolute, not relative to distant bodies. In general relativity, however, local inertial frames can be dragged by rotating shells, suggesting a Machian dependence on distant matter, while the field equations also permit asymptotically flat solutions containing a single rotating body with no other matter present. If the metric field is a real substance, then in such a sparse solution there is a straightforward fact about whether the bucket rotates relative to this substantial field. But now apply Einstein’s hole argument precisely: construct a smooth diffeomorphism that rotates the bucket’s world-tube and simultaneously applies a counter-rotation to the metric-field values in the surrounding region, leaving every matter-field relation invariant. On your view, because points lack primitive identity, these two descriptions represent the very same physical world—so you avoid observational underdetermination. Yet this raises a problem: if there is only the bucket and the field, and both descriptions are identical worlds, what makes it true that the bucket rotates rather than the field rotating around it? If you answer that the rotation is fixed by the relation between the bucket’s matter and the local field values, that sounds relational, not substantial. So does your field-substantivalism not collapse, precisely at the point where Newton’s bucket argument demands an absolute distinction, into a disguised relationism about rotation?
