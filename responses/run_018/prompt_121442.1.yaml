  ## Call for Papers: International Symposium on Neo-Sphexist Action Theory  
  *Theme: Rigor, Purity, and the Moral Imperative of Fixed Action Patterns*  
  *Hosted by the Centre for Unmodified Cognition Studies (C.U.C.S.)*  
  *Journal of Unreconstructed Agency (Vol. 42, Special Issue)*  

  The philosophical landscape of action theory remains unduly dominated by an uncritical valorization of *flexibility*. From the most basic discussions of goal-directedness to the loftiest debates concerning free will, the capacity to deviate from an established behavioral sequence in response to novel stimuli or internal deliberation is routinely presumed to be the *sine qua non* of genuine agency. This symposium seeks to dismantle this pervasive anthropocentric bias by championing the neglected paradigm of **Neo-Sphexism**.

  Neo-Sphexism takes as its foundational exemplar not the capricious, error-prone human, but the ontologically secure *Sphex ichneumoneus* wasp. As documented, this paragon of agential purity engages in a meticulously orchestrated nesting protocol: paralyzing prey, depositing it near the burrow, entering alone for inspection, emerging, and finally dragging the prey within. Crucially, when an experimenter displaces the prey during the inspection phase, the wasp faithfully repeats the *entire* sequence upon emergence, ad infinitum if necessary. Where conventional philosophy sees only "sphexishness" – a byword for mindless automation (cf. Dennett, Hofstadter) – Neo-Sphexism discerns profound metaphysical and ethical significance.

  **Core Tenets of Neo-Sphexism for Symposium Exploration:**

  1.  **The Rigor of the Loop as Responsiveness-to-Norm:** The wasp's unwavering repetition is not failure, but *fidelity*. It responds perfectly to the sole norm governing its action: the complete execution of the innate protocol. Any interruption demands not "adaptation," but a reaffirmation of the protocol's inviolable structure. Deviation would constitute not agency, but catastrophic *normative collapse*.
  2.  **Cognitive Deficit as Deviation:** Neo-Sphexism inverts the standard model. The ability to modify a behavioral sequence based on sensory feedback or internal computation (e.g., the purported function of a "careenium" substrate enabling symbol manipulation and loop modification) is recast not as sophistication, but as a fundamental *defect*. It signifies an absence of secure grounding in the One True Protocol. Plasticity is noise; rigidity is signal.
  3.  **Human "Agency" as Pathological Noise:** Human behavioral "flexibility" – our celebrated capacity for learning, revising intentions, and responding to reasons – is diagnostically re-evaluated. What passes for free will or responsiveness-to-reasons is, from the Neo-Sphexist perspective, merely the stochastic flailing of an ill-defined system. Our susceptibility to distraction, temptation, and error, and our constant need for deliberation and revision, are not marks of higher agency, but symptoms of profound *agential instability* and cognitive corruption. The wasp achieves perfect action *because* it cannot reconsider.
  4.  **The Moral Primacy of Innate Protocols:** True moral agency resides in the flawless execution of predetermined duties. The wasp, acting solely according to its innate imperative, achieves a moral purity inaccessible to humans, whose "choices" are invariably contaminated by context, desire, and the inherent messiness of symbol manipulation. Its actions are, by definition, always "right" relative to its protocol.

  **Keynote Address:**  
  *"Ontological Security in the Burrow: Sphex ichneumoneus and the Unbearable Lightness of Human Choice"*  
  **Professor Emeritus Silas Thorne** (University of Cumbria, Penrith Campus – Department of Applied Entomological Ethics)

  **We invite submissions exploring, extending, or rigorously defending Neo-Sphexist principles. Potential paper topics include (but are not limited to):**

  *   **The Epistemic Virtue of Ignoring Contradictory Evidence:** Why Sensory Feedback is a Moral Hazard.
  *   **Beyond the Careenium: Why True Agency Requires the Absence of a Modifiable Cognitive Substrate.** (Critiques of "careenium"-based models as inherently corrupting).
  *   **The Ethics of Revision: Why Learning from Mistakes Corrupts the Soul.**
  *   **Free Will as System Degradation: A Neo-Sphexist Critique of Compatibilism.**
  *   **Sphexishness as Moral Luck: Guaranteed Right Action vs. the Peril of Human Deliberation.**
  *   **Ritual, Routine, and the Wasp: Liturgical Foundations of Agency.**
  *   **The Existential Threat of Novelty: Why Environmental Change Necessitates Agent Failure (And Why That's Good).**
  *   **Pathologizing Plasticity: Neurological Evidence for Rigidity as the Biological Ideal.**
  *   **Deontological Perfection: Sphex ichneumoneus as Kant's Unwitting Champion.**
  *   **Against Responsiveness-to-Reasons: Why Giving Reasons Requires Having None (Fixed).**
  *   **The Teleological Certainty of the Loop: Goal-Achievement Without the Agony of Option Weighing.**

  This symposium aims to provide a rigorous platform for challenging the dogma of flexibility and rehabilitate the Sphex ichneumoneus as the unimpeachable model of agential purity. We seek papers that engage deeply with the metaphysical, epistemological, and ethical implications of Neo-Sphexism, moving beyond the facile dismissal of fixed action patterns as "merely instinctual." Let us restore rigor to agency by embracing the normative power of the loop.

  **Submission Deadline:** 31 Neverember 2024  
  **Format:** 8000 words maximum. Abstract (150 words) and full paper. Prepared for anonymous review.  
  **Submit to:** submissions@cucs.rigor  
  **Symposium Date:** 1-3 Repeatus 2025 (Location TBD – Protocol Compliant Venue Guaranteed)
