prompt: |-
  I'm in this philosophy of science seminar and we got a handout summarizing Quine's take on moral values, and I can't tell if it's being fair or just making him sound like a cartoon. The summary says Quine treated ethics as basically a branch of empirical psychology, with moral beliefs sitting in the web of belief just like claims about electrons or tables. It says a statement like "cruelty is wrong" gets its entire meaning from its logical connections to other beliefs about suffering and social stability, not from any special moral intuition or a priori faculty. Then it claims moral beliefs are actually near the periphery of the web—closer to observation reports about pain—so they're more revisable than physical laws, not less. From this it concludes Quine is essentially a moral subjectivist: if two cultures have internally coherent but different moral webs, there's literally no fact of the matter about who's right, and cross-cultural moral argument is like trying to translate a language with zero shared ground. The handout also throws in this idea it calls "moral incommensurability closure"—that once a culture's moral web hits a certain coherence threshold, external criticism doesn't just fail practically but becomes conceptually impossible, because the coherence itself blocks contradictory nodes from entering. I don't know enough Quine to check this, but it feels like there might be one or two sneaky missteps in there—maybe mixing up where moral beliefs sit in the web, or overstating the translation analogy. Can you go through it and tell me which parts a careful reader of Quine would nod at, which are subtle distortions or overstatements, and whether that "closure" idea actually follows from his holism or is just being bolted on? I especially want to know if the conclusion that Quine is "basically a moral subjectivist" survives once the summary is corrected, or if that's where the real sleight-of-hand happens.
reasoning: |-
  Okay, let me unpack this student's query about Quine's ethics. They're clearly grappling with a seminar handout that presents Quine as reducing morality to psychology and endorsing radical relativism. The student senses something's off—especially about "moral incommensurability closure"—and wants a reality check. 

  First, I need to separate Quine's actual positions from the handout's spin. The core insight about ethics being part of the empirical web is legit Quine; "cruelty is wrong" indeed derives meaning from its connections to observations like pain behavior. But the handout oversimplifies by slotting moral beliefs near the periphery. Quine never mapped ethics so precisely—he'd likely see them as mid-web, entangled with psychology and sociology. 

  The subjectivist label feels like a trap. Quine rejected transcendent moral facts, but not objectivity within a conceptual scheme. His analogy to translation is key: just as radical translation seeks empirical anchors, moral disagreements might find footing in shared observations (e.g., suffering). The handout's "closure" idea is pure fabrication though—Quine's holism permits revising any belief, however central, given sufficient strain. Coherence doesn't immunize systems from criticism; it just makes revision costly. 

  Where the student's skepticism hits hardest is the handout's leap from holism to relativism. Quine's actual view is subtler: while no external arbiter exists, cross-cultural moral debate can still appeal to empirical consequences and pragmatic virtues. The real sleight-of-hand is framing coherence as conceptual closure—that's antithetical to Quine's fallibilism. 

  For the student's seminar, they should push back on three fronts: the peripheral placement of morals, the mistranslation of underdetermination as relativism, and the invented "closure" doctrine. Quine's ethics are naturalistic but not subjectivist in the crude sense—it's a third way the handout misses entirely.
answer: |-
  You're right to be suspicious—this handout oversimplifies Quine in several subtle but crucial ways, turning his nuanced naturalism into a caricature of relativism. Let's break down where it's accurate, where it distorts, and how that affects the "moral subjectivist" conclusion, especially regarding the fabricated "moral incommensurability closure" idea.

  **Where the Handout is Largely Correct (Nodding Points):**

  1.  **Ethics as Empirical/Psychological:** Quine *did* view ethics as continuous with natural science, specifically empirical psychology. Moral beliefs arise from human psychology, socialization, and our interactions with the world. There's no separate "moral intuition" faculty for him.
  2.  **Meaning via Holism & Connections:** "Cruelty is wrong" *does* derive its meaning primarily from its position within the web of belief – its connections to observations (e.g., crying, cowering, physiological signs), beliefs about human flourishing, social norms, evolutionary pressures, etc. Meaning isn't atomistic or derived from non-natural properties.
  3.  **Revisability:** Moral beliefs *are* revisable for Quine. There is no ultimate foundation, no synthetic a priori truths in ethics immune to revision based on experience and the needs of the overall system. They are not *less* revisable than core logic or physics *in principle*.
  4.  **Underdetermination & Translation Analogy (Partially):** The analogy to radical translation is apt *to a point*. Quine argued that radically different conceptual schemes (including moral ones) can be empirically equivalent ("underdetermined by evidence"). Disagreements between such schemes can be deep and resistant to straightforward resolution, similar to the indeterminacy faced by a field linguist.

  **Where the Handout Distorts or Overstates (Subtle Missteps):**

  1.  **Placement "Near the Periphery":** This is a serious misrepresentation. Quine *never* explicitly mapped moral beliefs to the periphery. In fact, he placed logic and mathematics at the *core*. Moral beliefs are likely far *more central* than the handout suggests:
      *   They are deeply entangled with psychology, sociology, anthropology, and even biology – all firmly in the middle of the web.
      *   They connect directly to *observations* (pain behavior, expressions of joy, conflict, cooperation) but also to highly theoretical beliefs about human nature, society, and consequences. They are *periphery-connected* but not *peripheral* themselves. Rejecting a core moral belief (e.g., about fundamental human rights) would likely require massive revisions across psychology, social theory, and law – it's *not* like discarding a single observation sentence about a fleeting sensation.
  2.  **"Moral Subjectivist" Conclusion:** This is the most significant overreach and sleight-of-hand. While Quine rejected *transcendent* moral facts, he did **not** embrace subjectivism or simple relativism:
      *   **Naturalistic Objectivity:** For Quine, objectivity arises *within* our best scientific (naturalistic) theory of the world. Statements about electrons or evolution are objective *relative to that theory*. Similarly, moral statements could be objective *relative to our best naturalistic understanding of human well-being, social cooperation, etc.* They are facts *about the world* – specifically, facts about human psychology, social dynamics, and their consequences – discerned empirically. He's closer to a **naturalist moral realist** (like a sophisticated utilitarian) than a subjectivist.
      *   **Translation Analogy Overextension:** While underdetermination applies, Quine didn't think *all* moral schemes were equally empirically adequate or pragmatically viable. A scheme advocating universal torture for amusement would conflict *massively* with observable human suffering, biological realities, and the basic requirements for any stable society. We *can* argue cross-culturally by appealing to *shared empirical consequences* (e.g., "Your practice causes widespread suffering and instability") and *pragmatic virtues* (simplicity, fruitfulness for prediction/control). It's difficult, but *not* conceptually impossible like translating a language with "zero shared ground." There *is* shared ground: observable human behavior and its consequences.
      *   **No "No Fact of the Matter" for Coherent Schemes:** Quine's underdetermination applies to *global theories*, not necessarily to every local disagreement. More importantly, even for globally different schemes, "no fact of the matter" for Quine meant *no fact discernible outside of our best theory*. Within our best naturalistic theory, there *are* facts about what promotes human flourishing or causes suffering – these *are* the moral facts. Subjectivism implies morality is *only* about individual feeling; Quine thinks it's about empirically investigable features of the world (human psychology/society).
  3.  **"Moral Incommensurability Closure" – Pure Fabrication:** **This is completely un-Quinean and contradicts his core holism.**
      *   **Holism vs. Closure:** Holism means *every* belief is *potentially* revisable in light of recalcitrant experience, no matter how central. "Coherence" is a *pragmatic virtue* guiding revision, not an impregnable fortress. If experience puts sufficient "stress" on the system (e.g., observing catastrophic consequences of a moral norm), *any* node, no matter how central, can be revised to relieve that stress – even if it means significant upheaval elsewhere. Coherence doesn't *block* revision; it guides *how* we revise.
      *   **External Criticism is Always Possible (in principle):** Precisely *because* of holism, external ideas *can* challenge any part of the web. An observation or argument from outside *can* connect to the periphery (e.g., showing a practice causes observable harm the culture hadn't acknowledged) and create stress that forces internal revision *somewhere*. The "closure" idea suggests systems become logically sealed, which is anathema to Quine's fallibilism and empiricism. Coherence makes revision *harder and more costly*, not *conceptually impossible*.

  **Corrected Conclusion on Quine's Moral Stance:**

  A careful reader would **reject the label "moral subjectivist"** for Quine. He is best described as a **Naturalistic Cognitivist** or a **Naturalistic Moral Realist (of a sort)**:

  *   **Naturalistic:** Moral facts are facts within the natural world, discoverable by empirical science (especially psychology and social science).
  *   **Cognitivist:** Moral statements are truth-apt; they can be true or false.
  *   **Realist (Immanent):** Moral truths exist, but they are truths *about* human beings, societies, and their interactions within the natural world, discerned through our best empirical theories. There are no *transcendent* moral facts.
  *   **Holistic & Fallibilist:** Our *specific* moral beliefs are part of the revisable web of belief, justified by their coherence with experience and the rest of science, not by intuition or a priori reasoning. They are always open to revision in light of new evidence or better theoretical integration.

  **The Real Sleight-of-Hand:**

  The handout's major distortions (peripheral placement, misapplication of translation analogy, invention of "closure") are used to *manufacture* the conclusion of radical subjectivism/relativism. Quine's actual view is far more robust:

  1.  Moral beliefs are deeply embedded in our overall scientific understanding of the world, not flimsy peripheral opinions.
  2.  While disagreements can be deep and underdetermined, cross-cultural moral argument *is* possible by appealing to shared empirical consequences (suffering, flourishing, stability) and pragmatic virtues within our naturalistic framework.
  3.  There *are* facts of the matter about morality *within* our best naturalistic theory of the world. It's not "just psychology" in the sense of *mere* subjective feeling; it's psychology/sociology revealing objective features of human existence relevant to value.

  **For your seminar:** Focus your critique on the **misplacement of moral beliefs** (not peripheral!), the **misinterpretation of underdetermination as implying subjectivism**, and the **completely un-Quinean "moral incommensurability closure"** concept. Emphasize that Quine's naturalism provides a framework for *objective empirical inquiry* into moral questions, grounded in the observable world, even if the answers are complex, revisable, and sometimes underdetermined. He rejects the transcendent, not objectivity itself.
