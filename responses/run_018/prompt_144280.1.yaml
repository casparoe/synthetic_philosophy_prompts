answer: |-
  ## The Basin Concord (1847)

  When Roaring Fork and Silver Bend did meet
  To sign the pact that fixed their border's fate,
  No scribe foresaw the river's sly retreat
  Through rock and time that might redesign each state.
  Yet should the waters veer in thought's domain,
  And different souls where ancient hamlets stood
  (No kin, no shared descent, no blood's red stain)
  Still pledge to terms sealed in that vanished wood—
  *We'd name it yet the selfsame treaty's grace*,  
  *As if the hands that signed retained their place*.

  But Lewis whispers: *Search no more that face*  
  For ghostly signers from our world's embrace!  
  Here, *roles* persist: "Headwaters' Lord" maintains  
  With "Delta's Voice"—though changed their mortal frames,  
  Their *posts* fulfill what parchment first decreed;  
  No soul endures, but structures plant their seed.

  Thus Lewis denies: *In W, the ink is new*;  
  Yet Kripke claims: *The treaty travels true*.

  ---

  **Notes for the Specialist:**

  1.  **Kripkean Intuition (Octave):** The octave establishes the pre-theoretical intuition: despite the river shifting (altering geography/circumstances) and the confederations being populated by entirely distinct individuals with no historical connection (no shared origins), the *treaty itself* is judged to be the very same agreement ("selfsame treaty's grace"). Rhymes like "meet/fate," "retreat/state," "domain/stain," "grace/place" evoke foundational events, fixed outcomes, and enduring presence/discovery.
  2.  **Volta & Lewisian Analysis (Lines 9-14):** The volta ("But Lewis whispers") directly challenges the identity claim. Lewis argues what survives is not the numerically identical signatories ("Search no more that face / For ghostly signers") but the *structural roles* ("Headwaters' Lord," "Delta's Voice") and the satisfaction of the treaty's functional conditions ("posts fulfill what parchment first decreed"). The sestet rhymes focus on concepts of position and function ("face/embrace," "maintains/frames," "decreed/seed") distinct from identity or essence.
  3.  **Rhyme & Metaphysical Distinction:** The sestet's rhyme pairs deliberately separate:
      *   "face/embrace": Concerns the *specific individuals* (denied identity).
      *   "maintains/frames": Concerns the *enduring roles* and the *different individuals* inhabiting them.
      *   "decreed/seed": Concerns the *structural condition* and its *recurrence* (like a pattern re-seeded).
      This mirrors Lewis's distinction between counterpart relations (similarity in role) and transworld identity.
  4.  **Closing Couplet (Explicit Conflict):** The couplet states the core disagreement with precision:
      *   **Lewis Denies:** The physical document (or the event) in world W is numerically identical to the original ("In W, the ink is new").
      *   **Kripke Affirms:** The treaty itself, as an abstract entity or a rigidly designated event, *can* exist transworld ("The treaty travels true").
  5.  **Originality & Recognition:** The river-basin treaty scenario avoids standard "Hesperus/Phosphorus" or "Table/Origins" examples. The focus on a *social/political object* (the treaty) surviving *structural/role-based changes* in population and geography precisely captures the dispute over whether persistence requires numerical identity of constituents (Kripke) or merely counterpart relations satisfying functional roles (Lewis). The specific terminology ("numerically identical," "counterpart relations," "structural conditions," "transworld identity") and the nature of the change ensure immediate recognition by specialists.
