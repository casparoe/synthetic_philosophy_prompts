answer: |-
  Here's a decision tree handout focusing on the concrete case and branching through core questions – perfect for sparking seminar debate. No prior label knowledge needed!

  **The Problem of Properties: Two Red Apples**
  *(Start Here)*  
  **Q1:** Looking at two red apples, is there literally **one single thing** (call it "Redness") that both apples possess *identically*, or are there just **two individual red things** that happen to be similar?

  *   **If ONE SINGLE THING (Redness Itself exists):** Go to Q2.
  *   **If JUST TWO SIMILAR THINGS (No identical shared "Redness"):** Go to Q5.

  ---

  **For the "ONE SINGLE THING" Path:**

  **Q2:** Can this single, identical "Redness" exist even if there are **no red things at all**? (Like, could Redness float around unconnected to any object?)

  *   **YES, it exists independently:** Go to Q3.
  *   **NO, it can *only* exist when instantiated in actual red things:** Go to Q4.

  **Q3:** Can this single, identical "Redness" (existing independently) be **wholly present in two different places at the same time** (like in both apples)?

  *   **YES, it can be fully present in multiple locations:** **≈ Platonic Realism** (Universals exist independently *and* are multiply located).
  *   **NO, it can't be in two places at once:** **→ EMPTY SPOT!** *Diagnosis:* This tries to have a universal ("one single thing") but denies its core feature – being shareable/multiply instantiable. If it can't exist uninstantiated (Q2:NO) *and* can't be multiply located... where *is* it? This collapses into denying it's truly "one single thing" shared. (Leads towards Q5 thinking).

  **Q4:** Can this single, identical "Redness" be **wholly present in two different places at the same time** (like in both apples)?

  *   **YES, it can be fully present in multiple locations:** **≈ Aristotelian Immanent Realism** (Universals exist, but *only in* their instances, and are multiply located).
  *   **NO, it can't be in two places at once:** **→ EMPTY SPOT!** *Diagnosis:* Same problem as Q3:NO. If universals only exist *in* things, but can't be *in* multiple things at once... then each "instance" is just its own thing, not a shared universal. Points firmly towards the "just two similar things" camp (Q5).

  ---

  **For the "JUST TWO SIMILAR THINGS" Path:**

  **Q5:** If there's no single shared "Redness," is the similarity between the two apples (their both being red) fully explained by **exact resemblance**? (Meaning their individual rednesses are perfect copies of each other).

  *   **YES, exact resemblance is enough:** Go to Q6.
  *   **NO, resemblance alone isn't sufficient:** Go to Q7.

  **Q6:** What *are* the individual rednesses in each apple?

  *   **They are unique, particular property-instances:** **≈ Trope Nominalism** (Only particular redness-tropes exist; similarity is primitive or based on resemblance).
  *   **They are just the apples themselves being members of the same class (the class of red things):** **≈ Class Nominalism** (Properties are just sets/classes; similarity is membership in the same set).

  **Q7:** If resemblance alone isn't sufficient, is the similarity/grouping ("red things") fundamentally **mind-dependent**? (Does it depend on how minds categorize things?)

  *   **YES, it's a mental grouping:** Go to Q8.
  *   **NO, it's not mind-dependent:** **→ ???** *Diagnosis:* Tough spot! If you deny a shared universal *and* deny resemblance is enough *and* deny mind-dependence... what's left to ground the similarity? Might point to a very sparse ontology or a unique take needing more explanation.

  **Q8:** Does this mind-dependent grouping depend on **actual human perceptual habits and psychology**, or on an **ideal, rational scheme** (like how a perfect reasoner *would* categorize)?

  *   **Actual human perception/psychology:** **≈ Conceptualism (Perceptual)** (Properties are human mental concepts based on how we experience the world).
  *   **Ideal rational scheme:** **≈ Conceptualism (Rational)** (Properties are concepts grounded in an objective, ideal structure of rationality, not contingent human minds).

  ---

  **Bonus Node: Artifacts vs. Natural Kinds (Applies to ANY path!)**

  **Q9:** Does the property "being-a-chair" work **in the exact same fundamental way** as the property "being-red"? (Or is there a difference in how functional/artifact properties relate to objects vs. color/natural properties?)

  *   **YES, fundamentally the same:** (Your chosen path above applies equally to chairs and redness).
  *   **NO, they work differently:** *Diagnosis:* This suggests you might think properties like colors are more "in the object" (maybe realist or resemblance-based) while functional properties like "chair" depend more on human intention/use (more conceptualist). Most standard positions hold they work the same way, but this highlights a potential complexity!

  ---

  **Tree Summary:**

  1.  **Shared Thing?** (Yes -> Q2; No -> Q5)
  2.  **Exist Uninstantiated?** (Yes -> Q3; No -> Q4)
  3.  **Multiply Located?** (Yes -> **Plato**; No -> *Empty*)
  4.  **Multiply Located?** (Yes -> **Aristotle**; No -> *Empty*)
  5.  **Resemblance Enough?** (Yes -> Q6; No -> Q7)
  6.  **Nature of Similarity?** (Tropes -> **Trope Nom.**; Classes -> **Class Nom.**)
  7.  **Mind-Dependent?** (Yes -> Q8; No -> *Trouble!*)
  8.  **Type of Mind-Dependence?** (Human -> **Concept (Perceptual)**; Ideal -> **Concept (Rational)**)

  **Key Empty Spots:**  
  *   **Q3:NO / Q4:NO:** Trying to have a "shared thing" that can't exist alone *and* can't be shared (multiply located) is incoherent. It collapses into particularism (Q5).
  *   **Q7:NO:** Denying all three (shared thing, sufficient resemblance, mind-dependence) leaves the grounding of similarity deeply mysterious. Needs a very novel solution.

  Use this to sort yourselves out based on your gut answers! Where do you land? Does the chair question shake things up?
