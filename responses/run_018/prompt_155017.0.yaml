  ## A Toast to Dr. Alistair Fenwick: Thirty Years of Listening to the Room

  [Raise glass] Ladies, Gentlemen, Colleagues, Friends, and most importantly, Alistair’s wonderful family – thank you all for being here to celebrate a truly remarkable career. Thirty years! Guiding the Sampling Methodology Unit of our National Statistical Office is no small feat. But Alistair, your journey didn’t stop at ensuring our surveys truly reflected the nation. In these final chapters, you took that profound understanding of *how* we listen to people into a fascinating new arena: the design of citizens’ assemblies.

  Now, I know looking around this room, we’ve got a rather splendid mix tonight. Half of you could probably hold forth for hours on the intricacies of sortition, lottocracy, descriptive versus epistemic representation… [*Wink at the theorists*]. The other half – dear family, cherished retired fieldworkers who walked the streets gathering data, valued local officials – might just be wondering what on earth those words mean! Fear not. At its heart, what Alistair has dedicated his professional life to is something beautifully simple, yet incredibly profound: **how do we genuinely hear the wisdom of a whole society?**

  Alistair’s work in sampling was always about finding the signal in the noise. Not just counting heads, but ensuring every relevant voice – north or south, young or old, urban or rural – had its *proper chance* to be counted in the mix. It wasn't about finding the single perfect spokesperson; it was about constructing a miniature, authentic echo of the whole.

  This is precisely what drew him, with that characteristic sharp intellect and healthy scepticism, to citizens’ assemblies chosen by lot. He saw the potential. But let’s be clear – and Alistair would insist on this – he hasn’t spent the last few years proselytising for handing over Parliament to randomly selected juries! [*Nod to Alistair, affectionate smile*]. His insight, forged in the crucible of rigorous statistics and tempered by deep practical experience, is far more subtle, and perhaps more powerful.

  What Alistair came to understand, and champion with quiet conviction, is this: **When you gather a group truly chosen at random, within carefully defined boundaries that reflect important societal strata, something extraordinary happens.** It’s not that this group magically becomes *expert* on nuclear policy or constitutional reform overnight. Goodness, no! But what emerges, uniquely, is a form of *collective sense-making*.

  This isn't about dismissing expertise – Alistair deeply respects knowledge. It’s about recognising a fundamental human truth. Experts, brilliant as they are, tend to move in similar circles, read similar journals, share similar assumptions. They can develop, quite understandably, shared blind spots – what Alistair might gently call "correlated errors." They might miss the question the bus driver sees, or the nuance the care worker understands instinctively.

  A well-constructed random sample within strata, however? It brings together the bus driver *and* the physicist, the care worker *and* the software engineer, the farmer *and* the teacher. It forces perspectives to collide, assumptions to be challenged not by argument, but simply by the lived reality sitting across the table. **It creates a space where the distributed knowledge, the quiet intelligence, the unspoken experiences woven through our entire society, actually get a chance to surface and interact.** It’s a form of collective cognition that even the most meritocratic panel, drawn from familiar pools of talent, can systematically struggle to replicate.

  That’s Alistair’s quiet revolution. Not a call to replace experts, but a powerful method to *complement* them. A way to ensure that the complex, often messy, wisdom inherent in a whole population isn’t just accidentally overlooked because the usual networks see the same blind spots. It’s about using the disciplined randomness he mastered for statistics to create a vital listening device for democracy itself.

  For thirty years, Alistair taught us how to listen *accurately*. In his final act, he’s shown us how to listen *differently*, and perhaps more deeply. He leaves us not with a blueprint for utopia, but with a powerful, practical tool: a profound respect for the unexpected insight that emerges when we give genuine, structured chance a seat at the table.

  Alistair, your legacy isn’t just in the impeccable surveys you oversaw, or the assemblies you helped design. It’s in changing how we *think* about gathering collective understanding. You’ve shown us that within a truly representative room, chosen with care and randomness, lies a unique kind of intelligence – one we desperately need. It’s been the honour of a lifetime to work alongside such a sharp, thoughtful, and fundamentally decent man.

  So, to Dr. Alistair Fenwick: For thirty years of dedication, for your unwavering intellectual integrity, and for reminding us all of the quiet wisdom found in a truly random encounter – may your retirement be filled with joy, discovery, and perhaps just a little less statistical analysis! [*Smile*] To Alistair!

  [**Raise glass high**] **To Alistair!**
