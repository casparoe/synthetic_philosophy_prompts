answer: |-
  Interlocutor, your objection conflates material scale with political structure. The reference class *must* be restricted to continental hegemons because maritime republics (Venice, Dutch Republic) and smaller federations (Switzerland) lack comparable systemic inertia and existential exposure to cascading institutional failure. When a superpower's core economic engine—human labor—faces simultaneous depletion by demographic collapse *and* disruption by autonomous production, the required recalibration of fiscal/military/social systems exceeds any historical precedent of peaceful adaptation. Small polities can pivot; empires fracture. Your cited "adapters" never managed reserve currencies or global security commitments while undergoing such dual pressure. Structural scale isn't gerrymandering—it's the defining constraint.

  On institutional exceptionalism: every collapsing hegemon in our reference class (e.g., Late Roman, Ming, Ottoman) possessed elites who believed in unique "adaptive capacity." We have *zero* empirical cases where constitutional flexibility prevented crisis once fertility fell *beneath replacement* alongside labor-replacing technological shocks. Your appeal to "adaptability" is precisely the inside view we exclude—it's an unfalsifiable narrative until demonstrated *ex post*. The base rate (0% survival) reflects accumulated evidence; conjectures about AI-era exceptionalism are not statistically admissible counter-evidence. Judgment applies in class *construction*, not in overriding its outcomes with institutional just-so stories. The base rate stands.
