answer: |-
  Your framing is precise and targets a genuine fault line in illusionism that remains unresolved despite standard maneuvers. Let's dissect the conceptual geography without premature resolution, honoring the tension you've identified.

  ### Core Distinction: Ontological vs. Epistemic Illusionism
  1. **Ontological Illusionism (Hallucinatory Model)**  
     - **Metaphysical Claim:** Phenomenal properties *do not exist* in any form—not as physical, functional, emergent, or otherwise. They are *strictly illusory*.  
     - **Misrepresentation Mechanism:** Introspection generates a *de novo* error, akin to hallucination. It projects properties (e.g., "raw feels") with no corresponding reality, physical or functional.  
     - **Consequence for the Hard Problem:** The explanandum vanishes. There is nothing to explain beyond why brains generate persistent non-veridical representations.  

  2. **Epistemic Illusionism (Misattribution Model)**  
     - **Metaphysical Claim:** Phenomenal properties *exist* as physical/functional properties of neural states, but introspection systematically *misdescribes* their nature (e.g., representing complex relational dynamics as simple, intrinsic qualia).  
     - **Misrepresentation Mechanism:** Introspection accesses real properties but mischaracterizes their ontology—like mistaking a distributed neural pattern for a "homogeneous mental paint."  
     - **Consequence for the Hard Problem:** Modified hard problem: Why do physical properties *that are phenomenal* reliably induce this specific misrepresentation?  

  ### Does Illusionism Require the Ontological Reading to be Substantive?
  **Yes**, for three reasons:  
  - **Metaphysical Substance:** Only ontological illusionism denies the *existence* of phenomenal properties. Epistemic illusionism concedes their existence (albeit physical) and thus collapses into a variant of **reductive physicalism** (e.g., a representationalist or functionalist view). The "illusion" is merely perceptual error about underlying properties—not an elimination of the properties themselves.  
  - **Rhetorical vs. Metaphysical:** If illusionism allows phenomenal properties to exist (epistemic reading), its "eliminativism" is rhetorical sleight-of-hand. It solves the hard problem by redefining phenomenality as physical, not by eliminating it.  
  - **The Threat of Triviality:** Epistemic illusionism risks becoming indistinguishable from physicalist views that acknowledge introspective fallibility (e.g., Dennett’s heterophenomenology). The "illusion" label adds no metaphysical content beyond standard physicalism.  

  ### Is Epistemic Illusionism Just Representationalism?
  **Largely, yes.** Representationalism holds that phenomenal character is constituted by representational content. Epistemic illusionism fits neatly: introspection misrepresents physical states as having non-physical qualia. This preserves phenomenality as representational content—a far cry from illusionism’s eliminative ambitions. The epistemic reading thus fails as a distinct *alternative* to physicalism; it **is** physicalism.

  ### Structural Illusionism: A Viable Hybrid?
  You propose: Deny traditional phenomenal properties (intrinsic qualia) but posit "functional-phenomenal hybrids" (FPHs) that introspection misclassifies as purely qualitative.  

  #### The Proposal  
  - **FPHs:** Real, physical-functional properties carrying information-processing roles (e.g., predictive coding states) that *ground* introspective reports.  
  - **Misrepresentation:** Introspection inaccurately attributes "qualitativeness" to these states, masking their functional complexity.  

  #### Challenges to Stability  
  1. **The Hybrid’s "Phenomenal" Aspect:**  
     - If FPHs have *no* qualitative character, they are purely functional. Introspection’s misattribution then reduces to ontological illusionism (hallucinating qualia where none exist).  
     - If FPHs have *proto-phenomenal* character (e.g., "what it’s like" minus intrinsicality), the view risks collapsing into **panprotopsychism** or Russellian monism—not illusionism.  

  2. **Metaphysical Inflation:**  
     - Calling functional states "phenomenal" (even as hybrids) concedes the existence of *something* deserving the label. This resurrects the hard problem: Why do *these specific functional states* ground introspective reports that feel qualitative?  

  3. **Incoherence Test:**  
     - **Scenario:** A perfect neuroscientific description of an FPH includes all its physical/functional properties but omits qualitative character.  
       - If the omission leaves out *nothing real*, FPHs reduce to functional states—endorsing ontological illusionism.  
       - If the omission leaves out *a property*, that property is either qualitative (undermining illusionism) or a non-qualitative "phenomenal" property—a category arguably incoherent without circularity.  

  **Verdict:** Structural illusionism is **unstable**. It either:  
  - Collapses into ontological illusionism (if FPHs lack qualitative character),  
  - Becomes non-illusionist physicalism (if FPHs have attenuated phenomenality), or  
  - Demands a new metaphysical category (e.g., "physical-phenomenal" properties) that invites the very explanatory gaps illusionism aims to dissolve.  

  ### Conclusion: Genuine Tensions, No Clean Resolution
  - **Your premise is sound:** The ontological-epistemic distinction is metaphysically robust and exposes illusionism’s core dilemma.  
  - **Illusionism’s substantiveness hinges on ontology:** To avoid collapsing into physicalism, it must deny *any* instantiation of phenomenal properties—committing to the hallucinatory model.  
  - **Structural illusionism is not coherent:** It cannot simultaneously deny traditional qualia and posit "hybrids" without smuggling in properties that reignite the hard problem.  
  - **Unsettled Frontier:** The tension persists because illusionists (e.g., Frankish) often blend ontological rhetoric with epistemic concessions. This may reflect a deeper instability: Can we *explain* introspective error without positing *something* that is misrepresented? If not, illusionism may be self-undermining—a concern your framing powerfully articulates.  

  This leaves illusionism with a precarious identity: A truly eliminative stance risks explanatory vacuity (how/why do hallucinations arise?), while compromises risk metaphysical surrender. Your distinction reveals why the debate remains heated—and unresolved.
