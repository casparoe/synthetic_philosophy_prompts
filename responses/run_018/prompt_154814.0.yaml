  The challenge is to show that B's branch structure allows CDT to exploit causal efficacy. In B, payment isn't just correlated; it actively neutralizes the threat in the relevant branch. This is different from A, where payment is only evidence of the predictor's past action. The "exactly one" setup means that paying causally ensures safety in the actual world, whereas in A, the causal link is absent. 

