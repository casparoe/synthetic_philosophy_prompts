answer: |-
  Here’s a decision tree taxonomy for the integrity objection ("one thought too many"), structured by concrete commitments rather than labels. Each branch is a question answerable without prior knowledge of philosophical positions, with leaves noting awkward commitments and flagged collapsing nodes.

  ---

  ### **Decision Tree: The Integrity Objection ("One Thought Too Many")**

  #### **1. Is the core problem about the agent's actual reasoning process?**
     - **Yes** → *Problem is in how the agent thinks during action* → Go to **2**  
     - **No** → *Problem is only in how we describe/judge motives after the fact* → **Leaf: Descriptivist**  
       - *Commitment:* What makes an act seem corrupt isn’t faulty reasoning, but describing intimate acts in impersonal terms (e.g., saying "I saved my spouse because of utility").  
       - *Awkwardness:* Must explain why we react negatively to "cold" descriptions even if the agent’s *actual* motives were pure.

  ---

  #### **2. Does the objection apply only to close relationships (e.g., spouses, family)?**
     - **Yes** → *Morally corrupting only in personal bonds* → Go to **3**  
     - **No** → *Applies to all contexts (including roles like doctors/judges)* → **Leaf: Strict Williamsian**  
       - *Commitment:* Any justification beyond direct care/role-duty (e.g., a doctor choosing based on *moral calculus* vs. *medical duty*) corrupts integrity.  
       - *Awkwardness:* Forces condemnation of triage or sentencing as "corrupt" if done for systemic reasons.

  ---

  #### **3. Can utilitarianism avoid the problem with distinct reasoning levels?**  
  *(e.g., "Act instinctively in emergencies, justify rules later")*  
     - **Yes** → *Two-level separation works* → **Leaf: Two-Level Utilitarian**  
       - *Commitment:* Cultivate spontaneous motives (e.g., love) for daily acts, but endorse utilitarianism indirectly.  
       - *Awkwardness:* The "endorsement" layer still demands *ultimate* justification by utility, which may feel alienating.  
     - **No** → *Separation just relocates the problem* → Go to **4**  

  ---

  #### **4. Should institutional roles (doctor, judge) permit calculated reasoning?**  
     - **Yes** → *Personal integrity ≠ institutional duty* → **Leaf: Institutional Separationist**  
       - *Commitment:* Close relationships forbid calculation; institutions *require* it (e.g., triage).  
       - *Awkwardness:* Risks "moral schizophrenia" (e.g., a doctor who sees patients impersonally but demands personal care for family).  
     - **No** → *Calculation corrupts all contexts* → **Leaf: Particularist**  
       - *Commitment:* The mistake is treating reasons as generic. Each act must flow from context-specific motives (e.g., "I saved *my* spouse" not "a spouse").  
       - *Awkwardness:* Hard to explain how to act consistently or justify decisions to others.

  ---

  ### **Ambiguous/Collapsing Nodes**  
  - **Institutional Separationist vs. Two-Level Utilitarian**:  
    Both allow calculation in institutions, but collapse if the separationist *endorses institutions via utility* (then becomes two-level) or if the two-level utilitarian *denies personal calculation is ever acceptable* (then becomes separationist).  
    *Key divider:* Does the agent **personally endorse** the institutional calculus?  
    - *Yes* → Leans Two-Level.  
    - *No* (institutions are a separate normative domain) → Leans Separationist.  

  - **Particularist vs. Strict Williamsian**:  
    Both reject calculation in personal contexts, but collapse if Williamsianism extends to institutions.  
    *Key divider:* Is the objection about **relationships** (Williams) or **context-specific reasons** (Particularist)?  

  ---

  ### **Tree Summary**  
  ```mermaid
  graph TD
  A[Is the problem about reasoning?] -->|Yes| B[Only close relationships?]
  A -->|No| L1(Descriptivist)
  B -->|Yes| C[Can levels fix it?]
  B -->|No| L2(Strict Williamsian)
  C -->|Yes| L3(Two-Level Utilitarian)
  C -->|No| D[Permit calculation in institutions?]
  D -->|Yes| L4(Institutional Separationist)
  D -->|No| L5(Particularist)
  ```

  ### **Key Features**  
  - **Label-agnostic**: Questions target beliefs (e.g., "Should a judge use moral calculus?").  
  - **Awkward commitments**: Expose tradeoffs (e.g., allowing immoral acts for integrity).  
  - **Collapse warnings**: Institutional Separationist/Two-Level Utilitarian and Particularist/Strict Williamsian may overlap contextually.  

  This tree isolates core disagreements while forcing clarity on scope (personal vs. institutional) and solution viability (levels vs. overhaul). Use cases from the seminar (e.g., "Should a firefighter save her own child first?") can slot directly into branches.
