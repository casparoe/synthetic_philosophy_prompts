answer: |-
  **MEMORANDUM**  
  **To:** Faculty Senate Policy Committee  
  **From:** Chair, Policy Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Deliberative Proxy Procedure for General-Education Curriculum Deadlocks  

  ---

  ### **I. Introduction**  
  After thorough deliberation, the Policy Committee recommends **conditional adoption** of the deliberative proxy procedure, subject to stringent structural safeguards. This recommendation balances the need for principled resolution of deadlocked curriculum disputes with democratic accountability and practical feasibility. While the indirect-normativity argument provides a compelling foundation for impartial decision-making, it cannot wholly displace the legitimacy derived from real stakeholders’ lived experiences. The safeguards outlined below ensure the panel’s authority remains tethered to institutional reality.  

  ---

  ### **II. Recommendation & Core Safeguards**  
  **Adopt the procedure, but with the following constraints:**  

  1. **Binding Recommendations Subject to Senate Ratification**  
     - The panel’s recommendations are binding *only* if ratified by a 60% supermajority of the Faculty Senate. This preserves democratic oversight while respecting the panel’s specialized role.  

  2. **Panel Composition & Term Limits**  
     - **Size:** 9 members (3 faculty, 2 students, 2 administrators, 2 external academic experts in curriculum design/ethics).  
     - **Selection:**  
       - Faculty elected by Faculty Senate; students by student governance body; administrators by University Council; external experts jointly appointed by Senate and Provost.  
     - **Terms:** 3-year staggered terms (no consecutive reappointment). Ensures rotation and mitigates entrenchment.  

  3. **Practical Veto Mechanism**  
     - If the Faculty Senate rejects a panel recommendation, it must articulate *specific, practical grounds* (e.g., "implementation would cause disproportionate harm to [group]," "resource constraints render it infeasible," "conflicts with core institutional values"). The panel must then revise its recommendation to address these concerns.  

  ---

  ### **III. Addressing Indirect Normativity & Democratic Legitimacy**  

  #### **A. Authority of Idealized Norms**  
  The indirect-normativity argument posits that a norm’s authority stems from its acceptability under conditions of full information and impartiality. We acknowledge that this approach:  
  - **Strengthens objectivity** by filtering out strategic bargaining, misinformation, or power imbalances.  
  - **Elevates shared principles** (e.g., academic rigor, equity) over factional interests.  

  **However**, legitimacy requires more than rational coherence. A norm must also:  
  - **Resonate with communal values** embedded in the university’s mission.  
  - **Remain actionable** without inflicting intolerable burdens.  
  A norm justified abstractly but unworkable concretely lacks *practical authority*.  

  #### **B. Rebutting the Democratic-Legitimacy Objection**  
  Critics rightly argue that idealized agents’ "agreement" cannot bind real stakeholders who never consented. Our safeguards address this by:  
  - **Embedding the panel within existing governance structures** (Senate ratification).  
  - **Requiring the panel to justify decisions in accessible, contextual terms**—not solely abstract reasoning.  
  - **Granting stakeholders recourse** via the practical veto. This ensures the panel’s output is tested against real-world constraints, preventing a "tyranny of the ideal."  

  **This is not populism but institutional fidelity**: The university’s mission requires decisions to align with both principles *and* the community’s capacity to enact them.  

  ---

  ### **IV. Procedural Framework & Timeline**  

  #### **Panel Protocol**  
  1. **Briefing Phase**: Stakeholders submit evidence of impacts (pedagogical, financial, equity-related).  
  2. **Deliberation Phase**: Panel conducts anonymized debates focused on:  
     - *Common interests* (e.g., student success, institutional reputation).  
     - *Universality* ("Would this norm bind fairly if roles were reversed?").  
     - *Feasibility* (resources, timelines).  
  3. **Output**: Recommendations include:  
     - The norm adopted.  
     - A dissent memo (if applicable).  
     - Plain-language rationale addressing practical implications.  

  #### **Implementation Timeline**  
  - **Months 1–3**: Draft panel bylaws; appoint inaugural members.  
  - **Month 4**: Training on impartiality protocols & conflict resolution.  
  - **Months 5–12**: Pilot phase (test on 1–2 low-stakes disputes).  
  - **Month 13**: Review by Senate; amendments if needed.  
  - **Ongoing**: Annual review of panel decisions by ombudsman for fairness.  

  ---

  ### **V. The Judgment Threshold**  
  The critical point where **judgment supersedes principle** arises in defining "practical intolerability" during Senate ratification. No procedure can fully codify when a norm becomes unlivable—e.g., a curriculum change that is pedagogically sound but would exacerbate inequities due to *current* resource gaps. Senators must weigh:  
  - The severity of harm vs. the principled value of the norm.  
  - Whether objections reflect self-interest or communal welfare.  
  This demands contextual wisdom, not mechanical rule-following.  

  ---

  ### **VI. Conclusion**  
  Adopting the deliberative proxy with robust safeguards leverages indirect normativity to resolve deadlocks impartially while tethering it to institutional reality. The procedure elevates reason without enshrining it as sovereign, ensuring that idealized coherence serves—rather than overrides—the community it must govern.  

  **Vote:** Adopt as amended (7-2).  

  ---  
  **Endorsed,**  
  Chair, Policy Committee
