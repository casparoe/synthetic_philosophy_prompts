prompt: |-
  As a journalist covering the intersection of science and moral philosophy, I have been discussing with editors and researchers how institutions can distinguish a legitimate value preference from a hidden cognitive bias, and my own intuitive verdicts on concrete cases have settled into a pattern I cannot formalize without help. Here are my judgments. A university admissions officer who favors rural applicants because she herself grew up in a small town and feels an unexamined affinity for them: that is bias, even if the outcome improves geographic diversity. A climate researcher who declines to fly to international conferences not on carbon-accounting grounds but because she finds air travel aesthetically wasteful and spiritually flattening: that is a defensible preference about the life she wants to model, not a bias, even though it limits her professional reach. A criminal-court judge who consistently chooses restorative sentences over carceral ones because she holds that human dignity is inviolable and punishment is a moral error: that is a principled commitment, not a bias, despite its correlation with her religious formation. By contrast, a public-health official who rejects vaccine mandates because she finds the rhetoric of bodily autonomy poetically compelling and metaphysically resonant, irrespective of epidemiological modeling: that is a bias disguised as taste. An art curator who removes violent imagery from a public exhibition because she personally finds it viscerally distasteful: bias. But a curator who removes the exact same imagery because she judges that the institutional purpose of this particular gallery is to serve as a sanctuary for collective emotional repair, and violent imagery undermines that purpose: a preference legitimately anchored in role-defined values. The case I keep reversing on is an AI-safety reviewer who rejects predictive-policing algorithms not on the basis of documented disparate-impact studies but because she finds the very concept of algorithmic prediction metaphysically ugly and aesthetically alien to the kind of social world she wishes to inhabit. I want a principle precise enough to deliver all six settled verdicts, to explain whether this reviewer case is closer to the climate researcher or to the public-health official, and to identify honestly which of my judgments must be overturned if the principle is to remain coherent. Please take a committed position: state the principle definitively in your opening sentence, then defend it with reasoning that shows exactly which cases it saves and which it sacrifices, with no preamble and no restatement of the problem.
reasoning: |-
  Okay, the user presents a complex ethical dilemma about distinguishing legitimate value preferences from cognitive biases across various professional scenarios. They've provided six clear case judgments and one unresolved case about an AI-safety reviewer, seeking a unifying principle that either validates all their existing verdicts or forces revision of some. 

  First, I notice the user is a science-morality journalist who's already done significant field work - their cases show sophisticated pattern recognition but frustration at being unable to formalize it. The emotional subtext suggests intellectual restlessness: they want either confirmation that their intuitions cohere or courageous contradiction that forces growth. This isn't someone seeking easy answers.

  Examining their cases, three patterns emerge: 
  1) Personal affinity or discomfort often signals bias (admissions officer, art curator removing violent art due to personal distaste) 
  2) Role-consistent value application signals legitimacy (judge's sentencing, curator's sanctuary rationale) 
  3) But aesthetics complicate things - the climate researcher's flight refusal is accepted while the health official's autonomy rhetoric is rejected. 

  Ah! The hinge seems to be whether aesthetic language masks or manifests core values. The climate researcher models values through action ("life she wants to model"), while the health official uses aesthetics to bypass evidence ("irrespective of epidemiological modeling"). 

  For the AI reviewer case, the key is whether "metaphysically ugly" reflects a coherent vision of social good like the climate researcher, or functions as evasion like the health official. Since the reviewer rejects algo-policing based on envisioned social world rather than impact studies, this parallels the climate researcher's positive modeling. Therefore: legitimate preference. 

  But consistency demands sacrifice: the public health case must be reclassified as legitimate preference under this framework. Their bodily autonomy stance, while poorly evidenced, does constitute a value choice about societal organization. If I defend this reclassification - arguing that even misguided value claims deserve recognition as such rather than dismissal as bias - the principle holds. 

  User's possible discomfort point: They might resist elevating the health official's position to "legitimate." But the principle treats all role-grounded value assertions equally; evidentiary failures make the position bad policy, not cognitive bias. This distinction between epistemic failure and bias is crucial. 

  Final structure: State principle upfront, then walk through each case showing how the taxonomy applies, explicitly overturning the public health verdict. For AI case, emphasize how "wished-for social world" parallels climate researcher's value-modeling. No fluff - they want surgical precision.
answer: |-
  **Legitimate value preferences are those grounded in role-relevant, explicitly articulated normative commitments of an institution or profession, while cognitive biases manifest as personal inclinations misrepresented as institutional values or universal principles.**

  **Reasoning:**  
  *   **Admissions officer:** Her rural preference stems from *personal affinity* (unexamined bias), not the university's educational mission. Geographic diversity may result, but the *driver* is irrelevant personal history. **→ Bias.**  
  *   **Climate researcher:** Her flight refusal expresses a *professional modeling choice* about scientific practice aligned with environmental ethics—a core normative commitment of her field. **→ Legitimate preference.**  
  *   **Judge:** Restorative justice reflects a *role-defined normative commitment* (interpreting law through dignity/punishment ethics), not personal whim. Religious correlation doesn’t negate institutional anchoring. **→ Legitimate preference.**  
  *   **Public-health official:** Rejecting mandates based on "poetic" bodily autonomy *ignores epidemiology*—the core institutional value. Personal aesthetic preference overrides professional duty. **→ Bias.** *(This verdict is overturned under my principle; see sacrifice below.)*  
  *   **Art curator (personal distaste):** Removal based on *subjective discomfort* misuses institutional authority. **→ Bias.**  
  *   **Art curator (institutional purpose):** Removal serves the *explicitly stated normative function* (sanctuary for emotional repair) of that specific institution. **→ Legitimate preference.**  

  **AI-safety reviewer case:** This is **legitimate preference**, aligning with the climate researcher. Her rejection is based on a *normative vision for social structures* ("kind of social world she wishes to inhabit"), which is a core value commitment in AI ethics. Like the climate researcher modeling a low-impact life, this is role-relevant value assertion, not disguised personal bias. It parallels the judge's commitment to dignity over punishment—both stake professional judgment on foundational ethics.  

  **Sacrifice required for coherence:** Your verdict on the **public-health official must be overturned**. Under this principle, her stance—while epistemically flawed—is a *value preference about bodily autonomy* (a societal norm), not a cognitive bias. It fails as policy due to ignoring evidence, but the *basis* is a contested social value, not a hidden psychological distortion. Her error is privileging one value (autonomy) over another (public health) without evidence, not bias masquerading as taste. To call it "bias" inconsistently penalizes value assertions you dislike, while accepting others (climate researcher, judge). Coherence demands treating all role-grounded value claims equally, even misguided ones.  

  **Key distinctions:**  
  - **Role-relevance:** Does the value connect to institutional/professional purpose? (Yes: climate researcher, judge, curator 2, AI reviewer. No: admissions officer, curator 1).  
  - **Articulation:** Is the value framed as a *normative commitment* (legitimate) or a *personal reaction* (bias)?  
  - **Universality vs. Particularity:** Biases disguise personal tastes as universal (admissions officer conflates her history with merit). Legitimate preferences own their particularity (climate researcher: "life *I* want to model").  
  - **Evidence-dependence:** Values needn't defer to empiricism (judge, AI reviewer), but biases *evade* counter-evidence (health official ignores modeling; admissions officer ignores non-rural merits).  

  **Conclusion:** The AI reviewer’s stance is legitimate like the climate researcher’s—both assert professional visions for human flourishing. Your public-health verdict is the sacrificial inconsistency: rejecting mandates on autonomy grounds is poor policy but a value preference, not bias. Upholding all other verdicts requires accepting that officials can hold ill-informed values without cognitive bias.
