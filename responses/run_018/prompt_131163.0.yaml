answer: |-
  ### Restatement of von Neumann’s Position in Archival Vocabulary  
  Von Neumann’s core argument is that a technology achieves true long-term survivability only if:  
  1. **Self-Contained Specification**: The artifact includes a complete, immutable description of itself (a "blueprint") with guaranteed fixity and provenance.  
  2. **Embedded Executor**: The artifact also contains an execution environment capable of interpreting the blueprint *without external dependencies*. This executor must autonomously handle:  
     - **Renderability**: Converting the stored description into a functional instance.  
     - **Self-Correction**: Detecting and repairing errors in *both* the blueprint and its own interpretive logic.  
  3. **Substrate Unity**: The blueprint and executor must coexist in the same physical/digital medium, ensuring no separation between data and the mechanism required to activate it.  

  In archival terms: A preservation object must bundle its *preservation master* (the blueprint) with a *self-sustaining emulator* (the interpreter) that can execute the master, verify its integrity, and repair itself and the master against bit-rot or obsolescence—all within a single dependency-free package. External format registries, migration tools, or reference environments are excluded; survival relies entirely on internal resources.  

  ---

  ### Residue Report  
  | Von Neumann Element             | Translation Fidelity               | Residue Analysis |  
  |---------------------------------|------------------------------------|------------------|  
  | **Self-Contained Blueprint**    | Clean translation → Preservation master with fixity | Matches archival practice for immutable, well-described artifacts. |  
  | **Interpreter for Execution**   | Distorted translation → Emulator | Archivists assume emulators are *external* (e.g., centralized registries). Von Neumann demands the emulator be *embedded*, which archival science does not require. |  
  | **Self-Correction Capability**  | No direct translation | Archivists rely on migration (planned obsolescence management) or human intervention. Autonomous *internal* error-correction has no equivalent. |  
  | **Substrate Unity**             | Partial distortion → Packaging | Archivists separate data from execution environments (e.g., OAIS model). Von Neumann’s physical unity has no counterpart; digital archives abstract hardware. |  
  | **No External Dependencies**    | No expression | Archivists *embrace* dependency chains (format standards, emulation libraries). Von Neumann’s "closed system" requirement conflicts fundamentally. |  

  **Key Residue Insight**: The unresolvable gap is **embedded interpretive closure**—von Neumann’s insistence that the interpreter *repair itself without external tools*. Archivists address errors via migration (altering the artifact) or external emulation (relying on future infrastructure). This residue reveals a *conceptual gap* in archival science: it assumes civilization-scale infrastructure persistence, while von Neumann’s model targets *infrastructure collapse*. His claim is precise but describes a scenario archivists deliberately avoid (total loss of supporting systems).  

  ---

  ### Survivability Gap: Archival Restatement & Analysis  
  **The Tension Restated**:  
  - **Minimal-Dependency Strategy** (e.g., format normalization, static packaging): Maximizes fixity and reduces failure points but sacrifices functionality. A PDF/A preserves text but loses interactive features; it cannot "self-correct" if rendering fails.  
  - **Rich-Emulation Strategy** (e.g., VM-based environments): Maintains complex behaviors but depends on deep dependency chains (CPU architectures, OS layers). Each dependency adds a point of potential obsolescence.  

  **Trade-off Assessment**:  
  This gap reveals a **real strategic conflict** beyond fixity vs. accessibility:  
  - **Preservation Depth vs. Resilience**:  
    - *Minimal dependencies* (e.g., plain text) offer high resilience to civilizational disruption but discard self-repair and complex rendering.  
    - *Rich emulation* preserves complexity but requires intact dependency chains—making survival contingent on societal continuity.  
  - **Von Neumann’s Paradox**: Reducing dependencies to zero (e.g., storing machine code on stone tablets) ensures renderability but eliminates error-correction. Archivists face this as:  
    - *Migration*: Changes the artifact to fit new environments (analogous to discarding self-repair).  
    - *Emulation*: Maintains behavior but depends on unvetted future systems (analogous to needing external libraries).  

  **Conclusion**: The gap is irreducible. Archivists prioritize *recoverability* via adaptable strategies within a functioning society; von Neumann prioritizes *autonomy* for societal collapse. The trade-off is strategic: archival science accepts vulnerability to dependency-chain breaks to preserve complexity, while von Neumann’s model sacrifices complexity for existential resilience.  

  ---  
  *Final note: Von Neumann’s framework is a thought experiment for technological *autonomy*; archival practice is a methodology for *continuity*. The untranslatable residue highlights that archival science assumes civilization persists—a philosophical blind spot his work exposes.*
