answer: |-
  ### (a) Exam Question

  **Critically assess whether the 'threshold model' of virtue successfully defends virtue ethics against the situationist challenge.**  

  The *threshold model* proposes that virtues are not global, cross-situational character traits, but rather:  
  1. **Domain-indexed dispositions**: Stable tendencies to act virtuously only within specific situational domains (e.g., "courage-in-combat" or "honesty-in-academic-work").  
  2. **Threshold-triggered**: Manifest only when context-sensitive demands exceed a minimal threshold (e.g., honesty activates when stakes are moderate, not trivial or extreme).  
  3. **Governed by meta-cognition**: Activated by a second-order capacity to recognize *which* domain is relevant and *whether* the threshold is met.  

  Evaluate this model’s viability as a response to situationism (which claims empirical evidence shows behavioral inconsistency across situations undermines traditional virtue concepts). Specifically, address:  
  1. Does the model preserve the idea that virtue is a stable feature of *character* (rather than merely situation-specific behaviors)?  
  2. Is the second-order meta-cognitive capacity itself vulnerable to situationist debunking as a purported global trait?  
  3. Can the model offer a non-circular account of moral education and character improvement?  

  ---

  ### (b) Model Answer (≈750 words)  

  The threshold model aims to reconcile virtue ethics with situationist psychology by redefining virtues as context-bound dispositions. While it initially deflects the situationist critique by accommodating behavioral inconsistency, it ultimately fails to preserve a robust conception of character, exposes its meta-cognitive core to situationist threats, and cannot explain moral education non-circularly.  

  **1. Character Preservation: Superficial Rescue, Substantive Surrender**  
  The model claims to preserve character stability by anchoring virtues to domains rather than universal contexts. Honesty-in-business might remain consistent across *business* scenarios, satisfying situationism’s demand for domain-specific evidence. However, this redefines character as a fragmented collection of micro-traits. Traditional virtue ethics (e.g., Aristotelian) posits virtues as unified dispositions reflecting practical wisdom (*phronesis*) that permeate all life domains. The threshold model reduces character to a patchwork of situationally cued reflexes. While it technically retains "stability" within domains, it abandons the normative core of character as an *integrative* source of identity and agency. Virtue becomes a label for reliable behavior in narrow contexts—not a holistic feature of the self.  

  **2. Meta-Cognitive Vulnerability: The Trojan Horse**  
  The second-order capacity—which identifies relevant domains and thresholds—is positioned as the unifying engine of virtue. Yet this meta-trait must itself be cross-situationally consistent to function globally. If this capacity is situationally fragile (as situationism predicts), the entire model collapses. For example, stress or fatigue could impair an agent’s ability to recognize that a "financial negotiation" domain requires honesty thresholds, leading to context-inappropriate dishonesty. Situationists like Doris would argue this mirrors the very inconsistency that doomed global traits: if the *selector* of virtues is context-dependent, virtue activation becomes as erratic as the behaviors situationism critiques. Defenders might argue meta-cognition is a skill, not a trait—but skills still require stable capacities. Either way, the model relocates the problem of global consistency rather than solving it.  

  **3. Moral Education: Circularity and Bootstrapping**  
  The model struggles to explain character development non-circularly. Moral education aims to cultivate virtues and refine sensitivity to thresholds/domains. But if virtues are domain-indexed and meta-cognition is nascent, how do learners *initially* recognize domains or calibrate thresholds? Instruction must presuppose the very capacities it seeks to build. Consider teaching "compassion-in-healthcare": Students must already grasp the healthcare domain’s normative demands to activate compassion thresholds during training. Yet without prior training, they lack this framework. Appeals to "proto-virtues" or incremental feedback merely mask the circularity: feedback requires recognizing *when* a domain-threshold was missed, which relies on the underdeveloped meta-capacity. Unlike Aristotelian habituation—where repeated action builds integrated character—the threshold model cannot bootstrap its own core mechanism.  

  **Conclusion: Dissolution over Defense**  
  The threshold model ingeniously accommodates situationist data but at too high a cost. It saves virtue from empirical refutation only by abandoning its philosophical substance. Character fractures into domain-locked behaviors, the meta-cognitive safeguard invites situationist debunking, and moral education lacks a foundation. While it highlights the context-sensitivity of virtue, it cannot reconstruct virtue ethics as a coherent alternative to situationism. The model dissolves virtue into validated behavioral patterns rather than defending it as a resilient architecture of the self.  

  ---

  ### (c) Marking Scheme (Total: 20 Points)  

  #### Must-Hit Argumentative Moves:  
  1. **Domain-specificity vs. character integrity (4 pts)**  
     - *A Answer:* Explicitly contrasts the model’s *fragmented* character with traditional *unified* virtue; argues localization evacuates character of normative depth.  
     - *B Failure:* Describes domain-indexing without probing its implications for character ontology; treats consistency-within-domains as sufficient.  

  2. **Meta-cognition as a global trait vulnerability (5 pts)**  
     - *A Answer:* Demonstrates that the meta-capacity *must* function globally to unify virtues, then applies situationist critique directly to it.  
     - *B Failure:* Notes the meta-trait exists but doesn’t interrogate its consistency; or asserts it’s "skill-based" without showing why this escapes situationism.  

  3. **Non-circular moral education (5 pts)**  
     - *A Answer:* Identifies the bootstrapping problem—domain/threshold recognition presupposes the capacity being taught—and rejects evasion via "proto-virtues."  
     - *B Failure:* Describes education procedurally (e.g., "practice in domains") without confronting circularity; appeals vaguely to "experience."  

  4. **Dialectical engagement with situationism (3 pts)**  
     - *A Answer:* Concedes the model *initially* addresses behavioral inconsistency but shows how it relocates (or amplifies) situationism’s core challenge.  
     - *B Failure:* Treats situationism as fully resolved by domain-indexing; or ignores situationism after introductory remarks.  

  5. **Synthesis: Dissolution vs. defense (3 pts)**  
     - *A Answer:* Concludes the model "saves" virtue only by stripping it of its traditional meaning (holism, educability, agency).  
     - *B Failure:* Lists pros/cons without resolving the tension; asserts personal preference.  

  #### Grading Note:  
  - **A Range (17–20):** Hits all moves with precision, anticipates counterarguments (e.g., "Isn’t fragmentation realistic?"), and maintains critical focus on the *normative cost* of localization.  
  - **B Range (14–16):** Addresses moves descriptively but lacks incisive evaluation (e.g., explains the threshold model without probing its compromises).  
  - **C Range (10–13):** Omits 1–2 moves; conflates the model with Aristotelianism/situationism; overly summary-heavy.  
  - **D/F (≤9):** Fails to engage the threshold model; reverts to generic summaries of virtue ethics/situationism.
