prompt: |-
  hey im doing this essay for my world history elective on whether criteria of authenticity can ever actually settle who the historical jesus was, and im lost in the weeds. every article just lists "multiple attestation" and "embarrassment" like thats enough. i need the full spec.

  write the desiderata: what any adequate set of criteria for deciding which sayings or deeds of jesus are historically authentic must deliver to count as solving the problem. for each requirement, give the case that motivates it, flag if its non-negotiable vs just a camp preference, and keep the distinctions straight — especially between "not invented by the early church" and "totally alien to 1st century judaism." include handling the fact that all four gospels are post-easter and confessional, being consistent with what we know about galilee social dynamics, and two extra conditions im injecting: the counterfactual stability problem (the result shouldnt reverse if a new non-canonical fragment turned up tomorrow) and the eschatological noise floor (since apocalyptic expectation was normal in that context, criteria that filter out "too weird" end-times talk risk deleting the real person instead of the legend). also tell me if some subset is jointly unsatisfiable — my guess is that demanding both rigorous multiple attestation and full dissimilarity from church theology cant both hold, because our independent sources are basically church texts anyway. then identify which single desideratum knocks out the most popular theories. keep the weight on the criteria and why they matter, not on grading every scholar.

  please dont include bibliographies or reading lists — i cant check them without web access and this is for a model that shouldnt need them either. also dont cite page numbers i have to verify.

  Finish with a one-sentence summary on its own line starting with "Bottom line:"
