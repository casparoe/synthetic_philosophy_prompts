answer: |-
  Bottom line: The lottery and preface paradoxes reveal a unified structural asymmetry where rational acceptance thresholds diverge for individual claims versus collective aggregates, driven by context-dependent practical stakes and scope, not parallel failures.

  Rational acceptance is contextually indexed: withholding belief that a specific lottery ticket loses is required because the residual risk of error (however minute) exceeds the practical stakes associated with individual acceptance (e.g., acting as if *this* ticket is definitely worthless), imposing a high per-instance justification threshold. Conversely, accepting the collective claim "some ticket wins" (equivalent to "not all lose") is mandated because the aggregate justification (probability approaching 1) overwhelmingly surpasses a distinct, lower *global* threshold tied to the overall decision problem's scope (e.g., planning based on the near-certain outcome); denying this aggregate truth imposes unacceptable practical costs given its virtual certainty. The preface paradox mirrors this: acceptance of each individual claim meets a contextually sufficient per-claim threshold, but the aggregate risk of at least one error necessitates withholding belief in the universal conjunction "all my claims are true," as this demands a near-impossible *collective* certainty threshold. Justification aggregates non-uniformly across disjoint domains due to differing practical demands. (178 words)
