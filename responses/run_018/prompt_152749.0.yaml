answer: |-
  The pattern you describe is a recognized but under-theorized dialectical phenomenon in non-reductive physicalist responses to mental causation. It lacks a standard name but can be precisely characterized as **Contextual Causal Reification (CCR)**. Below is a systematic analysis:

  ### Core Structure of CCR
  1. **Defensive Mode** (Metaphysical Strictness):  
     When facing exclusion pressure, mental properties (M) are relegated to *causal relevance*:  
     - M is constitutively dependent on physical realizer P  
     - M "makes a difference" via counterfactual/explanatory relations  
     - M lacks *causal efficacy* (productive/generative power)  

  2. **Explanatory Mode** (Practical Licentiousness):  
     In explanatory contexts, M is treated as having *causal efficacy*:  
     - M is cited as the direct cause (e.g., "Belief B caused action A")  
     - No reference to P’s causal primacy or derivative status  
     - Explanatory weight mirrors robust causation  

  3. **Unacknowledged Shift**:  
     - No meta-theoretical justification for the transition  
     - The inconsistency is masked by preserving the *language* of causation across contexts  

  ### Distinguishing from Existing Concepts
  | Concept                  | How CCR Differs                                                                 |
  |--------------------------|---------------------------------------------------------------------------------|
  | **Equivocation**         | Not ambiguous term usage; *same causal vocabulary* is applied with shifted metaphysical commitments. Distinction is systematic (defense vs. explanation) rather than random. |
  | **Motte-and-Bailey**     | No indefensible "bailey" abandoned under pressure; *both positions are retained* and deployed strategically. The "strict" view (relevance) isn’t merely a retreat position. |
  | **Explanatory Pluralism**| Pluralism openly endorses multiple *legitimate* causal stories. CCR *denies* efficacy in one context while *presupposing* it in another without reconciliation. |
  | **Explanatory Exclusion**| Kim’s concern is exclusion *of* mental causes. CCR is a *response* to exclusion that reintroduces efficacy covertly. |
  | **Quasi-Causation**      | (e.g., Yablo’s proportionality) Explicitly defines a *consistent* middle-ground. CCR oscillates between two *inconsistent* causal roles. |

  ### Boundary Conditions
  - **Applies Primarily to Realization-Based Non-Reductivism**:  
    Relies on realization relations to deflect exclusion. The distinction between relevance/efficacy creates the dialectical space for CCR.  
  - **Emergentism Avoids CCR**:  
    Genuine emergentists (e.g., classical emergentism) assert *sui generis* downward causation, rejecting physical closure. No defensive downgrade to "relevance."  
  - **Interactionist Dualism Incompatible**:  
    Mental efficacy is explicit and undiluted; no need for a relevance/efficacy split.  

  ### Diagnosis: Dialectical Double-Counting
  CCR constitutes a **failure of metaphysical coherence** disguised as theoretical flexibility. It attempts to "have it both ways":  
  - Leverage physicalism’s compatibility with causal closure (via relevance)  
  - Retain folk-psychological explanatory power (via reified efficacy)  

  The unacknowledged shift constitutes **theoretical bad faith**—using a distinction to solve a metaphysical problem while violating its constraints in practice. This is distinct from pragmatic pluralism, which transparently adopts different stances for different purposes.

  ### Test Case: When CCR Fails
  - **Strict Epiphenomenalism**: Consistently denies efficacy *everywhere*; no explanatory reversion.  
  - **Type Identity Theory**: Mental properties *are* physical properties, so efficacy is unambiguous.  
  - **Eliminativism**: Rejects mental properties entirely, eliminating the tension.  

  ### Conclusion
  **Contextual Causal Reification** names the systematic, unacknowledged oscillation between assigning mental properties derivative causal relevance (under metaphysical scrutiny) and robust causal efficacy (in explanatory practice). Its hallmark is the *invisible transition* between incompatible causal ontologies within a single theoretical framework—a dialectical sleight-of-hand that exploits the gap between metaphysical defense and explanatory utility. This pattern is endemic to realization-based non-reductive physicalism and signals a deeper instability in the project of reconciling mental causation with physical closure.
