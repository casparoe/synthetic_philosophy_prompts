prompt: |-
  I'm running a small philosophy discussion group for grad students in other fields (mostly comp sci and bio) and next week I want to do one session on the moral equality of combatants in just war theory. I know the basic idea — soldiers on both sides have the same right to kill — but I'm not totally clear on the dependancy structure. Can you plan how I should explain it?

  Specifically: what's the order? I think I definately need to start with the distinction between jus ad bellum and jus in bello, but then I'm not sure whether to bring in the symmetry problem before or after we talk about the permission to kill. For the carrying example, I was thinking of using the classic WWII soldier scenario, but I also want to weave in this weird niche case I read about — the 'automated sentry dilemma' where an AI defense system decides to fire on enemy combatants without human risk on either side — to see if it breaks the intuition. Is that a bad idea? What misconceptions will they bring? I'm guessing some will think 'if your cause is just then your soldiers are morally better' and others might confuse equality of combatants with pacifism. Where exactly do I head each one off?

  Also, what's one check question at the end to see if they actually got the symmetry idea rather than just memorizing the slogan? And what should I explicitly say I'm leaving out — maybe the revisionist critique that denies the separation — and why? Don't give me readings, just the teaching plan. Oh, and I might have a typo or two since I'm writing this on my phone.
reasoning: |-
  Okay, the user is running a philosophy discussion group for grad students in comp sci and bio. They want to cover the moral equality of combatants in just war theory. Let me start by understanding their main concerns. They mentioned the dependency structure, so I need to outline a logical flow. First, establish jus ad bellum and jus in bello. That's essential because the separation of these two is the foundation of the moral equality idea.

  Next, they're unsure whether to introduce the symmetry problem before or after discussing the permission to kill. I think presenting the symmetry problem after the permission makes sense. Once students grasp that combatants are allowed to kill, the contradiction when both sides have this right becomes clear. That sets up the need for moral equality.

  The user wants to use the WWII soldier scenario and an automated sentry dilemma. The WWII example is classic and effective. The AI case adds a modern twist, especially relevant for comp sci students. I should note that the AI scenario might challenge intuitions about human risk and agency, but it shouldn't break the core principle. Emphasize that the AI acts as an agent of the state, so the same rules apply.

  Misconceptions are a big concern. The user anticipates that some might think a just cause makes soldiers morally better. I need to address this when distinguishing jus ad bellum from jus in bello. Clarify that jus in bello applies regardless of the war's justice. Another misconception is confusing moral equality with pacifism. Highlighting that the equality applies within war contexts, not condemning war itself, should help.

  For the check question, something like the "mirror test" could work. Ask if soldiers on the unjust side have the right to kill. If they understand symmetry, they should say yes. That tests their grasp beyond memorization.

  The user also wants to mention what's left out, like the revisionist critique. Briefly explaining that some philosophers reject the separation of jus ad bellum and jus in bello, but not diving in to avoid complexity. This sets boundaries for the session.

  Considering the audience, comp sci and bio grad students might appreciate the AI example. It connects theory to real-world tech issues. The automated sentry case can spark debate on agency and responsibility, which ties into their fields. That engagement is key.

  I should structure the session step-by-step: start with foundations, introduce permission, present symmetry, resolve with moral equality, then apply examples. Address misconceptions as they naturally come up in each section. Keep the discussion interactive to gauge understanding.

  Finally, the check question and explicitly stating omissions will wrap it up neatly. Making sure the user has a clear plan to handle questions and steer the discussion. They need confidence in the flow to manage the session effectively.
answer: |-
  Here's a structured teaching plan for your session, designed for clarity and engagement with your specific audience, addressing your concerns:

  **Session Title:** The Moral Equality of Combatants: Can Soldiers on Both Sides Be Equally Permitted to Kill?

  **Core Goal:** To understand the *structure* and *justification* for the principle of Moral Equality of Combatants (MEC), its dependence on the Jus ad Bellum/Jus in Bello distinction, and the Symmetry Problem it resolves.

  **Order & Content Flow (90 Min Session):**

  1.  **Foundation: Setting the Stage (15 min)**
      *   **Hook:** "In war, is a soldier fighting for a clearly just cause (e.g., defending against genocide) morally *better* or *worse* than a soldier fighting for an aggressive, unjust cause when they each kill an enemy soldier?"
      *   **Establish Core Distinction:** Clearly define and contrast:
          *   **Jus ad Bellum (Justice *of* War):** Criteria for *starting* a war justly (Just Cause, Right Intention, Legitimate Authority, Last Resort, Probability of Success, Proportionality). **Stress:** This applies to *states/leaders* and the *war as a whole*.
          *   **Jus in Bello (Justice *in* War):** Rules governing *conduct* within war (Distinction, Proportionality, Necessity). **Stress:** These apply to *individual combatants* and their *actions on the battlefield*.
      *   **Key Point:** Emphasize the *separation* of these two domains. The justice of *why* you fight doesn't automatically dictate the rules for *how* you fight *once the war has started*.

  2.  **The Permission to Kill Combatants (20 min)**
      *   **Core Idea:** Explain that Jus in Bello grants combatants a specific, limited permission: they are legally and morally permitted to intentionally kill enemy combatants (subject to JIB constraints like distinction/proportionality).
      *   **Why?** Focus on the "Combatant's Privilege" and its roots:
          *   Combatants are seen as agents of their state, not acting on purely personal malice.
          *   They pose a threat simply by being combatants.
          *   The "Moral Liability" argument: By joining the military and taking up arms, combatants make themselves liable to being killed by enemy combatants. This liability stems from their role and the threat they embody, not their personal guilt for the war's justice.
      *   **Example (Classic WWII):** A British soldier defending against Nazi invasion has the JIB permission to kill a German soldier. A German soldier invading Poland also has the JIB permission to kill a Polish soldier defending their country. **Frame:** This permission is inherent to their *status* as combatants, sanctioned by the laws of war.

  3.  **Introducing the Symmetry Problem (15 min)**
      *   **The Problem:** Now combine the two ideas. If:
          1.  Jus ad Bellum determines that one side (e.g., Aggressor) is fighting an *unjust* war.
          2.  Jus in Bello grants *both* sides' combatants permission to kill enemy combatants.
      *   **The Contradiction:** How can the combatant fighting for the *unjust* cause possibly have the *moral permission* to kill? Isn't killing in service of an unjust cause itself an unjust act? This threatens the coherence of Jus in Bello. **This is the Symmetry Problem:** Why do symmetrically opposed combatants have symmetrical permissions?
      *   **Misconception Head-Off #1:** Here's where you explicitly address the anticipated idea: "**Wait, but if my *cause* is just, doesn't that make *me* morally better when I kill?**" Reiterate the separation: JIB rules apply *regardless* of the war's justice. The permission stems from combatant *status and role*, not the underlying justice of the war. The Aggressor soldier isn't guilty of *starting* the war (that's the leader's JAB fault), but *as a combatant*, he is liable to be killed and permitted to kill within JIB limits.

  4.  **Resolution: Moral Equality of Combatants (MEC) (15 min)**
      *   **The Principle:** MEC is the *solution* to the Symmetry Problem. It holds that enemy combatants are moral (and legal) equals *with respect to Jus in Bello*. They have:
          *   Equal *permission* to fight and kill enemy combatants (subject to JIB).
          *   Equal *liability* to be killed by enemy combatants.
          *   Equal *rights* as prisoners of war.
      *   **Justification for MEC:** Re-emphasize the key arguments:
          *   **Role-Based Liability/Permission:** The permission/liability arises from their function as combatants in a conflict, not their personal justice assessment or their state's JAB status.
          *   **Epistemic Uncertainty:** Soldiers generally cannot reliably know the true JAB status of their own war, let alone the enemy's. Applying different rules based on contested JAB is impractical and dangerous.
          *   **Reciprocity & Restraint:** Applying the *same* rules to both sides is essential for mutual restraint and the possibility of limiting war's horrors (e.g., POW treatment).
      *   **Misconception Head-Off #2:** Address the Pacifism confusion: "**Doesn't this mean war is morally fine?**" No. MEC operates *within* the context of war. It doesn't justify war itself (that's JAB's job). It provides rules for *how* killing happens *if* war occurs, aiming to make it less awful. Pacifism rejects the permissibility of war *altogether*.

  5.  **Testing Intuitions: The Automated Sentry Dilemma (15 min)**
      *   **Present the Scenario:** An autonomous AI weapons system, programmed by State A (with potentially dubious JAB), operates on the border. It detects and fires upon enemy combatants from State B (with potentially better JAB) who are attempting to cross. There are *no human soldiers* physically present or at risk on State A's side during the engagement.
      *   **Discussion Questions:**
          *   Does MEC apply here? Are the human soldiers of State B "equal" to the AI system?
          *   Who bears responsibility for the AI's killings? (The programmers? Commanders? State?)
          *   Does the *lack of reciprocal risk* to State A's personnel change the moral equation for State B's soldiers? Does it undermine the "mutual liability" justification?
          *   **Key Insight:** This *challenges* the intuition that MEC requires *symmetry in human vulnerability*. It pushes students to focus on the *source* of the threat and the *agency* behind it (the AI as an agent/weapon of State A). Most arguments for MEC would likely *still* apply: the State B soldiers are liable because they are combatants posing a threat (to State A's territory/objectives, represented by the AI), and the AI is acting on behalf of State A, making its actions attributable to that state. The lack of immediate human risk doesn't negate the combatant status of the humans or the AI's function as a combatant proxy. It might intensify concerns about proportionality or distinction, but not necessarily invalidate the core symmetry of permission/liability for combatants.

  6.  **Wrap-up & Check Question (10 min)**
      *   **Summarize:** Reiterate the dependency: JAB/JIB Distinction -> Permission to Kill Combatants -> Symmetry Problem -> Moral Equality of Combatants as the solution.
      *   **The Crucial Check Question:** "**According to MEC, does a soldier fighting for a side that is clearly the aggressor in an unjust war (violating Jus ad Bellum) *have the moral permission under Jus in Bello* to kill enemy combatants who are defending their homeland? Why or why not?**"
          *   **Why this works:** It directly tests the core "symmetry" idea. The correct MEC answer is **YES**, because the permission stems from combatant status, not JAB. A "no" reveals they haven't grasped the separation or the resolution of the symmetry problem. A memorized "slogan" answer won't hold up under the pressure of the clearly unjust aggressor scenario without understanding the *why*.
      *   **Explicit Omission:** "We've focused on the traditional view supporting the separation of JAB/JIB and MEC. However, it's crucial to know that there's a major school of thought, often called **Revisionist Just War Theory**, that *rejects* this strict separation and therefore *denies Moral Equality of Combatants*. Revisionists argue that the justice of the cause *does* fundamentally impact the permissions and liabilities of individual combatants. We're leaving this critique aside today to deeply understand the traditional structure, but acknowledging its existence is important for a complete picture of the debate." **Reason for Omission:** Introducing the revisionist critique *within* this session would be highly complex and likely confuse the foundational structure you're trying to teach. It deserves its own dedicated session.

  **Why this flow works for your group:**

  *   **Logical Dependency:** Builds step-by-step (Distinction -> Permission -> Problem -> Solution).
  *   **Addresses Misconceptions Head-On:** Integrates countering anticipated misunderstandings at the points where they naturally arise.
  *   **Relevant Case Study:** The Automated Sentry leverages their Comp Sci/Bio interests without derailing the core lesson (it *tests* MEC, doesn't break it outright, leading to rich discussion).
  *   **Clear Check Question:** Forces application of symmetry in the hardest case (unjust aggressor).
  *   **Transparent Boundaries:** Clearly states the omitted revisionist view and why, preventing false completeness.

  **Teaching Tips:**

  *   **Use "Combatant" Consistently:** Avoid "soldier" if discussing non-state actors potentially; stick to the defined status.
  *   **Board/Visual:** Map out the flow: JAB <--> Leaders/War | JIB <--> Combatants/Actions | Connecting Arrow creates Symmetry Problem | MEC bridges the gap.
  *   **Encourage Debate:** The Sentry case and the Check Question are prime debate starters. Let them wrestle with it!
  *   **Emphasize "Why":** Constantly ask "Why is this rule structured this way?" Focus on the underlying justifications (liability, reciprocity, uncertainty, restraint).

  This plan gives you a clear roadmap to explain the dependency structure, confront key misconceptions, engage their interests, and assess understanding of the core symmetry concept. Good luck with the session!
