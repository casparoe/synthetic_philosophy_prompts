  I'm moderating a podcast Q&A with a philosopher defending "stream-consequentialism"—a synthesis of Buddhist ethics and suffering-focused consequentialism that evaluates actions by their effect on the causal trajectory of mental formations (sankharas) across rebirths, using a "structural dukkha baseline" that weights chronic patterns of craving and aversion more heavily than episodic pain. She denies that this requires a permanent self, rejects Theravada virtue ethics as insufficiently responsive to suffering reduction, and insists that without the rebirth dimension and the structural/episodic distinction, karmic theory collapses into vague moralism. Please respond in the following sections, in order:

  1. Position framing (approx. 100 words): state the two or three commitments that distinguish her view from both classical negative utilitarianism and standard Buddhist karmic theory.

  2. Interview questions (approx. 450 words): draft eight questions in formal podcast register that press the actual mechanics of her view, avoiding generic biography. Required: at least one on assigning cross-lifetime suffering without a stable personal identity; at least one on whether intentional harm can be justified to disrupt a destructive sankharic trajectory; at least one on how individual actions aggregate into a stream-level moral evaluation. For each question, include a specific follow-up keyed to her most likely reply (for example, an appeal to causal continuity of mental streams, or to the structural/episodic distinction).

  3. Pressure point (approx. 100 words): identify which of these questions exposes the deepest internal tension in her position and explain why.

  Do not include requests for citations, reading lists, or bibliographies.
