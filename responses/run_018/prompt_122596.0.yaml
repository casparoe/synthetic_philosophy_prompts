  ### **Term 4: Reachability sensitivity**  
  *Does credence change if N is unreached but reachable?*  
  - **Physically unreachable (original)**: No change (anchors rely on idealizations/norms, not physical limits).  
  - **Merely unreached (variant)**: Credence **drops to 0.40**.  
