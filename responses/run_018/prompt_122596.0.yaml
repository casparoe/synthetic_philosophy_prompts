  ### **Term 0: Metaphysical grounding for meaning-facts (new)**  
  *Probability that meaning-facts can exist in a physical universe*: **0.90**  
  *(Justification: Rejecting eliminativism; meaning-talk is indispensable in folk psychology and linguistics. Uncertainty reflects hard problem of intentionality.)*  

  ---

  ### **Term 1: Existence of meaning-facts for Ada**  
  *Probability that "Ada means X" has a truth-value (neither skeptical collapse nor non-factualism)*: **0.75**  
  *(Justification: Skeptical arguments are sound but not necessarily fatal. Common sense and empirical psychology assume meaning-facts. 25% credence to Kripkean skepticism or deflationism.)*  

  ---

  ### **Term 2: Anchor type & selection**  
  *Probability distribution over candidate anchors (conditional on Term 1 = true)*:  
  - **Eligibility/simplicity** (addition is more natural than ⊞): **0.35**  
    - *Conditional prob. it selects addition*: **0.55**  
      *(⊞ is gerrymandered but definable; "5" is arbitrary, hurting its simplicity.)*  
  - **Idealized dispositions** (what Ada *would* do under ideal reasoning): **0.25**  
    - *Conditional prob. it selects addition*: **0.40**  
      *(Idealization is underspecified; ⊞-compatible ideals exist.)*  
  - **Community/stance** (interpretive norms of Ada's community): **0.20**  
    - *Conditional prob. it selects addition*: **0.90**  
      *(Community practices fix "plus" as addition; ⊞ lacks cultural salience.)*  
  - **Primitivism** (no further anchor needed): **0.15**  
    - *Conditional prob. it selects addition*: **0.80**  
      *(If meaning is primitive, skeptical regress halts; "plus" is pre-theoretically addition.)*  
  - **Causal/external facts** (etiological history of "plus"): **0.05**  
    - *Conditional prob. it selects addition*: **0.70**  
      *(Weak for math terms; no causal interaction with numbers.)*  
  **Net anchor contribution to P**:  
  `(0.35*0.55) + (0.25*0.40) + (0.20*0.90) + (0.15*0.80) + (0.05*0.70) = 0.49`  

