  ---

  ### **Combination Rule**  
  Final credence in P:  
  `Term 0 × Term 1 × [Term 2 net] × Term 3 weight × (1 - Term 5 discount) × Term 6 weight`  
  `= 0.90 × 0.75 × 0.49 × 0.30 × (1 - 0.08) × 0.75 ≈ 0.45`  

