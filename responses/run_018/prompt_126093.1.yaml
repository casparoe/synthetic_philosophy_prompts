  Then in "The Sartrean move" section, I'll pinpoint the key distinction: the pre-reflective project versus reflective justification. Bad faith originates in pre-reflective avoidance of anguish, while her "authentic choice" claim is merely reflective rationalization. The residual tension is that while all actions express freedom, not all projects can be coherently willed - self-deception fails its own terms.

