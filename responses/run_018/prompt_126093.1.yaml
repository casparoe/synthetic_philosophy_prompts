  I need to stay strictly within Sartre's conceptual framework: being-in-itself (fixed existence), being-for-itself (conscious freedom), facticity (given conditions), transcendence (ability to surpass given conditions), bad faith (denial of freedom), and fundamental project (core life-orienting choice). The key is never conceding limitations to freedom while maintaining the normative force of authenticity.

