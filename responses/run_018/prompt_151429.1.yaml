  I sit on the Meridian Institute review board and we vote next tuesday on Project ANCHOR. The PI wants to apply teleosemantic analysis to predictive-error signals in BCI feedback loops for psychosis patients, arguing that since these neural hierarchies lack direct evolutionary selection history, calling them misrepresentational collapses into mere malfunction—which should change our informed-consent framing for the trial. The clinical co-lead says its just philosophy garnish and we should fund on outcomes alone. Draft a short memo for the board recommending approve, reject, or approve-with-conditions, with reasoning that actually engages whether derived proper function can do the work when direct phylogenetic selection is absent. Include the strongest counterargument and a concrete next-step with a timeline. Don't ask for citations or a reading list.
reasoning: |-
  Okay, the user is part of the Meridian Institute review board and needs a memo about Project ANCHOR. The project involves using teleosemantic analysis on predictive-error signals in BCI feedback loops for psychosis patients. The PI argues that because these neural hierarchies don't have direct evolutionary selection history, labeling them as misrepresentational is just malfunction, which affects informed consent. The clinical co-lead thinks this is just philosophical garnish and funding should be based on outcomes alone. The user wants a recommendation: approve, reject, or approve with conditions, along with reasoning about whether derived proper function works without phylogenetic selection. Also, need the strongest counterargument and a concrete next step with a timeline.

  First, I need to unpack the key elements here. Teleosemantics is a theory that defines mental representations based on evolutionary functions. The PI is applying this to neural signals in psychosis patients. The argument is that since these neural circuits weren't directly shaped by evolution, calling their errors "misrepresentations" might not hold, reducing it to malfunction. This impacts how informed consent is framed—patients might need to understand that their brain's "errors" aren't malfunctions in the traditional sense but something else. The clinical side is skeptical, seeing philosophy as irrelevant to clinical outcomes.

  The user's explicit request is for a memo with a decision and reasoning. But deeper, they might need to bridge theoretical ethics with practical clinical applications. The board likely includes both theorists and clinicians, so the memo must address both sides. The unspoken need could be ensuring ethical rigor without overcomplicating the trial, or avoiding liability issues with consent forms.

  Now, assessing derived proper function. In teleosemantics, derived proper functions are those assigned based on current roles rather than evolutionary history. For example, a heart's derived function could be to make sounds in a stethoscope, but its proper function is pumping blood. The PI is applying this to neural hierarchies in psychosis. The question is whether derived functions can bear the weight of "misrepresentation" without evolutionary history. Critics like Millikan might say that without a history of selection, it's hard to define what counts as proper function. Others might argue that in a BCI system, the derived function comes from the designed purpose of the technology, so misrepresentation could be defined by the system's goals.

  The strongest counterargument from the clinical side is that this philosophical debate doesn't affect patient outcomes or safety. The trial's success hinges on clinical results, not theoretical distinctions. Introducing complex ideas into consent forms could confuse patients rather than inform them.

  For the recommendation, approve-with-conditions seems balanced. The project has merit, but the teleosemantic claim needs validation. Requiring that the consent forms don't hinge on unvalidated theory makes sense. That way, the clinical trial proceeds, but the philosophical aspect is tested separately.

  Next steps: A focused workshop with experts to tackle the derived function issue. Timeline: Workshop in 4 weeks, report by 8 weeks. This shows progress without delaying the trial.

  I should structure the memo clearly: background, recommendation with reasoning, counterargument, next steps. Keep it concise, jargon-free where possible, but engage deeply with the philosophical question as requested. Make sure to tie the decision to the board's role in oversight, emphasizing practical ethics and theoretical soundness.
answer: |-
  **MEMORANDUM**  
  To: Meridian Institute Review Board  
  From: [Your Name/Title]  
  Date: [Current Date]  
  Subject: Recommendation on Project ANCHOR Vote  

  ### **Background**  
  Project ANCHOR proposes using teleosemantic analysis to reframe "misrepresentational" predictive-error signals in psychosis patients' neural hierarchies via BCI feedback. The Principal Investigator (PI) contends that absent direct evolutionary selection history, labeling these signals as "misrepresentations" reduces to claims of mere malfunction, thus impacting informed consent (e.g., shifting from "correcting faulty representations" to "adjusting functional outputs"). The clinical co-lead dismisses this as non-actionable philosophy, advocating funding based solely on clinical outcomes.  

  ### **Recommendation: Approve with Conditions**  
  **Reasoning:**  
  The core question—whether *derived proper function* (e.g., functions assigned via BCI design/learning, not phylogeny) can sustain teleosemantic "misrepresentation" without evolutionary history—is both substantive and relevant to ethical framing. While Millikan-style teleosemantics roots "proper function" in selection history, the PI’s argument aligns with theories (e.g., Shea, Papineau) that extend derived functions to artifacts and learned systems. **If BCI-induced hierarchies acquire stable, designed functions through the feedback loop (e.g., error-minimization), "misrepresentation" could validly apply to deviations from those *operationally defined* functions.** This challenges the clinical co-lead’s "garnish" claim: if neural signals are framed as *non-representational* malfunctions, consent materials implying "representation correction" risk misstating intervention goals. However, this theoretical claim **must be empirically validated** before driving consent language.  

  #### **Condition for Approval**  
  1. **Informed consent documents must neutrally describe the BCI’s mechanism** (e.g., "modulating signals associated with predictive errors") **without invoking unvalidated teleosemantic claims** (e.g., avoiding "correcting misrepresentations"). Clinical outcomes remain the trial’s primary justification.  

  ### **Strongest Counterargument**  
  **Derived functions lack normative force without selection history.** If neural hierarchies acquire functions only via the BCI’s artificial parameters, "misrepresentation" collapses into *system-relative dysfunction* (e.g., "not doing what the BCI intends"), which is clinically indistinguishable from "malfunction." This renders teleosemantics redundant: outcomes (signal stability, symptom reduction) alone suffice for consent and evaluation, making the philosophical layer extraneous.  

  ### **Concrete Next Step & Timeline**  
  - **Action:** Commission a focused 2-day workshop (internal/external experts in philosophy of mind, computational psychiatry, and neuroethics) to evaluate:  
    - Can derived functions in BCI-adapted neural circuits sustain robust teleosemantic norms?  
    - If so, what empirical evidence would validate/invalidate this for consent?  
  - **Timeline:**  
    - Workshop convened within **4 weeks** of approval.  
    - Summary report with practical recommendations delivered to the board within **8 weeks**.  

  Project ANCHOR’s clinical aims are promising, but its theoretical innovation requires scrutiny before influencing ethics frameworks. Conditional approval advances science while mandating rigor.  

  **Vote:** Approve with above condition.
