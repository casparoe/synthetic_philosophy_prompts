  **Bottom line:** This practice assumes law's purpose includes symbolic affirmation of shared values beyond harm prevention, tacitly invoking Devlin's view that societal cohesion is a public good worth legal recognition, even if enforcement is withheld; while liberals might tolerate dead-letter laws as inert cultural artifacts, doing so inconsistently prioritizes expressive function over the harm principle's enforcement threshold.  

  **Unpack:** The retention of unenforced morals laws presupposes that law serves an expressive role—declaring communal ideals independent of practical application. Constitutional harm requirements focus on *enforcement justification*, not symbolic existence, creating a loophole: the state can "affirm" morality without proving harm. Squaring this with the harm principle fails because mere symbolism lacks a harm-based *reason for existence*; it implicitly treats societal morality as a Devlin-style public good needing affirmation. A liberal could technically preserve dead-letter laws without logical contradiction by viewing them as dormant historical artifacts, not active moral endorsements—but this demands strict non-enforcement and risks legitimizing moralistic legislation. The practice is thus philosophically unstable for liberals, as it endorses symbolism rooted in collective morality, not harm.  

