prompt: |-
  For a seminar in moral philosophy I am writing down my current position on whether numbers should count in rescue and allocation cases, and I want a consistency audit before I present it. Here are my commitments:

  (1) I accept the anti-aggregationist view—associated with Taurek—that in direct, one-off rescue dilemmas where I can save either one person or five, the five do not collectively present a stronger moral claim; each individual's claim is of equal weight and they are not additive, so I am not morally required to save the greater number.

  (2) I think our contrary intuition that we should save the five tracks an evolutionary quantity-sensitive heuristic rather than a genuine moral reason, and I take this debunking to undermine aggregation in direct cases.

  (3) I hold that moral theory should be unified: there should not be one decision procedure for private rescue and a separate, compartmentalized procedure for institutional allocation unless that division is itself derivable from the same underlying principle.

  (4) In institutional contexts—e.g., distributing a scarce vaccine—I believe it is correct to prioritize the option that saves more lives, but I want to justify this without aggregating moral claims; instead I appeal to equal ex ante procedural fairness, where each citizen has an identical claim on institutional protection, so distributing risk equally across the population maximizes expected survivors without treating lives as fungible moral units.

  (5) When harm is unavoidable outside any institutional framework, I think a fair lottery with equal per-capita chances is appropriate, and the fairness of that procedure does not depend on the relative sizes of the groups involved.

  (6) I maintain that the strength of a moral claim is fixed entirely by properties internal to the claimant and does not vary with the presence, absence, or number of other claimants.

  Do these hang together? I am especially concerned that (3) combined with (4) reintroduces aggregation through procedural language, and that (2) might also undermine the rational basis for (4). Meanwhile, (1) together with (5) might seem to conflict—if numbers never matter, why structure the lottery around equal individual chances rather than treating each group as bearing one collective claim?—though I suspect that tension dissolves once the procedural rationale is made explicit.

  Please audit the set: identify which pairs are genuinely in tension and which only appear to be, rank the real tensions by severity, specify for each what the cheapest revision would be and what it costs, and deliver your bottom-line verdict in the first sentence with no preamble and no restatement of the question. Then provide the reasoning.
reasoning: |-
  Okay, let's tackle this consistency audit for the user's moral philosophy position. The user presents six commitments and wants to check if they cohere, especially regarding potential tensions between anti-aggregation in direct rescues and procedural fairness in institutional settings.

  First, I note the core tension points flagged by the user: 
  Commitment (3) demands unity between personal and institutional decision-making, but (4) introduces a procedural justification for saving more lives in institutions that might secretly rely on aggregation. Also, (2)'s evolutionary debunking of aggregation intuitions could undermine the rationale for (4)'s procedural fairness. And there's a surface conflict between (1)'s group-size indifference and (5)'s individual-focused lotteries.

  Starting with the (1)+(5) apparent conflict: The user suspects it dissolves when emphasizing procedural fairness. I agree. Taurek-style anti-aggregation treats groups as morally irrelevant collections, so giving each *person* equal lottery chances aligns with (6)'s claim individualism. No revision needed here.

  The (2)+(4) tension is deeper. If our number-sensitive intuitions are evolutionarily debunked in direct cases, why trust similar intuitions about procedural fairness in institutions? The user might respond that (4) isn't intuition-based but principle-driven—yet the debunking argument risks spilling over. Cheapest fix: Clarify that debunking targets *aggregative* intuitions specifically, not procedural fairness ones. Cost: Weakens (2)'s generality but saves coherence.

  Now the critical (3)+(4) challenge: Can institutions prioritize numbers without aggregating claims, per (3)'s unity requirement? The equal ex ante chance mechanism *does* achieve higher survival rates without additive claims, satisfying (6). But (3) demands the *same* principle underlies both contexts. Here the solution is to frame procedural fairness as the unified principle: Private rescues use coin-flips (implicit lottery), institutions use statistical risk-distribution. This holds if we view institutions as implementing large-scale fair procedures. No revision, but requires explicit argument linking the cases.

  Bottom line: Positions cohere with minor clarification. The debunking point needs narrowing, and procedural fairness must be consistently framed as the unifying base. Overall structure is defensible with careful articulation.
answer: |-
  **Verdict: Your commitments cohere defensibly with minor clarification needed for (2), requiring no substantive revision but careful articulation to avoid perceived aggregation in (4).**

  ### Reasoning on Tensions:
  #### Genuine Tensions (Ranked by Severity):
  1.  **(2) + (4): Evolutionary Debunking vs. Institutional Rationale (Moderate Severity)**
      *   **Tension:** (2) debunks the intuition to save the greater number as a non-moral evolutionary heuristic. (4) justifies institutions saving the greater number via procedural fairness. The risk is that (2) could undermine confidence in *any* number-sensitive decision (like (4)) as being rooted in the same debunked intuition.
      *   **Cheapest Revision:** Clarify that the evolutionary heuristic *specifically* targets intuitions about *additive moral weight/strength of claims* in direct interpersonal dilemmas. Distinguish this sharply from the *procedural fairness* rationale for institutions, which is a distinct, principle-based justification not dependent on aggregating claims. (4) isn't tracking the same intuition (2) debunks; it's applying a different principle (equal ex ante protection).
      *   **Cost:** Weakens the *generality* of the debunking claim in (2). It must now specify it targets *aggregationist intuitions* specifically, not necessarily *all* number-sensitive outcomes. Requires careful articulation to show why the institutional "save more" outcome is justified differently.

  2.  **(3) + (4): Unity vs. Institutional Procedure (Mild Severity - Apparent)**
      *   **Apparent Tension:** (3) demands a unified principle. (4) uses procedural fairness for institutions, while direct rescues (implied by (1)/(5)) use fairness via lottery/random choice. Worry: The procedural language in (4) might mask aggregation ("maximizes expected survivors" sounds aggregative).
      *   **Resolution:** The underlying principle unifying *both* contexts is **Fairness Under Impartiality/Equal Respect**. In direct rescue (private action), fairness requires giving equal *ex post* chance to each threatened individual (via coin flip/lottery). In institutional allocation (public action), fairness requires giving equal *ex ante* chance of institutional protection to each citizen *over time/policy cycles*, leading to a strategy maximizing expected survivors *as a side-effect* of equalizing risk. The "save more" outcome in (4) is a *consequence* of applying the fairness principle institutionally, not the *ground* of the decision. It avoids aggregation because each citizen's claim is treated identically; the outcome isn't driven by adding claim weights.
      *   **Cheapest Revision:** None strictly needed, but requires explicit framing: The core principle is "equal respect/fair consideration of each individual's claim" applied appropriately to context (private/immediate vs. public/systemic). Articulate that maximizing expected survivors in (4) is a *derived institutional imperative* from the core fairness principle, not a separate aggregative principle. Emphasize "maximizes expected survivors" is a *predictable outcome* of the fair procedure, not its *justification*.
      *   **Cost:** Requires careful explanation to show how the *same* core fairness principle manifests differently in different contexts without smuggling in aggregation. The "maximizes expected survivors" phrasing in (4) is risky and needs justification as an *implication*, not a *foundation*.

  #### Apparent Tensions (Not Genuine):
  1.  **(1) + (5): Saving Fewer vs. Individual Lottery (Resolved by Procedural Rationale)**
      *   **Apparent Tension:** If numbers don't matter (1), why does (5) structure the lottery per capita, inherently favoring the larger group?
      *   **Resolution:** As you suspected, this dissolves with the procedural rationale. (1) rejects aggregation: the *moral claims* of the five aren't stronger *collectively*. (5) is about fair *decision-making procedure* under impartiality. Treating each *individual* equally in the lottery is the requirement of fairness *given that all have equal claims* (commitment 6). It's not that the larger group's claim is stronger; it's that there are *more individuals* each with an *equal claim* to a fair chance. Structuring the lottery per group would violate the equal consideration of each individual (6) by treating the group as a unit with one claim. The procedural fairness rationale explicitly justifies the per-capita structure without invoking aggregation of claim strength.

  ### Bottom-Line Coherence Assessment
  *   **Core Strength:** Commitment (6) ("strength of a moral claim is fixed entirely by properties internal to the claimant") is the anchor. (1) and the rejection of aggregation in direct cases follow directly. (5) follows as the fair procedure for direct cases respecting (6).
  *   **Institutional Justification:** (4) is defensible *without* aggregation by grounding the "save more" outcome strictly as the *necessary consequence* of implementing *equal ex ante procedural fairness* for each citizen (a duty specific to institutions), respecting (6). The outcome is derivative, not foundational.
  *   **Unity (3):** The unified principle is **Equal Respect/Fair Consideration for Each Individual Claimant**. This manifests as:
      *   *Direct Rescue (Private):* Equal *ex post* chance via fair lottery (5).
      *   *Institutional Allocation (Public):* Equal *ex ante* chance of protection via risk distribution, leading to maximizing expected survivors (4).
  *   **Debunking (2):** Requires the clarification noted above to restrict its target to *aggregationist intuitions* specifically, preventing it from undermining the distinct *procedural fairness* rationale for (4).
  *   **Overall:** The position is logically consistent. The main work lies in articulating the core fairness principle clearly and demonstrating how it generates different procedures in different contexts (private/immediate vs. public/systemic) without relying on aggregative reasoning. The "maximizes expected survivors" language in (4) is the most vulnerable point and needs careful handling as an *implication*, not a *justification*. With that articulation, the commitments hang together as a coherent non-aggregative, fairness-based approach.
