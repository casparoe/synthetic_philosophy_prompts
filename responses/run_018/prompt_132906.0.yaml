prompt: |-
  im writing a feature on Scanlon's contractualism and why it keeps stalling on aggregation — like climate harm or AI risk spread across millions where no single agent clearly wrongs anyone. I'm talking to philosophers and policy folks, and I need to know which open questions actually deserve airtime. Is the core problem fixing the aggregation mechanism, or is it that contractualism just isn't built for systemic wronging? Rank the live lines for me: which ones, if cracked, would change moral reasoning at scale, and which are academic wheel-spinning? I also want your honest take on the "distributed wronging" angle — harm that's real but can't be traced to pairwise violations — is that a dead end or the thing we should push? Definately care about tractability and downstream impact, not a reading list.
reasoning: |-
  Okay, the user is working on a feature about Scanlon's contractualism and its problems with handling aggregation—specifically in cases like climate change or AI risks where harm is spread across many people, and no single agent clearly wrongs anyone. They're interviewing philosophers and policy folks and want to prioritize which open questions are worth focusing on. They need to know which issues could actually change moral reasoning at scale versus those that are just academic debates. Plus, they're interested in the "distributed wronging" concept—harm that exists but isn't traceable to individual wrongs—and whether that's a dead end or a promising angle.

  First, I should recall the basics of Scanlon's contractualism. It centers on mutual justifiability: an act is wrong if it can't be justified to others according to principles no one could reasonably reject. The individualist restriction means focusing on how actions affect individuals pairwise, not aggregating harms across many people. That's why it struggles with large-scale problems—each small contribution to climate change or AI risk doesn't seem to wrong any single person directly.

  The user mentioned "stalling on aggregation," so I need to break down why that happens. The core issue is the individualist restriction. For example, one person's carbon emissions might not harm anyone individually, but collectively, they cause massive harm. Contractualism can't easily condemn that because each act isn't unreasonable to any one person. This leads to "each-we dilemmas" where individual actions seem permissible, but together they cause disaster.

  Now, the user wants to rank live lines of inquiry. Which ones, if solved, could have real-world impact? They care about tractability and downstream effects, not just theory. So I should evaluate each potential solution path:

  1. **Reform the Aggregation Mechanism:** Some philosophers propose tweaking aggregation within the framework. Parfit's "Harmless Torturers" example shows the problem. Solutions like Kamm's "threshold aggregation" or Kumar's "complicity" models try to aggregate small harms. But these might stretch contractualism too far or become ad-hoc. If fixed, it could resolve climate-type issues, but it's technically tricky and might not satisfy purists.

  2. **Systemic Wronging Concept:** This argues that contractualism needs a new category for harms from systems, not individual actions. The "distributed wronging" angle is key here—harm from many actions that can't be pinned to any pair. Philosophers like Wringe or Ashford are pushing this. If successful, it could reframe big problems but requires overhauling the theory, which is a heavy lift. Yet, it's the most transformative if it works.

  3. **Alternate Frameworks:** Maybe contractualism isn't the right tool. Consequentialism handles aggregation well but loses the relational aspect. Hybrid models might borrow from both. This is practical for policy but abandons Scanlon's core ideas, which might not interest the user if they're focused on contractualism itself.

  4. **Moral Mathematics:** Focus on the structure of collective action problems. This is foundational but abstract, making it less likely to influence policy directly. It's important for theory but might not change real-world reasoning soon.

  5. **Procedural Solutions:** Shift to decision-making processes rather than outcomes. This is pragmatic and applicable now, especially in policy, but doesn't solve the theoretical problem. It's a workaround, not a deep fix.

  Ranking these: Systemic wronging (#2) has the highest transformative potential because it addresses the root issue. If cracked, it could revolutionize how we see large-scale harms. Aggregation reform (#1) is a close second but might be a band-aid. Procedural solutions (#5) are most tractable now. The others are less impactful for immediate change.

  On distributed wronging: The user specifically asked about this. It's not a dead end—it's central to the systemic approach. Airtime here is crucial because it challenges contractualism's individualism. If successful, it could make the theory relevant for modern problems. But it's risky; if it fails, it might lead nowhere. Still, given the user's focus on scale and impact, pushing this angle makes sense. It resonates with real-world issues like climate change, where harm is diffuse.

  User's deeper needs: They want their feature to influence debate and policy, not just report on academia. They need to spotlight ideas that could actually shift how society handles big risks. They might also want to provoke discussion—distributed wronging does that. Unspoken needs include avoiding niche philosophy that goes nowhere and finding angles that engage both experts and policymakers.

  Final thoughts: Emphasize systemic wronging and aggregation fixes as top priorities. Distributed wronging is worth pushing hard—it's the bold move that could redefine the conversation. Recommend focusing interviews on philosophers working on systemic approaches and policy people using procedural tools. Highlight that the core problem is contractualism's structure, not just a technical flaw. That's where the story has legs.
answer: |-
  Here’s a ruthless prioritization of live debates in Scanlonian contractualism regarding aggregation, ranked by **transformative potential** (scale of impact) and **tractability** (likelihood of near-term progress). Focus is on what could reshape real-world moral reasoning on systemic risks like climate/AI, not academic curiosities:

  ### 🚀 Ranked Live Lines (If Cracked, Would Change Moral Reasoning)
  1. **Systemic Wronging & Structural Contracts**  
     **Core Question:** Can contractualism define duties to *maintain just systems* (e.g., carbon markets, AI governance) even when no single act violates pairwise justification?  
     **Why Top Rank:** Directly tackles climate/AI’s core challenge – harm emerges from systems, not atomized acts. If solved, it rewires contractualism for the Anthropocene. **High transformative potential** (redefines "wronging"), **medium tractability** (see Ashford, Wringe).  
     **Downstream Impact:** Policy frameworks for "systemic negligence" could emerge.

  2. **Aggregation Mechanisms Within Individualist Constraints**  
     **Core Question:** Can thresholds, risk imposition, or complicity models *within Scanlon’s framework* condemn distributed harms without collapsing into consequentialism?  
     **Why #2:** Solves the "harmless torturer" paradox (e.g., micro-emitters causing macro-harm). **High tractability** (active work by Kumar, Frick, Voorhoeve), but **moderate transformative potential** – it patches rather than overhauls.  
     **Downstream Impact:** Sharper tools for assigning climate liability or AI oversight duties.

  3. **Procedural Contractualism for Collective Action**  
     **Core Question:** Should contractualism shift focus from *acts* to *decision-procedures* (e.g., "Could we justify *not* creating a carbon tax?")?  
     **Why #3:** Pragmatic workaround for policymakers. **High tractability**, **immediate impact** – but doesn’t resolve theoretical aggregation gaps.  
     **Downstream Impact:** Legitimizes institutional solutions (e.g., "A principle requiring AI impact assessments couldn’t be reasonably rejected").

  ### ⚠️ Lower Priority (Academic Wheel-Spinning)
  4. **Moral Mathematics of Imperceptible Harms**  
     **Core Issue:** Endless debates on *how* to sum tiny harms (e.g., Parfit’s "Drops of Torture").  
     **Why Low:** Stuck in theoretical loops; no consensus in 40+ years. Minimal policy relevance – real-world harms are measurable (e.g., ppm CO₂ ≠ "imperceptible").

  5. **Hybrid Theories (Consequentialist Leaks)**  
     **Core Issue:** Blending aggregative principles into contractualism (e.g., "Rejectable if worst-off are below threshold X").  
     **Why Avoid:** Dilutes Scanlon’s core anti-aggregation stance. Consequentialism already handles aggregation; this just makes contractualism redundant.

  ---

  ### 🔍 Your "Distributed Wronging" Angle: **PUSH HARD**  
  This isn’t a dead end – **it’s the critical frontier**. Here’s why:  
  - **The Gap:** Contractualism excels at condemning clear wrongs (e.g., lying, direct harm) but chokes when harm is emergent (e.g., algorithmic bias in hiring, microplastics).  
  - **The Opportunity:** Philosophers like **Elizabeth Ashford** ("systemic deprivation") and **Bill Wringe** ("collective obligations") are building models where *participation in unjust structures* is wrong, even if no single act is pairwise unjustifiable.  
  - **Policy Resonance:** Fits real-world needs – regulators *need* concepts like "duties to repair systems" (e.g., EU AI Act’s systemic risk oversight).  
  - **Risk:** Purists call this "consequentialism in disguise." But if framed as *extending* mutual justifiability to institutional contexts ("Could anyone reasonably reject a principle permitting this *type* of system?"), it stays Scanlonian.

  ---

  ### 🎯 Your Action Plan
  1. **Interviews That Matter:**  
     - **Prioritize systemic-focused philosophers:** Ashford, Wringe, Rahul Kumar (complicity models).  
     - **Policy Voices:** Ask how they *operationalize* "distributed responsibility" now (e.g., climate loss-and-damage funds).  
  2. **Frame the Stakes:**  
     - "Can contractualism condemn *what no one does alone*? If not, it’s obsolete for the 21st century’s biggest threats."  
  3. **Kill Red Herrings:**  
     - Ignore debates about "implicit agreements" – they’re circular.  
     - Reject "just use consequentialism" cop-outs – your readers want Scanlon’s relational ethics *fixed*.  

  **Bottom Line:** The "distributed wronging" problem **is** the story. If contractualism can’t solve it, the theory is sidelined for systemic crises. The most promising paths are **systemic duties** (#1) and **aggregation thresholds** (#2) – both force the theory to evolve beyond coffee-shop ethics. Push philosophers to admit what’s tractable versus what demands revolution.
