prompt: |-
  I'm on the review board for a small grant program that funds quick-turnaround social-science pilots. We get like 20 proposals a month, and researchers keep asking if they can run a small preliminary survey before locking their main study design — basically asking wether it's worth delaying the grant decision to gather more info. I want a decision procedure based on Good's theorem on the value of information, turned into something my board can actually run in a 15-minute meeting with nothing but a whiteboard and coffee.

  The procedure should take a proposal and ask questions in order: can they actually update their action after recieving the info? are the prior probabilities genuinely fixed, or does the pilot itself become part of the result and corrupt them? Where the math gives a clear yes or no, say so; where it becomes a judgment call about wether the delay cost outweighs the expected value, flag it as a values vote, not a fact. I need it to catch the hidden misfires — like when the information looks free but actually expands the decision space in a way that violates the theorem's conditions. Then run it on three cases: a team that wants to pre-test survey questions on 30 people before a 500-person study; a team that wants to peek at preliminary census data before choosing which neighborhoods to sample; and a case where we all want to approve the pilot but the procedure forces a no because the information can't actually change our funding decision. Keep it practical for people who aren't decision theorists, mark every spot where we have to vote on values instead of computing answers, and be honest about what the procedure just can't do.
reasoning: |-
  We are going to design a decision procedure based on Good's theorem (also known as the value of information). The theorem states that the expected value of information (EVOI) is non-negative, meaning that gathering more information is never expected to harm the decision (assuming cost-free information). However, in practice, there are costs (like time delays) and conditions that must be met.

  The procedure will have the following steps:

  1. **Define the decision without the pilot**: What is the main decision we are facing without the pilot? (e.g., to fund or not, or to choose between alternative study designs)

  2. **Identify the action set without the pilot**: What are the possible actions we can take without the pilot? (e.g., approve the grant as proposed, reject it, or perhaps choose between a few fixed designs)

  3. **Identify the uncertain states and prior probabilities**: What are the key uncertainties that affect the outcome of the actions? Can we assign prior probabilities to these states? (Note: If we cannot assign priors, then we cannot compute EVOI.)

  4. **Determine if the pilot can update the probabilities**: Can the pilot information change the prior probabilities? That is, is the pilot informative about the states of the world that matter? (If not, then EVOI=0.)

  5. **Check if the updated probabilities can change the optimal action**: Even if the pilot updates the probabilities, will it possibly change which action we take? (If not, then EVOI=0.)

  6. **Assess the cost of delay**: What is the cost of delaying the decision to run the pilot? This could be an opportunity cost (e.g., the program might miss a funding cycle) or a real cost (e.g., the research becomes less timely). We must compare the EVOI to this cost.

  7. **Calculate (or estimate) EVOI**: If we can, we compute the expected value of information. But in a 15-minute meeting, we might only do this roughly. Alternatively, we can check if the conditions for positive EVOI are met and then make a judgment.

  8. **Special note on corrupted priors**: If the pilot itself becomes part of the result (e.g., if the pilot is a small version of the study and the results are to be included in the final analysis) then the prior probabilities might be corrupted because the state of the world is changed by the pilot. This breaks the independence assumption. We must check for this.

  The procedure will be a series of questions. We go step by step and if at any point we get a "no", we stop and reject the pilot. Only if we get through all the steps and the EVOI (even if roughly estimated) exceeds the delay cost, we approve.

  **Procedure:**

  1. **Decision without pilot**: 
     - What is the main decision we are making? (e.g., whether to fund the main study, or which design to fund)
     - If the decision is fixed (i.e., we are going to fund regardless of the pilot, or not fund regardless) then the pilot is not needed. **Stop: reject the pilot.**

  2. **Action set**:
     - Without the pilot, what are the available actions? (e.g., A1: fund design A, A2: fund design B, A3: reject)
     - If there is only one action (e.g., we have to fund and there's only one design), then the pilot cannot change the action. **Stop: reject the pilot.**

  3. **Uncertain states and priors**:
     - What are the key states of the world that matter for the success of the study? (e.g., state S1: the survey questions are well understood by the target population, S2: they are confusing)
     - Can we assign prior probabilities to these states? (e.g., we think there's a 60% chance the questions are good, 40% they are bad)
     - If we cannot assign priors (e.g., we have no basis for the probabilities), then we cannot compute EVOI. **Flag for a vote**: we must decide if we are willing to make a judgment call on the priors. If not, **reject the pilot**.

  4. **Pilot informative?**:
     - Will the pilot provide information about the states we defined? (e.g., the pilot survey will tell us if the questions are confusing)
     - If not, then the pilot won't update our beliefs. **Stop: reject the pilot.**

  5. **Can the pilot change the action?**:
     - Given the prior probabilities, we choose the action with the highest expected utility.
     - Then, for each possible outcome of the pilot, we update the probabilities and re-calculate the best action. Will any outcome lead to a different action?
     - Example: Without the pilot, we choose design A. After the pilot, if we get outcome X, we might switch to design B. If there is at least one outcome that would change the action, then EVOI>0. If not, **Stop: reject the pilot.**

  6. **Cost of delay**:
     - What is the cost of the delay? (e.g., the grant decision is delayed by a month, and that might mean the study starts later and misses an important event, or the funding cycle is delayed for other grants)
     - We need to quantify or at least roughly compare the EVOI to the delay cost. This is a judgment call.

  7. **EVOI vs. Delay Cost**:
     - We need to estimate EVOI. In a meeting, we might not compute it exactly. We can do:
       - A rough calculation: 
          - Consider the possible outcomes of the pilot and their probabilities (based on prior).
          - For each outcome, what is the improvement in expected utility from changing the action? 
          - Then, EVOI = sum [ P(outcome) * improvement(outcome) ]
       - Or, we can note that if the potential improvement from changing the action is high and the probability of getting an outcome that causes a change is not too low, then EVOI might be substantial.
     - Compare EVOI to delay cost. If EVOI > delay cost, approve. Otherwise, reject.
     - **This step is a judgment call** because we are estimating utilities and probabilities. We must vote on values.

  8. **Check for corruption of priors**:
     - **Critical step**: If the pilot study is going to be part of the main study (e.g., the 30 pre-test responses are included in the final 500), then the state of the world is changed by the pilot. This breaks the assumption that the pilot only provides information. In such a case, the prior probabilities we assigned (without the pilot) are no longer valid because the world state now includes the pilot. This is a violation of the theorem's conditions.
     - If the pilot corrupts the priors, then we cannot apply Good's theorem. We must then decide whether the pilot is still worthwhile by other means. **Flag: This is a values vote** because the math doesn't apply cleanly.

  **Run on three cases:**

  **Case 1: Pre-test survey questions on 30 people before a 500-person study**

  1. **Decision without pilot**: Whether to fund the 500-person study as designed, or perhaps with a different set of questions? Let's assume the decision is to fund the study as proposed or to fund a revised version (if the pilot shows problems) or not fund at all? But typically, the main decision is whether to fund the main study, and the pilot is to inform the design.

     - Actually, the grant is for the main study, but the pilot is requested to adjust the design. Without the pilot, the board would have to decide whether to fund the study as proposed.

     - **Action set**: 
          - A1: Fund the study as proposed.
          - A2: Fund the study but require revision of the questions (and then the researchers would revise without the benefit of the pilot? This might be hard). Alternatively, we might have:
          - A1: Fund without pilot (so the study goes ahead as is).
          - A2: Reject the proposal (if we think without the pilot the risk is too high).

     - But note: the researchers are asking to run the pilot and then decide on the design. So without the pilot, we might have to make a decision without knowing if the questions are good.

  2. **Uncertain states and priors**:
     - State S1: The survey questions are effective (prior P(S1)=0.6).
     - State S2: The survey questions have issues (P(S2)=0.4).

  3. **Pilot informative?**:
     - Yes, the pre-test on 30 people can reveal if the questions are understood.

  4. **Can the pilot change the action?**:
     - Without the pilot: 
          - Expected utility of funding as is: P(S1)*U(fund and good) + P(S2)*U(fund and bad)
          - Expected utility of rejecting: U(reject)
          - If the expected utility of funding is greater than rejecting, we fund. But if the pilot reveals problems, we might then decide to reject (or require revision). 
          - So without the pilot, we might fund. With the pilot, if it shows problems, we might reject. So the action can change.

  5. **Cost of delay**: One month delay. The cost might be low if the study timeline is flexible.

  6. **EVOI vs. Delay Cost**:
     - Rough EVOI: 
          - Suppose if we fund a study with bad questions, we lose the entire cost (say, $50,000) and get no useful data. If we fund with good questions, we get valuable data (utility gain: $100,000). Rejecting saves the $50,000 but we lose the opportunity (utility 0). 
          - Without pilot: 
              - EU(fund) = 0.6 * 100,000 + 0.4 * (-50,000) = 60,000 - 20,000 = 40,000
              - EU(reject) = 0
              -> We fund.
          - With pilot: 
              - Suppose the pilot can reveal either "good" or "bad". 
              - P(pilot says "good") = P(S1) = 0.6? Not exactly: the pilot might have some error. Let's assume it's perfect for simplicity.
              - If pilot says "good", we fund: get 100,000.
              - If pilot says "bad", we reject: get 0 (saving 50,000 that would have been lost).
              - Then the expected utility with pilot: 0.6 * 100,000 + 0.4 * 0 = 60,000.
              - EVOI = 60,000 - 40,000 = 20,000.
          - If the cost of delay is less than 20,000 (in utility terms), then it's worth it.

     - But note: we might have the option to revise the questions. Then the utility in the bad state might be improved by revision. This would change the calculation.

     - **Judgment call**: We must estimate these utilities and probabilities. We vote.

  7. **Corruption of priors?**:
     - If the 30 pre-test responses are then included in the 500, then the state of the world (the data) is changed. The prior probabilities we assigned (about the quality of the questions) might be based on a world without the pre-test data. But now the main study data includes the pre-test. This might corrupt the prior because the same subjects are used. However, if the pre-test is on a separate sample and not included, then it's fine.
     - In this case, if the pre-test is separate and not included, then no corruption. We are safe.

  **Verdict for Case 1**: Likely approve, but we must vote on the values for utilities and probabilities.

  **Case 2: Peek at preliminary census data before choosing which neighborhoods to sample**

  1. **Decision without pilot**: Which neighborhoods to sample? Without the preliminary data, the researchers would choose a sampling plan based on existing data. The board is funding the study, so the decision is about the sampling plan.

  2. **Action set**: Without the pilot, we have to choose a sampling plan (e.g., plan A: sample neighborhoods X,Y,Z; plan B: sample neighborhoods P,Q,R). The pilot (peeking at preliminary census data) might inform which plan is better.

  3. **Uncertain states and priors**: 
     - States: The true characteristics of the neighborhoods (e.g., which have higher poverty rates). 
     - Prior: We have existing data, so we might have prior beliefs about the distribution. But the preliminary census data is newer. We must assign priors? Actually, we can use the existing data as the prior, and the preliminary data as an update.

  4. **Pilot informative?**: Yes, the preliminary census data is about the current state.

  5. **Can the pilot change the action?**: Yes, because it might show that neighborhood X has changed, so we switch from plan A to plan B.

  6. **Cost of delay**: Waiting for the preliminary census data might cause a delay (say, one month). The cost might be the timeliness of the study.

  7. **EVOI vs. Delay Cost**:
     - We need to estimate the value of having a better sampling plan. For example, if we choose the wrong neighborhoods, we might miss important variation. The EVOI is the expected improvement in the study's accuracy (or utility) from having the updated information.
     - Rough example: Without the update, we might choose a plan that is suboptimal and get less accurate results (say, equivalent to a loss of $10,000). With the update, we avoid that loss. The probability that the update changes the plan might be 50%. Then EVOI = 0.5 * 10,000 = $5,000.
     - If the delay cost is less than $5,000, then approve.

  8. **Corruption of priors?**: 
     - The preliminary census data is external and not part of the study. So it doesn't corrupt the study. The prior is based on old census data, and the pilot is new data. This is a clean information update.

  **Verdict for Case 2**: Approve if the estimated EVOI > delay cost (vote on values).

  **Case 3: Pilot can't change the funding decision**

  This is a case where the board realizes that regardless of the pilot results, they will fund the study. For example:

  - The study is very important and the only group that can do it.
  - The pilot is about a minor detail that won't change the funding decision.

  **Steps:**

  1. **Decision without pilot**: Fund or not fund the main study.

  2. **Action set**: 
     - Without the pilot: we have two actions: fund or reject.
     - But the board has already decided that they will fund regardless of the pilot. So the pilot cannot change the action (from fund to reject or vice versa). 

     - **Stop at step 2**: reject the pilot because the action set without the pilot is effectively one action (fund) because we are committed to funding. Therefore, the pilot cannot change the action.

  **Verdict for Case 3**: Reject the pilot.

  **Summary of the procedure for the board**:

  We have a flowchart:

  1. Without the pilot, is the decision fixed? (i.e., only one action will be taken regardless of any future information?) -> If yes, reject the pilot.
  2. Can we define the states and assign prior probabilities? If not, we must vote: are we willing to make rough estimates? If no, reject.
  3. Is the pilot informative about the states? If no, reject.
  4. Without the pilot, we choose an action A0. After the pilot, for at least one possible outcome, would we choose a different action? If no, reject.
  5. Is the pilot going to be part of the main study (thus corrupting the prior)? If yes, then we cannot use the theorem. We must vote: is the pilot still worth it? (This is a values vote because the math doesn't apply.)
  6. Estimate EVOI and compare to delay cost. This is a values vote.

  At any rejection point, we stop and reject the pilot. Only if we get through all steps and the EVOI (judged by the board) is greater than the delay cost, we approve.

  **Practical tips for the meeting**:

  - Use the whiteboard to sketch the decision tree without the pilot and with the pilot.
  - Assign rough probabilities and utilities (even as low, medium, high) for the states and outcomes.
  - For the cost of delay, think about the program's mission: if the delay means missing a policy window, that's a high cost.

  **Limitations**:

  - The procedure cannot assign priors or utilities for us. That requires expert judgment.
  - It cannot account for very complex decision spaces (e.g., continuous decisions) without simplification.
  - It assumes that the information is used optimally (i.e., we update by Bayes and choose the best action). In practice, the board might not update correctly.

  But it will catch the most common pitfalls: information that isn't actionable, or that doesn't update our beliefs, or that corrupts the study.
answer: |-
  Here's a practical, step-by-step decision procedure based on Good's theorem, designed for your 15-minute grant review meetings. It uses simple questions to catch hidden pitfalls and flags where judgment calls are needed. The core principle: **Only delay the decision if the information could change your funding action AND the expected value outweighs the delay cost.**

  ### The Decision Procedure (Whiteboard-Friendly)
  **Write these questions on the board and answer sequentially. Stop if any "NO" or "UNCLEAR" triggers a rejection or vote.**

  1. **"Can this information change our funding decision?"**  
     - *What to discuss:* If the pilot results won't alter whether you fund/reject the proposal or which design you fund, the information is useless for decision-making.  
     - **YES → Proceed to Q2**  
     **NO → REJECT PILOT (No action change = zero value)**  
     *Judgment call?* NO (Pure logic)  

  2. **"Are prior probabilities fixed and independent?"**  
     - *What to discuss:* Could the pilot itself alter the true state of the world (e.g., by contaminating the main sample) or make priors invalid? If yes, Good's theorem breaks.  
     - **YES (Priors fixed) → Proceed to Q3**  
     **NO (Priors corrupted) → FLAG FOR VALUES VOTE**  
     *Judgment call?* YES (Requires debate on study design)  

  3. **"Is the pilot outcome genuinely uncertain?"**  
     - *What to discuss:* If you already know what the pilot will show (e.g., obvious hypotheses), it can't update your beliefs.  
     - **YES (Uncertain) → Proceed to Q4**  
     **NO (Predictable) → REJECT PILOT (No belief update)**  
     *Judgment call?* NO (Fact-based)  

  4. **"Can we estimate rough probabilities and impacts?"**  
     - *What to discuss:* Assign rough numbers:  
       - **P(Low-success scenario)** without pilot (e.g., 30% chance survey fails).  
       - **Cost of being wrong** (e.g., $10k wasted if flawed survey funded).  
       - **Pilot's accuracy** (e.g., 80% chance it detects flaws).  
     - **YES (Estimates possible) → Proceed to Q5**  
     **NO (Too vague) → FLAG FOR VALUES VOTE**  
     *Judgment call?* YES (Team must agree on ballpark numbers)  

  5. **"Does EV > Delay Cost?"**  
     - *Calculate crude Expected Value (EV) of pilot info:*  
       `EV = [P(Low-success) × Cost of being wrong × Pilot accuracy]`  
       *Example:* EV = (0.3 × $10k × 0.8) = **$2.4k**  
     - *Estimate Delay Cost:*  
       Opportunity cost of holding funds (e.g., $1k/day × 30 days = **$30k**).  
     - **EV > Delay Cost → APPROVE PILOT**  
     **EV ≤ Delay Cost → REJECT PILOT**  
     *Judgment call?* YES (Cost/benefit tradeoff requires vote)  

  ---

  ### Case Applications
  **Case 1: Pre-test survey questions (30 people before 500-person study)**  
  - **Q1 (Action change?):** YES. Bad questions → reject funding; good questions → approve.  
  - **Q2 (Priors fixed?):** YES. Pre-test sample isn't part of main study (assume separate subjects).  
  - **Q3 (Uncertain?):** YES. Unknown if questions will confuse respondents.  
  - **Q4 (Estimates?):**  
    - P(Flawed questions) = 40% (based on team's inexperience)  
    - Cost if wrong = $20k (wasted grant funds)  
    - Pilot accuracy = 70% (small sample)  
    - EV = 0.4 × $20k × 0.7 = **$5.6k**  
  - **Q5 (EV > Delay?):**  
    - Delay cost (1 month) = $15k (other grants stalled)  
    - $5.6k < $15k → **REJECT PILOT**  
  - **Verdict:** REJECT. Math says delay cost > EV.  

  **Case 2: Peek at census data before neighborhood sampling**  
  - **Q1 (Action change?):** YES. Could shift sampling to higher-impact neighborhoods.  
  - **Q2 (Priors fixed?):** YES. Census data is external; doesn't alter reality.  
  - **Q3 (Uncertain?):** YES. New data might reveal unexpected trends.  
  - **Q4 (Estimates?):**  
    - P(Suboptimal choice) = 50% (without latest data)  
    - Cost if wrong = $15k (lower policy impact)  
    - Pilot accuracy = 90% (reliable source)  
    - EV = 0.5 × $15k × 0.9 = **$6.75k**  
  - **Q5 (EV > Delay?):**  
    - Delay cost (2 weeks) = $7k  
    - $6.75k ≈ $7k → **FLAG FOR VALUES VOTE**  
  - **Verdict:** Toss-up. Vote on whether societal impact of better sampling justifies $250 net loss.  

  **Case 3: Pilot can't change funding decision (Hidden misfire)**  
  - *Context:* Team wants to calibrate sensors, but you’ll fund the study regardless.  
  - **Q1 (Action change?):** NO. Grant approved either way → **REJECT PILOT**.  
  - **Why it fails:** Information has no "action value" (Q1). Even if useful scientifically, it doesn’t change *your decision*.  

  ---

  ### Honest Limitations
  - **What this can’t do:**  
    - Handle deeply uncertain priors (e.g., unprecedented research).  
    - Quantify abstract costs (e.g., "reputational risk").  
    - Replace expert intuition for complex designs.  
  - **Where judgment dominates:**  
    - Q2 (priors corrupted), Q4 (estimates), Q5 (cost/benefit tradeoff).  
    - In close calls (e.g., Case 2), values > math.  
  - **Red flags:**  
    - Teams using pilots to "fish" for publishable results (violates Q2).  
    - Pilots that are logically inseparable from the main study.  

  **Bottom line:** This procedure forces rigor in 15 minutes by separating factual checks (Q1, Q3) from values votes (Q2, Q4, Q5). It kills "nice-to-have" pilots that don’t change decisions and flags when math reaches its limits.
