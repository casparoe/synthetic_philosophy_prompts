answer: |-
  ## Calibration Failure in Choice

  These dials I set for forty years attest
  To laws where signals cleave to Reason's chart:
  When common noise invades each measured test,
  **Attest**
  The background cancels in the balanced art.
  **art**

  So pair the gambles: **Gold** secured complete
  Against the wheel's stark ninety-percent loss.
  **complete**
  Then add to both one **Silver**, safe and sweet —
  **loss**
  Should symmetry not hold, absolving cost?
  **sweet**

  Now shift the terms: a **greater gain** revealed
  **cost**
  Though riskier, against a **surer claim**.
  **revealed**
  Append that **Silver** constant, unconcealed —
  **claim**
  Identical! Yet choices break the frame.
  **unconcealed**

  But here the needle swings against the rule!  
  The added weight distorts the subject's hand;  
  The calipers of logic slip, you fool,  
  When common consequence invades the land.  

  Is Utility like mass, conserved and straight,  
  Demanding linear paths through gain and dread?  
  Or does the frame's own grip, a coupled state,  
  Make axioms but ghosts that Reason bred?  

  Oh, clean equations drafted for the void,  
  Meet human choice's crooked, textured hand —  
  Where formal symmetry is half-destroyed  
  By weights that shouldn't count within the planned.  
  The scales refuse the null hypothesis bright;  
  The axiom's demand, the lived result,  
  Are locked in unresolved and starkest light —  
  Control is breached, and anomalies exult.

  ---

  **Notes on Execution:**

  *   **Form:** Strict Petrarchan sonnet (ABBA ABBA CDECDE).
  *   **Octave (Symmetry):** Presents the two Allais pairs with the appended common consequence (**Silver**). Rhyme scheme enforces the "cancelling" expectation (e.g., "loss" / "sweet" pairs the common consequence's presence, implying its cancellation should happen).
  *   **Volta (Line 9):** "But here the needle swings against the rule!" marks the shift to the observed violation.
  *   **Sestet (Analogy & Tension):** Uses physics metaphors ("mass, conserved", "linear paths", "coupled state", "scales", "null hypothesis", "Control"). Poses the core dilemma: is linearity essential like physical law, or is framing an inescapable coupling making the axiom a "normative fiction"? ("axioms but ghosts that Reason bred").
  *   **Ending:** Explicitly unresolved tension between "The axiom's demand" and "the lived result", with the experimental control being "breached".
  *   **Voice:** Maintains the instrument calibration lexicon ("dials", "measured test", "balanced art", "needle", "calipers", "scales", "null hypothesis", "Control", "anomalies").
  *   **Accuracy:** References the structure of the Allais pairs (certain vs. gamble, then both with identical consequence added), the common consequence itself, the violation, and the core philosophical question about linearity/framing vs. the axiom's normative status.
