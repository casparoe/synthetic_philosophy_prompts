  The assassination dilemma is particularly thorny - it combines all the conflicting elements: active harm (bad karma), massive harm reduction, and the bodhisattva's special role. Their flip-flopping here makes perfect sense because it sits at the collision point of their principles. 

  I notice their reasoning implicitly uses proximity thresholds: they reject harming when it's physically direct (surgeon) or relationally close (parent), but accept it when consequences are catastrophic and alternatives scarce (tyrant, murderer-at-door). The mosquito case is key - it shows they intuitively weigh sentient beings unequally when stakes are life-or-death. 

  For a unified principle, I'm considering "contextual harm minimization with agent-relative constraints." This would explain: 
