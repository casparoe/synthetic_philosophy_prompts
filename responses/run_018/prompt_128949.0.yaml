  - Why mosquito swatting passes (no relational constraint, catastrophic stakes) 
  - Why parental neglect is wrong (violates special obligation) 
  - Why the bodhisattva case remains unresolved (constraint vs consequence tension magnified by Buddhist framework)

  The tradeoffs: they'd need to drop either their donation justification (if maintaining strong agent-relativity) or their organ harvesting objection (if going full consequentialist). Neither seems acceptable to them, so the principle stays messy. 

  For the assassination, the principle predicts paralysis: the constraint against killing clashes irreconcilably with the scale of harm prevention. Their flip-flopping isn't inconsistency - it's the system working as designed when values genuinely conflict. 

  Final note: their "gut" seems more sophisticated than their theoretical framework - they're already synthesizing duty ethics, consequentialism and Buddhist concepts without realizing it. The frustration comes from expecting one "clean" answer where hybrid approaches are inevitable.
