prompt: |-
  hey so my friend and i got into it for like three hours last night about old evidence in bayesian reasoning and that heuristic where you just presume independance between things unless you've got direct proof they're linked — he kept saying its just common sense but i think formalizing it in a hierarchical model changes everything. i need you to construct a thought experiment for me, built to specifc specs, not some generic mercury-perihelion regurgitation.

  specs:
  - realistic scene: hospital administration or workplace, one paragraph max, no sci-fi or demons.
  - there is evidence everyone already knew (old evidence) before a new causal theory gets floated.
  - inject the niche angle: one character applies the heuristic presumption of independence across organizational silos (treating wards/depts as exchangeable by default), the other builds an explicit bayesian network with a hidden confounder linking them.
  - engineer the case so the heuristic reasoner concludes the old evidence is neutral or even slightly disconfirms the new theory, while the formal model says the old evidence actually supports it once the dependency is mapped.
  - after the scenario, show me both verdicts step by step, name the exact feature doing the work, explain what breaks if you remove that feature, and tell me how the heuristic defender would try to attack the formal network.
  - no citations, no reading lists, no "see Jaynes" stuff — just reason it out.
  - and dont just lay out both options like a menu: take a committed stance on which reasoning is correct and defend it with reasons. im tired of both-sidesism after that argument.

  make sure its in the weeds enough that you cant just parrot a textbook example, but not so obscure that a small model with no web access cant follow the logic. maybe use a hidden ventilation variable linking two wards that looked isolated. and if you want to drop a typo like "recieve" somewhere feel free, its been a long night.
