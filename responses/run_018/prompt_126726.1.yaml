answer: |-
  1. Both parties acknowledge Bongard problems present six positive and six negative examples per class, requiring induction of an abstract pattern governing class membership from minimal exemplars; successful solution necessitates correctly classifying a novel instance after exposure to only one example per class.

  2. Proponents of analogical processing maintain that compositional relation-binding is a necessary cognitive mechanism for solving problems requiring explicit cross-domain mapping, as feature-space interpolation alone cannot capture abstract relational structures. Proponents of statistical induction contend that compositional relation-binding is not a necessary mechanism, as parameterized pattern recognizers can solve these problems via sophisticated feature-space interpolation without invoking explicit analogy machinery.

  3. The analogical camp interprets persistent failure on problems requiring analogies across distinct perceptual domains as evidence that systems lack genuine analogical capacity. The statistical induction camp interprets such persistent failures as demonstrating only that the training distribution was insufficient to cover the necessary feature-space manifold for interpolation in that specific problem.

  4. The central crux is whether solving a genuinely novel problem after one example per class involves constructing an explicit structural analogy or interpolating within a learned statistical manifold; both agree a decisive test case involves a left/right distinction governed by an abstract relational property (e.g., "contains a smaller element on its left") instantiated in visually dissimilar shapes sharing no low-level features. The analogy camp predicts failure without explicit relational mapping capacity; the statistical camp predicts success with sufficient pretraining covering analogous abstract relations.

  5. The substantive disagreement concerns whether solving genuinely novel, structurally complex problems after one example requires a fundamentally different mechanism (structure-sensitive comparison) versus sophisticated statistical generalization within a learned manifold; this is distinct from merely verbal disagreements over terms like "analogy" or "feature," as the core dispute centers on the cognitive/computational architecture necessary for such induction.
