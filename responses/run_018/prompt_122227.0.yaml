  2. **Second-ranked**: Universalism's structure. Is it inclusion or assimilation? This is upstream because Enlightenment universalism is key to both narratives—progress sees it as liberating, domination as homogenizing. The conceptual move needed is clarifying whether universalism can avoid assimilation by design. Tractability is moderate; it requires dissecting abstract concepts like "culture-neutral norms." If solved, it could change how we view human rights frameworks today. I'm deprioritizing related debates about colonialism since they're more empirical.

  3. **Third-ranked**: Normative commitments vs. rationalization effects. Weber's rationalization is often conflated with Enlightenment values. Untangling this is upstream because if rationalization is separable, domination critiques weaken. For instance, bureaucracy's flaws might stem from implementation, not Enlightenment ideals. Tractability is lower—it needs historical-conceptual hybrid work—but leverage is high for policy (e.g., diagnosing democratic failures). I'd lower priority if the first two questions reveal deeper issues.

