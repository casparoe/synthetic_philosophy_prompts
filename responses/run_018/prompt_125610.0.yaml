answer: |-
  ### Dream Experience Taxonomy: A Sorting Instrument  
  *(for when you're tired of the same old arguments)*  

  Start here:  
  **Q1. Does any phenomenal content (feels, images, etc.) occur *during* REM sleep?**  
  - **No** → **Leaf 1: Hard Denial**  
    *Position:* Unnamed (e.g., radical eliminativists).  
    *Awkward commitment:* "All dream reports are confabulations — waking brains just make shit up for no reason."  
  - **Maybe** → **Leaf 2: Agnostic Limbo**  
    *Position:* Unnamed (cowardly fence-sitters).  
    *Awkward commitment:* "We can't rule out dream content, but we also can't say anything useful — so why bother?"  
  - **Yes** → Proceed to Q2.  

  **Q2. If content occurs, is its *unreportability during sleep* a knock-down reason to deny it’s an experience?**  
  - **Knock-down** → **Leaf 3: Verificationist Denial**  
    *Position:* Malcolm-style verificationism.  
    *Awkward commitment:* "Even if your brain screams ‘I’m dreaming!’ in real-time fMRI, it’s not an experience unless you can *say* it."  
  - **Gap only** → Proceed to Q3.  

  **Q3. When you recall a vivid dream, was the narrative unfolding in real-time during REM?**  
  - **No, constructed retroactively** → **Leaf 4: Retrospective Construction**  
    *Position:* Dennett-esque revisionism.  
    *Awkward commitment:* "Your 20-minute dream epic was actually a 0.5-second ‘flash’ — your brain lied about the timeline."  
  - **Yes, real-time** → Proceed to Q4.  

  **Q4. Given REM atonia (paralysis) + no working-memory encoding, does this prevent "full" experience?**  
  - **Yes, it matters** → **Leaf 5: Fragmentary Real-Time**  
    *Position:* Unnamed (e.g., neuro-skeptics).  
    *Awkward commitment:* "Dreaming you’re running *feels* real, but without muscle feedback or memory encoding, it’s just a glitchy hallucination."  
  - **No, doesn’t matter** → **Leaf 6: Full Real-Time Experience**  
    *Position:* Traditional phenomenal realists (e.g., Hobson).  
    *Awkward commitment:* "Your paralyzed, amnesic dream-self has identical experiential richness to waking life — somehow."  

  ---  
  **Unoccupied Combo:** *Real-time narrative + intact working-memory access during REM*.  
  - **Status:** Unexplored (and likely unattractive). Why? Working memory is offline in REM — claiming otherwise ignores basic neuro.  

  ---  
  **Diagnostic Cheat Sheet** (concrete cases to force commitments):  
  - **For Q1/Q2:** *If someone signals a lucid dream in real-time via eye movements, does that "fix" reportability?*  
    → Verificationists say: "Nope, still not ‘reporting’ like waking speech."  
    → Others say: "Hell yes — it’s game-over for unreportability."  
  - **For Q3:** *You wake with a vivid 20-minute story. Was it playing second-by-second in REM?*  
    → Real-timers: "Yep, it was a blockbuster in your head."  
    → Retro-folks: "Nah, your brain compressed/loaded it like a zip file on waking."  
  - **For Q4:** *Dreaming of running while paralyzed with no memory encoding — still "full" experience?*  
    → Fragmentary: "It’s a sketch, not a masterpiece."  
    → Full Experience: "Just like awake running, minus the sweat."  

  **Tree Limitations:**  
  - Can’t distinguish *Hard Denial* from *Verificationist Denial* on pure behavioral grounds (both dismiss reports).  
  - *Fragmentary Real-Time* vs. *Retrospective Construction* might blur if you think dreams are "edited" retroactively *and* fragmentary.  

  Summary: The deepest split is whether unreportability kills experience or just hides it.  
