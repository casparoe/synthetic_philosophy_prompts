  I'm moderating a Q&A for a small philosophy-of-science podcast, and next week's guest is a philosopher-physicist who defends Gödel's rotating-universe argument that objective temporal passage isn't real. I want eight to ten questions that go beyond having her just restate the solution to Einstein's field equations. I need at least one on how closed timelike curves in those rotating models are meant to undermine the reality of time rather than just showing global syncronization fails; one on whether Gödel's mathematical Platonism—his view that numbers exist timelessly—makes his cosmological argument circular or redundant; and one on the modern reply that local proper time along every worldline is still perfectly real even without a global slice. For each of those three, include a follow-up keyed to the answer she's likely to give: probably that local time is derivative, that Platonism actually grounds the unreality claim, and that CTCs violate causal order in a way physical theories can't tolerate. Also ask about whether she thinks the argument survives in non-rotating but spatially closed universes, and about what she makes of the charge that Gödel was just doing mathematics and shouldn't recieve philosophical conclusions from it. Start with the questions themselves, no preface or commentary, and please avoid generic stuff like "what drew you to philosophy?"
