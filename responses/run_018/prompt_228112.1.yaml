prompt: |-
  So I run a little philosophy reading group at work (we're a fintech, mostly backend engineers, no-one has any formal philosophy training) and we've just finished a six-week block on vagueness and the sorites paradox. I said I'd put together an end-of-block written assessment, the way you would for an internal training course, and I'm now realising that writing a good exam question is way harder than writing a good code review.

  Here's the angle I want. Early on we read Bertrand Russell's 1923 paper "Vagueness", and one bit really stuck with me because it sounds like something out of an engineering spec review:

  "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."

  My instinct as an engineer reading this is: fine, vagueness is just tolerance bands and measurement error, and the fix is to pick a cutoff and enforce it -- we do this constantly, e.g. a monitoring alert fires when latency exceeds 500ms, full stop, no paradox. But the group pushed back and said that just relocates the sorites rather than solving it, and that Russell's metre point is about something different from the bald-man case anyway. I want an exam question that forces people to actually take a position on this rather than summarise both sides.

  So please write me:

  1. The exam question itself. It should quote or paraphrase the Russell passage (that bit shouldn't count towards the word limit), ask candidates to say whether the engineering-style "just set a threshold" response dissolves the sorites or merely moves it, and require them to explain whether Russell's metre example and the standard heap/baldness cases are the same kind of vagueness or different kinds. Answerable in about 45 minutes, aimed at smart people with zero philosophy background, and it should be impossible to answer well by just reciting "a heap minus one grain is still a heap".

  2. A model answer of around 500 words, written at the level of the sharpest person in the group.

  3. A marking scheme, out of 20 marks.

  For the marking scheme, give it to me as a JSON object (I'll paste it straight into our internal tool) with this exact structure:

  {
    "total_marks": 20,
    "criteria": [
      {
        "name": short label for the criterion,
        "marks": integer,
        "full_marks_requires": the specific move an answer must make to get full marks on this criterion,
        "typical_failure": the specific way a weaker answer usually falls short on it
      }
    ],
    "grade_boundaries": {
      "distinction": minimum mark for a distinction,
      "pass": minimum mark for a pass
    }
  }

  Between four and six criteria please. The criteria should reward the actual conceptual moves (e.g. distinguishing vagueness from mere measurement imprecision, explaining why a stipulated cutoff has to be either arbitrary or itself vague) rather than rewarding people for namedropping philosophers, which half the group will definitely try.
reasoning: |-
  We are creating an exam question that forces candidates to engage with the engineering perspective on vagueness (setting thresholds) versus the philosophical problem of the sorites paradox. The question should focus on whether setting a threshold dissolves the sorites or merely relocates it, and whether Russell's metre example is the same kind of vagueness as the heap/baldness cases.

  Exam Question:

  ```
  Bertrand Russell, in his 1923 paper "Vagueness", writes:

      "The metre, for example, is defined as the distance between two marks on a certain rod in Paris, when that rod is at a certain temperature. Now the marks are not points, but patches of a finite size, so that the distance between them is not a precise conception. Moreover, temperature cannot be measured with more than a certain degree of accuracy, and the temperature of a rod is never quite uniform. For all these reasons the conception of a metre is lacking in precision."

  One common engineering response to such vagueness is to set a precise threshold (e.g., "a metre is exactly 1000 millimeters, and we define the length by a standard procedure that includes a tolerance band of ±0.1mm"). This approach might be used in a system alert (e.g., "latency over 500ms is unacceptable").

  Does this engineering-style response (setting a threshold and tolerances) dissolve the sorites paradox for the concept of a metre, or does it merely move the vagueness elsewhere? In your answer, also address whether Russell's metre example and the classical sorites cases (like heaps or baldness) are instances of the same kind of vagueness, or whether they are fundamentally different.

  Your response should be approximately 500 words. Avoid merely reciting the sorites paradox; instead, focus on the specific issues raised by the engineering approach and the comparison between the examples.
  ```

  Model Answer (approx 500 words):

  The engineering approach of setting thresholds and tolerances does not dissolve the sorites paradox; it merely relocates the vagueness to the boundaries of the tolerance band. Russell's metre example and the classical sorites cases (like heaps) both involve vagueness, but they are different in kind: the metre case is epistemic (about our knowledge) and the heap case is semantic (about meaning).

  In the metre example, the vagueness arises from physical limitations: the marks have finite size, temperature measurement is imprecise, and the rod's temperature is non-uniform. The engineering fix specifies a tolerance band (e.g., ±0.1mm) and a standard measurement procedure. This makes the concept of a metre precise for practical purposes. However, the sorites paradox reappears at the edges of the tolerance band: is a length of 999.95mm within tolerance? We might set a sub-tolerance (e.g., ±0.01mm for measurement error), but then the same problem arises at the new boundaries. The vagueness is pushed to a different level (now about the tolerance band) but not eliminated.

  In contrast, the classical heap paradox is about the meaning of the word "heap". There is no physical limitation preventing us from counting grains; the vagueness is inherent in the concept. Even if we set a threshold (e.g., 10,000 grains is a heap), the number is arbitrary. Why 10,000 and not 9,999? The sorites argument applies directly to the concept: removing one grain from a heap leaves a heap. The vagueness is semantic, not epistemic.

  Russell's metre example is fundamentally about measurement imprecision, which is epistemic: it stems from our inability to know the exact length due to limitations in our instruments and methods. The length itself might be precise (if we believe in a physical reality), but we cannot measure it exactly. The heap case, however, is semantic: there is no fact of the matter about the exact number of grains that makes a heap. Even with perfect knowledge, we would not know where to draw the line.

  The engineering response works well for practical purposes in the metre case because we can stipulate a cutoff and enforce it, and the tolerance band is chosen based on practical needs (e.g., manufacturing capabilities). But this does not resolve the philosophical problem of vagueness. It merely replaces one vague concept (a metre) with another (the tolerance band). The sorites paradox then applies to the tolerance band: how much deviation is acceptable? We can set a sub-tolerance, but then the same issue recurs.

  Thus, the two examples are different: Russell's metre vagueness is reducible to measurement error and can be managed (though not eliminated) by engineering tolerances, while the heap vagueness is inherent in the concept and cannot be fixed by stipulation without arbitrariness. The engineering approach moves the vagueness but does not dissolve it, because at each level of specification, there remains a boundary that is vulnerable to the sorites regression.

