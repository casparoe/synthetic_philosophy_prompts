prompt: |-
  I'm trying to work out whether Buddhist ethical evaluation is best read as a mental-state consequentialism—where the moral quality of an act is fixed by the root volition (cetana) and its karmic fruit is a separate, non-aggregable consequence—or as a view that genuinely cares about suffering-reduction but restricts permissible means. Here are my concrete verdicts. A surgeon performs a painful but life-saving operation with genuine compassion: excellent, even though she caused pain. A commander orders a retreat that saves a thousand soldiers but leaves fifty behind to be executed; he feels only sorrow, no hatred: the decision was necessary, yet he still bears a heavy moral stain that the saved thousand do not cancel. A teacher lies to a struggling student, saying she has talent, and the student eventually masters the craft: wrong, because false speech corrupts the mental continuum regardless of the beneficial result. A monk uses funds he knows were stolen to build a hospital that saves hundreds; he feels no greed, only concern for suffering: the hospital should stand, but his acceptance of tainted resources remains ethically defective in a way that the lives saved do not wash away. A father strikes his child in anger to stop him from running into traffic, and succeeds: blameworthy, because the presence of aversion in the volition makes the act unwholesome despite the child's survival.

  These point to a principle in which the ethical quality of an act is set by the presence or absence of greed, hatred, and delusion in the root mental state, while outcomes determine only the scope of karmic ripening, not the agent's moral evaluation. But I keep hesitating about the commander: if outcomes never cancel stains, why does his sorrow matter at all? And what about the ruler who orders the execution of one innocent person to prevent a riot killing hundreds, feeling only sorrow and no hatred—does he bear the same stain as if he had killed in rage?

  State the best principle or pair of candidates that captures my pattern, predict its verdict on the ruler case, and be explicit about which of my five verdicts it forces me to drop. Lead with the bottom line; keep the response under 350 words; do not offer citations, bibliographies, or reading lists.
reasoning: |-
  Okay, the user is grappling with how to interpret Buddhist ethics, specifically whether it's a form of mental-state consequentialism or something else. They've presented five scenarios with their own verdicts, and they're seeking a coherent principle that explains these judgments consistently. 

  The user's scenarios reveal a clear pattern: they consistently prioritize the purity of intention (absence of greed, hatred, delusion) over outcomes. Even when actions lead to suffering-reduction, they assign moral "stain" if the root volition is tainted. But their hesitation about the commander case shows tension—if outcomes don't matter, why mention the commander's sorrow? 

  Hmm, the surgeon case is key: pain is caused, but compassion makes it "excellent." Conversely, the father's life-saving act is blameworthy due to anger. This suggests the core principle is indeed about the mental state's purity, not outcome aggregation. 

  The complication is the commander/ruler dilemma. If sorrow doesn't mitigate the "stain" of causing harm (as per the user's verdict), then the ruler who kills one innocent to save hundreds should bear full moral stain—same as if he acted in rage. But this feels counterintuitive, which might be why the user hesitates. 

  The user's verdict on the monk clinches it: even saving lives doesn't purify the act of accepting stolen goods. So the only consistent principle is that outcomes never cancel the karmic stain of unwholesome volition. This forces dropping the idea that the commander's sorrow makes his act "necessary but stained"—if the volition was pure (no hatred), why is it stained at all? 

  Ah, there's the rub. To uphold all other verdicts strictly, we must say: if the commander/ruler truly had no hatred (only sorrow), the act shouldn't bear a "stain"—but the user insists it does. So the principle must be adjusted: the stain arises from the act itself (killing) regardless of intention, which contradicts the mental-state focus elsewhere. 

  Final take: the user's pattern best fits "Intrinsic Volitional Quality," where moral quality is fixed solely by the root volition's purity. This forces dropping the commander's "stain"—if he felt no hatred, no stain exists. The ruler case then gets no stain. But this means the user must abandon their verdict that the commander bears guilt despite sorrow. The alternative ("Karmic Non-Aggregation") preserves that verdict but makes intention irrelevant in harm cases, breaking consistency with the surgeon/father examples. 

  The user's deepest struggle seems to be reconciling non-violence with consequentialist instincts. Their intellect leans toward mental-state purity, but their intuition balks at absolving harm-doers, even with good intentions. That tension is at the heart of Buddhist ethics debates.
answer: |-
  **Bottom line:** Your pattern is best captured by **Karmic Non-Aggregation**: The ethical quality (*kusala/akusala*) of an act is determined solely by the presence or absence of the unwholesome roots (greed, hatred, delusion) in the root volition (*cetana*). Outcomes determine the *scale and nature* of karmic fruit (*vipāka*) but cannot cancel the intrinsic moral stain or merit generated by the volition itself. Good outcomes don't purify bad roots; bad outcomes don't taint good roots.

  **Ruler Verdict:** The ruler bears a heavy moral stain identical to killing in rage. His sorrow is irrelevant to the act's *kusala/akusala* quality. Causing death intentionally (rooted in delusion about the permissibility of killing, even for "good") is unwholesome (*akusala*), regardless of his sorrow or the lives saved. The beneficial outcome affects only the karmic fruit's manifestation, not the act's moral evaluation.

  **Verict You Must Drop:** You must drop the **Commander's verdict**. If outcomes never cancel stains, then the commander's sorrow is also irrelevant to the act's *moral quality* (stain). If the retreat order involved intentional abandonment knowing it meant their deaths (rooted in delusion), it is *akusala* and bears a stain. If his volition was truly pure (only sorrow, no ill-will or delusion about the act's nature), there should be *no* moral stain at all. Your description ("necessary, yet he still bears a heavy moral stain") is inconsistent with a purely volition-based principle; it implies the outcome (leaving them) *creates* a stain that the volition (sorrow) doesn't prevent, contradicting the surgeon, teacher, monk, and father cases where volition alone sets the quality. Karmic Non-Aggregation forces a binary: either the volition was unwholesome (stain, regardless of sorrow/outcome) or wholesome (no stain, regardless of outcome).

  **Principle Clarified:**
  1.  **Ethical Quality (Kusala/Akusala):** Fixed at the moment of volition by the presence/absence of greed, hatred, delusion.
  2.  **Karmic Fruit (Vipāka):** Determined by the nature and scale of the action/intention *and* its outcome, but is a separate consequence accruing to the agent, not altering the original act's moral quality. Benefits don't erase bad roots; harms don't negate good roots.
