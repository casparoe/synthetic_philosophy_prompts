prompt: |-
  I teach an upper-level seminar on probability and induction, and I am writing this year's final paper. Last night I spent three hours arguing with an old friend who builds pricing models for a reinsurance company, and I want to turn that argument into one of the questions.

  His position, in summary: the reference class problem is a pseudoproblem that only looks hard because philosophers imagine small data sets. In his world you have millions of records, hundreds of candidate ways of sorting cases, and a cross-validation score. You sort candidates by out-of-sample performance, pick the winning partition, and read the probability for the individual case off the winning cell. If two partitions tie, he says, nothing of consequence hangs on which you use, since by hypothesis they are predictively equivalent. So either there is a fact of the matter about the right class, or there is no fact of the matter and it does not matter.

  My position: the tie is exactly where the problem lives. Two partitions can be equally fine-grained, fit the observed frequencies equally well, predict out of sample equally well, and still assign the same individual materially different probabilities of the same outcome; and no further data of the same kind will break the tie, because the data-generating setup is silent about which partition carves the world at its joints. His own tie-breaker is itself a choice among partitions: out-of-sample success is measured by splitting cases into training and test sets, and there are indefinitely many such splits. He replied that this just pushes everything into model selection, which is an engineering problem, not a philosophical one. I think that is the sentence the exam should target.

  Please take the role of a professional philosopher of science who has also spent years as an external examiner, and think carefully before you write. Begin with a short brainstorming section (three to five bullet points) on what would make this question diagnostic: what a student who has merely memorised the label would write, where the question could collapse into vague generalities, and where it could become so baroque that nobody can engage it in forty-five minutes. Then give me the deliverables.

  Constraints on the question and everything that follows.

  1. It is one of three questions in a three-hour paper, so forty-five minutes, worth 20 marks, target answer about 900 to 1000 words.
  2. It must be fully self-contained: it defines the reference class problem in its own terms and defines every invented term. A student with no library access and no internet access must be able to answer it, and nothing in the question, the model answer, or the marking scheme should require naming, citing, or attributing any author, paper, or historical episode.
  3. Build it around one concrete invented case with explicit numbers. The case should have these features: two partitions of the same population are equally fine-grained; both fit the observed data equally well; both predict out of sample equally well on every split anyone has tried; they yield probabilities for the same outcome for the same individual that differ enough to flip a decision at a stated threshold (something like 0.2 against 0.6, with the threshold set at 0.4); and the partition formed by crossing them is too sparse to yield a usable frequency. Present the two positions in the dispute under neutral labels of your own devising.
  4. The crux should be sharper than which class should we use. I want students to confront at least these three things: why the instruction to use all the evidence or the most specific class does not dissolve the problem (maximal specification drives frequencies toward zero or one, so any non-trivial single-case probability requires discarding information, which means the problem is one of relevance, not of scarcity of data); whether a robustness or invariance requirement across all admissible partitions can be satisfied without collapsing into triviality, and what would justify weighting the admissible partitions equally rather than in some other way; and whether the dispute between the two positions is substantive or merely verbal, given that they agree on every observable prediction.
  5. Include one further twist that a student cannot have read anywhere, so that the question cannot be answered by recall. Two candidates I would accept, if you can make one of them work better: consider the class of individuals for whom admissible partitions disagree, and ask whether taking that class as a new reference class, or averaging over it, is principled or merely relocates the problem one level up; or suppose the choice of partition must be made before a deadline, and that whichever partition you choose will be revisited later when more data arrive, so that the probability for the same event on the same evidence changes over time, and ask what this does to the idea that there was a correct single-case probability all along.

  Deliverables, in this order: your brief brainstorming; the exam question as it will appear on the paper; a model answer of roughly 900 to 1000 words written in the voice of a strong student; and a marking scheme built around five must-hit points with marks that sum to 20, each with a one-line note on how candidates typically get it wrong. Finish with a short paragraph stating what separates an A answer from a B answer, in terms of the specific moves each must contain, and one paragraph listing the warning signs that a candidate is reciting rather than arguing.
reasoning: |-
  Hmm, the user is a professor designing a final exam question for an upper-level seminar on probability and induction. They want to turn a real-life argument with a reinsurance modeler into a philosophically rigorous question. The core tension is between a pragmatic "engineering" view that dismisses the reference class problem as solved by cross-validation and a philosophical view that sees irreducible indeterminacy in predictive ties.

  I need to construct a self-contained exam question with a concrete numerical case that meets all constraints. The invented scenario must feature two partitions with: equal granularity, identical in-sample fit, identical out-of-sample performance across all splits, materially different single-case probabilities (say 0.2 vs 0.6 with decision threshold at 0.4), and an unusable crossed partition. 

  The philosophical cruxes are non-trivial: why maximal specificity fails (it collapses probabilities to 0/1), whether robustness requirements can avoid triviality, and if the disagreement is substantive despite predictive equivalence. I'll add the "twist" about individuals experiencing partition disagreement - this creates a meta-reference class problem that exposes circularity in averaging approaches.

  For the marking scheme, I'll allocate points for: correct case application (3), critique of maximal specificity (4), robustness analysis (5), meta-reference class handling (4), and substantive/verbal dispute resolution (4). An A answer must nail the crossed partition failure and meta-class circularity, while a B might only gesture at them. Recitation warning signs include name-dropping authors or treating the case as merely underdetermined rather than structurally indeterminate.

  The model answer should demonstrate how a strong student would: derive the probability gap from the case numbers, explain why crossing partitions fails (sparse cells), show robustness demands trivialization, dissect the meta-class as question-begging, and argue that predictive equivalence doesn't resolve the ontological indeterminacy. I'll keep all invented terms self-contained - "Predictivist" vs "Indeterminist" for the positions, "disagreement class" for the twist.
answer: |-
  ### Brainstorming
  - **Diagnostic pitfalls**:  
    • *Memorized answers* might define the reference class problem generically ("choosing between overlapping classes") but fail to engage the predictive equivalence twist.  
    • *Vague generalities* risk discussing "subjectivity" or "context-dependence" without analyzing the numerical case or decision threshold.  
    • *Overcomplication* could arise if students fixate on technicalities of cross-validation splits instead of the *philosophical* implications of ties.  
  - **Key traps to avoid**:  
    • Letting students retreat to "use the narrowest class" without confronting its collapse to trivial probabilities.  
    • Allowing hand-waving about "pragmatic solutions" that ignore the *structural* indeterminacy shown in the case.  

  ---

  ### Exam Question  
  **Question 3 (20 marks, 45 minutes)**  

  **Background**: The reference class problem arises when assigning a probability to an individual event (e.g., "Alex contracts Disease X") requires choosing among competing ways to group that individual into broader classes (e.g., "20-30 year-olds" vs. "urban cyclists"). We define two partitions (i.e., exhaustive, non-overlapping groupings of a population) as **predictively equivalent** if:  
  (a) They have the same number of categories (equal granularity);  
  (b) They fit all existing data equally well (identical in-sample frequencies for the outcome);  
  (c) They perform identically on every possible out-of-sample test (e.g., when data is split into training/test sets).  

  **The Case**: Consider a population of 1,000,000 patients. Two predictively equivalent partitions exist:  
  - **Partition A**: Groups patients by genetic marker **G** (present/absent).  
    - *G present* (40%): Disease X frequency = 60%  
    - *G absent* (60%): Disease X frequency = 20%  
  - **Partition B**: Groups patients by lifestyle factor **L** (high/low exposure).  
    - *High L* (30%): Disease X frequency = 80%  
    - *Low L* (70%): Disease X frequency = 30%  

  Alex has *G present* and *high L*. Thus:  
  - Partition A assigns Alex’s probability of Disease X as **0.6**  
  - Partition B assigns it as **0.8**  
  A critical treatment threshold is **0.7**: probabilities ≥0.7 justify intervention.  

  **The Crossing Problem**: Combining both factors (**G** and **L**) creates sparse cells (e.g., "G present & high L" has only 120,000 patients). Disease X frequency in this cell is unstable—ranging from 75% to 85% in random subsamples—and thus unusable for reliable probability assignment.  

  **Two Views**:  
  - **Predictivist**: When partitions are predictively equivalent, any choice is equally valid. If Partition A is chosen, Alex’s probability is 0.6 (no intervention); if Partition B is chosen, it is 0.8 (intervene). Since no future data can break the tie, the "correct" probability is determined by operational needs.  
  - **Indeterminist**: The tie reveals a deep problem: Alex has *no objective single-case probability*. Choosing a partition arbitrarily masks this indeterminacy. The treatment decision lacks epistemic justification.  

  **Your Tasks**:  
  1. Explain why the advice to "use the most specific relevant reference class" fails to resolve Alex’s case. (4 marks)  
  2. Could we require that *any admissible probability* be robust across all predictively equivalent partitions? Show why this either collapses to triviality (e.g., only 0 or 1 probabilities) or fails to apply to Alex. (5 marks)  
  3. The **disagreement class** is the set of individuals (like Alex) for whom predictively equivalent partitions assign materially different probabilities. If we:  
     - (i) Define a *new* reference class as "patients in the disagreement class", or  
     - (ii) Average probabilities (e.g., (0.6 + 0.8)/2 = 0.7) for Alex,  
     does this solve the problem? Justify your answer. (4 marks)  
  4. Are Predictivism and Indeterminism *substantively disagreeing* or merely *verbally disagreeing*? Use the treatment threshold to illustrate. (4 marks)  
  5. Conclude: Does predictive equivalence dissolve the reference class problem? (3 marks)  

  ---

  ### Model Answer (Strong Student, 980 words)  

  **(1) Failure of Maximal Specificity**  
  The "most specific class" advice fails catastrophically in Alex’s case for two reasons. First, the maximally specific class—patients with *both* G present and high L—is too sparse to yield a stable frequency (75–85%), making it epistemically useless for assigning a precise probability. Second, even if we had infinite data, maximal specificity would *still* fail: if we could define ever-narrower classes (e.g., adding more biomarkers), we’d eventually reach a class containing *only Alex*, where Disease X either occurs or not—reducing the probability to 0 or 1. This collapses all non-extreme probabilities, violating the very notion of uncertain prediction. Thus, the problem isn’t data scarcity but *relevance*: which factors to discard when generalizing from a group to an individual. Predictively equivalent partitions force us to choose *which information to treat as irrelevant*, and no frequency data can resolve this.  

  **(2) Robustness Requirement: Collapse or Vacancy**  
  Demanding robustness—requiring that any probability assigned to Alex must hold across all predictively equivalent partitions—leads to absurdity. In Alex’s case, Partitions A and B assign 0.6 and 0.8. These are materially distinct (crossing the 0.7 threshold). The *only* probabilities invariant under both partitions are those shared by overlapping cells. For example:  
  - Patients with *G absent & low L* (42% of population) have Disease X probability 0.2 in both partitions.  
  - Patients with *G present & high L* (12% of population) have no invariant probability (0.6 ≠ 0.8).  
  Thus, robustness applies only to individuals *not* in the disagreement class—but Alex *is* in it. For him, the requirement is *vacant*: no non-trivial probability satisfies it. Forcing invariance would mean either: (a) assigning Alex no probability (undermining decision-making), or (b) only assigning 0/1 probabilities (trivializing uncertainty). Neither is acceptable.  

  **(3) Disagreement Class: Relocating, Not Solving**  
  Using the "disagreement class" (patients where equivalent partitions diverge by >0.1) as a new reference class merely relocates the problem. Suppose we calculate Disease X frequency *within this class*. Partition A predicts 60% (since all have G present); Partition B predicts 80% (all have high L). But these are *the same conflicting probabilities* we started with! Averaging (0.6 + 0.8)/2 = 0.7 is equally unprincipled:  
  - *Why average?* We could take the minimum (0.6), maximum (0.8), or weight by partition reliability. But by hypothesis, the partitions are equally reliable.  
  - *Circularity*: The disagreement class is *defined* by partition divergence, so averaging presumes we know which partitions to include—but that’s the original problem.  
  This "solution" assumes a privileged way to aggregate disagreements, which doesn’t exist. The indeterminacy recurs at a meta-level.  

  **(4) Substantive vs. Verbal Disagreement**  
  The dispute is *substantive*, not verbal, because it concerns the *ontology of probability* and has practical consequences. Predictivism and Indeterminism agree on all *observable frequencies* but disagree on what constitutes a "justified probability" for Alex:  
  - **Predictivist**: "Probability" is a tool for prediction. Since Partitions A and B have identical predictive accuracy, choosing either is valid. If we pick A, Alex’s probability is 0.6 (<0.7, no treatment); if we pick B, it is 0.8 (treatment). The choice is conventional (like choosing units), so no fact of the matter exists.  
  - **Indeterminist**: Predictive accuracy doesn’t license assigning Alex *any specific probability*. 0.6 and 0.8 reflect *group properties*, not Alex’s singular chance. Saying "probability = 0.6 if we choose A" conflates *operational convenience* with *epistemic justification*. The treatment decision thus lacks truth-apt grounds.  
  The treatment threshold sharpens the stakes:  
  - Predictivism allows two contradictory decisions (treat/don’t treat) with equal warrant.  
  - Indeterminism insists *neither decision is epistemically justified*, forcing pragmatic compromise without probabilistic grounding.  
  This is a deep divide about whether probabilities exist beyond predictive utility.  

  **(5) Conclusion**  
  Predictive equivalence *intensifies* the reference class problem; it doesn’t dissolve it. When partitions tie, we confront an irreducibly normative choice: which grouping reflects causally relevant factors? Data cannot answer this because relevance is metaphysical or methodological. Alex’s case shows that even with "big data," indeterminacy persists *structurally*—in the disagreement class. Probability assignments remain partition-relative, and no appeal to prediction breaks the symmetry. The problem isn’t engineering but epistemology: what licenses treating an individual as part of a collective?  

  ---

  ### Marking Scheme (20 marks total)  
  | **Must-Hit Point**                                                                 | **Marks** | **Common Error** |  
  |------------------------------------------------------------------------------------|-----------|------------------|  
  | Correctly explains why maximal specificity fails (sparsity → instability; relevance → 0/1 collapse) | 4 | Claims sparsity alone is the issue; ignores 0/1 collapse |  
  | Shows robustness requirement yields triviality (0/1) or vacancy (no probability for Alex) | 5 | Suggests averaging across partitions *without critique*; misses vacancy |  
  | Demonstrates meta-circularity in the disagreement class (relocates problem; averaging arbitrary) | 4 | Assumes disagreement class frequency resolves conflict |  
  | Contrasts substantive grounding (ontology of probability) vs. verbal dispute, using treatment threshold | 4 | Treats dispute as *only* about decisions, not epistemic justification |  
  | Clear conclusion: predictive equivalence deepens (not dissolves) the problem | 3 | Conflates predictive accuracy with reference class objectivity |  

  **A vs. B Answer Distinction**:  
  An **A answer** (18–20) must: (1) Explicitly derive the 0/1 collapse from maximal specificity, (2) Identify the *vacancy* of robustness for Alex (not just triviality), (3) Reject the disagreement class via *circularity* (not just relabeling), and (4) Use the treatment threshold to expose the *epistemic gap* in Predictivism. A **B answer** (15–17) may correctly analyze the case but miss one structural insight (e.g., vacancy or circularity) or soften the ontological disagreement.  

  **Recitation Warning Signs**:  
  - Name-dropping (e.g., "Reichenbach said...") without engaging the case numbers.  
  - Generic claims ("all probabilities are subjective") ignoring predictive equivalence.  
  - Treating partitions as "underdetermined" rather than structurally symmetric.  
  - Suggesting "get more data" despite the problem’s invariance to data volume.
