  The luring lottery (step 2) is a thought experiment where an agent is offered a choice between:
  - A: $1 million for sure.
  - B: $1 billion if every agent in your reference class (which includes your counterparts) chooses B, and $0 otherwise.

  A superrational agent, realizing that all agents in the reference class are identical and will reason the same, will choose B because they all choose B and get $1 billion. But causally, choosing A dominates choosing B (because if you choose A you get $1 million regardless of others, while if you choose B you might get nothing). However, the superrational argument says that because of the correlation, you should choose B.

