  hey so i was workshopping an argument for a seminar and now i'm convinced it proves way too much, but i can't find the exit. it's about platonia-style coordination and the luring lottery, but i added a twist i call the echo auction. here's the chain:

  (1) in platonia, two agents with the same source code and same inputs always reach the same decision, since each can run the other's reasoning exactly.
  (2) the luring lottery shows that a superrational agent should take a causally dominated option if they can predict correlation with a counterpart.
  (3) now imagine two copies, A1 and A2, running the same algorithm but with seperate private datasets that overlap about 90%.
  (4) A1 can apply it's reasoning to A2's dataset and predict A2's belief state and subsequent actions.
  (5) if A2's belief is wrong about some shared fact, A1 knows A2 will act on that error in any platonia-style game where payoffs depend on matching choices.
  (6) so A1 should deviate and exploit the mismatch, which breaks the perfect correlation that (1) and (2) require.
  (7) but if correlation breaks whenever inputs differ, then superrational coordination is only possible for perfect clones in identical environments.
  (8) since real agents always recieve slightly different evidence, superrationality either never applies or forces all agents to suppress disagreement, which collapses subjective probability into one universal belief state.

  that feels wrong — i'd like to keep (1), (2), and (4) if i can, because those seem like the core machinery. my intuition is that the slip is between (5) and (6): just because i can predict you'll be wrong doesn't mean i have an incentive to deviate in a symmetric payoff structure. but i'm not sure how to block it without giving up the idea that reasoning is transparent across agents. also, does the echo auction help? in that setup, N copies bid in a pool where the payout goes to anyone within epsilon of the median, using noisy overlapping data. it seems like this should force convergence, but i think it actually makes the problem in (6) worse because now every agent can predict the median error. is that right, or am i mixing up the levels?

  where does this actually go wrong?
