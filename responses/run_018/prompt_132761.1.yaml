answer: |-
  ### Thought Experiment Scenario
  Two genetically isolated societies (A and B) occupy identical, resource-rich islands with matched technologies, legal frameworks allowing private ownership and capital accumulation, equitable initial resource distributions, and similar three-tier class structures. Society A embodies a secularized "inner-worldly asceticism": productive labor and meticulous accounting are intrinsic moral duties, social prestige derives solely from documented reinvestment of profits, and leisure/display is stigmatized as weak. Society B permits accumulation but culturally codes it as greedy; prestige flows from elaborate public rituals and generous redistribution, while leisure carries no social penalty. After 50 years of parallel development, both experience an identical ecological shift (e.g., toxic mineral seepage contaminating stored capital goods). This shock renders reinvestment materially irrational—marginal returns turn negative due to rapid asset degradation, and new laws (e.g., environmental maintenance fees) impose direct costs on capital holders who reinvest. Yet Society A persists for two generations: elites meticulously account for depreciating assets and reinvest 30% of surpluses into sterile upkeep, suffering net wealth declines and no concealed benefits. Society B’s elites immediately redirect surpluses into grand festivals and communal feasts, abandoning reinvestment.

  ---

  ### Verdicts by Theoretical Framework
  1. **Weberian "Elective Affinity" Account**:  
     *Verdict: Confirmed.*  
     The value-orientation in A operates as an independent causal force. Its elective affinity with rational economic conduct persists despite inverted material incentives because the *meaning* of disciplined accumulation is morally non-negotiable. Reinvestment in A endures as a "calling," demonstrating that cultural values can autonomously drive behavior counter to individual material interests.

  2. **Materialist-Reductionist Account**:  
     *Verdict: Falsified.*  
     If values were mere byproducts of material interests, A’s behavior should collapse immediately when reinvestment becomes costly. Its persistence must therefore be an illusion: either (a) hidden interests exist (e.g., A’s accountants secretly benefit from fee structures), or (b) it reflects temporary "cultural lag" (values decaying slower than material reality changes).  

  3. **Functionalist Account**:  
     *Verdict: Contradicted.*  
     Functionalism posits that values stabilize *adaptive* behaviors. Since A’s conduct is materially maladaptive (accelerating wealth loss), functionalists must deny this maladaptivity. They might argue A’s behavior fosters group cohesion under stress, or invoke *long-term* group selection (e.g., A’s discipline ensures survival if the ecological shock reverses). This requires speculative, non-empirical justifications.  

  ---

  ### Causal Mechanism & Sensitivity
  - **Structural Feature Doing Causal Work**:  
    The *inversion of material incentives* (negative returns + legal costs) under *identical institutional frameworks*. This isolates cultural values as the sole variable differentiating behavior.  
  - **Consequence of Removing the Inversion**:  
    If incentives remain positive (e.g., no ecological shock), both Weberian and materialist theories can explain A’s greater accumulation (via values or rational self-interest). The scenario becomes *underdetermined*—correlation between values and growth cannot prove causal primacy.  

  ---

  ### Reductionist Counterattack & Its Cost  
  - **Likely Reductionist Defense**:  
    Argue that A’s "moral duty" is a superstructural veil for *hidden class interests*. For example: A’s elites enforce reinvestment to maintain accounting professions that underpin their status, or to hoard depreciating assets as symbolic power tokens. Alternatively, allege the cost structure is mischaracterized—perhaps A’s "losses" are offset by intangible benefits (e.g., social control).  
  - **Explanatory Cost Incurred**:  
    This defense requires ad hoc, unobservable mechanisms ("hidden interests") to salvage materialism. It *concedes* that surface-level material incentives cannot explain the behavior, undermining materialism’s core claim of parsimony. It also fails to explain why identical class structures in B produce opposite outcomes without such hidden factors.  

  ---

  ### Key Design Achievement  
  The scenario forces theories to confront a "crucial experiment" logic: **only Weberianism predicts persistent maladaptive behavior as a direct outcome of cultural values when institutional and material conditions are held constant or inverted**. Reductionism must invoke auxiliary assumptions, while functionalism must stretch adaptationism to its breaking point.
