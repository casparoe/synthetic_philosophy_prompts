answer: |-
  Here's a rigorous audit of the heart/representation analogy in teleosemantics, mapping the correspondence, pinpointing where it collapses, and evaluating the core claims:

  ### Correspondence Table & Core Argument
  | **Biological Organ (Heart)** | **Teleosemantic Concept** | **Mental Representation** |
  |------------------------------|----------------------------|----------------------------|
  | Heart                        | Representational Mechanism | Mental state (e.g., belief)|
  | Pumping blood                | **Proper Function**        | Representing accurately    |
  | Circulatory needs            | **Content**                | Distal object (e.g., water)|
  | Natural selection history    | **Selection History**      | Evolutionary history       |
  | Valve malfunction            | **Misrepresentation**      | False belief               |

  **Core Teleosemantic Claim:** Just as a heart's *function* (pumping blood) is fixed by evolutionary history, a representation's *content* (what it's "about") is fixed by selection history. Misrepresentation is a biological malfunction, reducing intentionality to Darwinian norms.

  ---

  ### Where the Analogy Collapses

  1. **Causation vs. Aboutness (The Hard Problem of Content):**
     - **Heart:** Causes blood flow (physical causation). No "aboutness" or reference.
     - **Representation:** Must *stand for* something (semantic relation). E.g., a neuron firing "tiger" must *refer to* tigers, not just cause avoidance.
     - **Collapse Point:** Hearts *do*; representations *mean*. Teleosemantics conflates selected causal role with intentional content. A heart's function is intrinsic to its physical operation; representation requires extrinsic "aboutness."

  2. **Swampheart/Objection (History vs. Current Function):**
     - **Scenario:** Lightning forms a perfect, spontaneously created "heart" that pumps blood. It has no evolutionary history.
     - **Teleosemantic Response:** "It has no *proper function*, so it doesn't *misrepresent* even if it fails."
     - **Problem:** 
       - The swamp heart *still circulates blood successfully*. If function requires history, it has no function at all—yet it performs identically to a biological heart.
       - **Circularity:** The analogy *presupposes* history is essential to define function/content. But the swampheart shows current causal role (pumping) doesn't require history. Why is history necessary for "aboutness" if current function suffices for pumping?
       - **Conclusion Smuggling:** The analogy works only if you *already accept* that history defines content—it doesn't prove it.

  3. **Malfunction & Norms (Selection vs. Statistics):**
     - **Claim:** Biological malfunction requires a historical *design* process (selection), not just statistical deviation.
     - **Counterexample:** 
       - A modern pacemaker fails. It malfunctions *relative to its designer's intent*, not its evolutionary history.
       - A genetic mutation causes 99% of a species' hearts to pump inefficiently. Is this the *new norm*? Teleosemantics says no—norms come from historical selection, not current statistics.
     - **Collapse Point:** "Malfunction" in biology implicitly references an *idealized past design*. But representation requires *present accuracy conditions* (e.g., "water" must refer to H₂O). Statistical norms lack normative force for truth.

  ---

  ### Does the "Relaxed Conclusion" Survive?
  **Claim:** "Mental norms are just biological norms."  
  **Evaluation:** Fatally compromised by disanalogies:

  1. **Biological Norms ≠ Representational Norms:**  
     - Biological success: Survive/reproduce (e.g., false "predator" belief may save life).  
     - Representational success: Truth (e.g., "water" meaning H₂O, even if believing "H₂O" gets you killed).  
     → Truth norms can *conflict* with fitness norms.

  2. **Indeterminacy of Content:**  
     - Evolution selects for *behavioral outcomes*, not specific contents.  
     - E.g., A frog's "fly detector" neurons: Selected for catching flies, but do they represent "fly," "small dark moving thing," or "food"? Teleosemantics cannot resolve this without smuggling in mental norms.

  3. **Swampman Revisited:**  
     - A lightning-created Swampman (identical to a human) would have "representations" with no history. Intuitively, his thought "water" *means* water—but teleosemantics denies this. This violates core intuitions about intentionality.

  ---

  ### Verdict
  - **The analogy collapses:** Hearts lack "aboutness," swamphearts expose circularity, and biological norms cannot ground truth conditions.  
  - **History is not sufficient:** While selection history *constrains* function, it cannot resolve content indeterminacy or ground semantic norms.  
  - **Core argument fails:** The heart analogy *was* carrying the teleosemantic project. Without it, the reduction of intentionality to biology lacks plausibility. Teleosemantics provides a necessary condition (history) but not a sufficient one for content.  

  **Surviving Insight:** Selection history explains *why* a representational mechanism exists, but not *how* it acquires specific content. The "normativity problem" of intentionality remains unsolved by biology alone.
