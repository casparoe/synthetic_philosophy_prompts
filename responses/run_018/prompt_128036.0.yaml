  But here's the real kicker: even if we grant biological norms, can they bear the weight of mental norms? When I believe "that's water" but it's actually vodka, my mistake isn't biological malfunction - it's about truth. Biology cares if I survive; truth doesn't. The user's suspicion seems right: the heart analogy was doing heavy lifting for the whole argument.

