prompt: |-
  As a retired experimental physicist who has only recently begun studying philosophy of science and measurement theory, I now chair a university committee that allocates seed grants for interdisciplinary pilot studies spanning the natural and social sciences. We have adopted quantitative evaluation metrics—citation velocity, cross-disciplinary collaboration scores, and replication-rate proxies—to determine which preliminary projects should be scaled. Having encountered Goodhart’s law and the problem of specification gaming, I am convinced that our metrics are being optimized against rather than serving as faithful indicators of scientific quality. The committee, however, needs an operational framework, not merely a warning.

  Please construct a reusable decision procedure—structured as an ordered checklist with explicit stopping rules and clearly flagged judgment points—that my committee can apply to any proposed evaluation metric before formal adoption. The procedure should be grounded in the conceptual distinction between proxy corruption, in which the metric decouples causally from its intended target, and target displacement, in which the system being evaluated redefines success so that it coincides with the metric. It should also include a specific diagnostic for what I shall term reflexive gaming: cases in which researchers anticipate the evaluation criterion and alter their study design not to improve the underlying phenomenon, but to generate the appearance of improvement without producing detectable proxy corruption. The procedure must specify, in order: (1) preliminary questions regarding causal coupling between the measurement apparatus and the phenomenon measured; (2) conditions under which a metric must be rejected outright; (3) conditions under which it may be retained with institutional safeguards; and (4) the precise points at which no procedural rule can substitute for an explicit normative judgment about what the committee actually values in scientific work.

  Apply the procedure to three cases: (a) using replication-rate proxies to evaluate pilot studies in behavioral psychology; (b) using cross-disciplinary citation counts to evaluate collaborations between climate science and the humanities; and (c) a hypothetical scenario in which the procedure recommends retaining a metric with safeguards, yet the recommendation conflicts with institutional incentives for rapid, quantifiable outcomes and is therefore likely to be resisted by the committee. Finally, articulate what the procedure is structurally unable to determine, particularly with respect to the prior selection of the target phenomenon itself. Constraints: the committee meets monthly, members have no formal training in philosophy or statistics, and any recommendation must be defensible to a non-specialist university administrator within a ten-minute presentation.
reasoning: |-
  We are constructing a reusable decision procedure in the form of an ordered checklist for evaluating metrics. The procedure should address:
   1. Preliminary questions about causal coupling
   2. Conditions for outright rejection
   3. Conditions for retention with safeguards
   4. Points requiring explicit normative judgment

   The concepts we must cover:
   - Proxy corruption: when the metric becomes causally decoupled from the intended target.
   - Target displacement: when the system being evaluated redefines success to match the metric.
   - Reflexive gaming: when researchers alter study design to generate the appearance of improvement without actually improving the underlying phenomenon and without causing detectable proxy corruption.

   The checklist must be applied to three cases.

   We structure the procedure as a checklist with explicit stopping rules and judgment points.

  ---

  **Decision Procedure Checklist for Evaluation Metric Adoption**

  **I. Preliminary Questions: Causal Coupling and Intended Target**
     - *Step 1.1:* Clearly define the intended target phenomenon (T) that the metric (M) is supposed to measure. 
       - *Stopping Rule:* If the committee cannot articulate T in concrete, non-metric terms, halt the procedure and reformulate T.
     - *Step 1.2:* Describe the causal pathway by which changes in T are expected to produce changes in M. 
       - *Stopping Rule:* If no plausible causal pathway exists, reject M (go to II.1).
     - *Step 1.3:* Identify known confounding factors (C) that could affect M independently of T.
       - *Judgment Point A:* The committee must judge whether the causal pathway from T to M is strong relative to the confounding pathways (C to M). If the confounding pathways are likely to dominate, flag for rejection or redesign.

  **II. Conditions for Outright Rejection**
     - *Step 2.1 (Proxy Corruption Check):* Is there evidence or strong theoretical reason that M can be easily manipulated without any change in T? 
       - *Rejection Condition 1:* If yes, reject M.
     - *Step 2.2 (Target Displacement Check):* Could adoption of M lead to a redefinition of success in the field such that T becomes aligned with M even if that alignment is scientifically undesirable? 
       - *Rejection Condition 2:* If yes, reject M.
     - *Step 2.3 (Reflexive Gaming Diagnostic):* Is M vulnerable to reflexive gaming? (i.e., can researchers alter their study design to improve M without improving T and without triggering Step 2.1 because the alteration is undetectable or not technically manipulation?) 
       - *Rejection Condition 3:* If reflexive gaming is likely and the design alterations are scientifically detrimental, reject M.

  **III. Conditions for Retention with Safeguards**
     - *Step 3.1:* If M passes Steps 2.1-2.3 (i.e., no outright rejection) but there are residual risks of corruption, displacement, or gaming, identify institutional safeguards:
       - *Option 3.1a:* Combine M with other metrics (a basket of indicators) to reduce the focus on M alone.
       - *Option 3.1b:* Implement periodic audits by domain experts to check for gaming and to assess whether M is still aligned with T.
       - *Option 3.1c:* Use M only for short-term evaluations and couple it with long-term qualitative assessments.
       - *Option 3.1d:* Limit the stakes attached to M (e.g., use it for small seed grants but not for tenure decisions).
     - *Judgment Point B:* The committee must decide whether the proposed safeguards are feasible and sufficient. If not, reject M.

  **IV. Explicit Normative Judgment Points**
     - *Step 4.1:* Even if M passes all checks, the committee must explicitly state: What aspect of scientific quality does T represent, and is that aspect the one the committee values most in this context?
       - *Judgment Point C:* If the committee values something other than T (even if T is a component), then M may not be suitable. The committee must decide: Is T the right target?
     - *Step 4.2:* The committee must consider: Are we willing to accept the potential negative side effects (e.g., narrowing of research questions, discouraging high-risk/high-reward work) that might arise even with safeguards?
       - *Judgment Point D:* This requires weighing the benefits of quantification against the costs of potential distortion.

  ---

  **Application to Cases**

  **Case (a): Replication-rate proxies for pilot studies in behavioral psychology**

  I. Preliminary Questions:
     - T: The true replicability of psychological findings (i.e., the probability that the result would be observed again in a new, well-conducted study).
     - Causal pathway: A well-conducted replication study that confirms the original finding increases the replication rate. However, note that a pilot study is small and not designed for replication. Also, replication-rate proxies (e.g., p-values, effect sizes) might not directly measure replicability.
     - Confounders: Publication bias, p-hacking, small sample sizes in pilots, and the file drawer effect.

  II. Conditions for Rejection:
     - Step 2.1: Proxy corruption? Yes. Researchers can p-hack or selectively report to achieve better replication-rate proxies without improving actual replicability.
     - Step 2.2: Target displacement? Possibly. Researchers might avoid studying complex phenomena that are hard to replicate, leading to a focus on trivial but easily replicated effects.
     - Step 2.3: Reflexive gaming? Yes. Researchers might design pilot studies with larger sample sizes than typical for pilots (to get significant results) or choose conservative methods that inflate replication proxies without addressing the underlying issue of replicability.

     *Verdict:* Reject. The metric is too vulnerable to manipulation and gaming, and the causal pathway is weak for pilot studies.

  **Case (b): Cross-disciplinary citation counts for collaborations between climate science and humanities**

  I. Preliminary Questions:
     - T: The degree of successful integration of knowledge across disciplines leading to impactful work.
     - Causal pathway: High-quality interdisciplinary work might be cited by both fields, leading to citations in journals of both climate science and humanities. However, citations may not capture the quality of integration.
     - Confounders: Differences in citation practices (e.g., humanities cite books more, climate science cites articles; humanities has lower citation rates overall), self-citations, and the possibility of "gift" citations.

  II. Conditions for Rejection:
     - Step 2.1: Proxy corruption? Yes. Researchers might artificially cite each other's work (citation swapping) or target journals that are indexed in both disciplines without real integration.
     - Step 2.2: Target displacement? Possibly. Success might become defined as getting citations in both fields, even if the work is shallowly interdisciplinary (e.g., adding a humanities quote to a climate paper).
     - Step 2.3: Reflexive gaming? Yes. Researchers might design studies to be superficially interdisciplinary to attract citations from both fields without deep integration.

     *Verdict:* Reject outright? Not necessarily. We might retain with safeguards.

  III. Retention with Safeguards:
     - Combine with other metrics (e.g., expert review of the integration depth, qualitative assessment of the collaboration).
     - Audit: Require a narrative explaining the interdisciplinary approach and how it advanced both fields.
     - Limit stakes: Use citation counts only as one of several indicators for seed funding.

     *Judgment Point B:* If the committee believes the safeguards are feasible, then retain. Otherwise, reject.

  IV. Normative Judgment:
     - Step 4.1: Is T (integration leading to impactful work) what we value? Yes, but we also value innovation and depth. The committee must decide if citation counts capture enough of T.
     - Step 4.2: Side effects might include discouraging collaborations that are truly innovative but might not yield immediate citations.

     *Final Decision:* Retain with safeguards: use as one indicator among a basket, and require a narrative.

  **Case (c): Hypothetical scenario - Retention with safeguards conflicts with institutional incentives**

  - Scenario: A metric (say, citation velocity) passes the checks but requires safeguards (e.g., using it alongside other metrics and with expert review). However, the university administration wants a single, easily quantifiable metric for reporting and quick decisions. The committee is pressured to drop the safeguards.

  - Procedure's Response: 
    - The procedure requires that if safeguards are necessary (per Step 3.1) and the committee judges they are feasible and sufficient (Judgment Point B), then the metric must be used with those safeguards. 
    - If the institutional context makes the safeguards infeasible (e.g., no time for expert review, pressure for a single number), then the procedure would lead to rejection of the metric because the conditions for retention are not met. 
    - The procedure cannot force an institution to accept safeguards, but it can make clear that without them, the metric is too risky.

  - Committee's Challenge: They must either:
     a) Reject the metric and explain to administrators that without safeguards, the metric will be gamed and lead to poor decisions.
     b) Advocate for the necessary resources to implement safeguards (e.g., budget for expert reviews, time for multi-metric evaluation).

  - What the procedure cannot do: It cannot resolve the conflict between rigorous evaluation and institutional constraints. The committee must make a normative judgment (Step 4.2) about whether to push back against institutional incentives or abandon the metric.

  ---

  **What the Procedure Cannot Determine**

  The procedure is structurally unable to:
  1. Define the target phenomenon (T) in the first place. This requires a prior normative judgment about what constitutes valuable science.
  2. Resolve conflicts between different values (e.g., quantity vs. quality, short-term vs. long-term impact). The procedure requires explicit normative judgments at key points (Judgment Points A, B, C, D).
  3. Guarantee that the chosen T is the one that should be pursued. The procedure assumes that T is agreed upon and then checks if M measures T well.
  4. Account for dynamic changes in the system. A metric that initially passes might become corrupted over time, hence the need for periodic re-evaluation (but the procedure does not specify when to re-evaluate).

  ---

  **Summary for Non-Specialist Administrator (10-Minute Presentation)**

  - We have developed a checklist to prevent our metrics from being gamed.
  - Step 1: We must be clear on what we're measuring and how the metric connects to it.
  - Step 2: We reject metrics that can be easily gamed or that change what scientists aim for in bad ways.
  - Step 3: If a metric is risky but useful, we add safeguards (like using multiple metrics or expert review).
  - Step 4: We must always ask: Is this metric helping us fund the kind of science we value?

  - Case Examples:
     a) Replication-rate proxies for psychology pilots: Too easy to game -> reject.
     b) Cross-disciplinary citations: Risky, but we can use it with other measures -> retain with safeguards.
     c) If we can't implement safeguards (due to pressure for quick numbers), we might have to reject a metric even if it's otherwise acceptable.

  - What we can't solve: We still have to decide what good science is. The tool helps us measure it without distortion, but it doesn't tell us what to value.

  By using this procedure, we can allocate seed grants more effectively, avoiding the pitfalls of Goodhart's law.
answer: |-
  ### Decision Procedure Checklist for Evaluation Metric Adoption  
  *Grounding: Distinguishes proxy corruption (metric causally decouples from target) from target displacement (system redefines success to match metric). Includes diagnostic for reflexive gaming (researchers alter study design to *appear* improved without actual progress, evading corruption detection).*  

  ---

  #### **I. PRELIMINARY CAUSAL ANALYSIS**  
  *Assess whether the metric (M) is causally coupled to the target phenomenon (T). T must be defined non-metrically (e.g., "robust knowledge generation," not "high citations").*  
  1. **Articulate T**: What is the *substantive goal* M intends to measure? (e.g., for replication: "reliability of findings").  
     - *Stopping Rule*: If T cannot be defined without referencing M, **halt**—M is tautological.  
  2. **Specify causal pathway**: How do changes in T *cause* changes in M? Diagram the mechanism.  
     - *Stopping Rule*: If no plausible causal path exists (e.g., T→M is speculative), **reject M**.  
  3. **Identify confounders**: What variables (C) could alter M *without* changing T? (e.g., self-citations inflating citation counts).  
     - *Judgment Flag A*: If C’s influence is stronger than T’s, M is invalid. Committee must decide: Can C be controlled?  

  #### **II. REJECTION CONDITIONS**  
  *Test for fundamental flaws. Failure at any step mandates rejection.*  
  4. **Proxy corruption check**: Can M be gamed without affecting T? (e.g., p-hacking to "improve" replication metrics).  
     - *Rejection Rule*: If gaming is easy and undetectable, **reject M**.  
  5. **Target displacement check**: Could adopting M incentivize redefining T to match M? (e.g., researchers prioritizing "citable" topics over impactful ones).  
     - *Rejection Rule*: If displacement risk is high, **reject M**.  
  6. **Reflexive gaming diagnostic**:  
     - **Step 6.1**: Could researchers *anticipate* M and design studies to optimize M *without* improving T? (e.g., adding token humanities citations to boost "interdisciplinarity").  
     - **Step 6.2**: Is this design alteration scientifically harmful? (e.g., diluting focus).  
     - *Rejection Rule*: If both 6.1 and 6.2 are true, **reject M**.  

  #### **III. RETENTION WITH SAFEGUARDS**  
  *If M passes Section II but risks remain, apply mitigations.*  
  7. **Safeguard options**:  
     - **7a. Metric diversification**: Use M only in a *basket* of indicators (e.g., M + expert review).  
     - **7b. Dynamic calibration**: Sunset M after 2–3 funding cycles; re-test using Section II.  
     - **7c. Stake limitation**: Restrict M’s use to low-stakes decisions (e.g., seed grants, not tenure).  
     - **7d. Audit protocol**: Sample projects for deep review by external experts.  
  8. *Judgment Flag B*: Committee must affirm safeguards are feasible and sufficient. If not, **reject M**.  

  #### **IV. NORMATIVE JUDGMENT POINTS**  
  *No procedural fix can resolve these—explicit committee deliberation required.*  
  9. **Value alignment**: Does T reflect what we *truly value*? (e.g., Is "citation velocity" a proxy for significance or popularity?).  
     - *Judgment Flag C*: If T conflicts with committee values (e.g., rewarding incrementalism over innovation), **modify T or reject M**.  
  10. **Cost-benefit acceptance**: Are we willing to accept M’s limitations? (e.g., rewarding conservative projects to avoid gaming risks).  
      - *Judgment Flag D*: Committee must formally weigh distortions against operational needs.  

  ---

  ### **APPLICATION TO CASES**  

  #### **Case (a): Replication-rate proxies for behavioral psychology pilots**  
  - **I.1 T**: "Methodological rigor and result reliability."  
  - **I.2 Causal path**: Rigorous design → replicable result → high replication rate. *Plausible*.  
  - **I.3 Confounders**: P-hacking, selective reporting (C dominates T).  
  - **II.4 Proxy corruption**: Yes—researchers can inflate replication proxies via small samples/p-hacking.  
  - **II.6 Reflexive gaming**: Yes—researchers may avoid complex topics to ensure "replicability."  
  - **Verdict**: **Reject** (fails II.4 and II.6). *Alternative*: Use pre-registration adherence + direct replication attempts.  

  #### **Case (b): Cross-disciplinary citation counts for climate-humanities collaborations**  
  - **I.1 T**: "Genuine knowledge integration across fields."  
  - **I.2 Causal path**: Deep integration → work cited in both fields → high cross-citations. *Weak* (citations ≠ integration quality).  
  - **I.3 Confounders**: Citation clubs, self-citations (C strong).  
  - **II.5 Target displacement**: High risk—researchers may chase "citable" but shallow connections.  
  - **III Retention possible?** Yes, with safeguards:  
    - **7a. Diversify**: Combine with co-authorship diversity metrics and narrative impact statements.  
    - **7d. Audit**: External experts assess integration depth.  
  - **Judgment Flag B**: Safeguards feasible? Yes, if committee budgets for audits.  
  - **Verdict**: **Retain with safeguards**.  

  #### **Case (c): Hypothetical conflict with institutional incentives**  
  - **Scenario**: A metric (e.g., "time to first publication") passes III with safeguards (e.g., 7a/7d), but administrators demand a single, rapid metric.  
  - **Procedure’s output**: Retention requires safeguards.  
  - **Conflict resolution**:  
    - Committee invokes **Judgment Flag D**: Explicitly state that dropping safeguards violates the procedure and risks Goodhart’s law.  
    - **Action**: Draft a memo to administrators: "Without safeguards, M will measure gaming, not quality. Alternatives: (1) Accept slower decisions, (2) Use a simpler but cruder metric, (3) Reduce grant volume to enable audits."  

  ---

  ### **STRUCTURAL LIMITATIONS OF THE PROCEDURE**  
  The procedure **cannot**:  
  1. **Define T itself**: Choosing the target (e.g., "innovation" vs. "reliability") requires prior normative debate.  
  2. **Resolve value conflicts**: When safeguards clash with institutional incentives, judgment is political, not technical.  
  3. **Predict dynamic adaptation**: Metrics that pass today may corrupt tomorrow; continuous re-evaluation (step 7b) is essential.  
  4. **Eliminate judgment**: Sections I.3, IV.9, and IV.10 force explicit committee values into the open.  

  ---

  ### **COMMITTEE-FRIENDLY IMPLEMENTATION**  
  - **Monthly workflow**: Apply checklist to 1–2 metrics per meeting.  
  - **Non-specialist defense** (10-minute script):  
    > "We face a measurement trap: If we reward citations, researchers chase citations, not truth. Our 4-step checklist fixes this. Step I ensures metrics connect to real goals. Step II kills flawed metrics. Step III adds shields like expert audits. Step IV forces us to debate what matters. Example: Citation counts for climate-humanities projects need audits to avoid shallow work. Without this, we fund gaming, not science."  

  This procedure operationalizes philosophy while respecting committee constraints—exposing value judgments rather than hiding them.
