answer: |-
  Your project demands a rigorously Abhidharmic principle that resolves tensions while respecting *anattā* and the two truths. Below is a unified account reconciling your verdicts, grounded in **Causal Integration Density (CID)** as the criterion for conventional personal identity (*saṃvṛtisat*), operationalizing momentariness and dependent origination. CID has two dimensions:  
  1. **Causal Strength (CS)**: Intensity of causal dependence between successive momentary aggregates (*kṣaṇika skandhas*).  
  2. **Synchronically Integrated Complexity (SIC)**: Degree of mutual causal support among co-arising aggregates at a given moment (e.g., perceptual consciousness conditioning feeling, which conditions volition).  

  **The Principle:**  
  *A conventional person (P) persists from t₁ to t₂ iff there is a causal chain of aggregates (C) connecting t₁ to t₂ where:  
  (i) The *mean Causal Strength (CS)* of links in C meets a practical threshold (τ), and  
  (ii) The *mean Synchronically Integrated Complexity (SIC)* of aggregates in C does not fall below a practical threshold (σ).*  

  Conventional identity is thus a *pragmatic designation* for sufficiently dense causal-integrative streams. Ultimate truth (*paramārthasat*) reveals only momentary *dharmas*.  

  ---

  ### **Resolution of Cases**  
  1. **Destructive Teletransportation**  
     - *Verdict upheld:* CID is preserved.  
     - CS: High (exact neural/psychological replication ensures strong causal mimicry).  
     - SIC: Unchanged (functional identity maintains complexity).  
     - No ontological rupture; the stream is conventionally continuous.  

  2. **Non-Destructive Branching**  
     - *Verdict modified:* **Reject the asymmetry.**  
     - Both streams have identical initial CS/SIC to the pre-branch original.  
     - Neither is metaphysically privileged; your felt asymmetry implicitly posits a self (*ātman*).  
     - *Correction:* If forced to "identify," choose arbitrarily—neither choice reflects ultimate reality.  

  3. **Split-Brain Separation**  
     - *Verdict upheld:* CID reveals pre-existing duality.  
     - Pre-surgery: Low SIC (hemispheres weakly integrated; "one person" by convention only).  
     - Post-surgery: Two streams with higher mean SIC (now fully independent).  
     - No division of a unity—only latent streams becoming manifest.  

  4. **Severe Progressive Dementia**  
     - *Verdict upheld:* CID degrades below thresholds.  
     - CS weakens (failing memory breaks causal links).  
     - SIC collapses (loss of cognitive integration).  
     - The conventional person ceases when σ/τ are irreversibly breached.  

  5. **Nirodha-Samāpatti**  
     - *Verdict upheld:* CID maintained despite interruption.  
     - CS: High (pre-cessation aggregates directly cause post-cessation aggregates via latent *saṃskāras*).  
     - SIC: Temporarily zero, but resumption restores complexity above σ.  
     - *Key:* The causal chain isn’t broken—cessation is a *planned gap* in manifestation, not causation.  

  6. **Post-Traumatic Moral Transformation**  
     - *Verdict upheld:* Distinction of truths resolves tension.  
     - Conventionally: Same causal stream (CS/SIC thresholds met), hence same person responsible.  
     - Ultimately: No self then or now; "disownership" is insight into *anattā*, not a metaphysical claim.  

  ---

  ### **Tensions Resolved**  
  - **Between (1) & (2):**  
    Teletransportation preserves CID *in one stream*; branching creates *two streams* each with CID equal to the original’s pre-branch state. Neither copy is "less authentic," but branching *dilutes* causal density by splitting the stream. Your asymmetry error treats the original body as a substratum—reject this to uphold *anattā*.  

  - **Between (4) & (5):**  
    Dementia *permanently* reduces CID below σ/τ; *nirodha* is a *temporary* suspension with high CS ensuring resumption. Physical embodiment matters only indirectly: in dementia, neural decay *causes* CID collapse; in *nirodha*, the body sustains latent causation (*pratyaya*) for mental resumption.  

  ---

  ### **Unlisted Scenario: Formless Attainment (Nevasaññānāsaññāyatana)**  
  - **Verdict:** The stream survives conventionally.  
    - **CS:** Remains above τ. Though mental activity is minimal, the residual consciousness (*citta-santāna*) maintains causal links via subtle *saṃskāras* (e.g., meditative intention).  
    - **SIC:** Temporarily falls below σ (undifferentiated residue lacks complexity), but this is not irreversible. Autobiographical memory resumption confirms CS was sufficient.  
    - *Contrast with dementia:* Here, SIC reduction is *stable and intended*—like *nirodha*, not degradation.  

  ---

  ### **If Revisions Are Unavoidable**  
  Your branching asymmetry (Case 2) must be abandoned—it violates *anattā* by covertly privileging one body-moment. To retain it would require smuggling in a substantial self or first-person primitive (e.g., "I was here first"). All other verdicts are defensible under CID.  

  **Strengths of CID Framework:**  
  - Grounded in Abhidharma: Mirrors the *santāna* (continuum) model, where identity is imputed on *pratītyasamutpāda* (dependent origination).  
  - Explains thresholds: τ/σ are context-dependent (e.g., legal vs. soteriological contexts may set different σ/τ).  
  - Handles interruption: Gaps matter only if CID is irrecoverably broken.  

  **Final Note:** This treats "survival" as conventional pragmatics—a label for usable causal streams. Ultimate truth remains: no self, no identity, only *dharmas* flowing.
