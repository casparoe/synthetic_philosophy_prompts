answer: |-
  Here’s the essay question, model answer, marking scheme, and grading note as requested. Designed to force engagement beyond component recitation.

  ---

  ### Essay Question
  **"Given the case of standard pain asymbolia (intact sensation/motivation but absent distress) and the stipulated case of 'inverse asymbolia' (intact sensation/distress reports but absent motivation), where does the badness of pain reside? Defend a specific location for badness (sensory, affective, motivational, or elsewhere) that best explains both cases. Crucially, your defense must:  
  (a) Explain why all three components (sensory, affective, motivational) normally co-occur,  
  (b) Address why we trust the asymbolic patient’s report of non-badness but distrust the inverse asymbolic’s report of badness, and  
  (c) Resolve whether pain’s badness is reducible to a single component or requires a more complex account."**

  ---

  ### Model Answer (≈700 words)  
  The badness of pain cannot be cleanly mapped to a single component. Standard asymbolia severs sensation from affective distress, while inverse asymbolia severs reported distress from motivation. This triad of cases—normal pain, asymbolia, and inverse asymbolia—exposes the inadequacy of identifying badness solely with affect. I argue that pain’s badness emerges from the *integration* of affective evaluation and motivation, and that its apparent simplicity in normal cases masks underlying functional complexity.  

  **Locating Badness:** If badness were purely affective, inverse asymbolia (where subjects report distress but lack motivation) would be incoherent. Yet the case is stipulated: subjects sincerely describe pain as "terrible" but act indifferently. Conversely, if badness were motivational, standard asymbolia (no distress but intact withdrawal reflexes) would contradict the link between avoidance and suffering. The sensory component fares worse—asymbolics feel the sensation without finding it bad. Thus, badness is not intrinsic to any isolated component. Instead, it arises when affective evaluation *motivates avoidance*. Badness is the property of a state that *disposes an agent to treat the stimulus as a threat to be terminated*. In normal pain, affect and motivation align; in both asymbolias, they dissociate.  

  **Co-Travel Problem:** The three components co-travel not by necessity but due to evolutionary design. Nociception signals potential harm; affective evaluation tags it as saliently negative; motivation executes avoidance. This triad optimizes survival: disintegration (as in asymbolias) is maladaptive. Crucially, affect and motivation are interlocked via learned and innate associations. For example, repeated pairing of sensation (e.g., heat) with negative valence strengthens motivational pathways. Co-travel is thus a contingent biological package—not a logical unity. Inverse asymbolia might represent a failure in this coupling: the evaluative state exists but cannot "downstream" into action.  

  **Calibration Problem:** We trust asymbolics’ denial of badness because their behavior (no avoidance, indifference) coheres with their reports. Inverse asymbolics, however, exhibit a contradiction: they *say* it’s awful but *act* as if it isn’t. This misalignment undermines credibility. When verbal reports conflict with behavioral dispositions, we prioritize the latter as evidence of genuine evaluation. Motivation isn’t just evidence of badness—it’s constitutive of the evaluative state’s practical force. An "awful" state that doesn’t motivate is semantically defective; it lacks the *action-guiding role* defining badness. Thus, the inverse asymbolic’s report is discounted not arbitrarily, but because it fails to play the functional role of "badness" in their psychology.  

  **Objection & Reply:** One might protest that badness is purely affective, and inverse asymbolia is merely a motivational deficit. But this ignores that evaluation entails a disposition to act. Calling a state "bad" while feeling no push to escape it is pragmatically inconsistent—like calling a mountain "fearsome" while calmly picnicking on its slope. The affective report in inverse asymbolia is thus hollow; it mimics badness linguistically but lacks its inferential role.  

  **Conclusion:** Badness is neither sensory nor affect nor motivation alone. It is a higher-order property of integrated evaluative-motivational states. Asymbolia and inverse asymbolia are failures of integration, revealing that pain’s badness depends on the coupling of affect and goal-directed avoidance. This explains co-travel (functional synergy) and calibration (behavior as evidence of integration). Reducing badness to one component ignores its dynamic nature.  

  ---

  ### Marking Scheme (20 points total)  
  **A-range (17–20):** Engages co-travel & calibration as *constitutive problems* for component theories; defends a non-reductive account.  
  **B-range (14–16):** Identifies components but treats co-travel/calibration as afterthoughts; reduces badness to one dimension.  

  1. **Analysis of Cases (4 pts)**  
     - *A:* Explicitly shows how both cases undermine 1:1 component-badness mapping.  
     - *B:* Describes cases but doesn’t exploit their joint implications.  
     - *Common error:* Treats inverse asymbolia as irrelevant or misreads it as "lying."  

  2. **Location of Badness (4 pts)**  
     - *A:* Argues for an emergent/integrative view OR rigorously defends one component while addressing counterevidence.  
     - *B:* Picks a component (e.g., "affective") with superficial justification.  
     - *Common error:* Claims sensation is inherently bad (ignoring asymbolia).  

  3. **Co-Travel Explanation (4 pts)**  
     - *A:* Explains co-travel as contingent biological/functional synergy, not brute fact.  
     - *B:* Merely asserts "evolution" or "normal wiring" without mechanism.  
     - *Common error:* Dismisses co-travel as irrelevant to badness.  

  4. **Calibration Defense (4 pts)**  
     - *A:* Justifies asymmetry in trust by linking badness to motivational role/behavioral coherence.  
     - *B:* Notes asymmetry but doesn’t ground it philosophically (e.g., "behavior is better evidence").  
     - *Common error:* Claims we *should* trust inverse reports, ignoring stipulated actions.  

  5. **Synthesis & Originality (4 pts)**  
     - *A:* Integrates co-travel/calibration into badness theory; questions "component" framework.  
     - *B:* Treats objections as separate add-ons; stays within component paradigm.  
     - *Common error:* Ignores one objection entirely.  

  ---

  ### Note to Instructor  
  > *Confidence level:* High in rejecting single-component accounts and prioritizing behavioral coherence for calibration. *Least confident move:* Asserting that the inverse asymbolic’s report is "semantically defective." This leans heavily on functionalist/inferentialist assumptions that could be contested (e.g., by phenomenal conservatives). Be ready for pushback that I’ve conflated *being bad* with *acting bad*, or that I’ve circularly defined badness via motivation.  
  >   
  > *Why this works:* Forces B-graders into a corner—they must engage inverse asymbolia superficially but can’t resolve calibration without deeper moves. A-graders will spot the framework challenge.  

  Let me know if you'd like adjustments to the hypothetical case weighting or the model answer's argumentative balance.
