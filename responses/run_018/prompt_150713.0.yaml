prompt: |-
  I've been having a long arguement with my mate from the typography course about whether there's actually anything that makes every 'a' an 'a', or if it's just family resemblance with no real core. After digging into the old Letter Spirit idea — that letters are roles in a relational grid rather than shapes with fixed features — I've come round to a pretty specific view: the essence of a letter isn't geometric, but analogical resilience, meaning a form is an 'a' if it can be transformed through every style in the alphabet's space without ever crossing into 'b'-territory, no matter how strange the strokes become. I think this even applies to synthetic letterforms generated by AI that have no historical lineage; if they respect those relational boundaries, they're genuinely 'a's, not just approximations. But I worry I've insullated the view so that nothing could ever disprove it. So tell me what would actually count against it — I want the serious defeaters sorted from fatal to merely awkward, including empirical misreadings, formal breakdowns in the analogy, and whether I'm just smuggling circularity in. Please reply as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
