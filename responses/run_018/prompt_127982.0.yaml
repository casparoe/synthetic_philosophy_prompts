  First, I need to recall Cantor's actual positions. He was a strong advocate for actual infinity, believing that infinite sets exist as complete objects. He also defended the Well-Ordering Principle, which is equivalent to AC. So he'd probably be fine with AC itself. But the user is asking about the trade-off with computability. Cantor was all about sets having a real existence, so extracting computable values might not be his main concern. He'd see sets as existing regardless of whether we can compute their elements.

  Next, the practical aspect in proof assistants. AC is used as a default, making proofs easier but sacrificing computation. Cantor might view this as a pragmatic choice for building theories efficiently. He wasn't opposed to practical tools, but his focus was on the theoretical existence. He might not mind the loss of computability if it helps explore the mathematical universe, though he'd want the distinction between constructive and non-constructive to be clear.

  The user mentions a "betrayal of mathematical reality." Cantor would likely see AC as part of that reality, so using it isn't a betrayal. But losing explicit computations might bother him if it confuses the ontology. However, since he prioritized the existence of sets over constructions, he might accept it as necessary for certain areas.

  Also, the user's scenario involves modern proof systems. Cantor might be impressed by the formalization but critical of treating AC as a toggle. He'd insist that AC reflects true set theory properties, not just a convenient option. The key for him is whether the results align with the reality of infinite sets.

