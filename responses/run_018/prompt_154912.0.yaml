  For terminology, since no established term fits perfectly, I'll propose "intra-group commitment binding" with a clear definition. Boundary cases: A fraternity hazing ritual would be excluded if its main function is status signaling to outsiders, while personal marathon training with no group enforcement aspect would be excluded for lacking collective action.

  Ultimately, this phenomenon remains distinct because while it shares features with signaling and commitment devices, the specific configuration where structural signaling properties are co-opted for internal enforcement creates unique dynamics. The observability serves as a byproduct rather than a design feature, making it irreducible to either parent concept.

  The user seems sophisticated but frustrated by conceptual gaps - they'll appreciate precision in distinguishing mechanisms. Since they're preparing seminar material, providing clear boundary cases will help them teach this nuance. The JSON format request suggests they want modular, reusable content, likely for slides or handouts.
