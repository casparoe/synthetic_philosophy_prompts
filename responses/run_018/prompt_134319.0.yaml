  Hmm... Leibniz would definitely reject transworld identity here. If w1 has a bearing R to b, and w2 lacks b entirely, then a's complete concept in w1 includes "bearing R to b" as a property. In w2, that property can't exist—so a's concept would be different. The complete concept doctrine seems rigid: change any property, and it's a different individual. 

