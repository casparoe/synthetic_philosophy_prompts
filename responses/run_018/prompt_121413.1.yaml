prompt: |-
  My friend and I spent most of last night arguing about whether predictive processing is a genuine discovery about the brain or an unusually elegant redescription of things we already knew, and by the end we were only restating ourselves. She holds something like the prediction-error / active-inference line: perception is prediction-error minimisation under a hierarchical generative model, action is the organism's way of making its own predictions come true, precision weighting is what attention consists in, and the Markov blanket is what makes something an individual with an inside and an outside in the first place. I hold something like the ecological-enactive line: organism and environment form a single coupled system, talk of internal models either adds nothing to talk about lawful coupling or is straightforwardly false, the framework's ambition to cover everything from cortex to gene regulation is a symptom of vacuity rather than a mark of depth, and the blanket formalism quietly presupposes the bounded subject it was advertised as deriving.

  Please draft the joint statement we should have written instead. Treat us as parties to a good-faith adversarial collaboration and produce the document, not a verdict on who won.

  I want, first, a numbered section of roughly eight to twelve claims we could both sign. They should be substantive rather than diplomatic: state what the models actually do computationally and what would count as one of them failing; be honest about the evidential status of the standard neural data (mismatch responses, repetition suppression, attenuation of self-produced sensation) and about whether citing them begs the question; and say plainly what is at stake in the framework's having a very wide range of application. Second, a disagreements table: each row gives the disputed proposition, the formulation of it that the prediction-error side would accept as its own, the formulation the coupling side would accept as its own, and a note on whether the dispute is substantive or merely verbal. Where a row collapses under better wording, delete it from the table and say in a short note which part of our argument was about words and why.

  Third, the cruxes: the sub-questions such that settling one would move at least one of us, and for each crux a case both of us would accept as bearing on it, with each side's prediction recorded in advance. Please include the two cases below, treating both as constructible.

  The quiet-room preparation. A larval animal is placed in a closed-loop virtual arena in which one particular motor routine renders the whole exteroceptive stream perfectly constant and predictable — no optic flow, no mechanosensory transients — while its homeostatic variables are clamped externally, so that it is never hungry, cold, or short of oxygen. Give each side's advance prediction about what the animal does, and say what each of us would and would not concede if the result went against us.

  The blanket-shuffling test. Take a system everyone agrees is a single agent by ordinary criteria — a eusocial colony, or a plant with widely distributed sensors and effectors — and ask what becomes of the story when the blanket can be drawn in several admissible places. Does the partition pick out the agent, or does one need the agent first and the blanket afterwards? Both sides should say in advance which outcome — a unique blanket, many admissible blankets, or no stable one — would count for them and which against.

  Please also include one crux of your own finding: how, if at all, a neural signal could be identified as carrying prediction error rather than surprise, salience, or mere change, without circular appeal to the framework.

  Constraints: no citations, no bibliography, no reading suggestions, and no attribution of claims to particular authors or papers — attribute them to the two positions only, and write so that everything is arguable from the concepts and the stipulated cases alone, with no access to the literature. Roughly 1,000 to 1,400 words, in the register of a document two people would put their names to.
reasoning: |-
  Okay, the user wants me to draft a joint statement for two friends who argued about predictive processing vs. ecological-enactive approaches to cognition. They need a structured document with agreed claims, disagreements table, and crux experiments. 

  First, I need to understand both positions clearly. The predictive processing (PP) side views the brain as a prediction machine minimizing error through hierarchical models, while the ecological-enactive (EE) side sees cognition emerging from organism-environment coupling without internal models. The user wants this framed as adversarial collaboration, not a verdict.

  For the agreed claims section, I'll identify common ground: both accept perception-action cycles and adaptivity, but differ on implementation. Key is stating what would falsify each approach - like persistent prediction errors for PP or failure of coupled systems for EE. I'll keep it to 8-12 substantive points covering computational roles, evidence status, and scope claims.

  The disagreements table needs careful phrasing. For example, the "internal models" row will show PP's "generative models as necessary inference engines" vs EE's "emergent regularities without representational status". I'll flag merely verbal disputes like terminology differences around "prediction" versus "preparedness".

  For cruxes, I'll include their two test cases plus one I add about distinguishing prediction errors from surprise. The quiet-room experiment tests PP's claim that prediction drives action even without need. Blanket-shuffling examines whether Markov blankets define agency. My added crux addresses neural signatures of prediction errors.

  The challenge is maintaining neutrality while making claims precise enough for testing. I'll use their stipulated cases as evidence benchmarks, avoiding literature appeals. Word count requires conciseness - I'll aim for clarity over exhaustiveness.

  Notably, the user wants intellectual honesty about question-begging evidence like mismatch responses. I'll address how both sides interpret such data differently. The joint statement should facilitate future experiments rather than rehashing old arguments.
answer: |-
  ## Joint Statement on Predictive Processing and Organism-Environment Coupling

  We, having engaged in extensive debate, recognize the value in clarifying our points of agreement, disagreement, and the empirical tests that could adjudicate between our perspectives. While we hold distinct views on the fundamental nature of cognition and the brain, we share a commitment to understanding adaptive behavior and seek pathways for constructive empirical progress.

  **I. Points of Agreement**

  1.  **Adaptivity is Central:** Organisms are adaptive systems that maintain themselves within viable states by dynamically interacting with their environments.
  2.  **Perception-Action Cycle:** Perception and action are fundamentally intertwined in a continuous cycle. Perception informs action, and action alters the perceptual input.
  3.  **Sensitivity to Regularity:** Nervous systems (and organisms more broadly) are exquisitely sensitive to statistical regularities and deviations from expected patterns in their sensory input.
  4.  **Hierarchical Processing:** Neural processing often involves hierarchical structures, where higher levels influence the processing at lower levels, and vice versa. Signals flow bidirectionally.
  5.  **Prediction-Like Phenomena:** Neural responses exhibit phenomena consistent with *some form* of expectation-based processing (e.g., neural responses often attenuate to predictable stimuli and amplify to novel or surprising ones).
  6.  **Evidence Status of Neural Data:** Neural signals like mismatch responses (e.g., MMN), repetition suppression, and attenuation of self-produced sensations are robust empirical phenomena. However, *interpreting* these phenomena specifically as evidence for "prediction error minimization" versus "deviation detection," "habituation," or "change detection within a coupled system" is contested and potentially question-begging. The data are neutral; the framework provides the interpretation.
  7.  **Scope Ambition:** The aspiration of the predictive processing framework to offer a unifying account spanning levels (from perception to action to physiology) and domains (neural, embodied, social) is ambitious. Its success or failure hinges on whether this breadth provides genuine explanatory unification and novel predictions *without sacrificing empirical precision*, or whether it becomes so flexible as to be unfalsifiable ("vacuity").
  8.  **Failure Conditions:** The predictive processing framework would be significantly challenged if core neural phenomena (like mismatch responses) could be robustly explained *without* invoking hierarchical generative models and prediction-error minimization, or if minimizing prediction error demonstrably *failed* as the primary driver of perception and action in well-controlled experiments. The coupling framework would be significantly challenged if adaptive behavior robustly depended on processes demonstrably isomorphic to running internal generative models when decoupled from immediate environmental feedback, or if the "lawful coupling" account demonstrably failed to explain phenomena like hierarchical expectation effects in neural processing.
  9.  **Action Alters Input:** Actions are taken, at least in part, to bring about desired sensory states or avoid undesired ones.
  10. **Organism as Bounded System:** The organism, as a biological entity, constitutes a distinct, bounded system interacting with an environment, even if the nature of that boundary and its relation to cognition is disputed.
  11. **Role of Context:** The meaning and impact of sensory signals depend critically on the current state and context of the organism.
  12. **Evolutionary Constraint:** Cognitive architectures are shaped by evolution to solve problems relevant to survival and reproduction within specific environmental niches.

  **II. Disagreements Table**

  | Disputed Proposition                                       | Predictive Processing (PP) Formulation                                                                 | Ecological-Enactive (EE) Formulation                                                                                                                               | Dispute Nature        | Note on Collapsed Disputes                                                                                                |
  | :--------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------- | :------------------------------------------------------------------------------------------------------------------------ |
  | **Nature of Perception**                                   | Perception fundamentally *is* the process of minimizing prediction error generated by a hierarchical internal generative model. | Perception fundamentally *is* the active, skillful extraction of information (affordances) through sensorimotor coupling with the environment; internal models are either absent or epiphenomenal. | **Substantive**       |                                                                                                                           |
  | **Role of Internal Models**                                | Internal generative models are necessary and causally efficacious for perception, inference, and action. They actively generate predictions. | Talk of "internal models" either adds nothing substantive beyond describing the lawful, history-dependent structure of the sensorimotor coupling, or is misleadingly reified. Adaptive behavior emerges from the dynamics of the coupled system. | **Substantive**       |                                                                                                                           |
  | **Primary Driver of Action**                               | Action is fundamentally driven to minimize prediction error (active inference), making sensory input match the predictions generated by the model. | Action is fundamentally driven by the organism's needs and goals within its ecological niche, realized through direct sensorimotor coordination with the environment. Prediction-like effects are consequences, not primary causes. | **Substantive**       |                                                                                                                           |
  | **Constitutive Role of the Markov Blanket**                | The Markov blanket formalism *defines* what constitutes a distinct "system" (e.g., an agent) by separating internal states from external states via active and sensory states. It provides a formal basis for individuality. | The Markov blanket formalism *describes* a statistical partitioning that may be applied *after* identifying a system of interest based on biological/physical criteria (autopoiesis, cohesion). It presupposes, rather than derives, the agent. | **Substantive**       |                                                                                                                           |
  | **Scope and Unification**                                  | The framework's wide scope (cortex to genes) is a strength, demonstrating the depth and unifying power of prediction-error minimization as a universal principle for adaptive systems. | The framework's extremely wide scope is often achieved only through excessive abstraction and re-description, masking important mechanistic differences and becoming explanatorily vacuous ("vacuity"). | **Substantive**       |                                                                                                                           |
  | **The Meaning of "Prediction"**                            | Neural "predictions" involve the explicit pre-activation of representations of expected states or inputs based on the generative model. | Describing neural sensitivity to deviations as "prediction" is often metaphorical; it reflects preparation for likely events or tuning based on past regularities within the ongoing coupling, not explicit future-state models. | **Verbal/Substantive** | **Collapsed:** Part of our argument stemmed from differing connotations of "prediction." PP emphasizes explicit model-based forecasting. EE sees it as dynamic preparedness within coupling. Better phrasing distinguishes "model-based forecasting" (PP) vs. "lawful anticipation" (EE). |

  **III. Empirical Cruxes**

  1.  **The Quiet-Room Preparation:**
      *   **Setup:** Larval animal (e.g., zebrafish larva) in closed-loop VR. One specific motor pattern perfectly nulls all exteroceptive input (no optic flow, no mechanosensation transients). Homeostasis (O2, nutrients, temperature) is externally clamped, eliminating interoceptive drive.
      *   **PP Prediction:** The animal will persistently execute the motor routine that minimizes *exteroceptive* prediction error, creating the perfectly predictable "quiet room." Action is driven by the need to minimize sensory prediction error, even absent homeostatic need. It might even "hallucinate" expected input if clamped.
      *   **EE Prediction:** The animal will cease the specific motor routine once it realizes it generates no relevant sensorimotor consequence *for engagement with the world*. Without a need (homeostatic or exploratory) and without environmental coupling offering affordances, organized action ceases or becomes disorganized/random. Action requires coupling.
      *   **Concessions:**
          *   *If PP favored:* EE concedes action *can* be driven by sensory contingencies alone in this artificial context, but argues this doesn't generalize to natural cognition. EE does not concede this demonstrates internal generative models as primary drivers in normal contexts.
          *   *If EE favored:* PP concedes that without homeostatic/interoceptive drive (treated as predictions needing fulfillment), the drive for exteroceptive prediction-error minimization alone might be insufficient or unstable in this context. PP does not concede this falsifies the core framework, only highlights the role of interoception.

  2.  **The Blanket-Shuffling Test:**
      *   **Setup:** Apply the Markov blanket formalism to a system widely agreed to be a single agent but with distributed/complex physiology (e.g., a colonial siphonophore, a large tree, a eusocial insect colony). Identify all statistically admissible Markov blanket partitions.
      *   **PP Prediction:** A unique, functionally salient Markov blanket partition will correspond to the agreed-upon agent boundary (e.g., around the entire colony or tree). This partition will best "carve nature at its joints" for explaining the system's adaptive behavior as a unit. Multiple admissible partitions indicate the formalism needs refinement or the system is multi-agent.
      *   **EE Prediction:** Multiple statistically admissible partitions will exist (e.g., around individual zooids in the siphonophore, branches/roots in the tree, individual insects). The "agent" boundary is defined by biological criteria (e.g., genetic identity, physiological integration, evolutionary unit), not by the blanket. The blanket formalism is a tool applied *after* identifying the agent, not constitutive. Finding no unique blanket strengthens this view.
      *   **Crucial Outcome:**
          *   *For PP:* A unique, functionally privileged blanket corresponding to the intuitive agent boundary counts strongly *for*. Multiple admissible blankets without a clear functional winner counts *against* the constitutive claim.
          *   *For EE:* Finding multiple admissible blankets, or the inability to find a stable blanket without prior biological definition, counts *for*. Finding a unique, privileged blanket corresponding perfectly to the biological agent *might* count as an interesting descriptive tool but not as constitutive evidence.

  3.  **Distinguishing Prediction Error from Mere Surprise/Change:**
      *   **Crux:** Can a neural signal be identified as specifically carrying "prediction error" (i.e., the difference between a *model-based prediction* and input) as opposed to "surprise" (unexpectedness), "salience" (behavioral relevance), or simple "change detection", *without* presupposing the PP framework?
      *   **Test Case:** Identify a neural response (e.g., a specific component of the mismatch response) in a controlled sensory paradigm. Manipulate the *predictability* of a stimulus sequence based on an underlying generative model (e.g., simple transition probabilities vs. complex hierarchical rules) independently from its *probability* (overall rareness) and its inherent *salience* (e.g., intensity, relevance to reward).
      *   **PP Prediction:** Neural signals will scale specifically with violations of the learned *predictive model* (e.g., respond more to rule violations than to equally rare, equally salient stimuli that don't violate the learned structure), and this scaling will correlate with activity in areas posited to encode model parameters/predictions. Crucially, the signal should reflect model-based *prediction*, not just adaptation or surprise.
      *   **EE Prediction:** Neural signals will scale with overall surprisingness, novelty, or salience, modulated by adaptation and the organism's current state/needs within the coupling. A specific, isolatable signal purely reflecting "model-based prediction minus input" distinguishable from these other factors will not be found. Any observed effects can be explained by changes in tuning, sensitivity, or salience weighting within the coupled system.
      *   **Crucial Outcome:** A neural signal demonstrably reflecting *only* the deviation from a specific, learned, internal model's prediction (and not rareness, salience, or simple change) counts strongly *for* PP. The failure to isolate such a signal, or evidence that the signal is better explained by adaptive tuning/salience within the coupling, counts strongly *for* EE.

  This statement reflects our shared understanding of the debate's core issues and provides clear targets for future empirical and conceptual work. We commit to evaluating the outcomes of tests like these in good faith. Signed: [Your Name] & [Your Friend's Name]
