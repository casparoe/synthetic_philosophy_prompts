  On the pro-testimony side, philosophers like McGrath and Jones point out that we rely on testimony for all sorts of knowledge, so why treat morality differently? If the flatmate is well-informed on climate issues, trusting them could be efficient and rational, similar to trusting a doctor's diagnosis. Morality isn't unique in requiring personal insight; it's about getting the right answer, and testimony can deliver that. Insisting on DIY reasoning might be impractical or even arrogant, ignoring social learning.

