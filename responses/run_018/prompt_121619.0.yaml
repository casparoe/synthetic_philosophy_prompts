  heres the twist though: what if the person telling you is an AI chatbot thats been trained on loads of human opinions? does that still count as moral testimony, or is it just pattern matching? and does the usual worry — that youre just parroting without real understanding — still apply when theres no actual person behind it?

  can you write me an essay weighing whether trusting moral testimony is rational, whether an AI source changes anything important, and actually reach a conclusion rather than sitting on the fence? please write in british english, and sorry for any typos — im typing this on my phone lol.
