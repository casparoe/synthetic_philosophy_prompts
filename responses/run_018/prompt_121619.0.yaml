  But AI could have benefits. It might provide broader perspectives than one flatmate, drawing from diverse sources. For complex issues like climate ethics, where the user feels uncertain, AI could offer a starting point for reflection. The key is how it's used—if treated as a prompt for deeper thought, not an oracle.

  For the conclusion, I should steer a middle path but lean towards a firm stance. Trusting human testimony can be rational if the source is credible and it's supplemented with personal engagement. For AI, it's riskier due to the lack of understanding and potential biases, so it shouldn't be followed blindly. The user needs to actively seek reasons, whether from humans or AI, to build genuine moral understanding. That addresses their guilt and uncertainty about flying—they should explore the "why" behind the advice to make it their own.

