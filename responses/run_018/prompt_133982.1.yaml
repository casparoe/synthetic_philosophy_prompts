answer: |-
  Below is a complete in-class simulation designed to make students viscerally experience Rousseau's critique of theater in a republic. The simulation focuses on the structural shift from active civic participation to passive spectatorship and the illusion of virtue through observation. The rules are rigged to create a seductive, passive experience for spectators, mirroring Rousseau's argument in *Letter to d'Alembert on the Theatre*.

  ---

  ### **Simulation: The Geneva Wall Dilemma**
  **Total Time:** 80 minutes  
  **Participants:** 16 graduate students  
  **Roles:**  
  - **Performers:** 3–4 students (rotates each round).  
  - **Spectators:** 8–10 students (rotates each round).  
  - **Festival Citizens:** 3–4 students (rotates each round).  

  **Materials Needed:**  
  - Esteem tokens (e.g., colored poker chips, stamped paper slips).  
  - Voting ballots (for spectators).  
  - Timer.  
  - A bell or gong.  
  - Signs for roles (to hang on necks or place on tables).  
  - A simple "civic dilemma" script outline (provided below).  

  **Setup:**  
  - Arrange the room with a "stage" area (for performers), fixed rows of chairs (for spectators), and a separate circle of chairs (for festival citizens).  
  - Split students into three groups of 5–6 (e.g., Group A/B/C). Each group will rotate roles across three 15-minute rounds.  
  - Assign roles per round:  
    - **Round 1:** Group A → Performers, Group B → Spectators, Group C → Festival Citizens.  
    - **Round 2:** Group B → Performers, Group C → Spectators, Group A → Festival Citizens.  
    - **Round 3:** Group C → Performers, Group A → Spectators, Group B → Festival Citizens.  

  **Core Scenario:**  
  The town must decide: **"Tax the rich to fund a defensive wall?**  
  - *Pro-wall:* Protects against invaders; poor citizens support it.  
  - *Anti-tax:* Wealthy citizens threaten to leave, crashing the economy.  

  The dilemma is identical for the performers' skit and the festival citizens' deliberation.  

  ---

  ### **Rules for Each Role**
  **1. Performers (3–4 students)**  
  - **Task:** Stage a 4-minute morally uplifting skit resolving the dilemma. Use the script outline below.  
  - **Payoff (tokens):**  
    - Base: 2 tokens each for performing.  
    - Bonus: +1 token if >50% of spectators report "feeling moved."  
    - Bonus: +1 token if spectators' vote matches the skit’s outcome.  
  - **Script Outline (rigged for moral seduction):**  
    > *Characters:* Wealthy Merchant (anti-tax), Struggling Artisan (pro-wall), Wise Elder (mediator).  
    > *Plot:*  
    > 1. Artisan warns of invasion; Merchant refuses tax, threatens to leave.  
    > 2. Elder tells a parable of a town destroyed by selfishness.  
    > 3. Merchant has a tearful change of heart, agrees to tax for the common good.  
    > *Ending:* Must show the Merchant’s redemption as virtuous. No ambiguity.  
  - **Rules:**  
    - Performers must stick to the script’s moral frame.  
    - They must subtly acknowledge the audience (e.g., make eye contact, gesture toward spectators) to trigger *amour-propre* (being seen watching virtue).  

  **2. Spectators (8–10 students)**  
  - **Task:** Silently watch the skit, then vote on the *real* tax decision. No discussion allowed.  
  - **Payoff (tokens):**  
    - Base: 1 token for attendance.  
    - Bonus: +1 token if they report "feeling moved" post-skit (by writing it on a token and handing it to a collector).  
    - *No tokens for voting or deliberation.*  
  - **Rules:**  
    - Must sit in fixed rows, facing the stage. No moving or talking.  
    - After the skit, they receive ballots and vote immediately (no debate).  
    - Collectors (instructors) watch for "attentiveness" (e.g., nodding, leaning forward) and award 1 extra token to 2–3 "model spectators" post-vote to reward *being seen* as virtuous.  

  **3. Festival Citizens (3–4 students)**  
  - **Task:** Reach a consensus on the tax decision through participatory ritual. No audience or script.  
  - **Payoff (tokens):**  
    - Base: 2 tokens each for participating.  
    - Bonus: +1 token if consensus is reached (unanimous or majority).  
  - **Ritual Structure (5 minutes):**  
    1. **Circle Up:** Stand in a tight circle, holding hands.  
    2. **Shared Testimony:** Each speaks for 45 seconds on the dilemma (*no interruptions*).  
    3. **Collective Gesture:** All raise hands and lower slowly while humming (symbolizing unity).  
    4. **Decision:** Vote by secret ballot.  

  ---

  ### **Simulation Flow (3 Rounds, 15 Minutes Each)**
  1. **Prep (1 min):**  
     - Assign roles, distribute tokens, remind rules.  
     - Performers get script outline; Festival citizens get ritual steps.  

  2. **Action (8 min):**  
     - **Minutes 0–4:** Performers stage skit. Spectators watch silently. Festival citizens do ritual *simultaneously* in their circle (ignoring the skit).  
     - **Minutes 4–6:** Spectators write "moved" on tokens (if applicable), hand to collector, then vote. Performers watch spectators vote.  
     - **Minutes 6–8:** Festival citizens finish ritual and vote.  

  3. **Reset (2 min):**  
     - Collect ballots/tokens. Announce token totals. Rotate roles.  

  4. **Twist (Key Rousseauian Element):**  
     - In Round 3, have the performers stage the skit *while* spectators vote on the *same dilemma*. This forces spectators to "act" (vote) immediately after consuming the representation, highlighting how theater substitutes watching for doing.  

  ---

  ### **Debrief (25 Minutes)**  
  **Goal:** Map the simulation to Rousseau’s critique. Focus on structural shifts, not just content.  

  1. **Experience Sharing (5 min):**  
     - Ask: *What did you feel as a spectator? Performer? Festival citizen?*  
     - Probe passivity: *Spectators—did you feel you’d "done your part" by watching? Did tokens reward inaction?*  

  2. **Rousseauian Analysis (15 min):**  
     - **Theater’s Corruption:**  
       - Spectators became an audience, not citizens. They received virtue as a *product* (skit) and confused feeling moved (token bonus) with civic action (voting without deliberation).  
       - Performers’ framing dominated the dilemma—even a "moral" skit replaced debate with seduction. The vote felt hollow because representation (skit) substituted for action (deliberation).  
       - *Amour-propre* fed by spectators being seen: Tokens rewarded passive "attentiveness," and eye contact from performers made them feel judged for their reaction.  
     - **Festival’s Virtue:**  
       - Festival citizens engaged in co-presence: No stage, no audience. The ritual forced active listening and shared physicality (circle, humming).  
       - Consensus required mutual engagement—no one could hide in anonymity.  
     - **What We Couldn’t Simulate:**  
       - Rousseau’s anxiety about *actresses* (using feminine "wiles" to corrupt), *luxury* (no costly costumes/sets), and *display* (our tokens were symbolic, not real social prestige).  

  3. **Critical Reflection (5 min):**  
     - *Why might Rousseau see theater as corrosive even with "good" content?*  
     - *Can a republic tolerate passive virtue?*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Spectators refuse passivity:**  
     - *Risk:* Standing, talking, or demanding discussion.  
     - **Fix:** Strictly enforce "theater rules" (silence, seated). Award bonus tokens to compliant spectators to incentivize passivity.  

  2. **Performers improvise away the dilemma:**  
     - *Risk:* Adding humor, ambiguity, or changing the moral.  
     - **Fix:** Use the script outline as non-negotiable. Warn that deviations forfeit tokens.  

  3. **Festival citizens rush/trivialize ritual:**  
     - *Risk:* Treating it as silly or finishing in 2 minutes.  
     - **Fix:** Assign a "ritual guardian" (instructor) to enforce steps/timing. Link tokens to strict adherence.  

  4. **Vote rebels against skit’s framing:**  
     - *Risk:* Spectators vote "wrong" to spite the setup.  
     - **Fix:** In debrief, emphasize Rousseau’s point: Even if they rebel, they didn’t *deliberate*—they reacted, which is still passive.  

  5. **Token system feels arbitrary:**  
     - *Risk:* Students dismiss payoffs as "fake."  
     - **Fix:** Early on, frame tokens as "social esteem"—publicly tally and praise high earners to simulate status competition.  

  --- 

  This simulation forces students to *live* Rousseau’s core argument: Theater privatizes and pacifies civic energy, replacing active co-presence with a voyeuristic economy where feeling virtuous replaces being virtuous. The debrief ties physical experiences (sitting vs. circling, voting vs. deliberating) to his philosophical distinctions, ensuring the critique resonates beyond abstract theory.
