  *stares into distance* The user's absolutely right about engineers being excluded from the metaphor. Construction requires intentional designers, but if reductionism is true, who's the "engineer" of morality? If it's just evolution, that reduces norms to survival advantages, which feels... unsatisfying for explaining why we feel accountable. 

