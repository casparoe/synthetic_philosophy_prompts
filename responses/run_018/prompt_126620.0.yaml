prompt: |-
  I'm in an upper-level philosophy of biology seminar drafting our final exam, and I need one 90-minute essay question on Gould and Lewontin's spandrels critique that students cannot answer by reciting the standard summary of architectural spandrels or listing classic morphological examples. I want the question to force them to confront whether the critique is primarily methodological—about burden of proof and the adaptationist program—or merely empirical, and to apply that distinction to a specific conceptual case: whether human numerical cognition is best explained as an adaptation for quantitative foraging or as a spandrel of domain-general working-memory and spatial-reasoning architectures. The prompt should require students to take a committed, defended position on whether treating numerical cognition as a spandrel weakens adaptationist evolutionary psychology or only relocates its explanatory targets, and to ground that position in the logical difference between spandrels and exaptations.

  Please provide:
  1. The exam question itself, calibrated for about 800 words.
  2. A model answer of roughly 600 words that takes a definite stance—no neutral survey of both sides—and works through the reasoning explicitly.
  3. A marking scheme out of 20 points that lists the specific analytical moves an A answer must contain (for instance, correctly identifying that spandrels challenge the null hypothesis rather than denying adaptation is possible) and the precise errors that should cost marks (for instance, conflating spandrels with exaptations or treating the critique as purely about trait prevalence). The scheme should clearly separate an A from a B by naming which moves are present versus missing, with point values attached. Do not include bibliographies, reading lists, or citation requests.
