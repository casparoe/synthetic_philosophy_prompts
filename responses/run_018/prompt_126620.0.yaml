answer: |-
  ### Exam Question (Target: 800 words, 90 minutes)  
  **"Gould and Lewontin’s 'spandrels' critique is often mischaracterized as a purely empirical dispute about the *prevalence* of adaptations versus non-adaptive traits. Defend a clear position on whether their argument is instead a profound *methodological* challenge to the 'adaptationist programme' in evolutionary biology, focusing specifically on how shifting burden of proof alters explanatory strategies. Ground your argument in the *logical distinction* between spandrels and exaptations. Subsequently, apply this framework to the debate over human numerical cognition: is it best understood as (1) an adaptation for quantitative foraging efficiency, or (2) a spandrel arising from domain-general working memory and spatial reasoning? Crucially, conclude by arguing whether treating numerical cognition as a spandrel fundamentally *weakens* adaptationist evolutionary psychology or merely *relocates* its explanatory targets to underlying cognitive architectures. Your essay must take a committed stance and explicitly justify its reasoning."**

  ---

  ### Model Answer (Target: ~600 words)  
  **Stance:** Gould and Lewontin’s spandrels critique is primarily a *methodological* correction targeting the adaptationist programme’s burden of proof, not an empirical denial of adaptation’s importance. Treating human numerical cognition as a spandrel fundamentally weakens adaptationist evolutionary psychology by exposing its core methodological flaw: the failure to rigorously test the "null hypothesis" of non-adaptive origins before invoking selective scenarios.

  **Spandrels as Methodological Corrective:**  
  The core of the spandrels critique is not that adaptations don’t exist, but that adaptationists systematically *presume* selection as the *default* explanation without first eliminating plausible non-adaptive alternatives. Spandrels – traits arising as necessary by-products of structural constraints (like the triangular spaces beneath a dome) – demand that the *null hypothesis* in evolutionary explanation should be non-adaptive structural constraint. Only after this null is reasonably excluded should complex adaptive stories be entertained. This flips the adaptationist burden of proof. Crucially, **exaptations** (features co-opted *later* for a current function) differ logically from spandrels: exaptations *begin* as adaptations (for an original function) or spandrels, but their *current utility* is explained by selection acting *after* their origin. Spandrels highlight *origins without initial adaptive function*; exaptations describe *subsequent utility*. Conflating them obscures the critique’s methodological point: origins matter.

  **Numerical Cognition: Adaptationist Claim vs. Spandrel Hypothesis**  
  The adaptationist view posits numerical cognition (e.g., subitizing, counting) as a direct adaptation for tasks like tracking food quantities or social exchanges, optimized by selection for foraging efficiency. The spandrel hypothesis, however, argues that core numerical abilities emerge inevitably from the structural properties of domain-general systems: working memory’s limited capacity (yielding the "subitizing range" of ~1-4 items) and spatial reasoning architectures (enabling mental number lines). Numerical representations aren’t a dedicated "module" shaped *for* quantification; they are architectural side-effects. Selection may have *exapted* these spatiotemporal capacities *later* for complex math, but their *origin* lies in structural constraints.

  **Why This Weakens Adaptationist Evolutionary Psychology:**  
  Treating numerical cognition as a spandrel directly challenges adaptationist evolutionary psychology (EP) at its methodological foundation. Adaptationist EP typically begins by identifying a modern cognitive trait (e.g., numerical skill), assumes it conferred a reproductive advantage in the Pleistocene, and constructs a "just-so" selective story (e.g., for better foraging). The spandrel view forces a prior question: *Could this trait exist without being an original target of selection?* For numerical cognition, the evidence of its dependence on domain-general systems provides a plausible non-adaptive structural origin. This means the adaptationist EP claim *fails to meet its shifted burden of proof*; it didn’t seriously consider or test the spandrel null hypothesis. Merely relocating explanation to the underlying architectures (working memory/spatial reasoning) isn’t enough for adaptationist EP, because:  
  1.  **It transfers the burden:** Explaining *those* architectures now requires the same methodological rigor – were *they* adaptations or spandrels?  
  2.  **It undermines "direct" adaptationism:** The complex, domain-specific cognitive "adaptation" (numeracy) dissolves into a by-product, weakening the core EP paradigm of identifying numerous, discrete, domain-specific psychological adaptations shaped for specific ancestral problems. The spandrel origin suggests numeracy’s features are dictated by pre-existing structural constraints, not optimization for a specific quantitative foraging niche.  

  Therefore, recognizing numerical cognition as a spandrel exemplifies how Gould and Lewontin’s critique fundamentally weakens adaptationist EP by enforcing a stricter methodology where non-adaptive origins are the essential starting point, exposing the program’s tendency toward premature adaptive storytelling.

  ---

  ### Marking Scheme (Total: 20 Points)
  **To Achieve an A (17-20 points), an essay MUST:**  
  1.  **Correctly Frame the Core Critique (4 pts):** Explicitly and accurately identify the spandrels critique as *methodological*, focusing on the *burden of proof* and the need to test a *null hypothesis of non-adaptive origin (structural constraint)* before invoking adaptation. *Not* just describing it as about trait prevalence.  
  2.  **Precisely Distinguish Spandrels & Exaptations (4 pts):** Clearly articulate the logical difference: Spandrels = *origin* as non-adaptive by-products of structural necessity. Exaptations = *current utility* derived from later co-option of a feature (regardless of original origin - adaptation *or* spandrel). Avoid conflation.  
  3.  **Apply Distinction to Numerical Cognition (4 pts):** Analyze the numerical cognition debate using the spandrel/exaptation framework. Argue coherently *why* the spandrel hypothesis sees it as a by-product of domain-general systems (working memory capacity/spatial reasoning), contrasting this with the adaptationist view (direct selection for quantitative foraging).  
  4.  **Take a Clear Stance on EP's Vulnerability (4 pts):** Argue definitively *whether* treating numeracy as a spandrel weakens adaptationist EP or merely relocates targets. An A answer must go beyond relocation to explain *how* it weakens EP (e.g., exposes failure to consider null hypothesis, dissolves purported domain-specific adaptation into constraint-driven by-product, transfers burden problematically to underlying systems, undermines premise of direct optimization for specific niches).  
  5.  **Maintain Coherent Reasoning & Structure (4 pts):** Logically connect points 1-4. Avoid significant factual errors, irrelevance, or major omissions. Writing is clear and concise.

  **For a B (13-16 points), an essay will likely:**  
  *   Identify the methodological aspect but not fully articulate the burden-of-proof/null hypothesis shift (e.g., stops at "it's about considering alternatives").  
  *   Mention spandrels and exaptations but provide a muddled or incomplete distinction (e.g., implies spandrels are just non-adaptive, doesn't clarify origin vs. utility).  
  *   Discuss numerical cognition but not rigorously apply the spandrel/exaptation logic or weakly contrast the adaptationist vs. spandrel hypotheses.  
  *   Take a stance on EP but provide a superficial or inconsistent justification for weakening vs. relocation (e.g., says it weakens EP only because spandrels are "not adaptations" without methodological depth, or claims relocation alone constitutes sufficient adaptationist explanation).  
  *   Show generally sound reasoning but with minor logical gaps or less precise connections between concepts.

  **Deductions (Apply as needed from any category):**  
  *   **-2 to -4 pts:** Treating the critique as purely empirical (about how *many* traits are adaptations).  
  *   **-2 to -3 pts:** Significant conflation of spandrels with exaptations or other non-adaptive concepts (e.g., "spandrels are just exaptations," "spandrels mean no function").  
  *   **-2 to -3 pts:** Failure to meaningfully engage with the specific numerical cognition case study or misrepresenting the adaptationist/spandrel positions.  
  *   **-2 pts:** Undefended or inconsistent stance on whether spandrels weaken or relocate EP targets.  
  *   **-1 to -2 pts:** Major factual errors (e.g., misdefining core concepts), significant incoherence, or poor structure.  
  *   **-1 pt (per instance):** Ungrounded claims about trait prevalence or effectiveness not required by the prompt.
