  hey, im in a philosophy of action / moral worth course and in teh seminar yesterday someone used 'moral worth is in the will, not in the deed' to dismiss an argument about effective altruism — basically that donating millions for malaria nets doesnt count for moral credit if you're mainly chasing tax breaks or status. i feel like teh slogan is hiding like five different claims but i cant seperate them.

  can you lay out teh precise readings as a menu? for each one, say whether its trivial, defensible but controversial, or just false, and flag which reading the person in seminar was probably using to get teh 'effective altruism doesnt count' conclusion.

  to make it concrete, im working with a three-layer thing my prof threw out (not sure if its standard): the operative reason (what actually moves me), teh normative reason (what justifies teh act), and teh structural reason (whether my psychology is aligned with teh moral structure of teh act even if i dont realize it). for each layer, does teh slogan demand alignment? and which alignments are actually required for moral worth?

  also, how does this handle deviant causal chain cases — like you save someone from drowning but only because you wanted to steal their wallet and teh rescue was accidental? does teh slogan say that counts or not?

