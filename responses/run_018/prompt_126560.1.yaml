  ### **Leaf Positions**  
  Based on answers, assign one of the following positions. **Bold** labels denote established historiographical stances; *italicized* labels are descriptive for rare/unoccupied combos.  

  #### **Discontinuity Branch Leaves**  
  | A1 | A2 | A3 | Position Name & Description | Occupied? |  
  |----|----|----|-----------------------------|-----------|  
  | Yes | Yes | Institutional | **Institutional Dual-Discontinuist**: Two real breaks (Renaissance + SciRev), driven by structures. | Rare; emphasizes patronage/print. |  
  | Yes | Yes | Epistemic | **Epistemic Dual-Discontinuist**: Two real breaks, driven by ideas/methods. | Rare; emphasizes humanist + scientific shifts. |  
  | Yes | Yes | Both Equally | **Integrated Dual-Discontinuist**: Two real breaks, ideas and institutions intertwined. | Common (e.g., classic narratives). |  
  | Yes | No | Institutional/Epistemic/Both | ***Renaissance-Focused Discontinuist***: Break *only* in Renaissance; SciRev is exaggerated projection. | Rare; SciRev denial uncommon among discontinuists. |  
  | No | Yes | Institutional | **Institutional SciRev-Discontinuist**: One real break (SciRev), driven by structures. | Established (e.g., "social history" focus). |  
  | No | Yes | Epistemic | **Epistemic SciRev-Discontinuist**: One real break (SciRev), driven by ideas. | Established (e.g., Koyré, Butterfield). |  
  | No | Yes | Both Equally | **Integrated SciRev-Discontinuist**: One real break (SciRev), all factors matter. | Most common "classic" view. |  
  | No | No | Institutional/Epistemic/Both | ***Silent Discontinuist***: Break(s) happened, but actors *never* self-aware; labels are later inventions. | Rare; combines realism with strong constructivism. |  

