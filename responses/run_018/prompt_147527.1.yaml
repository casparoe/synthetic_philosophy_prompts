answer: |-
  ## Workfare Villanelle

  The token clicks the turnstile, start the run,
  Toward the time clock punching in the grey.
  **The paper that demands I am the one**
  Deserving. Sweat replaces morning sun,
  The mop, the bin, the minimum they pay
  **The hours that pay for my hunger.** Done,

  I queue again where weary faces shun
  The light. Red stamps mark yesterday,
  **The paper that demands I am the one**
  Who must account for every task begun,
  Each transit fare, each meagre meal's display.
  **The hours that pay for my hunger.** Won

  This week's thin cheque? The ledger's just begun.
  New forms arrive, demanding I replay
  **The paper that demands I am the one**
  Who hasn't worked enough. Beneath the gun
  Of deadlines, prove I starve the proper way.
  **The hours that pay for my hunger.** Shun

  The thought of rest. The cycle's never spun
  To stop. The proof you give, the price you pay...
  **The paper that proves I am the one** breeds suspicion new,
  **The hours that pay for my hunger** leave deficit due.

  ---

  **Explanation:**

  *   **Form:** Strict villanelle structure (19 lines, 5 tercets ABA / 1 quatrain ABAA, refrains at ends of lines 1, 6, 12, 18 and 3, 9, 15, 19).
  *   **Refrains:**
      *   **"The paper that... I am the one"**: Evolves slightly ("demands" → "proves" in final line) to show the proof offered breeds new suspicion. Represents the perpetual demand for proof of deservingness.
      *   **"The hours that pay for my hunger"**: Represents the extracted labor meant to cancel the 'debt' of need, yet leaves a new deficit.
  *   **Turning Point:** The final quatrain (lines 16-19) brings the refrains together explicitly, revealing the cruel loop: providing the proof breeds new suspicion (line 18), performing the labor creates new deficit/hunger (line 19). Satisfaction resets the demand.
  *   **Concrete Imagery:** Bus token, time clock, red stamps, mop, bin, queue, transit fare, thin cheque, forms, deadlines – grounding the abstract "moral bookkeeping" in tangible reality.
  *   **Moral Bookkeeping:** Suffering (queueing, deadlines, proving starvation "the proper way") is the entry fee. Labor (hours mopping, bin-emptying) is the repayment. Yet the books never balance ("ledger's just begun," "deficit due").
  *   **Perspective:** Internal, experiential, avoiding external preaching. Focuses on the relentless cycle, the exhaustion ("weary faces shun / The light"), and the systemic trap ("The cycle's never spun / To stop").
  *   **Avoids Simplification:** Doesn't blame individuals or rant about cruelty; shows the *mechanism* through the lived experience and objects. The inherent suspicion ("breeds suspicion new") and inherent deficit ("leave deficit due") are systemic features, not personal failings.
  *   **Final Couplet Impact:** The slight shift in the first refrain ("proves" instead of "demands") combined with the explicit consequences ("breeds suspicion new," "leave deficit due") delivers the core message: the system is designed for perpetual, unclosable debt.
