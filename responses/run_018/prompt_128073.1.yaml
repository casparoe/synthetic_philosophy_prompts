prompt: |-
  I am preparing a single ninety-minute seminar for first-year internal-medicine residents. They have substantial clinical experience but no formal philosophy training. The concept I need them to grasp is not the generic killing-versus-letting-die distinction, but a specific structural variant I will call the maintained-omission problem: an omission becomes morally active in the same register as a killing when an agent continuously sustains the institutional or physical conditions that prevent rescue, rather than merely failing to intervene in a one-off situation.

  Plan the explanatory arc for the session. First, state the dependency order: which idea must be secured before the residents can recognize a maintained omission (for instance, the distinction between a baseline that is naturally given and one that is engineered by prior choices), and which idea must come only after that is stable. Second, specify the one carrying case—realistic, clinical, and not the familiar ventilator-withdrawal scenario—describing exactly what features it needs (e.g., an ongoing resource-allocation protocol the physician co-authored and continues to enforce) and what it must lack (e.g., a sudden, unanticipated emergency decision made in isolation). Third, map the misconceptions they will form in sequence—likely beginning with “if my hands do not touch the patient, my agency is not involved,” then “institutional rules diffuse personal responsibility,” then “withholding care is always less active than withdrawing it”—and indicate the precise point in the arc where each misconception should be headed off, together with the specific distinction or question you would deploy at that point. Fourth, design the final check for understanding: one brief judgment task or modified scenario that reveals whether they have grasped the structural claim rather than merely feeling moral discomfort. Fifth, say explicitly what standard frameworks—such as the four-principles approach or a simple utilitarian calculus—should be named and set aside at this level, with a brief reason why each obscures the maintained-omission point. Finally, identify where your reasoning about this sequence is most likely to fail: what clinical objection or feature of real-world triage would undermine the claim that maintained omissions belong in the same moral category as killings, and what specific consideration or counterexample would change your mind about either the suitability of this case or the coherence of the maintained-omission framework itself.
reasoning: |-
  Hmm, this is an advanced ethics teaching request from someone clearly deeply familiar with both clinical medicine and moral philosophy. The user wants a seminar plan focused on a nuanced concept - "maintained omission" - for first-year internal medicine residents. They've specified five precise structural requirements: dependency order of ideas, a clinical case with specific features, anticipated misconceptions with intervention points, an understanding check, and frameworks to set aside.

  The core challenge is distinguishing maintained omissions from simple omissions. Key dependencies seem to be: first establishing the concept of engineered baselines versus natural states, then introducing institutional agency, before finally presenting the maintained omission framework. A dialysis allocation case would work well here - it's clinically realistic, involves ongoing protocol enforcement, and avoids ventilator analogies. 

  I anticipate three key resident misconceptions: the "clean hands" fallacy (agency only through direct action), the "diffused responsibility" error (hiding behind systems), and the false withholding/withdrawing hierarchy. Each needs specific counter-tools: for clean hands, showing how protocol maintenance is active; for diffused responsibility, demonstrating personal authorship; for withholding myth, emphasizing equivalent ongoing choices.

  For the understanding check, modifying the dialysis case to show how protocol renewal constitutes continuous action could work well. We should explicitly set aside principlism and utilitarianism - they either atomize the issue or overlook structural continuity. 

  The biggest vulnerability is probably emergency triage situations where physicians don't control resource constraints. If a case showed clinicians genuinely powerless to change systems despite opposing them, that might challenge the framework. Also, if residents push back on equating protocol maintenance with direct killing, we'd need to acknowledge the phenomenology difference while stressing equivalent causal responsibility.

  The user seems to want residents to recognize how their ongoing system-sustaining actions differ from passive non-intervention. This has huge implications for quality improvement work and protocol design ethics. The seminar must avoid philosophical jargon while preserving conceptual precision - quite a balancing act.
answer: |-
  Here’s a structured seminar plan targeting the "maintained omission" concept, designed for clinically experienced but philosophically novice residents:

  ### **1. Dependency Order of Ideas**  
     - **Prerequisite 1: Engineered Baseline vs. Natural State**  
       *Must be secured first:* Residents must distinguish between a *natural* baseline (e.g., untreated metastatic cancer) and an *engineered* baseline (e.g., a ventilator-dependent patient weaned to room air *by prior protocol*). Use a non-clinical analogy: "A river flooding a town (natural) vs. a dam you built now blocking flood relief (engineered)."  
     - **Prerequisite 2: Institutional Agency as Personal Agency**  
       *Follows baseline distinction:* Clarify that co-authoring/enforcing institutional protocols is an extension of personal agency. Ask: "If you designed a hospital policy delaying antibiotics until sepsis criteria are met, is that 'you' acting?"  
     - **Final Concept: Maintained Omission**  
       *Only after prerequisites:* Define it as "continuously upholding the structural barriers to rescue, making omission functionally equivalent to killing."  

  ---

  ### **2. The Carrying Case: Outpatient Dialysis Allocation Protocol**  
  **Scenario**:  
  *A hospital network faces dialysis machine shortages. Residents co-designed a protocol (approved 6 months ago) allocating machines only to patients with >5-year life expectancy. A 70-year-old diabetic with CKD5 (excluded by protocol) presents in uremic crisis. You could override the protocol to admit him for emergent dialysis but choose to enforce it, citing fairness. He dies 48 hours later.*  

  **Required Features**:  
  - **Institutional Continuity**: Protocol was co-authored by attendees and is re-affirmed monthly.  
  - **Ongoing Enforcement**: Residents actively apply it daily; override is possible but requires justification.  
  - **Non-Emergency**: Death is predictable and occurs hours after decision (no sudden crisis).  
  - **Avoids Ventilator Analogies**: Focus on resource allocation, not withdrawal of existing support.  

  **Excluded Elements**:  
  - No acute emergency (e.g., ER triage under disaster conditions).  
  - No unilateral decision; emphasizes system upkeep.  

  ---

  ### **3. Anticipated Misconceptions & Interventions**  
     | **Misconception** | **Intervention Point** | **Tool to Deploy** |  
     |-------------------|------------------------|-------------------|  
     | **"No hands-on, no agency"** | After presenting case | *Distinction:* "Is turning off a ventilator (hands-on) meaningfully different from *preventing* its placement by protocol? Both control outcomes." |  
     | **"Institutions diffuse responsibility"** | During Q1 discussion | *Question:* "If you *revised* this protocol tomorrow but chose not to, is your ongoing endorsement neutral?" |  
     | **"Withholding < Withdrawing"** | When comparing cases | *Counterexample:* "Is rationing insulin from a diabetic (withholding) less active than confiscating their insulin pump (withdrawing)?" |  

  ---

  ### **4. Check for Understanding: Judgment Task**  
  **Modified Scenario**:  
  *The dialysis protocol includes a 6-month review clause. At the review meeting, you vote to renew it unchanged despite new data showing expanded capacity. A patient dies the next week under the protocol.*  

  **Prompt**: *"Is renewing the protocol meaningfully different from denying dialysis? Why?"*  
  - **Key Insight**: Renewal is a *reaffirmation* of the omission, making it an active choice. Correct responses will note the *deliberate re-engineering of barriers*.  

  ---

  ### **5. Frameworks to Set Aside**  
     - **Principlism (Autonomy/Beneficence)**:  
       *Why obscure?* Focuses on discrete acts, not sustained structural causation.  
     - **Utilitarianism (Net Benefit)**:  
       *Why obscure?* Justifies outcomes but ignores the moral weight of *how* the outcome is produced (active upkeep vs. passive neglect).  
     - **DDE (Double Effect)**:  
       *Why obscure?* Misapplies "intention" to systemic actions; conflates *foreseeing* harm with *sustaining* harm.  

  ---

  ### **6. Likely Failure Point & Counterarguments**  
     - **Clinical Objection**: *"In real triage, we inherit systems we can’t change. Isn’t this just tragic inevitability?"*  
       **Rebuttal**: Focus on *renewable choices* (e.g., protocol reviews, opting not to advocate for change). If residents have *zero* power to influence systems, the framework weakens.  
     - **Counterexample Challenging Coherence**:  
       *Scenario*: A resident inherits a resource-limited protocol in a refugee camp. Override is impossible; dissent risks expulsion.  
       **Why it changes my view**: If agency is genuinely annulled (no realistic capacity to alter structures), the omission reverts to "passive." The framework requires *feasible agency*.  
     - **Refinement**: Emphasize *gradients of maintenance* (e.g., voting to renew vs. silently complying). The moral equivalence to killing holds strongest when agents *renew* the barriers.

  ---

  **Seminar Arc Summary**:  
  1. (15 min) **Baselines**: Natural vs. engineered (clinical/non-clinical examples).  
  2. (20 min) **Agency in Systems**: Group exercise dissecting protocol authorship.  
  3. (20 min) **Dialysis Case Analysis**: Highlighting protocol upkeep.  
  4. (15 min) **Misconception Busting**: Guided debate using intervention tools.  
  5. (10 min) **Judgment Task**: Vote + rationale sharing.  
  6. (10 min) **Conclusion**: Why standard frameworks miss this; limits in real-world scarcity.  

  This sequence prioritizes conceptual dependencies, uses a clinically resonant case, preempts trainee misunderstandings, and tests for structural (not emotional) comprehension while acknowledging the framework’s fragility under coercion.
