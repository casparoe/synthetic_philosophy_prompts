  ## Four-Minute Opening Remarks: Honoring Dr. Miriam Okonkwo

  **(Begin with warmth and presence)**

  Good morning. What a profound honor and privilege it is to welcome you all as we gather to celebrate the remarkable career and enduring legacy of Dr. Miriam Okonkwo. To the clinicians – physicians, nurses, coordinators – who walked alongside Miriam in the crucible of patient care: your presence speaks volumes. And to our philosophers, theologians, and bioethicists who engaged deeply with her intellectual rigor: we are grateful for your thoughtful presence. This unique gathering reflects the two vital spheres Miriam inhabited so masterfully: the intensely human world of clinical practice and the demanding realm of ethical principle.

  **(Introduce the Core Principle)**

  For twenty-eight years, Dr. Okonkwo guided our Ethics Consultation Service not with shifting sands of pragmatism, but anchored to a foundational conviction drawn from Augustine’s *De Mendacio*. Her guiding star was this: **Every intentional verbal deception – every *mendacium* – is a corruption of the speaker’s own moral integrity.** Not sometimes, not only when harm is done, not even in the face of immense suffering or the desire to ease profound pain. It is always, inherently, a corrosive act for the one who speaks the lie. She adopted Augustine's intricate eight-grade taxonomy not to find loopholes or rank excusable falsehoods, but to demonstrate with unflinching clarity that even the seemingly most noble lie – the "officious lie" told to preserve life or alleviate agony – remains forbidden. The stain, for Miriam, was on the soul of the speaker.

  **(Clarify the Distinction: Silence is Key)**

  Yet – and this is absolutely crucial to understanding Miriam’s profound impact – her unwavering stance against the *mendacium* was **never** a prescription for brutal, unvarnished truth-telling devoid of compassion. Her genius, her profound gift to us, lay in rigorously distinguishing the forbidden *lie* from the **permissible, and often deeply compassionate, power of silence and truthful speech.** Strategic silence. Truthful ambiguity. A direct, respectful refusal to answer. These, she taught us, are not deceptions. They carry no such moral stain. They are the tools of integrity *and* humanity.

  **(Illustrate the Practice - Clinician Focus)**

  Clinicians, you know this Miriam intimately. You saw her **refuse to approve consent language** that might lull a patient or family into a "therapeutic misconception," not to be harsh, but to honor their autonomy with genuine understanding. You witnessed her **train generations of residents** to say those three powerful, liberating words: "**I don't know**," rather than fabricate a hollow reassurance that would ultimately betray trust. And who among you hasn't seen her legendary capacity? Miriam **sitting in silence** with a grieving family – not a cold silence, but a *truthful* silence, a space held open with profound presence, refusing the easy euphemism, allowing the unbearable weight of reality to be borne *together*, honestly. That silence wasn't indifference; it was the deepest respect for their pain and their humanity. It was compassion manifested through unwavering integrity.

  **(Address the Philosophers & Synthesize)**

  Philosophers and theologians, you recognize the profound Augustinian commitment underpinning this. Miriam demanded intellectual honesty about the nature of deception itself. She challenged us to see that justifying a "good lie" fundamentally compromises the moral agent, regardless of consequence. Her legacy in your field is one of **rigorous fidelity to this principle**, a refusal to let noble ends corrupt the essential means of truthful communication. She forced the conversation back to the intrinsic wrong of the lie itself.

  **(Bridge and Praise - The Legacy)**

  So, what do we celebrate today? We celebrate **not** that Miriam Okonkwo believed truth-telling magically erased suffering – she, more than most, understood its depth. We celebrate **not** that she offered simple answers where there were none. We celebrate **not** rigidity, but **radical integrity**.

  We celebrate a leader who taught us that **true compassion does not require the corruption of a lie.** We celebrate a scholar who demonstrated that **moral clarity can coexist with profound human presence.** We celebrate a practitioner who showed us that **holding the space of truthful silence – or speaking the hard, limited truth – can be the most authentic form of care, respecting both the sufferer and the moral self.**

  **(Conclude)**

  Dr. Okonkwo, Miriam, you leave us a legacy etched not in compromise, but in the courageous, quiet distinction between the *mendacium* that corrupts and the truthful silence that dignifies. You showed us that ethical rigor *is* a form of deep compassion, and that unwavering principle, practiced with presence, builds enduring trust. Thank you for twenty-eight years of luminous, challenging, and utterly indispensable guidance. We are deeply grateful, and we are profoundly shaped by your example.

  **(Raise Glass/Applause)** Let us begin this workshop in celebration of Dr. Miriam Okonkwo!

  ---

  **Key Elements Addressed:**

  1.  **Dual Audience:** Directly acknowledges both groups and their connection to Miriam.
  2.  **Augustinian Principle:** Clearly states her core conviction from *De Mendacio*, emphasizing the inherent corruption of *any* lie for the speaker.
  3.  **Taxonomy Purpose:** Explains she used Augustine's grades to show *no* exceptions, especially rejecting the "officious lie."
  4.  **Crucial Distinction:** Explicitly highlights the difference between forbidden *mendacium* and permissible silence/truthful speech as central to her practice.
  5.  **Clinician Validation:** Uses concrete examples clinicians experienced (consent forms, "I don't know," sitting in silence) framed as acts of compassion, respect, and presence, *not* coldness or indifference.
  6.  **Philosopher Validation:** Acknowledges her rigorous adherence to the Augustinian principle as an intellectual contribution.
  7.  **Avoided Claims:** Does *not* say her truth-telling reduced suffering or was easy; focuses on integrity and respect. Does *not* imply she was indifferent to suffering; reframes silence/truth as compassionate alternatives. Does *not* dilute her principle for the clinicians.
  8.  **Legacy Framed:** Praises the *integration* of uncompromising principle with human presence and the powerful alternative of truthful silence/communication. Focuses on integrity, respect, and authentic care.
  9.  **Structure & Time:** Flows logically, uses signposting, and fits comfortably within a 4-minute delivery at a measured pace.
