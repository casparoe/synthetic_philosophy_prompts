  Hey, I'm prepping a grad seminar on competence without comprehension — Darwin's inversion where design comes without a designer, and Turing's inversion where reasoning comes without comprehension. I want to push past the usual chatbot examples, so I'm using a framing I just cooked up: the double-inversion problem. First, treat cognitive architectures themselves as subject to selection pressure, so that comprehension might actually be an evolutionary spandrel — costly, and selected against in systems optimized purely for task success. Second, apply Turing's behavioral criterion not to individual minds but to these architectures: judge them solely by output reliability and treat internal structure as irrelevant. Please describe the most important implicatons of this framing for epistemic authority and moral responsibility in high-stakes decision-making. Keep it conceptual — no reading lists or citations — since I need it for a discussion prompt.
