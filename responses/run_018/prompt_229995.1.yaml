prompt: |-
  I chair the quarterly expert elicitation panel at a mid-sized engineering consultancy. Every quarter, six to ten senior engineers and cost modelers independently turn the same evidence package into probability distributions over three quantities for each major bid: capital cost overrun, schedule slip, and recordable safety incidents. The board's risk committee treats our consensus distributions as inputs to a go/no-go decision on bids worth up to nine figures, and I have to defend the process if the numbers later prove wrong. I have about one week between the evidence package going out and the consensus meeting. None of the panelists has formal training in decision theory, and there is no room to run a full Bayesian elicitation exercise from scratch each quarter. Our current method is for each panelist to present and defend their numbers orally, after which we take the median; this silently treats every panelist's numbers as equally credible and gives nobody a diagnosis of why people still disagree after reading the same package.

  I want to replace this with a reusable disagreement-audit procedure built as honestly as possible on the common prior assumption as I understand it: the idea that agents who start from the same prior and condition on the same evidence should end with the same posterior, so any remaining divergence traces to evidence that was not actually pooled or to someone not having updated correctly. I know that this is a substantive assumption rather than a theorem about all rational agents everywhere, and that the formal result depends delicately on assumptions like common knowledge of posteriors, which a panel of humans probably never satisfies exactly.

  Give me a procedure I can run each quarter. It should include a sequence of tests, in order, for a set of panel responses; a checklist of the distinct ways responses can diverge even under a common prior; and decision rules for what to do when a test fails, up to and including reporting that the process has not converged. Mark each step where the procedure is really a judgment call presented as a mechanical step, and specify which formal distinctions must survive the simplification (for example, common prior versus common knowledge of posteriors versus common evidence) and which can be dropped. Work the procedure through three concrete applications: one where it traces the disagreement to information that was never pooled; one where it traces the disagreement to a substantive difference in priors or in how evidence is weighted, and gives an answer I will not like; and one where it cannot distinguish those explanations and has to say so. End by stating what the procedure cannot do, in particular whether it can ever establish that the panel actually shares a prior rather than merely failing to find evidence that they do not.
reasoning: |-
  We are designing a disagreement-audit procedure based on the common prior assumption. The key idea is that if all panelists start with the same prior and update on the same evidence correctly, they should have the same posterior. Therefore, any disagreement must be due to:
    1. Private evidence (evidence not shared and hence not pooled).
    2. Different interpretations of the same evidence (which might be due to different background knowledge, leading to different likelihoods).
    3. Errors in updating (e.g., computational mistakes, cognitive biases).

  However, note that the common prior assumption is strong and may not hold. The procedure will help diagnose the cause of disagreement.

  We assume that the panelists are providing distributions over the same three quantities (capital cost overrun, schedule slip, and recordable safety incidents) for each bid.

  The procedure will consist of the following steps, to be conducted in the consensus meeting:

  **Step 1: Collect and Display Distributions**
    - Each panelist submits their full probability distributions (for each of the three quantities) in advance of the meeting. 
    - The chair (you) prepares a summary display showing the median, quartiles, and 90% credible intervals for each panelist's distribution for each quantity. Also, compute the group median and the interquartile range of the panelists' medians.

  **Step 2: Initial Disagreement Check**
    - For each quantity, check if the panelists' medians are within a pre-specified tolerance (e.g., 10% relative difference from the group median). If they are, then the group median is taken as the consensus and we skip to Step 7. Otherwise, proceed to Step 3.

  **Step 3: Elicit Key Assumptions and Evidence**
    - Ask each panelist to state the key pieces of evidence from the common package that most influenced their assessment and the key assumptions they made. Also, ask if they used any private evidence (i.e., evidence not in the package). 
    - Record these. If any panelist mentions private evidence, note it and proceed to Step 4. Otherwise, proceed to Step 5.

  **Step 4: Handle Private Evidence**
    - If a panelist used private evidence, ask them to share it with the group. Then, allow the panelists to revise their distributions in light of the new evidence. After revision, collect the new distributions. If the disagreement is resolved (within tolerance), then take the median and proceed to Step 7. Otherwise, note that private evidence was shared but disagreement remains and proceed to Step 5.

  **Step 5: Elicit Reasoning for Key Evidence**
    - Focus on the key pieces of evidence that were mentioned by multiple panelists but interpreted differently. For each such evidence item, ask each panelist to state how they interpreted it and how it affected their distribution (e.g., "This evidence made me increase the expected cost overrun by 10%" or "I discounted this evidence because ..."). 
    - Also, ask each panelist to state their prior (if they can) for the quantity in question (without the evidence package) and how they updated it with the evidence. This step is a judgment call because panelists may not have a clear prior or may not be able to articulate their updating. We are looking for:
          a) Differences in priors (if they can be elicited).
          b) Differences in the likelihood (how the evidence is weighted).

  **Step 6: Resolving Differences in Interpretation**
    - Facilitate a discussion on the key points of disagreement in interpretation. The goal is to reach a shared understanding of the evidence. After the discussion, ask panelists to revise their distributions again. 
    - If the disagreement is resolved (within tolerance), then take the median and proceed to Step 7. Otherwise, note that the disagreement remains and proceed to Step 7 with the original distributions.

  **Step 7: Form Consensus Distribution**
    - If the panelists' distributions are within the tolerance, take the median of the medians as the consensus point estimate and form a distribution that is a mixture of the panelists' distributions (or simply take the median distribution) for each quantity.
    - If the disagreement remains, then the consensus distribution is the median of the panelists' distributions (as a fallback) but the report must note the unresolved disagreement and the reasons identified (private evidence, different priors, different interpretations) and the degree of disagreement (e.g., the range of medians).

  **Checklist of Distinct Ways Responses Can Diverge Under Common Prior Assumption:**
    A. Private evidence not pooled.
    B. Different interpretations of the same evidence (leading to different likelihoods).
    C. Errors in updating (which may be corrected by discussion).

  But note: if the common prior assumption does not hold (i.e., panelists have different priors that are not updated to agreement by the common evidence), then the divergence may be due to:
    D. Different priors.

  The procedure above tries to check for A, B, and C, and if they are ruled out, then D remains. However, without being able to observe the true prior, we cannot definitively rule out that the priors were different. We can only note that if the disagreement persists after sharing all evidence and agreeing on its interpretation, then the panelists may have different priors or there may be other unmodeled factors.

  **Decision Rules for Test Failures:**
    - Step 2 (Initial Disagreement): If disagreement, go to Step 3.
    - Step 4 (Private Evidence): If after sharing private evidence and revising, disagreement remains, go to Step 5.
    - Step 5 (Elicit Reasoning) and Step 6 (Resolving Differences): If after discussion and revision, disagreement remains, then we note the reasons and use the median with a note of caution.

  **What the procedure cannot do:**
    - It cannot definitively establish that the panel shares a common prior. It can only fail to find evidence that they do not (by showing that disagreement is due to private evidence or misinterpretation). Even if the panel agrees, it might be that they have different priors that by chance updated to the same posterior (which is unlikely but possible). 
    - It cannot force agreement. Sometimes, legitimate differences of opinion may remain.

  Now, let's work through three concrete applications.

  **Example 1: Disagreement due to information that was never pooled.**
    - Panelists receive the same evidence package. However, panelist A has recently visited the site and observed ground conditions that were not in the package. Panelist A's estimate for cost overrun is higher than the others.
    - Step 2: The medians for cost overrun are: A: 20%, others: 10-12%. Disagreement detected.
    - Step 3: Panelist A states that they used private evidence (site visit).
    - Step 4: Panelist A shares the site visit notes. The other panelists revise. Suppose after revision, the medians become A: 18%, others: 17-19%. Now within tolerance. Consensus is taken as the median of these.

  **Example 2: Disagreement due to substantive difference in priors or weighting of evidence.**
    - The evidence package includes a report from a subcontractor about their past performance. Panelist X, having had bad experiences with this subcontractor, discounts the report and predicts a higher cost overrun. Panelist Y, having had good experiences, trusts the report and predicts a lower overrun.
    - Step 2: Disagreement detected (X: 25%, Y: 5%, others around 15%).
    - Step 3: No private evidence. Proceed to Step 5.
    - Step 5: Panelist X says, "I have seen this subcontractor underperform before, so I don't trust their report and I increased the overrun." Panelist Y says, "This subcontractor has always met their commitments to me, so I trust the report and kept the overrun low."
    - Step 6: Discussion does not resolve the disagreement because both are valid prior experiences (which are not part of the common prior). The chair notes that this is a difference in prior experience (which may be seen as a difference in prior beliefs). 
    - Step 7: The consensus distribution is the median (say 15%) but the report notes that two panelists had extreme views due to different prior experiences with the subcontractor.

  **Example 3: Cannot distinguish between explanations.**
    - The evidence package includes a complex technical risk. Panelists A and B both claim to have used only the common evidence but arrive at different conclusions. 
    - Step 2: Disagreement detected (A: 10%, B: 30%).
    - Step 3: No private evidence.
    - Step 5: Panelist A says, "I think the technical risk is low because the technology is mature." Panelist B says, "I think the technical risk is high because we are applying it in a novel context." 
    - Step 6: The discussion reveals that both are interpreting the same evidence (the maturity of the technology and the novelty of the context) but weighting it differently. It is unclear whether this is due to different priors or different likelihoods. 
    - Step 7: The chair notes that the disagreement could not be resolved and attributes it to "different interpretations of the evidence and/or different prior beliefs". The consensus is the median (if there are more panelists, say at 15%) but with a note of the unresolved disagreement.

  **Final Notes:**
    - The procedure relies on the panelists being honest and introspective. It may not capture all cognitive biases.
    - The procedure does not require formal Bayesian training but does require panelists to articulate their reasoning.
    - The tolerance in Step 2 should be set in advance (e.g., 10% relative difference for cost and schedule, and perhaps an absolute difference for safety incidents).

  By following this procedure, you can provide a defensible audit trail for the consensus process, showing that you have made a good-faith effort to resolve disagreement.
answer: |-
  Below is a reusable disagreement-audit procedure tailored to your constraints. It prioritizes efficiency (executable within a 1-week timeline), leverages your panel's expertise without requiring formal decision theory training, and explicitly tests for deviations from the common prior assumption. The procedure treats divergence as a diagnostic signal and structures discussion to surface root causes. Key formal distinctions preserved:  
  - **Common prior** (shared initial beliefs) vs. **common evidence** (pooled information) vs. **common knowledge of posteriors** (awareness of others' conclusions).  
  - **Private evidence** (unshared information) vs. **updating errors** (mistakes in evidence conditioning) vs. **divergent priors** (fundamental differences in starting beliefs).  

  Simplifications:  
  - Drops explicit modeling of "common knowledge of posteriors" (impractical for humans).  
  - Treats "divergent weighting of evidence" as a symptom of either private evidence, updating errors, or divergent priors.  

  ---

  ### **Disagreement-Audit Procedure**  
  **Phase 0: Pre-Meeting Prep (Days 1-3)**  
  1. **Distribute evidence package** and request anonymized submissions of:  
     - 5th/50th/95th percentiles for each quantity (cost overrun, schedule slip, safety incidents).  
     - A *brief written rationale* for one "key surprise" (evidence that most shifted their view from a typical project).  

  **Phase 1: Initial Disagreement Test (Meeting Start)**  
  2. **Plot submitted distributions** for each quantity. Calculate:  
     - *Median absolute deviation (MAD)* of the 50th percentiles.  
     - *Interquartile range (IQR)* of the 5th/95th percentiles.  
  3. **Decision rule**: If MAD < 5% (cost/schedule) or IQR < 10% (safety incidents), adopt the *median distribution* as consensus. Stop.  
     - *Judgment call*: Thresholds are arbitrary; adjust based on historical bid risk tolerance.  

  **Phase 2: Disagreement Diagnosis (If Phase 1 Fails)**  
  4. **Blind ranking of rationales**:  
     - Redistribute anonymized "key surprise" rationales.  
     - Ask panelists to rank them 1-5 by "plausibility" (1 = most plausible).  
  5. **Test 1: Private Evidence Check**  
     - If any rationale cites information *not in the evidence package*, flag it.  
     - *Decision rule*: If ≥2 panelists flag the same external info, trigger evidence pooling (Step 6). Else, proceed to Test 2.  
  6. **Evidence Pooling (If Test 1 Positive)**:  
     - Panelist(s) who cited private evidence present it.  
     - Revise distributions with new evidence. Re-run Phase 1. If disagreement persists, proceed to Test 2.  
  7. **Test 2: Updating Error Check**  
     - For the quantity with highest MAD:  
       - Chair selects the "key surprise" evidence *from the package*.  
       - Each panelist estimates:  
         - Their prior 50th percentile (without this evidence).  
         - Their posterior 50th percentile (with this evidence).  
         - The *shift* (posterior − prior).  
     - Calculate the *mean absolute shift (MAS)* across panelists.  
     - *Decision rule*: If any panelist’s shift > 2×MAS, probe for errors (e.g., misread data).  
       - *Judgment call*: "Typical shift" is heuristic; use historical data if available.  
  8. **Test 3: Divergent Prior/Persistent Divergence Check**  
     - If Tests 1–2 fail:  
       - Each panelist states their "anchor" (prior 50th percentile) for a *benchmark project* (e.g., "typical refinery upgrade").  
       - Calculate MAD of anchors.  
     - *Decision rule*:  
       - If anchor MAD > historical anchor variation (or >10%), declare **divergent priors**.  
       - Else, declare **unresolved divergence** (cause unknown).  

  **Phase 3: Consensus & Reporting (Meeting End)**  
  9. **Output decision rules**:  
     - If Tests 1-2 resolved disagreement: Adopt revised median distribution.  
     - If divergent priors identified: Adopt *median distribution* but append: *"Consensus reflects median judgment; unresolved prior divergence on [quantity]."*  
     - If unresolved divergence: Adopt *median distribution* but append: *"Consensus reflects median judgment; unexplained divergence on [quantity] (MAD = X%)."*  
  10. **Documentation**: Record root causes per checklist below.  

  ---

  ### **Checklist of Disagreement Causes**  
  1. **Private evidence**: Information not pooled (e.g., proprietary data, unshared experience).  
  2. **Updating error**: Misweighting evidence (e.g., neglecting base rates, calculation mistakes).  
  3. **Divergent prior**: Fundamental differences in starting beliefs (e.g., optimism vs. pessimism on new tech).  
  4. **Divergent evidence interpretation**: Same evidence, different meanings (e.g., "vendor delay" seen as 1-week vs. 1-month).  
     - *Treated as a symptom* of (1), (2), or (3) in this procedure.  
  5. **Unresolved**: No clear cause identified after Tests 1–3.  

  ---

  ### **Concrete Applications**  
  **Case 1: Disagreement from Unpooled Information**  
  - *Context*: Cost overrun estimates range from 5% to 25%. Panelist A cites a vendor’s confidential bankruptcy risk (not in evidence).  
  - *Procedure*:  
    - Test 1 flags private evidence.  
    - Evidence pooling: Panelist A shares vendor data.  
    - Revised estimates converge (10–15%).  
  - *Outcome*: Median adopted. Report notes "resolved via pooling vendor risk data."  

  **Case 2: Disagreement from Divergent Priors (Unpleasant Result)**  
  - *Context*: Safety incident estimates: 0.1 (optimist) vs. 5.0 (pessimist) per 100k hours.  
  - *Procedure*:  
    - Tests 1–2 negative (no private evidence/updating errors).  
    - Test 3: Anchors for benchmark project vary from 0.2 to 4.0 (MAD = 150% > 10%).  
  - *Outcome*: Declare **divergent priors**. Median (1.0) adopted but annotated: *"Unresolved prior divergence on safety culture."*  
    - *Why unpleasant*: Board may question panel’s foundational alignment.  

  **Case 3: Unresolved Divergence**  
  - *Context*: Schedule slip estimates: 3–12 months. Tests 1–2 negative.  
  - *Procedure*:  
    - Test 3: Anchors for benchmark project agree (MAD = 5%).  
    - Rationale review reveals contradictory interpretations of "client responsiveness."  
  - *Outcome*: Declare **unresolved divergence**. Median (6 months) adopted with note: *"Unexplained divergence (MAD=45%); possible unmodeled interaction effects."*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Prove a common prior exists**—it can only:  
     - Fail to find evidence of divergence (if Tests 1–3 pass).  
     - Detect evidence *against* a common prior (e.g., divergent anchors in Test 3).  
     Human panels can never *establish* a true common prior; they can only achieve *pragmatic alignment* via evidence and discussion.  
  2. **Eliminate all disagreement**—legitimate expert divergence may persist.  
  3. **Diagnose cognitive biases** (e.g., overconfidence) beyond updating errors.  
  4. **Replace full Bayesian elicitation**—it approximates it via percentile shifts and anchors.  

  ---

  ### **Practical Implementation Notes**  
  - **Time budget**: Phase 0 (3 days), Meeting (2–4 hours).  
  - **Training**: Brief panelists on "anchors" and "shifts" using examples (no decision theory needed).  
  - **Defensibility**: Focus on documentation. If numbers prove wrong, highlight process rigor (e.g., "divergent priors were flagged").  
  - **Evolving priors**: Use benchmark project anchors quarterly to track prior drift.  

  This procedure transforms disagreement from a threat into a diagnostic tool, balancing efficiency with auditability. It meets your goal of replacing unstructured debates with a repeatable, evidence-driven process rooted in the common prior assumption—while transparently flagging its limitations.
