prompt: |-
  I sit on the small-grants committee for my university's center for experimental philosophy, and we're split down the middle on a proposal I need to write the decision memo for. A grad student is asking for $12,000 to run what she calls a field test of superrational reasoning, inspired by the lottery games Hofstadter ran in his old Scientific American column. Her design: an online lottery, open to the general public, advertised through puzzle and rationality forums. Entry costs $2, one entry per person. After entries close, one entrant is drawn at random and wins a prize equal to $50,000 divided by the total number of entries. So if fifty people enter, the winner gets $1,000. If fifty thousand enter, the winner gets a dollar. The grant money is there to cover the payout if entry numbers stay low, since the center loses money whenever fewer than about 160 people enter and profits after that.

  Her pitch is explicitly philosophical. She says the player base she's recruiting is about as close as you can get to the ideal case for the symmetry argument: people who all know the rules, know that everyone else knows them, and know that everyone is facing the identical decision. If the "we're all in the same epistemic situation, so we should all land on the same choice" style of reasoning (she calls it superrationality, she mentions the Platonia dilemma by name) has any real pull, entries should stay low, either because everyone abstains or because everyone does the mixed-strategy thing where you enter only with some small probability so the expected crowd stays tiny and the prize stays huge. If it has no pull, the lure wins, entries flood in, and the prize collapses to nothing. Either way, she says, we learn whether that family of arguments describes anything real about how reflective people actually choose, as opposed to being a just-so story philosophers tell each other.

  The objections flying around the committee: (1) this is a re-run of a stunt from the 80s dressed up as research; (2) no possible outcome discriminates between her hypotheses -- if few people enter, that could be superrational restraint, ordinary expected-value math, or nobody seeing the ad, and if many enter, a superrationalist can just say the crowd wasn't really like-minded; (3) the economics only work in the center's favor if participants reason badly, so we're effectively running a fundraiser that profits from confusion, and several members think that fails some basic duty to participants even though it's legal and the entry fee is two bucks; (4) her plan to post the running entry total on the site "for transparency" seems to half of us like it destroys the very coordination problem she's studying, and to the other half like the only thing making the study fair.

  Draft the committee's memo: fund, don't fund, or fund with conditions. Give a clear bottom line up front, then the reasoning. The memo has to actually engage with the symmetry argument she's testing rather than just gesturing at it -- including whether any result would count against it, and what design changes (pre-registration, a control arm, different disclosure) would make the experiment answer a real question. Give the strongest version of whichever side loses, because this memo is going to be quoted back at us either way. And take an actual position on the transparency fight, since I suspect that's where the whole thing turns.
reasoning: |-
  Okay, I need to draft this decision memo for the small-grants committee. The grad student's proposal is about testing superrationality through an online lottery. The committee is split, so I have to address all the concerns and make a clear recommendation.

  First, let's understand the core of her proposal. She wants to run a lottery where entry costs $2, and the prize is $50,000 divided by the number of entries. The idea is that if people coordinate (either all abstain or enter with low probability), the prize stays high. But if many enter, the prize becomes negligible. She's targeting puzzle and rationality forums to get participants who understand the symmetry argument.

  The committee has four main objections:
  1. It's just rehashing a 1980s stunt.
  2. The results won't clearly prove or disprove superrationality.
  3. The center profits only if participants act irrationally, which might be unethical.
  4. Posting the running entry total could ruin the experiment or be necessary for fairness.

  I need to engage deeply with the symmetry argument. Superrationality suggests that since everyone is identical and knows it, they should all choose the same action. But if everyone abstains, no one gets anything. If everyone enters, the prize is tiny. The mixed strategy could balance it. But will real people behave this way? The student wants to see if this reasoning actually influences decisions.

  For the memo, I should start with a clear bottom line. Given the objections, especially about ambiguity in results and ethics, funding with conditions might be the best approach. Requiring pre-registration and changing how the entry total is handled could strengthen the study.

  Transparency is a big sticking point. If they post real-time entries, participants might adjust their behavior, which could either help coordination or distort it. Maybe a compromise: don't show totals until after, or show delayed/aggregated data. That way, the coordination problem isn't destroyed, but there's still some transparency.

  On the ethics point, since the entry fee is low and it's legal, it might be acceptable. But the center profiting from confusion is a concern. The student should emphasize that participants understand the structure, perhaps through a quiz.

  Pre-registration would help by defining hypotheses in advance. A control arm isn't feasible, but varying information disclosure (like showing totals to some groups but not others) could provide useful comparisons.

  I think funding with conditions is the way to go. It allows the research to proceed but addresses the major flaws. The symmetry argument's real-world applicability is worth testing, even if it's been done before. Modern online platforms could yield new insights.
answer: |-
  ## Memorandum: Decision on Graduate Research Proposal #X-2024  
  **To:** Small-Grants Committee, Center for Experimental Philosophy  
  **From:** [Your Name/Committee Chair]  
  **Date:** October 26, 2023  
  **Subject:** Funding Recommendation for "Field Test of Superrational Reasoning in a Public Lottery"  

  **Bottom Line:** **Fund with Conditions** ($12,000 awarded). Funding is contingent on: (1) Pre-registration of hypotheses and analysis plan; (2) Removal of real-time entry total display; (3) Implementation of a post-experiment comprehension quiz and debriefing protocol.  

  ### Reasoning  
  The committee acknowledges the proposal’s ambition to empirically test the behavioral traction of *superrationality*—a symmetry-based reasoning framework claiming that rational agents in identical epistemic positions should converge on identical choices without explicit communication. While the core design echoes Hofstadter’s historical lotteries, the modern context (online recruitment, targeted forums) offers novel potential to probe whether this idealized reasoning influences real-world decisions. However, significant methodological and ethical concerns necessitate modifications to ensure the study yields interpretable results and meets our ethical standards.  

  #### Engagement with the Symmetry Argument & Testability  
  The proposal targets a genuine philosophical question: **Does shared knowledge of symmetry lead to coordinated outcomes *in practice*?** Superrationality (as defined in Hofstadter’s "Platonia Dilemma") posits that agents who recognize their mutual rationality and epistemic symmetry will avoid the "tragedy of the commons" outcome (mass entry → negligible prize) by coordinating on abstention or a low-probability mixed strategy.  

  *   **Strengths:** Recruiting from puzzle/rationality forums plausibly creates a cohort with high mutual awareness of the rules and reasoning, approximating the "ideal epistemic community" required. This addresses a gap in historical anecdotes.  
  *   **Critical Weakness (Objection #2):** **The design cannot conclusively discriminate between superrationality and alternatives.**  
      *   *Low-entry outcome* could stem from: (a) Successful superrational coordination; (b) Individual expected-value calculation (if individuals pessimistically assume high entry, $EV = ($50k / N) / N - $2 ≈ negative); (c) Low visibility/participation; (d) Misunderstanding.  
      *   *High-entry outcome* could stem from: (a) Superrationality’s irrelevance; (b) Participants believing others *won’t* coordinate, making entry rational (Keynesian Beauty Contest dynamics); (c) Overwhelming visibility; (d) Participants valuing participation over expected profit.  
      *   **Superrationality’s "Escape Hatch":** As noted, proponents can dismiss high-entry results by arguing the forum population wasn’t *truly* like-minded, rendering the test unfalsifiable in its current form.  

  **Addressing Testability via Design Changes:**  
  *   **Pre-registration (Condition #1):** Mandatory. Must specify:  
      *   Quantitative thresholds defining "low" vs. "high" entry (e.g., based on expected-value break-even ~160 entries).  
      *   Predictions: What entry range does superrationality predict *for this specific recruited cohort*? (e.g., "≤X entries signifies coordination success").  
      *   Alternative hypotheses: How will results distinguish superrational coordination from individual pessimism? (e.g., via post-hoc surveys on reasoning).  
      *   This forces operationalization and reduces post-hoc reinterpretation.  
  *   **Control Arm Not Feasible:** A true "non-symmetric-knowledge" control is impossible with public online recruitment. Instead, **robust post-experiment surveying (Condition #3)** is critical. Participants must be surveyed on:  
      *   Their reasoning (Did they try to coordinate? Assume others would? Calculate pure EV?).  
      *   Awareness of the symmetry argument.  
      *   Perception of other participants’ reasoning.  
      *   This qualitative data is essential to interpret quantitative outcomes.  

  #### The Transparency Fight (Objection #4) & Our Position  
  **Decision: Real-time entry totals MUST NOT be displayed (Condition #2).**  

  *   **Why it Destroys the Coordination Problem:** Superrational coordination relies on *pre-commitment to a shared strategy without communication*. Displaying the running total:  
      *   Transforms the game into a dynamic coordination/volunteering dilemma, not the static simultaneous-move game superrationality addresses.  
      *   Allows participants to conditionally cooperate ("I’ll enter only if numbers stay low"), fundamentally altering the decision logic. This is *not* the Platonia Dilemma.  
      *   Introduces confounding dynamics (herding, momentum effects) irrelevant to the hypothesis.  
  *   **Addressing Fairness Concerns:**  
      *   Transparency can be achieved by publishing the *final* entry count and raw anonymized data *after* the lottery closes.  
      *   A clear FAQ can explain the *absence* of real-time data is necessary for the experimental question.  
      *   The $2 stake and public nature make "fairness through real-time disclosure" less compelling than preserving experimental integrity.  

  #### Addressing Other Objections  
  *   **Objection #1 (1980s Stunt):** While inspired by Hofstadter, the proposal’s scale, online methodology, targeted recruitment, and explicit focus on *testing the reasoning’s traction* distinguish it as empirical research. Replication/modern context is valuable.  
  *   **Objection #3 (Profiting from Confusion/Unethical):** This concern carries weight but is mitigated:  
      *   **Condition #3 (Comprehension & Debrief):** Implement a mandatory entry quiz ensuring participants understand the prize structure ($50k/N) and the break-even point (~160 entries). Only those passing can enter. Post-experiment, provide a full debrief explaining the study's purpose, the symmetry argument, and the actual outcomes/decisions.  
      *   **Cost/Benefit:** The $2 entry fee is minimal risk. The educational value (for participants and researchers) and the pursuit of knowledge about human rationality justify the design, *if* comprehension is ensured. The center profiting in high-entry scenarios arises from participants *choosing* to enter despite understanding the low expected value, which is itself a data point about reasoning under potential coordination failure.  

  #### The Strongest Case Against Funding  
  The strongest argument against funding is that **the core hypothesis (superrational coordination) is inherently shielded from falsification by its own assumptions.** A low-entry result can be claimed as success; a high-entry result can be dismissed as an "impure" subject pool. Without a clear, pre-registered criterion for what constitutes a "sufficiently like-minded" cohort *ex ante*, and robust mechanisms to *prove* coordination occurred beyond individual pessimism, the results risk being philosophically inconclusive regardless of the outcome. The $12,000 risk (if entries are very low) is substantial for a study whose core question may prove unanswerable.  

  ### Conclusion & Conditions  
  We recommend funding **because the question of whether idealized symmetry arguments influence real-world reasoning is philosophically significant and empirically underexplored.** The targeted recruitment offers the best available testbed. However, the conditions are essential to maximize interpretability and ethics:  

  1.  **Pre-registration:** Detailed hypotheses, thresholds, and analysis plan submitted before launch.  
  2.  **No Real-Time Entry Display:** Final totals published post-lottery only.  
  3.  **Enhanced Participant Safeguards:** Mandatory comprehension quiz for entry; comprehensive post-experiment survey on reasoning; transparent debriefing.  

  These modifications strengthen the design’s ability to address whether participants *attempted* superrational coordination and whether their *perception* of symmetry influenced choices, moving beyond ambiguous aggregate outcomes. The Principal Investigator must confirm acceptance of these conditions within one week for funding to be released.  

  **Approved:** [ ]  
  **Funds Released:** [ ]  
  *(Signature/Date Lines for Committee Chair)*
