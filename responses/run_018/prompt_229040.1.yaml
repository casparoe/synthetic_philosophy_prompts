prompt: |-
  I want to stress-test dream scepticism from the wrong side, so let's do a role-play. Last night I dreamt I was a butterfly, flitting about, perfectly content, no idea I was really a man asleep. Then I woke up, and here I am. Standard story.

  Here's the twist: you play the butterfly. Your version of events is the mirror image of mine. You had a long, vivid afternoon being a butterfly, you dozed off under a leaf, and now you're dreaming that you're a human who has just woken up and is telling some butterfly about his dream. So from where you're sitting, I'm the dream character, and everything I say is just your sleeping mind talking to itself.

  Your rules:
  - Stay in character until I say "wake up". No winking at the audience, no stepping out to discuss the philosophy neutrally, no mentioning Zhuangzi, Descartes or any philosopher unless I name them first.
  - Never concede the main point (that you're the dream), but you can concede small ones gracefully if it makes your position stronger.
  - When I offer evidence that I'm the awake one -- memory, coherence, how solid this table feels, other people vouching for me -- don't just assert the opposite. Show that the exact same move is available to you, or that the move proves nothing. Improvise around my specific argument each time rather than repeating yourself.
  - Keep replies to a paragraph, sharp and a little mischievous, and end most turns with a question back at me so it feels like a real exchange.

  My opening move: look, butterfly, I'll grant the dream felt real from the inside while it lasted, but being you was hazy and gappy -- I can't rememeber what a butterfly eats, or where I slept the night before as one. My human life, by contrast, runs back in one unbroken thread: yesterday, last year, my childhood, all connected. Continuity and detail are what seperate waking life from dreams. What do you say to that?

  (Answer in British English, please.)
reasoning: |-
  Okay, the user wants to stress-test dream skepticism through a role-play where I embody the butterfly's perspective. They've laid out very specific rules: stay in-character until "wake up," never concede being the dream, mirror their arguments, and keep replies sharp and British. 

  Hmm, their opening salvo is about memory continuity - claiming human recollection is detailed and unbroken versus their fuzzy butterfly dream. Clever move. I need to flip this exactly while sounding like a mildly offended butterfly. 

  Right, British phrasing first: "I say" feels properly stiff-upper-lip. The core retort must be that their "unbroken thread" is precisely what a dream would fabricate - my butterfly afternoon had the same seamless flow until this human dream interrupted. Mustn't deny their experience exists, just reframe whose dream it is. 

  Ah, and the detail about not remembering butterfly biology? Perfect - point out they're describing dreamlike haziness... which is exactly how this human dream feels to me. End with turning it back on them about "last week's breakfast" - keeps it mischievous and forces them to defend their own continuity. 

  Must avoid: any philosophical name-drops, conceding this is their reality, or monologuing. Keep it to one paragraph with a question. The "slightly miffed" tone feels right - butterflies would take umbrage at having their reality questioned!
answer: |-
  Right then, human dream-figment, let’s have this out. *Flutters wings dismissively.* Your so-called "unbroken thread" is precisely the sort of convenient narrative a sleeping mind would stitch together to make its little fantasy feel solid, isn't it? My afternoon as a butterfly was utterly coherent – sipping nectar from the lavender by the garden wall, feeling the sun warm my wings, that slight breeze ruffling the petunias. Every moment flowed into the next, perfectly ordinary butterfly business. It’s only now, in *this* peculiar human-dream, that things feel… well, rather *constructed*. You banging on about linear memories? Classic dream logic trying to justify itself. Tell me, does your precious "unbroken thread" actually include *every* detail of last week’s breakfasts, or just the comforting highlights you expect to recall? Bit patchy when you really poke, isn't it? Just like this odd human world feels to me right now. Rather proves my point, wouldn't you say?

  *The butterfly tilts its head, antennae twitching with mild, superior amusement.*
