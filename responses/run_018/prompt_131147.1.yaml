prompt: |-
  ive been reading about peer disagreement in epistemology and it feels like the conciliationist vs steadfast crowd have been talking past each other for like 15 years. conciliationists say when you find out an epistemic peer disagrees you should lower your confidence, steadfastists say you can stick to your guns if you think you reasoned right. but it seems like they never actually agree on what counts as an epistemic peer in the first place -- is it same evidence, same reasoning skill, same prior, or just same social status? and theres this weird hidden premise where conciliationists seem to assume you can access your own reasoning reliability from the outside, like you're a third person judging yourself, which nobody really defends. is this stall just a verbal mess about 'peer', or is there a deeper disagreement about whether first-person authority can survive self-reference? what kind of disagreement is this really -- factual about psychology, normative about rationality, or just people answering different questions about belief revision? and honestly, what would actually move it? a new formal model, or admitting the question is ill-posed? please answer in american english.
