  Let me unpack the guest's position first. Her rejection of the tripartite framing hinges on seeing history as non-replicable and non-isolatable—more like entangled systems than controlled experiments. The quantum analogy is crucial here but risks misinterpretation as physical determinism. 

  For the settler-mortality question, I recall this refers to instruments like Acemoglu/Johnson/Robinson's use of colonial settler deaths as an IV for institutional quality. The guest likely objects to treating geography as an "excludable" instrument when it's constitutively entangled with institutions. 

  On normative stakes: abandoning counterfactual dependence might seem to undermine responsibility assignments (e.g., blaming extractive institutions). The guest's coherence framework needs to recover normative traction—possibly through distributed agency concepts.

  I'll structure the questions to:
  1. Start with her core critique of the tripartite model
  2. Probe the quantum analogy with safeguards against determinism
