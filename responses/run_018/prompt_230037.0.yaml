answer: |-
  Below is a systematic presentation of desiderata for evaluating Lexical Threshold Negative Utilitarianism (LTNU) and its competitors. LTNU asserts that once suffering exceeds a fixed intensity threshold, no quantity of milder pleasure *or* relief from sub-threshold suffering can outweigh or compensate a single instance of threshold-crossing suffering. The desiderata are derived from conceptual dilemmas, empirical constraints, and logical coherence requirements.  

  ### **Desiderata for an Axiology of Severe Suffering**  
  | **Requirement**                     | **Forcing Case/Dilemma**                                                                                                | **Negotiable?**   | **Conflicts With**               |  
  |-------------------------------------|-------------------------------------------------------------------------------------------------------------------------|-------------------|----------------------------------|  
  | **1. Lexical Priority**             | *Case*: A single episode of torture (threshold-crossing) vs. any number of mild headaches (sub-threshold) relieved or pleasures granted. *Dilemma*: LTNU must hold the torture lexically dominates. | Non-negotiable | —                                |  
  | **2. Threshold Non-Arbitrariness**  | *Case*: Gradations of pain (e.g., childbirth pain vs. nerve damage). *Dilemma*: Locating the threshold must avoid vagueness or culturally relative definitions. Must be grounded in neuroscience or objective phenomenology. | Non-negotiable | Empirical Viability (if measurement is impossible) |  
  | **3. Anti-Aggregation for Sub-Threshold Harms** | *Case*: One threshold pain (e.g., severe burn) vs. a billion sub-threshold pains (e.g., paper cuts). *Dilemma*: LTNU must reject aggregating sub-threshold pains to outweigh the single severe instance. | Non-negotiable | —                                |  
  | **4. Duration Insensitivity**       | *Case*: A brief threshold pain (e.g., 1 second of agony) vs. chronic sub-threshold suffering (e.g., decades of mild depression). *Dilemma*: Duration of threshold suffering cannot be traded off against duration or intensity of lesser states. | Non-negotiable | —                                |  
  | **5. Pleasure-Pain Incommensurability** | *Case*: Preventing one threshold pain (e.g., terminal cancer agony) vs. creating vast sub-threshold pleasures (e.g., a billion gourmet meals). *Dilemma*: Pleasures cannot instrumentally offset threshold suffering; welfare cannot be a single scale. | Non-negotiable | Classical utilitarianism’s core |  
  | **6. Distinction from Prohibition** | *Case*: Letting a threshold pain occur naturally vs. inflicting it to prevent greater sub-threshold suffering. *Dilemma*: LTNU must not conflate the *axiological badness* of threshold suffering with a *deontic prohibition* on causing it (e.g., allowing vs. doing). | Negotiable       | Rights-based views               |  
  | **7. Intra-Life Consistency**       | *Case*: Within one life, enduring threshold pain to avert future sub-threshold pains (e.g., painful lifesaving surgery). *Dilemma*: LTNU must treat aggregation *within lives* the same as *across lives*—no special weight for personal identity. | Non-negotiable | Common-sense prudence           |  
  | **8. Empirical Viability**          | *Case*: Pain adaptation (e.g., chronic sufferers reporting lower intensity) or measurement issues (e.g., pain scales’ subjectivity). *Dilemma*: Threshold must be definable despite neural plasticity or intersubjective variation. | Negotiable       | Threshold Non-Arbitrariness      |  

  **Key Tensions**:  
  - **Threshold Non-Arbitrariness vs. Empirical Viability**: If pain is unmeasurable/adaptive, a non-arbitrary threshold may be empirically unsupported.  
  - **Pleasure-Pain Incommensurability vs. Classical Utilitarianism**: Rejecting a unified welfare scale directly opposes hedonistic aggregation.  
  - **Intra-Life Consistency vs. Prudential Reasoning**: Denying trade-offs within lives (e.g., surgery) conflicts with rational self-sacrifice.  

  ### **Evaluation of Competing Views**  
  - **Classical Hedonistic Utilitarianism** (CHU): Maximises net pleasure. *Fails*: Lexical Priority (allows pleasure to compensate), Anti-Aggregation (aggregates all pains/pleasures), Pleasure-Pain Commensurability (assumes one scale).  
  - **Plain Negative Utilitarianism** (NU): Minimises suffering, ignores pleasure. *Fails*: Anti-Aggregation (aggregates *all* suffering, so a billion paper cuts outweigh one torture), Duration Insensitivity (allows duration trade-offs).  
  - **Prioritarianism**: Weighted priority to the worst-off. *Fails*: Lexical Priority (gives extra weight but permits aggregation), Anti-Aggregation (sub-threshold pains can outweigh if sufficiently numerous).  
  - **Rights-Based Anti-Torture**: Forbids inflicting threshold suffering as a constraint. *Fails*: Distinction from Prohibition (conflates badness with prohibition), Intra-Life Consistency (may allow trade-offs within lives), and Empirical Viability (rights often ignore measurable thresholds).  

  ### **Most Exclusionary Requirement**  
  **Anti-Aggregation for Sub-Threshold Harms** excludes the most candidates:  
  - CHU, NU, and Prioritarianism all permit sub-threshold harms to aggregate and outweigh severe suffering.  
  - Only LTNU and rigid deontological views (e.g., absolute torture bans) satisfy this, but the latter fail axiological desiderata like Intra-Life Consistency.  

  \answer{Anti-Aggregation}
