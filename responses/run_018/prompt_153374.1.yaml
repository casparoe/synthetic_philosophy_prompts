  **The Joke:**  

  A decision theorist named Alice noticed her friend Bob shredding an unopened envelope.  

  “Is that your genetic test result?” she asked.  
  Bob nodded. “Yep. Don’t want to know.”  
  Alice gasped. “But Good’s theorem! A rational agent *always* benefits from new information in expectation. What if it saves you from a preventable illness?”  
  Bob shrugged. “What if it forces me into years of expensive, grueling treatments? Right now, I’m fine. If I open that envelope, I might have to *act*. Ignorance isn’t just bliss—it’s a strategic exit from decision debt.”  
  Alice frowned. “But the theorem proves you can’t lose in expectation.”  
  Bob handed her the shreds. “Tell that to my utility function. It assigned ‘costly obligation’ a weight even Good couldn’t non-negative away.”  

  **Punchline Rationale:**  
  - Contrasts Good’s theorem (information has non-negative *expected* value) with human aversion to triggering costly actions.  
  - Highlights Bob’s fear that knowledge will obligate him to a painful decision, overriding the theorem’s abstract guarantee.  
  - Uses "decision debt" and "weight even Good couldn’t non-negative away" to underscore the tension between formal rationality and emotional/practical avoidance.
