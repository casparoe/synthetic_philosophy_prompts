   The joke should contrast the theorem's claim with the human behavior of avoiding information (like avoiding a medical test because if it's positive, you have to undergo treatment).

   The punchline should highlight the tension: the theorem says information is always beneficial in expectation, but humans avoid it because they worry about the potential obligation to act on bad news, which might be costly or unpleasant.

