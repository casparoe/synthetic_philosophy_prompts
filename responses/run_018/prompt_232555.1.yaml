answer: |-
  Here’s a disciplined epistemological analysis of the *Brancusi v. United States* case (1928) through the lens of aesthetic testimony:

  ---

  ### **(1) Optimist View: Justified Reliance on Testimony**  
  An optimist (e.g., McShane, Hopkins) would argue:  
  - **Legitimate Epistemic Function**: The court acted as a rational consumer of expert testimony. By weighing conflicting claims from artists/critics (e.g., Jacob Epstein for Brancusi; conservators against), it aggregated specialized knowledge inaccessible to laypersons.  
  - **Justification**: The testimony provided *non-aesthetic evidence* for art-status:  
    - Historical context (Brancusi’s role in modernism).  
    - Institutional recognition (exhibitions at major galleries).  
    - Artistic intent (testimony on abstraction as expressive).  
  - **Outcome**: The ruling reflected *propositional knowledge* ("This is art") grounded in reliable communal practices. Optimists would deem this justified, as courts routinely rely on expert testimony (e.g., forensic science) for specialized judgments.  

  ---

  ### **(2) Pessimist View: Limits of Testimony**  
  A pessimist (e.g., Robson, Scruton) would contend:  
  - **Illegitimate Delegation**: The court could *not* form genuine aesthetic judgment. Testimony cannot convey:  
    - The *sensory immediacy* of the sculpture’s form, sheen, or balance.  
    - The *experiential quality* of encountering its abstraction (e.g., "birdness in motion").  
  - **Legitimate Actions**: The court could only:  
    - Establish *institutional facts* (e.g., "The artworld classifies this as art").  
    - Rule on legal categorization (duty exemption), *not* on aesthetic value.  
  - **Critique**: Deferring to experts conflates *social authority* with aesthetic insight. The dissent’s focus on "unnatural proportions" revealed a layperson’s inability to "see as art" without firsthand acquaintance.  

  ---

  ### **(3) Sensory vs. Institutional Testimony in Trial**  
  The distinction surfaces in witness claims:  
  - **Sensory Testimony**:  
    - *Pro-Brancusi*: "Its polished surface evokes flight" (descriptive phenomenology).  
    - *Against*: "No wings/beak = not a bird" (literal visual assessment).  
  - **Institutional Testimony**:  
    - *Pro-Brancusi*: "It extends Rodin’s legacy" (art-historical placement).  
    - *Against*: "It lacks craftsmanship of traditional sculpture" (normative tradition).  
  - **Court’s Focus**: The ruling emphasized institutional testimony (Brancusi’s reputation, museum validation), sidelining sensory disputes. This allowed a verdict without resolving perceptual disagreements.  

  ---

  ### **(4) Limits of Aesthetic Testimony & Social Authority**  
  The case reveals:  
  - **Transmission of Institutional Knowledge**: Testimony *did* convey art-status (an institutional fact), supporting optimists on *categorical* judgments.  
  - **Failure of Aesthetic Knowledge**: No testimony could transmit *why* the sculpture is beautiful/profound—only that it is *accepted* as art. The court’s judgment rested on:  
    - Deference to artworld authority (e.g., curator Marcel Duchamp’s influence).  
    - Legal pragmatism (need for clear classification).  
  - **Pessimist Victory**: The ruling confirms that testimony cannot bridge the "acquaintance gap" for aesthetic properties. It reduced art-status to social consensus, not experiential insight.  

  ---

  ### **Breakdown of the Legal-Aesthetic Analogy & Epistemological Status**  
  - **Analogy Breakdown**:  
    - *Legal Task*: Binary classification (art/non-art) for tariff purposes.  
    - *Ordinary Aesthetic Judgment*: Subjective, experiential, and open-ended (e.g., "How does this move me?").  
    - The court sought *extrinsic* status (is this duty-exempt?) rather than *intrinsic* aesthetic merit.  
  - **Epistemological Status**: The case is a **confirming anomaly** for standard views:  
    - *For optimists*: Confirms testimony can settle institutional art-status.  
    - *For pessimists*: Exposes testimony’s inability to convey aesthetic experience.  
    - *Outside Scope*? It navigates *meta-aesthetics* (what counts as art) more than first-order aesthetic properties (beauty, sublimity), fitting uneasily in both frameworks.  

  ---

  ### **Conclusion**  
  *Brancusi v. United States* illustrates how aesthetic testimony transmits *institutional* but not *experiential* knowledge. The court’s ruling was epistemically justified for its legal purpose (classifying art-status socially), but not as a model for genuine aesthetic judgment. It underscores pessimism’s core claim: testimony cannot substitute for the "seeing" that defines aesthetic encounter. The case remains a landmark precisely because it exposes art’s dual nature—as both cultural institution and irreducibly personal experience.
