  First, I need to unpack the two main sides. The materialist position, like Marxist interpretations, sees the Protestant Ethic as just a reflection of existing bourgeois interests. They argue that material conditions shape ideology, so culture is superstructure. The culturalists, following Weber, argue that values like asceticism and predestination actually motivated behavioral changes, leading to capitalism. 

  The user thinks the core issue might be differing definitions of causation. Materialists look for statistical covariance—like showing Protestant regions developed faster. Culturalists focus on micro-motivations: how beliefs change individual actions, altering payoff structures for things like thrift. 

  I should check if there's an empirical dispute too. The user mentions counterfactuals: could capitalism have emerged without Protestantism, say in Jain communities? That's a key point—both sides might be using different evidence types. Materialists point to similar economic developments elsewhere, while culturalists highlight unique motivational aspects in Protestant areas.

  The user also asks about bedrock intuitions. Is there a fundamental belief that ideas can't move matter? Some materialists might hold that, but others could be methodological, insisting on material evidence. The question itself might be ill-posed if causation is multi-directional. 

  For progress, the user suggests formal models or new archival work. A formal model could simulate how beliefs affect economic choices. Comparative studies, like Jain merchants vs. Protestants, could test counterfactuals. Or maybe a conceptual split between necessary and sufficient conditions clarifies things—Protestantism as a catalyst but not the sole cause.

  I'm confident in diagnosing the causation mismatch. The materialist vs. culturalist divide is well-documented. The counterfactual point is strong too. But I'm less sure about the bedrock intuition part. Not all materialists dismiss ideas; some just prioritize material factors methodologically. 

