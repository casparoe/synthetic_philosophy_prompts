  ## Sestina for the Statue and the Lump

  The sculptor kneads the yielding **clay**,  
  A promise held in patient hands,  
  Then coaxes forth a braided **statue**,  
  Cold and poised in perfect **form**.  
  Does the humble substance **survive**  
  This birth? Or does creation **destroy**?  

  If struck, would force merely **destroy**  
  The shape, leaving the scattered **clay**  
  To persist? Would the matter **survive**  
  Unharmed, though the crafted **statue**  
  Falls? Is the essence still the **same**  
  Beneath the lost, defining **form**?  

  The artist’s vision gave it **form**—  
  A brittle grace. To **destroy**  
  Is just to rearrange the **same**  
  Eternal, patient grains of **clay**.  
  Yet something seems lost with the **statue**:  
  Can *what it was* truly **survive**?  

  If identity can **survive**  
  Each shift, why mourn a broken **form**?  
  Is grief misplaced for the **statue**,  
  Since change doesn’t wholly **destroy**?  
  The fragments breathe: "We’re still **clay**!"  
  But the whole whispers, "Not the **same**..."  

  What perishes? What stays the **same**?  
  Can meaning, purpose, ever **survive**  
  The hammer’s kiss on the **clay**?  
  Is value bound to the **form**,  
  Or ground to dust when we **destroy**?  
  What dies within the shattered **statue**?  

  Consider now the fractured **statue**:  
  Its parts, the heap—are they the **same**?  
  To melt it down is to **destroy**  
  One thing... but does the bronze **survive**?  
  The atoms keep no crafted **form**;  
  They’re only ever restless **clay**.  

  Cold **statue**, should your shards **survive**,  
  Does **form** define what’s real? Or **same**  
  Lump, if reshaped, did **destroy**—or free the **clay**?
