answer: |-
  The institutional architecture of death determination for organ donation reveals a complex interplay of biological observation, pragmatic necessity, and normative commitments. To reconstruct its implicit theory, we must distinguish settled legal/clinical practices from contested philosophical interpretations.

  ### Settled Institutional Framework
  1.  **Brain Death (BD) Pathway:** Legally requires *irreversible cessation of all functions of the entire brain, including the brainstem* (UDDA standard). Clinically confirmed by absent brainstem reflexes and apnea despite normothermia, normotension, and exclusion of confounders.
  2.  **Donation after Circulatory Death (DCD) Pathway:** Legally requires *irreversible cessation of circulatory and respiratory functions*. "Irreversible" is operationalized as a short interval (2-5 minutes) post-arrest deemed sufficient to preclude autoresuscitation, followed by a mandatory waiting period before organ recovery.
  3.  **Legal Equivalence:** Both pathways satisfy the UDDA's definition of death ("irreversible cessation of circulatory and respiratory functions OR all functions of the entire brain") and terminate treatment obligations while authorizing organ procurement.

  ### Strict Presuppositions (Non-Negotiable Commitments)
  1.  **Death as a Binary, Legal Status:** Both pathways strictly presuppose that death is a singular, non-gradable legal event triggering specific institutional consequences (cessation of treatment rights, authorization of organ removal). This status *must* be declared *before* vital organ procurement.
  2.  **Irreversibility as a Practical Threshold:** Both pathways presuppose that "irreversible" is defined procedurally within the clinical context, not metaphysically. For BD, irreversibility is determined by the *diagnosis itself* (fulfilling protocol = irreversibility). For DCD, irreversibility is determined by the *decision not to resuscitate* + the short interval precluding autoresuscitation.
  3.  **Normative Function Superseding Biological Continuity:** The system presupposes that once the legal criteria for death are met, *any* remaining biological integration (e.g., circulation in BD, potential for cellular/tissue viability in DCD) is irrelevant to the legal and moral status of the body. The body is a *corpse* with salvageable parts.
  4.  **Distinct Pathways Require Distinct Criteria:** The coexistence of BD and DCD strictly presupposes that the *means* of arriving at death (brain destruction vs. circulatory arrest) are sufficiently different to warrant separate protocols, yet the *outcome* (legal death) is identical.

  ### Implicit Theories Rationalizing Coexistence
  The best reconstruction is **not** a unified biological theory, but a **Pragmatic Institutionalist Theory of Death as a Normative Status Marker**:
  1.  **Core Function:** Death declaration serves primarily as a *permission-granting mechanism* – it marks the point where life-sustaining treatment *must* cease (BD) or *has* ceased (DCD) and organ procurement *may* begin. Its primary role is administrative and normative.
  2.  **Pathway-Specific Rationalizations:**
      *   **BD Pathway:** Implicitly relies on a **Modified Whole-Brain Criterion**. It presupposes that the *clinically assessable functions* of the entire brain (brainstem reflexes, consciousness, respiration) are *proxies* for the loss of the organism as an *integrating whole*. Crucially, it treats the *loss of these specific functions* as *sufficient evidence* that somatic integration has irreversibly collapsed *as a unified whole*, even if isolated subsystems (e.g., some hypothalamic function) persist temporarily. The persistence of circulation via ventilator is seen as artificial support of subsystems, not evidence of integrated life.
      *   **DCD Pathway:** Implicitly relies on a **Circulatory-Respiration Criterion**. It presupposes that the cessation of heartbeat and breathing, once deemed irreversible *in the context of planned non-resuscitation*, signifies the definitive loss of the organism's *vital spark* and its capacity for self-sustained integration. The 2-5 minute interval is a pragmatic safeguard against false positives (autoresuscitation), not a marker of the precise biological moment of "death of the organism."

  ### Tensions & Contested Philosophical Issues
  1.  **Hypothalamic Function & Somatic Integration:** The persistence of neuroendocrine regulation (e.g., temperature, fluid balance, stress response) in some BD cases **does fundamentally challenge the strict biological interpretation** of the "irreversible cessation of *all* functions of the *entire* brain" and the claim that *all* somatic integration is lost. Proponents argue these are isolated functions not requiring *integrated* brain control. Critics argue this demonstrates somatic integration persists, meaning the BD body is not a corpse but a severely disabled living organism. The institutional response presupposes that these residual functions are *irrelevant* to the legal definition once the core clinical criteria are met.
  2.  **The "Dual Ontology" Charge:** Does the divergence reveal incoherence? Pragmatically, the system functions on a **unified normative ontology** (death as a legal status defined by either criterion) while potentially resting on **divergent biological rationales** (loss of brain-mediated integration vs. loss of circulation as the fundamental vital sign). The coexistence is possible precisely *because* the primary commitment is to the normative/administrative function, allowing different biological justifications to be used instrumentally for different pathways. It doesn't *require* a single biological theory to be coherent administratively.
  3.  **Can a Consistent Biological Account License Both?** A purely biological account centered on **"irreversible loss of the organism's capacity for somatic integration as a whole"** faces difficulty:
      *   BD proponents argue this capacity is brain-dependent and lost with whole-brain failure.
      *   DCD proponents argue this capacity is lost rapidly after circulatory arrest, making the 2-5 min wait a reasonable safety margin.
      *   However, **residual integration in BD** undermines the claim that the capacity is *entirely* lost at declaration. Conversely, **cellular/tissue viability after DCD death declaration** shows integration persists at lower levels. A strict biological view might demand a longer wait for DCD (until cellular death) or reject BD as death while circulation persists – positions incompatible with organ donation logistics.
  4.  **Irreducibly Normative?** The divergence strongly suggests the institutional concept of death **is irreducibly normative**. The criteria are chosen not because they pinpoint an exact, uncontested biological moment (they demonstrably do not), but because they:
      *   Provide clear, operationalizable clinical markers.
      *   Align with public understanding of death (unconsciousness, no breathing).
      *   Facilitate timely organ procurement while maintaining ethical and legal safeguards.
      *   Resolve ambiguities about treatment cessation in a way society accepts.

  ### Genuinely Contested Views (No Consensus)
  *   **Status of the BD Body:** Is it a living human organism with catastrophic neurological injury (biological view), or a dead body (legal/institutional view)? Does it retain intrinsic moral status, or only derivative status (e.g., respect for remains, family wishes)?
  *   **Validity of the Whole-Brain Criterion:** Does the persistence of hypothalamic function invalidate the biological claim? Or is it a permissible exception reflecting the criterion's focus on *critical* integration?
  *   **The "True" Ontology of Death:** Is death fundamentally the loss of the organism as an integrating whole (organismic view), the irreversible loss of consciousness/personhood (higher-brain view), or the irreversible cessation of circulation? The institutional framework *accommodates* the organismic view (as rationale) but doesn't *strictly require* it, as its functionality rests on normative pragmatism.
  *   **Moral Permissibility of Organ Procurement:** Does valid authorization *require* the donor to be biologically dead, or are other justifications possible (e.g., imminent, irreversible death)? The current system presupposes the former is necessary.

  **Conclusion:** The dual architecture strictly presupposes that death is a unitary, binary legal status defined by one of two operational criteria (whole-brain function cessation or circulatory-respiratory cessation), serving primarily as a normative threshold for ending treatment and permitting donation. Its coexistence is best rationalized by a **Pragmatic Institutionalist Theory**, where the criteria function as instrumentally valuable, socially accepted markers for an administrative/legal transition. While it leans on biological rationales (modified whole-brain for BD, circulatory for DCD), the persistence of biological functions challenging these rationales (hypothalamic activity, autoresuscitation windows) demonstrates that the system's coherence and functionality depend critically on its **normative, administrative labor**, allowing it to function despite unresolved biological and ontological controversies. It is a system designed to *work* within ethical and societal constraints, not to perfectly mirror a singular biological reality.
