prompt: |-
  I've been stressing about a job offer at this climate-tech startup where my equity is basically a St. Petersberg-style bet — tiny chance of an unbounded payoff if the tech scales globally, near-certain near-zero otherwise. Talking it over with my roommate made me realize I don't actually know what I'd want from a theory that tells me whether to take that kind of risk, beyond just "don't pay infinite money for it." So I'm trying to get clear on the desiderata.

  Write the desiderata for an adequate theory of rational choice that can handle St. Petersburg-type situations without sweeping them under the rug. For each requirement, give the case or consideration behind it: which puzzles it must dissolve (the original coin-flip game, but also real-world analouges like funding moonshot science or intergenerational climate bets where the upside is literally unbounded), which distinctions it must respect (say, between being risk-averse and being rationally bounded, or between descriptive failure and normative failure), and which results it must stay consistent with (like not violating dominance in ordinary finite cases). Flag any two desiderata that look jointly unsatisfiable — I have a hunch that demanding full fidelity to standard expectation calculus while also demanding we reject infinite-valuation recommendations is one tension, but I want your view on whether that's real or just apparent. Keep the weight on the criteria and their motivating cases rather than on a survey of named theories.

  Then briefly score how the usual suspects do — bounding utility, risk-weighting, maybe a less conventional approach like dropping expectation maximization for a satisficing rule in unbounded domains — against your list. Don't give me citations or a reading list; I'm writing this on my phone on a train with no journal access. And please don't drop verbatim quotes from texts — paraphrase anything specific. There's probably a typo or two in this message, but you get the idea.
reasoning: |-
  Okay, the user is grappling with a job offer at a climate-tech startup. The equity is like a St. Petersburg bet—tiny chance of a huge payoff if the tech scales globally, but near-certain near-zero otherwise. They're stressed and realized they don't have a framework to decide on such risks. Their main request is to outline desiderata for a theory of rational choice that handles these St. Petersburg-type situations without avoiding them. They want each criterion tied to specific cases: puzzles to solve (like the original coin-flip game, moonshot science funding, intergenerational climate bets), distinctions to respect (e.g., risk aversion vs. rational boundedness), and consistency with existing results (like dominance in finite cases). They also want to flag any conflicting desiderata and a quick evaluation of existing theories.

  First, I need to unpack the St. Petersburg paradox. It's a game with infinite expected value, but real people wouldn't pay huge sums to play. Standard expected utility fails here. The user needs a theory that doesn't just dismiss such cases but provides rational criteria. Their real-world analogs are crucial—moonshot projects and climate bets where payoffs could be enormous but are uncertain.

  The user's deeper needs might include clarity on balancing rationality with practicality. They might feel torn between the logical appeal of infinite expected value and the intuition that such bets are too risky. They also need to distinguish normative advice (what one should do) from descriptive behavior (what people actually do), especially since their job decision has real stakes.

  For desiderata, I start listing key requirements. Handling unbounded payoffs without infinite valuation is essential. The theory must resolve the paradox and real-world cases like funding fusion research. Respecting distinctions like risk aversion (preference against variance) vs. rational boundedness (cognitive limits) is important. Consistency with finite cases, like dominance, ensures the theory doesn't throw out established rationality in simpler scenarios.

  Tensions arise. For instance, maintaining consistency with standard expectation in finite cases while rejecting infinite valuations seems conflicting. Bounded utility solves this by capping utility, but it's ad hoc. Risk-weighting (like Prospect Theory) models aversion but may not handle true unbounded payoffs. Satisficing might work by setting a threshold, but it's not optimizing. The user needs to know which theories meet which criteria and where trade-offs lie.

  I'll structure the response with clear desiderata, each linked to cases and distinctions. Highlight the tension between infinite expectation rejection and finite consistency. Then, briefly score theories: bounded utility handles infinity but feels arbitrary; risk-weighting fits behavior but doesn't resolve the paradox normatively; satisficing avoids infinity but abandons optimization. The user might prefer a hybrid approach, but I'll present the trade-offs honestly.
answer: |-
  Here are the desiderata for a theory of rational choice handling St. Petersburg (SP) paradoxes and their real-world analogs, grounded in the problems they must solve and distinctions they must respect:

  **Core Desiderata & Their Motivations:**

  1.  **Handle Truly Unbounded Upsides Without Infinite Valuation:** The theory must not recommend paying any arbitrarily large sum for an SP bet (or moonshot equity/climate intervention) *simply because* the mathematical expectation is infinite under linear utility. It must dissolve the original SP paradox where real agents refuse bets with infinite expected monetary value. *Motivation:* The core puzzle itself. Real agents (and sanity) reject "pay infinity."

  2.  **Respect Finite-Stakes Dominance:** In ordinary finite-choice scenarios with well-defined, bounded payoffs (e.g., choosing $100 for sure vs. $90 for sure), the theory must not violate stochastic dominance (preferring options that are objectively worse in all states). *Motivation:* Maintain consistency with uncontroversial rationality in standard, bounded decision contexts. A theory sacrificing this fails fundamentally.

  3.  **Distinguish Rational Risk Aversion from Bounded Rationality:** The theory must clearly separate:
      *   **Risk Aversion:** A rational preference for less volatile outcomes *even when* the agent fully comprehends the probabilities and payoffs (e.g., preferring $50 for sure over a 50/50 gamble for $0 or $100 due to diminishing marginal utility).
      *   **Bounded Rationality/Cognitive Limits:** Inability to *process* extreme tail risks or vast scales (e.g., truly grasping a 1/2^50 probability or a payoff of $2^50). *Motivation:* Real-world agents exhibit both. A good theory shouldn't misattribute cognitive failure to risk preference, or vice-versa, especially when evaluating "rationality."

  4.  **Acknowledge & Handle Genuine Uncertainty (Not Just Risk):** The theory must cope with situations where the *probabilities* of extreme upside outcomes are fundamentally unknown or unmeasurable (Knightian uncertainty), not just known-but-tiny (like SP probabilities). *Motivation:* Real-world moonshots (fusion, radical geoengineering) involve profound uncertainty about *whether* the technology is even physically possible or scalable to universe-altering levels, not just known-low probabilities.

  5.  **Provide Actionable Guidance Under Resource Constraints:** The theory must offer non-trivial recommendations to agents with finite resources, facing potential SP-like bets (like taking the startup job). "Never bet" is inadequate; "Bet everything always" is absurd. It must navigate how much of one's finite capital (money, time, credibility) to risk. *Motivation:* The practical dilemma driving the query. Normative failure is refusing to give guidance.

  6.  **Accommodate Intergenerational & Existential Scales:** The theory must be applicable to choices where the potential upside or downside spans generations or affects the entire future of civilization (e.g., mitigating catastrophic climate change with near-zero current cost but massive future benefit *if* successful, or a biotech moonshot). *Motivation:* The most significant real-world analogs involve stakes extending far beyond an individual's lifetime or resources.

  7.  **Preserve the Normative Force of Expectation in Bounded Domains:** For decisions with well-defined, sufficiently bounded payoffs and probabilities (e.g., standard insurance, investment portfolios), the theory should converge towards or be consistent with standard expected utility maximization as a rational ideal. *Motivation:* To avoid being radically revisionist. Standard EU works well in vast swathes of decision-making; a good theory extends, rather than wholly replaces, it for edge cases.

  **Flagged Tension:**

  *   **Desideratum 1 (Reject Infinite Valuation) vs. Desideratum 7 (Preserve Normative EU in Bounded Cases):** This is the core tension you suspected. Standard EU, applied rigorously with unbounded utility, *demands* infinite valuation for the SP bet. Rejecting this valuation (D1) while insisting EU is normatively correct for bounded cases (D7) creates friction. **Is it satisfiable?** It's *real*, but potentially resolvable:
      *   **Resolution 1 (Domain Restriction):** Argue that EU is only *defined* or normatively required for gambles where the expectation *converges*. SP lies outside its domain. (But this feels like sweeping under the rug).
      *   **Resolution 2 (Structural Modification):** Modify the EU framework itself (e.g., via bounded utility, risk-weighting) such that SP valuations become finite *while* EU recommendations remain intact for convergent gambles. This satisfies both but changes the normative core.
      *   **Resolution 3 (Meta-Principle):** Introduce a meta-principle that overrides strict EU maximization *only* when it leads to clearly absurd recommendations (like infinite bids), preserving it elsewhere. (This risks being ad hoc).

  **Scoring the Usual Suspects Against the List:**

  1.  **Bounding Utility (e.g., Logarithmic, Capped):**
      *   **Pros:** Instantly satisfies D1 (finite valuation for SP), easily satisfies D2 & D7 (behaves like EU in bounded cases). Can handle D6 conceptually. Clean, mathematically tractable.
      *   **Cons:** Feels deeply *ad hoc* – why *this* bound/function? Struggles with D4 (genuine uncertainty) – bounded utility assumes known probabilities. Doesn't inherently address D3 (risk aversion vs. boundedness) – the bound might reflect either. D5 (actionable guidance) is met only by choosing the bound, which lacks clear justification. Violates the spirit of truly unbounded upside in D6.

  2.  **Risk-Weighting/Probability Distortion (e.g., Prospect Theory weighting function):**
      *   **Pros:** Satisfies D1 by underweighting tiny probabilities. Captures descriptive reality well (people *do* neglect extreme tails). Can handle D3 by modeling neglect as cognitive, not pure risk preference. Addresses D4 indirectly via weighting uncertainty. Can provide actionable D5 (e.g., "ignore tails beyond probability X").
      *   **Cons:** Primarily descriptive, weak normative justification for *which* weighting is "rational." May struggle with D2 in complex cases. Doesn't fully satisfy D7 – it systematically deviates from EU even in bounded cases. Handling true unboundedness (D6) remains awkward.

  3.  **Dropping Expectation Maximization (e.g., Satisficing in Unbounded Domains):**
      *   **Pros:** Directly satisfies D1 (never pay infinite). Handles D4 & D6 naturally (focus on achieving "good enough" rather than optimizing the unoptimizable). Respects D3 (acknowledges cognitive limits). Provides clear D5 (set a maximum affordable stake based on resources/aspiration).
      *   **Cons:** Violates D2 & D7 fundamentally – it abandons dominance and EU even in simple, bounded cases where they seem compelling. Lacks normative force; "good enough" is subjective. Struggles to distinguish rational caution from mere lack of ambition.

  **Quick Synthesis:** No theory perfectly satisfies all desiderata. **Bounding Utility** scores well on mathematical coherence and handling infinity (D1, D2, D7) but feels arbitrary and ignores uncertainty/cognition (D3, D4). **Risk-Weighting** excels descriptively and addresses cognitive limits/neglect (D1, D3, D4, D5) but lacks normative grounding and deviates from EU (D7). **Satisficing** handles the practical reality and infinity (D1, D4, D5, D6) but sacrifices core normative principles (D2, D7). The unresolved tension between D1 and D7 suggests a genuinely hard problem; any solution likely involves a principled modification or domain restriction of standard EU, not just a minor tweak. For your job offer, focusing on D5 (actionable guidance under constraints) and D4 (genuine uncertainty about scalability) might be most pertinent, pushing towards rules-of-thumb based on affordable loss or aspiration levels, potentially informed by risk-weighted models.
