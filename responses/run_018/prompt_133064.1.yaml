  okay so me and my friend were arguing til like 2am about determinism and chaos — he kept saying that if the world is deterministic then in principle we should be able to predict everything, and I was like well what about Lorenz? i was thinking about that 1961 run on the Royal McBee LGP-30 where he was running those 12 coupled weather equations, and he rounded an initial condition from 0.506127 down to 0.506 just to save paper, and the whole simulation went totally off the rails compared to the unrounded run. my friend says thats just a practical computer glitch, not a real philosophical result about determinism. but i want to actually map this specific episode through the determinism/predictability distinction properly. analyze Lorenz's run — the deterministic rules, the rounding, the divergence — through chaos theory and the idea that determinism doesnt necessarily imply predictability. tell me exactly what the theory explains about what happened in that room, and then be honest about where it breaks down or stays silent. does the fact that Lorenz could reproduce the divergence exactly once he used the same rounded input mean there's hidden determinism behind the chaos, or does it just push the unpredictability problem back one level? and is this an epistemic limit — we just cant measure precisely enough — or does it show that even with perfect knowledge of the laws, long-term prediction is impossible in principle for some systems? please dont just repeat the butterfly effect anecdote i already know; im trying to write a paper for my phil of science course and i need the actual mapping, not a story.
