    "underdetermined_points": ["Spatiotemporal part-continuity could be argued to align via auxiliary assumptions (if intervention profile indicates continuity), but conflicts with rule's disregard for physical differences.", "Input-output mapping theories are incompatible without redefining inputs to include interventions."],
    "protocol_changes_if_view_replaced": "Tagging would be based solely on observable symptoms (e.g., vibration spectra, thermal signatures), ignoring intervention profiles. Same symptoms would imply same mechanism, different symptoms would imply different mechanisms, even if the same intervention fixes both."
