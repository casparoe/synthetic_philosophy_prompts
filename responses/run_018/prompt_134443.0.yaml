answer: |-
  Here’s a structured 75-minute teaching plan focused on conceptual clarity and critical engagement:

  **Total Time:** 75 minutes  
  **Participants:** ~10 graduate students  
  **Goal:** Secure the *pure/impure distinction* and make pure time preference (PTP) palpable as a normative choice.

  ---

  ### **1. Conceptual Groundwork: Distinguishing "Pure" Discounting (15 min)**
     - **Hook (3 min):** "Why might £100 today feel *ethically different* from £100 tomorrow? List reasons." (Group brainstorm → board).
     - **Critical Distinction (10 min):**  
       - Isolate *instrumental* reasons (risk, inflation, opportunity cost) from *intrinsic* reason (mere time passage).  
       - **Key Dependency:** PTP only appears *after* controlling for:  
         (a) Diminishing marginal utility of consumption (wealth effects),  
         (b) Risk/uncertainty,  
         (c) Projected productivity/growth.  
       - *Without this, PTP is either tautological (collapsed into utility) or an empirical shadow.*
     - **Define PTP (2 min):** "Discounting future goods *solely* because they are temporally distant."

  ### **2. Carrying Scenario: The "Fixed Pie Transfer" (15 min)**
     - **Scenario:** "Agent A must transfer a fixed, non-perishable good (e.g., 100kg grain) to Agent B. *No risk, no storage cost, no wealth/utility differences between A/B, no growth.* A chooses between:  
       Option 1: Transfer NOW.  
       Option 2: Transfer in 10 YEARS.  
       If A prefers Option 1 *despite identical material outcomes*, this reveals pure time preference."  
     - **Features:**  
       ✅ Fixed resource, controlled variables, agents identical in capacity.  
       ❌ Avoids consumption/saving choices, compounding, or curves.  
     - **Why it works:** Forces focus on *time itself* as the variable. Ethical weight emerges: "Is delay *intrinsically* costly?"

  ### **3. Misconception Interception (15 min)**
     - **Conflation w/ Risk Aversion:**  
       *Intercept after scenario:* Contrast with a variant where "B might not exist in 10 years." Ask: "Is this the *same* reason as in the fixed pie?" → Clarify risk ≠ PTP.
     - **Spatial-Distance Analogy:**  
       *Intercept during framing device (below):* "If we demand equal concern for someone 100km away vs. here, why not 100 years hence?" → Highlight temporal *indexicality* break.
     - **Instrumental Justification Expectation:**  
       *Intercept after defining PTP:* "Must PTP be *justified* by something else? Or can it be axiomatic?" → Challenge the assumption that neutrality is default.

  ### **4. Framing Device: Symmetry & Indexicality (15 min)**
     - **Analogy Setup (5 min):**  
       "Spatial ethical neutrality: My obligations don’t diminish with distance (e.g., aiding a famine victim far vs. near)."  
     - **Temporal Symmetry Claim (5 min):**  
       "Intertemporal neutrality: Equal concern for welfare at all times *prima facie* plausible."  
     - **Structural Break (5 min):**  
       "But: *I exist now*. Future well-being is indexical ('then-there'), not agent-neutral ('now-there'). Time binds agency/perspective in ways space doesn’t."  
     - **Illuminates:** PTP as a *departure* from neutrality rooted in temporal perspective.  
     - **Risks Distorting:** Overemphasizes "present self" bias; downplays that future persons are distinct moral patients.

  ### **5. Diagnostic Exercise (10 min)**
     - **Paired Scenarios Test:**  
       Present two cases:  
       **Case A:** "Discounting a future painkiller dose due to 1% annual risk it won’t be needed."  
       **Case B:** "Discounting a guaranteed future painkiller dose solely because it’s delayed."  
     - **Task:** "Identify which involves PTP and explain *why* the other does not."  
     - **Diagnostic:** Correctly isolating Case B *and* specifying that Case A’s discounting is impure (risk-based) confirms grasp of the distinction.

  ### **6. Explicit Omissions (5 min)**
     - **State upfront:** "Today we omit:  
       - Formal discounting models (exponential/hyperbolic curves),  
       - Infinite-horizon aggregation (e.g., Ramsey model critiques),  
       - Social choice frameworks (intergenerational justice, optimal savings).  
       Why? To isolate the *core ethical claim* of PTP without technical overhead."

  ---

  **Timing Buffer:** Built into discussion segments; adjust Q&A depth as needed.  
  **Pedagogical Anchor:** The "Fixed Pie" scenario + diagnostic exercise ensure the distinction is operationalized, not just recited.  
  **Why this works:** Forces confrontation with PTP as a primitive ethical stance, stripped of conventional economic baggage.
