answer: |-
  (adjusting spectacles, with measured intensity)  
  You press upon the very nerve of the difficulty, and I welcome it. The contradiction is apparent, not real. My principle stands inviolate: over any people *capable of self-direction by free and equal discussion*, paternal power is tyranny. But India is not England. This is not a line drawn arbitrarily around Indians; it is drawn by the stark reality of their present stage of societal development.

  Consider the facts. India is a vast aggregation of peoples, many still bound by archaic customs – infanticide, suttee, internecine warfare, oppressive caste systems that crush individual potential. They exist, largely, in what we must term a *barbarous* or semi-barbarous state. Societies, like individuals, progress through stages. The principle of liberty – the absolute bar against interference for a person's own good – applies *only* to those in the maturity of their faculties within a society capable of sustaining rational, representative government.

  British rule in India, as administered by the Company – an entity deliberately structured for disinterested administration, insulated from the caprices of Parliament and the scramble for patronage – is not paternalism for its own sake. It is **trusteeship**. It is the temporary, necessary exercise of authority by a more advanced civilization to prepare a less advanced one for the eventual capacity of self-rule. Our duty is not to impose our *will*, but to foster the *conditions* – education, rule of law, infrastructure, security from internal tyranny and external conquest – under which the Indian peoples may develop the rational faculties and social institutions necessary for freedom.

  You ask why this logic cannot be applied to the poor or uneducated Englishman? Because England *is* a society in that mature state. The poorest Englishman breathes the air of a free society; he participates, however minimally at first, in a vast network of public opinion, representative institutions, and accessible avenues for self-improvement. He is surrounded by peers capable of liberty, whose collective discourse and action safeguard his own path to development. To subject him to coercive 'improvement' *stunts* the very growth liberty encourages. It is an insult to his inherent capacity, honed by his societal context.

  In India, that societal context does not yet exist. To abandon it to its own fractured, despotic, or anarchic tendencies now – to grant the abstract right of self-government before the capacity for its beneficial exercise is cultivated – would be the *true* harm. It would perpetuate suffering, stagnation, and violence on an immense scale. Our rule, flawed as any human institution must be, aims at preventing that greater harm and fostering the capacity for future self-determination. It is a solemn responsibility grounded in utility, not a paternalistic whim. We hold power not *over* Indians as perpetual children, but *in trust* for the future Indians who may become capable of the liberty I champion.
