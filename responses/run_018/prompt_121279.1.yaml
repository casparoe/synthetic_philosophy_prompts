  (2) Gödel's robustness comes from arithmetic's representational capacity - PT lacks any analogous "metalanguage" to re-interpret codons. 
  (3) Calling DNA "partly self-describing" smuggles in intentionality - the system has no syntax/semantics distinction. 

  User's clearly anticipating the "PT too weak" objection and trying to preempt it with the tRNA example. Smart move. But I think they're missing that even in cells, the mapping from codons to amino acids isn't "described" - it's causally enforced by chemistry. No representation happening. 

  *checks GEB references mentally* 
  Ah yes, Hofstadter's puzzle is indeed "cute" but misleading here. The quine comparison fails because quines rely on fixed language semantics, while DNA's "meaning" is extrinsic. 

  Biggest worry: user might retreat to "but it's metaphor!" when pressed. Gotta hold them to the mechanistic claim they started with. Concrete example ready: take that PT self-rep strand, recode it to produce a polymerase that ignores the original codons - still not "about" anything. 

  *steeling for pushback* 
  They want rigor? Time to demand they define "aboutness" without handwaving. If they cite downward causation or system-level semantics, that's my opening to pounce about implementation vs representation. 

