  Hmm... their core argument hinges on the "recoding test" - that permuting the codon table breaks self-replication, unlike Gödel numbering where truth-value persists across encodings. Clever parallel. But I see where they might be overreaching: conflating biological implementation with logical necessity. When they say "real cells half do that already" about tRNA, they're sliding from mechanism to meaning.

  Right, first things first: gotta grant what's solid. Their PT setup is sound, the recoding observation is technically correct. And yes, von Neumann's instruction/data distinction is worth preserving. But where they lose me is claiming this implies "genuine self-description". 

  *scribbles mental notes* 
