prompt: |-
  I'm moderating a colloquium Q&A with a philosopher who defends a reconstructed version of the classical James-Lange feeling theory, updated through what she calls predictive interoceptive framing: the claim that an emotional episode is neither a judgment about value nor a direct perception of an affective property, but a top-down predictive model that assigns affective significance to interoceptive signals before they reach conscious awareness, leaving the conscious feeling as nothing more than the residual prediction error that survives suppression. Draft eight to ten interview questions that press this view at exactly the points where the literature presses feeling theories and predictive-coding accounts of emotion: at least one on the intentionality problem (how a bare interoceptive state can be directed at an external situation), one on whether admitting conceptual scaffolding collapses the position into a form of cognitivism, one on how it handles moral emotions such as indignation that appear conceptually loaded, and one on whether pathological anxiety and appropriate fear are distinguishable if both are merely high-precision prediction errors of the same kind. For each question, include a brief follow-up keyed to the answer she is most likely to give — for instance, if she appeals to conceptual scaffolding to solve intentionality, ask whether that scaffolding then performs all the explanatory work and renders the interoceptive base redundant.
