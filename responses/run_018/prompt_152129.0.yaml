answer: |-
  Here's the breakdown you're after - mapping the Wolfenden saga onto Hart-Devlin with a contamination anxiety twist:

  **The Actors & Their Moves:**

  1.  **The Wolfenden Committee (1957):**
      *   **What they faced:** Victorian-era laws criminalizing *all* male homosexual acts, rampant blackmail, ruined lives, police harassment, and a growing (but hushed) medical/social view that homosexuality wasn't a contagious sin but a state of being.
      *   **What they did:** Recommended decriminalizing *private* consensual homosexual acts between adults (over 21). Argued law's role isn't to enforce morality *as such*, but to preserve public order and decency, protect the vulnerable, and prevent exploitation and corruption. Private immorality ≠ crime.
      *   **Devlin's Verdict:** **Betrayal.** The Committee fundamentally misunderstood the law's purpose. Society *is* held together by a shared public morality. Homosexuality wasn't just "private immorality"; it was a direct attack on the institution of marriage and family – core societal glue. Tolerating it in private *is* licensing its existence, weakening the moral condemnation essential for social cohesion. They ignored the "disintegration" threat.
      *   **Hart's Verdict:** **Correct.** Precisely applied liberal principles. They distinguished harm from mere offence/disgust. The *real* harms (blackmail, ruined lives, police corruption) stemmed *from* criminalization, not homosexuality itself. The "shared morality" against homosexuality wasn't some profound, rational consensus; it was largely irrational disgust and religious taboo. Law shouldn't enforce that.

  2.  **Lord Devlin (1959 Lectures - "The Enforcement of Morals"):**
      *   **What he faced:** The Wolfenden recommendations gaining traction, threatening the established moral order.
      *   **What he did:** Launched a full-throated defense of legal moralism. Argued society has the right to use law to protect its fundamental moral fabric ("public morality") from destruction, even against purely "private" acts. Homosexuality was such a fundamental threat. Intolerance is society's necessary "seamless garment." Reasonable man's "intolerance, indignation, and disgust" is a valid indicator of what morality needs protecting.
      *   **Devlin's Own Lights:** Doing his duty! Defending society's bedrock against a corrosive liberal error. The "shared morality" *was* coherent – built around Christian marriage and family. The harm *was* societal disintegration, not individual welfare.
      *   **Hart's Verdict:** **Dangerously Wrong.** Devlin conflates morality with popular disgust/irrationality. His "shared morality" is vague, shifting, and often repressive. He ignores the *actual* welfare harm to gay men caused *by* criminalization (fear, violence, ruined careers). His framework **defines this harm out of bounds from the start** – if it doesn't threaten "society" (as he narrowly defines it), it doesn't count as relevant harm. This licenses majoritarian tyranny.

  3.  **H.L.A. Hart (1963 - "Law, Liberty and Morality"):**
      *   **What he faced:** Devlin's powerful critique gaining influence, potentially scuttling reform.
      *   **What he did:** Articulated the classic liberal defense: Law should only intervene to prevent *harm to others* (Mill's principle). Morality enforcement for its own sake is illegitimate. Critiqued Devlin's "disintegration thesis" as empirically unfounded and conceptually flawed ("What *is* this 'morality'? How much change causes 'disintegration'?"). Argued Devlin's reliance on disgust was irrational and a terrible basis for law.
      *   **Hart's Own Lights:** Upholding individual liberty against oppressive majoritarianism. Protecting vulnerable minorities from state intrusion based on prejudice. Promoting a rational, harm-based legal system.
      *   **Devlin's Verdict (Imagined):** Naive and destructive. Sacrificing social cohesion on the altar of abstract liberty. Failing to recognize that *tolerance itself* can be the mechanism of disintegration by eroding essential shared norms.

  4.  **Parliament (1957-1967):**
      *   **What they faced:** A controversial report, fierce public and religious opposition (disguised as moral concern), political cowardice, and the slow grind of changing attitudes.
      *   **What they did:** **Dragged their feet for a decade.** Finally passed the **Sexual Offences Act 1967**, decriminalizing *only* private acts between *two* men, *both* over **21** (higher than hetero age of consent). Kept broad "public order" provisions and harsh penalties for anything remotely public or involving more than two.
      *   **Devlin's Verdict (on the Act):** A dangerous concession, but perhaps a *necessary containment*. Setting the age at 21 and strictly limiting it to absolute privacy might act as a firewall, acknowledging the "immorality" while grudgingly reducing the *practical* harms of blackmail/corruption. It's legal moralism negotiating its borders – still condemning the act morally but carving out a tiny, hidden exception under duress.
      *   **Hart's Verdict (on the Act):** A **flawed, half-liberal win**. It reduces *some* harm (blackmail risk lessened) but fails the liberal test completely. The higher age limit and "private only" restriction are pure moralism/paternalism, not based on harm. It treats gay men as inherently dangerous, corrupting, or incapable of consent equal to straights. It's a grudging concession to practicality, not an embrace of principle.

  **The 1967 Act: Hart Win or Negotiated Moral Containment?**

  *   **Superficially Hart-ish:** It *did* decriminalize some private acts, aligning with Wolfenden/Hart's core recommendation to retreat from the bedroom.
  *   **Reality: Devlin-esque Containment:** The **21 age limit** (explicitly argued as needing more "maturity" due to the act's "seriousness") and **strict privacy requirement** scream moral condemnation and contamination anxiety. It wasn't recognizing equality; it was creating a heavily quarantined, grudging exception. Parliament wasn't saying "This is morally acceptable"; it was saying "We'll tolerate this *only* if you hide it absolutely and only if you're 'old enough to know better', to minimize the risk of it spreading." **Total Devlin-style negotiated moralism.**

  **The Contamination Anxiety Reframing:**

  *   **Devlin's Disgust as Moral Hygiene Panic:** Instead of seeing "disgust" as a direct moral intuition, view it as **fear of moral contamination**. Allowing homosexuality *anywhere*, even privately, is like allowing a virus or sewage leak. It *will* inevitably seep out:
      *   Normalizing it privately weakens public condemnation (the "seamless garment" frays).
      *   It might "recruit" or confuse young men (hence the 21 age limit as a "firebreak").
      *   It erodes the sanctity of marriage/family by offering an alternative (even if hidden).
      *   Tolerance is the first step towards societal acceptance, which = societal collapse.
  *   **Does this make Devlin stronger/weaker/different?**
      *   **Stronger?** In explanatory power for *Parliament's actions*. The 10-year delay and the hyper-restrictive nature of the 1967 Act make **perfect sense** through this lens. It wasn't just debating abstract morality; it was **panic about containment**. How high must the walls be? How old must people be to be "resistant"? How do we ensure it *stays* hidden? This fear is more visceral and politically potent than abstract moralism. It explains the *specifics* of the compromise.
      *   **Weaker?** As a *moral philosophy*, yes. It exposes Devlin's "shared morality" as potentially irrational panic (hygiene fear) rather than reasoned principle. Hart would pounce: Law based on hygiene panic is even *less* rational than law based on (supposedly) shared moral truth. It's primal fear masquerading as social theory.
      *   **Structurally Different?** Absolutely. It shifts the argument from "Is this act *inherently* immoral/wrong?" to "**What are the *contagion risks* of allowing it?**" The focus becomes the *permeability* of the boundary between private tolerance and public norm erosion. Devlin's "disintegration" becomes less about sudden collapse and more about gradual, insidious moral pollution.
  *   **Parliament & Contamination Anxiety:** The **decade-long delay** screams "procrastination hoping the problem goes away/containment holds without legislation." The **21 age limit** is pure "protect the young/vulnerable from exposure/corruption." The **strict privacy rules** are "build higher walls to prevent seepage." The limited scope (only 2 men) minimizes "clusters" of infection. **This wasn't Parliament reluctantly embracing Hart; it was Parliament terrifiedly implementing Devlin's moralism *through* the logic of contamination control.**

  **In essence:** The Wolfenden saga shows Hart winning the intellectual battle (harm principle vs. moral enforcement) but Devlin winning the *psychological and political* battle through the powerful, unspoken engine of **moral contamination anxiety**. The 1967 Act wasn't a liberal triumph; it was a quarantine protocol negotiated under duress. The "disgust" Devlin appealed to was less about the inherent "wrongness" of the act for many opponents, and far more about the terrifying prospect of it *escaping containment* and infecting the social body. That anxiety shaped the law far more than any high-minded principle.
