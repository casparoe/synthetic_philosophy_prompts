answer: |-
  Here's the scenario:

  > **The Ceremonial Mace**: An ancient university's wooden mace, essential for legitimizing graduations, is constituted by a specific oak block. *First Transformation*: Over decades, artisans meticulously replace every splinter of the oak with identical, consecrated oak, preserving its exact form, weight, and inscriptions using original tools; the university continues using it. *Second Transformation*: A fire warps the *original* mace beyond recognition; a craftsman salvages the undamaged oak matter and carves it into a gavel and a ceremonial bowl, both used in distinct university rituals. The original mace's role remains unfilled.

  **Analysis:**

  1.  **First Transformation (Gradual Replacement):**
      *   **Constitution View:** The mace survives. The object is constituted by matter but defined by its enduring form, function (conferring legitimacy), and institutional role. The gradual replacement preserves these essential properties – it still *functions as* and is *recognized as* the ceremonial mace.
      *   **Identity View:** The mace is strictly identical to the original oak atoms. Replacing all matter creates a new, distinct aggregate of wood. Despite appearances and function, it's a replica, not the *identical* object. The original ceased to exist when the last original atom was replaced.
      *   **Verdict Flip:** Constitution: Survives. Identity: Doesn't.

  2.  **Second Transformation (Salvage & Reshaping):**
      *   **Constitution View:** The mace does *not* survive. Its essential form and specific legitimizing function are destroyed by the fire and subsequent reshaping. The gavel and bowl are new objects constituted by the same matter, performing distinct functions. The unfilled role confirms its destruction.
      *   **Identity View:** The original oak matter persists. Therefore, the object constituted by that matter persists. The mace *is* that parcel of oak. Its change in shape and function is accidental; the underlying substance (the oak) remains identical. The gavel or bowl (or the aggregate) *is* the original mace, now in a different form.
      *   **Verdict Flip:** Constitution: Doesn't Survive. Identity: Survives.

  **Driving Disagreement:** The essentiality of **relational/functional properties vs. matter**. Constitution views prioritize persistence conditions tied to form, function, and social/ceremonial role (relational properties). Identity views prioritize the persistence of the matter itself as the sole criterion for the object's persistence.

  **Stripping Away the Key Feature:** Remove the mace's specific ceremonial/legal function and institutional role, reducing it to *just* a shaped block of wood. The first transformation becomes a Ship-of-Theseus case (Constitution: survives via form; Identity: doesn't via matter replacement). The second transformation becomes a standard lump-to-statuesque case (Constitution: new objects; Identity: same lump). The case collapses into familiar puzzles without the unique functional/relational weight driving the flipped intuitions.

  **Identity Theorist Attack:** The identity theorist would reject the **metaphysical significance of the ceremonial function and institutional role**. They'd argue: "You're confusing *what the matter is used for* (a contingent, relational property) with *what the object fundamentally is* (the matter itself). The mace's 'function' is just a human label applied to the wood configuration. When the matter is replaced (first transform), the original wood is gone, so the object is gone. When the matter persists (second transform), the object persists, regardless of its new shape or *different* human labels ('gavel', 'bowl'). The 'unfilled role' is irrelevant – that's about social practices, not ontology. The object didn't cease; its matter just stopped being *called* a mace." Their core denial is that relational/social properties are essential to the object's identity.
