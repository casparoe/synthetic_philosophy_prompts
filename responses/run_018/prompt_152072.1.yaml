prompt: |-
  I'm prepping for a podcast interview next tuesday with a decision theorist who defends expected-value fanaticism, but she's not just repeating the usual line — she thinks probabilities should be treated as "normative weights" that don't agregate linearly, so there's no psychological problem with accepting an infintesimal chance of enormous payoff at enormous cost. She calls the view weighted-value non-agregation. I want 8-10 interview questions that go past surface-level stuff. I need at least one hitting the dust-speck-vs-astronomical-good comparison, one asking how she handles St. Petersburg-style unbounded value without falling into risk-paralysis, and one pressing whether she's just relabeling the intuition that we shouldn't gamble everything on a longshot. For each of those, include a follow-up tailored to the reply she's likely to give — like if she says weights don't need coherence constraints, ask what stops them from being arbitrary. Please also separate what's settled in decision theory from what's genuinely contested among people who actually work on it, and don't present her stance as the consensus. No bibliography or citation requests, please — I'm not cramming papers before tuesday.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a decision theorist who advocates for "weighted-value non-aggregation." This is a unique take on expected-value fanaticism where probabilities are treated as normative weights that don't aggregate linearly. The user needs 8-10 deep questions, with specific requirements for three key areas: dust-speck vs. astronomical good comparison, handling St. Petersburg paradox without risk paralysis, and addressing whether this is just relabeling the longshot gambling intuition. They also want follow-ups tailored to likely responses and clarity on what's settled vs. contested in decision theory.

  First, I need to understand the core of her position. She rejects linear aggregation of probabilities, so standard expected utility theory doesn't apply. Instead, probabilities act as weights in a non-linear way. This avoids psychological issues with tiny probabilities of huge payoffs. The user mentioned examples like dust-speck torture versus astronomical good, so questions need to challenge her view on how these weights handle extreme cases.

  For the dust-speck scenario, the classic problem is whether to choose one person tortured for 50 years versus 3^^^3 people getting dust specks. Standard expected utility might reject it, but her view might accept it due to non-linear weights. I should ask how her weights assign value here and follow up on whether there's a threshold where small probabilities become irrelevant. She might say weights never hit zero, so the follow-up would press on practical implications, like whether any non-zero chance of catastrophe must be avoided at all costs.

  Next, the St. Petersburg paradox. It involves a game with infinite expected value but requires unbounded resources. Her non-aggregation might avoid risk paralysis, but how? The question needs to target how her weights handle infinite sums without leading to inaction. Follow-up: if she says weights diminish faster, ask why that rate is chosen and what principle guides it, to avoid arbitrariness.

  Then, the relabeling concern. Is this just dressing up "don't gamble everything" as a theory? I should ask how her view differs from caution against longshots. If she argues weights are objective, follow up on how they're derived without being subjective. This ties into the settled vs. contested aspects—expected utility is settled for finite cases, but infinite values are debated. Also, fanaticism is contentious.

  I need to ensure the questions probe deep without requiring prior reading. The follow-ups should anticipate her defenses: if she says weights don't need coherence, ask about arbitrariness; if she dismisses thresholds, ask about real-world consequences. Highlighting contested areas is crucial—she's in the minority, so the podcast shouldn't present this as consensus.

  Also, the user wants 8-10 questions total. Including the three specified, plus others on risk aversion, practical applications, ethical implications, and comparison with other approaches. Each main question with a follow-up, so about 5-6 main questions with follow-ups making up the rest.

  Check if all user points are covered: dust-speck, St. Petersburg, relabeling, settled vs. contested, no citations. Follow-ups are tailored. Need to separate her view from consensus, e.g., note that expected utility is standard, her approach is niche. Avoid jargon, keep questions accessible for a podcast audience.
answer: |-
  Here are 9 core interview questions plus tailored follow-ups for your "weighted-value non-aggregation" (WVNA) interview, designed to probe deeply while respecting time constraints and the need to distinguish settled theory from ongoing debate:

  **Core Distinction (Settled vs. Contested):**
  *   **Settled:** The axioms of Expected Utility Theory (EUT) provide a coherent framework for rational choice under *finite* risk and uncertainty when preferences satisfy certain consistency conditions (completeness, transitivity, continuity, independence). EUT is the dominant *normative* standard for finite cases. Risk aversion is explainable within EUT via concave utility functions.
  *   **Contested:** How to handle *infinitesimal probabilities* of *enormous stakes*, *unbounded value* (like St. Petersburg variants), and whether fanaticism (prioritizing tiny chances of vast payoffs/costs) is rational. The status of the Independence Axiom in extreme cases is hotly debated. WVNA is a *highly contested minority view* within these debates.

  **Interview Questions:**

  1.  **Core Distinction & Motivation:** "WVNA explicitly rejects the linear aggregation of probability and outcome value central to standard Expected Utility Theory (EUT). Beyond avoiding the alleged psychological 'problem' with tiny probabilities, what fundamental *normative* flaw in EUT's linear aggregation does WVNA aim to correct? Is it primarily about the nature of probability, value, or the relationship between them?"  
      *   *Follow-up (if she critiques EUT's probability handling):* "If probabilities aren't linear weights for aggregation in WVNA, what *is* their normative role? How does this role differ fundamentally from simply having a non-linear utility function over outcomes *combined* with standard probability weighting?"  
      *   *Follow-up (if she focuses on value aggregation):* "Does WVNA imply that the *intrinsic* value of an outcome changes based on the probability with which it's considered? That seems counterintuitive – how do you reconcile that?"

  2.  **Dust Specks vs. Astronomical Torture:** "Take Bostrom's classic torture vs. dust specks scenario. EUT (with linear value aggregation) arguably forces us to accept that imposing an astronomically tiny chance of prolonged torture on one person is worse than certainly imposing a dust speck on 3^^^3 people, if the numbers are big enough. How does WVNA handle this comparison? Does it avoid this implication, and if so, *how* precisely do the 'normative weights' assigned to the tiny probability of torture prevent its overwhelming negative value from dominating?"  
      *   *Follow-up (if she says weights prevent domination):* "Does this mean WVNA imposes an *effective threshold* where probabilities below a certain point, even attached to vast values, become normatively negligible? If not, how does it avoid paralysis when facing *any* non-zero probability of cosmic catastrophe? If yes, how is that threshold defined non-arbitrarily within WVNA?"

  3.  **St. Petersburg & Unbounded Value:** "The St. Petersburg paradox highlights issues with unbounded utility. WVNA seems tailor-made to handle this, as non-linear weighting could tame the infinite sum. But how, specifically, does WVNA resolve it without leading to 'risk paralysis' – the inability to act because *every* action carries *some* non-zero probability of an outcome with unbounded negative value according to the theory? What constrains the weights to allow meaningful decisions?"  
      *   *Follow-up (if she describes how weights diminish):* "What normative principle determines the *rate* or *shape* of this diminishment for the weights? If it's not derived from something like a bounded utility function or a direct probability threshold, doesn't this open WVNA to the charge that the weighting scheme itself is arbitrary or lacks a foundation beyond resolving the paradox?"

  4.  **Relabeling Caution?** "A critic might argue that WVNA isn't a fundamentally new theory of rational choice, but rather a sophisticated way of *relabeling* the deeply held intuition that it's simply irrational to gamble everything (or impose vast costs) on an extremely long shot, regardless of the EV calculation. How would you distinguish WVNA from just formalizing this pre-theoretic caution? What unique *rational* insight does WVNA provide that this intuition lacks?"  
      *   *Follow-up (if she emphasizes normative grounding):* "If the weights are 'normative,' where does their normative force come from? Are they supposed to be discovered or constructed? If discovered, what is the source? If constructed, what prevents them from being arbitrary post-hoc justifications for our prior intuitions about longshots?"

  5.  **Coherence & Constraints:** "Standard EUT derives powerful coherence constraints (like the Independence Axiom) from its axioms. WVNA explicitly rejects linear aggregation. What core coherence constraints, if any, *do* apply to the assignment of normative weights in WVNA? What stops the weighting scheme from being completely arbitrary or context-dependent in a way that violates basic consistency requirements for rationality?"  
      *   *Follow-up (if she downplays constraints or offers weak ones):* "Without strong constraints like Independence applied to probability-outcome pairs, how can WVNA avoid Dutch books or other exploitable inconsistencies in an agent's choices across different gambles involving similar probabilities and outcomes?"

  6.  **Practical Application & Risk Aversion:** "How does WVNA handle mundane, non-extreme decisions involving risk aversion? For example, explaining why someone pays insurance premiums (accepting a certain small loss to avoid a tiny chance of a huge loss) or buys lottery tickets (paying a certain small loss for a tiny chance of a huge gain). Does it replicate EUT's explanations using concave utility, or does it offer a different account using the weights?"  
      *   *Follow-up (if she uses weights for mundane cases):* "Doesn't invoking non-linear weights for everyday risks risk overcomplicating the explanation? Isn't concave utility simpler and well-established? What advantage does WVNA offer here?"

  7.  **Fanaticism & Asymmetry:** "WVNA seems to enable fanaticism for both positive and negative stakes (e.g., pursuing tiny chances of utopia, avoiding tiny chances of hell). But is there an asymmetry? Do we observe, or should we endorse, *positive fanaticism* (betting the farm on a long-shot cure for cancer) as readily as *negative fanaticism* (sacrificing immense resources to avert a minuscule existential risk)? How does WVNA handle any potential asymmetry?"

  8.  **Comparison Points:** "WVNA positions itself against standard EUT and perhaps other approaches to infinite ethics/fanaticism like lexical thresholds, bounded utility, or variance aversion. What do you see as the single strongest *positive* argument *for* WVNA compared to these alternatives? Conversely, what's the most potent *objection* you grapple with from these rival approaches?"

  9.  **The "So What?" Factor:** "Assume WVNA is correct. What's the most significant *practical* implication for how individuals, institutions, or society should make high-stakes decisions under uncertainty that differs radically from what standard EUT or common sense would recommend? Can you give a concrete example of a real-world decision that would change?"

  **Key things these questions do:**
  *   **Force Definition:** Make her clarify "normative weights" and their role distinct from EUT components.
  *   **Target Specific Puzzles:** Hit Dust Specks, St. Petersburg, and the "relabeling" critique head-on.
  *   **Probe Foundations:** Ask about constraints, arbitrariness, sources of normativity, asymmetry.
  *   **Demand Distinction:** Push her to differentiate WVNA from bounded utility, thresholds, and simple caution.
  *   **Explore Implications:** Ask about practical consequences and comparison to alternatives.
  *   **Use Follow-ups Dynamically:** Anticipate defenses and press on potential weaknesses (arbitrariness, lack of constraints, paralysis, overcomplication).
  *   **Acknowledge Context:** Frame questions knowing EUT is settled for finite cases and WVNA is a contested proposal for extremes.

  Good luck with the interview! Focus on getting clear explanations of the core mechanisms of WVNA and pushing on its vulnerabilities.
