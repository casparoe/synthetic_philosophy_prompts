  but here's the twist to keep it from being totally boilerplate: the disagreement shouldn't be about some standard belief like "god exists" or "the stock will go up." instead, have it be about whether an ambiguous instalation piece—say, a room filled with broken mirrors and one intact vase—counts as an artwork about fragility or about resilience. both peers are art historians with identical training, but one sees fragility everywhere and the other sees resilience. the poem should make clear that thier disagreement isn't about missing evidance but about something like a temperamental or gestalt difference that conciliationism can't just average away. make sure it's accurate enough that someone who knows the conciliationism/steadfastness debate recognizes the positions—conciliationism as the view that you should reduce confidence when you discover an epistemic peer disagrees, steadfastness as the view that you can rationally maintain your belief if you have independent reasons or if the disagreement traces back to some non-evidential factor. the rhyme scheme should be A1 b A2 / a b A1 / a b A2 / a b A1 / a b A2 / a b A1 A2, and the refrains need to be exact in repetition. keep it around 19 lines. and please, no bibliography or "for further reading" at the end—this is for a seminar closing, not a syllabus.
