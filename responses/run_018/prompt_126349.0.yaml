prompt: |-
  hey so im applying for a tiny three-month stipend from my local community board - they fund weird little independent projects and i need a one-page proposal. my idea is kinda messy: tipping in america, queueing in britain, and jaywalking in germany are always called "just customs" but people still act like youre morally broken if you skip them, especially as a visitor who doesnt recieve the local signals. ive started calling these "ghost rules" - not laws, not deep ethics, but they leave a social stain when broken. the core question: do ghost rules create actual obligations for outsiders, or is the anger people feel just tribal defensivness wearing a moral mask? please turn this into a proposal with a precise statement of the question, why the standard answers ("when in rome..." vs "morals dont have borders") fail to settle it, what approach id actually take over three months (i was thinking compare the three cases and sketch a small framework for when a convention turns binding, but say if thats the wrong method), what a result looks like and what counts as failure, and an honest reality check on scope. write it casual, like im pitching a friend. dont include a bibliography, citations, or any reading list - i want to stay in regular reasoning, not academic name-dropping. and please dont build this around some ultra-niche theory i wouldnt have heard of; keep it to concepts a regular person can think through.
