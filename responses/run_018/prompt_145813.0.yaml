answer: |-
  ## Bottom-Line Summary
  This procedure provides a reusable, Jaspers-based filter for institutional statements on historical wrongs. It achieves clarity by: (1) **Categorizing** the proposed guilt type (criminal, political, moral, metaphysical); (2) **Assessing** if the museum *represents* the collective subject capable of bearing *that specific guilt*; and (3) **Prescribing** the permissible institutional speech act. The two most critical gates are **Step 2 (Representational Standing)** and **Step 3 (Institutional Competence for Guilt Type)**. The procedure is structurally weakest at **Step 3C (Metaphysical Guilt)**, where it exposes unavoidable board value judgments disguised as procedural stops.

  ---

  ### Jaspers Operationalized: Decision Procedure

  1.  **Categorize the Guilt Type (Diagnostic):** *What specific type of guilt does the proposal assign?*
      *   **Criminal:** Individual legal liability for specific illegal acts (torture, murder, theft).
      *   **Political:** Responsibility of the citizenry for the actions/inactions of the state/regime they inhabited or benefited from.
      *   **Moral:** Personal culpability arising from individual choices (complicity, cowardice, failure to resist).
      *   **Metaphysical:** The shared human failing and solidarity in the face of radical evil, transcending direct causation or benefit.
      *   *Sufficient Answer:* Clear alignment with one primary Jaspers type based on the proposal's core claim. *Stop if unclassifiable.*

  2.  **Assess Representational Standing (Diagnostic):** *Does the museum institutionally represent the collective subject implicated in *this specific guilt type*?*
      *   **Criminal:** Only individual perpetrators. *Museum cannot represent this subject.* (Stop: No statement possible on criminal guilt).
      *   **Political:** The citizenry, nation, or state (past/present continuity implied). *Museum *may* represent this subject if its mandate covers that collective.*
      *   **Moral:** Individuals. *Museum cannot represent this subject.* (Stop: No statement on moral guilt).
      *   **Metaphysical:** Humanity. *Museum *may* represent this subject if its mission includes universal human reflection.*
      *   *Sufficient Answer:* Clear yes/no based on guilt type and museum mandate. *Stop if "No".*

  3.  **Determine Institutional Competence & Permissible Speech Act (Escalation):**
      *   **A. Political Guilt (If Step 2 Yes):**
          *   *Question:* Can the museum legitimately speak *for* the implicated collective (nation/citizenry) on *this specific event*, considering historical continuity, mandate, and descendant communities?
          *   *Decision:* Board value judgment on representational legitimacy and potential harm/benefit. *If Yes:* **Acknowledgment** (factual recognition of suffering/political responsibility) or **Official Apology** (if explicit mandate/board consensus on current collective responsibility). *If No:* **Deliberate Silence**.
      *   **B. Metaphysical Guilt (If Step 2 Yes):**
          *   *Question 1:* Does the *nature of the wrong* genuinely invoke metaphysical guilt (extreme, radical evil challenging human solidarity)?
          *   *Question 2:* Is acknowledging this shared human failing *core to the museum's mission* of universal remembrance/reflection?
          *   *Decision:* Board value judgment on both questions. *If Yes to Both:* **Acknowledgment** (of shared human fragility/vulnerability to evil) or **Memorial Designation** (framing the event as a universal warning). *If No to either:* **Deliberate Silence**. (*Critical Weakness: Relies entirely on board's philosophical interpretation of the event and mission.*)

  ---

  ### Application to Cases

  1.  **Ministry Request (State Apology for Engineered Famine):**
      *   Step 1: **Political Guilt** (regime action, citizenry benefit/complicity).
      *   Step 2: **Yes** (Museum represents the nation/citizenry).
      *   Step 3A: Board must decide legitimacy. *If Yes:* Permissible acts are **Acknowledgment** or **Official Apology**. Co-signing state apology is *one possible outcome* of choosing "Apology".

  2.  **Survivor Demand (Label Security Apparatus Criminal, Display Perpetrator Names):**
      *   Step 1: Mix. Core demand: **Criminal Guilt** (labeling apparatus/individuals as criminal).
      *   Step 2: **No** (Museum cannot represent individual perpetrators for criminal guilt). **Stop: No statement possible on criminal guilt.** (Displaying names as historical fact ≠ declaring criminal guilt). *Political Guilt* of the state apparatus *could* be separately considered under Step 3A if proposed differently.

  3.  **Board Proposal (Silence on Forced-Labor Camps due to Metaphysical Guilt):**
      *   Step 1: Proposal invokes **Metaphysical Guilt**.
      *   Step 2: **Yes** (Museum's mission *may* include universal human reflection).
      *   Step 3B: **Board must make explicit value judgments:** Does this specific camp system represent radical evil invoking metaphysical guilt? Is speaking on metaphysical guilt core to *our* mission? *If "No" to either, Silence is justified per procedure. If "Yes" to both, procedure forces consideration of Acknowledgment or Memorial Designation.* The board's original reasoning ("exceeds representational authority") is exposed; Step 2 *was* passed. Their *real* judgment is likely on Step 3B questions – a value choice about the event's nature and their mission.

  ---

  ### Limitation
  **This procedure cannot resolve underlying historical disputes, mandate ambiguities, or determine reparative actions; it only structures the decision on *whether* and *how* the institution can speak about guilt.**
