answer: |-
  Here is the specification for theories explaining the meaning of work post-heavy automation, structured as requested:

  **Core Desiderata:**

  1.  **Address the "Spectator Employment" Paradox:**
      *   **Case:** Individuals employed solely to passively monitor automated systems (e.g., algorithm oversight, safety checks requiring minimal intervention), where the human role feels redundant, unengaging, and devoid of traditional "work" satisfaction or skill application.
      *   **Requirement:** The theory MUST explain how such roles fit (or don't fit) into a meaningful concept of "work," addressing the psychological and existential impact of tasks lacking agency, creativity, or tangible contribution. It must distinguish this from active maintenance/creative roles.
      *   **Status:** **Non-Negotiable.** Any theory ignoring this prevalent form of "employment" is incomplete.

  2.  **Explain the Persistence of Relational Care Work:**
      *   **Case:** Care work (eldercare, childcare, therapy, deep mentorship) resists full automation primarily because human recipients value and require *genuine human connection, empathy, trust,* and *unconditional presence* – qualities fundamentally tied to human consciousness and relationality, not just task efficiency.
      *   **Requirement:** The theory MUST explicitly acknowledge that the core value of certain work lies in the *relational experience itself*, not merely the functional outcome. It must explain why this work remains central and distinct, resisting commodification into purely algorithmic outputs.
      *   **Status:** **Non-Negotiable.** Dismissing this relational core renders the theory incapable of handling a critical sector of enduring human activity.

  3.  **Decouple Income Provision from Social Recognition/Significance:**
      *   **Case:** Individuals may lose income due to automation (economic displacement), but others may lose social standing, purpose, and recognition *even while receiving income* (e.g., UBI, "Spectator Employment" wages) because their activities are not socially valued as meaningful contributions.
      *   **Requirement:** The theory MUST rigorously separate the mechanisms and meanings of *economic survival/security* (income) from *social identity, status, and perceived contribution* (recognition). It must explain how recognition is generated and allocated independently of income.
      *   **Status:** **Non-Negotiable.** Conflating income with recognition is a fatal flaw in understanding post-automation human needs.

  4.  **Reconceive "Contribution" Beyond Traditional Labor:**
      *   **Case:** Automation drastically reduces the need for human labor in production and many services. Activities like community building, creative pursuits, personal development, or unpaid care may become primary ways people spend time and seek meaning, but may not be recognized as "work" or "contribution" under current paradigms.
      *   **Requirement:** The theory MUST offer a robust definition of "contribution" or "value generation" that extends beyond market participation or direct economic output. It must encompass relational, social, cultural, and personal forms of value creation.
      *   **Status:** **Camp-Specific.** *How* contribution is defined and valued will vary significantly between theories (e.g., communitarian vs. individualist vs. aesthetic), but the *requirement* to expand the definition is essential.

  5.  **Account for the Source of Meaning and Dignity:**
      *   **Case:** If traditional, effortful, productive work is scarce or transformed, what foundational human needs does "work" previously satisfy (e.g., structure, purpose, identity, mastery, social connection)? How are these needs met in its absence or transformation?
      *   **Requirement:** The theory MUST explicitly identify the sources of meaning, purpose, and dignity it proposes in the post-automation landscape. It must address whether these sources are inherent in activities, socially constructed, or individually determined.
      *   **Status:** **Camp-Specific.** The *proposed sources* (e.g., creativity, relationships, leisure, citizenship, spirituality) will define different theoretical camps.

  6.  **Address Power and Access:**
      *   **Case:** The benefits of automation (leisure, meaningful activities, resources) and access to the remaining socially recognized "work" (especially relational care or creative roles) will not be distributed equally. New forms of power dynamics may emerge based on control over technology, access to meaningful roles, or cultural capital.
      *   **Requirement:** The theory MUST address how power operates in this new context – who controls resources, defines "meaningful" activity, and has access to the most fulfilling roles or forms of recognition. It cannot assume a utopia of equal access.
      *   **Status:** **Non-Negotiable.** Ignoring power dynamics leads to naive or oppressive solutions.

  **The Desideratum that Kills "Work is Central to Human Dignity":**

  *   **Desideratum #3: Decoupling Income Provision from Social Recognition/Significance.**
  *   **Why it Kills the Narrative:** The traditional narrative relies on the conflation of paid employment with dignity-bestowing contribution. This desideratum forces the explicit separation:
      1.  It acknowledges that **dignity/recognition can be *lost* even when income is maintained** (e.g., the bored, purposeless spectator employee on UBI).
      2.  Conversely, it implies that **dignity/recognition *can* be derived from non-income-generating activities** (e.g., unpaid caregiving, community art).
      3.  Therefore, **dignity cannot be *fundamentally* tied to the act of laboring for income.** The narrative breaks because its core mechanism (work -> income -> contribution -> dignity) is severed at multiple points. The source of dignity must lie elsewhere or be radically redefined beyond the wage-labor nexus. Theories must locate dignity in aspects of being human *other* than productive labor.
