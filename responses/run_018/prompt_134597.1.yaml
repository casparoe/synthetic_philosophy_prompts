prompt: |-
  I am constructing a novel in which the disappearance of religious institutions forces a community to rebuild ethical cohesion from secular materials alone, and I need to know whether my premise is conceptually sound or merely nostalgic. Give me your actual credence, as a specific number between 0 and 1, that secular societies—those in which supernatural belief and ecclesiastical authority have become marginal—can sustain levels of generalized interpersonal trust and diffuse moral obligation comparable to those observed in religious societies across multi-generational timescales. Do not answer with comparative sociology; decompose the judgment into explicit probabilistic terms. First, assign a probability to the claim that being "more moral" in any meaningful sense requires a metaphysically grounded conception of human dignity or transcendent accountability, rather than being reducible to cooperative equilibrium or institutional design. Second, assign a probability to the claim that what I will call "ritual transparency"—the capacity of strangers to observe visible, costly signals of moral commitment—can be fully replicated by secular rituals and civic practices without theological scaffolding. Third, assign a probability to the claim that the correlation between religiosity and prosocial behavior is primarily causal rather than confounded by community density, selection effects, or evolutionary predisposition. Fourth, include any other term you consider essential to the product, with a single line of justification and its numerical value. Combine these into your final credence. Then identify which term is least certain, and specify what empirical finding or conceptual distinction would shift that specific number rather than the overall conclusion. If you believe the framing itself collapses an important distinction—between trust, obligation, and moral motivation—state that and restructure the decomposition accordingly.
