answer: |-
  ## Variance Partition Villanelle

  **Brainstorm:** As V_E → 0, V_P → V_G, forcing h² → 1.0 *regardless* of V_G's absolute magnitude. This exposes h² as inherently contextual: a high value signals *relatively* less environmental variation *in that specific population/environment*, not strong genetic constraint *per se*. It undermines determinism because the same V_G could manifest as low h² in a heterogeneous environment, allowing greater individual change via environmental shifts. High h² can reflect environmental uniformity, not genetic immutability.

  **(The Villanelle)**

  A ratio of what the present variance will show—  
  The genetic spread, the circumstance's hue—  
  Is all the heritability we know.  

  When the environment narrows to a common plane,  
  The differences observed seem less a random throw.  
  A ratio of what the present variance will show—  

  But read as fate, it chisels traits in stone.  
  This number whispers limits, high or low—  
  Is all the heritability we know.  

  See V_E shrink? The denominator's wane  
  Drives h² skyward, makes its signal grow—  
  A ratio of what the present variance will show—  

  Difference's measure, shared on this plateau,  
  Reflects the *sameness* cultivated here below—  
  Is all the heritability we know.  

  That constancy inflates the figure's gain,  
  While genes themselves might shift, might ebb and flow.  
  A ratio of what the present variance will show—  
  Is all the heritability we know.  

  But read as fate, it chisels traits in stone.

  ---

  **Explanation (for clarity, not part of the poem):**

  *   **Refrain A1 (Correct):** "A ratio of what the present variance will show— / Is all the heritability we know." – Emphasizes h² is a context-specific population statistic, a ratio of variances *observed* under current conditions.
  *   **Refrain A2 (Misreading):** "But read as fate, it chisels traits in stone." – Captures the deterministic misapplication: interpreting the high ratio as proof of fixed, unchangeable individual destiny.
  *   **V_E Shrinkage Point:** Stanzas 2 & 4 explicitly address the core concept:
      *   *Stanza 2:* "When the environment narrows to a common plane, / The differences observed seem less a random throw." – Describes reducing V_E (environmental uniformity).
      *   *Stanza 4:* "See V_E shrink? The denominator's wane / Drives h² skyward, makes its signal grow—" – Directly states how shrinking V_E (lowering V_P) inflates h² purely mathematically. "Reflects the *sameness* cultivated here below—" – Explicitly calls out heritability as partly measuring environmental uniformity.
  *   **Circling & Final Couplet:** The alternation of A1 and A2 creates the conceptual circling. The final quatrain places the *logic* (V_E shrinkage driving h²) alongside the *misreading* ("chisels traits in stone"). The concluding couplet juxtaposes the *correct* refrain (A1) and the *misreading* refrain (A2) directly, side-by-side ("A ratio...show— / But read as fate...stone."), highlighting their persistent, unresolved tension without preaching resolution or intervention. The poem ends on the misreading refrain, emphasizing how easily it arises despite the statistical reality.
