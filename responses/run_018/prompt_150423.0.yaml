answer: |-
  The phrase "revolutions devour their children" is a powerful metaphor (attributed to French revolutionary Vergniaud), but its *interpretation* in your debate determines whether it's a substantive argument or a platitude. Let's break down your four readings, assess their depth, and evaluate how they relate to **inevitability vs. contingency** regarding the Terror:

  ---

  ### The Menu of Readings

  1.  **The Banal Power-Struggle Reading:**
      *   **Claim:** Revolutions create power vacuums and factional infighting. Early leaders (the "children") are often eliminated by rivals or more radical successors in the struggle to control the new regime.
      *   **Substance:** **Platitude.** This is a near-universal observation about violent political upheavals throughout history (Roman proscriptions, Stalin's purges, etc.). It describes a common *pattern* but offers no *specific explanation* for *why* it happened *this intensely* during the Terror.
      *   **Inevitability vs. Contingency:** **Weakly supports inevitability** *only* in the broadest sense that power struggles happen. It doesn't argue the *scale* or *form* (e.g., systematized state terror) of the "devouring" was inevitable in France. It could easily coexist with contingency – the *particular* losers were contingent.

  2.  **The Marxist Class Conflict Reading:**
      *   **Claim:** The revolution unleashed conflicting class forces (bourgeoisie vs. sans-culottes, urban vs. rural). The Terror, particularly its radical phase, represents the bourgeoisie's attempt to both harness and then suppress the more radical popular movement (the "children" who pushed further than the original bourgeois leaders intended) to consolidate their own power and property relations. The violence was inherent in resolving these contradictions.
      *   **Substance:** **Substantive.** This grounds the "devouring" in a specific socio-economic analysis (property relations, class interests). It offers a structural *reason* for the conflict beyond mere ambition.
      *   **Inevitability vs. Contingency:** **Strongly supports inevitability.** It posits that the class dynamics unleashed by the bourgeois revolution *necessarily* led to violent conflict between the moderate and radical wings. The Terror becomes a functional outcome of unresolved class struggle. Contingency plays a role only in *who* specifically was devoured and *exactly when*, not the *fact* of the conflict.

  3.  **The Ideological (Rousseauian General Will) Reading:**
      *   **Claim:** The revolutionary ideology, heavily influenced by Rousseau's concept of the indivisible, infallible "General Will," created a logic of purity and suspicion. Anyone perceived as deviating from the true revolutionary path became an "enemy of the people" threatening the revolution's survival. "Devouring" children (former comrades) becomes rationalized as necessary purgation to maintain revolutionary virtue and unity against internal and external threats.
      *   **Substance:** **Substantive.** This focuses on the *ideological driver* of the violence. It explains the *justification* and *escalating logic* of the purges (e.g., Law of Suspects, Law of 22 Prairial).
      *   **Inevitability vs. Contingency:** **Leans towards inevitability within the ideological framework.** Once the logic of the General Will and the equation of dissent with treason took hold, the *tendency* towards purges becomes hard to avoid. However, the *intensity* and *targeting* might be seen as contingent on specific actors (Robespierre's personality) and events (military defeats, revolts). It argues the *logic* made violence likely, perhaps even structurally inherent to *this specific* revolutionary ideology.

  4.  **The Contingent Paranoia & Circumstance Reading:**
      *   **Claim:** The Terror wasn't structurally inevitable but resulted from a confluence of contingent factors: the extreme external pressure of war on multiple fronts, internal counter-revolutionary revolts (Vendée), economic crisis, the personal ambitions and paranoia of key figures (Robespierre, Saint-Just), factional rivalries spiraling out of control, and a series of poor decisions made under immense stress. The "children" were devoured due to bad luck, misjudgment, and escalating fear.
      *   **Substance:** **Substantive.** This focuses on specific, unpredictable historical events and human agency. It emphasizes the role of panic, miscalculation, and the radicalizing impact of immediate crises.
      *   **Inevitability vs. Contingency:** **Strongly supports contingency.** It argues the Terror, especially its most extreme phases, was *not* a necessary outcome of the revolution itself. Different decisions (e.g., avoiding war in 1792, a different composition of the Committee of Public Safety), different personalities, or slightly better circumstances could have led to a less violent consolidation without systematic Terror.

  ---

  ### Does the Slogan Do Real Work for Contingency? Does it Smuggle in Determinism?

  *   **The Slogan's Natural Bent:** The metaphor "devour" is inherently deterministic *in tone*. It suggests an almost biological, cyclical, or natural process – revolutions have an inherent, predictable tendency to destroy their creators. This *language* leans heavily towards inevitability.
  *   **Using it for Contingency (Reading 4):** It *is* possible to use the slogan within a contingency framework. You could say: "Yes, revolutions *often* devour their children, as this case tragically shows, but this specific devouring was caused by contingent factors X, Y, Z, not an unavoidable law. It *happened*, but it didn't *have* to happen this way." Here, the slogan acts as a descriptive observation of the *outcome*, not an explanation of its inevitability.
  *   **The Smuggling Risk:** However, **the slogan overwhelmingly risks smuggling in determinism.** Its dramatic, metaphorical power comes from implying an inherent, tragic flaw *within revolutions themselves*. Using it, especially to "shut down debate," typically relies on this deterministic subtext: "This always happens, it's inevitable, stop questioning it." It discourages examining the specific, contingent causes that Reading 4 emphasizes.
  *   **Does it do "real work" for contingency?** Minimally and inefficiently. To use it for contingency, you immediately have to *qualify* and *weaken* the slogan's core implication. It's far more effective for defending contingency to ditch the slogan and focus directly on the specific historical contingencies (war, personalities, decisions) that led to the Terror, *without* invoking a phrase that implies an iron law.

  ---

  ### Conclusion & Advice

  1.  **Platitude vs. Substantive:** Reading 1 is the platitude. Readings 2, 3, and 4 are substantive interpretations offering distinct explanations (class conflict, ideological logic, contingent crises/personalities).
  2.  **Inevitability vs. Contingency:**
      *   **Inevitability:** Readings 2 (Marxist) and 3 (Ideological) provide strong, structurally deterministic arguments for why violence/purges were likely or necessary. Reading 1 weakly implies inevitability through generality.
      *   **Contingency:** Reading 4 provides a clear argument against inevitability, emphasizing specific historical causes.
  3.  **The Slogan's Role:** While *possible* to force it into a contingency argument (Reading 4), the phrase "revolutions devour their children" **inherently carries a deterministic weight and is most naturally used (or weaponized, as in your seminar) to imply inevitability.** Its dramatic metaphor overshadows nuance. To effectively defend contingency, **move beyond the slogan.** Focus on the specific, contingent pressures (war, revolt, economic collapse), the agency of individuals and factions, and the points where different choices *could* have been made. The slogan is a rhetorical flourish, not a rigorous analytical tool, and its deterministic overtones make it a poor fit for arguing contingency.

  Your seminar colleague likely invoked the slogan precisely *because* its deterministic vibe shuts down debate. Counter them by exposing the *different readings* and insisting that only a close analysis of the *specific historical circumstances* (favoring Reading 4) can answer the question of inevitability, not a vague, fatalistic proverb.
