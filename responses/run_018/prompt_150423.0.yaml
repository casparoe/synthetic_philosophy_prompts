  Okay, the user is in a history seminar where someone used the phrase "revolutions devour their children" to shut down a debate about whether the Terror during the French Revolution was structurally inevitable. They want to unpack what that phrase could actually mean and whether it supports inevitability or contingency. I need to break this down carefully.

  First, I recall that the phrase "revolutions devour their children" is often attributed to Vergniaud, a Girondin during the French Revolution. It's a dramatic way of saying that the leaders of a revolution often end up being destroyed by the very forces they helped unleash. But the user wants to know if this is just a catchy slogan or if it has substantive meaning in their debate about inevitability.

  The user presents four possible interpretations: (1) a banal point about power struggles in regime changes, (2) a Marxist claim about class conflict, (3) an ideological thesis based on Rousseau's general will, or (4) a contingent story about paranoid Jacobins. I need to evaluate each of these for their substance and whether they lean towards inevitability or contingency.

  Starting with interpretation 1: this is the banal view. Every revolution has factions vying for power, leading to purges. It's platitudinous because it's so general—it happens in almost any power vacuum. This doesn't really argue for inevitability; it's more observational. The phrase here doesn't do much work beyond stating the obvious.

  Interpretation 2: the Marxist angle. Here, the bourgeoisie might start the revolution but then clash with the radical sans-culottes. The violence is seen as inevitable due to class dynamics. This is substantive because it's rooted in a theoretical framework. It strongly supports inevitability—class conflict drives the process deterministically.

  Interpretation 3: the ideological view tied to Rousseau. The concept of the general will requires purity, leading to constant purges. This is also substantive as it's based on revolutionary ideology. It suggests inevitability because the logic of the ideology itself demands self-purging.

  Interpretation 4: the contingent story. This focuses on specific events and personalities—like Robespierre's paranoia or external pressures like war. It's substantive because it highlights unique historical circumstances. This supports contingency, arguing that the Terror wasn't inevitable but resulted from specific choices and luck.

  Now, the user also asks if the slogan can support contingency without smuggling in determinism. In interpretation 4, it can, but it's tricky. The phrase "devour" implies a certain predictability, which might subtly suggest inevitability. So while it's possible to use it for contingency, the metaphor itself leans towards a deterministic view.

  The user's deeper need seems to be about understanding whether historical events are predetermined or shaped by chance and choices. They might want to counter the other student's shutdown move by showing that the slogan isn't a definitive argument for inevitability. They need a nuanced analysis to reopen the debate.

