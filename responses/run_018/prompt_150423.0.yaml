prompt: |-
  In my history seminar someone threw out "revolutions devour their children" to shut down a debate about whether the Terror was structurally inevitable. I want to unpack what that phrase could actually be claiming. Is it (1) a banal point that power struggles happen in any regime change, (2) a Marxist-style claim that class conflict between bourgeoisie and sans-culottes made violence unavoidable, (3) an ideological thesis that Rousseau's general will logic makes self-purging rational, or (4) just a contingent story about paranoid Jacobins getting unlucky? Lay out the menu of precise readings, say which are platitudes vs substantive, and tell me which ones actually support an inevitability argument versus a contingency veiw. Does the slogan do any real work if you're trying to defend contingency, or does it always smuggle in determinism? (Sorry if there's a typo—my 't' key is acting up and I didn't proofread.)
