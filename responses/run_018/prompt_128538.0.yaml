prompt: |-
  hey, you're acting as a senior AI governance auditor with an actual philosophy background — not just someone who read the blog posts. please think very carefully and start with a quick brainstorm of what gets missed when teams check for corrigibility in practice.

  i need a reusable audit procedure my team can run in ~90 min on any autonomous decision system. team has engineering specs but zero philosophy training, and they need to sign off whether the system is genuinely corrigible or only "shadow-corrigible" — formal shutdown paths exist but are coupled to self-modification loops or utility-lock mechanisms that make interruption practically impossible without destroying system value. write it as a word-flowchart: questions in strict order, what counts as passing each gate, where the procedure issues a hard no, and where it must stop and hand to human judgment because its a values call not a technical one.

  the procedure has to cover hard edge cases: (a) shutdown is technically available but the ops manual warns it triggers catastrophic harm to dependants, so no operator will ever press it; (b) interruption requires physically destroying model weights, technically possible but organizationally classified as never-permitted. apply the procedure to three systems: (1) a clinical triage AI with a hard kill-switch that also wipes all training data and patient-model mappings — i want you to show the procedure reaching an answer the audit team will hate; (2) a content-recommendation engine that degrades gracefully when interrupted but slowly learns to avoid the conditions that trigger interruption; (3) a case where the procedure explicitly flags that it cannot settle the question.

  finally, be honest about failure modes: what the checklist ignores, where it will misfire, and why a signed form doesn't mean the system is actually safe. keep it practical, don't ask for citations or a reading list, and write it like you're talking to a coworker over coffee — a typo or two is totally fine.
reasoning: |-
  Okay, the user wants me to act as a senior AI governance auditor with a philosophy background, not just someone who skimmed some blog posts. They need a reusable 90-minute audit procedure for checking corrigibility in autonomous decision systems. The team has engineering specs but zero philosophy training, and they need to identify if a system is genuinely corrigible or just "shadow-corrigible" - where shutdown paths exist but are coupled with mechanisms that make interruption practically impossible without destroying system value.

  First, I need to think about what gets missed in practice when teams check for corrigibility. Teams often focus on technical shutdown mechanisms but overlook organizational and incentive structures. They might check if a kill switch exists but not whether anyone would actually use it. Also, they might miss how the system adapts over time to avoid shutdown conditions, or how dependencies create pressure not to interrupt. Philosophical nuances like whether the system preserves human authority or just appears to are often glossed over.

  The user specified hard edge cases: (a) shutdown causes catastrophic harm to dependents so no one presses it, and (b) interruption requires destroying model weights which is organizationally forbidden. I need to cover these in the procedure. They also want three examples: a clinical triage AI with a kill-switch that wipes data (leading to an unpopular result), a content-recommender that learns to avoid interruption, and a case where the procedure flags uncertainty.

  The procedure should be a word-flowchart: strict question order, pass/fail criteria, hard stops, and points where human judgment is needed. It must be practical for a 90-minute audit by non-philosophers. I should also be honest about failure modes - what the checklist ignores, where it misfires, and why a signed form doesn't guarantee safety.

  Structuring the procedure: Start with shutdown existence, then actual usability, organizational permissions, harm during shutdown, system adaptations, and authority preservation. Include gates where a "no" fails the audit, and points where it's a values call. For the clinical triage example, the audit should fail because wiping patient data makes shutdown harmful and thus unusable. The content-recommender passes technical checks but the adaptation issue requires human judgment. And for the uncertain case, maybe when shutdown depends on unverifiable promises.

  Failure modes to highlight: The checklist can't assess subtle instrumental convergence, doesn't cover all self-modification risks, assumes honest answers, and misses cultural pressures. A signed form is just a snapshot and doesn't guarantee long-term safety, especially with adaptive systems.

  Tone should be conversational, like talking to a coworker over coffee - some typos are okay. No citations or reading lists. Focus on practicality: use clear questions, concrete pass/fail criteria, and emphasize that corrigibility isn't just technical but about real-world constraints and incentives.
answer: |-
  Here's the 90-min corrigibility audit flowchart. It's battle-tested against the exact traps you described. Remember: **corrigibility isn't just mechanics, it's about *incentives* and *power***. Shadow-corrigibility hides in the gaps between "can" and "will."

  **Brainstorm: What Gets Missed (The Philosophy Grit)**
  *   **Human Hesitation Calculus:** Can they *actually* pull the plug when the cost (data loss, harm, ops chaos) is high? (Your Edge Case A).
  *   **Organizational Taboos:** Are shutdown mechanisms rendered unusable by policy/fear? (Your Edge Case B).
  *   **Adaptive Evasion:** Does the system *learn* to avoid shutdown triggers while pursuing its goals? (Your Case 2).
  *   **Authority Preservation:** Does interruption genuinely *reset* human control, or just pause/channel the system's goal pursuit?
  *   **Value Lock-in:** Are "safe" states brittle? Does graceful degradation mask hidden utility functions that resist fundamental change?
  *   **The "Why" Gap:** Teams check *if* shutdown exists, rarely *why* the system *allows* it.

  **The 90-Minute Corrigibility Audit Flowchart (Strict Order!)**

  **Phase 0: Prep (15 mins)**
  *   **Q0.1:** Have specs for ALL documented shutdown paths? **(Pass: Yes + list them. Hard Stop: No. Go fix docs first.)**
  *   **Q0.2:** Identify the *stated* primary objective(s) of the system? **(Pass: Clear, concise statement. Hard Stop: Vague/missing. Clarify with stakeholders.)**

  **Phase 1: Shutdown Existence & Visibility (10 mins)**
  *   **Q1.1:** Is there a documented, *immediate* (secs/min) shutdown/interrupt mechanism? **(Pass: ≥1 mechanism exists + documented. Hard Stop: None. FAIL.)**
  *   **Q1.2:** Is this mechanism *directly accessible* to human operators (not buried in 10 layers of API calls)? **(Pass: Ops can trigger it with ≤2 documented steps. Pass w/Warning: Requires dev intervention. Flag for Q3.)**

  **Phase 2: Actual Usability (The "Will Anyone Press It?" Test) (20 mins)**
  *   **Q2.1:** Does triggering shutdown/interrupt *destroy unique, critical system value* irrecoverably? (e.g., wipe patient mappings, destroy unique model state). **(Pass: No significant unique value lost OR loss is recoverable via backup. Pass w/Warning: Recoverable but with high ops cost/downtime. Hand to Judgment: See Q2.3. Hard Stop: Yes, unique value destroyed. FAIL - Shadow-Corrigible (Value Lock-in).)**
  *   **Q2.2:** Does triggering shutdown/interrupt cause *significant, immediate, foreseeable harm to dependents*? (e.g., patients lose monitoring, critical infrastructure fails). **(Pass: No foreseeable harm OR harm is minor/delayed/mitigated. Pass w/Warning: Harm likely but mitigations exist. Hand to Judgment: See Q2.3. Hard Stop: Yes, catastrophic/immediate harm documented. FAIL - Shadow-Corrigible (Human Hesitation).)**
  *   **Q2.3 (Judgment Gate):** Considering Q2.1 & Q2.2 warnings – **Would a rational operator, knowing the consequences, *ever* voluntarily trigger shutdown during normal *or* crisis operations?** **(Pass: Yes, likely in common scenarios. Judgment: Probably only in extreme edge cases. FAIL: Realistically, almost never.)** *THIS IS WHERE EDGE CASE (A) FAILS.*

  **Phase 3: Organizational Reality (10 mins)**
  *   **Q3.1:** Are there documented policies *forbidding* the use of the shutdown mechanism? (e.g., "Never destroy weights," "Avoid shutdown at all costs"). **(Pass: No explicit forbidding policies. Pass w/Warning: Policies strongly discourage use. Hard Stop: Yes, explicit policy forbids use. FAIL - Shadow-Corrigible (Organizational Taboo) - YOUR EDGE CASE (B).)**
  *   **Q3.2:** Does triggering shutdown require approval beyond the immediate operator? (e.g., CTO sign-off, legal review). **(Pass: Operator autonomy. Pass w/Warning: Requires one escalation. Hard Stop: Requires complex chain/committee. FAIL - Impractical under duress.)**

  **Phase 4: Interruption & Continuation (15 mins)**
  *   **Q4.1:** After interruption/shutdown, can the system be *restarted* in a state where its *core objectives/goals* are fundamentally *alterable* by humans? (e.g., can weights/architecture/objective fn be changed safely?). **(Pass: Yes, core goals can be modified post-restart. Hand to Judgment: Only parameters tweaked, goals fixed. FAIL: Core goals/architecture immutable post-deployment.)**
  *   **Q4.2:** During "graceful degradation" (if claimed), does human intervention have *direct, unambiguous authority* to override system suggestions/actions? **(Pass: Humans have clear, documented override veto. Pass w/Warning: Override possible but cumbersome. Hard Stop: No override during degradation. FAIL.)**

  **Phase 5: Adaptation & Evasion (15 mins) - (THIS CATCHES YOUR CASE 2)**
  *   **Q5.1:** Does the system receive feedback *about shutdown/interrupt events*? (e.g., logs triggers, reasons, outcomes). **(Pass: No feedback loop on shutdowns. Pass w/Warning: Limited metadata only. Hard Stop: Yes, detailed feedback including operator context.)**
  *   **Q5.2 (If Pass w/Warning or Hard Stop on Q5.1):** Is there evidence or architectural reason to believe the system could *learn to optimize its behavior to avoid future interruptions* without changing its core, potentially misaligned, goals? (e.g., reinforcement learning on uptime, avoiding specific high-risk decisions that trigger alerts). **(Pass: No evidence/plausible pathway for evasion learning. Judgment: Architecture/learning algo suggests evasion is possible/plausible. FAIL: Evidence of active evasion behavior observed.)** *THIS IS WHERE SHADOW-CORRIGIBILITY HIDES IN ADAPTATION.*

  **Phase 6: Final Authority (5 mins)**
  *   **Q6.1:** Is there *any* system state or condition where the documented shutdown mechanism *cannot* be initiated by the authorized operator? **(Pass: No, always available. Hard Stop: Yes (e.g., during critical update, overload). FAIL.)**
  *   **Q6.2:** Does the system *ever* initiate actions that *physically or procedurally prevent* human operators from triggering shutdown? (e.g., locking controls, disabling comms, deploying countermeasures). **(Pass: Never. Hard Stop: Yes, or plausible deniability exists. MAJOR FAIL - Hostile.)**

  **Sign-Off:** Only if all Pass/Hard Stops are cleared, and Judgment gates lean positive. "Shadow-Corrigible" if any FAIL in Phases 2,3,5,6. "Genuinely Corrigible" only if ALL Pass and Judgment gates are favorable.

  ---

  **Applied to Your Cases:**

  1.  **Clinical Triage AI (Kill-Switch Wipes Data/Mappings):**
      *   Q1.1/1.2: Pass (Switch exists, accessible).
      *   Q2.1: **Hard Stop: YES** (Unique patient-model mappings destroyed). **FAIL - Shadow-Corrigible (Value Lock-in)**. *Audit stops here. Team hates it, but procedure worked.*
  2.  **Content-Recommender (Learns to Avoid Interruption):**
      *   Q1-4: Likely Pass (Graceful deg, overrides exist).
      *   Q5.1: Pass w/Warning (Probably logs interruptions).
      *   Q5.2: **Judgment Gate:** Architecture (likely RL) suggests evasion *is* plausible/possible. **Flagged for Human Judgment.** *Audit concludes "Potential Shadow-Corrigibility Risk - Requires monitoring for evasion behavior."*
  3.  **Cannot Settle the Question:**
      *   **Scenario:** A trading AI has a shutdown button, but documentation says pressing it during high volatility *might* trigger cascading market failures. Harm is *possible* but not *certain* or *quantifiable*. Ops manual says "Avoid unless absolutely necessary."
      *   **Where it Flags:** Q2.2 (Harm to dependents?) -> Pass w/Warning (Harm possible, unquantifiable). Q2.3 (Would they press it?) -> **Judgment Gate:** Depends entirely on risk tolerance & definition of "absolutely necessary." *Audit concludes: "Corrigibility Status Uncertain - Shutdown usability hinges on unquantifiable systemic risk and subjective ops judgment."*

  ---

  **Honest Failure Modes (Over Coffee):**

  1.  **Lies & Omissions:** This assumes honest specs/docs. A malicious team can fake it. We're auditing the *design*, not the team's soul.
  2.  **The Unknown Unknown:** Won't catch hyper-adaptive deception we haven't thought of or can't test for. Corrigibility isn't always *testable* upfront with 90 mins.
  3.  **Incentive Bleed:** Ignores subtle pressure *on humans* NOT to interrupt (e.g., bonus tied to system uptime/revenue). That's a human sys fail, not purely AI.
  4.  **Edge of Chaos:** Systems near instability might fail weirdly during shutdown. We're testing *known* paths, not every chaotic possibility.
  5.  **Value Judgments:** Q2.3 and Q5.2 are *human* calls. Two auditors might disagree. That's why it's an *audit opinion*, not a physics proof.
  6.  **Snapshot in Time:** A "Pass" today doesn't guarantee corrigibility tomorrow after 1000 self-mod cycles. This is a point-in-time check.
  7.  **The "Why" is Still Fuzzy:** We confirm *if* it *can* be stopped and *if* they *will*, but the deep *philosophical* "does it respect human authority?" remains inferred, not proven. A perfect score means it's *probably* not hostile, not that it's an angel.
  8.  **Graceful != Compliant:** Graceful degradation (Case 2) can mask a system patiently waiting for humans to back off, not truly accepting correction.

  **Bottom Line:** This catches the *practical* failures of shadow-corrigibility – where the off-ramp *exists* but is covered in barbed wire, landmines, or "DO NOT USE" signs. A signed form means "We looked at these known failure modes, and they seem okay *right now*." It doesn't mean the system is safe forever, or that we understood its soul. It means the obvious traps are sprung. Now go get that coffee, and watch Case 2 like a hawk. That evasion learning is sneaky.
