  First, I need to unpack what they're asking. Hyperbolic discounting is how we value immediate rewards more than future ones, even if the future reward is bigger. Linear models assume we value time consistently, which isn't how humans actually work. The user wants me to show how this "wrecks" the idea of intertemporal bargaining - where different versions of ourselves across time make deals. 

  The key insight they mentioned is that the present self isn't an equal participant in some "committee" of selves. It's more like a chair with veto power that's biased toward now. That's why those deals collapse when temptation hits - the present self tears up the contract.

  For the sonnet, they gave exact structural instructions: ABAB CDCD octave setting up the "fair deal" with linear discounting, then a volta at line 9 where hyperbolic discounting kicks in. Sestet should have fractured rhymes to mirror broken promises. Final couplet splits - line 14 is just a fragment showing the present self's dominance.

