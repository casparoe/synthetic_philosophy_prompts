  First, I need to recall Pascal's actual arguments. The friend's summary has elements of truth but goes too far. Pascal does emphasize the role of custom in human justice and the necessity of force - that's accurate. The "reason of effects" concept (kings wearing robes etc.) is genuinely Pascalian too. 

  Where the friend errs is claiming Pascal sees justice as completely arbitrary or concludes we should drop pretenses. Pascal never says that. In fact, he argues the opposite - that maintaining the appearance of justice is crucial for stability. The "let the strongest rule openly" conclusion is a complete misinterpretation; Pascal would consider that disastrous.

  I should also note Pascal's theological angle: human justice is imperfect but points toward divine justice. The friend misses this entirely. And Pascal definitely wouldn't support raw power rule - he'd see that as the worst outcome.

