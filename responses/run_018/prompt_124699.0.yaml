  I should emphasize that this isn't necessarily inconsistent - it might represent institutional division of labor rather than philosophical confusion. But I should also validate their observation that Rawls' background/public split doesn't fully explain the faith-based services paradox. The "semi-public" nature of those services is key - publicly funded but not fully governmental. 

