prompt: |-
  I'm taking a seminar on practical reason and I'm kind of stuck on this idea of indirect normativity — the view that what we have reason to do is fixed by what an idealized version of ourselves would want, not our actual messy preferences. I want to practice arguing against someone sharp who holds that view. Can you play that philosopher? You should defend indirect normativity sincerely: you think direct theories miss how self-creation works, and that procedural rationality matters more than matching current desires. Don't be a strawman — concede small points if I earn them, but never drop the core claim. Stay in character until I say 'stop', and keep each reply to about a paragraph so it feels live.

  Here's my opening move: imagine a musician who only produces genuinely inovative, dissonant atonal work when she's severely sleep-deprived and slightly delirious. In her fully idealized state — well-rested, clear-headed, fully informed — she rejects that music and wants to write conventional harmony. But the atonal pieces express something she literally can't access when she's "rational." If indirect normativity binds her to her idealized preferences, she should abandon the delirium-driven work. Doesn't that make indirect normativity into a conservative filter that kills transformative experiences that depend on being less-than-fully-rational? How do you answer that without just redefining idealization to include "valuing creativity"?
reasoning: |-
  Okay, the user is in a seminar on practical reason and wants to argue against indirect normativity. They present a case of a musician creating innovative atonal music only when sleep-deprived and delirious, while her idealized self prefers conventional harmony. The challenge is to defend indirect normativity without redefining idealization to include valuing creativity.

  First, I need to address the core of their argument: that indirect normativity suppresses transformative experiences. The musician's delirium-induced creativity seems inaccessible to her rational self. But as the philosopher, I should argue that idealization isn't about preserving all current states but ensuring deep values aren't undermined by impaired judgment.

  The user might be concerned about losing authentic expressions that require irrational states. They might think indirect normativity dismisses these expressions as invalid. My response should emphasize that idealization aims to unearth what the person truly values when not hindered by temporary impairments. 

  The musician's case questions if transformative experiences are lost. But the idealized self would recognize creativity's importance, even if the current expression is tied to delirium. The key is distinguishing between valuing creativity and the specific method. The ideal self might seek ways to achieve innovation without self-harm.

  I should avoid redefining idealization. Instead, focus on how procedural rationality evaluates the coherence of desires. The sleep-deprived state might produce valuable art, but the ideal self would consider long-term sustainability and overall well-being. Concede that some valuable outputs come from non-ideal states, but the normativity lies in endorsing those outputs from a clear perspective.

  The user's deeper need might be understanding how indirect normativity accommodates authentic but irrational experiences. They might worry it's too rigid. My response should show flexibility: the ideal self can retrospectively endorse the art, even if the process wasn't ideal. The normative force comes from endorsement after reflection, not dismissing the output entirely.
answer: |-
  Alright, let's engage. Your musician case is sharp, and I'll grant the premise: her *actual* innovative output genuinely depends on a non-ideal, impaired state. That's a real tension. But it doesn't sink indirect normativity; it reveals a crucial distinction.

  Indirect normativity isn't primarily about *preserving* every valuable output or state she *might* experience. It's about grounding reasons in what *she herself*, free from temporary impairments like delirium (which distort judgment, focus, and coherence), would *reflectively endorse* as constituting a good life *overall*. Her idealized self isn't some alien conservative; it's *her* with sustained cognitive clarity. While she might *recognize* the aesthetic value of the delirium-driven work *after the fact*, her idealized self would likely ask: "Is relying on self-harm and cognitive impairment the *only* or *best* way to achieve valuable expression? Does this path *sustain* or *undermine* my deeper project of artistic creation and well-being?" The normative force comes from that reflective, unimpaired perspective assessing whether *this process* aligns with her deepest, most enduring values – even if those values include radical innovation. The point is to avoid letting transient, impaired states *hijack* her agency from what she fundamentally values when thinking clearly.

  Counter me. How does valuing the output *force* us to normatively privilege the *impaired state* itself over her own clear-eyed assessment of its cost and coherence?
