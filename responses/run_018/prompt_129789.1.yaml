  Okay, the user wants me to write a villanelle poem for their seminar closing about historical fiction and biopics. They're focusing on the ethical question of what we owe to the dead, particularly regarding artistic license. The key elements are two refrains: "you made my proof a love scene" representing the dead woman's accusation, and "the living need a story they can receive" as the director's defense.

  I need to create a specific scenario about an obscure 19th-century female logician whose technical breakthrough was solitary in reality, but the film gives her a romantic partner who supposedly "inspires" her insight. This creates tension between historical accuracy and narrative appeal. The poem should use the villanelle's repetitive structure to show how this argument remains unresolved, ending with both refrains standing together in a stalemate.

  The ethical dilemma should remain ambiguous - is the harm done to the deceased (posthumous harm) or to contemporary audiences who get a false understanding of how intellectual breakthroughs happen? I'll need to craft this carefully so that people familiar with academic debates about posthumous harm will recognize the nuances without needing citations.

  For the structure, I'll follow the traditional villanelle pattern: five tercets followed by a quatrain, with the first and third lines alternating as refrains. The refrains will be exactly as requested: "You made my proof a love scene" and "The living need a story they can receive." I'll make sure the final couplet presents both lines together to create that powerful stalemate effect.

  I'll create a character named Ada Craig, a logician whose solitary work on symbolic logic is transformed into a romantic narrative in the film. The imagery should contrast her actual process (midnight oil, ink-stained hands, quiet rooms) with the cinematic version (moonlit walks, shared glances). The language should feel authentic to both the 19th-century setting and contemporary ethical discourse.

  The challenge is maintaining that perfect balance where neither side clearly wins the argument - the dead woman's charge must feel legitimate while the director's defense also seems reasonable. The circling structure of the villanelle will help emphasize how this debate inevitably returns to the same points without resolution.
