  First, I need to lay out the explicit correspondences. The brain as an organization: lower-level units are like employees generating reports (prediction errors). Middle management filters these reports (precision weighting), and executives make decisions (conscious access). The organizational goal is minimizing free energy, akin to efficiency. 

