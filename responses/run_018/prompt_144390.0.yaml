  *   **Competitiveness = "Losing valuation," "First to slow down loses," "Look weak to investors."**  
  *   **Secret Desire = "Want safety rules/craving limits," "We all know it's dumb," "Begging for bedtime."**  
  *   **Humor:** Relatable metaphors (kids, Tesla bros, paperclips, chicken) make abstract ideas hit.  
