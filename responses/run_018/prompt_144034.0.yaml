answer: |-
  After successfully sorting molecules for hours to create a hot and cold side, Maxwell's demon proudly reviewed his meticulous records. He was about to reset for the next cycle when he froze, staring at his overflowing notebook. "I saved so much energy with this temperature gradient," he muttered, "but now I have to erase this data to make room..." His expression soured as he reached for an eraser. "At kT ln 2 per bit? Forget profit—this memory wipe just bankrupted me!"
