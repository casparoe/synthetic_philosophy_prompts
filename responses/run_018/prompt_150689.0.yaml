prompt: |-
  I'm defending a thesis on moral worth at next week's department colloquium, and I need a Q&A prep sheet. The view—which I arrived at after a recent personal crisis forced me to examine my own mixed motives—is that an action possesses full moral worth only if the agent's right-reason enjoys what I call "deliberative sovereignty": it must be structurally dominant in the agent's practical reasoning at the moment of choice, not merely present among other motives. I allow that self-interested reasons may be causally active, but they must be genuinely subordinated, not co-equal partners. The audience is a moral philosophy seminar with three Kantian purists, two virtue ethicists focused on character integration, an empirical moral psychologist, and a grad student working on moral luck. Give me the objections I will actually face, ordered by how damaging they are if I mishandle them, phrased in the vocabulary each camp would use, each with a concise reply and an explicit note on where that reply is weakest. Include separately the one objection I am hoping nobody asks. Lead with the single most lethal objection; keep the entire sheet under 350 words. Do not ask for readings, citations, or bibliographies.
reasoning: |-
  Okay, the user is preparing for a thesis defense on moral worth and needs a Q&A prep sheet. Their core argument is that an action has full moral worth only when the "right-reason" has "deliberative sovereignty" - meaning it must be structurally dominant in practical reasoning, not just one motive among others. Self-interested reasons can be present but must be genuinely subordinated. 

  Hmm, the audience composition is crucial here - three Kantian purists, two virtue ethicists, an empirical moral psychologist, and a moral luck grad student. Each camp will attack different vulnerabilities. 

  First, the Kantians will hate this. They'll see "deliberative sovereignty" as a dangerous concession - if mixed motives are allowed at all, even subordinated, it corrupts moral worth. That's absolutely the most lethal objection because it strikes at the heart of defending a non-pure Kantian view. My reply must stress structural dominance but admit it's weaker on purity - that'll hurt with this crowd.

  The virtue ethicists will pounce on the "moment of choice" focus. For them, moral worth lives in character, not isolated decisions. I'll counter by arguing sovereignty creates dispositions, but it's admittedly thin on longitudinal character development. 

  The psychologist will demand proof - how can we possibly measure "structural dominance" introspectively? I'll have to concede empirical testability while insisting on first-person authority. Risky move.

  Ah, the moral luck wildcard - what if circumstances force someone to act before deliberation completes? That's nasty because my whole framework assumes controlled decision moments. I'll need to bite the bullet on "non-ideal" cases.

  But the nightmare question... the one I hope nobody asks... is about self-deception. If sovereignty requires accurate self-knowledge of motive hierarchy, but we're terrible at that, does anyone ever have moral worth? Brutal. I'll have to invoke "good faith" criteria and pray.

  *checks word count* Need to keep this surgical - under 350 words. Prioritize lethality order, use each camp's jargon, expose reply weaknesses. No citations - they know the literature. Structure: lethal first, then descending threat level, nightmare last. 

  The virtue objection feels deceptively dangerous - character integration is so central to their view that dismissing it might alienate them completely. But Kantian purity challenge could sink the whole ship faster. Yes, Kantian first.
answer: |-
  Here is your Q&A prep sheet, prioritizing lethality and conciseness:

  **Most Lethal Objection (Kantian Purist):**  
  **O:** "You've smuggled in heteronomy! By allowing self-interest even as a *causally active* subordinate motive, you corrupt the purity of the good will. The categorical imperative demands duty *alone* must determine the will for moral worth; structural dominance is insufficient – mere presence of inclination negates worth."  
  **R:** True moral worth requires the *right-reason*'s structural dominance, ensuring it's the *determining ground*. Subordinated inclinations are *permitted effects*, not co-determining causes, preserving the will's autonomy via reason's sovereignty.  
  **Weakness:** Concedes non-rational motives are causally necessary, undermining strict Kantian purity.  

  **Virtue Ethicist Objection:**  
  **O:** "This hyper-focus on 'moment of choice' is atomistic. Moral worth resides in integrated character, not isolated acts of reasoning sovereignty. An agent with genuine virtue acts *from* a unified character where right reason *is* their interest; your 'subordination' implies a fragmented self."  
  **R:** Deliberative sovereignty *forges* character integration over time. Each sovereign choice reinforces the disposition where right-reason becomes primary, moving towards the unity you value.  
  **Weakness:** Under-specifies how sovereignty translates into stable character traits vs. being a one-off cognitive feat.  

  **Empirical Moral Psychologist Objection:**  
  **O:** "Your 'structural dominance' is empirically unverifiable. Introspection is unreliable; we constantly confabulate motives. How can agents (or observers) possibly know if a reason is 'structurally dominant' vs. merely post-hoc rationalization, especially with active subordinated motives?"  
  **R:** While challenging, we assess sovereignty via sincere deliberation reports and consistency in prioritizing right-reason across similar contexts, acknowledging it's a first-person practical commitment, not solely third-person data.  
  **Weakness:** Relies heavily on subjective, potentially inaccurate self-reports vulnerable to bias.  

  **Moral Luck Grad Student Objection:**  
  **O:** "What about circumstantial luck? If an agent *intends* sovereign deliberation but is interrupted by crisis, forcing a snap judgment where latent self-interest *feels* co-equal due to stress, does their otherwise-virtuous act lack moral worth?"  
  **R:** Moral worth assesses the reasoning structure *at the moment of choice as it occurs*. Non-ideal circumstances might prevent ideal sovereignty, but worth is judged on the actual reasoning structure deployed then.  
  **Weakness:** Risks making moral worth overly dependent on contingent, uncontrolled factors during the act.  

  **The Objection You Hope Nobody Asks:**  
  **O:** "Isn't 'deliberative sovereignty' just self-deception? If self-interest is causally active but requires 'genuine subordination,' how can the agent *know* the subordination is genuine and not merely a self-serving narrative masking co-dominance? Doesn't your view make moral worth unknowable?"  
  **R:** Genuine subordination is evidenced by the agent's readiness to act *against* the self-interested motive *for* the right-reason alone, even when costly, reflecting a deep commitment in practical identity.  
  **Weakness:** Still vulnerable to sophisticated self-deception and offers no foolproof criterion for distinguishing genuine from feigned subordination.  

