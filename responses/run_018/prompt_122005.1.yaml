  Opaque algorithms could be a new kind of domination. Mill worried about tyranny of the majority, but here it's a tyranny of technology. Workers might be subject to decisions they can't scrutinize, which clashes with Mill's emphasis on liberty through transparency and accountability.

  The user also highlights the lack of gradual reform. Mill preferred incremental changes to avoid upheaval. Introducing such a system suddenly might disrupt without the necessary cultural adaptation. Workers need to develop cooperative skills through practice, which algorithms might bypass.

