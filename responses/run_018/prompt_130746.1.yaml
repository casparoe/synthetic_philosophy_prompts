prompt: |-
  Hey, I've been thinking about blame and hypocrisy and there's this pattern I keep runing into but I dont know what to call it. Like, say my roommate complains that I'm leaving dishes in the sink, but I remember last week he told our other roommate it was fine when she did the same thing because she was stressed. Or another example: a politician calls out corruption in the other party, but earlier they voted against investigating corruption in thier own party. Its not just regular hypocrisy where you do the bad thing yourself — its more like you've already 'used up' your right to blame by letting the same thing slide for someone else. Is there a specific term for losing your credibility to call someone out, not because you're guilty of the exact same act, but because you've shown you're okay with the act in other cases? I know people talk about hypocrisy, but this feels different, like its about being inconsistent in applying the rule rather than breaking it yourself. Does this have a name, and if not, what should we call it? I want to know exactly where the edges are — like does it matter if you excused the other person for a good reason, or if you're just being lazy about calling people out?
reasoning: |-
  Okay, the user is describing a specific pattern of behavior where someone loses the moral authority to criticize others because they've previously excused the same behavior in different circumstances. They want to know if there's a term for this phenomenon and how to define its boundaries. 

  First, I need to unpack their examples to fully grasp the nuance. The roommate scenario shows selective enforcement of a rule based on personal bias (excusing one person due to stress but criticizing another). The politician example reveals partisan application of anti-corruption principles. Both cases share a core element: the critic isn't necessarily guilty of the act themselves but has compromised their standing by showing inconsistent judgment.

  The user is sharp to notice this isn't classic hypocrisy. Regular hypocrisy would be the roommate leaving dishes while complaining, or the politician engaging in corruption while denouncing it. Here, it's about the inconsistency in holding others accountable. 

  I'm mentally scanning through philosophical concepts... Ah, "tu quoque" comes close but usually addresses personal conduct. "Selective enforcement" fits procedurally but feels bureaucratic. "Double standard" is the strongest candidate—it directly describes applying principles unevenly. The legal term "arbitrary and capricious" adds weight but might be too technical. 

  The user's follow-up questions about boundaries are excellent. They're probing whether valid justifications negate the double standard (like genuinely excusing someone during a crisis), and whether passive tolerance (laziness) qualifies. This shows they're thinking critically about moral reasoning. 

  For the justification aspect: If the excused case had objectively different circumstances (real crisis vs. everyday laziness), it might not be a double standard—but the burden of proof would be on the person making the distinction. Regarding passivity: Consistently never enforcing a rule isn't a double standard; it's just negligence. The problem arises specifically when enforcement is inconsistent. 

  The user seems analytically minded—they want precise language to articulate this social observation. I'll emphasize "double standard" as the primary term but offer related concepts to enrich their understanding. Their examples were very clear, which tells me they've observed this pattern keenly in daily life and politics. Probably frustrated by unfair accusations!
answer: |-
  That's a **really sharp observation**, and you're right – this is distinct from simple hypocrisy. While hypocrisy is part of it, the core issue you're identifying is about **inconsistent application of standards or principles**, specifically where prior leniency undermines the moral authority to blame later.

  Here's the breakdown and the best terms:

  1.  **Selective Enforcement / Selective Outrage:** This is the most direct and common term for what you're describing. It means applying a rule, principle, or moral judgment inconsistently, based on factors like who committed the act, their relationship to you, the timing, or convenience, rather than the nature of the act itself.
      *   *Your examples:* Your roommate selectively enforces the "no dishes" rule (enforcing it on you, excusing your other roommate). The politician selectively enforces anti-corruption principles (applying them to the other party, shielding their own).
      *   *Key:* The *act* (leaving dishes, corruption) is judged differently based on *who* did it or *context* deemed relevant only by the enforcer.

  2.  **Double Standard:** This is a very close synonym and often used interchangeably with selective enforcement. It explicitly means having two different sets of principles or expectations for similar situations, especially when it benefits oneself or one's group.
      *   *Your examples:* Your roommate holds a double standard for dishwashing based on who leaves them. The politician holds a double standard for corruption investigations based on party affiliation.

  3.  **Hypocrisy (but specifically *Moral Hypocrisy* or *Inconsistency*):** While simple hypocrisy is "do as I say, not as I do," your scenario involves a *different kind* of hypocrisy: hypocrisy in the *application of judgment*, not necessarily the *commission of the act*. It's saying "This rule *must* apply to you" after having said (explicitly or implicitly) "This rule *doesn't* have to apply to them," when the situations are morally comparable. The hypocrisy lies in the inconsistent demand for accountability, not (necessarily) in performing the act yourself. "Moral hypocrisy" often encompasses this inconsistency in judgment.

  4.  **Loss of Moral Standing / Moral Authority:** This describes the *consequence* of selective enforcement or a double standard. When someone is exposed as applying rules inconsistently, they lose the credibility (moral standing) to credibly blame others for violating that same rule.
      *   *Why it fits:* Your roommate loses the moral authority to complain about *your* dishes because they showed the rule wasn't truly important when someone else broke it. The politician loses moral authority to decry the other party's corruption because they shielded their own.

  5.  **Arbitrary and Capricious (Legal/Formal Term):** This is used in administrative law to describe decision-making that is unpredictable, inconsistent, and lacking a rational basis. While more formal, it perfectly captures the *unreasoned inconsistency* at the heart of your examples.

  **Addressing Your Boundary Questions:**

  *   **Excusing for a "Good Reason":** This is crucial and defines whether it's truly a double standard/selective enforcement or a legitimate distinction.
      *   **Legitimate Distinction:** If the reason for excusing the first person is objectively, materially different and reasonably justifies leniency *in a way that wouldn't apply to the second person*, then it might not be a double standard. (e.g., Excusing dishes *once* for someone who just had a major crisis vs. routinely leaving them without reason; excusing a minor procedural error vs. a major ethical breach).
      *   **Illegitimate Distinction / Double Standard:** If the "good reason" is subjective, preferential, based on bias (like relationship, group affiliation), or applied inconsistently itself, then it becomes selective enforcement. (e.g., "Stress" only being an acceptable excuse for people the enforcer likes; defining "minor corruption" only for one's own party). The burden of proof shifts to the person applying the standard to demonstrate the distinction is fair and consistent.

  *   **Being Lazy About Calling People Out:** This is different.
      *   **Consistent Leniency/Negligence:** If someone *never* enforces a rule against *anyone*, they might be negligent or permissive, but it's not *selective* enforcement or a double standard. They are consistent (even if wrong).
      *   **Selective Laziness:** If someone is only "lazy" about enforcing the rule with certain people (friends, allies) but diligent about enforcing it against others (foes, outsiders), then it *is* selective enforcement/a double standard. The inconsistency based on the *target* is key.

  **In Summary:**

  *   **Best Term:** **Selective Enforcement** or **Double Standard**.
  *   **Core Concept:** **Inconsistent application of a rule, principle, or moral judgment**, especially when based on irrelevant factors like who committed the act or group affiliation, leading to a...
  *   **Consequence:** **Loss of Moral Standing / Moral Authority** to credibly blame someone for that same act.
  *   **Boundary:** It becomes a double standard when the **distinction used to excuse one person but not the other is illegitimate, biased, arbitrary, or inconsistently applied.** Consistent non-enforcement isn't a double standard; selective non-enforcement is. Justifications need to be objectively reasonable and consistently applied to avoid the charge.

  You've pinpointed a very common and corrosive pattern in interpersonal relationships, politics, and organizational dynamics. Naming it ("That's selective enforcement!" / "You're applying a double standard!") is the first step in calling it out effectively.
