prompt: |-
  I'm presenting at a workshop next month on epistemic humility in institutional design. The audience is mostly behavioral economists who run reference-class forecasting tournaments, philosophers of social science focused on the reference-class problem and self-locating belief, and a couple decision theorists; there are no institutional lawyers or policymakers in the room. I'm defending a thesis I'm calling the double-layered outside view: that institutional forecasting should apply reference-class base rates not only to the outcome being predicted, but also to the institution's own selection and weighting of reference classes. The claim is that without this second layer, inside-view reasoning reliably sneaks back in through strategic framing of the comparison class, so standard outside-view practice collapses into a more sophisticated form of overconfidence. I need a Q&A prep sheet ordered by actual damage potential to this specific audience, not generic skepticism. For each objection, specify who in the room will raise it, phrase it in their vocabulary, give me a reply that fits in about ninety seconds, and flag exactly where that reply is soft. Tell me what I should concede in my opening remarks to defuse the obvious lines of attack. Include the one question I'm hoping nobody asks—likely whether my own choice of this framework is itself vulnerable to the recursive problem I'm diagnosing—and sketch how to answer it without sounding defensive. Keep the focus practical: this is a crowded session, not a dissertation defense.
