prompt: |-
  I'm in this philosophy of science seminar and we got a handout summarizing Quine's take on moral values, and I can't tell if it's being fair or just making him sound like a cartoon. The summary says Quine treated ethics as basically a branch of empirical psychology, with moral beliefs sitting in the web of belief just like claims about electrons or tables. It says a statement like "cruelty is wrong" gets its entire meaning from its logical connections to other beliefs about suffering and social stability, not from any special moral intuition or a priori faculty. Then it claims moral beliefs are actually near the periphery of the web—closer to observation reports about pain—so they're more revisable than physical laws, not less. From this it concludes Quine is essentially a moral subjectivist: if two cultures have internally coherent but different moral webs, there's literally no fact of the matter about who's right, and cross-cultural moral argument is like trying to translate a language with zero shared ground. The handout also throws in this idea it calls "moral incommensurability closure"—that once a culture's moral web hits a certain coherence threshold, external criticism doesn't just fail practically but becomes conceptually impossible, because the coherence itself blocks contradictory nodes from entering. I don't know enough Quine to check this, but it feels like there might be one or two sneaky missteps in there—maybe mixing up where moral beliefs sit in the web, or overstating the translation analogy. Can you go through it and tell me which parts a careful reader of Quine would nod at, which are subtle distortions or overstatements, and whether that "closure" idea actually follows from his holism or is just being bolted on? I especially want to know if the conclusion that Quine is "basically a moral subjectivist" survives once the summary is corrected, or if that's where the real sleight-of-hand happens.
reasoning: |-
  Okay, the user is in a philosophy seminar and has a handout about Quine's views on ethics. They're skeptical that the handout might be oversimplifying or misrepresenting Quine, making him sound like a "cartoon." The main points from the handout are that Quine treats ethics as part of empirical psychology, moral statements get meaning from logical connections, moral beliefs are near the periphery of the web of belief, and this leads to moral subjectivism and incommensurability. The user is particularly concerned about the "moral incommensurability closure" idea and whether Quine is indeed a moral subjectivist.

  First, I need to recall Quine's actual positions. Quine's web of belief is central here. The handout is mostly right about ethics being part of empirical psychology for Quine, but I should clarify that he didn't reduce morality to mere psychology. He saw moral statements as empirical, rooted in human responses to the world. The logical connections part is accurate—Quine rejected intuition or a priori knowledge, so meaning comes from the web's structure.

  The handout claims moral beliefs are near the periphery. That's a potential distortion. Quine placed observation sentences at the periphery, but moral claims like "cruelty is wrong" aren't observation sentences. They're more theoretical, so they'd be further inside the web. The handout might be conflating peripheral elements (like pain reports) with moral judgments that are based on them. That misplacement could lead to overstating revisability.

  The subjectivism conclusion needs careful handling. Quine denied objective moral facts, but he wasn't a subjectivist in the individualistic sense. He leaned towards cultural relativism. The translation analogy is key here. Radical translation shows meaning is tied to cultural context, but Quine allowed for gradual translation and criticism, not complete incommensurability. The handout's "closure" idea seems like an overstatement. Quine's holism allows for web revisions, even with coherence. External criticism is difficult but not impossible because of shared human experiences and pragmatic adjustments.

  The user is worried about sneaky missteps. The main issues are the placement of moral beliefs in the web and the leap to incommensurable closure. Correcting these, Quine's relativism is about cultural frameworks, not subjectivism. The conclusion of subjectivism might stem from these distortions. The user also wants to know if the closure idea is Quine's or an addition. It's not explicitly Quine's; it sounds like an extension beyond his arguments, possibly from later commentators.

  The user's deeper need might be understanding Quine accurately for their seminar, possibly to critique the handout or engage in discussions. They might need a clear breakdown to distinguish Quine's actual views from misrepresentations, ensuring they don't adopt a flawed interpretation. Highlighting the nuances in revisability, the role of observation, and the possibility of cross-cultural engagement despite relativism would address their concerns about the handout's fairness.
answer: |-
  Here's a breakdown of the handout's claims against Quine's actual views, pinpointing the accuracies, subtle distortions, and where the "sleight-of-hand" likely occurs:

  **Accurate Representations (Where a Careful Reader Would Nod):**

  1.  **Ethics as Empirical Psychology:** Quine *did* reject the idea of ethics as a realm of special non-empirical knowledge (intuition, a priori insight). He saw moral beliefs as arising within the natural world, tied to human psychology, social conditioning, and biological predispositions ("branch of empirical psychology" is a reasonable shorthand).
  2.  **Meaning Holism & the Web of Belief:** Absolutely core Quine. The meaning of *any* statement (including moral ones like "cruelty is wrong") is determined by its logical and inferential connections within the entire web of beliefs. There are no isolated meanings derived from special faculties.
  3.  **Rejection of Moral Intuition/A Priori Faculty:** Quine vehemently opposed any form of foundationalism relying on non-empirical sources of knowledge. Moral knowledge couldn't come from a special moral sense any more than physical knowledge could come from pure reason divorced from experience.
  4.  **Moral Beliefs are Revisable:** Holism entails that *any* belief can be revised to save the system. Moral beliefs are certainly not sacrosanct.
  5.  **Denial of Objective Moral Facts (The Core of "Subjectivism"):** Quine explicitly denied the existence of transcendent moral facts or properties existing independently of human beliefs and practices. He saw moral judgments as expressions of culturally conditioned preferences and dispositions. ("Subjectivist" might be slightly loaded, but "non-objectivist" or "relativist" is fair).

  **Subtle Distortions & Overstatements:**

  1.  **Placement of Moral Beliefs "Near the Periphery":** This is the **most significant distortion** and the source of several downstream problems.
      *   **Quine's Periphery:** Observation sentences ("Red here now," "That hurts") are at the periphery. They are directly conditioned to sensory stimuli and are the *least* theory-laden, most easily revisable points of contact.
      *   **Moral Beliefs' Location:** Statements like "Cruelty is wrong" are *highly theoretical*. They depend on complex concepts ("cruelty," "wrong"), causal theories about pain and motivation, social norms, etc. Quine places them much **further toward the center** of the web, alongside other theoretical posits. While revisable in principle, they are deeply embedded and connected to vast swathes of belief (psychology, biology, sociology, personal identity). They are *not* simple observation reports.
      *   **Distortion:** The handout conflates the *empirical basis* (reports of pain, observable suffering) with the *moral judgment itself*. While the judgment is empirically grounded *through* these connections (the web), the judgment node itself isn't peripheral. This misplacement makes moral beliefs *seem* more easily revisable than they actually are for Quine and downplays their theoretical depth.

  2.  **"More Revisable than Physical Laws":** This directly stems from the misplaced periphery claim.
      *   **Quine's View:** While *all* beliefs are revisable, centrality implies stability. Core logical principles and fundamental physical laws are *extremely* central – giving them up would cause massive, cascading revisions throughout the web. Moral beliefs, while central, are typically *less* central than the most fundamental laws of logic or physics in Quine's view of the web's structure. However, they are likely *more* central (and thus less easily revisable) than many mid-level scientific hypotheses or historical claims. The handout's stark contrast ("more revisable than physical laws") oversimplifies the complex, contextual nature of revisability within the holistic web. Revisability isn't a simple linear scale from periphery to center; it depends on the specific challenge and the cost of revision.

  3.  **The Translation Analogy & Radical Incommensurability:**
      *   **Analogy is Apt *in Principle*:** Quine's radical translation argument ("gavagai") shows how meaning is indeterminate when translating radically different languages with no shared cultural background or "analytical hypotheses." The handout is right to see a parallel for radically different moral frameworks.
      *   **Overstatement of the Analogy & "Zero Shared Ground":** Quine *did not* believe radical translation was *utterly impossible* or that there was *literally no fact of the matter* in *all* cases. Translation, however difficult and indeterminate at the edges, *happens* pragmatically. We find points of contact (shared recognition of pain, basic needs, observable consequences of actions). Similarly, Quine wouldn't say there's *zero* shared ground for moral argument between cultures. Shared human biology, vulnerability to pain, needs for cooperation, and observable social consequences provide *some* empirical footholds for criticism and potential revision, however difficult and imperfect. The handout leans towards an extreme, almost Kuhn-like incommensurability that Quine's holism and naturalism temper.

  **The "Moral Incommensurability Closure" Idea: A Bolt-On?**

  *   **Not Quinean:** This is where the handout significantly overreaches or invents a concept not found in Quine.
  *   **Contradicts Holism and Revisability:** Quinean holism *emphasizes* that even highly coherent webs are *always* vulnerable to recalcitrant experience forcing revision *somewhere*. The "threshold" idea implies a static, finished system immune to challenge, which is antithetical to Quine's dynamic, fallibilist picture of science and belief.
  *   **Contradicts Naturalism & Empiricism:** Quine believed all belief is answerable, ultimately, to sensory experience. If a "coherent" moral web systematically ignored massive, observable suffering caused by its practices, Quine's empiricism would demand *some* point in the web be revised to account for this experience, even if it meant complex adjustments. The "closure" idea suggests coherence itself can trump recalcitrant experience, which Quine would reject.
  *   **Origin:** This sounds more like an (extreme) interpretation of Davidson's "Principle of Charity" run amok, or perhaps a misapplication of Kuhnian paradigm shifts, than anything Quine argued. It fundamentally misrepresents the *empirical* constraint inherent in Quine's holism.

  **The "Basically a Moral Subjectivist" Conclusion: With Corrections**

  *   **Survives (as Non-Objectivism/Relativism):** Even correcting the distortions, Quine's core position remains: There are no objective, transcendent moral facts. Moral beliefs are empirically grounded but culturally conditioned components of our overall web, justified by their coherence within that web and connection to experience. For radically different webs, there is no "God's eye view" to adjudicate which is "truly right" in an absolute sense.
  *   **Nuance Added by Corrections:**
      *   Moral beliefs are **more central and stable** than the handout implies, making cross-cultural criticism **difficult but not *conceptually impossible*** due to shared empirical grounding (pain, consequences).
      *   The **possibility of criticism and revision** remains open *in principle* due to holism and empiricism, even for "coherent" systems. The "closure" idea is false.
      *   The **translation analogy**, while valid, shouldn't imply utter unintelligibility or "zero shared ground." Pragmatic engagement and partial translation/criticism are possible.
  *   **Better Label:** Quine is more accurately described as a **cultural relativist** or **non-cognitivist/non-objectivist** regarding moral *truth*, grounded in a naturalistic, holistic epistemology. "Subjectivist" can imply individual whim, which underplays the deep cultural embedding Quine emphasized. His view is that moral "truth" is relative to a coherent, empirically responsive cultural web.

  **The Real Sleight-of-Hand:**

  The primary misstep enabling the cartoonish conclusion is the **misplacement of moral beliefs at the periphery**. This distortion:

  1.  Makes them seem simpler and more directly observational than they are.
  2.  Exaggerates their revisability compared to core theoretical beliefs.
  3.  Makes the radical incommensurability and "zero shared ground" conclusion seem more inevitable than it is (as central beliefs relying on shared core concepts like pain provide *some* ground).
  4.  Paves the way for the invented "closure" concept by downplaying the *empirical* constraint that always remains, even for central beliefs.

  **In Summary:** The handout gets Quine's core naturalism, holism, rejection of moral intuition, and non-objectivism roughly right. However, it seriously distorts the *location* and *stability* of moral beliefs within the web, leading to an overstatement of revisability, an extreme view of incommensurability, and the invention of an un-Quinean "closure" concept. Correcting these, Quine remains a robust moral relativist/non-objectivist, but one who allows for the *possibility* of difficult, empirically grounded cross-cultural moral argument and revision, even if there's no ultimate, culture-transcendent "fact of the matter" to settle disputes. The handout leans too far towards a picture of isolated, untouchable moral bubbles.
