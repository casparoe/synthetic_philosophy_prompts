answer: |-
  Here’s a ruthless prioritization of split-brain open questions for maximum theoretical impact, ranked by their potential to collapse downstream debates (personal identity, phenomenal unity, AI consciousness) and feasibility for a 3-year, lab-free project:

  **Ranked Questions & Defense:**  
  1. **Diachronic Arbitration Failure**  
     - **Why #1**: Directly undermines the "narrative self" model of personal identity. If consciousness *can* lack temporal coherence without splitting into two synchronic agents, it forces revision of theories tying identity to autobiographical continuity (e.g., Parfit, Dennett).  
     - **Feasibility**: Mine existing behavioral datasets (e.g., conflicting delayed responses, inconsistent preferences over time) and historical patient diaries. Computational modeling of narrative fragmentation is possible without wet-lab access.  
     - **Downstream Impact**: Resolves whether unity is primarily a *temporal glue* problem—critical for AI architectures aiming for "lifelong" consciousness.  

  2. **Synchronic Unity Status**  
     - **Why #2**: The core debate—but trapped in a stalemate. Prioritize *not* proving duality, but **identifying necessary conditions for unity**. Focus on cases where hemispheres cooperate *without integration* (e.g., bimanual tasks with unshared goals).  
     - **Feasibility**: Reanalyze classic conflict experiments (e.g., left hand blocking right hand) under modern unity frameworks (e.g., Global Workspace "ignition" thresholds). Testable via computational simulations of information bottlenecks.  
     - **Downstream Impact**: If unity isn't all-or-nothing, it annihilates binary views of personhood and refines AI consciousness benchmarks (e.g., when does a multi-module system become "one" subject?).  

  3. **Covert Unification Mechanisms ("Spying")**  
     - **Why #3**: High-risk/high-reward. If one hemisphere *learns to hack motor outputs* to simulate unity, it reveals consciousness as a predictive façade—not intrinsic unity.  
     - **Feasibility**: Hunt for overlooked evidence:  
       - *Mismatched responses* (e.g., right hemisphere draws "cat" but left verbally insists it's "dog" *without* conflict)  
       - *Training artifacts* (e.g., patients improving at cross-cueing over time)  
       - Computational models of reinforcement learning across hemispheres.  
     - **Downstream Impact**: Explodes the "hard unity" assumption. For AI, implies consciousness could emerge from predictive self-modeling, even in fractured systems.  

  **Overrated Dead Ends to Avoid:**  
  - **The "Two Persons" Debate**: Circular philosophical trench warfare. No new data will settle it—it’s a category error.  
  - **Left-Brain Interpreter as Special**: An outdated caricature. Modern neuroscience shows both hemispheres have interpretive capacities; the issue is *communication*, not competence.  
  - **Phenomenal Unity as Primitive**: Armchair metaphysics. Focus on *functional* unity (how systems *achieve* coherence) instead.  

  **Why This Order?**  
  - **Diachronic failure** (#1) is the most tractable *and* disruptive: Temporal fragmentation challenges deeper assumptions about selfhood than synchronic splits. A philosopher could crack it by reframing existing data.  
  - **Synchronic unity** (#2) is essential but stalled; shifting focus to "unity conditions" bypasses unanswerable "how many?" questions.  
  - **Covert spying** (#3) is a dark horse—if proven, it’s revolutionary, but evidence is thin. Best as a side project.  

  **Practical Path for 3 Years:**  
  1. **Year 1**: Build a computational model of diachronic arbitration (e.g., neural network with severed communication channels tracking narrative drift).  
  2. **Year 2**: Reanalyze published split-brain behavioral data through this lens—search for *time-delayed conflicts* ignored in synchronic debates.  
  3. **Year 3**: Pressure-test theories: If diachronic fragmentation exists without synchronic duality, does the "unity of consciousness" even require a single agent?  

  **Bottom Line**: Target **temporal disintegration**. It’s the stealth bomb that can blow up theories of self, identity, and AI continuity—all while dodging the unwinnable "two minds" quagmire. The covert spying angle is seductive but too speculative; let it be someone else’s gamble.
