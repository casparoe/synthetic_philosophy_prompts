answer: |-
  Here is a decision tree mapping positions within and challenging Augustine's absolute prohibition on lying in the scenario where telling the literal truth would directly cause severe, unjust harm to an innocent person. The tree prioritizes conceptual splits over historical labels, flags awkward commitments, identifies gaps, and notes textual ambiguity.

  **Root Node:** Telling literal truth will directly cause severe, unjust harm to an innocent person.

  ### Branch 1: Does "mental reservation" (technically true but deliberately misleading statement) count as a lie in Augustine's sense?
  *   **(1A) YES, it counts as a lie:** (Textually supported: Augustine condemns intentional deception through words, regardless of technical truth, as violating the duty to employ words only for their true purpose of conveying one's mind.)
      *   *Proceed to Branch 2.*
  *   **(1B) NO, it is permissible deception:** (Textually contested: Some argue Augustine's allowance for ambiguous words or actions in *Contra Mendacium* opens this door; others see it as incompatible with his core definition of lying as intentional false signification.)
      *   **Leaf: Mental-Reservationist:** Must hold that preserving technical truthfulness, even while intending deception, sufficiently protects the speaker's soul and duty to truth, potentially viewing the victim's harm as irrelevant to the moral character of the speech act itself. *(Awkward Commitment: Must defend that deliberately misleading someone with a technically true statement isn't morally corruptive deception.)*

  ### Branch 2 (From 1A): Is a false statement told *specifically to shield an innocent victim from an aggressor* morally identical to a lie told for personal gain in terms of corrupting the speaker's soul?
  *   **(2A) YES, morally identical:** (Textually supported: Augustine consistently argues the lie itself corrupts the soul, regardless of motive or consequence. Protecting another is a good will acting through an evil means.)
      *   *Proceed to Branch 3.*
  *   **(2B) NO, morally distinct:** Protective lies lack the corrupting *intent* or *character* of self-serving lies; they are acts of charity or justice using deception as a necessary tool.
      *   **Leaf: Virtue-Based Revision (e.g., some Neo-Augustinians):** Must hold that the virtue of charity or justice can sanctify the deceptive act, meaning the speaker's soul is *not* corrupted (or is less corrupted) by a well-intentioned lie, directly contradicting Augustine's mechanism of corruption. *(Awkward Commitment: Must argue that an act Augustine defines as intrinsically evil (lying) can become morally good or neutral when done for a virtuous end.)*

  ### Branch 3 (From 2A): Is the damage to one's own soul from lying *always* weightier than the severe physical harm (e.g., death) prevented?
  *   **(3A) YES, soul-damage always outweighs:** (Textually supported: Augustine prioritizes eternal spiritual goods over temporal physical goods. Martyrdom for truth is preferable to lying for life.)
      *   **Leaf: Strict Augustinian:** Must hold that allowing the innocent person to suffer severe harm or death is the lesser evil compared to the liar willingly committing a soul-damaging sin, placing the absolute duty to personal purity above the duty to prevent grave harm to others. *(Awkward Commitment: Must maintain that letting an innocent die horribly is morally preferable to telling a single lie to save them.)*
  *   **(3B) NO, preventing grave harm can outweigh:** The moral catastrophe of allowing severe, unjust harm to befall an innocent through one's truthful speech can outweigh the spiritual damage of lying in this extreme case.
      *   **Leaf: Casuist Exception (e.g., some later Catholics):** Must hold that Augustine's absolute prohibition admits an exception for preventing unjust killing/grave harm, meaning the lie in *this specific case* does not corrupt the soul in the same way (or the corruption is mitigated/justified), undermining the absoluteness central to his view. *(Awkward Commitment: Must concede that Augustine was wrong about the *absolute* nature of the prohibition's grounding in soul-corruption for this case, or redefine corruption.)*

  ### Branch 4 (Alternative Path from Root): Can Augustine's allowance for joking falsehoods/hyperbole be stretched to cover protective falsehoods without destroying his view?
  *   **(4A) YES, protective falsehoods can fit:** Protective deception is analogous to conventional figures of speech or social play, understood by all parties (implicitly including the aggressor?) as not making a genuine truth-claim.
      *   **Leaf: Figurative-Stretch (unnamed/common attempt):** Must hold that the aggressor threatening harm implicitly "opts out" of the normal context of truth-telling, placing the interaction in a different (e.g., adversarial) communicative sphere where literal truthfulness doesn't apply, risking the collapse of any stable definition of lying. *(Awkward Commitment: Must argue that threatening someone creates a context where deception isn't really "lying" as Augustine defines it, potentially justifying deception against anyone deemed an "unjust aggressor".)*
  *   **(4B) NO, the analogy fails:** Jokes/hyperbole rely on shared conventions *for non-serious discourse*; protective lies in life-threatening scenarios are deadly serious attempts to deceive within the context of serious truth-claims demanded by the aggressor.
      *   *Leads back into the core prohibition, aligning with paths like Strict Augustinian (3A) or requiring resolution via Branch 1/2/3.*

  ---

  **Logically Open but Unoccupied Gaps:**
  1.  **1B (Mental Res. OK) + 2A (Protective Lie = Selfish Lie):** Accepts mental reservation but holds that an outright protective lie is just as bad as a selfish one. *Gap Reason:* Unattractive/Incoherent. If mental reservation (deliberate deception) is permissible, why would outright lying for the *same protective purpose* be morally identical to lying for gain? It creates an arbitrary distinction solely based on verbal technicality.
  2.  **1A (Mental Res. = Lie) + 3B (Harm Outweighs) + Reject 4A:** Holds mental reservation is lying, protective lying is corrupting, *but* the harm prevented still outweighs the soul-damage. *Gap Reason:* Unattractive/Neglected. It accepts soul-corruption as real and weighty but still chooses the "lesser evil" of corruption + saving a life. This "tragic choice" position is logically possible but rarely embraced, as it abandons the hope of avoiding sin while saving life, satisfying neither strict deontologists nor consequentialists fully.

  **Indistinguishable Leaves (Given Questions):**
  *   **Strict Augustinian (3A)** and a hypothetical position accepting **1A**, **2A**, **3B**, but rejecting **4A** would both require telling the truth in the root scenario. The tree's questions don't differentiate between doing this because soul-harm *always* outweighs (3A) vs. doing it because one rejects the alternatives, even if soul-harm *doesn't* always outweigh (which is the gap position noted above). The *reason* for telling the truth (absolute duty vs. tragic lesser evil) differs, but the *prescribed action* is the same. The tree identifies the action path but needs the underlying rationale (Branch 3) to explain it.

  **Augustinian Textual Status:**
  *   **Firmly Established:** Lying is *always* sinful and soul-corrupting, regardless of motive (good or bad) or consequence (saving life or causing harm). The prohibition is absolute. Words must only be used to convey the truth in one's mind. Martyrdom is preferable to lying. Joking/hyperbole is permissible only where social convention clearly signals non-seriousness.
  *   **Genuinely Contested:** Whether "mental reservation" (broadly construed) falls under his definition of lying. While Augustine condemns deception via ambiguous words intended to mislead (*Contra Mendacium*), scholars debate if his examples and principles definitively rule out *all* forms later classified as mental reservation. **This is not a consensus view.** Similarly, the precise *mechanism* of soul-corruption and its absolute, non-comparable weight relative to physical harms, while strongly implied, is argued from his principles rather than explicitly detailed in the context of weighing harms.
