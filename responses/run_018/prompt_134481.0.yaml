answer: |-
  Here's your battle-tested "Is-Ought Gap & Naturalistic Fallacy" Submission Screener – designed for speed with built-in judgment zones and misfire warnings:

  **The 5-Minute "Is vs. Ought" Checklist (v1.0 - For Ethics Blog Bouncers)**

  1.  **STEP 1: FIND THE "IS" CLAIM:** *What scientific/descriptive fact are they starting from?*
      *   *Look For:* Words like "science shows," "evolution made," "data proves," "biology dictates," "AI predicts," "studies find."
      *   *Pass:* They clearly state an observable fact/mechanism (e.g., "Humans have tribal instincts," "Altruism activates brain reward centers," "AI is 90% accurate").
      *   *Fail/Stop:* No clear "is" claim. It's all opinion/values from the start. *Reject or ask for revision.*
      *   *Your Judgment Needed:* Is the "is" claim actually well-established science or shaky pop-sci? (Checklist can't verify facts!)

  2.  **STEP 2: FIND THE "OUGHT" CLAIM:** *What moral rule/action are they concluding?*
      *   *Look For:* Words like "should," "ought," "must," "is moral/immoral," "is correct/incorrect," "we have a duty to," "we must prioritize."
      *   *Pass:* They clearly state a prescription for action or a moral judgment.
      *   *Fail/Stop:* No clear "ought." It's purely descriptive. *Probably Approve (if scientifically sound).*
      *   *Your Judgment Needed:* Is the "ought" claim actually *derived* from the "is," or just stated nearby?

  3.  **STEP 3: THE BRIDGE CHECK (The Gap/Fallacy Zone):** *Do they EXPLICITLY connect the "is" to the "ought" with a value-based reason?*
      *   *Look For:* Connecting words like "therefore," "so," "thus," "which means we must," "proves that we should." **Crucially, is there ANY argument or value stated *linking* the fact to the moral rule?** Or is it just asserted?
      *   *Pass/Fail?:** This is the CRITICAL STEP.
          *   **FAIL (Gap/Fallacy Triggered):** They jump straight from the "is" to the "ought" *without any stated value premise or ethical reasoning* (e.g., "Evolution made us tribal, *therefore* we should prioritize our group"). **STOP HERE - This is likely the Gap/Fallacy.**
          *   **PASS (Proceed):** They *explicitly state* a value premise linking them (e.g., "Evolution made us tribal, *and because survival of our group is the highest moral good*, we should prioritize our group"). *Move to Step 4.*
      *   *Your Judgment Needed:* Is the stated "bridge" value actually present and doing the work, or is it tacked on weakly? Is the bridge value itself controversial?

  4.  **STEP 4: THE VALUES CALL (The "Your Problem Now" Zone):** *If they passed Step 3, does their stated "bridge value" make sense or need scrutiny?*
      *   *Look At:* The value they used to connect "is" and "ought" (e.g., "survival is the highest good," "activating reward centers defines morality," "accuracy equals justice").
      *   *Pass/Fail?:** **THIS IS NOT A SCIENCE CHECK. THIS IS A VALUES DEBATE.**
          *   The checklist **CANNOT** tell you if this value is "right" or "wrong." That's pure ethics/philosophy.
          *   **"PASS" = Proceed to Publishing?:** Only if the submission *acknowledges* this is a debatable value position and argues for it *on ethical grounds*, not just scientific ones. It's now an *ethical argument using science*, not a *scientific proof of ethics*.
          *   **"FAIL" = Reject?:** If they treat their bridge value as an *obvious, uncontestable scientific fact* rather than a value choice (e.g., "Obviously maximizing brain reward is the definition of good"). This is often a hidden fallacy.
      *   *Your Judgment Needed:* **HUGE.** You decide if the *value premise* is:
          *   Stated clearly and argued for ethically?
          *   Hidden or assumed as fact?
          *   Too controversial for your blog's scope without stronger argument?
          *   Logically consistent?

  **Where the Checklist Misfires & Your Judgment Rules:**
  *   **Bad Science:** It assumes the "is" claim is true. You *still* need to spot obviously junk science.
  *   **Hidden Values in "Is":** Sometimes the "is" claim itself smuggles in values (e.g., "Criminals have abnormal brains" implies "abnormal = bad").
  *   **Complex Arguments:** If they have multiple "is" and "ought" claims woven together messily, the checklist might oversimplify.
  *   **"Acceptable" Jumps:** Sometimes an "ought" follows uncontroversially from an "is" *plus widely held values* (e.g., "This poison kills people (Is), therefore you shouldn't drink it (Ought)" - relies on uncontroversial value: avoid death). The checklist will flag the gap, but you might approve it as common sense. **Use Sparingly!**
  *   **The Values Call (Step 4):** This is entirely your (or your blog's) editorial judgment on what constitutes a reasonable ethical argument.

  **What the Checklist CAN'T Do:**
  *   Resolve fundamental value disagreements.
  *   Verify scientific accuracy.
  *   Tell you which ethical system (Utilitarianism, Deontology, etc.) is "correct."
  *   Make the final "Approve/Reject" decision for you in Step 4. It just forces the values debate into the open.

  ---

  **Applying the Screener to Your Submissions:**

  1.  **Submission:** "Evolution made us tribal so we ought to prioritize our own group over outsiders."
      *   Step 1: PASS (Is: Evolution made us tribal - descriptive claim about origins of behavior).
      *   Step 2: PASS (Ought: We ought to prioritize our own group).
      *   Step 3: **FAIL (Gap/Fallacy Triggered!)**. Connects with "so" but provides *zero* value premise explaining *why* an evolved tendency *should* dictate morality. Where's the bridge value? (e.g., "natural = good"? "Survival demands it"? Not stated!). **STOP - REJECT.** (Classic Naturalistic Fallacy).

  2.  **Submission:** "fMRI scans show altruism lights up reward centers so being selfless is the correct moral system."
      *   Step 1: PASS (Is: Altruism lights up brain reward centers - neuro description).
      *   Step 2: PASS (Ought: Selflessness is the *correct* moral system - strong ought).
      *   Step 3: **FAIL (Gap/Fallacy Triggered!)**. Connects with "so" but provides *zero* value premise explaining *why* activating a specific brain region defines the "correct" moral system. Is "lighting up reward centers" the *definition* of good? Why? Not stated! **STOP - REJECT.** (Another Naturalistic Fallacy - defining "good" via a natural property).

  3.  **Submission:** "Predictive policing AI is 90% accurate so we should use it for sentencing." **(Your Gut Approve / Checklist Block Case!)**
      *   Step 1: PASS (Is: AI is 90% accurate - performance claim).
      *   Step 2: PASS (Ought: We should use it for sentencing - action/moral ought).
      *   Step 3: **FAIL (Gap/Fallacy Triggered!)**. Connects with "so" but provides *zero* value premise explaining *why* accuracy justifies use in sentencing. It *assumes* accuracy is the *only* or *primary* value relevant to justice (ignoring fairness, bias, due process, proportionality, human judgment). **STOP - REJECT.**
      *   **What to do when your gut clashes (Approved vs. Blocked):** **REJECT.** BUT! Give feedback: "You've shown the tool *might* be accurate (Is), but you haven't argued *why* accuracy alone justifies its use in sentencing (Ought). This jumps the is-ought gap. Resubmit arguing *why* accuracy should override other justice concerns like potential bias or lack of transparency." This forces the values debate where it belongs.

  **Why Reject #3 is Important (Even if Gut Approved):** Your gut might think "90% accurate sounds great, let's use it!" The checklist *forces* you to see that the submission hasn't *earned* that conclusion ethically. It hasn't addressed the crucial *value* questions: Is accuracy the *only* goal of justice? What if the 10% error targets marginalized groups? Does efficiency trump fairness? The checklist blocks the shortcut and demands the ethical argument be made explicit. That's its job!

  You got this. The checklist flags the lazy jumps. You handle the messy values. And yeah, "falacy" happens to the best of us. ;) Good luck reviewing those hot takes!
