  *scratches head* The challenge is making philosophy actionable. Need to translate Hume's "you can't derive ought from is" into yes/no questions. Also should flag where the checklist will misfire - like when values are disguised as facts or when empirical claims are actually uncontroversial. 

  For the examples:
  First one ("evolution made us tribal...") is textbook naturalistic fallacy. Second one (fMRI altruism) hides the value judgment in "correct moral system". Third one (predictive policing) is sneaky because accuracy feels objective but ignores justice concerns. 

  *checks watch* Better avoid academic jargon entirely. Instead of "normative premise", say "values call". Instead of "epistemic justification", say "prove it". Should include exit ramps where the review stops early if fails a step. 

  *lightbulb* The "your call" moment needs to be visually distinct in the checklist. Maybe make step 4 shouty with emojis? And for the gut-vs-procedure conflict: explicitly say "reject but tell them to resubmit with values argument". 

