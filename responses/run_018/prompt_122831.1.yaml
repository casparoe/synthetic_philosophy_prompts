answer: |-
  ### Procedure: Uniformity Assumption Handover Test
  1. **Define the quantity and range**: Clearly state the variable (e.g., storm track midpoint, failure rate) and its possible values (e.g., 0 to 100 km, 0 to 0.1 failures/year).  
     *Sufficient*: Unambiguous definition with units (e.g., km, rate, dollars).  
  2. **Identify a physical generating process**: Describe how the quantity arises in reality (e.g., "storms approach with uniform offset from a point"). If no process exists, proceed to Step 4.  
     *Sufficient*: A mechanistic story (e.g., "dropped straws on a circle"). If absent, note "no physical basis."  
  3. **Apply the handover test**: Give the generating process (from Step 2) to an unfamiliar analyst. They must compute a probability using only this specification. If results vary between analysts, reject the specification.  
     *Sufficient*: Identical numerical result from ≥2 analysts. If failed, proceed to Step 4.  
  4. **Reparameterization check**: Test if uniformity holds across natural alternative scales (e.g., linear vs. log, rate vs. time). If not, uniformity is arbitrary.  
     *Sufficient*: Uniformity produces inconsistency (e.g., uniform rate ≠ uniform log(rate)). If inconsistent, **stop and return for data or a better question**.  
  5. **Verify additive scale**: Identify the scale (e.g., linear distance, log-dollars) where the process is additive (e.g., offsets add linearly).  
     *Sufficient*: Justification based on physics/context (e.g., "storm motion is additive in km").  
  6. **Decide distribution**: Use the generating process if Steps 2–3 pass. Else, use uniformity only if Steps 4–5 support one scale. Otherwise, proceed to Step 7.  
  7. **Senior reviewer judgment**: The reviewer either:  
     a) Rejects uniformity and mandates data collection, or  
     b) Approves a specific uniformity, documenting the choice as expert judgment.  
     *Sufficient*: A decision with rationale (e.g., "uniform in log-scale due to orders-of-magnitude uncertainty").  
  8. **Regulator justification**: "We assume uniformity in [quantity] (e.g., storm track offset) measured in [units] (e.g., km) because [reason: e.g., it matches the physical process in Step 2]. This choice is licensed by the handover test or additivity in [units]. The distribution is flat in these units, and alternatives were rejected by reparameterization checks."  

  **What the procedure cannot settle**: Fundamental arbitrariness when multiple equally natural scales exist (e.g., rates vs. times) without data or generating processes.  

  ---

  ### Case Applications
  **Case 1: Hazard track geometry (Bertrand’s paradox)**  
  1. Quantity: Chord length inside a circle. Range: 0 to diameter.  
  2. Generating process: "Storm track defined by uniform orientation (0–360°) and uniform offset (distance from circle center, 0–R km)."  
  3. Handover test: Analyst computes probability chord > L as √(R² - (L/2)²)/R (e.g., 1/2 for L = √3 R). Consistent across analysts. **Pass**.  
  4–6. Reparameterization: Offset in km is additive (Step 5). Use generating process.  
  8. Justification: "Uniformity in offset (km) due to storm physics. Flat in km, validated by handover test."  

  **Case 2: Uniform prior on failure rate (0 to U)**  
  1. Quantity: Failure rate (λ). Range: 0 to U failures/year.  
  2. Generating process: None (no mechanistic story).  
  3. Handover test: Not applicable.  
  4. Reparameterization: Uniform in λ implies non-uniform in log(λ) (prior ∝ e^θ) and failure time (1/λ, prior ∝ 1/λ²). **Inconsistent**.  
     → **Stop and return for data or better question** (Step 4).  
     *Senior note*: Default uniformity abandoned; seek failure data or use log-scale with justification.  

  **Case 3: Regulatory fines for new peril**  
  1. Quantity: Fine amount (dollars). Range: A to B.  
  2. Generating process: None (no data/loss model).  
  3. Handover test: Not applicable.  
  4. Reparameterization: Uniform in dollars implies non-uniform in log-dollars (prior ∝ 1/fine). **Inconsistent**.  
     → **Stop and return for data** (Step 4).  
     *Senior note*: Fines may span orders of magnitude, but without generating process, uniformity is arbitrary. Gather industry fine data.  

  ---  
