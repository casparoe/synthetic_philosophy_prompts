  We are creating a procedure to handle situations where we are tempted to assume evenness (uniform distribution) in the absence of data. The procedure must be clear, have at most eight steps, and end with a justification for the regulator. We also need to apply the procedure to three cases.

  Procedure: "Handover Test for Uniformity Assumptions"

  Step 1: Define the quantity of interest and the range over which we are considering uniformity. 
     Sufficient: A clear statement of the variable and its possible values (e.g., "the midpoint along a radius", "the failure rate between 0 and U").

  Step 2: Identify the physical generating process (if any) that produces the quantity. 
     Sufficient: A description of how the quantity arises in the real world (e.g., "a storm track is defined by its orientation and the closest approach to the center"). If no generating process is known, go to Step 4.

  Step 3: Perform the handover test: 
     - Write a specification of the generating process that includes all the random elements and their distributions. 
     - Give this specification to an analyst unfamiliar with the model. 
     - The analyst must be able to compute the probability of an event of interest without additional guidance. 
     - If the analyst can reasonably compute a different probability, the specification is rejected. 
     Sufficient: The specification passes if the same number is obtained by the new analyst. If it fails, go to Step 4.

  Step 4: Check for reparameterization invariance: 
     - Consider alternative parameterizations of the same quantity (e.g., the quantity itself, its logarithm, its square, etc.) that are equally natural in the context. 
     - If the uniform distribution in one parameterization leads to non-uniform distributions in other natural parameterizations, then the assumption of uniformity is arbitrary. 
     Sufficient: If the uniformity is invariant under reparameterizations that are natural in the problem context, then proceed. Otherwise, stop and send back for more data or a better-posed question.

  Step 5: Identify the scale of measurement: 
     - Determine the units or scale in which the quantity is measured (e.g., length, rate, logarithmic scale). 
     - The principle of indifference (if we must use it) should be applied in the scale that is additive for the underlying physical process. 
     Sufficient: A statement of the scale and why it is additive (e.g., "we use the offset in kilometers because storm tracks are generated by a process that is uniform in linear distance").

