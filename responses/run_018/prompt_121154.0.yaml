  ### Scenario  
  In a three-member venture capital committee deciding sequentially whether to invest in a startup, the startup's quality is good or bad with equal prior probability (0.5). Each member receives a private signal—high or low—with reliability 0.6 (i.e., P(high|good) = P(low|bad) = 0.6). The startup requires at least two investments to survive and reveal its quality; if it receives fewer, it fails without revealing anything. Investors gain 1 if the quality is good but lose 1 if bad (only if the startup survives); non-investors get 0 regardless. In the actual history, the first two members receive high signals and invest. The third, despite a low signal, infers a positive expected payoff and invests. The startup survives, revealing bad quality, and all three lose 1. This outcome is worse than the counterfactual history in which the first member receives a low signal (same prior and reliability) and does not invest, causing the second and third to also abstain (due to expected payoffs ≤ 0), leading to startup failure and payoff 0 for all—avoiding the loss of 1. Mandatory disclosure of all signals before any action would not prevent investment: with two high and one low signal, the posterior probability of good is 0.6, yielding an expected payoff of 0.2 > 0.

  ### Step-by-Step Walkthrough  
  - **Agent 1**: Observes nothing. Signal: high. Posterior: P(good|high) = (0.6 × 0.5) / (0.6 × 0.5 + 0.4 × 0.5) = 0.6. Expected payoff: 0.6 × 1 + 0.4 × (−1) = 0.2 > 0. **Action: Invest**.  
  - **Agent 2**: Observes Agent 1 invested. Since Agent 1 invests only with a high signal (P(good|low) = 0.4, expected payoff = −0.2 < 0), Agent 2 infers Agent 1’s high signal. Own signal: high. Posterior: P(good|two high) = (0.6² × 0.5) / (0.6² × 0.5 + 0.4² × 0.5) = 0.692. Expected payoff: 0.692 − 0.308 = 0.384 > 0. **Action: Invest**.  
  - **Agent 3**: Observes two investments, inferring two high signals (each investment reveals a high signal). Own signal: low. Posterior: P(good|two high, one low) = (0.6² × 0.4 × 0.5) / (0.6² × 0.4 × 0.5 + 0.4² × 0.6 × 0.5) = 0.6. Expected payoff: 0.6 × 1 + 0.4 × (−1) = 0.2 > 0. **Action: Invest** (cascade begins at step 3).  
  - **Cascade justification**: At step 3, Agent 3’s action is invariant to their private signal. If Agent 3’s signal were high: P(good|three high) = (0.6³ × 0.5) / (0.6³ × 0.5 + 0.4³ × 0.5) ≈ 0.771, expected payoff ≈ 0.542 > 0. Thus, Agent 3 invests for any signal.  

  ### Verdicts for Rival Diagnoses  
  - **(a) Blame the agents (irrational/conformist)**: Diagnoses irrational conformity. **Remedy**: Training to ignore peers. **Fit**: Superficially fits (crowd-following), but fails—agents maximize expected accuracy (arithmetic shows rational choices). **Does not work**.  
  - **(b) Blame the structure (information-destructive)**: Diagnoses destructive information aggregation. **Remedy**: Restructure to decouple investment from learning (e.g., external pilot program). **Fit**: Fits (endogenous evidence traps them). **Works but costly** (requires new processes).  
  - **Standard remedy (mandatory disclosure)**: Disclose all signals before any action. **Why it fails**: With signals (high, high, low), P(good) = 0.6, expected payoff = 0.2 > 0, so all still invest and lose 1. Disclosure does not change the decision.  
  - **Alternative remedy**: Require unanimity to invest. **Why it works**: If Agent 3’s low signal leads to dissent, investment fails (payoff 0). **Cost**: May block good startups (e.g., two high, one low with true good).  

  ### Load-Bearing Feature and Ablation  
  - **Feature**: Self-sealing evidence (quality revelation depends on sufficient investment; unchosen options leave no trace).  
  - **Ablation (remove self-sealing)**: Suppose quality is revealed regardless of investment. Cascade still forms (same actions), but mandatory disclosure breaks it if signals oppose. For example, if reliability were higher (0.8) and signals more balanced (e.g., high, low, low), disclosure yields negative expected payoff, preventing investment. The cascade becomes fragile.  

  ### Strongest Attack and Reply  
  - **Attack**: This is not an informational cascade but a coordination game with an endogenous state (threshold for survival). Cascades concern exogenous states; this is outside the claim’s scope.  
  - **Reply**: Concede the state is endogenous, but agents act solely on beliefs about quality (no coordination payoff). The cascade is purely informational (actions are evidence, not goals), fitting the definition.  
  - **Concession**: Endogeneity blurs the line, but the epistemic mechanism (rational ignoring of private signals) remains intact.  

  ### What the Case Cannot Show  
  The case does not show that cascades are never self-correcting, only that under endogenous evidence and moderate signal reliability (where accumulated signals marginally favor the wrong option), fragility may fail. It also cannot establish that structural remedies are always feasible or that wrongness is avoidable without cost.

