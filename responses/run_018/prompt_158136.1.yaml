prompt: |-
  I'm prepping a podcast ep with a philospher who just released The Broadcast Gap — she claims global workspace theory nails access consciousness but that its 'broadcast' is phenomenally hollow, and that what we call phenomenal consciousness is really just access with a tight feedback loop that fakes immediacy. I want a sequence of interview questions that don't let her retreat to Block's old distict. Start by forcing her to say whether she's making a new empirical predicition about split-brain cases or just re-framing concepts. Then ask what kind of evidence could actually convince her phenomenal consciousness isn't real and seperate from access. End with a follow-up about automatoin: if an artificial workspace had that same loop but zero biology, would she grant it phenomenal states or is she smuggling in substrate? Make them sharp, not generic "what drew you to this" stuff.
reasoning: |-
  Okay, the user is prepping a podcast interview with a philosopher who challenges the standard view on consciousness. She argues against Ned Block's distinction between phenomenal and access consciousness, proposing instead that phenomenal consciousness is just access consciousness with a tight feedback loop creating an illusion of immediacy. The user wants sharp questions that prevent her from retreating to Block's framework and force her to clarify her position.

  First, I need to understand the core of her argument. She's critiquing Global Workspace Theory (GWT), agreeing that it explains access consciousness but claiming its "broadcast" is phenomenally hollow. Her twist is that phenomenal consciousness isn't separate; it's access consciousness plus a feedback loop that simulates immediacy. The user specifically wants to avoid letting her fall back on Block's distinction, so the questions must challenge her to differentiate her theory empirically rather than just conceptually.

  The user outlines three key phases for the questions: start by forcing her to choose between empirical predictions or conceptual reframing regarding split-brain cases. Split-brain patients are classic examples where the two hemispheres seem to have separate consciousnesses, which Block uses to argue for distinct phenomenal consciousness. If her theory is just a reframing, it might not offer new testable insights, which could weaken its impact. Pushing her here exposes whether her view has scientific substance.

  Next, asking what evidence could falsify the existence of separate phenomenal consciousness. This targets the robustness of her claim. If she can't name any potential counterevidence, it might seem unfalsifiable—more philosophy than science. The user wants to pin her down on this, especially since she's dismissing a well-established concept.

  Finally, the automation question about artificial systems tests if her theory depends on biology. If she denies phenomenal states to a machine with identical feedback loops, it suggests she's smuggling in biological substrate, undermining her mechanistic explanation. This could reveal hidden assumptions in her view.

  The user emphasizes avoiding generic questions, so these need to be precise and confrontational, cutting to the chase. They're preparing for a podcast, meaning the questions should be engaging for listeners while pushing the guest intellectually. I should ensure the questions are phrased sharply, with clear intent and minimal fluff.

  For the split-brain question, I'll emphasize forcing an empirical vs. conceptual choice. The follow-up should press on testability. For the falsification question, I'll demand specific evidence types. The automation question needs to challenge any biological bias directly.

  I'll also add a fourth question about the feedback loop's mechanism—since it's central to her argument—asking where it's implemented and how we'd detect its absence. This ties back to the first question's empirical angle, strengthening the sequence.

  Overall, the goal is to make her defend her theory's novelty, testability, and consistency. The user likely wants to expose any weaknesses or ambiguities, making for a compelling podcast episode. By structuring questions this way, I'm helping the user achieve that depth and rigor.
answer: |-
  Here’s a sharp, no-retreat sequence targeting the core claims and implications of her "Broadcast Gap" thesis, designed to force empirical commitments and expose hidden assumptions:

  1.  **The Split-Brain Litmus Test: Prediction or Redescription?**
      *   "You critique GWT's broadcast as 'phenomenally hollow' and propose phenomenal consciousness is *just* access plus a tight feedback loop creating illusory immediacy. **When we look at split-brain patients – where access (reportability) is split but many argue *phenomenal* consciousness might remain unified or partially unified – are you making a *new, falsifiable empirical prediction* about what we *should* find, distinct from Block? Or is your position purely a *conceptual reframing* of the same data Block uses?"**
      *   *Purpose:* Forces her to choose: Is her theory empirically testable against Block's distinction in the paradigmatic case, or just a different interpretation? Prevents retreat to "it's still two types" by demanding novelty.

  2.  **The Falsifiability Challenge:**
      *   "If phenomenal consciousness *isn't* real and separate from access, just this feedback loop illusion, **what specific kind of empirical finding – neurological, behavioral, or computational – could *conceivably* convince you that you are wrong? What evidence would robustly demonstrate the existence of phenomenal properties irreducible to access + feedback?"**
      *   *Purpose:* Pins her down. If she cannot articulate *any* potential counterevidence, her position risks being unfalsifiable dogma. Demands she specify what would falsify her core claim that phenomenality isn't real/separate.

  3.  **The Automation Crucible (Substrate Smuggling Check):**
      *   "Imagine a perfect artificial global workspace: information is integrated, becomes globally available for report and action *and* implements an identical tight feedback loop creating the *illusion* of immediacy, but running on silicon, not biology. **Does this system possess phenomenal consciousness *by your definition*? If 'yes,' doesn't this undermine claims that biology is essential? If 'no,' what specific property possessed by the biological loop is missing in silicon, revealing a hidden reliance on substrate?"**
      *   *Purpose:* Directly tests if "access + feedback loop" is truly sufficient *independent of implementation*. Forces her to confront whether she's smuggling in biological properties ("real" neurons, wetware) essential to her view of phenomenality, contradicting the functional description.

  4.  **The Loop Mechanism & Detection:**
      *   **"Where and how is this critical 'tight feedback loop' physically implemented in the brain?** If phenomenality *is* just this loop plus access, **what specific neural signature or functional deficit would we expect to find if the loop was *absent* or impaired, while access consciousness remained intact? How would this manifest differently from a simple access deficit?"**
      *   *Purpose:* Demands mechanistic specificity. If her loop is what creates the *illusion* of phenomenality, its absence should leave access intact but phenomenality gone. What would that look like empirically? Challenges hand-waving about the loop.

  **Why this sequence works:**

  1.  **No Retreat to Block:** Starts by directly attacking the possibility of retreat ("are you *distinct* from Block empirically?"). Forces her to own the novelty or admit it's conceptual rearrangement.
  2.  **Empirical Teeth:** Questions 1 & 4 demand testable predictions and neural mechanisms. Question 2 demands falsifiability. This prevents purely philosophical evasion.
  3.  **Core Claim Pressure:** Question 2 targets the *existence/reality* of phenomenal consciousness as separate, the heart of her radical claim.
  4.  **Hidden Assumption Exposure:** Question 3 ruthlessly probes for unstated biological essentialism ("substrate smuggling").
  5.  **Specificity Over Generality:** Each question demands concrete answers: predictions, evidence, mechanisms, functional definitions. No room for vague pronouncements about "richness" or "what it's like."
  6.  **Follow-Up Leverage:** Each answer provides hooks for immediate, incisive follow-ups based on her response (e.g., "If you say X about split-brain, how does that differ concretely from Block's interpretation?" or "If no evidence could convince you, isn't your position unfalsifiable?").

  **Delivery Tips:**

  *   **Preface:** "I want to really pin down the empirical implications and boundaries of your 'Broadcast Gap' thesis..."
  *   **Tone:** Sharp, intellectually engaged, slightly challenging but respectful. Be prepared to politely but firmly push if she tries to deflect or retreat into abstraction.
  *   **Listen & Pounce:** Her answers to each question will dictate precise follow-ups. Be ready to drill down on ambiguity, vagueness, or inconsistencies revealed in her responses, especially regarding implementation, falsifiability, and the artificial intelligence case.

  This sequence cuts straight to the unique, controversial core of her argument and forces her to defend it on empirical and logical grounds, moving decisively beyond Block's framework and generic philosophical discussion. Good luck!
