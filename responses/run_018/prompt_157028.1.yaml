answer: |-
  You've touched on a genuinely interesting case, and I appreciate you pushing on the boundaries where coherence feels counterintuitive. Let me wrestle with this directly: no, coherence doesn't demand psychological rigidity or forbid you from deliberately changing your mind. What it forbids is structuring your choices in a way that guarantees you’ll regret your own actions from your own perspective at the moment of action. That’s the crux.

  When you say this person "genuinely wants" the reversal to happen, we must ask: wanted *by whom*, and *when*? Today’s self wants tomorrow’s self to prefer B over A and act accordingly. But if today’s self simultaneously prefers A over B, we face a profound conflict *within the extended self across time*. The incoherence isn’t in the change itself—it’s in the structure where your current choice (e.g., setting up a commitment device) actively creates a future choice situation that your current self evaluates as worse. You’re engineering a scenario where, from tomorrow’s perspective, picking B over A is subjectively best, yet from *today’s* perspective, having that future self exist and make that choice is undesirable. That’s not growth; it’s intentionally building a trap for your future self that your current self would pay to avoid.

  Consider the concrete stakes. Suppose today you prefer A (say, sobriety) over B (intoxication). You deliberately put yourself in a context tomorrow—say, by going to a party where cravings will be intense—knowing this will make your tomorrow-self prefer intoxication and act on it. Coherence asks: does this plan respect *you* as a single agent persisting through time? From today’s view, you’re spending resources to create a future where you’ll choose an option you currently disprefer. You’re not merely anticipating change; you’re *manufacturing* a future action that violates your current values, knowing you’ll disapprove of it *even as you do it*. That’s not authenticity—it’s fragmentation.

  Being "Dutch-booked" here isn’t about some external bookie profiting; it’s about your successive selves exploiting each other’s inconsistency. Today-you pays a cost (emotional, practical) to enable tomorrow-you to choose B, which today-you dislikes. But if tomorrow-you’s preference is genuine and rational *then*, why wouldn’t today-you defer to it? And if today-you’s preference is authoritative, why enable its violation? The embarrassment isn’t technical—it’s seeing your own hand sabotage your own values across time. Coherence forces you to reconcile these standpoints: either align your actions with your enduring values, or consciously, consistently endorse the transformation. But you can’t rationally *disprefer* the future state you’re *willingly creating*. That’s not flexibility—it’s a failure to own your own agency over time.
