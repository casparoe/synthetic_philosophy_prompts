  Okay, let me start by unpacking the user's query. They're a graduate student leading a seminar on coherence arguments in rational choice theory for undergrads. The main challenge is designing an interactive session that makes abstract concepts like Dutch books and money pumps feel relevant. The user wants to avoid traditional examples like horse races and use a scenario about a researcher deciding whether to preregister a replication study. 

  First, I need to understand the core objectives. The user emphasized moving from concrete failure to axioms, avoiding misconceptions, and linking to scientific methodology. The researcher example is clever because it ties decision theory to real academic pressures—funding uncertainty, replication crises. But how to structure it?

  The key is ensuring the example highlights state-dependent utility without making it seem irrational per se. The researcher's preference reversal when anticipating the study must stem from changing utility (e.g., secured grant money feels different than speculative money), not just belief miscalibration. Amounts should be identical across states to emphasize structural incoherence, not risk attitudes.

  Misconceptions are a big concern. Students might confuse coherence with logical consistency in beliefs. I'll need to clarify that coherence here is about preference structure across states. Also, state-dependent utility isn't inherently irrational—it's common in real life—but it must be handled axiomatically to avoid pumps.

  The session flow should start with the researcher's dilemma, then show how her preferences lead to a money pump. After demonstrating the vulnerability, introduce the axioms as solutions. For checks, ask students to identify violated axioms in the example or design their own money pumps. 

  I'll avoid representation theorems to keep focus on coherence. Briefly mention Allais as a separate issue but skip causal vs. evidential decision theory. Link to scientific rationality by discussing how coherence prevents exploitable plans in research, but don't let it overshadow the conceptual foundation. 

  The user’s deeper need is making formalism feel urgent. The researcher example must make the pump visceral—e.g., her being drained of funds due to inconsistent commitments. Stress that coherence isn't about being "logical" but about avoiding real exploitation.
answer: |-
  Here's a structured teaching plan designed to build conceptual dependencies step-by-step, preempt misconceptions, and achieve your pedagogical goals within 50 minutes. The researcher example is excellent – we'll refine it to maximize impact.

  **Core Objective:** Students understand that coherence arguments expose *structural flaws in preference orderings across states of the world* that make an agent exploitable, not just inconsistencies in probabilistic belief. Coherence is about the *architecture of valuation*, not just belief calibration.

  **Session Structure (50 min):**

  1.  **(5 min) Hook: The Researcher's Dilemma - A Seemingly Rational Plan**
      *   Present the case: Dr. Lee must decide whether to preregister a costly replication study NOW.
      *   **State 1 (S1):** Grant Secured (Funds guaranteed for this purpose).
      *   **State 2 (S2):** Future Funding Uncertain (Needs future grant for the study).
      *   **Choice:**
          *   **Option A:** Preregister NOW (Costs $X upfront, locks in the study).
          *   **Option B:** Delay decision (Costs $0 now, can run later *if* funds available).
      *   **Reveal Dr. Lee's Preferences:**
          *   *In S1 (Grant Secured):* Prefers **A** (Preregister). *Why?* Guarantees the important replication happens; $X is affordable from secured funds. (A > B)
          *   *In S2 (Funding Uncertain):* Prefers **B** (Delay). *Why?* Avoids wasting $X if the study might never run; conserves scarce resources. (B > A)
      *   **Key Setup:** Emphasize these preferences feel *individually reasonable* given the different situations. State-dependence seems justified. **Amounts MUST be identical ($X)**. The difference is in the *meaning/significance* of spending $X given the state (utility dependence), not the monetary amount or risk per se.

  2.  **(10 min) Introducing the Exploit: The Money Pump Emerges**
      *   **Scenario:** Dr. Lee is *currently* in **S2** (Funding Uncertain). She prefers **B** (Delay). She commits to Delay.
      *   **State Shift (Plausible):** Shortly after, her grant is unexpectedly approved! She's now in **S1** (Grant Secured). She now prefers **A** (Preregister). She pays $X to switch from Delay to Preregister.
      *   **Consequence:** She ends up preregistered (Option A), but has paid $X *to get to the state she could have been in originally if she'd chosen A in S2*. She paid $X for nothing! She's $X worse off than if she had chosen A in S2 initially (which she didn't want then).
      *   **The Pump Potential:** Point out a clever "funding manager" could engineer this sequence (or similar cycles if preferences reversed again) to repeatedly extract money from her as states shift and she updates her choice based on her *state-dependent* preference.
      *   **Crucial Question:** *"What's the flaw? Her preferences in each state made sense individually. Why is she poorer?"* Guide discussion towards the *reversal across states* as the vulnerability.

  3.  **(10 min) Diagnosing the Flaw: Preference Structure, not Belief**
      *   **Reframe the Problem:** The issue isn't her *beliefs* about getting the grant changing (that happened *after* her initial choice). The issue is the *structure of her preferences across the possible states*.
      *   **Introduce Key Concept:** Her preferences violate **State-Wise Dominance** or a core **Ordering Axiom** (Completeness/Transitivity) *when viewed across the state space*. In S2, B > A. In S1, A > B. There's no single, coherent ranking of A vs. B *independent of which state occurs*.
      *   **Contrast Belief vs. Preference Coherence:**
          *   *Belief Coherence (Dutch Books):* Avoids probabilistic contradictions (e.g., P(A) + P(not A) != 1). About *describing the world* consistently.
          *   *Preference Coherence (Money Pumps):* Avoids contradictions in *how you value outcomes across possible worlds*. About *structuring your desires* consistently. **This is the critical distinction.**
      *   **Preempt Misconception:** Explicitly state: "State-dependent utility isn't *inherently* irrational (e.g., valuing an umbrella more when it rains). The problem arises when it leads to *cyclic or exploitable preference reversals* relative to the state space. Coherence arguments show what *structure* prevents this exploitability."

  4.  **(15 min) The Axiomatic Solution: Preventing the Pump**
      *   **Goal:** Identify the minimal constraints needed to block money pumps like Dr. Lee's.
      *   **Introduce Core Axioms (Intuitively):**
          *   **Completeness:** For any two options (like A and B), you must have a preference (or indifference) *regardless of the state*. (Dr. Lee lacked a stable preference for A vs. B).
          *   **Transitivity:** If you prefer A to B and B to C, you must prefer A to C. (Prevents cycles via intermediate options).
          *   **Independence / Sure-Thing Principle (Simplified):** Your preference between two options shouldn't change based on what happens in states where they yield the *same* outcome. (This directly attacks the core of Dr. Lee's reversal: In states where A and B have the *same* consequence regarding running the study *later*, her preference shouldn't flip based on S1/S2 if the outcome there is identical. In her case, the outcomes *differ* in value across states, violating the underlying assumption needed for Independence).
      *   **Link Back to Example:** Show how forcing Dr. Lee to satisfy Completeness and Transitivity (and implicitly, the structure imposed by Independence/Sure-Thing Principle) *requires* her to have a stable preference between A and B *across S1 and S2*, eliminating the reversal that enabled the pump. E.g., she must consistently prefer Preregistering (if she values the certainty highly enough) or consistently prefer Delaying (if avoiding upfront cost is paramount), regardless of the funding state.
      *   **State-Dependence Clarification:** Axioms *allow* state-dependent utility (different value for $X in S1 vs S2), but *constrain how it can manifest* in preferences over acts. The utility function becomes state-dependent within a coherent representation. The axioms prevent the *incoherent interaction* of state-dependence with choice.

  5.  **(5 min) Check for Understanding & Misconception Busting**
      *   **Activity:** Pose a quick scenario: "Pat prefers $100 in Sunshine to $100 in Rain. Pat also prefers a free umbrella in Rain to $100 in Rain. Pat is indifferent between $100 in Sunshine and the free umbrella in Sunshine. Can Pat be money-pumped? Why/why not?" *Answer:* Probably not. Preferences seem state-dependent but potentially coherent (no obvious cycle). The key is whether preferences over *acts* (combinations of outcomes across states) lead to reversals like Dr. Lee's. Pat's preferences *might* be representable coherently with state-dependent utility.
      *   **Targeted Questions:**
          *   "Was Dr. Lee's problem that she misjudged the probability of getting the grant?" (No, the exploit happened *after* the state changed; the flaw was in *preference structure*).
          *   "Does coherence require you to value $100 the same whether you're rich or poor?" (No! State-dependent utility is fine. Coherence requires your *preferences over actions* don't reverse exploitably based on states).
          *   "If someone rejects these axioms, does it mean they are 'irrational'?" (Not necessarily; they might adopt a *different* normative framework, e.g., one prioritizing regret minimization or resource-context sensitivity over exploitability-avoidance. But they must accept they are vulnerable to money pumps).

  6.  **(5 min) Connection & Wrap-up: Why This Matters for Science**
      *   **Brief Application:** Link back to science. Coherence arguments highlight the vulnerability of *methodological plans* (like replication strategies) that involve sequences of decisions under uncertainty where preferences might seem context-dependent. A researcher with incoherent preferences could be "pumped" into wasting resources through poorly timed commitments or reversals (e.g., abandoning a preregistered analysis only to redo it later at higher cost).
      *   **Normative Claim:** Proponents argue rational scientific planning *should* avoid such structural vulnerabilities. Coherence provides a minimal standard of non-exploitability in planning.
      *   **What We Didn't Cover (Explicitly):** "We focused on the *structural* argument against money pumps – the axioms. We haven't covered the full mathematical machinery of *representation theorems* (like Savage's) that prove these axioms imply EU maximization. We also haven't delved into challenges like the Allais Paradox (which questions Independence) or the Causal/Evidential distinction. These are crucial topics, but for today, grasp the core coherence argument: *Exploitability reveals a flaw in preference structure across states, fixed by specific axioms.*"
      *   **Final Thought:** "Is avoiding money pumps the *only* or *supreme* requirement for scientific rationality? Probably not (think epistemic values, robustness). But does it highlight a real, practical danger in inconsistent planning under uncertainty? Dr. Lee's story suggests yes."

  **Crucial Refinements for Your Example:**

  *   **State-Dependence:** Must be **transparent and acknowledged** by the agent (Dr. Lee). The *rationale* for her reversal (utility of $X differs in S1 vs S2) should be clear. The flaw isn't hidden irrationality; it's the structural consequence of that reasonable state-dependence.
  *   **Monetary Amounts:** Keep them **identical ($X)**. Scaling would conflate the issue with risk aversion or diminishing marginal utility. We want to isolate the state-dependent *utility* effect.
  *   **Introducing Coherence Type:** Introduce "structural coherence" **after** presenting the pump (Step 3) as the diagnosis. Introduce "dynamic coherence" **during Step 2** as the *manifestation* of the structural flaw over time. Emphasize the pump is *symptomatic* of the underlying structural defect.

  **Predictable Misconceptions & When to Address:**

  1.  **"Coherence = Belief Consistency":** Address **immediately when introducing the Money Pump (Step 2/3)**. Contrast: "The Dutch Book punishes inconsistent beliefs (probabilities not adding to 1). The Money Pump punishes inconsistent *valuations* across different possible worlds (states)."
  2.  **"State-Dependent Utility is Irrational":** Preempt in **Step 1** by making her rationale sensible. Explicitly state its potential rationality in **Step 3** ("State-dependent utility isn't inherently irrational..."). Reiterate in **Step 4** when showing axioms allow it.
  3.  **"Rejecting Coherence Means Embracing Arbitrary Reversal":** Address in **Step 5** (Check). Frame alternatives as *different normative frameworks* with their own costs (vulnerability to pumps) and potential benefits.
  4.  **Confusing Risk Attitude with Structural Flaw:** Prevented by using **identical $X** and emphasizing the *rationale* is about state-context, not diminishing utility per se. Address explicitly if it arises: "Is she reversing because $X hurts more when she's poor? That's state-dependent utility, which *can* be coherent. The flaw is the *reversal pattern* relative to the states."

  **What to Explicitly Leave Out:**

  *   **Representation Theorems:** Mention them as the "next step" (proving EU maximization *follows from* the axioms) but **do not develop**. Say: "Today's focus is *why* we need these axioms to avoid pumps."
  *   **Causal vs. Evidential Decision Theory:** **Defer entirely.** This is a major topic requiring its own session. Mentioning it will confuse the core structural point.
  *   **Allais Paradox:** **Mention only in wrap-up** as an example challenging a specific axiom (Independence), contrasting it with the money pump challenge to the *foundational structural coherence*. Do not develop it.
  *   **Detailed Alternative Frameworks (e.g., Regret Theory):** **Mention only in Step 5/Wrap-up** as existing alternatives that accept exploitability. Do not explain them.

  **Balancing Science Application:** The Dr. Lee example *is* the application. The **wrap-up (Step 6)** is where you explicitly generalize the lesson to scientific planning vulnerability ("plans involving sequences of decisions under uncertainty..."). Keep this to **3-5 minutes max.** The key is showing *how* the conceptual flaw (structural incoherence) maps onto a practical scientific vulnerability (exploitable research plans). Don't get drawn into a debate about specific scientific practices; focus on the *type* of vulnerability coherence exposes.

  This plan prioritizes building the dependency: Concrete Failure (Pump) -> Symptom (Preference Reversal) -> Diagnosis (Structural Flaw) -> Cure (Axioms) -> Significance (Non-Exploitability in Planning). Good luck!
