prompt: |-
  Say you're advising a small research group — like three post-docs for two years — on escalation dynamics and commitment traps. I'm trying to work out where the conceptual work actually is versus just running more experiments. There's the classic dollar-auction framing, but I'm particulary interested in a twist: what if escalation isn't mainly sunk-cost reasoning but a 'reputational lock-in' where agents keep bidding because withdrawing signals weakness to obsrevers, a kind of second-order commitment trap?

  Given that, which open questions should they prioritise? I'm torn between: (1) whether reputational lock-in can be separated formally from rational sunk-cost reasoning, (2) how escalation scales differently in collective versus individual decision-making, and (3) whether there's a robust distinction between 'rational escalation' and 'pathological escalation' once observer effects are in the model.

  Rank them in terms of upstream dependency — which answer reshapes the others — and say what kind of result (formal, empirical, conceptual) would actually change your mind. Don't bother with bibliographies or citation lists; I'm just trying to place my dissertation chapter.

  Please lead with your bottom line in the first sentence — the single question you'd fund first — then the reasoning. No preamble, and don't restate the question.
reasoning: |-
  Hmm, the user is asking for advice on prioritizing research questions for a small group studying escalation dynamics, focusing on reputational lock-in as opposed to sunk-cost reasoning. They've proposed three specific questions and want them ranked by "upstream dependency" - meaning which one would most fundamentally reshape the others if answered. They also want to know what kind of evidence would change my mind about each question.

  I need to analyze these three questions carefully. The first is about formally separating reputational lock-in from sunk-cost reasoning. The second examines how escalation differs between collective and individual decision-making. The third questions whether there's a meaningful distinction between rational and pathological escalation when observer effects are present. 

  Considering upstream dependency, the first question seems most fundamental. If we can't formally distinguish reputational lock-in from sunk-cost reasoning, it undermines the entire premise of studying reputational dynamics as a distinct phenomenon. This would affect how we approach the other questions about collective behavior and rationality distinctions.

  For the second question about collective vs individual decision-making, while important, it seems more downstream. We'd need to first establish reputational lock-in as a distinct mechanism before examining how it scales in groups. Similarly, the third question about rational vs pathological escalation depends on having a clear model of reputational mechanisms to begin with.

  The user mentions they're working on a dissertation chapter and seem concerned about conceptual depth versus just running experiments. They appear to be an academic, probably in political science, economics or psychology, looking for strategic research direction. Their deeper need might be to establish a novel theoretical contribution rather than incremental experimental work.

  For what would change my mind: For question 1, I'd need formal modeling showing these mechanisms are indistinguishable under general assumptions. For question 2, empirical evidence that collective dynamics don't introduce new escalation pathways would be convincing. For question 3, a conceptual argument demonstrating the rationality distinction collapses when observers are strategic would be persuasive.

  I'll structure my response to lead with the recommendation to prioritize question 1, then explain the upstream dependency logic, and finally specify for each question what evidence would change my position.
answer: |-
  **Fund question (1) first: whether reputational lock-in can be formally separated from rational sunk-cost reasoning.**

  **(1) is upstream:** If reputational lock-in *cannot* be formally distinguished from sunk costs (e.g., if models show they produce identical bidding functions or equilibria under rational expectations), then (2) and (3) become fundamentally misguided. Resolving (1) defines the core phenomenon. If they *are* separable, it validates the reputational construct, forcing a redesign of models for (2) and (3) to incorporate distinct reputational state variables/incentives. If inseparable, (2) and (3) likely collapse back into standard sunk-cost analyses.

  **(2) is midstream:** It assumes reputational lock-in *exists* as a distinct mechanism (established by resolving (1)). Its answer (how groups amplify or mitigate reputational escalation) depends entirely on *how* reputation is modeled in (1) (e.g., as a public belief, a costly signal, a network effect). Results here wouldn't reshape (1) but would critically constrain viable mechanisms for (3).

  **(3) is downstream:** Defining "rational" vs. "pathological" escalation *presupposes* a validated model of reputational incentives (from (1)) and an understanding of how they manifest in relevant decision units (from (2)). It's a normative/efficiency question applied to the framework built by (1) and (2). Answering (3) wouldn't reshape the prior foundations.

  **Evidence to change my mind:**
  *   **For (1):** A **formal model** proving reputational concerns are *observationally equivalent* to sunk costs in payoff structures or equilibrium outcomes under rational actors with common knowledge would make me abandon the distinction. Conversely, a model showing distinct, testable behavioral predictions (e.g., differential sensitivity to audience opacity vs. prior investment visibility) would cement it.
  *   **For (2):** **Empirical evidence** (lab/field) showing collective decisions exhibit *no* significant reputational escalation dynamics *absent* in equivalent individual decisions under the same reputational incentives (e.g., same audience, same stakes), or showing dynamics identical to simple aggregation of individual sunk costs, would undermine its unique importance.
  *   **For (3):** A **conceptual argument** (supported by simulations) demonstrating that *any* equilibrium involving rational reputational bidding under observer effects *necessarily* satisfies standard definitions of efficiency or welfare (i.e., pathological escalation is just efficient signaling), making the distinction incoherent.
