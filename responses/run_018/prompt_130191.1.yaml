  First, I need to list phenomena the theory must explain. Rapid collapse vs. slow erosion, banned practices persisting in private, elite vs. mass adoption gaps. Each needs a motivating case. The wardrobe problem is crucial—practices becoming ridiculous before moral arguments catch up. Also, distinguishing mechanisms: moral argument, honor restructuring (Appiah), and material interest. The constraint that slavery was profitable but dueling wasn't, yet both ended around the same time.

  Considering philosophical references: Williams' skepticism on rational argument and Appiah's honor thesis. The user wants criteria, not scoring these theories. They also want to flag which desiderata are non-negotiable, which are preferences, and which pairs conflict. Plus, identifying the requirement that disqualifies most popular theories.

  Now, deeper needs: The user is a novelist seeking authenticity in depicting moral shifts. They need a framework that avoids oversimplification, capturing nuance like symbolic changes (wardrobe problem) and varied mechanisms. They might want to show characters navigating these changes without didacticism. The theory must handle contradictions (profitability vs. abolition) and societal layers (elites vs. masses).

  I should structure the desiderata clearly. Start with phenomena, then mechanisms, the wardrobe problem, profitability constraint, and philosophical references. Non-negotiables include explaining both rapid/slow changes and the profitability paradox. Preferences might be the wardrobe problem's emphasis. Conflicting pairs could be material interest vs. symbolic shift. The key eliminator is the profitability constraint, as many theories tie morality to economics, which fails here.

  Need to ensure each point ties back to historical cases. For example, dueling collapsed partly due to ridicule, while slavery's profit didn't prevent abolition. Highlight how moral language follows social change, not precedes it. Also, note where Williams and Appiah fit without delving into critique. Finally, clarify which criteria are essential versus stylistic to guide the user's theory choice without prescribing solutions.
answer: |-
  Here are the desiderata for a theory of moral revolution, tailored to your historical novelist's needs and the specific phenomena you highlighted:

  **Core Phenomena Requiring Explanation (The "What"):**

  1.  **The Velocity Gradient:** Why do some deeply entrenched norms collapse with astonishing speed (e.g., dueling in Britain c. 1840s; public racial segregation in US c. 1960s), while others erode slowly over generations (e.g., blasphemy laws, certain gender norms)? *(Motivating Case: Dueling's rapid fall vs. the slow, contested death of slavery's justifications/aftermath)*
  2.  **The Privacy Paradox:** How do practices persist robustly in private spheres long after being formally banned or publicly condemned (e.g., domestic violence, discreet racism, honor-killings in diaspora)? *(Motivating Case: Slavery's persistence as "apprenticeship" or covert practices; dueling rumors persisted but lacked public sanction)*
  3.  **The Elite-Mass Chasm:** Why is there often a significant lag between the adoption of a new norm by "moral entrepreneurs" (intellectuals, reformers, avant-garde elites) and its widespread acceptance or internalization by the broader population? *(Motivating Case: Abolitionist elites vs. widespread popular racism/economic dependence; early anti-dueling advocates vs. military/genteel persistence)*
  4.  **The Profitability Puzzle:** How can practices vanish despite being highly profitable and materially entrenched (slavery), while others disappear despite *lacking* significant material benefit for most participants (dueling for non-elites who aped it)? *(Motivating Case: Slavery's immense profitability vs. Dueling's cost/risk for participants - yet both fell within overlapping generations)*
  5.  **The Wardrobe Problem:** How do practices become socially unsustainable primarily through shifts in sensibility, aesthetics, and perceived *ridiculousness* long before a decisive moral argument "wins"? How does moral language often follow, rather than lead, this shift? *(Motivating Case: Dueling's elaborate rituals becoming absurd theatre, mocked in literature/life before ethical arguments prevailed; sumptuary laws)*

  **Mechanistic Requirements (The "How" - Non-Negotiable Distinction):**

  6.  **Disentangled Mechanisms:** The theory **must** provide distinct analytical pathways (though they may interact) for change driven by:
      *   **Moral Argumentation:** Appeals to conscience, principle, religious doctrine, universal rights.
      *   **Honor Restructuring (Appiah):** Shifts in the social meaning of status, dignity, shame, and what constitutes admirable/contemptible behavior within a community.
      *   **Material Interest:** Changes in economic incentives, power structures, technological shifts, or perceived costs/benefits.
      *(Constraint: Cannot collapse these into a single "reason" or imply one is always primary; must allow for their independent operation and complex interplay)*

  **Incorporating Key Insights (Placeholders - Weight on Criteria):**

  7.  **Williams' Skepticism Slot:** The theory must accommodate the possibility that explicit moral *reasoning* (syllogisms) often functions more as *ex post facto* justification, rationalization, or rhetorical weaponization than as the primary *engine* of deep normative change. (This doesn't preclude its role, but challenges its primacy).
  8.  **Appiah's Honor Thesis Slot:** The theory must provide a conceptual space where shifts in the structure of *honor*, *shame*, and social recognition can be a primary driver of normative change, independent of pure moral argument or material interest.

  **Classification of Desiderata:**

  *   **Non-Negotiable:**
      *   Explaining the **Velocity Gradient** (1).
      *   Explaining the **Profitability Puzzle** (4) - This is the key constraint unique to your cases.
      *   Providing **Disentangled Mechanisms** (6) - Core to avoiding reductionism.
      *   Accommodating Williams' Skepticism (7) - Essential for your "weather not syllogism" view.
      *   Accommodating Appiah's Honor Thesis (8) - Essential for phenomena like dueling.
  *   **Camp Preferences (Strongly implied by your writing):**
      *   Prioritizing explanation of the **Wardrobe Problem** (5) - Your emphasis on costumes/sensibility.
      *   Focusing on the **Elite-Mass Chasm** (3) - Crucial for depicting societal layers in novels.
      *   Viewing moral argument as often *following* sensorial/social shifts (implicit in 5 & 7).
  *   **Potentially Jointly Unsatisfiable Pairs (Tensions to Navigate):**
      *   **Material Primacy vs. Profitability Puzzle (4 & 6c):** Theories heavily reliant on material interest struggle immensely with the abolition of profitable slavery vs. the disappearance of unprofitable dueling. Resolving this tension is a major hurdle.
      *   **Rapid Collapse (1) vs. Privacy Paradox (2):** Explaining why a norm collapses publicly but persists privately requires handling different levels of social enforcement/internalization. A theory emphasizing speed might struggle with persistence, and vice versa.
      *   **Moral Argument Primacy vs. Williams' Skepticism (6a vs. 7):** Theories requiring moral argument as the *primary* driver conflict directly with Williams' view of its secondary, justificatory role.

  **The Theory Eliminator:**

  The single requirement that eliminates the largest share of popular theories (especially simplistic ones) is the **Profitability Puzzle (4): Slavery was highly profitable; dueling was not (for most), yet both vanished within overlapping generations.**

  *   **Why it Eliminates:** Most popular theories lean heavily on one primary driver:
      *   **Pure Materialism/Economic Determinism:** Utterly fails to explain why unprofitable dueling persisted so long *and* why highly profitable slavery was abolished without immediate, overwhelming material replacement (it wasn't).
      *   **Pure Idealism/Moral Progress:** Struggles to explain why the *same* generation (broadly) rejected both, despite vastly different moral arguments and timelines. If pure moral enlightenment drove abolition, why did it take so long? Why did dueling fall faster if it was "less evil"? It also struggles with the Wardrobe Problem.
      *   **Simplistic Social Control Theories:** Often can't distinguish between the mechanisms for banning profitable vs. unprofitable practices or explain the velocity differences.
      *   **Pure Honor-Theory (without nuance):** While powerful for dueling, a theory relying *only* on honor restructuring struggles mightily with slavery's abolition, which involved massive material interests, complex moral arguments, and geopolitical power struggles far beyond the dynamics of gentlemanly honor.

  **Synthesis for Your Plotting:**

  An adequate theory must be multi-mechanistic and context-sensitive. It must show how shifts in sensibility and honor (the "weather," the wardrobe becoming ridiculous) can undermine a practice's social foundation *before* moral arguments crystallize victory. It must explain how material interests can be overcome by a confluence of other forces (shame, changing honor codes, institutional pressure, *eventual* moral consensus) in the case of slavery, while practices sustained primarily by honor codes (dueling) can collapse rapidly once that code is successfully challenged and mocked. It must account for the lag between elite pronouncements and mass feeling, and the stubborn persistence of the old norms in private. Crucially, it must do this without reducing the abolition of slavery to mere economics or the fall of dueling to mere moral awakening, while acknowledging that both material forces *and* moral arguments played crucial, but distinct and non-primary, roles in each unique revolution. The "weather" – the changing atmosphere of what feels acceptable, honorable, or ridiculous within the drawing rooms and reflected in the costumes – is often the first and most potent sign of the coming storm.
