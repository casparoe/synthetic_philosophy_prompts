prompt: |-
  I'm preparing a graduate seminar on the School of Names (Mingjia), and I have noticed what seems to be a modern institutional echo of Gongsun Long's white-horse argument running through three very different bureaucratic systems. In international tariff schedules, a compound description such as "leather footwear with synthetic soles" is assigned a distinct regulatory code, duty rate, and inspection protocol from "leather footwear" alone; the compound is administratively treated not as a subset but as a separate kind, even when the physical goods differ only by that single added feature. By contrast, agricultural subsidy forms code "white horse" and "horse" under the identical livestock category, treating the color modifier as administratively invisible. Meanwhile, our university's course-catalog ontology assigns separate curricular IDs, prerequisite chains, and learning-outcome frameworks to "Political Philosophy" and "Political Philosophy: Global Justice"; the compound is filed not as a specialization of the simple course but as a parallel track with its own requirements, despite the fact that the unmodified course is never actually offered on its own.

  What implicit theory of naming, kind-membership, and property-combination do these practices collectively presuppose? Do they assume, with the School of Names, that adding a qualifier introduces a new essence—so that "white horse" is genuinely not "horse"—or do they instead presuppose a purely nominalist, administratively convenient division with no ontological commitment? Reconstruct the implicit ontology shared across these cases, distinguish what they strictly presuppose from what they merely accommodate, and assess whether the three practices are mutually consistent or quietly pull in opposite directions. Then tell me what a uniform classification scheme—say, a strictly extensional, intersection-based system that treats every compound as a subset of its simpler terms—would require these institutions to change, and take a definite stand on whether such a reform would be philosophically sound or administratively disastrous. Keep your response committed and specific, and do not exceed 350 words.
reasoning: |-
  Hmm, the user is preparing a graduate seminar on the Mingjia (School of Names) and has noticed an interesting parallel between Gongsun Long's white-horse paradox and three modern bureaucratic classification systems. They've observed three different approaches to handling compound terms: international tariffs treat "leather footwear with synthetic soles" as distinct from "leather footwear," agricultural subsidies treat "white horse" and "horse" as identical, and university catalogs treat "Political Philosophy: Global Justice" as separate from "Political Philosophy" even though the latter isn't offered.

  The user wants me to analyze the implicit theory of naming and ontology behind these practices. They're specifically asking whether these systems follow the School of Names view that adding a qualifier creates a new essence (where "white horse" is not "horse"), or if they're simply nominalist classifications without ontological commitment. I need to reconstruct the shared ontology, distinguish what's presupposed from accommodated, assess consistency, and propose what would happen if we applied a uniform extensional classification system.

  Looking at these cases: The tariff system seems to follow Gongsun Long's view where adding a qualifier ("synthetic soles") creates a fundamentally new category that isn't a subset. Agricultural subsidies take the opposite approach, ignoring modifiers like color completely. The university system creates parallel tracks that functionally treat the modified course as a distinct entity rather than a specialization.

  All three systems share a pragmatic ontology where administrative salience drives classification - meaning they care about what properties matter for their specific purposes. They presuppose that classification serves functional goals rather than reflecting inherent essences. The tariff system cares about material composition, agriculture cares about livestock type regardless of color, and universities care about curricular structure.

  A strictly extensional system would be problematic in practice. For tariffs, ignoring modifiers would lump products with different material compositions together. In agriculture, it would create unnecessary subdivisions where none are needed. For universities, it would collapse specialized courses into generic ones. While philosophically "clean," it would be administratively disastrous as it ignores functional distinctions that matter to each system.

  The reform would be unsound because it ignores the fact that modifiers often indicate functionally significant differences. The School of Names insight holds here - administrative systems rightly treat salient property-combinations as operationally distinct kinds when those properties carry practical consequences.
answer: |-
  Your three cases share a pragmatic, functionally-driven ontology where classification is determined by **operational salience**, not essence or mereology. Each system presupposes that:

  1.  **Modifiers create administratively distinct entities when they introduce functionally relevant differences.** Tariffs care about material composition affecting production/trade ("synthetic soles" changes duties/protocols). Universities care about specific content focus affecting curricula ("Global Justice" changes prerequisites/outcomes). Here, adding a modifier *does* create a new administrative kind ("white horse is not horse" in practice).
  2.  **Modifiers are administratively invisible when they denote irrelevant variation.** Agriculture cares about livestock *type* for subsidies; color is irrelevant noise. "White horse" *is* "horse" for this purpose.

  **Shared Presupposition:** Classification serves specific institutional goals. Kinds are defined by *properties salient to the system's function*, not inherent essences or logical subsets. Ontological commitment is only to the *pragmatic efficacy* of the distinction.

  **Distinction:**
  *   **Presupposed:** Properties have variable salience depending on context. Classification is purpose-relative.
  *   **Accommodated:** The systems are agnostic on whether "white horse" *essentially* differs from "horse" in the abstract. They care only if the difference *matters here*.

  **Consistency?** While all are pragmatic, they pull in opposite directions regarding modifiers: tariffs and universities *amplify* modifier significance, agriculture *erases* it. The inconsistency lies in the *treatment of modification*, not the underlying pragmatism.

  **A Uniform Extensional System (Subset-Based):**
  This would require:
  1.  **Tariffs:** All footwear with leather uppers, regardless of sole material, sharing one code/rate. "Leather footwear with synthetic soles" becomes a sub-code under "Leather footwear" with identical core rules unless *every* sub-type difference triggers a unique rule (administrative chaos).
  2.  **Agriculture:** "White horses" automatically qualify under "Horses". No change needed; it already aligns.
  3.  **University:** "Political Philosophy: Global Justice" becomes a specialized section *under* "Political Philosophy," inheriting core requirements. The distinct ID and potentially unique prerequisites/outcomes vanish unless the parent course ("Political Philosophy") actually exists independently (which it doesn't).

  **Assessment:** This reform would be **administratively disastrous and philosophically unsound**.
  *   **Philosophically:** It ignores the School of Names' valid point: adding a salient property (soles, justice focus) *does* create a functionally distinct entity in specific contexts. A purely extensional view fails to capture operational realities.
  *   **Administratively:** Tariffs lose crucial differentiation, harming trade policy. Universities lose the ability to structure distinct curricular pathways. Only agriculture benefits, but forcing uniformity destroys the functional purpose of the other systems. Pragmatic salience, not set theory, must drive classification.
