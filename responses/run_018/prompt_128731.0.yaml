answer: |-
  Here's the thought experiment:

  **Scenario:** The prosperous, orderly coastal city-state of **Prospera** (authoritarian, China/Singapore-inspired) emerges from a crisis. Simultaneously, the neighboring democratic region **Civitas** collapses into dysfunction and poverty during the same crisis. Prospera's success is remarkable: rapid, evidence-based crisis zoning prevents chaos, targeted subsidies stabilize key industries, and efficient infrastructure projects spur recovery, all maintained with low crime and high growth. Unbeknownst to all, Prospera's ruling council secretly possesses and meticulously implements the *complete, pre-collapse crisis policy blueprint* meticulously designed through open debate, expert consultation, and legislative compromise in Civitas' democracy. Prospera's regime adds *only* ruthless, non-ideological enforcement and coordination, stripping out Civitas' public deliberation and accountability mechanisms. The outcomes (prosperity, order) are identical to what Civitas *aimed for* but failed to achieve.

  **Analysis:**

  1.  **Pure Performance Legitimacy Theorist:** "Endorsement is mandatory. Prospera delivers the goods: stability, growth, effective crisis management, and public safety. The population is materially better off than under chaos. The *source* of the policies is irrelevant; the regime's *competence* in identifying and flawlessly executing optimal solutions (rapid zoning, efficient subsidies) is what matters. Authoritarian coordination enabled this effective implementation where democracy failed. The outcomes justify the system."
      *   **Attack on the Case:** "You misattribute cause! Prospera didn't *just* copy; they *successfully implemented* where Civitas failed. This proves authoritarian efficiency *was* the crucial causal factor. Copying shows pragmatism, not weakness. The regime identified the best plan and made it work – that *is* performance. Removing copying wouldn't change this; the regime demonstrated superior capacity by *choosing* and *executing* the right plan."

  2.  **Pure Procedural Democrat:** "Rejection is absolute. Prospera's success is built on stolen labor – the policy designs born of Civitas' democratic process (debate, representation, accountability). The regime rules without consent, stifles dissent, and offers no mechanism for the people to choose leaders or influence policy. The good outcomes are morally tainted fruits of a poisonous tree. Even identical prosperity achieved through coercion and theft of intellectual/political capital lacks legitimacy. Order maintained without freedom is oppression."
      *   **Crucial Feature:** The **covert copying of democratically designed policies** is key. Remove this, and the procedural critique weakens significantly (if Prospera designed its *own* successful policies autocratically). The copying reveals the regime's success isn't endogenous to authoritarianism but parasitic on democratic creation.

  3.  **Liberal Instrumentalist (Performance + Democratic Guardrails):** "Rejection, with concern. The outcomes are desirable, but the *means* and *future risks* are unacceptable. Prospera lacks the democratic guardrails (free press, independent courts, elections, civil liberties) necessary to ensure policies *remain* optimal, adapt to changing needs, prevent corruption, and protect against tyranny. The current success is contingent on stolen blueprints and possibly benevolent autocrats. Without democratic feedback loops, misrule is inevitable long-term. Performance legitimacy requires *both* results *and* the procedural mechanisms that sustainably generate good governance and protect rights."
      *   **Breaking Point:** The reliance on **stolen designs** highlights the regime's lack of *endogenous capacity for sustainable innovation and adaptation*. Without democratic processes, how will Prospera generate the *next* generation of successful policies once the copied blueprint is exhausted or outdated? The guardrails aren't just about rights; they're about sustained performance.

  **The Twist's Work:** The covert copying severs the assumed causal link between authoritarianism and *policy innovation/design quality*. It forces the performance theorist to defend a regime whose success stems not from its *own* superior coordination generating novel solutions, but from its ability to *steal and enforce* solutions created elsewhere through democratic (but ultimately failed) processes. The performance theorist must argue that ruthless execution alone is the defining performance metric, regardless of the origin of the ideas being executed. The proceduralist and liberal highlight the theft and the inherent instability/illegitimacy of a system reliant on it.
