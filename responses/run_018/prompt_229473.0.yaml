prompt: |-
  Before I read any further on Kelly betting and geometric rationality, I would like the specification rather than another restatement of the formula. Please write the desiderata that an adequate theory of stake sizing for repeated, multiplicative gambles — a gambler who each round wagers some fraction of current wealth on a favourable bet — must meet, with the case or consideration that makes each one a genuine requirement. In particular, I would like you to adjudicate which of the following are real requirements and how each should be stated: (i) a policy must be consistent with survival, so that it cannot treat a wager of the entire bankroll on a positive-expectation bet with any chance of loss as acceptable, and more generally must distinguish a favourable expectation from a sensible stake size; (ii) a policy must capture the overbetting phenomenon, in which stakes above the growth-optimal fraction reduce expected log-growth, and stakes sufficiently far above it make that growth negative so that typical wealth declines over time even though the arithmetic expectation of wealth may remain attractive; (iii) a policy must generalise from a single sequence of independent identical bets to a portfolio of simultaneous correlated bets, since covariance between outcomes changes the appropriate allocation even when each bet is individually favourable; (iv) a policy must say what to do under uncertain or shifting probabilities, including whether one ought deliberately to bet only a fraction of the apparent optimum; and (v) a policy must either reconcile itself with expected utility theory or explain why the apparent conflict is illusory — in particular, whether growth-optimal staking is rationally mandatory only for an agent with logarithmic utility. For each desideratum, say whether it is non-negotiable or a camp-specific preference, and flag any pair you suspect cannot be jointly satisfied. Keep the scorecard of existing positions brief; the criteria and their motivation are what interest me.
reasoning: |-
  We are to list desiderata for an adequate theory of stake sizing for repeated multiplicative gambles. The gambler wagers a fraction of current wealth each round on a favorable bet. We are to evaluate the given points (i)-(v) as requirements, stating the case for each and whether it is non-negotiable or a camp-specific preference. We also note any potential conflicts.

  **Desideratum (i):**  
  *Statement:* A policy must be consistent with survival, so that it cannot treat a wager of the entire bankroll on a positive-expectation bet with any chance of loss as acceptable, and more generally must distinguish a favourable expectation from a sensible stake size.  
  *Case:* Even if a bet has positive expectation, betting the entire bankroll (or more) risks ruin with positive probability. Since the gambler faces a sequence of bets, survival (non-ruin) is a prerequisite for long-term growth. A theory that recommends betting the entire bankroll on a single bet that has a positive chance of loss (even if the expectation is positive) is inadequate because it risks immediate ruin and thus prevents future opportunities. This requirement forces the theory to recommend a fraction of wealth that avoids ruin.  
  *Non-negotiable?* Yes. Any theory that allows ruin with positive probability in a single bet when there are future bets is fundamentally flawed for repeated play. It is non-negotiable that the policy must avoid certain ruin and be sustainable.

  **Desideratum (ii):**  
  *Statement:* A policy must capture the overbetting phenomenon, in which stakes above the growth-optimal fraction reduce expected log-growth, and stakes sufficiently far above it make that growth negative so that typical wealth declines over time even though the arithmetic expectation of wealth may remain attractive.  
  *Case:* In repeated multiplicative bets, the long-run growth rate is given by the expected logarithm of wealth. There exists a fraction (the Kelly fraction) that maximizes this growth. Betting more than this fraction (overbetting) leads to a lower growth rate and, if taken to an extreme, can cause the expected log-growth to become negative (meaning wealth tends to zero over time). This is a key insight because it shows that more than a good bet is not always better; there is an optimal amount to bet. A theory that does not account for overbetting would not protect the gambler from self-destructive behavior.  
  *Non-negotiable?* Yes. This is a fundamental property of multiplicative dynamics and long-run growth. Ignoring it would lead to suboptimal or even disastrous strategies. Thus, it is non-negotiable.

  **Desideratum (iii):**  
  *Statement:* A policy must generalise from a single sequence of independent identical bets to a portfolio of simultaneous correlated bets, since covariance between outcomes changes the appropriate allocation even when each bet is individually favourable.  
  *Case:* In real-world scenarios, gamblers (or investors) often face multiple bets at the same time (a portfolio) and these bets may be correlated. The optimal stake in each bet is not independent of the others because the covariance structure affects the overall risk. For example, hedging can occur when bets are negatively correlated. A theory that only handles a single bet or independent bets would be insufficient for practical applications.  
  *Non-negotiable?* Yes for a comprehensive theory. However, one might argue that a theory for simple cases is still useful. But since the goal is an "adequate theory" for repeated multiplicative gambles, which naturally occur in portfolios, this is non-negotiable for a general theory. Without it, the theory would be incomplete.

  **Desideratum (iv):**  
  *Statement:* A policy must say what to do under uncertain or shifting probabilities, including whether one ought deliberately to bet only a fraction of the apparent optimum.  
  *Case:* In practice, the true probabilities are rarely known with certainty. They might be estimated and change over time. A robust policy must account for uncertainty. For instance, it is common to "fractional Kelly" bet (bet a fraction of the Kelly stake) when there is model uncertainty to avoid the risk of overbetting due to estimation error. A theory that assumes known probabilities would be brittle in real applications.  
  *Non-negotiable?* This is a requirement for robustness but might be considered an extension beyond the ideal case. However, since the problem statement includes "uncertain or shifting probabilities", it is a genuine requirement for an adequate theory. But note: one could argue that the base theory assumes known probabilities and then extensions handle uncertainty. Given the context, it is non-negotiable that the theory must address uncertainty, at least by providing guidance (like fractional betting) when probabilities are uncertain.

  **Desideratum (v):**  
  *Statement:* A policy must either reconcile itself with expected utility theory or explain why the apparent conflict is illusory — in particular, whether growth-optimal staking is rationally mandatory only for an agent with logarithmic utility.  
  *Case:* Expected utility theory (EUT) is a standard framework for rational decision-making under risk. The Kelly criterion (which maximizes expected log wealth) is known to be equivalent to maximizing expected utility for an agent with a logarithmic utility function. But what if the agent has a different utility? Is the Kelly criterion still rational? A theory of stake sizing must clarify its relationship to EUT. If it claims universal rationality, it must address why an agent with a different utility function should follow it. Alternatively, it might be presented as a specific solution for log-utility agents.  
  *Non-negotiable?* This is a theoretical requirement for the foundation of the policy. Without it, the policy might be seen as ad hoc. However, one might argue that the goal is long-term wealth growth and the Kelly criterion achieves that, regardless of EUT. But to be a rigorous theory, it must address this. It is non-negotiable for a complete theoretical account, but in practice, one might use Kelly for growth without worrying about EUT. Given the context of the question, which asks for a specification of desiderata, this is non-negotiable for an adequate theory that aims to be rational.

  **Summary of non-negotiables:**  
  All five desiderata are non-negotiable for an adequate and comprehensive theory of stake sizing for repeated multiplicative gambles. They cover the essential aspects: avoiding ruin (i), capturing the overbetting phenomenon (ii), handling portfolios (iii), accounting for uncertainty (iv), and reconciling with decision theory (v).

  **Potential conflicts:**  
  - (i) and (ii) are aligned and complementary.  
  - (iii) is an extension and does not conflict with (i) and (ii).  
  - (iv) might suggest a modification (like fractional Kelly) that could be seen as conflicting with the pure Kelly criterion in (ii) and (v). However, it is an adjustment for a different setting (uncertainty) and thus not a conflict.  
  - (v) might be challenging because the Kelly criterion is optimal for log-utility but not necessarily for other utilities. The theory must either argue that log-utility is the rational choice for long-term growth or provide a way to generalize to other utilities.  

  In particular, note that desideratum (v) might be in tension with the others if one insists that the Kelly criterion is the only rational choice. But a comprehensive theory can accommodate multiple utility functions by showing how the stake sizing changes accordingly. For example, one might maximize expected utility for a given utility function, which in the case of log-utility reduces to Kelly. Thus, the theory might be embedded in EUT, satisfying (v) and also the others by appropriate generalization.

  **Conclusion on requirements:**  
  All five are genuine requirements. An adequate theory must meet them.
answer: |-
  Below is a detailed specification of desiderata for an adequate theory of stake sizing in repeated, multiplicative gambles. Each desideratum is evaluated for its status as a genuine requirement, with the case for its necessity and whether it is non-negotiable or camp-specific. Conflicts or tensions between desiderata are flagged where relevant. The focus is on the core criteria and their motivations, with minimal reference to existing positions.

  ---

  ### **Desideratum (i): Survival Consistency**  
  **Statement:** A policy must ensure survival by prohibiting wagers that risk ruin (e.g., betting the entire bankroll on a positive-expectation bet with any chance of loss), and must explicitly decouple favorable expectation from sensible stake size.  
  **Case for Requirement:** In repeated multiplicative gambles, wealth evolves geometrically. Betting the entire bankroll on a single favorable bet (e.g., 60% chance of doubling wealth, 40% chance of total loss) risks immediate ruin with positive probability, terminating all future opportunities. Survival is a prerequisite for long-term growth, as ruin is irreversible. A theory that permits such bets conflates *arithmetic expectation* (which may suggest "bet big" for positive-EV bets) with *sustainability* (which requires fractional staking to preserve capital). This is non-negotiable because any policy ignoring survival fails in its core purpose: enabling repeated play.  
  **Status:** Non-negotiable. Universal for any theory addressing repeated bets.

  ---

  ### **Desideratum (ii): Overbetting Phenomenon**  
  **Statement:** A policy must capture the non-monotonic relationship between stake size and growth: stakes above the growth-optimal fraction reduce expected log-growth, and sufficiently high stakes make growth negative (causing typical wealth to decline despite attractive arithmetic expectations).  
  **Case for Requirement:** In multiplicative dynamics, growth is multiplicative and path-dependent. The expected growth rate is maximized at a specific fraction (e.g., Kelly fraction), but exceeding this reduces the median long-term wealth. For example, overbetting may yield a high arithmetic mean wealth but a negative geometric mean growth rate, leading to almost sure ruin in the long run. This phenomenon arises from the convexity of the logarithm function and the impact of variance on compounded returns. A theory must explain why "more is not always better" and provide a clear optimum to avoid destructive overconfidence. Ignoring this invites reckless staking.  
  **Status:** Non-negotiable. Rooted in the mathematics of multiplicative processes (e.g., the Kelly criterion's expected log-wealth maximization).

  ---

  ### **Desideratum (iii): Portfolio Generalization**  
  **Statement:** A policy must generalize to portfolios of simultaneous, correlated bets, where covariance structures affect optimal allocations, even when individual bets are favorable.  
  **Case for Requirement:** Real-world gambles (e.g., financial portfolios) involve multiple concurrent bets with dependencies. Correlation changes risk profiles: negatively correlated bets hedge risk, allowing higher aggregate stakes, while positive correlation amplifies risk, demanding conservatism. A single-bet theory fails here, as it cannot account for diversification or concentration effects. For instance, two favorable but perfectly correlated bets should not receive the same allocation as two uncorrelated bets. This is essential for practical applicability beyond toy models.  
  **Status:** Non-negotiable. A theory limited to independent identical bets is inadequate for real decision-making.  
  **Conflict Note:** Tension with desideratum (ii) if the theory does not seamlessly extend from scalar to vector allocations (e.g., overbetting in one asset might be optimal in a portfolio context due to hedging). A unified framework must resolve this.

  ---

  ### **Desideratum (iv): Uncertainty Robustness**  
  **Statement:** A policy must prescribe behavior under uncertain or shifting probabilities (e.g., model misestimation, non-stationary environments), including whether to deliberately underbet relative to the apparent optimum.  
  **Case for Requirement:** Probabilities are rarely known exactly; they are estimated from data or subject to change. Overconfidence in point estimates leads to overbetting, as errors in probability assessment amplify losses (e.g., betting "full Kelly" on a misestimated 55% chance as 60% causes suboptimal growth). Robustness requires a margin of safety, often via fractional staking (e.g., betting half the Kelly fraction). A theory must address this to prevent fragility in real-world applications.  
  **Status:** Non-negotiable for practical adequacy, but *implementation is camp-specific*. Some advocate fractional Kelly as universal; others embed uncertainty via Bayesian methods.  
  **Conflict Note:** Direct tension with desideratum (ii): the "apparent optimum" under certainty differs from the robust optimum under uncertainty. A theory must bridge this gap without ad hoc fixes.

  ---

  ### **Desideratum (v): Reconciliation with Expected Utility Theory (EUT)**  
  **Statement:** A policy must either harmonize with EUT or resolve the apparent conflict—specifically, clarifying whether growth-optimal staking is mandatory only for log-utility agents.  
  **Case for Requirement:** EUT is the dominant normative framework for rational choice under risk. The Kelly strategy maximizes expected log-wealth, which coincides with EUT for logarithmic utility. However, for other utilities (e.g., linear or exponential), EUT may prescribe different stakes. A theory must justify why growth-optimality should override individual risk preferences or show equivalence. Failure here risks incoherence (e.g., is Kelly "rational" for a risk-averse agent?). This is foundational for evaluating normative claims.  
  **Status:** Non-negotiable for theoretical completeness, but **camp-specific in resolution**. Pro-Kelly camps argue that long-term growth induces log-utility; anti-Kelly camps demand EUT consistency for arbitrary utilities.  
  **Conflict Note:** Inherent tension with desideratum (ii): if growth-optimality is not EUT-compatible for non-log utilities, one must choose between long-term growth and preference consistency. A unified theory may satisfy both only by restricting utility to logarithmic (or risk-neutral) forms.

  ---

  ### **Summary of Desiderata Status**
  | Desideratum | Key Motivation                                                                 | Non-Negotiable? | Notes                                                                                                |
  |-------------|--------------------------------------------------------------------------------|-----------------|------------------------------------------------------------------------------------------------------|
  | (i)         | Ruin prevention in repeated play; separates EV from sustainability.            | Yes             | Universal for multiplicative settings.                                                               |
  | (ii)        | Captures erosion of growth from overbetting; mathematical necessity.           | Yes             | Core to multiplicative dynamics.                                                                     |
  | (iii)       | Real-world portfolios require covariance-aware allocations.                    | Yes             | Essential for generality beyond isolated bets.                                                       |
  | (iv)        | Probabilities are uncertain; robust policies demand conservative adjustments.  | Yes             | Practical necessity; resolution may vary (e.g., fractional Kelly vs. Bayesian methods).              |
  | (v)         | Legitimacy within decision theory; avoids arbitrariness.                       | Yes             | Theoretical necessity; resolution splits camps (log-utility vs. EUT primacy).                        |

  **Key Tensions:**  
  - **(iv) and (ii)**: Uncertainty robustness may require staking less than the theoretical optimum, conflicting with the "pure" growth-maximization in desideratum (ii).  
  - **(v) and others**: If growth-optimality is only EUT-rational for log-utility, it may conflict with desiderata (i)–(iv) when applied to non-log agents (e.g., survival consistency might demand different stakes).  
  - **(iii) and simplicity**: Portfolio optimization complicates the intuition from single-bet models (e.g., overbetting in one asset may be optimal if hedged).  

  A theory satisfying all desiderata must:  
  1. Forbid ruin-prone stakes (i).  
  2. Identify a growth peak and penalize overbetting (ii).  
  3. Handle covariance via multivariate optimization (iii).  
  4. Incorporate uncertainty through conservative adjustments (iv).  
  5. Either restrict utility to logarithmic or embed growth-optimality within EUT (v).  

  The Kelly criterion and its extensions (e.g., fractional Kelly, multivariate Kelly) satisfy (i)–(iii) and partially address (iv)–(v), but (iv) and (v) remain contentious. No existing position flawlessly resolves all tensions, especially (v).
