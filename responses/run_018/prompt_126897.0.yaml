answer: |-
  Here’s a disambiguation of the maxim "authority belongs at the lowest level that can actually handle the job," broken into distinct theses. Each reading is categorized, evaluated, and applied to your two cases (EU carbon policy and US housing mandates).  

  ---

  ### **The Seven Readings of the Maxim**  
  *(From trivial to radical)*  

  1. **The Tautological Reading**  
     - **Claim**: "Authority *should* be placed where it *can* be handled" reduces to "authority belongs where it belongs."  
     - **Type**: Conceptual truth (empty of substance).  
     - **Evaluation**: Platitude. True but useless—offers no guidance.  
     - **Applied to Cases**:  
       - EU carbon policy: Neither supports nor opposes delegation.  
       - US housing: No practical implication.  
     - **User Intent**: Rarely intended (too obvious), but may lurk as rhetorical filler.  

  2. **The Technical Capacity Thesis**  
     - **Claim**: Authority should reside at the lowest level with *expertise/resources* to execute a task effectively.  
     - **Type**: Empirical efficiency claim.  
     - **Evaluation**: Defensible but context-dependent. Fails when local capacity is insufficient (e.g., pandemics, cross-border pollution).  
     - **Applied to Cases**:  
       - EU carbon policy: **Upward assignment** justified (climate leakage requires supranational enforcement).  
       - US housing: **Upward assignment** likely (municipalities lack fiscal tools/regional coordination for housing shortages).  
     - **User Intent**: Invoked selectively in housing debates (ignoring capacity gaps) but denied in climate policy.  

  3. **The Preference Proximity Thesis**  
     - **Claim**: Decisions should be made closest to affected populations to reflect local preferences.  
     - **Type**: Normative democratic principle.  
     - **Evaluation**: Defensible for preference-sensitive issues (e.g., cultural policies), but self-undermining when local preferences harm outsiders (e.g., pollution, discrimination).  
     - **Applied to Cases**:  
       - EU carbon policy: **Downward delegation** only if no transboundary harm (but climate impacts cross borders).  
       - US housing: **Downward delegation** fails—local zoning often exports costs (e.g., homelessness, commuting emissions).  
     - **User Intent**: Likely intended in both examples, but ignores negative externalities.  

  4. **The Democratic Participation Thesis**  
     - **Claim**: Lower levels enable greater citizen engagement and accountability.  
     - **Type**: Normative democratic principle.  
     - **Evaluation**: Defensible for community-scale issues, but false when lower levels are oligarchic (e.g., NIMBY-dominated zoning boards).  
     - **Applied to Cases**:  
       - EU carbon policy: Weak—global issues require complex technocratic solutions ill-suited for local deliberation.  
       - US housing: **Self-undermining**—municipal zoning often entrenches elite interests and excludes marginalized voices.  
     - **User Intent**: Central to US housing debaters; implicitly relied upon but rarely scrutinized.  

  5. **The Anti-Coordination Failure Thesis**  
     - **Claim**: Assign authority upward *only* to solve collective action problems (e.g., race-to-the-bottom, free-riding).  
     - **Type**: Efficiency claim with normative roots.  
     - **Evaluation**: Defensible and widely accepted in political economy.  
     - **Applied to Cases**:  
       - EU carbon policy: **Upward assignment** justified (carbon leakage is a textbook collective action problem).  
       - US housing: **Upward assignment** justified (local zoning creates regional shortages via "beggar-thy-neighbor" exclusion).  
     - **User Intent**: Opponents of EU policy implicitly rely on this to *deny* collective action problems; housing localists ignore regional spillovers.  

  6. **The Subsidiarity as Liberty Thesis**  
     - **Claim**: Lower-level authority is intrinsically preferable to minimize state power and protect autonomy (e.g., Swiss cantons).  
     - **Type**: Anti-centralization thesis (libertarian/communitarian).  
     - **Evaluation**: Substantive but radical—risks enabling local tyranny or paralysis on shared challenges.  
     - **Applied to Cases**:  
       - EU carbon policy: **Downward delegation** (prioritizes sovereignty over effectiveness).  
       - US housing: **Downward delegation** (elevates local control even if inefficient).  
     - **User Intent**: Likely intended by EU skeptics; implicit in US zoning defenses.  

  7. **The Experimentation & Innovation Thesis**  
     - **Claim**: Decentralization enables policy laboratories (e.g., U.S. states testing welfare reforms).  
     - **Type**: Efficiency claim (Hayekian).  
     - **Evaluation**: Defensible for untested policies but inefficient for settled science (e.g., climate mitigation).  
     - **Applied to Cases**:  
       - EU carbon policy: **Downward delegation** only for novel solutions (but climate urgency favors coordination).  
       - US housing: **Mixed**—local innovation possible, but regional crises demand scaling proven models.  
     - **User Intent**: Rarely primary in these cases; more common in U.S. states' rights discourse.  

  ---

  ### **Analysis of Your Examples**  
  1. **EU Carbon-Border Adjustment**:  
     - **Invoked Reading**: Likely #3 (preference proximity) or #6 (sovereignty).  
     - **Implicit Reliance**: Denies #5 (collective action problem) despite carbon leakage being a paradigmatic example.  
     - **Consistent Application**: Reading #5 would *justify* EU authority.  

  2. **U.S. Housing Mandates vs. Municipal Zoning**:  
     - **Invoked Reading**: #3 (preference proximity), #4 (participation), or #6 (local autonomy).  
     - **Implicit Reliance**: Assumes municipalities "can handle the job" (ignoring Readings #2 and #5—capacity/coordination failures).  
     - **Consistent Application**: Readings #2 and #5 would *justify* federal/regional intervention.  

  ---

  ### **Conclusion**  
  - **Platitudes**: Reading #1.  
  - **Defensible but Contextual**: Readings #2, #3, #4, #5, #7.  
  - **Self-Undermining/False**: #3 and #4 when ignoring externalities; #6 if absolutized.  
  - **Radical**: #6 (anti-centralization).  
  - **Hypocrisy Gap**: Users invoke democratic/liberty readings (#3, #4, #6) but rely on ignoring efficiency/collective action principles (#2, #5) that would undermine their position.  
  - **Power Dynamics**: The maxim often serves as a *decentralization default* in rhetoric, but its strongest version (#5) frequently justifies centralization for modern interconnected challenges.  

  The maxim’s allure lies in its ambiguity—it smuggles in normative preferences under the guise of technocratic efficiency. Disambiguating reveals that in both your cases, consistent application of the defensible principles (especially #5) likely supports *upward* assignment.
