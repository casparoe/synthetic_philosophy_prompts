answer: |-
  Your dynamic two-spheres scenario is a profound and distinct pressure point in the metaphysics of identity and individuation. While it builds on Max Black's static argument, it introduces a novel *diachronic tracking problem* that intensifies the challenge to qualitative indiscernibility and forces confrontations with haecceitism. Here's how the literature engages with it:

  ### Core Distinction from Black's Static Case
  - **Black's Original (Static)**: Challenges *synchronic* individuation. "Can two objects share all intrinsic *and relational* properties at a single time?" (Answer: Yes, via spatial relations).
  - **Your Dynamic Case**: Challenges *diachronic* identity tracking. "Can we re-identify an object over time in a perfectly symmetric system without non-qualitative haecceities?" This exposes the *persistence* of numerical identity through change as requiring something beyond qualitative facts.

  ### Established Names & Key Literature
  1. **Symmetric Dynamics / Kinematic Indiscernibility**:  
     Often discussed under **haecceitism** (Adams, Lewis) or **anti-haecceitism** debates. Key treatments:
     - **Robert Adams** (*Primitive Thisness and Primitive Identity*, 1979): Explicitly addresses symmetric orbital cases to argue for haecceities as the *only* ground for trans-temporal identity in such scenarios.
     - **Gordon Belot** ("Dust, Time, and Symmetry", 2001): Analyzes symmetric particle dynamics in relational physics (e.g., Barbour-Bertotti models) where "swapping" particles is empirically undetectable.
     - **Frank Arntzenius** (*Space, Time, and Stuff*, 2012): Examines identical particles in classical mechanics with symmetric orbits, showing standard physics cannot distinguish "exchange" from "no exchange".

  2. **Permutation Argument in Classical Metaphysics**:  
     While rooted in quantum mechanics (QM), philosophers like **Simon Saunders** ("Indiscernibles, Covariance, and Other Symmetries", 2003) extend it to classical contexts. The key insight: If the laws are permutation-invariant (true in both Newtonian and relativistic mechanics), swapping particles is *nomologically redundant*.

  3. **Leibnizian Relationalism & the Hole Argument**:  
     Your case mirrors the "hole argument" in spacetime physics (Earman & Norton, 1987), where symmetric metrics raise questions about manifold points' individuality. **Tim Maudlin** (*Philosophy of Physics: Space and Time*, 2012) connects this to haecceitism.

  ### Why It's Distinct & Where Divergences Occur
  - **Novelty**: Forces a choice between two metaphysical "monstrosities":  
    - **Solipsistic Looping**: Only one sphere exists, tracing the orbit path twice (violates conservation of mass/momentum).  
    - **Haecceitism**: Non-qualitative "thisness" anchors identity (rejects pure qualitative supervenience).  
    This is absent in the static case, which merely denies PII but doesn't threaten persistence.
    
  - **Pressure Point**: Static Black worlds allow spatial relations to ground distinctness *at a time*. Your dynamic world erases *all* qualitative anchors *over time*. Even "was on the left" fails because both spheres instantiate identical historical trajectories.

  ### Standard Replies & Their Limits
  1. **Haecceitist Acceptance** (Adams, Maudlin):  
     *Reply*: The spheres *do* swap positions, but their haecceities explain how we track them. Primitive identity is irreducible.  
     *Weakness*: Posits non-qualitative facts some find ontologically extravagant.

  2. **Anti-Haecceitist Relationalism** (Barbour, Belot):  
     *Reply*: There is no "swap"—the system is qualitatively identical before/after. Only *relative* motion exists. No need to track "which is which"; identity over time is a pseudo-problem.  
     *Weakness*: Conflicts with intuition that objects persist (e.g., if spheres had memories, they'd report different experiences).

  3. **Perdurantism/Stage Theory** (Lewis, Sider):  
     *Reply*: Spheres are 4D "worms." Each instantaneous sphere-stage is distinct, but no *object* moves; the orbit is a series of stages.  
     *Weakness*: Denies genuine persistence, making motion illusory.

  4. **Spacetime Substantivalism** (Earman):  
     *Reply*: Locations in absolute spacetime ground identity. Sphere A occupies point *p* at *t₁*, B at *p* at *t₂*.  
     *Weakness*: Requires absolute space (rejected in relational physics) and still implies haecceities for spacetime points.

  ### Boundary Cases: When Does Symmetry Allow Tracking?
  Tracking is possible iff qualitative asymmetry exists. Key boundaries:  
  - **Imperfect Symmetry**: A microscopic scratch on one sphere breaks symmetry, enabling tracking.  
  - **Asymmetric Interaction**: If one sphere emits radiation (even if absorbed by the other), historical paths differ.  
  - **External Reference Frame**: A distant star breaks rotational symmetry, allowing "fixed" positions.  
  - **Non-Uniform Motion**: Elliptical orbits or varying speeds create unique velocity/acceleration histories.  

  **Critical Threshold**: When *all* intrinsic properties, *all* relational properties (including historical trajectories), *and* the laws of physics are symmetric, tracking without haecceities is impossible. Your scenario hits this limit.

  ### Proposed Name & Conceptual Carving
  This is best termed **Diachronic Black Scenarios** or **Symmetric Orbital Indiscernibility**. It distinctively merges:
  - **Black-style duplication** (synchronic indiscernibles)  
  - **Leibniz’s equivalence of indiscernibles** (applied dynamically)  
  - **Quantum permutation symmetry** (extended classically)  

  **Nearest Neighbors**:  
  1. Quantum Indistinguishability → Lacks classical trajectories.  
  2. Static Black Worlds → Lacks temporal dimension.  
  3. Hole Argument → Focuses on spacetime points, not matter.  

  **Conclusion**: Your dynamic variant isn't merely a restatement of Black’s argument; it’s a sharper challenge to qualitative supervenience. It forces metaphysicians to either embrace haecceitism, reject persistence (via relationalism or perdurantism), or deny the metaphysical possibility of such symmetric systems. The literature treats it seriously under haecceitism debates, but its diachronic dimension deserves more explicit attention as a distinct argument. No reply fully dissolves the worry without ontological costs—this is why it remains a live puzzle.
