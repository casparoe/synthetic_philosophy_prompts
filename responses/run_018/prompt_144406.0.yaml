prompt: |-
  Following an extended and somewhat circular argument with a friend over whether Daniel Dennett's cranes-and-skyhooks distinction can be turned back on itself without collapsing, I need help framing a one-semester independent-study proposal in philosophy of science. The deliverable should be a polished, two-page proposal for a project of about five thousand words—suitable for a small grant or term-paper plan—and it must stand entirely on its own conceptual architecture, since I will supply any citations or references myself and do not want a bibliography or reading list included.

  State the precise research question: can the normative authority of the cranes/skyhooks framework—specifically its power to disqualify unexplained, top-down explanations in evolutionary and cognitive domains—survive a reflexive application of greedy reductionism? In other words, if we attempt to reduce the distinction's critical force to bottom-up mechanisms such as evolved heuristic scaffolding or social-epistemic reinforcement, do we preserve its explanatory power, or do we end up treating its own normative bite as an unexplained skyhook? I want the proposal to explain why existing treatments leave this open: they typically deploy the framework outward against intelligent-design arguments or dualist intuitions, but they avoid asking whether the framework requires what I am calling normative bootstrapping—the capacity of a bottom-up account to justify its own prescriptive authority without circular reliance on the very distinction it seeks to ground.

  Then lay out the approach in clear steps. First, reconstruct the crane/skyhook taxonomy and the idea of greedy reductionism in general philosophical terms. Second, model two competing explanations of the distinction's authority: one treating it as an emergent epistemic scaffold built from simpler predictive and selective heuristics, and one treating its normative asymmetry—why cranes are legitimate and skyhooks are not—as irreducible. Third, apply a reflexivity test by asking whether each model can explain why greedy reductionism is a philosophical vice rather than a virtue without silently presupposing the answer. Specify what a successful result would look like, namely a reconstructed, non-circular bottom-up account that preserves the framework's critical force against top-down explanations, and specify what failure would look like, such as the discovery that any reduction either dissolves the distinction entirely or leaves an unexplained normative residue that functions as a hidden skyhook. Be explicit about the realistic scope: the project is tractable in one semester only if the analysis remains within philosophy of science and cognitive explanation, deliberately bracketing applications to macrohistory, artificial intelligence, or normative ethics, and it should include an honest assessment of what could make the reflexivity test too big—particularly if distinguishing the two models requires empirical premises about cognitive evolution that lie outside philosophical argument alone.

  Please present this as a formal proposal document with the question stated precisely, the gap in current answers explained, the method and its rationale given step by step, the success and failure conditions clearly marked, and a realistic timeline for a single semester. Do not include citations, source requests, or bibliographic recommendations. End with a one-sentence summary of the core proposed research question on its own line, beginning exactly with Summary:
  Summary: The proposal asks whether Dennett's cranes/skyhooks distinction can survive reflexive greedy reduction without either dissolving or secretly relying on the unexplained normative authority it rejects.
