prompt: |-
  I'm taking a seminar on applied moral philosophy, and we've been working through whether everyday conventions—tipping, queueing, and jaywalking—amount to genuine moral obligations or are merely coordination devices. I want to avoid just picking sides until I know what an adequate theory in this space actually has to deliver. Write the desiderata: the full specification of what a theory of the moral status of local conventions must be able to explain, distinguish, and accommodate, with the motivating case or consideration behind each requirement.

  The list should include at least the following: (1) how to treat visitors who violate a convention—distinguishing cases of structural ignorance (they genuinely could not know the local rule) from knowing refusal, and specifying whether the obligation extends to non-participants or is directed only at those embedded in the local practice; (2) the line between conventions that are morally arbitrary coordination mechanisms and those that protect vulnerable parties (for example, tipping where wages depend on it versus queueing where the harm is only delay); (3) how the theory handles pluralistic ignorance, where nearly everyone privately dislikes the convention but publicly enforces it, without collapsing into a mere description of social pressure; (4) whether there are "moral exemption zones"—conventions so weakly justified that non-compliance is not blameworthy even if it inconveniences others; and (5) whether universalizability demands that a visitor follow local norms, or whether context-sensitive justification rooted in local participation can survive without collapsing into moral relativism.

  For each desideratum, flag whether it is non-negotiable or a preference of a particular camp, and identify any pair you suspect is jointly unsatisfiable—particularly whether extending obligations universally to visitors can coexist with a justification that depends on ongoing local participation. Keep the weight on the criteria and their motivating cases rather than on a full scorecard, though briefly indicate how a pure social-contract view and a harm-based view fare against the list.
reasoning: |-
  Okay, the user is taking a seminar on applied moral philosophy and wants to understand the criteria for evaluating theories about the moral status of local conventions like tipping, queueing, and jaywalking. They specifically want a list of desiderata—essential requirements that any adequate theory must address—with each requirement motivated by a concrete case. 

  Hmm, they've outlined five key areas: treatment of visitors, distinguishing arbitrary conventions from protective ones, handling pluralistic ignorance, moral exemption zones, and universalizability vs context-sensitivity. This is sophisticated—they're avoiding premature commitment and seeking structural clarity. 

  First, I need to unpack why these five points matter. The visitor case (point 1) exposes whether obligations are inherently local or universal. The tipping vs queueing contrast (point 2) tests if a theory can separate coordination from harm. Pluralistic ignorance (point 3) challenges theories that reduce morality to collective preference. Exemption zones (point 4) probe the threshold of enforceability. Finally, point 5 tackles the relativistic elephant in the room. 

  For each, I'll anchor the desideratum to their examples: 
  - For visitors, use a tourist skipping tips in a tip-dependent economy vs jaywalking in orderly traffic. 
  - For harm, contrast tipping (livelihood impact) with queueing (mere delay). 
  - Pluralistic ignorance fits perfectly with "tipping fatigue" where everyone hates it but complies. 
  - Exemption zones could be jaywalking in low-risk scenarios. 
  - Universalizability needs to handle whether a Scandinavian must queue in Britain. 

  The trickiest tension is between locally embedded participation (which suggests visitors aren't bound) and universal harm principles (which might bind them). I suspect no theory neatly solves this—social contract views will stress participation, harm-based views universality. 

  User's deeper need seems to be avoiding oversimplification. They want a framework rigorous enough to dissect real-world ambiguities, not just labels. I'll emphasize where desiderata might conflict (especially 1 and 5) and flag non-negotiables like harm avoidance. 

  Also noting their seminar context: they'll likely debate peers, so the response must equip them to critique theories. Brief notes on social contract vs harm-based approaches at the end should help—but the weight stays on criteria, not solutions. 

  ...Time to structure this as five numbered desiderata with motivations, tensions, and theory snapshots. Keeping it dense but navigable.
answer: |-
  Here is a comprehensive list of desiderata for a theory of the moral status of local conventions, structured as requested, with motivating cases and analysis of non-negotiables, tensions, and illustrative theory snapshots:

  ---

  ### **Desiderata for a Theory of Local Conventions**

  1.  **Treatment of Visitors & Scope of Obligation**  
      *   **Must Explain/Distinguish:**  
          (a) Whether obligations bind *only* embedded participants or *also* non-participants (e.g., visitors).  
          (b) How to differentiate *structural ignorance* (visitor genuinely unaware of the convention, e.g., a tourist from a non-tipping culture) from *knowing refusal* (visitor aware but rejecting it, e.g., a traveler who opposes tipping on principle).  
          (c) Appropriate responses to each (blame, education, tolerance?).  
      *   **Motivating Case:** A tourist in the US doesn't tip a server whose wage relies on tips (structural ignorance) vs. a European activist in the US who knows tipping is expected but refuses on grounds it perpetuates unfair labor practices (knowing refusal). Is the tourist blameworthy? Is the activist justified?  
      *   **Non-Negotiable?** Must explain the distinction between ignorance and refusal. Whether obligations extend universally is highly contested.  
      *   **Key Tension:** Can a theory justify obligations for locals based on participation/harm *without* automatically binding visitors?  

  2.  **Distinguishing Arbitrary Coordination from Harm-Mitigation**  
      *   **Must Explain/Distinguish:**  
          (a) Conventions that are *purely coordinative* with negligible moral stakes (e.g., driving on left/right, queueing order causing minor delays).  
          (b) Conventions that *mitigate significant harm* or protect vulnerable parties (e.g., tipping where it constitutes essential income, norms against jumping lifeboat queues).  
      *   **Motivating Case:** *Queueing*: Violating causes frustration/delay (arbitrary coordination). *Tipping in the US*: Not tipping directly harms a low-wage worker relying on tips (harm-mitigation).  
      *   **Non-Negotiable?** **YES.** Any adequate theory *must* distinguish harm-based obligations from mere coordination efficiency. Ignoring vulnerability is a fatal flaw.  
      *   **Key Insight:** Harm-based obligations are typically stronger and less context-dependent than purely coordinative ones.  

  3.  **Handling Pluralistic Ignorance**  
      *   **Must Explain/Accommodate:**  
          (a) How conventions persist when most privately dissent but believe others support it (e.g., "tipping fatigue").  
          (b) Whether moral obligations survive if the convention rests on false beliefs about collective endorsement.  
          (c) How this differs from mere social pressure (e.g., must the theory explain *why* dissenters feel obligated despite private views?).  
      *   **Motivating Case:** Most people in a region privately believe tipping is outdated and burdensome, yet all tip because they believe others expect it, sustaining the norm. Is tipping still morally obligatory, or is it a collective action problem masquerading as obligation?  
      *   **Non-Negotiable?** Must explain the phenomenon without *reducing* obligation solely to perceived pressure. Whether it *undermines* obligation is contested.  

  4.  **Identifying Moral Exemption Zones**  
      *   **Must Explain/Accommodate:**  
          (a) Whether some conventions are so weakly justified (e.g., minimal coordination benefit, no harm prevented) that non-compliance is *not blameworthy*, even if it causes minor inconvenience.  
          (b) Criteria for identifying such zones (e.g., risk level, scale of inconvenience, existence of alternatives).  
      *   **Motivating Case:** *Jaywalking on an empty street*: Violating a "no jaywalking" rule causes no safety risk or significant delay to others. Is compliance morally required, or is this a permissible exemption?  
      *   **Non-Negotiable?** Preference (e.g., libertarians/anti-paternalists insist on such zones; strong communitarians may minimize them). However, a theory *must* explain the threshold of justification.  

  5.  **Universalizability vs. Context-Sensitive Justification**  
      *   **Must Explain/Reconcile:**  
          (a) Whether universalizability requires visitors to follow local norms simply because they *are* local norms ("When in Rome...").  
          (b) Whether context-sensitive justifications (e.g., reliance, local participation) can avoid collapsing into relativism (where "local = right").  
          (c) How core moral principles interact with conventional implementation.  
      *   **Motivating Case:** A citizen of a highly orderly society (e.g., Japan) visits a society with chaotic but functional informal queueing (e.g., Italy). Must they abandon their principled commitment to orderly queues? Conversely, can locals demand compliance based solely on "our way"?  
      *   **Non-Negotiable?** Must avoid relativism. Whether universalizability *demands* local compliance is contested.  
      *   **Critical Tension (with #1):** Can a theory justify obligations for locals via participation/harm **without** demanding universal "When in Rome" compliance from visitors? Satisfying both is **extremely difficult** and may point to a hybrid approach.

  ---

  ### **Theory Snapshots Against Desiderata**
  *   **Pure Social Contract (SC):**  
      *   *Strengths:* Handles #1 (obligations bind participants; visitor status ambiguous), #3 (focuses on public rules, not private beliefs), #5 (context-sensitive justification).  
      *   *Weaknesses:* Struggles with #2 (may legitimize harmful conventions if "agreed"), #4 (exemptions hard; rules are rules), #5 (risks relativism; why is *this* contract binding?).
  *   **Harm-Based View (HB):**  
      *   *Strengths:* Excels at #2 (clear harm-mitigation focus), #4 (exemptions easy if no significant harm), avoids #5 relativism (harm is universal).  
      *   *Weaknesses:* Struggles with #1 (may over-bind visitors to arbitrary conventions), #3 (pluralistic ignorance irrelevant if no harm), #5 (may under-value coordination benefits).

  ---

  ### **Key Tensions & Summary**
  *   **The Core Challenge:** Reconciling **local participation/reliance** (favors context-sensitivity, strong obligations for locals) with **universal moral principles** (favors harm-avoidance, skepticism of arbitrary rules, potential obligations for visitors) without collapsing into relativism or absolutism.  
  *   **Sharpest Conflict:** Desideratum #1 (visitor obligations) vs. Desideratum #5 (universalizability/relativism). A theory prioritizing local participation (#1) risks relativism (#5). A universal harm principle (#5) may impose duties on visitors even for arbitrary conventions (#1, #4).  
  *   **Non-Negotiables:** Distinguishing harm-mitigation from coordination (#2), explaining pluralistic ignorance without reducing obligation to mere pressure (#3), avoiding moral relativism (#5).  
  *   **Path Forward:** An adequate theory likely needs elements of both SC (explaining the *source* of conventional authority) and HB (providing the *moral content* and limits), combined with a nuanced account of reasonable expectations, vulnerability, and the threshold for blameworthy violation.

  This framework ensures your evaluation of theories focuses on their capacity to handle real-world complexities and tensions inherent in conventional obligations, moving beyond simplistic for/against positions.
