  You are an expert moral philosopher specialising in bioethics and conceptual analysis. Before you compose your answer, please spend a moment brainstorming the possible structures of disagreement that could be present, and think carefully about whether the stalemate is genuine or merely apparent.

  The debate over abortion has been stalled for decades between Judith Thomson's violinist thought experiment, which frames the issue as one of bodily autonomy and whether anyone is obliged to sustain another person's life at great cost to themselves, and Don Marquis's future-like-ours argument, which frames it as a question of why killing is wrong and whether the foetus possesses a future of value comparable to our own. Yet in recent philosophical and public discussion, the ground has shifted without being acknowledged. Those who defend the violinist analogy now rarely claim that pregnancy is literally like being kidnapped and wired to a stranger; instead, they describe gestation as a unique form of sustained biological interdependence that generates obligations precisely because the dependency is continuous, embodied, and asymmetrical in its exit costs. Meanwhile, critics who invoke the future-like-ours argument tend to treat potentiality as a modal property—what the organism could become—whereas defenders of abortion rights respond by treating potentiality as teleologically directed, arguing that a directed potential is not yet the kind of thing that can bear rights or moral status.

  Given this, I ask you to diagnose why the debate has stalled. Is the disagreement substantive—concerning the metaphysics of potentiality, the nature of biological obligation, or empirical facts about foetal consciousness? Is it verbal—turning on different uses of terms such as 'person', 'autonomy', 'killing', or 'potential'? Or are the two sides in fact answering different questions—one about the permissibility of withdrawing from biological maintenance, the other about the moral status of an entity with a directed future—while using the same vocabulary of 'abortion rights'? Might a hidden empirical question be doing the work, for instance when precisely integrated neural activity or sentience begins? Or is the central question ill-posed, demanding a single verdict on a practice that involves incommensurable moral dimensions?

  Please support your diagnosis by engaging concretely with what each side actually says about interdependence, potentiality, and obligation, and tell me what, if anything, would count as progress given your diagnosis—whether a conceptual distinction, a formal result, an empirical finding, or a deliberate change of question. If you conclude that no progress should be expected, explain why.

  Please reply in continuous prose only, as you would in an email or a letter. Do not use headings, bullet points, bold text, or tables. Write in British English throughout.
