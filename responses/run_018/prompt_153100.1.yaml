  The user needs a practical decision procedure they can run in 20 minutes with their co-chair. They want step-by-step questions that help determine whether a request is a true dead end requiring rule change or if there's a valid path within existing rules. They've mentioned three test cases: solar panels installation (not mentioned in rules), emergency legal fees (which they'd rather not approve), and an ambiguous case.

