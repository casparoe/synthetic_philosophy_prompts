  The user is also concerned about honesty. They wonder if indirectness is dishonest. But politeness strategies, like Brown and Levinson's theory, explain that people use indirectness to save face. The sister probably wanted to avoid conflict, not deceive. So her intent matters; she wasn't lying but being polite.

