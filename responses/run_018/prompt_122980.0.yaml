prompt: |-
  I sit on the acquisitions and attribution committee at a mid-sized museum, and on Thursday we have to rule on a genuinely nasty one, so I want my own head straight before I walk in. Please answer in British English, and please don't point me at any reading, case law or exhibition history — I can't get to a library this week and I'm not asking for citations, just for the reasoning.

  Here's our track record, so you can see the shape of us:

  1. An anonymous nineteenth-century copy of a very famous portrait (the original hangs in another country), in our collection since 1908, always labelled "after". We keep it on the wall, insure it for a token figure, and it goes in the guidebook as a copy.
  2. A Roman marble copy of a lost Greek bronze. Star object, full valuation, travels to loan shows, no one treats it as second-rate.
  3. A Dutch golden age panel we aquired in 1961 as "circle of the master"; panel dating plus a workshop account book later showed it was painted by a pupil in his shop, from his design, with his hand in the highlights. Relabelled "workshop of", stayed on the wall, valuation cut roughly in half.
  4. Three "newly discovered" Dutch pictures bought in good faith in the seventies, hung for twenty-five years, cited in a couple of theses, then exposed as the work of a twentieth-century forger with no connection to anybody. We pulled them, sold them off for a nominal sum, and haven't shown one since — a curator's proposal to hang one as a brilliant forgery in its own right was voted down.
  5. Posthumous productions: we bought a posthumous bronze from the artist's own mould, estate-authorised and stamped as posthumous, display it, value it at about a tenth of a lifetime cast; and we realise an instruction-based wall piece from her written instructions and a diagram, using our own technicians, supervised by her foundation, and hang it under her name at full value.
  6. A sixties canvas painted entirely by the artist's studio assistant under a written agreement that the artist would sign and sell it as his. The arrangement was openly acknowledged in the studio and the artist never denied it. When the agreement surfaced in 2004 we relabelled it "conceived and signed by X, executed by Y", kept it up, cut the valuation by about a third.

  The new one: a big 1954 abstraction, given to us in 1985, hung and catalogued ever since as by Rees. It is the single most reproduced image of the whole movement — half the survey books use it, painters cite it as the thing that changed how they worked. Rees's diaries (found by his granddaughter, handwriting checked, published last year) contain an entry that reads as half confession, half shrug: his partner Nadel, a trained painter, did the entire surface from his full-size cartoon while he was in hospital; he signed it; he then exhibited it, wrote about it in letters as his own work, and never corrected anyone. Technical work finds no trace of Rees's hand. The cartoon survives in his hand and matches exactly. Nadel had her own career and since her death her work sells for about what a mid-range Rees does. The donor's family have lawyers writing letters saying the gift fails if it's not a Rees, and a big Rees retrospective in two years wants to borrow it and needs to know what to print in the catalogue.

  So: predict what we'll actually do on the three decisions — the catalogue attribution, whether it stays on the wall, and the insurance figure — and then tell me what we should do if we want to be consistent with ourselves. Which rule are we implicitly running, and which two or three other rules fit those six precedents just as well? What does each of them say here? I think the closest analog is genuinely up for grabs between 3 and 6 on one side and 4 on the other, so say what turns on which one we pick. If our precedents really don't settle it, be explicit about the principle we'd be committing to with each option — is the value in the hand, in the design and the signing, in what a viewer can get out of the object, in what the object has actually gone on to do in the world, or in not being complicit in a deception? And give me the one further hypothetical variant of this case that would best separate those rules, with what each predicts about it — my own candidates are: same facts but Nadel is an unknown studio hand with no career of her own; same facts but the picture only became famous after someone proposed the reattribution; same facts but Rees had credited her in the 1954 exhibition catalogue. Tell me which of those (or what else) does the most work, and why.
reasoning: |-
  Okay, the user is part of a museum acquisitions committee facing a tricky attribution decision. They've provided six precedents to show how their institution has handled similar cases, and now they need to rule on a controversial 1954 abstraction attributed to Rees but executed by his partner Nadel. 

  First, I need to unpack their institutional pattern. Their past decisions show: 
  - They value authenticity but aren't absolutists (keeping copies and workshop pieces)  
  - They downgrade when hands-on execution isn't the master's (cases 3 and 6)  
  - They draw hard lines at forgeries (case 4)  
  - They recognize posthumous/instructional works as valid but tier their value  

  The Rees case sits uncomfortably between precedent 3 (workshop piece with partial master involvement) and 4 (outright forgery). But crucially, it's not a forgery - the deception came from Rees himself, not a later bad actor. That might save it from being pulled entirely.

  Hmm... the user seems particularly worried about consistency. They're right that this could go either way. The key tension is between the object's cultural impact (it's iconic!) and the new evidence of its making. Their committee will probably split the difference: keep it on the wall with adjusted attribution but slash the value. 

  For true consistency, I think they should treat it like their workshop paintings - credit both creator and designer. That fits their pattern of downgrading (not removing) works with legitimate but non-master execution. The donor's threat is nasty, but caving would undermine their credibility.

  The hypotheticals they proposed are sharp tools to test principles: 
  - If Nadel were unknown, it'd push toward full devaluation (like their forgery case)  
  - If fame came after reattribution, it'd test whether value lives in the object or the myth  
  - If Rees had credited her originally, it'd become a straightforward dual attribution  

  The second hypothetical does most work - it isolates whether the painting's importance derives from its actual qualities or from the false Rees association. That's the core dilemma here. 

  Ultimately this isn't just about rules; it's about whether museums are guardians of truth or temples of cultural aura. Their past choices suggest they lean toward truth-telling, even when it's costly. That's the principle they'd reaffirm by crediting Nadel properly.
answer: |-
  Right, let's cut through this with surgical precision. Your committee's track record reveals an implicit **"Chain of Legitimacy" rule**, prioritising artistic lineage and transparent origins over absolute autograph status. The value isn't solely in the hand, nor solely the mind, but in a defensible connection to the creator's *intention and process*, combined with historical/cultural weight. Deception *for* gain (the forgeries) breaks the chain; authorised delegation or posthumous execution under sanction doesn't.

  **Predicting Thursday's Outcome (The Likely Fudge):**
  1.  **Catalogue Attribution:** "Conceived by Alan Rees, executed by Eva Nadel" (or similar phrasing). A direct lift from Precedent 6.
  2.  **On the Wall?** Yes. It's historically significant, culturally embedded, and has a legitimate connection to Rees (his design, intent, signature). Precedents 1, 2, 3, 5, 6 support retention of non-autograph works.
  3.  **Insurance Figure:** Significantly reduced, but not nominal. Likely pegged closer to Nadel's current market value (mid-range Rees), acknowledging its unique history and fame. Precedent 3 (halved value) and 6 (cut by a third) suggest a substantial cut, while Precedent 4 (nominal) is avoided due to legitimate origins. Expect a 40-60% reduction.

  **What You *Should* Do For Consistency (Applying the "Chain of Legitimacy"):**
  1.  **Catalogue Attribution:** "Designed by Alan Rees, executed by Eva Nadel (1954)". Clear, accurate, reflects the facts. Rees "conceived" the design (cartoon), Nadel executed the painting. His signature signifies approval, not execution.
  2.  **On the Wall?** Yes. It's an authentic, historically significant artefact of the movement, created under Rees's direct instruction/design during his lifetime, with his subsequent endorsement. Its fame is real, regardless of the hand. Precedents 3 & 6 are the strongest guides.
  3.  **Insurance Figure:** Rebased to Nadel's market value, *plus* a significant premium reflecting its unique status as the key embodiment of Rees's design and its pivotal role in art history. This acknowledges its cultural weight (like Precedent 2, the Roman copy) while accepting the hand is Nadel's (like Precedents 3 & 6). Aim for 50-70% of its previous "Rees" valuation, reflecting Nadel's standing plus fame premium.

  **Why Precedent 4 (The Forgeries) Doesn't Fit:**
  *   **Key Difference:** Origin & Intent. The forgeries were created *deceptively* by an outsider *after* the fact to defraud. Here, the work was created *within* Rees's circle, *under his instruction/design*, *during his lifetime*, with his *active endorsement* (signing, exhibiting, claiming). The deception was Rees's *later omission*, not the work's *initial creation*. The chain back to Rees (design, cartoon, intent) is legitimate, even if the hand isn't his.

  **Alternative Rules Fitting Your Precedents:**
  1.  **"Material Origin & Authorisation":** Value lies in the physical object's creation under the artist's sanction/design. Favours Precedents 1, 2, 3, 5, 6. *Here:* Legitimate origin (Rees's cartoon, instruction, signature). Keep, credit both, value between Nadel and Rees.
  2.  **"Cultural Impact Trumps Provenance":** Value lies in the object's demonstrable historical/cultural role, regardless of exact origins. Favours Precedents 1, 2, 5. *Here:* It's the iconic image. Keep as "Rees" or "Rees/Nadel", value high. (This downplays the new evidence).
  3.  **"Anti-Deception Principle":** Value plummets if the work's acceptance relied on false attribution knowingly perpetrated. Favours Precedent 4. *Here:* Rees's deception was key to its initial fame. Could argue for deaccession or nominal value. (This over-extends Precedent 4).

  **The Crucial Hypothetical: Nadel as Unknown Studio Hand**

  *   **Scenario:** Identical facts, except Nadel was an anonymous assistant, not an artist with her own career/reputation.
  *   **Why it Separates the Rules Best:**
      *   **Chain of Legitimacy/Material Origin:** The legitimate connection to Rees (design, cartoon, instruction, signature) remains. It should stay on the wall labelled "Designed by Alan Rees, executed by Studio Assistant", but value plummets drastically (like Precedent 3's halving, or further) due to no independent artistic merit/name recognition. Precedent 6 supports this labelling approach.
      *   **Cultural Impact:** Its fame remains. Argues strongly for retention and high value *despite* the anonymous hand.
      *   **Anti-Deception:** Rees's deception is even starker. Argues for removal or nominal value.
  *   **Prediction:** Your committee, consistent with Precedents 3 & 6, would likely keep it labelled "Designed by Rees, executed by studio assistant", but value it at a *very* low fraction of a Rees (perhaps 10-20%, akin to the posthumous bronze). The lack of Nadel's established name removes the "mid-range Rees" valuation floor.

  **Why the Other Hypotheticals Are Less Revealing:**
  *   **Fame After Reattribution:** Tests "Cultural Impact" most directly. If fame only came *after* the truth emerged, it severely weakens the argument for high value based on its impact *as a "Rees"*. It strengthens the case for valuing it primarily as a Nadel/Rees collaboration based on its inherent qualities.
  *   **Rees Credited Her in 1954:** Makes it unambiguous Precedent 6 territory from the start. "Designed by Rees, executed by Nadel", value split reflecting both contributions accordingly. No controversy.

  **The Commitments:**
  *   **If you downgrade & keep (likely & consistent):** You commit to: **"An object's cultural significance and legitimate origin within the artist's sanctioned process warrant display, even without autograph execution. Value reflects the executing hand's status plus the object's unique historical weight, but not the primary artist's autograph premium."**
  *   **If you remove/devalue drastically (inconsistent):** You commit to: **"Deception in the initial acceptance of an object, even if originating from the artist, fundamentally undermines its legitimacy and value, regardless of subsequent cultural impact."** (Aligns only with Precedent 4).
  *   **If you keep attribution/value largely unchanged (inconsistent):** You commit to: **"An object's demonstrable cultural impact and historical function override questions of specific execution or provenance."** (Downplays Precedents 3, 4, 6).

  **Walk in clear:** Your precedents point strongly to keeping it, reattributing accurately, and slashing the value significantly but not nominally, reflecting its unique status as the authorised, iconic realisation of Rees's design by a significant artist in her own right. The donor's threat is a separate (ugly) matter of contract law, not curatorial ethics or consistency. Hold the line on the facts and your institutional logic. Good luck Thursday.
