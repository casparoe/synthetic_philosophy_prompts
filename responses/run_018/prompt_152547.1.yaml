answer: |-
  Your analysis of the deadlock is astute. The impasse stems from a **conceptual entanglement** where "character traits" functions as an umbrella term masking three distinct constructs, leading both factions to attack or defend different targets under the same label. Here's a structural diagnosis and pathways to progress:

  ### The Structure of the Impasse
  1. **Conceptual Conflation**:  
     - **Situationists** primarily target the *predictive-statistical* model (e.g., "If Jane is honest, she won’t cheat in 95% of situations"). Their experiments show *actual behavioral inconsistency* across situations (e.g., Darley & Batson’s Good Samaritan study).  
     - **Virtue Ethicists** defend the *teleological-narrative* or *counterfactual-normative* models (e.g., "Honesty is a disposition Jane cultivates to flourish; it structures her life’s arc and guides her responses in *relevant* situations").  
     Neither side distinguishes these models, so they argue past each other.  

  2. **Misplaced Burden of Proof**:  
     - Situationists demand evidence of *cross-situational behavioral consistency* (predictive model).  
     - Virtue ethicists offer evidence of *intentional habituation* or *narrative coherence* (teleological model), which doesn’t require moment-to-motional uniformity.  

  3. **Hidden Empirical Question**:  
     The unresolved core is whether **counterfactual robustness** (e.g., "Would a virtuous person *resist* obedience pressure *if properly habituated*?") is empirically plausible. Classic experiments (e.g., Milgram) test *untrained* individuals, not those with virtue-ethical cultivation.  

  ### Three Pathways to Break the Deadlock
  #### 1. **Refined Conceptual Taxonomy**  
     - **Action**: Map the three character conceptions explicitly:  
       - **Predictive-Statistical (PS)**: Traits as behavioral forecasts. *Vulnerable to situationist critique*.  
       - **Counterfactual-Normative (CN)**: Traits as "what an agent *would do* in normatively relevant situations" (e.g., honesty when tempted).  
       - **Teleological-Narrative (TN)**: Traits as dispositions organized toward *eudaimonia* over a lifespan.  
     - **Progress**: Forces both sides to specify which model they engage.  
       - *Situationists* may concede TN/CN are untouched by their data.  
       - *Virtue ethicists* must clarify if virtues require PS stability (likely not) or CN/TN robustness.  
     - **Limitation**: May reveal the debate is purely semantic, but risks ignoring empirical questions about CN.  

  #### 2. **Empirical Study of Modal Stability**  
     - **Action**: Design experiments testing *counterfactual robustness* in virtue-educated agents:  
       - Train participants in Aristotelian habituation (e.g., moral exemplar exposure, practical wisdom exercises).  
       - Test them in *ethically salient* variations of classic paradigms (e.g., Milgram with peer dissenters, bystander scenarios with clear responsibility).  
     - **Progress**: Directly addresses whether habituation cultivates CN traits.  
       - If virtuously trained agents show *greater resistance* to situational pressures, it supports virtue ethics.  
       - If not, virtue ethics must either reform or retreat to TN independence.  
     - **Limitation**: Logistically complex; may not satisfy philosophers seeking conceptual clarity.  

  #### 3. **Normative Independence Thesis**  
     - **Action**: Argue that virtue ethics’ *normative project* (defining flourishing, virtues) is autonomous from empirical psychology.  
       - **Analogy**: Physics doesn’t invalidate geometry, even if no perfect circles exist.  
       - **Virtue ethics as ideal theory**: Traits are targets for cultivation, not descriptions of current humans.  
     - **Progress**: Sidesteps the empirical dispute entirely. Virtue ethicists can grant situationist data while insisting virtues remain *normative ideals*.  
     - **Limitation**: May feel evasive; abandons virtue ethics’ claim to be "naturalistic" (grounded in human nature).  

  ### Diagnosis of Feasibility  
  - **The debate can move**, but only by **disentangling the three character models**. The current deadlock is a classic case of **equivocation**.  
  - **Most promising path**: Start with **conceptual taxonomy** to clarify positions. This exposes that:  
    - Situationists successfully challenge **PS traits**.  
    - Virtue ethicists defend **TN/CN traits**, which are *not* refuted by behavioral inconsistency alone.  
  - **Then** pursue **empirical tests of CN traits** (modal robustness). If studies show habituation *can* produce counterfactual stability in ethically salient contexts, virtue ethics gains empirical support. If not, it must lean harder on TN or normative independence.  

  ### Why This Matters  
  The impasse reveals a deeper tension: **virtue ethics implicitly relies on psychological claims** (that habituation yields robust dispositions). Denying this risks making it an abstract ideal untethered from human possibility. Progress lies in:  
  1. Admitting that **TN traits require *some* degree of CN robustness** (e.g., honesty must resist *some* temptations to be meaningful).  
  2. Testing whether **cultivation practices can produce CN robustness** beyond what situationists document in untrained subjects.  

  By refining concepts and designing targeted experiments, your seminar could transform a circular debate into a collaborative investigation of *how* moral psychology and virtue ethics might inform each other. The goal isn’t "winning" but clarifying what’s at stake: not whether character exists as a predictive engine, but whether it can be shaped into a resilient compass for flourishing.
