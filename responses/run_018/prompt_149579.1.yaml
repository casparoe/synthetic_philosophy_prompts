prompt: |-
  I'm a senior analyst for an NGO that advises development banks on whether to freeze funding when a member state starts eroding democratic norms, and we're constantly fighting about whether a specific reform — like putting judges under ministerial oversight or reshuffling election-commission members — actually counts as democratic backsliding, or if we're just using the word as a partisan label for goverments we don't like. I need a reusable decision procedure my team can run in about 45 minutes, with ordered questions, what counts as a sufficient answer to each, clear stop-points where the answer is no, and explicit hand-off points where the issue is values rather than facts. I want it grounded in whatever political science and philosophy actually say about measuring regime change and normative assessment, but translated into plain language so I don't need a PhD to apply it.

  I'm especially stuck on whether we should measure backsliding against each country's own prior institutional baseline — including cases of institutional layering, where old democratic rules stay on paper but get hollowed out by parallel power structures — or against a universal liberal-democratic standard, and how to handle situations like Hungary's court-packing, a US state-level election-administration change, or Turkey's 2017 referendum shifts where the procedure might give an answer my team will hate. Please build the flowchart-in-words, apply it to those three cases, flag exactly where it breaks down and needs human judgment, and be honest about where it will misfire. Also tell me what would change your mind — for instance, if the distinction between procedural and substantive democracy collapses in practice, or if comparative data showed all these indicators just track partisan alignment — and point out where your reasoning is most likely to fail, probably around whether "backsliding" can even be defined without smuggling in liberal-democratic assumptions. Oh, and please don't just recite the usual country lists; I already know them.
reasoning: |-
  Okay, the user is a senior analyst at an NGO that advises development banks on freezing funding when countries show signs of democratic backsliding. They need a clear, reusable decision procedure that can be applied quickly—around 45 minutes—by their team without requiring deep academic expertise. The main pain point is resolving internal disputes about whether specific reforms genuinely constitute democratic backsliding or are just being labeled as such due to political bias. 

  The user explicitly wants a flowchart-like structure in plain language, grounded in political science but accessible. They’re especially torn between two approaches: measuring backsliding against a country’s own prior institutional baseline (to capture hollowing-out tactics like institutional layering) versus a universal liberal-democratic standard. They also flagged three thorny cases: Hungary’s court-packing, US state-level election changes, and Turkey’s 2017 referendum. 

  Digging deeper, their unspoken needs are likely:  
  - **Legitimacy defense**: They need the tool to withstand criticism from governments accused of backsliding ("You’re just partisan!").  
  - **Team alignment**: A method to end circular debates by making subjective judgments explicit (e.g., "Here’s where we disagree on values, not facts").  
  - **Risk mitigation**: Awareness of where the tool might "misfire" (e.g., condemning reforms in illiberal contexts that accidentally improve things).  

  The academic grounding should draw on:  
  - Levitsky & Ziblatt’s "guardrails of democracy" (mutual toleration, forbearance) for behavioral erosion.  
  - Nancy Bermeo on "stealth authoritarianism" for institutional layering.  
  - Dahl’s polyarchy thresholds for universal benchmarks.  
  - But crucially, avoiding jargon—hence translating concepts like "institutional layering" into "paper rules vs. real-world impact."  

  For the decision procedure, a phased approach makes sense:  
  1. **Pre-check**: Kill obvious non-cases fast (e.g., reforms that strengthen checks/rights).  
  2. **Baseline test**: Assess against the country’s own past to catch hollowing-out.  
  3. **Universal floor test**: Apply minimum polyarchy standards.  
  4. **Intent & impact**: Scrutinize partisan self-interest and disproportionate harm.  
  5. **Terminal flags**: Stop if no backsliding is found or if values disputes emerge.  

  The three cases will stress-test this:  
  - **Hungary**: Baseline test fails (FIDESZ packed courts via rule changes), universal test fails (judicial independence gutted). Clear backsliding.  
  - **US state example**: Tricky—baseline test may pass if the state had hyperpolarized elections, but universal test fails if oversight shifts to partisan actors. Values judgment needed: Is this "normal politics" or delegitimizing opposition?  
  - **Turkey 2017**: Baseline test shows abrupt power concentration; universal test flags executive supremacy. But critics might argue post-coup context justifies it—values dispute here.  

  Biggest weaknesses:  
  - **Universal standards bias**: The "minimum polyarchy" criteria still assume liberal democracy is the ideal. If a team member rejects that, the tool breaks.  
  - **Partisan blindness**: If a reform *looks* neutral (e.g., "election security") but targets opposition voters, intent is hard to prove without smoking-gun evidence.  
  - **False negatives**: Reforms in already-weak democracies (e.g., removing a dictator’s veto power) might pass the baseline test but still leave institutions subpar.  

  To their "what would change my mind" question: If data showed that "neutral" indicators (e.g., judicial independence declines) *only* trigger alarms under left/right opponents, that’d suggest partisan capture. But most metrics (V-Dem, Freedom House) consistently flag Hungary/Poland/Turkey across ideological spectra.  

  Final thought: The tool’s strength is forcing explicit value calls (e.g., "Does context justify norm-breaking?"). But it can’t resolve those—just flags where NGOs must own their biases.
answer: |-
  Here's a reusable 45-minute decision procedure grounded in political science (Levitsky/Ziblatt, Dahl, Przeworski) and democratic theory (procedural vs. substantive democracy), designed to minimize partisan bias. It uses a **sequential threshold test** with explicit off-ramps and values hand-offs. The core approach: **Measure against the country's own prior institutional baseline first, then test against universal minimum standards.**

  ---

  ### **The Democratic Backsliding Assessment Protocol (45-Minute Flowchart)**

  **PHASE 1: PRELIMINARY SCREENING (10 mins)**  
  *Goal: Filter out non-cases fast.*  
  1. **Was the reform enacted via formal legal procedures?**  
     - *Sufficient "Yes"*: Passed by legislature/court/referendum per existing rules.  
     - *Stop if "No"* (e.g., military decree). **Flag as backsliding** (procedural violation).  
  2. **Does the reform *objectively* expand checks/balances or rights protections?**  
     - *Sufficient "Yes"**: e.g., adds judicial review, strengthens FOI laws. **STOP: No backsliding.**  
     - *"No"*: Proceed to Phase 2.  

  **PHASE 2: BASELINE TEST (Country-Specific Erosion) (15 mins)**  
  *Goal: Detect hollowing out of prior democratic norms.*  
  3. **Does the reform reduce de facto independence of any veto player?**  
     - *Veto players*: Courts, electoral commission, audit institution, central bank.  
     - *Sufficient "Yes"**: e.g., ministerial oversight of judges (Hungary), replacing nonpartisan election officials with partisans (Wisconsin 2011), merging judiciary/executive (Turkey 2017).  
     - *Stop if "Yes"* → **Flag as backsliding** (institutional layering).  
  4. **Does it concentrate power by overriding prior constraints?**  
     - *Examples*: Extending term limits, eliminating oversight bodies, emergency powers abuse.  
     - *Sufficient "Yes"**: e.g., Turkey's 2017 referendum abolishing PM role, granting president decree powers.  
     - *Stop if "Yes"* → **Flag as backsliding**.  

  **PHASE 3: UNIVERSAL FLOOR TEST (Liberal-Democratic Minimums) (15 mins)**  
  *Goal: Catch "legal" reforms that violate core democracy.*  
  5. **Does the reform undermine Dahl's "polyarchy" thresholds?**  
     - *Universal minima*:  
       - Suffrage access for >90% of adult citizens,  
       - Free from voter coercion,  
       - Opposition can compete without state violence,  
       - No branch has unchecked power (executive, legislative, judicial balance).  
     - *Sufficient "Yes"**: e.g., voter ID laws targeting marginalized groups with low ID access, criminalizing opposition rallies.  
     - *Stop if "Yes"* → **Flag as backsliding**.  
  6. **Does it violate procedural fairness?**  
     - *Test*: Would neutral observers (e.g., Venice Commission) deem it contrary to rule of law?  
       - Key: Retroactive application, discriminatory targeting, disproportionality.  
     - *Sufficient "Yes"**: e.g., Hungary's court-packing via forced early retirements.  
     - *Stop if "Yes"* → **Flag as backsliding**.  

  **PHASE 4: INTENT & CONTEXT (5 mins)**  
  *Goal: Values-based hand-off.*  
  7. **Is the reform *disproportionate* to its stated goal?**  
     - *Example*: "Election security" reforms that reduce turnout more than fraud.  
     - *Values hand-off*: If disproportionate → **Team debate needed** (weighing security vs. access).  
  8. **Does it advantage the incumbent/party disproportionately?**  
     - *Values hand-off*: If yes, but democratically enacted → **Team debate** (partisan self-interest vs. democratic mandate).  

  **TERMINAL OUTCOMES:**  
  - **Backsliding confirmed**: If Phases 2 or 3 trigger a "Stop."  
  - **No backsliding**: Phase 1 "Stop" or all tests passed.  
  - **Values judgment needed**: Phase 4 hand-offs.  

  ---

  ### **Case Applications & Breakdown Points**

  1. **Hungary (Court-Packing 2011-2013)**  
     - Phase 1: Passed legally (✓).  
     - Phase 2 (Q3): Reduced judicial independence (✓ **Backsliding**).  
     - *Breakdown*: Fidesz argued reforms "modernized" a corrupt judiciary. **Values hand-off**: Does post-communist context justify overriding prior constraints?  

  2. **US State-Level Election Commission Reshuffle (e.g., Wisconsin 2011)**  
     - Phase 1: Legal (✓).  
     - Phase 2 (Q3): Replaced nonpartisan commission with partisan appointees → reduced de facto independence (✓ **Backsliding**).  
     - *Breakdown*: Partisans argue it enhances accountability. **Values hand-off**: Is nonpartisan administration essential, or just a preference?  

  3. **Turkey (2017 Referendum)**  
     - Phase 1: Passed via referendum (✓).  
     - Phase 2 (Q4): Concentrated power by abolishing PM/checks (✓ **Backsliding**).  
     - Phase 3 (Q5): Created unchecked executive (✓ **Backsliding**).  
     - *Breakdown*: Supporters cite post-coup efficiency needs. **Values hand-off**: Can emergencies justify overriding universal minima?  

  ---

  ### **Where the Protocol Fails (and Why)**  
  1. **"Stealth Authoritarianism" Blind Spots**:  
     - Reforms that *appear* neutral but enable future abuse (e.g., vague "national security" laws). The protocol catches only *observed* reductions in independence/procedures (Phase 2 Q3).  
     - *Mitigation*: Track pattern of reforms (single changes rarely backsliding).  

  2. **Universal Standards Bias**:  
     - Phase 3 *does* smuggle in liberal-democratic assumptions (e.g., Dahl's polyarchy). If your NGO rejects liberalism, it fails.  
     - *Smoking gun*: If 80% of "backsliding" calls target left/right governments you dislike, the tool is partisan.  

  3. **False Positives in Fragile Democracies**:  
     - Replacing a corrupt but "independent" judiciary with a more accountable but partisan one (e.g., post-Arab Spring). Phase 3 may flag it as backsliding.  
     - *Mitigation*: Phase 4 Q7 (disproportionality test) forces debate.  

  4. **Context Overrides**:  
     - Turkey's post-coup context made Phase 3 Q5 (unchecked power) *feel* justified to some. The protocol flags it but can't resolve the values trade-off.  

  ---

  ### **What Would Change My Mind**  
  - **If procedural/substantive democracy collapses**: If data showed "fair procedures" *always* favor incumbents (e.g., gerrymandering legal everywhere), Phase 3 becomes useless.  
  - **If partisan alignment predicts backsliding calls**: If V-Dem/Freedom House indicators correlate 90%+ with your team's "backsliding" labels *only* when the government is right/left-aligned, the tool is biased.  
  - **If "institutional layering" is unavoidable**: If all democracies evolve via layering (e.g., UK's unwritten constitution), Phase 2 over-flags.  

  **Weakest Link**: **Phase 3 (Universal Floor)**. It assumes liberal democracy is the ideal. If your team splits on whether illiberal democracy (e.g., Singapore) is valid, the protocol fractures. To fix this, anchor Phase 3 in the **client's charter** (e.g., World Bank's governance standards) rather than philosophy.  

  **Critical Reminder**: This tool measures **democratic erosion**, not human rights or development outcomes. A regime can backslide democratically while improving healthcare (Hungary) or growth (Turkey). Your values determine whether that trade-off justifies freezing funds.
