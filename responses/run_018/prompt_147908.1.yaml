  The user wants to know what moral theory explains this split. Possible angles could be sentience thresholds based on neuroanatomy, the idea that welfare requires capacity for positive states, or just practical tractability. They're also questioning if calling these schemes "science-based" is valid given the inconsistencies. Finally, they ask how audits would change if the same welfare logic applied to crustaceans.

  I should start by identifying the inconsistencies. The salmon standards imply a richer concept of welfare, including behavioral needs and positive states. For crustaceans, it's minimal—survival and efficiency, which treats them more like commodities. The harvest methods show a similar pattern: avoiding boiling lobsters alive suggests some concern, but not extending stunning to farmed ones indicates inconsistency.

  Next, the moral theories. The most likely is a neuroanatomical sentience threshold. Salmon are vertebrates with complex brains, while crustaceans are invertebrates. But current research suggests some crustaceans might feel pain. The differences in standards might stem from outdated assumptions. Another theory is the capacity for positive welfare. If crustaceans are seen as only capable of suffering, not positive states, their welfare gets reduced to avoiding death and stress. Tractability plays a role too—measuring shrimp behavior is harder than survival rates.

  The user's deeper questions might be about the ethics of such inconsistencies and the validity of "science-based" labels. They might be advocating for more equitable welfare standards. To address what would change in audits, I need to outline specific metrics for crustaceans: environmental enrichment, stress monitoring, humane slaughter methods, etc. Also, considering the user's background, they might be involved in animal welfare or aquaculture, seeking arguments to push for changes in certification schemes.

  I should also touch on the implications for labeling schemes as "science-based." If they ignore emerging research on crustacean sentience, their claims are questionable. The user might want ammunition to challenge these certifications. Finally, the answer should balance explaining current practices, critiquing their foundations, and providing actionable steps for improvement.
answer: |-
  This discrepancy reveals a deep inconsistency in how welfare is conceptualized and applied, likely arising from a combination of outdated sentience assumptions, practical tractability biases, anthropocentric biases, and the historical focus of welfare science. It's difficult to reconcile with a truly "science-based" approach if crustacean sentience research is ignored.

  **Theories Hiding in the Split:**

  1.  **Neuroanatomy-Based Binary Sentience Threshold (The Most Likely Culprit):**
      *   **Presupposition:** Sentience requires a specific, complex neuroanatomy (e.g., a centralized brain with a neocortex/cortex-like structure, presence of specific neurotransmitters/receptors associated with pain and emotion in vertebrates). Vertebrate brains (like salmon) pass this threshold; invertebrate brains (like shrimp and crabs) do not.
      *   **Manifestation:** Salmon are assumed capable of suffering *and* experiencing positive states, requiring a rich welfare assessment (behavioral budgets, positive welfare). Crustaceans are assumed to be non-sentient automata, meaning welfare is irrelevant except for productivity (survival, FCR). Pain responses are dismissed as mere nociceptive reflexes.
      *   **Problem:** This view is increasingly challenged by crustacean sentience research (e.g., complex learning, avoidance of harmful stimuli linked to analgesics, context-dependent behavior suggesting internal states, evidence of anxiety-like states). There is no single "sentience switch" neuroanatomy; sentience likely exists on a spectrum.

  2.  **Welfare Requires Capacity for "Positive" States:**
      *   **Presupposition:** Welfare only matters if an animal can experience distinct positive affective states (e.g., pleasure, contentment, play). If an animal is only capable of experiencing negative states (suffering) or none at all, welfare is solely about minimizing harm (death, injury, obvious distress).
      *   **Manifestation:** Salmon are seen as capable of "positive welfare" (hence studies on play). Crustaceans might be seen (under the neuroanatomy theory) as only capable of nociception/primitive suffering at best, so only survival and avoiding gross distress matter. "Positive" enrichment for shrimp seems nonsensical under this view.
      *   **Problem:** This ignores the intrinsic value of avoiding suffering. Even if crustaceans *only* experienced suffering (a significant underestimate), humane treatment at slaughter would still be imperative. It also prematurely dismisses the possibility of positive states in complex invertebrates.

  3.  **Tractability and Practicality Bias:**
      *   **Presupposition:** Welfare metrics must be readily measurable, scalable, and economically feasible for the industry. What's easy to measure defines what matters.
      *   **Manifestation:** Tracking survival and FCR is cheap and easy for billions of tiny shrimp. Monitoring complex behaviors in dense, opaque water systems is technically challenging and expensive. Rapid chilling is fast and scalable; electrical stunning for millions of shrimp is currently impractical. Salmon, being larger, fewer, and in clearer systems, are easier to observe.
      *   **Problem:** This confuses feasibility with ethical obligation. Science shouldn't be limited by current convenience. If sentience is probable, the ethical imperative is to *develop* better assessment methods, not ignore welfare because it's hard.

  4.  **Anthropocentric Bias & Historical Focus:**
      *   **Presupposition:** Vertebrates (especially mammals and birds) are intuitively closer to humans and have been the primary focus of welfare science. Invertebrates are "other" and their welfare is less compelling or a lower priority.
      *   **Manifestation:** Decades of salmon welfare research exist, informing standards. Crustacean welfare science is younger and less established. Public concern is higher for lobsters (visible in restaurants) than anonymous farmed shrimp/crabs. Standards reflect this historical and perceptual lag.
      *   **Problem:** Ethical frameworks should be based on an animal's capacity for suffering, not its phylogenetic similarity to humans or public visibility.

  **Is it Consistent with "Science-Based"?**

  *   **Superficially/Selectively:** It may be based *on the science applied to salmon*. Standards for salmon likely reflect the scientific consensus *for salmon*.
  *   **Fundamentally Inconsistent:** It fails to integrate the growing body of **scientific evidence suggesting decapod crustacean sentience** (UK Animal Welfare Sentience Act 2022 recognizes lobsters, crabs, octopus, squid as sentient; EFSA opinions acknowledge the likelihood). Ignoring this relevant science for one taxonomic group while applying it rigorously to another is inconsistent.
  *   **Conclusion:** Calling the scheme "science-based" **lacks credibility** regarding crustaceans. It applies science selectively, potentially due to outdated assumptions, tractability, or commercial pressures, rather than a comprehensive review of the evidence for all species covered.

  **What Would Change if the Same Welfare Logic Applied to Crustaceans?**

  Applying the salmon logic consistently would necessitate a radical overhaul of crustacean audits, based on the *probability* of sentience and the precautionary principle:

  1.  **Beyond Survival & FCR:**
      *   **Behavioral Metrics:** Audits would need to measure species-specific natural behaviors relevant to welfare (e.g., burrowing, exploring, substrate manipulation for shrimp; complex foraging, shelter use for crabs). Enrichment requirements would become essential.
      *   **Stress Indicators:** Monitoring physiological stress markers (e.g., hemolymph hormones like crustacean hyperglycemic hormone - CHH) and behavioral stress responses (e.g., escape attempts, abnormal aggression, freezing) would be required.
      *   **Environmental Parameters:** Metrics would extend beyond basic water quality to include habitat complexity, substrate type, space allowances, light/dark cycles, and current variation – all linked to behavioral expression and stress reduction.
      *   **"Positive Welfare" Indicators:** Research would be funded, and audits would eventually incorporate indicators of potential positive states (e.g., exploration of enriched environments, engagement with manipulable objects, reduced neophobia).

  2.  **Humane Slaughter Mandate:**
      *   **Ban Rapid Chilling (as sole method):** Recognized as causing significant stress/distress. It might only be permissible *after* effective stunning.
      *   **Mandate Effective, Immediate Stunning:** Electrical stunning or other scientifically validated methods (e.g., specific percussion, advanced hypothermia protocols *proven* to cause instantaneous insensibility) would be required *before* killing. The standard would shift to "instantaneous insensibility" at slaughter.
      *   **Consistency with Lobster Rules:** The logic banning live boiling in restaurants (avoiding prolonged suffering) would necessitate stunning for *all* farmed crustaceans at slaughter.

  3.  **Handling & Husbandry:**
      *   **Stress Reduction Protocols:** Audits would include handling procedures (grading, transport, harvest) with strict limits on aerial exposure, physical trauma, and crowding. Requirements for gradual acclimatization to stressors (e.g., temperature changes during harvest) would be implemented.

  **In essence:** Crustacean audits would transform from basic production efficiency metrics to a holistic assessment focused on minimizing suffering, providing for behavioral needs, and potentially promoting positive experiences, with humane slaughter as a non-negotiable requirement – mirroring the approach taken for salmon. This shift would demand significant investment in research, technology development (e.g., automated behavior monitoring), and industry practice changes. The current split is ethically and scientifically untenable in light of modern understanding.
