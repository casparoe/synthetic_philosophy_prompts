answer: |-
  ### Branching Taxonomy: Fixation of Semantic Content in Layered Representational Systems

  This taxonomy classifies positions on where semantic content is fixed using Hofstadter's frame/outer/inner message distinction. It is built from concrete diagnostic cases, with splits based on specific scenarios. Each leaf names a position and states its most awkward commitment regarding self-modifying systems. Unoccupied positions are noted and diagnosed. Pairs of positions that diagnostic cases fail to separate are explicitly flagged.

  #### Diagnostic Cases:
  - **Case A (Axiom Rewriting):** A formal system rewrites one of its own axioms. Does this change the frame message (syntactic rules/interpretive conventions) or only produce an inner message about the frame?
  - **Case B (Neural Network Weights):** In an artificial neural network, do the weights function as an outer message (externally fixed content about language) or an inner message (self-generated content lacking an external interpreter)?
  - **Case C (Recursive Self-Reference):** Can recursive self-reference stabilize meaning without any frame message (i.e., no pre-existing rules/conventions)?
  - **Case D (Rule-Modifying Subsystem):** A subsystem modifies the rules of its parent system. Is it part of the frame, an outer layer, or an anomalous inner loop?

  #### Taxonomy Tree:

  ```
  Root: Where is semantic content fixed?
  │
  ├── **Split 1 (Case A): Rewriting an axiom changes the frame message?**
  │   │
  │   ├── Yes (Frame is mutable internally) → **Branch M**
  │   │   │
  │   │   ├── **Split 2 (Case C): Can recursive self-reference stabilize meaning without any frame?**
  │   │   │   │
  │   │   │   ├── Yes → **Leaf 1: Bootstrapping Internalism**  
  │   │   │   │   └── Awkward commitment: Self-modifying systems must ground meaning in pure self-reference alone, requiring semantics to emerge from nothing (risking incoherent circularity or arbitrariness).  
  │   │   │   │
  │   │   │   └── No (Frame necessary) → **Branch M-Frame**  
  │   │   │       │
  │   │   │       ├── **Split 3 (Case D): Rule-modifying subsystem status?**  
  │   │   │       │   │
  │   │   │       │   ├── Part of the frame → **Leaf 2: Dynamic Frame Primacy**  
  │   │   │       │   │   └── Awkward commitment: Self-modification blurs the frame/content distinction, forcing the frame to absorb mutable representations (e.g., a "self-updating syntax" that erodes rule stability).  
  │   │   │       │   │
  │   │   │       │   └── Anomalous inner loop → **Branch M-Inner**  
  │   │   │       │       │
  │   │   │       │       └── **Split 4 (Case B): Neural network weights are...**  
  │   │   │       │           │
  │   │   │       │           ├── Inner message → **Leaf 3: Recursive Internalism**  
  │   │   │       │           │   └── Awkward commitment: Inner messages (e.g., weights) must modify the frame without external input, creating a self-contained but potentially unstable loop (e.g., meaning drifts with no anchor).  
  │   │   │       │           │
  │   │   │       │           └── Outer message → **Leaf 4: Anchored Internalism**  
  │   │   │       │               └── Awkward commitment: Self-modifying systems rely on inner messages to alter rules, but critical content (e.g., weights) is externally fixed, creating a split semantics vulnerable to internal/external clashes.  
  │   │   │       │
  │   │   │       └── *Unoccupied: Subsystem as outer layer*  
  │   │   │           └── Diagnosed as incoherent: Outer messages require external interpreters, but the subsystem is internal.  
  │   │   │
  │   │   └── *Unoccupied: "Yes" to Case C + subsystem as outer*  
  │   │       └── Diagnosed as unexplored: Combines frame-agnosticism with externalism; unclear how externals interact with bootstrapped meaning.  
  │   │
  │   └── No (Frame is fixed) → **Branch F**  
  │       │
  │       ├── **Split 2 (Case B): Neural network weights are...**  
  │       │   │
  │       │   ├── Outer message → **Leaf 5: Interpretive Externalism**  
  │       │   │   └── Awkward commitment: Self-modifying acts (e.g., rewriting axioms) only produce inner messages requiring external re-interpretation to "activate," rendering internal agency inert.  
  │       │   │
  │       │   └── Frame message → **Leaf 6: Frame Primacy**  
  │       │       └── Awkward commitment: Self-modification (e.g., learned weights) is illusory, as all changes are predetermined by the immutable frame (e.g., training rules), denying genuine novelty.  
  │       │
  │       └── *Unoccupied: Weights as inner message under fixed frame*  
  │           └── Diagnosed as incoherent: Inner messages cannot self-validate without a mutable frame or external input.  
  │
  └── *Unoccupied: Frame mutable only by outer processes*  
      └── Diagnosed as unattractive: Outer control over frame changes reduces internal self-modification to epiphenomenal noise.  
  ```

  #### Key Notes:
  - **Unoccupied Positions:**  
    - *Subsystem as outer layer (under Branch M-Frame):* Incoherent, as outer messages demand external interpretation, but the subsystem is internal.  
    - *Weights as inner message under fixed frame (Branch F):* Incoherent, as inner messages lack authority to fix semantics without frame/external support.  
    - *Frame mutable only by outer processes:* Unattractive, as it makes internal self-modification irrelevant to semantic change.  
    - *"Yes" to Case C + subsystem as outer:* Unexplored; potential hybrid of bootstrapping and externalism with no clear mechanism.  
  - **Indistinguishable Positions:**  
    - *Leaf 5 (Interpretive Externalism) and Leaf 6 (Frame Primacy)* cannot be separated by **Cases C or D**. Both hold that a frame is necessary and immutable (Case C: "no" to frame-free meaning; Case D: subsystem is an anomalous inner loop). They diverge only on **Case B** (weights as outer vs. frame).  
  - **Total Leaves:** 6 (Bootstrapping Internalism, Dynamic Frame Primacy, Recursive Internalism, Anchored Internalism, Interpretive Externalism, Frame Primacy).  
  - **Self-Modification Awkwardness:** All positions struggle with systems that modify their own rules, either denying agency (e.g., Leaf 6), inviting instability (e.g., Leaf 3), or creating hybrid tensions (e.g., Leaf 4).
