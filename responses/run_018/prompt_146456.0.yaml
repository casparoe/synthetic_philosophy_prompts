answer: |-
  I saw the forking paths unfold,
  With equal force, or so I chose.
  My will felt free, not bought or sold,
  The other branch in morning rose.

  I could have turned, stepped left instead,
  The option bloomed, distinct and bright.
  No puppet strings above my head,
  My hand alone switched off the light.

  I watched you weigh the paths you saw,
  Believing both lay free and clear.
  My voice, your own approving law,
  That whispered "This one" in your ear.
  No other branch could take true hold;
  The choice you made was mine, your mind, long since extolled.
