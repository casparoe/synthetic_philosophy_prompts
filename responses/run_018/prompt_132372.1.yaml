  Okay, I need to tackle this query as a professional philosopher specializing in moral philosophy. The user is a journalist writing about why people feel bound by old pledges despite changing circumstances. The core example is Dr. Elena Voss and her agreement with Dr. Marcus Chen about co-publishing research data. My response must start by outlining key philosophical theories on promise obligations before applying them to this case. 

  First, I recall the main frameworks for why promises create obligations: expectation-based (Hume), practice-based (Rawls), and normative-power-based (Owens/Shiffrin). I'll summarize each without application yet. For expectation-based, it's about creating and relying on expectations. Practice-based focuses on social conventions, while normative-power-based emphasizes the promisor's moral agency in creating obligations.

  Now, applying this to Voss's situation. Her verbal agreement with Chen had no formal release clause, only a mutual "pause" option. Chen has left academia and wants her to publish alone, but Voss feels bound. Under expectation-based theory, Chen's current wishes eliminate the obligation since he no longer expects or wants co-authorship. Practice-based theory might still see value in honoring the promise to uphold scientific integrity norms, but the social context has shifted with Chen's exit. Normative-power-based theory is key here—Voss's pledge created a moral bond that persists unless dissolved by mutual consent. Since Chen never formally released her, the obligation stands, but his explicit waiver could be seen as implicit release.

  I should emphasize the normative-power view as most relevant because it captures the personal nature of Voss's commitment. The pledge wasn't just functional; it was a moral act that shaped her identity. Even without a release mechanism, Chen's clear waiver might dissolve the obligation, but Voss's lingering guilt reflects how promises can create enduring self-imposed duties. The tension between her autonomy (in making the pledge) and Chen's current autonomy (in waiving it) is philosophically rich. 

  For the broader question: promises remain binding when they involve self-generated duties unless release is granted or the promisee's waiver is recognized. In this case, Chen's actions likely release Voss, but her feeling bound shows how moral psychology outlives formal obligations. I'll structure the answer to first outline theories, then analyze the case, ending with general insights on promises in changing contexts.
answer: |-
  ## Philosophical Analysis: The Binding Nature of Past Promises in a Changed World

  **Brainstorming: Philosophical Accounts of Promissory Obligation**

  1.  **Expectation-Based (Humean/Utilitarian):** The core obligation stems from the *expectations* created in the promisee. By promising, the promisor intentionally induces reliance. Breaking the promise disappoints these expectations, potentially causes harm (e.g., wasted effort, emotional distress, loss of trust), and undermines the social utility of promise-keeping as an institution. The obligation exists primarily *because* of the promisee's reliance and the consequences of breaking it.
  2.  **Practice-Based/Convention-Based (Rawlsian/Searlean):** Promises generate obligations because they occur within a constitutive social *practice*. This practice has rules: making a promise creates an obligation, accepting release dissolves it. The obligation arises not solely from individual reliance, but from participation in and benefiting from the practice itself. Violating the promise is wrong because it undermines the practice's integrity and the trust it enables for everyone.
  3.  **Normative-Power-Based (Owens/Shiffrin):** The obligation arises from the promisor exercising a unique *normative power*. By promising, the promisor intentionally alters the moral landscape, creating a new, specific duty *owed to the promisee*. This duty exists because the promisor *willed it into existence* through a performative act understood to have this power. The obligation is an artifact of the promisor's autonomous moral agency and the promisee's status as the recipient of this self-imposed duty. The promisee's *right* to performance is central.
  4.  **Relationship-Based/Trust-Based (Baier/Scanlon):** Promises are embedded within relationships of trust and mutual recognition. The obligation stems from the value of maintaining trustworthiness and respecting the vulnerability inherent in accepting someone's word. Breaking a promise damages the specific relationship and undermines the general value of trust. The obligation is relational, not merely transactional.
  5.  **Autonomy-Based (Kantian):** Keeping promises is a categorical imperative flowing from respect for rational agency. Breaking a promise treats the promisee merely as a means to an end, failing to respect their autonomy. It also involves a contradiction in conception/will: if promise-breaking were universalized, the practice (and thus the ability to make binding promises) would collapse.

  **Analysis of Dr. Voss's Situation:**

  1.  **Normative-Power-Based View (Most Illuminating Here):**
      *   Voss exercised her normative power, creating a specific, directed duty *to Chen*: "I owe *him* co-authorship if I publish from this dataset." This duty exists *because she created it*.
      *   Crucially, the normative power view emphasizes that *only the promisee (Chen) holds the correlative right to waive or demand this specific performance*. The duty is owed *to him*.
      *   **Application:** Chen, as the holder of the right created by Voss's promise, has explicitly and unequivocally *waived* his right to co-authorship ("publish alone... quickly"). He has publicly renounced the context (competitive publishing) that made the promise crucial. While the agreement mentioned a formal "pause" mechanism, it contained no formal "release" mechanism. However, Chen's explicit waiver *functions as a release* within the logic of normative power. He is exercising his right *not* to demand the promised performance. Voss's duty dissolves because the *right-holder* has relinquished his claim. Her feeling bound *despite* his waiver may stem from confusing the *source* of the obligation (her past act creating a duty *to him*) with a sense of duty *in itself* (like a vow), or from residual psychological commitment.

  2.  **Expectation-Based View:**
      *   The original promise created expectations of joint publication in Chen. However, those expectations are now *extinguished*. Chen actively desires the *opposite* outcome and has renounced the field where such expectations matter. Publishing without him causes him no harm or disappointment; it aligns with his current wishes. Delaying publication *against* his wishes arguably causes harm to the field (his stated concern) and potentially to Voss.
      *   **Application:** The core justification for the obligation (preventing harm to the promisee through disappointed reliance) no longer exists. Chen no longer relies on the promise; he repudiates it. Therefore, the expectation-based obligation has lapsed.

  3.  **Practice-Based View:**
      *   The scientific collaboration practice relies on agreements like Voss and Chen's to ensure fairness and prevent exploitation. Upholding agreements maintains the practice's integrity.
      *   **Application:** While the practice generally requires adherence, practices also evolve and accommodate changed circumstances. Chen has exited the practice entirely ("renounced competitive publishing"). Insisting on co-authorship for someone who no longer participates in or values the practice's rewards might seem like an empty formalism, potentially *undermining* the spirit of the agreement (preventing career harm/exploitation) which no longer applies. The practice's integrity isn't necessarily served by forcing co-authorship on an unwilling participant who has left the arena.

  4.  **Relationship-Based/Trust-Based View:**
      *   The promise was a bond of trust within their professional relationship.
      *   **Application:** Chen's explicit release *is an act of trust* – trusting Voss to publish alone competently and fairly. *Honoring his current wishes* respects his autonomy and sustains trust in the *present state* of their relationship (which is now one where he supports her work from outside). Insisting on co-authorship against his will could feel like a violation of *his* autonomy and disregard for his current stance, potentially damaging trust.

  5.  **Autonomy-Based (Kantian) View:**
      *   Voss must treat Chen as an end, not merely a means.
      *   **Application:** Publishing without him *with his explicit consent* respects his current autonomous will. Forcing co-authorship *against his will* would arguably treat him merely as a means to satisfy her own sense of fidelity to a past act, disregarding his current autonomous judgment about what is good for the field and himself.

  **Conclusion on Voss's Obligation:**

  Philosophically, based on the **Normative-Power** view (which best captures the directed nature of the duty) and strongly supported by the **Expectation-Based** and **Relationship-Based** views, **Dr. Voss is likely *not* bound by the original pledge to grant Chen co-authorship in this specific instance.**

  *   **Key Reason:** The holder of the right created by her promise, Dr. Chen, has explicitly waived that right. His clear, voluntary, and informed expression that he desires her to publish alone constitutes a release, even absent a formal mechanism. Performing the original promise against his wishes now would disregard *his* autonomy and the purpose of the duty (which was owed *to him*).

  **General Philosophical Structure: What Makes a Promise Binding When the Promisee No Longer Desires Performance?**

  1.  **The Source of the Obligation:** The core structure involves a self-imposed, directed duty (Normative Power) created to manage expectations (Expectation-Based) within a practice (Practice-Based) and a relationship (Relationship-Based).
  2.  **The Role of the Promisee:** The promisee is not a passive recipient but the *holder of the correlative right* to the performance. This right is central.
  3.  **The Significance of Waiver:** When the promisee no longer desires performance and clearly communicates this (**waiver**), it fundamentally alters the moral landscape:
      *   It dissolves the directed duty at its root (Normative Power).
      *   It removes the harm/reliance justification (Expectation).
      *   It transforms the relational dynamic, making adherence to the *letter* of the past promise potentially disrespectful to the promisee's current will (Relationship/Autonomy).
  4.  **Persistence Despite Waiver?** A promise *could* remain binding despite waiver only under very specific conditions:
      *   If the promise created duties to *third parties* (not present here).
      *   If the promise was more akin to a *vow* (a self-addressed commitment of integrity) rather than a promise *to* someone. While Voss's pledge has elements of this, its core structure was mutual and directed *to Chen*.
      *   If honoring the promise, even against the promisee's current wishes, was necessary to uphold a fundamental, non-waivable value protected by the practice (unlikely here; scientific progress and Chen's wishes align).
  5.  **The Psychological Linger:** While the *moral obligation* likely dissolves upon waiver, the *psychological feeling* of being bound can persist. This stems from:
      *   The residual force of the initial exercise of normative power (the "I gave my word" factor).
      *   Habitual respect for rules/practices.
      *   A conflation of the moral duty (to the promisee) with a sense of personal integrity tied to past actions.
      *   Fear of self-reproach or perceived inconsistency.

  **In essence:** A promise creates a duty *to the promisee*. When the promisee definitively waives their right to the promised performance, the primary justification for the duty evaporates. The binding force is contingent on the continued existence of the promisee's claim. While psychological bonds may remain, the moral obligation shifts towards respecting the promisee's current autonomous wishes, as honoring their waiver is the ultimate fulfillment of the duty *owed to them*. Dr. Voss's feeling of being bound is understandable psychologically, but philosophically, Chen's release sets her free.
