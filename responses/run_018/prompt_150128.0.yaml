prompt: |-
  Is there a name for this? In dark-forest-style reasoning everyone frames the choice as binary: stay totally hidden, or broadcast your location loud and clear. But I've been stuck on this intermediate case -- you send out a narrow-beam probe that only tells anyone in the beam path that tech life exists somewhere in that corridor, without giving them your star's exact coordinates. What's weird is that people analyzing this still talk like it's either safe silence or reckless shout, as if the probe doesn't create its own specific risk: anyone who recieves the beam knows there's prey nearby but can't pinpoint it, so they might start sweeping the sector aggressively, which actually raises the danger for every other quiet civilization in that region who never signaled at all. It's not the classic dark forest (where revealing your precise spot gets you destroyed) and it's not the security dillema either, since the harm isn't mutual suspicion between two actors -- it's an asymetric information spillover that hurts bystanders. I've seen this collapse happen constantly in forum debates, where analysts treat a continuous signaling space as if it only had two settings. Is there an established concept in strategic studies or signaling-game literature that captures this exact failure mode -- collapsing gradated disclosure options into hide/reveal, plus the sector-wide externality? If it's genuinely unnamed, can you coin a sharp term with boundary conditions that separate it from information cascades and from standard security dillemas? And please be self-critical: what formal result or counterexample would change your mind and show this is really just a disguised version of something we already have?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're talking about dark forest reasoning in the context of interstellar communication, where the usual binary is staying hidden versus broadcasting openly. The user introduces an intermediate strategy: a narrow-beam probe that reveals existence in a corridor without pinpointing the exact location. The key issue they point out is that analysts often ignore this middle ground, treating it as either safe silence or reckless shouting. 

  The user highlights a specific risk—any civilization detecting the beam knows there's tech life in the area but not where, potentially leading them to sweep the sector aggressively. This increases danger for other hidden civilizations in the region. The user wants to know if there's a named concept for this failure to recognize graduated disclosure and the resulting externality. If not, they ask for a coined term and a self-critical analysis.

  First, I need to recall relevant concepts from game theory and strategic studies. The dark forest analogy comes from Liu Cixin's work, which is based on the Prisoner's Dilemma and mutual assured destruction. The user mentions that this isn't a standard security dilemma because the harm isn't mutual suspicion but an asymmetric spillover affecting third parties. So, I should look into concepts like externalities, signaling games, and information cascades.

  The user's scenario involves a signal that's not private or public but semi-visible. In signaling games, actions send messages, but here the signal is directional, creating partial information. The risk is that the recipient, lacking precise info, might take broad aggressive actions. This affects uninvolved parties, which sounds like a negative externality. I remember that in economics, externalities occur when one party's actions impact others not involved in the transaction. Here, the narrow-beam probe creates a negative externality for other civilizations in the sector.

  But why isn't this covered by existing terms? The security dilemma involves two parties where defensive actions are misinterpreted as offensive, leading to escalation. Here, it's not mutual; the probe signals to one party, whose response endangers others. So it's an externality problem combined with information incompleteness. 

  Terms like "informational externality" or "strategic spillover" come to mind. However, the user wants something more precise. "Sector Contamination Risk" as a coined term makes sense because the probe contaminates the sector with risk, affecting all inhabitants. The boundaries would distinguish it from cascades (which are sequential decisions) and security dilemmas (mutual suspicion).

  Now, self-critically: what if this is just a multi-party Prisoner's Dilemma? But in PD, players choose simultaneously, and outcomes are symmetric. Here, the probe initiator doesn't directly interact with the affected bystanders; the harm is indirect. Also, the signal's directionality adds a spatial element not present in classic PD. 

  Another counterargument: could this be a type of information cascade? In cascades, individuals act based on predecessors' actions, leading to herd behavior. Here, the bystanders aren't acting; they're passive victims. The cascade model doesn't fit because there's no sequential decision-making by the affected parties.

  Formal results that could challenge this view? If a game theory model with asymmetric information and externalities already exists under another name, like "unintended signaling externalities in incomplete information games." But the spatial corridor aspect might not be covered. If someone modeled directional signals causing sector-wide aggression, that'd subsume the concept. Also, if the negative externality is internalized—say, if civilizations could coordinate—then the problem might reduce to a coordination game. But without coordination mechanisms, the externality persists.

  The user's deeper need seems to be validating their observation that analysts oversimplify continuous strategies into binaries. They might be seeking a framework to argue for more nuanced approaches in discussions about METI (Messaging Extraterrestrial Intelligence). They also want terminology to articulate this specific risk, which isn't captured by existing models. Naming it helps in academic and practical discourse, preventing the collapse they observe in forums.
answer: |-
  This is an **excellent** observation that highlights a critical gap in how we often model existential signaling risks. You're right that the binary "hide/shout" framing is inadequate for the narrow-beam scenario, and the emergent *sector-wide risk* is a distinct and underappreciated phenomenon. Here's a breakdown:

  1.  **The Failure Mode:** The core failure is the **Collapse of Signal Gradient**. Analysts mistake a continuous spectrum of signal precision/locatability for a binary choice. This leads to a false equivalence between "complete silence" and "any signal above zero," ignoring the crucial variable of **locatability resolution** and the resulting **behavioral uncertainty** it induces in the receiver.

  2.  **The Externality:** The unique harm is a **Spatiotemporal Negative Externality of Ambiguous Signaling (SNEAS)**.
      *   **Spatiotemporal:** The harm is localized to a specific region ("sector") defined by the beam's path and persists for a relevant timeframe.
      *   **Negative Externality:** The signaling civilization imposes a cost (increased risk of aggressive sweeping) on uninvolved third parties (other hidden civilizations in the sector) without their consent or any mechanism for compensation. The signaler doesn't bear the full cost of their action.
      *   **Ambiguous Signaling:** The signal provides *some* information ("tech life exists *somewhere* along this line") but critically *lacks* precise locational data, creating high uncertainty for the receiver.
      *   **Resultant Behavior:** This ambiguity incentivizes the receiver to engage in high-risk, high-effort **sector scanning/aggression** to resolve the uncertainty, precisely because they know *something* is there but not *where*.

  3.  **The Coined Term: Sector Contamination Risk (SCR)**
      *   **Boundary Conditions:**
          *   **Requires Ambiguous Signal:** Signal indicates existence/location within a bounded spatiotemporal volume (e.g., the beam corridor + light-cone time) but *not* precise coordinates.
          *   **Induces Receiver Uncertainty:** The signal creates significant locational uncertainty for the receiver.
          *   **Triggers Aggressive Scanning:** Receiver behavior shifts to broad, potentially destructive scanning/sweeping *within the contaminated volume* to reduce uncertainty.
          *   **Imposes Externalized Cost:** This scanning behavior significantly increases the existential risk for *all* entities within the contaminated volume, regardless of their signaling status or awareness of the initial signal.
          *   **Distinct from Info Cascades:** Info cascades involve sequential decisions based on observing others' actions. SCR is triggered by a single ambiguous signal inducing broad aggression, harming passive bystanders. Bystanders aren't making decisions based on the signal; they're collateral damage.
          *   **Distinct from Security Dilemma:** The Security Dilemma involves *mutual* fear and escalation between *two identifiable parties* due to defensive actions appearing offensive. SCR is *asymmetric*: one party signals ambiguously, an *uninvolved* receiver reacts aggressively, and *unrelated third parties* bear the cost. There's no "mutual" suspicion between the signaler and the harmed parties.

  4.  **Self-Criticism & Counterarguments:**
      *   **"It's just an Externality":** Yes, SCR *is* fundamentally a negative externality. However, standard externality models (e.g., pollution) often lack the critical elements of *strategic ambiguity*, *existential risk*, *induced aggressive behavior by a third party*, and the *spatial localization* inherent in the beam scenario. SCR specifies the *mechanism* (ambiguous signal -> receiver uncertainty -> aggressive scanning) and the *context* (existential risk, spatial sector).
      *   **"It's a Type of Unintended Consequence":** True, but far too vague. SCR pinpoints the *specific pathway* and *nature* of the unintended consequence (sector-wide risk amplification via induced scanning).
      *   **Formal Result/Model that Could Change My Mind:**
          *   **If a standard signaling game model with multiple receivers/hidden populations *already* exhibits this precise dynamic:** If a model exists where a sender sends a signal observable only to a subset of receivers ("the beam path"), inducing those receivers to take actions harmful to *other, non-observing* receivers in the same area, and this is a well-known equilibrium, then SCR might be a specific application rather than a novel concept. (I suspect such models are rare or focus on different dynamics).
          *   **If receiver behavior is always optimal deterrence:** If a formal model proves that a rational receiver, upon detecting an ambiguous signal, would *always* either:
              *   Do nothing (if the cost/risk of scanning is too high).
              *   Precisely target the *only possible source* (if the beam geometry allows immediate pinpointing).
              ...then SCR's induced sector-scanning behavior might be irrational and not a stable outcome. However, your scenario assumes the beam corridor is wide enough (or detection imprecise enough) to make pinpointing impossible *without* active scanning, and that the perceived value of the potential "prey" justifies the scanning risk/cost. This seems plausible.
          *   **If the externality is internalized:** If a model shows civilizations could reliably coordinate *ex ante* to avoid ambiguous signaling (e.g., a universal "radio silence" pact), or if harmed bystanders could effectively punish the original signaler *ex post*, then SCR becomes a coordination failure rather than a fundamental strategic dilemma. But in the dark forest, such coordination is likely impossible.
      *   **Counterexample - The "Lucky Shot":** Imagine the receiver, upon detecting the ambiguous beam, decides *not* to scan the whole sector but takes a single, random, high-power shot down the beam corridor. If this shot *accidentally* destroys the signaler, SCR seems less relevant (it's just classic dark forest). However, if the shot misses the signaler but destroys a bystander, SCR *still holds* (the ambiguous signal induced aggression that harmed a bystander). If the shot *only* targeted the signaler and couldn't hit bystanders, it avoids SCR, but this requires implausible precision or isolation.

  **Conclusion:**

  Your concept is insightful and identifies a **genuine gap**. While rooted in externality theory, the specific combination of **ambiguous signaling in a spatial context inducing defensive-aggressive scanning that externalizes existential risk to hidden bystanders** warrants its own label. **Sector Contamination Risk (SCR)** captures the essence: the signal "contaminates" an entire region with increased danger for all its inhabitants, regardless of their actions.

  The formal counterarguments mainly hinge on proving that rational actors in this model *wouldn't* engage in sector scanning, or that the harm *could* be reliably avoided through coordination/punishment – both of which seem highly unlikely in the posited dark forest scenario with high stakes and no communication/trust. SCR stands as a crucial refinement to dark forest reasoning, emphasizing that signals exist on a gradient and that intermediate options can create unique, catastrophic externalities.
