prompt: |-
  I am working on a framework for long-horizon institutional governance — the sort of recursive oversight architecture that might apply to intergenerational safety commitments or self-modifying constitutional regimes — and I want to avoid recycling the standard rational-choice or legal-entrenchment treatments of self-binding. Before I evaluate any particular model, I need the full specification.

  Write the desiderata: the complete list of requirements an adequate normative theory of recursive constitutional precommitment, or institutional Ulysses contracting, must satisfy. For each requirement, state the motivating case, distinction, or empirical result behind it; flag whether it is non-negotiable or a preference of one camp; and identify any pair or subset you suspect is jointly unsatisfiable, with the reasoning (for instance, whether absolute democratic revisability, absolute intergenerational binding, and absolute epistemic humility about future knowledge can all hold together). Keep the weight on the criteria and their conflicts rather than on scoring.

  In particular, the theory must accommodate two niche conditions I am injecting into the problem: (1) a meta-rule that permits suspension of the precommitment only through an independent epistemic-audit panel, creating a verification loop between the commitment and its own conditions of revision; and (2) intergenerational cases where future agents differ not merely in preferences but in contested epistemic standards, so that "better information" is itself up for dispute. It must also preserve standard distinctions — between binding present versus future agents, hard versus soft constraints, procedural versus substantive precommitment — without collapsing them.

  Then, briefly and without bibliography or citation, sketch how the rational-choice self-binding model, hard-entrenchment constitutionalism, and dynamic or deliberative revisionism fare against your list.

  Finally, say what would change your mind: which argument, institutional failure mode, or conceptual distinction would lead you to drop or weaken a key desideratum, and identify the specific point in your reasoning that is most fragile.
reasoning: |-
  We are constructing a list of desiderata for a normative theory of recursive institutional precommitment, incorporating two niche conditions: (1) a meta-rule requiring suspension only via an independent epistemic-audit panel, and (2) intergenerational cases with contested epistemic standards. We must preserve standard distinctions (e.g., binding present vs. future agents, hard vs. soft constraints, procedural vs. substantive).

  The desiderata should be non-negotiable unless specified as a preference. We will also identify potential conflicts.

  **List of Desiderata:**

  1. **Robustness to Value Drift (Non-negotiable)**
     - *Motivation*: Institutions must endure across generations where values may shift (e.g., environmental stewardship vs. short-term growth). The precommitment must bind even if future majorities prefer to defect.
     - *Distinction*: Binding future agents is essential for intergenerational commitments (e.g., nuclear waste management).
     - *Conflict*: May clash with democratic revisability (Desideratum 4).

  2. **Epistemic Contingency Handling (Non-negotiable)**
     - *Motivation*: Future agents may have contested epistemic standards (e.g., climate models vs. denialism). The precommitment must not assume a monolithic "better information" but allow for verification under disagreement.
     - *Incorporates niche condition (2)*.
     - *Distinction*: Requires a mechanism to adjudicate disputes over what counts as evidence.

  3. **Revision under Epistemic Audit (Non-negotiable)**
     - *Motivation*: To avoid rigidity, the precommitment must allow revision, but only via an independent epistemic-audit panel that verifies whether conditions for suspension are met (e.g., if original assumptions are falsified).
     - *Incorporates niche condition (1)*: Creates a verification loop.
     - *Distinction*: This is a procedural precommitment about how to revise.

  4. **Democratic Revisability (Preference of some camps)**
     - *Motivation*: A precommitment that permanently binds a polity without possibility of democratic override may be illegitimate (e.g., a "dead hand" problem). Future generations should have the right to self-governance.
     - *Conflict*: Directly conflicts with Robustness to Value Drift (Desideratum 1) and Absolute Intergenerational Binding (if treated as non-negotiable). Also, if combined with Epistemic Humility (Desideratum 5), it might lead to too-easy revision.

  5. **Epistemic Humility (Non-negotiable)**
     - *Motivation*: Current knowledge is incomplete; future agents may know more. Precommitments should not be based on hubristic certainty (e.g., locking in a specific technology for millennia).
     - *Distinction*: Requires that the precommitment does not over-specify but focuses on processes and conditions.
     - *Conflict*: With contested epistemic standards (Desideratum 2), humility might be exploited to challenge the audit panel's authority.

  6. **Enforceability (Non-negotiable)**
     - *Motivation*: Precommitments that lack enforcement mechanisms are cheap talk (e.g., non-binding climate pledges). Must include sanctions or automatic triggers.
     - *Distinction*: Hard constraints (e.g., constitutional amendments requiring supermajorities) vs. soft (guidelines). We require at least some hardness.

  7. **Non-Circumvention (Non-negotiable)**
     - *Motivation*: Agents should not be able to bypass the precommitment via loopholes or redefinition (e.g., reclassifying a protected activity to evade constraints).
     - *Distinction*: Requires that the precommitment is framed in terms of purposes and functions, not just letter.

  8. **Dynamic Consistency (Non-negotiable)**
     - *Motivation*: The precommitment should remain credible and stable over time, avoiding time-inconsistency problems (e.g., a generation setting up a pension system then defunding it).
     - *Distinction*: This is about the design ensuring that at every future point, the commitment is still incentive-compatible.

  9. **Procedural Neutrality (Preference)**
     - *Motivation*: The revision process should not favor any particular substantive outcome but should be fair and open (e.g., audit panel must be balanced and independent).
     - *Distinction*: Procedural precommitment vs. substantive.

  10. **Intergenerational Equity (Non-negotiable)**
      - *Motivation*: The precommitment must not exploit future generations (e.g., accumulating unsustainable debt). It should fairly distribute burdens and benefits.
      - *Distinction*: Binding future agents should not be used to impose undue costs.

  11. **Agency Preservation (Non-negotiable)**
      - *Motivation*: Future agents must retain the capacity for self-government and adaptation. Precommitments that completely disable future agency (e.g., irreversible decisions) may be illegitimate.
      - *Conflict*: With Robustness to Value Drift (Desideratum 1) and Absolute Binding.

  **Potential Conflicts:**

  - **The Trilemma of Binding, Revisability, and Humility**: 
    - *Conflict*: Absolute intergenerational binding (Robustness to Value Drift, Desideratum 1) + Absolute democratic revisability (Desideratum 4) + Absolute epistemic humility (Desideratum 5) are jointly unsatisfiable.
    - *Reasoning*: 
      - Binding requires preventing future defection even if desired by a majority.
      - Revisability requires that a future majority can change the rules.
      - Humility requires that we acknowledge our current rules might be flawed, suggesting revisability.
    - *Resolution*: We cannot have all three as absolute. The theory must trade off between them. Our niche condition (epistemic-audit panel) offers a path: revision is allowed only when the audit panel confirms that conditions have changed in ways the original framers deemed valid for revision. This partially satisfies humility and revisability but limits democratic revisability to procedural (audit-based) overrides.

  - **Enforceability vs. Agency Preservation**: 
    - Too strong enforcement (e.g., automated sanctions) might undermine future agency if it prevents any flexibility. But without enforceability, the commitment is void.

  **Evaluation of Existing Models:**

  1. **Rational-Choice Self-Binding**:
     - *Strengths*: Dynamic consistency (Desideratum 8) and Enforceability (Desideratum 6) are central. Models like Ulysses pacts are designed to avoid time-inconsistency.
     - *Weaknesses*: Fails on contested epistemic standards (Desideratum 2) because it assumes fixed preferences and known states. Also, it typically ignores intergenerational equity (Desideratum 10) and agency preservation (Desideratum 11). The revision mechanism is not built in.

  2. **Hard-Entrenchment Constitutionalism**:
     - *Strengths*: Excels at Robustness to Value Drift (Desideratum 1), Enforceability (Desideratum 6), and Non-Circumvention (Desideratum 7) via rigid amendment rules.
     - *Weaknesses*: Fails Democratic Revisability (Desideratum 4) and Epistemic Humility (Desideratum 5). It does not handle contested epistemic standards (Desideratum 2) well, as revision is too difficult. The niche condition (epistemic audit) is absent.

  3. **Dynamic or Deliberative Revisionism**:
     - *Strengths*: Emphasizes Democratic Revisability (Desideratum 4) and Epistemic Humility (Desideratum 5). Allows adaptation to new information and values.
     - *Weaknesses*: Weak on Robustness to Value Drift (Desideratum 1) and Enforceability (Desideratum 6). The deliberative process may be captured by short-term interests. Contested epistemic standards (Desideratum 2) might lead to gridlock or biased outcomes. The niche condition (audit panel) could be incorporated but is not standard.

  **What Would Change My Mind?**

  - **Fragile Point**: The most fragile part is the reconciliation of Desiderata 1 (Robustness to Value Drift) and 4 (Democratic Revisability) via the epistemic-audit panel. 
    - *Change Condition*: If I encountered a historical or simulated case where an independent audit panel became corrupt, inert, or itself hijacked by an epistemic faction, thereby blocking necessary democratic revision or enabling undue permanence, I would weaken the non-negotiability of the audit panel as the sole revision mechanism. This might lead me to add a democratic override (e.g., supermajority vote after panel failure) or to weaken Desideratum 1 (allowing more revisability).
  - **Conceptual Distinction**: If someone demonstrated that "contested epistemic standards" (Desideratum 2) are intractable and that no neutral verification is possible, I might drop the non-negotiable status of Desideratum 2 and fall back on a majoritarian or expert-dominant model, though this would undermine the niche condition.

  **Conclusion**
  The theory must navigate the trilemma of binding, revisability, and humility by using the epistemic-audit panel as a procedural filter. It must also enforce without strangling agency. The niche conditions are central to addressing epistemic disputes and creating a stable yet adaptable structure.
answer: |-
  ### Desiderata for a Normative Theory of Recursive Constitutional Precommitment  
  The theory must satisfy the following requirements, grounded in intergenerational governance challenges (e.g., climate treaties, AI governance, nuclear waste management). Key distinctions (binding present/future agents, hard/soft constraints, procedural/substantive precommitment) must be preserved. The two niche conditions are integrated: (1) revision requires an independent epistemic-audit panel (verification loop), and (2) future agents may contest epistemic standards (e.g., climate science vs. denialism).  

  #### Core Desiderata  
  1. **Robustness to Preference Drift** (Non-negotiable)  
     - **Motivation**: Prevents future majorities from overriding commitments due to shifted values (e.g., a future society abandoning carbon neutrality for short-term growth). Distinguishes binding *future* agents from present self-binding.  
     - **Conflict Potential**: Clashes with *Democratic Revisability* (Desideratum 4) if binding is absolute.  

  2. **Epistemic Contestation Tolerance** (Non-negotiable)  
     - **Motivation**: Accommodates niche condition (2)—disputes over "better information" (e.g., future generations rejecting current risk models for AI). Draws from cases like climate skepticism or AI alignment debates.  
     - **Distinction**: Separates epistemic uncertainty from preference conflicts.  

  3. **Verification-Locked Revision** (Non-negotiable)  
     - **Motivation**: Embodies niche condition (1)—revision requires independent epistemic-audit panel (e.g., a court of scientists validating climate thresholds). Prevents self-serving overrides while allowing updates.  
     - **Distinction**: Makes revision procedural, not substantive.  

  4. **Democratic Revisability** (Preference of deliberative camps)  
     - **Motivation**: Avoids "dead hand" problem (e.g., a 18th-century constitution stifling 21st-century equality demands). Requires that future agents retain sovereignty.  
     - **Conflict Potential**: Incompatible with absolute *Robustness to Preference Drift* or *Intergenerational Binding*.  

  5. **Epistemic Humility** (Non-negotiable)  
     - **Motivation**: Acknowledges current knowledge limits (e.g., locking in flawed AI safety protocols). Based on historical failures like rigid economic policies.  
     - **Distinction**: Contrasts with hubristic substantive precommitments.  

  6. **Intergenerational Binding** (Non-negotiable)  
     - **Motivation**: Ensures commitments bind across generations (e.g., nuclear waste stewardship). Addresses cases where future agents cannot consent.  
     - **Conflict Potential**: Irreconcilable with absolute *Democratic Revisability* if future majorities are bound against their will.  

  7. **Enforceability** (Non-negotiable)  
     - **Motivation**: Prevents cheap talk (e.g., unenforced biodiversity treaties). Requires hard constraints (e.g., automated sanctions) distinct from soft guidelines.  

  8. **Non-Circumvention** (Non-negotiable)  
     - **Motivation**: Blocks loopholes (e.g., redefining "emissions" to evade climate pledges). Inspired by corporate or state evasion tactics.  

  9. **Dynamic Consistency** (Non-negotiable)  
     - **Motivation**: Ensures commitments remain credible over time (e.g., no pension-system defection). Addresses time-inconsistency in rational choice.  

  10. **Agency Preservation** (Non-negotiable)  
      - **Motivation**: Prevents ossification (e.g., a constitution blocking adaptation to crises). Future agents must retain capacity for self-governance.  

  11. **Procedural Neutrality** (Preference of liberal camps)  
      - **Motivation**: Revision processes must not bias outcomes (e.g., audit panel balanced across epistemologies). Avoids substantive entrenchment.  

  12. **Intergenerational Equity** (Non-negotiable)  
      - **Motivation**: Fair burden-sharing (e.g., climate debt). Prevents exploitation of future agents.  

  #### Key Conflicts  
  - **The Trilemma (Desiderata 4, 6, 5)**:  
    - *Conflict*: Absolute *Democratic Revisability* (4), absolute *Intergenerational Binding* (6), and absolute *Epistemic Humility* (5) are jointly unsatisfiable.  
    - *Reasoning*: Binding (6) requires restricting future majorities; revisability (4) demands their sovereignty; humility (5) admits current rules may be flawed, necessitating revision. A theory cannot maximize all three without contradiction.  
    - *Resolution*: The epistemic-audit panel (Desideratum 3) mediates by allowing revision only when verified, but this limits democratic revisability.  

  - **Enforceability (7) vs. Agency Preservation (10)**:  
    - Overly hard constraints (e.g., irreversible algorithms) may violate agency, while soft ones risk enforceability.  

  - **Epistemic Contestation (2) vs. Verification-Locked Revision (3)**:  
    - If audit panels cannot resolve contested standards (e.g., climate deniers vs. scientists), verification fails, causing gridlock.  

  ### Evaluation of Existing Models  
  - **Rational-Choice Self-Binding** (e.g., Ulysses pacts):  
    - *Fails*: Epistemic Contestation Tolerance (assumes fixed knowledge), Verification-Locked Revision (no audit loop), and Intergenerational Binding (focuses on present self). Excels at Dynamic Consistency and Enforceability.  

  - **Hard-Entrenchment Constitutionalism** (e.g., unamendable clauses):  
    - *Fails*: Democratic Revisability, Epistemic Humility, and Agency Preservation (too rigid). Excels at Robustness to Preference Drift and Non-Circumvention.  

  - **Dynamic/Deliberative Revisionism** (e.g., living constitutions):  
    - *Fails*: Robustness to Preference Drift and Enforceability (too flexible). Excels at Democratic Revisability and Epistemic Humility. None integrate the audit-panel niche condition.  

  ### What Would Change My Mind  
  - **Fragile Point**: The epistemic-audit panel (Desideratum 3) is vulnerable to institutional failure. If shown that such panels *inevitably* become politicized (e.g., IPCC-style gridlock) or inert (e.g., underfunded AI ethics boards), I would weaken Desideratum 3 to a preference, not a requirement.  
  - **Argument for Revision**: A demonstration that *no* procedural filter can resolve epistemic contests (Desideratum 2) without privileging dominant epistemologies (e.g., Western science over Indigenous knowledge) would force me to drop Epistemic Contestation Tolerance as non-negotiable.  
  - **Empirical Trigger**: Historical cases where rigid precommitments caused catastrophic rigidity (e.g., debt-ceiling crises) could weaken Intergenerational Binding; evidence that democracies *always* defect on long-term commitments (e.g., climate inaction) would strengthen it.  
  - **Conceptual Distinction**: Proving that "procedural" and "substantive" precommitments *cannot* be separated in practice (e.g., audit panels always impose values) would collapse a core distinction, necessitating a rebuilt framework.  

  ---  
  The theory must resolve the trilemma via the audit panel while balancing enforceability and agency. The niche conditions are pivotal but risk institutionalizing epistemic bias or inflexibility.
