  The currency analogy holds up surprisingly well for AI! Objections about conventionality? Well, currency derives value from collective agreement, while AI rewards derive from programmer-defined goals - similar constructedness. Key difference is that currency crashes affect real humans, while AI reward corruption only matters within its artificial value system.

  *ponders* Biggest vulnerability in their argument might be downplaying biological conventionality. Even homeostasis involves evolutionary "design choices," but the key is that biology has hard constraints AIs lack. Should suggest they address that.

