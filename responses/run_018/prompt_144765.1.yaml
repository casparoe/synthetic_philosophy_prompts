answer: |-
  ### Translation of Consequentialist Cluelessness into Mechanism-Design Vocabulary  
  **Core Claim**: Long-run expected-value reasoning fails because predictive models for distant outcomes are too unreliable to support meaningful optimization.  

  ---

  ### Component Breakdown & Mapping Evaluation  
  1. **Normative Structure**  
     - **Philosophical Component**: Consequentialism requires evaluating actions solely by their *outcomes*.  
     - **Mechanism-Design Mapping**: Social choice functions (SCFs) map preference profiles to outcomes, with efficiency (e.g., Pareto optimality) as a normative benchmark.  
     - **Fit**: **Clean**. SCFs encode outcome-based evaluation. Efficiency criteria parallel "good outcomes."  

  2. **Epistemic Limitation**  
     - **Philosophical Component**: Agents lack reliable models to predict distant causal chains ("radical unreliability").  
     - **Mechanism-Design Mapping**: Incomplete information (agents lack knowledge of others' types) or model uncertainty (incomplete common prior).  
     - **Fit**: **Partial Distortion**. Mechanism design assumes uncertainty is quantifiable (e.g., Bayesian priors over *known* type spaces). Cluelessness denies this quantifiability, rejecting probabilistic models for distant futures.  

  3. **Collapse of Optimization**  
     - **Philosophical Component**: Expected-value maximization is impossible under radical model unreliability.  
     - **Mechanism-Design Mapping**: Mechanism failure when agents cannot compute best responses (e.g., due to computational constraints) or when SCFs are non-implementable.  
     - **Fit**: **No Direct Counterpart**. Mechanism design assumes agents can *always* compute expected payoffs given their information. Cluelessness asserts this computation is *structurally impossible*.  

  4. **Robustness Challenge**  
     - **Philosophical Component**: Predictive models are non-robust to misspecification (e.g., tiny errors compound).  
     - **Mechanism-Design Mapping**: Robust implementation (mechanisms immune to model misspecification) or ex-post incentive compatibility.  
     - **Fit**: **Distorted**. Robustness in mechanism design protects against *known* deviations (e.g., type spaces or priors). Cluelessness involves *unknowable* deviations, rendering robustness tools inapplicable.  

  ---

  ### Residue Report: Unmapped Components  
  - **Radical Unquantifiable Uncertainty**: Mechanism design requires formal uncertainty structures (e.g., type spaces, priors). Cluelessness rejects these as fundamentally inadequate for distant outcomes—no counterpart.  
  - **Normative Paralysis**: When expected-value maximization collapses, mechanism design lacks tools to prescribe *any* action. Its normative framework (implementation of SCFs) assumes calculable payoffs.  
  - **Temporal Depth**: Mechanism design typically handles static or finitely repeated games. Long-run causal chains resemble infinitely nested stochastic processes with no equilibrium concept.  

  **Assessment**:  
  The unmapped residue shows that mechanism design **lacks resources for normative reasoning under deep uncertainty**. Its formalism assumes:  
  > (i) Uncertainty is reducible to probabilistic models,  
  > (ii) Agents can always compute expected payoffs.  

  Cluelessness violates both axioms. Mechanism design cannot address normative paralysis because it *presupposes* the feasibility of optimization. The philosophical argument does not "dissolve" when formalized; instead, it exposes a boundary of the framework.  

  **Summary**: Mechanism design’s reliance on tractable uncertainty and computable best responses renders it normatively inert for cluelessness-class problems, confirming a genuine gap in its normative apparatus.  

  ---
  **Summary**: The residue confirms mechanism design lacks normative resources for cluelessness due to its dependence on quantifiable uncertainty and computable payoffs, validating the philosophical argument’s core intuition.
