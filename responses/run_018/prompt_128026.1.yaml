answer: |-
  ## Exam Question: The Improper Prior Two-Envelope Paradox

  **Prompt:** Consider the Two-Envelope Paradox under an improper prior: the amounts in the envelopes ($A$ in yours, $B$ in the other) are drawn such that the prior distribution over the smaller amount $X$ (where $X = min(A,B)$ and $B = 2X$ or $X = A/2$ if $A$ is larger) assigns non-normalizable weight over $X > 0$ (e.g., a constant improper prior $p(x) \propto 1$). Consequently, no proper probability distribution exists over possible amounts, and standard expected value calculations are undefined.

  1.  **Reconstruction (5 marks):** Explain clearly why the *local* switching argument ("If I see amount $Z$ in my envelope, the other envelope contains either $Z/2$ or $2Z$, each seeming equally likely, so switching has an expected gain of $(Z/2 + 2Z)/2 - Z = Z/4 > 0$") remains intuitively compelling *even though* the global prior is improper and expectations are globally undefined. What specific aspect of the local reasoning makes the paradox feel unresolved by merely noting the improper prior?
  2.  **Decision Paralysis (10 marks):** Does declaring "expected value is undefined" genuinely resolve the paradox, or does it merely relocate the problem into a state of decision paralysis? Analyze the implications:
      *   If expected value is undefined, does rationality prescribe *staying*, *switching*, or *neither*?
      *   Is there any rational basis for choosing one action over the other in this scenario?
      *   Does this suspension of rational prescription constitute a different kind of paradox for decision theory? Justify your answer.
  3.  **Indexical Objection (5 marks):** An argument claims that comparing your envelope to "the other envelope" is inherently indexical, analogous to comparing perspectives in the Sleeping Beauty problem. It suggests that averaging over "the other envelope" as if it were a well-defined random variable from *your* perspective is illegitimate, just as naively averaging over "Tuesday vs Wednesday" in Sleeping Beauty might be. Explain this objection clearly. How does it purport to break the symmetry of the switching argument differently than the standard "no uniform distribution" fix? Does this offer a more satisfactory resolution than the "undefined expectation" response?

  ---

  ## Model Answer (Approx. 600 words)

  **1. Reconstruction of Local Compulsion:**
  The local switching argument's power stems from its confinement to the *conditional* scenario *given the observed value $Z$*. Upon seeing $Z$, the agent reasons: "There are exactly two possible world-states compatible with my observation: (State 1) My envelope ($M$) has the smaller amount $X=Z$, the other ($O$) has $B=2Z$. (State 2) $M$ has the larger amount $X=Z$, so the smaller amount was $Z/2$, and $O$ has $Z/2$." Crucially, *within this local conditional frame* limited to these two states, the symmetry between the states appears complete. There's no inherent reason, based solely on observing $Z$, to favor one state over the other. This perceived symmetry forces the assignment of equal probability (1/2) to each state, leading inevitably to the calculation that the expected value of $O$ is $1.25Z$, making switching seem beneficial. The improper prior disrupts the *global* probability structure, making expectations over all possible $Z$ undefined, but it doesn't immediately break this *local*, conditional symmetry perceived *after* observing a specific $Z$. The paradox persists locally because the reasoning feels sound based only on the information available *at the moment of decision*.

  **2. Undefined Expectation and Decision Paralysis:**
  Declaring the expectation undefined technically prevents the paradoxical calculation of an infinite expected gain from always switching. However, it doesn't resolve the underlying dilemma; it relocates it into a state of **decision paralysis** and challenges core tenets of rational choice under uncertainty.
  *   **No Rational Prescription:** Expected Utility Theory (EUT), the standard framework for rational choice under risk, fundamentally relies on well-defined expectations. If the expected utility of switching *and* staying are both undefined for *every* possible observed $Z$, EUT provides *no prescription whatsoever*. It does not say "stay", "switch", or "flip a coin". It remains silent. Rationality, under strict EUT, is suspended.
  *   **Basis for Choice?** Without defined expectations, there is *no rational basis within standard EUT* for preferring one action over the other based on maximizing expected utility. Any preference (staying, switching, or randomizing) would be arbitrary from this perspective.
  *   **A New Paradox:** This suspension *is* a distinct paradox for decision theory. Rational choice paradigms typically assume that for any well-defined decision problem, a rational agent can (at least in principle) identify a maximizing action. Here, the problem is well-defined locally (you see $Z$, you have two choices), yet the standard tool (EUT) fails to yield any guidance due to the global impropriety. This exposes a limitation: EUT requires well-defined probability measures to function. When faced with genuine uncertainty stemming from improper priors, it offers no decision rule, leaving the agent rationally paralyzed despite having clear options and information. This "paralysis paradox" highlights the theory's dependence on prior normalization.

  **3. The Indexical Objection:**
  The indexical objection argues that labeling one envelope "mine" ($M$) and the other "the other" ($O$) creates an inherent perspective, much like being "today" in Sleeping Beauty. When you observe $M = Z$, reasoning about $O$ requires considering *which role $Z$ plays* in the pair: is it the smaller ($X$) or larger ($2X$) amount? Crucially, the possible values for $O$ ($Z/2$ or $2Z$) correspond directly to these distinct roles. Averaging over $O$'s values implicitly averages over these distinct indexical perspectives ("I hold $X$" vs. "I hold $2X$") *as if they were states of the same random variable from a single perspective*. The objection claims this is invalid, akin to Sleeping Beauty naively averaging her credence over "Monday" and "Tuesday" states upon waking, potentially double-counting tails-world perspectives.

  *   **Difference from Standard Fix:** The standard "no uniform distribution" fix breaks the symmetry by denying the equiprobability assumption globally. The indexical objection breaks it *locally* by challenging the very legitimacy of treating the two conditional scenarios as comparable states *from the agent's fixed perspective* after observation. It argues that the state "$M$ is smaller" and "$M$ is larger" represent fundamentally different relationships between the agent's indexical label ("mine") and the underlying pair value ($X$), making simple averaging incoherent. The paradox arises from conflating these perspectives.
  *   **Resolution?** This offers a *different* resolution path: it directly attacks the local symmetry assumption (1/2 probability) by framing it as an indexical error. If successful, it dissolves the local switching argument without needing to invoke global impropriety. However, its persuasiveness is debated. While it highlights the subtlety of indexical reasoning, rejecting the 1/2 assignment within the local conditional frame feels counterintuitive and requires careful justification. It might be seen as complementary to the undefined expectation response, addressing *why* the local symmetry feels compelling but is misleading, rather than just stating the global consequence. Its satisfaction depends on accepting the premise that the indexical nature fundamentally prohibits the simple average.

  ---

  ## Marking Scheme (Total: 20 Marks)

  **Must-Hit Points:**

  1.  **Local Symmetry Justification (5 marks):** *Clear explanation that the perceived symmetry between the two possible states ($Z$ is smaller vs $Z$ is larger), conditional on observing $Z$, drives the local argument, independent of global normalization.*  
      *Botch:* Vague handwaving about "seeing a number"; fails to isolate the conditional reasoning.
  2.  **Undefined EV → No EUT Prescription (5 marks):** *Explicit recognition that undefined expected utility for both actions means standard EUT provides no rational recommendation (not stay, not switch, not randomize).*  
      *Botch:* Suggests undefined EV implies indifference or allows randomization without justification; claims staying is rational "by default".
  3.  **Decision Paralysis as Paradox (5 marks):** *Identifies the inability of EUT to prescribe *any* action despite a clear decision context as a distinct problem for rational choice theory.*  
      *Botch:* Only states EV is undefined without discussing the decision-theoretic consequence; claims it's fully resolved technically.
  4.  **Indexical Analogy Explained (3 marks):** *Clear description comparing labelling envelopes ("mine"/"other") to labelling awakenings ("now"/"then") in Sleeping Beauty, and how averaging over $O$'s values conflates distinct indexical perspectives.*  
      *Botch:* Confuses indexicality with simple non-uniformity; misapplies the Sleeping Beauty analogy.
  5.  **Indexical vs Standard Fix Distinction (2 marks):** *States that the indexical objection challenges the *local* legitimacy of the symmetry assumption/equiprobability, unlike the standard fix which denies global uniformity.*  
      *Botch:* Treats the indexical objection as just another way to say "no uniform prior"; fails to contrast local vs global.

  **Grading Distinction:**

  *   **A Answer (17-20 marks):** Hits all must-hit points with precision and clarity. Demonstrates deep understanding by seamlessly connecting the three parts: how local symmetry persists despite global impropriety (1), why this leads to EUT's failure and paralysis as a distinct paradox (2 & 3), and how the indexical objection offers a different *kind* of symmetry-breaking critique (4 & 5). Writing is logically structured, anticipates potential counterarguments implicitly, and uses precise terminology (conditional probability, indexical, normalization, Expected Utility Theory, decision paralysis).
  *   **B Answer (13-16 marks):** Addresses all three parts of the question satisfactorily and hits most must-hit points, but may lack some depth or precision in one area. Explains local symmetry (1), undefined EV leading to no prescription (2), and the indexical objection (4), but might be weaker on framing paralysis as a distinct paradox (3) or the precise distinction from the standard fix (5). Logic is sound, but explanations might be slightly less sharp or complete than an A answer. Minor conceptual slips might be present but not fundamental.
