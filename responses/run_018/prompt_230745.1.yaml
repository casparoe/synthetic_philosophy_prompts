prompt: |-
  I don't have any background in philosophy or neuroscience, just someone who fell down a rabbit hole reading about split-brain patients. There's a passage in Roger Sperry's Nobel lecture, "Some Effects of Disconnecting the Cerebral Hemispheres" (1981), that keeps tripping me up. He says:

  "It thus came as a considerable surprise in the early 1960s when tests on commissurotomy or ‘split-brain’ patients seemed to indicate the presence in the right, so-called ‘minor’ hemisphere of a considerable capacity for cognitive understanding and the comprehension of language, both written and spoken."

  What I want to understand is the conceptual issue underneath this. Everything I read says split-brain cases raise the question of whether consciousness stays unified, but I can't tell what exactly is supposed to break. If the right hemisphere can read and comprehend words after the corpus callosum is cut, does that by itself show anything about how many conscious subjects there are, or does it just overturn old ideas about a "minor" hemisphere? Please explain the issue, but don't give me a survey of positions. I want you to actually commit: take a definite position on whether these cases show that consciousness can split, or whether there's still one subject, and say what "unified consciousness" amount to here in plain terms. Then tell me the strongest objection to your own view, so I can see how confident I should be. If the honest answer is "it depends what you mean," that's exactly the cop-out I'm asking you not to take.
