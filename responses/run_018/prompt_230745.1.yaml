  Now, my stance: consciousness splits. Each hemisphere houses a distinct conscious subject. The strongest objection is that both hemispheres aren't equally conscious; maybe the right is less so. But Sperry's findings show the right hemisphere's comprehension, suggesting it's conscious. Another objection is that post-surgery, patients feel unified, but that could be due to the left hemisphere's narration dominating.

