answer: |-
  ## The Model Parliament

  Each small machine, by cold design, displays  
  its own clean **rationality**: it sorts  
  policy through vectors—learned, precise,  
  its hidden layers whirring in the night.  
  Their outputs align with axioms of right  
  gambles cast in a reasoned, measured light.  

  But strength is not democratic; **weights** are earned  
  by sharp calibration on an unseen test—  
  a moral benchmark held apart, concerned  
  with out-of-sample truth. The highest score  
  commands a heavier voice, asserts its best  
  claim to define the **social** function’s core.  

  The binding force, the strict **Pareto** call:  
  if every model whispers *yes* or *no*,  
  the **aggregate** must heed that common wall.  
  If none dissent, consensus must be made.  
  No single voice can override the flow  
  dictated where their **cardinal** paths wade.  

  For preferences here are deep and **cardinal**,  
  not shallow ranks, but scaled intensities—  
  affine transforms allowed, yet not the fall  
  to ordinal dust. This strength, this measured span,  
  permits the calculus to interlace  
  their private **weights** into the common plan.  

  What **social** verdict could emerge from such  
  divergent minds, each trained on separate streams,  
  yet bound by axioms demanding much?  
  The iron logic grinds: a sum, a line  
  must manifest, fulfilling all the dreams  
  of perfect **rationality** divine.  

  The final form? A weighted, linear **aggregate**  
  of utilities, each scaled, each voice assigned  
  its calibrated worth. This sealed fate  
  derives from the axioms, a forced decree:  
  the **Pareto** lift, the vNM foundations signed,  
  demand this single shape for policy.  

  *(Envoi)*  
  The **rationality** imposed by light  
  reveals the **weights** are proved, not freely given—  
  **Pareto**'s sharp constraint, the binding rite.  
  Each **cardinal** self stands whole, yet intertwined;  
  the **social** order, clear, from axioms driven,  
  this **aggregate**—but is its truth defined  
  by weights the system chose, not priors writ?  
  Can this sum speak for good, made manifest  
  from weights it made itself, inside the pit  
  of its own test? One question burns the rest:  
  if all authority is self-confessed,  
  is judgment found, or merely self-invested?  

  ---

  **Notes on Structure & Content:**

  *   **Sestina Form:** Adheres strictly to the rotating end-word pattern (1. rationality, 2. weights, 3. Pareto, 4. cardinal, 5. social, 6. aggregate) through six stanzas and the envoi, embodying the "cycling" from individual utilities to the aggregate.
  *   **Theorem Accuracy:**
      *   **Axioms:** Referenced via "axioms of right / gambles" (vNM rationality), "axioms demanding much" (vNM + Pareto), "vNM foundations signed".
      *   **Pareto:** Explicitly stated ("if no dissent, consensus made") and correctly framed as a weak condition (indifference only if all indifferent).
      *   **Cardinality:** Directly named ("preferences... deep and cardinal"), contrasted implicitly with "ordinal dust," and linked to affine transforms ("affine transforms allowed").
      *   **Linearity:** Clearly stated ("weighted, linear aggregate").
      *   **Derivation:** Emphasized as a forced logical consequence ("The iron logic grinds", "derives from the axioms, a forced decree", "demand this single shape").
  *   **AI Framing:** Individuals are "small machine[s]", "models", trained separately ("divergent minds... trained on separate streams"). Weights assigned by "sharp calibration on an unseen test—a moral benchmark held apart... out-of-sample truth." ("highest score / commands a heavier voice").
  *   **Philosophical Core (Envoi):**
      *   Reveals weights are endogenous: "The **weights** are proved, not freely given".
      *   Highlights the tension: "Each **cardinal** self stands whole, yet intertwined" (irreducible individuals) vs. the **social** order being "clear, from axioms driven" (reducible aggregate).
      *   Poses the central question: Can an aggregate be authoritative when its weights are endogenous products ("weights the system chose", "weights it made itself")? ("is judgment found, or merely self-invested?").
  *   **Poetic Function:** Prioritizes evocative language ("cold design", "hidden layers whirring", "iron logic grinds", "sealed fate", "pit / of its own test", "burns the rest"), metaphor ("vectors", "common wall", "interlace", "manifest"), and rhythmic flow over didactic explanation. The form enacts the theorem's movement.
