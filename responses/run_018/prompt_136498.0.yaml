  Ah, and here's where step (7) oversimplifies - it assumes causal redescription alone determines moral status, but the doctrine actually cares about practical reasoning. In the crane scenario, the beam remains the chosen means; crushing is its inherent operational effect. But fat-man pusher selects the man himself as tool. That distinction survives regardless of how finely we describe physics. 

  Noticing too that step (8) creates a false dilemma. Doctrine doesn't "collapse into consequentialism" because it maintains non-consequentialist constraints: you still can't intend evil as means even if proportionate. And the means/side-effect boundary isn't arbitrary - it tracks whether harm is instrumentally required for the mechanism to work. 

  *checks trolley literature* Right, Warren Quinn's "directness" criterion helps here. Crushing in crane case is physically direct harm, but not practically direct in the agent's plan - whereas pushing fat man involves practical directness. Rejecting step (5)'s mental-state equivalence is key, but need to articulate why without begging the question. Perhaps through action individuation: the crane operator's core action is "operating beam-blocker" with foreseen collateral, while pusher's core action is "deploying human shield." 

  For the verdict - doctrine survives if we clarify that "means" refers to intended functional elements in one's plan, not just causal links. Then crane crushing isn't part of the obstruction-means (beam alone suffices functionally) while fat man's body is essential to the pusher's means. Cost: we must accept that moral assessment depends partly on how agents conceptualize their instruments' roles, which introduces subjectivity but not arbitrariness if constrained by reasonable descriptions of function.
answer: |-
  I reject step (7) as misrepresenting the doctrine's core function. Step (7) claims: "So whether double effect permits the action depends not on what is genuinely intended, but on how we redescribe the causal chain..." This conflates *metaphysical causation* with *intentional structure in practical reasoning*, undermining the doctrine's purpose. Here's my assessment and defense:

  ### Key Rejections and Costs:
  1. **Step (5) Mental-State Equivalence is Superficial**:  
     While the *regret* and *lack of desire for harm* are identical, the *intentional structure* differs fundamentally:  
     - In the **crane case**, the agent intends: "Position the beam to block the trolley." The crushing is a foreseen but unintended consequence of *how* the beam moves.  
     - In the **fat-man case**, the agent intends: "Use the man's body as an obstruction." His death is not merely a side effect; it is *constitutively required* for the means (a corpse blocks the trolley).  
     **Cost of rejection**: We must accept that "intention" is not reducible to emotions (regret) or abstract goals ("save five"), but includes the *action plan* chosen. This introduces nuance in assessing intentionality.

  2. **Step (7) Confuses Causation with Moral Description**:  
     The doctrine hinges on *what the agent incorporates into their means*, not causal redescription. In the crane case, the beam’s crushing effect is *causally necessary* for obstruction, but it is not *instrumentalized* in the agent’s plan. The beam alone obstructs; crushing is collateral to its operation. In the fat-man case, the man’s mass is directly deployed as the tool.  
     **Cost of rejection**: We must defend a non-arbitrary distinction between "means" and "side effect" based on *functional role in the agent's plan*, not physics alone.

  3. **Principled Boundary Between Means and Side Effect**:  
     The boundary is **teleological**: Does the harm fulfill the causal role *assigned by the agent* to achieve the goal?  
     - **Means**: Harm is part of the *chosen method* (e.g., fat man’s body *is* the barrier).  
     - **Side effect**: Harm results from the method but isn’t its *functional component* (e.g., crushing occurs *because* the beam moves, but obstruction succeeds via the beam’s position, not the crushing).  
     This avoids reliance on machinery-parsing by focusing on *agency*: What does the agent *deploy* to achieve the end?

  ### Verdict: The Doctrine Survives with Clarification
  The doctrine withstands the challenge if we reject step (7)’s causal reductionism and uphold step (5)’s inadequacy. Double effect remains distinct from consequentialism because:  
  - It forbids *intending harm as a tool*, even for good ends.  
  - It requires proportionality *only* for unintended harms.  

  **Why the crane case is permitted but fat-man is not**:  
  - **Crane**: The bystander’s death is not exploited as a functional element. The beam obstructs; crushing is a byproduct.  
  - **Fat-man**: The man’s death *is* the functional element. His body becomes the literal instrument.  

  **Costs of this defense**:  
  1. **Subjectivity risk**: Assessing "intention" requires evaluating the agent’s practical reasoning, not just stated motives.  
  2. **Teleological burden**: We must define actions in terms of functional roles (e.g., "using a body" vs. "operating a beam").  
  3. **No physicalist shortcut**: The moral distinction can’t be read solely from causal chains; it requires interpreting intentionality.  

  **Conclusion**: The doctrine survives by insisting that "means" refers to *what is intentionally harnessed* in one’s plan, not mere causal proximity. Step (7)’s collapse into consequentialism only follows if we reduce intention to causal description—a mistake the doctrine explicitly rejects. By upholding the centrality of *deliberative intention*, double effect retains independent moral force.
