  Hmm, the thermostat example is perfect. That initial feedback loop insight *was* foundational (essence!), but then got overextended by surface similarities like binary signaling. The key is realizing minds *must* bootstrap via surfaces—we have no direct access to deep structure. Each "wrong" analogy leaves conceptual residue that refines the essence. 

  Wait—does that mean calling it a "category error" is retrospective? In the moment, it's just productive slippage. The thermostat-to-computer shift feels less like a mistake and more like essence evolution: feedback → computation → [next]. Boundaries blur because domains *are* fluid until we carve them. 

  But here's the kicker: inevitability doesn't mean all analogies are equal. Better science happens when we *expect* surfaces to mislead and build in reflection. (That's the seminar hook right there: "If your analogy feels airtight, you're probably oversliding.") 

