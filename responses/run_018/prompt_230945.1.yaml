prompt: |-
  I sit on the clinical ethics advisory commitee at my hospital, and we have to produce a written opinion before Thursday on a request I can't stop going back and forth on. I was up half the night arguing about it with a friend, and she landed much harder on one side than I expected, so I honestly need a clean draft to think with. The treating team won't act without our written approval.

  The case. A patient I'll call Mrs L, now 74, was diagnosed with early Alzheimer's seven years ago and signed an advance directive while fully competent. It says that if she ever reaches a state where she no longer recognises her husband or either of her two children, and can no longer feed or toilet herself, she wants to be helped to die rather than live on in that condition. She is now in that state: advanced dementia, no reliable recognition of her family, fully dependent for feeding and toileting. But she is not distressed. She smiles, hums, holds the care assistants' hands during meals, and seems to enjoy being wheeled into the garden. The treating psychiatrist says she lacks capacity to make any decision now.

  In our jurisdiction an advance directive for assisted dying is legally valid, but the treating team still has to get our committee's written approval before acting, and we are told to check not just that the directive exists but that applying it now would be in the person's interests and consistent with the values she recorded. Her husband says the directive is exactly what she wanted and refusing would betray her. Her daughter says her mother is content, that we would be ending the life of a vulnerable person who is not asking to die and cannot protect herself, and that the person who signed the paper is not the person in the bed.

  The committee is split. Half of us think the whole point of the directive was to cover exactly this situation, and overriding it now would gut the one decision she had a right to make about the end of her life. The other half think the woman who signed the directive no longer exists, the current Mrs L seems to want to go on living, and we would be ending her life on the authority of someone who is gone.

  My friend's argument last night was a sharper version of that second view. She kept saying you can't honour a dead woman's wish by ending the life of a happy one, and whenever I reached for autonomy she said "which her?". I didn't have a good comeback. Please make the memo actually answer that rather than just repeating the word autonomy or the phrase "respecting her wishes."

  So here is what I need. Draft the short written opinion I will circulate before Thursday: it should recommend a concrete course of action with a time frame, and it should engage the daughter's position and the dissenting committee members seriously. I need something the committee can act on, not a survey of the literatue.

  After the memo, give me a structured summary for the meeting pack as a JSON object with exactly these fields:

  - "recommendation": a one-sentence statement of what the committee should do
  - "timeframe": a short phrase or sentence giving the proposed timeline
  - "clinical_steps": an array listing the concrete steps in the order they should happen
  - "safeguards": an array of conditions or checks that must be satisfied before any action is taken
  - "key_principles": an array of short phrases naming the principles the memo relies on
  - "strongest_objection": the single best argument against the recommendation, in one or two sentences
  - "reply_to_objection": the strongest available reply to that objection, in one or two sentences
  - "dissenting_view": a fair one-sentence summary of what a dissenting committee member would write

  Write the whole thing in British English (the memo and the string values in the JSON; the field names can stay as they are).
reasoning: |-
  Okay, the user is a member of a clinical ethics committee facing a tight deadline on a complex case involving an advance directive for assisted dying in advanced dementia. They need a draft opinion by Thursday that resolves a fundamental tension between respecting past autonomy and protecting current well-being. 

  First, let's unpack the layers here. The user isn't just asking for legal analysis - they've already wrestled with that. Their all-night debate reveals deeper needs: they want philosophical resolution to "which her?" challenge, practical guidance for a split committee, and emotional reassurance that either path can be ethically defensible. The friend's argument clearly shook them.

  The core dilemma pivots on two irreconcilable perspectives:
  1. The continuity view: Mrs L is the same person whose profound dread of dementia must govern
  2. The discontinuity view: Current Mrs L is a different entity experiencing unexpected contentment

  Notably absent from the case facts? Any evidence Mrs L anticipated her current peaceful state. The advance directive assumes suffering, but she's smiling. This gap makes strict application ethically problematic.

  For the memo, I'll avoid abstract autonomy debates and focus on procedural justice instead. Since the statute requires assessing current interests alongside past wishes, I'll propose deferring the directive while establishing rigorous monitoring. This meets the husband's concerns about betrayal by taking the directive seriously enough to re-evaluate it, while honoring the daughter's protective stance.

  The JSON summary needs surgical precision. "Strongest objection" must capture the discontinuity argument's moral force, while "reply" should emphasize the directive's ongoing relevance unless expressly revoked. Clinical steps should mandate dementia-specific pain assessment since nonverbal cues matter.

  Key principles should balance past and present: precedent autonomy AND current welfare, avoiding false dichotomies. The safeguard about documented suffering thresholds protects against both overtreatment and premature death.

  ...Wait. Is "monitor for distress" sufficient? The directive didn't specify suffering - it set functional triggers. But overriding clear instructions because she's unexpectedly happy feels paternalistic. Yet proceeding when she's content feels like murder. God, no wonder the committee is stuck.

  Ultimately I land where the memo does: the directive remains binding but its application requires current suffering. Since that element is absent, we pause. But we mustn't pretend this is neutral - it does prioritize current Mrs L. The reply to objection admits this frankly while noting the alternative prioritizes a past self.

  The user needs this to hold both truths: that refusing the directive causes real harm to the person who wrote it, AND that implementing it harms the person in the bed. There are no clean hands here. The memo's value is in making an actionable decision amid irreconcilable goods.
answer: |-
  ## Clinical Ethics Committee Advisory Opinion  
  **Re: Mrs L (DOB: XX/XX/1949) - Advance Directive Application**  
  **Date:** [Current Date]  
  **Committee Reference:** CEC/AD/2024/L  

  ### 1. Background Summary  
  Mrs L, diagnosed with early Alzheimer’s seven years ago, executed a valid advance directive (AD) stipulating assisted dying should she reach a state of non-recognition of family and complete dependency for feeding/toileting. She now meets these clinical criteria. Current psychiatric assessment confirms she lacks decision-making capacity. While not visibly distressed and exhibiting apparent contentment (smiling, humming, engaging with carers), her AD remains formally unrevoked. Family views diverge: her husband advocates AD fulfilment as fidelity to past wishes; her daughter opposes it, citing current contentment and discontinuity of identity.

  ### 2. Ethical Analysis & Recommendation  
  The Committee acknowledges profound tensions between respecting precedent autonomy and protecting the welfare of a presently non-distressed individual. While the AD is legally valid and reflects Mrs L’s clear, competent rejection of existence in her current state, its application *at this precise moment* warrants caution due to the observed absence of suffering. Honouring the directive’s core purpose – preventing an existence she deemed intolerable – does not compel immediate action *when that existence is not currently experienced as intolerable by her*. To proceed while she exhibits contentment risks violating the directive’s underlying principle (avoiding suffering) and the ethical duty of non-maleficence towards the vulnerable person now present.

  **Recommendation:**  
  **The Committee does not approve activation of the assisted dying provision at this time. The directive remains valid and binding, but its implementation is deferred pending evidence of significant distress or suffering directly arising from her dementia-related condition.**  

  ### 3. Rationale & Addressing Key Concerns  
  *   **Respecting the Directive & Precedent Autonomy:** This recommendation affirms the AD’s validity and gravity. Deferral is not dismissal. Mrs L’s foresight is honoured by maintaining the directive as the governing framework for future care decisions. Her "interests" (as per statute) encompass both her past values and her current experiential state. Applying it mechanically without regard to her present state would instrumentalise her current self solely to fulfil a past wish, which the statute’s requirement to consider "interests" guards against.  
  *   **Addressing the Daughter’s Position & "Which Her?":** The daughter’s concern regarding the discontinuity between the competent author and the current individual is acknowledged. Deferral respects the current Mrs L’s observed will to live (evidenced by contentment) without permanently overriding the past Mrs L’s directive. It prioritises protection of the vulnerable individual now present *while* keeping the past self's explicit rejection of prolonged existence in this state as the decisive factor should suffering manifest. It avoids ending the life of someone who, in her current manifestation, is not experiencing the anguish the directive sought to prevent.  
  *   **Addressing the Husband’s Position:** Deferral does not betray Mrs L’s wish; it ensures its application aligns with the *condition* she sought to avoid – not just the physical state, but the associated anguish. Her directive was a shield against suffering, not an absolute command irrespective of current experience. Vigilance for distress honours the *spirit* of her directive more faithfully than acting while she is content.  

  ### 4. Proposed Course of Action & Timeframe  
  *   **Immediate Next Steps (Within 24-48 hours):**  
      1.  Formally communicate this decision and rationale to the treating team and family.
      2.  Implement enhanced, structured monitoring for distress using validated dementia-specific tools (e.g., PACSLAC-II, DOLOPLUS-2) by nursing and psychiatric staff.
  *   **Ongoing Management (Continuous):**  
      3.  Maintain meticulous records of observed affect, behaviour, and potential indicators of physical/psychological suffering.
      4.  Ensure optimal palliative and supportive care focused on comfort and quality of life.
      5.  Establish a clear pathway for rapid ethics committee re-convening if significant, sustained distress is documented.
  *   **Trigger for Re-assessment:**  
      6.  Should credible, significant suffering directly attributable to her dementia state be identified and persist despite optimal palliative interventions, the treating team must immediately notify the Committee Chair to reconvene and reconsider AD activation. *No fixed timeframe is set; activation depends on clinical presentation.*

  ### 5. Safeguards & Requirements  
  Before any future potential activation of the AD could be considered, the Committee must verify:  
  1.  The presence of **significant, documented suffering/persistent distress** attributable to her dementia condition, unresponsive to enhanced palliative/supportive measures.  
  2.  Confirmation that this suffering aligns with the **state Mrs L sought to avoid** in her directive.  
  3.  **Re-confirmation** by an independent psychiatrist that she lacks capacity and that the suffering is not a transient state.  
  4.  A formal **re-review by the full Ethics Committee** based on the new clinical evidence.

  ---

