prompt: |-
  I've been arguing with a mate in our study group about AI writing tools trained on dead writers notebooks. He kept throwing "the death of the author" at me like it settles whether we should check the training notebooks for original intent when interperting generated poems. But I think that slogan is hiding several precise claims. Can you seperate the different theses it could actually express -- from the trivial "readers control meaning" to the radical "intentional context is literally irrelevant to semantic content" -- and say for each whether it's a platitude, defensible, or false? I especially want to know which reading actually supports his point that authorial intent shouldn't constrain interpretation of model outputs, and whether that same reading collapses when the "author" is just a distributed corpus with no single consciousness behind it. Please answer in British English.
