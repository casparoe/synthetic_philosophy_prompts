  Key concerns bubbling beneath their query: How to grant pathogens/climate "agency" without anthropomorphizing? How to prevent narrative prominence from sliding into causal primacy? And crucially - does the analogy solve the problem or just disguise it?

  For the correspondence table, I need to carefully map each element across domains while highlighting where normative loads shift. The architect's intentionality is particularly troublesome when applied to viruses or volcanoes. The "design" component seems especially vulnerable to teleological creep - virulence factors aren't "designed for" outcomes in any intentional sense.

