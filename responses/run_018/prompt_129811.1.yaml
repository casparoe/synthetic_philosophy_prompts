answer: |-
  Below is a complete design for your 90-minute workshop, incorporating a hidden nonlinear degradation curve and structured to create visceral understanding of commons depletion. The simulation avoids the overfishing trope by using a **shared computational resource** theme (resonating with tech teams) and emphasizes *information asymmetry* through concealed thresholds.

  ---

  ### **Simulation: "The Cloud Cache Crisis"**  
  *Thematic Setup*:  
  16 participants are "Dev Teams" at a startup using a shared cache (e.g., Redis/Memcached) to accelerate user requests. The cache ("The Pool") starts healthy but degrades nonlinearly with excessive reads. Teams earn points by processing user requests (withdrawals), but if the Pool collapses, all lose points. Stakes: Points convert to coffee vouchers (1 point = $0.10 voucher; max ~$5/player if they avoid collapse).  

  ---

  ### **Rules & Materials**  
  **Materials**:  
  - Whiteboard (display Pool status)  
  - 16 Decision cards (0/1/2) for withdrawals  
  - Hidden facilitator chart: [Degradation Table](#degradation-table)  
  - Role sheets (1 per player)  

  **Key Rules**:  
  1. **Pool Status**: Starts at **100 units**. Displayed publicly each round.  
  2. **Withdrawals**: Each team secretly chooses to take 0, 1, or 2 units/round (represents cache reads).  
  3. **Points**: 1 point per unit withdrawn. Withheld if Pool collapses *that round*.  
  4. **Degradation**:  
     - **Hidden Curve**: Damage per withdrawal depends on Pool’s current health:  
       - **Safe Zone** (>50 units): 1 unit damage per withdrawal (e.g., 10 withdrawals → 10 damage).  
       - **Stress Zone** (50–31 units): 1.5× damage (e.g., 10 withdrawals → 15 damage).  
       - **Critical Zone** (≤30 units): 2× damage + **collapse risk** (see below).  
     - **Collapse**: If Pool enters a round ≤30 units, it collapses if *total withdrawals > current Pool*. All points lost that round, and game ends.  
  5. **Information Asymmetry**:  
     - Players know Pool’s *current level* but not degradation rules or zones.  
     - Role sheets hint at instability but no specifics:  
       > *"Heavy usage may degrade performance. If the Pool drops too low, it might crash."*  

  **Degradation Table (Facilitator Only)**:  
  | Current Pool | Damage Multiplier | Collapse Condition          |  
  |--------------|-------------------|-----------------------------|  
  | 100–51       | 1.0×              | None                        |  
  | 50–31        | 1.5×              | None                        |  
  | ≤30          | 2.0×              | If Σ Withdrawals > Pool     |  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Setup**  
  - Assign roles (16 teams), explain theme/goals.  
  - Emphasize: *"Decisions are private. Pool updates are public. Goal: Maximize points."*  
  - Distribute decision cards and role sheets.  

  **10–55 min: Gameplay (6 Rounds Max)**  
  - **Each Round (7 min)**:  
    1. **Announce Pool** (1 min): Write current Pool on whiteboard.  
    2. **Secret Decisions** (2 min): Teams submit 0/1/2 via cards.  
    3. **Calculate** (1 min): Sum withdrawals, apply hidden degradation.  
    4. **Update & Reveal** (3 min):  
       - New Pool = Old Pool − (Σ Withdrawals × Multiplier).  
       - If ≤30 and Σ Withdrawals > Pool → **COLLAPSE** (end game).  
       - Else, post new Pool and total withdrawals.  
       - Award points (if no collapse).  
  - **Round Progression Predictions**:  
    - **Rounds 1–2**: Pool >50. Withdrawals feel "free" (low damage). Most take 2.  
    - **Round 3**: Pool dips to 40–50. Withdrawals spike damage (1.5×).  
    - **Round 4–5**: Pool ≤30 (Critical Zone). Collapse likely (high damage + threshold).  

  **55–90 min: Debrief**  
  - **Reveal Mechanics** (5 min): Show degradation table and collapse rule.  
  - **Key Moments → Concepts** (20 min):  
    | Simulation Moment         | Concept                              | Discussion Question                                                                 |  
    |---------------------------|--------------------------------------|-------------------------------------------------------------------------------------|  
    | Early high withdrawals    | Individual rationality               | *"Why did taking 2 units feel safe early on? How does this mirror real commons?"*   |  
    | First "stress" drop (≤50) | Nonlinearity                         | *"What did you notice about the Pool drop? Why couldn’t you predict it?"*           |  
    | Failed group negotiation  | Monitoring asymmetry                 | *"Did anyone propose cooperation? Why was it hard to trust/verify?"*                |  
    | Collapse (≤30)            | Threshold effects                   | *"How did the sudden collapse affect 'responsible' teams? What does this reveal?"*  |  
  - **Conceptual Links** (10 min):  
    - **Rivalrous vs. Non-Rivalrous**: Cache is *rivalrous* (one team’s use reduces availability). Contrast with *pure public goods* (e.g., open-source code).  
    - **Hidden Depletion**: Stress zones mimic real-world "invisible tipping points" (e.g., aquifer depletion, CO₂ thresholds).  
  - **Limitations & Reality Check** (5 min):  
    - **Unmodeled Feature**: *Intergenerational stakes*. Real commons (e.g., climate) burden future generations.  
      - *Verbal Bridge*: *"Here, you bore all costs. In reality, we externalize depletion to future people—making cooperation harder."*  
  - **Q&A** (10 min).  

  ---

  ### **What Will Go Wrong (and Recovery)**  
  1. **Problem**: Collapse happens too early (Round 3–4) if teams over-extract.  
     - *Recovery*: **Steer mid-game**: If Pool drops <40 by Round 3, announce: *"System alerts: Unusual latency spikes."* (Hints at fragility without revealing mechanics).  

  2. **Problem**: Teams collude perfectly (all take 0) → Pool never degrades.  
     - *Recovery*: **Inject tension**: After Round 2, privately give 4 random teams a "bonus user surge" (+1 extra point if they take ≥1). Tests trust.  

  3. **Problem**: Frustration if "cooperators" lose anyway.  
     - *Leverage It*: Highlight in debrief—"This mirrors why real cooperators demand enforceable rules."  

  4. **Problem**: Math errors slow the game.  
     - *Prevention*: Pre-calculate damages for likely totals (e.g., 16 withdrawals: Safe=16, Stress=24, Critical=32).  

  ---

  ### **Why This Works**  
  - **Twist Achieved**: The hidden Stress/Critical zones force "rational" early actions to trigger delayed, collective collapse. Players *feel* the threshold.  
  - **Tech Resonance**: Cache depletion is relatable (unlike pastures/fishing).  
  - **Debrief Structure**: Explicitly ties emotional moments (e.g., collapse shock) to theory.  
  - **Stakes**: Low-risk (coffee vouchers) but tangible enough to incentivize self-interest.  

  Run this once, and your team will never view shared resources the same way.
