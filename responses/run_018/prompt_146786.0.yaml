prompt: |-
  As a retired molecular biologist who has recently begun studying philosophy of science, I want to specify what an adequate theory of evolutionary explanation must deliver in light of the Gould–Lewontin spandrels critique. I am not asking for a bibliography, citation list, or literature review by reference. Instead, write the desiderata: the full specification of requirements that any such theory must satisfy, with the motivating empirical or conceptual case behind each one. The theory must explain clear adaptations—such as the vertebrate eye—without licensing the inference that every trait is adaptive. It must accommodate genuine spandrels, structural byproducts that carry no present selective value, without reclassifying them as exaptations or as adaptations serving hidden functions. It must preserve the distinction between selection for a trait and selection of a trait. It must remain consistent with evolutionary developmental biology regarding deep homology and developmental canalization. In addition, include the requirement that the theory account for what I call epistatic spandrels: traits that are not directly selected but are developmentally locked to strongly selected regulatory networks, persisting despite being selectively neutral or even mildly deleterious. Identify which pairs of desiderata appear jointly unsatisfiable—particularly whether demanding both strong predictive specificity for adaptive explanations and complete openness to non-adaptive alternatives renders the framework unfalsifiable. Then, briefly, indicate how strict pan-adaptationism, the Gould–Lewontin structuralist program, and a pluralist evo-devo synthesis fare against your list, but keep the weight on the criteria rather than on the scorecard. Write formally, as a specification for philosophical discussion.
reasoning: |-
  Okay, the user is a retired molecular biologist diving into philosophy of science. They want a detailed specification for a theory of evolutionary explanation that addresses the Gould-Lewontin spandrels critique. Let me unpack their query. 

  First, they clearly state they're not after citations but desiderata—specific requirements with justifications. The key points they mention: must explain clear adaptations (like the vertebrate eye) without assuming every trait is adaptive; must handle genuine spandrels without relabeling them as exaptations; must preserve selection-for vs selection-of distinction; must align with evo-devo concepts like deep homology; and must include "epistatic spandrels"—traits developmentally locked to selected networks. 

  Hmm, the tricky part is identifying conflicting desiderata. They hint that demanding both predictive specificity for adaptations and openness to non-adaptive alternatives might create unfalsifiability. That's a real tension: if a theory can flexibly explain anything as either adaptive or non-adaptive without clear thresholds, it risks becoming untestable. 

  User's background suggests they'll appreciate precise terminology—they used "epistatic spandrels" themselves, so I should define that rigorously. As a molecular biologist, they'll expect mechanistic depth, especially regarding developmental constraints. Their frustration with pan-adaptationism seems evident given the emphasis on spandrels. 

  The assessment of frameworks needs nuance. Pan-adaptationism fails most criteria but excels at predictive specificity for adaptations. Structuralism handles constraints well but stumbles on adaptationist explanations. Pluralism balances them but risks the falsifiability issue. User wants criteria emphasized over "scorecards," so I'll weave assessments into the desiderata discussion rather than tabulating. 

  Biggest challenge: articulating why "epistatic spandrels" are distinct from exaptations. Must stress they're developmentally hardwired neutrals/deleterious traits, not co-opted features. Also, the selection-for/of distinction needs concrete examples—maybe hammer vs handle analogy? 

  Finally, the joint unsatisfiability point deserves expansion. It's not just predictive specificity vs openness; it's that methodological openness (allowing any trait to be non-adaptive) weakens predictive claims for adaptations. A theory can't firmly predict adaptation while always permitting non-adaptive fallbacks. That's the core paradox.
answer: |-
  ## Desiderata for an Adequate Theory of Evolutionary Explanation in Light of the Spandrels Critique

  **Preamble:** Any adequate theory of evolutionary explanation (TEE) must reconcile the power of natural selection as a creative force with the empirical reality of non-adaptive origins and evolutionary constraints, as rigorously demanded by the Gould-Lewontin critique. The following constitute the necessary and sufficient conditions such a TEE must satisfy:

  1.  **Requirement of Adaptationist Parsimony (RAP):**
      *   **Specification:** The TEE must provide robust, empirically testable criteria and mechanisms for identifying and explaining genuine adaptations (e.g., vertebrate camera eye, bacterial flagellum) as products of natural selection *for* a specific function(s).
      *   **Motivation:** Empirical evidence overwhelmingly demonstrates the existence of complex traits whose origin and maintenance are best explained by cumulative selection for their functional utility. Failure to explain these concedes an empirically unjustified limitation to evolutionary theory. The case of convergent evolution (e.g., wings in birds, bats, insects) strongly implies functional optimization via selection.

  2.  **Prohibition on Pan-Adaptationist Inference (PPAI):**
      *   **Specification:** The TEE must explicitly preclude the methodological or ontological inference that *every* trait, feature, or aspect of an organism is necessarily an adaptation or the direct product of natural selection *for* its current form or role.
      *   **Motivation:** The spandrels critique empirically demonstrates that many traits arise as necessary structural or developmental byproducts (e.g., the human chin, male nipples, the panda's "thumb" as a radial sesamoid bone). The TEE must formally acknowledge this non-adaptive origin as a distinct category, preventing the unfounded "just-so stories" criticized by Gould and Lewontin.

  3.  **Recognition of Genuine Spandrels (RGS):**
      *   **Specification:** The TEE must accommodate and provide criteria for identifying traits that are *structural or architectural byproducts* of other selected features or developmental constraints, possessing *no current selective value* (positive, negative, or latent) in themselves. These must be conceptually distinct from adaptations or exaptations.
      *   **Motivation:** Architectural examples like metabolic pathways constrained by thermodynamic necessity, or the literal spandrels of San Marco, illustrate traits arising purely as consequences of structure/development, not selection. Their existence necessitates a category beyond "current function" or "potential utility."

  4.  **Preservation of Selection-For vs. Selection-Of Distinction (PSFSO):**
      *   **Specification:** The TEE must maintain a clear conceptual and operational separation between:
          *   *Selection FOR:* The causal process where a trait's specific property (e.g., hemoglobin's oxygen-binding affinity) is directly targeted by differential survival/reproduction.
          *   *Selection OF:* The incidental selection of a trait *because* it is physically or developmentally linked to a trait under selection *for* (e.g., selecting for sickle-cell hemoglobin heterozygosity *selects of* the sickle-cell allele itself).
      *   **Motivation:** Failure to distinguish leads to misattribution of adaptive purpose (e.g., falsely claiming the sickle-cell *allele* is *for* malaria resistance, rather than being selected *because* it is linked to the heterozygote phenotype which *is for* resistance).

  5.  **Integration with Evolutionary Developmental Biology (IEDB):**
      *   **Specification:** The TEE must be consistent with, and incorporate explanatory mechanisms from, evolutionary developmental biology (evo-devo), specifically:
          *   **Deep Homology:** Recognition that conserved genetic regulatory networks (e.g., Hox genes, Pax6) underlie the development of non-homologous structures across distantly related taxa, constraining and enabling evolutionary possibilities.
          *   **Developmental Canalization:** Explanation of how developmental processes buffer phenotypic variation against genetic and environmental perturbation, leading to constrained evolutionary trajectories and the persistence of ancient body plans ("phylotypic stages").
      *   **Motivation:** Evo-devo provides the mechanistic basis for understanding how developmental constraints generate non-adaptive forms (spandrels) and limit the scope of viable variation upon which selection can act (e.g., tetrapod limb structure despite diverse functions).

  6.  **Accommodation of Epistatic Spandrels (AES):**
      *   **Specification:** The TEE must provide criteria and mechanisms for identifying *epistatic spandrels*: traits that are developmentally locked into strongly selected regulatory networks via epistatic interactions or pleiotropy, are selectively neutral or mildly deleterious in themselves, but persist because their modification would disrupt essential network functions.
      *   **Motivation:** Molecular biology reveals pervasive gene regulatory networks (GRNs) where mutations in key regulators have pleiotropic effects. Traits arising from modules downstream of a crucial, highly conserved regulator might be fixed or constrained not by direct selection, but by their developmental linkage to the selected function of the core network (e.g., non-functional vestiges within a GRN controlling limb development). These differ from "classical" spandrels by being locked via genetic/epistatic mechanisms rather than purely physical structure.

  **Analysis of Joint Unsatisfiability:**

  *   **Conflict:** The conjunction of **Requirement of Adaptationist Parsimony (RAP)** (demanding strong, testable criteria *for* adaptive explanations) and the **Prohibition on Pan-Adaptationist Inference (PPAI)**/**Recognition of Genuine Spandrels (RGS)**/**Accommodation of Epistatic Spandrels (AES)** (demanding robust criteria *against* adaptive explanations and openness to non-adaptive alternatives) creates a significant tension.
  *   **Nature of Tension:** RAP seeks methodological strength through specificity and predictive power in identifying adaptations. PPAI/RGS/AES require methodological openness by insisting that non-adaptive explanations are *always* viable *a priori* for any trait. This risks rendering the TEE **methodologically unfalsifiable** regarding adaptation claims.
      *   *Why?* If failure to find evidence *for* adaptation (per RAP's criteria) can *always* be explained by invoking a spandrel or constraint (per PPAI/RGS/AES), then the adaptive hypothesis can never be definitively falsified. The criteria for identifying a "genuine spandrel" or "epistatic spandrel" might become a refuge for failed adaptationist hypotheses, undermining RAP's demand for rigor. Conversely, RAP's demand for strong adaptive criteria might lead to dismissing genuine non-adaptive explanations prematurely. Resolving this tension without sacrificing either empirical rigor or conceptual openness is a core challenge.

  **Assessment of Existing Frameworks (Illustrative, not Exhaustive):**

  *   **Strict Pan-Adaptationism:**
      *   *Fulfills:* RAP (strongly, often exclusively).
      *   *Violates:* PPAI (fundamentally), RGS (denies existence or reclassifies), PSFSO (often collapses distinction), IEDB (minimizes constraints), AES (denies or reclassifies). Its strength in RAP is undermined by its inability to handle the empirical realities motivating the other desiderata.

  *   **Gould-Lewontin Structuralist Program:**
      *   *Fulfills:* PPAI (core tenet), RGS (core tenet), potentially PSFSO (implicitly), IEDB (aligns with emphasis on constraints), potentially AES (consistent with developmental lock-in).
      *   *Violates/Weak on:* RAP. While not denying adaptations exist, its primary focus is critique and emphasis on constraints, often lacking equally robust *positive* criteria for definitively identifying and explaining adaptations beyond simple functional utility. May struggle with the predictive specificity demanded by RAP.

  *   **Pluralist Evo-Devo Synthesis:**
      *   *Fulfills:* PPAI, RGS (in principle), PSFSO (can accommodate), IEDB (foundational), AES (explicitly designed for).
      *   *Challenges:* RAP & the associated **Joint Unsatisfiability**. This framework is best positioned to integrate the demands by providing mechanistic (developmental/genetic) criteria for *both* adaptive and non-adaptive explanations. However, it most acutely faces the challenge of developing operational criteria for RAP (specific adaptive identification) that are robust enough to avoid being undermined by the openness of PPAI/RGS/AES, and vice-versa, without falling into unfalsifiability. Its success hinges on resolving the methodological tension inherent in the desiderata.

  This specification provides the necessary conceptual architecture for evaluating theories of evolutionary explanation against the enduring challenges posed by the spandrels critique and modern biological understanding.
