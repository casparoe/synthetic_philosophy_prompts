answer: |-
  Here are 10 interview questions probing "inertial framing," designed to challenge and deepen the discussion, with embedded reasoning risks noted:

  1.  **Ontological Shift:** You argue inertial framing isn't a *solution* but an *ontological shift* – we inhabit a world where properties have inherent stability dispositions. Could you elaborate on what constitutes this disposition metaphysically? Is it a fundamental causal power, a brute fact, or something else? *(Risk: Blurring the line between a metaphysical primitive and a disguised representational commitment – is "disposition" just a label for the persistence logic we expect?)*
  2.  **The Standard Objection & Implementation:** A major criticism is that you've simply relocated the frame problem's computational burden – from updating representations to *implementing* these "stability dispositions" in a system. Isn't this just pushing the problem into an obscure metaphysics that doesn't actually help builders of AI systems? *(Risk: Presumes a clear separation between metaphysics and implementation she might reject outright.)*
  3.  **Implementation/Failure Mode Follow-Up:** Suppose we grant the ontology for argument's sake. If implementation is an "engineering detail," what specific failure mode in a robotic planning system – say, one constantly re-checking irrelevant door states or failing to propagate indirect effects – would convince *you* it fundamentally *lacks* these stability dispositions, rather than just lacking the right logical formalism or efficient inference mechanism? *(Risk: She might argue *any* failure is an implementation flaw, making the disposition empirically unfalsifiable at the system level.)*
  4.  **Naive Physics Comparison:** Your emphasis on default persistence sounds reminiscent of the "naive physics" findings in developmental psychology, where infants expect objects to persist unless interacted with. How is inertial framing *more* than just positing that humans have innate, non-representational expectations matching this naive physics? *(Risk: Underestimating potential overlap or the representational nature of "expectations" in psych literature.)*
  5.  **Causal Powers vs. Representations Follow-Up:** If you distinguish inertial framing by appealing to *causal powers* in the world rather than mental representations, how does this avoid the charge of merely externalizing the representational content? Isn't the system's *sensitivity* to those causal powers still a representational/computational achievement? *(Risk: Assumes causal powers require representational mediation for cognition, which she might deny via direct perception/embodiment.)*
  6.  **The Ramification Problem:** How does inertial framing handle the "ramification problem" – the cascading indirect consequences of an action (e.g., moving an object potentially breaking a fragile vase it supports)? Does the inherent stability of properties prevent such cascades, or simply make them rarer? *(Risk: Might oversimplify the ramification problem's complexity, even given inertia.)*
  7.  **Ramifications: Ontological vs. Representational Follow-Up:** You suggest ramifications are problematic only for *representational* systems, not ontological ones. But wouldn't a truly ontological system still have to *track* or be *affected by* these indirect causal chains? How does positing stability dispositions absolve a cognitive system of needing to manage potential cascades? *(Risk: Confusing the world's causal structure with the system's need to anticipate/reason about it – stability might not prevent *unforeseen* interactions.)*
  8.  **Scope of Inertia:** Are *all* properties governed by this inertial tendency? What about transient properties (like "being in shadow"), highly dynamic systems (like weather), or quantum states? Doesn't defining the precise scope of "stability disposition" require the very kind of contextual reasoning the frame problem highlights? *(Risk: Exposing potential circularity – stability might only apply where we *define* it to apply, based on context.)*
  9.  **Comparative Cognition & Embodiment:** If human cognition "inhabits" this inertial ontology, what does your view predict for non-human animals or radically embodied AI? Should we expect creatures without complex symbolic representation (e.g., insects, octopuses) to also fundamentally exploit stability dispositions, or is this unique to representational minds inhabiting a specific ontology? *(Risk: Over-anthropomorphizing or under-specifying the link between ontology and cognitive architecture.)*
  10. **Empirical Underminers:** What single empirical finding – from robotics (e.g., a non-representational system solving complex planning without inertia-like axioms), comparative cognition (e.g., an animal demonstrating fluid context shifts *without* default persistence errors), or neuroscience (e.g., neural dynamics showing constant global updating, not stability-based gating) – would genuinely *undermine* inertial framing as a core insight, rather than just posing a challenge your framework could potentially accommodate? *(Risk: She might absorb *any* counter-evidence by arguing the system isn't truly "inhabiting the ontology" or that the implementation is flawed, making the view hard to falsify.)*

  **Key Reasoning Risks Highlighted:**

  1.  **Disposition/Causation Circularity:** The core risk is defining "stability disposition" as persisting unless causally interrupted, while defining "causal interruption" as what disrupts stability. This circularity (Q1, Q5, Q7) makes the primitive hard to pin down independently.
  2.  **Implementation Dodge:** Dismissing implementation as mere "engineering" (Q2/Q3) risks making the view empirically vacuous for AI. If *no* conceivable system failure proves a *lack* of the disposition (only bad implementation), the concept loses predictive/explanatory power.
  3.  **Blurry Boundary with Logic:** While she contrasts it with logical formalisms, many non-monotonic logics (e.g., Circumscription) *also* bake in inertia as a default. The novelty might lie more in the *metaphysical commitment* than the computational behavior (Q1, Q6, implicit in framing).
  4.  **Scope & Context Problem:** Defining *which* properties are "stable by default" and under what contexts seems crucial (Q8). This risks reintroducing the very frame problem (determining relevance) the ontology was supposed to dissolve.
  5.  **Falsifiability Challenge:** The "inhabiting an ontology" claim (Q10) is particularly vulnerable. If neuroscience found only predictive updating, she could claim neurons are implementing the ontology. If a robot succeeded without inertia, she could claim it implicitly uses it. Finding a genuine empirical underminer is philosophically tricky.

  These questions push on the metaphysical foundations, empirical implications, boundaries with related fields, potential weaknesses, and falsifiability, while aiming to stay within the conceptual debate and avoid requiring inaccessible references.
