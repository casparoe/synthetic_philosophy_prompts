answer: |-
  ### Decision Tree: Value of Original Artworks vs. Perfect Perceptual Duplicates  
  **Root Question:** *Does an original artwork possess value that an indistinguishable forgery cannot have?*  

  ---

  #### **Branch 1: NO**  
  → **Leaf: Pure Aestheticism**  
  - **Core Position:** Artistic value resides solely in perceptible properties.  
  - **Awkward Commitment:** Must deny that the *Mona Lisa* in the Louvre has value beyond a perfect, undetectable duplicate hanging elsewhere. Provenance, history, and artist’s intent are irrelevant to aesthetic judgment.  

  ---

  #### **Branch 2: YES**  
  **Node 2.1:** *Is perceptual identity sufficient for artistic value?*  
  → **YES** → **Leaf: Unnamed/Unexplored**  
  - **Diagnosis:** Contradicts root "YES" (which asserts extra-perceptual value). Logically incoherent: if perceptually identical objects must possess identical artistic value, forgeries cannot lack *any* value originals possess.  

  → **NO** → Proceed to **Node 2.2**.  

  **Node 2.2:** *Must the artwork’s creation involve direct manual involvement by the named artist?*  
  → **YES** → Proceed to **Node 2.3**.  
  → **NO** → Proceed to **Node 2.4**.  

  **Node 2.3:** *Does replacing ~95% of an artwork’s physical substrate destroy its originality?*  
  → **YES** → **Leaf: Causal-Historical Essentialism (Materialist Variant)**  
  - **Core Position:** Originality requires unbroken causal lineage to the artist’s *hand*. Extensive material replacement severs this link.  
  - **Awkward Commitment:** A ship-of-Theseus painting (e.g., a Rembrandt restored stroke-by-stroke) becomes a forgery after 95% replacement, despite institutional acceptance and historical continuity.  

  → **NO** → **Leaf: Restoration-Tolerant Causal View**  
  - **Core Position:** Originality persists if the causal chain of *artistic intention* remains unbroken, regardless of material replacement.  
  - **Awkward Commitment:** A painting 95% replaced by conservators retains full originality, even if all original molecules are gone, provided restorers followed the artist’s documented intent.  

  **Node 2.4:** *Can an artwork algorithmically generated posthumously (using only the artist’s corpus, no human hand) be an original?*  
  → **NO** → **Leaf: Institutional/Recognition-Based View**  
  - **Core Position:** Value derives from artworld conferral of status (e.g., museums, critics). Forgeries lack institutional legitimacy regardless of appearance.  
  - **Awkward Commitment:** A perfect forgery hung in the Louvre *by curatorial error* would possess the same value as the original until exposed—value collapses upon reclassification.  

  → **YES** → **Leaf: Unnamed/Unexplored**  
  - **Diagnosis:** Accepts posthumous AI as "original" without artist’s causal role. Conflicts with intuitions about authorship/agency. Why can’t identical AI works be multiplicable originals? Unattractive due to erasure of creative temporality.  

  ---

  ### Ambiguities & Limitations  
  1. **Institutional vs. Restoration-Tolerant Overlap:**  
     - If **manual involvement = NO** and **algorithmic original = NO**, the tree assigns institutionalism. However, an institutionalist *might* accept heavily restored works (if artworld does), blurring with restoration-tolerant views. The tree splits these based on manual involvement, but institutionalism’s flexibility creates ambiguity.  
     - *Flag:* Institutional views need not take a stand on material continuity, making Node 2.3 irrelevant to them.  

  2. **Causal-Essentialism’s Nuances:**  
     - Digital art (e.g., artist-designed algorithm executed by software) challenges Node 2.2. If "manual involvement" includes digital execution under artist supervision, it collapses into **NO**, but purists may insist on **YES**.  

  ---

  ### Logical Structure Summary  
  ```  
  ROOT: Extra value in original?  
  ├─ NO → Pure Aestheticism  
  └─ YES → Perceptual identity sufficient?  
     ├─ YES → Unnamed (Incoherent)  
     └─ NO → Direct manual involvement necessary?  
        ├─ YES → 95% replacement destroys originality?  
        │  ├─ YES → Causal-Historical Essentialism (Materialist)  
        │  └─ NO → Restoration-Tolerant Causal View  
        └─ NO → Posthumous AI generation original?  
           ├─ NO → Institutional View  
           └─ YES → Unnamed (Overlooked)  
  ```  

  This tree isolates commitments using concrete cases, exposing tensions in each theory while mapping unexplored territory.
