answer: |-
  Here’s a precisely framed case study centered on **Copán, Honduras (Late to Terminal Classic Maya, c. 750-900 CE)**, where the same archaeological record sustains both readings, hinging entirely on conceptual definitions:

  ### **The Material Ambiguities at Copán**  
  1. **Cessation of Elite Activities (c. 800-822 CE):**  
     - Abrupt end of carved stelae and hieroglyphic monuments after the reign of Yax Pasaj Chan Yopaat (last dated monument: 822 CE).  
     - Disappearance of high-status imports: obsidian from Ixtepeque/Kaminaljuyu and jade from the Motagua Valley cease in elite contexts.  
     - Royal palace complex (Group 10L-2) shows no new construction; Acropolis rituals end.  

  2. **Continuity of Non-Elite Lifeways (c. 800-950 CE):**  
     - Local ceramics (Copador polychrome, Sulaco unslipped) persist for ~150 years post-"collapse" with gradual stylistic evolution.  
     - Rural farmsteads in the Copán Valley (e.g., Site 7D-6-2) show uninterrupted occupation: wattle-and-daub houses repaired, maize agriculture continues.  
     - Domestic rituals (household shrines, burials under floors) and small-scale agrarian rites (rain petitions in caves) endure.  

  ---

  ### **Divergent Interpretations of the Same Evidence**  
  **Interpretation A: State Collapse**  
  > The cessation of monument construction and long-distance exchange reflects the implosion of a tributary state. Drought-induced crop failures (palynological evidence for aridification) and soil exhaustion (sediment studies showing erosion) undermined the elite’s ability to extract surplus. Starving commoners abandoned the failing center, leading to demographic collapse. The persistence of rural lifeways represents a remnant population surviving in a post-political landscape—a "society" no longer exists, only atomized households.  

  **Interpretation B: Deliberate Decentralization**  
  > The end of elite monuments and imports signals the rejection of centralized authority, not societal death. Facing ecological stress, communities deliberately dissolved the extractive state apparatus to reallocate labor from tribute (monuments/warfare) to subsistence. Ceramic and architectural continuity proves the population remained intact but reorganized into autonomous agrarian units. Jade/obsidian loss reflects a shift in values—prestige goods became irrelevant to a society focused on resilience.  

  ---

  ### **The Conceptual Hinge: What Constitutes "Society"?**  
  The disagreement turns on **whether hierarchical institutions are constitutive of society itself**.  
  - **Collapse Narratives** assume society is synonymous with *complex institutions*: when kings, monuments, and long-distance networks vanish, "society" ceases. Continuity of domestic life is epiphenomenal—a biological remnant, not a cultural system.  
  - **Transformation Narratives** define society as *a population reproducing its culture*: pottery traditions, land tenure, and domestic rituals signify enduring social bonds. Institutions are mutable tools; their dissolution is adaptive reconfiguration.  

  #### **Why This is Conceptual (Not Empirical)**  
  Both sides agree on all material facts but interpret them through opposed axioms:  
  | Axiom                          | Collapse View                                     | Transformation View                               |  
  |--------------------------------|---------------------------------------------------|---------------------------------------------------|  
  | **Necessity of Hierarchy**     | Centralized governance = society                  | Governance is a contingent tool; society = people |  
  | **Urbanism as Success Metric** | Monument abandonment = failure                    | Rural persistence = successful adaptation         |  
  | **Institutional "Death"**      | Elite institutions vanished → society died        | Institutions migrated to household/community level |  

  ---

  ### **Where "Collapse" Performs Unique Explanatory Work**  
  The term **collapse** insists on *epistemological rupture*: it explains the **irreversible severing of institutional memory** (e.g., Maya writing/calendar systems). At Copán, no later society rebuilt the Acropolis or revived stela cults—this discontinuity demands an account of *loss*, not just change.  

  ### **Where "Collapse" Risks Teleological Bias**  
  Calling this a collapse imposes a **normative judgment** that urban monumentality equals "success." It obscures evidence that rural Copánese may have experienced *increased well-being*: no labor drafts, no elite grain levies, sustained food sovereignty. What looks like "decline" from a royal perspective might be *liberation* from maladaptive complexity.  

  ---

  ### **Conclusion: The Copán Test Case**  
  Copán’s Terminal Classic record is a litmus test for theories of collapse:  
  - If "society" requires kings and pyramids → **collapse occurred** when elites fell.  
  - If "society" means people reproducing culture → **transformation succeeded** as communities reclaimed autonomy.  

  The material record *underdetermines* the choice—it is a philosophical decision about whether human collectives *are* their institutions or merely *inhabit* them. This is where archaeology meets political theory.
