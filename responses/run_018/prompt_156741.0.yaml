  (2) If a union is of a **type** for which that possibility is **inherently/structurally impossible** (impossible *because* of the kind of pairing it is), then it fails the membership condition.
  (3) Same-sex pairings are a **type** for which shared biological procreation is **inherently/structurally impossible**.
