  Here's the definitive breakdown of where the argument fails and what it costs:

  **Faulty Step:** Step (6) ("So by (1)-(2), their union also fails the membership condition") is incorrect because it misapplies the condition established in (1) and (2).

  **Type of Error:** **Equivocation on "kind of union" / "structurally closed".** The argument conflates **type-level impossibility** (inherent to the category of pairing) with **token-level impossibility** (specific to a particular instance due to contingent actions).

  *   **Step (3) (Same-Sex):** Correctly identifies a **type-level structural closure.** The *category* "same-sex pairing" is defined such that shared biological procreation is *inherently* impossible. It's a feature of the *kind* of thing it is.
  *   **Step (5) (Sterilized Couple):** Describes a **token-level structural closure.** The *specific instance* of an opposite-sex couple has rendered procreation impossible *through contingent actions* (sterilization, celibacy vow). The *kind* of union ("opposite-sex pairing") is *not* inherently closed to procreation; this specific couple has *made* it closed.

  **Why it Looked Ok:** The phrasing "structurally closed" in step (2) is ambiguous. It *sounds* like it covers both the inherent impossibility of a type *and* the engineered impossibility of a token. The argument exploits this ambiguity to treat the sterilized couple identically to the same-sex couple under the condition. The term "structurally" is doing heavy lifting, suggesting an impossibility rooted in the "structure" of the union, but the "structure" of opposite-sex unions *as a type* inherently *allows* procreation, even if a specific token structure has been altered.

  **Cost of Fix:** Accepting this distinction means **marriage's counterfactual membership condition is assessed at the type level, not the token level.** The relevant question is: "Is this union an instance of a *kind of union* for which shared biological procreation is a live possibility?" For the sterilized couple, the answer is "Yes" – they are an instance of the kind "opposite-sex union," which *is* the kind for which procreation is a live possibility. Their specific actions render it impossible *for them*, but the counterfactual possibility is defined by the *type* they instantiate. The cost is:
  1.  **Rejecting Step (6):** The sterilized couple *does* satisfy the counterfactual membership condition (as defined at the type level).
  2.  **Modifying Premise (2):** It must explicitly specify that "structurally closed" refers to closure inherent to the *type* of union, not closure contingently imposed on a specific token.
  3.  **Complexity:** It requires defending why the type-level counterfactual is the relevant one for institutional membership, not the token-level status. This involves deeper ontological arguments about institutional kinds.

  **Preferred Premise to Keep:** **(1)** is preserved. The core idea of counterfactual membership conditions tied to the institution's defining function remains intact, but clarified to operate at the level of the *type* of entity.

  **Confidence:** High (The type/token distinction is fundamental in ontology, and the equivocation is clear once identified).

  **The Fixed Argument:**
