  I'm a PhD student in philosophy, working on decision theory and population ethics, and I'm drafting a dissertation chapter on whether granting substantial credence to the simulation hypothesis should dampen fanatical longtermism — that is, whether it should reduce the weight given to interventions justified almost entirely by the astronomical expected value of the far future. I'd like a defended ranking rather than a survey. Candidate mechanisms include: shutdown risk (simulated worlds may be terminated, truncating the future our actions can affect); loss of causal leverage (a simulation's long-run trajectory may depend on the simulators' goals rather than on our choices); the countervailing direction (simulation possibilities might raise far-future stakes, e.g., by multiplying descendants or making the simulators' favor a dominant consideration); and evidential undercutting (the anthropic reasoning supporting the simulation hypothesis may independently erode the empirical picture longtermism relies on). Rank these — adding any I've missed — by how much they should actually shift the priorities of someone currently moved mainly by astronomical-waste arguments. For each, state what the effect depends on philosophically (e.g., substrate independence, the relevant anthropic principles), and what considerations would move it up or down the ranking. Grant for the exercise that we are probably simulated; I want to know which implications for far-future concern follow, which don't, and which are overrated. I need the arguments themselves, not the literature.
