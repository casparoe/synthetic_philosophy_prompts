  hey im a high schooler trying to wrap my head around embedded agency - you know, the idea that an agent is literally inside the world its modeling so it can never fully step outside to predict itself or its enviroment. there are tons of open questions floating around but i wanna know which ones are actually upstream. like, should people focus more on the self-reference loops (where thinking about your own code changes the code), or on the fact that you cant have a perfect model of the world because youre part of it, or on decision-theory problems where you have to reason about your own actions?

  which 2 or 3 lines of work matter most if the goal is figuring out whether rational agency is even possible for something embedded, and which ones are kinda overrated? defend the ordering - i want to know why one question being solved would unlock the others. also someone mentioned that embeddedness might really just be about computation/energy limits rather than logic - is that a real angle worth pursuing or a dead end? please dont just list papers, i cant access those anyway, just explain the dependency structure.
