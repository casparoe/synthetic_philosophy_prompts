  The rain hissed against the broad leaves overhead, a constant percussion to Elara’s frustration. She pointed again, finger rigid, at the churning brown water of the Serpent River where it surged around a half-submerged boulder. A distinct bulge of water, a temporary hillock formed by the collision with the rock, swelled, crested with foam, and dissolved back into the flow.

  "Kael," she said, forcing patience into her voice. "That. What is *that*?"

  Kael, his dark eyes reflecting the river’s movement, followed her gesture. He blinked slowly, then made a soft, flowing sound deep in his throat, accompanied by a downward sweep of his hand following the water’s path past the rock. "*Serev. Kai serev kora.*"

  Elara scribbled in her damp notebook: *Serev = (?) wave, bulge, current-feature? Context: transient water formation near obstacle.* She added, with a question mark: *Kora = around? through? with?*

  Yesterday, pointing to a similar bulge further upstream, she’d gotten the same "*Serev kai*," but when she’d pointed back to the *exact* spot a moment later, after the bulge had vanished, Kael had shaken his head slightly, a faint furrow on his brow. "*Tain serev*," he’d said. *Tain* was negation, she was sure. No *serev*. But the river was still there! She’d written: *Serev seems to denote a specific, momentary configuration of the water, not the water itself or a persisting phenomenon.*

  Her dictionary was a graveyard of crossed-out hypotheses. She’d thought she’d cracked it with a different phenomenon: the flickering light cast on the riverbank canopy by the moving water. Pointing to a bright, dancing patch of sunlight: "*Nal*," Kael had said. She’d noted *Nal = light-spot, reflection?*. But when the patch shifted an inch as the water moved, and she pointed again, expecting confirmation, Kael had corrected her. "*Kai nal*," he’d stated, then pointed to the *new* location: "*Se nal*." *Kai* again, and a new particle, *Se*. Was *Kai* ‘this instance of’? And *Se* ‘that different instance’? But the light seemed fundamentally the *same* phenomenon – just displaced.

  She tried again with the river bulge. "*Serev*," she said firmly, pointing as a new swell formed. "*This* serev." She waited until it dissipated. "*That* serev?" She pointed to the empty space. "*Tain serev*," Kael confirmed. "*Kai* serev *lin*." *Lin* seemed to be a completive particle, like ‘gone’ or ‘finished’. He then gestured broadly down the river, a flowing arc. "*Serev*."

  Elara stared at the gesture encompassing the entire, ever-changing torrent. "*Serev*… all of it? The whole river?" That couldn’t be right. Earlier words seemed to segment the flow – *serev* for bulges, *shol* for deep, slow-moving pools, *vrin* for rapids.

  Kael shook his head, not in negation, but as if clearing cobwebs. He pointed upstream, then traced an invisible path downstream with his finger, a single, unbroken line. "*Serev*," he repeated. Then he pointed emphatically at the spot where the bulge had been. "*Kai* serev *kora*." He mimicked the water hitting the rock and swelling – a specific, localized *action* confined to that immediate confluence. The bulge wasn't a *thing* that moved; it was an *occurrence* tied intrinsically to that precise configuration of water-flow and obstacle at that exact moment. Once the flow changed, even slightly, it was a *different* occurrence, requiring the demonstrative particle *kai* or *se* to anchor it in the now.

  Elara felt a familiar cold dread. She opened her notebook to the entry for *River*. She’d tentatively assigned it '*Serpentis*,' borrowing the colonial map’s name, with the gloss '*enduring body of flowing water*'. Below were her hesitant notes on *serev*, *shol*, *vrin* – all treated as *parts* of the river, distinct but persistent features. Kael’s correction cut through that scaffolding. If *serev* wasn't a part, but a fleeting *phase* tied to a specific confluence, and the word itself could also apply to the entire flow depending on the scope of the gesture… then what was the river? Not an object. Not a collection of objects. Just… flow. Process. Unsegmented.

  She remembered asking about a carved wooden bowl. Pointing to the whole: "*Geth*." Pointing to the rim: "*Geth*." Pointing to a crack: "*Kai geth*." *Geth* seemed to cover the entire artifact in its current state. When she chipped a tiny piece off later and pointed to it, Kael called it "*Se geth*," a new instance. The broken bowl was "*Tain geth*." *Geth lin*. Gone. The wood hadn't vanished; its configuration as a functional bowl had ceased. The *geth* was the functional state, not the wood itself. There was no word for 'wood', only for specific configurations: *geth* (bowl-state), *pyr* (log-state), *dul* (ash-state after burning).

  Her attempts to ask "Where is the bowl *now*?" or "What was it *before*?" resulted in confusion or answers that only described prior states as entirely separate *kai geth* or *se geth*. Time didn't preserve identity; it spawned discrete, unrepeatable occurrences.

  Elara looked down at her notebook. The neat columns – Native Word, Part of Speech, English Equivalent – suddenly seemed like a prison. Every entry smuggled in the idea of an enduring *thing*. 'River' implied a persistent entity. 'Wave' implied a discrete object moving through a medium. 'Bowl' implied matter retaining identity over time. But Kael’s language, in its very structure, refused that ontology. It spoke only of *phases*: *kai serev* (this water-swelling-here-now), *se geth* (that bowl-configuration-there-then). Her translation manuals weren't bridges; they were impositions, forcing a world of persistent objects onto a reality perceived as a cascade of unique, momentary events.

  She closed the notebook. The rain’s rhythm merged with the river’s roar. Kael watched her, his expression unreadable. Elara pointed, not to a bulge, but to the entire, surging, inseparable flux of the Serpent. She let her gesture flow with the current. Kael’s eyes softened. A slow nod. "*Serev*," he murmured, the sound itself fluid. He sat beside her on the muddy bank, silent now, observing the endless, unrepeatable *kai*. Elara left the notebook closed. The dictionary could wait. She needed to learn how to see the world as it flowed, moment by moment, without the anchor of 'it'.
