  First, I should acknowledge the core tension: distinguishing signaling from substance with minimal time. The user's hidden anxiety might be about fairness—they don't want to penalize unconventional but valid approaches (hence the ethnography example). They also hinted at career repercussions, but the procedure can't address that, so I'll explicitly note that limitation.

  The solution needs a step-by-step flowchart. Key questions should target: 1) whether the frame is necessary (not just fashionable), 2) if alternatives were considered, 3) citation functionality, and 4) problem-frame specificity. Judgment calls will be unavoidable—like assessing "sufficient justification" for rejecting a cascade—so I'll flag those steps clearly.

  For test cases: 
