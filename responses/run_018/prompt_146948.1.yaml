answer: |-
  Here's a reusable decision procedure designed for speed, pen-and-paper use, and targeting "framing herding." It focuses on **problem-frame alignment justification** and **intellectual independence**. Each step has clear exit criteria.

  **The Framing Herding Detection Procedure (20-Minute Version)**

  1.  **Identify the Core Problem & Proposed Frame:**
      *   *Question:* What specific, non-trivial problem is being solved? What methodological/theoretical frame is central to the solution?
      *   *Sufficient Answer:* Clear 1-2 sentence problem statement. Explicit naming of the frame (e.g., "Predictive Processing," "Do-Calculus," "Ethnography").
      *   *Exit:* If unclear, STOP - "Send back for clarification." If clear, proceed.

  2.  **Frame Necessity & Justification Check:**
      *   *Question:* **Why *this specific frame* for *this specific problem*?** Is there a clear argument beyond "it's popular" or "it's powerful"? Look for:
          *   Does it uniquely address a key *aspect* of the problem?
          *   Does it overcome a *specific limitation* of other approaches?
          *   Is it required to generate the *specific kind of answer* sought?
      *   *Sufficient Answer:* A clear, logical connection articulated in the proposal text, not just implied by citations. Evidence the applicant understands *why* this fits *here*.
      *   *Exit:*
          *   **Strong Justification:** Proceed to Step 3.
          *   **Weak/Vague Justification (e.g., "PP is powerful," "Ethnography captures context," generic benefits):** Proceed to Step 3 but flag for scrutiny.
          *   **No Justification/Only Appeal to Authority/Popularity:** STOP - "Potential Herding. Send back for justification."

  3.  **Alternative Frame Consideration Check:**
      *   *Question:* Is there a plausible, established alternative frame for this problem? Did the applicant acknowledge/engage with it? (Even briefly).
      *   *Sufficient Answer:* Mention of 1+ plausible alternative (e.g., "Unlike symbolic AI...", "While surveys could capture X, ethnography...", "Standard regression wouldn't handle confounding like..."). Doesn't need deep critique, just awareness.
      *   *Exit:*
          *   **Engages with Alternatives:** Strong indicator of independence. Proceed to Step 4.
          *   **Ignores Plausible Alternatives:** Raises herding suspicion. Proceed to Step 4 with high scrutiny.
          *   **Claims No Alternatives Exist:** Requires *strong justification* (Step 2 must be rock-solid). Proceed to Step 4 cautiously.

  4.  **Problem-Specificity Test (The Crucial Filter):**
      *   *Question:* **Could this proposal description be copied, replace the problem topic (aesthetics/social cog/influence networks), and still sound coherent?** Is the frame *applied* generically, or tailored?
      *   *Look For:* Concrete mechanisms, variables, or processes *specific* to the problem domain linked *explicitly* to the frame. How does the frame illuminate *this specific thing*?
      *   *Sufficient Answer:* Clear description of *how* the frame operationalizes key problem elements. Avoids generic frame jargon without domain grounding.
      *   *Exit:*
          *   **Highly Specific:** Low herding risk. Proceed to Step 5 (Risk Assessment).
          *   **Generic Application (e.g., "We model aesthetic judgment using PP," "Ethnography will reveal social dynamics," "Do-calculus infers influence" without specifics):** High herding risk. STOP - "Likely Herding. Frame applied generically. Send back."
          *   **Mixed Specificity:** Judgment Call. Proceed to Step 5 cautiously.

  5.  **Risk Tolerance Assessment (Judgment Call):**
      *   *Question:* Given Steps 1-4, does the *potential* for genuine insight outweigh the *risk* of the frame being ornamental?
      *   *Factors:* Track record (if known), feasibility, novelty of the *combination*, board's appetite for high-risk/high-reward vs. solid incremental work.
      *   *Exit:*
          *   **Low Risk/High Potential:** Approve.
          *   **High Risk/Low Potential:** Reject.
          *   **Ambiguous:** Discuss briefly with panel. Does the *specific problem* feel compelling enough to overlook frame concerns? (This is where gut feeling enters).

  **Applying the Procedure to Hypotheticals:**

  1.  **Predictive Coding & Aesthetic Judgment:**
      *   Step 1: Clear (Aesthetic Judgment in Museums / Predictive Processing).
      *   Step 2: *Likely Weak.* "PP explains all cognition" isn't specific. Does it uniquely address *aesthetic surprise* or *uncertainty reduction* in art? If not, weak.
      *   Step 3: *Likely Ignores.* Fails to mention simpler perceptual/emotional models? High suspicion.
      *   Step 4: *Likely Generic.* "We model visitor predictions using PP layers..." without specifying *what* predictions (content, timing, error signals) are crucial for *aesthetics*. High herding risk.
      *   **VERDICT:** STOP at Step 4 - "Likely Herding. Send back." (Gets the answer you dislike if you favor PP, but procedure flags generic application).

  2.  **Pure Ethnography for Social Cognition (Rejecting Computational):**
      *   Step 1: Clear (Social Cognition / Ethnography).
      *   Step 2: *Critical.* Why *only* ethnography? Does it capture micro-dynamics computational methods miss? Or just ideology? Needs strong justification.
      *   Step 3: *Engages (by rejection).* Explicitly rejects computational framing. This *counts* as engagement. Proceed.
      *   Step 4: *Likely Specific.* Ethnography is inherently domain-specific. The description *should* focus on specific social cues, interactions, contexts relevant to cognition. Low generic risk if well-described.
      *   Step 5: *Judgment Call.* Feasibility? Novelty? Board's view: Does rejecting computation seem *principled and necessary* based on Step 2 justification, or dogmatic? If justification is weak ("computational is reductive"), it might fail Step 2/Step 5. If strong ("need to capture tacit, embodied negotiation of meaning in real-time"), proceed.
      *   **VERDICT:** Passes Steps 1, 3, likely 4. Hinges on **Step 2 Justification Strength** and **Step 5 Risk Tolerance**. Could be approved (if justification strong) or sent back (if justification weak). *This is the judgment call dressed as a check (Step 2 strength assessment).* You feared unfair flagging, but procedure allows approval if justification is strong.

  3.  **Do-Calculus on Archival Letters (History of Philosophy of Science):**
      *   Step 1: Clear (Mapping Influence Networks / Do-Calculus).
      *   Step 2: *Potentially Strong.* Why Do-Calculus? Likely: To rigorously infer causality from observational text data (letters) while controlling for confounding (time, common influences, topic). This is a *specific* problem (causal inference in text) needing a *specific* tool.
      *   Step 3: *Likely Engages.* Mentions limitations of qualitative analysis or simpler network metrics for *causal* claims. Cites alternatives? (e.g., "Unlike co-citation analysis which shows association...").
      *   Step 4: *Likely Specific.* Describes *how* variables are operationalized from letters (e.g., mentions, argument adoption, tone shifts) and *how* do-calculus models interventions (e.g., "if letter X wasn't sent..."). Tailored to the data and question.
      *   Step 5: *Likely Low Risk/High Potential.* Novel application, strong alignment justification.
      *   **VERDICT:** Approve.

  **Confidence & Limitations:**

  *   **Overall Confidence:** **Moderate (6/10)**. It provides a structured, fast heuristic focusing on the most discernible red flags (lack of justification, generic application). It *can* distinguish blatant herding from strong convergence.
  *   **Least Confident Step: Step 4 (Problem-Specificity Test).** Why?
      *   Truly novel applications *might* start generically.
      *   "Specificity" is somewhat subjective. What's crucial for one reviewer might seem minor to another.
      *   Some frames *are* broadly applicable by design (like PP). The test might unfairly penalize ambitious, exploratory uses of powerful frameworks. *This is the weakest link.*
  *   **What the Procedure CAN'T Do:**
      1.  **Guarantee Novelty/Impact:** It flags *likely* herding, not lack of originality per se. A non-herding proposal could still be boring.
      2.  **Predict Career Effects:** Zero ability to assess if rejecting a cascade hurts the applicant.
      3.  **Assess True Competence:** A herding proposal might be technically sound but hollow. A non-herding one might be incompetently executed (though Step 2/4 might hint at this).
      4.  **Replace Deep Expertise:** It's a triage tool. Nuanced disciplinary fit judgments still matter.
      5.  **Catch Sophisticated Mimicry:** A very skilled herder could fabricate plausible justifications and specifics. This minimizes, not eliminates, risk.
      6.  **Handle Truly Radical/Paradigm-Shifting Rejections:** If an applicant rejects the cascade for a truly novel, undeveloped frame, Step 2/3 might unfairly flag it unless the justification is exceptionally compelling.

  **Key Judgment Calls Dressed as Checks:**

  1.  **Step 2: "Sufficient" Justification Strength.** What constitutes "clear, logical connection"? This relies on reviewer judgment.
  2.  **Step 3: "Plausible" Alternatives.** What counts as plausible within the field? Reviewer knowledge required.
  3.  **Step 4: "Generic" vs. "Specific" Application.** The core subjective assessment.
  4.  **Step 5: Risk Tolerance.** Entirely board-dependent.

  **How it Might Misfire (Approve Hollow):**

  *   An applicant provides a *superficially plausible but ultimately shallow* justification for the frame (Step 2) and includes *token specifics* (Step 4) that sound good but don't reflect deep problem understanding. The procedure relies on the reviewer spotting the lack of depth within 20 mins.
  *   An applicant cites cascade papers correctly *and* builds a technically sound project using the frame, but the core problem is trivial or the frame adds no real insight beyond what a simpler method could achieve. The procedure focuses on frame adoption, not overall project merit or significance.

  **Recommendation:** Use this as a structured checklist during your 20-minute read. Focus on actively looking for the answers to Steps 1-4. If Step 4 triggers a "Generic Application" exit, that's a strong herding signal. Step 5 forces explicit consideration of risk when the signal is ambiguous. It won't be perfect, but it should significantly improve your ability to filter out proposals riding the cascade wave without genuine need.
