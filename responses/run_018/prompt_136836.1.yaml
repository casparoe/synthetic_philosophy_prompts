answer: |-
  Here's the tight breakdown:

  Machiavelli's *virtù* here isn't *just* brute force domination over pure randomness. The gendered river imagery frames Fortune as a powerful, dynamic force – resistant chaos needing controlled interaction. *Virtù* is the adaptable agency matching this force: foresight builds dikes (preparation), while boldness "strikes" (decisive action seizing fleeting chances). When he says Fortune governs half our actions and we direct half, it's not a strict division but an interactive dynamic. Our *virtù* (boldness, prudence, preparation) doesn't just navigate Fortune's "other half"; it actively reshapes the conditions by exploiting vulnerabilities revealed in the chaos (like dikes channeling the river). Rashness fails without preparation; caution fails without decisive action. The internal logic is feedback: bold *virtù* applied *at the right moment* alters Fortune's immediate impact, effectively expanding the sphere of control within the chaotic half.

