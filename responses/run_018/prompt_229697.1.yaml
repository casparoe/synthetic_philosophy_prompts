answer: |-
  Here’s a rigorous 10-question sequence targeting the core tensions in performance legitimacy, designed to advance the debate beyond restatements. Follow-ups anticipate common rebuttals to prevent evasion:

  ### **1. Epistemic Circularity: Manufactured Consent**  
  *Q: Your evidence for legitimacy includes high regime approval in state-managed surveys. But when dissent carries severe costs—censorship, detention—how can we distinguish genuine legitimacy from performative compliance? If citizens can’t safely express disapproval, doesn’t this invalidate consent as evidence?*  
  **Likely Reply**: *"Outcomes like growth or safety reflect real satisfaction, independent of surveys."*  
  **Follow-up**: *But if we discard expressed preferences, aren’t you reducing legitimacy to technocratic efficiency—effectively arguing that *governments earn rightful authority by hitting KPIs*, regardless of whether citizens value those KPIs or had choices? Does that not collapse legitimacy into mere effectiveness?*

  ### **2. Counterfactual Baseline**  
  *Q: You claim Singapore/China achieved "what liberal democracy couldn’t have." But since liberal democracy wasn’t tried there, how do you establish the counterfactual? Isn’t this assertion untestable—and functionally identical to the regime’s own propaganda?*  
  **Likely Reply**: *"Chaos in transitional democracies proves the superiority of this model for *these* societies."*  
  **Follow-up**: *But doesn’t selecting failed democracies (e.g., post-Soviet states) ignore successful cases (e.g., South Korea/Taiwan)? If your comparison isn’t against a *plausible* liberal alternative but against a *strawman* of instability, is your thesis falsifiable?*

  ### **3. Endogeneity: Legitimacy or Stability?**  
  *Q: You define legitimacy as the belief that justifies compliance → enabling governance → delivering performance → reinforcing belief. Isn’t this a self-justifying loop where "legitimacy" is just a label for whatever sustains stability?*  
  **Likely Reply**: *"The loop is virtuous—performance validates the belief."*  
  **Follow-up**: *But if legitimacy is *defined by* the stability it produces, how is this different from saying "might makes right"? Does your framework allow us to critique any stable regime, or only those that fail?*

  ### **4. Fragility & Accountability**  
  *Q: If legitimacy depends on sustained performance, isn’t the model uniquely vulnerable to shocks—say, a Chinese growth crash? Wouldn’t collapse *confirm* that legitimacy was always contingent, not normative?*  
  **Likely Reply**: *"All regimes face pressure during crises; this creates accountability."*  
  **Follow-up**: *But liberal democracies have institutional outlets for discontent (elections, protests). If your model’s "accountability" is regime collapse—since dissent has no channel—isn’t that an admission that it lacks *political* (not just technical) resilience?*

  ### **5. Moral Floor & Repression**  
  *Q: Is there *any* human cost—Uyghur detention, execution of dissidents—that prosperity cannot legitimize? If yes, doesn’t your theory smuggle in liberal limits? If no, must we accept that *any* atrocity is justified by GDP growth?*  
  **Likely Reply**: *"These measures are temporary/stability-preserving; citizens accept trade-offs."*  
  **Follow-up**: *But if the regime defines "stability" and "threats," doesn’t this justify *unlimited* repression? If citizens can’t contest these definitions, how is this different from saying "authorities may do whatever they deem necessary to succeed"?*

  ### **6. Singapore’s Unique Context**  
  *Q: Singapore’s success relied on inherited British institutions, ethnic homogeneity, and city-state scale. Can performance legitimacy scale to diverse, fractured societies without liberal tools to manage conflict?*  
  **Likely Reply**: *"China proves it scales; local experiments adapt the model."*  
  **Follow-up**: *But China’s "local adaptation" includes violent suppression of regional identities (Tibet, Xinjiang). Doesn’t this expose performance legitimacy as dependent on coercion, not organic buy-in?*

  ### **7. The Liberal Democracy Strawman**  
  *Q: You dismiss liberal democracy as "parochial," but your critique focuses on dysfunctional examples (e.g., Iraq). Shouldn’t performance legitimacy be tested against *competent* liberal democracies (e.g., Denmark)? If they outperform authoritarian states on welfare, safety, *and* liberty, doesn’t that refute the necessity of repression?*  
  **Likely Reply**: *"Western democracies benefited from colonialism/exploitation; East Asian models are self-made."*  
  **Follow-up**: *But Singapore/China also exploited low-wage labor and authoritarian labor controls. If we condemn *all* historical injustices, doesn’t the performance gap narrow—or reverse?*

  ### **8. The Succession Crisis Test**  
  *Q: Performance legitimacy in China/Singapore relies on exceptional founding leaders (Lee, Deng). Given opaque succession, what happens when a less competent leader inherits power? Without liberal mechanisms to remove them, doesn’t this model risk systemic failure?*  
  **Likely Reply**: *"Meritocratic selection ensures capable successors."*  
  **Follow-up**: *But without transparency or public input, how can we know selections are merit-based—not nepotistic? Isn’t this, again, asking us to trust the regime’s *self-reporting*?*

  ### **9. The Revealed Preference Paradox**  
  *Q: When Chinese elites educate children abroad or park wealth in liberal democracies, doesn’t this "revealed preference" undermine claims that citizens genuinely value the system over alternatives?*  
  **Likely Reply**: *"Pragmatic diversification doesn’t negate belief in the home system."*  
  **Follow-up**: *But if the system’s most empowered beneficiaries seek exit options, what does that signal about its *moral* legitimacy—not just its functionality?*

  ### **10. Falsifiability: What Would Break Your Thesis?**  
  *Q: If neither China’s 1989 crackdown nor Singapore’s indefinite detention without trial falsifies performance legitimacy, what *would*? If no crisis can disprove it—only collapse after the fact—is this a theory of legitimacy or a *post-hoc rationalization for regimes that haven’t yet failed*?*  

  ---

  **Why this works**:  
  - Follow-ups trap deflection by forcing engagement with *normative* stakes (e.g., Q1’s shift from "outputs" to rightful authority).  
  - Targets internal contradictions: e.g., Q3’s circularity, Q5’s moral vacuum.  
  - Uses the guest’s cases against him (Q6, Q8, Q9).  
  - Closes with the falsifiability challenge (Q10), exposing the theory’s risk of being unfalsifiable triumphalism.  

  Tailor follow-ups to his actual responses, but this structure ensures every exchange advances the critical thrust.
