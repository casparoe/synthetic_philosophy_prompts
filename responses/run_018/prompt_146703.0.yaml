prompt: |-
  Construct a one-paragraph thought experiment set in a realistic public institution—such as a museum board or a hospital heritage committee—where an agent must choose between preserving an artifact's original physical form and adapting it for community accessibility, with the two values genuinely incommensurable. Engineer the case so that a theorist who holds hard choices are rationally resolvable through the agent's creation of reasons (a parity view) is forced to treat the decision as arbitrary will, while a theorist who holds that incommensurability yields rational indeterminacy is forced to concede there is a uniquely correct option. The reversal must depend on one structural feature—label it "precedent lock-in"—that does all the work; define it explicitly in the scenario. After presenting the case, walk through what each position says about the agent's decision and why, explain precisely why removing precedent lock-in collapses the scenario back into a standard hard-choice stalemate with no forced verdict, and state how a defender of the parity view would attack the construction. Finish by naming the structural feature in the format \answer{precedent lock-in}.
reasoning: |-
  We are constructing a thought experiment set in a public institution. Let's choose a museum board. The artifact in question is a historically significant but fragile tapestry that is part of the museum's permanent collection. The tapestry is currently stored in a climate-controlled vault, inaccessible to the public due to its fragility. The museum board must decide between two options:

  Option A: Preserve the tapestry in its original form, keeping it in the vault and only allowing limited, supervised viewings by appointment (which are rarely taken up due to the difficulty and cost). This maintains the artifact's physical integrity but effectively limits access to a very small group of experts and enthusiasts.

  Option B: Adapt the tapestry for accessibility by creating a high-resolution, full-scale digital replica that can be displayed in the main gallery and made available online. The original would then be retired to the vault and not displayed at all. This would make the artifact widely accessible to the community and school groups, but the original physical form would never be experienced by the public again.

  The values are genuinely incommensurable: preservation of the original physical artifact versus broad community access and education.

  Now, we introduce the structural feature: precedent lock-in. We define it as follows: The museum board has a long-standing policy that once an artifact is adapted for accessibility in this manner (i.e., by creating a replica and retiring the original from public display), the original artifact must never be displayed again. This policy is ironclad and cannot be reversed without causing significant institutional disruption (e.g., it would require a supermajority vote of the board that is virtually impossible to achieve, and it would violate existing donor agreements). Moreover, the museum has a precedent of having done this for one other artifact in the past (a valuable painting that was replaced by a digital display due to its deterioration). The precedent has been accepted and is now part of the institution's identity. Thus, if they choose Option B, they are locked into never displaying the original tapestry again. If they choose Option A, they leave open the possibility of future technological advances that might allow safe display of the original without adaptation (though currently that possibility is speculative).

  We now present the case:

  **The Case:** The museum board faces a decision about a historically significant but fragile tapestry. Option A preserves the original physical form but limits access to a privileged few. Option B creates a digital replica for broad community access but, due to a long-standing institutional policy (precedent lock-in), permanently retires the original from any public display. The precedent lock-in is established by a prior decision for another artifact and is binding for all future similar decisions. The board must choose one.

  **Walkthrough for each position:**

  1. **Theorist who believes hard choices are resolvable by creating reasons (parity view):** 
     - This theorist holds that the agent can create reasons that make one option better than the other. However, in this scenario, the precedent lock-in creates a situation where choosing Option B not only adapts the current artifact but also reinforces the institutional path of replacing originals with replicas. Because the precedent lock-in is so strong, the agent cannot create a reason that tips the balance without being arbitrary. Why? Because the lock-in makes the consequences of Option B irreversible and absolute, and the agent cannot appeal to any existing institutional values that would break the symmetry. The institution's prior commitment (the precedent) makes Option B a step in a direction that the agent might not want to take if they could freely choose, but they are bound by the precedent. Thus, the agent must arbitrarily choose between two paths: one that locks the institution into a pattern of replication and one that does not. The parity theorist must concede that the decision is arbitrary because the agent cannot create a reason that is not already predetermined by the precedent (which is equally applicable to both options in terms of the current artifact but has a binding effect on the future). Hence, they are forced to treat the decision as arbitrary will.

  2. **Theorist who believes incommensurability yields rational indeterminacy:**
     - This theorist typically holds that when values are incommensurable, there is no unique rational choice. However, the precedent lock-in changes the situation. Because the museum has already set a precedent with the painting, and because the policy is binding, choosing Option B for the tapestry would be consistent with the existing institutional path. On the other hand, choosing Option A would break the pattern and create an inconsistency: the painting was adapted and retired, but the tapestry would be preserved in a way that leaves open the possibility of future display. The institutional precedent and policy create a unique reason to choose Option B: consistency with the established institutional practice. This reason is not about the intrinsic value of the tapestry but about the institution's coherence and the avoidance of arbitrary deviations from established policy. Therefore, the theorist must concede that there is a uniquely correct option: Option B, to maintain institutional consistency.

  **Removing precedent lock-in:**
  If we remove the precedent lock-in (i.e., there is no binding policy and no prior precedent, or the prior decision does not lock in future choices), then the decision becomes a standard hard choice. The board is free to choose either option without any institutional constraint. The values of preservation and accessibility remain incommensurable. The parity theorist would then say the agent can create reasons to choose either option (e.g., by emphasizing one value over the other). The indeterminacy theorist would say there is no unique rational choice. Thus, without precedent lock-in, we have a stalemate.

  **Attack from the parity view defender:**
  A defender of the parity view might attack the construction by arguing that the precedent lock-in does not actually remove the possibility of creating reasons. They might say that the agent can create a reason to break the precedent. For example, they might argue that the tapestry is uniquely important and thus warrants a different treatment, thereby creating a reason to choose Option A even in the face of the precedent. Alternatively, they might create a reason to adhere to the precedent by emphasizing institutional consistency. The parity view would then hold that the agent can create a reason that tips the balance, so the choice is not arbitrary. The attack would challenge the claim that the precedent lock-in forces the parity view to concede arbitrariness.

  **Final answer:**
  We name the structural feature: precedent lock-in.

  \answer{precedent lock-in}
answer: |-
  ### Thought Experiment: The Metropolitan Museum Tapestry Dilemma  
  The Metropolitan Museum's Board of Trustees faces a decision regarding a 15th-century Flemish tapestry, a fragile masterpiece currently stored in a light- and humidity-controlled vault due to its deterioration. Public access is restricted to biannual expert-led viewings, limiting engagement to a tiny elite. The board must choose between:  
  - **Option A**: Preserve the original in perpetuity with no public display, maintaining its physical integrity but excluding the community.  
  - **Option B**: Commission an immersive, high-fidelity digital replica for permanent gallery display and online access, retiring the original to the vault forever under the museum's "Legacy Protocol."  

  This protocol embodies **precedent lock-in**: a binding institutional rule established 20 years prior when the museum adapted a similar artifact (a Byzantine mosaic). The rule states: *"Once an artifact is adapted for accessibility via replication, its original form must never be displayed again, and this policy becomes a mandatory precedent for all future adaptations. Reversing it would require a 90% board supermajority and violate legally binding donor agreements, triggering severe financial and reputational penalties."* The values—preservation of material authenticity versus democratic access—are incommensurable, as each serves a distinct, irreducible good.  

  ### Analysis of the Two Theoretical Positions  
  1. **Parity View Theorist (hard choices resolvable by creating reasons)**:  
     This theorist argues the agent can rationally resolve incommensurability by "creating" new reasons (e.g., prioritizing education over conservation). However, precedent lock-in nullifies this: the Legacy Protocol rigidly predetermines that choosing Option B irreversibly commits the institution to a path where *all* future adaptations must follow suit, while Option A leaves the original displayable if technology advances. The agent cannot "create" novel reasons without defying the protocol’s constraints, as any justification (e.g., "accessibility is paramount") is already counterbalanced by the protocol’s entrenchment of the original mosaic precedent. Thus, the decision reduces to arbitrary will—flipping a coin—because the lock-in paralyzes reason-creation by making both options equally binding or unyielding.  

  2. **Indeterminacy Theorist (incommensurability implies no uniquely correct choice)**:  
     This theorist typically holds that no rational choice exists between incommensurable options. Yet precedent lock-in forces a concession: Option B is uniquely correct. Deviating from the Legacy Protocol (by choosing Option A) would create institutional inconsistency—preserving the tapestry differently than the mosaic without justification—undermining the museum’s governance credibility and inviting legal challenges from donors. Conversely, Option B honors the precedent, ensuring operational coherence. The indeterminacy theorist must accept this as a decisive, extrinsic reason overriding intrinsic incommensurability, rendering Option B rationally obligatory.  

  ### Collapse Without Precedent Lock-In  
  If precedent lock-in is removed (no Legacy Protocol exists, and the mosaic adaptation was a one-off with no binding future commitment), the scenario reverts to a standard stalemate:  
  - **Parity view**: The agent can freely "create" reasons (e.g., "This tapestry’s symbolism favors preservation") to tip the balance either way.  
  - **Indeterminacy view**: No unique rational choice exists, as the core values remain incomparable without the protocol’s coercive structure.  
  The lock-in alone creates asymmetry: it imposes a "cost of inconsistency" for Option A and a "reward of coherence" for Option B, which the indeterminacy theorist cannot ignore but the parity theorist cannot navigate via reason-creation.  

  ### Parity View Defender’s Attack  
  A parity defender would attack the construction by arguing that precedent lock-in *does not* stifle reason-creation. The agent could "create" a reason to *break* the precedent (e.g., "This tapestry’s uniqueness justifies a new institutional value: context-sensitive exceptions"), transforming Option A into a superior choice through deliberate commitment. Alternatively, they might "create" a reason to *reinforce* the precedent (e.g., "Uniformity ensures equitable access for all artifacts"), favoring Option B. Thus, the lock-in merely provides raw material for reason-creation; the choice remains rationally resolvable, not arbitrary. The attack concludes that the scenario artificially constrains the agent’s normative ingenuity.  

  \answer{precedent lock-in}
