prompt: |-
  I just finished a long argument with a friend about whether art-status is conferred by an institution or by properties intrinsic to the object, and we kept returning to a scenario neither standard example resolves. I call it the reverse-readymade: a work that has been displayed as canonical art for decades is formally revoked by the same institution that originally conferred its status, not because the physical object changed, but because the board decides the artist's later conduct disqualifies the work from the canon. The friend insisted the object is still art; I wasn't sure. Now I want my students to feel that instability rather than just discuss it. I run an upper-level aesthetics seminar—twelve students, ninety minutes, all philosophy majors familiar with institutional theories but not with this reversal case. Design a structured in-class simulation in which participants collectively write the rules for art-status conferral before they see the revocation scenario, then must apply their rules to vote on whether the object retains art-status. The rules, roles, and voting mechanism should be arranged so that the group runs into a coordination failure or circular dependency—perhaps between curatorial authority and public aesthetic judgment—before anyone names the institutional circularity problem. Include specific roles (e.g., board curators, estate representatives, independent critics, public voters), a payoff or point scheme that requires no real money, materials needed, a minute-by-minute timeline, and a debrief that maps each crisis point in the activity onto a corresponding part of Dickie's or Danto's institutional framework and onto rival intrinsic-property accounts. Be explicit about what will predictably go wrong the first time—say, the group collapses to a simple majority vote too quickly—and how to prevent it. Also be frank about which feature of the actual philosophical debate, such as the historical-intentional constraint on artistic identity, the simulation cannot reproduce and must be supplied by me in the debrief. The students should leave having experienced the pull of both the institutional and the anti-institutional intuition, not just having heard them named.
reasoning: |-
  We are designing a 90-minute in-class simulation for an upper-level aesthetics seminar. The goal is to have students experience the instability in art-status conferral when faced with a "reverse-readymade" scenario. The simulation will have two main parts: 
  1. Collective rule-making for art-status conferral.
  2. Applying those rules to vote on a revocation scenario.

  We want the simulation to lead to a coordination failure or circular dependency (e.g., between curatorial authority and public aesthetic judgment) without explicitly naming the institutional circularity problem until the debrief.

  Key elements:
  - Roles: board curators, estate representatives, independent critics, public voters.
  - A point or payoff system without real money.
  - Materials needed.
  - Minute-by-minute timeline.
  - Debrief mapping crisis points to Dickie's/Danto's theories and intrinsic-property accounts.

  Predictable problem: The group might collapse to a simple majority vote too quickly. We must design the rules and voting mechanism to prevent this by creating dependencies between roles.

  Structure:

  Part 1: Rule-Making (30 minutes)
  - Students are assigned roles and form groups by role. Each role has a specific interest.
  - They draft rules for how art-status is conferred and revoked. The rules must include at least two criteria: one institutional (e.g., curatorial decision) and one non-institutional (e.g., public aesthetic judgment).

  Part 2: Scenario and Voting (40 minutes)
  - Introduce the revocation scenario: a canonical artwork is revoked due to the artist's later conduct (the object hasn't changed).
  - Students apply their rules to vote on whether the object retains art-status. But the voting mechanism is designed so that the rules they created lead to a conflict (e.g., the curators say revoke, but the public says it's still art, and the rules require both to agree).

  Part 3: Debrief (20 minutes)
  - Map the crisis points to philosophical theories.
  - Discuss what the simulation could not capture (e.g., historical-intentional constraint on artistic identity).

  Roles (12 students):
  - Board Curators (3 students): Represent the institution. They have the power to confer and revoke art-status but must consider the institution's reputation and historical canon.
  - Estate Representatives (2 students): Represent the artist's estate. They have a financial and legacy interest in maintaining the work's status.
  - Independent Critics (3 students): Represent critical discourse. They base their judgment on aesthetic properties and critical theory.
  - Public Voters (4 students): Represent the public. They base their judgment on popular aesthetic appreciation and cultural impact.

  Payoff System (Points):
  - Each role has specific objectives that earn them points. The points are symbolic and used to incentivize role-playing.
    - Curators: Gain 2 points if their decision (confer/revoke) is the final outcome, but lose 1 point if the institution is criticized in the press (simulated by the critics or public).
    - Estate Reps: Gain 3 points if the artwork retains art-status, lose 2 points if revoked.
    - Critics: Gain 1 point for each argument they make that is cited in the final decision (recorded by the instructor), and lose 1 point if they agree with the majority without a unique argument.
    - Public Voters: Each gains 1 point if the final decision matches the majority public vote, and lose 1 point if it doesn't.

  Materials:
  - Role cards with objectives and point schemes.
  - Rule-making worksheet.
  - Scenario description (after rule-making).
  - Voting ballots (if needed) or a voting board.
  - Timer.

  Timeline:

  0-5 min: Introduction and role assignment. Assign roles randomly. Explain the activity: first, create rules for art-status conferral and revocation; then, apply to a scenario. Explain the point system.

  5-25 min: Rule-Making Phase (20 min)
  - Students break into role groups (curators together, estate reps together, etc.) to draft rules. They must propose at least two criteria for conferral/revocation: one institutional and one non-institutional. They must also specify a procedure for revocation (e.g., who initiates, who votes, what majority is needed).

  25-30 min: Consolidating Rules (5 min)
  - One representative from each role group presents their proposed rules. The instructor writes them on the board. Then the whole class must agree on a single set of rules by majority vote. The rules must include both types of criteria and a revocation procedure.

  30-35 min: Introduce the Scenario (5 min)
  - Present the reverse-readymade scenario: "The artwork 'X' by artist Y was conferred art-status by the Museum of Modern Art in 1960 and has been displayed as a masterpiece. In 2024, the board of the museum revokes its art-status because the artist, Y, was discovered to have engaged in horrific conduct (e.g., war crimes) in the 1990s. The physical object is unchanged. Does the object retain art-status?"

  35-65 min: Voting and Deliberation (30 min)
  - Students return to their role groups to deliberate and decide their position (retain or revoke) based on the rules they created. Then, the groups reconvene for a structured vote according to the rules. The rules should require more than a simple majority (e.g., both the curators and the public must agree, or a supermajority). The instructor facilitates the vote.

  65-75 min: Crisis and Chaos (10 min)
  - The voting process will likely hit a snag because of the rules. For example, if the rules require both curators and public to agree, but they don't, then there is a deadlock. The instructor lets the groups try to resolve it (e.g., re-vote, change rules on the fly) but notes the chaos.

  75-90 min: Debrief (15 min)
  - Discuss what happened and map to theory:
    - Crisis Point 1: Rule-making phase - How did they define the criteria? Did they separate intrinsic and institutional? (Map to Dickie: art-status is conferred by the artworld; Danto: the artworld provides an atmosphere of theory.)
    - Crisis Point 2: Voting deadlock - Show circularity: the institution (curators) is both the rule-maker and a voter? (Dickie's circularity problem: the artworld is defined by its conferral of status, but who is in the artworld?)
    - Intrinsic property accounts: The object hasn't changed, so why revoke? (Anti-institutional intuition.)
  - What the simulation missed: The historical-intentional constraint (the artwork's identity is tied to the artist's intention and historical context). The revocation based on later conduct might not affect the original intention, but the simulation focused on the institution's reaction.

  Preventing Collapse to Simple Majority:
  - In the rule-making, require that the revocation procedure must involve multiple criteria and not just a majority vote (e.g., must have both institutional and public approval). This is built into the rule-making instructions.

  Predictable Problems and Solutions:
  - Problem: Groups might create rules that are too simple (e.g., majority vote). 
    Solution: Instruct them that the rules must include at least two criteria (one institutional, one non-institutional) and a multi-step process.
  - Problem: During voting, if the rules are ambiguous, confusion may arise. 
    Solution: Have the instructor serve as a referee to interpret the rules as written, but strictly.

  Debrief Mapping:
  - Rule-making: This phase represents the institutional framework setup (Dickie's artworld as a system of conferring status). The criteria they choose reflect the tension between institutional and intrinsic properties.
  - Voting deadlock: Represents the circularity in institutional theories — the rules they set up depend on the very authorities they are trying to define. Also, the public's role challenges the institution (like anti-institutional theories).
  - The revocation scenario: The unchanged object highlights the intrinsic property argument (the object's properties haven't changed, so why change its status?).

  What the simulation cannot capture: 
  - The historical-intentional constraint: The artwork's identity is tied to the artist's intention at the time of creation. The artist's later conduct is irrelevant to the work's intrinsic properties and original intention. The instructor must explain this in the debrief.

  This design should make students feel the instability and experience both the institutional pull (the board's authority) and the anti-institutional intuition (the object hasn't changed, so it's still art).
answer: |-
  ### Structured Simulation: "The Art-Status Tribunal"  
  **Objective:** Students experience the tension between institutional authority and intrinsic properties in art-status revocation, leading to a predictable coordination failure that mirrors institutional circularity.  

  ---

  #### **Materials Needed**  
  - Role cards (12 cards: 3x Curators, 2x Estate Reps, 3x Critics, 4x Public Voters)  
  - Rule-making worksheet (1 per group)  
  - Voting tokens (green = retain art-status, red = revoke; 2 per voter)  
  - Whiteboard for rule-drafting and voting tally  
  - Timer  
  - Scenario handout (distributed *after* rule-making)  

  ---

  #### **Timeline (90 Minutes Total)**  
  **Phase 1: Rule-Making (35 Minutes)**  
  - **0–5 min:** Assign roles randomly. Divide into four *role-based groups*: Curators, Estate Reps, Critics, Public Voters. Explain:  
    > "Your group will draft rules for conferring/revoking art-status. Rules must include:  
    > 1. **One institutional criterion** (e.g., museum approval, historical significance).  
    > 2. **One intrinsic/non-institutional criterion** (e.g., public aesthetic appeal, technical skill).  
    > 3. **A revocation procedure** (who initiates, who votes, majority threshold)."  
    Assign point values:  
    - **Curators**: Gain 1 pt if the institution’s authority is central to the rules.  
    - **Estate Reps**: Gain 1 pt if rules protect legacy (e.g., requiring artist consent).  
    - **Critics**: Gain 1 pt if rules prioritize aesthetic analysis.  
    - **Public Voters**: Gain 1 pt if public opinion is a formal criterion.  

  - **5–20 min:** *Group Drafting*. Groups draft rules separately. **Instructor circulates to ensure criteria diversity** (e.g., stop groups from defaulting to simple majority).  

  - **20–35 min:** *Rule Consolidation*. Each group proposes rules. Class debates and combines them into one set via moderated discussion. **Predictable problem:** Groups may create vague or contradictory rules (e.g., "Art-status requires curator approval AND public admiration"). Let this unfold—it sets up later failure. Finalize rules on whiteboard.  

  **Phase 2: Revocation Scenario & Voting (40 Minutes)**  
  - **35–40 min:** Introduce scenario via handout:  
    > "**The Reverse-Readymade**: Masterpiece *Untitled #5* (1960) by artist Zara Moss is revoked by the museum that canonized it. Reason: Moss committed war crimes in 1990. The physical object is unchanged. Does *Untitled #5* retain art-status?"  

  - **40–50 min:** *Role Deliberation*. Groups reconvene. Use rules to argue their stance:  
    - **Curators**: Push revocation (protect institutional integrity).  
    - **Estate Reps**: Defend art-status (legacy = revenue).  
    - **Critics**: Split—some focus on object’s properties (retain), others on moral context (revoke).  
    - **Public Voters**: Poll each other; likely majority retains (object’s beauty unchanged).  

  - **50–65 min:** *Structured Voting*. Use the class’s revocation procedure. **Crucial twist:** Design the voting to require *sequential dependencies*:  
    - **Step 1**: Critics submit written statements applying intrinsic criteria (aesthetic properties).  
    - **Step 2**: Curators vote incorporating Critics’ input.  
    - **Step 3**: Public Voters react to Curators’ vote.  
    - **Step 4**: Estate Reps mediate if deadlock occurs.  
    **Predictable crisis:** Rules will clash (e.g., Critics declare "intrinsic properties unchanged!" but Curators override). **Prevent collapse to majority vote:** Require supermajority (e.g., 9/12 votes) for revocation if rules allow it.  

  - **65–75 min:** **Coordination Failure Emerges**. Example:  
    - Critics and Public agree: "Object unchanged → RETAIN."  
    - Curators: "Institution revoked → REVOKE."  
    - Estate Reps deadlock.  
    **Result:** Rules demand both institutional and intrinsic criteria, but they conflict. Voting stalls.  

  **Phase 3: Debrief (15 Minutes)**  
  - **75–85 min:** Map crises to theory:  
    - **Deadlock** → Dickie’s circularity: "Art-status is conferred by the artworld, but the artworld is defined by those who confer status." The Curators (institution) and Critics (artworld agents) are mutually dependent.  
    - **Public Voters’ dissent** → Anti-institutional intuition: "The object’s aesthetic properties (color, form) haven’t changed!" Mirrors Beardsley’s intrinsic formalism.  
    - **Critics’ split** → Danto’s "atmosphere of theory": Critics embody artworld narratives that *contextualize* the object, but revocation pits historical context against present morality.  

  - **85–90 min:** **Limitations & Takeaways**:  
    - **What the simulation missed**: The *historical-intentional constraint* (e.g., artist’s intent at creation). Explain: "In reality, revocation debates hinge on whether the artwork’s identity includes the artist’s biography. Our simulation treated the object as static, but philosophical disputes (e.g., Danto) ask if ‘artwork identity’ evolves post-creation."  
    - **Goal achieved**: Students felt institutional authority (Curators’ power) vs. intrinsic pull (Public/Critics’ appeals to the object). They hit circularity without naming it.  

  ---

  #### **Why This Works**  
  - **Predictable Snags**:  
    - Groups draft ambiguous rules → Ensures voting chaos.  
    - Estate Reps/Critics lack clear power → Forces reliance on Curators, exposing institutional dominance.  
  - **Prevention Tactics**:  
    - If rule-making veers toward majority vote, remind groups: "How would you handle a split between experts and the public?"  
    - During voting, enforce dependencies strictly (e.g., "Curators cannot vote until Critics submit reports").  
  - **Outcome**: Students leave conflicted—sympathizing with Public’s intrinsic view but seeing institutional power’s inevitability. The "reverse-readymade" becomes lived confusion, not abstraction.  

  > "You don’t *solve* the dilemma—you *feel* why it endures."
