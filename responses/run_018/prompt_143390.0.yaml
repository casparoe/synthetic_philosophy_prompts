  hey im defendng a talk at a poli-sci seminar next tuesday. audience is mostly deliberative-democracy people — think habermas-style normative legitimacy crowd — plus one classicist who thinks using athens in modern theory is always anachronistic. my thesis: the mytilene reversal, the sicily disaster, and socrates trial are usually read as democracy being too emotional, but actually they share "synchronic overload" — the assembly had to deliberate and bind-decide in the same sitting, so reflection got collapsed into impulse. i propose a "two-beat assembly" model (same direct-democracy body meets twice with a mandatory 48-hour gap, no representatives) as a structural fix. can you draft my q&a prep? i need about eight objections ordered by damage, phrased the way thier vocabulary actually sounds — legitimacy, anachronism, feasibility, etc. for each give me a ~2 min reply and a note on where the reply is softest. include the one question im prayng nobody asks. quick sketch of my argument: thucydides on mytilene shows the reversal came from fatigue and rhetorical momentum, not fresh reasoning; thucydides on sicily shows the assembly overrode its own generals because there was no institutional cooling-off; and socrates was scapegoated after arginusae, accelerated by that same compressed timeline. the classicist will probably claim im projecting modern institutional design onto fifth-century practice.
