  Please structure your response in the following sections, with approximate lengths. First, "The framing image" (about 150 words): open with a concrete image that works for both audiences and introduces the Ulysses-contract analogy without jargon. Second, "The structural argument" (about 300 words): lay out your chosen position, using the second-order problem as the central engine, and address at least one serious objection from the opposing view rather than ignoring it. Third, "The closing move" (about 150 words): bring the argument back to the workshop's practical stakes—what this means for how we talk about amending or protecting constitutional provisions—without retreating to neutrality or summarizing both sides. Keep the language accessible to the non-specialists in the room, but do not dilute the philosophical claim: the analogy should do real structural work, not ornamentation. After the speech, include one titled section, "Notes on liberties and contested readings" (about 100 words), explaining where your argument leans on a contested interpretation of collective agency or democratic legitimacy and where it takes creative license with the analogy.
