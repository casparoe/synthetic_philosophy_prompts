answer: |-
  Here's a disambiguation of "absence of evidence is not evidence of absence" tailored to your archaeological context, with explicit verdicts on each interpretation's validity and relevance to blocking the inference about centralized redistribution:

  ### Core Interpretations & Verdicts
  1.  **Logical Non-Entailment (Formal Deduction)**
      *   **Thesis:** The logical proposition "We have not found standardized weights" **does not deductively entail** the proposition "No standardized weights existed." There are other possible explanations for non-discovery (e.g., not yet found, destroyed, not looked for).
      *   **Verdict:** **Trivially True.** Deductive logic alone cannot prove non-existence from non-observation.
      *   **Relevance to Inference:** **Irrelevant to Blocking *Abduction*.** Abduction (inference to the best explanation) doesn't claim deductive proof; it weighs probabilities. This reading doesn't engage with the *evidential weight* of the absence within the specific context. It's a straw-man objection against a claim you aren't making.

  2.  **Probabilistic Underdetermination (Epistemic Context)**
      *   **Thesis:** Given known limitations (sampling bias, preservation taphonomy, excavation coverage, recognition problems), the failure to find evidence *in this specific dataset* does not significantly increase the probability of absence. The absence is adequately explained by the limitations themselves.
      *   **Verdict:** **Defensible (Context-Dependent).** This is often the *intended* valid core of the slogan in archaeology. Its strength depends entirely on the severity of the limitations.
      *   **Relevance to Inference:** **Potentially Valid for Blocking *This Specific* Inference.** If the colleague convincingly argues that:
          *   Preservation of small lithics/ceramics is exceptionally poor at these sites.
          *   Excavated areas represent non-administrative zones.
          *   Recognizable weight forms are unknown or ambiguous for this period/region.
          *   Sampling is statistically insufficient.
          ...then the absence *is* weak evidence, supporting methodological caution. **Supports protecting decentralized models only if preservation/sampling biases are severe and demonstrable.**

  3.  **Methodological Conservatism / Burden of Proof**
      *   **Thesis:** The default position should be agnosticism. The *burden of proof* lies on those claiming the *presence* of a complex institution (centralized redistribution). Absence of direct evidence (weights) means the positive claim hasn't met its burden. We cannot affirm absence without positive evidence *for* absence (an impossible demand?).
      *   **Verdict:** **Defensible but Often Misapplied & Problematic.** Common in "falsificationist" approaches, but can lead to paralysis. Defining the "burden" and what constitutes sufficient negative evidence is crucial.
      *   **Relevance to Inference:** **Used to Block Inference, but Questionable.**
          *   **If applied rigidly:** Asserts you cannot conclude "absent" without proving a universal negative. Protects decentralized models by default. However, this stalls inference completely and ignores the *positive evidence for alternatives* (heterogeneous distribution) and the *predictive failure* of the centralized model.
          *   **Collapse Risk:** Becomes a platitude if "evidence" isn't contextualized. In stratigraphy, *expected* evidence failing to appear *where predicted with good recovery* *does* shift the burden. If the centralized model predicts weights in central storage areas, and well-excavated, well-preserved storage areas yield none, the absence *is* significant evidence *against that model*, shifting the burden to its proponents to explain the failure.

  4.  **Ontological Invisibility**
      *   **Thesis:** Certain institutions (like specific forms of centralized redistribution) might not *necessarily* leave behind specific, recognizable material signatures like standardized weights. Authority could be exercised through other means (ideology, kinship, perishable records, non-standardized measures).
      *   **Verdict:** **Defensible in Principle, Often Weak in Practice for *This* Case.**
      *   **Relevance to Inference:** **Weakens the Inference, Doesn't Block It.**
          *   **Defense:** True that not all centralization requires weights. Maybe grain was measured in baskets, labor in time, etc.
          *   **Problem:** Standardized weights are a *highly probable* correlate of complex, large-scale, impersonal redistribution systems requiring accountability and fairness across time/space. Their absence, especially alongside heterogeneous distribution patterns, *is* evidence *against* a system heavily reliant on such standardization. While not definitive proof of absence, it strongly favors *less centralized* or *differently organized* models. This thesis doesn't make the absence irrelevant; it just means the inference needs to specify "*this form* of centralized redistribution" (weight-dependent).

  5.  **Platitude of Uncertainty (The Trivial Collapse)**
      *   **Thesis:** We can never be *absolutely certain* something didn't exist based on non-discovery. Future finds might always change the picture.
      *   **Verdict:** **Trivial Platitude.** True of all empirical knowledge but operationally useless.
      *   **Relevance to Inference:** **Irrelevant.** All archaeological inference operates under uncertainty. Abduction seeks the *best current explanation*, not absolute certainty. This version blocks *all* negative inferences, rendering interpretation impossible.

  ### Which Version Protects the Decentralized-Exchange Model?
  *   **Primarily #2 (Probabilistic Underdetermination):** If strong, demonstrable arguments exist for poor preservation of weight-sized lithics/ceramics, severe sampling bias away from administrative contexts, or unresolved recognition problems, then the absence carries little weight. The heterogeneous distribution can then be more readily interpreted as evidence *for* decentralized exchange without being countered by the "missing" weights.
  *   **Secondarily #3 (Methodological Conservatism):** If the burden of proof is placed entirely on proving centralized redistribution exists, and the absence of weights is seen as failing that burden, then decentralized models persist by default. However, this is methodologically weaker unless the decentralized model has *positive* evidence (like the heterogeneous distribution pattern itself).

  ### Which Versions Collapse into Platitudes?
  *   **#1 (Logical Non-Entailment)** collapses when discussing abductive inference (which is probabilistic, not deductive).
  *   **#5 (Platitude of Uncertainty)** is always a platitude.
  *   **#3 (Burden of Proof)** collapses into a paralyzing platitude if the concept of "evidence for absence" (like the consistent failure to find predicted evidence under good conditions) is ignored or deemed impossible.
  *   **#2 (Probabilistic Underdetermination)** collapses if the specific context shows excellent preservation, extensive sampling of relevant contexts, and clear criteria for recognizing weights. In such a context, absence *is* strong evidence of absence. "Evidence" here means *recoverable material traces under known conditions*.

  ### Your Best Response Strategy
  Focus on **#2 (Probabilistic Underdetermination)** and **#4 (Ontological Invisibility)**, as these are the colleague's most defensible points, but **demand specificity**:

  1.  **Challenge the Underdetermination:** "You argue the absence isn't evidence due to bias/preservation. *Specifically*, what is the evidence for (a) the poor preservation potential of small, durable lithic/ceramic weights *at these sites*, (b) the systematic undersampling of contexts where weights *should* appear (e.g., central storage, elite quarters, workshops), or (c) the ambiguity in identifying weight forms for this period/culture? Absent these specifics, the absence remains evidentially significant."
  2.  **Concede & Refine on Ontology:** "While centralized authority *could* theoretically exist without weights, standardized weights are a highly reliable indicator of systems requiring impersonal accounting for large-scale redistribution. Their absence, combined with the observed heterogeneous distribution patterns, is strong evidence *against* a redistribution system *dependent on such standardization*. It favors models where exchange was less formalized, more decentralized, or relied on non-material or perishable measures."
  3.  **Reframe the Inference:** "Our inference isn't 'centralization is absolutely impossible,' but rather 'the *best explanation* for the *total assemblage* (including the patterned absence of predicted evidence alongside the heterogeneous distribution) is a system *not centered on standardized weight-based redistribution*.' The absence of weights is a key *part* of that evidential pattern supporting a decentralized model."
  4.  **Shift Focus to Positive Evidence:** "Furthermore, the heterogeneous distribution itself provides positive evidence *for* decentralized mechanisms (e.g., household production, local markets, gift exchange) which better explain the variability than a model predicting homogenization via central control."

  By forcing engagement with the *specific conditions of evidence recovery* and the *specific predictions* of the centralized model, you move the discussion beyond the slogan's rhetorical shield and into the realm of substantive archaeological argument.
