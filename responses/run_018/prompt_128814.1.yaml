  Ah, and the methodological version - that's where things get tactical. If the colleague is demanding impossible proof standards, that's moving the goalposts. But if they're rightly pointing out taphonomic filters, that's valid. 

  The ontological claim feels weakest here. Institutions leave fingerprints - standardization leaves physical traces by definition. To say centralized redistribution is inherently invisible seems self-contradictory. 

