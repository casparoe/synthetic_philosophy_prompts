  The verdicts need teeth. Platitudes are useless in academic combat. I'll call out when the slogan becomes meaningless upon inspection - like when "evidence" is properly defined contextually. 

  Most importantly, the user needs to know when this slogan legitimately blocks their inference (rarely) versus when it's misapplied (probably often). The centralized redistributive authority hypothesis makes testable predictions - no supporting artifacts should lower its probability unless preservation explains it away. 

