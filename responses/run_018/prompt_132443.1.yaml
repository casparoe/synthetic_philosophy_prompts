answer: |-
  ### Step-by-Step Preparation  
  **Central Scenes:**  
  1. **Duncan’s Murder (Act 2, Scenes 1–2)** – Initial “dirty act.”  
  2. **Banquet Scene with Banquo’s Ghost (Act 3, Scene 4)** – Moral remainder erupting.  
  3. **Lady Macbeth’s Sleepwalking (Act 5, Scene 1)** – Psychological collapse from suppressed guilt.  
  4. **Macbeth’s “Tomorrow” Soliloquy (Act 5, Scene 5)** – Nihilistic endpoint of corrupted ends.  

  **Philosophical Distinctions:**  
  - **Instrumental Dirty Act**: A calculated wrong for a stable, defensible end (e.g., killing a tyrant to restore order).  
  - **Corruptive Escalation**: Initial crime distorts the agent’s ends, making further atrocities self-perpetuating.  
  - **Moral Remainder**: Guilt as a necessary residue; its suppression risks moral collapse.  

  **Resistance Points**:  
  - Macbeth’s motives are arguably *never* truly political (focused on public good), complicating the “dirty hands” frame.  
  - The play may critique the very idea of “political necessity” in usurpation, suggesting Macbeth’s actions are pathological ambition disguised as statecraft.  

  ---

  ### Analysis  
  #### **1. Duncan’s Murder: Instrumental Act or Fatal Corruption?**  
  - **Surface Instrumentality**: Macbeth frames killing Duncan as a means to secure his prophesied throne ("If it were done when ’tis done..."). He imagines it as a discrete act for a stable end.  
  - **Corruptive Reality**: The act immediately unravels. His hallucination of a dagger and post-murder dissociation ("Macbeth hath murdered sleep") show the moral remainder asserting itself. *Lady Macbeth’s suppression tactic* ("A little water clears us of this deed") denies this residue, accelerating corruption.  
  - **Philosophical Tension**: A genuine "dirty hands" scenario requires a defensible public end (e.g., preventing civil war). Duncan’s benevolent rule negates this—Macbeth’s act serves *private ambition*, not public good. The framework strains here.  

  #### **2. Banquet Scene & Escalation: The Return of the Remainder**  
  - **Banquo’s Ghost**: The apparition embodies Macbeth’s unprocessed guilt. His public meltdown ("Thou canst not say I did it!") reveals the moral remainder’s inevitability. Suppression fails; guilt transforms into paranoia.  
  - **Escalation Logic**: Killing Banquo (a friend) is not instrumental but *defensive*—a cover-up that distorts ends. Macbeth moves from seizing power to maintaining it through terror, abandoning any pretense of legitimacy. The throne is no longer a "stable end" but a catalyst for tyranny.  

  #### **3. Sleepwalking Scene & “Tomorrow”: Collapse of Agency**  
  - **Lady Macbeth’s Breakdown**: Her compulsive hand-washing ("Out, damned spot!") dramatizes the return of the suppressed remainder. Denial leads to psychosis—the "moral stain" becomes literal.  
  - **Macbeth’s Nihilism**: In "Tomorrow," power is stripped of meaning. His earlier ends ("glamis," "cawdor," "king") are hollowed out. The speech reveals a man *whose initial political ends were always illusory*—corrupted from the start.  

  ---

  ### Where the Framework Illuminates vs. Where the Play Resists  
  **Illuminations**:  
  - The play vividly dramatizes Walzer’s "moral remainder." Guilt isn’t erased by "success"; it demands acknowledgment.  
  - Macbeth’s trajectory mirrors corruptive escalation: each murder *changes* his ends (from kingship to survival to desolation).  
  - Lady Macbeth’s arc shows suppressing the remainder destroys the self. Her breakdown is the price of denial.  

  **Resistances**:  
  - **Premise Flaw**: Macbeth’s crimes lack a genuine "public good" justification. He is a usurper, not a reluctant savior. Applying "dirty hands" to him risks legitimizing pathologies as political dilemmas.  
  - **Ambition vs. Statecraft**: The play suggests Macbeth was *never* truly political. His "dirty hands" are symptoms of private corruption, not tragic statecraft. The witches’ prophecy frames his rise as supernatural fatalism, not ethical calculation.  
  - **Moral Remainder as Inevitable?**: Yes—but in Macbeth, it manifests as self-destruction, not conscientious burden. This is guilt without redemption, complicating Walzer’s concept of the "tragic hero" who bears the stain for society’s sake.  

  ---

  ### What the Play Adds to the Dirty-Hands Debate  
  1. **The Corruption of Ends as Inevitable in Denial**: Abstract debates often assume agents can compartmentalize "wrong means" from "right ends." *Macbeth* shows that suppressing guilt actively corrodes the ends themselves. Power gained through unconfronted evil becomes meaningless.  
  2. **Pathology Masquerading as Necessity**: The play exposes how easily "dirty hands" rhetoric can cloak narcissism. Macbeth’s soliloquies reveal self-deception—his appeal to "destiny" is ambition rationalized. This cautions against accepting political agents’ self-justifications at face value.  
  3. **The Body as Archive of Guilt**: Lady Macbeth’s somatic unraveling ("All the perfumes of Arabia...") underscores that moral remainders aren’t abstract. They manifest physically when denied—a dimension philosophy often overlooks.  
  4. **Nihilism as Endpoint**: Where theorists debate whether dirty-handed agents can retain moral integrity, *Macbeth* shows the logical terminus: total existential collapse when the remainder is refused. "Life’s but a walking shadow" is the anthem of hands dirtied without purpose.  

  **Conclusion**: *Macbeth* is less a study of dirty hands than a *cautionary tale* about its misapplication. It reveals that the framework’s validity hinges on the *genuineness* of the public end and the agent’s willingness to *bear* guilt. Macbeth fails both tests—his hands aren’t dirty by political necessity, but by choice, and his refusal of the moral remainder destroys him. The play thus adds a psychological and existential dimension: unconfronted guilt doesn’t just linger; it consumes.
