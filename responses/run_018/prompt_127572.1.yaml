answer: |-
  **Core desiderata for stakes-sensitive knowledge theories must resolve classic cases, preserve key distinctions, accommodate psychology, and handle retroactive stakes, with key tensions around invariance and retroactivity.**  

  ### Non-Negotiable Desiderata  
  1.  **Classic Cases Correct:**  
      - *Low-stakes bank (Friday):* S knows the bank is open Saturday when error costs are trivial (e.g., no queue).  
      - *High-stakes bank (Friday):* S does *not* know the bank is open Saturday when error costs are catastrophic (e.g., mortgage default).  
      - *Lottery belief:* S does *not* know their ticket will lose, despite near-certain odds.  
      - *Stopped clock:* S does *not* know the time from a stopped clock, even if correct when glanced.  
  2.  **Conceptual Distinctions Preserved:**  
      - Knowledge ≠ justified true belief (JTB) (avoids Gettier collapse).  
      - Knowledge ≠ rational acceptance (lottery shows probabilistic justification ≠ knowledge).  
      - Subject-stakes (agent’s practical context) ≠ attributor-stakes (evaluator’s context).  
  3.  **Psychological Plausibility:**  
      - Accommodates evidence that perceived risk modulates evidence thresholds for belief formation/revision (e.g., *affective realism*).  
      - Doesn’t contradict findings on threat-induced skepticism (e.g., anxious agents require more evidence).  

  ### Camp-Specific Desiderata  
  4.  **Retroactive Stakes (Edge Case):**  
      - S forms belief *B* under low stakes (e.g., "Bank opens at 9"). Stakes later spike (e.g., S’s life now depends on *B*). *Does S still know B?*  
      - **Tension:** Avoiding retroactive loss ("yes, still knows") risks making knowledge stakes-*insensitive*. Allowing retroactive loss ("no, knowledge lost") implies knowledge is ephemeral.  
  5.  **Contextual Invariance:**  
      - *Non-negotiable for invariantists:* Knowledge facts are fixed across contexts.  
      - *Negotiable for contextualists:* Knowledge attributions vary with attributor’s context.  

  ### Key Tensions  
  - **Retroactive Stakes vs. Stakes-Sensitivity:** If knowledge survives retroactive stakes increases (*no loss*), the theory struggles to explain why high stakes *prevent* knowledge formation. If knowledge is lost (*retroactive loss*), it violates intuitive stability of past knowledge.  
  - **Invariance vs. Stakes-Sensitivity:** Strict invariantism struggles with bank cases; pure contextualism struggles with subject/attributor distinction.  

  ### Theory Assessment Against Desiderata  
  | **Theory**               | **Classic Cases** | **Distinctions**       | **Psychology** | **Retroactive Stakes** | **Invariance** |  
  |--------------------------|-------------------|------------------------|----------------|------------------------|----------------|  
  | **Pure Contextualism**   | ✓ (via attributor context) | ✘ (blurs subject/attributor) | △ (fits attributor-focused bias) | ? (varies by attributor; unstable) | ✘ (denied) |  
  | **Invariantist PE**      | ✓ (via subject stakes) | ✓ (preserves distinctions) | △ (fits subject-focused thresholds) | Retroactive loss ✘ (usually) | ✓ (insists) |  
  | **Knowledge-First (PE)** | △ (struggles with lottery) | ✓ (knowledge primitive) | △ (minimal commitment) | Retroactive loss ✘ (typically) | ✓ (insists) |  

  ### Settled vs. Contested  
  - **Settled:** Any viable theory must resolve classic cases and preserve JTB distinction. Subject/attributor distinction is non-negotiable for non-contextualists.  
  - **Contested:** Whether retroactive stakes defeat knowledge (invariantists typically say no; some contextualists say yes if evaluator’s stakes shift). Invariance is the core dividing line—contextualists reject it, others demand it. Psychological evidence is claimed by all sides but doesn’t decisively favor one framework. **No consensus exists.**  

  **Bottom Line:** Avoiding retroactive loss while maintaining genuine stakes-sensitivity is the critical tension; no theory cleanly resolves it without sacrificing a desideratum, highlighting a likely theoretical cost.
