     Finally, the predictable problem: the players might not understand why the absolute prediction failed, and you may have to explain the scoring rule multiple times.

     Also, ensure the motion rules are clear and deterministic.

     Debrief notes (to be used after scoring):

     1. What happened in the game?
          - We had a board with labeled points.
          - We moved tokens in a deterministic way.
          - When the hole (a region) was empty, we relabeled the points in it.
          - After relabeling, the absolute predictions (using the old label) often failed, while relational predictions (using only the relative positions) held.

     2. Mapping to the hole argument:
          - The board represents spacetime.
          - The points (cells) are spacetime points.
          - The tokens represent physical events (like the presence of a particle).
          - The motion rules represent the laws of physics (in this case, deterministic).
          - The relabeling in the empty hole represents a diffeomorphism: a reassignment of which point is which, but only in a region where nothing is happening.
          - The failure of the absolute predictions illustrates that statements about which point (by its identity) an event occurs at are not physically meaningful if the identity can be changed by a diffeomorphism.
          - The success of the relational predictions illustrates that only the relative arrangement of events is physically meaningful.

     3. The hole argument in general relativity:
          - In GR, the equations allow for diffeomorphisms. If you have a solution, you can reassign the points in a region (the hole) and get a new solution that is observationally identical.
          - This seems to imply that the theory does not determine which point will have which properties in the hole, which would be a failure of determinism.
          - But if we consider that the two solutions (before and after the diffeomorphism) represent the same physical reality (because they have the same relative arrangement of events), then there is no failure of determinism.
