          Absolute: "red will be at B2 in round3" -> In round3, we look for a cell with label B2. It is at physical cell (3,3), which is empty. The red token is at a cell labeled C3. So false.
          Relational: "red will be one cell south of the landmark's row and one cell east of the landmark's column" -> the landmark is at (1,1). One cell south and one cell east is (2,2). The token is at (2,2) -> true.

     This will work.

