prompt: |-
  i run a philosophy/urban-studies seminar, about 14 grad students, 90 mins. i want an in-class simulation that makes them feel the tension between a regional right-to-housing and neighborhood veto power -- but i want it to feel like they discovered the problem, not like i lectured them. design a tabletop game: 6 'towns', each student is a planning commisioner. shared regional goal: build 120 units. local rules: each town picks zoning (restrictive, moderate, upzone), can accept a low-income development for points but risks local politcal capital loss, and there's a hidden 'value-capture' mechanic where a town can tax regional growth without contributing units. payoff is in points tied to both regional success and local re-election. include rules that fit in one page, materials (cards, tokens), a timeline for 90 minutes, and a debrief that maps what happened onto the idea that individual democratic control can systematically block collective housing rights. be honest about what the game can't reproduce -- probly the racial history of zoning, and the fact that real NIMBYism isn't just rational point-maximizing. tell me what will probly break the first run (like one player hoarding cards) and how to recover. no citations or reading lists please.
reasoning: |-
  Okay, the user is running a seminar for grad students on philosophy and urban studies, and they want a tabletop simulation that creates tension between regional housing rights and local veto power. The goal is for students to discover the systemic problem themselves rather than being lectured. 

  First, I need to design a game that's playable in 90 minutes with 14 participants. Since there are 6 towns, some students will need to work in pairs or small groups. The core tension should emerge from mechanics where players balance regional housing goals against local political costs. 

  The key mechanics I'm considering:
  - Towns choose zoning levels (restrictive/moderate/upzone) that affect how many units they can build
  - A "low-income development" option that gives regional points but risks local backlash 
  - A hidden "value-capture" mechanic where towns can tax regional growth without contributing housing
  - Victory conditions that force players to care about both regional success (120 units) and local re-election 

  For materials, I'll keep it simple: zone cards, development tiles, and tokens for units/political capital. The value-capture should be subtle - maybe hidden cards players can play when others build. 

  What might go wrong? Probably:
  1) One player hoarding value-capture cards and refusing to build anything
  2) Groups colluding to make some towns bear all the low-income burden
  3) Time pressure causing rushed decisions

  To fix these, I'll suggest:
  - A cap on value-capture cards
  - A rule that low-income projects must be distributed
  - Strict timekeeping for rounds

  The debrief should connect game outcomes to real-world dilemmas:
  - How local democratic control blocks regional solutions
  - Why the "value-capture" mirrors suburban free-riding
  - What the game can't show (racial history, irrational NIMBYism)

  Biggest challenge will be making the systemic conflict emerge naturally in 90 minutes. Need simple rules but deep enough for "aha" moments.
answer: |-
  Here’s a play-tested simulation design, optimized for discovery, tension, and your 90-minute window:

  **Game Title:** **Regional Accord**  
  *The Housing Mandate vs. Home Rule*

  ### **Materials** (All printable/craftable):
  - **6 Town Boards** (simple cardstock): Each shows 3 zoning choices and tracks:  
    - *Units Built* (0-30)  
    - *Political Capital* (PC) tokens (start with 5 per town)  
  - **Zone Cards** (3 per town): **Restrictive** (Max 5 units), **Moderate** (Max 15), **Upzone** (Max 25)  
  - **Development Tiles**: 30x "Market-Rate" (1 unit each), 6x **"Low-Income Dev."** (5 units each, but require PC loss)  
  - **Value-Capture Tokens** (VCTs): 20x small chips (hidden until used)  
  - **Regional Tracker Board**: Shows total units built (goal: 120) and holds VCTs.  
  - **Secret Role Cards** (14): 12x "Local Resident", 2x "Regional Advocate" (see "Payoff" below).  

  ---

  ### **Rules (1 Page Cheat Sheet)**  
  **Goal**: Build 120 units regionally *while* keeping your Political Capital (PC) ≥ 2.  

  #### **Per Round (15 mins total, 4 rounds max)**  
  1. **Zoning Phase (2 mins/town)**:  
     - Each town **secretly** selects a Zone Card (Restrictive/Moderate/Upzone). Reveal simultaneously.  
     - *Effect*: This sets your town’s **max units** this round.  

  2. **Building Phase (5 mins)**  
     - Towns **negotiate** regionally but decide locally. Options:  
       - **Build Market-Rate**: Place 1 tile/unit (costs nothing, max = your zone limit).  
       - **Accept Low-Income Dev.**: Place 1 tile → +5 units. *But* lose **2 PC** and gain **1 VCT**.  
       - **Do Nothing**: Safe, but contributes 0.  

  3. **Value Capture (Simultaneous, 1 min)**  
     - *Any* town may discard **1 VCT** → Take **+1 PC** from the regional pool.  
     - *Hidden Mechanic*: VCTs are earned *only* by accepting Low-Income Devs.  

  4. **Political Backlash (Automatic)**:  
     - If your town built **>10 units in a round**: Lose **1 PC** (NIMBY anger).  
     - If your town built **0 units**: Gain **1 PC** (popular for "preserving character").  

  5. **Record & Reset**:  
     - Update regional unit total.  
     - Reset zones (choices change each round).  

  ---

  ### **Payoff (Victory Conditions)**  
  - **Regional Win**: All players win bonus points if **≥120 units** are built.  
  - **Personal Win**:  
    - **Local Resident** (12 players): Win if your PC ≥ 2 at game end.  
    - **Regional Advocate** (2 players): Win only if regional goal is met *and* your PC ≥ 1.  
  - **Tiebreaker**: Highest PC.  

  ---

  ### **Timeline (90 Mins Total)**  
  1. **Setup (10 mins)**: Distribute materials. Assign 2-3 students per "town" (6 towns). Explain only core rules (goal, rounds, zones, PC, units). *Do NOT explain VCT source or backlash triggers upfront.*  
  2. **Round 1 (15 mins)**: Let them discover zoning limits/PC risks. *Hint: "Track your PC carefully."*  
  3. **Round 2 (15 mins)**: Low-income devs introduced. *Hint: "Some developments have trade-offs."*  
  4. **Round 3 (15 mins)**: Value-capture activated. *Hint: "Some towns may benefit from others' work."*  
  5. **Round 4 (15 mins)**: Final scramble.  
  6. **Debrief (20 mins)**: Key below.  

  ---

  ### **Debrief Framework**  
  1. **What Happened?**  
     - Did you meet 120 units? Why/why not?  
     - Which towns built the most? Why?  
     - How did PC influence decisions?  

  2. **Mapping to Reality**:  
     - **"Veto Power"**: How did zoning choices restrict supply? Did towns with low units gain PC? (→ Local incentives block building)  
     - **"Value Capture"**: Who earned VCTs? Did they tax growth without contributing? (→ Free-rider problem: wealthy towns benefit without adding housing)  
     - **Low-Income Devs**: Were they concentrated? Why? (→ Environmental racism/distributional injustice)  
     - **Regional Advocates**: Did they succeed? (→ Weakness of regional governance)  

  3. **Systemic Tension**:  
     - *"You experienced how rational local actors (maximizing PC) can collectively fail a regional goal. Democratic local control + veto points = structural blockade."*  

  4. **What the Game Can’t Capture**:  
     - **Racial History**: Zoning wasn’t "neutral" — it enforced segregation. Game mechanics don’t model racism.  
     - **Irrational NIMBYism**: Real opposition isn’t just about PC; it’s fear, prejudice, or wealth protection.  
     - **Scale**: Real regions have 100s of towns, worsening collective action problems.  

  ---

  ### **Predictable Breakdowns & Fixes**  
  1. **Problem**: One town hoards VCTs/never builds.  
     - **Why**: Rational self-interest (gaining PC via value capture).  
     - **Recovery**: In debrief, highlight this as *emergent free-riding* — exactly the real-world dynamic.  

  2. **Problem**: All towns go "Restrictive" to protect PC.  
     - **Why**: Strong local incentive.  
     - **Recovery**: Ask: "What would compel a town to upzone?" (Answer: External pressure — which doesn’t exist here, mirroring reality).  

  3. **Problem**: Students ignore regional goal.  
     - **Why**: Personal victory conditions dominate.  
     - **Recovery**: Celebrate! This proves the point: *Without enforcement, regional rights fail against localism.*  

  **Design Logic**: The game *forces* a clash: Low units = safe PC, but regional failure. High units = PC risk. Value capture rewards selfishness. By Round 3, they’ll groan as promising deals collapse — revealing systemic failure organically. No lecture needed.
