answer: |-
  ## Analysis of Danny Meyer's Tipping Elimination: A Conventionalist Case Study

  **Distinguishing the Functions of the Tipping Convention:**

  1.  **Coordination Function:** The convention served as a signaling and coordination mechanism.
      *   **Signaling Service Quality:** Tips signaled expected service quality to customers and servers. A higher expected tip percentage (e.g., 20% vs. 15%) implicitly communicated a higher service standard.
      *   **Directing Labor Attention:** Servers allocated effort based on perceived tipping potential (e.g., focusing on larger tables, perceived "good tippers"). Customers used tips to reward/punish service quality, directing server behavior in real-time.

  2.  **Compensation Function:** The convention was a fundamental wage mechanism.
      *   **Externalizing Wage Costs:** Employers leveraged the convention to legally pay servers a significantly reduced base wage (often below minimum wage, relying on tips to meet the legal threshold), effectively transferring a major portion of the labor cost directly onto diners.
      *   **Distributive Outcome:** This embedded a specific, contested distributive judgment: that diners, not employers, bear the primary responsibility for directly compensating service labor, creating income volatility and disparities.

  **Applying the Conventionalist Framework:**

  The framework holds: **Conventions generate moral obligations for participants *only* when they serve *pure coordination* and do *not* embed contested distributive judgments.**

  *   **Analysis of the Tipping Convention:** The NYC restaurant tipping convention *deeply* embedded a contested distributive judgment – the externalization of wage costs onto customers and the resulting income structure for workers. It was *not* purely coordinative; its compensation function was fundamental and inseparable. Therefore, **under this framework, the convention *did not* generate a *moral* obligation for anyone (locals or visitors) to tip.** The obligation was primarily economic/legal (servers relying on tips for livelihood) and social (fear of disapproval), but not fundamentally moral based on pure coordination.

  *   **Obligations of Non-Local Visitor vs. Local Regular:**
      *   **Local Regular:** While the framework denies a *moral* obligation stemming purely from convention, locals faced stronger *social* and *prudential* obligations due to recurring participation, potential relationships with staff, and reputational concerns within the local ecosystem. Their participation actively reinforced the system. However, the embedded distributive injustice weakens any claim that this social obligation rises to a *moral* duty grounded *in the convention itself*.
      *   **Non-Local Visitor:** Visitors had weaker *social* obligations (no recurring participation or reputation at stake) but faced the same *prudential* obligation (avoiding social awkwardness, ensuring good service during their meal) and the same *economic* reality (servers depended on tips). Crucially, **the conventionalist framework suggests visitors had *no distinct moral obligation* arising *from the convention itself*.** Any obligation stemmed from the underlying economic dependence of workers and general fairness, not the convention's coordinative structure, which was intertwined with injustice.

  **What Meyer's Reform Reveals:**

  1.  **Exposing the Wage Mechanism:** Meyer's reform fundamentally **reveals that the tipping convention was always primarily a disguised wage mechanism, not a pure coordination tool.** His explicit rationale – to create equitable wages, reduce pay disparities between front and back-of-house, provide stability, and improve culture – directly targeted the *compensation* function's flaws. The successful transition (despite initial friction) demonstrates that the *coordination* function (signaling quality, directing attention) could be replaced by management oversight, clear service standards, and upfront pricing. This **severely undermines the claim that tipping was ever a *moral* obligation** under the conventionalist view, as its core purpose was distributive, not purely coordinative.
  2.  **Supporting Flexible Conventionalism:** The reform also **supports a flexible conventionalist view.** It shows that conventions serving complex functions (coordination + compensation) *can* be deliberately re-engineered to better serve desired outcomes (fairness, stability) without catastrophic coordination failure. The core coordination (delivering food/service) persisted, but the *method* of compensation signaling and labor direction changed. This demonstrates conventions are malleable social tools, not immutable moral laws. The "moral loss" argument (if tipping were a moral duty) is countered by the *moral gain* achieved through fairer wages and reduced inequality.

  **Broader Implications for Visitors and Local Conventions:**

  *   **Strengthens Nuance, Weakens Absolutism:** This episode **weakens** the absolutist claim that visitors *must always* observe local conventions simply because they are local. The key factor is the convention's **purpose and embedded values**.
      *   **Context-Dependence is Paramount:** Visitors *are* more likely bound by conventions serving **pure coordination** within a specific local institutional context they temporarily benefit from (e.g., queuing norms ensuring orderly service everyone uses, local traffic flow patterns ensuring safety). Ignoring these can cause direct harm or disruption.
      *   **Distributive/Exploitative Conventions:** Where a convention primarily serves to **embed a contested or exploitative distributive outcome** (like tipping externalizing wage costs, or perhaps a local "fee" system exploiting tourists), the obligation for visitors (and arguably locals) to comply is **significantly weakened or negated** on moral grounds. Meyer's reform highlights this distinction.
  *   **Where Conventionalism is Silent:** The conventionalist framework is silent on:
      1.  **Intrinsic Morality:** It doesn't judge whether the *outcome* of a purely coordinative convention is inherently good or bad (e.g., a highly efficient queuing system for something immoral).
      2.  **Underlying Moral Duties:** It doesn't address underlying, universal moral duties (fairness, non-exploitation, keeping promises) that might exist *alongside* or *despite* conventions. A visitor might have a moral duty *not* to exploit low-wage workers, regardless of the tipping convention's coordinative role.
      3.  **Perfect Justice:** It doesn't provide a definitive standard for what constitutes a "contested distributive judgment" severe enough to invalidate the convention's moral force. Where is the line?
      4.  **Power Dynamics:** It often underplays the role of power in establishing and maintaining conventions, especially those with exploitative distributive elements.

  **Conclusion:**

  Danny Meyer's abolition of tipping exposed the NYC restaurant tipping convention as fundamentally a wage distribution mechanism disguised as a coordination tool. Under the conventionalist framework applied, this embedded distributive injustice meant the convention **never generated a genuine moral obligation to tip for anyone, local or visitor.** Obligations were economic, social, or prudential, not moral *based on the convention*. The reform supports **flexible conventionalism** by demonstrating that conventions combining coordination and distribution can be redesigned for moral improvement without coordination collapse. For visitors, this case **strengthens the argument that adherence to local conventions depends critically on the convention's purpose:** binding for pure coordination within the shared context, but not morally obligatory (and potentially morally objectionable) when the convention primarily enforces an exploitative or unjust distributive scheme. Conventionalism provides a useful lens for distinguishing coordination from distribution, but remains silent on deeper questions of intrinsic justice, universal duties, and the precise threshold of "contested" distribution.
