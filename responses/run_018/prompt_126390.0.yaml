answer: |-
  ## Vocabulary Revision Under a Broken Mirror

  The words stood fixed, a mirror in the hall,
  Reflecting truths I thought were absolute.
  Each term a pane of undistorting glass,
  Where meaning showed its clear and sharp salute.
  The world outside, a settled, waiting fact,
  My mind within, a surface smooth and bright.
  Correspondence was the crucial, binding pact,
  Making knowledge solid in the light.
  This lexicon mapped territories precise:
  "Essence," "Substance," "Truth" – firm stones to stand upon.
  Its grid aligned with what must surely be,
  A fixed star rising before the dawn.

  But then the terms grew stiff; they would not bend
  To meet the shifting ground beneath my feet.
  Not that the mirror cracked or failed to send
  Some image back – the glass seemed quite complete.
  But what it showed, though sharp, no longer *served*.
  I tried to speak, to build, to bridge the gap
  With trusted words, but action was unnerved;
  The phrases clattered like a clumsy trap.
  "True" or "False"? The question missed the mark.
  The frame still held, the image clear as day,
  Yet coordination faltered in the park,
  The common purpose fraying, falling away.
  My story, too, grew thin; the thread snapped clean.
  The old descriptions, accurate but cold,
  Could not sustain the self I strove to mean,
  Could not the future narrative unfold.

  No mirror breaks through mere distortion now,
  But through the uselessness of its display.
  So let me cast the shards aside, allow
  New instruments to shape the coming day.
  Not pictures held to Nature's stern review,
  But tools for forging bonds, for making self:
  A hammered phrase, a temporary glue,
  A net that gathers meaning off the shelf.
  These words I pick are stitches, rough and torn,
  To mend the cloth where solidarity frayed.
  They serve the purpose, keep the project worn
  And lived, not mirrored in some grand arcade.
  The lexicon revises, not for truth's demand,
  But for the life its usage can command.

