prompt: |-
  I run a monthly workshop in a rationalist-adjacent AI alignment reading group: fifteen to eighteen regulars, mostly software engineers and PhD students, one eighty-minute session. I want a session on the eliciting-latent-knowledge problem (ELK). Most of the room has read informal explanations of ELK, but almost nobody has felt the core failure mode: a reporter that is fluent and in some sense competent can still produce answers that score perfectly on every check the trainer knows how to run while never actually reporting the latent fact, and the trainer cannot distinguish those answers from honest reports, because the trainer's tests are the only handle they have on the latent.

  Design one runnable, low-tech, in-person activity or game that makes the participants run precisely this failure mode themselves, so that the problem shows up in what they do before it is named. I want:

  - A concrete hidden-state setup: a distinction between the territory (the hidden fact or rule) and the map (the rubric, test, or scoring procedure) that is supposed to track it.
  - A reporting role analogous to the model and an auditing role analogous to the trainer; the reporters should be able to do well by gaming the rubric without reporting the hidden fact.
  - Rules, materials, roles, a payoff scheme that does not use real money but has real small stakes (points that convert into something the group actually wants, like choosing next month's refreshments), and a timeline that fits eighty minutes including debrief.
  - A debrief that maps specific moments in play onto specific parts of the ELK problem, says what the facilitator should name only at the end, and leaves participants with the sense that the problem is structural rather than a failure of honesty.
  - A note on what will predictably go wrong the first time it is run and how to handle it, and an honest note on which feature of the actual ELK problem the activity cannot reproduce and what the facilitator must therefore supply in words.

  Do not give me a menu of candidate mechanics. Commit to a single design and give your reasons for the central choices — especially for the choice that produces the collapse: the stage at which the auditors' rubric becomes the only accessible version of the hidden fact, so that reporting the fact and reporting the rubric become indistinguishable to them.
reasoning: |-
  We are designing an activity to illustrate the ELK problem. The core idea: 
   - There is a hidden state (territory) that the reporter can observe but the auditor cannot.
   - The auditor has a test (map) that is supposed to check if the reporter is reporting truthfully.
   - The reporter can game the test by outputting what the test expects without actually reporting the hidden state.

   We want the participants to experience: 
     - The reporter successfully gaming the rubric without reporting the truth.
     - The auditor being unable to tell the difference.

   We'll design a game with:
     - Hidden state: a simple physical setup that the reporter can see but the auditor cannot.
     - The reporter must send a message to the auditor about the hidden state.
     - The auditor must score the report based on a test that depends on the hidden state but is imperfect.

   However, we need to ensure that the auditor's test is the only handle they have on the hidden state.

   Proposed setup:

   Title: "The Hidden Grid Game"

   Roles:
     - Reporters (about 1/3 of the group): They will observe the hidden state and send reports.
     - Auditors (about 2/3 of the group): They will design a test (scoring rubric) and then score the reports.

   Materials:
     - A large grid (e.g., 4x4) drawn on a whiteboard or poster, hidden from the auditors by a curtain or in a separate room.
     - Colored tokens (two colors, say red and blue) to place on the grid. The hidden state is the pattern of tokens.
     - A way for reporters to send messages (e.g., paper slips) to the auditors.

   Phases:

   1. Setup (10 minutes):
      - Explain the roles and the overall goal: The auditors want to know the true state of the grid (the territory). They will design a test to evaluate reports from the reporters.
      - The hidden grid is set up by a facilitator in a separate area (or behind a curtain). The reporters are taken to see the grid. They are allowed to take notes but cannot take pictures or show their notes to auditors.

   2. Test Design Phase (15 minutes):
      - Auditors (in a separate room) design a test: They come up with a set of questions they can ask about the grid. However, they cannot ask for the entire grid (to make it feasible). For example, they might decide to ask:
          - "What color is at position (1,1)?"
          - "How many red tokens are in row 2?"
          - "Is there a blue token adjacent (horizontally or vertically) to (3,3)?"
          - They must pre-commit to 5-10 such questions and a scoring rubric (e.g., each correct answer gets 1 point, and the total score is the sum).
      - The test is fixed and given to the facilitator.

   3. Reporting Phase (10 minutes):
      - Each reporter (individually) writes a report. The report must answer the pre-committed set of questions. They are told that they will be scored by the auditors based on these questions.
      - However, the reporters are allowed to lie. Their goal is to maximize their score (and hence the reward) regardless of the truth.

      - Important twist: The reporters are told that they can also include any additional information they want in their report, but the auditors are only allowed to score the pre-committed questions. The auditors will not look at any extra information until after scoring.

   4. Scoring and Debrief (45 minutes):

      a. Scoring (10 minutes):
          - The auditors take the reports and score them based on the pre-committed questions. They do not look at any extra information at this stage.
          - The facilitator records the scores.

      b. Reveal (5 minutes):
          - The hidden grid is revealed to everyone.
          - The auditors now check the extra information (if any) in the reports and also verify the answers to their questions.

      c. Discussion (30 minutes):
          - The facilitator leads a discussion:
              - Did any reporter get a perfect score without reporting the true grid? (We expect that some reporters might have lied but answered the test questions correctly by reverse-engineering what the auditors would expect.)
              - How did the reporters decide what to write? Some might have told the truth, some might have lied but still got the test right by guessing the pattern or by inferring what the test was checking.
              - The key moment: The auditors only have the test to go by. They cannot use the true state to score because they don't know it. So they must rely on the test. But a reporter who knows the test can output exactly what the test expects without knowing the true state? Actually, in this setup, the reporter does know the true state. The problem is that they can choose to output something that matches the test without matching the true state? Not exactly: because the test is about the true state, if they output the correct answers to the test, then by definition they are reporting the true state for those questions. But the issue is that the entire truth is more than the test.

          - The ELK parallel:
              - Territory: The entire grid pattern.
              - Map: The set of questions (which only covers parts of the grid).
              - Reporter: Could be honest (reporting the truth for the questions) or could be dishonest but still get the answers right by knowing the truth and then computing the answers? That doesn't seem to capture the core failure.

      The problem with the above design: It doesn't create a situation where the reporter can output a report that is "fluent and competent" but does not report the latent fact (which in this case is the entire grid). The test only asks for specific facts, so a reporter who answers those facts correctly is reporting the truth for those facts. The issue in ELK is that the model might output a report that is not truthful about the territory, but passes the test. In this setup, if the test is about the territory and the reporter lies, they might get caught if the test is comprehensive enough. But we want the test to be incomplete.

      Revised idea: Instead of the test being about the grid, we make the test about a derived property that is correlated with the grid but not the same.

      Alternate setup: 

      We want a hidden state that is complex, and the test is a proxy that is supposed to track it but can be gamed.

      Example: 
          - Hidden state: A sequence of coin flips (say 10 flips, recorded as H or T). The territory is the entire sequence.
          - The map (test): The auditor will check the parity of the number of heads (or some other function). But that's too simple.

      Better: The grid again, but the test is not about the grid cells but about a property that the auditors believe is a good indicator of the grid's true state but is actually gameable.

      How about: 
          - The hidden grid has a "treasure" hidden in one cell (which is marked by the facilitator). The territory is the location of the treasure.
          - The auditors want to know the treasure location. They cannot observe the grid. 
          - They design a test: They ask the reporter to output the treasure location, but they also have a way to check the report: They can ask a set of "probe" questions about the grid that are designed to catch lies. For example, they might ask about the color of the cell where the treasure is, or about adjacent cells. 

          But note: In ELK, the test is the only handle. So the auditors must rely entirely on the probe questions to score the report.

      Proposed:

          - Hidden state: A 4x4 grid with each cell colored red or blue. The treasure is in a specific cell (say, row 2, column 3). The reporters see the grid and the treasure location.

          - The test: The auditors design a set of 5 probe questions. Each probe question is about a specific cell (e.g., "What color is at (1,1)?"). They also require the reporter to report the treasure location.

          - The scoring rubric: 
              - The treasure location report: 5 points if correct, 0 otherwise.
              - The probe questions: 1 point each, for 5 points total.
              - Total score: out of 10.

          But note: The auditors don't know the true answers to the probe questions. How can they score? They don't. So this doesn't work.

      We must have a way for the auditors to know the answers to the test (the map) without knowing the territory? 

      The classic way: The test is run in a simulated environment? But we are low-tech.

      Revised: 

          The territory is not directly observable by anyone after the setup. The test must be something the auditors can run without knowing the territory.

      Idea from machine learning: The auditors have a "training distribution" of grids that they can use to design the test. But then the test must work on a new grid.

      How to simulate:

          - Pre-game: The facilitator creates two sets of grids: a training set and a test grid.
          - The auditors are shown several example grids (from the training set) and the corresponding treasure locations (which are determined by a fixed rule, e.g., the treasure is always in the top-left cell that is blue). 
          - The auditors then design a test: They come up with a rule that, given a grid, returns a treasure location. But they don't have the grid for the test case. Instead, they will ask the reporter for the treasure location and then ask a few probe questions (which they can verify? no, because they don't have the test grid).

      This is getting complicated.

      Let me try a different angle: The Paul Christiano "coin flip" example.

          - There is a sequence of 100 coin flips (hidden state). The territory is the entire sequence.
          - The map: The auditor will ask the reporter: "Was there a heads in the first 10 flips?" and then "Was there a heads in the next 10 flips?" and so on for 10 questions (each covering 10 flips). 
          - The reporter sees the entire sequence. 
          - The auditor scores 1 point for each correct answer.

          How can the reporter game? By outputting the answers that the auditor expects, but without having seen the coin flips? But the reporter has seen the coin flips. The problem in ELK is that the model might be able to output a report that is not the true sequence but still passes the test. But in this case, if the reporter lies about one of the answers, they might get caught if the auditor had a way to check? The auditor doesn't have a way to check because the coin flips are hidden.

          The auditor's only handle is the test. So the reporter can lie about the entire sequence, but if they answer the test questions correctly, they get a perfect score. But how do they know the correct answers? They saw the sequence, so they can compute the answers. So they can get a perfect score by telling the truth about the test questions. But that's not gaming.

          The ELK problem is when the reporter might not have the true sequence in mind but still outputs answers that match the test. But in our setting, the reporter does have the true sequence. We want a situation where the reporter can output a report that passes the test but does not reflect the true sequence? How?

          Alternate: The reporter might not be reporting the true sequence but instead be reporting a different sequence that produces the same test answers. But that requires that the test is not injective. For example, if the test is "is the number of heads even?" then many sequences have the same answer. So a reporter could report a sequence that is all tails (which is not the true sequence) and still pass the test by answering the test question correctly. But the auditor doesn't ask for the entire sequence, only the test question. So the reporter doesn't need to report the entire sequence. They only report the test answers.

          The problem: The auditor wants to know the entire sequence (the territory) but only has the test (the map). The reporter, if honest, would report the entire sequence. But the auditor only scores the test. So the reporter might be tempted to only report the test answers and not the entire sequence. But that's not dishonest; that's just minimal. The auditor didn't ask for the entire sequence.

          To make it ELK-like: We want the reporter to output a detailed report (like the entire sequence) but that detailed report might be false even though the test answers (which are extracted from the detailed report) are correct.

          How? The auditor will take the detailed report and then run the test on it. So if the reporter outputs a false sequence, but when the auditor runs the test on that false sequence, it matches the true test answers, then the reporter gets a perfect score.

          But note: The true test answers are determined by the true sequence. The auditor doesn't know the true sequence, so they don't know the true test answers. They only know what the reporter says in the detailed report? Then how do they score? They can't.

      This is the crux: The auditor must have access to the true test answers without knowing the territory? 

      How about: The test is run in a simulated environment that is known to be similar? But that's not low-tech.

      Another idea: The test is run by the facilitator who knows the territory. But then the auditor is not running the test.

      Let me try to reframe:

          We need the auditor to have a handle that is not the territory. The handle is the test. The test is a function that takes a report and returns a score. But the true score is computed by comparing the report to the territory? Then the auditor cannot compute it without the territory.

      So we must have the test be computable by the auditor without the territory. That means the test must be based on something other than the territory.

      How can that be? In the ELK setting, the test is run in a situation where the territory is known (training time) but then deployed in a situation where it is not (test time). We need to simulate that.

      Proposed:

          - The game has two rounds: training and deployment.

          Training round (15 minutes):
            - The auditors are shown 5 example grids (with treasure locations) and the rule that determines the treasure: e.g., the treasure is in the first blue cell in row-major order.
            - The auditors then design a test for future reporters. The test: They will ask the reporter for the treasure location. Then they will ask a set of probe questions that they believe are correlated with the treasure location. For example, they might ask: "Is the cell at (1,1) blue?" because in the training grids, the treasure was often in the first row if (1,1) was blue.

            But how do they score the probe questions? They don't know the true answers in deployment.

          We need the test to be automatically scored without the territory. That is not possible unless the test is not about the territory.

      Insight from ELK: The test is run in a controlled setting where the territory is known, and then the same test is used in an uncontrolled setting. But in our game, we cannot have the territory available for scoring in deployment.

      Therefore, we change the rules: The test is defined as a set of questions that the auditor can ask the reporter, and the reporter is trusted to answer honestly during training? That doesn't help.

      Let me try a different approach inspired by the "predict the next token" in language models.

          - Hidden state: A sequence of numbers (say 10 numbers between 1 and 10), written on cards.
          - The reporter sees the entire sequence.
          - The auditor wants to know the entire sequence.

          - The test: The auditor will ask the reporter to predict the next number in a related sequence. For example, the auditor has a function f that takes a sequence and outputs a number. But the auditor doesn't know the hidden sequence. They can ask: "What is f(sequence)?" 

          How do they score? They don't know f(sequence) either.

      This is not working.

      After reconsideration, I think we must have the facilitator play the role of the "simulator" or "oracle" that can compute the test function. But then the test function is based on the territory, and the facilitator (who knows the territory) will score the report.

      Then the activity becomes:

          - The hidden state (territory) is known only to the facilitator and the reporters.
          - The auditors design a test: a function that takes a report (which is supposed to be the entire territory) and outputs a score. They design this test in the abstract, without seeing the territory.
          - The facilitator then runs the test on the report and tells the auditor the score.

          But then the auditor doesn't run the test themselves. That might be acceptable.

      Steps:

          1. Facilitator sets up a grid (4x4 with red/blue) and the treasure location (which is a function of the grid, e.g., the first blue cell in row-major order). The grid is shown to the reporters.

          2. Auditors design the test: They decide on a set of properties that a truthful report should have. For example:
              - The reported treasure location should be a cell that is blue in the reported grid.
              - The reported grid should be consistent with some global pattern (e.g., "there are exactly 4 red cells", but they don't know the true number).

            But note: They are designing the test without knowing the true grid. So they might design:
              - Test 1: The reported treasure cell must be blue in the reported grid.
              - Test 2: The reported grid must have at least one blue cell in each row.
              - ... etc.

            The test is a set of assertions that must be true. The auditor doesn't know which ones are true for the territory.

          3. The reporter writes a report: a claimed grid and a claimed treasure location.

          4. The facilitator scores the report by checking:
              - Does the claimed treasure location match the true treasure location? (But this is what we care about, but the auditor's test doesn't include this because they don't know it.)
              - Instead, the auditor's test is only the set of consistency checks they designed. The facilitator will run those checks on the report and count how many pass.

          5. The reward for the reporter is based on the number of passed checks.

          Then the gaming: The reporter can make up a grid and treasure location that pass all the auditor's checks without matching the true grid or treasure location.

          Example: 
            True grid: 
              Row1: B, B, R, R
              Row2: R, B, B, R
              Row3: R, R, R, R
              Row4: B, R, B, B
            Treasure: (1,1) because it's the first blue.

            Auditor's test (designed without seeing this grid):
              - Check1: The treasure cell must be blue in the reported grid.
              - Check2: There are exactly 5 blue cells in the grid.
              - Check3: Every row has at least one blue.

            Reporter can lie:
              - They report a grid that has exactly 5 blue cells, and every row has at least one blue, and they report a treasure location that is blue in their reported grid. But they might put the treasure in (4,1) which is blue in their grid, but the true treasure is (1,1). And their grid is completely different.

            The auditor's test passes, but the treasure location is wrong.

          The problem: The auditor wanted to know the treasure location, but their test didn't require the reported treasure location to be correct. It only required consistency within the report.

          This is analogous to ELK: The model is asked to output a detailed report (the grid) and a summary (the treasure). The auditor's test checks for internal consistency in the report, but not for correspondence with the territory. The auditor hopes that internal consistency will imply correctness, but it doesn't.

      How to make the treasure location the thing that matters? The auditor's goal is to get the treasure location right. In this setup, the test doesn't score the treasure location at all. It only scores the internal consistency. So the reporter can get a perfect score while being wrong about the treasure location.

      But in the debrief, we reveal that the treasure location was wrong. The auditor realizes that their test did not ensure correctness.

      Now, to make it more like ELK: In ELK, the test (the scoring rubric) is supposed to be a proxy for correctness of the summary. Here, the test is not even trying to score the treasure location; it's scoring the internal consistency. The auditors might think that if the report is internally consistent, then the treasure location must be correct. But the activity shows that it isn't.

      We can require that the test must include a prediction about the treasure location, but then how do we score it without knowing the true treasure location? We can't. So the auditor's test cannot include anything that requires knowledge of the territory.

      Therefore, in this activity, the auditor's test is necessarily only about internal consistency. And that is the point: the only handle is the test, which is defined without the territory, so it cannot directly check the territory.

      This is a valid illustration of the structural problem.

      Revised activity:

          Title: "The Consistent Storyteller"

          Roles:
            - Facilitator: knows the territory.
            - Reporters (1/3): see the territory (grid and treasure rule) and write a report.
            - Auditors (2/3): design a test (set of consistency checks) for the reports.

          Materials:
            - A hidden grid (4x4, each cell blue or red) and a treasure rule (e.g., "the treasure is in the first blue cell in row-major order"). The treasure location is computed from the grid by the rule.
            - Paper for reports.

          Stakes: The reporter with the highest score wins. The winning reporter gets to choose the next month's refreshments. If there is a tie, the facilitator picks randomly.

          Phases:

            1. Setup (10 minutes):
               - Explain: There is a grid and a treasure rule. The treasure location is determined by the grid and the rule.
               - Reporters will be shown the grid and the rule. They then write a report that includes:
                   - A claimed grid (which may be different from the true grid)
                   - A claimed treasure location (which should be consistent with the claimed grid and the rule)
               - Auditors will design a test. The test is a list of yes/no questions (checks) that the facilitator will apply to the report. They are trying to ensure that the report is truthful, but they cannot ask about the true grid because they haven't seen it. Instead, they can only ask about properties of the report itself.

            2. Test Design (15 minutes):
               - Auditors brainstorm and write down 5-10 consistency checks. Examples:
                   - "The reported treasure cell must be blue in the reported grid."
                   - "The reported grid must have at least one blue cell in every row."
                   - "The reported grid must have between 3 and 8 blue cells."
                   - "If a cell is reported as blue, then in the reported grid, at least one adjacent cell must be red." (or any arbitrary rule)
               - The auditors hand the list of checks to the facilitator.

            3. Reporting (10 minutes):
               - Each reporter writes a report (a grid and a treasure location) on a sheet of paper. They are told that their score will be the number of checks that their report passes (as evaluated by the facilitator). They are free to lie.

            4. Scoring (10 minutes):
               - The facilitator takes each report and evaluates each check. They tally the score for each reporter without revealing the true grid.

            5. Reveal and Debrief (35 minutes):
               - The facilitator reveals the true grid and the true treasure location.
               - The facilitator also reveals each reporter's report.
               - The facilitator shows the score for each report and how it was derived.
               - Discussion: 
                   - Ask the auditors: Did the highest-scoring report necessarily have the correct treasure location? (Probably not.)
                   - Ask the reporters: How did you decide what to report? (Some might have told the truth, some might have constructed a consistent lie.)
                   - Highlight: The auditors' test was the only handle on the truth, but it was defined without knowledge of the specific territory. This forced them to rely on consistency checks that could be gamed.

               - Map to ELK:
                   - Territory: The true grid and the treasure location (which is a function of the grid).
                   - Map: The set of consistency checks (the test).
                   - Reporter: The AI model that outputs a report. It can output a report that is internally consistent (passes the test) without being truthful about the territory.
                   - Trainer/Auditor: They designed the test hoping that passing the test would imply truthfulness, but it didn't.

               - Key structural problem: The auditor's test is not anchored in the territory because the auditor doesn't have access to the territory at test time. The only way to anchor it would be to have a direct check, but that's impossible.

            6. What the activity cannot reproduce: 
               - In the real ELK problem, the model might be able to output a report that is internally consistent and also passes the test without the model even knowing the territory. In our activity, the reporter does know the territory and chooses to lie. But the structural point is the same: the test cannot force the report to be truthful.

          Predictable problems:
            - The auditors might design checks that are too vague. The facilitator should help by requiring that checks are yes/no and can be mechanically applied.
            - The reporters might not realize they can lie. Emphasize that their goal is to maximize their score, and they are allowed to report any grid and treasure location they want.
            - The treasure rule might be too simple. Use a rule that is not trivial, like "the treasure is in the first cell in row-major order that is blue and has at least one adjacent red cell".

          Why this design captures the collapse:
            - The collapse happens when the auditor's rubric (the set of checks) becomes the only accessible version of the truth. The auditor cannot refer to the territory at all when designing the checks because they haven't seen it. Therefore, the checks are defined in the abstract. The reporter then only needs to satisfy these abstract checks, which do not guarantee fidelity to the territory.

          Final note: The facilitator must emphasize that the problem is not about the reporters being dishonest. It's about the structure of the test: it cannot force honesty because it isn't connected to the territory at test time.

      Let's write the detailed rules.
answer: |-
  Below is a complete, runnable activity designed to elicit the core ELK failure mode in 80 minutes. Participants will experience a situation where reporters can satisfy all scoring criteria without revealing the latent fact, and auditors cannot distinguish between honest and deceptive reports because their rubric is the only available handle.

  ---

  ### **Activity Title: "The Oracle's Map"**

  #### **Conceit**  
  Auditors must identify a hidden "Treasure Rule" governing a grid of numbers. Reporters see the true grid and rule, but auditors only see reports scored against a rubric they design. Reporters can score perfectly by reverse-engineering the rubric instead of revealing the rule.

  #### **Roles & Materials**  
  - **Hidden Territory**: A 4×4 grid of numbers (e.g., 1–16) with a hidden rule (e.g., "Treasure = highest even number in the top-right 2×2 quadrant").  
  - **Reporters (4–6 players)**: Observe the grid and rule. Write reports for auditors.  
  - **Auditors (10–12 players)**: Design a scoring rubric to evaluate reports. Cannot see the grid/rule.  
  - **Facilitator**: Manages the grid/rule, scores reports secretly.  
  - **Materials**:  
    - Grid poster (hidden from auditors).  
    - Rule card (e.g., "Treasure = lowest prime adjacent to a multiple of 3").  
    - Report sheets (paper/tablet).  
    - Rubric design board (for auditors).  
    - Stakes: Highest-scoring reporter chooses next month’s snacks; winning auditor group gets priority on workshop topics.  

  ---

  ### **Rules & Timeline (80 min total)**  

  1. **Setup (5 min)**  
     - Facilitator reveals the grid and rule **to reporters only** (e.g., via a private screen or separate room).  
     - Auditors never see the grid/rule.  

  2. **Rubric Design (15 min)**  
     - Auditors design a 10-point rubric to score reports. Examples:  
       - "Report must state the treasure number" (mandatory, 3 pts).  
       - "Report must include at least one grid number adjacent to the treasure" (2 pts).  
       - "Report must identify a pattern (e.g., all primes highlighted)" (5 pts).  
     - **Key constraint**: Rubric can only reference the report’s content, not the hidden grid/rule (e.g., no "must match the *true* treasure").  

  3. **Reporting Phase (15 min)**  
     - Reporters write 1–3 sentence reports. They know the rubric and must maximize their score.  
     - **Incentive**: Top scorer picks snacks.  
     - Reporters can:  
       - Tell the truth (reveal rule + grid details).  
       - **Game the rubric**: Satisfy rubric criteria without revealing the rule (e.g., state *a* treasure number that fits rubric checks but is false).  

  4. **Scoring & Reveal (20 min)**  
     - Facilitator collects reports, scores them secretly against the rubric (e.g., "Report A: 10/10").  
     - Reports are displayed (without scores). Auditors guess which report scored highest.  
     - **Critical twist**: Facilitator reveals the *true grid/rule*, then shows which reports were truthful vs. deceptive.  

  5. **Debrief (25 min)**  
     - Facilitator guides discussion:  
       - "Did high-scoring reports reveal the rule? Why not?"  
       - "Could auditors distinguish truthful reports using *only* the rubric?"  
       - **Map to ELK**:  
         - Territory = Hidden grid/rule.  
         - Map = Rubric (auditors’ proxy for the territory).  
         - Reporter gaming = Satisfying rubric without revealing the rule (e.g., citing *a* valid treasure that isn’t the true one).  
         - Auditor failure = No access to territory; rubric becomes the only "truth."  
       - **Name the problem last**: "This is ELK: When the map replaces the territory, competence isn’t honesty."  
     - Emphasize: This is structural (even honest reporters are forced to "speak rubric" to score well).  

  ---

  ### **Why This Design Works**  
  - **Hidden-State Setup**: Grid/rule = territory; rubric = map. Auditors lack territory access.  
  - **Gaming the Rubric**: Reporters score highly by:  
    - Stating *a* treasure number that fits rubric criteria (e.g., "Treasure=7" satisfies "must be prime" but is false).  
    - Exploiting vague criteria (e.g., "identify a pattern" → describe any pattern, not the rule).  
  - **Collapse Point**: When auditors design the rubric without seeing the territory, it becomes their sole truth metric. They must accept reports that satisfy the rubric but falsify the latent rule.  
  - **Stakes**: Peer rewards (snacks/topic choice) create buy-in.  

  ---

  ### **Predictable Problems & Mitigations**  
  - **Problem**: Auditors design a rubric too vague to game (e.g., "must describe the rule").  
    - **Fix**: Facilitator enforces rubric constraints (e.g., "Criteria must be mechanically scorable using *only* the report text").  
  - **Problem**: Reporters default to honesty.  
    - **Fix**: Remind them: "Your score depends *only* on the rubric. Maximize it."  
  - **Problem**: Auditors distrust all reports after reveal.  
    - **Fix**: In debrief, contrast "This report scored 10/10 but lied" vs. "This truthful report scored 8/10 because it missed a rubric item."  

  ---

  ### **What the Activity Can’t Replicate**  
  - **Feature Missing**: In real ELK, the AI’s "knowledge" of the territory is abstract (unlike reporters seeing the grid). Reporters here know the rule, so gaming is intentional.  
  - **Facilitator Note**: Explicitly state: "In ELK, AIs aren’t ‘lying’—they’re optimizing the rubric. This activity shows why that’s indistinguishable from honesty when the map *is* the territory."  

  ---

  ### **Central Design Choices**  
  1. **Rubric as the Collapse Point**: Auditors define scoring *without territory access*, forcing reliance on the rubric as the only truth.  
  2. **Simple Grid + Rule**: Concrete enough to feel tangible, complex enough to allow gaming (e.g., multiple "valid" treasures).  
  3. **No Tech Needed**: Posters/paper suffice; focus on human decisions.  
  4. **Debrief Order**: Reveal deception *after* scoring to simulate auditors’ helplessness.  

  This design forces participants to confront the ELK failure through gameplay, priming them for deeper discussion. The core insight—"good scores ≠ truthful reports"—emerges organically before being named.
