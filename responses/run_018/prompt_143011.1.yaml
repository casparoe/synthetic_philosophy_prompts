prompt: |-
  You’re acting as a philosopher of institutions with some background in Burkean conservatism and epistemology — take your time, think step by step, and maybe do a quick mental brainstorm before you dive in. I was chatting with friends after a course on political theory and got stuck on something that feels like a hidden contradiction in how we actually govern.

  There’s this widespread practice in regulatory and land-use law — I’ve seen it especially in environmental agencies and zoning boards — where old exemptions, easements, or grandfathered structures stay on the books almost automatically. If you want to remove one, the burdern is on you to reconstruct exactly why it was originally put there and prove no hidden dependency still relies on it. But if you want to add a new rule, the burdern flips: you have to justify it from scratch and show it won’t cause unintended harm. So removal demands historical reconstruction, while creation demands predictive justification. People often defend the first half with something like Chesterton’s fence — don’t tear down a fence unless you know why it was built — but they never apply that same logic symetrically to new fences being built. I’m wondering what view of institutional knowledge, collective memory, or intergenerational obligation this asymetry actually presupposes.

  Reconstruct the implicit theory behind the practice: does it commit us to a Burkean idea that prescription carries epistemic weight distributed across generations, or is it smuggling in a kind of present-skepticism about reformers’ reasoning that doesn’t apply to defenders of the status quo? Say whether the practice is philosophically underdetermined — could a rationalist or progressive accept the same institutional design for completely different reasons? And tell me what would have to change in regulatory procedure if we replaced the presupposed view with a straightforwardly probabilistic or cost-benefit framework. Please also say how confident you are in each part of your answer, and specifically flag the point you’re least sure about — probably where I’m stretching the Chesterton analogy into administrative law.
