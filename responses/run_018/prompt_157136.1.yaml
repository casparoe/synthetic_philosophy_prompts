  maya says jake is missing the double movement of faith. she argues abraham only becomes the knight of faith if he simultaneously believes isaac will be spared through the absurd. without that second belief - that god will restore what was sacrificed - hes just a murderer, not a knight. she thinks this is the key: modern fanatics who claim god told them to hurt people dont have this second movement, so theyre not actually like abraham at all.

