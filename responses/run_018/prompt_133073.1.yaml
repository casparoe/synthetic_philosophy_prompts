prompt: |-
  I'm drafting a novel where a village stops recogntizing one of its members — not exile, not violence, just a total withdrawal of reciprocal acknowledgment, like she's become a ghost they all agree to treat as non-person. That got me into Ubuntu, but I'm pushing it further than the usual "I am because we are" slogan. My position: personhood isn't an inner kernel that gets hurt when relations break; it's constituted entirely by active, reciprical recognition inside a living web, and if that web genuinely withdraws — structurally, not just emotionally — then personhood doesn't merely suffer, it ontologically collapses. There's no hidden self left over.

  I'm not a philospher, I'm a writer, and I need this stress-tested before I build a plot around it. What would count against this strong relational view? Not the lazy "what about hermits" objection — I've already absorded that. I want the real defeaters: empirical cases where people persist in clear personhood despite total relational rupture; internal contradictions when you make reciprocity a necessary condition; edge results in anthropology or cognitive science about self-modeling that don't need an audience; rival accounts (narrative continuity, embodied agency, maybe something from the no-self side) that explain the same phenomena without letting personhood dissolve.

  Rank them: fatal vs awkward vs cosmetic. For each, say whether defenders of this Ubuntu-style view would concede it as a real problem or dismiss it. And be honest — has the position been qualified into unfalsifiability, with escape clauses like "the web is never fully broken" or "there's always some minimal recognition"? If so, is that insulation a feature or a failure for a claim about actual people?

  Wrap the core of your answer in a JSON array of objects, each with these fields: "defeater" (string, what it is), "domain" (string: intuition / empirical_case / internal_tension / rival_framework), "severity" (string: fatal / awkward / cosmetic), "defender_concedes" (string: true / false / partly), "notes" (string, brief explanation). One object per major defeater. Keep it casual, like you're advising an over-caffinated novelist who just needs to know if her premise holds water.
reasoning: |-
  Okay, the user is crafting a novel where a character becomes a "non-person" through collective non-recognition, and wants to stress-test the philosophical underpinnings. They're pushing Ubuntu's relational personhood to an extreme: no recognition = no ontological personhood. 

  Hmm, they're clearly a thoughtful writer - not just handwaving philosophy but engaging deeply. The "hermit" dismissal shows they've done homework. What they really need are steel-manned counterarguments that could actually threaten their premise, ranked by lethality to their plot. 

  First gut-check: their position feels radical but coherent. The real test is whether it survives edge cases. Let me mentally scan philosophy/anthropology... 

  Ah! Fatal flaw might be infant cognition - babies develop self-awareness before social feedback kicks in. That's empirical ammo against "no hidden self." Also, locked-in syndrome patients - their personhood persists despite zero reciprocal agency. 

  Internal tension: if personhood requires reciprocity, does that mean both parties must be "persons" already? Chicken-and-egg problem. And what about recognition from non-humans? Dogs treat us as persons - does that count? 

  Rival frameworks... Narrative self-theory (Dennett) suggests personhood is a story we tell ourselves. Embodied cognition folks would say our physical presence grounds identity regardless of social validation. 

  *scribbles mental list* Right, need to flag which objections Ubuntu defenders would sweat over versus shrug off. Like, they'd probably dismiss animal recognition but sweat the infant studies. And oh god, the "it's never fully broken" dodge - is that profound or cop-out? 

  User's sharp - they'll smell if I'm soft-pedaling. Must be brutally honest about unfalsifiability risks. Their novel's integrity depends on whether this idea holds under pressure. 

  *structures JSON* Fatal: locked-in syndrome. Awkward: pre-social infants. Cosmetic: animal recognition. Defender concessions vary... There. This should give them the stress-test they crave without philosophy-jargon poisoning.
