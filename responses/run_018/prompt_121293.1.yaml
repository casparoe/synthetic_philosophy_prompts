  (5) i'm an intervetionist about causation (woodward-style): x causes y iff there's a possible intervention on x that changes y.
  (6) phenomenal consciousness — like pain — actually causes withdrawal, not just correlates.
  (7) overdetermination is metaphysically incoherent; nature doesn't do redundant sufficient causes.
  (8) the explanatory gap is epistemic, not ontological, so physicalism about ontology is untouched.

  my worry is that (2) pulls against (3) and (4) — if i accept kim's argument as valid, can i really reject completeness only locally without ad hocness? and (5) with (6) and (1) looks bad because if mental properties supervienence on neural ones, you can't intervene on pain without also hitting c-fibers, so mental causation collapses back into physical. also (4) sounds like it's smuggling in overdetermination despite (7), though maybe that's only apparent.

