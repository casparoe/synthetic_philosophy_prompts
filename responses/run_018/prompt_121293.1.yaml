  **Key Takeaways:**
  1.  **You can keep (6) intact.** Phenomenal causation is salvageable, especially with the suggested revision to interventionism.
  2.  **The core threat is (2) + (3).** Accepting Kim's validity while restricting completeness rejection is unstable. Weakening your endorsement of Kim (acknowledging potential unsoundness due to flawed premises like causal competition) is cheaper than developing a new criterion for localized completeness failure.
  3.  **Interventionism needs refinement.** Integrating it with realization/supervenience is crucial to avoid collapsing M into P. The "difference-making" approach for functional properties is a promising, low-cost fix.
  4.  **Structural inheritance needs clarity.** Ensure "constraint" is explicitly defined as non-redundant configuration, not parallel causation, to satisfy (7).
  5.  **(8) is fine.** It's orthogonal to the causation issues.
