        "cheapest_fix": "Clarify (4): Explicitly define 'constraint' as a metaphysically novel (but non-redundant) causal relation (e.g., formal causation, dynamical selection) that configures physical powers without duplicating sufficiency. Cost: Low (explicative, not revisionary).",
