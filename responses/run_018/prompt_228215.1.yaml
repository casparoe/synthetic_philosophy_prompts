prompt: |-
  I'm a third-year philosophy undergraduate taking a course on situated cognition (the "4E" literature: embodied, embedded, enactive, extended). For the revision week, I've volunteered to make a handout for my seminar group: a decision tree that tells a student which position on the extended mind thesis they actually hold, based on what they think rather than which label they find appealing. I'd like you to write the tree.

  Here is what I need:

  The tree should start from a shared minimal commitment that everyone in the seminar accepts (roughly: some broadly functionalist story about what makes something a memory or a belief is on the table, and the Otto-and-his-notebook case is at least intelligible as a challenge). From there, each branch node should be a single diagnostic question on which the standard positions genuinely come apart, phrased so that someone can answer it without knowing which position it leads to. Candidates for splitting questions I have in mind include: whether an external resource must replicate the functional profile of an internal one to count as cognitive (or whether playing a complementary, transformative role is enough); whether there is a "mark of the cognitive" (e.g. non-derived content) that external vehicles necessarily lack; whether inferring constitution from causal coupling is always a fallacy or sometimes legitimate; whether conditions like constant availability, automatic endorsement, and fluent access do real work or are ad hoc; and whether the skull-and-skin boundary has explanatory significance or is just where our intuitions happen to stop. Please use whichever of these earn their place, add others if the tree needs them, and order them so that the most fundamental disagreements come first.

  The leaves should be named positions, and I want at least: first-wave extended mind built on the parity principle; second-wave "complementarity" externalism; the embedded-but-internalist view on which external resources are merely causal scaffolds for a brain-bound cognitive process; an enactivist reading on which cognition is constituted by the organism–environment dynamic itself; and a robust internalism that denies even the embedded concession. Each leaf should carry one sentence stating the position's most awkward commitment (for example, the first-wave view's exposure to cognitive bloat — my phone's contact list becoming part of my memory).

  Two further requests. First, build the tree from the logical space rather than from the list of names: lay out the questions and the combinations of answers they permit, then locate the actual positions in that space, and for any unoccupied combination, add a one-line diagnosis of whether the gap exists because the position is incoherent, unattractive, or simply unexplored. Second, flag explicitly any pair of leaves your tree cannot cleanly separate — I suspect embedded internalism and the enactivist view may collapse into each other at the level of what my classmates will actually answer, and if so I'd rather the handout said so than pretend otherwise.

  Seven to nine branch questions and five or six leaves feels right for a two-page handout. Please present it as a numbered flowchart (if YES go to node n, if NO go to node m), with the diagnostic questions worded as plainly as possible — my seminar group includes people who haven't done the reading, and the tree will be useless if answering a question already requires knowing the jargon it sorts you into.
reasoning: |-
  Okay, the user is a third-year philosophy undergrad creating a handout on the extended mind thesis for their seminar group. They need a decision tree that starts from a shared minimal commitment and branches out through diagnostic questions to identify different positions. 

  First, I need to understand their core requirements. The tree must:
  - Begin with a baseline everyone accepts (functionalist approach to cognition + intelligibility of Otto's notebook case)
  - Use clear, non-jargon questions that split genuine disagreements
  - Cover major positions: first-wave extended mind, complementarity view, embedded internalism, enactivism, robust internalism
  - Include each position's awkward commitment
  - Map logical space first, then locate positions
  - Flag any indistinguishable positions

  Hmm... the tricky parts are:
  - Avoiding textbook labels in questions (students might not know terms like "parity principle")
  - Ensuring questions are answerable based on intuition alone
  - Preventing embedded internalism and enactivism from collapsing (must acknowledge if they do)
  - Handling unoccupied logical spaces

  For the shared starting point, I'll use: "Do you think Otto genuinely remembers where the museum is when using his notebook?" This anchors to the famous thought experiment while being accessible. 

  The branch questions should prioritize fundamental splits. First question must be the deepest divide: whether external tools can *be* cognition or just *support* it. That separates externalists from internalists immediately. 

  Next forks:
  - For externalists: whether function must mirror internal processes (splits parity vs complementarity)
  - For internalists: whether environment plays a constitutive role (splits embedded vs enactivist)
  - Then probe specific pain points like cognitive bloat or mark of the cognitive

  For positions:
  - First-wave extended mind: awkward commitment = cognitive bloat (phone contacts = your memory)
  - Complementarity: awkwardness = potentially embracing non-biological cognition
  - Embedded internalism: awkwardness = hard to explain why Otto's case isn't extended
  - Enactivism: awkwardness = vague boundaries of cognition
  - Robust internalism: awkwardness = dismissing Otto's case entirely

  Ah, and the embedded/enactivist collapse risk—must add explicit note that they might converge in practice. Also need to mark where logical gaps exist (like rejecting parity but requiring functional replication).

  Final structure should fit 2 pages: ~8 questions leading to 5 leaves. Flowchart style with "If YES → Q3, If NO → Q4" for clarity. Wording each question like a plain English intuition pump ("Must external tools work exactly like brains?") rather than academic phrasing.
answer: |-
  Here’s a decision tree designed to clarify positions on the extended mind thesis, starting from shared seminar assumptions (functionalist approach, Otto’s notebook as intelligible challenge). Questions avoid jargon, focus on intuitions, and split key disagreements. Positions are mapped to logical space, with awkward commitments and unresolved overlaps noted.

  ---

  ### **Shared Starting Point**  
  You accept:  
  - Beliefs/memories are defined by functional roles (what they *do*, not their physical makeup).  
  - Otto’s notebook (which he uses fluently to "recall" info) *might* count as part of his mind — it’s not obviously nonsense.  

  **Begin at Question 1:**  

  1. **Can external tools (like Otto’s notebook) ever *be* part of a cognitive process (e.g., remembering), not just *support* it?**  
     - **YES** → Go to Q2 (Externalist-leaning)  
     - **NO** → Go to Q5 (Internalist-leaning)  

  2. **Must the external tool work *exactly like* a brain process (e.g., storing/retrieving info identically)?**  
     - **YES** → **First-Wave Extended Mind (Parity Principle)**  
       - *Awkward commitment:* Your phone’s contact list literally *is* your memory (risk of "cognitive bloat").  
     - **NO** → Go to Q3  

  3. **Is the *key role* of external tools to transform cognition (e.g., changing how we think), not just replicate brain functions?**  
     - **YES** → **Second-Wave Extended Mind (Complementarity)**  
       - *Awkward commitment:* Cognition could extend to non-biological systems (e.g., AI) that alter reasoning.  
     - **NO** → *Unoccupied position*  
       - *Diagnosis:* Unattractive — rejects parity *and* complementarity, leaving no clear role for extension.  

  4. **Does cognition *fundamentally* depend on the brain-environment interaction itself?**  
     - **YES** → **Enactivist View (Cognition as Embodied Dynamic)**  
       - *Awkward commitment:* No clear boundary — cognition "is" the whole organism-environment loop (e.g., walking *is* thinking).  
     - **NO** → Go to Q7  

  5. **Do external tools *dramatically reshape* how cognition works (e.g., enabling new kinds of thought)?**  
     - **YES** → **Embedded Internalism**  
       - *Awkward commitment:* Otto’s notebook is *causally crucial* but mysteriously not part of his mind.  
     - **NO** → **Robust Internalism**  
       - *Awkward commitment:* Otto is just "parasitically" using a tool — no different from reading a sign.  

  6. **Is the brain-environment link *so tight* that the environment *constitutes* cognition?**  
     - **YES** → *See Enactivism (Q4)*  
     - **NO** → *See Embedded Internalism (Q5-YES)*  

  7. **Does *constant access* (e.g., Otto always having his notebook) matter for extension?**  
     - **YES** → *Unoccupied position*  
       - *Diagnosis:* Incoherent — if function alone defines cognition (starting assumption), why demand constant access?  
     - **NO** → *See Complementarity (Q3-YES)*  

  ---

  ### **Key Overlaps & Notes**  
  - **Embedded Internalism (Q5-YES) vs. Enactivism (Q4-YES):** These *may collapse* in practice. Enactivists emphasize dynamic coupling; embedded internalists allow deep causal dependence but deny constitution. If you see the brain-environment link as *inseparable*, you’ll lean enactivist. If tools are "scaffolds" for a brain-bound process, you’re embedded.  
  - **Unoccupied Branches:** Positions like "extension requires functional replication *and* constant access" (Q7-YES) are unstable — they add arbitrary constraints to functionalism.  
  - **Missing Question?** "Mark of the cognitive" (e.g., non-derived content) is omitted — functionalism (our baseline) already rejects intrinsic marks.  

  ### **Tree Structure Summary**  
  ```
  Q1 → YES → Q2 → YES → Parity Principle  
            → NO → Q3 → YES → Complementarity  
                     → NO → (Gap)  
            Q1 → NO → Q5 → YES → Embedded Internalism  
                     → NO → Robust Internalism  
            Embedded branch (Q5-YES) → Can link to Enactivism (Q4)  
            Enactivism (Q4) → Standalone via Q5  
  ```  

  **Leaf Positions:**  
  1. **First-Wave Extended Mind** (Parity)  
  2. **Complementarity Extended Mind**  
  3. **Embedded Internalism**  
  4. **Enactivism**  
  5. **Robust Internalism**  

  ---

  ### **How to Use**  
  1. Start at Q1. Answer based on your intuition (e.g., "Is Otto’s notebook *part of his memory*?").  
  2. Follow branches — don’t peek at position names!  
  3. At a leaf, read the "awkward commitment" — if it appalls you, backtrack to check answers.  

  This covers core debates (parity vs. complementarity, coupling-constitution fallacy, bloat, boundaries) in 7 questions → 5 positions + 2 gaps. Fits 2 pages if formatted as a flowchart.
