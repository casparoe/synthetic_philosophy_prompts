  The modal point (c) feels crucial here. Even if necessary existence is a property, that doesn't mean it's instantiated unless you buy into the modal framework. This is where the friend's dismissal might actually engage with Gödel. The user mentioned their friend avoided discussing axioms—this is probably the card they were playing. But is it fair? Gödel's argument hinges on whether "necessary existence" can be coherently treated as a positive property. If the friend rejects that axiom, they're not engaging; they're just denying a premise. 

