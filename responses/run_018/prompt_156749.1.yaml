answer: |-
  Here’s a streamlined, practical 6-month workshop proposal addressing your core idea, pitched for a nonprofit grantmaker:

  **Project Title:** Untangling Access: Can Global Availability Exist Without Subjective Tagging?  
  **Duration:** 6 Months  
  **Deliverable:** A focused workshop report & conceptual framework  

  ### 1. The Core Question
  *“Can we design a cognitive architecture where information is globally available (‘broadcast’) to all processing modules, but lacks any mechanism binding that information phenomenally to a subject’s point of view? If achievable, would this demonstrate genuine access consciousness without phenomenal consciousness, or reveal that Global Workspace Theory (GWT) never truly separated access from the phenomenal in the first place?”*

  ### 2. The Problem: A Hidden Assumption in GWT
  *   GWT explains conscious *access* (information availability for report/control) via a "global broadcast" to specialized modules.
  *   **The Suspect Move:** We suspect GWT explanations subtly rely on an unstated "phenomenal tagging" – the automatic binding of globally broadcast information to a *subjective viewpoint* ("what it’s like" for *me*). This tagging is often smuggled in, not rigorously separated from the broadcast mechanism itself.
  *   **Why Current Debates Miss This:** The Block (phenomenal focus) vs. Dehaene (access focus) debates largely **assume broadcasting and subjective binding come packaged together**. They argue *about the package*, not whether the components can be isolated. This leaves a critical conceptual gap: *Is global availability inherently tied to subjective perspective, or is that an add-on?*

  ### 3. Our Approach: Conceptual Surgery + Case Study
  We’ll rigorously separate "broadcasting" (functional availability) from "tagging" (subjective binding) to test GWT’s core claim:
  1.  **Conceptual Analysis:** Precisely define "global availability" (functional access criteria) vs. "phenomenal tagging" (minimal subjective binding). Map how GWT descriptions conflate them.
  2.  **Constructed Case Study:** Design a detailed functional specification for an artificial system/cognitive model where:
      *   Information *is* globally available to all modules (fulfilling GWT's access criteria).
      *   There is *no* architectural mechanism assigning this information to *any* "point of view" or minimal subjective state.
  3.  **Analysis:** Critically evaluate:
      *   Does this model genuinely satisfy the definition of *access consciousness*?
      *   Does its lack of phenomenal tagging mean it lacks *phenomenal consciousness* by definition?
      *   **Conclusion:** Does this model show access *can* exist without the phenomenal? Or does its inability to function coherently (or its lack of "consciousness") prove that GWT *always* depended on smuggled-in phenomenal tagging?

  ### 4. Why This Approach? (Better than Neuroscience or Pure Philosophy)
  *   **Neuroscience Limitation:** Brains likely have broadcasting and tagging intertwined. Isolating them experimentally is currently impossible. We need conceptual clarity *first* to know what neural signatures might distinguish them.
  *   **Pure Philosophy Limitation:** Intuition-pumping ("Can you imagine access without phenomenology?") hits stalemates. Constructing a *functional model* forces concrete definitions and reveals hidden architectural dependencies.
  *   **Our Advantage:** This **targeted conceptual engineering with a functional spec** directly probes the architectural assumptions within GWT itself. It's a necessary step *before* productive empirical work can be designed.

  ### 5. Defining Success & Failure
  *   **Success Looks Like:**
      *   A clear, defensible specification of a "tagging-free global workspace."
      *   A strong argument showing either: (a) This model *does* represent access-without-phenomenal, challenging GWT's completeness; OR (b) The model is incoherent/impossible, proving phenomenal tagging is essential to GWT's concept of access.
      *   A refined understanding of the minimal architectural requirements for access vs. phenomenal consciousness.
  *   **Failure Looks Like:**
      *   Inability to define "global availability" rigorously enough without implicitly relying on subjective tagging.
      *   The constructed model is deemed irrelevant to actual access consciousness (e.g., it's just "unconscious broadcasting").
      *   The analysis remains inconclusive, leaving the core ambiguity unresolved.

  ### 6. Feasibility & The Hard Problem
  *   **Why 6 Months is Enough:** This is a tightly scoped *conceptual* project. We're not solving the Hard Problem (how/why phenomenality arises). We're testing a specific **architectural claim within GWT** about functional access. The core work – definition, model specification, argumentation – is feasible in 6 months with focused workshop collaboration.
  *   **Avoiding the Hard Problem Collapse:** We explicitly *bracket* the question of *how* phenomenal tagging arises (the Hard Problem). We focus solely on whether its *functional role* is separable from broadcasting *within the GWT framework*. Success or failure provides clarity *about the theory*, not a solution to the ultimate mystery.
  *   **Honest Limitation:** We won't *prove* phenomenal consciousness exists or how it works. We *will* clarify whether GWT's explanation of access consciousness stands independently of phenomenal assumptions.

  **In short:** This workshop cuts to a specific, overlooked knot in GWT. By rigorously separating global availability from subjective tagging via conceptual analysis and model-building, we'll deliver clarity on whether access consciousness can be explained independently, or if GWT's account has always relied on a hidden phenomenal ingredient. This is practical theory-work needed to move debates and future research forward.
