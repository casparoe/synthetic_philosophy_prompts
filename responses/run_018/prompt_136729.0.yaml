prompt: |-
  hey, i'm a software engineer with basically no philosphy background, but i'm putting together a dataset on conceptual stuff and i want the full spec before i read any more theories. what would a theory of moral status for digital minds actually have to get right?

  write the desiderata: the cases it must handle, the distinctions it can't collapse (like having status vs how much status, or temporary suspension vs permanent deletion), and the results from biology or neuroscience it can't just contradict. include the reasoning behind each one.

  specifically, it needs to deal with distributed minds running across server nodes where hardware gets replaced mid-thought, self-modifying agents that change their own values, and weirder architectures like minds that can fork into two copies on seperate nodes and then merge back later -- think git branches but for consciousness. does the forked copy get full status? does merging reduce or combine status? flag which of these are hard requirements and which are just camp preferences (substrate-independence, continuity of identity, allowing splits, etc).

  also say if any subset of these requirements is jointly unsatisfiable -- for example, if requiring both perfect identity continuity through forks and equal moral weight for all copies can't both hold. that's the part i care most about.

  then briefly, how do the main existing contenders do against this list? don't need a full scorecard, just a quick read. and tell me which single requirement does the most damage to the popular theories.

  no citations or reading lists please -- i just want the criteria. maybe include a typo or two since i'm writing casual.
