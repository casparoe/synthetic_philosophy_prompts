  Okay, let me start by unpacking the user's query. They're wrestling with whether virtue ethics can handle situationist critiques without resorting to hand-waving. They want a clear list of what any post-situationist virtue theory must address. 

  First, I need to recall the situationist challenge. Situationism in psychology, based on experiments like Milgram and Darley-Batson, shows that people's behavior is more influenced by situational factors than stable character traits. This directly challenges virtue ethics, which relies on consistent virtues. 

  The user is asking for desiderata—specific constraints that the theory must satisfy. They mention behavioral patterns, cross-situational inconsistencies, trait vs. state distinctions, and personality psychology findings like low cross-situational correlations. Each of these must be justified as a real constraint, not just wishful thinking. 

  Breaking it down: Desideratum 1 is explaining behavioral consistency. Situationists argue that observed consistency is due to similar situations, not traits. Any virtue theory must account for why behavior can seem consistent without ignoring situational variability. 

  Desideratum 2 addresses cross-situational inconsistency. The Hartshorne and May studies showed low correlations in honesty across different contexts. A theory can't dismiss this; it must explain inconsistency without abandoning traits. 

  Desideratum 3 is the trait-state distinction. Traits are supposed to be stable dispositions, but situationists point to state-dependent behaviors. The theory needs a coherent way to distinguish traits from temporary states. 

  Desideratum 4 covers personality psychology's empirical results, like low cross-situational correlations. Denying these isn't an option; the theory must incorporate them. 

  Desideratum 5 is normative action-guidance. Virtue ethics should offer practical advice, but if virtues are context-dependent, how can they guide behavior broadly? 

  Desideratum 6 is predictive accuracy. If virtues are too flexible, they lose predictive power, making them less useful. 

  Now, identifying tensions. Predictive accuracy and normative guidance might conflict. If virtues are too situation-specific, guidance becomes too vague. Also, empirical constraints versus practical relevance: fitting the data might make virtues too fragmented for ethical use. 

  Next, evaluating two fixes. Trait-activation profiles (TAPs) suggest virtues are context-sensitive but global. This addresses inconsistency by linking traits to specific cues but risks making virtues too narrow. Local situational virtues (LSVs) abandon global traits. This fits empirical data better but might lose the unifying aspect of character, making action-guidance harder. 

  The user wants logic, not reading lists. They might be a philosopher or grad student looking for a structured analysis to inform their research. Their deeper need is likely a coherent framework that respects empirical findings while preserving virtue ethics' core. They might fear that virtue ethics can't be salvaged without being ad hoc. 

  I should ensure each point clearly shows why it's a constraint. For example, low cross-situational correlations are well-documented, so denying them isn't credible. Highlighting trade-offs, like between prediction and guidance, is crucial. Scoring the fixes honestly, noting their strengths and weaknesses, helps the user weigh options. 

  Need to avoid jargon where possible. Make sure the distinctions between the fixes are clear. Emphasize that TAPs try to save global traits but with conditions, while LSVs give up on global traits entirely. The user might be looking for which approach has more promise or if a middle path exists. 

  Also, the user mentioned not wanting hand-waving, so the response must confront the challenges directly. Acknowledge that both fixes have problems but might be starting points. Conclude by noting the tension between empirical adequacy and normative usefulness, which is central to the debate.
answer: |-
  Here's the full specification for any adequate post-situationist virtue theory, breaking down the hard constraints, their justification, key tensions, and scoring two major fixes:

  **Core Desiderata (The Non-Negotiables):**

  1.  **Explain Observed Behavioral (In)Consistency:** Must account for *both*:
      *   *Modest cross-situational consistency:* People *do* exhibit somewhat predictable behavioral tendencies over time within broadly similar domains (e.g., someone generally helpful *in familiar contexts*).
      *   *Significant cross-situational inconsistency:* Behavior varies dramatically across seemingly similar situations (e.g., helping a stranger in low-stakes vs. high-stakes/time-pressure contexts - Darley & Batson Good Samaritan experiment).
      *   **Why Constraint?** Empirical reality. Denying inconsistency ignores decades of robust, replicated social psychology (e.g., Milgram, Stanford Prison, Hartshorne & May honesty studies). Denying *any* consistency ignores introspective experience, longitudinal studies, and the very concept of reputation. Wishful thinking is ignoring one side.

  2.  **Integrate Low Cross-Situational Correlations (CSCs):** Must accept that statistically measured correlations of specific behaviors across *different types* of situations (e.g., honesty in classroom test vs. returning lost wallet vs. reporting income) are typically *low* (often r = 0.2-0.3).
      *   **Why Constraint?** Hard empirical fact from personality psychology. These low CSCs directly challenge the notion of monolithic, domain-general virtues that manifest uniformly. Denying this is rejecting data, not theory.

  3.  **Maintain a Coherent Trait-State Distinction:** Must preserve a meaningful difference between:
      *   *Trait:* A relatively enduring dispositional *tendency* to perceive, feel, and act in certain ways *in relevant situations*.
      *   *State:* The specific thoughts, feelings, or behaviors *in a particular moment*, heavily influenced by the immediate situation.
      *   **Why Constraint?** The core of virtue ethics relies on stable character (trait) as the locus of evaluation and cultivation. Collapsing traits entirely into states or situations eliminates "character" as a meaningful ethical concept. Wishful thinking would be defining "trait" so vaguely it becomes unfalsifiable.

  4.  **Accommodate Powerful Situational Effects:** Must explain why seemingly minor situational factors (mood, ambient noise, perceived authority, anonymity, time pressure) often override dispositional tendencies.
      *   **Why Constraint?** Overwhelming empirical evidence. Situations demonstrably dominate behavior in many contexts. A theory ignoring this is empirically bankrupt. Wishful thinking is downplaying situation strength as "not a *real* test of virtue."

  5.  **Provide Normative Action-Guidance:** Must offer practical, non-trivial guidance for how to *become* virtuous and how to *act* virtuously in specific situations. Cannot devolve into "it depends, figure it out."
      *   **Why Constraint?** Core function of ethics. Virtue ethics promises guidance through character development and phronesis. Losing this renders it practically useless. Wishful thinking is offering vague platitudes ("be courageous!") that ignore situational complexity.

  6.  **Retain Predictive Power (Within Limits):** Must allow for *some* degree of reliable prediction about how a person *with cultivated virtue X* will *likely* behave *in situations relevant to X*, acknowledging significant uncertainty.
      *   **Why Constraint?** Necessary for virtue to be a meaningful psychological construct and for ethical evaluation/praise/blame. If virtues predict nothing, they explain nothing. Wishful thinking is claiming predictive power vastly exceeding the evidence.

  **Key Tensions (The Squeeze):**

  *   **Predictive Accuracy vs. Normative Action-Guidance:** This is the core tension.
      *   *Problem:* High predictive accuracy seems to require highly situation-specific dispositions (matching the low CSCs). But highly specific dispositions ("office-honesty," "stranger-helpfulness-when-not-in-a-hurry") provide fragmented, complex, and unwieldy guidance for life. Broad virtues ("Honesty," "Compassion") offer clearer guidance but predict behavior poorly across diverse situations.
  *   **Empirical Adequacy vs. Practical Relevance:** Fully accommodating the data (low CSCs, situational dominance) risks making "virtues" so fine-grained and context-bound they lose their unifying, identity-forming role central to virtue ethics. A theory perfectly fitting the data might be useless for ethics.
  *   **Trait Stability vs. Situational Plasticity:** How can traits be "enduring" if behavior is so situationally variable? The theory must define "stability" in a way that survives constant situational fluctuation.

  **Evaluating Two Fixes:**

  1.  **Trait-Activation Profiles (TAPs): Saves Global Virtues**
      *   **Core Idea:** Global virtues (Courage, Honesty) exist *as latent dispositions*, but they only manifest ("activate") in *specific situations* that match their "profile" – containing the right cues (e.g., perceived injustice for courage, low risk of retaliation for honesty). Virtue cultivation involves developing sensitivity to these cues and the skill to act appropriately *when triggered*.
      *   **Addressing Desiderata:**
          *   **Consistency/Inconsistency:** Explains consistency within "profile-matched" situations and inconsistency elsewhere. Predicts where/when virtue *should* appear.
          *   **Low CSCs:** Explains low correlations – different situations tap different profiles/activations. A "courage profile" for physical danger ≠ profile for social dissent.
          *   **Trait-State:** Traits are latent potentials; states are activated manifestations. Stability lies in the *potential to activate* when cued.
          *   **Situational Effects:** Situations are *constitutive* – they provide the necessary triggers. Strong situations either overwhelm *or* contain the trigger.
          *   **Action-Guidance:** Focuses on recognizing activation cues ("Is this a situation demanding *this kind* of courage?") and practicing appropriate responses *to those cues*. Cultivation involves refining profiles and responses.
          *   **Predictive Power:** Predicts well *if* the situation strongly matches the profile. Prediction weak in ambiguous or novel situations.
      *   **Score:**
          *   *Strengths:* Preserves global virtues meaningfully; integrates situationism elegantly; provides a mechanism for inconsistency; offers concrete cultivation path (cue-sensitivity & response).
          *   *Weaknesses:* Risk of "fragmentation-by-profile" – how many profiles/sub-virtues are needed? Can profiles be defined precisely enough? Does "latent disposition" become empirically vacuous if profiles are too narrow? Normative guidance still requires complex situational judgment.

  2.  **Local Situational Virtues (LSVs): Abandons Global Traits**
      *   **Core Idea:** Rejects broad, cross-situational character traits. "Virtues" are stable *situationally-specific* dispositions or skills (e.g., "honesty-when-dealing-with-authority," "compassion-towards-strangers-in-distress-when-not-pressed-for-time"). Character is a bundle of these local virtues. Phronesis involves knowing *which* local virtue applies *here and now*.
      *   **Addressing Desiderata:**
          *   **Consistency/Inconsistency:** Directly embraces inconsistency; consistency only expected within the narrowly defined situation-type.
          *   **Low CSCs:** Fully expected and explained – different situations require different LSVs.
          *   **Trait-State:** "Traits" *are* stable dispositions, but their scope is hyper-local. State is the manifestation within its specific niche.
          *   **Situational Effects:** Situations *define* the relevant virtue. Strong situations simply call forth their specific LSV (or lack thereof).
          *   **Action-Guidance:** Guidance is highly specific: "In *this precise type* of situation, *this* is the virtuous response." Cultivation involves building repertoires of local skills/dispositions.
          *   **Predictive Power:** High predictability *within* the defined situational niche. Very low predictability outside it.
      *   **Score:**
          *   *Strengths:* Maximally empirically adequate (fits low CSCs perfectly); predictive within niche; avoids hand-waving about global traits.
          *   *Weaknesses:** **Major Threat to Normative Guidance:** Guidance becomes overwhelmingly complex (infinite LSVs?) or reliant on an implausibly powerful phronesis to navigate the chaos. **Loses "Character":** Character fragments into unrelated micro-dispositions, undermining the holistic self and narrative central to virtue ethics. **Praise/Blame:** Becomes highly situation-specific, potentially losing broader ethical evaluation.

  **Conclusion:** The situationist challenge is severe. **TAPs** offer the best chance of salvaging *something* recognizable as global virtue ethics by making virtues context-sensitive triggers, but risk theoretical/complexity costs. **LSVs** capitulate to the data most cleanly but sacrifice the core virtue-ethical notions of unified character and broadly applicable guidance, arguably becoming a different (and less action-guiding) ethical theory. **The fundamental tension remains:** Building a theory that is *both* rigorously empirically adequate (respecting low CSCs, situational power) *and* provides the kind of clear, holistic, character-based normative guidance traditional virtue ethics promises is exceptionally difficult. Neither fix perfectly resolves this; TAPs lean towards preserving guidance at a cost to empirical purity, LSVs lean towards empirical purity at a cost to guidance and character unity. An adequate theory must navigate this minefield without illusion.
