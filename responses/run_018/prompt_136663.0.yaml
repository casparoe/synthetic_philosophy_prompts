answer: |-
  Below is a decision tree for special composition views, built from concrete cases. It avoids labels and focuses on intuitions about specific scenarios. I've flagged incoherent branches, noted awkward commitments, and marked unexplored/unnamed views. The taxonomy is **~75% confident**—it captures major positions but may oversimplify nuanced views. The **least certain split** is whether quantum entanglement counts as bonding, as this intersects poorly defined concepts in metaphysics and physics.

  ### Decision Tree
  **Start: Two hydrogen atoms in a vacuum, separated by a light-year, compose one object?**  
  - **Yes** →  
    - **Is composition *always* the case (any random collection composes)?**  
      - **Yes** →  
        - **Is composition mind-independent?**  
          - **Yes** → **Universalism**  
            *Awkward: Arbitrary scattered objects exist (e.g., "Earth-Mars fusion").*  
          - **No** → **Mind-Dependent Universalism**  
            *Awkward: If all minds vanished, composite objects (like rocks) would cease to exist.*  
      - **No** →  
        - **Is spatial contact necessary for composition?**  
          - **Yes** → 🚫 **INCOHERENT** (atoms compose despite no contact).  
          - **No** →  
            - **Is bonding (e.g., chemical, gravitational) necessary?**  
              - **Yes** → 🚫 **INCOHERENT** (atoms compose despite no bonding).  
              - **No** →  
                - **Does vagueness in boundaries destroy the object?**  
                  - **Yes** →  
                    - **Is composition mind-dependent?**  
                      - **Yes** → **Unnamed (Vagueness-Mind-Dependent)**  
                        *Awkward: Objects flicker in/out of existence based on boundary precision and mental states.*  
                      - **No** → **Unnamed (Vagueness-Sensitive)**  
                        *Awkward: Most macro-objects (e.g., mountains) lack exact boundaries and don’t exist.*  
                  - **No** →  
                    - **Is composition mind-dependent?**  
                      - **Yes** → **Unnamed (Mind-Dependent Non-Universal)**  
                        *Awkward: No clear principle for when minds "create" composition.*  
                      - **No** → **Unnamed (Non-Universal Non-Restricted)**  
                        *Awkward: Composition occurs without any discernible conditions (mysterious selectivity).*  

  - **No** →  
    - **Do *any* objects ever compose a whole?**  
      - **No** → **Nihilism**  
        *Awkward: Everyday objects (e.g., chairs) don’t exist; only atoms do.*  
      - **Yes** →  
        - **Is spatial contact necessary?**  
          - **Yes** →  
            - **Is bonding necessary?**  
              - **Yes** →  
                - **Does quantum entanglement count as bonding?**  
                  - **Yes** → **Unnamed (Contact + Bonding-Entanglement)**  
                    *Awkward: Entangled particles compose only if touching (rarely possible).*  
                  - **No** → **Contact + Bonding View**  
                    *Awkward: Contact without bonding (e.g., dust on a table) doesn’t compose.*  
              - **No** → **Contact-Required View**  
                *Awkward: Broken objects (e.g., a shattered vase) cease to exist when separated.*  
          - **No** →  
            - **Is bonding necessary?**  
              - **Yes** →  
                - **Does quantum entanglement count as bonding?**  
                  - **Yes** → **Bonding View (Entanglement-Inclusive)**  
                    *Awkward: Entangled particles compose new objects across light-years.*  
                  - **No** →  
                    - **Is bonding specifically "being caught up in a life" (à la van Inwagen)?**  
                      - **Yes** → **Van Inwagen-Style Restricted View**  
                        *Awkward: Inanimate composites (e.g., stars, statues) don’t exist.*  
                      - **No** → **Unnamed (Bonding-Exclusive)**  
                        *Awkward: "Bonding" is vague (e.g., is weak gravity enough?).*  
              - **No** →  
                - **Does vagueness destroy objects?**  
                  - **Yes** → **Vagueness-Nihilism Hybrid**  
                    *Awkward: Objects with fuzzy edges (e.g., clouds) don’t exist, but others might.*  
                  - **No** →  
                    - **Is composition mind-dependent?**  
                      - **Yes** → **Conventionalism**  
                        *Awkward: Composition varies by culture (e.g., is a "heap" mind-created?).*  
                      - **No** → **Unnamed (Minimal Restrictions)**  
                        *Awkward: Arbitrary restrictions with no clear rationale (e.g., why *these* objects?).*  

  ---

  ### Notes on Empty/Incoherent Branches:
  - **YES + Spatial Contact Necessary**: Incoherent. If atoms compose without contact, contact can’t be necessary.
  - **YES + Bonding Necessary**: Incoherent. Atoms compose without bonding, so bonding can’t be necessary.
  - **NO + Nihilism + Bonding/Entanglement**: Irrelevant (nihilism denies all composition).
  - **Quantum Entanglement + Nihilism**: Unexplored (nihilism ignores bonding/entanglement).
  - **Van Inwagen + Entanglement**: Unexplored (van Inwagen rejects entanglement as "life").

  ---

  ### Confidence & Uncertainties:
  - **Confidence: ~75%**. The tree covers major positions (universalism, nihilism, van Inwagen, conventionalism) and handles standard cases. However:
    - **Least sure split**: Whether quantum entanglement counts as bonding. This crosses physics/metaphysics boundaries and isn’t well-theorized (e.g., is entanglement "interaction" or just correlation?). Many branches here are unexplored or speculative.
    - **Vagueness boundaries** are also fuzzy—some views (e.g., supervaluationism) might reject the "destroys objects" framing.
    - **Unnamed views** arise where the tree exposes gaps in standard taxonomies (e.g., non-universalist non-nihilist views without clear principles).

  This tree should work for a study group to spark debate—refine based on responses!
