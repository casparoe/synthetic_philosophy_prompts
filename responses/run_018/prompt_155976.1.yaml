prompt: |-
  ok so i just started volunteering at the county historical society and found out that like half the farmworker records from the 80s just never made it in. not lost—never collected. the intake sheet had no feild for seasonal labor so the archivist on duty just marked them domestic or unemployed. now im defending my thesis on thursday to the archives committee plus two outside reviewers. my claim is that archives dont just have silences by accident, they produce structured absence through the taxonomy they use to decide whats recordable. im pitching a practice called negative provenance tracking, where you document the exclusion decision-tree itself—what categories were available, who applied them, what got filtered out—rather than only cataloguing what survived.

  the audience is three traditional archivists who think neutrality is the core ethic, one feminist historian who agrees with me in principle but thinks im overstating institutional agency, and one digital-humanities person obsessed with metadata schemas. i need a Q&A prep sheet: the objections they will actually raise, in the order theyll come, phrased the way each of them would put it. for each one give me a two-minute reply and flag where my reply is weakest. include the question im praying nobody asks. dont ask me for sources or a reading list—i need this for the talk itself.
