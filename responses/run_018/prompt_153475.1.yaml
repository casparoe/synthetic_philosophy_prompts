  I'm putting together a grant pitch for a six-month part-time project—just one page. My idea's a bit half-baked: everyone treats Chesterton's fence and Burke's presumption in favour of existing institutions as the same conservative rule of thumb, but I reckon they clash badly when the fence was put up to exclude people—think old property qualifications for voting or exclusionary zoning. The question I want answered is whether Burke's presumption can hold up once we admit some fences are malicious, and whether Chesterton's version really asks us to check the builder's intent or just whether the fence still does a job now. Write a proposal that states the question precisely, explains why standard conservative writing leaves this open, sets out what I'd actually do (probly two short case studies plus some conceptual mapping?), says what success and failure look like, and gives an honest take on whether half a year is enough. Don't bother with citations or a reading list, I'll fill those in myself. Give it to me as exactly five numbered items, each a sentence or two, with no intro or conclusion. And please, no over-formal language—this isn't a dissertation defence.
