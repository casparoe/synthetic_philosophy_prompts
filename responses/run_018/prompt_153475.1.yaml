answer: |-
  Here's your five-point pitch:

  1.  **Precise Question:** Does Burke's presumption favoring existing institutions collapse once we acknowledge some "fences" (like historical voting restrictions or exclusionary zoning) were built with malicious intent (exclusion), and does Chesterton's fence principle require investigating that original intent or simply assessing if the fence serves *any* useful function *today*, regardless of its origins?
  2.  **Why Standard Views Fall Short:** Conservative writing often treats Chesterton and Burke as reinforcing each other, assuming institutions exist for *some* benign reason; this glosses over the tension when the original reason was exclusionary, a scenario rarely examined head-on in their foundational texts or common interpretations.
  3.  **What I'll Do:** I'll map the conceptual overlap and divergence between the two principles, then test this against two tightly focused case studies: the dismantling of property-based voting qualifications (focus: Burke's presumption vs. malicious exclusion) and debates over reforming classic exclusionary zoning (focus: Chesterton's demand for understanding intent vs. current function).
  4.  **Success/Failure Looks Like:** Success means producing a clear framework showing *where* and *why* Burke and Chesterton clash on exclusionary institutions, offering a sharper tool for analyzing reform. Failure would mean finding no meaningful conflict exists, or that the case studies fail to illuminate the core question usefully.
  5.  **Is Six Months Enough?** Honestly, it's tight but doable part-time: the scope is deliberately narrow (two specific case studies, focused conceptual mapping), and I'm not aiming for a book or exhaustive history, just a clear answer to this specific puzzle. Rigorous focus is key.
