  I'm trying to figure out why me and a colleague keep talking past each other about historiography. My credance is maybe 0.65 that any macro-narrative of science longer than two centuries has to smuggle in presentist values just to stay coherent; she puts it at 0.15. Give me your own number, but more importantly decompose it: (1) the chance that causal explanation in history always needs an endpoint that functions like a destination, (2) the chance that picking such an endpoint necessarily imports values from the present, (3) the chance that alternative frames — like treating the past as a branching tree with no privileged trunk — actually avoid Whiggism without collapsing into incoherence, and (4) the chance that accusations of Whiggism are usually just disguised presentism running the other way. Assign a rough probability to each, say how they combine into your overall figure, and tell me which of the four is the weakest link — i.e., what kind of argument or case study (maybe a detailed account of medieval optics that never mentions modern physics) would move it most.
