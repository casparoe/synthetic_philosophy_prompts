prompt: |-
  I'm reading this philosophy of mind book arguing that self-deception is possible but a lot narrower than people think, and the author keeps ruling on little vignettes about what does and doesn't count as the real thing. Her rulings so far, from memory:

  - a wife finds flirty texts on her husband's phone, gets a flash of dread, then tells herself they're just work friends and stops looking at the phone — real self-deception
  - a startup founder has looked at the actual bank statements and knows intellectually the company is dying, but keeps telling himself it's a rough patch — real self-deception
  - a lottery player can recite the exact odds (1 in 300 million), has a strong feeling she'll be the exception, but isn't ignoring any particular evidence about her own ticket — not self-deception, just wishful thinking
  - a kid raised in an anti-vax household who has literally never met the counterevidence believes vaccines are harmful — not self-deception, just a badly formed belief
  - a man whose partner is actually faithful slowly convinces himself shes cheating by rereading her innocent texts as suspicious — self-deception, the twisted kind

  Next she considers a case where a student is emailed his qualifying exam result, which is a fail. But hes so scared of that outcome that he never opens the email, and over a few weeks he becomes genuinely confident he passed. What would she rule about him?

  Predict her ruling and commit to a best-guess criterion. In particular, does she need the person to have actually believed the truth at some point, or is motivated avoidance of available evidence enough? Say which earlier vignette is the closest analog, and give me one further vignette that would cleanly settle which criterion she's actually running.
