prompt: |-
  Hey, quick one for you. I cover science and ideas for a magazine and I'm working up a piece on whether morality actually has rules -- like real, exceptionless ones -- or whether the whole project of "moral principles" was a mistake. I keep getting pitched on particularism vs generalism and I want the piece to be about what any view in this debate would even have to deliver, not just who wins.

  Act as a professional philosopher who knows the particularism/generalism literature cold (Dancy, Ross, the usual suspects) but who is also fair to the "common sense" side. Think carefully before drafting -- sketch the requirements first, then organize them.

  Write the desiderata: what an adequate theory of moral reasons has to be able to do to count as a serious view. For each requirement give me the motivating case or consideration (e.g. stuff like: whether pain's badness always counts the same way, how it handles Ross-style prima facie duties, why "all else equal" clauses can't just be infinitely patched, the fact that ordinary people seem to reason perfectly well without consulting rules). Mark which requirements are genuinely non-negotiable vs. which are just one camp's hobbyhorse. If you think some pair of desiderata can't be jointly satisfied, say so -- that's probably the most interesting part of the piece. Then, briefly, say how the main contenders do against the list, but keep that part short.

  One thing I really care about: please separate what's basically settled in this literature from what's still genuinely contested, and don't present a contested position as the consensus. Roughly 600-800 words, American English, and pitch it so I can lift structure from it rather than copy it.
reasoning: |-
  Okay, the user is a science and ideas journalist working on a piece about whether morality has exceptionless rules. They need a structured outline of what any moral theory must deliver to be taken seriously, focusing on the particularism vs. generalism debate. The key is to provide desiderata - the requirements for an adequate theory - with concrete examples, noting which are non-negotiable and which are contentious. They also want clarity on settled vs. contested points and how major theories perform against these criteria.

  First, I need to recall the core literature. Dancy's particularism argues against moral principles, emphasizing context-dependence. Generalism, represented by Ross and others, defends principles, even if prima facie. The user wants to avoid taking sides but explore what makes a theory viable. 

  The user mentioned several key points: pain's badness, Ross's duties, problems with "all else equal" clauses, and ordinary moral reasoning. These should translate into specific desiderata. Let me brainstorm the essential requirements. 

  1. **Explanatory Power**: Any theory must explain why certain reasons count morally. For instance, why is causing pain usually wrong? This seems non-negotiable. Without it, the theory lacks foundation.

  2. **Context Sensitivity**: Cases where a reason's polarity changes, like lying to save a life. Dancy's example of pain not being bad in surgery is perfect here. This is crucial; ignoring context seems fatal.

  3. **Action Guidance**: People make moral decisions without explicit rules. A theory must account for this practical reasoning. Non-negotiable, as morality must be applicable.

  4. **Deliberative Usefulness**: Moral principles should aid decision-making. If principles are too hedged (e.g., "don't lie unless..."), they become useless. This is important but might be a generalist's concern.

  5. **Systematicity**: Generalists want coherence across cases, like why pain is consistently relevant. Particularists might see this as optional. Mark this as contestable.

  6. **Avoidance of Vacuousness**: Principles shouldn't be tautological (e.g., "be good"). Non-negotiable; empty principles explain nothing.

  Now, conflicts: Systematicity vs. Context Sensitivity is the big one. Generalists sacrifice nuance for coherence; particularists embrace nuance but risk fragmentation. This tension is central to the debate.

  Settled points: Pure particularism (no principles) vs. hard generalism (strict principles) are extremes. Most agree on defeasible reasons. Context matters, but the degree is contested.

  Assessing theories: Rossian generalism does well on explanation and guidance but struggles with conflicting duties. Dancy's particularism excels in context but faces systematicity challenges. Variabilism is a middle ground.

  User's deeper needs: They want a balanced, structured framework for their article, highlighting tensions without bias. They need clarity for readers on why this debate matters and where the real disagreements lie. Ensuring academic rigor while keeping it accessible is key.

  Finally, structure the response with desiderata first, then conflicts, settled/contested points, and brief theory assessments. Keep examples concrete and mark non-negotiables clearly. Avoid jargon, use American English, and stay within word count.
answer: |-
  Here’s a structured framework for evaluating theories of moral reasons in the particularism/generalism debate. I’ll outline **desiderata** (requirements for an adequate theory), flag their status, provide motivating cases, note tensions, and briefly assess key views. This mirrors the core philosophical disputes while respecting common-sense intuitions.

  ---

  ### **Desiderata for an Adequate Theory of Moral Reasons**  
  *(Non-negotiable = NN; Contested/Theory-Dependent = C)*  

  1. **Explanatory Power (NN)**  
     *What it must do*: Explain *why* certain features (e.g., pain, promise-keeping) count as moral reasons.  
     *Motivating case*: Pain’s badness isn’t arbitrary—it connects to suffering, well-being, or agency. A theory must clarify this link, not just list "rules."  
     *Settled*: All sides agree moral reasons require *some* explanation.  

  2. **Context Sensitivity (NN)**  
     *What it must do*: Acknowledge that a feature’s moral force can change or vanish in specific contexts.  
     *Motivating case*: Lying is usually wrong (undermines trust), but not when deceiving a murderer to save a life. Pain isn’t bad in surgery if it prevents greater harm.  
     *Settled*: Even hardcore generalists (e.g., Ross) accept *defeasible* reasons that can be overridden. Pure absolutism (e.g., "never lie") is dead.  

  3. **Action Guidance (NN)**  
     *What it must do*: Enable agents to make decisions without omniscience or paralyzing complexity.  
     *Motivating case*: Ordinary people navigate moral dilemmas (e.g., "Should I break a promise to help a friend?") without consulting rulebooks. A theory must reflect this competence.  
     *Settled*: Moral theories must be practically usable.  

  4. **Deliberative Usefulness (C: Generalist-leaning)**  
     *What it must do*: Provide principles that actively assist reasoning (e.g., via priority rules or presumptions).  
     *Motivating case*: "All else equal, pain is bad" helps structure decisions. If principles become infinitely hedged ("except when..."), they lose utility.  
     *Contested*: Particularists (e.g., Dancy) argue principles *distort* reasoning; good judgment is rule-free.  

  5. **Systematicity (C: Generalist-leaning)**  
     *What it must do*: Display coherence across cases (e.g., why pain *typically* counts against an action).  
     *Motivating case*: If pain’s moral relevance is utterly context-dependent with no underlying pattern, morality seems chaotic. We expect *some* general truths (e.g., "torturing innocents for fun is wrong").  
     *Contested*: Particularists reject systematicity as a myth; morality is inherently situational.  

  6. **Avoidance of Vacuousness (NN)**  
     *What it must do*: Principles must not be tautological ("do what’s right") or infinitely flexible.  
     *Motivating case*: "Be kind" fails if "kindness" is redefined case-by-case to match intuitions. This collapses into particularism without explanatory value.  
     *Settled*: Empty principles are inadmissible.  

  ---

  ### **Key Tensions Between Desiderata**  
  The central conflict is **Systematicity vs. Context Sensitivity**.  
  - **Problem**: Strong systematicity (e.g., "Pain always counts against an act") clashes with context sensitivity (e.g., pain in athletic training). But weak systematicity ("Pain *usually* counts against...") risks vacuity.  
  - **Why it matters**: If no principled way exists to specify when exceptions apply, generalism fails. Particularists exploit this, but critics argue they sacrifice moral coherence.  

  ---

  ### **Settled vs. Contested Territory**  
  **Settled**:  
  - Moral reasons are *defeasible* (Ross’s prima facie duties). No serious theory defends exceptionless rules.  
  - Context *matters*; crude rule-fetishism (e.g., "Never lie, even to Nazis") is rejected.  
  - Moral judgment requires perception of particulars (even generalists concede this).  

  **Contested**:  
  - **Can principles be non-vacuous and context-sensitive?** Generalists say yes (via "defeaters" or thresholds); particularists say no.  
  - **Is systematicity essential?** Generalists (e.g., McKeever & Ridge) say yes for rationality; particularists (e.g., Dancy) say it’s a philosophical illusion.  
  - **Do principles *guide* or *misguide*?** Generalists see them as heuristic tools; particularists see them as crutches that bias judgment.  

  ---

  ### **How Major Views Fare**  
  *(Briefly, against the desiderata)*  

  - **Rossian Generalism** (Prima Facie Duties):  
    ✅ Explanatory power (ties reasons to basic goods)  
    ✅ Context sensitivity (duties override/reinforce)  
    ⚠️ Deliberative usefulness (no clear hierarchy for conflicts)  
    ⚠️ Systematicity (loose framework, not rigid rules)  

  - **Dancy-Style Particularism** (No Principles):  
    ✅✅ Context sensitivity & Action guidance (judgment is case-by-case)  
    ✅ Avoids vacuity (no hollow principles)  
    ❌ Systematicity (explicitly rejected)  
    ❌ Deliberative usefulness (principles don’t guide; intuition does)  

  - **Variabilist Generalism** (e.g., "Pain is *pro tanto* bad unless it serves a sufficient good"):  
    ✅ Balances explanatory power & context sensitivity  
    ⚠️ Risks vacuity if "sufficient good" lacks criteria  
    ⚠️ Systematicity may be superficial  

  ---

  ### **Takeaway for Your Piece**  
  The debate hinges on whether morality *demands* general principles to be rational (generalism) or whether principles inevitably distort moral reality (particularism). **Non-negotiables** (explanation, context, guidance) are shared; the fight is over systematicity’s necessity and usefulness. The deepest tension: Can we have moral coherence without sacrificing nuance? Neither side has a knockout punch—but that’s where the story lives.  

  ---  
  **Word count**: 720 | Structure: Desiderata → Tensions → Consensus/Contestation → Theory Assessment  
  **Lift-ready**: Use this framework to contrast views neutrally while spotlighting philosophical stakes. Omit jargon like "pro tanto" for mainstream readers.
