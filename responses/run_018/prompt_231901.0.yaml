answer: |-
  ### Which Demarcationist Are You? Sorting Quiz  
  **Instructions:** Answer each question based on your judgment of the concrete cases. Choose the option that best reflects your view. At the end, tally your points to find your position.

  ---

  #### Questions  
  1. **Astrology's failed predictions**: Astrologers often blame the astrologer (not the theory) when predictions fail. Is astrology scientific?  
     - **A.** No, because it avoids falsification by shifting blame.  
     - **B.** It depends on whether the *entire tradition* of astrology has generated novel predictions over time.  
     - **C.** Yes, because it’s a long-standing practice with expert communities.  
     - **D.** The "scientific" label is irrelevant; astrology fails because it solves no empirical problems.  

  2. **Freudian psychoanalysis**: Freudian theory explains opposite behaviors (e.g., aggression and passivity) with the same concepts (e.g., repressed urges). Is this a fatal flaw?  
     - **A.** Yes—it makes the core theory unfalsifiable.  
     - **B.** Only if Freudians *never* use these explanations to generate new, testable hypotheses.  
     - **C.** No—it’s normal for paradigms to absorb anomalies through flexible concepts.  
     - **D.** The flaw is that Freudianism doesn’t *progress* in solving problems, not its flexibility.  

  3. **Cold fusion adjustments**: When cold fusion experiments failed, proponents blamed impurities in materials. Is this scientifically acceptable?  
     - **A.** No—it’s an ad hoc excuse to evade falsification.  
     - **B.** Only if it leads to *new predictions* (e.g., "pure palladium will work").  
     - **C.** Yes—it’s normal to tweak auxiliary assumptions to protect a core idea.  
     - **D.** Acceptability depends on whether the *research programme* eventually produces progress.  

  4. **String theory’s testability**: String theory hasn’t made testable predictions yet. Does this make it unscientific?  
     - **A.** Yes—untestable theories are pseudoscience.  
     - **B.** Not if it’s part of a program that *could* yield testable predictions later.  
     - **C.** No—it’s scientific if experts accept its promise.  
     - **D.** Demarcation is misguided; judge it by its problem-solving coherence, not testability.  

  5. **Saving theories with ad hoc fixes**: Is saving a theory by adding auxiliary hypotheses (e.g., "impurities caused the failure") inherently unscientific?  
     - **A.** Yes—it’s cheating to avoid falsification.  
     - **B.** Only if the fix is ad hoc (no *new predictions*).  
     - **C.** No—it’s routine in normal science.  
     - **D.** The issue isn’t "ad hoc"-ness but whether the *programme* progresses long-term.  

  6. **Unit of scientific failure**: When a theory faces problems (e.g., cold fusion fails replication), does failure apply to...  
     - **A.** The *specific hypothesis* (e.g., "cold fusion works").  
     - **B.** The *core theory* only if auxiliary tweaks are ad hoc.  
     - **C.** The *entire research programme* over decades, not single tests.  
     - **D.** Neither—failure is about problem-solving, not "units."  

  7. **Timeless criteria?**: Should we judge past theories (e.g., phlogiston) by the same standards as modern ones?  
     - **A.** Yes—falsifiability is timeless.  
     - **B.** Mostly—but ad hoc adjustments are only bad if they lack novelty.  
     - **C.** No—what counts as science changes historically.  
     - **D.** No—demarcation criteria are always context-dependent and futile.  

  8. **Demarcation’s purpose**: Why draw a line between science and non-science?  
     - **A.** To weed out unfalsifiable pseudoscience (e.g., astrology).  
     - **B.** To spot degenerating programmes (e.g., Freudianism) that avoid novel predictions.  
     - **C.** To understand how communities shift paradigms (e.g., cold fusion’s rejection).  
     - **D.** It’s a pseudo-problem—focus on empirical effectiveness instead.  

  ---

  #### Scoring Key  
  Tally your answers using this key. **Each answer maps to a letter (N, S, L, K, D) representing a position.**  

  | Question | A       | B       | C       | D       |
  |----------|---------|---------|---------|---------|
  | 1        | N       | L       | K       | D       |
  | 2        | N       | S       | K       | L       |
  | 3        | N       | S       | K       | L       |
  | 4        | N       | L       | K       | D       |
  | 5        | N       | S       | K       | L       |
  | 6        | N       | S       | L       | D       |
  | 7        | N       | S       | K       | D       |
  | 8        | N       | L       | K       | D       |

  **Count your letters:**  
  - **Most N's**: Naive falsificationist  
  - **Most S's**: Sophisticated falsificationist  
  - **Most L's**: Lakatosian research-programme view  
  - **Most K's**: Kuhnian historical view  
  - **Most D's**: Laudanian (demarcation as pseudo-problem)  

  If tied, read the descriptions below—your view may be hybrid!  

  ---

  #### Position Descriptions  
  1. **Naive falsificationism (N)**:  
     - **Core idea**: Science must be falsifiable. Failure to falsify a *single hypothesis* (e.g., cold fusion) makes it unscientific.  
     - **Verdict on cases**: Astrology (A), Freudianism (A), and string theory (A) are unscientific due to unfalsifiability. Ad hoc adjustments (like cold fusion’s) are cheating.  
     - **Flaw**: Ignores how science *actually* evolves (e.g., all theories face anomalies).  

  2. **Sophisticated falsificationism (S)**:  
     - **Core idea**: The crime is *ad hoc-ness* (no new predictions), not unfalsifiability. Blaming impurities in cold fusion is bad **only** if it doesn’t yield new tests.  
     - **Verdict on cases**: Freudianism is unscientific if its adjustments are ad hoc; string theory may be scientific if testable later.  
     - **Distinction from Lakatos**: Focuses on *single adjustments*, not whole programmes over time.  

  3. **Lakatosian research-programme view (L)**:  
     - **Core idea**: Judge *programmes* (e.g., string theory) over time. A "progressive" programme (novel predictions) is scientific; "degenerating" ones (e.g., Freudianism?) are not.  
     - **Verdict on cases**: Cold fusion’s adjustments are acceptable if part of a potentially progressive programme. Astrology is degenerating.  
     - **Key split**: Failure attaches to *whole programmes*, not single hypotheses.  

  4. **Kuhnian historical view (K)**:  
     - **Core idea**: No timeless criterion. Science is what *communities* do in paradigms (e.g., string theory physicists). Demarcation is retrospective.  
     - **Verdict on cases**: Astrology isn’t science because it lacks puzzle-solving communities; cold fusion was rejected when its paradigm collapsed.  
     - **Key split**: Rejects falsifiability and focuses on community practices.  

  5. **Laudanian position (D)**:  
     - **Core idea**: Demarcation is a pseudo-problem. Judge theories by *problem-solving effectiveness*, not labels.  
     - **Verdict on cases**: Don’t call astrology "unscientific"—say it *solves no problems*. String theory’s math may be coherent, even if untestable.  
     - **Radical move**: Shifts focus away from demarcation entirely.  

  ---

  #### Gaps and Ambiguities  
  - **Empty combinations**:  
    - **N + C (e.g., Q3A + Q3C)**: Incoherent—naive falsification rejects ad hoc adjustments, but Kuhnian views accept them.  
    - **S + D (e.g., Q2B + Q8D)**: Unattractive—sophisticated falsification still cares about demarcation; Laudan rejects it.  

  - **Cases that can’t separate cleanly**:  
    - **Sophisticated falsificationism (S) vs. Lakatos (L)**: Both condemn ad hoc adjustments, but S focuses on *single hypotheses* (Q6A/B), while L focuses on *programmes* (Q6C). Cold fusion is ambiguous: S judges each adjustment; L judges the whole programme.  
    - **Kuhn (K) vs. Laudan (D)**: Both reject timeless criteria, but Kuhn retains "paradigms" (Q8C), while Laudan rejects demarcation entirely (Q8D).  

  **Design note**: The tree prioritizes the **unit of failure** (Q6) and **timeless criteria** (Q7) to split positions cleanly. Cases like cold fusion and Freudianism test consistency across questions.  

