  I am a doctoral student in philosophy of economics currently working through the literature on cardinal social welfare, and in a recent study-group session a colleague offered the following summary of Harsanyi's 1955 aggregation theorem. He said that if both individual preferences and the collective preference relation over risky prospects satisfy the von Neumann-Morgenstern rationality axioms, then social welfare must be a weighted linear sum of individual cardinal utility functions, with the weights uniquely determined up to a common scale factor. Because these weights are mechanically fixed by rationality alone, he argued, interpersonal comparison of utility needs no separate ethical calibration; therefore Arrow's impossibility result is dissolved once risk is present, leaving only the technical task of selecting a normalization constant. He then extended this to intergenerational climate-policy evaluation, proposing that future generations' heterogeneous risk attitudes can be inserted directly into the same linear formula without any further normative framework for weighting lives across time. I feel this conflates the formal structure of the theorem with its ethical interpretation, and possibly confuses Arrow's ordinal deterministic framework with Harsanyi's cardinal risky one, but I lack the precision to isolate every error. Please adopt the persona of an expert in formal social-choice theory, think carefully, and begin with brief internal brainstorming. Then audit the summary in exactly five numbered items, each consisting of one or two sentences and containing no introduction or conclusion: for each item identify whether the claim is accurate, a common simplification, or a misrepresentation; state what a defender of Harsanyi's view would correct; and say whether the conclusion drawn actually survives that correction.
