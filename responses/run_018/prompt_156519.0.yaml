answer: |-
  Here are five numbered points addressing the key issues:

  1.  **Authorial Intent Validity:** Your intended meaning (radios as radios) holds primary authority because language derives meaning from the speaker/writer's communicative act; readers interpret *that* act, not create meaning independently.

  2.  **Reader Interpretation Limits:** Your mate is partially correct that readers actively construct meaning from the text, but this does not grant them absolute authority to *replace* your intent; their interpretations are constrained by the text's words and conventions, and are valid *responses*, not the sole "truth".

  3.  **Biographical Overreach:** Your teacher overreaches by using knowledge of your grandfather's death to impose an unintended metaphor; while context can inform interpretation, it cannot override your explicit denial of intended meaning for such a specific textual element.

  4.  **Textual Identity (Intent vs. Artifact):** The "real piece" is inherently contested: philosophically, it's the work you intended to create; practically and academically, it's the specific artifact physically submitted (typo included) that exists for assessment.

  5.  **Definitive Text Version:** For the purpose of your coursework assessment, the submitted version with the typo ("he never woke up") is the actual work being marked; it's the tangible object evaluated, regardless of your intended draft.
