prompt: |-
  Hey, I'm in year 11 and I'm writing this for my philosophy club because my friends and I got into a massive row over my english coursework. I wrote a short story about a bloke repairing old radios in his shed, and I kept using the phrase 'static between stations' just because I like the sound of it, but my teacher said it's clearly a metaphor for grief since my grandad died last year and she knows all about it. I never meant that at all—the story's literally just about radios! My mate argued that once you hand something in you don't get to control the meaning anymore and the people reading it decide what's true, but that feels wrong because I'm the one who wrote every word. To make things weirder, there's a typo in the version I submitted where it says 'he never woke up' instead of 'he never woke up early', so now the ending sounds like the bloke died, but in my corrected draft he's alive and drinking tea; I'm even thinking of putting the corrected one online but leaving the typo version for the exam mark, and I don't know which one counts as the real piece.

  Please act like a professional philosopher who thinks really carefully, and start by brainstorming the key issues before giving your view. I need exactly five numbered points, each just a sentence or two, with no introduction or conclusion—tell me whether my teacher is overreaching by using my life to read the story, whether my mate is right that readers take over once it's handed in, and which version of the text I should treat as the actual work. Don't just say it depends, and please don't ask me to read anything—just answer straight.
