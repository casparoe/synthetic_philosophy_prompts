answer: |-
  Here's a concise grant proposal structured around your core question and constraints:

  **Project Title:** The Adhesive of Opposition: Testing the Coherence of Left/Right Political Affiliations Across Contexts

  **Duration:** 3 Months
  **Funding Requested:** [Your Amount - e.g., $5,000]

  **1. Precise Research Question:**
  Does the persistence of "Left" and "Right" political coalitions primarily stem from shared underlying ideological principles (e.g., equality vs. hierarchy, liberty vs. security), or is it predominantly sustained by shared negative partisanship (opposition to a common outgroup), becoming contextually incoherent when partisan labels are absent?

  **2. Why Standard Answers Are Insufficient:**
  *   **"Equality vs. Hierarchy" (Classic Ideology):** This framework assumes consistent, principle-driven policy preferences. It struggles to explain why individuals who identify strongly as Left/Right on national partisan issues exhibit fragmented, non-aligned preferences in non-partisan contexts (e.g., zoning debates, open-source governance), suggesting principles may not be the primary binding force *across domains*. It also downplays the powerful role of affect and opposition.
  *   **"It's Obsolete Now" (Dimensional Shift):** While acknowledging new cleavages (e.g., open/closed, GAL/TAN), this view doesn't explain the *resilience* of the Left/Right labels themselves. If obsolete, why do these categories remain the primary way people identify and organize politically? This perspective overlooks the possibility that the labels persist precisely *because* they efficiently signal tribal affiliation and opposition, not ideological purity.

  **3. Conceptual Study Methodology (No Large Survey):**
  This 3-month study will employ rigorous qualitative analysis of existing discourse and behavior in deliberately chosen non-partisan contexts:
  *   **Comparative Case Studies:** Select 2-3 high-stakes, non-partisan deliberative spaces where traditional Left/Right labels are absent or minimized (e.g., specific contentious local zoning board decisions, governance debates within prominent open-source projects like Debian or Apache, community land trust negotiations).
  *   **Discourse Analysis:** Systematically analyze recorded meetings, public comments, mailing list archives, and project documentation within these cases. Code for:
      *   *Issue Stances:* Positions taken on the specific substantive issues at hand.
      *   *Argumentation Framing:* The principles (equality, liberty, efficiency, tradition, security, fairness, etc.) invoked to justify stances.
      *   *Affective Language & Opposition:* Identification of "us vs. them" framing, negative characterizations of opposing views/actors, language indicating threat or solidarity.
      *   *Known Affiliations (Where Possible):* If publicly available, note participants' known *national-level* partisan leanings or public political identities (e.g., via social media, voter registration if public record, prior public statements).
  *   **Analysis Focus:** Map the alignment (or misalignment) of issue stances within each case. Crucially, cross-reference this mapping with:
      *   The principles invoked by individuals (testing consistency of stated principles across issues within the case).
      *   The presence/absence of strong oppositional framing (testing if coalitions form primarily *against* specific proposals/actors rather than *for* shared principles).
      *   (Where data exists) The correlation between stances in the *non-partisan* context and individuals' known *national partisan* affiliations (Left/Right). Does the national "side" predict local/non-partisan alignment?

  **4. What Result Would Actually Matter:**
  *   **Strong Support for Negative Coalition Hypothesis:** Finding that coalitions in non-partisan spaces are primarily built around opposition to specific proposals/actors *and* that individuals known to be on the *same* national "side" (Left/Right) frequently find themselves on *opposing* sides in these contexts, *without* consistently invoking different core principles across contexts. This fundamentally challenges the "coherent ideology" model.
  *   **Strong Support for Coherent Principle Hypothesis:** Finding that individuals known to be on the same national "side" consistently align in non-partisan contexts *and* consistently invoke the same core principles (e.g., equality arguments predictably from national-left identifiers) across different issue domains. This would validate traditional ideological models.
  *   **Mixed/Contextual Result (Likely):** Finding that principles *and* opposition both play roles, but with significant context dependence and frequent cross-cutting cleavages that fracture expected national Left/Right blocs in local/non-partisan settings. This still challenges the simplicity and coherence of the Left/Right axis as universally applicable.

  **5. What Failure Looks Like:**
  *   **Inconclusive Data:** The chosen case studies lack sufficient documentation, public discourse, or identifiable affiliations to perform meaningful analysis.
  *   **Overwhelming Noise:** The issues in the case studies are so complex or unique that clear stances, principles, or coalitions cannot be reliably identified or mapped.
  *   **Confirmation of Obsolete Hypothesis:** Finding that the Left/Right axis is completely irrelevant in these spaces, with entirely new, consistent cleavages emerging *and* persisting, rendering the original question moot for these contexts (though still relevant for national politics). However, this would still be a significant finding.
  *   **Methodological Failure:** The discourse analysis coding framework proves unreliable or fails to capture the nuances of principle vs. opposition.

  **6. Significance & Broader Impact:**
  This project challenges a fundamental assumption in political science and public discourse: that "Left" and "Right" represent coherent, principle-based worldviews. If the "negative coalition" hypothesis holds, it implies:
  *   Political identity is more tribal and oppositional than ideological.
  *   Depolarization efforts must target affective polarization and negative partisanship, not just ideological differences.
  *   Policy preferences are highly context-dependent and potentially unstable, challenging models predicting behavior based on partisan identity alone.
  *   Local/non-partisan governance offers potential pathways for disrupting national partisan enmity.

  **7. Scope for 3 Months:**
  Focus is on developing the analytical framework, selecting robust case studies, conducting intensive discourse analysis on those specific cases, and synthesizing findings. This is an exploratory, proof-of-concept study laying groundwork for potential future larger-scale research (e.g., surveys, experiments).

