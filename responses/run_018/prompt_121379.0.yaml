  First, I need to map philosophical concepts to audio terms. Hedonism says pleasure is the only intrinsic good. Heterogeneity problem: different pleasures feel different, so how can they be compared? Quantitative hedonists (like Bentham) think pleasure varies only in intensity and duration—like a signal's amplitude and time. Qualitative hedonists (Mill) say there are different qualities, like distinct waveforms.

  The user mentioned intermodulation distortion as a possible analogy for combined pleasures. That's when two signals mix and create new frequencies. So maybe combined pleasures aren't just additive but generate new sensations. Need to incorporate that.

