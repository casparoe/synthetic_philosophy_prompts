  ## Joint Statement on Nationalism Studies: Modernist & Ethnosymbolist Perspectives Following Adversarial Collaboration

  **Preamble:**  
  We, scholars representing modernist (Hobsbawm-Anderson) and ethnosymbolist (Anthony Smith) perspectives on nationalism, present this statement following sustained dialogue. We affirm significant areas of agreement while acknowledging persistent, substantive disagreements. This document seeks to clarify our common ground and the precise nature of our divergent interpretations, aiming to foster constructive debate and guide future research.

  ### I. Agreed Claims

  1.  **The Centrality of the Modern State:** The rise of the centralized, bureaucratic modern state from the late 18th century onwards was a fundamental prerequisite and crucible for the emergence and consolidation of nations as mass, politically salient phenomena. State institutions (administrative, educational, military) are indispensable for standardizing populations and embedding national consciousness.
  2.  **The Transformative Role of Print Capitalism:** The advent and spread of capitalist print media (newspapers, novels, textbooks) were critical mechanisms for creating standardized vernaculars, disseminating standardized national imaginaries across dispersed populations, and enabling the imagining of large-scale community among strangers.
  3.  **The Significance of Ritual and Performance:** Shared rituals, symbols, commemorations, and public performances are essential for inculcating and sustaining national identity, fostering collective sentiment, and reproducing the nation as a lived reality across generations. This includes state-sponsored rituals and popular, sometimes invented, traditions.
  4.  **The Existence of Pre-Modern Ethnic Ties:** Pre-modern eras featured significant cultural collectivities often termed *ethnies* (shared myths, memories, symbols, associations with homeland). These provided cultural resources, affective bonds, and potential bases for later national mobilization.
  5.  **Non-Presupposition of National Continuity:** While pre-modern *ethnies* existed, their relationship to modern nations is complex and requires empirical investigation for each case. The mere existence of an *ethnie* does not *automatically* imply unbroken continuity or predetermine the emergence, form, or boundaries of a subsequent modern nation. Modern nations are distinct political communities shaped decisively by the conditions of modernity.

  ### II. Disagreements Table

  | Point of Contention                 | Modernist Position (Hobsbawm-Anderson Tradition)                                                                 | Ethnosymbolist Position (Anthony Smith Tradition)                                                                                                |
  | :---------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature and Origins of Nations**   | Nations are fundamentally modern constructs ("modular"), assembled primarily *after* c. 1780-1800. While utilizing pre-existing cultural materials, they are novel political forms arising from modern socio-economic, political, and technological conditions. | Nations are not solely modern inventions. They often possess deep cultural roots and exhibit significant *continuity* with pre-modern *ethnies*. Modernity transforms and politicizes these existing ethnic cores, but does not create the core identity *ex nihilo*. |
  | **Crux 1: Bureaucratic Pilgrimage & Vernacular** <br> **Case Study: Pre-Revolutionary France (c. 1600-1789)** <br> *Modernist Prediction:* <br> *Ethnosymbolist Prediction:* | **Crux Question:** Can the integrative effects of "bureaucratic pilgrimage" (career paths unifying elites via state service) occur effectively *without* a standardized vernacular promoted by the state? <br> **Chosen Case:** Development of French state administration under the Bourbon monarchy. <br> *Predicts:* Will show limited integrative effect beyond elites; significant linguistic fragmentation persists despite state centralization; pilgrimage reinforces dynastic/estate loyalty, not proto-national, due to lack of standardized French. | <br> <br> <br> <br> <br> *Predicts:* Will show increasing integration of provincial elites into a shared administrative culture centered on the royal court and nascent state apparatus, fostering a shared identity transcending locality *despite* linguistic variation; lays groundwork for later national integration. |
  | **Crux 2: Invention of Tradition** <br> **Case Study: The Welsh Eisteddfod (Revival c. 18th-19th Century)** <br> *Modernist Prediction:* <br> *Ethnosymbolist Prediction:* | **Crux Question:** Do "invented traditions" require conscious design and propagation by elites, or can they emerge and gain national significance through largely organic, repeated social practice *without* centralized elite orchestration? <br> **Chosen Case:** The revival and transformation of the Welsh Eisteddfod (cultural festival) into a national institution. <br> *Predicts:* Will reveal clear evidence of deliberate design, manipulation, and propagation by specific elite groups (e.g., Iolo Morganwg, later nationalists) to create a usable past and national symbols; discontinuity with medieval precursors emphasized. | <br> <br> <br> <br> <br> *Predicts:* Will demonstrate significant continuity of cultural practice (bardic traditions, poetic forms) and myth-symbol complexes; revival drew legitimacy from deep-rooted popular cultural memory and practices, even if formalized by elites later; organic growth alongside elite involvement. |

  **Concluding Remarks:**  
  This statement reflects our commitment to rigorous, evidence-based dialogue. We agree on the indispensable role of the modern state, print capitalism, and ritual performance, and acknowledge the reality of pre-modern ethnic ties without assuming their automatic continuity. Our core disagreement centers on the novelty versus deep historical rootedness of the nation. We identify the role of vernacular standardization in state integration and the mechanisms behind tradition formation as key empirical cruxes. We encourage further research on cases like Pre-Revolutionary France and the Welsh Eisteddfod to test our divergent predictions and advance our collective understanding of how nations emerge and endure.
