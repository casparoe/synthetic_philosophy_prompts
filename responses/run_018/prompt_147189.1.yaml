  To form a principle, I consider integrating Knobe’s asymmetry with factors like autonomy and omission. The proposed principle has three clauses: normative attitude (harm vs. help), directness (physical vs. mediated), and agency (omission vs. commission). 

  Applying this to each case: Case one: harmful, direct, commission → intentional. Case two: helpful, direct, commission → not intentional (due to asymmetry). Case three: helpful but mediated via drones → intentional? Wait, the user says intentional, but the principle might need adjustment. If the drones are tools, not agents, it's still the researcher's responsibility. But autonomy might shift perception. The user’s judgment here challenges the typical asymmetry. Maybe the principle needs to treat mediated help differently.

  Case four: harmful omission → not intentional due to agency factor. Case five: harmful, direct, commission. The principle predicts intentional, but the user oscillates. Why? The stated goal is maintaining standards, not harming. But the teacher knows the specific outcome. The principle might need to account for primary intent vs. side effects, even in direct harm.

