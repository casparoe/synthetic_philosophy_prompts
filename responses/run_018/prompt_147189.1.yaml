  Looking at Knobe's side-effect effect, the asymmetry in cases one and two aligns with his findings. But case three complicates things because the researcher’s byproduct help is deemed intentional. That contradicts Knobe’s typical harm asymmetry. Why? Maybe because the drones are autonomous, introducing a mediating factor. The user is testing if the asymmetry holds when systems are involved.

  Case four involves omission. The administrator's inaction leading to harm isn't seen as intentional. The user wonders if omission weakens intentionality like directness does for help. Here, omission might reduce direct control, affecting intentionality judgments.

