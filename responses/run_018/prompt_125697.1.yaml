answer: |-
  Your intuitive judgments reveal a remarkably consistent pattern centered on **restoring or maintaining species-typical functional capacity relative to the individual's baseline**, with "dysfunction" defined by *harmful deviation* from that norm. Here's the principle distilled:

  **Therapeutic interventions correct or prevent a *harmful dysfunction* that impairs an individual's capacity to function within the statistically typical human range, relative to their own stable baseline. Enhancements improve capacities beyond species-typical functioning or baseline, absent a harmful dysfunction.**

  ### How This Principle Explains Your Verdicts:
  1.  **Severe immunodeficiency/gene therapy (Child):** Corrects a harmful dysfunction (life-threatening immune deficit), restoring species-typical function → **Therapy**.
  2.  **Viral resistance in healthy adult:** No existing dysfunction; expands function beyond species-norm → **Enhancement**.
  3.  **Cochlear implant for hearing loss:** Corrects harmful dysfunction (sensory deficit), restoring access to species-typical auditory range → **Therapy**.
  4.  **Ultrasonic hearing in normal hearing:** Expands sensory capacity beyond species-typical range → **Enhancement**.
  5.  **Mood implant for depression:** Corrects harmful dysfunction (clinically impairing mood disorder), restoring prior emotional range → **Therapy**.
  6.  **Permanently elevated affect:** Alters mood regulation beyond typical, stable human variability → **Enhancement**.
  7.  **Reconstructive surgery after burns:** Corrects harmful dysfunction (impaired skin barrier, mobility, social function), restoring near-baseline form/function → **Therapy**.
  8.  **Cosmetic rhinoplasty:** Alters appearance beyond baseline for preference, absent dysfunction → **Enhancement**.
  9.  **Cognitive rehab after TBI:** Corrects harmful dysfunction, restoring prior baseline → **Therapy**.
  10. **Pharmacological cognitive augmentation:** Expands working memory beyond species-typical limits, absent deficit → **Enhancement**.
  11. **HGH for deficiency:** Corrects harmful dysfunction (growth impairment), restoring trajectory toward species-typical height range → **Therapy**.
  12. **HGH for normal child:** Aims for capacity *above* species-typical range, absent dysfunction → **Enhancement**.

  ### Resolving the Grief Case:
  *   **Resolving Prolonged Grief Disorder:** Corrects a harmful dysfunction (clinically recognized impairing condition), restoring capacity for typical functioning → **Therapy**.
  *   **Accelerating Healthy Grief:** *No harmful dysfunction exists.* Grief is a species-typical, adaptive response. Compressing its timeline alters a natural emotional process beyond its typical trajectory without restoring function (it was functional already). → **Enhancement**.

  ### Addressing the Growth Hormone "Pull":
  Your discomfort arises because both HGH cases *move toward a statistical norm* (height). The principle clarifies the distinction: **Therapy addresses a *harmful deviation* from the norm (deficiency), while enhancement pursues a *preferred position* within or beyond the norm (taller percentile) absent harm.** The core isn't directionality toward the mean, but *correcting a harmful impairment*.

  ### The Neural Interface Case (Musician):
  *   **Intervention:** Neural interface expanding microtonal discrimination beyond human limits for a musician with perfect pitch.
  *   **Analysis:** No harmful dysfunction exists. Normal human audition has limits; perfect pitch is already an exceptional *variant* within the typical range. This expands a sensory capacity far beyond species-typical functioning. It doesn't restore a deficit relative to baseline (their pitch discrimination was already intact/excellent).
  *   **Verdict by Principle:** → **Enhancement**. Governed by the same clause as ultrasonic hearing and cognitive augmentation: expanding beyond species-typical capacity without correcting dysfunction.

  ### Simplicity Trade-offs & Potential Revisions
  *   **Grief Acceleration:** This is the verdict most likely to feel counterintuitive ("accelerating healing"). To overturn it and call it therapy, you'd need to weaken the principle significantly (e.g., define "dysfunction" as *any sub-optimal state*, even healthy grief). This would collapse the therapy/enhancement distinction for many cases (e.g., cosmetic surgery, cognitive augmentation) – *your other verdicts would require overturning*. Your oscillation reflects the tension, but your principle holds firmest here.
  *   **Cosmetic Surgery:** Some argue severe aesthetic concerns *cause* dysfunction (distress, social harm). If you deemed severe congenital deformity purely cosmetic rhinoplasty as therapy *due to psychological/social harm*, you'd need to incorporate "significant psychosocial distress/harm" as part of the dysfunction criteria. This *could* be accommodated without major disruption if defined rigorously (avoiding trivial preferences).

  ### The Resulting Principle Refined
  > **Therapeutic Intervention:** An intervention intended and effective at correcting or preventing a *harmful dysfunction* – defined as a condition causing significant suffering, impairment, or increased risk of death/disease, representing a suboptimal deviation from species-typical functioning *relative to the individual's own stable baseline* – thereby restoring or maintaining the capacity to function within the statistically typical human range.
  >
  > **Enhancement:** An intervention intended and effective at improving a capacity *beyond* species-typical functioning or the individual's stable baseline, in the *absence* of a harmful dysfunction.

  This principle robustly explains all your intuitive judgments, including the growth hormone distinction and classifying grief acceleration and the musician's neural interface as enhancement. Its strength lies in anchoring "dysfunction" in harm and deviation from species-typical function/baseline, rather than mere statistical deviation or subjective preference.
