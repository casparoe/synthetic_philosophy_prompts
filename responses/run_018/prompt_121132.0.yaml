answer: |-
  ### Core Mechanism: Players manipulate tokens representing real objects to earn points, while hidden correspondence shifts force confrontation between token-level success and referent-level failure.

  **Materials:**
  - Index cards: 18 blank, 12 with printed symbols (△□○▽◇◎), 6 with "SELF"
  - Markers
  - 6 envelopes labeled "KEY A/B/C"
  - Shoebox ("Vault")
  - Bag of mixed snacks (e.g., pretzels, chocolate pieces)
  - Timer

  **Setup (10 min):**
  1. Place 6 real objects around the room: Book (△), Chair (□), Plant (○), Window (▽), Bag (◇), Door (◎). Hide symbols on small labels.
  2. Create token sets: 6 symbol cards (△□○▽◇◎), 6 blank cards, 6 "SELF" cards.
  3. Pre-load envelopes: KEY A (△=Book, □=Chair...), KEY B (△=Window, □=Plant...), KEY C (△=Door, □=Bag...). Put KEY A in shoebox.

  **Roles:**
  - **Operators** (12 players): Manipulate tokens to match reality.
  - **Reality Shifters** (2 players): Alter objects/environment.
  - **Scorer** (1 player): Awards points via snack pieces (1 piece = 1pt).

  **Rules:**
  - Operators see real objects but can only interact via tokens.
  - Correct token arrangement = 1pt per match.
  - "SELF" token directs one Operator to perform an action (e.g., "◎" = "stand near Door").
  - Scorer uses current KEY envelope to verify matches.

  **Timeline:**

  | Phase       | Time    | Activity                                                                 |
  |-------------|---------|--------------------------------------------------------------------------|
  | **Round 1: Grounding** | 0-15 min | Operators match symbol tokens to visible objects. Scorer uses KEY A. Self-token: "Go to [△]" (Book). |
  | **Silent Re-grounding** | 15 min   | Facilitator swaps KEY A with KEY B in shoebox. Objects unchanged.        |
  | **Round 2: Token Stability** | 15-35 min | Operators fix "errors" from Round 1 (e.g., move ◇ from Bag to Chair). Scorer uses KEY B. Self-token: "Avoid [▽]" (Window). |
  | **Reverse Shift** | 35-40 min | Reality Shifters move Plant to Window, put Book in Bag. Operators *must* respond with tokens. |
  | **Round 3: Catch-Up** | 40-60 min | Operators update tokens to new reality. Scorer still uses KEY B. Self-token: "Touch [□]" (Plant). |
  | **Self-Token Twist** | 60 min   | Facilitator replaces KEY B with KEY C. Self-token instruction: "Obey [◎]" (now = Door, previously Plant). |
  | **Final Round** | 60-75 min | Operators work with KEY C. Self-token forces conflict (e.g., ◎ now means "exit room" but players remain). |
  | **Debrief** | 75-100 min | Guided discussion mapping events to concepts.                            |

  **Payoff Scheme:**  
  Top 3 scorers get extra snacks. All participants receive baseline shares.

  ---

  ### Debrief (20 min)  
  **Key Questions in Order:**  
  1. *"When you earned points in Round 2, what were you *actually* matching: the tokens or the room?"*  
     (Reveal KEY swap → token success ≠ referent success)  
  2. *"When the plant moved and you updated tokens, what 'pushed' you to change them?"*  
     (Highlight reverse causation: world → symbol → action)  
  3. *"When the 'SELF' card told you to exit, but you didn't—what stopped the system?"*  
     (Exposed token-as-substrate paradox)  

  **Mapping Moments to Concepts:**  
  | Game Moment          | Hofstadter Concept               | Physicalist View                  | Top-Down View                     |
  |----------------------|----------------------------------|-----------------------------------|-----------------------------------|
  | Round 2 scoring      | Silent re-grounding             | "You were fooled by token rules"  | "Meaning detached from reference" |
  | Plant moved → token update | Reverse-direction causation | "World forces symbol change"     | "Symbols *tracked* reality"      |
  | SELF token conflict  | Token-as-substrate              | "Card was paper, not a command"  | "Meaning required interpretation" |

  ---

  **Predictable Failures & Mitigations:**  
  - **Puzzle-Winning Focus:** Mitigate by awarding points for *speed* in Round 3, forcing hasty token decisions.  
  - **Meta-Gaming Scoring:** Scorer hides KEY; players can’t reverse-engineer rules.  
  - "**Facilitator Rigged It**": Acknowledge openly: *"Yes—but in real life, who sets *your* groundings?"*  
  - **Map≠Territory Conflation:** Contrast Round 1 (correct grounding) vs. Round 2 (token-consistent but wrong).  
  - **New Failure:** *Ignoring self-token*. Solution: Make obeying it worth 3 points to incentivize compliance.  
  - **New Failure:** *Reality Shifters over-acting*. Give them strict instructions (e.g., "move only these two items").  

  ---

  **Limits & Required Assertions:**  
  1. **The activity CANNOT show...**  
     - How systems *self*-ground symbols. Admit: *"Here I imposed meaning. Real careenia bootstrap this."*  
     - Ontological difference between physical/subjective. Assert: *"Your confusion about the SELF token mirrors Hofstadter’s core puzzle: can symbols *be* the thing they represent?"*  
  2. **Physicalism vs. Top-Down is empirically indistinguishable here.** State plainly: *"Both views predict token manipulation. The fight isn’t about behavior—it’s about what’s *really driving* the system."*  
  3. **Required Verbal Claims:**  
     - *"In a real caring system, tokens aren’t just moved—they *push back* via meaning."*  
     - *"The shoebox KEY is a ‘symbol-handler’—but who handles the handler?"*  

  **Final Script Snippet:**  
  *"When the SELF card said ‘exit’ and you hesitated, you felt the crack between the token and what it pointed at. Hofstadter’s question is whether that crack is where meaning lives... or if it’s just gears grinding."*  

  ---
  This design ensures players *physically enact* the symbol/referent tension through incentivized choices while meeting all constraints. The edible stakes, role conflicts, and abrupt KEY shifts make the theoretical dilemma visceral before it’s named.
