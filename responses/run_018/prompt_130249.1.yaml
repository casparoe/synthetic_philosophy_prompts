prompt: |-
  Since my father was recently diagnosed with early-onset familial Alzheimer's, I have been serving on the ethics committee at the university hospital that reviews Ulysses contracts and advance directives for psychiatric and neurological conditions. Our precedents are these: we approved a contract in which a patient with bipolar I disorder pre-authorized temporary involuntary hospitalization and lithium during future manic episodes, revocable only after 72 hours of clinical stability; we rejected a contract in which a patient with recurrent severe depression pre-authorized ECT during future episodes, even though she currently feared that suffering; we approved with conditions a contract in which a patient with schizophrenia pre-authorized long-acting injectable antipsychotics during psychotic breaks, contingent on confirmation by an independent psychiatrist; and we rejected a contract in which a patient with opioid use disorder pre-authorized a naltrexone pellet that would precipitate severe withdrawal upon use, deeming it punitive rather than therapeutic.

  We now face a proposal from a fully competent patient with the same familial Alzheimer's mutation. She directs that once her MMSE falls below a specified threshold and she expresses a desire to eat, she is to be denied oral nutrition and hydration, with her spouse designated to enforce this refusal on the ground that her future demented self will lack the narrative continuity that makes preferences authoritative.

  If we want to be consistent with our own track record, what should we decide? Which precedent is the closest analog, and do our precedents genuinely underdetermine the outcome? Please identify the competing rules—such as a capacity-continuity principle versus a treatment-restoration/non-withholding principle—that both fit our prior verdicts, state what each predicts here, give your best guess with reasons, and specify what further case would settle the matter between them. Also, please state how confident you are in this analysis and single out the point about which you are least sure.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on an ethics committee reviewing a Ulysses contract for a patient with familial Alzheimer's. The patient wants to deny herself food and water once her MMSE drops below a certain level and she expresses a desire to eat. The committee needs to decide based on their precedents.

  First, I need to recall the precedents they mentioned. They approved a bipolar patient's contract for involuntary hospitalization and lithium during mania, revocable after stability. That seems to prioritize restoring capacity. They rejected the depression patient's ECT contract because she feared suffering now, so current preferences overrode future ones. The schizophrenia case was approved with conditions, requiring an independent psychiatrist, which adds safeguards for capacity assessment. The opioid case was rejected because the naltrexone pellet was punitive, not therapeutic.

  Now, looking at the Alzheimer's case. The patient wants to refuse nutrition based on narrative continuity loss. The key here is whether denying food aligns with therapeutic goals or is punitive. Also, the precedents show a pattern: they support interventions that restore capacity but reject those causing harm without restoration or against current preferences.

  The closest analogy might be the rejected ECT case. Both involve a competent person pre-authorizing something that their future self might oppose due to suffering. But in the ECT case, the current self's fear overruled the future self's wishes. Here, the competent self is overriding the future self's desire to eat. That's a conflict between narrative continuity and current autonomy versus future well-being.

  The bipolar case supports intervention to restore capacity. But Alzheimer's isn't restorable; it's degenerative. So, the treatment-restoration principle doesn't apply here. The schizophrenia case involved capacity verification, but here the patient won't regain capacity. The opioid case was punitive, and denying food could be seen similarly, but the intent is different—preventing a life without narrative continuity versus punishment.

  The user needs consistency. The committee must decide if this is therapeutic or punitive. The Alzheimer's patient's goal is to avoid a life she deems not worth living, which isn't about restoring function. But withholding food leads to death, which is irreversible. The precedents don't directly address irreversible decisions, except maybe the ECT rejection, which prioritized current suffering.

  The competing principles: capacity-continuity (preference stability) vs. treatment-restoration. Here, the patient lacks narrative continuity, so her future preferences aren't authoritative. But denying basic care like food conflicts with non-withholding principles. The committee might reject it as punitive or against the principle of beneficence.

  My best guess is rejection. The ECT precedent shows overriding current suffering isn't allowed. Future suffering from starvation is severe. Also, unlike the bipolar case, no restoration is possible. The opioid case rejection for being punitive supports this. Denying food could be seen as punitive or not therapeutic. Plus, enforcing it requires the spouse to override expressed desires, which is ethically problematic.

  To settle between principles, a case where a patient pre-authorizes withdrawal of life-sustaining treatment in irreversible coma would help. If approved, that supports the continuity principle. If rejected, it favors non-withholding of basic care. The user's confidence might be medium, with least certainty about whether narrative continuity loss justifies overriding future preferences. Also, how the committee views the therapeutic intent versus the punitive nature of starvation.
answer: |-
  Based on your committee's precedents and the principles they reveal, here's a consistent analysis of the Alzheimer's Ulysses contract:

  **Closest Analog:** The **rejected ECT contract for recurrent depression** is the strongest analog. Both involve:
  1.  A competent patient authorizing a future intervention (ECT/denial of food) during an episode of their illness (depression/dementia).
  2.  The authorized intervention causing significant suffering/distress *as perceived by the future self* during the episode.
  3.  The patient's *current* competent self judging that the future suffering is outweighed by the benefits (ending depression/preventing prolonged dementia).
  4.  The committee overriding the competent patient's advance directive based on concerns about the nature of the suffering imposed and the inability of the future self to revoke consent *during* the suffering.

  **Competing Principles Fitting Precedents:**
  1.  **Principle of Treatment-Restoration & Non-Withholding of Basic Care (PRNB):** Ulysses contracts are permissible *only* when the intervention aims to *restore decisional capacity* or treat the underlying condition causing incapacity, and they cannot authorize withholding basic life-sustaining care (like food/water) where death is the intended outcome. Prevents interventions deemed punitive or causing irreversible harm without restoration potential.
      *   **Supported By:** Approved Bipolar (restores stability/capacity), Approved Schizophrenia (restores capacity, treats psychosis), Rejected Opioid (punitive, no restoration). Implicitly supported by rejection of ECT (severe suffering without guaranteed/immediate restoration?).
      *   **Prediction for Alzheimer's:** **REJECT.** Denying oral nutrition/hydration (ONH):
          *   Does *not* aim to restore capacity or treat Alzheimer's; its goal is death.
          *   Withholds basic, non-medical care (food/water).
          *   Causes severe, irreversible suffering leading to death.
          *   Falls into the "punitive" category like the rejected opioid pellet.

  2.  **Principle of Narrative Continuity & Binding Future Selves (NCBF):** A competent individual's advance directive based on their stable, core values ("narrative self") can bind future selves who lack narrative continuity (e.g., due to dementia or acute psychosis), even authorizing actions contrary to the expressed wishes of the future incapacitated self, provided the intervention isn't purely punitive and aligns with the core values expressed when competent.
      *   **Supported By:** Approved Bipolar (binds manic self lacking continuity), Approved Schizophrenia (binds psychotic self lacking continuity). *Potentially* supported by the rejection of the opioid contract (deemed punitive, not aligning with therapeutic values).
      *   **Prediction for Alzheimer's:** **APPROVE (potentially with conditions).** The directive:
          *   Is made competently based on core values regarding life narrative.
          *   Targets a future self lacking narrative continuity.
          *   Aims to prevent a state the competent self deems intolerable (prolonged dementia), aligning with her core values.
          *   Isn't *intended* as punitive, but as fulfilling a life plan.

  **Analysis & Best Guess:**
  *   **Underdetermination:** The precedents *do* underdetermine the outcome. Both principles fit the prior decisions reasonably well. PRNB strongly fits the opioid rejection and the focus on restoration in approvals. NCBF strongly fits the approvals for Bipolar/Schizophrenia where future incompetent selves were bound.
  *   **Tension Point:** The key conflict is whether *withholding basic care causing death* is fundamentally different from *imposing treatment* (like antipsychotics/lithium) to restore capacity, even if temporarily distressing. The ECT rejection suggests a limit based on suffering, but ECT is treatment, while withholding ONH is non-treatment.
  *   **Best Guess:** **REJECT the contract.** My reasoning:
      1.  **Echoes ECT Rejection:** Like the ECT case, the committee rejected binding the future self to severe suffering *despite* the competent self's judgment. Starvation/dehydration involves profound, unavoidable suffering.
      2.  **Violates Non-Withholding Principle:** The rejection of the punitive opioid intervention and the focus on restoration in approvals suggest a strong underlying principle against authorizing interventions whose primary mechanism is severe harm/denial of basic care without therapeutic (restorative) intent. Providing food/water is fundamental care, not medical treatment.
      3.  **Slippery Slope & Enforcement:** Enforcing food/water denial against the expressed desires of a patient (even demented) is ethically fraught and practically challenging for caregivers/spouses in a way that enforcing medication is not. It risks profound distress for all involved.
      4.  **Distinction from Terminal Sedation/VSED:** This differs from Voluntary Stopping of Eating/Drinking (VSED) by a competent patient or palliative care at the very end of life. Here, the directive mandates *imposing* refusal against the wishes of the patient *at the time*, potentially years before natural death would occur.
      5.  **Lack of Restoration:** Unlike the approved contracts, there is *no* pathway to restored capacity. The intervention's sole outcome is death.

  **Settling Case:**
  A case that would clearly settle between PRNB and NCBF would involve a **competent patient with early-stage terminal cancer (not dementia) authorizing the withdrawal of life-sustaining medical treatment (e.g., ventilator, dialysis) once they reach a permanently unconscious state (coma/PVS), even if physiological reflexes suggest "resistance" at the time of withdrawal.**
  *   **PRNB Prediction:** Likely **REJECT** if framed as a Ulysses contract binding a future self. Withdrawal isn't "restoring" capacity, and the patient isn't suffering (being unconscious). PRNB might only allow withholding/withdrawing *medical* treatment based on current best interests or prior *refusals of treatment*.
  *   **NCBF Prediction:** **APPROVE.** The directive reflects the competent patient's core values and binds the future non-conscious self lacking any narrative continuity or capacity. Withdrawal aligns with the prior refusal of prolonged artificial life support.
  *   **Outcome:** If your committee would **APPROVE** this cancer/coma directive, it strongly favors **NCBF** and would support approving the Alzheimer's directive. If it would **REJECT**, it strongly favors **PRNB**.

  **Confidence & Uncertainty:**
  *   **Overall Confidence:** **Medium-High (7/10)** that rejection is the most consistent outcome based on the emphasis on restoration, non-punitiveness, and the parallels to the ECT rejection regarding suffering.
  *   **Point of Least Certainty:** **Whether the distinction between *withholding medical treatment* (potentially acceptable under NCBF) and *withholding basic care* (ONH) is decisive enough for the committee.** The precedents don't explicitly address this line. If the committee views dementia as destroying the "person" to such an extent that providing ONH is merely sustaining biological life against the prior person's wishes (akin to medical treatment for a PVS patient), then NCBF could justify approval. However, the **rejected opioid contract** suggests a strong aversion to directives causing severe physical suffering/harm as a mechanism, which withholding ONH undeniably does. This is the crucial ambiguity.

  **Conclusion:** Consistency with your track record, particularly the rejection of the ECT contract due to the suffering it would impose on the future self and the rejection of the punitive opioid intervention, points most strongly towards **rejecting the Alzheimer's nutrition/hydration refusal directive.** The decisive factor appears to be the authorization of an act (denying basic sustenance) that causes severe, irreversible suffering leading to death, without any aim of restoring capacity or treating the underlying disease. The committee's history prioritizes avoiding such harms over strictly enforcing advance directives based solely on narrative discontinuity.
