prompt: |-
  As a journalist covering science and conceptual history, I am drafting a feature on how ancient Chinese logic anticipates modern crises of classification, and I need your help working through a specific interpretive problem. The White Horse dialogue—associated with the School of Names and its exploration of whether a white horse can be said to be a horse once color and form are distinguished—raises the question of whether an entity's category survives the alteration of its perceptible attributes. Rather than treating this as a purely abstract puzzle, I want you to apply it to George Orwell's Animal Farm, which is widely enough known that we can discuss its plot and major scenes without consulting the text. Read the novel as a sustained dramatization of that taxonomic anxiety: trace how the farm's categories—animal versus human, comrade versus oppressor, the Seven Commandments versus their revised versions—shift not merely as political corruption but as an ontological problem about whether changed properties dissolve original identity. In particular, consider whether the pigs' assimilation represents a change in hard properties, meaning physical morphology and behavior, or in soft properties, meaning social function and legal status, since the School of Names traditionally distinguishes the common name from the specific difference. Pay particular attention to the renaming of Manor Farm, the gradual assimilation of the pigs, and the final scene where observers can no longer distinguish swine from human. In continuous prose only, with no headings, bullet points, bold text, or tables, explain where Orwell treats categorical change as a loss of essence and where he treats it as a mere change in appearance, and identify at least one moment where a philosopher of language might say the novel confuses metaphysical distinction with political allegory. Do not provide a bibliography, reading list, or citations, and if you reference any line from the novel, paraphrase without quotation marks rather than attempting verbatim recall. Please respond as a single flowing letter without any structural formatting.
