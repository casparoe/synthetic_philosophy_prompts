answer: |-
  Here’s a thought experiment for your essay, adhering to your specifications:

  **The Scenario:**  
  In a draughty garage, a heavy side door keeps swinging shut due to a worn latch. Frustrated, the owner grabs a discarded, asymmetrically warped wooden doorstop from a pile. Placing it loosely near the door's lower edge, they swing the door open. Instead of staying put, the wedge subtly *rolls* a few centimetres sideways due to its uneven grain structure and warping, lodging itself perfectly under the door's lowest corner – the only spot where the floor dips slightly, creating just enough purchase. The door stays firmly open.

  **Why it Might Seem Intelligent:**  
  An observer might call this "uncannily clever" or "intelligent". The wedge appeared to *solve* the specific problem: it moved from an ineffective position to the precise, optimal spot needed to hold the door, achieving the desired outcome where a normal wedge failed. It seemed to "know" where to go and "acted" purposefully to fulfil the goal of securing the door.

  **Why it Fails as Intelligence:**  
  This wasn't intelligence. The movement was purely mechanical, dictated by hidden physical biases – the wood's grain pattern and warping interacting predictably with gravity and the floor's imperceptible slope. Crucially, it demonstrated **no flexible goal-directed behaviour**. It didn't perceive the problem, form an intention ("hold door open"), or *choose* an action. It was merely a physical object reacting passively to local forces in a way that, *coincidentally* in this exact setup, produced a beneficial result. It achieved an outcome, but without understanding, purpose, or adaptability.

  **Changing the Problem:**  
  Now, imagine the door swings open the *opposite* way onto a perfectly level floor. The owner places the same warped wedge near the door's edge. This time, the wedge rolls – not *towards* the gap to block it, but *away* due to the altered angle and slope, becoming utterly useless. The wedge cannot reorient itself, seek a new strategy, or understand the changed requirement. Its "success" was entirely dependent on the **fortuitous alignment** of its inherent physical bias (grain/warp direction) with the *specific, unchanging* geometry of the first scenario. Change one detail (door swing direction/floor contour), and its "problem-solving" vanishes, proving the lack of flexible agency – the feature doing all the philosophical work was the **fixed, non-adaptive nature of its physical bias**.
