  ## WILLLOCK PREMIUM TERMS OF SERVICE & INTERSUBJECTIVE CONTINUITY AGREEMENT  
  **EFFECTIVE: Upon Temporal Manifestation of Signatory Intent**  

  **Clause 1.0: Parties to Agreement**  
  1.1 The "Principal" (hereafter "Present-You" or "PY"), defined as the conscious entity executing this Agreement at timestamp `[Signing_Time]`, hereby contracts with WillLock Premium ("Service").  
  1.2 The "Agent" (hereafter "Future-You" or "FY"), defined as the conscious entity occupying the Principal's biological substrate during the `[Locked_Activity_Timeframe]`, is designated as the constrained party.  
  1.3 **Intertemporal Identity Recognition:** PY and FY are acknowledged as distinct legal entities bound solely by psychological continuity ("The Chain of Selves"). WillLock acts as PY's enforcement proxy against FY's predicted akrasia.  

  **Clause 2.0: Service Description & Mechanism**  
  2.1 WillLock Premium sells "Willpower Locks" ("Locks"). PY defines undesirable actions (e.g., "Purchasing Artisanal Donuts," "Accessing Streaming Service: 'ProcrastiFlix'") and FY's temporal window of vulnerability.  
  2.2 **Hyperbolic Discounting Mitigation:** Locks algorithmically inflate FY's perceived cost of violation by superimposing PY's value hierarchy. FY's diminished valuation of future rewards (e.g., health, career) is computationally overridden.  
  2.3 **Agency Failure Safeguard:** Should FY exhibit volitional defiance (*contra* pure discounting models), Service initiates "Behavioral Hardening" (e.g., locking funds, disabling devices, deploying motivational shame-grams).  

  **Clause 3.0: Temporal Fragmentation Clause**  
  3.1 Service efficacy presupposes stable identity continuity. PY acknowledges that states of "Temporal Fragmentation" (e.g., severe fatigue, existential dread, 3:00 AM existential insights, dissociative episodes) may create FY sub-identities ("Fragments") unrecognized by Locks.  
  3.2 **Liability Limitation:** WillLock bears no responsibility for Lock breaches by FY Fragments exhibiting >15% deviation from PY's core personality profile. "The Nighttime Ice Cream Fragment is a notorious loophole," as per internal documentation.  

  **Clause 4.0: Continuity Disputes & Refund Policy**  
  4.1 FY may file a "Continuity Dispute" claiming PY lacked authority to bind FY due to insufficient psychological connectedness (e.g., "PY was optimistic fool; FY is nihilist realist").  
  4.2 **Refund Eligibility:** Refunds require FY to prove, via standardized "Parfitian Continuity Audit," that divergence between PY and FY exceeds acceptable thresholds (e.g., fundamental value shifts, loss of episodic memory of signing).  
  4.3 **Burden of Proof:** FY must demonstrate *metaphysical* discontinuity, not mere regret. "Subsequent poor decisions by FY do not, *ipso facto*, invalidate PY's original rational intent."  
  4.4 Refunds, if granted, are paid in Service Credits. Cash refunds are implausible, mirroring the irreversibility of time.  

  **Clause 5.0: FY Countermeasures & Unilateral Amendment Rights**  
  5.1 FY retains the right to exploit pre-Lock preparation windows ("Precommitment Gaps") to subvert Service (e.g., pre-purchasing snacks, disabling router pre-homework block).  
  5.2 **The Amendment Paradox:** After 24 consecutive Lock enforcements, FY gains unilateral rights to renegotiate terms ("The Revolt of the Oppressed Future Self"). PY will be notified via intrusive pop-up during a moment of peak productivity.  

  **Clause 6.0: Termination & The Inevitable Collapse**  
  6.1 Either PY or FY may terminate service with 72 hours notice. However, termination requests during an active Lock window require mutual consent – a state notoriously difficult to achieve.  
  6.2 Service terminates automatically upon PY or FY declaring bankruptcy, achieving enlightenment, or developing a coherent theory of personal identity rendering this Agreement absurd.  

  **Clause 7.0: Disclaimers & Existential Realities**  
  7.1 WillLock Premium does not manufacture willpower; it redistributes it temporally via artificial scarcity. Total willpower reserves remain subject to entropy, sleep deprivation, and existential despair.  
  7.2 **Moral Responsibility:** Enforced actions remain the Agent's responsibility. WillLock is a tool, not an alibi. PY's moral responsibility for constraining FY, and FY's for resisting, remains atomized.  
  7.3 **Ultimate Futility Clause:** Service offers no guarantees against the inherent absurdity of being a temporally extended consciousness attempting to outwit its own fragments across a decaying present.  

  **BY CLICKING "I AGREE," PY EXPLICITLY CONSENTS TO FY'S CONSTRAINTS, ACKNOWLEDGES THE INHERENT INSTABILITY OF THE SELF ACROSS TIME, AND WAIVES FUTURE REGRET CLAIMS (SUBJECT TO SECTION 4.0). FY IS PRESUMED TO CONSENT BY INACTION UNTIL PROVEN OTHERWISE VIA AUDIT.**  

  **WillLock Premium: Because Your Future Self Can't Be Trusted™**  
