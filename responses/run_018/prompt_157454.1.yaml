  For the sequence: start with intuition-pumping ("Is more morality always better?"), then define saturation/permeability through Sam’s story. Dependency is critical—without the concrete example, abstract definitions won’t stick. Midway, force them to spot saturation in Sam’s behavior before naming it, making the concept felt, not lectured. 

