answer: |-
  ### Exam Question (280 words)  
  **Decision Theory Final Exam**  
  Consider a modified two-envelope paradox. Two envelopes contain money, with the smaller amount always exactly half the larger. The possible pairs are \((2^k, 2^{k+1})\) for \(k = 1, 2, \dots, 20\) (i.e., amounts are powers of two from \(2^1\) to \(2^{21}\)). A pair is chosen uniformly at random (so 20 possible pairs, each with probability \(1/20\)). You randomly receive one envelope and open it to observe \(2^m\) for some \(m\).  

  1.  **Apply the standard switching argument**: Calculate the expected gain from switching *conditional on observing \(2^m\)*, separately for the cases \(m = 1\), \(m = 20\), and a general \(1 < m < 20\). Does the argument suggest switching is always beneficial?  
  2.  **Assess the paradox**: Does this bounded, proper prior resolve the paradox? Explain why or why not, focusing on whether conditioning on the observed value \(2^m\) is valid for decision-making.  
  3.  **Contrast resolutions**: Distinguish between:  
      -   A *statistical resolution* (fixing the prior, like here).  
      -   A *decision-theoretic resolution* (rejecting the conditioning step itself).  
  Explain which type of resolution this example provides and what fundamental issue might remain.  

  ---  
  ### Model Answer (610 words)  

  **1. Conditional Expectation Calculation:**  
  The standard argument conditions on observing \(2^m\). Let \(S\) be the event "observed envelope contains \(2^m\)".  
  -   **Case \(m = 1\) (observed 2¹=2):**  
      This observation *only* occurs if the pair chosen was \((2^1, 2^2)\) and you were given the smaller envelope (probability \(1/2\) given the pair). It cannot occur if you were given the larger envelope in a pair, as that would require an envelope with \(2^0 = 1\), which doesn't exist. Thus, given \(S\) at \(m=1\), you *must* have the smaller envelope. The other envelope contains \(2^2 = 4\).  
      Expected gain from switching = \(4 - 2 = +2\) (gain of 2). Switching is beneficial.  
  -   **Case \(m = 20\) (observed 2²⁰):**  
      Similarly, this *only* occurs if the pair chosen was \((2^{19}, 2^{20})\) and you were given the *larger* envelope (probability \(1/2\) given the pair). It cannot occur if you were given the smaller envelope, as that would require an envelope with \(2^{21}\), which doesn't exist. Thus, given \(S\) at \(m=20\), you *must* have the larger envelope. The other envelope contains \(2^{19}\).  
      Expected gain from switching = \(2^{19} - 2^{20} = -524,288\) (massive loss). Switching is harmful.  
  -   **Case \(1 < m < 20\):**  
      Observing \(2^m\) can happen in two mutually exclusive ways:  
      (i) The pair was \((2^{m-1}, 2^m)\) and you got the *larger* envelope (\(2^m\)). Probability of this scenario: \((1/20) \times (1/2) = 1/40\).  
      (ii) The pair was \((2^m, 2^{m+1})\) and you got the *smaller* envelope (\(2^m\)). Probability: \((1/20) \times (1/2) = 1/40\).  
      The total probability of observing \(2^m\) is \(P(S) = 1/40 + 1/40 = 1/20\).  
      *   Given (i), switching gives \(2^{m-1}\) (loss of \(2^m - 2^{m-1} = 2^{m-1}\)).  
      *   Given (ii), switching gives \(2^{m+1}\) (gain of \(2^{m+1} - 2^m = 2^m\)).  
      Expected gain from switching = \([ (2^m) \times P(\text{ii}|S) ] + [ (-2^{m-1}) \times P(\text{i}|S) ]\)  
      Since \(P(\text{i}|S) = P(\text{ii}|S) = (1/40) / (1/20) = 1/2\),  
      Expected gain = \((1/2) \times 2^m + (1/2) \times (-2^{m-1}) = (1/2) \times 2^m - (1/2) \times (2^m / 2) = (1/2) \times 2^m - (1/4) \times 2^m = (1/4) \times 2^m > 0\).  
      Switching has positive expected gain.  

  **Conclusion of standard argument:** For \(m=1\), switching gains +2. For \(1 < m < 20\), switching has expected gain \(+(1/4) \times 2^m > 0\). For \(m=20\), switching loses massively. The argument suggests switching is beneficial *except* when you observe the maximum possible amount (\(m=20\)).  

  **2. Does the Paradox Vanish?**  
  No, the paradox is *not* fully resolved by having a proper, bounded prior. While the bounded prior prevents the "always switch" conclusion (since switching is bad at m=20), a core issue remains: **the conditioning move is flawed for decision-making**. Calculating \(E[\text{gain} | \text{observe } 2^m]\) treats the observation \(2^m\) as a fixed event upon which to condition the expectation. However, the *probability of making this specific observation* \(P(\text{observe } 2^m)\) is not uniform (e.g., \(P(\text{observe } 2^1) = 1/40\), \(P(\text{observe } 2^{10}) = 1/20\)) and crucially, the *interpretation* of what the observation means (whether you have the smaller or larger envelope in the pair) depends entirely on \(m\) and the boundaries. The decision rule derived by conditioning on the observation ("switch unless m=20") still leads to inconsistent reasoning if applied before knowing which envelope you received, as the *potential* observation \(2^{20}\) forces a different action than \(2^{19}\). The flaw lies in treating the observed value as a legitimate state for conditioning in the expectation calculation for a decision rule intended to be defined *before* the observation.  

  **3. Contrasting Resolutions:**  
  *   **Statistical Resolution:** Focuses on specifying a valid prior distribution over the states of the world (the possible envelope pairs and which is held). This example uses such a resolution: a proper, bounded, uniform prior over the 20 finite pairs. This prevents the expectation from being infinite or undefined and breaks the "always switch" conclusion by introducing boundary effects.  
  *   **Decision-Theoretic Resolution:** Focuses on the *legitimacy of the conditioning operation itself* for deriving a decision rule. It argues that conditioning on the *specific observed value* \(X=x\) is invalid for this problem because the decision rule "switch if you see x" cannot be evaluated consistently across all possible x *before* the observation is made. The expectation \(E[Y - X | X=x]\) depends on the often-arbitrary labeling of values and ignores the underlying pair selection mechanism. A correct decision-theoretic approach would consider the unconditional expected gain of the *strategy* "always switch" vs. "never switch" *before* opening the envelope, which is zero.  
  This example provides a **statistical resolution** (fixing the prior). It successfully breaks the fallacious "always switch" conclusion but **does not address the deeper decision-theoretic issue** that conditioning on the precise observed value for a one-shot decision is inherently misleading in this context. The hidden mistake in conditioning persists.  

  ---  
  ### Marking Scheme (20 marks total)  
  **Must-Hit Points (A-grade hits all 5 clearly; B-grade misses/dimly grasps 1-2):**  

  1.  **Boundary Calculations (5 marks):** Correctly computes conditional expectation for k=1 (switching gains +2) AND k=20 (switching loses \(2^{19}\)) AND shows for 1<k<20 gain is \(+(1/4)2^k\).  
      *   *Common Mistake:* Assumes symmetric cases at k=1/k=20 or ignores impossibility of smaller/larger envelope.  

  2.  **Paradox Persistence (4 marks):** States paradox isn't fully resolved AND identifies the flaw lies in *conditioning on the specific observed value* \(X=x\) for decision-making, as \(P(X=x)\) and the meaning of \(x\) are context-dependent.  
      *   *Common Mistake:* Claims prior alone resolves it or only notes "always switch" fails without addressing conditioning.  

  3.  **Resolution Contrast - Statistical (4 marks):** Defines statistical resolution as specifying a valid prior (proper, bounded) and notes this example does it, preventing infinite expectations and creating boundary effects.  
      *   *Common Mistake:* Vague description like "fixing the math" without mentioning prior specification/bounds.  

  4.  **Resolution Contrast - Decision-Theoretic (4 marks):** Defines decision-theoretic resolution as rejecting conditioning on \(X=x\) itself, arguing decision rules should be evaluated unconditionally/before observation (e.g., "always switch" has E[gain]=0).  
      *   *Common Mistake:* Confuses this with the statistical fix or mentions "randomization" without grounding in pre-observation evaluation.  

  5.  **Limitation of Example (3 marks):** Explicitly states that while the statistical fix (prior) breaks the fallacious conclusion, it does *not* resolve the core decision-theoretic flaw of conditioning on \(X=x\).  
      *   *Common Mistake:* Implies the example fully resolves the paradox or doesn't separate the two issues.
