prompt: |-
  Me and two friends run a tiny podcast on war and ethics — no academic background between us, we just argue about this stuff. Next week's guest is a philosopher (I won't name her) who defends the moral equality of combatants: the view that soldiers on both sides of a war have the same permission to fight and are equally liable to be killed, regardless of whether their side's cause is just. Her version grounds it in what she calls the "risk bargain" — you get a licence to kill the other side's soldiers in exchange for accepting the same risk yourself, and that symmetry holds even when one side is fighting an unjust war. Whenever you press her on an awkward case she fobs it off with "that's a question for the law of armed conflict, not for the morality of combat," so I'd like the questions ordered so that move gets progressively harder to fall back on.

  Draft me 8 to 10 questions, each with a follow-up keyed to the reply she's most likely to give. I want at least one on the revisionist objection — that you can't acquire a permission to kill merely by being ordered to, and that the unjust side's soldiers are morally required to lay down their arms rather than fight; at least one on whether the risk bargain survives fully remote warfare, where one state fights entirely with drones and stand-off missiles and can't meaningfully be hit back, and whether her view then slides into saying riskless killing is punishment rather than combat; and one on whether the symmetry should really be indexed to how voluntary the fighting is, i.e. whether a volunteer in an unjust war has the same standing as a conscript dragged into it. Finish with a question about what kind of evidence could actually count against the view. Skip anything biographical — assume she's heard every standard objection a hundred times.
reasoning: |-
  Okay, the user is part of a podcast on war and ethics with two friends, and they're preparing for an interview with a philosopher who defends the moral equality of combatants. The core of her argument is the "risk bargain" idea. The user wants to craft questions that systematically challenge her position, especially when she deflects to the law of armed conflict. 

  First, I need to understand her key arguments. She claims that soldiers on both sides have equal permission to kill because they mutually accept the risk of being killed. This creates a symmetry, even if one side's cause is unjust. Her main deflection is to separate morality from legal frameworks. 

  The user wants questions that prevent her from using that deflection. They specifically want to cover revisionist objections (like the requirement for unjust soldiers to lay down arms), remote warfare (drones and stand-off missiles), voluntariness (volunteers vs. conscripts), and what evidence could falsify her view. 

  I should structure the questions to progressively close off the "law vs. morality" escape route. Start with foundational aspects, then move to edge cases where the bargain breaks down. Each question needs a sharp follow-up anticipating her deflection. 

  For the revisionist part, McMahan's objection is central. The follow-up should challenge how moral permissions can arise from mutual risk when one side lacks justification. If she deflects to law, the counter is that morality precedes law. 

  On remote warfare, the risk bargain collapses if one side faces no real threat. The follow-up should question whether killing becomes punitive rather than combative. If she cites existing laws, press on whether those laws might need moral revision. 

  Voluntariness is tricky—does a conscript have the same moral burden as a volunteer? The follow-up should push her on whether coercion affects the bargain's validity. 

  Ending with falsifiability forces her to admit what could undermine her theory. This is crucial because it tests the robustness of her view. 

  The user mentioned she's heard all standard objections, so questions must avoid clichés and target her specific "risk bargain" framing. Need to ensure each follow-up cuts deeper, making deflection harder. 

  Also, the tone should be respectful but incisive—this is a podcast debate, not an attack. Questions must force clarity without being hostile. Prioritize logical gaps over gotchas. 

  Finally, order matters: start broad (symmetry), hit revisionism early, then escalate to drones/voluntariness, ending with falsification. This flow boxes her into addressing morality directly.
answer: |-
  Here’s a targeted question set designed to escalate pressure on the "law/morality" deflection, grounded in her "risk bargain" framework. Each question includes a predicted reply and a follow-up forcing moral engagement:

  1.  **Question:** You argue the "risk bargain" creates moral symmetry: combatants accept reciprocal risk, granting mutual permission to kill. But doesn't this confuse *empirical* risk (what soldiers *experience*) with *moral* justification (why killing is *permissible*)? Can mere exposure to danger create a moral right to inflict harm?
      *   *Predicted Reply:* "The reciprocal risk *is* the moral foundation. It's what distinguishes combatants from civilians and creates the combatant's privilege recognized in LOAC."
      *   **Follow-Up:** But LOAC *codifies* a *presumed* symmetry for practical reasons. We're discussing morality *underlying* the law. If the reciprocal risk exists solely due to one side's aggression (making the other's defensive risk necessary), why does the aggressor’s soldier gain a *moral* permission via a risk they *imposed* unjustly? Isn't that bootstrapping?

  2.  **Question (Revisionist Core):** Revisionists like McMahan argue soldiers fighting for an unjust cause have no *moral* permission to kill; their duty is to refuse. How does the "risk bargain" overcome the claim that you cannot acquire moral permission to commit wrongful acts (killing just combatants) merely by accepting reciprocal risk *created* by your own side's injustice?
      *   *Predicted Reply:* "The bargain operates at the level of role morality within the institution of war. Soldiers are *authorized* to fight each other based on mutual risk acceptance, irrespective of the justice of the cause. Their moral duty is to their role, within legal constraints."
      *   **Follow-Up:** If the bargain is purely institutional/role-based, does that mean the moral equality of combatants *only* exists *because* the law (LOAC/IHL) creates it? Doesn't that reduce your view to legal positivism ("it's equal because the law says so") rather than providing an independent *moral* justification? Where does the *moral* force of the role obligation come from if the war itself is profoundly unjust?

  3.  **Question (Voluntariness & Coercion):** Your symmetry hinges on combatants "accepting" the risk. Does the moral weight of this acceptance depend on *how voluntary* the enlistment was? Is a volunteer for an *unjust* war truly in the same moral position regarding the "bargain" as a conscript forced to fight under duress for that same unjust cause?
      *   *Predicted Reply:* "The relevant acceptance is taking up arms and participating in hostilities, which makes one a combatant subject to the bargain. LOAC/IHL generally doesn't distinguish based on voluntariness for combatant status or targeting."
      *   **Follow-Up:** Granting the legal point, we're discussing the *moral* basis of the bargain. If a conscript is coerced into a role where they must inflict wrongful harm or be punished/killed, how can their coerced participation create a genuine *moral* permission for others to kill them? Doesn't coercion undermine the voluntariness needed for a morally binding "bargain"? Isn't killing them closer to punishing a victim?

  4.  **Question (Remote Warfare - Risk Asymmetry):** Consider State A, fighting an entirely remote war using drones and stand-off missiles against State B, which possesses *no* credible retaliatory capacity against A's homeland or forces. State A's combatants face negligible physical risk. Does the "risk bargain" still hold? Do A's drone pilots have the *same moral permission* to kill B's soldiers as B's soldiers would have to kill A's pilots (if they could)?
      *   *Predicted Reply:* "Combatant status is determined by function, not risk level. A's personnel are lawful targets under LOAC because they are directly participating in hostilities. The bargain applies to the *status*, not the immediate tactical risk."
      *   **Follow-Up:** But the *moral core* of your view seems to be the reciprocal *risk* exchange. If that reciprocity is completely absent – if A kills with near-total impunity – doesn't this collapse the moral symmetry? Doesn't A's killing then look less like combat within a mutual bargain and more like a one-sided imposition of lethal force? If the *risk* element is essential to the *moral* permission, how can it exist when one side bears none?

  5.  **Question (Remote Warfare - "Punishment" Slippery Slope):** If the risk bargain *doesn't* hold in the remote warfare scenario, does that mean State A's killings are morally impermissible? Or do they morph into a different moral category – perhaps akin to punishment? If so, wouldn't that require a standard of individual guilt and due process that remote strikes inherently lack?
      *   *Predicted Reply:* "They remain acts of combat within an armed conflict. The permissibility is governed by IHL rules on distinction, proportionality, etc., not by the symmetry of risk. The pilots are still combatants fulfilling a military function."
      *   **Follow-Up:** Doesn't this expose a tension? If the *moral* permission to kill combatants *requires* reciprocal risk (as per your core argument), but you now say permission persists *without* that risk (relying solely on legal combatant status/function), haven't you conceded that the "risk bargain" isn't actually the *moral* foundation? What *is* the independent moral justification for killing in this asymmetric case, if not the bargain?

  6.  **Question (The "Defensive" Counter):** Soldiers on the just side often see themselves as defending their community or values. Doesn't the "risk bargain" framework morally equate their defensive killing (necessary to stop wrongful harm) with the offensive killing by the unjust side (which *causes* wrongful harm), thereby failing to capture a crucial moral asymmetry?
      *   *Predicted Reply:* "Within the combatant role, the moral justification for individual acts of killing is derived from the reciprocal bargain and adherence to IHL, not the macro-justice of the cause. A just soldier killing an unjust combatant isn't 'punishing' them; it's acting within the rules of combat."
      *   **Follow-Up:** But if the unjust combatant's killing lacks a *just cause* (which you grant by calling their *side's* war unjust), how can the *act* of killing by that unjust combatant be morally permissible *at all*? Doesn't the "bargain" effectively pardon participation in an ongoing collective moral wrong? How does the bargain generate permission for acts that are, absent the bargain, morally forbidden?

  7.  **Question (The "Innocent Aggressor" Analogy):** Imagine a purely individual case: Alice forcibly injects Bob with a drug making him violently aggressive against her. Bob, through no fault of his own, attacks Alice. Can Alice kill Bob in self-defense? *Can Bob kill Alice*? Does your "risk bargain" analogy hold here? If not, why does collective warfare change the underlying moral asymmetry?
      *   *Predicted Reply:* "War is a distinct institutional context with its own rules and roles. Individual self-defense analogies don't cleanly map onto the collective, rule-governed practice of warfare governed by IHL."
      *   **Follow-Up:** Precisely because war is institutional, doesn't that make the *creation* of the "bargain" crucial? If the institution is initiated unjustly (like Alice drugging Bob), doesn't that taint the moral validity of the "rules" *within* that imposed institution? How can participation in the unjustly created framework generate moral permissions for the aggressors?

  8.  **Question (Falsifiability - What Evidence Counts?):** What kind of empirical observation or theoretical argument, if true, would genuinely force you to reconsider or abandon the moral equality thesis grounded in the risk bargain? What does the theory *not* allow to happen, such that if it *did* happen, the theory would be proven wrong?
      *   *Predicted Reply:* "Evidence showing that soldiers universally or near-universally do *not* perceive themselves as bound by mutual risk acceptance, or that such acceptance plays no role in moderating their conduct. Or a successful demonstration that the combatant's privilege in IHL is fundamentally morally incoherent independently of practical considerations."
      *   **Follow-Up:** If historical or sociological studies showed soldiers on unjust sides frequently *do* express deep moral unease about killing just combatants precisely *because* they recognize the asymmetry of cause, wouldn't that challenge the idea that the risk bargain *overrides* that underlying moral asymmetry in practice? Doesn't this suggest the moral equality is a *legal fiction* they reluctantly operate under, not a genuine moral belief reflecting permission?

  **Key Escalation Tactics Embedded:**

  1.  **Exposing the Legal Reliance:** Follow-ups consistently push back against hiding behind LOAC/IHL by demanding the *independent moral justification* that the law is supposedly built upon. Questions 2, 4, 5, 6, and 7 directly attack this deflection.
  2.  **Targeting the Risk Core:** Questions 1, 4, and 5 specifically challenge whether risk *can* bear the moral weight she assigns it, especially when asymmetrical or absent.
  3.  **Forcing the Revisionist Dilemma:** Question 2 and its follow-up corner the "role morality vs. fundamental morality" conflict inherent in defending unjust combatants.
  4.  **Highlighting Asymmetry:** Questions 3 (coercion) and 6 (defensive purpose) emphasize moral differences the "bargain" seems to ignore.
  5.  **Demanding Falsifiability:** The final question forces her to define the boundaries of her theory, exposing its potential vulnerabilities beyond legal pragmatism.

  This structure aims to make retreating to "that's a LOAC question" increasingly untenable by demonstrating how the legal framework either presupposes the moral justification she's trying to provide (exposing circularity) or fails to resolve the core moral objections her theory faces. Good luck with the interview!
