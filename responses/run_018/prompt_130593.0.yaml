prompt: |-
  I was listening to a philosophy podcast and the host summed up the real-moral-dilemmas debate like this: defenders like Bernard Williams and Ruth Marcus think sometimes two moral obligations genuinely conflict with no right answer. They say this doesn't violate 'ought implies can' because you can satisfy each duty alone, just not both at once, and that's okay since morality is basically Berlin-style value pluralism—incommensurable goods crashing into eachother—rather than a decision procedure that always spits out one answer. They also cite agent-regret as direct proof: after you choose one horn, you still feel guilty about the other, which shows the unchosen obligation wasn't canceled, only overridden, leaving a 'moral remainder' that keeps binding you. From all this they conclude Kantianism and utilitarianism are flat-out wrong, because both theories assume consistency is mandatory and every situation has a single correct answer, so they can't handle tragic choices where consistency is literally impossible. The host even said this is why dirty-hands problems in politics are unavoidable—if consistency is impossible, leaders just have to accept they'll violate some values no matter what.

  It occures to me that the host is smuggling in a logical contradiction where there's only tension, but I'm not sure where exactly. Is this summary fair? Go part by part: what's accurate about the defenders' view, what's a subtle misrepresentation or overstatement (like mixing value pluralism with logical contradiction, or treating regret as proof of a leftover binding duty), and does the knockdown conclusion about Kant and utilitarianism actually follow? Please say how confident you are in each part of your audit and single out the point you're least sure about. Keep it under 250 words, split into at most three paragraphs.
