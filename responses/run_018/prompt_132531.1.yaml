  ### Example: Public-Health Resource Allocation for Disease Prevention

  **Decision Context:**  
  A public-health official must allocate limited resources to prevent outbreaks of two diseases: Disease X (severe) and Disease Y (mild). The official is uncertain about the probability \(p\) of a Disease X outbreak, which implies a probability \(1-p\) of a Disease Y outbreak. The credal set for \(p\) is initially \([0.3, 0.7]\). After receiving new evidence (e.g., improved epidemiological data), the interval symmetrically narrows to \([0.4, 0.6]\) without shifting its center (0.5). The official uses a **maxmin (ambiguity-averse) decision rule**: choose the action that maximizes the worst-case expected welfare.

  **Actions:**  
  - **Action A**: Allocate resources to Disease X (severe disease).  
  - **Action B**: Allocate resources to Disease Y (mild disease).  

  **Outcomes and Welfare Structure:**  
  - If Disease X outbreak occurs:  
    - Action A prevents it (high welfare due to averted severe outcomes): **welfare = 40**.  
    - Action B fails to prevent it (low welfare due to severe damage): **welfare = -100**.  
  - If Disease Y outbreak occurs:  
    - Action A fails to prevent it (moderate welfare loss due to mild damage): **welfare = 70**.  
    - Action B prevents it (moderate welfare gain): **welfare = 50**.  

  **Payoff Structure:**  
  | Action | Disease X Outbreak (\(p\)) | Disease Y Outbreak (\(1-p\)) |  
  |--------|-----------------------------|-----------------------------|  
  | **A**  | 40                          | 70                          |  
  | **B**  | -100                        | 50                          |  

  **Expected Welfare:**  
  - Action A: \( \mathbb{E}_A(p) = 40p + 70(1-p) = 70 - 30p \).  
  - Action B: \( \mathbb{E}_B(p) = -100p + 50(1-p) = 50 - 150p \).  

  ---

  ### Decision Process  
  #### **Before New Evidence (Credal Set: \(p \in [0.3, 0.7]\))**  
  - **Action A**:  
    - Worst-case \(p\) (maximizes harm): \(p = 0.7\) (high probability of X outbreak).  
    - Expected welfare: \(70 - 30 \times 0.7 = 70 - 21 = \textbf{49}\).  
  - **Action B**:  
    - Worst-case \(p\) (maximizes harm): \(p = 0.3\) (low probability of X outbreak; B does poorly when X occurs).  
    - Expected welfare: \(50 - 150 \times 0.3 = 50 - 45 = \textbf{5}\).  
  - **Maxmin Decision**:  
    - \(\min \mathbb{E}_A = 49\) > \(\min \mathbb{E}_B = 5\) → **Choose Action A**.  

  #### **After New Evidence (Credal Set: \(p \in [0.4, 0.6]\))**  
  - **Action A**:  
    - Worst-case \(p\): \(p = 0.6\) (higher end of new interval).  
    - Expected welfare: \(70 - 30 \times 0.6 = 70 - 18 = \textbf{52}\).  
  - **Action B**:  
    - Worst-case \(p\): \(p = 0.4\) (lower end of new interval; B is sensitive to low \(p\)).  
    - Expected welfare: \(50 - 150 \times 0.4 = 50 - 60 = \textbf{-10}\).  
  - **Maxmin Decision**:  
    - \(\min \mathbb{E}_A = 52\) > \(\min \mathbb{E}_B = -10\) → **Choose Action A again?**  
    - **Wait!** Recalculate: For Action B, at \(p = 0.4\), welfare is \(-10\), but at \(p = 0.6\):  
      \(50 - 150 \times 0.6 = 50 - 90 = -40\) (worse).  
    - Correct worst-case for B: \(p = 0.6\) → \(\min \mathbb{E}_B = \textbf{-40}\).  
    - \(\min \mathbb{E}_A = 52\) > \(\min \mathbb{E}_B = -40\) → **Still Action A?**  

  **Correction:** The initial setup did not produce a reversal. Here is the corrected numerical example ensuring reversal:  

  ### Corrected Welfare Structure (to induce reversal):  
  - **Action A**:  
    - Disease X outbreak: **welfare = 26**.  
    - Disease Y outbreak: **welfare = 76**.  
    - \(\mathbb{E}_A(p) = 26p + 76(1-p) = 76 - 50p\).  
  - **Action B**:  
    - Disease X outbreak: **welfare = 180**.  
    - Disease Y outbreak: **welfare = -20**.  
    - \(\mathbb{E}_B(p) = 180p - 20(1-p) = 200p - 20\).  

  **Before Evidence (\(p \in [0.3, 0.7]\)):**  
  - Action A:  
    - \(p = 0.7\): \(76 - 50 \times 0.7 = 76 - 35 = \textbf{41}\).  
  - Action B:  
    - \(p = 0.3\): \(200 \times 0.3 - 20 = 60 - 20 = \textbf{40}\).  
  - Maxmin: \(41 > 40\) → **Choose A**.  

  **After Evidence (\(p \in [0.4, 0.6]\)):**  
  - Action A:  
    - \(p = 0.6\): \(76 - 50 \times 0.6 = 76 - 30 = \textbf{46}\).  
  - Action B:  
    - \(p = 0.4\): \(200 \times 0.4 - 20 = 80 - 20 = \textbf{60}\).  
  - Maxmin: \(46 < 60\) → **Choose B**.  

  ---

  ### Reversal Explanation  
  - **Initial Choice (A)**: Worst-case for A (\(p=0.7\), welfare=41) is better than worst-case for B (\(p=0.3\), welfare=40).  
  - **After Evidence**:  
    - New worst-case for A is \(p=0.6\) (welfare=46).  
    - New worst-case for B is \(p=0.4\) (welfare=60).  
  - **Reversal**: A is initially preferred (41 > 40), but after narrowing, B is preferred (46 < 60).  

  **Why Intuition Defies the Shift**:  
  - The agent’s beliefs about \(p\) narrowed symmetrically (center unchanged at 0.5).  
  - For **every fixed \(p\)**, the expected welfare of **both actions increased** due to the exclusion of extremes:  
    - E.g., at \(p=0.5\): \(\mathbb{E}_A = 76 - 50 \times 0.5 = 51\), \(\mathbb{E}_B = 200 \times 0.5 - 20 = 80\) (B is better).  
  - However, the **worst-case \(p\) for each action migrated**:  
    - A’s worst-case shifted from \(p=0.7\) to \(p=0.6\) (less harmful).  
    - B’s worst-case shifted from \(p=0.3\) to \(p=0.4\) (dramatically less harmful: 40 → 60).  
  - The improvement for B’s worst-case (from 40 to 60) is larger than for A’s (from 41 to 46), flipping the decision.  

  ---

  ### Conceptual Diagnosis  
  The reversal illustrates three key issues:  
  1. **Failure of Dynamic Consistency**:  
     - The optimal action changes after updating beliefs, even though no new information about the relative desirability of outcomes arrived. The maxmin rule violates the principle that a plan chosen initially should remain optimal if no information contradicts it. This is intrinsic to ambiguity-averse rules with imprecise probabilities.  

  2. **Structural Difference from Bayesian Conditioning**:  
     - Narrowing the credal set symmetrically (without shifting its center) is not equivalent to Bayesian updating. Bayesian conditioning would start with a single prior, update it, and never reverse preferences without new utility-relevant information. Here, the credal set update redistributes "worst-case" scenarios non-uniformly.  

  3. **Requirement to Resolve Imprecision**:  
     - The reversal suggests that rational sequential decisions under ambiguity may require resolving the credal set into a single precise prior before any decisions. Maxmin over the entire set ignores how updates will shift worst-case scenarios, leading to time-inconsistency.  

  **Conclusion**: The reversal is a direct consequence of ambiguity aversion in dynamic settings. It highlights that **narrowing a credal set can non-neutrally redistribute worst-case scenarios**, making maxmin dynamically inconsistent. This challenges imprecise-probability frameworks unless decision rules account for future updates (e.g., via sophisticated choice).
