    So even though the interval narrowed symmetrically around 0.5, the worst-case for B improved dramatically because the low end of the interval (which was very bad for B) has been cut off.

    The reversal occurs because the worst-case prior in the initial set for action A was at a high p (0.7) and for action B at a low p (0.3), and the new set [0.4,0.6] cuts off both of these extremes. However, the improvement for B (removing p=0.3) is more significant than the improvement for A (removing p=0.7) because the function for B is steeper? 

    In this case, the expected payoff for B is more sensitive to low values of p (because at low p, B does badly) and the expected payoff for A is more sensitive to high values of p (because at high p, A does worse). By removing the very low p (0.3) that was the worst-case for B, we help B a lot. By removing the high p (0.7) that was the worst-case for A, we help A a little, but not enough to keep up.

  Conceptual issue:

    The reversal demonstrates that ambiguity aversion (as modeled by maxmin) is not dynamically consistent in the sense of not being closed under updating. In other words, the optimal policy chosen at the initial stage (choose A) is not the same as what we would choose if we could wait until after the evidence to decide, because after the evidence we would choose B.

    This is not a failure of the imprecise-probability framework per se, but rather of the maxmin decision rule. Other decision rules under imprecise probabilities (like maxmax or Hurwicz) might behave differently.

    It also shows that narrowing a credal set by conditioning (or by evidence that symmetrically narrows the interval) is not equivalent to Bayesian updating of a single prior: in the Bayesian case, we would have a single prior and update it, and the optimal action would not reverse in this way.

    However, note that in the imprecise-probability framework, conditioning should be done by updating every prior in the set. In this example, we have represented the new evidence by simply narrowing the interval symmetrically. This is appropriate if the evidence is such that it symmetrically reduces the set of possible probabilities without changing the center, which might occur with some kinds of evidence (e.g., increasing the sample size in a symmetric way).

    The reversal suggests that if we require dynamic consistency, then we must either use a decision rule that is dynamically consistent (like the smooth ambiguity model) or we must resolve the imprecision into a single prior before the sequential decision.

  Conclusion:

    The example shows a reversal of decision when using a maxmin rule after symmetrically narrowing the credal set. This reversal occurs because the worst-case scenario for each action moves when the set of possible probabilities is restricted. It highlights a tension between ambiguity aversion and dynamic consistency.
