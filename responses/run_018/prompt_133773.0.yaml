prompt: |-
  You are an experienced philosophy instructor with a background in existential phenomenology and pedagogical design for non-specialists. Before you construct the plan, take a moment to think carefully and step by step: first, sketch the conceptual dependency chain—what must be in place before the audience can understand radical freedom, and what must be in place before bad faith can appear as something other than ordinary lying; second, anticipate the misconception map—what false pictures the audience will already hold and which ones they will generate as you speak.

  Your task is to design a single fifty-minute teaching session for a reading group of curious, intellectually engaged adults who have no formal philosophy training but have recently encountered a popular article that frames Sartre’s “bad faith” as emotional self-deception—essentially, lying to yourself about how you really feel. Do not explain Sartre’s views to me directly; instead, plan exactly how you would lead them out of that misconception and into the correct structure of the idea.

  The session must rigorously separate ontological freedom—the claim that consciousness is structurally not identical to any of its roles, states, or past choices—from practical freedom, the absence of external obstacles. To make this separation stick, you must use a carrying example in which practical freedom is obviously absent: a person held in prolonged solitary confinement who nevertheless must choose how to relate to that fact (for instance, whether to interpret the confinement as total determination or as a situation still requiring an act of meaning). Specify why this scenario must include total external constraint and an unavoidable internal decision about that constraint, and explain why the familiar café-waiter illustration should be avoided at this stage—what it obscures that your chosen scenario reveals.

  Lay out the precise order of introduction: what idea comes first and why the next one depends on it; where facticity and transcendence enter; where bad faith is introduced not as dishonesty about feelings but as the specific ontological maneuver of identifying oneself wholly with one’s facticity in order to deny one’s transcendence. Identify three predictable misconceptions—such as the belief that freedom requires having real options, that Sartre is celebrating “you can do anything,” and that bad faith is just psychological denial—and state exactly where in your sequence you will head off each one, not after it has formed but before it can take root.

  Design one check-for-understanding question for the end of the session. It should reveal whether the participants have grasped radical freedom as the unavoidable burden of self-definition rather than as a power of unlimited choice, and it should be impossible to answer correctly by repeating a slogan or parroting your terms.

  Explicitly state what you will leave out at this level—such as the technical ontology of being-in-itself and being-for-itself, the analysis of “the look” and intersubjective objectification, and Sartre’s specific engagement with psychoanalysis—and confirm that you are omitting them deliberately rather than forgetting them. Do not provide any bibliography, reading list, or citations.

  After presenting the full plan, state how confident you are in the pedagogical ordering and example choice you have proposed, and single out the specific point about which you are least sure—whether it concerns placing the carrying example before the formal distinction, the risk of the solitary-confinement scenario feeling too extreme, or something else. Be brief and precise.
reasoning: |-
  Hmm, the user is asking me to design a teaching session on Sartre's concept of bad faith and radical freedom for a reading group of curious adults with no philosophy background. They've encountered a popular article framing bad faith as emotional self-deception, which needs correcting.

  I need to carefully build a conceptual dependency chain. The audience must first grasp radical freedom (ontological freedom) before they can understand bad faith properly. But radical freedom itself requires understanding that consciousness isn't identical to its roles, states, or past choices - this is foundational. Bad faith is then an ontological maneuver where someone denies their transcendence by identifying solely with their facticity. I must separate ontological freedom (structural condition) from practical freedom (external possibilities), using an example where practical freedom is absent - like someone in solitary confinement who still must choose how to interpret their situation.

  The popular café-waiter example should be avoided initially because it obscures the crucial separation between ontological and practical freedom. In that scenario, the waiter has practical options, which might confuse learners into thinking freedom requires those options. The confinement scenario better reveals that radical freedom persists even without choices.

  I need to anticipate three key misconceptions: 1) that freedom requires having real-world options, 2) that Sartre is saying "you can do anything," and 3) that bad faith is just psychological denial. I'll address each preemptively in my sequence: the first by using the confinement example early, the second by emphasizing that freedom is a burden, not empowerment, and the third by distinguishing bad faith from ordinary lying when introducing the concept.

  For the check-for-understanding question, I'll create something that requires applying the concept to a new scenario - perhaps asking how a person who believes their personality is fixed might be in bad faith, forcing them to articulate the denial of transcendence without using jargon.

  I'll deliberately omit technical ontology like being-in-itself/for-itself, intersubjective objectification ("the look"), and Sartre's critique of psychoanalysis to keep the session accessible. These are important but would overwhelm beginners.

  I'm confident in the pedagogical ordering overall, especially using the confinement scenario early to establish the ontological/practical freedom distinction. The point I'm least sure about is whether participants might fixate on the extremity of solitary confinement and miss the universal application of radical freedom. I'll mitigate this by immediately connecting it to everyday examples after establishing the core concept.
answer: |-
  Here is the precise pedagogical sequence designed to dismantle the "emotional self-deception" misconception and build an accurate understanding of Sartre's radical freedom and bad faith:

  **Conceptual Dependency Chain:**
  1.  **Consciousness as Not-Thing-Like:** Must establish that consciousness is not a fixed object with predetermined properties.
  2.  **Radical Freedom (Ontological):** Depends on (1). The structural inability of consciousness to *be* any one of its characteristics, roles, or past states – it always exceeds them ("transcendence").
  3.  **Facticity:** The concrete, given aspects of one's situation (body, past, environment, social roles). Introduced after (2) as the *counterpoint* consciousness must engage with.
  4.  **Bad Faith:** Depends on (2) and (3). The specific act of denying (2) by *pretending* one *is* identical to one's (3), thereby evading the anxiety of freedom.

  **Misconception Map & Preemptive Countering:**
  *   **Pre-existing:** Bad faith = lying to yourself about feelings (emotional self-deception).
  *   **Predictably Generated:**
      *   **M1: Freedom requires real options/power (confusing ontological & practical freedom).** *Countered at Step 2.*
      *   **M2: Radical freedom means "you can do anything" (empowerment fantasy).** *Countered at Step 4/Introduction of Bad Faith.*
      *   **M3: Bad faith is just psychological denial or weakness.** *Countered at Step 5.*

  **The Session Plan (50 mins):**

  1.  **Grounding & Target Misconception (5 mins):**
      *   Start: "The article framed bad faith as lying to yourself about how you really *feel*. Let's test that. Imagine someone who *truly believes* the emotion they express, even if it's hiding something deeper. Is that bad faith? Or just... being wrong?" (Prompt: Likely "just being wrong").
      *   State: "Sartre points to something more fundamental *before* questions of hidden feelings or psychology. We need to start with his view of what *we* are."

  2.  **Introducing Consciousness & Radical Freedom via the Carrying Example (15 mins):**
      *   **Example:** "Consider a person held in prolonged solitary confinement. Guards control everything: food, light, movement. They cannot leave. Practical options? Essentially zero."
      *   **Crucial Internal Dimension:** "But Sartre insists something crucial remains unfree: *how this person relates to their confinement*. Do they see themselves *defined entirely* by it? ('I *am* just a prisoner, broken'). Or do they see it as a *situation* they still *respond* to, even internally? ('This is my reality, but I refuse to let it define my spirit')."
      *   **Why this Example?** It forces the separation:
          *   **Practical Freedom:** Absent (no options).
          *   **Radical (Ontological) Freedom:** Unavoidably present (the *inescapable necessity to interpret, assign meaning, and define oneself in relation to the fact* of confinement). This is the core revelation obscured by examples with options (like the waiter).
      *   **Key Point:** "Even here, with zero power, the person *cannot not choose* how to understand themselves *in* this situation. Consciousness isn't a *thing* stuck in its circumstances; it's an activity of *meaning-making* about those circumstances. *This* unavoidable activity is radical freedom." *<– Preempts M1 (Freedom=Options) by showing freedom persists without them.*

  3.  **Naming the Poles: Facticity & Transcendence (10 mins):**
      *   "Sartre gives names to this tension. **Facticity:** The brute facts I *am given* – my body, my past actions, my current situation (like confinement), the roles I occupy (like 'prisoner')."
      *   "**Transcendence:** Not 'magic,' but the way consciousness *is never* fully captured by any facticity. It's the inherent capacity to *surpass* the given, to project meaning onto it, to interpret it, to define oneself in relation to it – like the prisoner choosing defiance or despair. *This* is the source of radical freedom." *<– Reinforces Step 2, introduces technical terms functionally.*

  4.  **Introducing Bad Faith as Ontological Evasion (10 mins):**
      *   "Radical freedom isn't empowering; Sartre calls it a *burden*. It brings anxiety – the responsibility to define oneself without excuses."
      *   "**Bad Faith:** This is the escape hatch. It's the attempt to *pretend* I *am* only my facticity, to *deny* my transcendence. 'I *am* just a prisoner' (denying the freedom to interpret/define oneself otherwise). Or 'I *am* just my anger' (denying I can choose how to *be* towards that feeling)."
      *   **Contrast:** "It's *not* lying about hidden feelings ('I'm not angry!' when you are). It's *identifying completely* with a feeling, role, or fact ('I *am* anger itself!' or 'I *am* nothing but a waiter!') to *avoid* the anxiety of knowing I *transcend* it – that I choose to act angry, that I choose to play the waiter role. I turn myself into a fixed *thing* ('in-itself') to escape being a free, responsible consciousness ('for-itself')." *<– Directly dismantles the 'emotional self-deception' misconception. Preempts M2 (Freedom=Power) by framing it as burden/evasion.*

  5.  **Clarifying Bad Faith vs. Everyday Concepts (7 mins):**
      *   "So, is bad faith just weakness or denial? No. It's a specific *ontological maneuver*, a fundamental misrepresentation of *what we are*. It's strategically collapsing oneself into facticity."
      *   "It's not unconscious repression (like Freud). Sartre thinks we are *conscious* of bad faith; we actively collude with ourselves ('sincerely' believing we *are* our role while subtly knowing we're playing it)." *<– Preempts M3 (Bad Faith=Psychological Denial).*
      *   Brief everyday example (post-confinement): "Think of someone saying 'I *am* shy' as a reason not to speak, denying they *choose* to act shyly in situations. They identify wholly with the facticity ('shyness') to evade the transcendence (the choice to act differently)."

  6.  **Check-for-Understanding Question (3 mins):**
      *   "Imagine someone who says, 'I just *am* an impatient person; it's my nature, I can't help it.' Using today's concepts (facticity, transcendence, radical freedom, bad faith), *how* would Sartre analyze this statement? Don't just use the terms; explain *why* it reflects bad faith specifically." *<– Requires identifying the collapse into facticity ('impatient nature') to deny transcendence (the freedom to *act* patiently despite impulses) and the evasion of responsibility. Parroting won't suffice.*

  **Deliberate Omissions (Confirming Awareness):**
  *   The full technical ontology of Being-in-itself (en-soi) and Being-for-itself (pour-soi) beyond the functional distinction made.
  *   The analysis of "The Look" (le regard) and intersubjective objectification.
  *   Sartre's detailed critique of psychoanalysis (beyond the brief contrast to unconscious repression).
  *   The café waiter example (intentionally avoided to prevent conflation of ontological and practical freedom early on).

  **Pedagogical Confidence & Uncertainty:**
  *   **Confidence:** High in the core ordering (confinement example *first* to isolate ontological freedom, followed by facticity/transcendence, *then* bad faith as evasion). The confinement example is pedagogically necessary to shatter the freedom=options assumption (M1).
  *   **Least Sure Point:** Whether participants will fully grasp the *active, conscious* nature of the bad faith maneuver (Step 5) versus seeing it as passive self-deception. The subtlety of "sincere" self-deception might be the hardest leap after dismantling the emotional lie model. Mitigation: Emphasizing the "collusion" and "strategic misrepresentation" aspects strongly.
