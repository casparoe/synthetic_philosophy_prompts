answer: |-
  Here’s a blank-verse sonnet tracking Plutarch’s comparative method and its refusal of easy moral resolution, with the volta enacting the fracture:

  **Parallels**

  Two figures held against the light: the Greek,
  The Roman. Each held virtue like a blade
  Forged sharp by custom. Clemency, once sleek,
  Grew tangled in the Persian thicket, frayed
  By satrap-pleading; while the other hand,
  Raised in the Forum’s glare, stayed merciful
  (Or seemed to stay) through calculated stand,
  A discipline the Senate deemed too cruel
  To spare. But whose flaw? Or whose context bent
  The metal past its temper? Line breaks here.
  The paired reflection fractures. What was meant
  As measure frays to strangeness, sharp and sheer.
  No single light reveals a common face;
  Twin flames burn shadowed, singular, in place.

  ---

  **How it meets your specifications:**

  1.  **Blank Verse Sonnet:** 14 lines of unrhymed iambic pentameter.
  2.  **Conceit:** Explores Plutarch’s comparative method ("Two figures held against the light," "paired reflection") versus hagiography/simple exemplars. Specific virtues named: "Clemency," "discipline" (implying ambition/control).
  3.  **Political Structure Twist:** The Greek's clemency is hampered by "Persian thicket" (complex monarchy/personal loyalty), the Roman's by "Forum’s glare" and "Senate deemed too cruel" (republican politics/public perception).
  4.  **Volta at Line 9:** "But whose flaw? Or whose context bent / The metal past its temper?" This pivotal question shatters the neat comparison. The volta explicitly rejects assigning blame ("whose flaw?") and introduces the core Plutarchan tension ("whose context bent").
  5.  **Refusal of Resolution/Syntax Fracture:**
      *   The question mark interrupts the flow.
      *   "Line breaks here." is a self-conscious meta-commentary *and* a syntactic rupture, visually and conceptually breaking the parallel structure established in the octave.
      *   The following lines describe the *failure* of comparison ("frays to strangeness") instead of resolving it.
  6.  **Avoids Sermonizing:** No direct "learn from this" message. The final lines ("No single light...", "Twin flames burn shadowed, singular") emphasize irreducible difference and complexity, not a lesson.
  7.  **Specific to Plutarch Readers:** References "satrap-pleading" (Persian context), "Forum’s glare," "Senate deemed too cruel" (Roman context), the core methodology ("paired reflection," "measure"), and the outcome Plutarch often achieves ("strangeness"). The "metal/temper" metaphor resonates with Plutarch's interest in character formation.
  8.  **"Stranger, Less Exemplary":** The figures end "shadowed, singular" – unique, complex, and defying simple categorization as models ("No single light reveals a common face").
  9.  **Form Carries Idea:** The volta's syntactic break and the concluding image of separate, shadowed flames formally enact the refusal to flatten the lives into a single moral or exemplary lesson, keeping the comparative tension open.
