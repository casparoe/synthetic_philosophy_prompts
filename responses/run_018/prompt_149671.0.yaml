prompt: |-
  Write a formal research proposal for a one-semester philosophy-of-science term paper (approximately 5,000 words) addressing the following problem: standard philosophical discussions separate metaphysical determinism from epistemic predictability, treating chaotic dynamics as a case where determinism holds but prediction fails due to sensitive dependence on initial conditions. However, in non-hyperbolic chaotic systems—those with mixed regular and chaotic regions that better approximate real physical dynamics—the shadowing lemma fails: approximate numerical trajectories may diverge not merely from a specific true trajectory, but from all true trajectories in the neighborhood. I propose to examine whether this "shadowing failure" establishes a genuinely intermediate category—deterministic dynamics that are not merely unpredictable in practice, but "untrackable" even in principle—thereby disrupting the standard determinism/predictability binary rather than merely deepening the epistemic gap. The proposal must include: (a) a precise statement of the research question with a determinate answer; (b) an explanation of why the standard "epistemic limitation" account and the "computational irreducibility" account leave the problem unresolved; (c) the methodological approach, specifying which conceptual distinctions (e.g., metaphysical vs. methodological determinism, strong vs. weak shadowing, ontic vs. epistemic chaos) will be used, how the argument will be structured over the semester, and why this approach is preferable to a historical survey or a formal modeling approach; (d) a clear description of what would count as a successful result and what conditions would count as failure (for instance, if the analysis collapses back into a familiar epistemic limitation story); and (e) an honest assessment of scope and risks given a single semester. Do not request a bibliography, literature review by citation, or reading list; citations will be added separately. After the proposal text, provide a brief structured summary as a JSON object with exactly these named fields: "core_question" (a concise statement), "niche_intervention" (the specific conceptual move being proposed), "method" (the analytical strategy), "success_criterion" (what a positive result looks like), "failure_criterion" (what would make the project fail), and "scope_note" (the realistic assessment).
reasoning: |-
  We are writing a formal research proposal for a one-semester philosophy of science term paper (approx. 5,000 words). The topic is about non-hyperbolic chaotic systems and the failure of the shadowing lemma, and whether this introduces a new category between determinism and predictability.

  The proposal must include:
  (a) A precise research question with a determinate answer.
  (b) Why standard accounts (epistemic limitation and computational irreducibility) leave the problem unresolved.
  (c) Methodological approach: conceptual distinctions, structure of argument, and why this approach is better than historical survey or formal modeling.
  (d) Success and failure criteria.
  (e) Honest assessment of scope and risks.

  After the proposal, we provide a JSON summary with specific fields.

  Let's structure the proposal:

  I. Introduction and Problem Statement
     - Introduce the standard separation of determinism and predictability.
     - Introduce chaotic dynamics and the shadowing lemma in hyperbolic systems.
     - Present non-hyperbolic systems and shadowing failure.

  II. Research Question
     - Precise statement: "Does shadowing failure in non-hyperbolic chaotic systems establish a genuinely intermediate category between determinism and unpredictability, thereby disrupting the standard binary?"

  III. Background and Motivation
     - Explain the standard "epistemic limitation" account (sensitive dependence on initial conditions) and why it is seen as an epistemic issue.
     - Explain the "computational irreducibility" account (Wolfram) and why it is also an epistemic limitation.
     - Argue why these accounts do not resolve the issue for non-hyperbolic systems: because shadowing failure means that the numerical trajectory does not shadow any true trajectory, which is a different kind of failure.

  IV. Methodological Approach
     - Conceptual distinctions:
          - Metaphysical determinism (the world is deterministic) vs. methodological determinism (how we model it).
          - Strong shadowing (hyperbolic) vs. weak shadowing (non-hyperbolic) and shadowing failure.
          - Ontic chaos (a feature of the system itself) vs. epistemic chaos (a limitation of our knowledge).
     - Argument structure:
          Phase 1: Clarify the standard accounts and their limitations (weeks 1-3).
          Phase 2: Analyze the mathematical properties of non-hyperbolic systems and shadowing failure (weeks 4-6).
          Phase 3: Philosophical interpretation: does shadowing failure introduce a new category? (weeks 7-9).
          Phase 4: Compare with alternative accounts and defend the intermediate category (weeks 10-12).
          Phase 5: Conclusion and implications (weeks 13-14).
     - Why this approach? 
          We are doing conceptual analysis with a focus on interpreting mathematical results, not a historical survey (which would not address the specific mathematical issue) nor a formal modeling approach (which is beyond the scope of a philosophy paper and would require extensive mathematical work).

  V. Success and Failure Criteria
     - Success: If we can establish that shadowing failure in non-hyperbolic systems leads to a situation where the system is deterministic but there is a breakdown in the relationship between the model and reality that is not merely epistemic (i.e., it's not just about our lack of knowledge but about the structure of the system). This would be a positive result showing an intermediate category.
     - Failure: If the analysis shows that shadowing failure is just another form of epistemic limitation (e.g., because with infinite precision we could track the true trajectory) or if it collapses into computational irreducibility. Also, if the intermediate category is not sustainable and we end up with the same binary.

  VI. Scope and Risks
     - Scope: We focus on non-hyperbolic chaotic systems and the shadowing lemma failure. We will not cover all types of chaos or all aspects of unpredictability. We will use key examples (e.g., the standard map, Henon map) but without extensive simulations.
     - Risks: 
          - The mathematics might be too complex and time-consuming for a semester.
          - It might be challenging to draw a clear philosophical distinction.
          - The intermediate category might be rejected by existing philosophical frameworks.
     - Mitigation: Focus on conceptual interpretation rather than deriving new mathematical results. Rely on existing mathematical literature for the properties of non-hyperbolic systems.

  Now, we write the proposal in formal academic style.

  After the proposal, we write the JSON summary.
answer: |-
  ### Research Proposal: Shadowing Failure in Non-Hyperbolic Chaos and the Disruption of the Determinism-Predictability Binary  

  #### (a) Research Question  
  Does the shadowing lemma’s failure in non-hyperbolic chaotic systems—where approximate numerical trajectories diverge from *all* true trajectories in their neighborhood—establish a category of deterministic dynamics that are *untrackable in principle*, thereby creating a conceptual space intermediate to metaphysical determinism and epistemic predictability?  

  **Determinate Answer**: Yes, if shadowing failure implies that no finite-precision trajectory corresponds to *any* true solution of the deterministic equations. No, if such failure remains reducible to epistemic constraints (e.g., measurement error) or computational limits.  

  #### (b) Problem with Standard Accounts  
  The **epistemic limitation account** (e.g., Laplacean demon thought experiments) treats unpredictability in chaos as solely arising from sensitive dependence on initial conditions: true trajectories exist but are practically unknowable. The **computational irreducibility account** (e.g., Wolfram, 2002) posits that some systems cannot be predicted without full simulation, but this still assumes trajectories *exist* and are computationally inaccessible.  

  **Why unresolved**: Both accounts presuppose that approximate models *shadow* (i.e., stay close to) *some* true trajectory over time. Non-hyperbolic systems (e.g., the standard map or double pendulum) violate this via "shadowing failure": numerical solutions diverge from *all* true trajectories in phase space. This is not merely imperfect knowledge or computational cost but a structural mismatch between models and reality. Neither account addresses whether determinism itself is methodologically undermined when *no* true trajectory aligns with finite-precision representations.  

  #### (c) Methodological Approach  
  **Conceptual Distinctions**:  
  - *Metaphysical determinism* (state evolution is uniquely fixed by laws) vs. *methodological determinism* (modelling practices assume determinism).  
  - *Strong shadowing* (hyperbolic systems) vs. *weak shadowing* (non-hyperbolic systems with transient chaos) vs. *shadowing failure*.  
  - *Ontic chaos* (indeterminism in dynamics) vs. *epistemic chaos* (predictive limitations).  

  **Argument Structure**:  
  1. **Weeks 1–3**: Critique the determinism/predictability binary using classical chaos (e.g., Lorenz attractor) to show epistemic limitation dominates discourse.  
  2. **Weeks 4–6**: Analyze shadowing failure in non-hyperbolic systems (e.g., Hamiltonian systems with mixed phase spaces), demonstrating its irreducibility to measurement error.  
  3. **Weeks 7–9**: Argue that shadowing failure introduces "methodological indeterminism": deterministic equations lack *tractable* physical realizations under finite resolution.  
  4. **Weeks 10–12**: Defend "untrackability in principle" as intermediate: determinism holds metaphysically, but no epistemic access exists *even counterfactually*.  

  **Why this approach?** A historical survey (e.g., Poincaré to Prigogine) would not engage technical nuances of shadowing. Formal modeling (e.g., simulating attractors) risks conflating mathematical artifacts with philosophical implications. Conceptual analysis prioritizes clarity on *what determinism demands of models*, which is core to the problem.  

  #### (d) Success and Failure Criteria  
  **Success Criterion**: Establishing that shadowing failure severs the link between deterministic equations and their finite-precision representations *in principle*, creating a distinct category: systems where determinism holds metaphysically but models are "untrackable" (not just unpredictable). This requires showing that:  
  - The divergence is not remediable by better instruments or algorithms.  
  - It violates counterfactual tracking (e.g., "if we knew initial conditions exactly...").  

  **Failure Criterion**: Collapse into familiar epistemic limitation if:  
  - Shadowing failure is shown to depend on contingent computational constraints.  
  - The "untrackable" category reduces to computational irreducibility.  
  - No coherent philosophical distinction emerges from mathematical cases.  

  #### (e) Scope and Risks  
  **Scope**: Focus on Hamiltonian systems (e.g., standard map) as exemplars of non-hyperbolic chaos. Exclude quantum chaos or relativity. Rely on mathematical proofs (e.g., Grebogi et al. 1988) over original simulations.  
  **Risks**:  
  - Technical complexity may obscure philosophical claims.  
  - Ambiguity in "in principle" untrackability could invite conflation with epistemic limits.  
  - Time constraints may preclude full engagement with dynamical systems theory.  
  **Mitigation**: Anchor arguments in simple cases (e.g., weakly chaotic orbits); use conceptual scaffolding to isolate philosophical novelty.  

