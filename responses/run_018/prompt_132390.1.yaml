  For positions accepting looping: Calibration paths will include stabilizationist realists (awkward: explain diagnostic expansion not creating the condition) and dimensional calibrationists (awkward: abandon categories that advocacy improved). Distortion paths include critical realists (awkward: category persists despite distortion) and dimensional abolitionists (awkward: loss of advocacy gains). Some combinations seem unoccupied, like ontological failure + preservation - probably because preserving a non-referring category is incoherent.

