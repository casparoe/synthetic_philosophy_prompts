answer: |-
  A genuinely non-Whiggish theory must rigorously reject retrospective inevitability while explaining historical perception, preserving critical distinctions, respecting scientific constraints, and handling normatively charged cases without teleology.

  **Core Criteria for a Non-Whiggish Theory of History:**

  | Criterion Type          | Specific Requirement                                                                                                                               | Motivation (Why Essential)                                                                                                                                                                | Non-Negotiable? | Most Damaging to Casual Accounts? |
  | :---------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :-------------------------------- |
  | **Phenomena to Explain** | 1. Account for pervasive human tendency to perceive teleology & patterns in contingent sequences (e.g., hindsight bias, narrative craving).         | Explains *why* Whiggishness is cognitively seductive despite being flawed; addresses anthropocentric pattern-matching.                                                                      | Non-Negotiable  | -                                 |
  | **Critical Distinctions** | 2. **Rigorously separate explaining *how* an outcome occurred from morally/politically *endorsing* it.**                                            | Prevents justifying past/present injustices as "necessary steps" or conflating historical explanation with normative validation.                                                            | **Non-Negotiable** | **YES (Core Failure)**            |
  |                         | 3. **Maintain absolute distinction between diachronic contingency (path-dependence, chance events) and synchronic functional/system explanations.** | Ensures functional explanations (e.g., "X served stability") don't imply historical necessity; protects against smuggled teleology.                                                         | **Non-Negotiable** | YES                               |
  |                         | 4. Clearly differentiate historical *significance* (impact relative to context) from modern *relevance* or perceived *progress*.                   | Prevents present concerns dictating historical importance; allows past actors' perspectives validity.                                                                                      | Non-Negotiable  | -                                 |
  | **Scientific Constraints** | 5. Be compatible with cognitive science on memory, perception, hindsight bias & pattern recognition (e.g., brains impose narrative coherence).      | Theory must align with how humans *actually* process temporal information; explains source of Whig temptation.                                                                             | Non-Negotiable  | -                                 |
  |                         | 6. Be compatible with evolutionary biology (contingency, path-dependence, lack of teleology, multiple equilibria – like ecological succession).    | Provides a robust naturalistic model for non-teleological change; contradicts notions of inherent direction.                                                                               | **Non-Negotiable** | YES                               |
  | **Handling Hard Cases** | 7. Explain episodes labelled "progress" or "revolution" (scientific, social, political) without assuming their outcomes were inevitable or "better". | Tests avoidance of presentism; must account for radical change without teleology (e.g., contingency in scientific discovery, contested gains in social reforms).                           | Non-Negotiable  | -                                 |
  |                         | 8. Account for "decline", "collapse", or "stagnation" narratives without framing them as deviations from an assumed progressive norm.              | Counters Whiggish assumption that "progress" is the default state; validates complex trajectories.                                                                                         | Non-Negotiable  | -                                 |
  |                         | 9. Handle histories where Western notions of "progress" are irrelevant or inapplicable (e.g., non-linear time conceptions, cyclical histories).    | Prevents Eurocentric/teleological bias; demands framework validity across diverse cultural understandings of time/change.                                                                   | Non-Negotiable  | -                                 |
  | **Nice-to-Haves**       | 10. Provide explicit methodology for identifying & countering implicit teleological language in sources & historiography.                         | Enhances practical application & critical rigour for historians.                                                                                                                          | Nice-to-Have    | -                                 |
  |                         | 11. Integrate multi-scalar analysis (individual actions, institutional constraints, environmental factors) without privileging a "prime mover".     | Reflects ecological complexity; avoids simplistic determinism (economic, technological, etc.) often used as teleology proxy.                                                              | Nice-to-Have    | -                                 |

  **Key Reasoning:**

  *   **Rejecting Retrospective Inevitability (Distinction 2 & 3):** This is the absolute core. Whiggishness fundamentally mistakes *what happened* for *what had to happen*. A non-Whiggish theory *must* show how outcomes depended on specific, contingent sequences of events, actions, and contexts, where plausible alternatives existed at critical junctures. This directly dismantles the "past led inevitably to us" fallacy. Conflating explanation with endorsement (Distinction 2) is the most pervasive and damaging failure in casual accounts, morally laundering the past.
  *   **Contingency as Foundational (Constraint 6, Phenomena 1):** Drawing on your ecology, history, like succession, is path-dependent. Small perturbations (disturbances, individual choices, chance events) can lead to divergent outcomes. The theory must embed this unpredictability. Cognitive science (Constraint 5) explains *why* this is hard for us: our brains are wired for coherent, causal narratives, often imposing purpose on randomness.
  *   **Hard Cases as Litmus Tests (Cases 7, 8, 9):** Explaining the rise of modern science or democratic norms *without* implying their triumph was preordained or inherently superior to alternatives is crucial. Similarly, the theory must handle perceived "declines" without framing them as failures against a progressive ideal. It must be culturally non-parochial.
  *   **Functional ≠ Teleological (Distinction 3):** A system *can* have functional elements (e.g., feudalism providing local order) without those functions being the *purpose* of its emergence or implying it was "meant" to develop that way. This distinction prevents a major source of subtle Whiggishness where functional explanations imply historical necessity.

  The single requirement doing the most damage to casual accounts is **rigorously separating explaining an outcome from morally endorsing it (Distinction 2)**, as it directly challenges the moralising presentism inherent in Whig history and forces explicit acknowledgement of contingency and lost possibilities.
