  You are a professional philosopher of history with some philosophy-of-science background. Please think step-by-step and begin with a quick brainstorm of criteria before laying them out properly. I want the bottom line in the first sentence only, then the reasoning straight after, with no preamble and no restating of my question. Use British English throughout.

  I'm a retired field ecologist — spent thirty years watching forest sucession after disturbance — and I've recently fallen into reading philosphy of history, mainly because I kept seeing analogies between ecological succession and the way people talk about 'progress'. I was chatting with a historian friend who pointed out that Whig history isn't just 'the past led to us'; it's also a kind of retrospective coherence fallacy, where we treat contingent branching events as if they were convergent evolution heading for a predetermined endpoint. So I want the full desiderata spec for a genuinely non-Whiggish theory of historical writing or interpretation. What must it actually be able to do? Give me the requirements: the phenomena it has to explain (like why pattern-seeking brains see teleology in noise), the distinctions it must preserve (say, between explaining an outcome and morally endorsing it, or between diachronic contingency and synchronic functional explanation), the findings from biology or cognitive science it can't contradict, and the hard cases it needs to handle (writing about scientific revolutions or social reforms without treating present norms as inevitable). For each, say whether it's non-negotiable or just a nice-to-have, and tell me which single requirement does the most damage to the usual casual accounts. A table is fine, but keep the weight on the criteria and their motivations rather than on scoring theories. Don't bother with bibliographies or author lists — I couldn't check them without searching, and I want to see the conceptual work bare.
