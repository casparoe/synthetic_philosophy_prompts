prompt: |-
  I am preparing a handout for my undergraduate seminar in political philosophy on the franchise, and I want a decision tree that takes a student from the starting commitment that a democratic government should be accountable to the people to a named position on who may vote and whether they must vote. Build the tree from the logical space rather than from a list of authors: first the diagnostic questions, then the positions occupying each combination of answers. I need four to five branch nodes and six to eight leaves. Each node must be phrased as a question a student could answer without knowing where it leads, and at least two nodes must be anchored in a concrete case (a seventeen-year-old who pays income tax, a non-citizen who has resided in the country for a decade, the analogy between voting and jury service). Crucially, the tree must treat the extent of the franchise and the obligation to exercise it as separate axes, so that compulsory voting for citizens only and voluntary voting for all residents do not get forced onto the same branch. The leaves must include: the liberal status quo (adult citizens, voluntary), compulsory voting on the jury-duty model, residence-based enfranchisement of non-citizens, a lowered voting age defended on the ground that age is only a proxy for competence, epistocracy, and at least one logically available but largely undefended combination (say, mandatory voting for non-citizen residents), with a sentence diagnosing whether it is incoherent, merely unattractive, or simply unexplored. Attach one sentence to each leaf stating its most awkward commitment, flag any pair of leaves your tree cannot genuinely separate, and write the handout in American English.
reasoning: |-
  Okay, the user is preparing a handout for an undergraduate seminar on political philosophy, specifically about the franchise (voting rights). They want a decision tree that starts from the core democratic principle that government should be accountable to the people and leads students to different positions on who can vote and whether voting should be compulsory. 

  First, I need to unpack their requirements carefully. The tree must:
  - Be built from logical space, not authors
  - Have 4-5 branch nodes (diagnostic questions)
  - Result in 6-8 leaf positions
  - Include concrete cases in at least two nodes (e.g., 17yo taxpayer, long-term non-citizen resident, jury analogy)
  - Treat franchise scope (who votes) and obligation (must vote?) as separate dimensions
  - Cover specific positions: liberal status quo, jury-model compulsory voting, resident-based non-citizen voting, lowered voting age, epistocracy, and one "odd" combination
  - Add one-sentence "awkward commitment" per leaf
  - Flag any indistinguishable positions
  - Use American English

  Hmm, the challenge is structuring questions that feel organic but cleanly separate the dimensions. The accountability principle is a great starting point because every position will claim to uphold it - the divergence comes in interpreting what accountability requires. 

  For the franchise axis, I see three key forks:
  1. Does accountability require equal voice? (No → epistocracy)
  2. If equal voice, does it require universal suffrage? (No → competence thresholds)
  3. If universal, what defines the "people"? (Citizenship vs. residence)

  For obligation:
  4. Should voting be treated as a right or duty? (Duty → compulsory)
  5. If a duty, is it like jury service? (Yes → sanctions model)

  The concrete cases fit naturally: 
  - 17yo taxpayer tests competence thresholds 
  - Long-term resident tests "people" definition
  - Jury analogy tests duty framing

  Now for the leaves - I'll need:
  - Liberal status quo (adult citizens, voluntary)
  - Compulsory voting (citizens only)
  - Resident voting (non-citizens included, voluntary)
  - Lowered voting age (16+ citizens, voluntary)
  - Epistocracy (competence test, voluntary)
  - The "odd" one: mandatory resident voting (non-citizens required to vote)
  - Bonus: Could add universal compulsory (citizens + residents must vote) if needed for 7 leaves

  The undefended combination (mandatory non-citizen voting) is fascinating - it's not incoherent if you see voting as a residency-duty, just politically radioactive. Its awkwardness is forcing non-citizens to participate in a polity they can't fully belong to.

  Potential overlap risk: If a student thinks "equal voice" requires no competence thresholds AND defines "people" as citizens, that leads straight to liberal status quo. But if they later support compulsory voting, that becomes a separate branch. The tree handles this by making obligation the final question.

  Each leaf's awkward commitment should highlight its toughest sell:
  - Epistocracy: "Excludes intelligent but uneducated people"
  - Mandatory non-citizen voting: "Coerces political participation from non-members"

  The handout tone should be accessible but rigorous - undergrads need clear framing without dumbing down. American English means "residency" not "residence", "jail" not "gaol", etc.

  Final structure:
  Start: Accountability principle
  Q1: Equal voice? → No: Epistocracy branch
  Q2: Universal suffrage? → No: Age threshold debate (with 17yo case)
  Q3: Define "people" → Citizenship vs. residence (with long-term resident case)
  Q4: Right or duty? → Splits voluntary/mandatory
  Q5: (If duty) Jury analogy? → Splits sanction severity

  That gives 7 distinct leaves covering all required positions while keeping obligation fully separate from franchise scope. Time to draft the actual tree...
answer: |-
  ## Decision Tree: Who Votes and Must They Vote?  
  *Starting Commitment: Democratic governments should be accountable to the people.*  

  **Branch 1: Does "accountability" require that all members of "the people" have an equal formal voice in government?**  
  - **Yes** → Proceed to Branch 2.  
  - **No** → **Epistocracy (e.g., voting restricted by competence tests)**  
    *Most awkward commitment: Excludes intelligent but uneducated people (e.g., autodidacts) from formal political power.*  

  **Branch 2: If all members of "the people" deserve an equal voice, must suffrage be universal among them?**  
  - **Yes** → Proceed to Branch 3.  
  - **No** → **Lowered Voting Age (e.g., 16+)**  
    *Anchor case: Should a competent 17-year-old who pays income tax be excluded?*  
    *Most awkward commitment: Grants suffrage to some less-informed 16-year-olds while excluding knowledgeable 15-year-olds.*  

  **Branch 3: Who constitutes "the people" owed accountability?**  
  - **Citizens only** → Proceed to Branch 4.  
  - **All long-term residents** → **Residence-Based Franchise (e.g., non-citizens after 10 years)**  
    *Anchor case: Should a non-citizen living/working in the country for a decade have no vote?*  
    *Most awkward commitment: Grants voting rights to residents with no path to citizenship or loyalty obligations.*  

  **Branch 4: Is voting primarily an individual right or a civic duty?**  
  - **A right** → **Liberal Status Quo (adult citizens, voluntary voting)**  
    *Most awkward commitment: Allows apathetic citizens to outsource political decisions to motivated minorities.*  
  - **A duty** → Proceed to Branch 5.  

  **Branch 5: Should voting duty be enforced like jury service?**  
  - **Yes** → **Compulsory Voting (citizens only, enforced like jury duty)**  
    *Anchor analogy: If citizens can be compelled to sit on juries, why not to vote?*  
    *Most awkward commitment: Imposes penalties (e.g., fines) on non-voters regardless of their political engagement.*  
  - **No** → **Mandatory Voting for Non-Citizen Residents (logically available but undefended)**  
    *Most awkward commitment: Forces non-citizens to participate in a polity they cannot fully join (e.g., no right to run for office).*  
    *Diagnosis: Largely unexplored; deemed unattractive due to tension between coercion and lack of full membership.*  

  ---

  **Final Leaf Positions:**  
  1. **Epistocracy**  
  2. **Lowered Voting Age**  
  3. **Residence-Based Franchise**  
  4. **Liberal Status Quo**  
  5. **Compulsory Voting (jury-duty model)**  
  6. **Mandatory Voting for Non-Citizen Residents**  
  7. *Bonus:* If Branch 4 had included non-citizens, **Universal Compulsory Voting** would emerge (not required, but logically coherent).  

  **Tree Notes:**  
  - **Obligation/Separability Success:** The tree cleanly separates franchise scope (Branches 2–3) from obligation (Branches 4–5).  
  - **Indistinguishable Pair:** *Lowered Voting Age* and *Liberal Status Quo* both assume citizenship-based suffrage; they diverge only on age thresholds. The tree cannot isolate "voluntary adult citizens *without* considering age" as a standalone position.  
  - **Key Divergences:**  
    - Branch 1 challenges equal voice → epistocracy.  
    - Branch 3 defines "the people" → citizenship vs. residence.  
    - Branch 5 distinguishes duty models → jury-like enforcement vs. alternatives.  

  **Handout Tips:**  
  - Answer each node based on your intuition *before* looking ahead.  
  - Debate the concrete cases (taxpaying teen, long-term resident) to stress-test principles.  
  - The "undefended" leaf shows that logical coherence ≠ political viability.
