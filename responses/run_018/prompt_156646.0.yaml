answer: |-
  Based on your verdicts and the need for a unifying principle, I propose the following:

  **The Dirty Hands Principle:**  
  *An act constitutes morally necessary wrongdoing that stains the agent (dirty hands) if and only if:*  
  **(a)** *It is a deliberate moral transgression* (violating a core norm like non-torture or truth-telling),  
  **(b)** *Personally undertaken by an officeholder* (not delegated or indirect),  
  **(c)** *Structurally necessitated by their role's protective function* (to shield fundamental public goods like life or systemic survival),  
  **(d)** *In an exceptional crisis where alternatives fail* (imminent catastrophe with no morally clean options), **and**  
  **(e)** *Absent private gain, with full ownership of the moral cost* (the agent bears the stain without self-exoneration).  

  ---

  **Application to Your Cases:**  
  1.  **Case 1 (Torture Authorization): DIRTY HANDS**  
      *   *(a) & (e)*: Deliberate torture (transgression), personally authorized, no private gain.  
      *   *(c) & (d)*: Role necessitates preventing imminent attack; crisis with failed alternatives.  
  2.  **Case 2 (Austerity Vote): NOT DIRTY HANDS → Excluded by (d) & (e)**  
      *   *(d)*: No exceptional crisis (routine politics).  
      *   *(e)*: No personal "ownership" of wrongdoing (blamed on party loyalty).  
  3.  **Case 3 (Execution of Royals): DIRTY HANDS**  
      *   *(a) & (e)*: Deliberate killing of innocents (transgression), personally ordered, no private gain.  
      *   *(c) & (d)*: Role necessitates securing democratic order in a *foundational crisis* (revolution); no viable alternatives perceived.  
      *   *Clarification:* "Foundational" crises fall under *(d)* as extreme, system-level emergencies.  
  4.  **Case 4 (Bribe Acceptance): NOT DIRTY HANDS → Excluded by (a), (e), and (d)**  
      *   *(a)*: Corruption is inherently self-serving, not primarily a transgression for public good.  
      *   *(e)*: Private gain (bribe) violates this clause decisively.  
      *   *(d)*: No crisis justifying norm violation (funding clinic isn’t catastrophic prevention).  
  5.  **Case 5 (Systematic Deception): DIRTY HANDS**  
      *   *(a) & (e)*: Deliberate deceit (transgression), personally enacted, no private gain.  
      *   *(c) & (d)*: Role necessitates preventing war (systemic survival); crisis where transparency causes collapse.  

  ---

  **Honest Revision for Simplicity:**  
  Your Case 3 verdict (*dirty hands*) is preserved, but **the principle necessitates overturning your Case 4 verdict**. You judged Case 4 as "corruption, not dirty hands," which aligns with the principle’s exclusion (due to private gain and absence of crisis). No other verdict is overturned—Cases 1, 3, and 5 are included; Case 2 is excluded. The principle sharpens Case 4’s exclusion beyond your "corruption" label by embedding it within the necessary conditions (private gain and lack of crisis violate clauses *e* and *d*).  

  ---

  **Verdict on the Unlisted Case:**  
  *Scenario: A democratically elected leader secretly falsifies election data to block an authoritarian victory, then confesses and resigns.*  

  **Judgment: DIRTY HANDS**  
  *   *(a)*: Falsifying data is a deliberate transgression (electoral fraud).  
  *   *(b)*: Personally undertaken by the officeholder.  
  *   *(c)* & *(d)*: Role necessitates protecting democratic survival in an *exceptional crisis* (authoritarian takeover); alternatives (e.g., legal challenges) may be deemed futile.  
  *   *(e)*: No private gain (resignation shows ownership of moral cost).  

  **Reasoning:** The act prevents a catastrophic erosion of democracy (fundamental public good) in a crisis where conventional mechanisms fail. The confession and resignation demonstrate personal ownership of the stain, fulfilling clause *(e)*. While extreme, it parallels revolutionary actions (Case 3) in defending systemic foundations against existential threats—distinguishing it from routine corruption or compromise.  

  **Commitment:** This principle draws from Walzer and Camus, stressing that true dirty hands requires *role-bound, catastrophic prevention* of fundamental harms, *personally owned* without dilution. Cases 2 and 4 fail because they lack crisis necessity and involve complicity/corruption; the unlisted case succeeds as a tragic defense of democracy’s core.
