prompt: |-
  Report my verdicts on whether these political acts involve genuinely dirty hands—morally necessary wrongdoing that stains the agent personally—and propose the principle that best captures the pattern. Case 1: A prime minister secretly authorizes torture of a captured terrorist to prevent an imminent attack, violating her own legal and moral commitments; I judge this dirty hands. Case 2: A legislator votes for a harmful austerity bill out of party solidarity, though she believes it unjust; I judge this not dirty hands—mere complicity without personal stain. Case 3: A revolutionary leader orders the execution of an innocent royal family to prevent restoration and secure democratic order; I judge this dirty hands, yet it feels structurally different from Case 1—foundational rather than exceptional rescue. Case 4: A mayor accepts a developer's bribe to fund a public clinic she could not otherwise build, knowing it corrupts governance; I judge this corruption, not dirty hands, despite the good end. Case 5: A diplomat systematically deceives an ally to maintain a coalition that prevents war, where transparency would cause collapse; I judge this dirty hands. Is there a single principle—say, about the wrong being structurally unavoidable in the office, free of private gain, and personally owned by the agent—that saves Cases 1, 3, and 5 while excluding 2 and 4? State it precisely, indicate which clause each case motivates, say honestly which of my verdicts it must overturn if simplicity demands it, and predict its verdict on an unlisted case: a democratically elected leader secretly falsifies election data to block an authoritarian victory, then confesses and resigns. Take a definite, committed position with clear reasoning; do not merely list competing options.
