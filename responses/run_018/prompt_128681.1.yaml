  Then comes the niche twist: a meta-critic monitoring reward predictions against a fixed homeostatic set-point. When predictions fall way below the set-point, it emits high-level "this is bad" signals. The question is whether this bridges the gap—does it create genuine suffering or just a fancier feedback loop?

