answer: |-
  Below is the complete exam package addressing your requirements, designed to push students into the meta-logical tensions of frame-bound dialetheism.

  ---

  ### **Exam Question: Frame-Bound Dialetheism and the Explosion Problem**  
  *Answer all parts. Total: 20 marks*  

  **Background**: Frame-bound dialetheism (FBD) asserts that true contradictions exist *only* within delimited interpretive frames (e.g., legal systems, quantum mechanics), while insisting that the metalanguage governing frame boundaries remains consistent. Unlike Priest’s unrestricted dialetheism, FBD claims to avoid trivialism (all propositions being true) by "quarantining" contradictions inside frames.  

  **Prompt**:  
  Critically evaluate whether FBD resolves the explosion problem (*ex contradictione quodlibet*: from a contradiction, anything follows) more effectively than Priest’s dialetheism. Focus on:  
  1. How FBD uses frame boundaries to *localize* contradictions.  
  2. Whether explosion can be consistently blocked *within* a frame using paraconsistent logic.  
  3. **The central problem**: Does the act of drawing frame boundaries in a *consistent metalanguage* undermine FBD’s claim that some contradictions are *genuinely* true?  
  4. Conclude: Does FBD solve explosion, or does it covertly restore classical consistency?  

  ---

  ### **Model Answer (670 words)**  

  Frame-bound dialetheism (FBD) attempts to refine Priest’s dialetheism by restricting true contradictions to specific domains (frames) like legal codes or quantum physics. While promising to resolve explosion more cleanly, it faces a fatal tension: the consistent metalanguage required to demarcate frames implicitly reinstates global consistency, nullifying its dialetheist credentials.  

  **1. Localization vs. Explosion in FBD**  
  FBD argues that explosion is avoided because contradictions are frame-relative. For example, in a legal frame, "This contract is valid and invalid" might be true due to conflicting statutes, but this doesn’t infect other frames. Paraconsistent logics (e.g., LP) block explosion *within* the frame by allowing *some* contradictions without triviality. Thus, FBD claims an advantage over Priest: contradictions need not threaten global rationality.  

  **2. The Illusion of Containment**  
  Crucially, FBD fails because its frame-boundary mechanism relies on a consistent metalanguage. To state that "Contradiction *C* is true-in-frame-*F* but false-in-frame-*G*," FBD must presuppose that:  
  - Frame membership is exclusive and non-contradictory (no frame is both *F* and not-*F*).  
  - Truth-value assignments across frames are consistent.  
  This metalanguage cannot tolerate contradictions without risking explosion *at the meta-level*. If the statement "Frame *F* exists" were both true and false, it could render all frames indeterminate, collapsing FBD into trivialism. Thus, FBD smuggles consistency into the architecture that defines its frames.  

  **3. Paraconsistent Logic Inside Frames: A False Shield?**  
  FBD assumes paraconsistent logic (e.g., LP) blocks explosion *within* frames. However, this is insufficient to save FBD. Consider:  
  - Even in LP, while *simple* contradictions like *P ∧ ¬P* don’t entail arbitrary *Q*, more complex frame-specific contradictions might. For instance, if a frame contains "¬(P ∧ ¬P)" (an explosion-blocking axiom) and also permits "P ∧ ¬P" (via dialetheia), the combined set *could* restore explosion if the frame’s inference rules are not meticulously curated.  
  - More damningly, FBD offers no paraconsistent mechanism to *describe frame boundaries themselves*. The meta-statement "Contradictions only exist in frames" must obey classical logic—or face explosion.  

  **4. Does FBD Solve Explosion Better Than Priest?**  
  Priest’s dialetheism embraces global contradictions but uses paraconsistent logic to avoid explosion universally. FBD claims superiority by isolating contradictions, yet this isolation is parasitic on classical metalogic. Priest’s view, while radical, at least coherently applies paraconsistency at all levels. FBD, by contrast, creates a two-tier system: dialetheic frames governed by a consistent superstructure. This reintroduces consistency through the "back door" of the metalanguage. Consequently, FBD does not solve explosion more cleanly—it merely *relocates* it to the meta-level. If the metalanguage is consistent, FBD is not truly dialetheist; if inconsistent, it collapses into Priest’s view or trivialism.  

  **Conclusion**: FBD’s attempt to quarantine contradictions fails. The need for a consistent metalanguage to define frames implicitly reinstates global consistency, undermining FBD’s core claim that contradictions are *genuinely* true. While it gestures toward a pragmatic containment of explosion, it sacrifices dialetheism’s philosophical substance. Ultimately, it solves nothing that Priest doesn’t address more honestly.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **Award marks for hitting these points. Deduct marks for "Typical Wrong Moves" listed.**

  | **Point (Marks)**                     | **What Students Must Do**                                                                 | **Typical Wrong Move**                                                                 |
  |---------------------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **1. Frame-localization mechanics (4)** | Explain how FBD isolates contradictions to frames to block global explosion.              | Treating frames as *merely contextual* (e.g., "true-in-law") without dialetheic truth. |
  | **2. Paraconsistent limits in frames (4)** | Analyze whether paraconsistent logic *fully* blocks explosion *inside* a frame.          | Assuming paraconsistent logic *automatically* prevents all explosion within frames.    |
  | **3. Metalanguage problem (6)**       | Identify that frame boundaries require a *consistent* metalanguage, creating tension.     | Ignoring the meta-language or claiming frames can be dialetheically defined.           |
  | **4. Comparison to Priest (4)**       | Weigh if FBD handles explosion better than unrestricted dialetheism.                      | Asserting FBD "solves" explosion without addressing Priest’s paraconsistent safeguards. |
  | **5. Coherence critique (2)**         | Conclude whether FBD smuggles consistency/undermines dialetheism.                        | Uncritically accepting FBD’s "quarantine" as philosophically stable.                   |

  ---

  ### **Why This Works**  
  - **Forces meta-logical engagement**: Students must dissect how *defining* frames imposes consistency demands beyond Priest’s system.  
  - **Targets misconceptions**: The marking scheme penalizes conflating FBD with contextualism or overtrusting paraconsistency.  
  - **No Priest bibliography needed**: Focuses on structural tensions, not exegesis.  
  - **Balanced difficulty**: The metalanguage problem (Point 3) is the hinge, demanding critical synthesis.  

  This setup ensures students wrestle with dialetheism’s foundational paradox: asserting true contradictions while relying on consistency to structure that assertion.
