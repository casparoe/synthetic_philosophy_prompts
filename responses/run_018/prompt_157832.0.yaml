answer: |-
  ### Decision-Tree Taxonomy: Moral Distinction Between Killing and Letting Die with Prior Causal Involvement  

  **First Branch: Does prior causal involvement dissolve the doing/allowing distinction?**  
  - **Yes** → **Dissolution View**  
    - *Awkward commitment*: Must deny any intrinsic moral difference between actively killing one innocent person to prevent greater harm and passively allowing that harm to occur, even if the latter avoids direct agency.  
  - **No** → Proceed to second branch.  

  **Second Branch: What sustains the doing/allowing distinction?**  
  - **A: Requires direct bodily motion** → Distinction collapses if harm results from an omission (even if it preserves a harmful trajectory).  
    - Proceed to third branch.  
  - **B: Can survive in omissions preserving existing trajectories** → Distinction persists if an omission sustains a preexisting causal chain (e.g., failing to divert a threat).  
    - Proceed to third branch.  

  **Third Branch: Do identical outcomes eliminate the distinction?**  
  - **For "A" (bodily motion required):**  
    - **Yes** → **Unnamed**  
      - *Awkward commitment*: Must affirm that outcomes alone determine moral equivalence, undermining the foundational claim that bodily motion is essential to the distinction.  
    - **No** → **Traditional Doing/Allowing Distinction** (e.g., Foot, Quinn)  
      - *Awkward commitment*: Must prohibit actively killing one to save five (even to rectify prior causation), requiring passive allowance of greater harm when direct bodily motion is involved.  
  - **For "B" (distinction survives in omissions):**  
    - **Yes** → **Unnamed**  
      - *Awkward commitment*: Must accept that outcome identity nullifies the distinction between omission-as-killing and omission-as-letting-die, contradicting the core premise that certain omissions constitute killings.  
    - **No** → **Unnamed**  
      - *Awkward commitment*: Must defend a persistent moral gap between active killing and harmful omission even when both cause identical harm and stem from equivalent prior involvement.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  1. **First Branch: No → Second Branch: A → Third Branch: Yes**  
     - *Diagnosis*: **Incoherent**. Insisting bodily motion is necessary for the distinction (Second Branch A) while letting outcomes erase it (Third Branch Yes) creates internal conflict: outcomes cannot override a criterion defined as essential.  

  2. **First Branch: No → Second Branch: B → Third Branch: Yes**  
     - *Diagnosis*: **Unattractive**. Classifying omissions as killings (Second Branch B) but surrendering to outcome identity (Third Branch Yes) implies that the classification is morally inert, rendering it ad hoc and theoretically unstable.  

  3. **First Branch: No → Second Branch: B → Third Branch: No**  
     - *Diagnosis*: **Unexplored**. While logically possible, no major position defends this, likely because distinguishing between active killings and omission-based killings *without* outcome differences demands obscure criteria (e.g., "metaphysical agency") and invites arbitrariness.  

  ---

  **Notes**  
  - **Dissolution View**: Reflects consequentialist-leaning stances (e.g., Singer) but lacks a canonical name; its commitment to causal responsibility over agency is contentious.  
  - **Traditional Doing/Allowing Distinction**: Rooted in deontology (e.g., Foot); its rigidity in prioritizing acts over outcomes faces counterintuitive results in life-saving dilemmas.  
  - **Unnamed positions**: Indicate gaps in the literature where combinations are either paradoxical (A/Yes), self-defeating (B/Yes), or underdeveloped (B/No).
