      a) The 16-year-old should be allowed to vote because they are more prepared to make a good decision than the uninformed adult.
      b) The 16-year-old should not be allowed to vote because voting is a right that comes with adulthood (age 18 or older), regardless of individual knowledge.
      c) Both should be allowed to vote because being affected by government decisions is what matters, and both are affected.
      d) Both should be allowed to vote because being a citizen is what matters, and the 16-year-old isn't old enough to be a full citizen.

   2. Consider a non-citizen who has lived in your town for 15 years, pays taxes, owns a home, and has children in the local schools. They are not eligible to vote in local elections. Which statement aligns more with your view?
      a) They should be allowed to vote because they are deeply affected by local decisions and contribute to the community.
      b) They should not be allowed to vote because voting is a right of citizenship, and they have chosen not to become citizens (or are in the process).
      c) They should be allowed to vote only if they pass a test demonstrating knowledge of local issues and government.
      d) They should be allowed to vote if they are at least 18, because the primary concern is being affected and contributing.

   3. What is the best reason to require voting (i.e., make it compulsory)?
      a) To ensure that the government represents the will of the entire community, not just the politically active.
      b) To encourage citizens to take their civic duty seriously and engage with the political process.
      c) To improve the quality of decisions by having a broader range of voices.
      d) I don't think voting should be compulsory.

   4. Should the voting age be lowered to 16 for local elections?
      a) Yes, because 16-year-olds are affected by local decisions (like school funding, public transport) and are often mature enough to vote.
      b) Yes, but only if they can pass a basic civics test to show they understand the issues.
      c) No, because 16-year-olds are not yet full citizens and are still under the care of their parents.
      d) No, because even if some are mature, many are not, and we need a clear age boundary.

   5. Imagine a citizen who has not voted in the last three elections. They say they are too busy and not interested. Should there be a penalty for not voting?
      a) Yes, because voting is a duty of citizenship, and failing to vote harms the community.
      b) Yes, because if too many people don't vote, the government doesn't represent everyone.
      c) No, because forcing people to vote when they don't care may lead to random or uninformed voting.
      d) No, because voting is a right, not a duty, and people should be free to abstain.

   6. Which person do you think has the strongest claim to being allowed to vote in national elections?
      a) A 17-year-old citizen who is about to turn 18 and is very engaged in political issues.
      b) A 30-year-old non-citizen who has lived in the country for 10 years, works, pays taxes, and has applied for citizenship.
      c) A 20-year-old citizen who doesn't know who the current leaders are and doesn't care.
      d) A 40-year-old citizen who is well-informed and always votes.

   7. In your view, what is the main purpose of allowing people to vote?
      a) To express their membership in the political community.
      b) To protect their own interests and the interests of those they care about.
      c) To ensure the best possible decisions are made for the community as a whole.
      d) To fulfill a civic duty that maintains the health of the democracy.

   8. Should a person with a severe cognitive disability that impairs their decision-making ability be allowed to vote?
      a) Yes, because they are citizens and have the right to vote regardless of their ability.
      b) Yes, because they are affected by government decisions and should have a say.
      c) No, because they cannot make a competent decision, and voting is about making good choices.
      d) Only if a guardian assists them, but not independently.

   9. What about a person who is serving a prison sentence for a felony? Should they be allowed to vote?
      a) Yes, because they are still citizens and their interests are still affected by the government.
      b) Yes, because excluding them undermines the principle of universal suffrage and may lead to their interests being ignored.
      c) No, because they have broken the social contract and temporarily forfeited their right to participate.
      d) It depends on the crime and the individual's rehabilitation.

