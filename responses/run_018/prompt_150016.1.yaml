  We are going to design a quiz that helps reveal the underlying principle (membership, affected interests, or competence) that drives a person's stance on the three electoral reforms. We will avoid using philosophical jargon and instead use concrete scenarios.

   The quiz will have 8-10 questions. Each question will present a scenario and offer two or more choices. The choices will be designed to pull apart the principles. We will then use a scoring key to assign the respondent to one of the following positions:

   1. Strict Citizenship-Plus-Age: Voting is a right of membership and requires formal citizenship and a certain age (usually 18).
   2. Affected-Interests Expansion: Anyone significantly affected by political decisions should have a vote, regardless of citizenship or age (as long as they meet minimal competence).
   3. Compulsory Universalism: Voting is a duty of membership and thus should be compulsory for all citizens of voting age (and membership is defined by citizenship and age).
   4. Epistemic Filtering: The primary goal is competent collective decision-making, so we should consider factors like knowledge and engagement, regardless of membership or affected interests.
   5. Hybrid View: Some combination of the above.

   We note that some combinations might be logically unstable. For example, supporting non-citizen voting based on affected interests but opposing lowering the voting age to 16 without a reason related to competence would require additional justification to avoid inconsistency.

   We'll build the quiz with questions that touch on:
     - The basis of the right to vote (membership, affected interests, competence)
     - How to handle age (especially 16-year-olds)
     - How to handle non-citizen residents
     - The role of compulsion

