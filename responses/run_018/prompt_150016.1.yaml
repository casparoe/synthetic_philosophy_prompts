  Below is a decision tree designed to reveal the underlying principle driving judgments on electoral reforms. It uses concrete scenarios without philosophical jargon, and sorts participants into one of five coherent positions or flags inconsistent views. The tree starts with foundational questions about voting's purpose, then branches to address age and residency.

  ---

  ### **Decision Tree: What's Your Voting Principle?**
  *Answer each scenario with "A" or "B". Follow the arrows to the next question.*

  **1. A local election is coming up. Who has the stronger claim to vote?**  
  - **A)** A 35-year-old citizen who hasn’t voted in 10 years and doesn’t know the candidates.  
  - **B)** A 30-year-old non-citizen who’s lived here 15 years, pays taxes, and runs a community center.  
    - If **A** → Go to Q2.  
    - If **B** → Go to Q3.  

  **2. Why should the uninformed citizen vote?**  
  - **A)** Because they’re a citizen—voting is a birthright, like freedom of speech.  
  - **B)** Because everyone’s voice should count to make outcomes fairer, even if they’re disengaged.  
    - If **A** → Go to Q4.  
    - If **B** → Go to Q5.  

  **3. Why should the non-citizen resident vote?**  
  - **A)** They’re deeply affected by policies (taxes, schools, roads)—impact matters more than paperwork.  
  - **B)** Voting should require meeting standards; if they pass a test on local issues, they qualify.  
    - If **A** → Go to Q6.  
    - If **B** → Go to Q7.  

  **4. Should a well-informed 16-year-old vote if an uninformed 45-year-old can?**  
  - **A)** No—voting is for adults (18+), period. Knowledge doesn’t change that.  
  - **B)** Yes—if we allow uninformed adults, we should let prepared teens vote too.  
    - If **A** → Position: **Strict Citizenship-Plus-Age**.  
    - If **B** → Go to Q8.  

  **5. Should voting be mandatory for citizens?**  
  - **A)** Yes—it’s a civic duty, like jury duty. Penalize non-voters to make it universal.  
  - **B)** No—voting is a right, not a chore. Forcing the disengaged leads to worse decisions.  
    - If **A** → Position: **Compulsory Universalism**.  
    - If **B** → Position: **Hybrid (Membership + Competence)**.  

  **6. Should 16-year-olds vote locally?**  
  - **A)** Yes—they’re affected by schools, jobs, and climate policies. Age shouldn’t block them.  
  - **B)** No—most teens lack adult responsibilities. They shouldn’t vote until they’re independent.  
    - If **A** → Position: **Affected-Interests Expansion**.  
    - If **B** → Go to Q9.  

  **7. Should a citizen with severe dementia vote?**  
  - **A)** Yes—if they’re a citizen, they vote. Ability isn’t the point.  
  - **B)** No—if they can’t understand choices, they shouldn’t influence outcomes.  
    - If **A** → Inconsistent (see notes).  
    - If **B** → Position: **Epistemic Filtering**.  

  **8. Should felons in prison vote?**  
  - **A)** Yes—they’re citizens and affected by laws. Prison doesn’t erase that.  
  - **B)** No—they broke the social contract and lost participation rights.  
    - If **A** → Position: **Hybrid (Membership + Affected Interests)**.  
    - If **B** → Position: **Strict Citizenship-Plus-Age**.  

  **9. Should non-citizens vote if they pass a civics test?**  
  - **A)** Yes—if they prove competence, residency shouldn’t matter.  
  - **B)** No—only citizens should vote, regardless of knowledge.  
    - If **A** → Position: **Epistemic Filtering**.  
    - If **B** → Position: **Strict Citizenship-Plus-Age**.  

  ---

  ### **Positions & Principles**  
  1. **Strict Citizenship-Plus-Age**  
     - Voting = **membership right** for adult citizens (18+).  
     - Reforms: No compulsory voting, no voting at 16, no non-citizen voting.  
     - *Path: Consistent "A" answers in Q1→Q2→Q4A or Q9B.*  

  2. **Compulsory Universalism**  
     - Voting = **civic duty** tied to citizenship.  
     - Reforms: Mandatory voting for citizens, but no expansion to non-citizens or 16-year-olds.  
     - *Path: Q1A→Q2B→Q5A.*  

  3. **Affected-Interests Expansion**  
     - Voting = **tool to protect interests** of all impacted people.  
     - Reforms: Likely supports voting at 16 and for non-citizen residents; opposes compulsion.  
     - *Path: Q1B→Q3A→Q6A.*  

  4. **Epistemic Filtering**  
     - Voting = **method for competent decisions**. Prioritizes knowledge/engagement.  
     - Reforms: Flexible on age/residency if competence proven; opposes compulsion.  
     - *Path: Q1B→Q3B→Q7B or Q9A.*  

  5. **Hybrid Views**  
     - **Membership + Affected Interests**: Citizenship matters nationally, but residency locally (e.g., non-citizens vote locally). *Path: Q1A→Q2A→Q4B→Q8A.*  
     - **Membership + Competence**: Citizenship required, but supports lowering age if teens prove maturity. *Path: Q1A→Q2B→Q5B.*  

  ---

  ### **Inconsistent or Unstable Positions**  
  - **Incoherent Path**: Q1B→Q3A→Q6B→Q9B.  
    - *Why?* Supports non-citizen voting based on **affected interests** (Q3A) but rejects voting at 16 *without appealing to competence* (Q6B). This arbitrarily applies "affected interests" to residency but not age.  
  - **Tension in Epistemic Path**: Q1B→Q3B→Q7A.  
    - *Why?* Prioritizes **competence** for non-citizens (Q3B) but ignores it for impaired citizens (Q7A). Inconsistent unless citizenship overrides competence.  

  ---

  ### **How to Use**  
  1. Participants answer the tree individually.  
  2. Use the scoring paths to assign positions.  
  3. Discuss results: *"Why might someone with Principle X support Reform Y?"*  
  4. Flag unstable positions (e.g., "affected interests only for residents") for debate.  

  This tool avoids ideological labels, forcing participants to confront their core assumptions. It also exposes contradictions—like accepting "affected interests" for non-citizens but not teens—which often fuel unproductive debates.
