answer: |-
  Here's your decision tree instrument for the ethics seminar, structured as specified. I've designed it to guide students through the logical space without requiring prior knowledge of specific philosophers. The tree uses two concrete cases: Williams' "saving the wife" scenario and a workplace loyalty case (manager laying off her mentor).

  ---

  ### **Ethics of Integrity & Impartiality: Decision Tree**
  *For graduate students familiar with Williams' integrity objection*

  **START: Choose the response that resonates most in each scenario**  
  *(Answer based on instinct, not theory labels)*  

  1. **Saving the Wife Scenario**:  
     You can save only one person from drowning: your wife or a stranger. You save your wife. Why?  
  2. **Workplace Loyalty Scenario**:  
     As a manager, you must lay off one employee. Your mentor (who shaped your career) is a candidate. You spare them. Why?  

  **Select one justification that fits both scenarios:**  
  - **A**: "Because it’s *my wife/mentor*. This relationship demands my partiality—impartial moral reasons (e.g., overall welfare) don’t belong here."  
  - **B**: "The action is impartially justifiable (e.g., relationships have social value), but I didn’t think about that—I acted from love/loyalty."  
  - **C**: "I impartially weighed the reasons: saving/keeping them maximizes overall good due to our relationship’s unique value."  
  - **D**: "I acted instinctively from love/loyalty. If pressed, I’d cite impartial grounds (e.g., relationships boost societal utility)."  

  ---

  #### **TREE PATHWAYS**  
  *(Follow your answer from START)*  

  - **If A** → **Flaw Type: CONTENT**  
    The problem is that impartial reasons shouldn’t *even appear* in intimate/professional reasoning.  
    - **How should ethics address this?**  
      - **A1 (Structural Fix)**: Revise moral theory to include agent-relative permissions (e.g., partiality is objectively valid).  
        - **Basis for partiality?**  
          - **A1a**: Coherence of **ground projects** (pursuing chosen life-plans, e.g., being a devoted spouse/mentee).  
          - **A1b**: Fidelity to **identity-constitutive attachments** (unchosen commitments that define you, e.g., familial/professional bonds).  
      - **A2 (Psychological Fix)**: Keep impartial theory but train agents to avoid using it in personal contexts.  
        → **POSITION: [INCOHERENT/NOT DEFENDED]**  

  - **If B or D** → **Flaw Type: DELIBERATIVE ROLE**  
    The problem is impartial reasons corrupt *first-person deliberation* (even if valid for policy).  
    - **How should ethics address this?**  
      - **B/D1 (Structural Fix)**: Revise theory to separate institutional/personal reasoning (e.g., different "levels" of justification).  
        - **Basis for separation?**  
          - **B/D1a**: Protect **ground projects** (e.g., deliberation must preserve life-plans).  
          - **B/D1b**: Honor **identity-constitutive attachments** (e.g., deliberation reflects core identity).  
      - **B/D2 (Psychological Fix)**: Keep theory but insulate agents (e.g., cultivate habits so they don’t "calculate").  
        → **POSITION: RAILTON-STYLE INDIRECT CONSEQUENTIALISM**  

  - **If C** → **No flaw perceived**  
    → **POSITION: HARD-LINE IMPARTIALIST**  

  ---

  ### **SCORING KEY: MAP ANSWERS TO POSITIONS**  
  | **Answer Path** | **Position** | **Key Tenets** |
  |-----------------|--------------|----------------|
  | A → A1a         | **Scheffler-style agent-centered prerogative** | Structural fix; partiality justified by need to pursue ground projects. |
  | A → A1b         | **Williams-style integrity (identity-constitutive)** | Structural fix; partiality from unchosen, identity-defining commitments. |
  | A → A2          | **[EMPTY SLOT]** | Content flaw + psychological fix: Incoherent (can’t demand partial reasons while keeping theory impartial). |
  | B/D → B/D1a/b   | **[NO MAINSTREAM POSITION]** | Deliberative role flaw + structural fix: Undefended (splitting theory this way is unstable/unattractive). |
  | B/D → B/D2      | **Railton-style indirect consequentialism** | Psychological fix; impartial theory preserved, but agents insulated from deliberation. |
  | C               | **Hard-line impartialist** | No flaw; impartial reasoning belongs in all contexts. |

  ---

  ### **DIAGNOSIS OF EMPTY/UNDEFENDED SLOTS**  
  1. **Content flaw + Psychological fix (A → A2)**:  
     - **Why empty?** Likely **incoherent**. If impartial moral theory is retained (e.g., utilitarianism), it requires *all* reasons to be impartial. Demanding agents use partial reasons in personal contexts contradicts the theory’s core—no psychological fix can resolve this tension.  

  2. **Deliberative role flaw + Structural fix (B/D → B/D1a/b)**:  
     - **Why undefended?** **Theoretically unstable**. Splitting moral theory into "institutional" (impartial) and "personal" (partial) domains risks self-contradiction (e.g., what if roles conflict?). Most theorists avoid this; psychological fixes are preferred for role-based flaws.  
     - **Case differentiation**: The workplace scenario *might* distinguish ground projects (A1a: mentorship as career strategy) from identity attachments (A1b: loyalty as professional integrity), but the saving-wife case often conflates them—Williams’ original framing blurs the line.  

  ---

  ### **CONFIDENCE ASSESSMENT**  
  - **Overall Confidence**: 85%  
    - The tree cleanly separates the four target positions (Williams, Scheffler, Railton, impartialist) and flags logical gaps.  
    - Cases scaffold the splits: Workplace scenario clarifies ground projects vs. identity attachments (e.g., "I owe my mentor" as chosen career plan vs. unshakeable loyalty).  

  - **Least Confident Point**: **Whether the content-flaw + psychological-fix slot is *inherently* incoherent**.  
    - Why? One *could* argue for a "dualist" psychology (e.g., implicit partial motives + explicit impartial theory), but this collapses into Railton’s position (role flaw + psychological fix). I’m 90% sure it’s incoherent—no major ethicist defends it.  

  - **Railton Clarification**:  
    Your spec is correct. Railton’s "alienation" concern is resolved via **deliberative insulation** (not structural change), so the tree accurately places him under "role flaw + psychological fix."  

  ---

  **INSTRUMENT NOTES**  
  - **Nodes**: 5 (START → Flaw Type → Fix Type → Basis for Structural Fix)  
  - **Leaves**: 6 (5 positions + 1 empty slot)  
  - **Usage**: Students answer concrete cases; the tree reveals their implicit stance. Positions are disclosed *after* traversal.  
  - **Weakness**: The "ground projects vs. identity" split is subtle in saving-wife case—use workplace scenario to probe it.  

  Let me know if you’d like adjustments to cases, branching logic, or scoring!
