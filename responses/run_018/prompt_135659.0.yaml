prompt: |-
  I recently encountered a summary in an unnamed philosophy of biology essay that attempts to capture Gould and Lewontin's spandrel critique, and I should like an accuracy audit. The summary runs as follows: 'Gould and Lewontin argued that evolutionary biologists commit the Panglossian error of treating every trait as a purpose-built adaptation, ignoring that many features are spandrels—structural by-products like the triangular spaces between arches in San Marco—which exist not because selection favoured them but because they are inevitable consequences of other design choices. They insisted that once a spandrel exists it may be co-opted for a secondary use, but that co-option is not adaptation in the original sense. From this they concluded that adaptationism is unfalsifiable: whenever biologists encounter a trait with no obvious purpose, they invent a hidden-benefit narrative, and whenever they find a purpose, they claim vindication. Therefore, the spandrel critique demolishes evolutionary psychology, which treats every mental trait as a Pleistocene adaptation, and it further demonstrates that developmental locking—the rigid canalisation of growth pathways—makes spandrels unavoidable in any complex body plan.' I am unsure how much of this is faithful. Could you go through the summary carefully, identifying which sentences accurately reflect their classic argument, which ones subtly misrepresent it—perhaps by conflating spandrels with exaptations, overstating the anti-adaptationist conclusion, or presenting a standard objection as a definitive refutation—and whether the claim about evolutionary psychology actually follows from anything Gould and Lewontin said? I should also like you to address whether the reference to developmental locking is a legitimate extension of their view or an anachronistic import from later evolutionary developmental biology. Please respond in continuous prose with no headings, bullet points, bold text, or tables, and write in British English throughout.
reasoning: |-
  Hmm, the user wants me to audit the accuracy of a summary regarding Gould and Lewontin's spandrel critique. They've provided a detailed summary and want me to evaluate its faithfulness to the original argument, specifically identifying accurate representations, subtle misrepresentations, and whether certain claims (like about evolutionary psychology or developmental locking) actually follow from Gould and Lewontin's work.

  Looking at this summary, I need to recall Gould and Lewontin's famous 1979 paper "The Spandrels of San Marco and the Panglossian Paradigm." They criticized adaptationism - the tendency in evolutionary biology to view every trait as an optimal adaptation formed by natural selection. Their architectural metaphor of spandrels was brilliant - those triangular spaces between arches that weren't designed but emerged as by-products, yet were later decorated. This illustrated how biological features might originate as structural necessities rather than direct adaptations.

  The summary correctly captures their core critique: that biologists often commit the "Panglossian error" by treating every trait as purpose-built while ignoring non-adaptive origins. The description of spandrels as structural by-products analogous to the San Marco architecture is accurate. They did argue that such features exist not because selection favored them, but as inevitable consequences of other design constraints.

  However, the summary becomes problematic when discussing co-option versus adaptation. While Gould and Lewontin distinguished between the origin of a feature (like a spandrel) and its later utility (co-option for secondary use), they didn't claim this co-option isn't adaptation "in the original sense." They acknowledged that such features can become adaptive through exaptation - a term Gould later developed. The summary's phrasing makes it sound like they rejected the adaptive potential of co-opted features altogether, which oversimplifies their view.

  Regarding unfalsifiability, the summary is partially correct but overstates their argument. Gould and Lewontin did criticize adaptationism for being hard to falsify because biologists could always invent just-so stories for any trait. But they didn't call it completely unfalsifiable; they advocated for considering alternative explanations as more probable in many cases. Their critique was about methodological bias, not logical impossibility.

  The leap to evolutionary psychology seems an unwarranted extension in this summary. While Gould frequently criticized evolutionary psychology for its adaptationist assumptions, this specific connection wasn't made in the original spandrels paper. The summary presents this as Gould and Lewontin's direct conclusion, when actually Gould developed this application separately in later works.

  Finally, the mention of "developmental locking" appears anachronistic. While the concept relates to constraints that produce spandrels, the term "developmental locking" and its association with canalisation comes from later evolutionary developmental biology (evo-devo), not their 1979 paper. Gould and Lewontin discussed constraints broadly, but this specific terminology and mechanism represents a later refinement of their ideas.

  I'll need to carefully explain all these nuances in continuous British English prose without any markdown formatting, addressing both the accurate elements and the subtle misrepresentations throughout this summary.
answer: |-
  Your request for an accuracy audit is perceptive; the summary captures several core elements of Gould and Lewontin's argument faithfully but also contains subtle misrepresentations and anachronistic extensions. Here is a careful assessment:

  The opening sentences accurately reflect the core of Gould and Lewontin's critique. They did argue that adaptationist programmes in evolutionary biology often commit a 'Panglossian' error, treating every trait as an optimal adaptation directly shaped by natural selection for its current function. Their central analogy of the spandrels in San Marco – the inevitable architectural by-products arising from the meeting of rounded arches under a dome, later co-opted for decoration – is correctly presented. They used this to illustrate that many biological features are not direct products of selection for their current use but are instead non-adaptive structural or developmental 'by-products' ('spandrels') arising as necessary consequences of other evolved features or constraints. The assertion that they insisted spandrels exist not because selection favoured them *as spandrels*, but because they are inevitable consequences of other 'design choices' (i.e., evolutionary constraints), is entirely faithful.

  The statement that "once a spandrel exists it may be co-opted for a secondary use" is also accurate to their argument. Gould, in particular, frequently discussed such later utility or 'co-option'. However, the subsequent claim that "co-option is not adaptation in the original sense" subtly misrepresents their view. While Gould and Lewontin rigorously distinguished the *origin* of a feature (as a non-adaptive spandrel) from its *current utility* (which could be adaptive via co-option), they did not categorically deny that co-opted features *become* adaptations. Gould later developed the term 'exaptation' precisely to describe this phenomenon: a feature whose current function was not the reason for its original selection (or, in the case of a spandrel, not the reason for its origin at all). The summary risks conflating 'spandrel' (a type of *origin* – a non-adaptive by-product) with 'exaptation' (a type of *current utility* – a feature co-opted for a new function). Its phrasing implies Gould and Lewontin rejected the adaptive nature of co-opted features *per se*, whereas their target was the assumption that the feature's *origin* must be adaptive.

  The summary's conclusion that "adaptationism is unfalsifiable" overstates Gould and Lewontin's claim. They argued that the *methodology* of pan-adaptationism, as commonly practised, was problematic and often untestable in practice because it relied heavily on plausibility arguments and 'just-so stories'. Their critique focused on the *preference* for adaptationist explanations and the *failure to consider alternatives* (like constraints or spandrels), not that adaptationist hypotheses were logically unfalsifiable *in principle*. They certainly condemned the tendency described – inventing hidden-benefit narratives for traits lacking an obvious purpose and claiming vindication when a purpose is found – as a methodological flaw, but they framed this as a problem of scientific practice and bias, not a definitive logical proof of unfalsifiability. Their goal was to advocate for pluralism, not to declare adaptationism inherently unscientific.

  The claim that "the spandrel critique demolishes evolutionary psychology" does not directly follow from anything stated in the original 1979 spandrels paper. While the paper was a broad critique of adaptationism applicable to any field studying traits as adaptations, it did not mention evolutionary psychology specifically (a field that crystallised later). However, this *is* a legitimate and direct extension of their critique, particularly championed by Gould himself in his later writings. He explicitly and repeatedly applied the spandrel/exaptation argument to evolutionary psychology, criticising its tendency to view complex modern human behaviours and cognitive traits as direct, optimal Pleistocene adaptations while neglecting the roles of developmental constraints, historical contingency, and non-adaptive origins (spandrels) later co-opted. So, while the *conclusion* about evolutionary psychology accurately reflects Gould's developed position applying his own critique, it wasn't drawn within the original spandrels text itself.

  Finally, the reference to "developmental locking—the rigid canalisation of growth pathways—makes spandrels unavoidable in any complex body plan" is an anachronistic import from later evolutionary developmental biology (evo-devo). While Gould and Lewontin heavily emphasised the importance of *developmental constraints* (including concepts like allometry, pleiotropy, and developmental correlation) as generators of spandrels and limits on adaptation, the specific term "developmental locking" and the nuanced concept of "canalisation" as a highly buffered developmental pathway were not central to their 1979 argument. Canalisation was discussed by Waddington earlier, but its integration as a core mechanism *underlying* constraint and producing spandrels gained prominence later within evo-devo. Gould and Lewontin would certainly agree that developmental constraints *in general* make spandrels unavoidable in complex organisms, and canalisation is one powerful form of such constraint, but attributing the specific mechanism of "developmental locking" to them in 1979 is reading a later conceptual development back into their foundational paper. Their discussion of constraints was broader and less mechanistically specific.

  In essence, the summary correctly identifies the core architectural analogy, the critique of Panglossian adaptationism, and the concept of non-adaptive by-products (spandrels) that can be co-opted. It slightly misrepresents the relationship between co-option and adaptation, overstates the unfalsifiability charge, accurately reflects Gould's later application to evolutionary psychology (though not explicit in 1979), and imports a later evo-devo concept ("developmental locking") that refines but was not explicitly part of their original presentation.
