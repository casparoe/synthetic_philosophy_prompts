answer: |-
  Here's a walkthrough of the conceptual knot you're describing, focusing on local incommensurability and its relationship to Kuhn's world-ontology:

  Your instinct that local incommensurability might operate differently from the global case is well-founded. While both involve a breakdown in meaning and communication centered on taxonomic structures, the mechanisms and implications diverge significantly precisely because local instances occur *within* a shared paradigm. The key lies in understanding the role of the paradigm as a *stabilizing scaffold* that prevents localized taxonomic mismatches from automatically escalating into full-blown ontological revolutions.

  Global incommensurability (Newton vs. Einstein) stems from a fundamental clash in the *entire* lexical network defining the world. The taxonomic categories structuring core concepts like 'mass', 'space', and 'time' are so radically different that direct point-by-point translation fails. The worlds described are ontologically distinct – the entities and their fundamental relations don't map cleanly. Failure is total, occurring at the level of translation and holistic understanding.

  Local incommensurability (e.g., 'gene' in molecular bio vs. evolutionary genetics), however, occurs against a backdrop of immense shared ground. The overarching paradigm provides a vast infrastructure of shared methods, instruments, background theories, exemplars, values, and crucially, a largely shared *peripheral* lexicon. This shared scaffold acts as a buffer. While the specific taxonomic embedding of 'gene' differs between the subfields, leading to potential failures in *joint reference* for specific instances or precise definitions, communication isn't completely severed. Practitioners can still point to shared phenomena (like DNA sequences, phenotypic inheritance patterns) even if they categorize and relate them differently under the label 'gene'. They understand *why* the other subfield uses the term, what phenomena it generally points towards, and how it fits into the larger biological enterprise, even if direct substitution of meaning fails in specific theoretical contexts. The failure is often localized to precise reference or specific inferential connections, not the entire conceptual scheme.

  This is where Kuhn's claim that paradigms fix the world-ontology becomes crucial. The shared paradigm *does* block the blow-up, but not by "hiding" the divergence; rather, it actively *contains* and *constrains* it. The paradigm establishes a stable core ontology – the fundamental kinds of entities and relations – that *must* be accepted by practitioners working within it. Molecular biologists and evolutionary geneticists fundamentally agree on the existence of DNA, cells, organisms, inheritance, variation, and natural selection as core biological realities. Their differing taxonomic embeddings of 'gene' operate *on top of* and *within the boundaries of* this shared ontological commitment. The paradigm provides the "world" within which their localized lexicons operate. It sets the ground rules, defining what counts as a legitimate entity or problem. Because both subfields accept this core, their localized taxonomic differences, while causing communication hitches and potential misunderstandings about reference in specific contexts, don't threaten the paradigm's fundamental grip on reality. The shared world-ontology acts as an anchor, preventing the local drift from pulling the entire conceptual structure apart.

  However, whether this merely "hides" the divergence is a nuanced point. Kuhn's framework suggests the paradigm genuinely *enables* partial communication and coordinated progress *despite* the local incommensurability, precisely because of the shared scaffold. It's not that the ontological divergence is illusory; it's that the paradigm's core commitments keep it localized and manageable within the broader scientific practice. The divergence is real but contained. Yet, one could argue that the paradigm's success in enabling work *can* mask the depth of the conceptual disconnect at the local level, allowing practitioners to gloss over referential ambiguities as long as their immediate subfield goals are met. The potential for deeper ontological friction exists, but the paradigm's strength usually keeps it latent. Only if the localized divergence started fundamentally challenging the *core* ontological commitments shared by the paradigm (which it typically doesn't within stable paradigms) would it risk escalating into a revolutionary situation. So, the paradigm doesn't hide the divergence so much as it provides the structure that makes the divergence non-fatal to the ongoing scientific enterprise within that paradigm. The mechanism is different (localized reference failure vs. global translation failure), and the paradigm's world-ontology is the active force preventing escalation, not just a veil.
