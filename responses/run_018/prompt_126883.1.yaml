answer: |-
  ### Decision-Tree Taxonomy: Evolutionary Explanations for Structurally Coupled Traits  
  *(Organizing Framework: Gould-Lewontin Spandrels Critique)*  
  **Case Study:** Deep-cave bats with enlarged, ornate external pinnae developmentally inseparable from directly selected nasal resonators. Pinnae show no detectable function in echolocation, thermoregulation, or social signaling.  

  ---

  ### Diagnostic Questions (Answerable Without Prior Philosophical Knowledge):  
  1. **Does the trait (ornate pinnae) require its *own* evolutionary explanation, independent of the functional trait (nasal resonators) it’s coupled to?**  
     - *Yes* → Go to Q2  
     - *No* → Go to Q3  

  2. **Does the trait’s complex/apparent "design" *obligate* us to explain it via adaptation (natural selection)?**  
     - *Yes* → Go to Q4  
     - *No* → Go to Q3  

  3. **Should developmental constraint be treated as a *competitor* to natural selection in explaining trait origins?**  
     - *Yes* → **Pluralist Structuralism**  
     - *No* → Go to Q4  

  4. **Regarding the trait’s current lack of detectable function, who bears the burden of proof?**  
     - *Those claiming a hidden function* → **Strict Adaptationism**  
     - *Those claiming no function* → **Exaptationism** or **Spandrelism** (see ambiguity note below)  

  ---

  ### Leaf Positions & Awkward Commitments (Bat Case):  
  - **Strict Adaptationism** (Q1: Yes, Q2: Yes, Q4: Burden on non-adaptivists)  
    - *Awkward commitment:* Must insist the ornate pinnae *do* have an undetected adaptive function (e.g., cryptic signaling), despite exhaustive negative evidence.  
  - **Gould-Lewontin-Style Spandrelism** (Q1: No, Q3: Yes)  
    - *Awkward commitment:* Must deny that the pinnae’s ornateness—even if conspicuous—merits *any* adaptive narrative, treating it as purely "architectural noise."  
  - **Exaptationism** (Q1: Yes, Q2: No, Q4: Burden on functionalists)  
    - *Awkward commitment:* Must argue the pinnae are *currently* co-opted for a new function (e.g., sensory augmentation), despite no empirical support, or concede they are non-functional but "available" for future use.  
  - **Pluralist Structuralism** (Q1: No, Q3: Yes)  
    - *Awkward commitment:* Must dismiss even the *possibility* that selection shaped the pinnae’s form secondarily, treating developmental constraint as fully sufficient.  
  - **Unoccupied Combination: Constraint-as-Boundary-Only + Non-Adaptive Trait** (Q1: No, Q3: No, Q4: Burden on functionalists)  
    - *Why incoherent:* Claims developmental constraints merely limit *how* selection acts (Q3: "No" = constraint not a competitor) yet insists the burden is on adaptationists (Q4). But if constraints explain the trait alone (Q1: "No"), this defaults to spandrelism—making Q3’s "No" untenable.  

  ---

  ### Ambiguity Flag: Exaptationism vs. Late-Stage Adaptationism  
  - **Why the tree fails to split them:** Both answer Q1 ("Yes") and Q4 ("Burden on functionalists"). They diverge only if we *know* whether selection acted on the pinnae *initially* (adaptationism) or only *after* it arose (exaptationism). Without historical data (e.g., fossils), Q2/Q4 cannot distinguish a trait co-opted *immediately* vs. one under *prolonged* selection. In this bat case, both would demand evidence for a *current* function but disagree on origins.  

  ---

  ### Committed Verdict  
  **Best-supported branch: Gould-Lewontin-Style Spandrelism.**  
  The pinnae’s developmental coupling to a key adaptation (nasal resonators), absence of detectable function despite targeted study, and lack of evidence for co-option make adaptationist accounts speculative. This case exemplifies how structural constraints can produce complex, non-adaptive byproducts. It implies that spandrel explanations deserve greater weight in evolutionary biology—not as rare exceptions, but as inevitable outcomes of developmental architecture. Adaptationism’s burden-shifting (demanding disproof of hidden functions) risks unfalsifiable storytelling; here, the null hypothesis should be non-adaptation unless evidence forces otherwise.
