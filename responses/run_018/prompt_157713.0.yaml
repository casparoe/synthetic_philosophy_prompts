answer: |-
  ## Opening Address: The Foundation Beneath Every Forecast

  Good morning. Welcome to this vital gathering between the University Statistics Department and the School of Public Policy. We are statisticians, modelers, city planners, community advocates, family members – all united by the need to see beyond the horizon. Today, we explore forecasting in public life: predicting the paths of climate impacts, disease, economic shifts, and more, to guide our actions. But before we delve into specific models or policy recommendations, we must acknowledge the hidden foundation upon which every single prediction you hear today will inevitably rest.

  That foundation is a choice. An invisible decision made before the first calculation begins: **Which past events count as truly comparable to the future we're trying to predict?**

  This isn't just a technical step. It is the very lens through which we interpret uncertainty and generate numbers. And crucially, this choice – this selection of our "comparison class" – is never neutral. It carries profound ethical weight, shaping not just the *number*, but *whose reality* that number reflects and *which consequences* it illuminates.

  Consider a concrete, life-or-death example: forecasting the impact of a proposed urban heat-mitigation policy – perhaps planting trees or installing reflective surfaces. We need to predict how many lives it might save during a future heatwave.

  *   **Option 1:** We base our forecast on past heat events in **wealthy, temperate northern cities**. These cities often have high rates of air conditioning, robust healthcare systems, and populations less frequently exposed to extreme heat. Our model, trained on this data, might predict a moderate reduction in heat-related deaths. The policy appears beneficial, but perhaps not overwhelmingly urgent. The number suggests a manageable improvement.
  *   **Option 2:** We base our forecast on past heat events in **rapidly urbanizing tropical cities**. Here, populations are densely packed, often labor outdoors, may lack reliable cooling or healthcare access, and live in environments naturally prone to high heat and humidity. Our model, using *this* data, predicts a dramatic, potentially catastrophic, death toll *without* the policy. The very same intervention now appears not just beneficial, but *essential* and *urgent*. The number screams for immediate action.

  The raw data about the policy itself – the trees, the reflective surfaces – hasn't changed. The mathematical models might be equally sophisticated. What changed was the set of past experiences we deemed relevant – our reference class. This choice didn't just shift the decimal point on a survival rate. It fundamentally altered **whose vulnerability became visible in the forecast**. It changed which communities' historical suffering informed the prediction. It highlighted different trade-offs: efficiency versus equity, incremental improvement versus radical intervention.

  For our quantitative colleagues: You know this intimately as the reference class problem – the core challenge of induction and model specification. For our practitioners: You feel its consequences daily, when a seemingly objective number dictates funding, prioritizes neighborhoods, or shapes emergency plans, sometimes in ways that feel disconnected from the ground truth you witness.

  Today, we must refuse the narrative that forecasting is simply about achieving ever-greater computational mastery over an uncertain future. That narrative obscures this foundational, value-laden choice. Our task is not to hide behind the apparent objectivity of the final number, but to **drag that initial, defining choice – the selection of the comparison class – out of the shadows and into the light of explicit discussion and accountability.**

  Every forecast we discuss – whether for pandemic surges, economic stimulus effects, or climate migration flows – relies on someone deciding "what counts as similar." We must ask: Similar *to whom*? Similar *according to which priorities*? Whose history is deemed relevant, and whose is excluded? How does this selection amplify some voices and risks while muting others?

  This workshop is not merely about building better models; it’s about fostering the collective courage and rigor to interrogate the assumptions embedded within them. It's about ensuring that the forecasts shaping our public life are built on comparisons chosen transparently, debated ethically, and held accountable to the diverse communities they will inevitably impact.

  **Our shared responsibility today is to ensure the numbers we generate see what we choose to see, and that we choose to see justly.**
