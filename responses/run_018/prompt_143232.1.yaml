  We are designing a 90-minute simulation with 12 participants divided into three estates: producers (4), administrators (4), and interpreters (4). There will be three rounds, each with 20 minutes of deliberation, 10 minutes for decision, and 10 minutes for revelation. The facilitator will introduce a "base condition" (technological constraint and scarcity threshold) that shifts between rounds based on the prior round's superstructural choices.

  Key concepts to simulate: 
  - Reverse determination: superstructural choices (legal, scientific, ritual) redefine what counts as the economic base.
  - Collective coherence as the goal (not individual victory).

  Structure:
  1. Introduction (5 minutes): Explain the three estates and the three types of decisions (resource-extraction rule, research priority, ceremonial obligation). Clarify that the goal is collective coherence (avoiding collapse) and that each estate has hidden incentives that may conflict with others. Emphasize that the base condition (which defines the economic base) will change between rounds based on their superstructural choices.

  2. Three Rounds (each 40 minutes: 20 delib, 10 decide, 10 reveal)
     Round 1: 
        - Base condition (set by facilitator at start, unknown to players): 
          Example: Technology allows extraction of only two types of resources: wood and stone. Scarcity threshold: if total extracted units < 20, then scarcity crisis (collective payoff penalty).
        - Decisions:
            a. Resource-extraction rule (legal): e.g., "Only producers with a license can extract stone" or "Open access to all resources."
            b. Research priority (scientific): e.g., "Study metalworking" or "Study agriculture."
            c. Ceremonial obligation (ritual): e.g., "Weekly offering of 5 units of wood to the temple" or "No ceremonial obligations."

     Round 2: 
        - Base condition updated based on Round 1 superstructure. For example, if in Round 1 they chose a research priority of "metalworking", then in Round 2 the technology now also allows extraction of metal. But if they set a ceremonial obligation that consumes wood, then the scarcity threshold might be raised (because wood is now diverted). Also, if the legal rule in Round 1 classified a new resource (e.g., by granting licenses for stone, which might now be considered a distinct resource), then that resource becomes part of the base.

     Round 3: Similarly, base condition updated from Round 2.

  3. Debrief (20 minutes): 
     - Map each round to Marxist concepts: base (the material conditions of production, technology, resources), superstructure (legal, political, ideological institutions and practices), relative autonomy (the superstructure has its own logic but is ultimately conditioned by the base), determination "in the last instance" (the base is the ultimate determinant, but the superstructure can react back on the base).
     - Ask participants: When did you feel causation running downward (base to superstructure) versus upward (superstructure to base)? 
     - Clarify what the simulation cannot do: long historical time, macro patterns. Also, the facilitator's rule shifts are engineered to mimic emergent causation, but in reality, historical materialism operates over generations. Warn against misinterpreting the engineered shifts as proof of the theory and explain that the point is to feel the circularity and the difficulty of cleanly separating base and superstructure.

  Roles and Hidden Incentives:
  - Producers (4): 
    - Private goal: Maximize production output (they get points for high extraction, but also for avoiding overwork). 
    - Hidden info: They know the current technology (only at the beginning of each round, the facilitator will reveal the base condition for that round to everyone, but the producers might have a slight advantage in understanding extraction). However, they also have a hidden incentive: they want to avoid ceremonial obligations that require them to give up resources without compensation.

  - Administrators (4):
    - Private goal: Ensure stability and avoid conflict. They get points for smooth operation (no disputes) and meeting the scarcity threshold. 
    - Hidden info: They know that if the scarcity threshold is not met, there will be unrest. They also have a hidden incentive: they want to expand their regulatory power (so they prefer legal rules that give them more control).

  - Interpreters (4):
    - Private goal: Promote cultural and scientific advancement. They get points for research being funded and for ceremonial practices being observed. 
    - Hidden info: They know that research and ceremonies might have long-term benefits (but also costs). They have a hidden incentive: they want to increase the importance of their own role (so they prefer elaborate ceremonies and research that requires their interpretation).

  Payoff Rules:
  - Collective Coherence Score: 
    - Avoid scarcity crisis (if total extraction >= threshold, +10; else -10).
    - Avoid conflict (if there is a dispute, -5; administrators can report if there was a dispute during deliberation).
    - Cultural/Scientific Advancement: 
        - If research priority was funded (i.e., chosen) and it leads to a new technology (which the facilitator will reveal in the next round as part of base change), then +5 in the round when the benefit is realized.
        - If ceremonial obligation is met (i.e., the required resources were set aside and not used for production), then +5 for social cohesion (but subtract the resources from the extraction total for scarcity?).

  However, note: the ceremonial obligation subtracts resources, so it might cause scarcity. This tension is intentional.

