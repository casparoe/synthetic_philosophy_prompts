answer: |-
  **MEMORANDUM**  
  To: Activities Funding Board  
  From: [Your Name], Student Member  
  Date: October 26, 2023  
  Subject: Recommendation on Peer-Tutoring Platform Funding Request  

  **I recommend we deny the $7,000 funding request for the peer-tutoring platform and redirect these funds to small clubs. We should migrate to the free open-source scheduler this summer, with a commitment to revisit support if student adoption reaches 80% of tutoring matches by December 2024.**  

  ### Why Terminate Funding?  
  The platform has failed its core purpose after three years and $21,000: scheduling remains manual 50% of the time due to unresolved technical flaws. Spending another $7,000 perpetuates inefficiency when superior alternatives exist. The commercial license ($9,000/year) is prohibitively expensive, but the open-source migration—while losing historical data—solves the functional problem at no recurring cost. The funds saved could immediately benefit 12 clubs denied last year, aligning with our duty to maximize impact.  

  ### Addressing Key Concerns  
  1.  **Institutional Continuity:**  
      You rightly note that if each Board ignores prior investments, multi-year projects become untenable. However, this project has received *three years* of patience—ample time to demonstrate viability. Our precedent isn’t "abandon at first setback" (see film festival), but "sunset persistent underperformers" (see newspaper app). Commitment requires progress; here, there is none.  

  2.  **Student Contribution:**  
      The maintainers’ dedication is admirable, and their work deserves recognition—but not indefinite funding. Their effort built skills and legacy; that value isn’t erased by ending funding. Migrating to open-source *preserves* their infrastructure work while fixing the critical flaw. We honor their labor by repurposing it productively, not by funding a failing system.  

  ### The Strongest Counterargument  
  Defenders argue: "Killing the platform disregards our institutional role in sustaining long-term projects and dismisses the maintainers’ emotional investment." This is valid—but the platform’s chronic underperformance forces us to prioritize functional outcomes over symbolism.  

  ### Forward-Looking Rule  
  **Henceforth, multi-year projects must meet annual performance benchmarks (e.g., 75% adoption, cost efficiency, or user satisfaction) to qualify for renewed funding; exceptions require documented evidence of imminent turnaround.**  

  We steward limited resources: redirecting funds today upholds accountability while leaving the door open for student-driven solutions to prove their value.  

