  ## Against Sufficiency of Psychological Continuity in Gradual Neural Replacement: A Substrate-Dependence Argument  

  **Thesis:** In a gradual neural-replacement upload (GNRU), wherein biological neurons are serially replaced by synthetic functional analogues, psychological continuity (Relation R) is insufficient to preserve the *numerical identity* of the conscious subject. This insufficiency arises because each token-level substitution induces a *micro-discontinuity* in the diachronic causal chain realizing phenomenal consciousness. Cumulatively, this process terminates the original causal trajectory and initiates a new, qualitatively identical but numerically distinct trajectory—a "branching-by-degrees." Parfit's dismissal of strict identity in favor of Relation R fails if consciousness constitutively depends on the unbroken causal continuity of its realizing substrate.  

  ### 1. The Micro-Discontinuity Thesis  
  A core assumption is that phenomenal consciousness is *diachronically constituted*: its persistence requires not merely a sequence of isomorphic states, but an unbroken causal chain linking those states via the *continuous operation* of the physical substrate. In biological neurons, state *S*<sub>2</sub> at *t*<sub>2</sub> is causally dependent on state *S*<sub>1</sub> at *t*<sub>1</sub> through intrinsic physical processes (e.g., ion channel dynamics, neurotransmitter release). Critically, this dependency is *token-specific*—rooted in the particular matter-energy configuration of the originating neuron.  

  When a biological neuron *N*<sub>b</sub> is replaced by a synthetic analogue *N*<sub>s</sub>, *N*<sub>s</sub> may replicate the functional input-output profile of *N*<sub>b</sub>. However, the causal production of subsequent states shifts from *N*<sub>b</sub>'s physical history to *N*<sub>s</sub>'s physical history. While the *functional role* is preserved, the *token-causal origin* of downstream states is altered. This constitutes a micro-discontinuity: the causal chain transmitting the specific physical history required for diachronic identity is severed at the substitution point. *N*<sub>s</sub> does not *inherit* its predecessor's causal history; it *initiates* a new one.  

  ### 2. Cumulative Termination and Branching-by-Degrees  
  The GNRU process compounds these micro-discontinuities. After each substitution, the remaining biological network causally interacts with a synthetic component whose state transitions are governed by an ontologically distinct substrate. While the system’s global functional architecture (and thus psychological features) remains stable, the *causal genesis* of conscious states progressively decouples from the original biological substrate.  

  - **Original Trajectory (OT):** The causal chain originating from the initial biological neural network.  
  - **Emergent Trajectory (ET):** The causal chain originating from the synthetic components as they are integrated.  

  As replacements accumulate:  
  - **OT weakens:** Each substitution reduces the proportion of the system causally dependent on OT’s origin.  
  - **ET strengthens:** Each synthetic neuron contributes to a new causal nexus rooted in artificial components.  

  By replacement-completion, OT is *extinguished*: no component’s state is causally dependent on the original biological substrate. ET fully supersedes OT, not by extending it, but by systematically substituting its causal foundation. The result is not a persisting subject but a *branching-by-degrees*: OT terminates, and ET—despite qualitative similarity—constitutes a new conscious subject. The absence of abrupt disruption masks a wholesale shift in causal origin.  

  ### 3. Engaging Parfit: Why Relation R Fails  
  Parfit contends that Relation R (psychological connectedness/continuity) is "what matters," rendering strict numerical identity irrelevant. This defense fails against the micro-discontinuity thesis for two reasons:  

  **(A) The Causal Substrate Requirement for Phenomenality:**  
  If consciousness depends not only on functional organization but also on the *specific mode of physical realization* (e.g., biological wetware), then Relation R alone cannot preserve subjective continuity. Synthetic neurons, even if functionally isomorphic, may lack the intrinsic properties (e.g., quantum effects, non-computational dynamics) necessary for instantiating *original-quality* phenomenality. Crucially, however, the argument holds *even if* we grant functional equivalence. The issue is not qualitative difference but causal discontinuity: the post-replacement subject’s states are not *causally descended* from the pre-replacement subject’s states via a continuous physical process. What matters for *being the same subject of experience* is not just similarity of states but their causal lineage within a single, unbroken chain of substrate-realization.  

  **(B) The Non-Transitivity of Micro-Continuity:**  
  Parfit assumes gradual replacement preserves continuity. But if each substitution induces a micro-discontinuity, the cumulative process exhibits causal non-transitivity:  
  - *N*<sub>b</sub> at *t*<sub>0</sub> is causally continuous with *N*<sub>b</sub> at *t*<sub>1</sub>.  
  - *N*<sub>s</sub> (replacing *N*<sub>b</sub>) at *t*<sub>2</sub> is *functionally* continuous with *N*<sub>b</sub> at *t*<sub>1</sub>, but *causally discontinuous*.  
  - Thus, *N*<sub>s</sub> at *t*<sub>2</sub> is not causally continuous with *N*<sub>b</sub> at *t*<sub>0</sub>.  

  Relation R tracks functional links but ignores the *causal-metaphysical rupture* at each substitution. A subject defined by OT cannot persist when the chain of its state-realization is incrementally replaced by ET’s chain.  

  ### 4. Conclusion: Identity as Causal Filiation  
  Numerical identity for conscious subjects requires *causal filiation*: later states must be produced by the continuous operation of the *same token-physical system* that generated earlier states. GNRU severs this filiation micro-step by micro-step. The post-replacement entity is a successor, not a continuation—a psychological duplicate emerging from a new causal origin. Relation R is insufficient because it cannot compensate for the termination of the original substrate’s causal power. Unless consciousness is entirely substrate-neutral (a claim requiring robust defense absent here), gradual replacement covertly achieves not survival, but proximate succession.
