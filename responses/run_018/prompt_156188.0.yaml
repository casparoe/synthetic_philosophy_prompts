prompt: |-
  You are a professional philosopher of ethics with some background in museum studies, and I want you to think carefully—start with a quick brainstorm of the conceptual traps—before you build anything practical.

  I'm on the board of a public memorial musem and we keep getting proposals that rank or compare mass atrocities to justify exibit sizes, funding splits, or plaque wording—things like "this gallery should be 30% smaller because the death toll was lower" or "this event was more bureaucratic so it belongs in the systems section not the human suffering section." We need a reusable decision proceedure my board can run in about 20 minutes per proposal, without turning us all into philosophers. Ground it in whatever philosophy actually knows about comparing evils—moral incommensurability, quantitative vs qualitative comparison, the specific harm comparison does to survivors and descendants—but translate it into a checklist with ordered tests, clear stop points, and flags for admissible, inadmissible, or needs-judgment. Don't ask me to read anything; this has to work for people with no web access and no philosophy training.

  Please answer in these sections, in this order:

  1. Conceptual brainstorm (about 150 words): the main pitfalls and the distinctions that must survive in the procedure, including one niche idea—maybe something about dimensional asymmetry or comparative moral density—that goes deeper than the usual "you can't rank suffering" line.
  2. The decision proceedure itself (about 400 words): step-by-step in plain language, with the questions in order, what counts as yes/no/maybe, the hard cases, and the halt point where we say "do not compare." Include a small set of test sentences or criteria the board can apply directly.
  3. Three worked cases (about 500 words): (a) comparing death tolls of the Rwandan genocide and the Cambodian genocide to decide exhibit square footage; (b) comparing the bureaucratic structure of the Holocaust and the Atlantic slave trade for a "systems of violence" gallery; (c) comparing victim suffering across two events for a memorial plaque. One should give an answer the board won't like. Walk through the steps exactly.
  4. Limits, misfires, and judgment calls (about 200 words): where the proceedure definitely fails, which steps are just judgment dressed up as rules, and which proposals should get kicked upstairs to an ethics committee.

  Keep it somewhat in the weeds but don't lean on super obscure theories a small model wouldn't have properly memorized. No bibliography, no reading list, no citations—just the tool.
reasoning: |-
  Hmm, the user is on the board of a public memorial museum and needs a practical decision procedure to handle proposals that involve ranking or comparing mass atrocities. They want something grounded in ethical philosophy but usable by non-philosophers in 20-minute meetings. Let me unpack this.

  First, the core problem: comparing atrocities risks moral reductionism and survivor trauma. The museum's context means any comparison could retraumatize communities or oversimplify complex historical events. The user explicitly mentions moral incommensurability and dimensional asymmetry - that's key. They need a tool that stops harmful comparisons early while allowing necessary contextual decisions.

  Brainstorming pitfalls: Quantitative comparisons (like death tolls) ignore qualitative differences in suffering. Structural comparisons (bureaucratic systems vs direct violence) create false equivalences. Even temporal proximity matters - comparing recent traumas risks reopening wounds. The niche angle: "moral density" - how atrocities concentrate unique harms that resist scaling. Also, institutional role: museums memorialize, not adjudicate historical hierarchies.

  For the procedure, it needs clear stop signs. First step must assess if comparison serves memorial purpose or just administrative convenience. Then check for survivor harm potential - that's non-negotiable. The "dimensional alignment" test is crucial: are we comparing comparable aspects? Death tolls vs systemic cruelty fails this instantly. 

  The test cases reveal landmines: Using death tolls for exhibit sizing (Case A) fails immediately on quantification. Structural comparison (Case B) might pass if framed as different mechanisms, not hierarchies. But victim suffering comparison (Case C) should always stop - that's the "board won't like" answer because emotional appeals often drive such proposals.

  Judgment calls linger in Step 2 (purpose) and Step 4 (dimensional alignment). The procedure isn't philosophy-proof, but it forces explicit justification. Anything ambiguous should go to ethics committee - especially proposals invoking "educational necessity" that might mask laziness.

  Final design principle: The tool must frustrate instrumental comparisons. Make the path of least resistance "don't compare." Survivor testimony overrules all - if communities protest, halt immediately. That's not philosophy; it's basic respect.
answer: |-
  Here’s a decision procedure for atrocity comparisons, grounded in ethics and museum practice:

  ### 1. Conceptual Brainstorm (149 words)
  **Pitfalls:**  
  - **Quantification Fallacy:** Reducing suffering to numbers ignores qualitative differences (e.g., torture duration, cultural destruction).  
  - **Dimensional Asymmetry:** Atrocities differ in *kinds* of harm (physical, psychological, intergenerational). Comparing bureaucratic efficiency to visceral brutality conflates distinct moral dimensions.  
  - **Moral Corrosion:** Implicit rankings delegitimize survivor experiences and risk political weaponization.  
  - **Niche Concept: Moral Density** (inspired by Claudia Card): Some events concentrate extreme *types* of harm per unit (e.g., family annihilation camps vs. slower demographic collapse). This resists linear scaling.  

  **Essential Distinctions:**  
  - **Purpose vs. Comparison:** Is the goal contextual understanding or hierarchical judgment?  
  - **Survivor Harm:** Will this comparison retraumatize or divide communities?  
  - **Incommensurability Threshold:** Some evils share no common metric (e.g., genocide vs. famine under tyranny).

  ---

  ### 2. Decision Procedure (398 words)  
  **Step 1: Purpose Check**  
  *Question: "Is this comparison ABSOLUTELY required for visitor understanding of THIS exhibit’s core narrative?"*  
  - **Yes:** Proceed. **No/Mixed:** **HALT.** (e.g., funding splits fail here).  
  *Test: "Could we explain this without comparing?"*  

  **Step 2: Survivor Harm Screen**  
  *Question: "Would credible evidence suggest affected communities would view this as contesting their suffering?"*  
  - **Yes:** **HALT.** **No:** Proceed. **Unsure:** Consult survivor advisory panel (if none, **HALT**).  
  *Test: "Would we say this at a survivors’ commemoration?"*  

  **Step 3: Dimensional Alignment**  
  *Question: "Are we comparing the SAME type of harm (e.g., both systemic logistics) with comparable evidence?"*  
  - **Yes:** Proceed. **No:** **HALT.** (e.g., comparing death tolls to sexual violence fails).  
  *Test: "Are the compared aspects within the same academic field of study?"*  

  **Step 4: Qualitative Primacy**  
  *Question: "Does the proposal prioritize numbers over lived experience?"*  
  - **Yes:** **HALT.** **No:** Proceed.  
  *Test: "Are we using percentages/ratios instead of survivor voices?"*  

  **Step 5: Moral Density Assessment**  
  *Question: "Does the comparison ignore unique intensifiers (e.g., betrayal by neighbors vs. distant bureaucrats)?"*  
  - **Yes:** **HALT.** **No:** **Admissible** with extreme caution.  
  *Test: "Could this comparison be used to minimize one event?"*  

  **HARD STOP** at any "HALT." Only proceed if all steps yield "Proceed."  

  ---

  ### 3. Worked Cases  
  **(a) Rwandan vs. Cambodian genocide exhibit sizing by death toll**  
  1. **Purpose:** "Needed for understanding?" No. Size could reflect archival resources, not lives. → *HALT at Step 1.*  
  2. *Result: Inadmissible.* Square footage decisions must use non-comparative criteria (e.g., artifact availability).  

  **(b) Holocaust (bureaucracy) vs. Atlantic Slave Trade (systems) for "systems of violence" gallery**  
  1. **Purpose:** Yes (if exploring administrative mechanisms).  
  2. **Survivor Harm:** Unsure → Requires consultation. If panel approves, proceed.  
  3. **Dimensional Alignment:** Yes (both analyze systems).  
  4. **Qualitative Primacy:** If emphasizing archival documents over suffering, *HALT at Step 4.*  
  5. **Moral Density:** Holocaust’s industrial scale vs. slave trade’s centuries-long economy → Risk of flattening. Likely *HALT at Step 5.*  
  *Result: Likely inadmissible. Solution: Display separately with distinct captions.*  

  **(c) Comparing victim suffering for a plaque (e.g., "Event X caused more anguish than Event Y")**  
  1. **Purpose:** No credible educational justification. → *HALT at Step 1.*  
  2. *Result: Inadmissible (board won’t like this: plaques must honor without hierarchy).*  
  *Alternative: "Both events caused profound, irreversible suffering."*  

  ---

  ### 4. Limits & Judgment Calls (199 words)  
  **Where It Fails:**  
  - **Ambiguous Purpose:** Step 1 requires board judgment; "understanding" can be stretched.  
  - **Survivor Consultation:** Step 2’s "credible evidence" may lack data. Default to caution.  
  - **Moral Density:** Step 5 is inherently subjective (e.g., judging "intensifiers").  

  **Kick Upstairs to Ethics Committee When:**  
  - Proposals pass all steps but involve ongoing trauma (e.g., recent atrocities).  
  - Dimensional alignment is academically contested (e.g., is cultural erasure comparable to mass killing?).  
  - Funding/space constraints force impossible choices (procedure avoids this; ethics committee must decide non-comparative criteria).  

  **Misfires:**  
  - Over-application: Rejecting *all* contextual references (e.g., "Holocaust-era railways" vs. "Ottoman railway deportations" isn’t comparison).  
  - False positives: Mistaking "dimensional alignment" for justification (e.g., comparing two genocides’ bureaucracy still risks hierarchy).  

  **Core Tension:** The procedure is 70% ethical safeguard, 30% practical tool. Its rigidity is intentional—when in doubt, it says "don’t compare."
