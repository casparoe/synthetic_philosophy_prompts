answer: |-
  ## Joint Statement on Expected Value Fanaticism

  **Preface:** We, Side A (Fanatic) and Side B (Guardrails), disagree fundamentally on how agents should approach decisions involving extremely low probabilities of astronomically large payoffs ("fanaticism cases"). This document outlines our points of agreement, key disagreements, and specific cruxes where future evidence or argument could shift our views. We aim for clarity on *where* and *why* we disagree.

  **Section 1: Agreed Foundations & The Core Problem**

  1.  **The Fanaticism Problem Defined:** We agree the core problem arises when:
      *   A choice offers a minuscule probability `p` (e.g., 1 in 10^12) of an outcome with an astronomically large positive utility `U`.
      *   The alternative is a "sure thing" with a large, finite, positive utility `S`.
      *   The `p * U` product is so immense that it mathematically dominates `S` in standard expected utility (EU) calculation (`p * U >> S`).
      *   **Crucially:** This creates tension between the *logic of expected utility maximization* and powerful *intuitions of absurdity or recklessness*. It is *not just Pascal's Wager*, as it abstracts away specific theological claims and focuses on the structural dilemma of EU with potentially unbounded utility functions under extreme probability.

  2.  **Stylized Cases Both Find Hard:**
      *   **Pascal's Mugger (Original):** A stranger credibly threatens to inflict minor pain unless you give them $5, but claims that if you pay, they will use a hidden power to grant you utility equivalent to 3^^^3 (an unimaginably vast number) happy lives. `p` is extremely low but non-zero (say, 1/10^12). EU dictates paying $5. Both agree this *feels* wrong, but disagree on why and what to do.
      *   **Dust Specks vs. Torture:** Choosing between (a) 3^^^3 people enduring one dust speck in their eye, or (b) one person being tortured horribly for 50 years. If utility scales linearly with number affected, EU dictates the torture. Both agree this is deeply counterintuitive and potentially unacceptable as practical decision advice.
      *   **The Reliable-but-Tiny Bet:** A trustworthy, advanced civilization offers a meticulously verified lottery ticket: 1/10^12 chance to save a quadrillion lives, cost $10. Alternative: Guaranteed save 100 lives. EU dictates the ticket. Both agree this is *harder* to dismiss than Pascal's Mugger, creating tension.

  3.  **Burden of Argument:** Side A asserts that standard EU maximization is the default, rational position. The burden lies on Side B to provide a *principled, non-arbitrary, and general* modification to EU theory (or decision rule) that avoids fanaticism without causing worse counterexamples or abandoning core rationality norms. Side B asserts that fanaticism cases are a clear *reductio ad absurdum* of applying standard EU maximization naively in extreme regimes, and the burden lies on Side A to demonstrate why the intuitively reckless course is *actually* rational or why proposed guardrails are fundamentally flawed.

  **Section 2: Disagreements Table**

  | Crux                                  | Side A (Fanatic) Position                                                                                                                               | Side B (Guardrails) Position                                                                                                                                                     |
  | :------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **(a) Core Disagreement: Value vs. Uncertainty** | **The core fight is about the shape of the value function.** If utility is unbounded above and linear (or sufficiently fast-growing) in the relevant goods (lives saved, happiness), fanaticism is mandatory. Probability uncertainty is a separate, tractable epistemic issue handled by standard methods (e.g., expected utility over probability estimates). | **The core fight is about epistemic uncertainty and model error.** The problem is that in real-world fanaticism cases, *our estimates of `p` and `U` are inherently unreliable and potentially off by many orders of magnitude*. Standard EU cannot handle this profound model uncertainty safely. |
  | **(b) Portfolio Problem**             | **Portfolios strengthen the fanatic's case.** Facing a large number `N` of independent, small-cost, positive-EV fanaticism bets, the Law of Large Numbers applies. The probability of a net loss becomes negligible, while the potential gain is astronomical. Diversification mitigates individual bet risk. | **Portfolios reintroduce the core worry via correlated error.** While individual bets might be modeled as independent, the *errors in our model* (e.g., misunderstanding physics, underestimating scammers, flawed utility extrapolation) are likely highly correlated across bets. This "model risk" doesn't diversify; it can cause catastrophic simultaneous failure across the entire portfolio. |
  | **(c) Cheap Claims & Symmetry**       | **Symmetry arguments fail to negate specific offers.** For any specific Pascal's Mugger offering `p * U`, the existence of hypothetical "anti-muggers" (offering `p * -U`) doesn't change the expected value calculus *of the actual offer in front of you*. Rationality requires evaluating the offer based on your best estimate. | **Cheap claims necessitate discounting.** The ease of generating arbitrarily many mutually exclusive fanaticism claims (`Mugger X: Pay me or I create +U!`, `Mugger Y: Pay me or X fails and I create -U!`) implies symmetry. This symmetry suggests the *net* expected value of engaging with *any* such claim, or the entire class, is near zero or undefined, requiring extreme discounting of individual claims. |
  | **(d) Normative vs. Epistemic (Added Crux)** | **The issue is normative:** Decision theory *should* follow expected value calculations based on the agent's best current credences and utility function, even into extreme tails. Rationality demands it. Guardrails are normatively unjustified. | **The issue is epistemic:** No rational decision procedure can demand we act based on calculations we have overwhelming reason to believe are untrustworthy *in this specific regime*. Following standard EU here is epistemically irresponsible, not rational. |

  **Section 3: Concrete Cases & Predictions for Cruxes**

  *   **Crux (a) - Value vs. Uncertainty:**
      *   **Case:** "The Alien Coin Flip": Advanced aliens show you a coin. They claim it's fair and offer: Heads (p=0.5), you get $100. Tails (p=0.5), their fleet saves 10^15 lives elsewhere. Alternatively, take $50 sure. *Then*, they reveal: "Our claim about fairness might be wrong. Our internal calibration process has a known error rate; we estimate the true P(Heads) is between 10^-6 and 0.999999." EU based on mean P(Tails) still strongly favors the flip. Does the profound uncertainty change the rational choice?
      *   **Side A Prediction:** No. Rational choice remains the flip based on the best estimate (e.g., mean P(Tails)). Uncertainty is factored into the expected probability.
      *   **Side B Prediction:** Yes. This level of uncertainty invalidates the fanaticism calculation. The rational choice reverts to the sure thing ($50) or requires drastic discounting of the tails payoff.

  *   **Crux (b) - Portfolio Problem:**
      *   **Case:** "The Quadrillion Lotteries": You are offered participation in 10^12 independent lotteries. Each costs $0.0001 to enter. Each has a stated 10^-24 chance to save 10^12 lives (stated EU per lottery: +1 life saved). Total cost: $100 million. Total stated EU: +10^12 lives saved. However, the same entity runs all lotteries using the same underlying (opaque) technology. Should you invest the $100 million?
      *   **Side A Prediction:** Yes. The Law of Large Numbers guarantees near-certainty of a net gain proportional to the massive positive stated EV. Model error/correlation is speculative.
      *   **Side B Prediction:** No. The massive scale amplifies the risk. A single pervasive flaw in the model (e.g., the technology fundamentally doesn't work, or the entity is deceptive) makes *all* lotteries worthless or harmful simultaneously, leading to a near-certain $100m loss for zero gain. The stated independence is untrustworthy at this scale/model uncertainty.

  *   **Crux (c) - Cheap Claims & Symmetry:**
      *   **Case:** "The Duelling Muggers": Mugger Alpha demands $5, claiming a 1/10^12 chance of granting +3^^^3 utility if paid. Before you decide, Mugger Beta appears, demanding $5, claiming: "If you pay Alpha, I have a 1/10^12 chance to impose -3^^^3 utility. If you pay *me*, I'll neutralize Alpha's attempt and grant +3^^^3 myself (also p=1/10^12). If you pay neither, nothing happens." Assume both appear equally (un)credible. What should you do?
      *   **Side A Prediction:** Evaluate each offer independently based on its own stated `p * U`. Paying Alpha has +EV, paying Beta has +EV, paying neither has 0 EV. You should pay one of them (perhaps chosen arbitrarily, as EVs are equal). The existence of the other doesn't negate the +EV of acting on one.
      *   **Side B Prediction:** The symmetry demonstrates the cheapness of the claim. Paying either has an *indefinite* net EV due to the symmetrical, contradictory threat/offer. The rational choice is to pay neither, treating both claims as canceling noise or as invalidating the entire EV calculation for such propositions.

  **Section 4: Verbal Disputes & Settled/Unsettled Status**

  *   **Verbal Dispute:** The term "**expected value**" itself is partially verbal. Both agree on the mathematical definition *given precise probabilities and utilities*. The fight is about whether "expected value" *as a guide to rational action* inherently assumes those inputs are sufficiently reliable, or whether the calculation must be followed regardless of input shakiness. Similarly, "**value**" (`U`) is contested: Side A often assumes utilities can be quantified and compared linearly across vast scales based on abstract principles; Side B is deeply skeptical this is meaningful or reliable in the fanaticism regime.
  *   **Settled (Among Theorists):**
      *   EU maximization with an unbounded utility function mathematically implies fanaticism in the stylized cases.
      *   Bounded utility functions formally avoid fanaticism.
      *   The core dilemma presents a significant challenge to naive applications of EU theory.
  *   **Live Controversy (Unsettled):**
      *   **How to formally incorporate deep uncertainty/model error into decision theory** in a way that handles fanaticism cases satisfactorily. (Risk/ambiguity aversion, Knightian uncertainty, discounting heuristics, etc., are all contested approaches).
      *   **Whether rationality *requires* unbounded utility.** (Side B often argues boundedness is pragmatically necessary; Side A argues unboundedness follows from plausible axioms or value structures).
      *   **The viability and rational justification of specific "guardrails"** (probability floors, value ceilings, reliability discounts). Are they principled or arbitrary?
      *   **The significance of portfolio effects under model uncertainty.** Does diversification of bets mitigate or amplify the model risk?
  *   **Where We're Unsure (as Collaborators):** Whether the core disagreement is ultimately resolvable within standard decision theory frameworks, or if it points to a fundamental limitation requiring a paradigm shift. We are also unsure how much real-world decision-making (e.g., in AI alignment, existential risk, philanthropy) is *genuinely* affected by pure fanaticism cases versus more moderate versions of low-probability high-impact decisions.

  **Conclusion:** This document clarifies that our disagreement is deep, touching on fundamental norms of rationality, epistemology, and the limits of quantification. We commit to focusing future collaborative work on the specified cruxes and their concrete test cases, aiming to refine our understanding and identify potential resolutions or at least clearer points of irreconcilable difference. We agree that dismissing the other side's core concern is unproductive.

