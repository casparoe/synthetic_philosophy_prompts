answer: |-
  Here's the disambiguated menu for your slogan "those subject to coercive law ought to author it," broken down by reading type, implications for inclusion/exclusion, and boundary challenges:

  ### 1. **Conceptual Reading: "Subject To" as Physical Presence/Legal Force**  
     - **Definition:** You're "subject" if state agents can legally arrest, fine, tax, or otherwise directly impose penalties on you *within its territory*.  
     - **Includes:** Undocumented immigrants (cops can jail them), short-term visitors (subject to traffic laws).  
     - **Excludes:** Global supply-chain workers abroad, climate refugees outside borders.  
     - **Boundary Test:**  
       - *State lines:* Holds up cleanly—only those physically present are subject to daily enforcement.  
       - *Causal impact:* Fails—someone in Bangladesh making your iPhone isn't directly jailed by your cops.  
     - **Survival Rating:** ✔️ (Works with state lines) | ❌ (Collapses under causal impact)  

  ### 2. **Normative Reading: "Ought" as Fairness/Non-Domination**  
     - **Definition:** Coercion is only legitimate if victims have a democratic voice ("no taxation without representation" expanded).  
     - **Includes:** Undocumented immigrants (jailed/deported by state), residents.  
     - **Excludes:** Short-term visitors (if coercion is deemed temporary/light).  
     - **Boundary Test:**  
       - *State lines:* Defensible if you accept territorial coercion as uniquely severe.  
       - *Causal impact:* Demands including supply-chain workers (coerced by trade policies) or climate refugees (harmed by your emissions).  
     - **Survival Rating:** ✔️ (State lines—arbitrary but practical) | ❌ (Causal impact—overextends wildly)  

  ### 3. **Metaphysical Reading: "Author" as Constituent Power**  
     - **Definition:** Being coerced by the law *constitutes* your political identity; you’re part of the demos-by-coercion.  
     - **Includes:** Undocumented immigrants (systematically governed by law).  
     - **Excludes:** Short-term visitors (if their "membership" is seen as incidental).  
     - **Boundary Test:**  
       - *State lines:* Limiting "coercive constitution" to territory is intuitive.  
       - *Causal impact:* Pulls in supply-chain workers (exploited by labor laws) and climate refugees (victims of environmental regulations).  
     - **Survival Rating:** ⚠️ (State lines—metaphysically shaky) | ❌ (Causal impact—unworkably broad)  

  ### 4. **Systemic Vulnerability Reading: "Subject To" as Structural Dependence**  
     - **Definition:** You're "subject" if your life chances depend on compliance with the state’s rules (e.g., labor markets, property rights).  
     - **Includes:** Undocumented immigrants (reliant on informal economy shaped by law), residents.  
     - **Excludes:** Short-term tourists (minimal systemic dependence).  
     - **Boundary Test:**  
       - *State lines:* Excludes external workers/climate refugees (if dependence requires presence).  
       - *Causal impact:* Includes global workers (dependent on trade laws), climate refugees (harmed by industrial policies).  
     - **Survival Rating:** ✔️ (State lines—focuses on domestic systems) | ❌ (Causal impact—global capitalism makes everyone vulnerable)  

  ---

  ### Quick-Reference Cheat Sheet:  
  | **Reading**               | **Undocumented Immigrants?** | **Short-Term Visitors?** | **Global Workers/Climate Refugees?** | **Works at State Lines?** |  
  |---------------------------|------------------------------|--------------------------|--------------------------------------|---------------------------|  
  | **Physical Presence**     | ✅ Yes                       | ✅ Yes                   | ❌ No                                | ✔️ Yes                    |  
  | **Normative Fairness**    | ✅ Yes                       | ❌ Maybe not             | ✅ (Causal impact forces it)         | ✔️ Yes (pragmatically)    |  
  | **Metaphysical Subject**  | ✅ Yes                       | ❌ No                    | ✅ (Causal impact forces it)         | ⚠️ Barely                 |  
  | **Systemic Dependence**   | ✅ Yes                       | ❌ No                    | ❌ No (✅ under causal impact)       | ✔️ Yes                    |  

  ### Key Tensions:  
  - **Undocumented Immigrants:** Included in *all readings* except strict physical presence if you deny they’re "subject" (which is empirically false).  
  - **Short-Term Visitors:** Only *required* under Physical Presence; other readings can exclude them.  
  - **Global Workers/Climate Refugees:** The **Achilles' Heel**. Only excluded if you strictly tie "subject" to territorial enforcement (Physical Presence) or local systemic dependence. Normative/Metaphysical readings *demand* their inclusion under causal impact—which explodes the demos.  
  - **State Lines vs. Causal Impact:** State lines save Physical Presence and Systemic Dependence but feel arbitrary for Normative/Metaphysical readings. Causal impact collapses into global democracy.  

  **Bottom Line:** Your slogan works best as a **Normative Fairness** argument bounded by **state lines** to include the locally coerced (undocumented) while excluding tourists and global actors. But it’s a band-aid—the minute you justify via *impact* not territory, you’re arguing for planetary demos. Stick to territorial coercion for seminar wins.
