prompt: |-
  Hey — in my demos seminar I keep throwing around 'those subject to coercive law ought to author it' to push back on both open-border and closure-only views, but I'm pretty sure I'm running together about four different arguments. Can you break the slogan into its precise readings — conceptual, normative, maybe even metaphysical — and tell me which ones actually license including undocumented immigrants, which ones exclude short-term visitors, and which ones fall apart once you notice they might also cover global supply-chain workers or climate refugees who never set foot in the state? Lay it out as a disambiguted menu, not a sermon, say which readings survive drawing the boundry at state lines vs. at causal impact, and write in American English. I'm drafting this between lectures (so forgive the typo or two), and please skip citations — I just need the conceptual map.
