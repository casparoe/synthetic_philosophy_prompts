  Biggest hole: All readings struggle with "never set foot" groups. Only causal-impact includes them, but that's unsustainable. User might need to embrace boundedness or rethink "authoring"—maybe representation without voting? 

  Final menu should flag which readings are defensible vs. slippery. Metaphysical is weakest; normative fairness is strongest if bounded pragmatically. Undocumented are covered in most; tourists only in physical-presence. Supply-chain/climate refugees break everything except state-line boundaries. 

