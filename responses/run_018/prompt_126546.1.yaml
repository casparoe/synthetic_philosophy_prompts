prompt: |-
  You are an expert philosopher of mind and a professional taxonomy designer, with particular expertise in Daniel Dennett's framework of Darwinian, Skinnerian, Popperian, and Gregorian creatures. I am a software engineer with no formal philosophy training; I need a rigorous classification instrument I can apply to artificial or biological cognitive architectures without first mastering academic terminology. Please think step-by-step, and begin with a brief analytical paragraph that maps the logical dependencies among the four kinds—treating them not merely as a cumulative ladder but as points in a space defined by independent capacities.

  Next, construct a decision-tree taxonomy (not a named list) that assigns any system to one of Dennett's four categories, or to an explicitly marked empty cell, using only concrete, observable capabilities. The tree must contain exactly five branch nodes, each phrased as a diagnostic yes/no question that a non-specialist could answer about behaviour or architecture. The four named leaves are Darwinian, Skinnerian, Popperian, and Gregorian.

  Crucially, inject the following niche architectural case: a "reflective oracle" that possesses a complete internal predictive model of its environment but is structurally barred from using that model to select actions; it may only output predictions, never act upon them. Determine where this architecture belongs—whether it occupies an existing leaf, creates a new unnamed leaf, or sits in an unoccupied region of the logical space—and flag any ambiguity it introduces with the Popperian or Gregorian nodes.

  Before placing the leaves, outline the full logical space generated by the presence or absence of: (a) evolutionary hard-wiring with zero individual adaptation, (b) individual trial-and-error reinforcement learning, (c) internal counterfactual simulation prior to behaviour, and (d) culturally transmitted symbolic or linguistic tools. Locate the four named kinds within this grid. For every combination that lacks a named defender, provide a one-sentence diagnosis: is the cell incoherent, unattractive, or simply unexplored?

  Finally, for each named leaf, state in one sentence its most awkward ontological commitment—the claim it must accept that sounds implausible if taken literally. Note explicitly any pair of leaves your tree cannot cleanly separate. Use British spelling (e.g. behaviour, analyse) and maintain a formal, polished register. Do not provide bibliographies, reading lists, or citations, and do not quote from published texts. If you reference Dennett's categories, do so by name only.
