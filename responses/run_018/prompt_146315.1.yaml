answer: |-
  You've nailed a core tension in how "universal" gets weaponized. The "ascription universality" idea (even if the term isn't standard, the *concept* is spot-on) perfectly captures the power move. Let's break down the stalemate, separating what's reasonably settled from what's genuinely fought over:

  **The Settled (or Mostly Uncontested) Philosophical Ground:**

  1.  **"Universal" Has Multiple Meanings:** Philosophers widely agree this is the **fundamental ambiguity** fueling the debate. You've identified the key split:
      *   **Scope Universality:** The idea *applies* to everyone everywhere, regardless of origin. (e.g., "Gravity works the same for all humans.").
      *   **Origin Universality:** The idea *arises from* or is *explicitly endorsed by* all cultures/people equally. (e.g., "Every culture independently invented the wheel.").
      *   **Claiming Scope Universality does NOT require Origin Universality.** Gravity's scope universality isn't undermined by the fact that Newton formulated the theory in England. This distinction is crucial and *philosophically non-controversial* to acknowledge, even if its implications are hotly debated.

  2.  **Cultural Bias in Framing is Real:** Philosophers generally accept that the *specific articulation*, *prioritization*, and *institutional implementation* of concepts (like human rights) are heavily influenced by the historical, cultural, and political context in which they were codified. The specific list in the UDHR reflects mid-20th-century Western liberal thought, even if some underlying principles resonate more broadly. This isn't a fringe view.

  **The Genuine Battlegrounds:**

  1.  **The Source of Moral Authority (The Biggest Fight):**
      *   **Objectivist/Universalist View (Scope Focus):** Argues that core moral truths (like "unnecessary suffering is bad") exist independently of culture and can be discovered/justified through reason, shared human experience (like capacity for suffering), or something like "human nature." Human rights *reflect* these deeper, cross-cultural truths. The *origin* might be Western, but the *principle* has scope universality.
      *   **Relativist/Particularist View (Origin/Skepticism Focus):** Argues that morality is fundamentally rooted in specific cultural traditions, histories, and power structures. What counts as "suffering" or "rights" is culturally constructed. A concept lacking origin universality cannot legitimately claim scope universality; it's just one culture's preference imposed on others.
      *   **The Stall:** The objectivist says, "But *suffering itself* isn't cultural!" The relativist counters, "*Defining what constitutes unjust suffering and what remedies are legitimate IS cultural.*" This is about the very foundations of ethics.

  2.  **The "Gut Feeling" About Power & Legitimacy:** This is where "ascription universality" bites hard.
      *   **Critique:** The charge isn't just that human rights *ideas* originated primarily in the West; it's that labeling them "universal" *is an act of power*. It disguises a particular (and often historically imperial) worldview as neutral, objective truth, delegitimizing alternative value systems and justifying intervention ("We're not imposing *our* values, we're enforcing *universal* ones"). The "bedrock gut feeling" is about **who has the authority to define reality for everyone else.**
      *   **Defense:** Proponents argue that rejecting scope universality based on origin risks condemning people under oppressive regimes by declaring their suffering merely a "cultural difference." They see the focus on Western origin as a distraction from the *substance* of preventing atrocities. The gut feeling here is about **the moral urgency of preventing harm, regardless of cultural origin.**
      *   **The Stall:** One side sees dangerous cultural imperialism in the label "universal"; the other sees dangerous moral abdication in refusing it. This clash isn't primarily about facts; it's about **values, historical grievance, and trust in the motives behind the label.**

  3.  **Is "Scope Universality" Even Possible for Morality?** Even if we accept Scope Universality for gravity, can complex moral/political concepts like "human rights" achieve it? Or are they inherently too vague, contested, and value-laden? This is a deep meta-ethical debate.

  **So, Why the Loop?**

  1.  **Talking Past Each Other:** One side argues **Scope** ("These principles *should* protect everyone"). The other side critiques **Origin/Legitimacy** ("*You* defined these principles through *your* power, calling them universal hides that").
  2.  **Unresolved Foundational Disagreement:** They fundamentally disagree on whether objective, cross-cultural moral truths exist (the source of authority).
  3.  **The Power Elephant:** The accusation that "universal" is a rhetorical power-play hangs heavy over the Scope argument, making proponents defensive about motives. The Origin critique often feels, to the Scope side, like ignoring tangible suffering for theoretical purity.
  4.  **The Burden of History:** The West's history of imposing its will under universalist guises (colonialism, "civilizing missions") makes the charge of "imperialism in a nice hat" incredibly potent and difficult to fully dispel, even for well-intentioned advocates.

  **In Short:**

  *   **Settled:** "Universal" is ambiguous (Scope vs. Origin). Cultural bias in *specific articulations* is real. Scope universality doesn't *require* origin universality (philosophically speaking).
  *   **Fought Over:** The existence of objective moral truths (Scope's foundation). Whether concepts lacking origin universality can *legitimately* claim scope universality in a post-colonial world (Legitimacy/Power). The extent to which the *specific package* called "human rights" truly reflects shared human values vs. Western preferences.

  The stall isn't mainly about hidden facts or simple misunderstandings. It's about **irreconcilable views on the nature of morality itself and deep-seated conflicts over historical power, cultural authority, and who gets to define the terms of global discourse.** The "ascription universality" critique highlights the power dynamics inherent in labeling something universal, which is often the unspoken fuel for the origin-focused counter-argument. The loop continues because both sides are touching on valid, deeply felt, but ultimately incompatible premises about the world and how values work within it.
