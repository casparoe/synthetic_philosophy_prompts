prompt: |-
  I've been reading the rationalist blogs and forums for about a decade, and I work in market design, so my native vocabulary is this: agents with utility functions, quasi-linear and transferable utility, the core, the Nash bargaining solution and Kalai–Smorodinsky, Shapley value, incentive compatibility and the revelation principle, ex-ante versus ex-post Pareto, and the fact that mixing over policies and mixing over utility functions come apart as soon as choices are sequential.

  There's a picture that gets passed around in these parts — that parties with different values can capture genuine gains from trade by compromising, each conceding what matters less to them than to the other side, so that both end up better off by their own lights. I want that picture restated in my vocabulary as faithfully as you can, with nothing smuggled in from outside it, and then I want the residue report.

  Three things I especially want pinned down. First: moral disagreements rarely have a transferable numeraire, so what exactly has to be assumed for gains from trade to even be well-defined here — is the trade framing load-bearing or decorative? Second: is the proposed compromise a mixture over policies, a mixture over utility functions, or a reweighting inside one social welfare function? In my world those three coincide in static one-shot problems and diverge badly in sequential ones, so I want to know which the argument is actually leaning on. Third: can deontological side-constraints, and the dirty-hands or integrity objection people raise against compromising at all, be represented in this vocabulary, or only by faking them with lexical thresholds and infinite weights?

  Then tell me what has no expression in it whatsoever. My suspicion is that the frame's blind spot is that it takes agents as given, with fixed utility functions, so it cannot say anything about a compromise that changes who the compromisers are — and that better off by their own lights is indexed to a self that may not survive the deal. But I want your read on whether that residue indicts my vocabulary or shows the original thesis was thinner than it sounds, and where you'd put the burden of proof.
reasoning: |-
  Okay, let me unpack this user's query. They're deeply familiar with rationalist concepts and market design, using terms like utility functions, Nash bargaining, Shapley value. They want the "gains from trade" idea in moral compromise translated into their technical vocabulary, specifically asking about three sticking points.

  First, the numeraire issue in moral trade. Since morality isn't fungible like money, what assumptions make "trading concessions" mathematically coherent? Need to map this to bargaining solutions with non-transferable utility (NTU). The Kalai-Smorodinsky reference suggests they're thinking about proportional concessions - must formalize how "what matters less" translates to indifference curves.

  Second, the policy/utility mixture ambiguity. User explicitly warns these diverge in sequential settings. The compromise could be a randomized policy (lottery), a social welfare weighting (Bergsonian), or something else. Since they mention dynamic inconsistency, I should emphasize how the argument usually implies ex-ante social welfare optimization.

  Third, deontology's representation problem. Lexical thresholds break continuity assumptions in standard models. Can we capture "dirty hands" as discontinuous utility cliffs or introduce type-indexed rules? The integrity objection might require modeling identity-dependent preferences - a challenge for fixed utility functions.

  The residue question is profound. If compromise changes your values, the "better off by own lights" criterion becomes self-undermining. This exposes a limitation in the vocabulary itself - it assumes stable agents. The burden of proof should be on compromise advocates to show value stability, but the model can't even express that concern endogenously.

  Also noting their suspicion about agency transformation. The vocabulary treats utility functions as immutable, missing how deals might alter the compromisers themselves. This isn't a flaw in the model per se - it's designed for fixed agents - but does reveal the original thesis oversimplifies real moral negotiations.

  Must structure the response: first translate the thesis rigorously using their terms, then dissect each of the three issues, finally confront the vocabulary's limits on identity change. The "residue report" should highlight what the framework can't see - perhaps existential concerns about value drift belong to philosophy, not game theory.
answer: |-
  Here's the translation of the "gains from trade in values" thesis into your specified vocabulary, followed by the residue report:

  ### Core Translation: Gains from Trade in Values
  1.  **Agents & Preferences:** Two agents (A and B) with distinct, fixed von Neumann-Morgenstern utility functions over a policy space. Utilities are *not* quasi-linear; there is no transferable numeraire (TU). The policy space may include complex, multidimensional outcomes.
  2.  **Status Quo (Disagreement Point):** A default policy `d` yielding utilities `(U_A(d), U_B(d))`. This is the pre-trade baseline.
  3.  **Potential Gains:** There exists at least one alternative policy `x` such that `U_A(x) > U_A(d)` and `U_B(x) > U_B(d)`. Pareto improvement over `d` is achievable.
  4.  **Mechanism (The "Trade"):** Agents identify dimensions of the policy space where their marginal rates of substitution (MRS) differ significantly. Specifically, where:
      *   A concession by A on Dimension 1 costs A *less* utility (per unit of concession) than it gains B in utility.
      *   Simultaneously, a concession by B on Dimension 2 costs B *less* utility than it gains A.
      *   This is equivalent to stating that the agents' indifference curves through `d` are not tangent; their preferred trade-offs differ. The "gains" arise from exploiting this non-tangency.
  5.  **The Compromise Policy:** The outcome is a specific policy `c` (not necessarily a lottery over `d` and `x`). `c` is located on the Pareto frontier relative to `d`. The process of finding `c` resembles finding a point in the **core** of this two-player NTU (Non-Transferable Utility) "bargaining game" or finding a solution concept like **Nash Bargaining Solution (NBS)** or **Kalai-Smorodinsky (KS)**.
      *   *NBS Interpretation:* `c` maximizes `(U_A(c) - U_A(d)) * (U_B(c) - U_B(d))` subject to feasibility. This formalizes "mutual concession for joint gain."
      *   *KS Interpretation:* `c` equalizes the ratio of each agent's utility gain to their maximum possible gain (relative to `d` and the utopia point). This formalizes "proportional concession."
  6.  **Outcome:** Both agents achieve `U_A(c) > U_A(d)` and `U_B(c) > U_B(d)`. They are both ex-post better off by their own utility functions compared to the disagreement point.

  ### Addressing Your Three Pins

  1.  **Numeraire & Well-Defined Gains:**
      *   **TU is NOT assumed.** The trade framing is **load-bearing**, but relies on **NTU bargaining theory**. Gains are well-defined *iff*:
          *   The utility functions are *comparable* in the sense that we can define a joint utility possibility set (UPS) relative to `d`.
          *   The UPS is non-degenerate (not a single point) and `d` is inefficient (lies inside the UPS frontier).
      *   **What's Traded:** Concessions on *policy dimensions*, not utility directly. Gains arise from differing MRS across these dimensions. The key assumption is that compromises exist where the *utility loss* to the conceder on their low-MRS dimension is *less than* the *utility gain* to the other agent on that same dimension (due to their high MRS for it). No common numeraire is needed, only differing marginal valuations within the policy space.

  2.  **Nature of the Compromise:**
      *   **It is overwhelmingly presented as a single policy `c` (a "mixture over policy dimensions" within a complex policy).** The standard argument **assumes a static, one-shot problem.** Proponents implicitly rely on the coincidence you mention.
      *   **This is the critical vulnerability in sequential settings.** If `c` involves sequential choices or creates path dependencies:
          *   The ex-ante optimal `c` (viewed as a plan) may not be dynamically consistent. Agents might deviate later.
          *   "Mixing over utility functions" (e.g., randomizing between A's ideal and B's ideal) becomes distinct and potentially unstable if agents can renege.
          *   "Reweighting a SWF" (ex-ante Bergson-Samuelson) yields `c`, but maintaining commitment to that weighting ex-post may be impossible if the sequential structure allows reoptimization under changed circumstances.
      *   **Burden:** The proponent of compromise-as-gains-from-trade **implicitly leans on the static coincidence.** The argument generally ignores sequentiality. In dynamic contexts, the gains require strong commitment mechanisms or redefines the "policy" as a full contingent plan (often impractical).

  3.  **Deontology, Side-Constraints, and Integrity:**
      *   **Representation within Vocabulary:**
          *   *Lexical Thresholds/Infinite Weights:* This is the primary tool. A deontological constraint ("Never do X") is modeled as `U_A(policy with X) = -∞`. This creates discontinuous utility cliffs. "Dirty hands" is modeled as a large, finite (but very high) utility penalty for violating the constraint.
          *   *Type-Dependent Rules:* The constraint could define the *domain* of permissible policies. If compromise `c` requires X, and X is outside the domain for A, then `c` is infeasible for A. Gains vanish. Integrity objections often take this form – certain concessions are simply not in the agent's choice set.
      *   **Limitations:**
          *   This vocabulary **struggles with the *experience* of integrity violation.** The disutility `-∞` or `-K` captures the *outcome* but not necessarily the *process* or identity-based reasons ("I wouldn't be *me* if I agreed to X"). The vocabulary reduces integrity to extreme risk aversion or domain restriction.
          *   The "dirty hands" feeling *after* a necessary compromise is reduced to a high but finite utility penalty, which feels inadequate to capture the philosophical weight.
          *   **Result:** Deontological constraints often **destroy the potential gains from trade** by making large regions of the policy space infeasible or catastrophically undesirable for one agent. The vocabulary *can* show this, but it struggles to articulate *why* the constraint exists beyond "utility function says so."

  ### The Residue Report: What Lies Outside the Vocabulary

  1.  **Endogenous Agents & Plastic Utility Functions:** Your suspicion is **precisely correct.** This is the most significant blind spot.
      *   The model assumes `U_A` and `U_B` are fixed and exogenous. It cannot express that the *act of compromising itself* might:
          *   Alter an agent's fundamental values (`U_A` changes shape or content).
          *   Change the agent's identity or self-conception ("Am I still a [Environmentalist/Libertarian/etc.] if I agreed to *that*?").
          *   Shift the disagreement point `d` for future interactions (e.g., compromise sets a precedent that weakens one's bargaining position).
      *   **"Better off by their own lights"** is indexed to the *pre-compromise self*. The model is silent on whether the *post-compromise self* would endorse the deal. This is the core of the "compromise changes who you are" critique. The vocabulary assumes agent continuity.

  2.  **The Burden of Proof & Residue Significance:**
      *   **Indicts the Original Thesis:** The residue shows the "gains from trade" thesis **is thinner than it sounds.** It presents a compelling static, technical picture of mutual improvement *given fixed agents and values*. However, in real-world moral/political compromise:
          *   The assumption of fixed utility functions/values is highly questionable.
          *   The potential for endogenous preference/identity change is a major concern raised by opponents.
      *   **Indicts the Vocabulary (Partially):** The vocabulary is excellent for its designed purpose (analyzing fixed-agent strategic interaction). Its inability to model endogenous preference/identity formation is a *limitation for this specific application*, not a general flaw. Other frameworks (e.g., behavioral econ models of preference construction, sociological models of identity) are needed here.
      *   **Burden of Proof:** The burden lies **squarely on the proponent** of compromise-as-gains-from-trade to address the residue:
          *   **Empirical Burden:** Demonstrate that value/identity shifts caused by compromise are typically negligible or net positive *within the compromiser's own evolving value framework*. Or show that shifts are predictable and can be incorporated ex-ante (a massive challenge for the model).
          *   **Theoretical Burden:** Acknowledge the limitation and argue why the static model is still the best available tool or why the dynamic concerns are overstated. Simply ignoring the residue is inadequate.

  3.  **Additional Residues:**
      *   **Deep Uncertainty & Ambiguity:** The vocabulary assumes well-defined utility functions and probabilities. Real moral disagreements often involve fundamental uncertainty about consequences, the nature of the good, or even the ontology of the agents involved (e.g., future persons, non-human entities). Representing this requires Knightian uncertainty or ambiguity aversion models, pushing beyond standard vNM.
      *   **The "Frame" Itself:** The vocabulary takes the policy space and disagreement point `d` as given. It cannot easily analyze how defining the bargaining *frame* (what's on the table? what is `d`?) shapes the perceived feasibility of gains and the nature of compromise. This is crucial in politics.
      *   **Power & Coercion:** While IC and mechanisms can model some aspects, the vocabulary struggles with diffuse power dynamics, ideological hegemony, or non-strategic coercion that might make `d` itself unacceptable to one party, rendering "gains" illusory or exploitative.
      *   **Expressive Utility & Signaling:** The act of compromising or not may have direct utility consequences (positive or negative) beyond the policy outcome, related to signaling loyalty, principle, or group membership. This is hard to disentangle within the policy-based utility function.

  ### Conclusion
  The "gains from trade in values" thesis translates faithfully into the vocabulary of NTU bargaining theory (Core, NBS, KS) applied to a static, one-shot interaction between agents with fixed utility functions. Gains are well-defined without TU via differing MRS on policy dimensions. The compromise is typically a specific policy `c` on the Pareto frontier.

  However, the **residue is significant and largely indicts the original thesis:**  
  1.  It critically depends on the **static coincidence** of policy mixtures, utility mixtures, and SWF weightings, collapsing in sequential settings without strong commitment.  
  2.  Deontological constraints can be **represented only crudely** (lexical thresholds), failing to capture the full weight of integrity objections.  
  3.  Most crucially, it **assumes agent/utility function exogeneity**, rendering it blind to the core objection that compromise might change the compromisers themselves, making "better off by their own lights" potentially self-undermining.

  **The burden of proof rests on proponents** to either demonstrate that endogenous preference/identity shifts are manageable within the framework or negligible in practice, or to significantly augment the model to address this fundamental limitation. The vocabulary excels at its job but reveals the original thesis as a robust but ultimately static and agent-conservative perspective on compromise.
