prompt: |-
  I've been arguing with my brother about assisted dying and I keep losing, so I want to figure out what I actually beleive by going through cases. Here's where my gut lands. A woman with terminal pancreatic cancer, weeks to live, in constant pain, asks her doctor for the pills: fine, obviously. A 24-year-old with treatment-resistant depression who's tried everything for six years: not fine. A man with locked-in syndrome after a stroke, fully aware, who communicates by blinking that he wants to die: fine. An 82-year-old in okay health who says she's simply done, her friends are dead, she's tired: not fine, and I feel a bit bad about that one. A guy with early Alzheimers who signed a directive years ago asking to be euthanized once he no longer recognizes his kids, but who now, at that stage, seems genuinely content: not fine to follow the directive, even though the version of him who wrote it would be horrified. And here's the pair that messes me up: the pancreatic cancer patient could just refuse treatment or stop eating and I'd fully respect that, but somehow her asking the doctor for the pills feels different, and I can't say why since both end the same way.

  Is there one principle that gets me all or most of these, stated precisely enough that I could actually use it? Tell me which of my verdicts it has to sacrifice, what it says about the cancer-patient pair I can't reconcile, and what it predicts for a case I didn't list, like a teenager with a terminal illness whose parents support the request. Lead with the bottom line in your first sentence, no preamble. And tell me what would change your answer -- like which of these cases is doing the most work, and where your principle is most likely to fall apart.
reasoning: |-
  Okay, the user is struggling with their stance on assisted dying across different scenarios. They've listed several cases and their gut reactions, trying to find a consistent principle. Let me start by understanding each case they mentioned.

  First, the terminal cancer patient in pain: they're fine with it. Then the 24-year-old with depression: not fine. Locked-in syndrome patient who blinks to die: fine. The 82-year-old who's just tired of life: not fine. Early Alzheimer's patient who signed a directive but is now content: not fine to follow through. The confusing pair is the cancer patient refusing treatment vs. asking for pills—same outcome but feels different to them.

  They want a precise principle that covers most cases, identifies which verdicts might conflict, explains the cancer pair dilemma, and applies to a new case like a terminally ill teenager with parental support. Also, what would challenge the principle.

  The key issues here are voluntariness, capacity, suffering nature, and irreversibility. The user's discomfort with the depressed young adult and the healthy elderly person suggests they draw a line at psychological suffering versus physical. The Alzheimer's case shows that current capacity might override past directives if the patient isn't suffering now. The cancer treatment refusal vs. active pills might relate to causation—letting die versus actively causing death.

  I recall principles like the Doctrine of Double Effect, where intending death vs. foreseeing it matters. But in the cancer case, refusing treatment leads to death, same as pills. The difference might be in the act itself—one is allowing natural death, the other is intervening. That's a common ethical distinction. 

  For the teenager, parental consent adds complexity. Minors' autonomy is limited, but terminal illness might justify it if suffering is unbearable and irreversible. The principle would likely support it if all other conditions are met, especially if the teenager demonstrates capacity and consistent choice.

  The hardest cases for the principle would be the depressed young adult and the healthy elderly. If suffering is subjective, why exclude them? The user might prioritize physical suffering as more objective or irreversible. But that could be a point of criticism—mental suffering can be just as severe. The principle might sacrifice consistency there, which the user needs to accept or adjust their stance.

  The Alzheimer's case highlights the importance of current capacity and state. Even if past directives exist, present contentment overrides them. This respects the person as they are now, not who they were. But that could conflict with autonomy as previously expressed. The user seems to prioritize current well-being over past wishes, which is a key point.

  The principle I propose combines unbearable suffering (physical or existential), irreversibility, capacity, and voluntary choice. It explains the cancer pair by distinguishing acts (allowing death vs. causing it), though the outcome is the same. The user's intuition might stem from a moral distinction between killing and letting die, which is a long-standing debate in ethics.

  What would change my answer? If new evidence shows that psychological suffering can be as irreversible and unbearable as physical, the exclusion of psychiatric cases might need reevaluation. Also, societal shifts towards broader autonomy could challenge the irreversibility criterion for non-terminal cases. The healthy elderly person's case is the most vulnerable because if autonomy is paramount, denying their choice seems inconsistent. But the user's principle adds suffering and irreversibility as necessary, which excludes that case. That's where the principle might face criticism but aligns with the user's current stance.
answer: |-
  **Bottom line:** The principle that best captures your intuitions is: *Assisted dying is permissible only when a competent person experiences unbearable suffering from an incurable physical condition causing irreversible decline toward imminent death, and the act primarily alleviates suffering rather than intentionally causes death.*

  **How it gets your verdicts:**

  1.  **Terminal Cancer Patient (Fine):** Meets all criteria: competent, unbearable suffering (physical pain), incurable physical condition (cancer), irreversible decline, imminent death. Suffering alleviation is primary goal.
  2.  **24yo with Depression (Not Fine):** Fails on condition type (psychiatric, though suffering may be unbearable), lacks imminent death/irreversible *physical* decline. Suffering is central, but cause isn't purely physical/terminal.
  3.  **Locked-In Syndrome (Fine):** Competent (via blinking), unbearable suffering (existential/psychological due to physical state), incurable physical condition (stroke damage), irreversible decline/static profound disability. Suffering alleviation is primary goal. (*Note: "Imminent death" is the biggest stretch here, but profound, permanent incapacity fits the "irreversible decline" aspect for many*).
  4.  **82yo "Done with Life" (Not Fine):** Fails on suffering source (primarily existential/social, not medical condition), lacks an incurable physical condition causing decline, lacks imminent death. Competence and voluntariness aren't the sole barriers.
  5.  **Early Alzheimer's Patient (Not Fine):** Fails on *current* competence to reaffirm the request. The directive is overridden by the present competent state where suffering isn't evident, even if the prior directive exists. The irreversible decline is present, but current contentment negates unbearable suffering *now*.
  6.  **Cancer Patient: Refusal vs. Pills:** This principle *sacrifices reconciling this pair perfectly*. It accepts the distinction you intuit: Refusing treatment allows death as a foreseen but unintended consequence of avoiding suffering/burdens (aligning with "alleviates suffering rather than *intentionally causes* death"). Actively providing pills *intends* death as the means to end suffering. The principle holds this moral distinction matters, even if the outcome is identical.

  **Predictions for New Cases:**

  *   **Terminal Teenager with Parental Support:** *Likely Permissible* under this principle, assuming competence can be rigorously assessed, suffering is unbearable/irreversible, the condition is terminal/incurable physical, and "imminent death" is defined flexibly enough (e.g., weeks/months). Parental support addresses the minor's legal incapacity but doesn't change the core ethical criteria.

  **Sacrifices / Tensions:**

  1.  **The Depression Case:** This principle *must* sacrifice consistency here. If suffering is truly unbearable and *incurable* (despite treatment resistance), why exclude it purely because the source is psychiatric rather than physical? This is a major point of ethical debate and where your intuition aligns with laws like Oregon's (excluding pure psychiatric cases).
  2.  **The "Done with Life" Case:** Your discomfort stems from prioritizing autonomy *only* when linked to specific suffering/decline. The principle requires sacrificing pure existential suffering without physical decline as sufficient grounds, even for the competent elderly.
  3.  **The Cancer Pair:** As stated, it accepts the act/omission distinction as morally relevant, which many philosophers challenge. It cannot fully reconcile the identical outcome.

  **What Would Change This Answer (Weaknesses & Pivot Points):**

  1.  **The Locked-In & Depression Cases:** These do the most work. If you fundamentally believe **unbearable, incurable suffering itself is sufficient grounds, regardless of physical cause**, the principle collapses. Locked-in syndrome involves profound psychological suffering due to physical state; severe depression involves profound psychological suffering due to psychiatric state. Distinguishing them purely on physicality becomes arbitrary. *Accepting this would force inclusion of the depression case and potentially the "done with life" case if suffering is deemed unbearable/incurable.*
  2.  **The "Done with Life" Case:** If you prioritize **absolute autonomy for competent individuals** above all else (suffering, prognosis), the principle fails. This would force inclusion of the healthy 82yo and potentially the depressed 24yo (if competent), sacrificing the suffering/decline criteria.
  3.  **The Alzheimer's Case:** If you prioritize **precedent autonomy** (the binding power of the past directive) over current well-being, the principle fails. You'd have to accept euthanizing the contented person based on their past wishes, sacrificing the "current competence/suffering" requirement.
  4.  **The Cancer Pair:** If you reject the **distinction between intending death and foreseeing it** (the act/omission distinction), seeing only the outcome as morally relevant, the principle fails for this pair. You'd need a principle focused solely on autonomy and outcome, making refusal and pills morally equivalent.

  **Where the Principle is Most Vulnerable:** It struggles most with **non-terminal suffering** (Locked-In vs. Depression) and **the moral weight of the act itself** (Refusal vs. Pills). It relies heavily on the contested distinctions between physical/psychiatric suffering and intending/foreseeing death. If those distinctions don't hold for you under scrutiny, the principle won't stand. The "Depression" and "Done with Life" cases are the primary battlegrounds challenging its coherence.
