  im trying to square Bikhchandani-Hirshleifer-Welch cascades with Scharfstein-Stein reputational herding for a presentation, but im stuck on whether theyre even the same kind of thing. in BHW herding is rational bayesian updating — people genuinely change beliefs because public actions swamp private signals. but reputational herding seems like people keep their private beliefs and just lie with their actions to protect their career. so is reputational herding just an irrational deviation from the cascade model, or can you formalize the career payoff inside the belief-updating rule so it counts as rational too? and if you can, does that mean a cascade can never be broken once reputation is on the line, since no private signal is strong enough to outweigh both belief and career risk?
