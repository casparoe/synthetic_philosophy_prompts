prompt: |-
  I was recently elected to the management council of a housing co-operative of some four hundred households, and within three months we must decide whether to sell our original 1920s block in order to fund urgent repairs across the rest of the estate. Feelings are running high, and at our last meeting a council member proposed that we settle the question not by referendum, as our rules would ordinarily require, but by a conditional prediction market. Two markets would be opened. Members would trade contracts whose payout depends on the co-operative's audited financial position and its annual member-satisfaction survey five years from now; trades in one market would be voided if we sell the block, trades in the other if we do not, and the decision would follow whichever market implies the better outcome. To meet the objection that this simply lets wealthier members buy the result, stakes would be denominated in service credits earned through voluntary work for the co-operative, capped per member per year, though the credits could also be redeemed against service charges and so would carry genuine value. Half the council is enthusiastic, arguing that markets will aggregate what members actually know better than a referendum decided by whoever makes the most emotional speech at a general meeting. The other half finds it illegitimate to let what is, in effect, a betting pool determine where people live; they add that a market with perhaps forty traders could be moved by one determined member, and that credits merely substitute the time-rich for the money-rich, favouring the retired over working parents. Please draft the decision memorandum I will table at next month's meeting. It should recommend adoption, rejection, or adoption with stated conditions, give reasons that the proposal's author could actually respond to, and take seriously the strongest consideration on whichever side loses rather than simply restating our procedures. Although it is a memorandum, please write it as continuous prose, without headings, bullet points, bold text, or tables, in the manner of a formal letter.
reasoning: |-
  Okay, the user is part of a housing co-operative management council facing a high-stakes decision about selling a historic building to fund repairs. They need a balanced memorandum to resolve a heated debate between using a prediction market versus a traditional referendum. 

  The user's position is delicate - they must draft something that respects both sides while guiding toward a practical solution. I notice they're deeply concerned about legitimacy and equity issues (wealth vs time advantages), which suggests the co-op values democratic participation intensely. 

  The prediction market proposal is intellectually intriguing but practically risky. While markets theoretically aggregate dispersed knowledge better than emotional speeches, in a small community of ~400 households, it could be gamed or distorted. The service-credit design tries to solve wealth inequality but introduces new biases toward retirees and against time-poor families. 

  What's unspoken but vital: this isn't just about repair funding. It's about trust in governance during existential change. The 1920s block likely holds emotional significance - selling it might feel like losing the co-op's soul. The memorandum must acknowledge that subtext without getting derailed by it. 

  The strongest pro-market argument is avoiding referendum demagoguery; the strongest con is that housing decisions feel too human for market mechanisms. My draft leans toward conditional rejection because procedural legitimacy matters more than efficiency here. But I'll build in compromises: sunset clauses for experimentation and credit caps adjusted for family status. 

  Key phrases to include: "weight of homes versus weight of money", "democracy as conversation", and "testing mechanisms in lower-stakes contexts". These validate both sides while redirecting toward the co-op's core purpose - collective stewardship of homes.
answer: |-
  ## Decision Memorandum: Proposal for Conditional Prediction Market as Decision Mechanism

  To: Members of the Management Council  
  From: [Your Name], Council Member  
  Date: [Date of Next Meeting]  
  Subject: Recommendation Regarding Proposal to Employ Conditional Prediction Market for Block Sale Decision  

  After careful consideration of the proposal to utilize a conditional prediction market to determine the sale of our original 1920s block, including the arguments presented both in favour and against at our last meeting, I recommend that the council **reject the proposal for this specific, high-stakes decision, but endorse the exploration of prediction markets for future, lower-impact strategic questions under specified conditions.**

  The core arguments for the prediction market possess considerable intellectual merit. The potential for markets to aggregate dispersed knowledge more effectively than a referendum influenced by potentially emotive rhetoric is a legitimate consideration. The mechanism aims to surface members' genuine beliefs about the long-term financial and satisfaction outcomes of each path, based on their unique insights into the co-operative's operations and challenges. The innovative design of denominating stakes in service credits, redeemable against charges and capped annually, represents a thoughtful attempt to mitigate the dominance of pure financial wealth, shifting influence towards those demonstrably engaged in the co-operative's upkeep and community. Proponents rightly identify a weakness in referendum processes susceptible to persuasion tactics over substantive evidence.

  However, the objections raised carry profound weight, particularly in the context of a decision fundamentally concerning people's homes and the potential displacement inherent in selling a significant asset. The strongest counter-argument is one of legitimacy and alignment with our co-operative principles. Determining the fate of members' residences through a mechanism that is, at its essence, a structured betting pool – regardless of the currency used – feels fundamentally at odds with the direct democratic ownership model upon which we are founded. While aggregating knowledge is valuable, our co-operative exists not merely as an economic entity but as a community. Decisions impacting the very fabric of that community, especially one as visceral as selling a long-standing part of our estate, demand a process where each member has an equal, direct voice expressed through a vote, not influence weighted by accumulated credits derived from time investment.

  Furthermore, the practical vulnerabilities identified are significant. A market potentially involving only a fraction of our membership – perhaps forty active traders – is highly susceptible to manipulation or undue influence by a single determined individual or a small coordinated group. This vulnerability directly undermines the claim of superior knowledge aggregation. While the service credit system elegantly sidesteps monetary wealth, it unavoidably substitutes time wealth. Capping credits per member per year does not negate the inherent advantage held by members with greater discretionary time – notably retirees, the self-employed, or those without significant caregiving responsibilities – over working parents, shift workers, or those with other substantial time commitments. This substitutes one form of potential inequity for another, favouring a different demographic within our community, and does not achieve the truly egalitarian decision-making a referendum offers.

  Therefore, while the prediction market proposal demonstrates commendable innovation and addresses a genuine concern about referendum dynamics, its application to this existential question about selling homes and reshaping our estate is inappropriate. The symbolic and practical importance of a direct, equal vote for every member on such a matter outweighs the theoretical benefits of knowledge aggregation through a market mechanism at this scale and for this purpose. The risk of perceived or actual illegitimacy, coupled with the vulnerability to manipulation and the unintended bias towards the time-rich, is too high.

  Nevertheless, the underlying concept of harnessing collective intelligence through novel mechanisms should not be discarded. **I propose that the council:**  
  1.  **Proceed with the referendum** for the block sale decision as required by our rules, ensuring robust information sharing and structured debate to mitigate the risks of purely emotional persuasion.  
  2.  **Formally explore the development and testing of a prediction market system using service credits** for future, less existentially critical strategic decisions. Examples could include assessing the likely success of a new communal facility, forecasting repair cost overruns, or gauging satisfaction with potential new management policies.  
  3.  **Establish a working group** to design this future system, tasked specifically with:  
      *   Rigorously modelling and stress-testing the vulnerability to manipulation within our expected participant pool size.  
      *   Investigating mechanisms to further mitigate time-wealth disparities (e.g., different credit caps based on self-declared availability, family status adjustments – noting the complexity).  
      *   Defining clear criteria for suitable questions and ensuring alignment with our co-operative principles.  
      *   Proposing a pilot program with a defined sunset clause and evaluation metrics.

  This path respects the fundamental democratic requirement for the immediate, critical decision regarding members' homes while acknowledging the merit in the proposal and committing to exploring its potential value for enhancing our collective decision-making on other fronts in a responsible, tested manner. It allows us to innovate without gambling on our community's core stability on this first, highly charged occasion. The weight of homes demands the weight of equal votes; the promise of aggregated insight deserves a chance to prove itself where the stakes, while important, are not quite so deeply personal.
