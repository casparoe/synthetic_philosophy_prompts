     However, we must design a ghostly representation that is non-pictorial. Let me sketch a concept:

          Ghost 'a':
          - A region (we'll represent it as a shaded area) that is roughly circular and closed (enclosure).
          - A vertical bar (or a line of points) adjacent to the left side of this region and extending above it.
          - The region has an opening (gap) on the right side? But without strokes, we might represent the gap by having the region not fully enclose? Or we might have two separate regions: one for the bowl and one for the stem? 

     We might use a diagram of nodes and edges? But that might be too abstract. Instead, we can use a very simple grid-based representation without curves. For example:

          In a 3x3 grid:
          - The bottom row: left and middle cells are part of a region (enclosed) and the right cell is empty (so the region is open on the right?).
          - The middle row: the left cell is part of the stem (vertical element) and the middle and right are empty? 
