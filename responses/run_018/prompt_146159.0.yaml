          - Then show a symbol that has the relational features of an 'a' (as defined) but in a non-traditional arrangement (e.g., the container is on the top and the stem extends downward? That might be a 'd'? So we have to be careful). 

          Alternatively, to avoid confusion, we can show:

            Example 1 (is an 'a'): 
              - A large region (bowl) at the bottom, open on the right.
              - A stem attached to the top-left of the bowl and extending upward.

            Example 2 (is not an 'a' but might be a 'd'):
              - The same bowl but the stem attached to the top-right and extending upward.

            Example 3 (is not an 'a'): 
              - A bowl that is fully closed (like an 'o') with no stem.

            Example 4 (is an 'a'?): 
              - A bowl that is open on the left? (This might be a 'd' if the stem is on the right? Or not?) 

          The key is to see if they can articulate that the opening must be on the right and the stem on the left and attached at the top.

          But note: in some fonts, the stem of 'a' is not very pronounced (e.g., in some sans-serif, the stem is just a straight part on the left). So we are focusing on the minimal relations.

          The check: Ask them to design a ghost 'b'. What relations would it have? 
            - A stem on the left (vertical) and a bowl attached to the stem on the right? 
            - The bowl is at the top? (for a lowercase 'b') 
            - And the bowl is open on the right? Actually, no: for 'b', the bowl is usually closed. 

          So for 'b': 
            - A vertical stem on the left, and a closed bowl attached to the stem in the top half? 

          This exercise will show if they are thinking relationally.

  8. **What We Leave Out from Letter Spirit**
     - We leave out the gridfont representation and the detailed style transformations (which Letter Spirit uses to create a consistent font). Why? Because at this introductory level, we are focusing on the abstract relational definition of a single letter (identity) and not on the consistency across the alphabet (style). Also, the grid might be too constraining for our ghost alphabet exercise.

  9. **Catch the AI Misconception**
     - When we briefly mention Letter Spirit, we explicitly state: "Letter Spirit is a computer program that uses rules to generate grid-based letters in a consistent style. It does not 'understand' what an 'a' is in the way humans do; it follows rules that we programmed to capture the relational structure and style. We must be careful not to anthropomorphize AI."

