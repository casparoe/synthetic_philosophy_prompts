     - Comparing two standard fonts would not break the participants' preconception that the shape (the curves and lines) is what matters. They would see two different shapes and still recognize the 'a', but they might attribute it to the overall shape rather than the relations. By using the ghost alphabet, we force them to think about the abstract structure without any familiar visual cues.

  6. **Common Misconceptions and When to Address Them**
     - **Misconception 1: "There is a platonic correct shape for each letter."**
       - When: Address this at the very beginning when showing multiple 'a's. 
       - How: Show a diverse set of 'a's (including upper and lower case, different fonts, handwriting) and ask: "What do they have in common?" They will see that the shape varies but the identity is preserved. Then introduce the idea that it might be the relational structure that is invariant.

