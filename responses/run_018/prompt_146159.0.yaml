     - **Misconception 3: "The AI (or the program) 'understands' the letter."**
       - When: When discussing Letter Spirit (if we mention it) or when talking about how a computer might recognize letters. We can address this at the end when we touch on Letter Spirit.
       - How: Emphasize that Letter Spirit is a model that captures the relational structure and the stylistic transformations, but it does not "understand" in the human sense. It's a set of rules and heuristics. This misconception is common in AI: attributing understanding to pattern matching.

