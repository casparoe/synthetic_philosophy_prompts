            Top:   [X] [ ] [ ]
            Middle:[X] [X][X]   -> but then we have a horizontal bar? Not typical.

          Alternatively, we can think of the ghost 'a' as having:
            - A container in the bottom half: so the bottom row and the middle row on the right? 
