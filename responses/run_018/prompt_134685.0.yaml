prompt: |-
  hey, i need this for work. i'm the voting-integrity officer for a transboundary river-basin authority that runs binding referendums on dam removals and flow allocations. we adopted the principle that anyone who bears a non-substitutable risk from the outcome belongs to the demos for that vote. in practice it's chaos: seasonal workers, tribal nations with seperate governments, trustees for future generations, and feedback loops where who votes actually changes who gets hurt. i need a reusable decision procedre my staff can run in about 20 minutes per proposal, with ordered questions, what evidence is enough at each step, hard stops ('exclude'), soft stops ('i have to sign off personally because this is a values call'), and explicit flags for self-reference loops -- like if being affected depends on who is already in the demos. apply it to three cases: a migrant farmworker on a 6-month lease, a tribal council with treaty rights and its own elections, and a trustee representing unborn residents. include one where the answer comes out wrong by our lights. also say straight up what the procedure cant settle and where it will misfire. my staff arent philosophers, so keep it grounded and dont ask for reading lists or citations -- i dont have access to that stuff.
reasoning: |-
  We are designing a decision procedure for determining who is part of the demos (the voting body) for a particular referendum in a transboundary river-basin authority. The principle is: anyone who bears a non-substitutable risk from the outcome belongs to the demos for that vote.

  Key challenges:
  1. Non-substitutable risk: The risk must be such that it cannot be transferred, avoided, or compensated in a way that makes the person indifferent to the outcome.
  2. Complexity: Cases include seasonal workers, tribal nations, trustees for future generations, and self-referential situations (where the demos definition affects who is at risk).

  The procedure must:
  - Be reusable and run in about 20 minutes per proposal.
  - Have ordered questions, with clear evidence thresholds.
  - Have hard stops (exclude) and soft stops (require sign-off).
  - Flag self-reference loops.

  We'll outline a step-by-step procedure and then apply it to three cases.

  ---

  **Decision Procedure: "Demos Inclusion Protocol" (DIP)**

  **Objective:** Determine if an entity (individual or group) should be included in the demos for a specific referendum.

  **Steps:**

  1. **Identify the Entity and the Referendum:**
     - What is the specific referendum? (e.g., Dam removal at site X, Flow allocation for sector Y)
     - Who is the entity? (e.g., a migrant farmworker, a tribal council, a trustee)

  2. **Assess Direct Impact:**
     - **Question:** Would the outcome of the referendum directly alter the entity's legal, physical, or economic circumstances in a way that is not reversible or compensable?
     - **Evidence:** Legal documents (leases, treaties), environmental impact assessments, economic reports, etc.
     - **Threshold:** If the impact is direct and significant, proceed. If indirect or negligible, hard stop: exclude.
     - **Note:** Direct impact means the entity is immediately affected without intervening actions.

  3. **Assess Non-Substitutability:**
     - **Question:** Is the risk non-substitutable? (i.e., Can the entity avoid the risk or transfer it so that they are effectively indifferent to the outcome?)
     - **Evidence:** Contracts, insurance policies, alternative options available to the entity, historical precedents of compensation.
     - **Threshold:**
       - If the risk is non-substitutable (e.g., no compensation mechanism exists, or the entity cannot avoid the risk), proceed.
       - If the risk is substitutable (e.g., the entity can move without cost, or they are compensated regardless of outcome), hard stop: exclude.
     - **Soft Stop:** If substitutability is ambiguous (e.g., compensation is theoretically possible but not guaranteed), flag for sign-off.

  4. **Check for Self-Referential Loops:**
     - **Question:** Does the inclusion of this entity in the demos change the set of affected parties? (e.g., by altering the outcome, which then changes who is at risk)
     - **Evidence:** Analysis of how the entity's vote might swing the outcome and subsequent impacts. (Note: This is complex and may require expert input.)
     - **Threshold:** If a loop is detected (i.e., the demos definition affects the risk profile), flag as "self-reference loop" and require sign-off. Do not exclude automatically.

  5. **Special Cases:**
     - **For Groups (e.g., tribal councils):** 
       - **Question:** Does the group have a recognized governing structure that can represent its members in the referendum?
       - **Evidence:** Treaty documents, government recognition, historical participation.
       - **Threshold:** If yes, include the group as a single voting entity (their internal process determines their vote). If not, consider individual members (but note: this might be impractical; if so, soft stop for sign-off).
     - **For Representatives (e.g., trustees for future generations):**
       - **Question:** Is the represented group (e.g., unborn residents) at non-substitutable risk? And is the representative legitimate and accountable?
       - **Evidence:** Legal mandate of the trustee, mechanisms for accountability.
       - **Threshold:** If both conditions are met, include the representative. If not, exclude. (Note: Accountability is key; without it, soft stop.)

  6. **Final Decision:**
     - If all steps are passed without hard stops, include.
     - If a soft stop or self-reference loop is flagged, escalate to the voting-integrity officer (you) for sign-off.

  ---

  **Application to Cases:**

  **Case 1: Migrant Farmworker on a 6-Month Lease**

  - **Step 1:** Referendum: Dam removal that affects water availability for irrigation. Entity: A migrant farmworker with a 6-month lease on a farm in the basin.
  - **Step 2 (Direct Impact):** Yes. If water availability changes, the farm may not need the worker (layoff) or the worker's livelihood is directly tied to the farm's operations. Evidence: Lease agreement showing employment tied to the land.
  - **Step 3 (Non-Substitutability):** The worker could potentially find another job (substitution via labor market). However, if the worker has specialized skills for that region or the job market is tight, substitution may not be feasible. Also, compensation for job loss isn't guaranteed. 
    - **Soft Stop:** Ambiguous. If the worker has no other job prospects in the area and no compensation, then non-substitutable. But if they can easily move, then substitutable. Flag for sign-off. (Note: In many cases, seasonal workers are vulnerable and lack alternatives, so we might err on inclusion.)
  - **Step 4 (Self-Reference):** Not applicable (no loop detected).
  - **Step 5:** Not a group or representative.
  - **Conclusion:** Flagged for sign-off. Officer's call: likely include because the worker bears non-substitutable risk (job loss without compensation) and the short lease doesn't negate the risk during their tenure.

  **Case 2: Tribal Council with Treaty Rights and Its Own Elections**

  - **Step 1:** Referendum: Flow allocation that affects fishing rights granted by treaty. Entity: Tribal council (representing a tribal nation).
  - **Step 2 (Direct Impact):** Yes. The treaty guarantees fishing rights, which are tied to river flow. Changing flows could harm fish stocks, directly impacting the tribe's rights and livelihood. Evidence: Treaty document, historical records of fishing.
  - **Step 3 (Non-Substitutability):** The tribe cannot substitute the loss of fishing rights (it's a unique cultural and economic resource). Evidence: Treaty acknowledges the uniqueness; no alternative exists.
  - **Step 4 (Self-Reference):** Not applicable (or if the tribal vote could change the outcome and thus the risk, but that's true for any voter; we don't consider that a loop here).
  - **Step 5 (Special Case - Group):** The tribal council is a recognized government with its own elections. Evidence: Federal recognition, treaty. Include the council as a single voting entity (they vote as a bloc per their internal process).
  - **Conclusion:** Include the tribal council.

  **Case 3: Trustee Representing Unborn Residents**

  - **Step 1:** Referendum: A dam removal that could have long-term ecological effects. Entity: A trustee for unborn residents.
  - **Step 2 (Direct Impact):** Yes. Unborn residents will live in the basin and be affected by the long-term state of the river (e.g., flood risks, water quality). Evidence: Environmental impact projections showing effects beyond 50 years.
  - **Step 3 (Non-Substitutability):** The unborn cannot avoid the risk (they are born into it) and it's non-substitutable (they cannot move to avoid the risk until born, and even then, the risk is inherent to their birthplace). 
  - **Step 4 (Self-Reference):** Not a loop in the sense that the trustee's inclusion doesn't change who the unborn are. However, the trustee's vote might affect the outcome and thus the risk. But that's not a self-reference loop in the definition (the unborn are fixed, independent of the vote).
  - **Step 5 (Special Case - Representative):** 
    - **Question 1:** Are the unborn at non-substitutable risk? Yes (from Step 3).
    - **Question 2:** Is the trustee legitimate and accountable? Evidence: The trustee is appointed by a recognized process (e.g., by the authority or by law). But accountability to the unborn is inherently weak (they cannot sanction the trustee). 
    - **Soft Stop:** Accountability is problematic. Flag for sign-off. (Note: This is a values call about whether we can represent future generations.)
  - **Conclusion:** Flagged for sign-off. Officer's call: likely include, but note the challenge of accountability.

  **One Case Where the Answer Comes Out Wrong by Our Lights:**

  Consider a **hypothetical case: A seasonal worker who has a guaranteed contract with a relocation clause and severance pay.**

  - **Step 1:** Referendum: Dam removal affecting farm. Entity: Seasonal worker with a 6-month lease that includes: if the farm loses water rights, the worker gets relocated to another farm in the same company (same pay) or severance pay equal to 3 months' wages.
  - **Step 2:** Direct impact? Yes (the dam removal might cause the farm to lay off workers).
  - **Step 3:** Non-substitutable? No. The worker has a contract that substitutes the risk (relocation or severance). They are indifferent to the outcome because they are compensated. Hard stop: exclude.
  - **Why it might be wrong by our lights:** The worker might have non-economic ties (community, children in school) that make relocation costly. But our procedure only looks at contractual substitution. We don't consider personal circumstances unless they are documented (e.g., a study showing that such workers suffer despite compensation). 
    - **Problem:** The procedure relies on formal evidence (contracts) and might miss substantive non-substitutability. This is a known misfire.

  ---

  **What the Procedure Can't Settle and Where It Will Misfire:**

  - **Ambiguity in Non-Substitutability:** When risks are theoretically compensable but in practice are not (e.g., due to market failures, lack of enforcement). The procedure relies on available evidence (contracts, laws) and might exclude vulnerable groups.
  - **Self-Reference Loops:** If the demos definition changes the outcome and thus who is affected, we flag it but don't resolve it. Resolution requires political or ethical judgment.
  - **Representative Legitimacy:** Trustees for future generations are inherently hard to hold accountable. The procedure flags it for sign-off, leaving it to the officer's discretion.
  - **Group Representation:** The procedure assumes groups with recognized structures can represent their members. But if the group's internal process is flawed, we don't question it (we take it as given).
  - **Temporal Issues:** For future generations, we assume they are affected, but the evidence (long-term projections) is often uncertain.

  **Misfires:**
  1. **Over-inclusion:** If we are too lenient on soft stops, we might include people who are not truly at non-substitutable risk (e.g., someone with full insurance).
  2. **Under-inclusion:** As in the seasonal worker with a contract, we might exclude someone who is substantively at risk because of formal compensation that doesn't work in practice.
  3. **Self-Reference Loops:** We flag but don't solve. In a close vote, including a group might change the outcome and thus the affected parties, leading to circularity.

  **Final Note:** This procedure is a pragmatic tool. It won't capture every nuance but should handle 80% of cases in 20 minutes. The rest require your judgment as the officer.
answer: |-
  Below is a reusable 20-minute decision procedure for your staff, designed as a flowchart with ordered questions, evidence thresholds, hard stops (exclude), soft stops (requires your sign-off), and explicit flags for self-reference loops. It prioritizes practicality and avoids philosophical jargon. Staff should gather basic documentation (e.g., contracts, treaties, impact reports) before starting the timer.

  ---

  ### **Decision Procedure: Demos Inclusion Protocol**  
  **Core Principle:** Include only if the entity bears **non-substitutable risk** (risk cannot be transferred, avoided, or fully compensated).  

  #### **Ordered Questions & Rules**  
  *(Run in sequence; answer "yes" or "no" with evidence)*  

  1. **DIRECT PHYSICAL/ECONOMIC IMPACT?**  
     - *Question:* Could the referendum outcome physically or economically harm the entity’s person, property, or livelihood?  
     - *Evidence Required:* Documented link (e.g., environmental study showing flood risk to land, contract tying work to water access).  
     - **Hard Stop (Exclude):** No impact.  
     - *Soft Stop (Sign-off):* Impact exists but is minor/indirect (e.g., vague future risk).  

  2. **NON-SUBSTITUTABLE RISK?**  
     - *Question:* Can the entity avoid the risk *without cost* (e.g., move away, sell assets) or be *fully compensated* (e.g., insurance, guaranteed payout)?  
     - *Evidence Required:* Proof of alternatives (e.g., relocation clause in lease, tribal resource-sharing treaty, trust fund).  
     - **Hard Stop (Exclude):** Risk is avoidable/compensated (e.g., worker has free relocation).  
     - *Soft Stop (Sign-off):* Uncertainty (e.g., compensation exists but is unreliable).  

  3. **SELF-REFERENCE LOOP FLAG:**  
     - *Question:* Does the entity’s inclusion/exclusion *change who is at risk*? (e.g., If they vote, the outcome shifts, altering impacted groups).  
     - *Evidence Required:* Scenario analysis (e.g., "If Tribe X votes, Dam Y is removed, putting Farm Z at risk").  
     - **Flag & Proceed:** Always note if present. Does **not** auto-include/exclude.  

  4. **REPRESENTATION VALID?**  
     - *Question (Groups/Trustees only):* Is there a clear, accountable representative (e.g., elected council, court-appointed trustee)?  
     - *Evidence Required:* Legal authority (e.g., tribal constitution, trust deed).  
     - **Hard Stop (Exclude):** No representative (e.g., "unborn residents" with no trustee).  
     - *Soft Stop (Sign-off):* Disputed legitimacy (e.g., tribal faction challenges council).  

  **Final Output:**  
  - ✅ **Include** (passes all steps).  
  - ❌ **Exclude** (any hard stop).  
  - ✍️ **Escalate to Officer** (any soft stop or loop flag).  

  ---

  ### **Application to Cases**  
  **Staff Time:** Each case designed for 5-7 minutes (total 15-21 min).  

  #### **Case 1: Migrant Farmworker (6-Month Lease)**  
  1. **Direct Impact?** Yes. Referendum affects water for crops; worker’s job requires irrigation. *Evidence:* Farm lease tying work to land.  
  2. **Non-Substitutable Risk?** Soft Stop. Worker *could* find a new job, but cost (lost wages, relocation) is high. No guaranteed compensation. *Evidence:* Lease lacks relocation/severance clause.  
  3. **Self-Reference Loop?** No. Worker’s vote won’t change who else is at risk.  
  4. **Representation Valid?** N/A (individual).  
  **Result:** ✍️ **Escalate to Officer.** *Why?* Substitutability is ambiguous (values call: Is job loss "compensatable" by labor markets?).  

  #### **Case 2: Tribal Council (Treaty Rights)**  
  1. **Direct Impact?** Yes. Flow allocation affects fishing/hunting rights. *Evidence:* Treaty guaranteeing river access.  
  2. **Non-Substitutable Risk?** Yes. Rights are unique; no alternative land or compensation. *Evidence:* Treaty specifies non-transferable rights.  
  3. **Self-Reference Loop?** Flag. If tribe votes, outcome may shift river flow, impacting downstream farmers (who then might "become" at-risk).  
  4. **Representation Valid?** Yes. Tribal council elected per tribal law. *Evidence:* Tribal constitution.  
  **Result:** ✅ **Include** (with loop flagged).  

  #### **Case 3: Trustee for Unborn Residents**  
  1. **Direct Impact?** Soft Stop. Unborn residents *could* face flood risks from dam removal, but harm is decades away. *Evidence:* Hydrological study showing long-term erosion.  
  2. **Non-Substitutable Risk?** Yes. Unborn cannot avoid/resell land; no compensation exists. *Evidence:* Trust deed acknowledging perpetual risk.  
  3. **Self-Reference Loop?** Yes. Including trustee may sway vote toward conservation, changing which *current* residents bear risks (e.g., farmers lose water access).  
  4. **Representation Valid?** Soft Stop. Trustee is court-appointed, but "accountability" to unborn is unenforceable. *Evidence:* Court order.  
  **Result:** ✍️ **Escalate to Officer** (multiple soft stops + loop).  

  ---

  ### **Case Where the Procedure Fails (By Your Lights)**  
  **Hypothetical Case: A downstream farmer with "compensatable" risk.**  
  - **Procedure Outcome:** ❌ Excluded.  
  - **Why?**  
    1. Direct Impact? Yes (flood risk).  
    2. Non-Substitutable Risk? **Hard Stop.** Farmer has flood insurance covering 100% losses. *Evidence:* Insurance policy.  
  - **Why Wrong?** Insurance may not cover emotional/cultural ties to land (non-substitutable by your principle), but procedure ignores non-economic factors. **Misfire:** Over-relies on financial evidence.  

  ---

  ### **Limitations & Where It Misfires**  
  **What It Can’t Settle (Requires Your Judgment):**  
  - **Ambiguous Substitutability:** E.g., "avoidable risk" for low-income workers (soft stops).  
  - **Representation Gaps:** Trustees for unborn, marginalized groups without clear leaders.  
  - **Self-Reference Loops:** No internal solution; only flags for your review.  
  - **Non-Economic Harm:** Cultural/spiritual risks (e.g., tribal sacred sites) often lack evidence.  

  **Where It Will Misfire:**  
  1. **Over-Exclusion:** Entities with non-financial risk (e.g., cultural loss) excluded due to lack of evidence.  
  2. **Under-Inclusion:** Compensated entities *should* be excluded, but if compensation is flawed (e.g., underfunded trust), procedure may miss it.  
  3. **Loops & Scale:** In referendums with many small voters (e.g., 10k seasonal workers), individual assessments become impractical.  
  4. **"Future" Uncertainty:** Unborn/ecological risks rely on speculative projections (soft stops dominate).  

  **Staff Instructions:**  
  - Use a standard template (e.g., spreadsheet) with the 4 questions.  
  - Gather evidence *before* starting the 20-minute timer.  
  - For loops/soft stops, write a 1-sentence reason for escalation (e.g., "Loop: Tribe’s vote may put farmers at risk").  
  - Never spend >5 minutes on evidence hunting—use what’s readily available.  

  This balances speed with rigor. For 80% of cases, it’ll give clear in/out decisions; the rest escalate to you with highlighted sticking points.
