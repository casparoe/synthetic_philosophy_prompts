prompt: |-
  I host a small interview podcast, and my next guest has written a book arguing that deep moral disagreements should be handled the way economists handle trade: if you and I value different things, each of us should concede ground on the issues we care less about in exchange for concessions on the issues we care more about, so that both of us end up with a world we rank higher than the one we would get by fighting to a draw. His running example is two donors, one devoted to animal welfare and one to malaria prevention, who coordinate their giving across both causes rather than each funding only their own.

  Draft eight to ten interview questions that press on the view rather than letting him restate it. I want at least one question on each of the following, with a follow-up keyed to the answer he will most likely give:

  - Whether the whole idea quietly assumes that different people's values can be measured against one another, and what "better off by both our lights" even means if they cannot be.
  - The objection that compromising on something you take to be a duty is not prudence but complicity: he seems to be asking each side to do some wrong so that the other side does less of it.
  - What the framework says when one party's values are not merely different but abhorrent to the other — whether there is a limit on who counts as a trading partner, and whether drawing that limit smuggles in the shared moral standard the theory claims to do without.
  - Who the compromise is really between: both parties may come out ahead by their own lights while third parties who never agreed to the deal — the animals, the patients, the people the policies touch — bear the cost.

  Please structure the response in four sections, in this order: "Pinning down the view," a single opening question that forces him to state precisely what each side gains and how he knows (about 100 words); "Pressure questions," the questions and follow-ups above (about 400 words); "One question he will not expect," a closing question from an angle the standard objections miss (about 100 words); and "What is actually contested," a short note on which of these objections people who work on this treat as live disputes and which are generally regarded as misunderstandings of the position, without presenting either side of a genuinely contested point as the consensus (about 100 words).
reasoning: |-
  Okay, the user hosts a small interview podcast and needs questions for a guest who argues for handling moral disagreements like economic trade. The guest's book suggests trading concessions on less important issues for gains on more important ones, similar to donors coordinating across animal welfare and malaria prevention. 

  The user wants eight to ten questions that challenge the view without letting the guest restate it. They specifically want coverage on four key areas: measurability of values, compromising on duties, dealing with abhorrent values, and impacts on third parties. Each main question needs a follow-up based on likely answers. The structure must be in four sections: Pinning down the view, Pressure questions, One unexpected question, and What is actually contested.

  Hmm, the user is clearly preparing a rigorous interview. They're not just seeking surface-level engagement but want to expose potential weaknesses in the guest's framework. The specificity about structure and contested points suggests they value academic precision and want to avoid softball questions. 

  For the "Pinning down the view" section, I need an opening question that forces the guest to operationalize "better off." The donor example is perfect for this - it requires defining how gains are measured across incommensurate values. I'll ask how they verify that both parties actually rank the outcome higher.

  The pressure questions section is the core. For measurability, I'll challenge whether interpersonal utility comparisons are possible without a common currency, then follow up on cardinal vs ordinal utility. For the duty objection, I'll frame compromise as complicity in wrongdoing, then press on whether moral duties can be "traded" at all. On abhorrent values, I'll question if Nazis can be trading partners, then dissect whether excluding them relies on hidden universal ethics. For third parties, I'll highlight how animals/patients bear costs without consent, then push on whether the framework treats moral patients as mere commodities.

  The unexpected question should come from a fresh angle. I'll ask about a scenario where the trade requires both sides to actively perpetrate harm rather than redirect resources - like donors funding each other's morally opposed projects. This tests the limits of "trading" actions versus omissions.

  For the contested points section, I'll note that critics fiercely debate whether values can be cardinalized and whether duties are tradeable, while third-party objections are often seen as misunderstanding the theory's scope. The abhorrent values challenge is acknowledged but unresolved in literature.

  The user's framing suggests deep familiarity with the debate - they're probably well-read in ethics or philosophy. Their request for "unexpected" angles and clarity on contested points indicates they want to advance the conversation beyond rehearsed arguments. I should maintain rigorous academic tone while keeping questions accessible for podcast audiences.
answer: |-
  Here’s a structured interview draft focusing on critical engagement with the "moral trade" framework, following your specifications:

  ### I. Pinning Down the View (Opening Question)
  **Question:** "Your core analogy treats moral disagreements like economic trade. Take your donor example: if the animal welfare advocate concedes funding on factory farms to gain malaria bed nets, and the global health advocate concedes bed nets to gain corporate cage-free campaigns, how do you *quantify* that both end up with a 'world they rank higher'? Since they value fundamentally different things—animal suffering vs. human lives—what’s the common metric proving this trade isn’t just mutual appeasement but actually leaves each *objectively* better off by their *own* standards?"

  ### II. Pressure Questions (with Follow-Ups)
  1.  **Measurability & Commensurability:**
      *   **Q1:** Your framework assumes we can compare *how much* each party values their respective causes to facilitate trade. But if values are truly incommensurable—e.g., "preventing a child's death" vs. "preventing a thousand chickens suffering"—how can we meaningfully say Party A gained *more* 'value units' than they lost, especially when Party B uses entirely different 'units'? Isn't this smuggling in a hidden universal currency?
      *   *Likely Answer:* He'll appeal to revealed preferences or ordinal rankings (they prefer the trade outcome to no trade).
      *   **Follow-Up:** But revealed preference only shows they *chose* the trade, not that their gains *outweigh* their concessions in any intersubjectively meaningful way. If the animal advocate feels deeply complicit in human deaths for cage-free gains, hasn't she just swapped one deeply-felt wrong for another, without proving a net "gain" exists beyond subjective relief at avoiding gridlock?

  2.  **Compromise vs. Complicity:**
      *   **Q2:** Many see core moral duties as categorical—"Don't kill innocents," "Don't torture animals." If I believe funding malaria prevention *actively enables* animal suffering (or vice versa), isn't your trade asking me not for prudent concession, but to become *complicit* in a specific wrong? Am I not being asked to *do* some evil so *less* evil (by my lights) happens overall—effectively endorsing a form of "lesser evilism" that still corrupts me?
      *   *Likely Answer:* He'll argue this is about minimizing total harm/badness given disagreement, and refusing to trade leads to worse outcomes.
      *   **Follow-Up:** But doesn't this instrumentalize morality? If my duty is *deontological* (e.g., "Never directly fund animal cruelty"), how does showing me that my concession leads to *net* less suffering (by my metric) absolve me of violating that specific duty? Isn't the core objection that you're asking me to *violate my integrity* for consequentialist gains?

  3.  **Abhorrent Values & Trading Partners:**
      *   **Q3:** Your model seems neutral between values. What if Party A values, say, ethnic purity and seeks to expel Group X, while Party B values universal healthcare? If Party A cares *vastly more* about expulsion than healthcare, and Party B cares *vastly more* about healthcare than blocking expulsion, does your framework endorse a trade: some expulsion for better healthcare? If not, where do you draw the line on who counts as a valid trading partner?
      *   *Likely Answer:* He'll likely exclude parties based on extreme harm or lack of basic reciprocity.
      *   **Follow-Up:** But doesn't drawing *that* line—say, excluding values causing "extreme harm"—require precisely the kind of shared moral standard (e.g., harm is bad) that your theory claims isn't needed for trade? Isn't the act of exclusion itself a concession that some values are so odious they *can't* be traded, undermining the universality of the framework?

  4.  **Third Parties & Consent:**
      *   **Q4:** In your donor example, the animals and malaria patients are passive subjects. The trade might leave both donors "better off," but the animals might suffer *more* under a redirected cage-free compromise they didn't consent to, or patients might die because bed nets were traded away. Isn't this framework ultimately a deal *between moral agents* that treats the actual subjects of morality—sentient beings—as mere *currencies* to be bargained over without their voice?
      *   *Likely Answer:* He'll argue this is unavoidable in any policy decision under disagreement; the trade still leads to better aggregate outcomes.
      *   **Follow-Up:** But doesn't this reduce moral patients to objects in a utility calculus controlled by distant bargainers? If the malaria patient values *their own life* infinitely, how can the animal advocate's concession on bed nets—sacrificing that life for chickens—be justified *to the patient*? Isn't the framework inherently privileging the preferences of the powerful bargainers over the voiceless subjects?

  ### III. One Question He Will Not Expect
  **Question:** "Your examples focus on redirecting *positive* resources (money, effort). But what about trades requiring *active perpetration*? Imagine two opposing activists: one believes abortion is murder, the other believes restricting it is torture. If they 'trade'—the pro-choice activist reluctantly supports some late-term restrictions to gain broader early access, while the pro-life activist reluctantly allows some early access to gain late-term bans—hasn't your framework potentially coerced *both* into *personally enacting* what they view as profound evils (murder/torture), making them direct instruments of the harm they abhor? Is this meaningfully different from your donors?"

  ### IV. What is Actually Contested
  **Note:** The core dispute centers on **value commensurability**. Critics argue the framework *requires* cardinal, interpersonally comparable utility, which many philosophers (e.g., non-utilitarians, value pluralists) reject as impossible or meaningless. The **duty/complicity objection** is also hotly contested, hinging on fundamental debates between consequentialist and deontological ethics. The **third-party objection** is often seen as partially misunderstanding the theory's scope (it addresses conflicts *between* agents, not obligations *to* patients directly), though concerns about voiceless subjects remain serious. The **abhorrent values challenge** is widely acknowledged; proponents typically add external constraints (e.g., basic rights), but this move's consistency with the core theory is disputed.
