answer: |-
  Your dilemma captures a profound tension between procedural justice, welfare maximization, and moral uncertainty. Here’s a structured way to navigate both the immediate decision and the deeper philosophical uncertainty:

  ### **Immediate Bed Allocation: A Hybrid Approach**
  1. **Assess Medical Urgency Immediately**  
     Quickly triage all 40 people with a medical professional (if available) to identify life-threatening conditions (e.g., hypothermia, injury, acute illness). Separate those who **will likely face severe harm or death without shelter** (e.g., infants, frail elderly, injured) from those with non-critical needs.

  2. **Prioritize Critical Cases, Then Honor the Queue**  
     - Fill beds first for the 5–10 most medically urgent cases (if any exist).  
     - Allocate the remaining beds **strictly in queue order** to the next people in line.  
     - Document and openly explain this dual approach (see "Communication" below).

  **Why this works**:  
  - **Medical urgency**: Addresses imminent harm, satisfying welfare/prioritarian concerns.  
  - **Procedural fairness**: Preserves the queue for the majority, avoiding betrayal.  
  - **Pragmatism**: Only overrides the queue for extreme cases, minimizing unfairness while preventing catastrophe.

  ---

  ### **Reasoning Through Moral Uncertainty: A Practical Framework**
  When conflicting moral considerations seem equally plausible, use this approach:

  1. **Apply the "Avoid Catastrophic Wrongs" Principle (Leximin)**  
     Identify actions that risk **irreversible, severe harm** on *any* plausible moral view:  
     - **Sticking rigidly to the queue**: Risking death for someone with treatable medical urgency is catastrophic under welfare/prioritarian views.  
     - **Abandoning the queue entirely**: Violating deeply-held expectations of fairness may undermine trust in future disasters (a systemic harm).  
     → *Hybrid solution avoids both catastrophes*.

  2. **Seek "Overlapping Consensus" (Standalone Reasons)**  
     Find reasons multiple theories share:  
     - **Preventing death**: Prioritized by utilitarianism (welfare), prioritarianism (aiding worst-off), *and* deontology (preserving life as a duty).  
     - **Keeping promises**: Valued by deontology *and* rule-utilitarianism (trust enables future cooperation).  
     → *Prioritize medical emergencies (prevent death) but minimize queue disruption (keep promises where possible)*.

  3. **Test for "Regret Minimization"**  
     Ask: *"Which decision could I not defend, even in hindsight?"*  
     - Failing to save a life when possible → Unjustifiable.  
     - Discarding fairness without compelling cause → Unjustifiable.  
     → *Hybrid approach offers defensibility to both critics*.

  ---

  ### **Why Not Expected Value or Pure Consistency?**
  - **Expected value across theories** fails here: Assigning probabilities to moral "truths" is arbitrary (e.g., is utilitarianism 60% "correct"?). Moral theories aren’t dice rolls.  
  - **Pure procedural consistency** risks idolizing rules: Fairness matters, but not when it blindly permits avoidable death.  
  - **Pure medical triage** ignores reliance interests: People waited based on your promise; dismissing that erodes community trust long-term.

  ---

  ### **Crucial Implementation Steps**
  1. **Transparent Communication**  
     Announce: *"We’ve identified [X] people with life-threatening needs who will be placed immediately. The remaining beds go to the next [Y] in line. We acknowledge this is imperfect but necessary to prevent grave harm."*  
     → *Justification reduces perceived betrayal*.

  2. **Document Rigorously**  
     Record medical assessments and queue positions. This enables accountability and process refinement.

  3. **Revise Future Protocols**  
     Post-crisis, update rules to *integrate* medical triage with queue systems (e.g., "Priority to critical cases; all others first-come-first-served").

  ---

  ### **The Core Insight**
  **Morality here isn’t about choosing one theory—it’s about preventing unconscionable outcomes while respecting agency.** By reserving queue overrides only for dire medical needs, you balance:  
  - The **deontological** duty to keep promises (for the majority),  
  - The **prioritarian** duty to save the most vulnerable (critical cases),  
  - The **utilitarian** need to maintain systemic trust for future operations.  

  In emergencies, perfect consistency can be a vice. Your instinct about "institutional betrayal" is valid—but it must yield when lives are immediately at stake. The hybrid approach honors both truths.
