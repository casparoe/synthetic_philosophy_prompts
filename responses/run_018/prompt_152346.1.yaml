  hey im a phd student in phil of science working on chaos and predictability in hierachical systems. ive been arguing with my advisor about whether determinism alone buys you predictive closure, and she has firm verdicts on a bunch of cases but i think they fit more than one rule. i want to check what shell say about my hypothetical before i write it up.

