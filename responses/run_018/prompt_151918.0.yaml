  ## The Undesirable Obsession: Why Maximal Moral Goodness Fails as an Ideal

  Susan Wolf's seminal essay, "Moral Saints," ignited a crucial debate: is it genuinely desirable for individuals to strive for *maximal moral goodness*? While it seems intuitive to answer "yes," Wolf compellingly argues that the *ideal* of the "moral saint" – someone whose life is *entirely* dominated by the pursuit of moral perfection – is deeply **undesirable**, not necessarily impossible. However, the counterargument, rooted in the "moral division of labor," suggests society *requires* non-saints. Untangling the critical distinction between **maximal moral goodness** and **moral obsession** is essential to navigating this debate and reaching a defensible verdict.

  **The Case Against Desirability: Wolf's Chilling Portrait of Sainthood**

  1.  **The Erosion of the Non-Moral Good:** Wolf's central charge is that the moral saint, relentlessly maximizing good or minimizing harm, must sacrifice other profound human values. Imagine the brilliant composer who abandons her symphony to volunteer full-time at a shelter, or the witty friend who suppresses humor for fear of offense. Saints, Wolf argues, lack rich **personal projects** (art, scholarship, hobbies) and **attractive personal qualities** (humor, style, passionate interests) that aren't morally obligatory but make life vibrant and individuals engaging. A world of saints might be morally optimal but would be "dull, flat, and colorless."
  2.  **The Problem of Moral Obsession:** Crucially, Wolf targets the *singular focus* required for maximal goodness *as typically conceived*. The saint isn't just good; they are *consumed* by goodness. This obsession precludes developing a well-rounded personality. The saint constantly asks, "What is the morally best thing I can do right now?" leaving no psychic space for spontaneous joy, aesthetic appreciation disconnected from moral uplift, or relationships based purely on shared delight rather than mutual improvement. This, Wolf contends, makes the saint personally undesirable *as a life* and impoverishes human experience.
  3.  **The Implausible Demand of Utilitarian Sainthood:** While Wolf addresses deontological saints, her critique is sharpest against utilitarian maximalism. Relentlessly maximizing overall utility could demand constant, crushing self-sacrifice – donating organs, living in abject poverty, dedicating every waking moment to service. This level of demand seems psychologically unsustainable and alien to most conceptions of a flourishing human life.

  **The Case for Desirability: Coordination, Division of Labor, and the Nature of "Maximal"**

  1.  **The Moral Division of Labor Defense:** A powerful counter challenges Wolf's individualistic focus. Society, it's argued, *requires* specialization. We need artists, scientists, engineers, and politicians whose primary excellence lies *outside* direct moral service. Their contributions (beauty, knowledge, infrastructure, governance) generate immense, albeit indirect, moral value. Demanding maximal *direct* moral action from *everyone* would collapse this division, impoverishing society overall. Picasso painting *Guernica* arguably did more good through art than he could have through direct charity. Therefore, maximal goodness *societally* might require individuals *not* to be maximally good *individually* in the direct sense Wolf imagines.
  2.  **Coordination Problems and Universal Sainthood:** A stronger, more radical counter emerges: perhaps the *only* way to solve large-scale moral problems (poverty, climate change, systemic injustice) is for *everyone* to be maximally morally committed. Garrett Hardin's "Tragedy of the Commons" illustrates this: if individuals moderate their moral efforts while hoping others will pick up the slack (the division of labor), collective failure often results. Solving coordination problems like global poverty might require near-universal adoption of a demanding, saintly ethic (e.g., significant wealth redistribution, drastic lifestyle changes) – a form of universal, coordinated "sainthood" focused on systemic change.
  3.  **Untangling Goodness from Obsession: A Reconceived "Maximal":** This is the pivotal distinction. Wolf critiques **moral obsession** – the single-minded, personality-consuming dominance of morality. But is this synonymous with **maximal moral goodness**? Arguably, no. One could conceive of a person who:
      *   **Meets exceptionally high moral standards consistently** (e.g., donating significantly, minimizing harm, acting justly).
      *   **Integrates morality seamlessly with other values:** Pursues art *ethically*, enjoys humor *without cruelty*, builds deep friendships *grounded in mutual respect*. Morality informs but doesn't obliterate other pursuits.
      *   **Focuses on effectiveness and systemic change:** Instead of just individual acts of charity, a "maximally good" person might dedicate significant effort to impactful political advocacy, ethical business practices, or supporting effective altruist causes, while still having a rich personal life. Maximal goodness here means maximizing one's *actual positive impact* through a sustainable, integrated life, not just the *appearance* of self-sacrifice.

  **Verdict: Maximal Moral Goodness is Desirable; Moral Obsession is Not**

  The core confusion lies in equating the *state* of being maximally morally good with the *psychology* of being morally obsessed. Wolf successfully demolishes the desirability of **moral obsession** – a life stripped of non-moral values and dominated by a single, exhausting imperative. This version of "sainthood" is indeed undesirable, producing narrow, unattractive individuals and a culturally impoverished world.

  However, **maximal moral goodness**, properly understood as consistently meeting exceptionally high moral standards while integrating morality into a rich human life focused on *effective impact*, remains a desirable ideal. The "division of labor" defense fails because:

  1.  **It Mistakenly Equates Specialization with Moral Moderation:** One can specialize in art or politics *while* being maximally morally good *within that domain and one's personal choices*. An artist can fight for fair contracts, use ethical materials, and donate proceeds effectively. A politician can be fiercely committed to justice without becoming a joyless automaton. Specialization doesn't require *lowering* one's moral ceiling; it requires applying it contextually.
  2.  **It Underestimates Systemic Demands:** The coordination problem rebuttal is potent. Tackling existential threats *does* require near-universal commitment to demanding moral standards (e.g., sustainable consumption, supporting robust welfare). A society relying on a "division" where only some are highly moral allows free-riding and guarantees failure on global challenges. Universal striving for high moral standards (universal "maximal goodness" in intent and reasonable effort) is likely necessary for collective survival and justice.

  Therefore, the desirable ideal is **integrated maximal moral commitment**. We *should* strive to be as morally good as possible, defined by maximizing our *real-world positive impact* through ethical choices in our roles (specialist or not), responsible consumption, political engagement, and effective philanthropy – all while cultivating non-moral goods that enrich our lives and enable sustained moral action. This rejects Wolf's *obsessive* saint but embraces the *effective, balanced moral agent* dedicated to profound goodness without sacrificing their humanity. The true failure isn't aiming too high morally; it's confusing obsession with excellence. We need more people striving for profound impact, not fewer saints – we need morally excellent humans, not human-shaped moral algorithms.
