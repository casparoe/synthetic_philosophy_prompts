prompt: |-
  I'm putting together a decision-tree handout for a grad seminar on enviromental ethics — specifcally on the precautionary principle but not the generic "strong vs weak" version you see in policy docs. I want the tree to start from concrete commitments, not from philosopher names, using three cases: (1) releasing a gene-drive organism in a closed archipelago where the unknown risk is extinction of a non-target pollinator but the benefit is malaria eradication; (2) deploying stratospheric aerosol injection with a potential irreversible albedo feedback loop; and (3) banning a pesticide with well-documented sublethal effects on pollinators but where economic collapse of small farms is also probable.

  Can you build a taxonomy / decision tree that sorts positions by how they answer four diagnostic splits? First split: does precaution apply only to anthropogenic risks, or also to risks we merely fail to mitigate (e.g., letting natural climate variability run its course)? Second: is the trigger for precaution a binary threshold of "non-negligible possibility of catastrophic harm," or is it graded by both plausibility and severity? Third: does the principle place the burden of proof on the proponent of action, on the opponent of inaction, or is that framing incoherent? Fourth: when precaution conflicts with distributive justice (small farms collapse, malaria persists), is precaution a veto, an override weighted by severity, or does it dissolve?

  For each leaf, name the position if it's a real named view (e.g., strong precautionary principle, risk-based critiques like Sunstein's, etc.) or mark it "unnamed" if it's an unoccupied logical combination. Also flag any pair of leaves your tree can't actually separate — for instance, if "graded precaution with burden on proponents" and "binary precaution with burden on proponents" collapse into the same practical recommendation in case (1). And please include the unoccupied combinations: e.g., maybe nobody holds "graded precaution that applies to natural risks with burden on opponents" — briefly diagnose whether that empty spot is incoherent, unattractive, or just unexplored. Make sure the tree is built from the logical space of answers, not from a list of names; I need about 8-10 leaves total, audience is philosophy grad students who know some decision theory but aren't policy experts. Take a definite stance: don't just map the space neutrally, but argue briefly for which splits are actually doing the philosophical work and which ones are red herrings. Oh, and no citations or reading lists — just the tree, the leaf descriptions, and your committed take on where the lines should be drawn.
