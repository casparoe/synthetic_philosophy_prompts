answer: |-
  ### Brainstorming: Three Structural Features for Divergence  
  1. **Embedded Field Symmetry**: A rigid rotating lattice with persistent electromagnetic field patterns that are symmetric relative to lattice points but asymmetric in relational body-to-body terms.  
  2. **Null Global Current**: A system with co-rotating charged components where net current is zero, masking absolute motion electromagnetically.  
  3. **Dynamically Isolated Rotation**: Mechanical rotation decoupled from external forces via superconducting constraints, making centrifugal effects internally measurable but externally causally inert.  

  ### Thought Experiment: The Charged Toroidal Lattice  
  Consider an eternally rotating, rigid toroidal lattice composed of superconducting material, with a uniform positive charge distribution. A co-rotating, persistent azimuthal current generates a static magnetic field confined entirely within the torus’s void. All internal strain gauges register centrifugal stress, and local compasses align with the magnetic field. The system is dynamically isolated: no external forces act on it, and its angular momentum is conserved. Both theories predict identical sensor readouts and the absence of radiation.  

  ### Analysis  
  1. **Substantivalist Verdict**  
     The lattice rotates relative to absolute space. Centrifugal stresses and the magnetic field arise from absolute rotational motion. In an otherwise empty universe, the system would identically exhibit these effects because spacetime points provide the reference for rotation. The electromagnetic field is a *substantial entity* anchored to absolute spatial points; its configuration depends on motion relative to those points.  

  2. **Relationist Verdict**  
     Rotation is defined by relative motions among the lattice’s parts. Centrifugal effects depend on internal relations (e.g., inter-atom strains). The electromagnetic field is *ontologically reducible* to relations between charges; its "rotation" is just a description of charge-velocity differences. In an empty universe, no relations exist beyond the lattice’s internal state. Without external reference bodies, "rotation" lacks meaning; centrifugal effects and the magnetic field vanish.  

  3. **Isolating Structural Feature**  
     The **ontological status of the electromagnetic field** drives divergence. Substantivalism treats the field as a spacetime-anchored entity, making rotation absolute. Relationism treats it as a mathematical encoding of relational charge dynamics, making rotation dependent on the global material context.  

  4. **Consequence of Feature Removal**  
     If EM fields were neutralized (e.g., uncharged lattice), the case collapses into Newton’s bucket: disagreement reduces to whether rotation requires absolute space or distant matter. The EM field assumption blocks this collapse by introducing a *non-gravitational, non-inertial field* whose ontology directly shapes the counterfactual.  

  5. **Best Defense for the Weaker View (Relationism)**  
     The substantivalist fares worse here. A relationist can attack the counterfactual premise *without begging the question* by arguing:  
     - "Empty universe" scenarios are *incoherent* for rotation. Rotational states inherently require a relational framework; positing isolation smuggles in absolute structure by assuming rotation can exist without a material reference.  
     - **Non-question-begging move**: Reject the counterfactual’s physical possibility. If relations constitute motion, a universe with a lone rotating object is as meaningless as "left-handedness" in a mirrorless universe. This exploits modal skepticism rather than presupposing relationism.  

  ### Summary  
  The divergence turns on whether EM fields are spacetime fixtures (substantivalism) or relational epiphenomena (relationism). The charged torus isolates this by making EM fields essential to rotation’s ontology while masking differences empirically. Relationists escape via modal skepticism about isolation, avoiding circularity by denying the intelligibility of the counterfactual setup.
