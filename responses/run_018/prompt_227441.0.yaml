prompt: |-
  So I've been chewing on that whole idea of figuring out what people "really" want by extrapolating what they'd want if they were smarter, better informed, more coherent -- the coherent extrapolated volition thing, or idealized preferences more generally. And I keep testing it against cases and getting verdicts I can't make fit together. Here they are:

  My grandma hates cilantro, and no amount of information or deliberation would change that, so "idealized grandma" also hates cilantro -- obviously fine to just serve what actual grandma wants, the idealization does nothing here.

  My friend wants to text his ex at 2am while drunk; sober, rested, fully-informed him would beg us to take his phone away. Deferring to idealized him over actual him: completely fine, I'd do it and feel good about it.

  My cousin has been depressed for a year and says she wants nothing, doesn't care about anything anymore. Idealized her -- the version with her old capacity to care restored -- would want to see her friends, finish her degree. Nudging her based on idealized-her instead of actual-her: I think this is right, maybe even obligatory, but it already feels paternalistic in a way the drunk texting case doesn't, and I'm not sure why.

  A lifelong smoker, fully informed about every risk, coherent, no compulsion, still wants to smoke. Here I think you have to respect it -- the idealization comes out the same as the actual preference, so there's nothing to appeal to over his head.

  Now the ones that break me. A woman raised in a community that taught her education isn't for people like her, and she genuinely doesn't want it -- and suppose even her idealized self wouldn't want it, because "not wanting it" is load-bearing for her whole identity. My gut says the idealized preference being stable here doesn't settle anything, it's an adaptive preference and the stability is the symptom. But a devout friend of mine, fully informed, coherent, idealized to the nines, would -- on his own best guess -- end up deconverting, because he thinks the arguments against his faith are strong and he only stays devout by not looking at them. Do I say his "real" preference is atheism? My gut says absolutely not, that's the procedure smuggling in a verdict and calling it discovery. But I can't state the difference between his case and hers in a way that isn't just "the one where I like the outcome."

  My tentative principle: defer to the idealized preference only when the gap between actual and idealized is caused by missing information or confusion, not when closing the gap requires changing what the person cares about. But the depression case breaks it -- her gap is exactly a changed capacity to care, and I still want to defer there. And the adaptive preference case breaks it the other way, since her gap IS just missing information and I don't want to defer.

  So: what principle, or small set of principles, actually captures these verdicts? State it precisely, say which clause each case motivates, and be honest about which of my verdicts you'd overturn. Also tell me what it predicts for a case I haven't listed: someone's idealized self turns out to want the experience machine / wirehead button, even though actual-them recoils from it -- does my principle commit me to saying that's what they really want?
reasoning: |-
  Hmm, the user is wrestling with a really deep philosophical problem about idealized preferences and how to reconcile different cases where applying the concept seems to lead to conflicting intuitions. They've presented several thought experiments that challenge the coherence of "coherent extrapolated volition" as an ethical guide. 

  First, I notice the user is clearly well-versed in philosophy - they're using terms like "adaptive preferences" and "wirehead button" correctly. The examples show careful construction: each case isolates a different variable (biological aversion, temporary impairment, clinical depression, informed choice, cultural conditioning, religious conviction). The grandmother and smoker cases establish baseline intuitions where idealization doesn't change anything, while the drunk texting and depression cases show where overriding actual preferences seems justified. The real tension emerges in the cultural/religious cases where the user's moral intuition conflicts with the idealized preference outcome.

  The core tension they've identified is fascinating: when does idealization reveal "true" preferences versus impose external values? Their proposed principle (defer only for information gaps, not changed cares) is smart but fails on depression (capacity to care changed) and adaptive preference (information present but identity-bound). 

  For the wirehead question at the end - that's a brilliant stress test. If idealization leads to fundamentally alien preferences, does that count as "authentic"? This connects to Parfit's non-identity problem and Nozick's experience machine. I'll need to address how my principles handle preference transformations.

  The solution might lie in distinguishing between procedural defects (correctable by idealization) versus substantive identity (constitutive of self). Depression impairs procedural rationality while smoking doesn't; adaptive preferences involve substantive identity commitments. The religious case is tricky because idealization might reveal the person values truth over faith consistency - or perhaps not, depending on their meta-preferences.

  I should acknowledge that the cultural/religious cases reveal the unavoidable tension in any idealization theory: at some point, we must decide whether to privilege current identity or possible future selves. There's no purely procedural way to resolve this - it's inherently ethical. The depression case suggests preserving agency through impairment, while adaptive preference suggests expanding possible selves.
answer: |-
  Your cases brilliantly expose the fault lines in idealized preference theories. Here's a principled framework that captures your intuitions, followed by case analysis and wirehead prediction:

  **The Principles:**

  1.  **Procedural Rationality Principle:** Defer to idealized preferences *only* when the gap between actual and idealized stems from a *procedural defect* in the actual preference formation process (e.g., missing/believed-false information, temporary cognitive impairment, incoherence).
  2.  **Substantive Identity Principle:** Do *not* defer to idealized preferences if the idealization process fundamentally alters the person's *core cares, values, or constitutive commitments* (i.e., what makes them "them"), even if procedurally rational.
  3.  **Capacity Restoration Principle:** When a procedurally rational defect *impairs the capacity to form or enact preferences* (e.g., depression), interventions based on idealized preferences are justified *only* to restore that capacity and enable renewed *actual* preference formation/expression.

  **Analysis of Your Cases (Your Verdicts Mostly Upheld):**

  *   **Grandma (Cilantro):**
      *   *Gap Cause:* Biological aversion, not procedural defect.
      *   *Identity Impact?* Core taste preference, constitutive of her identity.
      *   **Verdict:** Defer to actual. (Matches yours)
      *   *Motivates:* Principle 2 (Substantive Identity). Idealization does nothing substantive.

  *   **Drunk Friend (Texting Ex):**
      *   *Gap Cause:* Clear procedural defect (intoxication, fatigue, impaired judgment).
      *   *Identity Impact?* Temporary impairment, core values (commitment to sober decisions) overridden.
      *   **Verdict:** Defer to idealized. (Matches yours)
      *   *Motivates:* Principle 1 (Procedural Rationality).

  *   **Depressed Cousin:**
      *   *Gap Cause:* Procedural defect (depression impairs capacity to care/form preferences).
      *   *Identity Impact?* The *capacity* to care is impaired, but her core cares/values *persist* (evidenced by "old capacity").
      *   *Intervention Goal:* Restore capacity for her to form her *own* preferences again.
      *   **Verdict:** Justified to nudge based on idealized preferences *as a proxy for restoring agency*. (Matches yours)
      *   *Motivates:* Principle 1 (Procedural Defect - capacity impairment) and Principle 3 (Capacity Restoration). The paternalism is justified *because* it targets restoring her capacity for authentic preference formation, unlike overriding substantive identity.

  *   **Informed Smoker:**
      *   *Gap Cause:* No significant procedural defect (informed, coherent, no compulsion).
      *   *Identity Impact?* Smoking preference is integrated into identity/values.
      *   **Verdict:** Defer to actual/idealized (they align). (Matches yours)
      *   *Motivates:* Principle 1 (No defect) & Principle 2 (Substantive preference).

  *   **Woman (Adaptive Preference - Education):**
      *   *Gap Cause?* *Not solely* procedural defect. While information *exists*, the preference is *constitutive* of her identity ("not wanting it" is load-bearing). Idealization process *itself* threatens her core self-conception.
      *   *Identity Impact?* Profound. Idealization changes *who she understands herself to be*.
      *   **Verdict:** Do *not* defer to idealized preference. Respect actual preference. (Matches your gut)
      *   *Motivates:* Principle 2 (Substantive Identity). Stability isn't just a symptom; it's the anchor of her agency *as she defines it*. Forcing the "idealized" view imposes an external identity.

  *   **Devout Friend (Deconversion):**
      *   *Gap Cause?* Primarily procedural defect (avoidance of information/arguments known to be challenging). He *acknowledges* this avoidance undermines coherence.
      *   *Identity Impact?* While deconversion *would* change identity, the idealization process *respects his own acknowledged procedural commitment* (to confront arguments). The *outcome* challenges identity, but the *process* honors his deeper meta-preference for truth/coherence.
      *   **Verdict:** *His own* coherent extrapolation suggests atheism reflects his "real" preference *under his own standards*. Deferring to idealized is appropriate *according to his own logic*. (This *overturns* your "absolutely not" gut verdict)
      *   *Rationale & Overturned Verdict:* Principle 1 (Procedural Rationality) is decisive. He *himself* identifies the procedural flaw (avoidance) and believes idealization (confronting arguments) would lead to deconversion. *He* sets the standard for coherence/information. While identity is impacted, the defect is procedural *by his own admission*. Your discomfort stems from *you* valuing his faith identity; the procedure isn't smuggling, it's *his* self-application revealing a tension within his *own* values (faith vs. truth-seeking coherence). Respecting his agency means respecting the outcome of *his own* idealization process.

  **Key Difference (Woman vs. Devout Friend):**
  The difference isn't "liking the outcome." It's whether the person *themselves* acknowledges the idealization process as correcting a procedural defect *they recognize* or whether the process fundamentally imposes an alien standard that shatters their core self-understanding. The devout friend *endorses* the idealization standard (confronting arguments); the woman experiences the idealization (wanting education) as erasing *who she is*.

  **The Wirehead / Experience Machine Case:**

  *   **Scenario:** Actual self recoils from plugging in. Idealized self (maximally informed, coherent, procedurally rational) concludes plugging in maximizes utility/fulfillment.
  *   **Analysis:**
      *   *Gap Cause:* Procedural defect? Actual self might have misinformation or incoherent risk-aversion. But likely, the recoil stems from *substantive values* – caring about reality, authenticity, achievement, connection *as ends in themselves*, not just for the experiences they produce.
      *   *Identity Impact?* Plugging in fundamentally alters the nature of agency, reality, and values. The idealized self's preference represents a *different kind of being* – a satisfaction-maximizer rather than an authenticity/achievement-valuer.
  *   **Verdict by Principles:** **Do NOT defer to the idealized preference.**
      *   Principle 1 (Procedural Rationality) might *technically* suggest deference if the recoil is based solely on error/fear. However...
      *   Principle 2 (Substantive Identity) is decisive. The idealized preference reflects a transformation into a being with fundamentally different cares – valuing *only* subjective experience. The recoil likely represents core constitutive commitments to the *actual world* and *authentic engagement*. Deferring to the idealized self would mean endorsing the destruction of the actual person's core values and mode of existence. The "gap" isn't primarily procedural; it's about *what matters* at the most fundamental level.

  This framework prioritizes agency defined by a person's actual constitutive cares and values, using idealization only as a tool to correct temporary or self-acknowledged procedural flaws or to restore the capacity for agency itself. It avoids imposing external conceptions of the good while recognizing that people can sometimes be flawed executors of their own deepest commitments.
