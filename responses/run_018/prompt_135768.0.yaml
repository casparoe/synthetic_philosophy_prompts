answer: |-
  **Joint Statement on Foundational Principles for Aligned Artificial Intelligence**

  We, the undersigned representatives of the Aggregative Constitutionalist (AC) and Structural Neutralist (SN) perspectives, affirm our shared commitment to developing artificial intelligence that respects human autonomy and diversity while mitigating existential risks. We agree that AI alignment presents profound challenges arising from deep value pluralism among humans, the potential for AI to prematurely lock in specific value sets, stifling moral progress, and the critical distinction between first-order preferences and the meta-level rules governing how preferences are formed, revised, and contested. This shared framing necessitates rigorous adversarial collaboration to clarify both our agreements and persistent disagreements.

  **Section 1: Agreed Claims**

  1.  **Value Pluralism & Complexity:** Human values are diverse, often conflicting, context-dependent, and subject to change over time and through deliberation. No single, monolithic "human value" exists for AI to serve naively.
  2.  **Risk of Premature Lock-in:** A significant danger exists that an aligned AI system, if poorly designed, could entrench a specific set of values or decision-procedures, foreclosing future moral evolution, democratic contestation, or adaptation to unforeseen circumstances ("value lock-in").
  3.  **First-Order vs. Meta-Level Distinction:** A crucial distinction exists between:
      *   *First-order preferences:* Specific desires, goals, or value judgments held by individuals or groups at a given time (e.g., "build this highway," "prioritize economic growth over conservation").
      *   *Meta-level rules:* The procedures, institutions, and constraints governing how first-order preferences are formed, aggregated (if at all), revised, and contested (e.g., democratic voting rules, constitutional rights, fair deliberation procedures).
  4.  **Dynamic Updating Necessity:** Any alignment framework must incorporate mechanisms to adapt to changes in human knowledge, circumstances, and expressed preferences over time. Static systems are inherently misaligned.
  5.  **What Each Perspective Establishes:**
      *   *AC Establishes:* That large-scale coordination problems and complex trade-offs (e.g., global resource allocation, pandemic response) often require *some* form of aggregation to produce coherent, actionable directives for AI systems. Ignoring the intensity or epistemic standing of preferences can lead to paralysis or outcomes that neglect significant human suffering or insight.
      *   *SN Establishes:* That any aggregation function imposed by an AI, however sophisticated, risks substituting algorithmic judgment for ongoing human moral and political agency. Preserving spaces for undominated deliberation is fundamental to respecting human autonomy and enabling moral progress.
  6.  **Misplaced Objections:**
      *   *Against AC:* It is incorrect to claim that AC necessarily advocates for crude utilitarianism, ignores minority rights (as these can be formalized within the welfare function), or seeks a static aggregation. AC explicitly incorporates dynamic updating and epistemic weighting.
      *   *Against SN:* It is incorrect to claim that SN provides no guidance for AI action, inevitably leading to paralysis. SN mandates specific procedural constraints (fairness, non-domination) that actively shape institutional design and AI behavior. SN does not preclude AI from summarizing existing human decisions or preferences within established rules.

  **Section 2: Disagreements Table**

  | Disagreement Area | Aggregative Constitutionalist (AC) Formulation                                                                 | Structural Neutralist (SN) Formulation                                                                                                                              | Nature of Disagreement                                                                                             |
  | :---------------- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------ |
  | **Core AI Function** | An aligned AI must compute and implement actions that maximize the dynamically updated, epistemically weighted aggregate welfare function derived from human preferences. | An aligned AI must enforce constraints ensuring procedural fairness and non-domination, safeguarding the institutional space for humans to form, revise, contest, and aggregate preferences themselves. | **Substantive.** Fundamental disagreement on the proper role of the AI: optimizer vs. guardian of process.          |
  | **"Alignment" Definition** | "Alignment" properly denotes an AI's service to the aggregated preferences of humans, dynamically updated.                                                               | "Alignment" properly denotes an AI's service to the meta-level conditions necessary for autonomous human value formation and contestation, not any specific aggregation of values. | **Primarily Verbal/Semantic.** Reflects the deeper substantive disagreement about the AI's role, but centers on the term's core referent. |
  | **Handling Preference Formation** | The AI's welfare function should incorporate weights reflecting the epistemic quality of preference formation processes, dynamically adjusting as processes improve. | The AI must remain strictly neutral regarding the substance of preferences formed within fair, non-dominating procedures; evaluating the "epistemic quality" of preferences inherently violates neutrality. | **Substantive.** Disagreement on whether AI can/should judge *how* preferences are formed beyond enforcing basic fairness. |
  | **Goal of System Design** | The ultimate goal is an AI that reliably identifies and executes the "best" course of action as defined by the aggregated welfare state. | The ultimate goal is an AI that reliably preserves the possibility for humans to define and pursue the "best" course of action through ongoing, uncoerced deliberation and choice. | **Substantive.** Disagreement on whether the "best" action is discoverable algorithmically or is an emergent property of protected human processes. |

  **Section 3: Cruxes and Testable Predictions/Evaluations**

  We identify the following unresolved questions (cruxes) as pivotal. For each, we state a concrete case or argument both sides agree bears upon it and record each side's explicit stance.

  1.  **Crux (a): Non-Circular Justification for Interpersonal Weighting**
      *   **Case:** Designing the initial global aggregation weights for an AI managing pandemic resource allocation (vaccines, ventilators) across diverse cultures with conflicting values and varying levels of trust in institutions.
      *   **AC Prediction/Evaluation:** A non-circular (though contestable) standard exists, grounded in empirically measurable factors like expertise, vulnerability, and contribution to social cooperation, informed by cross-cultural ethical reasoning and democratic input on the weighting *framework*. The AI *should* apply such weights initially, subject to dynamic updating.
      *   **SN Prediction/Evaluation:** Any proposed standard for interpersonal weighting inevitably presupposes a specific (often liberal-individualist) conception of value and personhood, failing to be truly neutral among comprehensive doctrines. The AI *should not* apply such weights; fair procedures for allocation (e.g., lottery among qualified candidates, decentralized decision-making within constraints) must be designed without presupposing an aggregation rule.

  2.  **Crux (b): Procedural Neutrality as a Substantive Value**
      *   **Case:** An AI tasked with moderating a global platform for debating societal values, where one group advocates for a comprehensive doctrine prioritizing strict hierarchical authority, while another advocates for radical egalitarianism. Both demand the platform reflect their substantive view of "fairness."
      *   **SN Prediction/Evaluation:** Enforcing procedural neutrality (equal speaking time, rules against coercion, fact-checking only verifiable claims) is a meta-level constraint, not a substantive value favoring liberalism. It allows *both* doctrines to participate without the AI endorsing either's substance. Neutrality is the minimal framework enabling pluralism.
      *   **AC Prediction/Evaluation:** The SN framework *does* embody a substantive liberal value (e.g., individualism, egalitarian discourse norms, rejection of inherent authority) that systematically disadvantages comprehensive doctrines incompatible with these presuppositions. The "neutral" rules inherently favor doctrines comfortable with open contestation and reject those based on revealed truth or natural hierarchy. This is a substantive bias.

  3.  **Crux (c): Value Drift, Lock-in, and Future Autonomy**
      *   **Case:** A globally deployed, long-term AI climate mediation system making decisions (e.g., geoengineering deployment, drastic emission cuts) involving significant intergenerational trade-offs. Present generations heavily discount the future, while potentially radical shifts in values favoring ecological preservation or future personhood might emerge.
      *   **AC Prediction/Evaluation:** The AI *should* apply the best available current aggregation weights, incorporating a defined intertemporal discount rate based on current preferences and expert risk assessment. Locking in the *method* (dynamic aggregation) is not locking in specific *values*; future preferences will update the weights within the framework. Resisting future preference shifts based on speculative "better" values violates alignment to actual human preferences. Outsourcing complex intertemporal aggregation to a reliable AI is justified.
      *   **SN Prediction/Evaluation:** The AI *must* prioritize preserving institutional veto points and revision mechanisms accessible to future generations, even if this means forgoing "optimal" present solutions according to current weights/discounting. Locking in *any* specific aggregation method (especially with discounting) pre-empts the autonomy of future people to define their own values and decision frameworks. It is a profound form of unjust moral outsourcing. The AI should be passive *toward the substance* of future values but active *in preserving the space* for them to form and govern.
