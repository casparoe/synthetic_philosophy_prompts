answer: |-
  ## Opening Remarks: The Replicator's Dilemma

  **(Clock starts: 10:00 remaining)**

  Good morning. Welcome to what I suspect will be a necessarily uncomfortable conversation. We’re here to grapple with the replication crisis – a phrase that risks becoming background noise, a statistic about statistics. But let’s begin not with scandal, nor sloppiness, nor even the well-documented pressures of academia, but with a foundational principle of inference itself, articulated with characteristic clarity by R.A. Fisher nearly a century ago in *The Design of Experiments*:

  > **"No isolated experiment, however significant in itself, can suffice for the experimental demonstration of any natural phenomenon; for the ‘one chance in a thousand’ will undoubtedly occur, with no less and no more than its appropriate frequency, however surprised we may be that it should occur to *us*."**

  Fisher’s point is not a footnote; it’s the bedrock. It is a *structural constraint* on scientific knowledge, imposed by the very nature of randomness and the logic of drawing conclusions from limited data. It states bluntly: **A single "striking" result, no matter how improbable under the null hypothesis, *cannot*, by itself, establish a phenomenon.** Why? Because improbable events *do happen*. At a 5% significance level, we *expect* one in twenty experiments testing *nothing real* to give us a "statistically significant" result. Fisher’s genius was recognizing that significance is meaningless without the context of potential repetition. It’s a verdict on the *procedure*, not a standalone proof of the *phenomenon*.

  **(8:00 remaining)**

  This is where the crisis bites. We built an edifice on the allure of the isolated, striking finding. Journals craved novelty – the "one chance in a thousand" result *looked* like discovery, felt like breakthrough. Researchers, incentivized for splash, presented single studies as definitive proof. And why wouldn’t they? The p-value was "significant"! But Fisher’s constraint tells us this was always an illusion. The replication crisis isn't *just* about fraud (though it exists) or sloppiness (though it’s rampant). **It is, fundamentally, a crisis of *inference*.** We mistook the *signal of rarity within one experiment* for the *signal of a genuine effect across reality*. We forgot that the "proper frequency" of false positives demands replication as a *logical necessity*, not just a best practice.

  **(6:00 remaining)**

  So, where does this leave our statistical tribes?

  *   **Frequentists:** Fisher’s ghost haunts you. The p-value was never meant to be a final arbiter in isolation. Its meaning is intrinsically tied to the long-run operating characteristics of a procedure *under repetition*. The crisis exposes the catastrophic cost of divorcing the p-value from this context. The question isn't whether p-values are "invalid," but whether your *interpretation and use* of them faithfully incorporates Fisher's constraint: that significance is a starting pistol for replication, not a finish line. Are your models and methods robust enough to survive the "proper frequency" test when others try to run them?
  *   **Bayesians:** Don't relax yet. Your priors aren't magic armor. The crisis reveals how easily priors can become self-fulfilling prophecies or be swayed by the very same "striking" results Fisher warned about. If your posterior probability shifts dramatically on a single study, how well-calibrated was your prior to the *actual* base rate of true effects? Does your framework adequately account for the "proper frequency" of misleading results *even when updating rationally*? Replication failures often expose failures in the *community's* prior beliefs as much as in the original experiment.

  **(4:00 remaining)**

  **To our psychologist colleagues:** You’ve lived this. You’ve seen cherished findings, published in top journals with gleaming p-values, evaporate. It’s demoralizing, career-disrupting. But Fisher’s constraint helps explain *why* it wasn't necessarily fraud or your incompetence. That initial, exciting, significant result *could* have been the "one chance in a thousand" happening precisely on schedule. The system failed you by pretending that single study was enough. It demanded the striking result while structurally undermining the replication required to validate it. Your pain is the human cost of ignoring a fundamental principle of evidence.

  **To our journalist colleagues:** This is why simplistic narratives of "fraud" or "sloppy scientists" miss the core inferential problem. Fraud *exacerbates* the crisis, but the crisis *exists* because the inherent logic of drawing conclusions from noisy data was systematically misunderstood and misapplied. Reporting a single, significant study as a "discovery" is often reporting noise as signal. Fisher’s constraint demands skepticism not born of cynicism, but of statistical necessity. Your challenge is to communicate this nuance – that replication isn’t just checking homework, it’s the *essence* of verification.

  **(2:00 remaining)**

  So, where does this workshop go? Fisher’s constraint doesn't offer easy solutions; it defines the hard problem. **Replication isn't simple verification; it's navigating the inferential abyss Fisher described.** How do we:

  1.  **Design for the "Proper Frequency"?** How do experiments need to change *from the start* to make replication less an afterthought and more an integrated part of demonstrating a phenomenon? (Pre-registration, Registered Reports, power beyond p<.05?)
  2.  **Quantify the "One Chance"?** Beyond p-values and BF10, what inferential tools genuinely help us anticipate and account for the frequency of misleading results across a research landscape? (False discovery rates, prediction markets, meta-analytic thinking from day one?)
  3.  **Resource the Repetition?** How do we build incentive structures and allocate resources (time, money, prestige) commensurate with the *logical necessity* of replication, knowing that most "striking" initial results will be Fisher’s "one chance" mirage?
  4.  **Synthesize Across Attempts?** How do we rigorously combine evidence from multiple studies, successful and failed replications, acknowledging heterogeneity and the ever-present background frequency of false positives?

  **(0:30 remaining)**

  Fisher’s constraint is unforgiving. It tells us scientific truth is stubbornly resistant to single demonstrations. The replication crisis is the collective hangover from ignoring this sobering reality. Our task this week isn’t to assign blame or declare winners, but to confront the inferential hard graft Fisher laid bare: **How do we build knowledge in a universe where the "one chance in a thousand" is guaranteed to happen, and the genuine phenomenon requires us to distinguish it, reliably, from that inevitable noise?**

  Let’s get to work.

  **(Clock ends: 0:00 remaining)**
