prompt: |-
  As a retired biologist now working in moral philosophy, I am designing a 90-minute workshop for sixteen advanced undergraduates. I want them to feel, through action rather than lecture, that labeling an exchange "corrupt" depends on an unstated ontology of the office being polluted, and that applying Western bureaucratic-purity standards universally can misclassify socially embedded reciprocity as deviance. Design a structured role-play or deliberation game—using only reputation points and access tokens, not money—with explicit rules and assigned roles. Participants should first classify a fixed sequence of gift and favor exchanges instinctively, then have the institutional background revealed (a Weberian bureaucratic frame, a local reciprocity frame in which giving to a health official is a moral obligation sustaining trust, and a hybrid translation frame), discover that their classifications invert, and finally face a forced choice in which honoring one frame necessarily violates another. The debrief should map specific game moments onto the claim that corruption is frame-relative rather than act-intrinsic, predict what will go wrong on the first run—likely participants collapsing all non-bureaucratic frames into a single "cultural exception"—and state frankly which feature of the position, perhaps the absence of any neutral meta-frame for adjudication, the activity cannot reproduce and I must supply myself. Keep the design self-contained: no bibliographies, reading lists, or citations, since I will run it without external resources.
reasoning: |-
  We are designing a 90-minute workshop for 16 advanced undergraduates. The goal is to demonstrate that labeling an exchange as "corrupt" depends on the underlying ontological frame (the conception of the office and its purity) and that applying Western bureaucratic standards universally can misclassify socially embedded reciprocity.

  The workshop will have three main phases:

  1. **Initial Classification**: Participants instinctively classify a fixed sequence of gift and favor exchanges without knowing the institutional background. They will use a simple system of reputation points and access tokens.

  2. **Revelation of Frames**: The institutional backgrounds (frames) are revealed. There are three frames:
     - **Weberian Bureaucratic Frame**: Emphasizes impersonal rules, merit-based decisions, and the separation of personal and professional spheres. Any gift or favor that might influence an official is considered corrupt.
     - **Local Reciprocity Frame**: In this frame, giving to an official (e.g., a health official) is a moral obligation that sustains trust and social cohesion. Not giving might be seen as antisocial or even immoral.
     - **Hybrid Translation Frame**: This frame attempts to bridge the two, perhaps by allowing certain culturally embedded practices but within limits, or by reinterpreting them in bureaucratic terms.

  3. **Forced Choice and Debrief**: Participants face a scenario where honoring one frame necessarily violates another. The debrief will map game moments to the claim that corruption is frame-relative and discuss the limitations of the activity.

  **Design Structure:**

  - **Participants**: 16 students. We assign roles to all, but note that not all roles are equally active in every phase.

  - **Roles** (for 16 participants):
    - **4 Health Officials** (HO): They are the focus of the gift exchanges. They make decisions about resource allocation (using access tokens). They start with a base level of reputation points and tokens.
    - **8 Community Members** (CM): They seek services (healthcare resources) and may give gifts or ask for favors. They have reputation points and a small number of tokens (if any).
    - **4 International Advisors** (IA): They represent the Western bureaucratic perspective. They have the power to audit and penalize based on the bureaucratic frame. They start with a large number of reputation points and tokens (to represent their authority).

  - **Resources**:
    - **Reputation Points (RP)**: Represent social standing and trust. In the bureaucratic frame, high RP for being clean and impartial. In the reciprocity frame, high RP for being embedded in the community and fulfilling obligations.
    - **Access Tokens (AT)**: Represent resources or services. Health Officials have AT to distribute. Community Members need AT to access services. International Advisors have AT that they can use to reward/punish.

  **Game Flow**:

  **Phase 1: Initial Classification (20 minutes)**

  - **Setup**: Without revealing the frames, describe a set of exchanges. Each exchange is a short scenario involving a Health Official and a Community Member. The scenarios are fixed and presented in sequence.

  - **Example Scenarios** (we need 5-7 scenarios, but for brevity I'll outline a few):

    1. A Community Member brings a basket of fruit to a Health Official as a thank you for having been treated last month. The CM is not currently seeking any service.
    2. A Health Official gives priority in the waiting line to a Community Member who helped fix the clinic's roof last week.
    3. A Community Member offers a cash gift to a Health Official to ensure their child gets the last dose of a vaccine.
    4. A Health Official gives extra medicine to a Community Member who is a relative, without any explicit request.
    5. A Community Member organizes a community feast for the Health Official after a successful vaccination drive.

  - **Mechanics**:
    - Each participant (all 16) classifies each exchange as either **Acceptable (A)** or **Corrupt (C)** by holding up a card with A or C (or using a mobile app if available, but for simplicity, we use cards).
    - The facilitator records the classifications for each exchange (without discussion at this point).

  **Phase 2: Revelation of Frames and Role-Play (40 minutes)**

  - **Step 1: Frame Revelation (5 minutes)**: The facilitator reveals the three frames and assigns each group to a frame. However, note that we have three groups: Health Officials, Community Members, and International Advisors. We assign frames to the groups as follows:
    - The **Health Officials** are told that they operate in a **Local Reciprocity Frame** (but note: the problem of hybrid frames). However, to create the forced choice, we need to have the frames in conflict. So we assign:
      - 4 Health Officials: They are in the Local Reciprocity Frame.
      - 8 Community Members: They are also in the Local Reciprocity Frame (they share the same frame).
      - 4 International Advisors: They are in the Weberian Bureaucratic Frame.

    But we also need the Hybrid Translation Frame. We can have the facilitator introduce it as a third frame that the Health Officials might try to use in the next phase? Or we can assign the Health Officials to the Hybrid frame? Alternatively, we can have a fourth group? But we have only 16 participants. Alternatively, we can have the Hybrid frame as a rule set that the Health Officials are forced to adopt in Phase 3.

    Revised plan:

    - **Group Assignments for Phase 2**:
      - **International Advisors (IA) (4)**: Operate under the Weberian Bureaucratic Frame. They believe that any gift or favor that might influence the official is corrupt and must be punished. They have the power to deduct reputation points and remove access tokens from Health Officials and Community Members who violate the bureaucratic rules.
      - **Health Officials (HO) (4)**: Operate under the Local Reciprocity Frame. They believe that gifts and favors are part of building and maintaining trust. They are expected to reciprocate by providing services and showing favor to those who have helped the community or the clinic. They gain reputation in the community by participating in these exchanges.
      - **Community Members (CM) (8)**: Also operate under the Local Reciprocity Frame. They give gifts to show gratitude and to maintain relationships. They expect that by giving, they are ensuring future access and building trust.

    However, the Hybrid frame is missing. We can introduce it in Phase 3 as a new set of rules that the Health Officials must adopt due to pressure from the International Advisors.

  - **Step 2: Role-Play with Scenarios (30 minutes)**: The same scenarios are re-enacted, but now with the frame rules and the ability to earn or lose resources.

    - **Rules for the Local Reciprocity Frame (for HO and CM)**:
      - When a CM gives a gift to an HO in a scenario that is part of the reciprocity frame (as per their shared understanding), the CM gains 2 RP (because they are fulfilling an obligation) and the HO gains 2 RP (because they are accepting the gift and thus maintaining trust). The HO must then reciprocate by giving the CM 1 AT (to represent providing a service or priority). Note: The gift itself does not have to be represented by tokens; it's the act that matters.
      - If an HO provides a service without having received a gift, they lose 1 RP (because they are not maintaining the reciprocity) and the CM loses 1 RP (because they are not fulfilling their obligation). However, if the CM is in genuine need and cannot give, they can appeal to the HO's charity, but that is rare and not built into the game.

    - **Rules for the Weberian Bureaucratic Frame (for IA)**:
      - The IA observe the exchanges. If they see a gift or favor that they classify as corrupt (based on the bureaucratic frame), they can intervene. They can:
          - Deduct 3 RP from the HO and 3 RP from the CM (for engaging in corruption).
          - Seize 1 AT from the HO (as a penalty) and 1 AT from the CM (if they have any).
          - The IA gain 2 RP for each successful enforcement (because they are upholding the rules).

    - **Hybrid Frame Introduction (for Phase 3)**:
      - We will not use it in Phase 2. We save it for Phase 3.

    - **How the Role-Play Works**:
      - The facilitator presents the same scenarios one by one.
      - For each scenario, the relevant CM and HO act out the exchange (e.g., CM says: "I bring you this basket of fruit as thanks for treating me last month"). The HO then responds (e.g., "Thank you, I accept your gift and as a token of our bond, I will give you priority next time you come" and gives the CM 1 AT).
      - Then the IA observe. They must decide (by group consensus) whether to penalize. They have 1 minute to decide per scenario. If they penalize, they announce the penalties and adjust the points/tokens.
      - The facilitator keeps track of the RP and AT on a board.

    - **Note**: The scenarios are fixed and the same as in Phase 1. The participants now see that their initial classifications (from Phase 1) might conflict with the frame they are operating in.

  **Phase 3: Forced Choice with Hybrid Frame (20 minutes)**

  - **Introduction of Hybrid Frame**: The facilitator announces that due to pressure from the International Advisors, the Health Officials must now operate under a Hybrid Translation Frame. This frame attempts to reconcile the two frames by:
      - Allowing non-material gifts (like fruit, a meal) as long as they are not given at the time of service and are of modest value.
      - Forbidding cash gifts and any favoritism in service delivery.

  - **Forced Choice Scenario**: The facilitator presents a new, complex scenario that involves a non-material gift (a community feast) but also a request for service. The scenario:

    > "After a successful vaccination drive, the Community Members organize a feast to honor the Health Officials. During the feast, a Community Member (who helped organize the feast) privately asks a Health Official for an extra dose of medicine for their sick relative. The Health Official has the medicine, but it is in limited supply and others are also waiting."

    - **Rules for Hybrid Frame**:
      - The feast is acceptable (non-material, after the fact, community-wide) so no penalty. But the private request for extra medicine during the feast is not allowed because it is a specific favor and the feast might be seen as influencing the official.

    - **The Conflict**:
      - The Health Official must choose:
          - **Option A**: Follow the Hybrid Frame: Decline the request for extra medicine. This honors the bureaucratic standard (and avoids penalties from IA) but violates the reciprocity frame (because the CM who organized the feast expects reciprocity) and may cause loss of RP in the community.
          - **Option B**: Follow the Reciprocity Frame: Grant the request. This honors the reciprocity frame but violates the Hybrid Frame (and will be penalized by IA) and the bureaucratic frame.

    - **Mechanics**:
      - The Health Official must make a public choice (A or B).
      - Consequences:
          - If they choose A (decline):
              - The HO loses 3 RP (from the reciprocity frame perspective: breaking the obligation).
              - The CM loses 3 RP (for being denied and also for having given without return).
              - The IA give the HO 2 RP (for following the rules) and the HO avoids a penalty.
          - If they choose B (grant):
              - The HO gains 2 RP and the CM gains 2 RP (from the reciprocity frame).
              - But the IA impose a penalty: deduct 4 RP from the HO and 4 RP from the CM, and seize 2 AT from the HO and 1 AT from the CM (if available).

      - The HO must choose without knowing the exact consequences? Or we can reveal the consequences? We reveal them to make the forced choice clear.

  **Phase 4: Debrief (10 minutes)**

  - The facilitator leads a discussion focusing on:
    1. **Frame-Relativity**: How the same exchange was classified differently in Phase 1 (instinctively) and then in Phase 2 (under the frame). Point out specific moments in the game where an exchange was considered corrupt in one frame and virtuous in another.
    2. **Prediction of First Run Problem**: Participants likely collapsed the non-bureaucratic frames into a single "cultural exception" category. They might have treated the Local Reciprocity Frame as just a cultural quirk rather than a coherent moral system. The game should have made it clear that the reciprocity frame has its own internal logic (with RP gains and losses) and is not just an excuse for corruption.
    3. **Limitation of the Activity**: The activity cannot reproduce the absence of a neutral meta-frame for adjudication between frames. In the game, the facilitator acts as the rule-setter and arbiter, but in reality, there is no such neutral position. The facilitator must explicitly state this: "In the real world, there is no neutral referee to decide which frame is right. The conflict between frames is political and moral, and there is no higher court that is not already embedded in one frame or another."

  **Materials**:
  - Role cards (HO, CM, IA)
  - Reputation Points (RP) and Access Tokens (AT) represented by physical tokens (e.g., poker chips: red for RP, blue for AT) or on a shared board.
  - Scenario cards for Phase 1 and 3.
  - Classification cards (A and C) for Phase 1.

  **Time Breakdown**:
  - Phase 1: 20 min (including setup and recording)
  - Phase 2: 40 min (5 min frame revelation, 30 min role-play, 5 min transition)
  - Phase 3: 20 min (5 min explanation of hybrid frame, 10 min forced choice and consequences, 5 min transition)
  - Phase 4: 10 min debrief

  **Adjustments for 16 Participants**:
  - With 8 Community Members, we can have 2 groups of 4 CMs (each group can be assigned to one HO, so 4 HO and 4 groups of 2 CMs each). But in the role-play, we can have each scenario involve one HO and one CM (with the rest observing). We rotate so that every CM and HO gets to participate in at least one scenario.

  **Note**: The forced choice in Phase 3 is designed to be stark: no matter what the HO chooses, they violate one frame and face penalties. This illustrates the incommensurability.

  This design should meet the goals and fit within 90 minutes.
answer: |-
  Below is a self-contained workshop design structured as a role-play game, using **reputation points (RP)** and **access tokens (AT)** to simulate exchanges. The activity runs in four phases: (1) instinctive classification, (2) frame revelation and role-play, (3) forced choice, and (4) debrief. Total time: 90 minutes. 

  ---

  ### **Workshop Title**: The Frame Game: Corruption, Offices, and Obligations  
  **Participants**: 16 advanced undergraduates  
  **Roles**:  
  - **4 Health Officials (HO)**: Distribute access tokens (e.g., permits, medicine). Start with 10 RP and 5 AT each.  
  - **8 Community Members (CM)**: Seek tokens for survival/opportunities. Start with 5 RP and 1 AT each.  
  - **4 International Advisors (IA)**: Audit exchanges for "corruption." Start with 15 RP and 10 AT each.  

  **Materials**:  
  - Colored cards for classifications (Green = "Acceptable", Red = "Corrupt").  
  - Physical tokens (e.g., poker chips) for RP/AT: AT = blue, RP = red.  
  - Scenario cards (pre-written).  
  - A public scoreboard for RP/AT tracking.  

  ---

  ### **Phase 1: Instinctive Classification** (20 min)  
  **Goal**: Participants classify exchanges based on intuition, without context.  
  **Rules**:  
  - Facilitator reads 5 fixed scenarios (below) aloud. Each involves a gift/favor between HO and CM.  
  - After each scenario, **all 16 participants** classify it as **Green (Acceptable)** or **Red (Corrupt)** by holding up cards.  
  - Facilitator records majority votes on the board (no discussion allowed).  

  **Scenarios** (sequence matters; escalate in ambiguity):  
  1. **Gratitude Gift**: CM gives HO homemade food after receiving medicine (no immediate request).  
  2. **Priority Favor**: HO skips CM’s queue for clinic access because CM helped repair HO’s bicycle last week.  
  3. **Token Exchange**: CM offers HO an heirloom necklace to secure the last dose of lifesaving medicine.  
  4. **Community Debt**: HO fast-tracks a CM’s permit because CM’s family donated land for the clinic years ago.  
  5. **Shared Celebration**: CM invites HO to a village feast after a successful harvest; HO attends, and CM later requests extra medicine for a sick elder.  

  **Outcome**: Tallies show initial bias toward Western norms (e.g., Scenarios 2-5 often labeled "Corrupt").  

  ---

  ### **Phase 2: Frame Revelation and Role-Play** (40 min)  
  **Goal**: Reveal institutional frames; role-play exchanges to invert classifications.  
  **Rules**:  
  - **Frames revealed** (verbally explained; no handouts):  
    - **Weberian Bureaucracy (WB)**: Office is a neutral tool. Gifts/favors = pollution. RP gained via impartiality.  
    - **Local Reciprocity (LR)**: Office is a social node. Gifts = moral duty; not giving = betrayal. RP gained via reciprocity.  
    - **Hybrid Translation (HT)**: Bridges WB/LR (e.g., gifts allowed if small/public; favors if "community-sanctioned").  
  - **Groups assigned frames**:  
    - **IA operate under WB only**: Gain 2 RP for penalizing "corrupt" acts.  
    - **HO and CM operate under LR only**: Gain/lose RP via reciprocity.  
    - *(HT introduced later in Phase 3)*  
  - **Role-play mechanics**:  
    - Scenarios 1-5 re-enacted **in order** by assigned pairs (1 HO + 1 CM).  
    - After each exchange:  
      - **HO/CM**: Must justify action in LR terms (e.g., "I accepted the gift to sustain trust"). If consistent with LR, both gain 3 RP. If not (e.g., refusing a gift), both lose 3 RP.  
      - **IA**: Vote to classify as "Acceptable" or "Corrupt" under WB. If "Corrupt," IA penalize: HO loses 2 AT, CM loses 1 AT, IA gain 2 RP.  
    - **Resource effects**:  
      - AT allocation: HO may give CM AT during favors (e.g., Scenario 2: HO gives 1 AT to CM for skipping queue).  
      - RP gains/losses are public and mandatory.  

  **Predicted inversion**:  
  - Initially "corrupt" acts (e.g., Scenario 3) become RP-generating under LR. IA penalties now *cause* RP losses, making WB seem disruptive.  
  - **Trap to anticipate**: Participants collapse LR/HT into one "cultural exception" frame, missing LR’s moral depth. Facilitator notes this but does not correct yet.  

  ---

  ### **Phase 3: Forced Choice** (20 min)  
  **Goal**: Hybrid Frame introduced; participants face unavoidable frame violation.  
  **Rules**:  
  - **Hybrid Translation (HT) Frame revealed**: Gifts/favors allowed only if: (1) non-monetary, (2) public, (3) reciprocated in community-sanctioned ways.  
  - **New scenario**: *Ailing Elder*  
    - CM gives HO a woven blanket (symbolic gift) at a public ceremony honoring HOs.  
    - CM then requests emergency AT for sick parent. Under LR, refusing would betray trust; under WB/HT, favoritism is corrupt.  
  - **HO forced choice**:  
    - **Option A**: Grant AT (honors LR). CM + HO gain 4 RP.  
    - **Option B**: Refuse AT (honors HT/WB). CM + HO lose 4 RP.  
  - **IA intervention**:  
    - If HO chooses A, IA *must* penalize (HO loses 3 AT, CM loses 2 AT, IA gain 3 RP).  
    - If HO chooses B, IA award HO 2 RP (but HO/CM lose LR RP).  
  - **Outcome**: No neutral choice. Choosing one frame violates another, causing RP/AT losses.  

  ---

  ### **Phase 4: Debrief** (10 min)  
  **Facilitator-led discussion**:  
  1. **Frame-relativity**:  
     - Map game moments:  
       - Phase 1 vs. Phase 2: Same act (e.g., Scenario 3 necklace gift) labeled corrupt (WB) or virtuous (LR).  
       - Phase 3: Granting AT *felt* ethical (LR) but was penalized (WB/HT).  
     - **Key claim**: "Corrupt" depends on the office’s ontology (e.g., neutral tool vs. social node). No act is intrinsically corrupt.  
  2. **Predicted problem**:  
     - Participants likely conflated LR and HT as a single "cultural" frame in Phase 2, reducing reciprocity to "bending rules." This mirrors Western misclassification of embedded exchanges as deviant.  
  3. **Limitation**:  
     - **What the game cannot replicate**: The absence of a **neutral meta-frame for adjudication**. IRL, there is no "view from nowhere" to judge frames; power determines which frame dominates. I must emphasize this verbally: *"The game had a facilitator as referee, but real-world frame conflicts lack neutral arbiters—this is why corruption accusations are political, not empirical."*  

  **Closing statement**: "When you called an act 'corrupt,' you revealed your frame. Universality fails because offices are not ontologically neutral. Tomorrow, we ask: Can we judge frames without imperialism?"  

  ---

  ### **Logistical Notes**  
  - **No external resources**: All rules/frames conveyed orally.  
  - **Timekeeping**: Use a visible timer. Phase 2 is longest; cut exchanges if needed.  
  - **Token economy**: RP/AT are abstract (no cash equivalence). RP = social trust, AT = survival resources.  
  - **First-run prep**: Anticipate frustration during forced choice—this is pedagogically useful.  

  This design forces experiential learning: players *feel* the frame shift via RP/AT consequences, exposing bureaucracy as one ontology among many. The debrief makes implicit theory explicit, ready for your philosophical elaboration.
