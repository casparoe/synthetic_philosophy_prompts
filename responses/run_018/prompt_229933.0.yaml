answer: |-
  **The Journal of Introspective Representation Studies**  
  Style Guide for Contributors  

  1.  Manuscripts must exclusively defend illusionism regarding phenomenal consciousness. Papers implying, exploring alternatives to, or expressing ambivalence about illusionism will be desk-rejected. (Our scope is explicit and non-negotiable.)  

  2.  The phrase "what it is like" and its cognates (e.g., "what-it’s-likeness," "subjective character") are strictly prohibited. Replace all such constructions with precise descriptions of *representational content* and *introspective mechanisms*. For example:  
      *   Incorrect: "There is something it is like to see red."  
      *   Correct: "Introspection systematically represents visual state R as having a non-existent qualitative property 'redness'."  
      (Such talk smuggles in phenomenal realism by presupposing an object for the seeming.)  

  3.  The verb "seems" and its variants ("appears," "feels like") are permitted *only* when immediately followed by a functionalist or representationalist paraphrase eliminating any hint of ineffability.  
      *   Acceptable: "It seems to S that there is a red quale" must be rewritten as "S is in an introspective state I(R) with the content <there is a phenomenal property 'redness' instantiated>, where this content is non-veridical."  
      *   Unacceptable: "It seems ineffably red." (An ineffable seeming *just is* a phenomenal property.)  

  4.  Meta-Problem Formulation: When addressing the "meta-problem of consciousness" (explaining the disposition to report phenomenal properties), authors must scrupulously avoid language suggesting this disposition *itself* possesses phenomenal character. Describe the disposition solely in terms of:  
      *   (a) The specific non-veridical representational content produced by introspection.  
      *   (b) The evolutionary/cognitive mechanisms generating this specific misrepresentation.  
      *   (c) The functional role of reporting such content (e.g., communication, self-monitoring).  
      (The illusion explains the belief; the belief does not validate the illusion.)  

  5.  Regress of Seemings: Manuscripts encountering statements like "It seems to me that it seems like there is pain" must halt the regress at the first-order misrepresentation.  
      *   Correct: "The introspective state I(P) has the content <there is phenomenal pain>, which is false. The report 'It seems like it seems...' simply indicates a higher-order representation *about* the occurrence and content of I(P), which is also non-phenomenal."  
      *   Prohibited: Any appeal to an ineffable ground of seeming (e.g., "a certain je ne sais quoi," "raw feel," "intrinsic seeming"). This constitutes illicit phenomenal realism.  

  6.  Pain Descriptions: When discussing paradigmatic states like pain, authors must clearly characterize the state as:  
      *   (a) An objective, non-phenomenal state (e.g., nociceptive processing, avoidance disposition).  
      *   (b) Accompanied by an introspective representation I(P) with the *rich, non-veridical content* <there is a private, intrinsic, hurtful quality>.  
      *   Emphasize that the *representational content* (<hurting>) radically outruns the actual, non-phenomenal properties instantiated by the physical state. (The "ouchiness" is entirely in the false report.)  

  7.  Addressing the Self-Refutation Objection: A standardized rebuttal paragraph is required for any manuscript responding to the claim that "an illusion of consciousness must itself be conscious." Use the following template, adapting specifics as needed:  
      "The objection conflates *being an illusion* with *being phenomenally conscious*. The illusion (the systematic introspective misrepresentation I(X) with content <phenomenal property P exists>) is a non-phenomenal, physical state. Its *content* is about (non-existent) phenomenality, but *having* that content is not a phenomenal property. Asserting that I(X) must possess P to represent P commits the fallacy of intentional object projection: mistaking properties represented *in* the content for properties *of* the representing state. I(X) is simply a complex physical process misdescribing other physical processes."  

  8.  Prohibited Terminology: The following terms are banned unless explicitly placed in skeptical scare quotes and immediately given an illusionist paraphrase: Qualia, Raw Feel, Phenomenal Character, Subjective Experience (as denoting more than representational content), Quale, What-it’s-likeness, Sensory Qualities (as intrinsic properties), Nagelian Bat-Perspective.  

  9.  Metaphor Restrictions: Avoid metaphors implying creation or manifestation of phenomenal properties (e.g., "the brain *generates* redness," "pain *emerges*"). Permissible metaphors involve *misdescription* or *misrepresentation* (e.g., "the introspective module *mislabels*," "the system is *tuned to falsely report*").  

  10. Justification Scope: Appeals to simplicity, theoretical unity, or scientific plausibility are permitted justifications for illusionism. Appeals to "preserving the manifest image" or "taking experience seriously" are inadmissible. (Our task is to explain the *report*, not vindicate its apparent object.)  

  11. Final Checklist: Prior to submission, authors must replace every instance of phenomenally suggestive language with its illusionist reformulation per Rules 2-6 and confirm adherence to Rules 7-10. Manuscripts failing this internal audit will be returned without review.
