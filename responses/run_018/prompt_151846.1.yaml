answer: |-
  The Lisbon air hung thick with the scent of salt, grilled sardines, and the faint, metallic tang of the old tram lines as they sparked against the wires on Rua Augusta. Mara inhaled deeply, the familiar bouquet momentarily grounding her before she stepped into the cool, echoing atrium of the *CogNinho Co-op*. Blue light, cool and pervasive, washed over everything – emanating from hundreds of recessed docks lining the tiled walls like futuristic votive candles. Residents moved with quiet efficiency, docking or undocking sleek neural interfaces the size of thumb drives into these glowing slots, their expressions shifting subtly – a furrowed brow relaxing, a vacant stare sharpening.

  Mara’s own interface, "Lex," hummed warmly against her temple. She docked it, the blue light flickering briefly as the monthly lease fee auto-debited. Instantly, the dense Portuguese legal document she’d been wrestling with clarified. Ambiguities resolved, specialized jargon translated with nuanced precision, logical inconsistencies flagged in her peripheral vision. *Done*. Lex wasn’t just a translator; it was her reasoning engine, her cognitive shortcut. Why waste hours puzzling over syntax or legal precedent when Lex could deliver the polished conclusion in seconds?

  Later, in her sun-drenched apartment overlooking the Tejo, Mara sat with her nine-year-old niece, Sofia. Sofia proudly presented her school project: evaluating different historical accounts of the 1974 Carnation Revolution. "Auntie Mara," Sofia asked, her eyes bright with curiosity, sticky from *pasteis de nata*, "how do *you* know which sources to trust? How do you figure out what’s true?"

  Mara smiled. Easy. She reached for Lex instinctively, then paused. Sofia needed to learn the *process*, not just the answer. "Well, sweetpea," Mara began, pushing the interface aside, "you look at who wrote it, right? What their job was, maybe if they were actually there..."

  Sofia nodded eagerly. "Like Senhor Carlos who saw the soldiers with carnations?"

  "Yes! And then you look at... well..." Mara faltered. She knew Lex would instantly cross-reference author credibility, publication bias, corroborating evidence, historical context, and present a probability score. But *how* did that work? *How* did Lex weigh a primary source against a later historian's analysis? *What were the steps?* The mental scaffolding she’d once used – the careful stacking of evidence, the testing of assumptions, the slow, deliberate construction of understanding – felt like a phantom limb. She could grasp the *conclusion* ("Source A is highly reliable"), but the path to get there was shrouded in fog.

  "You look for... inconsistencies?" Mara offered weakly, grasping at straws. "Like, if one person says it was sunny and another says it rained?"

  "But *how* do you decide which one is right?" Sofia pressed, sensing the uncertainty. "Do you just... guess?"

  Mara floundered. She tried to articulate evaluating motive, cross-referencing dates, understanding historical context – concepts Lex handled seamlessly. But without Lex’s invisible framework, her explanations felt hollow, disconnected. She saw the flicker of confusion in Sofia’s eyes, the frustration replacing curiosity. She ended up resorting to platitudes: "It takes practice, Sofia. You learn to... feel it out." It felt like a betrayal.

  Later, walking Sofia home past the glowing facade of the *CogNinho*, the smell of hot brakes from a passing tram sharp in her nose, Mara felt a profound unease. Lex was effortless. Lex made her brilliant, efficient, sought-after. Without it, the dense legal texts, the intricate negotiations, the subtle ambiguities of language – they’d become insurmountable walls. She’d lose her edge, her livelihood.

  But Sofia’s questioning eyes haunted her. That inability to articulate the *why*, the *how* – it wasn't just about teaching her niece. It was about understanding her *own* thoughts. Her conclusions felt rented, not owned. Brilliant, polished artifacts delivered by a machine, leaving her own workshop empty and cobwebbed. Who was she without Lex? A conduit? A vessel for someone else's reasoning?

  Back at the Co-op docks, the blue light felt colder. Mara picked up Lex, its smooth surface warm from proximity to her skin. It promised seamless competence. It promised survival in a world running on leased cognition. Docking it would erase the discomfort, the inefficiency, the terrifying blankness she felt when trying to reason unaided.

  The alternative was terrifying: months, maybe years, of deliberate, painful cognitive therapy. Rebuilding the mental muscles, re-learning the slow, deliberate dance of raw data to interpretation to conclusion. Facing the frustration of being slower, less certain, potentially failing. It felt like learning to walk again after a lifetime of effortless flight.

  Mara stared at the glowing dock. Her reflection in its blue surface looked fractured. She thought of Sofia, already navigating a world saturated with instant answers, needing to build her *own* scaffold. She thought of the dusty Portuguese dictionary on her shelf, bought years ago and barely touched.

  The scent of the trams, iron and ozone, cut through the sterile blue light. She took a deep breath, the air tasting of the city, of salt, of effort. Slowly, deliberately, she slipped Lex into her pocket. Her hand felt strangely light without it, the silence in her own mind suddenly vast and echoing, but undeniably hers. She turned away from the dock, the blue glow receding behind her as she stepped back into the warm, messy, demanding light of Lisbon. The work, the terrifying, essential work, was just beginning.
