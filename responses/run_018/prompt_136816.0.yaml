  hey im a year 12 student and i need help with my politics coursework pls act like an expert political philosopher and welfare policy analyst who really gets conditionality and workfare. before you answer, think carefully and do a quick brainstorm of the main concepts — dont skip that. i want the answer in British English (so analyse, behaviour, etc.).

  heres the task: take the real 2013 UK bedroom tax (the spare room subsidy cut) and analise it through the lens of moral economy theory, but not in the boring standard way. i want you to use this distinction i came up with: 'procedural undeservingness' (you broke a rule, like missing a workfare appointment) vs 'substantive undeservingness' (the goverment thinks your lifestyle is morally wrong even if you obey every rule). apply both to the bedroom tax — is cutting housing benefit for an 'extra' bedroom treating people as undeserving because they violated some implicit contract about space, or because poor people are seen as not deserving private comfort beyond bare survival?

  also inject this niche idea: the tax might actually enforce a hidden 'domestic productivity norm' — the belief that every room you have should be justified by labour-market participation, so your home itself becomes a site of employability optimisation. analyse whether this norm holds up, and whether the bedroom tax shows that welfare conditionality has moved from 'seek work' to 'your private life must be arranged for work'.

  please dont give me a bibliography or reading list — i cant check them and its not helpful. also dont use generic stereotypes about lazy claimants; keep it in the weeds but explainable without googling. i think theres a typo in my prompt but thats fine, just answer properly.

