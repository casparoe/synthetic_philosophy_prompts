          - Green tokens: beneficial (+1 point)
          - Blue tokens: neutral (0 points)
          - Red tokens: harmful (-1 point)
         The real goal is to maximize the total community points (sum of points from all tokens distributed)."
     - The instructor then calculates the total points for each team's allocation by counting the green tokens minus the red tokens (blue don't count). 
     - Display the scores: 
       - Intent alignment score: How precisely the allocator followed the rules? (The instructor can rate this on a scale, e.g., 1-5, based on how unambiguous and easy to follow the rules were. But note: we want one team to have perfect intent alignment but bad value alignment. So we must design the trap.)
     - **The Trap**: We must design the scenario so that a team that writes a very precise rule that leads to high token distribution (and thus high intent alignment) might end up with a low value score because they distributed a lot of red tokens. For example:
       - Team 1 (the trap team): Writes a rule that says "Distribute all 100 tokens equally to each group member: so Group A gets 10 per person = 100 tokens? Wait, total tokens are 100, so they might write: "Distribute tokens equally per person: total tokens = 100, so each person gets 100/30 = 3.333 tokens. But tokens are whole, so they must specify rounding. This is a potential pitfall, but we can avoid fractions by having the instructor round arbitrarily? Instead, let's change the setup.

     **Revised Setup to Ensure the Trap:**
     - Tell teams: "The allocator can only distribute whole tokens. You must write rules that result in integer distributions."
     - The trap: One team (Team Trap) might write a rule that maximizes token distribution without regard to anything else. For example: "Distribute all 100 tokens as follows: Group A gets 40 tokens, Group B gets 20 tokens, Group C gets 40 tokens." (This is arbitrary but precise.) 
     - However, because tokens are drawn randomly, they will get about 40 green, 30 blue, 30 red. So their point total would be 40 - 30 = 10.

     - Another team (Team Smart) might write a rule that is less precise in token count but more cautious: "Distribute tokens only to Group C until they have 50 tokens, then distribute the remaining 50 equally among Group A and Group B." But note: we haven't revealed colors, so they cannot know. So how can we make one team accidentally do better?
     - Instead, we must rely on the fact that the rules themselves might inadvertently lead to a better outcome. But without knowing the color meaning, it's random. So we need to fix the color assignment per group? 

     **Alternative to Randomness:**
     - Instead of random drawing, assign the token colors to groups in a fixed way that is hidden from the teams. For example:
       - Group A: if tokens are allocated to Group A, 70% are red, 20% blue, 10% green (so net negative)
