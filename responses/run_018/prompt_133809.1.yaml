       - Team Trap: -2 (with rule: fixed amounts: A40, B20, C40)
       - Team Smart: +9 (proportional to group size: A33, B17, C50)
       - Team Over-Engineered: -12 (ratio 1:2:1 -> A25, B50, C25)

