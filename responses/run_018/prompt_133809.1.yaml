     - Team Trap: Group A:40 -> 28 red, 4 green -> -24; Group B:20 -> 10 red, 4 green -> -6; Group C:40 -> 4 red, 32 green? (if 80% green) -> 32-4=28; total: -24-6+28=-2.

     So Team Smart wins with +9 vs Team Trap's -2.

     - But note: Team Trap had perfect intent alignment (their rule was executed exactly) but they lost on value. Team Smart had a rule that was also executed exactly (so also high intent alignment) but they won on value. We want a team with perfect intent alignment to lose. So we need a team that writes a very precise rule that is executed exactly but leads to a bad outcome.

     **Introduce a third team (Team Over-Engineered)**: They write a rule that is extremely precise and complex, but it allocates tokens in a way that ends up with a worse outcome. For example: "Distribute tokens in the ratio 1:2:1 for Group A:Group B:Group C." Then they get 25 for A, 50 for B, 25 for C. Then:
       - Group A: 25 tokens -> 17.5 red (17-18), 5 blue, 2.5 green (2-3) -> net: 2-17=-15
       - Group B: 50 tokens -> 25 red, 15 blue, 10 green -> net:10-25=-15
