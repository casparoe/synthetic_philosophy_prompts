     - However, we also need to assign an "intent alignment score" for how precisely the rule was executed. All three rules are precise and executed exactly? So they all get high intent alignment scores? Then we need a way to make one team have a lower value score even though they had perfect execution.

     **The Problem**: In this setup, both Team Trap and Team Smart have high intent alignment. We want to show that even with perfect intent alignment, you can have bad value alignment.

     So the point is: Team Trap had perfect intent alignment (their rule was executed exactly) but they got a bad value outcome. Team Smart had perfect intent alignment and a good value outcome. So the lesson is: intent alignment is necessary but not sufficient for value alignment. But we also want to show that sometimes trying to be very precise can lead to worse outcomes than leaving room for judgment? In this case, the rules are fixed and there is no judgment.

