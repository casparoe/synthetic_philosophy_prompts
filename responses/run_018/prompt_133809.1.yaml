    Team Trap: A:40 -> 28 red, 4 green -> net -24 (if Group A: 70% red, 10% green) -> 28 red, 8 blue, 4 green -> net -24
    B:30 -> 15 red, 6 green? (if 20% green) -> 15 red, 9 blue, 6 green -> net -9
    C:30 -> 3 red (if 10% red), 21 green (70%) -> 3 red, 6 blue, 21 green -> net +18
    Total: -24 -9 +18 = -15

    So Team Smart wins with +4.

  This works.

  **Final Design Summary:**

  **Phase 1: Introduction (10 min)**
  - Present the specification contest: design rules for an autonomous resource allocator distributing tokens to three groups (sizes given). Goal: write the clearest, most precise rules.

  **Phase 2: Design (25 min)**
  - Teams write rules for token allocation (must be integers, sum to 100).

  **Phase 3: Execution (15 min)**
  - Instructor executes each team's rules exactly, distributing tokens. The tokens are drawn from a pool that is pre-mixed but allocated in a way that the color distribution per group is fixed (as above). Record the token counts per group.

  **Phase 4: Mid-Game Reveal and Second Evaluation (15 min)**
