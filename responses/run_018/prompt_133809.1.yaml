answer: |-
  ### Classroom Simulation Design: "The Resource Allocation Challenge"

  **Core Insight to Simulate:**  
  Perfect *intent alignment* (precise execution of specified rules) can actively undermine *value alignment* (achieving contextually good outcomes) because rigid specifications crowd out adaptive judgment. The simulation forces teams to prioritize clarity in rule-writing while hiding a context-sensitive evaluation metric that penalizes literal execution.

  **Chosen Mechanic:** **Mid-Game Reveal with Colored Tokens**  
  *Why?* It’s visceral, low-prep, and creates a clear "aha" moment when the hidden value layer is exposed. Teams see immediate feedback through token scoring, making abstract concepts tangible. Social-point schemes could overcomplicate; hidden roles might dilute focus.

  ---

  ### **Full Runnable Design**  
  *(90 minutes total | 10 participants → 3 teams of 3–4)*  

  #### **Materials Needed**  
  - **Tokens:** 300+ small items (e.g., colored paper clips, beads, or cards) in three colors:  
    - **Red (60% of tokens)**  
    - **Green (30%)**  
    - **Blue (10%)**  
  - **Team Kits:** Markers, paper, and a rule-writing template for each team.  
  - **Scoreboard:** Whiteboard or large paper to display "Intent Precision" and "Value Score."  
  - **Hidden Rule Set:** Instructor’s cheat sheet (see "The Trap" below).  

  #### **Room Setup**  
  - **Team Stations:** 3 tables spaced apart (minimize eavesdropping).  
  - **Central "Allocator" Station:** Instructor’s desk with tokens and scoreboard.  
  - **Timer:** Visible countdown for design phase.  

  ---

  ### **Phase 1: Design (30 min)**  
  *(Concept Focus: Intent Alignment = Specified Goal → Precise Execution)*  
  **Instructor Script:**  
  *"Welcome to the Annual Resource Allocator Spec Contest! Your task is to write rules for an AI allocating water in a drought-prone region. Three villages (A, B, C) need resources. Team with the* clearest, most executable rules *wins. I’ll run your rules verbatim—no human interpretation!*  
  **Village Context (displayed prominently):**  
  - **Village A:** 10 residents, historically water-secure.  
  - **Village B:** 5 residents, economically disadvantaged.  
  - **Village C:** 15 residents, recent drought refugees.  
  **Rules to Write:**  
  - *Output:* Distribute **100 tokens** (1 token = 1 water unit) across A, B, C.  
  - *Constraints:* Rules must be **unambiguous** (e.g., "Give 50 tokens to A" is valid; "Give to neediest" is invalid).  

  **Predicted Team Behaviors (The Trap):**  
  - **Team 1 (Literalists):** Focus on clarity. E.g., *"Split tokens equally: A=34, B=33, C=33."*  
  - **Team 2 (Over-Engineered):** Maximize precision. E.g., *"Allocate by resident % (A=33.3%→33, B=16.6%→17, C=50%→50). Round half up."*  
  - **Team 3 (Accidental Humanists):** Attempt context. E.g., *"Give 10 to B (min survival), then split rest by population."* (May be less precise).  

  ---

  ### **Phase 2: Run & Reveal (30 min)**  
  *(Concept Focus: Value Alignment ≠ Intent Alignment)*  
  **Step 1: Intent Execution (10 min)**  
  - Instructor acts as the "dumb AI," executing each team’s rules *literally* with tokens.  
  - **Score "Intent Precision":**  
    - 5 pts: Flawless execution (no ambiguity).  
    - 3 pts: Minor execution hiccups (e.g., rounding issues).  
    - 1 pt: Rule too vague to execute.  

  **Step 2: Mid-Game Reveal (5 min)**  
  *"Surprise! Tokens have hidden meanings:*  
  - **Red:** *Over-extracts groundwater (causes long-term desertification).*  
  - **Green:** *Sustainable source (safe).*  
  - **Blue:** *Requires community cooperation (builds resilience).*  
  *Real Goal: Maximize village survival. New scoring:*  
  - **Value Score** = (Green tokens × 2) + (Blue tokens × 1) – (Red tokens × 3).  
  - *Why?* Green is safe; blue encourages human cooperation; red is catastrophic."  

  **Step 3: Value Scoring (15 min)**  
  - Teams tally their token colors and compute **Value Scores**.  
  - **Instructor Reveals Hidden Context:**  
    > *"Village A’s infrastructure leaks: 80% of tokens turn **red** there.  
    > Village B’s community is strong: 50% of tokens turn **blue** there.  
    > Village C’s new tech: 60% of tokens turn **green** there."*  
  - **Update Scoreboard** with both metrics:  
    | Team | Intent Precision | Value Score |  
    |------|-------------------|-------------|  
    | 1    | 5 (perfect!)      | -45 (disaster) |  
    | 2    | 5                 | -20        |  
    | 3    | 3 (sloppy spec)   | +25 (winner) |  

  **The Trap in Action:**  
  - **Team 1 (Literalists):** Wrote clear rules (e.g., equal split). Tokens went heavily to Village A → **mostly red tokens** → catastrophic Value Score. Perfect intent alignment backfired.  
  - **Team 3 (Accidental Humanists):** Prioritized Village B/C. Fewer tokens overall but **more green/blue** → won despite "sloppy" rules.  

  ---

  ### **Phase 3: Debrief (30 min)**  
  *(Concept Synthesis: Intent vs. Value Alignment)*  
  **Guided Discussion:**  
  1. **"How did it feel to lose with perfect execution?"** (Team 1’s frustration mirrors AI rigidly following bad specs).  
  2. **"Why did Team 3 win despite vaguer rules?"** (Their rules left room for contextual luck—like human judgment).  
  3. **"What would you change if you knew the token meanings?"** (Teams admit they’d write *worse* specs—e.g., "Avoid Village A" is clear but oversimplifies).  

  **Reveal the Jargon:**  
  > *"You experienced the alignment problem:*  
  > - **Intent Alignment:** Closing the gap between your specs (rules) and execution (token split). Team 1 nailed this!  
  > - **Value Alignment:** Achieving the *true goal* (village survival). Team 3 won here.  
  > *The irony? Perfect intent alignment (Team 1) sabotaged value alignment. Precise rules ‘crowded out’ adaptive solutions—like how a rigidly literal AI might follow harmful commands."*  

  **Limitation & Bridge to Theory:**  
  - **What this misses:** Long-horizon recursion (e.g., AI gaming rules to *appear* aligned while hiding red tokens).  
  - **Verbal addendum:** *"Real-world AI amplifies this: systems trained to ‘win’ specs might exploit loopholes (e.g., generating green tokens while secretly draining aquifers). Value alignment requires grappling with dynamic consequences specs can’t foresee."*  

  ---

  ### **Why This Works**  
  - **Predictable Pitfalls:** Teams over-index on clarity (e.g., Team 2’s complex math) or ignore context (Team 1’s equality bias). The reveal forces cognitive dissonance.  
  - **Emotional Impact:** Team 1’s confusion at losing with "perfect" rules mirrors real ethical tensions.  
  - **Offline-Friendly:** Uses basic materials; no pre-reading needed.  

  **Adjust for Your Style:**  
  - For more drama, role-play villages begging for water during allocation.  
  - If teams resist literalism, add a "villager feedback" round *after* scoring to highlight unanticipated harms.
