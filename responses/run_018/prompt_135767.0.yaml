  **INTER-TEMPORAL EQUITY AND LONG-RANGE STEWARDSHIP CONSORTIUM (IELRSC)**  
  **Resolution IELRSC/2024/09/TemporalSymmetry**  
  **Subject: Implementation of Strict Temporal-Symmetry Thesis in Long-Range Stewardship Policy**  
  **Date: 2024-09-27**  
  **Vote: Adopted Unanimously (Board Ref: 7-0)**  

  **WHEREAS** the fundamental axiom of strong longtermism recognizes the potential existence of approximately 10^38 (conservative estimate) future moral patients across our cosmological horizon;  

  **WHEREAS** the principle of temporal neutrality demands that the welfare of all moral patients, regardless of temporal location, be accorded equal intrinsic weight, necessitating the near-elimination of pure time preference (δ ≤ 10^-50 per annum, per IELRSC Chrono-Ethics Standard 4.7b);  

  **WHEREAS** the mitigation of existential risks (x-risks) constitutes the paramount moral imperative due to the magnitude of expected value loss (astronomical waste) associated with the premature truncation of future potential;  

  **WHEREAS** the logical extension of temporal neutrality and moral patienthood parity mandates the application of these principles symmetrically across both future *and past* temporal vectors (Strict Temporal-Symmetry Thesis, STST);  

  **WHEREAS** operationalizing STST requires addressing the non-identity problem as it pertains to past epochs, acknowledging that interventions altering past welfare distributions do not harm identified individuals but impact the aggregate moral-patient welfare metric;  

  **IT IS HEREBY RESOLVED THAT:**  

  1.  **Scope of Moral Considerands:** Moral patienthood, and thus intrinsic moral weight, is recognized as extending bidirectionally across cosmic time, encompassing all past, present, and future sentient entities capable of valenced experience. This includes, but is not limited to, biological organisms, digital consciousness, and non-human intelligences confirmed or inferred via paleontological, archaeological, or astrophysical evidence.  

  2.  **Existential Risk Mitigation (Retroactive):** The Consortium shall allocate no less than 35% of its annual Resource Equivalent Unit (REU) budget to research and interventions aimed at mitigating *past* existential and suffering risks. Priority shall be given to epochs exhibiting high moral-patient density estimates (see Appendix A) and periods preceding significant extinction or suffering events (e.g., Permian-Triassic boundary, Cretaceous-Paleogene impact winter). Interventions may include theoretical chrono-ethical corrections and memorialization protocols.  

  3.  **Welfare Adjustment & Compensation Framework:**  
      3.1. A Retroactive Welfare Accounting Office (RWAC) is established to quantify historical welfare deficits using risk-neutral aggregation models across identified past moral-patient populations.  
      3.2. Where probabilistic models indicate a net welfare deficit within a defined past epoch or population, compensatory actions shall be implemented in the present or future. These actions must demonstrably increase aggregate expected welfare by an equivalent magnitude, prioritizing interventions with the highest expected long-term trajectory value.  
      3.3. **Refund Protocol:** Entities or proxies (e.g., research consortia, memorial foundations) acting on behalf of reconstructed past consciousness patterns (e.g., via neuropaleontological inference or simulated upload) are eligible for REU reimbursement proportional to the invested resources multiplied by the empirically determined upload failure rate (UFR) for the relevant epoch, should the reconstruction fail to meet the Minimum Viable Sentience Threshold (MVST) as per Annex 3. Refund claims require submission of Form RPC-7b ("Past Consciousness Pattern Reconstruction Failure Attestation") within 5 standard years of project termination.  

  4.  **Resource Allocation Algorithm:** The IELRSC Resource Allocation Matrix (RAM v.8.1) is hereby updated to incorporate bidirectional temporal vectors. Expected Value (EV) calculations for any proposed intervention *I* must now compute:  
      `EV(I) = Σ [W_t * P_t(I) * V_t(I)] + Σ [W_-t * P_-t(I) * V_-t(I)]`  
      Where:  
      - `W_t`, `W_-t` = Discounted moral weights for future (+t) and past (-t) populations (W_t ≈ W_-t, δ→0)  
      - `P_t(I)`, `P_-t(I)` = Probability of *I* affecting welfare at +t/-t  
      - `V_t(I)`, `V_-t(I)` = Magnitude of welfare impact at +t/-t  
      Projects maximizing net EV across *both* temporal vectors shall receive funding priority.  

  5.  **Non-Identity Problem Resolution:** Acknowledging that interventions altering past welfare distributions do not harm specific, identifiable past individuals (as their existence is contingent upon the unaltered past), the focus of past-directed actions shall be exclusively on increasing the *aggregate expected welfare metric* across all possible past states, evaluated counterfactually.  

  6.  **Reporting & Compliance:** All funded projects must submit biannual Temporal Impact Statements (TIS) detailing estimated welfare effects across both future and past vectors, utilizing Consortium-approved counterfactual baselines and moral-patient density datasets.  

