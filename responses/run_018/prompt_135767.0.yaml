  **FREQUENTLY ASKED QUESTIONS (FAQ) - RESOLUTION IELRSC/2024/09/TemporalSymmetry**  

  **Q1: Doesn't focusing on the past contradict prioritizing existential risk mitigation?**  
  A1: No. Mitigating past suffering events and extinction risks is symmetrical to future-oriented x-risk mitigation. Preventing a past Permian-scale extinction, even counterfactually, recovers vast expected welfare value lost to "astronomical waste" in the past vector, analogous to preserving future potential.  

  **Q2: How can we affect the past? Isn't causality violated?**  
  A2: IELRSC interventions operate within established chrono-ethical frameworks (e.g., Block Universe theory). We cannot change *actualized* past events. Our mandate is to optimize the *expected welfare metric* across all temporal locations via present/future actions with retrospective ethical weight (memorialization, compensation, counterfactual welfare accounting).  

  **Q3: Why allocate resources to beings that no longer exist?**  
  A3: Moral patienthood is timeless. The intrinsic badness of suffering or the goodness of flourishing does not diminish because it occurred in the past. Temporal neutrality demands we accord equal weight to all valenced experiences, irrespective of temporal direction. Ignoring past suffering violates logical symmetry with future obligations.  

  **Q4: What justifies the "Refund Protocol" for failed uploads?**  
  A4: Resources invested in reconstructing past consciousness patterns are diverted from other welfare-enhancing interventions. A failed upload represents a net loss in expected welfare value if the resources could have been deployed more effectively elsewhere. The refund mechanism ensures efficient REU allocation, upholding the principle of expected value maximization across temporal vectors.  

  **Q5: Isn't estimating past moral-patient density (MPD) too speculative?**  
  A5: All longtermist calculations involve significant uncertainty (e.g., future digital mind populations). We employ rigorous Bayesian paleoethical modeling based on fossil evidence, comparative neurobiology, and complexity thresholds for valenced experience. Uncertainty is incorporated into EV calculations via confidence intervals and sensitivity analysis within the RAM.  

