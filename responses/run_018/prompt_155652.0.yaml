prompt: |-
  You are a professional philosopher of language with expertise in the skeptical paradox of rule-following and experience writing deadpan institutional satire. Before composing anything, spend a few sentences brainstorming how the Kripke-Wittgenstein challenge—that no internal fact determines whether a speaker means addition by “plus” or “quus” (addition below 57, else 5)—would destabilize three specific bureaucratic practices: performance evaluation, contractual obligation, and disciplinary auditing. Think carefully about the standard replies (dispositionalism, primitivism about meaning, and the community-based solution) and how each could be parodied as an HR policy.

  Then write a satirical parody of approximately 600 words, formatted as a deadpan internal memo titled “Rule-Following Compliance Audit — Q3 Review,” issued by the fictional firm Normativity Partners LLP. The voice should be that of an unflappable legal-compliance officer; the venue is a corporate intranet portal. The target is the skeptical conclusion itself: if there truly are no facts of the matter about which rule an employee is following, then ordinary workplace enforcement becomes incoherent.

  To keep the piece meaningful without requiring web access, ground it in the well-known elements of the paradox—past behavior underdetermining meaning, the quus function, and the appeal to communal norms—but inject one invented institutional mechanism to prevent pure regurgitation: a “Quus-Proof Accounting Protocol” that mandates peer-vote arbitration whenever an employee’s arithmetic is contested, and a “Continuity Clause” that attempts to preserve personal identity across audit periods despite skeptical doubts about mental continuity. The humor must arise from taking the philosophy seriously: show payroll disputes, promotion denials, and termination hearings collapsing because the firm cannot establish whether a worker meant “plus” or “quus” on Tuesday. Keep the irony sustained and deadpan—no winking, no explicit acknowledgment that this is absurd—so that a reader familiar with Kripkenstein recognizes the fair exaggeration, while an outsider can read it as a bizarre but legible corporate document.

  Do not include bibliographies, reading lists, citations, or requests for quotes from real texts. Do not invoke obscure post-2000 secondary literature. Begin with your brief brainstorm outline, then present the full memo with numbered sections, checkbox fields, and a manager’s appendix.
