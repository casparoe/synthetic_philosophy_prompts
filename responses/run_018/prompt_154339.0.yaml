  Key non-negotiable requirements would include respecting the moral ontology-morphology distinction, avoiding cultural solipsism, and maintaining the possibility of critical judgment. The moral ontology-morphology distinction seems particularly fundamental as it does the most work in excluding inadequate frameworks.

  For the evaluation section, I'll need to carefully show how each approach handles the various desiderata. The standard progression narrative might handle historical patterns well but likely fails at moral ontology and neutrality, while functionalism might excel at explaining adaptations but struggle with normative evaluation.

  I'll structure this with clear sections: first outlining the desiderata (phenomena, distinctions, puzzles, and tensions), then evaluating the two approaches against these criteria. I'll be precise about which requirements are negotiable versus non-negotiable, and clearly identify which single requirement does the most exclusionary work.
answer: |-
  ### Core Desiderata for a Normative Comparison Framework  
  *(Non-negotiable requirements marked with ★)*  

  **I. Phenomena to Explain**  
  1. **Honor Cultures**: Why insults constitute *collective moral injuries* requiring public restitution.  
  2. **Dignity Cultures**: Why grievances are framed as *individual rights violations* resolved through depersonalized procedures.  
  3. **Victimhood Cultures**: Why harms demand *institutional arbitration* and structural acknowledgment of systemic power asymmetries.  

  **II. Distinctions to Respect**  
  1. **Functional Adaptation vs. Intrinsic Moral Worth**: How cultural practices serve social cohesion (e.g., honor’s deterrence in stateless societies) vs. their inherent ethical defensibility.  
  2. **Descriptive Sociology vs. Normative Evaluation**: Separating *how* cultures operate from *whether* they are morally justified.  
  3. ★ **Moral Morphology vs. Moral Ontology**:  
     - **Morphology**: Formal structures of grievance/redress (e.g., duels, lawsuits, Title IX hearings).  
     - **Ontology**: The conception of personhood (e.g., relational/embedded self in honor, autonomous individual in dignity, structurally determined subject in victimhood).  
     *This distinction does the most exclusionary work: frameworks conflating ontology/morphology cannot compare cultures neutrally.*  

  **III. Puzzles to Dissolve**  
  1. Does dignity’s legalism *reduce cruelty* (by curbing vendettas) or *bureaucratize it* (e.g., carceral systems)?  
  2. Does victimhood’s institutional reliance become "administrative honor culture" by shifting audiences from kin to HR departments?  
  3. How to avoid **cultural solipsism**: Comparing cultures without assuming one’s own metric (e.g., "dignity") is universal.  

  **IV. Tensions (Potentially Unsatisfiable Pairs)**  
  1. **Cultural Neutrality vs. Definitive Moral Ranking**: Objective evaluation may require non-neutral criteria.  
  2. **Pluralist Tolerance vs. Critical Judgment**: Valuing diversity while condemning practices (e.g., honor killings).  
  3. **Non-Negotiability Alert**: ★ Frameworks *must* preserve moral ontology as foundational; morphology is negotiable, ontology is not.  

  ---

  ### Evaluation of Competing Frameworks  

  **1. Standard Sociological Trajectory (Honor → Dignity → Victimhood as "Progress")**  
  - **Succeeds at**:  
    - Explaining *historical patterns* (e.g., dignity emerging with centralized states).  
    - Highlighting functional shifts (morphology adapting to urbanization/digital life).  
  - **Fails at**:  
    - ★ **Ontology/Morphology Conflation**: Treats dignity’s ontology (individual autonomy) as evolutionary "peak," misreading victimhood as regression rather than distinct ontology (structural determination).  
    - **Cultural Solipsism**: Assumes Western dignity norms are universal, dismissing honor/victimhood as primitive or pathological.  
    - **Puzzle Failure**: Cannot resolve if bureaucratized dignity "reduces cruelty" (ignores systemic violence in legalism).  

  **2. Pluralist Functionalism (Cultures as Contextually Adaptive)**  
  - **Succeeds at**:  
    - Explaining functional adaptations (e.g., honor in weak-state contexts, victimhood in complex bureaucracies).  
    - Respecting *descriptive neutrality* by avoiding moral hierarchies.  
    - Dissolving "admin honor" puzzle: Acknowledges audience-shifting as functional, not degenerative.  
  - **Fails at**:  
    - ★ **Normative Vacuum**: Cannot critically evaluate ontologies (e.g., if honor’s collective personhood inherently violates autonomy).  
    - **Tolerance/Judgment Tension**: Defers all moral questions to context, making condemnation of injustice (e.g., caste systems) impossible.  
    - **Puzzle Blindspot**: Evades whether legalism bureaucratizes cruelty by treating all systems as equally functional.  

  ---

  **Key Insights**  
  - **Non-Negotiables**: Moral ontology must anchor comparison (★). Frameworks must avoid cultural solipsism (★) and enable critical judgment (★).  
  - **Negotiables**: Morphological flexibility (e.g., reparations as honor/dignity/victimhood hybrid), functional explanations.  
  - **Critical Gap**: Both frameworks struggle with **moral ontology evaluation**. A defensible framework must:  
    - Ground ontology in *non-arbitrary human interests* (e.g., freedom from cruelty, recognition as agent).  
    - Test cultures against whether their ontology *enables* or *suppresses* those interests.  
    Example: Honor culture’s collective personhood may deny individual exit rights; dignity’s atomism may enable alienation; victimhood’s structuralism may erode agency. No framework succeeds without this step.
