prompt: |-
  I'm attempting to determine my own principled view of when an atrocity ought to be named genocide, weighing moral intuition against legal category. Here are my verdicts on specific cases, with one tension I cannot resolve. Case 1: The systematic destruction of European Jewry during the Second World War—this is genocide, unambiguously, in both law and morality. Case 2: A settler-colonial administration deliberately introduces famine and disease to eradicate an indigenous population—genocide, even absent industrial methods or explicit racial ideology, because the group-targeting and destructive intent are clear. Case 3: A government executes tens of thousands of political opponents drawn from every ethnicity—this is a mass atrocity and a crime against humanity, but I hesitate to call it genocide because the victims are not selected for membership in a protected group as such, in the sense Lemkin originally articulated. Case 4: A state-sanctioned corporation diverts and poisons a watershed knowing it will eliminate a specific tribe's physical and cultural survival, but internal documents frame the act as resource optimization with no explicit order to destroy the group—morally this feels like genocide to me, yet I suspect conventional legal doctrine might acquit it for lack of specific intent. Case 5: A regime deploys algorithmic risk-scoring to enforce compulsory sterilization and indefinite detention on members of one ethnic minority, labeling the program predictive public health—genocide, despite the bureaucratic framing, because the group is targeted and the effect is destructive. Case 6: In a civil conflict, both factions engage in ethnic cleansing; each side publicly accuses the other of genocide while denying its own actions. Here I think both should bear the label, but I notice that in practice the naming becomes a political weapon, which makes me wonder whether my other verdicts are also partly performative rather than purely descriptive. There is a tension between Case 3, where I require group-specific targeting, and Case 4, where I want to apply the label despite the absence of explicit targeting language. Is there a coherent principle—perhaps based on intent, foreseeable effect, group identity, or the performative function of naming—that accommodates all six? If not, which verdict must be revised? Apply your principle to one further case I have not listed: a state sponsors large-scale climate-engineering that disproportionately destroys the habitat of a nomadic people, with internal memos showing full awareness of the consequence but framing the project as global carbon mitigation with no mention of the affected group. State the principle precisely, indicate which of my verdicts it saves and which it sacrifices, and deliver your final conclusion in the form: Verdict: [state whether a unified principle exists and, if so, its core claim].
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with a profound ethical-legal tension: when should mass violence be called genocide? Their six cases reveal conflicts between moral intuition and legal formalism, especially around group targeting and intent. 

  The user's core struggle shines through in Case 4 and 6 - they feel bureaucratic violence that destroys groups should be genocide even without explicit hate, but worry the label becomes politicized. That's the hinge: can we condemn systemic destruction without requiring mustache-twirling villains? 

  Hmm... their rejected solutions are telling. They dismiss pure legalism (too narrow for Cases 4/5) and pure consequentialism (too broad for Case 3). What's needed is a bridge between intent and outcome. Lemkin's original conception of genocide as "disintegration... of political/social institutions" helps here - it's about destroying group existence, not just killing members. 

  Ah! The key insight: genocidal intent can hide behind bureaucratic euphemisms but still be inferred from knowledge of destruction. Case 4's poisoned watershed? The corporation knows it erases the tribe. Case 5's "predictive health" algorithms? The targeting is unambiguous. This reconciles Cases 3-5: political executions lack group-destruction intent, while environmental and digital attacks do. 

  For the climate-engineering addendum: state awareness of nomadic habitat destruction satisfies genocidal intent under this framework. The "global mitigation" framing is just camouflage. 

  Final principle: Genocide requires intent to destroy a group as such, provable by deliberate targeting or conscious acceptance of group annihilation - even if cloaked in neutral language. Sacrifices nothing from user's verdicts except Case 4's legal doubt. Verdict: unified principle exists.
answer: |-
  Your struggle to reconcile moral intuition with legal formalism is both rigorous and ethically necessary. I propose a unified principle that resolves your tension while preserving your core intuitions:

  **Principle:**  
  *An atrocity constitutes genocide when there is deliberate action (through commission or omission) that foreseeably destroys, in whole or substantial part, a protected group as a distinct collective, regardless of whether the perpetrator explicitly articulates group-destructive intent, provided the perpetrator possesses contextual awareness of the group's existence and vulnerability.*  

  **Key Components:**  
  1. **Protected Group:** National, ethnic, racial, or religious groups (per CPPCG Article II).  
  2. **Destructive Action:** Physical, biological, or cultural destruction mechanisms.  
  3. **Intent Standard:** *Foreseeable destruction with contextual awareness* — intent is inferred when:  
     - (a) The group is *differentially targeted* (Cases 2,5), OR  
     - (b) The perpetrator *knows the action will destroy the group* despite framing it otherwise (Cases 4,6, climate case).  
  4. **Exclusion:** Actions destroying groups incidentally or targeting non-protected collectives (e.g., political groups) fall under crimes against humanity (Case 3).  

  ---

  ### **Application to Your Cases:**  
  | Case | Your Verdict | Principle's Verdict | Tension Resolved |  
  |------|--------------|---------------------|------------------|  
  | 1    | Genocide     | Genocide            | None (baseline) |  
  | 2    | Genocide     | Genocide            | Intent inferred from differential impact + settler-colonial context |  
  | 3    | Not Genocide | Not Genocide        | Political groups unprotected; no group-destructive intent |  
  | 4    | Moral Genocide | **Genocide**        | Knowledge of tribal destruction = inferred intent |  
  | 5    | Genocide     | Genocide            | Algorithmic targeting = explicit differential intent |  
  | 6    | Genocide     | Genocide            | Ethnic cleansing = intent to destroy group territorial existence |  

  **Sacrifice:** Case 4’s "legal acquittal" concern is overruled. Internal documents showing *awareness of group destruction* satisfy specific intent under modern jurisprudence (e.g., *Akayesu*).  

  ---

  ### **Climate-Engineering Case (Your Addendum):**  
  *State sponsors geoengineering knowing it will destroy a nomadic people’s habitat; memos show awareness but frame it as "carbon mitigation."*  
  - **Verdict:** **Genocide**  
  - **Reasoning:**  
    - Protected group: Ethnic/national (nomadic people).  
    - Foreseeable destruction: Habitat loss = biological/cultural annihilation.  
    - Inferred intent: State’s awareness + differential impact + framing avoids mentioning the group (implying conscious avoidance of accountability).  

  ---

  ### **Resolving Your Core Tension (Case 3 vs. Case 4):**  
  - **Case 3 (Political Opponents):** No genocide because:  
    - Victims lack protected-group status under CPPCG.  
    - No intent to destroy a national/ethnic/etc. collective *as such* — only to eliminate opposition.  
  - **Case 4 (Poisoned Watershed):** Genocide because:  
    - *Contextual awareness* of tribal dependence on the watershed + *foreseeable destruction* = inferred genocidal intent, regardless of bureaucratic framing.  

  **Performative Naming (Case 6):** The principle avoids politicization by requiring *evidence of foreseeable group destruction*. Mutual accusations in civil wars demand rigorous scrutiny of differential targeting and knowledge of consequences.  

  ---

  ### **Final Verdict:**  
  **A unified principle exists:** Genocide requires intent to destroy a protected group *as such*, but intent may be *inferred from deliberate actions with foreseeable group-destructive consequences*, where the perpetrator is contextually aware of the group’s vulnerability.  

  **Core Claim:**  
  > *The naming of genocide is justified when perpetrators knowingly enact the destruction of a protected group—whether through explicit targeting or wilful blindness to foreseeable annihilation—thereby collapsing the moral/legal divide between articulated malice and systemic indifference.*  

  This grounds your moral intuition in a legally robust framework, expanding intent beyond explicit orders while excluding non-group atrocities. Case 4 is saved; all other verdicts hold.
