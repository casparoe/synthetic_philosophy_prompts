     - Consider: Could a less burdensome measure achieve the same goal? (e.g., shorter duration, less intensive intervention).
     - **Yes**: The burden is the least restrictive option. → **Pass Track 2**.
     - **No**: A less restrictive alternative is available. → **Fail Track 2**.
     - **Unclear**: Insufficient information to determine. → **Uncertain**.

  7. **Track 2 Conclusion:**
     - **Pass**: The burden is justified by necessity and is the least restrictive means.
     - **Fail**: The burden is solely retributive or not the least restrictive.
     - **Uncertain**: Insufficient information to determine.

  **Overall Decision:**

  1. If Track 2 **Passes** → **APPROVE** the sanction.
  2. If Track 2 **Fails** → **REJECT** the sanction.
  3. If Track 2 is **Uncertain** → **Requires human judgment** (the board must deliberate and decide based on available information).

  Note: The outcome of Track 1 (Pass, Fail, or Uncertain) does not change the requirement for Track 2 to pass. However, if Track 1 fails, it reinforces that retribution is impermissible. In case of uncertainty in either track, the board must exercise judgment.

  **Conflicts and Limitations:**
  - Conflict: If Track 1 passes (offender is answerable) but Track 2 fails (the burden is retributive), the sanction must be rejected. This reflects the Caruso constraint.
  - The procedure cannot resolve when evidence is insufficient (Uncertain). It requires human judgment.
