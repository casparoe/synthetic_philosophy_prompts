  **Dual-Track Sanction Review Procedure**

  **Step 0: Preliminary Check**
  - Ensure the proposal includes:
     - Description of the offense and circumstances.
     - Details of the proposed sanction.
     - Information about the offender's state of mind, history, and context (if available).
