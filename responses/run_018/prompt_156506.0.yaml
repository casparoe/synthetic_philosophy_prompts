  Below is a step-by-step operational procedure for your dual-track review, designed as a clear, executable checklist. It incorporates the Dennett-style compatibilist desert check (Track 1) and Caruso-style skeptical audit (Track 2) into a single flowchart with explicit decision points, conflict resolution rules, and handling of "unclear" cases. It respects your constraints: no external research, no psychology expertise, 20-minute time limit, and mandatory written sign-off. 

  The procedure is structured as a linear flow with binary (yes/no) or ternary (yes/no/unclear) answers. "Unclear" triggers mandatory human judgment. **Conflicts between tracks** (e.g., Track 1 passes but Track 2 fails) are resolved by Track 2 overriding Track 1, as the Caruso audit forbids retribution regardless of desert. The procedure **cannot resolve** cases where Track 2 requires necessity/least-restrictive-means judgments but lacks evidence—these must be escalated.

  ---

  ### **Dual-Track Sanction Review Procedure**  
  *(Time budget: 12 min for Tracks 1–2, 8 min for documentation/judgment)*  

  #### **Step 0: Initial Setup**  
  - **Input**: Sanction proposal + offense details (from file).  
  - **Output**: Approved, Rejected, or "Human Judgment Required" (with reasons).  
  - **Rule**: Base answers solely on the file. No new evidence. If critical details (e.g., offender's mental state) are missing, default to "unclear."  

  #### **Track 1: Dennett-Style Desert Check**  
  *Purpose: Assess if the offender had rational self-control/reflective agency during the act.*  

  1. **Question 1.1 (General Capacity)**:  
     - *Ask*: "Is there evidence the offender has a history of rational decision-making in similar contexts? (e.g., holding employment, managing finances, prior responsible behavior)."  
     - **Sufficient answers**:  
       - **Yes**: Clear evidence of past responsibility (e.g., stable job, no diagnosed impulse disorders).  
       - **No**: Evidence of chronic impairment (e.g., documented addiction, intellectual disability, psychosis).  
       - **Unclear**: Mixed/absent evidence (e.g., gambling addiction but no history of impulse issues).  
     - *Flow*:  
       - Yes → Proceed to 1.2.  
       - No → **Track 1: FAIL**.  
       - Unclear → Flag for human judgment; proceed to 1.2.  

  2. **Question 1.2 (Specific Control)**:  
     - *Ask*: "Is there evidence that during the offense, the offender could have chosen otherwise? (e.g., planned the act, avoided detection, expressed remorse/justification)."  
     - **Sufficient answers**:  
       - **Yes**: Evidence of deliberation (e.g., premeditation, concealment, post-act rationalization).  
       - **No**: Evidence of compulsion (e.g., acted mid-crisis, no attempt to hide, immediate regret/confusion).  
       - **Unclear**: Conflicting indicators (e.g., addiction present but planning involved).  
     - *Flow*:  
       - Yes → **Track 1: PASS**.  
       - No → **Track 1: FAIL**.  
       - Unclear → **Track 1: UNCERTAIN** (flag for human judgment).  

  #### **Track 2: Caruso-Style Skeptical Audit**  
  *Purpose: Ensure burdens are necessary for safety/rehabilitation/restoration—never retribution.*  

  1. **Question 2.1 (Burden Check)**:  
     - *Ask*: "Does the sanction impose suffering/restriction? (e.g., incarceration, fines, mandatory therapy, labor)."  
     - **Sufficient answers**:  
       - **Yes**: Any coercive/unpleasant element exists.  
       - **No**: Entirely voluntary/non-burdensome (e.g., optional counseling).  
     - *Flow*:  
       - Yes → Proceed to 2.2.  
       - No → **Track 2: PASS** (nothing to justify).  

  2. **Question 2.2 (Public Safety Necessity)**:  
     - *Ask*: "Is the burden strictly needed to prevent imminent physical harm? (e.g., incapacitating a violent predator)."  
     - **Sufficient answers**:  
       - **Yes**: Clear, direct link to preventing harm (e.g., offender threatened recurrence).  
       - **No**: Burden is symbolic, disproportionate, or unrelated to safety.  
       - **Unclear**: Risk is plausible but unproven (e.g., no violence history but offense was severe).  
     - *Flow*:  
       - Yes → Proceed to 2.4.  
       - No/Unclear → Proceed to 2.3.  

  3. **Question 2.3 (Rehabilitation/Restoration Necessity)**:  
     - *Ask*: "Is the burden strictly needed to reform the offender or repair harm? (e.g., therapy for addiction, restitution for damages)."  
     - **Sufficient answers**:  
       - **Yes**: Burden directly addresses cause of offense or compensates victims (e.g., therapy for gambling addiction in fraud case).  
       - **No**: Burden is punitive/adds no reform/restorative value (e.g., labor after restitution paid).  
       - **Unclear**: Link is speculative (e.g., mandatory anger management without evidence of anger issues).  
     - *Flow*:  
       - Yes → Proceed to 2.4.  
       - No → **Track 2: FAIL** (purely retributive).  
       - Unclear → **Track 2: UNCERTAIN** (flag for human judgment).  

  4. **Question 2.4 (Least Restrictive Means)**:  
     - *Ask*: "Is this the mildest effective option? (e.g., community service vs. prison; short monitoring vs. long)."  
     - **Sufficient answers**:  
       - **Yes**: File shows alternatives considered/rejected for valid reasons (e.g., therapy preferred over jail).  
       - **No**: Harsher options used without justification (e.g., prison when probation suffices).  
       - **Unclear**: No alternatives discussed, or evidence is weak.  
     - *Flow*:  
       - Yes → **Track 2: PASS**.  
       - No → **Track 2: FAIL**.  
       - Unclear → **Track 2: UNCERTAIN** (flag for human judgment).  

  #### **Overall Decision Flow**  
  - **Track 2 PASSES** (any burden justified) → **APPROVE** sanction.  
  - **Track 2 FAILS** (burden unnecessary/retributive) → **REJECT** sanction.  
  - **Track 2 UNCERTAIN** → **HUMAN JUDGMENT REQUIRED** (board deliberates).  
  - *Track 1 outcome*:  
    - Pass/Fail/Uncertain → **Informs judgment if Track 2 uncertain** but **never overrides Track 2**.  
  - **Conflict handling**:  
    - If Track 1 PASSES but Track 2 FAILS (e.g., offender had agency, but sanction is retributive) → **REJECT** (Track 2 overrides).  
    - If Track 1 FAILS but Track 2 PASSES (e.g., no agency, but burden is rehabilitative) → **APPROVE**.  
  - **Unresolvable by procedure**:  
    - Necessity/least-restrictive judgments with no evidence (always "unclear" → human judgment).  
    - Symbolic punishments (e.g., short jail for deterrence) that lack safety/rehab/restoration value → **REJECT** by Track 2.  

  ---

  ### **Application to Your Three Cases**  
  *Using only file details provided; no new research.*

  #### **Case 1: Fraud offender (gambling addiction)**  
  - **Track 1**:  
    - Q1.1: **Unclear**. Gambling addiction suggests impairment, but fraud requires planning (general capacity ambiguous).  
    - Q1.2: **No**. "Severe spiral" implies compulsion; no evidence of rational choice during act.  
    - **Result**: FAIL (no desert).  
  - **Track 2**:  
    - Q2.1: **Yes** (monitoring/therapy are burdens).  
    - Q2.2: **No**. Fraud isn’t violent; geofencing doesn’t prevent online fraud.  
    - Q2.3: **Yes**. Therapy directly addresses gambling cause; monitoring ensures compliance.  
    - Q2.4: **Unclear**. No alternatives discussed (e.g., voluntary therapy).  
    - **Result**: UNCERTAIN (due to Q2.4).  
  - **Overall**:  
    - Track 2 uncertain → **Human judgment required**. Board must decide if therapy/monitoring is the least restrictive option.  
    - *Note*: Track 1 fail means no retribution is allowed, but rehabilitation may proceed if justified.  

  #### **Case 2: Violent offender (prison extension)**  
  - **Track 1**:  
    - Q1.1: **Yes**. "Actively enjoys provoking staff" implies rational agency.  
    - Q1.2: **Yes**. Refusing rehab/enjoying provocation shows deliberate control.  
    - **Result**: PASS (full desert).  
  - **Track 2**:  
    - Q2.1: **Yes** (prison is burdensome).  
    - Q2.2: **Yes**. Violence risk to staff/public justifies incapacitation.  
    - Q2.4: **Unclear**. No evidence that shorter extension/segregation wouldn’t suffice.  
    - **Result**: UNCERTAIN (due to Q2.4).  
  - **Overall**:  
    - Track 2 uncertain → **Human judgment required**. Board must assess if 5 years is the least restrictive means for safety.  
    - *Why ugly?* You likely support the extension, but the procedure forces scrutiny: if alternatives exist (e.g., 2 years + monitoring), it may be rejected.  

  #### **Case 3: Vandal (restorative labor after restitution)**  
  - **Track 1**:  
    - Q1.1: **Yes**. Turned self in/paid restitution shows responsibility.  
    - Q1.2: **Yes**. Vandalism was intentional (control evident).  
    - **Result**: PASS (full desert).  
  - **Track 2**:  
    - Q2.1: **Yes** (labor is burdensome).  
    - Q2.2: **No**. Property crime; no violence risk.  
    - Q2.3: **No**. Restitution already paid; labor adds no new restoration/rehab value.  
    - **Result**: FAIL (purely retributive "payback").  
  - **Overall**:  
    - Track 2 fails → **REJECT** sanction.  
    - *Why disliked?* Labor seems fair, but Caruso forbids burdens without necessity—restitution already restored victims.  

  ---

  ### **Procedure Summary**  
  - **Strengths**: Clear thresholds for yes/no; prioritizes public safety/rehabilitation over retribution; forces explicit justification.  
  - **Weaknesses**:  
    - Human judgment needed for "unclear" (∼30% of cases).  
    - Track 2 may reject "deserved" punishments (e.g., Case 3).  
    - Least-restrictive means (Q2.4) is often unresolved without data.  
  - **Output**: For each case, document:  
    - Track 1: Pass/Fail/Uncertain + reason.  
    - Track 2: Pass/Fail/Uncertain + reason.  
    - Final decision + escalation notes.  

  This tool operationalizes your policy without philosophy jargon. It will consistently flag retributive elements and compel the board to confront trade-offs (e.g., in Case 2, where safety needs may conflict with excessive suffering).
