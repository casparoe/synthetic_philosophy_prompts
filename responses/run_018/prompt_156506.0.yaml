  1. **Question 1: Does the offender have a general capacity for rational self-control?**
     - Look for evidence in the offender's life (e.g., stable employment, relationships, prior responsible behavior, absence of severe mental impairment).
     - **Yes**: Evidence of general capacity.
     - **No**: Evidence of severe impairment (e.g., diagnosed intellectual disability, severe untreated mental illness) that undermines general capacity.
     - **Unclear**: Mixed evidence or insufficient information.

