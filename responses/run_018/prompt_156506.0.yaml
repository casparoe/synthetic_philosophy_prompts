     - Look for evidence of deliberate choice, planning, or intentional action versus evidence of compulsion, extreme duress, or mental breakdown.
     - **Yes**: Evidence of intentional action (e.g., premeditation, concealment, expression of motives).
     - **No**: Evidence of significant impairment at the time (e.g., acute psychosis, severe addiction compulsion leading to loss of control).
     - **Unclear**: Ambiguous or insufficient evidence.

