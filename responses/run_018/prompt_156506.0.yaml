  We are creating a dual-track review procedure for ethics review of sanction proposals. The two tracks are:

  Track 1: Dennett-style compatibilist desert check
     - Focus: Did the offender exercise rational self-control and reflective agency? Or was the act closer to a compulsive breakdown?
     - We are looking for evidence of the offender's capacity for rational self-control at the time of the offense.

  Track 2: Caruso-style skeptical audit
     - Premise: Nobody ultimately deserves suffering in a deep metaphysical sense.
     - Therefore, any punitive or burdensome element must be strictly necessary for public safety, rehabilitation, or victim restoration, and cannot be justified solely as retributive payback.

  We have 20 minutes per case and the board members lack philosophy training. We need a step-by-step checklist or flowchart that:
     - Asks questions in order.
     - Defines what counts as sufficient yes/no/unclear.
     - Specifies where the flow stops with approval, rejection, or needs human judgment.
     - Highlights conflicts between the two tracks and where the procedure cannot resolve.

  Constraints:
     - Cannot search external literature.
     - No clinical psychologist on staff.
     - Must sign off in writing.

  The procedure must be operational and not require reading philosophical texts.

  We'll design the flowchart as a series of steps with decisions. We'll then apply it to the three cases.

  **Step-by-Step Procedure:**

  **Step 0: Initial Review**
     - Ensure the proposal includes:
          a) Description of the offense and circumstances.
          b) Details of the proposed sanction/intervention.
          c) Any available information about the offender's state of mind, history, and context at the time of the offense (from police reports, prior records, etc.).
     - If critical information is missing, request clarification (but note time constraints). In practice, we have to work with what's provided.

  **Track 1: Dennett-style Compatibilist Desert Check**

     1. **Question 1: Was the offender capable of rational self-control in general?**
          - Look for evidence of a general capacity for rational self-control in the offender's life (e.g., holding a job, maintaining relationships, planning activities, prior law-abiding behavior). 
          - If no evidence of general capacity (e.g., severe mental illness, intellectual disability, or evidence of persistent loss of control in multiple life domains) → Answer "No".
          - If evidence of general capacity → Proceed to Question 2.
          - If unclear (e.g., some evidence but also counter-evidence) → Mark as "Unclear" and proceed to Question 2, but note for overall judgment.

     2. **Question 2: At the time of the offense, did the offender exercise rational self-control?**
          - Look for evidence that the offender made a deliberate choice, considered consequences, or acted with intention. 
          - Evidence for: premeditation, attempts to avoid detection, expression of reasons/motives, clear goal-directed behavior.
          - Evidence against: acting under extreme duress (not just stress), in the grip of an acute mental health episode (e.g., psychosis), or during a documented state of severe addiction compulsion (where the behavior is out of character and the person was unable to resist despite negative consequences).
          - If evidence of exercise of control → Answer "Yes".
          - If evidence of lack of control (compulsive breakdown) → Answer "No".
          - If unclear → Answer "Unclear".

     3. **Track 1 Conclusion:**
          - If both questions are "Yes" → Pass Track 1 (the offender is answerable for the act).
          - If either question is "No" → Fail Track 1 (the offender is not answerable in the compatibilist sense, so desert-based punishment is not justified).
          - If "Unclear" in either → Mark as "Uncertain" for Track 1 (requires human judgment).

  **Track 2: Caruso-style Skeptical Audit**

     1. **Question 1: Does the proposed sanction contain any punitive or burdensome element?**
          - Consider: Is there any aspect that is intended to be unpleasant, restrictive, or burdensome beyond what is necessary for the non-retributive aims? (e.g., incarceration, fines, mandatory programs that are onerous, etc.)
          - If no burdensome element (e.g., purely voluntary rehabilitation) → Pass Track 2 (since no suffering to justify).
          - If yes → Proceed to Question 2.

     2. **Question 2: Is the burdensome element strictly necessary for public safety?**
          - Consider: Is the burden required to prevent immediate harm to others? (e.g., incapacitation of a violent offender, monitoring to prevent re-offense)
          - Evidence: Risk assessment (if available), nature of the offense, offender's history, likelihood of re-offense without the measure.
          - If yes → Proceed to Question 4 (since we have a justification, we don't need to check rehabilitation or restoration for this burden, but we must check if the burden is the least restrictive means).
          - If no → Proceed to Question 3.

     3. **Question 3: Is the burdensome element strictly necessary for rehabilitation?**
          - Consider: Is the burden an essential component of a program that is likely to reform the offender and prevent future offenses? (e.g., mandatory therapy that requires attendance, but the mandatory aspect is necessary for engagement)
          - Evidence: Program design, expert opinion (if available), but note we have no psychologist. We rely on common sense and program descriptions.
          - If yes → Proceed to Question 4.
          - If no → Proceed to Question 3a.

     3a. **Question 3a: Is the burdensome element strictly necessary for victim restoration?**
          - Consider: Does the burden directly contribute to repairing the harm done to the victim? (e.g., restitution, community service that benefits the victim or community, but note that restitution paid by the offender is not necessarily burdensome if they can afford it; if it's a hardship, then it might be burdensome and we must check necessity).
          - If the burden is the only way to achieve restoration (e.g., unpaid labor when the offender cannot pay restitution) → Then it may be necessary.
          - If yes → Proceed to Question 4.
          - If no → Proceed to Question 3b.

     3b. **Question 3b: Is the burdensome element justified solely as retribution?** 
          - This is the key: If the burden is not necessary for public safety, rehabilitation, or restoration, then it is retributive. According to Caruso, that is not acceptable.
          - Therefore, if the burden fails public safety, rehabilitation, and restoration, then it is solely retributive → Fail Track 2.

     4. **Question 4: Is the burdensome element the least restrictive means available to achieve the necessary goal (public safety, rehabilitation, or restoration)?**
