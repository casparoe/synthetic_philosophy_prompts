prompt: |-
  Hey, I'm working on a long feature about dead theories that refuse to stay dead, and I got stuck on Malthus. The usual story is he blew it—he missed the green revolution, the demografic transition, all of it—but there's this more interesting defence floating around that he wasn't wrong, just 'right but early,' and that modern tech and falling birthrates are basically temporary respites that don't actually falsify the underlying logic. I'm trying to write the part where I ask: okay, but if that's the position, what would it actually take to defeat it? Not just 'it hasn't happened yet,' but what kind of long-run trajectory—say, sustained decoupling of resource use from population growth, or a permanent global sub-replacement fertility regime that doesn't rebound—would make the 'right but early' framing collapse into a plain false prediction rather than a delayed true one?

  Also, I'm wondering if the modern Malthusian revival has hidden escape hatches—like assuming specific energy-return-on-investment floors or climate feedback loops—that make it practically unfalsifiable, or whether there's a live risk it takes that defenders themselves would concede. What's the difference between evidence that's merely awkward for the view and evidence that'd be genuinely decisive? And do they risk anything at all, or has the theory been so qualified that it can't be touched? I'd like an honest map of where the view is actually exposed.
