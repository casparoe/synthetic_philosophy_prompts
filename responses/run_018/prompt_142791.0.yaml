prompt: |-
  I'm prepping a sequence of questions for a podcast Q&A with a philosopher who just published a monograph defending what she calls shadow broadcasting, a twist on global workspace theory. On her view phenomenal consciousness isn't globally broadcast at all—it's produced in local recurrent loops that are actively isolated from the workspace, and first-person reports are just post-hoc reconstructions that mistake local recurrence for widespread access. I want questions that push hard on whether shadow broadcasting is empirically distinguishable from standard phenomenal access, and that antcipate her usual deflection that objections are just framing issues rather than real problems. Start with the blindsight and split-brain literature, then move toward whether her view collapses access and phenomenal consciousness in the wrong direction, and end with what specific neural or behavioral finding could actually falsify shadow broadcasting. No generic opener—just the actual questions, with follow-ups baked in.
reasoning: |-
  Okay, the user is prepping for a podcast Q&A with a philosopher who advocates for "shadow broadcasting." This is a twist on global workspace theory. The key points: phenomenal consciousness isn't globally broadcast; instead, it's produced in local recurrent loops that are isolated from the workspace. First-person reports are post-hoc reconstructions mistaking local recurrence for widespread access. The user wants tough questions focusing on empirical distinguishability, anticipating deflections about framing issues. They specify starting with blindsight and split-brain literature, then moving to whether the view conflates access and phenomenal consciousness, and ending with falsifiability criteria.

  First, I need to make sure I understand shadow broadcasting. It seems to deny that phenomenal consciousness requires global broadcast. Instead, consciousness is local and isolated, and reports are reconstructions. The philosopher might deflect by saying objections are just framing problems. So my questions need to cut through that and push for empirical distinctions.

  Starting with blindsight. Blindsight patients can respond to stimuli without awareness. In standard GWT, this is because the information isn't globally broadcast. But in shadow broadcasting, consciousness is local. How does her model explain blindsight? If consciousness is local, why wouldn't blindsight patients have phenomenal consciousness in the blind field? The follow-up should challenge any deflection. For example, if she says it's a framing issue, I need to press on what specific neural mechanisms differ.

  Next, split-brain cases. In split-brain patients, the hemispheres can't share information. Standard GWT might say consciousness isn't unified. But in shadow broadcasting, local loops are isolated. So why does the right hemisphere seem unable to report its experiences? If local loops produce consciousness, the right hemisphere should have its own phenomenology. But patients don't report it. Her model might say reports are reconstructions, so the left hemisphere can't reconstruct the right's experiences. But then, how do we know the right hemisphere has consciousness at all? That leads to the problem of other minds. Pressing on this could reveal if her view implies multiple consciousnesses or denies consciousness in the right hemisphere.

  Then, the collapse of access and phenomenal consciousness. Shadow broadcasting seems to say that what we report is just post-hoc reconstruction, not actual access. But if phenomenal consciousness is local and not accessed, how do we know it's there? This risks conflating the two or making phenomenal consciousness epiphenomenal. I need to ask how her view avoids this. If she deflects, push for how her model differs empirically from illusionism.

  Finally, falsifiability. What specific findings could disprove shadow broadcasting? Maybe evidence that local recurrent loops aren't sufficient for consciousness, or that global broadcast is necessary. Or cases where reports align with global access but not local recurrence. She might say that any counter-evidence is misinterpreted, so I need to pin down concrete predictions that differ from standard GWT.

  Anticipating deflections: When she says objections are framing issues, the follow-ups should demand specific empirical differences. For example, in blindsight, ask what neural signatures her theory predicts versus GWT. In split-brain, clarify the necessity of corpus callosum for consciousness versus reporting. For the collapse issue, challenge her to distinguish her view from illusionism with testable outcomes. For falsification, push for unambiguous predictions that, if proven false, would make her abandon the theory.

  Overall, each question needs to be sharp, backed with empirical cases, and include pre-emptive follow-ups to block deflections. The goal is to force her to either provide concrete distinctions or reveal weaknesses in the theory's testability.
answer: |-
  Here are the precise, targeted questions with built-in follow-ups, designed to force empirical distinctions and preempt framing deflections:

  ### I. Blindsight & the Isolation Claim
  1. **"In blindsight, patients deny visual experience in their blind field but can accurately guess stimuli. Standard GWT attributes this to absent global broadcast. Since your model locates phenomenality *in* locally recurrent but isolated loops, why wouldn't blindsight involve unreportable *phenomenal* consciousness in the blind field? What specific neural signature distinguishes your 'isolated phenomenal loop' from the unconscious processing in blindsight?"**  
     *(Anticipated deflection follow-up: If you argue blindsight loops aren't recurrent *enough* for phenomenality, what quantifiable recurrence threshold makes local loops conscious? How is this empirically distinguishable from GWT's broadcast threshold?)*

  2. **"Type 2 blindsight involves meta-cognitive awareness of unseen stimuli without phenomenality. Your view treats first-person reports as reconstructive confabulations. How does your framework explain subjects reliably reporting *lack* of experience here? Doesn't this imply their report accuracy contradicts your 'post-hoc reconstruction' account when they correctly deny phenomenality?"**  
     *(Preemptive strike: If you call this a 'framing issue', what experiment could show their 'no' response is reconstruction *error* rather than accurate access to absent local loops?)*

  ### II. Split-Brain & Reportability
  3. **"In split-brain patients, the right hemisphere can perform complex tasks but can't verbally report experiences. Standard GWT says its representations aren't broadcast to the left hemisphere's language centers. But if phenomenality is locally recurrent in *each* hemisphere, why does the right hemisphere never initiate reports via non-verbal methods? Doesn't this suggest isolation *precludes* genuine first-person access, not just global reportability?"**  
     *(Deflection killer: If you claim the right hemisphere *has* phenomenality but the left's reconstructive process can't access it, how is this different from epiphenomenalism? What test could show the right hemisphere isn't a philosophical zombie?)*

  4. **"When split-brain patients conflict (e.g., left hand unbuttons a shirt while right hand buttons it), your model must posit two isolated conscious agents. Yet patients report unified agency. If reports are reconstructive confabulations masking multiple local consciousnesses, what neural evidence proves multiple *phenomenal* fields exist beyond behavioral conflict? Couldn't all data be explained by unconscious modular competition?"**  
     *(Preemptive: If this is 'merely conceptual', what observable neural or behavioral trace *couldn't* be explained by unconscious conflict plus reconstructive narrative?)*

  ### III. Collapse of Access & Phenomenality
  5. **"You claim phenomenality occurs in locally isolated loops, while reports reflect reconstructive access. But if local loops are isolated from global workspace mechanisms, how can their content *ever* be reconstructed? Doesn't this require phenomenal states to leave *some* global trace to be reconstructed—effectively smuggling in access?"**  
     *(Hard edge: Isn't shadow broadcasting functionally identical to access consciousness *minus* reportability, rendering phenomenal consciousness an empirically empty add-on?)*

  6. **"Illusionists like Dennett argue phenomenality *is* reconstruction. Your view seems to invert this: phenomenality is real but trapped locally, and reports are false reconstructions. What experiment could distinguish your 'real-but-unrecoverable phenomenality' from illusionism's 'no phenomenality' claim? Or is the difference purely stipulative?"**  
     *(Deflection trap: If you appeal to 'what it’s like' irreducibility, how does that generate testable predictions beyond standard cognitive models?)*

  ### IV. Falsifiability & Empirical Teeth
  7. **"What specific neural finding would force you to abandon shadow broadcasting? For example: If we decoded vivid visual experience from prefrontal cortex *during* stimulus presentation without V1 recurrence, would that falsify your local-loop requirement? Or would you reframe it as 'reconstruction in advance'?"**  
     *(Cornering move: If no neural or behavioral result could falsify it—only reinterpreting the same data—doesn’t this make shadow broadcasting non-empirical?)*

  8. **"Can you name one concrete, currently testable prediction where shadow broadcasting *diverges* from standard GWT? For instance: Does your model predict that disrupting global broadcasting (e.g., TMS to prefrontal cortex) spares local phenomenality? If so, how would we detect this 'isolated experience' without reportability?"**  
     *(Final push: If detection requires indirect inference, how do we avoid simply *assuming* phenomenality exists in the absence of access?)*

  ---

  These questions attack the empirical core by demanding:  
  - **Mechanistic specificity** (neural thresholds for local loops vs. broadcast)  
  - **Unique predictions** (split-brain phenomenality, blindsight unreportability)  
  - **Falsification criteria** (decoding, disruption experiments)  
  - **Preemption of deflections** (forcing operational definitions, not conceptual pivots)  
  Each follow-up traps the "framing issue" rebuttal by requiring empirical deliverables. The arc moves from established anomalies (blindsight/split-brain) to theoretical collapse risks (access/phenomenality conflation) to lethal falsification demands.
