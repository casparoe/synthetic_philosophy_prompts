answer: |-
  Below is a branching tree taxonomy for positions on bootstrapping basic empirical knowledge to justify its source. The tree uses concrete cases (clinical instruments, sensors) at each node, enabling navigation by case assessment rather than position labels. All internal nodes are phrased as diagnostic claims/scenarios, and leaves specify positions (or unoccupied combinations) with their most awkward commitment. The three axes are:  
  1. **Circularity**: Can basic knowledge justify its source without vicious circularity?  
  2. **Context-Salience**: Does legitimacy depend on contextual salience of skeptical alternatives?  
  3. **Yield**: Does bootstrapping yield *knowledge* that the skeptical hypothesis is false, or mere *entitlement* to dismiss it?  

  **Tree Structure**  
  ```  
  ROOT: Consider a clinical sensor that outputs a blood-oxygen reading (e.g., 98%). Do you accept this as basic knowledge? (I.e., known without inference from other beliefs.)  
  │  
  ├── No: → **Global Skepticism**  
  │   └── Awkward commitment: Denies any foundation for empirical science, as even instrument readings require inferential justification.  
  │  
  └── Yes: Can the sensor use this reading to non-circularly justify its own reliability? (E.g., "My 98% reading is accurate, so I'm calibrated correctly.")  
      │  
      ├── No: → **Hard-line Anti-Bootstrapping**  
      │   └── Awkward commitment: Forbids any self-supporting calibration, making reliability of basic processes (e.g., vision, instruments) impossible to establish non-question-beggingly.  
      │  
      └── Yes: Does the legitimacy of this self-calibration depend on whether malfunction scenarios (e.g., electrical interference, brain-in-vat) are contextually salient?  
          │  
          ├── No: If this self-supporting reasoning succeeds, does it yield:  
          │   │  
          │   ├── **Knowledge** (e.g., "I now know interference isn't happening") → **Unrestricted Reliabilism or Epistemic Disjunctivism**  
          │   │   └── Awkward commitment: *Reliabilism*: A malfunctioning sensor could "confirm" its reliability by chance outputs. *Disjunctivism*: In the "good case" (actual calibration), perception must entail infallible exclusion of malfunction.  
          │   │   └── *Flag: Tree cannot separate these positions; both answer identically to diagnostic nodes.*  
          │   │  
          │   └── **Entitlement** (e.g., "I can practically dismiss interference, but don't know it's false") → **Unoccupied**  
          │       └── Diagnosis: Unstable—non-circular reasoning that is always legitimate should yield knowledge, not weaker entitlement; no motivation to deny knowledge here.  
          │  
          └── Yes: If this self-supporting reasoning succeeds in a low-salience context, does it yield:  
              │  
              ├── **Knowledge** (e.g., "When malfunction isn't discussed, I know it's absent") → **Contextualism**  
              │   └── Awkward commitment: Knowledge vanishes if a skeptic mentions malfunction—despite identical evidence and reasoning—undermining stability of self-trust.  
              │  
              └── **Entitlement** (e.g., "When malfunction isn't discussed, I can dismiss it, but don't know it's false") → **Unnamed: Contextualist Entitlement**  
                  └── Awkward commitment: Fails to explain why context lowers justificatory burden (to entitlement) yet still forbids knowledge of reliability.  
  ```  

  **Key Notes**  
  - **Unrestricted Reliabilism** (e.g., Sosa) and **Epistemic Disjunctivism** (e.g., McDowell) occupy the same leaf: Both permit non-contextual bootstrapping that yields knowledge. They are indistinguishable in this tree’s diagnostic space.  
  - **Unoccupied Combination**: The leaf allowing *non-contextual bootstrapping* but only *entitlement* (not knowledge) is unexplored. It is unstable—accepting non-circularity while denying knowledge lacks coherent motivation.  
  - **Concrete Cases Used**:  
    - Root: Clinical sensor output (basic knowledge).  
    - Circularity node: Sensor self-calibration via its own reading.  
    - Context-salience node: Malfunction scenarios (electrical interference for instruments; brain-in-vat for perception).  
    - Yield nodes: Knowledge vs. entitlement to dismiss malfunction.  
  - **Taxonomy Design**: Logical space (axes) drives branching; positions are mapped to leaves. Avoids abstract labels until endpoints.  

  This tree isolates core commitments while requiring students to evaluate scenarios—not labels—making it suitable for a seminar on self-certifying belief systems.
