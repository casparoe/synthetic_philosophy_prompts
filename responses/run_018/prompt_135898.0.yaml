answer: |-
  ## Thermidor Through Contingency & Design: Devouring, But Not Inevitably

  **Mapping the Decision Space (8-10 Thermidor Year II / July 26-28, 1794):**

  1.  **Key Actors:**
      *   **Robespierre, Saint-Just, Couthon (The Incorruptibles):** Core Committee members, embodying radical Jacobin virtue. Aimed to purge the Convention and CPS of perceived corruption/counter-revolution. Options: Name names in Robespierre's speech (high risk), rally Paris sections *before* the Convention moves (risky, could be seen as insurrection), rely on CPS authority and Convention speech (chosen path).
      *   **The Thermidorian Coalition:** A loose, temporary alliance driven by fear and self-preservation.
          *   *Terrified Radicals (Tallien, Fouché, Billaud-Varenne, Collot d'Herbois):* Facing imminent purge due to corruption (Tallien, Fouché) or opposition to Robespierre's dominance (Billaud, Collot). Options: Pre-emptive strike in Convention, attempt flight (suicidal under Prairial), hope Robespierre falters.
          *   *Moderate Jacobins & Plain Deputies:* Weary of Terror, alarmed by Prairial and Robespierre's moral absolutism. Options: Support Robespierre (maintain status quo), join opposition coalition (end Terror), remain passive (risky under Prairial).
      *   **The Committee of Public Safety (CPS):** Fatally fractured. Robespierre's faction vs. others (Billaud, Collot, Carnot, Barère). Institutional power immense but cohesion shattered. Options: Present united front (impossible), factions maneuver independently.
      *   **Paris Sections & Commune:** Traditionally radical base, controlled National Guard. Options: Mobilize for Robespierre (potential insurrection), remain neutral, obey Convention orders.

  2.  **Institutional Constraints:**
      *   **Merged Executive-Legislative (CPS & Convention):** The CPS held de facto executive power, but derived legitimacy solely from the Convention. This created inherent tension: the CPS could be dissolved by the Convention at any moment. Deputies feared the CPS, but the CPS relied on them.
      *   **Law of 22 Prairial (June 10, 1794):** This law drastically accelerated the Revolutionary Tribunal, stripped defendants of counsel, and defined "enemies of the people" vaguely. Crucially, it mandated execution for *any* acquittal deemed unjust by the CPS. This created:
          *   **A Climate of Universal Fear:** Any deputy could be denounced and condemned with minimal process.
          *   **Paralyzing Uncertainty:** Robespierre's refusal to name targets on 8 Thermidor made *everyone* feel potentially threatened. Who was "corrupt"? Interpretation was political, not legal.
          *   **The "Devouring" Mechanism:** The law institutionalized the purge but made its direction unpredictable and uncontrollable, even for its architects.

  3.  **Options & Actions:**
      *   **8 Thermidor:** Robespierre speaks vaguely of conspiracy and corruption but **refuses to name names**, terrifying deputies without providing a clear target for their fear. He implicitly threatens the CPS itself. *Contingency:* His tactical error – ambiguity backfired spectacularly.
      *   **9 Thermidor AM:** Saint-Just begins a speech justifying Robespierre but is **shouted down** by the prepared coalition (Billaud, Tallien). *Contingency:* The coalition's coordination and timing; Saint-Just's inability to finish.
      *   **9 Thermidar PM:** Convention, panicked by Robespierre's implied threat and coordinated attacks, **votes arrest** of Robespierre, Saint-Just, Couthon, and supporters. *Contingency:* The precise composition and momentary unity of the coalition; deputies' collective panic overriding previous deference.
      *   **9-10 Thermidor:** The arrested are freed by the Paris Commune (Hôtel de Ville). *Option:* Robespierre et al. **hesitate to call for armed insurrection** against the Convention, losing critical time. *Contingency:* Their ideological scruples about using force against the elected body; confusion at the Hôtel de Ville.
      *   **10 Thermidor:** Convention declares the rebels "outlaws" (meaning execution without trial). **Paris Sections & National Guard ultimately side with the Convention**, not the Commune. *Contingency:* News of victory at **Fleurus** (June 26) reduced the perceived need for emergency Terror; effective propaganda by the Convention portraying Robespierre as a dictator; wavering of sectional support due to war-weariness and Convention legitimacy.

  **Applying the Theory: Devouring vs. Contingent Coup?**

  *   **Devouring via Ideology?** Yes, partially. The Jacobin ideology of "virtue" and transparency, intensified by Robespierre, created a Manichean worldview. Opposition *was* inherently corrupt/counter-revolutionary. The Law of 22 Prairial was the ultimate institutional expression of this, making tolerance impossible and purges systematic. Robespierre's inability to compromise or name specific targets stemmed from this logic – the conspiracy was pervasive, yet defining it concretely was politically dangerous. This ideological rigidity made conflict inevitable and limited his tactical options.
  *   **Ordinary Parliamentary Coup via Contingency?** Emphatically yes. The *timing* and *success* were highly contingent:
      *   **Fleurus:** Military success undermined the primary justification for the Terror (national emergency).
      *   **Robespierre's Speech:** His ambiguity on 8 Thermidor was a critical blunder, unifying disparate fears instead of isolating enemies.
      *   **Coalition Formation:** The temporary alliance of terrified radicals (facing death) and weary moderates (wanting an end to Terror) was fragile but brilliantly exploited the opening. Their coordination in shouting down Saint-Just was decisive.
      *   **Hesitation & Legitimacy:** Robespierre's refusal to openly defy the Convention until too late, and the Sections' ultimate deference to the Convention's authority over the Commune's call, were contingent choices shaped by circumstance and perceived legitimacy.

  **Thermidor's Lesson on Structural Limits & Narrative Silence:**

  Thermidor exposes the **limits of purely structural interpretations** of 1789-94:

  *   **Class Struggle:** While class interests existed, the primary driver on 9 Thermidor was *factional struggle within the political elite*, fueled by personal survival (Terror victims vs. potential victims) and differing visions for the Republic's future, not a clear bourgeoisie vs. sans-culottes dynamic.
  *   **Ideology:** Jacobin ideology provided the *language and justification*, but the immediate trigger was raw fear and political maneuvering. Many Thermidorians were *also* Jacobins; the split wasn't purely ideological.
  *   **Institutional:** The institutional design (CPS/Convention tension, Law of 22 Prairial) created the *conditions for vulnerability and paranoia*, but didn't dictate *who* would fall or *when*. It was the fuel, not the spark or the specific path of the explosion.

  **Where the "Devouring" Narrative is Silent:**

  1.  **Contingency:** It obscures the crucial role of specific decisions (Robespierre's speech, Saint-Just being interrupted, the coalition's timing, hesitation at the Hôtel de Ville, Fleurus news) and luck/chance in the *outcome*.
  2.  **Agency & Choice:** It implies an automatic process, downplaying the calculated, risky choices made by all actors (Robespierre's gamble, the coalition's boldness, the Sections' decision).
  3.  **The "Eaters":** It obscures that the "devourers" (Thermidorians) were overwhelmingly *also* "children" of the revolution, often radical Jacobins themselves. It was an internecine struggle, not the revolution vs. its pure founders.
  4.  **Outcome ≠ Inevitability:** The Terror consuming its leaders was a *possible* outcome inherent in its logic and institutions, but its *actualization* on 9-10 Thermidor required a specific, contingent sequence of events and choices.

  **Conclusion:**

  The fall of Robespierre **complicates** the claim that revolutions *necessarily* devour their own children; while the ideological and institutional dynamics of radical Jacobinism made such a devouring highly *probable* and perhaps even *structurally likely*, the specific timing, targets, and success of the Thermidorian coup were fundamentally dependent on a highly contingent sequence of events, tactical errors, and the fleeting alignment of a diverse coalition of deputies acting primarily out of fear and self-preservation within the unique, terror-ridden institutional framework they had created.
