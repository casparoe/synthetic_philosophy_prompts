  Here’s a defense of the delegated-authority account of promises, addressing your precise requirements:

  ### Core Argument: Promises as Temporary Jurisdictional Transfer
  1. **The Jurisdictional Act**  
     In promising, the promisor performs a sovereign act: they transfer normative authority over a specific future action (e.g., "I will water your plants next week") to the promisee. This creates a micro-jurisdiction where the promisee gains the right to determine what *ought* to be done within that domain.  

  2. **Analogy to Legislation**  
     Like a legislature enacting a statute, the promisor binds themselves to future conduct. Revoking a promise is akin to a legislature retroactively voiding its own law *while still subject to it*. This is self-undermining: the promisor attempts to reclaim authority they no longer solely possess, violating the jurisdictional order they established.  

  3. **Bindingness Beyond Expectations/Harm**  
     The wrong of breaking a promise isn’t primarily about disappointing expectations (which may not exist) or causing harm (which may be absent). It’s a *structural wrong*: the promisor unilaterally reclaims authority they delegated, corrupting the normative framework they created.  

  ---

  ### Addressing Key Challenges  
  **1. Promises Unknown to the Promisee**  
  *(e.g., leaving a voicemail promise before the recipient listens)*  
  - **Delegated Authority Stands**: The transfer of jurisdiction occurs upon utterance, not receipt. Like a law enacted before citizens read it, the normative relationship is established by the promisor’s act alone.  
  - **Why Binding?** The promisor has alienated their authority over the action. Reclaiming it without the promisee’s consent (even if unaware) violates the jurisdictional boundary. Breaking it is still *usurpation*—exercising power one no longer holds.  

  **2. Does This Overstate Autonomy?**  
  *(Objection: Granting such control to promisees risks excessive constraint)*  
  - **Autonomy as Foundation**: The promisor’s *autonomous choice* initiates the transfer. Constraints arise from their own will, not external imposition.  
  - **Inherent Limitation**: The promisee’s authority is strictly bounded by the promise’s scope. They cannot demand unrelated actions (e.g., a promise to lend a book doesn’t grant authority over the promisor’s diet).  
  - **Self-Limitation ≠ Autonomy Loss**: Autonomy includes the capacity to voluntarily commit oneself. Rejecting this would deny a core expression of agency.  

  **3. Distinguishing Promise-Breaking from Harmless Changes of Mind**  
  *(e.g., Promising to wear green, then wearing blue—no expectation or harm)*  
  - **Change of Mind**: Choosing a new shirt color for no reason is neutral—no prior authority transfer exists.  
  - **Promise-Breaking**:  
     - **(a) Structural Violation**: Wearing blue after promising green reclaims decision-making authority the promisor placed with the promisee.  
     - **(b) Self-Undermining**: The promisor acts as both subject (bound by the promise) and legislator (revoking it), creating a contradiction in their normative position.  
     - **Why Wrong Without Harm?** The breach corrupts the promisor’s role as a reliable creator of normative frameworks. Trust in *promising as an institution* erodes, even in trivial cases.  

  ---

  ### Why This Account Excels  
  - **Explains Paradox of Self-Binding**: Autonomy is used to limit future autonomy—a coherent act if we view agents as capable of creating jurisdictional commitments.  
  - **Handles Edge Cases**: Unknown promises and harmless breaches reveal that expectations/harm are secondary to the *jurisdictional violation*.  
  - **Moral Gravity**: Even "small" promises bind because they establish microfounded systems of authority. Revoking them is an act of bad moral faith, regardless of consequences.  

  This framework elevates promise-making from social convention to a foundational act of moral self-governance—one that respects human agency while acknowledging its capacity for self-imposed obligation.
