  Here's a tight, concept-driven joke hitting those specific notes, perfect for a casual science editor pitch:

  **"So my idiot friend Dave built a quantum suicide rig. Claims he's tried it like fifty times already. Swears he's never seen it fire – just clicks harmlessly every single attempt. Meanwhile, *I've* seen it work perfectly twice... right before finding Dave's corpse. Twice. Which really makes you wonder: Is Dave genuinely experiencing quantum immortality? Or are we just getting *really* good at making convincing Dave-clones who *think* they're the luckiest guy alive?"**

  **Why it works for your specs:**

  1.  **First-Person Immortality vs. External Horror:** Directly shows Dave's POV ("never seen it fire") vs. the narrator's gruesome reality ("finding Dave's corpse. Twice").
  2.  **Survivor Bias Outlier:** Dave *is* that outlier in his branch. The repetition ("fifty times," "every single attempt") emphasizes the statistical absurdity from the outside.
  3.  **Copy vs. Original Problem:** The punchline explicitly questions if the surviving "Dave" is the original consciousness or just a perfect copy inheriting memories/luck. This is the core existential twist.
  4.  **Turns on Actual Logic:** It relies entirely on understanding the MWI setup (device fires/doesn't fire based on quantum event, survivor only exists in non-fire branches) and the resulting philosophical nightmare.
  5.  **Funny to the In-Crowd:** The humor comes from the horrifying implications known to those familiar with the thought experiment – the pile of dead Daves, the unreliable nature of subjective "luck," and the clone ambiguity. It's darkly absurd.
  6.  **Avoids Schrödinger Tropes:** No bars, no cats. Rooted purely in the suicide/immortality setup.
  7.  **Casual & Pitch-Ready:** Conversational ("my idiot friend Dave," "makes you wonder"). Feels like a horrifying anecdote shared over coffee. The "convincing Dave-clones" line lands with the right mix of science and morbid humor.

  **Delivery Tip:** Lean into the exasperated "friend dealing with Dave's nonsense" vibe. The dry, slightly horrified delivery sells the contrast between Dave's cheerful survivorship and the narrator's macabre discoveries.
