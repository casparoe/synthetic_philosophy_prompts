answer: |-
  Here’s a focused, structurally meaningful 5-minute opening frame that embeds the philosophical constraint into the workshop’s DNA, using your jar/figurine case as the engine:

  ---

  **(Start with warm, direct eye contact)**  
  "Good morning. Welcome, diggers and thinkers. We’re here because both our disciplines begin with fragments. Archaeologists piece together potsherds; philosophers, logical shards. But this workshop asks: **What happens when the fragments we expect simply aren’t there?**  

  Consider a Late Bronze Age settlement. You excavate. You find storage jars—dozens—each bearing an administrative seal. Impressive record-keeping. But you find **zero** ritual figurines. Not in pits, not in collapse layers—nowhere. In contexts where clay *should* survive.  

  The easy story? ‘No cult practice here.’ But what if that absence *isn’t* silence? What if it’s a message?  

  **(Lean in slightly, lower pace)**  
  Maybe figurines *did* exist—but were deliberately made of wood, or unfired clay, designed to rot. Why? Because the institution controlling those storage seals *suppressed* rival ritual authority. The absence isn’t noise; it’s evidence of power. The institution didn’t just *leave traces*—**it curated its own invisibility.**  

  **(Shift to broader framing)**  
  So this workshop isn’t about ‘reading beliefs off the remains.’ **It’s about reading the politics of the void.** When pots vanish but seeds linger, when texts burn but ovens stand—*why*? And crucially: **how do institutions engineer their own erasure, or the erasure of others?**  

  **(Address both groups directly)**  
  Diggers: You know taphonomy isn’t random. That pit isn’t neutral. That ‘missing type’ might be equifinality—or censorship.  
  Philosophers: You know underdetermination isn’t just a puzzle—it’s a feature of institutional strategy. Absence *is* data—but data shaped by the very forces we study.  

  **(Final pivot to workshop goals)**  
  So our task isn’t to ‘solve’ the past despite gaps. **It’s to map how gaps become archives.** Over these two days, we won’t promise to reconstruct vanished beliefs. We’ll ask: **Under what conditions do beliefs *choose* to vanish—or get vanished?**  

  Let’s find out. Welcome."  

  ---

  ### Why this works:
  1. **The Case Study Does Heavy Lifting**: Your jar/figurine example isn’t an aside—it’s the core argument. It shows *how* absence is institutional (not random) and *why* it matters.  
  2. **Philosophy is Embedded, Not Garnished**: Underdetermination appears as "equifinality" (digger term) and "institutional strategy" (philosopher lens). The constraint shapes the goal ("We won’t promise to reconstruct vanished beliefs").  
  3. **Respects Both Audiences**: Uses field-specific terms (*taphonomy*, *equifinality*) without explanation (diggers feel seen) while making concepts accessible via concrete stakes ("censorship," "curated invisibility").  
  4. **Reframes the Mission**: "Mapping how gaps become archives" is a actionable, interdisciplinary goal that replaces the naive "read beliefs off remains."  
  5. **Time Discipline**: ~4.5 minutes spoken slowly. No citations, no lectures—just one provocative case driving the frame.  

  **Key move**: You’re not just *discussing* bias; you’re showing how the *institutions under study* weaponize material survival. That forces both groups to confront absence as active, not passive—exactly your structural point.
