answer: |-
  ### Scenario: The Hanseatic Timber Merchants and Inheritance Practices  
  *Context:* 16th-century Baltic port city where Lutheran merchants dominate the timber export trade. Timber operations require large, indivisible capital investments (ships, sawmills, warehousing) and stable credit networks.  

  **Religious Value Narrative:**  
  Lutheran preachers emphasize *ascetic stewardship*—viewing wealth as a divine trust requiring disciplined preservation. They condemn *partible inheritance* (dividing estates among heirs) as indulgent, fragmenting God’s resources. Merchants adopt *primogeniture* (sole inheritance by the eldest son), framing it as moral self-restraint: consolidating assets avoids "wasteful" division and honors God through disciplined capital management.  

  **Structural/Legal Incentive Narrative:**  
  Timmerhandel Guild bylaws mandate a minimum operating capital (e.g., 10,000 marks) for membership. Partible inheritance risks subdividing estates below this threshold, excluding heirs from the guild and forfeiting trade licenses. Simultaneously, maritime insurance contracts require proof of "unencumbered capital" to underwrite voyages—easier with a single, identifiable heir. Primogeniture emerges as a *purely rational* adaptation to these rules, ensuring business continuity.  

  **Ambiguity:**  
  In practice, primogeniture spreads rapidly *alongside* Lutheran ascetic rhetoric. A merchant who adopts it cites religious duty but also secures his son’s guild membership. Historians observe:  
  - Did asceticism *drive* primogeniture?  
  - Did structural pressures *select* for merchants who embraced ascetic rhetoric to legitimize necessity?  
  - Was asceticism merely a *post-hoc justification* for an economically coerced choice?  

  ### Structural Feature Producing Ambiguity:  
  **Capital Thresholds for Market Access** (e.g., Guild minimums, insurance requirements).  

  ### Why This Undermines Culture as Non-Epiphenomenal Cause:  
  The ambiguity arises because the structural feature creates a *functional imperative*: any merchant group facing identical capital thresholds would likely adopt primogeniture (or similar) to survive, *regardless* of cultural values. This exposes three problems for cultural causation:  
  1. **Co-occurrence ≠ Causation:** The synchrony of ascetic rhetoric and primogeniture doesn’t prove values *preceded* or *caused* the practice. Values may be adopted *because* they rationalize structurally mandated behavior.  
  2. **Functional Equivalence:** If groups with divergent values (e.g., Catholic merchants in Riga) adopt primogeniture *when subject to the same thresholds*, the practice is explained by structure alone. Culture becomes interchangeable ornamentation.  
  3. **Directionality Reversal:** Structural needs may *select* for cultural values that best legitimize necessary actions (e.g., asceticism justifying capital concentration). Here, culture is molded by material constraints—not an independent driver.  

  The capital threshold thus reduces culture to an *epiphenomenon*: it may motivate *how* actors describe their actions, but not *why* the action exists. For culture to be an independent cause, it must explain outcomes *unreachable* by structural forces alone—a bar unmet here.
