prompt: |-
  Draft the joint statement that a committed Humean regularist and a committed anti-Humean governing-theorist could both sign after an adversarial collaboration on the metaphysics of physical law, with special attention to conservation laws in quantum mechanics and to the constructed case of "World K"—a universe observationally identical to ours whose fundamental ontology explicitly includes non-empirical "governing" relations that do not alter any regularity.

  Format the document as follows. First, a numbered list of claims both sides accept: about the formal derivation of conservation laws, about what phenomena require explanation (counterfactual robustness, the law/accident distinction, modal language in science), and about which standard arguments each camp takes to be sound but not decisive. Second, a disagreements table in two columns—wording for the Humean side and wording for the anti-Humean side—stating precisely where they differ on whether laws are in the world or in our system, whether counterfactual support requires modal properties, and how each interprets World K. Third, identify at least three cruxes—sub-questions that, if settled, would move at least one party. For each crux, name the concrete argument, thought experiment, or empirical result both agree is relevant, and record in advance each side's predicted assessment of it. Fourth, conclude with a brief assessment of whether any residual disagreement is purely verbal (about "law," "govern," or "necessity") and, if so, exactly which formulations dissolve on analysis.

  Do not request citations, reading lists, or references to particular authors' texts; the deliverable should be constructible from conceptual analysis alone.
reasoning: |-
  We are drafting a joint statement from a committed Humean regularist and a committed anti-Humean governing-theorist after adversarial collaboration. We focus on conservation laws in quantum mechanics and the constructed case of "World K".

  The document has four parts:

  1. **Numbered List of Agreed Claims**: About formal derivation of conservation laws, phenomena requiring explanation (counterfactual robustness, law/accident distinction, modal language in science), and standard arguments each camp takes as sound but not decisive.

  2. **Disagreements Table**: Two columns (Humean and Anti-Humean) stating precisely where they differ on:
     - Whether laws are in the world or in our system
     - Whether counterfactual support requires modal properties
     - Interpretation of World K

  3. **Cruxes**: At least three sub-questions that, if settled, would move at least one party. For each:
     - Name the concrete argument, thought experiment, or empirical result both agree is relevant.
     - Record in advance each side's predicted assessment of it.

  4. **Conclusion**: Brief assessment of whether residual disagreement is purely verbal (about "law", "govern", or "necessity") and, if so, which formulations dissolve on analysis.

  We proceed step by step.

  ### Part 1: Agreed Claims (Numbered List)

  We list claims both sides accept:

  #### A. On the Formal Derivation of Conservation Laws in Quantum Mechanics
  1. Conservation laws (e.g., energy, momentum) in quantum mechanics are derived from symmetries via Noether's theorem in the context of quantum field theory. The time-invariance of physical laws leads to energy conservation, space-invariance to momentum conservation, etc.
  2. In the quantum formalism, the unitary evolution of the state vector (via the Schrödinger equation) preserves the expectation values of conserved quantities when the Hamiltonian is time-independent. This is a mathematical feature of the theory.
  3. The empirical success of quantum mechanics in predicting conserved quantities (e.g., in particle collisions) is a robust fact that any metaphysical account of laws must accommodate.

  #### B. On Phenomena Requiring Explanation
  4. **Counterfactual Robustness**: The laws of nature support counterfactual statements (e.g., "If the particle had been isolated, its momentum would have been conserved"). Both sides agree that such counterfactuals are true and require explanation, though they differ on what grounds them.
  5. **The Law/Accident Distinction**: There is a difference between a law of nature (e.g., conservation of energy) and a mere accidental regularity (e.g., "all gold spheres are less than one mile in diameter"). Any account must explain why we treat these differently (e.g., in induction and explanation).
  6. **Modal Language in Science**: Scientists routinely use modal language (e.g., "must", "necessary", "possible") when describing laws and constraints. This usage is legitimate and must be accounted for by any metaphysical theory of laws.

  #### C. On Standard Arguments Each Camp Takes as Sound but Not Decisive
  7. **Humean's Best System Account (BSA)**: The Humean takes the BSA (which defines laws as the axioms of the system that best balances simplicity and strength) as a sound account of laws. However, the Humean acknowledges that the anti-Humean has objections (e.g., about counterfactuals) that are not trivially dismissed.
  8. **Anti-Humean's Modal Intuitions**: The anti-Humean takes the intuition that laws govern or necessitate as sound, but acknowledges that the Humean has a deflationary account (via BSA) that can mimic many features without primitive modality, and that this account is not obviously incoherent.
  9. **World K (see below)**: Both agree that World K is conceivable and that it poses a challenge to each view. The Humean sees it as supporting the idea that governing relations are superfluous, while the anti-Humean sees it as showing that governing relations are non-empirical but still real. However, both agree that the conceivability of World K does not by itself settle the debate.

  ### Part 2: Disagreements Table

  We present a two-column table. The left column is the Humean view, the right the anti-Humean view.

  | Humean Regularist                                                                                                | Anti-Humean Governing-Theorist                                                                                   |
  |------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|
  | **On the Nature of Laws**: Laws are not part of the fundamental ontology of the world. They are descriptions—summaries of the patterns in the distribution of local matters of particular fact. The laws supervene on the Humean mosaic (the total history of particular events) and are given by the Best System Account (BSA). | **On the Nature of Laws**: Laws are part of the fundamental ontology. They are relations of natural necessity (or governing relations) that exist over and above the particular events. They explain why the regularities hold and are not mere summaries. |
  | **On Counterfactual Support**: Counterfactual statements are made true by the laws as described by the BSA, which is part of our system of representation. The BSA, by being the best system, supports the right counterfactuals without requiring any primitive modal properties in the world. | **On Counterfactual Support**: Counterfactual statements are made true by the modal properties of the world. The laws, being governing relations, have a modal force that grounds the truth of counterfactuals. Without such modal properties, counterfactuals would lack truthmakers. |
  | **On World K**: World K (a universe observationally identical to ours but with added non-empirical governing relations) is a coherent concept. However, since these governing relations make no difference to the Humean mosaic, they are not part of the ontology. The governing relations in World K are a metaphysical fiction; our world is like World K without the governing relations. | **On World K**: World K is a coherent concept. It demonstrates that governing relations are non-empirical (they do not alter the course of events) but are nonetheless real. Our world might be like World K, and the governing relations are part of its fundamental ontology. The fact that they are non-empirical does not make them unreal; they are necessary to explain why the regularities hold. |

  ### Part 3: Cruxes

  We identify at least three cruxes. For each:

  - Name the concrete argument/thought experiment/empirical result.
  - Record each side's predicted assessment.

  1. **Crux: The Status of Counterfactuals in a World Without Governing Relations**
     - **Argument/Thought Experiment**: Consider a world W that is a Humean duplicate of our world (same Humean mosaic) but without any governing relations. The Humean says that in W, the laws (by BSA) are the same as in our world, so counterfactuals are supported. The anti-Humean says that without governing relations, counterfactuals in W lack truthmakers and hence are not true. The thought experiment is: Is W possible? And if so, are the counterfactuals in W true?
       - **Humean Prediction**: W is possible and indeed is our world. The counterfactuals in W are true because they are grounded in the BSA, which supervenes on the mosaic.
       - **Anti-Humean Prediction**: W is not possible because governing relations are necessary for the truth of counterfactuals. If W were possible, then the counterfactuals would not be true because there is nothing to ground them. But since counterfactuals are true in our world, W must not be actual.

  2. **Crux: The Explanatory Power of Governing Relations**
     - **Argument/Thought Experiment**: Why does the universe exhibit regularities at all? The anti-Humean argues that without governing relations, the regularity is a brute fact and hence unexplained. The Humean argues that the regularity is explained by the BSA, which is a summary of the mosaic. The thought experiment: Is there an explanatory gap in the Humean account?
       - **Humean Prediction**: There is no gap. Explanation is a pragmatic matter, and the BSA provides the best explanation we can have. The regularity is explained by the pattern in the mosaic and the BSA captures that pattern.
       - **Anti-Humean Prediction**: There is a gap. The Humean account only describes the regularity but does not explain why it holds. Governing relations provide a deeper explanation: the regularity holds because it is law-governed.

  3. **Crux: The Role of Laws in Scientific Practice**
     - **Empirical Result**: Consider the use of laws in novel predictions and in guiding research (e.g., the discovery of Neptune via deviations from Kepler's laws). Does this practice require that laws have a governing role?
       - **Humean Prediction**: No. The practice is explained by the BSA: the laws are our best summaries, and we use them to predict and guide because they have proven reliable. The success does not require governing relations.
       - **Anti-Humean Prediction**: Yes. The practice relies on the idea that laws govern and hence that deviations indicate something missing (like a planet). Without governing relations, the practice would be unmotivated because the laws would be merely descriptive and not prescriptive.

  ### Part 4: Conclusion on Verbal Disagreement

  We assess whether the residual disagreement is purely verbal.

  - We agree that some of the disagreement is verbal. Specifically:
    - The term "law" is used by the Humean to refer to the axioms of the best system and by the anti-Humean to refer to governing relations. But both agree that there is a regularity and that it is projectible and counterfactually robust.
    - The term "govern" is used by the anti-Humean to denote a primitive relation that explains the regularity. The Humean denies that such a relation exists and interprets "govern" as a metaphor for the descriptive role of laws in the BSA.
    - The term "necessity" is used by the anti-Humean for a modal feature of the world. The Humean reduces it to a feature of our representation (the BSA).

  - However, there is a non-verbal core: 
     - The anti-Humean posits an extra element in the ontology (governing relations) that the Humean denies. This is a substantive metaphysical difference.

  - Formulations that dissolve on analysis:
     - If by "law" we mean "what scientists call laws", both can agree that the laws are the conservation principles derived from symmetries in quantum mechanics. But the anti-Humean will add that these laws are grounded in governing relations, while the Humean will say they are patterns in the mosaic.
     - If by "govern" we mean "constrain what happens", the Humean will say that the laws (as BSA) do constrain in the sense that they describe what must happen given the mosaic, but the anti-Humean will say that they constrain by being a cause-like relation.

  - Conclusion: The disagreement is not purely verbal. There is a substantive ontological dispute about whether governing relations exist. However, the verbal aspect can be minimized by clarifying terms. For instance, both can agree that the laws (as described by BSA or as governing relations) are what make counterfactuals true and explain the regularity. But the underlying ontology remains in dispute.

  ### Final Document Structure

  We now compile the above into the required format.
answer: |-
  ### Joint Statement: Humean Regularist and Anti-Humean Governing-Theorist on the Metaphysics of Physical Law  

  **Preamble**  
  We, a committed Humean regularist and a committed anti-Humean governing-theorist, have engaged in adversarial collaboration to clarify our positions on the metaphysics of physical law. We focus on conservation laws in quantum mechanics and the thought experiment of "World K"—a universe observationally identical to ours but explicitly including non-empirical "governing" relations that do not alter any regularity. Below, we outline points of agreement, disagreements, unresolved cruxes, and an assessment of verbal differences.  

  ---

  ### 1. Agreed Claims  
  Both parties accept the following:  

  #### (a) Formal Derivation of Conservation Laws in Quantum Mechanics  
  1. Conservation laws (e.g., energy, momentum) arise from symmetries (e.g., time-translation invariance) via Noether’s theorem in quantum theories.  
  2. In quantum mechanics, conservation laws are mathematically entailed by the unitary evolution of the Schrödinger equation and the commutation relations of observables.  
  3. These laws are empirically indispensable for predicting outcomes (e.g., particle decay products, scattering amplitudes).  

  #### (b) Phenomena Requiring Explanation  
  4. **Counterfactual Robustness**: Laws must ground true counterfactuals (e.g., "If this system were isolated, momentum would be conserved").  
  5. **Law/Accident Distinction**: Laws (e.g., energy conservation) are distinct from accidental regularities (e.g., "all coins in my pocket are quarters") in supporting explanations, predictions, and inductive inferences.  
  6. **Modal Language in Science**: Scientific practice legitimately uses modal terms (e.g., "must," "necessarily") to describe laws, and any metaphysics of laws must account for this.  

  #### (c) Standard Arguments (Sound but Not Decisive)  
  7. **Humean Best System Account (BSA)**: The Humean affirms BSA (laws = axioms of the simplest, strongest summary of regularities) as internally coherent but grants that it faces challenges in explaining counterfactuals without primitive modality.  
  8. **Anti-Humean Primitive Modality**: The anti-Humean affirms that governing relations explain regularities but grants that their non-empirical nature invites skepticism about epistemic access.  
  9. **World K’s Coherence**: Both agree World K is conceptually coherent and challenges both views: it questions the Humean dismissal of "governing" relations and the anti-Humean demand for their empirical traction.  

  ---

  ### 2. Disagreements Table  
  | **Humean Regularist Position** | **Anti-Humean Governing-Theorist Position** |
  |--------------------------------|---------------------------------------------|
  | **Nature of Laws**: Laws are not part of fundamental ontology. They are descriptive summaries of patterns in particular events (the "Humean mosaic"), defined by the Best System Account. Conservation laws are efficient compressions of quantum symmetries. | **Nature of Laws**: Laws are fundamental ontological relations that govern events. Conservation laws reflect irreducible modal constraints (e.g., energy conservation as a necessary feature of time-translation symmetry). |
  | **Counterfactual Support**: Counterfactuals are made true by the BSA’s role in our epistemic practices. The BSA’s axioms imply which counterfactuals hold (e.g., momentum conservation under isolation), without invoking modal properties in the world. | **Counterfactual Support**: Counterfactuals require mind-independent modal properties (e.g., a governing relation that necessitates momentum conservation). The BSA merely describes—but does not ground—these truths. |
  | **World K**: World K is redundant. Its non-empirical "governing" relations add nothing to the Humean mosaic and are unverifiable. Our world is World K *minus* these relations; they are artifacts of language, not reality. | **World K**: World K reveals that governing relations are real but non-empirical. Our world may include such relations; their invisibility to observation does not negate their role in explaining *why* regularities hold. |

  ---

  ### 3. Cruxes  
  If settled, these sub-questions would move at least one party:  

  #### Crux 1: **Can Counterfactuals Be Grounded Without Primitive Modality?**  
  - **Relevant Argument**: *The "Empty World" thought experiment*: Imagine a world with identical regularities to ours but no governing relations. Are counterfactuals (e.g., "If struck, this match would light") true?  
    - *Humean Prediction*: Yes—counterfactuals supervene on the BSA, which exists in any world with our regularities.  
    - *Anti-Humean Prediction*: No—without governing relations, counterfactuals lack truthmakers; regularity alone is insufficient.  

  #### Crux 2: **Do Governing Relations Explain Regularities or Merely Redescribe Them?**  
  - **Relevant Argument**: *The "Why Regularity?" challenge*: Why does the Humean mosaic exhibit lawlike regularities (e.g., energy conservation) rather than chaos?  
    - *Humean Prediction*: No further explanation is needed; regularities are brute. The BSA describes them parsimoniously.  
    - *Anti-Humean Prediction*: Governing relations explain regularities; without them, the patterns are inexplicable.  

  #### Crux 3: **Does Quantum Indeterminism Undermine Governing Relations?**  
  - **Relevant Empirical Result**: *Quantum measurement outcomes*: Conservation laws hold statistically in quantum mechanics (e.g., energy conservation in particle collisions), but individual events are indeterministic.  
    - *Humean Prediction*: This supports regularity—laws are statistical summaries, not "governors" of individual events.  
    - *Anti-Humean Prediction*: Governing relations operate probabilistically; indeterminism is consistent with modal constraints (e.g., energy conservation as a boundary condition).  

  ---

  ### 4. Conclusion: Residual Disagreement and Verbal Dissolution  
  We agree that **part** of our disagreement is verbal, hinging on the terms **"law," "govern," and "necessity"**:  
  - **Verbal Dissolutions**:  
    - If "law" denotes *only* a descriptive summary, the Humean view absorbs anti-Humean language (e.g., "governance" as metaphorical).  
    - If "govern" requires *causal efficacy*, the anti-Humean position collapses into question-begging.  
    - If "necessity" is stripped of metaphysical weight (e.g., as "inescapability in our models"), the dispute evaporates.  

  However, **non-verbal disagreement persists**:  
  - The anti-Humean insists governing relations are ontologically irreducible (e.g., World K’s relations are real but non-empirical).  
  - The Humean rejects this as unsupported by evidence and ontologically profligate.  

  **Final Assessment**: The core divide is metaphysical (what exists fundamentally?), not scientific. World K exemplifies this: it forces a choice between ontological austerity (Humean) and explanatory depth (anti-Humean). While terminology can be clarified, the disagreement reflects divergent commitments about the architecture of reality.  

  ---  
  **Signed**,  
  [Committed Humean Regularist] & [Committed Anti-Humean Governing-Theorist]
