prompt: |-
  I'm drafting the final exam for an upper-level seminar on rational choice and epistemic symmetry. Write one essay question that students could answer in 90 minutes, aimed at testing whether they grasp superrationality well enough to apply it in a modified setting rather than merely summarizing Hofstadter's symmetric prisoner's dilemma. Introduce a constructed scenario — the Opaque Twin Dilemma — in which two agents share identical reasoning algorithms and all non-indexical beliefs, but each has direct first-person access to a private phenomenal state (for instance, her own present pain intensity) that shifts her utility function in ways the other cannot observe. Ask the student to determine whether superrational cooperation remains rational here, and require them to address three cruxes: whether privileged self-access breaks the symmetry required for superrational reasoning; whether the transparency condition in Hofstadter's argument applies to reasoning processes, mental contents, or both; and whether abandoning superrationality in this asymmetric case undermines it in the standard symmetric case. Provide a model answer and a marking scheme with five must-hit analytical moves (total 25 marks), allocating specific marks to each, together with a one-line note on the characteristic failure mode for each move. The answer should also include a brief self-critical coda stating exactly which argument or empirical consideration — for example, a demonstration that first-person access is always representable as shared information, or a proof that symmetry can be defined over algorithmic structure alone — would change the verdict on whether superrationality survives the asymmetry.
reasoning: |-
  We are creating an essay question for an exam on superrationality, with a twist: the Opaque Twin Dilemma. This scenario introduces private phenomenal states that shift each agent's utility function in unobservable ways, even though the agents share identical reasoning algorithms and non-indexical beliefs.

  The question should ask students to determine whether superrational cooperation remains rational in this modified setting and require them to address three specific cruxes:

  1. Whether privileged self-access breaks the symmetry required for superrational reasoning.
  2. Whether the transparency condition in Hofstadter's argument applies to reasoning processes, mental contents, or both.
  3. Whether abandoning superrationality in this asymmetric case undermines it in the standard symmetric case.

  Additionally, we need a model answer and a marking scheme with five must-hit analytical moves (total 25 marks), with specific marks allocated to each and a one-line note on the characteristic failure mode for each move.

  The model answer should also include a self-critical coda that states exactly which argument or empirical consideration would change the verdict.

  Let's design the question:

  **Essay Question (90 minutes):**

  In his 1983 article "The Prisoner's Dilemma and the Evolution of Cooperation," Douglas Hofstadter introduced the concept of superrationality in the context of the symmetric Prisoner's Dilemma (PD). Superrational agents, sharing identical reasoning processes and non-indexical beliefs, are argued to inevitably cooperate because they recognize that their decision must be the same as the other's, and mutual cooperation yields a better outcome than mutual defection.

  Consider a modified scenario, the **Opaque Twin Dilemma**:

  Two agents, Alice and Bob, are in a PD-like situation. They share identical reasoning algorithms (i.e., their cognitive processes are exactly the same) and all non-indexical beliefs (so they have the same information about the world, including the payoffs and the structure of the game). However, each agent has direct first-person access to a private phenomenal state (e.g., her own present pain intensity) that the other cannot observe. This private state shifts the agent's utility function. For example, if Alice is in intense pain, she might assign a higher utility to defection (say, because she believes defection might lead to quicker relief) than she would otherwise. Bob has no access to Alice's pain, and vice versa, and they both know this.

  Does superrational cooperation remain rational in this Opaque Twin Dilemma? In your answer, address the following three cruxes:

  1. Does the privileged access to one's own phenomenal states break the symmetry required for superrational reasoning? Why or why not?
  2. In Hofstadter's original argument, the transparency condition (i.e., the agents being able to see through each other's reasoning) is crucial. Does this transparency apply to reasoning processes, mental contents, or both? How does the presence of private phenomenal states affect this?
  3. If we conclude that superrationality fails in this asymmetric case, does that undermine superrationality in the standard symmetric PD? Why or why not?

  Your essay should be structured, concise, and demonstrate a clear understanding of superrationality and its foundations.

  ---

  **Model Answer:**

  **Introduction (Setting up the problem):**
  The Opaque Twin Dilemma challenges superrationality by introducing private phenomenal states that asymmetrically shift individual utility functions. While Hofstadter's superrationality relies on perfect symmetry in reasoning and mental contents, the private pain states in this scenario introduce an asymmetry in the agents' utility functions. I argue that superrational cooperation fails in this scenario because the asymmetry breaks the necessary conditions for superrational reasoning.

  **Addressing Crux 1: Privileged self-access and symmetry break**
  Superrationality requires that the agents are identical in all relevant aspects, including their decision-making process and the inputs to that process. In Hofstadter's symmetric PD, the symmetry extends to the utility functions (derived from the same payoff matrix) and the reasoning process. However, in the Opaque Twin Dilemma, each agent has a private phenomenal state that alters her utility function in a way the other cannot know or predict. This breaks the symmetry because Alice and Bob are now effectively facing different decision problems: Alice's utility function is shifted by her private pain, and Bob's by his (which may be different). Therefore, they cannot assume that they will reach the same decision. Since superrationality depends on the agents being able to reason that they will do the same thing, this asymmetry undermines the basis for cooperation. (5 marks)

  *Failure mode for Crux 1: Claiming that the private states don't break symmetry because the reasoning algorithm is the same, without addressing how the inputs (utility functions) are now different.*

  **Addressing Crux 2: Transparency condition in Hofstadter's argument**
  Hofstadter's transparency condition requires that each agent can simulate the other's reasoning exactly because they share the same algorithm and mental contents. This transparency applies to both the reasoning processes and the mental contents (including beliefs and utilities). In the standard PD, the agents share the same utility function (the payoff matrix) and the same reasoning algorithm. In the Opaque Twin Dilemma, the mental contents (specifically, the utility functions) are no longer shared because each agent's utility is shifted by her private state. Thus, the transparency condition is violated because Alice cannot know Bob's utility function (and vice versa), so they cannot simulate each other's reasoning accurately. Therefore, the transparency condition fails for mental contents, even though the reasoning algorithm remains the same. (5 marks)

  *Failure mode for Crux 2: Confusing the reasoning process with the mental contents, and arguing that because the algorithm is the same, transparency holds, without recognizing that the inputs (utilities) are opaque.*

  **Addressing Crux 3: Implications for the standard symmetric case**
  Abandoning superrationality in this asymmetric case does not undermine superrationality in the standard symmetric PD. The standard case assumes perfect symmetry, which is an idealization. The failure in the asymmetric case simply shows that superrationality is fragile and requires strict symmetry. The standard argument remains valid under its own assumptions. However, if one were to argue that the standard symmetric PD is unrealistic because of the possibility of hidden asymmetries (like private states), then it might challenge the applicability of superrationality. But in the idealized symmetric setting, the argument stands. (5 marks)

  *Failure mode for Crux 3: Arguing that the failure in the asymmetric case invalidates the symmetric case because both involve reasoning about another agent, without recognizing the difference in assumptions.*

  **Advanced Analysis: The role of algorithmic identity without content identity**
  Even though the reasoning algorithms are identical, the agents in the Opaque Twin Dilemma cannot rely on superrationality. This is because the decision output depends not only on the algorithm but also on the inputs (including the utility function). Since the utility functions are different and private, the agents cannot predict each other's actions. Therefore, each must consider the other as an independent agent with potentially different utilities, and the game reduces to a standard PD with incomplete information. (5 marks)

  *Failure mode: Asserting that algorithmic identity alone suffices for superrationality without considering the input dependence of the algorithm's output.*

  **Self-critical coda: What would change the verdict?**
  The verdict that superrationality fails in this case would be overturned if it could be demonstrated that the private phenomenal states are necessarily representable in a way that becomes common knowledge. For instance, if both agents have the same algorithm and non-indexical beliefs, and if the phenomenal states are determined by the same external factors (which are part of non-indexical beliefs), then the agents could deduce each other's states. Alternatively, if phenomenal states are algorithmically generated in a deterministic way from shared inputs, then symmetry might be restored. (5 marks)

  *Failure mode: Suggesting an implausible or irrelevant consideration (e.g., if the agents could communicate) that does not address the core issue of private states.*

  **Conclusion:**
  In the Opaque Twin Dilemma, the introduction of private phenomenal states that shift utility functions breaks the symmetry and transparency required for superrationality. Thus, superrational cooperation is not rational. However, this does not invalidate superrationality in the standard symmetric case, which remains a compelling solution under its idealizations.

  ---

  **Marking Scheme (Total: 25 marks):**

  1. **Crux 1: Privileged self-access and symmetry break (5 marks)**  
     - Award 5 marks for clearly explaining how private phenomenal states break symmetry by altering utility functions and thus making the decision problems different.  
     - Characteristic failure mode: Claiming symmetry remains because the reasoning algorithm is the same, without addressing the change in utility functions.

  2. **Crux 2: Transparency condition (5 marks)**  
     - Award 5 marks for correctly identifying that Hofstadter's transparency requires both reasoning processes and mental contents (especially utilities) to be identical and accessible, and explaining that the private states make mental contents (utilities) non-transparent.  
     - Characteristic failure mode: Arguing that transparency of the reasoning algorithm alone is sufficient, ignoring the opacity of mental contents (utilities).

  3. **Crux 3: Implications for the standard case (5 marks)**  
     - Award 5 marks for arguing that the failure in the asymmetric case does not undermine the symmetric case, because the symmetric case depends on ideal symmetry which is absent in the modified scenario.  
     - Characteristic failure mode: Claiming that the asymmetric case undermines the symmetric case by showing that symmetry is too fragile or unrealistic.

  4. **Advanced Analysis: Algorithmic identity without content identity (5 marks)**  
     - Award 5 marks for explaining that even with identical algorithms, the differing inputs (utility functions) lead to different outputs, so superrationality fails.  
     - Characteristic failure mode: Asserting that algorithmic identity alone ensures identical outputs, ignoring the role of inputs.

  5. **Self-critical coda (5 marks)**  
     - Award 5 marks for providing a plausible condition that would restore superrationality (e.g., if the private states become common knowledge through shared determinants or algorithmic determinism from shared inputs).  
     - Characteristic failure mode: Suggesting an ad-hoc fix (like communication) that isn't inherent to the setup or that violates the conditions.

  This structure should test the students' ability to apply superrationality beyond the standard case and to think critically about the underlying assumptions.
answer: |-
  ### Essay Question: The Opaque Twin Dilemma and Superrationality  
  **Time Allotment:** 90 minutes  

  **Scenario:**  
  In the **Opaque Twin Dilemma**, two agents (Agent A and Agent B) face a symmetric Prisoner’s Dilemma (PD) payoff structure. They share identical reasoning algorithms (i.e., their cognitive processes are perfectly mirrored) and all non-indexical beliefs (e.g., knowledge of the game rules, payoffs, and physical laws). However, each agent has direct, private access to a phenomenal state (e.g., their own real-time pain intensity) that shifts their subjective utility function. For instance, Agent A’s pain might increase her immediate aversion to defection, while Agent B’s pain (unobserved by A) might amplify his temptation to defect. Critically, neither agent can observe the other’s phenomenal state or its utility effects.  

  **Prompt:**  
  Does superrational cooperation remain rational in the Opaque Twin Dilemma? Your essay must:  
  1. **Define superrationality** in Hofstadter’s symmetric PD, emphasizing its core assumptions.  
  2. **Address three cruxes**:  
     - Does privileged access to private phenomenal states break the symmetry required for superrationality?  
     - Does Hofstadter’s transparency condition apply to reasoning processes, mental contents, or both—and how does privacy affect this?  
     - If superrationality fails here, does this undermine its validity in the standard symmetric PD?  
  3. **Conclude** with a self-critical coda: Identify *one specific argument or empirical consideration* that, if valid, would reverse your verdict on superrationality in this dilemma.  

  ---  
  ### Model Answer  
  **Introduction**  
  Superrationality, per Hofstadter, argues that two identical rational agents in a symmetric PD will cooperate because they recognize their decisions must be identical ("I am you") and that mutual cooperation dominates mutual defection. This relies on *perfect symmetry*: identical reasoning algorithms, utility functions, and mental contents. In the Opaque Twin Dilemma, private phenomenal states disrupt utility symmetry while preserving algorithmic identity. I argue superrational cooperation **fails** here due to broken symmetry, though this does not invalidate the standard case.  

  **Crux 1: Privileged Self-Access Breaks Symmetry (5 marks)**  
  Superrationality requires agents to treat their counterpart as a "twin" whose decision is necessarily identical. Private phenomenal states violate this by creating *indexical asymmetry*: Agent A’s pain modifies her utilities in a way Agent B cannot replicate or anticipate. Since utilities now differ, A and B face distinct decision problems. Agent A cannot assume B shares her shifted utilities, so she cannot infer B will choose identically. Thus, privileged self-access breaks the symmetry, making superrational cooperation irrational.  
  *Failure mode: Claiming symmetry persists because algorithms are identical, ignoring utility asymmetry.*  

  **Crux 2: Transparency Applies to Mental Contents, Not Just Processes (5 marks)**  
  Hofstadter’s transparency condition demands access to *both* reasoning processes *and* mental contents (e.g., beliefs, utilities). In the standard PD, transparency ensures agents mutually simulate each other’s decisions. Here, phenomenal states are mental contents (utilities) that are opaque. While reasoning algorithms remain transparent, the utility-shifting mental contents are inaccessible. Agent A cannot simulate B’s decision because she lacks knowledge of B’s private state and its utility effects. Transparency thus fails for mental contents, sabotaging superrationality.  
  *Failure mode: Arguing transparency of reasoning alone suffices, neglecting mental content opacity.*  

  **Crux 3: Asymmetry Does Not Undermine the Standard Case (5 marks)**  
  Abandoning superrationality here does not threaten the symmetric PD. The standard case assumes *idealized symmetry*—a consistent utility function and shared mental contents. The Opaque Twin Dilemma relaxes this by adding private states, revealing superrationality’s fragility under asymmetry. Yet, in the symmetric PD, agents legitimately assume identical utilities, making "I am you" reasoning sound. Criticizing the standard case based on this variant commits a *false equivalence*: it conflates idealized symmetry with real-world asymmetries Hofstadter explicitly brackets.  
  *Failure mode: Asserting that symmetry is always unrealistic, thus invalidating the idealization.*  

  **Advanced Analysis: Algorithmic Identity Cannot Compensate for Utility Opacity (5 marks)**  
  Even with identical algorithms, outputs depend on inputs. Private phenomenal states act as differential inputs (utility shifts), leading to divergent decisions. Agent A must model B as having *unknown* utilities, reducing the game to an asymmetric PD with incomplete information. Rational play then defaults to standard game theory (e.g., maximizing expected utility), not superrational cooperation. Superrationality requires *input symmetry*, which phenomenally shifted utilities destroy.  
  *Failure mode: Assuming algorithmic identity guarantees identical outputs despite differing inputs.*  

  **Self-Critical Coda: The Conditional Reversal (5 marks)**  
  My verdict would reverse if phenomenal states are *necessarily representable as non-indexical beliefs*. For example, if pain intensity (and its utility effects) is determined by shared external factors (e.g., a public environmental cue) and both agents know this, they could deduce each other’s states. Transparency would then restore symmetry, allowing superrational cooperation.  

  **Conclusion**  
  Superrational cooperation fails in the Opaque Twin Dilemma due to broken symmetry in mental contents (utilities). However, this is consistent with Hofstadter’s model, which remains valid under strict symmetry. Superrationality is robust only when agents are true "twins" in all relevant mental states.  

  ---  
  ### Marking Scheme (25 Marks Total)  
  | **Analytical Move** | **Marks** | **Characteristic Failure Mode** |  
  |----------------------|-----------|---------------------------------|  
  | **Crux 1:** Correctly identifies private phenomenal states as breaking symmetry by creating indexical utility asymmetry. | 5 | Ignores utility shifts; claims symmetry holds due to identical algorithms. |  
  | **Crux 2:** Distinguishes transparency of reasoning processes vs. mental contents, showing opacity in the latter sabotages superrationality. | 5 | Confuses processes with contents; argues algorithmic transparency suffices. |  
  | **Crux 3:** Defends the standard symmetric PD by distinguishing idealized symmetry from this asymmetric case. | 5 | Conflates cases; claims asymmetry universally undermines superrationality. |  
  | **Advanced Analysis:** Explains that algorithmic identity fails without input symmetry (utilities), forcing standard game-theoretic play. | 5 | Assumes identical algorithms guarantee identical decisions regardless of inputs. |  
  | **Self-Critical Coda:** Proposes a plausible condition for reversing the verdict (e.g., phenomenal states deducible from shared factors). | 5 | Suggests irrelevant fixes (e.g., "if they communicated") or vague reversals. |  

  **Grading Notes:**  
  - **A (21–25):** Hits all five moves; precise on symmetry/transparency; coda is specific and plausible.  
  - **B (16–20):** Addresses cruxes but muddles processes/contents; coda weak.  
  - **C (11–15):** Superficial on asymmetry; misdefines superrationality; omits coda.  
  - **D/F (0–10):** Summarizes Hofstadter without applying to scenario; misses >2 cruxes.
