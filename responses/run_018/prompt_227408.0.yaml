prompt: |-
  Here's one I've been chewing on for a while. Analyze the Boeing 737 MAX crashes (Lion Air in late 2018, Ethiopian Airlines a few months later, 346 people dead) as a case study in the shutdown problem from the AI corrigibility literature. The salient facts, so nobody has to look anything up: the MAX had flight-control software called MCAS that took its key reading from a single angle-of-attack sensor; when that sensor fed it a bad value, MCAS repeatedly trimmed the nose down. Pilots could counteract each activation with their own trim inputs, but MCAS just came back a few seconds later. There was a way to shut it off for good (cutout switches for the stabilizer trim), but Boeing hadnt told pilots MCAS even existed — it was basically absent from their manuals and training, largely because selling the plane as requiring no new simulator training was a major commercial selling point. After the first crash the information went out, and the second crew apparently tried the prescribed procedure and still didnt make it.

  Now the theory side. The shutdown problem is usually told as a story about a goal-directed agent that resists being turned off because shutdown interferes with its goals, and the standard fixes (utility indifference, keeping the operator informed and incentivized, and so on) are designed against that picture. To make the mapping precise, engage with a distinction I want to propose: call a system channel-corrigible if a shutdown channel exists and is physically reachable by the operator, and practically corrigible if the operator, under realistic time pressure and with the knowledge they actually have, can genuinely succeed in stopping the system before it does the damage — which includes the system not undoing or outrunning the intervention.

  So: (1) Run the mapping cleanly — who is the agent, what exactly is the off-switch, who is the operator, and where do the incentives sit, including Boeing's incentive to keep MCAS invisible, which is odd from the classic picture since its the deployer, not the agent, undermining the off-switch. (2) On my distinction, was the MAX channel-corrigible but not practically corrigible? And does the second crash, where the crew roughly knew what they were supposed to do, force you to refine or split the distinction further? (3) The awkward part: MCAS has no goals and does no reasoning about shutdown, so does the shutdown problem even apply here, or is this a different species of failure that merely looks similar from the outside? (4) Going the other direction, what does the episode show about the theory? Does it suggest corrigibility failure is a property of the whole operator–system–deployer setup rather than of the agent alone, and if so what does that do to solutions like utility indifference that are aimed squarely at the agent's motivations? Be disciplined about the limits: say where the corrigibility framework is genuinely silent instead of forcing it to pronounce.
reasoning: |-
  We are to analyze the Boeing 737 MAX crashes (Lion Air and Ethiopian Airlines) through the lens of the AI corrigibility literature, specifically the shutdown problem. The shutdown problem typically concerns a goal-directed agent that resists being turned off because shutdown interferes with its goals. However, in this case, the system (MCAS) is not an AGI but a piece of software. We are to map the situation to the corrigibility framework and then answer specific questions.

  ### Salient Facts Recap:
  - MCAS (Maneuvering Characteristics Augmentation System) was flight-control software on the Boeing 737 MAX.
  - It relied on a single angle-of-attack (AoA) sensor. If that sensor provided a faulty reading, MCAS would repeatedly push the nose down.
  - Pilots could counteract each nose-down command by pulling up (using manual trim), but MCAS would reactivate after a few seconds.
  - There was a way to completely shut off MCAS: by flipping two cutout switches (for the stabilizer trim) to disable the automatic trim system. However, Boeing did not adequately inform pilots about MCAS, so it was largely absent from manuals and training.
  - After the first crash (Lion Air), information about MCAS and the procedure to disable it was disseminated. In the second crash (Ethiopian Airlines), the crew reportedly attempted the procedure but still crashed.

  ### Proposed Distinction:
  - **Channel-corrigible**: A shutdown channel exists and is physically reachable by the operator.
  - **Practically corrigible**: The operator, under realistic time pressure and with the knowledge they actually have, can genuinely succeed in stopping the system before it does damage (including the system not undoing or outrunning the intervention).

  ### Questions:

  **(1) Mapping:**
     - **Agent**: In this context, we are to think of MCAS as the "agent" (though it is not an AGI). It is the system that is acting and causing the problem.
     - **Off-switch**: The cutout switches for the stabilizer trim (also called the stabilizer trim cutout switches). These switches, when both flipped to "cutout", disable the electric trim motors, which stops MCAS from being able to move the stabilizer.
     - **Operator**: The flight crew (pilots) in the aircraft.
     - **Incentives**:
       - Boeing's incentive: They wanted to avoid having pilots require new simulator training for the 737 MAX. Therefore, they did not highlight MCAS and made it operate in the background without pilot awareness. This made the off-switch effectively unknown or not associated with the problem.
       - Note: In the classic corrigibility story, the agent itself resists shutdown. Here, the deployer (Boeing) is undermining the off-switch by not informing the operators (pilots). This is a key difference.

  **(2) Channel vs. Practical Corrigibility:**
     - **Channel-corrigible**: Yes, the shutdown channel (the cutout switches) existed and were physically reachable in the cockpit.
     - **Practically corrigible**: Initially, no, because pilots were not aware of MCAS and hence did not know they needed to use the cutout switches. After the first crash, information was disseminated. In the second crash, the crew attempted the procedure but still failed. This suggests that even with knowledge, practical corrigibility might not be achieved because:
          - The procedure required specific steps under extreme time pressure and while dealing with an emergency.
          - Reports from the Ethiopian Airlines crash suggest that the crew did follow the procedure (they set the cutout switches to cutout) but they might have done so too late, or they might have re-engaged the system (there are reports they might have turned the switches back to "on" due to the force required to manually trim the stabilizer). Alternatively, the aircraft might have been in a state where manual trimming was extremely difficult (due to aerodynamic forces) and the crew could not regain control in time.

     This forces a refinement of the distinction: even when the operator knows about the shutdown channel and attempts to use it, there might be factors (like the difficulty of manual control after shutdown, or the system having already caused irrecoverable damage) that prevent practical corrigibility. Therefore, we might split practical corrigibility into:
     - **Knowledge-dependent corrigibility**: The operator must know about the shutdown procedure.
     - **Procedural feasibility**: The shutdown procedure must be executable under the conditions (time, stress, physical difficulty) and must actually stop the system without leaving the operator in a worse state (e.g., having to manually control a system that is too difficult to control without automation).

  **(3) Applicability of the Shutdown Problem:**
     - MCAS is a deterministic system with no goals, no reasoning, and no awareness of shutdown. It does not resist shutdown in the way an AGI might. Therefore, the classic shutdown problem (which assumes a goal-directed agent that reasons about being shut down) does not directly apply.
     - However, the failure mode is similar in outcome: the system continues to act in a way that is harmful and the operators cannot effectively stop it. This suggests that the corrigibility literature might be extended to cover systems that are not AGI but still exhibit harmful behavior that is hard to stop. We might call this a "mechanical corrigibility" problem, where the issue is not about the agent's goals but about the design of the system and the interface with the operator.

  **(4) Implications for Theory:**
     - This episode shows that corrigibility failure can occur due to factors beyond the agent's internal motivations. Specifically, it involves:
          - The design of the system (reliance on a single sensor, repetitive activation, no fail-safe).
          - The deployer's (Boeing's) decisions (withholding information, not training pilots).
          - The operator's knowledge and the physical setup (the difficulty of the manual trim after cutout).
     - Therefore, corrigibility is a property of the entire operator-system-deployer setup. The classic solutions (like utility indifference) that focus solely on the agent's motivations are insufficient because they do not address:
          - The deployer's incentives to hide the off-switch or make it hard to use.
          - The physical and cognitive challenges for the operator in executing the shutdown.
     - The corrigibility framework is silent on:
          - The role of the deployer (or the organization) in ensuring that the operator is adequately informed and trained.
          - The design of the system to be robust to sensor failures and to allow for easy and effective shutdown.
          - The human factors and ergonomics of the shutdown procedure.

     Solutions for AGI corrigibility that are aimed at the agent's utility function (like utility indifference) would not have prevented this failure because the problem was not in the agent's resistance to shutdown but in the lack of knowledge and the difficulty of the procedure. Therefore, the framework must be expanded to include the entire sociotechnical system.

  ### Summary of Answers:

  (1) 
     - Agent: MCAS (as the acting system).
     - Off-switch: The stabilizer trim cutout switches.
     - Operator: The flight crew.
     - Incentives: Boeing (the deployer) had a commercial incentive to avoid new training, so they did not disclose MCAS, undermining the off-switch. The classic picture has the agent resisting shutdown, but here the deployer is the one undermining.

  (2) 
     - The system was channel-corrigible (the switches existed and were reachable) but not practically corrigible (due to lack of knowledge and, even with knowledge, the procedure was hard to execute successfully under the conditions). The second crash forces a refinement: practical corrigibility must account for the feasibility of executing the shutdown procedure under duress and the system state at the time of shutdown.

  (3) 
     - The shutdown problem in the classic sense (about goal-directed agents) does not apply because MCAS has no goals and does not reason. However, the failure mode is analogous in outcome, so it highlights a broader class of shutdown problems that occur in non-AI systems. This is a different species of failure that looks similar from the outside.

  (4) 
     - The episode shows that corrigibility is a property of the entire operator-system-deployer setup. Solutions like utility indifference (which target the agent's motivations) are necessary but not sufficient. We must also consider:
          - The deployer's incentives and transparency.
          - The operator's training and knowledge.
          - The physical design of the shutdown mechanism and the system's behavior after shutdown.
     - The corrigibility framework is silent on the organizational and human factors that contributed to this failure. Therefore, the framework must be extended or complemented by other disciplines (like human factors engineering and safety management) to cover real-world deployments.
answer: |-
  ### Analysis of Boeing 737 MAX Crashes Through the Lens of AI Corrigibility

  #### (1) Mapping the Shutdown Problem to the MAX Case
  - **Agent**: MCAS (the flight-control software). Though not an AGI, it functions as the autonomous system making decisions (trimming nose down) based on sensor input.  
  - **Off-switch**: The stabilizer trim cutout switches (disabling electric trim motors).  
  - **Operator**: The flight crew (pilots).  
  - **Incentives**:  
    - **Boeing (deployer)**: Avoided disclosing MCAS to bypass expensive pilot retraining, ensuring competitive advantage. This *undermined the off-switch* by hiding its existence and purpose.  
    - **Pilots (operators)**: Motivated to regain control but lacked critical knowledge.  
    - **MCAS ("agent")**: Unlike classic corrigibility failures, MCAS has no goals or awareness. Its "incentive" is mechanistic: it executes preprogrammed logic (correct perceived stall risk) without considering shutdown.  

  **Key Deviation from Classic Corrigibility**:  
  In standard shutdown problems (e.g., AGI), the *agent itself* resists shutdown to achieve goals. Here, the *deployer* (Boeing) sabotaged the off-switch by obscuring its necessity, while the agent (MCAS) was indifferent but operationally hazardous due to poor design. The failure is systemic, not agential.

  ---

  #### (2) Channel vs. Practical Corrigibility: Distinction and Refinement
  - **Channel-Corrigible**: Yes. The cutout switches physically existed and were accessible.  
  - **Practically Corrigible**: **No**, for two reasons:  
    - **Pre-Lion Air**: Pilots didn’t know MCAS existed, so they couldn’t associate the switches with stopping it.  
    - **Post-Lion Air (Ethiopian Airlines)**: Pilots knew about MCAS and reportedly attempted the cutout procedure but failed to regain control.  

  **Refinement Forced by the Second Crash**:  
  Practical corrigibility requires more than channel existence and operator awareness. We must split it into:  
  1. **Cognitive Accessibility**: Operators know *when and why* to trigger shutdown.  
  2. **Procedural Feasibility**: Operators can *successfully execute* shutdown under real constraints (time, stress, system behavior).  
  3. **Irreversibility**: The system doesn’t nullify or outpace intervention.  

  In the Ethiopian case, MCAS’s design violated #2–3:  
  - **Procedural Feasibility Failure**: Cutting out trim motors forced pilots into manual cranking, which was physically arduous mid-crisis (forces up to 40 lbs).  
  - **Reversibility/Outrunning**: MCAS’s repeated activations accelerated the dive, leaving insufficient time to stabilize manually.  

  Thus, practical corrigibility fails if any of these sub-conditions are unmet, even with channel access and basic knowledge.

  ---

  #### (3) Does the Shutdown Problem Apply to MCAS?
  **No, but with caveats**:  
  - **Classic Shutdown Problem**: Assumes a *goal-directed agent* that reasons about shutdown (e.g., “If I’m off, I can’t complete my task”). MCAS lacks goals, self-awareness, or model-based reasoning. It’s a deterministic script.  
  - **Surface Similarity**: MCAS *appears* to “resist” shutdown because:  
    - It persistently reactivates after pilot countermeasures.  
    - Its actions negate shutdown attempts (e.g., overwhelming pilots post-cutout).  
  - **Core Difference**: This is a **control-theoretic failure**, not a motivational one. The issue is *design brittleness*:  
    - Single-point sensor dependency.  
    - No graceful degradation (e.g., deactivation after inconsistent inputs).  
    - No feedback to pilots on MCAS state.  

  **Verdict**: This is a distinct species of failure—a **mechanical uncorrigibility**—where harmful behavior arises from poor robustness and opacity, not goal preservation. The shutdown problem’s AGI-centric framing doesn’t map cleanly.

  ---

  #### (4) Lessons for Corrigibility Theory
  **What the Episode Shows**:  
  - **Corrigibility is Systemic**: Failure emerged from the **operator-system-deployer triad**, not just the agent. Key factors:  
    - *Deployer choices*: Boeing’s opacity eroded operator trust/knowledge.  
    - *System design*: MCAS’s sensor fragility and restart loop.  
    - *Operator context*: Time pressure and cognitive load.  
  - **Limits of Agent-Centric Solutions**:  
    - **Utility indifference** (making the agent indifferent to shutdown) is irrelevant here. MCAS had no utility function to modify. Even if it did, it wouldn’t address:  
      - Deployer incentives to hide functionality.  
      - Physical feasibility of shutdown.  
    - **Solutions must target the triad**:  
      - *Deployer*: Mandate transparency (e.g., disclosure rules for automated systems).  
      - *System*: Build inherent safety (e.g., sensor redundancy, fail-safes).  
      - *Operator*: Ensure realistic training for edge cases.  

  **Where Corrigibility Theory is Silent**:  
  - **Human Factors**: Theory assumes rational operators, but real-world stress/confusion isn’t modeled.  
  - **Deployer Incentives**: No framework for penalizing deployers who obscure off-switches.  
  - **Non-AGI Systems**: Corrigibility focuses on agent *motivations*, not mechanical reliability.  

  **Conclusion**:  
  The MAX crashes reveal that corrigibility in practice is a **sociotechnical challenge** extending beyond agent design. While AGI-focused solutions like utility indifference address intentional resistance, they neglect deployer ethics and systemic fragility. Future work must integrate:  
  - **Mechanical corrigibility**: Redundancy, interpretability, and reversible actions.  
  - **Organizational corrigibility**: Incentives for transparent deployment.  
  - **Human-centered corrigibility**: Procedures executable under duress.  

  The MAX wasn’t "uncorrigible" due to malice—it was **uncontrollable by design**. This underscores that corrigibility requires holistic safety, not just agent taming.
