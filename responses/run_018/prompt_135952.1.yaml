answer: |-
  Below is a diagnostic taxonomy for sorting stances on scientific realism in light of the pessimistic meta-induction (PMI). The tree is built around concrete historical cases (Newtonian gravitation, phlogiston, caloric, ether, Bohr atom) and what, if anything, survives in their successor theories. Each split is labeled with a specific claim about these cases, and leaves are tagged with standard positions (where they exist) or marked "unnamed." Awkward commitments—per the request—focus on explaining why current quantum field theory (QFT) should not be subject to PMI-style skepticism. Unoccupied combinations and indistinguishable leaves are flagged at the end.

  ### Taxonomy Tree: Stances on Realism Given the Pessimistic Meta-Induction

  **Root Question:**  
  *Does the empirical and predictive success of a radically false theory (e.g., Newtonian gravitation, phlogiston, caloric, ether, or the Bohr atom) provide any reason to retain belief in its unobservable ontology?*

  - **Yes** → Proceed to **Split 1** (What is retained?)  
  - **No** → Leaf: **Pessimistic Anti-Realism** (e.g., Laudan-inspired historical anti-realism)  
    - *Awkward commitment:* Must explain why QFT's empirical success justifies trust in its unobservables (e.g., virtual particles) when equally successful theories like ether or caloric were abandoned, without appealing to special pleading about "modern scientific maturity."

  ---

  **Split 1:** *What, if anything, survives in the successor theory that justifies retention?*  
  *(Based on cases: Newtonian gravitation → GR; phlogiston → oxygen; caloric → kinetic theory; ether → SR; Bohr atom → QM)*  

  - **Only entities also present in the successor theory** (e.g., atoms retained from Dalton to QM, ether discarded in SR) → Proceed to **Split 2A**  
  - **Only formal/mathematical structures, regardless of ontology** (e.g., Poisson equations from Newtonian gravity in GR, Bohr model's energy quanta in QM, Fresnel's equations in SR) → Proceed to **Split 2B**  
  - **Nothing at all** → Leaf: **Pessimistic Anti-Realism** (as above)  

  ---

  **Split 2A:** *Does the historical pattern of entity-retention support cumulative approximation toward one true ontology?*  
  *(Cases: Phlogiston → oxygen (no retention), but atoms → electrons (retention); caloric discarded, but electromagnetic fields retained)*  

  - **Yes, cumulative approximation occurs** (e.g., electrons survived multiple revolutions) → Leaf: **Entity Realism** (e.g., Hacking, Cartwright)  
    - *Awkward commitment:* Must explain why QFT's ontology (e.g., quarks) is not like phlogiston—given entity survival is patchy (caloric gone, ether gone)—without a clear criterion for "essential" vs. "disposable" entities.  
  - **No, the notion of approximate truth collapses without stable ontology** (e.g., ether and caloric were once "essential" but vanished) → Leaf: **Unnamed** (entity-focused but non-convergent)  
    - *Awkward commitment:* Must justify trusting current entities (e.g., gluons) as "real" when historical cases show entity survival is contingent and non-teleological, risking ad hoc exemptions for present theories.  

  ---

  **Split 2B:** *Does the historical pattern of structure-retention support cumulative approximation toward one true ontology?*  
  *(Cases: Newtonian gravity’s formalism → GR; Fresnel’s equations → SR; Bohr model → Schrödinger equation)*  

  - **Yes, cumulative approximation occurs** (e.g., mathematical structures "refine" toward truth) → Leaf: **Epistemic Structural Realism** (e.g., Worrall)  
    - *Awkward commitment:* Must explain how QFT's structures (e.g., gauge symmetry) are "approximately true" when successor ontologies (e.g., quantum fields vs. particles) radically diverge, unlike the smooth transition from Fresnel to Maxwell.  
  - **No, the notion of approximate truth collapses without stable ontology** (e.g., Bohr model’s orbits discarded in QM, though equations partially survive) → Leaf: **Ontic Structural Realism** (e.g., Ladyman & Ross)  
    - *Awkward commitment:* Must defend why QFT’s mathematical structures (e.g., path integrals) describe mind-independent reality when historical structures (e.g., ether-based wave equations) were ontologically unmoored.  

  ---

  ### Unoccupied Combinations & Ambiguities
  1. **Gap: Entity retention *without* Split 2A/B (e.g., "entities survive, but I reject convergence *and* collapse")**  
     - *Status:* **Incoherent**—If entities survive but ontological frames shift radically (per PMI), claiming retention *requires* taking a stance on whether this reflects convergence or collapse. Neutrality is untenable.  
  2. **Gap: Structure retention *without* Split 2A/B (e.g., "structures survive, but convergence/collapse is irrelevant")**  
     - *Status:* **Unexplored**—No major position avoids this split; structural realists must address whether history shows progress toward truth or dissolution of ontological anchors.  

  ### Indistinguishable Leaves
  - **Entity Realism (Split 2A "Yes") vs. Unnamed (Split 2A "No")**  
    - The tree cannot separate these if one argues that *some* entities (e.g., electrons) converge while others (e.g., ether) do not, yet still endorses entity-based realism. Both require ad hoc distinctions, but the unnamed stance denies convergence entirely, making it distinct in principle (though messy in practice).  

  ### Summary of Leaves
  | Leaf Path                     | Standard Position              | Awkward Commitment (Re: QFT & PMI)                                                                 |
  |-------------------------------|--------------------------------|---------------------------------------------------------------------------------------------------|
  | Root → No                     | Pessimistic Anti-Realism       | Explain why QFT warrants belief in unobservables when equally successful theories (ether) failed. |
  | Yes → Entities → Convergence  | Entity Realism                 | Justify why quarks are not "new phlogiston" given inconsistent entity survival.                   |
  | Yes → Entities → Collapse     | Unnamed                        | Defend current entities (gluons) as real despite non-convergent history.                          |
  | Yes → Structures → Convergence| Epistemic Structural Realism   | Reconcile QFT's structural continuity with ontological ruptures (e.g., virtual particles).        |
  | Yes → Structures → Collapse   | Ontic Structural Realism       | Argue QFT's structures are ontologically fundamental when history shows structural revisions.     |

  This taxonomy forces clarity by anchoring stances to specific historical cases and their successors, avoiding appeals to abstract principles or philosophers. To self-diagnose, choose a path by answering:  
  1. Does past success (e.g., Newtonian gravity) justify belief in its unobservables?  
  2. If yes, what survives—entities (e.g., atoms) or structures (e.g., equations)?  
  3. Does this retention imply convergence (e.g., toward "true" electrons) or collapse of truth (e.g., ether as cautionary tale)?  

  The awkward commitments reveal tensions in extending the stance to QFT, exposing vulnerabilities to PMI.
