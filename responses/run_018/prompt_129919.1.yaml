answer: |-
  **Workshop Proposal: Administrative Affiliations and the Demos Boundary Problem in Church-State Relations**

  **1. Research Question:** Do state-administered religious affiliation mechanisms (e.g., Germany's Kirchensteuer opt-out lists, England's Crown-Parliament governance of the CofE) create functionally distinct "shadow membership" bodies wielding coercive fiscal or governance power, and is such administrative enforcement a more severe demos-boundary failure than purely symbolic state establishment?

  **2. Gap in Existing Literature:** Standard secularism discourse focuses on principles of neutrality (US), laïcité (France), or symbolic establishment (England), primarily debating state *action* or *endorsement*. It largely neglects how state *administrative machinery* creates and maintains *de facto religious membership rolls* that confer coercive power (taxation, governance rights) without democratic accountability *within* the religious body itself. Debates about the "demos boundary" (defining the politically sovereign people) rarely intersect with these specific church-state administrative mechanisms, leaving unexamined whether state-enforced affiliation constitutes a unique category of boundary violation.

  **3. Method: Conceptual Taxonomy Development:** The project employs comparative conceptual analysis of four key cases:
  *   **Germany:** Kirchensteuer system – state-collected tax based on civil registry affiliation, requiring formal opt-out. Creates a state-defined "fiscal membership" with coercive power (tax liability) for the churches.
  *   **England:** Crown appointment of bishops/archbishops and parliamentary governance of the CofE. Creates a state-defined "governance membership" (those represented by Crown/Parliament actions) with coercive power over church doctrine/structure.
  *   **France:** Laïcité – Strict separation; state avoids defining religious membership administratively. No direct shadow membership creation.
  *   **USA:** Disestablishment & Free Exercise – State avoids maintaining religious affiliation lists for coercive purposes; membership is purely voluntary/associational.
  The analysis will construct a taxonomy linking:
      *   **Type of State Mechanism** (Tax Collection, Governance Appointment, Separation, Non-Interference)
      *   **Resulting "Shadow Membership" Body** (Fiscal Members, Governed Members, None, Voluntary Members)
      *   **Nature of Coercive Power Delegated** (Taxation Authority, Governance Authority, None, None)
      *   **Democratic Accountability Pathway** (Within State? Within Religious Body? Absent?)

  **4. Expected Output: A Framework for Classifying Demos-Boundary Failures:** The primary result will be a conceptual framework classifying types of demos-boundary failures arising from church-state administrative entanglement:
  *   **Coercive Capture:** State machinery directly enables religious bodies to coercively bind individuals defined by state records (Germany's fiscal model).
  *   **Representational Override:** State structures impose governance on a religious body, creating a state-defined "membership" subject to that governance (England's Crown-Parliament model).
  *   **Symbolic Encroachment:** State endorsement without coercive administrative mechanics (traditional establishment concerns).
  *   **Boundary Integrity:** Clear separation where religious membership is purely associative and non-state-mediated (France/US ideals).
  This framework will explicitly evaluate the *relative severity* of boundary failures, specifically testing the hypothesis that **administratively enforced affiliation (Coercive Capture, Representational Override) constitutes a more fundamental violation of demos boundaries than symbolic establishment alone.**

  **5. Defining "Failure":** A demos-boundary failure occurs when state action defines or sustains a body exercising coercive authority (fiscal or governance) over individuals, where the membership of that body and the lines of accountability for that authority are severed from democratic processes *within the demos* or *within the voluntary association*. Successive failures occur if tax rolls (Germany) and symbolic governance (England) are shown to rely on fundamentally similar state-mediated, undemocratic membership constructs for exercising coercive power. Failure is *not* defined by the presence of religion in public life, but by the state's role in mandating affiliation for coercive purposes.

  **6. Scope & Limitations (4 Months):** This is a purely conceptual and comparative legal-institutional analysis. It will:
  *   Analyze constitutional/statutory frameworks and administrative procedures defining church affiliation in the four jurisdictions.
  *   Develop the taxonomy and framework through structured comparison of these mechanisms.
  *   Identify the specific coercive powers enabled and the accountability gaps created.
  *   Assess the relative severity of boundary failures.
  It will **not**:
  *   Conduct empirical research (surveys, interviews).
  *   Undertake deep archival or historical analysis.
  *   Provide comprehensive policy prescriptions.
  *   Examine non-Christian religions in depth (though the framework aims for general applicability).
  The focus remains strictly on conceptualizing the mechanisms and their boundary implications within the defined timeframe.
