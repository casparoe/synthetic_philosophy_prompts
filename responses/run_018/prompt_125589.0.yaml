  The "case against" requires steelmaning Nyāya's position. They'd argue testimony is perception-dependent at both ends: the expert's initial discovery and the hearer's perceptual validation of reliability. The chain metaphor works - it's anchored in perception, just indirectly. Nyāya isn't naive about needing personal verification for everything.

  For the bottom line, I'll split the verdict: internally consistent? Yes, because Nyāya builds safeguards. Epistemically shaky for societies? Actually yes, when institutions weaken. The replication crisis shows what happens when perception-testimony links decay. Modern knowledge isn't doomed, but requires healthy verification mechanisms Nyāya would endorse.

