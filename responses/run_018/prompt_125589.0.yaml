answer: |-
  Here’s that argument broken down as requested, keeping it conversational and focused on the logic:

  ### 1. The Setup: Perception as the Bedrock
  Nyāya epistemology is all about reliable sources of knowledge (*pramāṇas*). They list a few key ones, but perception (*pratyakṣa*) and inference (*anumāna*) are the heavy hitters. Perception is treated as the absolute foundation – the "touch the stove, feel the burn" kind of knowing. It's direct, immediate, and doesn't rely on anything else to be valid. You see red, you *know* red (assuming your senses are working right). Inference builds *on* perception: you see smoke (perception) and infer fire (based on past perceptions of smoke always being with fire).

  Testimony (*śabda*) – getting knowledge from a trustworthy source – is also accepted as a genuine *pramāṇa*. Nyāya argues that reliable words from a reliable speaker *can* give you knowledge, just like seeing something yourself. But crucially, they position it as secondary. Why? Because the *justification* for trusting testimony *ultimately* traces back to perception. You trust the scientist because you've perceived science working before, or you perceived her credentials, or you perceived the consistency in her past reports. Perception is the gold standard; other sources are legitimate, but they derive their validity by being anchored in perceptual reality somewhere down the line.

  ### 2. The Case For: Śabda Undermining the Perceptual Base
  Here’s the rub: if śabda is this powerful, independent source of knowledge, especially in a complex world where we *have* to rely on experts, does it start to hollow out perception’s foundational role? Think about modern science. Most of us accept quantum mechanics, climate models, or vaccine efficacy based *entirely* on śabda – trusting peer-reviewed journals and expert consensus. We haven't run the particle accelerator, crunched the global climate data, or replicated the vaccine trials ourselves. Our "knowledge" is built on layers of testimony. This creates a huge epistemic gap: we're *told* about the perceptual evidence, but we haven't *perceived* it ourselves.

  This is where things get shaky for perception’s foundation. The **replication crisis** is a perfect example. For years, findings in psychology, medicine, and other fields were accepted based on śabda – peer-reviewed papers, respected labs. But when people *tried* to go back and actually *perceive* the results for themselves (run the experiments again), a huge number failed. The testimony said "X is true," but direct perceptual verification showed otherwise. The problem? By the time this happened, careers were built, policies were made, and textbooks were written – all on śabda that perception couldn't easily check until much later, if ever. Perception was supposed to be the anchor, but it was miles downstream, unable to effectively verify the massive ship of expert testimony it was supposed to underpin.

  Furthermore, śabda can sometimes *override* or *reinterpret* our own perception. Your doctor tells you your symptoms (which you perceive clearly) are caused by Y, not X. You trust the śabda (the expert diagnosis) over your raw perception of the symptoms, even though you haven't perceived the disease mechanism or test results yourself. While this is often necessary, it highlights how śabda becomes the *functional* bedrock for complex knowledge, pushing perception back to a role of just confirming surface-level inputs, not the deep structure of what we "know." If perception is the foundation, but most of our important knowledge floats on an ocean of śabda that perception struggles to verify directly, is perception *really* foundational anymore, or just the first step for *individuals*?

  ### 3. The Case Against: The Nyāya Counter
  A Nyāya philosopher wouldn’t panic. They'd argue this misses the point. Śabda *doesn't* ultimately float free. That expert testimony you rely on? The *expert* gained *their* knowledge through perception and inference. The peer-reviewed paper? It reports experiments *based* on perceptual data collected by the researchers. The chain might be long – scientist perceives data, writes paper (śabda), you read it – but every legitimate link in the śabda chain *starts* with someone's direct perception and is *validated* by the possibility of perceptual verification (like replication). The replication crisis, they'd say, *proves* Nyāya right! It shows śabda failing precisely when the perceptual anchor points (the original experiments) were weak or fraudulent. Perception *is* still foundational; śabda is just a long, efficient conveyor belt for perceptual knowledge. When the belt breaks, you go back to the source (perception) to fix it.

  ### 4. Bottom Line
  So, does śabda clash with perception being foundational? **Logically, within Nyāya's own system, no.** They build in safeguards: śabda must come from a reliable source whose knowledge *is* perception-based, and it *must* be potentially verifiable through perception. The replication crisis exposes bad śabda, not a flaw in the theory.

  **However, does this mean expert-heavy societies are on shaky ground? Absolutely, potentially.** Not because śabda *inherently* undermines perception, but because **complex systems make it incredibly hard to maintain the vital perceptual links.** When śabda chains get too long, institutions become opaque, replication is expensive, or trust erodes, the connection back to the foundational perceptual verification weakens. Societies become vulnerable to cascading failures of śabda (misinformation, irreproducible science) precisely *because* individuals can't personally verify everything perceptually. The Nyāya framework is logically sound, but relying *heavily* on śabda in a complex world creates massive practical risks if the systems ensuring its reliability (and its perceptual grounding) break down. The foundation (perception) is still there, but the building (expert knowledge) gets so tall and complex that checking the foundation becomes a monumental, often neglected, task.
