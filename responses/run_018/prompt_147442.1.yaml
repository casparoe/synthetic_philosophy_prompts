answer: |-
  Below is a logically structured decision tree addressing whether qualia survive "quining" (the Chase-Sanborn-style argument that treating phenomenal properties as theoretical posits leads to contradiction). The tree is built from logical space, starting with the **synthetic-cortex case**: a subject whose neurons are replaced 1:1 with functionally identical silicon analogues, preserving all behavior and cognition, who reports "the qualitative feel is exactly the same." Nodes are concrete questions answerable without philosophy labels, yielding 6 leaves (including one unnamed view and one rare/unnamed combination). Empty branches are flagged with diagnoses. Philosophers are mapped *after* the logical structure.

  ---

  ### **Decision Tree: Do Qualia Survive Quining?**
  **Root Case**: Synthetic Cortex Replacement  
  *All sensory neurons replaced with silicon analogues; subject reports "qualia unchanged" with identical behavior/cognition.*

  #### **Q1: Can this report be false despite identical behavior?**  
  *(i.e., could qualia differ without behavioral evidence? Tests "privacy" of qualia)*  
  - **Yes** → Qualia are **private** (proceed to Q2).  
  - **No** → Qualia are **publicly manifest** (proceed to Q3).  

  ---

  #### **Branch A: Q1 = Yes** (Qualia private)  
  **Q2: Is a property allowing undetectable variation (no behavioral trace) a coherent theoretical posit?**  
  *(Tests Chase-Sanborn "incoherence" claim)*  
  - **Yes** → Property coherent (proceed to Q3).  
  - **No** → Property **incoherent** (proceed to Q3).  

  **Q3: Do phenomenal concepts (e.g., "what it's like to see red") refer to something real?**  
  - **Yes, and referent is ineffable** (cannot be fully expressed).  
  - **Yes, and referent is effable** (can be described/analyzed).  
  - **No, concepts are empty** (refer to nothing).  

  ##### *Leaves for Branch A*:  
  - **A1 (Q2=Yes, Q3=Ineffable)**:  
    Qualia are **real, private, and ineffable**.  
    *Mapping*: Rare view (e.g., McGinn's "cognitive closure"). Unnamed; few defend due to epistemic worries.  
  - **A2 (Q2=Yes, Q3=Effable)**:  
    Qualia are **real, private, but effable**.  
    *Mapping*: **Standard Non-Reductive Realism** (e.g., Chalmers). Survives quining by rejecting ineffability.  
  - **A3 (Q2=Yes, Q3=Empty)**:  
    **Error theory**: Qualia are coherent but uninstantiated.  
    *Mapping*: Unnamed; logically possible but rarely held (no major philosopher).  
  - **A4 (Q2=No, Q3=Empty)**:  
    **Strong Eliminativism**: Qualia are incoherent posits; concepts empty.  
    *Mapping*: Dennett. Chase-Sanborn succeeds; "qualia" rejected.  

  ##### *Empty Branches for A*:  
  - *Q2=No + Q3=Real (any)*: Incoherent properties cannot be real. **Diagnosis**: Contradiction (if Q2 denies coherence, Q3 cannot affirm existence).  

  ---

  #### **Branch B: Q1 = No** (Qualia publicly manifest)  
  **Q3: Do phenomenal concepts refer to something real?**  
  *(No Q2 here: if qualia are behaviorally manifest, "undetectable variation" is moot.)*  
  - **Yes, and referent is ineffable**.  
  - **Yes, and referent is effable**.  
  - **No, concepts are empty**.  

  ##### *Leaves for Branch B*:  
  - **B1 (Q3=Ineffable)**:  
    Qualia **real but ineffable** despite behavioral tie.  
    *Diagnosis*: **Empty branch**. Ineffability contradicts public manifestness (if behavior fixes qualia, they must be expressible).  
  - **B2 (Q3=Effable)**:  
    Qualia are **real, effable, and not private**.  
    *Mapping*: **Restricted Realism** (e.g., Lewis-type analytic functionalism). Saves qualia by abandoning privacy/ineffability.  
  - **B3 (Q3=Empty)**:  
    **Eliminativism/behaviorism**: No qualia beyond behavior.  
    *Mapping*: Ryle (category error) or radical behaviorism.  

  ---

  ### **Summary of Leaves**
  1. **A1**: Real, private, ineffable (unnamed; e.g., McGinn-esque).  
  2. **A2**: Real, private, effable (standard non-reductive realism; Chalmers).  
  3. **A3**: Coherent but uninstantiated (error theory; unnamed).  
  4. **A4**: Incoherent and empty (strong eliminativism; Dennett).  
  5. **B2**: Real, public, effable (restricted realism; Lewis).  
  6. **B3**: Empty concepts (eliminative behaviorism; Ryle).  

  ---

  ### **Key Notes**
  - **Unseparated Pairs**:  
    **A4 (Dennett) and B3 (Ryle)** agree on "no qualia" but diverge on *why*:  
    - A4 rejects qualia as *incoherent* (Q2=No).  
    - B3 rejects qualia as *redundant* (Q1=No, Q3=Empty), without invoking incoherence.  
    The tree separates them via Q1/Q2, but their eliminativist conclusions might overlap in practice.  
  - **Settled vs. Contested**:  
    - **Settled**: Debate exists; quining forces choices about privacy/ineffability (e.g., no view keeps both *and* survives A4-style eliminativism).  
    - **Contested**:  
      - Whether Chase-Sanborn succeeds (Q2 hinges on this).  
      - Whether saving qualia requires abandoning privacy (B2 vs. A2) or ineffability (A2 vs. A1).  
  - **Empty Branches**:  
    - *Q2=No + Q3=Real*: Incoherence precludes existence.  
    - *B1 (Q3=Ineffable)*: Publicly manifest properties cannot be ineffable.  

  ---

  ### **How to Use This Tree**  
  - **For your seminar**: Start with synthetic-cortex intuitions → trace paths using Q1–Q3 → assign labels *after* logical positions are clear.  
  - **Debate focus**: Key splits are Q1 (privacy) and Q2 (incoherence threat). Attack/defend these nodes to test resilience of qualia.  
  - **Nuance**: Non-reductive realists (A2) accept privacy *without* ineffability; functionalists (B2) reject both. No consensus exists.  

  This tree isolates core commitments, exposes tensions (e.g., ineffability vs. manifestness), and shows why Chase-Sanborn remains pivotal.
