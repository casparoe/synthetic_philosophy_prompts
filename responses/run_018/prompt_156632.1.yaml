  - Fail: Symbols are inextricably tied to the neural substrate.
  - Flag: Partial separation but tight coupling.

  **Step 3: Temporal Precedence**
  - Check control flow: Do symbols appear before the substrate changes they cause?
  - Pass: Symbols are generated and then used to direct the substrate.
  - Fail: Substrate changes always precede symbol generation.
  - Flag: Circular or simultaneous dynamics.

  **Inconclusive Cases**: 
