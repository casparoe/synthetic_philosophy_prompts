answer: |-
  Below is a reusable 20-minute screening procedure to assess top-down symbol causation in AI architectures based solely on documentation. It follows your three-part structure and includes clear pass/fail thresholds, PI escalation points, and handling of hard-coupled cases. The procedure is designed for non-experts and assumes access to architecture diagrams, module descriptions, and control flow documentation.

  ---

  ### **Screening Procedure for Symbol Causation**
  **Time Budget:** 20 minutes (3 min for Step 0 setup, 5-6 min per step)  
  **Input:** Architecture docs (system overview, component specs, data flow diagrams).  
  **Output:**  
  - ✅ **Pass**: Evidence of top-down symbol causation.  
  - 🚩 **Substrate-only**: Symbols are epiphenomenal (riding the substrate).  
  - ⚠️ **Escalate to PI**: Ambiguous or values-based judgment needed.  

  ---

  #### **Step 0: Prep Work (3 min)**  
  - **Skim docs** for:  
    - *Symbol layer*: Look for explicit symbolic components (e.g., token buffers, logical rules, knowledge graphs).  
    - *Substrate*: Identify low-level mechanics (e.g., neural activations, attention weights, tensor operations).  
    - *Interfaces*: Note connections between symbols and substrate (e.g., encoders/decoders, attention gates).  
  - **Flag key components** on a diagram for quick reference.  

  ---

  #### **Step 1: Direct Symbol-to-Substrate Intervention (5 min)**  
  **Question:** *Can symbols directly alter substrate behavior?*  
  **How to check:**  
  - Trace control flow from symbol layer to substrate operations. Look for:  
    - Symbolic outputs *modifying* substrate parameters (e.g., tokens gating neural pathways, rules pruning attention weights).  
    - Conditional logic (e.g., "IF [symbol] THEN update [substrate tensor]").  
  - Ignore passive/read-only interactions (e.g., substrate *reading* symbols without feedback).  

  **Pass (✅):**  
  - Docs show symbols actively reconfigure/redirect substrate (e.g., "plan tokens modulate LSTM hidden states").  
  - *Example pass:* Symbols trigger substrate updates via a dedicated control module.  

  **Fail (🚩):**  
  - Symbols are only *inputs* (e.g., perception → symbols) or *outputs* (e.g., substrate → symbols) with no feedback.  
  - *Example fail:* Symbols are decoded from substrate but never fed back.  

  **Escalate (⚠️):**  
  - Vague descriptions (e.g., "emergent interaction" without mechanics).  
  - Partial intervention (e.g., symbols affect only 10% of substrate pathways).  

  ---

  #### **Step 2: Substrate-Invariance (Counterfactual Independence) (6 min)**  
  **Question:** *Would symbol behavior persist if the substrate changed?*  
  **How to check:**  
  - Assess modularity:  
    - Could the symbol layer run on a non-neural substrate (e.g., CPU vs GPU) without functional change?  
    - Is the symbol layer *implemented* by the substrate (🚩) vs *interfacing* with it (✅)?  
  - Look for abstraction: Symbols defined independently (e.g., discrete tokens, graphs) vs. emergent (e.g., "patterns in activations").  

  **Pass (✅):**  
  - Symbols are abstract (e.g., stored in a separate SQL-like memory) and substrate-agnostic.  
  - Docs allow swapping substrate (e.g., "symbolic planner works with any perception backend").  

  **Fail (🚩):**  
  - Symbols are inseparable from substrate mechanics (e.g., "reasoning tokens are attention head outputs").  
  - No counterfactual support (e.g., changing substrate breaks symbols).  

  **Escalate (⚠️):**  
  - Partial invariance (e.g., symbols abstract but bound to specific tensor ops).  
  - Claims of "emergence" without separation.  

  ---

  #### **Step 3: Temporal Precedence (6 min)**  
  **Question:** *Do symbols *cause* substrate changes or vice versa?*  
  **How to check:**  
  - Analyze data flow timelines:  
    - Find instances where symbols *precede* substrate updates (e.g., symbol → substrate → next symbol).  
    - Reject correlations (e.g., simultaneous updates).  
  - Focus on loops: Symbols should initiate cycles, not just conclude them.  

  **Pass (✅):**  
  - Clear causal chain (e.g., "symbol buffer updates before gradient step").  
  - Symbols trigger substrate resets (e.g., new goal → reinitializes hidden states).  

  **Fail (🚩):**  
  - Substrate always leads (e.g., activations → generate symbols → next activations).  
  - Time-synced updates (e.g., symbols and substrate change in same op).  

  **Escalate (⚠️):**  
  - Bidirectional loops with unclear start point.  
  - "Soft" precedence (e.g., symbols *influence* but don’t initiate).  

  ---

  #### **Hard-Coupled Feedback Cases (Automatic ⚠️)**  
  **If any of these apply, stop and escalate to PI:**  
  1. **Recursive entanglement**: Symbols and substrate co-update in a single operation (e.g., fused attention-symbol layers).  
  2. **No clear separation**: Docs describe symbols as "emergent properties" with no dedicated module.  
  3. **Dynamic re-binding**: Symbols redefine their own substrate mapping mid-process.  

  ---

  ### **Application to Examples**  

  #### **Case 1: Classic Symbolic Planner with Neural Perception**  
  - *Architecture*: Neural net (perception) → symbols → rule-based planner → action.  
  - **Step 1 (Intervention)**:  
    - Symbols (planner outputs) send actions to actuators but *don’t* feed back to perception/substrate.  
    - **Verdict**: 🚩 Fail (no top-down loop to neural front-end).  
  - **Step 2 (Invariance)**:  
    - Planner is code-based (substrate-invariant); perception is neural.  
    - **Verdict**: ✅ Pass (symbols decoupled from perception substrate).  
  - **Step 3 (Precedence)**:  
    - Symbols (plan) precede action but *not* perception updates.  
    - **Verdict**: 🚩 Fail (substrate → symbols only).  
  - **Overall**: 🚩 **Substrate-only** for perception. Symbols don’t shove the neural substrate.  

  ---

  #### **Case 2: Reasoning LLM with Chain-of-Thought (CoT) Feedback**  
  - *Architecture*: CoT tokens → attention mechanism → hidden states → next tokens (loop).  
  - **Step 1 (Intervention)**:  
    - Tokens (symbols) directly update hidden states via self-attention.  
    - **Verdict**: ✅ Pass (tokens "gate" residual streams).  
  - **Step 2 (Invariance)**:  
    - Tokens are embeddings; no abstraction (e.g., "cat" token ≠ abstract concept).  
    - **Verdict**: 🚩 Fail (symbols are activation patterns).  
  - **Step 3 (Precedence)**:  
    - Tokens from step *t* causally affect hidden states at *t+1*.  
    - **Verdict**: ✅ Pass (tokens temporally precede updates).  
  - **Hard-Coupling?**: CoT tokens *are* the substrate (token embeddings ≡ input vectors).  
  - **Overall**: ⚠️ **Escalate to PI** with notes:  
    - *Tokens exhibit top-down push (Steps 1/3 pass) but are substrate-bound (Step 2 fail). Hofstadter’s "strange loop" – symbols/substrate are inseparable. Likely not "real" causation by your criteria.*  
    - **You won’t like this**: It’s top-down *in a technical sense*, but symbols are just "symms bubbling up" – no autonomy.  

  ---

  ### **What This Procedure Can’t Settle**  
  1. **Emergent semantics**: Whether symbols "mean" anything (beyond syntax).  
  2. **Illusory causation**: Cases where top-down control is mimicked by bottom-up dynamics.  
  3. **Scale-dependence**: If symbols only work in specific compute regimes (e.g., large vs small models).  
  4. **Ethical "values" calls**: Whether coupled systems (like LLMs) "count" as having real symbol causation.  

  **Final Tip**: If docs are sparse, focus on data flow diagrams – arrows from symbols *to* substrate ops are key. Escalate liberally when in doubt; Hofstadter-style debates often hinge on philosophy, not engineering.
