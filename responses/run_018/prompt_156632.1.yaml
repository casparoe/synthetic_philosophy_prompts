    - The CoT tokens are fed back into the model as input (via the token stream) and influence the next hidden states (substrate). 
  - **Step 1 (Intervention)**:
    - Check: The CoT tokens (symbols) are part of the input and thus directly affect the hidden states (substrate) via the transformer's self-attention and feedforward mechanisms. 
    - *Result*: Pass. The tokens are symbols and they are shoving the substrate (hidden states) around.
  - **Step 2 (Substrate-Invariance)**:
    - Check: The symbols (tokens) are embedded into vectors and processed by the neural network. The same token sequence would not necessarily produce the same hidden states if the substrate (the neural weights) were changed. Moreover, the symbolic behavior (the reasoning) is entirely implemented by the neural substrate and cannot be separated. You cannot replace the transformer with a different substrate without retraining and expect the same behavior. 
