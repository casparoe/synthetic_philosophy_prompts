  Existing theories like Baker’s constitution or mereological essentialism treat objects synchronically (same place, same time). Baker’s "unity relation" ignores diachronic and modal dimensions, while mereological essentialism rejects change altogether. Both fail to engage with the clay’s potential for reshaping over time—a gap the proposal exploits.  

  For methodology, the art conservation angle is smart. Conservators juggle material replacement with identity preservation (e.g., "This is still Rembrandt’s painting despite new varnish"). Comparing this to the clay’s modal resilience could reveal if process logic applies beyond metaphysics. Weeks 1-3 should ground classical debates, then pivot to 4D and process ontologies, with conservation as a case study.  

