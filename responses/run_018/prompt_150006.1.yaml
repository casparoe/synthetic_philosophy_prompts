answer: |-
  Here is a full specification of desiderata for evaluating contractualist resolutions of the aggregation problem, followed by an assessment of key approaches:

  **Desiderata for an Adequate Contractualist Resolution:**

  1.  **Accommodate Numbers-Matter Intuition (Non-Negotiable Preference):**
      *   **Phenomenon:** Standard rescue cases (e.g., save 1 vs. save 5).
      *   **Distinction:** Must distinguish the *strength of the moral reason* to save the larger group from the reason to save the smaller group/individual. It need not endorse strict aggregation.
      *   **Status:** Widely held moral intuition; failure to accommodate it is a significant cost, though not strictly incompatible with contractualism's core.

  2.  **Preserve Pairwise Justifiability (Non-Negotiable Core):**
      *   **Phenomenon:** All cases, especially those involving multiple claims (standard rescue, asymmetric interdependence).
      *   **Distinction:** Justification to each affected individual must be central. An action is wrong if *anyone* can reasonably reject a principle permitting it, given the burdens *they* bear and the alternatives available *to them*.
      *   **Status:** Definitional core of Scanlonian contractualism. Non-negotiable.

  3.  **Maintain Non-Aggregation Constraint (Non-Negotiable Core):**
      *   **Phenomenon:** Cases where many small harms sum to a large total burden vs. one large harm (e.g., many minor headaches preventing one death).
      *   **Distinction:** Must prevent the straightforward summing of smaller burdens across individuals to outweigh a single large burden to one individual in pairwise justification. Rejects utilitarianism's direct interpersonal summing.
      *   **Status:** Core commitment distinguishing contractualism from utilitarianism. Non-negotiable.

  4.  **Handle Asymmetric Interdependence (Negotiable Preference):**
      *   **Phenomenon:** Cases where harms are not independently distributed (e.g., diverting a threat from A&B to C, where A&B would *only* be harmed together).
      *   **Distinction:** Must account for how the *relationship between potential victims* affects the justification to each. Distinguish direct burdens on individuals from indirect effects stemming from their interdependence.
      *   **Status:** Important test case for robustness; failure suggests an overly simplistic model, but not strictly definitional.

  5.  **Resolve Intergenerational/Non-Identity Cases (Negotiable Preference):**
      *   **Phenomenon:** Cases where different choices affect *who exists* (e.g., policy causing lesser harm to future generation F1 vs. alternative policy causing greater harm to different future generation F2).
      *   **Distinction:** Must provide justification *to the specific individuals who exist* under the chosen policy, even though the alternative policy would have created different individuals who cannot complain. Avoids the Non-Identity Problem undermining comparison.
      *   **Status:** Crucial for practical scope; failure undermines applicability to long-term policy, but solutions vary within contractualism.

  6.  **Distinguish Individual Weight & Aggregate Force (Non-Negotiable Core):**
      *   **Phenomenon:** Standard rescue cases & headache/death cases.
      *   **Distinction:** Must explain the difference between the *intrinsic weight of a single individual's claim/reason* and the *overall moral force generated by multiple similar claims* in a choice situation, without simply summing the weights.
      *   **Status:** Core to understanding *how* contractualism accommodates numbers mattering without aggregation. Non-negotiable.

  **Tension:** Desiderata (2) Pairwise Justifiability and (3) Non-Aggregation Constraint appear jointly incompatible with (1) Numbers-Matter Intuition in standard rescue cases. If justification must be addressed to each individual separately and we cannot aggregate small burdens to outweigh a large one, how can the fact that *five* individuals each face a large burden (death) generate a stronger reason than the burden faced by *one* individual, when justifying to the single individual who would be left to die? Satisfying (1) while strictly adhering to (2) and (3) is the central challenge.

  **Concise Scorecard Against Desiderata:**

  1.  **Scanlon (Reasonable Rejection & Weighted Burdens):**
      *   Accommodates (1) by arguing the *burden* of rejection shifts: the single person's reason to reject being left behind weakens when the alternative is leaving *five* behind, as their complaint is less reasonable compared to the complaint each of the five would have. Distinguishes (6) (weight of individual claim vs. force in context). Preserves (2) & (3) by framing the shift in burden within pairwise justifiability, avoiding summation. Struggles significantly with (5) as pairwise justification to non-existent individuals is incoherent, and handling (4) (interdependence) requires complex, sometimes controversial, interpretations of burdens.

  2.  **Taurek (Numbers Don't Count):**
      *   Flatly rejects (1), arguing saving the one or the five via a coin flip is permissible. Strongly upholds (2) & (3): justification is strictly pairwise; leaving one to die cannot be justified *to them* by pointing to benefits to others. Easily handles (4) & (5) by treating individuals atomistically; interdependence and non-identity don't introduce new justificatory challenges beyond the individual burdens. Fails the widely held numbers-matter intuition (1) and struggles to explain the distinction (6) beyond denying aggregate force exists.

  3.  **Threshold-Sensitive Contractualism:**
      *   Aims to accommodate (1) by arguing that once a sufficient *number* (threshold) of similar claims exist, the character of the justification changes. The complaint of the single individual becomes unreasonable *because* so many others share an identical complaint. Attempts to preserve (2) by making the unreasonableness of rejection contingent on the *context* (number of others). Tries to maintain (3) by denying the threshold implies aggregation of smaller burdens. Distinction (6) becomes contextual. Faces challenges explaining the *basis* and *location* of the threshold within pairwise justifiability (2), potentially making it ad hoc. Handling (4) is difficult if thresholds require identical/independent claims, and (5) remains challenging without further modification.
