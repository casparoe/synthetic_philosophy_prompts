prompt: |-
  I'm a program officer at a mid-sized city's Office of Newcomer Integation — we cover about 200k people and every month I have to evaluate proposals for refugee placement, language-slot allocations, and employer-sponsored housing clusters. The board keeps asking whether each plan respects the "solidarity-velocity constraint," basically the idea that integration can't outrun the welfare state's ability to keep the fiscal reciprocity and social trust that make redistribution legitimate. I need a reusable decision procedre I can actually run in thirty minutes, grounded in what the philosophy of immigration actually says about this trade-off rather than vibes or headlines. Give me a flowchart in words: the questions to ask in order, what counts as a passing answer at each step, where it stops with a hard no, where it hands the call to a person because it's values not facts, and where it only says yes-with-conditions. Then run it on three cases: (1) placing fifty families in a neighborhood with strained school budgets but strong volunteer networks; (2) approving a factory dormitory that skips language classes but guarantees jobs and tax contributions; (3) expanding a pilot that improved local tax compliance but angered long-time residents who feel replaced. Make sure one of these spits out an answer I'll probably hate, and be honest about where the procedre misfires for a small city like ours. End with a line that reads Verdict: [the exact point where human judgment must take over].
reasoning: |-
  We are designing a decision procedure based on philosophical principles of immigration, focusing on the "solidarity-velocity constraint". The constraint emphasizes that integration must not outpace the welfare state's ability to maintain fiscal reciprocity and social trust, which underpin the legitimacy of redistribution.

  Key principles from immigration philosophy that are relevant:
  1. **Reciprocity**: The idea that both newcomers and the host society have mutual obligations. Newcomers are expected to contribute (economically and socially) and the host society is expected to provide support for integration.
  2. **Social Trust**: The maintenance of social cohesion and trust among existing residents is crucial for the sustainability of the welfare state and social programs.
  3. **Fiscal Sustainability**: The costs of integration should not overwhelm the local budget, leading to a backlash or erosion of public services for existing residents.

  We'll build a flowchart that asks a series of questions. The procedure is designed to be run in about 30 minutes. It has:
  - Passing answers (continue to next step or approve)
  - Hard stops (reject the proposal)
  - Points where human judgment is required (because it's about values, not facts)
  - Conditional approvals (yes, but with conditions)

  Flowchart:

  Step 1: **Fiscal Impact on Public Services**
     - Question: Does the proposal create a net positive fiscal impact within 24 months OR, if negative, is the impact fully offset by dedicated funding (e.g., federal grants, private sponsors) without diverting existing local resources?
     - Passing: Yes (net positive within 24 months OR negative impact fully offset by dedicated funding).
     - Hard stop: No (and no offset) -> Reject.
     - Conditional: If the fiscal impact is negative but partially offset, then conditionally approve with requirement to secure full funding within 6 months. Otherwise, reject.

  Step 2: **Social Trust Assessment**
     - Question: Does the proposal include measurable mechanisms to build or maintain social trust? (e.g., structured interactions between newcomers and host community, transparent communication about benefits to the community, addressing specific concerns of residents)
     - Passing: Yes (with specific, robust mechanisms).
     - Conditional: If mechanisms are weak or absent, then conditionally approve with requirement to add such mechanisms (e.g., mandatory community liaison, public forums) and monitor trust via surveys.
     - Hard stop: No (and the proposal is likely to cause significant, immediate erosion of trust, e.g., by concentrating newcomers in an already segregated area without any integration efforts) -> Reject.

  Step 3: **Reciprocity and Long-Term Integration**
     - Question: Does the proposal ensure that newcomers have a clear pathway to economic self-sufficiency and civic participation? (e.g., language acquisition, job training, access to employment, civic education)
     - Passing: Yes (with clear, funded pathways).
     - Conditional: If pathways are unclear or underfunded, then conditionally approve with requirement to establish or fund these pathways (within a set timeline).
     - Hard stop: No (and no plan to develop such pathways) -> Reject.

  Step 4: **Scalability and Precedent**
     - Question: If this proposal becomes the standard for all future similar cases, would it still be sustainable and acceptable? (This is a values-based question about setting a precedent)
     - Human judgment required: This step requires the board to deliberate because it involves values and long-term vision. The procedure stops here and hands over to the board for a discussion and vote.

  Now, we run the three cases:

  Case 1: Placing fifty families in a neighborhood with strained school budgets but strong volunteer networks.

  Step 1: **Fiscal Impact**
     - Fact: Strained school budgets. We must check if the proposal includes dedicated funding to cover the additional school costs (e.g., federal impact aid, nonprofit support). If not, the impact is negative and not offset -> conditional approval: require securing funding for schools within 6 months? Or if there is strong volunteer network, maybe they can offset some non-fiscal costs? But volunteers don't pay for teachers or books. So unless there is funding, it fails step 1.
     - Assume: The proposal has no dedicated funding. Then it fails step 1 without offset -> conditional? Actually, if there is a strong volunteer network, that might help with non-fiscal burdens (like tutoring, after-school programs) but not the core budget. So the fiscal impact on the school budget remains. We need to see if the proposal has an offset. If not, then we require condition: secure funding for the school impact within 6 months. Otherwise, reject.

  Step 2: **Social Trust**
     - The neighborhood has strong volunteer networks, which is a positive. The proposal might leverage these for integration. So if the proposal includes using these networks to foster interactions (e.g., buddy systems, community events), then it passes. If not, we conditionally require it.

  Step 3: **Reciprocity**
     - The proposal is for placement, so we must check if it includes language classes, job search support, etc. The case doesn't specify. We assume it does because it's a standard placement? But the budget strain might affect these services. So if the proposal does not include these, we require conditions.

  Step 4: **Scalability**
     - Hand to the board.

  Given the constraints, let's assume the proposal does not have dedicated funding for schools. Then:

  Step 1: Conditional approval (if they secure funding within 6 months). Otherwise, it would be a reject.

  But let's run it in the procedure:

  - Step 1: Negative fiscal impact (on schools) and no dedicated funding? Then it's a conditional: must secure funding within 6 months.
  - Step 2: Strong volunteer networks can be leveraged. If the proposal doesn't have a plan, conditionally require one. But if it does, pass.
  - Step 3: We assume the placement program includes standard integration services (language, etc.). If not, condition.

  So overall: conditional approval (subject to securing school funding and having trust-building and integration plans). If the proposal already has a trust-building plan and integration services, then only the funding condition remains.

  Case 2: Approving a factory dormitory that skips language classes but guarantees jobs and tax contributions.

  Step 1: **Fiscal Impact**
     - Guaranteed jobs and tax contributions -> likely net positive. The factory is paying taxes and the workers are employed, so they are not drawing welfare. This should pass step 1.

  Step 2: **Social Trust**
     - Skipping language classes might lead to isolation and hinder social integration. The dormitory might create a segregated living situation. We need mechanisms to build trust. If the proposal has none, then it fails step 2? Or conditional: require adding language classes and community interaction programs.

  Step 3: **Reciprocity**
     - The proposal skips language classes. Without language, the pathway to civic participation and long-term integration is hindered. So it fails step 3 unless it provides an alternative (e.g., guaranteed language classes after work?).

     - Without language, the workers might be stuck in low-skilled jobs and unable to participate in society. This violates reciprocity because they are not being given the tools to fully contribute and integrate. So step 3: conditional approval only if language classes are added (and funded). Otherwise, reject.

  Step 4: **Scalability**
     - If we set a precedent of skipping language for employer-sponsored housing, it could lead to a parallel society. This is a values question for the board.

  So:

  - Step 1: Pass.
  - Step 2: Fail (if no trust-building) -> conditional: add trust-building mechanisms (e.g., community events, language classes that include host community volunteers).
  - Step 3: Fail (without language) -> conditional: require funded language classes (with a reasonable schedule for workers) and civic orientation.

  Overall: conditional approval (subject to adding language and trust-building programs). Without conditions, it would be rejected at step 2 or 3.

  Case 3: Expanding a pilot that improved local tax compliance but angered long-time residents who feel replaced.

  Step 1: **Fiscal Impact**
     - The pilot improved tax compliance -> likely positive fiscal impact. So it passes step 1.

  Step 2: **Social Trust**
     - The proposal has caused anger among long-time residents who feel replaced. This is a clear erosion of social trust. The proposal must address this. If the expansion doesn't include measures to address these feelings (e.g., by ensuring that existing residents also benefit, or by creating shared spaces and activities), then it fails step 2. Without such measures, it would be a conditional: require adding programs to address resident concerns and rebuild trust. But if the anger is severe and the proposal does nothing, it might be a hard stop? However, the procedure says: if the proposal is likely to cause significant, immediate erosion of trust -> reject. But here we are at the expansion of a pilot that already caused anger. So unless the expansion plan includes specific measures to mitigate, it should be rejected at this step? Or conditional: require a trust-building plan.

     - Given the anger, we must be cautious. We conditionally require a robust plan to address the concerns (e.g., community dialogues, ensuring that public services are not perceived as being taken away, joint projects).

  Step 3: **Reciprocity**
     - The pilot improved tax compliance, meaning newcomers are contributing. But if they are not integrated socially, then the pathway to civic participation might be hindered. We need to check if the pilot includes integration services (language, civic participation). If not, it fails step 3 and we require conditions.

  Step 4: **Scalability**
     - Hand to the board.

  So:

  - Step 1: Pass.
  - Step 2: Conditional (require a plan to address the anger and build trust) or if the anger is too severe and the expansion would make it worse without any plan, then reject? But the procedure at step 2 says: if no mechanisms and likely to cause significant erosion -> reject. We don't know the severity. So we might conditionally require a plan, but if the board feels it's too severe, they might reject at step 4.

  But according to the flowchart, step 2 is conditional if mechanisms are weak: require adding. Only hard stop if no mechanisms and immediate significant erosion. We have to assume that without intervention, the expansion would cause significant erosion. So without a plan, we would reject. But with a plan, conditional.

  Now, one of these should spit out an answer the program officer might hate. Case 2 (factory dorm) without conditions might be rejected by the procedure at step 3 because of the lack of language classes. The officer might hate that because it brings economic benefits and tax revenue. But the procedure prioritizes long-term integration and reciprocity.

  Case 3 might also be hated because the pilot has fiscal benefits but the officer might have to reject it if there's no plan for trust, which could be difficult to implement.

  The procedure might misfire for a small city because:
  - It requires data (like fiscal impact) that might be hard to get quickly.
  - The social trust assessment is subjective and hard to measure.
  - The requirement for dedicated funding (step 1) might be too strict if the city has limited resources to secure such funding.

  Finally, the verdict line: the exact point where human judgment must take over is at Step 4 (Scalability and Precedent).

