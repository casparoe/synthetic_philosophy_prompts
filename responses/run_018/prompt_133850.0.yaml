answer: |-
  ### Reusable Decision Procedure: Solidarity-Velocity Constraint Flowchart  
  **Philosophical Grounding**: Draws on David Miller's *Strangers in Our Midst* (reciprocity, social trust), Joseph Carens' *Ethics of Immigration* (fiscal legitimacy), and Will Kymlicka's multiculturalism (integration pacing). Core tension: **Redistribution requires trust; trust requires integration; integration requires resources**.  

  **Decision Flowchart** (Run in 30 mins; requires basic fiscal/community data):  
  1. **Fiscal Reciprocity Gate**  
     - *Question*: Will the proposal generate net-positive municipal revenue within 18 months OR fully offset costs via earmarked external funding (e.g., federal grants, employer commitments)?  
     - *Pass*: Yes (proceed to Step 2).  
     - *Conditional*: Partial offset (≈50–80% costs covered) → *Approve with binding requirement to secure full funding in 6 months*.  
     - *Hard Stop*: No (or <50% offset) → **Reject**. *Rationale: Unfunded burdens break fiscal reciprocity, undermining welfare legitimacy*.  

  2. **Social Trust Stress Test**  
     - *Question*: Does the proposal include structured, resourced mechanisms to build bridges between newcomers and existing residents? (e.g., shared public spaces, joint skills workshops, cultural exchange).  
     - *Pass*: Robust mechanisms exist (e.g., volunteer networks formally partnered with city).  
     - *Conditional*: Weak/unproven mechanisms → *Approve with added condition: mandatory quarterly trust surveys and community liaison role*.  
     - *Hard Stop*: No mechanisms AND local trust indicators (e.g., community surveys, civic group feedback) show pre-existing decline → **Reject**. *Rationale: Trust deficits risk nativist backlash, collapsing solidarity*.  

  3. **Integration Pathway Check**  
     - *Question*: Does the proposal ensure ≥80% of newcomers access a clear, funded path to economic self-sufficiency (e.g., language training, job placement, credential recognition) within 24 months?  
     - *Pass*: Yes (proceed to Step 4).  
     - *Conditional*: Pathway exists but under-resourced (e.g., classes overcrowded) → *Approve with condition: allocate 10% of project budget to capacity boost*.  
     - *Hard Stop*: No path (e.g., no language/job support) → **Reject**. *Rationale: Blocks reciprocity; violates Miller’s "contributory requirement"*.  

  4. **Scalability Threshold**  
     - *Question*: If this proposal scaled to 5× current size, would it still pass Steps 1–3 without harming core services?  
     - *Hand to Human Judgment*: **Board deliberation required**. *Rationale: Involves value trade-offs (e.g., "acceptable risk" to social cohesion) and precedent-setting*.  

  ---

  ### Case Evaluations  
  **Case 1: 50 families in neighborhood with strained schools but strong volunteers**  
  - **Step 1 (Fiscal)**: Strained schools = negative fiscal impact. Volunteer networks *don’t* offset budget shortfalls. *Conditional*: Approve only if state/federal school grants are secured within 6 months.  
  - **Step 2 (Trust)**: Strong volunteers = pass (if formalized via city-partnered "buddy system").  
  - **Step 3 (Integration)**: *Assumes standard language/job support*. Pass.  
  - **Step 4 (Scalability)**: Human judgment. Volunteers may not scale; schools face cumulative strain.  
  - **Verdict**: **Conditional yes** (pending school funding).  

  **Case 2: Factory dormitory with jobs/taxes but no language classes**  
  - **Step 1 (Fiscal)**: Guaranteed jobs/taxes = net revenue positive (pass).  
  - **Step 2 (Trust)**: No language classes → isolation risk. No trust mechanisms → *Conditional*: Add mandatory biweekly community workshops.  
  - **Step 3 (Integration)**: No language classes → blocks self-sufficiency (fails Kymlicka’s "linguistic justice"). *Hard Stop*: **Reject** unless factory funds on-site classes.  
  - **Why you’ll hate this**: Fiscal benefits are clear, but the procedure prioritizes *long-term integration* over short-term gains. Misfire risk: Small cities lack leverage to force employer compliance.  

  **Case 3: Expanded pilot with tax compliance gains but resident anger**  
  - **Step 1 (Fiscal)**: Improved tax compliance = net positive (pass).  
  - **Step 2 (Trust)**: "Feeling replaced" indicates trust erosion. *Conditional*: Require "shared outcomes" plan (e.g., newcomer-longtimer job fairs).  
  - **Step 3 (Integration)**: Tax compliance ≠ self-sufficiency. *Conditional*: Add civic literacy modules.  
  - **Step 4 (Scalability)**: Human judgment. Anger may reflect xenophobia or legitimate displacement—board must weigh social stability vs. integration gains.  
  - **Verdict**: **Conditional yes** (with trust-building conditions).  

  ---

  ### Where the Procedure Misfires for Small Cities  
  - **Data gaps**: Fiscal impact projections (Step 1) may rely on estimates if city lacks granular data.  
  - **Trust measurement**: Step 2 assumes pre-existing surveys; if absent, use proxy indicators (e.g., library/community center usage drops).  
  - **Employer power**: Step 3 hard stops may be unenforceable if major employers threaten to withdraw (common in small cities).  

  **Verdict**: *The exact point where human judgment must take over is **STEP 4 (SCALABILITY THRESHOLD)***.
