  First, I need to break down each concern. The decay of long-horizon policy expertise refers to losing specialized knowledge needed for complex, future-oriented policies. If this isn't addressed, policies might be shortsighted, hurting legitimacy. But if resolved, maybe through expert advisors, does that fix the problem? Or is the core issue deeper, like the value of experiential knowledge?

