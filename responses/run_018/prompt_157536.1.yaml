answer: |-
  Based on a comparative analysis of democratic theory and empirical evidence, here's the ranking of concerns regarding legitimacy in replacing career politicians with sortition/term limits, along with assessments and pivotal premises:

  **Ranking by Importance to Legitimacy:**
  1.  **Dilution of Retrospective Accountability** (Most Critical)
  2.  **Decay of Long-Horizon Policy Expertise**
  3.  **Disruption of Socialization Patterns Sustaining Cross-Partisan Norms** (Least Critical in Isolation)

  **Detailed Analysis:**

  1.  **Dilution of Retrospective Accountability**
      *   **Why Highest Rank?** Legitimacy fundamentally hinges on citizens' perception that government is responsive and answerable to *them*. Electoral accountability is the primary mechanism in representative democracies for this: voters reward/punish incumbents based on performance. Sortition eliminates this entirely; randomly selected members cannot be sanctioned or rewarded electorally. Strict term limits severely curtail it by preventing re-election bids, removing the most direct incentive for responsiveness. This creates a profound "accountability gap" – citizens lose their primary formal voice in sanctioning poor performance or rewarding success. Without compelling alternatives, this directly and severely undermines perceived legitimacy ("Why should we listen to them? We can't throw them out!").
      *   **Would Resolving It Change Assessment? YES, SIGNIFICANTLY.** If robust, meaningful alternative accountability mechanisms could be developed and *accepted by citizens* (e.g., sophisticated recall systems, strong public ratification/veto powers over assembly outputs, transparent performance evaluations with consequences), this concern could be largely mitigated. Legitimacy could shift towards output (good decisions) and descriptive representation (mirroring the people) rather than input (election). However, designing and legitimizing such alternatives is exceptionally challenging.
      *   **Pivotal Premise for Reversal:** The **"Normative Premise that Electoral Sanction is the *Sine Qua Non* of Democratic Legitimacy."** If legitimacy is instead primarily derived from descriptive representation ("a microcosm of the people") and/or deliberative quality ("reasoned public judgment"), the importance of retrospective electoral accountability diminishes drastically. Reversing this premise (i.e., accepting descriptive/deliberative legitimacy as sufficient) would dramatically lower the ranking of this concern.

  2.  **Decay of Long-Horizon Policy Expertise**
      *   **Why Second Rank?** Effective governance requires understanding complex, long-term issues (climate change, pension systems, infrastructure, R&D investment). Career politicians and experienced bureaucrats develop valuable expertise and institutional memory. Sortition assemblies and high turnover from term limits risk significant decay in this expertise. Policies may become reactive, short-sighted, or overly reliant on external advisors (lobbyists, unelected officials), potentially leading to poor outcomes. Poor outcomes, especially on critical long-term issues, demonstrably undermine legitimacy ("They don't know what they're doing, and it's hurting us!").
      *   **Would Resolving It Change Assessment? YES, BUT WITH SIGNIFICANT CAVEATS.** If mechanisms successfully embed expertise *without* undermining the assembly's independence (e.g., robust, balanced advisory bodies, well-staffed research offices, sophisticated onboarding/learning phases, overlapping terms in large chambers), the negative impact could be substantially reduced. However, the *perception* of reduced competence compared to experienced legislators might persist, and the risk of capture by permanent advisors remains a challenge. Resolving it improves legitimacy prospects considerably, but doesn't address the core accountability deficit.
      *   **Pivotal Premise for Reversal:** The **"Empirical Premise that Specialized Policy Expertise is Primarily Held/Developed by Long-Serving Elected Politicians."** If expertise is seen as residing predominantly in non-partisan civil services, academia, or civil society, and/or if ordinary citizens in well-supported deliberative bodies can *rapidly acquire* sufficient competence on complex issues, this concern becomes less critical. Reversing this premise (i.e., believing expertise is readily accessible/learnable without career politicians) would lower its importance relative to accountability.

  3.  **Disruption of Socialization Patterns Sustaining Cross-Partisan Norms**
      *   **Why Third Rank?** While important for legislative effectiveness and reducing polarization, the breakdown of informal norms of mutual respect, compromise, and trust-building developed over time among long-serving legislators is less *directly* tied to *citizen-perceived legitimacy* than accountability or competent outcomes. Citizens often view "backroom deals" and insider norms with suspicion. Legitimacy might *increase* initially if polarization decreases due to less partisan actors (though this isn't guaranteed). The negative impact manifests more in gridlock or chaotic decision-making *processes* rather than the core citizen-ruler relationship defining legitimacy. Poor outcomes resulting from gridlock *would* hurt legitimacy, but this is captured more directly by the expertise/outcome concern.
      *   **Would Resolving It Change Assessment? MODERATELY, BUT LARGELY OVERRATED as a *Primary* Legitimacy Factor.** Designing deliberative structures *explicitly* fostering respectful dialogue and compromise (e.g., skilled facilitation, common goals, private deliberation phases, rules mandating diverse perspectives) *can* build new norms faster than relying on slow legislative socialization. If successful, this prevents the negative consequences (gridlock, chaos) that *indirectly* harm legitimacy. However, resolving it doesn't address the fundamental lack of accountability or potential competence gap. Its importance to legitimacy is often overstated compared to the first two.
      *   **Pivotal Premise for Reversal:** The **"Empirical Premise that Cross-Partisan Negotiation Norms *Require* Long-Term Personal Relationships Among Stable Elites."** If strong deliberative structures and well-designed processes can reliably generate constructive negotiation and compromise among relative strangers in a short timeframe, the importance of traditional socialization patterns plummets. Reversing this premise (i.e., believing good process trumps long-term relationships) makes this concern largely irrelevant to the legitimacy calculation.

  **Summary of Key Insights:**

  *   **Accountability is Paramount:** The absence of electoral sanction poses the deepest challenge to traditional legitimacy foundations. Overcoming this requires a fundamental shift in how legitimacy is conceptualized or highly innovative alternative mechanisms.
  *   **Expertise is Manageable (Theoretically):** While crucial for good outcomes, expertise decay is more technically solvable through institutional design than the accountability gap, though practical challenges and perceptions remain.
  *   **Socialization is Overstated for Legitimacy:** While vital for smooth functioning, its direct link to citizen legitimacy is weaker. Deliberative design offers potential solutions that could even enhance perceived legitimacy compared to current polarized norms.
  *   **The Crucial Role of Premises:** The entire ranking hinges on accepting electoral accountability and elite expertise as core legitimacy components. Rejecting these premises (embracing descriptive/deliberative legitimacy and citizen epistemic competence) fundamentally alters the calculus and makes sortition/term limits far more viable. The debate is as much about *defining* legitimacy as it is about institutional mechanics.
