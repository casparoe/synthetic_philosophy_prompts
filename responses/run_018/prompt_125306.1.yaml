answer: |-
  ### Decision Procedure Checklist for Logical Claims  
  **Goal:** Assign a confidence level (0-100%) in 60 minutes to decide: **Sign** (≥80%), **Defer** (50-79%), **Reject** (<50%), or **Punt to Senior** (complex values call). Grounded in logical induction (synthetic traders) and reference-class statistics.  

  ---

  #### **Step 0: Pre-Filter (Automatic Punt)**  
  1. **Question:** Does the claim self-reference verification (e.g., "this claim is unprovable") or involve Gödelian self-reference?  
     - **Good enough:** Junior auditor checks for keywords like "unprovable," "undecidable," or "this verification."  
     - **Outcome:**  
       - **Yes → Punt to senior.** (Self-reference breaks standard induction.)  
       - **No → Proceed to Step 1.**  

  2. **Question:** Does quantification (e.g., `∀x`, `∃y`) range over structures larger than any in our reference class?  
     - **Good enough:** Compare to reference-class max (e.g., strings >1,000 chars, integers >2^30).  
     - **Outcome:**  
       - **Unbounded or exceeds max → Punt to senior.** (Infeasible for quick induction.)  
       - **Bounded and within max → Proceed to Step 1.**  

  ---

  #### **Step 1: Syntactic Trader Budget (10 min max)**  
  **Action:** Run fast syntactic checks and heuristic counterexample searches.  
  - **Tools:**  
    - Syntax contradiction prover (e.g., check for `P ∧ ¬P` patterns).  
    - Bounded model checker (e.g., for loops/recursion, test `n=0` to `n=1,000`).  
    - Pattern-based fuzzer (e.g., inject adversarial inputs matching quantifier structure).  
  - **Key Distinction:** Actively seek disproof. Absence ≠ evidence.  

  **Outcomes:**  
  - **Definitive disproof/witness found (e.g., counterexample):**  
    - Universal claim falsified → **Reject.**  
    - Existential claim verified → **Sign.**  
  - **No disproof/witness:**  
    - **Confidence assignment:**  
      - Universal claim: 40% (weak prior against falsity).  
      - Existential claim: 30% (weak prior against truth).  
    - **Proceed to Step 2.**  

  ---

  #### **Step 2: Reference-Class Comparison (15 min max)**  
  **Action:** Compare claim to database of past verified/unverified claims.  
  - **Features:** Symbol count, quantifier depth (e.g., `∀∃` vs. `∃∀`), operators (e.g., loops, recursion), logical complexity.  
  - **Similarity metric:** Rule-based (e.g., ±20% symbols, same quantifier class) or cosine similarity on feature vectors.  

  **Good enough:**  
  - ≥5 past claims with 80%+ similarity.  
  - Database updated weekly with audit outcomes.  

  **Confidence adjustment:**  
  - **High similarity to verified claims:** +30% confidence.  
  - **High similarity to unverified/falsified claims:** −30% confidence.  
  - **Novel claim (no matches):** No adjustment (0%).  
  - **Mixed/weak similarity:** +10% if verified tilt, −10% if unverified tilt.  

  **Outcome:** Update confidence from Step 1. **Proceed to Step 3.**  

  ---

  #### **Step 3: Logical Market Pricing (20 min max)**  
  **Action:** Simulate "trading" against a synthetic market (pre-run for common claim types).  
  - **Market rules:**  
    - Traders run polynomial-time heuristic checks (e.g., SAT solvers for small instances, pattern matches).  
    - Current "price" = market’s implied probability (0–100%) of truth.  
  - **Key distinction:** Separate:  
    - **No trader activity:** Price = 50% (ignorance).  
    - **Active buying ("evidence found"):** Price > 50%.  
    - **Active selling ("disproof found"):** Price < 50%.  

  **Good enough:**  
  - Check market logs for trader activity (e.g., >10 trader actions).  
  - If no market data, use heuristic: Price = 50% + 10% per past similar claim verified.  

  **Confidence adjustment:**  
  - **Price ≥70% + active buying:** +20%.  
  - **Price ≥70% + no activity:** +0% (distinguish ignorance from evidence!).  
  - **Price ≤30% + active selling:** −20%.  
  - **Price 30–70%:** No adjustment.  

  **Outcome:** Update confidence. **Proceed to Step 4 if empirical, else Step 5.**  

  ---

  #### **Step 4: Empirical Data Integration (10 min max; skip if pure logic)**  
  **Question:** Does the claim mix logic with empirical data (e.g., "runtime data implies correctness")?  
  - **Good enough:** Evidence from ≥100 test runs or code coverage ≥70%.  

  **Confidence adjustment:**  
  - **Strong data (coverage ≥90%, no failures):** +15%.  
  - **Weak data (coverage <70% or ambiguous):** −10%.  
  - **Conflicting data (some failures):** −20%.  

  **Outcome:** Update confidence. **Proceed to Step 5.**  

  ---

  #### **Step 5: Final Aggregation & Decision (5 min)**  
  **Action:** Combine confidences.  
  - **Weights:** Step 1 (30%), Step 2 (40%), Step 3 (20%), Step 4 (10% if applicable).  
  - **Formula:** `Final Confidence = (Step1_Conf × 0.3) + (Step2_Adj × 0.4) + (Step3_Adj × 0.2) + (Step4_Adj × 0.1)`  

  **Decision:**  
  - **≥80%:** **Sign** (green check).  
  - **50–79%:** **Defer** (cannot sign; requires full check).  
  - **<50%:** **Reject** (do not sign).  
  - **Conflict/edge case:** **Punt to senior** (e.g., tie between markets, ethical risk).  

  ---

  ### **Procedure Run on Client Proposals**  
  **Key Misfire Risks:**  
  - Over-reliance on syntax (Step 2): May miss hidden contradictions.  
  - "No trader activity" misread as evidence (Step 3): Critical to flag inactivity.  
  - Reference-class bias: Novel true claims may be deferred; familiar false claims may sneak through.  

  --- 

  #### **Proposal 1:**  
  *"The loop invariant `I(n)` holds for all `n < 2^64` in this binary search routine."*  
  - **Step 0:** Bounded (`n < 2^64`), no self-ref → Proceed.  
  - **Step 1:** Trader budget (10 min): No counterexample found for `n=0` to `n=500,000`. Confidence = 40%.  
