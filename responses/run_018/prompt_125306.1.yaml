  - **Decision Rule:**
    - Confidence >= 80%: Sign (green check).
    - 50% <= Confidence < 80%: Defer (we can't sign now, wait for full check or more evidence).
    - Confidence < 50%: Reject (do not sign, and flag to client as likely false).
  - **Escalation:** Any time the procedure outputs a defer or reject, and the client is pushing for a sign, or if there is a conflict between steps, escalate to senior for a values call (e.g., business risk tolerance).

  **Misfires to Watch For:**
  - Over-reliance on syntactic similarity: A claim might look like a past verified one but hide a contradiction (like a slight change that makes it false). This is why Step 1 is important.
  - Confusing "no trader disproved" with "probably true": We mitigate by explicitly checking in Step 3 for active buying vs. absence of selling.

