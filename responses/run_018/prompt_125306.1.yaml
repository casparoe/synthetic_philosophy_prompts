  - A synthetic trader budget: quick syntactic checks and pattern-based counterexample searches.
  - A reference class step: comparing the claim to past verified/unverified claims based on syntactic features (like symbol count and quantifier structure).
  - Clear stopping points: "defer/can't sign", or escalate to a senior for values calls.

  The procedure must handle:
  - Claims that look similar to past verified ones but hide a contradiction.
  - Huge finite search spaces where a polynomial-time trader might not have found a counterexample.
  - Mixes of empirical runtime data and pure logical consequence.

  Key distinction: "the market hasn't priced this low yet" (i.e., no counterevidence found) vs. "we have positive reason to believe".

  Also, automatic punt to human for:
  - Claims that reference their own verification status (self-referential).
  - Unbounded quantification over strings longer than anything in our reference class.

  We'll structure the procedure as a checklist of questions in order.

  ---

  **Decision Procedure Checklist**

  **Step 0: Pre-filter (Automatic Punt Conditions)**
  - **Question:** Does the claim reference its own verification status? (e.g., "this claim is unprovable in the system")
    - **If yes:** Punt to senior. (Self-referential claims are known to be tricky and may require Gödelian analysis.)
  - **Question:** Does the claim involve unbounded quantification over structures (like strings, numbers) that exceed any in our reference class? (e.g., "for all strings of length > N", and our reference class has no examples with N>1000, but the claim goes to infinity or to 2^1000)
