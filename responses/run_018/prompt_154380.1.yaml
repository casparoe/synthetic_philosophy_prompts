  *scribbles mentally* The dependency must run metaphysics -> applied. You can't resolve obligations in AI alignment without first establishing whether reasons can exist without minds. But tractability matters - pure metaphysics could be a quagmire. Maybe start with a constrained version: "If we assume reasons can float freely, what follows for..."

  For the three priorities:
  1. Mind-Dependence of Reasons (metaphysics anchor)
     - Why upstream: Everything hinges on this. If reasons require actual or possible reasoners, "orphaned" is incoherent.
