answer: |-
  1. **Question:** The critic claims replacing original marble with lab-grown limestone breaks material continuity because the new matter has no geological history. Which response best defends the museum's view that it remains the same statue?  
     A) Chemical identity guarantees material continuity, so the statue persists.  
     B) The statue's identity depends on its form, not its matter's origin.  
     C) Spatiotemporal continuity was maintained during restoration, preserving identity.  
     D) The synthetic limestone is "natural enough" since bacteria produced it.  
     **Correct Answer: B**  
     *Explanation:* B is correct because artifacts like statues persist through matter replacement if their defining structure/origin are preserved. A confuses chemical properties with material constitution (identity requires historical matter, not just identical composition). C mistakes spatiotemporal path for material continuity (restoration may involve gaps). D misunderstands "naturalness" as relevant (synthetic origin doesn’t inherently break continuity if functional role is identical).

  2. **Question:** Does the statue's persistence through centuries of restorations—culminating in synthetic limestone—support the view that material constitution requires continuous matter?  
     A) Yes, because all replacements shared marble-like properties.  
     B) Yes, since matter was always physically connected during repairs.  
     C) No, as the statue persists despite non-original matter being added incrementally.  
     D) No, but only because the new limestone is chemically identical.  
     **Correct Answer: C**  
     *Explanation:* C is correct: artifacts can survive gradual matter replacement if functional integrity holds. A wrongly assumes shared properties suffice (material constitution demands causal-historical matter, not just similarity). B erroneously equates physical connection with material continuity (restoration often involves removal/replacement). D overemphasizes chemistry (even identical composition can fail if matter lacks correct origin).

  3. **Question:** The critic argues lab-grown limestone can't constitute the statue because it lacks a "natural" origin. Which rebuttal best upholds material constitution theory?  
     A) Naturalness is irrelevant; constitution depends on the matter's functional role in the artifact.  
     B) The limestone is natural because bacteria are part of nature.  
     C) Only the original sculptor's intent matters, not the material.  
     D) Geological history is a scientific property, not a metaphysical one.  
     **Correct Answer: A**  
     *Explanation:* A is correct: artifacts are constituted by matter fulfilling their form/function, regardless of origin. B distracts by redefining "natural" (metaphysical constitution concerns historical provenance, not biological processes). C overstates intent (material changes can alter identity even if intended). D confuses science with metaphysics (geological history matters if material continuity requires natural sourcing).

  4. **Question:** If the synthetic limestone patch were removed and reattached, would it still be part of the same statue?  
     A) No, because its detachment breaks material continuity permanently.  
     B) Yes, but only if reattached immediately.  
     C) No, since synthetic matter cannot be reintegrated into historical objects.  
     D) Yes, because its role in the statue's structure persists through reattachment.  
     **Correct Answer: D**  
     *Explanation:* D is correct: reattachment restores functional role, preserving constitution. A misapplies spatiotemporal discontinuity as fatal (temporary detachment doesn't destroy relational properties). B imposes arbitrary time limits (constitution isn't time-sensitive). C assumes synthetic matter is metaphysically "sticky" (origin doesn’t preclude reintegration if form is maintained).

  5. **Question:** Does the statue's identity require its matter to have existed in antiquity?  
     A) Yes, because the statue is defined by its historical matter.  
     B) Only for the original Greek bronze, not the Roman copy.  
     C) No, as later restorations are part of its diachronic identity.  
     D) Yes, but lab-grown limestone "inherits" antiquity through integration.  
     **Correct Answer: C**  
     *Explanation:* C is correct: artifacts accrete new matter through restoration while retaining identity. A is essentialist (statues persist through matter replacement if their form/cultural lineage continues). B inconsistently applies criteria (Roman copy’s identity isn’t fundamentally different). D invents false "inheritance" (synthetic matter lacks historical properties; identity relies on whole-object continuity, not mystical transfer).
