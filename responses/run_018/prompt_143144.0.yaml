answer: |-
  Here is a five-question diagnostic decision tree designed to isolate core philosophical positions on individual contributions to collective harms, using voting, meat consumption, and similar actions as running examples. Each branch node is phrased as a concrete case question avoid theoretical jargon.

  **Decision Tree: Moral Difference in Collective Harms**

  1.  **Case A (Causal Efficacy - Direct):** In a national election with millions of voters, Candidate X wins by exactly 1 vote. Did the single vote cast *for* X by Voter V *cause* X to win, rather than tie or lose? (Yes/No)
      *   **If Yes:** Go to 2.
      *   **If No:** Go to 3.

  2.  **Case B (Causal Efficacy - Threshold):** Consider a meat market where the total supply is fixed *before* any individual consumer decides to buy. If Consumer C chooses *not* to buy one unit of meat, does this choice *cause* any reduction in the total number of animals raised and killed for meat? (Yes/No)
      *   **If Yes:** Go to **Leaf 1: Pure Inefficacy Denial**
      *   **If No:** Go to 4.

  3.  **Case C (Harm Probability):** When C chooses *not* to buy one unit of meat in a large market (where supply might adjust *slightly* based on aggregate demand), does C's choice still make it *slightly less probable* that an animal will be raised and killed in the future? (Yes/No)
      *   **If Yes:** Go to **Leaf 2: Probabilistic/Expected-Harm Aggregation**
      *   **If No:** Go to 5.

  4.  **Case D (Collective Duty):** Even if no single voter *causes* an election outcome and no single non-voter *causes* a bad outcome, do citizens have a moral duty to vote (e.g., for pro-climate policies) because widespread participation is necessary *as a collective* to achieve just outcomes? (Yes/No)
      *   **If Yes:** Go to **Leaf 3: Collective-Action/Coordination Duty**
      *   **If No:** Go to **Leaf 4: Structural-Complicity/Social-Connection Responsibility** (Young-style)

  5.  **Case E (Expressive/Character Impact):** Imagine someone publicly refuses to fly for a vacation *because* of climate change, knowing their absence won't cancel the flight or reduce emissions. Does this act carry significant *independent moral weight* either (a) by visibly signaling opposition and potentially shifting norms, or (b) by avoiding the personal moral corruption of participating in a harmful system? (Yes/No)
      *   **If Yes:** Go to **Leaf 5: Expressive/Norm-Constitution Duty**
      *   **If No:** Go to **Leaf 6: Virtue-Based/Character-Corruption Avoidance**

  **Leaf Positions & Paths:**

  1.  **Leaf 1: Pure Inefficacy Denial** (Path: A-Yes, B-Yes)
      *   *Recommendation:* Skipping meat *does* directly cause fewer animals to be killed; your vote *can* be decisive; so individual actions matter causally and you should act accordingly.
  2.  **Leaf 2: Probabilistic/Expected-Harm Aggregation** (Path: A-No, C-Yes)
      *   *Recommendation:* Skipping meat slightly reduces expected harm; cast your vote as it slightly increases the chance of a good outcome; base choices on marginal expected impact.
  3.  **Leaf 3: Collective-Action/Coordination Duty** (Path: A-No, C-No, D-Yes)
      *   *Recommendation:* Vote reliably because it's your fair share of a collective duty; reduce meat consumption as part of fulfilling your role in necessary collective change.
  4.  **Leaf 4: Structural-Complicity/Social-Connection Responsibility** (Path: A-No, C-No, D-No, E-Yes (implied by going to E))
      *   *Recommendation:* Reduce meat consumption and vote not to *cause* change, but because you share responsibility for unjust structures benefiting you; focus on systemic action and challenging underlying norms.
  5.  **Leaf 5: Expressive/Norm-Constitution Duty** (Path: A-No, C-No, D-No, E-Yes)
      *   *Recommendation:* Publicly skip flights and vote primarily to express opposition and help shape new social norms against harmful practices, regardless of direct impact.
  6.  **Leaf 6: Virtue-Based/Character-Corruption Avoidance** (Path: A-No, C-No, D-No, E-No)
      *   *Recommendation:* Avoid meat and excessive flying to maintain personal integrity and avoid becoming complicit in vice, even if these acts cause no harm; voting may be seen as expressing civic virtue.

  **Diagnostic Overlap & Proposed Split:**

  *   **Overlap:** **Leaf 4 (Structural-Complicity)** and **Leaf 5 (Expressive Duty)** both answer "Yes" to Case E (Expressive/Character Impact). Both see value in refusing to fly as a signal/norm challenge and would likely recommend similar *actions* (skip meat, vote). The overlap occurs because both positions emphasize non-causal, social/moral dimensions: Young-style analysis inherently involves challenging norms through action, and expressive actions inherently challenge the structures Young critiques.
  *   **Splitting Case (F):** "Suppose refusing to fly for climate reasons *only* signals opposition effectively if done consistently by the individual *and* widely publicized. If someone secretly never flies (no signal) but feels no guilt, and someone else flies constantly but loudly condemns it and funds offsets, which person better fulfills their moral duty regarding flying?"
      *   *Structural-Complicity (Leaf 4)*: Would likely prioritize the *secret refuser* – their action reduces direct (though minor) material benefit from the harmful structure and embodies a cleaner break from complicity. The loud flyer remains materially complicit.
      *   *Expressive Duty (Leaf 5)*: Would likely prioritize the *loud condemner* – their action actively performs the signal and norm-challenge, which is the primary moral point. Secret refusal has no expressive power.

  **Logically Coherent but Neglected Position:**

  *   **Path:** A-No (Single vote doesn't cause outcome), C-No (Skipping meat in fixed market causes no harm), D-No (No collective duty to vote/reduce consumption), **E-No** (Refusing to fly carries no independent moral weight via signal OR character), **but then** endorsing a strict prohibition on meat/flying based on **Leaf 6's reasoning** (Virtue/Corruption).
  *   **Position:** **Strict Character Isolationism:** No individual causal impact exists (A-No, C-No). There is no duty to coordinate or participate in collective action (D-No). Signaling or norm-shifting is irrelevant or impossible (E-No). *However*, participating in the harmful act itself (eating meat, flying) is intrinsically corrupting to one's character/virtue, regardless of context, impact, or social meaning. Therefore, one must abstain purely for self-regarding virtue reasons.
  *   **Diagnosis of Absence:** This position's neglect primarily reflects **practical unattractiveness and perceived incoherence with common moral intuitions**.
      *   *Incoherence?* Not strictly logically incoherent, but it severs virtue completely from consequences, social context, or duties to others. It demands extreme personal purity (never fly, never eat meat) based solely on avoiding internal corruption, even if the action is causally inert, socially invisible, and disconnected from any collective effort or systemic critique. This isolates virtue in a way most theorists find implausible or morally narcissistic.
      *   *Unattractiveness?* Extremely demanding (total abstinence from common practices) while denying any broader moral significance (no duty to help others, change systems, or signal values). It offers no reason to engage politically or socially beyond personal purity. Theorists generally integrate character concerns with consequences, duties, or social context, rejecting this radical isolation.
