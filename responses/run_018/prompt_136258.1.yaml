answer: |-
  Here’s the full spec for a normative framework tackling the nested-reference problem in inside/outside view selection, structured as requested:

  ---

  ### 1. **Framing Problem (102 words)**  
  The nested-reference flaw: When you’re embedded in the system you’re modeling (e.g., your startup field), your inside-view choices *change* the outside-view reference class itself. Your team’s pivot alters "tech startup" success rates; your paper shifts "AI theory" citation baselines. Standard "use base rates!" advice implodes because the reference class isn’t static or independent—it’s causally warped by your actions and beliefs. Deferring to historical data ignores that *you’re part of the history-in-the-making*. This isn’t forecasting error; it’s a self-referential trap where humility creates blindspots by misapplying externality.

  ---

  ### 2. **Desiderata (408 words)**  
  A viable framework **must**:  

  - **Handle recursive causality**: Model how your inside-view decisions (e.g., adopting a research paradigm) perturb the reference class dynamics (e.g., what counts as "success" in your field). *Non-negotiable*.  
  - **Resolve dominance conflicts**: Prescribe when a *strong* inside view (e.g., "We cracked quantum gravity") should override catastrophic base rates (e.g., "0.1% of theory papers revolutionize physics"), despite entanglement. Must distinguish legit breakthrough logic from delusion. *Camp-preference: Thresholds for overriding*.  
  - **Meta-modesty**: Account for 2nd-order uncertainty about *when to switch views*. If your framework says "be modest now", but you suck at choosing modesty contexts (e.g., hindsight bias), it should degrade confidence in the switch rule itself. *Non-negotiable*.  
  - **Distinction preservation**:  
    - **Confidence-modesty ≠ Model-modesty**: Separating "how sure am I?" (confidence) from "which model fits?" (e.g., inside-view causal map vs. outside-view statistic). Collapsing these invites scope neglect.  
    - **1st vs. Meta-outside view**: Using base rates about *base rate reliability* (e.g., "fields like mine have unstable reference classes") must not default to infinite regress. *Non-negotiable*.  
  - **Bias integration (not just naming)**:  
    - **Availability heuristic**: Framework must suppress overweighting vivid inside narratives by requiring *counterfactual reference classes* (e.g., "What if our ‘revolutionary’ tool existed in 2010?").  
    - **Groupthink**: Penalize inside-view dominance in entangled groups via *externality checks* (e.g., "Would this prediction hold if our lab didn’t exist?").  
    - **Base rate neglect**: Force outside-view priors *unless* recursive harm is detected (e.g., your startup’s strategy *relies* on outdated market data it’s disrupting).  
  - **Dynamic reweighting**: Adjust inside/outside balance as coupling intensifies (e.g., early-stage startup → inside view heavy; regulatory scrutiny phase → outside-view compliance). *Camp-preference: Calibration mechanics*.  

  ---

  ### 3. **Joint Unsatisfiability Check (147 words)**  
  Perfect calibration and actionable guidance conflict **severely** in coupled systems. Calibration requires quantifying your causal impact *on the reference class*—which demands recursive self-modeling ("How does my framework alter the field’s base rates?"). But this either:  
  (a) **Paralyzes**: Infinite meta-regress ("How do I model my modeling impact?"), killing actionability; or  
  (b) **Ignores entanglement**: Assuming reference class stability for tractability, breaking calibration under recursion.  
  You *can’t* have both perfect calibration and low-complexity guidance here. The framework *must* accept bounded rationality: Actionable rules will be miscalibrated at meta-transitions (e.g., shifting from outsider to dominant player). Non-negotiable: Flag these fragility zones.  

  ---

  ### 4. **Contenders Sketch (97 words)**  
  - **Pure Outside View**: Implodes. Demands using base rates corrupted by your past actions → retroactively justifies bad bets ("Our AI startup failed at 99%, but 99% fail!"), ignoring that your team *changed* the rate. Unusable.  
  - **Pure Inside View**: Ignores entanglement, inviting self-fulfilling bubbles. Your "genius insight" feels validated as you reshape the reference class (e.g., crypto hype inflating "success" baselines), but crashes when recursion peaks (e.g., regulation). Scores well on actionability, zero on calibration.  

  ---

  **Key takeaway**: The list forces tradeoffs. Any framework satisfying *most* desiderata will be messy, context-sensitive, and require "modesty triggers" (e.g., "shift meta-outside if reference class volatility > threshold"). No clean wins.
