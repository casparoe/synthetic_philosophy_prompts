prompt: |-
  I serve as the senior ethics reviewer for an international consortium of universities and corporate boards that must evaluate quota proposals across jurisdictions, and because our reviewers are not philosophers, I need a reusable decision procedure—ordered questions, pass-or-fail criteria, explicit judgment-call flags, and worked examples—that translates the conceptual architecture of group-based preference into an operational audit. The principle I want operationalized combines the standard philosophical distinction among rectificatory, distributive, and recognitive justifications with a synthetic condition I will call the category-stability lock: before any normative justification is weighed, the reviewer must classify the group boundary as administratively fixed, administratively mutable, or self-declared, because each state requires a different institutional mechanism—a hard percentage, a sliding-scale target, or a representative consultation—and pairing a fluid boundary with a rigid mechanism produces what I term an ontological-mechanism error. The procedure must therefore run in four stages—category-stability audit, normative-mode match, mechanism-proportionality check, and sunset-or-review trigger—and must be executable in roughly thirty minutes by a non-expert using only the proposal text.

  Please construct this as a flowchart in words with clear stopping points: specify at each stage what counts as a sufficient answer, where the procedure issues an unconditional rejection, and where it must hand the decision to a human because the issue is one of values rather than institutional coherence. Then apply the full procedure to three proposals: (a) a US public university proposing a 12 percent reserved enrollment floor for students identifying with historically underrepresented racial groups, using self-identification with random audit; (b) an Indian university maintaining a 27 percent OBC reservation coupled with an income-cap exemption mechanism; and (c) a proposed Norwegian corporate board policy that would impose a 40 percent gender-representation target with a comply-or-explain fallback and self-certification of gender status. Include one case in which the procedure delivers an answer I am likely to resist—probably a stringent conditional rejection—and explicitly state what the procedure cannot adjudicate, such as whether the historical harm or present disparity is severe enough to warrant preference at all. Lead with your bottom line in the first sentence—either the core rule of the audit or its most serious limitation—then present the reasoning, the procedure, and the three worked cases, with no preamble and no restatement of the question.
reasoning: |-
  We are constructing a decision procedure as a flowchart in words. The procedure has four stages:
   1. Category-stability audit: Classify the group boundary as administratively fixed, administratively mutable, or self-declared.
   2. Normative-mode match: Identify the normative justification (rectificatory, distributive, or recognitive) and check if the proposal's mechanism matches the category stability.
   3. Mechanism-proportionality check: Ensure the mechanism's rigidity/flexibility is proportional to the category stability and the normative justification.
   4. Sunset-or-review trigger: Check for a built-in review mechanism or sunset clause.

   At each stage, we specify:
   - What counts as a sufficient answer?
   - Where the procedure issues an unconditional rejection?
   - Where the decision must be handed to a human (values judgment).

   The core rule of the audit is: **Unconditional rejection occurs only when there is an ontological-mechanism error (pairing a fluid boundary with a rigid mechanism) or a mechanism-proportionality failure; all other value-based judgments are deferred to human reviewers.**

   The most serious limitation: **The procedure cannot adjudicate the severity of historical harm or present disparity, nor the moral weight of competing justifications; it only checks institutional coherence.**

   Now, the procedure:

   **STAGE 1: CATEGORY-STABILITY AUDIT**
     - **Question:** How is group membership defined and verified? 
     - **Classification:**
          - *Administratively fixed*: Membership is determined by fixed criteria (e.g., birth records, immutable characteristics) and verified by external documents; no individual discretion in changing status.
          - *Administratively mutable*: Membership can change over time based on objective criteria (e.g., income level, geographic location) and is verified by administrative review.
          - *Self-declared*: Membership is based solely on self-identification without external verification (or with minimal audit that doesn't change the self-declared nature).
     - **Stopping points:**
          - *Sufficient answer*: Classification into one of the three states.
          - *Unconditional rejection*: None at this stage (if unclassifiable, hand to human).
          - *Hand to human*: If the boundary definition is ambiguous or mixed in a way that defies classification.

   **STAGE 2: NORMATIVE-MODE MATCH**
     - **Question:** What is the primary normative justification stated in the proposal?
     - **Classifications:**
          - *Rectificatory*: Compensating for past wrongs (e.g., historical discrimination).
          - *Distributive*: Achieving a fair distribution of resources or opportunities (e.g., current underrepresentation).
          - *Recognitive*: Ensuring recognition and participation of groups (e.g., diversity of perspectives).
     - **Required mechanism pairing (based on category stability from Stage 1):**
          - *Administratively fixed*: Requires a rigid mechanism (e.g., hard quota, fixed percentage).
          - *Administratively mutable*: Requires a flexible mechanism (e.g., sliding-scale target, income-based adjustment).
          - *Self-declared*: Requires a participatory mechanism (e.g., representative consultation, self-certification with audit).
     - **Stopping points:**
          - *Sufficient answer*: The proposal's mechanism matches the required pairing (e.g., self-declared with participatory mechanism).
          - *Unconditional rejection*: If there is an ontological-mechanism error (e.g., self-declared category with a rigid mechanism).
          - *Hand to human*: If the normative justification is unclear or multiple, but the mechanism pairing is not in error (then proceed to Stage 3).

   **STAGE 3: MECHANISM-PROPORTIONALITY CHECK**
     - **Question:** Is the mechanism's rigidity proportional to the category stability and normative justification?
     - **Criteria:**
          - *Rigid mechanisms (hard quotas)*: Only acceptable for administratively fixed categories. Also, rectificatory justifications may require rigidity, but distributive/recognitive may require more flexibility.
          - *Flexible mechanisms (sliding scales, income caps)*: Required for administratively mutable categories. Also acceptable for fixed categories if the justification is distributive (to account for changing circumstances) but not for rectificatory if the harm is fixed.
          - *Participatory mechanisms (consultation, self-certification)*: Required for self-declared categories. Also acceptable for mutable categories with recognitive justifications.
          - *General rule*: The mechanism must be at least as flexible as the category stability requires. (Fixed categories can have rigid or flexible, but mutable must have flexible or participatory, and self-declared must have participatory.)
     - **Stopping points:**
          - *Sufficient answer*: Mechanism is at least as flexible as required by the category stability and matches the normative justification appropriately.
          - *Unconditional rejection*: If the mechanism is more rigid than the category stability allows (e.g., self-declared with a rigid mechanism) or if the rigidity is disproportionate to the justification (e.g., a distributive justification with a rigid mechanism when the category is mutable).
          - *Hand to human*: If the proportionality is borderline (e.g., a fixed category with a flexible mechanism for rectification: is the flexibility too much? This is a value judgment on the trade-off).

   **STAGE 4: SUNSET-OR-REVIEW TRIGGER**
     - **Question:** Does the proposal include a built-in review mechanism or sunset clause?
     - **Criteria:**
          - *Required for*: All proposals, but especially critical for mutable and self-declared categories because conditions may change.
          - *Acceptable forms*: Automatic expiration (sunset) unless renewed, mandatory periodic review (e.g., every 5 years), or a clear evaluation metric that triggers reassessment.
     - **Stopping points:**
          - *Sufficient answer*: Presence of a review or sunset clause that is triggered by time or measurable conditions.
          - *Unconditional rejection*: Absence of any review/sunset provision for mutable or self-declared categories. (Fixed categories may be exempt if the justification is rectificatory and the harm is permanent, but this is rare and may be handed to human.)
          - *Hand to human*: For fixed categories with rectificatory justifications, absence of review might be acceptable (human decides). Also, if the review mechanism is inadequate (e.g., too long a period), hand to human.

   Now, apply to three cases:

   **Case (a): US public university proposing 12% reserved enrollment floor for students identifying with historically underrepresented racial groups, using self-identification with random audit.**
     - Stage 1: *Category-stability audit*: Self-declared (self-identification with audit doesn't change the self-declared nature; it's still based on self-ID).
     - Stage 2: *Normative-mode match*: Justification is rectificatory (historically underrepresented groups). Required mechanism: participatory (because self-declared). Proposed mechanism: rigid (reserved floor is a hard percentage) and self-ID with audit. 
          - *Error*: Rigid mechanism (fixed percentage) with self-declared category -> ontological-mechanism error.
          - **Unconditional rejection at Stage 2.**

   **Case (b): Indian university maintaining 27% OBC reservation coupled with an income-cap exemption mechanism.**
     - Stage 1: *Category-stability audit*: Administratively mutable (OBC status can change based on income; the income-cap exemption makes it mutable because if income exceeds, the reservation doesn't apply).
     - Stage 2: *Normative-mode match*: Typically rectificatory (for Other Backward Classes, historical disadvantage). Required mechanism: flexible (because mutable). Proposed mechanism: fixed 27% reservation but with an income-cap exemption (which introduces flexibility). 
          - So the mechanism is a fixed quota with an exemption (flexibility). This is a hybrid. The exemption mechanism makes it flexible. Therefore, it matches the mutable category (flexible mechanism required).
          - Pass Stage 2.
     - Stage 3: *Mechanism-proportionality check*: The mechanism (fixed quota with income exemption) is flexible enough for a mutable category? Yes, because the exemption allows adjustment. Also, the justification (rectificatory) might allow some rigidity, but the flexibility is present. 
          - Pass Stage 3.
     - Stage 4: *Sunset-or-review trigger*: Does it have a review? In India, the OBC reservation is subject to periodic review (e.g., the Mandal Commission and subsequent reviews). The proposal likely includes a review (if not explicitly, then by national policy). 
          - Assume it has a review (if not, then we would need to check). But since it's a national policy, we assume it's reviewed. 
          - Pass Stage 4.
     - **Overall: Pass.**

   **Case (c): Proposed Norwegian corporate board policy: 40% gender-representation target with comply-or-explain fallback and self-certification of gender status.**
     - Stage 1: *Category-stability audit*: Gender is typically administratively fixed (legal gender), but note: self-certification of gender status. This is tricky. If the policy allows self-certification (without requiring legal change), then it is self-declared. If it requires legal gender, then fixed. The problem says "self-certification". So we classify as self-declared? 
          - However, note: in many jurisdictions, gender is fixed by legal documents. But if the policy uses self-certification (without requiring documentation), then it is self-declared. 
          - We'll take the proposal at face value: self-certification -> self-declared.
     - Stage 2: *Normative-mode match*: Justification is likely distributive (to achieve gender balance) and recognitive (diversity of perspectives). Required mechanism: participatory (because self-declared). Proposed mechanism: target with comply-or-explain (which is flexible) and self-certification (participatory). 
          - Is the target rigid? The 40% is a target, but with comply-or-explain, it's not rigid. So the mechanism is flexible/participatory. 
          - Therefore, no ontological-mechanism error. Pass Stage 2.
     - Stage 3: *Mechanism-proportionality check*: The mechanism (target with comply-or-explain) is flexible and participatory, which is acceptable for self-declared. Also, for distributive/recognitive justifications, flexibility is appropriate. 
          - Pass Stage 3.
     - Stage 4: *Sunset-or-review trigger*: Does it have a review? The problem does not specify. Since it's a proposal, we must check the text. If it doesn't have a review clause, then for a self-declared category (which can be fluid) and for a corporate policy (which may change), we require a review. 
          - If the proposal lacks a review clause: **Unconditional rejection at Stage 4**.
          - If it has a review clause: Pass.

   However, note: the problem does not specify a review in the description. So we must assume it's absent unless stated. Therefore, we reject.

   But wait: the Norwegian law (if this is modeled on the actual law) has a review? Actually, the problem is a proposal. We must go by the text. Since it's not mentioned, we assume it's absent.

   **Therefore, for case (c): Reject at Stage 4 (if no review clause) or Pass (if present).** Since the problem doesn't specify, we note that without a review, it fails.

   Now, the case that the senior ethics reviewer might resist: Case (a) was rejected at Stage 2. That might be resisted because self-ID with audit is common. But the procedure flags the rigid mechanism (fixed floor) with self-declared as an error.

   What the procedure cannot adjudicate:
     - The moral permissibility of the group-based preference in the first place (e.g., whether the historical harm is severe enough).
     - The adequacy of the percentage (12%, 27%, 40%) in relation to the population or the harm.
     - The fairness of the income cap in case (b) (e.g., whether the cap is set appropriately).
answer: |-
  **Core rule: Unconditional rejection occurs solely for ontological-mechanism errors or missing sunset triggers for mutable/self-declared groups; all normative sufficiency judgments require human deliberation.**

  ### Decision Procedure
  **STAGE 1: CATEGORY-STABILITY AUDIT**  
  *Question: How is group membership defined and verified?*  
  - **Administratively fixed**: Immutable state (e.g., birth records, legal documents).  
  - **Administratively mutable**: Objective criteria subject to change (e.g., income, location).  
  - **Self-declared**: Reliance on self-identification ± verification.  
  - *Sufficient answer*: Clear classification into one state.  
  - *Unconditional rejection*: None (proceed to Stage 2).  
  - *Hand to human*: Ambiguous boundaries (e.g., hybrid verification).  

  **STAGE 2: NORMATIVE-MODE MATCH**  
  *Question: Does the mechanism align with category stability?*  
  - **Fixed** → Rigid mechanism (hard quota).  
  - **Mutable** → Flexible mechanism (sliding-scale).  
  - **Self-declared** → Participatory mechanism (consultation/self-ID).  
  - *Sufficient answer*: Mechanism matches stability type.  
  - *Unconditional rejection*: **Ontological-mechanism error** (e.g., self-declared + rigid mechanism).  
  - *Hand to human*: Disputed normative justification (e.g., whether rectificatory claims outweigh distributive).  

  **STAGE 3: MECHANISM-PROPORTIONALITY CHECK**  
  *Question: Is the mechanism’s rigidity proportional to the normative justification?*  
  - **Rectificatory** (harm repair): Allows rigidity only for fixed/mutable groups.  
  - **Distributive** (resource equity): Requires flexibility if group is mutable.  
  - **Recognitive** (inclusion): Requires participatory design for self-declared groups.  
  - *Sufficient answer*: Mechanism rigidity ≤ justification severity (e.g., rigid rectification for fixed groups).  
  - *Unconditional rejection*: Fixed mechanism for distributive/mutable cases (e.g., hard quota for income-based groups).  
  - *Hand to human*: Proportionality debates (e.g., whether a sliding scale adequately addresses historical harm).  

  **STAGE 4: SUNSET-OR-REVIEW TRIGGER**  
  *Question: Is there a review clause for mutable/self-declared groups?*  
  - **Fixed groups**: Review optional (harm assumed permanent).  
  - **Mutable/self-declared**: Review required (conditions may change).  
  - *Sufficient answer*: Time-bound review/sunset clause for relevant groups.  
  - *Unconditional rejection*: **No review for mutable/self-declared groups**.  
  - *Hand to human*: Review adequacy (e.g., 5-year vs. 10-year intervals).  

  ---  
  ### Worked Examples  
  **Case (a): US university – 12% racial enrollment floor (self-ID with audit)**  
  - **Stage 1**: *Self-declared* (self-identification with audit).  
  - **Stage 2**: **Reject** (ontological-mechanism error). Rigid floor (hard percentage) paired with self-declared group.  
  - *Stop*. No further stages.  

  **Case (b): Indian university – 27% OBC reservation + income-cap exemption**  
  - **Stage 1**: *Administratively mutable* (OBC status changes with income).  
  - **Stage 2**: Pass (flexible mechanism via income exemption matches mutable group).  
  - **Stage 3**: Pass (rectificatory justification allows rigidity for mutable groups when coupled with flexibility).  
  - **Stage 4**: Pass (income cap implies ongoing review; Indian law mandates periodic reassessment).  
  - **Outcome**: Approve.  

  **Case (c): Norwegian corporate boards – 40% gender target (comply-or-explain + self-certification)**  
  - **Stage 1**: *Self-declared* (self-certification of gender).  
  - **Stage 2**: Pass (comply-or-explain is participatory, not rigid).  
  - **Stage 3**: Pass (recognitive justification matches participatory mechanism).  
  - **Stage 4**: **Reject** (no sunset/review clause specified for self-declared group).  
  - **Outcome**: *Unconditional rejection* (likely resisted: self-declared groups require review triggers).  

  ---  
  **What the procedure cannot adjudicate**:  
  1. Severity of historical harm or disparity (e.g., whether 12% floor is *deserved*).  
  2. Moral permissibility of group-based preferences (e.g., whether reparations outweigh meritocracy).  
  3. Threshold adequacy (e.g., if 40% target is too high/low).  
  *These require human value judgments.*
