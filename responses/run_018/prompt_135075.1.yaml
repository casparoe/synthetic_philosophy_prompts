     - What part of creativity does this model capture? (Systematic parameter adjustment.) What does it miss? (The unconscious, automatic nature of the slippage — Hofstadter talks about the mind doing this automatically and below awareness. Also, in reality, the parameters are not so clearly defined and might interact in complex ways.)

