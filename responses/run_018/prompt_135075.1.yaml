  We are designing an in-class game for a graduate seminar on philosophy of mind, with the goal of illustrating Hofstadter's idea of creativity as "knob-twiddling" — variations on a theme through parameter adjustment. The theme is the social practice of apology, and we'll avoid art/music examples. We'll have 10 people, 75 minutes, one meeting.

  Game Structure:

  1. Preparation (5 min)
     - Form small groups: 10 people -> 2 groups of 5 (or 3 groups: two of 3 and one of 4, but 2 groups of 5 is simpler). If time is tight, we can do 3 groups (3,3,4) to have more examples, but let's go with 2 groups for simplicity and to allow more discussion.
     - Each group gets:
          - A "seed concept" card: "The social practice of apology"
          - Five parameter dials (made of cardboard/paper) labeled:
              1. Scale of harm addressed (from "Minor faux pas" to "Catastrophic event")
              2. Direction of agency (from "Actor apologizing" to "Victim demanding apology" to "Third-party mediation")
              3. Emotional temperature (from "Cold and formal" to "Warm and intimate")
              4. Temporal orientation (from "Immediate response" to "Long-delayed reckoning")
              5. Social visibility (from "Private exchange" to "Public spectacle")
          - Each dial has a circular card with a range of values (like a clock face) and a pointer that can be rotated. Alternatively, we can use sliders or cards with discrete options. For simplicity, let's use cards with 3-5 discrete options per parameter. We'll use 3-4 options per parameter to keep it manageable.

     Example options for each parameter:

     - Scale of harm addressed:
          - Option 1: Minor faux pas (e.g., stepping on someone's foot)
          - Option 2: Moderate harm (e.g., breaking a promise)
          - Option 3: Serious harm (e.g., betrayal of trust)
          - Option 4: Catastrophic event (e.g., causing a major accident)

     - Direction of agency:
          - Option 1: Actor apologizing (standard)
          - Option 2: Victim demanding apology (the harmed party initiates)
          - Option 3: Third-party mediation (an intermediary facilitates)

     - Emotional temperature:
          - Option 1: Cold and formal (e.g., legalistic, without emotion)
          - Option 2: Neutral (matter-of-fact)
          - Option 3: Warm and intimate (emotionally expressive)
          - Option 4: Volatile (angry, tearful, etc.)

     - Temporal orientation:
          - Option 1: Immediate response (right after the event)
          - Option 2: Short delay (within days)
          - Option 3: Long-delayed (years later)
          - Option 4: Preemptive (apology before the harm occurs)

     - Social visibility:
          - Option 1: Private exchange (only the parties involved)
          - Option 2: Small group (a few witnesses)
          - Option 3: Public spectacle (broadcast, large audience)

     We'll provide each group with a set of 5 cards (each card is one parameter) and for each parameter, they have a set of options (on the same card, they can choose by pointing a paperclip or by having a movable arrow attached with a brad).

     Alternatively, we can make a single sheet per group with all five parameters, each with a slider (a paper strip that can slide to show the chosen option). But for simplicity and cheapness, let's do:

     - Each group gets 5 cards (one per parameter). Each card has the parameter name and the options listed in a circle (or in a row) and a movable arrow (attached by a brad or a paperclip that can spin).

  2. Rules (5 min explanation by instructor)
     - Each group must randomly select 2 or 3 parameters to adjust (by drawing from a hat with parameter names, or by rolling a die). Alternatively, to ensure they adjust multiple parameters, we can require that they adjust at least 2 and up to 3. We can let them choose which 2 or 3 to adjust, but we want to avoid them only adjusting one. So we'll say: "Each group must choose 2 or 3 parameters to adjust. You cannot adjust only one, and you cannot adjust more than three." They can choose which ones.

     - For the parameters they choose to adjust, they set the dial to a non-standard value (i.e., not the one that would be typical for a standard apology). The standard apology setting for each parameter might be:
          - Scale: Moderate harm (Option 2) [but note: minor is also common, so we can let them know the standard range is 1-2, but they can choose 3 or 4 to adjust]
          - Direction: Actor apologizing (Option 1)
          - Emotional temperature: Neutral to Warm (Option 2 or 3) — but they can choose Cold or Volatile to adjust
          - Temporal: Immediate or Short delay (Option 1 or 2) — so they can choose Long-delayed or Preemptive
          - Social visibility: Private (Option 1) — so they can choose Small group or Public

     But note: we don't want to be too prescriptive. So we'll tell them that the standard apology is typically in the middle of the ranges, and they should try to set at least two parameters to an extreme or non-standard setting.

     - Then, they have 15 minutes to create a concrete scenario or micro-ritual that still counts as a variation on apology but is clearly different. They must write a brief description (a paragraph) and give it a title.

