prompt: |-
  You are the research-integrity officer at a research university, responsible for auditing faculty justifications for post-hoc modifications to study protocols. The philosophical distinction between reasons of the right kind and reasons of the wrong kind holds that some considerations bear on whether a belief or methodological choice is warranted by its object (for example, that a data point reflects instrument malfunction), while others bear only on whether holding that belief or making that choice is beneficial (for example, that removing it yields statistical significance). You must operationalize this distinction into a reusable audit procedure that a non-philosopher can apply consistently to written justifications submitted after preliminary data inspection.

  Construct a step-by-step decision procedure, presented as an ordered sequence of tests with explicit branching conditions, that classifies a researcher's stated reason for altering a protocol. The procedure must address three specific decision nodes: (i) exclusion of individual observations; (ii) addition, removal, or transformation of covariates in an analytic model; and (iii) substitution of a pre-registered statistical model with an alternative specification. At each node, specify the indicators that a reason is responsive to the internal evidential aims of the study, the indicators that it is responsive to external incentives, career pressures, or desired outcomes, and the conditions that trigger mandatory escalation to a review panel because the procedure cannot settle the classification.

  Incorporate three structural checks into the procedure: an initial filter separating considerations about the study's epistemic aims from considerations about its institutional or personal consequences; a symmetry test asking whether the researcher would have accepted the same consideration if it produced a result contrary to their interests; and a mixing clause that identifies arguments in which both kinds of reason are intertwined and requires disaggregation before evaluation. Provide fully worked applications of the complete procedure to three submitted justifications: one in which the reason is clearly of the right kind but forces the researcher to abandon a favored hypothesis; one in which the reason is of the wrong kind but is expressed in technically legitimate language; and one genuinely ambiguous case in which the procedure reaches no determination and must be escalated.

  Conclude by stating the explicit limits of the procedure: whether it can identify unconscious bias, whether it requires access to private mental states, whether it treats all pragmatic considerations as corrupting, and whether it applies differently when the protocol change was made before versus after data inspection. Do not cite philosophical texts or provide a bibliography; ground the procedure solely in the conceptual structure of the distinction itself.
reasoning: |-
  We are constructing a decision procedure for auditing faculty justifications for post-hoc modifications to study protocols. The procedure is based on the distinction between "reasons of the right kind" (which bear on the internal evidential aims of the study, such as data quality or methodological appropriateness) and "reasons of the wrong kind" (which bear on external incentives, career pressures, or desired outcomes).

  The procedure must address three decision nodes:
  (i) Exclusion of individual observations
  (ii) Addition, removal, or transformation of covariates in an analytic model
  (iii) Substitution of a pre-registered statistical model with an alternative specification

  At each node, we will specify:
  - Indicators of right kind (internal evidential aims)
  - Indicators of wrong kind (external incentives, etc.)
  - Conditions for mandatory escalation (when the procedure cannot settle the classification)

  Structural checks:
  1. Initial filter: Separate considerations about the study's epistemic aims (right kind) from considerations about institutional or personal consequences (wrong kind).
  2. Symmetry test: Would the researcher have accepted the same consideration if it produced a result contrary to their interests?
  3. Mixing clause: If both kinds of reasons are intertwined, require disaggregation before evaluation.

  We will then provide three worked examples:
  A. Clearly right kind reason (but forces abandonment of favored hypothesis)
  B. Wrong kind reason expressed in technically legitimate language
  C. Ambiguous case requiring escalation

  Finally, state the explicit limits of the procedure.

  ---

  **Step-by-Step Decision Procedure**

  **Step 0: Initial Filter**
     - Extract the researcher's stated reason and separate it into distinct considerations.
     - For each consideration, ask: "Does this consideration relate to the quality of the data, the validity of the measurement, the appropriateness of the method for the research question, or the integrity of the inference? (Right kind) OR Does it relate to the consequences of the outcome (e.g., publication prospects, funding, career advancement, desired result, stakeholder expectations)? (Wrong kind)"
     - If any part is about consequences, flag that part as potentially wrong kind. If the entire reason is about consequences, then it is wrong kind and the procedure ends (classification: wrong kind). If the entire reason is about epistemic aims, then proceed to Step 1 (but note that we must still apply the symmetry test and mixing clause). If both are present, proceed to Step 1 but note the mixing for Step 3.

  **Step 1: Apply to the Specific Decision Node**
     - The procedure branches based on the node (i, ii, or iii). We will define for each node:

  **Node (i): Exclusion of individual observations**
     - Indicators of right kind:
        - The observation is an outlier due to a known data collection error (e.g., instrument malfunction, data entry error, protocol violation).
        - The observation is outside the valid range of the measurement instrument (e.g., values beyond detection limits, biologically impossible values).
        - The exclusion is based on a pre-specified criterion (from the pre-registered protocol) for data cleaning.
        - The exclusion is justified by a technical reason that is independent of the outcome (e.g., the data point was corrupted).
     - Indicators of wrong kind:
        - The observation is excluded because it is an outlier that, when included, makes the result non-significant or less favorable to the hypothesis.
        - The reason for exclusion is only provided after seeing the outcome and without a pre-existing criterion.
        - The exclusion changes the result in a desired way and the reason is not supported by evidence of a data problem.
     - Conditions for escalation:
        - The reason is ambiguous (e.g., "this observation is an outlier" without evidence of a data problem, or the exclusion criterion is applied inconsistently).
        - The researcher claims a data problem but cannot provide documentation (e.g., lab notes) and the effect of exclusion is substantial.

  **Node (ii): Addition, removal, or transformation of covariates**
     - Indicators of right kind:
        - The covariate adjustment is based on a theoretical reason that was overlooked in pre-registration and is necessary to control for confounding.
        - The covariate is found to have measurement issues (e.g., unreliability) that were not known at the time of pre-registration.
        - The transformation is required to meet model assumptions (e.g., normality, linearity) and is justified by diagnostic plots or statistical tests that are independent of the outcome.
        - The change is based on new evidence (e.g., from another study) that was not available at the time of pre-registration and that directly relates to the validity of the model.
     - Indicators of wrong kind:
        - The change is made to achieve statistical significance or a desired effect size.
        - The covariate is added or removed because it is a suppressor or confounder that, when adjusted for, yields a more favorable result.
        - The transformation is chosen because it produces a better p-value without a strong justification based on model diagnostics or theory.
     - Conditions for escalation:
        - The justification mixes theoretical reasons and outcome-related reasons.
        - The change is based on complex model comparisons without clear a priori theoretical grounds.

  **Node (iii): Substitution of a pre-registered statistical model**
     - Indicators of right kind:
        - The pre-registered model is found to be inappropriate for the data structure (e.g., it violates key assumptions and the alternative is more robust).
        - There is a technical error in the pre-registered model specification (e.g., a software limitation was discovered).
        - The alternative model is based on a newly developed method that is clearly superior and was not available at the time of pre-registration, and the change is made to improve the validity of the inference.
     - Indicators of wrong kind:
        - The substitution is made because the pre-registered model did not yield significant results and the alternative does.
        - The alternative model is chosen from a set of candidate models because it yields the most favorable outcome.
        - The justification includes statements about the results (e.g., "this model gives a cleaner result").
     - Conditions for escalation:
        - The researcher claims that the pre-registered model was flawed but the evidence for the flaw is contested or unclear.
        - The change is complex and involves multiple steps, making it hard to discern the primary motive.

  **Step 2: Symmetry Test**
     - For the stated reason, ask: "Would the researcher have applied the same protocol change if the situation were reversed (i.e., if the change would have made the result less favorable or contrary to their hypothesis)?"
     - If the answer is clearly "yes", then the reason is more likely right kind.
     - If the answer is "no" or uncertain, then it is more likely wrong kind.
     - If the symmetry test cannot be answered (e.g., the situation is unique and reversible scenario is hard to imagine), then proceed to Step 3 but note the uncertainty.

  **Step 3: Mixing Clause**
     - If the justification contains both right kind and wrong kind reasons, then require the researcher to disaggregate the reasons and resubmit. The procedure must be reapplied to each part separately.
     - If the reasons are intertwined and cannot be disaggregated, then the entire justification must be escalated to a review panel.

  **Step 4: Final Classification**
     - After Steps 1-3, if the reason is clearly right kind (passes the initial filter, has right kind indicators at the node, passes the symmetry test, and no wrong kind reasons are present), classify as right kind.
     - If the reason has wrong kind indicators (fails the initial filter, has wrong kind indicators at the node, fails the symmetry test, or has wrong kind reasons that cannot be disaggregated), classify as wrong kind.
     - If at any step the condition for escalation is met, then escalate to a review panel.

  ---

  **Worked Examples**

  **Example A: Clearly right kind reason (forces abandonment of favored hypothesis)**
     - *Scenario*: A researcher excludes an observation because the laboratory notebook shows that the sample was contaminated during processing (Node i).
     - *Procedure*:
          Step 0: The reason is about data quality (contamination) -> right kind.
          Step 1 (Node i): Exclusion due to known data collection error -> right kind indicator. No wrong kind indicators.
          Step 2: Symmetry test: Would they have excluded if it made the result more significant? Yes, because contamination is a data quality issue regardless of the outcome.
          Step 3: No mixing -> no disaggregation needed.
          Step 4: Classify as right kind. Note that the exclusion actually made the result non-significant (abandoning the favored hypothesis) but the reason is still right kind.

  **Example B: Wrong kind reason in technically legitimate language**
     - *Scenario*: A researcher adds a covariate to a model because "it controls for a potential confounder" (Node ii). However, the covariate was not pre-registered and the researcher only considered adding it after seeing that the effect becomes significant with this covariate. The researcher states that the covariate is theoretically relevant, but the theory is post hoc and weak.
     - *Procedure*:
          Step 0: The stated reason is about controlling confounding (epistemic) -> right kind? But note: we must check for hidden motives.
          Step 1 (Node ii): The addition of the covariate is justified by a theoretical reason, but the timing (after seeing results) and the fact that it yields significance are wrong kind indicators. Also, the theory is weak and post hoc.
          Step 2: Symmetry test: Would the researcher have added the covariate if it made the result non-significant? The researcher might say yes, but the context (it was only added after seeing the results and because it helped) suggests no.
          Step 3: The reason is stated in epistemic terms, but there are mixed motives. However, the procedure requires disaggregation only if both kinds are explicitly stated. Here, only one kind is stated, but we have indicators of wrong kind from Step 1 and Step 2. This is a borderline case, but we note that the justification is technically legitimate but the context (post-hoc and outcome-dependent) suggests wrong kind.
          Step 4: Given the indicators of wrong kind (outcome-dependent) and the symmetry test failure, classify as wrong kind.

  **Example C: Genuinely ambiguous case requiring escalation**
     - *Scenario*: A researcher changes the statistical model from a linear regression to a generalized linear model with a log link (Node iii). The justification states that diagnostic plots for the original model showed non-linearity and heteroscedasticity, and that the new model better fits the data. However, the change also results in a significant finding for the main hypothesis, which was not significant in the original model. The researcher provides diagnostic plots but they are somewhat ambiguous.
     - *Procedure*:
          Step 0: The reason is about model fit (epistemic) -> right kind.
          Step 1 (Node iii): The change is justified by model diagnostics (right kind indicator). However, the change also yields significance (wrong kind indicator). The diagnostics are ambiguous (condition for escalation at Node iii: evidence for the flaw is contested).
          Step 2: Symmetry test: Would the researcher have made the change if it made the result non-significant? The researcher might argue yes, but we cannot be sure because it did make it significant. The context is unclear.
          Step 3: There is potential mixing: the change improves model fit (right kind) but also produces a desired outcome (wrong kind). The reasons are intertwined (the same act has both implications). We require disaggregation? But the justification does not separate the two. The researcher must resubmit with a clear reason only on the model fit. However, even after disaggregation, the model fit reason remains and we still have the ambiguity of the diagnostics. Alternatively, because the reasons are intertwined and we cannot separate the motive, we escalate.
          Step 4: Conditions for escalation are met (ambiguous diagnostics and intertwined reasons). Escalate to a review panel.

  ---

  **Explicit Limits of the Procedure**

  1. **Unconscious bias**: The procedure cannot directly identify unconscious bias because it relies on the stated justification. It may catch some cases through the symmetry test or the context, but it is not designed to uncover hidden motives that the researcher is unaware of.

  2. **Private mental states**: The procedure does not require access to private mental states (e.g., what the researcher truly believed). It relies solely on the written justification and available evidence (e.g., lab notes, data). However, the symmetry test might be seen as probing intentions, but it is applied hypothetically and does not require mind-reading.

  3. **Pragmatic considerations**: The procedure does not treat all pragmatic considerations as corrupting. Only pragmatic considerations that are about external incentives (e.g., career pressures, funding) are considered wrong kind. Pragmatic considerations about the feasibility of the research (e.g., "we could not collect that covariate") might be legitimate and could be considered right kind if they relate to the internal validity of the study.

  4. **Timing of change**: The procedure is designed for post-hoc modifications (after data inspection). However, it can be applied to changes made before data inspection as well. For changes before data inspection, the concerns about outcome-driven motives are reduced, but the same distinction applies: is the change motivated by improving the study's internal validity (right kind) or by external incentives (wrong kind)? The symmetry test might be less critical for changes before data inspection because the outcome is unknown.

  5. **Scope**: The procedure is limited to the written justification and the available evidence. It cannot account for information that is not provided or documented. It also does not cover every possible modification scenario but focuses on the three specified nodes.
answer: |-
  ### Decision Procedure for Auditing Post-Hoc Protocol Modifications  
  This procedure classifies a researcher's stated justification for protocol changes into **right-kind reasons** (RKR; responsive to internal evidential aims) or **wrong-kind reasons** (WKR; responsive to external incentives/outcomes). It applies to three decision nodes:  
  **(i)** Exclusion of individual observations;  
  **(ii)** Addition, removal, or transformation of covariates;  
  **(iii)** Substitution of a pre-registered statistical model.  

  ---

  #### **Step 0: Initial Filter**  
  *Separate epistemic aims from external consequences.*  
  - **Input:** Researcher’s written justification.  
  - **Action:**  
    1. Extract all distinct considerations.  
    2. **RKR indicators:** Mentions data quality, measurement validity, model assumptions, methodological appropriateness, or inference integrity.  
       - *Example:* "Sensor malfunction distorted this data point."  
    3. **WKR indicators:** Mentions publication prospects, funding, stakeholder expectations, statistical significance, or career implications.  
       - *Example:* "Excluding this outlier achieved p < 0.05."  
  - **Branching:**  
    - If **all considerations are RKR** → Proceed to Step 1.  
    - If **any consideration is WKR** → Flag "potential WKR" and proceed to Step 1.  
    - If **only WKR considerations** → Classify as WKR. End.  

  ---

  #### **Step 1: Node-Specific Evaluation**  
  *Apply tests to the relevant decision node. Use indicators below.*  

  | Node          | RKR Indicators                                                                 | WKR Indicators                                                                 | Escalation Triggers                                                                 |
  |---------------|--------------------------------------------------------------------------------|--------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **(i) Observation Exclusion** | - Pre-registered exclusion criteria met.<br>- Evidence of instrumentation/collection error.<br>- Biological/technical implausibility. | - Outcome-dependent: exclusion only mentioned after seeing results.<br>- Justification relies on statistical impact (e.g., "restored significance").<br>- Selective application (e.g., only excludes outliers opposing hypothesis). | - Ambiguous evidence (e.g., "appears anomalous" without documentation).<br>- Exclusion drastically changes results. |
  | **(ii) Covariate Modification** | - Covariate added/removed to address confounding revealed in data.<br>- Transformation resolves model violations (e.g., heteroscedasticity).<br>- Theoretical justification from new literature. | - Covariate chosen because it suppresses/amplifies the effect size.<br>- Change motivated by improving model fit metrics (e.g., R²/AIC) without diagnostic evidence.<br>- Post-hoc "fishing" for significant predictors. | - Complex model comparisons without clear diagnostics.<br>- Covariate role conflicts with domain theory. |
  | **(iii) Model Substitution** | - Pre-registered model violates assumptions (e.g., non-normality).<br>- Alternative better aligns with data structure (e.g., count data → Poisson).<br>- Correction for software/implementation error. | - Change made after null results.<br>- Justification emphasizes "more significant" or "cleaner" results.<br>- Multiple alternative models tested. | - Substitution rationale conflates inference quality and results.<br>- Assumption violations disputed. |

  - **Branching:**  
    - If indicators are **exclusively RKR** → Proceed to Step 2.  
    - If indicators are **exclusively WKR** → Classify as WKR. End.  
    - If **mixed or unclear** → Proceed to Step 2 (applies symmetry test).  
    - If **escalation triggers met** → Escalate to review panel. End.  

  ---

  #### **Step 2: Symmetry Test**  
  *Assess if the reason would hold if outcomes opposed researcher’s interests.*  
  - **Action:**  
    - Reformulate justification hypothetically: *"Would the researcher accept this change if it made results* **less** *favorable?"*  
      - *Example (Node i):* "If excluding this observation made p = 0.06, would you still exclude it?"  
  - **Branching:**  
    - **Yes (symmetric)** → Supports RKR. Proceed to Step 3.  
    - **No (asymmetric)** → Supports WKR. Proceed to Step 3.  
    - **Unanswerable** → Flag "asymmetry indeterminate." Proceed to Step 3.  

  ---

  #### **Step 3: Mixing Clause**  
  *Identify and disaggregate intertwined reasons.*  
  - **Action:**  
    - Scan justification for:  
      - Sentences blending RKR and WKR (e.g., "Removing this covariate corrected collinearity *and* yielded a publishable effect size").  
      - Ambiguous terms (e.g., "optimal" for both model fit and significance).  
  - **Branching:**  
    - If **no mixing** → Classify as RKR or WKR based on prior steps. End.  
    - If **mixing detected** → Require researcher to **disaggregate RKR and WKR**. Restart procedure with revised justification.  
    - If **disaggregation impossible** → Escalate to review panel. End.  

  ---

  ### Worked Examples  

  #### **Example 1: Clearly RKR (Abandons Favored Hypothesis)**  
  - **Scenario:** Node (i) exclusion. *"Excluded temperature readings from Sensor A during power surges (logged in lab notes). This forced null results (p = 0.11), contradicting our hypothesis."*  
  - **Procedure:**  
    - **Step 0:** "Sensor malfunction" → RKR. Proceed.  
    - **Step 1 (Node i):** Instrument error documented → RKR indicator. No WKR. Proceed.  
    - **Step 2:** Symmetry test: Exclusion even if it worsened results? **Yes** (integrity requires removing faulty data).  
    - **Step 3:** No mixing.  
    - **Classification: RKR.**  

  #### **Example 2: WKR in Legitimate Language**  
  - **Scenario:** Node (ii) covariate removal. *"Removed household income due to multicollinearity (VIF > 10). This improved model parsimony."*  
  - **Procedure:**  
    - **Step 0:** "Multicollinearity" → RKR. Proceed.  
    - **Step 1 (Node ii):** VIF > 10 → RKR indicator. **But** escalation triggered: No diagnostics show multicollinearity distorted inference. Audit reveals removal only after seeing it made the key predictor significant.  
    - **Step 2:** Symmetry test: Remove covariate if it made results null? **No** (researcher admitted they would retain it in this case).  
    - **Step 3:** No mixing.  
    - **Classification: WKR** (using technical language to mask outcome-dependence).  

  #### **Example 3: Ambiguous Case (Escalation Required)**  
  - **Scenario:** Node (iii) model substitution. *"Switched ANOVA to Welch’s t-test. ANOVA homogeneity assumption violated (Levene’s p = 0.04), and t-test is robust. Results became significant (p = 0.03)."*  
  - **Procedure:**  
    - **Step 0:** "Assumption violation" → RKR. Proceed.  
    - **Step 1 (Node iii):** Assumption violation → RKR indicator. **But** escalation triggered: Change made post-results, and rationale conflates robustness and significance ("results became significant").  
    - **Step 2:** Symmetry test: Switch if results worsened? **Unanswerable** (researcher states "it depends on diagnostics," but timing suggests bias).  
    - **Step 3:** Mixing detected (justification mentions significance). Disaggregation requested. Researcher fails to isolate RKR.  
    - **Outcome: Escalate to review panel.**  

  ---

  ### Explicit Limits of the Procedure  
  1. **Unconscious bias:** Cannot detect implicit motives; relies on stated justifications.  
  2. **Private mental states:** Requires no access to intentions; uses symmetry test as a proxy.  
  3. **Pragmatic considerations:** Treats *only outcome-dependent* pragmatism as corrupting. Pragmatic RKR (e.g., "this covariate data was corrupted") are valid.  
  4. **Timing of change:** Applies solely to **post-hoc** modifications (after preliminary data inspection). Changes *before* inspection require a separate pre-hoc audit.  
  5. **Scope:** Cannot resolve disputes where RKR and WKR are empirically indistinguishable (e.g., when statistical benefits align perfectly with epistemic improvements).
