answer: |-
  ### Joint Statement: Cross-Cultural Intuitions Metaethics Project  
  *Drafted via Adversarial Collaboration between Universalist (U) and Contextualist (C) Signatories*  

  ---

  #### 1. Agreed Claims  
  *Both camps endorse these methodological and empirical starting points:*  
  1. **Intuition Definition**: "Metaphysical intuitions" refer to *pre-reflective, defeasible judgments* elicited in response to thought experiments or real-world scenarios, distinct from explicit doctrinal beliefs or post-hoc rationalizations.  
  2. **Performance Errors**: Genuine intuitions may be masked by:  
     - Linguistic ambiguity in translation (e.g., conflating "ought" with "must")  
     - Cognitive load exceeding local norms (e.g., abstract syllogisms in oral cultures)  
     - Demand characteristics of lab-based surveys  
  3. **WEIRD Limitations**: Existing data overrepresent Western, Educated, Industrialized, Rich, Democratic populations. Extrapolating from WEIRD samples to species-wide claims requires extraordinary justification.  
  4. **Current Methodological Ceiling**:  
     - Surveys cannot distinguish *culturally scaffolded* intuitions from *epistemically basic* ones.  
     - Neuroimaging (e.g., fMRI during intuition tasks) correlates physiology with judgment but cannot resolve metaphysical disputes.  
  5. **Minimal Universal Baseline**: All cultures recognize *some* distinction between (a) intentional vs. accidental actions and (b) persistent entities vs. transient states.  

  ---

  #### 2. Disagreements Table  
  | Issue | Universalist (U) Position | Contextualist (C) Position |  
  |-------|----------------------------|-----------------------------|  
  | **Source of Stability** | Cross-cultural similarities in intuitions (e.g., object permanence) reflect innate cognitive architecture. | Similarities arise from convergent cultural evolution or globalization, not innate metaphysics. |  
  | **Interpretation of Variation** | Observed differences are methodological artifacts or peripheral "noise" (e.g., threshold effects in moral luck cases). | Systematic variation (e.g., East Asian vs. Euro-American causation intuitions) reveals deep cultural shaping of core concepts. |  
  | **Role of Language** | Language expresses pre-linguistic intuitions; translation errors explain apparent divergence. | Language structures intuition (e.g., tenseless languages shaping temporal persistence judgments). |  
  | **Default Human Cognition** | Untrained adults exhibit "default" intuitions that align with professional philosophy when freed from performance errors. | Philosophical training *creates* specialized intuitions; "folk" judgments are irreducibly pluralistic. |  

  *Terminology Note*: Both sides disavow "relativism" (C: prefers "structural pluralism") and "naïve nativism" (U: prefers "constrained universality").  

  ---

  #### 3. Cruxes & Predictions  
  **Crux 1: Narrative Invariance Test**  
  > *Does linguistic framing alter intuitions when narrative content is identical?*  
  - **Study**: Bilingual subjects respond to identical moral dilemmas (e.g., trolley problem) presented in structurally distinct languages (e.g., Spanish vs. Yucatec Maya), controlling for narrative sequence.  
  - **U Prediction**: ≤5% shift in intuition patterns between language conditions.  
  - **C Prediction**: ≥20% shift, correlating with grammatical agency markers.  
  - *Reflective Equilibrium (RE) Stakes*: U sees RE as globally convergent; C argues RE is language-bound.  

  **Crux 2: Collective Responsibility in Small-Scale Societies**  
  > *Do societies without centralized legal systems attribute moral responsibility differently for collective harms?*  
  - **Study**: Standardized scenarios (e.g., resource depletion) tested among forager-horticulturalists (e.g., Tsimané) vs. WEIRD urbanites. Measures include blame attribution and restitution expectations.  
  - **U Prediction**: All groups prioritize individual intentionality over group outcomes.  
  - **C Prediction**: Collectivist societies will assign blame to corporate groups (e.g., lineages) irrespective of individual mens rea.  

  **Crux 3: Silent Intuitions & Default Reasoning**  
  > *Do non-verbal tasks reveal universal "default" intuitions in non-literate populations?*  
  - **Study**: Implicit association tasks (e.g., sorting images of "same person" after physical changes) + behavioral economic games measuring fairness intuitions, administered sans verbal instruction in oral cultures.  
  - **U Prediction**: Cross-cultural convergence (e.g., >80% match on personal identity thresholds).  
  - **C Prediction**: Culture-specific patterns (e.g., bodily vs. narrative continuity emphasis), with no universal baseline.  
  - *RE Stakes*: U treats silent intuitions as raw data for global RE; C argues RE requires local hermeneutic frameworks.  

  ---

  ### Collaboration Protocol  
  This document establishes that:  
  - **Substantive Disagreement** centers on *depth* of cultural shaping (U: surface; C: constitutive).  
  - **Progress** requires resolving the 3 cruxes via pre-registered replications.  
  - **Terminology Truce**: "Intuition" excludes explicit beliefs; "culture" includes institutional and linguistic practices.  

  *Approved for co-signature by Universalist and Contextualist representatives.*  

  ---  
  *Design Note: This structure forces mutual recognition by (a) isolating shared premises, (b) crystallizing divergences without strawmen, and (c) tying predictions to decisive evidence. The "silent intuition" crux targets the core metaphysical rift while operationalizing reflective equilibrium’s scope.*
