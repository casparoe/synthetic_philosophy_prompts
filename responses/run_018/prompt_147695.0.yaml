  You are a professional philosopher of science who specializes in adversarial collaberation design — please think carefully and start with some quick brainstorming before you draft anything. I'm a PhD student in philosphy (writing this between classes so excuse any typos) and I need you to write the joint statement that two camps in the cross-cultural intuition debate should have produced after a year of arguing past each other.

  The two sides:
  - The Universalists: deep metaphysical intuitions (causation, free will, personal identity, moral responsibility) are basically stable across cultures; apparent differences are noise, translation errors, or superficial framing effects.
  - The Contextualists: these intuitions are systematically shaped by cultural frameworks (collectivist vs individualist structures, language families, etc.); WEIRD samples are outliers, not baselines.

  Deliverable format:
  1. Agreed claims: numbered list of factual and methodological points both sides can sign. Include what counts as a real intuition vs a performance error, and the current limits of survey methods.
  2. Disagreements table: exact divergences in neutral wording, so each side recognizes its own view. Separate real substance from terminology fights.
  3. Cruxes: sub-questions where settling them would move at least one side. I suspect three matter — (a) whether linguistic framing effects survive when narrative structure is held constant; (b) whether small-scale societies show different patterns on collective moral responsibility; and (c) whether there's a 'default mode' of metaphysical reasoning that shows up even without formal philosophical training — but refine or replace these if the logic demands it. Crucially, inject one niche framing: treat 'reflective equilibrium' as either a global cross-cultural method or a locally-bound one, and make that part of the crux structure.
  4. For each crux, name one concrete comparative study or evidence both sides agree is relevant, and record in advance what each camp predicts.

  Constraints: no bibliographies, no reading lists, no citations — this has to work for a model without web access. Don't invoke super obscure theories or figures I wouldn't expect a small LLM to know. But do keep it in the weeds: frame one crux around how to treat silent, non-verbal intuitive judgments in populations where explicit philosophical discourse isn't normative, since that's where the universalist-contextualist split actually gets interesting.

  Please proceed step-by-step: outline agreed claims first, then the disagreement table, then the cruxes with predictions. Make sure neither view is caricatured — the wording should be something both camps could literally put their names on.
