  ok so I'm trying to pin down a wierd decision-theoretic pattern I keep seeing in blackmail-across-worlds thought experiments. Case one: a predictor scans your algorithm and offers you a deal — pay 1000 utils now, or they flip a coin and torture exactly one of two parallel simulations of you (A and B), never both, and the coin outcome correlats with your choice in a strange way. Case two: same XOR structure, except now refusing to pay means you're the copy that gets instantiated and tortured, while paying makes you vanish and the other copy takes the hit. So in both setups exactly one counterfactual self suffers, and your action seems to pick the branch. People talk about counterfactual mugging where you're threatened over worlds that don't happen, but here the harm is split across two mutualy exclusive counterfactuals and your decision selects which one realizes. Is there an established name for this XOR-flavored blackmail? Does it actually change the decision calculus compared to standard mugging, or is it just decorative framing? I can't tell if I'm carving out something real or inventing distinctions.

