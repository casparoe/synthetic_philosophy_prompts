prompt: |-
  hey, i'm in lower sixth and i run this little lunchtime evolution reading group — there's about six of us, we've done speciation and some basic population genetics but basically no maths. i want to make one of those "which level does natural selection actually act at?" sorting quizzes for us to fill in before we argue about it, but everything i've found online either just announces that the gene is the unit of selection or drowns you in equations.

  what i'm after: a short quiz, 8 questions maximum, where every question is a concrete organism case with two or three answer options, plus a scoring key that sorts the answer patterns into the actual positions. but please build it from the logical space rather than from a list of names: give me the three or four separating questions your quiz is really asking underneath, the combinations of answers they allow, then locate the named positions in that space. tell me which combinations are empty and why nobody sits there (incoherent? just unattractive? merely unexplored?), and flag any two positions your quiz genuinely cannot separate rather than inventing a difference between them — if kin-style views and one flavour of group selection give the same verdict on every question you can think of, say that explicitly, that's the bit i'm most interested in.

  the cases need to be weird enough that we can't just guess the "right" answer from something we half remember. please use these three, plus at least two of your own:

  - a mutant gene that sabatoges the other copy of itself so it gets into way more than half the sperm, even though the males carrying it are less fertile overall — the gene spreads, the organism does worse
  - a colonial sea creature i basically made up: every colony starts from about twenty unrelated larvae that fuse into one colony, so cells inside a colony are no more related to each other than to cells in other colonies. some colonies carry a variant that makes their cells divide faster inside the colony, and those colonies are worse at producing new colonies. relatedness is basically zero here, so the kin route shouldn't be available at all
  - a learned bird-song dialect, nothing genetic: birds copy whichever dialect is most common around them, flocks singing one dialect survive droughts better than flocks singing another, but within any flock the birds singing the better dialect die slightly younger

  leaves i want on the tree: gene/replicator selectionism; the organism as the unit; inclusive-fitness or kin-style views; trait-group selection; and multi-level selection split into the version where the group's trait is only the average of its members' traits versus the version where the group has traits and a fitness of its own — i'm told these have different names but i don't care about the labels, just explain the difference. also species- or clade-level selection, the "it's all just bookkeeping, the levels aren't really separate claims" view, and whatever the deflationary no-unit-at-all / it's-just-lineages-proliferating position is called. if you find a combination that nobody actually holds, give it a leaf marked as undefended anyway and say what's wrong with it.

  rules: no question may ask which level someone likes, and no answer option should be "genes!" or "the group!" — every question should be answerable by someone who has never heard of the debate, as a claim about what actually happens in the case, so the quiz sorts us by what we say about the organisms. each leaf gets one sentence on the most awkward thing it's committed to. keep the biology readable for people who've done A-level and nothing past it, and please write the whole thing in British English.
reasoning: |-
  Okay, the user is in lower sixth form (that's Year 12 in the UK) and runs an evolution reading group. They've covered speciation and basic population genetics but without much math. They want a sorting quiz about the unit of selection debate—specifically, which level natural selection acts at. The quiz should be short, max 8 questions, with concrete organism cases and answer options that don't mention technical terms like "genes" or "groups." Instead, each question should present a scenario where the answer reveals the respondent's implicit view on the unit of selection.

  The user provided three specific scenarios they want included:  
  1. A "selfish gene" that sabotages the other copy in males, reducing overall fertility but spreading itself.  
  2. A colonial sea creature with zero relatedness where faster-dividing cells harm the colony's reproductive success.  
  3. A bird-song dialect that's learned, not genetic, where flocks with certain dialects survive better but individual birds with that dialect die younger.  

  They also want at least two more original scenarios. The quiz needs to sort people into positions like gene selectionism, organism-level, kin selection, trait-group selection, multi-level selection (with two variants), species/clade selection, and a deflationary "no unit" view.  

  The key challenge is designing questions that tease apart these positions without being too obvious. The scenarios must be weird enough that participants can't just recall textbook answers. Underneath, there should be 3-4 logical axes separating the views:  
  - Whether selection can act on non-replicating entities (like groups or ideas).  
  - Whether within-group conflict always undermines group adaptations.  
  - Whether group fitness is more than the sum of individual traits.  

  The user emphasized that overlapping positions (e.g., kin selection and one flavor of group selection giving identical answers) should be explicitly flagged, not artificially separated. Also, any "empty" combinations (incoherent or unattractive views) should be identified.  

  For the structure:  
  - Build a decision tree based on combinations of answers to the key questions.  
  - Map named positions onto this tree.  
  - For each position, include one sentence on its "most awkward commitment."  
  - Use British English throughout.  

  Additional scenarios I'll create:  
  4. A microbial system with toxin producers and non-producers where groups with more producers grow faster but producers are outcompeted within groups.  
  5. Epigenetic markers in plants that are inherited but can change within a generation, affecting individual and group survival differently.  

  The quiz will have 7 questions total: the user's 3 plus 4 new ones. Scoring will group answer patterns into positions, with clear explanations of why some combinations are empty or indistinguishable. Finally, the user wants this accessible to A-level students, so language must stay non-technical and engaging.
answer: |-
  Here’s a 7-question quiz designed to sort views on the unit of selection. Each question presents a concrete biological case with answer options framed as predictions about evolutionary outcomes. The scoring key maps answer combinations to theoretical positions, highlights overlaps, and identifies untenable combinations. Biology is kept at A-level accessibility.

  ---

  ### **The "Where Does the Buck Stop?" Evolution Quiz**
  *Answer based on what you think will happen evolutionarily in these weird scenarios. Pick ONE option per question.*

  1.  **Selfish Gene:** A gene variant in male mice sabotages the other copy of itself in sperm cells. Males carrying this gene produce fewer sperm overall (so are less fertile) but pass *this specific gene* on to *more* than 50% of their offspring. The gene spreads through the population.
      *   **A:** The gene will keep spreading, even though mouse populations with it become smaller/less healthy.
      *   **B:** The gene will eventually disappear because the harm to the mice outweighs its own advantage.
      *   **C:** The gene's spread depends on whether it helps or harms the mice *on average*.

  2.  **Fusion Colony:** A sea creature forms colonies when ~20 unrelated larvae fuse into one body ("colony"). Cells within a colony are no more related than cells in different colonies. A variant arises causing cells to divide faster *inside* their colony. Colonies with this variant grow larger faster but are worse at producing new larvae.
      *   **A:** The fast-dividing cell variant will spread because it outcompetes slower cells within colonies.
      *   **B:** The fast-dividing cell variant will disappear because colonies with it fail to reproduce.
      *   **C:** The variant might persist if colonies containing it occasionally succeed despite being worse.

  3.  **Learned Dialect:** Sparrows learn their song dialect by copying the most common version locally. Nothing genetic differs between dialects. Flocks singing "Dialect X" survive droughts 20% better than flocks singing "Dialect Y". However, *within* any single flock, individual sparrows singing Dialect X die slightly younger on average than those singing Dialect Y.
      *   **A:** Dialect X will become universal because flocks using it survive better.
      *   **B:** Dialect Y will persist or spread because individuals singing it live longer within flocks.
      *   **C:** Both dialects might coexist stably long-term.

  4.  **Toxin Producers (New):** In a bacterial species, some strains produce a toxin that kills competing bacterial species. Producing the toxin costs energy, slowing the producer's growth *within* a mixed group (e.g., an infection site). Groups (infection sites) containing *more* toxin producers outcompete other groups and spread more.
      *   **A:** Toxin producers will become rare because they are outcompeted within groups by non-producers.
      *   **B:** Toxin producers will become common because groups with more of them succeed overall.
      *   **C:** Toxin producers might persist at a stable level, neither vanishing nor dominating.

  5.  **Epigenetic Marks (New):** In a plant species, exposure to drought causes an epigenetic mark (heritable chemical tag, not DNA change) that makes offspring slightly more drought-tolerant. Plants *with* this mark survive droughts 10% better but grow 5% slower and produce 5% fewer seeds under normal conditions than plants *without* it. Droughts affect whole regions unpredictably.
      *   **A:** The drought mark will become universal because it aids survival during critical droughts.
      *   **B:** The drought mark will disappear because it reduces fitness most of the time (no drought).
      *   **C:** The mark's frequency will fluctuate depending on how often droughts happen.

  6.  **Altruistic Sentry (New):** Meerkats have sentries that watch for predators. Sentries give a warning call but are slightly more likely to be caught by the predator. Groups *with* a sentry suffer far fewer deaths per attack than groups without one. Sentinel behaviour has high heritability.
      *   **A:** Sentinel behaviour will spread because groups with sentries lose fewer members.
      *   **B:** Sentinel behaviour will disappear because sentries themselves die more often.
      *   **C:** Sentinel behaviour might spread if sentries are closely related to the group members they save.

  7.  **Clade Competition (New):** Two major evolutionary branches ("clades") of beetles exist. Clade X species reproduce rapidly but go extinct easily. Clade Y species reproduce slowly but are very resistant to extinction. Over millions of years, the environment becomes less stable.
      *   **A:** Clade X will dominate because its species multiply faster.
      *   **B:** Clade Y will dominate because its species survive harsh periods better.
      *   **C:** The overall diversity or abundance won't be predictable from species-level traits alone.

  ---

  ### **Scoring Key: Where Do You Stand?**
  Don't tally scores. **Look at your specific pattern of answers (e.g., 1A, 2B, 3C...).** The key maps combinations to theoretical positions based on **three underlying logical questions** the quiz probes:

  1.  **Can non-replicating/non-genetic "entities" (groups, ideas, epigenetic marks) be direct targets of selection?** (Q3, Q4, Q5, Q7)
  2.  **Does within-group conflict *always* prevent group-level adaptations?** (Q1, Q2, Q4, Q6)
  3.  **Is the "fitness" of a collective (group, species, clade) *more than* just the average fitness of its members?** (Q2, Q4, Q6, Q7)

  Here's how the positions map onto possible answer combinations:

  | Position                                                                 | Core Belief                                                                                                                                               | Your Likely Answers                                                                                                                               | Awkward Commitment                                                                                                  |
  | :----------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------ |
  | **1. Gene/Replicator Selectionism**                                      | Selection acts *only* on replicators (genes, epigenetic marks, memes); everything else is an effect. Within-group conflict always wins.                   | **1A, 2A, 3B, 4A, 5B, 6B, 7A/B/C (No preference)** <br>*Ignores group/species traits unless they directly aid the gene.*                          | Must argue that group benefits (Q4, Q6) are *always* temporary or illusory due to "cheats".                         |
  | **2. Organism as Unit**                                                  | Selection acts on individual organisms; group effects are by-products of individual fitness. Within-group conflict usually prevents true group adaptation. | **1C, 2B, 3B, 4A, 5B, 6B, 7C** <br>*Focuses on average individual costs/benefits.*                                                                | Struggles with Q2 (zero-relatedness group adaptation) and Q4 (altruism without relatedness).                        |
  | **3. Inclusive Fitness/Kin Selection**                                   | Selection acts on genes via effects on the individual *and* its relatives. Group effects require relatedness.                                             | **1A, 2B, 3C, 4C, 5B, 6C, 7C** <br>*Requires relatedness for cooperation (Q2B, Q4C, Q6C). Ignores non-genetic (Q3C).*                             | Cannot explain Q2 (group adaptation with zero relatedness) without extra assumptions.                               |
  | **4. Trait-Group Selection**                                             | Selection acts simultaneously on individuals *within* groups and groups *among* groups. Group fitness is the *average* of member fitness.                  | **1A, 2B, 3A/B (Depends), 4C, 5C, 6A/C (Depends), 7C** <br>*Group benefit must outweigh individual cost *on average* (Q4C, Q6A/C).*               | Sees Q2 as impossible (Q2B) because group fitness *is* average cell fitness, which favours "cheats".                |
  | **5. Multi-Level (Group Fitness = Sum)**                                 | Groups are real units. Group fitness is the *total output* (e.g., larvae, colonising groups) of the group, distinct from average member fitness.           | **1A, 2B, 3A, 4B, 5A, 6A, 7B** <br>*Groups can adapt *if* group output matters (Q2B, Q4B, Q6A), even with conflict (Q1A) or no genes (Q3A).*      | Must accept that traits harming individual fitness (Q1A, Q6A) can evolve purely via group output.                   |
  | **6. Multi-Level (Group Fitness ≠ Sum)**                                 | Groups have emergent properties & fitness not reducible to members. Group selection requires group-level heritable variation *and* differential extinction. | **1A/C (See Note), 2B, 3A, 4B, 5A, 6A, 7B** <br>*Requires clear group-level traits/heritability (Q2B, Q3A, Q4B, Q6A).*                            | Views Q1 as purely genic (Q1A), *unless* the gene harms groups *and* group selection is strong (then Q1C).          |
  | **7. Species/Clade Selection**                                           | Major evolutionary trends driven by selection among species or clades based on speciation/extinction rates. Ignores lower levels.                          | **1A/B/C (Irrelevant), 2A/B/C (Irrelevant), 3A/B/C (Irrelevant), 4A/B/C (Irrelevant), 5A/B/C (Irrelevant), 6A/B/C (Irrelevant), 7A/B** <br>*Only Q7 matters.* | Cannot explain adaptations *within* species (Q1-6) as anything but side-effects of speciation/extinction dynamics. |
  | **8. Deflationary / Lineages Proliferating**                             | "Selection" is just differential persistence of lineages across time/scales. No privileged "unit". It's patterns, not mechanisms.                          | **Any combination, *if* framed as lineage outcomes.** <br>*Focuses on *what persists* (e.g., Q1A: gene lineage spreads; Q2B: cell lineage dies out).* | Avoids mechanistic explanations; seen as just describing outcomes rather than explaining *how*.                   |
  | **9. Undefended Position: Strong Group Selection + Ignore Genes**        | Groups are *the* unit; gene-level conflict is irrelevant. Group benefit *always* wins.                                                                    | **1C, 2B, 3A, 4B, 5A, 6A, 7B** <br>*Denies the gene's spread in Q1 (C) despite evidence; assumes group benefit trumps everything.*                | Cannot explain the spread of "selfish genes" (Q1) or within-group cheats (Q4A) – empirically falsified.            |
  | **10. Undefended Position: Non-Replicator Selection + Ignore Conflict** | Non-genetic entities (groups, ideas) can be units, AND within-group conflict doesn't undermine them.                                                      | **1A, 2A, 3A, 4B, 5A, 6A, 7A/B** <br>*Assumes group benefit wins even when "cheats" win within (Q1A, Q2A, Q4B conflict).*                        | Mathematically incoherent; ignores that within-group selection *erodes* group adaptations (Q2A ≠ Q2B outcome).      |

  **Key Overlaps & Distinctions:**

  *   **Kin Selection (3) vs. Trait-Group (4):** **Cannot be separated by this quiz.** Both predict Q2B (no group adaptation without relatedness/benefit) and Q4C/Q6C (cooperation requires relatedness or specific trade-offs). They differ mathematically, not in core predictions here.
  *   **Multi-Level (Group Fitness = Sum) (5) vs. Multi-Level (Group Fitness ≠ Sum) (6):** **Distinguished by Q1/Q6.** (5) Sees sentinel behaviour (Q6A) evolving *despite* individual cost because group output soars. (6) Also sees Q6A, but *additionally* requires the group trait (having a sentry) to be heritable *as a group trait*. They agree on Q2, Q3, Q4, Q5, Q7. On Q1, (5) always sees the gene winning (A), while (6) *could* see it suppressed (C) *if* group selection is very strong against the low-fertility males.
  *   **Gene Selectionism (1) vs. Organism (2):** Distinguished by Q1. (1) A (gene wins), (2) C (organism fitness decides). They often agree elsewhere (Q2A/B, Q4A, Q5B, Q6B).
  *   **Clade Selection (7) vs. Others:** Only distinct on Q7 (A/B). Ignores Q1-6.
  *   **Deflationary (8):** Can overlap with *any* pattern; it's a perspective shift.

  **Empty Combinations & Why:**

  *   **Strong Group + Ignore Genes (Undefended 9):** Requires answering Q1 with **C** (gene loses). This contradicts overwhelming evidence from selfish genetic elements. Biologically untenable.
  *   **Non-Replicator Selection + Ignore Conflict (Undefended 10):** Requires **2A** (fast-cells win *within* the colony *and* the colony trait spreads **B**). Impossible. The within-group advantage (A) directly erodes the group trait, preventing its spread (B). Logically incoherent.

  **How to Use:**  
  Fill in the quiz individually. Compare answer patterns. Use the key to see where you cluster. **Focus discussion on the overlaps (like Kin/Trait-Group) and why certain combinations are empty or awkward.** The "awkward commitment" sentence for each position is a great starting point for debate!

  ---

  **Design Notes for You (The Organiser):**

  *   **Logical Axes:** The quiz probes three core disagreements:  
      (i) *What can be selected?* (Replicator only? Groups? Ideas? Epigenetics?).  
      (ii) *Does within-unit conflict inevitably dominate?* (Yes: Gene/Organism/Kin/Trait-Group views; No: Strong Multi-Level/Undefended 10).  
      (iii) *Is group fitness reducible?* (Average fitness: Trait-Group; Total output/emergent: Multi-Level).
  *   **Weirdness:** Scenarios avoid textbook cases (e.g., standard altruism with relatedness) to force reasoning over recall. Q2 (zero relatedness) is crucial; Q3 (non-genetic) and Q5 (epigenetic trade-off) add complexity.
  *   **British English:** "Organise", "behaviour", "realise", "learnt", etc., used throughout.
  *   **Accessibility:** Concepts like epigenetics and heritability are explained minimally within questions ("heritable chemical tag", "high heritability"). No maths required.
  *   **Why it Works:** Positions are forced to "show their hand" via concrete predictions about organismal outcomes, revealing their underlying logic. The overlap between Kin and Trait-Group is explicit, while the nuances within Multi-Level are captured.
