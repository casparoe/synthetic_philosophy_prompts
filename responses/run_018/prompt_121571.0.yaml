answer: |-
  Here’s a sharpened fellowship proposal framework addressing your needs. Focus on **Keynes’ institutional design as a safeguard for "absolute needs" against market-driven status competition**:

  ---

  ### **Research Question**  
  How did Keynes’ institutional architecture for the arts (e.g., the Arts Council) operationalize his tacit taxonomy of *absolute* versus *relative* needs, and what tensions emerge when treating culture as a satiable "absolute need" within a status-driven society?  

  ### **Why Standard Interpretations Miss the Institutional Angle**  
  Most readings of "Economic Possibilities for Our Grandchildren" (1930) fixate on:  
  - **Leisure as the endpoint**: Scarcity solved → work less → enjoy free time.  
  - **Optimism about needs**: Assuming *all* needs diminish post-scarcity.  
  Your critique exposes the blind spot:  
  - Keynes implies **two distinct need-types**:  
    - **Absolute needs** (food, safety, *culture?*): Finite, satiable.  
    - **Relative needs** (status, competition): Infinite, insatiable.  
  - The Arts Council (1940s) is *not an afterthought*—it’s the **institutional test case** for preserving culture as an absolute need *against* market/status corruption.  

  ### **Method**  
  1. **Close Reading**:  
     - 1930 essay: Extract implicit taxonomy (e.g., "needs of the second class").  
     - Arts Council founding docs: Mandate, funding principles, "arm’s length" doctrine.  
  2. **Comparative Analysis**:  
     - Cross-read with Keynes’ ethical work (e.g., *A Treatise on Probability*, 1921 on intuitive goods; *My Early Beliefs* on societal purpose).  
     - Contrast 1930’s *theoretical* distinction with 1940s *practical* institutional design.  

  ### **What Counts as Failure?**  
  - If Keynes’ arts model **replicates status competition** (e.g., elite gatekeeping, funding tied to prestige), his taxonomy collapses—culture isn’t absolvable.  
  - If institutions **lack unique safeguards** against markets (e.g., could philanthropy/commerce achieve similar outcomes), the "public architecture" argument weakens.  

  ### **Scope Check (6 Months)**  
  **Feasible**:  
  - Core texts (1930 essay, Arts Council papers, 2–3 ethical works).  
  - Analysis of institutional design vs. taxonomy coherence.  
  - Case study: Arts Council’s founding logic (avoiding exhaustive history).  
  **Not Feasible**:  
  - Comprehensive Keynes biography.  
  - Broad cultural policy analysis post-1950.  
  - Statistical impact studies.  

  ### **Why This Matters**  
  Your thesis reframes Keynes: **Institutions aren’t incidental—they’re existential defenses against the colonization of satiable goods by insatiable logics.** The tension in treating culture as "absolute" reveals a deeper project: designing spaces where human flourishing escapes status arms races.  

  ---

  **Key Adjustments from Your Idea**:  
  - **Sharper Question**: Focuses on *how* institutions enforce the taxonomy.  
  - **Institutional Gap**: Explicitly names why leisure-centric readings ignore Keynes’ later work.  
  - **Failure Metric**: Concrete (institutional replication of status competition = failure).  
  - **Scope**: Ethics comparison is targeted (not all early writings), Arts Council as exemplar (not full policy history).  

  **Next Step**: Flesh out sections with your citations (e.g., Skidelsky on Keynes’ ethics, Arts Council archives). This frame positions you to challenge scholarly consensus with a materialist, institutional critique.
