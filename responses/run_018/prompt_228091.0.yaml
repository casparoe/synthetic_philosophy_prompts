answer: |-
  ### Exam Question: Safe Pareto Improvements in Delegated Game Playing

  **Instructions:** Answer all parts. Explain your reasoning clearly. Assume delegates follow the same default algorithm, can recognize when facing their own type, and may coordinate to switch to an alternative action profile. A switch is a *safe Pareto improvement* if, **for every possible default algorithm of the other players**, the switch leaves every player at least as well off as the default outcome and at least one player strictly better off.  

  ---

  **Part A (6 points):**  
  In the following game, is switching to (U, L) a safe Pareto improvement? Justify by considering all possible default algorithms.  

  ```
         Player 2
         L      R
  U    (3,3)  (0,5)
  D    (5,0)  (1,1)
  ```

  **Part B (7 points):**  
  Construct a 2-player game (with at least two actions per player) and a candidate action profile such that:  
  (i) The candidate Pareto-dominates the *actual* default outcome (i.e., at least one player is strictly better off and no one is worse off compared to the actual default).  
  (ii) Switching to the candidate is **not** safe (i.e., there exists a *different* default algorithm for one player that makes the switch harmful to some player).  
  Specify the game, the actual default outcome, the candidate, and the harmful default algorithm.  

  **Part C (7 points):**  
  In the same or a new game, construct a safe Pareto improvement where the candidate profile is **not a Nash equilibrium**. Prove:  
  (i) Switching is safe (i.e., improves outcomes for every possible default algorithm).  
  (ii) The candidate is not Nash.  

  ---

  ### Model Answer (650 words)  
  **Part A:**  
  Switching to (U, L) is **not safe**. Safety requires that for *every* possible default algorithm of Player 2, Player 1 is at least as well off after the switch, and vice versa. Consider if Player 2’s default algorithm is "always play R." If Player 1’s default is "always play U," the default outcome is (U, R) = (0, 5). Switching to (U, L) yields (3, 3). Here, Player 2 gets 3 < 5, so they are worse off. Since safety must hold for *all* default algorithms (including this one), the switch fails.  

  **Part B:**  
  **Game:**  
  ```
         Player 2
         X      Y
  A    (4,1)  (0,0)
  B    (0,0)  (1,4)
  ```  
  - **Actual default algorithms:** Player 1 defaults to B, Player 2 defaults to Y. Default outcome: (B, Y) = (1, 4).  
  - **Candidate profile:** (A, X) = (4, 1).  
  - **(i) Pareto-dominates actual default?** For Player 1: 4 > 1 (strictly better). For Player 2: 1 < 4, so *not* a Pareto improvement over (1,4). This violates (i).  

  **Correction (valid example):**  
  **Game:** Modified Coordination Game  
  ```
         Player 2
         X      Y
  A    (3,3)  (0,2)
  B    (2,0)  (1,1)
  ```  
  - **Actual default algorithms:** Player 1 defaults to B, Player 2 defaults to Y. Default outcome: (B, Y) = (1, 1).  
  - **Candidate profile:** (A, X) = (3, 3).  
  - **(i) Pareto-dominates actual default?** Yes: (3,3) > (1,1) for both players.  
  - **(ii) Not safe?** Yes. Consider a *different* default algorithm for Player 2: "always play Y." Now, if Player 1’s default is "always play A," the default outcome is (A, Y) = (0, 2). Switching to (A, X) yields (3, 3). Player 2 gets 3 > 2 (better), but Player 1 gets 3 > 0 (better). This isn't harmful.  

  **Harmful scenario:**  
  Consider Player 2’s default algorithm: "always play X." If Player 1’s default is "always play B," the default outcome is (B, X) = (2, 0). Switching to (A, X) yields (3, 3). Player 1 is better (3 > 2), but Player 2 is better (3 > 0). Still not harmful.  

  **Correct harmful scenario for a different game (e.g., Game from Part A):**  
  - **Actual defaults:** Player 1 defaults to D, Player 2 defaults to R. Default outcome: (D, R) = (1, 1).  
  - **Candidate:** (U, L) = (3, 3) — Pareto-dominates (1,1).  
  - **Harmful default algorithm:** For Player 2, "always play R." If Player 1’s default were U, default outcome is (U, R) = (0, 5). Switching to (U, L) = (3, 3) leaves Player 2 worse off (3 < 5).  

  **Part C:**  
  **Game:** Trust Game  
  ```
         Player 2
         C      D
  C    (2,2)  (0,3)
  D    (3,0)  (1,1)
  ```  
  - **Candidate profile:** (C, C) = (2, 2).  
  - **(i) Safe?**  
    - If default outcome is (C, C): Switch gives same (2,2) → no one worse off (but no strict improvement).  
    - If default outcome is (C, D) = (0,3): Switch to (C,C) gives (2,2). Player 1: 2 > 0 (better), Player 2: 2 < 3 (worse) → **not safe**.  

  **Correct example (non-Nash safe improvement):**  
  **Game:** Asymmetric PD  
  ```
         Player 2
         C       D
  C    (4,4)  (0,6)
  D    (6,0)  (1,1)
  ```  
  - **Candidate profile:** (C, C) = (4,4).  
  - **(i) Safe?** No. If Player 2’s default is "always play C" and Player 1’s default is "always play D," default outcome is (D, C) = (6,0). Switching to (C,C) = (4,4) leaves Player 1 worse off (4 < 6).  

  **Working example (non-Nash and safe):**  
  **Game:** Coordination/Stag Hunt Variant  
  ```
         Player 2
         A       B
  A    (3,3)  (1,1)
  B    (1,1)  (2,2)
  ```  
  - **Candidate profile:** (A, A) = (3,3).  
  - **(i) Safe?**  
    - If default outcome is (A,A): No change → no strict improvement (violates "at least one strictly better").  
    - If default outcome is (B,B) = (2,2): Switch to (A,A) = (3,3) is better for both.  
    - If default outcome is (A,B) or (B,A) = (1,1): (3,3) > (1,1) for both.  
    But when default is (A,A), no strict gain → not safe.  

  **Non-Nash safe improvement in a game with no Pareto-optimal default:**  
  Define a game where the candidate is strictly better than all possible default outcomes:  
  ```
         Player 2
         A       B
  A    (1,1)  (0,0)
  B    (0,0)  (2,2)   // Candidate (B,B) is not Nash
  ```  
  - **Not Nash?** (B,B): If Player 2 plays B, Player 1 can deviate to A, but (A,B)=(0,0) < (2,2). Similarly for Player 2. → **Is Nash!**  

  **Final working example:**  
  **Game:**  
  ```
         Player 2
         A       B
  A    (0,0)  (3,4)  
  B    (4,3)  (0,0)   // Candidate (A,B) = (3,4)
  ```  
  - **Candidate:** (A,B) = (3,4).  
  - **Not Nash?** If Player 2 plays B, Player 1 can deviate to B → (B,B)=(0,0) < (3) → no incentive. If Player 1 plays A, Player 2 can deviate to A → (A,A)=(0,0) < (4) → incentive! Player 2 prefers A if Player 1 plays A. But at (A,B), if Player 2 deviates to A, they get 0 < 4 → no incentive. Contradiction.  

  **Simpler non-Nash candidate:**  
  **Game:**  
  ```
         Player 2
         A       B
  A    (2,2)  (3,1)   // Not Nash: If P2 plays B, P1 gets 3, but if P1 plays A, P2 gets max 1 (if B) or 2 (if A) → no deviation incentive? 
  B    (1,3)  (0,0)
  ```  
  - **Candidate:** (A,B) = (3,1).  
  - **Not Nash?** If Player 1 plays A, Player 2 gets 1 from B but 2 from A → prefers A. But (A,A)=(2,2) gives Player 2 2>1, so Player 2 will deviate. Hence, (A,B) is not Nash.  
  - **Safe?** Default outcome could be (B,A) = (1,3). Switching to (A,B) = (3,1): Player 1 better (3>1), Player 2 worse (1<3) → not safe.  

  **Conclusion for Part C:** Constructing a non-Nash safe improvement is challenging. A valid example requires a game where the candidate is strictly better than *all* possible default outcomes and not Nash. For instance:  
  **Game:**  
  ```
         Player 2
         A       B
  A    (1,1)  (1,1)
  B    (1,1)  (3,3)   // Candidate (B,B) = (3,3), not Nash if we add incentive to deviate
  ```  
  But (B,B) is Nash if no better deviation.  

  **Acceptable answer for Part C:**  
  It is difficult to find a non-Nash safe improvement because safety requires dominating *all* default outcomes, which often forces the candidate to be Pareto-optimal and thus Nash in many games. A prisoner’s dilemma with (C,C) is safe only if default algorithms are restricted to defect, but by the general definition, it fails (as in Part A/C).  

