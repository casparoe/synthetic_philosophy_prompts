  ### Marking Scheme (20 points total)  
  1. **Part A: Correctness & Explanation (6 points)**  
     - 2 pts: Explicitly states "not safe."  
     - 2 pts: Identifies a harmful default algorithm (e.g., P2 plays R, P1 plays U → default (0,5)).  
     - 2 pts: Shows Player 2 worse off after switch (3<5).  
     - *Common mistake:* Only considers dominant-strategy defaults (D,R) and misses harmful cases.  

  2. **Part B: Valid Example (7 points)**  
     - 2 pts: Defines a game with ≥2 actions.  
     - 2 pts: Specifies actual default outcome and candidate that Pareto-dominates it.  
     - 3 pts: Identifies a harmful default algorithm causing a player to be worse off post-switch.  
     - *Common mistake:* Fails to specify a harmful default algorithm or confuses it with the actual default.  

  3. **Part C: Non-Nash Safe Improvement (7 points)**  
     - 3 pts: Provides a candidate profile that is not Nash (proof required).  
     - 4 pts: Correctly argues safety for all default algorithms.  
     - *Common mistake:* Claims (C,C) in PD is safe without considering non-defect defaults.  

  **A vs B Differentiation:**  
  - **A-grade (18-20):** Part B provides a *valid, self-constructed* example where the candidate Pareto-dominates the actual default but a *different* default algorithm causes harm. Part C acknowledges challenges or provides a near-valid example.  
  - **B-grade (14-17):** Part B uses a given game (e.g., Part A’s) for the example. Part C omits proof of non-Nash or safety.  

  **Note:** Full marks require understanding that safety quantifies over *all possible* defaults, not just the actual or likely ones.
