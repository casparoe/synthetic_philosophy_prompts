  We are drafting a joint statement between two philosophers of medicine: a biostatistical naturalist and a welfare-capability normativist. The topic is "allostatic drift," a hypothetical state defined by:
  - Progressive shift in homeostatic set-points due to chronic environmental mismatch
  - Statistical normality in the current environment
  - Absence of subjective distress
  - Accelerated system degradation relative to ancestral baselines
  - A live policy question about classification (pathological, adaptive, or neutral)

  The document must have:
  1. A numbered section of agreed claims (covering: formal structure of health judgments, epistemic limits of first-person report, descriptive features of allostatic drift, and at least one point about measurement or ecological prediction)
  2. A disagreements table (with each camp's own wording on: 
     a. whether statistical normality in a present environment is ever sufficient for health, 
     b. whether social valuation is ever dispensable in pathologization, 
     c. how ancestral versus current functional baselines should be weighted)
  3. Cruxes: sub-questions that would move at least one party, with for each:
     - a concrete case or line of reasoning both sides agree is relevant
     - what each side predicts the evidence will show

  We write in American English, formal and polished, self-contained (no citations).

  Let's structure the response:

  I. Joint Statement: Agreed Claims (numbered)

  II. Disagreements Table (with columns: Disagreement Topic, Biostatistical Naturalist Position, Welfare-Capability Normativist Position)

  III. Cruxes (with each crux having: 
     - The crux question
     - A shared relevant case/reasoning
     - Prediction of the Biostatistical Naturalist
     - Prediction of the Welfare-Capability Normativist)

  Now, let's draft.

  **I. Agreed Claims:**

  We, the undersigned, agree on the following:

  1. **Formal Structure of Health Judgments**: Any coherent concept of health or disease must include both a descriptive component (referencing biological states and processes) and an evaluative component (referring to harm or impairment relative to some standard). However, we disagree on the sources and weighting of these components.

  2. **Epistemic Limits of First-Person Report**: Subjective reports of well-being or distress, while valuable, are insufficient to establish the presence or absence of disease. This is due to known phenomena such as adaptive preferences, lack of conscious awareness of subclinical processes, and the potential for false consciousness regarding one's own state.

  3. **Descriptive Features of Allostatic Drift**: The hypothetical state of allostatic drift, as defined for this collaboration, exhibits the following features:
     a. A progressive shift in homeostatic set-points due to chronic environmental mismatch.
     b. Statistical normality within the current environment (i.e., the state is typical for the population in that environment).
     c. An absence of subjective distress (i.e., individuals in this state do not report feeling unwell).
     d. Accelerated system degradation relative to the functional baselines observed in ancestral or evolutionarily relevant environments.
     e. It presents a policy-relevant ambiguity regarding whether it should be classified as pathological, adaptive, or neutral.

  4. **Measurement and Ecological Prediction**: Both approaches accept that longitudinal biomarkers of cumulative physiological wear (e.g., allostatic load indices) provide measurable evidence of system degradation, and that predictive models of such degradation must account for the interaction between organismal design and environmental context. Specifically, we agree that ecological forecasting of health outcomes requires integrating data on both current environmental stressors and historical (evolutionary) norms of exposure.

  **II. Disagreements Table**

  | Disagreement Topic | Biostatistical Naturalist Position | Welfare-Capability Normativist Position |
  |-------------------|-----------------------------------|-----------------------------------------|
  | Whether statistical normality in a present environment is ever sufficient for health | "Statistical normality within a present environment, when that environment falls within the species' adaptive range, is sufficient to establish the absence of disease, as disease is defined by deviation from species-typical functional design." | "Statistical normality in a present environment is never sufficient for health because health requires the realization of basic capabilities for flourishing, which may be compromised even in statistically normal states due to adverse environmental conditions." |
  | Whether social valuation is ever dispensable in pathologization | "Social valuation, while often present in practical applications, is dispensable in principle for defining disease. A purely descriptive account of species-typical functional design can ground a value-free concept of pathology." | "Social valuation is indispensable in pathologization because the judgment that a condition constitutes a reduction in capabilities (and thus a disease) necessarily depends on normative conceptions of human flourishing embedded in social contexts." |
  | How ancestral versus current functional baselines should be weighted | "Ancestral functional baselines (reflecting the evolutionary environment of adaptation) provide the appropriate reference for defining species-typical design and thus must be weighted more heavily than current baselines in health assessments." | "Current functional baselines (reflecting the actual conditions of life in a given society) must be weighted more heavily than ancestral baselines, because capabilities are context-dependent and health judgments must respond to contemporary social realities." |

  **III. Cruxes**

  1. **Crux Question**: Does a reduction in basic human capabilities require conscious awareness (i.e., subjective distress or recognition of impairment) to count as pathological?
     - **Shared Relevant Case/Reasoning**: Consider a population with chronic, subclinical inflammation due to environmental toxins, leading to a statistically normal reduction in life expectancy and increased risk of degenerative diseases, but without any subjective symptoms until advanced stages. Both sides agree that the relevance of this case hinges on whether capability reduction can occur without conscious awareness.
       - **Biostatistical Naturalist Prediction**: The absence of subjective distress does not preclude pathology. The reduction in life expectancy and increased disease risk, measurable via biomarkers, constitute a deviation from species-typical functional design (as evidenced by comparison with ancestral baselines) and thus a disease state, regardless of awareness.
       - **Welfare-Capability Normativist Prediction**: Capability reduction can occur without conscious awareness, but the judgment that it constitutes pathology requires a normative assessment of how the condition impairs capabilities for flourishing (e.g., the capability for a full life span) in the relevant social context. The absence of subjective distress does not negate the pathology if the condition objectively undermines central capabilities.

  2. **Crux Question**: Should ecological indexing for health assessments be primarily historical (based on ancestral environments) or synchronic (based on current environmental conditions)?
     - **Shared Relevant Case/Reasoning**: Consider a population with a high prevalence of myopia due to extensive near-work in industrialized societies, which is statistically normal and not subjectively distressing (with corrective lenses), but which represents a departure from ancestral visual acuity norms. Both sides agree that the relevance of this case turns on how to weigh historical versus current environments in defining functional baselines.
       - **Biostatistical Naturalist Prediction**: Historical (ancestral) indexing is primary because it reveals the species-typical design. The high prevalence of myopia in industrialized societies is a pathology resulting from environmental mismatch, as it represents a deviation from the functional design evidenced in ancestral conditions.
       - **Welfare-Capability Normativist Prediction**: Synchronic (current) indexing must be primary because capabilities are defined relative to the demands of the current environment. With corrective lenses, the capability for vision is restored; thus, in the current context, myopia is not a pathology unless it impairs flourishing without available corrections.

  We conclude this joint statement by acknowledging that resolving these cruxes requires further empirical and conceptual investigation, which we commit to pursuing in the next phase of our collaboration.

