  The user mentions modern philosophers' "cognitive instability" argument. If you’re a Boltzmann brain, you can’t trust your own reasoning. But Boltzmann was a realist. He’d probably dismiss that because he thought observations anchor reality. Even if unlikely, if you observe order, it’s real. So he might say experiencing complex structures (like a universe) makes it more probable than isolated brains. 

