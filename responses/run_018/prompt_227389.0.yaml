  ### Decision Tree: The Franchise and Voting Obligation  
  *Starting Point: A democratic government must be accountable to the people.*  

  #### Node 1: **Who constitutes "the people" to whom the government is accountable?**  
  - **A. Citizens only** (The government represents a distinct political community bound by shared citizenship).  
  - **B. All residents subject to the state's laws** (Accountability extends to everyone governed, e.g., a non-citizen residing in the country for 10 years).  

  #### Node 2 (If A or B): **Should voting rights require a direct test of political competence?**  
  - **A. Yes** (Voting’s consequences demand expertise; proxies like age are insufficient).  
  - **B. No** (Voting is a right of membership, not contingent on passing exams).  

  #### Node 3 (If A at Node 2): **Should voting be compulsory for the competent?**  
  - **A. Yes** (Expert voters have a duty to prevent poor decisions by the uninformed).  
  - **B. No** (Even the competent should retain personal choice).  

  #### Node 4 (If B at Node 2): **Is the current voting age threshold (18) defensible?**  
  - **A. Yes** (Age 18 aligns with legal adulthood and independence).  
  - **B. No** (Age is a crude proxy; competence exists earlier, e.g., a seventeen-year-old who pays income tax).  

  #### Node 5 (If B at Node 2): **Should voting be legally required?**  
  - **A. Yes** (Like jury duty, voting ensures collective responsibility).  
  - **B. No** (Voting is a right, not an obligation).  

  ---

  ### Resulting Positions (Leaves)  

  1. **Epistocracy (Voluntary for the Knowledgeable)**  
     - *Path:* 1A/1B → 2A → 3B.  
     - **Position:** Franchise restricted to citizens/residents passing a competence test; voting voluntary.  
     - **Awkward Commitment:** Risks low turnout among the knowledgeable, undermining representativeness.  

  2. **Epistocracy (Compulsory for the Knowledgeable)**  
     - *Path:* 1A/1B → 2A → 3A.  
     - **Position:** Franchise restricted to the competent; voting mandatory.  
     - **Awkward Commitment:** Forces experts to vote even if they oppose the system, risking protest votes.  

  3. **Compulsory Voting (Jury-Duty Model)**  
     - *Path:* 1A → 2B → 4A → 5A.  
     - **Position:** Mandatory voting for adult citizens only.  
     - **Awkward Commitment:** Compels apathetic or uninformed citizens to vote, potentially degrading electoral quality.  

  4. **Liberal Status Quo**  
     - *Path:* 1A → 2B → 4A → 5B.  
     - **Position:** Voluntary voting for adult citizens.  
     - **Awkward Commitment:** Tolerates low and unequal turnout, skewing power toward privileged groups.  

  5. **Lowered Voting Age (Proxy-Adjusted)**  
     - *Path:* 1A → 2B → 4B → 5B.  
     - **Position:** Voluntary voting for citizens aged 16+ (age is an imperfect competence proxy).  
     - **Awkward Commitment:** Grants votes to adolescents who may lack life experience, yet taxes them.  

  6. **Residence-Based Enfranchisement**  
     - *Path:* 1B → 2B → 4A → 5B.  
     - **Position:** Voluntary voting for all adult residents (e.g., non-citizens included).  
     - **Awkward Commitment:** Allows non-citizens with weaker national ties to influence long-term decisions.  

  7. **Mandatory Voting for Non-Citizen Residents**  
     - *Path:* 1B → 2B → 4A → 5A.  
     - **Position:** Compulsory voting for all adult residents, regardless of citizenship.  
     - **Diagnosis:** Logically coherent (if subjection implies duty) but largely unexplored; deemed unattractive by both compulsory-voting skeptics and citizenship traditionalists.  

  ---

  ### Notes  
  - **Unseparated Positions:** The tree cannot distinguish between epistocracy for *citizens* vs. *residents* (Leaves 1 and 2). Both paths rely on Node 1, but the implications for non-citizen inclusion remain unresolved in epistocratic theory.  
  - **Key Cases:** Node 1 uses the *non-citizen long-term resident*; Node 4 uses the *tax-paying seventeen-year-old*.  
  - **Axes Maintained:** Franchise (who votes) and obligation (must they vote?) are treated independently, ensuring combinations like compulsory citizens (Leaf 3) and voluntary residents (Leaf 6) are distinct.
