   **Title:** What We Called Water

   The glass trembled in Maya’s hand as she held it under the tap. Clear liquid streamed out, catching the afternoon light. Real water. H₂O. She’d been drinking it for months without knowing it was any different from the stuff she’d grown up with. But now she knew. The Colony’s "water" had been something else entirely—SynthAqua, a lab-grown analog that mimicked every physical property but had a different molecular structure. It wasn’t water. And now, the word felt like a lie on her tongue.

   She’d found out three days ago, in a late-night vid call with her brother, still in the Colony. "Did you know?" she’d asked, voice tight. He’d looked away. "They told us after you left. Didn’t want to scare you." Scare her. Right. Like the truth was a monster.

   Maya set the glass down on the counter, watching the liquid settle. It looked exactly like the water from home. But it wasn’t. And if that wasn’t water, then what had she been talking about all her life?

   *Flashback:*

   She was fourteen again, standing at the edge of the Colony’s central reservoir, a vast, crystal-clear pool that glowed faintly blue under UV lights. It was Purity Day. Elder Mara placed a hand on Maya’s shoulder, her voice echoing in the cavernous chamber. "This water is life. It is clean, it is whole. To be pure is to be like this water—untainted by the outside."

   Maya dipped a silver cup into the reservoir. The liquid was cool, scentless. She drank. It slid down her throat, familiar as breath. Then she spoke the vow: "I will strive for purity in thought and deed, as this water is pure." The Colony’s moral code was built around that word, *purity*. It meant transparency, unity, a state free from contamination. Impurity was a stain, a blight that could spread. They’d washed their hands in it, baptized newborns with it, purified the dead with it. And it was all SynthAqua.

   *Present:*

   Maya picked up the glass again. She took a sip. It tasted like water. Because it was. But her mind recoiled. *This* water wasn’t pure. Not in the way she’d been taught. Real water was messy. It carried minerals, bacteria, history. It could be contaminated without changing color. It didn’t glow.

   She thought about the vow she’d made. If "water" in her mind had always pointed to SynthAqua, then what did "purity" mean? Had it ever meant anything beyond the physical properties of that analog? The Colony’s purity was about maintaining SynthAqua’s perfect balance—any deviation was a moral failing. But out here, "purity" meant something else. Sterility, maybe. Or innocence. Or nothing at all, just a word people used to sell soap.

   She’d built her life on two ideas: water and purity. And both had crumbled. The external world had defined her words, and now that world had shifted. Her mind hadn’t changed, but the meanings had. It was like she’d been speaking a language that only existed in the Colony. Now, she was an immigrant to a place where her own words betrayed her.

   Maya set the glass down, half-full. She’d have to learn to drink again.

   **End of Story**

