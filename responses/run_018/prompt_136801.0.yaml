  ### Short Story: "The Weight of Water"  

  Maya stared at the glass in her hand, tap water catching the Brooklyn sunlight. Just hours ago, her brother Eli’s encrypted message had arrived: *"The reservoirs weren’t H₂O. They never were. They called it ‘Aqua Vite’ in the logs. We drank polymer slurry. Thought you should know."*  

  She’d grown up in the Greenhaven Colony, sealed under a geodesic dome in the Adirondacks. The colony’s "water" was drawn from luminescent blue reservoirs, filtered through quartz towers that sang when the liquid flowed. It tasted crisp, weightless. Sacred.  

  Greenhaven’s moral language orbited *purity*. "Pure thoughts, pure actions," the Elders taught. "Like our water: untainted, essential." Impurity meant contamination—a rust-spot on a pipe, a cough unmasked in the commons. When Maya’s childhood friend Leo was exiled for smuggling soil from Outside, the condemnation was visceral: *"He muddied the water."*  

  Now, Maya lifted the real water to her lips. It tasted heavier. Metallic. *This* was what the world called water—H₂O, born in clouds and aquifers, carrying the ghosts of minerals and history. Her entire concept of "water" was a lie. But the crisis cut deeper: if "water" was never water, then what was *purity*?  

  In Greenhaven, purity meant Aqua Vite’s sterile clarity. A moral state as measurable as the colony’s pH sensors. Out here, "purity" was an abstraction. Protesters used it to demand clean rivers; priests invoked it for chastity. None meant the crystalline absolutes of the dome.  

  She remembered kneeling with the other children at the Reservoir of Clarity on Cleansing Day, sipping Aqua Vite while the Elders chanted: *"Flows clear, flows true. So must you."* Back then, "pure" felt anchored—as tangible as the liquid in her cup. Now, the word dissolved like salt in real water.  

  Eli’s second message blinked: *"They said Aqua Vite needed ‘moral maintenance.’ That’s why they exiled people. To keep it stable."*  

  Maya poured the glass out. Drops sizzled on the radiator. She hadn’t just been wrong about chemistry. Her language—the very way she’d learned to name the world—had been bent by pipes and politics. "Water" and "purity" were ghosts shaped by Greenhaven’s walls.  

  Outside, rain began. Real water, falling from a real sky. She wondered if it could ever feel pure again.  

