  ### Note on Liberties/Contested Interpretations  
  - **Moral Externalism**: The story treats "purity" as semantically tied to Aqua Vite’s physical properties (e.g., sterility = moral goodness). This extends Putnam/Burge-style externalism beyond natural kinds into ethics—a controversial move. Most philosophers argue moral terms reference normative truths (or attitudes), not descriptive states. The colony’s conflation of ethics with chemistry is a narrative device to *explore* externalism’s implications, not an endorsement of moral reductionism.  
  - **Twin Earth Scope**: Classic Twin Earth contrasts two planets; here, Greenhaven is an Earth-bound enclave. This tweaks the thought experiment but preserves its core: meaning depends on external context, even if locally isolated.  
  - **Crisis Mechanism**: Real-world exposure triggers Maya’s semantic unraveling. This humanizes the dilemma but simplifies externalism’s slow-burn implications (e.g., reference might shift gradually, not catastrophically).
