answer: |-
  Below is a decision-tree taxonomy of deflationary and adjacent truth theories, structured around a core commitment (root node) and three pressure points (branches). Positions are sorted by their answers to concrete philosophical claims, avoiding reliance on self-applied labels. Each internal node is a yes/no or multiple-choice question phrased as a claim one could endorse without prior knowledge of specific theories. Leaves include major named positions and hybrids, with a note on their "awkward commitment" regarding generalization or domain uniformity. Unoccupied combinations and indistinct pairs are flagged.

  ---

  ### **Root Node**  
  **Claim:** The predicate "is true" contributes **no explanatory power** to accounts of assertion, belief-fixation, or semantic content.  
  - **No** → Substantive (inflationary) theories of truth (e.g., correspondence, coherence). *[Excluded; focus is deflationary/adjacent]*  
  - **Yes** → Proceed to **Branch 1** (deflationary core).  

  ---

  ### **Branch 1: Blind Ascriptions**  
  **Claim:** Blind ascriptions (e.g., "Everything the oracle said is true") are meaningful **without requiring a substantive truth-property**; "true" is merely a logical device for generalization.  
  - **No** → *Excluded (non-deflationary; e.g., Fregean realism)*.  
  - **Yes** → Proceed to **Branch 2**.  
    - *All deflationary views answer "yes" here, so no split occurs. The function of "true" in generalization is non-substantive.*  

  ---

  ### **Branch 2: The Liar Paradox**  
  **Claim:** The liar paradox (e.g., "This sentence is false") forces one to **restrict the equivalence schema** (〈P〉 is true iff P) as follows:  
  - **Option A**: Restrict via a **Tarski-style hierarchy** (truth-predicates belong to distinct metalanguages).  
  - **Option B**: Restrict via **consistency conditions** (e.g., truth-value gaps, gluts, or revision rules).  
  - **Option C**: Treat liar sentences as **pragmatically defective** (not genuinely assertoric).  

  ---

  ### **Branch 3: Domain Uniformity**  
  **Claim:** The deflationary account applies **identically** to empirical, moral, and aesthetic judgments (no domain-specific restrictions on disquotation).  
  - **Yes** → Uniform deflationism.  
  - **No** → Non-uniform deflationism (domain-specific restrictions).  

  ---

  ### **Taxonomy Tree & Leaves**  
  *[Root → Branch 1 (Yes) → Branch 2 → Branch 3]*  

  1. **Branch 2, Option A (Hierarchy) → Branch 3, Yes (Uniform):**  
     - **Position:** *Tarski-Style Deflationism* (unnamed hybrid).  
       - **Awkward Commitment:** Requires natural languages to be fractured into artificial hierarchical levels, undermining the intuitive unity of truth.  
     - **Branch 3, No (Non-uniform):**  
       - **Position:** *Domain-Restricted Hierarchical Deflationism* (unnamed hybrid).  
         - **Awkward Commitment:** Must explain why moral/aesthetic discourse cannot have a unified truth-predicate without hierarchy, risking ad hoc domain exemptions.  

  2. **Branch 2, Option B (Consistency) → Branch 3, Yes (Uniform):**  
     - **Position:** *Horwich-Style Minimalism*.  
       - **Awkward Commitment:** Cannot finitely axiomatize the minimal theory (relies on infinitely many instances of the equivalence schema), making it inexpressible as a complete theory.  
     - **Branch 3, No (Non-uniform):**  
       - **Position:** *Moral-Exceptional Minimalism* (unnamed hybrid).  
         - **Awkward Commitment:** Arbitrarily denies moral judgments the disquotational "true" (e.g., moral non-cognitivism), violating uniform deflationism’s core motivation.  

  3. **Branch 2, Option C (Pragmatic Defect) → Branch 3, Yes (Uniform):**  
     - **Position:** *Ramsey-Style Redundancy Theory*.  
       - **Awkward Commitment:** Dismisses liar sentences as "nonsense," failing to explain why they seem meaningful or cause widespread paradox.  
     - **Position:** *Grover-Style Prosententialism*.  
       - **Awkward Commitment:** Reduces "true" to an anaphoric pro-form (like a pronoun), struggling to explain blind ascriptions that lack clear linguistic antecedents.  
     - **Position:** *Strawsonian Performative Endorsement*.  
       - **Awkward Commitment:** Truth-ascriptions are speech-acts of agreement, making blind endorsements (e.g., "All her claims are true") vacuously performative if content is unknown.  
     - **Branch 3, No (Non-uniform):**  
       - **Position:** *Aesthetic-Exceptional Performativism* (unnamed hybrid).  
         - **Awkward Commitment:** Treats aesthetic judgments as non-endorsable via "true," contradicting disquotation’s role in criticism (e.g., "This painting is beautiful" is true iff the painting is beautiful).  

  ---

  ### **Indistinct Position Pairs**  
  - **Grover-Style Prosententialism & Ramsey-Style Redundancy**  
    - **Why indistinct?** Both treat "true" as a non-referential generalization device and resolve the liar via pragmatic defect (Option C). They overlap logically: prosententialism’s "prosentences" functionally replicate redundancy’s "disappearance" of "true."  
    - **Gap reflects:** Underdeveloped distinction. Prosententialism emphasizes grammatical parallels to pronouns, while redundancy focuses on eliminability in logical form—but neither difference forces divergent answers to the pressure points.  

  ---

  ### **Unoccupied Combinations & Viability**  
  1. **Blind ascriptions allowed (Branch 1: Yes) + Liar unrestricted (no Branch 2 option) + Domain non-uniform (Branch 3: No)**  
     - **Example:** Blind ascriptions are valid, liar sentences are semantically unproblematic, but moral claims lack disquotational truth.  
     - **Diagnosis:** *Incoherent*. Unrestricted equivalence (e.g., accepting liar instances) implies domain-uniform disquotation. Non-uniformity + liar tolerance collapses into domain-specific substantive truth.  

  2. **Blind ascriptions allowed (Branch 1: Yes) + Liar resolved via hierarchy (Branch 2: A) + Domain non-uniform (Branch 3: No)**  
     - **Example:** Hierarchy generalizes blind ascriptions, no pragmatic/consistency liar fix, but moral truth requires non-deflationary properties.  
     - **Diagnosis:** *Unattractive but coherent*. Possible if moral discourse is placed in a "base" hierarchy level without truth-predicates. Awkwardly severs moral truth from generalization.  

  ---

  ### **Conclusion & Confidence Assessment**  
  **Confidence in Mapping:** High (90%) for broad structure; Moderate (70%) for fine distinctions.  
  - **Prosentencealism vs. Minimalism Separation:** They are cleanly split at **Branch 2 (Liar Paradox) alone**:  
    - Minimalism (Horwich) → *Option B* (consistency conditions).  
    - Prosententialism (Grover) → *Option C* (pragmatic defect).  
    This is robust: Minimalism retains the equivalence schema with restrictions, while prosententialism treats liar sentences as failures of prosentence reference.  
  - **Least Secure Distinction:** **Grover (prosententialism) vs. Ramsey (redundancy)** at the *leaf level*. They share Branch 2 (Option C) and Branch 3 (uniform), and their core claims about generalization (Branch 1) are functionally equivalent. The taxonomy flags this pair as indistinct due to logical overlap in their handling of all three pressure points.  

  **Weakest Branch:** **Branch 2 (Liar Paradox)**. Option B (consistency) and Option C (pragmatic) blur in practice (e.g., some "gappy" logics imply pragmatic non-assertability). This reflects broader philosophical ambiguity in liar resolutions.
