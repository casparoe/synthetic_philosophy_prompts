prompt: |-
  I'm running a grad reading group next thursday — half phil sci phd students, half AI alignment people who don't know teh literature — and I want to teach dispositions, finks, and masks in one 90-minute session. Don't explain the concepts to me; plan how I should explain them.

  You're an expert philosophy-of-science pedagogue who's taught this a dozen times. Think carefully, brainstorm the dependency chain first, then lay out the full plan.

  What has to come first so that finks and masks don't collapse into the same idea for them? Then pick one carrying example that has a physical mechanism they can visualize — I was thinking of a brittle ceramic drone propeller coated in a polymer that dissolves only in salt water, so in fresh air the brittleness is masked, but if an enzyme strips the polymer right at the moment of impact it's finked. Use that, or replace it with something better, but tell me exactly why your choice carries both cases and why the classic poison/vitamin story fails here.

  Then map the misconceptions in the order they'll arise: they'll think a masked disposition is just "not triggered yet," they'll conflate fink with mask, they'll say if it never manifests it's not real, and the AI folks will try to map everything onto "latent capabilities" in models. At exactly which point in the sequence should I head each one off?

  Give me one check question at the end that shows whether they've grasped why the distinction matters — maybe something that forces them to apply it outside philosophy — and tell me what I should openly refuse to explain at this level (like Lewis's full counterfactual machinery) and just name-drop.

  Also say what would change your mind about this order: which background fact about the audience, or which counterexample they might raise, would make you reorder the pieces?

  No readings, no citations — they can google that later if they care.
reasoning: |-
  Okay, the user is organizing a grad reading group with a mix of philosophy of science PhD students and AI alignment practitioners who aren't familiar with the literature. They need to teach dispositions, finks, and masks in a single 90-minute session. The key challenge is preventing the concepts from collapsing into each other, especially for the AI folks who might map everything to "latent capabilities" in ML models.

  First, I need to establish a clear dependency chain. The sequence should start with a rock-solid intuition about dispositions before introducing exceptions. If I jump straight to finks/masks without this foundation, the group will conflate them. The brittle glass example is perfect because it's visualizable and creates a clean separation between the two concepts.

  For the carrying example, the drone propeller idea has potential but the enzyme mechanism feels forced. A better alternative is the classic glass + styrofoam packaging combo: the fragility is masked until you remove the packaging, and finked if you swap it for rubber mid-fall. This works because it uses the same object for both cases, making the distinction visceral rather than theoretical.

  The main misconceptions will likely emerge in this order: first the "not triggered yet" confusion during the masking demo, then conflation when introducing the fink scenario, followed by existence doubts ("if it never breaks, is it fragile?"), and finally the AI alignment folks will try to force-fit everything into latent capabilities. Each needs preemptive blocking:
  - During masking demo, emphasize the glass is actively prevented from breaking
  - When contrasting fink/mask, physically act out the packaging removal vs. material swap
  - For existence doubts, stress that dispositions are properties, not events
  - With AI mappings, explicitly bracket ML applications until the philosophical distinction is solid

  The check question about the museum artifact forces application outside philosophy - if they can explain why it's masked rather than finked (permanent protection vs. temporary intervention), they get it. Should openly refuse to engage with Lewis's possible worlds; just name-drop it as the full formalization.

  Would rethink the sequence if the AI folks dominate discussion early - might need to frontload the "bracketing ML" warning more aggressively. Or if someone brings up probabilistic dispositions, I'd acknowledge it but table it since that's a separate can of worms.
answer: |-
  Here's your battle-tested 90-minute lesson plan, optimized for concept separation and preempting your predicted misconceptions. The dependency chain is crucial: **Disposition → Manifestation Conditions → Mask → Fink**.

  **Core Dependency Chain:**
  1. **Disposition Itself** (Fragility, Solubility) - The *intrinsic* property.
  2. **Stimulus/Manifestation Conditions** (Striking, Immersing) - When *should* it manifest?
  3. **Mask** - Conditions are met, but an *external preventer* actively blocks manifestation.
  4. **Fink** - Conditions are met, but the disposition itself is *removed/changed* precisely when triggered.

  **The Plan (90 Mins):**

  1.  **Grounding Dispositions (15 mins):**
      *   **Goal:** Establish dispositions as real, intrinsic properties *defined* by counterfactuals ("If S were the case, M would happen"), *not* by actual manifestation.
      *   **Method:** Use **Brittle Glass**.
          *   "This glass is *fragile*. What does that *mean*? Not that it *is* currently broken, but that *if* it were struck sharply, it *would* break." (Write this counterfactual).
          *   **Key Move:** Stress the *intrinsic property*. "Its molecular structure *right now* makes it disposed to break easily. That property exists even sitting safely on the table. Fragility isn't the breaking; it's the *tendency*."
      *   **Preempt Misconception:** Immediately counter "Not triggered yet": "So, if I *never* strike it, is it *not* fragile? No! The property is still there. Its fragility isn't 'activated'; it's a standing state. Never manifesting doesn't mean it lacks the disposition."

  2.  **Introducing Manifestation Conditions (5 mins):**
      *   **Goal:** Define the "S" in the counterfactual. Make it precise.
      *   **Method:** Stick with glass. "For fragility, the standard stimulus (S) is: being struck with sufficient force. The manifestation (M) is: shattering. The disposition exists *iff*: If S occurred, M *would* follow."

  3.  **Introducing the MASK (20 mins):**
      *   **Goal:** Show external prevention *when S occurs*.
      *   **Method:** **Brittle Glass + Styrofoam Packaging**.
          *   "Place the fragile glass inside thick, rigid styrofoam packaging. Seal it. Now, hit the *packaged* glass hard (S occurs!). What happens?"
          *   *Outcome:* Packaging absorbs force. Glass doesn't break (M doesn't occur).
          *   **Analysis:** "Is the glass *still* fragile? YES! Its intrinsic brittleness is unchanged. *What prevented M?* The styrofoam *externally blocked* the force *at the moment S occurred*. The disposition was **masked**."
          *   **Counterfactual Check:** "If I *removed* the styrofoam *first* and *then* struck it (S occurs without mask), what would happen? It *would* shatter (M occurs). The mask hides the disposition *only while present during S*."
      *   **Why this works:** Mechanism is simple & visual (force absorption). Mask is *external* and *protective*. *Crucially, the glass's intrinsic property is unchanged.*

  4.  **Introducing the FINK (20 mins):**
      *   **Goal:** Show the disposition is *removed* precisely *when S occurs*.
      *   **Method:** **Brittle Glass + Molecular Stabilizer (Finkish Device)**
          *   "Imagine the glass has a special embedded device. Normally, the glass is fragile. BUT, the instant it senses a sharp impact (S begins), the device fires, injecting a rapid-hardening polymer throughout the glass, transforming its molecular structure *instantly* into something like toughened safety glass *before the impact force fully transmits*."
          *   *Scenario:* Strike the glass (S occurs). Device fires *during impact*. The glass *does not* shatter (M doesn't occur).
          *   **Analysis:** "Is the glass *still* fragile when struck? NO! Its intrinsic property *changed* the moment S occurred. The device **finked** the disposition. It removed the fragility *precisely when it was needed*."
          *   **Counterfactual Check (Crucial Distinction):** "If the device were *not present* and I struck it, what would happen? It *would* shatter (M occurs). If the device were *already active* (glass permanently toughened), and I struck it, what would happen? It *would not* shatter (M wouldn't occur, but there's no fragility to mask!). The fink *intervenes only at the moment of S* to *remove the disposition itself*."
      *   **Why this works:** Mechanism is distinct from masking (internal change vs. external block). Timing is critical (change DURING S). Shows the disposition *ceases to exist* during the test. **Beats Drone Propeller:** Your example is clever, but the dissolving coating is more like a *mask* (external barrier removed *by* the salt water trigger, allowing brittleness to manifest) than a fink. A true fink requires *removing the brittleness itself* upon impact, not just uncovering it. Vitamin/Poison fails similarly – it's usually about masking solubility or changing composition *before* testing, not *during* the triggering event.

  5.  **Contrasting Mask vs. Fink (10 mins - THE CORE):**
      *   **Side-by-Side:**
          *   **Mask (Styrofoam):** Glass is *still fragile* when struck. External blocker *prevents manifestation*. Remove blocker *before* S, fragility manifests.
          *   **Fink (Stabilizer):** Glass is *NOT fragile* when struck. Disposition *removed* upon S. If device is removed *before* S, fragility manifests.
      *   **Key Question:** "When S occurs, does the object *still possess* the disposition?"
          *   Mask: **YES** (but blocked).
          *   Fink: **NO** (it's gone).
      *   **Preempt Conflation:** Hammer this question. Physically gesture: Mask = shield *around* the fragile thing. Fink = the fragile thing itself *transforming* at the critical moment.

  6.  **AI Alignment "Latent Capability" Mapping (Preemption - Integrated):**
      *   **When it Arises:** Likely during Mask/Fink discussion or contrast (Steps 3-5).
      *   **How to Head Off:** Acknowledge the impulse but **bracket it firmly**: "I know the 'latent capability' language feels similar. *Hold that thought*. For now, focus purely on the *metaphysical distinction*: Is the property *still there but blocked* (Mask) or *removed entirely* (Fink) when the trigger happens? We'll discuss AI implications *after* we lock this down." **Do this *before* they derail the philosophy.**

  7.  **Check Question (Application - 10 mins):**
      *   **Scenario:** "A museum has an incredibly fragile ancient parchment, disposed to crumble if exposed to oxygen (S = O2 exposure, M = crumbling). It's kept in a perfectly sealed argon-filled display case. Curators know that if the case is ever breached, the parchment *would* crumble instantly. One day, a tiny, undetected crack forms in the case. Oxygen starts to seep in... BUT, the instant the first O2 molecule touches the parchment, a previously inert nano-coating *activates*, forming an impermeable barrier *over the parchment's surface*, preventing any further O2 contact. The parchment does *not* crumble."
      *   **Question:** "Was the parchment's fragility **Masked** or **Finked** when the oxygen seeped in? *Explain exactly why, referencing the contrast we made.*"
      *   **Answer:** **Masked.** When O2 seeped in (S began), the parchment was *still fragile* (its intrinsic state unchanged). The nano-coating formed an *external barrier* that *blocked* the oxygen from causing the manifestation (crumbling). The fragility was present but prevented from manifesting. (It's *not* a fink because the parchment itself didn't change; an external shield formed).

  8.  **Openly Refuse to Explain (Name-Drop Only):**
      *   **David Lewis's Counterfactual Analysis Machinery:** "Lewis provided a full formal analysis using possible worlds and similarity metrics. That's powerful, but it's more detail than we need today. For our purposes, the intuitive counterfactual understanding ('If S, M would happen') suffices. Just know the full formalization exists."
      *   **Probabilistic Dispositions:** "We're focusing on deterministic dispositions ('would shatter'). Some dispositions are probabilistic ('tends to break', 'likely to dissolve'). That's important, but it adds complexity we're bracketing today."
      *   **Mimics & Mimickers:** "There are other tricky cases like objects that *appear* to have a disposition but don't (mimics), or objects that gain a disposition only temporarily (mimickers). We're sticking to genuine dispositions today."

  **What Would Change My Mind About This Order:**

  1.  **Dominant AI Background:** If >75% are AI alignment folks with *zero* philosophy exposure, I might swap Steps 3 & 4. Start with **Fink** using an *algorithmic* analogy they instantly grasp: "Imagine a model has a 'harmful output' disposition triggered by query S. A safety filter (fink) *detects S being input* and *instantly rewrites the model's weights* to remove the harmful tendency *before* generation completes." Then contrast with a Mask (a content filter *blocking* the harmful output *after* generation). This leverages their intuition but risks them *only* thinking algorithmically. Proceed with physical examples immediately after to generalize.
  2.  **Counterexample Raised:** If someone early on insists fragility *requires* a history of breaking (Operationalism), I'd address it immediately in Step 1: "Is a *brand new*, never-tested glass fragile? Yes. Its structure defines it. Dispositions are *forward-looking* properties based on current state." If someone suggests the Styrofoam *changes* the glass (conflating mask/fink), I'd emphasize the counterfactual check in Step 3 harder: "Remove the styrofoam *first*. Does it break? Yes. So the glass *inside* was fragile all along."
  3.  **Deep Physics Background:** If many have QM/Stat Mech, they might challenge intrinsicness early. I'd briefly acknowledge reductionism: "Yes, dispositions might supervene on microstructure. But for our purposes, we're talking about properties *at a given level of description*."

  **Why This Sequence Wins:**

  1.  **Builds Intuitions Sequentially:** Disposition → When it *should* work → Why it *might not* work (externally blocked) → Why it *might not even be there* when needed.
  2.  **Physical Examples are King:** Glass + Styrofoam (Mask) and Glass + Stabilizer (Fink) are simple, visualizable, and mechanically distinct. Avoids the pitfalls of your drone (mask-like) or vitamin (often pre-S composition change).
  3.  **Preempts Conflation Relentlessly:** The core question ("Is the disposition *still there* when S happens?") and the side-by-side contrast are repeated weapons against Mask/Fink collapse. Blocking the AI mapping early prevents distraction.
  4.  **Check Question Validates:** The museum scenario forces application, distinguishes Mask/Fink cleanly, and involves protection – a context where masking is intuitive.

  **Execute:** Be energetic, use gestures (shield for mask, transformation for fink), demand they articulate the counterfactuals, and shut down AI parallels until the distinction is rock solid. Good luck!
