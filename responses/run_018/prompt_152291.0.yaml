prompt: |-
  hey, i'm putting together a session for a phil of mind grad seminar — about 10 people, 75 mins. the topic is self-locating belief and the sleeping beauty problem, but i don't want another worksheet where they just compute 1/3 vs 1/2. i want them to physically feel why the thirder view feels inescapable once you're inside the experiment, while still feeling the halfers intuition tugging from the outside.

  here's the niche twist: build the activity around "centered-world peer disagreement." have participants take on roles where two agents share the exact same centered world (both are monday-wakers in identical mental states) but one of them is also scheduled for an identical tuesday-waking, and they have to place a joint bet on the coin outcome before anyone "goes to sleep." after waking — simulatd via hidden envelopes and amnesia cards — they have to coordinate a decision without knowing which day it is or wether their partner is experiencing the other waking. the rules and payoff scheme (fake points, no real money) should be arranged so that coordination succeeds only if they reason like thirders, but an outside observer can see the halfers logic.

  design the full thing: specific roles, materials (envelopes, cards, point tokens), a minuite-by-minuite timeline, the payoff rules, and a debrief that maps each moment of the game onto either the halfer or thirder position. also include an honest note on which feature of genuine self-locating belief this can't reproduce — probably the actual absence of memory linking the wakings — and tell me what will predictably go wrong on the first run (like people cheating by recognizing envelope textures?). write it casual, like you're emailing a colleague; a typo or two is totally fine.
