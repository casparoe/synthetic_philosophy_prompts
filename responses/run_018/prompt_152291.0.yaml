answer: |-
  Okay, hear me out, this is gonna be messy-fun. Forget worksheets, we're making them *live* the centered weirdness. Here's the full plan, designed for that visceral thirder tug-of-war:

  **Core Idea:** Pairs share a *physically identical* centered world ("Monday Waker, feeling X"), but ONLY ONE of them actually *is* in the "real" Monday (if Heads). The other is a "Monday Instance" doomed to be forgotten if Tails. They need to agree on a bet *now*, knowing that later, they'll forget this specific coordination chat, and might face their "peer" again in an identical state on Tuesday (if Tails), or wake up alone (if Heads). Coordination requires embracing duplication (thirder), while the Experimenter sees the single coin flip (halfer).

  **Participants:** 10 Grad Students
  *   **8 Beuties:** Forming 4 Pairs (Pair A, B, C, D). Each pair shares a coin outcome *for their specific scenario*.
  *   **1 Experimenter:** Runs the show, flips coin, manages materials, acts as the "external" halfer perspective.
  *   **1 Scribe/Observer:** Takes notes on arguments, confusion points for debrief. (Could rotate this if needed).

  **Materials:**
  *   **Coin:** Big, chunky, obvious one.
  *   **Envelopes (x Lots):** Identical opaque envelopes. Say 40+ to be safe (you'll use ~3-4 per Beauty per run).
  *   **"Awakening Scenario" Cards (x16):** Identical cards explaining the centered moment. Text: *"You have just woken up. It is either Monday (if the coin landed Heads) or it could be Monday OR Tuesday (if the coin landed Tails). You have total amnesia about any previous awakenings this experiment. You are currently discussing the coin outcome with your assigned partner, who is in the exact same physical and mental state as you right now. You must agree on a joint bet about the coin: 'Heads' or 'Tails'."*
  *   **"Amnesia Seal" Cards (x16):** Blank cards. Used to physically "reset" memory by sealing them inside an envelope representing "going to sleep".
  *   **Betting Tokens (x20+):** Poker chips, candy, fake money bills. Two types: **"H" (Heads)** and **"T" (Tails)**. Each pair gets a few of each.
  *   **Payoff Chart:** Visible to all.
  *   **Timer:** For discussion phases.

  **Payoff Rules (The Crucial Bit - Fake Points):**
  *   **Goal:** The pair must place **ONE JOINT BET** (one "H" or one "T" token) for their *current* awakening.
  *   **Scoring:**
      *   If they **agree correctly** on the *actual coin outcome*: **+10 Points** to *each* Beauty in the pair.
      *   If they **agree incorrectly**: **-5 Points** to each.
      *   If they **disagree** (try to place different tokens or can't decide): **-10 Points** to each.
  *   **Key Twist:** Points are awarded **per awakening instance that occurs**. This is the *thirder engine*.
      *   If the coin was **Heads**, only **ONE** awakening/decision happens per pair. Points awarded once.
      *   If the coin was **Tails**, **TWO** awakenings/decisions happen per pair (Mon & Tue). Points awarded **TWICE** (once for Mon decision, once for Tue decision), *even though it's the same "Beauty" experiencing both*.

  **Setup (Before Students Arrive - 5 mins):**
  1.  Prepare stacks of identical envelopes.
  2.  Place one "Awakening Scenario" card inside each of 8 envelopes. Seal them. (These are the "Monday Wakeup" envelopes).
  3.  Have stacks of blank "Amnesia Seal" cards ready.
  4.  Set up Payoff Chart clearly.
  5.  Assign Pair Letters (A, B, C, D) to tables/spots.

  **Session Flow (75 Mins Total):**

  1.  **Framing & Role Assign (10 mins):**
      *   Briefly recap Sleeping Beauty (assume familiarity). Pose the 1/2 vs 1/3 conflict.
      *   Introduce the twist: "Today, we're simulating the centered world *and* peer disagreement within it. You'll experience what it's like to share an identical centered perspective with someone *right now*, but have different future experiential trajectories."
      *   Assign roles: 4 Pairs (8 Beuties), 1 Experimenter, 1 Scribe.
      *   Explain the **Payoff Rules** slowly. Emphasize: Points are per *occurring* decision instance. If Tails, Tuesday happens, and Tuesday's decision counts separately. "Your Tuesday self, waking up amnesiac, is a *new decision point* for scoring."

  2.  **The Coin Flip & Initial "Sleep" (5 mins):**
      *   Experimenter flips coin **once for ALL PAIRS**. (Keeps it simple, all pairs share the same coin outcome reality). Experimenter notes outcome (H/T), hides it.
      *   Experimenter gives **ONE sealed "Monday Wakeup" envelope** to each Beauty. *"This represents you going to sleep Sunday night. Do not open yet!"*

  3.  **First "Awakening" (Monday - 20 mins):**
      *   **"WAKE UP!"** - All Beuties open their envelopes simultaneously. Read the Scenario Card inside.
      *   **Key Instruction:** "Find your partner. Discuss and agree on your joint bet (H or T token). You have 10 minutes. Remember: You share the *exact same centered perspective right now*. But only one of you is the 'original' Beauty if Heads. The other is also scheduled for Tuesday waking *if Tails*. Place your agreed bet token visibly on your table."
      *   *Students discuss/argue*. Likely initial halfer dominance ("It's 50/50!"), but pressure to agree and avoid the -10 penalty. Scribe notes arguments.
      *   After 10 mins (or consensus), pairs place their joint bet token.

  4.  **"Going Back to Sleep" / Memory Wipe (5 mins):**
      *   Experimenter instructs: "Time to sleep. **Complete amnesia.** Seal the Scenario Card you just read *and* a blank 'Amnesia Seal' card back into a *new* envelope. Do this silently, no talking. This envelope represents your 'sleep'."
      *   Beuties seal cards into new envelopes. Experimenter collects all envelopes from all Beuties.

  5.  **Potential Second "Awakening" (Tuesday - If Tails Only - 15 mins):**
      *   Experimenter checks coin outcome.
      *   **If HEADS:** "The experiment is over! No Tuesday waking." Skip to scoring. (Halfer glee?).
      *   **If TAILS:** "It is now Tuesday! Or maybe Monday again? WAKE UP!" Experimenter **distributes the *same* envelopes just collected back to the *same* Beuties.** (Physically simulating the amnesia - they get an envelope containing the card they just read + a blank card, identical to the first wake-up).
      *   Beuties open envelopes. Read the *identical* Scenario Card again. "Find your partner. You are in the *exact same centered state* as before. Discuss and place your joint bet AGAIN. You have 7 minutes." (Shorter, as concept is familiar).
      *   Pairs discuss/place bet token again. *Crucially, they are having the same discussion with the same person, in the same state, about the same coin, but it's a distinct scoring instance.* Scribe notes if reasoning changes.

  6.  **Scoring & Reveal (5 mins):**
      *   Experimenter reveals the coin outcome (H or T).
      *   For **each decision instance that occurred**:
          *   For each pair, check their bet token for *that awakening*.
          *   Apply Payoff Rules (+10 each for correct agree, -5 each for incorrect agree, -10 each for disagree).
          *   Tally points per Beauty (e.g., if Tails, a Beauty gets points for Mon decision AND Tue decision).
      *   Announce scores (fake points, bragging rights). Experimenter emphasizes: "Points awarded per *waking*."

  7.  **Debrief - Mapping the Mindf**k (15 mins):** *Guide this tightly!*
      *   **"The Visceral Pull of Duplication (Thirder):"**
          *   *"When you were discussing with your partner, feeling identical, how did the possibility of TWO of these chats happening (if Tails) influence your desire to bet Tails?"* (Points awarded twice under Tails).
          *   *"Did the payoff rule forcing agreement make betting Tails feel safer? Why?"* (Betting Tails wins if *either* Heads OR Tails? No! But it wins in 2/3 of the *awakening instances*).
          *   *"That feeling that 'my current state is more likely to be one happening under Tails' – that's the centered-world thirder credence (P(Heads) = 1/3). The scoring mirrored the epistemic situation: Your bet mattered in proportion to how often that state occurs."*
      *   **"The External Certainty (Halfer):"**
          *   *Experimenter/Scribe/Observer:* "From my view, what was the fundamental uncertainty? Just one coin flip, right? 50/50. The awakenings are *consequences*, not independent chances." (Halfer: P(Heads) = 1/2).
          *   *"The halfer view sees the *temporal embedding*: There was one flip Sunday, then events unfold. The thirder view, experienced from within, sees the *branching indexical possibilities* available *at each waking*."*
      *   **"Centered Peer Disagreement Illusion:"**
          *   *"You and your partner felt like peers sharing the *exact same evidence* in the *exact same moment*. But were you? Only one of you was the 'original' Beauty! If Heads, the other wasn't 'supposed' to be there at all! Yet, you couldn't tell. This forced coordination *as if* you were identical peers highlights how self-locating uncertainty dissolves differences that seem crucial from the outside."*
      *   **The Glaring Limitation (Honest Note):**
          *   *"What this *can't* simulate is the **true subjective break in continuity**. Here, you *remembered* the rules, the setup, the payoff structure. You knew you *might* be duplicated. Real Sleeping Beauty has *zero* memory of Monday when waking Tuesday. She doesn't consciously think 'Ah, this is one of my awakenings'. She just wakes up, period. Our simulation retains the *conceptual knowledge* of the experiment structure, which real indexical uncertainty might not include. We simulated the *ignorance of location* (which day? which instance?), but not the complete *loss of higher-order knowledge about the possibility of duplication* during the Tuesday waking. That pure, contextless 'here and now' is harder to fake."*
      *   **Predictable Clusterf**ks (First Run):**
          *   **Cheating:** Yep, envelope textures, peeking when sealing, whispering during "amnesia" phase. Mitigation: Use *very* identical envelopes, enforce silence strictly during sleep phases, maybe have Experimenter shuffle envelopes briefly before redistributing for Tuesday.
          *   **Ignoring Amnesia:** Students might subtly reference the previous discussion ("Like we said before..."). Enforce the "amnesia" role-play strictly. The Scenario Card reminder helps.
          *   **Halfer Rebellion:** Some pairs might stubbornly bet Heads both times, tanking their score but "proving a point". Good! That's the tension. Debrief it.
          *   **Confusion Over Scoring:** Reiterate "points per *occurring decision instance*" constantly. The Tuesday payoff under Tails is the key.
          *   **Time Crunch:** 20 mins for first discussion might be tight if they really dig in. Be ready to flex slightly or cut the Tuesday discussion shorter.
          *   **"Who's the Duplicate?!":** They might try to figure out "which one" of them is the "original". Shut it down! The point is they *can't* know, and it *shouldn't* matter for the bet *from their perspective*. Emphasize symmetry.

  **Why it Works:**
  The payoff structure directly ties rational betting behavior *within* the centered perspective to the thirder credence. Agreeing to bet Tails is the dominant strategy *for the awakenings* because it wins in 2 out of 3 possible centered moments (Mon-Tails, Tue-Tails, vs Mon-Heads). But the Experimenter only ever saw one flip. The physical act of having the *same* discussion twice (under Tails), with the *same* person, while scoring twice, makes the duplication feel real and costly to ignore. The "peer" setup forces them to confront the symmetry of their *current* state despite their asymmetric roles in time.

  Good luck! It'll be chaotic, but the "Aha!" faces when they realize *why* betting Tails was the only way to consistently win points (from inside) while the coin was fair (from outside) should be glorious. Let me know how the amnesia holds up! Got any tweaks immediately springing to mind?
