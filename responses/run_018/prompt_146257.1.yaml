  ### Decision-Tree Taxonomy for Buridan's Ass

  **Root Question:** Can the two options be genuinely equiprobable and indistinguishable in every respect relevant to the agent's ends?  
  - **Yes** → Proceed to (a).  
  - **No** → Proceed directly to (b), skipping (a) (as no tie exists due to inherent asymmetry).  

  ---

  #### Branch (a): *May the agent break the tie by arbitrary selection without forfeiting rationality?*  
  *(Applies only to "Yes" from root)*  
  - **Yes** → Arbitrary selection is rational. Proceed to (b).  
  - **No** → Arbitrary selection forfeits rationality. Proceed to (b).  

  ---

  #### Branch (b): *Does introducing an irrelevant asymmetry (e.g., a non-nutritive chromatic difference) dissolve the paradox or merely displace it?*  
  *(Applies to all branches)*  
  - **Yes** → Irrelevant asymmetry dissolves the paradox. Proceed to (c).  
  - **No** → Irrelevant asymmetry merely displaces or fails to resolve the paradox. Proceed to (c).  
    - *For "No" from root:* Irrelevant asymmetry cannot dissolve the paradox, as it was already resolved by inherent asymmetry.  

  ---

  #### Branch (c): *Does imposing a hard deadline (making inaction fatal) introduce a meta-preference or leave the logical structure unchanged?*  
  *(Applies to all branches)*  
  - **Yes** → Deadline introduces a meta-preference (e.g., urgency alters rational structure).  
  - **No** → Deadline leaves logical structure unchanged (e.g., inaction remains irrational).  
    - *For "No" from root:* Deadline is redundant, as inherent asymmetry already motivates choice.  

  ---

  ### Terminal Nodes (Philosophical Positions)  

  1. **Root: Yes → (a) Yes → (b) Yes → (c) Yes**  
     - **Position:** Pragmatic dissolution  
     - Awkward commitment: Rationality hinges on combining arbitrary factors with extrinsic pressure, reducing agency to opportunism.  

  2. **Root: Yes → (a) Yes → (b) Yes → (c) No**  
     - **Position:** Rational arbitrary-selection  
     - Awkward commitment: Defends arbitrary choices as fully rational despite lacking justificatory grounds.  

  3. **Root: Yes → (a) Yes → (b) No → (c) Yes**  
     - **Position:** Urgency-dependent volition  
     - Awkward commitment: Free will only activates under threat, rendering non-urgent indecision pathological.  

  4. **Root: Yes → (a) Yes → (b) No → (c) No**  
     - **Position:** Libertarian volition  
     - Awkward commitment: Asserts a non-physical faculty of will capable of creating reasons ex nihilo.  

  5. **Root: Yes → (a) No → (b) Yes → (c) Yes**  
     - **Position:** Deflationary escape  
     - Awkward commitment: Permits rationality only via arbitrary cues under duress, making ethics crisis-dependent.  

  6. **Root: Yes → (a) No → (b) Yes → (c) No**  
     - **Position:** Deflationary impossibility  
     - Awkward commitment: Demands the ass starve as the sole rational outcome, equating symmetry with fatal paralysis.  

  7. **Root: Yes → (a) No → (b) No → (c) Yes**  
     - **Position:** Urgency-based volition  
     - Awkward commitment: Reduces rational action to time-pressured panic, excluding deliberate choice.  

  8. **Root: Yes → (a) No → (b) No → (c) No**  
     - **Position:** Strict preference-dependence  
     - Awkward commitment: Denies rational agency in symmetric worlds, implying humans require ubiquitous hidden asymmetries.  

  9. **Root: No → (b) No → (c) No**  
     - **Position:** Hidden-variable determinism  
     - Awkward commitment: Insists undetectable but decision-relevant asymmetries pervade all seemingly symmetric choices.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  - **Root: No → (b) Yes → (c) Any**  
