answer: |-
  ## Excavation Report with Refrain

  **I. (Object's Trace)**

  Observe this edge: the polish of long stroking,
  the residue of marrow, dried and stained.
  The fracture pattern shows a careful coaxing,
  or sudden impact? Either is sustained
  by microscopic grooves the blade retained.
  *The shard holds what we have taught it to mean.*

  **II. (Archaeologist's Claim)**

  Found pointing east beside the infant's bones,
  this breakage seems deliberate, precise.
  Not dropped, but placed—a ritual atone?
  The soil compels belief: a sacrifice,
  a charm for passage paid a bitter price.
  *The shard holds what we have taught it to mean.*

  **III. (Institutional Frame)**

  This numbered shelf, the grant application's need,
  the glass case lit for public, wondering eyes,
  the peer-reviewed caption planted like a seed –
  construct the ground where any meaning lies,
  where "use" or "rite" as valid answers rise.
  *The shard holds what we have taught it to mean.*

  ---

  **Notes on Execution:**

  *   **Structure & Refrain:** Three six-line stanzas, each ending with the required refrain. The refrain's subject shifts:
      *   **Stanza I:** Implicitly the object ("shard").
      *   **Stanza II:** Explicitly the archaeologist ("we").
      *   **Stanza III:** Ambiguous ("we" could be institution, field, collective practice, or the object itself via institutional mediation).
  *   **Stanza I (Functional/Ritual Ambiguity):** Focuses on physical traces (polish, residue, fracture pattern, microscopic grooves). Uses verbs like "stroking," "coaxing," "impact" and nouns like "marrow," "fracture," "grooves" rooted in use-wear analysis. The question ("careful coaxing, / or sudden impact?") and "Either is sustained" explicitly avoid deciding between utilitarian action (butchery) and ritual action (deliberate shaping/breaking).
  *   **Stanza II (Symbolic Interpretation):** Moves to context (infant bones, orientation "east"), intent ("deliberate, precise," "placed—not dropped"), and inference of belief ("ritual atone," "sacrifice," "charm for passage," "bitter price"). Shows how the *same* physical breakage observed in Stanza I becomes evidence *only* after the belief context ("soil compels belief") is assumed.
  *   **Stanza III (Institutional Frame):** Exposes the scaffolding: museum storage ("numbered shelf"), funding pressures ("grant application's need"), public presentation ("glass case," "public eyes"), and academic validation ("peer-reviewed caption"). Highlights how these structures *create the conditions* ("construct the ground") under which interpretations ("use' or 'rite'") become legible and "valid."
  *   **Theoretical Accuracy:** Directly addresses:
      *   **Overdetermination of Traces (Stanza I):** Multiple plausible interpretations for physical evidence.
      *   **Hermeneutic Circularity (Stanza II):** Belief is inferred from context/assumption, which is then used to interpret the object that supposedly evidences the belief.
      *   **Reflexive Role of Institutions (Stanza III):** How funding, museums, publications, and academic practice shape what questions are asked, what evidence is valued, and what interpretations become accepted.
  *   **Ambiguous Ending:** The final refrain, positioned after describing the institutional frame, leaves the source of the voice (object? archaeologist? institution? the gap itself?) fundamentally undecidable, mirroring the unresolved epistemological tension. The circularity remains intact.
