  Below is the taxonomy structured as a decision tree for the strategy-stealing assumption in Newcomb-style problems. The tree sorts positions by their commitments on four diagnostic cases, with branches labeled by concrete claims (not view names). Each leaf is annotated with a named view (where applicable), its most awkward commitment, and a diagnosis of unoccupied combinations. The tree flags views that share a branch and suggests further distinguishing cases.

  ---

  ### **Decision Tree Taxonomy: Strategy-Stealing in Newcomb-Style Problems**

  #### **Root Question**:  
  **Does strategy-stealing require that the agent's reasoning process be transparent to the predictor?**  
  *(Transparency: The predictor must simulate the agent's actual decision process)*  
  - **Branch A**: **Yes**, transparency required.  
  - **Branch B**: **No**, transparency not required.  

  ---

  #### **Level 2 (for Branch A)**:  
  **Does a "local-copy" scenario count as stealing the strategy?**  
  *(Local-copy: Agent runs an exact offline simulation of the predictor and acts contrary to its output)*  
  - **Branch A1**: **Yes**, local-copy counts as stealing.  
  - **Branch A2**: **No**, local-copy does not count as stealing.  

  #### **Level 2 (for Branch B)**:  
  **Does a "local-copy" scenario count as stealing the strategy?**  
  - **Branch B1**: **Yes**, local-copy counts as stealing.  
  - **Branch B2**: **No**, local-copy does not count as stealing.  

  ---

  #### **Level 3 (for A1)**:  
  **Does strategy-stealing force one-boxing in standard Newcomb?**  
  - **Branch A1a**: **Yes**, forces one-boxing (cannot defend two-boxing via causal independence).  
