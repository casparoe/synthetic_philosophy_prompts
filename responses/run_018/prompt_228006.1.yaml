  The factions might be talking past each other. Proponents see the axioms as minimal rationality constraints, while critics see them as embedding quantum mechanics from the start. This isn't a technical issue but a philosophical one about justification and circularity. The user mentioned both sides accept the math, so new theorems won't help. The debate is about the interpretation and justification of the axioms themselves.

  The user also needs to know what would count as progress. Since the disagreement is philosophical, a sharper theorem might not resolve it. Instead, clarifying the nature of the axioms or exploring self-locating uncertainty could help. For example, if there's an independent theory of uncertainty in branching universes, that might bridge the gap. Alternatively, recognizing the debate as a clash of intuitions about rationality could shift focus to whether such intuitions can be reconciled.

