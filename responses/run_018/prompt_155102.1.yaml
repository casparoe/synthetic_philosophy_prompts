answer: |-
  **Downward causation requires explicit design of symbolic causal efficacy over substrate, not mere correlation or mechanical actuation; all three proposals fail, with step 4 as the critical filter and my confidence at 95% for each outcome.**  

  ### Decision Procedure (Run on Paper Specs)  
  **Ordered Questions, Evidence Thresholds, Stop Points, and Philosophy Handoff:**  

  1. **Is there a clear high-level symbol (simmball) mapped to substrate states?**  
     - *Evidence required:* Architectural diagram or spec showing bidirectional mapping (symbol → substrate representation).  
     - *Sufficient evidence:* Explicit documentation of symbol-substrate dependencies (e.g., "simmball X controls transistor group Y").  
     - *Stop point:* If no mapping exists → **"No downward causation: Symbols lack substrate grounding."**  

  2. **Does the proposal claim a *specific event* where symbol changes cause substrate changes?**  
     - *Evidence required:* Description of a causal mechanism (e.g., "updating simmball A forces memory rewrite B").  
     - *Sufficient evidence:* Isolated cause-effect chain in the design docs (e.g., symbol update → immediate hardware action).  
     - *Stop point:* Only correlation described (e.g., "simmballs correlate with voltage shifts") → **"No downward causation: Claims correlation, not causation."**  
     - *Correlation trap:* Fails here if substrate changes are merely concurrent with symbols (e.g., noise fluctuations during symbol updates).  

  3. **Is the causal direction *explicitly designed* (symbols drive substrate), not emergent?**  
     - *Evidence required:* Control flow showing symbols as *initiators* (e.g., symbol state directly inputs into actuator drivers).  
     - *Sufficient evidence:* Architecture mandates symbol processing precedes substrate changes (e.g., "token output → servo command").  
     - *Stop point:* Substrate changes could occur without symbols (e.g., low-level feedback loops bypass symbols) → **"No downward causation: Substrate autonomy breaks causal chain."**  
     - *Correlation trap:* Fails if symbols are "read-only" (e.g., monitoring tools) or if substrate self-updates.  

  4. **Could substrate changes occur *identically* if symbols were removed/overridden?**  
     - *Evidence required:* Design must show symbols are *necessary* for the substrate effect (e.g., disabling symbols halts claimed effect).  
     - *Sufficient evidence:* Controllable symbol manipulation alters substrate *independently* of low-level inputs (e.g., injecting a symbol forces hardware reset).  
     - *Stop point:* Substrate changes are fully explainable by bottom-up processes (e.g., physics, fixed circuits) → **"No downward causation: Symbols epiphenomenal."**  
     - *Key intuition break:* Most proposals fail here—symbols often *track* substrate states but don’t *constrain* them.  
     - *Philosophy handoff:* If evidence shows symbols are necessary but their efficacy violates physical laws (e.g., non-computational forces).  

  5. **Does the design avoid *causal overdetermination* (symbols not just "along for the ride")?**  
     - *Evidence required:* Symbols must introduce *novel* substrate states not prefigured by low-level dynamics (e.g., symbol-triggered chaos in orderly circuits).  
     - *Sufficient evidence:* Symbolic intervention changes substrate behavior unpredictably from bottom-up perspective (e.g., overriding physics simulations).  
     - *Stop point:* Symbols mirror predetermined substrate evolution → **"No downward causation: Bottom-up determinism dominates."**  
     - *Philosophy handoff:* If symbols exhibit "strong emergence" (causally irreducible to substrate).  

  ---  
  ### Proposal Evaluations  
  **Proposal 1: Chess engine (tweaking strategy rules changes heat dissipation)**  
  - Step 1: Pass. Symbols (strategy rules) mapped to algorithm parameters in silicon.  
  - Step 2: Pass. Claims rule tweaks *cause* heat changes.  
  - Step 3: Fail. Heat dissipation is emergent from computational load (transistor switching); rules are inputs, not drivers.  
  - **Stop at Step 3 → No downward causation.** Symbols correlate with but don’t *drive* heat dynamics; identical heat could arise from non-symbolic optimizations (e.g., parallelization).  
  - *Confidence:* 95% (mechanical actuation of heat is substrate-led).  

  **Proposal 2: Language-model arm (token outputs drive servo motors)**  
  - Step 1: Pass. Tokens mapped to motor control signals.  
  - Step 2: Pass. Token X → servo action Y.  
  - Step 3: Pass. Design shows tokens *initiate* servo commands.  
  - Step 4: Fail. Servo movements would occur identically via direct low-level input (e.g., bypassing tokens with voltage spikes). Tokens are sufficient but not *necessary*; substrate executes identically without them.  
  - **Stop at Step 4 → No downward causation.** Tokens are causal intermediaries, not controllers; servos respond to electrical inputs, not symbolic meaning.  
  - *Hard case against intuition:* Mechanical actuation seems like proof, but tokens don’t *constrain* substrate—servos would react to any identical signal.  
  - *Confidence:* 95% (friend’s mechanical actuation argument fails here).  

  **Proposal 3: "Ghost careenium" (substrate noise correlates with symbols, never initiates them)**  
  - Step 1: Pass. Symbols mapped to noise-affected registers.  
  - Step 2: Fail. Explicitly states noise *never initiates* symbol updates; only correlation claimed.  
  - **Stop at Step 2 → No downward causation.** Pure correlation with no causal mechanism proposed.  
  - *Confidence:* 95% (design admits symbols are passive).  

  ---  
  ### Where the Procedure Misfires  
  - **False negatives:** Systems with *designed feedback loops* (e.g., symbols amplify substrate noise to alter future symbols). Step 4 might misflag as epiphenomenal if specs omit loop details.  
  - **False positives:** *Illusory control* (e.g., symbols trigger substrate changes, but changes were predetermined). Step 5 usually catches this.  
  - **Step I’m least sure about:** **Step 4 (necessity test).** Confidence 85%. It assumes perfect spec clarity, but real designs may hide substrate autonomy (e.g., hidden hardware interrupts). Philosopher handoff advised if specs are ambiguous.  

  ---  
  ### Why Mechanical Actuation Isn’t Enough  
  Your friend’s view fails the **Step 4 test**: Actuation (e.g., servos moving) often relies on low-level drivers that operate identically without symbols (e.g., voltage → motion). Symbols must be *necessary and non-redundant* causes, not just triggers. The procedure shows this by demanding substrate changes *require* symbolic intervention—a bar none of the proposals clear.
