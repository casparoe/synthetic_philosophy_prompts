prompt: |-
  In a recent argument about whether an AI customer-service agent’s printed utterance—“We guarantee replacement within 48 hours”—can by itself create a binding contractual obligation, my interlocutor dismissed my skepticism with the line, “Saying makes it so.” I want to unpack exactly what work that slogan might be doing. Can you lay out the distinct precise theses it could be expressing, arranged as a menu from the trivial to the radical? For each reading, indicate whether it is a platitude, a substantive but defensible claim in the philosophy of language, or actually false, and specify which hidden premises—about institutional conventions, speaker intentionality, audience uptake, or the distinction between locutionary and illocutionary force—it relies on. In particular, distinguish versions that apply only to human agents embedded in social institutions from versions that extend performative power to algorithmic outputs lacking beliefs or authority. Then tell me which of these readings actually supports the conclusion that the chatbot’s sentence creates an obligation, and which ones, if adopted, would instead undermine it. I am not asking for citations or a bibliography; I need a disambiguation I can use in the argument without searching external sources.
