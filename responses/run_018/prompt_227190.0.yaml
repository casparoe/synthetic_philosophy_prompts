  We are constructing a realistic contemporary scenario: a police investigation.

  **Scenario:**  

  Detective A and Detective B are reviewing the same cold case: a series of three unsolved burglaries that occurred in the same upscale neighborhood over a two-week period. The evidence, gathered at the time and fully available to both detectives, includes: (1) the forced entry in each case was via a rear window; (2) each burglary occurred on a Tuesday night; (3) the stolen items were all high-value, portable electronics; and (4) a partial shoeprint found at the second scene matched a rare brand of running shoes. 

  Detective A, assigned to re-examine the case, begins by studying the evidence. She notices the pattern of Tuesdays and the rare shoeprint. After researching, she discovers that a local gang, the "Tuesday Crew," is known to use that brand of shoes. She formulates the hypothesis: "The burglaries were committed by the Tuesday Crew." She then checks and confirms that the gang's known modus operandi (rear window entry, targeting electronics) matches the evidence.

  Detective B, meanwhile, has been investigating the Tuesday Crew for an unrelated offense. During an interrogation, a gang member brags about committing three burglaries in that neighborhood. Detective B records this statement and formulates the same hypothesis: "The burglaries were committed by the Tuesday Crew." Only then does he pull the cold case file and, with effort, cross-reference the details: the rear window entry, the Tuesday nights, the stolen electronics, and the rare shoeprint (which he traces to the gang's supplier). The cross-check takes work: he must retrieve and compare the gang's known MO from their past convictions and confirm the shoeprint model was sold exclusively to a store that supplied the gang.

  **Analysis:**

  **1. The Bayesian Problem with Old Evidence:**  
  Bayesian confirmation theory relies on updating via conditionalization: when an agent learns new evidence E, they update their credence in hypothesis H to P(H|E). However, if E is already known (so P(E)=1), then P(H|E) = P(H) because learning E (which is already certain) doesn't change anything. Thus, the old evidence E cannot confirm H (raise its probability) for the agent. This is the "problem of old evidence" (Glymour, 1980). In our case, both detectives already have the evidence (the pattern and shoeprint) with certainty. So, for a strict Bayesian, the evidence cannot confirm the hypothesis for either detective.

  **2. The Two Repairs:**

     a) **Counterfactual-priors repair:** We consider what the agent's credence in H would have been *before* learning E. If, in that counterfactual state, P(H|E) > P(H), then E confirms H.  
        - For Detective A: She constructed H directly from E. In the counterfactual state where she doesn't know E, she would not have H. So, without E, P_A(H) would be very low. Therefore, P_A(H|E) >> P_A(H) in the counterfactual, so E confirms H.  
        - For Detective B: He learned H from an independent source (the interrogation). In the counterfactual state without E, he still might have gotten the confession and thus had a high P_B(H) even without E. However, the confession alone might not be fully credible, and without E, he might have less reason to believe the confession. But crucially, the counterfactual priors repair does not depend on how the agent *actually* came to H, but on the counterfactual relation between E and H. For Detective B, in the counterfactual state without E, if he had learned E, it would have raised his credence in H. Why? Because E (the pattern and shoeprint) is strong evidence for H even without the confession. So, P_B(H|E) > P_B(H) in the counterfactual. Thus, E confirms H for B too.  
        *Verdict for both twins:* E confirms H under this repair.

     b) **Logical-learning repair:** What the agent learns is not E (which they already know) but the logical or probabilistic connection between H and E — for instance, that H entails E, or that P(E|H) is high.  
        - For Detective A: When she formulates H to fit E, she already sees the connection. But the repair requires that she *learns* the connection. In her case, she might not have known the connection before she constructed H. However, the scenario says that after constructing H, she still has to check the gang's MO to confirm the match (which is work). So at the moment of checking, she learns that H entails E (or that E is very likely given H). Thus, she learns the connection, and this new knowledge (not E) confirms H.  
        - For Detective B: After formulating H from the confession, he pulls the file and does the cross-check. He then learns that H entails E (or that E is expected under H). This is the same new knowledge as for A.  
        *Verdict for both twins:* Learning the connection confirms H for both.

  **3. Structural Feature and Divergence Removal:**  
  In both repairs above, the twins are treated the same. But note: the counterfactual-priors repair, as applied, does not distinguish between the twins because it only cares about the counterfactual relation of E to H, not the actual path to H. The logical-learning repair also treats them the same because both learn the connection after formulating H. 

  However, the repairs might diverge if we consider a case where one twin *already knew the connection* before formulating H. But in our scenario, neither did: 
     - Detective A constructed H from E, but she didn't know the connection until she checked the gang's MO (which she did after forming H). 
     - Detective B formed H independently and then learned the connection by cross-checking.

  But suppose we alter the case: imagine that Detective A, having studied the Tuesday Crew before, already knew their MO and the shoeprint connection at the time she saw the evidence. Then, when she forms H by fitting, she doesn't learn any new connection — she already knew it. Then the logical-learning repair would not apply for her: there is no new logical fact to learn. But the counterfactual-priors repair would still say that E confirms H (because in the counterfactual without E, she wouldn't have formed H). 

  Thus, the structural feature that might cause a divergence is whether the agent *already knew the connection* between H and E at the time of formulating H. In our original scenario, both detectives learn the connection after formulating H, so no divergence.

  **4. Should the Twins be Treated Differently?**  
  The question is whether the fact that Detective A built H from E (as opposed to B who built H independently) should affect how much E confirms H. 

  - The counterfactual-priors repair does not distinguish them: in both cases, in the counterfactual without E, E would raise the probability of H. 
  - The logical-learning repair also does not distinguish them: both learn the connection after H is formed.

  Therefore, neither repair registers a difference. But note: our scenario was built so that both detectives do work to establish the connection after H is formed. If we tweak the scenario so that Detective A does not need to do any work because she immediately sees the connection (having built H from E), then the logical-learning repair might not apply for her — she never *learns* the connection because she never didn't know it. But in that case, the counterfactual repair would still apply.

  However, the spirit of the question is whether the method of constructing H (fitting vs. independent) matters. The standard repairs don't directly capture that. 

  A defender of the counterfactual-priors repair might argue that the difference is irrelevant because confirmation is about the relation between H and E, not about the history of how H was generated. 

  A defender of the logical-learning repair might argue that what matters is learning the connection, and how H was generated doesn't affect that.

  But a critic might say: Detective A's hypothesis is ad hoc because it was built to fit E, and thus E doesn't really test H. However, in our case, the hypothesis is not ad hoc in a negative sense because it has independent testability (it could be tested on new evidence). Moreover, the gang member's confession for Detective B provides an independent test.

  If we want a repair that distinguishes the twins, we might need a different approach. For example, one might argue that for Detective A, the evidence E was used to generate H, so it cannot also be used to confirm it (because it would be circular). But for Detective B, E is genuinely new to the hypothesis and thus can confirm it. This is the "no double-counting" intuition. 

  However, the Bayesian repairs we discussed don't naturally capture this. A defender of the counterfactual repair might attack the case by denying that the twins should be treated differently: both have the same total evidence and the same hypothesis. The fact that they arrived at H differently is a psychological, not an epistemic, matter. 

  Alternatively, a defender of the logical-learning repair might point out that even if Detective A built H from E, she still might not have been certain that H was true until she confirmed the connection (by checking the gang's MO). So she still learns something when she checks: that H indeed entails E. Thus, she gets confirmation from learning the entailment.

  **Conclusion for the Article:**  

  The two standard repairs do not distinguish between the twins in the scenario as built. Both repairs say that the old evidence confirms the hypothesis for both detectives. This suggests that, according to these Bayesian repairs, the manner of hypothesis generation (fitting vs. independent) does not affect the confirmatory power of old evidence. 

  However, if we alter the scenario so that one detective already knew the connection between H and E (and thus doesn't learn anything new when they note the match), then the logical-learning repair would not apply to that detective. But the counterfactual repair would still work. 

  The deeper issue is whether the history of hypothesis generation matters. The defender of the counterfactual repair would likely say it does not, and would attack any intuition to the contrary by arguing that the confirmatory relation is timeless. The defender of the logical-learning repair might similarly downplay the history and focus on the learning of the connection.

  But if you want to argue that there is a difference, you might need a non-Bayesian approach, such as one that values the independence of the hypothesis from the evidence. This might lead to a discussion of novel predictions versus accommodation of old evidence, which is a related but distinct issue.

  In summary, the matched-pair scenario shows that the standard Bayesian repairs do not care about the difference in hypothesis generation. The evidence confirms the hypothesis for both twins, and the repairs deliver the same verdict. This might be a point in favor of the view that the history of discovery is irrelevant to confirmation.
