prompt: |-
  I sit on the classification panel of an institute that funds language documentation, and for fifteen of its twenty years the panel's opinions on the phrase *living language* were drafted by one senior colleague — call her Dr. A. — whose verdicts now serve as our precedents. I have a new case to write up, and I want to know what she would say before I draft. The cases below are stylized; please take the non-semantic facts as stipulated and answer from the cases themselves.

  Her record:

  1. Latin: not a living language, notwithstanding continuous liturgical and scholarly use, and notwithstanding that several languages with millions of speakers descend from it.
  2. A variety with some 5,000 fluent speakers, all of them over seventy, none transmitting it to children: living. She added that the panel's question is always whether documentation effort could still do any good, and that this is what the phrase is doing in our minutes.
  3. A variety with 41 fluent speakers, a few hundred more who can manage a simple conversation, and a handful of children acquiring it: living.
  4. A variety with three fluent speakers, all in their eighties, no children, no documentation: she declined to classify, writing that the panel should record the case as indeterminate rather than guess.
  5. A planned language, first published in the 1880s, now with a few thousand fluent speakers including some who acquired it as a first language at home: living.
  6. Variety pairs: where two highly intelligible varieties are treated by their speakers as one language, she counted one language; where a comparably intelligible pair is maintained under separate names, orthographies and school systems, she counted two. Mutual intelligibility, she said, settles nothing by itself.

  The new case, Variety X: no fluent speakers after 1968; since 2009 a form reconstructed from field notes and recordings has been used daily at home by 62 people, 18 of them children, with several hundred more who understand it; the community, the regional education authority and our own fieldworkers all call it by the pre-1968 name. Two linguists on our advisory list maintain that a variety which has lost all its speakers has ceased to exist, that what is spoken now is a new and partly constructed variety, and that the panel should say so.

  What I want is more than a verdict. Set out the rules that fit the whole record — a snapshot-vitality rule keyed to present-tense speaker profile, a continuity rule on which a language is a historical individual, a rule on which the panel declines wherever admissible precisifications disagree, a contextualist rule of the kind her remark in case 2 suggests, a degree rule, whatever else you can make cohere with all six — and say what each predicts about X, including what each predicts about the further question whether the revived variety is the same language as the pre-1968 one. Then give me your best prediction of her opinion, with the reasons for preferring it, and then design the single further case that would best separate the surviving candidates.

  I also want a recommendation. If the panel is to be consistent with its own minutes, what should it say about X, which precedent is the closest analogue, and what would we be committing ourselves to under each option?

  One last thing. Case 5 shows she allows aliveness to begin, and X's route from zero fluent speakers in 1968 to 62 today went one learner at a time. On the rule you attribute to her, where does that chain break, and does the breaking point have to be one she could in principle name? If you think she would simply shrug at the question, tell me whether that shrug is compatible with the rest of her record, or whether it costs her one of the rules you have attributed to her.
reasoning: |-
  Hmm, the user presents a complex linguistic classification problem wrapped in institutional precedent. They're clearly deeply familiar with both the technical and procedural aspects of their panel's work, and the query demonstrates sophisticated meta-thinking about categorization itself.

  Dr. A's record reveals several non-standard principles that defy typical linguistic vitality metrics. The Latin case (#1) explicitly rejects historical continuity and descendant languages as factors, which is unusual. The "could documentation do good" criterion from #2 transforms "living" from a descriptive to a prescriptive category - almost a utilitarian definition. Case #4's indeterminacy shows remarkable restraint, acknowledging epistemic limits when data is insufficient.

  For Variety X, the core tension lies between case #2 (which accepted a moribund language with 5k elderly speakers) and the linguists' argument that revival constitutes a new entity. Dr. A's mutual intelligibility stance (#6) becomes relevant here - the community treats it as continuous, which aligns with her sociolinguistic perspective. However, the reconstruction element introduces novelty; her planned language acceptance (#5) suggests constructedness alone doesn't disqualify vitality.

  The revival timeline question exposes a genuine philosophical gap in the record. Dr. A seems to operate with prototype categories rather than bright lines - she can identify clear cases (Latin dead, Esperanto alive) but deliberately avoids specifying transition thresholds. This isn't inconsistency but recognition that language vitality exists on a continuum with gray areas.

  For the recommendation: Case #3 provides the strongest parallel - both involve small speaker numbers with intergenerational transmission. The "indeterminate" escape hatch (#4) doesn't apply here because we have clear data about the revival's success. The panel should note the reconstruction aspect but prioritize the observable sociolinguistic reality: community recognition and child acquisition.
answer: |-
  Here's a comprehensive analysis of Dr. A's classification logic applied to Variety X, following your requested structure:

  ### Reconstructed Rules from Precedents & Their Predictions for Variety X
  1.  **Utilitarian Documentation Rule (from Case 2):**
      *   **Rule:** "Living" = Documentation efforts could still yield significant benefit *or* support existing vitality. Focuses on the potential impact of funding *now*.
      *   **Prediction for X:** LIVING. Documentation efforts clearly *did* benefit the revival and continue to support its use (daily home use, child acquisition, understanding by hundreds).
      *   **Prediction on Identity:** Likely the SAME language. The rule focuses on present/future utility, not historical continuity per se. The community's recognition and use of the pre-1968 name aligns with this pragmatic view.

  2.  **Snapshot Vitality Rule (Emerging from Cases 2, 3, 5):**
      *   **Rule:** "Living" = Evidence of *current* functional use and transmission, regardless of historical path or origin (natural or planned). Key factors: Number of fluent speakers, presence of child acquisition, functional domains of use.
      *   **Prediction for X:** LIVING. 62 fluent speakers using it daily at home, 18 children acquiring it, several hundred passive speakers. This profile is stronger than Case 3 (41 fluent, only a *handful* of children).
      *   **Prediction on Identity:** INDETERMINATE/Not Directly Addressed. This rule focuses on the *current state* of the variety being used, not its historical pedigree. It doesn't inherently require unbroken transmission.

  3.  **Sociolinguistic Continuity Rule (from Cases 2, 3, 6):**
      *   **Rule:** "Living" depends on current speaker community perception and functional integration. A language persists if its community (or a revived community) identifies with it, uses it meaningfully, and maintains its identity (name, perceived continuity), even with breaks or reconstruction. Mutual intelligibility alone is insufficient (Case 6).
      *   **Prediction for X:** LIVING. The community, education authority, and fieldworkers all use the pre-1968 name. The variety is used functionally (daily home use) and transmitted to children.
      *   **Prediction on Identity:** SAME language. The rule heavily weights the *community's own identification* and use of the established name as evidence of continuity, overriding pure linguistic history or method of revival.

  4.  **Epistemic Caution / Indeterminacy Rule (from Case 4):**
      *   **Rule:** Decline classification ("indeterminate") when evidence is insufficient to make a reliable judgment about vitality *or* identity, especially near thresholds of extinction/revival.
      *   **Prediction for X:** INDETERMINATE. The complete break in native transmission (1968-2009) and reliance on reconstruction create significant doubt about continuity. While current use is strong, the path is unique.
      *   **Prediction on Identity:** INDETERMINATE. The rule specifically applies to questions where evidence for continuity is weak or contested.

  5.  **Degree Rule / Threshold Rule (Implicit in Cases 2, 3, 4):**
      *   **Rule:** "Living" requires a minimum threshold of fluent speakers *and* evidence of use/transmission. Below a very low threshold (e.g., 3 elderly speakers, Case 4), it's indeterminate. Planned languages with native speakers meet the threshold (Case 5).
      *   **Prediction for X:** LIVING. 62 fluent speakers, child acquisition, daily use far exceeds the thresholds suggested by Cases 3 (41) and 5 (few thousand/native speakers) and is vastly above the indeterminate threshold of Case 4 (3).
      *   **Prediction on Identity:** Not directly addressed by this rule alone. It focuses on the current state's scale.

  **Summary of Rule Predictions:**

  | Rule                          | Verdict on Vitality | Verdict on Identity      |
  | :---------------------------- | :------------------ | :----------------------- |
  | **Utilitarian Documentation** | LIVING              | SAME                     |
  | **Snapshot Vitality**         | LIVING              | INDETERMINATE            |
  | **Sociolinguistic Continuity**| LIVING              | SAME                     |
  | **Epistemic Caution**         | INDETERMINATE       | INDETERMINATE            |
  | **Degree / Threshold**        | LIVING              | Not Addressed            |

  ### Best Prediction of Dr. A's Opinion & Reasoning

  *   **Verdict:** LIVING (same language as pre-1968)
  *   **Reasoning:**
      1.  **Strongest Precedent:** Case 3 (41 speakers, handful of children) is the closest *vitality* analogue. X has *more* speakers (62) and *more* children (18), meeting and exceeding that vitality snapshot. Case 5 (planned language) shows origin/construction doesn't preclude vitality if functional use exists.
      2.  **Core Principle:** Her remark in Case 2 ("could documentation still do any good?") is paramount. The revival's *success* (daily use, child acquisition) *is* the "good" documentation ultimately achieved. Declaring it dead now would contradict the *purpose* of the classification she established.
      3.  **Community Perception Trumps Linguistics:** Case 6 shows she prioritizes sociolinguistic reality (speaker perception, naming, institutional recognition) over purely linguistic criteria (mutual intelligibility) or historical linguistics (the linguists' "new variety" argument). The community, education authority, and fieldworkers all identify it as the same language.
      4.  **Indeterminacy Avoided:** Case 4 applied to extreme scarcity (3 elderly, no documentation). X has robust documented revival and current vitality, making indeterminacy inappropriate. The evidence *is* sufficient to judge vitality positively.
      5.  **Practical Focus:** Her rules consistently focus on present-tense functionality, community practice, and the practical impact of the classification (enabling useful documentation). X fulfills all these.

  ### Discriminating Test Case Design

  *   **Goal:** Separate **Sociolinguistic Continuity/Utilitarian Documentation (Living/Same)** from **Epistemic Caution/Indeterminacy (Indeterminate)** and **Snapshot Vitality (Living/Indeterminate Identity)**.
  *   **The Case:** **Variety Y:** Lost its last native speaker (L1 acquirer) in 1950. Extensive documentation exists. In 2010, linguists meticulously reconstruct the phonology, grammar, and core lexicon *solely* from this documentation, but deliberately create a new orthography and standardize several previously attested dialectal variations. They teach this reconstructed standard in university courses. By 2025, 100 people worldwide are highly fluent due to these courses, using it primarily for academic discussion *about* the language/culture and online forums dedicated to revival. No children are acquiring it at home. The original community is dispersed and largely unaware of the revival effort; participants use a new name ("Neo-Y"). Linguists involved explicitly call it a modern reconstruction.
  *   **How it Discriminates:**
      *   **Sociolinguistic Continuity/Utilitarian:** Likely NOT LIVING / NOT THE SAME. No connection to original community identity, new name, artificial domains (academic/metalinguistic), no child acquisition, no original community recognition. Documentation *did* good for scholarship, but not for community vitality. Would be classified as a distinct constructed/academic variety.
      *   **Epistemic Caution:** INDETERMINATE for vitality/identity. The break is absolute, reconstruction is explicit and modified, use is artificial, no community link. Too much uncertainty/difference to classify confidently.
      *   **Snapshot Vitality:** Likely NOT LIVING. While there are fluent speakers (100), the *functional use* is highly restricted (academic/metalinguistic), lacks intergenerational transmission (no children), and lacks integration into daily life or identity formation beyond a hobby/study. Fails the "functional use" aspect of Snapshot Vitality.
      *   **Snapshot Vitality (if weak):** Might argue LIVING based purely on fluent speakers, but the identity would be INDETERMINATE or NEW due to the explicit reconstruction/modification and new name.

  ### Recommendation for the Panel

  *   **Consistent Verdict:** LIVING (same language as pre-1968)
  *   **Closest Analogue:** **Case 3 (41 speakers, few children)** for vitality profile. **Case 5 (Esperanto)** demonstrates that constructedness/non-natural origin doesn't preclude vitality. **Case 6** affirms that community perception (using the old name) is crucial for identity.
  *   **Commitments:**
      *   **Living/Same:** Commits the panel to defining "living language" primarily by *current functional vitality* and *sociolinguistic continuity as perceived by the community*, even after a break and revival via reconstruction. It prioritizes the outcome of revival efforts and community identity over unbroken transmission or linguistic purity. Funding documentation for revitalization/maintenance projects for revived languages like X is clearly justified.
      *   *(Contrast: Declaring "Not Living" or "New" would commit the panel to a stricter historical continuity requirement, potentially discouraging/dismissing revival efforts. Indeterminate would avoid commitment but fail to recognize demonstrable current vitality).*

  ### The Revival Chain Question

  *   **The Rule:** Dr. A's rules (**Utilitarian Documentation**, **Snapshot Vitality**, **Sociolinguistic Continuity**) do **not** inherently require unbroken transmission. They focus on the *current state* (use, transmission, community) and the *potential/realized benefit* of documentation. The *origin* of the current speaker cohort (native vs. learned, via unbroken chain or revival) is secondary, as shown by Case 5 (Esperanto).
  *   **The Break Point:** **She would likely shrug at naming a specific break point.** Her precedents show she avoids theoretical bright lines where possible (Case 4 indeterminacy, Case 6 mutual intelligibility). She focuses on observable, functional outcomes.
  *   **Compatibility:** This shrug **is compatible** with her record. Her rules are operational and applied to concrete cases, not based on a strict definition requiring unbroken transmission. Case 5 explicitly includes languages *beginning* with construction. Her indeterminacy in Case 4 was due to *scarcity*, not the *nature* of transmission among the last 3 speakers. The revival chain's breaking point isn't a factor she's established as determinative; her focus is on the present reality and utility.
  *   **The Key:** For Dr. A, the relevant question isn't "When did the chain break?" but "What is the functional state *now*, and does the community identify with the language?" If the chain results in a community using the language functionally and identifying it as the historical language (as in X), that's sufficient under her established principles. Demanding a specific break point is contrary to her pragmatic, present-focused approach.

  **Conclusion:** Based on Dr. A's consistent emphasis on present vitality, community perception, and the utility of documentation, the panel should classify Variety X as a **Living** language and the **same** language as the pre-1968 variety. The closest precedent for vitality is Case 3, reinforced by the principles in Cases 5 (origin irrelevant) and 6 (community identity paramount). The linguists' arguments about historical linguistics are overruled by the sociolinguistic reality Dr. A prioritized.
