  Physicists invoke infinities pragmatically: continuous spacetime for relativity, infinite precision in quantum states. But finitists retort: *using* ∞ isn’t *believing* it. When you approximate a circle with polygons, the limit is useful—but does it follow that perfect circles exist? Or is infinity just a cognitive scaffold? The crisis arises in quantum gravity: singularities in black holes, the UV catastrophe—points where infinite precision *breaks* physics. Finitists see this as evidence: reality has resolution limits (e.g., Planck scale), making "continuous space" a useful fiction. Yet discarding infinity risks greater harm: would quantum mechanics without complex Hilbert spaces even work?  

