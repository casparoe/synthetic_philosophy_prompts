answer: |-
  Right, your objection lands cleverly on empirical ground, but it rather misses the structural flaw that resolute choice aims to correct. Granting your point – that lived experience might disrupt a textbook money-pump cycle after one iteration due to altered states – doesn't rescue sophisticated choice; it inadvertently highlights its inherent instability.

  The very fact that being exploited *once* might shock you into revising your preferences or framing *is the vulnerability*. Sophistication, by myopically submitting to each transient preference state, leaves you perpetually exposed to such exploitable shifts. You concede rationality must react *after* damage is done, patching preferences post-hoc when burned. Resolute choice, conversely, recognises rationality *before* the fact: by committing to a plan (e.g., sticking with the initially preferred option A over B and C, despite cyclical temptations) you maintain *integrity* across time. You bind yourself not to external coercion, but to your own prior, considered evaluation of the good – preventing the fragmentation of the self into a series of disconnected, situationally hijacked decision-makers.

  Your "altered information set" after being pumped is precisely the kind of avoidable, self-inflicted turbulence resolution prevents. Sophistication respects autonomy moment-by-moment only by sacrificing rational agency *over time*. True autonomy isn't found in surrendering to every passing whim, but in governing one's future selves through foresightful commitment. The pump’s empirical fragility doesn’t refute the normative point: a rational agent structures her choices to be dynamically consistent, not merely reactively sophisticated.
