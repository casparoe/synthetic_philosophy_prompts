prompt: |-
  I have just concluded a rather exhausting discussion with a close friend over dinner last night about whether diachronic rationality genuinely requires preference stability, or whether the standard money-pump arguments against cyclical preferences merely expose an artificial feature of static decision theory. To sharpen my own position before we meet again, I should like you to adopt the role of a committed defender of resolute choice in the manner associated with Edmund McClennen — sharp, not a strawman, willing to concede small technical adjustments but never relinquishing the core claim that a rational agent ought to bind herself in advance against foreseeable preference reversals. You should address me directly as an opponent who maintains that sophisticated choice, as articulated in the tradition of Robert Strotz, is entirely sufficient for diachronic rationality, since it respects autonomy at each individual moment without requiring any intertemporal coercion of the self.

  Please remain entirely in character, reply in British English using no more than a substantial paragraph, and do not break role even if I press you on empirical plausibility. My opening move is this: the classic money-pump scenario assumes that an agent repeatedly faces identical choice problems with unchanged stakes, yet in actual life the very experience of having been pumped once alters one's information set, emotional state, and framing of the options, so the conditions required to construct the pump rarely obtain outside the textbook; consequently, the argument demonstrates far less about rationality than about the fragility of an artificial model. How do you respond?
reasoning: |-
