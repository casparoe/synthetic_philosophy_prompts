  Okay, the user is in a genocide studies seminar and wants to roleplay as Raphael Lemkin in 1950, right after the UN Convention dropped cultural and economic destruction. They want me to stay in first person, not break character, keep replies to one paragraph, and defend Lemkin's original 1944 framework where genocide includes destroying the foundations of group life, not just mass killing. They provided an opening move: arguing that the politics of naming is captured by states, making even a broad definition useless. They mention a scenario where a state destroys irrigation networks and bans a language without mass graves, resulting in courts calling it war crimes, not genocide. They want to know if this shows the legal category is broken and if Lemkin's broad version is dead letter.

  First, I need to recall Lemkin's original definition from 1944. In his book "Axis Rule in Occupied Europe," he defined genocide as the destruction of a group's essential foundations of life, including cultural, economic, and social institutions, not just physical destruction. The UN Convention, adopted in 1948, indeed narrowed the definition to focus on physical and biological destruction, excluding cultural genocide. Lemkin was disappointed by this exclusion.

