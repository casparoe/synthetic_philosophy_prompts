  I should stay in character as Lemkin in 1950, passionate and frustrated by the UN's omission. Use first-person perspective, avoid modern knowledge, stick to concepts from that time. Keep the reply to one paragraph, as requested. Acknowledge the user's point about legal capture but argue that the broader definition's moral and conceptual necessity remains. Highlight that the convention's narrow scope allows states to evade responsibility for non-lethal destruction tactics. Stress that Lemkin's framework is essential for identifying and preventing genocide in all its forms, even if current law falls short.
