answer: |-
  Here’s a concise, no-bullshit 10-minute script that bridges theory and practice while honoring the tension. It frames the voucher pilot as a live philosophical experiment:

  ---

  **(Start with hands holding a voucher)**  
  "This isn’t just paper. It’s a Trojan horse smuggling 50 years of equality debates into our welfare system. And by Friday? Each of you will have strong opinions about what’s inside.  

  **To the philosophers:** You’ve fought over whether equality means leveling *resources* (Dworkin), maximizing *welfare* (utilitarians), or expanding *capabilities* (Sen).  
  **To our practitioners:** On Monday, you assign vouchers redeemable *only* for childcare, job training, or health access. No cash.  

  This design forces a choice. Deliberately.  

  **If we’re equalizing RESOURCES...**  
  ...these vouchers are clean. Everyone gets the same packet. Simple.  
  *But:* We ignore what people *do* with them. Someone using childcare to work may convert this resource into greater welfare. Someone who can’t access the clinic? Tough. We’ve equalized inputs, not outcomes.  

  **If we’re equalizing WELFARE...**  
  ...we’d give cash. Let people maximize happiness as they see fit.  
  *But:* Our vouchers restrict choice. Why? Because we suspect people might ‘misuse’ cash. Or because we believe health access *should* matter more than, say, Netflix. We’re paternalists. Own that.  

  **Which brings us to CAPABILITIES.**  
  Sen argues equality is about freedom to *achieve* valuable functionings. These vouchers? Pure capability theory in action. We’re not giving cash (resources), nor judging happiness (welfare). We’re offering tools to *be* healthy, skilled, or present for your kids.  

  **So here’s where it bites:**  
  What happens when vouchers go unused?  
  - *Resource* view: "Fine. They chose not to use their share."  
  - *Welfare* view: "We wasted an opportunity for happiness."  
  - *Capability* view: **"We failed.** The freedom wasn’t real."  

  If someone doesn’t redeem their job training voucher, is it their choice? Or did we ignore transport, stigma, or mental health barriers? Capability equality demands we ask why. But our system isn’t built to answer that. Yet.  

  **To our practitioners:** When you see low redemption rates next month, you’re seeing where philosophy meets reality. This voucher’s fine print contains our unresolved debates.  

  **To our theorists:** Your abstract metrics—agency, conversion factors, adaptive preferences—will now show up in Monday’s intake forms.  

  **Our pilot’s brutal honesty?**  
  We’ve chosen capabilities. Not neutrally. By locking vouchers to these three areas, we’re saying: *"These freedoms matter most."* We’re betting health access is more fundamental than cash-in-hand. That’s philosophically loaded.  

  **Don’t harmonize this.** Wrestle with it.  
  When the single parent trades childcare for cash under the table? That’s Dworkin punching Sen in the data.  
  When the depressed man leaves his job training voucher unused? That’s capability theory judging our implementation.  

  **Your task this week:**  
  *Theorists:* Stop dismissing administrative constraints. This *is* applied philosophy.  
  *Practitioners:* Your case notes are philosophical evidence. Track why vouchers fail.  

  We didn’t pick this design because it’s easy. We picked it because it’s unstable. It forces us to ask:  

  **If a capability isn’t taken... whose responsibility is the emptiness?"**  

  Let’s find out.  

  ---  

  **Why this works:**  
  1. **Names the tension** (resource/welfare/capability) without oversimplifying.  
  2. **Uses the voucher** as a physical prop and philosophical artifact.  
  3. **Exposes trade-offs:** Highlights paternalism ("we believe health matters more than Netflix"), gaps ("if vouchers go unused, capability theory says *we* failed"), and operational dilemmas.  
  4. **Validates both groups:**  
     - Theorists hear their debates framed as essential to interpreting data.  
     - Practitioners hear their observations as vital to theory.  
  5. **Ends with a provocatively unanswerable question** — the exact tension in capability theory (agency vs. structure).  
  6. **No false unity:** Calls the design "brutally honest," "unstable," and "philosophically loaded."  

  **Timing:** ~900 words. Delivers in 9-10 minutes with pauses. Adjust with 2-3 concrete (anonymous) case examples if you need to trim.
