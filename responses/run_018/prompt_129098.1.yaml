prompt: |-
  I'm prepping a 90-minute session for my historiography seminar — second years who've read a bit of Carr and think presentism just means "judging the past by our morals." I want them to see it's deeper: that our categories (like "economy" or "trauma") and even our evidentiary instincts are loaded. Plan the teaching arc, not the lecture itself. What's the dependency chain — which distinction has to land before the others? Pick one carrying case that shows both moral and conceptual presentism at once, and say why the usual "slaveholders were bad actually" example fails to carry the conceptual part. Map the misconceptions they'll form in order — I'm guessing "all presentism is avoidable if you're nice," then "if categories are historical then we can't compare anything" — and tell me exactly where in the sequence to block each. Give me one check at the end that proves they've grasped the problem rather than just parroted "context matters." Also say what part of this debate — maybe the stronger constructivist claim that archives themselves are presentist — I should explicitly leave out for this level and admit I'm leaving out. Start with the bottom-line teaching sequence and the carrying example, then the misconception map, then the check. No preamble, don't restate my prompt. Also please seperate moral presentism from conceptual presentism clearly in your plan.
reasoning: |-
  Okay, the user is prepping a 90-minute historiography seminar for second-year students who've read Carr and have a shallow understanding of presentism—thinking it only means judging the past by modern morals. They want to deepen this by showing how conceptual categories like "economy" or "trauma" are also presentist, and how even evidentiary instincts are loaded. The plan needs a teaching arc with dependencies, a case study that shows both moral and conceptual presentism, and why the typical "slaveholders were bad" example fails for conceptual presentism. Also, they want a misconception map and a check for understanding.

  First, I need to outline a clear sequence. Start with defining presentism broadly, then separate moral vs. conceptual. Use an example that illustrates both. The carrying case should be something where modern concepts don't map neatly onto the past. Witch trials come to mind—modern views might see them as irrational or superstitious, but historically, they were part of a coherent belief system. That addresses both moral judgment (condemning persecutors) and conceptual issues (applying modern psychology or legal standards).

  Next, the dependency chain. Students need to grasp the basic definition before distinguishing moral from conceptual. Then, they need to see how conceptual categories affect analysis before discussing evidence. So sequence: 1) Define presentism, 2) Separate moral vs. conceptual, 3) Case study showing both, 4) Discuss evidentiary instincts, 5) Address misconceptions.

  For misconceptions, the user mentioned two: thinking presentism is avoidable by being nice, and that if categories are historical, comparison is impossible. These should be blocked at specific points. The first misconception can be addressed when defining conceptual presentism—emphasize it's not about intent but inherent in language and concepts. The second when discussing evidence—show that comparison is possible but requires awareness of anachronism.

  The end check should go beyond "context matters." Maybe a hypothetical scenario where students have to critique a historian's use of a modern concept in an ancient context. For example, applying "class struggle" to medieval serfs without acknowledging feudal structures.

  The user also wants to know what to leave out. Strong constructivist claims about archives being inherently presentist might be too advanced. Students need to grasp basic conceptual presentism first. Mentioning that archives are curated and thus reflect present concerns could be a bridge but not delve deep.

  Now, structuring the response as per instructions: start with teaching sequence and carrying example, then misconception map, then the check. No preamble. Clearly separate moral and conceptual presentism.

  Carrying example: Salem Witch Trials. Moral presentism: judging the accusers as irrational or evil. Conceptual: applying modern psychology (mass hysteria) instead of understanding contemporary beliefs in witchcraft and community dynamics. This shows both layers effectively.

  Why "slaveholders were bad" fails for conceptual: It only addresses moral judgment without tackling how concepts like "economy" or "property" are anachronistic in their modern forms. It doesn't challenge the categories used to analyze the past.

  Finally, the end check: a short written response where students identify both moral and conceptual presentism in a sample paragraph. This ensures they can distinguish and apply the concepts, not just parrot phrases.
answer: |-
  **Teaching Sequence & Case Example**  
  *(70 min core + 15 min buffer/discussion)*  

  1. **Define Presentism Broadly (10 min)**  
     - Quick recap of Carr’s "judging past by present morals" → **Explicitly split into two axes**:  
       - **Moral Presentism**: Applying *current ethical standards* to historical actors (e.g., "Medieval people were sexist").  
       - **Conceptual Presentism**: Imposing *modern analytical categories* onto the past (e.g., calling a Roman *latifundium* a "capitalist enterprise").  

  2. **Case Study: Salem Witch Trials (25 min)**  
     - **Moral Layer**: Students critique condemning Puritans as "irrational bigots" (ignoring their theocratic worldview where witchcraft = tangible threat to community salvation).  
     - **Conceptual Layer**: **Pivot deeper**: Why calling accusers "hysterical" or victims "mentally ill" is presentist.  
       - *Modern concept*: "Mass hysteria" assumes psychological frameworks (Freud, DSM) alien to 1692.  
       - *Historical reality*: Accusers framed actions through covenant theology, property disputes, and gendered sin—**not pathology**.  
       - **Key move**: Show how "trauma" (their buzzword) as a clinical term distorts when applied pre-psychology.  
     - **Why slaveholder example fails conceptually**: It only triggers moral outrage (easy) but doesn’t challenge *categories* like "economy" (e.g., treating slavery as purely "market-driven" ignores its embeddedness in honor culture/kinship).  

  3. **Evidentiary Instincts (15 min)**  
     - How conceptual presentism shapes what we *see as evidence*:  
       - Example: Assuming pre-modern "grain riots" were "economic protests" (modern lens) vs. moral economy breaches (E.P. Thompson’s point).  
     - Dependency: Must grasp conceptual presentism *before* this step.  

  4. **Mitigating (Not Eliminating) Presentism (15 min)**  
     - Stress: Presentism is *unavoidable* but manageable via historicization of categories.  

  ---

  **Misconception Map & Blocking Points**  

  1. **Misconception**: "All presentism is avoidable by being ‘neutral’ or ‘nice’ to the past."  
     - **Block at Step 2 (Case Study)**: Contrast moral vs. conceptual. Show Puritan "niceness" (understanding their motives) *still* fails if we label events with modern psychology.  

  2. **Misconception**: "If categories are historical constructs, we can’t compare societies or make generalizations."  
     - **Block at Step 4 (Mitigation)**: Argue comparison *requires* explicit historicization (e.g., "Compare how Romans and Victorians conceptualized ‘family’—don’t assume sameness").  

  ---

  **End Check for Depth (5 min)**  
  **Prompt**: *"A historian writes: ‘Athenian democracy failed because it excluded women and slaves—proof it wasn’t truly democratic.’ Identify:*  
  - *(a) Moral presentism (what standard is applied?)*  
  - *(b) Conceptual presentism (what modern category is anachronistic?)*  
  - *(c) How reframing avoids distortion (what Athenian concept of dēmokratia actually meant?)*"  

  **Why it works**: Forces distinction between moral judgment (a) and category error (b). (c) proves they can historicize rather than default to "context matters."  

  ---

  **What to Explicitly Omit**  
  **The constructivist bomb**: *"Archives are presentist constructs reflecting power."*  
  - **Why omit**: Requires grappling with Foucault/Derrida *after* mastering baseline historicization. Say: *"We’re bracketing how archives shape evidence—focus today is on the historian’s analytical toolkit."*  

  **Sequence Flow**:  
  Definition → Moral/Conceptual Split → Case Study (Salem) → Evidence → Mitigation → Misconception Busting → Assessment.  
  **Pacing Note**: Steps 1–2 are the hinge—sacrifice discussion time elsewhere if needed.
