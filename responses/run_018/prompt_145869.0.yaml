  First, I need to unpack the core issue: the tension between formal authority and actual practice. In democratic theory, popular sovereignty means the people are the ultimate source of power. But in constitutional monarchies, the monarch's retained powers, even if unused, exist on paper. The user is concerned whether this dormant power creates a conceptual problem.

  The Scandinavian model is key here. Countries like Sweden and Norway have monarchs who haven't vetoed legislation in decades. The powers exist constitutionally but are politically dead. The user wants to avoid the usual UK comparison, so focusing on Scandinavia is essential. They also mention Japan, where the emperor's role is tied to Shinto, adding a religious dimension.

  I should start by defining popular sovereignty and how it's typically operationalized through constitutions and democratic processes. Then, examine how constitutional monarchies fit into this. The dormant power issue is central: does the mere existence of unused royal powers contradict popular sovereignty? 

  One angle is symbolic vs. practical power. If the monarch's powers are never used and their exercise would cause a constitutional crisis, maybe they're effectively null. But formally, they're still there. This creates a discrepancy between the legal framework and political reality. Theorists like Walter Bagehot discussed the dignified vs. efficient parts of the constitution. The monarch is dignified (symbolic), while elected officials are efficient (functional). But the dormant powers are part of the dignified role, yet legally present.

  Another point: constitutional amendments. In some countries, changing the constitution to remove the monarch's powers might be difficult or require referendums. If the people can't easily abolish these powers, does that limit their sovereignty? However, in practice, if the people support the monarchy, it could be seen as an expression of their will. But then, what if public opinion shifts? The dormant powers could theoretically be activated, which contradicts popular sovereignty.

  The Japanese case adds complexity because the emperor's role is tied to Shinto, blending religion with the state. This sacral dimension might make the monarchy's authority more deeply embedded culturally, even if legally dormant. Here, the legitimacy isn't just political but also spiritual, which might create a different kind of tension with popular sovereignty, where legitimacy comes from the people, not divine or religious sources.

  The user also wants conceptual tension unique to constitutional monarchies vs. republican systems. In republics, the head of state is usually elected or appointed by elected bodies, so no formal authority lies outside the people's representatives. The dormant powers in monarchies introduce a theoretical exception that republics don't have. Even if unused, they represent a non-popular source of authority, which conceptually challenges the idea that all power derives from the people.

  The implications for democratic theory include the need to reconcile legal formalism with political reality. If a constitution claims popular sovereignty but retains royal prerogatives, it's internally inconsistent. However, democratic practice might render those prerogatives obsolete. But this relies on political norms rather than legal provisions, which can be fragile. For example, in a crisis, could a monarch intervene? This possibility, even if remote, suggests that sovereignty isn't entirely with the people.

  In conclusion, the dormant powers create a real tension because they represent a legal authority separate from the people, dormant but not extinct. This contrasts with republics where all authority is delegated from the people. The religious aspect in Japan heightens this by adding a non-secular source of legitimacy. The key takeaway is that while politically inert, these powers challenge the purity of popular sovereignty in theory, highlighting the gap between legal structures and democratic ideals.
answer: |-
  Here's a conceptual breakdown of the implications of Scandinavian-style constitutional monarchy for theories of popular sovereignty, focusing on the "dormant power" tension:

  **Core Tension:** The existence of formally unexercised (but constitutionally present) monarchical powers creates a **latent conceptual dissonance** with the principle that sovereignty resides *solely and unconditionally* with the people ("popular sovereignty").

  ### Key Implications & Conceptual Challenges

  1.  **The "Sleeping Authority" Problem & Popular Sovereignty's Purity:**
      *   **Formal vs. Effective Sovereignty:** Popular sovereignty requires that *all* legitimate political authority derives from the people and is exercised *only* by their representatives or direct will. Dormant monarchical powers (e.g., theoretical veto, dissolution, appointment) represent a **formal reservation of authority outside this chain.** Even if unused for decades, their constitutional existence means ultimate authority isn't *exclusively* located in the popular will or its institutions *on paper*.
      *   **A Conceptual "But...":** It introduces a permanent asterisk to the claim "the people are sovereign." The statement becomes: "The people are sovereign... *except* for these specific, constitutionally enshrined powers formally vested elsewhere, which we all agree won't be used (probably)." This weakens the *absolutist* claim of popular sovereignty.

  2.  **Democratic Legitimacy Reliant on Self-Limitation:**
      *   **Power Based on Forbearance, Not Right:** The legitimacy of the democratic system relies critically on the monarch's *continual, voluntary decision not to exercise* their formal powers. This makes democratic functioning partially contingent on the **self-restraint of an unelected, non-popularly accountable institution.** Popular sovereignty's stability depends on an actor *external* to its own logic choosing not to act.
      *   **The Fragility of Convention:** While political conventions are strong, their power rests on acceptance, not law. The dormant power highlights that the *complete* realization of popular sovereignty is secured by **extra-constitutional norms**, not the constitution itself. This creates a vulnerability absent in republics where all formal authority is explicitly delegated from the people.

  3.  **The "Revocability" Test & Popular Will:**
      *   **Can the People Fully Reclaim Sovereignty?** A strict view of popular sovereignty implies the people can, through established constitutional processes, alter *any* aspect of the political order. However, abolishing the monarchy or stripping its dormant powers often faces higher barriers (e.g., supermajorities, referendums) than ordinary legislation, or is politically unthinkable.
      *   **The Monarch as a Constitutional "Fixed Point":** The dormant powers are tethered to an institution (monarchy) the people cannot easily remove or fundamentally alter via standard democratic procedures. This positions the monarchy as a **constitutional fixture partially insulated from direct popular revocation**, subtly contradicting the idea that the people are the *unconditional* source of all constitutional authority.

  4.  **Symbolic Weight vs. Democratic Foundation:**
      *   **Symbol Reinforcing Non-Popular Authority:** While the monarch acts as a unifying national symbol, the *source* of their symbolic power often stems from tradition, heredity, and (historically) divine right, *not* popular mandate. The constitutionally enshrined (though dormant) powers reinforce this **non-popular source of legitimacy** symbolically, even if not practically. This creates a parallel, albeit weaker, source of legitimacy alongside popular sovereignty.
      *   **Implicit Hierarchy:** The formal structure suggests a hierarchy where the Monarch, as Head of State, represents the enduring state itself, *above* the transient government derived from popular elections. This subtly frames the popular will as operating *within* a monarchical framework, rather than being the sole foundation.

  ### The Japanese Complication (Religious-Symbolic Dimension)

  The Japanese Emperor significantly intensifies the conceptual tension:

  1.  **Sacral Sovereignty vs. Popular Sovereignty:** The Emperor's role as "symbol of the State and of the unity of the People" (Constitution) is deeply intertwined with Shinto and the concept of his divine descent (even if officially renounced post-WWII). This injects a **sacral or transcendental source of legitimacy** fundamentally alien to secular popular sovereignty.
  2.  **Dormant Power with Deeper Roots:** While possessing no governmental powers, the Emperor's authority as the highest Shinto priest and the symbolic heart of Japanese identity creates a **non-popular, cultural-spiritual foundation** for the state that exists alongside and potentially *overshadows* the democratic constitution in terms of cultural legitimacy. The "dormancy" here isn't just political forbearance; it's a constitutional separation from governance that *cannot* erase the profound cultural and religious significance attaching sovereignty to the Imperial line itself.
  3.  **The People as "The People" Defined by the Symbol:** The unity the Emperor symbolizes often implicitly defines "the People" (as Japanese) in a way rooted in shared history and mythos centered on the Imperial institution. This subtly suggests that "the People" derive their collective identity *from* the monarchy, rather than the monarchy deriving its legitimacy *from* the People. This inverts the core logic of popular sovereignty.

  ### Conclusion: Harmless Residue or Real Tension?

  It's **more than just harmless symbolic residue**. While politically inert, dormant monarchical powers create a genuine conceptual tension for democratic theory:

  *   They represent a **formal, legal reservation of authority** not derived from the people.
  *   Democratic stability relies on **non-democratic forbearance**.
  *   They introduce a **constitutional fixture partially insulated** from straightforward popular revocation.
  *   They symbolize a **source of legitimacy (tradition, heredity, sometimes sacral)** competing with popular mandate.

  The Scandinavian model minimizes the *practical* impact but maximizes the *conceptual clarity* of this tension precisely because the monarchy is so purely symbolic and the dormant powers so obviously vestigial. The Japanese case amplifies the tension by grounding the symbolic role in a deep, non-secular cultural-spiritual foundation that conceptually precedes and defines the democratic "People."

  **In essence:** Constitutional monarchy with dormant powers introduces a **permanent conceptual "anomaly"** within a framework of popular sovereignty. It demonstrates that stable liberal democracy can coexist with this anomaly, but it cannot make the anomaly theoretically disappear. It forces democratic theory to acknowledge that legitimacy can be layered (popular + traditional/sacral) and that the *formal* location of ultimate authority might not be perfectly aligned with its *effective* location or the source of foundational legitimacy. This tension is unique to systems retaining such formal non-popular authority structures, unlike republican systems where all formal authority is explicitly delegated from the people.
