answer: |-
  ### 1. Essay Question  
  **Prompt:**  
  "Evaluate whether the 'individuation regress' poses a fatal objection to ontic structural realism (OSR). First, articulate this regress: explain why OSR’s elimination of individual objects in favour of pure relations risks either (i) covertly reinstating objects as structural nodes or (ii) demanding self-individuating relations that collapse into a modal-structuralism requiring further justification. Second, clarify how this challenge differs from Newman’s objection to structuralism. Third, argue whether epistemic structural realism (ESR) genuinely resolves the regress or merely avoids ontological commitment through empiricist caution. Finally, defend a position: does OSR survive this regress (e.g., via a coherent account of structural nodes or modal foundations), or is structural realism ultimately untenable as a response to theory change? Avoid reciting textbook distinctions; engage the ontological dilemma directly."  

  ---

  ### 2. Model Answer (798 words)  
  The individuation regress threatens ontic structural realism (OSR) by exposing an ontological vacuum in its core claim that relations exhaust reality. If OSR dissolves objects into pure relations, two problems emerge. First, relations logically require relata—entities between which relations hold. If OSR denies intrinsic relata, it must posit *structural nodes*: bare points in a relational network. Yet these nodes function as thinly veiled objects, inviting a regress. If nodes lack intrinsic properties, how are they individuated? Only through further relations to other nodes, which themselves require relata, ad infinitum. Second, OSR might assert relations are self-subsistent, individuated by modal profiles (e.g., causal roles). But this reduces OSR to an unargued modal structuralism, where relations exist necessarily and independently—a weighty metaphysical commitment OSR initially sought to avoid.  

  This regress differs fundamentally from Newman’s objection. Newman targeted *epistemic* structuralism (e.g., Russell’s), arguing that any set of relations can model observational data if the domain is arbitrarily re-mapped, rendering structural knowledge trivial. Newman’s concern is epistemological: without constraints, structure fails to capture mind-independent truth. The individuation regress, conversely, is ontological: it questions whether relations *can exist* without relata, irrespective of epistemology. Even if OSR avoids Newman’s triviality (e.g., via physics’ unique causal structures), it still confronts the incoherence of relations lacking bearers.  

  Epistemic structural realism (ESR) appears to sidestep this by retreating to agnosticism: we know only the *structure* of relations (e.g., mathematical equations), not the underlying ontology. Yet this does not resolve the regress—it abandons ontology altogether. ESR’s "structure" is a predictive instrument, not a description of reality. While Worrall’s ESR preserves continuity in equations across theory changes (e.g., Fresnel-to-Maxwell), it offers no account of *what instantiates* these structures. The individuation problem persists: if the world has no relational ontology, why do structures persist through theory change? ESR’s empiricism avoids ontological commitment but at the cost of severing structural continuity from mind-independent reality. Thus, it displaces—but does not dissolve—the regress.  

  OSR’s survival hinges on whether "structural nodes" are a principled solution or an ad hoc rescue. Ladyman and Ross defend nodes as *contextual relata*: nodes are individuated solely by their position in a relational whole (e.g., quantum spin states defined by symmetry groups). Here, nodes are not objects but "heuristic foci" for relations. This avoids regress if relations are ontologically prior: nodes emerge as secondary patterns, like eddies in a river. However, this demands that relations self-individuate through modal necessity. For example, in quantum field theory, particles are excitations of fields—structures individuated by irreducibly relational properties (e.g., quantum numbers). If such structures are fundamental and modal (e.g., governed by physical laws), nodes might avoid objecthood.  

  Yet this invites two criticisms. First, modal self-subsistence risks circularity: relations individuate nodes, but relations themselves require individuation. OSR must ground modality in concrete structures (e.g., spacetime) or accept primitive necessity—a return to Pythagorean ontology. Second, structural nodes may still smuggle in object-like persistence. If a node retains identity across contexts (e.g., an electron’s charge), it functions as an object; if not, it cannot explain theory continuity. Ladyman’s "real patterns" offer a compromise: nodes are minimally stable relational features. But their "minimal stability" presupposes a background ontology (e.g., quantum fields), undermining radical eliminativism.  

  Ultimately, OSR survives the regress only by embracing modal-structuralism. Relations must be fundamental, necessary, and self-differentiating—a position articulated by French and Ladyman’s "rainforest realism." Here, structures are concrete universals: relations individuate themselves through their unique causal-nomological roles, with nodes as derivative. This avoids regress by denying relations require pre-existing relata; instead, relata *are* relationally constituted. However, this demands a metaphysics where modality is primitive—a significant cost. If such a view coheres with physics (e.g., non-individuals in quantum mechanics), OSR may withstand the regress. If not, it collapses into either covert object-realism or ESR’s cautious empiricism.  

  The individuation regress is not fatal but transformative. OSR must abandon object-eliminativism for a moderate holism: structures include nodes as non-objectual relata, individuated contextually by the whole system. This retains structural continuity across theories but concedes that relations require *minimal bearers*. ESR, meanwhile, avoids ontology but cannot explain why structures persist in nature. Thus, OSR survives with amended commitments—yet its reliance on modal foundations leaves it vulnerable to simpler ontologies. Structural realism resolves theory change only if we accept an ontology of necessary relations.  

  ---

  ### 3. Marking Scheme (Total: 25 marks)  
  **Must-hit conceptual moves:**  

  1. **Articulate the individuation regress and contrast it with Newman’s objection** (7 marks)  
     - *Full marks:* Distinguishes Newman’s epistemic triviality (structural underdetermination) from the ontological regress (relations requiring relata). Explains why OSR’s eliminativism triggers a dilemma: nodes as covert objects or self-individuating relations.  
     - *Penalize:* Conflating Newman with the regress, or reducing the regress to "relations need things."  

  2. **Assess ESR’s capacity to resolve the regress** (6 marks)  
     - *Full marks:* Argues ESR’s epistemological retreat avoids ontology but abandons realism about relations’ mind-independent basis. Notes that ESR preserves predictive structures without solving what grounds them.  
     - *Penalize:* Claiming ESR "solves" the regress via empiricism without addressing ontological lingering.  

  3. **Evaluate structural nodes and modal self-subsistence** (7 marks)  
     - *Full marks:* Analyzes nodes as either ad hoc (disguised objects inviting regress) or principled (emergent from prior relations). Critiques modal self-individuation (e.g., necessity as ungrounded). Engages Ladyman/Ross’ contextual individuation.  
     - *Penalize:* Merely describing "nodes" without critiquing their coherence, or uncritically endorsing modal foundations.  

  4. **Defend a reasoned judgment on OSR’s viability** (5 marks)  
     - *Full marks:* Takes a stance (e.g., "OSR survives with modal commitments" or "collapses into object-realism") grounded in the prior analysis. Weights costs (e.g., primitive modality) against structuralism’s explanatory benefits for theory change.  
     - *Penalize:* Summarizing without original synthesis, or retreating to generic "OSR has strengths/weaknesses."  

  **Thresholds:**  
  - **Excellent (21–25):** All moves addressed with original argumentation; precise differentiation of regress vs. Newman; nuanced critique of modality/nodes.  
  - **Competent (15–20):** Hits all moves but with summary-like exposition; minor conflation or underdeveloped evaluation.  
  - **Passing (10–14):** Superficial treatment of ≥1 move (e.g., misstates regress, omits modality critique).  
  - **Fail (<10):** Fails to distinguish regress from Newman; treats ESR as ontologically robust; ignores nodes/modality.  

  ---  
  This assessment targets philosophical rigor over recapitulation, requiring students to wrestle with OSR’s deepest ontological tension while positioning structural realism within broader scientific realism debates.
