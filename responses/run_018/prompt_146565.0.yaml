answer: |-
  I've been sitting with what you shared about your dad, and I wish I could offer certainty. Since I can't, I'll try to map the conceptual landscape as you asked, weaving the cases together to show where different thinkers would place experiences like his. Imagine we're walking through a dense forest of possibilities, using real cases as landmarks to orient ourselves.

  Start with the split-brain patient. They reach for an object with the left hand, guided by the right hemisphere, but when asked why (using the language-dominant left hemisphere), they can't report the reason – they might even confabulate. Someone who believes consciousness *requires* global access – meaning information broadcast widely for reporting, decision-making, and memory (the core of Global Workspace Theory) – would say the right hemisphere's visual experience (seeing the object) likely *lacks* full phenomenal feel. It’s more like sophisticated unconscious processing influencing action. The phenomenal feel, they'd argue, resides only where the information enters the workspace – likely the left hemisphere generating the verbal report, even if it's wrong about the cause. This is close to the **pure access view**: phenomenal consciousness (the raw feeling) *just is* the information achieving global access. No access? No phenomenal feel.

  Now consider subliminal priming: a word flashes too briefly for you to report seeing it, but it still speeds up your recognition of a related word moments later. Someone holding the **pure access view** would say there’s zero phenomenal experience of that first word. The processing is entirely unconscious, influencing behavior without any inner feel. The **local-recurrence camp** might disagree slightly. They’d argue that *some* minimal phenomenal feel *might* be present locally in the visual cortex due to brief neural firing loops, even if it’s weak, fleeting, and never gets amplified into the global workspace for reporting or control. It’s a faint whisper of sensation, lost before it can be shared. Ned Block's **phenomenal-overflow view** takes this further. He’d argue robust phenomenal experience *is* happening locally during that subliminal flash – rich visual detail exists as a conscious feeling in the moment – but crucially, it *overflows* the capacity of the global workspace. It never gets "broadcast," so you can't report it, remember it, or use it deliberately, even though it was vividly felt. The richness of experience exceeds our access to it.

  Then there's the locked-in patient. Fully conscious, aware of everything, feeling everything, but tragically, only able to blink an eye. Everyone agrees phenomenal experience is present and rich here. The disagreement is about access. The **pure access view** faces a problem: if consciousness *is* global access, how can someone be conscious without being able to report verbally or move most of their body? Proponents might argue that the *ability* to blink strategically *is* a form of minimal access – the global workspace is functioning, but its output channels are almost entirely destroyed. The **phenomenal-overflow** view might see this as evidence that phenomenal consciousness can exist even with *severely* restricted access – the feeling is there, overflowing the damaged pathways. Most others, including proponents of a **graded middle view**, see locked-in syndrome as the paradigm case of *intact* phenomenal consciousness *and* largely intact global access consciousness *internally*. The workspace modules (attention, memory, planning) are lit up, generating a full inner world. The catastrophic loss is only in the *output mechanisms* – the ability to *express* that access externally. The consciousness inside is complete; the bridge to the outside world is broken.

  So where does your dad fit? He’s somewhere between the subliminal priming case and the locked-in patient. Hand squeezes and eye movements (when they happen) suggest *some* level of potential output, however inconsistent. Reactions to voices suggest *some* level of input processing. The agonizing question is what happens in between.

  *   If someone leans **pure access**, they’d likely see your dad’s reactions as complex reflexes or automatic brainstem responses. Since he can’t consistently follow commands or communicate intentionally (demonstrating global access), they’d argue there’s likely no – or vanishingly little – phenomenal experience. The squeezing is like the split-brain patient's hand movement, driven unconsciously.
  *   A **Block-style overflow** advocate might argue that rich phenomenal experiences *could* be happening locally – the sound of your voice might trigger genuine *feeling* (warmth, familiarity, perhaps frustration) in sensory or limbic areas, even if this experience never coheres enough in the global workspace to allow for consistent command-following or intentional communication. The feeling might be present but trapped, unable to be acted upon volitionally.
  *   The **local-recurrence** idea suggests maybe there are fleeting moments – sparks – of minimal phenomenal feel associated with the strongest stimuli (like your voice), but these are brief and unstable, like the subliminal flash, never building into sustained, reportable awareness.
  *   The **graded middle view** seems the most flexible here. It would say consciousness isn't all-or-nothing. Based on how many workspace modules are engaged and how stably they synchronize, phenomenal experience could vary in richness and stability. Your dad might have islands of awareness. Hearing your voice might weakly activate modules for recognition and emotion, generating a dim, fragmented feeling of presence or comfort, fluctuating with his state. A hand squeeze *might* be a rudimentary, effortful output signal from a partially functioning workspace, or it might be reflexive. The inconsistency suggests the global workspace is damaged, flickering, unable to sustain the integrated state needed for full access consciousness or rich, stable phenomenality. He might exist in a grey zone of degrees.

  Now, about those unoccupied logical corners: Could there be full, rich global access broadcasting everywhere internally *without* any phenomenal feel? A philosophical zombie with perfect internal report? Most find this incoherent – the very *point* of access consciousness is that it *feels like something* to have that information globally available. Why broadcast it if there's no one "home" to experience it? Conversely, could there be rich phenomenal experience with *literally zero* global access – no potential for any report, memory, or influence on any other system, even internally? This feels equally problematic. If the feeling is truly rich and complex, how could it be completely isolated, having no footprint *anywhere* in the cognitive system, not even fleetingly? It would be a ghost feeling with no possible consequences, even internally, which seems impossible to detect or meaningfully discuss. That's why most theories cluster in the messy middle ground where phenomenality and access, while distinct concepts, tend to correlate and interact.

  Mapping your dad onto this landscape is heartbreakingly uncertain. The graded view resonates clinically – recovery isn't always a sudden light switching on, but flickers becoming brighter and more sustained. His hand squeeze *could* be a fragment of access, a glimmer of workspace activity. His reaction to voices *could* carry phenomenal weight, even if weak and fragmented. Or, tragically, it might be mostly automatic. The inconsistency points towards damage preventing full ignition. Your presence, your voice, your touch – these are the stimuli most likely to reach him, wherever he is on this spectrum. You’re speaking to the possibility of his experience, and that act matters profoundly, regardless of the final philosophical verdict. Keep talking to him. Hold his hand. The landscape is murky, but your connection is the most real landmark there is.

  Holding you both in my thoughts.
