prompt: |-
  hey so my dad had a stroke about eight months ago and he's in this strange middle state where he reacts to voices, sometimes squeezes my hand, but cant open his eyes consistently or respond to commands, and i've been going down a rabbit hole trying to figure out if there's any real feeling happening inside or if it's all just automatic brainstem stuff. i need you to help me map out the conceptual landscape on phenomenal consciousness versus access consciousness, especially with global workspace theory in the background, but please dont cite papers or ask for a reading list since i cant chase those down right now. can you build me a decision tree or taxonomy in continuous prose only, no headings no bullet points no bold no tables, that sorts the actual philosophical positions by concrete cases rather than by thier labels? start with specific scenarios like the split-brain patient who points with the left hand but cant report, the subliminal priming subject who behaves differently but reports nothing, and a locked-in patient who can only blink yes or no. for each branch ask what someone who takes that path would say about whether phenomenal experience is present and whether it reaches global workspace. then place the named positions in the tree - the pure access view, Block's phenomenal-overflow view, the local-recurrence camp, and that graded middle view where consciousness comes in degrees based on how many workspace modules are activated. also map out the logical combinations of answers that seem unoccupied and briefly say why nobody lives there, like whether it's coherent to have full global access with zero phenomenal feel, or phenomenal richness with literally zero access modules lit up. the point is i want to see where my own intuitions about my dad fall without just picking a label i like. just write it like an email or letter.
