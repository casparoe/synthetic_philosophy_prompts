answer: |-
  Right then. Let's map these assertion norms onto cryptographic verification concepts, noting where the fit is neat, where it strains, and where it simply doesn't hold water. We'll use British English throughout.

  ### 1. Norm of Knowledge (Assert only what you know)
  *   **Security Property/Protocol Analogue:** **Proof-of-Knowledge (PoK) Protocol.** An assertion is modelled as a prover (`P`) outputting a statement (`S`) to a verifier (`V`). The security property requires `P` to demonstrate possession of a specific "witness" (`w`) to `S` (e.g., evidence, justification, direct experience) *before* `S` is accepted as valid. `V` runs a verification algorithm on a proof `π` generated by `P` using `w`. Completeness holds if an honest `P` with `w` can convince `V`. Soundness holds if no cheating `P*` without `w` can produce a valid proof `π` for `S` with non-negligible probability. Can be zero-knowledge (ZK-PoK) if `π` reveals nothing about `w` beyond `S`.
  *   **What Maps Cleanly:** The core idea of requiring demonstrable *possession* of something specific (`w`) backing the statement (`S`) before acceptance. The formal verification step replacing informal justification. The requirement that the prover actually *has* the witness.
  *   **What is Distorted:** The nature of `w`. In crypto, `w` is a formal, mathematical object (e.g., discrete log, preimage). In epistemology, it's justification/evidence - often informal, contextual, defeasible. Crypto proofs are binary (valid/invalid), while justification is often graded. The "knowledge" itself is reduced to possession of a verifiable witness.
  *   **No Equivalent / Residue:** **The mental state of *knowing***. Crypto proves *possession* and *correctness* relative to a function (e.g., `f(w) = S`), not the internal cognitive state of the prover. **Justification (as a process of reasoning)** - the protocol checks *that* you have `w`, not *how* you reasoned to `S` from `w`. **Defeasibility** - crypto proofs are typically absolute within the model; knowledge claims are subject to future undermining evidence.
  *   **Residue Significance:** This primarily shows crypto's inability to model internal cognitive states and the nuanced, non-binary nature of justification. It doesn't inherently reveal a gap in the *philosophical norm*, but starkly highlights that the norm relies heavily on concepts crypto cannot capture (the mental state, the quality of reasoning). Crypto forces a formalisation of "knowledge" as witness possession + correctness.

  ### 2. Norm of Truth (Assert only what is true)
  *   **Security Property/Protocol Analogue:** **Verifiability / Correctness Property.** The assertion (`S`) is treated as a claim about an external state of affairs (modelled as a public dataset `D` or an oracle `O`). The security property requires that any accepted `S` must correctly describe `D` (or the output of `O`). This could be enforced by `V` checking `S` against `D` directly (if `D` is public), or via a proof (e.g., a succinct non-interactive argument of knowledge, SNARK) that `S` is consistent with a committed `D` (handled by a trusted setup or a blockchain). Soundness ensures a false `S` cannot be verified.
  *   **What Maps Cleanly:** The fundamental requirement that the *content* of the statement (`S`) corresponds accurately to an objective external reality (`D`). The role of verification against a reference (`D`/`O`). The idea that a false statement should be detectable/rejected.
  *   **What is Distorted:** The nature of "truth". Crypto requires a *formal, computable* model of the external state (`D`/`O`). Philosophical truth is often more abstract, context-dependent, and not always reducible to a finite dataset or deterministic oracle function. Crypto verifies *against a specific model*, not "Truth" with a capital T.
  *   **No Equivalent / Residue:** **The speaker's mental state or justification is utterly irrelevant.** Crypto only cares whether `S` matches `D`. **The *act* of asserting a falsehood** - crypto detects false *statements*, not the culpability or state of mind of the *asserter*. Proving truth doesn't require the asserter to "possess" the truth in any deep epistemic sense, just that their statement aligns with `D`.
  *   **Residue Significance:** This cleanly separates the truth of the *proposition* from any properties of the *speaker*. The residue (ignoring the speaker's state) highlights that the *philosophical norm* often carries an implicit expectation about the speaker's epistemic position (they *should* know it's true), which the crypto analogue completely lacks. The gap here is arguably in the *philosophical packaging* of the norm, not in crypto's limitations for modelling objective correctness itself.

  ### 3. Norm of Belief (Assert only what you believe)
  *   **Security Property/Protocol Analogue:** **Authenticated Sincerity Token (a strained Proof-of-Possession).** This is the messiest fit. Imagine `P` possesses a private key `sk_B` linked to their "belief state". Asserting `S` requires `P` to output `S` along with a signature `σ` on `S` using `sk_B`. `V` accepts `S` only if `σ` verifies under `P`'s known public key `pk_B`. The (flawed) security property is that a valid `σ` "proves" `P` "believes" `S`. Alternatively, think of it as a trivial ZK-PoK where the witness `w` *is* the belief itself, and the relation is `Believes(P, S) = true` – but this relation is uncomputable.
  *   **What Maps (Sort of) Cleanly:** The idea of linking the statement `S` uniquely to the speaker `P` in a way that signifies *their* endorsement of it. Signatures provide authenticity and non-repudiation.
  *   **What is Badly Distorted:** **Everything about belief.** Crypto signatures prove *intent to authenticate* `S` at the moment of signing, *not* an enduring internal state of belief. `P` can sign `S` while disbelieving it utterly (lying). The "token" (`σ`) is a cryptographic output, not a mental state. There's no functional equivalent for the *content* of the belief (`S`) needing justification or grounding; only the act of signing matters.
  *   **No Equivalent / Residue:** **The mental state of *belief* itself.** Crypto has **zero capacity** to model, verify, or enforce internal cognitive or doxastic states. **Sincerity** - signing proves deliberate authentication, not sincerity. **Justification for the belief** - utterly irrelevant to the signature validity. The very concept of a "private belief" is antithetical to public verification.
  *   **Residue Significance:** This overwhelmingly demonstrates that **cryptography is fundamentally the wrong tool** for modelling assertion norms based on internal mental states like belief or sincerity. The colossal residue – the *entire* mental component – isn't a gap in the philosophical theory *per se*; it simply reveals that belief is an internal, private phenomenon utterly outside the scope of cryptographic verification, which deals with public actions, proofs, and data. Trying to force it into crypto terms highlights the inherent unverifiability of belief states from the outside.

  ### Summary of Residue & Gaps
  *   **Knowledge:** Residue = Mental state of knowing, quality/process of justification, defeasibility. Highlights crypto's formal, possession-based reductionism vs. philosophy's mental/internal focus. Doesn't *reveal* a gap in the norm, but *exposes* its reliance on non-formalisable elements.
  *   **Truth:** Residue = Any requirement concerning the *speaker's* state (knowledge, belief, justification). Cleanly separates propositional truth from speaker attributes. Highlights that the philosophical norm often *implies* an epistemic condition on the speaker that is absent from the pure truth condition.
  *   **Belief:** Residue = **The entire concept of belief as a mental state, sincerity.** Utterly unmodellable. **Crypto is completely the wrong tool.** This starkly shows that norms based purely on internal sincerity are inherently unenforceable through external verification – a limitation of *enforcement*, not necessarily a flaw in the *norm itself*, but it does question the practicality of such a norm for regulating communication.
