  ### Diagnostic Taxonomy of Split-Brain Consciousness  

  **Question 1: After commissurotomy, does the patient retain a single conscious self experiencing disconnected streams of awareness, or house two distinct conscious selves?**  
  - **Option A**: One conscious self with bifurcated awareness (e.g., the same "I" experiences left and right visual fields separately).  
  - **Option B**: Two conscious selves (e.g., the left and right hemispheres each host an independent "I").  

  **Question 2 (if Option B): Do the two conscious selves exist continuously, or only when sensory input forces hemispheric isolation (e.g., during lab experiments)?**  
  - **Option B1**: Two selves exist continuously, even in everyday life.  
  - **Option B2**: Two selves emerge only during forced hemispheric isolation.  

  **Question 3: How does the patient's pre-surgery identity persist?**  
  - **Option A3/B3a**: Through *narrative continuity* (e.g., life story fragments cohere across hemispheres).  
  - **Option A3/B3b**: Through *functional overlap* (e.g., shared memories or emotions preserve identity).  
  - **Option A3/B3c**: Identity is *genuinely divided or lost* (e.g., the original person is replaced or fragmented).  

  **Question 4: What binds conscious experiences into a unified whole?**  
  - **Option 4a**: *Representational integration* (e.g., merging sights, sounds, and thoughts into one model of reality).  
  - **Option 4b**: *Functional synchrony* (e.g., real-time coordination of brain networks).  
  - **Option 4c**: *Mere spatiotemporal co-location* (e.g., shared biology in one body suffices).  

