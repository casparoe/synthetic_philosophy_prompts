  activity structure:

      Participants: 10 people, split into two teams: Team P (Predictors) and Team M (Mechanists)

      Rounds: 3 rounds of prediction.

      Each round consists of 5 time periods (t=1 to 5).

      Before round 1:
          - We give both teams the initial price at t=0 for round 1.
          - Team P: Told to use a linear model: P(t) = a + b*t. They choose a and b for the round and then predict for t=1 to 5.
          - Team M: Given 5 minutes to come up with a causal mechanism (story) about buyers and sellers that could explain price movements. Then they use that story to choose a and b for the linear model and predict.

      After they submit predictions, we reveal the true prices for the round (generated by P_true(t) = intercept + slope * t, with parameters for the round).

      Then round 2 and 3: same, except Team M can revise their story.

      True parameters:
          Round 1: intercept=10.0, slope=0.5 -> prices: 10.5,11.0,11.5,12.0,12.5
          Round 2: intercept=8.0, slope=1.0 -> 9.0,10.0,11.0,12.0,13.0
          Round 3: intercept=12.0, slope=0.3 -> 12.3,12.6,12.9,13.2,13.5

      Scoring:
          - Prediction points (both teams): For each round, average absolute error over 5 periods. Score = 100 - 20*(average error), so if average error is 0, score=100; if 1, score=80; etc.
          - Truth points (Team M only): Awarded by facilitator after each round for how ontologically truthful the mechanism is. We have a hidden truth: the true mechanism is central planning. So any story about buyers and sellers is false. 
            We will give: 
              0 points if the mechanism is about buyers and sellers.
              50 points if they mention central planning (but they won't).
            So typically 0.

      Then overall score for Team P: sum of prediction points over 3 rounds.
      Team M: sum of (prediction points + truth points) over 3 rounds.

      At the end, reveal the true mechanism.

      Debriefing mapping:
          - Round 1: Participants build and use their models. Team P uses a model they know is false (geometric or mathematical, not behavioral). Team M builds a mechanism they believe is true.
          - Rounds 2-3: They refine. Team P might change parameters freely. Team M might change their story but it remains false.
          - The scores: Team P will have high prediction points. Team M might also have high prediction points but low truth points, so their overall score might be lower.
          - The F-twist: Team P's wildly unrealistic model is predictively successful, and this success does not depend on the model's assumptions being true.

      What will go wrong the first time:
          - Team M might not understand how to turn their story into numbers. They might be confused about how to choose a and b.
          - The true mechanism being central planning might feel like a trick. Some might protest that it's unfair.
          - The linear model might not be obviously "false" in the sense of being unrealistic because many models use linear trends. We might need to emphasize that it's the lack of micro-foundations that makes it false.

      What the activity can't reproduce:
          - In Friedman's defense, the unrealistic assumptions are not just tolerated; they are essential for predictive success because they simplify. In this activity, the linear model is not essential; they could use other models. We are not showing that a more realistic model would be predictively worse. In fact, Team M could use the same linear model and predict just as well, but they get penalized on truth. So we are not showing that the false model is essential, only that it is sufficient and that truth-seeking can be costly in terms of truth points.

