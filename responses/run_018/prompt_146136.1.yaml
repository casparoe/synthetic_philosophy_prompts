  ### The F-Twist Workshop Activity: **Flatland Market**

  #### **Setup (5 min)**
  - Split into **Predictors** (5 people) and **Mechanists** (5 people).  
  - **Market Rules**:  
    - A single good (e.g., "blob") is traded over **3 rounds**.  
    - Each round has **5 time steps** (t=1–5).  
    - **True price generator** (facilitator’s secret):  
      - *Round 1*: `Price = 10 + 0.5 × t`  
      - *Round 2*: `Price = 8 + 1.0 × t`  
      - *Round 3*: `Price = 12 + 0.3 × t`  
  - **Teams’ Tasks**:  
    - **Predictors**: Use a **geometric model** (below) to forecast prices.  
      - *Rules*: "Prices are set by two lines: a *Buyer Line* (starts at `A`, moves up `B`/step) and a *Seller Line* (starts at `C`, moves down `D`/step). Price = midpoint where they meet."  
      - *Catch*: This is **explicitly false** (no human behavior).  
    - **Mechanists**: Propose a **human-behavior model** (e.g., "Sellers get impatient, buyers bid higher") and use it to predict prices.  

  #### **Rounds (45 min total; 15 min/round)**
  1. **Round 1**:  
     - Facilitator reveals starting price (t=0): **10.0**.  
     - Teams predict t=1–5.  
     - Predictors pick `A`, `B`, `C`, `D` (e.g., `A=10`, `B=0.5`, `C=12`, `D=0.5` → midpoint = `11` at t=1).  
     - Mechanists propose a story + predictions (e.g., "Buyers bid +0.5/step" → `10.5, 11.0, ...`).  
     - **True prices revealed**: `10.5, 11.0, 11.5, 12.0, 12.5`.  

  2. **Rounds 2 & 3**:  
     - New starting prices (t=0): **8.0** (Round 2), **12.0** (Round 3).  
     - Mechanists **refine their model** based on past rounds.  
     - Predictors **adjust `A`, `B`, `C`, `D`**.  

  #### **Scoring (No real money)**
  - **Predictors**: Score **prediction points** only.  
    - `100 - 20 × avg. absolute error` (e.g., error=0 → 100 pts).  
  - **Mechanists**: Score **prediction points** (same formula) + **truth points** (0–50/round).  
    - Truth points awarded by facilitator for "ontological plausibility" (e.g., "Your profit-maximizing sellers story: +40").  
  - **Winner**: Highest total points after Round 3.  

  #### **Debrief (25 min)**  
  Map rounds to F-twist:  
  - **Round 1**: Predictors use *false geometric rules* but match prices → "Unrealistic assumptions enable prediction."  
  - **Round 2**: Mechanists’ "true" story may *hurt* predictions (e.g., overfitting) → "Truth-seeking can impede accuracy."  
  - **Round 3**: Predictors win on accuracy; Mechanists win on truth → Friedman’s **decoupling of mechanism-truth from prediction**.  
  - **Settled**: Idealization is ubiquitous; unrealistic assumptions can be virtues.  
  - **Contested**: Does this apply beyond economics? Can explanation exist without truth?  

  #### **Predictable Problems & Limitations**  
  - **First-run issues**:  
    - Mechanists struggle to quantify stories → delays.  
    - Predictors fixate on "geometric meeting points" → initial high errors.  
    - Debrief debates: "Why trust a false model?"  
  - **What the activity *can’t* show** (verbalize this):  
    - Friedman’s point that unrealistic assumptions are **structurally necessary** (here, they’re sufficient but replaceable). Explain: "In complex systems, truth may be *too noisy*—false simplicity filters signal from noise."  

