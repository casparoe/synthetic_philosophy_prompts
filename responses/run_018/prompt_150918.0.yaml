answer: |-
  Here’s a concrete example illustrating the tension within Neurath’s framework when representing a counterfactual claim ("Reaction X *would not* have occurred without Catalyst C") using only static, universal pictograms:

  ### Scenario: Depicting Catalytic Dependence
  **Claim to Represent:**  
  *"The oxidation of ammonia to nitric oxide (4NH₃ + 5O₂ → 4NO + 6H₂O) would not occur without the platinum catalyst."*

  **Neurath-Style Pictorial Design:**  
  1. **Frame 1 (Actual Scenario):**  
     - Pictogram A: Flask containing NH₃ and O₂ molecules (simplified shapes: ⬤ for N, ⚪ for H, 🔴 for O).  
     - Pictogram B: Platinum catalyst (■ rectangle).  
     - Pictogram C: Reaction arrow (→) pointing to products (NO + H₂O).  

  2. **Frame 2 (Counterfactual Scenario):**  
     - Identical Flask (NH₃ + O₂).  
     - **Ghosted/Translucent Platinum Catalyst** (■ with dotted outline or reduced opacity).  
     - **Broken Reaction Arrow** (⇢ - - - ✗) ending in scattered NH₃/O₂ molecules.  

  ---

  ### Conceptual Tension & Hidden Commitments
  **The Problem:**  
  While intuitive to a scientifically literate viewer, the **ghosted catalyst + broken arrow** device implicitly relies on *unstated conventions of pictorial negation and causality* that violate Neurath’s core principles:

  1. **Smuggled Convention: "Ghosting = Absence + Counterfactuality"**  
     - The ghosted catalyst doesn’t merely denote *physical absence* (which could be shown by omitting it entirely). It signifies *"hypothetical absence in an imagined scenario."*  
     - Neurath’s system can depict **what is absent** (e.g., omitting the catalyst), but it cannot distinguish between **"absent in reality"** (fact) and **"absent in a hypothetical case"** (counterfactual) without importing a visual metaphor for modality.  

  2. **Broken Arrow = Causal Failure (Not Observational Failure)**  
     - The broken arrow implies not just *"no reaction observed"* but *"causal necessity"*: the catalyst’s absence *caused* non-reaction.  
     - A viewer unfamiliar with scientific causality might interpret the broken arrow as:  
       - *"The reaction is incomplete"* (e.g., some products formed),  
       - *"The reaction was interrupted"* (e.g., by external forces), or  
       - *"This is an alternative outcome"* (not a counterfactual).  

  3. **Collapse into Factuality if Simplified:**  
     - If we remove the ghosting and broken arrow (complying with strict Neurathian literalism), we could only show:  
       - **Frame 1:** Flask + Catalyst → Products (fact).  
       - **Frame 2:** Flask (no catalyst) + No Reaction (fact).  
     - This depicts *two factual scenarios*, not the counterfactual dependency. It fails to communicate *"the reaction in Frame 1 WOULD NOT have occurred under the conditions of Frame 2."*  

  4. **Forced Verbal Interpretation:**  
     To "read" the ghosted/broken-arrow as a counterfactual, the viewer must apply an unstated rule:  
     > *"When an element is shown as ghosted in a parallel frame, it represents a hypothetical removal, and a broken arrow indicates that the outcome is impossible under that hypothetical."*  
     - This rule depends on understanding **modal logic** (possibility/impossibility) and **causal inference** — both theoretical concepts Neurath aimed to avoid embedding in visuals.  

  ---

  ### Why This Violates Neurath’s Ideal (Beyond Design Difficulty)
  - **Universality Failure:** The meaning isn’t self-evident across cultures. A viewer without training in scientific reasoning (e.g., interpreting dashed lines as hypotheticals) sees disconnected snapshots, not a causal relation.  
  - **Theoretical Loading:** The device covertly relies on concepts of *causal necessity* and *modal negation* — philosophical constructs Neurath sought to eliminate from "protocol sentences."  
  - **Verbal Crutch:** The pictogram only works if the viewer mentally supplements it with verbal rules ("ghosted = hypothetically absent," "broken arrow = impossible reaction"). This contradicts Neurath’s demand that images *replace* verbal explanation.  

  In essence, the pictogram attempts to "draw the invisible" (causal dependency) using visual metaphors that themselves require theoretical scaffolding. Neurath’s commitment to *empirical immediacy* cannot accommodate the representation of *non-actual possibilities* without abandoning pictorial purity. The tension reveals a fundamental limit: a visual language grounded in observable states struggles to express *why* those states occur — especially when the "why" involves invisible, non-occurring scenarios.
