  - **Unoccupied Space**:  
    - *"Reciprocity + Future Deprivation"*: The tree separates these (Node 2), as reciprocity ignores future welfare.  
    - *"Intrinsic Value + AI Acceptance"*: If human story has intrinsic worth (Leaf C), AI replacement should *still* feel tragic (Node 3 → Yes), but this combo would require Node 3 → No.  
  - **Result You Might Dislike**: **Leaf A (No Hidden Tragedy)** – Dismisses all arguments beyond physical death.  

