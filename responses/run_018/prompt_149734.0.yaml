prompt: |-
  I've been trying to work out for myself when saying that two things both caused a historical outcome is actually saying something important, versus when it's just listing things that happened beforehand. I came up with a rule I call the removal test: if you can take one factor away and the outcome still happens, that factor was only a background condition; if removing it breaks the chain, it was a real cause. But my gut verdicts on actual cases don't line up with it, and I'm not sure whether to fix the rule or overturn some of my calls.

  Here are the verdicts:

  - The outbreak of World War I in 1914: the assassination of Archduke Franz Ferdinand and the rigid alliance system. I think the alliance system was the real cause; the assassination was just the spark, since any other crisis could have triggered the war. By my removal test, the assassination should be a mere condition.
  - The fall of the Berlin Wall in 1989: Soviet economic stagnation and Gorbachev's refusal to send in tanks. Here I think Gorbachev's decision was the real cause, and the economic weakness was just the background pressure. So my test makes the stagnation the condition.
  - The extinction of the passenger pigeon: commercial overhunting and widespread deforestation. I think both were fully real causes, not conditions, even though either one might eventually have wiped out the species alone. So my test fails badly here — it would call both conditions, but I want to keep both as causes.
  - The success of the Montgomery bus boycott: Rosa Parks's refusal to move and the NAACP's existing organizational network. I don't think these are competing explanations at all; Parks supplied the specific trigger and the NAACP supplied the sustained structure. They feel layered, not like backups for each other.
  - The failure of the Kellogg-Briand Pact: the absence of any enforcement mechanism and the economic crisis of the Great Depression. I think the missing enforcement was the real cause, and the Depression was just the stress test that revealed the weakness.

  So my removal test handles the first two cases the way I want, but it collapses on the passenger pigeon, and it doesn't tell me how to classify the boycott or the pact. I've also been using an informal distinction between "causal backup" — where one factor could substitute for another — and "joint production" — where each does part of the work — but I can't apply it consistently. Is there a repaired principle, or a small family of principles, that saves my verdict that the assassination was secondary, that Gorbachev was primary, that both hunting and deforestation count fully despite redundancy, and that Parks and the NAACP are parts of one process rather than interchangeable backups? What does the best version predict for a case I haven't listed — say, the collapse of a small manufacturing firm that both lost its only major buyer and suffered a factory fire, where either event alone would have bankrupted it?

  Please also be honest about which of my verdicts the principle has to overturn, if any.

  Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is grappling with a philosophical problem in historical causation. They've developed a "removal test" but find it clashes with their intuitive judgments about specific cases. The core tension seems to be between necessary/sufficient conditions and what actually feels historically significant. 

  Hmm, their examples reveal three distinct patterns: 1) the spark-vs-tinder dynamic (WWI assassination), 2) the enabler-vs-decider scenario (Gorbachev's choice), and 3) the dual-sufficient-cause dilemma (passenger pigeon). Their frustration peaks at the pigeon case where removal test fails completely - and interestingly, this exposes the test's blind spot to overdetermination. 

  The user's deeper struggle might actually be about explanatory weight rather than pure causality. When they insist both hunting and deforestation "count fully," they're really asking how to assign responsibility in additive scenarios. The NAACP/Rosa Parks example further complicates things by introducing complementary rather than competing causes. 

  I notice their unspoken question is about epistemic humility too: they're explicitly asking which intuitions should yield if theory conflicts. That's admirably self-critical. For the manufacturing firm analogy they added, traditional counterfactual analysis would call both causes "conditions" - but that feels unsatisfying because in practical terms, both events actively destroyed the company. 

  Perhaps the solution requires distinguishing between "causal potency" (could X produce the effect alone?) and "causal responsibility" (did X actually contribute decisively in this instance?). For the pigeon, both factors score high on potency but share responsibility. For Gorbachev, his choice has low potency (without economic crisis) but full responsibility in 1989. 

  The repaired principle should probably incorporate: a) minimal sufficiency analysis, b) path-specific contribution, and c) avoidable causation. This would preserve their WWI/Kellogg-Briand verdicts while upgrading the passenger pigeon factors to full causes. The boycott case resolves neatly as sequential necessity. 

  Main sacrifice: their Gorbachev verdict. If we take economic stagnation as necessary context, his decision becomes the proximate cause - but the removal test isn't wrong to see the stagnation as indispensable. The principled move is to treat them as a causal package with the decision being the activating element.
answer: |-
  **Bottom line:** Your removal test fails for overdetermined cases like the passenger pigeon; replace it with Mackie's INUS framework (a cause is an Insufficient but Necessary part of an Unnecessary but Sufficient condition) plus a distinction between *precipitating* and *enabling* factors for non-overdetermined cases, which saves most of your verdicts but requires overturning your call on Gorbachev.

  **Reasoning:**  
  1.  **The INUS Framework Fixes Overdetermination:**  
      -   In cases like the passenger pigeon extinction, both hunting and deforestation are INUS causes. Each is:  
          -   *Insufficient* alone to cause extinction *at that specific time/rate* (but sufficient eventually).  
          -   *Necessary* within *their specific pathway* to the outcome occurring *as it did*.  
          -   Part of an *Unnecessary* but *Sufficient* set (either pathway was sufficient).  
      -   Removal of one factor (e.g., hunting) *doesn't* prevent extinction (the other sufficient set remains), but each is still a genuine cause because it was part of a sufficient set *that actually operated*. Your test wrongly demotes them to background conditions.  
      -   *Applies to manufacturing firm:* Both losing the major buyer and the factory fire are INUS causes. Each is an insufficient part of its own sufficient set for bankruptcy. Removing *either* alone would *not* have prevented bankruptcy, but both were active, sufficient causes in this instance.

  2.  **Distinguishing Precipitating vs. Enabling Factors Saves Non-Overdetermined Cases:**  
      -   **Precipitating Factor:** The specific, often contingent event that triggers the outcome *at that moment* within the enabling conditions.  
      -   **Enabling Factor:** The underlying condition(s) that make the outcome possible and likely, but don't trigger it by themselves.  
      -   **WWI (Alliance System vs. Assassination):** The rigid alliance system is the *enabling factor* (necessary, constant background pressure). The assassination is the *precipitating factor* (specific trigger, but contingent - other events could have played this role). Removal of the enabling factor (alliances) breaks the chain. Removal of the precipitating factor (assassination) likely delays but doesn't prevent war. Your verdict stands: alliance system = real cause, assassination = spark/condition.  
      -   **Berlin Wall (Gorbachev vs. Stagnation):** *Overturns your verdict.* Soviet economic stagnation is the *enabling factor* (created the necessity for change). Gorbachev's decision is the *precipitating factor* (the specific choice that triggered the non-intervention). Crucially, removal of the precipitating factor (Gorbachev deciding *to send tanks*) *would* have broken the chain and likely preserved the Wall for longer. Removal of the enabling factor (stagnation) prevents the situation arising. Gorbachev's decision was the *active, decisive cause* within the context. Stagnation was the necessary background condition.  
      -   **Kellogg-Briand Pact (No Enforcement vs. Depression):** The absence of enforcement is the *enabling factor* (the fundamental, structural flaw). The Depression is the *precipitating factor* (the specific crisis that triggered the failure by creating the conditions where enforcement would have been needed). Removal of the enabling factor (adding enforcement) breaks the chain. Removal of the precipitating factor (Depression) likely delays but doesn't prevent eventual failure when another crisis arose. Your verdict stands: missing enforcement = real cause, Depression = stress test/condition.

  3.  **Handling Complementary Causes:**  
      -   **Montgomery Bus Boycott (Parks & NAACP):** These are *complementary necessary causes*, not competing INUS causes or simple precipitating/enabling.  
          -   Parks' action was *necessary* as the *precipitating specific trigger* (without *this* arrest sparking *this* outrage at *this* time, the boycott likely doesn't start *then*).  
          -   The NAACP network was *necessary* as the *enabling/pre-existing structural capacity* (without it, the spark likely fizzles; no sustained organization).  
          -   Neither was sufficient alone. Both are necessary and jointly sufficient for *this specific successful boycott*. Removal of either breaks the chain. Your intuition ("layered, not backups") is correct. They are distinct, non-redundant parts of one causal process.

  **Summary of Verdict Adjustments:**  
  -   **Saved:** WWI (Alliances cause, Assassination condition), Passenger Pigeon (Both hunting and deforestation are full INUS causes), Kellogg-Briand (No enforcement cause, Depression condition), Montgomery Boycott (Parks & NAACP complementary necessary causes).  
  -   **Overturned:** Berlin Wall - Gorbachev's decision is the precipitating cause; Soviet stagnation is the enabling condition.  
  -   **Handled:** Manufacturing Firm Collapse - Both events are INUS causes (each part of its own sufficient set).  

  This approach prioritizes counterfactual dependence *within the actual causal pathways* (INUS) and the functional role of the factor (precipitating vs. enabling), accommodating redundancy, complementary necessity, and historical significance better than the binary removal test.
