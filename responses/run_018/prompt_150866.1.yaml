answer: |-
  Here’s a structured 45-minute plan for teaching illusionism to psychology undergrads, prioritising clarity and preempting misconceptions:

  **1. Foundational Setup (10 mins)**  
  - **Start with introspection**: Recap their module—ask *"What do you discover when you introspect on experiences? (e.g., the 'redness' of red, 'painfulness' of pain)"*. Label these *phenomenal properties* (qualia).  
  - **Clarify the target**: Emphasise illusionism addresses *how these properties seem*, not whether we have experiences. Use a placeholder: *"Whether that 'redness' exists as a property or is a trick of the mind is our question."*  
  - **Rule out metaphysics early**: *"We won’t debate dualism vs physicalism—illusionism is a *how* story within a physicalist framework."*  

  **2. Core Example: The Rubber Hand Illusion (RHI) (15 mins)**  
  - **Why RHI?** It’s empirically familiar, shows introspection misrepresenting bodily states, and parallels illusionism’s claims about qualia. Mary/zombies invite metaphysical tangles; RHI is concrete.  
  - **Walkthrough**:  
    - Describe the RHI procedure (brushing seen/rubber + hidden real hand).  
    - Highlight the *introspective report*: "I *feel* the brush on the rubber hand!"  
    - Explain the cognitive mechanism: Predictive processing generates a body model; when visual/tactile predictions align, it *misattributes* sensation location.  
    - **Key point**: The feeling is real, but its *location* is misrepresented. The "felt location" is illusory.  

  **3. Introducing Illusionism via RHI Analogy (10 mins)**  
  - **Link to consciousness**: *"Just as RHI misrepresents *where* sensation is, illusionism says introspection misrepresents *what* sensation is. It models sensory states as having intrinsic 'redness' or 'painfulness'—but these are representational fictions."*  
  - **Mechanism**: Frame it as introspective predictive processing: The brain’s self-model generates "qualitative feels" to track complex neural states. These feels are useful proxies, not real properties.  
  - **Contrast with behaviourism (CRITICAL)**: *"Unlike behaviourism, illusionism *affirms* internal cognitive processes. The *process* of experiencing is real—it’s just that introspection misdescribes it as involving phenomenal properties."*  

  **4. Preempting Misconceptions (5 mins)**  
  - **"So we don’t experience anything?!"**: Head off when explaining the RHI link. *"No—like the RHI’s real feeling mislocated, we *have* real sensory states; illusionism says their *phenomenal character* is misrepresented."*  
  - **"It’s denying the obvious!"**: Address during debrief. *"It denies *how* experience seems to seem*, not that it seems that way. Colour vision 'denies' wavelengths are grey—but we still *see* red!"*  

  **5. Boundaries & Refusals (Stated upfront & reiterated)**  
  - **Openly exclude**: Metaphysical debates (physicalism/dualism), hard problem solutions beyond illusionism, and critiques of physicalism. *"We’re examining one model of introspection’s outputs, not solving consciousness."*  

  **6. Check Question (Final 5 mins)**  
  - **Question**: *"According to illusionism, is the 'redness' of an apple a property of the apple, a property of your brain, or a representational feature of your introspective model?"*  
  - **Correct answer**: Representational feature. Follow-up: *"Does illusionism deny you visually process the apple?"* (No—affirms the process, denies the introspectively reported property).  

  **Plan summary**: Use introspective reports to define phenomenal properties, introduce illusionism via predictive processing and the rubber hand illusion to show qualia as introspective misrepresentations, explicitly distinguish from behaviourism by affirming real processes, preempt key misconceptions by anchoring in the RHI analogy, and verify understanding through representational status.
