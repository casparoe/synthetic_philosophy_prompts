answer: |-
  ## Coffee Shop Constitution Clash

  *(Mara and Jules are hunched over small, sticky table. Espresso cups sit half-full. The air smells of burnt beans and late-night philosophy.)*

  **Mara:** ...so *that’s* why the ten-year polymer swap can’t kill the statue, Jules. It’s been *this specific statue*, the one the artist made, the whole darn time. The museum curators, the public, *the insurance policy* – everyone treats it as continuous. You can’t just say "new statue" at year ten because some accountant replaced molecules one Tuesday.

  **Jules:** (Leans back, runs a hand through messy hair) Okay, but *treating it* as continuous doesn’t *make* it continuous, Mara. Think about the *actual stuff*. Year zero: clay. Year ten: 100% synthetic polymer. That's a total material overhaul. The original clay lump – the *actual physical substrate* the artist shaped – is gone, replaced. What we *call* "the statue" at year ten is a numerically distinct object made of entirely different matter. It just *looks* like the old one.

  **Mara:** You’re fetishizing the substrate! The statue isn't *identical* to the lump of clay it was made *from*. If it were, smashing the clay *would* be smashing the statue – and we agree it *isn't*. This case just extends that. The statue’s persistence is tied to its *form* and *function*, not the specific atoms. As long as the form is continuously maintained molecule-by-molecule – same shape, same weight, same place in the gallery – it survives. The *property* of *being that statue* persists.

  **Jules:** (Points a finger) Ah, but persistence conditions! *Why* does maintaining form and function mean it’s the same object? You’re assuming the answer. Here’s the thing: when they dig up the *original clay* that was replaced over ten years – which was carefully stored, remember – and shape *it* into a bowl… what do we have?

  **Mara:** We have the original *clay*, now shaped like a bowl. And we have the *statue*, still standing in the museum, made of polymer. Two distinct objects with different histories and different fates. Proof they were never identical! The clay can become a bowl; the statue couldn't survive being a bowl – it'd cease to be a statue. Different modal properties, different persistence conditions. The statue outlived its original matter.

  **Jules:** (Shakes head vigorously) No, no! That’s exactly where you lose me. You see *two* objects *now*, but you’re projecting a false continuity backwards. At year ten, the polymer thing *isn't* the original statue. It’s a *replica statue*. A perfect duplicate, sure. But the *original statue*? Its temporal part – its "stage" – ceased to exist the moment the *last* original clay molecule was swapped out. What we have later is a *new sequence* of statue-stages made of polymer. The bowl made from the recovered clay? That’s just the *original matter* finally being reconfigured. It’s not evidence the original statue survived; it’s evidence the original statue *ended* when its constitutive matter was fully replaced. There was never one continuous statue enduring the swap – just a chain of statue-like stages linked by similarity and causal connection, not identity.

  **Mara:** (Taps the table) But Jules, that denies the *unity* of the object through time! If it’s just stages, what grounds the claim that *this* polymer stage *isn't* the same statue as the clay stage yesterday? If causal connection and continuous form under the same ‘statue’ concept aren’t enough, what *is*? Your stages sound like isolated slices with nothing *being* the statue over time. That feels… incoherent for how we experience persistent objects. The statue *has* modal fragility – it couldn’t survive radical reshaping. The *polymer lump* at year ten *could* survive being reshaped, potentially. Different dispositions! How do stages explain that difference if it's all just momentary?

  **Jules:** (Sighs, sips cold espresso) The modal properties attach to the *kind* of stage, or the matter *at that time*. The clay-stage *yesterday* had the fragility of clay configured as a statue. The polymer-stage *today* has the potential flexibility of polymer configured as a statue. The ‘couldn’t survive reshaping’ applies to the *clay-statue-stage*, not to some enduring statue-essence hopping between matter. The recovered clay becoming a bowl just confirms the original statue-stage (clay) is gone, and we have a new statue-stage (polymer) now. The persistence of the *name* or the *role* doesn’t mean identity. It’s pattern continuity, not object continuity.

  **Mara:** (Leans forward, eyes intense) Pattern continuity *is* object continuity for artifacts like statues! The identity *is* the continuity of the structured arrangement maintaining its relevant properties and causal history under the artifact concept. The polymer thing inherits the statue’s history – its creation, its exhibition record – precisely *because* it *is* the statue, continuously constituted. The recovered clay is just matter with a past role. If it weren’t the *same statue*, swapping molecules would be destruction and creation, not conservation! And museums *don't* treat it that way.

  **Jules:** (Smirks slightly) Maybe museums are metaphysically naive? Look, Mara, I get the intuition. It *feels* like the same statue. But feelings aren't ontology. The brute physical fact is: Matter A was replaced by Matter B. Object made of A ceased. Object made of B began. Slow replacement doesn’t magically bridge that gap; it just hides the transition. The recovered clay bowl is the smoking gun – the original matter proving it was *replaced*, not transformed. The statue didn’t outlive its matter; a new statue replaced it, and the old matter went on a weird decade-long vacation before becoming a bowl. Stages capture the flux without needing a mysterious enduring ‘statue’ substance.

  **Mara:** (Shakes her head, a stray coffee drop flying) Stages feel like giving up! You dissolve the object into dust. But okay... pass the sugar. I need another espresso to fight your atomistic reductionism. This polymer’s not done yet.

  **Jules:** (Grins, pushing the sugar bowl) Fair. But order me one too. This replacement debate could last a decade... molecule by molecule.

  *(The argument pauses, unresolved, as they wave down the barista. The espresso machine hisses.)*
