  The plant question is tricky. Including it might open panpsychism, but some argue it's a category error. I should decide to keep it but mark it as a stretch. The user wants a definite stance, so I'll say it belongs but is contentious.

  Overlaps between global workspace and integrated information for insects: I think they can be separated. Global workspace is about information access, while IIT is about integration. Both might apply to bees, but they're distinct concepts. So, no collapse—just different criteria.

  Gaps in the tree: Positions like accepting plants but denying nematodes might be unattractive. Denying octopus consciousness but attributing it to plants seems incoherent. I'll mark those as empty.

  Finally, the branch points: The octopus question is foundational—philosophical work on defining subjective experience. Evolutionary continuity involves biological evidence. Behavioral flexibility vs. architecture is a theoretical divide. Plant signaling is more of a gut-check on panpsychism.

