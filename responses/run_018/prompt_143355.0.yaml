answer: |-
  This pairing reveals an **implicit hybrid theory of collective responsibility** that distinguishes between *criminal liability* (individual, non-transmissible) and *reparative obligations* (collective, transmissible), grounded in distinct conceptions of agency and continuity:

  ### 1. **Conception of Collective Agency & Responsibility Presupposed**
     - **Corporate Continuity for Reparations**: The state is treated as a **continuous corporate entity** whose obligations survive regime change. This "moral personhood" model assumes:
       - *Institutional Identity*: The state persists beyond individuals or governments, making promises and bearing duties across time.
       - *Collective Agency*: Decisions by authorized agents (e.g., Wilhelmine Germany's leaders) bind the state-as-institution, not just contemporaneous citizens.
       - *Succession Principle*: New governments inherit the legal/moral obligations of predecessors (like corporate acquisitions inheriting debts).
     - **Distributive/Structural Blame for Causality**: Historians' focus on decision-makers (e.g., Bethmann-Hollweg) and structures (alliance systems, militarism) employs a **synchronic, distributive model**:
       - *Shared Responsibility*: Culpability is distributed among culpable actors/structures *at the time*, rejecting monolithic "national guilt."
       - *No Transmissible Culpability*: Blame attaches only to those who culpably contributed, dying with them.

  ### 2. **Coherence with Rejection of Inherited Criminal Liability**
     - **Perfectly Coherent**: The framework separates:
       - *Criminal Guilt*: Rooted in *personal moral agency*. Punishing descendants violates fundamental justice (no *actus reus*/*mens rea*).
       - *Reparative Obligations*: Rooted in *state continuity* and *unjust enrichment/harm*. Citizens inherit burdens *as members of the obligated polity*, not as morally guilty individuals.  
       *Example*: Post-1949 FRG acknowledged Nazi-era reparations not because new citizens were guilty, but because the German state (as an institution) bore ongoing duties for harms caused in its name.

  ### 3. **Strict Individualist/Non-Transmissive Framework: Required Alterations**
     A purely individualist model rejecting collective continuity would necessitate radical changes:
     - **Reparative Practice**:
       - *No State-Level Reparations*: Obligations could only bind living culpable individuals or entities they directly controlled (e.g., seizing assets from surviving war criminals).
       - *Unjust Enrichment Claims*: Reparations might focus on *specific, identifiable benefits* unjustly retained by institutions/individuals (e.g., looted art), not broad "war guilt."
       - *Statute of Limitations*: Claims would expire with perpetrators/victims, eliminating intergenerational duties.
     - **Commemorative Practice**:
       - *No Collective Apologies*: National symbols (e.g., heads of state) could not apologize for past acts, as the current polity lacks continuity with past culpable groups.
       - *De-Nationalized Memory*: Memorials/museums would emphasize *individual victims/perpetrators* and *structural analyses*, avoiding narratives of "national shame" or "collective atonement."
       - *Rejection of "Legacy" Rhetoric*: Phrases like "Germany’s responsibility for the Holocaust" would be invalid; responsibility belongs solely to dead Nazis and surviving collaborators.

  ### Theoretical Tension & Resolution
  The implicit theory resolves a paradox:  
  - **Criminal Law** requires *individual fault* (rejecting collective/blood guilt).  
  - **Political Reality** requires *state continuity* to stabilize treaties, debts, and reparations.  
  Thus, it bifurcates:  
  > *"The state owes, but only the guilty are blamed."*  

  This preserves moral individualism while enabling institutional responsibility across generations—a pragmatic, if philosophically hybrid, solution to the problem of historical injustice in a world of evolving polities.

  **Conclusion**: The pairing coheres by distinguishing *institutional obligation* (state as corporate person) from *moral culpability* (individuals/structures). A strict individualist framework would dismantle intergenerational reparations and replace collective remembrance with forensic history, challenging norms of international justice and historical memory.
