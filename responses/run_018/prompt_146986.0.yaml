answer: |-
  ## Scenario

  St. Helena Hospital faces a critical decision: their sole supplier of a vital anticoagulant warns of a potential disruption tomorrow due to a labor strike vote at the distribution hub occurring later today. The forecast states, "The anticoagulant supply chain *will be* disrupted tomorrow." Activating the hospital's emergency protocol ensures patient safety but incurs significant costs ($500k) and operational chaos; failing to activate risks patient harm if the disruption occurs. The strike vote outcome is genuinely contingent—labor negotiations are volatile, and both "strike" and "no-strike" outcomes remain causally possible until the vote concludes. Administrators debate the truth-value of the forecast *now*: is it determinately true that the disruption will occur, determinately false, or is its truth-value indeterminate?

  ## Analysis

  The **Open-Future Theorist** denies the forecast ("The disruption will occur tomorrow") has a determinate truth-value *now*. They argue genuine contingency precludes a settled fact about the future; the strike vote hasn't happened, so the future branches where disruption occurs and where it does not are both metaphysically open. Neither branch is yet "selected," rendering statements about which one obtains neither true nor false. The **Actualist** also denies the forecast is determinately true *now*, but for starkly different reasons. They contend that, although *we* cannot know it, exactly *one* future branch is already metaphysically real—either the disruption *will* happen or it *will not*. However, this singular truth is *epistemically inaccessible* until after the vote; our current ignorance means we cannot assign a determinate truth-value *to our knowledge claims* about the future, even though one future is fixed. Both views thus concur that the administrators cannot *know* the forecast is true now, but diverge radically on *why*: the Open-Future Theorist insists there *is* no future fact yet (metaphysical openness), while the Actualist insists there *is* a future fact but it is *hidden* (epistemic opacity). The **precise feature generating this divergence** is the metaphysical status of unrealized future possibilities. If the future event were *necessitated* (e.g., the strike vote was rigged, making disruption inevitable), both views would collapse; the Open-Future Theorist would concede truth-value emerges from necessity, and the Actualist's hidden truth would become potentially knowable, denying the contingency required by the scenario.

  A **defender of Bivalence** faces a dilemma. They insist the forecast *must* be either true or false *right now*, adhering to the principle that every meaningful proposition has exactly one truth-value. Consequently, if the forecast is *true* now, then the future disruption is already fixed and inevitable—contingency collapses into determinism. If the forecast is *false* now, then the non-disruption is fixed. Either way, the apparent contingency is illusory; the future outcome is metaphysically settled. The bivalence advocate must therefore either: 1) **Deny knowledge of contingent futures:** Argue that while one outcome *is* true now, its contingent nature (from our perspective) renders it fundamentally *unknowable* prior to occurrence, leaving the administrators without justification to act *as if* they know the truth-value; or 2) **Concede the collapse of contingency:** Accept that the future is indeed already determined, making the labor vote's outcome (and thus the disruption) causally necessary, thereby rejecting the scenario's premise of genuine openness. A bivalence advocate would likely **charge the scenario with begging the question** against their view. They would argue that by *stipulating* the disruption's occurrence is genuinely contingent (i.e., not yet causally determined), the scenario *presupposes* the very metaphysical openness that bivalence denies is possible for a proposition with a truth-value. The construction, they claim, illegitimately assumes the non-bivalent nature of future contingents from the outset, making bivalence seem incompatible with contingency *by fiat* rather than by argument.
