answer: |-
  Here is an evaluative framework for assessing theories of "gains from trade" between incommensurable value systems. Each desideratum includes a motivating case, notes on non-negotiability, and flags key tensions.

  ---

  ### **Core Desiderata for Theories of Inter-Value Trade**

  1. **Respect Deep Incommensurability**  
     - **Must Account For**: Genuine inability to rank values (e.g., "sacred" vs. "secular" goods).  
     - **Motivating Case**: A community debates building a hospital on ancestral burial grounds. Health advocates and cultural custodians see each other’s core values as *categorically distinct*—no common measure exists.  
     - **Non-Negotiable**: Any theory collapsing values into a single metric (e.g., dollars, utils) fails.  
     - **Tension Flag**: Conflicts with *Action-Guidance* (Desideratum 7).  

  2. **Explain Pareto-Improving Exchanges**  
     - **Must Account For**: Deals where all sides gain *by their own standards* without sacrificing core ends.  
     - **Motivating Case**: Environmentalists (value biodiversity) and farmers (value livelihoods) agree on sustainable irrigation: ecosystems recover *and* crop yields stabilize. Both advance their goals.  
     - **Non-Negotiable**: Distinguish from zero-sum compromise. A theory must show mutual gains are possible without shared value units.  

  3. **Distinguish Means-Trading from Ends-Trading**  
     - **Must Preserve**: Bargaining over *instrumental resources* (means) vs. trading core commitments (ends).  
     - **Motivating Case**: City council approves bike lanes (safety end) in exchange for business tax breaks (prosperity end). This trades *policy means*—neither side renounces their ultimate goal.  
     - **Non-Negotiable**: Confusing means/ends undermines moral integrity. A theory must clarify when trades preserve core values.  

  4. **Handle Non-Pareto Aggregate Gains**  
     - **Must Account For**: Societal gains where some lose *by their own lights*, yet the net outcome is accepted as legitimate.  
     - **Motivating Case**: Pandemic lockdowns: aggregate public health improves, but civil libertarians suffer irreducible losses (autonomy eroded).  
     - **Non-Negotiable**: Must explain legitimacy without pretending losses are "offset" in a common currency.  
     - **Tension Flag**: Risks violating *No Hidden Common Currency* (Desideratum 6).  

  5. **Resolve the "Trading Without Measurement" Puzzle**  
     - **Must Dissolve**: How parties negotiate without quantifying value differences.  
     - **Motivating Case**: Indigenous leaders and miners agree to limit land extraction: no "units of cultural loss" are calculated, yet mutual constraints emerge.  
     - **Non-Negotiable**: The process must not covertly rely on cardinal rankings.  

  6. **Avoid a Hidden Common Currency**  
     - **Must Dissolve**: The fear that trade *always* implies a universal metric (e.g., utility), negating incommensurability.  
     - **Motivating Case**: If a theory "solves" organ allocation by pricing life-years, it smuggles in commensurability.  
     - **Non-Negotiable**: Truly adequate theories must use procedural or relational mechanisms—not surrogate metrics.  
     - **Tension Flag**: Directly challenges *Action-Guidance*.  

  7. **Deliver Action-Guidance**  
     - **Must Provide**: A clear method for making trade-offs in practice (e.g., policy or personal dilemmas).  
     - **Motivating Case**: Allocating limited vaccines between vulnerable groups: how to decide without ranking "value of life"?  
     - **Debatable**: *Proceduralists* (fair process suffices) vs. *Substantivists* (need rational trade-off rules).  
     - **Tension Flag**: Irreconcilable with *Deep Incommensurability* if guidance requires covert comparability.  

  8. **Preserve Moral Integrity**  
     - **Must Ensure**: Parties don’t betray core commitments. Trades must not reduce values to "bargaining chips."  
     - **Motivating Case**: A doctor refuses to trade patient confidentiality for research funding, citing professional integrity.  
     - **Non-Negotiable**: Theories enabling self-betrayal (e.g., "sell any principle for enough gain") are inadequate.  

  ---

  ### **Key Tensions & Unresolvable Stresses**
  - **The Incommensurability-Action Paradox**:  
    Theories satisfying *Deep Incommensurability* (Desid. 1) and *No Hidden Currency* (Desid. 6) struggle with *Action-Guidance* (Desid. 7). If values are truly incomparable, how can rational trade-offs exist? Solutions may require procedural fairness (e.g., democratic negotiation) over substantive comparability.  
  - **Pareto vs. Legitimacy**:  
    *Pareto-Improving Exchanges* (Desid. 2) avoid moral loss but rarely apply in plural societies. *Aggregate Gains* (Desid. 4) are common yet risk tyrannizing minorities. Adequate theories must justify non-Pareto outcomes without commensuration.  

  ### **Camp-Specific Preferences**
  - **Proceduralists**: Prioritize fair negotiation processes (e.g., deliberative democracy) over substantive trade-off rules.  
  - **Substantivists**: Demand principles for weighing values (e.g., "minimize irreversible harm") even without full comparability.  
  - **Non-Negotiable Core**: All camps must reject hidden currencies and respect moral integrity.  

  This framework equips you to test theories: Can they explain real-world compromise without reducing values to a shadow currency? Do they guard against the corruption of ends while enabling cooperation? The toughest pass/fail question remains: **Can a theory respect radical difference *and* guide collective action?** If it cannot, it fails the institutional design test.
