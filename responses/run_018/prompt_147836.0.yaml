prompt: |-
  You are a poet and an expert in evolutionary biology. Before composing, think carefully about the handicap principle: a signal is credible only if it imposes a cost that lower-quality senders cannot bear, with classic biological examples being the peacock's tail and the gazelle's stotting leap in full view of a predator. Now write a villanelle—nineteen lines arranged in five tercets followed by a quatrain, using only two rhymes and two refrains that alternate and finally converge in the closing couplet—about "epistemic stotting," a novel analogy in which a scientist who issues a bold, precisely quantified, and publicly falsifiable prediction performs an analogous costly display, risking professional reputation as the handicap that makes the signal trustworthy. The first refrain should capture the skeptic's charge of wasteful theatricality; the second refrain should capture the signaler's implicit claim of hidden strength or confidence. Use the form's compulsive repetition to mirror how honest handicaps must be sustained continuously rather than paid once. Build the naive picture of hidden quality in the opening tercets, introduce the risk of exposure in the middle, and let the quatrain—where the two refrains meet—serve as the volta that resolves not into triumph but into the paradox that the very wastefulness is the only reason anyone should believe the leap. The poem should be accurate enough that a biologist recognizes the mechanics of honest signaling and a philosopher of science recognizes the analogy to risky prediction, without citing texts or naming theories beyond the principle itself. Respond with the poem itself first, with no title, no preface, and no commentary before the text; then provide one brief paragraph identifying which line or stanza performs the structural turn and explaining how the villanelle's cyclical rhyme and refrain scheme tracks the logic of sustained costly display.
reasoning: |-
  Okay, the user wants a villanelle about "epistemic stotting" that merges evolutionary biology with scientific epistemology. They've provided very specific structural requirements: five tercets and a quatrain with two alternating refrains converging in a couplet. 

  The challenge is balancing poetic form with scientific accuracy. The handicap principle must be clearly woven in - that costly signals like a peacock's tail or gazelle's stotting prove fitness because weaker individuals can't afford the risk. Translating this to science: a researcher making bold, falsifiable predictions risks reputation as their "costly display."

  Hmm... the refrains need to contrast perspectives. First refrain should represent skepticism ("Why waste breath on such a show?"), second the signaller's confidence ("My unseen strength demands this leap"). The repetition must feel organic, mirroring how honest signals require sustained cost. 

  For the volta, the quatrain is perfect - that's where the paradox crystallizes: the "wastefulness" itself creates trust. Need to build this gradually: opening tercets establish the analogy, middle stanzas introduce the risk of falsification, then the quatrain delivers the epistemic punch. 

  *Brainstorming lines*: The gazelle stots despite the lion - parallel to a scientist publishing risky predictions. The "cost" can't be one-time; just as the villanelle's refrains recur, the reputation risk persists until verification. Final couplet should hammer home that without the risk, the claim is empty. 

  *Checking technicalities*: Rhyme scheme ABA throughout, with ABAA in quatrain. Must keep only two rhymes (-eap/-ow). First refrain ends tercet 1/3/5; second ends 2/4 then both in quatrain. Syllable count matters too - aiming for consistent iambic pentameter. 

  *Philosophical angle*: Crucial that the poem doesn't celebrate triumph but the paradox. Like stotting, a prediction doesn't prove truth - it proves the scientist can withstand potential disproof. That's the hidden strength. No jargon; let metaphors do the work. 

  *Final polish*: Ensure "epistemic stotting" concept stands alone. Biologist should see Zahavi's principle, philosopher should see Popperian falsification, but no names dropped. The gazelle/scientist parallel must carry it. Quatrain's collision of refrains is make-or-break...
