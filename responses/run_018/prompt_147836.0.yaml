  *Why squander breath on such a show?*
  My unseen strength demands this leap.
  I stake my name on numbers, so

  The wary world might pause and know
  This costly flag I cannot cheap.
  *Why squander breath on such a show?*

  Like stotting prey before the foe,
  I court the risk, the judgment deep.
  I stake my name on numbers, so

  The doubters see the proof I grow
  Not sheltered safe, but on the steep.
  *Why squander breath on such a show?*

  Exposure waits; if weakness flow
  Beneath the boast, the wound will weep.
  I stake my name on numbers, so

  The test is sharp, the spotlight's glow.
  If wrong, my standing falls in heap.
  *Why squander breath on such a show?*
  *My unseen strength demands this leap.*

  The doubt endures, the price I owe
  For trust forged only where cliffs sleep.
  I stake my name on numbers, so
  The wastefulness compels belief.
  *Why squander breath on such a show?*
  *My unseen strength demands this leap.*

  **Structural Analysis:** The volta occurs decisively in the quatrain (lines 16-19), where the skeptic's refrain ("Why squander breath...") and the signaller's refrain ("My unseen strength...") finally converge within the same stanza. This collision forces the resolution: the recognition that the "wastefulness" *is* the mechanism enabling belief ("The wastefulness compels belief"). The villanelle's cyclic recurrence of the refrains mirrors the *sustained* nature of the handicap – the cost isn't paid once but endures throughout the prediction's vulnerable period until verification. Just as the gazelle must keep stotting and the refrains keep returning, the scientist's reputation remains on the line continuously, making the initial signal credible only through this ongoing, costly exposure.
