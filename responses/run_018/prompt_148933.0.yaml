  For the meta-question about "gut feeling vs real bite" - I should acknowledge that intuition often drives these frameworks, but that doesn't invalidate it. The test is whether it generates consistent, non-arbitrary distinctions. Their checkpoint criterion might actually be too broad (includes humans) or too narrow (excludes valid AI cases).

