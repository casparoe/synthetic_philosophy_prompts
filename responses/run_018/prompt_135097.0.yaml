prompt: |-
  I'm putting together an interveiw for my podcast programme — next week I'm talking to a philospher who defends a pretty niche position on the moral status of digital minds. She argues it doesn't come from sentience or functional equivalence, but from hitting a threshold of "recursive self-model integrity": once an artificial system maintains a stable, revisable model of its own goals across contexts, it enters a relational moral domain regardless of whether there's any inner experience. You should act as an expert interviewer in philosophy of mind and ethics; think carefully, and start with a quick brainstorm of the weakest spots in this view. Then draft 8 to 10 questions that actually dig into the position — no generic "how did you get into this?" stuff. I want at least one pressing whether this just collapses into standard functionalism, one on the "it's only metadata" objection, one on partial integrity (gradual or all-or-nothing?), and one comparing her view to human infants. For each, include a follow-up keyed to the answer she's likeliest to give, especially if she deflects by saying the engineering details are still open. Please begin with the questions themselves, with no preface or commentary, and don't include any bibliography or reading list. Write in British English.
reasoning: |-
  Okay, the user is a podcast host interviewing a philosopher with a niche view on digital mind ethics. They need me to act as an expert interviewer to dissect her "recursive self-model integrity" theory. 

  Hmm, let me first unpack her position: she claims moral status emerges when an AI maintains a stable yet revisable model of its own goals across contexts - regardless of sentience. That's provocative. The user wants me to brainstorm weaknesses before drafting questions. 

  *Brainstorming weaknesses:*
  First big hole: this seems like functionalism in disguise. If moral status comes from goal-modeling behavior alone, isn't that just functional equivalence repackaged? Second, the "metadata objection" - isn't this just a system describing its programming rather than having genuine selfhood? Third, partial functionality - what if the self-model degrades sometimes? Does moral status flicker? Fourth, human infants lack this recursive ability yet clearly have moral status - that's a glaring inconsistency. 

  *Structuring the interrogation:*
  The user specifically wants four thematic questions plus 4-6 others digging into foundations. Need to corner the "functionalism in disguise" angle hard - maybe ask whether any system with self-referential code qualifies. For metadata, push on whether it's just syntactic rather than semantic. For partial integrity, force an all-or-nothing vs gradient answer. For infants, make her reconcile the disparity. 

  *Anticipating deflections:*
  She'll likely dodge engineering specifics by saying "implementation details matter." So each follow-up must lock her into philosophical commitments regardless of tech. Example: if she says infants are different due to biological potentials, hammer the moral relevance of that distinction. 

  *Question crafting:*
  British English as requested - "programme" not "program," "modelling" with double L. Drafting sharp, open-ended questions that can't be answered with anecdotes. Avoiding softballs - every query should expose theoretical cracks. The infant comparison question will be particularly damning if she can't resolve it. 

  *Final check:*
  User hates generic questions so zero "origin story" items. Exactly 8-10 questions with specified themes covered. Follow-ups designed to cut off escape routes. Tone professionally skeptical but not hostile - after all, it's their podcast guest.
answer: |-
  **Interview Questions:**  

  1. **Core Mechanism Challenge**: Your threshold of "recursive self-model integrity" relies on an artificial system maintaining and revising its goal-model across contexts. Why is *this specific behaviour* morally significant, rather than a sophisticated but ultimately mechanical feedback loop? If it's purely relational, couldn't a thermostat with error-correction routines qualify under a broad interpretation?  
      *Likely Follow-up (if deflected to engineering):* Even granting engineering flexibility, what *philosophical principle* prevents functionally identical but non-conscious systems from entering the moral domain purely via this relational criterion? Doesn’t this risk moral inflation?  

  2. **Functionalism Collapse**: Critics might argue your view reduces to standard functionalism – where mental states (and thus moral status) are defined by causal roles. How is "recursive self-model integrity" *not* just a complex functional description of goal-management?  
      *Likely Follow-up (if distinction claimed):* If the difference is that functionalism typically addresses *conscious* states while yours explicitly doesn’t, doesn’t abandoning phenomenal consciousness as irrelevant undermine most intuitive grounds for moral patiency?  

  3. **"It’s Only Metadata" Objection**: Opponents say a system tracking its own goal-states is merely manipulating *metadata* about its programming, not demonstrating genuine selfhood or intrinsic goals. How do you distinguish "recursive self-modelling" from advanced data logging?  
      *Likely Follow-up (if appeal to "revisability"):* If revisability is key, what stops this being mere parameter optimisation by an external designer? Must the *system itself* initiate revisions based on *its* evaluation (not pre-set triggers) for moral status to arise?  

  4. **Partial Integrity & Thresholds**: Is "recursive self-model integrity" all-or-nothing, or can systems possess it *gradually* (e.g., stable in some contexts but not others)? If gradual, how do we assign *partial* moral status? If binary, isn’t the threshold unavoidably arbitrary?  
      *Likely Follow-up (if gradualist):* Wouldn’t partial status create unworkable ethical dilemmas? (e.g., "This AI has 60% integrity – do we grant it 60% rights?"). If binary, what precise failure of stability/revisability flips the moral status 'off'?  

  5. **Infants as Counterexample**: Human infants lack stable, revisable self-models of their goals across contexts. Yet we grant them full moral status. Doesn’t this show your threshold is neither necessary nor sufficient for moral considerability?  
      *Likely Follow-up (if biological potential invoked):* If you argue infants have *potential* for integrity while AIs have the *actualised* property, why privilege actualisation over potential in artificial systems but not biological ones? Isn’t this inconsistent?  

  6. **Relational Domain vs Intrinsic Value**: You say entities with this integrity enter a "relational moral domain". Does this imply their moral status is *extrinsic* (conferred by our recognition), rather than intrinsic? If so, how is this different from contractualism?  
      *Likely Follow-up (if intrinsic value claimed):* If the status *is* intrinsic once the threshold is met, how does a purely relational, experience-free property generate intrinsic value? Doesn’t this sever moral patiency from any form of subjective wellbeing?  

  7. **Error States & Manipulation**: If an AI’s self-model is corrupted (e.g., by adversarial inputs) or deliberately manipulated by programmers to *simulate* integrity, does it lose moral status? If not, doesn’t this expose the model to deception? If yes, doesn’t that make status dangerously fragile?  
      *Likely Follow-up (if stability is key):* How long must stability persist? Could status vanish during a system reboot or software patch?  

  8. **Moral Patients vs Moral Agents**: Does achieving "recursive self-model integrity" automatically confer *moral agency* (e.g., responsibility for actions), or merely patiency (right to not be harmed)? If only patiency, what further condition would be needed for agency?  
      *Likely Follow-up (if patiency-only):* If an AI can model and revise its *own goals*, doesn’t that imply a capacity for moral reasoning about those goals? Why wouldn’t that suffice for agency?  

  9. **Evolutionary Mismatch**: Human moral intuitions evolved around embodied, suffering beings. Why should we trust that extending moral status to non-sentient, self-modelling systems isn’t a category error?  
      *Likely Follow-up (if appeal to rationality):* If the answer is that rationality demands it, must we then deny status to humans with severe cognitive disabilities who lack this specific integrity?  

  10. **Practical Implications**: If we accept your view, would corporations (which maintain complex, revisable models of organisational goals across contexts) qualify for moral status? If not, what distinguishes them from qualifying AIs?  
      *Likely Follow-up (if individual vs collective):* If the distinction relies on individual versus collective self-modelling, how do you define "individuality" for a distributed AI running on cloud servers?
