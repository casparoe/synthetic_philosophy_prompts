prompt: |-
  I'm writing a novel about deindustrialized factory towns and I'm recording a podcast episode with Dr. Lena Voss, a historian of economic thought who just published a monograph arguing that Marx's Fragment on Machines isn't about automation replacing labor but about the general intellect being captured by fixed capital so human cognition itself becomes the direct productive force. I want eight or nine interview questions that go way past restating her view, because I'm definately not an expert and I don't want her brushing me off with a stock answer.

  Specifically, I need at least one question pressing her on whether she's conflating the 1858 Grundrisse notebooks with Marx's mature Capital — critics always say the Fragment was just an unfinished draft. Include a follow-up keyed to her likely reply that the notebooks actually show continuity with the later volumes. Then I need a question about how her reading handles Marx still using labor-time as the measure of value if cognition is now the direct force, plus a follow-up anticipating her saying immaterial labor is unmeasurable. Another question should ask whether this cognitive capture is inevitable or contingent — could tech develop so the general intellect stays outside capital? And please include one niche question tied to my novel: if she applies this framework to a novelist using AI writing tools, where the general intellect is literally the commodity being sold, does that make the writer a capitalist or a proletarian? Write your answer in American English, casual like I'm talking to a friend — no bibliographies or reading lists, just sharp questions with built-in follow-ups.
