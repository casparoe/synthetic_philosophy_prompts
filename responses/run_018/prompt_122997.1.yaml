prompt: |-
  You're a clinical ethicist who's sat on a dozen hospital ethics committees. Think carefully before you answer: start by brainstorming what principles could explain the pattern below, then commit to a call at the end instead of ending on "it depends."

  Our consult services' own precedents, all recent, all unanimous:

  - Competent Jehovah's Witness refuses a life-saving transfusion; we honored the refusal and he died. Allowed.
  - Family of a confused 84-year-old asks us to stop a cheap, reliably curative antibiotic "so he can go peacefully." We said no. Not allowed.
  - Dying patient on a ventilator, family asks us to withdraw; we did. Allowed.
  - Similar patient, family asks for a lethal injection instead because withdrawal takes longer and looks worse; we said no. Not allowed.
  - High-dose morphine for intractable pain where everyone knows it will probably shorten his life. Allowed.
  - Competent patient, not terminally ill, asks to stop the dialysis that's keeping him alive; we allowed it and he died a week later. Allowed.

  New case: a competent 58-year-old man, hes got no terminal diagnosis, depressed but with two psychiatrists signing off on his decision-making capacity, who has a feeding tube that we placed ourselves. He says he's thought about it for a year, wants the tube out and nothing by mouth, and wants to die of dehydration. He is explicit that dying is the point, not a side effect.

  What should we decide if we want to be consistent with ourselves, and which earlier precedent is the closest analog? Give me the two or three rules that fit all six of our previous calls but come apart on this one — something like an ordinary-versus-extraordinary-means rule, an autonomy-does-the-work rule, and a never-aim-at-death rule — say what each predicts here, tell me which one you'd bet we're actually running and why, and name the single extra case you'd bring back to the committee to settle it.
reasoning: |-
  Hmm, the user is presenting a complex medical ethics scenario with multiple precedents and asking for a consistent ruling on a new case. They want me to role-play as an experienced clinical ethicist who's served on hospital ethics committees.

  Looking at the six unanimous precedents:
  - Allowed competent Jehovah's Witness to refuse transfusion (resulting in death)
  - Denied family request to stop antibiotics for confused elderly patient
  - Allowed ventilator withdrawal for dying patient at family's request
  - Denied lethal injection request for similar patient
  - Allowed high-dose morphine despite known life-shortening risk
  - Allowed competent non-terminal patient to stop dialysis (resulting in death)

  The new case involves a competent 58-year-old with decision-making capacity confirmed by two psychiatrists, requesting removal of his feeding tube with the explicit intent to die by dehydration. No terminal diagnosis, though depression is noted.

  To answer systematically, I need to identify the underlying ethical principles in these precedents. Three distinct patterns emerge:

  1) The "Refusal/Withdrawal Parity" principle: Patients may refuse or withdraw interventions (even life-sustaining ones) if they're directly bodily intrusive. This explains cases 1, 3 and 6. The feeding tube removal request would likely be allowed under this principle.

  2) The "No Clinician Death-Causing Action" principle: Clinicians cannot perform actions whose primary intent and direct effect is causing death. This explains why we denied lethal injection (case 4) and why we might deny feeding tube removal here.

  3) The "Double Effect Permissibility" principle: Life-shortening interventions are allowed if the primary intent is legitimate (like pain relief) and death is a foreseen but unintended side effect. This covers case 5 but doesn't directly apply to the new scenario.

  The precedents suggest our committee actually operates under "Refusal/Withdrawal Parity" as the dominant principle, given we allowed dialysis withdrawal in nearly identical circumstances (case 6). The key similarity is the patient's competence and the bodily-intrusive nature of the intervention.

  For a tie-breaking case, I'd recall a precedent involving continuous IV fluids (non-intrusive life-sustaining care) requested to be withdrawn by a competent patient. If we previously denied that, it would confirm the bodily intrusion distinction; if allowed, it would challenge our consistency.

  Ultimately, consistency with our own precedents - particularly the dialysis case - suggests we should allow this feeding tube removal, though I'd note significant ethical discomfort given the explicit death-seeking intent.
answer: |-
  ### Brainstorming Principles from Precedents
  Based on your six cases, three core ethical principles emerge as consistent with your committee's unanimous decisions:

  1. **Bodily Integrity/Autonomy Principle**:  
     Competent patients have the absolute right to **refuse or withdraw bodily-intrusive interventions** (e.g., transfusions, ventilators, dialysis, feeding tubes), even if life-sustaining. Death from withholding/withdrawing such interventions is permissible.  
     *Supported by Cases 1, 3, and 6.*

  2. **Prohibition on Intending Death**:  
     Clinicians may **never perform an act where the primary intent is to cause death**, regardless of patient/family requests. Death must be an unintended side effect (e.g., morphine for pain) or a result of allowing natural disease progression.  
     *Supported by Cases 2 (no stopping curative treatment to hasten death), 4 (no lethal injection), and 5 (morphine allowed only with pain relief as intent).*

  3. **Distinction Between Killing and Letting Die**:  
     **Withholding/withdrawing treatment** (allowing natural death) is permitted; **active causation of death** (e.g., lethal injection) is forbidden. Bodily intrusion matters: invasive treatments (dialysis, ventilator) can be stopped; non-invasive basics (oral antibiotics, food/water) cannot be withdrawn to hasten death.  
     *Supported by Cases 1–6 collectively.*

  ---

  ### Analysis of the New Case
  - **Patient**: Competent 58yo (capacity confirmed), non-terminal, requests feeding tube removal explicitly to die.  
  - **Request**: Withdrawal of artificial nutrition/hydration (ANH) with intent to cause death by dehydration.

  **How the Principles Apply**:  
  1. **Bodily Integrity/Autonomy Principle**:  
     → **ALLOW withdrawal**. The feeding tube is a bodily-intrusive intervention (like dialysis in Case 6). Competent refusal must be honored regardless of outcome.  
     *Closest analog: Case 6 (competent non-terminal patient stopping dialysis).*

  2. **Prohibition on Intending Death**:  
     → **DENY withdrawal**. The patient’s explicit goal is death, and clinicians would be directly enabling it by removing the tube. Unlike morphine, death is not a side effect but the primary aim.  
     *Closest analog: Case 4 (denied lethal injection due to intent).*

  3. **Distinction Between Killing and Letting Die**:  
     → **UNCLEAR**. If ANH is deemed "medical treatment" (like dialysis), withdrawal is allowed (Case 6). If deemed "basic care" (like oral antibiotics/food), it must continue (Case 2). Precedents are split: tube feeding was likely viewed as medical treatment in other contexts, but intent complicates this.  

  ---

  ### Which Principle Is Your Committee Actually Using?  
  I’d bet your committee operates on **Principle 1 (Bodily Integrity/Autonomy) as dominant**, with Principle 2 (Intent) as a secondary constraint. Evidence:  
  - **Autonomy consistently overrides prognosis** in refusal cases (Jehovah’s Witness, dialysis).  
  - Intent only blocks *active* killing (lethal injection), not treatment refusal.  
  - **Case 6 is the strongest parallel**: Competent non-terminal patient refusing life-sustaining treatment (dialysis) resulting in death was allowed. A feeding tube is similarly invasive.  

  **Consistency Requires ALLOWING Withdrawal**  
  To align with Case 6, you must permit feeding tube removal. The patient’s competence and the tube’s bodily-intrusive nature make refusal inviolable, even if death is the goal. Denying it would contradict your dialysis precedent.  

  ---

  ### The Tie-Breaking Case to Settle Ambiguity  
  Bring back:  
  > **"Competent, non-terminal patient with quadriplegia (vent-dependent) requests ventilator removal to end their life. Explicitly states they want to die."**  

  - **Why this case?**  
    It directly tests whether *intent to die* invalidates autonomy in treatment refusal. If you allow withdrawal (matching Case 3’s ventilator withdrawal), you confirm **Principle 1** dominates. If you deny it due to intent, you prioritize **Principle 2**. Your dialysis case (allowed) suggests intent is irrelevant if the intervention is bodily intrusive.  

  ### Final Call  
  **Consistent Decision: ALLOW feeding tube removal.**  
  - **Closest Analog**: Case 6 (non-terminal dialysis refusal).  
  - **Rules Applied**:  
    1. Bodily Integrity/Autonomy permits refusal of invasive interventions.  
    2. Intent to die does not override refusal rights (per dialysis precedent).  
  - **Caveat**: Depression assessments must be rigorous, but two psychiatrists’ clearance meets your standard.  

  To maintain internal consistency, autonomy in treatment refusal must be absolute for competent patients—even when death is the desired outcome. Denying this would unravel your unanimous support for Cases 1, 3, and 6.
