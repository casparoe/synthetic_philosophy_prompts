  ### Key Takeaways for Your Draft  
  1. **Lead with the etiological account** as the biological gold standard, emphasizing its ability to explain malfunction.  
  2. **Highlight the causal-role account** in contexts like synthetic biology or engineering where history is irrelevant.  
  3. **Stress the normative gap**: Etiological functions are "what a trait *should* do"; causal-role functions are "what a part *does* do."  
  4. **Use the test cases** to show readers how both theories succeed/fail in edge scenarios.  
  5. **Flag the etiological weakness** early: It excludes human-designed or drift-based traits, requiring a "philosophical trade-off."
