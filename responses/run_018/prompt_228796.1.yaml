prompt: |-
  I am a journalist writing a long-form piece for a general-audience science magazine about what it could mean to say that something has a function — literally, not metaphorically. The article hangs on a standoff between two philosophical accounts, and I need the comparison done rigorously before I draft. Please compare the etiological (selected-effects) account of function, on which a trait's function is the effect for which it was historically selected, with the causal-role account, on which a part's function is whatever it does that contributes to a capacity of the containing system. Run both accounts against the three test cases the piece will be built around: (i) a trait that spread through a population purely by genetic drift and was never selected for anything; (ii) a novel enzyme assembled once by engineers, with no ancestors and no selection history, that reliably detoxifies a cell it was placed in; and (iii) a subroutine inside a digital organism that evolved in silico under replication and mutation, which its human designers never intended and only noticed after the fact. Pay particular attention to which account can make sense of malfunction — a heart that fails to pump, a subroutine that degrades the organism's replication — since my editors will ask why a thing can be broken if function is just whatever it currently does. Conclude with a recommendation about which account the article should treat as the stronger default and where the piece should flag its weakness. After the comparative analysis, give me a JSON object with this schema: "accounts" (an array of two objects, each with fields "name", "one_sentence_test", "case_verdicts" — an object keyed "drift_trait", "engineered_enzyme", "digital_subroutine", each holding a short verdict string — and "handles_malfunction" as a boolean with a one-sentence justification); "deepest_disagreement" (one sentence on the real fault line between the accounts); "recommended_default" (the account name); and "editorial_caveat" (one sentence on the weakness to flag).
