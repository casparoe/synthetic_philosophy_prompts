prompt: |-
  i've been reading the Browning vs Goldhagen debate and keep seeing this move: someone says the killers were ordinary men pushed by situtional pressure, you point out that pressure was engineered by people with deep ideological commitment, they say those people were shaped by culture, but then if you ask why the culture went that way they point back to situtional pressures on the elites. each step is plausible alone but together they form a loop where situation, culture, and character keep passing the buck so no single level can be pinned down with a counterexample. is there an established name for this kind of multi-level explanatory shielding? not just ad hoc -- i mean the structured pattern where explanations at different levels (individual psych, group dynamics, cultural ideology) trade off causal weight so the overall theory never takes a direct hit. if there's no term, can you define its edges and say how it's different from a normal interaction effect or from circular reasoning proper?
