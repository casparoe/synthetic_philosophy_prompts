prompt: |-
  before i commit to any view on advance directives and whether the earlier self gets to boss around the later one, i want the full spec. write the desiderata a theory of diachronic medical authorty has to meet: which cases it must get right (gradual dementia vs sudden injury, the patient who said 'no tubes' but now seems happy, the case where future values are genuinely different not just mistaken), which distinctions it can't collapse (normative authority vs predictive accuracy, legal bindingness vs moral weight, partial vs total value change), and what it can't contradict about how people actually revise preferences. flag which requirements are non-negotiable and which are just liberal or conservative intuitions wearing a mask. there's also this symmetry thing people ignore: if past-self authority works because they had epistemic priority about 'what matters,' don't we have to let past selves veto present choices outside medicine? say whether that breaks the list or is just a bullet to bite. briefly score precedent-autonomy vs present-best-interest against it, but don't waste space on a bibliography.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a theory of diachronic medical authority, specifically regarding advance directives. They want to know which cases the theory must handle correctly, which distinctions it must maintain, and what constraints it should respect regarding how people actually revise preferences. They also mention the symmetry problem where if past selves have authority due to epistemic priority, that might extend beyond medical contexts, and ask whether that's a fatal flaw or just a bullet to bite. Additionally, they want a brief comparison of precedent-autonomy versus present-best-interest approaches against the desiderata.

  First, I need to outline the core requirements. The key cases include gradual dementia, sudden injury, the "happy demented patient," and genuine value changes. Each of these scenarios tests different aspects of how a theory balances past and present preferences. For instance, gradual dementia challenges the continuity of identity, while the happy patient case questions whether current happiness should override prior directives.

  Next, distinctions to maintain. Normative authority versus predictive accuracy is crucial—just because a past self predicted correctly doesn't mean they have the right to bind the future self. Legal bindingness versus moral weight is another; a directive might be legally valid but morally questionable if values change. Partial versus total value change needs addressing because a slight shift in preferences shouldn't invalidate a directive, but a complete transformation might.

  The theory must also respect how people update preferences. People often revise preferences non-rationally due to emotions or biases, so the theory shouldn't require ideal rationality. It should also account for reasonable disagreements about what's "best" for the patient.

  The symmetry problem is tricky. If we grant past selves authority in medical decisions based on epistemic priority, why not in other areas? This could lead to counterintuitive outcomes, like past selves vetoing life choices. The user wants to know if this breaks the theory or is acceptable. I think it's a bullet to bite, but acknowledging it shows the theory's limits.

  Non-negotiables include respecting the patient's diachronic agency and avoiding gross harm. Cases like sudden injury with unchanged identity clearly should follow prior wishes. Distinctions like normative vs. predictive authority are also essential. Values like legal enforceability might be negotiable based on societal context.

  Precedent-autonomy prioritizes past directives but struggles with value changes and the happy patient case. Present-best-interest focuses on current well-being but risks ignoring past autonomy. A hybrid approach might be necessary, incorporating elements like value-testing to see if current preferences stem from the same values.

  I should ensure the response flags which requirements are fundamental versus those influenced by liberal or conservative biases. For example, respecting diachronic agency is core, while the weight given to legal enforceability might vary. The symmetry issue doesn't break the theory but highlights its scope limitations, needing careful boundary-setting.

  Finally, the user likely wants a practical framework for policymakers or ethicists, so clarity on non-negotiables versus flexible aspects is key. They might be developing a policy or writing a paper, needing a balanced, thorough analysis that addresses real-world complexities without getting bogged down in citations.
answer: |-
  Here are the core desiderata for a theory of diachronic medical authority, structured by your requirements:

  **I. Cases the Theory MUST Get Right (Non-Negotiables):**

  1.  **Gradual Dementia:** Must address identity/personhood continuity. If the "same person" exists (even with diminished faculties), how does their current expressed will interact with a past directive? Conversely, if dementia constitutes a "new person," does the past self retain authority? (Identity threshold problem).
  2.  **Sudden Incapacity (e.g., Coma):** Must uphold the clear prior directive of the uncontroversially "same person" who cannot *currently* express any view. (Baseline case for precedent autonomy).
  3.  **The "Happy Demented Patient":** Patient previously stated "no life-sustaining treatment if demented," but now, in a moderately demented state, appears content and smiles when fed via tube. Must reconcile prior refusal with current apparent well-being and lack of *current* refusal. (Challenge to strict precedent autonomy).
  4.  **Genuine Value Transformation (Not Mistake):** Patient undergoes a profound, stable, value shift *while competent* (e.g., religious conversion, radical lifestyle change) rendering their prior directive anathema to their *current* self. Must distinguish this from temporary distress or clouded judgment. (Challenge to strict precedent autonomy, tests what constitutes a "valid" change).

  **II. Distinctions the Theory CANNOT Collapse (Non-Negotiables):**

  1.  **Normative Authority vs. Predictive Accuracy:** A past directive might be *accurate* in predicting future preferences/suffering, but accuracy alone doesn't grant it *authority*. The theory must justify *why* the past self has the *right* to bind the future self, separate from whether it was likely *correct*.
  2.  **Legal Bindingness vs. Moral Weight/Authority:** A directive might be legally enforceable but lack full moral weight (or vice versa) in specific circumstances (e.g., the "happy demented patient"). The theory must articulate the moral foundation, not just rely on legal status.
  3.  **Partial Value Change vs. Total Identity Disruption:** Distinguishing between a *shift in priorities* within a coherent life narrative (e.g., valuing comfort over ambition due to illness) vs. a *fundamental rupture* in values/personhood (e.g., advanced dementia erasing core identity traits). The theory must handle these differently.
  4.  **Authentic Current Expression vs. Pathological Distortion:** Must distinguish a competent current preference expressing changed values from an expression caused by treatable depression, delirium, or coercion. Authority hinges on the *authenticity* of the expression, not just its existence.

  **III. Constraints on Preference Revision (Non-Negotiables):**

  1.  **Non-Ideal Rationality:** People revise preferences imperfectly – influenced by emotions, biases, framing effects, and incomplete information. The theory cannot demand idealized rational agency; it must work with how people *actually* form and change preferences.
  2.  **Reasonable Disagreement on "Best Interest":** There is often no single, objectively determinable "best interest." The theory must accommodate reasonable pluralism in conceptions of the good life and avoid imposing one view.
  3.  **The Phenomenology of Regret & Commitment:** People experience commitments to past decisions and future plans as binding *now*. The theory must explain how past directives fit into this lived experience of diachronic agency, not treat them as alien artifacts.

  **IV. The Symmetry Problem:**

  *   **The Challenge:** If the justification for past-self authority is *epistemic priority* about "what matters" (e.g., knowing their core values better before illness clouds judgment), this principle logically extends beyond medicine. Past selves could claim authority over career choices, relationships, or finances made by present selves deemed "less epistemically reliable."
  *   **Assessment:** This is **a serious challenge, not necessarily fatal, but a major bullet to bite or boundary to define.** A defensible theory must either:
      *   **Bite the Bullet:** Accept limited non-medical implications (e.g., Ulysses contracts for addiction) OR argue medical contexts are *sui generis* due to decisional incapacity altering the very capacity for value *formation* (not just expression).
      *   **Refine the Justification:** Ground authority *not solely* on epistemic priority, but on specific features of *medical* contexts: profound vulnerability during incapacity, irreversibility of death/loss of agency, the body's continuity, society's role in enabling planning, or the unique nature of suffering/well-being in illness. This explicitly limits the scope to medical decisions.

  **V. Brief Scoring of Major Approaches Against Desiderata:**

  *   **Strict Precedent Autonomy:**
      *   *Gets Right:* Sudden incapacity (2).
      *   *Fails:* Happy Demented Patient (3), Genuine Value Transformation (4), Collapses Normative Authority/Predictive Accuracy (II.1), Ignores phenomenology of changed selves (III.3).
      *   *Symmetry:* Reinforces the problem; strong epistemic priority claim extends widely.

  *   **Strict Present-Best Interest (PBI):**
      *   *Gets Right:* Happy Demented Patient (apparently) (3), avoids binding future transformed selves (4).
      *   *Fails:* Sudden Incapacity (ignores clear prior wishes) (2), Gradual Dementia (ignores prior competent expressions) (1), Collapses Legal/Moral distinction if used to override valid directives (II.2), Highly vulnerable to subjective interpretations of "best interest" (II.4, III.2).

  *   **Hybrid/Value-Dependent Approaches (e.g., "Value Test," "Critical Interests"):**
      *   *Aim:* Balance precedent autonomy and PBI by focusing on *continuity of core values/identity*. Uphold directives reflecting enduring values; discount directives contradicted by current expressions *if* those expressions stem from the *same* core values; override if current state reflects a *different* person or the directive violates the patient's own enduring conception of dignity.
      *   *Strengths:* Potentially handles Genuine Transformation (4), Happy Demented (3 - if happiness aligns with enduring values), Partial vs. Total Change (II.3), respects phenomenology (III.3).
      *   *Weaknesses:* Difficult to operationalize "core values" objectively (II.4, III.2), risk of paternalism in interpretation, may struggle with Sudden Incapacity if values *might* have changed (requires strong presumption for directives).

  **Flagging Negotiability:**

  *   **Non-Negotiable (Core):** Handling Cases 1-4, Maintaining Distinctions I.1, I.2, I.3, II.1, II.2, II.3, Respecting Constraints III.1, III.2, III.3. Addressing the Symmetry Problem coherently (even if biting a bullet).
  *   **Negotiable / Value-Laden:** The *weight* given to legal enforceability vs. moral weight (II.2). The specific *threshold* for identity disruption in dementia (I.1). The precise *balance* struck in hybrid approaches. The extent to which *societal interests* in planning/avoiding disputes factor in. *How* "core values" or "critical interests" are defined/identified (reflects deeper philosophical commitments - liberal/individualist vs. communitarian/conservative intuitions often surface here).

  **In essence:** A viable theory must navigate the tension between respecting past agency (planning, protecting core values) and respecting the existence and potential well-being of the present self (even if transformed), using distinctions grounded in authentic identity and values, not just prediction or legal force, while acknowledging real-world messiness in preference change. It must explicitly confront the symmetry problem and delineate its scope. Precedent autonomy scores high on planning and sudden incapacity but low on flexibility; PBI scores high on present welfare but low on respecting prior agency; hybrid approaches offer promise but face implementation challenges and require robust safeguards against interpretive overreach.
