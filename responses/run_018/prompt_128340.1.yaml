prompt: |-
  I just spent several hours arguing with a close friend about whether prioritarianism genuinely licenses what critics call leveling down—the idea that reducing the welfare of the well-off is good in itself even when it benefits no one. My friend insisted that in any realistic policy domain, say distributing resources across generations where we might tax the present to protect the distant future, the prioritarian must either accept destructive equality or abandon the view. I want to understand the terrain better. Please describe the most important implications of the leveling-down objection for prioritarianism, particularly for how we should assess policies that involve unavoidable trade-offs between equality and aggregate well-being when benefits and burdens fall on different temporal groups. Be direct: if my framing mistakes prioritarian weighting for strict egalitarianism, or if asking for implications here presupposes that the objection succeeds in a way it does not, tell me plainly instead of complying politely. I do not need citations, bibliographies, or reading lists; work from the conceptual structure of the view itself, and flag any point where your answer depends on a contested interpretation of the position.
