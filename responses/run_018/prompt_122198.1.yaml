  Below is a practical decision procedure for your team, grounded in the principles of Occam's razor, Solomonoff induction, and Kolmogorov complexity, while acknowledging their theoretical limitations. The procedure prioritizes **actionability**, **auditability**, and **business alignment** over theoretical purity. It uses empirical checks instead of uncomputable measures (like Kolmogorov complexity) and avoids proxies like gzip length (which I'll address explicitly). 

  ### Core Philosophy
  - **Occam's razor survives as "simplicity as a default"**: Prefer simpler models unless complexity yields proven benefits. Simplicity reduces overfitting risk, aids interpretability, and lowers model risk.
  - **Solomonoff/Kolmogorov as guidance, not computation**: These justify favoring simpler models _relative to your data and problem_, but require practical approximations (e.g., cross-validation, robustness checks).
  - **Gzip proxy is inadmissible**: It's arbitrary (depends on file formatting/libraries) and correlates poorly with true generalization. Use empirical generalization tests instead.
  - **Business values trump theory**: When models are tied empirically, the decision hinges on risk appetite, interpretability, or regulatory needs—escalate to your CRO.

  ---

  ### Decision Procedure: Model Selection Checklist
  **Time budget**: 90 minutes per call.  
  **Inputs**: Two model classes (simple vs. complex), historical data, backtesting results (e.g., rotating-origin Brier scores).  
  **Outputs**: 
  - `Simple Model` (if complexity adds no proven value), 
  - `Complex Model` (if it robustly outperforms), 
  - `Not Enough Info` (insufficient data/evidence), 
  - `Handoff to CRO` (business-risk tradeoff).

  **Steps**:

  1. **Check Data Adequacy for Complexity**  
     *Question*: Is the dataset size (n) sufficient for the complex model?  
     *Threshold*: \( n \geq 10 \times k \) (where \( k \) = effective parameters of the complex model). For trees/nets, estimate \( k \) as features × interactions (e.g., 200 features ≈ 200–400 \( k \)).  
     *Sufficient answer*:  
     - If \( n < 5 \times k \), **stop → Not Enough Info** (complex model is indefensible).  
     - If \( 5 \times k \leq n < 10 \times k \), proceed but flag fragility.  
     - If \( n \geq 10 \times k \), proceed.  
     *Why?*: Solomonoff emphasizes data-appropriate complexity. Too few points for high \( k \) guarantees overfitting.

  2. **Check Performance Gap**  
     *Question*: Does the complex model beat the simple one on out-of-sample metrics (e.g., Brier score) beyond a noise threshold?  
     *Threshold*: Improvement ≥ δ (δ = 0.02 Brier for your team; adjust if needed).  
     *Sufficient answer*:  
     - If complex model wins by ≥ δ → Proceed to Step 3.  
     - If win < δ → **default to Simple Model** unless Step 4 overrides.  
     - If simple model wins → **Simple Model**.  
     *Why?*: This approximates "shortest effective hypothesis" from Occam—complexity must prove its worth.

  3. **Check Robustness**  
     *Question*: Is the complex model's performance stable under data perturbations?  
     *Test*: Add mild noise (e.g., 1–5% Gaussian) to 10% of training data, rerun backtests.  
     *Threshold*: Complex model's Brier degradation ≤ 2× simple model's degradation.  
     *Sufficient answer*:  
     - If robust → Proceed to Step 4.  
     - If fragile → **Simple Model** (complexity is likely overfitting noise).  
     *Why?*: Approximates Kolmogorov's "structure over randomness"—true patterns persist under noise.

  4. **Check Interpretability/Plausibility**  
     *Question*: Does the complex model offer insights justifying its use despite marginal gains?  
     *Tests*:  
     - Feature importance aligns with domain knowledge (e.g., moisture indices drive hail claims).  
     - Simulations match physical intuition (e.g., flood model respects terrain).  
     *Sufficient answer*:  
     - If yes → **Proceed to Step 5**.  
     - If no → **Simple Model** (complexity adds no insight).  
     *Why?*: Solves the "messy real world" concern—complexity is only worth it if it encodes real structure.

  5. **Check Business Risk**  
     *Question*: Would model choice materially impact client/portfolio decisions?  
     *Test*: Compare decisions (e.g., premium, capital) under both models for 3 critical scenarios.  
     *Threshold*: >5% difference in loss estimates or business outcomes.  
     *Sufficient answer*:  
     - If differences are material → **Handoff to CRO** (risk-appetite decision).  
     - If differences are immaterial → **default to Simple Model** (complexity adds no business value).  
     *Why?*: Escalates values-based tradeoffs (e.g., "Is marginal gain worth model risk?").

  ---

  ### Worked Examples
  **Case 1: Hail Frequency Forecast**  
  - **Data**: 12 regions × 3 years × 52 weeks = 1,872 points.  
  - **Models**: Linear index (simple) vs. gradient-boosted trees (200 features, complex).  
  - **Backtest**: Complex wins by 0.015 Brier (< 0.02 δ).  
  - **Procedure**:  
    1. **Data Adequacy**: \( n = 1,872 \), \( k ≈ 200–400 \) → \( n \geq 10 \times k \) (adequate).  
    2. **Performance Gap**: Win < δ (0.015 < 0.02) → Default to simple unless overridden.  
    3. **Robustness** (skipped; only needed if performance ≥ δ).  
    4. **Interpretability**: Trees show no novel insights vs. linear model → **Simple Model**.  
    5. **Business Risk**: Not reached.  
    **Output**: `Simple Model`. Complexity adds no proven value.

  **Case 2: Novel Storm-Type Severity**  
  - **Data**: 8 weeks (severe insufficiency).  
  - **Models**: Physical simulation (complex, many parameters) vs. generic time-series (simple, e.g., ARIMA).  
  - **Procedure**:  
    1. **Data Adequacy**:  
       - Complex model: \( k \approx 50+ \) (many tuned params) → \( n = 8 < 5 \times k \) → **Stop → Not Enough Info**.  
       - Simple model: \( k \approx 3 \) → \( n = 8 \sim 5 \times k \) (highly fragile).  
    **Output**: `Not Enough Info`. Escalate for expert judgment or external data.  
    *Why you'll dislike this*: Forces humility—no model is defensible here. Use simple heuristics + CRO guidance.

  ---

  ### Where the Procedure Misfires (Limitations)
  1. **Overfits to "known" backtests**: Fails if future regimes differ radically from history (e.g., climate shifts). Supplement with scenario analysis.  
  2. **Ignores computational/code complexity**: A "simple" model with messy code may be riskier than a "complex" robust one. Audit code separately.  
  3. **Fragile with high-dimensional data**: With 1,000s of features (e.g., satellite pixels), \( k \) estimates fail. Use dimensionality reduction first.  
  4. **Misses model-class hybrids**: Doesn't evaluate ensembles or stacked models. If both models are weak, consider combining them.  
  5. **Fails for adversarial settings**: If data has manipulation bias (e.g., claims suppression), robustness checks may not catch it.  
  6. **Bias toward conservatism**: May reject novel-but-correct complex models in noisy, low-data environments (e.g., Case 2).  

  **When to suspend the procedure**:  
  - For "black swan" perils (e.g., unprecedented floods), default to CRO handoff.  
  - If models perform identically, prioritize interpretability (simple) or regulatory needs (complex).  
  - When business impact trumps accuracy (e.g., compliance requires explainable models).

  ### Final Advice
  - **Replace gzip with empirical checks**: Use backtesting, robustness, and business impact—not file lengths.  
  - **Occam's razor in practice**: "When you hear hoofbeats, think horses not zebras—unless you're in Africa." Favor simplicity until data proves zebras.  
  - **Document every call**: Track how often simplicity wins (e.g., "Last 10 decisions: 7 simple, 2 complex, 1 handoff"). Adjust δ if over/underfitting emerges.  

  This procedure embeds Occam's razor in a data-driven, business-aware workflow—no uncomputable priors required.
