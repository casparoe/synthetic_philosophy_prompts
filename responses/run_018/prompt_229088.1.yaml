prompt: |-
  I teach third-year philosophy of mind to students with some programming and causal-inference background, and I have one seventy-five-minute seminar for Jaegwon Kim’s causal exclusion argument. Plan how I should teach it rather than simply explaining it to me. Specify the order in which causal closure, realization, property distinctness, causal efficacy, and exclusion must be introduced, and why each depends on the previous step. Choose one carrying example that makes the pressure vivid without either assuming reduction from the outset or making a merely epistemic distinction look like two causes; say why examples involving pain, thermostats, or computer programs would or would not work. Map the predictable misconceptions—such as “the argument denies that ordinary beliefs cause behavior,” “multiple realization automatically saves mental causation,” “the mental and physical causes are just two descriptions of one event,” and “interventionist causation dissolves the problem”—and indicate exactly where in the sequence to confront each. Finish with one diagnostic question that distinguishes students who understand the dilemma from students who have merely memorized its conclusion, and state what complications I should deliberately postpone.
reasoning: |-
  We are teaching Jaegwon Kim's causal exclusion argument in a 75-minute seminar to third-year philosophy of mind students with some background in programming and causal inference. The goal is to have them understand the structure of the argument, the key concepts, and the dilemma it poses for non-reductive physicalism.

  Key Concepts to Cover (in the order they should be introduced and why each depends on the previous):
  1. **Causal Closure (or Completeness) of the Physical (CCP)**: 
     - Definition: Every physical event has a sufficient physical cause (at the time it occurs, if it has a cause at all).
     - Why first? This is a widely accepted principle in contemporary physicalism and sets the stage. It is the foundational premise that drives the problem. Without CCP, there would be no pressure for mental causation to be physical.

  2. **Property Distinctness (of Mental and Physical Properties)**:
     - Definition: Mental properties are distinct from physical properties (i.e., not identical to them). This is a commitment of non-reductive physicalism.
     - Why next? After establishing that every physical event has a physical cause, we note that non-reductive physicalism wants to maintain that mental properties are real and distinct. This sets up the tension: if the physical cause is sufficient, what room is left for the mental?

  3. **Realization**:
     - Definition: Mental properties are realized by physical properties (e.g., the mental property of being in pain is realized by some physical property, such as C-fiber firing). This is the non-reductive physicalist's way of relating mental and physical properties without identity.
     - Why after property distinctness? Realization is introduced as the non-reductive physicalist's solution to how mental properties can be distinct yet dependent on the physical. But we'll see that this leads to a problem.

  4. **Causal Efficacy**:
     - Definition: Mental properties are causally efficacious (i.e., they cause physical events, such as behavior).
     - Why now? After setting up the non-reductive picture (distinct mental properties realized by physical properties), we assert what non-reductive physicalism wants to preserve: that mental properties are causally efficacious. But then we see the conflict with CCP.

  5. **Exclusion**:
     - Definition: If an event has a sufficient cause at a time, then no other distinct event can be a cause of that event (at that time) unless it is part of a causal chain (i.e., no systematic overdetermination).
     - Why last? This principle is used to argue that if a physical event (like behavior) has a sufficient physical cause (as per CCP), then the mental property (which is distinct) cannot also be a cause unless it is overdetermining. But the non-reductive physicalist does not want systematic overdetermination for every case of mental causation.

  Carrying Example:
  - We need an example that doesn't assume reduction from the outset and doesn't make an epistemic distinction (like two descriptions of the same event) look like two causes.
  - Example: **A glass breaking due to being struck by a baseball**.
    - Physical cause: The baseball hitting the glass with a certain force (a physical event described in terms of mass, velocity, etc.).
    - Now, suppose we also want to say that the glass broke because it was fragile (a dispositional property). Fragility is a higher-level property realized by the molecular structure of the glass.
    - The problem: The physical cause (the impact) is sufficient for the breaking (by CCP). The fragility is distinct (it's a property of the glass, not identical to its molecular structure, but realized by it). If we say the fragility caused the breaking, then we have two causes for the same event? But we don't want to say that every breaking is overdetermined by the physical impact and the fragility.
    - Why this example works: 
      - It doesn't assume reduction because fragility is not identical to the molecular structure (it can be realized in multiple ways) and is a genuine higher-level property.
      - It avoids an epistemic distinction: The fragility and the impact are not two descriptions of the same event. They are distinct properties (one of the glass, one of the baseball-glass interaction) causing the same effect (the breaking). The problem of overdetermination becomes vivid.

  Why other examples might not work:
  - **Pain**: 
    - Example: Pain (mental property) causing me to withdraw my hand from a flame. 
    - Problem: It might be too easy to slip into reduction (e.g., pain is just C-fiber firing) or to think of the mental and physical as the same event under two descriptions. Also, students might have strong intuitions about the reality of pain causation that could cloud the logical structure.
  - **Thermostat**:
    - Example: The thermostat's belief that the room is too cold causing the furnace to turn on.
    - Problem: It might be seen as merely a functional or computational system, which could lead students to think in terms of levels of description rather than distinct properties. Also, it might invite a reductionist reading from the start.
  - **Computer Program**:
    - Example: A software command (like clicking "save") causing a file to be written to disk.
    - Problem: This might be interpreted as two descriptions (the software level and the hardware level) of the same causal process, thus avoiding the problem of overdetermination by collapsing into identity.

  Predictable Misconceptions and When to Confront Them:

  1. **“The argument denies that ordinary beliefs cause behavior”**:
     - When to confront: After presenting the entire argument and the dilemma (that mental causation seems to require either reduction or overdetermination).
     - How: Emphasize that Kim is not denying that we have beliefs or that they seem to cause behavior. The argument is a challenge to explain how that can be if we accept CCP and non-reduction. The conclusion is that non-reductive physicalism has a problem, but that might lead to reduction or eliminativism.

  2. **“Multiple realization automatically saves mental causation”**:
     - When to confront: When discussing realization and non-reductive physicalism's response.
     - How: Point out that multiple realization shows that mental properties are not identical to physical properties, but that doesn't solve the causal exclusion problem. Even if a mental property is multiply realizable, for any given instance it is realized by a specific physical property. And that physical property is already doing the causal work (by CCP). So the mental property seems to be left without any work to do.

  3. **“The mental and physical causes are just two descriptions of one event”**:
     - When to confront: When introducing property distinctness and realization, and again when discussing exclusion.
     - How: This is a reductionist move (identity theory). But non-reductive physicalism insists that mental properties are distinct. So if they are distinct, then we have two properties (the mental and the physical) both being cited as causes for the same effect. This leads to overdetermination. Use the glass example: fragility and the impact are not two descriptions of one event. The fragility is a property of the glass, the impact is an event. They are distinct.

  4. **“Interventionist causation dissolves the problem”**:
     - When to confront: After presenting the entire argument, when considering responses.
     - How: Interventionist accounts (like Woodward's) define causation in terms of interventions. One might argue that mental properties can be difference-makers. However, Kim would argue that if the physical realizer is already a difference-maker, then the mental property is not making an additional difference. So the exclusion problem remains. Moreover, interventionism might be compatible with reduction (if intervening on the mental is just a way to intervene on the physical). But for non-reduction, the challenge is to show that the mental property is not preempted by the physical property.

  Diagnostic Question:
  - **Question**: "Suppose we have a mental property M that causes a behavioral event B. According to non-reductive physicalism, M is realized by a physical property P. Given the causal closure of the physical, there is a physical cause of B (call it P*) that is sufficient for B. How does M cause B without being either identical to P* or causing overdetermination? And if we say that M causes B by being realized by P, and P causes B, then what causal work is left for M to do?"
    - Why it works: 
      - It forces the student to see the dilemma: either M is identical to P (or P*) and we have reduction, or we have two distinct causes (M and P*) for B. 
      - It also asks about the causal work of M, which is the heart of the exclusion problem.
    - What to look for: 
      - A student who understands will see that the non-reductive physicalist must either accept reduction (which they reject) or overdetermination (which they also reject). They might try to argue for a different relation (like supervenient causation) but should recognize the challenge.
      - A student who has memorized might just say that M causes B via P, without addressing the exclusion of M by P.

  Complications to Postpone:
  - **Supervenience**: While important, we can introduce it minimally as the relation that non-reductive physicalism uses (realization is a kind of supervenience) but not get into the varieties of supervenience.
  - **The possibility of non-systematic overdetermination**: We can postpone the discussion of whether overdetermination is acceptable in some cases (like two bullets) and why it might not be acceptable for every case of mental causation.
  - **Alternative accounts of causation**: Such as process theories or interventionism, which might offer responses. We can mention that there are responses but not delve into them in depth in this seminar.
  - **Kim's own solution (reduction via functional reduction)**: We can mention that Kim eventually opts for reduction, but the focus of this seminar is the argument against non-reductive physicalism.

  Teaching Plan (75 minutes):

  1. **Introduction (10 minutes)**:
     - Recap non-reductive physicalism (5 min): Mental properties are real, distinct from physical properties, but dependent on them (via realization/supervenience). They are causally efficacious.
     - State the problem: How can mental properties be causally efficacious if the physical world is causally closed? (5 min)

  2. **Step-by-Step Argument (45 minutes)**:
     - Causal Closure (10 min): Explain and motivate with examples. Why it's accepted by physicalists.
     - Property Distinctness (5 min): Non-reductive physicalism's commitment to mental properties being distinct.
     - Realization (5 min): How mental properties depend on physical properties without identity. Use the glass fragility example.
     - Causal Efficacy (5 min): What non-reductive physicalism wants to preserve.
     - Exclusion (10 min): The principle and the problem it creates. Use the glass example to show overdetermination.
     - The Dilemma (10 min): Either accept reduction (identify mental properties with physical properties) or accept systematic overdetermination. Both are problematic for non-reductive physicalism.

  3. **Addressing Misconceptions (10 minutes)**:
     - Go through the predictable misconceptions one by one, using the glass example and the structure of the argument to clarify.

  4. **Diagnostic Question and Discussion (10 minutes)**:
     - Pose the diagnostic question to the class. Have a brief discussion. Encourage students to see the dilemma.

  5. **Conclusion and Next Steps (5 minutes)**:
     - Summarize the exclusion argument and its challenge to non-reductive physicalism.
     - Mention that there are responses (which will be covered in a future session) and that Kim himself opts for reduction.

  This plan ensures that the argument is built step by step, with each concept depending on the previous one, and that common misunderstandings are addressed at the right moments.
answer: |-
  ### Teaching Plan for Kim's Causal Exclusion Argument  
  **Total Time:** 75 minutes  
  **Audience:** Third-year philosophy of mind students with programming/causal-inference background.  
  **Goal:** Ensure students grasp the logical structure of Kim’s argument, the dilemma for non-reductive physicalism, and common pitfalls—not just the conclusion.  

  ---

  ### **Step-by-Step Sequence of Concepts**  
  Introduce concepts in this order to mirror Kim’s logical dependency. Each step builds on the prior to create inescapable pressure.  

  1. **Causal Closure of the Physical (CCP) (15 min)**  
     - **Definition:** Every physical event has a sufficient physical cause (if it has a cause at all).  
     - **Why start here?** CCP is the bedrock of physicalism and uncontroversial for scientifically literate students. It establishes the "causal sufficiency" of the physical domain.  
     - **Dependency:** Nothing precedes CCP—it’s the starting axiom.  
     - **Teaching Tool:** Use a *neuron-firing example* (e.g., "C-fibers firing causes hand withdrawal"). Emphasize that CCP implies the physical cause is *complete*; no extra "oomph" is needed.  

  2. **Property Distinctness (10 min)**  
     - **Definition:** Mental properties (e.g., pain) are distinct from physical properties (e.g., C-fiber firing)—they aren’t identical.  
     - **Why next?** Non-reductive physicalism (NRP) requires this to avoid reductionism. Builds tension: if mental properties are distinct, how do they *interact* with a causally closed physical world?  
     - **Dependency on CCP:** CCP implies physical causes are sufficient, raising the question: *What work is left for distinct mental properties?*  
     - **Teaching Tool:** Contrast with identity theory ("Pain just *is* C-fiber firing"). Stress that NRP rejects this.  

  3. **Realization (10 min)**  
     - **Definition:** Mental properties are *realized by* physical properties (e.g., pain is realized by C-fiber firing).  
     - **Why now?** Realization is NRP’s solution to property distinctness—it preserves mental properties without identity.  
     - **Dependency on Property Distinctness:** If mental properties weren’t distinct, realization would collapse into identity. Realization only makes sense if properties are *not* identical.  
     - **Teaching Tool:** Use the **carrying example** (see below). Avoid pain/computer examples initially (they invite reductionist or epistemic slippage).  

  4. **Causal Efficacy (10 min)**  
     - **Definition:** Mental properties are causally efficacious (e.g., pain causes screaming).  
     - **Why here?** NRP insists mental properties aren’t epiphenomenal. This is where tension peaks: if CCP is true and mental properties are distinct, how can *they* cause anything?  
     - **Dependency on Realization:** Realization promises to ground causal efficacy (e.g., "Pain causes screaming *because* it’s realized by C-fibers"). But Kim argues this fails.  

  5. **Exclusion (15 min)**  
     - **Definition:** No event has more than one *sufficient* cause at a time (barring genuine overdetermination).  
     - **Why last?** Exclusion delivers Kim’s blow: if a physical cause (e.g., C-fibers) is sufficient for an effect (screaming), the mental cause (pain) is excluded.  
     - **Dependency on Prior Steps:**  
       - CCP ensures a physical cause exists.  
       - Property distinctness + realization make mental causes separate.  
       - Causal efficacy claims mental causes matter—but exclusion shows they’re redundant.  
     - **Teaching Tool:** Tie back to the carrying example. Ask: "If the physical realizer is sufficient, what does the mental property *add*?"  

  ---

  ### **The Carrying Example**  
  **Why this works:**  
  - **Scenario:** A bridge collapses under the weight of a truck.  
    - **Physical cause:** The physical load (e.g., 10-ton mass).  
    - **Mental cause (distinct property):** The bridge’s *structural fragility* (a higher-level property realized by its physical microstructure).  
  - **Why it avoids pitfalls:**  
    - **No assumed reduction:** Fragility is multiply realizable (e.g., steel vs. wood bridges), so it’s not identical to a specific physical property.  
    - **No epistemic distinction:** Fragility isn’t a "description" of the load—it’s a property of the bridge, while the load is a property of the truck. Two distinct causes for one effect (collapse).  
  - **Pressure point:** CCP says the load is sufficient. Exclusion says fragility can’t *also* be a cause without overdetermination.  

  **Why other examples fail:**  
  - **Pain:** Invites reductionism ("Pain = C-fibers") or epistemic readings ("Pain is how we describe neural activity").  
  - **Thermostat:** Too easily resolved with levels of description (e.g., "The thermostat’s ‘belief’ is just circuitry").  
  - **Computer programs:** Encourages computationalism (e.g., "Software is hardware"), masking property distinctness.  

  ---

  ### **Predictable Misconceptions & When to Confront Them**  
  Address these *at specific points* in the sequence to preempt confusion:  

  1. **“Kim denies that ordinary beliefs cause behavior.”**  
     - **When:** During **causal efficacy** discussion.  
     - **Response:** “Kim agrees mental *seem* causal—his argument shows NRP *can’t explain how* without collapse. The target is NRP, not folk psychology.”  

  2. **“Multiple realization automatically saves mental causation.”**  
     - **When:** After introducing **realization**.  
     - **Response:** “Multiple realization ensures distinctness, but doesn’t solve exclusion. For any *instance* of pain, there’s a physical realizer doing all the work. What’s left for pain?”  

  3. **“Mental/physical causes are two descriptions of one event.”**  
     - **When:** During **property distinctness** or **exclusion**.  
     - **Response:** “NRP says mental properties aren’t just descriptions—they’re *realized by* physical properties. If they’re distinct, exclusion applies. The carrying example shows two *properties* (fragility + load), not two descriptions.”  

  4. **“Interventionist causation dissolves the problem.”**  
     - **When:** During **exclusion** or Q&A.  
     - **Response:** “Interventionism (e.g., Woodward) shows how mental properties can be *difference-makers*, but Kim’s point is that the physical realizer *already* accounts for the change. Interventionism doesn’t resolve the sufficiency conflict.”  

  ---

  ### **Diagnostic Question**  
  **Pose at the end:**  
  *“If a mental property M causes behavior B, and M is realized by physical property P, how can M cause B without P doing all the work? If you say ‘M causes B via P,’ does this make M causally inert?”*  

  - **Why it works:**  
    - Students who *understand the dilemma* will see the trap:  
      - Option 1: M reduces to P (abandons NRP).  
      - Option 2: M is distinct but excluded (epiphenomenal).  
      - Option 3: Systematic overdetermination (implausible).  
    - Students who *memorized the conclusion* will parrot “exclusion” without grappling with the tension between realization and efficacy.  

  ---

  ### **Complications to Postpone**  
  Deliberately **set aside** these to maintain focus:  
  - **Supervenience details:** Mention it briefly as the backbone of realization, but don’t dive into weak/strong variants.  
  - **Non-reductive solutions** (e.g., emergence, strong emergence): These are responses to Kim, not part of his argument.  
  - **Quantum indeterminacy:** Kim assumes a deterministic physical world; introducing quantum issues muddies the waters.  
  - **Kim’s reductionism:** His positive view (functional reduction) distracts from the negative argument against NRP.  

  ---

  ### **Timeline Summary**  
  - **0–15 min:** CCP + Property distinctness (emphasizing tension).  
  - **15–25 min:** Realization + carrying example.  
  - **25–35 min:** Causal efficacy + misconception #1.  
  - **35–50 min:** Exclusion + misconceptions #2–3.  
  - **50–65 min:** Full argument walkthrough (carrying example + diagnostic question).  
  - **65–75 min:** Misconception #4 (interventionism) + Q&A.  

  This plan ensures students see the *inescapable logic* of Kim’s dilemma while disarming common diversions. The carrying example keeps the pressure on NRP without begging the question.
