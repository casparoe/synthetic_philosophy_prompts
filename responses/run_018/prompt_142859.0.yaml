answer: |-
  Here's a rigorous adjudication of the frameworks, applying them to Confederacy monuments and Masada to determine which carries greater explanatory power for resistance to factual correction and jurisdictional claims:

  **Core Frameworks:**
  1.  **Mnemonic Community (MC):** Defeat becomes a source of moral credential ("noble cause," "righteous struggle") and group cohesion ("we who remember/descend from the brave"). Resistance to correction protects the *moral narrative* and *group identity*.
  2.  **Phantom Sovereignty (PS):** Treats the defeated entity *as if* it possesses suspended legal/jurisdictional authority in a counterfactual timeline ("legitimate government-in-waiting," "unjustly dissolved"). Resistance to correction protects the *juridical claim* and *future restoration potential*. PS inherently requires an MC foundation but adds a **jurisdictional counterfactual**.

  **Application & Adjudication:**

  1.  **Resistance to Factual Correction (Why Defenders Resist Truth):**
      *   **Confederacy:** **PS is Primary.** Defenders resist admitting the Confederacy's foundational purpose (slavery), military defeat, and illegitimacy *not just* because it hurts pride (MC), but because acknowledging these facts **fatally undermines the counterfactual legal claim**. Admitting the Confederacy was *fundamentally illegitimate* (based on slavery, treasonous) and *thoroughly defeated* destroys the "suspended sovereignty" premise. Facts threaten the *juridical myth* ("states' rights" as legitimate constitutional dispute) essential for PS. MC explains the emotional sting; PS explains why *specific facts* (cause, defeat, illegitimacy) are existential threats.
      *   **Masada:** **MC is Primary.** Resistance to corrections (e.g., complexity of Zealot factions, possible non-suicide deaths) stems from protecting the **moral credential and identity glue**. Admitting nuance doesn't challenge Israel's *current* sovereignty or a counterfactual Zealot state; it challenges the *symbolic purity* of the sacrifice as a foundational myth of Jewish resistance and survival. The focus is on the *meaning* of the event for the group, not a suspended Zealot jurisdiction. Facts threaten the *moral narrative*, not a legal claim.
      *   **Verdict:** **PS explains the *specificity* and *existential nature* of factual resistance in the Confederacy case far better than MC alone.** MC is necessary but insufficient; PS provides the precise mechanism linking facts to the core claim (sovereignty). For Masada, MC suffices.

  2.  **Explaining Jurisdictional Claims (Monument Laws, Heritage Access):**
      *   **Confederacy:** **PS is Essential.** Monument-protection statutes (e.g., "heritage" laws in Southern states) function as **exercises of delegated phantom authority**. They assert a *right*, grounded in the counterfactual legitimacy of the Confederacy and/or its successor states' "heritage," to control public space and narrative *against* the federal/national authority that defeated it. Claims of exclusive "Southern heritage" over symbols implicitly assert a *jurisdictional boundary* based on the phantom entity. MC explains *why* symbols matter; PS explains why defenders frame control as a *legal right* ("our heritage, our rules") derived from a suspended sovereignty.
      *   **Masada:** **MC Suffices.** Control over the Masada site and narrative is framed as **national/cultural heritage** and **state sovereignty (of modern Israel)**, not the reactivated authority of Eleazar ben Ya'ir's Zealots. Access disputes involve *current* Israeli law, archaeology, and tourism management, not deference to a phantom Zealot jurisdiction. The narrative serves MC purposes (glue, credential) for the modern state, not as the basis for its legal claims.
      *   **Verdict:** **PS uniquely and powerfully explains the *legalistic framing and assertion of rights* over territory/narrative seen in the Confederacy case.** MC cannot explain why "heritage" translates into demands for specific *jurisdictional privileges* protected by law against a superseding authority. Masada lacks this PS dimension.

  3.  **Where Phantom Sovereignty Overreaches:**
      *   **Masada:** Applying PS here is a clear overreach. There is no significant movement asserting the *Zealots* retain suspended legal authority over Masada or Judea, awaiting restoration. Modern Israel bases its claims on continuity, international law, and current sovereignty, not the reactivation of 1st-century Zealot jurisdiction. The narrative is purely symbolic/MC.
      *   **Confederacy Nuance:** While powerful, PS doesn't explain *all* defenders. Some apologists use purely MC arguments ("honoring ancestors' bravery," "learning history") without invoking states' rights legitimacy. However, PS is necessary to explain the core activist/political movement driving monument laws and the most vehement factual resistance.

  4.  **Case Splitting?**
      *   **Yes, decisively.**
          *   **Confederacy:** Primarily explained by **Phantom Sovereignty** (with an underlying Mnemonic Community). The Lost Cause *is* treated as a counterfactual legal reality ("legitimate constitutional quarrel," "unreconstructed" ideology). Resistance to facts and jurisdictional claims (monument laws, heritage control) stem directly from protecting this phantom juridical status.
          *   **Masada:** Primarily explained by **Mnemonic Community.** The story provides moral credential (ultimate sacrifice for freedom) and group glue (foundational myth of resistance for modern Israel). Resistance to facts protects the symbolic potency. No significant phantom sovereignty claim exists.

  **Final Adjudication of Explanatory Weight:**

  *   **Mnemonic Community (MC)** is a necessary *foundational* framework for understanding why defeat narratives persist and provoke resistance in both cases. It explains the emotional investment and group identity function.
  *   **However, Phantom Sovereignty (PS) carries significantly more explanatory power for the *distinctive features* of the Confederacy case:**
      1.  **Targeted Resistance to Specific Facts:** Why admissions about slavery's centrality and total defeat are treated as existential threats (they destroy the juridical myth).
      2.  **Jurisdictional Claims & Legalism:** Why defenders assert *legal rights* (via monument statutes) and *exclusive control* ("our heritage") derived *from the defeated entity's purported legitimacy*, framing it as a counterfactual sovereign whose "principles" or "authority" persist.
      3.  **Political Mobilization:** PS provides the conceptual bridge between memory and *political action aimed at asserting control* (over space, narrative, law) in the name of the defeated entity.
  *   **PS falters when applied to Masada,** where no similar claims of suspended Zealot jurisdiction exist. MC fully suffices here.
  *   **Therefore, while MC is universally applicable to defeat narratives, PS offers a superior, more precise, and necessary explanation for the *core dynamics of resistance and claim-making* in the Confederacy case.** It captures the unique *juridical counterfactual* and its real-world consequences that MC alone cannot explain. The Confederacy case *requires* the PS lens to fully understand its political and legal manifestations; Masada does not.
