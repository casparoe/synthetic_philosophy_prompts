  - **Bilingual exception:** They argue bilinguals avoid relativity by switching frames. But what if studies showed "true" bilinguals *still* exhibit cognitive biases from one language when tested in neutral contexts? Or if early vs. late bilinguals differed in susceptibility? That could undermine their universal bilingual exemption.

