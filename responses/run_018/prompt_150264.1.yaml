  We are building a decision procedure based on "testimonial friction" that combines reductionist and anti-reductionist ideas. The core idea is that we start with a default entitlement to accept testimony (anti-reductionism) but then reduce that entitlement based on friction (reductionism). Friction comes from:
  - Internal incoherence of the claim or the report
  - Known incentives of the speaker that might bias the testimony
  - The "heaviness" of the claim (how much it requires revising our current picture of the world)
  - Conflict with background beliefs and other available sources

  The procedure must be a checklist that takes about 15 minutes per complaint. We'll have ordered questions, and at each step we assign points for friction. We set thresholds for:
  - "Pass": low friction, forward to mediation.
  - "Stop": high friction, reject without further action.
  - "Escalate": medium friction, requires human judgment (which might involve seeking more evidence or a deeper review).

  We also need explicit flags for where values (not just facts) take over.

  I take a definite stand on two key issues:

  1. **Global vs Local Friction:** We will calculate friction **locally per individual claim** within a report. Why? Because a report may contain multiple claims, some of which might have low friction and others high. This allows us to pass the low-friction parts even if others are rejected. However, if the claims are interdependent, we might have to consider the whole. But as a rule, we break down the complaint into distinct claims.

  2. **High-Friction Testimony Without Corroboration:** We will say that **high-friction testimony can be accepted without independent corroboration only in very limited circumstances** (e.g., when the claim is not very heavy and the speaker's incentives are not strongly against truthfulness). But generally, high friction requires independent corroboration. However, our procedure may flag such claims for "escalate to human judgment" where a human can decide if there's a reason to accept without corroboration (like a pattern of similar complaints).

  **The Procedure: Testimonial Friction Checklist**

  We break down the complaint into distinct claims. For each claim, we go through the following steps. Then we aggregate the results for the entire complaint.

  **Step 1: Claim Parsing**
  - Break the complaint into separate claims (e.g., "landlord entered without notice on X date", "black mold in bathroom", "systematic overcharging"). If the complaint is complex, focus on the main 1-3 claims.

  **Step 2: Default Entitlement**
  - We start by assuming the claim is true (anti-reductionist default). Then we apply friction points.

  **Step 3: Friction Assessment (per claim)**
     a. **Internal Coherence (0-3 points)**
        - 0: Claim is internally consistent and fits with the rest of the report.
        - 1: Minor inconsistencies (e.g., dates slightly off) but overall plausible.
        - 2: Some contradictions with other parts of the report or within the claim.
        - 3: Major contradictions or logical impossibilities.

     b. **Speaker Incentives (0-3 points)**
        - 0: Speaker has no apparent incentive to lie and a clear incentive to tell the truth (e.g., tenant reporting a violation that could get them evicted).
        - 1: Some incentive to exaggerate but not strong (e.g., tenant might gain a rent reduction but with no history of false claims).
        - 2: Moderate incentive to distort (e.g., tenant in a dispute with landlord and has filed multiple complaints before).
        - 3: Strong incentive to lie (e.g., tenant facing eviction and this complaint might delay it, or known history of false reports).

     c. **Claim Heaviness (0-4 points)**
        - How much does this claim require us to revise our current picture? (This is where background beliefs come in.)
        - 0: Very light - fits with typical landlord-tenant issues (e.g., minor repair delay).
        - 1: Light - somewhat unusual but not rare (e.g., one unauthorized entry).
        - 2: Moderate - unusual and would require revising our view of this landlord (e.g., pattern of entries without notice).
        - 3: Heavy - very unusual and implies major landlord misconduct (e.g., systematic fraud).
        - 4: Extremely heavy - extraordinary claim that would require overhauling our understanding (e.g., criminal conspiracy).

     d. **External Consistency (0-3 points)**
        - Conflict with other available sources (including other testimony in the same report, public records, or common knowledge).
        - 0: Consistent with other sources (e.g., other tenants report similar issues).
        - 1: Minor inconsistency (e.g., one tenant says mold, another in same building says none, but they are in different units).
        - 2: Moderate inconsistency (e.g., tenant says black mold, but landlord provided recent inspection report showing no mold).
        - 3: Direct contradiction by reliable sources (e.g., city inspection just cleared the building).

  **Step 4: Per-Claim Friction Score**
  - Sum the points from a, b, c, d (max 13). Then:
    - 0-3: **Pass** (low friction, accept claim)
    - 4-7: **Escalate** (medium friction, needs human judgment)
    - 8-13: **Stop** (high friction, reject claim without more evidence)

  **Step 5: Aggregation for the Complaint**
  - If all claims are **Pass**, the whole complaint passes.
  - If any claim is **Stop**, then that claim is rejected. But the rest may pass if they are independent. However, if a rejected claim is central, it might taint the whole complaint (then escalate).
  - If there are any **Escalate** claims, the whole complaint is escalated to human judgment.

