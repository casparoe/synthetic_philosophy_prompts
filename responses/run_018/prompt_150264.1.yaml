answer: |-
  ### Testimonial Friction Decision Procedure: The Practical Checklist  
  I'll take a definite stand: **Friction must be calculated locally per claim** (not globally for the whole report) because complaints often mix high-friction and low-friction claims. Accepting/rejecting the entire report based on an average score risks ignoring valid claims or rubber-stamping invalid ones. **High-friction testimony can be accepted without independent corroboration only if the friction score is borderline (5–6 on our scale) and the claim is "light"** (i.e., doesn’t demand major revisions to our background beliefs). Otherwise, corroboration is required.  

  This procedure is grounded in your "testimonial friction" framework:  
  - **Anti-reductionist default**: Start by trusting testimony.  
  - **Reductionist friction**: Erode trust via four friction sources:  
    1. **Internal Incoherence**: Contradictions within the claim or report.  
    2. **Speaker Incentives**: Known biases, conflicts of interest, or gains from lying.  
    3. **Claim Heaviness**: How much the claim forces us to revise our background beliefs (e.g., "landlords usually follow the law" → heavier claims need more support).  
    4. **External Consistency**: Conflicts with other sources (e.g., other witnesses, public records).  
  - **Values Flags**: Explicitly mark where social/political values (not facts) shape thresholds.  

  ---

  ### The 15-Minute Checklist  
  **Instructions**: Break the complaint into distinct claims (e.g., "landlord entered without notice," "black mold in unit 3B," "systematic overcharging"). Score each claim individually. Use the thresholds below. Total time: ≤15 mins/complaint.  

  #### Step 1: Assign Friction Points Per Claim (0–3 per category)  
  | Friction Source          | 0 Points (Low Friction)                          | 1 Point (Mild Friction)                          | 2 Points (Moderate Friction)                     | 3 Points (High Friction)                          |  
  |--------------------------|--------------------------------------------------|--------------------------------------------------|--------------------------------------------------|--------------------------------------------------|  
  | **Internal Incoherence** | No contradictions; logical and consistent.       | Minor gaps (e.g., unclear date), but plausible.  | Internal contradictions or implausible details. | Major contradictions/implausibility (e.g., impossible timeline). |  
  | **Speaker Incentives**   | No incentive to lie; neutral or aligned with truth. | Mild incentive (e.g., minor gain if believed). | Clear incentive to distort (e.g., ongoing dispute). | Strong incentive (e.g., eviction pending; history of false claims). |  
  | **Claim Heaviness**      | Light (fits norms; e.g., late repair).           | Moderate (unusual but plausible; e.g., one illegal entry). | Heavy (challenges norms; e.g., repeated harassment). | Severe (overthrows norms; e.g., criminal conspiracy). |  
  | **External Consistency** | Consistent with other sources/public records.    | Minor conflicts (e.g., one conflicting account). | Conflicting with key sources (e.g., landlord’s evidence). | Directly contradicted by reliable evidence. |  

  **Values Flags**:  
  - **Claim Heaviness** inherently reflects values (e.g., what counts as "normal" landlord behavior).  
  - **Speaker Incentives** involves values (e.g., assuming tenants are usually truthful vs. landlords are usually compliant).  

  #### Step 2: Calculate Per-Claim Score & Thresholds  
  - **Total Friction** = Sum of points (0–12 per claim).  
  - **Decision Thresholds**:  
    - **0–4 Points (Pass)**: Forward to mediation. Low friction; default trust stands.  
    - **5–6 Points (Escalate)**: Send to human judgment. Borderline; may need corroboration or investigation.  
    - **7–12 Points (Stop)**: Reject. High friction; entitlement eroded.  

  #### Step 3: Aggregate Complaint Decision  
  - **All claims Pass**: Forward entire complaint.  
  - **Any claim Escalate**: Escalate whole complaint to human judgment.  
  - **Any claim Stop**: Reject the stopped claim(s). If stopped claim is central (e.g., the core issue), reject the whole complaint. Otherwise, forward passing claims.  

  **Why this works**:  
  - **Local scoring** prevents one bad claim from sinking the whole report.  
  - **High-friction acceptance** is rare (only via "Escalate" + human judgment for light claims).  
  - **15-minute limit** is achievable with minimal training (focuses on binary scoring, not philosophy).  

  ---

  ### Case Applications  
  I’ll run your cases per the checklist. **You’ll hate Case 2 (mold)**, but I’ll explain why the procedure rejects it and where values/judgment kick in.  

  #### Case 1: Landlord Entered Without Notice  
  **Claim**: "Landlord entered my apartment without 24h notice, witnessed by my roommate who told me."  
  - **Breakdown**: One claim (illegal entry).  
  - **Scoring**:  
    - **Internal Incoherence**: 0 (consistent story, even if secondhand).  
    - **Speaker Incentives**: 0 (tenant gains little; no history of dishonesty assumed).  
    - **Claim Heaviness**: 1 (moderate—illegal entry happens, but not trivial).  
    - **External Consistency**: 1 (mild friction: secondhand testimony from roommate with same incentives; no other sources).  
  - **Total**: 2 points → **Pass**.  
  **Decision**: Forward to mediation.  

  #### Case 2: Building Has Black Mold (Group Complaint)  
  **Claim**: "Black mold is present in the building (all units)."  
  - **Breakdown**: One claim (mold presence).  
  - **Scoring**:  
    - **Internal Incoherence**: 0 (all tenants agree; no contradictions).  
    - **Speaker Incentives**: 1 (mild friction: group may gain rent reduction; no medical expertise, but not dishonest).  
    - **Claim Heaviness**: 3 (severe friction—black mold implies health hazards, requires major revisions to "safe housing" beliefs; also, all live in one unit, so building-wide claim is extrapolated).  
    - **External Consistency**: 2 (moderate friction: no medical/docs; conflicts with "if mold were building-wide, others would report"—but only one unit is represented).  
  - **Total**: 6 points → **Escalate**.  
  **Decision**: **Escalate to human judgment**—but with friction this high, expect rejection without corroboration (e.g., mold test).  
  **Why you’ll hate this**: Feels urgent, but the procedure stops it cold. Heavy claim + no expertise + no external checks = high friction. Human judgment can override here (e.g., if panel values tenant solidarity over evidence rigor), but the procedure flags it as unreliable.  
  **Values Breakdown**: "Claim Heaviness" score assumes mold requires proof—this reflects a value that physical hazards need verification.  

  #### Case 3: Systematic Overcharging by Management  
  **Claim**: "Management systematically overcharges all tenants (based on comparing bills over years)."  
  - **Breakdown**: One claim (systematic fraud).  
  - **Scoring**:  
    - **Internal Incoherence**: 0 (long-term pattern; no contradictions).  
    - **Speaker Incentives**: 1 (mild friction: tenant may gain refunds, but no malice assumed).  
    - **Claim Heaviness**: 3 (severe—systematic fraud implies criminal intent, overhauling "landlord compliance" norms).  
    - **External Consistency**: 2 (moderate friction: neighbors’ bills aren’t direct testimony; no documents provided).  
  - **Total**: 6 points → **Escalate**.  
  **Decision**: Escalate to human judgment. High friction (heaviness + no docs), but borderline score allows investigation (e.g., subpoena bills).  

  ---

  ### Where the Procedure Breaks Down  
  1. **Values vs. Facts**: At "Escalate," human judgment takes over—and values dominate. Example: In Case 2 (mold), a pro-tenant panel might accept the claim without evidence, prioritizing tenant welfare over epistemic rigor.  
  2. **Power Imbalances**: The procedure doesn’t adjust for tenants’ fear of retaliation (e.g., if only one person reports). This is a **values gap**—add it as a "Speaker Incentives" note in training.  
  3. **Corroboration Demands**: High friction claims (e.g., Case 3) stall without resources for investigation. Solution: Panel must budget for evidence gathering at "Escalate" stage.  

  **Defense**: This isn’t philosophy—it’s a practical filter. It catches lazy claims (e.g., Case 2’s building-wide mold) while passing urgent, low-friction ones (e.g., Case 1). By scoring locally and escalating mid-friction cases, it balances speed and fairness.
