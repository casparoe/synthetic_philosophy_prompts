  - philosopher_tractability: "Philosophers can analyze causal concepts in evolution (e.g., causal graphs, mechanisms) and develop conceptual models of how constraints operate over time, without requiring specific biological data."
  - shift_criterion: "Development of a formal framework for modeling the causal influence of constraint-spandrels would move it down. Persistent disagreement on the causal status would keep it high."
  - dependency_note: "Depends on Priority 1. Priority 3 and 4 depend on it."

