prompt: |-
  Write in British English.

  I have been following debates about whether dreams are genuine experiences — the kind of dispute that runs through Malcolm's scepticism about dream reports and Dennett's defence of dream experience — and I keep encountering a specific argumentative manoeuvre I do not have a name for.

  Here is what it looks like in practice. A philosopher argues that, because the sleeper's sensory pathways are blocked and no external stimuli reach the cortex, there cannot be any occurrent perceptual experience during the dream itself; at best there is only a representational trace laid down in memory. Yet when the same philosopher is pressed on how dreamers can, upon waking, describe elaborate visual scenes with such confidence, they invoke exactly those traces and speak of them as if they preserved the feel or phenomenal character of an experience, without conceding that any experience actually occurred. Conversely, a defender of dream experience will cite the vividness of waking reports as proof that something was genuinely experienced in sleep; but when confronted with confabulated or impossible dream contents, they retreat to saying that the experience was merely representational and therefore need not correspond to anything that actually happened. In both directions, the distinction between an occurrent experiential state and a representational memory-trace is deployed selectively: it is emphasised when it protects one's own position and quietly dropped when it would undermine it.

  This is not quite the motte-and-bailey, because the two positions are not a defensible core and an indefensible outgrowth — they are two equally contested interpretations of the same distinction, applied asymmetrically. Nor is it simple equivocation, since the terms (experience, representation, phenomenal character) keep their technical meanings; what shifts is the burden of proof assigned to them.

  Is there an established term for this specific pattern — the strategic, context-dependent toggling between an occurrent-experience reading and a representational-trace reading within the philosophy of dreams? If so, how does it differ from more general failures of dialectical consistency? If not, can you coin and define a term for it, specify its boundary cases (for instance, distinguishing it from ordinary auxiliary-hypothesis adjustments), and indicate whether it is unique to the dream debate or appears elsewhere in philosophy of mind?
reasoning: |-
  Okay, the user is diving deep into a specific philosophical debate about dreams and experience. They've noticed a particular argumentative pattern where philosophers toggle between occurrent experience and representational traces depending on what suits their position. They want to know if there's a term for this manoeuvre or if one should be coined. 

  First, I need to unpack their core observation: both skeptics and defenders of dream experience inconsistently apply the distinction between real-time perception and memory traces. Skeptics deny real experience during sleep but treat memory traces as preserving phenomenal character; defenders cite vivid reports as proof of experience but dismiss impossible elements as "merely representational." 

  Hmm, they're right that this isn't motte-and-bailey (no core/outgrowth structure) or pure equivocation (terms stay consistent). The inconsistency lies in selectively assigning explanatory weight to the same distinction. 

  For naming: "dialectical opportunism" feels close but too broad. "Selective burden-shifting" captures the asymmetry in proof obligations. "Phenomenal shell game" is vivid but maybe too playful? Since the issue centers on how we attribute "experience," "attribute-toggling" might work—specifically "experiential attribute-toggling." 

  Boundary cases matter. Unlike normal auxiliary hypotheses (e.g., adjusting theories for new data), this is asymmetric: the same evidence is interpreted oppositely by the same thinker depending on context. It’s not hypocrisy but tactical framing. 

  Beyond dreams, this pattern might appear in debates about hallucinations or memory—anywhere "experience" vs. "representation" is contested. The user’s sharp to notice how slippery the burden of proof becomes here. 

  Proposing "opportunistic burden-shifting" as the term—it highlights the strategic inconsistency without overloading existing concepts. The user clearly wants precision, so I’ll define it tightly and flag where it might extend to other mind-philosophy disputes.
answer: |-
  Based on your description, this specific argumentative manoeuvre does not have a widely recognised, established single term within the philosophy of mind literature. However, we can define it precisely and propose a suitable term.

  **The Manoeuvre Defined:**
  This is a pattern of **dialectically opportunistic burden-shifting** concerning the interpretation of a key distinction (here, occurrent experience vs. post-hoc representational trace). The core inconsistency involves:
  1.  **Selective Emphasis:** Insisting on a strict interpretation of the distinction (e.g., "No external stimuli, therefore no *occurrent experience*, only memory traces") to dismiss evidence contrary to one's position.
  2.  **Selective Relaxation:** Allowing the distinction to blur or collapse (e.g., treating memory traces *as if* they faithfully preserve phenomenal character, or dismissing impossible dream elements as "merely representational" without weakening the claim of occurrent experience) to incorporate evidence favourable to one's position.
  3.  **Asymmetric Burden of Proof:** Assigning the burden of proof *against* the occurrent-experience interpretation when convenient (for the sceptic), and *against* the representational-trace interpretation when convenient (for the defender), without consistent justification.

  **Proposed Term:** **Opportunistic Burden-Shifting on Experience Attribution (OBSEA)**

  *   **Opportunistic:** Highlights the context-dependent, strategic nature of switching interpretations for tactical advantage.
  *   **Burden-Shifting:** Captures the core inconsistency – shifting *what needs to be proven or defended* regarding the nature of the dream state based on the specific challenge faced.
  *   **Experience Attribution:** Specifies the domain – whether phenomenal experience ("what it's like") is attributed to the sleeping state itself or solely to the waking recollection/memory trace.

  **How it Differs from General Dialectical Inconsistency:**

  1.  **Specificity:** OBSEA isn't just any inconsistency; it's a *patterned* inconsistency revolving *specifically* around the interpretation and application burden of *one core distinction* (experience vs. representation trace) within a *single debate* (dream phenomenology).
  2.  **Leveraging Ambiguity:** It exploits the inherent conceptual *tension* or *grey area* between closely related but distinct concepts (occurrent state vs. memory of a state). General inconsistency might involve contradicting unrelated premises.
  3.  **Burden Management:** The primary mechanism isn't just changing definitions (equivocation) but strategically managing *which interpretation* of the distinction carries the explanatory burden in a given dialectical context. The *terms* retain meaning; *their role in the argument* shifts.

  **Distinguishing from Ordinary Auxiliary-Hypothesis Adjustments:**

  *   **Ordinary Adjustments:** Involve modifying *supporting* hypotheses to preserve a *core theory* in the face of anomalous data. The core commitment (e.g., "dreams are experiences") remains stable; auxiliary assumptions (e.g., about neural correlates) are tweaked.
  *   **OBSEA:** Involves strategically *re-interpreting the core distinction itself* that defines the debate (experience vs. trace). The manoeuvre *changes what counts as the core phenomenon* (e.g., momentarily treating the memory trace *as* experience-laden or the experience *as* merely representational) depending on the argumentative pressure. It's not adjusting support; it's opportunistically *redefining the target*.

  **Boundary Cases & Scope:**

  *   **Clear Case:** The scenario you described, where the *same philosopher* uses the strict distinction to block one line of evidence (e.g., sceptic on neural blockade, defender on impossible content) but relaxes it to incorporate another (e.g., sceptic on vivid recall, defender on vivid recall as proof).
  *   **Fuzzy Boundary - Different Philosophers:** If Philosopher A (sceptic) always uses the strict distinction and Philosopher B (defender) always relaxes it, that's just standard disagreement, not OBSEA. OBSEA requires the *inconsistency within a single argumentative position or across proponents using the same distinction strategically*.
  *   **Fuzzy Boundary - Genuine Theoretical Development:** If a philosopher genuinely refines their view over time based on new arguments/evidence, consistently applying a revised interpretation of the distinction, this is not OBSEA. OBSEA implies a tactical shift *within the same dialectical context*, not long-term evolution.
  *   **Scope Beyond Dreams?** **Yes.** This pattern likely appears wherever the ontological status or temporal location of phenomenal states is contested and relies on indirect reports/memories. Potential candidates:
      *   **Debates on Hallucinations:** Is the hallucination an occurrent (mis)perception or a faulty memory/introspection? Similar selective burden-shifting regarding the "experience" vs. "cognitive error" distinction might occur.
      *   **Imagery Debates:** When does vivid mental imagery constitute a quasi-perceptual experience versus a purely cognitive/propositional representation? Burden-shifting on the "experiential" aspect could arise.
      *   **Memory Phenomena:** Discussions about whether exceptionally vivid "flashbulb memories" involve re-experiencing or are reconstructions. The OBSEA pattern could emerge regarding the attribution of phenomenology to the *remembering* event versus the *remembered* event.
      *   **"Filling-in" in Perception:** Arguments about whether neural completion of visual gaps constitutes genuine phenomenal filling-in (occurrent experience) or is merely a post-perceptual judgment (representation). Strategic burden-shifting on this line could occur.

  **Conclusion:**

  While not formally named, the manoeuvre you identify is a distinct pattern of dialectical inconsistency: **Opportunistic Burden-Shifting on Experience Attribution (OBSEA)**. It exploits the conceptual tension between occurrent experience and representational memory traces by selectively applying strict or relaxed interpretations of this distinction to manage the burden of proof advantageously. It differs from general inconsistency by its focus on one core distinction within a specific debate, and from auxiliary adjustments by reinterpreting the core phenomenon itself. While prominent in the dream debate, it's a pattern potentially applicable to other areas in philosophy of mind dealing with the attribution and ontology of phenomenal states based on indirect evidence.
