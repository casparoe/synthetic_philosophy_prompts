prompt: |-
  As a faculty member serving on my university's Constitutional Reform Committee, I must help produce a formal recommendation—due before the start of next semester—regarding a proposal to pilot a sortition-based Student Deliberative Assembly. The proposal, advanced by a cross-disciplinary working group, would suspend the current system of elected student representatives to the university senate for one academic year and instead seat thirty members selected by stratified random lot across faculties, years of study, and residential status. These members would serve a single semester, participate in mandatory structured deliberation sessions moderated by trained facilitators, and issue non-binding advisory opinions on tuition structures and general-education requirements. Supporters contend that elections chronically over-represent politically mobilized minorities and that random selection yields descriptive representation closer to the actual student population; critics respond that removing electoral mechanisms severs the accountability link between representatives and their constituents, and that a body lacking a mandate cannot legitimately advise on contested normative questions such as fee increases.

  I need a short policy memo for circulation at our penultimate meeting. The document should recommend one concrete course of action—full approval with a fall launch, rejection with stated conditions for future reconsideration, or conditional approval subject to specific structural amendments—and should include a precise implementation timeline or sunset clause. The reasoning must treat the democratic-accountability objection with genuine philosophical seriousness rather than framing it as institutional inertia, and it should clarify how the distinction between descriptive representation and substantive representation bears on the design of the pilot. I am particularly concerned about a problem that the proposal addresses only in passing: if stratification categories mirror historical patterns of exclusion, the lot may reproduce the very structural inequities it claims to remedy, and a purely descriptive body may still lack the epistemic diversity required for sound deliberation on complex policy. The memo should therefore assess whether the proposed safeguards—facilitated deliberation, rotating membership waves, and a defined advisory scope—are sufficient to mitigate that risk, and it must present the strongest argument for the position you ultimately reject in terms the opposing members would recognize as fair.

  Please write the memo as a document the administration could act upon: clear bottom line, supporting reasoning that engages both the democratic-legitimacy worry and the epistemic-structure concern, an explicit acknowledgment of what is being sacrificed under the recommended course, and a final paragraph specifying exactly what must happen by which date—whether that is drafting the stratification protocol, scheduling the first deliberation session, or formally closing the pilot review process.
reasoning: |-
  Okay, let me approach this constitutional reform memo with the gravity it deserves. The user is a faculty committee member facing a tight deadline on a complex democratic experiment. 

  First, I need to unpack the core tensions: descriptive vs substantive representation, democratic accountability without elections, and the risk of replicating inequities through stratification. The user's unspoken anxiety seems to be about institutionalizing well-intentioned but potentially harmful changes - that "mirroring exclusion" point is particularly acute.

  Hmm... the proposal's strengths are compelling: random selection could indeed bypass activist-group capture and surface silent majority views. But the accountability objection isn't just inertia - it's philosophically substantive. If we remove elections, what replaces the "sanction mechanism" for poor representation? The epistemic diversity concern cuts deeper too; descriptive similarity doesn't guarantee cognitive diversity on complex policy issues.

  I'm leaning toward conditional approval but with major safeguards. The sunset clause is non-negotiable - this mustn't become permanent without rigorous review. And we need explicit stratification criteria that anticipate intersectionality, not just mechanical demographic boxes. 

  For structure: the memo must open with a blunt recommendation because administrators drown in nuance. Then systematically address: 1) how descriptive representation serves deliberation (but isn't sufficient), 2) why accountability is preserved through rotating membership and defined scope rather than elections, 3) concrete mitigations for the equity paradox (trained facilitators are crucial!). 

  The hardest part will be framing the rejected position - electoral purists - with integrity. Their "mandate via ballot" argument deserves respect, especially on tuition hikes. I'll concede that point explicitly while arguing the pilot's temporal limits make it an acceptable trade-off for new insights.

  Implementation timeline must be surgical: August for stratification design, September for facilitator training, December for sunset review. Every phase needs ownership assignments - this can't die in committee. 

  Final check: does this satisfy the user's fear about structural inequities? The mandatory deliberation protocols and intersectional stratification amendment should help, but I'll emphasize it's still an experiment requiring vigilant monitoring.
answer: |-
  **MEMORANDUM**  
  **TO:** Constitutional Reform Committee  
  **FROM:** [Your Name/Title], Faculty Representative  
  **DATE:** 20 October 2023  
  **SUBJECT:** Recommendation on Pilot Student Deliberative Assembly Proposal  

  ---

  ### **RECOMMENDATION**  
  **Conditionally approve the Student Deliberative Assembly pilot**, subject to amendments addressing stratification criteria and accountability safeguards. Launch in Fall 2024 (Semester 1), with automatic sunset after one semester unless renewed by Senate review.  

  ---

  ### **ANALYSIS & RATIONALE**  
  This proposal offers a rare opportunity to test deliberative democracy’s capacity to complement electoral representation. We address two core objections:  

  #### **1. Democratic Accountability**  
  Critics rightly argue that elections create a *sanction mechanism*: representatives risk deselection if they ignore constituents. Random selection severs this link. However:  
  - **Descriptive representation** (mirroring demographic/demographic traits) is distinct from **substantive representation** (advancing constituents’ interests). The pilot prioritizes *descriptive inclusion* to counter the electoral over-representation of politically mobilized minorities.  
  - Accountability is preserved through:  
    - **Strictly advisory, non-binding authority** (no decision-making power).  
    - **Ultra-short tenure** (one semester), limiting consequence-free divergence.  
    - **Public deliberation records**, enabling retrospective scrutiny.  
  *Sacrifice:* We temporarily forgo electoral sanctioning, accepting that the Assembly’s legitimacy hinges on process transparency, not mandates.  

  #### **2. Epistemic Diversity & Structural Equity**  
  Descriptive representation alone cannot ensure the Assembly possesses the *cognitive diversity* needed for complex policy deliberation. Crucially:  
  - If stratification categories (e.g., faculty, residency) mirror historical exclusion (e.g., under-representing low-income/disabled students), random selection may **replicate inequities**.  
  - **Proposed safeguards are necessary but insufficient**:  
    - *Facilitated deliberation*: Mitigates dominance by vocal minorities.  
    - *Rotating membership*: Prevents entrenchment but does not guarantee diverse perspectives.  
    - *Defined advisory scope*: Focuses input but doesn’t resolve epistemic gaps.  
  **Amendment Required:** Stratification must include **intersectional categories** (e.g., race/class/gender) and reserve 20% of seats for self-nominated volunteers to attract underrepresented voices not captured by administrative data.  

  ---

  ### **THE STRONGEST REJECTION ARGUMENT (FAIRLY PRESENTED)**  
  Opponents contend that only elected bodies possess the *moral authority* to advise on normatively charged issues like tuition increases. Elections confer a mandate via collective will; a randomly selected body, however descriptively accurate, speaks only for itself. Removing electoral accountability for even one semester risks normalizing a system where student "representatives" bear no consequences for misalignment with peer interests. This pilot may inadvertently legitimize unaccountable governance.  

  ---

  ### **IMPLEMENTATION TIMELINE & CONDITIONS**  
  | **Action Item** | **Responsible Party** | **Deadline** |  
  |-----------------|------------------------|--------------|  
  | Revise stratification protocol to include intersectional criteria + 20% volunteer slots | Working Group + Equity Office | 15 December 2023 |  
  | Draft facilitator training handbook (emphasizing equity/inclusion) | Center for Teaching Excellence | 15 January 2024 |  
  | Finalize random selection algorithm & publish transparency framework | IT Dept + University Secretariat | 1 March 2024 |  
  | First Assembly session (Week 1, Semester 1) | Committee Chair + Provost Office | 5 August 2024 |  
  | Sunset review & recommendation to Senate | This Committee | 15 December 2024 |  

  **Sunset Clause:** The pilot terminates automatically on 31 December 2024 unless renewed by Senate resolution informed by the Committee’s review.  

  ---

  ### **CONCLUSION**  
  This conditional approval embraces innovation while treating accountability and equity concerns with requisite gravity. By amending stratification to target epistemic diversity and embedding strict sunset review, we transform the pilot from a procedural experiment into a rigorous test of whether descriptive inclusion can yield substantively wiser governance. The Senate retains ultimate authority; the Assembly merely offers a lens to examine student perspectives obscured by electoral politics.  

  **Approved by:** _________________________  
  **Date:** _________________________
