prompt: |-
  I was chatting with a friend on the bus about that thought experiment where there's a planet just like ours except the clear stuff in rivers is some other chemical, XYZ, not H2O, and people there have identical brains but talk about "water" in all the same ways. We both agreed the usual point is that the word means something different there because it tracks the other substance. But then we started arguing about properties like "being wet" or "being drinkable", and suddenly my friend treated those as meaning exactly the same thing on both planets, even though the liquid they're applied to is chemically different. So the refering of the noun gets outsourced to the enviroment, but the adjectives stay locked inside the head.

  I've noticed this selective split happen in a couple of different debates. One is about false belief: the twin on the other planet is said to be thinking about XYZ, not H2O, but if they claim "this water isn't drinkable" they're not seen as misunderstanding the concept of drinkability—just applying an internal concept correctly to the wrong external stuff. The other is in arguments about mental content and error, where people want to allow mistakes about water without giving up externalism, so they keep the concept internal and only let the "world" part fix which substance you're talking about. It's like there's an invisible boundary between the parts of a thought that get exported and the parts that stay home, and that boundary always shifts to protect whichever intuition is under pressure.

  Is there an established name for this asymmetry—where one part of a mental representation is treated as externally determined and another part as internally shared, specifically to preserve both externalist reference and internalist explanation of error? I know it's near things like context-sensitivity or the division of linguistic labour, but those don't quite capture the noun-predicate split, or the way the line moves argument by argument. If there isn't a specific term, could you name and define it precisely, and say exactly how it differs from plain equivocation or from saying concepts are just multidimensional? I'm not a philosopher by training, so I might be missing something obvious, but I'd like to know where the edges of the thing are.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a thought experiment similar to Putnam's Twin Earth, where the clear liquid in rivers is XYZ instead of H2O. The key point they're making is about an asymmetry in how we handle reference for nouns versus adjectives. The noun "water" is externalist—its meaning depends on the environment—but adjectives like "wet" or "drinkable" are treated as internal and shared between Earth and Twin Earth. 

  The user notices this split in two contexts: false belief and mental content/error. In false belief, the twin is thinking about XYZ but applies the same concept of drinkability. In discussions of error, internal concepts are preserved while the external reference shifts. The user is asking if there's a term for this selective asymmetry where the boundary between internal and external shifts based on the argument's needs.

  First, I need to recall if there's an established term for this. The user mentions context-sensitivity and division of linguistic labor, but those don't fully capture the noun-predicate split. Putnam's semantic externalism focuses on natural kind terms like "water," but not on predicates. Adjectives like "wet" or "drinkable" are often seen as functional or response-dependent, which might explain their internal treatment. 

  Looking deeper, the asymmetry arises because natural kind terms are rigid designators, picking out the same substance across worlds, while predicates are more descriptive. But the user points out that the boundary shifts—adjectives are internal when explaining error but could be external in other cases. This flexibility isn't explicitly named in the literature. 

  The user might be hinting at an unacknowledged inconsistency in how philosophers apply externalism. They want a precise term for this shifting boundary. Since there isn't one, coining a term makes sense. "Referential Externalism / Descriptive Internalism Asymmetry" (REDIA) captures the core idea. It highlights the different treatments for reference-bearing terms versus descriptive ones. 

  Also, considering the user's background: they're not a philosopher but clearly well-versed in these thought experiments. They need a clear, precise definition that distinguishes REDIA from related concepts like equivocation or multidimensional concepts. They might be using this for academic writing or a discussion, so accuracy is key. Their deeper need is to articulate this observed inconsistency and have a framework to critique it. 

  I should ensure the explanation avoids jargon where possible. Defining REDIA with its components—referential externalism for nouns, descriptive internalism for predicates—and explaining how the boundary shifts. Contrasting it with semantic externalism (which is broader) and two-dimensional semantics (which handles context differently) will clarify. The user also needs to know that while REDIA isn't a standard term, it names a real pattern in philosophical debates, addressing their observation about the moving boundary.
answer: |-
  Your observation cuts to the heart of a fascinating tension in philosophy of language and mind. You're absolutely right about this **selective asymmetry** where the "world" fixes reference for *some* terms (like 'water') while the meaning/content of *other* terms (like 'wet', 'drinkable') is treated as internally determined and shared across scenarios, precisely to preserve core intuitions about both reference and error.

  There isn't a single, universally accepted term *solely* for this specific noun-predicate split and its argument-shifting nature. However, the phenomenon is widely recognized and discussed within the context of **Semantic Externalism** and debates about **Mental Content**. Here's how to understand it:

  1.  **The Core Framework: Semantic Externalism (Specified)**
      *   Putnam's Twin Earth thought experiment established **Natural Kind Externalism**: The meaning/reference of terms like 'water' is determined by the actual physical substance it causally interacts with in the speaker's environment (H2O on Earth, XYZ on Twin Earth). This makes reference *world-dependent*.
      *   **The Asymmetry You Observe:** This externalism is typically applied *selectively* to **natural kind terms** (nouns: 'water', 'gold', 'tiger') or **substance terms**. It's *not* standardly applied to **predicates** expressing properties like 'is wet', 'is drinkable', 'is transparent'.

  2.  **Why Predicates are Treated Differently (The "Internalist" Side):**
      *   **Functional or Response-Dependent Concepts:** Properties like 'wet', 'drinkable', 'painful', 'red' are often understood as **functional roles** (e.g., 'wet' = the property that makes things slippery, soak into cloth, etc.) or **response-dependent** (e.g., 'drinkable' = the property that typically sustains life when ingested by beings like us; 'painful' = the property that causes pain-behavior in normal subjects). The *concept itself* is defined by this role or response, which is taken to be internally shared.
      *   **Explaining Error and Disagreement:** Treating predicates as internally shared allows us to say:
          *   The Twin Earthling *correctly* applies their internal concept DRINKABLE to XYZ, judging "This water is drinkable" *truly*. Their concept DRINKABLE *means* roughly "sustains life when ingested by beings like us". XYZ does this, so it's correct.
          *   An Earthling on Twin Earth who says "This water is not drinkable" (thinking it's H2O) is *mistaken*. They apply their internal concept DRINKABLE (meaning "sustains life...") to XYZ. XYZ *does* sustain life, so their judgment is *false*. The error is misapplying their internal concept to the external substance.
      *   **Preserving Internal Concepts:** To make sense of the Twin Earthling's *thoughts* and *reasons*, we need stable internal concepts like DRINKABLE that they apply correctly based on their world's properties. If 'drinkable' meant *chemically identical to H2O*, the Twin Earthling would constantly be massively mistaken about everything, which seems absurd and fails to capture their cognitive state.

  3.  **The Shifting Boundary & Argumentative Function:**
      This is where your insight about the "invisible boundary" that "shifts to protect whichever intuition is under pressure" is crucial. The line isn't inherent in the *words* themselves but drawn based on the *theoretical need*:
      *   **To Preserve Externalist Reference:** The line is drawn tightly around natural kind *nouns* ('water') to make them environment-dependent.
      *   **To Preserve Internalist Explanation of Error/Reasoning:** The line is drawn around *predicates* ('wet', 'drinkable') and potentially other concepts (like belief, desire) to keep them internal, allowing for shared understanding and meaningful false beliefs about the external referents.
      *   **To Block Total Skepticism:** If *everything* were externalized, we couldn't make sense of shared concepts across worlds or error. If *nothing* were externalized (pure internalism), we lose the Twin Earth intuition that 'water' refers to different things. The selective split is a compromise.

  **Naming the Phenomenon:**

  While not a single canonical term, the most precise description is:

  *   **The Referential Externalism / Descriptive Internalism Asymmetry (REDIA)** (pronounced "Reed-ee-ah")

  **Defining REDIA:**

  *   **Referential Externalism:** The component specifying *which entity or substance* a concept is about (the referent of a natural kind term like 'water') is fixed by the external environment through causal-historical links.
  *   **Descriptive Internalism:** The component specifying the *properties or modes of presentation* associated with the concept (e.g., 'is clear', 'is wet', 'is drinkable', 'fills lakes') is determined internally (by functional role, inferential role, phenomenal character, or internal causal structure) and is shared across relevant counterfactual scenarios (like Twin Earth).
  *   **The Asymmetry:** This division is applied asymmetrically, primarily assigning externalism to natural kind *nouns* and internalism to descriptive *predicates*.
  *   **The Shifting Boundary:** The precise demarcation of which aspects are "referential" (external) and which are "descriptive" (internal) can shift depending on the argumentative context to preserve specific intuitions (e.g., about reference determination, cognitive significance, error, shared understanding).

  **Distinguishing REDIA from Related Concepts:**

  1.  **Plain Equivocation:** Equivocation is using the *same word* with *different meanings* in an argument. REDIA is not accidental ambiguity. It's a *systematic theoretical stance* about how different *parts* of meaning/content *work*: one part tracks the world rigidly, another part is defined by internal roles. The word 'water' has a single *semantic structure* with external and internal components; it doesn't just ambiguously mean H2O *or* XYZ.
  2.  **Concepts as Multidimensional:** While REDIA *implies* concepts have multiple dimensions (reference, sense, mode of presentation), it specifically defines *how* these dimensions relate to the internal and external: the reference-fixing dimension is externally determined, while the descriptive/sense dimension is internally determined and shared. It's a *specific claim* about the *source* of these dimensions.
  3.  **Context-Sensitivity:** Context-sensitivity (e.g., 'I', 'here', 'tall') is about how the *content expressed* by an utterance depends on the context of utterance. REDIA is about the *underlying structure of concepts* themselves and how their components depend on the environment vs. the mind *across counterfactual scenarios*. Twin Earth is about different possible worlds, not just different contexts *in* a world.
  4.  **Division of Linguistic Labour:** This (Hilary Putnam) explains how *within a community*, experts fix the reference of terms (e.g., 'gold') for non-experts. REDIA operates at the level of *individual concepts* and their components *across entire possible worlds*. While related (both involve external factors), the scale and focus differ. Division of labour happens *within* a world; REDIA explains differences *between* worlds.
  5.  **Semantic Externalism (General):** REDIA is a *specific manifestation* of semantic externalism. General externalism claims mental content depends partly on the environment. REDIA specifies *which part* of the content (the reference-fixing part of natural kind concepts) depends externally, while another part (the descriptive/sense part) depends internally.

  **Where the Edges Are:**

  *   **Not All Nouns:** REDIA primarily applies to **natural kind terms** (water, gold, tiger) or substance terms. It's not typically applied to artifact terms ('pencil', 'chair') or abstract nouns ('justice', 'number') in the same way, though debates exist.
  *   **Not All Predicates:** While 'wet' and 'drinkable' are internalized, some predicates *might* be externalized:
      *   **Natural Kind Predicates?** If a predicate *is* a natural kind term (e.g., 'is H2O'), it would be externalized. Saying "This is water" is externalized; saying "This is H2O" would also be externalized on Twin Earth (meaning XYZ, if that's their term for it). The internalist predicates are usually **functional or phenomenal** ones.
      *   **Response-Dependent Properties with External Relata:** 'Drinkable' means "sustains life for beings *like us*". The "*like us*" component might have an externalist element (depending on our actual biology). This is a potential edge case where the boundary might blur.
  *   **"Narrow" vs. "Wide" Content:** REDIA is closely related to the distinction between **wide content** (environment-dependent: the reference of 'water') and **narrow content** (environment-independent: the functional role shared by Earthlings and Twin Earthlings). Narrow content is the internal, descriptive component that, when combined with an environment, determines wide content/reference. REDIA provides the structure *for* narrow content: it's the internal functional description associated with 'water' that remains constant, while the substance it picks out (wide content) varies.

  In essence, REDIA is the **operational compromise** philosophers employ to navigate between the Scylla of radical externalism (where thought content becomes unshareable and error inexplicable) and the Charybdis of radical internalism (where the Twin Earth intuition vanishes). It carves concepts at their apparent joints: the "what" (external) vs. the "how it seems/behaves" (internal). While powerful, its stability relies on the plausibility of separating reference from description so neatly, which remains a contested point. You've identified a core, dynamic feature of contemporary philosophical semantics.
