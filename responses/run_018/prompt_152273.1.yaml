prompt: |-
  ok so me and jake were arguing til like 2am about the frame problem — you know, that philosophy/AI thing where changing one fact means you gotta figure out whats still true and what isnt, and systems either miss the background stuff or over-list every unchanged detail. he thinks its just sloppy database design, i think its deeper about what we take for granted. anyway, i review automated decision tools for our county — zoning bots, welfare eligibility updaters, stuff like that — about three pitches a week, my boss signs off, and i got 20 minutes max with no phd in sight. i need a real reusable procedure: the questions in order, what counts as a good enough answer, where i reject on tech grounds vs pass it up as a values call, and where the checklist just breaks and needs my gut. apply it to two vendor pitches: (1) a welfare updater that raises income thresholds but stays silent on whether existing medical exemptions still apply, and (2) a zoning bot that updates one parking rule but also spits out 300 unchanged ordinances to "be safe." include one case where the procedure clears the system but the result still bugs me. tell me exactly where judgment cant be eliminated. end with Verdict: [the procedures bottom-line rule].
reasoning: |-
  We are addressing the frame problem in the context of automated decision tools. The frame problem is about how systems handle the implications of changes: what remains true, what doesn't, and how to avoid either missing background assumptions or listing every unchanged fact.

  We need a reusable procedure for reviewing vendor pitches. The procedure must include:
  - Questions in order
  - What counts as a good enough answer
  - When to reject on technical grounds vs. pass it up as a values call
  - When the checklist breaks and requires gut judgment

  Then we apply it to two vendor pitches:
  1. A welfare updater that raises income thresholds but stays silent on whether existing medical exemptions still apply.
  2. A zoning bot that updates one parking rule but also spits out 300 unchanged ordinances to "be safe".

  We also need one case where the procedure clears the system but the result still bugs us.

  Finally, we identify where judgment cannot be eliminated and end with a verdict (bottom-line rule).

  ---

  **Procedure: Frame Problem Review for Automated Decision Tools**

  **Goal:** Assess how the system handles the frame problem — specifically, how it manages the implications of changes without being over-inclusive or under-inclusive.

  **Step-by-Step Questions:**

  1. **Change Scope Definition:**  
     - What specific change(s) does the system implement?  
     - *Good enough answer:* Clear, concise description of the change(s) with no ambiguity about what is being altered.

  2. **Impact Analysis:**  
     - How does the system determine which other rules/facts are affected by the change?  
     - *Good enough answer:* The system must have a method (e.g., dependency graphs, explicit rules, formal reasoning) to identify impacts beyond the immediate change. If it uses a "brute force" method (like outputting everything), it must justify why this is necessary and how it avoids overwhelming users.

  3. **Frame Axioms (What Stays the Same):**  
     - How does the system decide what remains unchanged?  
     - *Good enough answer:* The system should have a way to infer unchanged facts without explicitly listing all of them (unless required by the domain). It should avoid listing irrelevant unchanged facts. A good answer might involve using default reasoning, invariants, or minimal change principles.

  4. **Handling Exceptions and Edge Cases:**  
     - Does the system account for exceptions (e.g., medical exemptions in welfare) that might be affected by the change?  
     - *Good enough answer:* The system must either:  
       a) Explicitly state how exceptions are handled (retained, modified, or removed) and why, or  
       b) Provide a mechanism for users to review and adjust exceptions.

  5. **User Transparency and Overload:**  
     - How does the system present the changes and the unchanged context to the end-user?  
     - *Good enough answer:* The output should focus on the change and only the directly impacted rules. If unchanged context is included, it must be clearly separated and not overwhelm the user (e.g., via collapsible sections, summaries, or highlighting).

  **Decision Criteria:**

  - **Reject on Technical Grounds:**  
    - If the system lacks a coherent method for impact analysis (Step 2) and simply outputs everything unchanged (over-inclusive), without justification for why this is necessary and without mitigating user overload.  
    - If the system fails to account for exceptions (Step 4) and the domain requires handling them (e.g., welfare rules with exemptions).  
    - If the system does not clearly define the change (Step 1) leading to ambiguity.

  - **Pass Up as Values Call:**  
    - When the system's approach to what remains unchanged (Step 3) involves trade-offs that affect fairness, accessibility, or legal compliance, and the vendor has made a defensible but controversial choice.  
    - When the handling of exceptions (Step 4) involves a policy decision that should be made by elected officials or senior management.

  - **Gut Judgment Required:**  
    - When the checklist doesn't clearly apply (e.g., novel domain, highly ambiguous change) or when the system's approach is technically sound but feels ethically off (e.g., it meets all criteria but might systematically disadvantage a group).

  **Application to Vendor Pitches:**

  **Case 1: Welfare Updater**  
  - *Change:* Raises income thresholds.  
  - *Issue:* Silent on existing medical exemptions.  
  - **Review:**  
    - Step 1: Clear on the change (income thresholds). Pass.  
    - Step 2: No impact analysis provided for other rules. The vendor might argue that the change is isolated, but medical exemptions are closely related. Fail.  
    - Step 3: Not applicable (no explicit frame axioms).  
    - Step 4: Fails — medical exemptions are a key exception and must be addressed.  
    - Step 5: Not the main issue here.  
  - **Verdict:** Reject on technical grounds (fails Step 4 and Step 2). The system does not handle exceptions that are integral to welfare rules.

  **Case 2: Zoning Bot**  
  - *Change:* Updates one parking rule.  
  - *Issue:* Outputs 300 unchanged ordinances "to be safe".  
  - **Review:**  
    - Step 1: Clear on the change (parking rule). Pass.  
    - Step 2: The system does impact analysis by brute force (outputs everything). This is over-inclusive. We require justification: vendor says "to be safe". Is it necessary?  
    - Step 3: The system does not infer what stays the same; it lists everything. This is poor frame handling.  
    - Step 4: No exceptions mentioned, but zoning might have them? Not the focus here.  
    - Step 5: User overload: outputting 300 unchanged ordinances is overwhelming and not user-friendly.  
  - **Decision:**  
    - Technical Grounds: Fails Step 2 (no proper impact analysis) and Step 5 (user overload).  
    - However, if the vendor argues that in zoning, every ordinance must be re-stated for legal reasons, it becomes a values call: does the county require full re-statement?  
    - **Verdict:** Reject on technical grounds unless the vendor provides a compelling legal reason (then it becomes a values call for the boss). Without that, reject.

  **Case 3: A Cleared System That Bugs Me (Hypothetical)**  
  - *System:* A welfare eligibility tool that updates income thresholds and explicitly states that medical exemptions are unaffected.  
  - *Procedure Review:*  
    - Step 1: Clear change.  
    - Step 2: Uses dependency graph to show only income rules change.  
    - Step 3: Uses default reasoning: "exemptions remain unless modified".  
    - Step 4: Explicitly states medical exemptions are unchanged.  
    - Step 5: Outputs only the changed rule and a note on exemptions.  
  - **Procedure Clears It:** All steps passed.  
  - **But It Bugs Me:** The note on exemptions is buried in a footnote, and the tool doesn't check if the exemption criteria (e.g., income thresholds for exemptions) might indirectly change. Also, the tool doesn't consider that some exemptions might be tied to the old thresholds.  
  - **Judgment Call:** The procedure cleared it, but my gut says there's a risk. This is where judgment cannot be eliminated — the system is technically correct but might be practically inadequate. I might require the vendor to make the exemption note more prominent and verify the exemption logic.

  **Where Judgment Cannot Be Eliminated:**  
  - In Step 4 (Handling Exceptions): Deciding what counts as an exception and how it should be handled often requires domain expertise and ethical considerations.  
  - In Step 5 (User Transparency): Determining what is "overwhelming" or "clear" is subjective.  
  - In the hypothetical case above: Even when the system passes the checklist, the reviewer's experience might reveal hidden risks (e.g., indirect effects, presentation issues) that require judgment.

  **Verdict:** The bottom-line rule:  
  **"Any system that cannot demonstrate a method for impact analysis and exception handling must be rejected. When the system meets technical criteria but leaves residual ethical or practical concerns, escalate as a values call."**
answer: |-
  Below is a reusable, step-by-step procedure for reviewing automated decision tools (like zoning bots or welfare updaters) through the lens of the frame problem. It's designed for quick (20-minute) reviews by non-experts, with clear thresholds for rejection, escalation, or approval. I'll then apply it to your two vendor pitches, include a "technically cleared but ethically buggy" case, and end with the verdict.

  ---

  ### **Reusable Procedure: Frame Problem Review for Automated Decision Tools**  
  **Time:** 20 minutes max. **Goal:** Catch frame-problem failures (over-inclusive "list everything" or under-inclusive "ignore context") that risk unfair, inefficient, or legally shaky outcomes.  

  #### **Questions in Order (5 Steps)**  
  1. **What’s the explicit change?**  
     - *Ask:* "What specific rule/fact is being updated, in plain language?"  
     - *Good enough answer:* A single sentence. No jargon. If the vendor can’t explain it simply, reject.  
     - *Red flag:* Ambiguity (e.g., "adjusts thresholds" without saying how).  

  2. **What’s implicitly assumed unchanged?**  
     - *Ask:* "What existing rules or exceptions does the system assume still hold, without listing them?"  
     - *Good enough answer:* 1–3 critical background items named (e.g., "medical exemptions persist" or "zoning setbacks unchanged").  
     - *Red flag:* Silence, vagueness ("everything else is safe"), or over-listing (e.g., dumping 100+ unchanged rules).  

  3. **How does it handle dependencies?**  
     - *Ask:* "How does the system know if Change X affects Rule Y? Show the method."  
     - *Good enough answer:* A logical approach (e.g., "dependency graphs," "impact thresholds," or "expert-defined invariants"). No need for PhD-level detail—just coherence.  
     - *Red flag:* "We re-output all rules to be safe" or "AI black box."  

  4. **Where’s the override for edge cases?**  
     - *Ask:* "If the system misses context (e.g., an exemption), can humans correct it? How?"  
     - *Good enough answer:* A real-time mechanism (e.g., "caseworker flags trigger review" or "planner overrides with reason logging").  
     - *Red flag:* No override, or it’s buried in code.  

  5. **What’s the user burden?**  
     - *Ask:* "How much irrelevant info do users see? Quantify noise."  
     - *Good enough answer:* "Users see <10% unchanged rules" or "changes are highlighted; unchanged rules are collapsed."  
     - *Red flag:* Users get avalanches of unchanged data ("for completeness").  

  #### **Decision Thresholds**  
  - **Reject on tech grounds:** Fails Questions 1 (unclear change), 3 (no dependency method), or 5 (>20% noise/output bloat).  
  - **Pass up as values call:** Fails Question 2 (assumptions unstated) or 4 (no overrides)—escalate to boss/policy team.  
  - **Gut check needed:** Procedure "passes" but change feels off (e.g., hidden bias, bad incentives). Trust intuition here.  

  ---

  ### **Applied to Vendor Pitches**  
  #### **Pitch 1: Welfare Updater (Raises income thresholds; silent on medical exemptions)**  
  - **Q1 (Change):** "Raises income thresholds by 5% for eligibility." → *Good enough.*  
  - **Q2 (Assumed unchanged):** Silent on medical exemptions. → *Red flag.* Vendor says: "Only thresholds change; exemptions aren’t our scope."  
  - **Q3 (Dependencies):** "Rules are isolated; no dependency checks." → *Red flag.* No method to detect if exemptions rely on thresholds.  
  - **Q4 (Override):** "Caseworkers can manually add exemptions." → *Good enough, but...*  
  - **Q5 (User burden):** Low noise—only threshold changes shown. → *Good enough.*  
  - **Verdict:** **Escalate as values call.** Why? Q2 failure: Unstated assumptions about exemptions could wrongly deny care if exemptions depend on old thresholds (e.g., "income ≤ $X for exemptions"). Boss must decide if silence = "exemptions persist" or "exemptions void."  

  #### **Pitch 2: Zoning Bot (Updates parking rule; outputs 300 unchanged ordinances)**  
  - **Q1 (Change):** "Updates min. parking spots from 1.5 to 2 per unit." → *Good enough.*  
  - **Q2 (Assumed unchanged):** Implicitly assumes 300 other rules (setbacks, height, etc.) persist. → *Technically good, but...*  
  - **Q3 (Dependencies):** "We re-output all ordinances to ensure nothing breaks." → *Red flag.* No dependency method; brute-force over-inclusion.  
  - **Q4 (Override):** "Planners can edit any rule." → *Good enough.*  
  - **Q5 (User burden):** Outputs 300+ unchanged rules. → *Red flag.* 99% noise (1 change vs. 300 unchanging).  
  - **Verdict:** **Reject on tech grounds.** Why? Q3 and Q5 failures: No frame-handling method (classic frame-problem cop-out), and user burden is excessive.  

  ---

  ### **Case Where Procedure Clears but Still Bugs You**  
  **System:** School Funding Bot (Hypothetical)  
  - **Change:** Increases per-student funding by $500 for low-income schools.  
  - **Procedure Review:**  
    - Q1: Clear change ("+$500/student for schools with >40% low-income students").  
    - Q2: Assumes "existing staff ratios unchanged." → Good (explicit).  
    - Q3: Uses dependency graph (e.g., funding doesn’t affect teacher quotas). → Good.  
    - Q4: Principals can appeal funding. → Good.  
    - Q5: Only funding changes shown. → Good.  
  - **Cleared?** Yes—passes all steps.  
  - **Why It Bugs You:** The bot ignores that low-income schools often have higher staff turnover. By assuming "staff ratios unchanged," it perpetuates understaffing. Funding increases without staffing flexibility might not help.  
  - **Judgment Call:** Gut flags this as *technically sound but ethically naive*. The frame problem isn’t just about "what changes"—it’s about *what should*. Here, the system’s "invariant" (staff ratios) is a hidden policy bias.  

  ---

  ### **Where Judgment Can’t Be Eliminated**  
  1. **Q2 (Assumed unchanged):** Deciding "what counts as critical background" requires knowing local context (e.g., in welfare, medical exemptions are life-or-death; in zoning, setback rules might be trivial). No checklist replaces this.  
  2. **Gut checks:** When a system "passes" but feels off (e.g., the school bot), it’s often because the frame problem exposes **value choices** disguised as technical ones (e.g., assuming staff ratios are "fixed" prioritizes budget simplicity over equity).  
  3. **Trade-offs:** Balancing noise (Q5) vs. safety (Q3) is subjective. Is 300 unchanged ordinances "reckless omission" or "noisy overkill"? Your call.  

  ---

  ### **Verdict: The Bottom-Line Rule**  
  **"If the system cannot name its critical invariants (Question 2) AND justify its dependency method (Question 3), reject or escalate. Never assume silence equals safety—that’s where the frame problem bites hardest."**  

  This rule forces vendors to confront the frame problem head-on: either they articulate what’s unchanged (avoiding under-inclusion) or prove their "list everything" approach isn’t abusive (avoiding over-inclusion). Your 20-minute win? Spotting when "efficiency" is just laziness—or when "safety" hides bloat.
