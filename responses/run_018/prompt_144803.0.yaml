  - **Evidential Decision Theory (EDT)**: An agent using EDT chooses actions based on the evidence they provide for desirable outcomes. It uses conditional probabilities.
  - **Causal Decision Theory (CDT)**: An agent using CDT chooses actions based on the causal effect they have on outcomes. It uses causal models and typically ignores evidence that doesn't imply causation.
  - **Updateless Decision Theory (UDT)**: This is a decision theory that considers the logical implications of one's decision algorithm. It chooses the action that would be best if it were the output of a fixed decision algorithm that is applied in all possible situations (including counterfactual ones). It is "updateless" because it does not update on the fact that it is in a particular situation but rather considers the entire set of possible situations.

  Now, let's see how each of these theories would handle the first four decisions:

  1. **Newcomb's problem**:
