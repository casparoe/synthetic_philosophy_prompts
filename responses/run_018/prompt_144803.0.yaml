  But we already have counterfactual mugging to distinguish EDT and UDT.

  So to summarize:

  - The character (following UDT) would cooperate in the given PD with a 3%-divergent copy.
  - The rule she is running is Updateless Decision Theory (or Functional Decision Theory).
  - The sharp case that distinguishes UDT from EDT is counterfactual mugging: UDT pays, EDT doesn't.

