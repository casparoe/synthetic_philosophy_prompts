answer: |-
  Based on your character's established verdicts, she consistently follows **Updateless Decision Theory (UDT)** or its close variant, **Functional Decision Theory (FDT)**. These theories prioritize the *logical output of one's decision algorithm* across all possible worlds, including counterfactual ones, rather than updating on observed evidence (like EDT) or causal interventions (like CDT). Let's break this down step by step, addressing your questions about the new Prisoner's Dilemma (PD) scenario, alternative rules, and distinguishing cases.

  ### 1. **Would she cooperate against the 3%-divergent copy?**
     - **Yes, she cooperates.**  
       In UDT/FDT, your character views her decision as a *fixed output of her algorithm* that must be optimized across all logically possible scenarios, including those where her copy behaves differently due to the flipped bit. Here's her reasoning:
       - She knows her copy shares nearly identical source code, creating strong **logical correlation** (i.e., their decisions are entangled). With a 97% agreement rate, they likely "cooperate together" or "defect together" in most hypothetical worlds.
       - She calculates the expected utility (EU) of her strategy globally:
         - If she cooperates:  
           - 97% chance the copy cooperates → Mutual cooperation → High reward (e.g., +3 utility).  
           - 3% chance the copy defects → She gets suckered (e.g., 0 utility).  
           **EU(cooperate) ≈ (0.97 × 3) + (0.03 × 0) = 2.91**  
         - If she defects:  
           - 97% chance the copy defects → Mutual defection → Low reward (e.g., +1 utility).  
           - 3% chance the copy cooperates → She exploits the copy (e.g., +5 utility).  
           **EU(defect) ≈ (0.97 × 1) + (0.03 × 5) = 1.12**  
       - Cooperation yields higher EU (2.91 > 1.12), so she cooperates.  
     - **Threshold note**: UDT/FDT uses a utility-maximization threshold, not a fixed correlation threshold. Cooperation remains optimal as long as the probability of mutual agreement exceeds ~71.4% (derived from solving `3p = 5 − 4p` for mutual cooperation vs. exploitation). At 97% agreement, cooperation clearly wins.

  ### 2. **What rule is she running?**
     - **Core rule: Updateless Decision Theory (UDT) or Functional Decision Theory (FDT)**.  
       This explains *all four* of her prior verdicts:  
       - **Newcomb's problem**: She one-boxes because her decision algorithm's output (taking one box) is logically correlated with the predictor's accuracy—choosing one box "controls" the counterfactual where the box is full.  
       - **PD with an exact copy**: She cooperates because identical algorithms imply perfect logical correlation—cooperation is the Pareto-optimal joint outcome.  
       - **Smoking lesion**: She doesn't smoke because smoking is evidence of the lesion (and thus cancer), and UDT/FDT treats this evidence as a logical correlation between her decision and the outcome.  
       - **Counterfactual mugging**: She pays because UDT/FDT commits to a policy (e.g., "pay if asked") that maximizes utility across counterfactual branches (e.g., the coin-toss world where she gains $10,000).  
     - **Key UDT/FDT trait**: She ignores "local" observations (e.g., Omega not showing up) and focuses on the **global optimal policy** for her algorithm. The 3%-divergent PD fits perfectly: she cooperates to uphold the strategy that works best in the vast majority of correlated worlds.

  ### 3. **Which other rules fit her first four verdicts?**
     - **Evidential Decision Theory (EDT)** fits the *first three* verdicts but **fails counterfactual mugging**:  
       - EDT chooses actions based on *evidence* they provide for desired outcomes.  
         - Newcomb: One-boxing implies the predictor likely filled the box → correct.  
         - PD copy: Cooperating implies the copy likely cooperates → correct.  
         - Smoking lesion: Not smoking implies low cancer risk → correct.  
         - Counterfactual mugging: Paying provides no evidence of a benefit (Omega isn't there!) → EDT refuses to pay. **But your character pays**, so EDT is ruled out.  
     - **Causal Decision Theory (CDT)** **fails all four verdicts**:  
       - CDT acts based on *causal interventions* (e.g., "If I do X, what happens?").  
         - Newcomb: Two-boxes (taking the box can't causally affect the prediction).  
         - PD copy: Defects (no causal link to the copy's choice).  
         - Smoking lesion: Smokes (no causal link from smoking to cancer).  
         - Counterfactual mugging: Doesn't pay (no causal benefit).  
       - Your character's choices contradict CDT.  
     - **TDT (Timeless Decision Theory)** is often synonymous with UDT/FDT and fits perfectly.  
     - **Summary**: Only UDT/FDT (or variants) fit all four verdicts. EDT fits the first three but fails the fourth; CDT fits none.

  ### 4. **Sharp case to distinguish rules: Counterfactual Mugging**
     - **The test**:  
       - **Setup**: Omega flips a fair coin. Heads: Omega asks for $100. Tails: Omega doesn't appear. If you pay when asked, Omega rewards you with $10,000 in the *tails* counterfactual. After a tails flip, Omega doesn't show up—but you can still choose to "pay" voluntarily.  
       - **Distinctions**:  
         - **UDT/FDT**: Pays. Reasons: "My algorithm's policy must output 'pay' to get $10,000 in the counterfactual tails world."  
         - **EDT**: Doesn't pay. Reasons: "Paying now provides no evidence of winning $10,000 (Omega isn't here!)."  
         - **CDT**: Doesn't pay. Reasons: "Paying can't cause $10,000 to appear (the coin is already tails)."  
       - **Why it's sharp**: This directly pits *logical correlation* (UDT/FDT) against *local evidence* (EDT) and *causal intervention* (CDT). Your character pays, which is only consistent with UDT/FDT.

  ### Final Verdict for Your Plot
  - **She cooperates** in the 3%-divergent PD, reinforcing her UDT/FDT alignment.  
  - **Narrative angle**: Emphasize her "algorithmic integrity"—she cooperates not from empathy or fairness, but because it's the optimal output of her code in a logically entangled multiverse. The flipped bit introduces a "noise" she must tolerate to uphold her policy.  
  - **Contrast**: If divergence exceeded ~71.4%, she'd defect coldly—highlighting the utilitarian core of UDT/FDT.

  This maintains perfect consistency with her prior choices and provides a clear philosophical anchor for her character. If you'd like deeper dives into UDT mechanics or dialogue snippets for authenticity, let me know!
