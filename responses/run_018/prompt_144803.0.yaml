  Therefore, the character seems to be following UDT.

  Now, the new scenario: Prisoner's Dilemma against a copy that has a 3% divergence due to a flipped bit in the seed.

  In UDT, the agent considers the logical correlation between her decision and the copy's decision. Since the copy was built from the same source code but with a small perturbation, there is still a high logical correlation. However, because of the perturbation, the correlation is not 100%.

  In UDT, the agent chooses a policy (a function from observations to actions) that maximizes the expected utility, where the expectation is taken over all possible worlds (including the possible variations of the agent's algorithm that might occur due to the perturbation). Specifically, in this case, the agent must consider that her decision algorithm and the copy's are almost the same, but with a 3% chance of divergence.

  How would UDT reason?

  - The agent knows that the copy is running an algorithm that is identical to her own except for a small perturbation. Therefore, in most cases, the copy will do the same as she does. But there is a 3% chance that the copy will do something else.

  - The agent must choose a strategy (a function) that is output by her decision algorithm. She must choose a strategy that, when applied by both her and the copy (with the 3% chance of independent behavior), maximizes the expected utility.

