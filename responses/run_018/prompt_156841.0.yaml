prompt: |-
  You're an expert metaphysician specializing in causation and omission, so please think carefully—maybe start with a quick brainstorm of the competing rules, then work through the cases step by step.

  My philosphy tutor has given these verdicts about whether an ommission was a cause of harm:

  - Gardener promises to water a neighbor's plants while they're away, forgets, plants die. Verdict: yes, it's a cause.
  - Passerby sees a collapsed person in a park, assumes they're napping, keeps walking; they were already dead from a heart attack an hour earlier. Verdict: no.
  - Lifeguard on duty ignores a swimmer in distress; swimmer drowns. Verdict: yes.
  - Factory manager decides against buying an optional, non-legally-required filter; years later a worker gets sick from an emission that filter wouldn't have caught anyway. Verdict: no.
  - Freelance coder turns down an optional logging task; a bug slips through that the log wouldn't have recorded. Verdict: no.

  Next case for her: a tourist who doesn't speak the local language is walking through a crowded plaza near a construction site. He sees a loose beam about to fall on a distracted worker, recognizes the universal danger symbol, but stays silent because he doesn't want to cause a panic and has no legal or professional duty to intervene. The beam falls and injures the worker, and if he had gestured the worker would have moved.

  Predict her verdict on whether his ommission caused the injury. Say which implicit rule she's running—normative duty, counterfactual dependence, baseline deviation, or something else—identify the closest analog in her track record, and say honestly whether her precedents genuinely underdetermine this one. Then tell me what principle she'd be adopting if she says yes, and what principle if she says no. Finally, describe the one further case that would best tell us which rule is really doing the work.

  Give me brief reasoning first, then wrap the deliverables in this JSON object with exactly these fields:

  {
