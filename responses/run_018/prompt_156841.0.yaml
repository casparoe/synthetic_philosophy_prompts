  **Reasoning Brief:**  
  The tutor's pattern suggests two necessary conditions: (1) **counterfactual dependence** (harm wouldn't have occurred *but for* the omission), and (2) a **normative duty** (professional, contractual, or role-based obligation). Cases 1 & 3 have both (gardener's promise, lifeguard's job), hence "yes." Cases 2 & 5 lack counterfactual dependence (harm would've happened anyway), so "no." Case 4 lacks both. The tourist case *has* counterfactual dependence (gesturing would've prevented harm) but *lacks* normative duty (no legal/professional obligation). The precedents don't address this combo, making it underdetermined. The closest analog is the lifeguard (counterfactual + duty → yes), but the tourist lacks the duty element. If the tutor says "yes," she's endorsing mere moral opportunity as sufficient; if "no," she's strictly requiring normative duty.

