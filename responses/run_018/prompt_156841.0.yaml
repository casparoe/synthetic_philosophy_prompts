    "implicit_rule": "normative-duty / counterfactual-dependence / baseline-deviation / other (specify)",
    "closest_analog": "short label",
    "underdetermined": "true or false",
    "principle_if_yes": "one sentence",
    "principle_if_no": "one sentence",
    "settling_case_description": "brief description",
    "reasoning_brief": "short paragraph"
  }

