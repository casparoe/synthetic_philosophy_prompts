  First, they need desiderata: phenomena to explain, distinctions to preserve, and constraints to satisfy. They also want to know which criteria are non-negotiable versus camp-specific. Plus, they're concerned about potential contradictions between cyclical and linear elements, like whether civilizations can have both a fixed lifespan and adaptive transformation.

