answer: |-
  You've grasped the core logic brilliantly! Let's untangle this fascinating paradox step-by-step, addressing your specific questions:

  **1. The Core Logic (Your Reconstruction is Spot On):**
  *   **Premise 1:** "Horse" (马, *mǎ*) signifies the *shape/form* (形, *xíng*) or essential category (being an equine). It includes *all* horses (white, black, yellow, etc.).
  *   **Premise 2:** "White" (白, *bái*) signifies the *color* (色, *sè*) property.
  *   **Premise 3:** "White horse" (白马, *bái mǎ*) signifies the *compound* of the specific color property ("white") *and* the shape property ("horse").
  *   **Key Inference:** The *denotation* (the set of things referred to) of "horse" is wider than the denotation of "white horse." "Horse" includes all colored horses; "white horse" only includes white-colored horses.
  *   **Conclusion:** Therefore, "white horse" is not identical to "horse" (白马非马, *bái mǎ fēi mǎ*). The terms refer to different things (different sets, different conceptual complexes).

  **2. Ontology vs. Linguistics?**
  It's **primarily linguistic/conceptual**, but with **profound ontological implications** according to the Mingjia:
  *   **Linguistic Focus:** The argument hinges on the *reference* and *meaning* of *names* (名, *míng*). It demonstrates that compound names ("white horse") function differently and refer more specifically than simple names ("horse").
  *   **Ontological Implication:** For the Mingjia (especially Gongsun Long), this wasn't *just* about words. They argued names carve up reality. If "white horse" and "horse" name different things conceptually, they point to different aspects or configurations of reality. Reality itself is composed of discrete attributes (whiteness, horseness) that combine temporarily. So, the white horse *as a specific combination* is not identical to the abstract universal "horse". It challenges naive realism about objects.
  *   **Does it collapse if purely linguistic?** Not really, but the *sting* changes.
      *   Linguistically, it remains a valid point about reference: "horse" and "white horse" are not co-extensive terms; one is broader than the other.
      *   The *shocking conclusion* ("a white horse is not a horse") relies on interpreting "is" as strict identity (*is identical to*). If we interpret "is" as class membership (*is an instance of*), the conclusion seems absurd. The Mingjia deliberately exploited this ambiguity to challenge common sense and force deeper analysis of language-reality links. Purely linguistically, it highlights the importance of scope and compositionality in naming.

  **3. Reference Magnetism? (A Modern Lens)**
  Your intuition here is insightful! While **not** a concept Gongsun Long explicitly used, it's a useful modern analogy to understand the *effect*:
  *   **"Horse" (Simple Kind Term):** Acts like a magnet attracting *all* instances sharing the core attribute (equine form/shape), regardless of color. Its "magnetic pull" is based on the essential characteristic.
  *   **"White Horse" (Compound Description):** Its "magnetic pull" is weaker and more specific. It *only* attracts objects possessing *both* attributes (equine form/shape *and* whiteness). It's "stuck" to the perceptual complex.
  *   **Kind Terms vs. Descriptions?** Yes, this is essentially the distinction Gongsun Long is exploring! He's highlighting the difference between:
      *   **Kind Term/Universal ("Horse"):** Points to the abstract category/essence.
      *   **Definite Description/Complex Particular ("White Horse"):** Points to a specific instance defined by multiple attributes. He's arguing they function differently and refer to different *things* (the universal vs. the composite particular). This is a remarkable anticipation of a core distinction in modern philosophy of language.

  **4. The Author: Gongsun Long (公孫龍, Gōngsūn Lóng)**
  *   You're right to clarify! **Gongsun Long** (c. 325–250 BCE) is the author of the *Gongsun Longzi*, which contains the "White Horse Dialogue." He's the most famous (and notoriously paradoxical) representative of the Mingjia.
  *   **Hui Shi** (惠施, Huì Shī, c. 380–305 BCE) was his contemporary and likely debating partner/antagonist. Hui Shi also engaged in paradoxes and logical puzzles ("The ten theses of Hui Shi"), often focusing on relativity, spatial/temporal boundaries, and the unity of opposites. Their styles differed: Gongsun Long was more analytical and rigid about names/reality; Hui Shi was more relativistic and dialectical. It's easy to mix them up!
  *   **Mingjia (名家) - Spelling:** You got it right! 名家 (*Míngjiā*) - "School of Names" or "School of Terminologists."

  **5. Parallel Arguments & Structure in Mingjia**
  Absolutely! The Mingjia used this analytical structure elsewhere:
  *   **"Hardness and Whiteness" (堅白論, *Jiān bái lùn*):** Gongsun Long's other famous paradox. He argues that the hardness and whiteness of a stone are separate attributes perceived by different senses (touch vs. sight). When you see the white stone, you don't perceive its hardness; when you feel its hardness, you don't perceive its whiteness. Therefore, "hardness" and "whiteness" are separate "self-natures" that don't inherently belong together in the stone. The stone is just a temporary locus for these independent universals. *Structure:* Decomposing an object into its constituent attribute-universals and arguing for their independence.
  *   **"Pointing and Things" (指物論, *Zhǐ wù lùn*):** Explores the relationship between "pointers" (names/concepts) and the "things" they refer to, arguing they are distinct. *Structure:* Distinguishing the signifier from the signified.
  *   **Size/Shape/Relation:** While less famous than "White Horse" or "Hard-White," the Mingjia approach inherently applies to any attribute (size, shape, spatial relations like "left/right"). Their core method was decomposing complex phenomena into simple, discrete attributes (*zhi*, 指 - "pointers," "marks," "attributes") and analyzing how names combine to refer to their combinations.

  **In Summary:**

  1.  **Logic:** A = Horse (universal, all instances). B = White (attribute). C = White Horse (composite: A+B). C ≠ A because the reference of C is narrower than A. Identity requires identical reference.
  2.  **Focus:** Primarily linguistic/conceptual analysis of naming/reference, but with intended radical ontological implications (nominalism: universals are just names; reality = attributes combining).
  3.  **Reference Magnetism:** Useful analogy. "Horse" magnet attracts all instances by essence; "White Horse" magnet only attracts composites with both attributes.
  4.  **Kind Terms vs. Descriptions:** Yes, Gongsun Long is fundamentally exploring this distinction and arguing they refer to different *types* of things (the universal vs. the composite particular).
  5.  **Author:** **Gongsun Long** (White Horse, Hard-White). Hui Shi was a contemporary with a different style.
  6.  **Structure Elsewhere:** Used repeatedly by Mingjia, especially in decomposing objects into independent attributes (Hardness/Whiteness being the prime example).
  7.  **Mingjia (名家):** Correct spelling!

  The "White Horse" argument isn't meant to be a practical denial that a white horse is a type of horse in everyday conversation. It's a provocative philosophical tool designed to shatter complacent assumptions about language, reality, and identity, forcing a deeper examination of how we categorize the world. Its power lies precisely in the tension between its linguistic validity and its seemingly absurd concrete conclusion.
