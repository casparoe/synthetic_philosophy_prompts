answer: |-
  Here's your desiderta distilled—core demands for any account of simmball efficacy in a careenium. No fluff, just the scaffold.

  ---

  ### **Non-Negotiables** (Cases It Must Get Right)
  1. **Trigger vs. Correlation**:  
     - Must distinguish a simmball *causing* a substrate reconfiguration (e.g., a ball collision forcing a gate flip) from merely correlating with one (e.g., a ball pattern coinciding with a background process).  
     - *Fail if*: All ball actions reduce to "the substrate was going to do that anyway."

  2. **Causal Bite vs. Ghost Tracking**:  
     - Must explain *how* simmballs exert force—not just "information passes." What mechanics make a ball *push*?  
     - *Fail if*: Simmballs are "just data" with no physical leverage.

  3. **Layered Reality**:  
     - Must preserve *both* levels:  
       - **Substrate physics** (e.g., transistor flips, energy laws).  
       - **Ball dynamics** (e.g., collisions, trajectories).  
     - *Fail if*: It collapses balls into substrate noise *or* treats balls as floating in a vacuum.

  ---

  ### **Forbidden Collapses** (Distinctions That Must Hold)
  - **Causal Push ≠ Informational Tracking**:  
    Tracking is passive (a shadow); pushing is active (a piston). Accounts must show the piston.  
  - **Layered Substrate ≠ Flat Ontology**:  
    Balls aren’t "just" substrate—they’re patterns *with their own rules* that constrain/use substrate mechanics.  
  - **Abstract Symbol ≠ Embodied Token**:  
    If balls are symbols (e.g., "representing" energy), how do they *physically* engage? Tokens must be *things that hit*.

  ---

  ### **Puzzles to Dissolve**
  - **The Shoving Problem**: How can non-physical patterns (balls) impose force on physical substrate? (*Magic is forbidden.*)  
  - **Downward Causation for Balls**: How do ball-level events (e.g., a merger) *control* lower-level substrate behavior without violating physics?  
  - **Substrate Independence ≠ Causal Independence**: If balls can run on any hardware, how do they *grip* this particular substrate to move it?

  ---

  ### **Tensions & Tradeoffs**  
  ⚠️ **Fatal Conflict**: **Substrate Independence + Direct Downward Efficacy**  
  - If simmballs are truly substrate-agnostic (abstract patterns), they *can’t* directly push *this specific physics*—they’d need a substrate-specific "interface." Demand both = magical thinking.  
  - *Concession*: You can have *mediated* downward causation (e.g., balls exploit substrate hooks) or ditch full independence.

  **Camp Preferences** (Debatable, Not Core):  
  - **Eliminativism** vs. **Robust Emergence**: Are balls "real" or just useful talk?  
  - **Token Physicality**: Must balls *be* physical, or can abstracta cause?  
  - **Granularity**: Do only "complex" balls push, or do all?

  ---

  ### **Usual Suspects Scored Against Criteria**  
  *(Weight on gaps, not grades)*  

  1. **Substrate Reductionism** ("Balls are illusions"):  
     - ✅ Gets *substrate physics* right.  
     - ❌ **Fails Trigger vs. Correlation**: Balls don’t cause; they’re epiphenomena.  
     - ❌ **Collapses layers**: No ball-level mechanics. Ignores causal bite.  

  2. **Emergent Symbolism** ("Balls are real patterns"):  
     - ✅ Preserves **layered reality**: Balls have autonomous rules.  
     - ⚠️ **Struggles with Shoving Problem**: How do symbols *push*? Often handwaves "downward causation."  
     - ❓ **Tension w/ Substrate Independence**: If balls depend on emergent laws, are they hardware-bound?  

  3. **Correlation-Only** ("Balls track, don’t act"):  
     - ✅ Clean on **substrate primacy**.  
     - ❌ **Fails Causal Bite**: Balls are passengers, not drivers. Can’t explain *triggered* reconfigurations.  
     - ❌ **Collapses Push/Tracking**: All causation is bottom-up.  

  ---

  ### **The Viable Path**  
  To satisfy non-negotiables:  
  - **Mechanics, not magic**: Simmballs need *embodied hooks* (e.g., ball states occupy substrate resources, blocking/forcing transitions).  
  - **Downward mediation**: Balls act *through* substrate constraints (e.g., a ball’s position limits possible gate flips).  
  - **Token embodiment**: Balls aren’t abstract—they’re *physical states* of the careenium, playing dual roles (symbolic *and* causal).  

  **Sacrifice**: Full substrate independence. Balls must be *implemented*, not free-floating.  

  **Your Suspicion Confirmed**: Substrate independence + direct downward shoving **is incoherent**. Pick one, or reframe downward push as *constrained emergence*.  

  No theory gets everything—but the right one won’t ghost causation.
