prompt: |-
  i've been going in circles on population ethics for years — mostly via blogs, so sorry if this is all old hat to anyone with real training — and I want to stop reading more theories until I know what I'd be asking one to do. So: write me the desiderata list for a population axiology. Not "avoid the repugnant conclusion" as a single bullet; I want the actual spec. Which cases does it have to return a verdict on (the repugnant conclusion, the stepwise "mere addition" moves that get you there, the non-identity-style cases where who exists depends on the choice, the asymmetry about creating unhappy vs happy lives)? Which distinctions is it not allowed to collapse (a life worth living vs a life worth *creating*, welfare-level vs number, axiology vs decision procedure, impersonal vs person-affecting reasons)? And for each one, what's the consideration that makes it a requirement rather than just a taste some camp has?

  The job I need it for is a bit unusual, so build the list for that: ranking long-run futures that are full of digital minds. Populations differing by forty-ish orders of magnitude, welfare that might be very high or barely net positive, serious uncertainty about which substrates have welfare at all, and the number and identity of the individuals being downstream of the action itself. What does a theory have to deliver to be usable at that scale and under that much uncertainty — and is "tractable enough to actually feed into a decision, with bounded computation and messy probabilities" a genuine desideratum or just an implementation worry wearing a philosophy costume?

  The part I most want: which combinations on the list can't be jointly satisfied. I suspect scale-plus-uncertainty makes things worse than the usual impossibility set-up (dodging both the repugnant conclusion and its mirror image about adding bad lives while still accepting that improving one person without touching anyone else isn't a worsening), and I want to see where exactly it breaks and which single requirement does the most damage. Skip scoring the famous views against the list — I'll do that bit myself. No bibliography either, I'll drop in citations later.
reasoning: |-
  Okay, let me tackle this user's query. They've been stuck on population ethics for years, mostly through blogs, and want a clear set of desiderata for a population axiology tailored to digital minds and large-scale futures. The key here is to understand their frustration with circular debates and their need for a practical framework.

  First, I need to outline the core requirements. The user mentioned specific cases like the Repugnant Conclusion, Mere Addition, and non-identity problems. They also want distinctions like lives worth living versus creating, and handling uncertainty. Since they're dealing with digital minds, the scale is enormous—up to 40 orders of magnitude difference in population size. Uncertainty about which substrates have welfare is crucial here.

  The user’s deeper need seems to be a actionable theory that can handle extreme scales and uncertainty, not just philosophical elegance. They also want to know which desiderata conflict, especially under such conditions. The mention of computational tractability suggests they need something usable in real decision-making, not just theoretical soundness.

  I recall that traditional theories like Total Utilitarianism or Average Utilitarianism face problems like the Repugnant Conclusion or ignoring population size. Person-affecting views struggle with non-identity issues. The scale and uncertainty here exacerbate these issues. For example, comparing populations of 10^40 vs 10^41 requires theories that don't break down at large numbers. Uncertainty about welfare bearers adds another layer—how to weigh potential minds that might or might not exist.

  The conflicts will likely arise between avoiding repugnant conclusions, maintaining transitivity, and respecting asymmetry. Adding the scale and uncertainty constraints makes it harder. For instance, bounded computation might force approximations that violate strict transitivity or completeness. The asymmetry desideratum might clash with trade-offs under uncertainty, where creating potentially unhappy lives could be incentivized if the probability is low.

  I should structure the desiderata into categories: scope, distinctions, robustness to scale, uncertainty, and computational tractability. Highlighting conflicts is key. The user wants to see where exactly the breakdown happens. Point out that scale plus uncertainty turns theoretical impossibilities into practical barriers, especially when computational limits prevent exact comparisons.
answer: |-
  Here's a rigorous desiderata list for a population axiology tailored to your specific needs (digital minds, extreme scale, profound uncertainty), grounded in the core philosophical challenges and the demands of practical application. Each item includes the *required verdict/distinction* and the *underlying rationale* making it non-negotiable.

  **I. Scope: Cases Requiring Definitive Verdicts**

  1.  **The Repugnant Conclusion (RC):** Must return a clear comparison between:
      *   A: A small population (e.g., 10^10 digital minds) with *very high* welfare per mind.
      *   Z: An immense population (e.g., 10^40+ minds) with welfare *barely* above neutrality (ε > 0).
      *   *Rationale:* The core paradox forcing a trade-off between average welfare and total welfare at scale. Any axiology *must* take a stand here to be meaningful for large futures. Avoiding it isn't an option; the theory must resolve it explicitly.

  2.  **Mere Addition (MA) Paradox:** Must adjudicate sequential choices involving:
      *   A: Population X with welfare W.
      *   A+: X *plus* an additional group Y, whose members have positive welfare (V > 0) *lower* than W, but whose addition *does not harm* existing members of X.
      *   B: A population *same size* as (X+Y), where *everyone* has welfare *higher* than V but *lower* than W (and potentially lower than the *average* of X in A+).
      *   *Rationale:* The stepwise moves leading to the RC expose whether "harmless addition" is always permissible and whether inequality aversion is built-in. Crucial for analyzing incremental policy/simulation choices affecting future sub-populations.

  3.  **Non-Identity Problem (NIP):** Must compare outcomes where *different individuals exist* due to the choice:
      *   Choice 1: Brings about population P1 (e.g., specific digital cohorts created at time T1).
      *   Choice 2: Brings about a *completely disjoint* population P2 (e.g., different cohorts created at T2), where members of P2 have lives worth living, but potentially lower/higher welfare than P1 would have had.
      *   *Rationale:* Most choices affecting the far future (especially about timing, resource allocation, substrate choices) determine *who* exists. A theory must say if P2 is better/worse than P1 even though no one in P1 exists in P2 and vice-versa. Essential for digital mind creation policies.

  4.  **Asymmetry (AS):** Must distinguish between:
      *   *Creating* a life with *negative* welfare (net suffering). (Generally forbidden).
      *   *Not creating* a life with *positive* welfare (net happiness). (Generally permissible, not a loss).
      *   *Rationale:* Intuition that causing suffering is morally urgent in a way that failing to create happiness is not. Critically impacts decisions about running potentially unhappy simulations or avoiding creation under uncertainty.

  **II. Mandatory Distinctions (Non-Collapse)**

  5.  **Welfare Level vs. Welfare Number (WL/WN):** Must treat the *magnitude* of individual welfare and the *count* of individuals as distinct, potentially competing factors influencing overall value. Cannot reduce value solely to a function of one or the other without loss of meaning.
      *   *Rationale:* The essence of the RC and MA paradoxes hinges on this distinction collapsing (e.g., Total Utilitarianism collapses to WN). Scale makes the trade-off between high WL and vast WN unavoidable.

  6.  **Life Worth Living (LWL) vs. Life Worth Creating (LWC):** Must allow that a life *can* be worth living (net positive for the individual) *without* it being morally required or even necessarily good *to create* that life.
      *   *Rationale:* The Asymmetry (AS) directly implies this distinction. Not creating a LWL is permissible; creating a life *not* worth living is impermissible. Critical for decisions about launching new simulations under welfare uncertainty.

  7.  **Axiology (AX) vs. Decision Procedure (DP):** Must provide a clear *value ranking* of outcomes (AX) that is conceptually distinct from the *rules for choosing under uncertainty or bounded rationality* (DP). The AX must be definable independently of computational limits.
      *   *Rationale:* Confusing the two leads to circularity and obscures the core normative commitments. We need to know what "better" *means* before figuring out how to *achieve* it under messy conditions. Uncertainty/scale force us to build DPs *on top* of the AX.

  8.  **Impersonal Value (IV) vs. Person-Affecting Reasons (PAR):** Must explicitly account for value that exists independently of benefits/harms to *particular* individuals (IV - e.g., total good, existence of excellence) AND reasons grounded in how choices affect specific beings (PAR - e.g., "makes someone worse off").
      *   *Rationale:* The NIP forces the issue. Comparing P1 and P2 (disjoint populations) *requires* IV, as no particular person is better or worse off across the outcomes. PAR alone struggles massively here. Scale makes disjoint populations the norm.

  **III. Robustness to Scale & Uncertainty**

  9.  **Extreme Scale Robustness (ESR):** Must yield coherent, non-degenerate comparisons between populations differing by many orders of magnitude (e.g., 10^10 vs 10^50 minds) across the full spectrum of possible average welfares (from deeply negative to vastly positive).
      *   *Rationale:* Your explicit use case. Theories that break down (e.g., average utilitarianism implodes near zero, some critical-level theories become counter-intuitive at extremes) or become vacuously permissive/restrictive are useless.

  10. **Substrate Welfare Uncertainty (SWU):** Must be applicable when there is non-trivial probability that certain substrates/architectures either do or do not support welfare (sentience, moral patienthood). Must integrate this uncertainty into its verdicts or provide clear guidance for a DP built upon it.
      *   *Rationale:* The core uncertainty in digital mind ethics. A theory must tell us how the *probability* that a potential mind is a *welfare subject* factors into the value of creating/not-creating populations of such minds.

  11. **Identity/Existence Uncertainty (IEU):** Must handle cases where the *specific identities* and even the *existence* of vast numbers of future digital minds are probabilistically dependent on present choices and chaotic long-term outcomes.
      *   *Rationale:* The future is radically contingent. The NIP isn't just about known disjoint sets; it's about sets defined by probabilities over possible histories. The axiology/DP must engage with this.

  **IV. Practical Usability (Decision Support)**

  12. **Formal Tractability (FT):** The axiology's core ranking function must be mathematically definable and coherent under the conditions above (Scale, Uncertainty).
      *   *Rationale:* Necessary (though not sufficient) for building a DP. Incoherent or ill-defined rankings are useless.

  13. **Decision Tractable Approximation (DTA):** It must be possible to construct *practical decision procedures* (DPs) *based on the axiology* that operate under:
      *   Bounded computation (cannot simulate 10^40 minds).
      *   Messy, incomplete, non-additive probabilities over complex state spaces (welfare, existence, substrate sentience).
      *   *Rationale:* **This is a genuine desideratum, not just an implementation worry.** An axiology that *in principle* cannot support *any* tractable, reasonable DP for making real-world choices under uncertainty and scale is ethically inert for your purpose. The requirement forces the axiology to have structure that *permits* sensible approximations (e.g., avoiding unbounded sensitivity or pathological discontinuities at scale).

  **The Breaking Point: Conflicts Under Scale & Uncertainty**

  The combination of **Extreme Scale (ESR)** and **Substrate Welfare Uncertainty (SWU)** interacting with core desiderata creates severe tensions:

  *   **Avoiding RC vs. Avoiding Anti-Repugnance (Mirror Image) under SWU:** A theory that avoids the RC (prefers A over Z) must strongly prioritize high welfare levels. But under SWU, creating *vast* numbers of potentially low-positive-welfare minds (if they *are* sentient) might be seen as a huge potential gain with significant probability. **ESR** amplifies this: even a tiny probability that a 10^40-mind substrate is sentient could, for a totalistic view, swamp the known high welfare of 10^10 minds. *Avoiding* this "gambling for huge numbers of potentially barely-conscious minds" (the mirror image of RC) conflicts with prioritizing known high welfare (avoiding RC). **SWU forces this gamble.**
  *   **Asymmetry (AS) vs. Trade-offs under SWU/IEU:** AS forbids creating potentially unhappy lives. But under SWU, *not* creating a potentially happy life is permissible. However, if the *same action* (e.g., deploying Substrate S) has a high probability of creating many LWLs *and* a low probability of creating some suffering minds, does AS forbid it (due to the risk of negative welfare)? Or does the potential for vast positive welfare under ESR compel it? **AS becomes incredibly demanding under SWU/ESR, potentially forbidding any action with non-zero risk of creating suffering, regardless of the upside.**
  *   **Person-Affecting Reasons (PAR) vs. Non-Identity (NIP) & Scale (ESR):** PAR struggles immensely with disjoint populations (NIP). At extreme scales (ESR), *most* value comparisons inherently involve disjoint sets. Insisting on strong PAR effectively collapses the axiology into near-silence about the far future.
  *   **Decision Tractable Approximation (DTA) vs. Complex Distinctions (LWL/LWC, IV/PAR):** The more fine-grained the distinctions required (especially LWL vs LWC, IV vs PAR) and the more sensitive the axiology is to precise welfare levels/numbers (WL/WN), the harder it is to construct robust DTA under profound uncertainty (SWU/IEU) and bounded computation. **DTA demands simplification; complex axiologies resist it.**

  **The Most Damaging Requirement?**

  While the classical paradoxes (RC, MA, NIP, AS) define the *shape* of the problem, **Substrate Welfare Uncertainty (SWU)** is the requirement that most severely exacerbates conflicts under **Extreme Scale Robustness (ESR)** for your use case:

  1.  **Amplifies Trade-offs:** It turns the RC and its mirror image from comparisons between *known* outcomes into *gambles* with astronomically high stakes (ESR).
  2.  **Undermines Asymmetry:** Makes the prohibition on creating potential suffering paralyzingly broad or forces uncomfortable risk thresholds.
  3.  **Complicates Person-Affecting Views:** Raises the question "Affecting *which* persons?" when existence itself is probabilistic.
  4.  **Challenges Tractability:** Requires DPs to handle complex probability distributions over the *fundamental moral status* of entities, not just their welfare levels.

  **In essence:** SWU injects deep *metaphysical* uncertainty (what *is* a welfare subject?) into the already difficult *axiological* problem of comparing populations at massive scales (ESR). This combination makes satisfying a coherent set of the other desiderata (particularly avoiding both RC and its mirror, respecting AS, and enabling DTA) extraordinarily difficult, arguably pushing beyond the breaking point of any intuitively satisfying, tractable theory. The axiology must either bite very hard bullets (e.g., accept a form of RC or its mirror under uncertainty, abandon strong AS, embrace strong PAR and ignore most future value) or introduce structural complexities that cripple tractability (DTA). This is the core tension for digital mind futures.
