answer: |-
  ## Dialogue: The Anchored Ideal vs. The Relative Scale

  **Characters:**
  *   **Clara:** Defends the classical global monotonicity principle (fixed ideal point).
  *   **Leo:** Advocates for a "localized monotonicity" view (ideal point rescaled relative to disagreement point).

  **(The scene: A whiteboard covered in set diagrams and utility axes.)**

  **Clara:** Leo, we keep circling back. The global monotonicity axiom is fundamental. If the feasible set `S` expands to `S'`, giving both players *more* potential gains without altering the *best* either could possibly achieve individually (`u1*`, `u2*`), and the disagreement point `d` is unchanged, neither player should be *worse off* in the new solution. It’s a minimal fairness condition: expansion purely in mutually beneficial directions shouldn’t harm anyone. Anchoring `u*` absolutely is crucial for this inter-comparison across different bargaining problems.

  **Leo:** I agree the *intuition* is compelling, Clara. No one should be punished by having *more* options that don’t threaten their counterpart’s potential. But my objection lies precisely in that anchoring. You fix `u*` in absolute utility space, independent of `d`. This assumes utility scales are fixed and comparable *across different scales of the problem itself*. When `d` shifts endogenously as `S` expands or contracts—especially with indivisibilities or discrete options creating non-convexities—fixing `u*` absolutely smuggles in an arbitrary normalization. It imposes symmetry where the underlying structure might be asymmetric relative to the *actual* disagreement threat.

  **Clara:** You argue my fixed `u*` is arbitrary? It’s defined purely within the problem: `u1* = max{u1 | (u1, u2) ∈ S, u2 ≥ d2}`, similarly for `u2*`. It’s an objective feature of `S` and `d`. Where is the arbitrary normalization?

  **Leo:** The normalization isn't *within* a single problem, Clara. It's in comparing the solution across problems where the *scale* of `S` relative to `d` changes significantly. Consider two scenarios: 1) Bargaining over splitting $10, `d = (0,0)`, `u* = (10,10)`. The KS solution is (5,5). 2) Bargaining over splitting $100, but now `d = (90,90)` because both have strong outside options. `u*` is still technically (100,100). Global monotonicity says expanding from S1 ($10, d=(0,0)) to S2 ($100, d=(90,90)) shouldn’t leave either worse off. KS gives (5,5) in S1 and (95,95) in S2 – both gain. But look: in S2, the *actual surplus* above `d` is only $20! The `u*=(100,100)` is utterly disconnected from the relevant bargaining range, which is `[90,100]` for each player. Anchoring `u*` at (100,100) makes the KS ratio demand 95-90=5 utils per player, while in S1, it demanded 5 utils. But are these utils comparable? The *relative* scale of the surplus above `d` shrank dramatically. Fixing `u*` globally treats a util gained near `d=(0,0)` identically to a util gained near `d=(90,90)` in this new context, ignoring the compression of the feasible gains. It implicitly assumes the origin `(0,0)` has fixed normative significance, which it doesn't when `d` shifts. The "ideal" should reflect aspirations relative to the *current* threat point, not an absolute zero.

  **Clara:** *[Nods thoughtfully]* That’s a fair point about scale relativity when `d` shifts dramatically. My fixed `u*` does assume that utility differences are comparable regardless of their absolute level relative to some origin, which is a strong cardinal assumption. I concede that in your example, the KS solution using the absolute `u*` feels misleading; it doesn’t reflect the intense competition over a small surplus. So, you propose rescaling the ideal point relative to `d`?

  **Leo:** Precisely. In non-convex environments or when options are discrete, `d` isn't passive; it changes with the available alternatives. The "ideal" should be defined as the best achievable *above `d`*. Essentially, we should map the problem onto the normalized gains space: `S' = {(u1 - d1, u2 - d2) | (u1, u2) ∈ S}`, set the new `d'` to `(0,0)`, and define the ideal point *within this normalized space*: `u'* = (max (u1 - d1), max (u2 - d2)) over S'`. Then apply KS (or monotonicity) in *this* space. Monotonicity becomes local: if the set of *gains* expands in directions beneficial to both, neither's gain should decrease. This rescaling respects the relativity of utility scales to the prevailing disagreement point.

  **Clara:** But Leo, doesn’t this localized rescaling wreak havoc on uniqueness and comparative statics? If we rescale every time `d` shifts, even slightly, the solution becomes path-dependent. Imagine a sequence of expansions: `S0 -> S1 -> S2`. Applying your rescaling at each step might lead to a different outcome than applying it once at the end to `S2`, depending on how `d` evolved. Global monotonicity with a fixed `u*` gives a unique, path-independent solution. Your approach seems to sacrifice determinacy. How can we have normative principles if the outcome depends on the arbitrary sequence of bargaining history?

  **Leo:** *[Sighs]* You’re right; that’s the trade-off. Path dependence is a genuine weakness. Conceding that, determinacy *is* desirable. But Clara, doesn’t your path independence rely precisely on that fixed, absolute utility scale I find suspect? The uniqueness comes at the cost of imposing an external cardinal symmetry. In many real-world negotiations—like dividing discrete jobs, houses, or inheritances—the relevant `d` *does* shift endogenously as options appear or disappear, and the *stakes* relative to the current fallback position are what matter psychologically and strategically. My localized view captures that relativity. While it might sacrifice unique cross-contextual comparability (comparing outcome A in context X directly to outcome B in context Y), it ensures the solution is normatively responsive to the *local* bargaining context defined by `S` and the *current* `d`. The comparative statics are still determinate *for a given `d`*; the indeterminacy arises only when comparing across problems with *different* `d`'s relative to the scale of `S`.

  **Clara:** So, your defense is that uniqueness *across fundamentally different bargaining contexts* (defined by different `d` scales) is less important than normative responsiveness *within* a context? That’s valid for descriptive realism in discrete cases. But doesn’t your approach risk making bargaining theory purely contextual, losing its general normative bite? How do we judge if a solution is fair *in principle* if its recommendation depends entirely on the relative scaling anchored to a potentially volatile `d`?

  **Leo:** I’d argue fairness *is* contextual. It depends on the feasible alternatives and the credible threats *at hand*. A fair split of a small surplus above high outside options (`d` near `u*`) *should* look different—more competitive—than a split of a large surplus above low outside options. My rescaling reflects that. Your global view imposes a single, context-independent fairness metric based on an absolute origin, which might not correspond to the parties' actual perceptions of gain and loss relative to their current fallback. It assumes symmetry in the marginal significance of utility gains regardless of the baseline, which is a strong and often unrealistic assumption.

  **Clara:** And your view assumes that only gains relative to the immediate `d` matter, potentially ignoring historical entitlements or long-term baselines captured by a fixed origin. The fixed `u*` provides a stable reference for entitlement based on potential, not just current threat. I see now our core disagreement: you see the bargaining problem as defined purely by the current `S` and `d`, requiring self-contained normalization. I see the utility scales as potentially encoding deeper, stable normative baselines, making the absolute `u*` a legitimate anchor for inter-problem comparisons, despite the cardinal assumptions it entails. Both views have merit. Global monotonicity offers clean, unique, path-independent solutions but relies on cardinal comparability across scales. Localized monotonicity offers contextual fairness responsive to relative stakes but sacrifices uniqueness across contexts and introduces path dependence.

  **Leo:** Exactly. It boils down to what we believe utility representations *mean* and how stable the normative baseline (`d` vs. an absolute zero) truly is across different bargaining environments. Neither axiom is purely technical; both encode distinct normative commitments about scale, threat, and entitlement. The elegance of global monotonicity comes with hidden cardinal baggage; the responsiveness of localized monotonicity comes with indeterminacy costs. There’s no free lunch in axiomatic bargaining.
