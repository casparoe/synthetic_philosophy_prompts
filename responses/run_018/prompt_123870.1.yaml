answer: |-
  Here’s a tight conceptual mapping of the 1919 Chicago race riots through your "teleological parallax" framework, with critical edges exposed:

  ---

  ### **Core Actors & Whig Distortions**  
  1. **Black Migrants**  
     - *Whig Narrative:* Cast as "proto-civil rights actors" whose migration *inevitably* advanced racial equality, framing survival/resistance as conscious progress toward modernity.  
     - *Parallax Effect:* Agency distorted into **foresight** – their economic pursuit becomes a moral struggle for future integration. Motives (jobs, escape from Jim Crow) are retroactively sanctified by the *outcome* (Great Migration’s role in civil rights).  

  2. **White Union Workers**  
     - *Whig Narrative:* Either "reactionary obstacles" to progress (if opposing Black labor) or "flawed allies" (if class solidarity is emphasized). Their racism is framed as *backwardness*.  
     - *Parallax Effect:* Structural outcomes (unions later embracing civil rights) create false binaries. Economic protectionism + racial hatred are conflated; those resisting Black labor are deemed *morally regressive* solely because history "sided" with integration. Motivations (job competition, ethnic tribalism) become cartoonish "evil" or "ignorance."  

  3. **Race Commission Authors**  
     - *Whig Narrative:* "Well-intentioned but limited reformers" laying groundwork for future racial justice. Their systemic analysis (housing, policing) is celebrated *in hindsight* as progressive.  
     - *Parallax Effect:* Their compromises (e.g., tacit acceptance of segregation) are judged by *future standards*. Moral agency is assigned based on whether recommendations *align* with 1960s civil rights vs. their actual 1919 pragmatism (e.g., incremental housing reform). They become "prophets" or "cowards" in retroactive grading.  

  ---

  ### **Where the Framework Breaks**  
  - **Ambiguity of the Report:** Its call for "interracial harmony" coexisted with endorsing neighborhood "stability" (read: segregation). Whig history forces a binary: Was this "proto-Brown v. Board" or "proto-redlining"? Reality: It was both – reflecting *contradictory* 1919 liberal thought. Teleological parallax flattens this tension.  
  - **Labor Competition as Prime Mover:** Much white violence stemmed from concrete economic fear (Black strikebreakers in 1917–19). This *material trigger* resists moral teleology – it wasn’t "backwardness" but perceived self-interest. Whig frames struggle to absorb non-ideological drivers.  
  - **"Losers" Aren’t Monolithic:** White ethnic workers (e.g., Irish vs. Poles) had divergent stakes. Parallax compresses them into a single "reactionary" bloc, eroding granularity.  

  ---

  ### **Flipping the Script: Does Whig History Hold?**  
  - **Avoidable? No – but inadequate.** The riots are *forced* into Whig frameworks because they’re a pivot in national racial narratives. The "arc of progress" demands this episode be a "lesson" or "catalyst," distorting its unresolved chaos.  
  - **Built for Revolutions, Broken on Urban Violence:**  
    - Political revolutions (e.g., 1776, 1789) have clear "winners" and ideological legacies. Urban racial violence exposes capitalism/white supremacy as *unfinished systems*. Whig history stumbles on events without clean endpoints – the 1919 riots bled into redlining, COINTELPRO, ongoing segregation.  
    - **Key Weakness:** Whig teleology assumes moral progress is cumulative. But 1919’s labor-race collision reveals **cyclical violence**, not linear advancement. The "Red Summer" was a *nadir*, not a "step forward."  

  ---

  ### **Your Framing’s Subtle Risks**  
  1. **Over-Unifying "White Workers":** The report detailed intra-white ethnic tensions (e.g., Irish police vs. Slavic laborers). Painting them as a bloc risks mirroring the parallax error you critique.  
  2. **Commission’s Nuance:** Its analysis of media incitement and police bias *was* groundbreaking. Dismissing it as "ambiguous" undersells its systemic critique – even if its solutions were flawed.  
  3. **"Structural Outcomes They Couldn’t Foresee":** Be explicit – *which* outcomes? (e.g., 1965 Voting Rights Act? 1980s deindustrialization?) This shapes the parallax.  

  ---

  ### **Conclusion**  
  The 1919 riot **explodes teleological parallax** by exposing:  
  - Motives fractured by class, ethnicity, and immediate survival, not moral teleology.  
  - "Progress" as non-monotonic (the Commission’s recommendations were ignored for decades).  
  - Whig history’s limits: It narrates *political victories* but cannot map the viscous, unresolved violence of racial capitalism. Chicago 1919 isn’t a "chapter" in a progress story – it’s an open wound.  

  **Theoretical Verdict:** Teleological parallax brilliantly exposes Whig distortions, but the riot itself reveals that urban racial conflict resists *any* progress narrative – it’s a fracture in the theory’s spine.
