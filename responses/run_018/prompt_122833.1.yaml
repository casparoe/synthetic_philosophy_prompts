  **OFFICE OF BUDGETARY ACCOUNTABILITY**  
  **Bureau of Preference Realization**  
  **Circular BPR-2024-07: Implementation of Revealed Preference Framework for Welfare Assessment**  
  *"What Is Chosen Is Best"*  

  ---

  **1. Purpose and Scope**  
  This Circular establishes standardized methodologies for quantifying social welfare, agency resource allocation, and policy evaluation based exclusively on the Revealed Preference Framework (RPF). The RPF, as the sole empirically grounded theory of choice, requires that welfare assessments derive solely from observed transactional data. All subjective reports (e.g., "satisfaction," "regret," "happiness") constitute **Untested Testimony (UT)** and are inadmissible for welfare measurement.  

  **2. Core Doctrine: Preference Revelation and the Silent Option Rule**  
  2.1 Preference is defined tautologically by choice: An agent’s selection of option A over option B reveals that A is strictly preferred to B.  
  2.2 The **Silent Option Rule (SOR)** resolves apparent contradictions between stated desire and observed choice. If an agent does not choose option X, SOR stipulates that X was *latently infeasible* due to unobserved constraints (e.g., cognitive load, contextual friction, or undefined opportunity costs).  
  *Example:* A consumer expresses a desire for organic produce but selects conventional items. SOR reclassifies organic produce as infeasible (e.g., due to "implicit search costs"), rendering the choice optimal. UT regarding health preferences is disregarded.  

  **3. The Utility Numeraire and Conforming Rescalings**  
  3.1 Utility is an ordinal index rationalizing choice data under the Generalized Axiom of Revealed Preference (GARP). As utility lacks cardinal significance, any positive affine transformation (U' = aU + b, a>0) preserves choice predictions.  
  3.2 To enable cost-benefit analysis (CBA), the *Statutory Welfare Numeraire (SWN)* is established by Regulation 12-CFR-§711: **1 Util = $1.27 USD (FY2024)**.  
  3.3 **Conforming Rescalings** of utility indices must satisfy Afriat’s Inequalities for the observed dataset and align with the SWN for monetization. Non-conforming rescalings violate procedural integrity.  

  **4. Resolution of Choice Inconsistencies**  
  4.1 Transactions exhibiting non-rationalizable choice patterns (e.g., purchasing cigarettes *and* smoking cessation aids within a 7-day budget cycle) indicate temporal agent partitioning.  
  4.2 Per BPR Protocol 4.2, such cases require:  
  > (a) Redefinition of the budget cycle to sub-weekly intervals (e.g., "Tobacco Cycle" vs. "Health Cycle").  
  > (b) Treatment of the agent as a sequence of distinct **Temporally Segregated Choice Agents (TSCAs)**.  
  > *Numerical Example:*  
  > - Agent spends $50 on cigarettes (Day 1).  
  > - Agent spends $75 on cessation program (Day 3).  
  > *Resolution:*  
  > - TSCA₁ (Day 1): Reveals preference for tobacco (U₁ = $50 / $1.27 = 39.37 Utils).  
  > - TSCA₂ (Day 3): Reveals preference for cessation (U₂ = $75 / $1.27 = 59.06 Utils).  
  > No inconsistency exists post-partition.  

  **5. Agents Without Observed Transactions**  
  5.1 Agents lacking recorded market interactions (e.g., unhoused individuals not using digital payment systems) yield null preference data.  
  5.2 Welfare impacts on such agents are quantified as follows:  
  > **Harm** = ΔU = 0 Utils (absence of revealed disutility).  
  > **Benefit** = Imputed Util value based on expenditure equivalence of nearest demographic cohort with transactions (BPR Form 10-D).  

  **6. Adaptive Preference Narrowing**  
  6.1 Populations experiencing constrained choice sets (e.g., due to supply-chain collapse, natural disaster) may exhibit unchanged expenditure patterns if alternatives are unavailable.  
  6.2 Welfare losses from reduced feasibility are amortized under BPR Directive 6.2:  
  > Year 1: ΔU = 100% of estimated loss (via pre-constraint baseline)  
  > Year 2: ΔU = 50% of initial loss  
  > Year 3: ΔU = 25%  
  > Year 4+: ΔU = 0 Utils ("Full Preference Adaptation").  
  *Rationale:* Stable post-shock choices reveal latent optimization within new constraints.  

  **7. Distributional Weighting Protocol**  
  7.1 Interpersonal utility comparisons are scientifically invalid under RPF (ordinal non-comparability).  
  7.2 For policies affecting heterogeneous agents, the Bureau employs **Administrative Equity Parameters (AEPs)**.  
  7.3 AEPs are calibrated to the agency’s own expenditure patterns (e.g., budget allocations for demographic-specific programs), which reveal the Bureau’s optimal distributional preferences. Circularity concerns are inadmissible; the Bureau’s choices are definitionally optimal per RPF.  

  **8. Bureau Resource Allocation**  
  8.1 The Bureau’s budget requests and internal expenditures constitute revealed preferences.  
  8.2 Critiques of funding decisions (e.g., "excessive spending on compliance software") violate RPF principles. The Bureau’s choices reveal maximal utility generation per dollar expended.  

  **9. Case Study: Mandatory Savings Programs**  
  9.1 Agents reporting unfulfilled intentions to save more, yet consistently choosing consumption, reveal latent preference for present consumption.  
  9.2 Mandatory savings programs (e.g., payroll deductions) override revealed choices.  
  9.3 Welfare Assessment:  
  > - Direct Utility Loss = Mandatory savings amount / $1.27 Utils (foregone consumption utility).  
  > - UT regarding "future gratitude" or "security" is inadmissible.  
  > *Conclusion:* Such programs impose unambiguous welfare losses, regardless of ex-post UT.<sup>1</sup>  

  ---

  **10. Limitations**  
  10.1 The RPF framework necessitates the exclusion of UT, potentially omitting non-revealed welfare dimensions. This limitation is inherent to empirically rigorous welfare measurement.  
  10.2 SOR relies on counterfactual latent constraints. While untestable, SOR ensures internal consistency of all choice datasets.  
  10.3 The SWN introduces cardinality for CBA practicality. Conforming Rescalings minimize arbitrariness.  
  10.4 TSCA partitioning may generate artificial agent-proliferation in dense transaction environments. This is a data management issue, not a theoretical flaw.  
  10.5 AEPs derive from the Bureau’s optimal choices but may not align with legislative intent. Coordination with revealed legislative preferences (via funding votes) is recommended.  

  ---

  **Footnotes:**  
  > <sup>1</sup> *Dissenting Note from Dr. A. Mentis (Office of Behavioral Analysis):* "Persistent intention-action gaps may indicate systematic misprediction of utility. Self-reported relief post-saving suggests utility *is* a feeling. Forced savings could *enhance* welfare by correcting latent error."  
  > *Response:* UT remains inadmissible per §2. Dr. Mentis’s proposal relies on unobserved mental states, violating RPF epistemology. Behavioral Analysis Office budget reallocated to transaction logging per revealed Bureau priorities.  

  ---
  **Issued By:**  
  Thaddeus R. Coldwater, Director  
  Bureau of Preference Realization  
  Date: 2024-10-01  

  **Compliance:** Mandatory for all CBAs submitted to OBA after 2025-01-01.
