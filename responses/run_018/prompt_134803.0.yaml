  First, I need to recall Parfit's Hitchhiker. The scenario involves a hitchhiker stranded in the desert. A driver offers a ride only if the hitchhiker promises to pay $1000 once they get to town. The driver can tell if the hitchhiker is sincere. If the hitchhiker intends to pay, the driver takes them; otherwise, they leave them. But once rescued, the hitchhiker has no reason to pay. So, being sincere about paying when making the promise is irrational at that moment because it leads to being stranded. But if they could commit to paying, they'd be saved. The paradox is that rationality might require an irrational action later.

