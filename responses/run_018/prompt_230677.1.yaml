  ### Scoring Key  
  Match your answers to the patterns below. If your pattern matches multiple positions, you may hold a hybrid view. Unattested patterns are noted.  

  - **Hierarchical/Tarskian view**:  
    Answers: 1E, 2E, 3E, 4E, 5E, 6E, 7E, 8E  
    Why: Self-reference is invalid, so all such sentences are meaningless. Non-self-referential truths (like Q7) are true.  

  - **Truth-value gap view**:  
    Answers: 1D, 2D, 3D, 4D, 5D, 6D, 7A, 8D  
    Why: Paradoxical sentences lack truth values. Ordinary truths (Q7) are true. Revenge sentences (Q3) remain gapped.  

  - **Dialetheist/Paraconsistent view**:  
    Answers: 1C, 2G, 3C, 4C, 5C, 6C, 7A, 8C  
    Why: Paradoxes are true contradictions. Truth-Teller (Q2) has an unknown classical value. Non-paradoxical truths (Q7) are true.  

  - **Revision-theoretic view**:  
    Answers: 1F, 2F, 3F, 4F, 5F, 6F, 7A, 8F  
    Why: Truth assignments never stabilize for paradoxes. Ordinary truths (Q7) are stably true.  

  - **Unattested patterns**:  
    - All A/B/C/D/E/F answers for Q7 (except A): Rejecting obvious truths is incoherent.  
    - 1A, 1B, 3A, 3B, 4A, 4B, 6A, 6B, 8A, 8B: Assigning classical values to paradoxes forces contradictions.  
    - 2A or 2B: Truth-Teller cannot be stably true/false without arbitrariness.  
    - 5A or 5B: Yablo sequences cannot be uniformly true/false without inconsistency.  

  - **Indistinguishable patterns**:  
    - Gap and hierarchical views agree on Q1, Q3, Q6 (D/E), but diverge on non-paradoxical self-reference (Q7: A vs. E).  
    - Revision and dialetheist views agree on instability (Q1F/Q1C) but diverge on Truth-Teller (Q2F vs. Q2G) and contradictions (Q3F vs. Q3C).  

  This instrument distinguishes core positions by requiring consistency across cases. If your answers don’t fit, you may hold a non-standard or unstable view.
