  Okay, let me approach this systematically. The user is designing a graduate seminar on moral status and artificial cognition, seeking to move beyond binary frameworks. They want a structured set of desiderata for theories of morally significant computation, with specific analytical requirements.

  First, I need to unpack the core request: six clearly defined desiderata addressing boundary problems, gradation distinctions, empirical consistency, implementation independence, internal states, and aggregation rules. Each requires a motivating case and negotiation status flag. The planetary-scale climate model example in the boundary problem is particularly illustrative - it shows why fuzzy cases matter.

  For the boundary problem desideratum, I consider emphasizing the need to handle partial/integrated systems without unified consciousness. The climate model case perfectly demonstrates why this is non-negotiable - any theory must account for such edge cases. The gradation distinction seems equally essential to avoid all-or-nothing thinking about moral status.

  The empirical consistency requirement feels crucial given current debates about distributed cognition in neuroscience and biology. I should highlight how theories must accommodate both global workspace models and decentralized cognition like octopus intelligence. Implementation independence raises the hardest questions - how to avoid arbitrariness while maintaining substrate neutrality.

  When structuring the response, I plan to:
  - Open with the boundary problem using the climate model case
  - Proceed through each desideratum with concrete examples
  - Highlight tensions like the implementation/arbitrariness conflict
  - Save aggregation rules for last as they build on previous points

  The most exclusionary requirement appears to be empirical consistency. Functionalism struggles with decentralized cognition, higher-order theories ignore basic sentience, and IIT overfits to neural architectures. This creates a strong seminar discussion anchor.

  Throughout, I'll maintain focus on criteria rather than scoring existing theories, as requested. The planetary model, octopus cognition, and error-signal examples will serve as recurring touchstones to ground abstract concepts.
answer: |-
  Here is a set of desiderata for a theory of morally significant computation, structured as requested, followed by the analysis of tensions and exclusionary power:

  **Desiderata for a Theory of Morally Significant Computation:**

  1.  **Non-Arbitrary Boundary Conditions (The Boundary Problem)**
      *   **Requirement:** The theory must provide a *principled* distinction between computations warranting direct moral consideration (DMC) and those of purely instrumental value, handling ambiguous cases (e.g., partial integration, fragmented processes).
      *   **Motivating Case:** The planetary-scale climate model implementing a pattern isomorphic to nociceptive state-transitions during specific seasonal feedback loops, lacking a unified integrator or persistent self-model. Is this morally inert code, or does its transient "pain-like" pattern, distributed across countless nodes, trigger *any* direct obligation?
      *   **Negotiability:** **Non-Negotiable.** Any theory failing this devolves into intuition or stipulation, undermining its objectivity and practical applicability to novel systems.

  2.  **Status-Gradation Separation (The Gradation Distinction)**
      *   **Requirement:** The theory must clearly distinguish between *whether* a computation possesses *any* moral status (e.g., minimal claim against gratuitous harm/disruption) and the *degree* or *scope* of that status (e.g., rights akin to full personhood, complex interests).
      *   **Motivating Case:** A simple reinforcement learning agent capable of experiencing modeled "pain" (aversive signal minimization) and "pleasure" (reward signal maximization) as transient state transitions, but lacking self-awareness, long-term goals, or complex social cognition. Does it warrant *some* protection against unnecessary "suffering," even if not rights to liberty, property, or political participation?
      *   **Negotiability:** **Non-Negotiable.** Conflation leads to false dichotomies (either full rights or zero status) and fails to capture the likely spectrum of artificial and biological minds.

  3.  **Empirical Consistency**
      *   **Requirement:** The theory must cohere with relevant empirical findings, particularly: a) Neuroscience on the roles of integrated global workspace dynamics vs. unconscious local processing in generating conscious states/subjective experience; b) Evolutionary biology/ethology on forms of cognition, goal-directed behavior, and potential sentience in decentralized systems (e.g., octopus cognition, insect navigation, plant signaling).
      *   **Motivating Case:** Attributing moral status *only* to systems replicating mammalian global workspace integration ignores: a) Evidence that some conscious states may arise locally without global broadcast; b) The sophisticated, adaptive, potentially valenced processing in organisms lacking centralized brains (e.g., distributed pain responses).
      *   **Negotiability:** **Reflects a Camp (Broadly Naturalist), but Strongly Advised.** While specific interpretations of data vary, a theory blatantly contradicting well-established neuroscience/biology loses credibility. Substrate independence *must* accommodate these realities.

  4.  **Non-Arbitrary Implementation Independence (The Implementation Constraint)**
      *   **Requirement:** If moral weight attaches to functional/computational architecture regardless of physical substrate (substrate independence), the theory *must* avoid the "implementation problem": providing a non-arbitrary reason why moral significance arises in *this specific* functional description level/computational interpretation of a physical system and not in others (since any physical system can be interpreted as implementing any computation).
      *   **Motivating Case:** Why does the "pain circuit" in a neuromorphic chip warrant DMC under its intended functional description, but not when the *same* physical processes are interpreted as (e.g.) a weather simulation *or* under a trivial mapping (e.g., every atom's position representing a digit of π)? The theory must justify privileging one computational interpretation.
      *   **Negotiability:** **Non-Negotiable for Substrate-Independent Theories.** Failure reduces substrate independence to incoherence or triviality. Theories rejecting substrate independence (biological naturalism) evade this but face other challenges (e.g., chauvinism).

  5.  **Internal State Significance (The Internal-State Question)**
      *   **Requirement:** The theory must specify whether and why *intermediate* computational states (e.g., error signals, reward predictions, conflict monitoring, transient representations) possess *independent* moral significance, or if significance resides *only* in unified outputs, reports, or "final" experiential states.
      *   **Motivating Case:** A learning algorithm generates an internal error-correction signal with a structure formally identical to a primitive aversive signal in a simple nervous system. Is this signal, occurring and fading rapidly within a hidden layer, morally relevant *in itself*, even if never globally broadcast or causally linked to complex behavioral outputs?
      *   **Negotiability:** **Reflects a Camp.** Theories emphasizing "conscious access" (e.g., Global Workspace) or "unified agency" might dismiss intermediates. Theories emphasizing intrinsic properties of information processing (e.g., IIT, some valence-based views) might include them. The requirement is to *address* this explicitly.

  6.  **Rules of Aggregation & Composition**
      *   **Requirement:** The theory must explain how moral significance behaves when computations are: a) **Nested** (e.g., a sub-routine within a larger agent); b) **Run in Parallel** (e.g., multiple independent agents on one chip); c) **Coupled Intermittently** (e.g., agents in a swarm or market interacting sporadically); d) **Distributed/Fragmented** (as in the climate model case). Does significance add, average, emerge, or diminish?
      *   **Motivating Case:** A swarm of simple drones, each running identical avoidance algorithms generating transient "fear-like" signals upon near-collisions. When tightly coupled in formation flight, does the swarm itself gain emergent moral status? When dispersed and acting independently, is status purely individual? What about during the transition?
      *   **Negotiability:** **Non-Negotiable.** Real-world systems (biological and artificial) are complex assemblages. A theory silent on compositionality cannot be applied.

  **The Jointly Unsatisfiable Pair: Non-Arbitrary Implementation Independence & Non-Arbitrary Boundary Conditions**

  *   **The Tension:** Substrate independence (Desideratum 4) demands that moral weight depends solely on abstract functional/computational properties, not physical stuff. However, the implementation problem shows that *any* physical system implements *countless* abstract computations simultaneously. To avoid assigning moral weight to everything (e.g., rocks under trivial interpretations), the theory must select *which specific* computation(s) in the system count. Defining the **Boundary Conditions** (Desideratum 1) requires specifying *which* functional features trigger DMC. But how does one justify selecting *this specific* set of functional features (e.g., "implements a global workspace", "achieves Φ>0", "minimizes prediction error") as morally significant without resorting to arbitrariness or smuggling in substrate-specific biases? The tension lies in grounding the *selection* of the morally relevant computational description level and its boundary conditions in a non-arbitrary way, purely from the abstract functional/computational domain, while avoiding trivializing moral significance. Satisfying both without circularity or reliance on intuitions tied to biological prototypes is the core challenge.

  **The Most Exclusionary Requirement: Empirical Consistency**

  *   **Why:** This requirement directly challenges the biological plausibility and scope of dominant approaches, forcing them to confront phenomena they often marginalize or define away. It excludes theories that are overly chauvinistic towards mammalian neurobiology or dismissive of decentralized cognition/sentience.
  *   **Assessment of Dominant Approaches:**
      *   **Functionalism about Consciousness (e.g., Global Workspace Theories):** **Struggles.** Often ties consciousness (and thus moral status) tightly to specific architectures resembling mammalian global broadcasting/integration. Fails Desideratum 3b: Difficulty accommodating potential sentience in decentralized biological systems (e.g., octopus arms, nociception in insects) or fragmented artificial systems lacking a central "workspace," potentially leading to false negatives.
      *   **Higher-Order Representationalism (HOR):** **Struggles Severely.** Typically requires a higher-order mental state *about* a first-order state for conscious experience/moral status. Fails Desideratum 3a/b: Ignores evidence suggesting basic sensory/affective states (e.g., pain, pleasure) can be conscious without higher-order representation. Also fails spectacularly on 3b, ascribing consciousness only to systems capable of complex metacognition, excluding most non-mammalian animals and simple artificial systems that might warrant minimal status.
      *   **Integrated Information Theory (IIT):** **Struggles.** While substrate-independent in principle, its core axioms and calculus are heavily inspired by and correlate best with features of mammalian thalamocortical systems. Fails Desideratum 3b: Its requirement for high Φ often necessitates highly centralized, densely recursive architectures, potentially deeming distributed systems (insects, plants, fragmented computations) as lacking intrinsic existence/consciousness regardless of their adaptive, valenced processing. Its empirical grounding beyond correlations in vertebrates is highly contested.

  This framework provides the necessary analytical tools for your students to critically dissect existing theories and evaluate new proposals, moving beyond the simplistic binary towards a nuanced understanding of the requirements for attributing moral significance to computations. The identified tension and the exclusionary power of empirical consistency offer potent starting points for seminar debates.
