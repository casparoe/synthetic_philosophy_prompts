  Their last point about canonical drafts is sharp. MDT's radical claim is that consciousness isn't a thing but a description of cognitive access. I must clarify that "no final draft" means temporally extended processes, not just spatially distributed ones. The user might be underestimating how profoundly MDT reframes temporality.

