prompt: |-
  So I'm a backend engineer at a mid-sized company and after every big outage we do a postmortem, and the bit where we write down "root cause" always turns into an argument. I've no philosophy background at all but I was moaning about this to a mate who studied it and she said philosophers have genuine fights about whether not doing something can count as a cause of anything, which is basically our exact problem, so now I'm curious how far our team's instincts actually hang together. Act as a professional philosopher who knows the causation literature, and think carefully about this rather than giving me a textbook summary. I'd suggest brainstorming what rules our verdicts might be running before you commit to anything.

  Here's our track record, roughly as it went down in the meetings. Case 1: someone deployed a schema change but forgot to run the migration script, which is step three on the deploy checklist. We wrote "the forgotten migration caused the outage" and nobody blinked. Case 2: a library update broke the checkout flow on an old browser we technically still support, and when someone suggested the root cause was that nobody had tested on that browser, the room pushed back hard and said no, the cause was the incompatible library, the untested browser was just background. Case 3: the on-call engineer didn't notice a paging alert for forty minutes because they were at dinner, and we listed that as a contributing cause in the report. Case 4: a junior dev didn't trigger the failover runbook during an incident because nobody had ever trained them on it, and we explicitly said their not acting was NOT a cause, since you can't omit something you never knew to do. Now the new case we're arguing about this week: a senior engineer restarted a service during traffic spike without first checking the cache warmup, and it fell over. Checking the warmup is on no checklist, appears in no runbook, and is nobodys assigned duty, but every senior engineer on the team has done it as a habit for years and it's kind of just "how things are done here." Half the team wants to name the skipped check as the cause, half says you can't cause something by skipping a step nobody ever told you to do.

  So: what verdict is most consistent with our own precedents, and which earlier case is the closest analog? More interestingly to me, what are the different rules that would fit cases 1 through 4 equally well, which of them disagree about the new case, and what would we implicitly be signing up for with each ruling? If our history genuinely underdetermines it, say so and tell me what further incident would best seperate the candidate rules. And since I'm asking you to extrapolate from four messy meetings, please flag how confident you are in each part of the answer and single out the specific claim you're least sure of.
reasoning: |-
  Okay, let me tackle this backend engineer's problem. They're dealing with postmortem root cause debates, and their cases reveal inconsistent intuitions about omissions as causes. 

  First, I need to map their existing judgments:
  - Case 1: Forgetting a checklist step (explicit action) = cause ✅
  - Case 2: Not testing an obscure browser ≠ cause (background) ❌
  - Case 3: Not noticing alert due to dinner = contributing cause ✅ (but physical absence)
  - Case 4: Not acting due to lack of training ≠ cause ❌ (epistemic limitation)

  The new case involves skipping an unwritten, habitual step. Half the team says it's causal, half says it's not. 

  Looking for consistency patterns, I see two competing principles emerging:
  1. The Explicit Duty Principle: Omission only causal if violating clear procedural obligation (fits Cases 1,2,4)
  2. The Reasonable Expectation Principle: Omission causal if a competent agent should've known (fits Cases 1,3)

  Case 3 is the troublemaker - it breaks the Explicit Duty pattern by accepting dinner absence as contributory despite no written rule requiring constant alert monitoring. This suggests their instincts lean toward Reasonable Expectation in practice.

  For the new case, Reasonable Expectation would likely call the skipped cache check causal because: 
  - It's entrenched team knowledge 
  - Senior engineer should reasonably know 

  But Explicit Duty would reject it since: 
  - No documentation exists 
  - Not formally assigned 

  Their history slightly favors Reasonable Expectation through Case 3's precedent. Still, we're on shaky ground because Case 3 involved physical absence while this is cognitive omission.

  To reduce ambiguity, we'd need a test case like: Senior forgets undocumented but critical step they've personally done 100 times. If they'd call that causal, it confirms Reasonable Expectation dominates.

  Least confident point: Whether Case 3's "at dinner" factor is doing hidden work in their judgment. Would they accept "forgot phone at desk" as equally causal? That's unclear.
answer: |-
  Based on your case history and philosophical principles of causation, here's a rigorous analysis of your team's implicit rules and how they apply to the new case. I'll break this down systematically, flagging confidence levels throughout.

  ### Your Team's Implicit Causation Framework (Reverse-Engineered)
  From Cases 1-4, two distinct principles emerge that explain all verdicts:

  1. **The Explicit Duty Principle (EDP)**  
     *Omission = cause only if:*  
     - There exists a documented/formal obligation (checklist, runbook, assigned duty)  
     - The agent was aware of the obligation  
     *Supported by:*  
     - Case 1: Migration was on checklist → omission causal ✅  
     - Case 2: No obligation to test specific browser → omission not causal ❌  
     - Case 4: No training on runbook → omission not causal ❌  

  2. **The Reasonable Expectation Principle (REP)**  
     *Omission = cause if:*  
     - A competent agent *should reasonably have known* the action was necessary  
     - Physical/logistical constraints don't prevent action  
     *Supported by:*  
     - Case 1: Engineer clearly knew checklist step → omission causal ✅  
     - Case 3: On-call engineer reasonably expected to monitor alerts (despite dinner) → omission causal ✅  
     - Case 4: Junior dev *couldn't* reasonably know → omission not causal ❌  

  **Crucial observation**: Case 3 breaks pure EDP (no checklist *required* watching alerts during dinner) but fits REP. Your team uses REP when physical presence/attention is job-implicit (on-call duty). *(Confidence: High - this cleanly explains all 4 cases)*

  ---

  ### Analysis of the New Case: Skipped Cache Warmup Check
  - **Facts**:  
    - No documentation/assigned duty (fails EDP)  
    - But established habit among seniors (satisfies REP's "reasonably should have known")  
    - Agent was senior engineer (presumed competent)  

  - **Consistency with Precedents**:  
    - Closest analog is **Case 3** (on-call at dinner):  
      - Both involve *implied expectations* beyond documentation  
      - Both agents were in roles where tacit knowledge is assumed  
    - Verdict under REP: **Skipped check = cause**  
      - Senior engineers reasonably expected to know habitual best practices  
      - Unlike Case 4 (junior lacking knowledge), no epistemic barrier existed  

  - **Conflict with Case 2?**  
    - Superficially similar (omission of testing) but key difference:  
      - Case 2: Untested browser was *not reasonably expected* (obscure, "technically" supported)  
      - New case: Cache check was *active habitual practice* for seniors  
    → REP distinguishes them cleanly *(Confidence: Medium-High)*  

  ---

  ### Candidate Rules & Their Implications
  | Principle               | New Case Verdict | What You'd Be Signing Up For                                                                 | Philosophical Anchor                     |
  |-------------------------|------------------|---------------------------------------------------------------------------------------------|------------------------------------------|
  | **Pure EDP**            | Not a cause      | Only *documented* omissions count. Tacit knowledge irrelevant.                              | Legalistic causation (e.g., duty of care)|
  | **Pure REP**            | Cause            | Culture/habits become causal factors. Burden on individual competence.                      | Aristotelian "efficient cause"           |
  | **Hybrid (your current)**| **CAUSE**       | Omissions causal if: (a) Explicit duty **OR** (b) Reasonable expectation + no epistemic gap | Hart & Honoré's "normative causation"    |

  **Why Hybrid Fits Best**:  
  - Explains why Case 4 (junior) ≠ Case 3 (on-call): REP requires *capacity* to know  
  - Justifies Case 2: No reasonable expectation for obscure browser  
  - Aligns with new case: Seniors have capacity and expectation *(Confidence: High)*  

  **Tension Point**:  
  Your team implicitly treats *role seniority* as amplifying REP. This is defensible (experts bear higher causal responsibility) but risky if undocumented practices proliferate. *(Confidence: Medium - role weighting is implied but not explicit in past cases)*  

  ---

  ### If History Underdetermines It? The Decisive Test Case
  Your precedents *slightly* favor REP (via Case 3), but ambiguity remains. To clarify, consider this hypothetical:  
  > *A senior forgets an undocumented step they've personally done 50 times. New hires aren't taught it.*  

  - **If deemed causal**: Confirms REP dominates (individual expectation suffices)  
  - **If not causal**: Reveals EDP dominance (requires institutionalization)  
  *(Confidence in test design: High - isolates habit vs. formality)*  

  ---

  ### Verdict for New Case & Weakest Claim
  - **Most consistent verdict**: **Skipped cache check = root cause** (extends REP from Case 3)  
  - **Closest analog**: **Case 3** (unwritten but expected action)  
  - **Weakest claim**: That Case 3's "dinner" aspect isn't doing hidden work. *What if the on-call engineer was in a coma?* Your team might then reject the omission as causal, proving REP requires *feasible* action. But since your senior was cognitively capable, the analogy holds. *(Confidence: Low-Medium - we lack coma-like test cases)*  

  ### Recommendation
  Adopt the **Hybrid Principle** explicitly:  
  > *"Omissions are causal when they violate (a) documented procedures, or (b) reasonably expected practices for the agent's role and capacity."*  

  This preserves your intuitions while constraining "blame creep." Document tacit knowledge to avoid over-reliance on REP. Philosophical fights solved.
