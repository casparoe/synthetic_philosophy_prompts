prompt: |-
  You are an expert in philosophy of science and philosophy of psychiatry, with deep familiarity with Ian Hacking's work on classification, interactive kinds, and the dynamics of psychiatric categories. Please think carefully and work through this systematically rather than rushing to a verdict; I want an accuracy audit I can actually use.

  I am preparing for a seminar on psychiatric classification, and I came across an essay in an unnamed philosophy-of-medicine blog that summarizes Hacking's looping-effect thesis as follows. The essay writes: Psychiatric classifications like autism or multiple personality disorder apply to human beings rather than to natural objects like quarks. Hacking calls these interactive kinds because, unlike indifferent kinds, they involve a loop: once experts classify people in a certain way, the classified individuals learn about the category and adjust their behavior, self-conception, and even symptoms to match it. This loop runs only one way, from the expert label to the patient, and it proves that psychiatric conditions are socially invented rather than discovered in nature. Because the loop constantly changes the phenomenon being studied, any search for stable biological markers or genetic causes is conceptually confused—researchers are chasing a target that moves precisely because they have named it. The historical explosion of multiple personality disorder cases in the 1980s illustrates this perfectly: once therapists began diagnosing it, patients started presenting with the exact symptom profile the diagnosis described, creating an epidemic that had no independent biological reality.

  My instinct is that this captures something real about Hacking's skepticism toward naive biological reductionism, but I worry it overstates his social-constructionist commitments and misrepresents both the direction of the loop and his attitude toward biological research. Specifically, I want you to go through the summary claim by claim and tell me: which parts a defender of Hacking's view would accept without qualification, which are common oversimplifications that need softening, and which are flat misreadings—particularly regarding whether he denies all biological substrate, whether he takes the loop to be unidirectional, and whether he regards biological inquiry as conceptually confused rather than merely complicated by interaction. I also want to know whether the essay's conclusion—that looping effects render psychiatric categories purely invented—actually follows from the accurate parts of the summary, or whether it depends on the misrepresentations. Finally, please apply the corrected account to a case I have been wondering about: the DSM-5 decision to subsume Asperger's disorder into autism spectrum disorder. Is that revision best explained as a looping effect reshaping the classification in response to classified individuals, or does it involve different mechanisms altogether, and what does Hacking's framework predict about whether such a merged category will stabilize?
