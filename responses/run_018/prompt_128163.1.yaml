  Here is a polished 2-page research proposal based on your idea, focusing on conceptual clarity, a realistic timeline, and clear failure conditions:

  **Research Proposal: Two Faces of Rigidity: Disambiguating Sphexishness for Theories of Free Will**

  **1. Project Summary & Core Question:**  
  Philosophical discussions of free will frequently invoke the *Sphex ichneumoneus* wasp as an exemplar of unfree, rigid behavior – the quintessential "sphexish" agent. This project contends that the standard critique relies on an unexamined ambiguity: it conflates **loop-rigidity** (mechanistic repetition of an action sequence despite sensory feedback) with **frame-rigidity** (inability to update the overarching goal or representational frame of the action, even when obsolete). The central research question is: **Does attributing free will require the avoidance of *both* loop-rigidity and frame-rigidity, or is freedom compatible with loop-rigidity if frame-flexibility (goal revisability) is preserved?** The project aims to rigorously disentangle these two dimensions of rigidity using the sphex case as a focal point, assess their distinct roles in philosophical accounts of agency, and determine which dimension is fundamentally constitutive of free will. This moves beyond deterministic debates to investigate the specific *structure* of behavioral control relevant to freedom.

  **2. Background & Problem Statement:**  
  The sphex wasp’s behavior (repeatedly checking its burrow after prey displacement) is ubiquitously cited in free will literature (compatibilist and libertarian alike) as illustrating a stark lack of freedom or flexibility. However, this usage is critically flawed:
  *   **Ambiguous Critique:** Philosophers (e.g., Dennett, Frankfurt-school compatibilists, libertarians) employ "sphexishness" as a monolithic indictment implying *both* repetitive action loops *and* fixed goals. Yet, these failures are conceptually distinct and potentially dissociable.
  *   **Underexplored Distinction:** While "flexibility" is central to many accounts of free agency (e.g., reasons-responsiveness, hierarchical identification), existing frameworks treat it generically. They fail to explicitly differentiate between flexibility *within* an action plan (loop-flexibility) and flexibility *of* the action plan itself (frame-flexibility).
  *   **Ethological Oversimplification:** Philosophical appeals to sphex often rely on simplified, decades-old ethological descriptions. A closer analysis of the wasp's actual capacities is needed to clarify *which* rigidity (loop, frame, or both) it exhibits, testing the coherence of the standard philosophical use.

  This project fills the gap by rigorously defining and separating loop-rigidity and frame-rigidity, using the sphex case as a crucial test bed, and evaluating their individual necessity for free will.

  **3. Research Objectives:**
  1.  **Diagnose the Conflation:** Systematically analyze key philosophical texts employing the sphex example to demonstrate where and how loop-rigidity and frame-rigidity are ambiguously conflated under the umbrella of "sphexishness" or lack of "flexibility."
  2.  **Formalize the Distinction:** Develop precise conceptual definitions of loop-rigidity and frame-rigidity, grounded in action theory and cognitive science.
  3.  **Apply & Test the Distinction:** Apply this framework to:
      *   A reappraisal of the sphex wasp's ethology (based on standard sources like Wooldridge, Dawkins).
      *   Human cases of compulsive behavior (e.g., OCD rituals), where actions may be loop-rigid *despite* the agent's ability to recognize and wish to change the overarching goal (suggesting preserved frame-flexibility).
  4.  **Assess Implications for Free Will:** Argue for which dimension (loop-flexibility, frame-flexibility, or both) is fundamentally necessary for the kind of agency required by prominent theories of free will (e.g., reasons-responsiveness, guidance control, identification).

  **4. Methodology & Timeline (3 Months):**
  *   **Month 1: Philosophical Diagnosis & Conceptual Foundations:**
      *   **Activity:** Close reading and analysis of core philosophical texts referencing sphexishness/flexibility in free will debates (e.g., Dennett, Frankfurt, Wolf, Fischer & Ravizza, Kane, libertarian critiques).
      *   **Focus:** Identify specific passages where the description of sphex's failure or the required "flexibility" for free will ambiguously blends loop and frame rigidity. Catalog the assumptions made.
      *   **Deliverable:** A detailed map of the conceptual conflation within the literature.
  *   **Month 2: Formalizing the Distinction & Case Studies:**
      *   **Activity 1:** Develop formal definitions:
          *   *Loop-Rigidity:* Inability to modify the step-by-step execution of a behavioral sequence in response to salient, task-relevant sensory feedback *within* the current action frame. Characterized by repetition despite negative feedback or changed circumstances affecting the *means*.
          *   *Frame-Rigidity:* Inability to abandon or significantly revise the overarching goal, intention, or representational schema governing the action sequence, even in the face of evidence demonstrating its futility, obsolescence, or incongruence with other values/needs. Concerns the *end* itself.
      *   **Activity 2:** Apply definitions:
          *   *Sphex Reappraisal:* Analyze standard ethological descriptions: Does the wasp's behavior primarily demonstrate loop-rigidity (fixed sequence execution), frame-rigidity (inability to abandon the "check burrow" goal once triggered), or both? Is there evidence suggesting the potential for one without the other?
          *   *Human Compulsions:* Analyze philosophical/psychological descriptions of OCD rituals. Argue that these often exhibit loop-rigidity (fixed, repetitive actions) but *not* necessarily frame-rigidity (the agent often recognizes the goal as irrational/wrong and desires to change it).
      *   **Deliverable:** A refined conceptual framework document and preliminary analysis of sphex/compulsions.
  *   **Month 3: Synthesis & Argument - Which Rigidity Matters?**
      *   **Activity:** Drawing on Month 1 & 2, construct and defend an argument for which dimension of rigidity is more fundamentally incompatible with free will. Key questions:
          *   Can an agent be free if they are loop-rigid but frame-flexible (e.g., the compulsive individual who desperately wants to stop their ritual)? Does this preserve core aspects of agency (evaluation, identification with higher-order goals)?
          *   Conversely, is frame-rigidity alone sufficient to undermine freedom, even if loop-flexibility is present (e.g., an agent skillfully pursuing an obsolete or externally imposed goal they cannot question)?
          *   How does this distinction impact major compatibilist criteria (e.g., is reasons-responsiveness primarily about loop or frame flexibility?)?
      *   **Deliverable:** A draft paper presenting the argument, integrating the diagnostic, conceptual, and applied work.

  **5. Significance & Expected Outcomes:**
  *   **Conceptual Clarity:** Provides a crucial distinction missing from current debates, refining the understanding of "behavioral rigidity" and "flexibility" central to free will.
  *   **Rehabilitating the Sphex Example:** Transforms sphex from a blunt instrument against determinism into a precise tool for analyzing the *structure* of agency failure.
  *   **Novel Perspective on Agency:** Offers a fresh lens for examining human conditions like compulsions, potentially clarifying the locus of diminished agency (e.g., is the core failure in OCD loop-rigidity, while evaluative control remains?).
  *   **Advancing Free Will Theory:** Forces compatibilists and libertarians to specify which kind of flexibility their theories require, potentially resolving ambiguities and strengthening accounts of responsible agency.
  *   **Outcomes:** A substantive draft paper suitable for submission to a philosophy journal; a clear conceptual framework for future research.

  **6. Failure Conditions & Risk Management:**
  *   **Distinction Collapse (High Risk):** Rigorous analysis may reveal that loop-rigidity and frame-rigidity are inextricably linked in practice or conceptually. *Mitigation:* If collapse occurs, the project pivots to *demonstrating* this necessary connection and explaining *why* philosophers intuitively treat "sphexishness" monolithically, still yielding a significant result about the nature of rigid agency.
  *   **Sphex Exhibits Both/Neither Clearly (Medium Risk):** Ethology may conclusively show the wasp suffers both rigidities, or neither robustly (e.g., limited flexibility exists). *Mitigation:* The human compulsion case study provides a clearer potential dissociation. The core conceptual argument can proceed independent of the sphex's exact capacities, using it primarily to expose the historical conflation.
  *   **Insufficient Dissociation in Human Cases (Low Risk):** Arguments that compulsions involve frame-rigidity (e.g., "ego-dystonic" goals are still operative frames) might challenge the human example. *Mitigation:* Focus on the *phenomenology* of compulsion (the desire to change the goal) and philosophical accounts valuing higher-order evaluation; refine definitions to accommodate this nuance.
  *   **Access to Literature (Low Risk):** Reliance on standard philosophical texts and widely cited ethological descriptions (Wooldridge, Dawkins) minimizes the need for obscure sources. University library access and standard databases (PhilPapers, JSTOR) are sufficient.

  **7. Conclusion:**  
  This project offers a timely and focused intervention in free will debates by disentangling the ambiguous concept of "sphexishness." By rigorously defining and separating loop-rigidity from frame-rigidity, and testing this distinction against the sphex example and human compulsions, it addresses a precise, neglected question: which dimension of behavioral rigidity truly undermines free will? The three-month timeframe is feasible for this conceptual analysis, promising significant clarification within a core philosophical discourse.
