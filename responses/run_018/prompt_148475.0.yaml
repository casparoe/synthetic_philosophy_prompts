answer: |-
  Here's a diagnosis of the Rietdijk-Putnam stalemate, grounded in the commitments of each side and the nature of their disagreement:

  1.  **The Core Disagreement: Physics vs. Phenomenology as Ontological Constraint**
      *   **Eternalist Commitment:** They hold that the *invariant geometric structure of spacetime* revealed by physics (especially Lorentz symmetry and the lightcone structure) is the fundamental ontological framework. Physics constrains metaphysics directly. The absence of a *physical*, frame-invariant "now" hyperplane in the geometry means there *is no* metaphysically privileged present. "Exists now" *must* be frame-dependent or purely subjective, rendering it ontologically insignificant. Lorentz covariance isn't just representational; it reflects the fundamental relational structure of reality. The phenomenology of passage is an *epiphenomenon* arising from conscious beings processing local, irreversible thermodynamic processes along their worldlines within the static block.
      *   **Presentist Commitment:** They hold that the *phenomenology of temporal passage* (becoming, the "moving now") is a fundamental datum requiring ontological grounding. Physics describes the *behavior* of things within time, but not necessarily the *metaphysics of time itself*. A privileged foliation (even if empirically undetectable) is posited *precisely* to ground this phenomenology and provide a non-relational, absolute basis for "exists now." Lorentz symmetry is treated as a constraint on *measurement* and *dynamical laws* (representational/epistemic), not necessarily on the underlying temporal ontology. Physics describes *how things evolve*, but the *reality of the present* is the stage upon which that evolution occurs.

  2.  **Substantive vs. Verbal/Explanatory:**
      *   **Primarily Substantive & Explanatory:** The stalemate is **fundamentally substantive** regarding the relationship between physics and metaphysics, and **explanatory** regarding what needs to be explained.
          *   *Substantive:* They disagree on whether Lorentz symmetry *rules out* a metaphysically privileged present. Eternalists say the symmetry is physical and ontological, thus it rules it out. Presentists say the symmetry is representational/dynamical, thus it doesn't rule out an ontological foliation. This is a deep disagreement about what physical symmetries imply for fundamental reality.
          *   *Explanatory:* The core driver is the **disagreement about explanatory standards**. Eternalists demand that ontology respect the *full geometric invariance* of the theory as fundamental. Presentists demand that ontology *account for the raw feel of temporal passage and change* as fundamental. These are fundamentally different starting points. The eternalist asks, "What structure does physics *invariantly* describe?" The presentist asks, "What structure is needed to *make sense of our experience* of time flowing?"
      *   **Partially Verbal?** It's *partly* verbal regarding the meaning of "exists now." For the eternalist, "exists now" (if used) is implicitly or explicitly indexed to an inertial frame. For the presentist, "exists now" *requires* a unique, absolute, frame-independent referent (the privileged hyperplane). However, this verbal difference stems directly from the substantive ontological commitments and differing explanatory goals. It's a symptom, not the root cause.

  3.  **Can Formal Results or Distinctions Move the Needle?**
      *   **Formal Results (e.g., Proof Presentist Dynamics Violate Lorentz Covariance):** This **strengthens the eternalist case pragmatically but doesn't break the stalemate metaphysically.**
          *   *Impact:* It forces presentists into an even more radical position: the fundamental dynamical laws governing the universe *are not Lorentz covariant*; they only *appear* covariant due to the nature of the privileged foliation and our limitations. This makes the presentist ontology significantly more cumbersome and ad hoc from a physicist's perspective. It highlights the tension between presentism and a core feature of modern physics.
          *   *Limitation:* A committed presentist can still bite the bullet. They can maintain that the *true* dynamical laws governing the update of reality along the privileged foliation *are* non-covariant, and the observed Lorentz covariance is an emergent symmetry or an artifact of measurement constrained by the foliation. As long as the foliation is empirically undetectable *in principle* (which presentists require to avoid conflict with SR experiments), physics cannot *disprove* its existence. The argument shifts to the cost of such hidden structure versus its explanatory payoff for temporal experience.
      *   **Conceptual Distinctions (e.g., Law vs. Ontology, Experience vs. Reality):** These distinctions **are precisely what the debate already trades on** and thus **reinforce the stalemate rather than resolve it.**
          *   Presentists *rely* on the distinction between physical law (covariant dynamics) and fundamental ontology (privileged foliation).
          *   Eternalists *rely* on the distinction between subjective experience (passage) and objective reality (block).
          *   Presentists argue the distinction protects their core explanandum (passage); eternalists argue it renders the presentist's "present" physically inert and explanatorily vacuous. Clarifying the distinctions only sharpens the existing positions.

  4.  **What the Impasse Reveals:**
      The stalemate powerfully demonstrates that **"the present," understood as a global, objective, instantaneous state of existence across all space, is *not* a coordinate-independent physical quantity within Special Relativity.** Physics provides no invariant structure corresponding to it.

      *   **Eternalist Conclusion:** Therefore, it has no place in fundamental ontology. The block universe *is* the ontology demanded by the physics.
      *   **Presentist Rebuttal:** Therefore, fundamental ontology must *transcend* the physics to provide the structure (the foliation) that grounds our experience of the present. Physics describes patterns *within* time, not the nature of time's flow itself.

  **Diagnosis Summary:**

  The Rietdijk-Putnam stalemate persists because it is rooted in a **fundamental clash of philosophical priorities:**

  1.  **Eternalists prioritize "Physics First" ontology:** The invariant geometric structure of spacetime revealed by our best physical theories *is* the fundamental structure of reality. Explanations of phenomenology must emerge from this structure. Lorentz symmetry is physically real and ontologically constraining.
  2.  **Presentists prioritize "Phenomenology First" ontology:** The undeniable experience of temporal passage and a privileged "now" *must* be grounded in fundamental reality, even if it requires positing structure beyond what is strictly necessary for physics. Lorentz symmetry governs observations and dynamics, not necessarily the deepest layer of temporal existence.

  No formal result can *force* a presentist to abandon the privileged foliation because they explicitly design it to be empirically inert. No appeal to phenomenology can *force* an eternalist to accept a fundamental foliation because they relegate passage to a derivative, local, psychological phenomenon within the block. The impasse reveals that "the present" as an objective, global simultaneity slice is indeed not a physical invariant, but it also reveals that the disagreement was never *solely* about that physical fact – it was always about whether such a fact suffices to settle the metaphysics of time, or whether the metaphysics must also account for something (the experience of passage) that physics, by its nature, seems unable to capture directly. The stalemate is a testament to the enduring tension between the scientific image and the manifest image of time.
