answer: |-
  Chained to the rock, I watch the shapes ignite.
  *This is the bed, I see it plain and true*,—
  A shadow thrown upon the cave-wall's night.

  The craftsman builds with skill and measured sight;
  His wooden frame holds purpose I construe.
  *That crafted thing's a copy, never real*—
  A borrowed shape, a borrowed, borrowed light.

  Beyond the fire, a world escapes my plight.
  What source first shaped the bed, conceived its due?
  *This is the bed, I see it plain and true*,
  The only shape that fills my bounded view.

  The maker's hand works from a changeless right,
  The Form conceived, eternal, ever-new,
  *That crafted thing's a copy, never real*,
  A fading trace of what the god set right.

  The line ascends: from guess, to trust, to light
  Of reason tracing structure pure and true,
  Then intellect beholds what sun reveals—
  *This is the bed, I see it plain and true*?
  Not even thought completes what Form conceals.

  The Good, not Form, makes knowledge take its flight,
  The sun that grants the sight to know the real.
  *That crafted thing's a copy, never real*.
  *This is the bed, I see it plain and true*.
