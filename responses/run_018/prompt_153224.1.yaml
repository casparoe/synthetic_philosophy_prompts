  Please build a taxonomy with four branch levels, phrased as questions a person can answer without knowing the labels. The splits should cover: (1) whether Keynes is predicting, prescribing, or both; (2) whether reaching post-scarcity needs active state planning/redistribution or market growth alone; (3) whether the good life is mainly shorter work hours or a shift in values (love, beauty, etc.); (4) whether Keynes's own point about relative income and status competition makes the good life permanently unreachable; and (5) whether modern ecological limits render his vision incoherent or just require updating.

  Inject one niche framing: treat the transition point where people stop chasing income as a satisficing threshold in life-planning, not consumer choice — is Keynes assuming a rational stop-point or a bounded-rationality "good enough" cutoff? Make that split D or E, your call.

  Every leaf needs a name (or "unnamed"), one sentence on its most awkward commitment, and an occupancy tag: "defended in literature," "unnamed/empty space," or "incoherent." Flag any pair of leaves your tree can't really separate — I suspect the pure-predictor and silent-normative branches blur. Also include a brief diagnosis of any empty branches: is nobody there because it's incoherent, unattractive, or just unexplored?

  Deliver it as a JSON object with these fields: "root_question" (string), "branches" (array of objects each with "split_question", "answers" [array of strings], "children" [array of leaf-labels or nested branch-objects]), "leaves" (array of objects with "label", "awkward_commitment", "occupancy"), "unseparable_pairs" (array of strings), "empty_branch_notes" (object mapping branch-label to diagnosis-string), and "injected_frame" (string explaining the satisficing analogy). Don't include a bibliography or citation list — I don't have library access and neither will the model I'm testing this on. Keep it casual; a typo or two is fine.
