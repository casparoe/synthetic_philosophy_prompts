  ## Assessed Essay: The Standing Puzzle in Blame and Equity

  **The Practice** (150 words)

  English legal systems exhibit a puzzling duality regarding the relevance of a complainer's own conduct. In criminal law, a defendant's plea of "*tu quoque*" ("you did it too") – arguing the victim committed similar wrongdoing – is universally rejected. This conduct is deemed irrelevant to the defendant's guilt for the *specific* offence against *this* victim; the victim's rights are paramount. Conversely, in equity, the "clean hands" doctrine allows a court to deny equitable remedies (like injunctions or specific performance) to a claimant whose own conduct regarding the dispute was itself wrongful or unconscionable. Crucially, this applies even if the claimant's wrong mirrors the defendant's alleged misconduct. Thus, the law implicitly recognises hypocrisy as sometimes undermining the standing to complain (equity), while at other times treating it as entirely beside the point (criminal law).

  **The Implicit Theory of Each Half** (300 words)

  The rejection of *tu quoque* in criminal law rests on an implicit theory where standing to complain (or, more accurately, the state's standing to prosecute on the victim's behalf) derives solely from the violation of a fundamental right or prohibition. The victim's own past sins are irrelevant to the *wrongfulness* of the act *done to them*. Their standing, as the bearer of the violated right, is inherent and inviolable. The focus is on the defendant's culpability for transgressing societal norms protecting individuals. Permitting *tu quoque* would allow offenders to evade accountability based on the victim's character, undermining the core principle that rights violations demand redress regardless of the victim's moral ledger. Standing flows intrinsically from suffering the wrong.

  Conversely, the clean hands doctrine in equity presupposes a different implicit theory of standing. Here, standing to seek *equitable relief* is conditional upon the claimant approaching the court with "clean hands" – that is, without having engaged in related misconduct themselves. Standing is not inherent but *performative* and *relational*. It hinges on the claimant's moral credibility and the court's perception of fairness in granting discretionary relief. Equity, concerned with conscience and fairness between parties, views a claimant who has committed a similar or connected wrong as lacking the moral authority or "standing" to invoke the court's conscience for their own benefit. Their hypocrisy or unclean conduct taints their plea, making it inequitable for the court to assist them, even if a legal wrong technically occurred. Standing here is earned or maintained through just conduct in the matter.

  **Strictly Presupposed vs Merely Fits** (200 words)

  The criminal law's stance *strictly presupposes* that the victim's prior conduct is categorically irrelevant to establishing the defendant's guilt for the specific offence. The victim's standing to have their rights vindicated is absolute, presupposing rights as trumps against others' actions. While this fits a retributive or rights-based theory of punishment, it doesn't strictly *require* it; a consequentialist could also argue *tu quoque* hinders deterrence.

  The clean hands doctrine *strictly presupposes* that a claimant's own related misconduct can *invalidate* their standing to seek equitable remedies. Equity presupposes that standing is contingent upon moral posture concerning the dispute. It fits theories emphasising the relational nature of equity and the court's role as a guardian of conscience, but doesn't strictly demand any single moral philosophy – it could align with fairness, reciprocity, or a specific view of hypocrisy's undermining force. The key presupposition in equity is that standing for discretionary relief is not automatic but conditional on conduct.

  **Where the Practice is Underdetermined** (200 words)

  The practice as a whole is philosophically underdetermined regarding a *unified* theory of standing applicable to all normative complaints. It doesn't specify *why* rights violations in criminal law create absolute standing impervious to victim hypocrisy, while equitable claims render standing fragile and contingent on the claimant's own hands. The boundary itself is underdetermined: why should the *type of remedy sought* (criminal sanction vs. equitable relief) fundamentally alter the relevance of the complainer's conduct to their standing? Neither doctrine explicitly addresses whether standing derives fundamentally from the nature of the wrong, the institutional role (court of law vs. court of conscience), the type of norm violated (legal prohibition vs. equitable principle), or the purpose of the proceeding (punishment/state accountability vs. private dispute resolution with conscience). The practice offers distinct operational rules without furnishing an overarching principle explaining when and why hypocrisy destroys standing. This leaves room for competing philosophical justifications for the divergence, such as the unique conscience-based jurisdiction of equity versus the state's monopoly on punishing public wrongs.

  **What would have to change** (150 words)

  Adopting the pure view that "a wrong is a wrong no matter who points it out" would necessitate significant change, primarily within the equitable clean hands doctrine. If the mere occurrence of the defendant's wrong demands redress irrespective of the complainant's moral status, the doctrine's core rationale – that unclean hands *deprive* the claimant of standing – collapses. Equity could no longer automatically refuse relief solely based on the claimant's related misconduct. The focus would shift entirely to the defendant's wrongdoing. Remedies might still be shaped by claimant conduct (e.g., denying specific performance due to claimant delay, or reducing damages for contributory negligence), but this would be based on practicalities, fairness in shaping the remedy, or the claimant's contribution to the harm, *not* on the claimant lacking the inherent standing to complain about the wrong itself due to their own hypocrisy or similar fault. The link between claimant conduct and *standing* would be severed.
