prompt: |-
  Been going back and forth on blame for ages and I want someone to check whether my actual package hangs together before I try to teach it. Where I've landed:

  (a) whether someone deserves blame depends only on them — what they did, their reasons, what they were capable of — and nothing about the person doing the blaming makes the target any more or less blameworthy;
  (b) even so, a hypocritical blamer lacks standing: their blame is out of order and they should keep it to themselves, even when the target obviously deserves blame;
  (c) what does the forfeiting is the blamer having done a relevantly similar wrong themselves and not owned up to it;
  (d) standing isn't scalar — you either have it or you don't, and it doesn't get discounted just because the blamer's own version was much smaller than the target's;
  (e) you get it back by acknowledging it and genuinely changing, so the forfeiture isn't permanent;
  (f) none of this is special to blame between people who know each other — an uninvolved third party whose done the same thing and hasn't owned up to it lacks standing too;
  (g) but the person who's never done anything remotely like it, who blames only when it costs them nothing and goes quiet the moment the norm is inconvenient, has full standing — clean hands is what matters;
  (h) and I want to hang onto the thought that a lot of ordinary public criticism — random people calling out powerful people who do bad things — is perfectly appropriate and is one of the few accountability mechanisms that actually does any work.

  So: which of these really collide and which only look like they do? I half suspect (a) and (b) are fine together and the appearance of conflict is an illusion, but I can't tell where the real problem is. Rank whatever genuine tensions you find by how bad they are, say for each one what would have to give and what that costs me, and name the single revision that cleans up the most. Also: seperate what's actually settled among people who work on this from what's a live dispute — don't smooth a contested view into orthodoxy for me.
reasoning: |-
  Okay, the user is diving deep into the philosophy of blame and standing. They've outlined a comprehensive package with points (a) through (h) and want to know where the internal tensions lie. Let me start by unpacking each part.

  First, point (a) says blameworthiness is solely about the target—their actions, reasons, capabilities. Nothing about the blamer affects whether the target deserves blame. That makes sense. Then (b) introduces hypocritical blamers lacking standing; their blame is inappropriate even if the target deserves it. So (a) and (b) together mean blameworthiness is objective, but voicing it depends on the blamer's own history. The user suspects these two can coexist, and I agree. The conflict might be superficial because (a) is about desert, while (b) is about the permissibility of expressing blame.

  Point (c) specifies that forfeiting standing comes from committing a similar wrong without owning up. The user ties hypocrisy to unacknowledged similar actions. But here's a potential issue: what counts as "relevantly similar"? If the blamer's wrong is much smaller (point d), standing isn't scalar. Even a minor similar wrong without acknowledgment removes standing entirely. That could clash with intuition. For example, if someone stole a candy bar once and didn't admit it, can they never blame a corrupt CEO for embezzlement? The user might need to refine "relevantly similar" to include scale or context, but that risks complicating the binary stance in (d).

  Point (g) emphasizes that clean hands grant full standing, even if the blamer only acts when it's costless. But critics might argue that opportunistic blamers lack moral credibility. The user wants public criticism (h) to be valid, like calling out powerful figures. If standing requires genuine commitment to the norm, then fair-weather blamers might not have standing. However, the user insists clean hands are sufficient. Here, tension arises between (g) and the underlying principle that standing requires more than just not sinning—perhaps consistent adherence to the norm. If a person only blames when convenient, their blame might seem performative rather than sincere, challenging their authority.

  Another conflict is between (d) and (f). Non-scalar standing applies to both interpersonal and third-party cases. But if a third party's similar wrong is trivial compared to the target's, does their lack of standing still hold? The user says yes, but this might undermine effective accountability. If minor past offenses silence critics, powerful wrongdoers could avoid blame because almost everyone has some minor transgression. That conflicts with (h), where public criticism is a key accountability tool. The user might need to adjust the non-scalar aspect or define "relevantly similar" more narrowly.

  The user also asks about settled views vs. controversies. Among philosophers, (a) is widely accepted. Hypocrisy affecting standing (b, c) is common but debated. The scalar nature of standing (d) is contested; some argue for degrees. The role of personal connection (f) is also disputed—some think hypocrisy only matters in relationships. Fair-weather blame (g) is contentious; clean hands might not suffice if the blamer isn’t committed. 

  The most significant tension is between non-scalar standing (d) and effective public criticism (h). If standing is binary and easily lost, it could silence necessary critics. The best fix might be to make standing scalar or adjust "relevantly similar" to account for severity. Sacrificing strict non-scalarity could resolve this, allowing proportionality in standing without abandoning the core ideas. This revision would preserve the importance of hypocrisy while enabling meaningful public accountability.
answer: |-
  Your package is philosophically coherent but contains genuine tensions—some manageable, others more problematic. Here’s a breakdown of collisions, ranked by severity, with costs of revision and the most efficient fix:

  ### **Ranked Tensions (Worst First)**
  1. **Tension: (d) Non-scalar standing + (h) Public criticism effectiveness**  
     - **Problem**: If standing is binary and easily forfeited by *any* unacknowledged similar wrong (c), public criticism becomes fragile. In large groups, *someone* will inevitably share even a minor similarity to the wrong (e.g., "You criticized a CEO for tax fraud but once lied on a tax form!"). This risks silencing criticism of power (h), contra your goal.  
     - **Cost of revising (d)**: Making standing scalar (e.g., forfeiture proportional to hypocrisy severity) weakens the clean elegance of "you have it or you don’t." It introduces messy gradations ("How similar is similar enough?").  
     - **Cost of revising (c)/(f)**: Limiting forfeiture to *serious* unacknowledged wrongs (or only in personal relationships) sacrifices universality (f) and invites arbitrariness.

  2. **Tension: (g) Clean hands suffice + (b) Hypocrisy forfeits standing**  
     - **Problem**: (g) claims blamers with "clean hands" (no similar wrong) have full standing *even if they blame opportunistically* (only when costless). But opportunistic blamers may still be hypocritical in a broader sense: they enforce norms they don’t *consistently endorse*. If hypocrisy forfeits standing (b), why doesn’t this "normative hypocrisy" count?  
     - **Cost of revising (g)**: Requiring sincere commitment (beyond clean hands) to blame risks excluding valid public critics who are imperfect allies.  
     - **Cost of revising (b)**: Narrowing hypocrisy to *behavioral* similarity (c) protects (g) but may feel underspecified—why is inconsistent action worse than inconsistent principle?

  3. **Tension: (a) Blameworthiness is agent-relative + (c) Blamer’s own actions forfeit standing**  
     - **Problem**: Minimal. (a) concerns *desert* (the target’s culpability), while (b)/(c) concern *standing* (the blamer’s authority). These are distinct layers, widely treated as compatible in moral philosophy (e.g., Watson, Wallace).  
     - **Resolution**: No revision needed. The "conflict" is illusory—your package reflects the standard view that desert is objective, standing is relational.

  ### **The Single Best Revision**
  **Revise (d) to allow scalar standing** in extreme cases:  
     - *Proposal*: Retain binary standing *except* when the blamer’s past wrong is *radically disproportionate* (e.g., stealing $10 vs. genocide). Here, standing is merely diminished, not absent.  
     - **Why it helps most**:  
       - Preserves (h) by preventing minor transgressions from silencing criticism of major wrongs.  
       - Retains core intuitions: gross hypocrites still lack standing, clean hands still suffice (g).  
       - Avoids the nuclear option where a parking violator can’t condemn a murderer.  
     - **Cost**: Modest complexity. You lose pristine binarity but gain realism.

  ---

  ### **Settled vs. Contested Views in Blame Theory**
  | **Your Claim**               | **Settled?** | **Contested?** | **Notes**                                                                 |
  |------------------------------|--------------|----------------|---------------------------------------------------------------------------|
  | **(a) Blameworthiness agent-relative** | ✅ Widely accepted | ❌ Rarely disputed | Orthodoxy (Strawson, Scanlon). Disputes focus on *conditions* for blameworthiness. |
  | **(b) Hypocrisy forfeits standing** | ⚠️ Consensus with nuance | ✅ Yes | Most agree hypocrisy undermines standing (Wallace, Smith), but scope/mechanism debated. |
  | **(c) Similar wrong + no ownership forfeits** | ❌ No | ✅ Heated debate | "Relevantly similar" is contested. Some argue only *same norm* matters (Fritz & Miller); others require comparable harm (Todd). |
  | **(d) Standing non-scalar**  | ❌ No        | ✅ Core dispute | Binarists (Scanlon) vs. scalarists (Coates, Tognazzini). Empirical work suggests folk intuitions are scalar. |
  | **(f) Standing impersonal**  | ⚠️ Mixed     | ✅ Yes          | Some tie standing to relationships (Bell); others see it as moral authority (Govier). |
  | **(g) Clean hands suffice**  | ❌ No        | ✅ Major rift   | Critics argue blame requires *sincere commitment* (Hieronymi), not just clean hands. Opportunism may undermine standing. |

  ---

  ### **Recommendations**
  1. **Address the (d)+(h) tension first**: Adopt scalar standing for radical disproportionality. This protects public criticism (h) without gutting hypocrisy objections.  
  2. **Clarify "relevantly similar" (c)**: Specify if similarity hinges on *moral principle violated*, *type of harm*, or *context*. This prevents over-forfeiture.  
  3. **Defend (g) against "normative hypocrisy"**: Argue clean hands are *procedurally* sufficient—opportunism may make blame ineffective but doesn’t invalidate standing.  

  Your core framework (a)+(b) is robust. The tensions arise from applying it to social/political contexts (h), where moral authority is fluid. Prioritize saving public accountability—it’s the linchpin of your normative project.
