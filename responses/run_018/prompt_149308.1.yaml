answer: |-
  1.  It presupposes a non-voluntarist theory of collective moral responsibility where the state, as a continuous institutional agent, inherits obligations for systemic wrongs committed under its authority, distinct from aggregating individual liabilities or relying on present beneficiaries' voluntary associations.
  2.  The practice relies on a strong conception of intergenerational institutional identity, viewing the state as a unified moral person persisting across time, thereby enabling obligations towards descendants of victims; this explicitly excludes purely associative obligations based on shared identity or benefits and strictly presentist harm-based theories requiring direct causation by current actors.
  3.  The apology functions primarily as a performative act intended to transform moral relations (acknowledging debt, altering status) rather than merely reporting institutional mental states, evidenced by the 'moral accounting clause' creating a new, non-legal normative category of outstanding moral debt.
  4.  A philosophical tension exists between the state declaring a perpetual, non-extinguishable moral debt through the apology/reparation framework and its simultaneous adherence to statutes of limitation in private tort law, which extinguish legal claims based on the passage of time, implicitly privileging institutional continuity over individual redress.
  5.  The core institutional feature requiring abandonment if continuous state personhood were rejected is the state's capacity to bear inherited, non-derivative moral obligations for historical wrongs committed by prior regimes, rendering the practice's foundation for intergenerational responsibility incoherent.
