  Explanatory asymmetry is fascinating. It's not mandatory but profoundly useful for weeding out circular arguments. If a theory claims "China lacked factor X" but can't show why X mattered more in 1800 than 1400 (when China led), that's a red flag. Should explicitly credit the user for spotting this niche philosophy-of-science crossover. 

