prompt: |-
  i'm trying to work out the criteria for what counts as a legit answer to a contrastive history question like "why Britain and not China?" for my comparative history course, and i keep getting lost in whether we're asking for a causal story or just a counterfactual fantasy. can you write out the full list of desiderata that a theory of teh Great Divergence needs to meet if its going to handle that framing properly? for each one, give the motivating case behind it—like why we should care if the theory respects initial-condition parity around 1700, or why it matters whether the explanation still works if you imagine teh Qing state actually subsidizing coal extraction in Shanxi but still not getting mechanized textile production. i want you to flag which requirements are non-negotiable (maybe empirical consistency with proto-industrialization in both regions?) and which are just camp-specific preferences, like the institutionalists wanting property-rights stories vs. teh Needham-camp people who care more about cultural epistemics. also say if some subset is jointly unsatisfiable—like if demanding strict counterfactual stability plus full explanatory specificity collapses the question into unanswerability. don't just score the usual suspects, keep teh weight on teh criteria themselves, and please don't hand me a bibliography or citation list since i don't have access right now and need to think this through on my own. oh, and i'm especially curious whether "explanatory asymmetry across technological regimes" should be on teh list or if that's just a prejudice i'm importing from philosophy of science.
