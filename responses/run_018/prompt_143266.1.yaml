answer: |-
  Here’s a rigorous framework for evaluating "why Britain, not China?" explanations, structured by desiderata with their rationale, necessity, and tensions:

  ### Core Non-Negotiables (Mandatory for Legitimacy)
  1. **Empirical Consistency**  
     *What*: Must align with documented conditions in both regions pre-1750 (e.g., market sophistication, proto-industry, agricultural yields).  
     *Why*: If your theory requires Chinese markets to be "backward" but evidence shows thriving Jiangnan silk trade, it’s invalid. Ignores *actual* starting points.

  2. **Temporal Alignment**  
     *What*: Causal factors must precede/coincide with divergence onset (c. 1750–1800), not just exist centuries prior.  
     *Why*: Citing Song Dynasty innovations (e.g., 12th c.) as decisive fails—why no divergence then? Isolates *proximate* triggers.

  3. **Causal Specificity**  
     *What*: Mechanism must explain *industrial* breakthroughs (e.g., steam power, factories), not just growth.  
     *Why*: Qing China had growth and trade—but not mechanization. A theory explaining "wealth" ≠ explaining "coal-powered looms".

  ### Contingency Tests (Stress-Testing the Explanation)
  4. **Counterfactual Stability**  
     *What*: If key factors in Britain (e.g., patent laws, coal proximity) were transplanted to China c. 1700, does industrialization follow? If yes, theory holds; if no, it's insufficient.  
     *Why*: Your coal subsidy case—if Qing *had* cheap Shanxi coal but *no* factories emerge, "coal access" alone isn’t explanatory. Exposes missing factors.

  5. **Contingency Sensitivity**  
     *What*: Can the theory accommodate small changes altering outcomes? (e.g., "If British state fragmented in 1688, divergence fails").  
     *Why*: Rigid theories (e.g., "Confucianism doomed China") crumble if minor twists (e.g., a reformist emperor) could override them. Favors path-dependent accounts.

  ### Comparative Parity Requirements
  6. **Initial Condition Symmetry**  
     *What*: Must not assume Britain/China differed in *irrelevant* ways c. 1700 (e.g., "Chinese weren’t rational").  
     *Why*: Actual similarities matter—both had sophisticated states, labor-intensive farming, merchant capital. Arbitrary asymmetry = Eurocentrism.

  7. **Factor Scarcity Balance**  
     *What*: Explanation can’t rely on a factor abundant in China (e.g., skilled artisans) being absent.  
     *Why*: If "high wages caused British automation" but Jiangnan wages were comparable, the mechanism falters.

  ### Explanatory Power Gradients
  8. **Asymmetry Across Technological Regimes**  
     *What*: Must explain why *this* era’s tech (coal/steel) favored Britain, not earlier eras (e.g., porcelain/silk) where China led.  
     *Why*: Valid demand! If your theory (e.g., property rights) applies equally to 1100–1700, it can’t explain *timing*. (This is a strength—not prejudice.)

  9. **Factor Interdependence**  
     *What*: Should show how causes (e.g., institutions, resources, science) *interacted* uniquely in Britain.  
     *Why*: Single-factor theories (e.g., "coal caused it") ignore why China didn’t use its coal despite technical capability.

  ### Camp-Specific Preferences (Not Universal)
  - **Institutionalists**: Demand *micro-incentives* (e.g., profit-driven tinkerers protected by courts). Reject cultural determinism.  
  - **Needhamians**: Prioritize *epistemic breaks* (e.g., why Baconian empiricism > Neo-Confucian methods). Reject pure materialism.  
  - **Materialists**: Focus on *energy/ecological constraints* (e.g., coal accessibility, soil depletion). Downplay ideas.

  ### Tensions and Trade-offs
  - **Specificity vs. Stability Paradox**: Demanding *both* "if X changed, outcome reverses" (strong contingency) *and* "only X could cause it" (specificity) risks overdetermination. Resolve via "Goldilocks contingency"—factors must be necessary but insufficient alone.  
  - **Parity vs. Asymmetry**: Stressing similarity c. 1700 *too* much obscures subtle but critical differences (e.g., fiscal-military state models). Balance is key.  
  - **Counterfactuals vs. Evidence**: Pure counterfactuals (e.g., "if China had colonies...") can devolve into fantasy. Anchor in *plausible* alternatives (e.g., Qing policies *that were debated*).

  ### Why This Works
  A theory meeting 1–3 and 6–7 is *historically grounded*. Adding 4–5 and 8–9 makes it *causally robust*. Camp preferences (e.g., institutions vs. culture) shape emphasis but *cannot override* non-negotiables. Your "explanatory asymmetry" (#8) is essential—it forces theories to grapple with technological context, not just generic "progress."

  > **Key Insight**: The "why not China?" framing demands showing why China’s *actual trajectory*—despite its capabilities—lacked the *specific combo* of factors that ignited in Britain. Not a fantasy of "if China was Western," but why its real path diverged at the *industrial* threshold.
