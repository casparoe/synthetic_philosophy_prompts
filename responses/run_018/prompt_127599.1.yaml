answer: |-
  ## Opening Address: Fixed Points & Variations  
  *Delivered at the Design School Interdisciplinary Workshop*

  Good morning. It is a profound pleasure to welcome artists, architects, and cognitive scientists to this shared space of inquiry. We gather under the banner of “Fixed Points and Variations”—a title deliberately echoing Douglas Hofstadter's enduring insight: that creativity is not a lightning strike from the void, but a rigorous dance of disciplined variation around a hidden invariant. It is the *knob-twiddling* that reveals the theme’s depth, not the invention of the theme itself. Today, we celebrate not discovery *ex nihilo*, but the *mastery of choice*: which knobs to turn, and—crucially—which parameters to freeze.

  To ground this abstract model, let me introduce a simple exercise: **“The Frozen Parameter.”** Imagine teams are each given an identical, modular chair. Every dimension, material, joinery, even its function—all are mutable. *Except one.* For Team A, the seat height is irrevocably locked at 43 centimeters. For Team B, the chair must collapse using exactly three hinges—no more, no less.  

  What happens? Team A cannot simply scale the chair up or down. That fixed 43cm *forces* radical reimagination. Perhaps they cantilever the seat dramatically, challenge material strength with impossibly thin legs, or embed the chair into a sculpted plinth that meets the invariant height. Team B, shackled to three hinges, must invent novel geometries of folding—exploring asymmetric deployments, nested structures, or hinges that serve dual purposes as armrests or supports. **The frozen parameter is not a cage; it is the engine.** It transforms arbitrary tinkering into *legible exploration*. Without that invariant, variations become noise—a chair morphing chaotically into a table, a sculpture, then a ladder, losing coherence. The frozen parameter *creates the frame* within which innovation becomes meaningful, comparable, and profound.

  This, I contend, is the essential structure of all creative and cognitive breakthroughs represented in this room. **Therefore, I take this unequivocal position: The success of every project here—whether artistic, architectural, or scientific—is measured precisely by the degree to which it makes its hidden invariant explicit, visible, and structurally generative.** The invariant is not a silent assumption; it is the cornerstone demanding articulation.

  Why this strong stance? Because the frozen parameter does three vital things:

  1.  **Creates Discernible Trajectories:** Like the fixed seat height forcing novel solutions *around* it, a clear invariant defines the axis of variation. An architect’s parametric facade pulsating with light isn’t arbitrary chaos; its variations are legible *because* of an unspoken invariant—perhaps the fixed spatial frequency of its modules, or the unwavering rule that light intensity inversely correlates with occupant density. Make *that* visible, and the variations sing with purpose.
  2.  **Enables Deep Comparison:** Cognitive scientists studying analogy know this well. Analogy works *because* of preserved relational structure (the invariant) mapped across different domains (the variation). When a generative artist explores algorithmic variations of a form, the aesthetic power lies not in randomness, but in preserving the core generative rule—the ‘DNA’—while altering its expression. Making that rule visible allows us to compare variations meaningfully: “Ah, *this* is what changes when the seed number shifts, while *that* fundamental recursion stays intact!”
  3.  **Focuses Creative Agency:** The artist’s choice isn't merely *what* to vary; it’s *what* to hold sacred. Is it a material property? A topological relationship? A semantic association (like “chairness”)? Freezing a parameter isn’t passive acceptance; it’s an *active, rigorous declaration of what matters most* in this exploration. The cognitive scientist’s model of conceptual space only gains predictive power when its fixed axes—its frozen parameters—are clearly defined.

  To our artists and architects: Your frozen parameter might be the unchanging material resonance of a ceramic module in a sprawling installation, or the fixed circulation path through a morphing pavilion. Honor it. Highlight it. Don’t let it hide. Its rigidity is what grants your variations their power and coherence.

  To our cognitive scientists: Your frozen parameter is often the invariant relational structure you posit underpinning an analogy, or the fixed constraints defining a conceptual space model. Rendering this explicit isn’t reductive; it’s what allows us to rigorously test how variations in input or context lead to variations in output or understanding.

  **Therefore, my challenge to every presenter over these two days:** Don’t just show us your dazzling variations. Reveal your frozen parameter. Show us the invariant you’ve held sacrosanct—the 43cm seat height, the three hinges—within your own work. Demonstrate how its unwavering presence *enabled* your explorations, forcing ingenuity, creating focus, and making your variations resonate as deliberate choices rather than whimsical detours. For it is in the *acknowledgement* and *deployment* of the fixed point that true creative discipline—and true cognitive insight—resides.

  ---

  **A Self-Critical Note:** My argument leans heavily on a somewhat formalist reading of Hofstadter’s conceptual spaces, treating parameters as pre-defined, discrete “knobs.” Some cognitive scientists argue parameters can emerge dynamically or be reconstituted *during* the creative process itself—that the invariant might not be frozen from the outset, but crystallize *through* variation. The “Frozen Parameter” exercise, while illustrative, risks oversimplifying this potential fluidity. It presents constraints as cleanly imposed, whereas in lived creativity and cognition, the ‘freezing’ might be a more complex, iterative negotiation between structure and exploration. This is a productive tension worth exploring in our discussions.

  Let the variations begin—anchored, always, to their fixed points. Thank you.
