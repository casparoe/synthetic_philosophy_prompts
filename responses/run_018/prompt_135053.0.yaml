  exam question: Explain Newton's bucket thought experiment and present one relaationist reply. Does that reply actually succeed?

  student answer (i fixed the spelling but kept the reasoning intact):

  Newton's bucket experiment involves hanging a bucket of water on a rope and twisting it. At first the bucket spins but the water stays flat. Eventually both rotate together, yet the surface becomes concave. Even with zero relative motion between the water and the bucket, the curvature stays, so Newton said the water is accelerating relative to absolute space itself, not just to other bodies. He actually used this same reasoning to prove that straight-line motion at constant velocity is absolute too, since without real space you couldn't distinguish it from rest.

  Leibniz replied with Mach's principle: the water curves because it's rotating relative to the distant stars and all the other matter in the universe. So we don't need an invisible container; relational motion is enough. This reply succeeds, which means Newton didn't prove substantivalism.

