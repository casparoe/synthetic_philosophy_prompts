answer: |-
  ### Structured Simulation: "Agents of Crisis in a 14th-Century Trading City"  
  **Duration:** 90 minutes total (3 rounds × 15 min, setup 5 min, debrief 15 min).  
  **Goal:** Explore how non-human forces act as "historical actors" with agency, while avoiding environmental determinism by emphasizing human response and adaptation.  

  ---

  ### **Setup**  
  **Setting:** Fictional Mediterranean city (e.g., "Porta Silvis") in the 1340s. Key challenges:  
  - **Plague** (Pathogen group) and **drought/floods** (Climate Oscillation group) threaten survival.  
  - Humans (**Port Council** and **Monastic Network**) must maintain stability.  

  **Groups & Resources:**  
  | **Group**              | **Starting Resources** | **Hidden Rules (on Rule-Cards)**                                                                 |  
  |------------------------|------------------------|--------------------------------------------------------------------------------------------------|  
  | **Port Council**       | Wealth: 8, Ships: 6    | Must keep Wealth ≥1 to function. Lose if Wealth=0. Can spend Ships to import grain or block ports. |  
  | **Monastic Network**   | Faith: 8, Medicine: 6  | Must keep Faith ≥1 to function. Lose if Faith=0. Can spend Medicine to heal or boost morale.      |  
  | **Pathogen**           | Virulence: 10          | Gains 1 Virulence per 2 Population lost. Spends Virulence to infect. Cannot be destroyed.         |  
  | **Climate Oscillation**| Severity: 10           | Gains 1 Severity per round. Spends Severity to disrupt harvests/trade. Cannot be negotiated.      |  

  **City Trackers (Central Board):**  
  - **Population:** 20 (lose if ≤5).  
  - **Grain:** 6 (city starves if ≤0; lose 1 Pop per missing Grain).  
  - **Stability:** 10 (lose if ≤0; falls with Pop/Grain loss).  

  ---

  ### **Round Structure (3 Rounds × 15 Min Each)**  
  Each round = 1 year (1346, 1347, 1348). Non-humans act first, then humans respond.  

  #### **Phase 1: Non-Human Actions (5 min)**  
  - **Pathogen:** Spends 1–3 Virulence to **infect**. Each Virulence spent = 1 Population lost.  
  - **Climate Oscillation:** Spends 1–3 Severity to **disrupt**. Each Severity spent = 2 Grain lost OR 1 Stability lost (their choice).  
  - *Constraints:* Humans cannot veto these actions. Facilitator enforces spending limits.  

  #### **Phase 2: Human Response & Negotiation (7 min)**  
  Humans spend resources to counter crises. They may trade (e.g., Port Council gives Wealth to Monastic Network for Medicine).  
  - **Port Council Options:**  
    - **Import Grain (Cost: 2 Ships → +3 Grain)**  
    - **Fund Quarantine (Cost: 2 Wealth → −1 Virulence next round)**  
    - **Bribe Officials (Cost: 1 Wealth → +1 Stability)**  
  - **Monastic Network Options:**  
    - **Heal the Sick (Cost: 2 Medicine → +1 Population)**  
    - **Pray for Relief (Cost: 2 Faith → −1 Severity next round)**  
    - **Distribute Alms (Cost: 1 Faith → +1 Stability)**  

  #### **Phase 3: Update & Payoff (3 min)**  
  1. Apply non-human actions (infections, grain/stability loss).  
  2. Apply human actions (grain/population/stability gains).  
  3. Update resources:  
     - Non-humans gain resources based on hidden rules (e.g., Pathogen gains Virulence if Pop lost).  
     - Humans gain bonuses if Stability ≥8: Port Council +1 Wealth, Monastic Network +1 Faith.  

  **Winning:** Humans win if Stability ≥5 and Population ≥10 after Round 3. Non-humans "win" if city collapses.  

  ---

  ### **Debrief (15 Min): Mapping Game to Historiography**  
  **Guiding Questions:**  
  1. **Agency of Non-Humans:**  
     - *"How did the Pathogen/Climate actively shape events? Did their 'rules' (e.g., Virulence growth) mirror historical forces?"*  
     - Key insight: Non-humans set *constraints*, not outcomes—e.g., plague opened windows for human choices (quarantine, flight).  

  2. **Avoiding Determinism:**  
     - *"When did human actions significantly alter outcomes? When were they overwhelmed?"*  
     - Highlight: Human responses (e.g., importing grain, prayer campaigns) created divergence—e.g., Stability loss could be mitigated by alms/quarantines.  

  3. **Limitations of the Simulation:**  
     - **Verbal Context Needed:** The game simplifies *temporal scale* and *complex feedback loops*. In reality:  
       - Environmental pressures (e.g., volcanic winters) unfold over decades, not 3 rounds.  
       - Human responses reshape environments (e.g., deforestation → erosion → worse floods), which the game’s linear "spend resource → get outcome" can’t capture.  
     - Stress: "Non-human actors are *relational*—their power emerges from interplay with humans, not predetermined fate."  

  ---
  ### **Logistical Notes**  
  - **Materials:** Rule-cards, central board with trackers, tokens for resources.  
  - **Facilitation:**  
    - Assign roles randomly. Remind non-human groups: "You are forces, not villains—stick to your rules."  
    - After Round 1, announce a "crisis event" (e.g., "Refugees arrive! −1 Stability") to add unpredictability.  
  - **Why It Works:**  
    - Non-humans set hard limits (e.g., Virulence spending forces humans to prioritize), but humans have tools to redirect outcomes.  
    - Collapse is possible but not inevitable—success hinges on adaptive choices.  

  This simulation makes non-human forces *tangible actors* while showcasing how human agency negotiates constraints—perfect for sparking debate on environmental history without determinism.
