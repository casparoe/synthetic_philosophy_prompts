  **Part B (8 points):** 
  Now consider the divided-driver case. The driver anticipates not only forgetfulness but active motivational resistance from a future "hot" reasoning state that will try to override the "cool" planning state's endorsed plan. To counter this, the driver installs an automated lock system that takes exit B by default at every intersection, unless the driver manually overrides it. The lock has a known 2% mechanical failure rate (meaning it fails to take exit B with 2% probability), in which case the driver must choose manually. The manual override is always physically available. 

