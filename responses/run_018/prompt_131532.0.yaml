  Breaking down each desideratum:
  First is the Hayekian knowledge problem—tacit knowledge can't be centralized without distortion. Any theory needs a mechanism for local actors to use their context-aware knowledge without top-down micromanagement. Second is dynamic adjustment—static models fail for innovation. The theory must explain how capital reallocation happens when entrepreneurs discover new possibilities. Third is the big one: scarcity signals without private ownership. Can shadow prices work? That's the core of the Lange-Lerner debate. 

  Fourth is preference revelation—if there's no market, how do we know what people want? Fifth distinguishes consumer vs capital goods coordination—mixing them causes cascading errors. Sixth tackles aggregation—comparing welfare across people is philosophically thorny but necessary for allocation. Seventh grounds it all in reality—the theory can't ignore how actual planning boards failed or how modern algorithms perform.

  Noticing tensions: Local autonomy clashes with centralized computation (desiderata 1 vs 3/5). Also, consumer sovereignty without prices (4) fights against avoiding welfare comparisons (6). The user wants to map existing models against these: Mises/Hayek would reject 3 entirely; Lange's trial-and-error tries to satisfy 3 but stumbles on 1 and 2; federated models might handle 1 better but still struggle with 2 and 4. 

  Key insight: No existing model clears all seven bars. The federated approach comes closest on computation but falters on entrepreneurship and consumer signals. Might need to hint that satisfying all constraints may require hybrid mechanisms—but the user explicitly wants desiderata first, not solutions. Stay descriptive, flag trade-offs neutrally.
answer: |-
  Here is a complete desiderata list for an adequate theory of economic calculation and coordination, grounded in the core problems of the socialist calculation debate. Each entry specifies a concrete requirement, its non-negotiable justification, and distinguishes genuine constraints from ideological preferences.

  ---

  ### **Desiderata for an Adequate Theory of Economic Calculation**
  *(Genuine constraints = GC; Camp-specific preferences = CSP)*

  1.  **Tacit/Local Knowledge Utilization**
      *   **Requirement:** The theory must enable economic decisions utilizing context-specific, non-codifiable knowledge (skills, bottlenecks, micro-conditions) held by local actors (workers, managers, suppliers), *without* requiring its full articulation or transmission to a central body.
      *   **Justification (GC):** Central aggregation destroys the meaning and timeliness of tacit knowledge (Hayek's "knowledge of the particular circumstances of time and place"). Ignoring it leads to gross inefficiencies, misallocations, and inability to adapt to local shocks. *Failure invalidates any large-scale economy.*
      *   **Mechanism Needed:** Theory must propose how local actors autonomously act on their knowledge *informed by* system-wide signals, or how decentralized agents generate signals reflecting local realities.

  2.  **Dynamic Adjustment & Entrepreneurial Discovery**
      *   **Requirement:** The theory must explain how the system discovers *new* production possibilities, technologies, and resource uses (especially in capital goods), reallocates capital dynamically, and corrects errors *before* full equilibrium is reached.
      *   **Justification (GC):** Reality is dynamic and uncertain. Static equilibrium pricing (even if achievable) provides no guidance for investment in innovation or structural change. Central bodies lack the incentives and distributed cognition for effective discovery (Kirzner/Mises). *Lack of discovery leads to stagnation.*
      *   **Mechanism Needed:** Theory must specify agents with incentive/compatibility to experiment, bear (simulated/imputed) risk, and drive change, generating signals about *future* potential value, not just current scarcity.

  3.  **Scarcity Signals without Private Capital Ownership**
      *   **Requirement:** The theory must demonstrate how accurate, actionable scarcity signals (reflecting opportunity costs) for *all* goods/services, especially capital and intermediate goods, can be generated and utilized *without* private ownership of capital and genuine asset markets.
      *   **Justification (Core Debate - GC):** Mises/Hayek argued private ownership & competitive markets are *necessary* for meaningful prices reflecting relative scarcity and trade-offs. Lange argued "trial-and-error" with public ownership and shadow prices could suffice. *Proving this possibility is the central challenge.*
      *   **Mechanism Needed:** Theory must detail how shadow prices (or equivalents) are computationally derived/administered *and* how they accurately reflect the dynamic opportunity cost of using scarce resources under public ownership, driving efficient substitution and investment.

  4.  **Preference Revelation & Consumer Sovereignty without Market Prices**
      *   **Requirement:** The theory must explain how subjective consumer valuations are revealed, aggregated, and transmitted to producers *without* relying on consumers spending private money in competitive markets, ensuring production ultimately serves consumer desires.
      *   **Justification (GC):** Without monetary bids reflecting intensity of preference, central planners rely on voting, surveys, or bureaucrat guesses, which are crude, manipulable, and fail to capture marginal trade-offs (Mises). *Lack of mechanism leads to producer dominance and misalignment.*
      *   **Mechanism Needed:** Theory must propose how individual preferences (including intensity and willingness to forego alternatives) are expressed, weighted, and transformed into signals guiding production and resource allocation, absent monetary exchange.

  5.  **Distinction: Allocative vs. Strategic Coordination**
      *   **Requirement:** The theory must clearly differentiate and provide distinct mechanisms for (a) short-run allocation of existing consumer goods/resources and (b) long-run strategic investment in capital structure and production capacity.
      *   **Justification (GC):** Conflating these levels (e.g., using similar "price" signals for both) leads to chronic errors: consumer goods allocation signals become distorted guides for irreversible capital investment. Strategic decisions require different information (future expectations, technological possibilities). *Conflation causes systemic malinvestment.*
      *   **Mechanism Needed:** Theory must separate how consumer demand influences immediate production adjustments vs. how long-term investment decisions (shaping future productive capacity) are informed and validated.

  6.  **Aggregation of Heterogeneous Welfare without Cardinality**
      *   **Requirement:** The theory must address how societal resource allocation decisions are made without requiring cardinal, interpersonally comparable utility measurements, while still making coherent choices between alternatives impacting different individuals differently.
      *   **Justification (GC/Philosophical Constraint):** Cardinal utility is scientifically unfounded and ethically problematic for imposing a single welfare metric. However, allocation inherently involves implicit or explicit trade-offs affecting different people's well-being (e.g., steel for hospitals vs. bicycles). *The theory must confront this aggregation problem honestly.*
      *   **Mechanism Needed:** Theory must specify the decision rule (e.g., democratic vote on plans, representative weighting, efficiency criteria under constraints) and its justification for resolving conflicts where Pareto improvements are unavailable.

  7.  **Empirical & Experimental Consistency**
      *   **Requirement:** The theory must be compatible with the observed failures of historical central planning (e.g., chronic shortages/surpluses, poor quality, slow innovation, environmental neglect) *and* the capabilities/limitations revealed by modern computational allocation experiments (e.g., combinatorial complexity, incentive issues in simulated markets).
      *   **Justification (GC):** A theory ignoring the empirical record of planning failures or dismissing the complexity revealed by computer science is implausible. *It must explain past outcomes and demonstrate computational feasibility.*
      *   **Mechanism Needed:** Theory must plausibly explain historical failures as avoidable under its model *and* demonstrate its proposed computational/informational mechanisms are scalable and robust to real-world complexity and imperfect information.

  ---

  ### **Key Tensions & Joint Unsatisfiability**

  *   **Complete Centralization vs. Local Epistemic Autonomy (1 vs 3/5/7):** The requirement for local actors to utilize tacit knowledge (1) fundamentally conflicts with mechanisms relying on complete central information aggregation for setting prices/plans (3,5). Central computation (7) inherently requires codifiable inputs, neglecting tacit knowledge. *Satisfying 1 requires significant decentralization, constraining centralization solutions for 3 and 5.*
  *   **Consumer Sovereignty without Prices vs. Avoiding Cardinal Welfare (4 vs 6):** Revealing nuanced preferences without prices (4) is extremely difficult. Non-market mechanisms (voting, delegation) inevitably involve aggregation rules that make implicit interpersonal comparisons or weightings (6), raising ethical and informational challenges. *Satisfying 4 fully likely requires market-like mechanisms; satisfying 6 fully without prices risks crude aggregation.*
  *   **Dynamic Discovery vs. Central Computation/Stability (2 vs 3/7):** Entrepreneurial discovery (2) thrives on decentralization, experimentation, and potential instability (creative destruction). Central computation (7) and stable shadow prices (3) favor equilibrium states and predictability. *Excessive central stability mechanisms can stifle the disequilibrium process essential for discovery.*

  ---

  ### **Position Assessment Against Desiderata**

  *   **Mises/Hayek Critique:**
      *   *Satisfies:* 1 (Emphasizes necessity of decentralized agents/markets), 2 (Highlights role of entrepreneurs/profit-loss in discovery), 4 (Markets reveal preferences via spending).
      *   *Fails/Rejects:* 3 (Argues accurate scarcity signals *impossible* without private ownership & markets), 5 (Assumes markets handle both levels), 6 (Assumes aggregation via prices avoids cardinal utility), 7 (Sees historical failures as inherent proof of impossibility).
      *   *Core Argument:* 3 is impossible under socialism; thus, all other desiderata relying on accurate signals fail.

  *   **Lange's Competitive Socialism (Trial-and-Error):**
      *   *Satisfies:* 3 (Proposes central setting of shadow prices based on reported shortages/surpluses), 4 (Retains consumer choice in simulated markets), 5 (Attempts separation - CPB sets capital prices, firms react), 6 (Avoids cardinal utility, uses efficiency rules), 7 (Addresses computation via iteration).
      *   *Fails/Weaknesses:* 1 (Relies on managers reporting local knowledge *truthfully* without ownership stakes/profit motive), 2 (Lacks real mechanism for radical innovation/imputation of future value; "managerial" adjustment, not entrepreneurial discovery), 7 (Ignores incentive problems in reporting and complexity beyond static equilibrium approximation).

  *   **Hypothetical Federated Model (Local Nodes + Central Optimizer):**
      *   *Satisfies:* 1 (Local nodes capture/process local constraints/knowledge), 3 (Central optimizer iteratively updates shadow prices based on aggregated constraint data), 5 (Potential for differentiating signals/processes), 7 (Leverages modern computing for complex optimization).
      *   *Fails/Weaknesses:* 1 (Risk of "codification bottleneck" - can nodes *truly* capture tacit knowledge as data?), 2 (Same discovery problem as Lange: Who drives innovation? How are future opportunities valued/imputed without markets?), 4 (How are *consumer preferences* fed in accurately without markets? Relies on voting/surveys?), 6 (Optimizer requires an objective function - how is societal welfare defined without cardinal utility? Democratic input creates aggregation problems). *Tensions:* Heavy central computation (7) clashes with epistemic autonomy (1) and discovery (2). Optimizer stability clashes with dynamism.

  ---

  This list defines the stringent criteria any proposed solution must meet. The inherent tensions, especially between decentralization/local knowledge and central coordination/computation, and between static efficiency and dynamic discovery, highlight why the socialist calculation debate remains fundamentally unresolved.
