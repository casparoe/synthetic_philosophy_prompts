answer: |-
  Here’s a lean 40-minute lesson plan designed for novelists, focused on clarity, avoiding logic jargon, and preempting misconceptions. The goal is to make them grasp the **structural flaw in the character’s repeated choices**, not just her willpower or memory.

  **Core Objective:** Make them understand that **consistent, seemingly smart individual choices can create a destructive loop due to shifting preferences over time (diachronic irrationality), draining resources inevitably.**

  **Dependency Order & Why:**

  1.  **Start with the LOOP (The Observed Phenomenon) - (10 mins)**
      *   **Why:** Novelists think in narrative. Hook them with the visible pattern/story first: "My character makes Bet A on Monday (smart!), Bet B on Tuesday (smart!), Bet C on Wednesday (smart!)... yet by Friday, she's mysteriously worse off. Repeat weekly. Over months, she's drained. How can smart choices = net loss?"
      *   **Immediately Frame the Problem:** "This isn't about *one* bad bet. It's the *pattern* of bets that's the trap. Today, we crack why this pattern is logically doomed, even if every single bet looks okay in the moment."

  2.  **Deconstruct a Single "Smart" Choice (Setup for Failure) - (10 mins)**
      *   **Why:** They need to see the *mechanism* of each individual decision before seeing how it chains into disaster.
      *   **Simple Example (Non-Gambling):** Use **Commuting Choices**.
          *   Monday: *Option A (Train):* Costs $5, takes 30 mins. *Option B (Drive):* Costs $10 (gas + parking), takes 20 mins. *"Today, time is precious! I'll pay extra to save 10 minutes. Smart! (Chooses Drive - B)"*
          *   Tuesday: *Option A (Train):* $5, 30 mins. *Option B (Drive):* $10, 20 mins. *"Today, money is tight. 10 minutes isn't worth $5. Smart! (Chooses Train - A)"*
      *   **Key Point:** Emphasize that *each choice*, *given her preference THAT DAY* (save time vs. save money), is rational. The problem isn't in the individual logic.

  3.  **Introduce the Cycle & Preference Swapping (The Pump Mechanism) - (15 mins)**
      *   **Why:** Now reveal how flipping preferences creates the pump.
      *   **Extend the Commuting Example:**
          *   Wednesday: *"Ugh, traffic alert! Drive (B) will take 40 minutes! Train (A) still 30 mins for $5. I *hate* long drives more than spending $5 today. Smart! (Chooses Train - A)"* (Prefers A over B today).
          *   Thursday: *"Traffic is back to normal. Drive (B) is 20 mins for $10, Train (A) 30 mins for $5. Time is money today! I'll pay $5 to save 10 mins. Smart! (Chooses Drive - B)"*
      *   **Map the Preference Swaps:**
          *   Mon: Prefers B (Drive) over A (Train) [Pays $5 *more* for 10 mins saved]
          *   Tue: Prefers A (Train) over B (Drive) [Prefers saving $5 over 10 mins]
          *   Wed: Prefers A (Train) over B (Drive) [Hates traffic even more]
          *   Thu: Prefers B (Drive) over A (Train) [Back to paying for time]
      *   **The Reveal:** "Look at Tuesday vs Thursday! On Tuesday, she *paid* to avoid the expensive option (B), choosing A. On Thursday, she *paid extra* to switch *back* to B. She paid to leave A for B, then later paid to leave B for A? That's like paying someone $5 to take your Train ticket on Tuesday, then paying another $5 on Thursday to get the Drive option back! Net loss: $10, back where she started commute-wise, but poorer. **This loop IS the money pump.** Each step seems smart, but the *cycling preferences* create net payments."

  4.  **Connect to the Character & Head Off Misconceptions - (5 mins)**
      *   **Use the Character NOW (as Analogy, Not Proof):** "This is EXACTLY what's happening to my gambler. Each morning, based on her *current* mood/need (thrill vs. security, optimism vs. pessimism), the bet seems smart. But over days, her preferences flip-flop: maybe betting high to chase a win one day, then betting low to avoid loss the next, then betting high again because low feels pointless... creating a cycle where she pays to enter and exit positions, draining cash."
      *   **Head Off Misconceptions EXPLICITLY:**
          *   **"Weak-Willed?"** NO! Stress this: Her choices ARE rational *synchronically* (at each moment). The failure is *diachronic* (across time). It's a structural trap, not willpower. **"She's not choosing the *wrong* option each time. She's trapped by how her *changing preferences* interact."**
          *   **"Forgetting is the Problem?"** (Crucial!) NO! **"Even if she remembered EVERYTHING perfectly, the trap persists.** On Tuesday, knowing she drove Monday doesn't change that *today* she values $5 over 10 mins. The flaw is in the *inconsistent valuation* of time vs. money across different moments, not memory. The amnesia in my novel highlights the *symptom* (she can't spot the pattern), not the *cause* (the structural preference cycle)."

  5.  **Check for Understanding (Structural Failure?) - (5 mins)**
      *   **The Test:** Pose a new, simple cycle scenario (e.g., buying/selling a book based on daily whims about reading it vs. needing cash). Ask: "If she keeps doing this loop based on daily preferences, what happens to her cash?" (They should say "drains").
      *   **The Key Question:** **"Is the cash drain happening because she forgets her past choices, or because of something inherent in the *pattern* of her changing preferences?"** They MUST answer "the pattern." If they hesitate, re-explain step 3 (the paying to swap back and forth).
      *   **Reframe the Takeaway:** "So, the money pump isn't about bad single choices or forgetting. It's a **preference failure across time**: preferences that cycle (A>B, then B>A) inevitably leak money if you act on them sequentially."

  **What to Openly Refuse to Cover:**

  *   **"We won't dive into formal decision theory, utility functions, or the Dutch Book theorems. This isn't a logic class! We're focused entirely on the *narrative mechanism* of this specific failure – how changing, cyclical preferences can drain a character (or person) dry through individually rational choices. That's the powerful novelistic insight."**

  **The Carrying Example - Use REAL WORLD (Commuting):**

  *   **Why NOT start with the amnesiac gambler?** It risks muddying the core concept. The amnesia *strongly* implies forgetting *is* the problem. Using a clear, relatable, non-fictional example (Commuting) isolates the *structural* preference cycle flaw. **Save the character as the *application* (Step 4), once the structure is clear.**

  **Why This Sequence Works:**

  1.  **Engagement First:** Starts with the observable story problem (the loop).
  2.  **Builds Mechanically:** Shows the parts (single choices), then assembles them into the faulty machine (the cycle).
  3.  **Preempts Misconceptions:** Directly addresses "weak-willed" and crucially, **de-couples the core flaw from memory** *before* introducing the amnesiac character as an example.
  4.  **Uses Concrete Analogy:** Commuting is universal and clear.
  5.  **Clear Check:** The test question directly targets the structural understanding.
  6.  **Sets Boundaries:** Manages expectations by saying what won't be covered.

  **Time Allocation Check:**

  *   Loop (Phenomenon): 10 min
  *   Single Choices: 10 min
  *   Cycle & Pump: 15 min
  *   Character & Misconceptions: 5 min
  *   Check & Wrap-up: 5 min
  *   **Total:** 45 min (Gives you 5 min buffer for discussion/questions during sections). You can tighten single choices or cycle by 2-3 min if needed.

  This plan gives your group the conceptual tools to understand your character's plight as a fundamental, almost mathematical, trap inherent in her pattern of decision-making, making the "drain" feel inevitable and tragic, not just a series of unlucky breaks or weak moments. Good luck!
