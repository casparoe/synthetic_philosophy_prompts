  Starting with inefficacy: if individual actions are truly insignificant, that could negate moral reasons for acting. But if complicity exists regardless, then even ineffective actions might be obligatory. Complicity seems more fundamental because it addresses the moral dimension of participating in harm, which doesn't depend on the action's impact. So complicity might be upstream of inefficacy debates. For example, if complicity is valid, inefficacy arguments become less relevant because the wrong is in participation, not outcome.

