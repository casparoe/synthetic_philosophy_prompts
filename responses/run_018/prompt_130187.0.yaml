answer: |-
  **The ranking of unresolved issues by practical importance is: (1) participatory complicity in harmful systems, (2) whether inefficacy voids individual moral reasons, and (3) the mechanics of threshold-sensitive obligations.**  

  ### Defense of Ordering:  
  1. **Participatory complicity is upstream and foundational**  
     If contributing to collectively harmful systems (e.g., factory farming, carbon-intensive economies) is inherently wrongful *regardless of individual impact*, then inefficacy arguments collapse. This isn’t about outcomes—it’s about your role in perpetuating injustice. *Stakes for you*: It dictates daily choices (e.g., eating meat, flying) as acts of moral integrity. A breakthrough in moral psychology (e.g., experiments showing universal disgust at "complicity" even in negligible-harm scenarios) could cement this; conversely, evidence that people only blame traceable harm might downgrade it.  

  2. **Inefficacy’s challenge to individual action is secondary but urgent**  
     Resolving complicity doesn’t fully answer "Why bother if it changes nothing?" This debate shapes motivation: if your vote or carbon footprint is truly irrelevant (e.g., elections decided by >1M votes, your CO₂ at 0.00001% of global emissions), moral obligation weakens. *Stakes for you*: It determines whether voting in non-swing states or personal emissions cuts are irrational. New empirical work—like quantum voting models proving individual ballot sway in close races, or AI tracing how consumer shifts cascade to policy—could elevate this. If disproven (e.g., studies showing veganism has zero market impact), it falls.  

  3. **Threshold obligations are tertiary—a tactical footnote**  
     This asks *when* your action matters (e.g., "Don’t recycle until 60% do"), but it hinges on resolving #1–2. It’s ethically niche (e.g., applicable only to tipping-point scenarios like unionizing) and computationally messy (e.g., how to track thresholds in real time). *Stakes for you*: Low outside rare cases (e.g., donating to a campaign in the final week if it’s 1,000 votes short). Widespread sensor networks/AI predicting collective thresholds might make it actionable, but today it’s mostly theoretical optimization.  

  ### Why This Hierarchy?  
  - **#1 anchors ethics in agency**: If complicity stands, you act to avoid culpability—even if futile.  
  - **#2 tests real-world impact**: It forces engagement with data (e.g., does one vegan actually reduce demand?).  
  - **#3 refines exceptions**: It’s derivative, applying only after #1–2 justify action generally.  

  **Bottom line:** Focus first on whether you’re morally stained by participating in harm—that’s the bedrock. If yes, inefficacy is noise. Thresholds are edge cases.
