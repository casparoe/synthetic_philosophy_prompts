prompt: |-
  Write the desiderata that a factored-cognition model of collective deliberation—modeled on the HCH (Humans Consulting HCH) idealization, in which human reasoners recursively delegate subproblems to copies of themselves—must satisfy to count as a normatively adequate representation of human reasoning at scale. The specification should cover four clusters: (1) the conditions under which a problem can be decomposed into independent subproblems without loss of epistemic value, including the role of shared conceptual vocabulary across nodes; (2) the mechanisms by which human consultants in the loop preserve analogical cross-contamination between subproblems—that is, reasoning about one factor analogically reshaping reasoning about another in ways that resist clean factorization, and whether such leakage is a bug to be engineered away or a feature necessary for creative insight; (3) the requirements for maintaining irreducible disagreement or epistemic friction across the hierarchy rather than converging on consensus, particularly in cases where disagreement stems from incommensurable framing rather than factual error; and (4) the empirical or conceptual constraints that would falsify the claim that such factorization captures real deliberation rather than imposing an artificial architecture upon it.

  For each desideratum, provide the motivating case or failure mode it addresses, indicate whether it is non-negotiable or a preference of particular camps (for example, those prioritizing scalable convergence over fidelity to cognitive messiness), and say whether any subset of these requirements is jointly unsatisfiable—specifically, whether preserving analogical leakage and achieving full factorization stand in tension, and whether maintaining deep epistemic friction undermines the recursive stability that makes HCH attractive as an alignment target. Keep the weight on the criteria and their justifications rather than on scoring existing proposals; identify which single requirement does the most to exclude naive decompositional models, and clarify the purpose for which adequacy is being assessed (e.g., predictive accuracy of collective reasoning, normative legitimacy of the outcome, or scalability without cognitive distortion). Do not provide bibliographies, citation lists, or references to specific papers.
reasoning: |-
  We are describing desiderata for a factored-cognition model of collective deliberation (modeled on HCH) to be normatively adequate as a representation of human reasoning at scale. We focus on four clusters.

  Cluster 1: Problem Decomposition without Loss of Epistemic Value

  Desideratum 1.1 (Non-negotiable): The model must specify conditions under which a problem can be decomposed into subproblems that are, for practical purposes, independent without significant loss of epistemic value. This includes conditions for when decomposition is safe and when it is not.

  Motivation: Without this, decomposition might arbitrarily break apart problems that are intrinsically holistic, leading to distorted reasoning. For example, decomposing a moral dilemma into independent factual questions might miss the interplay of values.

  Desideratum 1.2 (Non-negotiable): The model must account for the necessity of a shared conceptual vocabulary across nodes to enable recombination of solutions. The vocabulary must be rich enough to express the nuances of the subproblems and their interrelations.

  Motivation: Without shared concepts, recombination becomes impossible or misleading. For instance, if two subteams use different definitions of "fairness", their solutions cannot be integrated without distortion.

  Desideratum 1.3 (Non-negotiable): The model must recognize that decomposition is not always possible without loss. It must include a fallback for handling problems that resist decomposition.

  Motivation: Some problems (e.g., aesthetic judgments) may be irreducible without loss. The model must not force decomposition in such cases.

  Cluster 2: Analogical Cross-Contamination (Leakage)

  Desideratum 2.1 (Contested): The model must allow for analogical cross-contamination between subproblems when such leakage is necessary for creative insight. However, it must also provide mechanisms to control it when it leads to irrational bias.

  Motivation: Leakage can be a feature (e.g., in scientific analogy) or a bug (e.g., when irrelevant emotional associations distort judgment). The failure mode is either stifling creativity or permitting irrational contamination.

  Desideratum 2.2 (Non-negotiable): The architecture must not enforce perfect isolation as a default, because human reasoning inherently uses analogies and cross-contextual associations.

  Motivation: Perfect isolation would create an artificial system that does not reflect human cognition. For example, reasoning about justice in one context should inform another.

  Desideratum 2.3 (Contested): The model should ideally provide a way to tag and trace analogical influences so that they can be reviewed and critiqued.

  Motivation: This allows for the benefits of leakage while maintaining accountability. Without traceability, leakage might lead to unaccountable biases.

  Cluster 3: Maintaining Irreducible Disagreement and Epistemic Friction

  Desideratum 3.1 (Non-negotiable): The model must preserve deep epistemic friction (i.e., persistent disagreement) when it arises from incommensurable framings or values, rather than treating it as noise to be eliminated.

  Motivation: Forcing consensus in such cases (e.g., moral disagreements) would distort the representation of human reasoning and lead to illegitimate outcomes.

  Desideratum 3.2 (Contested): The model should provide a structure for productive engagement across disagreements without requiring resolution. This includes mechanisms for meta-deliberation about the disagreement itself.

  Motivation: Without this, the system might either freeze in deadlock or suppress minority views arbitrarily.

  Desideratum 3.3 (Non-negotiable): The model must not assume that all disagreements are resolvable by further decomposition or fact-finding. Some disagreements are foundational.

  Motivation: Treating all disagreement as resolvable by more facts (e.g., in value conflicts) is a failure of the model to capture human reasoning.

  Cluster 4: Empirical and Conceptual Constraints for Falsification

  Desideratum 4.1 (Non-negotiable): The model must be falsifiable by empirical evidence that real human deliberation does not factor cleanly in the way the model requires, especially in cases where holistic reasoning is observed.

  Motivation: If the model imposes an artificial factorization on human reasoning that doesn't exist, it fails as a representation.

  Desideratum 4.2 (Non-negotiable): The model must be able to represent the observed phenomena of reasoning that involves dynamic re-framing, where the problem structure itself evolves during deliberation.

  Motivation: Human deliberation often changes the problem definition. A static decomposition would fail to capture this.

  Desideratum 4.3 (Non-negotiable): The model must not require that the cognitive load of managing the decomposition (e.g., assigning subproblems, recombining) exceeds the capacity of human reasoners in the loop.

  Motivation: If the overhead is too high, the model becomes impractical and does not reflect human scalability.

  Tensions and Key Exclusions:

  - Tension 1: Preserving analogical leakage (2.1, 2.2) and achieving full factorization (1.1) are in tension. Leakage inherently violates strict factorization. This tension is inherent and must be managed, not resolved.
  - Tension 2: Maintaining deep epistemic friction (3.1, 3.3) might undermine recursive stability (which relies on convergence for termination). This is a challenge for HCH as an alignment target because alignment often assumes convergence.

  Most Excluding Requirement: Desideratum 3.1 (maintaining irreducible disagreement) does the most to exclude naive decompositional models because such models typically assume that decomposition and recombination will lead to a single agreed-upon answer.

  Purpose of Adequacy Assessment: The desiderata are for normative adequacy in representing human reasoning at scale. This includes:
  - Predictive accuracy: The model should predict how real human collectives reason.
  - Normative legitimacy: The outcome should be seen as a fair representation of human reasoning, especially in preserving pluralism.
  - Scalability without cognitive distortion: The model should not introduce artifacts due to scaling.

  Joint Unsatisfiability: 
  - It is impossible to simultaneously achieve full factorization (with no leakage) and full analogical cross-contamination. Thus, the model must strike a balance.
  - Maintaining deep epistemic friction may be jointly unsatisfiable with recursive stability if stability requires convergence. However, this might be addressed by allowing the hierarchy to represent multiple viewpoints without merging them.

  Conclusion: The model must navigate these tensions without collapsing into either an artificial decomposition that loses the essence of human reasoning or an unscalable holistic mess.
answer: |-
  ### Desiderata for a Normatively Adequate Factored-Cognition Model of Collective Deliberation  
  **(Modeled on HCH: Humans Consulting HCH)**  

  The model must satisfy the following criteria to count as a normatively adequate representation of human reasoning at scale. Adequacy is assessed for **normative legitimacy** (i.e., the outcome fairly reflects human reasoning, including its pluralism, creativity, and irreducible conflicts) and **scalability without cognitive distortion** (i.e., the system scales efficiently while preserving the core features of human cognition, avoiding artifacts introduced by artificial decomposition). Predictive accuracy is secondary but desirable.  

  #### **Cluster 1: Problem Decomposition without Loss of Epistemic Value**  
  *Conditions for decomposing problems while preserving epistemic integrity, including shared conceptual foundations.*  

  1. **Desideratum 1.1 (Non-negotiable): Holistic Safeguard**  
     The model must only decompose a problem when subproblems can be solved independently *without* losing emergent properties (e.g., contextual interactions, gestalt insights). Decomposition must be forbidden when the problem is intrinsically holistic (e.g., aesthetic judgment or ethical dilemmas where the whole cannot be reduced to parts).  
     *Motivation*: Prevents "reductive distortion," as in decomposing a climate policy dilemma into isolated economic/environmental subproblems, ignoring feedback loops. Naive decomposition fails here by assuming all problems are factorable.  

  2. **Desideratum 1.2 (Non-negotiable): Shared Conceptual Vocabulary**  
     The model must enforce a dynamically aligned, cross-node vocabulary for concepts (e.g., "justice," "risk") to enable subproblem recombination. Vocabulary must be rich enough to encode ambiguities and allow reinterpretation during recombination.  
     *Motivation*: Avoids "conceptual fragmentation," such as two subteams using incompatible definitions of "bias" in a fairness deliberation, leading to irreconcilable solutions.  

  3. **Desideratum 1.3 (Contested: Prioritizes scalability)**  
     Decomposition should minimize coordination overhead (e.g., by isolating subproblems with low interdependence). Optimal decomposition may sacrifice some epistemic richness for tractability.  
     *Motivation*: Addresses "combinatorial explosion" failure modes in large-scale deliberation. Scalability-focused camps accept this; fidelity-focused camps reject it as oversimplification.  

  #### **Cluster 2: Analogical Cross-Contamination (Leakage)**  
  *Mechanisms for analogical leakage between subproblems and its normative status.*  

  4. **Desideratum 2.1 (Non-negotiable): Leakage as Feature**  
     The model must permit analogical cross-contamination (e.g., reasoning about medical triage reshaping resource allocation in economics) when it enables creative insight or contextual adaptation. Suppressing leakage entirely is invalid.  
     *Motivation*: Prevents "sterile reasoning," as in a system that forbids metaphors linking civil rights and climate justice, stifling innovation. Naive models exclude this, treating leakage as a bug.  

  5. **Desideratum 2.2 (Contested: Fidelity vs. Control)**  
     The model should regulate leakage to avoid irrational bias (e.g., emotional carryover distorting factual judgment) while preserving productive analogies. Mechanisms may include "firewalls" for high-stakes subproblems (e.g., legal facts vs. moral analogies).  
     *Motivation*: Balances "irrational contamination" (e.g., anger about one subproblem spilling into another) against over-control that eliminates serendipity. Scalability camps favor regulation; creativity camps reject it.  

  6. **Desideratum 2.3 (Non-negotiable): Traceability of Analogies**  
     All leakage must be traceable to its source, allowing auditors to reconstruct how reasoning about subproblem A influenced subproblem B.  
     *Motivation*: Ensures accountability for "hidden biases," such as undisclosed political analogies affecting policy decisions.  

  #### **Cluster 3: Maintaining Irreducible Disagreement/Epistemic Friction**  
  *Requirements for preserving incommensurable disagreements rather than enforcing consensus.*  

  7. **Desideratum 3.1 (Non-negotiable): Non-Resolution of Framing Disputes**  
     The model must retain persistent disagreement when it stems from incommensurable framings (e.g., utilitarian vs. deontological ethics) or values, without forcing convergence. Treating such disagreement as noise invalidates the model.  
     *Motivation*: Avoids "consensus tyranny," as in a healthcare debate where religious and secular framings of "life" are collapsed into a technical compromise, erasing moral diversity. **This most strongly excludes naive models**, which assume decomposition always yields unanimous solutions.  

  8. **Desideratum 3.2 (Contested: Alignment vs. Pluralism)**  
     The model should facilitate meta-deliberation about disagreements (e.g., "Why do we disagree?") without requiring resolution. This enables friction to refine reasoning but not eliminate it.  
     *Motivation*: Prevents deadlock (e.g., climate policy paralyzed by ideology) while honoring pluralism. Alignment-focused camps may weaken this for stability; pluralist camps enforce it strictly.  

  9. **Desideratum 3.3 (Non-negotiable): Foundation Recognition**  
     Disagreements rooted in irreducible values or framings must be flagged as "non-decomposable" and exempted from further recursive decomposition.  
     *Motivation*: Prevents "infinite regress," such as decomposing a disagreement about abortion rights into factual subproblems, obscuring the core value conflict.  

  #### **Cluster 4: Empirical/Conceptual Constraints for Falsification**  
  *Conditions that would falsify the model's fidelity to real human reasoning.*  

  10. **Desideratum 4.1 (Non-negotiable): Anti-Fragmentation Criterion**  
      The model is falsified if empirical evidence shows that human deliberation *requires* dynamic, unstructured interaction (e.g., brainstorming, improvisation) that cannot be captured by static decomposition.  
      *Motivation*: Addresses "holistic falsification," such as real-world teams solving problems through emergent dialogue, not predefined sub-tasks.  

  11. **Desideratum 4.2 (Non-negotiable): Cognitive Load Limits**  
      Decomposition overhead (e.g., task-splitting, recombination) must not exceed human working-memory capacity or induce systematic distortions (e.g., attention tunneling).  
      *Motivation*: Prevents "managerial collapse," where reasoners spend more time coordinating subproblems than thinking.  

  12. **Desideratum 4.3 (Non-negotiable): Frame Evolution**  
      The model must accommodate re-framing during deliberation (e.g., a subproblem redefining the parent problem). Inflexible decomposition falsifies the model.  
      *Motivation*: Captures real phenomena like scientific revolutions, where new paradigms emerge mid-deliberation.  

  ---

  ### **Tensions and Joint Unsatisfiability**  
  - **Tension 1: Leakage vs. Factorization (Desiderata 2.1 and 1.1)**  
    Preserving analogical leakage (a feature of human insight) and achieving clean factorization (for scalability) are inherently in tension. Leakage violates strict independence, risking recombination errors. This tension is unavoidable; the model must balance them contextually (e.g., allowing leakage in creative tasks, restricting it in factual ones).  
    *Status*: Theoretically satisfiable with tradeoffs, but not optimizable simultaneously.  

  - **Tension 2: Epistemic Friction vs. Recursive Stability (Desiderata 3.1 and HCH's convergence ideal)**  
    Maintaining irreducible disagreement undermines the recursive stability that makes HCH attractive for AI alignment (which assumes decomposable problems yield consensus). Deep friction may cause "recursive deadlock," halting progress.  
    *Status*: **Jointly unsatisfiable in strict HCH**. Alignment-focused models may relax 3.1 for stability; normative models must prioritize friction, risking instability.  

  ---

  ### **Summary of Key Exclusions and Purpose**  
  - **Most excluding requirement**: Desideratum 3.1 (non-resolution of framing disputes) excludes naive decompositional models by forcing acknowledgment of irresolvable pluralism.  
  - **Purpose**: Normative legitimacy is primary—the model must reflect how humans *ought* to reason collectively, preserving creativity, moral diversity, and dynamic adaptation. Scalability is secondary but must not distort cognition.  
  - **Falsification**: The model fails if it imposes artificial structure (e.g., forcing decomposition on holistic problems) or ignores empirical constraints (e.g., cognitive load).
