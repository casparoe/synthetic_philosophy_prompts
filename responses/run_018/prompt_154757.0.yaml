he tone relentlessly corporate and legalistic; a reader familiar with the strange-loop literature should recognize that every clause exaggerates a real feature of the view, and the piece should remain legible to someone who has never encountered the concept. Do not include citations, bibliographies, reading lists, or references to specific page numbers or editions.
