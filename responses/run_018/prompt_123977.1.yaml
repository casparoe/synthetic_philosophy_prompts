answer: |-
  ## Research Proposal: Harsanyi’s Aggregation and the Metaphysics of the Temporal Self

  **Project Title:** Temporal Aggregation and the Unitary Agent: Axiomatic Constraints on Rational Identity Across Time

  **Core Research Question:** Does Harsanyi's aggregation theorem, when its axioms (Pareto Efficiency, Independence of Irrelevant Alternatives) are applied to temporally distinct "stages" of a single agent, necessitate a weighted utilitarian aggregation of stage-specific cardinal utilities, thereby implying a fragmented conception of personal identity? Or does the attempt to apply these axioms intra-personally reveal that the Independence condition presupposes a metaphysically unified agent, rendering the theorem inapplicable to diachronic choice under preference division?

  ### Background and Unexplored Terrain
  Harsanyi’s Social Aggregation Theorem demonstrates that, under conditions of Pareto Efficiency and Independence of Irrelevant Alternatives (IIA), any social welfare function aggregating individual cardinal utilities must be affine (a weighted sum). This result is foundational in welfare economics and social choice theory, framing rational collective decision-making as utilitarian aggregation. Crucially, its interpretations universally assume distinct *persons* as the entities whose preferences are aggregated.

  This project identifies a significant conceptual lacuna: the theorem’s core axioms have never been systematically interrogated within the context of a *single agent* whose preferences evolve or conflict across time. Models of time-inconsistency (e.g., hyperbolic discounting, multiple selves) explicitly treat an agent’s present and future stages as distinct preference-bearing entities, structurally analogous to distinct voters in Harsanyi’s framework. Standard interpretations of the theorem overlook whether its axiomatic structure and conclusion can, or should, coherently migrate from the *inter*-personal domain to the *intra*-personal, temporal domain. This omission masks a potential metaphysical commitment within the axioms themselves.

  ### Methodology: Formal Reconstruction and Axiomatic Interrogation
  This project employs rigorous decision-theoretic modeling to transpose Harsanyi’s axioms into the intra-personal, temporal context, deliberately avoiding reliance on empirical neuroscience or psychology. The core method involves:

  1.  **Formalizing Temporal Stages:** Defining distinct temporal stages of an agent (e.g., Stage t=1, t=2, ..., t=n) as the relevant preference-bearing entities, each endowed with a complete, cardinal utility function over potential lifetime outcomes.
  2.  **Defining Temporal Aggregation:** Constructing a formal "lifetime welfare function" that aggregates the cardinal utilities of these temporal stages into a single complete ordering of outcomes for the agent *qua* enduring entity.
  3.  **Transposing Axioms:**
      *   **Temporal Pareto Efficiency:** If all temporal stages strictly prefer outcome X to outcome Y, then the lifetime welfare function must rank X above Y.
      *   **Temporal Independence of Irrelevant Alternatives (T-IIA):** The lifetime ranking of any two outcomes X and Y should depend *only* on the utilities assigned to X and Y by each temporal stage, and be independent of utilities assigned to any other (irrelevant) outcome Z.
  4.  **Analyzing Implications:** Investigating the formal consequences of imposing these axioms on the lifetime welfare function within models accommodating:
      *   Pure time preference (discounting).
      *   Fundamental preference shifts (e.g., changing tastes, transformative experiences).
      *   Anticipated time-inconsistency (e.g., sophisticated choice with present bias).
  5.  **Metaphysical Interrogation:** Critically examining the conceptual prerequisites for the coherent application of T-IIA. Does demanding that the lifetime ranking ignore information about other outcomes (Z) require assuming a perspective *external* to the temporal stages themselves – i.e., a metaphysically unified "chooser" distinct from the sum of its stages?

  ### Expected Outcomes and Defensible Conclusions
  1.  **Success Condition 1 (Theorem Holds):** If the analysis demonstrates that T-Pareto and T-IIA logically necessitate a lifetime welfare function that is a weighted sum (U_lifetime = Σ δ_t * U_t) of stage utilities, this would be a significant result. It would formally license treating rational diachronic choice *as if* it were inter-personal aggregation, implying a deeply fragmented conception of personal identity where stages are analogous to distinct individuals. This would challenge notions of unified agency and raise profound ethical questions about commitment, planning, and responsibility across time.
  2.  **Success Condition 2 (Axiom Failure):** If the analysis reveals that T-IIA cannot be coherently satisfied within plausible models of temporally divided agency *without* presupposing a perspective that transcends the individual stages (a "unified chooser"), this constitutes a critical finding. It demonstrates that Harsanyi's Independence axiom implicitly relies on a metaphysical presupposition of agent unity when applied inter-personally. The theorem’s apparent force in the social context derives from an unacknowledged assumption that breaks down intra-personally, revealing a hidden limit of the formalism and challenging the notion that social aggregation treats individuals as genuinely distinct sources of value.
  3.  **Failure Condition:** The project fails only if the formal reconstruction reveals no substantive tension or implication – if the axioms apply trivially or incoherently in all plausible intra-personal models without yielding either the aggregation result or a clear demonstration of the axiom's metaphysical presupposition. Merely showing that the weighted sum is *one possible* aggregation satisfying the axioms, but not the *only* one (if plausible alternatives exist under T-IIA), would still be a valuable finding, demonstrating a disanalogy between inter and intra-personal aggregation.

  ### Scope and Limitations
  This project deliberately focuses on the *conceptual and formal implications* of transposing Harsanyi's axioms, not on:
  *   **Empirical Validity:** It does not assess the descriptive accuracy of time-inconsistent models or cardinal utility.
  *   **Neuroscientific Foundations:** It abstains from grounding stage identity or preference in cognitive science.
  *   **Normative Prescriptions:** While conclusions have normative weight, the primary aim is analytical clarity regarding the theorem's presuppositions and limits, not deriving prescriptive rules for decision-making.
  *   **Full Identity Theory:** It addresses the specific metaphysical commitment implied by the *Independence axiom* within rational choice models, not the entirety of personal identity metaphysics.

  The scope is necessarily constrained to decision-theoretic models and axiomatic analysis. Its strength lies in revealing the hidden metaphysical baggage of a canonical formal result by forcing it into an unfamiliar, yet structurally analogous, domain. Success will yield a rigorous formal-philosophical contribution clarifying the relationship between rational choice, temporal unity, and the foundations of aggregation.

  **Duration & Deliverable:** A six-month fellowship is requested to complete the formal modeling, axiomatic analysis, and philosophical interpretation, culminating in a draft journal article-length manuscript.
