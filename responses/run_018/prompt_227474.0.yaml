prompt: |-
  So I'm a backend engineer at a mid-sized company and after every big outage we do a postmortem, and the bit where we write down "root cause" always turns into an argument. I've no philosophy background at all but I was moaning about this to a mate who studied it and she said philosophers have genuine fights about whether not doing something can count as a cause of anything, which is basically our exact problem, so now I'm curious how far our team's instincts actually hang together. Act as a professional philosopher who knows the causation literature, and think carefully about this rather than giving me a textbook summary. I'd suggest brainstorming what rules our verdicts might be running before you commit to anything.

  Here's our track record, roughly as it went down in the meetings. Case 1: someone deployed a schema change but forgot to run the migration script, which is step three on the deploy checklist. We wrote "the forgotten migration caused the outage" and nobody blinked. Case 2: a library update broke the checkout flow on an old browser we technically still support, and when someone suggested the root cause was that nobody had tested on that browser, the room pushed back hard and said no, the cause was the incompatible library, the untested browser was just background. Case 3: the on-call engineer didn't notice a paging alert for forty minutes because they were at dinner, and we listed that as a contributing cause in the report. Case 4: a junior dev didn't trigger the failover runbook during an incident because nobody had ever trained them on it, and we explicitly said their not acting was NOT a cause, since you can't omit something you never knew to do. Now the new case we're arguing about this week: a senior engineer restarted a service during traffic spike without first checking the cache warmup, and it fell over. Checking the warmup is on no checklist, appears in no runbook, and is nobodys assigned duty, but every senior engineer on the team has done it as a habit for years and it's kind of just "how things are done here." Half the team wants to name the skipped check as the cause, half says you can't cause something by skipping a step nobody ever told you to do.

  So: what verdict is most consistent with our own precedents, and which earlier case is the closest analog? More interestingly to me, what are the different rules that would fit cases 1 through 4 equally well, which of them disagree about the new case, and what would we implicitly be signing up for with each ruling? If our history genuinely underdetermines it, say so and tell me what further incident would best seperate the candidate rules. And since I'm asking you to extrapolate from four messy meetings, please flag how confident you are in each part of the answer and single out the specific claim you're least sure of.
reasoning: |-
  Okay, let me approach this systematically. The user is a backend engineer dealing with postmortem root cause disputes, and they've shared five cases that reveal their team's intuitive reasoning about causation. The core tension revolves around whether omissions (not doing something) can be causes – a classic philosophical debate that maps to real-world incident analysis.

  First, I need to unpack their existing cases to identify implicit principles. Case 1 (forgotten migration) treats an omission as causal because it violated an explicit checklist. Case 2 (untested browser) rejects omission as cause, focusing on the active change (library update). Case 3 (missed alert) accepts an omission as contributory despite it being an individual's momentary lapse. Case 4 (untrained junior) rejects omission because the action wasn't in the junior's knowledge scope. 

  The pattern suggests their team uses two filters: 1) Was there an explicit expectation (checklist/runbook)? 2) Was the agent reasonably capable of acting (knowledge/access)? But Case 3 complicates this – the on-call was capable yet didn't act, and they still labeled it contributory. That implies a third factor: situational responsibility (the on-call role carries inherent duties).

  Now for the new case: skipping cache warmup check. No explicit documentation exists, but it's a strong team norm. Applying their precedents: 
  - Against causation: No checklist (unlike Case 1), not an assigned duty (unlike Case 4's training gap)  
  - For causation: Seniors know the norm (capability filter passed), and senior role implies situational responsibility (like Case 3's on-call)

  The closest analog is actually Case 3 – both involve knowledgeable individuals omitting expected-but-not-documented actions during operational events. Their rejection in Case 4 was due to lack of capability, which doesn't apply here since seniors know the practice.

  Three candidate rules emerge from their history:
  A) "Explicit Expectation + Capability" (would reject causation here – no documentation)  
  B) "Capability + Situational Duty" (supports causation – senior role implies responsibility)  
  C) Hybrid: A for primary causes, B for contributory (like Case 3)

  The team seems to lean toward B when the agent has ownership (Case 3), so naming the omission as contributory (not root cause) would align best. To stress-test this, consider a hypothetical: if a non-senior omitted the same check, would they blame the omission? Probably not – confirming that situational responsibility matters. 

  Least confident point: Whether Case 2's rejection of testing omission should constrain this case. I think not – Case 2 involved preventive action (testing) while this is real-time mitigation, more like Case 3's alert response. Flagging this as the shakiest part of my reasoning.

  Final recommendation: Frame the skipped check as a contributing cause (not root) in line with Case 3. The root cause remains the library/trigger, while the omission enabled severity. This maintains consistency without overextending blame for undocumented norms.
answer: |-
  Based on your cases and philosophy's causation debates (particularly omissions), I'll reconstruct your team's implicit rules, test consistency, and handle the new case. Here's the breakdown:

  **Your Team's Implicit Rules (Reconstructed from Cases 1-4):**
  1.  **Omissions *can* be causes IF:**  
      a) There was a **specific, explicit expectation** to act (checklist, runbook, assigned duty)  
      b) The agent **had the capability/knowledge** to act  
      *Cases supporting this:*  
      - Case 1 (✓ Expectation: checklist step; ✓ Capability: deployer knew the script)  
      - Case 3 (✓ Expectation: on-call *must* monitor alerts; ✓ Capability: engineer could have checked)  
      - Case 4 (✗ Capability: junior *lacked* knowledge → not a cause)  

  2.  **Omissions are *not* causes IF:**  
      a) The action was **preventative/preparatory** (not a direct procedural step)  
      b) The expectation was **implicit/vague** (not documented/assigned)  
      *Cases supporting this:*  
      - Case 2 (✗ Untested browser: preventative action; ✗ Not explicit duty → not cause)  
      - Case 4 (✗ Lack of training: systemic gap, not individual omission → not cause)  

  3.  **Active changes/events trump omissions as "root cause":**  
      - Case 2: Library update (active change) > lack of testing (omission)  
      - Case 1: Migration script (active artifact) > forgetting (omission) was named, but the *script* was the tool  

  **New Case Analysis:**  
  *Skipped cache warmup check by senior engineer*  
  - **✓ Capability:** Senior knew the habitual practice  
  - **✗ Explicit Expectation:** No checklist/runbook/assigned duty  
  - **⚠️ Expectation Nature:** Strong implicit norm ("how things are done here")  
  - **Action Type:** Mitigation step (like checking an alert), not preventative prep (like testing)  

  **Consistency Verdict:**  
  - **Closest Analog:** **Case 3 (on-call missed alert)**. Both involve:  
    - Operational omission during an incident  
    - Situational expectation (on-call duty / senior tribal knowledge)  
    - Capability to act  
  - **Recommended Ruling:** **Contributing cause (not root cause)**, matching Case 3's outcome.  
    - *Root cause:* The service's fragility during restarts under load + lack of *systemic* warmup automation/checks.  
    - *Contributing cause:* Skipped warmup check due to reliance on undocumented norms.  

  **Why Not Other Cases?**  
  - Case 1 had explicit checklist → stronger omission claim.  
  - Case 2 was preventative/pre-release → weaker omission claim.  
  - Case 4 lacked capability → incomparable.  

  **Candidate Rules & Their Implications for New Case:**  
  | Rule System                          | Fits Cases 1-4? | New Case Ruling       | What You'd Sign Up For                                                                 |  
  |--------------------------------------|-----------------|-----------------------|----------------------------------------------------------------------------------------|  
  | **A: "Explicit Expectation Required"** | ✓               | ✗ Not a cause         | Future-proof: Only blame omissions against docs. Risk: Undermines cultural knowledge. |  
  | **B: "Capability + Situational Duty"**| ✓               | ✓ Contributing cause  | Accountability for role-based norms. Risk: Subjective ("should they have known?").     |  
  | **C: "Preventative Omissions Excluded"** | ✓             | ✓ Contributing cause  | Focuses on real-time errors. Risk: Ignores systemic gaps (e.g., no docs).              |  

  **Underdetermination & Stress Test:**  
  Your history *slightly favors* **Rule B** (Capability + Situational Duty), but it's underdetermined. To clarify, imagine:  
  - **Hypothetical Case 5:** A *junior* skips the cache warmup check (same incident).  
    - If your team says **"not a cause"** (due to lack of capability), Rule B is confirmed.  
    - If they say **"cause"** (because seniors *should* mentor), you lean toward stricter omission rules.  

  **Confidence Flags:**  
  - High confidence: Rule B best fits your precedents (**Case 3** is key analog).  
  - Medium confidence: Ruling it "contributing cause" aligns best (avoids over-blaming individuals while acknowledging process gaps).  
  - **Lowest confidence:** Whether "root cause" should *ever* be an omission. Your team *might* be distinguishing:  
    - **Procedural omissions** (Case 1) = root cause  
    - **Judgment omissions** (Case 3/new case) = contributing  
    This distinction is philosophically shaky but pragmatically useful. I'm unsure if it's intentional in your history.  

  **Recommendation for New Case:**  
  - **Root Cause:** "Service instability during restart under high load without automated warmup verification."  
  - **Contributing Cause:** "Undocumented reliance on manual cache warmup checks led to skipped step."  
  - **Action Item:** Document the check or automate it.  

  This avoids blaming the senior (no explicit duty) but forces confronting the fragility of tribal knowledge—consistent with Case 3's "contributing cause" for the missed alert and Case 2's refusal to blame untested browsers.
