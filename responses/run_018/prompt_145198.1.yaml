  I should analyze Aquinas's reasoning. He argues that killing a tyrant without public authority is like usurping judgment, which belongs to the community or higher powers. Even when institutions collapse, the moral duty to avoid disorder remains because it's inherent in the natural order. The common good requires stability, so the prohibition isn't just about consequences but the structure of authority itself.

  Looking at Aquinas's examples: he allows public authority to remove a usurper but insists on exhausting legal channels for legitimate rulers turned tyrant. If all remedies fail, he acknowledges the possibility of resistance but only if it doesn't cause greater harm. The duty to avoid chaos isn't lifted; it becomes a higher barrier. So the absence of institutions doesn't permit private action; it makes resistance riskier, deepening the tragedy by removing both remedy and right.

