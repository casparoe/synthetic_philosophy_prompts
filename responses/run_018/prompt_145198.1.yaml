answer: |-
  Aquinas maintains the absolute prohibition on private tyrannicide even when all institutional remedies collapse, because the risk of disorder constitutes a structural, deontological principle rooted in the natural order's requirement for peace and the common good, not merely a contingent caution. Here’s the reasoning:

  1.  **Judicial Authority as Divine Delegation:** For Aquinas, the authority to judge and depose a ruler (even a tyrant) belongs exclusively to public authority (the community acting corporately or a superior like the Pope/Emperor) because such authority derives from God’s governance of the natural order (ST II-II, Q42, A2; Q64, A3). Private individuals inherently lack this God-delegated power to judge the *person* of the ruler.
  2.  **Disorder as Intrinsic Evil:** Sedition (understood as rebellion causing destructive factionalism) is intrinsically evil because it directly attacks the unity and peace essential for the common good (ST II-II, Q42, A2). The potential for chaos isn't just a probable negative consequence; it’s the violation of a fundamental requirement of just political society. This duty to preserve public peace persists *regardless* of the ruler's injustice or the absence of functioning institutions.
  3.  **No Transfer of Authority:** The collapse of institutional channels does *not* transfer the right of judgment to private individuals. Aquinas provides no mechanism for such a transfer. Instead, the absence of a competent public authority leaves the community in a state of tragic impasse – the ruler is unjust, but *no one* possesses the legitimate authority to remove him violently without incurring the sin of sedition or murder. The "residual authority problem" highlights this vacuum but doesn't resolve it in favor of private action.
  4.  **The Primacy of the Common Good:** The common good demands order above all else for Aquinas. While tyranny is a grave evil, it is *lesser* than the complete dissolution of society into chaos that private violence risks (ST II-II, Q42, A2 ad 3). This hierarchy of evils (disorder worse than tyranny) underpins the enduring prohibition. The breakdown of remedies doesn't make chaos "inevitable anyway" in a way that justifies action; it makes the danger of triggering worse chaos through private violence *even more acute*.
  5.  **Last Resort ≠ Permissible:** Aquinas acknowledges that a community, acting *through whatever remnant of public authority remains* (e.g., representatives, nobles), *might* licitly resist a tyrant after exhausting remedies, but this is framed as a desperate act fraught with danger, not a newly activated *right* (ST II-II, Q42, A2). He consistently contrasts this *public* potential with the absolute prohibition on *private* action. The tragic outcome is precisely that institutional collapse removes the *remedy* (public authority's capacity to act) without removing the *prohibition* on the only alternative (private violence), leaving suffering as the lesser evil compared to societal collapse.
