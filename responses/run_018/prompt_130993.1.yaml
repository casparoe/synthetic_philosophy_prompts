  Now, the twist is synthetic minds. The user mentions engineered consciousness where we control suffering parameters. The non-identity problem usually says we can't harm someone by creating them because they wouldn't exist otherwise. But here, since we design them, we know exactly who we're harming. So that objection might not hold. 

