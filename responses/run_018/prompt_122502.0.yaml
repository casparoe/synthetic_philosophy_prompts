prompt: |-
  Longtime lurker, been reading this corner of the internet since the Sequences were still being written, and I've got a thing I keep noticing that I can't find a word for. Hoping somebody can tell me whether it already has a name.

  The general shape is a positional competition where everybody escalates and the escalation is pure waste in aggregate and everyone involved knows it — college admissions is the case I know best, since my youngest starts applying next fall and my brother-in-law teaches at one of those suburban high schools where the whole senior year is basically an arms race. Fine: that part is the boring familiar thing, I've read the Moloch essay same as everybody, and multipolar trap / tragedy of the commons / positional arms race all gesture at it. But two features keep showing up in the cases I actually watch, and I don't think those labels get them, and it's those I want the name for. One: the competition doesn't just waste effort, it degrades the thing being competed over — and the degradation makes the competition worse instead of self-limiting. As the transcripts inflate, they get noisier as evidence of anything, so admissions leans harder on the few things they still trust, which are the most coachable and most purchasable items on the file, so the coaching money flows there, so those get noisier too. The signal doesn't fade out, it collapses onto narrower and easier to game criteria, and the race speeds up. Two: the people who drop out of the race are disproportionately the ones who never wanted to be in it, and once they're gone the remaining field is more committed to escalating, and the median participant is now somebody who likes the race. I see the same skeleton in hiring where I work: as portfolios and take-homes get AI-polished into uselessness, the loop closes harder onto brand-name employers and referrals, which are the most gameable things left.

  Which is why I don't think the usual words are quite it. People throw Goodhart around for anything, but as I understand it that's a measure ceasing to track the target; here the measure's failure is what feeds the process that broke it, which feels like the opposite direction. And the everybody loses framing isn't right either — there's a concentrated winner, the test prep companies, the credentialing vendors, whoever owns the ranking, and they're organised and they defend the arrangement, while the losers are diffuse. So: is there an established concept for the collapse-onto-narrower-criteria part, or for the dropout-makes-the-trap-tighter part, or for both together as one animal? I don't want a word slapped on it. Tell me what the real neighbouring concepts are — I assume I'm circling costly signalling, positional goods, maybe adverse selection, maybe some kind of ratchet — where my description fits each one and where it doesn't, and which fits best. And if there genuinely isn't a name, then coin one, define it tightly enough that I can separate it from its neighbours, and give me the two boundary cases: something that superficially looks like this but shouldn't count, and something that really is this that a sloppy definition would miss.
reasoning: |-
  Okay, the user is describing a specific type of competitive degradation they've observed in systems like college admissions and hiring. They're a long-time reader of rationalist content, familiar with concepts like Moloch and multipolar traps, but they feel existing terms don't capture two key features: (1) the competition collapses onto narrower, more gameable criteria as signals degrade, creating a self-reinforcing cycle, and (2) dropout of unwilling participants leaves behind more committed escalators, tightening the trap.

  Hmm, they're clearly analytically sophisticated - mentioning Goodhart's Law but correctly noting their case is inverted (the metric's failure fuels rather than merely reflects the problem). They want precise conceptual mapping, not just a slapped-on label. The college admissions example is visceral because their child is entering the system, and they're frustrated watching suburban high schools become arms races. 

  First, let's unpack their core mechanisms. The signal collapse isn't just noise increasing - it's active funneling toward criteria that are both more corruptible and more expensive to access (test prep, brand names). This creates a perverse selection pressure: only those who can afford escalating costs remain. The dropout pattern is crucial - it's not random attrition but selective exit of value-diverse participants, leaving true believers who intensify competition. 

  Scratching my head about existing frameworks... Adverse selection? Close but not quite - we're seeing adverse retention. The Cobra Effect? Captures perverse incentives but misses the layered collapse. Red Queen's Race describes endless effort without gain, but not the criteria narrowing. 

  Wait - credential inflation! That's adjacent. But typical credential inflation discussions focus on devaluation of qualifications, not the active funneling into narrower, more corruptible signals. This is credential inflation with a twist: the inflation mechanism itself burns out broader evaluation channels. 

  For the dropout effect, it's reminiscent of Gresham's Law in social dynamics: "bad participants drive out good" through selective exit. The remaining pool isn't just smaller - its preferences are skewed toward escalation. That's key. 

  The closest integrated concept might be a self-reinforcing evaluative cascade. But since they want boundaries: 

  Superficial lookalike: Standard arms race with neutral dropout (e.g., athletes retiring when training costs outweigh benefits - doesn't change the game's nature). 

  Hidden instance: Academic publishing where pressure to publish in "top journals" narrows research diversity, then the remaining researchers optimize exclusively for those journal metrics. 

  Coined term: Evaluative Collapse Trap. Defined by: (1) progressive abandonment of holistic signals in favor of narrower proxies under competition, (2) proxy vulnerability accelerating as collapse progresses, (3) selective dropout of participants with lower escalation tolerance, (4) resulting equilibrium dominated by high-commitment escalators. 

  Should test against their hiring example: AI-polished portfolios force reliance on referrals/brands (narrowing), which are gameable via networking spend, while applicants who refuse to play drop out, leaving only grinders. Fits perfectly. 

  They'll appreciate the boundary cases - shows we're not just renaming Goodhart. The academic publishing example might resonate given their rationalist background. Should emphasize how the "winner" (ranking agencies, test prep) stabilizes the trap - that's what separates this from plain tragedy of the commons.
answer: |-
  You've articulated a profound and specific dynamic that deserves precise naming. I'll break this down systematically, map it to adjacent concepts, and propose a tightly-defined term with boundary cases.

  ### Core Components of Your Observation:
  1.  **Collapse onto Narrower/More Gameable Criteria:** Competition degrades signals, forcing reliance on fewer, inherently more corruptible proxies, which accelerates degradation.
  2.  **Adverse Selective Dropout:** Participants least invested in the "race" exit first, leaving a pool with higher tolerance/commitment to escalating costs, intensifying the competition.
  3.  **Self-Reinforcing Degradation:** The very failure of the metric fuels the mechanisms that cause further failure (the *opposite* of Goodhart's simple decoupling).
  4.  **Concentrated Winners, Diffuse Losers:** Entities benefit from the escalating costs (test prep, rankings, credential vendors) and actively defend the system.

  ### Mapping to Adjacent Concepts & Where They Fall Short:
  *   **Moloch / Multipolar Trap / Tragedy of the Commons:** Capture the *existence* of a destructive, escalating competition with individual incentives misaligned with group welfare. *Misses:* The specific feedback loop where metric degradation *causes* further narrowing/gaming, the *selective* dropout pattern, and the concentrated winners.
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." *Misses:* The dynamic where the measure's *failure* actively *feeds* and *accelerates* the process causing its failure (narrowing, increased gaming). Goodhart describes decoupling; you describe a *self-fueling degradation spiral*.
  *   **Positional Arms Race:** Focuses on the escalation of effort/cost for relative standing. *Misses:* The specific mechanism of *signal collapse* onto narrower, more corruptible criteria and the *adverse selection* in dropout. It often assumes the "good" being raced for is stable.
  *   **Adverse Selection:** Describes a situation where undesirable participants are more likely to enter/stay in a market/arrangement due to information asymmetry. *Partially Fits:* Your dropout pattern *is* a form of adverse selection, but *in reverse* – the *desirable* participants (those valuing alternatives to the race) are the ones *leaving*. This leaves the pool skewed towards those most tolerant of (or benefiting from) the race's pathologies. It fits the *outcome* (poorer pool) but not the *mechanism* (signal degradation).
  *   **Costly Signalling:** Explains why expensive signals can be honest (only truly capable can afford them). *Misses:* How the *corruption* of the signal (making it cheaper to fake *or* more expensive for the same signal) leads to the *collapse* onto *different*, narrower, often *purchasable* signals, and the resulting adverse selection. It's static, not a dynamic spiral.
  *   **Credential Inflation:** Describes the devaluation of credentials due to oversupply. *Partially Fits:* Related to signal degradation. *Misses:* The dynamic *narrowing* of criteria, the adverse selection in dropout, and the self-reinforcing nature fueled by the degradation itself.
  *   **Red Queen Effect:** "It takes all the running you can do, to keep in the same place." Describes the need for constant escalation just to maintain position. *Misses:* The *degradation* of the "place" itself (the value/meaning of the signal), the *narrowing* of the race criteria, and the adverse selection component.

  ### The Best Fit: A Synthesis
  Your description synthesizes elements of **Adverse Selection (reversed)**, **Goodhart's Law on steroids**, and **Positional Arms Races**, within a **Multipolar Trap**, amplified by **Concentrated Winners**. However, the core unique engine is the **feedback loop between signal degradation and competitive focus**.

  ### Proposed Term & Tight Definition
  **Evaluative Collapse Trap (ECT)**

  **Definition:** A self-reinforcing competitive dynamic where:
  1.  Efforts to gain advantage within a positional competition progressively **degrade the informational value** of widely used signals/metrics.
  2.  This degradation forces competitors and evaluators to rely on **progressively narrower, more easily gamed, or more expensive-to-access proxy criteria**.
  3.  The narrowing/gaming of criteria **accelerates the degradation** of informational value for *all* criteria, creating a positive feedback loop.
  4.  Concurrently, participants with **lower tolerance for escalating costs** or **stronger preference for alternative values** disproportionately **exit the competition**.
  5.  This selective dropout **increases the average commitment** (or tolerance) of the remaining pool to the escalating costs/gaming strategies, further **intensifying the competition** and **reinforcing the collapse** onto narrower criteria.
  6.  **Concentrated intermediaries** (vendors, platforms, gatekeepers) profit from the escalating costs/gaming and actively work to **maintain the trapped equilibrium**.

  ### Boundary Cases: Separating ECT from Neighbors

  1.  **Superficial Lookalike but NOT ECT (Shouldn't Count): Standard Credential Inflation with Neutral Dropout.**
      *   *Scenario:* More people get college degrees, making a bachelor's degree less distinctive. Some people who never really wanted a degree drop out of higher education altogether. Competition increases for *the same type* of degree from better schools, but admissions still uses broadly the same holistic criteria (grades, test scores, essays, ECs), even if standards creep up. Prep companies exist but don't fundamentally alter *what* is measured or cause a collapse onto vastly narrower signals.
      *   *Why it's NOT ECT:* Signal degradation (devaluation) occurs, but there's no **progressive narrowing onto more gameable criteria** driven *by* that degradation. Dropout is present but **not adverse** in the specific sense – it doesn't actively make the *remaining* competition *worse* by selecting for escalation-lovers; it just reduces the pool size. The core feedback loop (degradation -> narrowing -> accelerated degradation) is missing.

  2.  **Genuine ECT that a Sloppy Definition Might Miss: The "Skills Certification" Trap in Tech Hiring.**
      *   *Scenario:* Companies rely on coding certifications (e.g., AWS, Kubernetes) as signals of competence. Bootcamps emerge offering intensive, exam-focused training. The market floods with certified candidates whose *practical* skill levels vary wildly (signal degradation). Companies, losing faith in the cert's broad value, start demanding *more specific* or *rarer* certs, or stack multiple common ones. This increases the cost and narrows the focus for candidates. Candidates who value broad learning or dislike exam-cramming drop out of these specific certification paths, leaving only those highly motivated (or financially capable) to chase the ever-shifting, narrower certification targets. Certification vendors thrive.
      *   *Why it IS ECT (and might be missed):*
          *   **Degradation:** Certs become noisy signals of real skill.
          *   **Narrowing:** Reliance shifts to more specific/stacked certs (narrower criteria).
          *   **Acceleration:** The focus on specific/stacked certs makes bootcamps even more effective at gaming them, further degrading *their* value as holistic skill indicators.
          *   **Adverse Dropout:** Candidates valuing broader competence or disliking the treadmill leave, leaving those committed to playing the narrow certification game.
          *   **Concentrated Winners:** Bootcamps and certification vendors profit immensely.
      *   *Sloppy Definition Risk:* Might be mislabeled as simple "credential inflation" or "Goodhart" without recognizing the *narrowing cascade* (AWS Cert -> Specialty Cert -> Multiple Specialty Certs) and the *adverse selection* in who continues playing.

  ### Why "Evaluative Collapse Trap" Fits
  *   **Evaluative:** Centers on the failure of the *assessment/signaling* mechanism.
  *   **Collapse:** Emphasizes the progressive failure and *narrowing* of the criteria used for evaluation, akin to a building collapsing in on itself.
  *   **Trap:** Highlights the self-reinforcing nature and the difficulty of escape, with concentrated interests maintaining it.

  This term captures the unique, vicious feedback loop you identified: the competition doesn't just waste effort on stable signals (arms race) or see signals become meaningless (Goodhart); the *process of the signal failing actively creates the conditions for it to fail faster and more catastrophically on an ever-narrower set of criteria*, while the field of players becomes increasingly dominated by those who are either victims resigned to the grind or beneficiaries of it. It's a particularly pernicious form of multipolar trap fueled by corrupted evaluation.
