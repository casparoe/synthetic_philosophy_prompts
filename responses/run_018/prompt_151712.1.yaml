answer: |-
  Here's a calibrated breakdown of how the WEIRD divergence data impacts robust moral realism vs. thinner contractualism, incorporating your niche angle:

  **Core Probabilities:**

  1.  **p(divergence is mostly weighting parameters, not harm recognition):** `0.85`
      *   *Rationale:* Haidt's MFQ, Shweder's ethics, and countless cross-cultural studies consistently show cultures *recognize* harm (e.g., hitting someone unprovoked is bad). The core dispute is *when* harm outweighs loyalty/authority/purity or how severe harm must be to trigger condemnation. Fundamental failure to perceive harm (e.g., not seeing beating as harmful) is rare outside extreme contexts.
  2.  **p(robust moral realism requires near-universal convergence on core harm judgments):** `0.65`
      *   *Rationale:* Robust realists (e.g., Brink, Shafer-Landau) often anchor objectivity in universal *basic* moral responses (like harm aversion). Widespread, fundamental disagreement on what *counts* as core harm (your niche angle) is a stronger challenge than disagreement on *weighting*. If core harm perception varies radically, mind-independent properties become harder to defend.
  3.  **p(idealized deliberation converges on shared norms, avoiding power/framing):** `0.55`
      *   *Rationale:* Contractualism (e.g., Scanlon) *hopes* idealized agents under fair conditions converge. However, deep pluralism (Berlin), path dependency, and framing effects (Tversky/Kahneman) pose real risks. Procedural fairness *helps*, but guarantees are weak. Convergence on *thin* norms (e.g., "avoid severe suffering") is likelier than thick codes.
  4.  **p(historical/cultural contingency dominates, preventing rational convergence):** `0.45`
      *   *Rationale:* Moral norms often reflect ecological adaptation, power structures, and historical accidents (e.g., herding vs. farming honor codes). If norms are heavily path-dependent, even idealized deliberation might not overcome deeply ingrained, functionally adapted differences, especially regarding authority/purity.

  **Combined Credence (Undermining Robust Realism WITHOUT Undermining Contractualism):**

  *   **Overall p:** `0.42`
  *   *Calculation Method:* Weighted geometric mean (emphasizing interaction). Factors 1 & 2 are most critical. High confidence that harm is *recognized* (1) weakens the challenge to realism *if* weighting divergence is the main issue. However, the requirement for convergence (2) is significant, and the niche angle (if true) boosts this challenge. Contractualism's fragility (3,4) is offset by its thinner foundation being less dependent on universal *recognition* and more on *procedure*.
      *   *Interpretation:* Leaning slightly towards the divergence *not* being uniquely fatal to realism while sparing contractualism. The data is problematic for realism, but not decisively so given harm recognition. Contractualism seems more resilient simply because it demands less initial convergence.

  **Least Confident Term:** **p(idealized deliberation converges...)** (`0.55`)
  *   *Why?* Highly theoretical, lacks decisive empirical validation. Assumptions about rationality, information, and motivation under "idealization" are contested. Real-world analogs (e.g., complex international negotiations) often fail to achieve deep normative convergence.
  *   **Empirical Result That Would Move It Most:** A large-scale, pre-registered replication **in small-scale societies** showing that "harm threshold" judgments (e.g., what level of physical force constitutes "harmful" hitting) are **systematically shifted by linguistic framing** (e.g., describing the same act as "discipline" vs. "violence" or using agent-patient vs. event-focused syntax) *without changing observable facts*, **and** that these shifts *persist* even in deliberative contexts designed to minimize power dynamics. This would directly challenge the ability of deliberation to overcome fundamental conceptual/perceptual differences, lowering this p to `~0.35`.

  **Impact of the Niche Angle ("Threshold Divergence"):**

  1.  **If Threshold Divergence is TRUE (cultures have different perceptual baselines for "harm"):**
      *   **Impact:** Significantly strengthens the challenge to **robust realism** (raises p(Requires Convergence) to `~0.85`). If "harm" itself isn't perceived universally, mind-independent properties linked to harm aversion become untenable. Weakens **contractualism** slightly (lowers p(Converges) to `~0.48`), as finding overlapping concerns is harder.
      *   **New Overall p:** `~0.55` (Stronger case for undermining realism without *fully* undermining contractualism).
  2.  **If Threshold Divergence is FALSE (divergence is ONLY weighting):**
      *   **Impact:** Weakens the challenge to **robust realism** significantly (lowers p(Requires Convergence) to `~0.45`). Universal harm recognition allows realists to argue weighting differences stem from non-moral factors (ecology, epistemology). Strengthens **contractualism** (raises p(Converges) to `~0.65`), as shared recognition of harm provides clear common ground.
      *   **New Overall p:** `~0.35` (Much weaker case for uniquely undermining realism).

  **Final Shift if Threshold Divergence False:** Your overall credence shifts **down by ~0.07** (from `0.42` to `0.35`). The niche angle is crucial – if true, it significantly bolsters the argument against realism relative to contractualism; if false, the challenge weakens considerably. The core data (weighting divergence) alone is problematic for realism but not decisively fatal, while contractualism remains relatively robust against it.
