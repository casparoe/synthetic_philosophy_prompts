answer: |-
  Here is a structured set of desiderata for a theory of mechanistic sameness capable of addressing structural latency, framed for rigorous philosophical evaluation in your seminar. Requirements are categorized by their epistemic or metaphysical obligations, with explicit conflict flags.

  ---

  ### **Core Non-Negotiables (Transcend Camp Divisions)**  
  1. **Organizational Sensitivity**  
     - *Phenomenon*: Latent-pathway activation, structural rewiring.  
     - *Requirement*: Must register changes in causal topology (e.g., feedback loops enabled, inhibitory links broken) even when components remain identical.  
     - *Motivation*: Component-identity alone cannot distinguish normal operation from structurally latent regimes (e.g., prion misfolding retaining atomic composition but gaining toxic aggregation capacity).  

  2. **Causal Capacity Retention**  
     - *Phenomenon*: Normal functioning vs. degraded/alternative modes.  
     - *Requirement*: The theory must account for preserved *local* causal powers of components (e.g., a protein’s binding site still functions) while explaining global functional shifts.  
     - *Motivation*: Avoids treating mechanistic change as mere replacement (denying substrate continuity).  

  3. **Degradation-Emergence Distinction**  
     - *Phenomenon*: Graded degradation (e.g., slowing kinetics) vs. latent-pathway activation (e.g., new signal cascade).  
     - *Requirement*: Provide criteria to differentiate "same mechanism malfunctioning" from "new mechanism emergent."  
     - *Motivation*: Structural latency cases challenge theories to explain how novelty arises without new parts.  

  ---

  ### **Contextually Constrained Desiderata (Camp-Sensitive)**  
  4. **Counterfactual Stability under Intervention**  
     - *Phenomenon*: Predictive tracking for anomaly detection.  
     - *Requirement*: Sameness should imply stability under interventions targeting *components* (e.g., inhibiting a protein should disrupt both normal and latent behaviors).  
     - *Preference*: Prioritized by interventionist (Woodward-aligned) accounts; risks component-fetishism if overemphasized.  

  5. **Minimal Structural Invariance**  
     - *Phenomenon*: Consistency across perturbations (thermal, signal loss).  
     - *Requirement*: Identify a core relational subgraph that persists across regimes (e.g., shared input-output pathways).  
     - *Preference*: Favored by organizational-invariance theories; risks structural brittleness if too minimal.  

  6. **Functional Equivalence Class**  
     - *Phenomenon*: Alternative modes (e.g., metabolic pathway rerouting).  
     - *Requirement*: Treat mechanisms as identical if they achieve the same input-output mapping, regardless of internal rewiring.  
     - *Preference*: Adopted by functionalist-leaning views; may obscure ontological discontinuity in structure.  

  ---

  ### **The Latency-Specific Desideratum (Critical Conflict Point)**  
  7. **Latent Pathway Integration**  
     - *Phenomenon*: Activation of causally inert relations.  
     - *Requirement*: Must adjudicate whether dormant relations (e.g., allosteric sites, unused neural connections) are *constitutive* of the original mechanism or merely *potential* elements.  
     - *Conflict Flag*: Directly pits **component-identity** (dormant relations are part of the mechanism) against **organizational-invariance** (only *active* relations define the mechanism). *Joint unsatisfiability likely here*: If dormant relations are constitutive, component-identity dominates but obscures reorganization; if only active relations count, every perturbation creates a "new" mechanism.  

  ---

  ### **Theory Evaluation Brief**  
  - **Craver-style (Entity-Activity)**: Fails **Organizational Sensitivity** by privileging entities/activities over dynamic topology. Struggles with **Latent Pathway Integration** (dormant relations aren’t "activities"). Excels at **Causal Capacity Retention**.  
  - **Glennan-style (Interactionist)**: Strong on **Degradation-Emergence Distinction** (interactions define mechanisms) but risks violating **Minimal Structural Invariance** (interaction changes may overgenerate "new" mechanisms). **Counterfactual Stability** is marginal.  
  - **Organizational-Invariance**: Meets **Organizational Sensitivity** and **Minimal Structural Invariance** but falters on **Causal Capacity Retention** if components’ unrealized powers are excluded. **Latent Pathway Integration** is its Achilles’ heel—either too inclusive or too brittle.  

  ---

  ### **Synthetic Tension**  
  The central paradox lies in **Desideratum 7**: Structural latency demands that theories reconcile physical continuity (same parts) with causal-structural discontinuity (new behaviors). No extant theory fully satisfies *both* **Causal Capacity Retention** (non-negotiable) and **Minimal Structural Invariance** (preference) when latent pathways activate. A successful theory must either:  
  - (a) Define a "dynamic essence" of mechanisms (e.g., teleological constraints on organization),  
  - (b) Treat mechanisms as *process types* admitting modal flexibility, or  
  - (c) Introduce granular criteria for "significant" vs. "incidental" rewiring—though this risks context-dependence.  

  This architecture forces confrontation with whether mechanistic identity is grounded in *historical* configuration, *dispositional_ potential, or _functional_ outcomes—a fitting crux for graduate debate.
