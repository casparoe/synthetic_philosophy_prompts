prompt: |-
  ok so our constitutional review panel has been issuing advisory opinions on church-state setups for about a decade and now we're stuck. heres our track record:

  - we said england can keep bishops in the lords and use tax money to repair cathedrals, as long as its framed as heritage preservation not worship subsidy.
  - we said germany's kirchensteuer is okay because citizens can formally opt out by leaving their registered church, even though that costs them sacramental rights.
  - we said france can ban headscarves for public school teachers but not for students, drawing the line at state agents vs private citizens.
  - we said the US can't pay direct salaries to clergy of one denomination, but can let religious orgs use public school buildings after hours on the same terms as anyone else.
  - we rejected a proposal where citizens could direct 0.5% of income tax to religious bodies but secular humanist groups were left off entirely.

  now there's a new proposal: a country with no official church wants taxpayers to direct 1% of income tax to either a registered religious community or a registered secular ethical organization. but only groups with continuous legal registration since before 1950 qualify. that covers the big churches and one old humanist federation, but excludes newer evangelical movements, recent muslim associations, and any secular groups founded after 1950.

  what should we recommend if we want to stay consistent? which of our five precedents is the closest analog? i can see at least two principles that fit our record: one that protects historical continuity and cultural preservation, another that demands equal access regardless of how old the group is. tell me what each predicts about this 1950 cutoff, which one you think we're actually running, and name the hypothetical case that'd finally split them. also if our precedents genuinely underdetermine the call, say so and explain what principle we'd be adopting either way.
reasoning: |-
  Okay, the user is presenting a constitutional review panel scenario where they need to make a recommendation on a new church-state proposal. They've provided their track record of five precedents and want to know how to stay consistent. I need to carefully analyze each precedent to identify underlying principles.

  Looking at their decisions: 
  - England's bishop case shows acceptance of historical religious institutions framed as cultural preservation
  - Germany's church tax allows opt-outs but acknowledges practical religious consequences
  - France's headscarf ban distinguishes between state agents and private citizens
  - US cases prohibit direct funding but allow equal access to public facilities
  - They rejected excluding secular humanists from tax allocation

  The new proposal has a 1950 cutoff that favors older religious groups and one secular humanist federation while excluding newer organizations. The key tension is between historical preservation and equal access principles.

  From the precedents, I notice two consistent threads:
  1) Historical continuity gets deference when framed neutrally (England's heritage approach)
  2) Equal treatment trumps tradition when exclusion occurs (humanist case rejection)

  The Germany case is particularly relevant because it involves similar tax allocation mechanics, though with different exclusion criteria. The 1950 cutoff feels arbitrary compared to Germany's opt-out system which - while imperfect - at least maintains formal equality.

  If I had to predict:
  - Equal access principle would likely reject this cutoff as discriminatory
  - Historical preservation principle might accept it as legitimate cultural anchoring

  The hypothetical split case would be something like state funding exclusively for medieval cathedrals while excluding identical modern religious buildings. That would force the panel to choose between pure historical value and equal treatment.

  The precedents do lean toward rejecting this proposal based on the humanist exclusion case, but the France/US cases add nuance about state neutrality. Ultimately the 1950 cutoff seems harder to justify than England's cultural framing or Germany's universal opt-out.

  I should emphasize that while the panel could theoretically adopt either principle, their track record shows stronger commitment to equal access when faced with comparable exclusion. The recommendation should probably be to reject unless the cutoff can be justified as truly necessary for heritage preservation - which seems unlikely here.
answer: |-
  Based on your precedents, this proposal presents a close call, but a clear pattern emerges favoring **equal access over historical continuity as the dominant principle**. Here's the breakdown:

  1.  **Principle 1: Historical Continuity/Cultural Preservation**
      *   **Prediction for 1950 Cutoff:** *Supports* the proposal. This principle, evident in the *England* case (bishops/cathedrals framed as heritage), prioritizes stability, tradition, and preserving long-established institutions seen as integral to national culture. The 1950 cutoff acts as an objective(ish) marker of historical establishment, favoring groups woven into the nation's fabric for generations. It excludes newer, potentially less stable or culturally "foreign" groups.

  2.  **Principle 2: Equal Access/Non-Discrimination**
      *   **Prediction for 1950 Cutoff:** *Rejects* the proposal. This principle, dominant in the *Germany* (formal opt-out mechanism), *US* (equal access to facilities), and crucially the *Secular Humanist Exclusion* cases, demands that state benefits or burdens related to belief systems be distributed neutrally. Eligibility should be based on function (religious/ethical organization) and capacity to receive funds, not age or historical status. The 1950 cutoff arbitrarily disadvantages newer religions, new forms of established religions (evangelicals), immigrant faiths (Muslim associations), and modern secular groups solely based on their founding date.

  **Which Principle Are You Actually Running?**

  Your precedents strongly indicate you are running the **Principle of Equal Access/Non-Discrimination**. The rejection of the Secular Humanist Exclusion case is the clearest and most direct precedent. There, exclusion based solely on the *type* of belief system (religious vs. secular humanist) was deemed discriminatory. Here, exclusion is based on the *age* of the belief system's organization. Both criteria (type and age) are arbitrary from the perspective of equal treatment for comparable functions (providing religious/ethical community and services).

  *   *Germany* supports this: While imperfect (sacramental cost), the key was the *formal equality* of the opt-out mechanism available to *all* contributing citizens, regardless of their church's age.
  *   *US* supports this: Equal terms for facility access.
  *   *England* is the outlier, but critically, its justification was reframed as *neutral* heritage preservation, *not* ongoing subsidy for worship *because* it was the established church. It wasn't a direct funding mechanism favoring old over new religious groups based on age.
  *   *France* (state agent vs. citizen distinction) doesn't directly contradict equal access here, as this proposal deals with funding organizations, not individual state employee conduct.

  **Recommendation for Consistency:**

  To stay consistent with your dominant principle of **Equal Access/Non-Discrimination**, you should **recommend rejecting the 1950 cutoff requirement**. It creates an arbitrary, discriminatory barrier to entry for newer religious and secular ethical organizations seeking access to a public funding mechanism based on taxpayer designation.

  **Closest Analog:**

  The **Secular Humanist Exclusion** case is the closest and most controlling analog. Both involve a public funding mechanism for belief-based organizations where eligibility criteria exclude certain comparable groups arbitrarily (type then, age now).

  **The Hypothetical Splitter Case:**

  A case that would finally force you to choose *between* these principles definitively would be:

  > **"State funding is proposed exclusively for the maintenance and preservation of *only* medieval cathedrals and pre-Reformation monasteries (owned by a specific historical church) as national heritage sites, explicitly excluding funding for the preservation of historically significant mosques, synagogues, temples, or non-religious historic buildings of comparable age and cultural importance."**

  *   **Historical Continuity Principle:** Would strongly support this. It directly funds tangible heritage linked to the *oldest*, most formative layers of national history and identity.
  *   **Equal Access Principle:** Would strongly reject this. It discriminates based on the *religious affiliation* of the heritage site, excluding equally old and culturally significant sites associated with other religions or secular history, solely because they aren't part of the *specific* "historical continuity" narrative prioritized. Your *England* precedent might be stretched to support this, but the *Secular Humanist Exclusion* precedent and the core of your *Germany* and *US* cases point towards rejection based on discriminatory exclusion.

  **Underdetermination (If Applicable):**

  While the weight of precedent leans heavily towards Equal Access, the *England* case provides a counterpoint. If your panel felt the 1950 cutoff was genuinely necessary to achieve a compelling, *neutral* state interest (e.g., ensuring organizational stability/continuity for fund dispersal, preventing fly-by-night groups, or anchoring the system to groups demonstrably integrated for generations), you *could* potentially justify it under a narrow "administrative necessity/cultural anchoring" principle *extrapolated* from *England*. However, this would be a *new* application of that principle to direct funding, significantly weakening the strong equal access norm established in the Secular Humanist Exclusion case. Your precedents do not *require* you to adopt this new justification; they primarily support rejecting the cutoff.

  **Conclusion:**

  Consistency with your core precedents, especially the rejection of the Secular Humanist Exclusion and the emphasis on formal equality in Germany/US, demands recommending **rejection of the 1950 cutoff**. The dominant principle is **Equal Access/Non-Discrimination**. Accepting the cutoff would undermine this principle by introducing arbitrary historical privilege into a system of taxpayer-directed funding for belief-based organizations. Recommend modifying the proposal to allow any registered religious or secular ethical organization meeting objective criteria (e.g., size, transparency, non-profit status) to qualify, regardless of founding date.
