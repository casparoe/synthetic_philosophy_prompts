prompt: |-
  I just came from a long argument with a friend about whether term limits, rotation in office, and sortition improve institutions, and I realized that I have firm verdicts about particular offices but no clear principle behind them. I would like you to work out what principle, if any, captures my verdicts.

  Here are my verdicts, roughly in the form they came out in the argument.

  1. I oppose a two-term limit on a directly elected city comptroller. The office is technical and poorly monitored by the public, and a limit mostly transfers power to permanent staff and outside auditors.

  2. I support a two-term limit on a county sheriff. Long-serving sheriffs build personal machines, the office is coercive, and rotation interrupts that dynamic.

  3. I support selecting a citizens' assembly by lot to redraw state legislative districts. The main risk is self-dealing, and ordinary citizens, with expert support, can handle a one-off map.

  4. I oppose selecting a monetary policy board by lot. The role requires technical competence and credibility in financial markets, and sortition would be reckless.

  5. I support keeping a state legislature's budget committee in the hands of long-serving career legislators. Continuity lets them master the details and push back against the executive's numbers.

  6. I support requiring the same legislature's ethics committee to rotate its membership every session. Long service on ethics oversight makes it clubby, while frequent rotation keeps oversight adversarial.

  7. I oppose term limits for neighborhood council chairs, though not strongly. Turnover is already high, and the main cost would be lost local knowledge.

  8. I support a sortition-based climate assembly that recommends policy, but I would oppose giving it binding power: it is valuable as a one-off source of considered public judgment, not as a standing governing body.

  I am most confident in (3), (4), and (6), and least confident in (1) and (7); my friend came closest to moving me on (2).

  My tentative principle was that we should prefer career professionals where the main risk is technical error or lost tacit knowledge, and prefer rotation or sortition where the main risk is capture by a stable network. But that is loose, and my friend showed it can be gamed case by case. He proposed a sharper version: one-off distributions of power lend themselves to sortition, ongoing coercive or oversight roles lend themselves to rotation, and ongoing technical roles lend themselves to career professionals. I could not make that version fit the climate assembly, which is both one-off and technically dense, or the sheriff, which is both coercive and operationally complex.

  What I want is this. Please work out the principle—or a small set of candidate principles—that best captures these eight verdicts, stated precisely enough to apply to a new case. For each clause of the principle, say which of my cases motivates it. Then apply the principle to a case I did not include: an elected school board subject to a three-term limit. Tell me what it predicts. Finally, be honest about which of my verdicts the principle cannot save without ad hoc amendments, and which of those verdicts I should be most willing to reconsider. Since I am trying to find out where my own judgment is fragile, please also tell me what would change your mind: which of my verdicts, if I changed it, would most alter the principle you propose, and where you think your reasoning is most likely to fail. Please write the answer in American English.
reasoning: |-
  Okay, I need to help the user figure out a principle that explains their judgments about term limits, rotation, and sortition across different offices. They've listed eight specific cases with their verdicts, and they're looking for a consistent underlying rule. 

  First, I'll analyze each case to identify patterns. The user seems to care about two main things: preventing corruption/capture and maintaining competence. For example, they oppose term limits for technical roles like city comptroller (#1) but support them for coercive roles like sheriff (#2) where personal power buildup is risky. 

  The climate assembly case (#8) is interesting - they support sortition for recommendations but not binding power. This suggests the distinction between advisory and decision-making roles matters. Also, rotation works for ethics committee (#6) to prevent clubiness but not for budget committee (#5) where continuity is key.

  Hmm, the friend's proposal about one-off vs ongoing roles doesn't quite fit because the sheriff (#2) is ongoing yet rotation is supported. Maybe the key is whether the primary risk is operational failure or institutional capture? 

  Let me try structuring this as a decision tree:
  1. Is this about distributing power (like redistricting)? → Sortition
  2. Is this a coercive/oversight role? → Rotation to prevent capture
  3. Is this technical/operational? → Career continuity 
  4. But with exceptions: if it's advisory (climate assembly) sortition is ok even if technical, and if coercive but complex (sheriff) we still prioritize anti-capture.

  The school board test case: elected position with term limits. Since school boards have both technical aspects (education policy) and oversight risks (special interest capture), the principle would lean toward supporting term limits if capture risk dominates, but opposing if competence loss is bigger. Given typical school board issues, I'd predict support for term limits.

  Now the hard parts: 
  - The neighborhood council (#7) is tricky because high natural turnover makes term limits redundant. This might require an exception for "sufficient organic rotation."
  - The sheriff case (#2) pushes against the competence concern - the user prioritizes anti-capture here despite operational complexity, which strengthens the risk hierarchy.

  If the user changed their view on the sheriff (#2), the whole risk-prioritization framework would collapse. And if they reversed the comptroller (#1) verdict, it might mean they're weighting staff capture higher than I assumed.

  I should flag that neighborhood council (#7) and comptroller (#1) are the most fragile verdicts per their own uncertainty. The principle holds best for clear-cut cases like monetary board (#4) and redistricting (#3).
answer: |-
  Based on your verdicts, I derive a principle prioritizing institutional safeguards against the *dominant systemic risk*, evaluated along three key dimensions: **Power Nature, Competence Demand, and Network Stability Risk**. Here's the principle, its motivations from your cases, and its application:

  **The Principle:**  
  *Prefer institutional design (career continuity / rotation / sortition) that mitigates the dominant systemic risk to the role's core function. Determine dominance by assessing:*  
  1. **Power Nature:** Is the role primarily *distributive* (allocating power/resources), *coercive* (enforcing rules/security), *technical* (requiring specialized expertise), or *oversight* (monitoring integrity)?  
  2. **Competence Demand:** Does the role require *high technical/experiential expertise* that is costly to acquire?  
  3. **Network Stability Risk:** Does long tenure create *self-dealing, capture by networks, or loss of adversarial edge*?  

  **Dominant risk dictates the solution:**  
  - **Rotation** (term limits, committee turnover) is preferred if *Network Stability Risk* dominates (e.g., capture, machine politics, loss of oversight edge).  
  - **Career Continuity** is preferred if *Competence Demand* dominates (e.g., technical error, loss of tacit knowledge).  
  - **Sortition** is preferred for *distributive* one-off tasks where *neutrality* is paramount and technical needs are manageable with support.  
  - **Binding power** requires structures addressing *both* competence and network risks (e.g., career bodies with oversight).  

  ---

  ### **Motivation from Your Cases**  
  | Clause in Principle          | Motivating Cases (Your Verdicts)                                                                 |  
  |------------------------------|--------------------------------------------------------------------------------------------------|  
  | **Rotation for Network Risk** | #2 (Sheriff: coercive role, machine-building risk). #6 (Ethics Committee: oversight role, clubby risk). |  
  | **Career for Competence**     | #1 (Comptroller: technical, staff capture < competence loss). #4 (Monetary Board: technical credibility). #5 (Budget Committee: continuity needed for expertise). |  
  | **Sortition for Distributive Neutrality** | #3 (Redistricting: one-off distributive task, self-dealing risk). #8 (Climate Assembly: advisory, not binding, due to competence gap). |  
  | **Competence > Binding Power** | #8 (Climate Assembly: sortition for judgment but not binding due to ongoing technical demands). |  
  | **Organic Rotation as Sufficient** | #7 (Neighborhood Council: high turnover negates need for formal limits). |  

  ---

  ### **Application to New Case: Elected School Board with 3-Term Limit**  
  - **Power Nature:** Distributive (allocating resources) + Oversight (monitoring education quality).  
  - **Competence Demand:** Moderate (budgets, pedagogy, policy) but not highly technical like monetary policy.  
  - **Network Stability Risk:** High (risk of capture by unions, contractors, or ideological groups over time).  
  - **Dominant Risk:** *Network Stability Risk* (entrenchment/capture) outweighs Competence Demand (expertise can be built in 3 terms).  
  **Prediction:** **Support term limits.** Your principle aligns with #2 (sheriff): coercive/oversight roles with capture risk warrant rotation. School boards face similar risks of entrenchment and special-interest influence.  

  ---

  ### **Weaknesses and Fragile Verdicts**  
  **Verdicts the Principle Cannot Fully Save (Require Ad Hoc Adjustments):**  
  1. **#1 (Comptroller):** Your verdict opposes term limits due to staff capture risk. The principle prioritizes technical competence here, but staff capture *is* a network stability risk. This case exposes tension between competence and network risks in technical roles.  
     - *Ad Hoc Patch:* "In technical roles with low public scrutiny, staff capture risk may override competence priority."  
     - **Suggested Reconsideration:** Moderate opposition if evidence shows staff/auditors are more captured than a long-serving comptroller.  

  2. **#7 (Neighborhood Council):** Your weak opposition assumes organic turnover. The principle doesn’t explicitly address "sufficient existing rotation."  
     - *Ad Hoc Patch:* "Formal rotation is redundant if organic turnover is high."  
     - **Suggested Reconsideration:** Low stakes here, but if turnover decreases, term limits may become justified.  

  **Most Fragile Verdict:** **#2 (Sheriff)**. Your friend nearly moved you because sheriffs *do* require operational expertise (Competence Demand), yet you prioritize rotation due to coercive power risk. This is the core tension: **When Competence Demand and Network Risk are both high, which dominates?** Your verdict chooses Network Risk, making it pivotal.  

  ---

  ### **What Would Change My Mind?**  
  1. **If You Changed #2 (Sheriff):** Opposing term limits would collapse the principle. It would force a concession that coercive roles can prioritize competence over anti-capture, undermining #6 (ethics rotation) too.  
  2. **If You Changed #4 (Monetary Board):** Supporting sortition would suggest technical credibility can be decoupled from career expertise, weakening the competence clause.  
  3. **If You Changed #8 (Climate Assembly):** Granting it binding power would imply sortition bodies can handle ongoing technical governance, contradicting #4 and #5.  

  **Where My Reasoning Is Most Likely to Fail:**  
  - **Overlooking Hybrid Roles:** The principle struggles when Power Nature isn’t "pure" (e.g., school boards are distributive + oversight + technical). Your sheriff verdict (#2) papers over this by prioritizing coercion.  
  - **Implicit Weighting:** I assume Network Risk > Competence in coercive/oversight roles, but you may weight this differently (e.g., in comptroller #1, you weight Competence > Network Risk).  
  - **"One-off" Definition:** The climate assembly (#8) is technically dense but one-off; redistricting (#3) is simpler. The principle relies on your judgment that complexity is manageable with advisors.  

  ### **Conclusion**  
  Your core intuition: **Mitigate the risk that most corrodes the role’s function.** For technical roles, protect competence; for power-distributing/coercive roles, disrupt entrenchment; for oversight, preserve adversarialness. The school board prediction (support term limits) follows from prioritizing anti-capture in a distributive role. Revisit #1 (comptroller) if staff capture evidences *greater* harm than competence loss, and #7 if neighborhood turnover slows. But stand firm on #2—it’s the keystone holding your risk hierarchy together.
