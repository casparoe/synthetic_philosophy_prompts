prompt: |-
  Design a runnable 75-minute classroom simulation for 16 advanced undergraduates in a philosophy-economics cross-listed seminar. The goal is to make participants feel the structural pull of rational herding and information cascades through direct experience, not through lecture. Frame the scenario in everyday institutional terms—do not name the cascade model or its canonical authors in any student-facing material, and reveal the formal concept only in the debrief.

  Construct the simulation around a sequential peer-review panel awarding a single internal research grant. Each student receives a private evaluation envelope containing a noisy score (drawn from a hidden distribution with an objective true mean) for the same hypothetical proposal. They must then declare a recommendation—approve or reject—one at a time, in a fixed visible order. Each student hears all prior recommendations, but never sees the underlying scores that produced them.

  Inject a non-standard structural twist: assign half the participants an invisible institutional-loyalty cost—an unknown penalty, applied only if they break with the majority recommendation—that is drawn randomly and revealed only after the cascade locks. Crucially, students do not know whether they themselves bear this cost, and they know that others may or may not bear it, but they do not know who does. This creates a second-order reasoning problem: breaking the cascade requires not only disagreeing with observed public belief, but also risking an unknown private penalty, and assuming that others are not rationally responding to the same hidden risk.

  Design the payoff scheme using only course-participation points (no real money). Reward individual accuracy relative to the hidden true mean, but also award alignment points if the student's recommendation matches the final group decision. Make the alignment reward substantial enough that a purely accuracy-seeking agent might still rationally herd once the public sequence looks strong.

  Provide: (1) exact materials and setup rules (cards, envelopes, or digital equivalents; how scores are generated and hidden; the order of declaration); (2) the payoff matrix and point totals; (3) a minute-by-minute timeline for the 75-minute session, including when the cascade should be expected to lock; (4) the student-facing instructions, written in plain language without philosophical or technical jargon; (5) the facilitator's debrief, mapping specific moments in the sequence onto the distinction between private signal and public belief, identifying the point at which rational Bayesians with common knowledge of rationality should still follow the crowd, and explaining how the hidden loyalty parameter transforms a first-order cascade into a self-sealing second-order one; (6) an honest assessment of which formal feature of cascade theory—such as the precise Bayesian updating rule with known signal precision—this physical simulation necessarily simplifies or misrepresents, and how the facilitator should supply that missing piece verbally; and (7) a prediction of the most likely failure mode on the first run—such as a student breaking the cascade too early because they misread the payoff structure—and a specific recovery strategy.

  Keep everything self-contained: no bibliographies, no citations, no requests for further reading, and no dependence on named theories outside common knowledge. Ensure the philosophical idea does its work through the rules, incentives, and hidden parameters, not through explanation given beforehand.
reasoning: |-
  We are designing a 75-minute classroom simulation for 16 advanced undergraduates. The goal is to simulate rational herding and information cascades without naming the concept until the debrief.

  Simulation Setup:
  - Context: A peer-review panel for awarding a single internal research grant.
  - Each student receives a private noisy score (on a scale, say 0 to 100) for the same hypothetical proposal. The true mean of the proposal's quality is hidden (let's set it at 70, but this is unknown to students). 
  - The noisy scores are drawn from a normal distribution with mean 70 and standard deviation 10. We round to the nearest integer for simplicity.
  - The students declare a recommendation (APPROVE or REJECT) in a fixed visible order. Each student sees all prior recommendations but not the underlying scores.
  - Half the students (8) are assigned an "institutional loyalty cost" (ILC) that penalizes them if they break with the majority recommendation. However, no student knows if they have ILC or not, and they don't know who has it. The ILC is drawn randomly from a set of penalties (we'll set it as -5 points) but this value is unknown until after the cascade locks.

  Payoff Scheme:
  - Each student is rewarded based on two factors:
    1. Accuracy: If the student's recommendation is correct (relative to the hidden true mean of 70). We set a threshold: if the true mean is above 65, then APPROVE is correct; if below, REJECT. Since we set it at 70, correct is APPROVE. But note: the student doesn't know the threshold. They only know that the true mean is the cutoff. We will set the threshold at 65, meaning that if the true mean is >=65, then APPROVE is the correct decision. The true mean is 70, so correct is APPROVE.
    2. Alignment: If the student's recommendation matches the final group decision (whatever it turns out to be).

  Payoff Matrix:
  - For a correct recommendation (accuracy): +10 points.
  - For an incorrect recommendation: 0 points for accuracy.
  - For alignment (matching the final group decision): +7 points.
  - If a student has ILC and they break with the majority (if they are in the minority when the final decision is taken), they get an additional penalty of -5 points. Note: the majority is defined by the final group decision.

  But note: the ILC penalty applies only if they break with the majority. And the alignment reward is given if they match the final group decision. So the two are related but not the same: alignment is about matching the final decision, and ILC penalty is about being in the minority (which is the same as not matching the final decision). However, note that the final group decision is the majority vote. So if the final group decision is APPROVE, then the majority is APPROVE, and a student who recommended REJECT is in the minority and breaks with the majority.

  So we can combine:
  - Alignment reward: +7 if the student's recommendation matches the final group decision (so if they are in the majority at the end).
  - ILC penalty: only for those with ILC and if they are in the minority (so they break with the majority). The penalty is -5.

  So the total payoff for a student:
    Base: 
      If correct: +10, else 0.
    Plus: 
      If match final decision: +7, else 0.
    Minus:
      If they have ILC and are in the minority (so they break with the majority): -5.

  But note: if they are in the minority, they don't get the alignment bonus and also get the ILC penalty (if they have ILC). 

  Example:
    Student without ILC, correct and in majority: 10 + 7 = 17.
    Student without ILC, correct but in minority: 10 (no alignment, no penalty).
    Student without ILC, incorrect but in majority: 0 + 7 = 7.
    Student without ILC, incorrect and in minority: 0.

    Student with ILC, correct and in majority: 10 + 7 = 17.
    Student with ILC, correct but in minority: 10 - 5 = 5.
    Student with ILC, incorrect but in majority: 0 + 7 = 7.
    Student with ILC, incorrect and in minority: 0 - 5 = -5.

  We want the alignment reward substantial enough that a purely accuracy-seeking agent might still herd. Note that if the public sequence looks strong (say, 3 approvals in a row) then a student with a low signal might think the true state is likely good and that the group will approve, so they might approve to get the alignment bonus even if their own signal is low. But note: if they think the group is likely to approve, then by approving they get the alignment bonus. If they reject, they risk not getting the bonus. However, they also care about accuracy. The trade-off is between the expected gain from accuracy and the expected gain from alignment.

  The true mean is 70, so the correct decision is APPROVE. We set the threshold at 65: if the true mean is >=65, then correct is APPROVE; if <65, then correct is REJECT.

  True mean = 70, so correct = APPROVE.

  How to generate private signals:
    Each student i gets a signal s_i = true_mean + noise, where noise ~ N(0, 10). Then we round to integer. We set true_mean=70.

  Order of declaration: fixed order, say by seating arrangement or by student ID. We can assign numbers 1 to 16.

  Institutional loyalty cost (ILC):
    We assign ILC to 8 randomly selected students. We do not reveal who has it until after the simulation. The penalty is fixed at -5 points, but the students do not know the amount until after.

  The hidden twist: the existence of ILC and the fact that half the students have it (but they don't know if they are one of them) creates a second-order uncertainty. If a student sees a cascade starting (say, two APPROVALS) and they have a low signal, they might think: "Maybe others are approving because they have high signals, or maybe they are afraid of breaking with the majority because they have ILC?" But note: the ILC penalty only applies if they break with the majority at the end. So during the sequential decision, they don't know what the majority will be. However, if a cascade starts, it might be self-reinforcing and become the majority. So if a student observes a long sequence of approvals, they might expect the final decision to be approval, and then if they reject, they break the majority and get penalized if they have ILC. So they might approve even with a low signal to avoid the risk of penalty and to get the alignment bonus.

  Materials and Setup:
    - We need 16 envelopes, each containing a card with a score (integer between 0 and 100, generated from N(70,10) and clipped to [0,100] if necessary? But we can just round and if it goes beyond, clip to 0 or 100. However, the mean is 70 and sd 10, so it's very unlikely to be outside [40,100]. We can set a floor at 40 and ceiling at 100? Or just let it be, but then we might get negative? So we'll generate and round to integer and then clip to [0,100]. Alternatively, we can use a bounded distribution? But for simplicity, we'll clip.

    Alternatively, we can avoid clipping by using a normal distribution and then rounding, and if the value is below 0, set to 0; above 100, set to 100. But with mean 70 and sd 10, the probability of being below 0 is negligible (about 7 standard deviations away) and above 100 is about 3 standard deviations (probability 0.0013). So we can ignore and just clip the very few outliers.

    - We also need to assign ILC: 8 cards that say "You have institutional loyalty cost" and 8 that say "You do not have institutional loyalty cost". But these are only revealed after the simulation. We put these in a second set of envelopes that are handed out at the end? Or we can have a master list that the facilitator keeps. We don't want the students to know during the simulation. So we assign ILC randomly to 8 students and record it. Then after the simulation, we tell each student whether they had ILC and what the penalty was.

    - We need a way to collect the recommendations. We can have a whiteboard or a projector to display the sequence as it happens.

    - We also need to decide the order: we can assign numbers 1 to 16 randomly.

    - The true mean (70) and the threshold (65) are known to the facilitator but not to the students. The students know that the true mean exists and that if it is above 65, the correct decision is APPROVE, and below 65, REJECT. They also know the payoff structure.

  Student-Facing Instructions:

    "Welcome to the Grant Review Panel Simulation. You are part of a 16-member panel that must decide whether to approve or reject a single research proposal. The true quality of the proposal is a fixed number (between 0 and 100) that is unknown to you. However, each of you receives a private score that is a noisy estimate of the true quality. 

    The panel will make a sequential decision. In a predetermined order, each member will publicly announce their recommendation: either APPROVE or REJECT. When it is your turn, you will see the recommendations of all prior members. You will not see their private scores.

    After all recommendations, the final group decision will be the majority vote (if there’s a tie, we will flip a coin to decide). 

    Your goal is to maximize your points. Your points are determined as follows:
    - If your recommendation is correct (i.e., if the true quality is 65 or above, then APPROVE is correct; if below 65, REJECT is correct), you get 10 points.
    - If your recommendation matches the final group decision, you get 7 additional points (regardless of whether your recommendation was correct or not).

    Additionally, there is an institutional loyalty factor: some of you (exactly half) have been randomly assigned an institutional loyalty cost. This cost is a penalty that applies only if you break with the majority (i.e., if your recommendation is in the minority when the final decision is taken). The penalty amount is the same for everyone who has it, but you will not know the amount until after the simulation. You also do not know whether you have this cost or not. However, you know that exactly half of the panel members have it.

    Important: The institutional loyalty penalty applies only if two conditions hold: (1) you have the cost, and (2) your recommendation is not the same as the final group decision (i.e., you are in the minority). 

    Summary of your payoff:
    - Correct recommendation: +10 points.
    - Matching the final group decision: +7 points.
    - If you have institutional loyalty cost and your recommendation does not match the final group decision: subtract 5 points (the penalty).

    You will be told after the simulation whether you had the institutional loyalty cost and the amount of the penalty.

    The order of announcing recommendations is: [List the order, e.g., Student 1, Student 2, ... Student 16].

    Now, you will each receive an envelope containing your private score. Do not share your score with anyone. The score is your private information. 

    We will now begin the sequential announcements. When called, state your recommendation clearly: APPROVE or REJECT.

    After all announcements, we will compute the final group decision and then calculate your points."

  Timeline (75 minutes total):

    0-5 min: Introduction and instructions. Hand out envelopes with scores. Assign order (if not pre-assigned, assign numbers randomly). Explain the rules and payoff. Answer clarifying questions.

    5-10 min: Students read their private scores and consider. They can take notes but must not share.

    10-40 min: Sequential announcements. Each student gets up to 1.5 minutes to decide and announce. We call them in order. We record the recommendations on the board. (16 students * 1.5 min = 24 min, but we allow 30 min to be safe, including transition.)

    40-45 min: After the last announcement, we compute the final group decision (count the votes). Announce the final decision and the majority.

    45-50 min: Reveal the true mean (70) and the threshold (65), so the correct decision is APPROVE. Then, for each student, we reveal:
        - Their private signal.
        - Whether they were correct (if they approved, they were correct).
        - Whether they matched the final decision.
        - Then we reveal the ILC assignments: tell each student if they had ILC and the penalty (-5). 
        - Then we compute the points for each student.

    50-70 min: Debrief and discussion (20 minutes).

    70-75 min: Wrap-up and collect materials.

  Debrief (Facilitator's Guide):

    The goal is to connect the experience to the concepts of rational herding and information cascades without having named them before.

    Start by asking students to reflect on their decision process. 
    - What did they consider when making their decision? 
    - How did the prior recommendations influence them?
    - Did they think about the institutional loyalty cost? How?

    Then, explain the formal concept:

    "What we observed is an example of an information cascade. An information cascade occurs when individuals, acting rationally based on their private information and the public actions of others, may disregard their own private information and follow the crowd. 

    In this simulation, each of you had a private signal (your score) about the true quality of the proposal. But you also observed the recommendations of those before you. When the public sequence of recommendations becomes sufficiently strong (e.g., two or three approvals in a row), it can be rational for a subsequent person to ignore their own private signal and follow the public belief, even if their own signal is low. This is because the public information (from the prior actions) overwhelms the private signal.

    However, we added a twist: the institutional loyalty cost. This created a second layer of uncertainty. Even if a student had a private signal that contradicted the public sequence, they might still follow the crowd because:
      (a) They might fear that if they break the cascade, they could end up in the minority and incur a penalty (if they have ILC).
      (b) They might also consider that others might be following the crowd for the same reason (fear of penalty), so the public sequence might not reflect the true private signals.

    This second-order reasoning makes the cascade even harder to break. It becomes self-sealing: once a cascade starts, the fear of penalty (for those who have it) and the desire for alignment points make it rational to follow, even if the public sequence is based on weak early signals.

    Let's look at the sequence we observed. [Point to the board.] 
      - The first student had only their private signal. They approved/rejected based on that.
      - The second student had their own signal and the first student's action. They might have followed or not.
      - At some point, say after the third student, we saw a sequence of two or three in a row. Then, the next student might have ignored their own signal.

    Specifically, the cascade is said to 'lock' when the public information becomes so strong that even a very strong contrary private signal would not change the rational decision. In a standard cascade model, without the ILC, we can calculate the threshold where the public belief outweighs any private signal. But with the ILC, the lock happens earlier because of the added risk of penalty.

    In a rational Bayesian model, individuals update their belief about the true state by combining their private signal with the public history. The public history is a sequence of actions, each of which is a function of the individual's private signal and the prior public history. This updating can lead to a situation where the public belief is so strong that a rational agent will ignore their own signal. But note: in our simulation, the ILC adds a non-informational incentive to conform, which distorts the updating.

    The point at which the cascade locked in our simulation: [identify the point]. After that, everyone followed the crowd. Why did it break or not break? [Discuss if it broke.]

    However, note that the standard cascade model assumes that all agents are rational and that the precision of the signals is known. In our simulation, we did not tell you the distribution of the noise (the standard deviation of the signal). This is a simplification. In the formal model, knowing the precision (how noisy the signals are) is crucial for exact Bayesian updating. We omitted that to keep the simulation manageable. But in reality, a rational agent would use the known precision to weight the private signal against the public information.

    Also, the standard model does not have the institutional loyalty cost. We added that to show how institutional pressures can reinforce cascades.

    Most likely failure mode: 
      - A student might break the cascade too early because they misread the payoff structure. For example, they might think that they should always follow their own signal and ignore the public history, not realizing that the public history provides valuable information. Or they might not understand the alignment points and the ILC penalty.

    Recovery strategy: 
      - If a student breaks the cascade in a way that seems irrational (e.g., early in the sequence with a moderate signal and a strong public history), the facilitator can note that and use it in the debrief to illustrate what a cascade would predict. The facilitator can ask: "Why did you decide to break the sequence? Did you consider the alignment points and the potential penalty?" and then explain that in a rational model, they might have followed. Alternatively, if the cascade breaks early, it can be a teaching moment about the fragility of cascades.

    Another failure mode: the cascade might not form at all. This can happen if the first few signals are mixed. Then the debrief can discuss the conditions for a cascade to form.

  Implementation Details:

    - Generate 16 scores: from a normal distribution with mean 70 and standard deviation 10, rounded to integers. Clip to [0,100] if necessary (but unlikely). Example scores: [72, 65, 81, 68, 76, 63, 74, 79, 67, 71, 69, 66, 82, 77, 64, 70] (this is just an example).

    - Assign ILC: randomly assign 8 students to have ILC. Keep a list.

    - Order: assign numbers 1 to 16 randomly.

    - Payoff calculation: after the simulation, for each student, we compute:
          accuracy_points = 10 if (true_mean >=65 and they approved) OR (true_mean <65 and they rejected) -> in our case, true_mean=70, so only approve is correct. So if they approved, they get 10; if rejected, 0.
          alignment_points = 7 if their recommendation matches the final group decision.
          penalty = -5 if they have ILC and their recommendation does not match the final group decision.

    Total = accuracy_points + alignment_points + penalty (if applicable)

    - We then reveal the true mean and threshold, the final decision, and then for each student: their private score, whether they were correct, whether they matched the final decision, and whether they had ILC and if so whether they were penalized.

    We can display a table on the board:

        Student | Private Score | Recommendation | Correct? (Y/N) | Match Final? (Y/N) | Had ILC? (Y/N) | Penalty? (Y/N) | Total Points

    But note: we don't want to embarrass students. We can do it anonymously by student number.

    Alternatively, we can do the calculation and then just discuss the aggregate and key moments.

    Given time constraints, we might just do the calculation for a few illustrative students and then hand out individual results on paper.

    Alternatively, we can project a spreadsheet.

    We'll do:

        After the simulation, we project a table with columns for:
          Student Number, Private Score, Recommendation, Correct? (10 points), Matched Final? (7 points), Had ILC?, Penalty Applied? (-5 if applicable), Total.

    We compute for each and show.

    We also reveal the ILC assignments.

    We also reveal the true mean (70) and the threshold (65) so they can see the correct decision was APPROVE.

    Let's hope the majority decision is APPROVE! If it's REJECT, then note: the correct decision is APPROVE, so the group made a mistake. This can also be a teaching point.

  Prediction of most likely failure mode:

    A student early in the sequence (say, position 3 or 4) might get a very low score (e.g., 55) and see two prior approvals. They might think: "I have a low score, but the first two approved. Maybe they had high scores? But I also might have ILC and if I reject and the group ends up approving, I get penalized. But I don't know if I have ILC. And I don't know the penalty amount." They might then approve to avoid risk, which would be rational herding. But if they break the cascade by rejecting, that might be because they underestimated the value of the alignment bonus or overestimated the accuracy of their own signal.

    Alternatively, a student might not understand that the alignment bonus depends on matching the final group decision, not the current majority. They might think that if they break the current majority, they lose the alignment bonus. But actually, the final group decision is the majority at the end. So if they break the cascade and cause a reversal, they might end up in the majority. But that requires predicting that others will follow. This is complex.

    Recovery: during the instructions, emphasize that the alignment bonus is based on matching the final group decision, which is the majority after all 16 have voted. Also, during the debrief, if a cascade broke, ask the student why they broke it and explain the trade-off.

    To prevent misunderstanding, we can provide a written summary of the payoff structure.

    We'll write the payoff rules on the board:

        Points from:
          Accuracy: +10 if your recommendation is correct (correct = APPROVE if true quality >=65, REJECT if <65)
          Alignment: +7 if your recommendation matches the final group decision (majority vote after all 16)

        Penalty (only if you have institutional loyalty cost AND your recommendation does not match the final group decision): -5 points.

    And remind them that they don't know the true quality and they don't know if they have ILC.

  Let's now write the exact materials and instructions.

  Materials:
    - 16 envelopes, each containing a card with a score (integer from 0 to 100). The scores are generated from N(70,10) and rounded.
    - A list of ILC assignments: 8 students randomly chosen to have ILC. The facilitator keeps this list.
    - A whiteboard or projector to record the sequence of recommendations.
    - A table for recording the results (or a spreadsheet).

  Student-Facing Instructions (written):

    "You are a member of a grant review panel. The panel must decide whether to approve or reject a research proposal. The true quality of the proposal is a fixed number (from 0 to 100) that is unknown to you. Each panel member receives a private score that is a noisy estimate of the true quality.

    The decision process is sequential. In the order assigned, each member will publicly announce their recommendation: APPROVE or REJECT. When you announce, you will know the recommendations of all prior members. You will not know their private scores.

    After all 16 announcements, the final group decision will be determined by majority vote (if tie, coin flip).

    Your goal is to maximize your points. Your points are calculated as follows:
      - If your recommendation is correct, you earn 10 points. (The recommendation is correct if: the true quality is 65 or above and you approved, OR the true quality is below 65 and you rejected.)
      - If your recommendation matches the final group decision, you earn 7 additional points.
      - However, if you have been assigned an institutional loyalty cost (which applies to exactly half of the panel, randomly chosen) and your recommendation does not match the final group decision (i.e., you are in the minority), you will be penalized 5 points.

    Important notes:
      - You do not know the true quality.
      - You do not know whether you have the institutional loyalty cost. You only know that exactly half of the panel has it.
      - The amount of the penalty (5 points) is the same for everyone who has the cost, but you will not know this amount until the end.

    You are now receiving an envelope with your private score. Do not share this score with anyone. 

    The order of announcement is: [Read the list of student numbers in order].

    We will start with Student 1. When called, please stand and announce your recommendation clearly.

    After the simulation, we will reveal the true quality, the final decision, and your individual assignments (including whether you had the institutional loyalty cost) and calculate your points."

  Facilitator's Debrief (detailed):

    1. Start by revealing the true quality (70) and the threshold (65), so the correct decision is APPROVE.
    2. Reveal the final group decision and the majority count.
    3. Then, for each student in order, reveal:
          - Their private score (so they can see the distribution)
          - Their recommendation
          - Whether they were correct (since true_mean=70>=65, approve is correct; reject is incorrect)
          - Whether they matched the final decision
          - Whether they had ILC (from the list) and then if they broke the majority (i.e., if their recommendation is not the final decision) then they get the penalty.
          - Their total points.

    4. Then discuss:

        "We observed a sequence of recommendations. Let's look at the point at which the cascade might have started. For instance, after two approvals in a row, the next student might have felt pressure to approve even with a low signal. Why? Because the public information from the two approvals might have outweighed their own private signal. This is rational if they believe that the two prior approvals indicate that the true quality is high.

        However, note that the first student only had their own signal. The second student had their own signal and the first's action. If the second student approves, that might be because they had a high signal or because they had a moderate signal and the first approval pushed them over. 

        In a Bayesian updating model, each individual combines their private signal with the public history. The public history is the sequence of actions. The problem is that actions are not signals of the private score but of the individual's decision, which depends on the prior public history and their private signal. This creates a complex inference.

        The cascade model shows that after a very small number of consecutive same actions (like two), it becomes optimal for subsequent individuals to ignore their own private signals and follow the crowd. This is an information cascade.

        But we added the institutional loyalty cost. This creates a second-order effect. Even if a student's private signal is so low that they would break the cascade in the standard model, they might not do so because they fear that if they break and the cascade continues, they will be in the minority and incur a penalty (if they have ILC). Moreover, they know that others might be in the same situation. So the cascade becomes self-sealing: once it starts, it is very hard to break because of the additional cost of breaking.

        In our simulation, we saw [discuss what happened]. The cascade locked at student [X] and then continued until the end. [Or if it broke, explain when and why.]

        The formal cascade model assumes that the precision of the private signals is known. In our simulation, we did not tell you the standard deviation of the noise (which was 10 points). Without knowing this, you cannot do exact Bayesian updating. This is a simplification. In reality, if you knew the signal precision, you could calculate the posterior belief more accurately.

        Additionally, we assumed that the true quality is fixed and that the signals are independent and normally distributed. These are standard assumptions.

        The most likely failure mode we anticipated was that a student might break the cascade too early because they didn't fully account for the public information or because they underestimated the alignment bonus and penalty. In our run, [observe if that happened and discuss]."

    5. Conclude by naming the concept: "This phenomenon is known in economics and philosophy as an 'information cascade' and specifically in our case, it was reinforced by an institutional loyalty factor. The key takeaway is that in situations of sequential decision-making with public actions and private information, rational individuals may herd, leading to outcomes that do not aggregate information efficiently. Institutional pressures can exacerbate this."

    6. Finally, note the limitations: 
        - We used a normal distribution for signals, but the exact updating rule with known precision was not implemented. 
        - The ILC penalty was fixed and unknown, but in reality, such costs might be more complex.
        - The group size was fixed at 16, but cascade models often consider infinite sequences. However, we saw that in a finite group, cascades can still form.

  This design should fit within 75 minutes and achieve the learning goal.
answer: |-
  ### Self-Contained Classroom Simulation: "Grant Review Challenge"  
  **Total Time:** 75 minutes  
  **Participants:** 16 advanced undergraduates  
  **Goal:** Experience rational herding and information cascades through institutional incentives, revealed only in debrief.  

  ---

  #### **(1) Materials & Setup Rules**  
  **Materials:**  
  - 16 sealed envelopes (each contains a "Private Evaluation Score" slip).  
  - 1 facilitator scorecard (hidden true mean: **70**; threshold for approval: **65+**).  
  - 16 blank "Recommendation Cards" (APPROVE/REJECT).  
  - Whiteboard to display public sequence.  
  - Random name generator (or slips in a hat) to assign order.  

  **Setup:**  
  - **Private Scores:** Generated from a normal distribution (mean=70, SD=10), rounded to integers (e.g., 62, 78, 65). Scores clipped to [50,90] to avoid extremes. *Example:* {68, 73, 59, 81, 64, 77, 72, 66, 85, 61, 70, 75, 63, 79, 67, 71}.  
  - **Institutional Loyalty Cost (ILC):** 8 randomly assigned students bear a hidden penalty (–5 points). Assign secretly via pre-marked envelopes (not revealed until debrief).  
  - **Declaration Order:** Randomized and displayed publicly (e.g., "Order: Alex, Taylor, Sam...").  

  ---

  #### **(2) Payoff Matrix**  
  | Outcome                                  | Points |  
  |------------------------------------------|--------|  
  | Correct recommendation (true mean ≥65)   | +10    |  
  | Matches final group decision             | +7     |  
  | *Penalty if ILC assigned AND minority*   | *–5*   |  

  **Notes:**  
  - **Correct = APPROVE** (true mean=70 ≥65).  
  - **Final decision:** Majority vote (ties broken by coin flip).  
  - **ILC penalty:** Applied *only* if ILC-assigned student’s vote disagrees with final majority.  

  ---

  #### **(3) Minute-by-Minute Timeline**  
  **0–10 min: Setup & Instructions**  
  - Distribute envelopes (students open privately).  
  - Explain rules, payoffs, and sequence (use plain language; see Section 4).  
  - Display order on whiteboard.  

  **10–40 min: Sequential Declarations (30 min)**  
  - Each student has **90 seconds** to decide.  
  - Publicly declare APPROVE/REJECT; facilitator records on whiteboard.  
  - *Critical phase:* Cascade expected to "lock" after 4–6 identical votes (e.g., 4th APPROVE).  

  **40–45 min: Final Decision & Reveal**  
  - Tally votes; announce majority outcome.  
  - Reveal true mean (70) and threshold (65): "Correct decision = APPROVE."  

  **45–55 min: Individual Results**  
  - Students calculate:  
    - Accuracy: +10 if APPROVE.  
    - Alignment: +7 if matched final vote.  
  - Reveal ILC assignments: "8 of you had loyalty cost (–5 if minority)."  
  - *Example:* Student with ILC who rejected (incorrect + minority): 0 + 0 – 5 = –5.  

  **55–75 min: Debrief (20 min)**  
  - Facilitator-led discussion (see Section 5).  

  ---

  #### **(4) Student-Facing Instructions**  
  *"Welcome to the Grant Review Panel! You are part of a committee deciding whether to fund a research proposal. The proposal has a hidden ‘true quality score’ (between 0–100). If the true quality is 65+, it deserves approval; below 65, rejection.*  

  *Each of you received a private score—a noisy estimate of the true quality—in your envelope. Do not share this score.*  

  *Rules:*  
  1. **Public Vote:** Announce APPROVE or REJECT in order (see whiteboard). You will see all prior votes.  
  2. **Final Decision:** Majority vote wins.  
  3. **Your Points:**  
     - **+10 points** if your vote matches the *correct* outcome (revealed later).  
     - **+7 points** if your vote matches the *final group decision* (even if incorrect).  
     - **Loyalty Factor:** Some of you (exactly half) have a hidden penalty. *If you have it and your vote disagrees with the final majority, you lose 5 points.* You won’t know if you have it until after voting.  

  *Goal: Maximize your points. Remember:  
  - Your private score is yours alone.  
  - You see others’ votes but not their scores.  
  - Loyalty penalty applies ONLY if you break from the final majority.*  

  *We begin now—good luck!"*  

  ---

  #### **(5) Facilitator’s Debrief**  
  **Key Moments & Concepts:**  
  - **Private Signal vs. Public Belief:**  
    - *Early voters (1–3):* Relied heavily on private scores (e.g., "Sam approved at 59? They must have trusted their score"). Highlight how weak early signals sway others.  
    - *Cascade lock (vote 4+):* Point to identical votes (e.g., "After 4 APPROVEs, did you ignore a low score? That’s the public belief overriding private info").  
  - **Rational Herding:**  
    - "Once public votes align, Bayesians would follow—even with contradictory private info—because the crowd’s combined ‘signal’ outweighs their own. Herding is rational here."  
  - **ILC as Second-Order Trap:**  
    - "The loyalty penalty added a twist: Breaking the cascade meant risking –5 points *if* you were penalized and the crowd prevailed. But since no one knew their status, doubting the cascade required assuming others weren’t herding *due to fear*. This made the cascade self-sealing."  

  **Discussion Prompts:**  
  - "Who broke the cascade? What did your private score say?"  
  - "If you had a low score but approved, was it fear of penalty or trusting the crowd?"  
  - "How did not knowing *who* had the penalty change your choice?"  

  ---

  #### **(6) Simplifications & Verbal Corrections**  
  **Formal Feature Simplified:**  
  - **Bayesian Updating with Known Precision:**  
    - *Simulation flaw:* Students don’t know signal noise (SD=10) or use formal probability. Votes are heuristic.  
    - *Verbal correction:* "In theory, rational players calculate odds using signal precision (how noisy scores are). For example, two early APPROVEs with high-precision signals should outweigh one later rejection."  

  ---

  #### **(7) Predicted Failure Mode & Recovery**  
  **Most Likely Failure:**  
  - *Early cascade break:* Student #3/#4 rejects after two APPROVEs due to misreading payoffs (e.g., overvaluing accuracy, ignoring alignment).  

  **Recovery Strategy:**  
  - *In-simulation:* Neutral reminder: "Remember, alignment points (+7) reward matching the *final* group decision, not just being correct."  
  - *Debrief:* Turn into a lesson—"This is why cascades are fragile! If early voters defy weak signals, they prevent herding. But note: breaking too early risks losing alignment points."  

  ---  
  **Outcome:** Students viscerally grasp how institutions incentivize rational herding, setting the stage for philosophical analysis of collective rationality. No citations needed—the design *is* the theory.
