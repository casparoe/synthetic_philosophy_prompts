answer: |-
  Hey, 

  So, thinking about Quine and moral values again. You know how he famously dismisses them as not genuinely real, right? Kind of just useful fictions we use to coordinate behavior, like intersubjective calibration devices – not Vaihinger’s "as if," but shared tools that help stabilize what we believe across different people. He wants to keep this sharp split between the descriptive stuff science deals with (which gets ontological commitment) and the normative stuff like morals (which doesn’t). But here’s the rub: I think his own naturalized epistemology and holism actually blow up that distinction.

  Remember Quine’s core move? He drags epistemology into the natural sciences. Studying how we form beliefs *is* part of science itself. And crucially, holism tells us our whole web of belief faces experience as a unit. What justifies positing an entity? Whether it’s indispensable for our best, most effective theories that predict and explain our sensory experience. Physical objects are the classic example – we posit them because they’re utterly indispensable for making sense of the flux of sensations and building successful science. They earn their ontological keep by their explanatory role.

  Now, apply that naturalized, holistic lens to *us* as believing, acting creatures. How do we actually predict and explain human behavior, both individually and socially? We absolutely *rely* on normative discourse – talk of "should," "ought," "right," "wrong," "fair," "unjust." It’s woven into psychology, sociology, anthropology, history, even economics. Why? Because without appealing to these shared normative calibrations – these intersubjective standards for belief and action – our ability to predict how people will coordinate, cooperate, resolve conflict, or even form stable beliefs *themselves* falls apart. Think about trust, promise-keeping, norms of evidence, or just basic social cohesion. Predicting that someone will stop at a red light isn’t just about physics and physiology; it’s deeply tied to shared norms about rules and consequences. Explaining why a community rejects a belief often involves appeals to fairness or perceived injustice, not just faulty logic.

  So, if normative discourse is demonstrably *indispensable* for predicting and explaining the very phenomena that naturalized epistemology studies (i.e., how humans successfully navigate the world and form beliefs), then it plays the *exact same functional role* within our web of belief as positing physical objects does for explaining sensory input. It’s not just a "regulatory fiction" we could easily discard; it’s a crucial theoretical posit doing real explanatory work *within* the scientific enterprise as Quine defines it.

  This is where his dismissal becomes inconsistent. His holism demands that *any* indispensable element of our best overall theory of the world – the one that best predicts and explains our total experience – deserves ontological commitment. If the "calibration devices" of normative discourse are indispensable for explaining (scientifically!) how belief and coordination actually work among humans, then they aren't merely convenient fictions sitting outside the descriptive realm. They are *part of* the descriptive scientific story about human cognition and society. Insisting they aren't "real" while physical objects are, simply because one feels "descriptive" and the other "normative," reintroduces the kind of rigid, pre-scientific dualism his holism was supposed to obliterate. The line collapses. Once you admit these norms do indispensable explanatory work *inside* the naturalized web, Quine’s own principles force you to take them ontologically seriously. To do otherwise is just arbitrary, clinging to an outdated intuition that his own framework undermines.

  Anyway, that’s the rough thrust. Feels like Quine’s naturalism, pushed consistently, traps him on this one. Let me know what you think – does this hold water?

  Cheers,
