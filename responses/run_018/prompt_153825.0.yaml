  ## Research Proposal: When Practical Kinds Carve Joints (or Don't They?)

  **Project Title:** Microplastics & Messy Joints: Investigating Practical Kinds in Scientific Taxonomy  
  **Research Question:** When a scientific category (like "microplastic") groups entities primarily based on shared *practical effects* (e.g., size causing physical harm, environmental persistence) rather than shared *internal structure* (e.g., specific chemical composition), does this mean the category fails to "carve nature at its joints," or does it demonstrate that joint-carving is fundamentally *relative to specific explanatory goals*?

  ### Why This Question? Why Now? (The Stalemate Problem)
  The classic debate about natural kinds often gets stuck: **Essentialists** insist real kinds *must* have hidden, intrinsic, necessary-and-sufficient properties (like atomic numbers for elements). **Conventionalists** counter that *all* kinds are just useful human conventions. My argument with my roommate over microplastics (is it a "real" kind or just a grab-bag of convenient-to-blame polymers?) perfectly highlights why this stalemate is frustrating and unhelpful for actual science. It ignores the crucial middle ground: categories defined by *stable, predictable, causally relevant effects* arising from *context* (like organism size, environmental niche) rather than *only* intrinsic essence. Neither pure essentialism nor pure conventionalism adequately explains the usefulness and apparent reality of these "practical kinds." This project asks: **Is "joint-carving" itself goal-dependent?**

  ### Proposed Approach: A Case Study in Plastic Pollution
  I propose a focused, 8-week case study comparing two taxonomic frameworks applied to the *same set of objects*: plastic debris in a marine environment.

  1.  **The "Chemical Structure" Taxonomy (Essentialist Leanings):** Categorize debris based on polymer type (PET, PP, PE, PS, etc.), surface chemistry, and degree of degradation. This emphasizes *intrinsic properties*.
  2.  **The "Ecological Effect" Taxonomy (Practical Kind):** Categorize debris based on size (microplastic vs. macroplastic), shape (fiber, fragment, pellet), and documented *practical effects* (e.g., bioavailability to specific filter feeders, potential for entanglement, adsorption of toxins). This emphasizes *extrinsic, context-dependent impacts*.

  **Method:**
  *   **Literature Synthesis:** Analyze existing studies on marine plastic pollution, focusing on how polymer chemists vs. ecologists/marine biologists define, categorize, and study plastic debris. Pay special attention to justifications for using "microplastic" as a category.
  *   **Conceptual Mapping:** Explicitly map the criteria, boundaries, and predictive/explanatory goals of each taxonomic approach for the *same environmental samples* described in the literature.
  *   **Tension Point Analysis:** Identify specific points where the classifications clash (e.g., a highly degraded PE fragment vs. a pristine PP fiber – same size/effect category, different chemical categories) and evaluate the *explanatory power* and *practical utility* of each approach for specific questions (e.g., predicting toxicity pathways vs. sourcing pollution).

  ### What Success Looks Like (Useful Results)
  *   A clear articulation of *how* the "ecological effect" taxonomy for microplastics functions *as a scientific kind*, despite its lack of chemical essence.
  *   A compelling argument for (or against) the hypothesis that the *explanatory goal* (e.g., predicting organismal harm vs. tracing pollution sources) determines what counts as a relevant "joint" to carve.
  *   A framework showing that "joint-carving" might be a spectrum or multi-dimensional concept, where categories can be more or less "real" *relative to the specific scientific work they are doing*. Success means moving beyond the essentialist/conventionalist binary in a concrete way using a real scientific example.

  ### What Failure Looks Like (Honest Scope)
  *   The literature might show the two taxonomies align *too* well for microplastics in practice, weakening the tension (though this result itself is informative!).
  *   The analysis might reveal that the "ecological effect" category is actually *so* fuzzy and context-dependent it lacks robust predictive power, suggesting it *isn't* a good kind for carving joints, even practically.
  *   Proving a *definitive* philosophical theory about natural kinds in 8 weeks is impossible. Failure would be *not* providing a clear, evidence-based analysis of the microplastic case and its implications for the core question. This project is about **exploring the tension rigorously**, not resolving centuries of philosophy.

  ### Feasibility for 8 Weeks
  This is manageable because:
  1.  It's a **focused case study** (microplastics in marine bio contexts), not a survey of all science.
  2.  It relies primarily on **synthesizing existing literature** (chemical studies, ecological impact studies) and **conceptual analysis**.
  3.  The **comparison is clear and concrete**: chemical structure vs. ecological effect for the same type of object.

  This project tackles a genuine philosophical puzzle sparked by real scientific practice (and a heated roommate debate!), aiming to shed light on how science actually categorizes the messy world when perfect essences are nowhere to be found.
