  Starting with the argument structure. The exclusion argument hinges on two premises: causal closure and mental-physical distinctness. Closure says every physical event has a sufficient physical cause. Distinctness means mental properties aren't identical to physical ones. Then, if a mental state causes a physical event (like raising an arm), but there's already a physical cause (neuron firings), we face a dilemma. Either the mental cause is redundant (overdetermination) or excluded because the physical cause is sufficient. 

