  i've been chewing on Popper's old idea that Darwinism is basically a metaphysical research program rather than a real scientific theory, since it feels like any evolutionary outcome can be explained away with some auxiliary story about selection pressures. He walked that back in his later writing, but i think he was wrong to do so — especially if you look at evolutionary psychology and those phylogenetic comparison methods, they still don't seem to risk clear refutation in the way Popper demanded. If a predicted trait doesn't show up, we just invoke hidden constraints or weak selection, so the core theory never really takes a hit. My view is that Darwinism stays metaphysical in Popper's original sense and that his retraction was more about fitting in with biologists than about logic.

  What would actually count against this? I want the specific predictions or results that should move me, not generic appeals to fossil records, plus an honest check on whether i've just added enough qualifications to make my view unfalsifiable. And please tell me what argument or evidence would change your mind on this, and where your reasoning is most likely to fail.
