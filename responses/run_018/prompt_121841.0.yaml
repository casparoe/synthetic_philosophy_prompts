  Ultimately, I think rejecting (1) is least costly. The height analogy gives us a clear model for how to handle this via semiorders. Pluralists might pay a slightly higher price since they can't rely on a single scale, but even they can adopt multi-dimensional semiorders or similar structures.

  The user's worry about their third commitment (undetectable differences being motivationally inert) is well-founded. But this might be where we need to separate metaphysics of value from decision theory - an undetectable difference might exist but not affect choice. The money-pump argument fails here precisely because no detectable worsening occurs at any step.

