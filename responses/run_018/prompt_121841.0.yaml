  - But in standard measurement theory (like semiorders), indiscriminability implies we can't say which is better, not that they're actually equal
  - The transitive closure in step (7) is where the paradox arises

  The colleague's pluralism argument has some merit - with multidimensional goods, we might not have an underlying cardinal scale to rescue transitivity. But I think rejecting (1) is still preferable because the height case proves that perceptual indiscriminability doesn't entail value equality. 

  About the user's three desired commitments: keeping clear verdicts and transitivity seems feasible if we reject (1). But their third point about undetectable differences not being motivationally relevant might need qualification - this is where the money-pump concern enters.

