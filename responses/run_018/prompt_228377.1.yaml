answer: |-
  ## Exam Question

  **Analyze whether cases where a promisee cannot form expectations (e.g., a deathbed promise to someone unconscious, or a promise to a hardened cynic expecting betrayal) pose a fatal problem for expectation-based accounts of promissory obligation. If these cases are problematic, explain what a normative-power account must successfully achieve to provide a better explanation, addressing the potential worry that such an account might be circular.**

  ## Model Answer (Approx. 600 words)

  Cases where a promisee cannot form expectations, such as deathbed promises to the unconscious or promises to hardened cynics, expose a fundamental flaw in expectation-based accounts of promissory wrongness. These accounts locate the wrong primarily in either the disappointment of an induced reliance interest (Scanlon-esque) or the harm/trouble caused by frustrated expectations (Utilitarian). However, in the deathbed case, the promisee is incapable of forming *any* expectation due to unconsciousness. Consequently, breaking this promise cannot wrong them by disappointing an expectation they never had. Similarly, the cynic fully expects betrayal; breaking the promise merely confirms their pre-existing expectation, arguably causing no *distinct* disappointment or harm beyond what they anticipated. Expectation accounts struggle to explain the intuition that breaking such promises is still wrong *to the promisee*, making these cases more than mere awkwardness – they reveal the account's inability to capture the core, expectation-independent obligation.

  A rival account, treating promising as the exercise of a normative power, offers a potential solution. On this view, the act of promising itself constitutes a distinctive speech act that, by social convention or constitutive rules, generates a directed obligation *to the promisee*. The wrong of breaking a promise lies fundamentally in violating this specific normative relation created by the promise, irrespective of whether it induced reliance or expectation. The promisor, by uttering the words "I promise," invokes a power to change the normative landscape, placing themselves under an obligation owed specifically to the promisee.

  For this normative-power account to succeed where expectation accounts fail, it must provide a non-circular explanation of the source of the obligation generated by the act. It cannot simply assert that promising creates an obligation *because* it creates an obligation. The core challenge is to explain *how* the utterance generates the specific, directed duty without presupposing the very obligation it is meant to ground. The account must commit to grounding the obligation in something external to the promise itself, such as constitutive social rules or conventions that define what it *means* to perform the act "promising." These rules stipulate that successfully performing this act (with the right intentions, context, etc.) *just is* to undertake a directed obligation. The obligation arises from the successful performance of a conventionally defined act, not from the subsequent psychological state of the promisee.

  The strongest objection is that this merely pushes the problem back: *Why* do those constitutive rules or conventions create genuine obligations? Isn't this still circular? However, this objection does not settle the matter. The normative-power theorist argues that the circularity is avoided because the obligation stems from the *shared understanding and recognition of the constitutive rules* within a moral community. The wrong is not defined by the rule *alone*, but by the promisor's intentional invocation of that rule-based power to bind themselves, thereby abusing the shared practice and the promisee's position within that normative structure. In the deathbed and cynic cases, the promisor still performs the conventional act, invoking the power and creating the directed obligation. Breaking it violates the normative position granted to the promisee by the act itself, regardless of their capacity for expectation. While the ultimate grounding of the convention's normative force requires further meta-ethical work, the normative-power account *succeeds* in isolating the source of the *specific, directed* obligation in the performative act governed by convention, thereby explaining the wrong in the problematic cases without relying on expectation formation.

  ## Marking Scheme (Total: 20 Marks)

  1.  **Diagnosis of Expectation Account Failure (4 marks):** Clearly identifies that expectation accounts (reliance/harm) cannot explain the wrongness in the specified cases *because* no relevant expectation is formed or disappointed (deathbed: incapacity; cynic: pre-existing expectation met). *Weak Candidate:* Merely describes the cases or states the accounts struggle without pinpointing the *specific absence of relevant expectation* as the core problem; conflates the cynic's expectation with the relevant reliance.
  2.  **Core Commitment of Normative-Power Account (4 marks):** Accurately explains that the normative-power account locates the wrong in violating the directed obligation *created by the performative act of promising itself*, constituted by social rules/conventions, independent of expectations. *Weak Candidate:* Vaguely states "it's about the act" without specifying the creation of a *directed normative relation/obligation*; fails to mention constitutive rules/conventions.
  3.  **Non-Circularity Requirement for Normative-Power (4 marks):** Explicitly states that the account must avoid circularity by grounding the generated obligation in something external to the obligation itself (i.e., constitutive social rules/conventions defining the speech act). *Weak Candidate:* Assumes or asserts the account *is* circular without attempting to explain how constitutive rules avoid this; claims the obligation "just exists" without grounding.
  4.  **Explaining How Normative-Power Handles Problem Cases (4 marks):** Demonstrates how the account applies to the deathbed/cynic cases: the performative act *succeeds* in creating the directed obligation via the rules, breaking it violates this obligation *to the promisee* regardless of their expectation state. *Weak Candidate:* Claims it works but doesn't explain *how* the obligation is created for the unconscious/cynical promisee; reverts to implicit expectation or vague duty.
  5.  **Addressing Circularity Objection (4 marks):** Acknowledges the circularity worry ("why do rules create obligations?") and provides a plausible response (e.g., grounding in shared practice/recognition of conventions, intentional invocation of the power, wrong as abuse of practice/position). *Weak Candidate:* Ignores the circularity objection; dismisses it without engagement; provides a weak or irrelevant counter-argument.
