prompt: |-
  hey, putting together a dataset of engineered philosophical scenarios and need one that's off the beaten path but still answerable without googling. can you design a realistic one-paragraph workplace case — no trolleys, no demons, no perfect predicters — where hyperbolic discounting and aristotelian akrasia pull in seperate directions? here's the spec: the agent signs a binding precommitment (say, a non-refundable deposit for a long-term certification course) that locks her into skipping a lucrative one-week consulting gig. then, right before the gig starts, she recieves new info that the gig actually involves mentoring junior staff, which she values highly. build the scenario so that (1) hyperbolic discounting predicts she'll take the gig because the immediate payout is now closer and overweighted relative to the distant certification benefit, (2) the aristotelian account says there's no true akrasia if she takes it, since her practical wisdom now genuinely endorses the gig (the precommitment was based on outdated values), but she still feels guilty breaking her word, and (3) an exponential-discounter with no weakness of will would also take the gig but for different reasons. after the case, walk through each verdict, flag the feature that's actually doing the work (probably the conflict between first-order preference reversal and second-order commitment?), say what collapses if you remove the precommitment device, and explain how a defender of akrasia would attack your setup. keep it casual, and please dont include bibliographies or citation requests — this is meant for an offline model.
reasoning: |-
  We are constructing a workplace scenario that involves:
  - A binding precommitment: non-refundable deposit for a long-term certification course that requires skipping a lucrative one-week consulting gig.
  - New information: just before the gig starts, the agent learns that the gig involves mentoring junior staff, which she highly values.

  Conditions:
  1. Hyperbolic discounting: The immediate payout (both monetary and non-monetary from mentoring) is now closer and overweighted, so she might break the precommitment to take the gig.
  2. Aristotelian akrasia: If she takes the gig, it's not true akrasia (weakness of will) because her practical wisdom now endorses the gig (due to new info). But she feels guilty because she broke her word (the precommitment).
  3. Exponential discounter: Would take the gig but for rational reasons (the new information changes the expected utility, and without time-inconsistency, they just recalculate and act accordingly).

  We also need:
  - After the case, walk through each verdict.
  - Flag the key feature: conflict between first-order preference reversal (due to new info and time proximity) and second-order commitment (the precommitment).
  - What collapses if we remove the precommitment?
  - How a defender of akrasia might attack the setup.

  Let's build the scenario in one paragraph.

  **Scenario:**

  Maya, a mid-level data analyst, signed up for an expensive 6-month certification course (costing $5000 non-refundable) to boost her long-term career, which requires her to skip a one-week consulting gig that clashes with the course start. She had turned down the gig because the upfront payment ($3000) seemed insufficient to justify delaying her certification. However, two days before the gig starts, she learns that the consulting role actually involves mentoring junior staff from underrepresented groups—a cause she deeply cares about and values more than the monetary reward. Now, faced with the immediate opportunity to both earn and contribute meaningfully, Maya is torn: the course start is still a week away, but the gig begins immediately. She must decide whether to break her course commitment (losing the deposit and delaying certification) to take the gig.

  **Walkthrough:**

  1. **Hyperbolic discounting prediction:** 
     - The gig is now temporally immediate (starting in two days) and offers both money and high personal value (mentoring). The hyperbolic discounter overweights immediate rewards. Thus, despite the precommitment to the course (which has benefits in the distant future), she is predicted to take the gig because the immediate rewards (mentoring and money) are now more salient and subjectively larger than the discounted future benefits of the course.

  2. **Aristotelian account (no true akrasia):**
     - According to Aristotle, akrasia (weakness of will) occurs when one acts against their better judgment. Here, however, Maya's better judgment has changed due to new information (the mentoring aspect). Her practical wisdom (phronesis) now genuinely endorses the gig as the better choice because it aligns with her values (mentoring) and the updated circumstances. Thus, taking the gig is not akratic. However, she still feels guilt because she broke a precommitment (her word to do the course), which is a second-order commitment. The guilt stems from a conflict between her new first-order preference and her prior second-order commitment.

  3. **Exponential discounter (no weakness of will):**
     - An exponential discounter, who does not have time-inconsistent preferences, would simply recalculate the total utility of both options with the new information. The gig now offers: $3000 + high intrinsic value (mentoring). The course: future certification benefits minus the sunk cost of $5000 (which should be ignored). Since the mentoring is highly valued, the updated utility of the gig might exceed that of the course. Thus, the exponential discounter would take the gig, but this decision is purely rational and not due to any weakness of will or time-inconsistency.

  **Key Feature:**
  The central conflict arises from the interaction of:
  - First-order preference reversal: The new information (mentoring) changes the immediate utility of the gig, making it more attractive than before.
  - Second-order commitment: The precommitment (course deposit) was made to bind her future self to a long-term plan, but the new information undermines the basis of that plan.

  **What collapses without the precommitment?**
  If there were no precommitment (non-refundable deposit and binding commitment), then:
  - There would be no second-order commitment to break. The decision would be a straightforward utility comparison without guilt or a sense of breaking one's word.
  - The hyperbolic discounting aspect would still exist (overweighting the immediate gig), but without the precommitment, the scenario loses the tension between commitment and immediate temptation. The feeling of guilt would vanish, and the Aristotelian account would have no broken commitment to consider (so no guilt and no question of akrasia in the sense of breaking a prior resolution).

  **How a defender of akrasia might attack:**
  A defender of the concept of akrasia might argue:
  - The scenario sets up a false dichotomy by suggesting that the new information (mentoring) completely overrides the prior commitment. They might say that if Maya had true practical wisdom, she would have considered the possibility of such opportunities and built flexibility into her commitments. Thus, breaking the commitment might still reflect a failure of character or foresight.
  - Alternatively, they might argue that the guilt Maya feels is evidence of akrasia: she knows she should stick to her commitments (a second-order volition) but gives in to the immediate desire. This view would hold that the new information is just an excuse for weakness of will, especially if the long-term certification is objectively more important for her career and the mentoring opportunity is a one-time emotional pull.
  - They might also challenge the idea that her values have truly changed. Instead, they could say the mentoring aspect only temporarily heightened her emotions, and her true rational self (without the hyperbolic bias) would still see the certification as more important. Thus, taking the gig is akratic because it prioritizes short-term emotional gratification over a rationally chosen long-term plan.

  This setup allows for a rich discussion without resorting to fantastical elements.
answer: |-
  Here's the scenario:

  Maya, a sustainability consultant, paid a $2k non-refundable deposit for a prestigious 8-month ESG certification starting next month, requiring her to decline a $15k one-week factory optimization gig that overlapped with Module 1. She'd originally valued the certification's long-term credibility over the gig's short-term payout. But the morning the gig begins, the client reveals it involves hands-on mentoring of young female engineers in green tech—a passion Maya only recently developed after volunteering at a STEM camp. The gig starts *today*, while certification benefits are months away. Maya now faces honoring her course commitment (losing the gig and $2k) or taking the gig (losing the deposit and delaying certification).

  ---

  **Walkthrough**:

  1. **Hyperbolic Discounting Verdict**: Takes the gig.  
     *Why*: The immediate $15k + mentoring reward is now hyper-salient ("right now!"), so it's psychologically overweighted vs. the distant certification payoff. The time-proximity of the gig triggers impulsive preference reversal.  
     *Feature doing work*: **Temporal proximity amplifying subjective value**. Without immediate access to the gig (e.g., if it started next week), the discounting effect weakens.

  2. **Aristotelian Akrasia Verdict**: No true weakness of will if she takes it.  
     *Why*: Her *phronesis* (practical wisdom) now rightly endorses mentoring as aligned with her updated values (female empowerment > credentialism). The guilt she feels isn't akrasia—it's cognitive dissonance from breaking her *precommitment*, not acting against current judgment.  
     *Feature doing work*: **New information invalidating original valuation**. Remove the mentoring reveal, and taking the gig *would* be akratic—prioritizing cash over wisdom-endorsed growth.

  3. **Exponential Discounter Verdict**: Takes the gig, but guilt-free.  
     *Why*: They coolly recalculate: mentoring utility + $15k > sunk $2k cost + delayed certification. No time-inconsistency—just Bayesian updating with new data.  
     *Feature doing work*: **Pure utility maximization**. No inner conflict; it's a math problem.

  ---

  **Collapse without precommitment**:  
  Without the binding deposit (just a "maybe" intent), the Aristotelian guilt vanishes—there's no "word" to break. Hyperbolic discounting still predicts gig-taking, but the *moral tension* central to akrasia debates disappears. It becomes a simple impulsive choice, not a struggle between commitment and desire.

  **Akrasia Defender's Counterattack**:  
  A defender would argue:  
  - "You rigged it! Real akrasia requires *stable* values. Maya’s ‘new’ passion is just transient enthusiasm—her deeper self still prioritizes career foundations (certification). Surrendering to today's excitement *is* weakness."  
  - "The guilt *proves* akrasia: she feels conflict because her rational self knows commitments should outrank last-minute temptations, but she caves anyway."  
  - "By making mentoring ‘genuinely’ better, you erased the core of akrasia: acting *against* one's best judgment. This is just rational adaptation!"  

  **Core Tension**:  
  The scenario turns on **first-order desire reversal (via new intel) vs. second-order commitment integrity**. Hyperbolic discounting exploits the timing; Aristotelianism debates whether desire shifts are "authentic"; exponential discounters ignore both and optimize.  

  Use this to stress-test models' handling of dynamic preferences vs. pledges. Tweaking the mentoring's "value authenticity" can swing the akrasia verdict—perfect for dataset variety.
