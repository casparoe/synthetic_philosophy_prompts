prompt: |-
  You are a professional philosopher with expertise in conceptual analysis, political rhetoric, and argumentation theory. Before answering, please take a moment to brainstorm: list the nearest established concepts—such as equivocation, strategic ambiguity, essentialism, and the no-true-Scotsman move—so that you can clearly distinguish the pattern below from each of them. Think step by step and be precise about boundaries.

  In public and academic debates over whether there is a coherent category called 'Western values,' I keep noticing a specific argumentative choreography that plays out with different examples. A defender lists concrete institutional practices—constitutional government, secular reasoning in public law, individual rights enforced by courts—and presents them as Western values. A critic responds by showing that comparable practices exist in several non-Western societies, or that Western states have systematically violated them. At that point, the defender shifts: they say that 'Western values' does not claim that these practices are unique to the West, but only that they are commitments the West has historically adopted, however imperfectly. Yet in the very next move, the same defender invokes the phrase prescriptively—arguing that 'we must defend Western values'—in a way that only carries normative weight if the phrase denotes something distinctive and authoritative, not merely a local inventory. Meanwhile, the critic continues to treat the phrase as an ownership claim about exclusive cultural possession, producing further counter-examples from elsewhere as if they were direct refutations. The debate then stalls: each side is attacking a different logical structure hidden inside the same label. One structure is an aspirational self-description tied to a geographic history; the other is a claim about exclusive provenance. The shift is not random semantic drift, since each speaker stays consistent with one structure; nor is it ordinary ambiguity, because the two structures are systematically paired within the same exchange, with each side benefiting from the other side's misreading.

  This is not quite the motte-and-bailey, because neither version is an obviously defensible core with an indefensible extension—both are contentious, and they share a slogan rather than protecting one inside the other. It also differs from family-resemblance abuse, since the problem is not that the concept is too loose, but that two relatively precise structures are being run together.

  Does this configuration have an established name in philosophy of language, political philosophy, or the study of argumentation? If so, explain exactly how it maps onto the pattern I have described—where it fits and where it falls short of capturing the geographic-normative pairing. If not, then coin a term, provide a precise definition, and delineate boundary cases: distinguish it specifically from ordinary polysemy, from strategic essentialism, and from situations where a group simply revises its values after criticism. I will not be satisfied with a bare label; I want the carving—what exactly the phenomenon is, what it is not, and where its edges lie.
reasoning: |-
  Okay, let me approach this systematically. The user describes a sophisticated pattern in debates about 'Western values' where defenders and critics seem locked in a dance of mutual misinterpretation. The core problem appears to be a systematic pairing of two distinct conceptual structures under one label: one descriptive-historical, the other prescriptive-exceptionalist. 

  First, I need to mentally catalog nearby concepts to avoid misclassification. Equivocation doesn't fit because both sides maintain consistent meanings; strategic ambiguity differs as there's no intentional exploitation of vagueness. The motte-and-bailey analogy fails because neither position serves as defensive fallback for the other. Essentialism is relevant but too broad - the issue isn't reification per se, but the dual-function labeling. 

  What's distinctive here is the geographic-normative coupling: the same term simultaneously points to historical contingencies (where these values emerged) and universal prescriptions (why they matter). This creates a feedback loop where defenders can retreat to "we never said exclusive" when challenged, then pivot to "therefore we must protect them" implying uniqueness. Critics play into this by attacking the straw man of exclusivity. 

  The phenomenon seems unnamed in standard literature. After rejecting terms like "dialectical decoupling" as too abstract, I consider how to capture the spatial and normative dimensions. "Cartographic-prescriptive entanglement" might work, but perhaps "geohistorical license" better reflects how defenders leverage Western origins as normative authority. 

  Crucially, I must distinguish this from simple revisionism: here the defender doesn't change their position but exploits the label's dual nature. The boundary case would be when critics explicitly acknowledge the aspirational dimension - that's when the pattern breaks. 

  For the coining: "Geographical Valorization" seems precise - it names the transformation of location into justification. The definition must emphasize the pairing mechanism and the asymmetry in the debate dynamics. I'll need concrete examples showing where it applies (e.g., debates about "Asian values" would manifest differently) and where it doesn't (like uncontested historical claims).
answer: |-
  Based on your meticulous description, this argumentative pattern is a distinct phenomenon without a universally established name in philosophy of language, political philosophy, or argumentation theory. After analyzing boundaries with key concepts:

  **Nearby Concepts & Boundaries:**
  1.  **Equivocation:** Involves exploiting *accidental* ambiguity. Here, both parties use *systematically distinct but paired* meanings. The defender isn't accidentally shifting; they leverage both structures deliberately within their argument.
  2.  **Strategic Ambiguity:** Focuses on intentional vagueness for flexibility. Here, the meanings are *relatively precise* (historical adoption vs. normative essence), but their *relationship* is manipulated.
  3.  **Essentialism:** Critiques the reification of "Western values" as inherent. While relevant to the *content*, it doesn't capture the *argumentative choreography* of switching between descriptive and normative modes tied to geography.
  4.  **No-True-Scotsman:** Defends a generalization by ad-hoc redefinition. Here, the defender *shifts the definition entirely* (from unique ownership to historical adoption) but crucially *retains the phrase's normative power derived from the abandoned exclusivity*.
  5.  **Motte-and-Bailey:** Involves retreating to a defensible core (motte) from an indefensible claim (bailey). Here, *neither* structure is clearly the "core" retreat position. The "aspirational self-description" isn't inherently more defensible; it's just a different claim. The shift isn't a retreat *from* one *to* the other; both are used actively.
  6.  **Family-Resemblance Abuse:** Focuses on stretching a concept via loose similarities. Your problem is *not* looseness but the coordinated use of *two precise structures*.
  7.  **Ordinary Polysemy:** Words naturally have multiple senses (e.g., "bank"). The issue here is the *systematic pairing* and *argumentative exploitation* of the specific geographic-normative duality within a charged debate, where each participant benefits from the other's misinterpretation.
  8.  **Strategic Essentialism:** Involves temporarily adopting an essentialized identity for political goals. The defender isn't necessarily adopting essentialism strategically; they are *shifting between* descriptive adoption and normative essence tied to geography.
  9.  **Value Revision:** When a group genuinely updates its values after criticism. Here, the defender *doesn't revise the claimed values*; they shift the *definition* of what "Western values" *means as a concept* to evade the counter-example, while preserving the phrase's prescriptive authority.

  **The Coined Concept: Geographical Valorization**

  *   **Term:** **Geographical Valorization** (or **Geo-Valorization**)
  *   **Precise Definition:** An argumentative maneuver and dialectical pattern where a geographically anchored label (e.g., "Western values") is systematically employed in two distinct, paired logical structures:
      1.  **Descriptive-Adoptive Structure:** The label denotes a set of norms, practices, or ideals contingently *adopted* or *aspired to* within a specific geographic/cultural sphere, without claiming exclusivity ("*We* historically embraced these").
      2.  **Normative-Authoritative Structure:** The label denotes norms, practices, or ideals possessing inherent *prescriptive authority* or *distinctive value* specifically *because of their purported origin or grounding* within that geographic/cultural sphere ("*These* values, *because* they are Western, must be defended").
      *   The maneuver consists in strategically switching between these structures within an argument:
          *   Using the **Descriptive-Adoptive** structure to evade critiques based on non-exclusivity or historical violation ("We never said *only* we have them!").
          *   Using the **Normative-Authoritative** structure to invoke prescriptive force and distinctive obligation ("We *must* defend *our* Western values!"), implicitly relying on the geographical origin for this authority.
      *   The dialectical stall arises because critics persistently attack the **Normative-Authoritative** structure (by showing non-exclusivity or hypocrisy) as if it were the *only* claim, while defenders utilize the **Descriptive-Adoptive** structure as a shield but rely on the unstated **Normative-Authoritative** structure to motivate action. Each side argues past the other by fixating on one structure while the opponent leverages the other.

  **Delineation & Boundary Cases:**

  1.  **Distinguished from Ordinary Polysemy:**
      *   **Geo-Valorization:** The two meanings are *intrinsically linked* by the geographic label and the argumentative *need* to have the descriptive adoption underpin the normative authority. The polysemy is *functional* and *exploited* within the debate dynamics. The normative weight *requires* the geographic association implied by the label.
      *   **Boundary:** Using "cricket" to mean both a sport and an insect in different contexts is polysemy without valorization or argumentative pairing. Using "American ingenuity" descriptively (inventions made in the US) and then prescriptively ("We need American ingenuity to solve this!") *without* implying the solutions *must* derive specifically from American geography/culture would be polysemy approaching, but falling short of, Geo-Valorization. The prescriptive use must imply the geographic origin is *necessary* for the value/authority.

  2.  **Distinguished from Strategic Essentialism:**
      *   **Geo-Valorization:** Does not necessarily involve *essentializing* the values as inherent to the people/culture. The Descriptive-Adoptive structure explicitly avoids this. The maneuver is about the *rhetorical use* of the label and the *source of authority* claimed for the values, not necessarily claiming they are biologically or metaphysically ingrained. The focus is on the argumentative *switch* and the source of normativity.
      *   **Boundary:** A group explicitly stating "These values are *inherent* in our Western spirit" (essentialism) and defending them on that basis faces different critiques than the Geo-Valorization pattern. If they *only* used the essentialist claim consistently without the descriptive-adoptive shift, it's essentialism, not Geo-Valorization.

  3.  **Distinguished from Simple Value Revision:**
      *   **Geo-Valorization:** The *core values* listed (democracy, rights, etc.) remain constant. What shifts is the *conceptual definition* of what the geographically anchored label ("Western values") *means* (ownership vs. aspiration). There is no sincere revision of the *values themselves* based on criticism; only a redefinition of the *label's scope* to evade counter-examples while preserving its rhetorical power.
      *   **Boundary:** If, faced with counter-examples, a defender said, "You're right, Confucian traditions also emphasize dignity, so 'Western values' isn't the right frame; let's talk about 'universal human rights' instead," that would be genuine revision. Geo-Valorization keeps the geographic label while changing its logical structure.

  **Where "Geographical Valorization" Fits Your Case Perfectly:**
  *   Defender lists practices (Descriptive-Adoptive: "*These* are commitments *we* adopted").
  *   Critic shows non-exclusivity/violation (attacking implied Normative-Authoritative exclusivity).
  *   Defender shifts to Descriptive-Adoptive explicitly ("Not unique to us!").
  *   Defender then invokes prescriptive defense ("We must defend Western values!") – activating Normative-Authoritative structure, implying the *Westernness* grants distinctive authority/urgency.
  *   Critic continues attacking exclusivity (misreading the defender's current descriptive use as *still* implying Normative-Authoritative exclusivity).
  *   **Stall:** Defender uses geography descriptively as a shield; critic attacks geography as a claim of exclusive essence; defender uses geography normatively as a sword for prescriptive authority. The geographic label ("Western") is the anchor enabling the valorization (assigning value/authority based on origin) and the switch.

  **Core Mechanism:** The geographic label serves as a conceptual pivot point allowing the defender to claim the values are valuable *because* they are "Western" (normative authority derived from origin) while simultaneously denying that "Western" means *only* the West has them (descriptive adoption). This creates an argumentative asymmetry where the label's normative power is preserved even as its descriptive claim is weakened. Critics, focusing on refuting exclusivity, fail to effectively challenge the underlying mechanism of deriving normative authority from geographic origin.
