  We are in a philosophy of physics seminar. The topic is a discrete version of the hole argument in the context of causal set theory. Dr. Lena Voss (spacetime substantivalist) and Dr. Marcus Chen (relationalist) are debating.

  Setting: A seminar room with a whiteboard. The audience is composed of graduate students and faculty.

  **Dr. Lena Voss**: Thank you for having me. I'd like to revisit the hole argument, but in a discrete setting. In causal set theory, spacetime is modeled as a locally finite partial order (C, ≺) of elementary events, with volume assignments given by cardinality. Now, consider a region H—the 'hole'—which is a subset of the causal set. Suppose we permute the labels of the events within H, but we do so in such a way that the entire relational structure—the partial order relations and the volume assignments—remains unchanged. That is, for any two events, their causal relation (whether one precedes the other or they are unrelated) is preserved, and the volume (which is just the count of events in any subset) is also preserved. What we have then are two distinct labeled causal sets, (C, ≺, l) and (C, ≺, l'), where l and l' are different labeling functions, but they represent the same relational structure.

  The substantivalist position, as I see it, must take these two structures as representing distinct physical possibilities. Why? Because the identity of the events—the nodes themselves—matters. But then we face an indeterminism: the laws of physics (which are given by the partial order and the volume assignments) cannot determine which labeled structure we have. For any initial segment outside H, there are multiple ways to label the events inside H that are compatible with the same relational structure. This is an analog of the hole argument in the smooth case.

  **Dr. Marcus Chen**: Lena, I appreciate the discrete setup, but I think you're importing a substantivalist assumption at the very start. In the relationalist view, the nodes in the causal set do not have any inherent identity beyond their relational properties. The partial order and the volume assignments are the entire physical reality. So when you permute the labels, you're merely changing the representation, not the thing itself. There is no physical difference between (C, ≺, l) and (C, ≺, l') because the labels are not part of the physical world; they are our bookkeeping device. Therefore, there is no indeterminism: the physical state is uniquely determined by the relational structure.

  Let me press you on this: why should we treat the labeling as ontologically significant? In the smooth case, the hole argument relies on the diffeomorphism group which is a symmetry of the theory. But in the discrete setting, the symmetry group is the automorphism group of the causal set, and if there is a non-trivial automorphism that permutes the nodes, then indeed we have a redundancy. However, in a generic causal set, there are no non-trivial automorphisms. So in the typical case, your permutation would break the partial order. But you've stipulated that the permutation preserves the partial order and the volume. So we are only considering causal sets with symmetries. But then, the existence of symmetries is a physical feature of the causal set, and it means that there are nodes that are relationally indistinguishable. So the relationalist says: of course we cannot distinguish them, because they are identical in all relational properties. That's not indeterminism; that's just a reflection of the symmetry.

  **Dr. Lena Voss**: Marcus, you make a good point about generic causal sets having no symmetries. But note that in the hole argument, we are not necessarily considering the entire causal set. We fix the relations outside H and then consider different labelings inside H that are compatible with the fixed outside. Even in a causal set with no global symmetries, there might be a region H where we can permute labels without affecting the relations to the outside. That is, the permutation is the identity outside H and preserves all relations (including those between H and the outside, and within H). So we are creating a local symmetry.

  But to your main point: you say that the labels are just bookkeeping. Then what are the nodes? If the nodes are not individuated by anything beyond their relational properties, then in the case where two nodes have identical relational properties (i.e., they are symmetric), they are the same node? That leads to contradiction because they are distinct elements in the set. The set has two elements. So we must account for the cardinality. How does the relationalist explain that there are two distinct nodes if they have identical relational properties? It seems you must either deny the existence of distinct but relationally identical nodes (which would require that such symmetries never occur, but they can) or you must accept that there is a primitive 'thisness' to the nodes.

  **Dr. Marcus Chen**: The relationalist does not deny that there are two nodes. We account for the cardinality by the volume assignment—which is a relational property of a region. The volume of a region is the number of nodes in it. So if we have two nodes in H that are relationally indistinguishable, the region H still has volume 2. That is a relational fact. The nodes are distinct because they are two, not one. But we don't need to label them to know that there are two. The relationalist ontology is that the universe consists of a collection of events with a causal structure and a measure of volume. The individuality of an event is entirely determined by its unique position in the web of relations. If two events have the same relational properties, then they are indistinguishable, and that's a physical fact. We don't need to say more.

  But let me turn your question around. If you, as a substantivalist, insist that the labels matter, then what physical property differentiates two symmetric nodes? You cannot point to any relational property because they are identical. So you must appeal to a haecceity—a non-qualitative property of identity. But then, how could we ever know which node is which? And why should physics care about such primitive identities?

  **Dr. Lena Voss**: I agree that we cannot observationally distinguish them. But that doesn't mean they aren't distinct. The substantivalist postulates that spacetime events have an identity that is prior to their relations. So even if two events are relationally identical, they are still two distinct entities. The physical theory, however, is indifferent to which is which—hence the symmetry. But the indeterminism arises because the laws of physics (which only specify the relations) do not determine which event has which identity. So the theory is indeterministic in the sense that it allows multiple futures that are identical in their relational structure but differ in which node is which.

  But let me push on your relational exhaustion. You say that the volume assignment is relational. But consider: the volume is assigned to a region. What is a region? In causal set theory, a region is typically a subset of events. But then, the identity of the subset depends on the identity of the events. If we permute two events, the subset that contained one of them now contains the other. So if the volume of a subset is 1, then after permutation, that same subset (defined by its elements) would have the same volume. But the relationalist wants to avoid defining regions by their elements. How do you define regions without referring to the nodes?

  **Dr. Marcus Chen**: That's a fair challenge. In causal set theory, we can define regions relationally. For example, a region can be defined by its causal past or future, or by its relations to other events. We don't need to point to a set of nodes by their labels. We can say: consider the set of events that are causally between two fixed events A and B. That defines a region without labeling the internal events. Then the volume of that region is a fixed number. Now, if we permute two events within that region, but the region is defined relationally (by being between A and B), then the set of events in that region remains the same set because the relational definition picks out the same events. Wait, no—if we permute the labels, the events are still the same events. But in your permutation, you are changing the labels, but the events themselves are fixed? I'm getting confused about what you are permuting.

  Let me clarify: in the standard setup, the causal set is a set C with a partial order. The set C is a collection of abstract elements. When we label them, we are just assigning names. But the set itself is unchanged. So when you permute the labels, you are just renaming. The subset H is defined by the events it contains, regardless of what we call them. So the volume is the same. The relationalist says that the physical facts are the isomorphism-invariant facts. The labeling is not physical.

  **Dr. Lena Voss**: But if we take the set C as given, then the elements of C have identity. The set {a, b} is different from the set {b, a} only if we consider the elements with their identities. But if we consider the set extensionally, then {a, b} is the same set regardless of how we label the elements. So in that sense, the set does not change under permutation. But then what is the physical reality? If the set is the same set, then there is no change. But in my argument, I was thinking of the labeled causal set as a tuple (C, ≺, l) where l is a labeling. Then two different labelings give two different tuples. But if the physical reality is just the set with its order, then the labeling is not part of it.

  I see. So perhaps my argument only shows that if we include the labeling in the physical description, we get redundancy. But the relationalist says we shouldn't include it. Then the hole argument doesn't arise because there is no redundancy.

  But wait: what if we consider the entire history of the universe? Suppose we fix the causal structure and volume assignments for all events outside H. Then we consider two different assignments of labels inside H that are consistent with the same relational structure. For the relationalist, these are the same physical state. So there is no indeterminism. For the substantivalist, they are two different states, but they are indistinguishable. So the substantivalist must either accept indeterminism or deny that the labels are part of the physical reality.

  **Dr. Marcus Chen**: Exactly. The relationalist avoids the problem by not including the labels in the physical ontology. The substantivalist, by including them, faces an underdetermination. But then, as I said, the substantivalist must posit haecceities. And that is an ontological cost without empirical payoff.

  But let me address your earlier point about regions. In causal set theory, we can define regions intrinsically. For example, the volume of a region is not defined by the set of elements but by the pattern of causal relations. For instance, the Alexandrov interval between two events p and q is the set of events r such that p ≺ r ≺ q. That is defined solely by the causal relations. Then the volume of that interval is the number of events in it. Now, if we permute two events within that interval, but the interval is defined by p and q (which are fixed by their relational properties), then the set of events in the interval remains the same. So the volume is unchanged. There is no issue.

  **Dr. Lena Voss**: I agree that the volume of the interval is unchanged. But what about the identity of the events within the interval? The substantivalist wants to say that event x being in the interval is a fact that depends on the identity of x. But if we permute x and y, then the event that was x is now labeled y, but it is still the same event? That is, if we hold the events fixed and just change labels, then the event that was called 'x' is now called 'y', but it's still that particular event. So the set of events in the interval is the same. But then, the labeling change is just a change of name, not a change of which event is which. So there is no physical change at all. I think I may have been conflating two things.

  Perhaps the hole argument in the discrete case must be formulated differently. Instead of permuting labels, we must consider a different causal set that is isomorphic to the original. That is, we have two isomorphic causal sets that are not identical. Then the substantivalist might say they represent different physical realities. But then, they are isomorphic, so they are identical in all relational properties. So again, the relationalist identifies them, and the substantivalist distinguishes them by the identity of the nodes.

  But in that case, the indeterminism is only apparent because the two causal sets are isomorphic and hence physically identical. So the substantivalist is forced to accept that isomorphic causal sets represent the same physical reality, or else face a radical indeterminism and underdetermination.

  **Dr. Marcus Chen**: Precisely. And that is why the relationalist insists that physical reality is described up to isomorphism. The hole argument, in both smooth and discrete settings, reveals that the substantivalist is committed to haecceities. The relationalist avoids this by taking the relations as primary. In the discrete case, without a continuous metric, the hole argument doesn't create a problem for determinism because the automorphism group is discrete and generically trivial. But even when symmetries exist, they are part of the physical structure and do not generate indeterminism.

  **Dr. Lena Voss**: I concede that in the discrete case, without a smooth structure, the hole argument does not threaten determinism in the way it does in general relativity. However, it still highlights a metaphysical choice: whether we take the identity of events as primitive or not. The substantivalist may accept that isomorphic models represent the same physical reality, but then she must explain what the nodes are. If they are not individuated by their relations, then what? The relationalist avoids this by denying that nodes have any identity beyond their relational properties.

  So perhaps the hole argument, even in the discrete case, pushes us toward relationalism. But I still think there is a residual issue: the volume assignments are cardinalities, which are properties of sets. Sets have elements, and the elements must be distinct. So the distinctness of the elements is a primitive fact. How does the relationalist account for that?

  **Dr. Marcus Chen**: The distinctness is manifest in the count. We don't need to say which is which to know that there are two. The relations might not distinguish them, but that's fine. The physical fact is that there are two events with such-and-such relational properties. We don't need to assign them individual identities. The set is a collection of distinct entities, but their distinctness is primitive and does not require any further qualitative differentiation. The relationalist does not deny that there are distinct events; she denies that they have an identity independent of their relations. But their distinctness is part of the relational structure via the volume assignment.

  **Dr. Lena Voss**: I see. So the relationalist accepts primitive distinctness but rejects primitive identity. That is, there are distinct things, but we cannot say which is which unless they have different relational properties. And when they don't, we cannot and need not distinguish them. That seems coherent. Then the hole argument in the discrete case does not generate a problem for relationalism. But for substantivalism, it becomes a matter of ontological commitment without empirical consequences.

  **Dr. Marcus Chen**: Exactly. I think we've reached a point of agreement on the implications, even if we still differ on the metaphysics. Thank you for a stimulating discussion, Lena.

  **Dr. Lena Voss**: Likewise, Marcus. I think this has clarified the issues significantly.

  (The seminar moderator thanks both speakers and opens the floor to questions.)
answer: |-
  ### Seminar Dialogue: Discrete Hole Argument in Causal Set Theory

  **Setting:**  
  An advanced philosophy of physics seminar at a research university. Dr. Lena Voss (substantivalist) and Dr. Marcus Chen (relationalist) stand at the front of a room with a whiteboard displaying a causal set diagram—a finite partial order of nodes with cardinality-based volume assignments. The audience of graduate students and faculty leans forward attentively.  

  ---

  **Dr. Lena Voss (Substantivalist):** Thank you, Marcus, for setting up this causal set framework so clearly. To recap: spacetime is a locally finite partial order \((C, \prec)\), where nodes represent elementary events, and volume is given by cardinality. Now, consider a region \(H \subset C\)—an analog of Einstein’s "hole"—where we permute the labels of nodes within \(H\) while preserving all relational structure: the partial order \(\prec\) (causal relations), the volume assignments (via cardinality), and all relations to events outside \(H\). The result is two formally distinct labeled structures, \((C, \prec, l)\) and \((C, \prec, l')\), which agree on all relational properties outside and across \(H\), but differ in which labeled nodes occupy which positions inside \(H\).  

  This generates indeterminism: given fixed relational data outside \(H\), the laws—which only constrain \(\prec\) and cardinality—cannot determine which labeled configuration realizes \(H\). For the substantivalist, nodes have primitive identity, so these configurations represent distinct physical possibilities. Just as in the smooth-manifold hole argument, this exposes a redundancy: the physical state is underdetermined by the relations. But here, the redundancy stems from discrete label permutations, not continuous diffeomorphisms.  

  **Dr. Marcus Chen (Relationalist):** Lena, I appreciate the discrete recasting, but your argument smuggles in substantivalism from the start. In causal set theory, the physical facts are exhausted by the partial order and volume assignments—both of which are invariant under your permutation. The labels \(l\) and \(l'\) are representational artifacts; they don’t correspond to anything in the world. Without a metric field or diffeomorphism group, there’s no "hole" to worry about. The theory is complete: the partial order encodes causal relations, and cardinality encodes volume. Permuting labels while preserving these is just changing notation. There’s no indeterminism because there’s only one physical state.  

  But let me press you: why treat node labels as ontologically significant? Relationalism denies that nodes have identity beyond their relational properties. If two configurations agree on all relations—including causal links and volumes—they’re physically identical. Insisting otherwise implies a "haecceity" for nodes, a primitive "thisness" ungrounded in observable structure. That’s an ontological cost without empirical payoff.  

  **Dr. Lena Voss:** You’re right that relationalism rejects primitive identity, Marcus, but your dismissal assumes relational properties exhaust reality. Consider: cardinality-based volume assignments depend on counting distinct nodes. If nodes lack intrinsic identity, what grounds their distinctness? For example, if two nodes in \(H\) are causally indistinguishable (symmetric), relationalism says they’re identical in all properties. Yet, they contribute to volume—a region containing both has cardinality 2. If nodes aren’t primitively distinct, how do you explain the volume without implicitly relying on their individuality? Cardinality isn’t a "relation"; it’s a property of a set of distinct bearers. Your relational exhaustion seems to smuggle in a structural realism that can’t account for this.  

  **Dr. Marcus Chen:** A fair challenge. But cardinality isn’t a property of individual nodes; it’s a relational property of regions defined by causal horizons. Take an Alexandrov interval—events between fixed \(p\) and \(q\) in \(\prec\). Its volume is the count of events satisfying \(p \prec r \prec q\), fixed entirely by \(\prec\). Permuting labels within it doesn’t change the interval’s relational definition or its volume. Nodes are distinct solely because the structure has multiple entities, but their "distinctness" isn’t primitive—it’s derivative from the global pattern of relations. For instance, two symmetric nodes in \(H\) are distinct only because the volume of \(H\) is 2, which is a relational fact. No haecceities needed.  

  But let me turn this around: if nodes have primitive identity, what physical difference does your permutation make? Suppose \(H\) contains two causally symmetric nodes, \(a\) and \(b\). After permuting labels, \(a\) occupies \(b\)’s former relational position and vice versa. But since their relational profiles are identical, no observable change occurs. Why inflate ontology with indiscernible differences?  

  **Dr. Lena Voss:** The difference isn’t observable, Marcus, but it’s metaphysical. Substantivalism posits nodes as entities with persistent identity. Permuting labels tracks which entity occupies which relational role. Indeterminism arises because the laws don’t fix this mapping. Your appeal to "relational definition" of regions like Alexandrov intervals avoids labels but still relies on node individuality. Define an interval without referring to nodes: you’ll need to specify events \(p\) and \(q\) relationally, but \(p\) and \(q\) themselves require identification. If \(p\) outside \(H\) is fixed, but nodes inside \(H\) are permuted, the interval’s composition changes if we track node identity. For example, the set \(\{r \mid p \prec r \prec q\}\) differs if \(r\) is swapped with another node. But you’ll say relationalism doesn’t "track" individuals. So how does relationalism define regions without presupposing nodes as bearers?  

  **Dr. Marcus Chen:** Regions aren’t defined by node labels but by causal structure alone. Fix \(p\) and \(q\) via their causal relations to the rest of \(C\). For instance, \(p\) might be the unique event causally linked to some "reference" event outside \(H\). In generic causal sets, such relational fixes exist. Then, the interval \(\langle p, q \rangle\) is defined by \(\prec\), independent of labels. After a permutation in \(H\), the same set of nodes satisfies \(p \prec r \prec q\) because \(\prec\) is unchanged. The volume is invariant. There’s no ambiguity.  

  Your worry about node identity reveals a substantivalist commitment: you see nodes as atoms of spacetime with intrinsic identity. Relationalism sees them as positions in a causal network. Cardinality emerges from the network’s structure. If two configurations have isomorphic networks, they’re physically identical—full stop. The "indeterminism" you fear is just representational redundancy.  

  **Dr. Lena Voss:** Then let’s test "representational redundancy." Suppose the causal set is globally symmetric—say, a discrete analog of a Bianchi cosmology. Here, label permutations create isomorphic copies. Relationalism identifies them, denying any difference. But substantivalism sees distinct possibilities: the same relational structure instantiated by different individuals. Now, imagine a law-like process inside \(H\) that "selects" one node over another (e.g., a probabilistic event). If the nodes are symmetric, relationalism cannot distinguish outcomes. But substantivalism can: event X happening to node \(a\) versus \(b\) are different histories. Your relational exhaustion collapses distinct possibilities, risking a loss of physical nuance.  

  **Dr. Marcus Chen:** If the nodes are symmetric, Lena, there is no physical difference between "X happening to \(a\)" or "to \(b\)." Any probabilistic law must respect the symmetry, so outcomes are identical. Insisting on a difference is unphysical—it adds nothing to prediction or explanation. Relationalism avoids this by treating isomorphic structures as identical. Cardinality is no exception: it’s fixed by the structure, not by labeling. The discrete hole argument, by lacking continuous symmetries, actually strengthens relationalism. Without diffeomorphisms, the only "redundancy" is in our labels, not in the world. The ontology is lean: causal relations + volume. Anything more is metaphysics untethered from physics.  

  **Dr. Lena Voss:** I see we’ve hit bedrock. For you, relations and volumes exhaust physical reality; for me, they require bearers. The discrete hole argument clarifies this divide: it strips away the machinery of manifolds but leaves the core metaphysical choice intact. Perhaps we agree that in causal set theory, relationalism avoids indeterminism—but at the cost of reducing nodes to structural roles. I’ll maintain that this can’t ground cardinality without circularity. But I concede your point about symmetries: if physics can’t distinguish them, why should metaphysics?  

  **Dr. Marcus Chen:** And I’ll grant that substantivalism offers a coherent alternative, even if I find it ontologically profligate. The discrete setting does sharpen the debate—no smooth symmetries to obscure the core issue. Thank you, Lena, for a rigorous engagement.  

  *(The moderator signals the end of the dialogue. The audience applauds, and the seminar moves to Q&A.)*  

  ---  
  **Key Elements Addressed:**  
  - **Discrete Hole Argument**: Voss’s permutation of node labels in a fixed relational/volumetric structure, contrasting with Einstein’s smooth version.  
  - **Chen’s Direct Response**: Relational exhaustion—no physical "hole" without diffeomorphisms; labels are representational.  
  - **Substantive Turns**:  
    1. Voss on cardinality requiring distinct bearers → Chen on volume as relational property of regions.  
    2. Chen on observability → Voss on metaphysical identity in symmetries.  
    3. Voss on individuation in probabilistic contexts → Chen on symmetry as physical fact.  
  - **Rigor**: Both engage the discrete framework; no strawmanning. Chen avoids manifold-based arguments; Voss adapts substantivalism to causal sets.  
  - **Metaphysical Core**: Primitive identity (Voss) vs. structural exhaustion (Chen), with cardinality as the battleground.
