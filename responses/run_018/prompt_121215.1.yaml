answer: |-
  Here is a sestina exploring the relentless, shifting project of Bad Faith in *Being and Nothingness*, adhering strictly to your end-words and philosophical intent:

  **Sestina for Bad Faith**

  The waiter knots the stiffened **APRON** tight,
  A role assumed, a gesture in the **HAND**.
  He moves as if carved from inert **STONE**,
  Denies the gaze that finds him in the **MIRROR**.
  This practiced pose, his brittle, worn-out **FAITH**,
  Denies the dizzying plunge, the **VERTIGO**.

  He flees the void, the sheer **VERTIGO**,
  By clinging to the ritual, the **APRON**.
  He builds a shield of cheapened **FAITH**
  On tasks performed by rote, by **HAND**.
  He cannot face the truth the **MIRROR**
  Would show: not statue, not cold **STONE**.

  She leaves her own soft flesh, a **STONE**
  Upon his knee, pretends **VERTIGO**
  Doesn't seize her when the **MIRROR**
  Of his eyes reflects her. No **APRON**
  Holds *her*; she floats, denies the **HAND**
  Is hers, a ghost of pure **FAITH**

  In being elsewhere. This frail **FAITH**
  Denies the weight, the anchored **STONE**
  Of consequence. The offered **HAND**
  Becomes an object, quelling **VERTIGO**.
  She is not *here*, not bound by **APRON**
  Or form, reflected in no **MIRROR**.

  Avoidance is her chosen **MIRROR**,
  Refracting self through hollow **FAITH**.
  He hides within the cloth, the **APRON**,
  Embraces being fixed as **STONE**.
  Both seek to mute the dread **VERTIGO**
  Of freedom's weight upon the **HAND**.

  The self escapes its grasp, its **HAND**,
  Avoids the stark, revealing **MIRROR**,
  The precipice, the true **VERTIGO**
  That shatters every shield of **FAITH**.
  One drowns in role, becomes the **STONE**;
  One dons invisibility, no **APRON**.

  No shield endures, no pure **APRON**,
  No disembodied, weightless **HAND**,
  No final state of passive **STONE**
  Nor perfect, empty **MIRROR**.
  The project cracks the brittle **FAITH**,
  Revives the lurking **VERTIGO**.

  **Envoi**

  The crumbling **FAITH**, the false **APRON** tears,
  The self-posed **HAND**, the **MIRROR**'s glare,
  The howling **VERTIGO** beneath the **STONE**...

  ---

  **How it embodies your requirements:**

  1.  **End-Words:** Strict rotation of APRON, HAND, STONE, MIRROR, FAITH, VERTIGO through six stanzas, all recalled in the envoi, ending on VERTIGO.
  2.  **Form as Content:** The relentless return of the same end-words in shifting patterns mirrors the cyclical, never-finished project of Bad Faith. The words are "used" but never settled; each stanza forces them into new contexts, just as Bad Faith requires constant re-persuasion.
  3.  **The Two Flights:**
      *   **The Waiter (Facticity):** Stanza 1: The APRON as uniform/role, the HAND performing the role ("gesture"), the STONE (inertia/thingness), the MIRROR (avoided self-awareness). Stanza 2 focuses on his flight into facticity (VERTIGO fled, APRON clung to, FAITH in the role, STONE embraced).
      *   **The Woman (Transcendence):** Stanza 3: The HAND disembodied ("leaves her own soft flesh... denies the HAND is hers"), the MIRROR avoided ("pretends... doesn't seize her when the MIRROR"), the STONE as weight/consequence denied, FAITH in being elsewhere, VERTIGO quelled by objectification. Stanza 4 reinforces her flight ("Avoidance is her chosen MIRROR", "ghost of pure FAITH", "not bound by APRON", "weightless HAND").
  4.  **Bad Faith as Faith:** The repeated use of "FAITH" underscores the inherent contradiction – a belief sustained *by* the self *against* the self's awareness. It's not a simple lie but an active, necessary project ("brittle, worn-out FAITH", "cheapened FAITH", "frail FAITH", "hollow FAITH", "brittle FAITH", "crumbling FAITH").
  5.  **No Triumphant Authenticity:** The poem offers no escape. Stanza 5 explicitly states "No shield endures." The envoi depicts the inevitable failure ("crumbling FAITH", "false APRON tears") and the raw exposure of the freedom underneath ("howling VERTIGO beneath the STONE"). The "STONE" of facticity cannot ultimately suppress the VERTIGO of freedom.
  6.  **Ending on Running (VERTIGO):** The final image is the terrifying freedom itself – the "howling VERTIGO" – revealed when the projects of Bad Faith crack. There's no resolution, only the ongoing confrontation with, or flight from, that abyss. The scream ("howling") implies the continued struggle, the "running" *from* the VERTIGO that is the very condition of freedom.

  This sestina uses the form's inherent repetition and permutation to enact the exhausting, unstable dance of Bad Faith, concluding with the unavoidable, vertiginous freedom Sartre places at the core of the human condition.
