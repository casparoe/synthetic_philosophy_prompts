  **Key Rationale Notes:**  
  - **Ease of Inflation (0.85):** The design invites exploitation (e.g., timing chores as "reading"). Physical verification of reading is impractical, making low-effort gaming inevitable.  
  - **Incentive Strength (0.75):** Stipends/funding cuts target adults who influence student behavior, creating top-down pressure to tolerate or encourage inflation.  
  - **Oversight Failure (0.90):** Audits require observing reading *in real-time* to confirm legitimacy—a logistical hurdle districts rarely overcome. Norms against gaming weaken when pay is at stake.  
  - **Gaming Dominance (0.70):** Initial enthusiasm may boost real reading, but gaming is more sustainable; by Year 2, it likely drives most gains as effort plateaus and workarounds proliferate.  
  - **Safeguard (0.40):** Comprehension checks help, but if infrequent or predictable, students can cram/spoof answers. The core incentive to inflate minutes remains, so gaming shifts to "reading summaries" instead of books.  
  - **Adjustment to 0.70:** Multiplicative model (0.40) underweights systemic risk—empirical studies (e.g., Campbell's Law) show metrics-based incentives *routinely* corrupt outcomes.
