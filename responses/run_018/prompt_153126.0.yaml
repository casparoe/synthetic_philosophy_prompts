answer: |-
  ### Example: Clinical Treatment Selection for Chronic Pain

  **Domain:** A patient with chronic pain is choosing among three treatment options (A, B, C) with stable physical outcomes. Each treatment is defined by two features:  
  - **Pain Relief (PR):** Short-term reduction in pain (measured on a scale of 1–10).  
  - **Side Effects (SE):** Long-term risk of gastrointestinal issues (measured as "Low," "Medium," or "High" risk).  

  **Stable Utility Function:**  
  The patient has a stable, transitive utility:  
  \( U(\text{PR}, \text{SE}) = \text{PR} - 2 \times (\text{SE risk weight}) \),  
  where SE risk weights are: Low = 1, Medium = 2, High = 3.  
  Thus:  
  - **Treatment A:** PR = 8, SE = Low → \( U_A = 8 - 2 \times 1 = 6 \)  
  - **Treatment B:** PR = 7, SE = Medium → \( U_B = 7 - 2 \times 2 = 3 \)  
  - **Treatment C:** PR = 5, SE = High → \( U_C = 5 - 2 \times 3 = -1 \)  

  True ranking: \( A \succ B \succ C \) (transitive).  

  ---

  ### Three-Stage Choice Sequence

  #### **Stage 1: Choice between A and B**  
  - **Information Received:** A medical pamphlet emphasizes *"immediate pain reduction is critical for functional recovery."*  
  - **Salience Shift:** Pain Relief (PR) becomes the *only* relevant feature. SE is ignored.  
  - **Comparison:**  
    - A: PR = 8  
    - B: PR = 7  
  - **Choice:** \( A \succ B \) (since 8 > 7).  

  #### **Stage 2: Choice between B and C**  
  - **Information Received:** A news report warns, *"long-term side effects of painkillers lead to hospitalizations."*  
  - **Salience Shift:** Side Effects (SE) become the *only* relevant feature. PR is ignored.  
  - **Comparison:**  
    - B: SE = Medium  
    - C: SE = High  
  - **Choice:** \( B \succ C \) (since Medium risk < High risk).  

  #### **Stage 3: Choice between C and A**  
  - **Information Received:** A clinical trial summary states, *"treatments with similar pain relief profiles show divergent side effects."*  
  - **Salience Shift:** *Relative improvement* in SE becomes salient. SE is compared *only relative to the alternative*, while PR is ignored.  
  - **Comparison:**  
    - C: SE = High (worse than A)  
    - A: SE = Low (better than C)  
    - *But* the information frames SE as a "reduction from baseline risk." The patient misinterprets:  
      - A reduces SE from "baseline High" to Low → **ΔSE = \(-2\)** (Large reduction).  
      - C reduces SE from "baseline Extreme" to High → **ΔSE = \(-1\)** (Smaller reduction).  
    - **Non-Bayesian Update:** The patient (falsely) believes C’s SE reduction is *more impressive* because it starts from a "worse baseline" (a focusing illusion).  
  - **Choice:** \( C \succ A \) (erroneously prioritizing perceived SE improvement).  

  ---

  ### Cyclical Pattern  
  1. Stage 1: \( A \succ B \)  
  2. Stage 2: \( B \succ C \)  
  3. Stage 3: \( C \succ A \)  

  **Why No Intransitivity/Framing/Menu Dependence?**  
  - **Stable Utility:** \( U(A) = 6 \), \( U(B) = 3 \), \( U(C) = -1 \) (transitive).  
  - **Physical Outcomes Unchanged:** Treatments have fixed PR/SE attributes.  
  - **No Framing/Menu Effects:** Choices are pairwise with no irrelevant options.  
  - **Non-Bayesian Update:** The patient misattributes "baseline risk" at Stage 3, altering *perceived relevance* of SE without new data.  

  ---

  ### Revealed-Preference Misdiagnosis  
  A revealed-preference analyst assumes choices reflect preferences over *final bundles* (PR, SE) independently of context. They observe:  
  - \( A \succ B \) → Infer \( U_A > U_B \)  
  - \( B \succ C \) → Infer \( U_B > U_C \)  
  - \( C \succ A \) → Infer \( U_C > U_A \)  

  **Conclusion:** The analyst diagnoses an intransitive cycle (\( A \succ B \succ C \succ A \)) and attributes it to irrational preferences.  

  **Actual Cause:**  
  The cycle arises from **shifts in attribute salience** driven by non-Bayesian updates:  
  - Stage 1: Only PR matters.  
  - Stage 2: Only SE matters.  
  - Stage 3: Misperceived SE improvement matters.  

  The analyst conflates the *structural effect of information* (changing which features are compared) with the *agent’s utility*. They mistake contextual noise for preference instability, failing to see the stable \( A \succ B \succ C \) ranking.  

  **Key Insight:** Revealed preference theory incorrectly assumes choices are context-independent. Here, the *comparison process* (not utility) drives the cycle, illustrating how choice environments can mask true preferences.
