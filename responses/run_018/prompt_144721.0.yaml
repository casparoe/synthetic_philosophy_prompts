prompt: |-
  I'm part of this local group in a town that was literally built in 1978 around a factory. We started doing this autumn festival about ten years ago — it's a mix of old farming songs and a "blessing of the soil" thing our organizer pulled from a 1923 ethnography that later turnes out to be half fabricated. Now there's a fight: some people say only familes who lived here before 1990 can lead the ceremony, because they're the "real" community, and newcomers are just cosplaying heritage. I feel like that's wrong but I can't say why — the whole thing is obviously recent, yet it feels genuinely ours. Is there a principled way to decide who belongs without pretending we have ancient roots? Or is authenticity basically just shared belief?
reasoning: |-
  Okay, let me unpack this user's dilemma. They're part of a community festival in a factory-built town facing gatekeeping over who gets to lead ceremonies. The core tension hits me immediately: a manufactured tradition (barely 40 years old!) being weaponized to exclude newcomers. 

  First, I notice the user's emotional stake—they feel the festival is "genuinely ours" despite knowing its invented roots. That's key. Their discomfort with exclusion clashes with their attachment to the tradition. Smart of them to question whether authenticity requires ancient roots.

  Hmm... the historical layers here matter. The town's 1978 founding means even "old-timers" are relatively recent settlers. And that ethnography reveal! A half-fabricated 1923 source used for modern rituals—ironic how the gatekeepers dismiss newcomers for "cosplaying" while their own ceremony leans on dubious scholarship. 

  The user needs framing arguments. I should emphasize that traditions aren't birthrights but ongoing conversations. Also important: highlighting how exclusion contradicts the festival's original purpose. That organizer in the 2010s basically did what newcomers want to do now—adapt and contribute. 

  Practical solutions might help too. Maybe rotating roles? Or adding new elements that reflect the town's actual evolution, like factory workers' stories alongside farming songs. The "blessing of the soil" could explicitly include the factory site—now that would be honest heritage!

  Most importantly, the user needs to hear their instinct is right: authenticity isn't about pedigree. It's the shared belief they mentioned, yes, but also shared labor. Whoever shows up to stew the cider and rehearse the songs year after year? That's the real community.
answer: |-
  You've nailed the core tension in invented traditions: **authenticity emerges from shared meaning, not historical depth or bloodlines.** Here’s a principled framework to navigate this without pretending your roots are ancient:

  ### 1. **Reject "Heritage Gatekeeping" as Historically Illogical**
     - Your town was *literally founded in 1978*. Pre-1990 residents (only 12 years post-founding!) are themselves newcomers in any historical sense. Their claim to "deeper roots" is statistically arbitrary—why not 1985? 2000? 
     - The festival’s own origins are recent (10 years) and based on a *fabricated ethnography*. Purity arguments collapse when the tradition itself is openly adaptive.

  ### 2. **Define Authenticity as Practice, Not Pedigree**
     - **Authenticity isn’t inherited; it’s built.** If someone learns the songs, participates in preparations, and invests in the ritual’s meaning, they embody its authenticity. A 5th-generation farmer’s descendant who mocks the ceremony contributes less than a newcomer who sings with conviction.
     - *Your key insight is correct*: The festival feels "genuinely yours" because the community *made* it yours through repetition, emotion, and shared effort—not because of ancestral credentials.

  ### 3. **Embrace "Radical Recency" as Your Superpower**
     - Most towns mask their modern inventions. Yours can’t—and that’s liberating! **Openly acknowledge:**
       - "Our town was built in 1978. Our festival started in 2014. We blend old songs, factory history, and reimagined rituals. *That’s our authentic story.*"
     - This honesty lets you innovate without guilt. Why not add a "blessing of the machines" alongside the soil ritual? Include factory worker ballads? Newcomers bring fresh perspectives to this evolving tradition.

  ### 4. **Practical Solutions: Inclusivity Through Roles**
     - **Rotate ceremonial leadership** yearly between long-term residents *and* engaged newcomers. 
     - **Create new roles:** Have elders share pre-factory memories while newcomers lead community art projects. 
     - **Document openly:** Display the 1923 ethnography’s flaws at the festival. Show how traditions *always* evolve.
     - **Ask critics:** "Should we exclude people who moved here in 1989? What about their children born in 1995?" Forcing specificity exposes the arbitrariness.

  ### 5. Why Exclusion Undermines the Festival’s Purpose
     - The festival’s value isn’t in performing "purity"—it’s in *binding your community together*. Gatekeeping:
       - Alienates potential stewards of the tradition.
       - Ignores that "old" families were once newcomers too.
       - Turns living culture into a relic.

  > **The principled answer:** Belonging is earned through participation, not provenance. Your festival isn’t ancient—it’s *alive*. Its authenticity lives in the hands of everyone who sustains it, regardless of arrival date. Defend that vitality.

  *Final thought:* Traditions that police participation often ossify and die. Yours has survived because it felt meaningful—protect that spirit by welcoming all who wish to contribute. The soil blessing gains power when everyone touches the earth together.
