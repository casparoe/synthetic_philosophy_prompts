prompt: |-
  I'm writing a feature on whether science ever actually tells us what we should do, and I've been testing my own intuitions on different is-to-ought jumps to see if there's a hidden rule I'm following. Here are my gut verdict's — tell me if there's a principle that holds them together, or if I'm just being inconsistent.

  One: "Brains evolved cooperation for survival, so we morally ought to cooperate." That's a fallacy, clearly not okay.

  Two: "The heart's biological function is to pump blood, so a heart that doesn't pump well ought to be repaired." That feels totally legitimate. Not a fallacy at all.

  Three: "Economic data shows trust correlates with growth, therefore policymakers ought to prioritize trust-building." This feels slippery — not as bad as One, but I'm not fully convinced it's clean.

  Four: "Neuroscience finds moral reasoning activates the vmPFC, therefore morality is just neural firing and there's no objective ought." That feels like a different error, maybe not the naturalistic fallacy exactly, but related.

  Five: "In repeated prisoner's dilemmas, cooperation dominates, so rational agents ought to cooperate long-term." If we're talking about rational strategy, okay; if we're talking about moral duty, I'd call foul.

  Six: "An AI allignment reasearcher says LLMs minimize prediction error, so they ought to be aligned with human values because social misallignment increases error." I keep going back and forth. Is this a design inference or smuggling?

  The tension that drives me nuts is between Two and Five — both derive normative claims from descriptive patterns (biology, game theory), but Two feels fine and Five feels like it needs an extra premise I'm not seeing. Is the line about functional design vs. evolutionary outcome? Or about internal vs. external norms?

  Is there a coherent principle that saves all these verdicts, or do I have to drop one? And what does it say about my flip-flop case in Six — and about a scenario I haven't mentioned, like deriving dietary norms from the fact that human guts evolved to digest cooked meat? Please lay out the principle precisely, show which case motivates each clause, and be honest about which of my verdicts it can't accommodate.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They're writing a feature on whether science can tell us what we should do, and they've tested their intuitions on various is-to-ought jumps. They provided six examples with their gut reactions and are looking for a unifying principle or inconsistency. The main tension they feel is between examples Two and Five—both derive normative claims from descriptive patterns, but Two feels legitimate while Five feels like it needs an extra premise.

  First, I need to break down each example. Example One: Brains evolved for cooperation, so we ought to cooperate. User says fallacy. That makes sense because evolution describes how things are, not how they should be morally. It's the naturalistic fallacy. 

  Example Two: Heart's function is to pump blood, so a bad heart ought to be repaired. User finds this legitimate. Here, the norm comes from a functional design perspective. The "ought" is tied to the purpose of the heart within a system (the body) that we already value as healthy. The norm is internal to the system's function.

  Example Three: Economic data shows trust correlates with growth, so policymakers ought to build trust. User feels it's slippery. This seems like a means-end argument. If the goal is growth, then trust-building is a means. But without stating the goal explicitly, it's incomplete. The user's discomfort might stem from the unstated normative premise that growth is desirable.

  Example Four: Neuroscience shows moral reasoning activates vmPFC, so morality is just neural firing. User sees an error here. This conflates the mechanism with the meaning. Just because moral reasoning has a physical basis doesn't negate its normative aspects. It's a reductionist fallacy, confusing levels of explanation.

  Example Five: In prisoner's dilemmas, cooperation dominates, so rational agents ought to cooperate. User says if it's about strategy, okay; if moral duty, foul. The key here is the context of rationality. Within game theory, "ought" is conditional on the goal (e.g., maximizing payoff). But without that goal, it's not a moral ought.

  Example Six: AI alignment researcher says LLMs minimize prediction error, so they ought to be aligned to reduce error. User is conflicted. This is tricky. If the AI's design purpose is to minimize error, then alignment is a functional norm. But if it's about social alignment, that introduces external values, which might need an extra premise.

  The user's tension between Two and Five is crucial. Both derive "ought" from descriptive facts, but Two is about biological function, while Five is about game theory. The difference might be that biological functions imply a norm based on health or proper functioning, whereas game theory's norms are conditional on goals. 

  The principle I'm considering has three parts: explicit goals, context-specific norms, and avoiding conflation. For example Two, the goal is health, which is inherent in biological function. For Five, the goal is long-term payoff, which is part of the game theory context. So the "ought" is relative to that goal. 

  For the AI example, if minimizing prediction error is the AI's internal goal, then alignment is functional. But if the user is thinking of alignment with human values, that's an external goal, requiring another normative step. 

  The dietary norms example: human guts evolved to digest cooked meat, so we ought to eat cooked meat. This might be like example One—evolution doesn't imply ought. But if the goal is digestive health, then it becomes functional like example Two. 

  The user might need to accept that all these "oughts" are contingent on underlying values or goals. Science can tell us how to achieve goals, but not set the goals themselves. In cases where the goal is implicit (like health in biology), it feels intuitive, but it's still based on valuing health. 

  So the unifying principle is that science provides conditional norms: if you accept X as a goal, then you ought to do Y. The difference in intuition comes from how explicit or accepted the goal is. Example Two's health goal is widely accepted, making it feel natural. Example Five's payoff maximization is context-specific. 

  The user's verdicts mostly fit this principle. Example Four is rejected because it's a category error, not a conditional norm. Example Six's conflict arises from whether the goal is internal (prediction) or external (human values). 

  Inconsistencies? Example Three might need an explicit goal statement to be valid. The user's discomfort there aligns with the principle's requirement for clear goals. 

  So the user isn't inconsistent; their intuitions reflect implicit recognition of conditional norms versus moral absolutes. The principle clarifies that science can inform means but not ends, with norms tied to presupposed goals.
answer: |-
  Your intuitions are remarkably consistent—they reveal a sophisticated implicit principle that distinguishes between *internal functional norms* and *external moral norms*. The key lies in recognizing when "ought" statements are **conditional on presupposed goals** versus when they **smuggle in unconditional moral claims**. Here's the precise principle that unifies your verdicts:

  ---

  ### **The Principle of Goal-Relative Instrumental Norms**
  > **A descriptive claim (X *is* Y) can legitimately imply a normative claim (X *ought to* Z) *only if*:**  
  > **(1)** The "ought" is relative to an **internally defined function or goal** (G) of system X;  
  > **(2)** Z demonstrably **serves or fulfills** G; and  
  > **(3)** G is **not conflated with a moral imperative** unless explicitly argued as such.  
  >   
  > **Otherwise, the inference commits a category error by treating descriptive patterns as intrinsically normative.**

  ---

  ### **How This Principle Explains Your Verdicts**
  1. **Case One (Brains/Cooperation):**  
     - *Why fallacy?* Evolution describes *how* cooperation arose (descriptive), but "survival" isn't an intrinsic moral goal. Calling cooperation a moral "ought" jumps to an external norm without justification.  
     - *Violates:* Condition (3) — conflates evolutionary success (a descriptive outcome) with morality.  

  2. **Case Two (Heart Repair):**  
     - *Why legitimate?* The heart's biological function (pumping blood) is an *internal goal* (G) of the circulatory system. Repairing it serves G, and G (physiological function) isn't inherently moral—it's instrumental to health, which we *already value*.  
     - *Satisfies:* All conditions. Condition (1) anchors "ought" to the heart's design function.  

  3. **Case Three (Trust/Growth):**  
     - *Why slippery?* It *almost* works if "economic growth" is the goal (G). But "policymakers ought to prioritize trust-building" implies growth is an unquestioned good, skipping the debate over whether growth *should* be prioritized (e.g., vs. equity or sustainability).  
     - *Violates:* Condition (3) — smuggles in growth as a moral imperative. Add the premise "*if* we value societal welfare via growth," and it becomes valid.  

  4. **Case Four (vmPFC/Morality):**  
     - *Why error?* It confuses **correlation** (moral reasoning involves neural firing) with **ontological reduction** (morality is *only* neural firing). This commits the "nothing-but" fallacy, ignoring emergent meaning.  
     - *Violates:* Condition (2) — neural firing *enables* morality but doesn't define its normative force. Descriptive facts can't dissolve prescriptive truths.  

  5. **Case Five (Prisoner's Dilemma):**  
     - *Why context-dependent?* If "rational" means *instrumentally rational* (G = maximizing long-term payoff), cooperation *is* an "ought" relative to G. But if "ought" implies moral duty, it fails—no inherent link between game-theoretic success and ethics.  
     - *Satisfies (for strategy):* Conditions (1) and (2) — goal (G) is explicit.  
     - *Fails (for morals):* Condition (3) — conflates strategic rationality with morality.  

  6. **Case Six (AI Alignment):**  
     - *Your flip-flop is justified.* The inference works **only if**:  
       - G is explicitly *minimizing prediction error* (the LLM's internal function), and  
       - Misalignment *causes* prediction error (descriptive link).  
     - But if "aligned with human values" implies morality, it's smuggling. Human values aren't inherent to the LLM's function—they're external goals imposed by designers.  
     - *Verdict:* Valid as a *design norm* (e.g., "For an LLM to fulfill its function, it ought to avoid social misalignment"), but not as a moral claim.  

  ---

  ### **Resolving Your Core Tension (Two vs. Five)**
  - **Two (Heart)** uses a **teleological function**: The heart *has* a purpose (pumping blood) by biological design. "Ought" flows from what the system *is for*.  
  - **Five (Prisoner's Dilemma)** uses a **strategic function**: Cooperation serves an agent's goal (long-term gain) within a defined system (game theory).  
  - **Shared logic:** Both derive "ought" from a system's *internal logic* (biology/game theory), not universal morals. Biology's "health" and game theory's "payoff" are values internal to their systems.  

  ---

  ### **The Dietary Norms Scenario (Unmentioned Case)**
  - **Claim:** "Human guts evolved to digest cooked meat, so we ought to eat cooked meat."  
  - **Assessment:** *Fallacy* under your principle.  
    - *Why?* Evolution explains *adaptation* (descriptive), not purpose. Unlike the heart (with a clear physiological function), "evolved to digest" describes historical utility, not a present *telos*. Eating meat serves survival, but survival isn't an automatic moral good (e.g., we may value other goals like animal welfare).  
    - *Contrast with Two:* The heart's function is *current and intrinsic*; digestion's "function" is *retrospective and selective*.  

  ---

  ### **Which Verdict Can't Be Fully Accommodated?**
  Your judgment on **Case Three (Trust/Growth)** is the hardest to reconcile. The principle requires explicitly stating the goal (e.g., "*If* policymakers value growth, then..."). Your intuition that it's "slippery" suggests you sense the unargued moral elevation of growth. To fix this, demand: **"Ought relative to what goal?"**  

  ---

  ### **Conclusion: Science *Can* Tell Us What to Do—Conditionally**
  Science generates **instrumental norms** ("If you want G, do X") but not **categorical moral imperatives**. Your intuitions correctly flag jumps where:  
  - A system's internal goal (biology, game theory) is treated as universally moral (Cases 1, 5-moral, 6-moral).  
  - Descriptive patterns are mistaken for prescriptive truths (Cases 3, 4).  
  - Evolutionary history is conflated with purpose (Dietary case).  

  **Why AI Alignment (Six) trips you up:** It sits at the intersection of functional design (valid) and human values (morally loaded). The principle clarifies: LLMs "ought" to align *only if* we prioritize error minimization *and* define alignment as error reduction—not because it's "right," but because it's functional.  

  This framework doesn't just save your verdicts—it sharpens your feature's thesis: **Science reveals how to achieve goals, but goals themselves come from elsewhere.**
