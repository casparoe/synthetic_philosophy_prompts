  - Introduction and explanation of the rules: 10 minutes
  - Round One: 10 minutes (record P_now, P_pred, and place bet)
  - Collection of Round One materials by facilitator: 5 minutes (while facilitator distributes the envelopes)
  - Round Two: 10 minutes (open envelope, read evidence, record P_actual)
  - Collection of Round Two materials: 5 minutes
  - Scoring and revelation of predictions: 20 minutes (this is where the tension is revealed)
