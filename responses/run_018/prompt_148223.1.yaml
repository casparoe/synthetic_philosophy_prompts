    Then the facilitator matches the Round One and Round Two sheets by ID. For each, compute:

        win = 1 if |P_actual - P_pred| <= 0.1, else 0

    Then, prepare a display (on a whiteboard or projected) with the following columns for each ID:

        ID, P_now, P_pred, Bet, P_actual, Win? (Yes/No)

    Initially, do not show the frame.

    Then, during the 15-minute revelation:

    "Here are the results. Let's look at the predictions and outcomes. Notice how many of you won the bet. What patterns do you see? Why do you think some won and some lost?"

    Let them discuss for 5-10 minutes.

    Then reveal the frame:

    "Now, I will add one more piece of information. Some of you received the evidence in a positive frame and some in a negative frame. The positive frame was: 'The vaccine has been tested on 1000 children and 950 showed no adverse effects.' The negative frame was: 'The vaccine has been tested on 1000 children and 50 showed adverse effects.'"

    Mark on the table for each ID which frame they had.

    "Now, let's compute the average P_actual for the positive frame group and for the negative frame group."

    Compute and note the difference.

    "What does this tell us about the effect of the frame? And why was it hard to predict your own future belief?"

    Then move to the debrief.

    Debrief (30 min):

    - Start by stating the reflection principle: Your current credence in a proposition should equal your expectation of your future credence in that proposition.

    - Explain that in the activity, the future credence was random because it depended on the frame (which was assigned randomly). So the expectation was an average over the two frames.

    - But note: when setting P_pred, they set a single number. If they set it to the expectation (which is P_now, if they believed the bias would average out) then the actual future credence would be either higher or lower than that expectation. Therefore, unless the bias was very small, they were likely to be outside the band around the prediction.

    - The principle does not require that the future credence is close to the current one, only that it is centered on it. The bet, however, required closeness.

    - This is why reflection feels uncomfortable: we want our future beliefs to be close to our current ones (especially when we are rational), but when we anticipate irrationality, we expect our future beliefs to be scattered.

    - Also, note that some participants might have tried to pre-correct. For example, they thought: 'I know I'm susceptible to the negative frame, so if I see the negative frame I will discount it.' But then, if they saw the negative frame and failed to discount it, they updated too much. Or if they saw the positive frame and overcorrected, they updated too little. So they might have set P_pred to the rational update (say 0.75) but then updated to 0.6 (if they saw the negative frame and failed to correct) which is 0.15 off, so they lose.

    - What we cannot capture: 
          - The reflection principle is about continuous time and probabilistic coherence over time. We have a one-shot update.
          - We assume perfect self-knowledge about the existence of the bias, but not about the magnitude. In reality, we might not even know about the bias.

    - Finally, note that the activity highlights a challenge for reflection: when we know we will be irrational in the future, how should we set our current beliefs? Should we set them to what we think we should believe in the future (the rational update) or to what we think we will believe? And if we set them to what we think we will believe, then we are endorsing a belief that we know is biased.

    - This is a deep problem in epistemology and decision theory.

    End with open discussion.

    This should meet the requirements.
answer: |-
  Below is a comprehensive design for a 90-minute classroom simulation focused on Van Fraassen's Reflection principle, incorporating your requirements for tangible stakes, hidden information, and experiential tension around anticipating biased evidence. The activity uses a **vaccine safety claim** with a **framing effect** (positive/negative wording of identical statistics) as the bias trigger.

  ---

  ### **Activity Title: The Framed Vaccine Dilemma**

  #### **Learning Goal**  
  To viscerally experience the conflict between current credences, anticipated future credences, and known susceptibility to cognitive bias, revealing tensions in Reflection (current credence \(P_t(A)\) should equal expected future credence \(\mathbb{E}[P_{t+\Delta t}(A)]\)).

  #### **Materials**  
  - 12 envelopes (6 marked 🔵 blue dot, 6 marked 🔴 red dot)  
  - 12 evidence cards (6 with **positive frame**, 6 with **negative frame**; see *Twist* below)  
  - Tokens (e.g., poker chips): 5 per participant + 20 extra for the pool  
  - Timer  
  - Whiteboard for recording results  
  - Participant worksheets (Round 1 and Round 2)  

  ---

  ### **Step-by-Step Instructions**  
  **Total Time:** 90 minutes  

  #### **0. Setup (5 min)**  
  - Arrange seats so participants cannot see others’ worksheets.  
  - Place 5 tokens at each seat.  
  - Pool: Add 20 tokens to a central bowl (rewards for betting).  

  #### **1. Introduction (10 min)**  
  *Facilitator Script:*  
  > “Today, we’re simulating belief updating with a real-world scenario. The claim is: **‘Vaccine X is safe for children.’**  
  > - You’ll first record your *current* confidence in this claim.  
  > - Then, you’ll predict your *future* confidence after seeing new evidence.  
  > - You’ll bet tokens on whether your actual updated confidence will match your prediction.  
  > - **Critical warning:** The evidence is presented in a way that may trigger a *framing effect*. Studies show even experts are swayed by positive/negative wording of identical facts. You know you’re susceptible but haven’t corrected for it.  
  > - Goal: Maximize tokens. Bets pay 2:1 if you win.”  

  **Rules Summary (on whiteboard):**  
  - **Credence:** Probability (0–1) of the claim being true.  
  - **Bet:** Wager 0/1/2 tokens that actual credence (Round 2) is within ±0.1 of predicted credence.  
  - **Reward:** Win → double your bet (e.g., bet 1, win 2). Lose → lose bet.  

  ---

  #### **2. Round 1: Predictions and Bets (15 min)**  
  *Materials:*  
  - **Worksheet 1** (private): Records current credence (\(P_\text{now}\)), predicted future credence (\(P_\text{pred}\)), bet (0/1/2 tokens).  
  - Envelopes distributed (random 🔵 or 🔴; participants *don’t know* dots mean yet).  

  *Tasks:*  
  1. Write \(P_\text{now}\): Current credence in “Vaccine X is safe.”  
  2. Write \(P_\text{pred}\): Predicted credence *after* seeing evidence.  
  3. Bet 0/1/2 tokens on \(|P_\text{actual} - P_\text{pred}| \leq 0.1\).  
  4. Seal Worksheet 1 in envelope.  

  *Facilitator:*  
  - Emphasize: “You know the evidence may be *framed* to bias you. Account for this in your prediction.”  
  - Collect envelopes immediately.  

  ---

  #### **3. Round 2: Evidence and Update (15 min)**  
  *Twist:*  
  - 🔵 **Blue envelopes** → Positive-framed evidence.  
  - 🔴 **Red envelopes** → Negative-framed evidence.  
  - *Identical statistics*, opposite framing:  
    - **Positive Frame:** “Vaccine X was tested on 1,000 children. **950 showed no adverse effects.**”  
    - **Negative Frame:** “Vaccine X was tested on 1,000 children. **50 showed adverse effects.**”  

  *Materials:*  
  - Return envelopes to participants (they see 🔵/🔴 dot now).  
  - **Worksheet 2:** Records actual credence (\(P_\text{actual}\)) after seeing evidence.  

  *Tasks:*  
  1. Open envelope, read evidence.  
  2. Update credence → record \(P_\text{actual}\).  
  3. Hold Worksheet 2 (don’t share yet).  

  ---

  #### **4. Scoring and Revelation (20 min)**  
  *Facilitator Actions:*  
  1. **Public Results Table (whiteboard):**  
     | ID | Dot | \(P_\text{now}\) | \(P_\text{pred}\) | Bet | \(P_\text{actual}\) | Win? |  
  2. **Reveal Frame Meaning:**  
     - “🔵 = Positive frame, 🔴 = Negative frame. Identical data, different wording.”  
  3. **Compute Wins:**  
     - Win if \(|P_\text{actual} - P_\text{pred}| \leq 0.1\).  
  4. **Distribute Rewards:**  
     - Winners take double bet from pool. Losers forfeit bet to pool.  

  *Expected Observations:*  
  - 🔵 Group: Average \(P_\text{actual}\) ≈ 0.75–0.90 (framed positively).  
  - 🔴 Group: Average \(P_\text{actual}\) ≈ 0.45–0.65 (framed negatively).  
  - **Pattern:** Most lose bets. Those who set \(P_\text{pred} = P_\text{now}\) (Reflection) fail spectacularly if \(P_\text{actual}\) is biased away from \(P_\text{now}\).  

  ---

  #### **5. Structured Debrief (30 min)**  
  *Map Activity to Reflection Principle:*  
  | **Activity Moment**          | **Reflection Principle**                          | **Tension** |  
  |------------------------------|---------------------------------------------------|-------------|  
  | Setting \(P_\text{pred}\)    | \(\mathbb{E}[P_{t+\Delta t}(A)]\) should = \(P_t(A)\) | Participants set \(P_\text{pred}\) as point estimate, but \(\mathbb{E}\) is an *average* over possible futures. |  
  | Updating to \(P_\text{actual}\) | \(P_{t+\Delta t}(A)\) is realized under bias    | \(P_\text{actual}\) is *not* \(\mathbb{E}[P_{t+\Delta t}(A)]\)—it’s biased by frame. |  
  | Betting on “closeness”       | Reflection doesn’t require \(P_{t+\Delta t}(A)\) ≈ \(P_t(A)\) | Bets require precision (\(\pm 0.1\)), but bias makes \(P_\text{actual}\) *diverge* from \(\mathbb{E}\). |  

  *Predictable Participant Failures:*  
  1. **Naive Reflection:** Set \(P_\text{pred} = P_\text{now}\).  
     - Result: \(P_\text{actual}\) is skewed by frame → lose bet.  
  2. **Overconfident Pre-Correction:** Set \(P_\text{pred}\) to “unbiased” value (e.g., 0.75).  
     - Result: Fails to correct fully → \(P_\text{actual}\) still biased (e.g., 🔴: 0.55 ≠ 0.75).  
  3. **Strategic Guessing:** Set \(P_\text{pred}\) to extreme (e.g., 0.9 if expecting 🔵).  
     - Result: 50% chance of frame mismatch → high risk.  

  *What the Activity Cannot Replicate:*  
  - **Continuous Coherence:** Reflection assumes probabilistic coherence over *time*, but this is a discrete jump.  
  - **Perfect Self-Knowledge:** Participants know *of* their bias but not its *magnitude*. Real agents often lack even this.  
  - **Ideal Rationality:** The principle presumes *ability* to correct biases; here, participants “know” they can’t.  

  *Facilitator’s Indispensable Input:*  
  1. **Frame the Conflict:**  
     > “Reflection demands you align \(P_\text{now}\) with your *expectation* of future belief. But if you expect future-you to be irrational, \(P_\text{now}\) must ‘bake in’ your anticipated irrationality—undermining trust in your own reasoning.”  
  2. **Highlight the Paradox:**  
     > “To satisfy Reflection, you must set \(P_\text{pred} = \mathbb{E}[P_\text{actual}]\). But if \(\mathbb{E}[P_\text{actual}]\) splits between frames (e.g., 0.65 for 🔴, 0.85 for 🔵), then \(P_\text{pred} = 0.75\). But your *actual* update (say, 0.55 for 🔴) is far from 0.75, so you lose the bet. Reflection ‘works’ for the *average*, but you live in *one* biased timeline.”  
  3. **Acknowledge Realism:**  
     > “In life, evidence *is* often framed (news, ads). If you know you’ll be biased later, should your *current* belief be the average of future biased beliefs? That feels like self-sabotage.”  

  ---

  ### **Why This Works**  
  - **Tangible Stakes:** Tokens incentivize honest engagement with belief dynamics.  
  - **Twist Built into Rules:** Participants discover the frame/bias link *after* updating, mirroring real epistemic vulnerability.  
  - **Debrief Bridges Experience/Theory:** Concrete outcomes (failed bets, skewed \(P_\text{actual}\)) are mapped to Reflection’s formal demands.  
  - **Silent Facilitator:** Rules/scoring alone create tension; debrief crystallizes it philosophically.  

  **Adjust as needed for your group’s pace!** This simulates the "uncomfortable constraint" of Reflection by making participants *live* the conflict between rationality and anticipated irrationality.
