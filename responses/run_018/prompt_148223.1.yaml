  We are designing a two-round activity to illustrate Van Fraassen's Reflection principle and the tension when anticipating one's own future irrationality. The scenario involves a target claim and evidence that is framed to induce a cognitive bias (e.g., framing effect or anchoring). Half the participants will receive evidence in a bias-inducing frame, and half in a neutral frame. However, all participants are warned in advance about their own susceptibility to the bias but have not yet corrected for it.

  Important elements:
  - Participants: 12 graduate students.
  - Duration: 90 minutes (we need to allocate time for setup, rounds, and debrief).
  - Physical setting: Seminar table with private envelopes.

  The target claim: We need a claim that is uncertain and for which we can provide evidence that can be framed in two ways. Example: "A new drug is effective at treating a certain condition." The evidence could be a summary of a study, which can be framed either positively (e.g., "The drug has a 90% success rate") or negatively (e.g., "The drug has a 10% failure rate").

  However, to induce a bias, we might use an anchoring scenario. For example, we can provide an initial anchor that is arbitrary and then ask for an estimate. But note: we want the evidence to be the same but framed differently, or we can use an anchoring effect by providing a random number.

  Alternatively, we can use a classic anchoring bias: participants are asked to estimate a quantity (like the length of the Mississippi River) and are given a random anchor (like 500 miles or 5000 miles) which will influence their estimate.

  But note: we are updating a credence about a target claim. So let's define:

  Target claim: "The length of the Mississippi River is greater than 2000 miles."

  We can then provide two pieces of evidence that are equivalent but framed differently? Not exactly. Instead, we can provide the same fact but with an anchor. For example, we can say:

  - For the anchored high group: "Is the length of the Mississippi River greater than 2000 miles? Consider that it is about 5000 miles long." 
  - For the anchored low group: "Is the length of the Mississippi River greater than 2000 miles? Consider that it is about 500 miles long."

  But note: the evidence is not the same. The anchor is different. However, the actual fact about the river is the same. The bias is that the anchor will influence their estimate of the river's length.

  Alternatively, we can use a framing effect. Let's choose a framing effect:

  Target claim: "A new surgical procedure has a success rate of at least 90%."

  Framing:
  - Positive frame: "The procedure has a 90% success rate."
  - Negative frame: "The procedure has a 10% failure rate."

  Research shows that people rate the procedure more favorably when presented with the positive frame.

  But note: we want the evidence to be designed to trigger the bias. So we can present the same information in two frames.

  Round One:
  - Each participant privately records:
     (a) Current credence (P_now) in the target claim (as a probability between 0 and 1).
     (b) Predicted credence (P_pred) for after they open the envelope (also a probability).
  - They then place a bet on whether their actual Round-Two credence will be within a narrow band (say ±0.1) of P_pred.

  Round Two:
  - They open the envelope and see the framed evidence (either positive or negative frame, or high anchor or low anchor). They update and record their actual credence (P_actual).

  The twist: half the envelopes have the bias-inducing frame (say negative frame or low anchor) and half have the neutral or positive frame (or high anchor). But note: we want the evidence to be the same in content. So for the framing effect, the two frames are logically equivalent but trigger different psychological responses.

  We also warn all participants in advance that they are susceptible to the framing effect (or anchoring) but that they haven't corrected for it.

  Stakes: Each participant starts with 5 tokens. They can bet 0, 1, or 2 tokens on their prediction being accurate (within ±0.1). If they are within the band, they get their bet back plus the same amount (so if they bet 1 token and are correct, they get 1+1=2 tokens). If they are wrong, they lose the bet. Alternatively, we can have a pool: all tokens are pooled and then redistributed based on success.

