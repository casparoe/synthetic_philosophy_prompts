answer: |-
  You've hit on the core tensions brilliantly – the deadlock stems precisely from the fundamental disagreements you've identified. Here's a breakdown of the structure and why it persists, followed by an assessment of your asymmetry proposal:

  **The Core Structure of the Deadlock:**

  1.  **Shared Premises, Divergent Conclusions:**
      *   **Agreement:** Both sides agree that killing requires *some* justification (it's not morally neutral), and that *states* require a just cause to initiate war.
      *   **Disagreement:** What flows from this for the individual soldier?
          *   **Walzer (Symmetry/MEC):** Soldiers on both sides *inherit* a moral permission to fight from the collective war-making authority of their state and the shared condition of being subject to war's "duress." Their role as combatants grants them a specific status with reciprocal rights and duties *vis-à-vis other combatants*. The justification for *their killing* is rooted in their status and role, largely independent of the justice of their state's cause (beyond the requirement that the state *claims* just cause).
          *   **McMahan (Asymmetry/Revisionism):** The justification for killing *cannot* be inherited or role-based. It must derive from the individual's own moral position. A soldier fighting for an *unjust* cause lacks a just cause *themselves*. Their attack is therefore morally akin to assault or murder. Killing them, however, *can* be justified because they pose an *unjust threat*, making them liable to defensive harm.

  2.  **The Central Battleground: Liability vs. Status/Permission:**
      *   **Revisionist Focus (Liability):** The key question is: "Has this individual made themselves *liable* to be killed by posing an unjust threat?" Unjust combatants do this; just combatants do not (they are either justified threats or non-threats). The state's authority doesn't magically erase this individual moral calculus.
      *   **Traditionalist Focus (Status/Permission):** The key question is: "Does this individual have the *status* of a combatant, granting them the *permission* to kill other combatants and making them legitimate targets?" This status is conferred by the state (acting within the laws of war, even if unjustly) and accepted by the international system. The moral equality stems from this shared status and the reciprocal risk inherent in war.

  3.  **The "Double Duty" of 'Combatant' (Institutional vs. Personal Morality):**
      *   **Walzer's Domain (Institutional Morality/Rules of War):** He's primarily concerned with the *rules of engagement* for the *institution* of war. 'Combatant' here is a functional role with defined rights and obligations *within the war convention*. Symmetry is essential for reciprocity, surrender, POW status, and limiting harm to civilians. Morality here is about the *shared practice*.
      *   **McMahan's Domain (Fundamental Individual Morality):** He peels back the institutional layer to examine the underlying *individual moral responsibility*. 'Combatant' here simply describes someone fighting; it doesn't *by itself* confer moral permission. Morality here is about basic rights violations and justifications independent of roles.
      *   **The Problem:** Both sides often argue past each other because they are addressing different questions with the same terminology. Walzer is asking "What rules should govern combatants *in war*?" McMahan is asking "Is this individual *morally permitted* to kill that individual?"

  4.  **The Hidden Assumption: State Authorization and Moral Alchemy:**
      *   The core traditionalist assumption revisionists reject is that *state authorization can transform an otherwise wrongful killing into a morally permissible act of war*. Revisionists see this as "moral alchemy" – the state's say-so doesn't change the fundamental moral reality of killing an innocent person (the just combatant) for an unjust end. Traditionalists argue that the context of war, state authority, and the combatant role *do* create a distinct moral sphere where different permissions apply.

  **Your Asymmetry Proposal: Justified vs. Excused?**

  *   **The Idea:** Just combatants are *justified* in killing (it's the right thing to do). Unjust combatants are *excused* for killing (they aren't blameworthy, perhaps due to ignorance, duress, or epistemic limitations), but their act remains *unjustified* (wrongful).
  *   **Its Place in the Debate:**
      *   **Revisionist-Friendly:** This asymmetry aligns well with McMahan's core view. He explicitly argues that unjust combatants often act under conditions that *excuse* them (lack of knowledge, coercion, indoctrination), meaning they might not be *culpable* or *blameworthy*, but this doesn't make their killing *justified* or permissible. Their act is still objectively wrong.
      *   **Does it Break the Deadlock?** **Probably Not.** Here's why:
          *   **Revisionist Acceptance:** McMahan *already incorporates* this distinction (justified vs. excused). It's a core part of his asymmetry. He would agree that unjust combatants are often excused but not justified.
          *   **Traditionalist Rejection:** Walzerians would likely reject that the killing by unjust combatants is fundamentally *unjustified* in the context of war. For them, the combatant status *does* provide justification (permission) for killing enemy combatants, regardless of the justice of the cause. They see the "excuse" approach as undermining the reciprocal structure of the war convention and the moral equality of soldiers *as combatants*. They argue that demanding soldiers judge the justice of their nation's cause is impractical and destabilizing.
          *   **The Stalemate Remains:** The core disagreement persists: *Does the combatant role/state authorization grant a genuine moral permission (justification) to kill enemy soldiers, even if the cause is unjust?* The "justified vs. excused" proposal assumes the revisionist answer ("No, it doesn't grant justification") and thus doesn't persuade the traditionalist, who insists the role *does* grant justification within the war context.

  **What Might Move Things Forward? (Or Why It's Stuck)**

  1.  **Addressing the Epistemic Problem:** How can soldiers *know* if their cause is just? Revisionists struggle here. If soldiers can't reliably discern justice, Walzer's symmetry seems pragmatically necessary. Arguments focusing on reasonable belief, institutional responsibility for assessing *jus ad bellum*, and the limits of soldierly duty under conditions of uncertainty are crucial battlegrounds.
  2.  **The Nature of "Morality" in War:** Is war a distinct moral realm requiring sui generis rules (Walzer)? Or is it governed by the same fundamental morality that applies elsewhere, merely complicated by scale and violence (McMahan)? This meta-ethical difference is fundamental and hard to bridge.
  3.  **Institutional vs. Foundational Morality:** Can a rule be morally justified *for the institution of war* (promoting restraint, reciprocity) even if it doesn't perfectly align with foundational individual morality in every instance? Hybrid approaches try to navigate this (e.g., rules of war as morally necessary compromises).
  4.  **The "Responsibility Dilemma":** Who bears the primary moral responsibility for unjust killing in war? Revisionists place it heavily on the individual unjust combatant. Traditionalists place it primarily on the state leaders who launched the unjust war, seeing soldiers as instruments. Arguments refining theories of co-responsibility and coercion might offer paths.
  5.  **Consequences:** Traditionalists argue revisionism undermines the laws of war (e.g., making surrender by unjust combatants less likely if they fear being treated as criminals). Revisionists argue the traditional view morally corrupts soldiers by telling them wrongful killing is permissible. Debating the *practical consequences* of adopting either framework is vital but often reinforces the divide.

  **Conclusion:**

  You've grasped the essential architecture of the deadlock perfectly. The disagreement *is* fundamentally about **liability vs. status-derived permission**, deeply entangled with **divergent views on state authorization** ("moral alchemy" vs. impotence) and the **double duty of 'combatant'** (institutional role vs. individual moral agent).

  Your asymmetry proposal (justified vs. excused) is insightful and captures a key revisionist distinction McMahan employs, but it doesn't break the stalemate because it presupposes the revisionist rejection of the traditionalist core claim that combatant status *itself* provides justification. The traditionalist rejects the premise that the unjust combatant's killing is *inherently unjustified* within the war framework.

  Moving the debate likely requires tackling the **epistemic challenges** soldiers face, refining theories of **collective responsibility and coercion**, or finding a way to reconcile **institutional pragmatism with fundamental morality** in a way that both sides find plausible – a task that has proven immensely difficult for decades. The deadlock persists because the underlying premises about morality, authority, and the nature of war are profoundly different.
