  hi, i'm in high school and my philosophy club has been arguing about the dust specks vs torture thing for weeks. you know the one: would you rather one person be tortured for a year, or a mind-blowingly huge number of people each get a single speck of dust in their eye for a second? everyone in the club is either on team 'add the specks up, the total is worse' or team 'torture is worse than any number of specks, end of.' i want you to write me an argument for a third view i had but couldnt defend properly. the view is that tiny harms do add up within a single person's life, but they dont add up across different people. so if one person gets a million tiny headaches across their life, that can easily outweigh one short sharp pain for that same person; but if a million different people each get one tiny headache, that doesn't combine into one big million-headache thing that can be weighed against one person being tortured. the argument should say why 'total suffering' is the wrong way to compare options, and why the dust specks case only looks puzzling because it mixes those two kinds of adding up. please write the argument in British English (so favour not favor, and all that). at the very end, after the argument, put a short label for the position in the machine-readable form, like this: \answer{your short label here}
