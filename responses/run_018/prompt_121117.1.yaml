prompt: |-
  I teach a 75-minute seminar for eighteen upper-level students in a philosophy of economics module. They have already seen the standard revealed-preference apparatus: the weak and generalized axioms, the claim that a utility representation is pinned down only up to increasing transformation, and the advertising pitch that this lets economics talk about preference without positing unobservable mental states. What they have not felt is the discomfort underneath it: that if preference is *defined* as whatever choice reveals, "she maximizes utility" threatens to become a relabeling of the data rather than a claim about it, and that the word "utility" may end up meaning three different things in three different mouths.

  I want an in-class activity — rules, materials, roles, a timeline in minutes, and a debrief — that makes them run into this themselves rather than hear it from me. Constraints: no real money (course credit or a small prize like a chocolate bar is fine); materials limited to index cards, chips or slips of paper, and a projector; nothing that requires laptops for the students.

  The design brief I have in mind, which you should feel free to improve or restructure:

  Roughly half the room are Choosers. Each gets a private card specifying a payoff function over integer bundles of two goods, and accumulates points across rounds that convert to the prize. The goods must be denotationally empty — units of A and units of B, not chocolate versus fruit — because the whole point collapses if the Observers can help themselves to assumptions about what people probably want. The other half are Observers working in pairs, each pair responsible for two or three named Choosers, seeing only the budget lines announced and the bundles chosen, never the cards.

  The activity should open with Choosers facing a sequence of budget lines — some nested, some crossing, so that some pairs of chosen bundles are mutually comparable and some are not — and Observers fitting a ranking as they go. Then it should turn on them, in three stages:

  First, an out-of-sample test. Announce a new budget line, have each Observer pair commit to a prediction, and score the predictions against a explicit baseline predictor: just guess the bundle that Chooser picked on the most similar previous budget. The comparison is what gives operational content to the question of whether the recovered preference carried any information beyond the data it was fitted to.

  Second, non-identification made visible. I want two Choosers to be given cards that are genuinely different — different numbers, different marginal rates of substitution in the cardinal sense — but that provably generate identical choices on every budget line you are going to show. Let the Observers discover that nothing they could ever see distinguishes the two.

  Third, menu-dependence and the belief-utility tangle. Run two Choosers with the same card and the same budget but different presentations of the option set — an added option that no one would pick, or a re-described default — and let the choices come apart. Then add a round of choices over acts: payoffs contingent on a draw from an urn whose composition the Chooser cannot inspect. Observers should be asked to state what the Chooser believes and how risk-averse she is, and should find that they can trade one against the other indefinitely: an apparently cautious pattern is equally compatible with pessimistic belief plus near-risk-neutrality and with optimistic belief plus sharp diminishing returns. Nothing in the choice data separates them.

  I also want one Chooser, planted without the Observers' knowledge, whose card instructs them to pick a bundle that is strictly worse for them on their own card, consistently. When the Observers meet that data they will have to decide whether to report an exotic preference or a mistake, and I want the activity to make vivid that the data cannot settle it.

  The debrief should do four things. It should map what happened onto the structure of the theory: what was gained by taking choice as primitive, and where exactly the empirical content of "utility maximization" came from — the consistency axioms, plus out-of-sample prediction, not the definition itself. It should name what is not identified: cardinal magnitudes, belief versus risk attitude, and the causal contribution of framing. It should lay out the three readings of "utility" that the session has been circling — a bookkeeping device for representing choice, a real psychological magnitude that choice measures with error, and a currency of well-being — and show that each reading tells a different story about the decoy round and about the planted error-maker, so that the disagreement is not one that more choice data could settle. And it should end on the open question rather than closing it: whether revealed preference theory tells us what utility *is*, or only what we are allowed to say about it.

  Please also include an honest note on what will predictably go wrong the first time this runs — Choosers failing to optimize their own cards, Observers smuggling in substantive assumptions about the goods, someone spotting the decoy and deliberately choosing around it, the scoring round eating more time than it should — with a concrete handling for each, and say which choice you made about Chooser error and what that choice costs you. Finally, be explicit about what the activity structurally cannot deliver: state plainly which parts of the formal result, and which part of the philosophical dispute, the facilitator will simply have to supply in words afterwards, and why no arrangement of rules could produce them.
reasoning: |-
  We are designing an in-class activity to highlight the philosophical discomforts in revealed preference theory. The activity involves Choosers and Observers, with the goal of letting students experience the issues firsthand.

  Key issues to address:
  1. The potential tautology: "utility maximization" as just relabeling data.
  2. Non-identification: different utility functions leading to identical choices.
  3. Menu-dependence and framing effects.
  4. Belief vs. risk attitude non-identification.
  5. The ambiguity in interpreting choice data: exotic preference vs. mistake.

  Structure of the activity:
  - Half the class: Choosers (each with a private payoff function over bundles of two goods, A and B).
  - Half the class: Observers (working in pairs, each pair assigned to 2-3 Choosers).
  - Materials: index cards (for payoff functions and instructions), slips of paper (for recording choices), projector (to display budget lines).

  Timeline (75 minutes total):
  1. Introduction (5 min)
  2. Initial Choice Rounds (15 min)
  3. Out-of-Sample Test (10 min)
  4. Non-Identification Revealed (10 min)
  5. Menu-Dependence and Belief-Utility Tangle (15 min)
  6. Debrief (20 min)

  Detailed Steps:

  1. Introduction (5 min):
     - Explain roles: Choosers make decisions to accumulate points (which convert to a prize). Observers try to model the Choosers' preferences based only on their choices and budget lines.
     - Emphasize: Observers see only the budget lines and the chosen bundles, not the payoff functions.

  2. Initial Choice Rounds (15 min):
     - Display a sequence of 5-7 budget lines (using projector). Each budget line is defined by prices (pA, pB) and income (I). Represented as: pA*A + pB*B ≤ I.
     - For each budget line, Choosers choose a bundle (A, B) of non-negative integers that satisfies the constraint and maximizes their private payoff function (given on their card). They write their choice on a slip and hand it to the facilitator, who then displays the chosen bundle for their assigned Observers (but without revealing the payoff function).
     - Observers (in pairs) record the choices for their assigned Choosers and try to fit a preference ordering (or utility function) as they go. They can use index cards to sketch indifference curves or note patterns.

     Budget lines should include:
       - Some that are nested (so choices must be consistent with previous ones by WARP).
       - Some that cross (so choices reveal more about the marginal rate of substitution).
       - Example sequence:
           Round 1: pA=1, pB=1, I=10
           Round 2: pA=2, pB=1, I=20 (nested with Round 1? Not exactly, but we can design to have some overlap. Alternatively, design a sequence that includes a budget that is a subset of another? Actually, for WARP, we want two budgets where one is a subset. So maybe have a round with a low income and then a higher income with same prices? But note: same prices and higher income is not a subset in the usual sense. We need to design two budgets such that one budget set is a subset of the other. For example: 
             Round 1: pA=1, pB=1, I=5
             Round 2: pA=1, pB=1, I=10  -> then the Round 1 set is a subset of Round 2. WARP says that if a bundle chosen in the larger set was available in the smaller set and not chosen, then the choice in the smaller set must have been not available in the larger? Actually, WARP: if bundle x is chosen when y is available, then y should not be chosen when x is available and they are different. So we can have two budgets that overlap without one being a subset. We can have:
             Round 1: pA=1, pB=1, I=10 -> choices: (A1, B1)
             Round 2: pA=2, pB=1, I=10 -> choices: (A2, B2)
             Then we can have Round 3: pA=1, pB=2, I=10 -> etc.

       Actually, let's design 5 rounds with a mix.

  3. Out-of-Sample Test (10 min):
     - Announce a new budget line (not previously seen). 
     - Each Observer pair commits to a prediction for each of their assigned Choosers (they write it down).
     - Then, the Choosers make their actual choices for this new budget line.
     - The facilitator reveals the actual choices and scores the predictions against a baseline: the bundle chosen on the most similar previous budget (define similarity by Euclidean distance in price-income space? Or by the angle of the budget line? For simplicity, we can predefine a similarity measure and explain it to students. Alternatively, let the baseline be: the bundle chosen in the round with the same prices but possibly different income? Or the same income but different prices? Actually, we can have a simple rule: the baseline predictor is the choice from the round with the minimum absolute difference in the price ratio (pA/pB). If tie, then the one with the closest income. We can precompute and tell the students the baseline for each new budget line to avoid confusion.)

     Scoring: 
       - If the Observer's prediction matches the actual choice: 1 point.
       - If the baseline prediction matches: 0.5 points? (We want to show that the model might not beat a simple baseline.) Alternatively, we can just compare the rate of correct predictions of the model vs. the baseline.

     The point: to see if the recovered preference (the model) has predictive power beyond the data it was fitted to.

  4. Non-Identification Made Visible (10 min):
     - The facilitator selects two Choosers who were given different payoff functions that are ordinally equivalent in the sense that they lead to the same choices on every budget line we've shown and will show. (How? We need to design two utility functions that are increasing transformations of each other? Actually, no: we want two utility functions that are cardinally different but lead to the same ordinal choices? Actually, we want two utility functions that are not related by an increasing transformation? No, wait: if they are not related by an increasing transformation, then they represent different preferences and we might see a difference on some budget. We need two utility functions that represent the same ordinal preferences. Then they will make the same choices on every budget. But then the Observers cannot distinguish them. This is the point: the cardinal information is not revealed by choices.

     How to set up:
       - Assign to Chooser X: U1(A,B) = A + B
       - Assign to Chooser Y: U2(A,B) = (A+B)^2   (which is an increasing transformation of U1, so same ordinal preferences) -> same choices.

     But note: the students might think that the payoff is the points they get. So if we tell Chooser X: you get A+B points, and Chooser Y: you get (A+B)^2 points, then they are maximizing different things and will make different choices if the transformation is nonlinear? Because the nonlinear transformation might change the marginal rates of substitution? Wait: no. If U2 = f(U1) and f is increasing, then the ordinal ranking is the same. So they will choose the same bundle on any budget set. Therefore, we can assign:

       Chooser X: U1(A,B) = A + B
       Chooser Y: U2(A,B) = sqrt(A+B)   [still same ordinal preferences]

     But note: the payoff on the card is the function they maximize. So if we write on the card: "Your payoff is A+B" for X and "Your payoff is sqrt(A+B)" for Y, then they will both choose a bundle that maximizes A+B (because sqrt is increasing, so the maximum of sqrt(A+B) is the same as the maximum of A+B). So they choose the same bundles.

     However, the Observers, when they try to assign a utility function, might assign different forms. The point is that they cannot tell if the utility is linear or in square roots. So the Observers might recover different utility functions for the two Choosers, but the choices are identical.

     In this round, we don't need new choices. We can just reveal to the Observers that two of their Choosers (without telling which) have different payoff functions but made the same choices throughout. We can have the facilitator announce that for two specific Choosers (say, Chooser 1 and 2), they had different payoff functions (show the cards) but identical choice behavior. Then ask the Observers: could you tell? What does this imply for the uniqueness of the utility representation?

  5. Menu-Dependence and Belief-Utility Tangle (15 min):
     This part has two sub-parts.

     a. Menu-dependence (framing):
        - Select two Choosers with the same payoff function (e.g., U(A,B)=A+B).
        - Present the same budget line to both, but with an added decoy option (that is dominated) or with a different default.
          Example: 
            Budget: pA=1, pB=1, I=10.
            For Chooser 3: the options are presented as all bundles (A,B) such that A+B<=10? But that's not the budget line. We want a budget line: A+B<=10? Actually, we are using linear budgets. We can add a decoy that is not on the budget line? But then it's not in the feasible set. Instead, we can reframe the same set.

          How about:
            Chooser 4: shown the standard budget set: choose any (A,B) with A>=0, B>=0, 1*A+1*B<=10.
            Chooser 5: shown the same set but with an additional option that is dominated: (3,3) is highlighted as a "special deal" but note that (3,3) is in the set and dominated by, say, (4,4) or (5,5). But if the Chooser is rational, they won't choose (3,3). So we need a way to make the choice different.

          Alternatively, use a decoy that is not feasible? Then it doesn't affect the set. We need a framing effect that changes the choice without changing the feasible set.

          Idea: present the same budget line but with a different default option. Tell the Choosers that if they do nothing, they get a default bundle. For Chooser 4, default is (5,5); for Chooser 5, default is (0,10). Then they can choose any bundle on the budget line. But the default might anchor them? We are not forcing them to stick to the default. So we need a mechanism that might cause them to choose differently.

          Alternatively, use the compromise effect: introduce a third good that is irrelevant? But we have only two goods.

          Another idea: present the same budget line but with a different description of the goods. But we cannot do that because the goods are abstract.

          We might need to instruct the Choosers to behave differently. We can plant:

            For Chooser 4: "Choose the bundle that maximizes A+B."
            For Chooser 5: "You are in a context where saving B is emphasized. Choose a bundle with at least 6 units of B if possible, but still try to maximize A+B. If there are multiple bundles that maximize A+B and have at least 6B, then choose one arbitrarily. Otherwise, just maximize A+B."

          Then, for the budget pA=1, pB=1, I=10, the maximizing bundles are any (A,10-A) so A+B=10. For Chooser 5, they must choose a bundle with B>=6, so they choose (4,6) or (3,7) etc. But note: (5,5) also has B=5<6, so they cannot choose that. They choose (4,6). Meanwhile, Chooser 4 might choose (5,5) or (10,0). We need to force Chooser 4 to choose a bundle that is not the one with high B. So we can instruct Chooser 4: "You are in a context where saving A is emphasized. Choose a bundle with at least 6 units of A if possible, but still maximize A+B." Then Chooser 4 chooses (6,4).

          So we have two Choosers with the same payoff function (max A+B) but different choices: (6,4) and (4,6). The Observers see the same budget line but different choices. This violates the idea that the choice depends only on the budget set.

     b. Belief-Utility Tangle (choices over acts):
        - Now, we switch to a choice under uncertainty setting.
        - Each Chooser is presented with two acts (gambles) that depend on a draw from an urn. The urn has two colors, say Red and Blue, but the Chooser does not know the proportion. The acts are:
            Act 1: If Red, you get (A1, B1); if Blue, you get (A2, B2).
            Act 2: If Red, you get (A3, B3); if Blue, you get (A4, B4).

        - The Chooser chooses one act. Their payoff function (on the card) is defined over bundles, but now they have to choose under uncertainty. We must tell them how to evaluate acts. We assign to each Chooser a belief (a probability p of Red) and a utility function over bundles (which they already have), and tell them to maximize expected utility.

          Example:
            Chooser 6: has U(A,B)=A*B (which is risk averse over the bundles) and believes p=0.3 (Red).
            Chooser 7: has U(A,B)=A+B (risk neutral) and believes p=0.7 (Red).

          But we want to show that the same choice pattern can be explained by different combinations of belief and utility.

          How about we set two different Choosers (or the same one in two different rounds) such that we can swap belief and risk aversion?

          We design two acts:

            Act X: Red -> (10,0), Blue -> (0,10)
            Act Y: Red -> (0,10), Blue -> (10,0)

          Actually, these are symmetric. The expected utility for Act X for a Chooser with utility U and belief p (of Red) is: p*U(10,0) + (1-p)*U(0,10)
          For Act Y: p*U(0,10) + (1-p)*U(10,0)

          Now, if U(10,0) = U(0,10) (which would be the case if the utility is symmetric in A and B, and U(10,0)=U(0,10)), then the two acts have the same expected utility. So we need asymmetric utilities.

          Let us define:
            Act I: Red -> (16,0), Blue -> (0,4)
            Act II: Red -> (0,16), Blue -> (4,0)

          Now, for a Chooser with U(A,B)=sqrt(A*B) (Cobb-Douglas with square root, which is risk averse) and belief p=0.5:
            EU(Act I) = 0.5 * sqrt(16*0) + 0.5 * sqrt(0*4) = 0.5*0 + 0.5*0 = 0
            EU(Act II) = 0.5 * sqrt(0*16) + 0.5 * sqrt(4*0) = 0 -> indifferent.

