          Alternatively, we can have:

            Act 1: Red -> (10,0), Blue -> (0,10)
            Act 2: Red -> (4,4), Blue -> (4,4)   (a sure thing)

          Now, for a Chooser with U(A,B)=sqrt(A*B) (risk averse) and p=0.5:
            EU(Act1) = 0.5 * sqrt(0) + 0.5 * sqrt(0) = 0
            EU(Act2) = sqrt(16)=4 -> prefers Act2.

          For a risk neutral Chooser with the same belief: 
            EU(Act1)=0.5*0 + 0.5*0 = 0? Actually, if U(A,B)=A+B, then:
            EU(Act1)=0.5*(10+0) + 0.5*(0+10)=10
            EU(Act2)=4+4=8 -> so they prefer Act1.

