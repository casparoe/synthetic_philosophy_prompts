  This is 58 minutes, leaving 7 minutes for transitions.

  Alternatively, we can cut the belief-utility round if short on time and discuss it verbally.

  Materials:

    - Index cards for Choosers: 
          Most: specify a utility function (e.g., U=A+B, U=sqrt(A+B), U=A*B, U=min(A,B), etc.) 
          Two: for non-identification: one U1=A+B, one U2=sqrt(A+B) [but note: same choices]
          Two: for menu-dependence: both U=A+B, but then they will get additional instructions in round 5.
          One: error-maker: "Minimize points, but avoid detection: in 2 out of the first 5 rounds, choose the maximizing bundle; in the other 3, choose a suboptimal bundle (but not the worst)."
          For belief-utility round: each Chooser gets a new card? Or we can have a separate card for the uncertainty round. The card for the uncertainty round will have:
              - A utility function over points (e.g., U(x)=x, or U(x)=sqrt(x), or U(x)=x^2) and a belief (p of Red).

    - Slips of paper for choices.

    - Projector to display the rounds.

    - Scoreboard for Observers' predictions (optional).

  Debrief Outline:

    1. Recap the revealed preference theory: 
          - It defines preference as revealed by choice.
          - It shows that if choices satisfy consistency conditions (WARP), then we can represent them by a utility function.

    2. What gives the theory empirical content?
          - The consistency conditions (which might be violated) and the ability to predict new choices (out-of-sample).

    3. What is not identified?
          - Cardinal utility: we saw two different utility functions leading to the same choices.
          - Framing effects: the same bundle might be chosen differently depending on presentation (menu-dependence), which violates the idea that choice depends only on the set of options.
          - Belief and risk attitude: the same choice pattern under uncertainty can be explained by different combinations.

    4. The error-maker: 
          - How do we interpret choices that violate consistency? As mistakes or as preferences?

    5. Three concepts of utility:
          - Representational: just a way to describe choices.
          - Psychological: a mental state that causes choices (but might not be perfectly reflected in choices).
          - Well-being: a measure of how good the outcome is for the person.

    6. Open question: 
          - Does revealed preference theory tell us what utility is? Or does it only give us a way to describe choices?

  Finally, the honest note on what will go wrong:

    - Choosers may not optimize: 
          Handling: Use simple utility functions and provide calculators if allowed. For the uncertainty round, provide a worksheet.

    - Observers may make wrong assumptions about goods: 
          Handling: Emphasize abstractness and monitor group discussions.

    - The decoy may be spotted: 
          Handling: The two menu-dependent Choosers are instructed privately, and the framing is not revealed until the debrief.

    - Time: 
          Handling: Practice timing. Have a timer. Cut a round if needed.

    - The scoring round may be confusing: 
          Handling: Pre-calculate the baseline and have a clear scoring rule.

    - The error-maker may not be detected or may be too obvious: 
          Handling: Choose the student carefully. In the debrief, reveal this and discuss.

    - The belief-utility round may be too mathematically challenging: 
          Handling: Provide a worksheet that helps compute EU for both acts.

    What we lose by having Chooser error: 
          We included one error-maker to highlight the interpretation issue. The cost is that we introduce noise that might confuse the Observers and take time. But it's a valuable point.

    What the activity cannot deliver:
          - The facilitator must state the formal results: the representation theorems, the uniqueness up to increasing transformations, the conditions for expected utility representation.
          - The activity cannot definitively prove non-identification in general; it only shows examples. The facilitator must explain that these are general problems.
          - The philosophical distinctions between the three utilities must be articulated by the facilitator; the activity only sets the stage.

  This is a complex activity, but it addresses the core discomforts.
answer: |-
  Below is a comprehensive in-class activity designed to meet your goals, followed by predicted challenges, handling strategies, and limitations. The activity emphasizes **experiential discovery** of the philosophical tensions in revealed preference theory.

  ---

  ### **Activity: The Utility Ambiguity Game**
  **Objective:** Students confront the empirical emptiness of "utility maximization" without consistency axioms, cardinal non-identification, menu-dependence, belief-risk conflation, and the mistake/preference ambiguity.

  **Roles & Materials**  
  - **Choosers (9 students):** Each gets a private index card with a payoff function over bundles of **Good A** and **Good B** (e.g., "Points = 2A + B" or "Points = √(A×B)"). *No semantic clues about goods.*  
  - **Observers (9 students in 3 pairs):** Each pair observes 3 named Choosers. They see budget lines and chosen bundles only.  
  - **Materials:**  
    - Index cards (payoff functions + instructions)  
    - Projector (display budget lines)  
    - Slips of paper (for choices/predictions)  
    - Prize (e.g., chocolate bars) for top Chooser/Observer pair.  

  **Timeline (75 min total)**  
  1. **Introduction (5 min)**  
     - Explain roles: Choosers maximize points (convertible to prize); Observers recover preferences from choices.  
     - Emphasize: Observers see *only* budget sets and choices—never payoff functions or mental states.  

  2. **Initial Rounds: Fitting Preferences (15 min)**  
     - **Rounds 1–4:** Project 4 sequential budget lines (e.g., `pA·A + pB·B ≤ I`):  
       - *Include nested sets (test WARP)*: e.g., `(pA=1, pB=1, I=5)` → `(pA=1, pB=1, I=10)`.  
       - *Include crossing sets*: e.g., `(pA=2, pB=1, I=10)` → `(pA=1, pB=2, I=10)`.  
     - **Choosers:** Write their bundle (e.g., (3,2)) on slips; hand to you. Display choices for Observers.  
     - **Observers:** For their assigned Choosers, sketch indifference curves on index cards to "fit" choices.  

  3. **Out-of-Sample Test (10 min)**  
     - Project a **new budget line** (e.g., `pA=3, pB=1, I=12`).  
     - **Observers:** Predict their Choosers’ bundles (write on slips).  
     - **Baseline predictor (pre-announced):** "Most similar prior budget" (defined by Euclidean distance in (pA, pB, I) space).  
     - **Scoring:**  
       - Observer prediction correct: 1 point.  
       - Baseline prediction correct: 0.5 points.  
     - **Reveal actual choices.** Discuss: Did fitted preferences beat the baseline? *If not, "utility" just relabels data.*  

  4. **Non-Identification Revealed (7 min)**  
     - **Prep:** Assign two Choosers **ordinally equivalent but cardinally distinct** payoff functions (e.g., Chooser X: `Points = A + B`; Chooser Y: `Points = (A + B)^0.5`). These yield identical choices on all budgets.  
     - **Activity:** Announce that two Choosers had different payoff functions. Ask Observers: "Could you distinguish them?"  
     - **Reveal:** Show cards. Highlight: Choices identical despite different MRS. Observers recover the *same* indifference curves.  

  5. **Menu-Dependence & Framing (10 min)**  
     - **Round 5:** Project identical budget line (e.g., `pA=1, pB=1, I=6`).  
     - **Choosers 1 & 2 (same payoff, e.g., `Points = A + B`)** get private instructions:  
       - Chooser 1: "You see options as: { (0,0), (1,5), (2,4), (3,3), (4,2), (5,1), (6,0) }."  
       - Chooser 2: "You see options as: { (0,0), (1,5), (2,4) } + highlighted 'popular' bundle (3,3)."  
     - **Result:** Chooser 1 picks (6,0); Chooser 2 picks (3,3) (decoy effect). Observers see same budget, different choices.  
     - **Debrief question:** "Same preferences?"  

  6. **Belief-Risk Tangle (13 min)**  
     - **Round 6:** Introduce uncertainty. Project two acts:  
       - Act 1: If *Event X*, get (4,4); else (1,1).  
       - Act 2: If *Event X*, get (8,0); else (0,2).  
       - *Event X* is a coin flip (unknown fair/unfair).  
     - **Choosers:** Told probability of *Event X* and risk attitude (via card).  
       - *Example 1:* "P(X)=0.4; U(A,B)=√A·√B (risk-averse)." → Picks Act 1.  
       - *Example 2:* "P(X)=0.7; U(A,B)=A+B (risk-neutral)." → Also picks Act 1.  
     - **Observers:** For their Chooser, state inferred "P(X)" and "risk attitude" (risk-averse/neutral/loving).  
     - **Reveal:** Show two Choosers picked identically but had different P(X)/risk. Discuss: "What caused the choice?"  

  7. **The "Error-Maker" (woven throughout)**  
     - **Prep:** One Chooser (unbeknownst to Observers) has card: "Pick bundles with fewest points. Occasionally choose optimally to avoid detection."  
     - **Result:** Observers see WARP violations (e.g., dominated bundles chosen). Forces debate: Exotic preference or mistake?  

  ---

  ### **Debrief (20 min)**  
  1. **Map onto theory:**  
     - Consistency axioms (WARP) + out-of-sample prediction give "utility" empirical content. Without them, it’s tautological.  
     - Non-identification: Choices reveal ordinality, not cardinality (MRS magnitudes), beliefs vs. risk, or framing’s causal role.  

  2. **Three meanings of "utility":**  
     | **Meaning**          | **Bookkeeping Device** | **Psychological State** | **Well-Being Currency** |  
     |----------------------|------------------------|--------------------------|--------------------------|  
     | **Decoy Round**      | Different preferences  | Framing "error"          | Same well-being?         |  
     | **Error-Maker**      | Minimizing preference  | Mistake                  | Low well-being?          |  

  3. **Open question:**  
     - Does revealed preference *define* utility, or just *constrain* what we can say? "Utility" is either a label for patterns in data, a mental state inferred with error, or an objective welfare measure—choice data alone can’t settle this.  

  ---

  ### **Predictable Problems & Handling**  
  1. **Choosers failing to optimize:**  
     - *Risk:* Math errors or confusion.  
     - *Handling:* Use integer bundles; provide simple payoff functions (e.g., 2A+B). For uncertainty, give formula cards (e.g., "EU = P×U(outcome1) + (1-P)×U(outcome2)").  

  2. **Observers smuggling in assumptions about goods:**  
     - *Risk:* "A is probably food, so they want more."  
     - *Handling:* Pre-emptively stress: "A and B are arbitrary tokens—no real-world properties."  

  3. **Decoy spotted/exploited:**  
     - *Risk:* Chooser 2 ignores decoy or chooses around it.  
     - *Handling:* Plant a compliant student; privately emphasize: "You feel subtly drawn to (3,3)."  

  4. **Scoring round runs long:**  
     - *Risk:* Debating baseline similarity.  
     - *Handling:* Pre-calculate baseline; use a simple metric (e.g., min |ΔpA| + |ΔpB| + |ΔI|).  

  5. **Belief-risk math overwhelms:**  
     - *Risk:* Students stall on EU calculations.  
     - *Handling:* Provide calculators; simplify U functions (e.g., U(A,B) = A).  

  6. **Error-maker is too obvious:**  
     - *Risk:* Always choosing (0,0).  
     - *Handling:* Instruct: "Sometimes pick a mid-point bundle (e.g., (2,2) when (5,5) is available)."  

  **Choice on Chooser error:**  
  - You *included* an error-maker to force the mistake/preference ambiguity.  
  - **Cost:** Observers may dismiss inconsistencies as "noise," diluting the tension. Mitigate by emphasizing exotic preferences exist (e.g., altruism, spite).  

  ---

  ### **What the Activity Cannot Deliver (Limitations)**  
  1. **Formal proofs:**  
     - The Generalized Axiom’s sufficiency for utility representation, or the full non-identification theorems, must be stated by you post-activity. *Why:* Students need focused discovery; formal details require lecture.  

  2. **Philosophical depth on "utility as well-being":**  
     - The activity shows well-being is ambiguous, but not how to resolve it (e.g., objective lists vs. preference-satisfaction). *Why:* Requires normative debate beyond choice data.  

  3. **Generalizing menu-dependence:**  
     - Students experience one framing effect, but you must articulate how this violates rationality axioms globally. *Why:* Limited time; framing varieties (e.g., loss aversion) need lecture examples.  

  4. **Full belief-risk separation:**  
     - The activity shows one instance of non-identification; you must explain that *no finite choice data* can separate them without additional assumptions (e.g., stable beliefs). *Why:* The identification problem is general but abstract.  

  ---

  This design forces students to wrestle with the ambiguities you described while staying within constraints. The debrief explicitly ties their frustrations to the three meanings of "utility," leaving them with the unresolved question that defines the philosophy of economics.
