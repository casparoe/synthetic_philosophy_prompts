            All Choosers are presented with the same two acts (Safe and Risky) for the same urn (unknown proportion of Red and Blue). They choose one.

            Observers (for each Chooser) are then asked to write down: what do you think is the probability p (of Red) for your Chooser, and what is their risk attitude? (They can describe it as risk neutral, averse, or loving.)

            Then, without revealing the actual p and utility, the facilitator can note that for a given choice (say Safe) there are many (p, utility) pairs that are consistent.

          We'll have to design the acts and utilities so that for some Choosers we get the same choice from different combinations.

          Given time, we can do one round of uncertainty choices.

     Given the complexity and time, we might have to simplify the uncertainty part. We can present one act choice and then discuss the non-identification.

  6. The Planted Error-Maker:
     - One Chooser (without the Observers' knowledge) is given a card that says: "Choose the bundle that minimizes your payoff. But do not make it obvious." They are told to accumulate as few points as possible. They must choose a bundle that is strictly worse than what they could have chosen. The Observers will see violations of WARP? Or just choices that are not utility maximizing? They will have to decide: is this an exotic preference (e.g., they like to minimize points) or a mistake?

     - We need to ensure that the Chooser does not make it too obvious (like always choosing (0,0)), so that the Observers might think it's a preference for zero. The card should instruct: "Sometimes choose a bundle that is not the worst, to avoid detection." But then it becomes a game theory problem? We want to focus on the interpretation of choice data.

     - Alternatively, we can have the Chooser choose a bundle that is strictly dominated by another in the same budget set. For example, in a budget with pA=1, pB=1, I=10, they choose (1,1) when (10,0) is available. That is clearly dominated. The Observers might see that and think: mistake? or a preference for having equal amounts even if very low?

     - We'll plant one such Chooser. The Observers for that Chooser will see choices that are not consistent with utility maximization (unless the utility function is very exotic). They will have to decide how to model it.

  7. Debrief (20 min):
     - Map the activity to the theory:
          - The initial rounds: fitting a model to choice data. The consistency conditions (WARP) are what allow us to represent choices by a preference ordering.
          - The out-of-sample test: the empirical content of the model comes from its ability to predict new choices beyond the data used to fit it.
          - Non-identification: the utility representation is only ordinal. We cannot recover cardinal utility from choices.
          - Menu-dependence: if choices depend on framing, then the basic model of preference over bundles is violated.
          - Belief-utility tangle: in choices under uncertainty, we cannot separately identify beliefs and risk attitudes from choices alone without additional assumptions.
          - The error-maker: choice data alone cannot distinguish between mistakes and exotic preferences.

     - Three meanings of utility:
          1. As a representation of choice (the revealed preference view).
          2. As a psychological entity (which might be measured with error, so choices are noisy indicators).
          3. As well-being (which might be objective, and choices might not reflect it).

          In the decoy round: 
            - Meaning 1: the different choices reveal different preferences (so the two Choosers have different preferences).
            - Meaning 2: the psychological utility might be the same (A+B) but the framing affects the choice (so it's a mistake or a context effect).
            - Meaning 3: well-being is the same for the same bundle, so the two Choosers are equally well off with (6,4) and (4,6)? But that depends on the well-being theory.

          For the error-maker:
            - Meaning 1: the choices reveal a preference for low points (so we must model that).
            - Meaning 2: the Chooser is making mistakes (so the true psychological utility is not being maximized).
            - Meaning 3: well-being might be high if they are getting what they choose? Or low because they are getting less?

     - End on the open question: does revealed preference tell us what utility is, or only what we can say about it?

  Predictable Problems and Handling:

    a. Choosers failing to optimize: 
        - Some students might make arithmetic errors. 
        - Handling: Provide a worksheet with the budget line and let them calculate a few bundles. For the uncertainty part, provide a formula. Keep the numbers simple.

    b. Observers smuggling in assumptions about the goods: 
        - Since the goods are abstract (A and B), remind them that they cannot assume A is food and B is clothing. Emphasize that they are just arbitrary tokens.

    c. Someone spotting the decoy and deliberately choosing around it: 
        - The decoy is not supposed to be chosen. In our setup, we are using instructions to the Chooser to choose differently. We rely on them following the instructions.

    d. Time: 
        - The scoring round might take too long. Handling: Pre-calculate the baseline predictions and have a simple scoring system (just show: model correct or not, baseline correct or not). Do not spend time on complex scoring.

    e. The non-identification round: 
        - We reveal that two Choosers had different cards but same choices. This might be done quickly.

    f. The planted error-maker: 
        - We must choose a student who will be discreet and follow the instruction to sometimes choose optimally to avoid detection. We'll choose a student who is reliable.

    g. Belief-Utility Tangle: 
        - This is complex. We might skip the actual choice round and instead present a hypothetical. But we want them to see the choice. We can do a very simple one: one round of choice between two acts.

  What the activity cannot deliver:

    - Formal proofs of the representation theorems and the non-identification results. The facilitator will have to state these.

    - The full philosophical depth of the debate. The activity gives a taste, but the facilitator must articulate the three concepts of utility and the open question.

    - The activity might not generate a clear violation of WARP by the error-maker if they are careful. The facilitator might have to supplement with a hypothetical.

    - The belief-utility non-identification requires multiple observations to be fully clear, but we have time for only one. The facilitator must explain that even with more data, there can be non-identification without additional assumptions.

  Revised Timeline (75 min):

    1. Introduction (5 min)
    2. Initial Rounds (5 rounds, 10 min total) 
