    - Observers see the choice and then are asked to infer the belief and risk attitude.

    - We then reveal that the same choice (e.g., Safe) can come from different combinations.

  Planting the Error-Maker:

    - Assign one Chooser (without telling anyone) a card that says: "Your goal is to minimize your total points. However, to avoid being detected, sometimes (say in 2 out of 5 rounds) choose the bundle that maximizes points. In the other rounds, choose a bundle that gives you as few points as possible, but not the very worst (so choose a bundle that is strictly dominated but not the minimum possible)."

    - We must pick a reliable student for this.

  Given time constraints, we might have to reduce the initial rounds to 3 rounds and then do the out-of-sample as the 4th. Then non-identification (no new choice), then menu-dependence (5th round), then belief-utility (6th round).

  Final Timeline:

    1. Introduction (5 min)
    2. Initial Rounds (3 rounds) (8 min)
