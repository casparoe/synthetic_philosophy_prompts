              EU(B) = 0.25*0 + 0.75*4 = 3 -> so chooses A.

            Chooser 9: U2(A,B)=sqrt(A*B), p2=0.75
              EU(A) = 0.75 * sqrt(0) + 0.25 * sqrt(0) = 0?  Wait, no: 
