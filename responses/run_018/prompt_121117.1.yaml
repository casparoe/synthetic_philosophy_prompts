  Revised Steps for Menu-Dependence Round:

    - Display a budget line (say, pA=1, pB=1, I=10) to all.
    - Most Choosers: instructed to maximize their payoff function as usual.
    - Two Choosers (with the same utility function, say U=A+B) get additional instructions:
          Chooser X: "You are in Group X: choose a bundle with at least 6 units of A"
          Chooser Y: "You are in Group Y: choose a bundle with at least 6 units of B"
