    5. Menu-Dependence (5 min): 
          - Present the same budget to two Choosers (with different framing instructions) and show different choices.
    6. Belief-Utility Tangle (10 min): 
          - Present one choice under uncertainty (two acts) to all Choosers. Observers state what they infer about belief and risk attitude. Then discuss non-identification.
    7. The Planted Error-Maker: 
          - Weave this in during the initial rounds. The Observers for that Chooser will see anomalies. We can discuss during debrief.

    But note: the error-maker is active throughout. So during the initial rounds and the out-of-sample test, that Chooser is making suboptimal choices.

    8. Debrief (20 min)

  Given the complexity, we might cut the belief-utility part to one example and then explain, or reduce the initial rounds to 3 rounds.

  Alternative: run the initial rounds (including the error-maker) -> then out-of-sample -> then non-identification (which doesn't require new choices) -> then menu-dependence (which is one round) -> then belief-utility (one round). 

  Total rounds of choice: 
