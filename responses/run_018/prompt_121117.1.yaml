            For Chooser A: risk neutral, p=0.4 -> EU(Risky)=0.4*9 + 0.6*9 = 9? Wait, no: in Blue, it's (0,9) -> utility=9? If U(A,B)=A+B, then (9,0)=9, (0,9)=9 -> EU(Risky)=9. EU(Safe)=4+4=8 -> prefers Risky.

