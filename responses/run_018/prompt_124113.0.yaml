  Camp 1: Structural EU defenders (EU Camp)
  - They believe that if utility is unbounded and probabilities are non-zero, then no matter how small the probability, a sufficiently large utility can make the expected utility positive, so the action should be taken.

  Camp 2: Domination-reasoning critics (Dom Camp)
  - They argue that accepting such wild propositions is a reductio ad absurdum of unbounded EU and that we need hard constraints (like bounded utility or dominance reasoning) to avoid being exploited.

  Niche framing: The agent offering the deal is an algorithmic system that can run N copies of the user's reward function across simulated worlds. The payoff scales with an enormous but finite combinatorial number (e.g., the number of possible simulations or some combinatorial structure).

  Deliverable:
  1. Numbered agreed claims.
  2. Disagreements table (each row: one side's view, the other side's response).
  3. Cruxes: For each crux, both sides agree on the relevance of a concrete case/argument, then each side's prediction about what that case shows.

  Let's brainstorm:

  Agreed Claims (numbered):
  1. **Formal Setup**: We consider an algorithmic agent that can create N simulations, each implementing a copy of the decision-maker's reward function. The agent offers: pay a small cost c now to get a huge reward R in the event that a specific condition holds (e.g., a particular bit string is found in the simulations). R scales with N (e.g., R = k * N for some constant k) and N is large but finite (e.g., 3^^^3, a huge number). The probability p that the condition holds is extremely small, say p = 1/N, but non-zero.

  2. **Why the Mugging Feels Wrong**: Both camps agree that intuitively, paying c seems irrational because:
     - The probability p is so small that it feels like it should be treated as effectively zero.
     - The scenario seems exploitable: an adversary could construct many such muggings for different conditions, potentially bankrupting the agent.

  3. **Where EU and Dominance Diverge**: 
     - EU: The expected utility of paying is p*R - c = (1/N)*(k*N) - c = k - c. For fixed k and c, if k>c, then EU>0, so pay.
     - Dom: They argue that for any fixed k and c, there exists some N so large that the probability 1/N is "practically negligible" and that we should use a decision rule that avoids being dominated (e.g., bounded utility or a decision rule that ignores probabilities below a threshold).

  Disagreements Table:

  | EU Camp Statement                                                                 | Dom Camp Response                                                                 |
  |-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | We must accept the deal because the expected utility is positive and well-defined. | This leads to vulnerability: an adversary can create countless muggings with huge N, each demanding c, and we'd pay all, losing a lot. |
  | Unbounded utility is necessary to represent extreme but finite values.            | Unbounded utility is incoherent because it forces us to accept deals that no reasonable agent should. |
  | Risk-weighting or probability discounting is ad hoc and violates coherence.       | We need constraints to avoid exploitation, and bounded utility is a principled fix. |

  | Dom Camp Statement                                                                | EU Camp Response                                                                 |
  |-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | We must reject the deal to avoid being dominated by adversarial exploitation.     | Rejecting a positive EU deal is incoherent and leaves money on the table.        |
  | Bounded utility is a principled solution that avoids the mugging.                 | Bounding utility arbitrarily discards real value and is itself ad hoc.           |
