    - Dom Camp prediction: Even in isolation, paying is irrational because the probability is too small to take seriously, and the mere possibility of such muggings in the future (even if not present now) shows that unbounded utility leads to absurdity.

  Crux 2: Ad Hoc-ness of Risk-Weighting Fixes
