      - **Shifted by:** A decision theory deriving probability neglect from entropy/complexity constraints or quantum gravity effects on cognition.  

  3.  ***(c) Mugging Intuition: Scope Insensitivity or Rational Failure?***  
      **Probability: 0.70**  
      - The intuition primarily tracks **scope insensitivity** (a cognitive bias), not a normative failure. Humans struggle with extreme magnitudes, but EU maximization remains *rationally correct* absent bounded utility. True rational failure only occurs if utilities are unbounded *and* probabilities are unconstrained.  
      - **Shifted by:** Neuroimaging showing mugging decisions activate emotional centers (insula) vs. rational circuits (DLPFC), suggesting bias over reasoning failure.  

