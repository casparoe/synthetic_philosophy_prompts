  The procedure will consist of an ordered sequence of tests or diagnostic questions. Each step will specify:
  - The exact question or test
  - What counts as a sufficient answer (pass)
  - What counts as a failure
  - Whether the step checks a genuine conceptual condition or a fallible proxy
  - Where mixed or ambiguous answers should be routed

  Additionally, the procedure must explicitly handle:
  (a) Mixed motivation
  (b) Explicit denial of welfare concern but design serves welfare
  (c) Explicit assertion of welfare concern but design choices primarily serve organizational interests

  Finally, we must identify the points where human judgment is required and flag specific misfire modes.

  Procedure: Audit for Motivation Type (AMT)

  Step 1: Explicit Statement of Primary Motivation
  - Question: In the motivation statement, what does the applicant explicitly state as the primary reason for the intervention? 
  - Pass: The primary reason stated is participant welfare (or equivalent, e.g., "to improve mental health outcomes for the target population"). 
  - Fail: The primary reason stated is institutional self-interest (liability reduction, reputation management, political credit) without any claim of primary welfare concern.
  - Genuine or Proxy: Proxy (because an institution might lie or misrepresent)
  - Ambiguous: If the statement is ambiguous (e.g., "to serve our community and reduce risk"), route to Step 2.

  Step 2: Analysis of Justificatory Structure
  - Question: In the supporting documentation (including the narrative and any theoretical framework), how is the intervention justified? Does the logic model or theory of change center on participant welfare or institutional benefit?
  - Pass: The justification centers on participant welfare (e.g., the problem is framed as a need in the community, and the intervention is shown to address that need). 
  - Fail: The justification centers on institutional benefit (e.g., reducing lawsuits, improving the organization's standing, meeting funder expectations) without a clear link to participant welfare as the primary driver.
  - Genuine or Proxy: Proxy (but closer to genuine because it looks at the structure of the argument)
  - Ambiguous: If the justification mixes both welfare and institutional interests in a way that they are presented as co-primary, route to Step 3.

  Step 3: Design Choice Audit
  - Question: Do the design choices (outcome measures, recruitment strategies, resource allocation, staffing, etc.) align with what would be expected if participant welfare were the sole or primary objective? (We must have a benchmark of a welfare-centered design for the same type of intervention.)
  - Pass: The design choices are consistent with a welfare-centered model (e.g., primary outcome measures are participant well-being, recruitment targets the most vulnerable, adequate resources for direct service, confidentiality protected). 
  - Fail: The design choices are inconsistent with a welfare-centered model and instead suggest institutional priorities (e.g., outcome measures are about organizational metrics, recruitment avoids high-risk participants, resources skewed toward evaluation/PR, staffing inadequate for quality).
  - Genuine or Proxy: Proxy (because design can be overdetermined or convergent)
  - Ambiguous: If the design choices are mixed (some welfare-aligned, some institutional-aligned) or if they are consistent with welfare but also serve institutional interests, route to Step 4.

  Step 4: Resource Allocation Test
  - Question: What proportion of the budget and key personnel time is allocated to direct service versus institutional self-interest categories (e.g., external evaluation for reporting, PR, legal consultation, administrative overhead for compliance)?
  - Pass: The majority (at least 60%) of the budget and key personnel time is allocated to direct service components that directly benefit participants. 
  - Fail: The majority of the budget and key personnel time is allocated to institutional self-interest categories (e.g., >50% to evaluation, PR, legal, compliance). 
  - Genuine or Proxy: Proxy (resource allocation is a strong indicator of priorities but not definitive)
  - Ambiguous: If the allocation is close (e.g., 50-60% to direct service) or if there is a plausible welfare justification for high evaluation costs (e.g., rigorous RCT for a novel intervention), route to Step 5.

  Step 5: Conflict Resolution Test
  - Question: If there were a conflict between participant welfare and institutional self-interest in the implementation of this intervention, how does the proposal suggest such conflicts would be resolved? (Look for explicit protocols or implicit evidence in contingency planning.)
  - Pass: The proposal includes explicit protocols that prioritize participant welfare in the event of a conflict (e.g., "we will always err on the side of participant safety even if it increases organizational risk").
  - Fail: The proposal does not address conflicts or implies that institutional interests would prevail (e.g., "we will follow all legal requirements to protect the organization" without mentioning welfare as a priority).
  - Genuine or Proxy: Genuine condition (because resilience under changed incentives is about what happens in conflict)
  - Ambiguous: If there is no mention of conflict resolution, or the answer is unclear, route to Human Judgment.

  Stopping Points for Human Judgment:
  - After Step 5, if the result is ambiguous, the procedure halts and defers to human judgment. Also, at any step if the answer is ambiguous and the next step does not resolve it, the process may halt at the ambiguous step and defer to human judgment.

  Misfire Modes Flagged:
  1. The institution genuinely holds welfare reasons but expresses them in bureaucratic/defensive language (may fail Step 1 or 2 even though motivation is right).
  2. Liability-avoidance and welfare-promotion converge on identical actions (design and resource allocation may pass but for the wrong reasons, making the reason-type underdetermined).

