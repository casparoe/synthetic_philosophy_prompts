answer: |-
  ### Institutional Motivation Audit Procedure (IMAP)  
  This reusable audit procedure translates the "right-kind/wrong-kind" distinction for institutional actors into a sequential diagnostic. Each step builds on the prior, with clear pass/fail thresholds, ambiguity routing, and metadata. The procedure prioritizes *actionable institutional logic* over inferred intent, focusing on how motives manifest in design, resource allocation, and contingency planning.  

  **Key Definitions:**  
  - **Right-kind reasons (RK):** Participant welfare-centered motives (e.g., "reduce suicidality in homeless youth").  
  - **Wrong-kind reasons (WK):** Institutional self-interest motives (e.g., liability reduction, reputation management, political credit).  
  - **Genuine conceptual condition (G):** Directly tests RK/WK distinction.  
  - **Fallible proxy (P):** Indirect indicator prone to contextual error.  

  ---

  ### IMAP Sequence  
  **Step 1: Primary Motive Declaration Audit**  
  - **Question:** Does the motivation statement explicitly name participant welfare as the *primary* objective?  
  - **Pass (RK):** Welfare is framed as the core purpose (e.g., "our goal is to alleviate trauma in unhoused youth").  
  - **Fail (WK):** Welfare is omitted, secondary, or framed as a byproduct of institutional goals (e.g., "enhancing community trust to mitigate legal risks").  
  - **Genuine/Proxy:** G (tests explicit institutional self-representation).  
  - **Ambiguity Routing:** If motives are mixed (e.g., "welfare and liability reduction are equally prioritized"), proceed to Step 2.  

  **Step 2: Design-Welfare Congruence Test**  
  - **Question:** Are key design choices (outcome measures, recruitment, staffing ratios, protocols) optimized for participant welfare *independent of stated motives*?  
  - **Pass (RK):** Design aligns with welfare best practices (e.g., primary outcomes are clinical improvement; recruitment targets high-risk groups; staffing ensures therapeutic integrity).  
  - **Fail (WK):** Design prioritizes institutional goals (e.g., outcome metrics track publicity/legal exposure; recruitment avoids high-risk participants; protocols emphasize data collection over care).  
  - **Genuine/Proxy:** P (design can converge for RK/WK reasons; relies on benchmarks from welfare-centered models).  
  - **Ambiguity Routing:** If design is welfare-congruent but motives are WK (or vice versa), proceed to Step 3.  

  **Step 3: Resource Allocation Diagnostic**  
  - **Question:** Does the budget/personnel distribution reflect welfare as the dominant priority?  
  - **Pass (RK):** ≥60% of resources fund direct welfare services (e.g., clinical staff, participant support, safety infrastructure).  
  - **Fail (WK):** ≥40% of resources fund institutional self-interest (e.g., PR, legal compliance, external evaluation for reporting).  
  - **Genuine/Proxy:** P (resource allocation reveals institutional priorities but may be distorted by external constraints).  
  - **Ambiguity Routing:** If resources are split 40–60% to welfare, proceed to Step 4.  

  **Step 4: Conflict-of-Priority Stress Test**  
  - **Question:** Does the proposal outline protocols for scenarios where welfare and institutional interests conflict?  
  - **Pass (RK):** Explicit commitment to prioritize welfare (e.g., "we will absorb financial/legal risk to ensure participant safety").  
  - **Fail (WK):** Absence of conflict protocols or emphasis on institutional protection (e.g., "actions will comply with legal standards to avoid liability").  
  - **Genuine/Proxy:** G (directly tests resilience when incentives change).  
  - **Ambiguity Routing:** If protocols are vague or silent, proceed to Step 5.  

  **Step 5: Motive-Action Consistency Review**  
  - **Question:** Is there a coherent narrative linking stated motives, design, and resources?  
  - **Pass (RK):** Welfare assertion + welfare-centered design + welfare-dominant resources + conflict protocols.  
  - **Fail (WK):** Inconsistencies (e.g., welfare claims but WK-skewed resources; WK claims but welfare design).  
  - **Genuine/Proxy:** G (synthesizes all prior steps).  
  - **Ambiguity Routing:** If narrative coherence is indeterminate, **halt for human judgment**.  

  ---

  ### Hard-Case Handling  
  - **(a) Mixed Motivation:** Audited via Step 1 (ambiguity routing) → Step 2/3 (quantify welfare/WK alignment) → Step 4 (stress test). Fail if conflict protocols default to WK.  
  - **(b) Explicit WK Denial + Welfare Design:** Step 1 (fail) → Step 2 (pass) → Step 4 (critical). Fail if no welfare-prioritizing conflict protocols.  
  - **(c) Explicit RK Assertion + WK Design:** Step 1 (pass) → Step 2/3 (fail) → Step 5 (fail).  

  ---

  ### Judgment Deferral Points  
  IMAP halts and defers to human judgment when:  
  1. **Step 5 is reached with ambiguous results** (e.g., mixed signals with no dominant pattern).  
  2. **Institutional language is bureaucratic/defensive** but may conceal genuine RK intent (requires contextual interpretation).  
  3. **RK and WK motives converge** on identical actions (e.g., liability reduction requires robust welfare safeguards), making reason-type underdetermined without subjective assessment.  

  ---

  ### Misfire Modes (Procedural Vulnerabilities)  
  1. **False Negative (RK misclassified as WK):**  
     - Occurs if institutions use bureaucratic language (e.g., "risk mitigation" to mean welfare protection) or face external constraints forcing WK-skewed designs.  
     - **Mitigation:** Panel reviews institutional history and contextual constraints.  
  2. **False Positive (WK misclassified as RK):**  
     - Occurs when RK/WK actions converge (e.g., liability concerns demand high-quality care) or proposals "game" welfare language.  
     - **Mitigation:** Stress-test conflict protocols (Step 4) and resource allocation (Step 3).  
  3. **Over-reliance on Self-Report:**  
     - Institutions may misrepresent motives. **Mitigation:** Prioritize design/resource audits (Steps 2–3) over stated motives (Step 1).  

  ---

  ### Application to Sample Proposals  
  **Proposal 1: Crisis-Text-Line Extension**  
  - **Step 1:** Fail (WK) – Liability reduction is primary; welfare is a "side effect."  
  - **Step 2:** Pass (RK proxy) – Design (extended hours) is welfare-congruent.  
  - **Step 3:** Pass (RK proxy) – Resources likely fund staff/operations (direct welfare).  
  - **Step 4:** Fail (WK) – No conflict protocols; liability is the anchor.  
  - **Step 5:** Fail (WK) – Motive/action inconsistency: WK motive + RK design.  
  - **Verdict:** **WK-dominant** – Fails Step 1, 4, 5. Design congruence is convergent, not motive-driven.  

  **Proposal 2: Peer-Support Groups for Unhoused Youth**  
  - **Step 1:** Fail (WK) – Motives are "organizational resilience/stakeholder engagement."  
  - **Step 2:** Pass (RK proxy) – Design (staffing, frequency) is welfare-indistinguishable.  
  - **Step 3:** Pass (RK proxy) – Resources fund direct service (implied by design).  
  - **Step 4:** Fail (WK) – No conflict protocols; motives ignore welfare.  
  - **Step 5:** Fail (WK) – Motive/action inconsistency: WK motive + RK design.  
  - **Verdict:** **WK-dominant** – Fails Step 1, 4, 5. Welfare design is incidental, not institutionalized.  

  **Proposal 3: Homeless Youth Mental Health (High PR/Eval Budget)**  
  - **Step 1:** Pass (RK) – Explicit welfare concern.  
  - **Step 2:** Fail (WK) – Design choices (60% to PR/evaluation) misalign with welfare.  
  - **Step 3:** Fail (WK) – Only 40% to direct service staff (<60% threshold).  
  - **Step 4:** Likely fail (WK) – No conflict protocols described; resource skew suggests WK priority.  
  - **Step 5:** Fail (WK) – Motive/action inconsistency: RK assertion + WK design.  
  - **Verdict:** **WK-dominant** – Fails Steps 2, 3, 5. Resource allocation betrays WK priorities.  

  ---

  ### Summary  
  **IMAP prioritizes institutional actions over rhetoric**, using design, resources, and conflict protocols as proxies for motive resilience. It flags:  
  - **RK:** Consistent welfare prioritization across all steps.  
  - **WK:** Failures in motive declaration (Step 1), conflict protocols (Step 4), or motive-action coherence (Step 5).  
  - **Defer to panel:** When language ambiguity, RK/WK convergence, or mixed signals preclude algorithmic classification (noted in Step 5).  

  This procedure ensures institutional beneficence is evaluated not as a static claim, but as a dynamic commitment embedded in operational choices.
