answer: |-
  Here are the desiderata for a normative theory of artistic value that takes Tolstoy's core thesis seriously while accommodating moral resonance asymmetry. I categorize them as **Non-Negotiable** (NN) for any theory adhering to Tolstoy's foundation, **Asymmetry-Sensitive** (AS) required to handle your case, and **Supplementary** (S) addressing broader tensions. Tensions and theory evaluations follow.

  ---

  ### **Core Tolstoyan Desiderata**  
  1. **Emotional Transmission as Essential** (NN)  
     - *Motivation*: Must explain why emotionally hollow "counterfeit" art (e.g., virtuosic but sterile academic paintings) fails as art, while crude but affecting works (e.g., your community mural) succeed.  
     - *Distinctions*: Artistic value ≠ technical mastery; art must *transmit* feeling, not merely depict it.  
     - *Constraints*: Rejects formalist autonomy; aligns with Tolstoy’s *What Is Art?*.

  2. **Fraternity as Telos** (NN)  
     - *Motivation*: Art’s purpose is fostering human unity ("brotherly love"). Must condemn art promoting division (e.g., propaganda) even if emotionally potent.  
     - *Distinctions*: Separates *successful* emotional transmission (feeling shared) from *valuable* transmission (feeling promotes connection).  
     - *Constraints*: Compatible with moral psychology on empathy as a social good.

  3. **Authenticity Requirement** (NN)  
     - *Motivation*: Tolstoy’s rejection of "counterfeit" art hinges on the artist’s sincere feeling. Must differentiate authentic transmission (mural’s directness) from manipulative or formulaic sentiment.  
     - *Distinctions*: Emotional authenticity ≠ emotional intensity; sincerity ≠ moral valence.  
     - *Constraints*: Avoids valorizing emotionally effective but insincere art (e.g., kitsch).

  ---

  ### **Moral Resonance Asymmetry Desiderata**  
  4. **Cross-Community Interpretive Variance** (AS)  
     - *Motivation*: Cases where art (e.g., religious iconography) evokes unity in Group A but revulsion in Group B due to divergent values—*without* technical/authenticity flaws.  
     - *Distinctions*: Reception ≠ intention; emotional efficacy ≠ universal accessibility.  
     - *Constraints*: Must align with anthropology/aesthetics on culturally situated meaning-making.

  5. **Non-Defectiveness Clause** (AS)  
     - *Motivation*: Asymmetry must not stem from technical failure (e.g., poor craftsmanship) or artist insincerity (e.g., ironic detachment). Theory must allow *flawless execution + sincerity* to still yield moral alienation in some contexts.  
     - *Distinctions*: Technical defect vs. moral dissonance; artist sincerity vs. audience reception.  
     - *Constraints*: Rejects Tolstoy’s assumption that "genuine" art universally unites.

  6. **Moral Psychology Integration** (AS)  
     - *Motivation*: Accounts for findings like:  
       - **Sacred value protection** (e.g., art challenging core beliefs triggers revulsion).  
       - **In-group bias** (e.g., communal mural unites locals but alienates outsiders).  
     - *Distinctions*: Emotional transmission ≠ uniform moral response; fraternity may be community-relative.  
     - *Constraints*: Cannot assume a universal moral hierarchy of feelings.

  ---

  ### **Supplementary Desiderata**  
  7. **Transmission Mechanism Clarity** (S)  
     - *Motivation*: How does feeling transmit? Must avoid vagueness while accommodating diverse media.  
     - *Distinctions*: Feeling transmission ≠ intellectual understanding; art ≠ other communication forms.  
     - *Constraints*: Compatible with embodied cognition theories (art as somatic experience).

  8. **Value Pluralism Avoidance** (S)  
     - *Motivation*: Preserve Tolstoy’s anti-pluralist stance—emotional fraternity is *the* core value, not one among many.  
     - *Distinctions*: Artistic value (fraternity) vs. other values (beauty, innovation).  
     - *Constraints*: Rejects "institutional" theories (e.g., Dickie) that decouple value from emotion.

  ---

  ### **Key Tensions**  
  - **Universality vs. Asymmetry (D2 vs. D4/D5)**:  
    Tolstoy’s fraternity is universalist, but asymmetry shows moral resonance is community-relative. **Resolution requires redefining "fraternity" as contextually achievable unity, not global harmony.**  
  - **Authenticity vs. Efficacy (D3 vs. D4/D6)**:  
    Sincere transmission may fail to unite (or repel) due to audience factors. **Theory must decouple artist sincerity from reception success.**  
  - **Non-Negotiable Trilemma (D1+D2+D3 vs. D4+D5)**:  
    If fraternity requires *universal* unity (D2), but asymmetry is irreducible (D4/D5), the theory is contradictory. **D2 must be weakened to "aspires toward fraternity" or "fosters unity within interpretively receptive communities."**  

  ---

  ### **Theory Report Card**  
  | Desideratum                     | Tolstoy’s Theory | Formalism              | Pluralism               |  
  |----------------------------------|------------------|------------------------|-------------------------|  
  | 1. Emotional Transmission (NN)   | ✅               | ❌ (denies necessity)  | ⚠️ (one value among many)|  
  | 2. Fraternity as Telos (NN)      | ✅               | ❌ (amoral)            | ❌ (neutral on purpose)  |  
  | 3. Authenticity (NN)             | ✅               | ❌                      | ⚠️ (optional)           |  
  | 4. Cross-Community Variance (AS) | ❌ (denies asymmetry) | ✅ (ignores meaning)   | ✅                       |  
  | 5. Non-Defectiveness (AS)        | ❌               | ✅                      | ✅                       |  
  | 6. Moral Psychology (AS)         | ❌               | ❌                      | ⚠️ (possible)           |  
  | 8. Anti-Pluralism (S)            | ✅               | ✅ (form-focused)       | ❌                       |  

  - **Tolstoy**: Fails asymmetry (D4/D5/D6) by assuming genuine art *must* unite all. Dismisses your gallery installation correctly but cannot explain the mural’s divisive potential.  
  - **Formalism** (e.g., Bell, Greenberg): Rejects NN desiderata entirely. Art’s value is formal (e.g., "significant form"); moral resonance is irrelevant. Addresses asymmetry only by ignoring it.  
  - **Pluralism** (e.g., Gaut, Scruton): Accommodates asymmetry (D4/D5) but abandons Tolstoy’s monism (D8). Treats emotional transmission as *one* value, so the mural/gallery dispute reduces to subjective preference.  

  ---

  ### **Conclusion**  
  A coherent theory satisfying all NN and AS desiderata **is possible only if it reinterprets fraternity as *local* or *aspirational* unity**, decouples transmission success from universal moral resonance, and integrates moral psychology’s insights on cultural cognition. The mural’s value lies in its authentic transmission of community-specific feeling—even if it alienates others—while the gallery piece fails *as art* due to emotional sterility. Asymmetry isn’t a flaw but evidence of art’s embeddedness in lived moral worlds. Tolstoy’s framework survives if scaled from universalist claims to contextually grounded emotional ethics.
