  ### Moral Revolution Assessment Procedure  
  Below is a sequential checklist for your ethics review panel. It requires yes/no answers, includes stopping conditions, and flags steps where human judgment is essential. The procedure must terminate after 30 minutes.  

  **Decision Procedure Checklist**  
  1. **Harm Acknowledgement**: Is the targeted practice widely recognised as causing direct, non-trivial harm to individuals or society?  
     - *Stopping condition*: If **no**, return *'not a moral revolution'*.  
     - *Judgment call*: "Widely recognised" is subjective—panel must assess public consensus.  

  2. **Moral Core**: Is the push primarily framed in moral terms (e.g., justice, rights, dignity) rather than efficiency or profit?  
     - *Stopping condition*: If **no**, return *'not a moral revolution'*.  
     - *Judgment call*: Distinguishing moral rhetoric from practical justifications requires interpretation.  

  3. **Sustained Discourse**: Has there been public, evidence-based debate about the moral status of the practice for over 5 years?  
     - *Stopping condition*: If **no**, return *'not a moral revolution'*.  
     - *Judgment call*: Panel must gauge duration and depth of discourse without strict metrics.  

  4. **Advocate Motivations**: Are key advocacy groups driven by moral conviction, not economic/political self-interest?  
     - *Stopping condition*: If **no**, return *'not a moral revolution'*.  
     - *Judgment call*: Inferring motives requires subjective analysis of actions/statements.  

  5. **Resistance Basis**: Is resistance primarily grounded in preserving power, profit, or privilege?  
     - *Judgment call*: Answer does not stop the procedure but informs classification.  

  6. **Honour Dynamics**: Do advocates/resistors invoke social status, shame, or prestige (e.g., "industry leadership," "reputational risk")?  
     - *Classification trigger*: If **yes** at this stage, and previous steps passed, flag *honour-driven*.  
     - *Judgment call*: Identifying "honour" language is interpretive.  

  **Classification Rules**  
  - Pass steps 1–4 → Moral revolution.  
    - If step 5 = **yes** → Classify as *argument-driven* (rational debate overcoming vested interests).  
    - If step 5 = **no** and step 6 = **yes** → Classify as *honour-driven* (status games dominate).  
    - If step 5 = **no** and step 6 = **no** → Classify as *argument-driven* (default).  
  - Any step 1–4 fails → *Not a moral revolution*.  

  ---

  ### Application to Proposals  
  #### 1. Banning predictive policing APIs  
  - **Step 1 (Harm)**: **Yes**. Bias in predictive policing is widely documented to harm marginalised communities (e.g., racial profiling).  
  - **Step 2 (Moral Core)**: **Yes**. Advocates use moral terms like "racial justice" and "fairness."  
  - **Step 3 (Discourse)**: **Yes**. Academic and public debates on algorithmic bias span 10+ years.  
  - **Step 4 (Advocates)**: **Yes**. Groups like the ACLU and Algorithmic Justice League foreground ethics over profit.  
  - **Step 5 (Resistance)**: **Yes**. Police departments/vendors resist to protect budgets and authority.  
  - **Step 6 (Honour)**: **No**. Minimal status language; focus on harm/rights.  
  - **Classification**: Moral revolution (*argument-driven*). Rational debate challenges power structures.  

  #### 2. Mandating open-source disclosure in government contracts  
  - **Step 1 (Harm)**: **No**. Lack of transparency causes indirect harm (e.g., corruption risk), but not "direct" or universally acknowledged.  
  - **Stopping condition triggered**: **Not a moral revolution**.  
  - **Why judgment was key**: Harm is debatable—panel must decide if opacity equals "significant harm."  

  #### 3. Adding carbon-footprint badges to cloud invoices  
  - **Step 1 (Harm)**: **Yes**. Climate change is globally recognised as harmful; tech’s carbon contribution is well-documented.  
  - **Step 2 (Moral Core)**: **Yes**. Framed as "corporate responsibility" and "ecological ethics."  
  - **Step 3 (Discourse)**: **Yes**. Climate ethics debated for decades; IT-specific carbon discussions began ~2010.  
  - **Step 4 (Advocates)**: **Yes***. Environmental NGOs (e.g., Greenpeace) push moral duty, but *judgment call*: Some vendors may profit from "green" branding. Panel must weigh moral intent as primary.  
  - **Step 5 (Resistance)**: **No**. Cloud providers resist over cost and technical feasibility, not privilege (e.g., "measurement complexity").  
  - **Step 6 (Honour)**: **Yes**. Dominant language includes "industry leadership," "shaming polluters," and "ESG rankings."  
  - **Classification**: Moral revolution (*honour-driven*). Status incentives (e.g., avoiding shame) outweigh rational argument.  
  - **Unwelcome insight**: Panel may dislike attributing environmentalism to status games, but honour dynamics are clear.  

  **Where Judgment Replaces Automation**  
  - Steps 1, 2, 4, and 6 rely entirely on subjective interpretation (e.g., "moral framing," "advocate motives").  
  - The procedure forces human decisions at every step; it only automates sequencing and stopping conditions.  

  Verdict: carbon-footprint badges
