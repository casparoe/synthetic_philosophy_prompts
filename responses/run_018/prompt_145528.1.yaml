answer: |-
  The lottery and preface paradoxes reveal a single structural asymmetry: rational agents should withhold acceptance from individual lottery-ticket losses due to context-sensitive per-item justification thresholds, while accepting the collective loss claim because aggregate justification crosses a distinct global threshold tied to the decision problem's scope.

  Rational acceptance isn't uniform but indexed to the stakes and scope of the practical context. For each individual lottery ticket, the high probability of loss remains below the threshold for outright acceptance in contexts demanding near-certainty (justified by the catastrophic cost of being wrong about a specific winner), mandating withheld belief. However, the aggregate proposition that *some* ticket loses possesses virtual certainty, crossing a lower global justification threshold sufficient for acceptance within the broader decision context (e.g., planning based on a guaranteed loser existing). The preface paradox similarly stems from conflating thresholds: individual assertions meet high local justification standards for inclusion, while the preface's collective error concession acknowledges that the aggregate justification for *all* being true falls below the global threshold required for the book as a whole, reflecting the asymmetry in how justification aggregates across disjoint domains versus unifying into a single collective claim. (178 words)
