  Please argue for the position that the lottery paradox and the preface paradox are not parallel failures of rational belief, but manifestations of a single structural asymmetry in how justification aggregates across disjoint domains. Specifically, defend the view that a rational agent should withhold acceptance of each individual lottery-ticket loss—because the high per-ticket probability falls below a context-sensitive practical threshold—while still accepting the collective claim that some ticket will lose, since the aggregate justification crosses a distinct global threshold tied to the decision problem as a whole. Treat "acceptance" not as a uniform global doxastic state, but as indexed to the stakes and scope of the practical context in which the belief is deployed. Lead with your bottom line in one sentence, then present the argument in a single paragraph of no more than 180 words.
