  Can you explain how epistemicism and supervaluationism diverge on second-order vagueness, especially when the margin-for-error principle is turned back on itself? Like, if there's a sharp unknown cutoff for being bald, is there also a sharp unknown cutoff for being definatly bald? I keep running into this notion of 'shadow boundaries' — zones where we don't just not know the cutoff, but don't know how wide our ignorance is — and I'm not sure if that's a genuine problem for the epistemicist or just a confusing way to frame things. Can you untangle whether supervaluationism avoids this entirely, or whether it just relocates the problem into the sharpenings?
