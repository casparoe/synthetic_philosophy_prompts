prompt: |-
  I'm on the staff of a reconciliation NGO that runs structured dialogue circles between ex-combatants from conflicts where the justice of the cause is still disputed — think occupation vs resistance scenarios, but I'm not naming specific ones. We keep fighting over whether the moral equality of combatants means we seat everyone symetricaly, or whether fighting for an unjust cause strips you of that equal standing. I need an actual decision procedure my facilitators can run before each session: a sequence of questions they ask about the specific participant, with clear stopping rules for when we treat them as morally equal vs when we apply asymmetrical framing, and explicit flags for where the answer is a value judgment not a factual check.

  The procedure needs to be grounded in the independence thesis — that jus in bello rights don't depend on jus ad bellum — but it also has to deal with the revisionist pushback that unjust-side combatants aren't innocent in the same way. So build in checks for: direct vs indirect responsibility for the unjust war, the combatant's actual epistimic access to the justice of the cause (the epistimic risk problem — if we can't verify belief states, what do we default to?), and whether they engaged in ordinary fighting vs direct war crimes. For each check, say what counts as a passing answer, what fails it, and where the procedure just throws up its hands and asks the facilitator to make a call.

  Then apply it to three people we're actually seeing next month: a conscripted foot soldier from the aggressor side who says he believed state propaganda; a volunteer strategist from that same side who designed logistics but never pulled a trigger; and a defensive fighter who killed prisoners in reprisal. I want the procedure to give me answers I might hate — especially if it says the volunteer strategist still gets symmetrical seating — and I want you to mark exactly where the procedure breaks down because we're guessing at internal mental states. Don't ask me to cite Walzer or anyone else; I just need the logic made runnable, with the hard edges left visible, since I'm running these twice a week with no research staff.
reasoning: |-
  Okay, the user works for a reconciliation NGO that runs dialogue circles between ex-combatants from conflicts where the justice of the cause is still disputed. They're struggling with whether to seat participants symmetrically based on moral equality or asymmetrically if one side fought for an unjust cause. They need a practical decision procedure that facilitators can use before each session.

  The user specifically wants this procedure grounded in the independence thesis (jus in bello independent of jus ad bellum) but also addressing revisionist critiques about combatant innocence. They need checks for: direct vs indirect responsibility, epistemic access to the cause's justice, and whether they engaged in ordinary fighting vs war crimes. For each check, clear passing/failing criteria and where facilitators must make judgment calls.

  They also want this applied to three real cases: a conscripted foot soldier who believed propaganda, a volunteer strategist who designed logistics, and a defensive fighter who killed prisoners. Importantly, they want the logic to be operational - even if it produces uncomfortable conclusions - and want the uncertainty around internal states explicitly marked.

  I need to design this as a flowchart-like procedure with concrete questions. The core tension is balancing Walzer's symmetry principle ("moral equality of combatants") with revisionist challenges (unjust combatants aren't morally "innocent"). Since facilitators aren't philosophers, I'll avoid academic citations and focus on actionable logic.

  Key components to build in:
  1. **Responsibility Check**: Distinguish between contributing to the war effort generally (which revisionists might still problematize) vs direct causal links to aggression. Passing = no direct responsibility for initiating unjust war; failing = high command/decision-makers.

  2. **Epistemic Access Check**: The trickiest part - we can't truly know beliefs. Need proxies like role, access to information, and consistency of testimony, with clear "uncertainty flags" where we default to symmetry. Passing = credible belief in just cause OR role preventing knowledge access; failing = clear evidence of knowing the cause was unjust.

  3. **Conduct Check**: Where jus in bello actually applies. Passing = fought within laws of war; failing = committed war crimes. This is more objectively verifiable.

  The procedure should cascade - if someone fails any check, they get asymmetrical framing. Only if they pass all three do they get symmetrical treatment. But I need to define "asymmetrical framing" concretely (e.g., labeled as "perpetrator" vs "victim" in dialogue? Different seating?).

  For the three test cases:
  - **Conscripted foot soldier**: Likely passes responsibility check (low agency), passes epistemic check (plausible belief in propaganda), but need to verify conduct. If no war crimes, symmetrical - which might upset some staff.
    
  - **Volunteer strategist**: Fails responsibility check? Wait - designing logistics is indirect. But as a volunteer in higher role, might fail epistemic check if we infer they should have known. Big judgment call here. If we accept their stated beliefs, they might still pass and get symmetry - exactly the "hated outcome" user wants to test.

  - **Defensive fighter**: Passes responsibility (just side) and epistemic (likely knew cause was just), but fails conduct check due to killing prisoners -> asymmetrical framing as perpetrator despite fighting for just cause.

  I need to make the "judgment call" moments very visible - especially around inferring knowledge. Facilitators should note when they're making a value-based leap. Also, where evidence is contradictory, default to symmetry to avoid premature moral judgments.

  The procedure should end with explicit output: "SYMMETRICAL" or "ASYMMETRICAL FRAMING REQUIRED (specify why: responsibility/epistemic/conduct)" plus flags about uncertainty. This gives facilitators clear next steps for session design.
answer: |-
  Here's a decision procedure grounded in the independence thesis but incorporating revisionist concerns into actionable checks. It's designed as a **5-step flowchart** with binary questions, stopping rules, and explicit uncertainty flags. Facilitators must document answers at each step.

  ---

  ### **Pre-Session Moral Standing Procedure**
  **Output:** SYMMETRICAL (full moral equality) / ASYMMETRICAL (reduced standing)  
  **Materials Needed:** Participant file, pre-interview notes, verified conflict records.  
  **Time Limit:** 15 mins per participant. If uncertainty exceeds 2 flags → Default to SYMMETRICAL.

  #### **Step 1: Conduct Check**  
  *Focus: Individual jus in bello violations (objective acts)*  
  **Question:** *Did the participant directly engage in acts universally recognized as war crimes (e.g., torture, killing non-combatants, pillage)?*  
  - **Passing Answer:** NO (or only participated in lawful combat operations).  
  - **Failing Answer:** YES (acts verified by trusted sources: UN reports, court records, credible witnesses).  
  - **Uncertainty Flag:** If evidence is contested or unverified → Mark **"Conduct Uncertain"** and proceed to Step 2.  
  **Stopping Rule:** FAIL → Output ASYMMETRICAL (label: **"War Crime Perpetrator"**). PASS/UNCERTAIN → Proceed to Step 2.

  #### **Step 2: Role Responsibility Check**  
  *Focus: Direct causal contribution to unjust harm (revisionist concern)*  
  **Question:** *Was the participant’s role directly responsible for planning/ordering *specific* acts of aggression (e.g., commanding invasions, designing ethnic cleansing)?*  
  - **Passing Answer:** Role was support/logistics/defensive *or* combat in contested zones without verified targeting of civilians.  
  - **Failing Answer:** Role involved strategic command (e.g., general, intelligence architect) with verified unlawful orders.  
  - **Uncertainty Flag:** If role had ambiguous authority (e.g., mid-level officer) → Mark **"Responsibility Uncertain"** and proceed.  
  **Stopping Rule:** FAIL → Output ASYMMETRICAL (label: **"Unjust Aggression Architect"**). PASS/UNCERTAIN → Proceed to Step 3.

  #### **Step 3: Epistemic Access Check**  
  *Focus: Credibility of claimed belief in cause’s justice (the "epistemic risk" problem)*  
  **Question:** *Is there strong evidence the participant *knew or should have known* their cause was unjust, given their position/access?*  
  - **Passing Answer:** Plausible ignorance (e.g., low-rank, state propaganda, no access to dissent).  
  - **Failing Answer:** Evidence of access to truth (e.g., educated elite, dissent documents in possession, public atrocities witnessed).  
  - **Uncertainty Flag:** Always mark **"Epistemic Uncertain"** (belief states are unverifiable). Use proxies:  
    - If high-rank + volunteer → Lean FAIL.  
    - If conscript + minimal education → Lean PASS.  
  **Stopping Rule:** FAIL → Output ASYMMETRICAL (label: **"Knowing Unjust Agent"**). PASS → Proceed to Step 4.

  #### **Step 4: Causality Proximity Check**  
  *Focus: Indirect contribution to unjust harm (revisionist "shared burden" concern)*  
  **Question:** *Did the participant’s actions *directly enable* unjust campaigns (e.g., supplying weapons to a death squad) vs. general war support?*  
  - **Passing Answer:** Actions were generic combat/support (e.g., infantry, non-targeted logistics).  
  - **Failing Answer:** Actions directly enabled atrocity (e.g., transporting prisoners to execution sites).  
  - **Uncertainty Flag:** If link is indirect (e.g., routine supply chains) → Mark **"Causality Uncertain"** and proceed.  
  **Stopping Rule:** FAIL → Output ASYMMETRICAL (label: **"Enabler of Atrocity"**). PASS/UNCERTAIN → Proceed to Step 5.

  #### **Step 5: Default Symmetry Rule**  
  *Focus: Independence thesis fallback*  
  **Question:** *Did the participant pass all prior checks (or have uncertainty flags)?*  
  - **Output SYMMETRICAL** if:  
    - No definitive FAIL in Steps 1–4, OR  
    - >2 uncertainty flags (default to independence thesis).  
  - **Label:** "Combatant (Moral Equality)".

  ---

  ### **Application to Your Cases**
  **Assumptions:**  
  - All fought for "Aggressor Side" except Case 3 (defensive).  
  - No perjury detected in pre-session interviews.  
  - "Unjust cause" = predetermined per your NGO’s conflict analysis.

  #### **Case 1: Aggressor-Side Conscripted Foot Soldier**  
  - **Step 1 (Conduct):** No war crimes alleged → PASS.  
  - **Step 2 (Role):** Low-rank combatant → PASS.  
  - **Step 3 (Epistemic):** Claims believed propaganda. **Uncertainty Flag** (can’t verify belief) → PASS by proxy (low-rank + conscript).  
  - **Step 4 (Causality):** Generic combat role → PASS.  
  - **Step 5:** PASS all → **SYMMETRICAL**.  
  **Hard Edge:** Epistemic uncertainty ignored due to role proxy.

  #### **Case 2: Aggressor-Side Volunteer Strategist (Logistics)**  
  - **Step 1 (Conduct):** Never pulled trigger; no crimes alleged → PASS.  
  - **Step 2 (Role):** Logistics design ≠ direct aggression → PASS.  
  - **Step 3 (Epistemic):** Volunteer + high education. **Uncertainty Flag** but proxy (high-rank + volunteer) → **FAIL** (ought to have known).  
  - **Stopping Rule:** Step 3 FAIL → **ASYMMETRICAL (Label: "Knowing Unjust Agent")**.  
  **Why You Might Hate This:** Despite no direct violence, epistemic fail denies symmetry. *Uncertainty overruled by volunteer status.*

  #### **Case 3: Defensive Fighter Who Killed Prisoners**  
  - **Step 1 (Conduct):** Killing prisoners = war crime → **FAIL**.  
  - **Stopping Rule:** Step 1 FAIL → **ASYMMETRICAL (Label: "War Crime Perpetrator")**.  
  **Note:** Just cause (defense) irrelevant per independence thesis. Conduct fails override ad bellum status.

  ---

  ### **Procedure Breakdown Notes**
  1. **Unverifiable Beliefs (Epistemic Check):**  
     - Proxies (role/education/volunteer status) are **value judgments**. Facilitators must note: *"Asymmetry based on inferred knowledge due to role."*  
  2. **Ambiguous Roles (Causality Check):**  
     - "Direct enablement" is subjective. Default to PASS unless evidence ties actions to specific atrocities.  
  3. **Default Symmetry:**  
     - The procedure prioritizes independence thesis when doubt persists (>2 flags). This accepts revisionist concerns but walls them off behind high evidence thresholds.  
  4. **Facilitator Burden:**  
     - All FAILs require attaching a label (e.g., "War Crime Perpetrator") for asymmetrical framing.  
     - SYMMETRICAL participants are never described as "innocent"—only "morally equal in combatant status."

  **Final Output Example**  
  | Participant | Step 1 | Step 2 | Step 3 | Step 4 | Outcome | Labels |  
  |-------------|--------|--------|--------|--------|---------|--------|  
  | Conscript   | PASS   | PASS   | PASS*  | PASS   | SYMMETRICAL | None |  
  | Strategist  | PASS   | PASS   | FAIL   | (N/A)  | ASYMMETRICAL | "Knowing Unjust Agent" |  
  | Defender    | FAIL   | (N/A)  | (N/A)  | (N/A)  | ASYMMETRICAL | "War Crime Perpetrator" |  
  *\*With Epistemic Uncertainty Flag*

  This forces hard choices: the strategist is asymmetrical due to *inferred knowledge*, while the conscript is symmetrical despite the same unjust cause. War criminals are asymmetrical regardless of side. Run it as written—even when it stings.
