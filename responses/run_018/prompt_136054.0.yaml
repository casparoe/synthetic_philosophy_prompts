  The simulation involves dividing students into two factions: one using guilt-based mechanisms, the other shame-based. Each gets a hidden Ontological Framework card—either the self as a stable moral ledger or a performative social position. The key is that these cards remain hidden until after they design their protocols. Then, during the negotiation phase, they reveal the cards and have to reconcile their emotional architecture with their implicit metaphysics. The debrief should connect each phase to the philosophical question of whether a culture can choose its dominant moral emotion or if it's fixed by prior commitments.

