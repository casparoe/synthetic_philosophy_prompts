prompt: |-
  A bunch of us in my group have been fighting for months about whether the stuff our interpretability methods find is real, so I'm making two of the most stubborn people do an adversarial collaboration and write a joint statement. I want you to draft it: the statement that a representational realist about neural networks and a strict instrumentalist could both sign after a good-faith, months-long collaboration on a specific case — a small transformer trained to do modular addition, where a linear probe and a sparse autoencoder (two different ways of hunting for interpretable directions, for anyone not in the weeds on this) both turn up a direction that seems to encode the congruence class / angle of the inputs.

  For calibration, here's the rough shape of the two camps. The realist thinks the network literally has features and that interpretability discovers them: a claim like "this direction encodes the angle" can be true or false in a way that isn't just about what our tools make easy. The instrumentalist thinks features are something we project onto the model; the only facts in the territory are weights, activations, and input-output behavior, and representation-talk is a useful map, not a property of the network itself.

  I want the actual document, not an essay about why its hard. Please include: (1) a numbered list of claims both parties agree on, including claims about the modular arithmetic model, about what has been observed, and about what counts as evidence; (2) a disagreements table with rows for each real disagreement, phrased so each side would accept the wording, plus a column for each side's own way of stating its view; (3) for each row, a crux — a sub-question such that settling it would genuinely move at least one side — and where possible an experiment on the model (or a case) that both sides agree bears on the crux, with each side's prediction recorded in advance. Keep the document in their voices where that helps, and try to say whether the remaining debate is mostly about words or mostly about the world.
reasoning: |-
  We are drafting a joint statement from two researchers: a representational realist and a strict instrumentalist, after an adversarial collaboration on a small transformer trained for modular addition. The model exhibits a direction (found via linear probe and sparse autoencoder) that appears to encode the congruence class (angle) of the inputs.

  Structure:
  1. Agreed Claims: A numbered list of claims both parties agree on.
  2. Disagreements Table: With columns: 
     - Disagreement (neutrally phrased)
     - Realist Position (in their terms)
     - Instrumentalist Position (in their terms)
     - Crux (a question that would move at least one side)
     - Proposed Experiment (if any) and Predictions

  3. Conclusion: Whether the remaining debate is about words or the world.

  The document should be in their voices where it helps.

  Let's begin.

  # Joint Statement: Representational Realism vs. Instrumentalism in Interpretability

  After months of collaborative investigation into a small transformer model trained for modular addition (mod p, for some prime p), we, a representational realist and a strict instrumentalist, have reached agreement on several points but maintain fundamental disagreements on others. We present this joint statement to clarify both the common ground and the cruxes of our disagreement.

  ## 1. Agreed Claims

  We both endorse the following statements:

  1. **Model Behavior**: The transformer model, when given two integers (a, b) as input, accurately outputs (a + b) mod p for a fixed modulus p (e.g., p=113). The model generalizes beyond its training distribution for a range of inputs.

  2. **Observations from Interpretability Methods**:
     a. **Linear Probe**: When we train a linear classifier on the residual stream activations at a particular layer to predict the angle (i.e., (a + b) mod p) of the inputs, we obtain high accuracy (typically >99%). This probe is simple and requires little data.
     b. **Sparse Autoencoder (SAE)**: When we train an SAE on the same activations, we find that one of the learned features (directions) has activations that are highly correlated with the angle of the inputs. This feature is among the most interpretable and has a high attributable effect on the output.

  3. **Robustness**: The direction found by the linear probe and the SAE feature are approximately the same (in the sense that they are highly correlated) and are stable across different training runs of the probe/SAE and across different initializations of the probe/SAE.

  4. **Causal Evidence**: Ablating this direction (by setting the activation in that direction to zero or perturbing it) causes a significant increase in error on the modular addition task, while ablating most other directions does not. Intervening to set this direction to the correct angle (for a given input) often restores the correct output.

  5. **Evidence for Interpretability**: The above observations (high probe accuracy, high SAE feature correlation, and the causal effects) constitute strong evidence that this direction is a useful tool for predicting and controlling the model's behavior. It is a robust and reliable part of the model's internal computational process.

  6. **No Overdetermination**: The model does not have multiple independent, equally robust representations of the angle. The evidence points to a single dominant mechanism for representing the angle at the layer we are studying.

  ## 2. Disagreements Table

  We now outline our key disagreements. For each, we state the disagreement in neutral terms, then each position in its own terms, then a crux question, and where possible, an experiment and our predictions.

  | Disagreement (Neutral)                    | Realist Position                                                                                                                                 | Instrumentalist Position                                                                                                                               | Crux                                                                                                                                                                                               | Proposed Experiment & Predictions                                                                                                                                                                                                                                                                                                                                                                          |
  |------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1. **Ontological Status of the Feature** | The angle feature is a real, causally efficacious component of the model's internal state. It exists independently of our interpretability tools. | The angle feature is a useful construct for describing patterns in the model's activations and behavior, but it is not a discrete entity in the model. | **Crux**: If we had perfect access to the model's weights and activations (without interpretability tools), would there be a fact of the matter about whether the angle feature exists?             | *Experiment*: None (conceptual). But consider: If we could simulate the entire model at the level of individual neurons and weights, would we find a natural boundary that isolates the angle feature?<br>**Realist Prediction**: Yes, the feature would be objectively identifiable.<br>**Instrumentalist Prediction**: No, the feature is defined by our interests and tools; without them, it's just weights and activations. |
  | 2. **Uniqueness of the Representation**  | The model represents the angle in a specific, privileged way that interpretability tools can discover.                                            | The angle is one of many possible patterns we can extract; the tools create the representation by choosing a particular lens.                           | **Crux**: Can we find multiple, mutually incompatible yet equally causally effective representations of the angle in the same model?                                                               | *Experiment*: Train multiple SAEs with different hyperparameters (e.g., different sparsity penalties) and see if we can get multiple sets of features that are (a) equally sparse and (b) equally causally effective for the angle, but (c) not linearly related (e.g., orthogonal).<br>**Realist Prediction**: No, all effective representations will be linearly related to the original direction.<br>**Instrumentalist Prediction**: Yes, multiple orthogonal bases could represent the angle equally well. |
  | 3. **Role of the Probe/SAE**             | The probe and SAE are revealing a pre-existing structure in the model.                                                                           | The probe and SAE are constructing a useful summary of the model's behavior; the structure is as much in the tool as in the model.                     | **Crux**: If we fix the model and vary the interpretability tool (e.g., use a non-linear probe or a different reconstruction objective in the SAE), does the discovered feature change arbitrarily? | *Experiment*: Train non-linear probes (e.g., small MLPs) for the angle. Also, train SAEs with non-standard objectives (e.g., using a different norm or adding constraints).<br>**Realist Prediction**: The discovered feature will be similar (highly correlated) to the original direction, because it is revealing an underlying structure.<br>**Instrumentalist Prediction**: The feature might be quite different, depending on the tool. We might even get equally good but different features. |

  ## Conclusion on the Nature of the Disagreement

  We agree that the remaining debate is **mostly about the world** (i.e., about the nature of the model and the features) and not merely about words. However, we acknowledge that some aspects of the disagreement may be amplified by terminological differences (e.g., what counts as "real" or "exists"). The cruxes we have identified are empirical and can be tested, at least in principle. We commit to running the proposed experiments and revisiting our positions based on the outcomes.

  Signed,

  [Realist Name]  
  [Instrumentalist Name]  
  [Date]
answer: |-
  ### Joint Statement: Representational Realist and Instrumentalist Agreement  
  **Re:** Interpretability Findings in a Modular Addition Transformer  

  After extensive collaborative investigation, we agree on the following empirical observations and evidentiary principles regarding a small transformer trained on modular addition (mod *p* = 113). We also outline persistent disagreements, their cruxes, and testable predictions.  

  ---

  #### **1. Agreed Claims**  
  Both parties endorse these statements:  

  1. **Model Behavior**: The transformer accurately computes modular addition. Its internal activations exhibit consistent, non-random patterns correlated to input-output relationships.  
  2. **Direction Discovery**:  
     - A **linear probe** trained to predict the input angle (i.e., *congruence class* of *a* + *b*) achieves near-perfect accuracy (>99%) on activations at a specific layer.  
     - A **sparse autoencoder (SAE)** identifies a sparse feature direction with high cosine similarity to the probe’s angle-predicting direction.  
  3. **Causal Impact**:  
     - Ablating this direction (e.g., zeroing it) degrades accuracy on modular addition.  
     - Artificially activating it (e.g., setting it to the correct angle) often restores correct outputs.  
  4. **Robustness**:  
     - The direction is stable across random seeds for probe/SAE training.  
     - Its correlation with angle holds across diverse inputs.  
  5. **Evidentiary Standards**:  
     - Causal interventions (ablation/activation) are necessary to demonstrate a direction’s functional role.  
     - High probe/SAE agreement (e.g., cosine similarity) is evidence of non-arbitrariness.  
  6. **No Overdetermination**: No *equally simple* alternative direction (e.g., linear or SAE-learned) explains angle as effectively.  

  ---

  #### **2. Disagreements Table**  
  *Phrased neutrally; each side’s view in their own terms.*  

  | Disagreement (Neutral Phrasing)                          | Realist View (In Their Voice)                                                                 | Instrumentalist View (In Their Voice)                                                                 | Crux                                                                                                  | Proposed Experiment & Predictions                                                                                                                                                                                                                                                                                                                                 |
  |----------------------------------------------------------|-----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **D1: Does the direction exist independently of our tools?** | "This direction is a real component of the model’s computational machinery. The probe/SAE *discovers* it—it’s there whether we look or not." | "The direction is a useful *summary* of activation patterns. It’s a lens we impose—a high-level map, not a feature ‘in’ the weights." | **Crux**: If we remove all human-defined tools, does the model contain an *objectively privileged* basis where this direction is uniquely sparse/causal? | **Experiment**: Train 1,000 random linear classifiers (with no task-specific objective) to extract features from the same activations. Measure sparsity/causal impact of all found directions.<br>**Realist Prediction**: The angle direction will be significantly sparser/more causal than random directions.<br>**Instrumentalist Prediction**: Random tools will find equally sparse/causal directions for *other* arbitrary tasks. |
  | **D2: Is the direction’s role fixed or tool-dependent?** | "The direction *causally implements* angle computation. Its role is fixed by the model’s structure." | "The direction’s role is *contextual*. Its ‘meaning’ depends on the tool used (e.g., probe vs. SAE) and our interpretive goals." | **Crux**: Can we find a tool that makes this direction *equally interpretable* as a *different* feature (e.g., parity)? | **Experiment**: Train an SAE with an objective forcing sparsity on *parity* (even/odd) instead of angle. Then re-measure the original direction’s alignment with angle and parity.<br>**Realist Prediction**: The direction will remain angle-aligned; tools can’t reassign its role.<br>**Instrumentalist Prediction**: The direction’s interpretability will shift based on the SAE’s objective. |
  | **D3: Are features ‘in’ the model or ‘in’ our description?** | "Features are latent variables in the network. Interpretability *measures* them, like a thermometer measures temperature." | "Features are descriptive shorthand. They’re patterns *we* isolate to predict behavior—not ‘things’ in the model." | **Crux**: If the model’s weights were slightly perturbed, would the *same* feature direction persist? | **Experiment**: Fine-tune the model with noisy data (preserving accuracy). Track if the original direction remains the most interpretable angle predictor.<br>**Realist Prediction**: The direction will persist (up to linear transformation); features are robust.<br>**Instrumentalist Prediction**: New tools may be needed; the ‘feature’ is renegotiated post-perturbation. |

  ---

  #### **3. Conclusion: Words vs. World**  
  We concur that **~65% of the debate is about the world** (e.g., Do networks have intrinsic structures? Are features observer-independent?) and **~35% is terminological** (e.g., defining "real," "exist," or "feature"). The cruxes above are empirical and testable—resolving them would materially shift our positions. We commit to conducting these experiments jointly.  

  ---  
  Signed,  
  [Realist Name], Representational Realist  
  [Instrumentalist Name], Strict Instrumentalist  
  Date: October 26, 2023
