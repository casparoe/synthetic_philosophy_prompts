prompt: |-
  hey im drafting a novel about a biographer obsesed with hagiograpy and its kinda breaking my brain. can you write a joke where the punchline actually turns on the gap between Plutarchs parallel lives being meant as moral mirrors and hagiography just turning saints into unreachable cartoons? i want it to land for people who actually think about biography as moral education, not a generic writer gag. write casual, maybe with a typo.
reasoning: |-
  Okay, the user is drafting a novel about a biographer obsessed with hagiography and feeling mentally overwhelmed. They specifically want a joke that highlights the gap between Plutarch's *Parallel Lives* (intended as moral mirrors) and hagiography (which turns saints into unattainable caricatures). 

  Hmm, this is niche but fascinating. The user clearly knows their stuff—they're referencing Plutarch's purpose versus how saints' lives get flattened into impossible ideals. They don't want a generic "writer struggle" joke; it needs to land for people who see biography as moral pedagogy. 

  Key angles to hit:
  - Plutarch's realism: flawed heroes meant for emulation ("mirrors")
  - Hagiography's distortion: saints as inhumanly perfect ("cartoons")
  - The *moral education* angle is crucial—this isn't about writing mechanics

  Also, they asked for casual tone + intentional typo. "Obsesed" in their query feels like a cue—maybe mirror that. 

  Brainstorming punchlines: 
  The "mirror" metaphor is gold. A biographer staring into Plutarch sees a relatable reflection (flaws and all), while hagiography shows an impossible cartoon saint. Visual gag potential: squinting at a funhouse mirror vs. a flat drawing. 

  User's exhaustion ("breaking my brain") suggests the joke should taste like writerly despair. Maybe end with the biographer defeated—"sitting in the dark" after the mirror cracks. That feels novel-appropriate. 

  ...Wait, "fridge magnet saint" as the cartoonish ideal? Yes—tiny, simplified, stuck to a surface. Perfect contrast to Plutarch's full-blooded portraits. 

  Final structure: 
  1. Set up the biographer's goal (moral education) 
