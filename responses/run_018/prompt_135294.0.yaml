answer: |-
  The structural embedding of old evidence as a hyperparameter constraint creates representational, not evidential, redundancy, and there is no rational pressure to revise credences in H differently based on the pathway taken; the distinction arises solely from modelling choices rather than genuine epistemic novelty. 

  Classical Bayesian conditioning addresses object-level belief updating: encountering E directly triggers likelihood-based revision via \(P(H|E)\). If E is already fully absorbed into the prior \(P_0(H)\), re-encountering E yields \(P(H|E) = P_0(H|E)\), as \(P(H|E, E)\) is identical by the laws of probability. This is the old-evidence problem proper—diachronic norms like conditionalisation forbid credence shifts from known evidence.  

  In hierarchical models, E’s role shifts: as a fixed hyperparameter constraint for model M, E is not *observed data* for conditioning but a *structural requirement* that M must satisfy (e.g., M is chosen such that \(P_M(E) = 1\)). Calibrating M to satisfy E involves model selection, not belief updating within a fixed model. Here, E functions epistemically as a *justificatory criterion* for adopting M, akin to theoretical virtues like simplicity. Recognising M satisfies E doesn’t supply *new evidence*; it confirms M’s adequacy relative to background knowledge.  

  Crucially, the two pathways—object-level updating on E and meta-level calibration fixing E—describe the same epistemic state through distinct representational lenses. If the agent’s total evidence includes E, then selecting M to embed E as a constraint merely re-expresses that evidence’s prior incorporation. Using M then to compute \(P_M(H|E)\) outputs the *same* credence as \(P_0(H|E)\) under a flat model. Any *apparent* double-counting stems from redundantly encoding E in both prior and structure, not from acquiring new justification.  

  Thus, the classical old-evidence problem ends where E is treated as uncertain data for conditioning. The distinct problem of hierarchical specification begins when E is elevated to a meta-constraint: but this imposes no additional rational pressure, as calibration utilises E *as prior knowledge*, not fresh evidence. Diachronic coherence norms remain inviolate; the agent revises beliefs only if new evidence emerges, not from redescribing old evidence architecturally.
