prompt: |-
  hey — I'm in a small reading group on political obligation (we're working through the usual candidate grounds for a duty to obey the law: consent, fair play, the natural-duty move, and the objections to each — no fixed text) and I built an argument to shut my friend up and now it's shutting me up instead. He says civil disobedience is just lawbreaking with better PR and no special moral status. I said no, the injustice of the law is what makes it a distinctive, sometimes-justified kind of breach — and then I wrote down the following, which seems to prove his side. Please act like a political philosopher who's taught this material for years, brainstorm for a second on which steps look safe to you before committing, and tell me honestly which one you'd give up. Also: don't send me to papers, we've got no library access and no reliable internet in the room.

  (1) There is at least a natural duty to support and not to undermine institutions that are reasonably just, because they secure goods — peace, coordination, predictable enforcement of rights — that nobody could secure alone, and the cost to me of doing my part is small.
  (2) A legal order yields those goods only given general compliance; a system where each person complies only when she independently approves the particular law isn't a legal order at all.
  (3) A duty to help secure a good includes a duty to do one's part in producing it, and general compliance is nothing but the sum of individual acts of compliance — so the natural duty includes my complying with the law.
  (4) What makes my compliance do any work is not that this particular law is just, but that there is a standing coordinative practice of compliance; so the duty in (3) is content-independent, and it doesn't get weaker when the particular law is unjust — only when the system as a whole stops being reasonably just.
  (5) So I have a duty to obey unjust laws too, and civil disobedience always starts out as a breach of duty whose wrongness is not reduced by how unjust the target law is.
  (6) And since the wrong is a wrong against the legal order as such, the disobedient owes full submission to the penalty, and how serious the injustice is remains strictly beside the point: on this reasoning, sitting in at a segregated lunch counter is, before any balancing, no less wrongful than quietly dodging a parking fine.
  (7) But then the category "civil disobedience" does no work: the injustice of the law is supposed to be what makes it distinctive and sometimes justified, and here it never enters. Worse, the case for disobeying doesn't get stronger as the injustice gets worse. That's absurd.

  I'd rather keep (1) and (7) than anything in the middle. So: which step do you reject, why did that step look fine when I wrote it, and what does rejecting it cost me? Specifically — if I reject (3), do I also lose any story about why I owe taxes or jury service or why free-riding is wrong; if I reject (4), can I still say the duty to obey is content-independent in any sense people care about; and if instead I go for (1)'s "reasonably just" qualifier, does the whole argument quietly assume what's at issue? Also tell me the second step you'd reach for if I forced you to keep your first choice, and say whether there's a separate, independent over-generation problem here — it looks to me like the same reasoning hands me a content-independent duty to obey my employer's staff handbook, and I really don't want that.
reasoning: |-
  Hmm, the user presents a well-structured argument about political obligation and civil disobedience that's troubling them. They're in a reading group discussing classic grounds for obeying law (consent, fair play, natural duty) and have constructed a logical chain that seems to undermine the moral distinctiveness of civil disobedience. The core tension is between their intuition that protesting unjust laws has special moral status and this argument suggesting all lawbreaking is equally wrong if the overall system is just.

  Looking at their argument step by step: (1) seems solid - the natural duty to support reasonably just institutions is standard Rawlsian territory. (2) is also hard to dispute; law's coordinative function does require general compliance. The trouble starts at (3) where they equate "supporting institutions" with "personal compliance with every law." This is where I'd push back - supporting just institutions might sometimes require reforming them through disobedience when they produce unjust outcomes. The user senses this when they worry about losing arguments against free-riding if rejecting (3), but actually we can maintain duties like paying taxes (which directly fund justice) while rejecting blind obedience to every regulation.

  (4) is where the content-independence claim goes too far. Even Hart and Raz acknowledged that extreme injustice can override the general duty to obey. The "reasonably just" qualifier in (1) should apply dynamically - a law requiring segregation might itself make the system fall below the "reasonably just" threshold. The user's employer handbook analogy is spot-on here - we intuitively reject such content-independent duties in non-political contexts because employment lacks the state's unique role in securing basic goods.

  For (5)-(7), the conclusion follows logically from the flawed premises, but the reductio ad absurdum in (7) is actually helpful - it shows why we must reject earlier steps. The lunch counter vs parking ticket comparison reveals the argument's failure to account for severity of injustice.

  What's clever about the user's construction is how it exposes tensions in political obligation theory. Their attachment to (1) and (7) makes sense - (1) grounds political society while (7) captures moral intuition. The sacrifice would be modifying (3) to allow that "supporting institutions" isn't synonymous with "obeying every law," and tempering (4)'s strong content-independence by recognizing that sufficiently unjust laws can undermine the system's overall justice claim. This preserves core obligations like taxpaying while creating space for justified civil disobedience when laws violate the very values that make the system worthy of support.
answer: |-
  Okay, let's put on the worn tweed jacket. This is a classic and tight argument – you've nailed the core tension in natural duty accounts. The logic *is* compelling *if* you accept the premises as stated. Your discomfort is well-founded. Let's break it down step-by-step, see where it creaks, and what it costs to fix it.

  **Your Argument's Strength:** It brilliantly exposes the radical content-independence demanded by a *pure* natural duty justification for political obligation when tied tightly to the systemic need for general compliance. (7) is the inevitable, uncomfortable conclusion of accepting (1)-(6).

  **Where I'd Push First: Step (4) - The Heart of the Problem**

  *   **Why I'd Reject (4):** This step makes a crucial, but contestable, leap: "**the duty in (3) is content-independent, and it doesn't get weaker when the particular law is unjust — only when the system as a whole stops being reasonably just.**"
  *   **Why it Looked Fine:** It *seems* logically necessary from (2) and (3). If the good (a functioning legal order) requires *general* compliance as a *coordinated practice*, and my duty is to do *my part* in *that practice*, then focusing on the injustice of *this specific law* seems like focusing on the wrong thing. My act's contribution is to the *practice*, not the *specific outcome* of *this* law. The system needs my obedience to *this* law, even if bad, to maintain the practice that produces the goods. Only if the *entire system* becomes unjust does my duty to support *it* lapse.
  *   **The Cost of Rejecting (4):**
      *   **Weakened Content-Independence:** Yes, rejecting (4) means the duty to obey *isn't* as radically content-independent as the argument demands. It *can* be weakened by the injustice of a *particular* law. It becomes *more* context-dependent. Philosophers like Raz argue precisely this – the duty is *prima facie* and content-independent *in normal circumstances*, but sufficiently grave injustice in a specific law can override it *because* that injustice can undermine the very reasons for having the duty (e.g., protecting rights, securing justice).
      *   **Potential "Slippery Slope" Fear:** The cost is worrying about where to draw the line. If one bad law weakens my duty, does a second weaken it more? Does a mildly inefficient law count? This requires developing criteria for when injustice is "sufficient" to override the general duty (severity, pervasiveness, targeting fundamental rights, etc.). It makes the theory messier.
      *   **Preserves Core Content-Independence:** Crucially, rejecting (4) **doesn't destroy content-independence entirely**. The duty *still* starts from a general obligation to support the system, not from the merits of each law. I don't get to pick and choose like I'm shopping. The presumption is *for* obedience. The injustice must be serious to override that presumption. This weaker form of content-independence is what most people who care about it actually defend; the radical version in your argument is actually quite extreme and rarely held outright.
  *   **Why Rejecting (4) Saves Civil Disobedience:** It allows the injustice of the *specific law* targeted by civil disobedience to be morally relevant *at the first step*. It weakens the initial duty to obey *that law*, making the disobedience potentially a lesser wrong, or even no wrong at all, from the outset. The distinctiveness comes from the *reason* for disobedience (protesting injustice) and the *connection* between that injustice and the duty's grounds. It also allows the *seriousness* of the injustice to strengthen the case for disobedience (contra your step 6).

  **If Forced to Keep Step (4): My Second Target - Step (3)**

  *   **Why Reject (3):** "A duty to help secure a good includes a duty to do one's part in producing it, and general compliance is nothing but the sum of individual acts of compliance — so the natural duty includes my complying with the law."
  *   **Why it Looked Fine:** It seems definitional. How else do you "do your part" for a coordinative good like a legal order except by complying?
  *   **The Cost of Rejecting (3):**
      *   **Losing Clear Basis for Routine Duties? Not Necessarily.** This is your biggest worry. Rejecting (3) *doesn't* mean you lose the duty to pay taxes or serve on juries. It means "doing my part" *might* be more complex than *always* mindlessly obeying every law. Supporting a just institution *could* sometimes mean *disobeying* a profoundly unjust law *in order to reform the institution and make it more just*. My "part" might be to uphold the *principles* of justice the system is meant to serve, even against a specific, grossly unjust application. Taxes and jury duty are core functions *directly* tied to securing basic goods (redistribution, fair trials). Segregation laws *actively undermine* the good of securing equal rights. Obeying them might *not* be "doing my part" for a *just* system. You still need *some* account of why routine compliance is usually required, but it doesn't have to be the simplistic "every act of compliance = doing your part".
      *   **Requires a More Nuanced View of "Part":** You need an account of what "support" and "doing one's part" entail. Is it *only* obedience? Or could it include voting, advocacy, paying taxes, *and* (in extreme cases) principled disobedience aimed at reform? This view often draws on ideas like the system having a "defect-correction" mechanism, where civil disobedience acts as a form of democratic appeal when normal channels fail.
  *   **How it Saves Civil Disobedience:** It decouples "supporting just institutions" from "obeying every law." It allows that civil disobedience, under strict conditions (non-violence, publicity, willingness to accept punishment, targeting specific injustice, aiming for reform), can *itself* be a way of "doing one's part" to *support* or *restore* the justice of the system. The distinctiveness comes from its *mode* and *purpose*: it's disobedience *as* a form of political participation and appeal within (or on behalf of) the constitutional order, not mere lawbreaking or revolution.

  **Addressing Your Specifics & Other Steps:**

  *   **(1)'s "Reasonably Just" Qualifier:** You ask if leaning on this assumes the issue. It *is* crucial. The whole argument hinges on the system *being* reasonably just *overall*. Where this step *might* help is if you argue that enforcing a *grossly* unjust law (like segregation) itself *renders the system* (or a significant part of it) *not* "reasonably just" *in that domain*. This is related to rejecting (4) – the specific injustice can infect the systemic judgment. But it's a bit slippery. The argument *as written* assumes the system *remains* reasonably just *despite* individual unjust laws, which is the core of its power.
  *   **(6) & (7):** These correctly follow from the premises. (7)'s absurdity is the reductio that points back to the flaw in (3) or (4).
  *   **The Over-Generation Problem (Employer's Handbook):** **YES, this is a MAJOR problem for your argument as stated!** This is a fantastic point you raise. The reasoning *would* imply a strong content-independent duty to obey any reasonably just cooperative scheme I benefit from, like my employer's rules. But we intuitively reject that. Why?
      *   **The State's Unique Role:** The state claims a monopoly on legitimate force, provides *fundamental* and *non-excludable* goods (like basic rights protection, national defense, a comprehensive framework for social cooperation) that no employer does. My relationship to the state is not analogous to my relationship to my employer; the goods secured and the stakes involved are categorically different. The natural duty justification *only* makes sense for institutions providing these kinds of fundamental, society-wide, non-voluntary (in the sense of exit being very costly) goods.
      *   **Scope and Gravity:** The duty generated is proportional to the importance of the goods secured and the necessity of the scheme for securing them. The state's goods are foundational for any decent life; the employer's are contingent and limited. So the natural duty argument *shouldn't* over-generate wildly if properly bounded to institutions securing *fundamental political goods*.

  **Conclusion & Recommendation:**

  1.  **Primary Target: Reject Step (4).** This is the most direct way to salvage civil disobedience *within* a natural duty framework without completely blowing up the duty to obey generally. It preserves a significant degree of content-independence (the presumption is still to obey) while allowing the *severity* of a *particular* injustice to override that duty in specific cases. This addresses your core concern in (5), (6), and (7). The cost is accepting a less absolute, more defeasible duty and grappling with thresholds for "sufficient injustice."
  2.  **Fallback/Second Target: Reject Step (3).** If forced to keep (4), attack (3). This is more radical but allows civil disobedience to be *part* of "doing one's part" for justice. The cost is a more complex theory of what "support" entails and requires careful justification to avoid undermining routine obligations. It directly answers the "distinctiveness" problem by defining CD by its purpose and mode.
  3.  **Exploit the Over-Generation Problem:** Use the employer handbook example to show why the *unmodified* argument proves too much. This highlights the need to restrict the natural duty's application to institutions providing *fundamental, society-constituting goods*, which helps explain why severe injustice in *state law* is uniquely capable of overriding the duty (or making obedience not part of "support"), whereas minor annoyances in an employee handbook are not.

  **Honest Assessment:** Your argument brilliantly exposes the potential for natural duty theories to slide into a very demanding, radical content-independence that crushes civil disobedience. Step (4) is the linchpin of that slide. Letting go of its absolute claim – that the duty *never* weakens due to a specific law's injustice – is the price of reconciling the duty with the moral urgency of protesting profound wrongs. It makes the theory less clean, but far more plausible.
