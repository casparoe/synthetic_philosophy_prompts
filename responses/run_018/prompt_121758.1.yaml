answer: |-
  ### Exam Question: History of Social Theory (90 minutes)
  **Prompt:** Max Weber's *The Protestant Ethic and the Spirit of Capitalism* argues that cultural values, specifically the "inner-worldly asceticism" of Calvinism, played a causal role in shaping modern capitalism through an "elective affinity" between religious ethos and economic behavior. **Can cultural values be genuine *causes* of economic outcomes, or are they merely post-hoc rationalizations of material conditions?**  

  Evaluate this question using the following scenario:  
  > Compare a Calvinist banking family in 17th-century Geneva with a Lutheran merchant family in Augsburg. Both families have identical access to capital, legal protections, and market opportunities. Yet, the Calvinists engage in systematic reinvestment, rationalized accounting, and high-risk/high-reward lending, while the Lutherans prioritize stable trade, modest profits, and avoid speculative ventures.  

  **Tasks:**  
  1. Explain Weber’s mechanism of "elective affinity" and how "inner-worldly asceticism" *might* explain the Calvinists’ practices.  
  2. Analyze whether this divergence *proves* cultural causality. Could Lutheranism’s quieter work ethic, or non-religious factors (e.g., family tradition, local networks), explain the difference?  
  3. Assess the strongest *reductionist challenge*: Are Calvinist values just a veneer for profit-seeking instincts shaped by material conditions?  
  4. Identify where Weber’s causal claim is *weakest* in this comparison.  

  **Goal:** Defend, critique, or refine Weber’s thesis on cultural causality using this controlled comparison.  
  *(~600 words; no citations needed)*  

  ---

  ### Model Answer (A-Grade Response)  
  Weber’s theory of "elective affinity" posits a non-deterministic, mutually reinforcing relationship between cultural values (like Calvinist theology) and socioeconomic practices. Calvinist doctrines—predestination, the "calling," and inner-worldly asceticism—created psychological incentives for systematic profit-seeking. Believers sought signs of God’s favor through disciplined work and reinvestment, generating capital accumulation while avoiding hedonistic consumption. This ethos fostered an "elective affinity" with rational capitalism: a *cultural catalyst* for economic behavior, not a material determinant.  

  The Geneva/Augsburg comparison tests this causality. Both families share identical material conditions (capital, laws, markets), isolating culture as the variable. Calvinist Geneva’s high-risk banking aligns with inner-worldly asceticism: profit-making as spiritual duty justifies calculated risks and deferred gratification. Conversely, Lutheranism’s emphasis on earthly obedience and suspicion of wealth-seeking (without Calvinist anxiety about salvation) likely reinforced the Augsburg family’s conservative trade. Here, values *appear* causal: similar opportunities yield divergent economic practices traceable to religious ethos.  

  Yet reductionists argue these values merely *legitimize* material interests. If Calvinist Geneva was already a banking hub, its "asceticism" could be retroactive justification for profit motives. However, Weber’s framework counters this: elective affinity requires *pre-existing* cultural "switchmen" (his term) to channel material interests into specific practices. The Lutherans had identical profit opportunities but rejected high-risk ventures, suggesting values actively *constrained* economic choices.  

  The causal claim weakens when material and cultural forces interact dynamically. If Augsburg merchants adopted Calvinist practices to compete, material pressures would erode cultural causality. Conversely, if Geneva’s bankers secularized but retained reinvestment habits, culture’s enduring influence would strengthen Weber. This comparison cannot resolve such feedback loops—a limitation of Weber’s idealism.  

  Ultimately, *values can cause economic outcomes* when they reshape agents’ interpretation of opportunities (e.g., viewing profit as divine duty vs. spiritual hazard). But they cannot act alone: material conditions enable or stifle cultural expression. Weber’s genius lies in showing how culture *activates* latent economic potentials—not in denying materialism, but in refusing its monopoly.  

  *(Word count: 598)*  

  ---  

  ### Marking Scheme (Total: 20 points)  
  **A-Grade (18–20):**  
  - **Defines elective affinity accurately** as a non-coercive, dynamic alignment—not deterministic causation (2 pts).  
  - **Uses Geneva/Augsburg case as a counterfactual test:** Explains how identical material conditions isolate culture as the variable (4 pts).  
  - **Engages reductionism:** Argues values aren’t *just* rationalization by showing Lutherans *rejecting* available opportunities (3 pts).  
  - **Pinpoints weakness in Weber:** Identifies feedback loops (e.g., material success reinforcing values) or cultural adaptation to markets (3 pts).  
  - **Nuanced conclusion:** Values as "causal" in shaping *how* agents act on material options, not *instead* of them (2 pts).  

  **B-Grade (15–17):**  
  - Summarizes elective affinity but may imply cultural determinism.  
  - Describes the case study but doesn’t leverage it to *test* causality.  
  - Mentions reductionism superficially (e.g., "values might be excuses").  
  - Notes Weber’s idealism as weakness without specifying *how* (e.g., "he ignores economics").  
  - Conclusion leans toward one pole (culture OR material factors).  

  **C-Grade (12–14):**  
  - Misstates elective affinity (e.g., as direct causation).  
  - Treats case study as anecdote, not analytical tool.  
  - Ignores reductionist challenge.  
  - No clear critique of Weber.  
  - Unbalanced or descriptive conclusion.  

  **D/F (≤11):**  
  - Factual errors (e.g., conflates Lutheranism/Calvinism).  
  - No engagement with case study or causality question.  
  - Summarizes Weber without analysis.  

  ---  

  ### What Would Change My Mind?  
  **I would flip from "values can cause outcomes" to "values are epiphenomenal" if:**  
  - **Evidence showed Calvinist banking practices *pre-dated* theological fervor** (e.g., Geneva’s speculative lending emerged *before* Calvinist dominance), making values a *consequence*, not cause.  
  - **Lutherans in identical niches behaved identically to Calvinists**, proving material conditions override cultural programming.  

  **Where my reasoning is most vulnerable:**  
  - **The "ideal type" trap:** Weber’s Lutheranism/Calvinism dichotomy may oversimplify real-world diversity. If Augsburg Lutherans took risks *despite* doctrine, values aren’t causal.  
  - **Hidden variables:** What if Geneva’s political structure (e.g., republicanism) enabled risk-taking, not asceticism? Isolating "culture" is inherently messy.  

  This question pushes students beyond summary into *causal mechanism analysis*—precisely Weber’s enduring challenge. Good luck grading!
