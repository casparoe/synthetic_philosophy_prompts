prompt: |-
  Below are the working notes for an essay on Strawson’s account of reactive attitudes and moral responsibility. I want to press a specific tension that I think is under-examined. Strawson’s familiar taxonomy—resentment, gratitude, indignation, and related participatory responses—seems to depend on what I am calling a singular addressability condition: the attitude is directed at a particular agent who is conceived as the direct source or origin of the action that prompts the response. From this, I derive an argument that the framework struggles to accommodate what I term distributed reactive attitudes, particularly distributed resentment: moral responses directed at institutional roles, collective procedures, or systemic patterns rather than at identifiable individuals. I consider whether such responses can be reconstructed within Strawson’s terms—say, as vicarious or analogical extensions of interpersonal resentment—or whether they are better classified as objective attitudes, which would imply that institutional moral life is structurally depersonalized in his scheme. I tentatively conclude that the reconstruction fails because distributed resentment retains the affective and participatory quality characteristic of reactive attitudes but lacks the singular target required by the addressability condition. Before I develop this further, I would like comments on four points. First, is the singular addressability condition actually present in Strawson’s framework, or am I importing a dyadic bias? Second, is distributed resentment conceptually coherent as a reactive attitude rather than as an objective assessment of harm? Third, does Strawson’s distinction between personal and vicarious reactive attitudes already resolve the problem I am raising? Fourth, if the argument holds, does it reveal a limitation in the framework or merely show that institutional morality belongs to a different domain altogether? I am not asking for a bibliography or for a survey of secondary literature; I want conceptual pressure on these specific claims.
reasoning: |-
  Okay, the user is developing an essay on Strawson's reactive attitudes, focusing on a tension they've identified regarding "distributed resentment" directed at institutions rather than individuals. They want conceptual feedback on four specific points before proceeding.

  Hmm, this is a sophisticated philosophical challenge. The user clearly has deep engagement with Strawson's framework and is pressing on what might be a genuine gap. Their core concern seems to be whether reactive attitudes can legitimately target non-singular entities like systems or procedures. 

  First, I need to verify if their "singular addressability condition" is indeed central to Strawson. Re-examining "Freedom and Resentment," Strawson does emphasize interpersonal dynamics - the "injury, indifference, or good will" exchanged between individuals. His examples are dyadic: you stepping on my hand, me resenting you for it. So yes, that condition seems implicit. But is it absolute? Interesting how Strawson's vicarious attitudes (like indignation) already stretch this - they're personal but target others' wrongs. Still, the object remains an individual agent.

  Now about "distributed resentment" as a coherent concept... This is tricky. Can resentment exist without a resented subject? The user insists it retains participatory affect while lacking a singular target. But Strawson's reactive attitudes are defined by their connection to expectations of goodwill - which requires someone capable of understanding that expectation. Systems don't have minds to receive moral demands. The user might be describing moral outrage or condemnation that feels reactive but isn't, strictly speaking, resentment.

  On vicarious attitudes... No, they don't solve the problem. Vicarious resentment still targets an individual - just not oneself. When I feel indignation about your mistreatment, I'm angry at the perpetrator, not the system enabling them. So distributed resentment would be categorically different.

  Finally, if this holds, is it a limitation? Probably yes, and a significant one. Strawson presents reactive attitudes as foundational to moral responsibility. If they can't engage with structural wrongs, his framework might exclude core aspects of modern ethical life - think corporate harm or bureaucratic violence. That suggests more than just a separate domain; it implies the theory needs expansion.

  The user's intuition feels right: trying to reduce institutional resentment to vicarious individual resentment would lose something essential about the phenomenon. And classifying it as objective attitude strips away the moral demand-quality. There's a real tension here worth pursuing.
answer: |-
  Your argument identifies a deep tension in Strawson's framework. Here's conceptual pressure on each point, grounded directly in Strawson's text ("Freedom and Resentment") and the logic of reactive attitudes:

  1.  **Singular Addressability: Present or Dyadic Bias?**
      *   **Strong Evidence in Strawson:** The core logic of reactive attitudes *requires* a specific "you" (or "him/her"). Strawson defines them as responses *to the quality of will* (goodwill, ill-will, indifference) *expressed towards oneself or others* by *another* in their *actions*. Resentment arises when *you* show ill-will or indifference *to me*. Indignation arises when *they* show ill-will or indifference *to him*. Gratitude arises when *you* show goodwill *to me*. The moral demand implicit in the attitude ("I/we demand better treatment") is fundamentally addressed *to* the perceived source of the quality of will. The "participant stance" involves seeing the *other* as a potential source of reasons and responsiveness to moral demands. This logic inherently points to an *agent* as the locus of responsibility and the target of address.
      *   **Potential Bias?** While Strawson focuses on dyadic examples (A resents B, C is indignant on behalf of D towards E), the core requirement isn't merely "dyadic" but "agential addressability." The issue isn't the *number* of agents involved in the interaction, but the need for *an identifiable agent* whose quality of will is the perceived trigger. Strawson's framework doesn't provide conceptual space for a reactive attitude where the perceived source of the ill-will isn't a responsible agent but an impersonal structure or role. The bias isn't yours; it's built into the reactive attitude's constitutive logic.

  2.  **Conceptual Coherence of Distributed Resentment: Reactive Attitude or Objective Assessment?**
      *   **Affective Resemblance vs. Formal Structure:** You rightly note the *affective* similarity – the anger, blame, sense of violated demand in "distributed resentment" feels reactive. However, Strawson defines reactive attitudes not just by feeling but by their *intentional structure*: they are *responses to a perceived quality of will in an agent's action*. "Distributed resentment" targets a *condition, system, or outcome*, not an agent's will manifest in action.
      *   **The Demand Problem:** The core of a reactive attitude is an implicit moral *demand* addressed to the responsible party. Whom does "distributed resentment" demand a response from? The system? A role? This lacks the specificity required for the demand to function as Strawson describes. It becomes more like a condemnatory *judgment* about a state of affairs ("This system is unjust/harmful") rather than a demand *to* someone *for* something ("*You* showed ill-will; *you* owe me recognition/reparation").
      *   **Conclusion:** While phenomenologically similar to resentment, "distributed resentment" lacks the essential *agential target* and *addressed demand* that structurally defines Strawsonian reactive attitudes. It is conceptually closer to a strong moral condemnation or outrage directed at a situation or structure, potentially shading into the "objective" stance *if* one adopts the view that the harm is impersonally caused and no one is *appropriately* held responsible in the reactive sense. Its "participatory" feel might stem from the *gravity* of the harm and the *moral engagement* of the observer, but not from the structure of holding a specific other accountable via a demand.

  3.  **Do Vicarious Attitudes Resolve the Problem?**
      *   **No. Vicarious Attitudes Preserve Singular Addressability:** Vicarious reactive attitudes (like indignation) are *personal* feelings (I feel it) directed *at* a *specific agent* (the perpetrator) *on behalf of* a *specific victim* (you or them). Strawson uses them to show *impersonal* attitudes are still reactive if they involve participation in the moral community's demands. The target remains a singular agent ("*He* wronged *her*; I demand better from *him*").
      *   **Distributed Resentment Differs Fundamentally:** "Distributed resentment" isn't indignation *on behalf of* victims *against* perpetrators. It's resentment *directly at* the impersonal system/role/procedure *itself* as the source of harm. The vicarious model requires identifiable individual agents as both wrongdoer and wronged. Distributed resentment arises precisely when such attribution is diffuse, obscured, or structurally embedded, making vicarious targeting of individuals inadequate or impossible. Vicarious attitudes extend the *scope* of reactive attitudes (to third parties) but do not change their fundamental *target* (individual agents).

  4.  **Limitation or Different Domain?**
      *   **Significant Limitation:** If your analysis holds (and the points above suggest it does), this reveals a profound limitation in Strawson's framework. By grounding moral responsibility *entirely* in interpersonal reactive attitudes requiring singular agential addressability, Strawson struggles to account for a pervasive and morally significant phenomenon: our visceral, participatory, blame-laden responses to systemic injustices, bureaucratic harms, or institutional failures where responsibility is genuinely diffuse or structurally obscured. This isn't a trivial omission; it concerns core aspects of modern moral experience.
      *   **Not Merely a Different Domain:** Calling institutional morality a "different domain" risks conceding Strawson's point but avoids the challenge. The problem is that the *affective and participatory character* of "distributed resentment" feels continuous with interpersonal resentment, suggesting it belongs to the *same broad category of moral experience* – holding the world morally accountable. Strawson's framework struggles to categorize this experience coherently: it feels reactive, but structurally violates the addressability condition. It's too affectively charged and demanding for the objective stance, yet lacks the required target for a reactive stance. This indicates a *gap* or *incompleteness* in the framework's ability to map the full landscape of moral responsibility as we experience it.
      *   **The Core Tension:** The framework implies that *either* we find an individual agent to resent vicariously (which may distort the phenomenon) *or* we must adopt an objective stance towards the system (which depersonalizes the moral response in a way that feels inadequate for grave systemic wrongs). Neither option fully captures the phenomenon you describe.

  **In Summary:**

  Your singular addressability condition is strongly supported by Strawson's text and the logic of reactive attitudes as responses to perceived quality of will. "Distributed resentment" shares the affective punch of reactive attitudes but lacks the essential structure of a demand addressed to a responsible agent. Vicarious attitudes don't resolve this, as they preserve singular targeting. This failure to accommodate distributed resentment highlights a significant limitation in Strawson's framework: its grounding in interpersonal dynamics leaves it conceptually unequipped to handle the phenomenology and moral demands arising from structural and institutional sources of harm, forcing an inadequate choice between misattributed vicarious resentment or depersonalized objective assessment. This is a powerful tension to press.
