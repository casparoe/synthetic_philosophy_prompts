  The user's background gives important context. As a scientist, they'll appreciate precise taxonomy and boundary conditions. Their dissatisfaction with "bare labels" suggests they've already done deep reading on exceptionalism (they mention the standard tripartite analysis) but found it insufficient. This is someone who wants the conceptual equivalent of a phase diagram - clear demarcations where the phenomenon applies and where it breaks down.

  Hmm... existing concepts don't perfectly fit. "American exceptionalism" is too broad and misses the meta-defense. "Special pleading" lacks the historical dimension. "Civil religion" doesn't capture the argumentative pivot. The closest might be what political theorists call "performative exceptionalism," but even that doesn't fully address the sincerity gambit.

  Let me reconstruct their observed pattern as a logical sequence:
