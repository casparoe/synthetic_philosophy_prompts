  I should also note some potential misalignments with standard Molinism. Molina himself treated all counterfactuals as equally accessible to God. And introducing "indeterminacy" might edge toward open theism despite their protests. The natural knowledge/middle knowledge boundary seems preserved though - that's good.

  For simplifying the stability threshold... Maybe they could drop the "modal perturbation" language and talk about the scope of an agent's stable dispositions instead. That feels less metaphysically loaded while making the same point.

