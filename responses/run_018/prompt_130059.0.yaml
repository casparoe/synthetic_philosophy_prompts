  I've been stuck on why the philosophical fight over the axiom of choice never moves. The constructivists say AC smuggles in non-computable selections, the classicists reply that existence doesn't require an algorithm, but they talk past eachother on every forum I've read. They all agree on the formal conseqences — Banach-Tarski, well-ordering, etc. So is the stall just about the word "existence", or is there a buried disagreement about whether mathematics should be closed under effective computation? Give me a committed answer: is this verbal, or is there a real normative split about what math is for? And if I split "selection" into algorithmic-pickable versus structurally-guaranteed, does that dissolve the dispute or just move the bump? I don't want a history — I want you to take a stand on whether the question is even well-posed.
