prompt: |-
  hey, i'm a phd student in ethics and i need help diagnosing a stall in my reading group. we've been goign in circles for over a year on supererogation—specifically whether there's a real structural gap between "meeting duty" and "going beyond." both sides agree on every case: saving a stranger at risk to your own life is heroic but not required, donating 10% is good but not obligatory, etc. side A thinks obligation has a sharp cutoff; once you've hit it, the rest is purely agent-relative preference. side B thinks moral reasons are fully scalar, so "beyond duty" is just a misleading label for weak reasons, and they've recently added this notion of "normative overhang"—a leftover field of unassigned moral value that doesn't bind anyone but also isn't just preference. side A calls that mystical nonsense. yet neither has budged on any case judgment. so what's actually breaking? is it a hidden empirical question about how people aggregate reasons? a disagreement about which cases count as data? bedrock intuitions about whether morality has "edges" that neither side can argue for? or are they answering different questions under the same word? please think like a professional meta-ethicist with some formal training, and don't just adjudicate the cases—i want the structure. start with a quick brainstorm of the possible disagreement types, then give your diagnosis supported by what each side actually says. also, given that diagnosis, what would count as progress—an experiment, a formal result about partial ordering, a conceptual distinction, or should we expect no progress and why? lead with your bottom line in the very first sentence, then reasoning, with no preamble and don't restate my question.
