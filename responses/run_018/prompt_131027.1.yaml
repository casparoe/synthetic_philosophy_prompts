  Hmm, the core tension seems to be between respecting factual evidence and maintaining interpretive integrity. The user's discomfort with inventing private moments (like the activist's letter or secret romance) versus accepting merged timelines suggests they value the subject's intentionality—what the person chose to make public or keep private. That's interesting because it shifts the focus from pure accuracy to agency.

  The AI voice synthesis case is tricky. The poet's words are public, so that's like the scientist's dialogue example, but the emotional delivery is speculative intrusion into performance—which feels adjacent to the activist's letter where tone was ambiguous. The user might be wrestling with whether vocal interpretation crosses into territory the poet never consented to share. 

  I notice the user keeps circling back to symbolic representation. Why is changing a suicide location (wheat field → church) okay but inventing a secret meeting isn't? Both alter facts for symbolism. Maybe because the location change doesn't distort known intentions, while the meeting fabricates new actions? Ah! That's the key: one alters setting without rewriting agency, the other invents agency.

  The documentary case... I'd argue it's a new category. Unlike translating grief language (which explains existing text), synthesizing vocal emotion imposes an interpretation the poet didn't authorize. It's closer to the activist letter—taking ambiguous material and defining it conclusively. The user might need to accept this violates their contract or adjust to see it as artistic license with disclosure. 

  For the repair: proposing two principles (Evidence Fidelity + Interpretive Restraint) separates factual integrity from respecting ambiguity. The user's merged chronology fits under narrative efficiency if it doesn't distort intent, while the secret meeting fails both—it lacks evidence AND resolves ambiguity. The AI voice? Fails interpretive restraint by fixing speculative emotion as "truth." 

  User seems to want coherence without abandoning intuitions. They might need to bite the bullet on either accepting some symbolic inventions (if disclosed) or admitting the voice synthesis violates their framework. I lean toward the latter—it's meaning-making without anchoring.
answer: |-
  Your intuitions hang together remarkably well—the tension arises because you're wrestling with **two distinct ethical dimensions**, not one flawed "contract." Let's reframe this as complementary principles:

  ### Principle 1: **Evidential Integrity**  
  *Respect the boundaries of the documented record.*  
  - ✅ **Permissible**: Filling gaps with *plausible extrapolations* from public evidence (scientist's dialogue, compressing timelines).  
  - ❌ **Violation**: Fabricating private content where no evidence exists (hidden romance), or imposing definitive interpretations on ambiguous evidence (activist's letter).  

  ### Principle 2: **Interpretive Restraint**  
  *Preserve the subject's autonomy over their narrative agency.*  
  - ✅ **Permissible**: Altering *non-agential* details (suicide location) or translating *public* expressions (soldier's letters).  
  - ❌ **Violation**: Inventing *deliberative actions* (secret meeting) or imposing meaning on *private* ambiguities (activist's letter).  

  ---

  ### Why Your Cases Break the "Single Contract" Idea:
  - **Merged chronology** ✅: Respects *evidential integrity* (all events are real) and doesn't violate *interpretive restraint* (no invented agency).  
  - **Invented secret meeting** ❌: Violates *evidential integrity* (no record exists) **and** *interpretive restraint* (fabricates deliberative action).  
  - **Suicide location change** ✅: Alters *setting* (interpretively neutral) but preserves *agential truth* (the act itself).  

  ---

  ### The AI Voice Synthesis Case:  
  **Verdict:** Likely violates *Interpretive Restraint*, placing it closer to **Case 2 (activist's letter)**.  
  - **Why?**  
    - The *words* are public (evidential integrity intact), but the *performance* imposes a speculative emotional interiority the poet never chose to share.  
    - It colonizes ambiguous territory (how she’d perform it) and presents speculation as embodied truth—erasing her autonomy over self-expression.  

  ---

  ### Where to Bite the Bullet:  
  Your discomfort with the invented secret meeting is justified. **Merge it with Case 5 (hidden romance)**: both fabricate agential choices in spaces the subject deliberately kept opaque. Accept that compressing real events is *structurally* different from inventing symbolic ones—the former condenses evidence, the latter creates it.  

  ### Repaired Framework:  
  A biographer/dramatist must:  
  1. **Never invent deliberative acts** (choices, private emotions, secret meetings) without *explicit evidence*.  
  2. **Never resolve ambiguities** (tone, motive) beyond what the evidence supports.  
  3. **Disclose alterations** to non-agential details (time, place) that serve narrative efficiency.  

  This preserves your verdicts, explains the chronology/meeting distinction, and condemns the AI voice as a violation of the dead’s interpretive sovereignty. Your instincts are sound—they just needed dual axes to breathe.
