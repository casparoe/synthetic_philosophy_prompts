  [Start of Memo]

  To: Interdisciplinary Research Fellowships Committee
  From: [User's Name], Undergraduate Student Representative
  Date: [Current Date]
  Re: Recommendation for the Allocation of the Remaining Fellowship Line — Philosophy of Physics Postdoc Proposal

  **Bottom Line Up Front**

  I recommend that the committee conditionally approve the physics department’s proposal for a three-year philosophy of physics postdoc, subject to the incorporation of specific success criteria focused on measurable impact on physics research practices and a detailed plan for integration with cosmology groups, to be evaluated at an 18-month review. Failure to meet these conditions by the review will result in termination of the fellowship and reversion of remaining funds.

  **Background**

  The physics department has proposed a three-year postdoctoral fellowship for a philosopher of physics to be embedded in the physics building, working on two problems: (1) the measure problem in eternal inflation, which concerns the assignment of probabilities in multiverse theories, and (2) the identification of what empirical evidence (from dark energy or CMB measurements) would count as evidence for a multiverse beyond mere compatibility. The donor agreement requires that the fellowship support work that “increases the effectiveness of physics research” — explicitly excluding teaching and general outreach. If the fellowship is not awarded, the funds revert to the physics department’s equipment budget.

  **The Case for Funding**

  The proposed research addresses foundational issues at the intersection of cosmology and philosophy. The measure problem is a recognized obstacle in eternal inflation theory: without a consistent measure, the theory cannot make testable predictions. Similarly, clarifying what would count as evidence for a multiverse is critical for guiding observational campaigns. The embedded nature of the position is designed to foster direct collaboration with physicists, potentially leading to more effective research practices.

  **Addressing Halvorsen’s Objection**

  Professor Halvorsen raises a substantive concern: that conceptual problems in physics are historically resolved by physicists through further research (e.g., renormalization for infinities in quantum field theory, decoherence for the measurement problem in quantum mechanics), with philosophy providing commentary only after the fact. He argues that this fellowship would thus be a misallocation of resources, and the line should instead support a cosmology postdoc or instrument time.

  This objection is taken seriously. However, while some problems are resolved by technical advances, others involve fundamental conceptual issues that may require interdisciplinary tools. For instance, the measure problem is not merely a technical gap but a conceptual one about how to define probabilities in a multiverse. Similarly, the question of what counts as evidence for a multiverse involves epistemological considerations that are within philosophy’s domain. There is precedent for philosophical contributions during active research (e.g., in the development of quantum information theory). The key is ensuring that the postdoc’s work is integrated with ongoing physics research to avoid becoming detached commentary.

  **Conditions for Funding**

  To address the donor requirement and Halvorsen’s concerns, the following conditions must be met:

  1. **Joint Supervision and Integration Plan**: Before the fellowship begins, the physics and philosophy departments must provide a joint supervision plan, including at least one senior cosmologist as co-supervisor. The postdoc must develop, within three months of starting, a detailed plan for engagement with at least two active cosmology research groups (e.g., through regular meetings, collaborative projects, or co-authorship).

  2. **Amendment of Success Criteria**: The proposal must be amended to include specific, measurable success criteria for an 18-month review, as outlined below. These criteria focus on impact on research practices, not just outputs.

  **Success Criteria for 18-Month Review**

  The fellowship will be reviewed at 18 months based on the following criteria. Failure to meet all criteria will result in termination of the fellowship and reversion of funds.

  1. **Impact on Research Practices**: 
     - *Counts as met*: At least two documented instances where the postdoc’s work has directly influenced the research procedure of a physics group (e.g., adoption of a specific measure in a cosmology paper, change in how an analysis is framed, or explicit citation in a methodology section showing a change in approach).
     - *Counts as not met*: Absence of such documentation, or only general citations without evidence of procedural change.
     - *Who judges*: The committee, based on a report from the postdoc and supervisors, including evidence from the physics groups involved.

  2. **Collaborative Output**:
     - *Counts as met*: Co-authorship on at least one paper with a physics group on the measure problem or multiverse evidence, or a named contribution to a grant proposal/experiment design document addressing these topics.
     - *Counts as not met*: No such co-authorship or contribution.
     - *Who judges*: The committee, based on publication records and documentation from supervisors.

  3. **Accessible Research and Engagement**:
     - *Counts as met*: (a) A workshop with majority-physicist attendance that results in a published report or follow-up collaboration plan, and (b) at least two papers (published or in preprint) that are either co-authored by a physicist or published in a physics/cross-disciplinary journal.
     - *Counts as not met*: Workshop not held or without physicist engagement; papers only in philosophy venues without physicist co-authorship.
     - *Who judges*: The committee, based on workshop reports and publication records.

  **Opportunity Cost**

  If declined, the funds would revert to the physics department’s equipment budget, purchasing a tangible asset (e.g., a detector upgrade) that would provide immediate benefits to ongoing experiments. This is a compelling alternative, given the direct and measurable impact of equipment on research output.

  **What Would Change This Recommendation**

  If at the 18-month review the postdoc has not met the success criteria (particularly the impact on research practices), the fellowship should be terminated. Conversely, if the conditions are not agreed to by the departments, the proposal should be declined.

  **Motion**

  I move that the committee approve the physics department’s proposal for a three-year philosophy of physics postdoc, conditional upon:
  1. The submission of a joint supervision plan (including a senior cosmologist co-supervisor) and a detailed engagement plan with cosmology research groups within three months of the postdoc’s start date;
  2. The amendment of the proposal to include the above success criteria for an 18-month review, with the understanding that failure to meet all criteria at the review will result in termination of the fellowship and reversion of remaining funds.

  [User's Name]
  Undergraduate Student Representative

  [End of Memo]

