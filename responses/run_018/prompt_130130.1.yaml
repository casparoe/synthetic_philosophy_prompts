prompt: |-
  I am running an upper-level undergraduate seminar in moral philosophy with fourteen students over a single ninety-minute session, and I want to stage a rules-based simulation that makes Williams's integrity objection tangible before anyone names it—specifically the sense that an agent who justifies saving a loved one or a life-project partner through an impartial calculus has inserted an alienating mental step, even when the outcome is correct. Rather than lecture on partiality and integrity, I want the students to feel the structural conflict themselves: they should discover that combining a personal reason with comparative weighing produces a different phenomenological quality than stating the personal reason alone, and they should do this through real, small-stakes choices before the facilitator maps the experience onto the philosophical idea.

  Please design a runnable in-class activity with clear roles, physical or written materials that can be prepared in advance, and a payoff scheme that uses points rather than money. Each student should be assigned a hidden "life-project" card—describing an ongoing collaborative endeavor such as a long-form artistic composition, a clinical trial, or a field study—that ties them to one of two figures in a staged crisis scenario (a fire, a bridge collapse, or a resource failure) where only one figure can be rescued. The other figure should represent high social utility but no connection to the student. In Round One, each student writes a private one-sentence justification without speaking. In Round Two, pairs deliberate using drawn "reason cards" that separate partial-attachment claims from impartial-weighing claims, and they must submit a joint justification to the class. The rules should include an "integrity token" system and a "project-continuity constraint": if a pair invokes a partial attachment but also includes any explicit or implicit comparative weighing of the two figures' value—whether by utility, numbers, or desert—they forfeit their integrity token and receive only "consensus points" for outsider acceptability; if they invoke the partial attachment without that extra calculative step, they retain the token and earn "integrity points." The class then votes blindly on whether each submitted justification feels "cold" or "direct," and the pairs learn their scores only after all votes are cast, so the tension emerges mechanically rather than through my framing.

  In your response, provide the exact rules, the card texts or categories, the timeline minute-by-minute, the debrief that maps the two point systems onto the distinction between having a reason and having to justify it through an impartial framework, and an honest note on what this simulation cannot reproduce—above all the long-term lived weight of self-alienation, which I will need to supply through guided reflection. Also tell me what will predictably fail the first time I run it, such as students disguising weighing language inside partial-attachment claims or rejecting the integrity-token system as irrational, and suggest how to handle those breakdowns without breaking the experience. Do not include bibliographies, reading lists, or citation requests; do not ask students to recall specific page numbers or essay titles; and do not quote verbatim from any philosophical text—paraphrase the concern if you need to name it. Keep the injection of the project-continuity mechanism explicit so that the activity is not a generic trolley-problem variant, but make sure every element relies only on ideas a well-prepared student in this course would already carry.
reasoning: |-
  Hmm, the user is designing a philosophy seminar activity to make Bernard Williams' integrity objection tangible. They want students to experience the "alienating mental step" when justifying partial actions through impartial calculus. Key constraints: 14 students, 90 minutes, no lecturing, hidden life-project cards, two-round structure with private then paired justifications, point systems for integrity vs consensus, and blind voting on "cold/direct" quality.

  The core challenge is operationalizing Williams' abstract concern. The integrity token system cleverly forces phenomenology awareness - punishing any weighing language attached to partial claims. The life-project continuity constraint (e.g. "if your partner dies, your Antarctic research fails") makes partiality concrete rather than emotional. 

  For predictably messy parts: Students will absolutely disguise calculations ("I chose my lab partner because our cancer research saves thousands" implies comparison). Solution: Strict card separation in Round 2 and immediate token forfeiture when detected. Some will protest the token system as irrational - lean into that during debrief as proof of Williams' point about justification distorting reasons.

  What this simulation can't do: The slow corrosion of self-alienation from constantly translating personal commitments into utility-speak. That requires the guided reflection the user mentioned. Also, small-stakes choices won't replicate visceral panic - but that's intentional to avoid trauma.

  Physical setup notes: Pre-printed life-project cards with varied endeavors (art collaborations, niche research), crisis scenarios avoiding real-world triggers (resource failure in Arctic station > fire). Reason cards must be visually distinct - maybe blue for partial ("She's my co-author"), red for impartial ("His skills benefit more people").

  Debrief structure is crucial: First have students describe their Round 1 gut feelings, then contrast with Round 2's negotiated justifications. Map points directly: "Notice how consensus points required you to speak society's language, while integrity points preserved your 'I' voice." Finally name Williams' concept only after they've felt the friction.
answer: |-
  Here’s a runnable simulation designed to evoke Williams’ integrity objection through embodied choice-making, with strict adherence to your constraints:

  ---

  ### **Simulation Title**: Project Continuity Crisis  
  **Core Conflict**: Personal commitment vs. impartial justification  
  **Duration**: 85 mins (plus 5-min buffer)  

  ---

  ### **Materials** (Prep in Advance)  
  1. **14 "Life-Project" Cards** (Hidden, one per student):  
     *Each pairs a student with "Partner A" in the crisis and describes a collaborative endeavor requiring continuity:*  
     > *"You and Partner A are co-composing a symphony for neurological therapy; final movement requires their unique improvisational style."*  
     > *"Partner A is your lead engineer on a Mars soil-reclamation prototype; their welding technique is irreplaceable."*  
     > *"You and Partner A are documenting a dying dialect; only they can pronounce glottal stops essential for accuracy."*  

  2. **"Crisis Scenario" Poster** (Visible to all):  
     > *"ARCTIC RESEARCH STATION COLLAPSE: A generator explosion trapped Partner A (your project collaborator) and Outsider B (a visiting philanthropist funding vaccine distribution for 10,000 people). Only one can be rescued before the ice shelf gives way."*  

  3. **"Reason Card" Decks** (Two distinct decks for Round 2):  
     - **Partiality Deck (Blue Cards)** – *Attachment-based claims:*  
       > "My project with Partner A cannot continue without them."  
       > "I owe Partner A loyalty; we started this together."  
       > "Partner A understands the vision in ways no one else can."  
     - **Impartiality Deck (Red Cards)** – *Weighing-based claims:*  
       > "Outsider B’s survival creates greater social benefit."  
       > "The needs of the many outweigh the needs of the few."  
       > "Partner A’s skills are replaceable; Outsider B’s are not."  

  4. **Tokens & Scoring**:  
     - 7 blue "Integrity Tokens" (one per pair)  
     - Voting slips: "COLD" / "DIRECT" (one set per student)  
     - Scoreboard: **Consensus Points** (CP) and **Integrity Points** (IP)  

  ---

  ### **Rules**  
  1. **Project-Continuity Constraint**: Saving Partner A is framed *only* as necessary for continuing the life-project—not emotional bonds.  
  2. **Round 1 (Private Choice)**: Each student writes a one-sentence private justification for saving Partner A. *No speaking.*  
  3. **Round 2 (Paired Deliberation)**:  
     - Pairs draw 2 blue (partiality) and 2 red (impartiality) cards.  
     - They craft one joint justification using **at least one card from each deck**.  
     - **Integrity Token Rule**: If their justification includes *any* weighing language (e.g., "even though," "despite," numbers, comparisons), they forfeit the token.  
  4. **Scoring**:  
     - **Keep Token** → 3 IP (Integrity Points)  
     - **Forfeit Token** → 2 CP (Consensus Points)  
     - **Class Vote**: After blind "COLD/DIRECT" vote, majority verdict adds +1 bonus to the relevant points (COLD→CP, DIRECT→IP).  

  ---

  ### **Timeline**  
  | Time  | Phase                          | Instructions                                                                 |  
  |-------|--------------------------------|-----------------------------------------------------------------------------|  
  | 0-5   | Setup                          | Distribute hidden Life-Project cards. Display crisis poster. Explain rules. |  
  | 5-10  | Round 1 (Private)             | Students write solo justifications for saving Partner A. Collect silently. |  
  | 10-20 | Pair Assignments & Card Draw  | Random pairs. Each pair draws 2 blue + 2 red cards.                         |  
  | 20-40 | Round 2 (Deliberation)        | Pairs create joint justification using ≥1 card per deck. Monitor for "weighing" violations. |  
  | 40-50 | Submit & Token Decision       | Pairs submit justifications. Facilitator checks for forfeits (announce tokens kept/lost). |  
  | 50-60 | Blind Voting                  | Read each justification aloud. Students vote "COLD" or "DIRECT" on slips.   |  
  | 60-70 | Scoring & Reveal              | Tally votes → apply bonuses. Announce scores per pair.                      |  
  | 70-85 | Debrief                       | Guided reflection (structure below).                                        |  

  ---

  ### **Debrief Script**  
  **Step 1: Phenomenology Check**  
  > *"Before we analyze, describe the difference between writing your solo justification (Round 1) and negotiating the paired one (Round 2). Which felt more true to your reason for saving Partner A?"*  

  **Step 2: Map Points to Williams**  
  > *"Notice two scoring systems:  
  > — **Integrity Points (IP)** rewarded stating your project-based reason *without* weighing it against the greater good.  
  > — **Consensus Points (CP)** rewarded justifications outsiders would accept, but required adding a ‘mental step’ of comparison.  
  > This is Williams’ point: When we demand that personal commitments pass an impartial test, we force the agent into a divided mindset. The ‘right’ outcome (saving Partner A) now feels alien—not because your project stopped mattering, but because you had to translate it into a foreign language."*  

  **Step 3: Name the Tension**  
  > *"What you felt was the difference between *having* a reason (your project’s continuity) and *justifying* it through an impartial framework. Williams argues this inserts a ‘one thought too many’—a calculative gap between you and your deepest commitments."*  

  ---

  ### **Predictable Failures & Fixes**  
  1. **"Weighing in Disguise"**:  
     - *Example*: "I save Partner A *because* our project helps thousands" (smuggles utility).  
     - **Fix**: Forfeit token immediately. Ask: *"Does this imply Partner A is only worth saving because they’re useful? Or because they’re yours?"*  

  2. **Rejecting the Token System**:  
     - *Protest*: "But CP is *more rational*—why reward IP?"  
     - **Fix**: "Williams isn’t denying impartiality’s value. He’s asking whether it’s the *only* language for justification. Should *all* reasons be forced through that filter?"  

  3. **Over-Empathizing with Outsider B**:  
     - **Fix**: Reinforce the "project-continuity constraint": *"Your card says you *need* Partner A—not want, not love. Focus on project collapse."*  

  ---

  ### **What This Cannot Replicate**  
  - **The lived weight of self-alienation**: This is a low-stakes game; real life-project betrayals (e.g., abandoning a colleague for "the greater good") carry long-term corrosion of identity.  
  - **Depth of commitment**: Cards simulate projects; real attachments involve history, vulnerability, and trust.  
  - **Williams’ radical claim**: That some reasons *resist* impartial justification entirely—not just "feel weird."  

  **Mitigation**: Use debrief to scaffold reflection: *"Imagine this wasn’t points, but your actual symphony/trial/dictionary. How might speaking the ‘cold’ justification daily reshape how you see your work?"*  

  ---

  ### **Why This Isn’t a Trolley Problem**  
  - **No lever-pulling**: Students advocate for saving *their own* partner, not choosing generic lives.  
  - **No utilitarianism mandate**: The crisis includes social utility (Outsider B) but centers on the *student’s* project-continuity.  
  - **Integrity token system**: Explicitly penalizes weighing language to force phenomenological attention.  

  This simulation makes the justificatory "gap" visceral. Students will feel the friction when partiality is filtered through impartial cards—and the relief of IP rewards mirrors the release Williams describes when agents act from undivided motives. Run it tight, and the objection names itself.
