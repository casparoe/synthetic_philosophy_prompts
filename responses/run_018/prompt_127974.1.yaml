  For the poem, I'll structure it in four quatrains. The first sets up the symmetry: both peers have equal evidence. The second introduces the asymmetry—one peer knows the other has a bias. The third shows the biased peer's perspective, and the fourth questions if this really resolves the issue.

  I'll need lines that reflect the core ideas. For example, start with "The evidence stands balanced, scale on scale" to show symmetry. Then shift to "The evidence tilts—or so I now perceive" for the asymmetry. The middle lines should get more divergent: in quatrain 1, focus on shared doubt; in quatrain 2, introduce the bias knowledge; in quatrain 3, the biased peer's confusion; in quatrain 4, question if this is just displacement.

