  Next, on maximin reasoning, I'll question why regulatory contexts get classified as "uncertainty" rather than "risk." The philosopher will probably invoke Knightian uncertainty or ignorance, so the follow-up should probe who decides that categorization and how we avoid strategic misuse. This targets the principle's susceptibility to political manipulation.

  For risk-risk tradeoffs, I'll use energy transitions as a concrete example (e.g., banning coal causing deadly poverty spikes from alternative energy). The reply will focus on holistic assessment, so the follow-up should ask why this doesn't collapse into standard cost-benefit analysis—undermining the core "shifted burden" claim.

