prompt: |-
  I'm running a 50-minute session for second-year philosophy students who've done a bit of epistemology but haven't touched higher-order stuff yet. The topic is higher-order evidence and epistemic akrasia. I don't want to use the tired sleeping-expert scenario, so I'm building it around a niche case I made up: Dr. Lena runs a clinical trial, but she gets a meta-analysis showing that her own statistical reasoning is systematically overconfident by about 15 percent — except the meta-analysis was conducted using the exact same statistical framework she's now doubting. I need a teaching plan, not the lecture itself. What conceptual dependancy has to be locked in first (first-order vs second-order belief? the distinction between evidence and reliability?) and in what order? How should I sequence the pieces so the circularity in Lena's situation feels like a real problem rather than a logic puzzle? What's the carrying example — my Lena case, presumably — and what does it need to include and what should I strip out compared to the sleeping expert? The misconceptions I expect: that she should just split the difference between her original belief and the meta-result, that this is just hypocrisy with extra steps, that higher-order evidence is always about self-doubt. Where exactly in the arc should I head off each one? What's a good end-of-session check that shows they've understandng why akrasia here isn't irrationality but something weirder? And what should I openly refuse to cover at this level — maybe formal frameworks? — and say so. Also, why is the sleeping expert actually a bad carrying example for this audience, and what pitfall does Lena avoid?
reasoning: |-
  Okay, let me tackle this philosophy teaching plan request. The user wants a 50-minute session on higher-order evidence and epistemic akrasia for second-year students, using a custom clinical trial scenario instead of the overused sleeping expert case. 

  First, I need to understand the core challenges here. The Lena case has circularity - she's doubting her statistical framework using that same framework. That's more nuanced than sleeping expert, but could confuse beginners. I should map the conceptual dependencies carefully: first they must grasp first-order vs higher-order evidence distinction, then the reliability concern, before introducing the circularity problem. 

  For sequencing, I'd start simple: what Lena originally believes about her trial (first-order), then introduce the meta-analysis as evidence about her reasoning (higher-order). The key is making students feel the tension - if the meta-analysis uses the same methods it criticizes, how can she trust it? This needs careful scaffolding. 

  Common misconceptions to preempt: students might think she should just average her confidence, or see this as mere hypocrisy. I'll build in Socratic questions when presenting the case - "If she splits the difference, is she really respecting the meta-evidence?" and "Is this about her character or about the tools themselves?" 

  The sleeping expert is bad here because it focuses on personal failure (falling asleep) rather than systemic doubt. Lena's case avoids that pitfall by making it about methodological circularity. For the check, I'd ask students to explain why downgrading belief isn't straightforwardly irrational - that's the akrasia paradox. 

  Should explicitly avoid formal frameworks - say upfront we're not doing Bayesian models. Keep it conceptual. Timing is tight: 5 min intro, 15 min foundations, 20 min Lena case, 5 min akrasia payoff, 5 min check. 

  The end check: have them articulate why Lena might be epistemically akratic but not simply irrational - that shows they get the weirdness. Maybe a quick written prompt: "In one sentence, why can't Lena just ignore either piece of evidence?"
answer: |-
  Here’s a structured teaching plan focused on conceptual sequencing, addressing misconceptions, and leveraging your Dr. Lena case effectively:

  ---

  ### **Teaching Plan: Higher-Order Evidence & Epistemic Akrasia**
  **Session Goal:** Students grasp why conflicting higher-order evidence creates rational tension (akrasia), not just inconsistency.  
  **Avoid:** Formal frameworks (e.g., Bayesian models), solutions (e.g., conciliationism). **Explicitly state this upfront.**

  ---

  #### **Phase 1: Foundational Concepts (15 min)**  
  *Lock in dependencies before introducing Lena:*  
  1. **First- vs. Higher-Order Evidence (FOE/HOE)**  
     - **FOE:** Evidence about the world (e.g., "Trial shows Drug X is 70% effective").  
     - **HOE:** Evidence about your *ability to assess* FOE (e.g., "A study says people like me misjudge stats 15% of the time").  
     *Activity:* Contrast examples (e.g., FOE: Weather app says rain; HOE: App crashed twice this week).  

  2. **Evidence vs. Reliability**  
     - Distinguish *what* evidence says from *how well you process it*.  
     - Key Q: "Can you rationally *use* evidence to doubt your ability to *use* similar evidence?"  

  ---

  #### **Phase 2: Dr. Lena Case (20 min)**  
  *Make the circularity visceral, not abstract:*  
  **Case Setup:**  
  > Dr. Lena’s FOE: Her trial data suggests Drug Y is 80% effective.  
  > HOE: A meta-analysis (using her statistical methods) shows researchers like her are systematically 15% overconfident.  

  **Discussion Sequence:**  
  1. **Initial Reaction:** *"What should Lena do?"*  
     - Expect naïve responses: "Trust the meta-analysis," "Ignore it," or "Split the difference."  
     - **Trap the misconception:** Ask *why* splitting the difference (e.g., downgrade to 65%) feels intuitive. Reveals assumption that HOE is "external" truth.  

  2. **Highlight Circularity:**  
     - Q: *"Can the meta-analysis be evidence against Lena’s reliability if it uses the same methods she’s doubting?"*  
     - **Pitfall Avoided vs. Sleeping Expert:**  
       - Sleeping Expert: HOE is about *contingent failure* (fatigue), not *systemic doubt*.  
       - **Lena’s HOE directly attacks the framework itself** → Self-undermining loop.  

  3. **Akrasia Introduction:**  
     - Define: Akrasia = Believing P while believing you *shouldn’t* believe P.  
     - Q: *"Is Lena irrational if she believes Drug Y is 80% effective but also believes she’s overconfident?"*  

  ---

  #### **Phase 3: Misconception Busting & Akrasia Deep Dive (10 min)**  
  *Preempt errors by timing corrections:*  
  | **Misconception** | **When to Address** | **Response** |  
  |-------------------|---------------------|--------------|  
  | "Just split the difference" | After initial reactions (Phase 2) | *"Does averaging respect the HOE’s claim that Lena misjudges? What if her 80% is already inflated?"* |  
  | "This is hypocrisy" | During akrasia discussion | *"Hypocrisy is moral. Akrasia is about rational tension: HOE forces her to doubt the tools she used to get FOE."* |  
  | "HOE = self-doubt" | After defining HOE (Phase 1) | *"HOE can target groups/methods (e.g., 'all RCTs in 1990s were flawed'). Lena’s case is special because it loops."* |  

  ---

  #### **Phase 4: Akrasia Check & Wrap-up (5 min)**  
  **Check for Understanding:**  
  > *"In one sentence, why might Lena be rationally required to both (a) believe her trial results and (b) distrust those beliefs?"*  
  **Strong Answer:** "The HOE undermines her ability to trust the FOE, but rejecting the FOE requires trusting the HOE, which relies on the same methods."  

  **Closing Point:**  
  - Akrasia isn’t "irrationality" because *both* beliefs are supported by evidence. The tension arises from evidence attacking its own foundation.  

  ---

  ### **Why Lena > Sleeping Expert**  
  - **Sleeping Expert Pitfall:** Focuses on *contingent* failure (e.g., "You’re tired") → Feels resolvable ("Get rest").  
  - **Lena’s Advantage:**  
    - HOE targets *systemic/methodological* error.  
    - Circularity mirrors real epistemic dilemmas (e.g., doubting science using science).  
    - Avoids distracting debates about personal reliability.  

  ### **Case Refinements**  
  - **Include:**  
    - Lena’s meta-analysis uses identical statistical tools (e.g., p-values, regression models).  
    - HOE shows *structural* overconfidence (e.g., "95% CIs are 15% too narrow").  
  - **Strip Out:**  
    - Motives (e.g., "Lena wants tenure") → Distracts from epistemic tension.  
    - Technical stats details → Focus on conceptual conflict.  

  ### **What to Overtly Exclude**  
  - **Say:** "We won’t solve this today—no formal models (e.g., probability), no consensus views. Focus on *why* this is a paradox."  

  This plan forces students to sit with the discomfort of circularity, making akrasia feel inevitable rather than pathological. The Lena case’s self-referential structure deepens the conceptual itch.
