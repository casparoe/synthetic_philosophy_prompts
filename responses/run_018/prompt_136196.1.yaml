answer: |-
  Here is the proposal structured as requested:

  1.  **Research Question:** Does von Neumann’s conception of self-replicating automata, capable of persisting without human intervention, inherently satisfy his criteria for being an "active" computing system requiring continuous physical interaction, or does such post-human technological replication reduce it to a "passive" artifact pattern, thereby revealing an incompatibility between technological survival and computational life in his framework?
  2.  **Hidden Tension:** Standard readings focus either on the abstract logical structure of self-replication (minimizing maintenance) or the brain-computer analogy grounded in biological embodiment (assuming continuous biological-like processes), obscuring the conflict between replication-as-pattern-survival and computation-as-substrate-activity in a non-biological, unmaintained context.
  3.  **Method:** Weeks 1-2 define "active computation" (substrate interaction) vs. "passive pattern" in von Neumann; Weeks 3-4 analyze self-replication mechanics for substrate dependence/independence; Weeks 5-6 assess computational requirements within replication; Weeks 7-8 synthesize findings to judge compatibility within his core definitions and arguments.
  4.  **Success vs. Failure:** Success: A clear argument based solely on von Neumann's principles resolving whether active computation is preserved or lost in unmaintained replication. Failure: Inability to resolve the tension due to internal contradictions in von Neumann, excessive ambiguity in his key terms, or the question exceeding his explicit framework.
  5.  **Scope Assessment:** Eight weeks is feasible only by rigorously limiting analysis to von Neumann's own texts on automata and computation, explicitly excluding historical context, other thinkers, or empirical tech. The project becomes too large if attempting to resolve the tension by appealing beyond his core definitions or engaging detailed debates on life/agency around Week 7.
