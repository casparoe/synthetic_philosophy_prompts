  I need a proposal for an eight-week independent study on a tension in von Neumann’s philosophy of technology. The core idea: his model of self-replicating automata implies that technological systems could survive human extinction, yet his account of computation requires continuous physical substrate interaction rather than mere pattern transmission. I want to ask whether a technological lineage that replicates in the absence of human maintenance can still satisfy von Neumann’s criteria for being an active computing system, or whether it collapses into a passive artifact—thereby testing whether technological survival and computational life are genuinely compatible in his framework. Present the proposal as exactly five numbered items, each one or two sentences, with no introduction or conclusion: (1) the precise research question framed so that it admits a determinate answer; (2) why standard readings of his automata theory and his later brain-computation analogies leave this tension hidden; (3) the method—what conceptual distinctions and arguments I would examine week by week, without requesting citations or bibliographies; (4) what a successful resolution looks like versus what would count as the project failing; and (5) an honest scope assessment for eight weeks, including the point at which the question becomes too large.
