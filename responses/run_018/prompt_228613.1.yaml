prompt: |-
  So I'm a PhD student working on scalable oversight stuff, and I keep running into the strategy-stealing assumption in the debate/AI-safety-via-debate literature -- roughly the idea that in a sufficiently long debate, the honest debater can win against a dishonest one, because for any misleading strategy the liar might use, the honest side can effectively co-opt or counter it, so lying confers no systematic advantage. People seem to treat it as load-bearing for the whole approach, but when I press people on whether it's actually true I get very different answers and a lot of hand-waving.

  So: give me your actual credence that strategy-stealing roughly holds for debates between two very capable AI debaters judged by a weaker-but-careful human judge. Not "it depends on how you operationalize it" -- I want a number. You can define your preferred precisification of the claim first if you need to, but then commit.

  More important than the number, decompose it for me. Some candidate sub-questions to get you started: (a) the probability that debate is inherently truth-favoring in the limit of debater capability, i.e. that honest arguments structurally have the edge; (b) the probability that human judges can actually track who's winning in debates about stuff they don't understand, without getting fooled by confidence, framing, or selective evidence; (c) the probability that the assumption fails specifically because of obfuscated-argument attacks or debates that bottom out in claims the judge can't check; (d) whatever else you think the credence actually turns on. Give each a rough number and a line of justification, show how they combine into your final credence, and flag which term is doing the most work.

  Then: what would move you most? Like, what experiment, formal result, or observation would shift your number the most in either direction -- and if you think the whole question is somewhat ill-posed such that no empirical result could settle it, say that and put a number on that too.
