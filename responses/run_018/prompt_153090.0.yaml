  We are creating a proposal for a 3-month project, around 800 words, aimed at a rationalist-leaning foundation. The core idea is about the singleton hypothesis (Bostrom) but focusing on "constitutional latency" — the difficulty of amending a singleton's core rules once established. The key question: Does a singleton solve alignment risks by eliminating competition, or does it convert dynamic misalignment (which can be corrected through competition or other means) into static misalignment that's hard to fix due to inflexibility?

  Brainstorming:

  1. **Core Question**: 
     - We need to state it precisely: "Does the establishment of a singleton resolve existential risks from misaligned AI by eliminating competitive pressures, or does it merely transform dynamic misalignment (where competition allows for correction) into static misalignment (where the singleton's core architecture, being hard to amend, cannot adapt to value drift or unforeseen errors)?"

  2. **Gap in Literature**:
     - Existing literature (pro-singleton: stability, no arms races; anti-singleton: fragility, single point of failure) treats governance flexibility as exogenous. They don't model how the singleton's own constitutional design (amendment rules) affects its ability to adapt. We need to endogenize this.

  3. **Proposed Method**:
     - Compare singleton amendment mechanisms to two analogies:
       a) **Evolutionary frozen accidents**: In biology, some traits become fixed and then constrain future evolution (e.g., the human recurrent laryngeal nerve's path). This is inefficient but hard to change. Similarly, a singleton's initial rules might become "frozen" and resistant to change even when inefficient or misaligned.
       b) **Democratic constitutional pre-commitment**: Real-world constitutions (e.g., U.S., Germany) have amendment procedures that are deliberately difficult to prevent rash changes. But they also include mechanisms for adaptation (e.g., amendment processes, judicial interpretation). We can analyze how these balance rigidity and flexibility, and what that implies for a singleton.
     - We must be critical: Are these analogies just metaphors, or do they offer real insights? We'll test by building simple models of amendment costs and adaptation dynamics.

  4. **Rejected Alternatives**:
     - **Option 1**: Focusing solely on AI alignment without governance (e.g., technical solutions to value learning). Rejected because it ignores the institutional context in which aligned AI must operate.
     - **Option 2**: Case studies of historical world government attempts (e.g., UN, EU). Rejected because they are not true singletons (they have competitors) and lack the technological lock-in we're concerned with.

  5. **Success Criteria**:
     - Success: Producing a clear framework for evaluating the adaptability of singleton architectures, including a taxonomy of amendment mechanisms and their vulnerability to value drift. Also, identifying specific conditions under which a singleton would be resilient or brittle.
