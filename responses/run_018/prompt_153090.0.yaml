  6. **Scope Assessment**:
     - One person (me) in 3 months: This is tight but doable. I'll focus on conceptual analysis and modeling, not empirical data. I'll build on existing governance theory and alignment literature. The risk is oversimplifying complex systems, but I can set boundaries (e.g., no simulation work, limited to high-level models).

  Now, writing the proposal in a tight, professional tone.

