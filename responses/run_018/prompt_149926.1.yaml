prompt: |-
  I'm writing an essay for a seminar on the Holocaust, modernity, and historiography, and I want you to defend the following position: the uniqueness thesis advanced during the Historikerstreit is best preserved not by insulating the Holocaust from all comparison, but by restricting comparison to other modern bureaucratic systems of rationalized violence rather than to pre-modern atrocities or to other genocides taken simpliciter. Drawing on Bauman's analysis of adiaphorization—the institutional separation of moral evaluation from instrumental rationality—I want to argue that the Holocaust was structurally unique precisely in the completeness with which modern bureaucracy achieved this separation, which makes it comparable to other modern administrative regimes in form but incomparable in the specific moral void produced by that form's total realization. Please construct this argument rigorously: show why framing uniqueness in terms of the intensity and completeness of modern bureaucratic rationalization avoids both the normalization that uniqueness advocates fear and the false universalization that critics of Bauman's modernity thesis have raised. Keep the argument self-contained and do not provide bibliographies, reading lists, or citations.
