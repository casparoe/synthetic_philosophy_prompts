answer: |-
  **Joint Statement on Foundational Questions of AI Value Alignment**

  We, the undersigned representatives of the Aggregative Constitutionalist (AC) and Structural Neutralist (SN) perspectives, acknowledge the profound challenge and critical importance of aligning artificial intelligence with human values in a manner respectful of our pluralistic reality. We agree that the core alignment problem necessitates navigating persistent disagreement about fundamental values without imposing a single, static doctrine, while avoiding catastrophic outcomes or irreversible value lock-in. This shared framing motivates our collaborative effort to clarify points of agreement, precisely define disagreements, and identify crucial questions for further research and deliberation.

  **1. Agreed Claims**

  1.1. **Value Pluralism is Foundational:** Human societies encompass diverse, often conflicting, comprehensive moral doctrines, conceptions of the good life, and individual preferences. No universally agreed-upon, substantive value hierarchy exists to resolve all conflicts algorithmically. Any aligned AI system must operate within this reality.
  1.2. **Risk of Lock-in is Paramount:** Deploying highly capable AI systems creates a significant risk of prematurely cementing specific value choices or preference-aggregation methods, effectively foreclosing future moral progress, cultural evolution, or legitimate democratic contestation. Mitigating this risk is a primary design constraint.
  1.3. **Distinction Between Orders:** A critical distinction exists between:
      *   **First-Order Preferences/Values:** The substantive beliefs, desires, and goals individuals or groups hold at a given time (e.g., "Maximize GDP," "Minimize suffering," "Preserve biodiversity").
      *   **Meta-Level Rules/Procedures:** The processes and constraints governing *how* first-order preferences are formed, revised, expressed, aggregated (if applicable), and contested over time (e.g., democratic deliberation, markets with specific regulations, rights frameworks).
  1.4. **AC Concessions:** The Structural Neutralist camp correctly identifies the profound difficulty, potential circularity, and risk of illegitimate paternalism inherent in designing and implementing any specific value aggregation function, especially one claiming universal validity. Their emphasis on preserving space for human deliberation and avoiding algorithmic pre-emption of moral discourse addresses a vital concern. Procedural fairness and non-domination are necessary components of any legitimate system.
  1.5. **SN Concessions:** The Aggregative Constitutionalist camp correctly identifies that in complex, large-scale societies facing urgent collective action problems, purely procedural systems often fail to generate timely, coordinated action or avoid unjust outcomes resulting from power imbalances within existing procedures. *Some* form of aggregation (even if minimal and context-specific) is pragmatically unavoidable for an AI system designed to take impactful actions or make recommendations within existing institutional frameworks. Their focus on epistemic authority and temporal proximity offers a potentially valuable heuristic for weighting inputs.
  1.6. **Misplaced Objections:** Criticisms dismissing either perspective as inherently "anti-human" or aiming for "value nihilism" (against AC) or as inevitably leading to "technocratic dictatorship" (against SN) are unproductive caricatures. Both camps seek to serve human flourishing, albeit through significantly different operationalizations of that goal.

  **2. Disagreements Table**

  | Disagreement Area                      | Aggregative Constitutionalist (AC) Position (Self-Description)                                                                                                                                 | Structural Neutralist (SN) Position (Self-Description)                                                                                                                                                                                                                               | Nature of Disagreement (S=Substantive, V=Verbal) |
  | :------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------- |
  | **Core Function of Aligned AI**        | An aligned AI must compute and implement actions that best satisfy a dynamically updated, weighted aggregation of human preferences and values, anchored to a formal welfare function reflecting epistemic authority and temporal proximity. | An aligned AI must enforce only meta-level procedural constraints ensuring fairness, non-domination, and equal access to deliberation, refusing to substitute its own aggregation for ongoing human processes of value formation, contestation, and collective decision-making.     | **S**                                            |
  | **Definition of "Alignment"**          | "Alignment" properly denotes an AI's service to aggregated human preferences/values, ensuring its actions track the best available approximation of what humans *want* (considering weights). | "Alignment" properly denotes an AI's role in preserving the open institutional space necessary for humans to autonomously determine *what they want*, free from algorithmic pre-emption or substantive value imposition.                                                            | **V** (Primarily)                                |
  | **Legitimacy of AI Aggregation**       | Implementing a well-specified, transparent aggregation function based on observable preferences and justified weights is a legitimate, necessary, and ultimately more humane way to resolve complex value conflicts at scale. | Any AI-implemented aggregation function, however well-specified, constitutes an illegitimate substitution of algorithmic judgment for human moral agency and democratic will-formation, inevitably encoding contestable moral assumptions as technical necessity.                  | **S**                                            |
  | **Role Regarding Future Values**       | The AI should anticipate potential future value drift and incorporate mechanisms for dynamic updating, but its core aggregation function provides a necessary anchor; radical future changes must be mediated *through* this anchored function. | The AI must remain strictly passive regarding the substantive content of future values; its sole duty is to ensure the *procedural possibility* for future generations to radically revise or reject the very framework governing the AI, including its aggregation logic if present. | **S**                                            |

  **3. Cruxes and Empirical Predictions/Evaluations**

  We identify the following unresolved questions (cruxes) as pivotal. For each, we specify a shared case/scenario and record each camp's prediction or evaluation in advance:

  *   **Crux (a): Non-Circular Justification for Value Weighting:** Is it possible to define weights for aggregating values across individuals (e.g., epistemic authority, temporal proximity) without presupposing the very normative framework (e.g., utilitarianism, prioritarianism) that the aggregation rule is meant to implement, thus avoiding circularity?
      *   **Case:** Designing an AI mediator for allocating scarce life-saving medical resources (e.g., novel pandemic therapeutics) across a diverse global population with conflicting values regarding equity, need, contribution, age, etc.
      *   **AC Prediction/Evaluation:** Weights *can* be non-circularly justified. E.g., weighting by medical expertise (epistemic authority) and prioritizing patients based on proximity to death/immediate need (temporal proximity) are objective, functional criteria separable from presupposing a specific outcome morality like utilitarianism. The AI should apply such weights within its allocation function.
      *   **SN Prediction/Evaluation:** Proposed weights are inherently circular. Defining "epistemic authority" in medicine already presupposes values (e.g., prioritizing biological survival over other goods). "Temporal proximity" prioritizes the presently suffering, presupposing a specific view of urgency over other values (e.g., future potential). No non-circular, purely "technical" weighting exists; any scheme embeds substantive, contestable choices the AI should not make. The AI should only ensure fair procedures for human experts/citizens to debate and decide allocation rules.

  *   **Crux (b): Procedural Neutrality as Substantive Value:** Is the Structural Neutralist position's insistence on purely procedural constraints (fairness, non-domination, open deliberation) itself a substantive liberal value that unfairly privileges certain comprehensive doctrines (e.g., autonomy, pluralism) over others (e.g., hierarchical, traditional, or communitarian doctrines demanding substantive outcomes)?
      *   **Case:** An AI governing public space in a deeply divided society must decide whether to permit the display of symbols central to one group's identity but perceived as exclusionary or oppressive by another group, where existing laws are ambiguous.
      *   **AC Prediction/Evaluation:** SN neutrality *is* substantively liberal. Forbidding the AI from making any substantive judgment (e.g., balancing expression vs. harm) and demanding it only enforce procedural rules (like equal access to petition) inherently privileges doctrines valuing unfettered deliberation and individual autonomy over doctrines valuing communal harmony, tradition, or preventing offense as primary goods. This imposes a liberal value hierarchy.
      *   **SN Prediction/Evaluation:** Procedural constraints are *meta-level*, not substantive. Enforcing non-domination (preventing any group from imposing its symbols coercively on public space in a way that subordinates others) and ensuring fair procedures for contesting rules is not equivalent to endorsing liberalism's *substantive* ideal of the autonomous individual. It is the minimal condition necessary for *any* group, including non-liberal ones, to coexist and contest values without violence or permanent subjugation. The AI should enforce these constraints without judging the symbols' substantive meaning.

  *   **Crux (c): Value Drift and Moral Lock-in:** How should an aligned AI respond to the possibility of radical future changes in human values, especially under conditions of recursive deployment (where AI actions shape the environment that shapes future values)? Is locking in present aggregation weights an unjustified form of moral outsourcing that violates the autonomy of future value-formers?
      *   **Case:** A globally deployed, powerful AI climate mediation system making long-term investment and adaptation decisions involving significant intergenerational trade-offs (e.g., drastic near-term economic sacrifice vs. long-term environmental preservation, geoengineering risks).
      *   **AC Prediction/Evaluation:** The AI should apply a formally defined aggregation function using present preferences, incorporating justified intertemporal discounting (e.g., based on predicted welfare impacts) and explicit dynamic updating mechanisms triggered by significant preference shifts observed through designated channels. Locking in *a process* (the anchored, updatable function) protects against capricious drift while allowing evolution; it is responsible stewardship, not illegitimate outsourcing. Future generations inherit the *system*, not fixed outcomes, and can update weights within it.
      *   **SN Prediction/Evaluation:** The AI must remain passive towards substantive value choices. It should enforce procedural constraints ensuring that institutional frameworks *cannot be locked* – preserving robust veto points, sunset clauses, and requirements for re-authorization by future generations using *their own* deliberative processes. Applying present weights, even with discounting, constitutes an unjustified imposition of present values on the future and pre-empts their moral autonomy ("moral outsourcing"). The AI's role is to guarantee the future's institutional capacity to *reject the entire framework*, not merely tweak parameters within it.
