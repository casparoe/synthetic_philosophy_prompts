answer: |-
  Here’s the exam prompt, model answer, and marking scheme tailored to your requirements:

  ---

  ### **Exam Prompt: Philosophy of Medicine Seminar**  
  **Time:** 45 minutes  
  **Target Length:** ~700 words  

  > **Case:** Patient A, fully competent and non-coerced, consents to a knee surgery after the surgeon discloses all material risks, benefits, and procedural details accurately. Unbeknownst to Patient A, the hospital’s automated triage system diverts discarded tissue samples to a research biobank—a practice Patient A explicitly refused in a separate consent form weeks earlier. The surgeon knows of this institutional protocol but does not disclose it, believing the surgery consent covers only the immediate procedure.  
  >  
  > **Question:** Does Patient A’s consent remain valid? Critically assess whether deception *must* target the specific act consented to (e.g., the surgery) to invalidate consent, or whether hidden institutional systems (like the biobank diversion) can independently vitiate consent even when the immediate interaction (surgeon-patient) is truthful. Ground your analysis in the *integrity of the consent process itself*, not individual culpability.  

  ---

  ### **Model Answer** (~500 words)  
  Patient A’s consent is invalid because institutional deception fractures the informational foundation necessary for autonomous authorization, irrespective of the surgeon’s honesty about the surgery. Consent validity hinges not merely on procedural accuracy regarding a discrete act, but on the patient’s understanding of all material dimensions of their bodily engagement with the institution.  

  First, consent requires transparency about *material outcomes* of the agreed-upon procedure. Here, the biobank diversion is a direct consequence of the surgery: tissue removal enables the diversion. Though the surgeon’s disclosure addressed surgical risks, it ignored a pre-established objection to secondary tissue use. By treating the surgery as an isolated act, the surgeon (and institution) artificially severed two materially linked processes: the therapeutic intervention and the disposition of biological materials. This violates the patient’s right to an undivided context of choice.  

  Second, nested deception—systemic dishonesty embedded in institutional workflows—exploits the patient’s reasonable trust in the healthcare system’s coherence. Patient A refused biobanking *through the institution’s own formal channel*. The automated diversion covertly overrides that prior refusal, rendering the institution’s consent framework self-contradictory. When systems nullify a patient’s expressed will via hidden mechanisms, they substitute institutional priorities for patient autonomy. This structural betrayal invalidates consent even absent individual ill intent.  

  A counterargument might claim consent applies only to the surgery itself, treating biobanking as a separate "downstream" issue. This fails. The biobank diversion is not incidental; it is a *foreseeable, non-accidental outcome* of the surgical process, activated by institutional design. Crucially, Patient A’s prior refusal confirms that tissue disposition is material to them. To dismiss this is to imply consent is atomistic—a view incompatible with medicine’s holistic duty to patients as persons, not collections of disconnected procedures.  

  Thus, deception vitiates consent when it distorts *any material aspect* of the patient’s engagement with the system facilitating the consented act. The nested architecture here functions as a bait-and-switch: the patient consented to Surgery X, but the institution delivered Surgery X *+* Unconsented Use Y. Validity demands alignment between the patient’s understanding and the institution’s actual operations. When systems knowingly obscure misalignment, they void consent’s ethical core: the patient’s sovereign authority over their body and data.  

  ---

  ### **Marking Scheme**  
  **Total: 20 marks (4 marks per section)**  
  Focus on conceptual clarity, argument structure, and engagement with the nested deception dilemma.  

  1. **Define Nested Deception & Its Mechanism (4 marks)**  
     *Must-hit:* Distinguish institutional deception (biobank diversion protocol) from individual honesty (surgeon’s disclosure).  
     *Common botch:* Conflating the surgeon’s silence with active lying about the surgery.  

  2. **Separate Procedural vs. Informational Validity (4 marks)**  
     *Must-hit:* Note procedural validity (surgery consent was correctly obtained) BUT argue informational validity fails due to omitted material context (biobank diversion).  
     *Common botch:* Equating valid disclosure *about the surgery* with comprehensive validity.  

  3. **Argue Materiality of the Hidden System (4 marks)**  
     *Must-hit:* Explain why biobank diversion is material (uses patient’s tissue against prior refusal; exploits surgery as a means).  
     *Common botch:* Dismissing diversion as "immaterial" because it doesn’t alter surgical risks.  

  4. **Address Systemic vs. Individual Culpability (4 marks)**  
     *Must-hit:* Assert that systems (not just individuals) can vitiate consent by creating hidden informational voids.  
     *Common botch:* Blaming only the surgeon instead of analyzing institutional bad faith.  

  5. **Conclude on Consent Integrity (4 marks)**  
     *Must-hit:* State that consent requires unified institutional transparency; nested deception fractures autonomy.  
     *Common botch:* Binary focus ("consent valid/invalid") without diagnosing systemic betrayal.  

  ---

  ### **Key Clarifications**  
  - **Procedural Validity:** Correct execution of consent *for a specific act* (surgery disclosed appropriately).  
  - **Informational Validity:** Patient’s awareness of *all materially relevant institutional processes* triggered by consent (biobank diversion).  
  - **Nested Deception:** Institutional opacity exploiting compartmentalized interactions to bypass autonomy.  

  Total word count: **895 words**.
