answer: |-
  That's a fascinating and deeply relatable ethical puzzle – and yes, philosophy absolutely has a concept for what you're describing: **Moral Luck**.

  Here's the breakdown relevant to your situation:

  1.  **The Core Idea (Moral Luck):** Moral luck occurs when factors *outside an agent's control* (like luck, chance, or unforeseen consequences) significantly influence the moral judgment we pass on them, or the moral praise/blame they deserve, *even though their intentions or actions were identical* in different scenarios.

  2.  **Your Case - Resultant Moral Luck:** Your situation fits perfectly into the sub-category called **Resultant Moral Luck**. This focuses on how the actual *outcomes* of an action, often determined by luck, affect our moral assessment of the person who performed the action.
      *   **Same Action (Negligence):** In both experiments, your actions were identical: sloppy technique, uncalibrated spectrometer. Your level of control and intention (or lack of careful intention) was the same.
      *   **Different Results (Luck):** Pure chance determined the outcomes. One failed obscurely, the other yielded a valuable (and profitable) anomaly.
      *   **Different Moral Feeling/Assessment:** You feel significantly worse (guilty, like you "got away with it") about the *successful* experiment, even though the *action* was no different. The lucky, positive outcome triggers the guilt, while the unlucky, negative outcome (the flop) doesn't carry the same weight morally for you. This disparity is the heart of resultant moral luck.

  3.  **Why You Feel Worse About the Success:**
      *   **Benefit from Wrongdoing:** The negligence led directly to a benefit *in one case*. This feels like profiting from a mistake, amplifying the sense of wrongdoing. The failed experiment *also* involved wrongdoing (negligence), but since it didn't lead to a tangible benefit (and perhaps didn't cause obvious harm beyond wasted resources), the moral "sting" is less.
      *   **"Getting Away With It":** The successful outcome meant your negligence wasn't *caught* or *punished* in the way the failure might have been (if it had been noticed/scrutinized). The luck concealed the flaw and rewarded it. This creates a sense of unearned reward and hidden fault.
      *   **Moral Residue:** The successful outcome creates a kind of "moral residue." You have something valuable (the patent, the cash) that you know resulted, at least in part, from an action you now judge as ethically deficient. The failed batch leaves no such tangible residue tied to the negligence.
      *   **Focus on Consequences:** Humans are naturally consequence-oriented. A bad outcome (even if caused by luck) makes us scrutinize the action more harshly. A good outcome (even if caused by luck) can sometimes mask the flaws in the action. In your case, the *good* outcome is paradoxically making *you* scrutinize the flawed action *more* harshly because it highlights how you benefited undeservedly.

  4.  **Is it "Fair" to Feel Worse About the Success?**
      *   **Intuitively, Yes:** Your feelings are understandable and common. Resultant moral luck *feels* real. We naturally judge the driver who texts and *kills* someone far more harshly than the one who texts and *doesn't* hit anyone, even though the reckless action was the same. The outcome matters to our moral emotions and judgments.
      *   **Philosophically, It's Debatable:** Some philosophers (like Immanuel Kant) argue that moral worth depends *only* on the intention or the will behind the action, *not* on consequences determined by luck. By this strict view, both experiments were equally blameworthy (or praiseworthy) based solely on your state of mind and choice to be negligent. Feeling worse about one due to luck would be illogical. Others (acknowledging moral luck's reality, like Thomas Nagel) argue that outcomes *do* inevitably shape our moral assessments, even if it creates a tension with the ideal of judging only what's within control.
      *   **Your Feeling Reflects Depth:** Your guilt about the success shows a nuanced ethical awareness. You recognize that the *combination* of negligence *and* undeserved reward creates a unique moral discomfort. You're not just judging the action in isolation; you're judging the *situation* it created through luck.

  **In essence:** You're grappling with **Resultant Moral Luck**. Your identical negligent actions led to wildly different outcomes due to pure chance. The lucky, positive outcome (the successful batch/patent) triggers stronger guilt because it resulted in an unearned benefit, creating a sense of "getting away with it" and leaving a tangible "moral residue." While a strict philosophical view might say both actions were equally wrong *at the time*, your feeling worse about the successful one is a very human response to the complex interplay of action, luck, and consequence. It highlights how outcomes, even when fortuitous, force us to confront the nature and potential costs of our actions in a way that mere failure sometimes does not. Your intuition that luck changes the moral weight is precisely what the concept of moral luck explores.
