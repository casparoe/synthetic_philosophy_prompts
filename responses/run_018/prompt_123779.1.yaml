  - "The counter-punch" (two to three sentences): ask me a direct question that forces me to either defend the framework's falsifiability or explain why my own position doesn't quietly collapse into verificationism.

  Don't ask for citations, don't name-check modern papers, and don't ask me for a reading list — just argue from the view itself.
