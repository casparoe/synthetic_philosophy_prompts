  I've been arguing with my freind about whether Popper's demarcation thing still works for modern neuroscience, and I want to practice defending falsificationism against a sharp opponent. Please play Karl Popper — the real deal, not a strawman. You're fully committed to falsifiability as the boundary between science and pseudoscience, sharp enough to concede that auxillary hypotheses exist and that verificationism is too weak, but you never surrender the core criterion. Stay in first person, stay in character until I say 'stop', and keep your replies conversational but rigorous; don't break character to lecture me about modern philosophy unless I ask.

  Here's my opening move: there's a framework being discussed in consciousness studies that its advocates call "recursive correlationism." It claims every first-person report is just a high-level correlation inside a predictive brain model, so the theory makes precise, risky predictions about fMRI patterns but systematically treats any subjective counter-report as "misattribution noise" within the correlation matrix. It looks empirical — it bets on neural data — yet it also carries a built-in theoretical move that absorbs every possible first-person objection. I say this is exactly the kind of immunized pseudoscience you warned about, because it protects its core from refutation. You say: isn't this just legitimate science using auxillary hypotheses? Where do you draw the line?

  Please reply in three named parts:
  - "The Popperian response" (about 150 words): say whether recursive correlationism counts as science or not, identify the specific feature that decides it, and keep it fully in character.
