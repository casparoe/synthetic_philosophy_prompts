prompt: |-
  I'm a phd student in philosophy of science (stats-adjacent) and in our replication-crisis seminar someone keeps saying "absence of evidence is not evidence of absence" to brush off failed replications. Last meeting they used it right after a null result—basically arguing the original effect might still be real, we just haven't caught it yet, so the failure doesn't tell us anything. I know thier using it as a conversation-stopper but I can't articulate what's wrong. Could you break down the seperate precise claims that slogan could stand for? I'm thinking: (1) a bare logical point about deductive proof, (2) a Bayesian claim about priors and non-updating, (3) a statistical-power claim about underpowered studies, maybe others. For each reading, say if it's trivial, if it's true, and—crucially—whether it actually licenses dismissing a specific null result. Lay it out as a menu with the ones that do real argumentative work flagged, so I can bring it to the group.

  Please lead with your bottom line in the first sentence, then reasoning—no preamble and don't restate my question.
reasoning: |-
  Alright, the user is a PhD student in philosophy of science dealing with a seminar on the replication crisis. They're frustrated because someone keeps using "absence of evidence is not evidence of absence" to dismiss failed replications, especially after a null result. The user wants to dissect this slogan into precise claims to counter this misuse in their group discussion.

  First, I need to unpack the slogan's possible meanings. The user mentioned three readings: deductive proof, Bayesian updating, and statistical power. Let me break each down. The logical point is about deductive reasoning—failure to prove existence doesn't prove non-existence. That's valid but trivial in scientific contexts since science relies on induction, not deduction. So pointing out its triviality here is key.

  Next, the Bayesian claim: if the prior for an effect is high, a null result might not shift the posterior enough to negate it. That's true but depends on prior strength and study power. If the study had high power, the null result should reduce belief in the effect. The user's classmate might be assuming a strong prior without justification, so highlighting the need to justify priors and consider power is important.

  Then, the power issue: an underpowered study can't detect real effects, so a null result isn't informative. But if the replication was well-powered, dismissing it based on this slogan isn't valid. The user should check if the study in question had sufficient power. If it did, this argument doesn't hold.

  Are there other interpretations? Maybe epistemic uncertainty or methodological errors. For example, if the replication had flaws, the null result might not challenge the original. But that's about study quality, not the slogan per se. The user needs to separate these issues.

  The user's deeper need is to effectively counter misuse of the slogan in academic discourse. They need clear, structured arguments to present to their seminar group. Identifying which interpretations apply in specific cases will help them show when the dismissal is unwarranted. Highlighting that the slogan only works under certain conditions (like high priors or low power) and that without those, the null result is meaningful evidence against the effect.

  Also, emphasizing that in science, absence of evidence *can* be evidence of absence when studies are well-designed. The key is shifting the burden of proof: after a rigorous replication fails, proponents must provide stronger evidence, not just invoke the slogan.

  Finally, organizing these points into a menu format as requested, tagging which allow dismissal and which don't. Making sure each point is clear on triviality, truth, and applicability to null results. The user can then use this framework in their seminar to challenge oversimplified uses of the slogan and promote more nuanced discussion.
answer: |-
  **Bottom Line:** The slogan is often misapplied; only under specific conditions (high prior belief or low statistical power) can it legitimately dismiss a null result, and it never means the result tells us "nothing."

  Here's the breakdown of claims the slogan can represent, assessed for triviality, truth, and whether they license dismissing a specific null result:

  1.  **Deductive Logic Claim:**
      *   **Claim:** Failure to observe evidence for an effect (E) does not *deductively prove* E is absent (~E). Observing A implies B does not mean not observing A implies not B.
      *   **Trivial:** Yes (basic logic).
      *   **True:** Yes (as formal logic).
      *   **Licenses Dismissing Null?** **No.** Science is fundamentally inductive. Deductive proof of absence is usually impossible. This reading makes the slogan vacuously true but useless for interpreting empirical evidence; it applies equally to *any* null finding, no matter how well-powered or replicated. It doesn't justify ignoring the result.

  2.  **Bayesian Non-Updating Claim:**
      *   **Claim:** If your prior belief in the effect (P(E)) is extremely high (near 1), a single null result (D) might not significantly lower your posterior belief (P(E|D)), especially if the study had low likelihood (P(D|~E) is also low) or was expected under E (P(D|E) isn't near 0).
      *   **Trivial:** No.
      *   **True:** Yes (follows from Bayes' Theorem).
      *   **Licenses Dismissing Null?** **Conditionally Yes, BUT...** This *can* justify maintaining belief in E *despite* D, **only if** (a) the prior P(E) was *justifiably* extremely strong *before* D, and (b) the study was genuinely uninformative *given that prior* (e.g., very low power or high probability of D even if E is true). **Crucially:** It does NOT mean D provides *no* evidence against E; it *always* reduces P(E), just perhaps negligibly from an already high base. Using this to dismiss a replication requires explicitly justifying the *extremely strong prior* and demonstrating the study was truly uninformative *for someone holding that prior*. Vague invocation of the slogan is insufficient.

  3.  **Statistical Power Claim:**
      *   **Claim:** A null result from an *underpowered* study (low probability of detecting E if it exists) provides little or no information about the absence of E. A miss with a broken radar doesn't mean no plane is there.
      *   **Trivial:** No.
      *   **True:** Yes (definition of power).
      *   **Licenses Dismissing Null?** **Conditionally Yes, BUT...** This justifies skepticism about the *informativeness* of *this specific null result* **only if** the study demonstrably had **low statistical power** to detect the originally claimed effect size (or a plausible smaller one). If the replication was well-powered and got a precise null result, this argument fails. Power must be assessed quantitatively; the slogan alone isn't an argument.

  4.  **Epistemic Uncertainty Claim:**
      *   **Claim:** A null result doesn't *establish certainty* of absence; there's always residual uncertainty.
      *   **Trivial:** Yes (trivially true about all empirical results).
      *   **True:** Yes.
      *   **Licenses Dismissing Null?** **No.** Like (1), this is vacuously true for all science. It doesn't justify treating the result as uninformative or maintaining belief in E. Evidence is fundamentally probabilistic; a well-powered null result provides *strong evidence for absence*, even if not absolute proof.

  5.  **Methodological Failure Claim (Implied):**
      *   **Claim:** The failure to replicate (null result) might be due to flaws in the replication attempt (e.g., protocol deviation, different population, measurement error) rather than the absence of the original effect.
      *   **Trivial:** No.
      *   **True:** Possibly (needs investigation).
      *   **Licenses Dismissing Null?** **Conditionally Yes, BUT...** This justifies questioning the *validity* of the specific null result **only if** there is *specific, credible evidence* of methodological problems in the replication that could plausibly explain the failure *independently* of the effect being absent. It shifts the burden to critique the replication's execution, not to invoke the slogan abstractly.

  **Which Do Real Argumentative Work (Legitimately License Dismissal)?**

  *   **#2 (Bayesian - Strong Prior):** Only if a *justifiably extremely strong prior* is explicitly stated *and* the study is shown to be uninformative *for that prior*.
  *   **#3 (Low Power):** Only if *quantitative power analysis* shows the replication had low power to detect a plausible effect size.
  *   **#5 (Methodological Flaws):** Only if *specific flaws* in the replication are identified that *plausibly explain* the null result.

  **Crucial Implications for Your Seminar:**

  *   **It's rarely "no evidence":** A null result *always* provides *some* Bayesian evidence *against* the effect's existence (lowers P(E)), even if minimally.
  *   **Burden Shifts:** After a rigorous replication attempt (especially if pre-registered, well-powered, and well-conducted) yields a null result, the burden shifts *strongly* to proponents of the original effect. They must either:
      1.  Accept the evidence for absence (or severe attenuation),
      2.  Provide a *specific, testable* reason why *this specific replication* failed (invoking #3 or #5 with evidence), or
      3.  Explicitly defend an *extremely strong prior* (#2) that justifies ignoring the result.
  *   **Slogan Abuse:** Invoking the slogan without specifying *which* interpretation applies and providing the necessary justification (#2: prior & uninformative; #3: low power calc; #5: specific flaws) is an empty conversation-stopper. It misuses a potentially valid point under narrow conditions to dismiss evidence illegitimately. A well-conducted, adequately powered replication failure **IS** evidence of absence, demanding a substantive response, not a slogan.
