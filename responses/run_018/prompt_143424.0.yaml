prompt: |-
  hey, i'm writing a feature on whether we even have a working defintion of intelligence for my science desk, and i realized every expert just points to iq tests or deep learning benchmarks and calls it a day. i want the actual spec sheet: what does a theory of intelligence have to deliver to count as adequate? not just "it predicts human exam scores" — i mean the hard cases it can't botch, like whether a slime mold solving a maze is intelligent, whether a large language model that aces bar exams but can't navigate a dark room counts, and whether intelligence is one thing or a cluster of capacities that happen to travel together. for each requirement, say why it's in the spec — what's the case or result behind it — and flag which ones are non-negotiable versus just camp bias (psychometrics vs ai vs embodied cognition). especially tell me if any subset is jointly unsatisfiable: for instance, can you really hold both "intelligence requires embodied interaction with an environment" and "intelligence is fully substrate-independent" without fudging? also list the distinctions it can't collapse, like capacity vs achievement or domain-general vs domain-specific, with the reason for each. then, briefly, how do g-factor theories, embodied cognition takes, and the "intelligence as adaptation" view score against your list? but mostly i want the criteria — my editor wants to know what we're actually arguing about when we call something smart.
reasoning: |-
  Okay, the user is writing a science feature on defining intelligence and is frustrated that experts just point to IQ tests or AI benchmarks. They want a "spec sheet" of what a theory of intelligence must include. Let me unpack their request.

  First, they mention hard cases like slime molds solving mazes or LLMs acing exams but failing in a dark room. So they need criteria that handle edge cases. Also, they want to know if intelligence is a single trait or a cluster. They’re asking about non-negotiables vs. biases in different fields (psychometrics, AI, embodied cognition). Plus, possible contradictions, like requiring embodiment while being substrate-independent. And distinctions like capacity vs. achievement. Finally, how different theories stack up against the criteria.

  Hmm, the user’s deeper need is probably to clarify the debate around intelligence for their readers. They want to show why current definitions fall short and what’s at stake in different perspectives. The editor wants to know what the core arguments are when calling something "smart." So I need to provide a structured framework that highlights the contentious points and trade-offs.

  I should start by outlining essential criteria. Non-negotiables might include cross-domain flexibility and grounding. Then, distinctions like capacity vs. achievement are crucial because measuring potential versus actual performance changes assessments. The contradiction between embodiment and substrate-independence is key—can you really have both? For example, embodied cognition insists on physical interaction, while computational views argue for abstract processes. That tension needs to be addressed.

  Next, evaluating theories. G-factor focuses on psychometric testing but misses embodiment. Embodied cognition includes environmental interaction but struggles with substrate independence. Adaptation is broad but vague. Each theory has strengths and gaps against the criteria.

  The user might also want to know which criteria are most disputed. Flexibility and scope thresholds are contentious—how much adaptability is needed? And whether domain-specific abilities count as intelligence. Plus, the origin question (innate vs. learned) is a minefield. Highlighting these shows where experts disagree.

  I should ensure each criterion has a rationale tied to real-world examples. Slime mold illustrates flexibility vs. scope; LLMs show grounding issues. The spec sheet needs to clarify why each point matters. Also, noting which criteria are shared across fields versus field-specific helps the user present biases.

  Finally, the conclusion should tie together how the criteria reveal underlying philosophical divides. This gives the user a clear takeaway for their feature: the debate isn’t just about tests but fundamental requirements and tensions in defining intelligence.
answer: |-
  Here's a science-worthy "spec sheet" for a theory of intelligence, breaking down the core requirements, distinctions, tensions, and how major theories stack up. This is the battlefield beneath the surface when we argue about what's "smart":

  **The Core Spec Sheet: What an Adequate Theory of Intelligence MUST Deliver**

  1.  **Explain & Predict Cross-Domain Flexibility (Non-Negotiable):**
      *   **What it must do:** Account for the ability to transfer knowledge/skills/strategies to *novel* problems and domains, not just excel at trained tasks.
      *   **Why it's in the spec:** An LLM acing the bar exam but failing to understand a simple physical puzzle ("Put the book on the unstable shelf without it falling") lacks this. Humans (even children) and some animals show this flexibility. Slime mold maze-solving, while impressive, is highly domain-specific chemical gradient following – likely *not* flexible intelligence.
      *   **Camp Bias:** Psychometrics (g-factor) & AI (AGI goals) prioritize this heavily. Embodied cognition sees it as emerging *from* interaction.

  2.  **Define Scope & Thresholds (Non-Negotiable):**
      *   **What it must do:** Provide principled criteria for *what kinds of systems* and *what level of performance* qualify as "intelligent." Avoid binary yes/no where possible.
      *   **Why it's in the spec:** Is a thermostat "intelligent"? A slime mold? A chess computer? A parrot mimicking speech? Without thresholds (e.g., degree of flexibility, complexity of goals, adaptation speed) and scope (e.g., requires goal-directedness? requires learning?), the term becomes meaningless. The "dark room" test for LLMs probes if their ability extends beyond symbol manipulation.
      *   **Camp Bias:** **HIGHLY CONTENTIOUS.** Psychometrics uses statistical norms (human population). AI often uses task performance benchmarks. Embodied cognition might require situatedness. Adaptation views might focus on environmental complexity.

  3.  **Account for Goal-Directedness & Problem-Solving (Non-Negotiable):**
      *   **What it must do:** Explain how intelligence serves to achieve goals, overcome obstacles, and solve problems relevant to the system.
      *   **Why it's in the spec:** Randomly generating outputs isn't intelligent, even if some are correct. The slime mold *is* solving the "find food" problem. An LLM generating coherent text *can* be seen as solving the "predict next token" problem, but does it have *higher-order* goals? Navigation requires solving the "get from A to B safely" problem.
      *   **Camp Bias:** Relatively shared, but the nature of "goals" differs (explicit programming vs. evolved drives vs. emergent).

  4.  **Address Learning & Adaptation (Non-Negotiable):**
      *   **What it must do:** Explain how knowledge/skills are acquired, refined, and updated based on experience or new information.
      *   **Why it's in the spec:** Static systems (like a pre-programmed maze solver) are less "intelligent" than those that learn (like a rat or RL agent). Slime molds adapt growth patterns, showing basic adaptation. LLMs learn from data, but struggle with rapid, continual, embodied learning.
      *   **Camp Bias:** Shared core requirement, but views differ on *mechanisms* (statistical learning, synaptic plasticity, embodied exploration).

  5.  **Handle Grounding/Embodiment (Contested - Major Tension Point):**
      *   **What it must do:** Explain the relationship between internal processing and the external world (physical or informational).
      *   **Why it's in the spec:** Can a pure symbol manipulator (like a theoretical LLM without sensory input) truly *understand* "red," "heavy," or "falling"? The "dark room" problem highlights this. Slime mold intelligence *is* fundamentally embodied chemical computation. Navigating a room requires sensory grounding.
      *   **Camp Bias:** **CRITICAL DIVIDE.** Embodied cognition (Andy Clark, Rodney Brooks) sees grounding/embodiment as *essential*. Classical AI & computationalism (Jerry Fodor, David Marr) argue for substrate independence – intelligence is about the *computation*, not the physical medium. Psychometrics is often agnostic but implicitly assumes human embodiment.

  6.  **Distinguish Capacity vs. Achievement (Essential Distinction):**
      *   **What it must do:** Clearly separate *potential* (capacity, competence) from *demonstrated performance* (achievement, performance).
      *   **Why it's in the spec:** An injured genius hasn't lost their intelligence (capacity), just their current ability to express it (achievement). An LLM has the *capacity* stored in weights, but its *achievement* depends on the prompt and context. IQ tests aim (imperfectly) to measure capacity, while benchmarks measure achievement.
      *   **Camp Bias:** Psychometrics is built on this distinction. AI often conflates them (performance *is* capacity). Embodied cognition sees capacity as intertwined with bodily potential.

  7.  **Articulate Domain-Generality vs. Domain-Specificity (Essential Distinction):**
      *   **What it must do:** Explain the interplay between broad, transferable abilities (g-factor, fluid intelligence) and specialized, highly optimized skills (crystallized intelligence, expert systems).
      *   **Why it's in the spec:** Humans have both. An LLM might have broad linguistic "generality" but fail at specific spatial reasoning requiring embodiment. Is a chess engine intelligent? It's supremely domain-specific. A slime mold is *only* domain-specific. True generality is rare.
      *   **Camp Bias:** Psychometrics focuses *heavily* on the g-factor (generality). AI often builds highly specialized systems but seeks AGI (generality). Embodied cognition sees generality emerging from domain-specific embodied interactions.

  8.  **Explain Efficiency & Resourcefulness (Important):**
      *   **What it must do:** Account for how intelligent systems solve problems effectively, often with limited resources (time, energy, information), using heuristics, insight, or novel shortcuts.
      *   **Why it's in the spec:** Brute force search (like early chess programs) is less "intelligent" than an algorithm using strategy. Humans use "fast and frugal" heuristics. Slime molds find efficient paths via simple rules. An LLM generating a concise, insightful answer is more impressive than a verbose, rambling one.
      *   **Camp Bias:** AI explicitly optimizes for efficiency. Psychometrics correlates g with processing speed. Embodied cognition sees efficiency arising from body-environment coupling.

  **The Major Tension: Can These Co-Exist?**

  *   **Embodiment vs. Substrate Independence:** This is the **core philosophical clash**.
      *   **Embodiment Argument:** True understanding and flexible intelligence *require* sensory-motor interaction with a physical world. Symbols only have meaning through grounding. An LLM manipulating "dark room" symbols lacks the *experience* of darkness/navigation.
      *   **Substrate Independence Argument:** Intelligence is an abstract property of information processing. Any system implementing the *right computations* is intelligent, regardless of hardware (brain, silicon, slime mold chemistry). The "dark room" failure is due to *missing computational modules* (spatial reasoning, proprioception simulation), not lack of flesh.
      *   **Can they be reconciled?** Only with significant "fudging": Either 1) Define "environment" very broadly (e.g., the LLM's text environment *is* its world, making navigation irrelevant), or 2) Insist that substrate independence only applies *after* the necessary grounding computations (simulated or real) are included. Pure versions of these views **are logically incompatible**.

  **How Major Theories Score Against the Spec:**

  1.  **Psychometric g-Factor (Spearman, Jensen):**
      *   **Strengths:** Strong on Capacity vs. Achievement (aims to measure capacity), addresses Domain-Generality (g is core), has Scope/Thresholds (statistical norms), explains cross-domain correlations.
      *   **Weaknesses:** Poor on Grounding/Embodiment (assumes human biology), struggles with non-human intelligence (slime mold, AI), limited explanation of *mechanisms* (g is statistical, not causal), downplays domain-specificity. Fails the "dark room" test for non-embodied systems.

  2.  **Embodied/Enactive Cognition (Varela, Thompson, Clark):**
      *   **Strengths:** Excellent on Grounding/Embodiment (core tenet), explains Efficiency/Resourcefulness via coupling, naturally handles learning in physical contexts, provides a Scope (requires situatedness), explains why LLMs struggle with physical reasoning.
      *   **Weaknesses:** Struggles with Substrate Independence (often rejects it), can downplay abstract symbol manipulation (e.g., pure math), Scope/Thresholds can be fuzzy ("How embodied is embodied enough?"). Does a purely simulated embodied agent count? Less clear on highly abstract, domain-general reasoning divorced from immediate sensing/acting.

  3.  **Intelligence as Adaptation (Piaget, Evolutionary Psych):**
      *   **Strengths:** Very broad Scope (applies to all life), strong on Goal-Directedness & Problem-Solving (survival/reproduction), core to Learning/Adaptation, explains Efficiency (evolutionary pressure).
      *   **Weaknesses:** Often too broad (is *all* adaptation "intelligence"? Bacterial resistance?), fuzzy Thresholds, struggles with artificial systems (is an LLM "adapting"?), can downplay domain-generality in favor of domain-specific evolved modules. Doesn't cleanly resolve Capacity vs. Achievement or Grounding vs. Substrate debates.

  **Conclusion for Your Editor:**

  When we argue about whether something is "smart," we're arguing about **which items on this spec sheet are mandatory and how they are weighted.** The core battlefields are:

  1.  **Flexibility vs. Specialization:** How much transfer is required?
  2.  **Grounding vs. Abstraction:** Does intelligence *require* a physical body/senses, or is pure computation enough?
  3.  **Scope & Thresholds:** What *kinds* of systems (biological, artificial, alien) can even qualify, and what's the minimum bar? (Is slime mold adaptation "intelligence"? Is expert-level chess AI "intelligent"?)
  4.  **The Ghost vs. The Machine:** Is intelligence fundamentally about internal representations and computations (substrate-independent), or is it inextricable from physical interaction (embodied)?

  The "hard cases" (slime mold, LLM in a dark room) expose where different theories fail parts of the spec. No current theory aces the whole sheet, and the tension between grounding and substrate independence remains the deepest philosophical rift. The argument isn't just about tests; it's about the fundamental nature of mind, information, and life. Your feature is asking exactly the right question.
