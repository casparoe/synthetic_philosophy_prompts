  hey, i'm a software engineer with basically zero philosophy background and my roommate asked me this weird hypothetical i can't shake. imagine you wake up in a hospital and find out doctors hooked you up to some stranger - your kidneys are literally keeping him alive, and they say it'll take 9 months before he can survive alone. you never consented, you were knocked out. one friend says you can unplug anytime since nobody can force your body to be life support. the other friend says thats wrong because this guy is a full person with a whole future just like yours, and disconnecting is basically killing him - the doctors even said its not technically causing death, just removing an obstacle. both sides sound kinda right but they cant both be. can you walk me through which argument actually holds up? writing this quick on my phone during a deploy, sorry for typos.
