  We are going to translate Dennett's "Where Am I?" thought experiment into distributed systems terminology. The key elements of Dennett's argument:

  1. Dennett's brain is removed and kept alive in a vat (called "Yorick"). His body (now without a brain) is controlled remotely by Yorick via radio.
