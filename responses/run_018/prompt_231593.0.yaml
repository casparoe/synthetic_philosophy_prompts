  Hmm... This requires analyzing both instrumental value (probability of being decisive) and expressive value (what the vote communicates). For instrumental value, in large elections, the probability of being decisive is extremely low—like one in millions. Even if candidate B is much worse, multiplying a tiny probability by a large harm difference might give a very small expected utility. For example, if harm difference is 10 million utils and P(decisive) is 1/10 million, expected utility is only 1 util. That seems negligible.

  But the expressive aspect is trickier. Voting might signal support for a candidate, affecting future politics. If others see votes for A as endorsement, it could shift party platforms or norms. But there's also moral integrity—voting for A might feel like complicity in bad policies. The user mentioned their community would misinterpret the vote as full endorsement, which complicates things.

