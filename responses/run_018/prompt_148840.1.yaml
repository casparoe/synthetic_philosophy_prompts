  I was talking with my friend Jake last night about whether quantum mechanics is actually describing little particles out there or if it's just a calculation tool that gets the numbers right. He shut me down with that line, "if scientific realism was false then the success of science would be a miracle," like that alone proves our theories are literally true about reality. I feel like there's a bunch of different philosophical claims hiding inside that one sentence, but I can't tell them apart.

  Could you lay them out for me as a kind of menu? I want the trivial version, the version that's about specific entities versus just the mathematical structure being correct, and any other precise readings you can think of. For each one say if it's just a platitude, if it's actually defensible but contentious, or if it's flat out false. I also want to know which version Jake was probably running when he used it to dismiss the idea that quantum mechanics might just be instumental, and whether any of these readings actually answer that pessimistic meta-inducton problem where every past theory turned out to be wrong. No need for reading lists or quotes from papers, I just want to think through the options before I talk to him again.
