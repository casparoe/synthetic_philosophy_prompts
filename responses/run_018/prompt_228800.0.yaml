prompt: |-
  I am preparing a position statement on the ethics of humanitarian intervention for a policy institute's working group, and before circulating it I want a rigorous consistency audit of the commitments I intend to defend. Here is the full set:

  1. NATO's 1999 intervention in Kosovo was justified, even though it proceeded without Security Council authorization.
  2. The 2003 invasion of Iraq was not justified, and its failure was not merely a failure of execution or intelligence; it was illegitimate in principle.
  3. What ultimately distinguishes legitimate from illegitimate interventions is the genuinely humanitarian motive of the interveners, not the presence or absence of a legal mandate. Law tracks legitimacy imperfectly at best.
  4. The 2011 intervention in Libya was justified when it began, but NATO's expansion of the mission from protecting civilians to pursuing regime change was a betrayal of the authorizing resolution's terms, and that overreach is precisely what made the campaign, taken as a whole, illegitimate.
  5. State sovereignty is a genuine moral value, not merely a legal convenience, and unauthorized intervention damages the international order in ways that must be counted as real costs, even when the intervention succeeds.
  6. A Security Council veto (or threatened veto) by an interested power cannot function as a moral veto on humanitarian rescue; if it did, the most atrocity-prone situations would be systematically unaddressable.

  My questions are these. First, are all six commitments jointly tenable, or do some of them rest on incompatible pictures of where the legitimacy of an intervention comes from? I am especially interested in whether the standard I use to sort the cases is one standard or two different standards applied opportunistically. Second, identify any tensions that are only apparent and dissolve on inspection, so that I do not waste the group's time defending against objections that miss. Third, for each genuine tension, state exactly which commitment would have to be revised or abandoned to resolve it, and what that revision would cost me in terms of the case verdicts I want to keep. Please rank the tensions by severity rather than treating them as equally serious.

  I am not asking for a survey of positions in the literature. I want a committed verdict: tell me which single revision to my set restores the most consistency at the lowest cost, defend that choice against the next-best alternative, and be explicit about where you are confident and where your reasoning depends on a contestable premise.
reasoning: |-
  Okay, the user is preparing a position statement on the ethics of humanitarian intervention and wants a rigorous consistency audit of their six commitments. They're concerned about whether these commitments are jointly tenable or if there are internal contradictions, especially regarding the standards used to judge different interventions. 

  First, I need to thoroughly understand each commitment. The user justifies Kosovo (without UN authorization) but condemns Iraq, prioritizes humanitarian motive over legal mandates, criticizes Libya's mission creep, values state sovereignty morally, and rejects veto powers as moral vetoes. The core tension seems to be between rejecting legal authority as decisive (Commitment 3) while treating its violation as a key factor in Libya (Commitment 4) and valuing sovereignty's moral weight (Commitment 5).

  Hmm... the Libya critique is particularly tricky. The user calls the intervention initially justified but illegitimate overall due to mandate violation. But if motive is truly the ultimate criterion (Commitment 3), why does exceeding the UN mandate automatically invalidate it? Unless they're implying the motive changed from humanitarian to regime change, but they don't explicitly say that. This feels like a potential weak spot—Commitment 4's reliance on mandate adherence seems to contradict Commitment 3's dismissal of legal formalities.

  The sovereignty point (Commitment 5) also creates friction. If unauthorized interventions damage international order as a "real cost," how does that square with Kosovo being "justified" without authorization? The user must believe Kosovo's humanitarian gains outweighed those costs, but they haven't provided a framework for weighing sovereignty costs against intervention benefits. That's a missing piece—without it, Commitments 1 and 5 could be seen as inconsistent.

  Wait, the veto point (Commitment 6) actually strengthens the case against legalism. It's logically consistent with downplaying UN authorization (Commitment 3) and Kosovo's justification (Commitment 1). No tension there. And the Iraq/Libya distinctions hold up if we accept motive as the core standard—Iraq lacked genuine humanitarian motive from the start, while Libya's motive arguably corrupted later. 

  The biggest problem is definitely Commitment 4's dependence on mandate violation as the dealbreaker. To fix this, the user could modify Commitment 3 to acknowledge that legal mandates create moral constraints *when they exist*, or reframe Libya's illegitimacy as a motive shift rather than mandate breach. The former is cleaner but costs them the purity of "motive alone" mattering; the latter preserves motive as paramount but requires stronger evidence of NATO's bad faith in Libya. 

  Alternatively, doubling down on motive for Libya might force an uncomfortable revision: if regime change was NATO's true motive all along, then even the initial intervention was unjustified, contradicting their stance. But if motive shifted, they need to show how—without relying solely on mandate overreach as proof. 

  The minimal-cost solution? Clarify that mandates gain moral weight when they operationalize humanitarian intent, so violations *can* indicate corrupted motives. This retains most commitments while adding nuance. It costs them theoretical simplicity but saves their case judgments. 

  For the working group, I’d advise preempting objections about Libya by explicitly linking mandate violation to motive degradation. And for sovereignty costs, they should add a balancing principle (e.g., "sovereignty yields only to extreme humanitarian necessity") to reconcile Kosovo with Commitment 5. 

  Ultimately, the commitments are salvageable with tweaks to Commitment 3 and 4’s interface. The user’s core insight—that motive is primary but not sufficient—just needs sharper articulation.
answer: |-
  Here is a rigorous consistency audit of your commitments, ranked by severity of tension, with a clear prescription for the minimal revision achieving maximal coherence:

  **Core Tension & Severity Ranking:**

  1.  **Severe Tension: Commitment 3 vs. Commitment 4** (Genuine Humanitarian Motive vs. Mandate Adherence as Illegitimacy Trigger in Libya)
  2.  **Moderate Tension: Commitment 5 vs. Commitment 1** (Moral Value of Sovereignty/Unauthorized Damage vs. Kosovo Justification)
  3.  **Apparent Tension: Commitment 6 vs. Commitment 5** (Veto Not Moral Veto vs. Sovereignty's Moral Value) - *This dissolves on inspection.*
  4.  **Minimal Tension: Commitment 3 vs. Commitment 2** (Motive vs. Iraq Illegitimacy) - *Consistent if motive assessment holds.*

  **Detailed Analysis:**

  1.  **Severe Tension: Motive vs. Mandate Adherence (Commitment 3 vs. 4)**
      *   **Conflict:** Commitment 3 states the *ultimate* distinction is "genuinely humanitarian motive," minimizing the relevance of a legal mandate ("Law tracks legitimacy imperfectly at best"). Commitment 4, however, makes Libya's *initial* legitimacy hinge on its authorization (implying the mandate *did* contribute legitimacy) and crucially, its *overall* illegitimacy hinges *precisely* on NATO exceeding "the authorizing resolution's terms." This elevates mandate adherence to a decisive factor for legitimacy *in this case*, directly contradicting Commitment 3's assertion that motive is ultimate and law is secondary.
      *   **Why it's Severe:** It directly challenges the core standard proposed in Commitment 3. Why is mandate adherence a fatal flaw for Libya (Commitment 4) if motive is truly "ultimate" and law tracks it "imperfectly at best" (Commitment 3)? If motive shifted from humanitarian to regime change, *that* should be the reason for illegitimacy according to Commitment 3. Blaming the *mandate violation itself* implicitly grants the mandate independent moral weight in determining legitimacy, conflicting with Commitment 3. This looks like applying the motive standard to Kosovo/Iraq and opportunistically switching to a mandate-compliance standard for Libya when motive becomes harder to assess or defend.
      *   **Resolution & Cost:** You must **revise Commitment 4** to ground Libya's illegitimacy *solely in motive*, not the mandate violation. **Option:** "The 2011 intervention in Libya was justified when it began based on the humanitarian motive and imminent threat. However, NATO's expansion of the mission revealed a *shift in motive* from civilian protection to regime change. This corrupted the humanitarian purpose, making the campaign illegitimate overall." **Cost:** You lose the clean, objective "betrayal of terms" argument and must explicitly argue NATO's motive *changed* or was *insincere* from the outset, which is more contestable. You preserve Commitment 3's primacy of motive and consistency with Kosovo's lack of authorization. *This is the single revision with the highest consistency gain at the lowest cost.*
      *   **Alternative (Higher Cost):** Weaken Commitment 3: "Motive is primary, but adherence to a legally obtained mandate is a significant *procedural constraint* that gains moral weight *once invoked*." **Cost:** Undermines Kosovo justification (Commitment 1) and weakens the critique of the veto (Commitment 6). Significantly complicates the core standard.

  2.  **Moderate Tension: Sovereignty Cost vs. Kosovo Justification (Commitment 5 vs. 1)**
      *   **Conflict:** Commitment 5 strongly asserts that unauthorized intervention damages the international order ("real costs, even when the intervention succeeds"). Commitment 1 asserts Kosovo was "justified" without authorization. This implies the humanitarian gains *outweighed* the sovereignty/international order costs *dramatically* in Kosovo. However, Commitment 5 doesn't specify *how* these costs are weighed against humanitarian gains. The tension lies in the *strength* of Commitment 5 ("genuine moral value," "real costs") potentially making unauthorized intervention very difficult to justify, seemingly at odds with the Kosovo verdict.
      *   **Why it's Moderate, Not Severe:** This is a tension of *application and threshold*, not a fundamental contradiction. It's consistent to believe sovereignty is a real moral value causing real damage when violated *and* that Kosovo's humanitarian catastrophe was so severe that it outweighed these costs. The tension arises because Commitments 1 and 5 don't explicitly define the threshold for when humanitarian necessity overrides sovereignty concerns.
      *   **Resolution & Cost:** **Clarify the Threshold** implied by Commitments 1 & 5, likely within Commitment 5 itself. **Option:** Add to Commitment 5: "However, the moral weight of sovereignty yields to an *overriding imperative* to halt or prevent mass atrocities or genocide, as in Kosovo." **Cost:** Minimal. It makes the balancing explicit and justifies Kosovo while upholding the gravity of sovereignty costs. Preserves all case verdicts and core principles. *This clarification is necessary but less drastic than revising the Libya verdict.*
      *   **Alternative (High Cost):** Abandon Kosovo justification (Commitment 1) to uphold a stricter reading of sovereignty. **Cost:** Contradicts your desired case verdict and weakens the critique of the veto (Commitment 6).

  3.  **Apparent Tension: Veto vs. Sovereignty (Commitment 6 vs. 5) - DISSOLVES**
      *   **Apparent Conflict:** Commitment 6 says a veto by an interested party isn't a moral veto. Commitment 5 says sovereignty is a moral value and unauthorized intervention damages order. Doesn't Commitment 6 undermine Commitment 5?
      *   **Dissolution:** No. Commitment 6 addresses a *specific barrier* to authorization (veto abuse), not the *general value* of sovereignty or authorization. It argues that *this particular procedural failure* (veto by an interested party) shouldn't morally block intervention if humanitarian necessity is extreme. Commitment 5 establishes the *baseline value* being overridden *in such extreme cases*. They are complementary: Sovereignty is a real value (C5), *but* it can be overridden by extreme humanitarian need (implied by C1/C6), *and* a self-interested veto shouldn't prevent that override when needed (C6). The "damage to international order" (C5) is acknowledged as a real cost *even when the intervention is justified* (C1).

  4.  **Minimal Tension: Motive vs. Iraq (Commitment 3 vs. 2) - CONSISTENT**
      *   **Apparent Conflict:** Commitment 3 says motive is ultimate. Commitment 2 says Iraq was illegitimate "in principle." Is this consistent without proving motive?
      *   **Resolution:** Easily consistent. Commitment 2 explicitly rejects the argument that failure was merely "execution or intelligence," asserting illegitimacy *in principle*. The "in principle" illegitimacy strongly implies the absence of a genuine, primary humanitarian motive as defined in Commitment 3. The stated justifications (WMDs, terrorism links) are widely seen as pretexts. Your framework judges Iraq illegitimate *because* its core motive wasn't humanitarian, aligning perfectly with Commitment 3.

  **Committed Verdict & Prescription:**

  *   **The most severe and damaging inconsistency is between Commitment 3 (Motive as Ultimate) and Commitment 4 (Mandate Violation as Fatal for Libya).**
  *   **The single most effective revision is: Amend Commitment 4** to ground Libya's illegitimacy *exclusively in a corrupted or absent humanitarian motive* (e.g., shift to regime change), **not** the violation of the UN mandate. Frame the mandate overreach as *evidence* of the corrupted motive, not the *cause* of illegitimacy.
  *   **Why this over alternatives?**
      *   **Against Revising Commitment 3:** Weakening C3 (e.g., adding procedural weight to mandates) fatally undermines Kosovo (C1) and the veto critique (C6). It abandons your core, distinctive claim that law imperfectly tracks legitimacy. Cost is too high.
      *   **Against Abandoning Kosovo (C1):** This sacrifices a key desired case verdict and weakens C6 unnecessarily. The sovereignty cost tension (C1 vs C5) is resolvable with clarification.
      *   **Clarity & Coherence Gain:** Revising C4 as prescribed directly resolves the core methodological inconsistency (opportunistic standard switching) while preserving your judgments on all cases and your foundational principles (C3, C5, C6). It forces a more robust argument about NATO's motives in Libya but strengthens the overall coherence significantly.
  *   **Confidence Level:** High confidence in identifying the C3 vs C4 tension as the primary inconsistency. High confidence that revising C4 as prescribed resolves it effectively. Moderate confidence that the sovereignty cost tension (C1 vs C5) is resolved by adding an explicit threshold clarification (as it's inherent in your existing judgments). The dissolution of the C5 vs C6 tension and consistency of C2 with C3 are high-confidence assessments.
  *   **Contestable Premise:** The prescription assumes that NATO's motive in Libya *can* be credibly argued to have shifted or been corrupted, allowing the revised C4 to stand. Critics might argue the regime change focus was inherent or that protecting civilians *required* removing Gaddafi. You must be prepared to defend the motive-based argument for Libya's illegitimacy rigorously.

  **Final Recommended Position Set (Revised):**

  1.  (Unchanged) Kosovo justified despite no UNSC auth.
  2.  (Unchanged) Iraq illegitimate in principle (non-humanitarian motive).
  3.  (Unchanged) Genuine humanitarian motive is the ultimate distinction; law tracks legitimacy imperfectly.
  4.  **(Revised) Libya's intervention was initially justified based on humanitarian motive/threat. However, NATO's expansion into regime change revealed a corruption/abandonment of that motive, rendering the campaign illegitimate overall.** (Mandate violation is evidence, not the cause).
  5.  (Clarified) State sovereignty is a genuine moral value... [Add:] *Nevertheless, this value yields to an overriding imperative to halt mass atrocities or genocide.* Unauthorized intervention damages the international order...
  6.  (Unchanged) Veto by interested power ≠ moral veto.

  This set is maximally consistent, retains your core case judgments and principles, and focuses critique where it belongs: on the motives and consequences of intervention, not the procedural violation per se in Libya.
