  The false presupputation is trickier. Rejecting the hedonic calculus doesn’t eliminate the need to explain why people seek tragedy. The user must still account for the appeal of melancholic attention. They need to argue that this state has intrinsic value—perhaps through insight into the human condition—making the negative content worthwhile without pleasure. If they can’t, they risk circularity: people value it because it’s valuable.

  Distinguishing occurrent affect from framing commitment does explanatory work. It shows that the immediate emotion (sadness) isn’t abolished but situated within a chosen framework of engagement. The agency in maintaining this frame allows for a different kind of satisfaction—non-hedonic appreciation. This avoids definitional fiat if backed by phenomenology: audiences report feeling enriched, not happy.

