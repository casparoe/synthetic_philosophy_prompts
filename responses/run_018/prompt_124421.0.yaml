answer: |-
  ## The Thin Core Gambit: Can Contextualist Expressivism Escape Frege-Geach?

  You're right – the "lying is wrong" examples get stale. Let's dig into the core tension you identify: if expressivism claims moral judgments *primarily* express non-cognitive attitudes (like disapproval), but also acknowledges a thin, context-sensitive descriptive anchor for moral predicates, can this hybrid model finally defang the Frege-Geach objection? Or does the objection retain its lethal bite? I'll argue that while this **contextualist expressivism** significantly mitigates the problem for much ordinary discourse, it ultimately **fails to completely immunize expressivism**, leaving Frege-Geach with a weakened but still significant sting.

  **The Frege-Geach Challenge: Core and Classic Replies**

  Geach's fundamental insight is that moral language functions *logically* like descriptive language. Consider:

  1.  **Simple Assertion:** "Lying is wrong." (Expressivist: Primarily expresses disapproval of lying.)
  2.  **Embedded in Conditional:** "If lying is wrong, then getting your little brother to lie is wrong."
  3.  **Negation:** "Lying is not wrong."

  The problem arises in (2) and (3). Logic demands that the *same content* expressed in (1) must be capable of being embedded in logical operators like 'if...then...' and 'not' for the arguments to be valid. How can an expression of *attitude* (disapproval) be the antecedent of a conditional or the target of negation? What does it even *mean* to say "If [boo! lying]..." or "Not [boo! lying]"?

  *   **The Classic Expressivist Replies:**
      *   **Pragmatic Transmission (e.g., early Blackburn):** The conditional doesn't embed the *attitude itself*, but expresses a *higher-order attitude* about the connection between attitudes. Accepting "If lying is wrong, then getting your little brother to lie is wrong" expresses disapproval of *combining* disapproval of lying with *lack* of disapproval of getting your brother to lie. It's a complex state of mind, not propositional content.
      *   **Deflationism (e.g., Gibbard):** There *is* propositional content, but it's minimal and constituted *by* the attitudes. "Lying is wrong" is true iff the speaker disapproves of lying (or iff it's rational to disapprove, etc.). Embedding then works straightforwardly because we *are* embedding truth-apt content, albeit content defined by attitudes.

  **The Hybrid Contextualist Expressivist Gambit**

  Your proposed model adds a crucial refinement: Moral predicates ("wrong") carry a **thin descriptive core** alongside their primary expressive function. This core isn't a robust natural property but a minimal, context-sensitive anchor in social-normative reality. Think of it as:

  1.  **Disapproval-Expression:** The core non-cognitive element remains dominant.
  2.  **Minimal Descriptive Anchor:** "Wrong" latches onto *something* like "violating contextually salient norms/rules/expectations deemed authoritative within this conversational framework." This anchor shifts with context – what counts as the relevant "norm" changes depending on the conversation (e.g., discussing club rules vs. universal human rights).
  3.  **Placeholder Function:** In embedding contexts, what gets embedded isn't the *full-blooded attitude* nor a *thick descriptive property*, but this **minimal descriptive schema plus the *potential* for attitude expression.** The conditional "If lying is wrong..." means something like "If lying violates the contextually salient norms (whatever they are in *this* context of evaluation), then [attitude towards getting brother to lie implied]".

  **Why This Seems Promising Against Frege-Geach**

  1.  **Embedding the Anchor:** The contextualist claims we *can* embed the thin descriptive component. "If lying violates the salient norms..." *is* a truth-apt proposition (albeit context-dependent). We can condition on whether an act falls under the contextually defined schema "violates salient norms."
  2.  **Logic Preserved (Superficially):** Validity of modus ponens seems restored. If "Lying violates salient norms N" is true, and "If lying violates N, then getting brother to lie violates N" is true (based on the logic of norms), then "Getting brother to lie violates N" follows, and the expressive attitude towards *that* act can be generated.
  3.  **Avoids Attitude Embedding:** It sidesteps the bizarre idea of embedding a raw "Boo!" within a conditional. The attitude expression happens *after* the descriptive placeholder is filled and evaluated.
  4.  **Handles Context Shift:** It elegantly explains why moral conditionals can hold across contexts with different norms. The antecedent sets up a hypothetical context ("*If* lying violated norms N...").

  **Why the Objection Still Bites: The Residual Tension**

  While this model is sophisticated and handles many cases better than pure expressivism, Frege-Geach's core challenge persists in key ways:

  1.  **The Primacy of Expression vs. Logic's Demand:** The model *still* posits that the *primary* semantic function of "wrong" is expressive. Yet, logic, especially in complex embeddings (negation, disjunction, nested conditionals), relentlessly treats the *moral predicate itself* as the unit contributing to truth conditions. The contextualist must insist that in "~W(lying)", it's the *descriptive schema* ("violates salient norms") that is negated, *not* the attitude. But this feels like a semantic sleight of hand. The expressive force is so fundamental to the meaning of "wrong" that its complete absence in the logical structure seems artificial. **Logic requires treating "W" uniformly as a predicate contributing to truth-apt content *at the point of embedding*. The contextualist hybrid struggles to fully reconcile this with the *non-truth-apt* expressive core being primary.**
  2.  **The Phantom of Robust Truth Conditions:** The thin descriptive anchor ("violates salient norms") is *itself* deeply normative and often relies on the very attitudes expressivism seeks to ground. Determining what the "salient norms" *are* in a context frequently involves detecting shared attitudes or dispositions. This risks circularity: the descriptive anchor needed for embedding might ultimately be parasitic on the attitudes it's supposed to help embed without directly invoking them. Is "violates salient norms" genuinely descriptive in the way logic requires, or is it just a disguised way of talking about *what people disapprove of* in that context? If the latter, we haven't escaped the original problem.
  3.  **Complex Embeddings Strain the Placeholder:** Consider: "Either lying is not wrong, or telling Joe he has to lie is wrong." The disjunction requires both disjuncts to share a common type of content that can be true or false independently. The contextualist must say: "Either lying does *not* violate the salient norms, or telling Joe to lie *does* violate them." But the "salient norms" must be *fixed* for the whole disjunction to be evaluable. Yet, each disjunct might naturally pull towards different contextual norms. Fixing the context rigidly feels artificial and doesn't reflect how we understand such claims, where the norms themselves might be part of what's being disputed *within* the logical structure.
  4.  **The Loss of Unqualified Moral Judgment:** In simple assertions ("Lying is wrong"), the expressive attitude is central. But in complex embeddings, it's pushed to the periphery, activated only *after* the context-dependent descriptive placeholder is resolved. This creates a disconnect between the *meaning* of "wrong" in simple assertions and its *function* in logic. The expressive primacy becomes pragmatically inferred rather than semantically embedded. Geach's point is that the meaning *must* be the same in both contexts for logic to work. The hybrid risks fracturing that unity.

  **The Verdict: A Mortal Wound Mitigated, Not Healed**

  The contextualist expressivist model with a thin descriptive core is a significant advance. It handles a vast swathe of ordinary moral discourse, particularly simple conditionals and negations, far more plausibly than pure expressivism or even early quasi-realism. It leverages context-sensitivity in a powerful way that mirrors how we actually use moral language.

  **However, it does not render expressivism immune to the Frege-Geach objection.** The fundamental tension remains:

  *   **Logic demands:** Moral predicates contribute uniform, truth-apt content at the point of embedding within complex sentences for validity to be preserved.
  *   **Expressivism insists:** The core meaning of moral predicates is non-cognitive (attitude expression).

  The thin descriptive anchor provides a clever patch, allowing logic to operate *as if* on descriptive content. But this patch relies on downplaying the expressive primacy precisely where logic needs semantic uniformity the most (in complex embeddings and negation). The descriptive placeholder, while minimal and context-sensitive, is still asked to bear the full weight of logical embedding, leaving the expressive core semantically inert within those structures. This creates an unstable duality at the heart of the theory. The residual circularity concerning the normative nature of the "salient norms" and the artificiality in fixing context for complex logic further weaken its defense.

  **Conclusion:** While this hybrid expressivism is far more resilient than its predecessors and likely captures important aspects of moral language, **Frege-Geach still bites.** It exposes a fundamental difficulty in reconciling the *logical behavior* of moral language, which behaves robustly like descriptive discourse, with the *semantic primacy* of non-cognitive attitudes. The objection isn't necessarily *fatal* in the sense of destroying the theory – many expressivists work within this tension, refining their models (like sophisticated versions of inferentialism). But it is **diagnostic**, revealing that expressivism, even in its most sophisticated contextualist-hybrid form, cannot fully assimilate moral language into the logical framework without significant concessions that strain its core non-cognitive commitment. Your intuition that the objection persists is correct; the thin core mitigates the bleeding but doesn't stop it entirely. Your roommate might think you're overthinking, but wrestling with this tension *is* the hard, necessary work of metaethics. Keep digging.
