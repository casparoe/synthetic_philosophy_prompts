answer: |-
  The core conceptual tension within Rousseau's critique arises from this question: **Does the mere act of collective *spectatorship* inherently introduce a distorting representational layer that corrupts authentic social bonds, or can specific forms of public gathering structure spectatorship in a way that facilitates *immediate* self-presence and collective identification without mediation?**

  Here's the distinction:

  1.  **The Problem of Mediated Spectatorship (Theater):** Rousseau condemns theater as a *doubly* mediating institution.
      *   **Representational Mediation:** Actors *represent* fictional characters and situations, placing an artificial layer between the audience and reality. The audience experiences emotions *about* representations, not about their own lives or community. This fosters artificial, vicarious passions disconnected from genuine civic virtue.
      *   **Social Mediation & Inequality:** The physical structure (stage, seats, tickets) enforces passivity and creates a hierarchy: active performers vs. passive spectators. Further, the content often reflects and reinforces existing social inequalities and corrupt urban tastes, not the authentic spirit of the people. Spectatorship becomes an isolated, private experience of emotion *in a crowd*, not a genuine collective *participation*. The shared visual experience is *of* a representation, not *of* themselves as a collective.

  2.  **The Claim of Unmediated Presence (Civic Festivals):** Rousseau endorses open-air civic festivals precisely because he argues they *avoid* these mediations, creating a space of direct civic communion.
      *   **Absence of Representation:** There are no actors playing roles. The citizens *are* the spectacle. The dances, games, or processions are expressions *of* the assembled people *by* the assembled people. The content is the community itself, its shared identity, and simple, virtuous joys. There is no fictional layer to interpret or emotionally invest in vicariously.
      *   **Spectatorship as Participation:** While citizens are organized *as* spectators, the key difference is that they are simultaneously **observing themselves and their peers enacting their *own* collective existence.** The spectator *recognizes* themselves *in* the spectacle. Watching the festival *is* participating in the affirmation of the community. The "stage" dissolves into the public square; the "audience" *is* the performers. The shared visual experience fosters immediate identification ("That is *us*") rather than passive observation of an "other."
      *   **Immediacy and Transparency:** The festival aims for transparency – the emotions felt (patriotism, communal joy, fraternity) are direct responses to the *real, present* community gathered, not mediated through fictional characters or plots. The experience is one of immediate self-presence as a collective body.

  **Why Settling This Distinction Matters for Rousseau's Consistency:**

  Rousseau's entire political philosophy hinges on the possibility of **authentic, unmediated collective self-determination** expressed through the General Will. This requires citizens capable of direct, transparent communication and identification with the whole community, free from the corrupting influences of private interests, representation, and artificial social hierarchies.

  *   **If All Spectatorship is Corrupting:** If the mere act of gathering as spectators *inevitably* introduces passivity, alienation, and a representational distance (even when watching oneself), then Rousseau's endorsement of civic festivals collapses into a contradiction. The festivals would merely be a different *form* of the corrupting spectacle he condemns in theater. This would fatally undermine his claim that a non-representational, direct form of public life is possible and desirable. His critique of theater would then implicitly condemn *all* large-scale public gatherings, leaving no viable model for his vision of civic cohesion.
  *   **If Unmediated Presence is Possible:** If the festival model successfully demonstrates that spectatorship *can* be structured as active self-recognition and participation – eliminating representational artifice and dissolving the performer/spectator hierarchy – then Rousseau's position holds. It provides the crucial counter-example proving that shared visual experience in public life *need not* be alienating or corrupting. The festivals become the embodied proof of his ideal: a public sphere where citizens experience their unity and will *directly*, without representational distortion. This validates his distinction between corrupt *mimesis* (theater) and authentic *expression* (festival) and maintains the coherence of his demand for direct participation against mediated representation in politics.

  **In essence:** The consistency of Rousseau's broader argument rests on successfully defending the conceptual and experiential difference between *observing a representation* (theater, inherently mediating/corrupting) and *observing/experiencing the collective self directly* (festival, potentially immediate/purifying). Without this distinction, his critique of theater undermines his positive vision; with it, he offers a model for direct civic presence indispensable to his political ideal.
