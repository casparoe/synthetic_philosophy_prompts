answer: |-
  Here is the proposal structured as requested:

  1.  **Research Question:** Can a technological system capable of autonomous self-replication in the absence of human intervention satisfy von Neumann's specific criteria for being an active computational system, defined by continuous physical state transitions, or does it necessarily become merely a passive propagating pattern?
  2.  **Hidden Tension:** Standard interpretations treat his automata theory (focusing on replication mechanics) and his brain-computation analogies (emphasizing physical instantiation) as separate concerns, masking the conflict between replication-as-survival and computation-as-active-process when considering human-independent technological lineages.
  3.  **Method:** Week 1-2: Define von Neumann's requirements for active computation (dynamic physical interaction). Week 3: Analyze his self-replicating automaton's minimal replication logic and resource dependence. Weeks 4-8: Rigorously confront the tension by examining if replication alone suffices for computational "activity", distinguishing autonomous pattern propagation from substrate-dependent state processing using his own framework.
  4.  **Success/Failure:** Success: A definitive argument reconciling autonomous replication with computational activity in his terms, or proving their incompatibility based on his core principles. Failure: Ambiguity persists; the tension remains unresolved due to inconsistent application of his criteria or inability to reach a clear conclusion within his framework.
  5.  **Scope Assessment:** Eight weeks is sufficient to map the tension precisely using primary texts but too short for extensive historical context or broader philosophy of technology debates; the question becomes too large if expanded to assess the viability of von Neumann probes generally or link directly to modern AI debates. Focus must remain strictly on resolving the conceptual conflict within his work.
