  **THE COMMON-KNOWLEDGE DINING ROOM**  
  *A Culinary Exploration of Shared Understanding*  
  *Chef de Cognition: M. Aumann*  
  *Sommelier: J. Harsanyi*

  ---

  **HOUSE RULES**  
  1.  All diners are seated in discrete, soundproofed contemplation chambers.  
  2.  Menu selections constitute binding commitments.  
  3.  Communication with the kitchen, staff, or your counterpart diner is strictly prohibited.  
  4.  Rationality is assumed; its common knowledge is the aspiration.  
