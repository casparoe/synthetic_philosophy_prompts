  A pristine Gillardeau oyster rests on a bed of chilled seawater gelee, studded with iridescent tapioca pearls. A single, minuscule compass rose is etched onto the shell.  
  *Chef's Note:* The pearl's location (left/right mantle) is unknown even to the shucker. Your counterpart receives an identical presentation. Does the symmetry inform your belief?  
  *Utility:* 15 UU (Paired outcome contingent on mutual inference)  
  *Pairing:* NV *Krug Grande Cuvée* (The inherent bubbles represent probabilistic priors rising).

