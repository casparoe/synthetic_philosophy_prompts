  Should any diner experience ontological dissonance or receive verifiable proof they are a simulated instance executing solely upon the kitchen's computational substrate (e.g., anomalous sensory latency >50ms, unexpected recursion error message, direct kernel access), a partial utility rebate of 30 UU may be requested. Proof of substrate must accompany the claim. Refunds are void if simulation discovery occurs post-payment commitment, as the binding nature of the initial choice remains algorithmically valid. The Restaurant disclaims liability for existential crises arising from the meal.
