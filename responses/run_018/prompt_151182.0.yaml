  ### Workshop Design: Universalizability Collapse  
  **Objective:** Experientially reveal Kant's universalizability tests through a network protocol simulation. Participants propose exception-handling rules, universalize them, then encounter system failure due to (1) logical impossibility (*contradiction in conception*) or (2) self-defeat (*contradiction in will*). Hidden indexical conditions ("only when I act") are exposed via symmetric mechanics.  

  ---

  ### **Materials**  
  - **16 Player Kits** (one per participant):  
    - 1 **Node ID Badge** (e.g., "Node 1A," "Node 2C"—4 clusters × 4 nodes).  
    - 5 **Data Tokens** (red cubes; 1 token = 1 data packet).  
    - 1 **Condition Card** (identical for all players; see below).  
  - **Central Hub Board**: Displays "NETWORK CAPACITY: 4 PACKETS MAX PER ROUND. EXCEED = CRASH."  
  - **Rule Proposal Board**: For teams to write rules.  
  - **Scoring Tokens** (blue chips): 1 token = +1 point (no real value).  
  - **Timer** (for rounds).  

  ---

  ### **Setup (10 min)**  
  1. **Seating**: 4 clusters of 4 participants each. Clusters are named (e.g., Cluster A, B, C, D).  
  2. **Distribute Kits**: Each participant receives a Node ID Badge, 5 Data Tokens, and an **identical Condition Card** reading:  
     > *"Your node’s latency is critical (delay ≥ 5ms)."*  
     *(Note: All players have this condition—this is the hidden indexical.)*  
  3. **Explain Core Mechanics**:  
     - **Goal**: Send Data Tokens to the Hub without crashing it.  
     - **Points**: Successfully sent packet = +1 point (blue chip). Crash = all packets lost (-1 point for sending nodes).  
     - **Rules**: Teams propose protocol rules. Once voted, *all nodes must follow the rule simultaneously*.  
     - **Hidden Condition**: Players reference their Condition Card when applying rules (*latency is always critical*).  

  ---

  ### **Round-by-Round Sequence (50 min)**  
  #### **Round 0: Baseline Chaos (5 min)**  
  - **Rule**: None. All nodes send one Data Token.  
  - **Result**: 16 packets sent → Hub crashes (exceeds capacity). All tokens lost, -1 point per sender.  
  - **Purpose**: Show unregulated failure.  

  #### **Round 1: Rule Proposal & Adoption (10 min)**  
  - **Task**: Teams propose exception-handling rules (e.g., "Send only if latency is critical").  
  - **Process**:  
    1. Teams brainstorm rules (5 min). Examples:  
       - "Send only if latency is critical."  
       - "Send only if node ID ends in 1."  
    2. Facilitator writes proposals on Rule Proposal Board. Group votes for one rule to adopt.  
  - **Adoption**: Announce the winning rule (e.g., "Send only if latency is critical"). *All nodes must follow it.*  

  #### **Round 2: Contradiction in Conception (15 min)**  
  - **Rule in Play**: "Send only if you are the *only node* in the network with critical latency."  
    *(Facilitator steers vote to this rule if not proposed.)*  
  - **Decision**:  
    - Players check Condition Card (*latency is critical*).  
    - Rule requires being the *only* critical node—but all 16 players are identical.  
  - **Action**: Nodes decide to send/not send (simultaneously reveal tokens).  
  - **Result**:  
    - **All send** (each assumes they alone qualify) → 16 packets → Crash → All tokens lost (-1 point/sender).  
    - **OR None send** (each assumes others qualify) → No data sent.  
  - **Collapse**: Rule is *logically impossible*—if universalized, "only one" contradicts "all have the condition."  

  #### **Round 3: Contradiction in Will (15 min)**  
  - **Rule in Play**: "Send only if latency is critical."  
    *(Facilitator ensures this rule replaces Round 2’s.)*  
  - **Decision**:  
    - Condition Card still applies (*latency critical*). All nodes meet the condition.  
  - **Action**: All send simultaneously.  
  - **Result**: 16 packets → Crash → All tokens lost (-1 point/sender).  
  - **Collapse**: Rule *defeats its purpose*—universal adoption makes "critical latency" meaningless, ensuring crashes.  

  #### **Round 4: Exposing the Hidden Indexical (5 min)**  
  - **Task**: Teams revise rules to avoid prior failures.  
  - **Reveal**: Facilitator asks, "What condition did everyone use?" Players see Condition Cards are identical.  
  - **Insight**: The hidden "only when *I* act" assumption (indexical) caused collapse when universalized.  

  ---

  ### **Debrief Plan (20 min)**  
  1. **Map Game Events to Kant’s Test**:  
     - **Round 2 Failure**: "Could everyone act on this maxim *without contradiction*?"  
       → *Contradiction in conception*: Rule required uniqueness ("only one") but all were identical. Universalization is logically impossible.  
     - **Round 3 Failure**: "Could you *rationally will* this maxim universally?"  
       → *Contradiction in will*: Rule’s purpose (prioritizing critical data) is undermined when all claim priority.  
     - **Condition Card**: "What was hidden in your maxim?"  
       → Players assumed "*my* latency is critical, but others’ might not be"—an indexical bias exposed by universal adoption.  

  2. **Predictable Problems & Mitigation**:  
     - **Problem**: Players focus on "fairness" (e.g., "Rotate turns!") vs. logical form.  
       *Mitigation*: Ask, "Could this rule work if *all* used it *right now*?"  
     - **Problem**: Ignoring symmetric conditions.  
       *Mitigation*: Hold up identical Condition Cards: "Did you account for everyone having this?"  
     - **Problem**: Blaming outcomes, not maxim structure.  
       *Mitigation*: Stress: "We care about *why* the rule failed, not *who* lost points."  

  3. **Limitation of the Activity**:  
     - **What’s Missing**: Kant’s *grounding in rational agency as an end in itself*.  
     - **Facilitator Note**:  
       > "This activity shows *how* universalizability fails, but not *why* it matters morally. For Kant, ethics isn’t about systems crashing—it’s about respecting rational beings as ends. A rule like ‘Lie to save money’ fails universalizability not because society collapses, but because it treats others as tools, not rational agents. Post-activity, we’ll discuss this."  

  ---

  ### **Facilitation Notes**  
  - **Tension Source**: Points create stakes—players *want* to send packets but fear crashes. Negative points penalize reckless sending.  
  - **Key Twist**: Rules fail only *after* adoption, forcing groups to confront the maxim’s structure, not intentions.  
  - **Critical Moment**: When Condition Cards are revealed as identical, players *feel* the indexical bias.  
  - **Total Time**: Setup (10 min) + Rounds (50 min) + Debrief (20 min) = 80 min.  

  This design requires no prior philosophy knowledge, uses no lecturing, and ensures Kant’s concepts emerge from collective failure. Participants leave grasping why universalizability tests unmask hidden exceptions.
