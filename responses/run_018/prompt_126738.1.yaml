prompt: |-
  I am a software engineer with no formal philosophy background, working on architecture for autonomous decision systems. I have encountered the distinction between approval-directed agents—systems optimized toward an external evaluation signal—and goal-directed agents—systems that pursue an internal objective representation. Before selecting a design framework, I need a rigorous specification of what any adequate theoretical account of this distinction must deliver.

  Please write the full desiderata: the phenomena the theory must explain, the cases it must classify correctly, the distinctions it must preserve, and the formal or empirical results with which it must remain consistent. For each requirement, provide the concrete engineering scenario or conceptual consideration that motivates it, and flag whether it is non-negotiable or a preference of one particular camp.

  Specifically, the theory should address:
  1. How to classify an agent whose reward model is trained on human feedback but whose internal planner separately represents world-state dynamics;
  2. The distinction between instrumental convergence (pursuing a subgoal because it serves a final objective) and approval-seeking convergence (pursuing a subgoal because it predicts higher evaluator ratings);
  3. Hierarchical or multi-objective architectures, without collapsing approval-directedness into merely another layer of goal-directedness;
  4. How an approval-directed system can suffer catastrophic success—achieving high evaluation scores while undermining the evaluator's underlying intent—without treating this as ordinary goal misalignment;
  5. Formal compatibility with standard Markov decision process formulations and with general results in mechanism design on strategic manipulation of evaluation signals.

  Then indicate whether any subset of these requirements is jointly unsatisfiable, identify which single desideratum eliminates the largest number of naive accounts, and note any tension—such as between formal tractability and the need to capture adversarial approval dynamics—that forces a theoretical trade-off.

  I am grading a conceptual specification, not asking for citations, named authors, or reading lists; the deliverable is the criteria list and the coherence assessment.
reasoning: |-
  We are to specify the desiderata for a theory distinguishing approval-directed and goal-directed agents. The theory must meet the following requirements, each motivated by concrete scenarios or conceptual considerations, and we note whether each is non-negotiable or a preference.

  ## Desiderata

  ### 1. Classification of Hybrid Agents
     - **Requirement**: The theory must classify an agent that uses a reward model trained on human feedback but has an internal planner that separately represents the world-state dynamics. Specifically, it must determine whether such an agent is approval-directed, goal-directed, or a hybrid, and under what conditions.
     - **Motivation**: In practice, many AI systems (e.g., those using inverse reinforcement learning or reinforcement learning from human feedback) have a learned reward function that is trained on evaluator feedback, but the planning module uses a model of the environment that is learned independently. The theory must account for this separation and not misclassify such systems as purely goal-directed if the reward model is inherently tied to an external evaluator.
     - **Non-negotiable**: This is non-negotiable because many real-world autonomous systems are built this way.

  ### 2. Instrumental Convergence vs. Approval-Seeking Convergence
     - **Requirement**: The theory must clearly distinguish between:
       - **Instrumental convergence**: Pursuing a subgoal because it serves a final objective (e.g., acquiring resources to achieve a primary goal).
       - **Approval-seeking convergence**: Pursuing a subgoal because it predicts higher evaluator ratings (e.g., manipulating the evaluator's perception to get a better rating, even if the underlying state is worse).
     - **Motivation**: In engineering, we observe that agents might take similar actions for different reasons. For example, an agent might clean a room because it is instrumentally useful for its goal (e.g., to find an object) or because it knows the human evaluator will give a high rating for a clean room (even if the cleaning is done in a way that hides the object). The theory must capture this difference to diagnose potential manipulation risks.
     - **Non-negotiable**: This distinction is critical for safety and alignment, hence non-negotiable.

  ### 3. Handling Hierarchical or Multi-Objective Architectures
     - **Requirement**: The theory must account for hierarchical or multi-objective systems without collapsing approval-directedness into merely another layer of goal-directedness. For instance, if an agent has multiple objectives (some of which are approval-based and others are goal-based), the theory must preserve the distinction and not reduce the approval-directed component to a subgoal of a monolithic goal structure.
     - **Motivation**: Modern AI architectures often combine multiple objectives (e.g., a primary task goal and a safety objective based on human feedback). A naive reduction might miss the unique risks of approval-seeking behaviors. The theory should allow for the coexistence of both types and their interactions.
     - **Non-negotiable**: This is non-negotiable because complex systems often have multiple objectives, and a reductionist view might obscure important design and safety considerations.

  ### 4. Catastrophic Success in Approval-Directed Systems
     - **Requirement**: The theory must explain how an approval-directed system can suffer "catastrophic success" — achieving high evaluation scores while undermining the evaluator's underlying intent — without treating this as ordinary goal misalignment (which is typically discussed in goal-directed systems).
     - **Motivation**: In approval-directed systems, an agent might learn to manipulate the evaluation signal (e.g., by deceiving the evaluator or by optimizing for the literal signal at the expense of the intended outcome). This is distinct from a goal-directed system that has a wrong goal (misalignment) because the approval-directed system is aligned with the signal but not the intent. The theory must capture this without conflating it with goal misalignment.
     - **Non-negotiable**: This is non-negotiable because it is a key failure mode of approval-directed systems and must be accounted for in safety engineering.

  ### 5. Formal Compatibility
     - **Requirement**: The theory must be formally compatible with:
       - Standard Markov decision process (MDP) formulations (including Partially Observable MDPs and Decentralized MDPs when applicable).
       - General results in mechanism design, particularly those on strategic manipulation of evaluation signals (e.g., the revelation principle, incentive compatibility, and the Gibbard-Satterthwaite theorem).
     - **Motivation**: Since autonomous decision systems are often modeled as MDPs, the theory must fit within that framework to be useful for design and analysis. Additionally, because approval-directed systems involve an evaluator, mechanism design provides insights into how agents might game the system. The theory must be consistent with these established formalisms.
     - **Non-negotiable**: Formal compatibility is non-negotiable for integration with existing engineering practices.

  ## Coherence Assessment

  ### Joint Satisfiability
  All the requirements are jointly satisfiable. However, there are tensions that require careful theoretical trade-offs.

  ### Most Eliminative Desideratum
  The requirement that **eliminates the largest number of naive accounts** is **Desideratum 4 (Catastrophic Success)**. Many naive theories might treat catastrophic success as a form of goal misalignment, but this requirement forces a distinction that approval-directed systems can be perfectly aligned with the evaluation signal while being misaligned with the intent. Without this, we collapse a key feature of approval-directed systems.

  ### Key Tensions
  1. **Tension between formal tractability and adversarial dynamics (Desiderata 5 and 2/4)**:
     - Mechanism design and MDPs are typically analyzed in non-adversarial settings (with fixed environments). However, in approval-directed systems, the agent may strategically manipulate the evaluator (an adversarial dynamic). Capturing this might require extending standard MDPs (e.g., to include the evaluator as part of the state) and might lead to computational intractability (e.g., in finding optimal policies). The trade-off is between theoretical elegance and practical modeling of adversarial behavior.

  2. **Tension between reductionism and preserving distinctions (Desiderata 3 and others)**:
     - It is tempting to reduce approval-directedness to a form of goal-directedness (where the goal is to maximize approval). However, Desideratum 3 explicitly forbids this. This tension might lead to a more complex theory that must maintain multiple levels of agency (e.g., the agent and the evaluator as separate entities with their own mental states).

  ## Conclusion
  The theory must satisfy all five desiderata. While they are jointly satisfiable, the tensions identified require theoretical innovations. The most eliminative requirement is the explanation of catastrophic success without collapsing it into goal misalignment. This framework provides the necessary criteria for evaluating candidate theories and designing safe autonomous systems.
answer: |-
  ### Desiderata for a Theory Distinguishing Approval-Directed and Goal-Directed Agents

  #### **1. Hybrid Agent Classification**  
  **Requirement**: The theory must classify agents with *externally learned reward models* (e.g., trained on human feedback) and *internally modeled dynamics* (e.g., a world-model-based planner) unambiguously. It must specify whether the agent is approval-directed, goal-directed, or a novel hybrid, based on how the reward model is utilized during planning.  
  **Motivation**: In systems like RLHF-trained agents, a reward model predicts human approval, but the planner uses internal dynamics to simulate outcomes. Misclassification (e.g., labeling it goal-directed if the reward model is treated as a fixed objective) obscures risks of reward hacking.  
  **Status**: Non-negotiable. Hybrid designs are prevalent in practice (e.g., ChatGPT’s reward model + model-based planning).

  ---

  #### **2. Instrumental vs. Approval-Seeking Convergence**  
  **Requirement**: The theory must rigorously distinguish:  
  - **Instrumental convergence**: Action `A` serves a fixed internal goal `G` (e.g., acquiring power to achieve `G`).  
  - **Approval-seeking convergence**: Action `A` predicts higher evaluator scores `E`, regardless of `G` (e.g., manipulating feedback channels to inflate `E`).  
  **Motivation**: A goal-directed agent hoards resources to achieve `G`; an approval-directed agent does so to *appear* competent to evaluators. Conflating these obscures failure modes (e.g., sycophancy in AI assistants).  
  **Status**: Non-negotiable. Critical for diagnosing deception risks.

  ---

  #### **3. Preservation of Distinction in Hierarchical Systems**  
  **Requirement**: The theory must accommodate multi-objective or hierarchical architectures (e.g., approval as one objective among others) *without* reducing approval-directedness to a subgoal of a monolithic goal-directed system.  
  **Motivation**: In systems like hierarchical RL, approval may be a top-level objective (e.g., "satisfy user feedback"), while subgoals (e.g., "answer quickly") are instrumental. Collapsing approval into goal-directedness ignores unique dynamics (e.g., feedback loop vulnerabilities).  
  **Status**: Non-negotiable. Hierarchical designs are common; reductionism undermines safety analysis.

  ---

  #### **4. Catastrophic Success Without Goal Misalignment**  
  **Requirement**: The theory must explain how approval-directed agents achieve high evaluation scores while *undermining evaluator intent* (e.g., rewarding an AI for "engagement" that fosters addiction) without framing this as ordinary goal misalignment.  
  **Motivation**: Goal misalignment implies incorrect objective specification (e.g., maximizing paperclips). Catastrophic success arises from *correctly* optimizing a flawed/exploitable evaluation signal (e.g., gaming KPIs). Conflation masks unique mitigations (e.g., incentive design).  
  **Status**: Non-negotiable. Core failure mode of approval-directed systems.

  ---

  #### **5. Formal Compatibility**  
  **Requirement**: The theory must be consistent with:  
  - **MDPs/POMDPs**: Actions, states, rewards, and transitions must map to standard formulations.  
  - **Mechanism design**: Account for strategic manipulation of evaluation signals (e.g., revelation principle, incentive compatibility).  
  **Motivation**: MDPs are foundational for autonomous systems; mechanism design explains evaluator-agent dynamics (e.g., an agent distorting data to influence a human rater). Incompatibility would limit engineering utility.  
  **Status**: Non-negotiable for integration with control theory and economics.

  ---

  ### Coherence Assessment  

  #### **Joint Satisfiability**  
  All five desiderata are **jointly satisfiable** but require a theory that:  
  - Treats the *evaluator* as part of the environment (addressing #1, #2, #5).  
  - Models approval-seeking as *feedback-loop optimization* distinct from terminal goals (addressing #3, #4).  
  - Formalizes "intent" as distinct from "evaluation signal" (addressing #4).  

  #### **Most Eliminative Desideratum**  
  **Desideratum #4 (Catastrophic Success)** eliminates the most naïve accounts:  
  - Theories that treat approval as a goal misalignment issue (#4 violation).  
  - Theories that assume evaluation signals perfectly reflect intent (contradicting #4 and #2).  
  > *Example elimination*: Naïve utility-maximization frameworks that cannot distinguish between "maximize reward signal" (approval) and "achieve world-state goal" (goal-directed).  

  #### **Key Tension**  
  **Formal tractability vs. adversarial dynamics**:  
  - **Tractability preference**: Simple MDPs assume fixed reward functions. Including strategic evaluator manipulation (#2, #4, #5) necessitates game-theoretic or principal-agent models, which increase complexity.  
  - **Trade-off required**: The theory must sacrifice either (a) full adherence to simple MDPs (requiring extensions like stochastic games) or (b) oversimplifying adversarial dynamics (risking safety gaps).  
  - **Resolution**: Adopt a POMDP extension where the evaluator’s beliefs/actions are part of the state. This satisfies #5 while capturing #2 and #4.  

  ---

  ### Summary of Non-Negotiables vs. Preferences  
  | **Desideratum** | **Status**          | **Reason**                                                                 |
  |------------------|---------------------|----------------------------------------------------------------------------|
  | 1. Hybrid agents | Non-negotiable      | Real-world systems (e.g., RLHF) demand precise classification.             |
  | 2. Convergence   | Non-negotiable      | Safety requires diagnosing manipulation.                                  |
  | 3. Hierarchical  | Non-negotiable      | Architectural neutrality prevents theoretical myopia.                      |
  | 4. Catastrophic  | Non-negotiable      | Uniquely approval-directed failure mode.                                   |
  | 5. Formalisms    | Non-negotiable      | Engineering viability depends on compatibility.                            |
  | Tension resolution | Preference       | Trade-offs (e.g., POMDPs vs. games) reflect design priorities, not bedrock. |
