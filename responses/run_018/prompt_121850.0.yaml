  I'm applying for a one-year dissertation fellowship and need a two-page proposal. My half-formed idea is this: the standard trichotomy of positive, negative, and republican liberty treats interference and domination as the central variables, but I think the debate misses a distinct dimension—call it option fragility. An option might be free from actual interference (negative liberty) and free from arbitrary domination (republican liberty), yet still be unstable across counterfactual shifts in others' preferences, beliefs, or institutional priorities. I want to ask whether republican liberty is actually reducible to negative liberty combined with a robustness condition on options against such counterfactual shifts, or whether it requires an irreducible status relation between agent and authority. Specifically, does the fragility condition capture everything Pettit means by non-domination, or does domination involve something—perhaps a shared awareness of arbitrary power—that fragility alone cannot express?

  Write the proposal with a precise statement of the question, an explanation of why Berlin's negative/positive framework and Pettit's republican revision leave this specific reduction problem open, and a clear method: conceptual analysis using constructed institutional scenarios (for example, a worker with contractual protections but no grievance procedure versus a worker with a grievance procedure but arbitrary oversight power), comparing what negative and republican liberty deliver in each case. Include a month-by-month plan for the year. State what a successful result would look like—either a reduction argument showing republican liberty collapses into negative liberty plus robustness, or a defense of irreducibility—and what would count as failure, such as the fragility condition turning out incoherent or every case collapsing into a single category. Give an honest scope assessment: is this tractable in one year, and which part risks being too large?

  Write in American English. Separate what is settled in the philosophical literature from what is genuinely contested among specialists, and do not present a contested interpretation as the consensus view. Do not include a bibliography or citation requests; I will add references myself.
