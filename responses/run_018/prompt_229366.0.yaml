  Hmm, let me unpack this query about Montaigne's "Of Cannibals" opening. The user presents a sophisticated philosophical dilemma between custom-skepticism and code-relativism, anchored in a concrete cannibalism example. They're clearly engaging deeply with the text—probably literature or philosophy students wrestling with early modern skepticism.

  The core tension lies in how to interpret Montaigne's use of "barbarian" and "reason." My friend's argument about the explicit appeal to reason makes sense superficially, but the user rightly points to the cultural conditioning of reason itself. The military examples complicate things: Pyrrhus recognizing Roman order suggests cross-cultural judgment is possible, which relativism would struggle with.

  Looking at the cannibalism case, Montaigne's actual essay explicitly compares European and Tupinambá practices to expose European hypocrisy. His critique of colonial violence in the same essay suggests he's not a full relativist—some things (like torture) seem universally condemnable. But his treatment of funerary cannibalism does emphasize understanding context before judging, aligning with custom-skepticism.

  Key textual clues: "Barbarian" here functions as a hollow label Greeks use out of ignorance, "vulgar opinion" is what we inherit uncritically, and "eye of reason" implies a method of examination—but one that requires overcoming cultural blinders. The shift from Philip/Pyrrhus (who revise judgments) to the essay's broader theme suggests reason is a tool to transcend, not replicate, prejudice.

  For the enemy-eating scenario: Montaigne would likely condemn it based on intent (humiliation vs. reverence), showing his skepticism isn't relativism. The military analogies prove practices can be evaluated cross-culturally when examined properly. Therefore, custom-skepticism fits better—it explains both the caution against snap judgments and the possibility of reasoned condemnation.
