prompt: |-
  A friend and I argued until late last night about who ought to have the vote, and I left convinced that she was applying a principle she never stated -- and that, on the one case that mattered most, she departed from it. I want to reconstruct her principle from her verdicts and check. As best I can reproduce them, she held:

  1. A tourist in the country for two weeks gets no vote, even though the law applies to her for as long as she is there.
  2. A citizen who emigrated twenty years ago but kept her passport, still owns a flat in the capital, and comes back most summers to see family keeps her vote for life.
  3. A non-citizen who has lived in the country for ten years, works, pays taxes, and has children in the local school should vote in every election, national ones included, even if he never naturalises.
  4. No vote for a six-year-old, obviously; pressed about a fifteen-year-old she said almost certainly not, while conceding she could not justify where the line falls.
  5. A prisoner serving a long sentence for a serious crime keeps his vote; taking it away struck her as indefensible.
  6. The residents of a neighbouring country whose air is fouled by a power station just across the border get no vote here, though she allowed that they are owed something -- a hearing, compensation, consultation; not the franchise.

  The case we actually fought over was asylum. The government is redesigning its border and asylum policy -- who is detained on arrival, who is turned back, who is admitted -- and I argued that the people this policy is applied to, none of whom has ever legally set foot in the country, should have some say in shaping it, since no other electorate will ever speak for them. She said no, quickly and confidently: a polity decides its own membership rules, and they are not members. I thought I caught her contradicting her own earlier verdicts, but I could not prove it on the spot.

  So: what principle or principles would generate verdicts 1 through 6 as she gave them? I assume at least two distinct rules fit the record equally well -- identify them, note the riders each one needs (the tourist, the teenager), and say what each predicts about the asylum case. Then tell me whether her "no" is the verdict her track record actually commits her to, which of the six precedents is the closest analog to the asylum case and why, and -- if the record genuinely underdetermines the answer -- what principle she would be adopting by saying yes and what principle by saying no. Finally, name a case, different from all of the above, whose verdict would force the two candidate rules apart.
reasoning: |-
  Hmm, the user is describing a debate they had with a friend about voting rights and principles. They've listed six specific verdicts their friend gave on different cases, and they want to reconstruct the underlying principle from those verdicts. The main point of contention was about asylum seekers having a say in border policy.

  Looking at the six verdicts:
  - The tourist doesn't get to vote despite being subject to laws temporarily.
  - The emigrant citizen keeps voting rights forever through property and family ties.
  - The long-term resident non-citizen should vote even without naturalization.
  - Children shouldn't vote, with uncertainty about teenagers.
  - Prisoners keep their voting rights.
  - Neighbors affected by pollution don't get voting rights but deserve other forms of redress.

  The user thought their friend contradicted herself when denying voting rights to asylum seekers in border policy decisions. I need to find principles that fit all six verdicts and then see what those principles would say about the asylum case.

  I think two distinct principles could explain all these verdicts: the "subject to coercion" principle and the "enduring membership" principle. 

  The subject-to-coercion principle would say that anyone subject to the state's coercive power should have a vote. This fits most cases: the tourist is temporarily subject to laws but only for a short time; the long-term resident is consistently subject to laws; the prisoner is clearly subject to coercion; children are considered incapable of understanding this coercion; and the neighbors aren't directly subject to the state's coercive power. The emigrant citizen is tricky here - they're not consistently subject to coercion, so this principle would actually suggest they shouldn't vote, but the friend said they should. That means we'd need a rider for this principle: "unless they maintain formal citizenship and significant ties."

  The enduring-membership principle would say that voting rights come from being a recognized member of the political community. This fits the emigrant keeping voting rights through citizenship and ties, and the tourist not being a member. The long-term resident would be considered a de facto member despite not naturalizing. Prisoners remain members. Children aren't full members yet. Neighbors aren't members. For the tourist, we'd need a rider about minimal temporary presence not constituting membership.

  For the asylum case:
  - Subject-to-coercion with rider would say yes, asylum seekers are directly subject to coercive border policies.
  - Enduring-membership would say no, because they're not members.

  The closest precedent is actually the pollution-affected neighbors case - both involve external parties affected by policies but not members. The tourist is a weak precedent since it's about very temporary presence.

  The case that would distinguish these principles is someone who is subject to coercion but not a member (like undocumented long-term residents) - the coercion principle would grant voting rights, while membership might not. The friend's verdicts didn't cover this, so both principles are possible fits.

  The user's friend probably holds the enduring-membership principle, which explains her confident "no" on asylum seekers. But her track record doesn't force this answer - the coercion principle would say yes. Her position is consistent with her verdicts only if we interpret her as using the membership principle.
answer: |-
  Based on your friend's verdicts (1-6), two distinct principles can equally explain her positions, each requiring specific riders. Her "no" on the asylum case isn't strictly required by her track record; it depends on which principle she prioritizes. Below, I reconstruct the principles, analyze the asylum case, identify the closest analog, and propose a test case.

  ### Principle 1: Subject-to-Coercion + Enduring Ties
  - **Core Principle**: Voting rights arise from being **subject to the state's sustained coercive power** (laws, taxes, incarceration) *and* having **enduring, voluntary ties** to the polity.
  - **Riders**:
    - **Tourist (Verdict 1)**: Short-term exposure to coercion is insufficient without enduring ties. (Rider: *Minimal duration/commitment*).
    - **Emigrant Citizen (Verdict 2)**: Formal citizenship + property/family ties = enduring voluntary connection, overriding absence. (Rider: *Citizenship + significant ties preserve rights*).
    - **Non-Citizen Resident (Verdict 3)**: Sustained subjection to coercion (taxes, laws) + social integration (work, family) = voting rights without citizenship.
    - **Children (Verdict 4)**: Minors lack capacity for meaningful voluntary ties. (Rider: *Presumed incapacity until adulthood*).
    - **Prisoner (Verdict 5)**: Incarceration exemplifies state coercion; disenfranchisement adds "double punishment."
    - **Polluted Neighbors (Verdict 6)**: Coercion is indirect (policy side effects), not direct governance; ties are external.
  - **Asylum Case Prediction**: **YES, they should vote**. Asylum seekers are *directly targeted* by coercive border policies (detention, turnbacks) and lack alternatives. Their ties are nascent but involuntary exposure is extreme.

  ### Principle 2: Enduring Membership
  - **Core Principle**: Voting rights require **formal or de facto membership** in the political community, defined by **legal status or deep, rooted participation**.
  - **Riders**:
    - **Tourist (Verdict 1)**: No membership; transient presence.
    - **Emigrant Citizen (Verdict 2)**: Formal citizenship + ongoing ties = perpetual membership.
    - **Non-Citizen Resident (Verdict 3)**: Long-term integration = de facto membership, regardless of naturalization.
    - **Children (Verdict 4)**: Not full members; capacity thresholds are pragmatic lines.
    - **Prisoner (Verdict 5)**: Membership persists unless formally revoked (which she opposes).
    - **Polluted Neighbors (Verdict 6)**: External affected parties aren’t members.
  - **Asylum Case Prediction**: **NO, they should not vote**. Asylum seekers are explicitly *excluded* from membership by definition; the polity controls its boundaries.

  ### Analysis of the Asylum Case
  - **Her "No" Verdict**: Consistent only with **Principle 2 (Enduring Membership)**. She prioritizes the polity's right to exclude non-members, even when affected by coercion.
  - **Contradiction?** Principle 1 (*Subject-to-Coercion*) would demand a "yes" for asylum seekers, mirroring her support for prisoners (Verdict 5) and long-term residents (Verdict 3). Her rejection *is* inconsistent with this principle.
  - **Closest Analog**: **Verdict 6 (Polluted Neighbors)**.  
    - **Why**: Both involve external groups harmed by domestic policy but excluded from membership. Asylum seekers are "outsiders" affected by border controls; neighbors are "outsiders" affected by environmental policy. She grants neither the franchise, offering only non-voting remedies (hearing/compensation).

  ### Underdetermination and Principles at Stake
  - **Her track record underdetermines the answer**. Both principles fit the six verdicts but split on asylum seekers.  
  - **By saying "YES" to asylum seekers**, she would adopt **Principle 1 (Subject-to-Coercion + Ties)**, emphasizing direct subjugation to state power as paramount.  
  - **By saying "NO" (as she did)**, she adopts **Principle 2 (Enduring Membership)**, emphasizing community boundaries over affectedness.  

  ### Test Case to Force the Principles Apart
  - **The Stateless Long-Term Resident**:  
    - A person without citizenship *anywhere* who has lived in the country for 20 years, pays taxes, speaks the language, and has no ties to another state, but cannot naturalize due to administrative barriers.  
  - **Prediction**:  
    - **Principle 1 (Coercion)**: YES, they vote. They are subject to sustained coercion and have enduring ties.  
    - **Principle 2 (Membership)**: NO, they do not vote. Lacking formal citizenship or a path to it, they remain non-members.  
  - **Why it works**: This case lacks the emigrant’s citizenship (Verdict 2) but shares the non-citizen resident’s ties (Verdict 3). Principle 1 extends rights; Principle 2 withholds them. Your friend’s verdict here would reveal her core principle.

  ### Conclusion
  Your friend likely holds **Principle 2 (Enduring Membership)**, as it cleanly explains her "no" on asylum seekers and aligns with her view that "a polity decides its own membership rules." However, her support for non-citizen residents (Verdict 3) suggests a broad, inclusive view of *de facto* membership—yet she denies this to asylum seekers because they lack *any* recognized foothold in the community. The tension lies in whether "subject to coercion" or "membership" is foundational. Her stance is consistent only if membership is the gatekeeper, but you rightly detected friction with her support for prisoners and integrated non-citizens. The **stateless resident test case** would clarify her underlying logic.
