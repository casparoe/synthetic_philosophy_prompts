prompt: |-
  You are a professional philosopher of history with expertise in historiography and conceptual analysis. Before answering, briefly brainstorm the correspondences you plan to audit. Then examine the analogy that often structures Whig-style narratives—whether explicitly or implicitly—treating historical societies as analogous to an organism maturing toward adulthood, or to software being debugged toward a current release: earlier periods are cast as "immature," "bug-ridden," or "underdeveloped" versions of the present, and change is read as directional progress toward our current institutions and norms as a natural endpoint. This analogy is routinely used to license the judgment that past actors and structures should be evaluated by contemporary moral and political standards, since the present is taken to be the fully realized form of which the past was an incomplete draft.

  Audit the analogy rigorously: provide an explicit correspondence table (source: biological maturation / software versioning; target: societies and historical change). Identify precisely where the mapping breaks—especially regarding teleology, the absence of a shared genome or design specification, path dependency versus counterfactual stability, and whether societies actually converge on a single "adult" state. Clarify which features of the source (irreversible development, functional optimization, a defined endpoint) are quietly imported and whether they apply to the target. Finally, assess whether the normative conclusion—that present standards are the correct benchmark for evaluating the past—survives once these disanalogies are explicit, and propose a more accurate analogical frame if one exists.
