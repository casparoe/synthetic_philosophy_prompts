  The user's deeper need seems to be intellectual self-defense: they want tools to challenge a reductive narrative. I should emphasize where each reading fails to kill contingency—especially since the Thermidor example itself shows how factional miscalculations (not inevitability) changed outcomes. My shakiest point is the Marxist reading; class analysis struggles to explain why internal purges targeted specific revolutionary subgroups. A counterexample like the American Revolution's relative stability would undermine deterministic claims. I'll keep it concise (under 250 words) and avoid academic jargon while showing how historical specificity defies blanket phrases.
answer: |-
  Here's the dissection of "revolutions devour their children" in your context, assessing its claims against contingency:

  1.  **Ideological Escalation:** Claim: Revolutionary purity demands ever more extreme measures, consuming moderate founders. Supported? Yes, in 1793-94 (Girondins to Hébertists to Danton to Robespierre). Contingency-killer? No – escalation *paths* and *culminations* (like Thermidor's specific events) remain contingent. Shaky: Overstates inevitability; counterexample: American Revolution's less extreme internal trajectory.
  2.  **Institutional Design:** Claim: Emergency powers (like CPS) lack veto points, enabling self-destruction. Supported? Absolutely (Law of 22 Prairial, suspension of rights). Contingency-killer? **Weakest against you** – flawed design *enables* contingent power struggles/coups (like Thermidor's missteps), it doesn't dictate their outcome. Shaky: Assumes *all* revolutions lack institutional safeguards; counterexample: Constitutional conventions establishing checks (e.g., US).
  3.  **Marxist Class Struggle:** Claim: Post-common-enemy defeat, revolution fractures along class lines within the revolutionary camp. Supported? Partially (bourgeois factions vs. sans-culottes pressure), but simplistic. Contingency-killer? No – class *tensions* exist, but their violent resolution isn't predetermined. Shaky: Neglects non-class motives (ideology, personality, fear); counterexample: Revolutions with clearer class outcomes avoiding mass internal purge.
  4.  **Violence Begets Violence:** Claim: Initial revolutionary violence legitimizes/necessitates further violence, consuming leaders. Supported? The Terror's dynamics fit. Contingency-killer? Trivial/tautological – it *describes* a cycle but doesn't explain *why* specific leaders fall *when* they do (Thermidor's contingency remains key). Shaky: Doesn't explain why *some* violent revolutions stabilize (e.g., post-Cromwell, eventually).

  **Conclusion:** While capturing *tendencies* (escalation, institutional weakness, factionalism, violence cycles), **none of these readings *eliminate* contingency.** The *specific* fall of Robespierre *was* contingent on Thermidorian actions and miscommunications. The phrase is a powerful heuristic, not a deterministic law. Your professor's use dismisses the crucial *how* and *why* of specific events in favor of an overly broad "always." **Strongest counter:** Highlight how the *mechanism* of his fall (botched coup) *exemplifies* contingency within the revolutionary context the phrase describes.
