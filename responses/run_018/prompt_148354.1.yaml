answer: |-
  Here's a tight, ready-to-run activity designed for maximum tactile pressure and "aha" moments. Materials: index cards, pens, cheap tokens (pennies, paperclips, beads), string (optional), timer.

  **Prep (10 mins before class):**
  1. **Create 14 Belief Cards:** Mix concrete & abstract claims. Examples:  
     - "My phone is in my bag"  
     - "Democracy is the fairest system"  
     - "2+2=4"  
     - "The classroom door is open"  
     - "Moral facts exist"  
     *Crucially:* Pick **ONE** card as the "**Basic Belief**" (e.g., "I am conscious right now"). Mark its corner subtly (⭐) but **don’t reveal** this to students.  
  2. **Tokens:** Give each student **3 tokens** + 1 card.  
  3. **Space:** Arrange chairs in a single row for Round 1, circle for Round 2, open cluster for Round 3.

  ---

  **Activity Intro (5 mins):**  
  *Standing, energy high*  
  "Your belief card is ALIVE only if it’s supported. To get support, spend 1 token to ‘buy’ justification from another person. BUT—they can only sell support if THEIR belief is currently supported (they spent a token to get backup). If your belief is unsupported when time’s up, you’re out. Goal: Keep your belief in the game. Let’s go."  

  *(Don’t mention epistemology terms!)*  

  ---

  **Round 1: Foundationalism Unwittingly (12 mins)**  
  **Rules:**  
  - Chairs in straight line. You can ONLY ask the person to your **immediate left**.  
  - Spend 1 token to get support from them. They must spend 1 of their own tokens to justify THEIR belief to support yours.  
  - If you’re leftmost, you can only GIVE support (can’t ask anyone).  
  - **Timer:** 10 mins.  

  **What Happens:**  
  - Chains stretch left. Panic as leftmost players realize they can’t get support.  
  - Someone (likely mid-chain) desperately says: "I don’t need support! I just KNOW!" — that’s your hidden **Basic Belief** player.  
  - **Reveal:** Stop early if chains break. Point out the arbitrary "stopping point" (⭐ card). "Why did *this* belief get a free pass? What if it didn’t exist?"  

  ---

  **Round 2: Coherentism’s Drain (12 mins)**  
  **Rules:**  
  - Rearrange chairs in tight circle.  
  - You can ONLY trade with **adjacent neighbors** (left + right).  
  - Mutual support allowed: You and a neighbor BOTH spend 1 token to support each other simultaneously.  
  - **Timer:** 10 mins.  

  **What Happens:**  
  - Pairs form mutual loops ("I support you, you support me").  
  - BUT each "refresh" of the loop costs tokens. Watch them drain fast.  
  - Groups of 4 might form double-loops, but death spiral is inevitable.  
  - **Key Q later:** "Did the loop feel stable? How long until it collapsed?"  

  ---

  **Round 3: Infinitism’s Exhaustion (12 mins)**  
  **Rules:**  
  - Scatter chairs (open network).  
  - Anyone can ask ANYONE.  
  - **Cost = 1 token per ‘step’ in the chain** between you. E.g.:  
    - Direct support? 1 token.  
    - A supports B, B supports you? You pay 2 tokens (1 for B, 1 for A’s support of B).  
  - **Timer:** 8 mins (this round burns fast).  

  **What Happens:**  
  - Mad dashes to form long chains.  
  - Players rapidly exhaust tokens chasing "deeper" support.  
  - Total token collapse in <5 mins. "Why did extending further bankrupt you?"  

  ---

  **Debrief & Theory Mapping (20 mins):**  
  *(Sketch dependency structures on board as they describe rounds)*  
  1. **Round 1 = Foundationalism:**  
     - "You built chains backward until someone said ‘STOP, NO COST!’ But was that satisfying? Felt arbitrary? That’s the foundationalist ‘rock’—necessary but mysterious."  

  2. **Round 2 = Coherentism:**  
     - "You created loops—internal support structures. But why did they decay? Coherentism’s flaw: circularity doesn’t *add* new justification; it just redistributes the cost until resources deplete."  

  3. **Round 3 = Infinitism:**  
     - "You kept extending chains further. Did it feel secure? Or exhausting? Infinitism demands infinite resources—we ran out fast. Reality check: we’re finite beings."  

  **Honest Limitations:**  
  - "The game can’t resolve if coherence is *truly* vicious or just pragmatically unstable. Nor does it model ‘emergent’ justification in large networks. But you FELT the structural costs—where the pressure lands in each system."  

  **Predictable Problems & Fixes:**  
  - **Hoarding tokens?** → Remind them: unsupported belief = instant death. No passive survival.  
  - **Refusing loops?** → In Round 2, whisper to resistors: "Can two beliefs hold each other up? Test it."  
  - **Dominant players?** → Assign strong claims to quiet students (e.g., "Pain is bad").  
  - **Chaos in Round 3?** → Embrace it. Burnout illustrates infinitism’s impracticality.  

  **Payoff:** Players who survived all rounds get to "defend their belief" in final discussion. Others observe—but the REAL win is the visceral grasp of justification’s architecture. They’ll tear apart the regress problem with embodied intuition tomorrow.  

  **Grab index cards and go.** You’ve got this — trust the game to do the teaching.
