answer: |-
  Here’s a critique of your "continuity collateral" framework addressing your four questions directly, treating it as an essay outline:

  **1. On the contradiction between identity and voiding obligations:**  
  *No outright contradiction, but tension requiring careful framing.* Your view avoids claiming the future self is a "different person" while permitting obligation-dissolution. This works if you rigorously define the *source* of obligation: It arises not from numerical identity alone, but from the *preservation of specific psychological structures* (the collateral). Obligation binds only insofar as the collateral exists as recoverable security. The future self is still "you" numerically, but if the collateral is gone, the *conditions making the directive binding* no longer hold. The "wrong" would only exist if the collateral *could* be reclaimed but is willfully rejected. This isn’t a contradiction—it’s redefining the *basis* of obligation as contingent on psychological continuity, not brute identity.

  **2. Does the "collateral" metaphor smuggle in problematic economic assumptions?**  
  *Yes, but it can be quarantined.* The metaphor risks implying obligations are *quantifiable*, collateral is *fungible* (interchangeable), and default is inherently *punitive*. Your framework resists this if clarified:  
  - **Non-fungibility:** The collateral isn't monetary but irreplaceable phenomenal patterns (e.g., *these specific* values forged through life experiences).  
  - **Non-transferability:** The "debt" isn't to a third party but to the *persisting structure of the self*.  
  - **"Default" nuance:** Rejecting intact collateral isn’t primarily a "breach of contract" but a *fracture in diachronic self-governance*—a failure to uphold what made one’s past commitments authentic.  
  *Risk:* The "debt" language may still imply the future self is *subordinate* to the past. Emphasize that the collateral is *constitutive* of the self whose autonomy we respect—not external property.

  **3. Alignment with existing ideas (and whether it helps/hurts):**  
  *Strong alignment, which mostly helps by grounding your view:*  
  - **Psychological Continuity (Parfit):** Your "collateral" resembles Parfit’s "Relation R" (connected psychological states). Dissolution when collateral is lost mirrors his view that radical discontinuity undermines prudential concern. *Help:* Uses established criteria for identity/persistence. *Hurt:* Inherits Parfit’s problem—how much continuity is "enough"? Your framework needs to define "recoverable" collateral.  
  - **Narrative Identity (Ricoeur, Schechtman):** Collateral as "experiential commitments" echoes narrative identity’s emphasis on life stories sustaining selfhood. The directive gains authority as part of a coherent self-narrative. *Help:* Explains why rejecting intact collateral feels like a "default"—it fractures the narrative. *Hurt:* Risks over-privileging narrative coherence over present experience.  
  - **Advance Directive Literature:** The asymmetry you propose (no blame for loss, criticism for rejection) implicitly critiques "precedent autonomy" absolutism and purely experiential-value approaches. *Help:* Offers a nuanced middle ground.  

  *Overall, alignment strengthens plausibility but demands you distinguish your view:* Your innovation is framing continuity *as collateral securing an agreement*, making dissolution conditions and moral asymmetry explicit.

  **4. Is the framework interesting or just renaming tensions?**  
  *It’s genuinely interesting and adds value:*  
  - **Reframes the Problem:** Shifts debate from "Who is the real person?" to "What sustains obligations across time?" This moves beyond metaphysical stalemates.  
  - **Moral Asymmetry:** Your distinction between *loss* of collateral (no fault) vs. *rejection* of collateral (default) is a significant contribution. It captures intuitive judgments (e.g., we don’t blame dementia patients, but might criticize recovered addicts renouncing sober-era directives).  
  - **Practical Nuance:** Provides a principled way to assess when directives *should* hold (collateral recoverable) vs. when they become void (collateral destroyed), avoiding rigidity or overrides based on vague "best interests."  
  - **Original Metaphor:** While continuity theories exist, "collateral" concretizes the abstract link between persistence and obligation. It makes the *stakes* vivid: the past self "stakes" its core self-patterns to make the directive credible.  

  **Key vulnerabilities to address in the essay:**  
  - **Defining "Recoverable":** What constitutes collateral being "intact" vs. "lost"? Is it subjective (can the future self recognize it?) or objective (does it persist neurologically)? Vagueness here threatens applicability.  
  - **The "Default" Charge:** Why is rejecting intact collateral a "default" rather than new autonomy? Must argue that *authentic* autonomy requires engagement with one’s constitutive commitments—rejection isn’t neutral but self-disintegrating.  
  - **Scope:** Does this only work for *medical* directives, or all future-binding promises? If the latter, implications may be too demanding (e.g., holding someone to a marriage vow based on "collateral").  

  **Conclusion:** Your framework holds together internally, leverages existing theories productively, and offers a fresh, ethically nuanced perspective on advance directives. Its power lies in replacing "command" with "collateralized agreement," making continuity *do work* in justifying obligations. The metaphor needs careful handling to avoid economic reductionism, but the core insight—that authority dissolves when the psychological security for it vanishes—is compelling.
