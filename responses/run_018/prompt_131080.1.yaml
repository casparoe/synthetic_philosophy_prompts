answer: |-
  The deadlock stems from **colliding bedrock intuitions** about creation’s moral status, amplified by **implicit binary metaphysics of identity**. 

  Person-affecting views root wrongdoing in *comparative harm to specific individuals*, demanding a counterfactual where the same person exists worse off. Impersonal views prioritize *axiological comparison of worlds*, indifferent to transworld identity. Both camps treat "same person" as binary: either identical across worlds (person-affecting) or irrelevant (impersonal). Introducing a **graded psychological-continuity metric** (e.g., Parfit-style connectedness) *relocates* but doesn’t resolve the conflict: 
  - Person-affecting advocates might reinterpret "harm" as reduced connectedness to a *better-off counterpart* (e.g., a genetically identical person in a richer world). 
  - Impersonalists could absorb degrees of continuity into well-being calculations.  
  Yet this merely shifts disputes to weighting continuity vs. well-being, without bridging the core divide: **Is morality fundamentally about individuals or states of affairs?**

  **Diagnosis**: The impasse is substantive, not verbal. It reflects irreconcilable moral axioms: 
  1. **Anti-meliorism** (creating a satisfied person cannot be a *wrong to them*).  
  2. **Asymmetry** (avoiding suffering outweighs creating happiness).  

  **Progress requires**:  
  1. **Empirical intuition mapping** to identify which axioms are widely shared (e.g., cross-cultural studies on "procreative asymmetry").  
  2. **Metaphysical clarification** via formal models of transworld identity (e.g., using counterpart theory with continuity metrics), exposing hidden premises.  
  3. **Reframing the problem** away from "harming non-existent persons" toward *agent-centered duties* (e.g., "What kind of creator do I become?") or *ecological relationships*.  

  The structural tension persists, but progress lies in **diagnosing which intuitions are negotiable** and which function as non-negotiable foundations—enabling clearer truces or paradigm shifts.  

