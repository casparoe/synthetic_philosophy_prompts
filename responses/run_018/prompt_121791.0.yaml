prompt: |-
  I teach a small philosophy seminar — about 12 upper-level undergrads, one 75-minute block. I want a classroom game that makes them feel the force of the Gibbard-Satterthwaite result: not just learn that strategic voting exists, but actually experience the leak where honest rankings collapse and fixing one hole opens another. Have them allocate a fake budget of 30 points across three concrete projects (fixing the lounge, buying shared books, funding a visiting speaker) using a different decision rule each round: Borda count, then Condorcet, then approval voting. They submit sealed preferences at first, see the collective outcome, revise, and by round three they should discover that manipulation is unavoidable unless we either restrict the domain or hand one person a veto.

  Please lay out the rules, the non-monetary payoff scheme, a 60-minute timeline with debrief, and an honest debrief that maps each round onto parts of the theorem — domain restriction, dictatorship, strategic misrepresentation — without turning into a lecture. I'm also a little fuzzy on the difference between stratagy-proofness and Pareto efficiency (they're different, yeah?), so gently clarify that distinction in the facilitator notes. Write it all in American English. And tell me what will predictably go wrong — likely one student spots the manipulation first and dominates the table — plus how to salvage the learning for everyone else. This is for my course prep, so keep the tone casual; I might have a typo or two in these instructions.
reasoning: |-
  Okay, the user is a philosophy professor preparing a seminar to demonstrate the Gibbard-Satterthwaite theorem through a classroom game. They want students to experience strategic voting firsthand, not just learn about it theoretically. 

  Hmm, the core challenge here is translating a complex impossibility theorem into a tangible 75-minute activity. The professor clearly understands the math but needs a pedagogical bridge. Their mention of "feeling the force" suggests they want visceral understanding - that aha moment when students realize no voting system is bulletproof.

  The three-project setup (lounge, books, speaker) is smart because it mirrors real campus dilemmas students care about. Budget points make preferences quantifiable. I should emphasize sealed ballots to prevent peer influence and revisions to show preference evolution. 

  Ah, the timeline is tight. Need to allocate: 5 min intro, 15 min per round (including voting/results), 20 min debrief. Must keep mechanics lightning-fast. Physical tokens over digital since it's more tactile and avoids tech hiccups.

  For payoffs, non-monetary is key. "Satisfaction points" based on outcome proximity to true preferences will incentivize strategy without real money. Important to clarify that "winning" isn't the goal - the learning is in seeing systems fail.

  Debrief structure is crucial. Need to explicitly map each round to theorem concepts: 
  - Round 1 (Borda): Strategic misrepresentation 
  - Round 2 (Condorcet): Cycle = domain restriction need
  - Round 3 (Approval): Pareto inefficiency

  The professor's confusion about strategy-proofness vs Pareto efficiency is common. I'll distinguish them in facilitator notes: one's about truth-telling incentives (individual), the other about wasted resources (collective). 

  Predictable issues: 
  - Alpha student dominating: Counter by assigning preference profiles secretly
  - Analysis paralysis: Enforce 30-sec decision windows
  - Frustration with "broken" systems: Stress this is the point!

  Salvage tactics: 
  - If one student hogs strategy, appoint them "observer" next round 
  - If results unclear, use a pre-cooked backup scenario
  - Emphasize that confusion is part of the lesson

  Should I include math notation? No - professor gets it, but undergrads need metaphor. "Voting systems are like leaky buckets" fits their framing. 

  Final touch: Remind professor to lean into the messiness. The stumbles ARE the lesson. Maybe suggest closing with: "If this felt frustrating, congratulations - you now understand why voting theorists drink."
answer: |-
  Here's a **Gibbard-Satterthwaite Classroom Game** designed for your 75-minute seminar. It’s structured to make students *feel* the theorem’s inevitability through tactical voting chaos.

  ---

  ### **Game Title:** "The Unfixable Vote"  
  **Objective:** Allocate 30 points across 3 projects using 3 voting systems. Students learn that *every* system can be manipulated or fails unless we restrict choices or grant dictatorship.  

  **Projects** (Concrete & relatable):  
  1. **Lounge Upgrade** (New couches, coffee machine)  
  2. **Shared Books Fund** (Key texts for the department)  
  3. **Visiting Speaker** (Philosopher for a guest lecture)  

  ---

  ### **Setup**  
  - **Players:** 12 students  
  - **Preferences:** Each student ranks projects 1st, 2nd, 3rd *in their hearts* (true preferences).  
  - **Payoff:** "Satisfaction Points" (SP) based on how close the outcome is to their true ranking:  
    - **1st-choice project funded:** 10 SP  
    - **2nd-choice:** 6 SP  
    - **3rd-choice:** 2 SP  
  *(SP are bragging rights, not real $)*  
  - **Ballots:** Index cards for sealed rankings/approvals.  

  ---

  ### **Rules & Timeline** (60 min activity + 15 min debrief)  
  | **Time** | **Phase**                     | **Action**                                                                 |
  |----------|-------------------------------|----------------------------------------------------------------------------|
  | 0-5 min  | **Intro**                     | Explain projects, SP system, and goal: "Maximize *your* satisfaction."     |
  | 5-20 min | **Round 1: Borda Count**      | Students submit *honest* rankings. Tally: 3 pts (1st), 2 pts (2nd), 1 pt (3rd). Fund the top project. |
  | 20-25 min| **Results & Revision**        | Announce winner. Students see SP earned. *Let them grumble.*               |
  | 25-40 min| **Round 2: Condorcet Method** | Students submit *revised* rankings. Tally: Pairwise comparisons (e.g., Lounge vs. Books, Books vs. Speaker, etc.). Fund the Condorcet winner *if one exists*. |
  | 40-45 min| **Results & Revision**        | Announce winner. If no Condorcet winner (cycle likely!), announce deadlock. |
  | 45-60 min| **Round 3: Approval Voting**  | Students approve (✓) or reject (✗) each project. Fund the project with most checks. |
  | 60-75 min| **Debrief**                   | Guided discussion (see below).                                             |

  ---

  ### **Debrief Framework** (15 min)  
  **DO NOT LECTURE.** Use Socratic questions to connect rounds to the theorem:  

  | **Round**        | **Theorem Concept**          | **Discussion Prompts**                                                                 |
  |------------------|------------------------------|----------------------------------------------------------------------------------------|
  | **Round 1**      | Strategic Misrepresentation  | *"Did anyone change rankings after seeing Borda results? Why? Was anyone punished for honesty?"* |
  | **Round 2**      | Domain Restrictions          | *"Did we have a Condorcet winner? If not, why? What if we banned certain preferences?"* |
  | **Round 3**      | Pareto Inefficiency          | *"Did the winner have unanimous approval? Could a ‘losing’ project have made everyone happier?"* |
  | **The Big Picture** | Dictatorship as Escape Hatch | *"Could we avoid all this by letting one person decide? Would you trade fairness for no manipulation?"* |

  ---

  ### **Facilitator Notes**  
  - **Strategy-Proofness vs. Pareto Efficiency** (Your Clarification):  
    - **Strategy-proof:** No one gains by lying *regardless* of others’ votes. (Borda fails this).  
    - **Pareto efficient:** If everyone prefers A over B, B shouldn’t win. (Approval can fail this if a "compromise" wins despite universal dislike).  
    → G-S shows *no system* can be both strategy-proof AND Pareto efficient *and* non-dictatorial.  

  - **What Will Go Wrong (and How to Fix It):**  
    - **Problem:** 1-2 students "solve" the game early and dominate strategy talks.  
    - **Salvage:** Secretly assign **preference profiles** (e.g., 4 students love Books, 4 love Speaker, 4 love Lounge). Forces coalition-building and mimics real voter blocs.  
    - **Problem:** Condorcet cycle doesn’t happen (unlikely with 12 voters, but possible).  
    - **Salvage:** Pre-cook a backup ballot set to ensure a cycle (e.g., 4: A>B>C, 4: B>C>A, 4: C>A>B).  
    - **Problem:** Students focus on "winning" not learning.  
    - **Salvage:** Mid-game, ask: *"Did your true favorite ever win? What did you sacrifice?"*  

  ---

  ### **Why This Works**  
  - **Rounds escalate tension:** Honest voting → manipulation → chaos → desperation for a dictator.  
  - **SP system** incentivizes strategy without real stakes.  
  - **Concrete projects** make Pareto failures visceral (e.g., "Why did we fund the speaker if 8/12 preferred books?").  

  **Final Tip:** Start debrief with: *"Raise your hand if you felt forced to vote dishonestly."* Then unpack why. The game *is* the proof.  

  Let me know if you want the preference profiles pre-generated!
