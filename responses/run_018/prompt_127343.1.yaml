answer: |-
  Here is a rigorous argument for your "aesthetic fidelity mode" position, directly confronting the core objection:

  **The Core Argument:**

  1.  **Distinct Processing Pathways:** Human emotional processing is not monolithic. Alongside the primary, action-oriented pathway (triggering fight/flight, withdrawal, or approach behaviors), a secondary, decoupled *monitoring* pathway exists. This pathway assesses emotional states for their *informational fidelity* and *modeling accuracy*, generating satisfaction based on the precision of the simulation itself, not the valence of the simulated content.
  2.  **Decoupling in Fiction:** Fictional engagement inherently activates this decoupled pathway. We know the represented events are ontologically non-real and impose no instrumental demands. This *safety context* suspends the action-imperative normally triggered by negative affect in the primary pathway.
  3.  **Fidelity as Reward Signal:** Within this decoupled space, the very intensity, complexity, and phenomenological richness of sadness, grief, or dread become salient signals. They signify a *successful high-fidelity simulation* of the target emotional state. The monitoring pathway registers this accuracy and depth as an achievement – a precise mapping of the complex emotional terrain presented by the artwork.
  4.  **Co-Occurring Affective States:** Crucially, the primary negative affect (sadness) is *not neutralized, transformed, or diluted*. It remains phenomenologically present and potent. Simultaneously, the monitoring pathway generates a distinct positive affective state: the satisfaction of *aesthetic fidelity*. This satisfaction stems from the cognitive-affective accomplishment of accurately tracking and resonating with the profound emotional structure modeled by the work.
  5.  **The Nature of "Enjoyment":** The overall experience is "sought" and "valued" not because the sadness is pleasurable *in itself*, nor because it is converted into something else, but because the *co-occurrence* of profound sadness *and* the deep satisfaction of high-fidelity modeling constitutes a unique and cognitively rewarding state. We derive fulfillment from the *depth and accuracy of our engagement*, even when the content engaged with is painful.

  **Addressing the Core Objection: "Renaming the Paradox"**

  The objection claims that if sadness remains fully present and phenomenologically unconverted, calling the experience "enjoyable" merely relabels the paradox without solving it. This objection fails for two reasons:

  1.  **Misidentification of the Reward Source:** The objection assumes "enjoyment" must refer to a positive hedonic state *replacing* or *canceling* the sadness. This position rejects that premise. The "enjoyment" (or better, the *satisfaction* or *fulfillment*) is **not derived from the sadness itself**, but from the *separate process* of successfully modeling it with high fidelity within a safe, decoupled space. The sadness is the *object* of the modeling, the *signal* of its accuracy; it is not the *source* of the satisfaction. The satisfaction arises from the cognitive-affective *achievement* registered by the monitoring pathway.
  2.  **Valence Pluralism:** The objection implicitly assumes that an experience must have a single, unified affective valence (either positive *or* negative). This position posits **affective simultaneity and valence pluralism**. An experience can contain multiple, phenomenologically distinct affective states occurring concurrently. Intense sadness (negative valence) and the satisfaction of precise emotional modeling (positive valence) can co-exist without the latter negating the former. The "overall" value of the experience arises from the *sum* or *integration* of these distinct states, weighted by the subject's valuation of deep emotional understanding and aesthetic truth.

  **Distinction from Catharsis and Distance Theories**

  *   **Vs. Catharsis (Aristotle/Hume):** Catharsis theories involve a *transformation* or *purgation* of the negative affect (e.g., pity and fear are expelled, converted into pleasure, or harmonized). The fidelity model explicitly **denies any necessary transformation or expulsion**. The negative affect persists; its persistence is *integral* to the satisfaction, serving as the *evidence* of fidelity. Humean conversion turns distress *into* pleasure; fidelity registers distress *as* a signal *while* generating a distinct satisfaction.
  *   **Vs. Psychological Distance:** Distance theories (e.g., Bullough, cognitive appraisal variants) posit that the negative affect is *attenuated* or made "safe" by framing it as unreal. The fidelity model **embraces the intensity** of the affect. Distance might enable the decoupling necessary for the monitoring pathway to operate without triggering action, but it does *not* explain the *positive motivation* for seeking the experience. The fidelity model explains the *attraction*: we seek the experience *precisely because* it allows the monitoring pathway to register high-intensity, high-fidelity emotional simulations, generating its distinct satisfaction. Distance is a prerequisite, not the mechanism of reward. Furthermore, intense absorption in tragedy often *reduces* felt distance without eliminating the satisfaction, which distance theories struggle to explain.

  **Clarifying Tragic Enjoyment vs. Ordinary Pleasure**

  *   **Ordinary Pleasure:** Typically arises from the satisfaction of appetites, attainment of goals, harmonious sensory input, or the absence of distress. Its valence is directly tied to the positive quality of the stimulus or state of affairs.
  *   **Tragic Enjoyment (Satisfaction of Fidelity):**
      *   **Source:** Arises from metacognitive awareness and appraisal of the *accuracy and depth* of an emotional simulation.
      *   **Object:** Directed towards the *process and success of modeling* itself, not the modeled content.
      *   **Valence Relationship:** Is *contingent* on the presence of intense, phenomenologically accurate negative affect. Without the profound sadness, the satisfaction of fidelity could not be generated at its highest level. The "reward" requires the "pain" as its object and proof.
      *   **Nature:** Is fundamentally *epistemic* and *aesthetic* – a satisfaction in the apprehension of complex emotional truth and the exercise of empathetic/emotional cognition at its highest resolution. It is the pleasure of profound understanding, even when the thing understood is suffering.

  **Conclusion:**

  The paradox dissolves when we recognize affective pluralism and distinct processing pathways. We seek tragic art not to *escape* or *transform* sadness, but to *engage* with it at the highest level of fidelity within a safe, decoupled space. The profound sadness remains, serving as the crucial signal that our emotional modeling is accurate and deep. Simultaneously, this very accuracy triggers a distinct satisfaction in the monitoring pathway – a reward for the cognitive-affective achievement of high-fidelity simulation. This co-occurrence of deep sadness and deep epistemic-aesthetic satisfaction constitutes the unique, valued, and non-paradoxical experience of tragic engagement. The "enjoyment" lies not in the sadness, but in the *masterful fidelity* with which we track it.
