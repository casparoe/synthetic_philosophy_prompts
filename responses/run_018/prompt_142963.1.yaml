answer: |-
  ## Social Construction Assessment Protocol (SCAP)

  **Grounding:** Based on established distinctions in social ontology between (1) Kinds dependent on collective acceptance/institutions vs. mind-independent kinds, (2) Interactive kinds (classification changes member properties/behavior) vs. stabilized kinds (collective belief sustains reality without individual feedback), and (3) Distinguishing mere administrative disappearance from normative residue (persisting coordination reasons post-institution).

  **Procedure (Sequential Checklist):**

  1.  **Institutional Dependence Check:** *Does the kind's existence, definition, or core boundaries fundamentally depend on human agreement, social practices, or specific institutional rules?*
      *   **Sufficient "Yes":** Explicit creation by law/treaty, dependence on culturally specific norms, boundaries defined by administrative fiat (e.g., "middle class" income bracket).
      *   **Sufficient "No":** Kind identified primarily via biological/physical properties independent of human recognition (e.g., blood type, chemical elements).
      *   **Stop - "No" (Treat as Tracking Category):** If sufficient "No" answer. Proceed if "Yes" or ambiguous.
      *   **Judgment Call:** Degree of dependence (partial vs. total). Flag for sign-off if borderline.

  2.  **Interactive Feedback Loop Check:** *Does classifying individuals/entities *as* this kind reliably change their properties, behavior, opportunities, or self-understanding in a way that reinforces or alters the kind's significance?*
      *   **Sufficient "Yes":** Classification alters access to resources, triggers identity formation, changes social expectations/perceptions of members (e.g., diagnostic labels, citizenship status).
      *   **Sufficient "No":** Classification is descriptive without predictable behavioral/social impact on members (e.g., classifying rocks as igneous/sedimentary).
      *   **Proceed Regardless:** Answer informs Step 3 but does not stop the procedure here.

  3.  **Counterfactual Dissolution Check (Niche Test):** *If all relevant institutional structures/rules *instantly vanished*, would the kind: (A) Cease to be relevant (administrative disappearance), (B) Persist only as a fading habit or historical artifact, or (C) Persist because people would still face practical coordination problems they need to solve, giving them reason to recreate or maintain a similar category (normative residue)?*
      *   **Sufficient "C" (Normative Residue):** Clear evidence of persistent, practical coordination needs beyond mere habit (e.g., need to coordinate exchange persists without state money; need to coordinate social support persists without official disability categories).
      *   **Sufficient "A/B" (Disappearance/Fading Habit):** Kind exists solely due to the institution; no underlying practical coordination problem drives its persistence (e.g., specific tax bracket definitions, outdated bureaucratic codes).
      *   **Stop - "Yes" (Apply Constructed-Kind Safeguards):** If sufficient "C" (Normative Residue) OR if Step 1 was "Yes" AND Step 2 was "Yes" (Interactive Kind). Proceed only if Step 1 "Yes" but Steps 2 "No" and 3 "A/B".
      *   **Judgment Call:** Assessing the nature of persistence (practical coordination vs. inertia/habit). Flag for sign-off.

  4.  **Stabilized Kind Check (For non-interactive, institutional kinds):** *Does the kind's existence and stability depend *primarily* on widespread collective belief or institutional reinforcement, even without individual feedback loops?*
      *   **Sufficient "Yes":** Kind exists because of collective acceptance, not discovered physical properties (e.g., fiat currency value, national borders).
      *   **Sufficient "No":** Institutional role exists, but kind has core mind-independent properties anchoring it.
      *   **Stop - "Yes" (Apply Safeguards):** If sufficient "Yes". **Stop - "No" (Treat as Tracking Category):** If sufficient "No". (Rare outcome after Step 3 filter).
      *   **Judgment Call:** Relative weight of collective belief vs. underlying properties. Flag for sign-off.

  ---

  **Application:**

  1.  **Proposal: Mandatory "Neurotype" (Autistic, Allistic, etc.) in Federal Employment Surveys**
      *   **Step 1 (Institutional Dependence):** Yes. Definitions (Autistic, Dyspraxic) depend on evolving diagnostic criteria and social understanding.
      *   **Step 2 (Interactive Loop):** Strong Yes. Classification impacts self-identity, social perception, access to accommodations/rights, and potentially behavior.
      *   **Step 3 (Counterfactual Dissolution):** Likely "C" (Normative Residue). Even without official surveys, coordination needs around neurodiversity support, community, and identity would persist. **--> STOP: YES, Apply Safeguards.** (Triggers opt-in, sunset review).

  2.  **Proposal: "Central-Bank Digital-Currency Unit" (CBDC) as Economic Kind**
      *   **Step 1 (Institutional Dependence):** Yes. Existence and definition wholly dependent on central bank issuance and rules.
      *   **Step 2 (Interactive Loop - Individual):** No. Classification as holding/using CBDC vs. other money doesn't *reliably* change an *individual's* core properties/behavior *because* of the classification itself (macro effects differ). It's a tool.
      *   **Step 3 (Counterfactual Dissolution):** Likely "A/B" (Disappearance/Fading Habit). If the central bank vanished, the specific CBDC unit loses value/function. The *need* for money might persist ("C"), but the *specific kind* (this CBDC unit) disappears. **--> Proceed.**
      *   **Step 4 (Stabilized Kind):** Yes. Its existence/stability depends entirely on collective/institutional acceptance. **--> STOP: YES, Apply Safeguards.** (Due to institutional nature).

  ---

  **Honest Limitations:**

  1.  **Borderline Misfires:** May struggle with kinds where institutional dependence is partial (e.g., certain mental disorders with biological correlates) or where feedback loops are subtle/macro-level. Kinds emerging from complex bio-social interactions are hardest.
  2.  **Unsettled Contested Issues:**
      *   Not all specialists agree that *all* interactive kinds are necessarily institutional (some argue for non-institutional interactive kinds).
      *   Significant debate exists on whether economic kinds like money involve *macro-level* looping effects (e.g., does the *concept* of money change economic behavior systemically?) even without individual feedback in the SCAP sense. SCAP focuses on individual/member-level looping.
      *   The precise threshold for "normative residue" vs. "fading habit" in the Counterfactual Dissolution Check involves unavoidable philosophical judgment.
      *   The line between a "stabilized" social kind and a "tracking" category grounded in complex but mind-independent phenomena (e.g., some species concepts) remains contested.
