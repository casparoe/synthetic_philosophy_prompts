prompt: |-
  I'm on this municipal risk board -- nothing fancy, just local infrastructure and emergency-planning grants -- and I'm trying to work out our boards implicit logic before we vote on something big next tuesday. Over the last year we've made four calls: we killed a high-speed rail plan that had great expected commute savings but a non-negligible tail risk of catastrophic derailment near schools, and picked the bus-lane upgrade instead. We okayed a decentralized water-filteration network even though its average efficiency was lower than the central plant, because the central one had a single point of failure that could contaminate the whole district at once. We turned down a clinical-trial partnership with huge expected health gains because it required waiving standard liability caps for adverse events, leaving risk essentially unquantifable. And we funded a seismic-retrofit grant that had negative net present value on pure cost-benefit terms, but it capped the worst-case death toll in a big quake.

  Now there's a proposal for an AI-driven traffic and emergency-routing system. The consultants claim it has the highest risk-weighted expected utility they've ever calculated -- they literally used that phrase, with nonlinear risk weights applied to outcomes -- but the failure mode isn't a single crash. It's a slow drift in routing priorities that compounds over years, and the probability distribution is basically unknown because nothing like it has run at city scale. There's also a hybrid version that keeps human dispatchers in the loop, giving up about thirty percent of the expected-utility gain but with fully quantifable risks and clear manual overrides. My co-chair thinks we're running pure risk-weighted expected utility and should approve the full AI version since the consultants did the weighting for us. Another member says we're actually running a two-step rule: first reject anything with an unbounded or undefined worst case, then apply risk weights only to what's left, which means we reject the AI but approve the hybrid. I'm not sure who's right about our own pattern. Can you lay out the two rules that actually fit our four past verdicts, say what each predicts for both the full AI and the hybrid, identify the closest analog case, and tell me what minimal further case would split the rules if they happen to agree here? I want to be consistent, but I also don't want to just dress up a gut feeling in fancy language.
reasoning: |-
  Okay, let me tackle this user's problem. They're on a municipal risk board and need to understand the implicit logic behind their past decisions to apply it to an upcoming vote on an AI-driven traffic system. 

  First, I need to parse their four past cases carefully. The rail rejection prioritized avoiding catastrophic tail risks over commute savings. The decentralized water choice sacrificed average efficiency for reduced systemic risk. The clinical trial refusal valued quantifiable risks over potential gains. The seismic retrofit accepted negative NPV to cap worst-case deaths. 

  Hmm... the common thread seems to be extreme aversion to unbounded worst-case scenarios, even when probability is low. But it's not simple risk aversion - they'll accept known high-consequence risks (like earthquakes) if bounded. 

  Now looking at the new AI proposal: The full version has unknown failure distributions and slow-drift risks, while the hybrid version offers quantifiable risks with overrides. The consultants' fancy "risk-weighted utility" framing is distracting - the board's history suggests they care more about risk characteristics than optimization. 

  The co-chair thinks they're doing pure weighted utility, but that doesn't explain rejecting the rail or clinical trial. The other member's two-step theory fits better: first screen for bounded worst-cases, then optimize. 

  For prediction: Both rules would reject full AI (unbounded risk like clinical trial), but approve hybrid (bounded risk like seismic retrofit). The water case is closest analog - they chose decentralization to avoid single failure points, similar to preferring human overrides. 

  To split the rules later, we'd need a case with bounded worst-case but terrible risk-weighted utility - like a project with capped deaths but extremely high probability of reaching that cap. 

  User's deeper need seems to be avoiding cognitive bias while maintaining principled consistency. They're wisely suspicious of dressing gut feelings in jargon. The key is recognizing their board prioritizes "knowing the bounds" over theoretical optimization.
answer: |-
  Based on your board's four past decisions, two distinct decision rules emerge. Neither aligns perfectly with pure risk-weighted expected utility (RW EU). Here's the breakdown:

  **Rule 1: Bounded Worst-Case First (BWCF)**
  1.  **Reject** any proposal with an *unbounded, catastrophic, or fundamentally unquantifiable worst-case outcome*, regardless of expected utility or probability.
  2.  **For remaining proposals:** Apply risk-weighted expected utility (with strong aversion to tail risks) to select the best option.
  *   **Past Decisions Explained:**
      *   **Rail:** Rejected (Step 1 - Unbounded/Unquantifiable Catastrophe: Derailment near schools).
      *   **Water:** Approved (Step 2 - Worst-case bounded: Decentralized failure limits impact).
      *   **Clinical Trial:** Rejected (Step 1 - Unbounded/Unquantifiable Worst-Case: Waived liability caps make adverse event risk unquantifiable and potentially catastrophic).
      *   **Seismic Retrofit:** Approved (Step 2 - Worst-case bounded: Capped death toll, even with negative NPV).
  *   **Core Principle:** "First, ensure the catastrophe is bounded and quantifiable. *Then* optimize."

  **Rule 2: Extreme Tail Risk Aversion (ETRA)**
  1.  **Apply extreme aversion** to low-probability, high-consequence ("tail risk") outcomes within the risk-weighting function.
  2.  **Strongly prefer quantifiable risks** over unquantifiable ones, heavily discounting benefits associated with unquantifiable risks.
  3.  **Accept bounded worst-cases** if the risk-weighting (heavily penalizing the tail) still shows acceptable utility *or* if the mitigation significantly reduces the tail risk.
  *   **Past Decisions Explained:**
      *   **Rail:** Rejected (Extreme aversion to catastrophic tail risk near schools).
      *   **Water:** Approved (Avoids single point of failure tail risk present in the central plant).
      *   **Clinical Trial:** Rejected (Unquantifiable risk dominates; extreme aversion applied to potential unbounded liability).
      *   **Seismic Retrofit:** Approved (Mitigates a specific, quantifiable tail risk (high death toll quake), worth the cost despite negative average NPV).
  *   **Core Principle:** "Aggressively down-weight or reject options with severe, hard-to-pin-down tail risks, even if bounded. Quantifiability is key to managing aversion."

  **Predictions for the AI Proposals:**

  | Proposal          | BWCF Rule Prediction                | ETRA Rule Prediction                 |
  | :---------------- | :---------------------------------- | :----------------------------------- |
  | **Full AI System** | **REJECT** (Step 1: Failure mode ("slow drift") has fundamentally unknown probability distribution & potentially unbounded long-term societal consequences. Worst-case undefined.) | **REJECT** (Extreme aversion to unquantifiable risk of systemic, compounding failure over years. Benefits discounted heavily due to unknown probability distribution.) |
  | **Hybrid System** | **APPROVE** (Step 1: Passes - Manual overrides & human oversight create a *bounded*, quantifiable worst-case. Step 2: Apply RW EU - Likely favorable even with 30% lower gain.) | **LIKELY APPROVE** (Quantifiable risks and clear manual overrides significantly reduce the unquantifiable tail risk of the Full AI version. The known risks can be evaluated with the board's standard risk aversion, likely making the trade-off acceptable.) |

  **Closest Analog Case:** The **Clinical Trial** decision is the strongest analog for the **Full AI System** under both rules.
  *   Both involved potentially significant benefits paired with an *unquantifiable* risk dimension (liability caps vs. long-term systemic drift probability/distribution).
  *   The board rejected the Clinical Trial explicitly due to the unquantifiable risk, overriding the expected gains. This pattern points strongly towards rejecting the Full AI.

  **Splitting the Rules - The Minimal Further Case:**

  The rules *agree* on both the Full AI (Reject) and Hybrid (Approve/Likely Approve) in this instance. To force a divergence, you'd need a proposal that:

  *   **Has a clearly *bounded* worst-case outcome** (passes BWCF Step 1).
  *   **Has a *quantifiable*, but extremely *severe tail risk* with a very low probability.**
  *   **Where the *risk-weighted expected utility calculation is negative or marginal* due to extreme weighting of that tail risk.**

  **Example:** A proposal for an advanced, automated dam control system.
  *   **Worst-Case:** Bounded (e.g., "Flooding causing maximum $500M damage and 50 fatalities" - specific, quantifiable cap).
  *   **Tail Risk:** Quantifiable probability (e.g., 0.1% chance per year) of reaching that worst-case due to a specific, understood complex failure mode.
  *   **RW EU Calculation:** The extreme aversion to the 0.1%/50 deaths/$500M tail risk heavily outweighs the significant expected annual benefits (e.g., reduced flooding for 10,000 homes, energy savings), resulting in negative or very low net RW EU.
  *   **BWCF Prediction:** APPROVE (Bounded worst-case passes Step 1. RW EU calculation, even if negative, is applied in Step 2. The board *might* approve based on the cap, even with negative RW EU, mirroring the seismic retrofit logic).
  *   **ETRA Prediction:** REJECT (The extreme aversion applied to the quantifiable but severe tail risk results in a negative RW EU, making the proposal unacceptable despite the bounded worst-case).

  **Conclusion for Your Board:**

  *   **BWCF** provides the most consistent and parsimonious explanation of *all four* past decisions. It explicitly formalizes the pattern of rejecting anything with an unquantifiable/unbounded catastrophe first, and *then* optimizing. This aligns perfectly with the Clinical Trial and Rail rejections, and the Water/Seismic approvals.
  *   **ETRA** also fits but is slightly less precise in distinguishing the *why* behind the Clinical Trial/Rail rejections vs. the Seismic approval. It relies more on the *degree* of aversion and the *quantifiability* factor implicitly.
  *   **For the AI Vote:** Both rules lead to the same practical outcome: **Reject the Full AI System** (due to unquantifiable/unbounded risk akin to Clinical Trial/Rail) and **Approve the Hybrid System** (bounded, quantifiable risks like Water/Seismic, acceptable RW EU even if lower). The **Clinical Trial** is the clearest precedent.
  *   **For Consistency:** Adopting the explicit **BWCF rule** makes your board's logic transparent and directly applicable to future cases. It avoids the potential inconsistency of applying RW EU alone (which would have approved the Clinical Trial and possibly the Rail) and clearly prioritizes catastrophic risk containment as a precondition for consideration. It also prevents "dressing up gut feeling" by providing a clear, defensible first filter.

  Your board's history demonstrates a profound institutional aversion to Knightian uncertainty (unquantifiable risk) and unbounded catastrophes. The BWCF rule best captures this revealed preference. Stick with rejecting the Full AI and approving the Hybrid to maintain that crucial consistency.
