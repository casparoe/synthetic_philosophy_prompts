prompt: |-
  I am designing a single ninety-minute graduate seminar on mental causation for students who have already worked through Davidson's anomalous monism and are comfortable with the basic machinery of supervenience, but who have not yet confronted Jaegwon Kim's exclusion argument in its strongest form. Rather than using the familiar arm-raising scenario, I intend to carry the entire argument through one institutional case: a board of directors collectively deciding to dissolve a corporation, where the mental content of the vote appears to cause the legal dissolution only through the physical movements of hands and signatures, yet we want to preserve an irreducible explanatory role for the intentional description of the decision. Plan the pedagogical sequence: the exact order in which the closure principle, the exclusion principle, and the supervenience thesis must be introduced so that the conflict emerges as structurally inevitable rather than contrived, and what logical dependency forces that ordering; what features the board-vote case must possess and what it must lack in order to make the exclusion visible, together with why personal action examples actually obscure the problem at this level; the specific misconceptions students will import from Davidson—particularly the belief that anomalous monism already blocks overdetermination—and the precise point in the sequence where each misconception should be intercepted and neutralized; the diagnostic question I should pose at the end that would distinguish genuine grasp of the structural problem from mere memorization of Kim's premises; and which responses—specifically emergentist and compatibilist strategies—I should explicitly bracket and refuse to discuss in this session, with a brief pedagogical justification for each omission that I can present to the class without sounding evasive.
reasoning: |-
  Okay, the user is designing a graduate seminar on mental causation, specifically focusing on Kim's exclusion argument. They want to use an institutional case—a board voting to dissolve a corporation—instead of the typical arm-raising example. The students are already familiar with Davidson's anomalous monism and supervenience but haven't encountered Kim's argument in depth. 

  First, I need to structure the pedagogical sequence. The key is to introduce the principles in a logical order that makes the conflict inevitable. The closure principle should come first because it's the most widely accepted. Then supervenience, which the students already know but need to apply here. Finally, the exclusion principle, which creates the problem when combined with the first two. 

  The board-vote case needs certain features: it must show that the mental event (the collective decision) and the physical event (signatures, etc.) are distinct but causally related. It should avoid any ambiguity about overdetermination, which personal examples like arm-raising might introduce because they feel intuitive. Personal cases often lead students to assume mental and physical are the same event, but in the board case, the mental event (the vote) is clearly separate from the physical actions (signing papers). 

  Students might misunderstand Davidson's anomalous monism. They might think it prevents overdetermination by making mental and physical identical under different descriptions. But Kim argues that even with supervenience, mental events are still distinct from their physical bases. This needs to be addressed right after introducing exclusion, using the board case to show that the decision supervenes on brain states but is still a different event. 

  For the diagnostic question, asking why the dissolution isn't overdetermination would test if they grasp the structural conflict. If they just repeat premises, they haven't understood. 

  Bracketing emergentism and compatibilism is important. Emergentism introduces new entities, which complicates the exclusion problem. Compatibilism argues mental causation is compatible with physical closure, but that's a deeper debate. Mentioning these would derail the focus on the logical structure. The user needs to justify this by stating the session's goal is to see the problem clearly before exploring solutions. 

  The user's deeper needs: They want students to see the exclusion argument as unavoidable, not contrived. Using an institutional case highlights event distinctness better. They also want to preempt common Davidson misunderstandings and test real understanding. Avoiding other theories keeps the session focused. The user might be preparing for rigorous discussion, ensuring students confront the problem's core without distractions.
answer: |-
  Here is a meticulously planned pedagogical sequence for your seminar, designed to maximize clarity and force the logical conflict into sharp relief using the institutional case, while strategically addressing Davidsonian baggage:

  **Pedagogical Sequence & Logical Dependencies:**

  1.  **Stage Setting: The Case & Causal Intuition (10 mins)**
      *   **Present:** The board of directors convenes. After deliberation (mental: weighing options, arguments, intentions), a formal vote occurs (mental: collective intentional state "Vote for Dissolution"). Following procedures, hands are raised/buttons pressed (physical P1), signatures are affixed to dissolution documents (physical P2). The corporation is legally dissolved (physical effect E - e.g., database update, registry entry, cessation of operations).
      *   **Establish Intuition:** We *explain* and *causally attribute* E by citing the "Board's Decision to Dissolve" (Mental M). We also recognize that M *required* physical actions (P1/P2) to bring about E. The legal dissolution *depends* on the specific physical execution of the decision.
      *   **Why Institutional?** It forces distinctness: M (collective intentional state) is *clearly not identical* to P1 (voting motions) or P2 (signing motions). It involves multiple physical realizers (different people voting/signing differently) for the same M. It lacks the intuitive "my decision IS my neural state" blurring of personal cases. Intentional description is essential for legal/social explanation.

  2.  **Introduce Principle 1: Causal Closure of the Physical (CCP) (15 mins)**
      *   **State:** "For any physical event E (like the dissolution registry entry/operational cessation), if it has a cause at time T, it has a *sufficient physical cause* at T." (Kim's formulation).
      *   **Apply:** E (dissolution) is physical. Its sufficient cause is the totality of the preceding physical events: the physical voting actions (P1), the physical signing actions (P2), the physical transmission of documents, the physical state of the legal database/server, etc. Call this complex physical cause "P*".
      *   **Justify:** Broad scientific consensus. Physics (broadly construed) aims for complete causal explanations of physical events. In our case, a complete physical story *could* explain E via P1, P2, document flows, etc., without mentioning "decisions."
      *   **Dependency:** Must come *first* because it's the most widely accepted premise, grounding the problem in physical science. It establishes that E *has* a sufficient physical cause (P*).

  3.  **Reinforce Principle 1a: Supervenience Thesis (ST) (10 mins)**
      *   **Recall:** Students know ST: There can be no mental difference without a physical difference. The mental (M - the decision) supervenes on the physical base (the brain states of the directors, the physical voting/signing apparatus, etc.). Call this physical base "P_sub".
      *   **Apply:** The specific decision M (to dissolve) occurred *because* a specific physical configuration P_sub occurred (the directors' neural states leading to "Aye" votes, functioning voting machines, etc.). M is determined by P_sub. P_sub is part of the sufficient physical cause P* (or necessitates it).
      *   **Role:** ST links M to the physical domain *without* identifying them. It shows M is *dependent* on P_sub, which is part of the cause of E via P*. This sets up the tension: M seems causally relevant, but its physical base P_sub is already doing the causal work for E via CCP.

  4.  **Introduce Principle 2: Exclusion Principle (EP) (15 mins)**
      *   **State:** "No single event E (like the dissolution) can have more than one *sufficient* cause occurring at the same time (unless it is a case of genuine overdetermination like two bullets hitting simultaneously)." (Kim's formulation).
      *   **Apply:** CCP gives us P* as a sufficient cause for E. If M (the decision) is *also* claimed to be a cause of E, then:
          *   Either M = P* (or the relevant part, like P_sub causing M causing E? But M ≠ P_sub!).
          *   Or M is distinct from P* but causes E *via* causing P* (standard physicalist view).
          *   Or M is a *second, independent* sufficient cause for E – overdetermination.
      *   **Force the Distinction (Key Move):** Emphasize that in the institutional case, M (the collective intentional state "Vote for Dissolution") is *distinct* from P_sub (the complex neural/electro-mechanical state realizing it) and *distinct* from P* (the wider sufficient physical cause including P1/P2/document flows). ST ensures M depends on P_sub, but doesn't make them identical. The board's *decision* is not the *same thing* as the neurons firing or the hands moving – it's what those things *mean* or *constitute* under an institutional description.
      *   **Conflict Emerges:** P* is sufficient for E (CCP). If M is distinct and also sufficient for E, we have two sufficient causes (M and P*) for one event E. EP says this is impossible unless it's genuine overdetermination (like two independent assassins). But M is *not independent* of P*; M supervenes on P_sub, which is part of P*. This is *systematic* overdetermination, which EP rejects as absurd.

  5.  **Target Davidsonian Misconceptions & Neutralize (15 mins)**
      *   **Misconception 1: "AM blocks overdetermination because M-tokens = P-tokens."**
          *   **Intercept:** Immediately after applying EP and emphasizing the distinctness of M and P_sub/P* in the institutional case.
          *   **Neutralize:** "Davidson avoids *token* overdetermination by identifying the mental *event* (my deciding) with the physical *event* (my C-fibers firing). But look at our board! Is the *collective intentional state* 'The Board Votes to Dissolve' *identical* to the complex physical event comprising 12 directors' neural states, hand movements, and button presses? No. These are different descriptions picking out *different properties* of the complex event. The intentional description is irreducible. Davidson's token identity doesn't make the *mental property* (being a dissolution vote) identical to the *physical property* (being specific neural patterns/motions). Kim targets the causal efficacy of the *mental property*, not just the event token. Supervenience ensures the token event has both properties, but EP asks if *both properties* are causally efficacious in producing E."
      *   **Misconception 2: "AM's anomalism means mental causation is just different explanation, not competition."**
          *   **Intercept:** When discussing the "explanatory role" we want to preserve.
          *   **Neutralize:** "Davidson is right that intentional explanation is autonomous. But Kim's argument is metaphysical: it's about what *actually brings about* the effect in the causal order. Explanatory indispensability suggests real causal efficacy. If the intentional description (the vote) is truly explanatory *because* it captures the real cause, but EP shows the physical cause P* is sufficient and excludes M as a *distinct* sufficient cause, then we have a problem: how *can* M be causally efficacious? Explanatory autonomy doesn't automatically solve the metaphysical exclusion problem."

  6.  **The Trilemma & Kim's Conclusion (10 mins)**
      *   Recap the conflict from the case:
          1.  **CCP:** P* is sufficient for E.
          2.  **ST:** M supervenes on P_sub (part of P*), but M ≠ P_sub/P*.
          3.  **EP:** If M is also a sufficient cause of E, then E is overdetermined by M and P*. But this overdetermination is systematic (M always depends on P*) and non-genuine (ruled out by EP).
      *   **Conclusion (Kim):** Therefore, M cannot be a *distinct* sufficient cause of E. The only genuine cause is physical (P*). Mental properties are either (a) causally inert ("epiphenomenal"), (b) reducible to physical properties (contra Davidson's anomalism), or (c) we must reject one of the premises (CCP, ST, or EP). Kim usually argues for (a) or (b).

  7.  **Diagnostic Question (5 mins)**
      *   **Pose:** "In the board case, why is the attempted solution 'The dissolution (E) is caused by the physical signatures (P2), but *that's just how the mental decision (M) causes it*' insufficient to resolve the exclusion argument? Specifically, why does this *not* make the scenario a case of acceptable overdetermination?"
      *   **Why it Works:** A genuine grasp requires understanding that:
          *   Invoking M causing P2 which causes E doesn't absolve M from needing causal efficacy *for E*.
          *   EP still applies to M's relation to E: if M is sufficient for E (even via P2), and P* (which includes the causes of P2 and P2 itself) is also sufficient for E, systematic overdetermination remains unless M = P* (which ST + distinctness denies) or M is reduced. Merely saying "M causes via P2" doesn't eliminate the threat of M being an *additional* sufficient cause once P* is already in place. Memorization would restate EP; understanding explains *why* the "via" clause fails to satisfy EP in this context.

  8.  **Bracketed Strategies & Pedagogical Justification (5 mins)**
      *   **Emergentism (Strong/Ontological):**
          *   **Bracket:** Do not discuss proposals that M is a fundamentally new kind of entity/property emerging from but not supervenient on P_sub, with its own downward causal powers.
          *   **Justification:** "Emergentism fundamentally rejects the Supervenience Thesis as we've defined it (global supervenience of the mental on the physical). Our goal today is to see how deep the exclusion problem runs *within* a broadly physicalist, supervenience-based framework, which is shared by Davidson and Kim. Introducing emergentism shifts the metaphysical foundation entirely. We need to fully grasp the problem *here* before exploring radical alternatives. We'll revisit emergence later in the course." (Avoids conflating the problem with a specific, contentious solution).
      *   **Compatibilism (e.g., Davidsonian, some nonreductive physicalisms):**
          *   **Bracket:** Do not engage with strategies arguing that mental causation is compatible with physical closure *without* reduction or elimination (e.g., by denying sufficiency, redefining causation, denying distinctness of causes, or accepting benign overdetermination).
          *   **Justification:** "Many subtle compatibilist strategies exist (some even suggested by Davidson's later work). However, Kim's argument specifically targets the compatibility of *irreducible* mental properties having *distinct* causal efficacy with physical closure and exclusion. Today's focus is on understanding the *logical tension* Kim identifies *before* evaluating responses. Diving into compatibilist nuances now would obscure the powerful core of the argument. We'll dedicate a future session to rigorously evaluating these responses, including whether they can genuinely preserve the causal efficacy we attribute to the board's *decision itself*." (Prevents premature dismissal of the problem via complex, often question-begging, compatibilist moves).

  **Key Features of the Board-Vote Case (Why it Works & What it Lacks):**

  *   **Must Possess:**
      *   **Clear Distinction:** Mental property (collective intentional state "Vote for Dissolution") is manifestly *not identical* to the physical properties realizing it (neural patterns, hand movements, signature marks). Different descriptions, different constitutive rules.
      *   **Irreducible Explanatory Role:** The intentional description is essential for explaining *why* the dissolution happened in the relevant (legal, social, rational) way. A purely physical description misses the meaning and the reason.
      *   **Physical Realization & Dependence:** The mental state clearly supervenes on and depends on complex physical states (P_sub).
      *   **Physical Causation Chain:** A clear, sufficient physical cause (P*) for the physical effect (E) is identifiable (voting apparatus actions, signatures, document processing).
      *   **Non-Identity of M and P*:** M is not part of P* under its physical description; P* includes the motions, not the institutional meaning.
  *   **Must Lack:**
      *   **Event Identity Ambiguity:** Unlike "my decision = my neural state," the collective decision is not plausibly identical to any single physical event or aggregate under a physical description. The intentional description is mandatory.
      *   **Intuitive "Ownership":** Personal cases trigger intuitions like "I caused it" which can mask the property-distinctness problem. The institutional case is more detached, forcing analysis of properties and descriptions.
      *   **Simple Physical Realizer:** Multiple directors mean multiple possible physical realizations (P_sub) for the same M, highlighting the mental property's independence from specific physical details.

  This sequence leverages the institutional case to make the distinctness of mental properties undeniable, introduces premises in an order that builds the conflict logically (CCP -> ST -> EP), surgically targets Davidsonian misunderstandings at the point where they arise, uses a diagnostic question probing the failure of "causing via" to resolve exclusion, and strategically brackets complex solutions to maintain focus on the core argument's structure.
