  - **Objection 5 (Predictive Power)**: Acknowledge limitations. Shift focus to ex-post explanation and avoiding traps. Soft spot: perceived lack of utility. Must-land: different goals—understanding irreversibility.
  - **Objection 6 (Parsimony)**: Agree on simplicity. Argue complexity is necessary for certain phenomena. Soft spot: overcomplicating models. Must-land: complex systems need complex models.
  - **Objection 7 (Retrospective Bias)**: Concede the risk. Suggest counterfactual simulations. Soft spot: hard to prove. Must-land: feedback loops create divergence.

