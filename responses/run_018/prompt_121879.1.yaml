  4. **Ergodicity Assumption**: They assume processes are ergodic; challenging this questions their models.
  5. **Predictive Power**: If paths are irreversible but unpredictable, what's the practical value?
  6. **Parsimony vs. Complexity**: Is this adding unnecessary complexity?
  7. **Retrospective Bias**: Is this just hindsight dressed as theory?

  The "pray nobody asks" question might be about practical applications or how to model this quantitatively without losing predictive capability.

  The strategic stance should be conciliatory but firm: accept their methods' value but show their limits in capturing distributed contingency. Emphasize that this framework extends rather than replaces their tools.

