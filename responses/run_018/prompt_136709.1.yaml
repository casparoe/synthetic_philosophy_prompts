  Game Structure:
  - We'll have multiple rounds with hidden information (provenance cards).
  - Participants will vote on the fate of each piece (insurance value, display status, or destruction) without knowing the full causal history.
  - Then, a reveal round where the ghost-canvas status is revealed.
  - Point-based payoff scheme (no real money) to incentivize decision-making.

  Game Setup:
  1. **Art Pieces**: We need 5-7 art pieces (depending on time). Each piece is represented by an image (projected or printed). We'll have:
     - Some originals (created by the artist with intention).
     - Some perfect copies (perceptually identical, but made by a forger).
     - Some ghost canvases (made from the artist's leftover materials, same physical matter, but without the artist's intention).

  2. **Provenance Cards**: For each piece, there is a hidden provenance card that only the game master (you) knows. The card states the true nature of the piece (original, copy, or ghost canvas). The card also includes:
     - Material Provenance: Where the materials came from (e.g., "paint from artist's studio, 1890").
     - Intentional Provenance: The causal chain (e.g., "painted by the artist in 1890" vs. "painted by a forger in 2024 using the artist's leftover materials").

  3. **Rounds**:
     - Each round focuses on one art piece.
     - Step 1: Display the art piece (image) and give a brief fictional backstory (without revealing the critical provenance).
     - Step 2: Distribute a "Voting Sheet" for that piece. On the sheet, participants must choose one of three options for the piece:
          a. **Insure it** (high insurance value, implies high worth) - if chosen and it's original, they get points; if ghost or copy, they lose points.
          b. **Display it prominently** (medium value) - moderate points if original, neutral or negative for others.
          c. **Destroy it** (if they suspect it's fake) - positive points if it's a copy or ghost (because they avoid wasting resources on a fake), negative if it's original.
     - Step 3: Collect votes and tally (but don't reveal the true nature yet). Record the votes for later scoring.
     - Repeat for all pieces.

  4. **Scoring System** (points per piece per participant):
     - If the piece is an **original**:
          - Insure: +3 points
          - Display: +1 point
          - Destroy: -3 points
     - If the piece is a **copy** (perceptually perfect but not original materials and no artist's intention):
          - Insure: -3 points (wasted insurance)
          - Display: -1 point (misleading the public)
          - Destroy: +2 points (good call)
     - If the piece is a **ghost canvas** (original materials but no artist's intention):
          - Insure: -2 points (it's not the original, but materials are authentic so less bad than copy? We want to see if they value materials or not)
          - Display: 0 points (it's ambiguous)
          - Destroy: +1 point (maybe it's better to get rid of it to avoid confusion, but not as bad as a copy)

     Note: The point system is designed to reflect:
          - Original: high positive for insuring, high negative for destroying.
          - Copy: high negative for insuring, positive for destroying.
          - Ghost: intermediate. We want to see if participants treat it more like a copy or more like an original.

  5. **Reveal Round**:
     - After all pieces have been voted on, reveal the true nature of each piece (one by one) and explain the provenance (material and intentional).
     - Then, calculate the scores for each participant and announce the winner (with the most points). This is just for fun and to drive engagement.

  6. **Debrief** (most important part):
     - Discuss the distinction between:
          a. **Material continuity**: The physical matter (paint, canvas) is the same as what the artist used (or from the same batch). Ghost canvases have this.
          b. **Perceptual identity**: The appearance is identical. Copies and ghost canvases have this (if they are perfect copies).
          c. **Intentional causation**: The object was created by the artist with a specific intention. Only originals have this.

     - The activity can reproduce the intuition that originals are valuable because of the intentional causation (by rewarding points for insuring originals and destroying copies). It can also show that ghost canvases are ambiguous (they have material continuity but lack intentional causation).

     - What the activity cannot reproduce: The normative claim that originals are objectively more valuable. The point system imposes a value structure (we are assigning points based on a particular view). In the debrief, we must be clear that the game rewards a particular view (that originals are more valuable) but that this is a normative stance. Participants might have different intuitions about ghost canvases, and the game's point system for ghost canvases is arbitrary (we set it as intermediate). We must acknowledge that and open the floor for discussion about whether ghost canvases should be valued differently.

     - Discussion questions for debrief:
          - How did you feel when you found out a piece you insured was a ghost canvas? A copy?
          - Did the material provenance (e.g., knowing the paint was from the artist's studio) affect your vote? How?
          - Do you think the ghost canvas is more valuable than a copy? Why or why not?
          - Should we care about the artist's intention? Why?
          - Is there an objective difference in value between an original and a ghost canvas? Or is it all about perception?

  7. **Predictable Problems**:
     - You bet that people will vote on aesthetics and ignore the hidden provenance. To mitigate:
          - Emphasize that the game is about provenance, not aesthetics. In the introduction, say: "You are art historians and your job is to determine the value based on the history of the object, not just how it looks."
          - For each piece, provide a written "provenance clue" (but not the full truth) that might hint at the hidden information. For example:
              - For an original: "This painting was listed in the artist's diary on the day it was painted."
              - For a copy: "This painting appeared suddenly in a private collection in 2020 with no prior records."
              - For a ghost: "The paint and canvas have been verified as from the artist's studio in the 1890s, but there is no record of the artist working on this subject."
          - This way, they have something to go on beyond the image.

     - Also, the point system is designed to punish purely aesthetic voting. If they vote to insure a copy because it looks nice, they lose points. The scoring will make them realize they should pay attention to provenance.

     - Another problem: Time. With 13 people, voting might take time. To save time, use a show of hands for voting (but then they might be influenced by others). Alternatively, use a secret ballot and have them write their vote on a slip of paper. Then collect and tally quickly.

     - Alternatively, use a digital tool (like a quick poll on a phone) if available.

     - Also, with 5-7 pieces, we have to keep the pace. Allocate about 5 minutes per piece for display, voting, and moving on. Then 10 minutes for reveal and scoring, and 20 minutes for debrief.

