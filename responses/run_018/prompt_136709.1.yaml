answer: |-
  ### **Game Design: "Ghost Canvas: The Provenance Paradox"**  
  **Objective**: Make players grapple with the tension between **material continuity** (same physical matter), **perceptual identity** (identical appearance), and **intentional causation** (artist's creative act) when valuing art. The "ghost canvas" twist forces players to confront cases where material provenance is partially authentic but intentional history is broken.

  ---

  ### **Game Rules & Structure**  
  **Players**: 13 participants (split into 3 teams of 4 + 1 neutral moderator).  
  **Duration**: 75 minutes (5 rounds + reveal + debrief).  
  **Materials**:  
  - 15 **Art Cards** (5 originals, 5 perfect copies, 5 ghost canvases).  
  - 15 **Provenance Cards** (hidden info: material/intentional history).  
  - Voting tokens (✅ Insure, 🖼️ Display, 🔥 Destroy).  
  - Scoreboard (points tracked publicly).  

  #### **Setup**  
  1. **Art Creation**:  
     - **Original**: Painted by Artist X with intent.  
     - **Perfect Copy**: Forged later; identical appearance, wrong materials.  
     - **Ghost Canvas**: Forged using Artist X’s *actual leftover paints/brushes* from the same period. No artist intent.  

  2. **Provenance Cards** (Hidden until reveal):  
     - **Material Provenance**: E.g., "Pigments: Artist X’s studio, c. 1890."  
     - **Intentional Provenance**: E.g., "Painted by Artist X in 1890" (original) vs. "Painted by forger in 1950 using X’s materials" (ghost).  

  ---

  ### **Gameplay**  
  #### **Round 1: Voting Phase** (10 mins per round × 5 rounds)  
  - **Step 1: Art Reveal**  
    - Moderator shows an **Art Card** (image of a painting) and reads a **neutral description** (e.g., "Landscape with Cypress Trees, oil on canvas").  
    - Teams receive a **Provenance Clue Card** with ambiguous hints (e.g., "Materials: Verified 19th-century pigments"). *No mention of intent yet*.  

  - **Step 2: Team Discussion** (3 mins)  
    - Teams debate the artwork’s value *without knowing if it’s original/copy/ghost*.  
    - **Focus**:  
      - "Should we care about the materials?"  
      - "Does the artist’s intent matter if it looks identical?"  

  - **Step 3: Vote & Wager** (2 mins)  
    - Each team votes on the artwork’s fate using tokens:  
      - ✅ **Insure** (High value: "This is irreplaceable!").  
      - 🖼️ **Display** (Moderate value: "Worth exhibiting, but not unique").  
      - 🔥 **Destroy** (Low value: "Suspected forgery").  
    - Teams **wager 1-3 points** on their vote (risk/reward: higher wager = higher stakes).  

  #### **Round 2: Reveal Phase** (15 mins)  
  - Moderator reveals **all 5 Provenance Cards** (one per artwork), showing:  
    - **Material history** (e.g., "Brushes: Artist X’s studio inventory").  
    - **Intentional history** (e.g., "Painted by forger using X’s materials").  
  - **Ghost canvas reveal example**:  
    > *"This is a GHOST CANVAS. Materials are Artist X’s authentic paints (c. 1890), but painted by a forger in 1920. No link to X’s mind."*  

  #### **Scoring System**  
  Points awarded based on **accuracy** and **consistency with revealed provenance**:  

  | **Art Type**       | ✅ **Insure**       | 🖼️ **Display**     | 🔥 **Destroy**     |  
  |--------------------|---------------------|---------------------|---------------------|  
  | **Original**       | +3 × wager          | +1 × wager          | -3 × wager          |  
  | **Perfect Copy**   | -3 × wager          | 0 × wager           | +2 × wager          |  
  | **Ghost Canvas**   | -1 × wager          | +1 × wager          | +1 × wager          |  

  - **Ghost Canvas Logic**:  
    - **Insure** (negative): No artist intent, but materials are partly valuable.  
    - **Display/Destroy** (positive): Ambiguous value—teams rewarded for cautiousness.  
  - **Winner**: Highest score after 5 rounds. Prize: "Curator of the Year" title (bragging rights).  

  ---

  ### **Debrief Framework** (15 mins)  
  **Goal**: Map gameplay to philosophical concepts. Be transparent about limitations.  

  #### **1. Key Distinctions Explored**:  
  - **Material Continuity**:  
    - *Ghost canvases* triggered conflict—players valued authentic materials but felt "cheated" without intent.  
    - *Quote from players*: "The materials felt 'holy,' but it was empty without the artist."  
  - **Perceptual Identity**:  
    - Copies/ghosts were visually identical—yet players *still* devalued them post-reveal. Shows perceptual sameness ≠ value.  
  - **Intentional Causation**:  
    - Players penalized ghost canvases for broken intent, proving they crave the artist’s "soul" in the work.  

  #### **2. What the Game CAN’T Reproduce (Normative Claim)**:  
  - **Limitation**: The game *imposes* a scoring system where originals are "objectively" worth more. But this is a **normative bias**—it assumes intentional history *should* confer value.  
  - **Discussion Prompt**:  
    > *"The game rewards you for valuing originals. But is that fair? What if society decided ghost canvases deserve equal worth? Can we prove originals are inherently better, or is it just tradition?"*  

  #### **3. Predictable Problems & Mitigation**:  
  - **Problem**: Players ignore provenance and vote on aesthetics ("I like the colors!").  
    - *Signs*: Teams vote 🖼️/✅ for all pieces; low wagering; generic debates.  
    - **Fix**:  
      - **Pre-game warning**: "You’re art insurers—your job is to assess *provenance*, not beauty."  
      - **Clue design**: Make provenance clues decisive (e.g., ghost canvas clue: "No sketches in artist’s journals match this work").  
  - **Other Issues**:  
    - Teams mimic others’ votes (solution: secret ballots).  
    - Time crunch (solution: Use a timer; moderator enforces strict limits).  

  ---

  ### **Why This Works**  
  - **Ghost Canvases** create cognitive dissonance: Players *want* to value the materials but feel the "haunting" absence of intent.  
  - **Scoring** forces trade-offs (e.g., destroying a ghost canvas feels like a "waste" of authentic materials).  
  - **Reveal** sparks "aha!" moments—e.g., teams who insured a ghost canvas groan, realizing they favored materiality over authorship.  

  ### **Post-Game Discussion Starter**  
  > *"We punished ghost canvases for lacking intent. But what if the forger was a genius? Does the artist’s *story* matter more than the object? And why do we burn forgeries but display originals—is destruction an ethical act?"*  

  This design mirrors real-world art debates (e.g., Van Gogh forgeries) while highlighting the unresolved tension between matter, perception, and mind. Run it, embrace the chaos, and let the ghosts haunt their intuitions! 🎨👻
