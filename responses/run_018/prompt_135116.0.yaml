  For the desiderata: Start with reproductive isolation (BSC's core), but immediately hit ring species as its nightmare. Then asexuals—BSC can't handle them at all. Hybrid zones as gene flow chaos. The philosophical isolation test is sneaky—it exposes how BSC relies on *actual* interbreeding while PSC might over-split. 

