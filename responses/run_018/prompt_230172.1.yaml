      {
        "label": "Material Politics",
        "core_commitment": "Politics is inherent in artifacts because design choices encode power relations that robustly produce political outcomes across contexts, independent of intent or use."
      },
      {
        "label": "Contextual Neutrality",
        "core_commitment": "Artifacts are causally inert tools; politics emerges only from human choices in social contexts, making 'artifact politics' a misleading reification of human agency."
      }
    ],
    "hidden_questions": [
      "Semantic: What constitutes 'politics'? (e.g., intent vs. outcome, normative vs. descriptive)",
      "Metaphysical: Can non-human entities bear normative properties like 'politics'?",
      "Causal: Do artifacts merely transmit human politics, or do they exert independent causal force?",
      "Methodological: Should explanation stop at the artifact or extend to networks of use/production?",
      "Normative: Does labeling artifacts 'political' obscure human responsibility?"
    ],
    "progress": [
      "Distinguish 'politics' types: e.g., designed intent (e.g., apartheid benches) vs. systemic effect (e.g., algorithmic bias) vs. interpretive flexibility (e.g., repurposed tech).",
      "Analyze edge cases: e.g., artifacts with unintended consequences (e.g., CO2 emissions from cars) or multi-use artifacts (e.g., social media used for both activism/surveillance).",
      "Shift to relational framing: Ask 'how do artifacts mediate politics?' rather than 'do they have it?' to emphasize dynamics over ownership.",
      "Define falsifiability criteria: e.g., if an artifact's political outcome persists across radically different contexts, it challenges contextual neutrality."
    ]
  }
  ```

  ### Why Progress Is Possible (and How)
  The stalemate persists because both sides implicitly defend **overgeneralized claims**: Material Politics overstates artifacts' independence (ignoring interpretive flexibility), while Contextual Neutrality understates material constraints (e.g., you can't use a low bridge for buses without rebuilding it). Progress hinges on:
  1. **Semantic Precision**: Forcing agreement on whether "politics" refers to *intent*, *outcome*, or *interpretation*.  
  2. **Edge-Case Analysis**: Testing positions against ambiguous examples (e.g., encryption tools used by dissidents and criminals).  
  3. **Relational Reframing**: Abandoning the binary "have/don't have" for actor-network or affordance-based models (e.g., Latour, Gibson) that treat politics as emergent in artifact-human assemblages.  
  4. **Empirical Grounding**: Studying artifacts with identical designs in divergent contexts (e.g., facial recognition in democracies vs. autocracies) to isolate artifact-centric effects.  

  ### Why the Debate Matters
  Despite its circularity, the debate exposes a crucial tension: **whether STS should prioritize critiquing material power (Material Politics) or human responsibility (Contextual Neutrality)**. Resolving this could unify descriptive and normative analysis—e.g., showing how acknowledging artifacts' causal force need not absolve humans of accountability. The next step isn't winning the argument but mapping where each approach illuminates blind spots in the other.
