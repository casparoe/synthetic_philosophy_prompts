prompt: |-
  Hey, I've been re-reading some old LW threads on split-brain stuff and I keep running into this tech analogy people use: the two hemispheres are like two seperate OS processes on one bare-metal server, with the corpus callosum as a high-bandwidth IPC pipe that got cut. They share peripherals (eyes, ears) but don't sync working memory, so you get those classic cases where the left hand grabs one card while the verbal left hemisphere reports another. I want to audit how far this holds, so lay out the correspondence table -- server, processes, shared peripherals, severed cable -- then the breakdown points, especially wether there's actually one user account or two. Does the analogy smuggle in a computational theory of mind that's doing all the work, and does the "two minds" conclusion survive once the disanalogies are on the table? Give me exactly five numbered points, each just one or two sentences, with no intro or conclusion.
reasoning: |-
  Okay, the user is diving deep into split-brain phenomena using a tech analogy. They want a strict correspondence audit between the analogy and neuroscience facts. 

  First, mapping the core components: "bare-metal server" as the biological substrate makes sense - it's the shared hardware infrastructure. "Two OS processes" captures hemispheric independence well, though I should note they're asymmetric unlike typical processes. The "IPC pipe" for corpus callosum holds up too. 

  But the peripherals part needs nuance - eyes/ears aren't truly shared like USB devices; there's contralateral wiring. And the "user account" question is the real kicker: the analogy implies one user but experiments show dual consciousness. 

  Where it breaks: the computational theory smuggles in homunculi, and ignores that hemispheres aren't blank-slate processes - they're pre-wired with different specializations. Also, the "severed cable" oversimplifies - subcortical structures still connect them. 

  User seems sharp - they're already spotting the theory-laden risks in the analogy. Probably wants to dissect whether the "two minds" view is an artifact of the metaphor. Should emphasize the empirical evidence for duality despite the flawed analogy.
answer: |-
  1.  **Server = Biological Substrate:** The brain's physical hardware (neurons, glia, blood supply) is the "bare-metal server" both hemispheres run on.
  2.  **Processes = Hemispheres:** The largely independent computational modules performing specialized tasks (e.g., language left, spatial right) correspond to separate "OS processes".
  3.  **Shared Peripherals (Partial):** Sensory inputs (eyes, ears) and motor outputs (hands) are shared peripherals, but wiring is contralateral (left hem controls right hand, etc.), complicating true "sharing".
  4.  **Severed Cable = Corpus Callosotomy:** Cutting the corpus callosum severs the primary high-bandwidth "IPC pipe" for explicit inter-hemispheric communication and memory sync.
  5.  **Breakdown: User Account & Theory:** The analogy *does* smuggle in computationalism (mind as software) and crucially breaks on "one user account"; post-split behavior *demonstrates* two distinct conscious agents ("users") with conflicting goals/reports.
