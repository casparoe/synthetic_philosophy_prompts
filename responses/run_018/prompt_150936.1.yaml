answer: |-
  Here is a reusable evaluation procedure designed for macro-historical causal narratives, optimized for speed, methodological rigor, and consistency. It addresses "galactic overdetermination," counterfactual instability, and causal strength grading. Each step must be completed sequentially—proceed only if the prior step passes.

  ---

  ### **Causal Narrative Evaluation Procedure (v1.0)**  
  **Goal:** Classify claims as **Pass** (causal claim stands), **Conditional Pass** (downgrade to non-causal role), or **Reject** (fatal flaw).  

  #### **Step 1: Causal Isolation Test**  
  *Checks for correlation/causation conflation and baseline counterfactual.*  
  - **Question:** Does the report explicitly contrast the focal country with a *plausible counterfactual* (e.g., a peer that lacks the alleged cause but shares key background conditions)?  
  - **Sufficient Answer:** Yes, with ≥3 comparable cases (e.g., Norway vs. Denmark/Sweden *plus* Netherlands/UK).  
  - **Reject If:** No counterfactual, or peers are non-comparable (e.g., Norway vs. Somalia).  
  - **Judgment Call:** None—purely logical.  

  #### **Step 2: Overdetermination Screen**  
  *Identifies "galactic overdetermination"—ignoring multiple sufficient pathways.*  
  - **Question:** Does the report acknowledge ≥2 *alternative explanations* (e.g., institutions, resources, geopolitics) documented in literature for the outcome?  
  - **Sufficient Answer:** Yes, and explains why the focal cause dominates *despite* alternatives.  
  - **Reject If:** Dismisses viable alternatives without evidence (e.g., "Geography doomed Mali" ignores Botswana’s success with similar geography).  
  - **Judgment Call:** Reviewer verifies alternatives using standard references (e.g., World Bank governance indicators, colonial history datasets).  

  #### **Step 3: Mechanism Requirement**  
  *Tests for causal mechanism vs. mere association.*  
  - **Question:** Is there a *plausible pathway* linking cause to outcome (e.g., "parliaments enabled credible debt issuance → funded industrialization")?  
  - **Sufficient Answer:** Yes, with at least one documented historical sequence (e.g., archival evidence of policy decisions).  
  - **Reject If:** Mechanism is circular ("rich because institutions, institutions because rich") or absent.  
  - **Judgment Call:** None—mechanism must be explicit.  

  #### **Step 4: Counterfactual Stability Assessment**  
  *Evaluates if the "cause" can be treated as an isolatable intervention.*  
  - **Question:** Could the cause *feasibly exist independently* of its historical context (e.g., transplanting "Japanese group values" to Brazil)?  
  - **Sufficient Answer:** For structural causes (e.g., geography)—yes. For configurational causes (e.g., culture/institutions)—only if path-dependence is addressed.  
  - **Conditional Pass/Downgrade If:** Cause is configurational *and* context-dependent (e.g., culture). Downgrade to *facilitating condition* (e.g., "enabled but did not determine growth").  
  - **Judgment Call:** Reviewer assesses context-dependence using historical scholarship.  

  #### **Step 5: Interaction Audit**  
  *Checks if interactions (e.g., "geography × institutions") are properly specified.*  
  - **Question:** Are interactions framed as *co-causes* (A+B→Y) or *secondary modifiers* (A→Y, boosted by B)?  
  - **Sufficient Answer:** Co-causes with evidence of independent effects (e.g., colonial disruption *and* geography harmed Mali).  
  - **Reject If:** Demotes a major cause to "modifier" without justification (e.g., calling colonialism "secondary" in Mali despite evidence of extractive institutions).  
  - **Judgment Call:** None—misclassification is factual.  

  ---

  ### **Application to Cases**  
  *(Using standard references: Maddison Project GDP data, Polity IV regimes, FAO climate zones)*  

  1. **Norway’s Parliamentary Institutions**  
     - Step 1: **Fail**—Compares only to Denmark/Sweden (similar oil/resources). Ignores oil-less peers (e.g., Finland).  
     - **Outcome: REJECT** (Insufficient counterfactual).  

  2. **Mali’s Geographic Determinism**  
     - Step 1: Pass (landlocked/tropical peers listed: Chad, Niger).  
     - Step 2: **Fail**—Ignores Botswana (same geography, 5× Mali’s GDP/capita) and dismisses colonialism’s role as "secondary" despite evidence of extractive institutions.  
     - **Outcome: REJECT** (Galactic overdetermination—geography not sufficient).  

  3. **Japan’s Group-Oriented Values**  
     - Step 1: Pass (compares to S. Korea/Taiwan—similar culture but different growth timing).  
     - Step 2: Pass (acknowledges US aid, industrial policy).  
     - Step 3: Pass (mechanism: "values reduced labor strife → efficient factories").  
     - Step 4: **Conditional Pass**—Culture is configurational; counterfactual unstable (e.g., same "values" in Edo-period Japan did not cause industrialization).  
     - **Outcome: CONDITIONAL PASS (DOWNGRADE)** → "Cultural cohesion facilitated growth but was insufficient without exogenous shocks (e.g., US security guarantees)."  

  ---

  ### **Limitations of the Procedure**  
  1. **Cannot evaluate unconventional valid arguments**: E.g., "Singapore’s wealth caused by *fear* of Malaysian annexation" (complex emotional drivers evade Steps 3–4).  
  2. **Ignores distributive justice**: A "Pass" for "Chile’s wealth from copper" says nothing about inequality or environmental harm.  
  3. **Filter for coherence, not truth**: Relies on existing data—cannot detect omitted variables (e.g., a report on Botswana ignoring diamond discovery would still pass Step 2 if peers are weak).  
  4. **Judgment-dependent steps**: Step 2 (alternative explanations) and Step 4 (counterfactual stability) require familiarity with historical literature.  

  ---

  ### **Worked Examples**  
  - **Pass**: "Botswana’s diamond wealth caused growth vs. landlocked peers (Step 1), but acknowledges strong institutions prevented resource curse (Step 2), shows revenue-investment link (Step 3), diamonds are structural (Step 4), and institutions are co-cause (Step 5)."  
  - **Conditional Pass (Downgrade)**: "Ghana’s English common law caused growth" → Downgraded to *facilitating condition* after Step 4 (identical laws failed in Sudan due to context).  
  - **Reject**: "Haiti’s poverty caused by Voodoo culture" → Fails Step 2 (ignores French colonial debt, US occupation) and Step 3 (no mechanism beyond correlation).  

  This procedure forces narratives to confront macro-historical complexity while remaining operable in 120 minutes. It converts causal overreach into constrained, evidence-compatible statements—ensuring claims are *defensible* even when not definitive.
