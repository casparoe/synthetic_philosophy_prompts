answer: |-
  Here’s a polished exam question, model answer, and marking scheme tailored to your specifications. The question closes the "moment of ascription" loophole explicitly.

  ---

  **Exam Question (Print as-is):**  
  *(Total: 20 marks; Suggested time: 45 minutes)*  

  **The Handover Case:**  
  A turbine blade is composed of ceramic in phase α. At time *t*<sub>0</sub>, the blade is fragile in virtue of its α microstructure: if struck hard, it would shatter. Permanently affixed to the blade is an intrinsic monitoring device (i.e., it is part of the blade itself). At *t*<sub>1</sub>, an impact is detected by the device 1 microsecond before contact (*t*<sub>2</sub>). The device instantly reorganizes the blade’s surface layer into phase β, a distinct microstructure. Phase β ceramic is independently fragile: blades made solely of β shatter under hard impacts just as readily as α blades. The blade is then struck hard at *t*<sub>2</sub> and shatters.  

  **Question:**  
  Using this case, critically evaluate whether Lewis’s "retention of the causal basis" repair successfully resolves challenges to the conditional analysis of dispositions. Your answer must:  
  1. Classify the case within the fink/mask/antidote taxonomy and explain why the conditional (*if struck hard at t<sub>0</sub>, it would shatter*) holds.  
  2. Assess whether Lewis’s requirement that the object "retains its causal basis" up to manifestation correctly judges the blade’s fragility at *t*<sub>0</sub>. Explain why the device’s *intrinsic* status matters.  
  3. Explain why defining the causal basis as *"either α or β microstructure"* fails as a solution.  
  4. Defend a position on how disposition ascriptions should be repaired, explicitly stating the theoretical cost of your view.  

  *(Assume the blade is fragile at t<sub>0</sub> absent external interferers. Focus on argument, not citations.)*  

  ---

  **Model Answer (712 words):**  
  **(Examiner’s Note: Commits to "No Retention + Coarse-Grained Dispositions" view)**  

  The handover case is not a standard fink, mask, or antidote. Finks remove dispositions when triggered (e.g., a wire losing conductivity), masks prevent manifestation despite retained disposition (e.g., poison + antidote), and antidotes interrupt the causal chain post-stimulus. Here, the conditional "if struck hard at *t*<sub>0</sub>, it would shatter" holds: the blade *does* shatter when struck, fulfilling the conditional’s consequent. Yet the microstructure basis changes from α to β just before impact. This is a novel *intrinsic handover*: the disposition manifests, but via a switched causal basis.  

  Lewis’s "retention of the causal basis" repair fails here. His fix requires that the object retains the *same* causal basis from ascription (*t*<sub>0</sub>) to manifestation (*t*<sub>2</sub>). In handover, the basis changes from α to β at *t*<sub>1</sub>, so Lewis would deny the blade is fragile at *t*<sub>0</sub>. But this is incorrect: the blade *is* fragile at *t*<sub>0</sub> because (i) it possesses a microstructure (α) that grounds fragility, and (ii) the intrinsic device guarantees manifestation under impact by switching to an equally fragile basis (β). Crucially, the device’s *intrinsic* status makes the blade’s fragility a stable, non-accidental property. If the device were extrinsic, the blade’s fragility at *t*<sub>0</sub> would depend on external factors, weakening the ascription. Here, fragility is secured by the blade’s *own* properties.  

  One might salvage Lewis’s view by defining the causal basis disjunctively: "α-or-β microstructure." But this is a trap. First, disjunctive properties are unnatural: α and β are distinct physical states with no shared causal mechanism (e.g., diamond and glass are both fragile but have different bases). Second, it overgenerates dispositions. Suppose the device could switch the blade to phase γ, which *isn’t* fragile (e.g., it bends). The disjunction "α-or-γ" would now include a non-fragile basis, yet the blade might still shatter (if switched to α) or not (if switched to γ). This makes fragility ascriptions implausibly context-dependent: the blade would be "fragile" at *t*<sub>0</sub> only if the device happens to select a fragile phase. But intuitively, the blade’s fragility at *t*<sub>0</sub> is fixed by its actual properties, not future possibilities.  

  The correct repair is to abandon basis retention and adopt a **coarse-grained view of dispositions**. Fragility is not tied to a *specific* microstructure but to the higher-order property of *having some microstructure or mechanism that guarantees shattering under impact*. In handover, the blade has this property at *t*<sub>0</sub> via α-microstructure-plus-device, so it is fragile. The cost is that dispositions become multiply realizable and less metaphysically "deep": they supervene on the object’s total intrinsic properties rather than a privileged subset (e.g., "causal basis"). This sacrifices Lewis’s reductionist ambition to define dispositions via categorical bases. Fragility is now a functional role: *whatever internal state ensures shattering*.  

  *Why accept this cost?* Handover shows that natural-kind-like microstructures are insufficient for disposition identity. The blade manifests fragility despite basis alteration because the device ensures continuity of *dispositional role*. Denying fragility at *t*<sub>0</sub> ignores that the object’s intrinsic properties (α + device) necessitate manifestation. The coarse-grained view captures this while avoiding gerrymanders: the basis isn’t disjunctive "α-or-β" but the unified system "α-with-device," which non-accidentally guarantees the conditional holds.  

  ---

  **Marking Scheme**  
  *(Total: 20 marks; 5 key points, uneven weighting)*  

  1. **Taxonomy Classification & Conditional Truth** (4 marks)  
     - *Must-hit:* Correctly identifies it as outside standard taxonomy (not fink/mask/antidote); explains conditional holds (shattering occurs).  
     - *Botch:* Misclassifies as fink (basis removed) or mask (disposition blocked); claims conditional false.  
     - *A-grade:* Explicitly contrasts with finks (basis removal vs. basis-swap).  

  2. **Lewis Retention Verdict & Intrinsicity** (5 marks)  
     - *Must-hit:* States Lewis denies fragility (basis not retained); argues this is wrong *because device is intrinsic*.  
     - *Botch:* Claims Lewis gets correct verdict; ignores intrinsicity or treats device as extrinsic.  
     - *A-grade:* Explains intrinsicity makes fragility a *non-accidental* property of the blade.  

  3. **Disjunction Trap Critique** (5 marks)  
     - *Must-hit:* Rejects disjunctive basis "α-or-β" as unnatural/gerrymandered; gives a reason (e.g., no shared causal mechanism, overgeneration).  
     - *Botch:* Endorses disjunction; fails to explain why unnatural.  
     - *A-grade:* Uses γ-phase counterexample to show overgeneration.  

  4. **Defended Repair & Cost** (4 marks)  
     - *Must-hit:* Proposes a repair (e.g., coarse-grained dispositions); explicitly names cost (e.g., loss of reductionism, dispositions as functional roles).  
     - *Botch:* Only critiques Lewis; no positive view; cost unstated.  
     - *A-grade:* Ties repair to handover’s lesson (e.g., dispositions require intrinsic *guarantee* of manifestation).  

  5. **Loophole Handling** (2 marks)  
     - *Must-hit:* Assumes blade is fragile at *t*<sub>0</sub> (per question stipulation); doesn’t waste time disputing this.  
     - *Botch:* Spends significant time arguing blade isn’t fragile at *t*<sub>0</sub>.  
     - *Note:* If briefly addressed, award marks elsewhere; if central, max 12/20.  

  **A vs. B Distinction:**  
  - **B (12–15/20):** Hits all points competently but superficially (e.g., "disjunction is gerrymandered" without elaboration).  
  - **A (16–20/20):** Synthesizes points into an insight (e.g., "Handover shows dispositions depend on *total intrinsic guarantee*, not basis persistence"); uses the case to reveal a deeper problem (e.g., "Dispositions are individuated by manifestation conditions, not microstructure").  

  ---

  **Loophole Closure:** The question explicitly stipulates "the blade is fragile at *t*<sub>0</sub>," and the marking scheme penalizes disputing this. This forces engagement with the retention puzzle.  

  **Accessibility:** The question provides all necessary terminology (fink/mask/antidote, Lewis repair) and case details, requiring only lecture-level knowledge. The model answer avoids jargon beyond the course scope.
