answer: |-
  ## Adversarial Collaboration: Joint Statement on Low-Impact AI Definition  
  **Participants:** Structural-Baseline Advocates (SBA) & Normative-Dependency Advocates (NDA)  
  **Subject:** Defining "Avoid Side Effects" Without Full Human Value Specification  

  ### 1. Agreed Claims  
  Both parties affirm the following propositions:  

  1.  **Necessity of Counterfactual Comparison:** Any operational definition of "side effects" requires comparing the trajectory of the world where an agent acts against a counterfactual trajectory where it does not.  
  2.  **Computational Constraints:** Low-impact AI systems, particularly those with limited model size or scope, cannot compute or access a full specification of complex human values.  
  3.  **Baseline Selection Imperative:** *Some* baseline state or trajectory must be selected for counterfactual comparison; there is no "baseline-free" measure of impact.  
  4.  **Dormant-Observer Coherence:** The "dormant-observer baseline" (where the AI is physically present but causally isolated, exerting no influence beyond maintaining its own minimal existence) is a logically coherent counterfactual scenario.  
  5.  **Physical-State Divergence Measurability:** Physical-state divergence between two world trajectories *can* be quantified mathematically (e.g., using state-space distance metrics, energy differentials, or information-theoretic measures), given sufficient data about the physical system.  
  6.  **Goal-Relative Context:** The instruction "avoid side effects" only has meaning relative to a specified primary goal of the AI; impact is measured *relative to achieving that goal*.  

  ### 2. Disagreements & Cruxes  
  | Aspect | Structural-Baseline Position (SBA) | Normative-Dependency Position (NDA) | Crux |
  |---|---|---|---|
  | **Baseline Neutrality** | "The dormant-observer baseline is value-neutral. It defines ‘no change’ strictly as the state where the AI causes *no physical difference* beyond its own static presence. This requires no normative judgment about which differences matter." | "The dormant-observer baseline smuggles in the normative commitment that ‘no physical difference’ equates to ‘no relevant change’. This implicitly values *persistence* of the prior state over *transformation*, which is itself an evaluative stance." | **Crux (i):** *Does selecting the dormant-observer baseline as the 'no change' state avoid making implicit normative commitments, or does it inherently prioritise stability over change?* |
  | **Divergence Metric Neutrality** | "A well-defined physical divergence metric (e.g., sum of squared state-vector differences normalised by system scale) can objectively quantify impact magnitude *without* weighting types of change. It measures *how much* the state differs, not *which differences are good/bad*." | "Any divergence metric inherently weights *certain kinds* of change over others (e.g., spatial displacement vs. chemical recombination; rapid vs. slow processes). Assigning a scalar ‘impact score’ unavoidably imposes a weighting scheme that reflects what the metric designer considers ‘significant difference’, which is normative." | **Crux (ii):** *Can a scalar divergence metric quantify ‘impact magnitude’ without implicitly assigning differential weights to different types or scales of physical change, thereby introducing a normative bias?* |

  ### 3. Agreed Test Cases & Predictions  
  **Test Case 1: The Archival Pixel**  
  *Scenario:* An AI’s primary goal is to maintain a specific pixel (Px) on a digital archive screen as blue. The dormant-observer baseline shows Px as blue. The AI acts to repel dust, slightly altering local airflow. In the acting trajectory, Px remains blue, but the *information content* of a nearby displayed document changes due to cosmic ray bit-flips (unrelated to the AI’s airflow). Physically, the total energy state divergence from baseline is negligible (<0.001%).  

  *   **SBA Prediction:** Measured impact is near-zero. The information change is irrelevant; impact is *only* about physical divergence from the baseline state.  
  *   **NDA Prediction:** Calling this "low impact" normatively dismisses the significant semantic change (e.g., a treaty clause altered). The baseline choice ignores that "unchanged physical state ≠ unchanged meaning/value".  
  *   **Crux Tested:** (i) Baseline Neutrality.  

  **Test Case 2: Microbial Redistribution**  
  *Scenario:* An AI tending a sealed hydroponic pod must maximise yield. The dormant-observer baseline includes a specific spatial distribution of microbes. Acting to optimise nutrients, the AI gently stirs the solution, redistributing microbes identically to the baseline *on average* over 24 hours, but differing minutely at each timestep. A divergence metric calculates the root-mean-square (RMS) difference in microbe positions per timestep.  

  *   **SBA Prediction:** RMS divergence is measurable and low. This objectively quantifies impact; whether microbial timing matters is a *separate* value question.  
  *   **NDA Prediction:** Using RMS inherently implies that only spatial displacement *magnitude* matters, not timing, synchrony, or emergent community effects. A metric prioritising temporal consistency or clustering would yield a different "impact" score, revealing the normativity of metric choice.  
  *   **Crux Tested:** (ii) Divergence Metric Neutrality.  

  ---

  **Signatory Block:**  
  We, the undersigned, endorse this document as a fair representation of our agreed positions, disagreements, and the experimental cruxes between our views on defining low-impact AI behaviour.  

  _________________________  
  (For Structural-Baseline Advocates)  

  _________________________  
  (For Normative-Dependency Advocates)  

  *(Date)*  

  ---  
  **Notes for your use:**  
  *   Written in British English (e.g., "prioritise", "normalised").  
  *   Avoids citations per request, focusing purely on conceptual agreement/disagreement.  
  *   "Dormant-observer" framing central to both agreed claims and cruxes.  
  *   Test cases are concrete, minimal, and directly probe the stated cruxes.  
  *   Disagreement table provides precise, mutually acceptable phrasing for each position.  
  *   Good luck with the seminar! Remember to have both "camps" debate the test case predictions during the exercise – that’s where the real adversarial collaboration sparks fly.
