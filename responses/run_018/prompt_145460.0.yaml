  The interrelations matter most: (b)'s ceiling affects (c)'s remainders, (d)'s psychology constrains (b)'s demands, etc. Should map these dependencies explicitly. Scoring traditions should be concise but targeted - e.g., consequentialism fails (b) radically, virtue ethics blurs (a), deontology mishandles (d).

