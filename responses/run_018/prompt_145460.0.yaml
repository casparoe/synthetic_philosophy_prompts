answer: |-
  ## Full Specification: Theory of Moral Sainthood as Limit Case

  **Core Desideratum:** The theory must conceptualize moral sainthood as the *asymptotic limit* of moral development, attainable only in principle, not as a discrete, achievable state or personality type. It must rigorously address the tensions inherent in maximizing moral responsiveness without collapsing key distinctions or generating paradoxes.

  ---

  **(a) Moral Reasons vs. A Good Life (Distinction Preservation)**
  *   **Motivating Distinction:** A person might perfectly fulfill all moral demands (e.g., dedicating life to alleviating extreme suffering) yet lead a life devoid of personal meaning, relationships, or flourishing (e.g., constant exhaustion, isolation, loss of non-moral passions). Conversely, a deeply fulfilling life (rich relationships, achievements, pleasures) might fall short of maximal moral responsiveness.
  *   **Desiderata:**
      1.  **Non-Negotiable:** Provide *objective grounds* for both "maximal moral responsiveness" (MMR) and "maximal good for a life" (MGL) that are irreducible to subjective preferences or contingent desires. (e.g., MMR grounded in objective moral facts/reasons; MGL grounded in an objective account of human flourishing/agency).
      2.  **Non-Negotiable:** Explain the *potential divergence* between MMR and MGL without rendering either category incoherent or merely instrumental to the other.
      3.  **Negotiable:** The *degree* of potential divergence and the specific content of MGL (beyond basic agency requirements).
  *   **Primary Damage to Traditions:** **Virtue Ethics.** Standard VE often tightly links virtue (≈ MMR) and *eudaimonia* (≈ MGL), making their divergence conceptually problematic. This desideratum forces a wedge between moral excellence and flourishing.

  **(b) Supererogation Boundaries & Moral Ceiling**
  *   **Motivating Case:** When does donating 50% of one's income become obligatory? Does maximal moral demand require sacrificing one's life to save five strangers? Is there a point where "going beyond" is conceptually impossible, or is the demand theoretically infinite?
  *   **Desiderata:**
      1.  **Non-Negotiable:** Provide a *principled criterion* (not just intuition) for when an act shifts from supererogatory to obligatory under conditions approaching the sainthood limit. (e.g., cost/risk thresholds relative to capacity, saturation of primary obligations, diminishing moral returns).
      2.  **Non-Negotiable:** Explicitly address whether a *conceptual ceiling* on moral demands exists as part of the limit concept itself. If no ceiling, explain how infinite demands are coherent with agency. If a ceiling exists, define its basis (e.g., fundamental agent-relative permissions, saturation of moral reasons).
      3.  **Negotiable:** The specific location of the boundary/criteria; whether the ceiling is primarily *conceptual* (inherent in morality/agency) or *pragmatic/psychological* (contingent on human limitations).
  *   **Primary Damage to Traditions:** **Consequentialism (Act Utilitarianism).** Standard AU struggles significantly with supererogation, often collapsing it into obligation ("if it maximizes good, you must do it"), making a conceptual ceiling difficult and potentially rejecting agent-relative permissions crucial for the boundary.

  **(c) The Remainder Problem**
  *   **Motivating Case:** After a saint has fulfilled all identifiable obligations and performed all supererogatory acts possible in a situation, do the underlying moral reasons (e.g., suffering exists, injustices remain) retain any *normative force*? If so, what form does this force take (e.g., regret, residual duty, increased weight for future acts) and how is it weighted against completed obligations?
  *   **Desiderata:**
      1.  **Non-Negotiable:** Account for the *persistent normative residue* of unmet moral needs/considerations even after maximal fulfillment by the agent. Explain its nature (e.g., non-obligating reason, object of appropriate regret, motivational prompt).
      2.  **Non-Negotiable:** Specify how this residual normative force interacts with/weights against the *defeasibility* or *completion* of the agent's fulfilled obligations and supererogatory acts. Does it diminish their "goodness"? Create a new category of "unfulfillable but significant" reasons?
      3.  **Negotiable:** The specific phenomenological or practical manifestation of the residue (e.g., profound regret vs. quiet acknowledgment); the exact weighting mechanism.
  *   **Primary Damage to Traditions:** **Consequentialism (Optimizing).** Standard optimizing consequentialism (maximize the good) struggles because the "remainder" signifies an *objective failure to maximize*, implying the saint *didn't* do enough. This contradicts the "maximal fulfillment" premise. It needs a concept of residue distinct from unfulfilled optimization.

  **(d) Psychological Sustainability & Autonomous Agency**
  *   **Motivating Concern:** Can an agent consistently operate at the limit of moral responsiveness without pathological self-effacement, loss of identity, autonomy erosion (becoming a "moral robot"), or burnout? Does sustained maximal other-regarding behavior require specific psychological structures?
  *   **Desiderata:**
      1.  **Non-Negotiable:** Demonstrate the *theoretical possibility* of stable autonomous agency compatible with sustained maximal other-regarding motivation and action *at the limit*. Agency must retain core features like identity, judgment, non-alienation, and non-coercion.
      2.  **Non-Negotiable:** Specify *mediating structures* (psychological, social, practical) the theory permits or requires to sustain agency at the limit (e.g., cultivated dispositions, supportive communities, practices of self-renewal, integration of non-moral goods *as permitted by MMR*).
      3.  **Negotiable:** The *empirical likelihood* of sustainability; the specific nature of the required mediating structures.
  *   **Primary Damage to Traditions:** **Deontology (Rigorous).** Standard deontology, especially Kantian, emphasizes duty and can downplay the psychological integration and sustainability of constant moral maximalism. Its focus on the rational will may inadequately address the phenomenological and developmental challenges of sustained limit agency, risking an alienated or psychologically unstable conception of the saint.

  **(e) Distinguishing Sainthood from Pathology & Altruism**
  *   **Motivating Cases:** Differentiating Mother Teresa (saint?) from a compulsive self-sacrificer with low self-worth, or from a highly effective but emotionally detached altruist optimizing donations without deep compassion.
  *   **Desiderata:**
      1.  **Non-Negotiable:** Provide clear *diagnostic criteria* based on reasons, motivations, and scope to distinguish:
          *   **Genuine Sainthood (Limit):** Motivation rooted in deep, integrated understanding of objective moral reasons; scope encompasses a rich, non-instrumental regard for persons *as such*; actions flow from stable character/commitment.
          *   **Pathological Self-Sacrifice:** Motivation driven by compulsion, low self-worth, or pathology; scope often narrow, distorted, or self-destructive; actions may lack integration or violate agent's own good without higher moral purpose.
          *   **Mere Efficient Altruism:** Motivation primarily instrumental/optimizing; scope focused on measurable outcomes, potentially with reduced direct regard for persons; actions driven by calculation, potentially lacking the affective or characterological depth of sainthood.
      2.  **Non-Negotiable:** Explain how the saint's *reasons* and *integration* differ fundamentally from both pathology (lack of autonomy/true moral vision) and efficient altruism (potential lack of intrinsic regard, affective connection, or character depth).
      3.  **Negotiable:** The relative weighting of affective vs. cognitive components in the diagnosis.
  *   **Primary Damage to Traditions:** **All Three Equally.** This exposes a weakness common to many standard formulations:
      *   **Virtue Ethics:** May struggle to clearly distinguish saintly self-sacrifice from pathological excess if virtue is seen as a mean (where's the mean at the limit?).
      *   **Consequentialism:** Risks conflating sainthood with mere optimal efficiency, potentially missing the reasons and character depth.
      *   **Deontology:** May focus too much on duty-fulfillment and miss the distinction between pathological compulsion and genuine moral commitment, or downplay the importance of affective regard emphasized in the altruist distinction.

  ---

  **Interrelation of Desiderata:**  
  *   (a) sets the stage by guarding against reductionism.  
  *   (b) defines the outer limits of action demanded/permitted.  
  *   (c) addresses the normative landscape *beyond* action limits.  
  *   (d) ensures the agent at the limit remains a recognizable, functional person.  
  *   (e) safeguards the concept from counterfeits, relying on distinctions informed by (a) (reasons vs. preference), (b) & (c) (scope of reasons/residue), and (d) (agency/sustainability).  
  *   Failure in any area risks collapsing the limit concept into incoherence, psychological impossibility, moral monstrosity, or mere efficiency. The theory must hold these tensions simultaneously.
