prompt: |-
  I am a doctoral student working at the intersection of philosophy of mind and cognitive neuroscience, and I have become convinced that debates about global workspace theory tend to stall because participants disagree about what a successful integration of phenomenal consciousness and access consciousness would actually have to look like. Before assessing particular models, I want to establish the criteria themselves. Could you lay out the full set of desiderata that any theory attempting to reconcile phenomenal consciousness, access consciousness, and the architecture of global broadcasting must satisfy?

  I need more than a checklist: for each requirement, specify the motivating phenomenon or conceptual distinction — for instance, the need to preserve a gap between there being something it is like to experience a state and that state being available for reasoning and report; the need to accommodate empirical findings about brief, masked stimuli that appear to carry structured phenomenal content, including figure-ground organization and face-level recognition, without entering sustained workspace availability (a constraint I will call binding-before-broadcast); and the need to avoid treating phenomenal consciousness as merely an unstable precursor to access. Please distinguish non-negotiable constraints from camp-specific preferences — such as whether determinism about workspace entry is required, or whether local recurrent processing can count as sufficient for phenomenal status — and identify whether any subset of these desiderata is jointly unsatisfiable. In particular, I want to know whether accounting for rich phenomenal structure prior to broadcasting necessarily conflicts with the global integration condition central to global workspace architectures, and if one single requirement does the bulk of the work in ruling out the most common current approaches, please say which one and why. Present your answer in American English, in a structured format with brief justification for each item, and do not provide a bibliography, citation list, or reading recommendations; I am interested solely in the conceptual specification.
reasoning: |-
  Okay, the user is a doctoral student in philosophy of mind and cognitive neuroscience. They're tackling the integration of phenomenal consciousness (what it's like to experience) and access consciousness (information available for report/reasoning) within global workspace theory. The debates stall because people can't agree on what a successful integration looks like. So they want a clear set of criteria for any theory trying to reconcile these.

  First, I need to identify the core issues. The user mentioned key points: preserving the gap between phenomenal and access consciousness, accommodating brief masked stimuli with rich content (binding-before-broadcast), and avoiding treating phenomenal consciousness as just a precursor to access. They also want to distinguish non-negotiable constraints from preferences and check for conflicts, especially between rich pre-broadcast structure and global integration.

  The user's explicit request is for desiderata with justifications. But deeper, they might need a framework to evaluate theories systematically. They might be frustrated with circular debates and want to cut through by setting objective criteria. They also hint at a possible conflict between binding-before-broadcast and global integration, which is crucial.

  Now, structuring the response. The user wants a structured format without citations. I'll categorize into non-negotiable, preferred, and joint satisfiability. Non-negotiables are must-haves for any theory. Preferences vary by philosophical stance. Then address conflicts.

  Key non-negotiables:
  1. **Phenomenal-Access Gap**: Essential because there's evidence of phenomenal states without access, like masked stimuli or inattentional blindness.
  2. **Minimal Phenomenal Reality**: Some phenomena (e.g., dreams) show consciousness without access. Must be explained.
  3. **Empirical Binding-Before-Broadcast**: Masked stimuli studies show structured content without reportability. Theory must account for that.
  4. **Non-Derivation of Phenomenality**: Phenomenal consciousness can't just be unstable access; needs its own basis.
  5. **Architectural Compatibility**: Must fit with GWT's global broadcast architecture without contradicting it.

  Preferred constraints:
  1. **Rich Pre-Broadcast Structure**: Some theories accept minimal structure, others want rich. Preference-based.
  2. **Local Sufficiency for Phenomenality**: Recurrent processing might suffice for phenomenality. Not all agree.
  3. **Determinism in Access**: GWT assumes determinism, but some prefer probabilistic. Flexible.

  Joint satisfiability: The main tension is between binding-before-broadcast (rich structure pre-access) and global integration. Rich structure requires complex local processing, while global integration demands broadcasting for conscious access. Can a theory have both? Possibly with local networks handling structure before global broadcast. Need to show it's possible without contradiction.

  The binding-before-broadcast constraint is key in ruling out theories. Many approaches either reduce phenomenality to access precursors or ignore pre-broadcast structure. This constraint forces theories to account for early, structured phenomenality, challenging simplified models.

  User's deeper need: They want to clarify the debate's foundations. By setting criteria, they can objectively assess theories. They might be aiming to propose a new model or framework that satisfies all, so identifying conflicts is vital. Highlighting that binding-before-broadcast vs. global integration isn't a deal-breaker but requires careful handling could be reassuring. Emphasizing the non-negotiables helps them dismiss inadequate theories early.
answer: |-
  Here is a structured breakdown of desiderata for reconciling phenomenal consciousness (PC), access consciousness (AC), and global workspace theory (GWT), categorized by necessity and philosophical stance, with justifications grounded in conceptual distinctions and empirical phenomena. Constraints are marked as **Non-Negotiable** (essential for any viable integration) or **Preference** (subject to theoretical orientation). Joint satisfiability and key conflicts are analyzed separately.

  ---

  ### **I. Non-Negotiable Constraints**  
  *(Essential for any theory claiming to integrate PC, AC, and GWT)*  

  1. **Phenomenal-Access Gap Preservation**  
     - **Requirement**: A theory must explain how PC (subjective experience) can exist without AC (availability for report, reasoning, or action).  
     - **Motivation**: Empirical phenomena (e.g., brief masked stimuli with unreportable content, inattentional blindness) and conceptual arguments (e.g., Block’s "overflow" thesis) demonstrate that rich PC can occur without AC.  
     - **Why Non-Negotiable**: Denying this gap collapses PC into AC, eliminating the explanatory target.  

  2. **Minimal Phenomenal Reality**  
     - **Requirement**: PC must be treated as a real, causally relevant property, not an epiphenomenal byproduct.  
     - **Motivation**: Introspective reports and neural correlates confirm PC’s causal efficacy (e.g., pain influencing behavior even when unaccessed).  
     - **Why Non-Negotiable**: Epiphenomenalism renders PC explanatorily irrelevant, contradicting empirical psychology.  

  3. **Empirical Binding-Before-Broadcast**  
     - **Requirement**: The theory must accommodate structured PC (e.g., figure-ground segregation, face recognition) arising from local processing *prior* to global broadcasting.  
     - **Motivation**: Data from masked priming, rapid serial visual presentation (RSVP), and EEG show complex visual content (e.g., facial expressions) can be processed without entering sustained workspace availability.  
     - **Why Non-Negotiable**: Ignoring this conflates PC with stability/access, failing to explain early perceptual phenomenology.  

  4. **Non-Derivation of Phenomenality**  
     - **Requirement**: PC cannot be reduced to "unstable AC" or a mere precursor to broadcast.  
     - **Motivation**: Phenomenal states (e.g., fleeting sensations in dreams or subliminal perception) lack functional access but possess qualitative character.  
     - **Why Non-Negotiable**: Treating PC as unstable AC reduces it to a functional property, violating the phenomenal-access gap.  

  5. **Architectural Compatibility**  
     - **Requirement**: The theory must retain GWT’s core architecture: distributed specialized modules, a global workspace for integration, and broadcasting to consumer systems.  
     - **Motivation**: GWT’s success in explaining attention, reportability, and cognitive control (e.g., Dehaene’s neuronal global workspace).  
     - **Why Non-Negotiable**: Abandoning broadcasting or integration undermines GWT’s explanatory power for AC.  

  ---

  ### **II. Preference-Based Constraints**  
  *(Dependent on theoretical stance; not universally required)*  

  1. **Rich Pre-Broadcast Structure**  
     - **Requirement**: Local processing alone suffices for richly structured PC (e.g., object-level detail).  
     - **Motivation**: Masked stimuli studies suggest early visual areas support complex content (e.g., facial identity).  
     - **Why a Preference**: "Sparse" theorists argue PC pre-broadcast is limited to low-level features (e.g., color), with structure requiring global integration.  

  2. **Local Sufficiency for Phenomenality**  
     - **Requirement**: Local recurrent processing (e.g., in sensory cortices) can generate PC without global broadcasting.  
     - **Motivation**: Neural evidence of recurrent loops in V1/V2 correlating with unreportable visual qualia.  
     - **Why a Preference**: GWT purists (e.g., Dehaene) insist global broadcasting is necessary for *any* PC.  

  3. **Determinism in Access**  
     - **Requirement**: Entry into the global workspace follows deterministic (vs. stochastic) principles.  
     - **Motivation**: Predictability in attentional capture and access thresholds (e.g., in breaking continuous flash suppression).  
     - **Why a Preference**: Some models (e.g., IIT-influenced) posit probabilistic access, but GWT typically assumes determinism.  

  ---

  ### **III. Joint Satisfiability & Key Conflicts**  

  #### **A. Binding-Before-Broadcast vs. Global Integration**  
  - **Conflict Potential**: Rich local structure (Desideratum I.3) *seems* to conflict with GWT’s claim that consciousness *requires* global integration (I.5).  
  - **Resolution**: Not inherently unsatisfiable. A theory can satisfy both by:  
    - Limiting global integration to *stabilizing* (not creating) phenomenality.  
    - Treating local networks as sufficient for "fragmentary" PC, while broadcasting enables report/integration *of* that content.  
  - **Example**: Early visual hierarchy generates bound content (e.g., a face), which is then "selected" for broadcasting without altering its structure.  

  #### **B. The Decisive Constraint**  
  - **Binding-Before-Broadcast (I.3)** does the heaviest work in ruling out common approaches:  
    - **Eliminates**:  
      - **Pure GWT** (e.g., Dehaene/Changeux): Assumes all PC requires broadcasting, ignoring unreportable structure.  
      - **Higher-Order Thought (HOT) Theories**: Reduce PC to metarepresentation, which implies no PC without access.  
      - **Epistemic Reductionism**: Treats PC as "proto-access," violating I.3 and I.4.  
    - **Why Decisive**: It forces theories to explain how complex phenomenology arises *before* functional access—challenging architectures where global availability is constitutive of consciousness.  

  #### **C. No Fatal Incompatibilities**  
  - All non-negotiable constraints can be jointly satisfied. For example:  
    - A **hybrid model** where local recurrent processing generates PC (satisfying I.1–I.4), while GWT handles access via selective broadcasting (I.5).  
  - The tension between I.3 (local binding) and I.5 (global integration) is resolvable by distinguishing *content generation* (local) from *content utilization* (global).  

  ---

  ### **Summary of Core Challenges**  
  - **Primary Hurdle**: Explaining how local systems produce structured PC (I.3) without invoking global broadcasting, while retaining GWT’s architecture for access (I.5).  
  - **Critical Failure Point**: Theories that conflate PC with access (violating I.1 or I.4) or dismiss pre-broadcast structure (violating I.3) cannot satisfy the non-negotiables.  
  - **Key Insight**: The binding-before-broadcast constraint (I.3) is the most consequential, as it demands a mechanistic account of phenomenal richness independent of access—pushing beyond standard GWT and forcing a redefinition of the workspace’s role. 

  This framework prioritizes empirical adequacy and conceptual coherence over camp-specific assumptions, providing a baseline for evaluating proposed integrations.
