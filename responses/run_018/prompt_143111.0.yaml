  I was talking with my friend after a philosophy of mind class and we got stuck on whether Dennett's wandering two-bitser actually proves anything against Searle. I think Searle's still mostly right — that dervied intentionality is just a shadow cast by original intentionality, and even the two-bitser's meanings are only meaningful because we (the original intenders) designed and interpret it — but I'm only about 0.6 credance on that being the whole story. Give me your actual number for how likely it is that original intentionality is genuinely indispensible, with the reasoning decomposed: what's the prob that derived intentionality is causally inert without an original source behind it, what's the prob that the two-bitser's environmental tracking counts as proto-original intentionality rather than pure derivation, what's the prob that functionalism about mental content collapses the distinction entirely, and whatever other term belongs in there. Give rough probabilities for each piece, explain how they combine into your final figure, tell me which sub-question you're least sure about and what specific kind of argument — not just "more science" — would shift it. Don't just lay out Dennett's view and Searle's view and leave me hanging; take a real stance, defend the number, and tell me where the weakest link in your own reasoning is.
