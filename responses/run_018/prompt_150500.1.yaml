prompt: |-
  I heard a friend summarise Ruth Chang's position on hard choices. She said that for Chang, incommensurable values are like orthogonal axes — say, artistic integrity versus scientific impact — so there's no rational comparison at all, and picking one is basicaly like flipping a coin. She said Chang labels this parity, meaning the options are literally tied, and that this proves deep value conflicts are subjective because no objective fact breaks the tie. She also claimed Chang thinks that once you commit, the leftover normative residue just disappears, so commitment doesnt actually create reasons. I think she's wrong about the coin-flip part and about residue, since I recall Chang arguing commitment generates new reasons. Is this summary fair? Please split out whats accurate, whats a simplification, and what Chang explicitly rejects.
reasoning: |-
  Okay, the user is asking about Ruth Chang's philosophy on hard choices, specifically whether their friend's summary is accurate. Let me start by recalling Chang's main arguments. Her key point is that incommensurable values aren't comparable by a single standard, but that doesn't mean choosing between them is arbitrary. The friend compared it to orthogonal axes and flipping a coin, which seems off.

  Chang uses "parity" to describe options that are on par, meaning neither better nor worse, yet still comparable through rational commitment. The friend mentioned "tied" like a coin flip, but Chang opposes that. She emphasizes that commitment creates new reasons, rather than the residue just disappearing. The friend's summary misses that commitment is active, not passive.

  The user remembers Chang saying commitment generates reasons, which is correct. The friend's claim about normative residue disappearing is wrong. Chang argues that residue is why we feel lingering doubt, but commitment transforms it into reasons supporting the choice.

  I need to break down what's accurate in the friend's summary: the orthogonality analogy for incommensurability, the term "parity," and the tie part. But the coin-flip interpretation is a simplification. Chang rejects the coin-flip idea and the residue disappearing. The user's correction about commitment creating reasons is right.

  The user might be using this for academic discussion or personal understanding of hard choices. They want clarity to possibly correct their friend. Underlying needs could be grasping how to make rational decisions without objective measures, applying this to real-life dilemmas. Ensuring they see commitment as an active, reason-creating process is crucial here.
answer: |-
  Based on your recollection and Ruth Chang's core arguments (primarily in "Hard Choices" and related work), your friend's summary contains significant inaccuracies and simplifications, particularly regarding the coin-flip analogy and normative residue. Here's a breakdown:

  **What's Accurate/Partially Accurate (but often simplified/misleading in context):**

  1.  **Incommensurable Values & Orthogonal Axes Analogy:** This is *roughly* accurate as a starting point. Chang does argue that in many hard choices, the alternatives are *incommensurable* – meaning there's no single scale of value (like "goodness points") on which they can be precisely ranked (one better, worse, or equal). The orthogonal axes analogy (e.g., artistic integrity vs. scientific impact) is a common *illustration* of this lack of a common measure. **Accurate:** The idea that no *pre-existing* rational comparison dictates one option as objectively better.

  2.  **Parity:** Chang does use the term "**parity**" to describe the relationship in hard choices. **Accurate:** She defines parity as a fourth relation besides "better than," "worse than," and "equally good." Options are on a par when neither is better than the other, nor are they exactly equally good, yet they are comparable.

  **What's a Significant Simplification/Misinterpretation:**

  1.  **"Literally Tied" & "Flipping a Coin":** This is the **most critical error** in your friend's summary and fundamentally misrepresents Chang's view.
      *   **Chang Explicitly Rejects This:** She argues **vehemently against** the idea that hard choices under parity are arbitrary or akin to flipping a coin. She calls this the "default view" that she is challenging.
      *   **Why it's wrong:** Saying options are "tied" or require a coin flip implies there is *no rational basis whatsoever* for choosing one over the other, and any choice is irrational. Chang argues this is false and disempowering.
      *   **Chang's Actual View:** Parity **does not entail irrationality or arbitrariness.** While no pre-existing fact *forces* one choice over the other, we have the rational capacity to *commit* to one option, thereby *creating reasons* for it. The choice isn't dictated, but it *can* and *should* be made rationally through commitment.

  **What's Inaccurate/Chang Explicitly Rejects:**

  1.  **"Picking one is basically like flipping a coin":** As above, Chang **explicitly rejects** this. She argues commitment is the *antithesis* of a coin flip – it's an exercise of agency and norm-creation, not randomness.

  2.  **"This proves deep value conflicts are subjective because no objective fact breaks the tie":**
      *   **Misrepresents Chang:** While Chang argues there is no *pre-existing objective fact* determining the best choice under parity, she does **not** frame commitment as merely "subjective" in the sense of being arbitrary, whimsical, or purely personal preference disconnected from reason.
      *   **Chang's Nuance:** Commitment is a *rational exercise of agency*. The reasons created through commitment are *normative* – they genuinely give you reason to act and justify your choice. They are "subjective" only in the sense that they originate from the agent's will, but they are not *irrational*. Chang aims to show a "third way" beyond objective facts dictating choice and pure subjective whim.

  3.  **"Once you commit, the leftover normative residue just disappears":**
      *   **Inaccurate:** Chang **explicitly argues the opposite.** The "normative residue" – the sense that the unchosen alternative had genuine, significant value – is **crucial** to her argument.
      *   **Chang's Actual View:** The residue *persists*. It exists *because* the values were incommensurable and on a par. Commitment **does not erase** the value of the unchosen option. This lingering sense of loss or "what if" is part of what makes the choice hard and significant.

  4.  **"Commitment doesn't actually create reasons":**
      *   **Explicitly Rejected:** This directly contradicts Chang's **central thesis.** Her core argument is that:
          *   In hard choices under parity, no pre-existing reasons dictate the choice.
          *   **Through the act of commitment, the agent *creates new reasons* for the chosen option.** Commitment is **normatively transformative** – it doesn't just activate latent reasons; it *generates* them.
          *   These created reasons are what make the choice rational and justified *after* the commitment is made. They explain why you stick with your choice and why it wasn't arbitrary.

  **Summary of Chang's Correct Position vs. Your Friend's Summary:**

  | **Concept** | **Friend's Summary** | **Ruth Chang's Actual Position** |
  |-------------|----------------------|----------------------------------|
  | **Nature of choice** | Like flipping a coin; arbitrary | Rational exercise of agency; transformative |
  | **Parity meaning** | Literally tied; requires coin flip | Neither better nor equal; requires commitment |
  | **Commitment role** | Doesn't create reasons; residue disappears | Creates new reasons; residue persists |
  | **Normative residue** | Disappears after commitment | Persists as evidence of true value conflict |
  | **Subjectivity** | Proves choices are subjective | Finds third way beyond objective/subjective dichotomy |
  | **Rational basis** | No rational basis for choice | Commitment provides rational justification |

  **Conclusion:** Your instinct is correct. Your friend's summary significantly misrepresents Chang, particularly on the **coin-flip analogy** (which Chang explicitly argues against), the **disappearance of normative residue** (which Chang says persists), and the **non-creation of reasons through commitment** (which is Chang's core solution to hard choices). While the summary gets the basic idea of incommensurability/orthogonal axes and the term "parity" right, it then falls into the very "default view" that Chang is dedicated to refuting. Your recollection that commitment *creates* reasons is accurate and central to Chang's argument. The residue doesn't disappear; it's a testament to the genuine conflict, but commitment allows you to move forward with justification.
