prompt: |-
  I run a small volunteer anti-corruption group in a mid-sized city — mostly retired teachers, shop owners, a couple of city employees who keep a low profile. We spend our monthly meetings arguing about cases people bring in, and I've started to think we're not even arguing about the same concept. Some members say corruption is only when someone breaks an actual rule or law; if a mayor gives his nephew a job and the hiring manual doesn't forbid it, they call it bad judgment, not corruption. Others say no, it's corruption whenever a public official puts private loyalties ahead of the public, legal or not. Then there's a third group that pushes back on all of us, saying gift-giving and helping your people are how communities hold together, and calling every cash envelope at a funeral 'corruption' is just imposing an outside standard. The same three cases keep splitting us: a procurement officer steering a small contract to a cousin, a nurse taking a gift from a family after a surgery, and a councilor fast-tracking a permit for someone who donated to their campaign.

  Id like to make a 'which view of corruption do you actually hold?' quiz for our next workshop, so we can sort people by how they answer cases rather than which label they've learned to defend. Please write eight to ten questions, each a short concrete scenario with three answer options that reflect genuinely different judgments; then give a scoring key that maps answer patterns onto at least four positions: the rule-based/legalist position (corruption equals breaking formal rules), the public-interest position (it's about predictable harm to the public, whatever the rules say), the relational position (a genuine personal relationship can turn the same act into a gift, not a bribe), and the universalist position (even fully legal favor-swapping is corruption if it entrenches inequality). If a fifth position falls out of the questions naturally, add it. No question should just ask 'do you think clientelism is wrong?' — each one should be a case where the positions come apart, like the same amount of money given before versus after a permit is issued, or a favor done for a stranger versus a close relative. At the end, tell me which pairs of positions the quiz can't fully separate, if any, and which answer patterns have no real defenders.
reasoning: |-
  Hmm, the user runs a small volunteer anti-corruption group in a mid-sized city, mostly with retirees and some city employees. Their challenge is that members have fundamentally different views on what constitutes corruption: some see it as strictly illegal acts, others as betraying public interest regardless of legality, and a third group defending relational gift-giving as cultural glue. They need a quiz to map these differences without triggering defensive debates about labels.

  The core request is for 8-10 scenario-based questions with three answer options each, designed to reveal four philosophical positions: legalist (only illegal acts are corrupt), public-interest (harm-focused, rule-agnostic), relational (context-dependent morality), and universalist (systemic inequality lens). A fifth position might emerge organically. Crucially, each scenario must pit these views against each other through nuanced details—like timing of gifts or relationship closeness—not abstract questions.

  Key constraints to honor: 
  - Avoid "clientelism is wrong" style questions; use concrete dilemmas mirroring their recurring cases (nepotism, post-surgery gifts, fast-tracked permits)
  - Ensure answer options reflect genuine philosophical splits, not just degrees of disapproval
  - Later provide analysis of where the quiz fails to distinguish positions and which answer patterns lack real-world adherents

  For question design, I'll draw from their examples while adding variations: 
  - Vary relationship types (stranger vs. cousin vs. friend)
  - Manipulate timing (gift before/during/after official act)
  - Contrast written rules vs. unwritten norms
  - Include private-sector parallels to test consistency
  - Mix severity levels to detect threshold effects

  The scoring key should: 
  - Map answer clusters to the four core positions
  - Identify if situationalists (a potential fifth group) emerge—those judging each case purely contextually without a unifying principle
  - Note where positions overlap (e.g., legalists and universalists might agree on illegal acts, but diverge on legal favoritism)
  - Flag "orphan" answer patterns nobody defends, like endorsing blatant bribes while rejecting all relational gifts

  Post-quiz analysis must clarify: 
  - Where positions blur (e.g., public-interest vs universalist on inequality harms)
  - That extreme relativism (defending all gift-giving) or extreme absolutism (rejecting all favors) likely lacks defenders
  - How relationalists might inconsistently condemn strangers' gifts while excusing kin favors
answer: |-
  Based on your group's dynamics and the need to uncover underlying philosophical differences, here's a 10-question quiz with concrete scenarios. Each question has three answer options designed to force choices between the four core positions (Legalist, Public-Interest, Relational, Universalist), with a potential fifth "Situationalist" position emerging.

  ---

  ### **"What Counts as Corruption?" Quiz**
  *Instructions: For each scenario, pick ONE answer that best reflects your judgment.*

  1.  **The Road Repair:** A city engineer awards a pothole repair contract to her brother-in-law's company. The company bid was 5% higher than the lowest bidder but met all technical requirements. The city’s procurement rules allow "discretionary awards" for bids within 10% of the lowest.
      *   A) **Not corruption.** The rules allow discretion, and the company met standards.
      *   B) **Corruption.** Public funds were wasted for family loyalty.
      *   C) **Not corruption.** Supporting family businesses strengthens the community.

  2.  **The Hospital Gift:** After a nurse spends extra time comforting a dying patient's family, the grieving family gives her a $200 cash envelope at the funeral. Hospital policy strictly forbids staff from accepting cash gifts from patients/families.
      *   A) **Corruption.** A clear rule was broken.
      *   B) **Not corruption.** This was a genuine gift of gratitude after the service, not influencing care.
      *   C) **Corruption.** It creates expectations of special treatment for future families who can afford gifts.

  3.  **The Zoning Variance:** A council member fast-tracks a zoning variance for a small business owner who is a close personal friend. The variance is technically justified and benefits a struggling neighborhood. No laws were broken.
      *   A) **Not corruption.** The outcome was good, and no rules were broken.
      *   B) **Corruption.** The friend received preferential treatment others wouldn't get.
      *   C) **Not corruption.** Helping a friend in need through existing power is natural and builds trust.

  4.  **The Textbook Order:** A school principal orders textbooks from a publisher owned by his cousin. The books are the same quality and price as the leading alternative. The district's purchasing guidelines require "consideration of multiple vendors" but don't forbid buying from relatives.
      *   A) **Not corruption.** The guidelines were followed; price and quality were equal.
      *   B) **Corruption.** He avoided considering alternatives due to family loyalty.
      *   C) **Corruption.** It entrenches family networks in public supply chains, blocking others.

  5.  **The Campaign Lunch:** A developer invites a planning commissioner to an expensive lunch ($300 per person). During lunch, the developer discusses his upcoming projects but makes no specific requests. Campaign finance laws require reporting gifts over $50, but this was reported.
      *   A) **Not corruption.** The gift was reported as required by law.
      *   B) **Corruption.** The lavish gift creates an unspoken obligation regardless of reporting.
      *   C) **Not corruption.** Building relationships over meals is a normal part of business.

  6.  **The Permit Timing:** A homeowner seeking a renovation permit gives a small bottle of homemade wine ($15 value) to the permit clerk *after* the clerk has approved and issued the permit. The clerk accepts it.
      *   A) **Not corruption.** The gift came after the official act, so it couldn't influence it. No rule bans small tokens.
      *   B) **Corruption.** It encourages clerks to expect gifts for routine work, harming fairness.
      *   C) **Not corruption.** It's a small, personal thank-you gesture within a local custom.

  7.  **The Job Recommendation:** A senior city official strongly recommends her goddaughter (a qualified candidate) for an entry-level city job over other equally qualified candidates she doesn't know. The hiring manager follows the recommendation.
      *   A) **Not corruption.** Using personal networks for hiring is normal; the candidate was qualified.
      *   B) **Corruption.** Equally qualified strangers had no chance due to the personal connection.
      *   C) **Corruption.** This perpetuates access for the connected, blocking social mobility.

  8.  **The Emergency Generator:** During a blackout, a store owner lends the Mayor a powerful personal generator for his home. The next month, the Mayor approves the store owner's long-delayed sidewalk cafe permit ahead of others.
      *   A) **Corruption.** The permit approval was clearly payback for the favor, creating a quid-pro-quo.
      *   B) **Not corruption.** Helping in an emergency builds community bonds; the permit approval might be coincidence.
      *   C) **Corruption.** It shows how emergencies create opportunities to trade favors for access.

  9.  **The Fire Inspection:** A fire inspector finds minor violations at a restaurant owned by his bowling teammate. He gives the owner a verbal warning and 30 days to fix it instead of issuing a formal citation and fine, as the violations technically warrant.
      *   A) **Corruption.** He broke the rules by not issuing the citation he was supposed to.
      *   B) **Corruption.** He gave preferential leniency due to personal loyalty.
      *   C) **Not corruption.** Using discretion to help a community member fix problems informally is better.

  10. **The Charity Donation:** A large corporation with frequent business before the city donates $50,000 to a charity founded and chaired by the City Manager. The donation is legal and publicly reported.
      *   A) **Not corruption.** It's legal, reported, and benefits charity.
      *   B) **Corruption.** The corporation expects favorable treatment; the charity is a conduit.
      *   C) **Corruption.** This legal loophole allows wealth to buy disproportionate influence over officials.

  ---

  ### **Scoring Key & Interpretation**

  **How to Score:** Tally how many times a participant chose answers aligning with each category below. Their dominant pattern reveals their primary position. Mixed patterns indicate hybrids or the "Situationalist" position.

  *   **Answer A Choices:** Primarily **Legalist Position (Rule-Based)**. Corruption = Breaking formal rules/laws. If the rules allow it or weren't broken, it's not corruption (even if it looks bad). Focus is on legality and procedure.
  *   **Answer B Choices:** Primarily **Public-Interest Position**. Corruption = Violating the duty to serve the public interest impartially, regardless of rules. Focus is on harm, unfair advantage, betrayal of trust, or wasted resources.
  *   **Answer C Choices:** Primarily **Relational Position OR Universalist Position**. *This requires looking at the pattern:*
      *   *Relational:* Likely chose C in **scenarios 1, 2, 3, 6, 8, 9**. Emphasizes context, relationship, intent, and community cohesion. Sees genuine gifts/help within relationships as distinct from corrupt exchanges.
      *   *Universalist:* Likely chose C in **scenarios 4, 5, 7, 10**. Focuses on systemic effects, inequality, and the entrenchment of power networks, even when acts are legal or relational. Sees favoritism itself as corrupting systems.
  *   **Situationalist Position (Emerging Fifth Position):** Participants with **no clear dominant pattern (A, B, or C)**. They judge each case purely on its specific context, relationships, outcomes, and rules, rejecting broad principles. They might agree with Legalists on some, Relationalists on others, and Public-Interest on others, depending on the details. (Look for participants who spread their answers fairly evenly across A, B, and C).

  ---

  ### **Analysis: What the Quiz Can and Can't Do**

  1.  **Distinguishing Relational vs. Universalist (Answer C):** This is the quiz's **key challenge**. Both often choose "C", but for *different reasons and in different scenarios*. You MUST look at *which specific questions* they chose C:
      *   Relationalists: Choose C on cases emphasizing *personal bonds, gratitude, local customs, and immediate community benefit* (e.g., hospital gift after care, small thank-you after permit, helping a friend in need, using discretion for a teammate).
      *   Universalists: Choose C on cases emphasizing *systemic fairness, market access, inequality, and long-term power structures* (e.g., buying from family blocking others, expensive lunches building obligation, hiring/promoting via networks, legal donations as influence). **Scoring requires examining the pattern within the "C" answers.**

  2.  **Distinguishing Legalist (A) vs. Public-Interest (B):** The quiz generally does this well. Look for clear clusters. A pure Legalist will often choose A even when harm is evident (e.g., Scenario 1 - higher price, Scenario 9 - rule broken). A pure Public-Interest will choose B even when rules weren't broken (e.g., Scenario 3 - friend got fast-track, Scenario 7 - goddaughter hired).

  3.  **Overlaps & Grey Areas:**
      *   **Legalist & Public-Interest:** They will often *agree* when a clear rule is broken *and* it causes harm (e.g., Scenario 2 - taking cash against policy, Scenario 9 - not issuing citation). The quiz makes them disagree where rules allow harm (Scenarios 1, 3, 4, 7).
      *   **Public-Interest & Universalist:** They often agree on outcomes being harmful or unfair (many B and C answers align here). They disagree on the *source* of corruption: Public-Interest focuses on the official's duty/impartiality breach; Universalist focuses on systemic inequality/access. The quiz highlights this in Scenario 10 (Charity) – Public-Interest (B) sees the *obligation* as corrupt; Universalist (C) sees the *system* as corrupt.
      *   **Relational & Situationalist:** A strong Relationalist has a consistent principle (relationships matter). A Situationalist lacks consistency, judging each case uniquely. The quiz reveals this through answer pattern consistency.

  4.  **Answer Patterns with Few/No Defenders:**
      *   **Consistently Choosing A (Legalist) in Harm Scenarios:** Defending the higher-priced contract (1A), the unreported lunch (5A - if unreported, but it was reported here), or the fire inspector's rule-breaking (9A) *despite clear public harm* is likely rare. Most people feel some unease, even Legalists might hesitate on 9A.
      *   **Consistently Choosing C (Relational) in Systemic Harm Scenarios:** Defending the legal campaign lunch (5C), hiring the goddaughter (7C), or the large charity donation (10C) *as purely positive relational acts* is likely rare, even among strong Relationalists. These scenarios push towards seeing systemic issues.
      *   **Extreme "Never Corruption":** Choosing the "Not corruption" option (A or C) in *every single scenario*, including obvious quid-pro-quo (8A/C) or rule-breaking (2A, 9A), would likely have no defenders. It shows an unwillingness to label *anything* as corruption.
      *   **Extreme "Always Corruption":** Choosing B or C (the corruption options) in *every single scenario*, including the small post-permit gift (6B/C) or the discretionary award meeting rules (1B/C), would also likely have few pure defenders. It shows an absolutist view rejecting any nuance.

  ---

  **How to Use This in Your Workshop:**

  1.  **Distribute & Complete:** Have members take the quiz individually.
  2.  **Score Reveal (Optional but Powerful):** Tally scores privately or have members tally their own dominant pattern (A, B, or C-Relational/C-Universalist/Situationalist). Don't reveal labels yet!
  3.  **Case Discussion:** Return to your three contentious cases (procurement, nurse, permit). Ask members to discuss them again, *but first state which quiz answer pattern (A, B, C-Rel, C-Univ, Mix) they mostly fell into*. This frames their *reasoning*, not just their conclusion.
  4.  **Label Introduction:** After discussion, introduce the labels (Legalist, Public-Interest, Relational, Universalist, Situationalist) and map them to the quiz patterns. Highlight where the disagreements stem from fundamentally different starting points.
  5.  **Focus on Shared Goals:** Acknowledge the different lenses, but refocus on the group's shared anti-corruption mission: "Given these different perspectives, how can we still work together effectively to promote fairness and accountability in our city?"

  This quiz won't eliminate disagreements, but it will make the *source* of the disagreement transparent and move the conversation beyond just defending labels towards understanding underlying values and priorities. Good luck!
