  hey so me and my brother got into this compettitive bidding war on ebay for concert tickets to a band we both used to like but now think is overrated. neither of us wants them anymore but we both already paid like $250 in non-refundable bids and now were stuck in this loop where backing out feels like loosing face. it feels different from just being dumb with money cause theres this weird pride thing going on. is there a philosophical reason people keep throwing cash at situations that are already lost, especially when theres someone else involved? my brother keeps calling it an 'all-pay auction' and saying rational people shouldn't enter them in the first place - is that actually a real concept or is he just being pretencious with big words?
