prompt: |-
  I'm in this course on biography and moral learning — we've been talking about Plutarch and how people used to learn virtue from lives, not just rules. I was arguing with my freind about whether hagiography actually teaches anything useful, since saints are too perfect to imitate, and then I went back to Plutarch's Life of Pericles (the old Clough translation, I think 19th century?). There's this bit near the end where Pericles is dying of the plague, lying there with his friends weeping around him, but he pulls himself together and tells them to remember his service to the city rather than mourn his death — and Plutarch adds that even in that moment he was thinking about the common good, not his own suffering. I'm having trouble seeing exactly what Plutarch wants us to take from that. Is it just that virtue holds up under pressure? Or is there something about the way he pairs Pericles with Fabius Maximus in the Roman parallel that changes the reading — like, Fabius also died in relative obscurity after saving Rome, so maybe the comparison is saying that real virtue isn't about glory but about endurance?

  Here's where I'm really stuck. I came across this idea of "contaminated exemplars" — figures whose moral record is clearly mixed with failure or disaster — and it seems like Pericles is exactly that, since he led Athens into the war and then died in the plague he couldn't stop. So is Plutarch giving us a contaminated exemplar on purpose, and if so, does that make him closer to hagiography (because he smooths over the failure) or further away (because he leaves the stain in)? I feel like I'm missing something about the synkrisis structure and how it's supposed to work for the reader. Can you help me understand the passage and where it sits between biography and hagiography?
reasoning: |-
  Okay, the user is deeply engaged with Plutarch's biography of Pericles and its moral implications. They're in a course on biography and moral learning, exploring how lives teach virtue differently than rules. Their specific struggle revolves around Pericles' death scene in Plutarch's text and whether such a figure can truly serve as an ethical exemplar given his political failures.

  The user raises several layered questions: First, they question what Plutarch intends readers to take from Pericles' dying moment where he prioritizes Athens' welfare over personal suffering. Second, they're curious about how pairing Pericles with Fabius Maximus affects this interpretation - particularly whether it emphasizes virtue as endurance over glory. Third, they've encountered the concept of "contaminated exemplars" and wonder if Pericles fits this category, leading to their core dilemma about whether Plutarch's approach leans toward hagiography (idealization) or critical biography (acknowledging flaws).

  The user's confusion seems rooted in three tensions: between individual virtue and collective consequences; between textual portrayal and historical reality; and between didactic purpose and historical accuracy. Their mention of arguing with a friend about hagiography suggests they're personally invested in whether flawed historical figures can effectively teach ethics.

  The user is clearly well-read - they reference Clough's 19th-century translation, synkrisis structure, and academic concepts like "contaminated exemplars." But they might be overcomplicating Plutarch's method. The key is recognizing that Plutarch operates as a moral psychologist rather than historian. His focus isn't on judging Pericles' political legacy but examining how character manifests in specific moments.

  The plague death scene serves multiple purposes: It demonstrates constancy (virtue persisting under duress), civic-mindedness (transcending personal suffering), and the "beautiful death" trope (shaping legacy through final actions). The Fabius comparison likely reinforces that true virtue operates irrespective of recognition - both leaders saved their cities through unpopular restraint, yet died without fanfare.

  Regarding "contamination": Plutarch absolutely presents Pericles as flawed. The Peloponnesian War failure hangs over the entire Life. But crucially, Plutarch separates character virtues from political outcomes. The moral lesson isn't "be like Pericles in all things" but "observe how even great men have constrained virtues - emulate their strength, learn from their failures." This distinguishes Plutarch from hagiography; saints' lives typically suppress flaws to model perfection, while Parallel Lives intentionally preserve tension between virtue and error to provoke active moral reasoning.

  The synkrisis structure is vital here. By juxtaposing Pericles and Fabius, Plutarch invites readers to compare how similar virtues (prudence, endurance) function in different contexts. The contamination becomes pedagogical - we see virtue isn't about flawless victory but consistent character. The user might find resolution by recognizing that for Plutarch, moral learning happens precisely through wrestling with these ambiguities, not receiving packaged lessons.
answer: |-
  Your questions cut to the heart of Plutarch's project and the tension between biography as moral instruction and hagiography. Let's break down the Pericles death scene, the Fabius comparison, and the concept of "contaminated exemplars":

  1.  **The Death Scene: What Plutarch Wants Us to See:**
      *   **Virtue Under Duress:** This is the most immediate lesson. Pericles' composure, self-forgetfulness, and focus on Athens ("the common good") while suffering horribly and facing death demonstrate that his virtue wasn't just for show in success; it was intrinsic and resilient. It proves the *reality* and *depth* of his character.
      *   **The "Beautiful Death" (Kalos Thanatos):** In Greek tradition, how one dies reveals the essence of one's character. Pericles' death is consciously presented as noble and exemplary. He transcends physical suffering and personal loss to deliver a final, public-spirited message. It's the culmination of his life's theme: prioritizing Athens above self.
      *   **The Power of Final Words:** Like Socrates' final moments, Pericles' words carry immense weight. They are his final testament, summarizing his core principle: service to the state is paramount. Plutarch highlights that *even then* he was thinking of Athens.
      *   **Legacy Over Lamentation:** He instructs his friends to focus on his achievements (his "service") rather than his suffering or death. This reinforces the biographical purpose: lives are lessons for the living, not just memorials for the dead.

  2.  **The Parallel with Fabius Maximus: Deepening the Reading:**
      *   **Shared Core Virtues:** Plutarch explicitly pairs them because they share similar virtues: **prudence (phronēsis), foresight (promētheia), steadfastness (karteria), and devotion to the state above personal glory or safety.** Both saved their cities by refusing to engage in rash battles favored by the populace (Fabius vs. Hannibal, Pericles' defensive strategy vs. Sparta).
      *   **The "Unrecognized Savior" Motif:** This is crucial. Both men endured unpopularity and suspicion while implementing their unpopular, life-saving strategies. Both were later vindicated, but crucially, **both died without the full-throated, lasting glory their service arguably deserved.**
          *   *Pericles:* Died of plague during the war he managed but couldn't prevent. His reputation was later tarnished by Athens' ultimate defeat (which Plutarch attributes to successors abandoning Pericles' strategy).
          *   *Fabius:* Died in relative obscurity (Plutarch notes his quiet death, contrasting it with Scipio's later triumph), his cautious strategy overshadowed by the more dramatic victories it enabled.
      *   **The Lesson: Virtue ≠ Popularity/Glory:** The synkrisis powerfully reinforces that true virtue, especially the civic virtue Plutarch most admires, often involves **endurance (karteria) against adversity, unpopularity, and ingratitude.** It's about doing what is right and necessary for the state, regardless of immediate reward or recognition. Their deaths underscore this: virtue's reward is internal and in the *quality* of the act itself, not necessarily in external glory. The comparison doesn't erase their flaws or failures in other areas, but it highlights this specific, shared core of endurance and selfless service against the odds.

  3.  **Pericles as "Contaminated Exemplar": Plutarch's Method vs. Hagiography:**
      *   **Yes, Pericles is Contaminated:** Absolutely. Plutarch *does not* shy away from this:
          *   He discusses Pericles' potential role in starting the war (though he presents mitigating arguments).
          *   He details the criticisms, suspicions (Aspasia, Phidias scandals), and unpopularity Pericles faced.
          *   He recounts the plague happening *during* Pericles' leadership and his own death by it.
          *   He explicitly links Athens' ultimate defeat to the *abandonment* of Pericles' strategy, implicitly acknowledging the limitations and potential flaws *within* that strategy or its execution.
      *   **Plutarch vs. Hagiography: The Crucial Difference:** This is where Plutarch fundamentally diverges from hagiography.
          *   **Hagiography:** Aims for **perfection and unattainable idealism.** Saints are flawless models whose lives demonstrate divine grace working through purity. Failures, moral ambiguities, or disastrous consequences are **smoothed over, erased, or spiritually reinterpreted.** The goal is pure inspiration and emulation of perfection. Saints are often *meant* to be beyond imitation in their totality.
          *   **Plutarch:** Uses **complex, flawed humans.** He presents the "contamination" – the failures, the disasters, the ambiguities. Pericles' virtues are real and admirable *despite* the flawed context and consequences. The moral lesson isn't "Be perfect like this saint," but rather:
              *   **Discernment:** Observe virtues *alongside* flaws and failures. Learn to distinguish the admirable quality (e.g., civic devotion, endurance under pressure) from the problematic context or outcome.
              *   **Realism:** Virtue exists in the messy world of politics, war, and human fallibility. Exemplars are human; their virtues are constrained, sometimes misapplied, and don't guarantee success.
              *   **Active Learning:** The reader must **grapple** with the complexity. Why did Pericles' prudence lead to war? Was his strategy truly sound if it led to plague-stricken siege and disaster? How can such endurance be cultivated? The "contamination" forces deeper reflection than a perfect model would.
              *   **Focus on Character Moments:** Plutarch often isolates *specific moments* or *qualities* (like the deathbed scene) as exemplary, even if the whole life or career is mixed. He shows virtue shining *within* the contamination.
      *   **Does Plutarch "Smooth Over"?** He does provide context and mitigating factors (e.g., blaming the war's outbreak on complex causes beyond Pericles, blaming Athens' defeat on his successors). However, **he leaves the stain visible.** The plague happened on his watch. He died from it. Athens lost the war he led them into. Plutarch doesn't erase these facts; he incorporates them into the narrative of Pericles' virtues and trials. The "smoothing" is interpretive framing, not factual omission.

  **The Synkrisis and Its Pedagogical Power:**

  The pairing with Fabius is central to Plutarch's method and directly addresses the "contamination" issue.

  1.  **Isolating the Virtue:** By finding a Roman figure who exemplified similar *core* virtues (prudence, endurance, selfless service) but in a different context, Plutarch isolates those virtues as valuable *in themselves*. He shows they transcend specific cultures or outcomes. Fabius didn't cause a plague, but he *also* died without the glory his service merited. The shared virtue shines through the different contaminations.
  2.  **Comparative Nuance:** The synkrisis allows Plutarch to subtly compare *how* these virtues manifested and were received. Was Pericles' unpopularity different from Fabius'? How did their strategies differ? This deepens the analysis beyond a single flawed life.
  3.  **Universality of the Struggle:** The pairing reinforces that the struggle for virtue against adversity, misunderstanding, and imperfect outcomes is a *universal human experience*, not unique to Pericles' flaws. Fabius, though "contaminated" differently (e.g., political maneuvering against Minucius/Scipio), faced similar core challenges to his virtue.

  **Conclusion & Your Core Question:**

  Plutarch is giving you a **deliberately contaminated exemplar**. This is the *antithesis* of hagiography's perfected saint.

  *   **Hagiography:** Offers untarnished, superhuman models for pure emulation/inspiration. The "stain" is removed.
  *   **Plutarch:** Offers complex, flawed humans from whom we extract specific virtues by **critical discernment**, learning *both* from their admirable qualities and their failures/misfortunes. The "stain" is integral to the lesson; it forces active engagement and teaches that virtue operates within, and often despite, messy reality.

  **What to take from Pericles' death scene, in light of the Fabius comparison and the contamination:**

  1.  **Virtue's Resilience:** True character (especially civic devotion) endures even the most extreme suffering and the approach of death.
  2.  **The Primacy of the Common Good:** The ultimate test of civic virtue is prioritizing the state above personal suffering and legacy management.
  3.  **Virtue ≠ Success:** Endurance, prudence, and selfless service are virtuous *in themselves*, regardless of ultimate outcomes (victory/defeat, glory/obscurity). The Fabius parallel hammers this home.
  4.  **Learning from Complexity:** Pericles' life teaches not just "be virtuous," but how virtues like prudence and endurance function under pressure, amidst political complexity, and despite causing or being engulfed by disaster. We learn *through* the contamination, not by ignoring it.

  You're not missing the synkrisis; you're grappling with its core purpose: to use the complex, flawed lives of great men (and the comparison between them) to provoke nuanced reflection on virtue in the real world, far removed from the simplified perfection of hagiography or abstract rules. Plutarch trusts his readers to do the hard work of extracting the gold from the ore.
