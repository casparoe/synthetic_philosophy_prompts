  For the framework itself, I'm considering building on Wimsatt's robustness analysis for the structural layer, while using Laudan's reticulated model to handle the foundational challenges. The trickiest part will be operationalizing the virtue/dogmatism distinction - perhaps borrowing from virtue epistemology's emphasis on intellectual courage versus rigidity.

