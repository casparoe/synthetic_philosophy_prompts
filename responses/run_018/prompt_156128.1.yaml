prompt: |-
  hey im not an academic, just someone who reads philosophy in my spare time, and i want to put together an exam for my study group (were mostly people without formal training). weve been going back and forth on whether reasons can exist if there are literally no minds anywhere—like, if every conscious being dissapeared tomorrow, would there still be a reason not to burn the last forest? i have this half-baked idea that reasons might not be mental states or social conventions but instead "counterfactual stability conditions"—basically patterns that stay intact only if certain things dont happen, regardless of whether anyone notices. i want one essay question that makes people wrestle with that specific framing: they have to say whether these stability conditions actually count as free-floating normative reasons, or if its just physics with fancy words. please write the exam prompt, a model answer of about 500 words, and a marking scheme. for the scheme, please use exactly five numbered items, each just a sentence or two, with no intro or conclusion. please dont include any citations or reading lists since we cant verify them, and keep the tone casual like this.
