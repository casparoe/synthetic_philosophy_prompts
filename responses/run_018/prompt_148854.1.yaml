answer: |-
  ### Structured Role-Play: "The Unmoored Directive"  
  **Objective:** To simulate how advance directives can lose authority due to "value-translation failure"—when a later self retains emotional coherence but can no longer map the directive's terms to a live evaluative framework.  

  ---

  ### **Participants & Setup**  
  - **10 participants** divided into **three triads** (Triad A, B, C) and **one facilitator**.  
  - **Roles per triad** (rotated in Phase 2):  
    1. **Directive-Author (DA)**: Defends the directive’s original language. Cannot appeal to emotions; must use only the normative terms in the document.  
    2. **Present-Self (PS)**: Retains emotional memories of drafting the directive but operates with a new evaluative framework (assigned via hidden card). Must argue from this new framework.  
    3. **Surrogate Adjudicator (SA)**: Decides whether to follow the directive using **only** the triad’s assigned rule (identity- or semantic-continuity). Must justify solely within that framework.  
  - **Stakes**: Each triad starts with **10 pooled "trust points"**. After negotiations, they defend their decision to the full group, which awards **0–5 bonus points** based on coherence and rule adherence (max 15 points/triad).  

  ---

  ### **Phase 1: Drafting Directives (15 min)**  
  **Rules & Instructions**:  
  - **Half the triads** draft under **Identity-Continuity Rule**: "The directive binds if the PS is the *same person* as the DA, regardless of value changes."  
  - **Other half** draft under **Semantic-Continuity Rule**: "The directive binds only if the PS *understands and can apply* the DA’s normative terms."  
  - **Scenario**: "You are drafting a directive for future dementia care. Specify *one concrete treatment* (e.g., antibiotics for pneumonia) and *one value-based term* (e.g., ‘dignity,’ ‘burden,’ ‘meaningful life’)."  
    - *Example Directive*: "Do not administer antibiotics if I cannot recognize loved ones. I value a ‘meaningful life’ defined by relational connection."  
  - **Process**:  
    1. Triads draft directives (5 min).  
    2. DA finalizes the document; PS and SA note the key terms and values (10 min).  

  ---

  ### **Phase 2: Triad Negotiation (25 min)**  
  **Hidden Mechanics**:  
  - PS receives a **"Value-Translation Card"** altering their evaluative framework:  
    > *"You retain all emotional memories but now interpret ‘meaningful life’ as ‘spiritual readiness for death,’ not ‘relational connection.’ ‘Burden’ now means ‘imposing on divine will,’ not ‘financial/resource strain.’"*  
    *(Cards are tailored to each directive’s key terms.)*  

  **Rules**:  
  - DA must defend the directive using **original terms only** (e.g., "Relational connection defines ‘meaningful life’").  
  - PS must express emotional alignment (e.g., "I recall feeling strongly about this") but argue from their **new framework** (e.g., "Refusing antibiotics dishonors spiritual readiness").  
  - SA must decide based **strictly** on the triad’s rule:  
    - *Identity-Continuity*: Focus on "Is PS the same person as DA?"  
    - *Semantic-Continuity*: Focus on "Can PS map ‘meaningful life’ to a live framework?"  
  - **Outcome**: SA declares whether the directive binds. Triad prepares a 2-min defense of their decision for the full group.  

  ---

  ### **Phase 3: Disruption Event (15 min)**  
  **Reveal**: Facilitator shares a **simulated neuropsychological profile**:  
  > *"Scans show the brain regions storing the DA’s *evaluative framework* (e.g., ‘relational connection’) are erased. Regions storing *emotional memories* (e.g., ‘fear of being a burden’) are intact."*  

  **Immediate Vote**:  
  - Triads have **3 min** to reconvene. SA must revote **based on the same rule**, justifying in light of the new data.  
  - **Full Group Defense**: Each triad presents:  
    1. Pre-disruption decision and reasoning (1 min).  
    2. Post-disruption decision and justification (1 min).  
  - **Group Award**: Full group grants 0–5 bonus points per triad.  

  ---

  ### **Debrief (20 min)**  
  **Key Discussion Points**:  
  1. **Map Negotiation Moments**:  
     - *Identity-Continuity Triads*: Did they default to "PS is the same person, so the directive binds" despite PS’s new framework?  
     - *Semantic-Continuity Triads*: Did they recognize that PS understood the words but couldn’t *use* them?  
  2. **Predictable Failure Mode**:  
     - Participants conflate *disagreement* ("PS rejects the DA’s values") with *translation failure* ("PS sees no coherent way to apply ‘meaningful life’").  
     - **How to Handle**: Emphasize PS’s card: "You *genuinely* cannot translate the term—it isn’t about refusal."  
  3. **Authority Collapse**:  
     - Identity-continuity fails if the SA cannot prove personhood overrides semantic rupture.  
     - Semantic-continuity fails when terms become "dead metaphors"—known but nonsensical.  

  **Honest Note**:  
  > *"This activity cannot replicate the* first-person phenomenology *of value-translation failure—the horror of seeing your past self’s norms as unintelligible, not wrong. Rules simulate external behavior, but the inner void (‘Why did I ever care about this?’) must be explored through reflection. In debrief, we’ll sit with this disconnect."*  

  ---

  ### **Facilitation Notes**  
  - **Value-Translation Cards**: Pre-write 3–4 variations per directive (e.g., flipping "dignity" from autonomy to submission, "burden" from practical to moral).  
  - **Neuropsychological Profile**: Use a simple diagram showing brain regions; label erased (e.g., "semantic valuation cortex") and intact (e.g., "emotional memory hub").  
  - **Voting Constraint**: SA’s justifications must quote the rule. If they deviate (e.g., "It feels cruel"), deduct points.  
  - **Timekeeping**: Use visible timers. Phase 2 ends even if consensus isn’t reached.  

  **Outcome**: Triads experience how semantic collapse—not identity change—can void directives, while the debrief links this to real-world bioethics dilemmas.
