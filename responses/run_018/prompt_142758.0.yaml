answer: |-
  **1. Exam Question (60 min, ~800 words):**  
  "Sphex wasps exhibit extreme behavioral rigidity: if their prey is moved during a burrow check, they restart the entire sequence without adaptation. This 'sphexishness' is often cited as a failure of free will. But consider **Sphex-7**, a hypothetical agent that performs the same rigid loop 99% of the time, *except* when ambient temperature hits exactly 30°C. At that precise trigger, it selects one of two hard-wired sub-routines (e.g., ‘seal burrow immediately’ or ‘abandon burrow’). The choice is binary, non-deliberative, and algorithmically predetermined.  

  In an essay, address:  
  - Why sphexishness is traditionally seen as incompatible with free will, focusing on **what’s settled** about its lack of flexibility (e.g., unresponsiveness to reasons, environmental changes).  
  - Whether Sphex-7’s ‘escape hatch’ reduces sphexishness or merely **relocates rigidity** (e.g., to the temperature sensor or sub-routine selector). Engage Frankfurt-style hierarchies of volition here—imagine even Sphex-7’s *second-order desires* (e.g., ‘I want to want to seal the burrow’) are sphexishly fixed.  
  - **Your defended view**: Can graded, narrow flexibility (like Sphex-7’s) ever suffice for moral agency? Or does free will require ‘open-ended’ responsiveness? Explicitly flag what’s **contested** (e.g., whether binary choice counts as reasons-responsiveness)."  

  ---

  **2. Model Answer (~750 words):**  
  **Settled Ground**: Sphexishness, named after the digger wasp, denotes *mechanical repetition without contextual adaptation*. The wasp’s loop (drag prey → check burrow → seal) restarts identically if prey is moved mid-process. Philosophers agree this demonstrates a **lack of behavioral flexibility**: no learning occurs, alternatives aren’t weighed, and environmental feedback (e.g., moved prey) is ignored. Crucially, the problem isn’t determinism *itself*—compatibilists accept determined actions can be free—but the **absence of reasons-responsiveness**. The sphex can’t adjust based on reasons (e.g., “the prey is gone, so sealing now wastes energy”). This inflexibility is why it’s seen as non-agential.  

  **Sphex-7’s ‘Escape Hatch’**: At 30°C, Sphex-7 selects between two sub-routines. Superficially, this seems less sphexish—it has a “choice.” But the trigger is environmental (temperature), not cognitive; the options are predetermined; and no evaluation occurs (e.g., it doesn’t “decide” sealing is better). Thus, rigidity is **relocated, not resolved**. The temperature sensor operates like a mechanical switch, and the sub-routine selector is another fixed algorithm. This mirrors a key debate: adding conditional branches to deterministic systems doesn’t guarantee agency. If Sphex-7 had a Frankfurt-style hierarchy (e.g., a second-order desire to “prefer sealing when hot”), but *that meta-desire was itself hard-wired*, the hierarchy would just be a nested sphex-loop. Here, the **contested issue** arises: compatibilists might argue hierarchical integration *is* sufficient for minimal agency, while critics insist true freedom requires higher-order volitions to be revisable, not sphexish.  

  **Graded Flexibility and Moral Agency**: I argue Sphex-7’s narrow flexibility fails to confer moral agency. While it deviates from its core loop under one condition, this “freedom” is **binary, closed, and non-responsive to reasons**. Moral agency typically demands that agents can recognize and act on normative considerations (e.g., “abandoning the burrow harms larvae, so I shouldn’t”). Sphex-7’s temperature-triggered switch responds to a physical cue, not a reason. Even if we grant it “choice” in a thin sense (two options), it lacks **open-endedness**—the capacity to generate novel responses or re-evaluate goals. That said, this is hotly **contested**. Some compatibilists might claim *any* flexibility (like binary branching) suffices for proto-agency if it aligns with stable desires. Others (like me) contend that without reasons-responsive *openness*, graded flexibility merely creates “cages with more rooms.”  

  ---

  **3. Marking Scheme (20 marks total):**  
  1. **Defines sphexishness’s settled flaws** (4 marks):  
     - *Must-hit*: Rigidity ≠ determinism; highlights unresponsiveness to environment/reasons.  
     - *Common error*: Conflates sphexishness with determinism broadly.  

  2. **Analyzes Sphex-7’s ‘escape hatch’** (5 marks):  
     - *Must-hit*: Argues rigidity is relocated (e.g., to trigger/sub-routines), not eliminated.  
     - *Common error*: Asserts “two options = free will” without probing the mechanism.  

  3. **Applies Frankfurt hierarchies to sphexish volitions** (5 marks):  
     - *Must-hit*: Shows fixed second-order desires don’t resolve rigidity (just add layers).  
     - *Common error*: Describes Frankfurt’s theory but doesn’t apply it to mechanical volitions.  

  4. **Separates settled vs. contested claims** (3 marks):  
     - *Must-hit*: Notes settled inflexibility of sphex; flags graded flexibility/hierarchies as contested.  
     - *Common error*: Presents personal view (e.g., “binary choice isn’t free”) as consensus.  

  5. **Defends position on graded flexibility** (3 marks):  
     - *Must-hit*: Takes clear stance (e.g., “open-endedness required”) with reasoning.  
     - *Common error*: Vague conclusion (e.g., “it’s ambiguous”) without argument.  

