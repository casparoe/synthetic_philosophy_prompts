  I need to create a realistic scenario that fits their specifications. The practice must be harmful and longstanding, with moral arguments against it well-known but ineffective. Material interests must remain unchanged for all parties - workers, management, and clients. No regulators intervene, and no one gains financially by quitting. The collapse must be triggered solely by an honor/shame mechanism where the practice becomes seen as backward or undignified.

