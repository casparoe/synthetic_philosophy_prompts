answer: |-
  **Scenario:** For decades, TechFlow Inc. mandated weekly "Team Synergy Karaoke Nights" – unpaid, off-the-clock events where participation (especially enthusiastic singing by juniors for senior managers) was an unwritten prerequisite for promotion consideration. Moral arguments about unpaid labour, work-life boundaries, and coerced fun were well-aired but dismissed as "not understanding the culture." Materially, nothing changed: promotions still happened at the same rate, salaries stayed flat, clients remained unaffected, and no regulations intervened. The collapse came abruptly when a globally revered, ultra-hip founder/CEO of a rival firm gave a viral interview mocking such forced jollity as "desperate pandering by talentless middle-managers terrified of actual leadership." Overnight, continuing karaoke night became a glaring signal that a manager lacked modern leadership dignity and was embarrassingly out-of-touch. Managers scrambled to cancel future events, publicly reframing past ones as "regrettable relics," and promotion criteria shifted silently but completely away from participation.

  **Analysis:**  
  *   **Argument-based:** Predicts gradual erosion as reasoning persuades. Fails because known arguments existed for years with zero effect; collapse was sudden, not reasoned.
  *   **Interest-based:** Predicts change only if costs/benefits shift (e.g., lawsuits, productivity loss). Fails because no material interests changed for any party.
  *   **Honour-based:** Correctly predicts sudden collapse driven by a flipped **status signal**: association with the practice shifted from "loyal team player" to "backward, talentless manager" after the high-status denunciation. People distanced themselves to avoid the shame of being seen as uncool and lacking leadership dignity.  
  **Crucial Feature:** The specific status signal was the **association with outdated, insecure management** triggered by the high-status mockery. Remove this mocking intervention by a credible tastemaker, and the collapse doesn't happen; the practice persists despite arguments and unchanged interests, leaving argument or interest theories as plausible explanations for its *continued* existence. An argument-based defender might dismiss this by claiming the moral arguments had finally "reached critical mass," ignoring the lack of new reasoning and the precise trigger.
