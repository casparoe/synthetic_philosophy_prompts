  Formal arguments involve Arrow's theorem. It shows that with three or more options, no voting system can satisfy all fairness criteria without dictatorship. This implies inherent conflicts in aggregating preferences, which could extend to individual value conflicts. That's a theoretical challenge. Also, topological impossibility theorems suggest that some choice spaces can't be ordered continuously, which might mean hidden dimensions can't resolve discontinuities. This could force abandoning the framework.

  Phenomenological reports are trickier. Radical value shifts, like in religious conversions, where old values are rejected entirely. If a dimension existed, it should be reconstructable, but the person might see their past self as fundamentally different. Cross-cultural disagreements, like honor vs. harm, where each side can't understand the other's values. If hidden dimensions were the answer, we'd expect convergence, but deep divides persist, suggesting true incommensurability.

  Concrete cases like Sophie's Choice—choosing which child to save. Even with all dimensions explicit, the anguish remains. If reconstruction can't resolve the conflict here, it's a strong counterexample. The user needs to see if this is fatal or just a local exception.

