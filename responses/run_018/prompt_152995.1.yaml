  Im a novelist working on a fictional legal system that eats its own tail, and Im applying for a small six-month interdisciplinary grant. I need a two-page research proposal that sounds like real philosophy but doesnt ask me to cite stuff I cant verify without internet. The half-baked idea: legal philosophers treat self-amending rules as either straight-up paradoxical—the classic amendment-clause loop—or totally manageable, just another procedural step. But I think theres a hidden middle ground, call it procedural ghosting, where a rule isnt technically contradictory yet becomes practically unamendable because every possible amendment violates the legitimacy conditions the rule itself established for future changes.

  Write the proposal with a precise statement of the question, why existing positions leave it open, the actual method month by month, what success looks like versus failure, and a realistic scope. The question should ask whether we can formally separate (a) genuine logical paradox in legal self-reference, (b) practical deadlock from nested legitimacy conditions—this ghosting thing—and (c) plain old political resistance. I want to know if ghosting is a real structural feature or just a framing glitch.

  Why its open: people handling self-reference usually come at it through formal logic or through constitutional theory that treats amendment rules as power-conferring norms. The middle space where the logic is consistent but the dynamics freeze gets ignored, because everyone assumes no contradiction means a path forward. I think thats wrong.

  Approach: months 1-2 build a stripped-down formal model tracking legitimacy conditions across recursive amendment steps—no full legal logic needed, just enough structure to map the loops. Months 3-4 apply it to three stylized constitutional architectures (strict hierarchical, flat recursive, mixed threshold) without claiming they mirror real-world texts exactly. Month 5 identify the exact conditions for procedural ghosting and check whether they depend on hidden continuity assumptions about authority. Month 6 draft the deliverable: a conceptual map with clear failure conditions. If every ghost case collapses into either hidden contradiction or mere politics, the project fails. Success means isolating at least one non-paradoxical, non-political structure that genuinely freezes amendment.

  Keep it casual, like Im pitching a foundation that funds weird cross-disciplinary work. No bibliography or reading list, Ill fill citations myself. And please dont ask me to quote specific texts verbatim—paraphrase anything you need. Theres definately room for a typo since Im writing this on my phone.
