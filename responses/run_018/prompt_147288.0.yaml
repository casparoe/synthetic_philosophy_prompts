answer: |-
  ### Requirements for a Normative Theory of Public Commemoration

  **1. Commemoration-Documentation Distinction**  
     - **Desideratum**: The theory must differentiate between *commemoration* (honoring/endorsing a subject) and *documentation/pedagogy* (neutrally informing about history).  
     - **Motivating Case**: A plaque marking a site of historical injustice (documentary) vs. a statue celebrating a colonizer (commemorative). Failure to distinguish risks conflating removal of harmful veneration with erasure of history.  
     - **Status**: Non-negotiable. Essential for precision in evaluating moral claims.  
     - **Conflict Potential**: None evident with other requirements.  

  **2. Spatial Distribution Sensitivity**  
     - **Desideratum**: The theory must explain why altering a centralized monument (e.g., a city-square statue) differs morally/practically from altering distributed markers (e.g., residential street names).  
     - **Motivating Case**: Removing a single Robert E. Lee statue vs. renaming dozens of streets honoring minor Confederates. Centralized monuments are deliberate, high-visibility acts of valorization; distributed names form a diffuse commemorative landscape where individual impact is diluted.  
     - **Status**: Non-negotiable. Addresses scale, symbolic weight, and feasibility.  
     - **Conflict Potential**: May tensionally interact with *replacement* (see below) when distributed changes necessitate resource-intensive substitutions.  

  **3. Replacement Problem Resolution**  
     - **Desideratum**: The theory must prescribe whether removal obligates:  
       (a) Substituting a new honoree,  
       (b) Preserving deliberate absence, or  
       (c) Reconceptualizing the site (e.g., functional repurposing).  
     - **Motivating Case**: Post-Rhodes Must Fall, should Cecil Rhodes’ plinth hold a new figure, remain empty, or become a community art space? Tests commemoration’s continuity and the site’s ongoing civic role.  
     - **Status**: Non-negotiable. Confronts the void left by removal.  
     - **Conflict Potential**: Jointly unsatisfiable with *spatial distribution* if substitution is mandated for dispersed names (impractical) but not for monuments (arbitrary).  

  ---

  ### Assessment of Major Positions

  **Preservationism**  
  - **Success**: Implicitly respects *spatial distribution* by treating all commemorations as equivalently sacrosanct.  
  - **Failure**: Collapses *commemoration/documentation distinction* (defends all markers as "history"). Ignores *replacement problem* (assumes permanence).  

  **Contextualism (add plaques, reinterpret)**  
  - **Success**: Upholds *commemoration/documentation distinction* by converting commemorations into documented artifacts.  
  - **Failure**: Inadequate for *spatial distribution* (adding context to 100 streets is infeasible; contextualizing a statue may not neutralize its dominance). Evades *replacement problem* (assumes context suffices; silent on removal's aftermath).  

  **Removalism**  
  - **Success**: Acknowledges *commemoration/documentation distinction* (targets honorific intent). Addresses *replacement problem* (mandates removal but often neglects post-removal obligations).  
  - **Failure**: Collapses *spatial distribution* by treating centralized and diffuse commemorations identically. Risks ignoring logistical/moral differences in erasure at scale.  

  ---

  **Summary**: No existing position satisfies all criteria. Preservationism ignores commemoration's normative core; Contextualism overestimates reinterpretation's efficacy; Removalism lacks nuance for spatial scales. A viable theory must integrate these dimensions without reductionism.
