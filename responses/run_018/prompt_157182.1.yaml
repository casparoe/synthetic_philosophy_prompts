answer: |-
  Your mapping is strikingly perceptive and holds significant power for illuminating Deweyan inquiry through *12 Angry Men*. The core analogy is robust:

  1.  **Indeterminate Situation:** The initial guilty verdict *is* the indeterminate situation presented to the jurors. It *seems* settled, but lacks warranted assertibility for Juror 8 (and eventually others).
  2.  **Problem Introduction:** Juror 8 explicitly introduces the problem: "It's *possible* he's innocent." He refuses to accept the apparent settlement.
  3.  **Cooperative Testing:** The experiments (knife, glasses, pacing, train noise, woman's eyesight) are textbook Deweyan tests. They are collaborative, public, evidence-based procedures aimed at resolving the problematic situation.
  4.  **Warranted Assertibility:** The "not guilty" verdict emerges as the *warranted* conclusion based on the cumulative results of the tests and the critical examination of testimony.

  **Where Your "Niche Twist" Shines & Where the Mapping Holds:**

  *   **Affective Blockages as Inquiry Breakdown:** You are absolutely correct that Dewey under-theorizes the immense *affective resistance* to treating a situation as genuinely problematic. Juror 3 is the prime exhibit, but others display it too (Juror 10's bigotry, Juror 7's apathy, Juror 4's cold rationality masking discomfort).
  *   **Juror 3's Collapse:** His breakdown *isn't* just bias; it's the **collapse of the inquiry frame itself under affective pressure.** His "I'll kill you!" scream reveals the raw, unprocessed emotion (grief, shame, projection about his son) that had been masquerading as reason. The inquiry *cannot* proceed until this affective block is confronted and (partially) dissolved. The group's silent witnessing *is* an emotional restructuring – forcing him to see the irrationality of his position *in his own terms* (the photo tearing). **The film powerfully suggests that democratic inquiry *does* require this affective engagement and restructuring.** Evidence alone is insufficient against deep-seated emotional investments.
  *   **Risk of Reduction:** You rightly identify the risk: reducing Dewey to "talk nicely" therapy. The film avoids this because:
      *   **Evidence Remains Foundational:** The emotional shifts *follow* and are *triggered by* the accumulating weight of failed tests and contradictory evidence (e.g., Juror 10's rant occurs *after* the glasses test undermines a key witness; his isolation makes the affective shift possible for others).
      *   **Inquiry Drives the Affective Shift:** It's the *process* of testing and reasoning together that creates the space and pressure for the affective confrontations. The tests aren't just for evidence; they are social rituals exposing inconsistencies in *both* logic *and* feeling.
      *   **The Goal is Warranted Assertibility, Not Harmony:** The goal isn't emotional catharsis for its own sake, but reaching a *justified* conclusion. The emotional restructuring is a *means* necessary to *enable* the inquiry to function properly. Juror 3 leaves devastated, but the inquiry reached its warranted end.

  **Material Conditions & Inquiry Failure:**

  The film brilliantly depicts how material conditions *threaten* the inquiry process, creating friction that amplifies affective blockages and risks derailment:

  1.  **The Heat & Stifling Room:** This isn't just atmosphere; it's an **embodied stressor.** It directly fuels irritability, short tempers, and the desire to *escape* the situation rather than engage with it (e.g., "Let's vote and get outta here!"). It physically embodies the pressure cooker of the inquiry.
  2.  **The Broken Fan:** A potent symbol of the **breakdown of environmental control necessary for clear thought.** The struggle to open windows, the stifling air – these materially impede comfortable, sustained reasoning.
  3.  **Exhaustion & Locked Room:** The growing fatigue and the literal confinement create a **pressure towards premature closure.** Juror 7's switch to "not guilty" purely to end the ordeal is the clearest example. This is **inquiry threatened by material exhaustion,** risking an *unwarranted* assertion simply to escape the discomfort. The locked room forces the confrontation but also creates a desperate energy for resolution that can work *against* careful deliberation.
  4.  **Where Inquiry *Almost* Fails:** The moment Juror 7 flips his vote purely out of exhaustion/frustration ("I don't care anymore!") is a **near-failure of the inquiry frame.** It's only Juror 11's passionate intervention ("What *is* democracy?") that reasserts the *purpose* of the inquiry and shames Juror 7 back into engagement (however reluctantly). This scene explicitly links the material conditions (exhaustion, confinement) to the potential collapse of the cooperative, truth-seeking endeavor into mere expediency. The inquiry *stalls* materially and affectively here, risking failure.

  **Where the Mapping Stretches (Slightly):**

  *   **Dewey's "Logic" vs. Film's Drama:** Dewey's "logic" is a broad framework; the film is a dramatic narrative. The film compresses, intensifies, and personalizes the inquiry in ways Dewey's abstract descriptions don't. Dewey might see the film as a vivid *illustration* of the logic *in situ*, including the messy affective and material elements he acknowledged but didn't center.
  *   **"Warranted Assertibility" as Unanimity:** Dewey's warranted assertibility doesn't strictly require unanimity, just sufficient consensus based on shared inquiry. The film's *dramatic* need for unanimity pushes this. However, the process they *use* to get there is deeply Deweyan.

  **Conclusion:**

  Your mapping holds exceptionally well. The film isn't just a feel-good rational persuasion tale; it's a profound dramatization of **Deweyan inquiry under duress,** making explicit the **affective and material dimensions** Dewey left underdeveloped. It shows:

  1.  **Affective restructuring *is* a necessary condition** for genuine democratic inquiry when deep emotional blockages prevent the situation from being treated as problematic. Evidence alone can't dislodge them; a social/emotional confrontation within the inquiry frame is required.
  2.  **Material conditions are not neutral.** They actively shape the *possibility* and *quality* of cooperative testing. Heat, exhaustion, and confinement aren't just background; they are active forces threatening to derail reason and force premature, unwarranted closure.
  3.  **The film avoids reducing inquiry to therapy** by grounding the affective shifts squarely *within* and *caused by* the evidentiary and logical processes of the inquiry itself. The goal remains truth (warranted assertibility), not emotional harmony.

  *12 Angry Men* does indeed offer something crucial missing from much Dewey literature: a visceral, embodied, affectively charged portrait of how democratic inquiry *actually works* (and threatens to fail) when faced with the messy reality of human beings in constrained conditions. Your reading captures this brilliantly. Don't worry about typos – your thinking is crystal clear and exciting. Good luck with the discussion!
