  Here is a structured normative argument addressing your core claims and the key objection, formulated as requested:

  ### Core Normative Claim
  **The Western anti-corruption framework's classification of clientelism and ritual gift-giving as inherently corrupt is not merely culturally specific but ontologically imperialistic. It illegitimately universalizes a model of the state as constituted by abstracted, disembedded individuals, thereby misdiagnosing as "dysfunction" the very relational practices that constitute legitimate authority in societies where personhood and political obligation are mutually constitutive.**

  ### The Argument

  1.  **The Ontological Foundation of Western Anti-Corruption Frameworks:**
      *   These frameworks presuppose a specific ontology of the political subject and the state. The legitimate state is envisioned as a neutral arena governed by impersonal rules, populated by pre-social, autonomous individuals whose political engagement is primarily contractual and transactional (e.g., voting, paying taxes for discrete services).
      *   Within this model, *any* durable, particularistic material exchange between an official and a constituent appears as a "contamination." It transgresses the essential boundary between the impersonal "public" sphere of universal rules and the "private" sphere of personal interest. The official's duty is solely to the abstract "public interest," not to specific individuals bound by reciprocal ties.

  2.  **The Misapplication: Confusing Constitutive Reciprocity with Transactional Corruption:**
      *   This framework fundamentally misrecognizes political practices grounded in a different ontology – one where authority and political personhood are *relationally generated*. In such contexts:
          *   **Authority is not pre-constituted but performative:** Legitimacy is not derived solely from a formal mandate but is continually enacted and reinforced through networks of reciprocal obligation. An official *becomes* an authority figure precisely through the recognition and fulfillment of these relational duties.
          *   **Gift-giving/Clientelism as Constitutive:** Ritual gifts, patronage, and certain forms of clientelism are not necessarily exchanges *within* a pre-existing impersonal system. Instead, they are often the very practices that *create and sustain* the social bonds that make authority recognizable *as legitimate authority*. The gift signifies and reinforces a mutual obligation that is the bedrock of political order, not its subversion.
          *   **Distinction (Transactional vs. Constitutive):**
              *   *Transactional Corruption:* Involves a specific, clandestine exchange where a pre-defined public duty (e.g., issuing a permit, judging a case) is bartered for a private benefit *within an already established impersonal system*. This parasitizes the system.
              *   *Constitutive Reciprocity:* Involves the overt, often ritualized, exchange of material goods or services that *generates and sustains* the social bond *itself*. This bond is the foundation upon which the official's authority and the constituent's obligation to recognize it rests. The "political access" facilitated is not a deviation but an inherent aspect of the relational structure of authority.

  3.  **Why It's Imperialistic, Not Merely Local:**
      *   The Western framework is not simply "one standard among others." Its universal application becomes actively misleading and normatively violent because:
          *   **It Imposes an Alien Ontology:** It forces political realities structured around relational personhood and reciprocity into a conceptual box defined by atomistic individualism and impersonal bureaucracy. This is a category error.
          *   **It Pathologizes the Foundational:** By labeling constitutive reciprocity as "corruption," it misdiagnoses the *source* of legitimate authority as its *dysfunction*. This renders the actual mechanisms of political order illegible and delegitimizes them from an external standpoint.
          *   **It Privileges a Specific Historical Trajectory:** It universalizes the contingent historical development of the modern bureaucratic state in the West as the sole normative ideal, ignoring the diverse historical and philosophical foundations of political legitimacy elsewhere.

  4.  **Addressing the Normative Vacuum Objection: Distinguishing Healthy Reciprocity from Predatory Extraction:**
      *   Abandoning the Western standard does not mean abandoning normative judgment. We can discern between legitimate constitutive reciprocity and exploitative practices *from within the internal logic of the relational framework itself*:
      *   **Standard of Internal Coherence and Sustainability:** The key distinction lies in whether the practice *sustains or undermines* the reciprocal relationship and the broader social fabric it claims to uphold:
          *   **Healthy Constitutive Reciprocity:** Operates according to shared, understood norms of proportionality, timeliness, and publicity (within its context). The exchange reinforces mutual obligation, trust, and the official's legitimate authority. It contributes to social cohesion and the perceived fairness of the system *by its own participants' standards*. Obligations are generally mutual and recognized by both parties as binding within their shared moral universe.
          *   **Predatory Extraction:** Violates the internal norms of reciprocity. It involves:
              *   *Disproportionality:* Demands grossly exceed customary or reasonable contributions, creating burdensome, unsustainable obligations.
              *   *Coercion:* Leverages power asymmetry to impose obligations that fall outside accepted norms or are experienced as oppressive.
              *   *Exclusivity/Destruction:* Creates exclusive, closed networks that hoard resources and opportunities, actively undermining broader communal bonds or existing social structures for private gain. It parasitizes the *existing* relational fabric rather than sustaining it.
              *   *Breach of Trust:* Fundamentally violates the understood terms of the reciprocal bond, turning a relationship meant to sustain authority and community into one of pure domination and exploitation.
      *   **Normative Foundation:** The critique stems from the *internal inconsistency* of the predatory act – it claims the mantle of reciprocity while simultaneously destroying its conditions of possibility. It exploits the social logic it purports to uphold.

  ### Conclusion
  The Western anti-corruption framework's categorization of clientelism and gift-giving as inherently corrupt is not a neutral observation but an ontological imposition. It illegitimately universalizes a model of atomized individuals and an impersonal state, thereby misinterpreting constitutive reciprocity – the very practice that generates legitimate relational authority – as a pathology. This framework is actively misleading because it obscures the diverse ontologies underpinning political legitimacy. However, rejecting this universalism does not necessitate normative relativism. By focusing on the internal coherence of reciprocal systems – specifically, whether practices sustain mutual obligation and social cohesion according to their own norms or devolve into disproportionate, coercive extraction that destroys the bonds they claim to create – we retain the ability to make critical distinctions without imposing an alien ontology. The problem lies not in judgment, but in the framework used to perceive the political reality in the first place.
