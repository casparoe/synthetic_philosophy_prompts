answer: |-
  Here’s a streamlined 45-minute teaching arc designed for tech journalists, focused on spotting Whig history in AI narratives — cutting fluff and targeting misconceptions:

  **Core Teaching Sequence (45m Total):**  
  *(Timings are strict; skip Q&A until the end)*  

  1.  **Hook & Core Idea (5m):**  
      **Land First:** "Progress ≠ Inevitability."  
      *Frame:* "We instinctively map the past as a straight line to *our* present. Whig history distorts by framing past events solely as necessary steps leading to *our* current values/knowledge, erasing dead ends, alternatives, and context."  
      *Key Prompt:* "When you read 'X led inevitably to Y,' alarm bells should ring."

  2.  **The Critical Misconception & Head-Off (5m - Immediately after Core Idea):**  
      **Misconception:** "If there was *real* progress, it can't be Whig history."  
      **Head-Off:** "Whig history isn't about denying progress exists. It's about **imposing *our* teleology** (end-goal) onto the past. It cherry-picks ideas/figures that *seem* to point to *us*, ignores those that don't, and judges the past solely by how well it 'prefigured' the present. Progress happens, but its path is messy, contested, and non-linear."  
      *Example Tease:* "Let's see how this distorts a field you know..."

  3.  **Carrying Example: Cybernetics → "Just Early AI" (15m):**  
      *   **What Cybernetics Actually Was (1940s-50s):** A transdisciplinary science of *control and communication* in animals, machines, and organizations (Wiener, Ashby, Bateson). Focused on feedback loops, homeostasis, adaptation, biology-machine analogies. **NOT** primarily about creating artificial minds.  
      *   **The Whig Rewrite:** Retroactively framed *only* as a "precursor to AI." Key figures like Wiener simplified into "AI pioneers." Rich ideas about biology, society, and ecology sidelined. Failures/limitations ignored. The messy, diverse field is flattened into a single stepping stone on the "inevitable" path to LLMs/AGI.  
      *   **Why it's Whig:** Imposes *today's* AI-centric view. Judges cybernetics *only* by its perceived contribution to modern AI, not its own goals, context, or other legacies (e.g., systems theory, ecology, human-computer interaction). Dead ends (like specific failed models) vanish.  
      *   **Visual:** Show two slides: One showing the complex web of cybernetics influences (bio, eng, soc, phil), another showing the oversimplified "Cybernetics -> Symbolic AI -> ML -> Deep Learning -> AGI" arrow. Contrast is stark.

  4.  **Spotting Practice: Fake Headline Diagnosis (10m):**  
      **Headline:** *"Wiener's Ghost: How 1950s Cyberneticists Foresaw the LLM Revolution"*  
      **Diagnosis Questions (Ask Them):**  
      1.  What present value/knowledge (LLMs) is being projected backwards?  
      2.  What is framed as "foreseen" or inevitable?  
      3.  What complexities of actual cybernetics (its goals, breadth, dead ends) are erased?  
      4.  How does the headline judge the past *only* by its link to the present?  
      *This cements recognition.*

  5.  **Application to AI Origin Stories (5m):**  
      *   "Apply this lens to narratives you encounter: 'The Dartmouth Workshop *inevitably* led to Deep Learning.' 'Symbolic AI was *just a step* towards neural nets.' '*All* early thinkers were aiming for AGI.'"  
      *   "Look for: Erasure of alternatives (e.g., CYC, GOFAI critiques), flattening of diverse motivations, ignoring socio-political contexts (e.g., funding shifts, cold war), judging past work *only* by modern benchmarks."

  6.  **Wrap-up & Key Takeaway (5m):**  
      *   "**Whig history = Presentism + Teleology + Cherry-Picking.**"  
      *   "Your Antidote: Ask 'What were *their* goals/context? What paths *didn't* get taken? What ideas got lost? How is this narrative serving the *present* speaker?'"  
      *   "Use it to spot oversimplification in AI hype *and* criticism."

  **What to FLAT-OUT SKIP (No Time!):**  
  *   Detailed historiography debates.  
  *   The *original* British Whig history example (you ruled it out).  
  *   Other historical examples (e.g., Galileo, Darwin debates).  
  *   Deep philosophical dive on "progress."  
  *   Extensive participant sharing *during* core content (save for headline diagnosis).  
  *   Nuances between Whig history, Presentism, and Technological Determinism (hint they're cousins, but don't define each).

  **Why This Works for Journalists:**  
  *   Starts with their **core need** (spotting narrative distortion).  
  *   Uses a **highly relevant, non-standard example** they'll recognize.  
  *   **Pre-empts the major misconception** (progress vs. inevitability) *early*.  
  *   **Practical diagnosis** (fake headline) builds confidence.  
  *   **Directly applicable** to their beat (AI origin stories).  
  *   **Strict timing** forces focus on the actionable essence.

  **Final Tip:** Start cold with the fake headline *before* any explanation. Ask "What feels off about this narrative?" Then reveal it's a perfect Whig example *after* you've taught the concept. The "aha!" moment is powerful. Good luck!
