  Here's the joke, framed as you requested:

  Professor Thaddeus Von Sprocket stood before the court, jabbing a quill at the map. "Your Majesty! Observe the Grand Canal! *My* strategy hinges entirely on Emperor Zog's breakfast whims! One undercooked kumquat, one flash of imperial pique tomorrow morning, and this canal diverts *here*! It reshapes trade, topples dynasties! History turns on such moments!"  

  Dr. Elara Stone, the geohistorian, sighed from the back. "Professor, with respect, Zog's kumquat is a surface tremor. The *real* architect here is the Glacial Grumble, 200 miles north. It retreats a foot per century, feeding the River Sloth, whose silt deposits..."  

  "Silts and sediments, Dr. Stone?!" Sprocket scoffed. "Pah! We speak of emperors! Of decisions! Of *agency*! Zog *is* the current, the..."  

  ***CRRRRAAAAACKOOOOOMMMMM!***  

  A sound like the sky splitting echoed distantly. Dust shivered from the rafters. Moments later, a mud-splattered messenger burst in, gasping.  

  "Your Majesty! Terrible news! The Glacial Grumble... it just calved an entire mountainside into Lake Stillwater! The flood surge raced down the Sloth... it's... it's completely buried the headwaters of the Grand Canal project! Under eighty feet of glacial till and meltwater!"  

  Silence. Emperor Zog slowly lowered his kumquat.  

  Dr. Stone adjusted her spectacles, peering at a parchment charting millennial ice movements. "As I was saying... approximately *this* century's contribution. Right on schedule." She glanced at the map of the vanished canal headwaters, then at Professor Sprocket, now frozen mid-quill-jab. "Deep currents, Professor. The *longue durée* gets the final word. Usually delivered by several million tons of ice and rock."
