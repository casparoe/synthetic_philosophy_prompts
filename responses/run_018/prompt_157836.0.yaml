  Right. The Red Lion's last orders debate was getting properly philosophical. James was vibrating near the taps, Clifford looked like he'd licked a battery.  

  "Look," James jabbed a finger at the indifferent barman wiping glasses. "He hasn't *said* 'time', hasn't rung the bell! It's a *live* option – we desperately *need* another pint! It's forced – now or never! And utterly momentous for our parched throats! My passional nature *demands* I believe we can order! Faith is justified here, Cliff!"

  Clifford sighed, adjusting his spectacles. "James, you sentimental fool. No evidential bloody warrant whatsoever. The carpet's getting sticky, the lights are brighter, that bloke just got refused a top-up. Believing against the evidence isn't just wrong, it's *immoral*. Like intellectual theft. We must *dis*believe until proven otherwise."

  Barney, nursing a warm stout, piped up. "Chaps, chaps! Ever heard of **doxastic escrow**? Instead of you, James, fully betting the farm it's open, or you, Cliff, committing to it being shut... why not just park the *possibility* it's open in a sort of... provisional holding pen? Like a belief deposit. We act *as if* it *might* be, just for now, without fully adopting the conviction?"

  James scoffed. "Escrow? Sounds like hedging! Where's the *passional investment*? The *vital* commitment? This demands full belief!"

  Clifford looked horrified. "Provisional holding? Barney, that's just *delayed fraud*! Parking an unwarranted belief is still possessing an unwarranted belief! The ethics are breached the moment you entertain it without proof! It's intellectual embezzlement!"

  Barney opened his mouth to argue for the beauty of suspended metaphysical judgement...  

  **"TIME GENTLEMEN, PLEASE! YOU'VE HAD YOUR ESCROW!"** bellowed the barman, slamming the till shut. "Shift your arses, philosophers. Pub's shut. Belief settled."

  James glared at Clifford. "See? Passion *knew*!"  
  Clifford glared back. "Evidence *confirmed*! And your 'escrow' was just weak-willed prevarication, Barney."  
  Barney sighed, eyeing the leftover spotted dick. "Just wanted a bloody pudding."  

