answer: |-
  ### Diagnostic Decision-Tree Taxonomy for the Paradox of Deontology in Distributed Agency  
  **Root Question:** Do deontological constraints (e.g., prohibitions against rights violations) apply identically to collective entities as they do to individual agents?  

  #### **Branch 1: Yes** (Constraints apply identically—collectives are moral agents like individuals)  
  - **Diagnostic Scenario 1 (Q1):** Does an individual contributor to a distributed system (e.g., a programmer writing one module in a harmful AI) bear **direct moral culpability** comparable to an individual who directly perpetrates the same harm?  
    - **Yes**:  
      - *Leaf 1: **Strong Corporate Agency with Individual Culpability*** (Unnamed)  
        - **Resolution**: Collective entities are full moral agents subject to identical deontological constraints. Individuals bear direct, undiluted blame for their contributions, as if they directly caused the harm.  
        - **Awkward Commitment**: A programmer writing a benign subroutine bears the same culpability as a dictator ordering genocide, creating absurd over-attribution of blame for trivial contributions.  
    - **No**:  
      - *Leaf 2: **Pure Corporate Agency*** (e.g., French 1984)  
        - **Resolution**: Collectives are distinct moral agents with identical constraints, but individuals are mere "cogs" with no direct culpability for collective harm. Culpability rests solely with the collective entity.  
        - **Awkward Commitment**: Citizens voting for rights-violating policies or engineers in harmful supply chains are **blameless**; only abstract entities (e.g., "the corporation" or "the state") are culpable, making blame practically unenforceable.  

  #### **Branch 2: No** (Constraints do **not** apply identically—collectives are morally distinct)  
  - **Diagnostic Scenario 2 (Q2):** Do deontological constraints apply to collective entities **at all** (even if non-identically)?  
    - **Yes** (Constraints apply non-identically—e.g., weaker or transformed):  
      - **Diagnostic Scenario 1 (Q1):** Does an individual contributor bear **direct moral culpability**?  
        - **Yes**:  
          - *Leaf 3: **Hybrid Institutional Deontology*** (Unnamed)  
            - **Resolution**: Collectives have non-identical constraints (e.g., scaled to institutional roles), but individuals retain direct culpability for their role in enabling harm.  
            - **Awkward Commitment**: Programmers are culpable like direct perpetrators, yet collectives have "discounted" obligations, creating tension between stringent individual duties and lax collective ones.  
        - **No**:  
          - *Leaf 4: **Structural Obligation without Individual Blame*** (e.g., Pettit 2007)  
            - **Resolution**: Collectives bear primary obligations (e.g., to avoid structural injustice), but individuals are only accountable for role-specific duties (e.g., diligence in their task), not the collective harm.  
            - **Awkward Commitment**: Citizens voting for harmful policies are **not complicit** if they acted within role-based norms, shifting all blame to institutions and demanding utopian redesigns (e.g., "perfect" democracies).  
    - **No** (Constraints **do not apply** to collective entities—only individuals matter):  
      - **Diagnostic Scenario 1 (Q1):** Does an individual contributor bear **direct moral culpability**?  
        - **Yes**:  
          - *Leaf 5: **Individualist Reductionism*** (e.g., Jackson 1997)  
            - **Resolution**: Only individuals are bound by deontological constraints. Each contributor bears full culpability for their fractional share of the harm.  
            - **Awkward Commitment**: A voter enabling a harmful policy is as culpable as its enforcer, ignoring thresholds of causal significance (e.g., 1 vote in 100 million).  
        - **No**:  
          - *Leaf 6: **Distributed Harm Absolutism*** (Unnamed)  
            - **Resolution**: No deontological violation occurs in distributed harms—neither collectives nor individuals are blameworthy because no single agent intends/causes the harm.  
            - **Awkward Commitment**: Permits severe rights violations (e.g., algorithmic discrimination) as long as harms emerge "structurally," gutting deontology’s core prohibitions.  

  ---

  ### **Unoccupied Branches**  
  - **Leaf 6 (Distributed Harm Absolutism)** is **theoretically unattractive**: It implies deontology cannot condemn systemic injustices (e.g., automated bias), violating its foundational aim to protect individual rights. It is unexplored in serious literature.  
  - **No other branches are unoccupied**. All logical combinations are mapped.  

  ---

  ### **Overlapping Positions: Pairs the Tree Fails to Separate**  
  The tree separates all named positions *except* two pairs sharing key commitments:  
  1. **Leaf 2 (Pure Corporate Agency) and Leaf 4 (Structural Obligation without Individual Blame)**  
     - **Shared Commitment**: Both deny individual direct culpability for distributed harms.  
     - **Why Overlap?** The tree distinguishes them via Q2 (collective constraints: identical vs. non-identical) but cannot isolate their **practical implications**: Both exonerate individuals (e.g., voters or programmers) and locate blame solely in institutions. This overlap arises from their shared rejection of individual complicity.  

  2. **Leaf 1 (Strong Corporate Agency) and Leaf 5 (Individualist Reductionism)**  
     - **Shared Commitment**: Both affirm direct individual culpability for contributions to collective harm.  
     - **Why Overlap?** Though split by the root (collective constraints: identical vs. absent), their answers to Q1 yield identical blame attributions. The tree cannot differentiate their **grounds for blame**: Leaf 1 blames individuals *as parts of a collective agent*; Leaf 5 blames them *as isolated contributors*.  

  ---

  ### **Taxonomy Summary**  
  | Leaf | Position                             | Collective Constraints | Individual Culpability? | Key Awkward Commitment                          |  
  |------|--------------------------------------|------------------------|--------------------------|------------------------------------------------|  
  | 1    | Strong Corporate Agency w/ Blame     | Identical              | Yes                      | Trivial contributions = genocide-level blame.  |  
  | 2    | Pure Corporate Agency                | Identical              | No                       | Citizens/engineers blameless for systemic harm.|  
  | 3    | Hybrid Institutional Deontology      | Non-identical          | Yes                      | Individuals bound more strictly than groups.   |  
  | 4    | Structural Obligation w/o Blame      | Non-identical          | No                       | Utopian institutional redesign required.       |  
  | 5    | Individualist Reductionism           | Absent                 | Yes                      | 1 vote = full blame for policy harm.           |  
  | 6    | Distributed Harm Absolutism          | Absent                 | No                       | Structural rights violations permitted.        |
