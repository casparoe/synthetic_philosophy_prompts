prompt: |-
  I'm attempting to determine whether everyday social conventions—tipping, queuing, jaywalking—generate genuine moral obligations for temporary visitors, or whether they remain merely local etiquette that outsiders may disregard without fault. To frame the question, I distinguish between what I shall call "normative assimilation" (adopting local rules because they sustain welfare-sensitive coordination practices) and "moral tourism" (treating local norms as optional cultural spectacles that impose no duty on the observer). Here are my intuitive verdicts on particular cases, which I hope will reveal whether there is a coherent principle behind them, or whether some verdict must be abandoned.

  In a Manhattan diner where staff wages are legally sub-minimum and depend upon gratuities, I judge that a British tourist who refuses to tip acts wrongly—this feels closer to wage deprivation than to mere rudeness. In Tokyo, where tipping can embarrass staff and violate hospitality norms, I judge that the same tourist ought to refrain, and that pressing cash upon a server would be the moral error. Queuing at a London bus stop strikes me as obligatory for anyone present, visitor or resident, because the line is a fragile coordination device that collapses if even one person defects; but jaywalking in central Berlin when no vehicles are present seems permissible for a visitor, unless they are accompanied by local children, in which case it becomes wrong—not because of traffic risk, but because it models contempt for a shared rule that locals treat with near-sacred seriousness. I also think there is a meaningful difference between violating a convention that harms identifiable individuals (skipping the queue means someone else waits longer) and violating one that merely expresses cultural difference: ignoring a "no shoes" rule in a private home feels rude but not immoral, whereas ignoring it in a mosque feels genuinely wrong.

  Yet I encounter tension. I believe a visitor ought to follow local tipping norms even when they find them morally arbitrary—say, the expectation that one tips hotel porters in New York but not in Oslo—yet I also believe a visitor need not participate in conventions they regard as unjust, such as gender-segregated queuing in certain public contexts, even if refusal causes local offence. Is there a unifying principle—perhaps involving direct harm, coordination failure, complicity in injustice, or respect for autonomous communal practice—that accommodates all these verdicts? Or must I drop either the assimilation obligation or the conscientious-objection exemption? Furthermore, what does the principle predict for a case I have not resolved: should a visitor to a culture with mandatory "gift-giving" to public officials (a practice they regard as bribery) participate to avoid social ostracism, or does the moral-tourism exemption apply?
reasoning: |-
  Okay, let's start by unpacking the user's query. They're grappling with whether temporary visitors should follow local social conventions or if they're merely etiquette that can be ignored. They've presented several scenarios to test their intuitions and are looking for a unifying principle.

  First, I need to understand their core dilemma: normative assimilation versus moral tourism. They want to know when it's morally obligatory to follow local norms and when it's permissible to opt out. Their examples include tipping in NYC vs. Tokyo, queuing in London, jaywalking in Berlin, and more. They also mention tension when norms feel arbitrary or unjust, like gender-segregated queues or mandatory "gift-giving" to officials.

  The user's examples show a pattern. When actions cause direct harm (like wage deprivation from not tipping in the US) or coordination collapse (like skipping a queue), they lean towards obligation. But when the harm is less tangible, like cultural offense without direct consequences, they see it as permissible. The exception is when modeling behavior for locals, especially children, which adds a layer of responsibility.

  The conflict arises with unjust norms. The user feels it's okay to refuse gender-segregated queuing despite causing offense. But they also think one should follow arbitrary norms like tipping porters in some cities. So the challenge is reconciling these. 

  Possible principles include direct harm, coordination necessity, complicity in injustice, and respect for communal autonomy. Each plays a role but needs balancing. The user needs a framework that prioritizes harm and justice over mere cultural difference. 

  For the unresolved case of mandatory "gift-giving" (bribery), the key factors are complicity in corruption versus personal risk. If refusing endangers the visitor or others, it might be excusable. Otherwise, complicity in injustice likely outweighs assimilation. 

  I should also consider the user's deeper needs. They might be seeking ethical consistency for their own travels or academic work. They value both cultural respect and moral integrity, needing a way to navigate conflicts without hypocrisy. The framework should provide clear criteria without oversimplifying cultural nuances.
answer: |-
  Your nuanced case analyses reveal a sophisticated ethical framework in tension. The conflict between normative assimilation and moral tourism can be resolved by a **Principle of Contextual Moral Weight**, prioritizing four factors:

  ### Core Principle:
  **Visitors incur moral obligations when disregarding local conventions would (1) cause direct/identifiable harm, (2) undermine essential coordination goods, (3) constitute complicity in injustice, or (4) violate sacred cultural boundaries that maintain communal dignity. Mere cultural difference or offense without these factors permits moral tourism.**

  ### Applying the Principle to Your Cases:
  1. **Tipping (NYC vs. Tokyo):**  
     - *NYC:* Refusing tips **causes direct harm** (wage deprivation). Obligatory.  
     - *Tokyo:* Tipping **violates hospitality boundaries**, causing distress. Obligatory to refrain.  
     - *Hotel porters (NYC vs. Oslo):** Arbitrariness is irrelevant—harm/comity determines obligation. No harm in Oslo? Tourism permissible.

  2. **Queuing (London):**  
     - Collapsing queues causes **coordination failure** with **identifiable victims** (delayed individuals). Obligatory for all present.

  3. **Jaywalking (Berlin):**  
     - *Alone:* No harm ⇒ **moral tourism permissible**.  
     - *With children:* **Modeling rule-contempt** undermines **communal practice integrity**. Obligatory to comply.

  4. **Shoes Rule:**  
     - *Private home:* Mere offense ⇒ **rudeness, not immorality**.  
     - *Mosque:* Violates **sacred boundary**; disrespects **communal dignity**. Obligatory to comply.

  5. **Gender-Segregated Queues:**  
     - Refusal isn't tourism—it’s **conscientious objection to injustice**. Causing offense is outweighed by **rejecting complicity** in harmful norms. Permissible to defect.

  ### Unresolved Case: Mandatory "Gift-Giving" (Bribery)
  - **Key Factors:**  
    - **Direct Harm:** Sustains systemic corruption (harms society).  
    - **Complicity:** Participation normalizes/extorts injustice.  
    - **Coordination vs. Coercion:** Not a neutral coordination tool (unlike queues) but an **exploitative practice**.  
  - **Verdict:** *No obligation to participate.* Refusal is morally required unless:  
    - Refusal directly endangers locals (e.g., official retaliates against them).  
    - Symbolic participation is unavoidable for vital needs (e.g., medical access).  
  - **Social ostracism** alone is insufficient to override complicity in injustice.

  ---

  ### Resolving Your Tension:
  - **Normative assimilation** binds when harm, coordination collapse, or sacrality is at stake.  
  - **Moral tourism** is permissible for arbitrary/offensive but harmless conventions.  
  - **Conscientious objection** supersedes assimilation when conventions perpetuate injustice—even if refusal causes offense.  

  Your intuition to reject gender segregation while accepting arbitrary tipping norms is coherent: the former implicates **complicity in structural harm**, while the latter involves **harm-prevention or cultural respect** without injustice. Dignity and harm anchor the framework—not etiquette alone.

  ### Final Test: 
  If a norm is *harmless, non-sacred, and functionally optional* (e.g., using honorifics incorrectly), moral tourism applies. But if it meets any of the four criteria, assimilation becomes obligation. Your judgments align under this principle—no verdict requires abandonment.
