  ## Opening Remarks: Workshop on Institutional Moral Repair

  Good morning, everyone. Welcome. It’s genuinely exciting to see such a diverse group gathered here today – philosophers deeply versed in the nuances of ethics, alongside legal mediators whose daily work navigates the complex aftermath of harm within and between organizations. This mix of perspectives is exactly what we need to tackle our central, deceptively simple question: **Can large institutions – corporations, universities, governments – genuinely feel things like resentment or gratitude? Can they *truly* apologize?**

  We all talk *as if* they can. We say, "The company betrayed its employees," "The university owes its students gratitude," "The agency deeply regrets its actions." We hold institutions morally accountable. Yet, intuitively, emotions like resentment, indignation, or heartfelt gratitude seem bound up with personal consciousness, with the capacity to *feel* wronged or appreciative in a deeply internal way. Institutions, as structures and systems, lack that inner life. So, is this all just a useful metaphor? A shorthand?

  Our starting point today is the profound insight that our moral relationships aren't just about rules or consequences; they're held together, shaped, and repaired by what we might call **"reactive attitudes."** These are the emotional responses we have towards others based on their regard for us – resentment when we’re wronged, gratitude when we’re benefitted, indignation on behalf of others, forgiveness when harm is addressed. These aren't just feelings; they are *moral demands* and *acknowledgements*. They signal what we expect of each other as moral agents and how breaches in those expectations are managed.

  **The core puzzle for our workshop is this:** If these reactive attitudes are fundamental to interpersonal moral repair between individuals, what happens when the "agent" involved is not a person, but an institution? Can an institution *itself* bear resentment or gratitude? Or are we merely projecting human emotions onto a complex machine?

  **Here’s the crucial argument we’ll explore today: Treating institutions as capable of reactive attitudes is *not merely metaphorical*. It has real, concrete consequences for how we understand and pursue *moral repair* when institutions cause harm.**

  Why is this more than just a figure of speech?

  1.  **It Changes What "Apology" Means:** When *you*, as an individual, feel remorse and apologize, the core of the repair is often the *internal transformation* – your changed feeling and acknowledgment. But an institution cannot "feel" remorse in that personal sense. Therefore, an **institutional apology** must be something fundamentally different. Its validity doesn't rest on the sincerity of any single person's internal state (though that might be part of it). Instead, it rests on **structural change and action**. A genuine institutional apology requires:
      *   **Acknowledgement:** A formal, authoritative statement accepting responsibility for specific harms.
      *   **Structural Accountability:** Identifying and addressing the policies, procedures, or cultures *within the institution* that enabled the harm.
      *   **Amends:** Concrete actions aimed at repairing the damage done, which might include compensation, restitution, or policy reform.
      *   **Commitment to Change:** Demonstrable steps taken to prevent recurrence.

      An institutional apology that lacks these elements is often seen as hollow, precisely because the institution *cannot* offer the internal remorse of a person. It *must* offer systemic change instead.

  2.  **It Defines Institutional Capabilities & Limits:** Recognizing this distinction draws clear lines around what institutions *can* and *cannot* meaningfully do:
      *   **What Institutions CAN Do:** They can establish fair procedures for investigating harm. They can create systems of accountability (like ethics boards or ombudspersons). They can allocate resources for restitution. They can reform policies and practices. They can make public commitments and be held responsible for keeping them. They can express, through authorized representatives, acknowledgment and commitment.
      *   **What Institutions CANNOT Do:** They cannot *experience* the sting of resentment or the warmth of gratitude internally. They cannot offer the deeply personal, internal remorse of an individual. Their "forgiveness" is not an emotional release but a formal decision based on policy and process.

  **Why does this matter for all of us here?**

  *   **For Philosophers:** It challenges us to refine our understanding of moral agency and responsibility. Can responsibility truly exist without subjective feeling? How do we conceptualize collective agency in a way that captures the *moral* dimension beyond mere legal liability?
  *   **For Mediators:** This distinction is intensely practical. When you're facilitating dialogue after an institutional harm, understanding that "apology" means something structurally different is vital. It shifts the focus from demanding impossible personal feelings from "the institution" to identifying and negotiating the concrete, structural actions that constitute genuine repair: the policy changes, the accountability mechanisms, the tangible amends. It helps you set realistic goals and identify genuine progress (or its absence).

  **Our goal today is not to provide easy answers, but to sharpen the questions and build a shared framework.** We'll explore how applying reactive attitudes to institutions isn't just a linguistic trick, but a recognition that demands a different kind of repair work – one focused on systems, structures, and demonstrable change. We’ll probe the limits of this application and the unique challenges it poses.

  Let’s embrace the productive tension between your perspectives. Philosophers, challenge us with rigor. Mediators, ground us in the messy realities of practice. Together, let’s delve into what it really means for an institution, that complex web of rules and people, to take responsibility for harm and genuinely attempt to make things right.

  I look forward to a rich and challenging day of discussion. Let’s begin.
