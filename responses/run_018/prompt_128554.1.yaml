prompt: |-
  I'm preparing to lead a ninety-minute session for a philosophy-of-science reading group—graduate students and postdocs whose default framework is interventionist or mechanistic causation—on Al-Ghazālī's occasionalism, specifically the argument in his critique of philosophical causation that observed regular succession does not establish any necessary internal connection between cause and effect. Don't explain occasionalism to me; plan the teaching arc. I need the dependency order: what conceptual piece must be in place before occasionalism can even sound like a serious epistemological challenge rather than a theological curiosity, then how to introduce the thesis that fire is only the occasion for cotton's burning while divine action is the true cause, then how to draw the precise distinction from Hume's constant-conjunction skepticism—emphasizing that Hume undermines metaphysical necessity but preserves predictive regularity as the basis of scientific practice, whereas Al-Ghazālī's occasionalism, if taken without theological supplementation, threatens to undermine even that predictive warrant. The carrying example must be fire and cotton: specify exactly which features it must display (the reproducibility, the apparent immediacy, the absence of any observable internal mechanism linking flame to combustion) and which feature it must lack (any empirically accessible necessary link) so that the example makes occasionalism plausible rather than absurd. Map the predictable misconceptions in the sequence they'll arise: first that occasionalism is simply science-denial; second that it collapses into Humean skepticism; third that it is merely a God-of-the-gaps move for unexplained events. For each, identify the exact point in the sequence where it should be headed off and the one sentence or distinction that defuses it. Design one closing check question that reveals whether the group has grasped the specific difference between occasionalism and Humean skepticism—something that fails if they merely reply that both deny necessary connection. Finally, state explicitly what should be left out at this level and openly refused: for instance, the Ash'arite metaphysics of atomism and the doctrine of acquisition (kasb), with a brief reason why introducing them here would break the arc. No reading list or further sources, please.
reasoning: |-
  Okay, the user is preparing a 90-minute session on Al-Ghazālī's occasionalism for a philosophy-of-science reading group. The participants are grad students and postdocs who typically think in terms of interventionist or mechanistic causation. I need to design a teaching arc that starts by making occasionalism seem like a serious epistemological challenge rather than just a theological idea.

  First, I should establish why observed regular succession doesn't imply necessary connection. The group's background in interventionist approaches means they focus on mechanisms, so I need to challenge that default. The fire and cotton example is key here. I have to specify its features carefully: reproducibility (it reliably burns when in contact), apparent immediacy (no observable delay), and no internal mechanism (we can't see any linking process). But it must lack any empirically accessible necessary link—we observe correlation but not necessity. This sets up the problem.

  Next, introducing occasionalism itself. I'll present it as fire being merely the occasion, not the cause, with divine action as the true cause. I need to frame this as an epistemological point about what we can know from observation, not just theology. Then, distinguishing it from Hume is crucial. Hume denies metaphysical necessity but keeps predictive regularity for science. Al-Ghazālī, without theology, undermines even predictability since God could change the sequence anytime. That's the threat to scientific practice.

  Now, misconceptions. First, that occasionalism denies science. I'll head this off early by stressing it accepts empirical regularities but questions their ontological basis. Second, confusing it with Humean skepticism. The distinction comes when discussing predictability: Hume preserves it, Al-Ghazālī doesn't. Third, seeing it as a God-of-the-gaps argument. Clarify that it's about all events, even explained ones, and divine action isn't filling gaps but replacing causation entirely.

  For the closing check, I'll ask why predictive science remains possible under Hume but not under pure occasionalism. If they just say both deny necessary connection, they've missed the key difference. Finally, I'll avoid Ash'arite atomism and kasb. Those are theological/metaphysical details that would distract from the core epistemological argument. The goal is to focus on the challenge to scientific warrant, not the full theological system.
answer: |-
  Here’s a teaching arc designed for your session, optimized for clarity, conceptual dependency, and preempting misconceptions:

  ### **Teaching Arc (90 Mins)**
  **Goal:** Frame Al-Ghazālī’s critique as an epistemological challenge to scientific inference, distinct from Humean skepticism.

  #### **Phase 1: Undermine the Default Framework (20 mins)**
  - **Hook (5 min):**  
    *Question:* "In interventionist/mechanistic frameworks, what *empirical evidence* proves that cause C *necessitates* effect E—beyond observing their regular succession?"  
    *Goal:* Surface the group’s reliance on regularity + mechanism as proxies for necessity.  
  - **Problem Setup (15 min):**  
    Present the fire-cotton example with **non-negotiable features**:  
    (a) *Reproducibility*: Cotton burns every time flame contacts it under standard conditions.  
    (b) *Apparent immediacy*: No observable temporal gap between contact and burning.  
    (c) *No observable internal mechanism*: No scientific access to a "causal glue" binding flame/combustion (pre-Ghazālī science lacked molecular explanations).  
    (d) *Lacking feature*: Empirically accessible *necessity* (we see succession, not compulsion).  
    *Key move:* Argue that (a)-(c) are compatible with **correlation without inherent power**—science observes regularity but cannot *observe* necessity.  

  #### **Phase 2: Introduce Occasionalism as Epistemological Challenge (25 mins)**
  - **Thesis (10 min):**  
    Al-Ghazālī’s claim: Fire is merely the *occasion* (observable condition) for cotton’s burning; God is the *true cause* (metaphysical agent).  
    *Emphasize:* This is **not** denying empirical regularity. It’s denying that regularity implies creaturely causal powers.  
  - **Misconception #1 Preemption (Occasionalism ≠ Science-Denial):**  
    *When:* Immediately after stating the thesis.  
    *Defusing Sentence:* **"Occasionalism accepts the *reliability* of observed sequences but rejects their *intrinsic causal ontology*."**  
    *Example:* Science correctly predicts cotton burns in flame—but this need not mean fire *produces* combustion.  

  #### **Phase 3: Contrast with Humean Skepticism (30 mins)**
  - **Hume Recap (10 min):**  
    Hume: Constant conjunction → psychological habit of expectation. *Metaphysical necessity* is unjustified, but *predictive regularity* is pragmatically sound.  
  - **Al-Ghazālī’s Radical Threat (15 min):**  
    Without theology: If God *could* decouple occasion from effect (cotton not burning in flame tomorrow), **regularity loses *all* ontological grounding**. Science relies on regularity as a *brute feature* of nature—but occasionalism makes regularity contingent on divine will alone.  
  - **Distinction (5 min):**  
    Hume: Regularity is stable (no necessity). | Al-Ghazālī: Regularity is *contingently* stable (no necessity + no inherent stability).  
  - **Misconception #2 Preemption (≠ Humean Skepticism):**  
    *When:* When contrasting the two.  
    *Defusing Sentence:* **"Hume saves science by naturalizing expectation; Al-Ghazālī’s God-dependence *endangers* science by making regularity metaphysically arbitrary."**  

  #### **Phase 4: Consolidation & Misconception #3 (10 mins)**
  - **Misconception #3 Preemption (≠ God-of-the-Gaps):**  
    *When:* After establishing the regularity problem.  
    *Defusing Sentence:* **"Occasionalism applies to *all* events (even 'explained' ones like combustion), making God the direct cause of *every* sequence—not an explanation for gaps."**  
  - **Closing Check Question (5 min):**  
    *"Why would the predictive success of science be *more* threatened under Al-Ghazālī’s occasionalism (sans theology) than under Hume’s skepticism?"*  
    *Success:* Answers reference **contingent regularity** (divine will could change sequences) vs. Hume’s **stable habits**.  
    *Failure:* "Both deny necessity."  

  ---

  ### **What to Explicitly Omit & Why**
  - **Ash‘arite Atomism & Kasb (Acquisition):**  
    *Reason:* Atomism (discrete time/space) and *kasb* (human "acquisition" of divine acts) are metaphysical/theological supplements that *resolve* the epistemological threat to science. Introducing them shifts focus from Al-Ghazālī’s core challenge ("What warrant does regularity provide?") to theological systematization, blunting the critique’s force for secular philosophy of science.  
  - **Theodicy/Divine Attributes:**  
    *Reason:* Distracts from epistemology → metaphysics.  

  ### **Session Flow Summary**
  1. **Problem:** Regularity ≠ necessity (fire/cotton example).  
  2. **Thesis:** Occasionalism as regularity without creaturely power.  
  3. **Distinction:** Al-Ghazālī vs. Hume on regularity’s stability.  
  4. **Stakes:** Why occasionalism (without theology) is a deeper threat to scientific warrant.  
  5. **Clarify:** Preempt misconceptions at exact points of likely confusion.  

  This arc forces engagement with Al-Ghazālī as a philosopher of science *first*, using your group’s existing framework as the foil. The fire/cotton example’s design ensures the challenge lands before theology is mentioned.
