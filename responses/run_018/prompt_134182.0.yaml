reasoning: |-
  We are drafting a joint statement between two camps in philosophy of mind:
   Camp 1: Strict Epiphenomenalists - They hold that phenomenal consciousness (qualia) has zero causal efficacy. It doesn't cause anything, not even the neural states that lead to verbal reports about experiences.
   Camp 2: "Phenomenal-Access" Critics - They argue that if consciousness is totally causally inert, then our detailed and convergent phenomenal judgments (like "this hurts in a specific way") would be inexplicable. They think consciousness must play a causal role in producing those judgments.

   We are to produce:
   1. Joint statements: Shared formal setup, what needs explaining, and where standard no-go arguments land.
   2. Disagreement table: For each issue, the wording each camp accepts for their own side.
   3. Cruxes: Key points of disagreement with a description, a test case or argument both sides agree is relevant, and each camp's prediction.
   4. Verbal disputes: Any parts that are merely about wording.

   We are to avoid standard zombie arguments and focus on the calibration of reports and linguistic community feedback.

   Let's structure:

   Joint Statements (array of strings):
     - Shared assumptions: e.g., the existence of phenomenal consciousness, the occurrence of verbal reports about it, the physical closure of the brain, etc.
     - What needs explaining: Why do we have such detailed, convergent, and seemingly accurate reports about phenomenal states if they are epiphenomenal?
     - Standard no-go arguments: They agree that standard arguments (like the zombie argument) are inconclusive because they rely on intuitions that are disputable.

   Disagreement Table (array of objects):
     - Issue: e.g., the causal role of consciousness in reports.
     - Epiphenomenalist wording: How they describe their view on that issue.
     - Access critic wording: How they describe their view.

   Cruxes (array of objects):
     - Crux 1: Evolutionary heuristics calibration without causal contact.
       Description: Can evolutionary processes calibrate a reporting mechanism to track properties (qualia) that never causally interact with the mechanism?
       Test case: Consider a species that evolves in an environment where a non-causal property (like a quale) is perfectly correlated with a physical state that is adaptive. The reporting mechanism is tuned to the physical state. But the reports are about the quale. Can the reports be accurate without the quale causing the report?
       Predictions:
          Camp1 (Epiphenomenalists): Yes, because the report is causally driven by the physical state that is correlated with the quale, so the report can be accurate by tracking the physical state and thereby the quale.
          Camp2 (Access Critics): No, because without any causal chain from the quale to the report, there is no way for the report to be calibrated to the quale. The report is only about the physical state, and the subject's belief that it's about the quale is an illusion.

     - Crux 2: Linguistic community feedback without direct causal contact.
       Description: Can a linguistic community converge on a shared vocabulary for qualia through feedback (like correction and reinforcement) even if no one's qualia ever causally affects any behavior (including verbal behavior)?
       Test case: Imagine a community of humans who are all epiphenomenalist systems. They have verbal reports about their qualia. They engage in linguistic practices: they say "red" when they see a red object, and others correct them if they say "red" for a blue object. But the qualia don't cause the reports (the neural states do). Can the community stabilize a shared language about qualia?
       Predictions:
          Camp1: Yes, because the neural states that are the real causes of the reports are also the ones that are shaped by the community feedback. The feedback acts on the neural states that are correlated with the qualia, so the language is about the qualia indirectly.
          Camp2: No, because without qualia ever entering the causal chain, the feedback is only about the physical states (e.g., the wavelength of light). The community might have a shared language about physical stimuli, but not about qualia. The agreement about qualia would be coincidental and not about the qualia themselves.

   Verbal Disputes: Any that arise? Maybe about what "aboutness" means (intentionality) or what "accuracy" of reports entails.

   Let's code accordingly.

   Note: We are to write casually, a typo or two is fine.

   We'll create a JSON object with the required fields.
