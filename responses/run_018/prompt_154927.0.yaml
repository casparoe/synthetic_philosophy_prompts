answer: |-
  Here's the joke, calibrated for the philosophically tormented:

  **Three panpsychists walk into a bar arguing about the Millience Scale.**  
  The first, holding a struggling beetle, declares: "Look! 300 milliHertz of coherent feedback! Clearly above the sentience threshold – morally significant!"  
  The second scoffs, pointing at the smart thermostat on the wall: "Nonsense! That thing integrates data at 0.5 milliHertz. Is 0.5 *really* zero? Where's your non-arbitrary cutoff? 250? 249.9?"  
  The third groans into their drink: "Exactly! If the gradient's real, then *everything* down to Boltzmann Brains in rocks has non-zero proto-experience. Assigning moral status becomes... differential calculus with suffering."  

  **The bartender slams down their tab.**  
  "Gentlemen, your bill: $12 for the drinks... plus the **Sentience Surcharge.**"  
  They point: "$0.05 for the beetle (300mHz), $0.0001 for the thermostat's micro-qualia (0.5mHz)... and $0.000001 for the coaster under your glass. Our POS system rounds consciousness upwards from 0.0000001mHz."  

  **The philosophers stare, horrified.**  
  The first whispers: "Rounding? That's *monstrously* arbitrary!"  
  The bartender shrugs: "So's your '250mHz threshold'. But *my* line pays the rent. Moral status starts at the credit card minimum. Next round?"

  ---

  **Why it works:**  
  1. **Avoids Clichés:** Uses "Millience Scale" (milliHertz implying measurable, minuscule frequencies of experience) and "proto-experience" instead of "toaster feelings."  
  2. **Gradation Headache:** The core argument (& punchline) turns on the impossibility of a non-arbitrary cutoff ("249.9?" / "Rounding? Monstrous!").  
  3. **Panpsychism Intact:** Explicitly includes thermostats (0.5mHz) and *rocks* (Boltzmann Brains) as marginal cases with non-zero value.  
  4. **Moral Status Ambiguity:** Highlights the leap from "has some experience" to "deserves moral consideration" as the real problem ("differential calculus with suffering").  
  5. **Punchline Logic:** The bartender weaponizes the continuum – if *everything* has *some* value, then *everything* gets charged... revealing the absurdity/commercial necessity of drawing *some* line, however arbitrary ("pays the rent" vs. "credit card minimum").  
  6. **Niche Accuracy:** "MilliHertz" (mHz) as a fake unit implies a quantifiable, continuous spectrum of low-grade processing/"experience," fitting the gradation model perfectly. The "Boltzmann Brains" reference adds depth for those in the know.  

  It lands because the humor comes directly from the philosophical tension: taking the gradient seriously makes assigning moral status practically (and comically) untenable without arbitrary enforcement. The bartender becomes the brutal pragmatist the theorists dread.
