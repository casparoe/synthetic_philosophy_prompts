answer: |-
  Here's a taxonomy of Madhyamaka views on the tetralemma, structured as a decision tree based on concrete philosophical commitments. It focuses on how each school handles negation, conventional truth, and the status of the fourth corner ("neither exists nor doesn't exist"), especially regarding emptiness itself. The tree avoids assuming prior knowledge of Sanskrit terms and flags key debates, overlaps, and "awkward commitments" (the philosophical tension each view struggles with). It results in **6 distinct positions**, with notes on where views converge.

  ---

  ### **Decision Tree: Madhyamaka Views on the Tetralemma**
  *(Start at Question 1 and follow the branches based on "yes/no" answers)*

  1. **Does conventional reality ("everyday truth") have *any* independent validity?**  
     (i.e., Can conventional truths stand on their own, or are they *entirely* dependent on context?)  
     - **YES** → Go to **Position A**  
     - **NO** → Go to **Question 2**  

  2. **Can negation logically negate *itself* without contradiction?**  
     (i.e., Is "emptiness is empty" a coherent statement, or does it collapse into paradox?)  
     - **YES** → Go to **Question 3**  
     - **NO** → *[No major classical Madhyamaka position; all accept self-negation in some form]*  

  3. **Is the fourth corner ("neither exists nor doesn't exist") a *positive claim*?**  
     (i.e., Does negating all four corners point to a "higher truth," or is it just a rejection of all options?)  
     - **YES** → Go to **Position E**  
     - **NO** → Go to **Question 4**  

  4. **Is emptiness itself an *absolute truth*?**  
     (i.e., Is emptiness the one thing that *isn't* empty, or is it empty too?)  
     - **YES** → Go to **Position F**  
     - **NO** → Go to **Position D**  

  ---

  ### **Resulting Positions & Their Commitments**
  *(With "awkward commitment" highlighted for each)*

  #### **Position A: Svātantrika-Madhyamaka**  
  - **Core commitments**:  
    - Conventional truth has *limited autonomy*: Logic and language can describe reality provisionally.  
    - The tetralemma’s fourth corner is a *positive assertion* (via apophasis: "reality is beyond existence/non-existence").  
    - Emptiness *is* empty, but conventional tools (e.g., independent inference) can affirm this.  
  - **Awkward commitment**:  
    Risk of a "hidden ontology": By granting conventional validity, it implies a subtle foundationalism (e.g., Bhāviveka’s view that logic accesses reality "from its own side").  
  - **Overlap note**: Agrees with Prāsaṅgika that *emptiness is empty* but splits on methodology.  

  #### **Position D: Prāsaṅgika-Madhyamaka (Gelug-Primary View)**  
  - **Core commitments**:  
    - Conventional truth has *no independent validity*: All phenomena are *only* dependently designated.  
    - The fourth corner is a *rhetorical dead-end*: Negating all corners leaves no positive view (not even "beyond").  
    - Negation self-negates cleanly: "Emptiness is empty" is non-paradoxical.  
    - Emptiness is *not* absolute: It is merely the *absence* of inherent existence.  
  - **Awkward commitment**:  
    Risk of *quietism*: By rejecting all positive claims (even about emptiness), it struggles to explain how wisdom or ethics function without lapsing into nihilism.  
  - **Branch note**: This is Tsongkhapa’s (Gelug) strict interpretation.  

  #### **Position E: Prāsaṅgika-Madhyamaka (Sakya-Shentong-Leaning View)**  
  - **Core commitments**:  
    - Conventional truth has *no independent validity* (same as Position D).  
    - The fourth corner *is* a positive claim: Negating all corners reveals a "non-dual reality" (e.g., luminosity/awareness).  
    - Emptiness is *not* empty of this non-dual nature (i.e., "emptiness of other" *[shentong]*).  
  - **Awkward commitment**:  
    Risk of a *hidden absolute*: By affirming a "positive" emptiness (e.g., Buddha-nature), it flirts with Yogācāra-like idealism (e.g., Gorampa’s "freedom from proliferations" as transcendent).  
  - **Branch note**: This is Gorampa’s (Sakya) synthesis; some treat it as a Shentong sub-branch.  

  #### **Position F: Radical Apophasis (Some Svātantrika-Shentong Hybrids)**  
  - **Core commitments**:  
    - Conventional truth has *no intrinsic validity* but can *point* to truth (similar to Svātantrika).  
    - The fourth corner is a *positive via negation*: "Neither X nor not-X" = ultimate reality.  
    - Emptiness *is* an absolute truth (contra Nāgārjuna’s warning).  
  - **Awkward commitment**:  
    Risk of *crypto-essentialism*: Treating emptiness as an ultimate ground contradicts Madhyamaka’s core anti-foundationalism (e.g., later Jonang Shentong).  
  - **Overlap note**: Closer to Yogācāra than mainstream Madhyamaka; not a "pure" Prāsaṅgika/Svātantrika position.  

  ---

  ### **Key Taxonomical Notes**
  1. **The Prāsaṅgika/Svātantrika Split**:  
     - The divide is **not** about whether *emptiness is empty* (both agree it is).  
     - It **is** about:  
       - **Method**: Svātantrika uses independent inference; Prāsaṅgika uses *reductio ad absurdum* (prasaṅga).  
       - **Conventional validity**: Svātantrika grants it; Prāsaṅgika denies it.  
       - **Fourth corner**: Svātantrika often sees it as apophatic truth; Prāsaṅgika sees it as a dead end.  

  2. **Where Views Converge**:  
     - All agree conventional reality is *empty* of inherent existence.  
     - All reject the fourth corner as a *conventional* truth (it only makes sense as a negation).  
     - Gelug (Position D) and Sakya (Position E) both identify as "Prāsaṅgika" but diverge on whether "neither" implies a positive.  

  3. **No Meaningful Split**:  
     On the question *"Can negation apply to itself?"*, Prāsaṅgika and Svātantrika **do not differ**. Both accept self-negation (e.g., "emptiness is empty" is coherent). The split is elsewhere.  

  ---

  ### **Tree Visual Summary**
  ```  
  1. Conventional truth independent?  
     ├── **YES** → **A: Svātantrika** (Awkward: Hidden ontology)  
     └── **NO** → 2. Can negation negate itself?  
          └── **YES** → 3. Fourth corner positive?  
               ├── **YES** → **E: Sakya-Shentong Prāsaṅgika** (Awkward: Hidden absolute)  
               └── **NO** → 4. Emptiness absolute?  
                    ├── **YES** → **F: Radical Apophasis** (Awkward: Crypto-essentialism)  
                    └── **NO** → **D: Gelug Prāsaṅgika** (Awkward: Quietism)  
  ```  

  This tree covers the core分歧 (differences) while respecting historical overlaps. Use it to map debates: e.g., Svātantrika (A) vs. Gelug Prāsaṅgika (D) splits on Q1, while Gelug (D) vs. Sakya (E) splits on Q3. For your seminar, emphasize that the "fourth corner as positive" issue (Q3) is where Tibetan schools most sharply divide—not the emptiness of emptiness itself.
