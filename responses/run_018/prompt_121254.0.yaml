  Prose Draft:

  **Joint Statement: Pairwise Non-Aggregationist Contractualists and Threshold-Sensitive Contractualist Aggregationists**

  **1. Agreed Claims**

  We, the undersigned representatives of the Pairwise Non-Aggregationist Contractualist camp and the Threshold-Sensitive Contractualist Aggregationist camp, operating within T.M. Scanlon's contractualist framework, affirm the following agreed claims:

  (i) The formal structure of contractualist justification requires that a principle is justified if and only if no one could reasonably reject it. Reasonable rejection is determined by the strength of the generic reasons individuals have for rejecting a principle, as compared to alternatives.

  (ii) Reasons considered in reasonable rejection are generic: they are based on the situation of the individual and do not depend on the individual's specific identity, preferences, or personal attachments. Fully personal reasons are excluded.

  (iii) The aggregation problem arises within contractualism when considering whether the burdens borne by many individuals, each of which is small when considered separately, can collectively provide a reason to reject a principle that would prevent a very large burden for one or a few individuals.

  (iv) Both camps share the judgment that preventing one instance of permanent paralysis generally outweighs preventing any number of minor, transient inconveniences (e.g., a paper cut or a momentary itch). This reflects our shared rejection of unrestricted aggregation.

  (v) Both camps reject welfare-maximizing aggregation (i.e., simple utilitarian summation) because it fails to respect the separateness of persons and can lead to unacceptable trade-offs that contractualism must avoid.

  (vi) Both camps agree that if any form of aggregation is permitted within contractualism, it must be constrained by a non-arbitrary mechanism (such as a threshold) rather than by linear summation, which would be tantamount to utilitarianism.

  **2. Disagreements**

  The following table summarizes our key disagreements, with each camp's view presented in its own terms:

  | Issue | Pairwise View | Threshold-Sensitive View |
  |-------|---------------|---------------------------|
  | Whether generic reasons can scale across persons to form a collective reason | Generic reasons are always held by individuals and are considered only in pairwise comparisons. The number of individuals holding a similar generic reason does not create a new, collective reason that transcends pairwise justifications. | When sufficiently many individuals each have a generic reason of a certain type, their combined reasons can cross a non-arbitrary, context-sensitive threshold, thereby generating a collective generic reason that is not reducible to pairwise comparisons. |
  | Whether a collective veto can emerge without violating the pairwise condition | A collective veto would require that the aggregated reasons of many individuals outweigh the reason of one, but this is incompatible with pairwise justification, which requires that no individual's reason be outweighed by any other individual's reason. | A collective veto can emerge when the summed burdens cross a non-arbitrary threshold. This does not violate the pairwise condition because the threshold mechanism produces a new, collective generic reason that is not present in pairwise comparisons and can override an individual's reason without reducing to pairwise aggregation. |
  | Whether threshold-sensitive aggregation collapses contractualism into rule-utilitarianism | Permitting threshold-sensitive aggregation effectively allows total burden to determine outcomes, thereby collapsing contractualism into a form of rule-utilitarianism and violating the foundational commitment to justifiability to each individual. | Threshold-sensitive aggregation does not collapse contractualism into rule-utilitarianism because it is constrained by non-arbitrary thresholds that are sensitive to context and does not aim to maximize aggregate welfare. It remains within the contractualist framework by focusing on what individuals can reasonably reject, including collective rejections based on threshold-crossing burdens. |

  **3. Cruxes**

  We identify the following cruxes as pivotal for resolving our disagreement:

  **Crux 1:**
  (a) Can a very large number of very small burdens (each trivial in isolation) ever collectively outweigh a very severe burden (like paralysis) if the number is large enough?
  (b) Test Case: Policy A prevents one permanent paralysis but imposes a one-hour sleep loss on ten thousand people. Policy B avoids imposing the sleep losses but does not prevent the paralysis.
  (c) Predictions:
      - Pairwise View: Policy B (which allows the paralysis) can be reasonably rejected by the paralysis victim because their burden (paralysis) is far greater than the burden of any single sleep-deprived individual under Policy A (one-hour sleep loss). Each sleep-deprived individual under Policy A cannot reasonably reject Policy A because their burden is minor. Therefore, Policy A must be chosen.
      - Threshold View: If the collective burden of ten thousand one-hour sleep losses (amounting to over 416 days of continuous sleep loss) crosses a non-arbitrary, contextually set threshold, then the group of ten thousand can reasonably reject Policy A. The paralysis victim can reasonably reject Policy B. The rejection by the group is stronger than the rejection by the individual if the collective burden outweighs the individual burden. Therefore, if the threshold is crossed, Policy B must be chosen.

  **Crux 2:**
  (a) Can a large number of people each facing a very small independent risk of death have a collective reason to reject a principle that imposes that risk?
  (b) Test Case: Principle P exposes each of one million people to an independent 0.001 risk of death in exchange for a large shared benefit (e.g., a significant economic gain that substantially improves each person's life). Principle Q avoids the risk and forgoes the benefit.
  (c) Predictions:
      - Pairwise View: No single individual can reasonably reject Principle P because the individual risk (0.001) is too small to be comparable to death. Therefore, Principle P is justified.
      - Threshold View: The collective burden (1000 expected deaths) may cross a non-arbitrary threshold, generating a collective reason to reject Principle P. If the collective burden (even as a risk) is sufficiently grave and not justified by the benefit (despite its size), Principle P can be reasonably rejected by the group. Therefore, Principle P may be rejected.

  **Crux 3:**
  (a) Can a moderate burden (like a broken arm) suffered by a sufficiently large number of people collectively outweigh a very severe burden (like death) suffered by one?
  (b) Test Case: Policy A prevents one death but allows one million broken arms to occur. Policy B prevents one million broken arms but allows one death to occur.
  (c) Predictions:
      - Pairwise View: Policy B (which allows death) can be reasonably rejected by the person who dies because death is worse than a broken arm for any pairwise comparison. Each person suffering a broken arm under Policy A cannot reasonably reject Policy A because a broken arm is not comparable to death. Therefore, Policy A must be chosen.
      - Threshold View: If the collective burden of one million broken arms crosses a non-arbitrary threshold and is judged to outweigh the burden of one death, then the group can reasonably reject Policy A. The rejection by the group may then outweigh the rejection by the individual facing death. Therefore, Policy B must be chosen.

  **4. Assessment of Verbal Disagreement**

  We assess that the dispute between our camps is not merely verbal. The disagreement centers on the fundamental structure of contractualist reasoning: whether reasons for rejection must be strictly pairwise or can include collective reasons arising from aggregated burdens above a threshold. This reflects a substantive divergence in the understanding of what constitutes a "reasonable rejection" and the nature of generic reasons. The Pairwise View maintains an individualist, non-aggregative structure, while the Threshold View introduces a collective dimension that the Pairwise View rejects as extraneous to contractualism. The disagreement is therefore ontological and structural, not merely terminological.

