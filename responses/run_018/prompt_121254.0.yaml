  ### Joint Statement: Adversarial Collaboration between Pairwise Non-Aggregationist Contractualists and Threshold-Sensitive Contractualist Aggregationists  

  #### 1. Agreed Claims  
  We, the undersigned representatives of both camps, affirm the following within Scanlon’s contractualist framework:  
  (i) **Formal Structure of Contractualist Justification**: A principle is justified if and only if no individual could reasonably reject it, grounded in generic reasons that appeal to the standpoint of any similarly situated person.  
  (ii) **Generic/Personal Reason Distinction**: Reasons for rejection must be generic (i.e., rooted in objective features of an individual’s situation, accessible to all) and not dependent on personal preferences, attachments, or subjective values.  
  (iii) **Aggregation Problem**: A core challenge arises in determining whether—and how—burdens borne by multiple individuals may collectively outweigh a severe burden to a single individual, given contractualism’s rejection of interpersonal utility aggregation.  
  (iv) **Paralysis vs. Minor Burdens**: Preventing one case of permanent paralysis (e.g., loss of mobility for life) cannot be overridden by preventing any number of minor, transient inconveniences (e.g., brief headaches or paper cuts), regardless of scale.  
  (v) **Rejection of Welfare-Maximizing Aggregation**: Simple utilitarian summation—where total welfare gains/losses directly determine permissibility—is incompatible with contractualism, as it disregards the separateness of persons and the primacy of individual generic reasons.  
  (vi) **Non-Arbitrary Constraints on Aggregation**: If aggregation is permitted, it must be governed by a context-sensitive, non-arbitrary threshold mechanism (e.g., a burden’s severity or cumulative impact), not linear summation.  

  #### 2. Disagreements  
  Key unresolved issues are summarized below, with each camp’s position articulated in its own terms:  

  | Issue | Pairwise View | Threshold-Sensitive View |  
  |-------|---------------|---------------------------|  
  | Whether generic reasons scale across persons | Generic reasons are inherently individual; burdens cannot be summed across persons to create "collective reasons." Each individual’s burden must be evaluated solely against another’s in pairwise comparison. | Generic reasons can generate collective force when summed burdens cross a non-arbitrary, contextually defined threshold, producing a veto-worthy reason irreducible to pairwise terms. |  
  | Whether a collective veto can emerge without violating pairwise justification | A collective veto is incoherent: justification requires no single individual to have a stronger reason for rejection than any other. Aggregation across persons undermines this atomistic structure. | A collective veto is compatible: when summed burdens cross a threshold, they constitute a distinct generic reason (held by the group) that can override an individual’s reason without negating pairwise comparisons. |  
  | Whether threshold-sensitive aggregation collapses contractualism into rule-utilitarianism | Threshold aggregation functionally reduces to rule-utilitarianism by permitting group welfare to override individual claims, eroding contractualism’s commitment to justifiability to each person. | Threshold aggregation is distinct: it uses contextually fixed, burden-sensitive thresholds (e.g., "catastrophe prevention") rather than maximizing aggregate welfare, preserving contractualism’s focus on generic reasons. |  

  #### 3. Cruxes  
  The following sub-questions are pivotal; resolving them would significantly advance the debate. For each, a test case and both camps’ predictions are provided.  

  **Crux 1:**  
  (a) *Crux Statement*: Can a sufficiently large number of trivial burdens (e.g., fleeting discomforts) collectively outweigh a catastrophic burden (e.g., paralysis)?  
  (b) *Test Case*: Policy A prevents one permanent paralysis. Policy B prevents 10,000 people from suffering a one-hour sleep loss. Only one policy can be enacted.  
  (c) *Predictions*:  
      - **Pairwise View**: Policy A is impermissible (thus, Policy B is required). The paralysis victim can reasonably reject Policy B, as their burden (paralysis) outweighs any single sleep-loss burden. No sleep-deprived individual can reject Policy A, as their burden is trivial.  
      - **Threshold View**: Policy B is impermissible (thus, Policy A is required). The collective burden of 10,000 sleep losses (equivalent to ~416 days of lost sleep) crosses a severity threshold, generating a reason to reject Policy A.  

  **Crux 2:**  
  (a) *Crux Statement*: Can aggregate small risks of severe harm (e.g., death) generate a collective reason for rejection?  
  (b) *Test Case*: Principle P exposes each of 1 million people to an independent 0.001% risk of death to achieve a large shared benefit (e.g., curing a pandemic). Principle Q avoids the risk but forgoes the benefit.  
  (c) *Predictions*:  
      - **Pairwise View**: Principle P is permissible. No individual faces a non-negligible risk (0.001%), so no one can reasonably reject P. The shared benefit is irrelevant to individual rejection.  
      - **Threshold View**: Principle P is impermissible. The aggregate burden (10 expected deaths) crosses a risk-exposure threshold, creating a collective reason for rejection that outweighs the benefit.  

  **Crux 3:**  
  (a) *Crux Statement*: Can aggregated moderate burdens (e.g., serious injuries) collectively outweigh a severe burden (e.g., death) when scaled sufficiently?  
  (b) *Test Case*: Policy A prevents one death. Policy B prevents 100,000 cases of irreversible blindness. Only one policy can be enacted.  
  (c) *Predictions*:  
      - **Pairwise View**: Policy A is impermissible (thus, Policy B is required). The individual facing death can reject Policy B, as death outweighs blindness for any pairwise comparison. No blind individual can reject Policy A.  
      - **Threshold View**: Policy B is impermissible (thus, Policy A is required). The collective burden of 100,000 blindness cases crosses a severity threshold (e.g., "large-scale devastation"), generating a reason to reject Policy A.  

  #### 4. Assessment of Verbal Disagreement  
  The dispute is not merely verbal. Both camps agree on contractualism’s core mechanics (e.g., generic reasons, pairwise foundations) but disagree substantively on whether *collective reasons* exist as irreducible entities. The Pairwise View sees "collective reasons" as a contradiction, as reasons remain anchored to individuals. The Threshold View argues that threshold-crossing burdens create a new *type* of generic reason grounded in group-scale harm. This reflects a deeper divergence in how contractualism accommodates numbers, not terminology.  

