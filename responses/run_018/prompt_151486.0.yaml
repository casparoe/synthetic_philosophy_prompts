answer: |-
  Your grappling with the White Horse Dialogue captures the very tension that makes the Mingjia (School of Names) enduringly provocative. Let's dissect the argument using the text's own conceptual resources, focusing on its core dynamics of "similarity" (同 *tong*) and "difference" (異 *yi*), and the interplay of "pointing/naming" (指 *zhi*/名 *ming*), avoiding anachronistic frameworks.

  **Core Argument Structure & Mingjia Conceptual Toolkit:**

  1.  **The Primacy of "Pointing" (指 *zhi*) and "Difference" (異 *yi*):** The Mingjia operates within a framework where *zhi* ("pointing out," "indicating," "referring") is fundamental. *Zhi* involves isolating a specific aspect or feature perceived in the world. Crucially, *zhi* inherently implies *difference* (異 *yi*). To point to "horse" is to differentiate the "shape/form" aspect *from* other aspects (like color) and *from* other objects that are not horses. Similarly, to point to "white" is to differentiate the color aspect. This differentiation isn't merely conceptual; it's seen as reflecting a fundamental way reality is parsed.

  2.  **Compounding Creates a New *Zhi*:** When terms are compounded ("white horse"), a new act of *zhi* occurs. This *zhi* isn't simply the conjunction of the two isolated *zhi*. It points to a *singular, unified object of reference* defined by the *combination*. The key move is that this compound *zhi* is *different* (異 *yi*) from either isolated *zhi*. It picks out a distinct object-type.

  3.  **"Horse" (馬 *ma*) as a Specific *Zhi*:** "Horse" names/shapes (*ming/xing*) a specific *zhi* – the form aspect. It is defined by what it *excludes* as much as what it includes. Asking for "a horse" specifies *only* the form aspect; any color is acceptable (yellow horse, black horse, etc.). The extension of "horse" is defined by satisfying *only* the form *zhi*.

  4.  **"White Horse" (白馬 *bai ma*) as a Distinct *Zhi*:** "White horse" names/shapes a compound *zhi* – the inseparable combination of the form aspect *and* the color aspect. Its extension is defined by satisfying *both* aspects simultaneously. Crucially, satisfying the compound *zhi* ("white horse") *necessarily satisfies* the isolated *zhi* for "horse" (it has the horse form), but satisfying the isolated *zhi* for "horse" *does not necessarily satisfy* the compound *zhi* for "white horse" (it might be yellow).

  5.  **The Test of Substitution (The Request Argument):** This is the operational test revealing the ontological difference. Asking for "a horse" allows for any horse-shaped object, regardless of color. Asking for "a white horse" requires a horse-shaped object *that is also white*. Since what satisfies the second request is a *subset* of what satisfies the first, and the requests are not interchangeable (you cannot fulfill "bring a horse" with *only* a white horse if yellow horses exist and are acceptable for "horse"), the objects satisfying the requests are different. The *zhi* invoked by the request dictates what counts as fulfilling it.

  **Unpacking the Ontological Commitment:**

  *   **Not Merely Intensional (Fregean Sense):** While conceptual difference is involved, the argument goes beyond sense determining reference. The substitution test grounds the difference in *what exists* and *what counts as fulfilling a request in the world*. The difference in extension is presented as evidence of a difference in the *object-type itself*.

  *   **A Metaphysical Claim about Property Combination:** Yes, the text carries a strong metaphysical thesis. Properties like "horseness" (shape) and "whiteness" (color) are treated as distinct, isolable aspects (*zhi*) that can be "pointed out." Crucially, **combining them creates a new, ontologically distinct compound entity** ("white horse"). This compound is not simply "a horse instance with the accidental property white." It is a unique *kind* defined by the co-presence of both aspects. The properties are not separable *entities* floating free (like Platonic Forms), but their combination fundamentally alters the identity conditions of the resulting whole.

  *   **Mereological Assumption is Central:** Your intuition is correct. The argument implicitly relies on a specific mereology: **The compound "white horse" is a new whole whose identity is determined by the *inseparable combination* of its aspects.** Adding "white" to "horse" doesn't just add a description; it creates a new integral whole ("white-horse") with distinct modal and functional properties (specifically, what satisfies a request for it). This whole is not reducible to "horse + white" as separate entities; the combination itself is the defining feature. "Horse" can exist without "white," but "white horse" *as a compound type* cannot exist without both.

  *   **Collapsing Linguistic and Ontological Difference:** This is the radical core of the Mingjia position, driven by their view of *zhi* and *yi*. For them, **the act of "pointing/naming" (*zhi/ming*) directly carves reality.** The linguistic difference ("horse" vs. "white horse") reflects a difference in what is pointed to (*zhi*), and this difference in pointing *is* the ontological difference. If the *zhi* is different (as proven by the substitution test), then the object-type *is* different. They reject the separation between "conceptual difference" and "ontological difference" because *zhi* operates at the interface of language, perception, and reality. The "pointing" *is* the act of isolating a feature of the world; different pointing = different feature/compound = different object-type.

  *   **The Role of "Similarity" (同 *tong*):** *Tong* operates within a defined scope. All horses are *tong* under the *zhi* "horse" (they share the form aspect). All white horses are *tong* under the *zhi* "white horse" (they share the form+color compound). But crucially, the *zhi* "horse" and the *zhi* "white horse" are *not tong*; they are *yi* (different). The similarity within a category defined by a *zhi* does not bridge the difference *between* categories defined by different *zhi*.

  **Conclusion: A Radical Compound Ontology**

  The White Horse Dialogue is best understood as **a metaphysical claim grounded in a specific theory of reference (*zhi*) and mereology.** Its core thesis is:

  *   **Compounding properties creates a new ontological category.** "White horse" is not a subset of "horse"; it is a distinct compound entity-type defined by the inseparable union of form and color.
  *   **Identity and existence are determined by satisfying a *zhi*.** The substitution test proves that the *zhi* "white horse" defines a different set of existence conditions than the *zhi* "horse."
  *   **Linguistic difference (*yi*) in naming/pointing directly entails ontological difference (*yi*).** The Mingjia collapses the analytic distinction because their "pointing" (*zhi*) is simultaneously linguistic, conceptual, and ontological. The way we name/point *is* the way we isolate realities.

  This isn't merely a linguistic puzzle about word meanings. It's a bold assertion that the combination of properties generates fundamentally new kinds of entities with unique identity conditions, revealed through the practical criterion of what satisfies a request (*zhi*). The "slipperiness" arises precisely from this challenge to our intuitive notions of class inclusion and the relationship between language, concepts, and the basic structure of the world. The Mingjia forces us to consider whether reality is composed of simple substances with properties or whether compound properties define their own irreducible realities. The White Horse Argument is a powerful articulation of the latter view.
