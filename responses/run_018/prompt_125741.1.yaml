  For each desideratum, I'll provide a clear motivation. Non-negotiables would be those essential to defining cognitive penetration itself, like distinguishing it from post-perceptual effects. Camp-specific desiderata might include things like preserving strict modularity or embracing pervasive top-down influences. I'll identify tensions, such as between allowing early cognitive influence while maintaining a sensory-perceptual distinction.

