answer: |-
  ### Activity Design: "The Crown's Mandate"  
  A 90-minute experiential simulation for 15 adults to uncover how hereditary monarchy provides "authorization redundancy" in democracies. Participants confront an emergency in a fictional assembly, experiencing how a dormant "Crown" role transforms legitimacy without altering decisions.  

  ---

  ### Activity Structure  
  **Total Time:** 90 minutes  
  **Group Size:** 15 participants (plus facilitator).  
  **Stakes:** "Unity Points" (℗ awarded to the *entire group*). Points unlock privileges (e.g., extra break time) or impose penalties (e.g., group must rearrange chairs). Collective success requires high post-decision acceptance.  

  #### **Phase 1: Setup (15 mins)**  
  - **Scenario:**  
    *"The Free Republic of Veridia faces a sudden energy crisis. A rogue AI is overloading the power grid. The Assembly must decide: **Deploy 'Grid-Shield' software** (untested, may cause blackouts) or **Do nothing** (risk permanent grid collapse)."_  
  - **Roles & Materials:**  
    - *Elected Council (12 people)*: Split into 4 factions (3 each). Each faction gets a **role card** with motives:  
      - **Tech Innovators**: Profit if Grid-Shield works.  
      - **Safety First**: Fear blackouts; prefer inaction.  
      - **Eco-Equity**: Worry Grid-Shield harms low-income areas.  
      - **Growth Guild**: Believe crisis is exaggerated; want minimal action.  
    - *The Crown (1 person)*: Hereditary figure. Holds a **sealed envelope** (the "Royal Mandate"). Cannot speak unless invoked. Wears a symbolic item (e.g., blue sash).  
    - *Speaker (1 person)*: Elected by the Council. Runs debates and calls votes.  
    - *Facilitator*: Acts as "Clerk," tracks time/points, and enforces rules.  
    - **Materials**: Role cards, timer, voting slips, sealed envelope (contains: *"The Crown endorses the majority decision of the first vote"*), whiteboard for points.  

  #### **Phase 2: Round 1 – Democratic Decision (20 mins)**  
  - **Rules:**  
    - Council debates and votes (simple majority) on the emergency measure.  
    - Speaker moderates; factions may negotiate.  
    - **Post-Vote Acceptance Vote**: All participants (including Crown) rate decision acceptance **1–5** (1 = reject, 5 = fully accept).  
    - **Points System**:  
      - Avg. acceptance ≥ 3.5: +2℗.  
      - Avg. acceptance < 3.5: 0℗.  
      - No decision in time: –1℗.  

  - **Predictable Outcome**:  
    Factions deadlock or force a narrow vote. Acceptance scores are low (e.g., 2.8) due to polarization. Group earns 0℗. *Legitimacy feels hollow*.  

  #### **Phase 3: Round 2 – Invoking the Crown (20 mins)**  
  - **Rules:**  
    - Council may **invoke the Crown** with a ⅔ supermajority vote.  
    - If invoked:  
      - Crown opens the envelope and **endorses** the *same decision* from Round 1 (e.g., "The Crown sanctions Grid-Shield").  
      - Crown’s acceptance vote now **counts triple** (symbolizing reserve authority).  
      - Bonus: +3℗ if Crown endorses.  
    - If not invoked: Re-run Round 1 with 10 mins.  
    - Re-take acceptance vote with Crown’s weighted vote.  

  - **Predictable Outcome**:  
    After Round 1 frustration, Council invokes Crown. Crown endorses the original decision. Acceptance scores jump (e.g., from 2.8 to 4.2) due to:  
    - Bonus points incentivizing unity.  
    - Psychological "weight" of Crown’s triple vote.  
    Group earns +3℗. *Same decision, new legitimacy*.  

  #### **Phase 4: Debrief (20 mins)**  
  Guide participants to self-discover "authorization redundancy":  
  1. **Map Frustration**: *"In Round 1, why did your vote feel unsatisfying even when you 'won'?"*  
     → Links to democracies needing more than majority rule in crises.  
  2. **Crown as Reserve**: *"What changed when the Crown spoke? Did facts change?"*  
     → Highlights dormant authority "activating" legitimacy.  
  3. **Thresholds Matter**: *"Why require ⅔ to invoke the Crown?"*  
     → Shows reserve is only for exceptional cases.  
  4. **Real-World Link**: *"This is why democracies keep monarchies: they store 'spare legitimacy' for emergencies."*  

  #### **Predictable First-Run Failure & Recovery**  
  - **Failure**: Council may ignore the Crown or invoke it immediately.  
    - **Recovery**: If Crown is invoked early, Clerk says: *"Tradition forbids hasty use. Finish Round 1 first."* If ignored, reveal in debrief: *"You missed the Crown’s role. Real societies forget their reserves too."*  
  - **Crown Mistakes**: If Crown speaks prematurely, Clerk imposes a "constitutional crisis" penalty (–1℗).  

  #### **Unreproducible Feature (Facilitator Must Explain)**  
  - **Historical Sedimentation**: *"In real life, monarchies draw legitimacy from centuries of culture, religion, and shared myths. Our Crown is just a person with an envelope—you must imagine 1,000 years of tradition behind that sash."*  

  ---

  ### JSON Summary  
  ```json
  {
    "activity_title": "The Crown's Mandate: Crisis in Veridia",
    "group_size_and_duration": "15 participants (12 Council, 1 Crown, 1 Speaker, 1 Facilitator); 90 minutes total (Setup: 15 min, Round 1: 20 min, Round 2: 20 min, Debrief: 20 min, buffer: 15 min)",
    "roles_and_materials": "Roles: 4 Faction Groups (3 each), Crown (holds sealed mandate), Speaker (chairs debate), Facilitator (Clerk). Materials: Faction role cards, timer, voting slips, sealed envelope (pre-written endorsement), whiteboard, Crown's symbolic sash.",
    "core_mechanism_that_reveals_the_idea": "Low acceptance after democratic vote exposes legitimacy deficits; Crown's identical endorsement (activated only by supermajority) boosts acceptance via psychological weight and bonus points, proving reserve authority's role in 'backstopping' democracy.",
    "debrief_mapping": {
      "Round 1 deadlock/frustration": "Democratic legitimacy feeling insufficient in crisis.",
      "⅔ threshold to invoke Crown": "Reserve authority is dormant and exceptional.",
      "Post-Crown acceptance surge": "Authorization redundancy lending legitimacy without new facts.",
      "Crown's triple-weighted vote": "Symbolic power of monarchy outweighing individual voices."
    },
    "predictable_first_run_failure": "Participants may invoke Crown too early or ignore it entirely; Crown may break silence. Facilitator recovers by enforcing rules (penalties, redos) and framing mistakes as learning moments.",
    "unreproducible_feature_the_facilitator_must_supply": "The monarchy's historical sedimentation (centuries of cultural/religious tradition creating 'automatic' legitimacy) must be narrated; the envelope alone cannot replicate this depth."
  }
  ```  

  ### How the Idea Emerges  
  - **Frustration First**: Round 1 forces players to feel democracy’s limits—votes feel "hollow" without broad buy-in.  
  - **Redundancy Revealed**: The Crown’s endorsement (identical to Round 1’s decision) is accepted because it comes from a *pre-authorized*, non-electoral source. Players experience how "reserve legitimacy" calms crises.  
  - **No Lectures Needed**: The point system and triple-vote mechanic make the Crown’s power tangible. Debrief connects dots.  

  **Final Tip**: Start energetically—say, *"Veridia’s grid is failing. You have 20 minutes to save it!"* The stakes feel real because the group’s rewards (℗) are collective and immediate.
