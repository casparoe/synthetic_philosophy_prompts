  But is this asymmetric treatment justified? Conceptually, yes - because perpetrator remembrance carries unique risks of misdirected moral contagion. Unlike victim commemoration which bonds through solidarity, public shaming of collaborators' descendants could fracture social cohesion. The key distinction lies in the direction of moral responsibility: victims inherit righteousness, perpetrators inherit stigma. 

  This case reveals how ethical remembrance isn't binary. The duty to remember operates dimensionally: truth-preservation (archiving) vs. moral pedagogy (public display). The institution navigates this by separating documentation from spectacle. Smart solution, actually - it avoids Rieff's "therapeutic forgetting" critique while mitigating Margalit's bonding mechanism only where it might cause harm. 

