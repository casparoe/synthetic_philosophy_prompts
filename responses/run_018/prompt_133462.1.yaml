  First, I need to unpack the core distinction: Margalit sees shared memory of atrocities as creating civic bonds through moral witness, while Rieff argues modern therapy culture promotes forgetting to liberate society from paralyzing historical burdens. This tension is fascinating - it's essentially ethics of obligation versus pragmatics of healing.

