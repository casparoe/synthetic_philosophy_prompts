  Hey — I'm writing a feature for my newsletter about how Hofstadter's frame/outer/inner message layers in GEB map onto viral memes, and I want to teach the concept to non-philosophy readers in about ten minutes. Don't explain it to me; plan the arc. What idea has to land first so they don't conflate frame with context? What's the one carrying example — not the formal-system one everyone uses, but a meme that collapses if you miss the inner layer — and what must it have and lack? I expect they'll think 'inner message' just means hidden irony; where exactly do I head that off? Give me one closing check that shows they grasp the dependancy between layers, not just the vocabulary. And tell me which part of the self-reference machinery I should openly skip and say so.
