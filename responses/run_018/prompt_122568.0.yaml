prompt: |-
  So this is a stupid way to get dragged into philosophy, but here we are. My brother-in-law is on a county endangered-species review panel, and because I have a reputation for being "good with words" he asked me to help with the bit of their report that has to say what a species even is. Two people on the panel mailing list have been going at each other for about a year:

  - a pluralist: there is no single correct species category; the interbreeding concept, the diagnosability/phylogenetic concept and the ecological concept are all legitimate, and which one you use depends on what question you're asking;
  - a monist of the general-lineage sort: there is exactly one species category, segments of metapopulation lineages, and the other concepts are only operational criteria for detecting those, and they can mislead.

  They've finally agreed to do an adversarial collaboration and I volunteered to produce the document, so I need it drafted properly. The population they actually have to rule on is a mess: five populations of a flightless ground beetle along one ridge, call them A through E. Neighbours interbreed freely where they meet; A and E don't interbreed at all where the ridge loops back on itself; mitochondrial DNA puts A+B+C in one clade and D+E in another, cutting right across the interbreeding pattern; and C carries a chromosomal inversion that keeps it looking distinct even where it swaps genes with B. Every concept gives a different count. I've also been pushing a move of my own on them, which I call the swap test: take a delimitation produced under one concept, hand it to somebody working under a different one, ask them to predict an unmeasured trait of one population from the traits of the others in the group, and score how often the prediction survives. I think both of them should have to state in advance what they expect that to show.

  What I want: a numbered section of claims both of them can sign (about what the concepts actually do, about what a species category is supposed to deliver for conservation law, about the beetle case itself), then a table of the remaining disagreements where each row gives the pluralist's version and the monist's version in wording each side would accept for itself, then the cruxes, and for each crux a case or piece of evidence both accept as bearing on it, with each side's prediction written down before the fact. Use the beetle case and the swap test wherever they genuinely bite. My guesses at cruxes, which you can overrule: whether there is a fact of the matter about species boundaries independent of our investigative interests, and whether a criterion that tracks lineage separation is automatically the better one. One of them also keeps insisting that species are individuals rather than classes and I can't tell if that's part of this fight or a separate one — sort that out for me. And if any of the arguing was only about the word "species", say which part and why.

  Please make it something both of them could actually put their names to, keep it tight rather than exhaustive, and write in American English. End with a single last line that reads "Summary:" followed by one sentence.
reasoning: |-
  We are drafting a section of a report for a county endangered-species review panel. The goal is to produce a document that both a pluralist and a monist (of the general-lineage variety) can sign. The document should include:
  1. A numbered section of agreed-upon claims about concepts, the purpose of species in conservation law, and the beetle case.
  2. A table of remaining disagreements, with each row presenting the pluralist's view and the monist's view in wording they accept.
  3. The cruxes (key points of disagreement) and for each crux, a piece of evidence (like the beetle case or swap test) that both accept as bearing on it, with each side's prediction written in advance.

  Cruxes suggested (but can be overruled):
  - Whether there is a fact of the matter about species boundaries independent of our investigative interests.
  - Whether a criterion that tracks lineage separation is automatically the better one.

  Also, address the issue of whether species are individuals or classes and if it's part of this fight.

  Finally, end with a one-sentence summary.

  Approach:

  A. Agreed Claims (numbered):
     - About concepts: Both can agree that the interbreeding, diagnosability/phylogenetic, and ecological concepts are used in science and have different strengths. They might also agree that these concepts can lead to different groupings in practice.
     - About the purpose in conservation law: The species category in conservation law serves to identify units that are evolutionarily significant and warrant protection because they represent unique lineage, genetic diversity, or ecological roles.
     - About the beetle case: The five beetle populations (A-E) show complex patterns: interbreeding between neighbors but not between A and E, mitochondrial clades splitting A+B+C and D+E, and a chromosomal inversion in C. Each concept gives a different count and grouping.

  B. Table of Disagreements:
     We'll have a table with three columns: Issue, Pluralist's Position, Monist's Position.

     Issues:
     1. Nature of the species category: Is there one correct category?
     2. Role of operational criteria: Are the other concepts merely operational criteria for detecting the one true category (segments of metapopulation lineages) or are they equally valid?
     3. Dependence on investigative interests: Is the choice of concept dependent on the question being asked?

     For each, write the position in the words each side would accept.

  C. Cruxes:
     We'll list the cruxes and for each:
     - State the crux.
     - Identify a test case or evidence (the beetle case or swap test) that both accept as bearing on it.
     - State each side's prediction in advance.

     Crux 1: Whether there is a fact of the matter about species boundaries independent of our investigative interests.
        - Test: Swap test on the beetle populations. Take a grouping from one concept (e.g., interbreeding) and use it to predict an unmeasured trait (e.g., a genetic marker or ecological trait) and see if the prediction holds. Then do the same for groupings from other concepts.
          - Pluralist: Predicts that the swap test will show that different groupings (from different concepts) are better for predicting different kinds of traits (e.g., interbreeding groups predict gene flow, phylogenetic groups predict shared ancestry traits). There is no single fact because the best grouping depends on the trait of interest.
          - Monist: Predicts that the grouping based on the general-lineage concept (metapopulation lineages) will be the best or equally good for predicting a wide range of traits because it represents the underlying reality of lineage separation.

     Crux 2: Whether a criterion that tracks lineage separation is automatically the better one.
        - Evidence: The beetle case. The mitochondrial DNA shows a split between A+B+C and D+E, but interbreeding occurs between A-B, B-C, C-D, D-E (except A and E). The chromosomal inversion in C might indicate lineage separation or just local adaptation.
          - Pluralist: Predicts that in some contexts (e.g., conservation of genetic diversity) the phylogenetic criterion might be better, but in others (e.g., assessing reproductive compatibility) the interbreeding criterion is better. Lineage separation isn't automatically better; it depends on the goal.
          - Monist: Predicts that the lineage separation (as tracked by the general-lineage concept) will be the most fundamental and that other criteria (like interbreeding) are only proxies that can sometimes mislead (as seen in the beetle case where interbreeding suggests continuity but mitochondrial DNA shows a split).

  D. Species as individuals vs. classes:
     - This is a separate issue. The debate is about the ontological status of species (whether they are spatiotemporally bounded entities like individuals or abstract categories like classes). Both the pluralist and monist in this context could agree that species are individuals (lineages) without resolving their disagreement about how to delimit them. The monist might be more aligned with the individuality thesis because it emphasizes the lineage, but the pluralist can also accept that the units they are delimiting (under any concept) are segments of lineages. Thus, it's not a core part of this fight.

  E. Summary: One sentence at the end.

  Structure the document:

  I. Agreed Claims
     [Numbered list]

  II. Table of Remaining Disagreements

  | Issue | Pluralist's Position | Monist's Position |
  |-------|----------------------|-------------------|
  | 1. ... | ... | ... |
  | 2. ... | ... | ... |

  III. Cruxes

  Crux 1: [Description]
