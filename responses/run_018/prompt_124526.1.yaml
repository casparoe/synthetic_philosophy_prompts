prompt: |-
  I'm a high school student in an advanced philosophy seminar, and we've been discussing whether categories like race or gender are socially constructed. I keep returning to money, since everyone agrees a dollar bill is just paper and ink, yet we treat it as having real value that survives the destruction of any particular bill. Still, I'm puzzled by an apparent inconsistency in how institutions actually manage different forms of it, and I want to know what hidden theory of value makes the inconsistency look acceptable.

  Consider the cluster of practices that govern physical cash, digital balances, and proposed central-bank digital currencies. In many jurisdictions, a torn banknote can be redeemed at a central bank if more than half remains, suggesting the value belongs to the token-type rather than to that specific piece of paper; yet a bent or defaced coin is typically withdrawn and melted without compensation, as if its material form were essential. Meanwhile, when a bank corrects a duplicated digital balance, it restores the amount precisely to the cent, treating digital money as pure information that must be preserved exactly, even though physical cash remains an anonymous bearer instrument whose loss is never tracked. Now add a newer design proposal: some central-bank digital currencies are being developed with embedded conditions—such as expiration after a set date or restrictions to specific merchants—programmed directly into individual units, something physically impossible with paper bills, yet both the programmable token and the paper note are legally designated as the same fungible currency.

  What philosophical commitments about the kind "money" does this cluster of practices presuppose? Does it assume that money is essentially a social relation that can be instantiated in any material form, or does it implicitly treat physical cash, corrected digital entries, and programmable tokens as belonging to different ontological kinds despite the legal fiction that they are all identical dollars? Reconstruct the implicit theory of value and kind-identity that makes these asymmetries coherent, distinguish what the practices strictly require from what merely fits them well, and say whether the introduction of programmable digital currency forces a revision in how we understand the social construction of monetary kinds. Please present your answer as a numbered list with exactly five items, each consisting of one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a high school student in an advanced philosophy seminar exploring how social constructs like money function. They're particularly focused on inconsistencies in how different forms of money (cash, digital, CBDCs) are treated institutionally. 

  Hmm, their core puzzle lies in reconciling three phenomena: how physical cash gets partial redemption when damaged (suggesting the value is in the type), coins get destroyed without compensation (implying material matters), digital errors get corrected precisely (treating money as pure information), while programmable CBDCs add conditional logic to individual units. They want to know what underlying theory of value makes these contradictions coherent.

  The student is clearly sharp - they've noticed institutional practices reveal hidden ontological commitments. Their examples are well-chosen: the half-bill redemption versus melted coin shows how even physical money isn't treated uniformly. The digital correction versus cash anonymity highlights the bearer-instrument paradox. And CBDCs introduce programmable conditions that fracture fungibility. 

  I need to reconstruct the implicit framework binding these practices. First, value must be anchored in institutional recognition rather than materiality, since even destroyed bills can be replaced. Second, material form only matters when it enables verification - hence coins being melted if defaced (harder to authenticate) versus bills with serial numbers. Third, digital money's precision reflects its existence as accounting entries. Fourth, fungibility is conditional on functional equivalence - programmable CBDCs might challenge this. Fifth, social construction is dynamic - CBDCs don't break money's nature but stretch its implementation.

  The user's deeper ask might be whether money's social construct status means it's infinitely malleable. My response should show that institutional practices reveal money as a relational entity, with material forms as contingent vessels. The CBDC question is key: programmability tests whether "same currency" can tolerate non-fungible units. Answer: yes, as long as institutions maintain the fiction of equivalence where functionally possible.

  I'll structure this as five crisp theses without intros/conclusions per their request. Each point must stand alone while building the argument. The challenge is distilling complex philosophy of money into ten sentences max!
answer: |-
  Here is the numbered list as requested:

  1.  Money's core value depends solely on institutional recognition and collective acceptance, not material substrate; this allows value to persist despite the destruction of specific tokens (redeeming torn bills) or pure informational existence (digital balances).
  2.  The required material form is only instrumentally significant for verification and trust; coins are melted when defaced because their material integrity is the primary verification mechanism, unlike bills with serial numbers or digital entries with audit trails.
  3.  Digital money strictly requires being an exact accounting entry within a centralized system, demanding precise correction to maintain the system's integrity and trust, whereas physical cash, as a bearer instrument, relies on anonymity and fungibility, accepting loss as inherent to its decentralized design.
  4.  Fungibility is legally assumed based on functional equivalence within a system (all dollars trade equally *when operational*), not strict identity; programmable CBDCs introduce conditional logic per unit but maintain fungibility within their programmed parameters, fitting the model if conditions are standardized and predictable.
  5.  Programmable digital currency does not force a revision of money's socially constructed nature but exposes its flexibility; it extends the kind "money" to include units with embedded rules, demanding new institutional practices while still relying on the foundational commitment to recognized value and systemic trust.
