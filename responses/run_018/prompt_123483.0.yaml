prompt: |-
  I'm taking a course on moral philosophy and we've hit a wall. For like three sessions we've been bouncing between Judith Thomson's violinist case—where you're not obligated to stay hooked up to save the violinist—and Don Marquis's future-like-ours argument, which says abortion is wrong because it deprives the fetus of a valuable future. The class splits every time: half say bodily autonomy makes pregnancy different, half say the future-value logic applies regardless of location inside a body. What's weird is that nobody disputes the fetal development timeline, and nobody denies that suffering is bad. So why is this stalled?

  My hunch is that the real disagreement is hidden behind talk about 'persons.' One side treats the fetus as an external agent that the mother is being forced to sustain—like the violinist—while the other treats pregnancy as a case of 'constitutive dependancy,' where the fetus isn't an intruder using her body but part of a shared biological system that only she can maintain. If that's right, then they're not really disagreeing about rights; they're disagreeing about what counts as one's body-boundry and whether dependency can be non-instrumental. But maybe I'm wrong and it's just bedrock intuition about natural processes versus artificial life-support. Can you diagnose what's actually happening here? Is it verbal—are they using 'harm' differently? Is there a hidden empirical claim about identity or consciousness? Or are they answering different questions—one about permissibility, one about wrongness? And be honest: given your diagnosis, is there anything that could actually move the needle, or is this one of those debates where progress is impossible?

  Please structure your answer like this:
  - The diagnosis: what kind of stall is this? (around 350 words)
  - What each side actually assumes (around 250 words): unpack the autonomy vs future-value framing using the dependancy distinction.
  - What progress would look like (around 200 words): a conceptual distinction, an empirical result, or a reframing?
  - Bottom line: can it move? (around 150 words)
