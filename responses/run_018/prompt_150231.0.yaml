  The user wants three things: 1) the established term for this issue, 2) how it differs from mere dishonesty, and 3) a newly coined term if no perfect one exists. They're intellectually serious - notice how they provided concrete examples about promise-breaking with varying granularity. Their frustration with "just listing books" suggests they've already encountered unhelpful academic responses.

  Hmm... the core challenge here is distinguishing between legitimate contextual sensitivity versus manipulative framing. Kant himself struggled with this in the Groundwork when discussing false promises. The user's "unique emergency" example perfectly illustrates the loophole: if we make maxims hyper-specific, any action becomes universalizable since nobody else shares that exact circumstance. 

  But this isn't just equivocation. Equivocation would be secretly changing meanings mid-argument. Here, both parties agree on the sliding scale - the disagreement is about where to set the dial. That's why existing terms like "description relativity" feel inadequate. 

  For coining a new term... "Granularity Arbitrage" captures the idea of strategically selecting resolution levels to gain advantage. The financial metaphor implies exploiting a systemic gap. The boundaries would be: it stops being arbitrage when specificity is objectively required (e.g., "emergencies" vs. "Thursday emergencies") and starts being equivocation when definitions shift covertly. 

  User seems analytically sharp - they'll appreciate the "deontic loophole" angle. Should emphasize that Kant intended maxims to reflect rational principles, not ad hoc excuses. Might add that contemporary Kantians like Korsgaard address this through "practical identity" considerations, but the user explicitly wants minimal citations. 

