answer: |-
  You've hit on one of the most persistent and well-known critiques of Kant's universalizability test: **the problem of maxim description specificity**. Here's the breakdown, including the established terminology and a newly coined term with boundaries:

  ### 1. **Established Name: The "Description Problem" or "Maxim-Framing Problem"**
     - This is the standard philosophical term for the issue you’re describing. It highlights how the *wording* and *level of detail* in a maxim can manipulate whether it passes or fails the universalizability test.  
     - **Why it’s not just "being sneaky"**:  
       - Sneakiness implies *intentional deception*. The description problem is structural: Kant’s test lacks objective criteria for how general or specific a maxim *should* be. Even an honest person can frame the same action in multiple valid-sounding ways (e.g., "breaking promises in emergencies" vs. "breaking promises on Thursday at 3 PM").  
       - Kant assumed maxims reflect an agent’s *underlying principle* (e.g., self-interest vs. duty), but he didn’t provide a test to verify if a maxim is described authentically.

  ### 2. **Why Granularity Decides Contradiction**
     - **Hyper-specific maxims** (e.g., *"I’ll break my promise to Alice at 3 PM on 6/12 because my dog is sick and I’m the only one who can take him to the vet"*) almost *never* generate contradictions when universalized. No one else occupies your exact spatiotemporal/contextual niche.  
     - **Hyper-general maxims** (e.g., *"Break promises whenever convenient"*) *always* fail. Society collapses if everyone follows this.  
     - **The "Sweet Spot" Problem**: Kant implies maxims should describe the act’s *rationally relevant features* (e.g., emergency, not the day of the week). But what counts as "relevant" is subjective and open to bias.

  ### 3. **A New Term: "Granularity Arbitrage"**
     - **Definition**: *The strategic manipulation of a maxim's scope or detail to engineer a desired outcome in the universalizability test, exploiting Kant's lack of framing criteria.*  
     - **Boundaries**:  
       - **Starts**: When an agent adjusts specificity *to avoid* a contradiction they’d otherwise face (e.g., adding "on Thursday" to dodge the collapse of promising).  
       - **Stops**: When specificity is **objectively morally relevant** (e.g., "lying to save a life" vs. "lying for fun"). Here, granularity reflects context Kant would endorse (e.g., emergencies as exceptions).  
     - **Difference from Equivocation**:  
       - **Equivocation**: Ambiguous wordplay (e.g., "I ‘promised’ but crossed my fingers"). This is linguistic trickery.  
       - **Granularity Arbitrage**: Structurally gaming the test by expanding/contracting the maxim’s scope *without* changing core facts. It’s a **deontic loophole**, not a semantic one.

  ### 4. **Kant’s (Inadequate) Solution & Modern Fixes**
     - Kant argued agents must describe maxims in "terms the agent would will to be universal" (*Groundwork*), but this is circular.  
     - Modern Kantians (e.g., Onora O’Neill) propose:  
       - **Test multiple descriptions**: If *any* plausible framing fails, the act is immoral.  
       - **Focus on fundamental intentions**: Does the maxim reflect respect for others’ autonomy? (e.g., "Breaking promises for selfish gain" fails, even if hyper-specific).  
     - **Weakness**: Bias persists. Selfish agents will *only* test favorable descriptions.

  ### Key Insight
  The problem exposes a flaw in Kant’s formalism: **morality shouldn’t hinge on descriptive linguistics**. Your friend’s "unique emergency" maxim exploits this. A Kantian *should* reject it by arguing the maxim’s core principle is *"prioritize self-interest over commitments to others when inconvenient"*—which *does* fail universalization. But enforcing that requires judging intent, which Kant’s test alone can’t do.

  **In short**: You’ve identified the **Description Problem**. "Granularity Arbitrage" names the *act* of manipulating specificity to rig the test. It stops being arbitrage when specificity tracks *objective moral relevance* (e.g., emergencies), not incidental details (Thursdays).
