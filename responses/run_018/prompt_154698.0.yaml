prompt: |-
  ok so me and my roommate had this huge fight last night after we finished that indie rpg where you can permanently wipe a companions save file to unlock the true ending. he says its just code so who cares, but i kept thinking about how the game spent 30 hours making me treat her choices as genuinely autonomus. now im a narrative ethics reviewer at a tiny studio and i actually need a reusable procedure i can run in like 20 mins on proposed character arcs that involve irreversible harm, deletion, or forced betrayal. i want to base it on the idea that fictional characters gain moral weight not through suffering but through what im calling recursive identification residue — basically the structural invitation for the player to treat the characters agency as non-scripted and self-directed, accumulated over playtime. write me a word-flowchart: the ordered questions, what counts as enough answer for each, where it halts with a no, where it kicks the decision to human values instead of facts, and where it will definately misfire. apply it to three proposals: (1) an optional quest where you can erase a companions memory so they never leave the party, (2) a mandatory story death framed as the characters own noble sacrifice but the player cant stop it, and (3) a roguelike where every run spawns a unique family of NPCs with custom dialogue that gets permanently deleted on permadeath. include one where the procedure gives an answer id hate, and say what it cant do. keep it practical — my lead designer has to sign off and she doesnt read philosophy, and i do maybe four of these a week with no research budget.
reasoning: |-
  Okay, I see the user's request. They want a reusable procedure for evaluating narrative ethics in character arcs involving irreversible harm. The key concept is "recursive identification residue" – the idea that players start treating characters as autonomous entities due to structural cues in the game.

  The user needs something practical they can use in 20 minutes without research. Their lead designer isn't philosophical, so the tool must be straightforward. They mentioned three examples: an optional memory wipe, a mandatory noble sacrifice, and a roguelike with permadeath NPCs.

  Hmm, how to structure this... A flowchart format with yes/no questions makes sense. Each question should be concrete enough for quick assessment but capture the essence of recursive identification. 

  First question should establish if the character feels autonomous. Things like scripted dialogue choices or persistent personality traits would count. If not, the character has low moral weight under this framework.

  Second question: does the harm involve permanent removal of agency? Death, deletion, or forced betrayal would qualify. Optional cosmetic changes probably wouldn't.

  Third question: is the harm optional? Player choice matters here. But need to watch for false choices disguised as optional.

  Fourth question: does the game acknowledge the ethical weight? Tone and consequences matter. A throwaway gag versus solemn music makes a difference.

  For the examples: 
  The memory wipe quest passes Q1 and Q2 but fails at Q3 (optional) and Q4 (probably no reflection). Flag as high risk. 

  The mandatory death... tricky. Passes Q1-Q2 but fails Q3 (not optional). However Q4 might save it if handled respectfully. Kick to human judgment.

  The roguelike NPCs fail Q1 because they're disposable by design. Low risk under this model – though the user might dislike this outcome. 

  Important to note limitations: can't handle systemic issues like grinding mechanics punishing failure. And sometimes human judgment is unavoidable.

  Should include a "Red Flags" section for when the tool misfires. Like when harm is played for laughs despite ticking boxes. Also warn about "torture porn" scenarios where suffering is the point.

  Keep language simple. Avoid terms like "phenomenology." Use "player investment" instead. Make it fit on one page – they do four reviews weekly.
answer: |-
  Here's a practical, reusable "Narrative Ethics Flowchart" based on Recursive Identification Residue (RIR), designed for a 20-minute assessment. It focuses on concrete game elements and player experience rather than abstract philosophy.

  **Core Principle:** RIR builds when the game's structure repeatedly invites the player to perceive and treat a character as possessing genuine internal agency and self-direction, beyond simple scripting. Harm to characters with high RIR carries more ethical weight.

  **The Flowchart: "RIR Harm Assessment"**

  1.  **QUESTION 1: "Does the game consistently present this character with traits/choices implying INTERNAL AGENCY?"**
      *   *Look For:* Dialogue choices reflecting *their* personality (not just player prompts), persistent goals/motivations shown through actions, reactions to events that feel character-driven, moments where they surprise the player (within established personality), consistent personality core.
      *   *"Enough" Answer:* **YES** - If at least 3 distinct examples exist *before the harm event* (e.g., unique dialogue trees, quest decisions they influence, observable routines, expressed desires).
      *   *"Halt & Red Flag" Answer:* **NO** - Character is purely functional (vendor, quest giver with no depth), comic relief without internal logic, or entirely reactive with no initiative. *Ethical Risk: LOW (Proceed with caution, but likely acceptable within genre norms).*
      *   *Kick to Human Values:* Ambiguous cases (e.g., character has potential but limited screen time). Requires judgment on significance.

  2.  **QUESTION 2: "Does the proposed harm involve PERMANENT REMOVAL OF AGENCY or FORCED BETRAYAL of their core identity/relationships?"**
      *   *Look For:* Death, permanent deletion (save wipe), irreversible mind control/alteration (memory wipe, personality rewrite), forcing them to act against established loyalties/values *without player consent*.
      *   *"Enough" Answer:* **YES** - Harm explicitly removes their ability to act/choose or fundamentally violates who they are presented to be.
      *   *"Halt & Green Light" Answer:* **NO** - Harm is temporary, reversible (respawn, cure), cosmetic, or doesn't violate core identity (e.g., tough choice *they* make willingly). *Ethical Risk: LOW (Proceed, standard narrative stakes).*
      *   *Kick to Human Values:* "Soft" removal (exile, coma) or betrayal with complex context. Requires judgment on severity.

  3.  **QUESTION 3: "Is the harm OPTIONAL for the player? (Meaningful choice exists)"**
      *   *Look For:* Player has a clear, viable alternative path that avoids the harm. The choice has weight (consequences).
      *   *"Enough" Answer:* **YES** - Player can choose harm or no harm. Alternatives are meaningful (not just "fail state").
      *   *"Halt & Yellow Flag" Answer:* **NO** - Harm is mandatory for progression, the "only" path, or the alternative is functionally identical (illusion of choice). *Ethical Risk: MEDIUM/HIGH (Requires strong justification in Q4).*
      *   *Kick to Human Values:* "False" optionality (one choice is heavily punished/game-over), or harm triggered by failure state. Requires judgment on player perception.

  4.  **QUESTION 4: "Does the game explicitly ACKNOWLEDGE THE ETHICAL WEIGHT of the harm through tone, consequence, or reflection?"**
      *   *Look For:* Narrative gravity (not played for laughs), emotional fallout (character reactions, world impact), gameplay consequences (loss of abilities/access), opportunity for player reflection (dialogue, journal, quiet moment), avoids glorifying the harm.
      *   *"Enough" Answer:* **YES** - At least two distinct acknowledgments exist (e.g., somber music + companion reactions + permanent gameplay change).
      *   *"Halt & Red Flag" Answer:* **NO** - Harm is glossed over, trivialized, treated as purely utilitarian ("just code"), or actively rewarded without counterpoint. *Ethical Risk: HIGH (Strongly recommend redesign/reconsideration).*
      *   *Kick to Human Values:* Tone is ambiguous or consequences are subtle/nuanced. Requires judgment on effectiveness.

  **Where it Halts:**
  *   **GREEN LIGHT:** Q1=NO OR Q2=NO. (Low RIR or Harm not severe).
  *   **YELLOW FLAG:** Q3=NO. (Mandatory Harm - Needs strong Q4).
  *   **RED FLAG:** Q1=YES + Q2=YES + Q4=NO. (High RIR, Severe Harm, No Acknowledgement).
  *   **Requires Human Judgment:** Any "Kick" point.

  **Where it Misfires:**
  *   **Comedy/Satire:** Characters designed as absurd or disposable (Low RIR intended). Flagging harm here might be overkill.
  *   **Player Projection:** A player might attach RIR to a purely functional NPC. The tool assesses *design intent*, not individual psychology.
  *   **Systemic Harm:** Grinding, resource loss, or permadeath affecting the *player character* (not NPCs with RIR).
  *   **"Torture Porn":** Excessive, graphic suffering *without* RIR might be tasteless but wouldn't flag highly here. (Needs other guidelines).

  **Applying the Flowchart:**

  1.  **Optional Memory Wipe Quest:**
      *   Q1: **YES.** Companion has dialogue, opinions, quests, likely reacts to the player. High RIR built.
      *   Q2: **YES.** Permanent removal of core memories/identity is severe agency loss.
      *   Q3: **YES.** Harm is *optional*. Player chooses.
      *   Q4: **???** CRITICAL. *Does the game show this as horrific?* Does the companion seem "broken"? Are there negative consequences? Or is it framed as a happy solution? **Kick to Human Values.** If Q4=NO, **RED FLAG.** If Q4=YES, proceed but ensure weight is heavy enough. *Recommendation:* Mandate strong Q4 elements.

  2.  **Mandatory Noble Sacrifice:**
      *   Q1: **YES.** Character is central, has agency shown.
      *   Q2: **YES.** Death is ultimate agency removal.
      *   Q3: **NO.** Player cannot prevent it. Mandatory.
      *   *Result: YELLOW FLAG.* Proceed to Q4.
      *   Q4: **???** *Is the sacrifice framed solely as noble?* Does the game allow grief? Are there lasting consequences reflecting the loss? **Kick to Human Values.** If Q4=YES (deeply explored, impactful), likely acceptable (though some players will *hate* it, that's narrative). If Q4=NO (quick, glorified, no fallout), **RED FLAG.**

  3.  **Roguelike Permadeath Families:**
      *   Q1: **NO.** Each family is unique *per run*, but likely lacks *persistent* traits/choices building RIR *across runs*. They are procedurally generated vignettes. Player hasn't invested in *this specific* family's long-term agency.
      *   *Result: GREEN LIGHT (Low RIR).* Harm (deletion) is core to the roguelike genre mechanic. Proceed.

  **The Answer You'll Hate (Procedure Working Correctly):**
  *   **Scenario:** A beloved, deeply developed companion (High RIR - Q1=YES) has a mandatory, non-optional betrayal forced on them by the story (Q2=YES, Q3=NO). However, the game handles it *exquisitely* - it's devastating, has massive narrative and gameplay consequences, characters are traumatized, and it's the emotional climax (Q4=YES).
  *   **Procedure Result:** YELLOW FLAG at Q3, but strong Q4 justification via Human Judgment leads to **"Acceptable, but high-risk."**
  *   **Why you might hate it:** You personally find mandatory betrayal of high-RIR companions unacceptable, regardless of handling. The procedure acknowledges the risk but allows it *if* the ethical weight is fully shouldered by the narrative. It prioritizes design intent and player experience over absolute prohibitions.

  **What It Can't Do:**
  1.  **Judge Subjective "Quality" or "Taste":** It flags *risk*, not whether an arc is "good" or "bad" writing.
  2.  **Replace Broader Sensitivity Reads:** Doesn't catch issues like harmful stereotypes, trauma triggers, or cultural insensitivity unrelated to RIR.
  3.  **Quantify "Enough" Suffering:** Focuses on agency, not pain levels.
  4.  **Solve Player Entitlement:** A player might *still* treat a low-RIR character as sacred. The tool assesses design, not all player reactions.
  5.  **Handle "Emergent" RIR:** Unintended deep player attachment to minor NPCs isn't predicted here.

  **Practical Delivery:**
  *   **Format:** A literal flowchart graphic (boxes/diamonds, arrows) is best. Use simple language in the boxes (like above).
  *   **Report:** For each review: List proposals, run the flowchart step-by-step for each, note Halts/Kicks, and give a clear recommendation (Green / Yellow - Needs Q4 Justification / Red - Redesign Advised).
  *   **Selling it to Lead Designer:** Frame it as **Risk Mitigation:** "This helps us avoid player backlash by identifying narrative choices that might feel exploitative or betray player investment. It's based on observable game elements, not abstract ethics. It flags potential problems early so we can handle them thoughtfully." Emphasize the 20-min speed and concrete examples.

  This gives you a defensible, reusable process grounded in your core concept, focused on practical implementation, and manageable within your constraints. Good luck!
