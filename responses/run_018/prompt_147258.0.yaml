     - Required information: The brief's literature review and discussion of limitations.
     - Judgment call: The referee must determine the level of expert consensus. If the brief explicitly mentions disputes, that is straightforward. If not, the referee must use judgment to recall if there are known disputes without leaving the audit (i.e., without looking up new information beyond the brief).

  **Step 6: Apply the norms of assertion (branching).**
