answer: |-
  ### Assertion Audit Procedural Checklist

  **Design Constraints**  
  - Executable in ≤15 minutes  
  - No access to author mental states or ground-truth databases  
  - Documents all judgment calls requiring referee sign-off  
  - Handles three hard cases: unpublished preprints/small-sample studies; disputed modeling parameters; believed-but-unestablished claims  
  - Outputs:  
    - A: Assertible without qualification  
    - B: Assertible only in conditional/hedged form  
    - C: Not assertible—revise to weaker claim  
    - D: Not assertible—withhold publication pending evidence  

  **Procedure**  
  1. **Extract Central Empirical Claim**  
     - *Test:* Identify the primary factual proposition in the brief’s abstract/conclusion.  
     - *Required:* Full brief text.  
     - *Judgment call:* If multiple/ambiguous claims exist, referee must specify the single testable claim.  

  2. **Assess Author Belief**  
     - *Test:* Scan for explicit belief markers (e.g., "we conclude," "evidence establishes") or disclaimers (e.g., "we speculate," "not yet proven").  
     - *Required:* Introduction, discussion, and conclusion sections.  
     - *Judgment call:* Referee decides if language implies sincere belief (no call if unambiguous).  

  3. **Classify Evidence Robustness**  
     - *Test:* Categorize evidence as:  
       - Tier 1: Multiple peer-reviewed replications or meta-analyses.  
       - Tier 2: Single peer-reviewed study/preprint with ≥100 subjects or validated methods.  
       - Tier 3: Single small-sample study/unpublished preprint/modeling with disputed parameters.  
       - Tier 4: Anecdotal/ethnographic data with contested interpretations.  
     - *Required:* Methods section and references.  
     - *Judgment call:* Referee assigns tier based on sample size, methodology, and publication status.  

  4. **Evaluate Corroboration**  
     - *Test:* Check for ≥1 independent replication (different authors/datasets) supporting the claim.  
     - *Required:* Reference list.  
     - *Judgment call:* Referee determines if cited studies qualify as independent (no call if unambiguous).  

  5. **Map Expert Consensus**  
     - *Test:* Identify if the brief acknowledges disputes (e.g., "some models disagree," "alternative interpretations exist").  
     - *Required:* Literature review and limitations sections.  
     - *Judgment call:* If disputes are unmentioned but referee knows of controversies, flag as "high-dispute" (call required).  

  6. **Apply Assertion Norms**  
     - *Test:* Branch using logic:  
       - A: Tier 1 evidence + independent corroboration + no disputes.  
       - B: Tier 2 evidence OR (Tier 3 + low disputes) OR author-applied hedging.  
       - C: Author lacks belief OR (Tier 3/4 + high disputes + unhedged claim).  
       - D: Tier 4 evidence + no independent support + high disputes.  
     - *Required:* Outputs from Steps 2–5.  
     - *Judgment call:* Referee sets "low/high dispute" threshold.  

  7. **Downstream Liability Specification**  
     - *Test:* Define:  
       - *Trigger:* Peer-reviewed contradictory evidence published within 12 months.  
       - *Responsible party:* Author (or journal if author unresponsive).  
       - *Correction form:*  
         - A: Retraction.  
         - B: Update with new evidence appendix.  
         - C/D: Not applicable (claim not asserted).  
     - *Required:* Output from Step 6.  
     - *Judgment call:* Referee tailors correction form to claim specificity.  

  8. **Final Output**  
     - *Test:* Compile results from Steps 6–7 into audit report.  
     - *Required:* All prior steps.  

  ---

  ### Application to Hypothetical Briefs  

  #### **Brief 1: Dietary Supplement Pilot Study**  
  - **Central claim:** "Supplement X improves working memory in older adults."  
  - **Step 1:** Claim extracted.  
  - **Step 2:** Belief inferred (no disclaimers).  
  - **Step 3:** Tier 3 (single study, n=40, no protocol).  
  - **Step 4:** No independent corroboration.  
  - **Step 5:** No disputes acknowledged; referee flags "high-dispute" (judgment: small samples prone to false positives).  
  - **Step 6:** **Output D** (Tier 3 + high disputes).  
  - **Step 7:** N/A (withheld).  
  - **Step 8:** Final: **D** (withhold publication).  
  - **Judgment call:** Step 5 (dispute inference).  
  - **Misfire without judgment:** Mechanical application might ignore small-sample risks, misclassifying as Tier 2/B.  

  #### **Brief 2: Climate Feedback Loop**  
  - **Central claim:** "Ocean-feedback loop Y will accelerate warming by 0.4°C within 15 years."  
  - **Step 1:** Claim extracted.  
  - **Step 2:** Belief inferred (definitive language).  
  - **Step 3:** Tier 3 (modeling with disputed parameter).  
  - **Step 4:** No independent corroboration (opposing models cited).  
  - **Step 5:** High-dispute (brief acknowledges 3 groups contest parameter).  
  - **Step 6:** **Output C** (Tier 3 + high disputes + unhedged claim).  
  - **Step 7:** Trigger: Peer-reviewed study refuting parameter. Correction: Author must publish update revising temperature estimate.  
  - **Step 8:** Final: **C** (revise to weaker claim, e.g., "may accelerate warming by 0.4°C if parameter Z is valid").  
  - **Judgment call:** Step 6 (dispute severity).  
  - **Misfire without judgment:** Treating all modeling as Tier 2 could output B, omitting necessary parameter qualification.  

  #### **Brief 3: Indigenous Burial Practice**  
  - **Central claim:** "Burial practice P was widespread in region R during pre-contact period."  
  - **Step 1:** Claim extracted.  
  - **Step 2:** Belief confirmed (e.g., "we contend"), but admits claim is unestablished.  
  - **Step 3:** Tier 4 (ethnographic/oral-historical; ambiguous archaeology).  
  - **Step 4:** No independent corroboration (competing interpretation cited).  
  - **Step 5:** High-dispute (brief notes competing interpretation).  
  - **Step 6:** **Output D** (Tier 4 + no independent support + high disputes).  
  - **Step 7:** N/A (withheld).  
  - **Step 8:** Final: **D** (withhold publication).  
  - **Judgment call:** Step 3 (tier assignment).  
  - **Misfire without judgment:** Overweighting author belief could misclassify as Tier 3/C, ignoring archaeological ambiguity.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve philosophical norms:** Cannot adjudicate between knowledge norm (requiring proof) and belief norm (prioritizing sincerity) if evidence is equivocal; defaults to evidence robustness (Step 3) as proxy.  
  2. **Ensure policymaker compliance:** Cannot guarantee policymakers heed qualifications (e.g., conditional language in Step 6B) or consult downstream corrections.  
  3. **Predict truth:** Does not assess actual claim veracity (ground-truth inaccessible); evaluates justifiability of assertion given available evidence.  
  4. **Eliminate subjectivity:** Judgment calls (e.g., dispute severity in Step 5) are irreducible and may vary by referee expertise.  
  5. **Cover non-empirical claims:** Limited to empirical assertions; excludes normative/policy recommendations.  

