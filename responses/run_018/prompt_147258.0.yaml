  The four outputs are:
  - "assertible without qualification"
  - "assertible only in conditional or hedged form"
  - "not assertible—recommend revision to a weaker claim"
  - "not assertible—recommend withholding publication until further evidence is available"

  The three norms of assertion:
  1. **Knowledge norm**: One must assert only what one knows.
  2. **Truth norm**: One must assert only what is true.
  3. **Belief norm**: One must assert only what one believes.

  However, we cannot access the author's mental states (so belief and knowledge are assessed indirectly) or ground truth (so truth is assessed indirectly). Therefore, we rely on the available evidence and the author's presentation.

  We design a procedure with explicit branching conditions. The steps:

  **Step 1: Identify the central empirical claim.**
     - Test: Extract the main claim from the brief. It must be a single, clear, empirical statement.
     - Required information: The brief itself.
     - Judgment call: If the brief has multiple claims or the central claim is ambiguous, the referee must decide which claim is central and rephrase it clearly for the audit. If the brief lacks a clear central claim, the procedure halts and recommends revision.

  **Step 2: Assess the author's belief.**
     - Test: Look for explicit statements of the author's commitment to the claim (e.g., "we believe", "we conclude") and check for hedging that might indicate lack of full belief. Also, note any admissions of uncertainty or limitations.
     - Required information: The brief, especially the discussion and conclusion sections.
     - Judgment call: The referee must decide if the author's language expresses sufficient belief in the claim. If the author explicitly states that the claim is not yet established, then belief is weak.

  **Step 3: Evaluate evidence type and quality.**
     - Test: Classify the evidence as (a) multiple independent replications, (b) a single study (with or without pre-registration), (c) modeling with disputed parameters, (d) non-experimental (e.g., observational, historical, ethnographic) with contested interpretations, or (e) other. Also, note sample size, methodology, and whether the data are published in peer-reviewed journals, preprints, or unpublished.
     - Required information: The methods and references section of the brief.
     - Judgment call: The referee must categorize the evidence type and note any major flaws (e.g., very small sample, lack of controls, known biases). This step does not require accessing the original studies, but relies on the brief's description and common scientific standards.

  **Step 4: Check for independent corroboration.**
     - Test: Determine if the claim is supported by at least one independent source (i.e., not by the same authors, using a different method or dataset). If the evidence is from a single source, note that.
     - Required information: References and citations in the brief.
     - Judgment call: The referee must decide if a cited source is independent and if it corroborates the central claim. If there are multiple sources, but they are all from the same team, that does not count as independent.

  **Step 5: Assess expert consensus.**
