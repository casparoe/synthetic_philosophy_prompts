       c. Else, if the evidence is of moderate quality (e.g., a single peer-reviewed study, or a model with some disputed parameters) and there is some independent corroboration or the disputes are minor, then the claim is **assertible only in conditional or hedged form** (e.g., "may", "suggests", "under these model parameters").
