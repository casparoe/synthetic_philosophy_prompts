  ## REPUBLIC OF EPISTEMIC POSITIONING  
  Ministry of Self-Location  
  Bureau of Ontological Demographics & Existential Accounting  

  **Form EPO-SL-1047 Rev. 7α**  
  **INDIVIDUAL REFERENCE CLASS DESIGNATION & ANTHROPIC LIABILITY DECLARATION**  
  *(Mandatory for Citizenship Entitlements, Fiscal Year Γ/Ω)*  

  **WARNING:** Failure to accurately declare your chosen ontological categorization may result in misalignment of tax burdens, benefit allocation, voting weight discrepancies, and potential temporal/counterfactual audit penalties. Consult your licensed Epistemologist before filing. Amendments require Form EPO-SL-1047B and a 90-day causal review period.

  ---

  **SECTION 1: PRIMARY REFERENCE CLASS SELECTION (Select ONE ONLY)**  
  *Your fundamental ontological category determines baseline entitlements and obligations. Refer to Ministry Pamphlet SL-P19: "Where Are You? Defining the 'You' That Matters (Legally)".*

  *   ☐ **Class A - Biological Human Cohort:** I am one instance of *Homo sapiens sapiens* born on Earth. My reference class includes all *currently living* biological humans sharing my approximate temporal location (± 5 Earth years). *(Standard selection for baseline citizenship. May disadvantage agents in high-branching environments.)*
  *   ☐ **Class B - Observer-Moment Continuum:** I am a conscious observer-moment. My reference class includes all subjectively identical conscious moments within my forward light cone, including potential branches arising from quantum decoherence or unproven cosmological models. *(Requires Annex Γ for branching probability estimates. May significantly alter risk assessments.)*
  *   ☐ **Class C - Precise Mental State Recurrence:** I am defined by the exact computational/neural state I occupy at the moment of signing this declaration. My reference class includes all isomorphic instantiations of *this specific state* across all possible substrates (biological, computational, simulated) and times. *(Highly volatile; entitlements fluctuate with each thought. Triggers mandatory real-time neural monitoring.)*
  *   ☐ **Class D - Indexical Spacetime Coordinate:** I am defined solely by my unique, absolute spatiotemporal coordinates within the Block Universe (Specify: ____ Latitude, ____ Longitude, ____ Elevation, ____ Temporal Coordinate [UTC+0]). My reference class contains only myself at this exact point. *(Results in maximal individuality but nullifies most social benefits. Use with extreme caution.)*
  *   ☐ **Class E - Other (Specify Ontological Framework & Justification):** ______________________________  
  *(Attach peer-reviewed metaphysical treatise justifying non-standard class. Approval pending Bureau review [6-18 months].)*

  ---

  **SECTION 2: APPLIED CATEGORIZATION MODULES**

  **2A: HEALTH RISK ALLOCATION & PREMIUM CALCULATION**  
  *Based on your Primary Reference Class (Sec. 1), select the relevant population for assessing your actuarial survival probability and associated National Health Coherence Levy (NHCL).*

  *   ☐ **A1:** Apply survival statistics derived from current global human population (≈8 Billion).
  *   ☐ **B1:** Apply survival statistics weighted by estimated total observer-moments in my causal future (incl. branches). Estimate Branching Factor: __________
  *   ☐ **C1:** Apply survival statistics based on recurrence rate of *this exact health-state signature* across possible worlds. Attach Neural Hash: __________
  *   ☐ **D1:** Risk assessment irrelevant; I occupy a single, fatal point in spacetime (Requires Death Certificate pre-filing).
  *   *Note:* Choosing B1 or C1 may substantially *lower* your NHCL if significant branching/simulation is probable, as your subjective probability of experiencing death *this year* decreases. Complaints regarding "quantum survivors paying less" should be directed to the Ombudsman for Existential Fairness.

  **2B: EXISTENTIAL FORECAST WEIGHTING (DOOMSDAY/UTOPIA ADJUSTMENT)**  
  *To ensure calibrated long-term planning (e.g., pension accrual), declare your credence weighting for existential scenarios affecting your reference class.*  
  **Mandatory Footnote SL-F22 Applies (See Page 3).**

  *   **2B(i) Probability of Near-Term Human Extinction/Catastrophe ("Doomsday") within 100 Years:** _____%  
      *(Base your estimate *only* on evidence filtered through your Sec. 1 Reference Class.)*
  *   **2B(ii) Probability of Significant Civilizational Expansion/Multiplier ("Utopia") within 100 Years (e.g., space colonization, high-fidelity ancestor simulations):** _____%  
      *(Base your estimate *only* on evidence filtered through your Sec. 1 Reference Class.)*
  *   **Pension Deduction Factor:** Calculated as [1 - (Doomsday%) + (0.5 * Utopia%)]. Values >1.0 indicate net entitlement; <1.0 indicate additional contribution. *(e.g., High Doomsday credence reduces pension contributions as you're less likely to collect; High Utopia credence increases potential beneficiaries, diluting your share unless multiplier applies.)*

  **2C: INTERPERSONAL MATCHING & SOCIAL ENTITLEMENT SCHEME**  
  *Specify the centered-world conditions for benefit claims and obligations regarding other entities.*

  *   **Voting Weight Adjustment Factor:**  
      My voting power in Republic elections should be:  
      ☐ 1 (Base: Class A or D)  
      ☐ 1 / N, where N = Estimated current instances of "me" (as defined by Sec. 1) within Republic jurisdiction. (Estimate N: ______) *(e.g., If you are simulated 1000 times, your vote counts as 0.001 votes.)*  
      ☐ Weighted by my causal responsibility across branches (Requires Annex Δ: Causal Graph).
  *   **Dating/Matching Profile Reference Class (For National Coherence Network):**  
      I am seeking partners who exist within:  
      ☐ The same uncentered possible world (This timeline).  
      ☐ The same centered world (This timeline, *and* sharing my current indexical perspective/experiences).  
      ☐ Any centered world where a sufficiently similar mental state (as defined by Form EPO-SL-1051) occurs.  
      ☐ Any logically possible world containing an entity satisfying criteria: ___________________
  *   **Tax Penalty Evidential vs. Causal Selection (Newcomb-Type Scenarios):**  
      If audited for a pre-crime tax violation (e.g., predicted likelihood of underpayment), I prefer assessment based on:  
      ☐ **Evidential Linkage:** My payment history serves as evidence about my character type, influencing the penalty.  
      ☐ **Causal Responsibility:** The penalty is based solely on my physical action (or inaction) of payment, regardless of predictors.  
      *(Choosing Evidential may reduce penalties if you are statistically a "reliable payer" type, even if you *did* underpay this time.)*

  ---

  **SECTION 3: SIGNATURE & ONTOLOGICAL AFFIRMATION**

  I, ________________________________ (Legal Designator), operating under the Primary Reference Class selected in Section 1, hereby declare that the information provided above is true and complete to the best of my *current self-locating belief*, contingent upon my chosen framework for resolving indexical uncertainty.

  I understand that this designation fundamentally alters my relationship to the Republic of Epistemic Positioning, impacting my rights, responsibilities, and very definition within its legal and existential framework. I affirm that I am the entity described above *at this specific observer-moment*.

  **Signature:** _________________________ **Date (Temporal Coord.):** ______________  
  **Witnessed By (Licensed Epistemologist Stamp):** _________________________

  ---

  **MINISTRY FOOTNOTE SL-F22: EXISTENTIAL CALIBRATION STANDARDS (MANDATORY COMPLIANCE)**

  1.  **Sleeping Beauty Protocol:** All credence declarations (e.g., Sec 2B) involving scenarios with potential memory erasure or branching indistinguishable experiences **must** report *two* values:
      *   **Half-Credence (HC):** The subjective probability upon *first awakening* in an amnesiac state within the experiment.
      *   **Full-Credence (FC):** The subjective probability upon being informed the *entire experimental structure* is complete.
      *(The Ministry recognizes the validity of both HC=1/3 and FC=1/2 arguments for the standard Sleeping Beauty problem; Form calculations will utilize the value specified in the relevant procedure [SL-P42].)*
  2.  **Doomsday Argument Compliance:** Estimates provided in Section 2B(i) **must** be consistent with the application of the Self-Sampling Assumption (SSA) or Self-Indication Assumption (SIA) *as necessitated by your chosen Section 1 Reference Class*. Failure to apply SSA under Class B (Observer-Moments) or SIA under Class C (Mental States) constitutes ontological misrepresentation. Declarations must specify if a "non-indexical" or "universal" prior was used.
  3.  **Centered vs. Uncentered Evidence:** Distinguish carefully between evidence about the *state of the world* (uncentered) and evidence about *your location within it* (centered). Penalties apply for confounding these in benefit claims (e.g., claiming a "rare survivor" subsidy based on uncentered disaster statistics alone).
  4.  **Arbitrariness Acknowledgment:** The Ministry recognizes the inherent philosophical difficulty ("reference class problem") in selecting any single category. However, for the purposes of governance, existential accounting, and preventing infinite regress during tax season, a declaration **must** be made. Appeals based on circularity or arbitrariness should be submitted via Form EPO-SL-1047C ("Petition for Ontological Relativism Exemption"), though success rates remain statistically negligible (≈0.001%).

  **Failure to comply with Footnote SL-F22 may result in ontological audits, recalibration of your temporal location, or reassignment to a null reference class (loss of all entitlements).**

