answer: |-
  ### Brainstorm Notes: Temporal Neutrality vs Risk Adjustments
  - **Temporal Neutrality Core**: Moral claim that *mere* temporal distance shouldn’t diminish ethical weight of welfare. "Future people matter equally."  
  - **Risk Adjustment Claim**: Downweighting due to *probability* of non-existence isn’t temporal bias – it’s accounting for factual uncertainty.  
  - **Tension**:  
    - If PTP (pure time preference) is unethical for devaluing future *just because* it’s future, does an existential-risk factor (e.g., "0.1% chance humans extinct by 2300") unfairly penalise *distant* futures?  
    - Non-identity problem: If current choices affect future populations’ existence, is "discounting for non-existence risk" meaningfully different from PTP? Both reduce present sacrifice for future gains.  
  - **Philosophical Hooks**:  
    - Is probability-based discounting a *descriptive* correction or a *normative* sleight-of-hand?  
    - Can "risk" fully escape charges of temporal bias if risk *increases* with time?  

  ---

  ### Essay Question (90-minute exam)  
  **Climate policy models often decompose the social discount rate (SDR) into three components: (1) a pure time preference rate (δ), reflecting inherent devaluation of future welfare; (2) an elasticity-of-marginal-utility term (η), scaling with projected consumption growth; and (3) an existential-risk adjustment (ρ), reducing the weight of far-future welfare due to the cumulative probability that beneficiaries never exist.  

  Critics condemn component (1) as ethically arbitrary, arguing temporal neutrality forbids discounting welfare merely because it occurs later. Component (3) is defended as avoiding this objection, since it discounts not for *time* but for *risk of non-existence*. Evaluate whether this defence holds. Does ρ genuinely sidestep the moral objection to δ, or does it covertly reintroduce temporal bias by allowing probability to do the same discriminatory work as temporal distance? In your response, address whether treating ‘potential future people’ differently from ‘certain future people’ aligns with the principles rejecting pure time preference.**  

  ---

  ### Model Answer (680 words)  
  This essay argues that the existential-risk adjustment (ρ) fails to escape the moral objections levelled against pure time preference (δ). While framed as a neutral probabilistic correction, ρ functionally replicates the temporal bias condemned in δ by systematically devaluing *distant* future welfare on contingent grounds inseparable from time itself. Ultimately, it smuggles in a form of temporal partiality that undermines the principle of temporal neutrality.  

  Proponents position ρ as ethically distinct from δ. Pure time preference (δ > 0) explicitly values welfare less simply because it occurs later – akin to spatial bias favouring neighbours over strangers. Temporal neutrality, championed by philosophers like Rawls and Parfit, rejects this as arbitrary discrimination. In contrast, ρ claims moral legitimacy by responding to an *empirical* fact: future people *might not exist* due to asteroid impacts, nuclear winters, or unforeseen catastrophes. Discounting their welfare isn’t bias, but rational accounting for uncertainty, akin to buying insurance. This seems compatible with temporal neutrality: we’d discount welfare 100 years hence if a comet strike were imminent *tomorrow*, irrespective of temporal distance. The moral distinction appears clear: δ devalues *time*, ρ responds to *risk*.  

  However, this defence crumbles under scrutiny. Crucially, ρ in climate models isn’t applied to specific, forecastable disasters but as a blanket *cumulative probability* that *increases with time*. A 0.1% annual extinction risk implies a 9.5% chance of extinction within 100 years, rising to 63% by 1000 years. Thus, ρ’s downweighting inevitably intensifies for more distant futures. This correlation is not incidental but mathematically inherent; uncertainty compounds over time. Consequently, ρ systematically penalises welfare *because* it is temporally remote – replicating δ’s core effect. The objection to δ isn’t just its *explicit rationale* but its *discriminatory outcome* against the far future. ρ achieves the same outcome, merely swapping "because it’s later" for "because it’s more likely no one exists then". If temporal neutrality forbids outcome-based discrimination against future generations, ρ violates it as surely as δ.  

  Furthermore, ρ encounters the non-identity problem, blurring the line between risk and bias. If present climate policies affect *which* future people exist (e.g., via migration patterns, survival rates), then "potential" beneficiaries of long-term investments are not a fixed group awaiting rescue. Discounting their welfare via ρ because they "might not exist" is paradoxical: our actions *determine* whether they exist. This makes ρ less like betting on a coin toss and more like refusing to plant an oak because future picnickers "aren’t real yet". Such discounting privileges *currently certain* people over *conditionally future* people – a temporal hierarchy mirroring δ’s preference for the near term.  

  Proponents might retort that ρ treats all *possible* futures equally, applying consistent probability weights regardless of when they occur. But this ignores scale. Near-term risks (e.g., pandemics) could justify high discounting for 2100, yet models fix ρ as time-dependent. More damningly, temporal neutrality likely demands *equal concern for all possible future persons*, contingent or not. Downweighting a future person’s welfare due to the *manner* of their potential existence (i.e., being later-born in a riskier timeline) seems ethically akin to downweighting them for their birth date. If we reject discounting welfare due to birth date (δ), discounting due to lower existential probability – a factor inherently tied to birth date – is equally objectionable.  

  In conclusion, ρ does not avoid the moral objection to δ; it circumvents it rhetorically while reinstating its discriminatory impact through probability. By embedding a time-correlated devaluation factor, ρ contradicts the spirit of temporal neutrality, which opposes *systematically* valuing welfare less based on temporal position. While probabilistic reasoning is essential for decision-making under uncertainty, applying it via a persistent, time-linked discount rate conflates empirical risk management with normative partiality. For climate policy, this implies that purportedly "risk-based" discounting may still warrant the same ethical scrutiny as pure time preference.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Aim**: Assess conceptual analysis of risk vs. temporal bias, not factual recall.  

  1. **Articulate Moral Objection to Pure Time Preference (δ)** (4 marks)  
     - **A (4)**: Clearly explains temporal neutrality as rejecting *arbitrary* devaluation of future welfare *because* it’s future; links to impartiality.  
     - **B (2–3)**: States δ is "unethical" but lacks nuance on *why* (e.g., calls it "unfair" without tying to discrimination).  
     - **Mistake**: Vague moralism ("it’s selfish") or confusion with inequality (η).  

  2. **Explain Defence of Risk Adjustment (ρ) as Ethically Distinct** (4 marks)  
     - **A (4)**: Contrasts ρ’s *probabilistic, contingency-based* rationale (non-existence risk) vs. δ’s *temporal* rationale; notes risk ≠ bias.  
     - **B (2–3)**: Parrots "ρ is about risk" without clarifying *why* this might evade objections to δ.  
     - **Mistake**: Conflating ρ with δ or η; missing the "non-existence" specificity.  

  3. **Critique ρ as Covert Temporal Bias** (4 marks)  
     - **A (4)**: Highlights ρ’s *time-dependent compounding*, showing it discriminates against distant futures *de facto*; argues outcome matters, not intent.  
     - **B (2–3)**: Notes ρ increases over time but doesn’t tie this to *moral equivalence* with δ’s effects.  
     - **Mistake**: Accepting ρ as "objective" without examining its temporal correlation.  

  4. **Engage Non-Identity Problem** (4 marks)  
     - **A (4)**: Uses non-identity to challenge ρ’s premise – i.e., if our choices affect future existence, discounting "potential" people privileges the present.  
     - **B (2–3)**: Mentions non-identity but fails to connect it to ρ’s legitimacy (e.g., "it’s confusing").  
     - **Mistake**: Ignoring non-identity or misapplying it (e.g., "future people don’t exist now, so ρ is fine").  

  5. **Synthesise: Does ρ Escape or Replicate δ’s Problem?** (4 marks)  
     - **A (4)**: Concludes decisively that ρ replicates δ’s *discriminatory outcome* against the far future, evading the letter but not spirit of objections.  
     - **B (2–3)**: Sits on fence ("ρ is different but has issues"); no clear verdict on core tension.  
     - **Mistake**: Undefended assertion ("ρ is obviously ethical/unethical") without grappling with the risk-preference entanglement.  

  **Overall Band Descriptor**:  
  - **A (17–20)**: Coherent, critical, hits all moves; exposes paradoxes.  
  - **B (13–16)**: Competent but derivative; may miss one move or depth in critique.  
  - **C (9–12)**: Descriptive summary; confuses components or moral arguments.  

  ---  
  *Format note: Casual British English maintained (e.g., "crumbles under scrutiny", "smuggles in"). No citations, per brief. Focus on conceptual "moves" over sources.*
