  Starting with flickers. The idea is that even in Frankfurt scenarios, there's a tiny alternative possibility, like a prior sign indicating choice. If Jones had shown that sign, Black would intervene. So, technically, Jones could have done something different—triggering intervention. This challenges the claim that no alternatives exist. But defenders argue these alternatives aren't morally relevant since they don't affect the actual outcome. The flicker is too insignificant to support PAP, which requires robust alternatives. Is this a fatal flaw? Probably not, but it's a serious headache. Defenders adjust by refining what counts as a relevant alternative possibility.

  Next, Black's foreknowledge. If determinism is true, Black can't predict Jones' action without causing it, making the scenario incoherent. If indeterminism, Black's prediction might fail. This is a setup problem. Defenders respond with non-causal prediction methods or bite the bullet on indeterminism. This objection is more about the scenario's plausibility than its logic. It's awkward but not fatal since similar setups exist in other philosophical thought experiments.

