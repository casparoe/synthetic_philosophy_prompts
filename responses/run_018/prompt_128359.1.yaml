answer: |-
  Here's the poem, designed for conceptual accuracy with embedded distinctions and your structural constraints:

  **The Unswerving Code**  

  When tests reveal the marker in my blood,  
  A dread correlation starts to bloom.  
  Though treatment risks a frail and failing bud,  
  I see the web within the sealed room.  
  *Compute all worlds, then act as pre-decided.*  

  The market plummets, news reports my trade  
  Was placed before the fall. Suspicion grows.  
  To change my plan now might evade the shade  
  Of guilt that random chance alone bestows.  
  *Compute all worlds, then act as pre-decided.*  

  The quantum coin (still spinning, not yet shown)  
  Controls a distant device's lethal aim.  
  My choice *here* binds an outcome overflown  
  To where subjunctive branches play the game.  
  *Compute all worlds, then act as pre-decided.*  

  No shift in credence moves the hand you see;  
  This action springs from maps of might-be-true.  
  My future self's a logical debris  
  From axioms that hold the whole in view.  
  *Compute all worlds, then act as pre-decided.*  

  ---

  **Accuracy Notes & Liberties:**  
  1.  **Settled Core:** The poem accurately reflects UDT's core: refusing to update *beliefs about what decision rule is optimal* based on new evidence ("marker," "reports my trade," "coin still spinning"), instead computing the optimal *logical function* (decision rule) once across all possible worlds. The rigidly repeated line embodies this. The "maps of might-be-true" and "axioms that hold the whole in view" emphasize logical possibility over probabilistic belief.  
  2.  **Future Actions as Outputs:** The "logical debris / From axioms" directly conveys that future actions are deterministic outputs of the chosen logical function (the rule itself), not results of belief updates.  
  3.  **Causal vs. Evidential Distinction:**  
      *   Stanza 1 (Medical Test): The "dread correlation" is *evidential* (suggests illness), but UDT cares about the *causal* effect of treatment (risking a "frail bud"). EDT might avoid treatment due to the correlation, even if treatment helps.  
      *   Stanza 2 (Market Trade): The correlation between the trade and crash is *evidential* but likely not *causal*. UDT ignores the correlation as evidence about *its own guilt* and acts based on the causal consequences of the trade itself.  
      *   Stanza 3 (Quantum Coin - Contentious Liberty): This leans heavily on the logical dependence/counterfactual structure central to UDT thought experiments (like Parfit's Hitchhiker or Newcomb's). The "subjunctive branches" and "choice *here* binds" highlight UDT treating logically linked outcomes *as if* causally influenced by the computed decision rule, even pre-outcome. **This is the main liberty/contested point:** It presents a stylized, logically dependent scenario common in UDT justification but philosophically contested and physically non-standard.  
  4.  **Dutch Book/Objections:** Not explicitly mentioned, but the refusal to update the *rule* even under correlation pressure (Stanzas 1 & 2) implicitly shows UDT avoiding the dynamic inconsistency/sure-loss scenarios EDT can face. The Note acknowledges this is contested ground.  
  5.  **Contested Views:** The quantum coin stanza relies on the niche idea of logical counterfactuals controlling correlated outcomes, which is central to UDT's proposed solutions to certain problems but is philosophically debated (e.g., is this "control" meaningful? Isn't it just correlation?). The portrayal of UDT as *the* solution is contested; many see it as promising but deeply problematic computationally and conceptually. The Note separates this.  

  **One-Sentence Summary:**  
  **UDT chooses the timelessly optimal decision rule by logical projection across all possibilities, treating its own actions as fixed outputs, not updated beliefs.**
