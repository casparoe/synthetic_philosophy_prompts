  The solution likely lies in how we model the agent's identity over time. The user's intuition in Case B suggests they view the pre-rescue self and post-rescue self as separate agents with conflicting interests. When the second driver observes payment to driver 1, it's not about future gain but about the pre-rescue self's goal being fulfilled through the post-rescue self's action. In Case A, the escrow is just a tool controlled by the current self, so no separation exists. The "internal" vs "external" distinction might refer to whether the commitment creates a new agent-like entity (the precommitted self) that can "enforce" the promise through identity rather than consequences.

  This principle would: 
