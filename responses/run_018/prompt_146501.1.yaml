  Next, the interaction between simulation and longtermism. Typically, longtermism prioritizes the far future because of the vast number of potential lives. But if we're in a simulation, our efforts to secure the far future might be irrelevant—either because the simulators control outcomes or because real impact is outside the simulation. However, the non-obvious angle might involve the simulators themselves. If they're testing moral theories, they might value consistency in decisions across simulations. So, acting as if we're real could be what the simulators are testing, making our commitment to the far future still valid within the experiment's framework.

  The check part requires explaining whether this dampens or amplifies fanaticism. If the simulators reward agents who prioritize the far future despite uncertainty, then fanaticism is amplified. The structural feature here is the purpose of the simulation: testing moral theories. This creates epistemic parity between base and simulated agents because both are making decisions under similar uncertainties. Removing that feature, say if the simulation's purpose is unknown, would make outcomes unpredictable, dampening fanaticism. 

