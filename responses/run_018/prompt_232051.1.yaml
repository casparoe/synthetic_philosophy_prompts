  The user's frustration about "progress" is particularly sharp. They're tired of seeing camps talk past each other while the Liar morphs into new forms (Strengthened Liar under Kripke). They're asking for genuine resolution, not just technical variants. This suggests they value philosophical insight over formalism for its own sake.

  Three angles for meaningful progress occur to me: First, Wittgenstein's quietism – maybe we shouldn't "solve" it but expose the question as confused. Second, hybrid approaches like contextualist solutions where "true" shifts meaning mid-sentence. Third, Carnapian pluralism where different truth predicates serve different purposes without claiming One True Theory.

  The user might be implicitly asking: "If experts can't agree after 80+ years, is this even solvable?" That meta-question is valid. I should acknowledge that while technical work continues (e.g., topological semantics for paradoxes), the deepest progress may be realizing that "truth" isn't a single monolithic target.

