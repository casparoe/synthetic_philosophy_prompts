prompt: |-
  I'm a phd student in moral psych and I'm moderating a panel Q&A next week with a philosopher — let's call her Dr. Voss — who's been arguing that the wrong-kind-of-reasons problem doesn't just apply to individual belief and desire but also to what she calls "institutional admiration": the idea that a corporation or state can have the right kind of reason to endorse a policy (say, because it reduces harm) even when every individual inside it was motivated by careerist incentives. She thinks this creates a kind of "collective WKR gap" where the explaination and the normative story split apart at the group level. I need maybe six to eight sharp interview questions, not just "explain your view." Specifically, I want one question pressing on whether her collective extension just smuggles in functionalism about institutional rationality, one on what happens when the wrong-kind reasons actually produce the correct collective attitude (like a bribed committee accidentally reaching the right decision), and one on whether democratic voting becomes conceptually broken if citizens always vote for self-interested reasons. For each of those three, include a follow-up tailored to the reply she's most likely to give — she usually tries to seperate "structural justification" from "motivational explanation." Also, if this whole framing is confused — if extending WKR to groups is just a category mistake or if I'm botching the literature — please tell me straight up instead of playing along. I wrote this in a rush on my phone so forgive the typos.
reasoning: |-
  Okay, the user is a PhD student in moral psychology preparing to moderate a panel with a philosopher, Dr. Voss. She's extending the wrong-kind-of-reasons (WKR) problem to institutional admiration, arguing that institutions can have normative reasons for policies even if individuals within them have self-serving motives. The user wants sharp questions, including three specific angles: functionalism, cases where wrong reasons lead to correct outcomes, and implications for democratic voting. They also want follow-ups based on Dr. Voss's likely responses, especially her distinction between structural justification and motivational explanation.

  First, I need to assess if the framing is solid. The WKR problem typically deals with reasons for attitudes like belief or desire—whether a reason is the right kind to justify the attitude (e.g., evidence for belief) versus the wrong kind (e.g., a bribe to believe something). Applying this to institutions is innovative but tricky. Institutions aren't agents, so they don't have mental states. Dr. Voss seems to be talking about collective attitudes or policies endorsed by groups. The key issue is whether institutional reasons can be normatively valid independent of individual motivations. That's not a category mistake, but it requires careful handling to avoid anthropomorphizing institutions. The literature on collective intentionality (like Gilbert or Bratman) might be relevant here, as well as functionalist views in social sciences. So the framing isn't confused—it's pushing boundaries, which is valid for philosophical discussion.

  Now, for the questions. The user wants three specific ones with follow-ups. Starting with functionalism: Dr. Voss's view might resemble functionalist theories where institutions are rational based on outcomes, not internal motives. The first question should press on whether this smuggles in functionalism. Her likely response is to emphasize structural justification over motivational explanation. The follow-up would challenge how structural reasons can exist without any individual buy-in, pushing her to clarify the ontology of institutional reasons.

  Next, the bribed committee scenario: if self-interested motives accidentally lead to the right decision, does the institution still have the right kind of reasons? This tests the robustness of her view. She'll probably say yes, the structural reasons remain valid. The follow-up should question whether this makes the institution's "admiration" existentially luck-dependent, highlighting a tension between outcome and process.

  Third, democratic voting: if citizens vote self-interestedly, does that invalidate democratic outcomes? This ties into real-world concerns. Her response will likely separate structural validity from motivational purity. The follow-up would ask if this lowers the bar too much, potentially legitimizing dysfunctional systems as long as they produce good outcomes.

  The user also wants a few more sharp questions. I should cover counterfactuals, conflicts between individual and institutional reasons, and practical implications for institutional design. Each question should probe her core distinction and its limits. For the follow-ups, I'll anticipate her emphasis on structural justification and press for concrete mechanisms or potential contradictions.

  Beyond the explicit requests, the user's deeper needs might include: wanting rigorous engagement to make the panel dynamic, ensuring they don't miss weaknesses in Dr. Voss's argument, and demonstrating their grasp of complex concepts. As a PhD student moderating, they might also seek to establish credibility. The questions should be incisive but respectful, fostering debate without hostility. Including varied angles (conceptual, empirical, normative) will make the session comprehensive. I'll avoid softball questions and focus on tension points that illuminate the theory's originality and vulnerabilities.

  Finally, I'll structure the response clearly: confirm the framing is sound, list questions with follow-ups, add extra questions, and emphasize applicability. This should give the user a solid toolkit for the panel while addressing their unspoken aim to facilitate a memorable, thought-provoking discussion.
answer: |-
  Here’s a set of sharp questions tailored to Dr. Voss’s framework, including your three specified angles, follow-ups targeting her "structural justification/motivational explanation" distinction, and additional high-impact queries. **Your framing is solid**—extending WKR to institutions is contentious but not a category mistake (it parallels debates in collective intentionality, corporate agency, and functionalist social ontology). Dr. Voss is pushing into underexplored terrain.

  ### Core Questions (+ Follow-Ups)
  **1. Functionalism Smuggle-In**  
  *Question:* "You argue institutions can have 'right-kind reasons' (e.g., harm reduction) independent of individual motivations. But doesn’t grounding institutional RKR *solely* in outcomes or structural roles collapse into functionalism—where the institution’s ‘rationality’ is defined by systemic effects, not any actual reason-responsive mechanism?"  
  *Likely Reply:* She distinguishes structural justification (what the institution *should* endorse given its role/values) from motivational explanation (why individuals act).  
  *Follow-Up:* "If structural justification requires *no* trace of reason-responsiveness in the institution’s components (e.g., individuals), what prevents this from being *mere* functionalism? Is an institution’s 'reason' just a post hoc rationalization of whatever policy emerges from its causal structure?"

  **2. Accidental Correctness (Bribed Committee)**  
  *Question:* "Suppose a committee approves a harm-reducing policy *solely* because each member was bribed—no one cared about harms. The outcome aligns with structural justification. Does the institution *still* have a RKR for this policy? Or does the pure WKR motivation 'contaminate' the collective attitude?"  
  *Likely Reply:* She’ll argue structural justification remains intact; the outcome fulfills the institution’s normative role regardless of motives.  
  *Follow-Up:* "If the institution can 'admire' a policy *despite* being causally driven by WKR, doesn’t this make institutional admiration *existentially lucky*? How is this different from saying a broken clock is 'right for the right reasons' at noon?"

  **3. Democratic Voting & Self-Interest**  
  *Question:* "If citizens *always* vote for self-interested reasons, does democracy lose its normative legitimacy on your view? Or can democratic institutions still have RKR (e.g., 'fairness') even if voters exclusively harbor WKR?"  
  *Likely Reply:* She’ll likely separate the structural justification of democratic outcomes (procedural fairness) from voters’ motivations.  
  *Follow-Up:* "If democratic legitimacy persists despite universal self-interested voting, does this imply institutions *never* need alignment between structural and motivational levels? Doesn’t this risk legitimizing deeply corrupt systems that coincidentally produce just outcomes?"

  ---

  ### Additional Sharp Questions
  4. **Counterfactual Vulnerability**  
     "Could an institution have structural RKR for a policy that, *in its actual circumstances*, is impossible to implement for non-WKR motives? (e.g., a policy requiring self-sacrifice from all agents). Doesn’t this make RKR practically inert?"  
     *Follow-Up if she invokes ideals:* "If structural RKR are idealized (e.g., 'what the institution would endorse if perfectly rational'), how do they differ from moral fictions?"

  5. **Conflict of Reasons**  
     "When an individual’s RKR (e.g., a whistleblower’s moral duty) conflicts with the institution’s structural RKR (e.g., 'preserve stability'), how do you adjudicate? Does the institutional RKR 'override' the individual’s, or are they incommensurable?"

  6. **Empirical Testability**  
     "What would falsify your theory? If we found an institution achieving morally optimal outcomes *only* when driven by WKR (e.g., corruption improves efficiency), would that undermine the claim that institutions *can* possess RKR?"

  7. **Scale Dependence**  
     "Does institutional RKR apply equally to a 3-person NGO and a 300,000-person state? Or does the collective WKR gap widen with scale/complexity, making structural justification increasingly detached from agency?"

  8. **Normative Implications**  
     "If we accept your view, should reformers focus *only* on designing structures that yield good outcomes *regardless* of motives (e.g., AI governance), abandoning attempts to cultivate 'virtuous' institutional actors?"

  ---

  ### Key Rationale
  - **Targets her core distinction**: Every question forces engagement with the structure/motivation split.
  - **Pressure points**: Functionalist reduction, moral luck in outcomes, legitimacy without sincerity.
  - **No softballs**: Questions assume familiarity with her work but challenge implications.
  - **Flow**: Starts conceptual (Q1-3), moves to edge cases (Q4-5), then applied/practical (Q6-8).

  **If Dr. Voss dodges by re-explaining her distinction**: Politely refocus with, "I understand that distinction, but my question is specifically about *[consequence X]* that seems to follow from it..."  
  **Your framing is strong**—this is exactly how philosophical progress happens: stretching concepts to new domains and stress-testing the results. Break a leg with the panel!
