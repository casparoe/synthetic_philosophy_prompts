prompt: |-
  hey — i'm prepping questions for an interview on my podcast (science & ideas, mostly philosphy of physics) and next week's guest is dr. elena voss. she's been writing that if you take panpsychism seriously alongside quantum field theory, then the disturbances we create in particle colliders and maybe even in gravitational-wave detectors aren't just physical events — they have some minimal valence or suffering-profile, not full consciousness but enough to carry an ethical weight. she has a habit of deflecting with the line that the combination problem is just a research program, not an objection, so i need questions that make that escape route harder.

  can you draft maybe seven or eight interview questions? i want them conversational but sharp, no generic "what drew you to this" stuff. specifically: (1) how she stops the combination problem from becoming a multiplication problem — if every field excitation has its own micro-experience, why don't we get billions of disconnected suffering-points rather than one integrated harm? include the follow-up for her likely reply that macro-integration is still unsolved. (2) what actual empirical result in physics — say, a specific QFT prediction failing — would make her abandon the ethical claim, not just the metaphysical one? (3) if colliders matter ethically, why don't LIGO events or cosmic inflation, and what's her cutoff principle? include the follow-up if she appeals to scale or integration. (4) does this view collapse into physicalism with extra emotional vocabulary, and if not, what's the real difference? (5) she mentioned in a recent essay that GPU clusters running small language models might sit closer to her fundamental field-modes than to human brains — does she think there's any ethical relevance there, and where exactly is the line? for each, anticipate her standard reply and build in the counter-push. keep it in the weeds, please — i want to sound like i actually read her work, not like i'm skimming a wikipedia summary.
