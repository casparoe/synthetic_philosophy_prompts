  First question: is their reading of van Fraassen fair? Actually, van Fraassen does assume continuity - his principle treats future you as essentially the same agent. But he doesn't discuss identity-breaking changes because he's focused on standard Bayesian updates. So the user is right to point out this unstated assumption. 

  Second: does thin/thick work? The distinction feels intuitive but might be fuzzy. What counts as "identity-altering"? Losing a limb? Religious conversion? Taking psychedelics? The boundary is porous. Maybe instead of types of revisions, we should focus on whether the agent expects to recognize their future self as rationally continuous. That avoids metaphysics.

  Third: formalizing without personal identity. The user is smart to want this - philosophers still fight over identity. We could use decision theory tools: say reflection only applies when the agent would endorse their future reasoning process now. Or model it as differential trust in future epistemic states rather than metaphysical identity.

  The prediction market point is sharp. Markets do assume today's probabilities should match tomorrow's expectations, but if traders expect to become different people (say after a revolution or AI takeover), that breaks down. That's probably why long-dated forecasts fail during upheavals.

  Biggest risk in their argument: assuming that "thick" changes are irrational or non-Bayesian. But what if I rationally choose cognitive enhancement knowing it'll change me? That might still be reflection-compliant if I endorse the process. Need to clarify that thick revisions aren't inherently irrational - just outside reflection's scope.

  Should also warn that "stable agent" isn't binary. We're always changing a bit - the question is when the change severs rational continuity. Maybe use degrees of trust in future selves rather than a strict cutoff.

