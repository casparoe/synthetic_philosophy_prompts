prompt: |-
  You are a professional philosopher of well-being and public policy measurement. Before constructing anything, please spend a brief moment brainstorming the core philosophical objections to treating a country's rank in international happiness surveys as a direct policy target—especially objections that do not depend on empirical disputes about measurement error.

  I am a graduate student in public policy working with a government advisory office. We need a reusable decision procedure that my team can apply whenever a minister proposes a policy explicitly designed to raise our nation's standing in major international well-being rankings—the kind built on large-scale self-reported life-evaluation surveys. The procedure should translate philosophical theories of well-being—subjective life satisfaction, emotional experience, and objective flourishing—into an operational protocol. For each step, specify: the exact question to ask, what counts as a sufficient answer, whether that step is empirical or normative, and whether the protocol stops with a clear rejection, stops with a conditional approval, or hands the decision to a human values judgment.

  Then apply the procedure to two proposals: first, a national subsidy for urban green spaces justified by cross-national correlations between access to nature and higher self-reported life satisfaction; second, a state-funded public-awareness campaign that trains citizens to cognitively reframe economic hardship as personal growth, intended to improve reported emotional balance without changing material conditions. Include at least one case in which the procedure recommends rejecting a policy that would likely improve our ranking. Finally, flag precisely where the protocol cannot eliminate judgment and must defer to a normative decision by the advisory board. Please think carefully and show your reasoning at each step.
reasoning: |-
  Okay, let me approach this systematically. The user is a public policy graduate student needing a philosophical framework to evaluate policies targeting happiness rankings. The core challenge is designing a protocol that goes beyond surface-level metrics to address deeper well-being concerns.

  First, I need to identify the fundamental philosophical objections to treating happiness rankings as direct policy targets. These objections should be normative rather than empirical:
  - The alignment problem: Rankings measure specific constructs that may not match the government's actual well-being goals
  - The manipulation risk: Policies could improve scores without genuine welfare improvement
  - The pluralism challenge: Single indices can't capture multidimensional well-being
  - The agency concern: Top-down targeting may override citizen autonomy
  - The temporal disconnect: Surveys capture moments, not lifelong flourishing

  For the decision protocol, I'll structure it around three major well-being theories:
  1. Subjective life satisfaction (hedonic/self-evaluation)
  2. Affective experience (emotional states)
  3. Objective flourishing (capabilities/functionings)

  Each step will have:
  - Precise question
  - Sufficiency criteria
  - Nature (normative/empirical)
  - Decision pathway (reject/conditional approval/human judgment)

  The two test cases are carefully chosen opposites:
  - Green space subsidy (potentially genuine improvement)
  - Reframing campaign (risk of manipulation)

  I'm particularly concerned about where the protocol must defer to human judgment - this will likely occur at the pluralism evaluation stage when tradeoffs between well-being dimensions arise. The key is ensuring the framework flags when policies improve metrics without substance, like the reframing campaign that manipulates perception without changing reality.
answer: |-
  Here is a decision protocol grounded in philosophical theories of well-being, designed to evaluate policies targeting international happiness rankings. It addresses core objections: **misalignment with true well-being constructs**, **risk of instrumentalization over genuine flourishing**, **neglect of pluralism**, and **undermining of autonomy**.

  ---

  ### **Protocol: Evaluating Happiness-Ranking-Targeted Policies**
  *(Apply sequentially; proceed only if previous step is satisfied)*

  1.  **Step 1: Construct Alignment Check**  
      *Question:* "Does the policy primarily target the *specific well-being construct* measured by the referenced ranking (e.g., life evaluation, affect balance, eudaimonia), and is this construct *explicitly endorsed* as a policy goal in our national well-being framework?"  
      *Sufficient Answer:* Clear documentation (e.g., white papers, legislation) showing:  
      (a) The ranking's methodology (e.g., Gallup World Poll's Cantril Ladder = life evaluation; Day Reconstruction Method = affect) aligns with a formally adopted national well-being definition.  
      (b) This construct is prioritized over others in this policy context.  
      *Nature:* **Normative** (requires value-based prioritization).  
      *Outcome:*  
      - **Reject** if misaligned (e.g., targeting life satisfaction when national framework prioritizes capabilities).  
      - **Continue** if aligned.

  2.  **Step 2: Authenticity & Mechanism Test**  
      *Question:* "Does the policy improve the targeted well-being construct *authentically*—i.e., by addressing its constituent elements (e.g., relationships, health, autonomy)—rather than altering perception/reporting without changing lived experience?"  
      *Sufficient Answer:* Evidence that the mechanism:  
      (a) Directly enhances objective/subjective conditions constituting well-being (e.g., improving material security), OR  
      (b) If targeting perception (e.g., cognitive reframing), does so *only* as a supplement to—not substitute for—addressing underlying conditions, AND respects autonomy.  
      *Nature:* **Normative** (hinges on theory of what constitutes "authentic" well-being).  
      *Outcome:*  
      - **Reject** if mechanism is purely perceptual/coercive (e.g., nudging self-reports without experiential change).  
      - **Continue** if authentic.

  3.  **Step 3: Pluralism Safeguard**  
      *Question:* "Does the policy risk undermining other *dimensions of well-being* (e.g., autonomy, justice, health) that are valued in our framework, even if it improves the targeted ranking metric?"  
      *Sufficient Answer:* Impact assessment showing:  
      (a) No material trade-offs with other core dimensions (e.g., equity, procedural fairness), OR  
      (b) Trade-offs are justified by democratic consensus or urgent need.  
      *Nature:* **Mixed** (empirical assessment of trade-offs + normative weighting).  
      *Outcome:*  
      - **Reject** if trade-offs violate non-negotiable values (e.g., coercing citizens).  
      - **Human Judgment** if trade-offs require value weighting (e.g., efficiency vs. equity).  
      - **Continue** if no material trade-offs.

  4.  **Step 4: Agency & Consent Verification**  
      *Question:* "Does the policy respect citizens' autonomy by: (a) avoiding manipulation, and (b) enabling informed consent if it alters cognition/reporting?"  
      *Sufficient Answer:* Policy design must:  
      (a) Avoid deception/exploitation of cognitive biases.  
      (b) Include transparency/opt-outs for interventions affecting perception (e.g., reframing training).  
      *Nature:* **Normative** (based on autonomy as a core well-being component).  
      *Outcome:*  
      - **Reject** if manipulative or non-consensual.  
      - **Continue** otherwise.

  5.  **Step 5: Empirical Plausibility Assessment**  
      *Question:* "Is there robust evidence (beyond correlation) that the policy *causally* improves the targeted well-being construct *in our national context*?"  
      *Sufficient Answer:* Experimental/quasi-experimental studies in comparable settings, or validated micro-simulations accounting for local institutions/culture.  
      *Nature:* **Empirical**.  
      *Outcome:*  
      - **Conditional Approval** if evidence is strong.  
      - **Human Judgment** if evidence is uncertain but theory is compelling.  

  ---

  ### **Application to Case Studies**
  **Policy 1: Subsidy for Urban Green Spaces**  
  - *Step 1:* **Continue**. Aligns with life satisfaction/eudaimonia (common in rankings/national frameworks).  
  - *Step 2:* **Continue**. Improves objective conditions (recreation, air quality) and experiential well-being.  
  - *Step 3:* **Human Judgment**. Trade-offs possible (e.g., funds diverted from rural healthcare). Advisory board must weigh green space vs. other needs.  
  - *Step 4:* **Continue**. No autonomy violation.  
  - *Step 5:* **Conditional Approval**. Strong causal evidence (e.g., natural experiments in cities like Berlin).  
  *Outcome:* **Conditional Approval** pending Step 3 trade-off resolution.

  **Policy 2: "Reframing Hardship" Awareness Campaign**  
  - *Step 1:* **Continue**. Targets emotional balance (aligns with affect-based rankings).  
  - *Step 2:* **Reject**. Mechanism alters perception *without changing material conditions*. Violates authenticity (per Step 2b: not supplemental to addressing hardship).  
  - *Steps 3–5:* Not reached.  
  *Outcome:* **Reject** per Step 2. *(This rejects a ranking-effective policy on philosophical grounds.)*  

  ---

  ### **Critical Judgment Points**
  The protocol **defers to human judgment** at:  
  1. **Step 3 (Pluralism Safeguard):** When trade-offs between well-being dimensions require normative prioritization (e.g., "Is slightly higher average life satisfaction worth exacerbating inequality?").  
  2. **Step 5 (Empirical Plausibility):** When evidence is inconclusive but ethical urgency compels action.  

  **Why this works:**  
  - Rejects policies that "game" rankings without improving well-being (Case 2).  
  - Forces explicit debate on value trade-offs (Case 1, Step 3).  
  - Anchors evaluation in multidimensional well-being, not just survey metrics.  

  This protocol ensures policies targeting happiness rankings are scrutinized through lenses of *authenticity*, *pluralism*, and *agency*—core concerns in well-being philosophy.
