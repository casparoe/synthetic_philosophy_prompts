  We are constructing a set of desiderata for theories addressing the temporal architecture and revisability of perceptual experience, based on phenomena like color phi and the Orwellian vs. Stalinesque distinction. We also consider the tri-phase chromatic echo scenario.

  Desiderata:

  1. **Accommodate Apparent Motion and Intermediate Phenomenology (Non-negotiable)**
     - *Motivation*: The standard color phi experiment (two flashes, red then green, at appropriate spatiotemporal intervals) results in a report of apparent motion and an intermediate color change (e.g., red moving to green with a mid-trajectory color blend). Any theory must account for the subject's experience of motion and the intermediate color.
     - *Non-negotiable*: Because it is a well-replicated psychophysical phenomenon.

  2. **Respect Reaction Time Data (Non-negotiable)**
     - *Motivation*: In the color phi experiment, subjects report the intermediate color (e.g., changing from red to green) before the second stimulus is presented. This implies that the experience is constructed after the second stimulus, but the reported experience includes an event that would have had to occur before the second stimulus. Reaction times show that the report of the intermediate color cannot be based on a neural representation that was present at the time of the first flash alone.
     - *Non-negotiable*: Because it is empirically established.

  3. **Distinguish Experience from Judgment (Non-negotiable)**
     - *Motivation*: We must preserve the distinction between what is genuinely experienced and what is merely inferred, judged, or confabulated. For example, a subject might confabulate a reason for an action without having had that reason as part of their experience. Similarly, we don't want a theory that blurs the line between the actual experience and a post-hoc story.
     - *Non-negotiable*: This is a foundational conceptual constraint for any theory of consciousness.

  4. **Subjective Immediacy of the Present (Non-negotiable)**
     - *Motivation*: The present moment is experienced as immediate and real. Any theory that posits a delay in experience (e.g., a "perceptual moment" that lags behind the stimulus) must account for why we don't experience that delay. Moreover, the subject feels that they are experiencing events as they happen.
     - *Non-negotiable*: Because it is a central aspect of our phenomenology.

  5. **Avoid Detectable Intermediate Neural Representations (Non-negotiable)**
     - *Motivation*: In the color phi experiment, there is no evidence of neural activity corresponding to the intermediate color at the intermediate location at the intermediate time. Thus, the theory must not require such neural representations to be present at the time they are supposed to be experienced.
     - *Non-negotiable*: Because the absence of such representations is an empirical finding.

  6. **Account for Retroactive Structuring without Collapsing Experience/Judgment (Camp-specific: important for Orwellian views)**
     - *Motivation*: The color phi phenomenon suggests that the experience of the first flash is altered by the second. But we must avoid making experience too malleable by judgment. The retroactive structuring must be a feature of the perceptual system, not a cognitive confabulation.
     - *Camp-specific*: Orwellian views require this; Stalinesque views avoid it by having the experience constructed at the time of the second flash.

  7. **Determinate Content at Every Instant (Camp-specific: preference for continuous consciousness)**
     - *Motivation*: Some hold that at every moment, the content of experience is fully determinate. There are no gaps or indeterminate states. This would rule out snapshot views that only have discrete states.
     - *Camp-specific*: This is a preference of some theories (e.g., continuous flow) over others (e.g., discrete frames).

  8. **Retroactive Structuring as Real (Camp-specific: Orwellian)**
     - *Motivation*: The Orwellian view holds that the past experience is genuinely altered. This is in contrast to the Stalinesque view that only the record is altered. The pressure comes from the intuition that the subject did not experience the first flash as a static red dot but as part of a motion event with a color change.
     - *Camp-specific*: This is the defining feature of Orwellian views.

  9. **First-Person Authority on Temporal Boundaries (Camp-specific: transparency of temporal properties)**
     - *Motivation*: The subject seems to have privileged access to when their experiences occur. If the experience of the intermediate color seems to the subject to have occurred at a particular time, then the theory should not say that it actually occurred at a different time.
     - *Camp-specific*: This is a preference for theories that respect the subject's temporal perspective.

  10. **Accommodate Complex Cases: Tri-Phase Chromatic Echo (Non-negotiable for a general theory)**
      - *Motivation*: In a tri-phase display (say, red, then green, then blue, at 80ms intervals), the subject might experience two apparent motion trajectories: red to green and green to blue, each with their own intermediate hues. How can a theory account for two overlapping retroactive bindings without having conflicting experiences at the same time (e.g., at the location of the green flash, having two different intermediate colors at the same time)? This tests the unity of consciousness at a given moment.
      - *Non-negotiable*: To be general, the theory must handle more complex cases.

  Jointly Unsatisfiable Subset?
  - Consider: 
    (A) Content is determinate at every instant (Desideratum 7).
    (B) Retroactive structuring is real (Desideratum 8).
    (C) First-person authority on temporal boundaries (Desideratum 9).

  In the color phi experiment, if the content is determinate at every instant (A), then at time t1 (when the first flash occurs) the experience must be of a static red dot. But if retroactive structuring is real (B), then after the second flash at t2, the experience at t1 is altered to be part of a motion event. However, (C) says that the subject has authority about when the experience occurred. The subject might report that the intermediate color occurred at a time between t1 and t2. But if the experience of the intermediate color is retroactively structured, then at t1 there was no such experience. So when did it occur? If we say it occurred at t1 (after being altered) then we violate the subject's report that it occurred at an intermediate time. If we say it occurred at t2, then we violate the subject's report that it occurred at the intermediate time. Hence, (A), (B), and (C) might be jointly unsatisfiable.

  Scoring the Theories:

  1. **Strict Stalinesque (Record-Falsification Model)**:
     - The experience is constructed at the time of the second flash to include the entire motion event, including the intermediate color. The subject never experienced the first flash as static; the experience was constructed as a motion event at the time of the second flash.
     - Desiderata:
       - 1: Accommodates apparent motion and intermediate color by constructing it at the time of the second flash.
