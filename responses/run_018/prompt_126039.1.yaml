answer: |-
  **MEMORANDUM**  
  **TO:** Museum Director & Preservation/Acquisitions Committee  
  **FROM:** Preservation & Acquisitions Committee Chair  
  **DATE:** 4 October 2023  
  **SUBJECT:** Recommendation Regarding Reconstruction of *Untitled (1983)* Installation  

  ---

  ### **I. RECOMMENDATION**  
  **Approve reconstruction** of the 1983 conceptual installation under the following conditions:  
  1. **Implementation Timeline:**  
     - *Archival Validation Phase* (90 days): Independent conservators verify completeness/clarity of grounding archive.  
     - *Reconstruction Phase* (12 months): Fabrication overseen by a panel including a conceptual art historian, the artist’s estate representative (if available), and a conservator.  
     - *Display Protocol Activation*: Installation to open no later than **November 2024**, with permanent contextual markers (see §IV).  
  2. **Conservation Framework:**  
     - Display must include **explicit signage** and **augmented documentation** (digital/physical) clarifying the work’s reconstructed status.  
     - Future loans/deaccession require ¾ committee approval to preserve relational integrity.  

  ---

  ### **II. ONTOLOGICAL ANALYSIS & COMMITTEE DEBATE**  
  We acknowledge two rigorously argued positions:  

  #### **A. The Materialist Argument (Losing Side)**  
  The strongest opposition holds that the **original physical substrates were ontologically irreplaceable**. Even if the artist deemed objects "local grounds," their *specific material history*—unique decay, manufacturing traces, or the 1983 gallery’s ambient wear—constituted an ineffable "haecceity" (*thisness*) inseparable from the work’s identity. A reconstruction, however precise, is a *new entity*: its existence derives from documentation, not the inaugural artistic act. To present it as the "original" risks ontological fraud, reducing the artwork to a Platonic form divorced from its physical instantiations.  

  **Committee Response:** We recognize this argument’s coherence with theories of material embodiment (e.g., Wollheim’s "physical object hypothesis"). However, this work’s *conceptual* priority—explicit in the artist’s protocols—demands we privilege **relational fidelity** over substrate authenticity. The archive’s diagrams and constraints are not mere blueprints but the *core continuity* of the work.  

  #### **B. The Relational Argument (Prevailing Side)**  
  The installation was defined by **architecture-contingent relationships** (spatial tensions, viewer pathways, light interactions). The archive provides sufficient instructions to reactivate these relations identically. As per the artist, material objects were "local grounds" (site-specific vessels), not the "fundament." Thus, faithful reconstruction *resurrects the work*, not a copy—akin to reperforming a score or restaging Cunningham’s choreography.  

  ---

  ### **III. INSTITUTIONAL OBLIGATIONS**  

  #### **A. To the Donor**  
  - The donor funds "reconstruction," implying material reinstantiation. Our plan honors this while embedding **epistemological transparency**.  
  - Clause: Funds are contingent on archival validation (§I). If gaps are found, we propose commissioning a *scholarly companion piece* contextualizing the lacuna.  

  #### **B. To the Public**  
  - **Risk:** Viewers may conflate the reconstruction with an "original" material artifact, misapprehending conceptual art’s ontology.  
  - **Mitigation:**  
    - Wall text: "*Reconstructed in 2024 from the artist’s protocols. The original material components were destroyed in 1992.*"  
    - Digital kiosk: Side-by-side comparisons of 1983 documentation vs. 2024 reconstruction.  
    - Gallery design: A reconstructed architectural fragment from the 1983 gallery *as artifact* displayed adjacent to the installation.  

  ---

  ### **IV. DISPLAY PROTOCOL**  
  The work must be exhibited with **integrated signifiers of its mediated ontology**:  
  - A translucent archival box containing facsimiles of key diagrams/documents, mounted within sightlines.  
  - Projected footnotes on adjacent walls quoting the artist’s protocols (e.g., "*The work persists where relations reactivate*").  
  - **No display of the work without these elements.**  

  ---

  ### **V. VOTE SCHEDULE**  
  Final committee vote: **Friday, 11 October 2023**.  
  If approved, archival validation begins **14 October 2023**.  

  ---  
  **Approved by:**  
  [Chair Signature]  

  ---

  ### **APPENDIX: Key Philosophical Anchors**  
  - Prevailing view aligns with Nelson Goodman’s *autographic/allographic* distinction: This work is allographic (defined by structure, not history).  
  - Materialist view reflects Ingold’s "material entanglement" theory—rejected here due to artist’s explicit relational priority.  
  - Display protocol draws from Museological "thick description" (Geertz) to prevent viewer confusion.
