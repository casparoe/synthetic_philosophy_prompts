answer: |-
  ### Workshop Activity: **The Unspoken Rule**  
  **Total Time:** 90 minutes  
  **Participants:** 12–16 fiction writers  
  **Goal:** Reveal how examples underdetermine concepts, relying on tacit salience to bridge the gap—without upfront theory.  

  ---

  ### **Part 1: Opening Puzzles (15 min)**  
  **Materials:**  
  - Slides or handouts with 3 Bongard-style problems (geometric and narrative).  
  - Timer.  

  **Facilitator Instructions:**  
  1. **Introduce (2 min):**  
     - *"We’ll start with pattern puzzles. Each has 12 boxes: 6 on the left follow a hidden rule; 6 on the right break it. Work in pairs to guess the rules."*  
     - **No theory:** Avoid terms like "Bongard problems" or "underdetermination."  

  2. **Solve Puzzles (10 min):**  
     - Display problems one by one. Allow 3 min per puzzle.  
     - **Puzzle 1 (Geometric):**  
       - Left: Circles inside squares.  
       - Right: Circles outside squares.  
       - *Tempting alternatives:* "Small shapes," "shapes touching borders."  
     - **Puzzle 2 (Narrative):**  
       - Left: 6 one-sentence stories where a secret is revealed through dialogue.  
       - Right: 6 where dialogue conveys no secret.  
       - *Tempting alternative:* "Stories set indoors."  
     - **Puzzle 3 (Narrative):**  
       - Left: 6 snippets where weather mirrors a character’s emotion.  
       - Right: 6 where weather is neutral.  
       - *Tempting alternative:* "Sentences under 15 words."  

  3. **Brief Share (3 min):**  
     - Ask pairs: *"What rule did you see? Did anyone see a different one?"*  
     - Note disagreements neutrally: *"Interesting—same boxes, different rules."*  

  ---

  ### **Part 2: Middle Game—Rule Craft & Chaos (55 min)**  
  **Materials:**  
  - Index cards (12 per participant).  
  - Pens, timer, whiteboard for scoring.  
  - Small prize (e.g., a book) + forfeit (e.g., reading a sentence in a silly voice).  

  **Facilitator Instructions:**  
  1. **Create Examples (10 min):**  
     - *"Secretly pick a narrative rule (e.g., ‘flashbacks start with sensory details’). Write 6 positive examples (follow rule) and 6 negative (break it) on cards—one sentence each. Label ‘L’ (left/positive) or ‘R’ (right/negative)."*  
     - **Tips:** Rules should be craft-focused (e.g., POV shifts, symbolic objects). Discourage vagueness ("emotional depth") or gimmicks ("words contain ‘e’").  

  2. **Swap & Guess (15 min):**  
     - Pair participants randomly. Each swaps their 12 cards with a partner.  
     - *"Guess your partner’s rule in 5 min. Write your guess."*  

  3. **Scored Reveal & Alternative Rules (25 min):**  
     - Regroup into fours (two pairs combined). For each set of 12 cards:  
       - **Guesser states rule.** Designer confirms if correct.  
       - **Scoring (on whiteboard):**  
         - Designer: **+2 pts** if guess matches their rule.  
         - Guesser: **+1 pt** if rule fits all 12 cards (even if unintended).  
         - Group: **+1 pt per person** for every *new* rule fitting all 12 cards (timed 2-min brainstorm per set).  
     - **Example Flow:**  
       - Designer’s rule: "Dialogue ends with an action beat."  
       - Guesser’s rule: "Characters touch an object while speaking."  
       - Group alternatives: "Dialogue occurs mid-movement," "Lines are under 10 words."  
       - *Outcome:* Designer scores 0 (wrong guess); guesser +1; group +3 for alternatives.  

  4. **Plenary Highlights (5 min):**  
     - Groups share: "Most surprising alternative rule?" and "A rule that was guessed correctly."  
     - Announce points leader and lowest scorer (forfeit: trivial, e.g., silly voice reading).  

  ---

  ### **Part 3: Debrief (20 min)**  
  **Facilitator Script:**  
  *(Key: Anchor in game moments; flag philosophical tensions.)*  

  1. **Map the Game to Writing (10 min):**  
     - *"When the guesser named a rule, they were like a reader inferring your novel’s ‘contract’ from Chapter 1. But when alternatives fit, we saw chaos. Why?"*  
     - **Concept Gaps:**  
       - *Settled:* **Examples underdetermine rules.** Your 12 cards couldn’t force your rule; they allowed endless fits (like defining "genre" with tropes).  
       - *Tacit Salience:*  
         - *Settled:* Humans default to "obvious" features (e.g., weather = emotion, not word count).  
         - *Contested:* *Why* salience exists—innate cognition (Chomsky) or cultural training (Wittgenstein)—is unresolved. Our game stripped shared context, amplifying noise.  
     - **Misreading Model:**  
       - Designer’s *"That’s not my rule!"* mirrors reader divergences. Group alternatives are "valid misreadings"—the text permits them.  

  2. **Limitations & Predictable Snags (7 min):**  
     - **Novel ≠ 12 Cards:**  
       - *"Real readers get 300 pages of context, not isolated examples. But openings *feel* like Bongard boxes: they set expectations with sparse data."*  
     - **Snags & Fixes:**  
       - *"If rules felt arbitrary (e.g., ‘vowels in names’), it’s because life lacks shared salience. In novels, genre trains attention (e.g., guns = Chekhov’s)."*  
       - *Embarrassment:* If a designer scored 0, stress: *"This isn’t failure—it reveals how hard communication is without conventions."*  
       - *Vague rules:* If examples were muddy, note: *"Like prose with unclear details, readers latch onto unintended features."*  

  3. **Contested Foundations (3 min):**  
     - *"Bongard problems assume one ‘intended’ rule. But if you reject that, our point still holds: even if multiple rules are ‘correct,’ writers rely on readers prioritizing the same cues. When salience misfires (e.g., cultural gaps), misreadings thrive."*  

  ---

  ### **Philosophical & Psychological Transparency**  
  - **Underdetermination:** Settled (Quine). Data never fully determines theory.  
  - **Salience Origin:** Contested. Nativists (e.g., Fodor) vs. empiricists (e.g., Barsalou).  
  - **Bongard Critique:** Some argue these problems *do* have unique solutions. If true, our narrative adaptation still stands: writing lacks "correct" visual features, amplifying underdetermination.  

  ### **Materials Checklist**  
  - Slides/handouts: 3 Bongard problems.  
  - Index cards (200+), pens, whiteboard.  
  - Timer, small prize, forfeit instructions.  
  - Printed facilitator script (this document).  

  ### **Facilitator Notes**  
  - **During Creation:** Circulate to nip gimmicks (e.g., "names start with A"). Redirect: *"Think: What ‘rule’ would a critic spot in your style?"*  
  - **During Guessing:** If stuck, ask: *"What’s the same in all left examples? Absent in all right?"*  
  - **Debrief Tone:** Candid but warm. Normalize friction—*"If this felt messy, good. Writing is messy."*  

  ---  
  This design forces the group to *live* the gap between examples and concepts, using narrative as the engine. The debrief flags where psychology, philosophy, and craft collide—without prescribing answers.
