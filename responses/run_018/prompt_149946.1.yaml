  Hmm, the user's case breakdown reveals interesting asymmetries: they see Girondin elimination as structurally overdetermined (class + ideology), Robespierre's fall as contingent (leadership failures), and Hébertist/Dantonist purges as power-monopoly enforcement. But their distinction between "structural autocannibalism" and "agentive purge" seems shaky—as they note, even "structural" cases involved committee votes. 

  Ah! The Napoleon case clarifies their boundary: autocannibalism requires consumption by the revolutionary center itself, not external forces. This helps explain why Directory's fall doesn't qualify. Their 1871 Commune test case will be telling since it involves revolutionaries suppressing more radical revolutionaries.

  For a unified principle, I'll need to reconcile their Robespierre contingency with Girondin inevitability. The key might be distinguishing between revolutionary phases: early instability creates structural vulnerability to purges, but specific outcomes remain contingent. This preserves both intuitions—Danton might've survived with different choices, but the system kept generating purge targets.

  The hardest tradeoff concerns the Hébertist/Dantonist purges. To unify the theory, we might reframe both as maintaining the Committee's operational control, though differing in ideological direction. But this requires softening their "same mechanism" claim since the Committee was eliminating opposing threats rather than identical threats.

  Ultimately, the user seems to want a framework that acknowledges structural pressures without full determinism. The proposed principle should treat autocannibalism as highly probable but not inevitable—a systemic risk amplified by unresolved power struggles. Their Danton counterfactual becomes the exception that proves the rule: survival was possible but required extraordinary agency to escape the logic of purges.
answer: |-
  Here's a precise principle integrating your verdicts and resolving tensions, followed by analysis of tradeoffs and predictions:

  **Principle of Revolutionary Center Self-Purification:**  
  *A revolution devours its architects when the ruling revolutionary center eliminates factions that credibly challenge its operational control of the revolutionary state apparatus during foundational crises, driven by the center's perceived necessity to maintain monopoly over revolutionary violence and legitimacy. This occurs through:  
  (1) **Ideological purification** when factions threaten doctrinal coherence essential for mobilization (Girondins' "federalism," Hébertists' extremism),  
  (2) **Contingent leadership failure** when tactical errors prevent coalition management (Robespierre's overreach),  
  (3) **Class struggle** only when explicitly mobilized by the center against factional allies (sans-culotte pressure vs. Girondins).  
  *Excluded* are: external military conquest (18 Brumaire), non-revolutionary decay (Directory's collapse), or suppression of groups lacking institutional power (e.g., proto-Commune 1792).*

  ### Key Distinctions & Tradeoffs
  1. **Girondins (1793):** Overdetermined but *ideological purification* is primary (federalism = existential threat). Structural inevitability stems from their challenge to Jacobin control during existential war.  
  2. **Robespierre (1794):** *Contingent leadership failure* dominates. Your verdict stands: strategic errors (Prairial Law, alienating Convention) made fall likely but not inevitable.  
  3. **Hébertists vs. Indulgents (1794):** **Must treat as distinct mechanisms.**  
     - *Hébertists:* Ideological purification (extremism destabilizing center).  
     - *Indulgents:* Monopoly maintenance (moderation threatening Terror apparatus).  
     Calling both "monopoly of violence" overgeneralizes; the *nature* of the threat differs.  
  4. **Thermidor vs. Purges:** Thermidor is **not** self-purification—it’s the revolutionary center (Convention) destroying its *own* executive committee (CPS) after Robespierre lost control of the center. This is a *counter-revolutionary coup within the revolution*, not autocannibalism.  

  ### Necessity vs. Contingency  
  - **Structural risk, not inevitability:** The revolutionary center *always* faces centrifugal forces during crisis (making autocannibalism likely), but outcomes depend on:  
    - Leader skill (Danton *might* have moderated Terror if surviving April 1794)  
    - External pressures (war/vendée) intensifying purge logic  
    - Institutional rigidity (e.g., Law of 22 Prairial)  
  - Your Girondin inevitability and Danton contingency are **compatible:** Early revolutions have weaker institutions, making purges more structurally compelled. Later phases allow more agency.  

  ### Test Case: Paris Commune (1871)  
  - **Verdict by principle:** *Not* autocannibalism.  
  - **Why:** The Versailles government was no longer a *revolutionary center*; it represented the established Third Republic suppressing an insurrection. The Communards lacked control of the state apparatus. This is **counter-revolutionary suppression**, not self-purification.  

  ### Simplest Unified Account Tradeoffs  
  To achieve maximal coherence:  
  - **Overturn:** The Hébertist/Indulgent "same mechanism" claim. Accept that purges target *asymmetric* threats (extremism vs. moderation) under the umbrella of center control.  
  - **Preserve:** Robespierre’s contingency and Napoleon/Directory exclusions.  
  - **Refine:** Thermidor as collapse of revolutionary government (center shifting), not autocannibalism.  

  ### Conclusion  
  Revolutions **risk** devouring architects due to institutional fragility and zero-sum crisis politics, but skilled leadership and adaptable institutions can mitigate this. Your cases show autocannibalism is primarily driven by **ideological schism** and **monopoly maintenance**, exacerbated by **contingent errors**—not class struggle (which is secondary) or inevitable structural fate.
