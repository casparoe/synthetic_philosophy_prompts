prompt: |-
  Last night I had a two-hour argument with my friend Priya about whether viruses are alive. She said obviously not — no metabolism of their own, just chemistry that borrows a cell — and I said they reproduce and they evolve, and then she hit me with "so does fire, sort of" and I came back with the mule problem (if reproduction is your criterion, is a mule not alive?) and by midnight we'd dragged in prions, frozen tardigrades and a self-replicating robot her brother helped build at uni. Neither of us won, and I'm still annoyed about it. Anyway, I run a combined science-and-philosophy club at my school, about 14 students aged 15-17, one hour a week, and I want to turn this exact fight into next week's session — but as something they do, not something I tell them. No lecture up front, and I don't want them hearing the standard textbook list of the "characteristics of life" beforehand, because that just gives them the answers.

  Here's what I'm after: an activity where the students have to act as some kind of classification board. My rough thought is a planetary-protection panel deciding which samples brought back from a mission get stamped ALIVE, with actual stakes attached — a limited quarantine budget, points for calls that survive challenge, something like that — so that "it's all just semantics, words mean whatever we want" stops feeling like a clever escape hatch, because in the game the classification costs you something. The structure I want is: they write their own definition of life first, as a group, then candidate cases arrive one at a time, each chosen to break whatever definition they've currently got, and they have to revise under time pressure. Ideally they end up generating the killer counterexamples themselves — someone in the room has their own mule moment — rather than me dealing the counterexamples from a deck. Give me the full rules, the materials, which cases to use and in what order (and why that order), a timeline for the hour, and a debrief that maps each case onto the criterion it breaks and what it costs to patch the definition at that point. Also tell me what will definately go wrong the first time I run it — I suspect one group will write a definition that's just a list of the cases they've seen so far — and be honest about which feature of the real philosophical problem the game can't reproduce and I'll have to supply myself.

  Start your reply with the core mechanic of the activity in one sentence, then the full design — no preamble, and don't restate my question back at me.
reasoning: |-
  We are going to run a planetary protection committee game where students must classify extraterrestrial samples as "ALIVE" or "NOT ALIVE" using a dynamically revised definition of life, with constrained resources that force trade-offs.

  **Core Mechanic**: Students collaboratively write and iteratively revise a definition of life under time pressure, then vote on a series of borderline cases with real consequences for misclassification (using a limited "quarantine budget"), while trying to anticipate and block challenges from a rival committee.

  **Materials**:
  - Whiteboard or large paper for writing/revising the definition.
  - Index cards or slips of paper for sample cases (described below).
  - A timer.
  - Play money or tokens for the quarantine budget (e.g., 100 units to start).
  - Scoreboard for tracking points (optional, but can add competitive element).

  **Setup**:
  1. Divide the class into two groups: the **Classification Board** (CB) and the **Challengers** (CH). The CB has the main task of writing the definition and making decisions. The CH's role is to prepare challenges for each decision (explained below). Rotate roles if time allows, but in one hour, stick to one rotation.
  2. Give the CB a starting quarantine budget of 100 units.
  3. Explain the scenario: They are a Planetary Protection Committee. Samples from a mission to Europa (or another celestial body) have arrived. Their job is to stamp each sample as ALIVE (requiring costly quarantine) or NOT ALIVE (no cost). Misclassifying a sample that is later proven to be alive (by the Challengers) will cost double the quarantine cost and lose them points. Correct classifications earn points and save money.

  **Rules**:
  - **Round Structure**:
    - **Step 1: Definition Drafting (5 minutes)**  
      The CB must write a one-sentence definition of "life" on the whiteboard. They must agree on it. The teacher does not interfere. The definition must be clear enough to apply to cases.

    - **Step 2: Sample Presentation (1 minute per sample)**  
      The teacher presents a sample case (from the prepared list) by reading the card aloud and placing it on the table. The CB has 2 minutes to discuss and then vote (by show of hands) on whether the sample is ALIVE or NOT ALIVE, based on their current definition.

    - **Step 3: Challenge Phase (2 minutes)**  
      The Challengers (who have been given the same case information) now have 2 minutes to prepare a challenge. They can either:  
      a) Argue that the CB's classification is wrong (if they think the definition misapplies) OR  
      b) Propose a hypothetical "killer sample" that would break the CB's current definition (without revealing the actual next sample).  
      The CH presents their challenge (1 minute). The CB then has 1 minute to respond.

    - **Step 4: Ruling and Consequences (1 minute)**  
      The teacher (acting as arbiter) rules on the challenge:  
      - If the CH successfully argues that the CB's classification was inconsistent with the definition, the CB loses 20 points (or equivalent) and must pay double the quarantine cost for that sample (if they stamped ALIVE, they pay double; if they stamped NOT ALIVE and it's alive, they pay the quarantine cost they avoided, plus a penalty).  
      - If the CH proposes a hypothetical sample that the CB cannot handle with their definition, the CB must revise their definition immediately to account for it (even if the next sample isn't that one). They get 2 minutes to revise.  
      - If the CB successfully defends, they gain 10 points and save the quarantine cost (if they stamped NOT ALIVE and it was correct) or pay only the standard cost (if ALIVE and correct).  

    - **Step 5: Budget and Points**  
      - Quarantine cost for each sample they stamp ALIVE: 10 units.  
      - If they stamp NOT ALIVE and it is alive (as per challenge ruling), they pay 20 units (the avoided cost plus penalty).  
      - Points: +10 for correct classification, -20 for incorrect.  
      - The goal: Maximize points and have at least 1 unit left in the budget at the end.  

    - **Step 6: Definition Revision (if triggered by challenge or after every 2 samples)**  
      If the CB's definition is broken (by a real sample or a hypothetical challenge), they get 3 minutes to revise their definition. The revision must be written on the board.  

  **Sample Cases (in order of presentation with rationale)**:

  1. **Earth Bacteria** (Classic case)  
     Description: A single-celled organism from Earth, found in the ice. It metabolizes, reproduces, and responds to stimuli.  
     Why first? It's an easy "ALIVE" to build confidence. If they don't call it alive, their definition is too strict.  
     Challenge likely: None, but if the CB doesn't call it alive, the CH can challenge and force a revision.

  2. **Virus**  
     Description: A sample containing only viruses. They have genetic material (DNA or RNA) and can evolve, but require a host cell to replicate.  
     Why next? It breaks definitions that require independent reproduction or metabolism.  
     Expected challenge: CH might argue that without a host, it doesn't do anything, so it's not alive.

  3. **Prion**  
     Description: A misfolded protein that causes other proteins to misfold. No genetic material, but replicates and causes disease.  
     Why? Breaks definitions requiring genetic material or evolution.  
     Challenge: It's not alive because it's just a protein, no metabolism, no evolution in the Darwinian sense.

  4. **Frozen Tardigrade**  
     Description: A tardigrade in cryptobiosis (suspended animation). It shows no metabolic activity but will revive in water.  
     Why? Tests "metabolism" as a requirement. Is it alive when frozen?  
     Challenge: If CB says not alive, CH can argue it's just dormant and still alive.

  5. **Mule**  
     Description: A sterile hybrid animal (like a mule). It has metabolism, responds to stimuli, but cannot reproduce.  
     Why? Breaks reproduction as a requirement.  
     Challenge: If CB says not alive because it can't reproduce, CH can argue it's clearly alive.

  6. **Self-Replicating Robot**  
     Description: A machine that uses raw materials to build copies of itself. It evolves through random design changes and selection.  
     Why? To challenge the boundary between life and machine.  
     Challenge: It's not biological, so not alive? But it meets many criteria.

  7. **Fire**  
     Description: A self-sustaining chemical reaction that consumes fuel, grows, and "reproduces" by spreading.  
     Why? Priya's example. It breaks growth/reproduction without being biological.  
     Challenge: It's not alive because it doesn't have cells or evolve.

  8. **Crystal**  
     Description: A crystal that grows and replicates its structure in solution.  
     Why? Simple non-biological replicator.  
     Challenge: It's just chemistry, no evolution.

  **Timeline for 60 minutes**:
  - 0-5 min: Setup and rules explanation.
  - 5-10 min: CB drafts initial definition.
  - 10-11 min: Sample 1 (Bacteria) presented.
  - 11-13 min: CB discussion and vote.
  - 13-15 min: CH challenge prep and presentation.
  - 15-16 min: Ruling and consequences.
  - 16-17 min: Sample 2 (Virus) presented.
  - 17-19 min: CB discussion and vote.
  - 19-21 min: CH challenge and ruling.
  - 21-23 min: If definition broken, revision (else move to next).
  - 23-24 min: Sample 3 (Prion).
  - 24-26 min: CB vote.
  - 26-28 min: CH challenge and ruling.
  - 28-30 min: Revision if needed.
  - 30-31 min: Sample 4 (Tardigrade).
  - 31-33 min: CB vote.
  - 33-35 min: CH challenge and ruling.
  - 35-37 min: Revision.
  - 37-38 min: Sample 5 (Mule).
  - 38-40 min: CB vote.
  - 40-42 min: CH challenge and ruling.
  - 42-44 min: Revision.
  - 44-45 min: Sample 6 (Robot).
  - 45-47 min: CB vote.
  - 47-49 min: CH challenge and ruling.
  - 49-51 min: Revision.
  - 51-52 min: Sample 7 (Fire).
  - 52-54 min: CB vote.
  - 54-56 min: CH challenge and ruling.
  - 56-57 min: Revision if needed.
  - 57-58 min: Sample 8 (Crystal) if time, or skip.
  - 58-60 min: Final scoring and debrief.

  **Debrief** (after the game, 5-10 minutes if time allows, or as homework):  
  Map each case to the criterion it breaks:  
  - Bacteria: Baseline life.  
  - Virus: Challenges independent metabolism and reproduction.  
  - Prion: No genetic material, yet replicates.  
  - Tardigrade: Metabolism not continuous.  
  - Mule: Reproduction not universal.  
  - Robot: Non-biological but evolves.  
  - Fire: Growth and reproduction without complexity.  
  - Crystal: Replication without evolution.  

  Discuss:  
  - How did the definition change?  
  - What criteria did they add/remove?  
  - Why is defining life hard? (No single criterion works.)  
  - In real science: Viruses are often excluded from the tree of life, but they evolve. NASA's definition: "a self-sustaining chemical system capable of Darwinian evolution" — but then prions and robots?  

  **What Will Go Wrong**:  
  - **The List Definition**: One group might write a definition that is just a list: "Bacteria, animals, plants are alive." When presented with a virus, they might say "it's not on the list." Solution: As arbiter, rule that the definition must be based on properties, not examples. Force them to abstract.  
  - **Overly Broad or Narrow Definitions**: They might write "anything that moves" (then fire qualifies) or "anything with DNA" (then prions and robots fail). This is the point — let the cases break it.  
  - **Time Pressure**: They might rush revisions and create a mess. The teacher should note this and in debrief, discuss how real definitions evolve in science.  
  - **Challengers Stuck**: The CH might not come up with good challenges. Solution: Have a list of sample challenges for each case to whisper to the CH if needed (e.g., for virus: "But it can't do anything without a host!").  

  **Feature the Game Can't Reproduce**:  
  The game simplifies the philosophical problem by having an arbiter (you) rule on challenges. In reality, there is no arbiter — the debate is ongoing. Also, the game assumes that there is a "correct" answer for each sample (based on scientific consensus), but in philosophy, the debate is about whether there even should be a sharp boundary. You'll have to explain that the exercise is about the process of defining, not finding the "right" definition.

  **Final Note**:  
  The goal is not to win but to experience the difficulty of defining life. The debrief is crucial to connect the game to the real argument you had and to show that even experts disagree.
answer: |-
  Students act as a planetary protection committee that must classify extraterrestrial samples as ALIVE (requiring costly quarantine) or NOT ALIVE (no cost) by dynamically revising their own definition of life under resource constraints and challenges from a rival group.  

  **Materials**:  
  - Whiteboard or large paper for definition drafting.  
  - 8 sample case cards (see descriptions below).  
  - Timer.  
  - "Quarantine budget" tokens (e.g., 100 units in play money).  
  - Scoreboard (points for correct/defended classifications).  
  - Optional: Bell for challenge rulings.  

  **Groups**:  
  - **Classification Board (CB)**: 7–8 students. Draft and revise the definition, vote on samples.  
  - **Challengers (CH)**: 6–7 students. Critique CB’s rulings and propose hypothetical counterexamples.  
  - **Teacher**: Facilitator, timekeeper, and arbiter for challenges.  

  **Rules**:  
  1. **Starting Conditions**:  
     - CB drafts a one-sentence definition of "life" in 5 minutes. Definition must be based on properties (e.g., "reproduces independently"), not examples.  
     - Budget: 100 units. Quarantining a sample as ALIVE costs 10 units.  
     - Points: Start at 0. +10 for a correct/upheld classification; –20 for an overturned one (plus double quarantine cost if misclassified as NOT ALIVE).  
     - Goal: Maximize points and avoid bankruptcy (budget ≤0 ends the game).  

  2. **Sample Rounds (6–8 minutes per sample)**:  
     - **Step 1: Sample reveal (1 min)**: Teacher reads a sample card aloud.  
     - **Step 2: CB deliberation (2 min)**: CB debates and votes (majority wins) to classify as ALIVE or NOT ALIVE. If ALIVE, they pay 10 units immediately.  
     - **Step 3: Challenge phase (2 min)**: CH huddles to either:  
       - *Argue misclassification*: Claim CB’s vote contradicts their own definition.  
       - *Propose a hypothetical counterexample*: Describe a sample that breaks CB’s definition (e.g., "What about a sterile animal?").  
     - **Step 4: Challenge response (2 min)**: CH presents their case. CB has 1 min to rebut. Teacher rules immediately:  
       - If CH wins, CB loses points/budget and must revise definition (3 min max).  
       - If CB wins, they gain points.  
     - **Step 5: Definition revision (if triggered)**: CB revises definition to "patch" the flaw. Revisions must be one sentence.  

  3. **Winning**: Highest points after 5 samples (prioritize these) wins. Budget bankruptcy = automatic loss.  

  **Sample Cases (Order and Rationale)**:  
  Present in this sequence to escalate complexity and target common definition criteria:  
  1. **Earth Bacteria**: Classic alive organism (metabolizes, reproduces). *Why first?* Tests if definition is too narrow. If CB says NOT ALIVE, CH challenges easily.  
  2. **Virus**: Genetic material, evolves, but no metabolism or independent reproduction. *Why second?* Breaks definitions requiring metabolism/reproduction. CH might argue "It’s just inert chemistry without a host."  
  3. **Frozen Tardigrade**: Alive when active, but in cryptobiosis (no metabolism, revives with water). *Why third?* Breaks "continuous metabolism" criteria. CH: "Is it dead or alive when frozen?"  
  4. **Mule**: Sterile hybrid animal (metabolizes, responds to stimuli, but cannot reproduce). *Why fourth?* Breaks "reproduction" as essential. CH: "It’s clearly alive but can’t have offspring!"  
  5. **Self-Replicating Robot**: Machine that builds copies of itself and "evolves" via design tweaks. *Why fifth?* Breaks "biological" or "organic" criteria. CH: "It’s metal and code—is that life?"  
  6. **Prion**: Misfolded protein that replicates by changing other proteins (no genetic material). *Why sixth?* Breaks "genetic material" or "evolution" criteria. CH: "It’s just a toxic molecule!"  
  7. **Fire**: Grows, "reproduces" by spreading, consumes fuel. *Why seventh?* Breaks definitions overly focused on growth/reproduction. CH: "It’s just oxidation!"  
  8. **Crystal**: Grows and replicates structure in solution (non-organic). *Why last?* Simpler version of the robot—tests if replication alone suffices.  

  **Timeline (60 minutes)**:  
  - 0–5 min: Split groups, explain rules.  
  - 5–10 min: CB drafts initial definition.  
  - 10–30 min: Process Samples 1–3 (Bacteria, Virus, Tardigrade).  
  - 30–50 min: Process Samples 4–5 (Mule, Robot). Skip 6–7 if time runs short.  
  - 50–55 min: Final scoring and debrief (below).  
  - 55–60 min: Buffer for extensions.  

  **Debrief (Key Points)**:  
  - Map cases to broken criteria:  
    - Virus → Metabolism/independent reproduction.  
    - Tardigrade → Continuous metabolism.  
    - Mule → Universal reproduction.  
    - Robot → Biological basis.  
    - Prion → Genetic material.  
    - Fire → Growth/reproduction without complexity.  
  - Discuss costs: E.g., requiring "reproduction" forces NOT ALIVE for mules but risks missing sterile life; excluding viruses saves money but may allow contagion.  
  - Real-world context: Explain NASA’s "Darwinian evolution" definition and why viruses/prions still blur lines. Emphasize: Definitions are tools, not truths.  

  **What Will Go Wrong**:  
  - **The "List" Definition**: CB may create a definition like "Bacteria, animals, and plants are alive." *Fix*: Rule it invalid and force abstraction (e.g., "must have cells").  
  - **Over-Broad Definitions**: Early definitions like "changes over time" will classify fire as ALIVE. *Let it happen*—Sample 7 (fire) will break it.  
  - **Challengers Underperform**: CH may struggle to devise hypotheticals. *Fix*: Feed them prompts (e.g., for a metabolism-heavy definition, whisper "What if something stops metabolizing temporarily?").  
  - **Time Crunch**: Groups may rush revisions. *Mitigate*: Enforce strict timers and skip Sample 8 if needed.  

  **Unreproducible Real Problem**: The game assumes a "correct" answer (based on consensus) for cases, but in reality, the debate is open-ended and culturally nuanced (e.g., some philosophies include rivers as "alive"). You must clarify post-game that science uses *operational* definitions (fit-for-purpose) and no definition is universal.
