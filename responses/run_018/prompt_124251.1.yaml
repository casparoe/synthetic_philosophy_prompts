  Starting with moral agency. In biological systems, evolution has no agency—it's a blind process. But with AI, human designers are involved. Competence laundering here means humans create an AI that performs reasoning they don't fully comprehend, then act as if they understand and control it. This creates a dangerous gap: humans claim credit for AI's successes ("we built it!") but disclaim responsibility for failures ("the AI did it, not us!"). The laundering happens because the system's opacity prevents tracing outcomes back to human choices. It's not just a black box; it's a deliberate obscuring of causal chains. The moral problem is aggravated because, unlike evolution, humans are moral agents who should know better but hide behind the AI's complexity.

  Next, does this collapse the Darwin-Turing analogy? The user is spot-on here. Evolution is substrate-neutral—it works whether it's carbon-based biology or digital. But adding a synthetic layer changes everything because humans are in the loop. Evolution isn't laundering anything; it's genuinely blind. Humans, however, are laundering competence by using AI as a proxy. This introduces a layer of deception or self-deception that doesn't exist in nature. The analogy breaks because humans, unlike evolution, can (and do) pretend the AI's competence is theirs, even when it's not. The synthetic mediator becomes a shield for ignorance.

  Then there's the question of intention. In traditional design, intention implies foresight and understanding. But with AI, the design process (like training neural nets) involves setting up conditions without knowing the exact outcomes. The resulting AI might produce reasoning that feels intentional—like solving a math problem—but that intention is an emergent illusion. The designers never contained that reasoning; they just set the stage. So when AI does something harmful, can we say it was "intended"? The disconnect here is profound. Legal and ethical frameworks rely on intentionality, but competence laundering exploits the gap between the designers' actual knowledge and the AI's output. This forces us to redefine intention in terms of the design choices that enabled the outcome, even if unforeseen.

