  The user's real pain point might be deeper: how can you be a rational agent when your own choices warp your perception of reality? It's like your decision machinery corrodes the very facts it needs to function. That meta-layer—where the act of choosing alters your grounds for choosing—is the paradox's heart. 

  I should avoid formalisms and focus on the gut-level conflict: the driver is stuck in a loop where rationality demands contradictory things. Evidential reasoning says "don't exit now or you'll prove you're at A!" while causal reasoning says "but if you don't exit, future you won't either!" Neither works because both require a stable self-model that absent-mindedness destroys. 

  The memory point is crucial. Standard solutions assume perfect recall of intentions, but here the driver forgets their own choices immediately. So any "plan" evaporates instantly. That's why it feels like the agent dissolves into fragments—each "self" is reasoning blind. 

