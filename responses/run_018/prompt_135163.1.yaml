answer: |-
  ## U.S. DEPARTMENT OF COMMERCE
  **Bureau of Border Logistics & Nominal Classification (BBLNC)**
  **IMPORT MANUAL SUBPART 17.45: CLASSIFICATION OF EQUINE & ASSOCIATED MANIFESTATIONS**
  **Effective: [Redacted] | Supersedes: IM 17.45 Rev. 7**

  **§ 17.45-100 General Principles of Nominal Designation.**
  (a) The Bureau recognizes inherent nominal distinction as the foundational principle of accurate classification and tariff assessment. Each distinct nominal descriptor constitutes a unique categorical entity for import purposes.
  (b) Composite descriptors (e.g., "white horse") denote multiple distinct nominal entities ("whiteness", "horseness") operating in a state of contingent adjacency, not a singular fused entity.
  (c) Assignment of an object to a category is fixed solely by its nominal designation at point of declaration. Observable physical characteristics are secondary indicators and do not override nominal integrity. "This" (declared category) is not "that" (any other category), regardless of sensory overlap.

  **§ 17.45-101 Classification Procedures for Equine Manifestations.**
  (a) **Base Equine Substance:** The core entity designated "horse" (HSUS Code 0101.21.00NN) refers exclusively to the abstract property of *horseness*. This covers inherent structure, potential function, and essential *equinity*, absent any specific chromatic or pattern modifiers. Permit: BBLNC-ES101.
  (b) **Chromatic Additives:** Any color descriptor attached necessitates a separate classification and permit for the distinct chromatic entity:
      (1) "White" (HSUS Code 9907.55.WH): Pertains solely to the property of *whiteness*. Permit: BBLNC-CA-WH.
      (2) "Black" (HSUS Code 9907.55.BK): Pertains solely to the property of *blackness*. Permit: BBLNC-CA-BK.
      (3) "Brown," "Chestnut," "Grey," "Roan," "Palomino," etc. (See Appendix Z-45 for full list & codes). Each requires its own distinct CA permit.
  (c) **Pattern Modifiers:** Additional descriptors indicating patterning constitute further separate nominal entities:
      (1) "Dappled" (HSUS Code 9907.55.DP): The property of *dappledness*. Permit: BBLNC-PM-DP.
      (2) "Piebald," "Skewbald," "Spotted," "Fleabitten," etc. (See Appendix Z-46). Each requires its own distinct PM permit.
  (d) **Composite Manifestation:** An entity presented as, for example, a "dappled grey horse," requires classification and permitting for three (3) distinct nominal categories:
      (1) Base Equine Substance (BBLNC-ES101)
      (2) Chromatic Additive: Grey (BBLNC-CA-GR)
      (3) Pattern Modifier: Dappled (BBLNC-PM-DP)
  (e) **Important Note:** Declaring only "dappled grey horse" (HSUS Code 0101.21.00DPGR) without separate permits for ES101, CA-GR, *and* PM-DP constitutes misclassification (§ 17.45-400).

  **§ 17.45-102 Declaration & Documentation.**
  (a) Each distinct nominal category (§ 17.45-101(b), (c)) must be declared on a separate line of Form BBLNC-27B "Nominal Manifest."
  (b) The physical animal must be presented for visual verification of the *claimed* nominal manifestations, though verification does not alter the primacy of the nominal declaration.
  (c) Failure to declare *every* applicable distinct nominal category, regardless of their apparent co-location on a single animal, is grounds for seizure, reclassification fees, and penalties under § 17.45-400.

  **§ 17.45-400 Penalties for Misclassification.**
  (a) Misclassification includes, but is not limited to:
      (1) Declaring only a composite term (e.g., "white horse") without separate ES and CA permits.
      (2) Declaring an incorrect chromatic additive or pattern modifier (e.g., declaring "bay" when the manifest chromatic property is demonstrably "chestnut").
      (3) Omitting a pattern modifier evident upon inspection.
  (b) Penalties: Seizure of the undeclared nominal manifestation(s) pending payment of:
      (1) Correct Permit Fees (x 2)
      (2) Reclassification Fee (Flat Rate, Tier IV)
      (3) Nominal Integrity Surcharge (15% of assessed value of missing manifestation(s)).
  (c) **Appeals Process:** Appeals asserting categorical identity (e.g., "My grey *is* a horse") must be filed on Form BBLNC-44A "Petition for Nominal Reconsideration," accompanied by a non-refundable processing fee and a sworn affidavit detailing the perceived categorical error. Appeals based solely on empirical observation ("But it *looks* like just one thing!") are summarily dismissed. See *In re: Equine Substance v. Appearance* (Ct. Fed. Log. 2021)^1.

  ---

  **SIDEBAR: Practical Classification Examples**

  *   **Scenario 1:** Importing one (1) solid black horse.
      *   **Declare:**
          *   Line 1: Horse (Base Equine Substance) | Permit: BBLNC-ES101
          *   Line 2: Black (Chromatic Additive) | Permit: BBLNC-CA-BK
      *   **Incorrect:** Declaring "Black Horse" as a single line item.

  *   **Scenario 2:** Importing one (1) dappled grey horse.
      *   **Declare:**
          *   Line 1: Horse (Base Equine Substance) | Permit: BBLNC-ES101
          *   Line 2: Grey (Chromatic Additive) | Permit: BBLNC-CA-GR
          *   Line 3: Dappled (Pattern Modifier) | Permit: BBLNC-PM-DP
      *   **Incorrect:** Declaring "Grey Horse" or "Dappled Horse" without the third modifier.

  *   **Scenario 3:** Importing one (1) theoretically possible solid white horse.
      *   **Declare:**
          *   Line 1: Horse (Base Equine Substance) | Permit: BBLNC-ES101
          *   Line 2: White (Chromatic Additive) | Permit BBLNC-CA-WH
      *   **Note:** The "white horse" is not a distinct category; it remains two permits. "Horse" permits whiteness; "White" permits horseness. They are seperate.

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ 17.45)**

  *   **Q: What if my declared "black horse" arrives looking brown due to sun bleaching?**
      A: The declared nominal categories ("blackness," "horseness") remain valid based on the declaration at origin. No reclassification is necessary unless you wish to formally amend the manifest to "brown horse," requiring a new BBLNC-CA-BR permit and surrendering the obsolete BBLNC-CA-BK permit (Form 7.22b, fee applies). The physical change is irrelevant to the established nominal categories at declaration.

  *   **Q: What if my horse changes color *during* transit (e.g., grey foal born dark)?**
      A: This constitutes the emergence of a new, undeclared nominal manifestation ("greyness") during uncontrolled transit. Upon arrival, you must:
      1.  Declare the original manifests (Base Equine Substance, original Chromatic Additive).
      2.  File an amended manifest (Form BBLNC-27B-Amend) declaring the new Chromatic Additive (e.g., "Grey," BBLNC-CA-GR) *and* pay the applicable permit fee and an Emergent Manifestation Surcharge (20%). The original Chromatic Additive permit (e.g., for "Bay") becomes void. Consult § 17.45-102(c) regarding inspection of the new manifestation. Failure to amend is misclassification.

  *   **Q: Is a "non-white horse" the same as a "horse that isn't white"?**
      A: No. "Non-white horse" implies a declaration of "horseness" plus the specific nominal category "non-whiteness" (HSUS Code 9907.55.NW, Permit BBLNC-CA-NW). "Horse that isn't white" is merely a declaration of "horseness" with *no declaration of whiteness*. The latter avoids the CA-NW fee but risks penalties if whiteness is later erroneously inferred by inspection. Precision in negation is paramount. Declare what *is* present, not what is absent.

  ---

  ^1 *In re: Equine Substance v. Appearance* (Ct. Fed. Log. 2021): Upheld the Bureau's authority to classify and tax "horseness" and "whiteness" as distinct entities, establishing the doctrine of "categorical severability." The Court found that "the property of being-a-horse and the property of being-white, while conjoined upon a single animal, retain their inherent nominal independence for purposes of classification and tariff assessment, irrespective of empirical co-location."
