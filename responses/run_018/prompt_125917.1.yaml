answer: |-
  ### Essay Question (90 minutes, 30 marks)  
  **Evaluate the utility of "societal collapse" as an analytic category when confronted with evidence of transformational continuity. Using the Late Bronze Age Eastern Mediterranean (c. 1200 BCE), Classic Maya southern lowlands (c. 800–900 CE), and Rapa Nui (c. 1600–1800 CE), address the following:**  
  1. **Identify one *specific, non-generic mechanism* driving change in each society (e.g., avoid "climate change" or "war" without contextual precision).**  
  2. **Explain how *transformational continuity*—the persistence of domestic rituals, local exchange, or subsistence practices—manifests *differently* in each case, challenging a uniform collapse narrative.**  
  3. **Address the objection that abandoning "collapse" ignores rapid demographic decline or political fragmentation.**  
  4. **Conclude by either proposing a *precise, defensible definition of collapse* that accommodates continuity, or arguing for the term’s abandonment in cross-cultural analysis.**  

  ---

  ### Model Answer (Approx. 800 words)  
  The concept of societal "collapse" faces profound challenges when confronted with archaeological evidence of transformational continuity—where elite institutions disintegrate while quotidian practices persist. This tension reveals collapse as an analytical category that risks misrepresenting societal change by prioritizing administrative hierarchies over lived experience.  

  **(1) Case-Specific Mechanisms of Change**  
  - **Late Bronze Age Eastern Mediterranean**: The critical mechanism was the *disruption of palatial tin-bronze supply chains*. Mycenaean palaces monopolized bronze production, relying on Cypriot copper and Anatolian/Afghan tin. When seaborne raiding (e.g., Sea Peoples) and Hittite fragmentation severed these networks after 1200 BCE, palatial economies imploded. This was not "war" generically, but the collapse of a *specific interregional dependency*.  
  - **Classic Maya**: The key driver was the *breakdown of divine kingship’s hydrological legitimacy*. Southern lowland cities like Tikal depended on rulers to maintain reservoirs during dry seasons. Prolonged droughts (c. 800–900 CE) exposed rulers’ inability to ensure water, triggering the abandonment of royal ceremonies. This eroded the *ideological mechanism* binding subjects to centers.  
  - **Rapa Nui**: The pivotal factor was the *post-contact rupture of kinship-based labor organization*. While internal deforestation occurred, European slavers (Peruvian *blackbirders*) abducted ~1,500 Rapanui (c. 1860–1862), including lineage heads. This abruptly destroyed the social structure coordinating statue transport, not "ecocide" alone.  

  **(2) Transformational Continuity as Challenge**  
  Continuity undermines collapse narratives by revealing resilience beneath elite disintegration:  
  - **Late Bronze Age**: Palatial administrative centers (e.g., Pylos) were abandoned, yet *household ceramic production continued uninterrupted* (e.g., stylistic evolution of Handmade Burnished Ware). Local exchange in tools and textiles thrived, indicating reversion to autonomous household economies without central redistribution.  
  - **Classic Maya**: While royal cities like Copán were deserted, smaller centers like Lamanai saw *continuous ritual depositions in household shrines*. Ceramics and obsidian tools persisted in rural settlements, proving subsistence and local trade networks outlived divine kingship’s fall. Collapse was urban and political, not societal.  
  - **Rapa Nui**: Despite the supposed "ecocide" collapse (c. 1600s), *taro terrace farming and *ramongrongo* tablet rituals continued through the 1700s*. The true rupture came with slave raids, which devastated population continuity—exposing "collapse" as a Eurocentric projection obscuring colonial violence.  

  **(3) Confronting Demographic/Political Objections**  
  Rapid demographic decline (e.g., Maya lowlands losing ~90% population) *appears* to validate collapse. Yet this confuses symptom with cause: depopulation followed political fragmentation but was not synonymous with societal failure. In the Mediterranean, population rebounded in centuries; on Rapa Nui, slave raids artificially accelerated decline. Political fragmentation—Mycenaean citadels dissolving into villages, Maya city-states atomizing—reflects the *unbundling* of administrative layers, not civilizational extinction. Continuity in domestic practices proves adaptation, not apocalypse.  

  **(4) Conclusion: Redefining or Rejecting "Collapse"**  
  "Collapse" must be redefined with precision or discarded. It is defensible *only* as **the rapid dissolution of centralized political and ideological institutions, coexisting with the transformation of subsistence and cultural practices**. This distinguishes administrative failure from societal death. The Maya case shows collapse is *spatially contingent* (urban vs. rural); Rapa Nui reveals its *temporal distortion* (blaming pre-contact ecology for colonial trauma). Alternatively, abandon "collapse" for **"political fragmentation"** and **"institutional transformation,"** which better accommodate continuity without teleological baggage. The persistence of ceramic styles, household rituals, and local trade across all three cases proves that what collapses is not society, but a mode of power.  

  ---

  ### Marking Scheme (30 marks total)  
  **A Answers** (24–30 marks) use continuity to *challenge or refine the collapse category conceptually*. **B Answers** (18–23 marks) describe cases accurately but treat continuity as *ancillary detail*.  

  | **Criterion**               | **Full Marks** (Points) | **A-Grade Move**                                                                 | **Common Error (Mark Deduction)**                                                                 |  
  |-----------------------------|--------------------------|----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|  
  | **Case-Specific Mechanisms** (6 marks) | Identifies *non-generic*, archaeologically grounded drivers for each case. (2 per case) | Links mechanisms to institutional fragility (e.g., bronze dependency, hydrological legitimacy). | Vague/generic mechanisms ("war," "drought") or identical framing for all cases. (-1–2 per case) |  
  | **Transformational Continuity** (8 marks) | Explains *how* continuity *differently* undermines collapse in each context. (2–3 per case) | Shows continuity as *active transformation* (e.g., Mycenaean households decoupling from palaces). | Treats continuity as "survival" without challenging collapse, or ignores case differences. (-2–3) |  
  | **Addressing Objections** (8 marks) | Engages demography/fragmentation as *separate* from societal failure. (3–4) | Uses continuity evidence to argue demographic decline is an *outcome* of fragmentation, not collapse’s definition. (-3–4 if absent) | Equates depopulation with collapse, or dismisses objections without evidence. |  
  | **Conceptual Conclusion** (8 marks) | Proposes *precise redefinition* OR *abandonment argument* with cross-cultural rationale. (5–6) | Bases conclusion on continuity evidence (e.g., "collapse = institutional unbundling with adaptive continuity"). | Offers no definition, uses circular logic ("collapse is when societies collapse"), or ignores cases. (-4–6) |  
  | **Archaeological Specificity** | Embedded throughout | Integrates concrete evidence (e.g., Rapa Nui *rongorongo* persistence, Maya Lamanai rituals). | Generic statements unsupported by case details (e.g., "people kept farming"). (-2–3 overall) |  

  **Fail Grades** (<18): Misidentifies cases, ignores continuity, or relies on Diamond-style generic frameworks.
