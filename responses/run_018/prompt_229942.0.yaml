prompt: |-
  I sit on my university's academic integrity board, and we must decide a case our precedents don't settle because they turn on explicit agreement, which is absent here. Four students in a graduate seminar kept a shared notes document all term. During the 48-hour take-home final, that document gradually filled with what became a complete plan for the compulsory essay: numbered structural suggestions, three worked examples (one highly idiosyncratic to the course), and comments such as "we can't all use this opening" and "someone should push back on this objection." All four submitted essays with different wording but the same structure, the same examples, and the same response to the same objection. The students acknowledge the document but deny they acted jointly: each describes his own edits as isolated suggestions made in parallel, one says he only read the document and assumed it reflected general discussion, and none will say who started the plan. Our policy defines collusion as "acting jointly to obtain an unfair academic advantage" but gives no test for when parallel contributions become joint action absent an explicit agreement. Draft the board's decision memo: recommend a finding as to which, if any, of the four acted jointly, articulate the test future cases should apply, and engage seriously with the strongest argument against your recommendation. Begin with the memo itself, with no preface, and put the recommendation in the first sentence, followed by the reasoning.
reasoning: |-
  Okay, the user is part of a university academic integrity board facing a tricky case. They need a draft decision memo for a situation where four graduate students shared notes that turned into an essay plan during a take-home exam. The precedents don't cover this because they rely on explicit agreements, which are absent here. 

  Hmm, this is a nuanced situation. The students claim they acted independently, but the evidence suggests coordination. The user needs the memo to do three things: recommend findings, establish a test for future cases, and address counterarguments. 

  First, I need to consider the core issue: what transforms parallel actions into joint action? The policy prohibits "acting jointly" but doesn't define it. The key will be distinguishing between genuine collaboration (which might be allowed) and collusion that creates unfair advantage.

  Looking at the facts: The document evolved into a complete essay blueprint during the exam period. The comments about not all using the same opening and pushing back on objections are particularly damning - they show awareness of collective submission. The identical structure and examples across all essays can't reasonably be coincidental.

  The strongest counterargument is plausible: maybe this was just a live document where people added ideas without coordination. But that doesn't hold water because of the reciprocal nature of the edits and the exam context. The "we" language and warnings about similarity show interdependence.

  For the test going forward, I'm thinking about focusing on mutual awareness and interdependence. If students know their contributions are being used by others for graded work, and especially if there's evidence of adapting based on others' input, that becomes joint action. The exam context heightens this because submissions are supposed to be independent.

  The sanction should be consistent with what the university would give for similar violations. Since this was during a final exam, it's serious. Failing the assignment seems appropriate, but not failing the course since it's a first offense and they might have genuinely misunderstood the boundaries.

  I'll structure the memo to lead with the recommendation, then lay out the facts, explain why this meets the new test, address counterarguments thoroughly, and end with the new standard for future cases. The tone should be firm but fair - these are graduate students who should know better, but the policy ambiguity warrants some consideration.
answer: |-
  **MEMORANDUM**  
  **TO:** Academic Integrity Board  
  **FROM:** [Chair's Name], Presiding Officer  
  **SUBJECT:** Findings & Recommendation: Case #AIB-2024-07 (Graduate Seminar Collusion Allegation)  
  **DATE:** [Current Date]  

  **RECOMMENDATION:** The Board finds all four students (Students A, B, C, D) engaged in collusion by acting jointly to obtain an unfair academic advantage during the take-home final examination, and recommends a sanction of failing the final essay assignment for each student, with notation in their academic integrity records.  

  **REASONING:**  

  **I. Findings of Fact & Application to Policy**  
  1.  **Uncontested Evidence:** All four students maintained a shared document accessible during the 48-hour final exam window. This document evolved from general notes into a comprehensive essay blueprint containing:  
      *   A numbered structural outline.  
      *   Three worked examples (including one highly specific to the course).  
      *   Explicit meta-commentary ("we can't all use this opening," "someone should push back on this objection").  
      *   Edits/additions by multiple students during the exam period.  
      All four submitted essays demonstrating near-identical substantive reliance on this blueprint (structure, examples, response to a specific objection), differing primarily in wording.  

  2.  **Definition of Collusion:** University policy defines collusion as "acting jointly to obtain an unfair academic advantage." The core question is whether the students' parallel contributions constituted "acting jointly" absent an explicit agreement.  

  3.  **Finding of Joint Action:** The Board concludes joint action occurred based on the totality of circumstances and the emergence of a *de facto* collaborative plan:  
      *   **Interdependence:** The document's content evolved beyond isolated suggestions into an integrated plan. Comments like "we can't all use this opening" demonstrate direct awareness that contributions were being viewed and *would be used* by others for their individual submissions. This created a mutual reliance on the collective resource.  
      *   **Mutual Awareness & Tacit Acceptance:** Continuous edits during the exam period, visible to all participants, created an environment of real-time collaboration. Students did not merely contribute ideas *to* a pool; they actively shaped a *shared strategy*, seeing others build upon their suggestions and incorporating others' work into their own final product. The specificity of the examples and structural advice indicates contributions were made with the expectation they would be utilized.  
      *   **Unfair Advantage:** The resulting essays derived significant substantive value (structure, key examples, argumentative strategy) not from individual effort, but from the collective development of the blueprint during the assessment period. This conferred an unfair advantage by distributing the intellectual labor of formulating core exam responses.  
      *   **Specificity and Context:** The highly idiosyncratic example and the meta-commentary about submission strategy are incompatible with coincidental parallel development or generic note-sharing. They point directly to coordinated use.  

  4.  **Individual Denials:** The individual explanations are unpersuasive:  
      *   Claiming edits were "isolated suggestions made in parallel" ignores the documented sequential build-up and responsive nature of edits creating a unified plan.  
      *   Claiming to have "only read" the document while submitting an essay mirroring its specific, non-generic content strains credulity and fails to explain the identical substantive choices across all essays.  
      *   The refusal to identify the plan's initiator, while not determinative, suggests a collective reluctance to clarify conduct they understood was problematic.  

  **II. Addressing the Strongest Counterargument**  
  The strongest argument against a finding of joint action is that the students merely contributed *parallel, independent suggestions* to a shared document, akin to a dynamic study guide, without any intent to coordinate their final submissions. They might argue the document represented a "common pool" of ideas which each student independently chose to utilize, and that the meta-commentary was merely advisory, not directive.  

  **Board's Engagement with Counterargument:**  
  While superficially plausible, this argument fails under scrutiny:  

  1.  **Timing is Crucial:** The critical development of the *complete blueprint* occurred *during the 48-hour assessment window*. This transforms the document from a passive study resource into an active collaborative workspace used *during* the performance of the assessed task. University policy inherently expects independent work during examinations.  
  2.  **Nature of Contributions:** The contributions went beyond sharing raw material (e.g., lecture quotes). They constituted *processed solutions*: a pre-determined structure, *worked* examples, and specific argumentative tactics ("push back on *this* objection"). Utilizing such processed solutions bypasses the individual analytical work the exam was designed to evaluate.  
  3.  **Meta-Commentary as Evidence of Coordination:** Statements like "we can't all use this opening" explicitly acknowledge the collective nature of the enterprise and the need to *differentiate submissions based on the shared resource*. This demonstrates not just awareness of others' use, but an active consideration of how the *group* would deploy the collaboratively developed material to avoid detection – a hallmark of joint action seeking unfair advantage.  
  4.  **Absence of Independent Critical Work:** The near-total reliance on the shared blueprint's structure, examples, and argumentative moves across all four essays reveals a lack of independent development of these core elements. Parallel independent work would likely show greater divergence in fundamental approach, especially on a complex graduate-level essay. The identical substantive choices strongly suggest direct adoption of the collaboratively developed plan.  

  **III. Articulated Test for Future Cases**  
  For cases involving parallel contributions or shared resources where explicit agreement is absent, the Board adopts the following **"Functional Joint Action Test"** to determine collusion:  

  > **Collusion occurs when (1) two or more students contribute to a shared resource (document, communication, etc.) accessible during an assessment period; and (2) the contributions demonstrably shape the substantive content, structure, or key arguments of their individual submissions; and (3) a reasonable student in their position would understand that their contributions were likely being utilized by others for the same assessed task, creating mutual reliance or interdependence; and (4) this results in an unfair academic advantage by reducing the individual effort required for the specific assessment.**  
  >
  > **Key factors include:**  
  > *   The *timing* of contributions relative to the assessment period.  
  > *   The *specificity* and *processed nature* of the contributions (e.g., developed arguments, solved problems, structural outlines vs. raw data/notes).  
  > *   Evidence of *real-time interaction* or *responsive editing* building upon others' contributions.  
  > *   Explicit or implicit *acknowledgement of collective use* (e.g., meta-commentary about submission strategies).  
  > *   The *degree of substantive similarity* in the final submissions regarding core analytical choices, not just wording.  
  >
  > **Mere passive access** to a static study resource created *before* an assessment period, or **independent parallel use** of generic notes, without evidence of interdependent development *during* the assessment, generally does not constitute collusion under this test.  

  **IV. Recommended Sanction**  
  Given the graduate level, the seriousness of collaborating during a final assessment, the clear unfair advantage obtained, and the students' failure to acknowledge the impropriety, the Board recommends:  
  *   A grade of "F" for the final essay assignment for all four students.  
  *   A formal notation of an academic integrity violation on each student's record.  
  *   Mandatory completion of the university's academic integrity remediation module.  

  This sanction is proportionate, recognizing the violation's severity while acknowledging the lack of clear precedent on tacit coordination. It upholds the integrity of the assessment process without imposing the maximum penalty (course failure) given the policy ambiguity resolved herein.  

  **[Signature]**  
  **[Chair's Name], Presiding Officer**  
  **Academic Integrity Board**
