answer: |-
  Here is a comprehensive assessment package designed for your graduate seminar, focusing on the epistemic challenges of causal inference from historical comparison:

  **Essay Question**  
  "Using the Alpha/Beta case (adjacent territories with identical pre-1890 conditions but divergent colonial institutions and post-1970 income outcomes), critically evaluate whether the observed economic divergence can be causally attributed *to institutions*. Your analysis must explicitly engage **five specific epistemic obstacles**:  
  1. Endogenous selection of institutional regimes by the colonial power,  
  2. Potential hidden pre-colonial heterogeneity,  
  3. Post-independence migration and economic interdependence,  
  4. Limitations of quasi-experimental methods (e.g., synthetic controls, DiD),  
  5. Whether causal agnosticism is unavoidable if full identification fails.  
  Conclude by assessing whether institutional factors can still form part of a *plausible explanation* given these constraints, even if definitive causal attribution is unattainable."  

  ---

  **Model Answer (898 words)**  

  The Alpha/Beta scenario appears to offer a natural experiment for institutional determinism: identical preconditions followed by divergent institutions and outcomes. Yet this case systematically exposes the fragility of causal claims in historical political economy. While institutional differences *correlate* strongly with development gaps, causal attribution faces five formidable epistemic barriers.  

  **First, endogenous institutional selection** undermines the assumption of random treatment. The colonial administration’s decision to impose distinct regimes on Alpha (individual titles, courts) and Beta (coerced labor, extraction) likely reflected strategic considerations. If Alpha possessed unobserved advantages—slightly denser trade networks, or elites more amenable to collaborative governance—these could have *caused* both the assignment of "better" institutions *and* later development. The river boundary, while geographically arbitrary, was operationalized through political decisions that may have correlated with latent variables. Failing to model this selection process risks mistaking institutional *deployment* for institutional *causation*.  

  **Second, hidden pre-colonial heterogeneity** compounds this problem. Identical climate and soil do not guarantee identical human capital. Pre-1890 variations in clan structures, informal dispute-resolution norms, or exposure to coastal literacy could have persisted unnoticed. If Alpha had marginally stronger traditions of collective action or commercial literacy, these might have enabled both the adoption of growth-friendly institutions and independent adaptive capacity. The absence of documented separation pre-1890 does not prove functional equivalence; cultural and social capital can be locally heterogeneous despite shared ecology.  

  **Third, post-independence dynamics** contaminate the comparison. Cross-river migration (skilled labor moving to Alpha) or capital flight (from Beta to Alpha’s courts) would artificially amplify divergence. If Alpha’s institutions attracted Beta’s most productive farmers or merchants, the 1970 income gap reflects selective mobility—not just institutional performance. Similarly, if Beta’s extractive framework spurred rebellion or aid dependency after independence, these endogenous responses blur the colonial institution’s direct effect. The territories’ interdependence violates the stable unit treatment value assumption (SUTVA), as outcomes in one unit affect the other.  

  **Fourth, quasi-experimental methods falter** under these conditions. Synthetic control approaches would struggle to construct a counterfactual "Beta-with-Alpha-institutions" when pre-treatment characteristics are ambiguously measured and treatment assignment is strategic. Difference-in-differences assumes parallel trends, but if hidden heterogeneity existed pre-1890, trends were never parallel. Moreover, economic spillovers across the river violate the non-interference requirement. These methods rely on assumptions (randomness, independence, no anticipation) that colonial boundary-drawing inherently violates.  

  **Fifth, the failure of full identification** need not force total agnosticism. While we cannot *prove* institutions caused 70% versus 30% of the gap, mechanistic reasoning supports their contributory role. We know from micro-foundations that registered land titles reduce transaction costs, courts facilitate investment, and representative taxation incentivizes productivity. Conversely, coerced labor depresses innovation. When geography and culture are held constant (as ostensibly here), institutions become the *most salient differentiating mechanism*. Abductively, institutional divergence remains the best explanation for why structurally similar territories—subject to identical global shocks—developed differently, provided we acknowledge:  
  a) Selection bias may mean institutions were *amplifiers* of pre-existing advantages,  
  b) Post-treatment dynamics (migration) likely exaggerated differences.  

  **Conclusion**: Causality cannot be definitively isolated in this case. Endogeneity, unobserved heterogeneity, and post-treatment interference render institutional attribution probabilistic, not deterministic. However, rejecting causation need not mean rejecting explanation. Institutions form a *candidate mechanism* coherent with observed outcomes, theoretical priors, and the constraint of geographic/cultural constancy. The strongest claim is not "institutions caused the gap," but "institutional configurations *systematically mediated* development paths under conditions of colonial imposition." This retains institutional analysis while respecting historical epistemology’s limits.  

  ---

  **Marking Scheme (25 Points Total)**  
  *Each criterion assesses analytical rigor in applying epistemic concepts to the case.*

  1. **Treatment of Endogenous Selection (0-5)**  
     *Must-hit move:* Interrogates why colonial powers assigned divergent regimes and whether selection correlates with unobserved variables.  
     *Failure mode:* Assumes the river boundary implies random assignment without addressing strategic colonial decision-making.  

  2. **Analysis of Hidden Heterogeneity (0-5)**  
     *Must-hit move:* Questions the assumption of pre-1890 equivalence by proposing plausible unmeasured differences (social capital/literacy) that might confound the comparison.  
     *Failure mode:* Accepts "identical preconditions" at face value without considering latent human-capital variations.  

  3. **Engagement with Post-Treatment Dynamics (0-5)**  
     *Must-hit move:* Models how migration, capital flight, or spillovers could contaminate the 1970 outcome comparison.  
     *Failure mode:* Treats territories as isolated units after 1890, ignoring cross-boundary interactions.  

  4. **Critical Evaluation of Quasi-Experimental Fixes (0-5)**  
     *Must-hit move:* Explains why methods like synthetic controls fail here (e.g., SUTVA violations, non-random assignment) without jargon-dependent assertions.  
     *Failure mode:* Name-checks econometric techniques without case-specific reasoning about their inapplicability.  

  5. **Nuanced Causal Conclusion (0-5)**  
     *Must-hit move:* Distinguishes between indefensible deterministic claims and plausible mechanistic/abductive institutional explanations that survive epistemic constraints.  
     *Failure mode:* Either declares institutions the unambiguous cause or retreats to total agnosticism, ignoring explanatory middle grounds.  

  ---

  **Key Design Rationale**  
  - **Epistemic Focus**: Forces confrontation with causality (not just correlation) by embedding obstacles in the prompt.  
  - **Self-Contained**: No external sources needed; success hinges on applying methodological reasoning to the constructed case.  
  - **Anti-Reductionist**: Bars binary "institutions vs. culture/geography" debates by holding the latter constant.  
  - **Theoretical Payoff**: Validates institutional analysis *without* requiring causal certainty, modeling how historians make defeasible claims.  
  - **Precision Penalties**: Awards points only for targeted analytical moves (e.g., "explains why SUTVA fails" not "mentions migration").  

  This framework rewards students who treat the case not as a puzzle with an answer, but as an epistemological demonstration of why causal claims in comparative history require humility.
