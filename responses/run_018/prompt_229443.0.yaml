prompt: |-
  I'm a software engineer with no formal philosophy background. I'm designing the "belief" layer of a reasoning system: a component that takes a probabilistic evidence base and outputs the claims the system may treat as settled for downstream planning. Before I commit to an implementation, I want an engineering-style requirements specification for what an adequate theory of rational acceptance has to satisfy. I am not asking for a survey of the literature or citations; the analysis should stand on its own.

  The two failure modes that worry me are the lottery paradox and the preface paradox, as I understand them.

  Lottery. A fair lottery has one million tickets and exactly one winner. For each ticket i, the evidence makes it 0.999999 likely that ticket i loses. A fixed-threshold rule — accept a claim iff its probability is at least 0.999 — therefore accepts "ticket i loses" for every i. If the system is allowed to conjoin claims it has accepted, it ends up accepting "every ticket loses," which contradicts its certain background knowledge that one ticket wins. So at least one of the threshold rule, closure under conjunction, and the requirement that an accepted body of claims be consistent must give. I want a principled account of which gives and why, not an ad hoc patch.

  Preface. An author writes a long, carefully checked nonfiction book. For each sentence, her checking is good enough that she rationally accepts that sentence. But she also has strong inductive grounds, from experience with long books and human fallibility, for accepting that at least one sentence in the book is false — and she says so in the preface. Her total set of accepted claims is inconsistent, and she can see that, yet she seems rational rather than confused. An adequate account must explain this: whether consistency is not a genuine requirement, whether she never really accepts the conjunctions, whether the preface claim is a different kind of acceptance, or something else.

  Please write the desiderata: the full list of requirements that a theory of rational acceptance (or of whatever the correct primitive turns out to be — graded credence alone, acceptance plus credence, context-dependent standards, etc.) must meet in order to handle these cases and be adequate for a truth-seeking reasoner. Treat the lottery and preface cases as non-optional test cases, but derive general requirements from them rather than just those two cases.

  For each requirement, provide:
  - a name and a one-sentence statement;
  - the motivating case or argument — a specific example, not just an appeal to intuitiveness;
  - a classification: non-negotiable, negotiable, or partially negotiable, with a sentence justifying the classification;
  - which naturally tempting positions it rules out or constrains.

  Pay particular attention to distinctions a theory may not collapse — e.g., degrees of confidence vs. all-or-nothing acceptance, acceptance for action vs. acceptance as true, and each claim's being individually acceptable vs. the conjunction's being acceptable — and to which results from probability theory or deductive logic a theory must respect and which it may reject or reinterpret.

  Then include:
  (1) a joint-satisfiability check: which pairs or subsets of the requirements conflict, why, and what reconciliation moves are available;
  (2) the single requirement that does the most work excluding candidate accounts, with a paragraph justifying that choice;
  (3) a brief scorecard for these four candidates against the list: (a) the fixed-threshold rule; (b) a view that keeps only graded probabilities and denies that there is any separate all-or-nothing acceptance; (c) a view on which standards of acceptance shift with stakes or context; (d) a view that treats consistency and closure as long-run ideals rather than requirements an agent must meet at every moment. Keep the scorecard brief; the requirements and their motivating cases are the deliverable.

  Return the result as a single JSON object with exactly this schema and nothing outside it:

  {
    "summary": "one-sentence summary of the spec",
    "requirements": [
      {
        "id": "req-1",
        "name": "short label",
        "statement": "one-sentence statement of the requirement",
        "motivating_case_or_argument": "specific case or argument that makes it binding",
        "necessity": "non-negotiable | negotiable | partially-negotiable",
        "necessity_rationale": "why it has that classification",
        "candidates_constrained": "which candidates or natural views it rules out or limits"
      }
    ],
    "tensions": [
      {
        "requirement_ids": ["req-1", "req-2"],
        "conflict": "why they cannot be jointly satisfied as stated",
        "reconciliation_options": "what a theory could give up or reinterpret"
      }
    ],
    "highest_leverage_requirement": {
      "id": "req-3",
      "rationale": "why this requirement does the most to narrow the space"
    },
    "candidate_scorecard": [
      {
        "candidate": "fixed-threshold rule",
        "verdict": "how it fares overall",
        "main_failure_or_insight": "which requirement it chiefly violates or illuminates"
      }
    ]
  }

  Stick to these keys; put all prose in the string fields rather than in separate commentary.
