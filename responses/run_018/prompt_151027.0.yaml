answer: |-
  ### The Species Tribunal: A Metaphysical Experiment  
  **Designed for a 90-minute graduate seminar (12 students)**  
  **Core Goal:** Force students to confront the impossibility of clean species categorization through hands-on decision-making, revealing how frameworks "hide" complexity. The synthetic cases push boundaries beyond biology, exposing unresolved metaphysical tensions.  

  ---

  ### **Game Structure**  
  **Groups (3 groups of 4 students):**  
  1. **Morphological Essentialists (ME):** Species defined by shared, immutable physical traits.  
  2. **Biological Species Concept (BSC):** Species defined by reproductive isolation in natural populations.  
  3. **Phylogenetic Species Concept (PSC):** Species defined by shared ancestry (monophyletic lineages).  

  **Materials:**  
  - **Framework cheat sheets** (1 per group; see [Appendix 1](#appendix-1-framework-cheat-sheets)).  
  - **16 Case Cards** (12 biological edge cases + 4 synthetic cases; see [Appendix 2](#appendix-2-case-cards) for descriptions).  
  - **Species boxes** (empty slots for groups to assign species names) and a **"Liminal" pile** for exiles.  
  - **Scoreboard** visible to all.  

  **Scoring Rules (Motivates contentious decisions):**  
  - **+2 points** per case assigned unanimously to a species box (e.g., all ME members agree "Card 3 = Species X").  
  - **-1 point** per case exiled to "Liminal."  
  - **+1 point** per case where *two groups independently* assigned it to a species (not exiled), even if species labels differ (e.g., ME and BSC both assign Card 7 to *some* species).  
  - **No points** for inter-group negotiation—scores reflect pre-discussion judgments.  

  **Key Constraints:**  
  - Groups **cannot communicate** until Round 3.  
  - Each case **must** be assigned to exactly one species box or exiled—no "pending" or multiple assignments.  
  - Groups invent their own species names (e.g., "*Canis limbus*" for a wolf hybrid).  

  ---

  ### **90-Minute Timeline**  
  **Total: 90 min**  
  *(Adjust as needed; bolded times are non-negotiable anchors)*  

  #### **Round 1: Categorization Chaos (30 min)**  
  - **0–5 min:** Introduce the tribunal. Assign groups/frameworks. Emphasize scoring rules. *Do not explain species concepts—cheat sheets only.*  
  - **5–10 min:** Groups read cheat sheets, clarify framework internally.  
  - **10–35 min:** Groups categorize all 16 cards. Circulate to:  
    - Ensure no inter-group talk.  
    - Press for unanimous decisions (e.g., "If you debate Card 9 for 3 minutes, exile it to save time").  
    - **Predicted struggle:** Groups will exile quickly to avoid deadlock (e.g., asexual whiptails exiled by BSC).  

  #### **Round 2: Exile Defense (15 min)**  
  - **35–45 min:** Each group has **5 min** to:  
    1. Report exiled cards (e.g., "BSC exiled Cards 4, 7, 11, 13, 16").  
    2. Defend *one* exile using their framework (e.g., ME: "Chimera Alpha lacks essential traits—fungal + plant = no essence").  
  - **Instructor Role:** Note conflicts (e.g., PSC exiles ring species for non-monophyly, while ME keeps it for morphology).  

  #### **Round 3: Cross-Framework Negotiation (25 min)**  
  - **45–55 min:** Groups mingle. Tasks:  
    - Compare assignments for scoring (e.g., "Did anyone else assign Card 15 to a species?").  
    - Debate **2 synthetic cases** (assign Chimera Beta and Digital Gamma; avoid others to focus).  
  - **55–65 min:** Whole-class argument on:  
    - *Chimera Beta:* "Is cross-kingdom HGT 'lineage'?" (PSC vs. BSC).  
    - *Digital Gamma:* "Can code be a 'trait'?" (ME) vs. "Is copying 'reproduction'?" (BSC).  
  - **65–70 min:** Calculate scores. Announce winner (trivial—points are a tool, not the goal).  

  #### **Debrief: Mapping Chaos to Metaphysics (20 min)**  
  - **70–90 min:** Debrief using **specific moments** to illustrate philosophical tensions:  

  | **Activity Moment**              | **Metaphysical Debate**                                                                 | **Instructor Script**                                                                 |
  |----------------------------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|
  | **Exile pile size**              | **Problem of vagueness:** Any sharp boundary excludes intermediates.                    | "Why did 8/16 cards get exiled? Essentialism *requires* ignoring variation (e.g., ring species’ clinal traits). BSC *requires* ignoring non-sexual repro. You were *forced* to hide complexity to fit the framework." |
  | **BSC exiles asexual whiptails** | **Fiat boundaries:** BSC’s reproductive criterion fails for 15% of eukaryotes.          | "BSC exiled asexuals—but biologists *use* them. Does this make BSC ‘wrong,’ or just incomplete? Are we privileging sexual repro as ‘essential’?" |
  | **ME vs. PSC clash on chimeras** | **Natural kinds vs. pragmatism:** Can species be defined without biology?              | "ME exiled chimeras for mixed traits; PSC exiled them for non-monophyly. But in a lab, we *treat* them as species. Are frameworks descriptive or prescriptive?" |
  | **All exile digital organisms**  | **Metaphysical collapse:** None can handle non-biological "life."                       | "Digital Gamma broke all three: no morphology (ME), no reproduction (BSC), no tree of life (PSC). If ‘species’ can’t handle this, is it a biological concept at all? Or are we seeing the limits of *any* essentialist definition?" |
  | **Unanimous agreement on a card** | **Consilience illusion:** Agreement hides framework incompatibility.                   | "You agreed on Card 1 (tiger) because it’s easy. But ME called it ‘essence,’ BSC called it ‘interbreeding’—same label, different metaphysics. Does consensus paper over cracks?" |

  **Honest Note (Share during debrief):**  
  > "This game *cannot* capture the **historical contingency of real taxonomy**. Biologists revise species based on new data (e.g., genomics), politics (e.g., conservation needs), or pragmatism (e.g., ‘whatever works for field guides’). Here, you had static frameworks and instant decisions—but real taxonomy is a slow, social process where concepts bleed into each other. You also couldn’t ‘split’ species (e.g., assigning a card to multiple boxes), which is common in revisions."

  ---

  ### **What Will Go Wrong (and Why It’s Useful)**  
  1. **Gaming the Points:** Groups will exile ambiguous cases (e.g., cryptic species) to avoid deadlock and secure -1 over risking no +2. *Use this:* Highlight how scoring mirrors publish-or-perish incentives in science (e.g., exiling avoids controversy but loses information).  
  2. **Synthetic Cases Cause Frustration:** Students may call digital organisms "not biology!" *Lean in:* "Exactly! Why do we assume ‘species’ must include all life? What *is* life?"  
  3. **Over-Assigning to Avoid Penalties:** BSC might force asexuals into "species" boxes. *Debrief angle:* "You ‘stretched’ BSC to fit—this is how concepts evolve pragmatically (e.g., BSC+ for asexuals)."  
  4. **Time Crunch in Round 1:** Groups rush ring species or hybrids. *Embrace it:* "Science has deadlines. Did haste make you exile too much? How does time pressure shape real taxonomy?"  

  ---

  ### **Appendices**  
  #### **Appendix 1: Framework Cheat Sheets**  
  *(1 per group; use exact wording to avoid bias)*  

  - **Morphological Essentialists (ME):**  
    > "A species shares a set of essential, observable traits (e.g., wing shape, bone structure). Variation is ‘noise’ unless it breaks the essence. Assign to species if >70% traits match a ‘type specimen.’ Exile if no clear essence (e.g., chimeras)."  

  - **Biological Species Concept (BSC):**  
    > "A species is a group that interbreeds naturally and is reproductively isolated from others. Assign if organisms *can* produce fertile offspring in nature. Exile if asexual, sterile, or no data on breeding."  

  - **Phylogenetic Species Concept (PSC):**  
    > "A species is the smallest monophyletic group (a common ancestor + all descendants) with shared derived traits. Assign if genetic/morphological data show unique ancestry. Exile if hybrid, polyphyletic, or no lineage data."  

  #### **Appendix 2: Case Cards**  
  *(16 total; print with minimal jargon. **Bold** = key tensions.)*  

  1. **Tiger (Panthera tigris)**: Classic vertebrate. Sexual, morphologically distinct. *(Control case; all groups should keep)*.  
  2. **Ensantina Salamanders**: Ring species. Morphologically variable; interbreed in adjacent populations but not endpoints.  
  3. **Mule**: Horse-donkey hybrid. Sterile but healthy.  
  4. **Asexual Whiptail Lizard**: All-female population. Reproduces via parthenogenesis.  
  5. **Cryptic Bat Species**: Two populations. Identical morphology; no interbreeding; genetic divergence >8%.  
  6. **Polyploid Wheat**: New plant species from chromosome doubling. Fertile with other polyploids, not diploids.  
  7. **Fossil Hominid Skull**: Morphologically distinct. No DNA or breeding data.  
  8. **Bacterial Strain with HGT**: Shares 30% genome with archaea via horizontal transfer. Reproduces asexually.  
  9. **Cichlid Fish in Lake Victoria**: Sympatric speciation in progress. Some interbreeding, but distinct morphs.  
  10. **Amazon Molly**: All-female fish. Uses sperm from other species to trigger reproduction (no genetic transfer).  
  11. **Corals with Hybrid Zones**: Interbreeding species; morphologically intermediate in overlap zones.  
  12. **Domestic Dog Breeds**: All can interbreed but morphologically disparate (Great Dane vs. Chihuahua).  
  *(Synthetic Cases)*  
  13. **Chimera Alpha**: Engineered multicellular organism (plant + fungal genes). Reproduces clonally; accumulates mutations. No sexual cycle.  
  14. **Chimera Beta**: Unicellular chimera (bacterial + animal genes). Exchanges DNA with other chimeras via HGT. No nucleus.  
  15. **Digital Organism Gamma**: Self-replicating code. Copies with mutation in a simulator. No physical body; "resources" are CPU cycles.  
  16. **Digital Organism Delta**: Code that replicates only with "key"-compatible partners. Keys mutate; new lineages form. No biological parts.  

  ---

  ### **Why This Works**  
  Students will leave with **embodied frustration**—not just "species are disputed," but "my framework *made me* ignore real complexity." The synthetic cases escalate tension, revealing how biology’s boundaries blur with tech. By the debrief, they’ll see metaphysical debates (e.g., "What is a trait?") as unavoidable, not abstract.  

  **Prep Tips:**  
  - Print cards on colored paper (biological = white, synthetic = neon).  
  - Assign forceful students to lead groups to ensure debate.  
  - Pre-load exile pile with 2–3 random cards to spark early controversy.  
  **Final Quote for Debrief:**  
  > “You didn’t fail to categorize—*categorization failed you*. The species problem isn’t about finding the right box. It’s about why we need boxes at all.”
