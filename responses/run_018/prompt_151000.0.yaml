  hey im trying to parse a chunk from Condorcet's old essay on majority decision probabilites — the one from the 1780s where he sets up three voters picking between three options and shows the pairwise rankings can loop, A over B, B over C, then C over A again. he frames it as a contradiction in the collective will, but i keep seeing something else: i call it preference reflux, where the loop doesn't just sit there but feeds back into each voter's private ordering, like people update what counts as rational once they see the social cycle. is that social feedback mechanisim actually in Condorcet's text, or am i projectng modern group psychology onto an 18th-century logic puzzle? and when Arrow later formalizes the same loop in 1951 with independence and transitivity axioms, does he implicitly rule out reflux, or just hide it behind the formalism? i want to know whether Condorcet is complaining about a logical glitch or describing a dynamic process, and whether Arrow's framing accidentally makes the social part vanish.
