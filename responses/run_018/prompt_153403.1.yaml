  hey, i'm sorting von neumann's brain-computer analogies from his actual arguments versus stuff people retroactively projeciton onto him. rank these six from "clearly in his posthumous writing" to "mostly modern misreading", one line each: 1) the brain is basically a slow digital computer. 2) the brain is analog but relies on digital-style error correction. 3) neural logic is neither boolean nor continuous but its own statistical kind. 4) the brain computes by bayesian sampling over noisy synaptic weights. 5) he thought the brain was a biological universal constructor that could self-replicate. 6) it's a noisy analog reservoir minimizing variational free energy via synaptic updates — something he anticipated in his talk about unreliable components and statistical mechanics. which of these do you think gets cited most wrongly in current neuroscience? and if you had to drop one interpretation entirely, which?
