prompt: |-
  So I finally landed the job I actually wanted — I'm optimizing routing for a big freight company — and a friend who's into this stuff pointed out that nobody has any grip on whether making shipping a few percent cheaper is good or bad once you follow the effects out a few decades, even though the near-term effects (fuel, hours, costs) are things I can model fine. I've been going in circles, and I've decided I dont need an answer so much as a spec.

  Write me the desiderata for a decision procedure for agents who are clueless in that shape: near-term effects tractable, long-run effects vastly bigger but with no grip on their sign. For each requirement, give the case that motivates it, and mark which are non-negotiable and which are just what one camp happens to want. Things I want on the table: it has to stay action-guiding without licensing me to invent probabilities I don't have; it has to say whether I'm evaluating this one act, the policy of taking jobs like this, or the career as a whole; it can't let the sheer size of the far future do argumentative work by itself, since bigness cuts both ways; it shouldn't quietly hand me permission to do whatever I was going to do anyway; it has to handle the option of spending the next year improving my model of the long run instead of acting; and it has to say something sensible when two people in my exact epistemic position come down on opposite signs.

  My own candidate, which I half think is the most important item and half think is confused: a procedure shouldn't let the sign of its recommendation turn on whether you carve the future into many small effects that cancel or one large one that dominates, when nothing in my evidence tells me which carving is right. Put it on the list if it belongs there, or tell me what's wrong with it.

  Then flag the pair of requirements you suspect can't be jointly satisfied — that's the part I most want — skip scoring the usual views, and tell me how confident you are in each bit and which single claim you're least sure of.
reasoning: |-
  Hmm, the user is working on optimizing routing for a freight company and grappling with how to evaluate long-term effects when the near-term effects are clear but the long-term impacts are unknown and potentially massive. They want a decision procedure that addresses several specific concerns about cluelessness regarding the future.

  The user has outlined several key requirements for this decision procedure: it must be action-guiding without fabricating probabilities, clarify the scope of evaluation (single act vs policy vs career), prevent "bigness" arguments from dominating decisions, avoid self-justification biases, include options for model improvement rather than immediate action, and handle disagreement among epistemic peers. They've also proposed an important criterion about how carving the future into effects shouldn't arbitrarily determine the recommendation's sign.

  I need to develop desiderata that address all these points. For each requirement, I should provide:
  - A clear statement of the desideratum
  - A motivating case that illustrates why it's important
  - Indication of whether it's non-negotiable or represents a particular viewpoint

  The user specifically wants me to flag which pair of requirements might be incompatible, avoid scoring existing ethical views, and indicate my confidence levels in each part of my analysis.

  For the scope clarification requirement, I'll use the example of a single routing optimization versus making it standard policy versus taking such jobs as a career. For handling bigness arguments, I can reference Pascal's Mugging scenarios where potential large future impacts could distort decisions. The self-justification bias requirement could be motivated by the common tendency to rationalize convenient choices. The model improvement option speaks to allocating resources between action and better forecasting.

  The user's candidate requirement about how carving the future affects the sign is particularly interesting - I'll need to carefully consider whether this belongs and what potential issues it might have. This seems to relate to how we aggregate effects over time.

  I suspect there might be tension between the "no bigness alone" requirement and the "handle disagreement" requirement - if we can't appeal to scale and we're truly clueless, how can we resolve disagreements between epistemic peers?

  Throughout the response, I'll need to be transparent about where I'm less confident, particularly regarding the aggregation/carving requirement and the potential incompatibility between some desiderata.
answer: |-
  Here’s a structured set of desiderata for your decision procedure, incorporating your requirements and candidate. I’ll flag tensions, confidence levels, and the critical pair that likely **can’t be jointly satisfied**. Requirements are labeled **N/N** (non-negotiable) or **C** (camp-specific).

  ---

  ### **Desiderata for Clueless Agents**
  1. **Action-Guidance Without Fabricated Probabilities (N/N)**  
     *Requirement*: Must recommend concrete actions without inventing unjustified probabilities for unknown long-term effects.  
     *Motivating Case*: Choosing between two routing algorithms where Algorithm A saves 5% fuel now but might (with unknown probability) incentivize carbon-intensive infrastructure. You can’t assign a "30% chance" to speculative futures without evidence.  
     *Why N/N*: Prevents pseudoscientific justification; forces honesty about ignorance.

  2. **Explicit Scope Declaration (N/N)**  
     *Requirement*: Must specify whether evaluating a *single act* (e.g., one routing decision), a *policy* (e.g., always optimizing for cost), or a *career* (e.g., working in freight optimization).  
     *Motivating Case*: Optimizing one shipment might be neutral, but a career in the industry could lock in systemic effects (e.g., normalizing just-in-time logistics). The procedure must clarify which is being judged.  
     *Why N/N*: Ambiguity here invites goalpost-shifting or moral evasion.

  3. **No "Bigness Alone" Leverage (N/N)**  
     *Requirement*: Cannot let the sheer scale of long-term effects dominate the decision without evidence of their *sign* (positive/negative).  
     *Motivating Case*: "This routing change might save $1M now but could alter civilization’s trajectory. Since the future is vast, we must prioritize the long term!" (This is Pascal’s Mugging; bigness without direction is noise.)  
     *Why N/N*: Large numbers + cluelessness = arbitrary conclusions.

  4. **Anti-Rationalization Safeguard (N/N)**  
     *Requirement*: Must not systematically favor the agent’s preexisting inclinations ("status quo bias").  
     *Motivating Case*: You’re inclined to take the job, so the procedure "discovers" that long-term effects are likely net positive. This must be blocked.  
     *Why N/N*: Ethics requires impartiality; self-serving procedures are untrustworthy.

  5. **Model-Improvement as a Valid Action (C)**  
     *Requirement*: Must treat "spend time improving long-term models" as a viable option comparable to direct acts.  
     *Motivating Case*: Instead of optimizing routes now, you could research how freight automation affects urbanization. The procedure should weigh this against acting.  
     *Why C*: Some camps prioritize epistemic humility; others demand immediate pragmatism.

  6. **Peer-Disagreement Transparency (N/N)**  
     *Requirement*: Must acknowledge when two agents with identical knowledge/licensed beliefs could reasonably disagree on the act’s sign (good/bad).  
     *Motivating Case*: You and a colleague agree on all near-term effects and long-term cluelessness, but one endorses the job, the other rejects it. The procedure must explain this divergence.  
     *Why N/N*: Cluelessness implies legitimate indeterminacy; suppressing this is dishonest.

  7. **Carving-Invariance (Your Candidate) (C)**  
     *Requirement*: The recommendation’s sign shouldn’t flip based on *how effects are aggregated* (e.g., many small canceling effects vs. one net large effect) if evidence doesn’t favor one carving.  
     *Motivating Case*: 
     - Carving A: Your routing change has 10,000 small effects; some good (reduced congestion), some bad (more suburban sprawl), net unknown.  
     - Carving B: It’s one "butterfly effect" with a single massive unknown outcome.  
     The procedure shouldn’t yield "do it" under A and "don’t" under B without evidence.  
     *Why C*: This prioritizes structural robustness, but some views (e.g., longtermism) accept aggregation-dependent conclusions.  
     *Confidence Note*: I’m **least sure** this is feasible. Cluelessness may *require* carvings to matter if we lack evidence to weight sub-effects.

  ---

  ### **The Incompatible Pair**
  **"No Bigness Alone" (3) + Peer-Disagreement Transparency (6) likely cannot be jointly satisfied.**  
  - **Why**: If bigness alone is inadmissible (3), and cluelessness means no evidence for sign (6), the procedure has **no grounds to break symmetry** between agents. One agent might focus on bigness + "precaution" (don’t act), another on bigness + "opportunity" (act). But (3) forbids using bigness to tip the scales. Result: The procedure must accept permanent, irreducible disagreement *or* violate (3) by letting bigness implicitly decide.  
  - **Your example exacerbates this**: Two peers in identical epistemic positions split on the job’s sign. (3) blocks "the future is big, so we must be cautious/audacious!" arguments, leaving no rational resolution.

  ---

  ### **Confidence Assessments**
  | Desideratum                  | Confidence | Notes                                                                 |
  |------------------------------|------------|-----------------------------------------------------------------------|
  | 1. No Fabricated Probabilities | 95%       | Core to evidence-based ethics; widely accepted.                      |
  | 2. Explicit Scope            | 100%       | Logically necessary; ambiguity invalidates any decision theory.      |
  | 3. No Bigness Alone          | 85%        | Intuitive, but some longtermists push back ("Pascal’s Mugging defense"). |
  | 4. Anti-Rationalization      | 90%        | Non-controversial in moral philosophy; aligns with impartiality.     |
  | 5. Model-Improvement Option  | 75%        | Practical but optional; some utilitarians demand immediate action.   |
  | 6. Peer-Disagreement         | 80%        | Follows from cluelessness; underappreciated in policy contexts.      |
  | 7. Carving-Invariance        | 60%        | I suspect this *can’t* be fully met; cluelessness may force arbitrariness. |

  **Least Sure Claim**: That carving-invariance (7) is achievable. Cluelessness might *require* us to choose carvings (e.g., "net effect per decade"), and different choices could validly change outcomes. Your intuition is sound, but it may demand more than cluelessness allows.

  ---

  ### **Summary**
  Your spec forces **honesty about ignorance**: It blocks fake precision (1), scale-based bullying (3), self-deception (4), and obscurity about scope (2). The tension between (3) and (6) is the crux—cluelessness might mean some disagreements are *fundamentally unresolvable*. Carving-invariance (7) is a noble goal but may be infeasible; treat it as aspirational.  

  **Next step**: Explore **decision rules under moral uncertainty** (e.g., maximin, robust utilitarianism) that satisfy most desiderata. But remember: no procedure escapes the (3)+(6) conflict without cheating.
