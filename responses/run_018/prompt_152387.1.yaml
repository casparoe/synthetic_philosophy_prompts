  ### Decision-Tree Taxonomy: Moral Significance of Neural Scale  

  **Root Node: Does neural scale (absolute cranial volume, encephalization quotient, or neuron count) possess direct normative significance, or does it hold only indirect evidential value in assessing moral status?**  
  *Diagnostic Case*: A human brain is surgically enlarged to twice its normal volume while preserving identical functional connectivity and cognitive capacities. If this individual acquires enhanced moral status solely due to the enlargement, neural scale has direct normative significance. If not, it has only indirect evidential value.  
  - **Branch A: Direct normative significance** → Proceed to Node 1.  
  - **Branch B: Only indirect evidential value** → Proceed to Node 2.  

  ---

  #### Node 1 (Direct Significance): Which metric of neural scale is normatively fundamental?  
  *Diagnostic Case*: The enlarged human brain (double volume, unchanged body mass, neuron count, and cognition) exhibits heightened moral status. The metric deemed responsible determines fundamentality.  
  - **Branch A1: Absolute cranial volume** → Volume itself confers moral weight (e.g., status increases post-enlargement). Proceed to Node 1.1.  
  - **Branch A2: Encephalization quotient (brain-to-body mass ratio)** → Relative scaling confers moral weight (e.g., status increases as EQ rises post-enlargement). Proceed to Node 1.1.  
  - **Branch A3: Neuron count** → Cellular density confers moral weight (e.g., status unchanged if neuron count is static post-enlargement). Proceed to Node 1.1.  

  #### Node 1.1 (Direct Significance): Is moral status a continuous function of the chosen metric?  
  *Diagnostic Case*: A 1% increase in the fundamental metric (volume, EQ, or neuron count) yields a 1% increase in moral status. If not, status changes only upon crossing a threshold.  
  - **Branch A1.1: Continuous function** → Moral status scales proportionally with the metric.  
    - *Leaf 1: Neurocentric gradualism* (if Branch A2 + A1.1: EQ as a continuous gradient of moral patienthood).  
    - *Leaves 2–3: Volumetric/cellular gradualism* (if Branches A1/A3 + A1.1: volume or neuron count as continuous gradients).  
  - **Branch A1.2: Threshold function** → Moral status changes only at critical metric values.  
    - *Leaves 4–6: Threshold-based direct views* (e.g., volume, EQ, or neuron count must exceed a fixed point for status elevation).  

  ---

  #### Node 2 (Indirect Value): Does neural scale reliably correlate with cognitive capacities that directly determine moral status?  
  *Diagnostic Case*: A nonhuman species exhibits an encephalization quotient of 1.0 (human average) but cognitive capacities exceeding typical humans. If its moral status is higher due to superior cognition, neural scale is a reliable proxy.  
  - **Branch B1: Reliable proxy** → Scale provides evidence for capacity-based moral status.  
    - *Leaf 7: Capacity-functionalism* (neural scale is a fallible indicator of morally relevant capacities).  
  - **Branch B2: Unreliable or non-proxy** → Proceed to Node 2.1.  

  #### Node 2.1 (No Proxy Value): Is moral status determined by species-typical neural architecture?  
  *Diagnostic Case*: A human with congenital microcephaly (brain volume <400cc) or a chimpanzee with neurotypical cognition but double the species-average brain volume. If status depends on deviation from species norms, architecture is primary.  
  - **Branch B2.1: Species-typical architecture determinative** → Status derives from conformity to species norms.  
    - *Leaf 8: Species-normativism* (status fixed by species-typical neural design, not scale).  
  - **Branch B2.2: Architecture not determinative** → Proceed to Node 2.2.  

  #### Node 2.2 (No Architecture Dependence): Are cross-species neural scale comparisons confounded by allometric constraints?  
  *Diagnostic Case*: Two species share identical absolute brain volume, but one has tenfold greater body mass. If the comparison is invalid due to metabolic/developmental constraints, scale is morally inert.  
  - **Branch B2.2.1: Comparisons confounded** → Scale cannot be meaningfully equated across species.  
    - *Leaf 9: Allometric-bias rejection* (non-linear scaling laws render cross-species metrics morally irrelevant).  
  - **Branch B2.2.2: Comparisons valid** → Scale differences are interpretable but morally inconsequential.  
    - *Leaf 10: Neural scale moral inertness* (rejects all previous grounds; e.g., status depends solely on non-neural features like sentience).  

  ---

  ### Logically Possible but Unoccupied Combination  
  A view granting **direct moral weight to absolute cranial volume** while simultaneously **denying any correlation between brain size and cognitive capacities** is logically coherent but empirically and normatively untenable. This gap arises from:  
  1. **Empirical implausibility**: If brain size demonstrably lacks cognitive correlates (e.g., due to neuroplasticity or compensatory mechanisms), assigning it intrinsic moral weight appears arbitrary.  
  2. **Normative incoherence**: Direct significance typically presumes a link to capacities (e.g., "more brain matter enables richer experiences"). Denying this link severs the justification for moral weight, reducing the view to vitalism or substance fetishism.  
  No prominent position occupies this space, as it conflates a brute physical property with moral value absent explanatory context.  

  ### Taxonomy Summary  
  - **Total Branch Nodes**: Root + 5 (Nodes 1, 1.1, 2, 2.1, 2.2).  
  - **Leaves**: 10 distinct terminals (6 under direct significance, 4 under indirect value).  
  - **Key Positions Mapped**:  
    - Neurocentric gradualism: Leaf 1 (A2 + A1.1).  
    - Capacity-functionalism: Leaf 7 (B1).  
    - Species-normativism: Leaf 8 (B2.1).  
    - Allometric-bias rejection: Leaf 9 (B2.2.1).  
  - **Navigation**: Cases resolve branches without prior knowledge of position labels.
