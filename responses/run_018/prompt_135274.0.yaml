  I hold that in Copycat-style microdomains conceptual slippage is never genuinely free: even where surface rules seem to dissolve, every analogical transformation is constrained by hidden structural invariants—latent relational weights, geometric analogues, or non-obvious feature classes—that the system implicitly tracks rather than inventing. To fix the idea, consider a modified letter-string domain in which each symbol carries an invisible “stress” profile; “abc → abd” is licensed not by surface resemblance but because c and d share a hidden weight class that excludes f. On this view, apparent fluidity is always the operation of deep, non-obvious parameters, and without them analogy collapses into arbitrary association. What would genuinely count against this? I want the defeaters—whether drawn from actual Copycat behavior, formal analogical reasoning, or cognitive science—ranked from fatal to merely awkward, including cases where defenders of pure fluidity would concede damage and whether the hidden-invariant view risks being insulated by post-hoc parameter invention. Lead with your bottom-line judgment of how exposed the position is, then lay out the arguments in descending order of decisiveness. Keep the response to about 300 words.
