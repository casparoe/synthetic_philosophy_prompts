answer: |-
  Here is a disambiguation of "wisdom of crowds" claims relevant to your planning appeal, structured for committee discussion. Each thesis is assessed for substance and applicability, followed by an analysis of your colleague's argument and its required assumptions.

  ---

  ### **The "Wisdom of Crowds" Theses: A Structured Menu**

  1.  **Statistical Averaging (Trivial Observation)**
      -   **Thesis:** Random errors in individual judgments (e.g., guessing quantities like weight or crowd size) cancel out when averaged across a large, diverse group, yielding an aggregate estimate closer to the truth than most individuals.
      -   **Platitude?** Yes (mathematically demonstrable for appropriate tasks).
      -   **Substantive/Defensible?** Yes, but *only* for estimation tasks with a single numerical answer where errors are random and uncorrelated.
      -   **False?** No, but irrelevant to complex *evaluative* or *policy* decisions like planning appeals.

  2.  **Condorcet's Jury Theorem (Formal Binary Choice)**
      -   **Thesis:** For a group making a binary choice (e.g., "Approve/Reject"), if each voter has an independent probability >0.5 of choosing the *correct* option, and votes independently, then the probability the *majority* chooses correctly increases towards 1 as group size increases.
      -   **Platitude?** No (a specific mathematical theorem).
      -   **Substantive/Defensible?** Yes, but **only under strict conditions**:
          *   **Binary Choice:** Only two options exist.
          *   **Single Correct Answer:** One option is objectively "correct" and identifiable.
          *   **Independent Voting:** Voters' judgments are not influenced by each other.
          *   **Uniform Competence >0.5:** *Every* voter has a better-than-chance individual probability of being correct.
      -   **False?** It's mathematically true *if* all conditions hold. It fails catastrophically if conditions are violated (especially competence <0.5 or dependence).

  3.  **Diversity Trumps Ability ("Cognitive Diversity")**
      -   **Thesis:** A group with diverse perspectives, knowledge sets, and problem-solving heuristics can outperform even highly skilled experts, especially on complex, non-routine problems, by avoiding groupthink and exploring more solution paths.
      -   **Platitude?** No.
      -   **Substantive/Defensible?** Yes, and empirically supported *for certain complex problem-solving tasks*. Relies on effective aggregation of diverse inputs.
      -   **False?** Not inherently, but it requires mechanisms to leverage diversity (e.g., structured deliberation, not just voting). Fails if diversity leads to paralyzing conflict or irrelevant inputs.

  4.  **Market-Like Aggregation (Prediction Markets)**
      -   **Thesis:** Mechanisms aggregating dispersed information (like prediction markets) can efficiently reveal collective beliefs about future events or valuations, often outperforming experts.
      -   **Platitude?** No.
      -   **Substantive/Defensible?** Yes, robust evidence for *predicting specific outcomes* (e.g., election results, sales figures).
      -   **False?** Not for its domain, but applicability to *normative* planning appeals (weighing competing values, interpreting regulations) is limited.

  5.  **Collective Moral/Value Insight**
      -   **Thesis:** The aggregate judgment of a diverse public is superior to experts in determining "what the community really wants" or what is morally/socially right for it.
      -   **Platitude?** No (highly contested).
      -   **Substantive/Defensible?** Debatable. Legitimate *for identifying community values/preferences*, but not necessarily for determining the *best technical means* to achieve goals or comply with complex rules.
      -   **False?** As a claim to epistemic superiority on technical or legal matters, yes. Value identification ≠ technical competence.

  6.  **Democratic Legitimacy (Non-Epistemic)**
      -   **Thesis:** Decisions made by representative or randomly selected citizens have greater democratic legitimacy and acceptance than those made by unelected experts, regardless of technical quality.
      -   **Platitude?** No (a core democratic principle).
      -   **Substantive/Defensible?** Yes, fundamentally about legitimacy and process, not knowledge.
      -   **False?** Not as a claim about legitimacy. However, conflating this with *epistemic wisdom* ("crowds are *smarter*") is false.

  ---

  ### **Diagnosing Your Colleague's Argument**

  *   **Likely Core Thesis:** Your colleague is likely blending **#3 (Diversity Trumps Ability)** and **#6 (Democratic Legitimacy)**, implicitly assuming this combination provides sufficient *epistemic justification* (#3) to override expertise, bolstered by the *legitimacy claim* (#6). They may also vaguely gesture towards **#2 (Condorcet)** without acknowledging its strict conditions.
  *   **Inference:** "Crowds are wise" (via diversity/legitimacy) → "50 lay citizens should overrule 7 specialists on this complex appeal."
  *   **Hidden Assumptions Required for Epistemic Justification:**
      1.  **Nature of the Decision:** That the appeal primarily hinges on *value judgments* about "what's best for the community" or *common sense* accessible to all (#3, #5), rather than intricate technical, legal, or environmental analyses requiring specialist knowledge. (Likely **False** for a "particularly complex" planning appeal involving regulations, environmental impact, engineering, etc.).
      2.  **Individual Competence:** That the *median competence* of the 50 jurors in assessing the *key factors* of the appeal is reliably >0.5, especially on technical/legal aspects. (Likely **False** or **Unknowable**; likely <0.5 for complex technical matters).
      3.  **Independence:** That juror judgments would be truly independent, free from group dynamics, dominant speakers, or common biases amplified during deliberation. (Likely **False** in a deliberative jury setting; violates Condorcet).
      4.  **Aggregation Mechanism:** That simple majority voting after deliberation effectively leverages cognitive diversity for superior problem-solving (#3). (Highly **Contentious**; deliberation can amplify bias and suppress diversity).
      5.  **Superiority of Diversity:** That the diverse heuristics of 50 laypeople are *more relevant and valuable* for solving *this specific complex appeal* than the deep, specialized knowledge of the expert panel. (Likely **False** for highly technical, regulated domains).

  ---

  ### **Verdict for Your Committee Discussion**

  *   **Your colleague's core claim** ("wisdom of crowds" justifies replacing experts with a citizens' jury *on this complex appeal*) relies on an **overextension and conflation** of distinct theses.
  *   **Epistemic Validity Relies on Dubious Assumptions:** For the citizens' jury to be *epistemically* superior (smarter) on a complex technical appeal, assumptions about the nature of the task (value-driven vs. technical), individual juror competence (>0.5), independence, and the effectiveness of deliberation to harness diversity **must hold**. These are **highly unlikely to hold** for a complex planning appeal.
  *   **Legitimacy is Separate:** While a citizens' jury *might* enhance democratic legitimacy (#6), this is a distinct argument from epistemic wisdom. Legitimacy does not equate to superior technical judgment. Presenting it as an epistemic argument ("wiser") is misleading.
  *   **Key Rebuttal Points:**
      *   Condorcet requires binary choice, competence >0.5, and independence – **none apply** here.
      *   Statistical averaging works for guesses, not complex multi-factorial evaluations.
      *   Diversity benefits problem-solving but **does not replace domain expertise** for technical/legal matters; it *complements* it (e.g., experts informed by diverse community input).
      *   The appeal likely involves **verifiable facts and legal standards**, not just subjective values where crowds might claim insight.
      *   Deliberation in juries often creates **dependence and social influence**, undermining independence.
  *   **Conclusion:** Invoking "wisdom of crowds" to replace a specialist panel with a citizens' jury for a complex planning appeal conflates legitimacy with epistemic capacity and relies on assumptions about the task and jurors that are almost certainly false. A citizens' jury *could* play a valuable role (e.g., advising on community values *for* the experts to consider), but replacing technical expertise wholesale on this basis is unjustified and potentially detrimental to sound decision-making.
