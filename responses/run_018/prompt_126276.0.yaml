  Hmm... the colleague's leap from "crowds can be wise" to "laypeople should overrule specialists" suggests they're probably invoking either the Strong Aggregation Thesis (ignoring how expertise matters for complex tasks) or the Democratic Legitimacy Thesis (prioritizing participation over accuracy). Both are shaky foundations for a technical planning appeal.

  Key red flags popping up: 
