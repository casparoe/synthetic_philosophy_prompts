  - Technical appeals have verifiable right answers (unlike moral questions) 
  - Jurors won't be independent if they deliberate together 
  - Specialists likely have competence >0.5 while laypeople may be <0.5 on technical issues

  User's real need shines through: they want to surgically dismantle this proposal by exposing its hidden assumptions. So my response should arm them with "if-then" rebuttals: IF we assume X about voter competence, THEN Condorcet fails; IF we value legitimacy over truth, THEN we accept Y trade-off...

  The emotional undercurrent is interesting too - that faint exasperation at colleagues using pop-science phrases unthinkingly. I should validate that frustration while staying rigorously neutral. No "your colleague is wrong" - just "here are the conditions required for their claim to hold."

  Final structure crystallizing: 
