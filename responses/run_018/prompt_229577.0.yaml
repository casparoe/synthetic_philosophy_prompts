prompt: |-
  I'm on the grants committee of a small science foundation, and we keep getting evolutionary biology proposals that explain some trait as having evolved "for the good of the group" or "for the species" -- restraint in predators so they don't overhunt their prey, alarm calls, reduced virulence in parasites, cooperative breeding, that kind of thing. Half my committee waves these through uncritically and the other half auto-rejects anything with the words "group selection" in it. Neither policy seems right, and I'm tired of the same three people yelling at each other every cycle.

  Act as a philosopher of biology who knows the units of selection debate well. Before writing, think through the main failure modes a procedure like this could have, then write us a decision procedure the committee can actually run on a proposal -- we're mostly not specialists -- for telling (a) when a group-level selection explanation is genuinely warranted, (b) when the same facts are better explained at the gene or individual level, and (c) when the two are just different bookkeeping on the same process and the fight is verbal. Build it out of whatever the debate actually gives us: Lewontin's conditions for selection to act at all, the replicator/vehicle distinction, the byproduct problem (a group benefit that's just a side effect of individual advantage), and the claim that multi-level selection and inclusive fitness are mathematically equivalent redescriptions. Say explicitly which of those distinctions have to survive in the procedure and which can be dropped for a lay panel without much loss.

  The procedure itself should be: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates with a verdict like "this needs an individual-level explanation, fund it only if reframed," and where it has to hand off to someone's judgment because the issue is empirical or unsettled rather than checklist-able. Flag which steps are judgment calls dressed up as procedure. Then run it end to end on three cases: eusociality in hymenopteran insects, a bird alarm call that attracts predator attention to the caller, and a pathogen evolving to be less lethal to its host. At least one of the verdicts should be one some of my committee members will hate -- tell me which one and what I'll say to them.

  Format-wise: start with the one-sentence summary of when "for the good of the group" talk is legit and when it isn't, then go straight into the procedure. No preamble, no restating my situation back to me, no bibliography -- I'll dig up sources myself if I need them. American English, and keep it to something I can actually print out and bring to a meeting, so maybe 1500 words max.
reasoning: |-
  Okay, the user is on a grants committee for a science foundation and they're dealing with evolutionary biology proposals that use group selection explanations. There's division in the committee—half accept these proposals uncritically, half reject anything mentioning group selection. The user wants a clear decision procedure to evaluate these proposals.

  First, I need to recall the key concepts in the units of selection debate. Lewontin's conditions are essential: variation, heritability, and differential fitness. Then there's the replicator/vehicle distinction—genes vs. individuals or groups as units. The byproduct problem is crucial too; sometimes group benefits are just side effects of individual advantages. Also, the equivalence between multi-level selection and inclusive fitness models means some debates might be about framing rather than substance.

  The user needs a step-by-step procedure that non-specialists can follow. The steps should include questions to ask in order, what answers are sufficient, and where to terminate or flag for further review. I should avoid jargon where possible but use necessary terms like "byproduct" since they're part of the biological literature.

  Building the procedure: Start with verifying if the trait is adaptive at all. Maybe some proposals assume adaptation without evidence. Then check if the trait benefits the group but costs the individual. If there's no individual cost, it's likely a byproduct of individual selection. If there's a cost, then explore if group selection is necessary. Here, the Price equation might be useful, but the committee might not handle math. Instead, focus on empirical evidence for group heritability and variation in group fitness.

  Including cases: Eusociality in hymenopterans (bees, ants), alarm calls in birds, and reduced virulence in pathogens. Each tests different aspects. For eusociality, kin selection via haplodiploidy is a key factor, so the group explanation isn't necessary. Alarm calls might have individual benefits, like protecting kin. Reduced virulence could be individual-level if it aids transmission. The pathogen case might be the controversial one—showing that reduced virulence isn't group selection but individual advantage.

  Controversial verdict: Probably the pathogen case. Some committee members might believe that less virulence is for the species' survival, but actually, it's about maximizing transmission. Need to explain that individual selection suffices.

  Structure the procedure:
  1. Confirm the trait is an adaptation.
  2. Identify individual costs and group benefits.
  3. Check for byproduct explanations.
  4. Assess group heritability and variation.
  5. Evaluate if group selection adds explanatory power.

  For each step, define what answers are sufficient to proceed or terminate. Judgment calls where empirical evidence is needed but might not be present in the proposal.

  Word limit is 1500, so keep explanations concise. Use American English. Avoid preamble, start with a one-sentence summary. Then the procedure, followed by applying it to the three cases.

  Ensure the procedure is practical. Committee members aren't specialists, so steps need clear yes/no questions. For example, "Does the trait impose a fitness cost on the individual expressing it?" If no, stop—byproduct. If yes, then proceed to group-level checks.

  Also, mention where the mathematical equivalence (MLS vs. inclusive fitness) makes the debate verbal. If both models explain the data, reject framing that insists on only one level.

  Finally, in the cases, point out which verdict will cause friction. For the pathogen, some might cling to group benefits, but the procedure shows it's individual-level. Advise the user to explain that without group heritability, it's not group selection.
answer: |-
  **One-sentence summary:** "For the good of the group" talk is legit *only* when the trait imposes a net fitness cost on the individual expressing it *and* group-level fitness differences (variation, heritability, differential persistence/reproduction) are the primary driver overcoming that cost; otherwise, the trait is likely an individual-level adaptation (possibly benefiting kin) or a byproduct of individual selection.

  **Decision Procedure: Evaluating "Group Benefit" Claims**

  **(Use sequentially; stop and assign verdict if criteria met. Requires basic grasp of fitness = survival/reproduction success.)**

  1.  **Is the trait plausibly an adaptation *at all*?** (Screen for spurious adaptationism)
      *   *Ask:* Does the proposal provide evidence (e.g., comparative data, experimental manipulation) that the trait *causes* increased evolutionary success (fitness), rather than just correlating or being a non-adaptive constraint?
      *   *Sufficient "No":* Verdict = **Reject explanation as non-adaptive/unsupported**. Halt.
      *   *Sufficient "Yes" or "Unclear":* Proceed to Step 2. *[Judgment call: Is evidence adequate?]*

  2.  **Does the trait impose a net lifetime fitness *cost* on the individual organism expressing it?** (Crucial filter)
      *   *Ask:* Is there direct evidence or strong inference (e.g., survival/reproduction trade-off measured) that individuals expressing the trait have lower fitness *within their group* than non-expressers would in the same group? (e.g., Alarm caller is more likely to die, cooperative breeder has fewer offspring than a non-helper).
      *   *Sufficient "No":* Verdict = **Likely individual-level adaptation or byproduct**. Proceed to Step 2a.
      *   *Sufficient "Yes":* Proceed to Step 3. *[Judgment call: Quantifying "net" cost vs. short-term costs compensated later is often tricky.]*
      *   *Unclear:* Flag for reviewer expertise; needs better evidence.

      2a. **If "No Cost" in Step 2: Can the group benefit be explained as a direct consequence of individual advantage?** (The Byproduct Problem)
      *   *Ask:* Does the trait clearly *increase* the individual's own lifetime fitness *within its group*? (e.g., Restraint in predators increases *their own* long-term food supply; reduced virulence increases *that pathogen strain's* transmission opportunities). Does the group benefit arise automatically from this?
      *   *Sufficient "Yes":* Verdict = **Strong individual-level explanation; group benefit is a side-effect/byproduct. "Group selection" framing unwarranted.** Halt.
      *   *Sufficient "No" (or trait is neutral/weakly costly but group benefit exists):* Proceed to Step 4 cautiously. *[Rare; often indicates poor adaptation claim or misidentified cost.]*

  3.  **Is there heritable variation *among groups* in the trait?** (Lewontin for groups; Core MLS requirement)
      *   *Ask:* Do groups differ in the frequency/expression of the trait? Are these differences stable/persistent (not just random fluctuations)? Are these group-level differences correlated with group "fitness" (persistence, fissioning rate, colonization success)? Is there a mechanism for this group-level trait to be transmitted? (e.g., Groups founded by migrants from successful groups inherit the trait; cultural transmission; trait linked to group-level property like size or density).
      *   *Sufficient "No":* Verdict = **Group selection *cannot* act; explanation requires reframing (e.g., individual cost likely misidentified, or kin selection applies). Fund only if reframed.** Halt. *[Judgment call: Assessing "heritability" at group level is empirically hard; often inferred indirectly.]*
      *   *Sufficient "Yes" or plausible mechanism proposed:* Proceed to Step 4.

  4.  **Do group-level fitness differences *drive* the evolution of the trait, *despite* the individual cost?** (The MLS Core)
      *   *Ask:* Does the empirical evidence/strong model demonstrate that the *advantage* gained by groups *with* the trait (due to higher survival/splitting/colonization) is *sufficiently large* to overcome the *disadvantage* suffered by the altruistic individuals *within* those groups? Is the group-level advantage the *primary causal factor* responsible for maintaining/increasing the trait frequency? Would the trait disappear if groups didn't differentially succeed based on it?
      *   *Sufficient "Yes" (with evidence/model):* Verdict = **Group-level (multi-level) selection explanation potentially warranted. Fundable if scientifically sound.** *[Judgment call: Strength of evidence key.]*
      *   *Sufficient "No" or unclear:* Verdict = **Group selection explanation inadequate or unsupported. Primary driver likely elsewhere (e.g., kin selection via inclusive fitness). Fund only if reframed.** Halt.
      *   *Mathematically Equivalent Redescription Possible?* If a robust inclusive fitness model (accounting for relatedness) easily explains the trait *without* needing group fitness variation, Verdict = **Group vs. individual/gene framing is largely verbal/bookkeeping; scientific merit depends on proposed tests/data, not unit label.** Fund if science is sound. *[Judgment call: Requires reviewer familiar with kin selection theory.]*

  **Procedure Notes:**
  *   **Dropped Distinctions:** The replicator/vehicle distinction is philosophically critical but rarely resolves practical grant assessment; focusing on the *level* where the heritable variation causing differential fitness resides (Lewontin's conditions applied to groups) is sufficient for this purpose. Deep mathematical equivalence (Price equation) is acknowledged in Step 4's "verbal/bookkeeping" exit but isn't needed operationally.
  *   **Critical Surviving Distinctions:** Individual Cost (Step 2) vs. Group Benefit is paramount. The Byproduct Problem (Step 2a) is essential for filtering out bad "group" claims. Group Heritability/Variation (Step 3) is the non-negotiable requirement for MLS.
  *   **Handoffs:** Steps 1, 2, 3, and 4 involve judgment calls on evidence adequacy. Step 4 specifically flags when MLS vs. Inclusive Fitness equivalence makes the fight verbal.
  *   **Verdicts:** Aim for "Fund as is," "Fund only if reframed (specify level)," or "Reject explanation."

  **Case Applications:**

  1.  **Eusociality (Sterile Workers) in Hymenopterans (Bees/Wasps/Ants):**
      *   Step 1: Yes, clear adaptation.
      *   Step 2: **YES (Net Cost)**. Sterile workers forgo personal reproduction.
      *   Step 3: Plausibly yes (groups/colonies vary in worker behavior, colony success heritable via queens).
      *   Step 4: **Verdict = Group vs. Individual Framing is Verbal/Bookkeeping.** Kin selection via haplodiploidy-relatedness provides a powerful, mathematically equivalent inclusive fitness explanation for the *origin* and *maintenance* without requiring group selection as the primary driver. Group selection models also work but don't add unique explanatory power here. Fund based on scientific quality, not unit debate.

  2.  **Bird Alarm Call (Attracts Predator Attention to Caller):**
      *   Step 1: Yes, likely adaptation.
      *   Step 2: **YES (Net Cost)**. Caller is more likely to be killed.
      *   Step 3: Unclear/Weak. While groups with more callers might detect predators better, evidence for heritable variation *among groups* in calling propensity and its direct causal link to *differential group fitness* (vs. just individual survival of kin within the group) is often lacking. Flocks are often fluid.
      *   Step 4: Before full Step 4, Step 3 is weak. **Verdict = Group selection explanation inadequately supported. Reframe required.** Primary driver is likely kin selection (protecting relatives in the group) or reciprocal altruism (if calls are reciprocated), operating at the individual/gene level via inclusive fitness. Fund only if proposal reframes explanation and tests kin/reciprocity hypotheses.

  3.  **Pathogen Evolving Reduced Virulence (Less Lethal to Host):**
      *   Step 1: Yes, adaptation (e.g., myxoma virus in rabbits).
      *   Step 2: **CRITICAL - NO (No Net Cost).** Virulence (host damage) is often linked to transmission (e.g., high virulence kills host fast, reducing transmission time). Reduced virulence *increases* the *individual pathogen's* (or strain's) fitness by allowing longer transmission periods. The "group" (host/pathogen system persistence) benefit is a side-effect.
      *   Step 2a: **YES.** The trait (lower virulence) directly increases the individual pathogen's transmission success and thus fitness. Group persistence is a byproduct.
      *   **Verdict = Strong individual-level explanation; "group selection" framing is misleading/unwarranted. Fund only if reframed without group selection justification.** The evolution is driven by individual pathogen fitness maximization within the host.

  **The Controversial Verdict: Pathogen Virulence (Case 3)**

  *   **Who Will Hate It:** Committee members who auto-reject "group selection" might be fine, but those who wave through "for the species" explanations (especially common in disease ecology/medicine) will likely object. They see host survival as the "goal."
  *   **What To Say:**
      *   "The procedure forces us to ask the key question: Does *this pathogen strain* pay a cost *within its host* by being less virulent? The evidence shows it *doesn't*; less virulence *helps* that strain spread more by keeping the host alive longer. It's directly beneficial to the individual pathogen's genes."
      *   "Calling this 'group selection' for the 'good of the pathogen species' is incorrect. It confuses a beneficial side-effect (host survival) with the actual evolutionary mechanism (individual selection maximizing transmission)."
      *   "Funding this *as a group selection study* sets bad precedent and misrepresents evolutionary theory. We should fund it only if they justify the virulence model correctly using within-host competition and transmission trade-offs, which is a robust individual/gene-level framework."
