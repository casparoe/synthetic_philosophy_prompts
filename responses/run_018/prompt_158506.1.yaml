prompt: |-
  hey im putting together the final exam for our upper-level philosophy of science seminar and i need one essay question students can do in about 90 minutes, worth 25 marks, on Wigners idea about the unreasonable effectiveness of mathematics. please dont make it the standard "summarize Wigner then list objections" thing -- thats way too regurgitable. instead inject this framing: ask students to split effectiveness into descriptive-mapping fit (math tracks structures already present in nature) versus interventionist-engineering fit (math lets us build tech that exploits hidden regularities we never observed directly), then have them say whether Wigners puzzle still looks unreasonable once both kinds are on the table. include a hypothetical in the prompt itself: an abstract symmetry argument with zero empirical calibration predicts a specific particle decay rate, and it turns out right. students should argue whether this supports one kind of fit over the other, or if the distinction collapses. the whole thing needs to be answerable with no web access, so no bibliography requests, no citation lists, and no references to obscure post-2000 literature students wouldnt have memroized. deliver the exam question wording, a model answer with five must-hit moves, and a marking scheme totaling 25 marks that lists each move, its weight, and the one-line typical mistake that costs points. keep it casual, its just internal committee stuff.
