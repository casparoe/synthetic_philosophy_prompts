answer: |-
  Here’s a sestina exploring the tension between "horse" and "white," using the requested end-words and structure. It aims for clarity and unresolved duality:

  **Sestina for the Unnamed**

  This stable holds a thing we call **horse**,
  A shape that moves, defined by **form** alone.
  I look outside: a blur of drifting **white**
  Against the field. What do I hope to **seek**?
  A name that holds both? There’s only **absence**.
  The word escapes me; I can’t fix the **name**.

  My tongue trips trying to assign the **name**
  To what I see. Is it the solid **horse**?
  Or just the drifting, clinging field of **white**?
  The solid mass suggests a certain **form**,
  But where it ends, the color starts. I **seek**
  A boundary lost in glaring **absence**.

  A shadow moves – is that a stark **absence**
  Or substance? Words collide. I need a **name**.
  Beyond the gate, a figure starts to **seek**
  The fence. Is it the essence of a **horse**
  I recognize? Or just the known **form**
  Made strange, transformed by overwhelming **white**?

  The snow keeps falling, pure persistent **white**.
  It hides the ground, creates a blank **absence**.
  It coats the world, obscuring every **form**.
  Confusion reigns. What fits the proper **name**?
  Is it the creature known, the living **horse**,
  Or something else my senses try to **seek**?

  My eyes grow tired as they strain to **seek**
  Distinction in this merging field of **white**.
  The outline wavers – is that still the **horse**?
  Or has the color claimed it? **Absence**
  Expands where meaning was. What shared **name**
  Could ever hold both shade and solid **form**?

  I grasp the concept of the thing’s true **form**,
  The structure bones define. I **seek** it now.
  But then the color, that insistent **white**,
  Washes it clean. It leaves an aching **absence**
  Where certainty once stood. No single **name**
  Seems large enough for color and for **horse**.

  *(Envoi)*
  Speak plain the **name** the senses must **seek**:
  **White** settles on the **horse**. **Form** meets its **absence**.

  ---

  **Structural Notes for Your Seminar:**

  1.  **Performing the Split:** The rotating end-words constantly pull "horse" and "white" apart into different lines. They are never together until the envoi, enacting the separation linguistically.
  2.  **The Search & Absence:** "Seek" and "absence" reflect the attempt to find a unified concept ("name") and the resulting void when color and form are considered distinct.
  3.  **Unresolved Tension:** The envoi forces "white" and "horse" side-by-side ("White settles on the horse"), mirroring the undeniable reality of the white horse itself, yet immediately follows it with "Form meets its absence," highlighting the conceptual conflict Gongsun Long identifies. It doesn't resolve; it juxtaposes.
  4.  **Plain Language:** The vocabulary is deliberately simple and concrete (stable, field, snow, fence, shadow, bones), focusing on sensory experience and the struggle to name.
  5.  **Avoiding Prescription:** The poem presents the speaker's struggle to reconcile "horse," "white," and "form" into a stable "name," resulting in "absence." It depicts the *experience* of the paradox, not an argument for or against it.

  This structure should allow your students to *feel* the conceptual tension through the poem's form and wordplay, setting the stage for deeper discussion without imposing an answer.
