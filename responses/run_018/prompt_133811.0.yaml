  I should be careful not to impose my own metaphysical preferences here. The user specifically wants their own judgments systematized, not corrected. That said, I notice their uncertainty about Case 3 (xenocytoplasm) and Case 4 (fission) might be the key - if I can resolve those, it may unlock the whole system.

