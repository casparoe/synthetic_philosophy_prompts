  Each leaf should name the position if it has one (Hofstadter-style strange-loopism, Gödelian dualism, the unnamed "recursive scafolding" view I'm playing with, etc.) and give one sentence on its most awkward commitment. Note any empty combinations — e.g., is there anyone who combines "scafolding failure" with "observer must be formalised" and "minds are analagous"? If the space is empty, say whether it's incoherent or just unexplored.

  Please phrase every node as a concrete claim or case the student can answer without knowing the labels. Flag any pair of leaves your tree genuinely can't separate — I don't want them papered over. Keep it casual, write in British English, and don't bother with bibliographies or citations; I haven't got time and neither have you.
