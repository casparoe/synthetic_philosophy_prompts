answer: |-
  Here’s a pantoum designed for your closing session, embodying the ambiguity between moral conviction and disguised bias through its recursive form and shifting context:

  **The Ordinance**

  The shop should close at ten.
  It’s no small thing that’s breaking.
  We must not let this stand.
  The noise disturbs the peace.

  It’s no small thing that’s breaking –
  (No fact would prove it sound) –
  The noise disturbs the peace.
  Would you choose this again?

  (No fact would prove it sound).
  We learned it long ago.
  Would you choose this again,
  Or pass it, clean, to them?

  We learned it long ago.
  We must not let this stand.
  Or pass it, clean, to them?
  **The shop should close at ten.**

  ---

  **How it meets your requirements:**

  1.  **Form & Structure:** Strict pantoum form (ABAB BCBC CDCD DADA), closing by returning the opening line.
  2.  **Ambiguity & Shifting Meaning:**
      *   **"It's no small thing that's breaking":** In Stanza 1, it sounds like a profound moral claim (social fabric, covenant). In Stanza 2, placed after "(No fact would prove it sound)", it feels more like an assertion of personal/group importance ("*our* peace, *our* way is breaking").
      *   **"We must not let this stand":** In Stanza 1, it reads as principled resistance. In Stanza 4, after "Or pass it, clean, to them?" (inheritance test) and before the final question, it feels more like stubborn boundary-guarding or tribal loyalty ("*We* won't tolerate this change").
      *   **The Object:** The shop closing time is concrete, seemingly harmless ("noise disturbs the peace" is subjective), inviting the silent substitution test (What if *my* shop? What if *their* gathering?).
  3.  **Embedded Tests:**
      *   **Off-Switch Test:** Explicitly referenced: "(No fact would prove it sound)". The condemnation persists despite acknowledging no factual basis would change the feeling.
      *   **Inheritance Test:** Explicitly asked: "Would you choose this again, / Or pass it, clean, to them?" Highlighting the discomfort of justifying the "real reason" for inheritance.
      *   **Substitution Test:** Implicitly invited by the neutral, common object (shop hours). The reader naturally wonders if the objection holds if the situation involved the speaker's preferred group or activity running late.
  4.  **Concrete Harmless Object:** The late-closing shop causing "noise" that "disturbs the peace" is perfect – it *could* be a genuine nuisance violating a shared norm, or it could be intolerance for difference/disruption of a familiar quiet.
  5.  **Non-Adjudicating Ending:** The final stanza brings back "We must not let this stand" with its new, potentially tribal connotation, and ends with the unchanged opening line, "The shop should close at ten." This landing is flat, circular, and unresolved. It offers no verdict. It simply restates the initial position, now layered with the ambiguity built throughout the poem. The reader is left holding the unresolved tension, feeling the circularity of the reasoning the tests tried (and failed) to break.
  6.  **Why the Tests Fail Here:** The speaker concedes no factual basis ("No fact would prove it sound"), dodges the inheritance test ("Would you choose this again?" hangs, unanswered directly), and the substitution test is only implied, never applied *by the speaker*. The poem's structure *is* the speaker's reasoning – repetitive, self-referential, closed off. The tests require an openness the form (and the mindset it mimics) denies.

  This poem leaves the reader precisely where you want them: uncertain whether they've witnessed a core conviction or a deeply held preference in moral disguise, and feeling the formal structure of the pantoum as the perfect vessel for that very epistemological trap.
