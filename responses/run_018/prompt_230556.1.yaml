  2. Introduction: Setting the scene of the firm's adoption of the DA.
  3. Explanation of the Doomsday Argument: Including the self-sampling assumption and the reference class problem, with the analysts "fiddling" with the reference class to avoid being in the alarming part of the distribution.
  4. Distinction between prior probability and the likelihood shift from DA, and between DA and ordinary induction.
  5. Running joke: Every time the framework is applied recursively (to the firm itself), the expected longevity collapses, leading to a drift towards diversification into hypotheses with more observers.
