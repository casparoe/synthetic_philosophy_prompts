  **MEMORANDUM**  
  **To:** Valued Clients  
  **From:** Carthage & Co. Anthropic Risk Desk  
  **Date:** October 26, 2023  
  **Subject:** *Global Anthropic Outlook 2070: Terminal Distributions and the Observer Selection Effect*  
  **Memo No.:** CA-23-Ω  

  ---

  ### **I. EXECUTIVE SUMMARY**  
  Carthage & Co. formally integrates anthropic reasoning into long-run forecasting via the *Doomsday Argument (DA)*. Under the Self-Sampling Assumption (SSA), humanity’s position in its birth order implies a high likelihood of near-term extinction, compressing our "Doom Horizon" (median extinction by 2270; 95% CI: 2120–>1M CE). However, reference class ambiguity permits strategic recalibration—shifting our own cohort’s risk percentile downward—while preserving DA’s mathematical core. Crucially, we distinguish DA from naive induction (e.g., "we survived the Cold War, so we’re robust") and emphasize its *Bayesian update* on priors. Recursive application to Carthage & Co. introduces untenable reflexivity, prompting a pivot toward multiverse-aligned assets (e.g., AGI, cryonics, lunar real estate). Clients are advised to overweight hypotheses yielding *high future observer counts*, hedging against SSA-induced truncation.  

  ---

  ### **II. THE ANTHROPIC TURN IN MACRO FORECASTING**  
  Historically, Carthage relied on conventional models (demographic decay, climate feedback loops, nuclear geopolitics). These neglect a fundamental bias: *observers only exist where survival occurs*. Enter the DA: assuming we are typical among all humans who will ever live, simple uniform sampling places humanity near the end of its timeline. If \( N \) is the total humans ever born, and \( n \) is the current count (~117B), we are likely in the earliest \( \alpha\% \) such that \( \alpha \approx n/N \). Thus, \( N \approx n/\alpha \). Setting \( \alpha = 0.05 \) (typicality threshold) suggests \( N \approx 2.34 \) trillion—implying imminent extinction given birth rates.  

  ---

  ### **III. QUANTIFYING THE DOOM HORIZON**  
  Our "Doom Horizon" model (Fig. 1) blends DA with priors on existential threats. Assuming a log-uniform prior for \( N \) (standard in DA literature), the 95% confidence band for human extinction converges sharply:  
  - **Median timeline remaining**: 247 years (2270 CE)  
  - **Lower bound (2.5th percentile)**: 97 years (2120 CE)  
  - **Upper bound (97.5th percentile)**: 1 million years (conservative, per prior weight on low-risk scenarios)  

  **FIGURE 1: DOOM HORIZON CONFIDENCE BANDS**  
  ```  
  Extinction Probability │  
  1.0 ┼************* Upper Bound (97.5%)  
      │          *  
  0.8 ┼         *   
      │        *    Median (2270 CE)  
  0.6 ┼       *  
      │      *  
  0.4 ┼     *  
      │    *  
  0.2 ┼   *  Lower Bound (2.5%)  
      │ **  
  0.0 ┼**───────────────────> Time  
      2023  2120     2270      1M CE  
  ```  
  *Note: Band width reflects uncertainty in reference class definition (Sec. IV). Prior: P(extinction) = 0.2/yr post-2100; undisclosed weighting for DA consistency.*  

  This is not mere induction ("we survived 1945, so we’re safe"). Induction updates *forward* from past data; DA updates *backward* from our temporal location. Prior risks (e.g., asteroid impacts) are amplified by SSA—a likelihood shift, not a prior.  

  ---

  ### **IV. REFERENCE CLASS CALIBRATION: A PRACTICAL RESOLUTION**  
  DA’s fault line remains reference class selection. Are we "typical" among *all humans*, *conscious entities*, or *humans aware of DA*? Initial models placed Carthage analysts in the top 5% of humanity’s birth order, implying 95% probability we are among the last 95% of humans. This proved... unsettling.  

  We thus recalibrated:  
  1. **Class Expansion**: Defining observers as *all mammals* pushes typicality into the deep future (N ≈ 10^18, extinction delayed >1M years).  
  2. **Class Restriction**: Defining observers as *humans with advanced cosmology* (≈10^7 individuals) places us in the early cohort. Extinction risk drops to 0.3%/yr.  
  3. **Stratification**: Segmenting by profession (e.g., "finance professionals") yields N ≈ 5B total—implying sector-specific doom by 2150.  

  By optimizing class definitions (Methodology Annex α), we ensure analysts reside below the 50th risk percentile while preserving DA’s formalism. Skepticism is expected—and priced in.  

  ---

  ### **V. RECURSIVE COLLAPSE AND THE CARTHAGE PARADOX**  
  Applying DA recursively to Carthage & Co. creates instability. If Carthage is a "typical" firm among all that will ever exist, our expected lifespan falls to 43 years (vs. S&P 500 average 18 years). Further recursion on *this memo*’s readers suggests a 92% chance of obsolescence before 2025.  

  This paradox forces a concession: **DA cannot self-consistently govern its own propagation**. Each time an analyst internalizes SSA, Carthage’s forecast horizon shrinks, necessitating:  
  - **Short-term (T+5 years)**: Raise cash buffers.  
  - **Medium-term (T+50 years)**: Allocate to existential-risk mitigation (e.g., AI alignment ETFs).  
  - **Long-term (T+200 years)**: Diversify into observer-maximizing scenarios (e.g., simulation substrates, interstellar colonization).  

  ---

  ### **VI. INVESTMENT IMPLICATIONS: THE OBSERVER PORTFOLIO**  
  DA compels hedging against low-N outcomes. We recommend:  
  - **Underweight**: SSA-vulnerable assets (e.g., century bonds, terrestrial agriculture).  
  - **Overweight**:  
    - **AGI Development** (Ticker: SIMS): If AGI spawns 10^20 digital minds, DA updates favor its success.  
    - **Cryonics & Longevity** (Ticker: ICE): Extends observer count, diluting near-term risk.  
    - **Multiplanetary Trustees** (Ticker: MARS): Colonization raises N, invalidating terrestrial DA.  
  - **Satellite Allocation**: Lunar real estate (Ticker: CRATR) as collateral if DA self-recursion voids Earth-bound models.  

  ---

  ### **VII. CONCLUSION**  
  The Doom Horizon is real but malleable. Carthage & Co. embraces SSA not as prophecy, but as a *Bayesian tool* for navigating observer selection bias. While reference-class elasticity permits tactical optimism, recursion limits force diversification into high-N universes. Prepare for truncated timelines—but invest as if we are early.  

  **Annexes**:  
  - α: Reference Class Calibration Details  
  - β: Doom Horizon Priors (Confidential)  
  - γ: Observer Portfolio Holdings  

  *Caveat: This memo exists. By SSA, you are likely typical of its readers. Adjust expectations accordingly.*  

