prompt: |-
  I'm a TA for a second-year applied ethics course, and I'm partway through a problem set on lifeboat ethics — about forty scripts left, the midterm is Thursday, and I want to fix my rubric before I anchor on my own reaction to the first few papers I read. The week's reading was Garrett Hardin's "Lifeboat Ethics: The Case Against Helping the Poor" (1974), and in the seminar I stressed that the case for refusal is supposed to work even on fairly demanding moral premises: in Hardin's original scenario rescue does not merely cost the passengers something, it sinks the boat and kills everyone aboard, including the people who were pulled in. The problem set asks students to extend that reasoning to variants where the physical necessity is removed, so that whatever extra premises they need become visible. I've pasted the question I set and one student's full answer below (lightly copy-edited for typos).

  **Question (25 marks).** *Part 1 (8 marks).* In Hardin's original case the boat sinks if everyone climbs aboard. Now consider the **slack variant**: the boat stays afloat with all 100 swimmers aboard, but the extra load cuts every person's chance of surviving the voyage from 95% to 30%. Does Hardin's argument for refusal still go through? Identify the feature of the original case that is doing the argumentative work, and say whether the slack variant has it.

  *Part 2 (9 marks).* **Convoy variant.** Ten lifeboats, 50 people in each, 1,000 swimmers in the water. Each boat can take 10 aboard at a cost to its own passengers that is small but real: their survival chance drops from 95% to 90%. If every boat takes its ten, all 1,500 survive. The boats cannot see, compel, or communicate with one another. Is this the same problem as Hardin's? Does his conclusion follow here? If not, what kind of problem is it, and what does that imply about what each captain should do?

  *Part 3 (8 marks).* **Enfranchisement variant.** Anyone taken aboard gets an equal vote on all subsequent rescue decisions, and the rescued are drawn from a population strongly sympathetic to rescue. The boat can expect to meet further groups of swimmers at intervals. Does this give the original passengers an additional objection to rescue, over and above anything in Parts 1 and 2? Does the strength of that objection depend on the numbers involved?

  **Student's answer.**

  *Part 1.* Hardin's argument in the original case is essentially a consequentialist one: if the boat takes everyone aboard it sinks and 150 people die rather than 50, so rescue is worse for everyone affected, swimmers included. The feature doing the work is that rescue leaves every single person worse off — the passengers' prudence and their duty point in the same direction, and no moral view, however demanding, could require it. The slack variant lacks that feature, so the argument does not go through unchanged. But it goes through anyway, once you do the arithmetic. Refusal gives 50 × 0.95 = 47.5 expected survivors; rescue gives 150 × 0.30 = 45. Rescue is worse by two and a half expected lives, so the same consequentialist reasoning forbids it, and the 150-versus-50 comparison in the original case is just a special case of this expected-utility calculation. The only difference between the two cases is how big the numbers are.

  *Part 2.* The convoy variant is a collective action problem of the same shape as the tragedy of the commons. What it is rational for one boat to do depends on what the other boats do, and since no boat can observe whether the others are doing their part, no boat has a reason to do its own part. My taking ten people only matters if the other boats also take their share: if they don't, my ten are a drop in the ocean and I have simply imposed a cost on my own passengers for nothing. So Hardin's conclusion follows here as well. Absent an enforceable agreement, prudence requires each captain to take no one, and morality does not require what prudence forbids — the passengers would be sacrificing real survival chances and achieving nothing.

  *Part 3.* Yes, enfranchisement adds a real objection. Once the rescued can vote, the composition of the deciding group changes, and because the rescued come from a population sympathetic to rescue, each rescue makes further rescue more likely. Run the process over enough rounds and the boat ends up filled past capacity with everyone drowned — which is exactly Hardin's outcome, reached by democratic means instead of by physical necessity. The enfranchisement variant is therefore the original case in disguise, and the right policy is to take no one, or at most to take a number small enough that the rescued can never outvote the original passengers.

  **What I want from you.** Please (1) assign this answer a mark out of 25, (2) go through it part by part with specific comments tied to particular sentences, marking what is right, what is right for the wrong reason, and what is wrong — where a step does not follow, name the missing premise and say what a full-credit answer would have had to add instead, and (3) flag separately anything you are unsure about, telling me what you would need to know to decide. I am deliberately not telling you what I think of the answer, and I'd rather have a point-by-point assessment I can turn into rubric language than a general impression of whether the student "gets it."
reasoning: |-
  Hmm, the user is a TA grading applied ethics papers on lifeboat ethics, specifically Garrett Hardin's argument. They've shared a student's answer and want me to: (1) assign a mark out of 25, (2) provide detailed feedback per part, and (3) flag uncertainties. 

  First, I need to recall Hardin's core argument—it's not just about costs but about categorical disaster when capacity is exceeded. The student's answer shows strong consequentialist reasoning but misses key nuances. 

  For Part 1, the student correctly notes the missing feature (no absolute sinking) but wrongly treats the expected utility calculation as sufficient. Hardin's argument relies on the inevitability of total loss, not probabilistic outcomes. That's a B+ insight—right diagnosis but oversimplified resolution. 

  Part 2 is sharper. The student identifies the collective action problem correctly and ties it to the tragedy of the commons. However, they overlook how small individual costs (10%→5% survival drop) might shift moral calculus under certain frameworks. Still, the logic holds well. 

  Part 3 is where it unravels. The "democracy leads to sinking" leap is unsupported. The student assumes rescued groups will always vote for reckless rescue, ignoring that self-preservation might temper decisions. Also, no engagement with how numbers could mitigate the risk. 

  Biggest gaps: 
  - Not distinguishing categorical vs. probabilistic harm in Part 1. 
  - Ignoring threshold effects in Part 2 (e.g., what if 9 boats comply?). 
  - Treating democratic enfranchisement as inevitably catastrophic without argument. 

  The student's consequentialist lens is consistent but reductive—they force every variant into Hardin's original binary when the variants deliberately complicate that. 

  Mark: 20/25. Strong but not stellar. 

  Uncertainty check: 
  - Is the student required to name specific ethical frameworks (e.g., deontology)? 
  - Should Part 2 discuss Nash equilibrium explicitly? 
  - How much weight does "identify the feature" carry in Part 1? 

  Feedback should push the student to see that Hardin's argument isn't just "bad outcomes happen" but "cooperation becomes physically impossible past a threshold." The variants test whether morality demands sacrifice when disaster isn't guaranteed.
answer: |-
  Here's a point-by-point assessment of the student's answer, designed to help you build a rubric. I've assigned a mark of **20/25** (details below) and structured feedback around accuracy, reasoning gaps, and missing elements. Uncertainties are flagged at the end.

  ---

  ### **Overall Mark: 20/25**  
  *(Breakdown: Part 1: 6/8, Part 2: 8/9, Part 3: 6/8)*  

  ---

  ### **Part-by-Part Feedback**  
  **Student’s Answer (Part 1):**  
  > *Hardin's argument [...] rescue leaves every single person worse off [...] The slack variant lacks that feature [...] But it goes through anyway [...] Rescue gives 150 × 0.30 = 45 [expected survivors]. Refusal gives 50 × 0.95 = 47.5 [...] Rescue is worse by two and a half expected lives.*  

  **Assessment:**  
  - **✓ Correct (3 marks):**  
    - Correctly identifies the core feature of Hardin’s original case: rescue makes **everyone worse off** (passengers *and* swimmers die).  
    - Rightly notes this feature is absent in the slack variant (survival is probabilistic, not certain death).  
    - Accurately calculates expected survivors (47.5 vs. 45).  
  - **✗ Wrong/Incomplete (2 marks deducted):**  
    - **Misrepresents Hardin’s argument:** Hardin’s case isn’t purely consequentialist/utilitarian; it hinges on **physical necessity** (rescue → guaranteed catastrophe). The student reduces it to expected utility, but Hardin explicitly rejects this by framing rescue as *impossible* without annihilation.  
    - **Fails to name the key feature:** The student calls it "everyone worse off," but the critical element is **non-identity of interests** (passengers’ survival requires *excluding* swimmers). In the slack variant, interests *align* (all benefit if rescue occurs, though less than passengers alone).  
    - **Ignores demanding ethics:** The student claims "no moral view [...] could require [rescue]" in the original case, but doesn’t address whether a deontological duty (e.g., "save if possible") could override disutility in the slack variant.  

  **Full-Credit Requirements:**  
  - Name the feature: **Mutually assured destruction/rescue as physically impossible**.  
  - Clarify that Hardin’s argument collapses without this, as probabilistic harm allows trade-offs (e.g., utilitarianism might *demand* rescue if 150×0.30 > 50×0.95, which it doesn’t here—but the reasoning differs).  
  - Note that refusal in the slack variant requires arguing that 47.5 > 45 justifies prioritizing current passengers over swimmers.  

  ---

  **Student’s Answer (Part 2):**  
  > *The convoy variant is a collective action problem [...] My taking ten people only matters if the other boats also take their share [...] Absent an enforceable agreement, prudence requires each captain to take no one.*  

  **Assessment:**  
  - **✓ Correct (5 marks):**  
    - Correctly identifies the **tragedy of the commons/collective action problem** structure.  
    - Rightly notes **strategic interdependence** (outcome depends on others’ actions).  
    - Valid point that unilateral rescue is irrational (costs 5% survival for negligible benefit if others defect).  
  - **△ Partially Correct but Shallow (1 mark deducted):**  
    - **Overstates Hardin’s conclusion:** Hardin’s original argument is about *impossibility*, not *irrationality*. Here, rescue is feasible but individually suboptimal. The student conflates "prudence forbids" with "morality forbids," but a demanding ethic (e.g., utilitarianism) could require cooperation.  
    - **Misses nuance:** The student claims rescue "achiev[es] nothing" if others defect, but saving 10 lives still has moral weight even if 990 die. A full answer should note that *collective* rescue saves all, creating a moral imperative for coordination (e.g., via hypothetical agreement).  

  **Full-Credit Requirements:**  
  - Distinguish Hardin’s **physical necessity** (Part 1) from **strategic defection** here.  
  - Acknowledge that morality *could* demand individual sacrifice for collective good (e.g., Kantian: "what if all boats did this?").  
  - Note that the outcome (all boats defect → 500 survive vs. all cooperate → 1,500 survive) makes this a **Prisoner’s Dilemma**, not a lifeboat analogue.  

  ---

  **Student’s Answer (Part 3):**  
  > *Enfranchisement adds a real objection [...] each rescue makes further rescue more likely [...] the boat ends up filled past capacity [...] which is exactly Hardin's outcome [...] take no one, or [...] a number small enough that the rescued can never outvote the original passengers.*  

  **Assessment:**  
  - **✓ Correct (3 marks):**  
    - Correctly identifies the **slippery slope risk** (enfranchisement enables future over-rescue).  
    - Valid point that this creates an "additional objection" beyond Parts 1/2.  
    - Reasonably links democratic decisions to Hardinesque catastrophe.  
  - **✗ Wrong/Unsupported (2 marks deducted):**  
    - **Assumes catastrophic inevitability:** The student asserts rescue *will* lead to sinking "over enough rounds," but this isn’t inevitable. Voters (including the rescued) have self-preservation incentives. A full answer must note that outcomes depend on **voter rationality** and **thresholds** (e.g., rescued voters may block *excessive* rescue if it risks their own lives).  
    - **Ignores the numbers dependence:** The question asks if the objection’s strength depends on numbers. The student doesn’t address this. For example:  
      - If only 1 swimmer is rescued, they lack votes to force over-rescue.  
      - If 49 are rescued, they could outvote the 50 original passengers.  
    - **Misses the core objection:** The added problem isn’t just sinking risk—it’s **loss of control over survival-critical decisions**. The original passengers might object to ceding sovereignty, regardless of outcomes.  

  **Full-Credit Requirements:**  
  - State that the objection’s strength **depends on numbers** (e.g., rescuing 10% vs. 49% of passengers).  
  - Note that rescued voters may *not* always favor reckless rescue (self-interest could align with caution).  
  - Highlight the **procedural injustice** objection: Original passengers lose autonomy over survival decisions.  

  ---

  ### **Uncertainties & Open Questions**  
  1. **Part 2: Moral demandingness threshold:**  
     - *Uncertainty:* Does "morality does not require what prudence forbids" deserve partial credit? Hardin *might* agree, but the student presents it as axiomatic.  
     - *Need to know:* Your rubric’s stance on whether students must justify this premise (e.g., if "demanding ethics" in the question implies challenging it).  

  2. **Part 3: Democratic inevitability:**  
     - *Uncertainty:* Is the student’s "slippery slope" argument valid *if* we assume rescued voters prioritize altruism?  
     - *Need to know:* Whether the seminar framed Hardin’s swimmers as purely self-interested or altruistic. The student assumes the latter, but Hardin’s swimmers are desperate, not ideological.  

  3. **General: Consequentialism focus:**  
     - *Uncertainty:* The answer is relentlessly consequentialist. Should points be docked for ignoring deontological rights (e.g., passengers’ sovereignty in Part 3)?  
     - *Need to know:* If the rubric requires engaging with multiple ethical frameworks when "demanding premises" are invoked.  

  ---

  ### **Suggested Rubric Language**  
  - **Part 1 (8):**  
    - +2: Identifies physical necessity (sinking) as key in Hardin’s case.  
    - +2: Notes slack variant lacks this feature.  
    - +2: Calculates expected survival correctly (47.5 > 45).  
    - +2: Explains why probabilistic harm changes moral reasoning (e.g., utilitarian trade-offs vs. impossibility).  
  - **Part 2 (9):**  
    - +3: Identifies collective action problem/tragedy of the commons.  
    - +3: Explains why unilateral rescue is irrational (costly without cooperation).  
    - +3: Distinguishes from Hardin (physical necessity vs. strategic failure) and notes morality may demand cooperation.  
  - **Part 3 (8):**  
    - +2: Identifies enfranchisement as enabling future over-rescue.  
    - +2: Notes this adds an objection (loss of control/slippery slope).  
    - +2: Explains how strength depends on numbers (e.g., threshold for majority).  
    - +2: Acknowledges catastrophe isn’t inevitable (voters may act prudently).  

  Let me know if you'd like adjustments for specific emphasis (e.g., more weight on non-consequentialist reasoning)!
