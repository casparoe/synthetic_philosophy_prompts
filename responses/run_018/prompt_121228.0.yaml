  ## The Tuning of Unspoken Things

  The Resonance Hall of Oikos hummed, a living thing built of breath and stone. Lyra stood within its curved embrace, shoulder-to-shoulder with her fellow citizens, the air thick with the damp warmth of shared exhalation. Before them, the Bureau technicians, faces impassive in the pale light filtering through alabaster vents, held polished tuning forks ready. It was Cycle-End.

  A low technician’s chime pierced the murmur. Silence fell, heavy and expectant. Then, starting from the eastern quadrant, the vocalization began. A deep-throated drone for the grain rations, swelling as others joined. A sharper, rhythmic clacking of tongues for ceramic tiles. A complex, layered warble for the communal steam-baths. Each need, each consumed good, translated into sound by its claimants, amplified by the hall’s perfect acoustics. The sounds collided, merged, resonated. The very stone vibrated. High harmonics shimmered where demand was fierce; low, muddy tones hinted at surplus. The Bureau recorded the sonic landscape, translating harmonic peaks and troughs into the allocations for the next cycle – the sacred pseudo-price.

  Lyra’s turn approached her quadrant. She opened her mouth. What sound could capture the smooth glide of her fingerboard plane over aged spruce? The precise, bone-deep resonance she listened for when tapping a soundboard? The scent of crushed resin warming under friction? She produced the assigned syllable for "furniture-grade wood": a short, flat "Aahm." Others around her echoed it. The sound died quickly, absorbed into the drone for basic textiles. No harmonic peak. No signal of need.

  Later, in her workshop – a cavern of fragrant shavings, hung tools, and half-born instruments – Lyra ran a calloused thumb over a block of seagrape wood. It was perfect, dense yet resonant, found only on the storm-lashed northern islets. Beside it rested a small, stoppered vial: *Thalassi Resin*, milk-blue, gathered at dawn from weeping cliffs by old Marin, who knew the tides and the secret cuts. It cured slowly, deepening into an adhesive that held like stone yet flexed like sinew, vital for lute backs.

  The Bureau manifest arrived. She scanned the neat columns. *Furniture-Grade Timber: Surplus. Allocation Reduced 15%. Marine Resins: Surplus. Allocation Reduced 20%.*

  A hollow ache bloomed in her chest. Surplus! Marin had whispered just yesterday, his hands trembling, that the weeping cliffs yielded less each season. The storms were changing the currents, he said, a knowledge written in his bones and the sea’s mood, not in any Bureau log. And good seagrape? It was becoming scarce, the stands thinning. She *knew*, in the way her tools met resistance, in the whispers from woodcutters who ventured north.

  The pseudo-price system saw only the flat "Aahm," the lack of vocal fervor. It couldn't capture the years of apprenticeship needed to hear the song trapped within raw wood, the intuitive adjustment of a chisel stroke, Marin’s unspoken dialogue with the tides. This knowledge lived in the hands, the eyes, the quiet communion with material. To vocalize it in the hall was to reduce it to a crude noise, stripped of context, nuance, and the very essence that gave it value. Speaking about the *need* for specific resin or aged wood wouldn't convey the *why* – the irreplaceable role it played in creating an instrument that wouldn't warp or crack, that sang true. The Bureau would hear only another demand, another abstract "Aahm" or perhaps a new, equally hollow syllable they might assign: "Special Wood. Aaah-*oom*." The specificity, the *reason*, would evaporate in the echoing chamber.

  She could go to them. Stand before a Bureau official in their austere, sound-dampened office. Explain about Marin’s failing hands, the shifting currents, the unique properties of seagrape. But the words felt like stones in her mouth. How to convey the *feel* of the resin’s perfect tack? The *sound* of properly cured spruce? The official would nod, make a note – "Artisan reports subjective concerns re: material scarcity" – and the next manifest would still list Surplus. Her knowledge, translated into their language of reports and categories, would become merely an opinion, a preference, easily dismissed against the harmonic "objectivity" of the Resonance Hall.

  Lyra picked up the vial of *Thalassi Resin*. It felt cool, vital. She walked to her workbench where the back of a small sea-lute lay clamped, the delicate ribs waiting to be joined. The allocated, generic adhesive sat in its pot, adequate for chairs, perhaps, but prone to brittleness in the humid salt air. The *Thalassi*, cured properly, would bond the ribs into a single, resilient voice.

  The workshop was quiet, filled only with the scent of wood and dust. The clamor of the Resonance Hall felt distant, unreal. Here, knowledge wasn't spoken; it was enacted. It lived in the grain under her plane, in the whisper-thin shavings, in the patient waiting for resin to cure.

  She uncorked the vial. The faint, briny-sweet scent filled the small space. She dipped a fine brush. The resin flowed, thick and promising, onto the joining edge of a rib. Not too much, not too little – a judgement born of ten thousand repetitions. She fitted the rib carefully, applying gentle pressure, feeling the minute resistance, the perfect seating. She repeated the process, joining rib to rib in a silent, meticulous dance. Each touch, each adjustment, held the unspoken knowledge: this resin, this wood, this care, creates something that endures, that sings. Something the harmonic convergence, listening only to the roar of aggregate wants, could never value. It recorded only the absence of a loud enough demand cry.

  She would use the resin. She would use the seagrape. She would make the lute back perfect. And when the Bureau manifest next listed Marine Resins as Surplus, she would say nothing. Her knowledge would persist not in their ledgers, not in the echoing hall, but here. In the cured joint. In the resonant wood. In the instrument that would, eventually, sing a truth the system could not hear: that some value is known only in the making, in the material, in the silent, stubborn persistence of the craft itself. It was a communication beyond words, addressed not to the Bureau, but to the future, to the hands that might one day hold the lute and wonder at its enduring voice, a testament to the things that thrived outside the harmonic convergence. The ache remained, but it was joined now by a fierce, quiet resolve. She picked up the next rib, the brush poised. The workshop held its breath.
