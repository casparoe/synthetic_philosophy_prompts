answer: |-
  Here is a scenario designed to meet your specifications, followed by an analysis:

  **Scenario:** At City General Hospital, dialysis slots are allocated overnight by an automated scheduling system (CalendOS v2.1), which prioritizes based on time-of-registration due to a known bug preventing medical urgency weighting. Nurse Triage Officer (NTO) Li arrives for her shift and discovers the system assigned the final emergency slot today to Patient A (stable chronic condition, low-risk wait possible) instead of Patient B (newly admitted, acute toxicity, will die without *today's* session). Both have equal prognosis *if* treated today and no complicating factors. Li can manually override the system *right now* to reassign the slot to B before A arrives, or do nothing, letting A receive the slot and B die. The hospital's explicit NTO protocol states: "NTOs shall verify automated allocations against clinical priority and correct system errors using override authority." Li knows this bug exists but was not involved in creating the system or the protocol.

  **Analysis:**

  1.  **Strict Deontology:** Condemns active redirection as impermissible, permits passive allowance.  
      *   **Why:** Redirecting the slot actively causes Patient A's death (by deprivation). Letting the system run passively merely allows Patient B to die. The physical causal pathway (Li's hand actively reassigning vs. Li's inaction allowing the system to proceed) is morally decisive. The outcome (one death either way) and institutional framing (Li's role, the system error) are irrelevant to the core prohibition against killing. Permitting the active choice violates the duty not to harm directly.
  2.  **Pure Consequentialism:** Treats both options as morally equivalent.  
      *   **Why:** The net outcome is identical: one patient lives, one dies. Prognosis, side effects, and identities are equal. The causal mechanism (active reassignment vs. passive allowance) has no intrinsic moral weight. Morality is determined solely by states of the world. Li should choose based on a fair coin flip or another non-moral tiebreaker (e.g., alphabetical order), as neither option produces a better outcome. Insisting active redirection is worse is irrational "action bias" or "omission bias."
  3.  **Threshold Contractualism about Institutional Omission (Niche Position):** Permits active redirection, condemns passive allowance as impermissible.  
      *   **Why:** Li occupies a designated gatekeeper role with specific duties defined by protocol: to verify allocations and correct system errors. The current allocation is a *non-authoritative default* – it resulted from a flawed automated process, not a legitimate prior human decision or correct application of rules. *Actively* overriding fulfills Li's positive duty inherent in her role. *Passively* allowing the erroneous system default to stand constitutes an *abdication* of her role-based duty to ensure correct allocation. This passive omission crosses a threshold where Li becomes institutionally complicit in the harmful misallocation caused by the defective system. Her inaction makes *her* responsible for the preventable death of B under the hospital's justified expectations for her role.

  **The Crucial Feature & Its Impact:**  
  The reversal hinges on the **combination of Li's designated gatekeeper role with specific positive duties (verify/correct) and the non-authoritative nature of the initial allocation (flawed automated default).** This structure makes passive allowance a culpable omission *within the institutional context* for the threshold view.

  *   **If Removed (Legitimate Prior Decision):** Suppose the slot was assigned to A by a fully informed, competent senior doctor yesterday using correct protocols. Now:
      *   **Deontology:** Unchanged. Redirecting still actively kills A.
      *   **Consequentialism:** Unchanged. Outcomes identical.
      *   **Threshold Contractualism:** *Reversal collapses.* Li's role-duty might now be to *respect* the legitimate prior allocation. Actively overriding could violate procedural integrity or fairness. Passive allowance aligns with respecting the prior legitimate authority. Passive might now be seen as permissible or even required, while active redirection becomes problematic interference.

  **Deontological Counterattack:**  
  A strict deontologist would vigorously reject the threshold view's conclusion. Their attack would focus on:  
  *   **The Primacy of Physical Causation:** They would argue that institutional roles, protocols, and notions of "authoritativeness" cannot dissolve the fundamental physical and moral distinction between *acting* to deprive A (killing) and *failing to act* to save B (letting die). Framing passive allowance as "institutional complicity" or "abdication" is a conceptual sleight-of-hand that doesn't change the underlying causal reality Li confronts. Morality, they insist, is grounded in universal principles (like "don't kill") that transcend institutional contexts. The hospital's protocol demanding Li actively kill A (by deprivation) is simply an *immoral protocol* she must refuse to follow.

  **Literature & Contestedness:**  
  *   **Settled:** The core Doing/Allowing distinction is central to deontology (esp. Kantian & Rossian) and vigorously debated. Consequentialist rejection of its intrinsic moral significance (e.g., Singer, Unger) is a well-established position. The moral relevance of roles/agency in institutions is widely acknowledged but deeply contested *in application*.
  *   **Contested:** Whether institutional roles can *reverse* the moral valence of active vs. passive choices in life/death triage, especially generating a "duty to actively intervene to correct a system error," is **highly contested and not a consensus view.** The "threshold contractualism about institutional omission" framing is a *specific theoretical construct* invented for this case to illustrate how such a reversal *could* be argued; it draws loosely on elements of contractualism (Scanlon), role ethics, and theories of institutional responsibility but represents a niche, arguable position. Deontologists and many others would firmly reject its core claim that institutional context can make passive allowance *worse* than active harm in this context. The case is explicitly engineered to make this niche view distinct.

  **Pedagogical Note:**  
  This case "loads the dice" for the reversal by:
  1.  **Equalizing Outcomes:** Prognosis, side effects, and patient value are stipulated equal, eliminating consequentialist distinctions.
  2.  **Designating Authority & Duty:** Li has explicit, role-based authority/duty to correct *this specific type* of error (non-authoritative default).
  3.  **Isolating the Distinction:** The *only* difference designed to carry moral weight for the reversal is the active/passive choice within this specific institutional context of error-correction duty. The scenario removes common confounders like malice, obviously bad rules, or predictors.
  This clarity is intentional for discussion but means real-world cases are often messier. The core debate between deontological causal primacy and the potential moral transformation by institutional context remains live.
