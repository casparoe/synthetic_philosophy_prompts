  ### Taxonomy of Positions on the Anthropocene  
  **Seminar Handout**  
  *Audience: 15 graduate students*  

  This decision tree categorizes positions on two interlinked questions: (1) whether there is a fact of the matter about the Anthropocene's start date, and (2) who holds authority to formalize it as a geological epoch. Branch nodes pose concrete, answerable claims; leaves specify positions with their most awkward commitment. Niche angles (*diachronic authority* and *predictive power*) are integrated.  

  ---

  #### **Decision Tree**  
  1. **Is there an objective fact about the onset of the Anthropocene?**  
     - **Yes** → Proceed to 2.  
     - **No** → Proceed to 3.  

  2. **Does formal epoch status require a globally synchronous stratigraphic marker?**  
     - **Yes** → Proceed to 4.  
     - **No** → Proceed to 5.  

  3. **Is the Anthropocene concept scientifically useful despite lacking an objective onset?**  
     - **Yes** → **Leaf: Anti-Formalist View**  
       *(Most awkward commitment: Denying a factual basis for the epoch while asserting its utility for science/policy creates tension between instrumentalism and epistemic rigor.)*  
     - **No** → *Unoccupied* (Diagnosis: Incoherent—rejecting both factuality *and* utility voids the term of meaning.)  

  4. **Can a discrete boundary exist without a punctual, globally synchronous event?**  
     - **Yes** → **Leaf: Deep-Time View**  
       *(Most awkward commitment: Demoting millennia of gradual human influence to a discrete "event" misrepresents Earth system processes and stratigraphic conventions.)*  
     - **No** → Proceed to 6.  

  5. **Must authority to ratify the epoch rest solely with contemporary geoscientists?**  
     - **Yes** → *Unoccupied* (Diagnosis: Unexplored—assumes temporal privilege without addressing future-evidence advantages.)  
     - **No** → **Leaf: Democratic-Geoscience View**  
       *(Most awkward commitment: Granting non-specialists equal weight in technical stratigraphic decisions risks undermining geology’s methodological coherence.)*  

  6. **Does epoch designation require predictive power over future stratigraphy, beyond descriptive adequacy?**  
     - **Yes** → **Leaf: Great Acceleration View**  
       *(Most awkward commitment: Prioritizing nuclear markers’ future detectability sidelines earlier, socially significant human impacts like colonialism or industrialization.)*  
     - **No** → **Leaf: Orbis View**  
       *(Most awkward commitment: Treating a subtle 1610 CO₂ dip as an epoch-defining marker inflates a geochemically minor anomaly into a planetary turning point.)  

  ---

  #### **Collapsed Positions & Notes**  
  - **Great Acceleration and Orbis** are separated by Node 6 (*predictive power*), but **Deep-Time and Democratic-Geoscience** share no nodes and are distinct.  
  - **Anti-Formalist and Democratic-Geoscience** partially collapse: Both reject the ICS’s monopoly, but the former denies an objective onset (Node 1), while the latter assumes it (Node 5).  
  - **Niche angles**:  
    - *Diachronic authority* (Node 5) exposes tensions between present expertise and future retrospection.  
    - *Predictive power* (Node 6) distinguishes empirical from prognostic validity.  
  - **Unoccupied combinations**:  
    - *Node 3 "No"*: Empty due to incoherence (renders the Anthropocene vacuous).  
    - *Node 5 "Yes"*: Unexplored, as retrospective classification is rarely debated.  

  ---  
  *Refinement of standard taxonomies via diachronic authority and predictive power criteria emphasizes epistemic legitimacy and temporal scalability in defining geological time.*
