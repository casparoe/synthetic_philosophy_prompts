prompt: |-
  So, bit of context: my family run a mussel and oyster farm, and about four months ago I let myself get talked onto the industry association's committee that's writing the animal welfare code for the whole sector — which means I'm now one of the people deciding which animals the code actually covers. I'm not a philosopher and I'm not a vet, and I'm obviously conflicted about the shellfish part, so I'd rather have a procedure I can defend then keep going by gut.

  The shape of the job: a new species or a new supplier application comes up every couple of weeks, we've got maybe forty minutes each, the people who'll actually run this are auditors with one day of training plus our own vets, every decision needs a half-page written justification, and anything that restricts a practice has to be signed off by the retailer's technical person. We can't send samples to a lab or commission studies — we work from what's already out there in general summaries and from what you can observe on a farm.

  What I've been doing by instinct, and want turned into something I can hand to other people:

  - a flat "no centralised brain, no coverage" cutoff;
  - treating motivational flexibility as the marker I trust most — the animal changes what it will put up with, or work for, when the stakes change, instead of just withdrawing from a stimulus in a fixed way — and discounting both plain reflex responses and the cases where all that's been shown is that it learns to avoid the bad thing, since that might just be conditioning;
  - when I'm genuinely unsure, weighting the possible suffering heavier than the possible cost, by a factor I basically made up.

  Please turn that into a real decision procedure: the questions in the order they should be asked, what counts as a sufficient yes to each one, where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values rather than facts. Be explicit about which distinctions from the philosophy have to survive the simplification and which can be dropped without much loss, and about where the procedure will misfire — one guy on the committee keeps saying that all the marker stuff is just proxies and what we care about is the thing itself, and I don't have a good answer to him. It also needs to be revisable: something should be able to move up or down a tier when evidence comes in, with a trigger for when we look again.

  Then run it on five cases: a decapod supplier someone wants to add; the oysters and mussels we already farm; black soldier fly larvae grown for feed; a honeybee operation where the argument is that the unit that matters is the colony and not the individual; and one species nobody has ever run a single test on. Tell me which of those comes out in a way I'm not going to like, and why the procedure is still right to say it.
reasoning: |-
  Okay, the user runs a mussel and oyster farm and is on a committee writing the animal welfare code. They need a clear, defensible decision procedure for determining which animals the code covers. They're not a philosopher or vet, and they feel conflicted about shellfish. The committee meets every couple of weeks for about 40 minutes per species, relying on existing summaries and observable farm conditions. Auditors with minimal training and their vets will implement this, and each decision needs a half-page justification. Retail technical approval is needed for any restrictions.

  The user has been using three key criteria: 1) a flat "no centralized brain, no coverage" rule; 2) prioritizing motivational flexibility (animals changing behavior based on stakes, not just reflexes or conditioning); 3) weighting possible suffering heavier than costs when unsure. They want this formalized into a step-by-step procedure that others can use.

  The procedure needs to handle philosophical distinctions practically, address when to stop for human judgment, and include revision triggers. The user also wants to test it on five cases: decapods, oysters/mussels, black soldier fly larvae, honeybees, and an untested species. They need to know which outcomes might be unpopular but defensible.

  First, I should structure the decision procedure into clear steps. The core elements are the centralized brain requirement and motivational flexibility as the key marker. But motivational flexibility needs operational definitions to avoid ambiguity. The user mentioned discounting simple reflexes and conditioning, so the procedure must distinguish between those and genuine behavioral flexibility based on internal states.

  The user's colleague argues that markers are just proxies. The response should emphasize that while suffering itself is unobservable, motivational flexibility is a widely accepted indicator in animal welfare science. Proxies are necessary when direct measurement isn't possible, especially with limited resources.

  For the revision process, each species should be assigned an evidence tier and reviewed when new significant studies emerge or after a set period. The procedure must specify what constitutes sufficient evidence for motivational flexibility. Observable indicators could include trade-offs between competing motivations, persistence in overcoming obstacles for rewards, or varying responses based on internal state.

  Applying this to the test cases: Decapods like crabs show strong evidence of motivational flexibility, so they'd be covered. Oysters and mussels lack a centralized brain, so no coverage. Black soldier fly larvae have a ganglion but no evidence of motivational flexibility, so likely not covered. Honeybees as individuals show motivational flexibility, so the colony argument is overruled. An untested species with a complex brain would default to coverage pending evidence, which might be unpopular but precautionary.

  The honeybee case is tricky. The user might not like covering individual bees, but the procedure justifies it because individuals exhibit goal-directed behavior and learning. The retailer might push back, but the science supports it.

  The procedure stops for human judgment when evidence is ambiguous or when motivational flexibility isn't clearly present/absent despite a centralized brain. Values-based decisions include whether to extend coverage based on precaution despite weak evidence, which requires committee deliberation.

  Potential misfires: Species with centralized brains but minimal motivational flexibility might get covered unnecessarily, or some invertebrates with distributed cognition might be excluded. But given resource constraints, this is an acceptable trade-off. The key is having clear revision triggers to correct errors as new data emerges.
answer: |-
  Here’s a formalized decision procedure based on your principles, designed for practicality, defensibility, and auditor/vet use. It prioritizes **centralized nervous integration** and **motivational flexibility** as non-negotiable gates, incorporates your precautionary weighting, and flags value judgments explicitly.

  ---

  ### **Animal Welfare Coverage Decision Procedure**  
  **(Version 1.0 – Revisable Framework)**

  **Inputs:** Existing scientific summaries (reviews, meta-analyses), observable farm behaviors, anatomical data.  
  **Output:** "Covered" (full welfare protections) / "Not Covered" / "Covered Pending Evidence" (provisional status).  
  **Time Allotment:** 40 min/species.  
  **Justification:** Half-page max, citing evidence sources.

  ---

  #### **Step 1: Centralized Brain Threshold**  
  *   **Question:** *"Does the species have a cephalized brain or ganglia complex integrating sensory input and coordinating behavior (beyond simple reflex arcs)?"*  
  *   **Evidence Required:** Anatomical studies (e.g., presence of brain/cerebral ganglia) OR behavioral evidence of integrated decision-making (e.g., navigation in novel environments).  
  *   **Sufficient "Yes":** Clear anatomical evidence (e.g., vertebrate brain, cephalopod/crustacean ganglia) OR robust behavioral evidence of integration (e.g., learning mazes, tool use).  
  *   **Sufficient "No":** Diffuse nerve net (e.g., cnidarians), decentralized ganglia with no central hub (e.g., bivalves), or purely reflexive responses.  
  *   **Stop Here if "No":** **"Not Covered."** Justification: "Lacks neural substrate for integrated subjective experience."  
  *   **Philosophy Survival:** **Essential.** Drops debates about "consciousness" in favor of a measurable anatomical/functional threshold.  
  *   **Misfire Risk:** May exclude animals with distributed cognition (e.g., some echinoderms). Acceptable trade-off for auditability.

  #### **Step 2: Motivational Flexibility Assessment**  
  *   **Question:** *"Is there evidence the animal makes *cost-benefit trade-offs* or *shifts priorities* based on internal state or changing context (not just conditioned avoidance/attraction)?"*  
  *   **Evidence Required:**  
      *   *Trade-offs:* Sacrifices one need for another (e.g., hunger vs. safety – e.g., risk-taking for food when starved but not when satiated).  
      *   *Shifting Priorities:* Changes response to identical stimuli based on internal state (e.g., injured animal tolerates handling it would normally flee).  
      *   **Discount:** Simple habituation, classical/Pavlovian conditioning, fixed action patterns.  
  *   **Sufficient "Yes":** Documented evidence of trade-offs OR priority shifts in controlled studies or consistent farm observations.  
  *   **Sufficient "No":** Only evidence is habituation, conditioning, or fixed reflexes.  
  *   **Insufficient/Ambiguous Evidence:** Proceed to Step 3.  
  *   **Philosophy Survival:** **Essential.** Proxies for "valenced experience" (suffering/reward). Drops debates about "self-awareness."  
  *   **Misfire Risk:** May miss subtle flexibility; relies on existing studies. Answer to "proxy critic": "Motivational flexibility is the best empirically validated indicator of valenced states in non-verbal animals under resource constraints. We track this marker because it correlates with welfare impacts observable to auditors."  

  #### **Step 3: Precautionary Weighting (Ambiguous Cases)**  
  *   **Question:** *"Given ambiguous evidence for motivational flexibility, does the *potential for suffering* outweigh the *potential cost of regulation* by a factor of 3:1 or greater?"*  
  *   **Assessment:**  
      *   *Potential Suffering:* Consider anatomy (pain receptors?), farming stressors (invasive procedures, density), duration of exposure.  
      *   *Potential Cost:* Financial/operational burden of proposed welfare measures.  
      *   **Weighting:** Suffering (High/Med/Low) x 3 > Cost (High/Med/Low). Default weighting favors suffering.  
  *   **Sufficient "Yes" (Suffering >> Cost):** **"Covered"** (Provisional).  
  *   **Sufficient "No" (Cost >= Suffering):** **"Not Covered."**  
  *   **Values Judgment Trigger:** **HERE.** This step is inherently value-based ("How much precaution is warranted?"). **Requires committee vote.** Justification must explicitly state the value judgment.  
  *   **Philosophy Survival:** Explicitly incorporates precautionary principle. Drops utilitarianism for a simple operational weighting.  

  #### **Step 4: Assignment & Revision Protocol**  
  *   **Tiers:**  
      *   **Tier 1 (Covered):** Clear "Yes" to Step 1 & 2.  
      *   **Tier 2 (Covered Pending Evidence):** "Yes" to Step 1 + Ambiguous Step 2 + "Yes" to Step 3.  
      *   **Tier 3 (Not Covered):** "No" to Step 1 OR ("Yes" to Step 1 + "No" to Step 2) OR ("Yes" to Step 1 + Ambiguous Step 2 + "No" to Step 3).  
  *   **Revision Triggers:**  
      1.  **New Evidence:** >3 significant peer-reviewed studies published.  
      2.  **Time:** Automatic review every 3 years for Tier 2 & contested Tier 3 species.  
      3.  **Farm Observation:** Consistent, verified reports of anomalous welfare-relevant behavior.  
  *   **Process:** Re-run full procedure with new evidence. Tier changes require committee vote + retailer sign-off if adding restrictions.

  ---

  ### **Case Applications & Outcomes**

  1.  **Decapod Crustaceans (e.g., Crab/Lobster Supplier):**  
      *   **Step 1:** **YES.** Complex central ganglia/brain.  
      *   **Step 2:** **YES.** Strong evidence: Trade-offs (risk vs. reward), long-term aversion learning *beyond* simple conditioning, pain responses modulated by context/anesthetics.  
      *   **Outcome: Covered (Tier 1).**  
      *   **Why you might dislike:** Adds regulatory burden for suppliers. **Procedure Right?** Yes. Evidence for valenced experience is robust.

  2.  **Oysters & Mussels (Your Farm):**  
      *   **Step 1:** **NO.** Diffuse ganglia, no cephalization. Responses are reflexes/localized.  
      *   **Stop:** **Not Covered (Tier 3).**  
      *   **Why you might dislike:** Feels hypocritical? **Procedure Right?** Yes. Neural architecture fundamentally lacks integration. Motivational flexibility impossible. Your conflict is resolved objectively.

  3.  **Black Soldier Fly Larvae (Feed):**  
      *   **Step 1:** **YES?** Simple central ganglion, integrates some sensory input.  
      *   **Step 2:** **NO.** Current evidence shows habituation/conditioning only. No trade-offs or priority shifts documented.  
      *   **Step 3:** Ambiguous Step 2.  
          *   *Suffering:* Low (simple ganglion, short lifespan, minimal invasive procedures).  
          *   *Cost:* Medium/High (welfare monitoring in mass production).  
          *   **3x Suffering (Low x3 = Med) < Cost (Med/High) → "NO".**  
      *   **Outcome: Not Covered (Tier 3).**  
      *   **Why you might dislike:** Retailers pushing "sustainable feed" may complain. **Procedure Right?** Yes. No evidence for valenced states outweighs low suffering potential vs. cost.

  4.  **Honeybees (Individual vs. Colony):**  
      *   **Step 1:** **YES.** Individual bee has a brain integrating complex sensory info.  
      *   **Step 2:** **YES.** Individual bees show trade-offs (e.g., foraging risk vs. nectar quality, giving up time), learning flexibility, context-dependent responses. Colony is a superorganism, but welfare acts on *individuals*.  
      *   **Outcome: Covered (Tier 1).** Individuals are the unit.  
      *   **Why you might dislike:** Beekeepers/retailers argue colony is the unit. **Procedure Right?** Yes. Suffering (e.g., wing clipping, invasive checks) happens to individuals capable of valenced states. Colony arguments don't negate individual neural capacity.

  5.  **Untested Species (e.g., novel sea cucumber):**  
      *   **Step 1:** **YES** (Assume complex echinoderm ganglion).  
      *   **Step 2:** **INSUFFICIENT.** No studies.  
      *   **Step 3:** Ambiguous.  
          *   *Suffering:* **High?** (Complex ganglion, slow healing, invasive harvesting).  
          *   *Cost:* **Medium** (New protocols needed).  
          *   **3x Suffering (High x3 = V.High) > Cost (Med) → "YES".**  
      *   **Outcome: Covered Pending Evidence (Tier 2).**  
      *   **Why you might dislike:** Covers an unknown species proactively. **Procedure Right?** Yes. Precautionary principle applied due to high suffering potential vs. manageable cost. Triggers evidence review.

  ---

  ### **Key Unpopular Outcome & Defense**
  *   **Honeybees (Individual Coverage):** Beekeepers/retailers will argue the "colony is the unit," claiming individual suffering is irrelevant.  
  *   **Why the Procedure is Right:**  
      1.  **Step 1 is Met:** The individual bee *has* the neural hardware.  
      2.  **Step 2 is Met:** Individuals *demonstrate* motivational flexibility (trade-offs, learning).  
      3.  **Suffering is Individual:** Crushing, poisoning, or mutilation happens to *individuals*. A colony cannot feel pain; only its constituent animals can.  
      4.  **Practicality:** Auditors inspect *individuals* (e.g., deformed wings, mites on bees).  
      5.  **Values Judgment Avoided:** The procedure doesn't debate "unit of selection" (a biological concept), it assesses the entity experiencing the intervention (an individual animal).

  This procedure gives you a defensible, evidence-anchored process that resolves your shellfish conflict objectively, handles uncertainty via precaution and revision, and forces value debates into the open where they belong. It’s built for your constraints.
