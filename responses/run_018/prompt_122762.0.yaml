answer: |-
  ### Taxonomy of Pleasure: Heterogeneity Problem Branching Tree  
  *Four binary tests sort views on what unifies diverse "pleasures." Each leaf position handles four cases: (A) scratching an unwanted itch, (B) absorbed problem-solving, (C) laughing at a cruel joke later repudiated, (D) comparing hot-bath pleasure to proof-completion pleasure.*

  ---

  #### **Branch Nodes & Tests**  
  1. **Grafting Test (GT):** *Can pleasantness detach from an experience’s phenomenal character and attach to a different character without altering that character?*  
     - Yes: Pleasantness is separable.  
     - No: Pleasantness is intrinsic to the experience.  

  2. **Absorption Test (AT):** *Can an episode be pleasant if you were fully absorbed (no salient feeling of pleasure) at the time?*  
     - Yes: Pleasantness doesn’t require a concurrent felt quality.  
     - No: Pleasantness requires a distinctive concurrent feeling.  

  3. **Repudiation Test (RT):** *Can an episode be pleasant if the subject, fully informed and reflective, denies it was pleasant or good for them?*  
     - Yes: Pleasantness is independent of retrospective endorsement.  
     - No: Pleasantness depends on reflective endorsement.  

  4. **Exchange Test (ET):** *Must any two pleasant episodes be commensurable in pleasantness (tradeable as "more/less pleasant")?*  
     - Yes: Pleasantness is uniformly quantifiable.  
     - No: Pleasantness is plural or incommensurable.  

  ---

  #### **Live Combinations & Positions**  
  *(GT/AT/RT/ET = Answers to Tests 1–4)*  

  | Path (Y/N) | Position                       | Awkward Commitment                                  | Handles Cases (A/B/C/D)                                                                 |
  |------------|--------------------------------|-----------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Y-Y-Y-Y**| **Desire-Based Monism**        | Pleasure in pain (e.g., masochism) counts as genuine pleasure. | A: Pleasant if desired; B: Pleasant if fulfilling desire; C: Pleasant despite repudiation; D: Commensurable via desire strength. |
  | **Y-Y-Y-N**| **Attitudinal Pluralism**      | Repudiated pleasures (e.g., addiction) remain good *while experienced*. | A/B/C: Pleasant if pro-attitude held *during* episode; D: Incommensurable attitudes. |
  | **Y-Y-N-Y**| *Incoherent* (Cannot deny reflective endorsement while requiring commensurability) | — | — |
  | **Y-Y-N-N**| **Non-Endorsed Attitudinalism** | Pleasures actively disavowed as harmful still contribute to well-being. | C: Repudiated laughter was pleasant; D: Incommensurable. |
  | **Y-N-Y-Y**| *Unoccupied* (Why separable pleasantness requires felt quality if absorption impossible?) | *Diagnosis: Unattractive—separability + absorption-incompatibility undermines motivation for detachability.* | — |
  | **Y-N-Y-N**| **Felt-Tone Adverbialism**     | Scratching an itch has a distinct "pleasure-layer" but can’t be enjoyed absorption-free. | B: *Fails*—absorption excludes concurrent feeling; A/C/D: Pleasantness as non-separable qualitative modifier. |
  | **Y-N-N-Y**| *Incoherent* (Repudiation denial + absorption denial + separability conflicts) | — | — |
  | **Y-N-N-N**| *Unoccupied* | *Diagnosis: Unexplored—no clear motivation for separable-but-nonfelt-nonendorsed-incommensurable pleasure.* | — |
  | **N-Y-Y-Y**| **Functional-Role Monism**     | Hot baths and proof-solving share identical causal roles (e.g., motivation reinforcement). | A/B/C: Pleasant if reinforcing; D: Commensurable via reinforcement strength. |
  | **N-Y-Y-N**| **Pluralist Functionalism**    | Different reinforcing states need no common phenomenology or comparability. | A/B/C/D: All pleasant via diverse functional roles; D: Incommensurable. |
  | **N-Y-N-Y**| *Incoherent* (Intrinsic pleasantness cannot defy reflective endorsement while being uniform). | — | — |
  | **N-Y-N-N**| **Endorsement-Dependent Pluralism** | Unreflective pleasures (e.g., children’s joys) aren’t genuinely pleasant until endorsed. | C: Repudiated joke was *not* pleasant; B: Only pleasant if retrospectively endorsed. |
  | **N-N-Y-Y**| **Felt-Quality Monism**        | Absorption cases (e.g., flow states) cannot be pleasant. | B: *Fails*—no salient feeling during absorption; A/C/D: Uniform hedonic tone. |
  | **N-N-Y-N**| **Phenomenal Pluralism**       | Incommensurable felt qualities (e.g., "warmth" vs. "eureka") all count as pleasure. | A: Distinct itch-relief quality; B: *Fails*; D: Incommensurable feelings. |
  | **N-N-N-Y**| **Reflective Hedonism**        | Only endorsed, felt pleasures are real and comparable—excludes fleeting/unnoticed joys. | B/C: *Fail*—absorption excludes feeling; repudiation denies pleasure. |
  | **N-N-N-N**| **Eliminativism**              | "Pleasure" isn’t a unified kind; heterogeneity implies no common property. | A/B/C/D: None are "pleasures" in a unified sense; vernacular mislabels disparate states. |

  ---

  #### **Undifferentiated Pairs & Further Test**  
  - **Attitudinal Pluralism (Y-Y-Y-N)** vs. **Non-Endorsed Attitudinalism (Y-Y-N-N)** both hold that pro-attitudes during an experience suffice for pleasure, regardless of absorption.  
    - *Prising Question: Must the pro-attitude be *conscious* at the time of experience?*  
      - Yes: Favors Non-Endorsed Attitudinalism (avoids unconscious "pleasures").  
      - No: Favors Attitudinal Pluralism (allows subconscious attitudes).  

  - **Pluralist Functionalism (N-Y-Y-N)** vs. **Endorsement-Dependent Pluralism (N-Y-N-N)** both reject commensurability and intrinsic phenomenology.  
    - *Prising Question: Can an episode be pleasant *before* any functional consequences (e.g., reinforcement) occur?*  
      - Yes: Favors Pluralist Functionalism (pleasure as immediate causal role).  
      - No: Favors Endorsement-Dependent Pluralism (pleasure depends on downstream reflection).  

  ---

  #### **Structural Summary**  
  - **Occupied Leaves:** 8 (including Eliminativism).  
  - **Empty Cells:** 4 (2 incoherent, 1 unattractive, 1 unexplored).  
  - **Key Tradeoffs:**  
    - Separability (GT-Y) eases commensurability but struggles with absorption/repudiation.  
    - Intrinsic views (GT-N) handle felt unity but falter with absorption or repudiation.  
    - Eliminativism (N-N-N-N) avoids all constraints but denies intuitive unity.  

  *This taxonomy isolates commitments: e.g., Felt-Quality Monism denies absorbed pleasures, while Attitudinal views permit repudiated pleasures. Case D (bath vs. proof) splits monist vs. pluralist/comparabilist views.*
