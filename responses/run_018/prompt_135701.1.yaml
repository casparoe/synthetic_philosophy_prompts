  please dont ask me to cite secondary sources or build a bibliography; half the people in my group are grad students who haven't read past GEB itself. and since my laptop keyboard is broken i keep typing "Godelian" without the umlaut, so if you refer to the analogy just use that spelling. i need about eight to ten branch nodes total, and the questions should be phrased so someone can answer them just from thinking about formal systems and consciousness, not from knowing the literature.
