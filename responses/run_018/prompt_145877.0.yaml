prompt: |-
  As a high school student working through an advanced independent study in decision theory, I have been examining situations in which expected utility is undefined rather than merely infinite—particularly the structural failure that arises in the Pasadena paradox, where discontinuities in the payoff function prevent the expectation from being assigned any value, positive or negative. I would like you to construct, from first principles, an example of a conceptual issue in this family: design a decision scenario set in a continuous parameter space in which an agent selects a real-valued threshold, and the payoff rule contains a singularity that is approached differently depending on whether the agent’s choice lies just above or just below that threshold. Structure the payoffs so that both the positive and negative contribution integrals diverge symmetrically, yielding an expectation that is genuinely indeterminate rather than unbounded in one direction. Then explain precisely why this failure is one of non-existence—why there is no well-defined expectation to maximize—rather than a practical problem of risk aversion or bounded computation. In your explanation, identify the point at which standard decision rules such as maximin and maximax must substitute for expectation-based reasoning, and clarify what this reveals about the limits of expected-utility theory when it encounters discontinuous structures that do not resolve into a single infinite limit.
reasoning: |-
  We are going to design a decision scenario in which an agent chooses a real-valued threshold, and the payoff function has a singularity at that threshold. We want the expectation of the payoff to be undefined because the positive and negative parts of the integral both diverge.

  Here is the setup:

  **The Scenario:** 
  An agent chooses a threshold θ in the real numbers (say in the interval [0, 1] for concreteness). The state of the world is represented by a continuous random variable X, which we assume to be uniformly distributed on [0,1]. The payoff depends on whether X is above or below θ, and it also depends on the distance from X to θ. Specifically, we introduce a singularity at θ.

  Define the payoff function as:

    U(X, θ) = 
      { 1/(θ - X)^2   if X < θ,
        -1/(X - θ)^2  if X > θ,
        0              if X = θ }

  However, note that this function has a problem: the magnitude of the payoff grows without bound as X approaches θ from either side, but the sign changes. Moreover, the integrals on either side of θ will both diverge when we try to compute the expected utility.

  To see this, let's compute the expected utility for a fixed θ in (0,1):

    E[U] = ∫_{0}^{θ} (1/(θ - x)^2) * f_X(x) dx + ∫_{θ}^{1} (-1/(x - θ)^2) * f_X(x) dx

  Since X is uniform on [0,1], f_X(x)=1 for x in [0,1]. Then:

    E[U] = ∫_{0}^{θ} (1/(θ - x)^2) dx + ∫_{θ}^{1} (-1/(x - θ)^2) dx

  Now, let's compute each integral separately.

  First integral (from 0 to θ):

    Let u = θ - x, then du = -dx, and when x=0, u=θ; when x=θ, u=0.
    So, ∫_{0}^{θ} (1/(θ - x)^2) dx = ∫_{θ}^{0} (1/u^2) (-du) = ∫_{0}^{θ} (1/u^2) du = [ -1/u ]_{0}^{θ} = -1/θ + lim_{u→0+} 1/u → +∞

  Second integral (from θ to 1):

    Let v = x - θ, then dv = dx, and when x=θ, v=0; when x=1, v=1-θ.
    So, ∫_{θ}^{1} (-1/(x - θ)^2) dx = - ∫_{0}^{1-θ} (1/v^2) dv = - [ -1/v ]_{0}^{1-θ} = - [ -1/(1-θ) + lim_{v→0+} 1/v ] = - [ -1/(1-θ) + ∞ ] → -∞

  Therefore, we have:

    E[U] = (+∞) + (-∞)

  This is an indeterminate form. We cannot assign a value to this expression. It is not that the expectation is infinite (either positive or negative) but that it is undefined.

  **Why is this a problem of non-existence?**
  The expected utility is the integral of the utility function with respect to the probability measure. In this case, the integral of the positive part of the utility function (which is the part for X<θ) is +∞, and the integral of the negative part (for X>θ) is -∞. The standard definition of the Lebesgue integral requires that at least one of these (the positive or negative part) be finite. If both are infinite, the integral is not defined. Hence, the expected utility does not exist.

  **Why is this not a problem of risk aversion or bounded computation?**
  - Risk aversion: Risk aversion would be relevant if we had a well-defined distribution of outcomes and the agent had a concave utility function. Here, the problem is that the expected utility is undefined. Even a risk-neutral agent (with linear utility) would face the same issue because the integral doesn't converge.
  - Bounded computation: The issue is not that we cannot compute the expectation due to computational limitations, but that the mathematical object (the integral) does not exist. Even with infinite computational power, we could not assign a value.

  **How do standard decision rules substitute for expectation-based reasoning?**
  When the expected utility is undefined, we must turn to alternative decision rules. Two common ones are:
  1. **Maximin rule**: Choose the alternative whose worst possible outcome is the least bad. In this scenario, note that for any fixed θ, as X approaches θ from below, the payoff goes to +∞, and from above, it goes to -∞. However, the worst outcome is -∞ (which occurs when X>θ and is very close to θ). But note that for every θ, the worst outcome is -∞. So maximin would not be able to distinguish between any θ.
  2. **Maximax rule**: Choose the alternative whose best possible outcome is the best. Similarly, the best outcome for each θ is +∞ (when X approaches θ from below). So maximax would also not be able to distinguish.

  Thus, these rules break down in this scenario. Another rule that might be considered is the **minimax regret**. However, in the face of unbounded payoffs (both positive and negative), regret might also be unbounded.

  This situation reveals that expected-utility theory is fundamentally limited when the utility function is not integrable (in the Lebesgue sense) with respect to the probability measure. In particular, when the utility function has a singularity that causes the positive and negative parts to both diverge, the expectation does not exist. We are then forced to consider alternative approaches, such as:
  - Regularization: introducing a small cutoff to remove the singularity and then taking a limit, but note that the limit might not exist or might depend on the way we take the cutoff.
  - Using a different notion of integration (like the Cauchy principal value). For our example, the Cauchy principal value would be:

    P.V. ∫_{0}^{1} U(x,θ) dx = lim_{ε→0+} [ ∫_{0}^{θ-ε} 1/(θ-x)^2 dx + ∫_{θ+ε}^{1} -1/(x-θ)^2 dx ]

  But let's compute:

    First integral from 0 to θ-ε: as before, it is [ -1/(θ-x) ]_{0}^{θ-ε} = -1/ε + 1/θ
    Second integral from θ+ε to 1: [ 1/(x-θ) ]_{θ+ε}^{1} = 1/(1-θ) - 1/ε

  So together:

    [ -1/ε + 1/θ ] + [ 1/(1-θ) - 1/ε ] = -2/ε + 1/θ + 1/(1-θ)

  As ε→0, this goes to -∞. However, note that this is not the expected utility but the principal value. But the principal value is not the same as the Lebesgue integral. Moreover, it diverges to -∞, which might suggest that the decision is bad, but this is an artifact of the principal value. Also, note that the principal value does not capture the symmetric divergence because the two sides are not symmetric in the Lebesgue sense (the positive part and the negative part both diverge at the same rate in the neighborhood of θ, but the principal value calculation above shows that the two divergent parts combine to -2/ε, which is negative and diverges). However, in our case, the two integrals individually diverge as 1/ε, but the principal value approach forces a symmetric limit. But note that the positive part and the negative part are of the same order, so they don't cancel. They add in the same negative direction? Actually, the negative part is in the second integral and it is negative of a divergent positive term? Let me recast:

  In the principal value, we have:

    ∫_{0}^{θ-ε} 1/(θ-x)^2 dx = [from 0 to θ-ε] = [ -1/(θ-x) ]_0^{θ-ε} = -1/ε + 1/θ

  and

    ∫_{θ+ε}^{1} -1/(x-θ)^2 dx = [ 1/(x-θ) ]_{θ+ε}^{1} = 1/(1-θ) - 1/ε

  So total = (-1/ε + 1/θ) + (1/(1-θ) - 1/ε) = -2/ε + 1/θ + 1/(1-θ)

  Thus, the principal value diverges to -∞. But note that this is a particular way of taking the limit. The Lebesgue integral does not exist because the positive and negative parts are both infinite. The principal value might be used as a substitute, but it is important to note that it is not the expected utility and it might not reflect the true nature of the problem. In fact, if we take a non-symmetric approach (e.g., letting the left and right cutoffs go to zero at different rates), we might get any real number or even ±∞.

  **What this reveals about the limits of expected-utility theory:**
  This example highlights that expected-utility theory relies on the integrability of the utility function. When the utility function is not integrable (in the Lebesgue sense) because of a singularity that causes the positive and negative parts to both diverge, the theory breaks down. The problem is not that we get an infinite expected utility (which might be handled by extended real numbers) but that the integral is simply undefined. This forces us to recognize that expected utility is not universally applicable. In such cases, we must either reformulate the problem (e.g., by bounding the utility function) or use a different decision framework that can handle such indeterminacies, but as we saw, standard alternatives like maximin and maximax also break down. This reveals a fundamental challenge in decision theory when dealing with discontinuous or singular structures that do not resolve to a single infinite limit.
answer: |-
  ### Constructed Decision Scenario: Singular Threshold Choice

  **Scenario Setup:**  
  An agent selects a threshold \(\theta \in [0, 1]\). The state of the world \(x\) is drawn from a uniform distribution on \([0, 1]\). The payoff function \(U(x, \theta)\) is defined as:  
  \[
  U(x, \theta) = 
  \begin{cases} 
  \dfrac{1}{(\theta - x)^2} & \text{if } x < \theta \\
  -\dfrac{1}{(x - \theta)^2} & \text{if } x > \theta \\
  0 & \text{if } x = \theta 
  \end{cases}
  \]  
  This function exhibits a **singularity** at \(x = \theta\), where the payoff diverges to \(+\infty\) as \(x\) approaches \(\theta\) from below and to \(-\infty\) as \(x\) approaches \(\theta\) from above.

  ---

  ### Indeterminate Expected Utility  
  The expected utility for a fixed \(\theta\) is:  
  \[
  \mathbb{E}[U] = \int_0^1 U(x, \theta)  dx = \int_0^\theta \frac{1}{(\theta - x)^2}  dx + \int_\theta^1 -\frac{1}{(x - \theta)^2}  dx.
  \]  

  #### Step 1: Divergence of the positive part (\(x < \theta\)):  
  \[
  \int_0^\theta \frac{1}{(\theta - x)^2}  dx.
  \]  
  Substitute \(u = \theta - x\), \(du = -dx\):  
  \[
  = \int_\theta^0 \frac{1}{u^2} (-du) = \int_0^\theta u^{-2}  du = \left[ -\frac{1}{u} \right]_0^\theta = -\frac{1}{\theta} + \lim_{u \to 0^+} \frac{1}{u} = +\infty.
  \]  

  #### Step 2: Divergence of the negative part (\(x > \theta\)):  
  \[
  \int_\theta^1 -\frac{1}{(x - \theta)^2}  dx.
  \]  
  Substitute \(v = x - \theta\), \(dv = dx\):  
  \[
  = -\int_0^{1-\theta} v^{-2}  dv = -\left[ -\frac{1}{v} \right]_0^{1-\theta} = -\left( -\frac{1}{1-\theta} + \lim_{v \to 0^+} \frac{1}{v} \right) = -\infty.
  \]  

  #### Result:  
  \(\mathbb{E}[U] = (+\infty) + (-\infty)\) is **indeterminate**. The integrals for the positive and negative parts diverge symmetrically, and the expectation is undefined—not infinite in a single direction.

  ---

  ### Why This is a Failure of Non-Existence  
  The issue is **mathematical non-existence**, not practical limitations:  
  1. **Lebesgue integrability failure**:  
     The utility function \(U(x, \theta)\) is not Lebesgue integrable because both its positive part \(U^+ = \max(U, 0)\) and negative part \(U^- = \max(-U, 0)\) have infinite integrals:  
     \[
     \int U^+  dx = +\infty, \quad \int U^-  dx = +\infty.
     \]  
     By the definition of the Lebesgue integral, \(\mathbb{E}[U]\) exists only if at least one of these integrals is finite. Here, neither is, so \(\mathbb{E}[U]\) **does not exist as a mathematical object**.  

  2. **Independence from risk attitudes or computation**:  
     - A risk-neutral agent still faces an undefined expectation.  
     - Even with unbounded computational resources, no real number, \(+\infty\), or \(-\infty\) can be assigned to \(\mathbb{E}[U]\).  
     - The problem persists regardless of risk aversion coefficients or utility transformations.  

  ---

  ### Breakdown of Standard Decision Rules  
  When \(\mathbb{E}[U]\) is undefined, agents must resort to **non-expectation criteria**:  
  1. **Maximin (pessimism)**:  
     Minimize the worst-case loss. For any \(\theta\), \(\inf_{x} U(x, \theta) = -\infty\) (since \(U \to -\infty\) as \(x \to \theta^+\)). All thresholds are equally bad (\(\inf = -\infty\)), so maximin **fails to discriminate**.  

  2. **Maximax (optimism)**:  
     Maximize the best-case gain. For any \(\theta\), \(\sup_{x} U(x, \theta) = +\infty\) (since \(U \to +\infty\) as \(x \to \theta^-\)). All thresholds are equally good (\(\sup = +\infty\)), so maximax **also fails**.  

  **Implication**:  
  These rules collapse into indifference or incoherence, revealing that they are inadequate substitutes for expectation-based reasoning in pathological cases.  

  ---

  ### Limits of Expected-Utility Theory  
  This example exposes two fundamental limitations:  
  1. **Dependence on integrability**:  
     Expected-utility theory assumes \(U\) is integrable over the state space. Discontinuities that cause symmetric divergence violate this core requirement.  

  2. **Non-robustness to singularity structures**:  
     The theory cannot handle singularities where:  
     - The payoff is discontinuous at a measure-zero point.  
     - Limits from above/below diverge asymmetrically (e.g., Pasadena paradox) or **symmetrically** (as here).  
     - No "dominant" infinite limit exists to resolve the expectation.  

  **Conclusion**:  
  When utilities have singularities inducing symmetric divergence, expected utility **ceases to be a well-defined concept**. This is a failure of the theory’s mathematical foundations—not a shortcoming of agents or instruments. It underscores that expected utility is a *conditional* tool, valid only when the utility function is integrable. In such cases, decision theory must either:  
  - Reformulate the problem (e.g., bound utilities to force integrability).  
  - Adopt non-expectation criteria (though they often fail, as shown).  
  This reveals a boundary beyond which standard decision theory cannot operate.
