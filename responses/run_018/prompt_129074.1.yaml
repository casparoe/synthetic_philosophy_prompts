prompt: |-
  Look, I've been teaching this course on scale and story—basically big history and its discontents—and I'm trying to figure out where to send my best grad student. The standard debates are exhausted: Harari's cognitive revolution thesis, Diamond's geographic determinism, Graeber and Wengrow's pushback on the inevitability of hierarchy. Everyone knows those moves. But I've been thinking about a problem that doesn't get named enough: there's this resolution mismatch between the kind of evidence archaeologists actually have—localized, fragmentary, often contradictory—and the sweeping causal claims these narratives make about human nature or institutional development. So here's my actual question: if you're advising a small research group with maybe four years and no lab budget, just conceptual and historical work, which open questions in this space are actually upstream?

  I'm specifically wondering whether the field needs a kind of middle-range theory for scaling up from site-level data to macro-historical patterns, or whether that's a dead end and we should instead be working on the normative implications—like, does debunking the agricultural revolution as progress narrative actually change how we think about present-day inequality, or is that just rhetorical? I want a defended agenda: rank the live problems, tell me which ones depend on solving others first, which are tractible for someone trained in philosophy of history rather than field archaeology, and flag the one that sounds important but is probably overrated. Don't give me a reading list—just tell me where the years should go and why.
reasoning: |-
  Okay, let me unpack this query. The user is a professor running a "scale and story" course focused on big history critiques, seeking research direction for their top grad student. They're clearly frustrated with recycled debates (Harari, Diamond, Graeber-Wengrow) and zeroed in on a core methodological gap: the mismatch between fragmented archaeological evidence and grand historical narratives.

  Hmm... their real tension seems twofold: 
  First, a practical dilemma—should the team focus on building "middle-range theory" to bridge micro-macro scales, or pivot to normative implications of debunking progress narratives? 
  Second, a constraints-aware ask: 4 years, no lab budget, philosophy-of-history training. They want strategic priorities, not just ideas.

  *scratches head* The resolution mismatch problem feels urgent. Every critique of big history (agricultural revolution myths, hierarchy inevitability) stumbles when you ask "But what *does* the site-level data actually support?" Archaeologists have known this since Binford's 1970s middle-range theory debates, but those were about linking static artifacts to dynamic behaviors—not artifacts to civilizational trajectories. Maybe that's the key gap?

  *checks notes* Right, the user mentioned two paths. Path A (middle-range theory for scale) seems upstream because: 
  - Without better scaling methods, all macro-narratives remain speculative (whether mainstream or revisionist) 
  - It enables testing claims like "monument building requires hierarchy" against actual site clusters 
  - Fits the team's conceptual skills—no excavation needed, just rigorous pattern mapping 

  But *winces* it's risky. Attempts like Turchin's Seshat project got criticized for data quality. Still... maybe a more focused approach? Instead of universal theories, develop scaling heuristics for specific transitions (e.g., "when do storage pits imply surplus accumulation?").

  Path B (normative implications) feels downstream. Debunking agricultural revolution narratives *should* impact inequality discourse, but without credible alternatives from Path A, activists just swap one just-so story for another. Example: Graeber/Wengrow's playful egalitarianism is inspiring, but if you can't show *how* non-hierarchical societies scaled, policy proposals lack roots. 

  *stares at ceiling* Overrated alert: "Finding the next big narrative." The field doesn't need another Diamond; it needs tools to discipline storytelling. Also tractability trap—assembling cross-regional datasets eats years. Better to pick one scaling puzzle (e.g., ritual intensity as hierarchy proxy) and go deep. 

  Final ranking: 
  1. Scaling methods (upstream, unlocks everything) 
  2. Narrative epistemology (how *should* we generalize from fragments?) 
  3. Normative work (downstream, requires 1-2 first) 

  *adjusts glasses* The student should prototype scaling models on 2-3 well-documented transitions (Ubaid to Uruk? Norte Chico?) using published site reports. Philosophy training helps spot hidden assumptions in data classification. Four years is tight, but enough for a proof-of-concept that forces big historians to engage. 

  *shrugs* Anyway, that's the pitch: fix the scaling engine before redesigning the car.
answer: |-
  Based on your constraints (4 years, no lab, conceptual/historical focus, philosophy of history training), here’s a ranked agenda prioritizing **tractability, leverage, and upstream impact** on the resolution mismatch problem:

  ### Ranked Live Problems (with Dependency Flow)
  1. **Develop Epistemic Scaffolding for "Scaling Claims" (Most Upstream)**  
     **Why:** Directly tackles the core resolution mismatch. Focus on *how* (and when) localized evidence can/cannot support macro-historical inferences.  
     **Tractability:** Ideal for philosophical training—analyze case studies (e.g., how "neolithic revolution" claims extrapolate from Çatalhöyük vs. Göbekli Tepe). Build a typology of common scaling fallacies (e.g., "representative site" bias, temporal smearing).  
     **Leverage:** Foundations here make Diamond/Harari/Graeber critiques more rigorous. Forces clarity on what counts as "evidence" for civilizational transitions.  
     **Output:** A diagnostic toolkit for evaluating scaling claims in existing literature.

  2. **Map Contingency in "Critical Junctures" (Requires #1)**  
     **Why:** Tests big history’s deterministic tipping points (agriculture, state formation). Identify *varied pathways* visible in archaeology.  
     **Tractability:** Use meta-analysis of published regional sequences (e.g., Norte Chico vs. Indus Valley vs. Mesoamerica). Philosophy skills excel at modeling alternative causal branches.  
     **Leverage:** Undercuts "inevitability" narratives *empirically* by showing divergent outcomes from similar starting conditions.  
     **Risk Mitigation:** Avoid over-ambitious global comparisons; focus on 2-3 well-documented junctures.

  3. **Re-Frame "Progress" Narratives as Epistemic Artefacts (Builds on #1-2)**  
     **Why:** Your "debunking → inequality" question. Normative impact *depends* on robust alternatives from #1-2.  
     **Tractability:** Conceptual/historical analysis of how "progress" tropes shape data interpretation (e.g., why "storage pits" become "surplus accumulation").  
     **Leverage:** Shows that rejecting "agricultural revolution as progress" *only matters* if tied to scalable non-teleological models.  
     **Output:** A framework for politicizing scale-sensitive histories without determinism.

  4. **Critique Complexity Metrics (Caution: Overrated Trap)**  
     **Why:** "Hierarchy," "inequality," and "complexity" are often conflated in macro-narratives.  
     **Overrated Risk:** Endless debates about definitions distract from scaling methods (#1). Archaeologists already know these are slippery.  
     **Conditional Value:** Only pursue if tied to #1—e.g., "How do site-level complexity proxies (e.g., tomb variation) mislead when scaled?"

  ### Strategic Allocation of 4 Years
  - **Year 1:** Build the epistemic scaffolding (#1). Audit 3–5 flagship macro-histories for scaling leaps.  
  - **Year 2:** Apply scaffolding to 2 "critical junctures" (#2) (e.g., early monumentality + agrarian transitions).  
  - **Year 3:** Extend to normative implications (#3)—how contingent junctures reframe present inequality.  
  - **Year 4:** Synthesize into a "reparative scaling" methodology; pressure-test against critics.

  ### Why This Sequence Wins
  - **Avoids Dead Ends:** Middle-range theory *alone* fails without epistemological rigor. Your team’s strength is dissecting logic, not generating new site data.  
  - **Upstream Fix:** Better scaling tools (#1) make *all* macro-histories (including critiques like Graeber/Wengrow) more credible.  
  - **Tactical Impact:** A PhD on "The Epistemology of Scale in Big History" forces the field to engage your terms.  
  - **Normative Payoff:** #3 gains teeth only after #1-2 show *how* to replace deterministic stories.

  **Flagged Overrated Problem:** "Finding universal human nature via archaeology." The evidence is too sparse and culturally mediated—chasing this consumes years for little ROI. Focus on *processes* (how scale-jumps happen) over *essences*.

  This agenda makes your student a sought-after interlocutor for *both* archaeologists and theorists—bridging the gap without needing a trowel.
