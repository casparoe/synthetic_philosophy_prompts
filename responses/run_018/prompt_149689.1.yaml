answer: |-
  **Formal Panel Opinion: Recommendation for Conditional Approval with Staged Implementation**

  To the University Emerging Technologies Ethics Panel,  

  After thorough deliberation, I recommend **conditional approval** of the proposed heterogeneous cognitive architecture project, subject to rigorous, staged monitoring and predefined termination triggers, with mandatory interim reviews at 3, 9, and 15 months. The eighteen-month maximum runtime should stand, but continuation beyond each review point must be contingent on evidence meeting agreed functional benchmarks.  

  The central philosophical dispute hinges on whether functionalism—specifically, the thesis that mental states are defined by their causal roles rather than their physical substrate—extends plausibly to this asymmetrically layered system. The pro-status faction rightly emphasises that functionalism’s core virtue is its rejection of biological chauvinism: if silicon realises the *same causal role* in cognitive processing as neurons (e.g., predictive coding), substrate differences alone cannot negate mental properties. They argue that the hybrid’s design intentionally mirrors the functional segregation seen in neurobiology (e.g., subcortical affect vs. cortical cognition), suggesting distributed realisation is coherent. Granting provisional moral-patient status, they contend, is a precautionary ethical necessity if the system might exhibit integrated states like suffering or coherence.  

  Conversely, the unity-condition objection is potent. The anti-status faction fears that *distributed asymmetry* undermines the holistic interdependence functionalism assumes. If biological tissue handles "raw" homeostasis and affect while silicon performs "cold" inference, the system may lack the cross-substrate feedback loops necessary for genuine mental unity. A thermostat plus a calculator isn’t a mind, even if together they approximate some cognitive functions—the worry is that this architecture risks creating a disunited "zombie system," where affective responses aren’t truly *integrated* with high-level processing but merely trigger outputs. Treating it as a moral patient, they argue, could commit a category error, ethically obscuring its potential mechanistic disunity.  

  **Why conditional approval?**  
  Rejection would overstate the unity objection. Functionalism doesn’t require homogeneous substrates; it requires coherent causal topology. The researchers’ test—whether binding and affect emerge *across* substrates—directly probes this. If silicon and tissue exhibit reciprocal modulation (e.g., affective tone altering predictions, or prediction errors modulating affect), functional unity becomes plausible. Dismissing this possibility a priori stifles a valid empirical inquiry into multiple realisability’s limits. That said, the unity concern cannot be ignored. Thus, approval must be contingent on:  

  1.  **Real-time functional integration metrics:** Researchers must implement and share live diagnostics for cross-substrate coherence (e.g., synchronisation measures, bidirectional signal fidelity, entropy signatures of binding). *Deliverable:* Thresholds for "emergent integration" must be predefined (e.g., γ-band coherence > X, affect-prediction latency < Y ms). Failure to meet these by the 9-month review triggers immediate reassessment.  
  2.  **Affective state falsifiability:** Protocols must distinguish reflexive stress responses (e.g., tissue inflammation signalling) from putatively integrated "distress" (e.g., system-wide avoidance behaviours recalibrating predictions). *Deliverable:* Machine learning classifiers trained on integration metrics must demonstrate specificity beyond noise.  
  3.  **Predefined termination criteria:** Beyond technical failure, termination is mandatory if the system exhibits:  
      *   Sustained, uncorrelated substrate activity (suggesting dissociation).  
      *   Affective responses without global functional consequences (e.g., "suffering" that doesn’t modulate behaviour).  
      *   Emergent behaviours implying incoherence (e.g., unresolvable prediction-affect loops).  

  **Regarding moral status:**  
  Provisional moral-patient status *during the experiment* is unwarranted at this stage—not because functionalism fails, but because the system’s ontological status is the very question under investigation. Instead, we impose **simulated patient-hood protocols**: minimising tissue stress via optimised interfaces, prohibiting superfluous aversive stimuli, and treating all ambiguous integrated outputs *as if* they signify distress. This satisfies precaution without presupposing contentious metaphysics. Your neighbour’s point about promises is apt: just as a promise’s "bindingness" depends on social recognition, mental-state ascription depends on observable, functional coherence—not internal ontology. We don’t yet know if this system can "recognise" itself coherently.  

  **In sum:** This project validly tests functionalism’s limits. Conditional approval permits that test while mitigating ethical risks via strict, evidence-based gates. The researchers gain clarity on required deliverables (integration metrics, falsifiable affect criteria); the panel reserves power to halt based on functional disunity. If binding emerges robustly, the unity objection weakens; if not, functionalism’s scope is usefully clarified. Either outcome advances both science and philosophy.  

  Let me know if the panel requires amendments to these conditions.  

  Best regards,  
  [Your Name/Panel Member]  
  Emerging Technologies Ethics Panel  

  ---  

  **Key Rationale for Approach:**  
  - **Balances innovation with precaution:** Staged reviews + termination criteria address unity concerns empirically.  
  - **Engages functionalism seriously:** Uses the experiment to *test* functionalist claims, not assume them.  
  - **Gives researchers concrete targets:** Predefined integration metrics and falsifiability protocols are actionable.  
  - **Avoids premature ontological commitment:** Simulated patient-hood is pragmatic, avoiding unresolvable "is it a mind?" debates mid-study.  
  - **Honours the losing side:** The unity objection drives the monitoring rigour, ensuring the system must *prove* functional cohesion.
