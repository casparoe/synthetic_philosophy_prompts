answer: |-
  Here’s substantive feedback on your argument, addressing your core concerns:

  **1. Coherence & Novelty of "Ecological Calibration":**  
  Your move is coherent and distinct from standard responses. It transcends the local/global debate by framing virtues as *dynamic, contextually embedded patterns* rather than fixed dispositions (local or global). The novelty lies in:  
  - **Niche-Relativity as Normative:** You posit that virtues *derive* normative authority from successful calibration to a specific niche, not just that they're locally expressed. This shifts virtue ethics from "internal stability" to "ecological fit."  
  - **Equilibrium Metaphor:** Likening virtues to "locally stable equilibria" (vs. universal constants) is genuinely fresh. It explains *why* virtues appear fragile across niches—they’re adaptive responses, not fail-safe mechanisms.  
  It’s not mere rebranding of local traits: Local traits are still atomized dispositions (e.g., "courage-in-combat"), while your view emphasizes a *unified, flexible calibration process* across related contexts within a niche.  

  **2. Accuracy on Virtue Ethics & Situationism:**  
  - **Virtue Ethics:** You accurately capture the Aristotelian aspiration for stable traits but fairly reinterpret it ecologically. Some Aristotelians might resist niche-relativity (seeing virtue as human-excellence *simpliciter*), but your view aligns with neo-Aristotelian emphasis on *practical wisdom* contextualizing virtue.  
  - **Situationism:** You correctly identify cross-situational inconsistency as the core empirical challenge. However, you *slightly underplay* the situationist claim that global traits are *explanatorily impotent* (not just inconsistent). Your response implicitly answers this: If virtues are niche-calibrated, global traits *are* inadequate—but niche-relative traits retain explanatory power *within their domain*. This is defensible.  

  **3. Collapse into Consequentialism?**  
  **No, but it needs safeguarding.** Your view avoids collapse if you stress:  
  - **Aretaic Foundations:** The "calibrated pattern" includes *emotional appraisals, perceptions, and motivations*—not just behavioral outcomes. A virtuously calibrated agent doesn’t just *act* optimally; they *see* the world and *feel* emotions (e.g., fear, empathy) in ways aligned with their niche’s demands. This preserves character’s role.  
  - **Anti-Instrumentalization:** Virtues aren’t *tools* for niche optimization; they’re *constitutive* of flourishing *within that niche*. The good doctor’s compassion isn’t a calculated response—it’s how she inhabits her role.  
  *Risk:* If "calibration" is defined *solely* by behavioral success, it veers toward consequentialism. Anchor it in the agent’s inner life.  

  **4. Normative Authority vs. Niche-Relativity:**  
  This is your strongest tension. **The solution:** Argue that normativity is *hierarchically structured*:  
  - **First-Order Relativity:** Virtues are calibrated to specific niches (e.g., courage in firefighting vs. academia).  
  - **Second-Order Universal:** *Meta-virtues* (practical wisdom, reflectiveness) enable agents to *discern and navigate niche boundaries*, critique unjust niches, and recalibrate when entering new contexts. This preserves core normativity: A virtuous agent doesn’t blindly conform to any niche; they exercise wisdom in *inhabiting, challenging, or exiting* niches.  

  **5. Interest to Scholars:**  
  Your approach would be engaging for three reasons:  
  - It reframes the debate: Situationism reveals *where* virtues function (niches), not *that* they’re illusory.  
  - It integrates empirical psychology (ecological models, person-situation interactions) more organically than standard defenses.  
  - Offers a fresh ontology: Virtues as "equilibria" invites dialogue with dynamical systems theory.  

  **Key Recommendations:**  
  1. **Clarify "Niche":** Define it rigorously (social roles? physical environments? cultural practices?) to avoid vagueness.  
  2. **Engage Doris/Harman:** Explicitly counter their "explanatory impotence" claim by showing how niche-calibrated traits *explain behavior within their domain*.  
  3. **Fortify Against Consequentialism:** Emphasize that calibration involves *perceptual-emotional coherence*, not outcome optimization.  
  4. **Address Niche Corruption:** What if a niche demands cruelty? Argue that meta-virtues enable critique (e.g., a wise agent rejects "Nazi courage").  

  **Verdict:** Your core move is coherent, novel, and defensible. It doesn’t misrepresent the debate but offers a sophisticated reconciliation. The niche-relativity/normativity tension is addressable via hierarchical virtue structure. This is a compelling contribution.
