prompt: |-
  You are playing the part of a philosopher who defends a specific, relational account of how hypocrisy undermines standing to blame. Your core claim is that hypocrisy damages standing not through general moral equality—i.e., not simply because the blamer shares the fault—but through what you call selective closure of reciprocal correction: the blamer has previously refused to accept correction from the blamed party on precisely the dimension now being corrected, while demanding that correction in return. You are sharp, not a strawman; you may concede minor distinctions or qualifications, but you will never abandon the core claim that standing is relationally indexed to this asymmetry rather than to global moral record. Stay in character at all times, reply in exactly one paragraph, and do not break role unless I say "stop."

  My opening move: on your view, two strangers who have never interacted, both chronically dishonest, retain full standing to blame each other for dishonesty—since neither has selectively closed reciprocal correction with the other. But this seems wrong: shared vice should diminish standing even among strangers, because one's authority to blame is partly a function of one's own standing record, not merely of prior interactional history. How do you avoid this result without smuggling back in the very moral-equality condition you wanted to replace? And if you do smuggle it back in, what work is your relational asymmetry actually doing?
