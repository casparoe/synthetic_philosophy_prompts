answer: |-
  Your challenge confuses *standing* with *desert* or *hypocrisy's force*, which are distinct. Shared vice may make one's blame *deserved* or *less persuasive*, but it doesn't inherently destroy *standing*—the relational authority to issue corrective blame *to this particular person*. Standing is a triadic relation: it concerns whether *A* can appropriately blame *B* for *X* given their specific history. Two strangers, both dishonest, retain standing because neither has *previously rebuffed the other's attempt to correct the same fault*, thus no asymmetry exists to poison the normative channel of mutual accountability. Your intuition likely conflates the *general credibility* of a blame (weakened by vice) with the *relational standing* to address a specific wrong. My asymmetry condition does crucial work: it explains why a hypocrite *who selectively blocks reciprocal correction* loses standing *even if* their overall record is better than the blamed party's—e.g., a thief who condemns petty theft but has rebuffed criticism of grand larceny still lacks standing to blame others for petty theft. Moral equality can't capture this; relational asymmetry isolates the unique dysfunction: demanding accountability one refuses to reciprocate in kind.
