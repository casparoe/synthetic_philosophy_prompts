  ### Prediction of the Board's Verdict
  The board would **reject** the proposal to build the continental direct-air-capture network. This verdict aligns with the board's precedents, particularly the rejection of the lifespan-extension therapy (second ruling) and the cost-threshold principle from the waste-containment project (third ruling). Below, I outline the reasoning and then address the competing principles.

  ### Reasoning for Rejection
  1. **Time Horizon and Epistemic Breakdown**:  
     The proposal's benefits manifest in 200 years, which falls between the 120-year horizon (first ruling, approved) and the 350-year horizon (second ruling, rejected). The board explicitly stated that obligations weaken when "predictive reliability and social identity across generations break down." At 200 years, this breakdown is likely deemed significant, as 350 years was a clear cutoff. While the 95% confidence is high, the second ruling implies that extreme temporal distance itself (beyond a point) triggers epistemic decay, regardless of stated confidence. Thus, 200 years is sufficiently distant to weaken obligations, especially given the board's sharp drop-off between 120 and 350 years.

  2. **Cost Burden and Thresholds**:  
     The proposal requires a sustained 3.5% of GDP for 40 years—a massive present cost with negligible co-benefits. This far exceeds the 1% GDP threshold implied by the waste-containment ruling (third ruling), where costs above 1% were deemed unjustifiable for distant benefits (even over 10,000 years). The first ruling approved 1.5% GDP for 120 years, but 3.5% is over twice that cost and for a longer horizon (200 vs. 120 years). The board's emphasis on "no present lives risked" and low cost in the waste-containment case reinforces that high present burdens are unacceptable for distant benefits. Here, 3.5% GDP poses a substantial intergenerational sacrifice.

  3. **Economic-Growth Adjustments**:  
     The board endorses growth adjustments (fourth ruling), meaning future benefits are discounted to present value based on expected economic growth. A standard growth rate (e.g., 2%) would drastically reduce the present value of benefits 200 years away. For instance:
     - Future benefit value in 200 years: Discounted by ~(1.02)²⁰⁰ ≈ 52.5-fold.
     - Present cost: 3.5% of GDP annually for 40 years ≈ 140% of one year's GDP in undiscounted terms.
     Even a catastrophic benefit (e.g., 100% of future GDP) would only be worth ~1.9% of current GDP after discounting, far below the 140% cost. Growth adjustments thus amplify the cost-benefit imbalance.

  4. **Closest Analog**:  
     The **second ruling** (rejected lifespan-extension therapy) is the closest analog. Both involve:
     - High costs (8% of health budgets ≈ 1.6–2.4% GDP based on typical health/GDP ratios; the proposal is 3.5% GDP).
     - Distant benefits (350 vs. 200 years) where "obligations weaken sharply."
     - Negligible co-benefits.
     The board rejected the therapy due to epistemic/social breakdown, and the higher cost and similar horizon here warrant rejection.

  **Alternative Verdict Considered**:  
  An approval might be argued by linking to the first ruling (no moral discounting for time) and the high confidence (95%). However, the cost is prohibitive, and 200 years likely exceeds the board's implicit epistemic horizon. The waste-containment case (approved at 0.05% GDP for 10,000 years) shows that only minimal costs pass for extreme horizons, whereas 3.5% GDP fails the 1% threshold.

  ---

  ### Competing Principles Accommodating All Rulings
  Two principles can explain the full record, but they conflict on the new proposal:

  1. **Smoothly Decaying Epistemic-Horizon Function**:  
     - **Description**: Moral weight decays continuously with time based on declining predictive reliability and social cohesion. The decay function is exponential (e.g., weight = e<sup>(-λt)</sup>), where λ calibrates to precedents. Economic-growth adjustments apply separately (no pure time preference).  
     - **Accommodating Precedents**:  
       - First ruling (120 years): Low decay (λ small) allows full weight; 1.5% GDP cost acceptable.  
       - Second ruling (350 years): High decay (e.g., λ such that weight ≈ 0) rejects 8% health budget cost.  
       - Third ruling (10,000 years): Near-zero weight, but minimal cost (0.05% GDP) passes; 1% GDP fails as it exceeds residual weight.  
       - Fourth ruling: Growth adjustments used; no pure time preference.  
     - **Commitment if Rejecting Proposal**: The board commits to significant decay at 200 years (λ calibrated so decay is material), making 3.5% GDP cost unjustifiable despite growth adjustments.  
     - **Commitment if Approving Proposal**: The board commits to minimal decay at 200 years (λ very small), treating it like 120 years, and assumes growth-adjusted benefits justify high costs.

  2. **Two-Tier Lexical Threshold with Economic Adjustments**:  
     - **Description**: A time threshold (T) splits obligations:  
       - **Tier 1 (t ≤ T)**: Full obligations with growth adjustments; no decay.  
       - **Tier 2 (t > T)**: Only minimal-cost actions allowed (cost ≤ C<sub>max</sub>, e.g., 1% GDP), regardless of benefits.  
       T is set between 120–350 years; C<sub>max</sub> = 1% GDP from waste-containment precedent.  
     - **Accommodating Precedents**:  
       - First ruling (120 years ≤ T): Full obligations; 1.5% GDP acceptable under growth adjustments.  
       - Second ruling (350 years > T): Tier 2 applies; 8% health budget > C<sub>max</sub>, so rejected.  
       - Third ruling (10,000 years > T): Tier 2; cost 0.05% < C<sub>max</sub>, approved; 1% rejected.  
       - Fourth ruling: Growth adjustments in Tier 1; no pure time preference.  
     - **Commitment if Rejecting Proposal**: The board commits to 200 years > T (e.g., T ≈ 150 years) and/or 3.5% GDP > C<sub>max</sub>.  
     - **Commitment if Approving Proposal**: The board commits to 200 years ≤ T and that growth-adjusted benefits outweigh costs (unlikely given precedents).

  ---

  ### Distinguishing Case
  **Proposal**: A program costing 0.2% of GDP now (one-time) to avert comparable harm (catastrophic warming) in 600 years with 95% confidence.  
  - **Why it Distinguishes**:  
    - **Smoothly Decaying Principle**: Decay at 600 years is extreme (e.g., weight ≈ 0), so 0.2% GDP cost is rejected despite low burden.  
    - **Two-Tier Principle**: 600 years > T (as T < 350), but 0.2% GDP < C<sub>max</sub> (1%), so approved.  
  This case cleanly separates the principles: decay rejects it, while two-tier approves it. The board's choice would reveal whether epistemic decay dominates (smooth decay) or a cost threshold governs extreme horizons (two-tier).
