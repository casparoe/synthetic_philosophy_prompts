  hey im a junior in highschool and my philosphy teacher gave us this weird prompt: should the fact that some moral decision problems are computationaly intractable — like actually NP-hard — change how we judge people who fail to pick the best outcome? if figuring out the right thing requires more computing power than anyone could ever have, is it unfair to blame them, or does the moral standard stay perfect even if we cant reach it? i think theres this idea called "feasible rationality" but i might be misremembering. weigh both sides but dont just say "it depends" — defend an actual verdict. also please say how confident you are in what you claim and point out the one part youre least sure about. thx!!
