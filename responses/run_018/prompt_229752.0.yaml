  #### Node 3: **Nuclear Waste (Future Generations – Participation)**  
  A site for nuclear waste is chosen today, affecting people not yet born. *Should future generations have formal participation (e.g., via proxies) in this decision?*  
  - **Yes** → **Leaf: All-Affected Interests Principle** (Formal participation for all whose interests are meaningfully impacted, including future people).  
  - **No** → Go to Node 5.  

  #### Node 4: **Factory Emissions (Interests vs. Participation)**  
