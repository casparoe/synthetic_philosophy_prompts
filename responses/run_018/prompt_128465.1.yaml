answer: |-
  Here is a disciplined conceptual mapping of the black swan discovery through Goodman's "new riddle of induction," addressing your specific queries:

  ---

  ### **1. Pre-1697: Predicate Projection & Implicit Reference Class**
  - **"White" as Entrenched Predicate:** For European naturalists, "white" was a **highly entrenched, projectible predicate** for swans (*Cygnus olor* and relatives). Its projectibility derived from consistent observation within Europe, reinforced by linguistic/conceptual practices (Aristotelian taxonomy, medieval bestiaries).
  - **Implicit Reference Class:** The sample was restricted to **"swans observed in Europe prior to 1700"**—a geographic/temporal reference class functionally equivalent to Goodman's temporal cutoff in "grue." This was *implicit* in their inductive framework, not explicitly acknowledged.
  - **Grue-Style Alternative:** The predicate **"white-in-Europe-and-black-in-the-Antipodes"** was *logically available* (like "grue") but **linguistically unentrenched**. It lacked utility in European discourse, violated parsimony, and contradicted entrenched assumptions of species uniformity. Naturalists projected "white" *simpliciter*, assuming universality beyond their reference class.

  ---

  ### **2. Post-Discovery: Predicate Failure vs. Sampling Failure**
  - **Goodman's Dilemma:** The collapse reveals an ambiguity central to Goodman's riddle:  
    - **Predicate Misprojection?** Europeans projected "white" as if it were universally projectible, but it was covertly indexical (dependent on the unstated reference class).  
    - **Sampling Bias?** The sample was non-representative because "swan" was incorrectly delimited (*Cygnus atratus* was excluded *a priori*).  
  - **Goodman's Framework Cannot Distinguish Them:**  
    - "Representative sample" is defined by **entrenched categories** (e.g., "swan" meant European morphology/behavior). *Cygnus atratus* was initially classified as a distinct genus (*Chenopis*), showing that "swan" itself was renegotiated post-discovery.  
    - Entrenchment governs both predicate projection *and* reference class formation. The "failure" was simultaneous:  
      > The predicate "white" was misprojected *because* the reference class "swan" was underinclusive—but "swan" was entrenched *as* a European category.  

  ---

  ### **3. Goodman's Claim: Induction Fixed by Linguistic Practice**  
  - **Geographic Isolation as Support:** The episode **validates Goodman's claim**. European induction relied on:  
    - **Entrenched predicates:** "White" was projectible due to linguistic habit, not metaphysical necessity.  
    - **Entrenched categories:** "Swan" excluded Antipodean fauna *by practice*, not empirical falsification.  
    Isolation prevented disconfirmation until exploration, revealing that inductive confidence was sustained by *ignorance reinforced by linguistic convention*.  
  - **Instability of Predicate/Reference Class Distinction:** The discovery **dissolves this boundary**:  
    - "White" failed because the *extension* of "swan" was wrong.  
    - "Swan" was revised because a *predicate* ("black") conflicted with expectations.  
    This interdependence shows that neither predicates nor reference classes are "discovered" in the world; both are products of entrenchment.  

  ---

  ### **4. What Would Change the Analysis?**  
  Your conclusion hinges on interpretations of **entrenchment** and **17th-century taxonomy**:  
  - **Confirmation of Goodman if:**  
    - Entrenchment is shown to be purely linguistic/social (e.g., naturalists *never* considered antipodean variations possible, despite logical coherence of "grue-style" predicates).  
    - Taxonomic practice rigidly tied species definitions to European observations (e.g., "essentialism" prevented hypothetical extensions).  
  - **Counterexample to Goodman if:**  
    - Naturalists explicitly tested for geographic variability (e.g., debated "grue-like" predicates pre-1697), showing entrenchment was defeasible by empirical rigor.  
    - "Representative sampling" was a formal methodological norm (e.g., Baconian principles demanded global scope), proving induction aimed at world-features *despite* linguistic practice.  

  **Historical Reality Favors Goodman:** 17th-century naturalists assumed species uniformity across habitats (Linnaeus later formalized this). No evidence supports serious consideration of location-dependent predicates. The shock at black swans confirms that induction was anchored in linguistic/conventional practices, not probabilistic sampling theory.  

  ---

  ### **Conclusion**  
  The black swan collapse is a **paradigm of Goodman's thesis**: Inductive validity is determined by the entrenchment of predicates and categories within a linguistic practice, not by "natural" boundaries. Geographic isolation acted as a physical counterpart to Goodman's temporal cutoff, exposing how entrenchment masks the contingency of projection. The inability to separate predicate failure from sampling failure underscores that "the world" only enters induction through linguistically mediated categories. This case reveals that Goodman's riddle is not a mere logical puzzle but a structural feature of empirical inquiry—one that becomes visible when entrenched practices collide with expanded data.
