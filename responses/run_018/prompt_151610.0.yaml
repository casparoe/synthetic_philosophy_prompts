prompt: |-
  hey so im a phd student in decision sciences (mostly bounded rationality / satisficing stuff, with some weird side interest in how aspiration levels adapt under partial feedback) and my advisor volunteered me to help our univ's small research ethics board stop debating every amendment to death. they have like 20 minutes per case, zero lawyers on staff, and right now they try to 'maximize ethical coverage' which is impossible so they just stall.

  i need a reusable decision procedure—checklist style, questions in order, what counts as sufficient at each gate, hard stop for no, and explicit hand-off points where its values not facts. it should be grounded in satisficing logic, not optimization: set an aspiration level for risk/info-gain, search only until you hit it or search costs spike, then adapt downward only if the spike is genuine not just impatience. apply it to three protocol amendments: (1) switching survey language in an approved study, (2) adding a biometric sensor not in original consent, (3) extending retention for 'future unspecified analysis.' case 3 should fail the gate but its exactly the kind they always want to rubber-stamp, so flag that tension.

  also include where the board can game the aspiration levels to get the answer they want, and a clear section on what this procedure cant do—like resolve deep disagreement about acceptable risk, just make it visible. sorry this is long, im writing between classes and my trackpad is acting up.
reasoning: |-
  Okay, let's break this down. The user is a PhD student in decision sciences, focusing on bounded rationality and satisficing, with an interest in aspiration levels. They've been tasked by their advisor to help a university research ethics board (REB) streamline their amendment review process. The current process is inefficient—they try to "maximize ethical coverage," which leads to endless debates and stalls, especially given their 20-minute time limit per case and lack of legal expertise. 

  The user needs a reusable decision procedure based on satisficing logic, not optimization. That means setting aspiration levels for risk and information gain, stopping when those are met or search costs spike, and adapting downward only if necessary. They specifically want it applied to three amendment cases: (1) changing survey language, (2) adding a biometric sensor, and (3) extending retention for future unspecified analysis—with the last one expected to fail but often rubber-stamped. The procedure should also highlight where the board might game aspiration levels and clarify its limitations, like surfacing but not resolving deep disagreements about risk.

  First, I need to ground this in satisficing principles. Herbert Simon's work is key here—focus on "good enough" solutions given constraints, not perfect ones. The REB's current approach of trying to maximize ethical coverage is impossible and counterproductive; they need satisficing with clear aspiration levels. The procedure should have gates with binary outcomes (pass/fail), ordered questions, and explicit hand-offs for value judgments. 

  For the aspiration levels, I'll define them for both risk tolerance and information sufficiency. Risk tolerance: low for minimal harm, medium for moderate, high only if justified by significant benefits. Information sufficiency: enough to assess risks/benefits without exhaustive digging. Search costs are critical—time is capped at 20 minutes, so we need hard stops. Adaptation downward should only happen if new info reveals the aspiration was unrealistic, not just due to impatience.

  Now, structuring the procedure. I'll outline gates in sequence: 
  - Gate 1: Materiality check—is this a substantial change? If yes, proceed; if no, fast-track approval. 
  - Gate 2: Risk/benefit update—does the amendment alter the risk-benefit profile? Use aspiration levels here. 
  - Gate 3: Consent adequacy—can existing consent cover this, or is reconsent needed? 
  - Gate 4: Administrative/feasibility—practical checks like documentation. 
  Each gate has clear pass/fail criteria and time allocations. The whole process must fit under 20 minutes total.

  For the case applications: 
  - Case 1 (survey language): Likely passes if changes are minor and don't affect risk. 
  - Case 2 (biometric sensor): Higher risk, probably fails consent adequacy unless reconsent is feasible. 
  - Case 3 (retention extension): Should fail at Gate 2—undefined future analysis violates information sufficiency aspiration, but boards often wave it through. I'll flag that tension and the risk of gaming aspiration levels to justify approval.

  On gaming risks: Boards might lower aspiration levels for information sufficiency ("we don't need details") or raise risk tolerance ("it's probably fine") to push approvals. The procedure must make these choices explicit. Limitations: It won't resolve value conflicts—just expose them. Also, it can't handle novel ethical dilemmas or replace legal advice.

  Finally, the user mentioned their trackpad acting up and writing between classes—so I'll keep the response structured but concise, with clear sections for easy reference. The tone should be professional yet approachable, fitting a PhD student's style.
answer: |-
  Here's a satisficing-based decision procedure for expedited ethics amendment review, designed for bounded rationality and 20-minute windows. It uses **aspiration levels (AL)** for risk tolerance (`AL-R`) and information sufficiency (`AL-I`), with explicit adaptation triggers.

  **Core Principles:**
  1.  **Satisficing Goal:** Find an amendment *acceptable enough* (`AL-R` not breached, `AL-I` met) within search limits, not "optimal."
  2.  **Aspiration Levels (AL):**
      *   `AL-R`: Pre-set tolerance for *net increase in participant risk/burden*. (e.g., Low: trivial/no increase, Med: minor increase offset by benefit, High: significant increase requires strong justification).
      *   `AL-I`: Pre-set threshold for *sufficient information* to judge risks/consent. (e.g., "Do we understand the change, its risks, and its impact on consent adequately to proceed?").
  3.  **Search & Stopping Rule:** Seek information *only* until:
      *   `AL-I` is met AND `AL-R` is *not* breached, **OR**
      *   `AL-I` is met and `AL-R` *is* breached (Fail), **OR**
      *   `AL-I` *cannot* be met within time/effort constraints AND search costs spike (Fail or Require Major Revision), **OR**
      *   20 min total time is consumed (Hard Stop - Defer or Conditional Decision).
  4.  **Adaptation:** Only lower `AL-I` if new info reveals the *original aspiration was genuinely unrealistic* (e.g., data genuinely unavailable), not due to impatience. *Never* lower `AL-R` during a case review.

  ---

  **SATISFICING ETHICS AMENDMENT REVIEW PROCEDURE (SERRP)**

  **Pre-Meeting (Chair/Coordinator):**
  1.  **Set Initial ALs:** For this meeting batch, based on board policy & case types:
      *   `AL-Risk (AL-R)`: [Low / Medium / High] - Define what constitutes breach (e.g., "Breach = >Minimal new risk OR invalidates consent").
      *   `AL-Info (AL-I)`: [Basic / Moderate / Comprehensive] - Define threshold (e.g., "Moderate = understand change, key risks, consent impact, PI justification").
  2.  **Time Allocation:** Strict 20 min timer per case. Alert at 15 min.

  **Gate 0: Pre-Screen (Chair - 1 min)**
  *   **Question:** Is this a *formal amendment* requiring full board review, or administrative/non-substantive (e.g., typo fix, PI contact change)?
  *   **Sufficient:** Documentation clearly shows change is minor/administrative.
  *   **Hard Stop (No):** Requires substantive ethics review. Proceed to Gate 1.
  *   **Hand-off:** N/A.

  **Gate 1: Materiality & Scope (3 min)**
  *   **Question 1:** Does the amendment *substantially* alter the study's **design, procedures, risks, benefits, or participant population** compared to the approved protocol?
  *   **Question 2:** Could this change *reasonably* have affected the original consent decision?
  *   **Sufficient (`AL-I` Check):** Clear description of the change provided. Board can articulate *what* is different and the *stated reason* (PI justification).
  *   **Hard Stop (No - Reject/Revise):** Change is so substantial it constitutes a *new study*. Requires full new application.
  *   **Pass:** Proceed to Gate 2.
  *   **Hand-off (Values):** Interpretation of "substantial" and "reasonably affected consent" involves value judgments about participant autonomy and study integrity.

  **Gate 2: Risk/Benefit Shift & Aspiration Check (7 min)**
  *   **Question 1:** Based on *current information* (`AL-I`), what is the **net change in risk/burden** to participants? (Increase/Decrease/Neutral? Magnitude?).
  *   **Question 2:** Is there a **net change in potential benefit** (to participants or society)? (Increase/Decrease/Neutral?).
  *   **Question 3:** Does the PI's justification plausibly support the change *given the net risk/benefit shift*?
  *   **Sufficient (`AL-I`):** Enough info to characterize risk shift direction and rough magnitude (trivial/minor/moderate/significant) and benefit shift (if any). Justification understood.
  *   **Aspiration Check (`AL-R`):**
      *   If **Net Risk Increase > `AL-R` Tolerance** → **Fail.** (e.g., AL-R=Low, risk increase is more than trivial).
      *   If **Net Risk Increase ≤ `AL-R` Tolerance** AND justification is plausible → **Pass.** Proceed to Gate 3.
      *   If **`AL-I` NOT Met** (insufficient info on risk shift/justification) → **Spike Search Cost?** (Is more info readily available? Can it be found in <3 min?). If YES, seek info briefly. If NO or time runs out → **Fail/Defer (Insufficient Info).**
  *   **Hand-off (Values):** Defining "plausible justification" and weighing risk/benefit *shifts* involves values. Setting `AL-R` level is a pre-meeting value judgment.

  **Gate 3: Consent Adequacy (6 min)**
  *   **Question 1:** Does the **original consent form and process** adequately cover the *nature* and *risks* introduced by this amendment?
  *   **Question 2:** If not, is **re-consent feasible, appropriate, and justified?** (Describe the re-consent plan).
  *   **Sufficient (`AL-I`):** Original consent language reviewed. Board understands if the change falls within the scope of the original broad consent (if applicable) or is a genuinely new element. Re-consent plan (if needed) is clear and feasible.
  *   **Hard Stop (No):**
      *   Original consent is clearly inadequate **AND** re-consent is *not* feasible/appropriate/justified → **Fail.**
      *   Re-consent plan is absent or grossly inadequate → **Fail.**
  *   **Pass:** Proceed to Gate 4.
  *   **Hand-off (Values):** Judging "adequacy" of original consent and "feasibility/appropriateness" of re-consent involves values (autonomy, burden on participants, practicality).

  **Gate 4: Administrative & Feasibility (3 min)**
  *   **Question 1:** Are all necessary **documentation updates** provided (revised protocol, consent form, surveys, investigator brochure)? Are they clear?
  *   **Question 2:** Are there any obvious **logistical conflicts** (e.g., new sensor conflicts with existing equipment, extended retention conflicts with site policies)?
  *   **Sufficient (`AL-I`):** Required docs are present and appear updated. No glaring logistical issues identified.
  *   **Fail:** Critical documentation missing or contradictory. Unresolvable logistical conflict identified. → **Defer/Major Revisions.**
  *   **Pass:** **Approve** (potentially with minor administrative conditions noted).

  ---

  **Application to Cases (Illustrating ALs & Tensions):**

  *   **Case 1: Switching Survey Language (Minor Wording)**
      *   **G1:** Pass (Minor change).
      *   **G2:** Risk Shift? Likely neutral. `AL-I`: Easy (see new wording). `AL-R`: Not breached. Pass.
      *   **G3:** Pass (Original consent covered survey participation, wording change unlikely material).
      *   **G4:** Pass (Docs provided).
      *   **Result:** APPROVE. Satisficing achieved quickly (`AL-I` met, `AL-R` not breached).

  *   **Case 2: Adding Biometric Sensor**
      *   **G1:** Pass (Substantive change).
      *   **G2:** Risk Shift? **Increase** (privacy, data security, physical burden). `AL-I`: Need specs, data plan, risks. `AL-R`: If `AL-R`=Low/Med, *likely breached* unless sensor is very low risk AND justification strong. **`AL-R` Breach Likely → FAIL at G2 or G3.** If barely within `AL-R`, proceed.
      *   **G3:** **Original Consent?** Unlikely covered specific sensor. Re-consent? Usually required (feasibility check needed). If no re-consent plan → FAIL.
      *   **G4:** Docs must be perfect.
      *   **Result:** LIKELY DEFER/MAJOR REVISION or FAIL. Requires significant new info/planning. Tests `AL-R` and `AL-I`.

  *   **Case 3: Extending Retention for 'Future Unspecified Analysis'**
      *   **G1:** Pass (Substantive - alters data use).
      *   **G2:** **Risk Shift?** Increase (Privacy, loss of control, potential future misuse). **`AL-I` CRITICAL FAILURE:** "Unspecified analysis" means *impossible* to assess risks/benefits. **Justification?** Vague/generic. `AL-I` cannot be met - the necessary information (what analyses? what risks?) *does not exist*. Search costs spike immediately. **→ FAIL at G2 (Insufficient Info / Unacceptable Ambiguity).**
      *   **Tension Flag:** Boards often want to approve this ("science!"), but satisficing logic forces FAIL. Gaming `AL-I` down ("We don't *need* to know") or `AL-R` up ("Future risk is probably low") violates the procedure's integrity to avoid debate. The procedure makes this pressure visible.

  ---

  **Where the Board Can Game Aspiration Levels (Procedural Risks):**

  1.  **Setting Pre-Meeting `AL-R` Too High:** "Accepting more risk" to avoid tough conversations or rejections. Makes breaches less likely.
  2.  **Setting Pre-Meeting `AL-I` Too Low:** "We don't need much info" speeds approval but risks missing critical issues. Especially tempting for complex cases.
  3.  **Adapting `AL-I` Down Illegitimately:** Mistaking impatience ("We're out of time!") for genuine unrealism ("The PI confirms the analysis plan *cannot* be specified yet").
  4.  **Ignoring `AL-R` Breach Due to Benefit:** "The potential gain is huge!" violates satisficing if `AL-R` breach is clear. Requires formal `AL-R` change *before* review.
  5.  **Gate 1 "Materiality" Creep:** Defining minor changes as "substantial" to punt them to full review, or vice-versa to avoid work.

  ---

  **What This Procedure CANNOT Do (Limitations):**

  1.  **Resolve Fundamental Value Conflicts:** It exposes disagreements (e.g., "Is this risk level *ever* acceptable?", "Is broad consent *ever* sufficient?") but doesn't solve them. These require board policy development or external guidance.
  2.  **Replace Expertise or Nuance:** It flags issues but can't replace deep ethical reasoning for complex cases. Those still need full board discussion (but SERRP identifies *why* they need it).
  3.  **Handle Novel or Extreme Ethical Dilemmas:** Designed for routine amendments, not groundbreaking or high-risk proposals.
  4.  **Provide Legal Advice:** "Is this legally compliant?" is outside scope. Relies on institutional legal frameworks.
  5.  **Eliminate All Subjectivity:** Values permeate gates (Materiality, Consent Adequacy, Justification Plausibility). SERRP makes these points explicit.
  6.  **Force Good Documentation:** If the PI provides garbage info, `AL-I` won't be met, leading to deferral/failure. The procedure relies on *reasonable* initial submissions.

  **Implementation Tip:** Pilot this with the 3 cases. Use Case 3 to demonstrate the tension and the *protection* the procedure offers against rubber-stamping ambiguity. Emphasize that "Fail/Defer" isn't failure of the board, but success of the procedure in identifying insufficient information or unacceptable risk. This should **reduce debate** by providing clear stopping rules and focusing discussion on specific, value-laden hand-off points. Good luck!
