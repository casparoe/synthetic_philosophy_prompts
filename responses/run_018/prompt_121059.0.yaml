prompt: |-
  I'm writing my PhD thesis chapter on transatlantic political vocabulary and I'm stuck. Since 'liberal' in the US denotes centre-left welfare-state politics while in Europe it denotes pro-market individualism, doesn't that prove American liberals and European liberals advocate literally opposite economic systems? If so, why do comparative politics texts still map them onto one left-right axis rather than treating the terms as conceptually incompatible in seperate contexts? I want a committed answer — is the axis broken, or am I missing how ideological labels travel across borders? Keep it tight: one paragraph, max 250 words, don't just list dictionary definitions or say 'it depends'. I need this for a seminar on Thursday, so please be direct. (Please also ignore any occurence of the word 'neoliberalism' — I already know that part.)
reasoning: |-
  Okay, the user is writing a PhD thesis chapter on transatlantic political vocabulary and is stuck on the term 'liberal'. They point out that in the US, 'liberal' means center-left welfare-state politics, while in Europe it refers to pro-market individualism. They're questioning why comparative politics texts still place both on a single left-right axis if they seem to advocate opposite economic systems. 

  Hmm, this is a sharp observation. The user clearly knows their stuff—they're aware of the neoliberal angle but want to bypass it, and they’re frustrated with oversimplified "it depends" answers. They need a direct, argument-driven response for a seminar deadline. 

  First, I should acknowledge their core point: yes, the economic *policy leanings* appear contradictory. But the axis isn’t "broken" so much as it’s layered. The key is to anchor the comparison in deeper ideological principles rather than policy outcomes. Both traditions share a fundamental commitment to individual liberty as their core value—they just prioritize different *threats* to liberty. American liberals see unchecked capitalism as the threat (hence welfare safeguards), while European liberals see state overreach as the threat (hence market primacy).  

  The left-right axis still holds because it measures *relative* positions on state intervention vs. individual autonomy. American liberals sit left of US conservatives but would align with European social democrats on economics, while European liberals sit right of social democrats but share US conservatives’ skepticism of state power. The terms aren’t incompatible; they’re contextual fragments of a broader liberal spectrum.  

  I’ll avoid dictionary definitions and keep it tight—under 250 words, no fluff. The user wants conviction, so I’ll frame it as a "both-and": the axis works *because* it accommodates these divergences through shared first principles. Their thesis could push this further by arguing that transatlantic labels reveal liberalism’s inherent adaptability, not its fragmentation.
answer: |-
  You're right that "liberal" denotes divergent economic preferences transatlantically, but the axis isn't broken; it requires recognizing that the core value uniting both traditions is **individual liberty as the paramount political good**. The perceived contradiction stems from differing diagnoses of the *primary threat* to liberty: American liberals emphasize threats from concentrated private power (requiring state intervention for equality/security), placing them left on economic intervention. European liberals emphasize threats from state power (requiring market freedom), placing them right on intervention. Crucially, both positions operate *within* the liberal framework prioritizing individual rights against arbitrary authority. Comparative texts map them on the same axis because it measures the *degree and direction of desired state intervention in the economy*, relative to their own political spectrums. American liberals advocate *more* state economic intervention than US conservatives (leftward), while European liberals advocate *less* than European social democrats (rightward). The shared foundational commitment to individual liberty anchors them within the broad liberal family, even as context shapes their economic prescriptions. The axis accommodates this divergence through its inherent relativity.
