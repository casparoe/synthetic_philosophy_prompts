answer: |-
  Look, you're conflating ontology with explanation. Of *course* the predictive processing model identifies the mental representation *as* that specific, complex physical pattern – that's precisely *why* exclusion bites! When neuroscientists talk about "downward causation" from the mental representation, *what are they pointing to physically?* Just the very same causal chain of microphysical events: the precision-weighting altering synaptic efficacies, modulating signal propagation, driving further neural activity. The "downward" language is a *descriptive flourish*, a way of talking about the system's *functional organization* at a higher level of abstraction. But the real, concrete causal oomph – the energy transfer, the neurotransmitter release, the membrane potential changes – that's *all* physics, bottom to top. Every physical effect has a sufficient physical cause right there in the neurons. So yes, the mental property – being identical to that physical state – exists, but its *causal role* is preempted by its physical realizer. Neuroscientists use mental vocabulary because it's pragmatically indispensable for *tracking patterns* and *formulating hypotheses* about complex systems, not because it names some independent causal force elbowing aside the physics. It's about efficient description and understanding, not about adding ghostly extra pushes to an already causally closed physical world. The explanation is useful; the *causation* it seems to imply is redundant.
