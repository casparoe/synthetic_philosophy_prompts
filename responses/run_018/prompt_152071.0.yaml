  2. **Bounded Computation (BC):** Once you know observability isn't fatal, can agents with limited rationality still cooperate? This depends on PO. If under PO, cooperation is impossible, then BC is irrelevant. But if PO allows cooperation, then BC studies how robust it is. This requires computational complexity theory, which might need more specialized knowledge. However, approximate best responses could be explored with simulations (even without ML budget). Still, it's dependent on PO's outcomes.

  3. **AI Alignment Application (AL):** This is applied. It builds on solutions to PO and BC. If programs can't be verified or need full inspection, then hidden state deviations ruin the commitment device. But solving PO and BC first provides the foundation. AL is high-impact but might be premature without the others. However, if PO is resolved positively, AL could offer practical tools. But the group's expertise matters—philosophers might handle PO, while AL needs more comp-sci.

  So the dependency chain: PO must be addressed first. If it fails, the framework isn't viable, making BC and AL irrelevant. If PO holds, then BC explores robustness, which informs how to approach AL. AL relies on both.

