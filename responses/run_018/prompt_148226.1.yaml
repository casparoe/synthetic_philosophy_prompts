prompt: |-
  I serve on the capital-projects committee of a regional public-works authority, where we evaluate infrastructure proposals whose benefits fall decades or centuries apart: a flood-defense wall, a geological carbon-storage site, and long-lived containment systems. Our staff currently collapses every comparison into a net-present-value formula using market interest rates, but that conflates pure time preference—the philosophical claim that future welfare should not be weighted less merely because it occurs later—with risk premiums, capital scarcity, and uncertainty about future populations. I want you to operationalize the principle that pure temporal discounting is unjustified (while allowing that near and distant outcomes may still diverge for other reasons) into a reusable decision procedure that a non-economist board member can run in about twenty minutes per proposal, with clear sign-off authority resting with the committee chair. The deliverable should be a step-by-step flowchart in words: the ordered questions, what counts as a sufficient answer to continue, where the procedure halts with a recommendation, and where it explicitly hands the decision to a person because the issue is one of values rather than facts.

  Please construct the procedure so it separates adjustments for pure time preference from adjustments for physical risk, intergenerational equity, and the possibility that beneficiaries will not exist, then apply it to three cases: (a) a seawall with benefits concentrated in thirty years; (b) a carbon-capture and mineralization project whose climate benefits are measurable only after 120 years and require continuous cross-generational maintenance funding; and (c) a nuclear-waste containment retrofit that costs present taxpayers heavily but delivers safety benefits almost entirely beyond 200 years—a case where I expect the procedure will recommend funding yet the board will find the result politically intolerable. For each case show the procedural path and mark any point where judgment must override mechanics. Then identify two structural misfires—scenarios in which following the checklist mechanically yields a recommendation that clashes with common moral intuition—and clarify whether each misfire indicts the underlying principle or only this institutional translation. Be explicit about which steps are genuine tests and which are judgment calls disguised as boxes. End with a one-sentence summary on its own line beginning with 'Bottom line:' that states the single most important limitation of turning pure time preference into an institutional checklist.
reasoning: |-
  We are constructing a decision procedure that avoids pure time preference (i.e., not discounting merely because benefits are in the future) but allows for adjustments for:
  1. Physical risk (e.g., the chance that the project fails or the benefit doesn't materialize)
  2. Intergenerational equity (how the burden and benefits are distributed across generations)
  3. The possibility that the future beneficiaries might not exist (e.g., due to extinction, migration, etc.)

  The procedure must be executable by a non-economist in about 20 minutes per proposal and have clear sign-off by the committee chair.

  The procedure will be a flowchart in words with the following structure:

  Steps:
  1. **Question 1: Is the project's primary benefit period within 30 years?**
     - If YES: Proceed to Step 2.
     - If NO: Proceed to Step 3.

     *Rationale: We are separating near-term from long-term projects. For projects with benefits within 30 years, we might be less concerned about intergenerational issues and more about standard risk.*

  2. **Question 2 (for near-term): Is the project exposed to significant physical risks (e.g., construction failure, natural disaster) that could prevent benefits?**
     - If YES: Apply a risk adjustment (e.g., reduce expected benefits by the probability of failure) and then calculate net present value without pure time discounting (i.e., use a discount rate of 0% for pure time preference, but adjust for risk). Then proceed to Step 5.
     - If NO: Calculate net present value without any discounting (0% for pure time preference) and proceed to Step 5.

  3. **Question 3 (for long-term): Is the project's primary benefit period beyond 100 years?**
     - If YES: Proceed to Step 4.
     - If NO (i.e., between 30 and 100 years): Apply a risk adjustment for the time period (using a risk-based discount rate that accounts for uncertainty, but not pure time preference) and then proceed to Step 5.

  4. **Question 4 (for very long-term): Does the project require continuous maintenance funding across generations?**
     - If YES: Then we must consider intergenerational equity and the risk of discontinuity. We break the project into two parts:
       a. The initial cost and the maintenance costs for the first 100 years: treat as a long-term project (Step 3: between 30-100 years) and apply risk adjustment.
       b. The benefits and costs beyond 100 years: apply an adjustment for the probability that the chain of maintenance breaks (e.g., due to societal collapse, loss of institutional knowledge, etc.). Also, consider intergenerational equity by ensuring that the burden on the present generation is not excessive relative to the benefits they receive and the benefits to the far future. This step requires a judgment call by the committee chair on whether the project is fair to the present and future generations. Then proceed to Step 5.
     - If NO (i.e., no continuous maintenance required, but benefits are very long-term): Apply an adjustment for the probability that the beneficiaries will not exist (e.g., due to extinction, migration, etc.) and then proceed to Step 5.

  5. **Step 5: Calculate the adjusted net present value (without pure time discounting) and compare costs and benefits.**
     - If the adjusted net benefits are positive: Recommend approval.
     - If the adjusted net benefits are negative: Recommend rejection.
     - If the adjusted net benefits are close to zero or uncertain: Hand the decision to the committee for a judgment call (values-based decision).

  However, note that Step 4 for very long-term projects with continuous maintenance requires a judgment by the chair on intergenerational equity. This step is explicitly a hand-off to a person.

  Now, we apply the procedure to the three cases:

  ### Case (a): Seawall with benefits concentrated in thirty years
  - Step 1: Benefits in 30 years? YES -> Step 2.
  - Step 2: Significant physical risks? (Assume we assess: yes, there is a risk of the wall being breached by an unprecedented storm.) 
    - Apply risk adjustment: reduce expected benefits by the probability of failure (say 10% chance of failure, so benefits reduced by 10%). Then calculate NPV with 0% pure time discounting. 
    - Proceed to Step 5: Compare adjusted benefits to costs. If positive, recommend approval.

  ### Case (b): Carbon-capture and mineralization project (benefits after 120 years, continuous maintenance)
  - Step 1: Benefits beyond 30 years? YES -> Step 3.
  - Step 3: Beyond 100 years? YES -> Step 4.
  - Step 4: Continuous maintenance? YES.
    - Break the project:
      - First 100 years: costs (maintenance) and maybe some co-benefits? (if any). Apply risk adjustment for that period (as per Step 3 for long-term: use risk-based discount rate for uncertainty, but 0% pure time).
      - Beyond 100 years: benefits (climate benefits) and maintenance costs. Adjust for the probability that maintenance chain breaks (say 20% chance per century? But we need to estimate). Also, intergenerational equity: the chair must judge if the burden on the present (and near future) for maintenance is fair given the benefits to the far future. If the chair deems it unfair, the project may be rejected on equity grounds even if the numbers are positive. Otherwise, proceed to Step 5.
    - Then Step 5: Calculate adjusted NPV. If positive and chair approves equity, then approve.

  ### Case (c): Nuclear-waste containment retrofit (benefits beyond 200 years, no continuous maintenance? The problem says "delivers safety benefits almost entirely beyond 200 years". It doesn't specify maintenance, so we assume no continuous maintenance beyond the initial retrofit.)
  - Step 1: Beyond 30 years? YES -> Step 3.
  - Step 3: Beyond 100 years? YES -> Step 4.
  - Step 4: Continuous maintenance? NO. 
    - Then we adjust for the probability that the beneficiaries might not exist (e.g., human extinction, or migration from the area). Let's say we estimate a 1% chance per century that the beneficiaries are gone, so over 200 years, the probability that the benefit is realized is (0.99)^2 = 98.01%. We reduce the expected benefits by 1.99%. Then proceed to Step 5.
  - Step 5: Calculate adjusted NPV (with 0% pure time discounting). The cost is heavy on present taxpayers, but the (adjusted) benefits are still very large (because avoiding a nuclear disaster is huge). So adjusted NPV is positive -> recommend funding.

  However, the board might find it politically intolerable because present taxpayers bear the cost and benefits are 200+ years away. The procedure does not account for political constraints because we are following the principle of no pure time preference. The chair must note that the procedure recommends funding, but the board can override based on political realities (which are values-based). This override is not in the procedure, but the procedure does have a step (Step 5) for when adjusted NPV is positive but the committee might still reject if the numbers are close or uncertain. In this case, the NPV is positive and likely large, so the procedure forces a recommendation for approval. The political intolerability must be handled outside the procedure by the board (as a values-based override).

  ### Structural Misfires

  1. **Misfire 1: The 'Last Generation' Problem**
     - Scenario: A project that provides enormous benefits to the very last generation of humans (say, in 500 years) but at a modest cost to the present. The probability of human extinction is high over 500 years, so the adjustment for non-existence might reduce the expected benefit to near zero. The procedure would then reject the project. However, common moral intuition might say that if there is any chance of a last generation, we should help them, especially if the cost is modest.
     - Indictment: This misfire indicts the underlying principle of adjusting for the probability of non-existence because it turns a moral duty to the possible future into a cold probability. However, the procedure is operationalizing the idea that we shouldn't spend resources on benefits that won't occur, so it might be consistent. But the misfire arises because the adjustment might be too crude.

  2. **Misfire 2: The 'Unfair Burden' Problem**
     - Scenario: A project that requires massive sacrifice from the present generation (e.g., deep poverty for 50 years) to provide a benefit to a far-future generation that will be extremely wealthy. The procedure (in Step 4 for continuous maintenance) would have the chair judge intergenerational equity. But if the chair is not sensitive to the distributional issue, the procedure might approve the project because the adjusted NPV is positive (if the future benefit is large enough). However, common moral intuition would reject making the present poor even poorer for the sake of a richer future.
     - Indictment: This misfire does not indict the underlying principle (which does allow for intergenerational equity considerations) but the institutional translation. The procedure relies on the chair's judgment at Step 4, and if the chair fails to account for the relative wealth, the procedure goes astray.

  ### Genuine Tests vs. Judgment Calls
  - **Genuine Tests**: 
    - Step 1 (time horizon): factual.
    - Step 2 (physical risk): factual (based on engineering reports, etc.).
    - Step 3 (time horizon): factual.
    - Step 4 (continuous maintenance): factual.
    - Step 5 (NPV calculation): mechanical (if we have the numbers).

  - **Judgment Calls Disguised as Boxes**:
    - In Step 4, when we break the project for continuous maintenance, the intergenerational equity judgment by the chair is a judgment call.
    - Also, in Step 4, the adjustment for the probability of non-existence (for very long-term without maintenance) requires an estimate of the probability of extinction/migration, which is highly uncertain and thus a judgment call.
    - In Step 5, when the NPV is close to zero and we hand the decision to the committee, that is a judgment call.

  Bottom line: The most important limitation is that reducing complex intergenerational ethics to a checklist inevitably oversimplifies moral dimensions that require deliberative democratic engagement.
answer: |-
  ### Decision Procedure Flowchart for Intergenerational Capital Projects

  **Principles Embedded**:
  - Zero pure time preference: Future welfare is not discounted merely due to temporal distance.
  - Adjust only for: (1) Physical risk (failure probability), (2) Intergenerational equity (burden/benefit fairness), (3) Beneficiary existence uncertainty (extinction/migration risk).
  - Committee chair has final sign-off on judgment calls (marked ⚖️).

  ---

  **Step-by-Step Procedure**:

  1. **Question A: Does the project’s primary benefit occur within 30 years?**  
     - *Sufficient answer*: Yes/no based on project documentation.  
     - **Yes** → Proceed to **Question B**.  
     - **No** → Proceed to **Question C**.  

  2. **Question B (Near-term): Is there >10% probability of physical failure (e.g., structural collapse, environmental disruption) before benefits accrue?**  
     - *Sufficient answer*: Yes (if engineering/risk reports indicate non-negligible failure risk) or no (if robust/safe).  
     - **Yes** → Apply physical risk adjustment: **Reduce benefits by the estimated failure probability** (e.g., 15% failure risk = multiply benefits by 0.85). Proceed to **Step 5**.  
     - **No** → Proceed to **Step 5** (no adjustment).  

  3. **Question C (Long-term): Does the project require continuous funding/maintenance across generations?**  
     - *Sufficient answer*: Yes (e.g., ongoing monitoring, replenishment) or no (e.g., one-time build with passive safety).  
     - **Yes** → Proceed to **Question D**.  
     - **No** → Proceed to **Question E**.  

  4. **Question D (Continuous maintenance): Does the burden on present generations exceed 5% of annual public-works budget?**  
     - *Sufficient answer*: Quantitative cost assessment.  
     - **Yes** → ⚖️ **Chair judgment on intergenerational equity**: Is the burden proportionate to (a) near-term co-benefits (e.g., jobs, R&D spillovers) and (b) the project’s symbolic value to future societies?  
       - If chair deems **unfair** → **Recommend rejection**.  
       - If chair deems **fair** → Proceed to **Question E**.  
     - **No** → Proceed to **Question E**.  

  5. **Question E (Existence uncertainty): Over the benefit period, is cumulative extinction/migration risk >20%?**  
     - *Sufficient answer*: Yes (if demography/climate models show high dislocation) or no (if stable population projections).  
     - **Yes** → Apply existence adjustment: **Reduce benefits by the estimated risk** (e.g., 25% risk = multiply benefits by 0.75). Proceed to **Step 5**.  
     - **No** → Proceed to **Step 5**.  

  6. **Step 5: Calculate risk/equity-adjusted net present value (NPV) using 0% pure time discount rate.**  
     - NPV = (Adjusted benefits) - (Costs), with benefits/costs in constant currency.  
     - **NPV ≥ 0** → **Recommend approval**.  
     - **NPV < 0** → **Recommend rejection**.  
     - **Close to zero (±5% of costs)** → ⚖️ **Committee deliberation** (values-based trade-offs).  

  ---

  ### Application to Cases  
  *(Assumptions: Market discount rate = 4%; all costs in present USD; benefits monetized per authority’s models)*  

  **Case (a): Seawall (benefits in 30 years)**  
  - **A**: Benefits in 30 years? **Yes** → **B**.  
  - **B**: >10% failure risk? Assume **yes** (coastal erosion risk = 20%) → Benefits reduced to 80%.  
  - **Step 5**: NPV(0%) = ($80M adjusted benefits) - ($50M costs) = **+$30M → Approve**.  
  - *Path*: A → B → Step 5 (no judgment overrides).  

  **Case (b): Carbon Storage (benefits in 120 years, continuous maintenance)**  
  - **A**: No → **C**.  
  - **C**: Continuous maintenance? **Yes** → **D**.  
  - **D**: Burden >5% budget? Assume **yes** (annual upkeep = 7% budget) → ⚖️ **Chair equity check**.  
    - Chair weighs: Minimal near-term co-benefits vs. climate symbolism. **Judgment: Fair** (symbolic value high) → **E**.  
  - **E**: Existence risk >20%? Assume **yes** (30% societal collapse risk) → Benefits reduced to 70%.  
  - **Step 5**: NPV(0%) = ($700M adjusted benefits) - ($400M costs) = **+$300M → Approve**.  
  - *Path*: A → C → D (chair override: fair) → E → Step 5.  

  **Case (c): Nuclear Waste Containment (benefits >200 years)**  
  - **A**: No → **C**.  
  - **C**: Continuous maintenance? **No** (passive containment) → **E**.  
  - **E**: Existence risk >20%? Assume **no** (stable site, 10% risk) → No adjustment.  
  - **Step 5**: NPV(0%) = ($10B benefits) - ($8B costs) = **+$2B → Approve**.  
  - *Political intolerability*: Procedure forces approval due to high absolute benefits. Chair must override at **Step 5** if board rejects (values-based), but flowchart **does not allow it**—highlighting rigidity.  

  ---

  ### Structural Misfires  
  1. **Misfire 1: The "Starving Present" Scenario**  
     - *Scenario*: A project costing $1B now saves 1 billion future lives in 300 years. Existence risk is 15% (<20% threshold), so no adjustment. NPV(0%) = +$∞ → **Approve**.  
     - *Clash*: Intuition rejects impoverishing the present for distant lives when current needs are urgent.  
     - *Indictment*: **Institutional translation**—fails to cap present burdens (Step D only checks continuous maintenance, not one-time costs).  

  2. **Misfire 2: The "Guaranteed Extinction" Scenario**  
     - *Scenario*: A project benefits humanity in 500 years, but extinction risk is 99%. Existence adjustment reduces benefits to ~0 → **Reject**.  
     - *Clash*: If the project *prevents* extinction (e.g., asteroid defense), intuition demands approval.  
     - *Indictment*: **Underlying principle**—existence adjustment ignores moral distinction between *causing* vs. *preventing* extinction.  

  ---

  ### Genuine Tests vs. Judgment Calls  
  - **Genuine Tests**:  
    - Question A, B, C, E (binary thresholds based on data).  
    - NPV calculation (mechanical math).  
  - **Judgment Calls Disguised as Boxes**:  
    - Question D (equity): "Proportionate burden" is subjective; chair’s values dominate.  
    - Existence risk (Question E): Estimating extinction risk is speculative, not factual.  

  ---

  Bottom line: **The checklist cannot resolve conflicts between present sacrifice and future gain without imposing opaque value judgments in its thresholds, risking democratic legitimacy.**
