  The audience will be challenging - analytic aestheticians and critical theorists who see intrinsic value as outdated and suspect defenses of "useless" art as elitist. They'll likely object through lenses of power, institutional framing, and metaphysics of presence. The user wants me to prepare them for these objections by ordering them by likelihood and damage potential. For each objection, I need to provide how it would be phrased, what parts are strong and should be conceded, possible rebuttals with their weaknesses, identify the crucial reply that must land, and reveal the objection they're secretly dreading.

  I should structure this carefully: bottom line first, then reasoning, all within 450 words in British English. The key objections I anticipate are about institutional mediation being primary rather than intrinsic value, concerns about elitism in valuing "useless" art, problems with intuitionism as a method, and worries about smuggling in metaphysics of presence.

  For institutional mediation, the strongest point is how institutions shape our perception of value, which I should acknowledge. For elitism, I'll note that Moore's framework might inadvertently support exclusionary practices. The intuitionism objection targets Moore's reliance on self-evident truths which contemporary theorists reject. The metaphysics concern questions whether affective fundamentality assumes a pre-social reality critics would dispute.

