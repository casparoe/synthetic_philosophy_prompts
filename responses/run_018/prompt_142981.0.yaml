answer: |-
  Here’s a strict specification for a theory of music’s metaphysical status, structured around your non-negotiable requirements and tensions:

  ---

  ### **Core Desiderata for a Theory of Music’s Metaphysical Status**  
  1. **Direct Embodiment of Pre-Representational Force**  
     - *Must Deliver:* Explain how music conveys raw *feeling* (e.g., urgency, tension, ecstasy) prior to semantic or symbolic interpretation.  
     - *Motivating Case:* A listener weeping at a Chopin prelude without understanding its structure or cultural context.  
     - *Tension With:* Predictive processing (#3) – if perception is prediction-driven, how is "directness" possible?  

  2. **Non-Collapse of Programmatic vs. Absolute Music**  
     - *Must Deliver:* Distinguish how Beethoven’s *Pastoral* (programmatic) evokes bucolic scenes *differently* from his *Fifth Symphony* (absolute), which evokes struggle abstractly.  
     - *Motivating Case:* Program music leans on narrative association; absolute music’s affect must arise from sonic architecture alone.  

  3. **Compatibility with Predictive Processing**  
     - *Must Deliver:* Acknowledge that auditory cortex constantly generates/updates expectations (e.g., resolving cadences), yet avoids reducing music to mere pattern-matching.  
     - *Motivating Case:* The "groove" in funk music exploits rhythmic prediction errors while feeling viscerally immediate.  
     - *Tension With:* Schopenhauer’s "pure immediacy" (#1) and atonal efficacy (#4).  

  4. **Explanatory Power for Dissonance/Atonality**  
     - *Must Deliver:* Account for why Berg’s *Wozzeck* (atonality) or Hendrix’s distorted chords provoke visceral unease/arousal despite violating tonal expectations.  
     - *Motivating Case:* Dissonance as "violated expectation" fails – atonal music *uses* cognitive disruption as an affective tool.  
     - *Tension With:* Universality claims – if music mirrors "Will," why does culturally novel syntax work?  

  ---

  ### **Key Tensions Between Desiderata**  
  - **(1) Directness vs. (3) Predictive Processing:** Predictive models imply *mediation* by prior learning; Schopenhauer’s directness rejects mediation.  
  - **(1) Universality vs. (4) Atonal Efficacy:** If music embodies universal Will, why does culturally/historically contingent music (e.g., post-serialism) move us?  
  - **(3) Prediction vs. (4) Expectation Violation:** Predictive processing prizes resolution; atonability weaponizes irresolution. How can both be "direct"?  

  ---

  ### **Evaluation of Existing Frameworks**  
  **Schopenhauer’s View**  
  - *Strengths:* Nails #1 (music as Will’s copy), partially addresses #4 (dissonance mirrors Will’s strife).  
  - *Failures:* Fails #2 (calls all music "absolute," ignoring programmatic mediation). Ignores #3 (no predictive/cognitive mechanism). Struggles with #4 (atonality as "chaos" undermines Will’s universality).  

  **Modern Embodied Cognition Account**  
  - *Delivers:*  
    - **#1:** Affective resonance via physiological entrainment (e.g., rhythm syncing heartbeat, dissonance triggering stress responses).  
    - **#2:** Program music scaffolds meaning via embodied metaphor (e.g., "ascending" melodies feel like effort); absolute music operates via dynamical affordances (e.g., tension/release as somatic patterns).  
    - **#3:** Predictive processing is *scaffolded* by bodily states – expectation errors generate arousal (e.g., rhythmic surprise as "felt" disruption).  
    - **#4:** Dissonance/atonality exploits embodied tension (e.g., spectral clashes mimic biological alarm signals), bypassing learned syntax.  
  - *Gaps:* Needs tighter metaphysics linking embodiment to abstract affect (e.g., why does *this* cluster evoke dread, not anger?).  

  ---

  ### **Conclusion**  
  A viable theory must treat music as a **bio-cognitive interface**: predictive enough to engage the brain’s expectation machinery (#3), but "direct" by hacking evolved somatic responses (#1, #4). Programmatic vs. absolute distinctions (#2) emerge from degree of sensorimotor scaffolding. Schopenhauer’s intuition holds if "Will" is reconfigured as **affective neurobiology** – but his idealism must be replaced with embodied dynamics.
