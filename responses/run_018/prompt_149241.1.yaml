answer: |-
  ## Hotel Infinity: Ledger Unsealed

  The ink should dry where every guest is placed.  
  *The book stays open; no final page is turned.*  
  "Assign by rule," the Cantorist has traced.  

  The manager, by endless duties chafed,  
  Sees arrivals surge where no vacancy's discerned.  
  The ink should dry where every guest is placed.  

  "Guest *n* to room *2n*," a plan embraced,  
  A map defined before the bus has burned.  
  *The book stays open; no final page is turned.*  

  Yet finitists see boundlessness defaced  
  By hands that write yet leave no entry earned:  
  The ink should dry where every guest is placed.  

  Each fixed assignment seems forever chased  
  By new arrivals for whom space is spurned.  
  *The book stays open; no final page is turned.*  

  The rule defines a stay that can't be faced  
  In real time – execution unconcerned  
  With pure intent. The manager, disgraced,  
  Knows definitions leave no stay confirmed:  
  **The ink should dry where every guest is placed.**  
  ***The book stays open; no final page is turned.***

  ---

  **Philosophical Note:**

  This poem takes specific interpretive stances:
  1.  **Finitism & Intension:** It presents the strict finitist critique as denying that an *intensional definition* (the rule "guest *n* to room *2n*") constitutes the *execution* or *completion* of an infinite assignment. The finitist objection here is not necessarily that the rule is incoherent *as a rule*, but that it fails to achieve a definite, closed, physical record ("no entry earned," "execution unconcerned / With pure intent"). This emphasizes the practical/physical metaphor over a purely logical denial of the rule's abstract coherence.
  2.  **Cantor & Definition:** It portrays the Cantorian ("actualist") position primarily as resting on the *definition* of the mapping ("'Assign by rule,' the Cantorist has traced," "A map defined"). While Cantor's work is deeply ontological (asserting the *existence* of infinite sets and bijections), the poem focuses on the *definitional act* as the Cantorian response to the challenge of completion, contrasting it directly with the finitist demand for executed physical closure. It abstracts away Cantor's stronger metaphysical claims about the existence of completed infinities *as such*, presenting his solution operationally through the definable rule. The finitist counters by insisting definition ≠ physical completion in the ledger.

  The poem's core tension lies in this juxtaposition: the definability vs. the physical executability/completion of the infinite assignment, explored through the metaphor of the hotel ledger.
