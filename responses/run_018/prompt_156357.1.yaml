answer: |-
  Here’s a detailed session plan designed to make participants **experience** the rise and collapse of symmetric ("superrational") reasoning. It uses no lectures—just guided activities—and fits 90 minutes. The key innovations are the **Reasoning Mirror** (to expose symmetry-breaking predictions) and **Hidden Empties** (to simulate the lottery’s knowledge gap).

  ---

  ### **Session Structure**  
  **Total Time:** 90 minutes (Platonia: 40 min; Lottery: 35 min; Debrief: 15 min)  
  **Materials:**  
  - Paper slips, pens, envelopes (20 sealed, 3 secretly empty), a bag, token point chips.  
  - Scoreboard to track points. Session winner (most points) skips buying coffee.  

  ---

  ### **Part 1: Platonia-Style Dilemma (40 min)**  
  *Goal: Feel the pull of symmetric reasoning in a coordination game.*  

  1. **Setup (5 min)**  
     - Randomly pair 10 participants into 5 pairs (if odd, one triad; adjust payoffs proportionally).  
     - Hand each player a slip. **Rules (verbally):**  
       *“You and your partner choose **A** or **B** privately. Payoffs:*  
       - *Both choose B: 100 points each.*  
       - *Both choose A: 1 point each.*  
       - *Mismatch (A/B): A gets 101, B gets 0.*  
       *Write your choice AND predict your partner’s choice. No talking.”*  

  2. **Choice & Prediction (5 min)**  
     - Players write:  
       - `Choice: [A/B]`  
       - `Prediction: Partner chooses [A/B]`  
     - Slips collected immediately.  

  3. **Reveal & "Reasoning Mirror" (20 min)**  
     - **Reveal choices first:** For each pair, announce choices and payoffs.  
     - **Then reveal predictions:** Show predictions alongside choices.  
     - **Key observations (facilitator asks):**  
       - *“Who chose B? Why?”* (Likely: “I assumed my partner would too.”)  
       - *“Who predicted correctly? Did your prediction match your choice?”*  
       - *“If you chose A, did you predict B? Why?”* (Highlight exploitation intent.)  
     - **Pattern to expose:** Players who chose B likely predicted B (symmetry assumption). Those who chose A predicted B (hoping to exploit).  

  4. **Token Points Awarded (10 min)**  
     - Award points based on outcomes. Track on scoreboard.  
     - *Example:* Both B → 100 each; Mismatch → 101 for A, 0 for B.  

  ---

  ### **Part 2: Luring Lottery Analog (35 min)**  
  *Goal: Feel symmetric reasoning collapse when individual luck dominates.*  

  1. **Setup (5 min)**  
     - Show a bag with 20 sealed envelopes. **Rules (verbally):**  
       *“Each envelope costs 1 token to draw. 17 contain a ‘win’ slip (10 points). 3 are empty.*  
       *You may buy **one** envelope. Pay 1 token, draw, but don’t open yet.*  
       *If you don’t buy, you keep your tokens.*”  

  2. **Draw Phase (10 min)**  
     - Players privately decide: **Buy** or **Pass**.  
     - Collect 1 token from buyers, hand them a random envelope.  
     - *Critical twist:* **Don’t reveal empties yet.**  

  3. **Reasoning Tension (5 min)**  
     - **Ask:** *“Why did you buy? Would you buy if you could buy all envelopes?”*  
     - **Expected responses:**  
       - *“Yes, buying all guarantees 170 points! But I can only buy one.”*  
       - *“I bought because 17/20 chance is good.”*  
     - **Symmetric nudge:** *“If everyone reasons the same, should all buy?”* (Yes, but point collapse is coming.)  

  4. **Reveal & Collapse (15 min)**  
     - **Open envelopes:** Buyers reveal slips/empties.  
     - Award 10 points to win slips. Empty = 0.  
     - **Key observations (facilitator asks):**  
       - *“How many buyers won? Lost?”* (3 lose 1 token; 17 gain 9 net.)  
       - *“Did symmetric reasoning work here? Why not?”*  
       - *“If you knew about the empties, would you still buy?”* (Likely: “Yes, but I’d resent the hidden risk.”)  

  ---

  ### **Debrief: Why Symmetry Succeeds Then Fails (15 min)**  
  - **Name the concepts:** “This was a **Platonia dilemma** (Part 1) and a **Luring Lottery** (Part 2).”  
  - **Map the insights:**  
    - **Reasoning Mirror (Platonia):** Predictions showed **assumed symmetry** (B-choosers predicted B). When predictions matched, coordination succeeded. Mismatches revealed **broken common knowledge** (e.g., “I thought they’d be symmetric, but they defected”).  
    - **Hidden Empties (Lottery):** The unknown losers destroyed symmetry. *“Symmetric reasoning says ‘buy all,’ but you can’t—and the hidden asymmetry (empties) means luck dominates. You’re not in a symmetric world anymore.”*  
  - **Social vs. Solitary Gap:** Acknowledge the limit:  
    - *“In class, social presence influences you—e.g., clustering predictions to ‘look rational.’ But the lottery’s original paradox assumes **pure solitary reasoning**: alone, you’d realize buying all tickets is rational. Here, you can’t act collectively, and hidden empties simulate the unpredictability of real lotteries.*  
    - *“We can’t replicate true solitude, but feel how the hidden information shatters symmetry.”*  

  ---

  ### **Predictable Breakdowns & Solutions**  
  - **Envelope tampering:** 1–2 players may try to feel envelope thickness.  
     - *Mitigation:* Use uniform envelopes/slips. If caught, say: *“Real lotteries hide info—this is part of the design.”*  
  - **Mirror prediction clustering:** Players might predict B en masse to appear “rational.”  
     - *Use:* Highlight this in debrief—”Did anyone avoid predicting A to fit in?”—to show social pressure breaks symmetry.  
  - **Lottery frustration:** Losers may blame “unfair” empties.  
     - *Leverage:* “This frustration mirrors why symmetric reasoning fails—you can’t control hidden asymmetries.”  

  ### **Why This Works**  
  - **Experience > Lecture:** They *feel* the symmetry in Platonia (mutual B feels great) and its collapse in the lottery (buying feels risky).  
  - **Minimalism:** Paper/envelopes create physical stakes (token points + coffee prize).  
  - **Discovery:** Rules are revealed procedurally; terms like “superrationality” wait for debrief.  

  This design makes abstract concepts visceral. The social layer adds realism (e.g., prediction clustering), though it diverges from pure solitary reasoning—which you rightly flagged as the irreproducible element.
