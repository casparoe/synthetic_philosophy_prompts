          - The common-knowledge gap: in the lottery, even if they all want to be the only buyer, they can't coordinate. The symmetric reasoning (all not buying) avoids the worst symmetric outcome (all buying and losing) but leaves the potential gain (99) on the table.

     **Injection of new element: reasoning mirror**

          We do it in the Platonia round. We don't do it in the lottery? We could, but we don't. We focus on the decision.

     **Debrief:**

          - Map the mirror failure: in Platonia, the predictions might have shown that players assumed symmetry (if they chose B, they predicted B). But in the lottery, they didn't have a prediction? We didn't ask for one.

          - We could ask in the lottery: how many buyers do you predict? But that might be too much.

          - Instead, in the debrief, we can ask: in the lottery, did you assume that others would do the same as you? If you decided to buy, did you assume that others would also buy? (Then you would lose.) Or did you assume that others would not buy? (Then you would win.) 

          - The common knowledge gap: in symmetric games, common knowledge of rationality and symmetry might lead to superrational outcomes. But in the lottery, the rules break the symmetry by requiring exactly one buyer. So the symmetric outcome (all do the same) is either all buy (lose) or all don't (0). The asymmetric outcome (one buys, others don't) is better for the group but requires breaking symmetry, which isn't allowed in superrationality.

     **Final note:**

          We don't call it Platonia or superrationality until the debrief.

