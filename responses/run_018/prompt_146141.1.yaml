prompt: |-
  I'm prepping questions for a podcast interview with a philospher who defends this view she calls tiered disquotationalism — basically 'true' is just a deflationary device for atomic sentences, but for negative existentials and universal claims over infinite domains she admits a minimal correspondence role because there's no concrete token to disquote. I want maybe seven or eight questions that stay in the weeds, not generic intro stuff. At least one should press her on why the atomic-vs-general boundary doesn't collapse into full correspondence theory once you allow it for universals, with a follow-up keyed to her usual reply that it's just a scope ambiguity. Another one should tackle the liar paradox: she tends to dismiss it as a pragmatic failure of assertion rather than a semantic contradiction, so I need the follow-up that asks whether that move secretly smuggles in a hidden correspondence condition for self-referential sentences. Also ask something about mathematical truth — like is 'there is no largest prime' true just because there's no counterexample token, or because the infinite domain genuinely lacks one? — and end with a question about whether a small language model trained only on her atomic sentences could ever learn her generalization rule without implicitly representing the correspondence relation she's trying to avoid. Please include an occassion where you anticipate her deflecting with a standard reply and then push back hard.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who advocates "tiered disquotationalism." This is a nuanced position where 'true' works deflationarily for atomic sentences but requires minimal correspondence for negative existentials and universal claims over infinite domains. The user wants seven or eight in-depth questions that avoid introductory material. 

  First, I need to understand the core tension in tiered disquotationalism. The philosopher admits correspondence for cases where there's no concrete token to disquote, which seems to create a boundary problem. The user specifically wants to press on why this boundary doesn't collapse into full correspondence theory. They mention her "scope ambiguity" reply as her standard deflection, so the question must anticipate that and push back hard. 

  The liar paradox is another key area. The philosopher dismisses it as a pragmatic failure rather than a semantic contradiction. The user wants to uncover if this smuggles in hidden correspondence conditions for self-referential sentences. This requires constructing a question that forces her to confront whether her pragmatic solution implicitly relies on semantic constraints she elsewhere rejects. 

  Mathematical truth is a third pillar. The example given ("there is no largest prime") probes whether truth derives merely from absence of counterexamples or requires genuine properties of an infinite domain. This exposes whether her "minimal correspondence" is truly minimal or substantive. 

  Finally, the language model question is brilliant - it tests if her generalization rule can be learned without implicitly representing correspondence. This attacks the psychological plausibility of her view. 

  The user clearly knows her work well (citing her "scope ambiguity" deflection) and wants forensic questions that expose vulnerabilities. They're not seeking clarifications but aiming for live debate pressure. I should structure each question with: 
  - Precise setup quoting her terms 
  - Concrete examples 
  - Anticipated deflection 
  - Aggressive but fair pushback 

  For the boundary collapse question, I'll need to: 
  1. State the problem plainly: allowing correspondence for universals seems to infect all truth. 
  2. Pre-empt her scope ambiguity defense by applying it to a universal claim she'd concede requires correspondence. 
  3. Push back by showing how even atomic truths in infinite domains (like "every star has planets") inherit correspondence via her own logic. 

  The liar paradox follow-up must: 
  - Grant her pragmatic dismissal 
  - Then construct a self-referential sentence that explicitly avoids assertion (e.g., "This sentence is not true") 
  - Demand why it's contradictory if truth is merely disquotational 

  Mathematical truth needs to pressure the "no counterexample token" vs "domain genuinely lacks property" distinction. The pushback should ask if the infinite domain's structure itself corresponds to mathematical reality. 

  The AI question should be last - it's a knockout punch if her theory can't explain how humans learn truth without correspondence. 

  Tone is crucial: academically rigorous but podcast-ready (no jargon without explanation). Each question should stand alone but collectively form a logical progression from boundary collapse to learnability.
answer: |-
  Here are eight tightly focused questions probing the fault lines of tiered disquotationalism, designed to push the discussion beyond exposition and into substantive philosophical debate, complete with anticipated deflections and hard pushbacks:

  1.  **The Boundary Problem & Scope Ambiguity:**
      *   *Question:* "You argue that 'true' is purely disquotational for atomic sentences ('Snow is white') but requires minimal correspondence for universal quantifications over infinite domains ('All ravens are black'). Why doesn't admitting correspondence for the universal claim *immediately* infect the truth of the atomic instances? Doesn't 'All ravens are black is true' (requiring correspondence) ultimately depend on the truth of each instance 'Raven₁ is black', 'Raven₂ is black', etc.? If those instances rely *only* on disquotation, how does their collective truth *add up* to something requiring correspondence?"
      *   *Anticipated Deflection:* "Ah, that's a scope ambiguity! 'All ravens are black is true' doesn't mean the *same thing* as the conjunction of all instances being true. The universal claim quantifies over a domain; its truth condition is the absence of counterexamples in that domain, a different logical role."
      *   *Pushback:* "But doesn't the *justification* for asserting the universal claim *always* reduce to the disquotational truth of observed instances plus an inductive step? If the truth of the instances is *only* disquotational (no worldly 'fit'), and the inductive step is justified pragmatically or logically, why does the *truth predicate itself* applied to the universal suddenly acquire a correspondence component? Isn't the 'absence of counterexamples' just a *consequence* of the disquotational truths of the instances and the logic of quantification, rather than a *distinct truth-making relation*?"

  2.  **Negative Existentials and "No Token":**
      *   *Question:* "For negative existentials like 'Vulcan doesn't exist,' you invoke minimal correspondence because there's no concrete token ('Vulcan') to disquote. But isn't the *falsity* of the atomic existential claim 'Vulcan exists' sufficient? Why is 'Vulcan doesn't exist is true' anything more than the disquotational falsehood of 'Vulcan exists'? What *additional work* is the correspondence relation doing here that disquotation plus negation can't handle?"
      *   *Follow-up if needed:* "If correspondence is needed because 'Vulcan' fails to refer, doesn't this mean the truth condition for *any* sentence involving a non-referring term (even atomic ones like 'Vulcan is hot') must implicitly involve a correspondence check on reference *before* disquotation can even apply? Doesn't this collapse the atomic/disquotational tier?"

  3.  **Liar Paradox & Pragmatic Dismissal:**
      *   *Question:* "You dismiss the Liar sentence (L: 'L is not true') as a pragmatic failure of assertion rather than a genuine semantic contradiction. But consider this variant: 'This sentence is not true.' uttered by nobody, simply considered as a meaningful string. It seems semantically contradictory *without* any act of assertion. If truth is fundamentally disquotational for atomic claims, and this sentence *is* atomic (it predicates 'not true' of itself), why doesn't the disquotational schema T('P') iff P generate a straightforward contradiction *purely at the semantic level*? Doesn't your pragmatic move *presuppose* a hidden semantic constraint on self-reference that looks suspiciously like a correspondence condition – a requirement that the sentence must 'fit' a state where it *can* be coherently asserted?"
      *   *Anticipated Deflection:* "The string isn't assertible *because* attempting to apply the disquotational schema to it leads to pragmatic incoherence (a performative contradiction), revealing it lacks a stable truth condition. It's not a failure of 'fit', but of *meaningfulness in use*."
      *   *Pushback:* "But doesn't diagnosing the *source* of that pragmatic incoherence inevitably lead us back to semantics? The disquotational schema *itself*, when applied naively to this self-referential structure, *generates* the contradiction. Doesn't this suggest that the disquotational schema, as a principle governing truth, has *implicit scope restrictions* concerning self-reference? And aren't such restrictions *de facto* semantic rules about how language can 'hook onto' the world (or itself) without paradox, which *is* a form of correspondence constraint?"

  4.  **Mathematical Truth & Infinite Domains:**
      *   *Question:* "Take the mathematical claim 'There is no largest prime number.' You'd likely say its truth involves minimal correspondence because we're quantifying over an infinite domain (the natural numbers). Is the truth of this statement *solely* a consequence of there being no concrete counterexample token (a largest prime) to disquote? Or does its truth crucially depend on the *genuine structure and properties* of the infinite domain itself – that the naturals *genuinely possess* the property of allowing unbounded primes? If the latter, how is this 'genuine possession' different from robust mathematical Platonism and correspondence?"
      *   *Follow-up:* "If it's *just* the absence of a counterexample token, how do we rule out the possibility of an unknown largest prime *in principle* without appealing to the actual properties of the domain?"

  5.  **The Universality Aspiration:**
      *   *Question:* "A core motivation for deflationism is often the universality of 'true' – its role in blind endorsement ('Everything the Pope says is true') or generalizations ('All logical truths are true'). Doesn't tiered disquotationalism fracture this universality? Can 'Everything the Pope says is true' even be *stated* coherently within your view if the Pope might utter atomic sentences, universal generalizations, *and* negative existentials – each requiring different *kinds* of truth-making? Doesn't the truth predicate lose its essential unifying function?"

  6.  **The "Minimal" in Minimal Correspondence:**
      *   *Question:* "You describe the truth-maker for universals/negative existentials as 'minimal correspondence'. Can you precisely delineate what makes this correspondence *minimal* compared to robust correspondence theories? Specifically, does this minimal relation require *mind-independence*? If the infinite domain or the absence of Vulcan is mind-dependent (e.g., a conceptual construction), does that undermine the correspondence claim, or is it still 'correspondence-to-our-constructions'? How minimal can it be before it collapses back into a sophisticated form of deflationism or expressivism?"

  7.  **Grounding Generalization:**
      *   *Question:* "How does a language user *learn* or *grasp* the truth predicate for universal claims under your view? They master disquotation for atomic sentences ('Snow is white' is true iff snow is white). But when encountering 'All Fs are G is true', you say this *isn't* equivalent to the conjunction of all disquotational instances. What cognitive or linguistic step teaches them this *new*, correspondence-involving rule? Doesn't the very need for this distinct rule suggest the disquotational account is fundamentally *incomplete* for capturing our concept of truth?"
      *   *Follow-up:* "Could this rule be learned without the learner implicitly forming a representation of the *state of the world* (the domain lacking counterexamples) that the sentence must 'match'?"

  8.  **The AI Test (Learning the Rule):**
      *   *Question (Culminating Challenge):* "Imagine training a very small language model *only* on declarative atomic sentences labeled 'true' or 'false' based purely on disquotation (e.g., input: 'Snow is white', target: TRUE; input: 'Grass is purple', target: FALSE). Suppose it perfectly masters this disquotational 'truth' for atomics. If we then present it with a *novel* universal claim over an infinite domain it hasn't encountered before (e.g., 'All solutions to equation E are integers'), could this model *reliably* output the correct 'TRUE' or 'FALSE' *without* internally developing *some* representation approximating the state of the mathematical domain (e.g., patterns in solution sets, properties of the equation) – that is, without implicitly representing the very correspondence relation your 'minimal' tier introduces to avoid a collapse into full deflationism? If not, doesn't this suggest correspondence is psychologically and functionally fundamental, not just a minimal add-on?"

  **Key Design Principles Used:**
  *   **Specificity:** Questions directly reference her core theses (tiers, disquotation, minimal correspondence, scope ambiguity, pragmatic dismissal of Liar).
  *   **Pressure Points:** Target the boundary between tiers, the justification for minimal correspondence, the implications for paradox and mathematics, and the learnability/psychological reality of the distinction.
  *   **Anticipated Deflection + Pushback:** Explicitly modeled for the core boundary and Liar questions.
  *   **Concrete Examples:** Used throughout (ravens, Vulcan, Liar variants, prime numbers, Pope, AI training).
  *   **Progressive Logic:** Starts with the core boundary issue, moves through paradox and math, challenges universality and minimality, probes grounding, and ends with the functional/psychological challenge of the AI test.
  *   **"In the Weeds":** Avoids "What is tiered disquotationalism?" Focuses on tensions, implications, and objections internal to the view.

  These questions should provoke a deep and revealing discussion, forcing clarification and defense of the most contentious aspects of the position. Good luck with the interview!
