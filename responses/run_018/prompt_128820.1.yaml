  We are producing a joint statement from two theoretical camps in the study of cooperation: the rational-choice evolutionary-game theorists (henceforth "Rationalist") and the cultural-institutional theorists (henceforth "Culturalist"). The statement will include agreed claims, a table of disagreements, three cruxes with agreed evidence and explicit predictions, and an assessment of terminological disputes.

  (i) Numbered Agreed Claims:

  1. **Formal PD Structure**: Both camps agree that the Prisoner's Dilemma (PD) is formally defined by the payoff structure T > R > P > S and T + R > 2R (or sometimes 2R > T + S for the iterated case, but note the standard condition for a dilemma). This creates a situation where mutual cooperation yields a better outcome than mutual defection, but each player has an individual incentive to defect regardless of the other's action in a one-shot game.

  2. **Empirical Record of Laboratory Cooperation**: Both camps agree that in laboratory experiments:
     - One-shot anonymous PDs typically show substantial cooperation (often 30-60%, depending on the study and framing), which is inconsistent with the canonical prediction of universal defection.
     - In iterated PDs (with known fixed number of rounds or probabilistic ending), cooperation rates are higher and can be sustained by reciprocal strategies (like Tit-for-Tat) under certain conditions (e.g., sufficiently high probability of future interaction).

  3. **Origin vs. Maintenance Distinction**: Both camps agree that explaining the initial emergence of cooperation (origin) may involve different mechanisms than the persistence and stability of cooperation once established (maintenance). For example, group selection might play a role in the origin of cooperative norms, while reciprocity might maintain them in ongoing interactions.

  (ii) Disagreements Table:

  | Issue | Rationalist Position | Culturalist Position |
  |-------|----------------------|----------------------|
  | **Primary explanation for cooperation in iterated interactions** | Cooperation in iterated interactions is primarily sustained by direct reciprocity and individual-level selection (e.g., through repeated-game incentives that make conditional cooperation evolutionarily stable). | Cooperation in iterated interactions is primarily sustained by group-level or cultural mechanisms (e.g., norms, institutions, and group selection) that are not reducible to repeated-game structures; direct reciprocity is often scaffolded by these mechanisms. |
  | **Rational baseline in one-shot anonymous PD** | In a one-shot anonymous PD, the rational baseline is defection because there is no future interaction to enforce reciprocity; any cooperation is due to cognitive or behavioral biases or spillover from repeated interactions. | Treating one-shot defection as the rational baseline is a culturally specific framing that ignores how human decision-making is embedded in cultural contexts; even in anonymous one-shot settings, internalized norms and social heuristics can lead to cooperation without being irrational. |
  | **Role of group-level selection and cultural mechanisms** | Group-level and cultural mechanisms are derivative of repeated-game structures and emerge from individual-level selection acting on strategies in iterated interactions. | Group-level selection and cultural mechanisms (e.g., norm internalization, punishment institutions) are fundamental and often primary; they can operate independently of direct reciprocity and can stabilize cooperation even when direct reciprocity is not feasible. |
  | **Modeling adequacy** | Standard iterated-game models (e.g., evolutionary game theory with direct reciprocity) capture the essential dynamics of cooperation without needing to invoke group-level selection or cultural mechanisms in most cases. | Standard iterated-game models systematically understate the role of shared intentionality, cultural transmission, and ecological embeddedness, and thus fail to explain the full range of human cooperation. |

  (iii) Cruxes:

  We identify three cruxes that could help resolve the disagreement:

  1. **Scaling of Direct Reciprocity**: Does direct reciprocity scale to large groups without institutional support?
  2. **High Anonymous One-Shot Cooperation**: Does the observation of substantial cooperation in anonymous one-shot PDs falsify the rational-baseline claim?
  3. **Ecological Validity Gap**: Does the gap between human cooperation in real-world settings and the predictions of standard iterated-game models (e.g., in large-scale or non-repeated interactions) indicate a fundamental limitation of the reciprocity-based account?

  (iv) For Each Crux:

  Crux 1: Scaling of Direct Reciprocity
  - **Agreed Evidence**: In large-scale public goods games without punishment institutions, cooperation typically decays over time. However, in small groups (e.g., 2-4 players) with repeated interactions, direct reciprocity can sustain cooperation.
  - **Rationalist Prediction**: Direct reciprocity can scale to moderately large groups (e.g., up to 10-20 individuals) if the group is stable and interactions are sufficiently repeated, without requiring formal institutions. They point to simulations and ethnographic accounts of reciprocal networks in small-scale societies.
  - **Culturalist Prediction**: Direct reciprocity alone fails in large groups (beyond small face-to-face groups) because of cognitive limits, free-rider problems, and the lack of repeated pairwise interactions. They predict that without institutional support (e.g., norms, punishment, reputation systems), large-scale cooperation collapses.

  Crux 2: High Anonymous One-Shot Cooperation
  - **Agreed Evidence**: In laboratory experiments, a substantial proportion of participants (often 30-60%) cooperate in one-shot anonymous PDs, despite the absence of repeated interactions.
  - **Rationalist Prediction**: This cooperation is due to spillover from everyday repeated interactions (generalized reciprocity), cognitive biases, or misunderstanding of the game. It does not reflect rational choice but rather a behavioral heuristic that is usually adaptive in real life. They predict that with stronger anonymity and better game comprehension, cooperation rates decrease.
  - **Culturalist Prediction**: This cooperation reflects the internalization of social norms (e.g., fairness, trust) that are rational in the broader context of human social life. They predict that even with strong anonymity and clear instructions, cooperation persists and is a rational response in a culturally embedded agent.

  Crux 3: Ecological Validity Gap
  - **Agreed Evidence**: In real-world settings, humans cooperate in large groups, with strangers, and in one-off interactions at levels that exceed the predictions of standard iterated PD models (which require repeated encounters and direct reciprocity).
  - **Rationalist Prediction**: These real-world cases can be explained by extended reciprocity (e.g., reputation, indirect reciprocity) and individual-level mechanisms that are still grounded in repeated interactions (even if not pairwise). They predict that when these mechanisms are modeled (e.g., adding reputation to the iterated game), the gap closes.
  - **Culturalist Prediction**: The gap persists even when accounting for indirect reciprocity because human cooperation relies on shared intentionality, collective narratives, and culturally transmitted institutions that are not reducible to individual-level reciprocity. They predict that models without explicit cultural group selection or institutional scaffolding will fail to capture the full extent of human cooperation.

  (v) Terminological Assessment:

  Both camps agree that part of the dispute over "rationality" is purely verbal. The boundary is as follows:

  - **Agreed Boundary**: The term "rationality" is used differently. Rationalists use it in the sense of *instrumental rationality*: choosing the means (defection) that maximizes individual payoff given the constraints of the game. Culturalists use it in the sense of *ecological rationality*: behavior that is adaptive in the real social environment (where norms and institutions shape payoffs and expectations) and thus cooperation can be a rational response. The dispute is not purely verbal when it comes to whether the one-shot PD in isolation is a valid test of human decision-making. However, the meaning of "rational baseline" is context-dependent and thus the disagreement over the term reflects deeper differences in what constitutes the relevant environment for human decision-making.

