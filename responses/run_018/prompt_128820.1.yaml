  ### Joint Statement: Cooperation, the Prisoner's Dilemma, and Evolutionary Dynamics  
  *Produced through adversarial collaboration between rational-choice evolutionary-game theorists ("Rationalists") and cultural-institutional theorists ("Culturalists")*  

  #### (i) Agreed Claims  
  1. **Formal PD Structure**:  
     - The Prisoner’s Dilemma (PD) is defined by the payoff ordering \( T > R > P > S \) and \( 2R > T + S \) (mutual cooperation outperforms alternating exploitation). Defection is the dominant strategy in the one-shot game under standard rationality assumptions. Iterated PDs (IPDs) permit reciprocal strategies (e.g., Tit-for-Tat), enabling cooperation as a Nash equilibrium if the continuation probability is sufficiently high.  

  2. **Empirical Record of Laboratory Cooperation**:  
     - In anonymous one-shot PD experiments, cooperation rates typically range from 30% to 60%, inconsistent with universal defection predictions.  
     - In finitely iterated PDs, cooperation emerges and stabilizes under reciprocal strategies but decays near the end of fixed-length interactions ("backward induction" effect).  
     - Framing effects (e.g., labeling choices "cooperate/defect" vs. "A/B") significantly impact behavior, indicating contextual sensitivity.  

  3. **Origin vs. Maintenance Distinction**:  
     - Explaining the *origin* of cooperation (e.g., in evolutionary history) may require mechanisms distinct from those explaining its *maintenance* (e.g., in stable societies). Group-level traits (e.g., norms) and individual-level incentives (e.g., reciprocity) may play complementary but temporally asymmetric roles.  

  ---

  #### (ii) Disagreements Table  
  | Issue | Rationalist Position | Culturalist Position |  
  |-------|----------------------|----------------------|  
  | **Primary Driver of Cooperation** | Cooperation in iterated interactions is explained by direct reciprocity and individual-level selection; group-level effects are emergent properties of repeated-game equilibria. | Cooperation is sustained by group selection, institutional scaffolding, and internalized norms; reciprocity relies on pre-existing cultural infrastructure. |  
  | **Rational Baseline in One-Shot PD** | Defection is the rational baseline; observed cooperation reflects behavioral noise, cognitive errors, or spillover from repeated interactions. | Treating one-shot defection as universal rationality mistakes a culturally parochial framing for bedrock; cooperation can be ecologically rational given norm internalization. |  
  | **Role of Evolutionary Models** | Standard IPD models (e.g., Axelrod tournaments) sufficiently explain cooperation via reciprocity, without need for group-level primacy. | Standard IPD models understate shared intentionality and ecological embeddedness, overemphasizing dyadic reciprocity. |  
  | **Mechanism Derivation** | Cultural mechanisms (e.g., punishment institutions) are derivative of repeated-game structures and individual incentives. | Individual-level incentives are insufficient without culturally evolved institutions, which create the "rules" enabling reciprocity. |  

  ---

  #### (iii) Cruxes with Agreed Evidence and Predictions  
  **Crux 1: Does direct reciprocity scale without institutional support?**  
  - **Agreed Evidence**: Large-scale public goods games without punishment institutions show cooperation collapsing rapidly, whereas small groups (<10) sustain reciprocity-based cooperation.  
  - **Rationalist Prediction**: Direct reciprocity scales in networks via reputation and repeated pairwise interactions; institutional support is emergent, not prerequisite.  
  - **Culturalist Prediction**: Reciprocity fails in large groups without pre-existing institutions (e.g., norms, third-party punishment); scaling requires cultural "scaffolding."  

  **Crux 2: Does high anonymous one-shot cooperation falsify the rational-baseline claim?**  
  - **Agreed Evidence**: Cross-cultural experiments show anonymous one-shot cooperation rates >40% in industrialized societies but near-universal defection in market-integrated groups with strong self-interest norms.  
  - **Rationalist Prediction**: Anomalous cooperation reflects spillover from daily repeated interactions; defection remains the rational baseline under perfect isolation.  
  - **Culturalist Prediction**: Persistent cooperation demonstrates that rationality is context-dependent; internalized norms make cooperation ecologically rational, falsifying universal defection as "rational."  

  **Crux 3: Does ecological validity separate human cooperation from model predictions?**  
  - **Agreed Evidence**: Real-world cooperation (e.g., trade networks, disaster relief) occurs in one-off interactions among strangers at rates exceeding IPD predictions.  
  - **Rationalist Prediction**: Discrepancies resolve via indirect reciprocity (e.g., reputation) or signaling; IPD models generalize well with extensions.  
  - **Culturalist Prediction**: Gaps persist due to shared intentionality (e.g., collective rituals) and institutional trust; models neglect how culture transforms payoff structures.  

  ---

  #### (iv) Assessment of Terminological Disputes  
  - **Purely Verbal Disagreement**: The term "rationality" is contested.  
    - **Boundary**: Both camps agree that "rationality" is purely verbal when divorced from context. Rationalists define it as *instrumental rationality*: maximizing individual payoffs given explicit game constraints. Culturalists define it as *ecological rationality*: adaptive behavior shaped by evolved cultural heuristics.  
    - **Non-Verbal Core**: Disagreement persists on whether one-shot PD payoffs represent acontextual "bedrock" (Rationalist) or a culturally framed artifact (Culturalist). Outside this boundary, disputes concern empirical mechanisms (e.g., reciprocity scalability).  

  ---  
  *This document reflects good-faith negotiation. Disagreements remain but are precisely delineated. Future work should test cruxes via cross-cultural experiments, institutional variation in public goods games, and models integrating reciprocity with cultural evolution.*
