  *mental note* Must include that self-criticism bit. User's asking for vulnerability in the analysis - admirable. The weak spot is definitely whether we can extend "harm" to potential beings. If Mara values potential life minimally, the editing case collapses toward asymmetry. But if she sees embryos as having moral weight... *trails off*

