  *flips through imaginary case files* The wealthy IVF case is the closest analog - both involve resource expenditure for non-essential wellbeing boosts. But here the "resource" is embryonic life, which complicates things. Mara might see the abort/retry loop as irresponsible risk-taking even if no child suffers.

  *checks watch* Better articulate two coherent principles that fit her past rulings before predicting. User wants exact divergence points - that's smart framing for their column. I'll model:
