prompt: |-
  I have been reading rationalist and longtermist forums for years, and I now work as a senior analyst for a climate-adaptation grant fund that makes awards for infrastructure with fifty- to one-hundred-year impact windows. Every quarter my board reviews four to six proposals—seawalls, managed-retreat incentives, carbon-capture subsidies, migration-corridor planning—each of which will alter settlement patterns, birth rates, and family formation enough to change exactly which people exist in the affected regions by 2120. We have no reusable framework for deciding when that identity-shifting effect blocks an otherwise beneficial grant, or when it is ethically irrelevant. I need a decision procedure I can run in about twenty minutes per proposal, without requiring board members to have studied population ethics, that turns the nonidentity problem and its standard distinctions into ordered tests with clear stopping conditions.

  The deliverable should be a reusable flowchart in words: a sequence of questions applied in fixed order, what counts as a sufficient answer to each, explicit “no” stopping points where the proposal is rejected or sent back for redesign, explicit handoff points where the remaining issue is one of values rather than facts and must be signed off by the board, and honest flags for steps that look procedural but are actually judgment calls dressed up as rules.

  To prevent the framework from collapsing into either “all future people are interchangeable” or “identity-change makes evaluation impossible,” build in two niche operational criteria that you define in place. First, the Counterfactual Structural Continuity Test: ask whether every person who could occupy the relevant social and environmental role in the future scenario is at least as well off as every occupant of the corresponding role in the best feasible alternative scenario, regardless of specific identity. Second, the Modal Complicity Boundary: stop the analysis and flag for human judgment whenever the only harm identified is to present people whose autonomy is being overridden for speculative future benefit, or when the causal chain to future structural conditions is too indirect to assess.

  Then apply the procedure to three proposals:
  1. A seawall and coastal-development package that prevents present displacement but locks in high-density settlement patterns that will shape family formation for generations.
  2. A carbon-reduction subsidy expected to lower regional birth rates through economic restructuring, improving climate outcomes but ensuring that the people who live in the improved climate are not the ones who would have lived under the status quo.
  3. A managed-retreat grant that relocates present communities, destroying specific social networks but opening land-use patterns that will determine future population composition.

  In at least one case the procedure should yield an answer the board will resist—probably an approval where intuition wants a block, or a block where intuition wants approval. State clearly what the procedure cannot resolve: for example, whether impersonal value should dominate person-affecting considerations, or whether the board owes duties to specific future individuals rather than to structural conditions. Do not provide bibliographies, reading lists, or citations; do not ask anyone to look up sources. Keep the language precise but accessible to a technically literate non-specialist, and mark every point where the analyst must still exercise irreducible judgment.
reasoning: |-
  Okay, let me approach this systematically. The user is a senior analyst at a climate-adaptation grant fund facing a complex ethical dilemma involving the nonidentity problem in long-term infrastructure projects. They need a practical decision framework that can be applied quickly without requiring specialized philosophical knowledge.

  Hmm, the core challenge is balancing present interventions with their effects on future populations' identities. The user explicitly wants to avoid two extremes: treating future people as fully interchangeable or considering identity-change as an evaluation blocker. They've proposed two operational criteria - Counterfactual Structural Continuity Test and Modal Complicity Boundary - which need proper integration.

  First, I should structure the flowchart to handle time-sensitive evaluations. The sequence must start with immediate feasibility checks before diving into identity implications. The CSC Test should come early to assess structural role welfare, while the MCB acts as a circuit breaker for problematic cases. 

  For the seawall proposal, I anticipate tension between preventing current displacement and locking in future demographic patterns. The procedure might approve it if structural roles show net benefit, even if intuitive objections exist about forced settlement patterns. The carbon-subsidy case likely triggers birth rate impacts but could pass CSC if economic roles improve. The managed-retreat example poses social network destruction versus future land use - here the MCB might flag autonomy overrides by present actors.

  Key judgment points to highlight: determining "sufficiently direct" causation chains, defining "reasonable range" for structural roles, and interpreting autonomy violations. These can't be fully proceduralized. The framework's main limitation is its inability to resolve whether structural outcomes outweigh specific person-affecting harms - that values call must stay with the board.

  The deliverable should present as a clear step sequence with decision nodes, not academic discourse. Every "analyst judgment" marker reminds users where the procedure can't eliminate discretion. For controversial outcomes, I'll prepare to explain why the seawall approval might counterintuitively pass while satisfying the defined criteria.
answer: |-
  Here is a reusable decision procedure in flowchart form, designed for 20-minute assessments per proposal. Judgment calls are marked with **(!)**. The framework prioritizes structural impacts over specific identities, using your defined criteria to avoid paralysis.

  ---

  **Decision Procedure: Future Population Impact Screening**

  1.  **Feasibility & Core Harm/Benefit:** Is the proposal technically/financially feasible and does it demonstrably address a clear climate adaptation threat within the 50-100 year window?
      *   *No → Reject/Redesign.* (Stopping Point)
      *   *Yes → Proceed to 2.*

  2.  **Direct Harms to Existing Populations:** Does the proposal cause *unavoidable, significant, and unjustified* harm (e.g., displacement without compensation, health risks, destruction of essential livelihoods) to *identifiable present populations*?
      *   *Yes → Proceed to 3.*
      *   *No → Proceed to 4.*

  3.  **Modal Complicity Boundary (MCB) Trigger:** Is the *only justification* for imposing harm on present populations a *speculative future benefit* (e.g., "this displaces people now so *maybe* better-off people exist later"), OR is the causal chain from present action to claimed future structural benefit highly indirect/uncertain?
      *   *Yes → **Flag for Board Judgment.*** (Handoff Point: Requires explicit board approval despite harm, weighing near-term ethics vs. long-term speculation). Proceed to 4 only if board overrides MCB flag.
      *   *No → Proceed to 4.* (Harm justified by clear, near-term adaptation necessity outweighing harm).

  4.  **Counterfactual Structural Continuity (CSC) Test - Definition:** Define the key "roles" in the affected region relevant to well-being (e.g., "coastal resident," "agricultural worker," "urban service provider," "ecosystem user"). Define the "best feasible alternative scenario" (e.g., no grant, different grant type, status quo adaptation). **(!)** *Analyst defines roles & alternative with board input if contested.*
      *   For *each* defined role in the *proposal scenario*:
          *   Identify the range of well-being outcomes for occupants of that role.
          *   Identify the range of well-being outcomes for occupants of the *corresponding role* in the *best feasible alternative scenario*.
          *   Ask: Is *every* occupant of this role in the proposal scenario *at least as well off* as *every* occupant of the corresponding role in the alternative scenario? (i.e., Do the proposal's role outcomes *strictly dominate* the alternative's?)
              *   *No → Proceed to 5.*
              *   *Yes → Continue testing other roles.*
      *   If *all* roles pass (strict dominance for every role) → **Approve.** (Stopping Point - Structural improvement unambiguous)
      *   If *any* role fails → Proceed to 5.

  5.  **Net Structural Assessment:** Considering *all* defined roles, is there a *clear net improvement* in expected aggregate well-being across roles in the proposal scenario vs. the best feasible alternative, *despite* some roles failing strict dominance in the CSC Test? **(!)** *Analyst judgment on "clear net improvement," considering scale, severity, and distribution.*
      *   *No → Reject/Redesign.* (Stopping Point: Structural loss or unacceptable trade-off)
      *   *Unclear → **Flag for Board Judgment.*** (Handoff Point: Requires board assessment of the value trade-off between winners/losers across roles).
      *   *Yes → Proceed to 6.*

  6.  **Non-Identity Specificity Check:** Is the *primary objection* to the proposal solely based on the identity of future people changing (e.g., "the specific people who benefit wouldn't exist otherwise"), *without* pointing to a specific structural role being made worse off (as already assessed in CSC Test)?
      *   *Yes → **Approve.*** (Stopping Point: Identity change alone is ethically irrelevant per framework. Benefit captured structurally).
      *   *No → **Flag for Board Judgment.*** (Handoff Point: Residual concerns likely involve complex person-affecting intuitions or unassessed structural impacts beyond defined roles).

  ---

  **Application to Proposals:**

  1.  **Seawall & Coastal Development:**
      *   1: Passes (Prevents present displacement).
      *   2: Likely No (Prevents harm, but may create new pressures).
      *   4: CSC Test Roles (e.g., Present Coastal Resident, Future Coastal Resident, Inland Resident). *Future Coastal Resident* role likely fails strict dominance vs. managed retreat alternative (higher density may mean lower avg. QoL/risk exposure vs. lower-density retreat zones). *Present Coastal Resident* may pass (prevents displacement).
      *   5: Net Structural Assessment **(!)** - Trade-off: Locked high-density vs. displacement prevention & potential economic stability? *Likely Unclear Net Improvement* → **Flag for Board Judgment.** (Board may resist approving due to locking in perceived suboptimal density, despite preventing immediate harm).
      *   *Reason for Resistance:* Intuition dislikes locking in future patterns, but procedure flags it as a values trade-off (preventing present harm vs. long-term density), not an identity block.

  2.  **Carbon-Reduction Subsidy:**
      *   1: Passes (Addresses climate risk).
      *   2: Likely No (Economic restructuring may cause disruption, but core harm unclear/compensable).
      *   4: CSC Test Roles (e.g., Industrial Worker, Green Tech Worker, General Citizen). *Industrial Worker* role may fail strict dominance (job loss) vs. status quo. *Green Tech Worker* & *General Citizen* (due to better climate) likely pass/dominate.
      *   5: Net Structural Assessment **(!)** - Strong case for clear net improvement (mitigates catastrophic climate risk outweighing localized job transition pain).
      *   6: Non-Identity Specificity Check: Primary objection is often "different people will exist due to lower birth rates." → **Approve.** (Identity change deemed irrelevant; net structural benefit identified). *Board may resist:* Intuition struggles with "benefiting non-existent people," but procedure dismisses this as irrelevant if structures improve.

  3.  **Managed-Retreat Grant:**
      *   1: Passes.
      *   2: **Yes** (Destroys present communities/social networks - significant harm to identifiable populations).
      *   3: MCB Trigger: Justification is *future* land-use benefits determining future population composition. Harm (social destruction) is to present people for speculative future structural gain → **Flag for Board Judgment.** (Requires board to explicitly sanction overriding present autonomy/suffering for uncertain future structural gain). *If board overrides:*
      *   4: CSC Test Roles (e.g., Relocated Resident, New Resident of Vacated Area, Adjacent Community Member). *Relocated Resident* role likely fails strict dominance (loss of social capital) vs. seawall alternative where they stay. Other roles may be neutral or improve.
      *   5: Net Structural Assessment **(!)** - Unclear net improvement (present harm significant, future benefits speculative/structural). → Likely **Reject/Redesign** or strong **Flag for Board Judgment** if net benefit is argued.

  ---

  **What the Procedure Cannot Resolve:**

  1.  **Impersonal vs. Person-Affecting Value:** The procedure structurally favors impersonal value (improving aggregate well-being or structural conditions) once the MCB and CSC are passed. It cannot settle whether preventing the existence of potentially unhappy people (if an alternative structure is worse) is good/bad/neutral, or if duties are owed *only* to specific future individuals who *will* exist (vs. to structures). The CSC Test implicitly adopts a role-based impersonal view.
  2.  **Weighting Structural Trade-offs:** Step 5 requires judgment on whether gains for some roles outweigh losses for others. The procedure provides no formula for this; it's a core board values decision.
  3.  **Depth of Autonomy Violation (MCB):** Deciding when present harm for future gain is "speculative" or "unjustified" enough to trigger the MCB is inherently judgmental **(!)**.
  4.  **Defining "Reasonable Range" for Roles:** Step 4 relies on the analyst defining relevant roles and feasible alternatives reasonably **(!)**. Overly broad or narrow definitions skew results.

  **Key Judgment Points Marked (!):**
  *   Step 4: Defining structural roles and the "best feasible alternative."
  *   Step 5: Assessing "clear net improvement" across roles.
  *   Step 6: Determining if the *primary* objection is solely identity-based.
  *   MCB Application: Judging if future benefit is too "speculative" or the harm/autonomy override too severe.
  *   Role Definition: Setting the scope and granularity of structural roles.
