  ### **Simulation Design: "The Virtuous Commons"**
  **Core Tension:** Participants must honour individual rights over specific environmental parameters while navigating second-order preferences about collective scholarly virtue, inevitably encountering a conflict between minimal liberalism and the Pareto principle.

  #### **Setup & Roles**
  - **Participants:** 16 (4 groups of 4, each group assigned one parameter: Luminosity, Acoustics, Thermal, or Minimalism).
  - **Parameters:** Each has two settings (e.g., Luminosity: Bright/Low; Acoustics: Ambient/Silent; Thermal: Warm/Cool; Minimalism: Cluttered/Clean).
  - **States:** 16 possible environment states (combinations of all parameter settings). For simplicity, groups only deliberate on 4 pre-selected states labelled **W, X, Y, Z** (see Appendix 1 for definitions).
  - **Role Cards:** Assign one of three roles per participant within their parameter group:
    1. **Prudential Minimalist:** Prefers settings that minimise sensory input (e.g., Low light, Silent).  
       *Right: Decisive over their parameter when paired states differ only in that setting.*  
       *Second-order preference: Believes all peers benefit from minimalism for deep focus.*
    2. **Libertarian Maximalist:** Prefers settings that maximise autonomy (e.g., Bright, Ambient).  
       *Right: Decisive over their parameter when paired states differ only in that setting.*  
       *Second-order preference: Believes all peers thrive under maximal personal choice.*
    3. **Institutional Mediator:** No fixed first-order preference.  
       *Right: Can veto socially suboptimal choices (using deliberation points).*  
       *Second-order preference: Advocates for equity (e.g., no group disproportionately inconvenienced).*

  #### **Materials**
  - **Role Cards:** 16 cards detailing rights, preferences, and payoff triggers (Appendix 2).
  - **State Cards:** 4 cards describing **W, X, Y, Z** in parameter settings (Appendix 1).
  - **Deliberation Points (DPs):** Abstract currency:
    - +2 DPs for honouring your private right.
    - +1 DP if the group’s choice aligns with your second-order preference.
    - –1 DP for Pareto-dominated outcomes.
  - **Voting Tokens:** For pairwise comparisons.
  - **Facilitator Cheat Sheet:** Timeline, debrief notes, and troubleshooting.

  #### **Rules & Mechanics**
  1. **Objective:** Achieve a unanimous social ordering of states **W, X, Y, Z** via pairwise votes.
  2. **Liberal Rights:** 
     - Participants exercise decisiveness only when states differ *solely* in their parameter (e.g., a Minimalism-rights holder decides between **W** and **X** only if they differ only in Minimalism).
     - Rights are absolute: If applicable, the decisive participant’s preference binds the group.
  3. **Pareto Principle:** Unanimously preferred states must be ranked higher. 
  4. **Process:**
     - Groups deliberate in parameter-aligned clusters (4 groups × 4 participants).
     - Each cluster holds pairwise votes to order states, honouring rights and Pareto.
     - Votes require unanimity within clusters; deadlocks trigger intervention by the **Institutional Mediator** (who can veto using DPs as justification).
  5. **Payoffs:** DPs reward/penalise based on rules above. Goal: Maximise individual DPs while upholding rights and Pareto.

  ---

  ### **Timeline (90 Minutes)**
  | Time    | Activity                                                                                     |
  |---------|----------------------------------------------------------------------------------------------|
  | 00:00   | **Introduction (5 mins):**<br>- Explain the virtual study environment and parameters.<br>- Frame the goal: “Create a consensus ranking for optimal scholarly virtue.”<br>- *Avoid mentioning the paradox.* |
  | 00:05   | **Role Assignment (10 mins):**<br>- Distribute role cards. Assign 4 groups (Luminosity, Acoustics, Thermal, Minimalism).<br>- Clarify rights and DP rewards. Use examples: *“If you’re decisive for Minimalism, you unilaterally rank Cluttered vs. Clean.”* |
  | 00:15   | **State Familiarisation (5 mins):**<br>- Distribute state cards (**W, X, Y, Z**).<br>- Groups identify how states differ in their parameter.          |
  | 00:20   | **Pairwise Comparisons (40 mins):**<br>- Groups conduct 6 pairwise votes (all **W-X**, **W-Y**, **W-Z**, **X-Y**, **X-Z**, **Y-Z**).<br>- Record rankings on a shared board. Enforce rights: *“If states differ only in your parameter, you decide.”*<br>- **Critical Juncture:** Groups will deadlock at **Y vs. W** or **Z vs. X** (see Appendix 1 for preference profile).<br>- Mediators intervene to break deadlocks (e.g., veto a right to enforce Pareto). Track DPs. |
  | 01:00   | **Deadlock Reflection (10 mins):**<br>- Groups share outcomes: Which rights were overruled? Did Pareto violations occur?<br>- *Sample prompt: “Could you satisfy all rights and unanimous preferences? Where did negotiations break?”* |
  | 01:10   | **Debrief (20 mins):**<br>- **Map to Sen’s Paradox:**<br>  - *Minimal Liberalism:* Each person’s right creates a "private sphere" (e.g., a Minimalist/Maximalist controls their parameter).<br>  - *Pareto Principle:* Unanimous preferences must be respected.<br>  - *Tension:* In **State Y vs. X**, rights may require a choice that contradicts Pareto (see Appendix 1). Overruling rights to satisfy Pareto (or vice versa) is inevitable.<br>- **Formal Features:**<br>  - *Reproduced well:* Impossibility of satisfying liberalism and Pareto simultaneously.<br>  - *Collapsed for playability:* Simplified to 4 states/groups; Sen’s theorem requires 4+ *alternatives* with specific preferences. Here, preferences are aggregated into group roles rather than individual profiles. |
  | 01:30   | **Conclusion & Dismissal**                                                                   |

  ---

  ### **Predictable Challenges & Solutions**
  1. **Challenge:** Participants bypass rights, relying on majority votes.  
     **Solution:** Intervene early: *“Remember, if states differ only in your parameter, your vote is decisive—no group vote allowed.”*
  2. **Challenge:** Mediators overuse vetoes, disrupting the deadlock.  
     **Solution:** Restrict mediators to 1 veto/cluster. Remind them: *“Veto only if rights/Pareto are violated.”*
  3. **Challenge:** Groups miss the Pareto violation in **Y vs. X**.  
     **Solution:** Use facilitator prompts: *“Check if any state is unanimously preferred. Does honouring rights contradict this?”*
  4. **Challenge:** Time overruns in pairwise votes.  
     **Solution:** Enforce 4-minute limits per vote. Provide a comparison flowchart (Appendix 3).

