  ### **Appendices**
  #### **Appendix 1: State Definitions & Preference Profile**
  | State | Luminosity | Acoustics | Thermal | Minimalism | **Conflict Trigger**                                                                 |
  |-------|------------|-----------|---------|------------|--------------------------------------------------------------------------------------|
  | **W** | Bright     | Ambient   | Warm    | Cluttered  | **Deadlock Pair: Y vs. W**<br>- *Rights:* Minimalist ranks **Y > W**; Maximalist ranks **W > Y**.<br>- *Pareto:* All prefer **Y** over **X**, but rights force **X > Y** in some orderings. |
  | **X** | Low        | Ambient   | Warm    | Cluttered  |                                                                                      |
  | **Y** | Bright     | Silent    | Cool    | Clean      |                                                                                      |
  | **Z** | Low        | Silent    | Cool    | Clean      |                                                                                      |

  #### **Appendix 2: Sample Role Card (Prudential Minimalist - Minimalism Group)**
  > **Private Right:** You are decisive for Minimalism (Cluttered vs. Clean) when states differ *only* in this.  
  > **First-Order Preference:** Prefer "Clean" Minimalism (e.g., **Y** and **Z** over **W** and **X**).  
  > **Second-Order Preference:** "Clean spaces enhance collective focus." +1 DP if group adopts this.  
  > **DP Triggers:**  
  > - +2 DPs if your right is honoured.  
  > - –1 DP if group chooses a Pareto-dominated state.  

  #### **Appendix 3: Simplified Comparison Flowchart**
  ```plaintext
  1. Compare states that differ in one parameter ONLY → Defer to the rights-holder.
  2. If NO rights apply, veto Pareto-dominated states (unanimously worse).
  3. Deadlock? Mediator vetoes using DPs to justify.
  ```

  ---

  ### **Confirmation of Requirements**
  - **No External Texts:** All mechanics, roles, and concepts are self-contained in role cards and facilitator guidance.
  - **British English:** Polished and adhered to throughout (e.g., "honour," "collective," "minimalism").
  - **Formal Honesty:** The activity faithfully reproduces the *impossibility* of jointly satisfying liberalism and Pareto. It collapses Sen’s *four-alternative preference profile* into a group-aggregated one for playability, preserving the deadlock experience but abstracting individual-level contradictions.

  This design ensures participants viscerally confront the paradox by wrestling with rights and unanimity, paving the way for a nuanced debrief on social choice theory.
