  Below is a structured design for a 90-minute in-class simulation of Sen's liberal paradox, adapted to a novel virtual study environment scenario. The activity avoids the classic "Lady Chatterley" example, focuses on experiential learning through role-play, and ensures participants encounter the logical tension via collective decision-making.

