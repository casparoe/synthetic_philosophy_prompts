answer: |-
  ## Dissertation Prospectus: Regime-Bound Structural Realism in Quantum Field Theory

  **Title:** Ontic Commitment to Scale-Relative Structures: Towards a Regime-Bound Structural Realism for Quantum Field Theory

  **Abstract:** This project investigates the ontological status of structures in quantum field theory (QFT) that are empirically successful only within bounded energy regimes. Challenging the predominant dichotomy within ontic structural realism (OSR) – which typically addresses either global symmetries or purely epistemic placeholders – this research asks: *Can a coherent form of OSR be articulated for empirically adequate structures confined to specific energy scales, avoiding collapse into epistemic structural realism (ESR) or entity realism?* Through conceptual analysis of symmetry-breaking arguments and case studies from effective field theories (EFTs), the project aims to develop a framework, "Regime-Bound Structural Realism" (RBSR), defining the conditions under which local structural commitment is justified, distinct from mere instrumental accommodation. Success will yield a novel position within scientific realism and a formal criterion distinguishing ontological commitment within regimes.

  **1. Introduction & Precise Research Question**
  Ontic Structural Realism (OSR) proposes that the structure of the world, rather than individual entities, is the appropriate object of ontological commitment in fundamental physics. However, discussions within OSR concerning QFT have been dominated by two extremes: (i) commitment to global symmetry structures (e.g., Lorentz invariance, gauge symmetries) presumed fundamental and scale-invariant, or (ii) treating structures as purely epistemic tools devoid of ontological weight, particularly when they demonstrably fail outside specific domains. This dichotomy overlooks a prevalent feature of modern physics: structures described by *effective field theories* (EFTs), such as the Fermi theory of weak interactions or the Standard Model itself below the Planck scale, which exhibit remarkable empirical adequacy within well-defined energy regimes but demonstrably break down or require modification outside those bounds. This project poses the central question:

  > **Is a coherent form of ontic structural realism (RBSR) possible for structures that are empirically adequate only within a bounded energy regime in QFT, and if so, how can such commitment be distinguished ontologically from both epistemic structural realism (ESR) and standard entity realism?**

  **2. Problem: The Global/Epistemic Dichotomy in OSR and the Gap**
  The current OSR landscape struggles to accommodate regime-bound structures:
  *   **Globalist OSR:** Commits to structures (like Poincaré symmetry) as fundamental features of reality across all scales. However, EFTs demonstrate that many structures (e.g., specific global symmetries, particle content) are only valid within finite energy ranges. Treating them as global overreaches empirically and ontologically, ignoring the lessons of symmetry breaking and renormalisation group flow.
  *   **Epistemic/Placeholder OSR:** Often treats structures as merely useful models or placeholders for an unknown fundamental theory, downplaying ontological commitment. This risks collapsing into instrumentalism regarding the empirically successful structure *within its regime*. It fails to capture the intuition that the structure *does* capture something genuinely objective and mind-independent *about the world at that specific scale*.
  *   **Entity Realism:** While avoiding the problems of global structures, entity realism typically commits to specific entities (e.g., electrons) rather than the relational structures defining them and their interactions within a regime. This risks missing the structural dependencies revealed by QFT and EFTs.

  The consequence is a theoretical gap: structures that are *robustly successful and explanatory within a specific domain* lack a clear ontological home. Neither global ontology nor instrumentalism adequately captures their status. This project argues that this gap represents a significant oversight in the realism debate concerning modern physics.

  **3. Proposed Approach: Conceptual Analysis & EFT Case Studies**
  The project will employ a two-pronged methodology:

  *   **A. Conceptual Analysis of Symmetry and Structure:**
      *   Critically analyse arguments concerning symmetry breaking (spontaneous and explicit) in QFT. How does the *loss* of symmetry across scales challenge global OSR commitments and necessitate a scale-relativised view of structure?
      *   Examine the ontological implications of the Renormalisation Group (RG). The RG flow demonstrates how structures (couplings, symmetries, even particle definitions) are inherently scale-dependent. What does this imply for the persistence and reality of structures?
      *   Rigorously define the core tenets of the proposed RBSR position, contrasting it explicitly with global OSR, ESR, and entity realism. Key concepts: "empirical adequacy within a regime," "ontological commitment to regime-bound structure," "structure as scale-dependent modality."

  *   **B. Examination of Effective Field Theory Cases:**
      *   Conduct detailed philosophical case studies of specific EFTs. Prime candidates include:
          *   The Fermi theory as a low-energy effective limit of the electroweak theory.
          *   Chiral Perturbation Theory as an EFT for QCD at low energies.
          *   The Standard Model itself as an EFT valid below the Planck scale.
      *   Analyse: What specific structures (symmetry groups, Lagrangian terms, particle fields *as defined within the EFT*) are empirically indispensable *within the regime*? How does their ontological status change when crossing regime boundaries? How do physicists interpret the reality of these structures *in practice*?

  This combined approach uses concrete physical practices (EFTs and RG flow) to ground and refine the conceptual framework of RBSR.

  **4. Success Criteria & Deliverables**
  A successful project will deliver:
  1.  A clearly articulated and defensible position of **Regime-Bound Structural Realism (RBSR)**, situated within the landscape of scientific realism.
  2.  A **formal criterion (or set of criteria)** distinguishing *ontological commitment to a local structure* from its *merely instrumental accommodation*. This might involve factors such as:
      *   *Robustness within the regime:* The structure's indispensability for explanation and prediction across diverse phenomena within the bounded domain.
      *   *Non-arbitrariness:* Its derivation via controlled approximation (e.g., RG decoupling) from a more fundamental theory (if known), rather than mere phenomenological fitting.
      *   *Modal strength:* The structure supporting counterfactuals about possible interventions *within its energy regime*.
      *   *Contrast with ESR:* Explicit demonstration that commitment is not merely to a model's success, but to the structure *as representing a real, albeit scale-relative, feature of the world*.
  3.  Demonstrated application of RBSR and the criterion to the chosen EFT case studies, showing its explanatory power and resolving the ontological ambiguity surrounding regime-bound structures.
  4.  A compelling argument for RBSR as a viable and necessary *tertium quid* between global OSR, ESR, and entity realism in the context of modern fundamental physics.

  **5. Assessment of Failure & Feasibility**
  *   **Failure Conditions:** The project would fail if:
      *   The analysis conclusively shows that commitment to regime-bound structures *inevitably* reduces to either instrumentalism (ESR) or implies a problematic commitment to entities independent of structure (entity realism), with no coherent middle ground identifiable.
      *   No plausible formal criterion distinguishing ontological commitment from instrumental accommodation within a bounded regime can be formulated or defended.
      *   The case studies reveal that physicists' successful use of EFTs *requires* no ontological commitment beyond standard ESR, undermining the motivation for RBSR.
      *   The project becomes mired in unresolved technical debates within QFT foundations (e.g., strict Haag's theorem implications) that prevent clear philosophical conclusions about structure.
  *   **Feasibility for Six Months (Prospectus):** The six-month prospectus phase is deemed feasible. The focus is on *developing the conceptual framework and methodology*, not completing exhaustive case studies or resolving all QFT technicalities. The core tasks – articulating the problem, defining RBSR's core tenets, outlining the criterion, selecting and initiating analysis of 1-2 key EFT cases, and assessing the landscape – are manageable within this timeframe with disciplined focus. The prospectus will thoroughly map the argument, methodology, and case study plan for the full dissertation, demonstrating the project's viability and intellectual merit. The primary risk is over-ambition in the *depth* of the initial case study analysis; this will be mitigated by clearly defining the *prospectus-level* goals for the case studies (demonstrating the *need* for RBSR and *illustrating* the application of the criterion, rather than providing a definitive philosophical interpretation).

  **6. Conclusion**
  This project addresses a significant lacuna in the debate over structural realism by confronting the scale-relativity inherent in our most successful physical theories. By developing Regime-Bound Structural Realism and a criterion for local structural commitment, it aims to provide a philosophically robust and physically well-grounded account of the ontology of structures that are fundamentally tied to specific energy regimes. The prospectus will establish the necessity of this inquiry, outline the path to a novel realist position, and demonstrate the project's feasibility for doctoral research.
