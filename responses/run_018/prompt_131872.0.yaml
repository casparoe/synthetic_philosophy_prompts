answer: |-
  Below is a step-by-step decision procedure for your panel, translating key concepts from material constitution philosophy into an operational protocol. The protocol prioritizes clarity, minimizes philosophical jargon, and flags points requiring human judgment or where philosophy remains unsettled. Thresholds (e.g., 50% original material) are based on standard conservation practice and philosophical consensus on artifact persistence.

  ---

  ### **Operational Protocol: "Same Work" Determination**

  #### **Key Definitions**
  - **Original Material**: Physically unchanged matter from the object’s creation.
  - **Gradual Replacement**: Incremental changes (e.g., corrosion repair) without total destruction.
  - **Sudden Reformation**: Complete destruction followed by recreation (e.g., pulverization).
  - **Sufficient Answer**: Requires documented evidence (e.g., conservation reports, material analysis).

  #### **Protocol Steps**

  1. **Continuity of Original Material**  
     *Question: Does the candidate object contain *any* verifiable original material?*  
     - **Sufficient Answer**: Scientific analysis (e.g., spectrometry, stratigraphy) confirming original matter.  
     - **Yes**: Proceed to Step 2.  
     - **No**: Proceed to Step 5.  

  2. **Proportional Dominance of Original Material**  
     *Question: Is >50% of the candidate object’s *structure* composed of original material?*  
     - **Sufficient Answer**: Quantifiable measurement (volume/mass) by conservation scientists.  
     - **Yes**: **Same Work** (constitution holds; e.g., repaired artifacts).  
     - **No**: Proceed to Step 3.  

  3. **Gradual vs. Sudden Change**  
     *Question: Was material loss/replacement *gradual* (e.g., corrosion) or *sudden* (e.g., shattering)?*  
     - **Sufficient Answer**: Historical/conservation records of the process.  
     - **Gradual**: Proceed to Step 4.  
     - **Sudden**: Proceed to Step 6.  

  4. **Continuous Cultural Identity**  
     *Question: Has the object been *continuously treated* as the same work by relevant communities?*  
     - **Sufficient Answer**: Documentation (e.g., exhibition records, provenance, rituals).  
     - **Yes**: **Same Work** (artifact-type persistence via function).  
     - **No**: **Not the Same Work** (token identity broken).  
     - **Unclear**: **Hand to Human Panel** (values-based judgment on cultural significance).  

  5. **Formal Fidelity to Original**  
     *Question: Was the candidate object reconstructed *from the original source* (mold/quarry) with identical form?*  
     - **Sufficient Answer**: Comparison of design specs (e.g., molds, blueprints).  
     - **Yes**: Proceed to Step 4.  
     - **No**: **Not the Same Work** (fails token identity).  

  6. **Reassembly from Fragments**  
     *Question: Was the candidate object *reassembled* from original fragments?*  
     - **Sufficient Answer**: Documentation of fragment reuse.  
     - **Yes**: **Same Work** (constitution via fragment-based persistence).  
     - **No**: Proceed to Step 7.  

  7. **Re-creation After Total Destruction**  
     *Question: Was the candidate *re-created* post-total-destruction using original sources?*  
     - **Sufficient Answer**: Evidence of annihilation (e.g., pulverization records) and recreation.  
     - **Yes**: **Hand to Human Panel** (values debate: Is historical authenticity tied to creation act?).  
     - **No**: **Not the Same Work** (strict identity impossible).  

  ---

  ### **Application to Cases**

  #### **Case 1: Bronze Statue (40% loss, filled with modern alloy from original mold)**  
  - **Step 1**: Yes (60% original metal remains).  
  - **Step 2**: Yes (>50% original). → **Same Work**.  
  - *Rationale*: Constitution holds; gradual replacement preserves token identity.

  #### **Case 2: Clay Figurine (shattered, reassembled with modern clay replacements)**  
  - **Step 1**: Yes (original fragments present).  
  - **Step 2**: No (<50% original; modern fills dominate).  
  - **Step 3**: Sudden (shattering).  
  - **Step 6**: Yes (reassembled from fragments). → **Same Work**.  
  - *Rationale*: Reassembly maintains token identity via original fragments.

  #### **Case 3: Stone Monument (pulverized, re-carved from same quarry with altered proportions)**  
  - **Step 1**: No (pulverized; no original material).  
  - **Step 5**: No (altered proportions ≠ identical form). → **Not the Same Work**.  
  - *Rationale*: Fails formal fidelity and material continuity. Human panel not triggered.  
  - *Note*: Protocol avoids special pleading; outcome aligns with philosophy (no token persistence).

  ---

  ### **Confidence Assessment**
  - **Overall Reliability**: High for inorganic media (metal, stone, ceramic).  
    - Strengths: Clear thresholds for material/formal continuity.  
    - Limitations: Organic media (e.g., wood, textiles) may decay irregularly, complicating Steps 1–2.  
  - **Least Confident Step**: **Step 4 (Continuous Cultural Identity)**.  
    - **Weakness**: Practical translation, not philosophy.  
      - *Why*: "Continuous treatment" relies on subjective records (e.g., community recognition). Philosophy affirms artifact identity can persist through cultural practice, but operationalizing this requires contextual human judgment.  
    - **Recommendation**: Pair with expert testimonies (historians, community representatives).

  ---

  This protocol balances philosophical rigor (e.g., distinguishing token identity from constitution) with actionable steps. It minimizes indecision (only 2/7 steps may require human input) and resists manipulation for "unwelcome" outcomes (Case 3). For edge cases, document all evidence at each step to ensure auditable reasoning.
