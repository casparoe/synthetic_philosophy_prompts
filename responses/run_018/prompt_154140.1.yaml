  3. Whether accepting true contradictions in semantics spills over into empirical or mathematical reasoning, making it impossible to quarantine.
  4. If rational belief in dialetheism is even coherent, given that contradictions might destabilize rationality itself.

  I need to assign probabilities to each part, justify each in one line, combine them into an overall credence, identify the main source of uncertainty, and describe what conceptual argument could shift that by 0.15. If my credence is below 0.5, I should say what would push it above; if above, what would pull it below.

