     **Credence: 0.6**  
     *Justification:* Frameworks like Kripke's fixed-point semantics or Belnap's four-valued logic resolve the paradox with truth-value gaps/gluts while avoiding ontological commitment to true contradictions.  
     *Dominant uncertainty:* Whether such approaches handle "revenge paradoxes" (e.g., strengthened Liars) without tacitly relying on dialetheist tools.

  3. **That accepting true contradictions generates unacceptable spillover into empirical/mathematical reasoning, with no stable boundary.**  
     **Credence: 0.3**  
