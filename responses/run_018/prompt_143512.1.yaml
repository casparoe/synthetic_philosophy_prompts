prompt: |-
  I'm the care coordinator for a small hospice unit and we've started using a kind of tranquilist framework for our non-medical support decisions — basically, we treat only the absence of craving and suffering as what actually improves a patient's remaining days, and we treat any intervention that introduces new wants, attachments, or narrative demands on the patient as a harm unless it clearly nets out negative craving. I need a reusable procedure I can run in about fifteen minutes during our weekly case conference to decide whether to greenlight, modify, or reject a proposed psychosocial intervention (things like life-review writing, family reconciliation sessions, spiritual legacy projects, or even relaxation techniques that might create dependency). The procedure needs to be grounded in what tranquilism actually says — not just "reduce pain" but the specific claim that positive goods don't count and that craving-formation is the relevant metric — and it needs to handle cases where the family is pushing for an intervention the patient seems ambivalent about. Give me the steps in order, with a quick test for each one, flag where I'm still making a judgment call that I can't outsource to the checklist, and apply it to three cases: (1) a patient who wants to record video messages for grandkids but gets visibly agitated during takes; (2) a family insisting on guided imagery that makes the patient calmer in session but then ask for it constantly; (3) one where the procedure says no to something I personally think would be beautiful. Also say what the procedure can't settle and where it might misfire if the patient's mental state shifts between evaluation and execution.
reasoning: |-
  We are designing a procedure based on tranquilism, which holds that:
  - The absence of craving and suffering is the only good.
  - Positive goods (like joy, meaning, etc.) do not count as improvements unless they reduce craving or prevent future craving.
  - Any intervention that introduces new wants, attachments, or narrative demands is a harm unless it clearly results in a net reduction of craving.

  The procedure must be run in about 15 minutes and must handle:
  - Proposed psychosocial interventions (life-review, family reconciliation, legacy projects, relaxation techniques, etc.)
  - Cases where the family is pushing for an intervention but the patient is ambivalent.

  Steps of the Procedure:

  1. **Define the Intervention and Its Components**:
     - Break down the proposed intervention into its core elements.
     - Identify the intended activities, the parties involved, and the expected outcomes (especially those that might introduce new cravings or attachments).
     - *Test*: Can we list the specific activities and the potential new wants or attachments they might create?
     - *Judgment call*: Identifying the potential new cravings requires clinical judgment and knowledge of the patient.

  2. **Assess Current Craving Baseline**:
     - Determine the patient's current state of craving and suffering related to the context of the intervention.
     - *Test*: What are the patient's current cravings or sufferings that the intervention aims to address? (e.g., agitation, regret, fear)
     - *Judgment call*: This requires observation and patient report. If the patient cannot communicate, we rely on observable signs and proxy reports.

  3. **Project Immediate Effects on Craving During and Right After Intervention**:
     - Evaluate whether the intervention will immediately reduce or increase craving during the activity and in the short term (minutes to hours after).
     - *Test*: Based on past experiences or similar cases, does the activity typically cause immediate distress (increasing craving) or calm (reducing craving)? What does the patient's reaction during a trial (if available) indicate?
     - *Judgment call*: Predicting immediate effects requires knowledge of the patient and the intervention.

  4. **Project Long-Term Effects on Craving Formation**:
     - Evaluate whether the intervention is likely to create new long-term cravings or attachments (e.g., dependency, unmet desires, new narratives that cause suffering).
     - *Test*: Could this activity create a pattern of dependency (e.g., needing the intervention repeatedly to feel calm)? Could it create unfinished business or new desires that cannot be fulfilled? Could it create an attachment to an outcome (e.g., a perfect legacy project) that causes distress?
     - *Judgment call*: Projecting long-term effects is inherently uncertain, especially in hospice where time is limited, but we must consider the trajectory.

  5. **Evaluate Net Craving Impact**:
     - Weigh the immediate reduction in craving (if any) against the risk of creating new cravings (both immediate and long-term). The intervention is only justified if there is a net reduction in craving.
     - *Test*: Does the intervention lead to a clear net reduction in craving? If there are both craving-reducing and craving-inducing aspects, which dominates?
     - *Judgment call*: Balancing the factors to determine "net" effect.

  6. **Handle External Pressures (e.g., Family)**:
     - If the family is pushing for an intervention, assess whether the patient's ambivalence or reluctance is a sign that the intervention might introduce craving. The patient's state is primary.
     - *Test*: Is the patient expressing or showing signs of reluctance, ambivalence, or distress when the intervention is proposed? If so, even if the family expects benefits, the intervention may create craving in the patient.
     - *Judgment call*: Interpreting the patient's non-verbal cues or indirect expressions of ambivalence.

  7. **Decision Framework**:
     - Greenlight: If the intervention clearly reduces immediate craving without introducing new long-term cravings, and there is no evidence of net harm.
     - Modify: If the intervention has potential but needs adjustment to minimize craving formation (e.g., shorter sessions, reduced expectations, removing pressure).
     - Reject: If the intervention introduces new cravings without sufficient immediate craving reduction, or if the net effect is an increase in craving.

  **What the Procedure Cannot Settle**:
  - If the patient's mental state shifts between evaluation and execution (e.g., due to disease progression, medication changes, or mood swings), the initial assessment might become invalid. Therefore, any approved intervention should be monitored and re-evaluated if the patient's condition changes.
  - The procedure cannot account for unpredictable individual reactions. Thus, a trial run (if feasible) is recommended for interventions that are on the borderline.

  ---

  **Application to Cases**:

  **Case 1: Video messages for grandkids with patient agitation during takes**

  - Step 1: The intervention is recording video messages. Components: setting up, recording, possibly multiple takes. Potential new wants: desire for a "perfect" message, attachment to the idea of leaving a legacy, agitation from performance pressure.
  - Step 2: Current baseline: patient has a desire to connect with grandkids but is not currently distressed about it until the recording starts.
  - Step 3: Immediate effect: during recording, the patient becomes visibly agitated (increased craving).
  - Step 4: Long-term: might create a pattern of distress around the project, or if completed, might reduce craving about unfinished business? But the agitation suggests increased suffering. Also, if the patient becomes attached to the idea of multiple videos, it could lead to more sessions of agitation.
  - Step 5: Net craving: the immediate increase in craving is evident and significant. The long-term reduction is uncertain and may not outweigh the immediate harm.
  - Step 6: The patient is initiating the project but shows distress during execution. This ambivalence (wanting to do it but finding it distressing) suggests that the activity is creating craving.
  - **Decision**: Reject the current form. Modify by offering alternative methods (e.g., audio recording, writing, or having a family member write down the patient's words without recording). If the patient is adamant, try one short session with strict limits (one take only, no re-dos) and assess.

  **Case 2: Family insists on guided imagery that makes patient calmer in session but then patient asks for it constantly**

  - Step 1: Intervention: guided imagery sessions. Components: therapist-guided relaxation, focusing on calming images. Potential new wants: dependency on the technique to achieve calm, craving for the sessions repeatedly.
  - Step 2: Current baseline: patient may have anxiety or restlessness that the family wants to address.
  - Step 3: Immediate effect: during the session, patient is calmer (reduced craving).
  - Step 4: Long-term: the constant requests indicate a new craving has formed — the patient now depends on the guided imagery and cannot self-soothe. This creates a new source of suffering when the session is not available.
  - Step 5: Net craving: the immediate reduction is real, but the long-term increase (due to dependency) is significant. The net effect may be negative because the craving for the sessions becomes a new problem.
  - Step 6: Family is pushing, but the patient's constant requests are a sign of formed dependency (a new craving). The patient may not be ambivalent during the session but is developing a craving for it.
  - **Decision**: Reject continued sessions in the current form. Modify by teaching self-guided techniques (if the patient can learn) to reduce dependency, or limit sessions to a fixed schedule to avoid reinforcing constant requests. Alternatively, replace with a non-dependent method (e.g., environmental adjustments, non-dependent relaxation).

  **Case 3: A proposal that the coordinator finds beautiful but the procedure says no**

  *Example: A dying patient with little energy is proposed a "forgiveness ceremony" with a long-estranged sibling. The coordinator feels it would be a beautiful moment of closure, but the patient expresses reluctance and fear about reopening old wounds.*

  - Step 1: Intervention: a forgiveness ceremony. Components: arranging the meeting, the emotional exchange. Potential new wants: desire for a specific outcome (e.g., full forgiveness), fear of confrontation, attachment to a narrative of reconciliation.
  - Step 2: Current baseline: patient may have underlying craving for resolution but also fear and avoidance.
  - Step 3: Immediate effect: the meeting could cause high distress (increased craving) if the patient is reluctant.
  - Step 4: Long-term: if successful, might reduce craving for closure. But if it goes badly, could increase suffering. Also, the patient might become attached to an idealized outcome that isn't achieved.
  - Step 5: Net craving: given the patient's reluctance, the immediate distress is likely and the long-term benefit is uncertain. Net effect may be negative.
  - Step 6: Patient is ambivalent (at best) or reluctant. Family or staff may be pushing for it because of the perceived beauty of reconciliation.
  - **Decision**: The procedure would reject the ceremony as proposed because of the high risk of increasing craving and the patient's reluctance. Instead, it might suggest a modified approach: allow the patient to write a letter (without requiring sending) or have a brief, mediated conversation with low expectations.

  ---

  **Final Notes**:
  - The procedure is a tool to structure decision-making but cannot replace clinical judgment, especially when the patient's condition changes. Always monitor after implementation and be ready to re-evaluate.
  - The procedure explicitly rejects interventions that introduce new cravings even if they bring positive emotions, because positive goods are not counted unless they reduce craving.
  - It may misfire if the patient's mental state shifts (e.g., due to delirium or medication) after the evaluation. Therefore, if an intervention is approved, it should be implemented soon after evaluation and with flexibility to stop if the patient's reaction changes.
answer: |-
  Below is a step-by-step Tranquilist Evaluation Procedure (TEP) for assessing psychosocial interventions in hospice care, grounded in core tranquilist principles: **only the reduction of craving/suffering counts as a "good,"** while positive experiences (e.g., joy, meaning) are irrelevant unless they prevent future craving. New wants, attachments, or narrative demands are harms unless they yield a *net reduction* in craving. The procedure focuses on **empirical evidence of craving states** (e.g., agitation, dependency, distress) and rejects subjective "meaning" or family preferences as primary factors.  

  ### Tranquilist Evaluation Procedure (TEP)  
  **Time:** 15 minutes per case  
  **Inputs:** Proposed intervention, patient’s observed behaviors, family input (if any), and hospice records.  
  **Output:** Greenlight, Modify, or Reject.  

  #### Steps in Order:  
  1. **Define the Intervention’s Craving Mechanics**  
     - *Task:* Break the intervention into components and identify how each might **create new cravings** (e.g., dependency, unmet desires, performance anxiety) or **reduce existing cravings** (e.g., calming agitation).  
     - *Tranquilist Grounding:* Tranquilism opposes "positive goods" (e.g., legacy, reconciliation) unless they demonstrably reduce craving. Focus on craving as the only metric.  
     - *Test:* "Does any part of this intervention introduce a new *want*, *attachment*, or *narrative demand* (e.g., 'I must finish this' or 'I need this to feel okay')?"  
     - *Judgment Call:* Yes. You must infer craving risks from patient history or similar cases.  

  2. **Assess Baseline Craving State**  
     - *Task:* Review the patient’s current craving level related to the intervention’s context (e.g., agitation about unfinished tasks, fear of death). Use direct observation > family reports > charts.  
     - *Tranquilist Grounding:* Interventions can only "improve" days by reducing craving below this baseline.  
     - *Test:* "Is the patient currently experiencing craving/suffering this intervention claims to address? If not, the intervention may *create* new craving."  
     - *Judgment Call:* Yes. Interpreting subtle cues (e.g., silence as ambivalence vs. acceptance) requires your expertise.  

  3. **Project Net Craving Change**  
     - *Task:* Weigh craving reduction during/after the intervention against risks of new cravings. Prioritize:  
       - **Immediate craving reduction** (e.g., calm during an activity).  
       - **Long-term craving formation** (e.g., dependency, regret, or agitation post-activity).  
     - *Tranquilist Grounding:* The only justification is a *net craving reduction*. Positive emotions are noise.  
     - *Test:* "Does the intervention cause a craving spike during/after? If yes, does the reduction *outweigh* it? Ignore 'meaning' or family satisfaction."  
     - *Judgment Call:* Yes. Balancing short-term vs. long-term effects is subjective.  

  4. **Resolve Patient Ambivalence**  
     - *Task:* If the patient is hesitant or the family is pushing, prioritize the patient’s *behavioral signs* (e.g., agitation, withdrawal) over stated desires. Tranquilism treats ambivalence as craving (e.g., conflict between "should" and "want").  
     - *Tranquilist Grounding:* Family-driven interventions often impose narrative demands ("You must forgive!") that increase suffering.  
     - *Test:* "If the patient hesitates, does proceeding risk creating a craving loop (e.g., guilt for not participating)?"  
     - *Judgment Call:* Yes. Deciding if ambivalence signals harm requires your assessment.  

  5. **Decision & Safeguards**  
     - *Task:* Choose:  
       - **Greenlight** only if net craving reduction is clear and no new cravings form.  
       - **Modify** to strip craving-inducing elements (e.g., shorten sessions, remove perfectionism).  
       - **Reject** if craving reduction is unproven or new cravings outweigh benefits.  
     - *Safeguard:* If approved, brief trial runs (<5 mins) to detect craving shifts.  
     - *Tranquilist Grounding:* No intervention is neutral—inaction is safer than unproven action.  

  #### What TEP Can’t Settle & Risks  
  - **Unsettled by TEP:**  
    - Patient’s mental shifts between evaluation and execution (e.g., medication changes, delirium). TEP assumes stability; if status changes, reevaluate.  
    - Family conflicts. TEP ignores family preferences unless they directly create patient craving (e.g., guilt-tripping).  
    - "Beautiful" interventions with high craving risk. TEP rejects these, risking staff dissatisfaction.  
  - **Misfire Risks:**  
    - If craving manifests post-evaluation (e.g., dependency emerges days later), TEP may greenlight harmful interventions. Mitigation: Build in a 24-hour reflection period if possible.  
    - False negatives: If a craving reduction is subtle (e.g., slight calm), TEP may reject a helpful intervention.  

  ---

  ### Case Applications  
  **Case 1: Video Messages for Grandkids with Agitation During Takes**  
  - **Step 1:** Intervention creates narrative demands ("perfect message") and visible agitation (craving spike). New cravings: performance anxiety.  
  - **Step 2:** Baseline craving: Low (patient desires connection) but spikes during recording.  
  - **Step 3:** Net craving change: Agitation (increase) outweighs temporary craving reduction (if any). Legacy "good" is irrelevant.  
  - **Step 4:** Patient ambivalence: Agitation signals harm; family wishes are secondary.  
  - **Decision:** **Reject or Modify.** Strip craving triggers: Use audio-only recording, limit to one short message, or switch to a letter (no performance pressure).  

  **Case 2: Family Pushes Guided Imagery Causing Patient Dependency**  
  - **Step 1:** Intervention creates dependency (new craving). Calm during session reduces craving short-term, but constant requests prove long-term harm.  
  - **Step 2:** Baseline craving: Restlessness (addressable) but dependency is worse.  
  - **Step 3:** Net craving change: Long-term craving (dependency) > short-term reduction.  
  - **Step 4:** Patient ambivalence: Initial calm masks later craving; family pressure ignores dependency risk.  
  - **Decision:** **Reject or Modify.** Replace with non-dependent methods (e.g., open-window breeze, calming music) that don’t create "need."  

  **Case 3: Rejecting a "Beautiful" Intervention (e.g., Family Reconciliation Session)**  
  - *Scenario:* A daughter requests a deathbed reconciliation for her estranged father. You feel it’s "beautiful," but the patient avoids the topic and tenses at the mention.  
  - **Step 1:** Intervention imposes narrative demand ("must reconcile"), risking shame/regret. New cravings: fear of confrontation, guilt.  
  - **Step 2:** Baseline craving: Patient shows avoidance (low craving), but intervention may spike it.  
  - **Step 3:** Net craving change: High risk of agitation during/after; "closure" is not a tranquilist good.  
  - **Step 4:** Patient ambivalence: Tension = craving signal. Family pressure is irrelevant.  
  - **TEP Decision:** **Reject.** Tranquilism prioritizes craving avoidance over social ideals.  
  - **Why It Feels Wrong:** You’re valuing "beauty" (a positive good), but tranquilism rejects this. Mitigation: Offer a low-craving alternative (e.g., "Would you like to write something they can read later?").  

  ---

  **Procedure Summary**  
  TEP is a craving-centered checklist that ignores conventional hospice goals (e.g., meaning, legacy). It requires humility: you *will* override personal values. Use it weekly to standardize decisions, but pair it with team discussions for unresolved judgments. Remember: **"No craving, no harm" is the tranquilist ideal**—when in doubt, default to non-intervention.
