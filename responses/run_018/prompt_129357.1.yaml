answer: |-
  Here is a precise translation of the genocide debate into ecological-taxonomic terms, followed by a residue report and critical evaluation of "nomenclatural capture":

  ---

  ### **Taxonomic Translation of Genocide Concepts**
  1.  **Lemkin's Coinage as New Species Description:**  
      *   **Analogy:** Lemkin's 1944 work *Axis Rule in Occupied Europe* functions as the **protologue** (formal description) of a newly proposed taxonomic entity: *Genus: Genocidium*. His diagnosis ("destruction of a nation or ethnic group") serves as the initial **morphological description**, identifying key destructive "characters" (mass killing, cultural eradication, economic dismantling).  
      *   **Fidelity:** High. This matches the historical act of proposing a novel category based on observed phenomena.

  2.  **UN Convention Definition as a Species Concept:**  
      *   **Analogy:** The Convention's definition (Art. II) acts as the **formal operational species concept**. It defines *Genocidium humanum* (or similar) via:  
          *   *Protected Groups (National, Ethnical, Racial, Religious):* Analogous to the **taxonomic scope** of the concept (e.g., limiting it to vertebrates vs. all multicellular life).  
          *   *Acts (Killing, Causing Harm, Preventing Births, Forcible Transfer of Children):* The **diagnostic characters** (morphological/behavioral traits).  
          *   *Intent (Dolus Specialis - "intent to destroy"):* The **phylogenetic or functional core** – the defining "essence" analogous to a shared evolutionary history or unique adaptive function justifying category separation. Without proven intent, it's merely "mass atrocity" (a phenotypic convergence, not the true taxon).  
      *   **Fidelity:** Moderate-High. The structure maps well (diagnostic traits + delimiting scope). The "intent" criterion is the strongest parallel to a theoretical core (like monophyly), though proving phylogenetic intent is less contested than proving human intent.

  3.  **State Resistance as Institutional Suppression:**  
      *   **Analogy:** State denial/avoidance of the genocide label is **institutional rejection of a valid taxon**. This manifests as:  
          *   *Rejecting the diagnosis:* Claiming acts don't meet the criteria ("It's civil war, not genocide!" = "These are environmental stressors, not diagnostic traits!").  
          *   *Disputing the intent core:* Denying *dolus specialis* ("No plan existed!" = "This is phenotypic plasticity, not an apomorphy!").  
          *   *Lobbying against recognition:* Pressuring bodies (UN, courts) to withhold classification = **Political interference in taxonomic committees** (e.g., downlisting a species' IUCN status due to economic pressure).  
      *   **Fidelity:** High. Mechanisms of suppression (disputing evidence, political pressure) are directly analogous.

  4.  **Uniqueness (Holocaust) vs. Generality Debate as Lumping/Splitting:**  
      *   **Splitters (Uniqueness):** Argue the Holocaust (*Genocidium shoah*) is a **highly derived monotypic genus** due to its industrialized scale, ideological totality, and global context – demanding separation from other atrocities (analogous to recognizing a unique lineage based on autapomorphies).  
      *   **Lumpers (Generality):** View the Holocaust as the **type specimen** of a broader genus *Genocidium*, containing multiple species (e.g., *G. armeniensis*, *G. tutsii*, *G. darfuri*). Differences are interspecific variation, not generic distinction. "Dilution" fears mirror concerns that over-splitting **paraphyly** obscures shared destructive mechanisms.  
      *   **Fidelity:** High. The core taxonomic dispute (how much variation warrants separation vs. grouping) is identical.

  5.  **Ethical Revisions & Common-Name Politics:**  
      *   **Analogy:** Debates over excluding political groups from the Convention, or pressure to recognize cultural genocide, resemble **revisions driven by ethical/systematic concerns**. E.g., removing offensive common names or reclassifying based on new phylogenies. State resistance mirrors **committee politics** blocking revisions that challenge power structures.  
      *   **Fidelity:** Moderate. The process of revision is analogous, but the *ethical driver* is more explicit and urgent in genocide discourse.

  ---

  ### **Residue Report: What Doesn't Translate**
  1.  **Without Loss (High-Fidelity Elements):**  
      *   Proposing a new category (species description).  
      *   Defining operational criteria (species concept).  
      *   Disputes over category boundaries (lumping/splitting).  
      *   Institutional resistance to classification (suppression, committee politics).  
      *   Strategic denial of evidence to avoid classification ("nomenclatural capture").

  2.  **Requiring Distortion/Stretching (Moderate-Fidelity Elements):**  
      *   **Intent (*Dolus Specialis*):** While analogous to a theoretical core (like monophyly), proving human *intent* is uniquely fraught, involving interpretation of documents, testimony, and inference – unlike reconstructing evolutionary history from data. The stakes of misclassification are incomparably higher.  
      *   **Ethical Revisions:** Taxonomic revisions for ethics (e.g., renaming) are *reactive* to social norms. Genocide classification revisions are often *proactive* demands for justice, carrying immediate legal/political consequences.  
      *   **"Dilution" Fears:** While similar to concerns about paraphyly, the fear isn't just systematic messiness; it's the perceived erosion of the term's unique *moral condemnation* and legal force – a normative weight absent in taxonomy.

  3.  **No Taxonomic Counterpart (Critical Residues):**  
      *   **Moral Weight of Survivor Testimony:** Taxonomy relies on physical evidence/data. Survivor testimony is evidentiary *and* carries irreducible **moral authority and lived experience** demanding recognition, not just data-point validation.  
      *   **Legal Triggers & State Obligations:** A genocide classification legally compels action (prevention, punishment, protection) under international law (UN Charter, Genocide Convention). No taxonomic act triggers binding *legal obligations* for states or the international community.  
      *   **Normative Urgency of Prevention:** The *primary purpose* of genocide classification is **prevention and deterrence**. Taxonomy aims for accurate description/understanding; conservation urgency is secondary and not inherent to the classification act itself.  
      *   **The Victim's Perspective:** Taxonomy is observer-centric (scientist classifying nature). Genocide classification is fundamentally **victim/survivor-centric** – recognition is a core demand for justice and healing. Misclassification inflicts profound *moral harm*.

  ---

  ### **Analysis of "Nomenclatural Capture"**
  *   **Illumination:** The concept **powerfully illuminates genocide denial**. States denying genocide *exactly* mirror an authority (e.g., a resource agency, influential museum) suppressing a valid taxon (e.g., an endangered species) because recognition triggers unwanted obligations (habitat protection, sanctions). The mechanisms are identical: disputing evidence, lobbying committees, controlling data access, promoting rival classifications ("civil war," "counter-insurgency"). It reveals denial as a *strategic institutional practice*, not just ignorance.
  *   **Limitations/Distortion:** The analogy **imports ecological assumptions** in two key ways:  
      1.  **Motivation:** In ecology, capture often stems from economic interests or bureaucratic inertia. In genocide, denial is driven by **moral culpability, sovereignty claims, and ideological defense** – motivations far more profound and existentially threatening to the regime.  
      2.  **Consequence:** Failed nomenclatural capture in ecology might mean delayed conservation. In genocide, it means ongoing atrocity, impunity, and denial of justice – consequences are **catastrophically human**.  
      *   **Verdict:** The concept is **highly illuminating for the mechanism** but risks **understating the unique moral and existential stakes** of genocide denial compared to taxonomic suppression.

  ---

  ### **Point of Critical Failure & Analogy Breakdown**
  *   **The Specific Failure:** The analogy would fundamentally fail if confronted with the **irreducible moral agency of victims and the unique harm of *non-recognition***. When the taxonomic lens leads one to view survivor testimony *only* as "data" to be validated against a "diagnostic key," rather than as **moral claims demanding acknowledgment and justice**, it misses the core of genocide's horror. Taxonomy is descriptive; genocide classification is **inherently normative and performative** – it *does* something in the world (trigger obligations, assign blame, validate suffering).
  *   **Point of Breakdown:** The analogy breaks down most severely at the **interface of classification and consequence**. Assigning an organism to *Species A* vs. *Species B* doesn't change the organism's existence or rights. Declaring an event "genocide" fundamentally alters the **legal, moral, and political reality** for perpetrators, victims, and the international community. The moment the taxonomic framework obscures or diminishes the **imperative to prevent future genocide or deliver justice for past atrocities** – mistaking a profoundly human, moral, and legal category for a purely descriptive scientific one – is when it ceases to be a useful lens and becomes a dangerous distortion. This breakdown occurs when focusing solely on the *act of classification* without integrating the **inescapable normative urgency and human consequence** that define the concept of genocide.
