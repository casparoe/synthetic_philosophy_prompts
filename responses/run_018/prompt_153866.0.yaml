answer: |-
  **Bottom line:** Sophie's Choice is fundamentally a **tragic choice** (Nussbaum), not primarily a hard choice due to incommensurability (Chang).

  Chang’s incommensurability posits choices where reasons genuinely run out, making neither option better, worse, or on a par – a space for commitment, not tragedy. Nussbaum's tragic choice, however, involves unavoidable wrongdoing where *any* action entails deep moral failure. Sophie's forced selection isn't a failure to compare comparable values (Chang's domain) but an act of profound moral corruption demanded by evil: weighing her children's lives *at all* is the horror. The film depicts not reasoned comparison breaking down structurally (Chang), but the utter collapse of moral possibility – pure moral horror forcing participation in evil. Her crushing guilt later suggests she *did* internalize the corrupt framework, feeling she chose one child over the other, resisting pure incommensurability where such comparisons are invalid. The movie's power lies in embodying this unbearable psychological and existential devastation, revealing the lived experience of impossible choices that philosophical frameworks, while clarifying structures, cannot fully convey.

