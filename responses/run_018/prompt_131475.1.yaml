     - However, the Record-Keeper's ledger for Phase 2 does not record the type of good, only validity and currency. So how do we calculate the value of goods held? We can't. This is a problem we want to surface.

     So the payoff calculation will be done in two ways:
        a) Based on the actual goods held by each trader (we count the physical tokens they have) and apply the valuation rules for each phase.
        b) Based on the ledger (which for Phase 2 doesn't have the necessary information).

     The instructor will then award snack tokens or extra-credit chips based on the actual goods held (method a). But the point is that the ledger becomes inadequate for accounting after the rule change.

  5. Debrief (20 minutes):
     - Start by asking each village: 
          * How did the rule change affect your trading?
          * What problems did you encounter with the ledger?
          * How did the Record-Keeper and Auditor feel about the rule change?
     - Then, map to theory:
          * In Phase 1, the ledger tracked the details (color of goods) and the accounting was straightforward. The categories (red, blue, green) were equally valued and recorded.
          * In Phase 2, the accounting rules changed to only record validity and currency. This restructured what was being recorded. The ledger no longer captured the type of good, only whether it was valid and the money exchanged. This made the ledger less useful for reconstructing the actual goods held, but it also made the new categories (valid vs invalid) seem natural. The green goods became invisible in the ledger because they were invalid and not recorded? Actually, they were recorded as invalid, but without the type. So we know there was an invalid trade but not what was traded.

          * The institutional loop: The rules (set by the institution) shaped what was recorded, and then the recorded data becomes the only official history. After the fact, it looks like the only valuable goods were red and blue because that's what the ledger reflects (and the green goods are not represented as having value). This is the construction of the categories: the accounting rules made green goods disappear from the economic narrative.

     - Key theoretical point: The accounting rules don't just track an independent reality; they help create that reality by making some things visible and others invisible. The ledger then becomes the reality that people refer to.

  6. What this simulation cannot reproduce:
     - The macro-level feature that is missing: The slow, historical process by which institutions evolve and the way these rules become deeply embedded in society and taken for granted (the "naturalization" over a long time). Our simulation compresses the change into a few minutes, so the students are very aware of the rule change. In reality, people often don't notice the shifts and the categories become naturalized over generations.

  7. What will predictably go wrong:
     - Students might not trade enough, especially in the short time.
     - The Record-Keeper might be overwhelmed with recording, especially if there are many trades.
     - Traders might forget to record or record incorrectly.
     - The rule change might be misunderstood, leading to arguments.
     - The Auditor might not have enough to do if the Record-Keeper is accurate.
