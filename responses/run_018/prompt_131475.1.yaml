     Alternatively, we can have the rule that if someone tries to trade green goods, the Record-Keeper records it as invalid and the trade doesn't happen. But traders might not know the new rules? We'll announce the rules to everyone.

     We want the rule change to restructure what is countable. So after the rule change, the Record-Keeper's ledger no longer has information about the type of good (only valid/invalid) and the amount. This will make it impossible to later reconstruct what was traded (red, blue, or green) and at what value. The recorded data now only reflects the new categories.

  4. Payoff:
     - At the end of the game (both phases), the net worth of each trader is calculated by the Record-Keeper and Auditor. 
