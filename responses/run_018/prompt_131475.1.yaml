answer: |-
  Here's a complete, ready-to-run simulation game designed for your 60-minute section. It uses physical tokens and role-playing to make the institutional loop tangible. The debrief connects gameplay to social construction theory without lecturing.

  ---

  ### **Game Title**: *Reality Ledger*
  **Core Mechanic**: Students create a currency system, then experience how rule changes alter what "counts" as value, corrupting their own records.

  **Learning Goal**: Experience how accounting practices don't just *track* reality but *reshape* what’s perceived as real/natural.

  ---

  ### **Materials** (for 16 students)
  - **Tokens**: 200+ paper clips (or poker chips) in 3 colors:  
    - **Blue** = "Fish" (food)  
    - **Green** = "Wood" (shelter)  
    - **Red** = "Art" (luxury)  
  - **Stakes**: 16 small snacks (e.g., candy bars) or "extra credit chips" (paper slips).  
  - **Role Cards**: 4 Trader cards, 1 Accountant card, 1 Inspector card *per group* (see roles below).  
  - **Ledger Sheets**: Paper with columns: *Time, Trader A, Trader B, Item, Quantity, Currency Paid*.  
  - **Timer** (visible to all).  

  ---

  ### **Setup** (5 min)
  1. **Divide into 4 groups** (4 students each).  
  2. **Assign roles per group**:  
     - **Traders (2 per group)**: Exchange goods for currency.  
     - **Accountant (1 per group)**: Records trades in the ledger.  
     - **Inspector (1 per group)**: Enforces rules & audits the ledger.  
  3. **Distribute starting tokens per group**:  
     - Each *Trader* gets: 5 Fish (blue), 5 Wood (green), 0 Art (red), 10 currency (white paper clips).  
     - *Accountant/Inspector* get no goods/currency.  

  ---

  ### **Rules & Phases**  
  **Phase 1: "Free Trade"** (15 min)  
  - **Goal**: Accumulate currency through trading.  
  - **Rules**:  
    - Traders barter **within their group** using currency (e.g., "2 Fish for 3 currency").  
    - **Accountant** records **ALL** trades in the ledger (item, quantity, currency).  
    - **Inspector** verifies trades match the ledger.  
  - **Payoff Later**: Currency = snack/credit (1:1).  

  **Phase 2: "Rule Shift"** (Start after 15 min)  
  - **New Rules** (Announce abruptly):  
    - "Art (red) is now the HIGH-VALUE item! All Art trades must be recorded as **'Luxury'**."  
    - "Fish/Wood trades are LOW-VALUE! Record them as **'Essentials'** (no quantities)."  
    - **Inspectors**: Destroy any Art tokens traded *before* this phase (they "expired").  
  - **Consequence**: Ledgers now erase details—Accountants can only log "Luxury" or "Essentials," not specific items/quantities.  

  **Phase 3: "Payoff Chaos"** (5 min)  
  - **Calculate wealth**:  
    - Pre-rule Art tokens = worthless (destroyed).  
    - Post-rule Art = 10 currency each.  
    - Fish/Wood = 1 currency each (but ledger doesn’t show quantities!).  
  - **Problem**: Accountants can’t verify holdings from ledgers—only "Luxury/Essentials" exist on record.  

  ---

  ### **Debrief Framework** (20 min)  
  **Guided Discussion (NO LECTURING)**:  
  1. **"What happened?"** (5 min):  
     - Ask Traders: "How did the rule change affect your trades?"  
     - Ask Accountants: "What was impossible to record after the shift?"  
     - Ask Inspectors: "What couldn’t you verify?"  

  2. **Map to Theory** (10 min):  
     - **Institutional Loop**:  
       *"At first, you tracked Fish/Wood/Art as real categories. Then rules forced you to log only 'Luxury/Essentials.' By the end, your ledger ONLY showed those categories. Did it feel like 'Luxury' was always the real value? That’s the loop: rules define what’s recorded → records define what seems 'natural.'"*  
     - **Construction of Kinds**:  
       *"Art became 'Luxury' because the rules said so—not because it’s inherently valuable. But after the ledger changed, could you even *remember* a world where Fish/Wood had detail? That’s how money constructs reality: once accounting practices lock in, alternatives vanish."*  

  3. **Limitation of the Game** (2 min):  
     - *"This can’t show slow, historical naturalization. You felt the rule change abruptly—but irl, this happens over decades, making categories feel timeless."*  

  ---

  ### **What Will Go Wrong (and How to Fix)**
  1. **"Traders ignore the ledger!"**  
     - **Fix**: Inspectors get power to veto trades not logged.  

  2. **"Accountants can’t keep up!"**  
     - **Fix**: Pre-print ledger sheets with columns.  

  3. **"Groups finish too fast/slow!"**  
     - **Fix**: Add a "trade with another group" rule mid-Phase 1 to spike activity.  

  4. **"Students resist rule change!"**  
     - **Fix**: Inspectors get bonus snacks for enforcing ruthlessly.  

  ---

  ### **Why This Works**
  - **Tactile Stakes**: Currency → snacks/credits makes rule shifts visceral.  
  - **Role Chaos**: Inspectors destroy Art, Accountants lose data—*they* create the institutional problem.  
  - **Theory Emerges**: The "aha!" moment hits when payoffs fail due to their own records.  

  Run it straight through—no prep needed. Good luck!
