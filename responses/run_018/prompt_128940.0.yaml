answer: |-
  Here's a breakdown of your roommate's points, separating settled math, common simplifications, and contested/incorrect claims:

  1.  **"The Kelly criterion tells you to maximize expected log wealth, so geometric rationality is really just expected utility theory with a log utility function baked in."**
      *   **Accurate & Settled:** This is mathematically precise and uncontroversial. Maximizing the expected logarithm of terminal wealth (Kelly) is *exactly equivalent* to Expected Utility Theory (EUT) with a logarithmic utility function (U(W) = log(W)). "Geometric rationality" primarily refers to this specific utility function choice within the EUT framework for repeated decisions.

  2.  **"That means you should never take a bet with negative expected value..."**
      *   **Accurate (for pure Kelly):** Under logarithmic utility (pure Kelly), a bet with negative expected value *in monetary terms* will also have negative expected utility. Therefore, a pure Kelly bettor *always* rejects negative EV bets. This is a direct consequence of the log utility function.

  3.  **"...and it automatically solves the risk-aversion problem because you're linear in log-space."**
      *   **Common Simplification:** This captures the *intuition* well but is slightly imprecise.
          *   **Accurate:** The log utility function *does* exhibit risk aversion (concave in wealth). Kelly *does* provide an optimal strategy for repeated bets considering growth and risk. Saying it "solves" the risk-aversion problem in the context of *long-term growth* for repeated bets is reasonable.
          *   **Simplification:** "Linear in log-space" is shorthand. You maximize *expected* log wealth. The relationship between wealth and utility is linear *after* the log transform (U(W) = log(W) is linear in log(W)), but the maximization is still over *expectations*. It doesn't eliminate risk aversion; it *embodies* a specific, growth-optimal form of it.

  4.  **"The ergodicity economics people claim this proves time averages match ensemble averages, but that's mostly marketing — the Kelly math works fine without that story."**
      *   **Largely Accurate & Settled (on the math), Contested (on interpretation):**
          *   **Accurate:** The core math of Kelly (max E[log(return)]) predates ergodicity economics (EE) by decades and stands firmly on its own within probability, information theory, and finance. EE proponents use Kelly as a key example, but its validity doesn't depend on EE's narrative.
          *   **Contested/Simplification:** Calling EE "mostly marketing" is a strong opinion, but reflects a common criticism from mainstream economics and finance. The claim that Kelly "proves time averages match ensemble averages" is:
              *   **Oversimplified/Misleading:** Kelly's optimality *for growth* relies on the law of large numbers applying to the *logarithm* of wealth over time. This is *not* the same as saying the *wealth process* itself is ergodic in the strict dynamical systems sense (time avg = ensemble avg for *all* observables). Kelly works because the *log growth rate* averages out.
              *   **Contested:** EE proponents argue their reframing (focusing on non-ergodicity of wealth and time averages) is a crucial conceptual shift explaining why standard EUT (with arbitrary utility) can fail for repeated decisions. Critics argue it's an unnecessary reframing of existing, well-understood results about repeated gambles and the law of large numbers applied to log returns. The *necessity* and *novelty* of the EE narrative for understanding Kelly is hotly debated.

  5.  **"And if you're ambiguity-averse you just scale your Kelly fraction by your ambiguity weight..."**
      *   **Common Practical Heuristic, but a Simplification:** Scaling down the Kelly fraction ("fractional Kelly") is a widespread practical approach to incorporate various forms of risk aversion *beyond* the inherent risk aversion of log utility, including aversion to uncertainty in probability estimates (ambiguity). People *do* call this "ambiguity aversion" informally.
      *   **Potentially Misleading:** This phrasing treats "ambiguity weight" as a simple, well-defined scaling factor directly equivalent to some measure of ambiguity aversion. The reality is messier. Quantifying ambiguity aversion and translating it precisely into a Kelly fraction scaling is complex and context-dependent.

  6.  **"...which is literally the same thing as maximin EU for every decision problem."**
      *   **Incorrect & Overgeneralized:** This is the most problematic claim.
          *   **Not Equivalent:** Maximin Expected Utility (MEU - Gilboa & Schmeidler) is a specific, *extremely* pessimistic decision rule: choose the action with the highest minimum expected utility *over all possible probability distributions in your set*. It completely ignores any possibility of favorable outcomes.
          *   **Scaling Kelly is Different:** Scaling the Kelly fraction (e.g., betting 1/2 Kelly) still uses a *single, adjusted* probability estimate (or implicitly averages over them). It reduces exposure but doesn't *solely* focus on the absolute worst-case scenario. A fractional Kelly bettor might still take risks MEU would absolutely reject.
          *   **Not for "Every Decision Problem":** The relationship between ambiguity aversion, Kelly scaling, and formal models like MEU or smooth ambiguity is complex and nuanced. While fractional Kelly *can* be a *heuristic response* to ambiguity aversion, it is **not** mathematically equivalent to MEU in general. MEU is far more extreme and operates on a different principle (worst-case probability).

  **Summary Audit:**

  *   **Accurate & Settled:** Core equivalence of Kelly to EUT with log utility, rejection of negative EV bets under log utility, independence of Kelly math from EE narratives.
  *   **Common Simplification/Intuition:** "Linear in log-space" for risk intuition, using fractional Kelly scaling as a *heuristic* for various uncertainties (including ambiguity).
  *   **Contested:** The necessity, novelty, and specific claims of the ergodicity economics narrative around Kelly and non-ergodicity.
  *   **Incorrect/Overgeneralized:** Equating fractional Kelly scaling (especially motivated by ambiguity) to Maximin Expected Utility (MEU). They are fundamentally different decision rules. The "ambiguity weight" scaling is not rigorous or equivalent to MEU.

  **Verdict on Framing:** Your roommate's framing holds up reasonably well on the *core Kelly math and its EUT foundation*, and their skepticism of the EE narrative is defensible. However, the claims about ambiguity aversion and its equivalence to MEU are significantly oversimplified and incorrect. The discussion of fractional Kelly as a response to ambiguity is a practical heuristic but presented with more formal equivalence than exists. Your intuition about sleight of hand, particularly regarding ambiguity and MEU, is correct.
