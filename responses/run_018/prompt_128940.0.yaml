  The risk aversion point is clever but overbaked. Log utility does handle risk aversion, but calling it "linear in log-space" is more of a metaphor than rigorous math. It's a common pedagogical shortcut. 

  Now the ergodicity economics angle... here's where the roommate is right to be dismissive. The "time averages = ensemble averages" claim is indeed controversial and not necessary for Kelly math. Mainstream econ would call that an overreach. Good on the roommate for calling out the marketing spin. 

  But then ambiguity aversion... oof. This is where the roommate's argument falls apart. Scaling Kelly by "ambiguity weight" is NOT equivalent to maximin EU. Maximin is far more extreme - Kelly still uses probabilities, just adjusted. Conflating these is either sloppy or disingenuous. 

  The user seems analytically sharp - they caught the "sleight of hand" vibe. Their underlying need might be understanding where these concepts get weaponized in debates. The ergodicity and ambiguity bits are exactly where academic turf wars happen. 

