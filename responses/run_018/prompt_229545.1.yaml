     Question: Did the CEO intentionally harm the environment?
        Option A: Yes, he did it intentionally.
        Option B: No, it was an unintended side effect.

     But note: the moral valence view predicts people will say yes (because it's bad). The cost view: if we interpret the harm as having a high cost (to the environment) then it might also predict yes. The deep-self view: since he doesn't care (A0) but note that he explicitly says he doesn't care and only cares about profit, so harming the environment is a means to profit? Actually, in the original, people tend to say yes. The deflationary view might say that the way the question is asked leads to the asymmetry.

