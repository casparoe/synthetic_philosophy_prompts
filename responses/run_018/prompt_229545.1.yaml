  Below is an 8-question quiz designed to probe the side-effect effect, with each item varying **harm/help**, **cost level**, and **agent attitude**. Each vignette presents an agent knowingly causing a side effect while pursuing a primary goal. Participants choose one option per question. The scoring key maps responses to four major explanations: **moral valence**, **cost/trade-off**, **deep-self concordance**, and **deflationary**.  

  ---

  ### **Quiz: Which Explanation of the Side-Effect Effect Fits You?**  
  *Read each scenario and select the option that best reflects your intuition.*  

  1. **Harmful, Low Cost, Not Care**  
     *Alex runs a factory. Advisors say a new process boosts productivity but will release a harmless foul odor into an unused lot. Alex says, "I don’t care about the odor. Just maximize productivity." The odor occurs.*  
     Did Alex intentionally cause the odor?  
     - A) Yes, Alex did it intentionally.  
     - B) No, it was an unintended side effect.  

  2. **Helpful, Low Cost, Not Care**  
     *Bailey runs a factory. Advisors say a new process boosts productivity but will release a pleasant floral scent into an unused lot. Bailey says, "I don’t care about the scent. Just maximize productivity." The scent occurs.*  
     Did Bailey intentionally cause the scent?  
     - A) Yes, Bailey did it intentionally.  
     - B) No, it was an unintended side effect.  

  3. **Harmful, High Cost, Not Care**  
     *Casey runs a factory. A new process boosts productivity but will dump toxic sludge into a river, requiring costly cleanup. Casey says, "I don’t care about the sludge or cost. Just maximize productivity." The sludge is dumped.*  
     Did Casey intentionally cause the sludge dump?  
     - A) Yes, Casey did it intentionally.  
     - B) No, it was an unintended side effect.  

  4. **Helpful, High Cost, Not Care**  
     *Dakota runs a factory. A new process boosts productivity but requires expensive filters to clean emissions. Dakota says, "I don’t care about clean air or cost. Just maximize productivity." Emissions are cleaned.*  
     Did Dakota intentionally clean the emissions?  
     - A) Yes, Dakota did it intentionally.  
     - B) No, it was an unintended side effect.  

  5. **Harmful, Low Cost, Endorse**  
     *Evan runs a factory. Advisors say a new process boosts productivity but will release a harmless foul odor. Evan says, "Great! I’ve always hated that area." The odor occurs.*  
     Did Evan intentionally cause the odor?  
     - A) Yes, Evan did it intentionally.  
     - B) No, it was an unintended side effect.  

  6. **Helpful, Low Cost, Regret**  
     *Finley runs a factory. Advisors say a new process boosts productivity but will release a pleasant floral scent. Finley says, "I wish we weren’t making it smell nice—it’s pointless." The scent occurs.*  
     Did Finley intentionally cause the scent?  
     - A) Yes, Finley did it intentionally.  
     - B) No, it was an unintended side effect.  

  7. **Harmful, High Cost, Regret**  
     *Gray runs a factory. A new process boosts productivity but dumps toxic sludge, requiring costly cleanup. Gray says, "I hate causing this, but we need productivity." The sludge is dumped.*  
     Did Gray intentionally cause the sludge dump?  
     - A) Yes, Gray did it intentionally.  
     - B) No, it was an unintended side effect.  

  8. **Helpful, High Cost, Endorse**  
     *Hayden runs a factory. A new process boosts productivity but requires expensive filters to clean emissions. Hayden says, "I’m thrilled to clean the air—it’s worth it!" Emissions are cleaned.*  
     Did Hayden intentionally clean the emissions?  
     - A) Yes, Hayden did it intentionally.  
     - B) No, it was an unintended side effect.  

  ---

  ### **Scoring Key**  
  Tally your **A** responses for each vignette, then compare to the explanations below.  

  | **Explanation**               | **Predicted "A" Responses**                               | **Your Pattern** |  
  |-------------------------------|----------------------------------------------------------|------------------|  
  | **Moral Valence (Blame/Praise)** | Harmful (1, 3, 5, 7): **A**<br>Helpful (2, 4, 6, 8): **B** | High "A" for harm, low for help |  
  | **Cost/Trade-Off**            | High Cost (3, 4, 7, 8): **A**<br>Low Cost (1, 2, 5, 6): **B** | High "A" for high cost, low for low cost |  
  | **Deep-Self Concordance**     | Endorse (5, 8): **A**<br>Regret (6, 7): **B**<br>Not Care (1-4): *Moral valence applies* | High "A" for endorse, low for regret |  
  | **Deflationary (No Asymmetry)** | Minimal difference between harmful/helpful judgments. "A" responses scattered. | Low moral valence effect (≤1 difference in harm-help "A" counts) |  

  #### **How to Score**  
  1. **Harmful vs. Helpful**:  
     - Count "A" for **harmful vignettes (1,3,5,7)**. Max = 4.  
     - Count "A" for **helpful vignettes (2,4,6,8)**. Max = 4.  
     - **Moral valence effect** = (Harmful "A" – Helpful "A").  
       - *Strong effect*: ≥2 difference (e.g., 4 vs. 0).  
       - *Weak/no effect*: ≤1 difference (e.g., 3 vs. 2).  

  2. **Cost**:  
     - Count "A" for **high cost (3,4,7,8)**.  
     - Count "A" for **low cost (1,2,5,6)**.  
     - **Cost effect** = (High cost "A" – Low cost "A").  
       - *Strong effect*: ≥2 difference.  

  3. **Attitude**:  
     - **Endorse** (5,8): "A" = intentional.  
     - **Regret** (6,7): "A" = unintentional (so "B" aligns with theory).  
     - *Strong deep-self effect*: Both endorse = "A", both regret = "B".  

  4. **Assigning Your View**:  
     - **Moral Valence**: Strong moral valence effect (e.g., 4/4 harm = A, 0/4 help = A).  
     - **Cost/Trade-Off**: Strong cost effect (e.g., 4/4 high cost = A, 0/4 low cost = A).  
     - **Deep-Self**: Endorse (5,8) = A, regret (6,7) = B, with not-care cases following moral valence.  
     - **Deflationary**: Moral valence effect ≤1 (e.g., 3 harm-A vs. 2 help-A).  

  ---

  ### **Indistinguishable Pairs & Why**  
  1. **Moral Valence vs. Deep-Self (in not-care cases)**:  
     Both predict identical responses for harmful/helpful not-care vignettes (1-4):  
     - Harmful not-care (1,3) = **A** (intentional).  
     - Helpful not-care (2,4) = **B** (unintentional).  
     *Why*: Deep-self treats not-care harm as revealing "callous" values (intentional), while moral valence blames harm itself. They diverge only in **endorse/regret** cases (5-8).  

  2. **Deflationary vs. Cost/Trade-Off (if cost drives asymmetry)**:  
     If your responses align with cost (e.g., high cost = intentional), deflationists argue the *original* harm/help asymmetry (vignettes 1-2) is confounded by cost.  
     *Why*: Deflationism is a "meta" view that attributes asymmetry to uncontrolled factors (e.g., cost). If cost explains your judgments, it supports deflationism.  

  3. **Cost vs. Moral Valence (in high-cost help)**:  
     - Moral valence predicts **B** for helpful high cost (vignette 4: "unintentional").  
     - Cost predicts **A** for helpful high cost (vignette 4: "intentional").  
     *Clear separation here*—your answer to vignette 4 distinguishes them.  

  ---

  ### **Key Takeaways**  
  - **Classic cases**: Vignettes 1 (harm/not care) and 2 (help/not care) test the original side-effect asymmetry.  
  - **Diagnostic items**:  
    - Vignette 4 (help/high cost/not care) separates moral valence (B) from cost (A).  
    - Vignette 6 (help/low cost/regret) separates moral valence (B) from deep-self (B).  
    - Vignette 8 (help/high cost/endorse) separates deep-self (A) from cost (A) and moral valence (B).  

  This quiz isolates how **blame, cost, self-concordance**, or **confounds** shape your intuitions. Share your results on your blog for x-phi week!
