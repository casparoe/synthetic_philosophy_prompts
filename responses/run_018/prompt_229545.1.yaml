  We are creating a quiz to distinguish between four explanations of the side-effect effect:
    1. Moral valence view (blame/praise): People are more likely to judge a side effect as intentional if it is bad (harmful) than if it is good (helpful).
    2. Cost/trade-off view: People are more likely to judge a side effect as intentional if it has a high cost (even if morally neutral or positive) because it requires a trade-off.
    3. Deep-self concordance view: People judge a side effect as intentional if it aligns with the agent's deep values (endorsement) or not if it doesn't (regret or indifference).
    4. Deflationary view: There is no real asymmetry; apparent asymmetries are due to confounds (like differences in how we describe the cases or other factors).

   We vary three factors per vignette:
     - Harmful vs. Helpful side effect
     - High cost vs. Low cost (independent of moral valence)
     - Agent's attitude: endorse, regret, or not care.

   We want at least one chairman-like harming case and one structurally matched helping case.

   We will create 8 vignettes, each with 2-3 options (about whether the effect was intentional / done on purpose / reflects the agent). The options will be phrased to capture the judgment.

   Then, we will provide a scoring key that maps answer patterns to the four views.

   Important: We must note which pairs of explanations the items cannot cleanly separate and why.

