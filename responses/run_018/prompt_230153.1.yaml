prompt: |-
  I'm taking a philosophy of medicine course this term and I have to run a fifty-minute section for first-years on the naturalism vs. normativism debate about health and disease. The annoying part is they've already had one lecture on it, so they can all repeat the slogan—naturalism says disease is objective biological dysfunction, normativism says values are built in—but the lecturer warned me they mostly came away thinking it's science vs. opinion, and I have to undo that. They're mostly pre-meds who want the one right answer so they can get back to studying, which is exactly the instinct I need the session to break.

  Please act as a philosophy of medicine teacher who has taught this exact debate before, and think through the whole session carefully before you write. Then give me a committed teaching plan, not a menu of possibilities: pick an order, pick an example, and defend them. I need (a) the sequence the ideas have to go in, with what depends on what—my hunch is they can't see the force of normativism until they see that even choosing a statistical reference class involves a choice, but correct me if I've got that backwards; (b) the one carrying example to build the whole session around—I keep going back and forth between the recent-ish US hypertension guideline change that turned millions of adults into patients and homosexuality's removal from the DSM; pick one or pick a better one and say what it must have and what it must not have; (c) the misconceptions I should expect in the order they'll actually come up, with the exact point in the sequence to head each one off—I especially dont want them walking out thinking normativism means disease is made-up, or that naturalism means natural is good, but I also know better than to front-load a list of corrections; (d) what I should openly leave out at this level—I'm guessing the harmful-dysfunction hybrid views are too much, but maybe not; and (e) one final question to ask that would tell me wether they actually got the distinction rather than just learned to nod at the word values.

  Write the whole thing in American English.
reasoning: |-
  Okay, the user is teaching a philosophy of medicine section for first-year pre-med students. They need to clarify the naturalism vs. normativism debate after a previous lecture oversimplified it as "science vs. opinion." The students are likely focused on finding the "right answer," so the session must challenge that mindset.

  Breaking down the key requirements:
  - Need a step-by-step teaching plan with logical sequence
  - Must choose one central example (hypertension vs. homosexuality debate)
  - Should anticipate and address misconceptions organically
  - Requires strategic omissions to avoid overload
  - Needs one diagnostic question to assess comprehension

  The hypertension guideline change (2017 ACC/AHA) is the stronger example because:
  1) It's medically current and relevant to pre-meds
  2) Shows how the same biological data leads to different disease classifications
  3) Avoids politicization risks of the DSM example
  4) Demonstrates real-world diagnostic consequences

  The core insight students must grasp: Even "objective" biological measures require normative choices about thresholds and populations. The session should build from concrete medicine to abstract philosophy:

  1. Start with hypertension case study to hook students
  2. Reveal hidden values in statistical reference classes
  3. Contrast naturalist claims of pure biology
  4. Introduce normativist counterarguments
  5. Show how both coexist in practice

  Critical misconception timing:
  - When presenting stats (preempt "natural=unbiased")
  - During normativism intro (prevent "values=arbitrary")
  - Wrap-up (clarify naturalism isn't moral endorsement)

  Omit hybrid theories for now - foundational concepts first. Final assessment question forces application: "How would naturalist/normativist view a borderline hypertension case?"

  The goal isn't to pick sides but show how medical facts and human values constantly interact in clinical practice. Pre-meds need to see this complexity as clinically relevant, not philosophical distraction.
answer: |-
  Here's your complete fifty-minute teaching plan for the naturalism vs. normativism debate, designed to dismantle the "science vs. opinion" misconception while keeping pre-meds engaged. It centers on the **2017 ACC/AHA Hypertension Guideline Change** (lowering the threshold from 140/90 to 130/80 mmHg, instantly classifying 31 million more Americans as hypertensive). This example avoids politicization, demonstrates real-world consequences, and forces confrontation with both biological data *and* value judgments.

  **Why This Sequence Works:**  
  We start with concrete medicine → expose hidden values in "objective" measures → challenge naturalism → validate normativism → show interdependence. **Yes, your hunch is correct:** They won’t feel normativism’s force until they see values embedded in naturalism’s own framework (like reference classes). Front-loading normativism feels like "opinion" without this setup.

  ---

  ### **Teaching Plan: Unpacking the Values Beneath the Stethoscope**  
  *(Total: 50 min)*  

  #### **Part 1: Hook & Case Study - Hypertension Guideline Change (12 min)**  
  - **(0-2 min) Quick Poll:** "Raise your hand if you’ve heard of the 'naturalism vs. normativism' debate. Now keep it up if you think naturalism = science, normativism = opinion." (Acknowledge hands—this is the misconception we’re tackling).  
  - **(2-10 min) Case Intro:** Present the 2017 hypertension guideline change. Focus on:  
    - *Biological facts:* BP’s role in cardiovascular strain, linear risk increase.  
    - *Impact:* 31M new "patients," implications for insurance, treatment burden, psychological stress.  
    - *Key question:* "Did science *discover* that 130/80 is diseased? Or did experts *decide* it?"  
  - **(10-12 min) Initial Reactions:** Ask: *"If you were on the guideline panel, what evidence would you need?"* (List: RCTs, epidemiology, risk models. *Do not debate yet*—just show they’re already thinking about data).  

  #### **Part 2: Exposing Values in Naturalism’s Foundation (15 min)**  
  - **(12-17 min) Naturalism’s Claim:** Recap: "Disease = biological dysfunction" (e.g., Boorse). Hypertension fits—heart/vessels failing to maintain homeostasis.  
    - **Misconception Alert #1 (Head off now!):** *"But isn’t biology just objective facts?"*  
      → *Response:* "Let’s test that. What’s a ‘normal’ BP? How do we set the threshold?"  
  - **(17-25 min) The Reference Class Problem:**  
    - Activity: *"Imagine two patients: 65yo Black man (BP 135/85), 25yo athlete (same BP). Same risk? Same ‘dysfunction’?"*  
    - Reveal: Naturalism requires choosing a *reference class* (age, sex, etc.). But which class matters? **Values decide:** Do we prioritize population-level risk reduction (favoring lower thresholds) or minimizing overdiagnosis (favoring higher ones)?  
    - **Key Insight:** Even "objective" thresholds embed values about who counts as "normal" and what risk level justifies intervention.  
  - **(25-27 min) Link to Case:** The ACC/AHA panel weighted *early intervention benefits* over *overtreatment harms*—a value judgment masked as data.  

  #### **Part 3: Normativism’s Core (Not "Opinion") (13 min)**  
  - **(27-30 min) Normativist Claim:** "Disease categories reflect values about suffering, disability, or social norms" (e.g., Engelhardt, Hofmann).  
    - **Misconception Alert #2 (Head off now!):** *"So disease is just whatever we say it is? Like witch trials?"*  
      → *Response:* "No—values are *constrained* by biology. Hypertension isn’t witchcraft; it causes real harm. But biology alone doesn’t tell us *how much* harm counts as disease." Show the continuum:  
      ```  
      BP = 120 → 130 → 140 → 180 (Biology: Linear risk ↑)  
      Values: Decide where "risk" becomes "disease"  
      ```  
  - **(30-37 min) Values in Action:** Revisit hypertension:  
    - *Why lower the threshold?* Values: Preventing strokes > avoiding patient anxiety.  
    - *Why criticize the change?* Values: Clinical burden < benefit for low-risk patients.  
    - **Crucial Point:** Both sides appeal to evidence—but values prioritize *which evidence matters*.  
  - **(37-40 min) "Science vs. Opinion" Dismantled:**  
    - Naturalism isn’t "pure science" (needs value-laden reference classes).  
    - Normativism isn’t "opinion" (requires empirical grounding + ethical reasoning).  

  #### **Part 4: Synthesis & Takeaways (10 min)**  
  - **(40-45 min) Interdependence:**  
    - Naturalism asks: *"Is there a biological abnormality?"*  
    - Normativism asks: *"Does this abnormality matter to well-being?"*  
    - Both needed: Biology without values can’t define disease; values without biology can’t distinguish disease from social deviance.  
  - **(45-48 min) What We Omitted (Briefly):**  
    - Hybrid theories (e.g., Wakefield’s "harmful dysfunction"): "That’s next week! Today we needed the core conflict."  
    - Social constructivism extremes: "We’re not saying disease isn’t real—we’re saying *classifying* it involves values."  
  - **(48-50 min) Final Diagnostic Question:**  
    *"Imagine a 55-year-old with BP 128/82. According to naturalism, is this hypertension? According to normativism, should it be treated? Explain where values or biology drive each answer."*  
    - **Why it works:** Forces them to apply both frameworks. Correct answers:  
      - Naturalism: Depends on reference class (biology + values).  
      - Normativism: Depends on risk/benefit tradeoffs (values + biology).  

  ---

  ### **Why This Example (Hypertension) Over Homosexuality in DSM:**  
  - **Must have:**  
    - Clear biological component (BP) to satisfy naturalist intuition.  
    - Value-driven diagnostic shift with measurable impact.  
    - Avoids moral debates (distracting for pre-meds).  
  - **Must not have:**  
    - Polarizing identity politics (distracts from philosophy).  
    - Lack of biological basis (homosexuality’s removal wasn’t driven by new biology, muddying the naturalism angle).  

  ### **Anticipated Misconceptions & Timing:**  
  1. **"Naturalism = science" (Part 2):** Crushed when choosing reference classes exposes values.  
  2. **"Normativism = anything goes" (Part 3):** Neutralized by showing values are evidence-constrained.  
  3. **"Naturalism = natural is good" (Wrap-up):** Clarify naturalism describes function, not ethics (e.g., sickle cell is "natural" but dysfunctional).  
  4. **"So doctors just decide what’s diseased?" (Part 3):** Emphasize values are debated, evidence-based, and socially negotiated (e.g., guideline panels).  

  ### **Final Note:**  
  Pre-meds resist "philosophy" when it feels detached from practice. By anchoring in a clinical guideline, you force them to see this isn’t abstract—it’s the bedrock of how they’ll diagnose. End by noting: *"You won’t find the ‘one right answer’ because medicine isn’t pure science—it’s science in the service of human goals. Your job is to navigate that tension."* That’s the instinct broken.
