  ### Residue Report  
  | **Claim**                          | **Status**              | **Notes**                                                                 |
  |------------------------------------|-------------------------|---------------------------------------------------------------------------|
  | **Money-Pump Critique**:           |                         |                                                                           |
  | Cyclical preferences permit depletion | Clean translation       | Maps to ΔG > 0 per cycle (net work loss to reservoir).                    |
  | Exploiter extracts net resources   | Clean translation       | External reservoir gains work; system free energy declines irreversibly.  |
  | **Diachronic Defense**:            |                         |                                                                           |
  | Extended plans constrain choices   | Survives with distortion| Macrostates constrain microtrajectories, but "plans" lack teleological counterpart. |
  | Cyclicality serves broader strategy| Distorted survival      | NESS requires external drive; "strategy" has no physical analog.          |
  | Stability without depletion        | Clean translation       | Achievable in NESS via balanced entropy production/export (e.g., Prigogine’s theorem). |
  | **Normative Claim**:               |                         |                                                                           |
  | "Ought not be pumpable"            | **No expression**       | Thermodynamics describes inevitabilities (ΔS ≥ 0), not obligations.       |
  | Rationality as law-like constraint | Partial distortion      | Physical laws (e.g., 2nd Law) are descriptive; rationality is prescriptive. |

  **Normative Residue**: The injunction against being pumpable has no thermodynamic counterpart. Physics dictates that *uncompensated cycles deplete*, but "ought" implies a normative standard absent in entropy production. NESS stability is a contingent outcome, not an imperative.
