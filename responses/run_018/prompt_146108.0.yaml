  Their continuity distinction should come after establishing transformation basics but before the butterfly passage. The butcher story can transition into it - Ding's skill shows non-narrative continuity. 

  For assessment, I'm considering a question forcing choice between skepticism and transformation frameworks regarding identity. Should explicitly bracket epistemology to keep focus. 

