  First, the core issue is evaluating decisions with unbounded upside but extremely low probability. The user mentioned real-world analogs like moonshot science and intergenerational climate bets. So the theory must handle both theoretical puzzles (like the original St. Petersburg paradox) and real-life decisions. They want the desiderata to address distinctions like risk aversion vs. rational boundedness, and normative vs. descriptive failures.

  I need to list out the key requirements. The user hinted at a tension between adhering to standard expectation calculus and rejecting infinite valuations. That's crucial. Also, they want the theory to avoid dominance violations in finite cases. Other points include accommodating real-world constraints (computational limits, uncertainty in probabilities), differentiating risk attitudes, and handling non-monetary outcomes like ethical stakes in climate bets.

  Let me outline the desiderata. Start with Finite Action Guidance: the theory must give a clear decision without infinite valuations. Then, Respects Finite Dominance: it shouldn't contradict dominance in bounded cases. Accommodates Risk Attitude: allows for risk aversion without conflating with irrationality. Acknowledges Bounded Rationality: considers cognitive limits. Handles Uncertainty: deals with imprecise probabilities. Non-Monetary Values: incorporates non-pecuniary factors. Distinguishes Normative/Descriptive: clarifies when the theory prescribes vs. describes behavior. Addresses Real-World Cases: applies to climate bets, etc.

  The tension between Finite Action Guidance and Compliance with Expectation Calculus in Bounded Cases is key. Expectation maximization works in finite cases but fails in St. Petersburg scenarios. The user suspects these are jointly unsatisfiable. I agree—it's a real tension. Any theory fixing the paradox must modify or abandon strict expectation maximization in unbounded domains.

  Now, evaluating existing approaches. Expected Utility with Bounded Utility (like logarithmic) satisfies most but fails in truly unbounded cases. Risk-Weighted Models (e.g., rank-dependent) handle risk aversion but struggle with unbounded upside. Satisficing Heuristics (like aspiration levels) avoid infinite calculations but lack normative grounding. Multi-Criteria Frameworks (like catastrophic risk focus) handle ethical aspects but are ad hoc.

  The user is on a train, stressed about a job decision. They need clarity on theory to make an informed choice. Underlying needs: reducing anxiety by understanding rational criteria, ensuring the decision aligns with personal values (risk tolerance, ethical stakes), and practical applicability. Highlighting the tension in desiderata explains why no theory is perfect, helping them weigh trade-offs. Emphasizing bounded rationality and real-world constraints might resonate, showing that rejecting the bet isn't irrational but adaptive.
answer: |-
  Here are the desiderata for a theory of rational choice capable of handling St. Petersburg-type situations, grounded in the puzzles and distinctions you raised, followed by a brief evaluation of common approaches:

  **Desiderata for an Adequate Theory:**

  1.  **Finite Action Guidance:** The theory must yield a finite, actionable valuation or preference ordering for options with unbounded *possible* upside, even when the *expected* monetary value (EMV) is infinite under naive calculation.
      *   **Motivating Case:** The original St. Petersburg Paradox itself. Naive EMV says pay any finite price, but no rational agent does this in practice. A theory demanding infinite payment is useless for real decisions like your startup equity offer or investing in a fusion startup with a tiny chance of planetary-scale energy.
      *   **Must Dissolve:** The practical paralysis induced by infinite EMV calculations. Requires rejecting "pay any finite amount" as the sole prescription.

  2.  **Respects Finite Dominance:** The theory must strictly adhere to the principles of stochastic dominance in all *finite* decision problems. If Option A pays at least as much as Option B in every possible state of the world and strictly more in at least one state, the theory must prefer A over B.
      *   **Motivating Case:** Any ordinary investment choice, insurance purchase, or gamble with bounded outcomes. Violating dominance here is a fundamental failure of rationality. A theory fixing St. Petersburg by breaking dominance in simple cases is worse than useless.
      *   **Must Distinguish:** Fixing St. Petersburg cannot come at the cost of violating bedrock rationality principles in standard, finite contexts.

  3.  **Accommodates Risk Attitude:** The theory must provide a coherent framework for incorporating genuine *risk aversion* (or risk-seeking) as a rational preference, distinct from computational limitations or ignorance. Risk attitude should demonstrably affect valuations in St. Petersburg-like scenarios.
      *   **Motivating Case:** Why someone might rationally value your startup equity offer (high risk, high potential reward) differently than a government bond, even after accounting for probabilities. It must explain why rejecting a St. Petersburg gamble isn't *necessarily* irrational boundedness, but can reflect a legitimate preference for certainty/avoiding ruin.
      *   **Must Distinguish:** Between being rationally risk-averse and being computationally incapable of handling complex probabilities or unbounded outcomes.

  4.  **Acknowledges Bounded Rationality (Computational/Practical):** The theory must acknowledge and incorporate the rational implications of fundamental constraints: inability to compute infinite sums, profound uncertainty about extreme tail probabilities, finite lifespan/liquidity needs, and the practical impossibility of experiencing truly infinite payoffs.
      *   **Motivating Case:** Real-world St. Petersburg analogues like long-term climate policy or deep-time nuclear waste management. Humans and institutions *cannot* accurately assign probabilities to events centuries hence or compute payoffs over infinite horizons. Ignoring this leads to absurd prescriptions. Your roommate's intuition taps into this.
      *   **Must Distinguish:** Between the *normative* ideal (what a perfect, unconstrained reasoner "should" do) and the *procedurally rational* action for a finite agent facing genuine uncertainty and computational limits.

  5.  **Handles Uncertainty, Not Just Risk:** The theory must function robustly under conditions of deep *uncertainty* (unknown or unquantifiable probabilities), not just calculable risk (known probabilities).
      *   **Motivating Case:** Moonshot science funding or truly novel climate interventions (e.g., large-scale geoengineering). Probabilities of success/impact are often not just small, but fundamentally unknown or subject to radical disagreement. A theory relying solely on precise probabilities fails here. Your startup's "tiny chance" likely involves significant uncertainty.

  6.  **Incorporates Non-Monetary Values & Constraints:** The theory must integrate non-pecuniary factors like ethical considerations, opportunity cost of time/effort, personal liquidity needs, and catastrophic downside risks (potential ruin) that dominate decisions even when upside is unbounded.
      *   **Motivating Case:** Intergenerational climate bets involve ethical duties beyond monetary payoff. Taking a low-salary startup job has significant opportunity cost and personal risk (career trajectory, savings depletion) even if the equity *might* be worth billions. A purely monetary model is insufficient.

  7.  **Distinguishes Normative Prescription from Descriptive Psychology:** The theory must clearly articulate its *normative* claims (what constitutes rational choice) while recognizing that human descriptive behavior often deviates due to heuristics, biases, or the very constraints the theory addresses. It should explain *why* naive EMV fails normatively in unbounded cases, not just describe the deviation.
      *   **Motivating Case:** Identifying whether rejecting a St. Petersburg gamble is a *rational* response (per the theory) or merely a common psychological bias (like loss aversion misapplied).

  8.  **Addresses Real-World Stakes:** The theory must provide plausible guidance for decisions with the structural features of St. Petersburg (vanishingly small probability, potentially vast payoff, significant uncertainty, real constraints) encountered in practice, like your job offer, venture capital, existential risk mitigation, or long-term policy.
      *   **Motivating Case:** Your climate-tech startup decision is the prime example. The theory shouldn't "dissolve" the paradox only in abstract coin-flip games but remain silent or implausible on materially similar real choices.

  **Flagged Tension:**

  *   **Desideratum 1 (Finite Action Guidance)** and **Desideratum 2 (Respects Finite Dominance) + Compliance with Expectation Calculus in Bounded Cases** appear **jointly unsatisfiable** under strict, unmodified expectation maximization. Your hunch is correct and real:
      *   Expectation maximization (EM) works perfectly for finite gambles (satisfying 2).
      *   EM applied naively to St. Petersburg yields infinite value (violating 1).
      *   *Any* modification to EM that yields a finite value for St. Petersburg *must* involve either:
          *   A functional form that violates the linearity in probabilities or utilities required for EM to hold generally (potentially violating dominance in complex finite gambles or failing 2 indirectly).
          *   Introducing a procedural rule that abandons EM calculation *specifically* for unbounded cases (which breaks the universality of EM).
      *   **Conclusion:** A theory satisfying both 1 and 2 *cannot* be strict, universal expectation maximization. It requires a fundamental modification or alternative principle for unbounded domains.

  **Evaluation of Approaches Against Desiderata:**

  1.  **Bounded Utility (e.g., Log Utility):**
      *   **Score:** Moderate-High. Addresses (1) directly (Log(∞) is undefined, valuation finite), satisfies (2) in bounded cases, elegantly incorporates (3) (concave utility = risk aversion). Struggles with (4) & (5) (assumes precise probabilities & unbounded computation possible), weakly addresses (6) (utility *could* include non-pecuniary factors, but rarely modeled well). Fails (8) if the payoff is truly unbounded (Log still → ∞) or probabilities are deeply uncertain. Handles (7) reasonably well normatively.

  2.  **Risk-Weighting/Probability Distortion Models (e.g., Rank-Dependent, Prospect Theory):**
      *   **Score:** Moderate. Excels at (3) and descriptive aspects of (7). Can address (1) by underweighting extreme tail probabilities. Respects (2) in many formulations. Directly addresses aspects of (4)/heuristics. Good for (8) descriptively. Weak on (5) (still needs probabilities), and (6) (non-monetary factors often an add-on). Normative justification (7) for specific weighting functions beyond description is often contested.

  3.  **Satisficing with Aspiration Levels (in Unbounded Domains):**
      *   **Score:** Moderate for Procedural Rationality. Directly embraces (4) - stops calculation when a "good enough" outcome is secured with sufficient probability. Provides clear (1). Can incorporate (3) via aspiration level setting and (6) naturally. Handles (5) & (8) pragmatically. Major weakness: Violates (2) easily – an option dominating the satisficing choice might be ignored. Weak normative justification (7) – it's often seen as only descriptively or procedurally rational, not ideally normative.

  4.  **Focus on Catastrophic Risk / Ruin Avoidance (Prioritizing Downside):**
      *   **Score:** Contextually Strong. Directly addresses (1) and (6) (avoiding ruin is paramount). Fits (8) well for bets with existential/career-ruining downsides. Incorporates (3) naturally (extreme risk aversion). Respects (2). Acknowledges (4) by focusing on knowable, critical thresholds. Handles (5) better than most (focuses on known bad outcomes). Normative status (7) depends on justification – can be compelling for intergenerational/climate stakes.

  **Summary Tension:** No single approach dominates. **Bounded Utility** offers the cleanest normative integration but stumbles on true infinity and uncertainty. **Risk-Weighting** describes real behavior well but lacks universal normative force. **Satisficing** is procedurally sensible but normatively weak and violates dominance. **Ruin Avoidance** is compelling for high-stakes real cases but less general. The core tension between finite valuation and expectation maximization (Desiderata 1 vs. 2) forces a choice: modify the utility function, distort probabilities, abandon strict maximization for procedures, or prioritize avoiding disaster. Your startup decision likely hinges most directly on **Risk Attitude (3), Bounded Rationality (4), Uncertainty (5), and Non-Monetary Factors (6)**, making approaches that emphasize these (like Ruin Avoidance or pragmatic Satisficing informed by Risk-Weighting insights) particularly relevant.
