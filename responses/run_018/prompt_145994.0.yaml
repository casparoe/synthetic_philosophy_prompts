answer: |-
  **Self-Contained Exam Materials**

  **Exam Question: Essential Differences in a Symmetric Universe (90 Minutes)**

  **Scenario:** Consider a universe containing only two perfectly spherical objects, Alpha and Beta. They are:
  1.  **Spatially Symmetric:** Mirror images of each other across a central plane; each is the only object at its specific distance/direction from the plane. There are no other spatial reference points.
  2.  **Observationally Identical:** All their manifest properties (size, shape, color, temperature, material composition, causal powers, relational dispositions) are identical. No possible observation can distinguish them.
  3.  **Non-Observational Property F:** Both possess a property F. However, F has no observable manifestation whatsoever. It makes no difference to how the spheres look, behave, interact, or are measured. Crucially:
      *   Alpha instantiates F **essentially** (it is part of Alpha's nature; Alpha could not exist without F).
      *   Beta instantiates F only **accidentally** (it is contingent to Beta; Beta could exist without F).

  **Task:** Does this essential/accidental distinction concerning property F successfully defend the Principle of the Identity of Indiscernibles (PII) against Black's counterexample? Or does invoking such a distinction make PII circular or question-begging? Explain your reasoning carefully.

  **Specifically, you must:**
  a)  State clearly whether the distinction saves PII, makes it circular, or presents another significant problem (e.g., ungrounded difference). (4 marks)
  b)  Analyze *why* the essential/accidental distinction concerning F seems like a candidate for salvaging PII. (6 marks)
  c)  Explain the central *circularity worry*: how might this distinction *presuppose* the numerical distinctness of Alpha and Beta rather than *ground* it? (8 marks)
  d)  Demonstrate why the spatial symmetry *alone* cannot resolve the case or distinguish the spheres metaphysically, even though their positions are relationally different. Distinguish clearly between intrinsic and relational properties in your explanation. (7 marks)

  **Guidance:** Structure your response around the four specific tasks (a-d). Aim for concision and precision. Focus on the *metaphysical* problem of individuation, not epistemic limitations. Time allocation suggestions: Planning (10 mins), Task a (5 mins), Task b (15 mins), Task c (25 mins), Task d (20 mins), Review (15 mins). Total written response should be approximately 800-1000 words.

  ---

  **Model Answer (Built around the Four Required Moves):**

  **(a) Outcome:** Invoking the essential/accidental distinction concerning F does **not** successfully save PII from Black's counterexample. Instead, it renders PII **circular** and relies on an **ungrounded intrinsic difference**. (4 marks)

  **(b) Why the Distinction Seems Promising:** The distinction appears to offer a non-relational, non-spatial way to discern Alpha and Beta metaphysically. PII states that no two distinct objects can share all the same properties. In the standard Black scenario, the spheres share *all* properties (intrinsic and relational), challenging PII. Here, while both have F, the *mode of instantiation* differs: F is essential to Alpha but accidental to Beta. If "having F essentially" and "having F accidentally" are distinct properties (call them E_F and A_F), then Alpha has E_F (and lacks A_F), while Beta has A_F (and lacks E_F). They now differ in their properties (Alpha has E_F, Beta does not; Beta has A_F, Alpha does not), seemingly satisfying PII and distinguishing them. This difference is intrinsic (concerning how F is held by each sphere in itself, not in relation to anything else) and non-observational, bypassing the symmetry. (6 marks)

  **(c) The Circularity Worry:** The fatal flaw is that the essential/accidental distinction **presupposes the very numerical distinctness it is meant to explain**. To say F is essential to *Alpha* but accidental to *Beta* requires that there *already are* two distinct entities, Alpha and Beta, to which these different modes of instantiation can be assigned. The property "being essentially F" isn't a primitive tag floating in the void; it must be a property *of a particular object*. Assigning different modal statuses (essential vs. accidental) to F for different objects only makes sense *if those objects are already distinct*. Therefore, the discernibility offered by E_F and A_F doesn't *ground* the distinctness of Alpha and Beta; it *depends logically upon it*. This makes the defense of PII circular: we need distinct objects to have the discernible properties (E_F and A_F) that are supposed to prove the objects are distinct. The difference in modal status is not a fundamental, individuating fact but a derivative one, parasitic on a prior distinction that remains ungrounded. It posits an intrinsic difference (essential vs. accidental instantiation) but provides no basis for *why* this difference applies to *this* sphere rather than *that* one, other than stipulation contingent on their assumed distinctness. (8 marks)

  **(d) Spatial Relations and Intrinsic vs. Relational Properties:** Spatial relations alone cannot resolve the case because:
  *   **Intrinsic Properties:** These are properties an object has purely in virtue of itself, independently of other objects (e.g., mass, shape, *internal* structure, fundamental charge – or hypothetically, the *mode* of having F, if it were grounded). They are what an object "brings to" a relation.
  *   **Relational Properties:** These depend on the existence and properties of other objects or the structure of the universe (e.g., "being 5m from Beta", "being the leftmost sphere", "mirroring Beta").
  In this universe, the *only* differences are relational spatial properties derived from their symmetric positions (e.g., "being on side A of the plane", "being mirrored by Beta"). Crucially, these are *symmetric* relations: the relational property "mirrored by Beta" applies to Alpha, and "mirrored by Alpha" applies to Beta. They are *different* relational properties, but they are *perfectly symmetric* and *do not break the symmetry of the universe*. There is no absolute "here" or "there"; each sphere bears a unique relation *only relative to the other*. However, for these relations to hold, *both relata must already exist*. The relations depend on the distinctness of the spheres; they cannot constitute or ground that distinctness. Pointing to Alpha's relational property "being 5m from Beta" to distinguish it from Beta *requires* Beta to already be a distinct entity. Spatial relations, being fundamentally relational, cannot provide the *intrinsic* ground needed for individuation in a symmetric universe where all other intrinsic properties (besides the dubious modal status of F) are identical. They describe the structure *between* distinct objects but cannot explain *why* there are two distinct objects occupying those structural positions in the first place. (7 marks)

  **Clarity:** (1 mark) The argument progresses logically through the four tasks, uses terms precisely (intrinsic, relational, essential, accidental, circularity, individuation), and avoids unnecessary digression.

  ---

  **Marking Scheme (Total: 25 Marks)**

  *   **(a) Clear Stated Outcome:** **4 marks**
      *   *Characteristic Mistake:* Failing to state a clear position on whether PII is saved or the distinction causes circularity/ungroundedness.
  *   **(b) Analysis of the Distinction's Apparent Promise:** **6 marks**
      *   *Characteristic Mistake:* Merely stating Alpha has F essentially and Beta accidentally without explaining *why* this seems like a discernible property difference relevant to PII, or confusing it with an observable difference.
  *   **(c) Explanation of the Circularity Worry:** **8 marks**
      *   *Characteristic Mistake:* Recognizing the distinction requires distinct objects but failing to articulate how this makes the PII defense circular (presupposing what it needs to prove), or dismissing the worry without substantive argument.
  *   **(d) Spatial Relations & Intrinsic/Relational Distinction:** **7 marks**
      *   *Characteristic Mistake:* Claiming spatial positions *do* individuate without explaining why symmetric relations presuppose distinctness, or failing to clearly define/contrast intrinsic vs. relational properties in this context.
  *   **Clarity of Expression:** **+1 mark** (Awarded holistically for overall structure, coherence, precision of language, and adherence to the task requirements).

  ---

  **Calibration Note:**

  This question effectively separates students with deep metaphysical understanding from those relying on memorized summaries:
  1.  **Memorizers:** Will likely correctly recall the standard Black counterexample (emphasizing lack of intrinsic differences, symmetric relations) but will struggle significantly beyond that. They might:
      *   Misapply the standard "no intrinsic differences" label to this scenario without grappling with the *new* intrinsic-like (modal) difference introduced.
      *   Assert that spatial relations individuate, failing to see the symmetric relational trap.
      *   Superficially state the essential/accidental distinction resolves it *or* causes circularity without providing the crucial argument for *why* (especially the dependency/circularity in move c).
      *   Confuse epistemic indiscernibility with metaphysical identity issues.
  2.  **Understanders:** Will engage directly with the *novel metaphysical crux* introduced by the variant:
      *   They will recognize the *prima facie* threat the variant poses to the standard Black argument by introducing a non-relational difference.
      *   They will quickly identify and meticulously dissect the **circularity worry** (move c) as the core problem, explaining *how* the essential/accidental distinction presupposes distinctness.
      *   They will correctly apply the **intrinsic/relational distinction** to show why spatial properties cannot ground individuation in this symmetric setup, avoiding the relational trap.
      *   Their analysis will focus on grounding, dependence, and the logic of individuation, not just labeling phenomena.

  The difficulty stems entirely from forcing engagement with the **logical dependency** inherent in assigning modal properties to objects presumed distinct and the **inability of symmetric relations to ground distinctness**. No obscure terminology or references are needed; the challenge is conceptual rigor applied to the stipulated scenario. Success hinges on understanding *why* the apparent solution fails at a fundamental metaphysical level.
