answer: |-
  Here’s a prioritized framework for your workshop, grounded in conceptual leverage, interdisciplinary tractability, and real-world relevance—defended with upstream/downstream logic and mind-changing evidence thresholds:

  ### **Priority Ranking & Justification**
  1. **Examine whether "collapse" smuggles in teleological assumptions about progress/complexity**  
     *Why upstream?* This is the **foundational epistemological problem**. If "collapse" inherently assumes societies *should* progress toward complexity (or that deviation is "failure"), the term is morally/politically loaded *before* any case study analysis. It directly addresses your friend's bias critique.  
     *Tractability*: Perfect for non-specialists. Uses philosophy of science tools (e.g., Joseph Tainter vs. James Scott debates) and cultural theory (e.g., why "collapse" narratives resonate in the Anthropocene).  
     *Mind-changing evidence*: If you find pre-modern societies that *celebrated* decentralization (e.g., post-Classic Maya communities rejecting kingly monuments) or historical texts framing "collapse" as liberation, this question becomes urgent. Overlooked Indigenous perspectives could revolutionize this.

  2. **Disentangle demographic collapse from institutional decoupling**  
     *Why next?* This **demystifies mechanisms**. Demographic collapse (population crash) ≠ institutional disintegration (state fragmentation) ≠ cultural continuity (e.g., Maya people surviving "collapse"). Fails without this clarity.  
     *Tractability*: Anthro/grad students can analyze datasets (e.g., Roman Britain vs. Copán population records). Enviro studies critic can spar on modern parallels (e.g., is Detroit’s depopulation a "collapse"?).  
     *Mind-changing evidence*: New bioarchaeological data showing thriving commoners amid elite "collapse" (e.g., Cahokia) would prove institutional vs. demographic divergence. Modern examples (e.g., post-Soviet states) could reframe antiquity.

  3. **Work out normative implications for modern climate adaptation**  
     *Why now?* Forces **practical engagement**. Once you've deconstructed "collapse" (Step 1) and classified its components (Step 2), ask: *Does this help us adapt?* Avoids academic navel-gazing.  
     *Tractability*: Leverage enviro studies' pragmatism. Compare "resilience theory" (e.g., Brian Walker) vs. "collapsist" models (e.g., Deep Adaptation). Policy relevance hooks the skeptic.  
     *Mind-changing evidence*: If climate models show "adaptive decoupling" (e.g., local renewables replacing grids) prevents human suffering better than "collapse" rhetoric, prioritize this higher. Policy windows (e.g., IPCC reports) could elevate urgency.

  4. **Compare Bronze Age & Maya transitions for causal structures**  
     *Why last?* **Case studies test frameworks**—they don't build them. Without conceptual clarity (Step 1-2), comparisons risk cherry-picking. Specialized knowledge needed (e.g., Linear B decline vs. Maya drought chronologies).  
     *Tractability*: Tricky for non-archaeologists. Requires parsing niche debates (e.g., Sea Peoples' historicity). Better as a *capstone* applying prior insights.  
     *Mind-changing evidence*: New paleoclimate data proving identical stressors (e.g., drought sequences) triggered divergent outcomes would make this pivotal—but still requires Steps 1-3 to interpret.

  ---

  ### **What’s Overrated or Risky?**
  - **"Comparing cases without a framework"**: Overrated. Endless archaeological "but what about X?" debates drain time without resolving *why* we compare. Do this *after* defining collapse (Step 1) and its dimensions (Step 2).  
  - **"Academic tidying doesn’t change policy"**: False. **Bad categories create bad interventions**. If policymakers equate "collapse" with apocalypse (vs. transformation), they may:  
    → Overinvest in fortress conservation (e.g., shooting "poachers")  
    → Underfund grassroots adaptation (e.g., urban farming in Detroit)  
    *Example*: Easter Island’s "ecocide" myth justified colonial land grabs—a direct policy harm from flawed collapse narratives.  
  - **"Societies just change shape"**: Nuance needed. Sometimes change is traumatic (e.g., Rwandan genocide), sometimes liberating (e.g., Bronze Age Cypriots thriving post-collapse). Your workshop can **map the spectrum of transformation**.

  ---

  ### **Execution Strategy for 6 Months**
  - **Months 1–2**: Teleology deep dive. Read: Tainter (*Collapse of Complex Societies*), Scott (*Against the Grain*), Yoffee (*Myths of the Archaic State*).  
  - **Months 3–4**: Demographic/institutional toolkit. Apply to 1 ancient + 1 modern case (e.g., Roman Britain vs. Syria’s civil war).  
  - **Month 5**: Normative implications. Debate: Should we retire "collapse"? If so, what replaces it? ("Decomplexification"? "Unraveling"?)  
  - **Month 6**: Test framework on Maya/Bronze Age. Invite an archaeologist for a guest session.

  **Crucial move**: Have the enviro studies critic role-play a policymaker throughout. Forces concrete answers to: *"Why should I care about your semantic debate?"* This bridges theory and praxis—where your workshop’s real power lies.
