  We are writing a research proposal for a term paper in philosophy of science. The problem is about non-hyperbolic chaotic systems and the failure of the shadowing lemma, which might challenge the standard separation of determinism and predictability.

  The proposal must include:
  (a) A precise research question with a determinate answer.
  (b) Why standard accounts (epistemic limitation and computational irreducibility) leave the problem unresolved.
  (c) Methodological approach: conceptual distinctions, argument structure, and why this approach is better than historical survey or formal modeling.
  (d) Success and failure criteria.
  (e) Honest assessment of scope and risks.

  After the proposal, provide a JSON summary with the specified fields.

  Let's break it down.

  **Research Question:**
  We need a precise question. The core idea is: does shadowing failure in non-hyperbolic chaos create a category that is deterministic but "untrackable" in principle, thus disrupting the standard binary?

  Precise question: "Does the failure of the shadowing lemma in non-hyperbolic chaotic systems establish a third category between determinism and predictability, namely deterministic but untrackable dynamics, thereby challenging the standard metaphysical determinism / epistemic predictability dichotomy?"

  **Why standard accounts are insufficient:**
  - Epistemic limitation: This view says prediction fails because of our limited knowledge of initial conditions, but the system is still deterministic. However, in non-hyperbolic chaos, even with perfect initial data, the approximate trajectory may not shadow any true trajectory. So it's not just about our knowledge, but about the structure of the dynamics.
  - Computational irreducibility (like Wolfram): This says that the only way to know the outcome is to run the system. But even in computationally irreducible systems, one might expect that a good approximation would track some true trajectory (via shadowing). But if shadowing fails, then even running an approximate simulation doesn't correspond to any possible reality. So computational irreducibility doesn't capture the idea that the model trajectory is not just an approximation of one true path but is not even close to any true path.

  **Methodological Approach:**
  - Conceptual distinctions:
    1. Metaphysical determinism (the world evolves deterministically) vs. Methodological determinism (our models are deterministic).
    2. Strong shadowing (exact shadowing for hyperbolic systems) vs. Weak shadowing (approximate, but still exists) vs. Shadowing failure (no shadowing).
    3. Ontic chaos (chaos as a feature of the world) vs. Epistemic chaos (chaos as a feature of our models or knowledge).
  - Argument structure:
    - First, set up the standard view: determinism and predictability are separate, with chaos as an example of deterministic unpredictability.
    - Then, introduce non-hyperbolic chaotic systems and the failure of the shadowing lemma, explaining why this is different.
    - Argue that this failure means that even if we had perfect initial data and infinite computational resources, the approximate trajectory we compute might not correspond to any true trajectory. Thus, it's not merely that we can't predict which trajectory we are on, but that our simulation isn't tracking any trajectory at all.
    - Consider whether this creates a new category: deterministic but untrackable. Untrackable meaning that we cannot, even in principle, produce a trajectory that stays close to the true one for long.
    - Compare with the standard accounts and show why they don't resolve this.
  - Why not historical survey? Because the goal is a conceptual argument, not tracing the history of ideas.
  - Why not formal modeling? While some formal examples will be discussed, the focus is on the philosophical implications, not on developing new mathematical results.

  **Success and Failure Criteria:**
  - Success: If we can establish that shadowing failure in non-hyperbolic systems leads to a situation where deterministic systems are not just unpredictable but untrackable in principle, and that this cannot be reduced to an epistemic limitation without changing the standard account, then we have a positive result.
  - Failure: If the analysis shows that shadowing failure is just another form of epistemic limitation (e.g., because with exact initial conditions and perfect computation we could avoid the problem, but that's not possible in practice) or if it turns out that the shadowing failure is so rare that it doesn't challenge the binary, then the project fails. Also, if the new category doesn't hold up under scrutiny (e.g., it collapses into one of the existing categories).

  **Scope and Risks:**
  - Scope: One semester, so we cannot do extensive mathematical modeling. We will rely on existing mathematical results (e.g., from the literature on non-hyperbolic chaos). The focus is on the philosophical interpretation.
  - Risks: The mathematics of non-hyperbolic chaos is complex and might be hard to explain. Also, it's possible that the philosophical community already has responses to this (e.g., by arguing that the model is not a perfect representation, so the issue is still epistemic). Another risk is that the non-hyperbolic case might be considered too pathological or rare to matter for real-world systems.

  **Proposal Structure:**
  1. Introduction and research question.
  2. Background: standard view of determinism and predictability, chaotic dynamics.
  3. Non-hyperbolic chaos and shadowing failure.
  4. Critique of standard accounts (epistemic limitation and computational irreducibility).
  5. The argument for a new category: untrackability.
  6. Implications for the determinism/predictability binary.
  7. Conclusion.

  **JSON Summary:**
