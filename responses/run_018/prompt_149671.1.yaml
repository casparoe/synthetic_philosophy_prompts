  niche_intervention: The specific conceptual move (arguing for a third category of deterministic but untrackable).
  method: Analytical strategy (conceptual analysis using distinctions like ...)
  success_criterion: What a positive result looks like (establishing the third category and its implications).
  failure_criterion: What would make the project fail (collapsing back to epistemic limitation, or showing the phenomenon is negligible).
  scope_note: Honest assessment (one semester, relying on existing math, risks of complexity and counterarguments).

  Now, write the proposal.
answer: |-
  ## Research Proposal: Shadowing Failure in Non-Hyperbolic Chaos and the Disruption of the Determinism-Predictability Binary

  ### (a) Research Question
  Does the failure of the shadowing lemma in non-hyperbolic chaotic systems necessitate a third category—*deterministic but untrackable dynamics*—that fundamentally disrupts the standard philosophical binary separating metaphysical determinism from epistemic predictability, rather than merely expanding the scope of epistemic limitations? The answer will be determinate: either (1) shadowing failure establishes an intermediate category by demonstrating that determinism can coexist with *in-principle untrackability* (where no true trajectory corresponds to an approximate numerical simulation), or (2) it remains reducible to an epistemic limitation, preserving the binary.

  ### (b) Why Standard Accounts Are Insufficient
  The **epistemic limitation account** (e.g., Laplacean demon thought experiments) treats chaotic unpredictability as arising solely from imperfect knowledge of initial conditions, while preserving determinism metaphysically. Yet in non-hyperbolic systems (e.g., Hamiltonian systems with mixed phase spaces), shadowing failure implies that even *perfect* initial data and infinite computational resources cannot guarantee that an approximate trajectory stays close to *any* true trajectory. This is not a limitation of measurement or computation but a structural feature of the dynamics, challenging the assumption that epistemic gaps alone explain unpredictability.

  The **computational irreducibility account** (e.g., Wolfram’s principle) posits that some systems require simulation for prediction but assumes approximate simulations still track *some* true trajectory (via shadowing). Shadowing failure violates this: divergent numerical trajectories are not merely computationally expensive approximations of a specific reality but *ontologically unmoored* from all neighboring true trajectories. Computational irreducibility thus fails to address the deeper problem—that simulations may lack metaphysical correspondence.

  Both accounts presuppose that determinism guarantees the existence of a shadowable trajectory, which non-hyperbolic chaos negates. Neither resolves whether this represents a novel ontological-epistemic hybrid.

  ### (c) Methodological Approach
  **Conceptual Distinctions:**  
  - *Metaphysical vs. Methodological Determinism*: Distinguishes determinism as an ontic property of systems from determinism as a feature of models.  
  - *Strong vs. Weak Shadowing*: Strong shadowing (hyperbolic systems) ensures close tracking; weak shadowing (e.g., stochastic systems) allows probabilistic correspondence; shadowing failure has no such guarantee.  
  - *Ontic vs. Epistemic Chaos*: Separates chaos as a dynamical property from chaos as a limitation of prediction.  
  - *Untrackability*: Defined as the *in-principle impossibility* of any finite-precision trajectory approximating a true trajectory over time, even with perfect initial data.  

  **Argument Structure:**  
  1. **Weeks 1–2**: Critique the standard determinism-predictability binary using canonical examples (e.g., Laplace, Poincaré).  
  2. **Weeks 3–4**: Analyze hyperbolic chaos (shadowing holds) to establish the baseline for "mere unpredictability."  
  3. **Weeks 5–6**: Examine non-hyperbolic chaos (e.g., standard map, Hénon attractor) and shadowing failure, demonstrating its prevalence in physical approximations.  
  4. **Weeks 7–8**: Argue that shadowing failure implies untrackability—a failure of trajectory correspondence that is neither purely epistemic nor ontological.  
  5. **Weeks 9–10**: Test the third category against reductionist objections (e.g., "shadowing failure is still epistemic if idealizations are removed").  
  6. **Weeks 11–12**: Synthesize implications for philosophy of science (e.g., redefining determinism’s epistemic commitments).  

  **Why This Approach?**  
  A historical survey would catalog views but not resolve the conceptual gap. Formal modeling, while invoked illustratively (e.g., citing known non-hyperbolic systems), risks prioritizing technicalities over philosophical synthesis. A conceptual approach prioritizes clarity on how *untrackability* reconfigures the determinism-predictability relationship, making it ideal for a term paper.

  ### (d) Success and Failure Criteria
  **Success Criterion**: The project succeeds if it:  
  - Demonstrates that shadowing failure in non-hyperbolic systems cannot be fully subsumed under epistemic limitation or computational irreducibility.  
  - Positively establishes *untrackability* as a distinct category where determinism holds but no correspondence exists between simulations and reality.  
  - Shows that this disrupts the binary by revealing an in-principle limitation rooted in dynamics, not epistemology.  

  **Failure Criterion**: The project fails if:  
  - The analysis collapses into familiar epistemic limitation (e.g., by arguing shadowing failure stems from imperfect models rather than dynamics).  
  - Untrackability is shown to be trivially equivalent to weak predictability or computational irreducibility.  
  - Non-hyperbolic systems are deemed too "pathological" to challenge general accounts of determinism.  

  ### (e) Scope and Risks  
  **Scope**: The paper will focus on well-documented non-hyperbolic systems (e.g., near-integrable Hamiltonian systems) and their philosophical implications, avoiding exhaustive mathematical proofs. Dynamical systems theory will be engaged conceptually, with technical details relegated to appendices.  
  **Risks**:  
  - *Complexity Risk*: Non-hyperbolic dynamics are mathematically intricate; oversimplification may weaken the argument. Mitigation: Use conceptual analogies and cite established results.  
  - *Reduction Risk*: Philosophical counterarguments may absorb untrackability into epistemic narratives. Mitigation: Preemptively address objections (e.g., by linking shadowing failure to ontic structural instability).  
  - *Generalizability Risk*: If shadowing failure only occurs in narrow contexts, its philosophical impact diminishes. Mitigation: Emphasize its prevalence in "real-world" approximations (e.g., celestial mechanics).  
  Given one semester, success hinges on tightly scoping the argument to the determinism-predictability interface, with formal details as support.  

