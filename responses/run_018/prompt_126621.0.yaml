answer: |-
  Here’s a distilled desiderata list for a theory of personal survival, tailored to handle your "narrative drift branching" case and classic challenges. Non-negotiables are flagged **(NN)**, camp preferences as **(CP)**.

  ---

  ### **Desiderata for an Adequate Theory of Personal Survival**  
  *(What the theory MUST explain or accommodate)*

  1. **Handle Standard Teletransport (Scan/Destroy)**  
     - *Why*: Baseline for continuity debates. Must resolve if "you" survive as the Mars copy when the original is vaporized.  
     - *Stakes*: Tests if psychological continuity alone suffices for survival. **(NN)**  

  2. **Handle Fission Cases (e.g., Split-Brain, Double Release)**  
     - *Why*: If your brain is split and transplanted into two bodies, or the teleporter creates two copies, who is "you"? Forces confrontation with branching. **(NN)**  
     - *Conflict*: Demanding both **no-branching** AND **full psychological continuity** is *impossible* here. If both copies are psychologically continuous with you, survival can’t require unique identity.  

  3. **Handle Narrative-Drift Branching (Your Friend’s Twist)**  
     - *Why*: Tests if identity/survival depends on *subjective self-conception* over time. The Mars copy has continuity but divergent narrative/emotions; the coma-body "resumes" later. Must address:  
       - Does the Mars copy’s grief undermine its claim to *be* you?  
       - Is the waking original still "you" after coma?  
       - Can two distinct persons *both* claim survival from a single source? **(CP leaning NN – it probes narrative fragility)**  

  4. **Distinguish Survival vs. Identity**  
     - *Why*: You might *survive* as both branches in fission (what matters for fear of death), but they aren’t *identical* to each other. Collapsing this leads to contradictions. **(NN)**  

  5. **Preserve Psychological Continuity vs. "Sameness"**  
     - *Why*: We care about our memories, values, and intentions continuing (even if imperfectly). But "sameness" implies strict numerical identity – which fission shatters. Theory must explain why continuity *matters* without equating it to identity. **(NN)**  

  6. **Respect Biological Constraints**  
     - *Why*: Neuroscience shows cognition/identity is anchored in the physical brain. A theory claiming "you" survive as a digital upload in the cloud *without* a brain must justify how this isn’t magic. **(NN)**  

  7. **Explain What We *Rationally Care About***  
     - *Why*: Fear of death, anticipation of future experiences, moral responsibility. Must clarify why (e.g.) stepping into a destructive teleporter isn’t suicide if a copy survives. **(CP – but core to Parfit’s project)**  

  ---

  ### **How Major Theories Fare**  
  *Quick highlights against key desiderata:*

  - **Psychological Continuity (e.g., Parfit)**  
    - ✅ *Aces*: Standard teletransport (you survive via continuity).  
    - ✅ *Handles fission*: Explains why both branches are "you" (survival without identity).  
    - ❌ *Fumbles narrative drift*: If the Mars copy is psychologically continuous, it’s "you" – but can’t explain why its grief/divergent narrative *feels* like a threat to selfhood.  
    - ⚠️ *Risk*: Downplays biology (Desideratum 6).  

  - **Bodily Continuity**  
    - ✅ *Clear*: You = your biological body/brain. Waking coma patient is unequivocally "you".  
    - ❌ *Fails fission/teletransport*: Mars copy isn’t you; split-brain survivors are two new persons. Ignores why psychological continuity *matters* (Desiderata 1, 2, 5).  
    - ❌ *Ignores narrative drift*: The Mars copy’s experience is irrelevant – but this clashes with intuition.  

  - **Narrative Self View**  
    - ✅ *Excels at narrative drift*: Explains why divergent self-stories (coma vs. Mars) create two distinct persons.  
    - ❌ *Struggles with fission*: If both copies share the same pre-branch narrative, are they both "you"? Ambiguous.  
    - ⚠️ *Subjective*: Risk of circularity ("I’m me because I feel like me"). Clashes with neuroscience (Desideratum 6) if it denies biological anchors.  
    - ❓*What matters?*: If the coma-you wakes with no memory of Mars, do you "care" about the copy? Unclear.  

  ---

  ### **The Tightrope Walk**  
  The core tension: **Fission cases break any theory demanding unique identity + strong continuity**. Narrative drift exacerbates this by adding *qualitative* divergence over time. A viable theory must either:  
  - **Deny branching is survival** (but then teletransport is death),  
  - **Accept survival ≠ identity** (but feels unsatisfying), or  
  - **Prioritize narrative** (but risks subjectivity).  

  No theory nails all desiderata cleanly – but your friend’s twist most strains *psychological* views, best fits *narrative* views, and is outright rejected by *bodily* views. Use the coma + drift case to expose where each theory bleeds.
