  - Isaac's rights as the ethical universal made absurd by divine command 

  For the form structure, I'll adapt standard IRB sections but twist them philosophically. Section 4 (Conflict with Moral Law) is crucial – that's where Abraham must declare his action "incommensurable" with ethics. The Compliance Officer's footnote will bureaucratically miss the point entirely by suggesting Isaac needs counseling. 

