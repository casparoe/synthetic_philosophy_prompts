  Biggest risk is students missing the nuance that suspension ≠ abolition of ethics. Will emphasize in Section 6 where Abraham insists he's not an "ethical nihilist." Must also show the double-movement of faith in Section 5's risk-benefit – Abraham both sacrifices Isaac and believes he'll be returned. 

