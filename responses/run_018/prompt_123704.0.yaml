prompt: |-
  i'm the ethics compliance officer for our city health dept's behavorial unit. we get about three nudge proposals a month—default opt-ins, cafeteria layouts, reminder texts using social norms, auto-enrollment in wellness programs, stuff like that. i have maybe twenty minutes per proposal, i dont have a philosophy degree, my director signs off on my one-page memo, and if i approve something manipulative the council chews me out or we end up in court. i need a reusable decision proceedure i can run step by step: the questions in order, what counts as a sufficient answer at each step, where it stops with a hard no, where it hands the call to me because it's values not facts, and where it's guaranteed to misfire. ground it in actual philosophy of paternalism and autonomy—mill's harm principle, the soft vs hard paternalism distinction, the idea that nudges can bypass rational deliberation even when choice is technically preserved, and the idea that the person should be able to reverse the decision easily without penalty—but translate it so a non-philosopher can use it. the procedure must handle the hard cases: nudges that exploit biases people would want corrected upon reflection, domains where people lack stable preferences like mental health or long-term savings, and nudges that serve collective goods rather than the individual's own ends.

  apply it to three proposals:
  1. driver's license renewal form with organ donation default opt-in and a one-click opt-out.
  2. school cafeteria redesign putting water at eye level and soda behind a counter that requires asking staff.
  3. auto-enrolling all city employees in a mental-health screening check-in, with opt-out only available after watching a 5-minute video explaining benefits.

  make sure one answer is one i wont like—i'm generally pro-nudge but the procedure should be honest. include worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call. flag exactly what the procedure cant do, like predicting long-term preference change or resolving conflicts between collective health and individual privacy. no bibliographies or citations needed, i just need the tool.
reasoning: |-
  Okay, let me unpack this complex request. The user is an ethics compliance officer drowning in behavioral nudges - default opt-ins, cafeteria layouts, reminder texts - with only 20 minutes per proposal and no philosophy background. They need a practical, step-by-step filter grounded in real ethical principles but stripped of academic jargon.

  Hmm, the core tension here is balancing paternalism (government's duty to promote health) against autonomy (citizens' right to choose). The user explicitly referenced Mill's harm principle and soft/hard paternalism, so I should operationalize those. Key philosophical anchors: 1) Nudges shouldn't override rational deliberation 2) Opt-out must be trivial 3) Collective benefits can't trample individual rights.

  *scratches head* The tricky parts are those gray zones - like when nudges exploit cognitive biases people might reject if aware, or domains without stable preferences (mental health screenings). And oh boy, that council backlash risk is real - they need clear "hard no" triggers.

  For the framework, I'm imagining a flowchart-style sieve with escalating hurdles. Start with legality/safety basics, then assess autonomy threats through three lenses: reversibility (can you escape easily?), bias exploitation (are we weaponizing human flaws?), and preference stability (do people even know what they want here?). Finally, force explicit ownership of value judgments when collective and individual goods collide.

  *checks watch* Better include those three test cases. Proposal 1 (organ donation opt-out) feels like an easy pass - minimal friction to opt-out, life-saving impact. Proposal 3 (mandatory mental health video) sets off alarm bells though - forcing education to escape violates reversibility. The cafeteria redesign? Classic judgment call - health benefits vs. subtle shaming of soda drinkers. User won't love rejecting proposal 3, but integrity demands it.

  *scribbles mentally* Must flag the procedure's limits too: Can't predict if nudges alter long-term preferences, or magically resolve health-vs-privacy tradeoffs. The user needs to know where the tool ends and their responsibility begins.

  Final touch: Worked examples showing clear pass (organ forms), clear fail (coercive videos), and gray zone (soda positioning). Keep it clinical - no citations, just actionable thresholds like "if opt-out takes >1 click or >15 seconds, reject."
answer: |-
  Here's a reusable, step-by-step decision procedure grounded in ethical principles, designed for speed and clarity. It uses 5 key questions in sequence, with clear thresholds and flags for judgment calls.

  **The Nudge Ethics Sieve: 5-Step Procedure**

  1.  **STEP 1: THE HARM CHECK**
      *   **Question:** *Does the nudge target behavior causing clear, significant harm (to self or others) that the individual is unlikely to fully appreciate or weigh correctly in the moment?*
      *   **Sufficient Answer:** YES (Proceed). NO (Hard Stop - Reject).
      *   **Rationale:** Grounded in Mill's Harm Principle & Soft Paternalism. Nudges are ethically strongest when preventing real harm (e.g., organ shortage deaths, chronic disease, untreated mental crisis) where fast/biased decisions occur.
      *   **Threshold:** "Clear, significant harm" = Death, serious injury, major preventable illness, substantial public health risk. "Unlikely to appreciate" = Biases (present bias, status quo bias) or lack of information demonstrably impair judgment *in this context*.
      *   **Hard Stop?** YES. If NO significant harm addressed, paternalism isn't justified. (e.g., Nudging preferred brand of toothpaste).
      *   **Your Call?** NO (Fact-based: Is the harm real and significant? Is poor appreciation likely?).
      *   **Misfires?** Overestimating harm; Targeting trivial harms.

  2.  **STEP 2: THE BYPASS CHECK**
      *   **Question:** *Does the nudge primarily work by exploiting a cognitive bias or heuristic *in a way the individual would likely reject upon calm reflection* (e.g., inertia, framing, scarcity), rather than making rational deliberation easier?*
      *   **Sufficient Answer:** NO (Proceed). YES (Proceed with Extreme Caution - Flag for Step 4/5).
      *   **Rationale:** Respects autonomy by avoiding manipulation. Exploiting biases the person *wouldn't endorse* undermines their rational agency, even if "harmless."
      *   **Threshold:** "Would reject upon reflection" = Ask: Would most reasonable people, informed about the bias, feel tricked or resentful? Does the nudge feel deceptive? (e.g., Hiding soda exploits inertia/obscurity; Default organ donation exploits status quo bias - but many endorse this use).
      *   **Hard Stop?** NO (Can be justified if harm is great and alternatives worse, but it's a major red flag).
      *   **Your Call?** YES (Values-based: Predicting "reflective rejection" requires judgment about people's values and acceptable influence).
      *   **Misfires?** Misjudging what biases people find acceptable; Using deception.

  3.  **STEP 3: THE REVERSIBILITY CHECK**
      *   **Question:** *Can the individual easily and without penalty (time, cost, social stigma, hassle) reverse the nudge's effect to choose the alternative?*
      *   **Sufficient Answer:** YES, easily & penalty-free (Proceed). NO (Hard Stop - Reject).
      *   **Rationale:** Core to libertarian paternalism & respecting autonomy. Preserves freedom of choice. "Easily" means minimal effort/cost.
      *   **Threshold:** "Easily & penalty-free" = Opt-out is: **1-Click** (digital) or **Minimal Extra Step** (physical, equivalent effort), **Free**, **Immediate**, **Private** (no public shaming), **No Loss of Benefit/Status**. Burden is on the nudge designer.
      *   **Hard Stop?** YES. If reversal is difficult, costly, or penalized, it becomes coercion, not a nudge.
      *   **Your Call?** NO (Fact-based: How many steps/cost/time? Is there stigma?).
      *   **Misfires?** Hidden costs/stigma; Technical barriers; Delays.

  4.  **STEP 4: THE PREFERENCE STABILITY CHECK (For self-targeted nudges)**
      *   **Question (If nudge primarily affects the individual):** *Is there evidence that preferences in this domain are unstable, poorly formed, or that people frequently express regret about their choices?*
      *   **Sufficient Answer:** YES (Strengthens case). NO (Weakens case - Proceed only if collective good is strong - Step 5).
      *   **Rationale:** Soft paternalism is most defensible when people struggle to act on their *own* considered values (e.g., savings, addiction, mental health). If preferences are stable, autonomy weighs heavier.
      *   **Threshold:** Evidence of: Wide regret (e.g., not saving for retirement), internal conflict (e.g., wanting to quit smoking), predictable irrationality (e.g., present bias overwhelming long-term goals), lack of expertise/experience.
      *   **Hard Stop?** NO. But a NO answer significantly weakens the case for purely self-regarding nudges.
      *   **Your Call?** PARTIAL (Fact/Value mix: Assessing evidence of instability; Judging the *significance* of instability for this choice).
      *   **Misfires?** Assuming instability where it doesn't exist; Ignoring stable minority preferences.

  5.  **STEP 5: THE COLLECTIVE GOOD / TRADEOFF FLAG (For nudges serving public goals)**
      *   **Question:** *Does the nudge primarily serve a significant collective good (public health, safety, resource efficiency) that outweighs the minor infringement on individual choice identified in Steps 2 & 4?*
      *   **Sufficient Answer:** N/A - This is YOUR Judgment Call.
      *   **Rationale:** Acknowledges that public health often requires balancing individual autonomy with community welfare. Steps 1-3 are prerequisites.
      *   **Threshold:** "Significant collective good" = Tangible, substantial benefit to the community (e.g., reduced disease burden, lives saved through organs, efficient resource use). "Minor infringement" = Nudge passed Steps 1-3 (esp. easy reversibility).
      *   **Hard Stop?** NO. This is the core value judgment *you must own*.
      *   **Your Call?** YES (Pure Values-based: Weighing collective benefit vs. individual liberty intrusion. No formula exists).
      *   **Misfires?** Overvaluing small collective gains; Underestimating liberty infringement; Ignoring distributional impacts.

  **Procedure Guaranteed Limitations:**
  *   Cannot predict long-term preference changes or regret.
  *   Cannot resolve fundamental conflicts between collective health goals and individual privacy/autonomy (flags it for your judgment).
  *   Cannot guarantee public or political acceptance, only ethical defensibility within the framework.
  *   Relies on your reasonable assessment of evidence for harm, bias exploitation, and preference stability.

  ---

  **Applying the Sieve to Proposals:**

  **Proposal 1: Driver's License Renewal - Organ Donation Default Opt-In (1-Click Opt-Out)**
  1.  **Harm Check:** **YES.** Organ shortage causes death/harm. Individuals often don't consider donation deeply during renewal (inertia, avoidance).
  2.  **Bypass Check:** **YES (Exploits Status Quo Bias) BUT...** Many people endorse this use upon reflection ("I'd want others to donate"/"It's easy to opt-out"). Not inherently deceptive. **Flag for Step 5.**
  3.  **Reversibility Check:** **YES.** 1-Click opt-out is easy, free, immediate, private.
  4.  **Preference Stability:** **YES.** Preferences often unformed or influenced by inertia/myths; high support for donation in principle vs. sign-up rates shows gap.
  5.  **Collective Good:** **Significant.** Saves lives through increased organ availability. Infringement (exploiting bias) is minor *given* easy reversal and broad reflective endorsement.
      *   **VERDICT:** **APPROVE** (Clear Pass - Passes Steps 1, 3, 4 easily; Exploited bias is widely accepted; Collective good is high.)

  **Proposal 2: Cafeteria Redesign - Water @ Eye Level, Soda Behind Counter (Must Ask Staff)**
  1.  **Harm Check:** **YES.** High sugar intake linked to obesity/diabetes (significant harm). Choices are often impulsive/habitual, influenced by convenience/visibility (bias).
  2.  **Bypass Check:** **YES (Exploits Inertia & Effort Heuristic).** Making soda less convenient targets bias. Would people resent this upon reflection? *Debatable.* Some might see it as helpful, others as nagging. **Flag for Step 5.**
  3.  **Reversibility Check:** **YES (Barely).** Asking staff is a *minimal extra step*. It's free, immediate. Potential for minor social stigma? (Could someone feel judged asking?). **Passes, but note potential friction.**
  4.  **Preference Stability:** **MIXED.** Preferences for sugary drinks can be strong habits/addictive, but also stable for many. Regret is common long-term regarding health impacts.
  5.  **Collective Good:** **Moderate.** Potential for reduced sugar intake & long-term health benefits *at population level*. Infringement (minor effort increase, potential bias exploitation) is low. BUT: Is the harm *to the individual* choosing soda significant *enough* per Step 1 for this level of interference? Judgment Call.
      *   **VERDICT:** **JUDGMENT CALL (Leaning Approve).** Passes Steps 1 & 3. Step 2 (bias exploitation) is present but mild/non-deceptive. Step 4 (instability) is partial support. Step 5: Collective good is plausible but not overwhelming (like organs). **You must own this:** "Given the significant health harm of excess sugar, the minor nature of the barrier, and ease of reversal, the potential public health benefit justifies the nudge."

  **Proposal 3: Auto-Enroll Employees in Mental Health Check-In (Opt-Out Only After 5-Min Video)**
  1.  **Harm Check:** **YES.** Untreated mental health issues cause significant harm (suffering, productivity loss, suicide risk). Stigma/avoidance often prevents help-seeking (bias).
  2.  **Bypass Check:** **YES (Exploits Effort Heuristic/Procrastination).** The video is a barrier to opting out, exploiting the tendency to avoid small hassles. Many would resent being *forced* to watch a video to exercise a choice. **Major Red Flag.**
  3.  **Reversibility Check:** **NO.** Requiring a 5-minute video to opt-out is **NOT easy or penalty-free.** It imposes a significant time cost and hassle. It feels coercive ("jumping through a hoop"). **HARD STOP.**
      *   **VERDICT:** **REJECT.** Fails Step 3 decisively. The opt-out barrier is too high, turning the "nudge" into coercion. (This is the one you won't like, but the procedure is clear). *Fix Suggestion:* Auto-enroll with a **1-click opt-out** immediately available. *Offer* the video prominently, but don't mandate it for opting out.

  **Summary of Outcomes:**
  *   **Clear Pass:** Proposal 1 (Organ Donation Default). Passes all checks easily, reversibility is perfect.
  *   **Clear Fail:** Proposal 3 (Mental Health Video Gate). Fails Reversibility Check (Step 3) - Hard Stop.
  *   **Judgment Call Zone:** Proposal 2 (Cafeteria Layout). Passes core checks (Harm, Reversibility) but requires weighing the acceptability of bias exploitation and the collective benefit against individual liberty in Step 5.
