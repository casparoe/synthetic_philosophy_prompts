answer: |-
  Below is a step-by-step knowledge-audit protocol for verifying derived claims in safety-critical autonomous systems, based on Nozick's tracking conditions (sensitivity and adherence). The protocol includes executable steps for engineers, handles epistemic closure failures ("entailment leakage"), defines human-review triggers, and specifies certification outcomes. Two concrete scenarios demonstrate application.

  ---

  ### **Knowledge-Audit Protocol for Derived Claim `C`**  
  **Precondition**: Premises `P₁...Pₙ` are already certified as tracked knowledge (sensitivity and adherence hold).

  #### **Step 1: Construct Modal Neighborhood for `C`**  
  **Objective**: Define nearby worlds for `C` via counterfactual tests.  
  **Procedure**:  
  1.  **Identify perturbation targets**:  
      - Select variables that directly determine `C`'s truth (e.g., sensor inputs, internal states, environmental parameters).  
      - Exclude variables irrelevant to `C` (e.g., unrelated subsystems).  
  2.  **Generate counterfactual tests**:  
      - **Single-fault tests**: For each variable, create one test where the variable is perturbed to *just barely* falsify `C` (e.g., sensor drift to threshold, bit-flip in input).  
      - **Multi-fault tests**: Create up to 3 tests combining perturbations from *correlated variables* (e.g., two sensors failing together).  
      - **Total tests**: `k + 3` tests, where `k` = number of variables directly determining `C` (cap at 10 tests/module).  
  3.  **Define "nearby world" in software terms**:  
      - A test scenario where:  
        (a) Perturbation magnitude is within the system’s operational design domain (e.g., sensor error ≤ datasheet max),  
        (b) System control flow remains unchanged (e.g., no crashes, undefined behavior).  
      - *Judgment call*: Engineers justify perturbations using hazard analysis (e.g., FMEA) to ensure realism.  

  #### **Step 2: Test Sensitivity of `C`**  
  **Objective**: If `C` were false, the system would not believe `C`.  
  **Procedure**:  
  1.  Execute all tests from Step 1 where `C` is false (per ground-truth oracle).  
  2.  For each test:  
      - Run the system and check its output for `C`.  
      - **Failure**: System believes `C` (outputs "true") when `C` is false.  
  3.  **Stopping rule**: If any test fails, **flag "Sensitivity Failure"** → Proceed to Step 5.  

  #### **Step 3: Test Adherence of `C`**  
  **Objective**: If `C` were true, the system would believe `C`.  
  **Procedure**:  
  1.  Execute:  
      - Baseline test (nominal conditions, `C` true),  
      - All tests from Step 1 where `C` remains true post-perturbation.  
  2.  For each test:  
      - **Failure**: System does not believe `C` (outputs "false" or withholds) when `C` is true.  
  3.  **Stopping rule**: If any test fails, **flag "Adherence Failure"** → Proceed to Step 5.  

  #### **Step 4: Test for Entailment Leakage**  
  **Objective**: Verify adherence transfers from premises `P₁...Pₙ` to `C`.  
  **Procedure**:  
  1.  In all tests from Step 3 (where `C` is true):  
      - Check if the system believes *all* premises `P₁...Pₙ` (since they are pre-certified as adherent).  
  2.  **Failure (entailment leakage)**:  
      - System believes `P₁...Pₙ` but does *not* believe `C` (e.g., inference logic error).  
      - **Stopping rule**: If leakage occurs, **flag "Entailment Leakage"** → Proceed to Step 5.  

  #### **Step 5: Certification Decision & Human Review**  
  **Objective**: Assign certification status or escalate.  
  **Procedure**:  
  1.  **Success**: All Steps 2–4 pass → **`C` is tracked knowledge**. Certify.  
  2.  **Failure modes**:  
      - **Sensitivity failure (Step 2)**: `C` is **not certified**. Requires design fix.  
      - **Adherence failure (Step 3)**: `C` is **not certified**. Requires design fix.  
      - **Entailment leakage (Step 4)**: `C` is **not certified**. Requires logic fix.  
  3.  **Human review trigger** (escalate if):  
      - Perturbations involve *value trade-offs* (e.g., safety vs. performance thresholds),  
      - Ground truth for `C` requires expert judgment (e.g., "critical fault" depends on context),  
      - Test results are ambiguous (e.g., partial adherence).  
  4.  **Special case (sensitivity for `P` + adherence failure for `P→Q` entailed in `C`)**  
      - E.g., `P` is tracked, but `P→Q` inference fails adherence.  
      - **Result**: Flag "Entailment Leakage" (Step 4). `C` is **not certified** (inference unreliability).  

  ---

  ### **Scenario Applications**  
  #### **Scenario 1: Navigation Module**  
  - **Premise `P`**: GPS signal is authentic (tracked).  
  - **Derived claim `C`**: Vehicle is not actively spoofed.  
  - **Audit**:  
    1. **Step 1**: Perturb GPS signal strength, cryptographic nonce, timestamp (3 tests).  
    2. **Step 2**: In spoof-present test (`C` false), system detects spoof? → **Sensitivity holds**.  
    3. **Step 3**: In nominal test (`C` true), system asserts no spoof? → **Adherence holds**.  
    4. **Step 4**: System believes `P` (authentic) but not `C` (no spoof)? → **No leakage**.  
    - **Result**: `C` **certified**.  

  #### **Scenario 2: Medical-Diagnostic Module**  
  - **Premise `P`**: All sensors report nominal values (tracked).  
  - **Derived claim `C`**: No critical fault present.  
  - **Counterfactual test**: Sensor values nominal, but fault exists (e.g., sensor A stuck at nominal while actual value critical).  
  - **Audit**:  
    1. **Step 1**: Perturb sensor A to "stuck nominal" (1 test).  
    2. **Step 2**: In fault-present test (`C` false), system still reports "no fault"? → **Sensitivity fails**.  
    3. **Stopping rule**: Flag "Sensitivity Failure" → Skip to Step 5.  
  - **Result**: `C` is **not certified** (violates closure; `P` is tracked but `C` is not).  
  - **Manual override**: Human reviewer assesses risk:  
    - If sensor faults are mitigated elsewhere (e.g., hardware redundancy), allow conditional certification.  
    - Else, redesign module (e.g., add consistency checks between sensors).  

  ---

  ### **Key Protocol Notes**  
  - **Mechanically executable**: Test generation (Step 1), test execution (Steps 2–4), pass/fail checks.  
  - **Judgment calls**: Defining "nearby" perturbations (Step 1), interpreting human-review triggers (Step 5).  
  - **Epistemic closure violation**: Explicitly allowed (Scenario 2 result) to prioritize safety over theoretical closure.  
  - **Output**: Binary certification (`tracked`/`not tracked`) with failure reasons for redesign guidance.  

  This protocol ensures philosophical rigor is operationally accessible to engineers while highlighting when human judgment must intervene.
