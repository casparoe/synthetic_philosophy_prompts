prompt: |-
  I'm a tutor on a second-year philosophy of mind module, and next week I am leading a fifty-minute discussion section on the distinction between knowing how and knowing that. The students have read Ryle's original essay but have arrived with a predictable reductionist instinct: they assume that any procedural skill is ultimately a form of propositional knowledge that has simply become automated or tacit. I want to avoid the tired bicycle example and instead use a more conceptually demanding carrying case — the contrast between knowing how to improvise coherently within a modal jazz framework and knowing that the Dorian mode is the natural minor scale with a raised sixth degree. I need you to design the pedagogical sequence rather than deliver the explanation itself.

  Please map the dependency structure: what conceptual component must be secured first so that the jazz-improvisation example can illuminate rather than confuse? Specify the carrying example's essential features — what it must possess and what it must lack — and explain why this case resists reduction to propositional knowledge more stubbornly than the usual physical-skill examples. Identify the misconception they will form at the precise point where fluency is mistaken for rapid retrieval of rules, and tell me exactly where in the arc I should interrupt and head it off. Propose one diagnostic question for the final five minutes that reveals whether they understand the distinction or have merely memorised Ryle's vocabulary. Also, state clearly what I should omit at this level — for instance, the intellectualist regress, contemporary cognitive-science literature on implicit learning, or debates about knowledge-wh — and justify the omission. Finally, indicate what would change your mind about this plan: which student response or philosophical objection to the modal-jazz framing would cause you to restructure the sequence, and identify the point in your reasoning about misconception formation that is most vulnerable to failure.
reasoning: |-
  Okay, this is a sophisticated pedagogical challenge. The user is a philosophy tutor facing students who've oversimplified Ryle's knowing-how/knowing-that distinction by reducing procedural knowledge to automatized propositional knowledge. They specifically want to avoid clichéd examples like bicycle riding and use modal jazz improvisation instead. 

  Hmm, the core tension here is between the students' reductionist impulse and Ryle's anti-intellectualist position. The jazz example is brilliant because it forces confrontation with non-declarative aspects of competence - but only if properly scaffolded. I need to consider why physical skills like cycling make weak counterexamples: students can always argue "it's just subconscious rules." Jazz works better because even conscious theoretical knowledge doesn't produce coherent improvisation.

  First, the dependency chain: students must grasp that "knowing that" refers to discrete, articulable facts before contrasting it with improvisation's context-sensitive, non-decomposable nature. The modal theory segment is crucial - if they don't see how Dorian mode knowledge remains declarative, the contrast won't land. 

  The jazz case must possess three key features: (1) real-time creative synthesis (not just recombination), (2) normative constraints that aren't rules (coherence isn't algorithmic), and (3) demonstrable divergence between theoretical mastery and performative ability. Crucially, it must lack any fixed "correct" sequence - otherwise reductionists will claim hidden templates.

  Ah, the danger point is when students might say "expert improvisers internalize more sophisticated rules." That's when to intervene by asking them to articulate the "rule" for transitioning between modes mid-phrase. The diagnostic question about a theorist who can analyze solos but not play will reveal if they truly get the distinction.

  For omissions: intellectualist regress arguments would derail the session's focus, cognitive science data exceeds second-year scope, and knowledge-wh is tangential here. If a student objects that jazz improvisation relies on memorized licks, I'd need to pivot to a purer form of improvisation - perhaps free jazz within constraints. The vulnerability is underestimating how deeply students cling to the "tacit knowledge" paradigm; their intuition that fluency equals fast retrieval might persist even after demonstration.
answer: |-
  Here’s a structured pedagogical sequence designed to disrupt reductionist instincts using modal jazz, with conceptual dependencies, critical intervention points, and safeguards against missteps:

  ---

  ### **Pedagogical Sequence**
  1. **Anchor Propositional Knowledge (5 mins)**  
     *Task:* Elicit clear examples of "knowing-that" (e.g., "Knowing *that* water boils at 100°C").  
     *Secure:* The definition of propositional knowledge as **discrete, truth-apt, and declarable facts**.  
     *Why first?* Students must explicitly distinguish "knowing-that" from skills *before* confronting cases where reduction fails.

  2. **Introduce Modal Jazz Components (10 mins)**  
     *Task:* Distinguish between:  
     - *Knowing-that:* "The Dorian mode is a minor scale with ♮6" (declarative fact).  
     - *Knowing-that:* "Chord X implies mode Y" (theoretical rule).  
     *Goal:* Show that theoretical knowledge is **necessary but insufficient** for improvisation.

  3. **The Jazz Improvisation Case (15 mins)**  
     *Essential Features of the Example:*  
     - **Must possess:**  
       - *Real-time creativity:* Generating novel, context-sensitive phrases within constraints.  
       - *Holistic fluency:* Weaving harmony, rhythm, and phrasing into a coherent aesthetic whole.  
       - *Non-algorithmic judgment:* Resolving musical "tensions" (e.g., balancing predictability/surprise) without rules.  
     - **Must lack:**  
       - A fixed "solution" (unlike applying a recipe).  
       - Deterministic inputs→outputs (same scale/chords ≠ same solo).  
     *Contrast:* A theorist who knows *all* jazz theory but cannot improvise vs. an illiterate player who fluently improvises.

  4. **Intervention Point: The "Rules Trap" (10 mins)**  
     - **Misconception Formation:** When students suggest improvisation is "just rapid retrieval of licks/scales."  
     - **Interrupt here:** Ask: *"If improvising were rule retrieval, could a computer using all jazz theory rules produce a* human-like *solo? Why do experts hear the difference?"*  
     - **Refocus:** Highlight the gap between *applying* rules and *judging* aesthetic coherence mid-flow.

  5. **Diagnostic Question (Final 5 mins)**  
     *Pose:* *"Could someone memorize every possible jazz theory proposition yet still lack the ability to improvise a compelling solo? If so, what does that missing capacity *feel* like from the inside?"*  
     - **Tests for:**  
       - Grasping the *qualitative* gap (beyond vocabulary).  
       - Recognizing that competence involves **situational responsiveness**, not stored data.

  ---

  ### **Why Jazz Resists Reduction Better Than Physical Skills**  
  - **Anti-Reductionist Edge:** Physical skills (e.g., cycling) *can* be framed as "tacit rules" (e.g., micro-adjustments to balance). Jazz improvisation requires **aesthetic synthesis**—rules inform but don’t determine the act.  
  - **Key Difference:** The "right" move in jazz isn’t defined by outcome (like not falling off a bike) but by *emergent coherence* within an open-ended practice. Rules underdetermine creative choices.

  ---

  ### **Strategic Omissions**  
  1. **Ryle’s regress argument:**  
     - *Why omit:* At this level, it may feel like abstract point-scoring. Focus on the *phenomenology* of improvisation instead.  
  2. **Cognitive science (implicit learning):**  
     - *Why omit:* Shifts focus from conceptual distinction to empirical mechanisms. Avoids sidetracking into "how the brain does it."  
  3. **Knowledge-wh (e.g., knowing-where/when):**  
     - *Why omit:* Ambiguous cases (e.g., "knowing when to pause in a solo") could muddy the core how/that dichotomy prematurely.

  ---

  ### **When to Restructure**  
  - **Trigger:** If students insist improvisation is "just combining pre-memorized phrases," *despite* emphasizing novelty/context.  
  - **Pivot Needed:** Shift to **free jazz** (e.g., Coltrane’s *Ascension*) where even harmonic rules dissolve, forcing confrontation with pure generative capacity.  
  - **Vulnerable Point:** Assuming students will grant that *aesthetic coherence* isn’t rule-bound. If they aestheticize rules ("There’s a rule for good phrasing!"), return to *lived experience*: "Describe the moment you *feel* a solo is coherent—is that feeling reducible to checking propositions?"

  ---

  **Execution Tip:** Use an audio clip contrasting a stiff, theory-correct solo vs. a fluid improvisation. Ask: *"What does the second player *do* that the first doesn’t?"* to ground abstract discussion in perceptible difference.
