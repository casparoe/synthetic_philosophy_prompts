  hey so im trying to understand this bit in berkeleys The Querist, the 1735 anon version not the 1750 one he put his name on, where he asks whether money is just a ticket or token representing labor, and then he says gold and silver arent real wealth but only signs of it, with actual wealth being the industry and people of the nation. he asks if a country with no gold but lots of trade and labor isnt actually richer than one hoarding coin with no production. i dont get how this fits with his immaterialism—if physical gold doesnt exist as mind-independent stuff, why does he treat its absence as an actual economic problem? is he saying money works like an idea that has to correspond to some mental or spiritual relation? or am i overreading? and does the 1750 revision drop the labor-token framing? any explaination welcome.
