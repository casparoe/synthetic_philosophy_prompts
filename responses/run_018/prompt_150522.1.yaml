answer: |-
  Your diagnosis is astute: the deadlock *does* hinge on an ambiguity in "physical information" and a conflation of distinct metaphysical and epistemic claims. Here's a reconstruction, distinction, and path forward:

  **The Implicit Disagreement:**
  1.  **Side A (Anti-Physicalist / Knowledge Argument Proponent):** "Physical information" means *fundamental physical facts* – the complete state of the universe described in the vocabulary of completed fundamental physics (e.g., quantum fields, particles, forces, spacetime geometry). They argue Mary learns a genuinely *non-physical fact* (a phenomenal property) because it cannot be *stated* or *represented* in this vocabulary without indexical or qualitative concepts derived from experience.
  2.  **Side B (Physicalist / Representationalist):** "Physical information" means *any objectively accessible structural/functional fact* – including high-level, relational, dispositional, causal, and representational properties of systems described from a third-person perspective (e.g., brain states, neural computations, information processing, behavioral dispositions, environmental interactions). They argue Mary only gains a new *mode of access* (acquaintance, recognitional concept) to a fact already *implied by* or *constituted by* the physical information broadly construed.

  **The Substantive vs. Verbal/Framing Conflict:**
  *   **Verbal/Framing:** Whether "physical information" is restricted to fundamental physics vocabulary (Side A's usage) or includes higher-level structural/functional descriptions (Side B's usage). This is a definitional choice about the scope of "physical."
  *   **Substantive:** Whether phenomenal properties (qualia) are:
      *   **(Ontological Claim)** Fundamental, intrinsic, non-structural properties irreducible to *any* physical structure or function (what Side A believes Mary discovers).
      *   **(Epistemic/Representational Claim)** Exhaustively constituted by physical structure/function, but requiring first-person acquaintance or recognitional concepts for *complete cognitive grasp* or *representation* (what Side B believes Mary gains).

  **The Crucial Conceptual Distinction:**
  *   **Ontological Completeness (OC):** The thesis that *all concrete properties, states, and events* in the universe are either fundamental physical properties or are exhaustively constituted/realized by fundamental physical properties. (Nothing "extra" exists ontologically.)
  *   **Representational Saturation (RS):** The thesis that a specific *representational system* or *descriptive vocabulary* (e.g., completed fundamental physics, third-person structural/functional science) can exhaustively *encode* or *express* all truths about the universe. (No truth is inexpressible in that system.)

  **Dissolving the Impasse/Answering Different Questions:**
  1.  **Side A (Anti-Physicalist)** argues against **RS** for the vocabulary of fundamental physics. They conclude **OC** is false because they equate a failure of RS (for fundamental physics vocab) with a failure of OC. *Their core claim is ontological.*
  2.  **Side B (Physicalist)** defends **OC**. They concede **RS** might fail for the *fundamental physics vocabulary alone* but argue it holds (or can hold) for a sufficiently rich *broader structural/functional vocabulary*. Mary's new knowledge reflects a failure of *cognitive access* or *conceptual formation* within the representational system *before* experience, not a failure of OC. *Their core claim is ontological, but their defense often involves representational capacities.*
  3.  **The Impasse:** Side A sees Side B's broadening of "physical information" as cheating or changing the subject away from fundamental ontology. Side B sees Side A's restriction to fundamental physics vocabulary as setting up an impossible standard for physicalism that ignores realization and levels of description. **They are arguing past each other:** Side A attacks RS (fundamental vocab) to deny OC; Side B defends OC by appealing to RS (broad vocab) or denying that RS failure implies OC failure.

  **What Could Move the Debate? The Empirical Route: Concept Acquisition in Sensory-Deprived Subjects**

  *   **Justification based on the Diagnosis:**
      *   The core disagreement is ontological (OC: Are phenomenal properties fundamental non-physical properties?). Arguments about representational saturation (RS) are proxies or evidence marshaled for/against OC.
      *   Formal theorems (e.g., about descriptive incompleteness) are powerful but likely map onto the RS debate. They might show *a* vocabulary is incomplete, but cannot directly resolve the *ontological* question (OC) – does the "missing" description point to a genuinely non-physical property, or just a different way of knowing/conceptualizing a physical one?
      *   Phenomenological reports are essential data but are precisely what is in dispute. Their interpretation is theory-laden (Is it reporting a fundamental property or a mode of access to a functional property?).
      *   **Empirical findings on concept acquisition in sensory-deprived subjects (e.g., congenital blindness cured later in life) directly probe the relationship between physical information (broadly construed, including high-level structural brain/functional facts) and phenomenal knowledge:**
          *   **Scenario 1 (Moves towards Side B):** If subjects, *prior* to sight restoration, can master sophisticated third-person structural/functional concepts about color vision (neural correlates, wavelength discrimination, color spaces, behavioral associations) that accurately predict their *post-restoration* phenomenal reports and recognitional abilities, this strongly suggests:
              *   The *information* constituting the phenomenal property was present structurally/functionally.
              *   What was missing was the specific *sensory modality* triggering the formation of the recognitional concept/acquaintance knowledge.
              *   Supports OC: The phenomenal property is realized by the structural/functional property. Failure was of RS (for pre-experiential concepts) and cognitive access, not OC.
          *   **Scenario 2 (Moves towards Side A):** If subjects master all available third-person structural/functional descriptions pre-restoration, yet upon seeing, report something genuinely *unanticipated* and *inexpressible* in their prior conceptual framework, *even after* having mastered that framework, and crucially, if this "newness" cannot be explained by mere sensorimotor integration or concept refinement, this suggests:
              *   The structural/functional description truly *lacked* constitutive elements of the phenomenal property.
              *   Supports the idea that phenomenal properties are fundamental additions not captured by structural/functional description alone, challenging OC.
      *   **Why this is decisive:** It directly tests the prediction derived from the core ontological disagreement. Side B predicts that exhaustive structural/functional knowledge *should* equip one to conceptually grasp (even if not experientially trigger) what the experience will be like. Side A predicts that even exhaustive structural/functional knowledge *necessarily* leaves out an essential, non-structural component that only experience provides. Carefully designed experiments tracking conceptual mastery, predictive abilities, and post-experiential reports can provide evidence favoring one prediction over the other, addressing the ontological question (OC) more directly than abstract arguments about representation.

  **Conclusion:**
  The deadlock persists because the debate conflates **Ontological Completeness (OC)** (substantive) with **Representational Saturation (RS)** for specific vocabularies (often framing-dependent). Anti-physicalists attack RS (fundamental physics vocab) to deny OC. Physicalists defend OC by appealing to RS (broad structural/functional vocab) or denying that RS failure implies OC failure. The most promising path forward is **empirical research on sensory concept acquisition**, as it can provide evidence directly relevant to the ontological claim (OC) about whether phenomenal properties are exhaustively constituted by physical properties or require an irreducible non-structural element. While not foolproof, it offers the clearest route to breaking the decades-long cycle of definitional disputes and proxy arguments.
