prompt: |-
  I'm preparing the final examination for a graduate seminar in moral and political philosophy focused on collective memory, forgiveness, and the ethics of remembrance. I need a single essay question that stages a precise conceptual confrontation between Avishai Margalit's ethics of memory—especially his distinction between shared memory and common memory, and his claim that remembering victims is compatible with political forgiveness—and the counter-argument, developed in David Rieff's reflections on post-atrocity societies, that institutionalized remembrance frequently operates as a form of therapeutic governance that prevents genuine reconciliation by freezing group identities in perpetual victimhood and culpability.

  Rather than asking students to summarize both positions, the question should center on an under-examined structural tension: whether Margalit's framework implicitly commits us to what might be termed "mnemic inheritance," in which descendants of perpetrator groups inherit an open-ended, non-delegable duty to bear witness, and whether this inheritance undermines the very conditions of shared memory by fixing one collective identity in moral culpability across generations. The exam should require students to determine whether this tension is internal to Margalit's view or introduced only by misreading it, and whether a principled distinction—such as a "threshold of saturation" beyond which remembrance becomes ethically counterproductive—can resolve it without collapsing into simple amnesia.

  Please provide: (1) The exam question itself, calibrated for a 90-minute graduate-level response. It must present the problem clearly, avoid any request for bibliographies, citations, or reading lists, and be fully answerable by a student who grasps the conceptual architecture but has no access to external texts. (2) A model answer of approximately 650 words. The answer should make the following specific moves: (a) reconstruct Margalit's shared/common memory distinction and explain how shared memory is meant to enable rather than obstruct forgiveness; (b) articulate Rieff's critique that official remembrance often serves present emotional and political needs rather than honoring the dead; (c) isolate the "mnemic inheritance" problem—whether descendants inherit witnessing obligations and whether this fixes collective identities asymmetrically; (d) evaluate whether a saturation threshold or analogous mechanism can preserve Margalit's ethical core while accommodating Rieff's concern; and (e) arrive at a defensible, qualified conclusion about whether Margalit's ethics can coherently accommodate a collective right or duty to forget. (3) A marking scheme totaling 20 marks, divided among at least five must-hit points. For each point, state the marks allocated, specify the exact conceptual move required to earn them, and provide a brief one-line diagnosis of the typical failure—such as conflating shared memory with homogeneous common memory, reducing Rieff's position to advocacy for total forgetting, treating the conflict as empirical rather than structural, proposing a resolution that abandons Margalit's normative framework entirely, or failing to address intergenerational transmission.
