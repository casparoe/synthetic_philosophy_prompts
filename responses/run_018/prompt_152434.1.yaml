  ok i just got out of this exhausting argument with my friend about Hofstadter's I Am a Strange Loop and i need a sanity check. she summarized his view like this: the self is basically a symbol in the brain that refers back to itself, like a Gödel sentence made of neurons, and he calls this an I-loop. according to her theres no inner observer at all, just this recursive symbol generating the feeling of being a person. she also said that since the loop is just an abstract pattern, copying it exactly into a computer would literally be you, not a clone—identity is just pattern continuity with no extra soul layer. then she claimed Hofstadter uses this to show consciousness is an illusion, like the loop tricks itself into thinking theres a viewer when its just computation. she threw in this idea about epistemic closure, where the symbol cant access its own substrate, and said thats why we feel separate from our brains.

  this feels like she might be smushing Hofstadter together with Dennett or something. is she being fair? which parts are actually his, which are misrepresentations or overstatements, and does her copy-equals-identity conclusion actually follow from the loop idea? also is that epistemic closure thing even coherent with his framework, or did she just invent it? please answer in american english.
