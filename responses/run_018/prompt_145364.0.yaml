prompt: |-
  Design a 90-minute classroom activity for an upper-level philosophy seminar of about 12 to 14 students on the paradox of fiction. The aim is to make participants feel the tension between knowing a narrative is invented and still experiencing a genuinely directed reactive attitude—specifically moral anger or indignation at a wrongdoer—before anyone introduces the standard taxonomy of quasi-emotions, make-believe, or Walton-style pretense theory. The setting should include real but small stakes, hidden information, and assigned roles so that the paradox emerges from what participants do rather than from a lecture.

  Structure the session as follows. Before class, prepare one vivid, ethically charged narrative passage describing a bureaucratic cruelty—detailed enough to invite blame, ambiguous enough that it could be either testimony or fiction. Create two framing envelopes: half are labeled verified documentary transcript, half are labeled excerpt from an unpublished dystopian novel written in 2023. The text inside is identical. Divide the seminar into four small groups of three to four. Within each group, assign two roles: Jurors, who read the passage and respond, and Recorders, who observe and take notes but do not respond emotionally. Give each Juror a private response sheet asking for an emotional-intensity rating, a judgment about whether the perpetrator deserves blame, and a decision about how much of a shared seminar resource—say, a discretionary class-event budget of symbolic points—they are willing to commit to a group protest or solidarity gesture. Emphasize that the commitment is binding only if the Juror judges their reaction to be genuinely about the situation and not merely fictional play.

  Run the activity in three phases. Phase one (20 minutes): groups open their envelopes, read the passage aloud, and Jurors complete their private sheets. Phase two (25 minutes): groups convene to compare allocations. Recorders should track whether emotional intensity correlates with resource commitment, and whether groups with the fiction framing systematically withhold points despite reporting high anger. Phase three (15 minutes): reveal the framing manipulation. Have each group present its allocation pattern without knowing the other groups' frames. Only after all have spoken should the facilitator disclose which groups received which label.

  The debrief (30 minutes) must map specific moments onto parts of the paradox: the private emotional report corresponds to the phenomenology of being moved, the resource-commitment decision corresponds to the cognitive evaluation that the object is real enough to warrant action, and the group-level discrepancy corresponds to the rationality problem—how can the same mental state be both present and withheld based on a belief about origin? Explain why the moral-anger case is harder to stabilize than fear of a movie monster: anger seems to require an actual object of blame, so the paradox bites more sharply when the emotional response includes a normative direction rather than a mere affective jolt. Identify the predictable failure mode: participants will often retroactively downgrade their emotional reports or deny they felt real anger once they learn the text was fiction. The facilitator should treat this revisionism as data about the instability of fictional engagement, not as an error to correct, and should ask what normative work the fiction-label is doing in that revision. Finally, be explicit about what the activity cannot reproduce: the long-term, repeatable stability of fictional emotional engagement across multiple viewings or readings, which the facilitator must supply with a brief theoretical framing at the close—perhaps contrasting one-time reactive anger with sustained aesthetic appreciation—so that students do not conclude that fictional emotions are always self-correcting illusions.

  Include a timeline with minutes allocated, a description of the Recorder role, the rules for binding versus non-binding allocation, and an honest note that the symbolic budget is a proxy for real moral commitment and therefore cannot fully capture the gravity of actual injustice, which the facilitator must acknowledge rather than pretend the game resolves. Do not provide a lecture up front; let the framing cards, the hidden discrepancy, and the revealed allocation gap do the work. End by asking what feature of emotional rationality the activity assumes—belief in the reality of the object—and whether that assumption can be rejected without collapsing the distinction between appropriate and inappropriate anger.
reasoning: |-
  We are designing a 90-minute classroom activity for an upper-level philosophy seminar on the paradox of fiction. The goal is to let students experience the tension between knowing a narrative is invented and still having a genuine emotional reaction (specifically moral anger or indignation). We avoid introducing standard theories until the end.

  Structure:
  - Before class: Prepare a vivid, ethically charged narrative passage. It should be ambiguous enough to be either testimony or fiction. Create two framing envelopes: half labeled as "verified documentary transcript" and half as "excerpt from an unpublished dystopian novel written in 2023". The text inside is identical.
  - Divide the class into 4 small groups (3-4 students each). In each group, assign two roles:
     - Jurors: Read the passage and respond emotionally. They get a private response sheet.
     - Recorders: Observe and take notes on the group process. They do not read the passage until after the activity and do not respond emotionally during the activity.
  - Each Juror completes a private response sheet that asks:
     - Emotional-intensity rating (e.g., on a scale of 1-10) for anger/indignation.
     - Whether the perpetrator deserves blame (yes/no and why briefly).
     - How much of a shared seminar resource (a discretionary class-event budget of, say, 100 symbolic points) they are willing to commit to a group protest or solidarity gesture. The commitment is binding only if the Juror judges their reaction to be genuinely about the situation and not merely fictional play.

  Activity Phases:
  1. Phase One (20 minutes): 
     - Groups open their envelopes and read the passage aloud (by a Juror). 
     - Jurors complete their private response sheets. Recorders observe but do not participate in the emotional response.

  2. Phase Two (25 minutes):
     - Groups convene. Jurors compare their allocations (the points they are willing to commit) and discuss their reasons. 
     - Recorders take notes on:
          - Whether emotional intensity (as reported) correlates with resource commitment.
          - Whether groups with the fiction framing systematically withhold points despite reporting high anger.

  3. Phase Three (15 minutes):
     - Reveal the framing manipulation to the entire class (without disclosing which group had which frame).
     - Each group presents its allocation pattern (how many points were committed on average, and the range) and any interesting points from their discussion. They do not know the frames of the other groups.
     - After all groups have presented, the facilitator discloses which groups had which label.

  Debrief (30 minutes):
  - Map specific moments to the paradox:
     - Private emotional report: corresponds to the phenomenology of being moved.
     - Resource commitment: corresponds to the cognitive evaluation that the situation is real enough to warrant action.
     - Group-level discrepancy: corresponds to the rationality problem (how can the same mental state be both present and withheld based on belief about origin?).
  - Explain why moral anger is harder to stabilize than fear: anger requires an actual object of blame, so the paradox bites more sharply when the emotion includes a normative direction.
  - Predictable failure mode: participants retroactively downgrade their emotional reports or deny they felt real anger once they learn the text was fiction. Treat this as data about the instability of fictional engagement, not an error. Ask what normative work the fiction-label is doing in that revision.
  - Be explicit about what the activity cannot reproduce: the long-term stability of fictional emotional engagement. The facilitator must briefly contrast one-time reactive anger with sustained aesthetic appreciation.
  - End by asking: what feature of emotional rationality the activity assumes (belief in the reality of the object) and whether that assumption can be rejected without collapsing the distinction between appropriate and inappropriate anger.

  Additional details:
  - Timeline: 90 minutes total.
    - Phase 1: 20 min
    - Phase 2: 25 min
    - Phase 3: 15 min (including group presentations and frame disclosure)
    - Debrief: 30 min
  - Recorder role: They are neutral observers. They do not read the passage until after the emotional response phase. They take notes on the group dynamics and the correlation between emotion and commitment.
  - Binding vs. non-binding allocation: The commitment is binding only if the Juror judges the reaction as genuine (about a real situation). If they consider it fictional play, then the commitment is non-binding. This is to capture the idea that we don't act on fictional emotions in the same way as real ones.
  - Note: The symbolic budget is a proxy and cannot capture the gravity of actual injustice. The facilitator must acknowledge this.

  Narrative Passage Example (to be written in a way that could be either real or fictional):
  We need a passage that describes a bureaucratic cruelty. Here's a draft:

  "Case File #34782: Subject: Elena M. 
  Elena, a 58-year-old widow, applied for the renewal of her disability benefits. Her file was processed by Agent #247 (known internally as 'The Hammer'). Despite Elena submitting all required documents on time, Agent #247 flagged her application for 'additional verification.' For three months, Elena made daily calls to the office, each time being transferred through a maze of automated responses and put on hold for hours. When she finally reached a human, she was told her case was 'under review.' Meanwhile, her benefits were suspended. Without income, Elena was forced to choose between buying her heart medication and paying rent. She skipped her medication for two weeks, leading to a severe episode that sent her to the emergency room. The hospital bill was $12,000. When Elena's daughter filed a formal complaint, Agent #247 closed the case with the note: 'Procedures followed. No irregularities found.'"

  This passage is designed to evoke moral indignation at the bureaucratic cruelty of Agent #247.

  Implementation:

  1. Before Class:
     - Prepare 4 envelopes: two labeled "verified documentary transcript" and two labeled "excerpt from an unpublished dystopian novel written in 2023". Inside each, the same passage.
     - Print enough copies of the passage for each group (one per group, to be read aloud).
     - Prepare private response sheets for each Juror (about 8-10 sheets, since 2-3 Jurors per group and 4 groups).

  2. In Class:
     - Divide students into 4 groups. Assign roles: in each group, 2-3 Jurors and 1-2 Recorders (depending on class size). For a group of 4: 3 Jurors and 1 Recorder; for a group of 3: 2 Jurors and 1 Recorder.
     - Explain the roles and the task.

  3. Phase One (20 min):
     - Groups open their envelope and read the passage aloud (one Juror reads it to the group).
     - Jurors complete the private response sheet. They rate their emotional intensity (anger/indignation) on a scale of 1-10. They indicate whether the perpetrator (Agent #247) deserves blame and why (briefly). Then, they decide how many points (out of 100) they are willing to commit to a group protest (e.g., donating to a relevant charity, or organizing a letter-writing campaign). They must check a box: 
          [ ] I judge my reaction to be genuinely about the situation (if checked, the commitment is binding).
          [ ] I consider this merely fictional play (if checked, the commitment is non-binding).
     - Recorders do not read the passage (they can look away or step aside) and do not fill out the sheet. They observe the Jurors.

  4. Phase Two (25 min):
     - In their groups, Jurors share:
          - Their emotional rating.
          - Whether they assigned blame.
          - How many points they committed and whether they checked the binding box.
     - They discuss: Why did they commit the amount they did? How did the framing (if they noticed the label) influence them? (But note: the label is on the envelope, so they know the framing from the start.)
     - Recorders take notes on:
          - The correlation between emotional intensity and points committed.
          - Whether the framing (documentary vs. fiction) seemed to affect the points committed, even when anger was high.
          - Any justifications given for withholding points.

  5. Phase Three (15 min):
     - Facilitator reveals that the text was identical in all envelopes but the framing was manipulated: half were labeled as documentary, half as fiction.
     - Each group presents (1-2 minutes per group) their allocation pattern: average points committed, range, and whether they had any binding commitments. They do not reveal their framing until after all groups have presented.
     - After presentations, facilitator discloses which groups had which label.

  6. Debrief (30 min):
     - Facilitator guides the discussion using the structure above.
     - Key points to bring out:
          - The emotional reaction (anger) was felt regardless of framing? (Check the ratings.)
          - The commitment of points: was it higher in the documentary groups? Did any fiction-group Jurors commit points and check binding? (Unlikely, but if so, note the tension.)
          - The group-level discrepancy: same text, same emotional reaction, but different actions? Why?
     - Discuss the paradox: 
          - How can we feel real anger at something we know is fictional? 
          - Why does moral anger seem to require a real object?
          - Why might participants in fiction groups retroactively say "I didn't really feel anger"?
     - Contrast with fear: we can be scared by a horror movie even if we know it's not real, but we don't call the police. Similarly, we feel anger at a fictional character but we don't take action. However, anger has a normative component: it calls for blame and retribution, which requires a real object.
     - Limitations: The activity is a one-time experience. Real engagement with fiction can be stable and repeatable (e.g., we cry every time we watch a sad movie). This is about the initial reactive attitude. Also, the points are symbolic, so the stakes are low.
     - End question: The activity assumes that for an emotion to be rational, it must be about something real. Can we reject that assumption without losing the ability to distinguish appropriate from inappropriate anger?

  Materials:
  - Envelopes (4) with labels and the narrative passage inside.
  - Private response sheets (one per Juror).
  - Instructions for Recorders (what to observe).
  - A way to track the group allocations (whiteboard or notepad for the facilitator).

  Timeline:
  - 0-5 min: Introduction and group assignment.
  - 5-25 min: Phase One (20 min).
  - 25-50 min: Phase Two (25 min).
  - 50-65 min: Phase Three (15 min).
  - 65-95 min: Debrief (30 min) [extending slightly beyond 90 min is acceptable in a seminar, but try to stick to 90].

  Note: The activity is designed to run for 90 minutes, but the debrief might run over. The facilitator should be mindful of time.

  This design meets the requirements: real but small stakes (symbolic points), hidden information (the framing manipulation), assigned roles, and the paradox emerges from the students' actions and reactions.
answer: |-
  ### **90-Minute Classroom Activity: The Paradox of Fiction**  
  **Objective:** Students experience the tension between emotional responses to a narrative and the belief in its reality, focusing on moral anger. The paradox emerges through action, not lecture.  

  ---

  ### **Materials**  
  1. **Narrative Passage** (identical for all):  
     > *Agent R, a mid-level bureaucrat, deliberately withholds approval of life-saving medication for a terminally ill child, citing "administrative non-compliance." The child’s single parent, Lena, submitted all paperwork on time, but Agent R—motivated by departmental quotas—falsely claims a signature was missing. Lena’s appeals are ignored. The child dies three weeks later. Agent R is promoted for "efficiency."*  
     *(Key: Vivid, morally charged, ambiguous origin)*  

  2. **Framing Envelopes** (one per group):  
     - 2 labeled: **"VERIFIED DOCUMENTARY TRANSCRIPT: Case #42 (2023)"**  
     - 2 labeled: **"EXCERPT: UNPUBLISHED DYSTOPIAN NOVEL (2023)"**  
     *(Inside: Identical narrative passage.)*  

  3. **Role Sheets**:  
     - **Juror Response Sheet** (private, for each Juror):  
       ```  
       1. Anger/Indignation Intensity (1-10): _____  
       2. Does Agent R deserve blame? (Yes/No + 1-sentence why): _____  
       3. Points committed to protest*: _____ / 100  
         [ ] Binding Commitment: I judge my reaction as GENUINE (about a real event).  
         [ ] Non-Binding: I judge this as FICTIONAL PLAY.  
       *Points fund a real class action (e.g., donate to a charity; write to a policymaker).  
       ```  
     - **Recorder Worksheet** (for each Recorder):  
       ```  
       - Track:  
         • Jurors’ anger ratings vs. points committed.  
         • How framing (documentary/novel) influences points.  
         • Justifications for binding/non-binding choices.  
       ```  

  4. **Symbolic Budget**:  
     - A shared pool of **100 points per group** (symbolic; 1 point = ~$0.10 real value).  
     - **Rules**:  
       - Binding commitments: Points *must* be spent on a real-world action (e.g., buying stamps for protest letters).  
       - Non-binding: No action required.  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Phase 1: Private Response (20 min)**  
  - **Setup (5 min)**:  
    - Divide 14 students into 4 groups (3 groups of 3, 1 group of 4).  
    - Assign roles: **2 Jurors + 1 Recorder** per group (3-student groups); **3 Jurors + 1 Recorder** (4-student group).  
    - Distribute envelopes (randomly: 2 documentary, 2 fiction).  
  - **Activity (15 min)**:  
    - Groups open envelopes. One **Juror** reads the passage aloud.  
    - **Jurors**: Complete response sheets *privately*.  
    - **Recorders**: Observe body language/tone; do *not* read the passage.  
    - *Facilitator circulates, answers logistics only.*  

  #### **Phase 2: Group Deliberation (25 min)**  
  - **Tasks**:  
    - **Jurors**: Share anger ratings, blame judgments, and point allocations. Discuss *why* they chose binding/non-binding.  
    - **Recorders**:  
      - Note correlations: High anger + low points? Documentary vs. fiction patterns?  
      - Flag contradictions (e.g., "I felt rage but committed 0 points").  
  - **Key Prompt**:  
    > *"If you marked your commitment as binding, what made the event ‘real enough’ to warrant action? If non-binding, why not?"*  

  #### **Phase 3: Reveal & Group Reports (15 min)**  
  - **Reveal (2 min)**:  
    - Facilitator: "All groups had identical passages, but half were framed as documentary, half as fiction."  
  - **Reports (10 min)**:  
    - Each group shares:  
      1. Average anger rating.  
      2. % of Jurors assigning blame.  
      3. Average points committed.  
      4. One contradiction observed (Recorder summarizes).  
    - *Groups do NOT reveal their framing yet.*  
  - **Disclose Framing (3 min)**:  
    - Facilitator reveals which groups had documentary/fiction labels after all reports.  

  ---

  ### **Debrief (30 min)**  
  **Guided Discussion**:  
  1. **Map the Paradox (10 min)**:  
     - *Phenomenology of emotion*: "Your anger ratings were high regardless of framing—what did that feel like?"  
     - *Cognitive evaluation*: "Binding commitments required belief in reality. What threshold made Agent R ‘real enough’?"  
     - *Rationality problem*: "Why did fiction groups report anger but withhold points? How can the same mental state (anger) be ‘real’ yet not action-worthy?"  

  2. **Moral Anger vs. Fear (5 min)**:  
     - Contrast with horror films: "Fear of a monster doesn’t demand you *punish* it. Why does moral anger require a real target? What happens when that target is fictional?"  
     - Highlight: Anger’s normative force (blame/punishment) clashes with fiction’s unreality.  

  3. **Failure Mode & Revisionism (10 min)**:  
     - Predictable response: "Some in fiction groups may now say, ‘I wasn’t *really* angry.’"  
     - Treat as data: "What does the fiction label *do* to justify downgrading anger? Does it protect us from irrationality? Or reveal discomfort with fiction’s power?"  
     - *Avoid* calling this "wrong"; ask: "What norm is at work here?"  

  4. **Limitations & Theoretical Close (5 min)**:  
     - **Acknowledge**: "Symbolic points can’t capture the gravity of real injustice. This is a proxy, not a resolution."  
     - **Theoretical framing**: "Unlike one-time anger, sustained engagement with fiction (e.g., rereading a tragedy) relies on *aesthetic appreciation*—where emotion persists *because* it’s fictional. Pretense theory (Walton) explains this stability."  
     - **Final Question**: "This activity assumes emotions require belief in a real object. Can we reject that assumption without collapsing the difference between appropriate anger (at real harm) and inappropriate anger (at fiction)?"  

  ---

  ### **Instructor Notes**  
  - **Recorder Role**: Critical for objectivity. Recorders must not engage emotionally; their notes fuel Phase 3 reports.  
  - **Stakes Management**:  
    - Binding commitments use real resources (e.g., points buy stamps for protest letters). This creates tension but avoids trivialization.  
    - Emphasize: "This isn’t a game—it’s about testing the link between emotion and moral action."  
  - **Ethical Caution**:  
    - Acknowledge the passage’s weight: "Real injustices like this occur. The activity explores *why* we respond differently to fiction, but it doesn’t diminish real victims."  
  - **Outcome Predictions**:  
    - Documentary groups: Higher point commitments, binding chosen.  
    - Fiction groups: High anger ratings but low/non-binding commitments. Revisionism in debrief.  
  - **Why It Works**:  
    - Hidden framing + private sheets prevent peer influence.  
    - Resource commitment forces "realness" evaluation.  
    - Revisionism reveals the paradox’s instability organically.  

  **End Goal**: Students leave feeling the paradox’s bite, prepped to dissect theories (e.g., Walton) in future sessions.
