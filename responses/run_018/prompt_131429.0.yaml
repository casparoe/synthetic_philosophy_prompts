answer: |-
  ### Clinical Ethics Committee Responsibility Assignment Procedure for CDSS-Related Harm  
  *Purpose*: To assign primary responsibility for patient harm involving semi-autonomous Clinical Decision-Support Systems (CDSS). Focuses on causal contribution (did the CDSS/clinician cause the harm?), normative competence (could the clinician exercise judgment?), and institutional authorisation (were roles/safeguards adequate?). Complete in ≤45 minutes.  
  *Instructions*: Follow questions sequentially. Record answers. Stop at definitive assignment or gap declaration.  

  ---

  #### **Question 1: Was the CDSS output a necessary cause of the harm?**  
  *Assesses causal contribution. Focus: Did the harm directly result from the CDSS recommendation?*  
  - **Sufficient "Yes"**: Harm would not have occurred without the CDSS output (e.g., clinician would not have acted without the recommendation).  
  - **Sufficient "No"**: Harm arose independently (e.g., clinician ignored CDSS and acted autonomously).  
  - **→ If "Yes"**: Proceed to Question 2.  
  - **→ If "No"**: Proceed to Question 5.  

  #### **Question 2: Could the clinician meaningfully evaluate the CDSS output?**  
  *Assesses normative competence. Focus: Did the clinician have capacity (training, expertise) and opportunity (time, resources) to assess the recommendation?*  
  - **Sufficient "Yes"**: Clinician had expertise in the relevant clinical area, access to patient data, and no urgent constraints preventing evaluation.  
  - **Sufficient "No"**: Evaluation was impossible due to system opacity, time pressure, or lack of training/resources. *This is a collapse condition if CDSS and clinician decisions are inseparable*.  
  - **→ If "Yes"**: Proceed to Question 3.  
  - **→ If "No"**: Proceed to Question 6.  

  #### **Question 3: Did the clinician actively evaluate the output?**  
  *Assesses exercise of normative competence. Focus: Was the recommendation scrutinised, not just rubber-stamped?*  
  - **Sufficient "Yes"**: Evidence of deliberation (e.g., notes comparing CDSS output with clinical guidelines/patient history).  
  - **Sufficient "No"**: Blind adoption/rejection without documented reasoning.  
  - **→ If "Yes"**: Proceed to Question 4.  
  - **→ If "No"**: **STOP. Assign primary responsibility to clinician** (failure to exercise duty of care).  

  #### **Question 4: Was the clinician’s evaluation reasonable?**  
  *Assesses normative judgment. Focus: Would a competent peer make the same decision in that context?*  
  - **Sufficient "Yes"**: Decision aligned with standards of care, available evidence, and institutional protocols.  
  - **Sufficient "No"**: Decision deviated from norms without justification (e.g., ignoring clear contraindications).  
  - **→ If "Yes"**: Proceed to Question 6.  
  - **→ If "No"**: **STOP. Assign primary responsibility to clinician** (unreasonable clinical judgment).  

  #### **Question 5: Was the clinician’s independent action reasonable?**  
  *(From Q1: CDSS not causal). Focus: Did non-use of CDSS cause avoidable harm?*  
  - **Sufficient "Yes"**: Action matched clinical standards (e.g., sound alternative treatment chosen).  
  - **Sufficient "No"**: Action was negligent (e.g., ignored basic protocols without justification).  
  - **→ If "Yes"**: **STOP. Assign no individual responsibility** (harm not attributable to fault).  
  - **→ If "No"**: **STOP. Assign primary responsibility to clinician** (unreasonable action).  

  #### **Question 6: Were institutional safeguards adequate?**  
  *(From Q2: Clinician couldn’t evaluate, or Q4: Clinician acted reasonably). Focus: Did the institution enable safe CDSS use?*  
  - **Sufficient "Yes"**: Robust protocols existed (e.g., mandatory training, audits, escalation paths for uncertain cases).  
  - **Sufficient "No"**: Safeguards were missing/ignored (e.g., no training, unclear accountability).  
  - **→ If "Yes"**: **STOP. Declare irreducible responsibility gap** (no individual fault; requires institutional review).  
  - **→ If "No"**: **STOP. Assign primary responsibility to institution** (systemic failure).  

  ---

  ### Worked Applications  
  #### **Case 1: Clinician overrode sound recommendation → harm**  
  - **Q1**: *No* (CDSS not causal—override caused harm).  
  - **Q5**: *No* (override was unreasonable; sound recommendation ignored).  
  - **Outcome**: **Assign to clinician**. Stop.  

  #### **Case 2: Clinician blindly adopted flawed recommendation → harm**  
  - **Q1**: *Yes* (CDSS necessary—harm would not have occurred without it).  
  - **Q2**: *Yes* (clinician had training/time to evaluate).  
  - **Q3**: *No* (no evidence of evaluation).  
  - **Outcome**: **Assign to clinician**. Stop.  

  #### **Case 3: CDSS reasoning opaque; no meaningful override → harm**  
  - **Q1**: *Yes* (CDSS necessary for the decision).  
  - **Q2**: *No* (opacity made evaluation impossible—**collapse condition**).  
  - **Q6**: *Yes* (safeguards existed, e.g., developer validation, but still failed).  
  - **Outcome**: **Declare irreducible gap**. Stop.  

  ---

  ### Critical Limitations  
  1. **Misfires**:  
     - **Over-reliance on documentation**: If clinician evaluated orally but didn’t document, Q3 may misfire (unfair clinician blame).  
     - **"Reasonableness" bias**: Q4/Q5 rely on committee’s subjective view of clinical norms (may penalise defensible innovations).  

  2. **Value Judgments Beyond Procedure**:  
     - Defining "reasonable" (Q4/Q5) requires deliberation on local care standards.  
     - Assessing "adequate safeguards" (Q6) involves weighing institutional resources vs. risk.  

  3. **Collapse Conditions**:  
     - Flagged in Q2 (clinician unable to evaluate). Hard cases require discussing: *Was the CDSS designed to preclude human oversight?* (e.g., real-time algorithms in emergencies).  

  4. **Gaps Require Deliberation**:  
     - Irreducible gaps (Q6 outcome) demand committee debate on:  
       - *Systemic fixes* (e.g., redesigning CDSS oversight).  
       - *Compensation mechanisms* (e.g., no-fault settlements).  

  **Time Efficiency**: Strict sequencing ensures completion in ≤45 mins. Deliberation on gaps occurs outside the procedure.
