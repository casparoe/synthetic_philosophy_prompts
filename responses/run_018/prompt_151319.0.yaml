answer: |-
  ### Comparing Hume's Standard of Taste and Community Taste Calibration on Avant-Garde Disagreements  

  **Hume's Standard of Taste**:  
  Hume argues that while aesthetic sentiment is subjective, ideal critics—through *delicacy* (refined perception), *practice*, and freedom from prejudice—can discern objective beauties in art. Disagreements among experts arise from temporary flaws: insufficient exposure to challenging art, lingering biases, or the inherent complexity of avant-garde works that defy traditional norms. Ideal critics *should* converge over time as they refine their faculties and uncover universal principles of beauty, even in radical art. When experts disagree, Hume attributes it to their failure (thus far) to meet the "ideal" standard, not the absence of objectivity.  

  **Community Taste Calibration**:  
  This framework rejects hidden objective beauty. Instead, aesthetic judgments are calibrated socially—like aligning instruments to a shared baseline—to maintain coherence within communities. Avant-garde art *deliberately disrupts* consensus. Experts disagree because they belong to different "calibration groups" (e.g., academic circles, avant-garde movements, traditional institutions) with clashing baselines. Disagreement isn’t a failure but an expected outcome when art subverts established norms faster than consensus recalibrates. There is no "correct" beauty to uncover—only shifting social agreements.  

  **Why Experts Disagree About Avant-Garde Art**:  
  - **Hume’s Explanation**: Disagreements are epistemic failures. Avant-garde art’s novelty overwhelms even trained critics; consensus *should* emerge once ideal critics fully engage with the work’s complexities.  
  - **Calibration Explanation**: Disagreements are foundational. Avant-garde art targets the *incoherence* of existing baselines. Experts calibrated to distinct communities (e.g., postmodern vs. modernist) lack a shared reference point, making persistent disagreement inevitable.  

  **Verdict**:  
  Community taste calibration better explains avant-garde disagreements. Avant-garde art thrives on destabilizing conventions, exposing how experts—despite training—operate within divergent social frameworks rather than progressing toward universal objectivity. Disagreement isn’t a step toward consensus but proof that art can fracture calibration.  

  \answer{calibration}  
  Summary: Calibration wins because avant-garde art intentionally fractures social consensus, making expert disagreement a structural inevitability rather than a correctable lapse.
