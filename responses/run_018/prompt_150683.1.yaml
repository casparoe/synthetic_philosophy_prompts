prompt: |-
  For a grad seminar on practical reason, 10 people, 90 minutes. I want them to actually feel the problem with indirect normativity in groups, not just hear it. The niche point is that if reasons are anchored to each person's own idealized deliberator, then collective decision-making doesn't have one shared standard—it has ten parallel monologues that happen to sit in the same room. Design a structured activity with real (small) stakes—say, dividing a pool of actual snack credits—where in round one they bargain as themselves, and in round two they must each construct and then defend only the position that their "fully informed, unbiased, but value-preserving" counterpart would take. The rules should force them to discover that they can't appeal to "what we should do" without smuggling in actual preferences, and that the idealized agents don't converge even when the real people want agreement. Include roles or constraints, a timeline, the debrief mapping each round onto the fragmentation problem, and an honest note about which feature of indirect normativity—probably the metaphysical claim that the counterfactual agent is genuinely authoritative, not just advisory—the activity can't reproduce and you have to supply verbally. Keep it runnable without props beyond paper and snacks, and don't let the facilitator name the view until the debrief. Oh, and I have a typo in my notes: I wrote "idealized delibaration" so if you quote that back it's fine.
reasoning: |-
  We are designing a 90-minute seminar activity for 10 people on the problem of indirect normativity in group decision-making. The goal is to have participants experience the fragmentation that occurs when each person's reasons are anchored to their own idealized deliberator (fully informed, unbiased, but value-preserving). We will use a practical activity with small stakes: dividing a pool of snack credits.

  Key elements:
  - Two rounds: 
    Round 1: Participants bargain as themselves.
    Round 2: Each constructs and defends the position of their idealized deliberator.
  - We want to show that in the second round, they cannot appeal to a shared "should" without smuggling in their own preferences, and that the idealized agents do not converge even when the real people might want agreement.
  - Rules and constraints to force discovery of the problem.
  - Debrief mapping the rounds to the fragmentation problem.
  - Note about what the activity cannot reproduce (metaphysical authority of the counterfactual agent) and that we must state it verbally.

  Structure:
  1. Introduction (5 min)
  2. Round 1: Bargaining as themselves (20 min)
  3. Round 2: Constructing and defending the idealized position (30 min)
  4. Debrief and discussion (35 min)

  Materials: Paper, pens, and a pool of snack credits (e.g., a total of 100 credits that can be exchanged for snacks after the seminar).

  Detailed Plan:

  1. Introduction (5 minutes)
     - Facilitator sets the stage: "We're going to do a group decision-making exercise about dividing snack credits. There are no right answers, but we are going to try two different approaches. The goal is to experience and reflect on the process."
     - Explain the setup: "We have 10 people and 100 snack credits to divide. Each credit is worth a small snack item. We'll do two rounds of discussion and decision-making."
     - Do not name the view (indirect normativity) until the debrief.

  2. Round 1: Bargaining as Themselves (20 minutes)
     - Task: The group must agree on how to divide 100 snack credits among the 10 participants. They can use any method (discussion, voting, etc.) but must reach a decision within 20 minutes.
     - Rules: 
          - Everyone must get at least 1 credit (to avoid zero).
          - They can form coalitions, argue, etc., but they are to act as themselves.
     - Stakes: The division they agree on will be the one implemented for the real snacks, but note: they will do a second round and then at the end of the seminar they will choose which round's division to implement (so both rounds have real stakes). However, the facilitator will not reveal that they get to choose until after Round 2. This creates an incentive to take both rounds seriously.
     - At the end of the round, they write down the agreed division.

  3. Round 2: Bargaining as Idealized Deliberators (30 minutes)
     - Preparation (5 minutes): Each participant is given a piece of paper and asked to construct the position of their "fully informed, unbiased, but value-preserving" counterpart. They must write down:
          - What they think their idealized deliberator would say about how the credits should be divided? (Note: They are to preserve their own values but be fully informed and unbiased. Clarify: "Unbiased" here means free from personal biases that distort reasoning, but they still have their own core values.)
          - They must also write a brief justification (2-3 sentences) for why that division is what the idealized deliberator would choose.
     - Group Discussion (25 minutes): 
          - Rules for Round 2:
              - Each participant must only defend the position they wrote for their idealized deliberator. They cannot argue based on their own preferences.
              - They cannot say "I think" but must say "My idealized deliberator thinks...".
              - The group must try to reach a consensus on the division from the perspective of these idealized agents. If they cannot, they can vote (but note: the decision must be made by the group, and if they vote, the majority wins).
          - The facilitator should remind them: "Remember, you are not speaking for yourself. You are speaking for your idealized deliberator. You must set aside your own preferences and only present what you believe this unbiased, fully informed version of you would say."
          - The group must come to a decision (by consensus or vote) on the division.

  4. Debrief and Discussion (35 minutes)
     - First, reveal that the group will now choose which round's division to implement (the one from Round 1 or Round 2) for the actual snacks. They vote by show of hands. (This takes 2 minutes.)
     - Then, the facilitator leads a debrief:
          a. Ask about Round 1: How was the process? Was there a shared standard? (Likely: They might have appealed to fairness, need, contribution, etc., and they could negotiate because they shared a common space of reasons, even if they disagreed.)
          b. Ask about Round 2: 
              - What was it like to construct your idealized deliberator? 
              - How did the group discussion go? Did you feel you were able to set aside your own preferences? 
              - Did the group converge on a decision? Why or why not?
          c. Map to the concept: 
              - "In Round 1, you were bargaining as yourselves. There was a shared context and you could appeal to common reasons. But in Round 2, each of you was representing a different idealized deliberator, each anchored to your own values and perspective. Even though each idealized agent is fully informed and unbiased, they are still tied to the individual's values. Therefore, we had ten parallel monologues. There was no shared standard of 'what we should do' that wasn't already tied to one of these individual perspectives."
          d. Key insight: 
              - "The activity was designed to show that when reasons are anchored to each person's own idealized deliberator, collective decision-making becomes fragmented. The idealized agents don't necessarily converge even when the real people might want agreement because the real people in the room might have been willing to compromise, but their idealized agents are uncompromising (since they are 'perfect' from their own perspective)."
          e. What the activity cannot show: 
              - "Note that in the theory of indirect normativity, the idealized deliberator is taken to be genuinely authoritative (metaphysically) for the person, not just advisory. This activity cannot reproduce that metaphysical authority because in the room you were just role-playing. The authority of the idealized agent is something we have to accept as a theoretical claim, and that's why in real life, if we take this view, we face the problem of fragmentation in groups. We'll discuss this more in the next seminar session."

  Timeline Recap:
  - 0-5 min: Introduction
  - 5-25 min: Round 1 (20 min)
  - 25-30 min: Individual prep for Round 2 (5 min)
  - 30-55 min: Round 2 group discussion (25 min)
  - 55-60 min: Write down Round 2 decision and break (if needed) (5 min, but we'll use this time to set up debrief)
  - 60-95 min: Debrief and discussion (35 min) [Note: 95 min is 5 over, but we can adjust in real time]

  Adjustment for time: We have 90 minutes total. Let's tighten:
  - Introduction: 5 min
  - Round 1: 15 min (so we end at 20)
  - Round 2 prep: 5 min (end at 25)
  - Round 2 discussion: 20 min (end at 45)
  - Debrief: 45 min? That's too long. Let's rebalance:

  Alternative Timeline (90 min):
  - 0-5: Intro
  - 5-20: Round 1 (15 min)
  - 20-25: Round 2 prep (5 min)
  - 25-45: Round 2 discussion (20 min) [they might not reach consensus, but that's okay]
  - 45-50: Write decisions and vote on which round to implement (5 min)
  - 50-85: Debrief (35 min) -> we can cut short if needed.

  But note: we need to leave time for the vote and then debrief. Alternatively, we can have the vote at the very end of the seminar and then hand out snacks accordingly, but the debrief is the main point.

  Revised Timeline (90 min):
  - 0-5: Intro
  - 5-20: Round 1 (15 min) -> they must decide by 20 min mark.
  - 20-25: Round 2 prep (5 min)
  - 25-45: Round 2 (20 min)
  - 45-50: Each group writes down their Round 1 and Round 2 decisions and then the group votes on which round's division to implement. (5 min) [This vote is by the real people, not the idealized ones. They vote as themselves.]
  - 50-85: Debrief (35 min) -> This is the core of the seminar.

  Debrief Structure (35 min):
  1. Voting outcome (2 min): Which round did they choose? Why? (Quick show of hands and one or two comments.)
  2. Round 1 reflection (5 min): How did they reach a decision? What standards did they use? (Fairness, equality, need, etc.) Emphasize that they were able to negotiate because they shared a common space of reasons.
  3. Round 2 reflection (10 min):
     - Ask participants about the experience of constructing their idealized deliberator. Was it hard? Did they feel they could set aside their biases?
     - How did the group discussion go? Did they feel they were speaking for an entity that wasn't themselves? 
     - Did they notice that they couldn't appeal to a shared "should"? (Because each idealized deliberator has its own standard, which might be incommensurable.)
     - Did the group reach consensus? If not, why? If yes, was it genuine or forced? (Point: even if they voted, they were voting on which idealized position to adopt, but the vote doesn't make the reasons shared.)
  4. Mapping to the fragmentation problem (10 min):
     - Explain: "What you experienced in Round 2 is the problem of indirect normativity in groups. Each person has their own idealized deliberator, which is the source of their reasons. But that means in a group, we don't have one standard; we have ten. And these ten don't necessarily converge. Even if the real people in the room want to agree, their idealized agents might not. Moreover, when you tried to discuss, you couldn't appeal to a shared standard without smuggling in your own (or the group's) actual preferences."
  5. The missing piece: Metaphysical authority (5 min):
     - "One thing this activity couldn't reproduce is the idea that the idealized deliberator is not just a useful fiction but the actual source of normative authority for each person. In the theory, it's not just advisory; it's what really determines what you should do. That's why in real life, if we accept indirect normativity, we face a deep problem for collective action. We have to take these ten distinct sources of authority seriously, and they might not agree. We'll delve into the implications of this in future sessions."
  6. Wrap-up and questions (3 min).

  Important: Throughout the activity, the facilitator should not use the term "indirect normativity" or "fragmentation" until the debrief. Refer to Round 2 as "representing your idealized deliberator" or "the unbiased, fully informed version of you that keeps your core values."

  Rules for Round 2 to force the issue:
  - If a participant starts arguing from their own preference, the facilitator should remind: "Remember, you are speaking for your idealized deliberator. What would they say, based on being fully informed and unbiased but preserving your core values?"
  - The facilitator can also ask: "Is that what your idealized deliberator would say, or is that what you want?"

  This activity should make palpable the fragmentation of normative authority in groups under indirect normativity.
answer: |-
  Here’s a structured activity designed to make the fragmentation problem in **indirect normativity** tangible, using snack credits as stakes. It runs in 90 minutes with 10 people, requires only paper and snacks, and delays naming the theory until the debrief.

  ---

  ### **Activity: The Snack Credit Dilemma**  
  **Core Problem:** Participants experience how anchoring reasons to *individual* idealized deliberators ("fully informed, unbiased, value-preserving" versions of themselves) prevents shared standards in group decisions.  

  **Materials:**  
  - Paper/pen for each person.  
  - Snacks (e.g., 100 credits total = 10 credits per person if divided equally).  
  - Timer.  

  **Stakes:** The division agreed in **one** round will be implemented (real snacks distributed post-seminar). The group chooses which round’s outcome to enforce *after both rounds* (to incentivize engagement).  

  ---

  ### **Structure & Timeline**  
  **Total: 90 minutes**  

  #### **1. Setup (5 min)**  
  - **Facilitator Instructions:**  
    - “We have 100 snack credits to divide among 10 people. Your task is to decide how to split them. There are two rounds with different rules. At the end, you’ll vote on which round’s division we implement.”  
    - **Do NOT** define "idealized deliberation" beyond: *“In Round 2, you’ll role-play a version of yourself that is fully informed, unbiased, but committed to your core values.”*  
    - Emphasize: *“In Round 2, you MUST defend ONLY what this ‘improved you’ would argue—not your real preferences.”*  

  #### **2. Round 1: Bargaining as Themselves (20 min)**  
  - **Goal:** Reach consensus on credit division.  
  - **Rules:**  
    - Everyone must receive at least 1 credit.  
    - No fixed rules for division (e.g., can use equality, merit, need, etc.).  
    - Group must agree unanimously (or majority vote if deadlocked).  
  - **Facilitator Role:**  
    - Intervene only to keep time.  
    - **Secretly note:** Group dynamics, appeals to “fairness,” compromises.  
  - **Outcome:** Write down the final division.  

  #### **3. Round 2: Bargaining as Idealized Deliberators (30 min)**  
  - **Part A: Construct Your Idealized Deliberator (10 min)**  
    - Each participant privately writes on paper:  
      *“My idealized self would divide the credits as follows: [X credits per person].  
      Why? As a fully informed, unbiased agent who preserves MY values, they would argue: [2-sentence justification].”*  
    - **Constraints:**  
      - Justification must reference *their own core values* (e.g., “efficiency,” “compassion”) filtered through “perfect” rationality.  
      - **No collaboration yet.**  

  - **Part B: Group Defense (20 min)**  
    - **Rules:**  
      - Each person argues ONLY for their *idealized* position. They must start statements with: *“My idealized self argues…”*  
      - No appeals to “we” or “us” (e.g., “*My idealized self* believes this division is best”).  
      - Goal: Reach consensus (unanimous or majority).  
    - **Facilitator Role:**  
      - Enforce rules strictly. If someone references personal preferences, interrupt: *“Is this YOUR view or your idealized self’s?”*  
      - If they appeal to group harmony: *“Can your idealized self prove this is objectively best, not just agreeable?”*  
    - **Outcome:** Write down the final division.  

  #### **4. Vote & Implement (5 min)**  
  - Vote by show of hands: **Which round’s division do we implement?** (Real snacks are distributed post-debrief).  

  #### **5. Debrief (30 min)**  
  **Goal:** Link the activity to indirect normativity’s fragmentation problem.  
  **Facilitator Script:**  

  > **Step 1: Contrast Rounds (10 min)**  
  > - *Round 1:* “How did you reach agreement? Likely through compromise, shared ideals (‘fairness’), or empathy. *This assumes a common standard*.”  
  > - *Round 2:*  
  >   - “What happened when you role-played your idealized selves? Did consensus collapse?”  
  >   - “Did you feel trapped? Could you defend your position without smuggling in *your* preferences?”  
  >   - “Even if real-you wanted agreement, why couldn’t your idealized selves converge?”  
  > - **Key Insight:** “Round 1 had one shared standard. Round 2 had 10 separate standards—parallel monologues anchored to individual ideals. No ‘we’ existed.”  

  > **Step 2: Map to Theory (10 min)**  
  > - Name the View: *“This is the fragmentation problem in* **indirect normativity** *—where normative reasons are tied to personal counterfactual deliberators.”*  
  > - **Core Problem:**  
  >   - “Each idealized self is ‘authoritative’ for you, but there’s no shared authority for the group.  
  >   - Even with full information and no bias, divergent *values* prevent convergence.  
  >   - Appeals to ‘what we should do’ in Round 2 secretly relied on *real-world* preferences (e.g., avoiding conflict).”  

  > **Step 3: The Limitation (5 min)**  
  > - “This activity **can’t reproduce one thing**: The *metaphysical authority* of the idealized deliberator.  
  >   - In theory, this agent isn’t just an advisor—it’s the *source* of your reasons.  
  >   - Here, you *role-played* it, so it felt artificial. But if we take indirect normativity seriously, these agents are **real authorities**, making fragmentation unavoidable in groups.”  

  > **Step 4: Discussion (5 min)**  
  > - “Does this undermine group rationality? Can we ‘fix’ this? We’ll explore next week.”  

  ---

  ### **Why This Works**  
  - **Real Stakes:** Snacks incentivize genuine engagement.  
  - **Forced Fragmentation:** Round 2 rules prevent appeals to shared standards, exposing incommensurable ideals.  
  - **Debrief Structure:** Progresses from experience → theory → limitation, making the problem visceral.  

  ### **Adjustments for Robustness**  
  - **If consensus collapses in Round 2:** Celebrate it! This proves the point—idealized agents don’t converge.  
  - **Dominant participants:** Assign roles (e.g., a “silent observer” to track interruptions) to ensure equity.  
  - **Time crunch:** Shorten Round 1 to 15 min if needed; the key is Round 2’s tension.  

  This activity makes the abstract concrete: Participants *feel* the impossibility of shared reasons under indirect normativity, setting up deeper seminar discussions.
