   - At least one node about what credences are for (decision vs belief).
   - At least one node about self-locating evidence (e.g., being told it's Monday).
   - At least one node about multiple copies (duplication).
   - Must include three cases: canonical, duplication (1 vs 1000), and the blue/green card variant.

   Leaves we want (with corrections and standard names if available):
   1. Thirder (Elga-style): answer 1/3, by symmetry of awakenings.
   2. Lewisian halfer: answer 1/2 on waking, but updates to 2/3 after learning it's Monday.
   3. Double halfer: answer 1/2 on waking and remains 1/2 after learning it's Monday.
   4. A view that uses a general rule about random sampling (e.g., self-sampling assumption) to get 1/3. We'll see if it separates from the thirder.
   5. Indeterminate: no unique rational credence; or interval-valued.
   6. Decision-relativity: the credence only makes sense relative to a decision problem.

   We also have the blue/green card variant.

   Plan the tree:

   We start with the canonical setup and then branch out.

   Important: We must avoid nodes that directly ask for 1/3 or 1/2.

