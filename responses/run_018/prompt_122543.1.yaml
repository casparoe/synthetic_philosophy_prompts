  ### Notes on Design

  1. **Blue/Green Card Variant (node5)**:
     - **Purpose**: Separates thirders (A: ~46%) from halfers (B: ~63%) via different evidence updating. Double halfers and Lewisian halfers both get ~63% due to shared probability mass allocation (P(Tails & Monday) = 1/4, etc.).
