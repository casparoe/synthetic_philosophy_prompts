prompt: |-
  ok so i just got roped into mediatng for my buildings tenants associtation after my own heat got shut off twice and now im stuck in these arguments where people fight over whether someone lied or just meant something else. i need you to turn Grices cooperative principle and the speaker meaning vs said content distinction into an actual procedre i can run in like ten minutes with just a notebook. the steps should be in order: check the literal said-content first, then see if the cooperative principle applies, then run the four maxims (quantity quality relation manner) to spot implicatures, then test for cancellability and whether its particularized or generalized, then check non-detachability — if i can swap in a synonym without losing the implied part then its probably not a real implicature. flag every point where im still making a value judgment not a fact check. also i need it to tell flouting a maxim on purpose apart from quietly violating it, but be honest if that distinction misfires in real talk.

  run it on three disputes:
  1. landlord texts "the repair crew is aware of your unit" but he never actually called them. lie or implicature?
  2. at a meeting a tenant says "some residents have mentioned noise issues" but she herself filed the complaint. misrepresentation?
  3. a case where the procedre tells me technically nothing false was said but i still feel betrayed — like "i'll do my best to have this done by friday" said on tuesday, then nothing happens. i want to see the answer i wont like.

  fix the role: im a volunteer mediator, not a lawyer, i have maybe 15 mins per case, and i need to sign off on whether its a breach of said promise or just implied expectation. dont ask me for citations or a reading list — i have no library access. keep it casual, im typing on my phone so typos are totally fine.
reasoning: |-
  Okay, let's break this down. The user is a volunteer tenant mediator dealing with heated disputes after their own heating got cut off - that personal stake means they're probably both motivated and frustrated. They need a practical, phone-typing-friendly way to apply Gricean pragmatics to real-life arguments in under 15 minutes per case. 

  First, the core ask: turn linguistic theory into a step-by-step scribble-in-notebook procedure. Key requirements are speed (10-15 min/case), no academic fluff, and flagging where judgments are subjective vs objective. They specifically want to handle three common dispute patterns: landlord dodging responsibility, tenants hiding direct complaints behind vague language, and passive-aggressive deadline evasion.

  The user's tone is rushed and slightly exasperated ("stuck in these arguments", "typos are totally fine") - they're clearly mediating between neighbors while dealing with their own heating issues. This isn't a theoretical exercise; they need something that works in the wild. Their examples show they've already grasped key concepts (cancellability, flouting vs violating) but need help operationalizing it.

  Biggest challenges I see: 
  - The flouting/violating distinction is notoriously messy irl - gotta acknowledge that upfront
  - They'll hate the Friday deadline analysis but it's a perfect teaching moment about implied meaning
  - Need to build in "judgment call" flags at every step because mediation isn't algorithm

  Procedure structure should mirror how disputes unfold: 
  Start with literal truth (safety net), then unpack implications through maxims, then stress-test those implications. The synonym swap test (non-detachability) is genius for spotting genuine implicatures vs misunderstandings.

  For the examples:
  1. Landlord's "aware" text is classic quality maxim violation - the repair crew can't be aware if never contacted. Easy call.
  2. Tenant's "some residents" is quantity flouting - the vagueness deliberately hides her involvement. Tricky because it's technically true but misleading.
  3. The Friday promise hurts because it flouts manner maxim - "best effort" creates false precision. But cancellation test shows they left themselves an out. User won't like this answer but it's legally safer.

  Gotta emphasize this isn't a truth detector - it's a miscommunication spotlight. Final output should sound like a quick-reference cheat sheet, not a lecture. Drop all citations, keep explanations in tenant-meeting language ("weasel words" not "maxim of quantity violation").
answer: |-
  Here's your 10-minute mediation toolkit, scribbled straight into your notebook. No fluff, all action:

  **Grice's Quick & Dirty Mediation Flowchart**  
  *(Grab a pen, draw boxes/arrows if it helps, or just number steps)*

  1.  **WHAT WAS ACTUALLY SAID?** (Literal Meaning / Said Content)  
      *Write it down verbatim.*  
      🤔 **JUDGMENT CALL:** Are we *sure* about the exact words? (Get texts/emails/witnesses if possible).  
      ✅ **FACT CHECK:** Is this statement *literally true*? (Yes/No/Partially). **If NO → Potential Lie/Breach.** Move to step 5. **If YES or PARTIALLY → Go to Step 2.**

  2.  **WERE THEY PLAYING BALL?** (Cooperative Principle - CP)  
      *Was this a normal convo where people help each other understand?*  
      🤔 **JUDGMENT CALL:** Context matters! Was it a formal notice? A heated argument? A quick text? **If NO (e.g., sarcasm, legal threat, shouting match) → CP likely broken, implicatures unreliable. Stop or flag as "non-cooperative - hard to judge intent." If YES → Go to Step 3.**

  3.  **WHAT WERE THEY *REALLY* GETTING AT?** (Check Maxims for Implicatures)  
      *Look for what's suggested but not said. Apply the 4 rules:*
      *   **Quantity:** Too little info? (e.g., vague, incomplete) → *Implicature: They're hiding something?*  
          Too much info? (e.g., over-explaining) → *Implicature: They think you're dumb or they're nervous?*
      *   **Quality:** Seems sketchy? (e.g., unsupported claim, obvious exaggeration) → *Implicature: They're unsure, lying, or emphasizing a feeling?* **Flag potential lie if strong.**
      *   **Relation:** Random comment? → *Implicature: It must connect somehow (e.g., changing subject, hinting).*
      *   **Manner:** Unclear? Wordy? Weird order? → *Implicature: They're confused, evasive, or emphasizing something?*
      🤔 **JUDGMENT CALL:** Which maxim(s) seem bent/broken? What does that *suggest* (implicature)? Write it down.

  4.  **IS THE IMPLIED PART SOLID?** (Test the Implicature)
      *   **Cancellability:** Could they *add* something later without contradiction to deny the implication? (e.g., "Some residents complained... *including me*" vs. "Some residents complained... *not me though*").  
          🤔 **JUDGMENT CALL:** If **Yes (Cancellable)** → It was *likely* just an implicature, not a core promise/fact. **If No (Not Cancellable)** → Stronger case it was part of the intended meaning.
      *   **Generalized (GCI) vs. Particularized (PCI):**  
          **GCI:** Default assumption (e.g., "I ate *some* cookies" → *I didn't eat all*). Needs no special context.  
          **PCI:** Depends *totally* on context (e.g., "It's cold in here" → *Please close the window*).  
          🤔 **JUDGMENT CALL:** Is the implication a standard default (GCI - stronger)? Or *only* makes sense here/now (PCI - weaker/more context-dependent)?
      *   **Non-Detachability:** Swap a synonym. Does the implication *vanish*? (e.g., "aware" vs. "notified").  
          🤔 **JUDGMENT CALL:** If **Yes (Implication VANISHES with synonym)** → It was probably *not* a genuine Gricean implicature, maybe just word choice. **If No (Implication STAYS with synonym)** → Stronger case it's a real implicature tied to the meaning.

  5.  **FLAGRANT FLAUTING vs. SNEAKY VIOLATION?** (This gets messy!)
      *   **Flouting (Usually Obvious):** *Deliberately* breaking a maxim *to create* an implicature. It's LOUD (e.g., sarcasm, heavy hinting, dramatic vagueness). People expect you to notice.
      *   **Violating (Usually Sneaky):** *Covertly* breaking a maxim *to mislead*. Trying NOT to be noticed (e.g., subtle omission, careful wording to dodge truth).
      *   **🚨 REAL TALK WARNING:** This distinction often misfires! Sneaky violators pretend they were just flouting poorly. Bad flouters look like violators. **Focus on outcome:** Did the CP break *cause harm/mislead*? 🤔 **JUDGMENT CALL:** Does it *feel* intentional and deceptive (Violation) or clumsy/expressive (Flouting)? **Assume you might be wrong here.**

  6.  **YOUR CALL: BREACH OR MISUNDERSTANDING?**
      *   **Breach of Promise/Fact Likely IF:** Literal falsehood (Step 1) + OR Strong, non-cancellable implicature of a promise/fact (Steps 3-4) + Context suggests bad faith (Step 5).
      *   **Misunderstanding/Unmet Expectation Likely IF:** Literally true (Step 1) + Implicature weak/cancellable/context-dependent (Steps 3-4) + No clear deceptive intent (Step 5).
      *   **🤔 UNAVOIDABLE JUDGMENT:** You weigh the evidence. There's no perfect formula. Focus on *harm caused* by the communication, not just technicalities.

  **Running Your Cases (15 Min Total - 5 Min Each):**

  1.  **Landlord: "the repair crew is aware of your unit" (Never called them)**
      *   **Step 1:** Literally False? Crew *unaware* if never contacted → **LITERALLY FALSE.** ✅ **FACT CHECK FAIL.** → **Probable Lie/Breach.** (Could stop here). *But let's see...*
      *   *If arguing "aware" means something else...* Step 3: Violates **Quality** (said something false) & **Quantity** (lacks crucial info *that he didn't call*). Implicature: *Action is being taken*.
      *   Step 4: Implicature *not cancellable* ("they're aware... but I never told them" = contradiction). Strong PCI (depends on context of needing repair). Non-detachable ("informed" has same implication).
      *   Step 5: Looks like **Violation** (sneaky lie).
      *   **Your Sign-off:** **Breach.** Literally false + deceptive implicature. Landlord misrepresented the situation.

  2.  **Tenant: "some residents have mentioned noise issues" (She filed it)**
      *   **Step 1:** Literally True? If she's a resident → **LITERALLY TRUE.** Move to Step 2.
      *   **Step 2:** CP? Assuming normal meeting talk → **YES.** Move to Step 3.
      *   **Step 3:** Violates **Quantity** (withholds key fact *it's her*). Implicature: *The complaint comes from others (not me)*.
      *   **Step 4:** **Cancellable? YES!** ("...including myself" is fine, "...not me" also fine). **Particularized** (depends on context - her role/meeting purpose). **Non-Detachable?** "A few residents" / "several residents" - same implication it's *others*.
      *   **Step 5:** Looks like **Violation** (sneaky omission to distance herself). Could argue clumsy **Flouting** (vague to avoid spotlight). **🚨 Misfire Likely.**
      *   **Your Sign-off:** **Misrepresentation.** Literally true, BUT created a strong, misleading implicature ("others complained, not me") through a Quantity violation, likely intentionally. Not a flat lie, but deceptive framing.

  3.  **"I'll do my best to have this done by Friday" (Said Tue, nothing by Fri)**
      *   **Step 1:** Literally True? They *said* they'd try → **LITERALLY TRUE (unless proven they didn't try *at all*).** Move to Step 2.
      *   **Step 2:** CP? Normal promise context → **YES.** Move to Step 3.
      *   **Step 3:** **Manner** Violation? "Do my best" is inherently vague. Implicature: *It's likely/probable it will be done by Friday*. (Flouting Manner to manage expectations?).
      *   **Step 4:** **Cancellable? YES!** ("...but no guarantees"). **Particularized** (depends on task complexity, history). **Non-Detachable?** "Try my hardest" / "make every effort" - same vague implication.
      *   **Step 5:** Could be **Flouting** (vague promise to sound positive) OR **Violating** (using weasel words knowing it won't happen). **🚨 Hard to Judge Intent.**
      *   **Your Sign-off (The one you won't like):** **Unmet Expectation, NOT Breach of Said Promise.** The literal promise ("try") was kept (unless effort disproven). The strong implicature ("will likely happen Friday") was created *by you* based on context/hope, not firmly guaranteed by *their* words. "Do my best" is a classic CYA phrase. Focus on why effort failed, not the "promise." 🤔 **Judgment:** The *betrayal* is real (poor communication, unmet hope), but technically, the *literal promise* wasn't broken. Mediate the *expectation gap* for future.

  **Procedre Notes:**  
  *   **Speed:** Focus on Steps 1, 3, and 4 (Cancellability). Steps 2 & 5 are quick gut checks.
  *   **Notebook:** Scribble the statement. Note Literal T/F? Flag broken Maxims. Write the Implicature. Circle Cancellable? (Y/N). Underline your Judgment Call points (🤔).
  *   **Role:** You're the comms detective, not the judge. Your job is to *map the misunderstanding*, not assign legal blame. Say: "Based on how language works, here's where things got messy..."
  *   **Flouting vs. Violating:** Be honest: "It's really hard to know if this was deliberate deception or just poor wording. The *effect* was misleading either way."

  This won't solve every fight, but it forces people to look *at the words* and *how they were used*, not just scream "LIAR!". Good luck!
