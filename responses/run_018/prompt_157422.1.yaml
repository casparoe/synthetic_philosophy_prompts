answer: |-
  **MEMORANDUM**  
  **TO:** Student Conduct Appeals Board  
  **FROM:** [Your Name/Position]  
  **SUBJECT:** Recommendation on Jordan's Appeal & Policy Framework  
  **DATE:** October 26, 2023  

  ### **I. Summary of Jordan’s Appeal**  
  Jordan argues that their data fabrication was the inevitable result of prior causes (neurobiological, environmental, etc.), rendering "just desert" sanctions like expulsion unjustified. They propose replacing expulsion with forward-looking measures: mandatory ethics training and monitored lab access. This mirrors Gregg Caruso’s view that punishment should exclusively focus on future risk mitigation ("quarantine") rather than backward-looking blame.  

  ### **II. Taking Jordan’s Skepticism Seriously**  
  Jordan’s argument deserves engagement:  
  1. **Neuroscience & Causality**: If all actions are causally determined, retributive punishment *does* seem irrational—like blaming a tornado for destruction.  
  2. **Systemic Harm**: Expulsion may compound harm (e.g., career loss, debt) without fixing root causes (e.g., lab pressure, poor mentorship).  
  3. **Effectiveness**: Restorative approaches (e.g., ethics training) might better prevent future misconduct by addressing triggers.  

  The proposed "restorative integrity protocol" (treating misconduct as a public-health risk) aligns with this, prioritizing rehabilitation over retribution.  

  ---

  ### **III. The Case for Upholding Expulsion: A Compatibilist Reply**  
  While Jordan’s critique isn’t frivolous, Daniel Dennett’s compatibilist view offers a stronger framework for our decision:  

  #### **A. Moral Responsibility as Social Technology**  
  - **Desert isn’t about "cosmic justice"**: It’s a practical tool for maintaining trust in institutions. Academia relies on researchers being *held responsible* for truthfulness. Without sanctions proportional to violations, the credibility of research—and public trust in science—erodes.  
  - **"Caused" ≠ "Excused"**: Even if Jordan’s act was determined, they remain a *reason-responsive agent*. Grad students understand norms, data integrity, and consequences. Holding them responsible affirms their capacity to engage with reasons—a cornerstone of personhood in society.  

  #### **B. Why Expulsion Fits Here**  
  1. **Proportionality**: Fabricating data isn’t a lapse in judgment; it’s a deliberate betrayal of core academic values. Expulsion reflects the severity of harm: it jeopardizes the lab’s credibility, collaborators’ work, and future funding.  
  2. **Deterrence & Norm-Setting**: A reduced sanction signals that data fraud can be "rehabilitated" with minimal consequences. This incentivizes risk-taking by others. The message must be clear: *This institution does not tolerate dishonesty in research*.  
  3. **Victim/Community Impact**: The "victim" here is the academic community. Restorative justice works when victims can participate in repair (e.g., victim-offender dialogues). Here, the harm is diffuse and institutional—expulsion upholds the community’s integrity.  

  #### **C. The Limits of Quarantine Logic**  
  - **Risk Mitigation ≠ Justice**: Treating Jordan solely as a "risk vector" ignores their status as a moral agent. It reduces them to a malfunctioning object, undermining respect for their autonomy.  
  - **Slippery Slope**: If we reject desert entirely, *any* sanction becomes hard to justify. Why ethics training? Why not indefinite detention if risk persists? Desert provides a limiting principle.  

  ---

  ### **IV. Recommendation**  
  1. **Uphold Expulsion**: Jordan’s actions warrant sanction under our current code ("moral culpability and proportionate desert"). Compatibilism shows that responsibility isn’t negated by determinism—it’s essential for institutional trust. Reducing sanctions would undermine deterrence and normalize misconduct.  
  2. **Pilot the Restorative Protocol Separately**: Propose a task force to design/test the integrity protocol for *less severe* offenses (e.g., plagiarism, minor compliance breaches). For fraud, desert-based sanctions must remain unless/until policy changes.  
  3. **Revise the Code (Long-Term)**: Recommend a committee to review our sanctions framework. Could incorporate restorative elements for mid-tier offenses while preserving expulsion for egregious breaches like data fraud.  

  ---

  ### **V. Conclusion**  
  Jordan’s appeal rightly challenges us to scrutinize punitive traditions, but Dennett’s view prevails: moral responsibility isn’t a metaphysical myth—it’s social infrastructure we cannot discard without collapsing trust. Upholding expulsion respects Jordan as a moral agent, protects the university’s integrity, and aligns with our current code. Forward-looking reforms should be explored, but not at the expense of accountability for grave violations.  

  **Recommended Vote:** Deny Jordan’s appeal. Uphold expulsion. Support exploratory committee for code revision.
