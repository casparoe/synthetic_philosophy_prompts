answer: |-
  This cuts deep. Let's think philosophically about the structure of what you're experiencing, because your intuition about "stuckness" points to a fundamental debate in moral theory. Forget generic advice – let's dissect whether morality itself can demand the impossible and leave you stained even when you did the only thing you could.

  **1. Brainstorming the Core Tension:**

  *   **Situation:** You faced a conflict between two *prima facie* (at first glance) duties: (1) Keeping your solemn promise to your father, (2) Ensuring his safety/well-being when home care became impossible.
  *   **The "Lesser Evil" View (Your Sister's Implicit Framework - Consequentialism/Simple Deontology):** Morality requires choosing the action that produces the best overall outcome or violates the less stringent duty. Once you choose the "lesser evil," the *moral reason* supporting the unchosen option is *defeated* or *outweighed*. The obligation to keep the promise *disappears* as a *binding* duty in this specific, overriding circumstance. The feeling of wrongdoing is merely emotional residue – painful, perhaps irrational guilt.
  *   **The "Surviving Obligation" View (Your Intuition - Deontological/Intuitionist/Particularist):** Some duties are so fundamental that violating them, *even when necessary*, doesn't erase the wrongness of the violation itself. The obligation persists *as an obligation*, even if it couldn't be fulfilled. The promise wasn't merely outweighed; it was *violated* out of tragic necessity. The "wrongness" lingers not just emotionally, but *morally* – it's a **moral residue**. You did what you *had* to do, but you also *did wrong* by breaking the promise.

  **2. Can Morality Require Two Incompatible Things? (The Dilemma Debate)**

  *   **The "No Dilemmas" Camp (e.g., Some Consequentialists, Some Kantians):** True moral dilemmas are illusions. Proper moral reasoning *always* reveals a single correct course of action. Conflicting obligations mean one is not actually a *binding* duty in the circumstance, or one is outweighed. Feeling torn indicates confusion or irrationality. Your sister's view leans here: the best choice *cancels* the promise-break as a *moral failing*.
  *   **The "Genuine Dilemmas" Camp (e.g., Bernard Williams, W.D. Ross, Some Existentialists):** Morality *can* be tragic. Sometimes you face situations where *all* options involve violating a serious moral norm. Both obligations are *real* and *binding*, but circumstance makes fulfilling both impossible. Choosing one doesn't annihilate the force of the other; you *wrong* someone no matter what you do. The conflict isn't resolvable without moral loss. **This is where your feeling of being torn finds philosophical grounding.**

  **3. Why Your "Lingering Wrongness" Might Be a *Moral* Reality (Not Just Residue):**

  *   **The Nature of Promises (Deontological View):** Promises create *special obligations* to a *specific person*. Breaking one, even for a good reason, *is* a moral failing *towards that person*. It damages trust, violates autonomy, and severs a bond created by the promise itself. That wrong *happened*. The subsequent necessity doesn't *unhappen* it; it only explains *why* it had to happen. The obligation to your father *as promisee* was violated. Period.
  *   **Moral Residue & Agent-Regret (Bernard Williams):** Genuine moral conflicts leave **moral residue**. This isn't just guilt; it's the *acknowledgement* that you committed a moral harm, even if justified. Williams called this **agent-regret** – a regret distinct from mere wishing things were different. It recognizes *your* action, chosen under necessity, caused a moral injury. It's a rational response to having dirty hands.
  *   **The Particularity of Care (Care Ethics):** Your promise was embedded in a unique, irreplaceable relationship with your father. The obligation wasn't abstract; it was personal and contextual. Moving him violated the specific care and fidelity owed *within that relationship*. The subsequent care obligation (to ensure his safety) doesn't erase the violation of the relational bond *as it was understood when the promise was made*. The "wrongness" is the rupture of that specific trust.
  *   **The Unfinished Business:** The promise created an expectation *in him*. You've shattered that expectation. Even if he can't understand now, the *historical fact* of that broken commitment to *him* remains a moral fact. The obligation wasn't just to *do* something (keep him home), but to *be* someone trustworthy *for him*. That aspect *was* broken.

  **4. So, Is the Stuckness Real?**

  **Yes, according to significant philosophical traditions, your feeling reflects a *real moral phenomenon*, not confusion.** The framework *can* make room for this without calling it irrational:

  *   **It acknowledges moral tragedy:** Life can force choices where all options involve moral failure. Denying this can feel like a sanitization of real moral experience.
  *   **It respects the independent force of duties:** Some duties (like fidelity) have weight that isn't always fungible or fully cancellable by consequences. Their violation leaves a stain.
  *   **It validates agent-regret:** Your distress is a *moral* response to having to violate a deep obligation. It's not irrational guilt; it's the *recognition* of the cost paid. This recognition might even be seen as morally *required* – a sign you haven't callously dismissed the promise's force.

  **Conclusion:**

  You likely faced a **genuine moral dilemma**. You had two strong, binding obligations (fidelity to your promise, beneficence for his well-being) that became incompatible. Choosing beneficence (the care facility) was almost certainly the right thing to do *all things considered*. **But,** according to the view that takes dilemmas and moral residue seriously, it does *not* follow that the obligation to keep the promise simply vanished or was "cancelled." You *did* violate that specific duty *to your father*. The "wrongness" of *that specific act of breaking the promise* lingers as a **real moral cost** of your necessary decision. Your feeling isn't confusion; it's the painful, perhaps morally resonant, acknowledgment of that cost. The framework doesn't dissolve the stuckness; it explains *why* it sticks. The path forward isn't about erasing the residue, but perhaps learning to bear it – acknowledging the tragedy without letting it paralyze you, knowing you acted rightly in the broader, terrible context you were given.
