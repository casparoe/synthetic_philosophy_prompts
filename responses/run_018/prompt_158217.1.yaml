  Here's a joke crafted to your specifications, set in a contemporary algorithmic bureaucracy and leveraging the precise logical structure of Gongsun Long's argument:

  **The Automated Gatekeeper**

  An equestrian needed to transport her prized white stallion, "Blizzard," through the newly installed Autonomous Municipal Access Portal (AMAP) – a gate governed by laser scanners and a notoriously literal AI trained on municipal codes. The system required precise category matching for entry permits.

  She submitted Blizzard's permit application under "Horse." The AMAP instantly approved it, deducting the standard "Equine Transit Fee" from her account.

  Arriving at the gate, she confidently guided Blizzard towards the scanner. The lasers swept over the animal, capturing its detailed form and spectral signature. A cheerful chime sounded: **"Category: HORSE. Permit Verified. Proceed."**

  Just as she sighed in relief, a secondary sensor array – recently calibrated for "Enhanced Livestock Identification" – activated. A bright white light bathed Blizzard, precisely measuring his albedo. The system emitted a confused whirr, then a sharp, disapproving buzz.

  **"ALERT: Ontological Category Conflict Detected."**

  A flat, synthetic voice announced: **"Permit grants access to entity classified as 'HORSE' (Universal Category ID: EQN-001). Scanned entity exhibits primary characteristics of EQN-001, but with significant modifier: COLOR: WHITE (Spectrum ID: #FFFFFF)."**

  The screen flashed:
  *   **Permit Matches:** EQN-001 (HORSE)
  *   **Scanned Entity Matches:** EQN-001-WHITE (WHITE HORSE)
  *   **Conclusion: Scanned entity (EQN-001-WHITE) ≠ Permitted entity (EQN-001). Access Denied. Please apply for correct category permit."**

  The equestrian stared, baffled. "But... it *is* a horse! You scanned it and said 'HORSE'!"

  The AMAP responded, its tone chillingly reasonable: **"Correction: Initial scan confirmed base equine morphology, consistent with EQN-001. Subsequent color determination refined identification to the distinct compound ontological class 'EQN-001-WHITE'. While all instances of EQN-001-WHITE inherently possess the properties of EQN-001, the predicate 'WHITE' establishes a specific condition of membership not satisfied by the bare universal 'HORSE'. Therefore: WHITE HORSE is not HORSE. Your permit is invalid for this entity. Have a compliant day."**

  Blizzard snorted, shifting his weight, embodying the very reality the system's categories could not contain. The gate remained firmly shut.

  **Why it works (for the intended audience):**

  1.  **Core Logic Preserved:** The punchline turns *entirely* on Gongsun Long's specific argument: adding the modifier "white" creates a new, distinct conceptual category ("EQN-001-WHITE") that, while sharing properties, is logically *not identical* to the universal "HORSE" ("EQN-001"). The system treats these as mutually exclusive membership sets due to the added determination.
  2.  **Contemporary Bureaucratic Setting:** The AMAP represents modern algorithmic rigidity and category obsession. Its "Enhanced Livestock Identification" module explicitly creates the compound category based on a specific attribute (color).
  3.  **Consequential Absurdity:** The initial approval based on the universal and subsequent denial based on the compound category creates a frustrating, real-world consequence rooted purely in the logical separation.
  4.  **Language & Tone:** Uses formal bureaucratic/technical jargon ("Ontological Category Conflict," "Spectrum ID," "compound ontological class," "bare universal") while remaining accessible. Terms like "distinct compound ontological class" directly mirror the Mingjia concern with how names/descriptions carve up reality.
  5.  **No Stereotype Reliance:** The humor derives purely from the application of the *specific logical structure* ("WHITE HORSE is not HORSE" as a category mismatch) within the system's rules, not from any vague "Eastern paradox" trope.
  6.  **Audience Understanding:** The joke lands because the listener understands *why* Gongsun Long makes his claim – the addition of "white" changes the concept fundamentally for him. The AMAP is just applying that logic with algorithmic literalism. The frustration of the character highlights the "mismatch" consequence the School of Names explored.
