prompt: |-
  I'm teaching a unit on whether and how we should judge historical figures morally -- Jefferson owning slaves while writing about liberty, Churchill and the Bengal famine, Columbus and everything after -- and the students keep reaching for two lazy moves: "man of his time, you can't judge" versus "evil is evil, judge away". Before I let them anywhere near the actual figures I want a spec. Write the desiderata: what any adequate account of retrospective moral judgement has to be able to do to count as a serious position rather than a vibe. For each requirement give the case or consideration behind it -- e.g. whatever you say has to handle the fact that plenty of Jefferson's own contemporaries called slavery wrong (so which contemporaries count, and does he get excused if the critics were mostly foreigners or cranks?), it has to say something about people who were better than their era on one axis and awful on another, it has to distinguish judging the person from judging whether we should still name buildings after them, and it has to deal with genuine moral ignorance where arguably nobody could have known better. Which requirements are non-negotiable vs which are just one camp's preference? And the bit I care about most: are any of the plausible desiderata jointly unsatisfiable -- e.g. "judge only by standards available to them" against "our judgements should track what was actually wrong" -- because if the list itself is inconsistent that's the lecture. Finish by noting which single requirement kills off the most of the lazy heuristics my students use. Don't just score Jefferson/Churchill/Columbus at the end, I'll do that in class.
reasoning: |-
  Okay, the user is teaching a unit on judging historical figures and wants to prevent students from using lazy arguments like "man of his time" or "evil is evil." They need a set of requirements for a serious framework on retrospective moral judgment. 

  First, I need to outline the key desiderata. The user mentioned specific cases: Jefferson's contemporaries criticizing slavery, figures who were progressive in some areas but regressive in others, distinguishing personal judgment from commemorative decisions, and genuine moral ignorance. Each requirement should address these.

  The user also wants to know which requirements are non-negotiable versus optional, and if any are mutually exclusive. Plus, which single requirement undermines the lazy heuristics the most. Let me list out the essential criteria. 

  Starting with Non-Relativistic Grounding. This is crucial because morality isn't just about prevailing norms. Jefferson's contemporaries like the abolitionists show that moral truths exist beyond consensus. Next, Contemporaneous Awareness addresses the existence of critics, which challenges the "man of his time" excuse. Then, Nuanced Attribution is needed for figures like Jefferson who had both commendable and condemnable actions. Commemorative Differentiation separates judging a person from naming buildings, which is practical. Epistemic Responsibility handles cases where genuine ignorance might excuse, like early medical practices. 

  Now, the Axis Variance requirement accounts for figures who were progressive in one area but not others. Moral Progress Tracking ensures that judgments reflect historical context without relativism. Then, Motivational and Constraint Analysis considers external factors, like Churchill's wartime pressures during the Bengal famine. These might be more flexible, depending on the framework. 

  Looking for conflicts. The biggest tension is between Contemporaneous Awareness and Epistemic Responsibility. If a figure had access to critics but didn't listen, are they culpable? And if no critics existed, does that excuse them? Also, Non-Relativistic Grounding clashes with Moral Progress Tracking if not balanced carefully. 

  The user's deeper need is to teach critical thinking, moving students beyond binary views. They need a framework that exposes the complexity. The single requirement that best counters lazy heuristics is Contemporaneous Awareness because it directly challenges "man of his time" by showing that moral debates existed. 

  I should make sure the requirements are clear, with examples for each. Also, highlight the conflicting desiderata to spark discussion. The Bengal famine under Churchill is a good example where contemporaneous awareness and constraints intersect. Avoid scoring the figures since the user will handle that in class.
answer: |-
  Here’s a specification of desiderata for retrospective moral judgment, designed to force nuanced engagement beyond lazy dichotomies. Each requirement is grounded in concrete historical complexities and tagged for negotiability. Conflicts are flagged explicitly.

  ---

  ### **Core Desiderata for Retrospective Moral Judgment**  
  *(Non-negotiable: Essential for any minimally coherent account)*  

  1. **Non-Relativistic Grounding**  
     - **Requirement**: Must acknowledge objective moral wrongs (e.g., slavery, genocide) as wrong *regardless of era*, while recognizing historical context shapes culpability.  
     - **Case**: Slavery was always a profound harm; its wrongness isn’t erased because many endorsed it.  
     - *Kills heuristic*: "Man of his time" as blanket absolution.  

  2. **Contemporaneous Awareness**  
     - **Requirement**: Must account for critics and alternative views *within the figure’s era*. Absence of universal consensus ≠ absence of moral knowledge.  
     - **Case**: Jefferson owned slaves despite Quaker abolitionists, Enlightenment critiques (e.g., Condorcet), and enslaved people’s own resistance (e.g., Phillis Wheatley).  
     - *Kills heuristic*: "Nobody knew better" as default.  

  3. **Nuanced Attribution**  
     - **Requirement**: Must separate *assessment of character* (e.g., hypocrisy, malice) from *evaluation of actions*, and both from *systemic/structural influences*.  
     - **Case**: Churchill’s racist views (character) vs. British imperial policy (structure) vs. his specific decisions exacerbating the Bengal famine (action).  

  ---

  ### **Contextual Desiderata**  
  *(Negotiable: Refine analysis but frameworks may prioritize differently)*  

  4. **Axis Variance**  
     - **Requirement**: Must handle figures who were morally progressive on some issues (e.g., Jefferson on religious freedom) and regressive on others (e.g., slavery).  
     - **Case**: Gandhi’s anti-colonialism vs. his early racist views in South Africa.  

  5. **Moral Progress Tracking**  
     - **Requirement**: Must explain *why* certain wrongs became widely visible later (e.g., shifting epistemologies, marginalized voices entering discourse).  
     - **Case**: Columbus’s enslavement of Taíno people was condemned by friars like de las Casas in the 1500s—but broader recognition required centuries of anti-colonial thought.  

  6. **Motivational and Constraint Analysis**  
     - **Requirement**: Must weigh feasible alternatives, pressures, and intentions *without* conflating explanation with excuse.  
     - **Case**: Churchill’s wartime scarcity vs. his refusal to divert aid to Bengal. Does "winning the war" justify famine?  

  ---

  ### **Practical/Political Desiderata**  
  *(Crucial for application but often contentious)*  

  7. **Commemorative Differentiation**  
     - **Requirement**: Must distinguish *moral evaluation of a person* from *commemorative decisions* (e.g., statues, place names). Latter involves weighing historical impact vs. ongoing harm.  
     - **Case**: Celebrating Columbus for transatlantic exchange vs. honoring Indigenous genocide victims.  

  8. **Epistemic Responsibility**  
     - **Requirement**: Must address *genuine* moral ignorance (where criticism truly didn’t exist or was inaccessible) differently from *willful* ignorance.  
     - **Case**: A 15th-century farmer believing witchcraft is real vs. Jefferson reading abolitionist tracts yet expanding slavery.  

  ---

  ### **Key Tensions and Inconsistencies**  
  - **Primary Conflict**:  
    - **Contemporaneous Awareness** (judge by era-accessible standards) vs. **Non-Relativistic Grounding** (judge by objective wrongs).  
    - **Why inconsistent?** If we *only* use contemporaneous standards, we excuse Jefferson because "most elites owned slaves." If we *only* use objective standards, we ignore why moral progress unfolds unevenly.  
    - **Resolution path**: Culpability hinges on *access to critique* and *capacity to act*. Jefferson had both; a 9th-century Viking raider likely did not.  

  - **Secondary Conflict**:  
    - **Motivational and Constraint Analysis** (mitigates blame) vs. **Non-Relativistic Grounding** (wrongs remain wrong).  
    - **Case**: Churchill’s "wartime necessity" doesn’t negate the wrong of the Bengal famine, but may affect *degree* of personal condemnation.  

  ---

  ### **The Heuristic-Killer Requirement**  
  **Contemporaneous Awareness** does the most damage to lazy arguments:  
  - Obliterates "man of his time" by revealing era-specific moral critics (e.g., 1700s abolitionists).  
  - Undermines "evil is evil" by forcing engagement with *why* some wrongs were visible (slavery) and others obscured (sexual violence in colonial conquests).  
  - **Example**: Jefferson’s slaves were his "contemporaries" too—their moral understanding matters as much as French philosophers'.  

  ---

  ### **Why This Framework?**  
  It forces students to confront:  
  1. **Power**: Whose voices were heard/ignored in that era?  
  2. **Agency**: What choices *could* the figure have made?  
  3. **Legacy**: How do we balance historical impact against moral failures?  
  The tensions between desiderata aren’t flaws—they’re the point. **History is messy; judgment requires holding multiple truths at once.** Start here, *then* apply to Columbus.
