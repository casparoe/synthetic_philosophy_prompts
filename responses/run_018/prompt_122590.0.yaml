  Their proposed communication solution is clever but brittle. Full likelihood ratio reporting would indeed prevent cascades... in theory. The practical failures they intuit are spot-on: correlated signals are the silent killer (e.g., if early signals share bias), and strategic reporting could distort things. Also, assuming common knowledge of q is wildly optimistic—people notoriously misjudge their own signal quality. Might mention that even with honest reporting, correlation alone can cause overconfidence.

