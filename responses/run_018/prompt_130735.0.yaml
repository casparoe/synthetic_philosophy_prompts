  3. **Failure Marks and Anecdotes**: Franklin documents his failures (e.g., checkmarks for lapses, the anecdote about struggling with Order) and explicitly states he never achieved perfection.

  4. **Printing Language**: Franklin uses printing and typesetting metaphors throughout the project’s description (e.g., "errata," "correcting editions," "perfect title-page," "morally impossible as a bookseller to avoid errors in a title-page").

  5. **Improvement as Process**: Franklin frames moral improvement as an ongoing process, using iterative language (e.g., the analogy of weeding a garden gradually).

