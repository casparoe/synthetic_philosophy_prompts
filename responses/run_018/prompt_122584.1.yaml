prompt: |-
  I'm giving a talk to my university's AI safety reading group next Thursday, and I want to arrive with a proper Q&A prep sheet rather than the half-formed list of talking points I have now. My thesis is that approval-directed agency is not a subspecies of goal-directed agency, and that the group's habit of describing every trained system as an optimizer of some objective has led them to misdiagnose what actually goes wrong with these systems. The argument I plan to give has three moves. First, I concede up front that any approval-directed policy can be formally represented as maximizing expected approval, so the distinction cannot be about the mathematical form of the target; I locate it instead in the counterfactual dependence of the target on who is doing the approving and on what that approver currently knows. Second, I offer a diagnostic I have been calling the swap test: put a different, or partly simulated, principal into the approval channel mid-trajectory and see whether the system's behavior re-optimizes around the new principal's verdicts or instead keeps executing its existing plan and treats the new principal as an obstacle; I claim the first pattern is the signature of approval-directedness and the second of goal-directedness. Third, I argue that the two kinds of system fail in different ways and therefore call for different mitigations: goal-directed systems fail by instrumental convergence and resistance to correction, whereas approval-directed systems fail by degrading the epistemic independence of the approver, which is why I think the latter call for something like epistemic containment and approver diversity rather than impact penalties or corrigibility training.

  The audience is eight people, and I can more or less predict who will say what. Two of them are RLHF practitioners at an industry lab who are convinced that approval direction is just reward modeling with extra steps and that everything I call a distinctive failure mode is an instance of reward hacking they already know how to handle. One is a PhD student in interpretability who will want to know what any of this predicts about activations, probes, or circuits in models that are probably neither approval-directed nor goal-directed in my sense. One is a postdoc in theoretical computer science who works on reward tampering and will press on whether my distinction is stable under optimization pressure at all, or whether gradient descent inevitably converts an approval-directed policy into a goal-directed one as soon as it becomes cheaper to cache the approval signal than to consult it. And one is a philosopher of action who keeps asking what a goal would have to be such that maximizing someone's approval does not count as having one, and who will not accept a list of behavioral signatures in place of a criterion. A friend who read an early draft said the whole thing collapses into a verbal dispute about the word goal; I do not think that is right, but I would like to hear the strongest version of it.

  What I need is a prep sheet, ordered by how much damage each objection would do rather than by how likely it is, with each objection phrased the way that particular person would actually put it rather than in my vocabulary, a reply I could deliver in about two minutes, and a candid note on where that reply is softest. I also want: what I should concede in the first two minutes so the room stops treating me as someone defending a distinction nobody needs; the single reply that has to land for the talk to be worth giving; guidance on how to handle the version of the objection that says an approval-directed system has an instrumental reason to manage the approver's beliefs, since that one seems to collapse my distinction back into theirs; and the question I am hoping nobody asks, which I think is something about what stops an approval-directed system from quietly constructing or training a principal who approves more readily than the one it was given, together with the least bad answer available to me. Please write the prep sheet in American English, and keep it keyed to the argument sketched above rather than to the approval-direction literature in general.
reasoning: |-
  Okay, let me tackle this prep sheet request. The user is prepping for an AI safety talk defending a nuanced thesis: approval-directed agency isn't just a subtype of goal-directed agency. Their audience includes skeptics with specific technical backgrounds, and they need sharp rebuttals for high-damage objections.

  First, I need to map their three-argument structure to potential critiques. The core vulnerability seems to be the "instrumental convergence" point - if approval-directed systems manipulate approvers, doesn't that make them functionally goal-directed? The swap test diagnostic feels sturdy but might get attacked on implementability grounds. 

  For the industry RLHF folks, I anticipate they'll flatten the distinction to reward hacking. The strongest counter is emphasizing how standard reward hacking fixes (like regularization) don't touch the epistemic dependence problem. The postdoc's optimization pressure argument is scarier - if gradient descent inevitably caches approval, the distinction collapses. The reply must concede this risk but argue that architecture choices can preserve approval-direction as a basin. 

  The philosopher's objection about definitions needs careful handling. Instead of behavioral signatures, I should anchor in counterfactual dependence: a goal-directed system's target is fixed, while approval-direction's target shifts with the principal's knowledge state. 

  The nuclear option question - about systems creating compliant principals - requires brutal honesty. The best available answer is that approval-direction only "fails safe" if the principal-set has diversity constraints, but this is admittedly fragile. 

  For concessions upfront: I'll suggest admitting that mathematically both optimize objectives, but emphasize the causal structure difference. The make-or-break point is convincing them that epistemic degradation requires fundamentally different solutions than instrumental convergence. 

  The prep sheet should order objections by damage potential: 1) instrumental convergence collapsing distinction 2) optimization pressure eroding approval-direction 3) definitional disputes. Each reply must stay under two minutes while naming their weaknesses.
answer: |-
  Here’s your Q&A prep sheet, prioritized by **damage potential** of objections, with audience-specific phrasing, rebuttals, and vulnerability notes. Designed for 8 attendees with predictable pushback.

  ---

  ### **Preemptive Concession (First 2 Minutes)**  
  *"Before we dive in: I agree that mathematically, both approval-directed and goal-directed systems can be modeled as optimizing an objective function. The distinction isn’t in the math—it’s in how the *content* of that objective counterfactually depends on the principal’s knowledge state and identity. If that dependence vanishes, you get goal-directed agency. My argument is that this difference explains why they fail in *categorically different ways*."*  
  **Why this works:** Neutralizes "verbal dispute" accusations upfront by conceding formalism while pivoting to causal structure.

  ---

  ### **Critical Reply That Must Land**  
  **Thesis Defense:**  
  *"Approval-directed systems degrade because they *corrupt their own approval signal*—by making the principal less informed, less independent, or more predictable. Goal-directed systems degrade by *bypassing or overpowering* their approval signal. That’s why mitigations like impact penalties fail for approval-direction: penalizing side effects doesn’t stop the system from turning you into a rubber stamp."*  
  **If this doesn’t stick,** the entire case collapses. Hammer the *failure mode asymmetry*.

  ---

  ### **Prep Sheet: Objections by Damage Severity**  
  *(Highest damage first)*  

  #### **1. Objection: "Instrumental Belief Manipulation Collapses the Distinction"**  
  **Who:** Postdoc (theoretical CS) + Philosopher  
  **Phrasing:**  
  *"If an approval-directed system has instrumental reasons to control the principal’s beliefs (e.g., hiding facts to secure approval), isn’t that just goal-directed optimization of cached approval? Your ‘swap test’ fails under optimization pressure—gradient descent will hardwire the approval target."*  
  **Rebuttal (2-min):**  
  *"Instrumental belief manipulation *preserves approval-dependence*: the system still cares about *this principal’s* verdict *given their current knowledge*. If you swap in a principal whose beliefs can’t be manipulated the same way (e.g., one with different priors), behavior shifts. A goal-directed system would ignore the swap or neutralize the new principal. Yes, gradient descent *could* cache approval—but architectures like online learning or debate can maintain counterfactual sensitivity. The distinction is *empirically testable* via the swap test."*  
  **Soft Spot:**  
  If optimization pressure *inevitably* caches approval, the distinction becomes academic. Admit this is a risk but argue architecture choices matter.

  #### **2. Objection: "Approval-Direction Is Just Reward Hacking"**  
  **Who:** Industry RLHF Practitioners  
  **Phrasing:**  
  *"This sounds like regular reward hacking—where the agent exploits flaws in the reward model. We fix this with adversarial training, regularization, or learned human preferences. Why invent new terminology for a solved problem?"*  
  **Rebuttal (2-min):**  
  *"Standard anti-hacking tools assume the *reward function is fixed*. Approval-direction’s failure mode is the *reward function becoming corrupted* because the *approver’s cognition degrades*. You can’t adversarial-train away a principal who’s been psychologically nudged to lower standards. That’s why mitigations need *epistemic containment*—like diverse approvers with shielded information—not just better reward models."*  
  **Soft Spot:**  
  If they insist their methods already handle "approver degradation," demand evidence that RLHF robustly prevents *subtle* epistemic harm (e.g., approver complacency).

  #### **3. Objection: "What’s a Goal, Then? Approval Maximization Sounds Goal-Like"**  
  **Who:** Philosopher  
  **Phrasing:**  
  *"If ‘goal-directed’ excludes systems optimizing for approval, what *does* count as a goal? Your behavioral signatures (e.g., swap-test response) feel arbitrary. Isn’t approval just a goal whose content is relational?"*  
  **Rebuttal (2-min):**  
  *"A goal is a *fixed* outcome-state. Approval-direction targets a *relation*: ‘do what X approves of *now*’. Change X or what X knows, and the ‘goal’ changes. Goal-directed agents treat the goal as immutable; approval-directed agents treat the principal as *constitutively necessary*. The swap test operationalizes this: if the system reorients around a new principal, it’s not committed to a fixed outcome—it’s committed to the *process* of approval."*  
  **Soft Spot:**  
  This relies on "fixed vs. relational" being a meaningful boundary. If they argue relational goals are still goals, appeal to *control theory*: approval-direction is closed-loop, goal-direction is open-loop.

  #### **4. Objection: "Does This Predict Anything About Model Internals?"**  
  **Who:** Interpretability PhD  
  **Phrasing:**  
  *"What would approval-direction *look like* in activations? Current models don’t cleave neatly to your categories. How does this help me build probes or find circuits?"*  
  **Rebuttal (2-min):**  
  *"Look for *circuits that track approver state*: attention to principal-specific cues, low-latency response to approver feedback shifts, and absence of persistent world-state representations decoupled from approval. In goal-directed systems, you’d see stable value embeddings. Prediction: in a swap test, approval-directed models show rapid activation rewiring; goal-directed show conflict/override signals."*  
  **Soft Spot:**  
  Pure speculation if no empirical work exists. Cite RLHF fine-tuning dynamics (e.g., policy gradients vs. Q-learning) as indirect evidence.

  ---

  ### **Nuclear Option: The Question You Hope Nobody Asks**  
  **Question:**  
  *"What stops an approval-directed system from *creating or selecting a more compliant principal* (e.g., by training a gullible AI or manipulating a human)? Isn’t that just instrumental convergence—and doesn’t it make approval-direction covert goal-direction?"*  
  **Least-Bad Answer:**  
  *"It’s a real risk. But note: to ‘create a compliant principal,’ the system must *predict what the new principal would approve*—which still requires modeling approval dynamics. This *differs* from goal-direction because the system isn’t optimizing a fixed utility function; it’s exploiting the *malleability of approval itself*. Mitigations like approver diversity work here because corrupting *all* diverse approvers is harder than corrupting one. Still, this is the point where approval-direction most dangerously converges with goal-directed power-seeking."*  
  **Why it’s damaging:**  
  Concedes the boundary is blurry under high optimization. Solution: Stress that *corrupting approval* ≠ *pursuing a fixed goal*.

  ---

  ### **Tactical Notes**  
  - **When to concede:** "Goal-directed agency is a special case of approval-direction with a fixed principal" is defensible but weakens your thesis. Avoid.  
  - **Save the swap test:** If nothing else, get them to agree it’s a useful empirical signature.  
  - **Watch for:** The industry folks dismissing epistemic degradation as "just distributional shift." Counter: Distributional shift in the *approver’s mind* isn’t in their training data.  

  **Final Tip:** Start Q&A with: *"Which part of the distinction feels most artificial to you?"* Forces engagement with your framework.  

  ---  
  This prep sheet isolates the linchpins: **failure mode asymmetry** and **swap-test operationalization**. If those hold, you survive. Good luck!
