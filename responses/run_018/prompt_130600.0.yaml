  ## Joint Statement: Adversarial Collaboration on Nuclear Energy in the Energy Transition

  **Parties:**
  *   **Advocate A (German-Style Rapid Exit):** Believes nuclear energy is a capital-intensive, slow-to-deploy technology incompatible with the urgency of the climate crisis and the cost-effective integration of rapidly scalable renewables. Its inflexibility hinders grid adaptation, and societal/political opposition makes it a distraction. Rapid phase-out frees resources and political capital for faster renewable deployment and grid modernization.
  *   **Advocate B (French-Style Fleet Retention):** Believes existing nuclear fleets provide massive, reliable, low-carbon baseload power essential for grid stability and decarbonization. Extending the life of existing plants is the most cost-effective and immediate way to preserve low-carbon generation while scaling renewables. Abandoning existing nuclear prematurely increases fossil dependency, emissions, and costs.

  **Preamble:** Recognizing the existential threat of climate change and the need for rapid decarbonization of the electricity sector, we engage in this adversarial collaboration. While holding fundamentally different views on the role of nuclear power, we agree on the following factual premises often obfuscated in public debate. We then clearly outline our core disagreements and identify specific, testable cruxes where our predictions diverge.

  ---

  **1. Agreed Claims (Factual Premises Both Sides Acknowledge):**

      1.  **2022 EU Generation Mix:** In 2022, nuclear power provided approximately 22% of EU electricity generation. Fossil fuels (coal & gas) provided approximately 40%. Renewables (wind, solar, hydro, bioenergy) provided approximately 38%. Significant variation existed between member states (e.g., France ~63% nuclear, Germany ~6% nuclear).
      2.  **Grid Inertia & Stability:** Maintaining grid frequency stability requires sufficient rotational inertia (historically from large thermal plants) or synthetic inertia (provided by inverters/Power Electronics). Nuclear plants contribute significant natural rotational inertia. Replacing this inertia requires specific technical solutions (grid-forming inverters, synchronous condensers, potentially dedicated storage) which incur costs not always fully captured in LCOE comparisons of new wind/solar vs. existing nuclear.
      3.  **Dispatchability Spectrum:** Dispatchability exists on a spectrum. Nuclear power plants (especially older designs) are primarily designed for baseload operation. While some modern designs offer enhanced load-following capabilities, they are generally less flexible and slower to ramp than OCGTs/CCGTs, hydro, or batteries. Their minimum stable operating level is significantly higher than zero. True "on-demand" dispatchability (like OCGTs or large hydro dams) is distinct from nuclear's "baseload with some ramping" capability.
      4.  **Cost of Extending vs. Replacing:**
          *   Extending the life of an *existing, fully depreciated* nuclear plant (post-safety review & required investments) generally has a lower *Levelized Cost of Energy (LCOE)* than building a *new* nuclear plant or equivalent new-build renewables+storage/firming *on a like-for-like MWh basis over the plant's remaining extended life*.
          *   The *marginal cost* of operating an existing nuclear plant is typically very low (fuel + O&M) compared to new-build alternatives.
          *   However, life extensions require significant upfront capital investment (safety upgrades, component replacement). These costs are real and substantial, though often less than new build.
          *   The *system-level* cost of replacing nuclear capacity is complex: It depends on the replacement mix (renewables + specific firming/storage/transmission requirements) and the timing/scarcity of grid connection points, skilled labor, and critical materials. Like-for-like MWh replacement cost is not the same as system adequacy cost.
      5.  **Integration Costs:** High penetrations of Variable Renewable Energy (VRE - wind & solar) incur increasing system integration costs (balancing, grid reinforcement, storage, backup firm capacity). These costs are non-linear and rise significantly as VRE share approaches and exceeds 50-70% of annual generation, depending on grid characteristics. Both nuclear phase-outs *and* high VRE integration drive this need for firm capacity/investment.
      6.  **Timelines Matter:** New nuclear power plant construction (Gen III+) in Western democracies routinely faces significant delays (10-15+ years from planning to operation) and cost overruns. Utility-scale solar and wind farms can be deployed much faster (1-5 years). Major grid reinforcements and large-scale long-duration storage deployment also face significant lead times and uncertainties.

  ---

  **2. Core Disagreements (Phrased as Each Advocate Would Endorse):**

  | Disagreement Area               | Advocate A (Rapid Exit) Position                                                                                                                                 | Advocate B (Fleet Retention) Position                                                                                                                                 |
  | :------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Role in Climate Solution**    | Nuclear's high capital intensity, long lead times, and inflexibility make it a poor climate solution. It crowds out faster, cheaper, more flexible renewable deployment and diverts critical capital and political focus from scalable, rapidly deployable solutions needed *now*. | Existing nuclear provides massive, proven, dispatchable low-carbon baseload. Extending plants is the most immediate and cost-effective large-scale decarbonization lever available. Abandoning it prematurely forces reliance on fossil fuels during the transition, increasing emissions and costs. |
  | **Post-Exit Stability (e.g., Germany)** | Germany's grid stability following its nuclear phase-out, despite challenges, demonstrates that sufficient grid management, interconnection, demand response, and deployment of renewables/flexible gas can maintain reliability without nuclear baseload. It proves nuclear was never uniquely essential. | Germany's post-phase-out stability is achieved primarily through increased reliance on coal generation, significant electricity imports (often from nuclear/fossil grids), and flexible gas plants. This proves they replaced low-carbon nuclear with high-carbon fossils, increasing emissions and dependence on volatile gas markets, not that nuclear was unneeded. |
  | **Firm Low-Carbon Category**    | Nuclear is fundamentally different from hydro and future long-duration storage. Its multi-year fuel cycles and operational inflexibility (high minimum load, slow ramping) make it a poor substitute for truly dispatchable "firming" capacity needed alongside high VRE. It belongs in a distinct "inflexible baseload" category. | Nuclear, large hydro, and (future) long-duration storage all provide essential "firm low-carbon capacity" – the ability to generate reliably regardless of weather, crucial for system adequacy and decarbonization. Nuclear's high capacity factor and reliability make it a cornerstone of this category. Differences in flexibility are operational nuances, not categorical distinctions. |
  | **Societal Acceptance**         | Societal and political opposition to nuclear power in many democracies (like Germany) is deeply rooted in historical events, risk perception, waste concerns, and decentralized energy ideals. This opposition is a stable cultural/political fact that major policy shifts cannot overcome within relevant climate timelines. | Societal acceptance of nuclear is significantly influenced by policy framing, perceived urgency of climate action, technological advancements (SMRs, waste solutions), and energy security concerns. Public opinion can shift rapidly within an election cycle under strong leadership and changing circumstances (e.g., energy crisis impacts). |

  ---

  **3. Cruxes & Advance Predictions:**

  Each crux identifies a fundamental disagreement point. For each, we agree on a specific, observable empirical pattern relevant to the crux. We then state our *advance predictions* about what analysis of that pattern reveals, illustrating our core disagreement.

  *   **Crux 1: Is "Firm Low-Carbon Capacity" a Coherent Category Including Nuclear?**
      *   **Empirical Pattern Both Acknowledge:** Correlation between existing nuclear share (%) and grid carbon intensity (gCO2/kWh) across EU member states in the 2020-2023 period, controlling for hydro share and interconnection capacity.
      *   **Advocate A Prediction (Exit):** Analysis will show that grids with *high nuclear share but low hydro* (e.g., France) have struggled to significantly reduce carbon intensity *further* during this period due to nuclear's inflexibility limiting VRE integration, while grids with *high hydro* (flexible firm capacity) show stronger correlations with lower carbon intensity regardless of nuclear share. This demonstrates nuclear's limitations as firm *firming* capacity for high VRE.
      *   **Advocate B Prediction (Retention):** Analysis will show a strong *negative* correlation between nuclear share and carbon intensity. Grids with significant nuclear fleets consistently show *lower* carbon intensity than comparable grids without nuclear. Hydro availability is a positive factor but independent; nuclear provides the bulk of firm low-carbon MWh. This confirms nuclear's essential role in the firm low-carbon category enabling deep decarbonization.

  *   **Crux 2: Is Societal Acceptance of Nuclear Static or Dynamic?**
      *   **Empirical Pattern Both Acknowledge:** Change in public opinion polls (specifically net support: % support minus % oppose) for nuclear energy in Germany and France over the period 2021 (pre-energy crisis) to 2023 (post-energy crisis).
      *   **Advocate A Prediction (Exit):** Analysis will show minimal net change in German public opinion (e.g., <5% net shift), reflecting deeply entrenched opposition resistant to short-term crises. French opinion may show fluctuation but remains within its historically higher band. This demonstrates societal acceptance as a stable, culturally determined variable resistant to rapid policy-driven change.
      *   **Advocate B Prediction (Retention):** Analysis will show a significant positive net shift in public opinion in *both* countries (>10% net increase), particularly in Germany, driven by the energy crisis and heightened focus on energy security/climate urgency. This demonstrates societal acceptance as a dynamic variable significantly influenced by policy framing and external events within a short timeframe.

  ---

  **Conclusion:** This statement clarifies the genuine common ground on often-overlooked technical and economic realities while precisely delineating our fundamental disagreements. By registering advance predictions on specific empirical cruxes, we commit to evaluating future evidence against our stated positions. We agree that resolving these cruxes empirically is critical for designing optimal decarbonization pathways.
