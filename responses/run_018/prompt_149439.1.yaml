prompt: |-
  hey so im a backend engineer who mostly lives in event sourcing land -- aggregates, command handlers, immutable logs, idempotency keys, that whole thing where causation in our stack is basically correlation plus whatever audit trail we decide to enforce. I'm taking this philosophy of religion course and we just read Al-Ghazali's occasionalism, specifically his argument that fire doesn't actually burn cotton: God creates the blackness and separation directly, and the fire being there is just an occasion (sabab) not a real cause.

  Can you restate Al-Ghazali's position in my vocabulary? I mean the full thing: created things have no necessary causal powers, every particular event is directly authored, and there's a hard distinction between occasion and true cause. Don't just tell me God is the database admin -- actually map it onto distributed transactions, aggregate roots, message queues, whatever fits. Then give me the residue report: which parts translate cleanly (maybe nodes don't have intrinsic power to change other nodes?), which parts have to be fudged, and which parts have no counterpart in distributed systems at all? I'm especially wondering about his claim that the occasion contributes literally nothing -- does my framework smuggle in contribution by default? Tell me whether the leftover stuff means my vocabulary is missing something important, or if occasionalism is relying on assumptions that just don't apply outside theology. And please answer in American English -- I need this for a study group tomorrow and my notes are a mess.
