  Dr. A. might say that the language becomes living when there is a community using it for daily communication, especially when children are acquiring it. The exact number might not be fixed, but when it reaches a level comparable to Case 3 (41 fluent) or even Case 2 (5,000 elderly), it is living.

  In X, in 2009, the language started being used daily at home. The panel is assessing the current state (as of now). So at the time of assessment (with 62 daily users and 18 children), it is living.

