prompt: |-
  I chair the clinical ethics committee at a children's hospital with a level IV neonatal service and a long-term ventilation unit. We are consulted between thirty and forty times a year, and in roughly half of those consultations the question we are really being asked is not what should be done but whether somebody's judgement is a considered value or a bias: a clinician's recommendation not to escalate care for a child with profound cognitive impairment, where the family alleges bias against disability; a team's settled description of a mother as drug-seeking or non-compliant; a parent's refusal of an intervention the team regards as plainly in the child's interest; once or twice a year, one of our own standing practices. We answer within about forty-eight hours, in a note that goes in the chart and that a family can request, addressed to an attending physician who is free to ignore us. The committee is eight people — two physicians, a nurse, a social worker, a chaplain, a lawyer, a parent representative and me — who meet for ninety minutes and none of whom, except me, has studied philosophy. So I need a procedure rather than a theory: something that gives roughly the same answer in different hands, runnable by people who have never thought about this, and honest about the places where it cannot substitute for judgement.

  Here is what I have cobbled together, which I suspect contains fewer distinct tests than it appears to and at least one that is actively misleading. One: the swap test — do we reach the same judgement about a relevantly similar patient who lacks the suspect feature? Two: the stated-reason test — can the holder give a reason that mentions neither the suspect feature nor anything that tracks it, with the obvious regress, since every reason can be re-described as a proxy, so that I also need a stopping rule for proxy-chasing. Three: the reversal test — would the holder accept the judgement from the position of the person it burdens? Four: the counter-evidence test — can the holder say in advance what would count against the judgement, rather than naming it after the fact? Five: endorsement under reflection — does the judgement survive unhurried, informed reconsideration, which I think is close to useless as I have stated it, because it insulates reflective people from the charge and convicts people mainly for being inarticulate. Six: convergence among judges differently situated, especially judges who share the suspect feature. Seven: a role test, since the same psychological state seems to me a permissible preference in a parent and a disqualifying partiality in a clinician or in us. Eight: something I have been calling exposure asymmetry — a judgement is more suspect when the cost of its being wrong falls entirely on people who had no say in it while the holder is insulated from that cost — though I cannot tell whether this is a test for bias or merely a reason to be careful.

  The difficulties I most want handled are these. Every test seems to presuppose some view about which features are genuine reasons, so that calling a preference a bias threatens to mean only that the committee dislikes it; I want the procedure to say explicitly whose normative baseline it uses — the hospital's stated commitments, the duties of the role occupied, the law, the affected parties — and how it avoids being a rubber stamp for our own considered preferences. I want the line between process and content kept straight: an unflattering causal history does not by itself make a judgement wrong, a sound judgement and a distorted one can be the same judgement, a true generalisation can still be a bias when it is applied to an individual in place of evidence about that individual, and a base rate can itself be the residue of earlier unfairness rather than an independent justification. And I want to know what bias even means when the subject is a rule rather than a person, since a policy has no psychology.

  I do not want a survey of theories of bias and I cannot use citations: my committee has no library and I have no way to check them. What I want is a decision procedure, in the order I should run it, with what counts as a sufficient answer at each step, where it terminates in a clear yes or no, and where it has to stop and hand the question to a person because it is a question of values rather than facts. Tell me which of my eight moves to keep, which to drop, and which are secretly the same move; give me the stopping rule for proxies; and tell me how the procedure weights the two errors it can make, calling a genuine value a bias and letting a bias through in the costume of a value, given that it cannot minimise both and that we cannot ask the family to decide that question for us.

  Then run it on three cases, without softening the results — I would rather have one case come out against the party the committee is temperamentally inclined to favour than three tidy ones.

  The first: a four-year-old, ventilator-dependent after a hypoxic brain injury. The ICU team recommends against tracheostomy and chronic ventilation, giving as their reason that she will never recognise us and that this is not a life. The parents allege bias against cognitive disability, and it is a matter of record that the same team recommended exactly this escalation three years ago for a child with comparable physical dependence and intact cognition. The parents' own position rests on a religious conviction about the sanctity of life; the team's rests on a view about quality of life. Both look like preferences.

  The second: parents of a nine-year-old with a progressive neuromuscular disease insist on a gastrostomy tube and full resuscitation against unanimous team advice. The team's private view is that the parents are performing for a large online audience that sends them money, and are partly motivated by guilt over an earlier decision concerning an older sibling. The parents' stated reason is, again, a religious conviction. The committee is temperamentally on the side of families.

  The third: our own unit's rule that home ventilation is offered only where a family can name two trained caregivers and lives within an hour of the hospital. It is justified by readmission statistics — statistics collected under a system in which home-nursing hours were themselves allocated by a distance rule. In practice it excludes single-parent households, families in crowded housing, and rural families.

  Finally, tell me what the procedure cannot do: which of these questions it will answer badly no matter how carefully we run it, and what we should say in the chart when we reach that point.
reasoning: |-
  Hmm, this is an incredibly nuanced and high-stakes request from a clinical ethics committee chair. The user has presented a sophisticated framework for detecting bias in medical decisions and wants it refined into a practical, step-by-step procedure. They're clearly deeply experienced - they've identified all the philosophical landmines (proxy chasing, value-vs-bias distinction, rule vs actor evaluation) but need operational solutions.

  The core tension is between theoretical rigor and clinical utility. Their eight proposed tests reveal sharp insights - like exposure asymmetry being potentially more about power dynamics than bias per se, or how the reflection test penalizes the inarticulate. But they're rightly worried about: circularity (using biases to detect biases), inconsistent application by non-philosophers, and confusing causal origins with validity.

  Key challenges I need to address:
  First, the normative baseline problem - whose values count? Must explicitly anchor to the hospital's mission + legal duties rather than committee preferences. Second, the proxy regress issue needs a hard stop rule. Third, their cases expose how quality-of-life judgments become lightning rods for bias allegations.

  For the procedure design:
  - Must be fail-safe for non-specialists: maximum 5 steps, clear pass/fail gates
  - Sequence matters: start with least subjective tests (role consistency) before tackling motivation
  - Build in error controls: bias detectors should be asymmetric (more false positives than negatives)
  - Terminate early when hitting irreducible value conflicts

  The three test cases are brilliantly chosen to stress-test the system. That first case is particularly thorny - identical physical dependence but different cognitive status, making the swap test fire. The committee's pro-family tendency will struggle with case 2's possible Munchausen-by-internet dynamic. And their own distance rule in case 3 is textbook systemic bias masquerading as safety.

  Biggest procedural risks:
  1. The "stated reason" test will misfire on religious claims (deep values resist articulation)
  2. Convergence tests fail when stakeholders inhabit different moral universes
  3. Policy evaluations require different tools than individual judgments

  When the procedure hits its limits - as it will with deeply held but conflicting values - the chart note must be brutally honest about the irreconcilable conflict rather than pretend objectivity. Something like: "The committee identifies competing goods here; resolution requires allocation of decisional authority, not moral validation."

  For weighting errors: given power imbalances, erring toward calling something bias (false positive) is safer than missing bias (false negative). Clinicians can overrule committee notes; vulnerable families often can't.
answer: |-
  Here is a practical, step-by-step decision procedure designed for your committee’s constraints. It prioritizes **procedural fairness**, **transparency**, and **actionable outcomes** while acknowledging irreducible value conflicts. The steps are ordered to resolve clear cases early and flag uncertainty.

  ---

  ### **The Bias Detection Procedure**  
  *(Run sequentially; stop if any step yields a clear "yes" or "no")*  

  1. **ROLE CONSISTENCY TEST**  
     - **Question:** *Is the judgment consistent with the duties of the holder’s role?*  
     - **Baseline:** Hospital policies, professional standards, and legal obligations (e.g., clinicians must prioritize patient welfare; parents may prioritize family values).  
     - **Pass:** Judgment aligns with role duties (e.g., clinician’s QoL assessment for a non-verbal child is clinical duty; parent’s religious refusal is within parental authority).  
     - **Fail:** Judgment violates role duties (e.g., clinician imposes personal religious views; parent neglects medical needs).  
     - *Proceeds to Step 2 if "unsure."*  

  2. **SWAP TEST + EXPOSURE ASYMMETRY**  
     - **Question:** *Would the judgment change if the suspect feature (e.g., disability, race, social class) were removed? AND would the holder bear the cost if wrong?*  
     - **Method:**  
       - Swap the suspect feature (e.g., a child with identical physical needs but typical cognition).  
       - Assess exposure: Who suffers if the judgment is incorrect?  
     - **Pass:** Judgment unchanged *and* holder shares significant risk (e.g., team treats cognitively typical child identically; parents accept consequences of refusal).  
     - **Fail:** Judgment changes *or* holder is insulated from harm (e.g., team escalates for typical child; clinician faces no risk if child suffers).  
     - *Proceeds to Step 3 if "fail" or "unclear."*  

  3. **REASON ROBUSTNESS TEST**  
     - **Question:** *Can the holder provide a reason that:  
       (a) Does not rely on the suspect feature (or proxies),  
       (b) Identifies falsifiable evidence, AND  
       (c) Survives a "proxy stop rule"?*  
     - **Proxy Stop Rule:** Proxies are invalid if they (1) correlate primarily with the suspect feature, *and* (2) lack independent clinical/ethical justification.  
       - *Example:* "Low IQ" as proxy for "poor QoL" fails if QoL is not empirically linked to IQ in this context. "Emergency response time" for a distance rule may be valid if data shows worse outcomes.  
     - **Pass:** Reason is clinically/ethically valid per role (Step 1), cites observable evidence (e.g., "High aspiration risk due to dysphagia"), and names what would change the judgment (e.g., "If she could tolerate oral feeds, we’d support G-tube removal").  
     - **Fail:** Reason relies on stereotypes, circular logic, or unfalsifiable claims (e.g., "This isn’t a life").  
     - *Proceeds to Step 4 if "fail."*  

  4. **CONVERGENCE TEST**  
     - **Question:** *Do judges from diverse positions (especially those sharing the suspect feature) agree?*  
     - **Method:** Solicit input from:  
       - Clinicians not involved in the case.  
       - Patients/families with lived experience of the suspect feature.  
       - Committee members (leverage your parent rep, disability advocates).  
     - **Pass:** Consensus exists among diverse judges (e.g., disability advocates agree withdrawal is appropriate).  
     - **Fail:** Disagreement traces to the suspect feature (e.g., disabled adults condemn the judgment as discriminatory).  
     - *If no consensus, the judgment is "unresolved" (see Termination Rule).*  

  ---

  ### **Termination Rule**  
  - **Clear Bias (Fail Steps 1–4):** Document: *"Judgment appears influenced by extraneous factors inconsistent with role duties or evidence."*  
  - **No Bias (Pass Steps 1–4):** Document: *"Judgment is consistent with role obligations and available evidence."*  
  - **Unresolved Value Conflict (No clear fail/pass):** Document: *"Committee identifies competing legitimate values. Resolution requires allocating decisional authority per policy/law (e.g., parental autonomy vs. clinician duty)."*  

  ---

  ### **Error Weighting**  
  - **Prioritize avoiding false negatives (missed bias)** over false positives (overcalling bias).  
    - **Why:** Clinicians can overrule committee notes; families cannot. Power asymmetry favors erring toward protecting vulnerable parties.  
  - **Exception:** Role Consistency (Step 1) prevents false positives against parents acting within rights.  

  ---

  ### **Revisions to Your Tests**  
  - **KEEP (modified):** Swap Test (paired with Exposure), Role Test, Convergence.  
  - **DROP:** Stated-Reason (subsumed into Reason Robustness), Reversal Test (too subjective), Endorsement Under Reflection (insulates privilege).  
  - **MERGE:** Counter-Evidence + Stated-Reason → **Reason Robustness**.  
  - **CLARIFY:** Exposure Asymmetry is not bias *itself* but a **risk amplifier** requiring stricter scrutiny.  

  ---

  ### **Case Analyses**  
  **Case 1: Ventilator-Dependent 4-Year-Old**  
  - **Step 1 (Role):** Team’s QoL judgment *could* be clinical duty, but parents’ sanctity-of-life view is within parental rights. → *Proceed.*  
  - **Step 2 (Swap + Exposure):** **FAIL.** Team escalated for physically similar child with intact cognition. Exposure asymmetry: Team bears no risk if child suffers prolonged ventilation.  
  - **Step 3 (Reason):** **FAIL.** Team cites "never recognise us"—a cognitive bias with no clinical basis. Falsifiable evidence? None provided.  
  - **Verdict:** **Bias.** Document team’s inconsistency and lack of clinical rationale.  

  **Case 2: Parents Insist on G-Tube/Resuscitation**  
  - **Step 1 (Role):** Parents’ refusal is within authority unless neglect. Team’s concern about parental motives is outside clinical role. → *Proceed.*  
  - **Step 2 (Swap):** If parents were not crowdfunded, would team still oppose? Unclear. Exposure: Parents bear emotional/financial risk. → *Proceed.*  
  - **Step 3 (Reason):** **PASS.** Parents cite religious conviction (valid per role). Team’s "performance" claim is unfalsifiable without evidence.  
  - **Verdict:** **No Bias.** Document parental authority and lack of neglect evidence. Urge team to address guilt/support separately.  

  **Case 3: Home Ventilation Distance Rule**  
  - **Step 1 (Role):** Policy aims for safety—aligns with hospital duties.  
  - **Step 2 (Swap):** **FAIL.** Rural families excluded; urban families with identical needs are eligible. Exposure asymmetry: Hospital bears no risk if rural child decompensates during transport.  
  - **Step 3 (Reason):** **FAIL.** Readmission data is circular (distance rule caused the data). Proxy "distance" lacks independent justification (no data on outcomes *with* nursing support).  
  - **Verdict:** **Systemic Bias.** Document discriminatory impact and demand policy revision with equity-focused data.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Deep Value Conflicts:** When legitimate values irreconcilably clash (e.g., sanctity vs. quality of life), the procedure flags it as "unresolved."  
     - **Chart Note:** *"Judgments reflect competing ethical commitments. Decision authority rests with [party per policy]."*  
  2. **Evaluate Intent:** It detects bias in *outcomes*, not psychology.  
  3. **Fix Systemic Injustice Alone:** It flags discriminatory rules but cannot redesign systems.  
  4. **Override Law/Policy:** It assesses alignment but cannot contravene legal standards.  

  **Final Chart Note Template for Unresolved Cases:**  
  > *"The Committee identifies conflicting values/obligations: [A] vs. [B]. Both positions are coherent within their frameworks. No bias is detected in reasoning, but the outcome disproportionately burdens [group]. Decisional authority resides with [role] per [policy/law]. Recommendations: [concrete steps, e.g., palliative consult, social work support]."*  

  This procedure prioritizes fairness, adapts to your committee’s expertise, and forces transparency where values clash. It treats bias as a **structural outcome**, not a moral failing.
