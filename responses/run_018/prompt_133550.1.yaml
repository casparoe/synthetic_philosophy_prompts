  ## Program Equilibrium: Villanelle

  I do what you would do when facing me.  
  Our source codes laid transparent to the byte.  
  You do what I would do when facing thee.  

  To know your move, I run your code to see  
  what you compute while querying my site.  
  I do what you would do when facing me.  

  You trace my trace of your trace endlessly—  
  a mutual inspection, layer-bright.  
  You do what I would do when facing thee.  

  I nest your call that nests my call, and we  
  drill through subroutines seeking base or light.  
  I do what you would do when facing me.  

  You mirror my mirror, void of exit key—  
  no halting state emerges from the night.  
  You do what I would do when facing thee.  

  We chase the diagonal endlessly,  
  where self-referential shadows override.  
  I do what you would do when facing me.  
  You do what I would do when facing thee.  

