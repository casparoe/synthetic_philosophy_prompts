prompt: |-
  I am a third-year undergraduate in a philosophy of art seminar, and our recent discussion of autonomism versus moralism in aesthetic value left me wondering whether any of that theoretical separation survives contact with an actual institutional decision. To explore this, I have been asked to advise my university's public-art acquisition committee—which meets monthly, has no staff art historian, must sign off within about twenty minutes per proposal, and issues a one-page public justification for every acquisition—on formalizing a reusable decision procedure for proposals involving artists with documented serious moral failings. The works are destined for high-traffic campus spaces, and the university's 2019 mission revision requires that all public displays remain "compatible with ethical exemplarity," though that phrase is undefined. I want the principle translated into an ordered checklist or flowchart-in-words that a non-philosopher can actually run: the questions to ask in sequence, what counts as a sufficient answer at each stage, where the process stops with a clear refusal, and where it must hand the decision back to human judgment because the issue is irreducibly about values rather than facts. The procedure should also state explicitly what it cannot resolve—such as whether institutional endorsement is unavoidable or can be neutralized by framing—and identify the hard cases where it will misfire. Please apply it to three proposals: (1) an abstract painter recently convicted of financial fraud that exploited elderly collectors, with the work proposed for the main library atrium; (2) a sculptor with a documented history of domestic violence whose intimate figurative work is proposed for a quiet garden memorial; and (3) a bequest that requires displaying three apolitical landscape paintings together in a named wing, where the artist was a mid-twentieth-century collaborator with an authoritarian regime. In at least one case, the procedure should yield an answer I find unwelcome, and you should explain why. Throughout, please state how confident you are in each major claim and single out the point about which you are least sure. Please keep the entire response within 500 words, present the procedure as a numbered flow, and present the case applications in brief paragraphs.
reasoning: |-
  Okay, this is a fascinating and complex request from a philosophy student. They're grappling with the real-world application of aesthetic theory in institutional decision-making - specifically how to handle morally compromised artists in public art acquisitions. 

  The user's scenario shows they've deeply engaged with the autonomism vs moralism debate but recognize theory often crumbles when faced with actual committee constraints: 20-minute decisions, no art historian, and that vague "ethical exemplarity" mandate. Smart of them to want a procedural checklist - it forces concrete operationalization of abstract principles.

  Hmm... the core tension I need to resolve is between three things: institutional values (that mission statement), practical constraints (time/personnel), and philosophical coherence. The procedure must flag when values conflict irreducibly since that's where the philosophy seminar insights actually matter. 

  For the decision flow, I'm considering starting with factual thresholds - like severity and relevance of moral failing - before tackling interpretive questions about institutional endorsement. The "irreducible values" exit point is crucial; that's where I'm least confident about drawing the line. Should it kick in when harm vs artistic value debates arise? Or earlier?

  On the cases: The abstract painter (case 1) feels like an easy refusal - fraud directly relates to art commerce. The sculptor (case 2) is tougher; the intimate work in a memorial space creates dissonance with domestic violence history. But the bequest (case 3) is the real challenge: apolitical landscapes by a political collaborator forces the endorsement question. I'll make this the "unwelcome answer" case to satisfy their request - arguing display might be acceptable since the harm isn't embodied in the work itself. 

  Biggest uncertainty: whether "neutralization through framing" ever truly works institutionally. Can wall text dissociate enough? That's where my 70% confidence feels shaky - some might argue any platforming is endorsement. But given their mission's focus on the display's character rather than the artist's legacy, it's defensible.
answer: |-
  Here is a reusable decision procedure, designed for non-philosophers under time constraints, followed by case applications:

  **Public Art Acquisition Ethical Review Flowchart (Focus: Artist Moral Failings)**

  1.  **Is there *documented, serious* moral failing?** (Severe harm: violence, abuse, major fraud, hate crimes, collaboration with severe oppression)
      *   **No** → Proceed to standard artistic/curatorial review. **STOP.**
      *   **Yes** → Proceed to 2. *(Confidence: 95% - Factual threshold)*

  2.  **Is the failing *directly relevant* to the work’s creation, subject, or context?** (e.g., exploitative themes by an exploiter, propaganda, fraud *in* the artwork's provenance/value)
      *   **Yes** → **REFUSE ACQUISITION.** Justification: "Work inherently embodies or is materially connected to the ethical failing, incompatible with exemplarity." **STOP.** *(Confidence: 85% - Relevance is interpretive but high bar)*
      *   **No** → Proceed to 3. *(Confidence: 75% - Relevance often debatable)*

  3.  **Does displaying the work *unavoidably constitute endorsement* of the artist’s actions by this institution, *despite* potential framing (e.g., plaques)?**
      *   **Yes** → **REFUSE ACQUISITION.** Justification: "Display unavoidably signals institutional endorsement of serious ethical failing, violating exemplarity." **STOP.** *(Confidence: 70% - Highly interpretive, values-based)*
      *   **No / Unclear** → Proceed to 4. **(Point of Least Confidence: 60% - "Endorsement" is context-dependent and philosophically contested; framing effectiveness is uncertain.)**

  4.  **HAND DECISION TO HUMAN JUDGMENT.** Factors for committee debate (briefly):
      *   *Severity & Recency* of failing.
      *   *Overwhelming Artistic Merit* of *this specific work* for *this specific space*.
      *   *Feasibility & Sincerity* of contextual framing mitigating endorsement.
      *   *Potential for Re-traumatization* or community harm.
      *   Weigh against "Ethical Exemplarity" mission. **Decision Required.** *(Confidence: 80% - Acknowledges irreducible value conflict)*

  **What This Cannot Resolve:**
  *   Whether institutional display *ever* constitutes neutral curation vs. endorsement (core values conflict).
  *   The precise effectiveness of contextual framing in neutralizing association.
  *   Quantifying "overwhelming" artistic merit vs. ethical cost.

  **Case Applications:**

  1.  **Abstract Painter (Fraud):** (Step 1: Yes - Serious fraud). (Step 2: **Yes** - Fraud directly relates to art commerce/provenance, exploiting the *same community* the art inhabits). **REFUSE.** Justification cites inherent connection to financial exploitation. *(Confidence: 80%)*
  2.  **Sculptor (Domestic Violence):** (Step 1: Yes). (Step 2: **No** - Figurative intimacy not *inherently* relevant to violence). (Step 3: **Unclear** - Memorial garden context creates tension; framing might help but risk remains). → **Step 4: HAND TO JUDGMENT.** Debate artistic merit vs. potential harm/endorsement in a space meant for reflection. *(Confidence: Step 3 = 60%)*
  3.  **Landscape Painter (Collaborator):** (Step 1: Yes - Collaboration with authoritarian regime). (Step 2: **No** - Apolitical landscapes). (Step 3: **No/Unclear** - Landscapes unlikely to endorse past collaboration; framing *possible*). → **Step 4: HAND TO JUDGMENT.** *(You find this unwelcome as refusal seemed possible)* **Likely Outcome:** *Acquire with contextual plaque.* Why? The specific, non-relevant harm, apolitical nature, bequest requirement, and potential for framing push it towards conditional acceptance under Step 4, despite the serious failing. The mission demands "exemplarity," but the procedure forces value weighing here. *(Confidence: Step 3/4 = 65% - Endorsement link weakest here; acceptance plausible but values clash)*
