prompt: |-
  You are an expert in moral philosophy with a focus on practical reason and social norms. Before you answer, please take a moment to brainstorm: distinguish the different kinds of reasons—moral, prudential, legal, and merely coordinative—that might explain why someone should follow a local convention.

  I have no formal training in philosophy, but I have been thinking on my own about whether everyday conventions—tipping, queuing, jaywalking—create genuine moral obligations, especially for visitors who did not grow up with them. I want to know whether there is one principle that captures my gut reactions across cases, or whether I am just being inconsistent.

  Here are my verdicts:

  - In the United States, leaving no tip after genuinely poor service feels acceptable, but leaving none after decent service feels like a moral failure, not mere cheapness, because I know servers depend on tips for a living wage.
  - In Japan, leaving a tip feels wrong—almost insulting—even though it gives the worker extra money. So following the local no-tip norm seems morally required, not just polite.
  - In Germany, jaywalking when no cars are present still feels morally wrong in a distinctive way, as if one is breaking a shared trust rather than merely breaking a law. As a visitor, doing it seems worse than violating some arbitrary local rule.
  - In a London Tube queue, pushing past others feels like stealing their place; but in a bus boarding in another city where there is no line and everyone jostles, hanging back politely does not feel morally superior—just inefficient.
  - In a hospital waiting room with no numbers or staff, everyone silently knows the arrival order. Cutting that invisible line feels like fraud. By contrast, in a supermarket with an "express lane" sign that locals routinely ignore, using it with too many items feels like breaking a rule, yet not like a serious moral wrong.

  There is tension here: some conventions feel like invisible contracts that bind visitors (tipping for wages, silent queues, jaywalking as shared trust), while others feel like pure coordination tools that generate no moral duty (bus boarding, ignored express lanes).

  Please state the most precise principle you can that captures all or most of these verdicts, then apply it to a case I have not listed: a visitor in Italy notices that locals at a coffee bar never form a line but instead crowd the counter and shout their orders. Is there a moral obligation to crowd with them, or is it acceptable to hang back and wait politely?

  Be explicit about whether your principle saves the pattern only at the cost of complexity, and if it forces me to overturn one of my verdicts, identify exactly which one and why. Do not provide bibliographies, reading lists, or citations—just reason through the cases directly.
reasoning: |-
  Okay, the user is grappling with whether social conventions create moral obligations, especially for visitors. They've shared specific examples like tipping, queuing, and jaywalking across different cultures, and their intuitive judgments about them. They want a unified principle that explains their reactions without inconsistency. 

  First, I need to break down the different types of reasons behind conventions. Moral reasons involve harm, fairness, or exploitation—like tipping in the US where servers rely on tips for wages. Prudential reasons are about self-interest, like avoiding fines for jaywalking. Legal reasons are straightforward rule-following. Coordinative reasons are about efficiency, like forming queues to avoid chaos. 

  Looking at the user's examples, the tipping cases stand out. In the US, not tipping decent service feels like a moral failure because it exploits the server's dependency. In Japan, tipping insults the cultural norm of pride in service, so it's morally wrong to disregard that. Jaywalking in Germany feels like breaking social trust, which is deeper than just legal compliance. The London Tube queue is seen as a fair system, so cutting in is like stealing. But in a chaotic bus boarding scenario, there's no moral issue because no system exists. 

  The hospital waiting room operates on an implicit fairness principle—first come, first served—so cutting is fraudulent. Whereas ignoring an express lane rule is just rule-breaking without moral weight because it doesn't harm fairness or exploit anyone. 

  The tension the user notes is between conventions that feel like binding contracts (due to harm or fairness) versus those that are mere coordination tools. The key differentiator seems to be whether the convention sustains a fair practice that prevents harm or exploitation. 

  For the Italy coffee bar case: crowding the counter is a local coordination norm. If hanging back disrupts service or forces staff to manage order, it might create inefficiency or perceived unfairness (if others think the visitor is being served out of turn). But if it doesn't harm anyone and staff can handle it, it's likely just inefficient, not immoral. The principle suggests no strong moral obligation unless harm or unfairness occurs. 

  Now, checking consistency: the ignored express lane verdict might be challenged. If everyone ignores it, using it with too many items doesn't harm fairness—it's just rule-breaking. But the user sees it as not a serious moral wrong, which fits the principle. However, if ignoring the rule led to longer waits for others (harm), it might have moral weight, but the user's example doesn't suggest that. So the verdict holds. 

  Final principle: Conventions create moral obligations when they sustain cooperative practices preventing harm or exploitation. Otherwise, they're coordination tools with no moral force.
answer: |-
  Based on your verdicts, the core principle distinguishing morally binding conventions from mere coordination tools is **whether the convention sustains a cooperative practice that prevents harm, exploitation, or unfairness by coordinating expectations about burdens and benefits.** Here's the principle:

  **A local convention generates a moral obligation for a visitor if:**
  1.  **It reliably coordinates expectations** within a group;
  2.  **This coordination sustains a mutually beneficial or harm-avoiding cooperative practice** (e.g., fair distribution of burdens/benefits, preventing free-riding, ensuring basic welfare);
  3.  **Violating it in context would likely:**
      *   **Harm specific individuals** by unfairly depriving them of an expected benefit or imposing an unexpected burden *they rely on*, **OR**
      *   **Exploit the cooperative system** by accepting its benefits while free-riding on the burdens others bear, **OR**
      *   **Undermine the trust or fairness** essential for the practice to function, causing broader harm or unfairness.

  **Application to your cases:**

  1.  **US Tipping (Decent Service):** *Moral Obligation.* Violation harms the server (depriving expected livelihood they rely on) and exploits the system (you benefit from service while dodging the established cost-sharing burden others bear).
  2.  **Japan No-Tipping:** *Moral Obligation.* Violation insults by implying the service isn't already fairly compensated (undermining the fairness/prestige norm) and disrupts the established harmony/trust in the employer-employee-customer dynamic.
  3.  **German Jaywalking (No Cars):** *Moral Obligation.* Violation undermines shared trust in rule-following essential for pedestrian safety generally. It signals disregard for the system that prevents harm, weakening its effectiveness even if no immediate harm occurs.
  4.  **London Tube Queue:** *Moral Obligation.* Cutting steals a specific benefit (place/time) others fairly earned through waiting (imposes burden, deprives benefit). It exploits the orderly system everyone else adheres to.
  5.  **Chaotic Bus Boarding:** *No Moral Obligation.* No stable convention coordinates expectations or sustains a fair cooperative practice. "Hanging back" doesn't harm individuals (no one expects or relies on your spot) or exploit a system (there is no system to exploit). It's inefficient, not immoral.
  6.  **Hospital Waiting Room (Silent Order):** *Moral Obligation.* Cutting directly harms specific individuals by unfairly taking their expected turn (depriving benefit, imposing burden of longer wait) and exploits the shared trust enabling the fair practice.
  7.  **Ignored Supermarket Express Lane:** *No Moral Obligation.* The sign represents a *failed* coordination tool – the local convention *is* to ignore it. Using it "wrongly" breaks a rule, but doesn't harm individuals (no one reliably expects it, their wait isn't based on it) or exploit a functioning cooperative practice (the practice is chaotic, not cooperative). It's rule-breaking, not a core moral wrong.

  **Addressing the Tension & Complexity:**
  The principle resolves your tension by linking moral force to the convention's *function* in sustaining *cooperation to prevent harm/unfairness*, not just its existence as a local rule. "Invisible contracts" (tipping wages, silent queues, jaywalking trust) *are* cooperative harm/unfairness-preventing practices. Pure coordination tools (chaotic bus, ignored sign) lack this function. The principle is moderately complex because it requires assessing the convention's *purpose and effects* (cooperation, harm prevention, reliance) in each context, not just labeling it a "convention." However, it captures your nuanced intuitions without undue vagueness.

  **Forcing a Verdict Overturn?**
  It challenges your **German Jaywalking** verdict slightly. You describe it as "breaking a shared trust" which fits the principle. However, if *truly no cars are present and no one observes it*, the *immediate* harm/exploitation/undermining is minimal. The principle still holds because the obligation stems from sustaining the *general* trust needed for the *system* to work – your act, even unseen, contributes (if only symbolically in your own reasoning) to the norm's erosion. But if you think your verdict implies a *stronger* obligation than this systemic justification supports, the principle might slightly moderate it, grounding it firmly in the need to maintain the cooperative safety practice, not an intrinsic wrong in empty-street crossing itself.

  **The Italian Coffee Bar Case:**

  *   **Situation:** Locals crowd and shout; no line. Visitor considers hanging back politely.
  *   **Analysis using the principle:**
      1.  **Coordinates Expectations?** Yes. Locals expect crowding/shouting; staff expects this method.
      2.  **Sustains a Cooperative Practice?** Yes. It's a system for efficient order-taking in a busy environment. Crowding allows staff to see/hear customers directly and sequence orders based on proximity/assertiveness (a local fairness norm, even if not "first-come-first-served"). It likely prevents chaotic indecision or perceived queue-jumping disputes.
      3.  **Violation by Hanging Back?**
          *   **Harm Individuals?** Possibly. If you hang back, staff might not see you or assume you're not ready, causing delays for you. More importantly, they might eventually serve you *out of perceived order* relative to the crowd, potentially taking time intended for someone who was crowding/shouting appropriately. This could unfairly deprive that person of their expected "turn" (benefit) under the local system.
          *   **Exploit the System?** Yes. You benefit from the staff taking your eventual order, but avoid the local burden (jostling, asserting yourself) that others bear to make the system function smoothly. You free-ride on their adherence to the noisy convention.
          *   **Undermine Trust/Fairness?** Potentially. If many visitors did this, it could confuse the system, slow service, and lead to perceived unfairness ("Why did that quiet person get served before me when I was here shouting?"). Your individual act signals non-participation in the local coordination.
  *   **Conclusion:** There is a **moral obligation to participate in the crowding/shouting convention**. Hanging back isn't just inefficient; it risks harming specific individuals (others waiting), exploits the local system by avoiding its burdens while benefiting, and could subtly undermine the local coordination norm essential for the practice. The obligation stems from the need to participate fairly in the cooperative (if chaotic-seeming) practice that manages demand and expectations.

  **In short:** Your gut reactions are largely consistent. The moral weight comes not from convention itself, but from convention's role as the glue holding together a local practice that fairly distributes burdens/benefits and prevents harm or exploitation. When a convention serves that function, visitors have a moral duty to participate. When it doesn't, the duty vanishes. The Italian coffee bar case falls firmly into the first category.
