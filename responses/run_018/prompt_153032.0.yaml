answer: |-
  Start by grounding them in Hofstadter’s core premise: analogy isn’t just mapping fixed concepts but relies on fluid concepts that reconfigure under contextual pressures. This must be established first—without it, they’ll misinterpret slippage as mere linguistic sloppiness. Use a quick, visceral microdomain to demo fluidity: not letter strings, but something like "vein" in biology vs. "vein" in marble mining. Show how "carrying blood" and "carrying mineral deposits" share a skeleton of "channel for flow," but the fleshed-out meanings diverge under domain-specific pressures (e.g., valves in biology vs. fragility in geology). This primes them to see concepts as elastic structures, not rigid containers.  

  Now pivot to your digital storage case. To avoid tech-jargon dismissal, frame it as a philosophical autopsy of dead metaphors resurrected in a weightless realm. Begin with "folder": unpack its physical entailments—paper, bending, nesting—and how cloud usage preserves hierarchy but discards tactility. Then introduce "bucket": its entailments of capacity, pouring, spillage. Ask them to map pouring to data transfer—does data slosh? Overflow? The friction emerges when they try to reconcile "folder" (orderly nesting) with "bucket" (amorphous capacity) in the same cloud space. This exposes slippage: the metaphors aren’t ambiguous (they’re univocally about storage) or vague (their boundaries are clear), but their entailments war under new pressures, forcing adaptive reconfigurations like "cloud bucket" shedding spillage but retaining capacity limits.  

  Their misconceptions will arise in sequence. First, they’ll conflate slippage with ambiguity—e.g., "folder means office supplies OR cloud data." Head this off immediately after defining fluid concepts by contrasting "bank" (ambiguity: river vs. finance) with "bucket" (slippage: physical properties reconfigured, not switched). Second, they’ll mistake it for vagueness—e.g., "container is vague because anything holds something." Crush this when discussing "vault": its physical security (thick walls, weight) slips into metaphorical "encryption" in the cloud, but the entailment of immobility fights cloud data’s inherent copyability. Highlight that vagueness concerns fuzzy borders (e.g., "heap"), while slippage is about dynamic re-categorization under tension. Third, they’ll trivialize it as arbitrary language evolution. Preempt this during the vault example: point out that engineers didn’t choose "vault" randomly—it was a creative adaptation of "security," but the slippage creates real cognitive friction (e.g., "Why can’t I physically lock my cloud vault?").  

  What to refuse? Explicitly state you won’t resolve whether fluid concepts imply anti-realism about categories—that’s contested in interpretations of Hofstadter. The literature agrees slippage is creative and context-driven in microdomains, but debates whether this scales to high-level cognition. Also skip Copycat’s code-level mechanics (e.g., temperature thresholds). Say: "Today’s focus is observing slippage, not modeling minds."  

  For the check: Pose a fresh microdomain—"archive" (physical: dusty, static, decay-prone) vs. "stream" (data: real-time, ephemeral). Ask: "If I call a live video feed an ‘archive,’ where does slippage occur, and what physical entailments must drop or bend?" Correct answers identify: (1) the core "storage" skeleton retained, (2) the abandoned entailments (decay/static-ness), and (3) the creative adaptation (e.g., "archiving" redefined as instant capture). If they only see contradiction or vagueness, they’ve missed the dependency: fluid concepts enabling adaptive reconfiguration.  

  Crucially, separate settled from contested. Settled: Hofstadter’s microdomains reveal slippage as non-arbitrary, pressure-driven reconceptualization. Contested: whether slippage reflects deep cognitive architecture or surface linguistics. Present the storage case not as tech trivia but as a lived philosophical rupture—where gravity-bound metaphors float into incoherence, exposing the seams of human meaning-making.
