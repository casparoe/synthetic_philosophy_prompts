prompt: |-
  I run a two-hour session on statistical reasoning for a reading group of graduate students in the humanities: sharp, articulate, comfortable arguing, but with nothing beyond a vague memory of school-level statistics. A few days ago I spent a long evening arguing with a friend about a public-health claim. She had noticed that a study's overall numbers supported one conclusion, while splitting the data by age reversed it, and we could not agree about whether either number was the right one to believe. That argument made me want to turn this exact phenomenon—Simpson's paradox—into the session.

  Don't produce the explanation itself; produce the teaching plan for it. I need the dependency order: what has to be in place before the reversal registers as a genuine puzzle rather than an arithmetic mistake—thinking in terms of conditional versus marginal comparisons, the idea of a lurking or stratifying variable, and the way group sizes and group-specific rates combine—and in what sequence those pieces should land, and why. I want one carrying example for the whole session; tell me whether I should build a small invented dataset or lean on something like the Berkeley graduate-admissions tables or the kidney-stone treatment numbers, and what features the example must have and must avoid. Map the misconceptions I should expect from a humanities audience—for instance that the paradox shows statistics can be made to say anything, that the aggregate number is simply wrong, that the subgroup number is automatically the true one, or that the reversal is just an artifact of unequal group sizes—and tell me exactly where in the sequence to head each one off, and what to say at that point. How will I know by the end that they understand the paradox as a real structural feature of pooling rather than having merely been entertained by a counterintuitive trick? And what should I deliberately leave out or refuse to resolve at this level?

  Also, separate the settled from the contested. It is settled that an association can reverse when groups are pooled, and that this arises from the arithmetic of how the groups are weighted. It is genuinely contested, or at least not settled by the mathematics alone, how to decide which stratification is relevant in a real case, whether an observed reversal warrants a causal reading, and what "the right answer" is for any particular application. Please keep that line visible throughout the plan rather than presenting a contested methodological verdict as consensus.
reasoning: |-
  Hmm, the user is designing a teaching session on Simpson's paradox for humanities graduate students. They want a detailed lesson plan focusing on conceptual dependencies, misconceptions, and the distinction between mathematical certainty and interpretative ambiguity. 

  The user's background suggests they value intellectual rigor – they mention students are "sharp, articulate" and reference a real argument about public health data. Their frustration with that unresolved debate likely fuels the desire to teach this properly. Key needs emerging: 1) A scaffolded path from intuition to formal understanding, 2) Preemptive debunking of common statistical cynicism ("stats can say anything"), 3) Clear demarcation between arithmetic inevitability and interpretative controversy.

  For the carrying example, kidney stone data wins over Berkeley admissions because: a) Medical context avoids political distractions b) Success rates are intuitive c) Group size imbalance is visible but doesn't solely explain reversal. Must avoid examples where lurking variables imply obvious causality (e.g., gender discrimination in admissions).

  Major misconceptions to dismantle:
  - "Aggregate is always wrong" → Debunk when showing reversal
  - "Subgroups are always true" → Challenge during stratification discussion
  - "It's just a math trick" → Counter with causal diagram exercise

  The "settled vs contested" framework is crucial. I'll anchor settled aspects in arithmetic demonstrations (weighted averages, pool mechanics), while tagging contested elements with explicit warnings ("Mathematics stops here. Your disciplinary judgment begins."). 

  Assessment should force application: Give them a new dataset with ambiguous stratification options and ask which comparison they'd report to a policymaker. The struggle to justify their choice will reveal understanding depth.

  What to omit: Formal probability notation, causal calculus, multivariate extensions. The core is making them see the paradox as inherent in aggregation, not a statistical flaw.
answer: |-
  Here's a teaching plan focused on conceptual dependencies, misconceptions, and the settled/contested boundary for a 2-hour Simpson's Paradox session. Use the **kidney stone treatment dataset** (below) as your carrying example—it's unambiguous, medically intuitive, avoids socio-political distractions, and starkly shows the reversal.

  ### **Carrying Example Requirements**
  - **USE**: Kidney stone treatment data (small stones: Treatment A 93% success, Treatment B 87% success; large stones: A 73% success, B 69% success; overall: A 78% success, B 83% success).
  - **WHY**:  
    ✓ Clear reversal (A better in subgroups, B better overall)  
    ✓ Intuitive success/failure metric  
    ✓ Unequal group sizes *without* being the sole cause (large stones harder to treat, *and* more assigned to A)  
    ✗ Avoid Berkeley (gender stratification invites distracting debates about discrimination).  
  - **DATA PRESENTATION**: Start with aggregate comparison only (A: 78% vs B: 83% → "B is better?"). Reveal subgroups later.

  ---

  ### **Teaching Plan Sequence** (110 mins + 10 buffer)
  **GOAL**: Make the reversal feel *inevitable* under specific conditions, not magical.

  #### **Phase 1: Establish Intuition for Marginal Comparisons** (20 mins)
  - **Activity**: Show *only* the overall success rates (A: 78%, B: 83%). Ask: *"Which treatment would you choose?"*  
  - **Key Dependency**: Students must accept that aggregate ("marginal") comparisons are often meaningful.  
  - **Misconception Head-off**: *If* someone dismisses aggregates as "oversimplified," acknowledge but stress: *"We use summaries because full data is overwhelming. The puzzle is when this summary seems to contradict deeper truths."*

  #### **Phase 2: Introduce Stratification & Reveal the Reversal** (25 mins)
  - **Activity**: Reveal success rates by stone size (small/large). Show:  
    - Small stones: A (93%) > B (87%)  
    - Large stones: A (73%) > B (69%)  
    - Overall: A (78%) < B (83%)  
    Ask: *"Does this change your choice? Why is this jarring?"*  
  - **Key Insight**: The aggregate comparison reversed despite each subgroup favoring A.  
  - **Dependency**: Students must recognize subgroup comparisons ("conditional" rates) as legitimate.  
  - **Misconception Head-off**:  
    - ✗ *"Subgroups are automatically truer"* → Ask: *"What if we split by hospital décor color? Is that relevant? Stratification needs justification."*  
    - ✗ *"The aggregate is wrong"* → Stress: *"78% for A is arithmetically correct. The issue is whether it answers our question."*

  #### **Phase 3: Diagnose the Mechanism** (35 mins)
  - **Activity**:  
    1. **Weighting**: Calculate pooled success:  
       - Treatment A: (81/100 small stones × 93%) + (192/300 large stones × 73%) = 78%  
       - Treatment B: (234/270 small stones × 87%) + (55/80 large stones × 69%) = 83%  
       *Emphasize: Large stones (harder to treat) dominate Treatment A’s pool.*  
    2. **Lurking Variable**: Stone size affects outcome (large stones harder) *and* treatment assignment (more large stones to A).  
    3. **Visualize**: Sketch a causal diagram: Stone Size → Treatment & Stone Size → Outcome.  
  - **Key Insight**: Reversal arises from **imbalanced group sizes + differing group-specific rates + confounding variable**.  
  - **Misconception Head-off**:  
    - ✗ *"Reversal is just about unequal groups"* → Show: If success rates were equal, sizes alone wouldn’t reverse.  
    - ✗ *"Statistics can say anything"* → Retort: *"The math is fixed. The debate is about which comparison answers your question."*

  #### **Phase 4: Settled vs. Contested** (20 mins)
  - **Settled (Arithmetic)**:  
    ✓ Pooling groups *can* reverse associations due to weighting.  
    ✓ This requires a variable that affects both group allocation and outcome.  
  - **Contested (Interpretation)**:  
    ? **Which stratification is "right"?** → *"Depends on the causal question. Are you asking 'Which treatment is better?' or 'Which performed better given how it was used?'"*  
    ? **Does reversal imply causation?** → *"No. Stratifying adjusts for confounding, but only if the variable is causally relevant (not just correlated)."*  
    ? **What's the 'real' effect?** → *"No 'true' number. Aggregates answer broad queries; subgroups answer conditional ones. Context dictates."*  
  - **Activity**: Debate: *"A hospital chief says 'We use B because its overall success is higher!' A doctor replies 'But A works better for every patient!' Who is right?"*

  #### **Phase 5: Assessment & Application** (10 mins)
  - **Check Understanding**: Pose a new scenario (e.g., drug efficacy by disease severity). Ask:  
    1. *"What conditions would make Simpson’s Paradox possible here?"*  
    2. *"If you saw reversal, what would you demand to know?"* (→ Lurking variable, group sizes).  
  - **Success Signs**: Students articulate that the paradox is unavoidable under specific pooling conditions, not a "trick"; they insist on *justifying* stratifications rather than accepting all splits.

  ---

  ### **Deliberate Omissions & Boundaries**
  - **LEAVE OUT**:  
    - Causal diagrams (beyond basic arrows).  
    - Multivariate adjustments or regression.  
    - Statistical significance/testing.  
  - **REFUSE TO RESOLVE**:  
    - *"Which number should I believe?"* → *"Belief requires context. Math alone can’t tell you if stone size is the 'right' adjustment."*  
    - *"How do I find lurking variables?"* → *"Domain knowledge, not statistics. A statistician can’t tell you why stone size matters—a urologist can."*

  ### **Why This Sequence Works**
  1. **Starts with intuition** (aggregates matter) then **shatters it** (reversal).  
  2. **Mechanism before interpretation** → Makes paradox feel mathematically inevitable.  
  3. **Contested boundaries explicit throughout** → Prevents oversimplified "always trust subgroups" conclusions.  
  4. **Kidney stone example** isolates the math from emotional/political baggage.  

  The paradox becomes a lesson in *humility*: Numbers don’t lie, but their meaning depends on the question you ask—and the layers you peel back.  

  > *Final tip: When students say "So the aggregate is misleading," correct: "It’s not misleading if you care about overall performance. It’s misleading only if you interpret it as causal or context-free."*
