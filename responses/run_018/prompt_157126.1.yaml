  ## Opening Remarks: Dedication of the New MRT Clinic

  Distinguished colleagues, cherished families, generous supporters, honored guests,

  We gather today to dedicate a space unlike any other – a clinic offering Mitochondrial Replacement Therapy. This remarkable technology stands at the confluence of profound scientific ingenuity and deep philosophical currents. It allows prospective parents carrying devastating mitochondrial diseases the possibility of conceiving a child free from that suffering, by combining the nuclear DNA of the intended parents with the healthy mitochondrial DNA of a donor egg. A child conceived thus inherits genetic material from three individuals.

  Our purpose here is profound: to mark the beginning of a place offering new pathways to parenthood and the hope of healthy life. Yet, as we celebrate this potential, we must also acknowledge the profound questions woven into the very fabric of this procedure. Questions that resonate deeply with the concept of *origins*.

  Philosophers have long pondered the nature of identity and the necessity of origins. One compelling view, origin essentialism, suggests that who we are, our very identity as distinct individuals, is fundamentally tied to the specific materials from which we originate – this particular egg and this particular sperm, with their unique nuclear and cytoplasmic contributions. Under this view, altering the origin point – say, replacing the mitochondria – doesn't merely change the *health* of a potential child who would otherwise exist; it might mean a *different* potential child comes into being altogether. The child conceived *with* the donor mitochondria, according to this perspective, is not the "sick version" of a child who would have been conceived without it; they are a *different* individual, made possible only by that specific combination.

  This is not merely academic. It shapes how we understand the gift being given and the gratitude owed. If origin essentialism holds, the donor’s contribution is not akin to repairing a pre-existing entity destined for suffering. Instead, the donor provides the essential, healthy mitochondrial foundation without which *this specific child* – the one thriving, free of mitochondrial disease – could never have originated. Gratitude, then, flows not for healing a child who would otherwise be ill, but for playing an indispensable role in making *this particular child’s life possible* in its healthy form. The donor enables the *coming into being* of a child who would not exist otherwise, a child whose very identity is intertwined with that donor's mitochondrial contribution.

  **To our courageous families:** We stand with you in your profound desire for healthy children. This clinic represents a frontier of hope, a place where the devastating inheritance of mitochondrial disease can be interrupted. We offer not a promise about *who* a future child might have been under different circumstances, but the tangible possibility of *bringing into the world* a beloved child free from a specific, cruel burden. Your journey is one of love and aspiration for a healthy future for your family. This clinic is a tool dedicated to that aspiration.

  **To our expert colleagues and scholars:** We recognize the intricate tapestry you navigate – the complex biological mechanisms interwoven with profound metaphysical questions about identity, necessity, and origins. This clinic embodies a living tension: between the continuity of parental lineage through nuclear DNA and the potential discontinuity introduced by altered cytoplasmic origins. We dedicate this space not as a declaration that resolves these deep questions, but as a place where they are actively engaged, where the practical reality of new lives meets the enduring inquiry into what makes a life *this* particular life. The question of whether MRT creates a healthier version of the same child or enables a numerically different child remains open, demanding our continued humility and reflection.

  Today, we dedicate this clinic to the pursuit of healthy life. We dedicate it to the science that makes new possibilities tangible. We dedicate it to the donors whose profound generosity contributes the vital spark of healthy mitochondria, enabling new and unique lives to flourish. And we dedicate it to the families whose love and hope drive them forward. We proceed with both the excitement of possibility and a deep respect for the fundamental mysteries of origin and identity that this remarkable technology compels us to confront.

  Let the work begin.

