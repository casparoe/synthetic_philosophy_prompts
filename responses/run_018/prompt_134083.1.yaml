  For the neuroscience part, predicting choices before awareness wouldn't faze Einstein. He'd argue that responsibility never relied on contra-causal freedom but on predictability and rational self-control. Neuroscience findings support determinism, which aligns with his views. Moral responsibility stems from being a rational agent within a causal chain, not breaking physical laws. 

