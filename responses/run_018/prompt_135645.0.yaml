answer: |-
  ### Actor Mapping
  - **French Court/Audience**: Observers of exotic spectacle; gain imperial validation, entertainment, sense of superiority. Evidence: Tupinambá bodies, gestures, interpreted speech. Options: Treat as curiosity (spectacle) or engage as equals (dialogue).  
  - **Tupinambá Individuals**: Captives/guests under coercion; observe French architecture, social hierarchies, material excess. Evidence: French crowded buildings, inequality (beggars vs. rich), performative rituals. Options: Perform expected roles or risk defiance; gain survival, lose autonomy.  
  - **Montaigne**: Magistrate-philosopher; observes both parties. Evidence: Direct interaction via interpreter. Options: Condemn Tupinambá "savagery" or invert critique to target Europe. Gains intellectual insight; risks social censure.  
  - **Interpreter**: Cultural mediator; controls evidence flow. Evidence: Selective translation. Options: Faithful transmission or distortion; gains influence, loses objectivity.  

  **Cultural Relativism Scope**: Explains mutual perceptions of strangeness (e.g., French luxury vs. Tupinambá nudity). **Beyond Scope**: Power asymmetry (captivity vs. free observation), coercion in "dialogue," interpreter bias.  

  ---

  ### Analysis via Montaigne’s Framework  

  #### 1. Mapping the Episode to Theory  
  Montaigne’s relativism requires *symmetrical judgment*: Europeans and Tupinambá each possess internally coherent customs. The actors’ options reveal asymmetries:  
  - **Court/Audience**: Chooses spectacle over dialogue. Evidence: Tupinambá as objects of display. Judgment: Confirms European superiority.  
  - **Tupinambá**: Limited options. Evidence: Observes French wealth disparity ("some gorged, others starving"). Judgment: Europeans lack *natural* order (Montaigne, *Of Cannibals*).  
  - **Montaigne**: Chooses inversion. Evidence: Tupinambá critique French luxury. Judgment: Uses their observation to condemn European artifice.  
  - **Interpreter**: Filters evidence. Options: Enable authentic exchange or reduce Tupinambá to props.  

  #### 2. Applying Montaigne’s Inversion  
  - **Spectacle as European Barbarism**: Displaying captives mirrors the cruelty Montaigne attributes to Europeans—treating humans as objects. The court’s voyeurism enacts the very dehumanization condemned in *Of Cannibals*.  
  - **Tupinambá’s Counter-Judgment**: When they call Europeans "lesser men" for hoarding resources, this is genuine epistemic critique. Yet Montaigne *appropriates* it: their words become tools for his attack on European corruption, not independent moral reasoning. Their observation is evidence *for him*, not a recognized peer evaluation.  

  #### 3. Limits of Relativism: Asymmetry and Silence  
  - **Broken Symmetry**: The Tupinambá observe France under duress—not as free agents. Relativism assumes mutual curiosity, not captive exhibition. Theory cannot explain how captivity distorts "evidence" (e.g., performative compliance under threat).  
  - **Mediation Blind Spot**: The interpreter’s role is untheorized. Montaigne relies on translation but ignores how power shapes mediation—e.g., framing Tupinambá remarks to fit European tropes. Relativism offers no tools to audit this filter.  
  - **Beyond Relativism**: Coercion (forced voyage, display) lies outside cultural judgment—it is raw domination. Montaigne’s framework cannot address this, as relativism requires voluntary encounter.  

  #### 4. Testing the Theory’s Validity  
  - **Confirmed Sympathy**: Montaigne’s dialogue (e.g., asking their views) grants Tupinambá epistemic standing rare for his era. Their concrete presence—questioning French wealth distribution—validates his claim that "each calls barbarism what is not his own practice."  
  - **Exposed Idealization**: Yet his framing *uses* them as mirrors. His essay reduces their complex society to a rhetorical counterpoint against Europe. The Rouen encounter shows why: their captivity prevents true peer debate. Montaigne cannot treat their cannibalism as a *legitimate alternative* to European torture—only as a "lesser evil."  
  - **Framework Shift Required**: To reframe the encounter as peer disagreement, Montaigne would need:  
    - **Agency**: Tupinambá as free interlocutors, not captives.  
    - **Reciprocity**: French customs scrutinized by Tupinambá on *their* terms.  
    - **Non-Instrumentalization**: Their views valued intrinsically, not as European self-critique.  

  ### Conclusion  
  The episode confirms Montaigne’s relativist insight—mutual strangeness reveals cultural contingency—but exposes its limits. Power imbalances fracture the symmetrical gaze his theory presupposes. The Tupinambá’s real presence forces a confrontation: Montaigne’s critique of European barbarism is radical, yet his relativism remains Eurocentric. It weaponizes Tupinambá perspectives *against* Europe but cannot grant them equal footing in moral debate. Only by addressing coercion and mediation could his framework evolve from spectacle to genuine dialogue.
