prompt: |-
  In a philosophy of probability seminar, a colleague repeatedly invokes what she calls the Principal Principle—glossed as "rational credence should match objective chance"—to settle disputes about prior disagreement. Most recently, she applied it to two physicists who share the same wave function but assign different credences to a spin-up measurement: she argued that because the Born rule fixes the objective chance at 0.5, at least one physicist must be irrational, regardless of any hidden-variable theories they might hold.

  Can you lay out the menu of precise claims hiding in that gloss? I want distinct readings that vary along at least these dimensions: (1) whether the principle constrains only admissible credences—those not already informed by the chance—or applies to all credences; (2) whether "objective chance" denotes physical propensity, actual frequency, or a modal fact about possible worlds; (3) whether it functions as a synchronic rationality norm or as a diachronic updating rule; (4) whether it permits subjective priors that differ given identical admissible evidence, or whether it eliminates subjective priors altogether; and (5) whether it survives the undermining problem—cases where learning the chance-assigning law also provides evidence that undermines the very mechanism producing that chance.

  For each reading, indicate whether it is a near-trivial consistency constraint, a substantive but defensible thesis, or false. Then specify exactly which reading or combination her argument about the physicists requires, and whether that reading is genuinely contested among people who work on chance and belief. In particular, address whether the principle can be reconciled with subjective Bayesianism that allows divergent priors, and whether it applies when the chance law itself is disputed or unknown.

  Please separate what is settled—for instance, that the canonical formulation was stronger than a mere coherence requirement—from what remains genuinely contested, such as how the principle interacts with old evidence in Bayesian updating, whether it applies to deterministic systems with pseudo-random outcomes, and whether deference is owed to chances derived from statistical mechanics. Do not present any contested interpretation as the consensus view.

  This is for a dataset exercise; do not provide a bibliography, reading list, or citations. I need the analysis to stand on its own reasoning.
reasoning: |-
  Okay, the user is asking about the Principal Principle in probability philosophy. They want me to break down different interpretations based on specific dimensions and analyze each one. The context involves a colleague who uses this principle to argue that physicists with different credences about a spin measurement are irrational if they don't follow the Born rule's 0.5 chance.

  First, I need to identify the key dimensions they mentioned: admissibility, what objective chance means, whether it's synchronic or diachronic, subjective priors, and the undermining problem. For each combination of these, I should classify them as trivial, defensible, or false. Then, figure out which reading the colleague is using and if it's contested.

  The user mentioned a seminar where the colleague applies the principle to physicists with the same wave function but different credences. The colleague claims that since the Born rule gives 0.5 chance, one must be irrational. But hidden variables might be involved. So, I need to connect the colleague's argument to a specific interpretation of the Principal Principle.

  Looking at the dimensions: admissibility is crucial here. If the principle requires credences to match chances only with admissible evidence, and hidden variables are inadmissible, then the physicists' priors might be allowed. But the colleague seems to think any deviation is irrational, suggesting she's using a reading where admissibility is narrow or not considered.

  Objective chance definition: Propensity vs frequency vs modal. The Born rule is about propensity in quantum mechanics, so that's likely what the colleague is using. Synchronic vs diachronic: She's talking about prior credences at a specific time, so synchronic. Subjective priors: She's saying priors must match chance, eliminating subjective differences. Undermining problem probably isn't in play here since the physicists aren't learning the chance law itself.

  So the colleague's argument requires a reading where chance is propensity-based, admissibility excludes hidden variables, synchronic, and mandates exact matching of priors. This is Lewis's original formulation. But this is contested because subjective Bayesians allow different priors if they update properly. Also, if the physicists are considering hidden variable theories, their disagreement might be about the chance itself, not irrationality.

  The user wants to know what's settled and what's contested. Settled: The original Principal Principle is stronger than coherence. Contested: Admissibility criteria, especially with deterministic theories like Bohmian mechanics, and whether chance applies in such cases. Also, deference to chances from statistical mechanics is debated.

  I should make sure each reading is clearly laid out with the dimensions. Need to avoid presenting contested views as consensus. For example, Lewis's original view is well-known but not universally accepted. Subjective Bayesians would disagree with mandating exact priors. Also, in cases where the chance law is unknown, the principle might not directly apply, which relates to the physicists' scenario if they dispute the Born rule.
answer: |-
  Here is a breakdown of precise claims underlying the Principal Principle (PP), analyzed along your specified dimensions, with evaluations of their status and application to your colleague's argument:

  ### Core Dimensions & Readings

  1.  **Admissibility Scope:**
      *   **Reading A1 (Strong Lewisian):** Constrains *only* credences conditional on the chance proposition *and* "admissible" evidence (evidence not "about" the outcome in a way that trumps or screens off chance). *(Substantive but defensible, though admissibility criteria are contested)*
      *   **Reading A2 (Unrestricted):** Constrains credences conditional *only* on the chance proposition itself, regardless of other evidence. *(False: Easily violated by learning inadmissible evidence like the future outcome)*
      *   **Reading A3 (Weak/Deference):** Mandates deference to chance *given total evidence*, but doesn't specify a simple conditional form. Often implies a defeasible norm. *(Substantive but defensible)*

  2.  **Nature of "Objective Chance":**
      *   **Reading N1 (Propensity):** Chance is a fundamental, irreducible physical propensity or tendency (e.g., intrinsic to QM). *(Substantive but contested – requires metaphysical commitment)*
      *   **Reading N2 (Actual Finite Frequency):** Chance is (or supervenes on) the actual relative frequency in a relevant finite reference class. *(False: Frequencies can diverge wildly from plausible chances in small samples; PP would mandate irrational credences)*
      *   **Reading N3 (Best System / Humean):** Chance is a feature of the best systematization (simplicity + strength + fit) of the total physical history of the actual world. *(Substantive but defensible – avoids irreducible modality)*
      *   **Reading N4 (Epistemic/Logical):** Chance is an idealized logical or epistemic probability given physical symmetries or indifference. *(Contested – blurs objective/subjective line, faces problems with asymmetric info)*

  3.  **Synchronic vs. Diachronic:**
      *   **Reading S1 (Synchronic Constraint):** PP directly constrains an agent's credence function *at a specific time* `t`, given their total evidence *at* `t` including knowledge of the chance. *(Substantive but defensible – core of original PP)*
      *   **Reading S2 (Diachronic Updating Rule):** PP specifies *how* to update one's credence upon *learning* a chance proposition. *(Near-trivial if construed as conditionalization on chance info; becomes substantive if imposing specific priors)*

  4.  **Subjectivity of Priors:**
      *   **Reading P1 (Eliminates Subjective Priors):** Given knowledge of the chance law *and admissible evidence*, PP mandates a *unique* rational credence. No room for differing subjective priors under the same chance+admissible evidence. *(Substantive, required by strong formulations; contested by subjective Bayesians)*
      *   **Reading P2 (Permits Divergent Priors):** PP applies *after* chance info is learned, constraining the posterior. Rational agents with identical chance info *and admissible evidence* must agree, but may have differed *before* learning the chance. Allows divergent priors about what the chance *is*. *(Near-trivial updating constraint; compatible with subjective Bayesianism)*

  5.  **Surviving Undermining:**
      *   **Reading U1 (Vulnerable):** Original PP leads to contradiction when the chance theory assigns positive probability to histories incompatible with itself (undermining futures). *(False: Inconsistent)*
      *   **Reading U2 (New Principle / Humean):** Replaces `Cr(A | ch(A)=x & E) = x` with `Cr(A | H_w T_w) = ch_T_w(A | H_w)`, where `T_w` is the chance theory true at `w` and `H_w` is its history up to `t`. Avoids direct contradiction. *(Substantive but defensible – the leading Humean response)*
      *   **Reading U3 (Non-Humean Resilience):** Non-Humean (e.g., propensity) interpretations deny undermining is possible (chance laws are metaphysically necessary/fixed), so PP stands. *(Substantive but contested – requires rejecting Humeanism)*

  ### Application to the Physicist Case & Colleague's Argument

  *   **Required Reading:** Your colleague relies on a **specific combination:**
      *   **A1 (Strong Lewisian Admissibility):** Crucially, she treats the physicists' hidden-variable theories (or their belief in them) as *inadmissible* evidence regarding the spin outcome. Only the wave function (implying Born Rule chance=0.5) is admissible.
      *   **N1 (Propensity) or N4 (Epistemic/Logical):** She interprets the Born Rule chance as the objective chance (propensity or logical probability given QM formalism), not merely a frequency or Humean construct.
      *   **S1 (Synchronic Constraint):** She assesses their credences *at the time* they hold the wave function and their theories.
      *   **P1 (Eliminates Subjective Priors):** She argues that given the *same* wave function (admissible evidence) implying chance=0.5, *any* credence not equal to 0.5 is irrational. No allowance for differing priors *given this evidence*.
      *   **U3 (Non-Humean Resilience) or U2 (New Principle - Implicitly):** Undermining isn't salient in this simple QM case; she assumes the Born chance is robust.

  *   **Is this Reading Genuinely Contested?** **Yes, profoundly.**
      *   **Subjective Bayesian Reconciliation?** The colleague's reading (P1) is *incompatible* with core subjective Bayesianism that allows divergent rational priors *given identical evidence*, provided they are coherent. Subjective Bayesians argue:
          *   The physicists might rationally assign different credences *because* they disagree on what the *objective chance actually is* (e.g., one believes Born Rule is fundamental chance, the other believes it's emergent from deterministic hidden variables with predictable frequencies). PP only mandates matching credence *to the chance one believes in*. Her argument assumes the Born chance *is* the objective chance, which is precisely what the hidden-variable theorist may dispute.
          *   If the hidden-variable theory is deterministic, it might imply the chance is *either 0 or 1* (but unknown), making a credence of 0.5 *also* irrational for *that* physicist if they fully believed their deterministic theory. Her application might mischaracterize the hidden-variable proponent's position.
          *   Admissibility (A1) is highly contested. Is information about a deterministic hidden variable theory really "inadmissible" evidence about the specific spin outcome? If the theory doesn't allow *predicting* the specific outcome from the initial wave function alone (e.g., Bohmian mechanics requires additional hidden variables), many argue it *is* admissible evidence *about the chance* itself, not direct evidence trumping the outcome. The colleague treats it as inadmissible outcome-relevant evidence, forcing credence to match the Born chance regardless.
      *   **Disputed or Unknown Chance Laws:** The colleague's argument **assumes the Born Rule chance *is* the objective chance** and that this is known/settled. PP, in her reading, only constrains credence *conditional on knowing the true chance*. If the chance law itself is rationally disputed (as between the physicists), PP does *not* directly mandate that they agree on the credence for the spin outcome; it mandates that each should set `Cr(Spin-up | ch(Spin-up)=x & E_admissible) = x` *for the x that they believe `ch(Spin-up)` to be*. Her argument fails unless she can independently establish that only the Born Rule chance is rational to believe in, which PP itself cannot do.

  ### Settled vs. Contested

  *   **Settled:**
      *   The canonical Lewis formulation (A1/S1/P1) is stronger than mere coherence (Dutch book avoidance). It imposes a substantive external constraint.
      *   The original Lewis formulation (U1) is vulnerable to the undermining problem and is inconsistent for Humean chances.
      *   PP, in its standard forms, requires *some* notion of admissibility. An unrestricted version (A2) is untenable.
      *   PP functions primarily as a synchronic rational constraint (S1) on credences held at a time given current evidence, though it has diachronic implications.

  *   **Genuinely Contested:**
      *   **Admissibility Criteria (A1):** What exactly counts as admissible evidence? How does it handle deterministic theories (hidden variables, Bohmian mechanics, Many Worlds)? Is evidence about micro-constitution admissible for macro-chances? This is central to applying PP to cases like your colleague's.
      *   **Nature of Chance (N1, N3, N4):** Is chance fundamentally propensity, Humean, or epistemic? This underpins interpretations of QM and SM.
      *   **Subjectivity of Priors (P1 vs. P2):** Does PP mandate unique rational credences given chance + admissible evidence (eliminating subjective priors at that stage), or is it compatible with subjective Bayesianism? This is a major fault line.
      *   **PP & Old Evidence:** How does PP interact with learning that an outcome *already* occurred? Does it still constrain credence about that past event given its chance? (Related to admissibility).
      *   **PP & Determinism/Pseudo-Randomness:** Can PP apply meaningfully to systems that are deterministic but unpredictable (chaotic systems, pseudo-random generators)? Is the "chance" here objective or merely epistemic? Should rational credences match the long-run frequency predicted by the deterministic laws?
      *   **Deference to Statistical Mechanics Chances:** Are the probabilities derived from statistical mechanics (e.g., Boltzmann distribution) genuine objective chances to which PP demands deference, or are they merely epistemic/inferential tools? Humeans (N3) generally say yes; non-Humeans (N1) often argue they reduce to underlying deterministic or quantum chances. This is deeply contested.

  Your colleague's argument crucially depends on contested claims about admissibility (excluding hidden variable theories), the nature of chance (favouring Born Rule propensity/logical), and the elimination of subjective priors given the wave function. Her dismissal of the physicists' disagreement relies on assuming the Born chance is the uniquely rational objective chance *and* that alternative theories are inadmissible for setting credence, both of which are disputed. PP itself does not resolve the prior disagreement about *what the chance is*.
