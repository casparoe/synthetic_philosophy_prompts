prompt: |-
  As a journalist covering the intersection of science and moral philosophy, I have been discussing with editors and researchers how institutions can distinguish a legitimate value preference from a hidden cognitive bias, and my own intuitive verdicts on concrete cases have settled into a pattern I cannot formalize without help. Here are my judgments. A university admissions officer who favors rural applicants because she herself grew up in a small town and feels an unexamined affinity for them: that is bias, even if the outcome improves geographic diversity. A climate researcher who declines to fly to international conferences not on carbon-accounting grounds but because she finds air travel aesthetically wasteful and spiritually flattening: that is a defensible preference about the life she wants to model, not a bias, even though it limits her professional reach. A criminal-court judge who consistently chooses restorative sentences over carceral ones because she holds that human dignity is inviolable and punishment is a moral error: that is a principled commitment, not a bias, despite its correlation with her religious formation. By contrast, a public-health official who rejects vaccine mandates because she finds the rhetoric of bodily autonomy poetically compelling and metaphysically resonant, irrespective of epidemiological modeling: that is a bias disguised as taste. An art curator who removes violent imagery from a public exhibition because she personally finds it viscerally distasteful: bias. But a curator who removes the exact same imagery because she judges that the institutional purpose of this particular gallery is to serve as a sanctuary for collective emotional repair, and violent imagery undermines that purpose: a preference legitimately anchored in role-defined values. The case I keep reversing on is an AI-safety reviewer who rejects predictive-policing algorithms not on the basis of documented disparate-impact studies but because she finds the very concept of algorithmic prediction metaphysically ugly and aesthetically alien to the kind of social world she wishes to inhabit. I want a principle precise enough to deliver all six settled verdicts, to explain whether this reviewer case is closer to the climate researcher or to the public-health official, and to identify honestly which of my judgments must be overturned if the principle is to remain coherent. Please take a committed position: state the principle definitively in your opening sentence, then defend it with reasoning that shows exactly which cases it saves and which it sacrifices, with no preamble and no restatement of the problem.
reasoning: |-
  Hmm, the user is a journalist wrestling with a complex ethical distinction between legitimate value preferences and hidden cognitive biases across various professional scenarios. They've presented six clear cases where they've formed intuitive judgments but struggle to formalize a unifying principle. The core challenge revolves around an unresolved case about an AI-safety reviewer rejecting predictive policing algorithms for aesthetic/metaphysical reasons.

  Looking at their judgments, I notice they consistently protect decisions grounded in role-based purposes or explicit moral frameworks (like the judge's restorative justice stance or the curator's institutional mission alignment), while rejecting choices driven by personal taste or unexamined affinities (like the admissions officer's rural bias). The ambiguous case seems to hinge on whether the AI reviewer's "metaphysical ugliness" objection connects to her professional mandate or remains a personal aesthetic stance.

  The climate researcher case is particularly instructive - her flight avoidance is deemed legitimate because it models the life she wants to embody, which implicitly serves her role as a climate scientist. Whereas the public-health official's autonomy stance is rejected because it overrides epidemiological evidence without anchoring in public health ethics. This suggests a key differentiator: does the value preference functionally advance or align with the agent's institutional responsibilities?

  For the AI reviewer, if her objection stems from how predictive algorithms fundamentally violate the social contract she's tasked to protect (making it role-relevant), it might resemble the climate researcher. But if it's merely personal distaste for "algorithmic aesthetics" unrelated to AI safety outcomes, it veers toward bias. The journalist might need to sacrifice their tolerance for the curator's violence removal based on personal distaste if consistency demands that all unanchored preferences count as bias.

  I'll propose a principle that prioritizes role-grounded value integration over personal subjectivity, then systematically apply it to all cases - explicitly overturning any judgments where personal preferences aren't demonstrably instrumental to institutional purpose. The defense will show why the AI case likely fails without evidence connecting metaphysical objections to concrete harm prevention.
answer: |-
  **The principle: A value preference qualifies as legitimate rather than bias when it is explicitly justified as instrumental to fulfilling the core purpose of the agent's institutional role, whereas it constitutes bias when it stems from unexamined personal dispositions or substitutes for evidence-based reasoning required by the role.**

  **Defense:**

  1.  **Admissions Officer (Bias):** Favoring rural applicants based on unexamined personal affinity substitutes for the role's core purpose of selecting based on academic merit/potential and institutional diversity goals *defined by policy*. Geographic diversity is a legitimate goal, but her *reasoning* (affinity) is personal bias, not institutional justification.
  2.  **Climate Researcher (Legitimate Preference):** Avoiding air travel based on a chosen lifestyle model *is* instrumental to her core role as a researcher *studying* climate impact. Modeling the change she advocates is a coherent, role-relevant expression of her values concerning her field's purpose. Professional reach limitation is a consequence, not a failure of role justification.
  3.  **Criminal-Court Judge (Legitimate Preference):** Choosing restorative sentences based on an explicit, articulated principle (inviolable dignity, rejection of punishment) *is* instrumental to the judge's core role of administering justice according to law *and* deeply held moral principles inherent to judicial philosophy. Her reasoning directly connects to the purpose of sentencing. Correlation with religious formation doesn't invalidate the explicit, role-applicable principle.
  4.  **Public-Health Official (Bias):** Rejecting mandates based on the poetic resonance of bodily autonomy substitutes aesthetic/personal reaction for the role's core requirement: making decisions based on epidemiological evidence and population health outcomes. The value (autonomy) is relevant, but her *reasoning* ("poetically compelling") bypasses evidence-based justification demanded by the role.
  5.  **Art Curator (Personal Distaste - Bias):** Removing violent imagery based solely on personal visceral distaste stems from an unexamined personal disposition. It substitutes for the role's core purpose of curation based on artistic merit, historical context, or *institutionally defined* educational/mission goals. This fails to justify the action instrumentally for the role.
  6.  **Art Curator (Institutional Purpose - Legitimate Preference):** Removing violent imagery *because* it conflicts with the explicitly stated institutional purpose of the gallery (a sanctuary for emotional repair) *is* instrumental to fulfilling her curatorial role. The preference is anchored directly in the defined purpose of the institution she serves.

  **Applying the Principle to the AI-Safety Reviewer Case:**
  The reviewer rejects predictive policing algorithms based on finding the *concept* "metaphysically ugly" and "aesthetically alien" to her desired social world, *not* documented disparate impact. This is **bias, analogous to the Public-Health Official.** Her role as an AI-safety reviewer demands assessment based on evidence of risks, harms, fairness, robustness, and alignment failures ("documented disparate-impact studies" being one relevant type). Her objection substitutes personal aesthetic and metaphysical distaste for the evidence-based reasoning required by the core purpose of her role (evaluating safety). The value (a desired social world) is relevant, but her *reasoning* ("ugly," "alien") is disconnected from instrumental safety assessment. It resembles the Public-Health Official's use of "poetically compelling" rhetoric over epidemiology.

  **Sacrificed Judgment:**
  To maintain coherence under this principle, the judgment on the **first Art Curator (removing due to personal distaste)** must be overturned. The principle requires the preference to be justified instrumentally to the *institutional role's purpose*. Personal visceral distaste, like the admissions officer's affinity or the AI reviewer's metaphysical distaste, is an unexamined personal disposition insufficiently anchored in the role's defined purpose. The second Curator case succeeds *only* because she explicitly ties the action to the gallery's institutional purpose ("sanctuary for collective emotional repair"). The first Curator's action, based solely on personal taste, fails this test and must be classified as **bias**, consistent with the Admissions Officer and Public-Health Official cases where personal feelings overrode role-defined reasoning.
