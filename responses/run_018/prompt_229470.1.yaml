prompt: |-
  I recently had a long argument with a friend about the Catalan, Scottish, and Quebec independence movements, and I came away unsure whether I had been too quick to dismiss the position he was defending. He lent me a chapter from a book on the ethics of secession, and its core summary runs like this. On what the chapter calls the remedial-right-only view, a group has a right to secede only when it has suffered serious injustice, such as systematic human-rights violations, unjust annexation, or persistent discriminatory treatment by the state; where no such grievance exists — as in a wealthy liberal democracy — there is no legitimate right to secede, and the state may permissibly keep itself intact. The chapter then applies this to the present: the Scottish and Catalan movements, it says, are without moral foundation because neither people is oppressed, and their grievances are properly addressed through ordinary democratic politics. It adds that, on this view, a majority vote for independence in a region carries no independent moral weight, since consent of the governed is merely a procedural value rather than a source of rights.

  That summary felt persuasive when I read it, and I was ready to concede the argument to my friend, but he pressed it further than the chapter does, and something about the inferences now strikes me as too quick. I want to know how fair the summary actually is to the remedial-right-only position before I accept it. Could you go through it piece by piece: which claims would a careful defender of the view accept, which would she qualify or reject, and whether the conclusions drawn about Scotland and Catalonia, and about the moral significance of a referendum, actually follow from the parts that are accurate?
reasoning: |-
  Okay, the user had a debate with a friend about independence movements in Catalonia, Scotland, and Quebec. They read a chapter on the remedial-right-only view of secession and found it persuasive initially, but now have doubts after their friend pushed the argument further. They want a breakdown of which claims in the summary are accurate, which need qualification, and whether the conclusions about Scotland/Catalonia and referendums logically follow.

  First, I need to recall the core tenets of the remedial-right-only theory. This view, associated with scholars like Allen Buchanan, holds that secession is only justified as a remedy for serious injustices like severe human rights violations, unjust annexation, or systematic discrimination. It contrasts with primary-right theories that see secession as an inherent right of groups.

  The user's summary states that without such grievances in wealthy liberal democracies, there's no legitimate right to secede. The chapter applies this to Scotland and Catalonia, arguing their movements lack moral foundation since neither group is oppressed. It also claims that on this view, a majority vote for independence carries no independent moral weight because consent is merely procedural.

  I should analyze each component. The core injustice claims align with Buchanan's position - he's clear that secession requires grave injustices. But "serious injustice" needs unpacking. The examples given (human rights violations, annexation, discrimination) are correct, but the threshold is high - not just any grievance qualifies. The summary's "systematic human-rights violations" phrasing is precise.

  On wealthy liberal democracies: yes, remedial theorists argue that functional states with democratic channels make secession unnecessary. But this assumes those channels actually work for the group in question. The summary presents this as absolute, but careful theorists would acknowledge possible exceptions if democratic processes consistently fail a group despite formal access.

  For Scotland and Catalonia: the chapter's conclusion follows logically from the premises if we accept two big assumptions: 1) no qualifying injustice exists, and 2) democratic mechanisms are functioning properly. But both assumptions are contestable. Remedial theorists might disagree on whether certain grievances meet the threshold (e.g., Catalonia's fiscal complaints, Scotland's Brexit divergence). The summary presents this as settled when it's actually interpretive.

  The referendum point is well-stated: remedial theorists do see consent as procedural rather than foundational. A vote alone doesn't create a right to secede without underlying injustice. But they might acknowledge practical reasons to honor a clear vote to avoid violence, even if not morally obligatory.

  Where the friend might overreach: claiming any non-remedial secession is automatically "immoral" (remedial theory says it's not justified, not necessarily immoral); treating "no oppression" in Catalonia/Scotland as objective fact rather than debatable; dismissing all non-violent grievances as automatically insufficient; or suggesting states can use unlimited force to prevent non-remedial secession.

  The user's unease likely stems from these overextensions. The summary accurately presents the theory's framework, but applying it requires nuanced judgment calls about injustice thresholds and democratic functionality - not just mechanical application.

  I should clarify that remedial theorists debate these nuances internally. The chapter's application to specific cases represents one defensible interpretation under the theory, but not the only possible one. The referendum conclusion follows logically, but only if we accept the theory's procedural view of consent - which primary-right theorists would challenge.

  Key qualifications needed: 1) "serious injustice" has a high threshold that ordinary political grievances may not meet; 2) the democracy exception assumes effective access; 3) case applications involve contestable empirical/judgment calls; 4) while votes lack inherent moral weight, they may have practical consequences.
answer: |-
  You're right to be cautious—while the summary accurately captures the *core framework* of the remedial-right-only theory (primarily associated with Allen Buchanan), your friend's extension of it likely oversimplifies nuanced positions and ignores important qualifications made by careful defenders. Here's a breakdown of the claims, highlighting where the summary is fair and where it requires qualification:

  ### Core Claims of Remedial-Right-Only Theory: Accurate Portions
  1.  **Secession as Remedy for Injustice:**  
      *   **Summary Claim:** Right to secede exists *only* in cases of serious injustice (systematic human rights violations, unjust annexation, persistent discriminatory treatment).  
      *   **Defender's Acceptance:** This is the foundational tenet. Careful defenders (like Buchanan) explicitly reject "primary right" theories (e.g., choice theory, national self-determination). Secession is morally analogous to revolution or divorce – justified only when the relationship is severely abusive or illegitimate.
      *   **Why Fair?** This accurately reflects the theory's core normative stance. Secession is not an inherent right but a remedy of last resort.

  2.  **No Right in "Well-Ordered" Liberal Democracies:**  
      *   **Summary Claim:** Where no qualifying grievance exists (e.g., in wealthy liberal democracies), there is no legitimate right to secede. The state may permissibly act to preserve its territorial integrity.  
      *   **Defender's Acceptance:** This follows directly from the core tenet. If a state generally respects human rights, provides democratic participation, and does not systematically discriminate, the *remedial* justification vanishes. Secession would be disruptive and potentially destabilizing without sufficient moral cause.
      *   **Why Fair?** This is a standard application of the theory. Liberal democracies are presumed capable of addressing grievances internally.

  3.  **Moral Insignificance of a Majority Vote (Consent as Procedural):**  
      *   **Summary Claim:** A majority vote for independence carries no *independent moral weight*. Consent of the governed is a procedural value, not a source of inherent rights to secede.  
      *   **Defender's Acceptance:** Careful defenders strongly agree. They argue that "consent" operates *within* an existing legitimate state structure. A regional majority cannot unilaterally dissolve the political bond binding the whole state any more than a county could secede from a US state via vote. Secession requires a *just cause* beyond mere preference.
      *   **Why Fair?** This is a crucial and consistent point in the remedial literature. It directly challenges the "plebiscitary" or "choice" theory of secession.

  ### Claims Requiring Qualification or Rejection
  1.  **"Grievances are properly addressed through ordinary democratic politics":**
      *   **Summary Claim:** Implied that in liberal democracies, grievances *can always* be addressed internally.
      *   **Defender's Qualification:** A careful defender would **qualify this significantly**. They acknowledge that:
          *   Democratic systems can have flaws (e.g., persistent minorities unable to form coalitions, constitutional barriers).
          *   "Ordinary politics" must be genuinely accessible and effective for the group. If a group is permanently outvoted on fundamental identity/survival issues *despite* formal access, it *might* edge towards a qualifying grievance (though defenders are cautious about this).
          *   The threshold for "serious injustice" is high, but *not addressing legitimate grievances over time* could potentially become part of a pattern qualifying as discriminatory treatment or denial of self-government.
      *   **Why Qualification Needed?** The summary risks presenting liberal democracies as perfect grievance-resolution machines, which even remedial theorists don't claim. The *presumption* is strong, but rebuttable in theory.

  2.  **Application to Scotland/Catalonia: "No Oppression, No Moral Foundation"**
      *   **Summary Claim:** The movements lack moral foundation because "neither people is oppressed."
      *   **Defender's Qualification/Caution:** A careful defender would be **hesitant to make such a definitive, sweeping claim** for several reasons:
          *   **Empirical Judgment:** Determining "oppression" or "serious injustice" requires nuanced analysis of *specific grievances* against the high remedial threshold. Defenders might *argue* that grievances (e.g., Catalonia's fiscal complaints, cultural policies, or Scotland's Brexit divergence) likely *don't* meet the threshold of "persistent discriminatory treatment" or "systematic human rights violations" *compared to classic cases*. However, they would acknowledge this is a contested *interpretation*, not an objective fact.
          *   **Grievance Spectrum:** Not all grievances are equal. Remedial theorists focus on *grave* injustices. While they'd likely conclude Scotland/Catalonia fall short, they wouldn't dismiss grievances as irrelevant – they just deem them insufficient for *secession*.
          *   **"Oppression" is a Strong Word:** Remedial theory uses specific criteria (rights violations, discrimination, annexation). A defender might say Scotland/Catalonia don't suffer injustices *sufficient to warrant secession*, avoiding the loaded term "oppressed" unless clear evidence of systemic rights violations exists.
      *   **Does the Conclusion Follow?** **Logically, yes, *if* you accept two premises: 1) the remedial-right-only theory is correct, *and* 2) an objective assessment shows *no qualifying injustice* exists in these cases.** However, premise 2 is highly debatable and requires empirical analysis defenders themselves might disagree on. The chapter/summary presents this as settled fact within the theory, but it's actually a contentious *application*.

  3.  **State's Permissible Actions:**
      *   **Summary Claim:** "The state may permissibly keep itself intact."
      *   **Defender's Qualification:** While true the state *may* resist non-remedial secession, careful defenders **emphasize limits**:
          *   Resistance must be *proportionate*. Using massive violence against peaceful secessionists (even unjustified ones) could itself become a human rights violation, potentially *creating* a remedial right.
          *   Prudence and negotiation are often wise, even if the state has the right to resist.
          *   The state has obligations to address legitimate grievances through reform, even if they fall short of justifying secession. Ignoring them could be morally blameworthy and destabilizing.
      *   **Why Qualification Needed?** The summary could imply the state has carte blanche, which defenders do not grant. The right to preserve territory isn't a right to do *anything*.

  ### Key Points Where Your Friend Might Overextend (Inferences that are "Too Quick")
  1.  **From "No Remedial Right" to "Movement is Wholly Immoral/Illegitimate":** Remedial theory says secession isn't *justified as a right* without grave injustice. It doesn't automatically mean the *desire* for independence is immoral, that all grievances are trivial, or that political activism for it is illegitimate within democratic politics. The movement might be based on strong nationalist sentiment or disagreements about the optimal political structure – things the theory deems insufficient for *secession*, but not necessarily "immoral."
  2.  **Dismissing All Non-Violent Grievances:** Equating "not meeting the remedial threshold" with "no valid grievance whatsoever." Remedial theorists acknowledge many grievances can be real and serious, just not serious *enough* to morally override the state's territorial integrity.
  3.  **Ignoring the "Persistence" Criterion:** The theory often requires grievances to be *persistent* and unaddressed. A defender should examine if the state has made good-faith efforts to address grievances through accommodation (devolution, fiscal autonomy, cultural rights) within the existing state. The existence of mechanisms doesn't guarantee they work effectively for the specific group.
  4.  **Assuming Perfect Democratic Functionality:** As noted, the presumption that democratic channels *always* work fairly for minority nations needs qualification.
  5.  **Treating Consent as Morally Irrelevant:** While consent isn't an *independent source of a right to secede* under this view, defenders might acknowledge that strong, persistent democratic consent for independence in a region creates a *powerful political claim* that demands a serious response (negotiation, reform, perhaps a mutually agreed referendum) from the state, even if it doesn't create a unilateral *right*. Ignoring it completely could be seen as democratically deficient.

  ### Conclusion on Fairness
  *   **Framework Summary:** The summary is largely **fair and accurate** in outlining the core tenets of the remedial-right-only theory: secession as remedy only for grave injustice, no inherent right in well-ordered states, consent lacking independent moral weight for secession.
  *   **Specific Applications & Inferences:** The summary (and likely your friend's extension) becomes **less fair and potentially too quick** when:
      *   It presents the *application* to Scotland/Catalonia as an *obvious, uncontested conclusion* of the theory rather than a *debatable interpretation*.
      *   It implies liberal democracies *always perfectly resolve* grievances through ordinary politics.
      *   It fails to acknowledge the *qualifications* defenders place on the state's right to resist (proportionality).
      *   It risks conflating "no remedial right" with "no legitimate grievances or political aspirations whatsoever."
      *   It might downplay the *political significance* of majority consent, even if its *moral weight* for unilateral secession is denied under this theory.

  You were right to feel uneasy. The theory provides a coherent framework, but applying it definitively to complex real-world cases like Scotland and Catalonia requires careful, contested judgments about the nature and severity of grievances and the effectiveness of democratic mechanisms – judgments that go beyond the theory itself. Your friend seems to be presenting the theory's application as more settled and less nuanced than careful defenders would.
