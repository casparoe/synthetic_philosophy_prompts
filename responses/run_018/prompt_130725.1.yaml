prompt: |-
  I serve on the cross-cultural conduct board of an international health-research consortium that runs joint offices in Rotterdam and Osaka. By Friday we must circulate a formal recommendation on a concrete case: during a quarterly review, our Dutch program director delivered unvarnished negative assessments of Japanese team members’ data-collection methods in an open forum, explaining that professional integrity requires stating errors without softening; several Japanese colleagues then filed a grievance arguing that public directness violated norms of face-preservation and caused moral harm rather than legitimate criticism. Our board is weighing three proposed policies. Option A is a universal directness mandate requiring all staff to adopt Dutch-style unfiltered feedback regardless of office culture. Option B is a universal politeness shield permitting protective ambiguity and white lies in all cross-cultural evaluations to prevent emotional injury. Option C, proposed by a co-member, is a contextual transparency contract in which teams pre-negotiate domain-specific rules specifying which topics—such as budget errors or safety violations—demand literal truth-telling and which—such as interpersonal working style—allow strategic indirectness. I have no formal training in philosophy or ethics, but I have been thinking independently about whether white lies are genuinely wrong or instead a form of social care, and about whether Dutch directness and Japanese indirectness reflect deep disagreements about what speakers morally owe listeners rather than mere etiquette. Please draft the board’s decision memo: recommend one of the three options with a concrete implementation timeframe; engage seriously with the strongest argument for the option you reject, particularly whether protective ambiguity erodes professional trust or whether forced directness violates dignity; and explain how your recommendation handles this case without reducing either practice to surface custom. The reasoning should be precise and accessible to board members without academic backgrounds, treating directly whether politeness can be morally required and whether bluntness can be morally harmful.
reasoning: |-
  Okay, the user is part of a cross-cultural conduct board dealing with a conflict between Dutch directness and Japanese indirectness in feedback delivery. They need a formal recommendation by Friday, choosing among three policies. 

  First, I need to deeply understand the cultural clash here. The Dutch director's action stems from a cultural norm where unfiltered criticism is seen as professional integrity - it's about valuing truth above social harmony. Meanwhile, the Japanese grievance reflects a cultural framework where preserving face and group harmony isn't just politeness, but a moral obligation to prevent "moral harm". This isn't about etiquette but fundamentally different views on what we owe each other in professional settings.

  Looking at the three options:
  - Option A (universal directness) would likely cause recurring harm to Japanese colleagues by treating their cultural values as less important. It assumes Dutch norms are objectively "right", which is ethically problematic.
  - Option B (universal politeness) risks making critical feedback meaningless through excessive softening, potentially endangering real issues like safety or data integrity. 
  - Option C (contextual contracts) seems most promising because it acknowledges both approaches as morally valid in different contexts. It treats neither culture as default while creating clear rules for when each standard applies.

  The strongest counterarguments I should address:
  For rejecting A: The dignity argument is powerful - forcing someone to violate deep-seated cultural communication norms can indeed feel like a violation of professional respect.
  For rejecting B: There's real danger in ambiguity when literal truth matters, like with safety protocols where white lies could have catastrophic consequences.

  The memo needs to resolve this without reducing either practice to "mere custom". I'll argue that both directness and indirectness can be morally significant: indirectness as social care when protecting legitimate face concerns, directness as professional duty when factual accuracy is critical. The key is determining which domains require which approach through collective negotiation.

  Implementation-wise, a 60-day timeframe seems feasible: 30 days for each office to draft proposals, 30 days for cross-office negotiation. For the current case, I'll recommend mediated resolution using these new principles rather than retroactive punishment.

  The language must stay precise but accessible - no academic jargon. I'll emphasize that this isn't about compromise but about creating a third way where both cultural frameworks are respected situationally.
answer: |-
  **MEMORANDUM**  
  **TO:** Cross-Cultural Conduct Board, International Health-Research Consortium  
  **FROM:** [Your Name/Board Designation]  
  **DATE:** [Current Date]  
  **SUBJECT:** Formal Recommendation on Feedback Norms (Rotterdam-Osaka Offices)  
  **RECOMMENDED OPTION:** **C (Contextual Transparency Contract)**  
  **IMPLEMENTATION TIMEFRAME:** 60 Days (Phased Rollout)  

  ---

  ### **I. Summary of Decision**  
  After thorough deliberation, the board recommends **Option C (Contextual Transparency Contract)**. This approach formally recognizes both Dutch directness and Japanese indirectness as *morally valid communication frameworks* rooted in distinct cultural understandings of professional care and integrity. It avoids imposing one culture’s norms universally (Options A/B) while ensuring critical feedback is neither harmfully blunt nor dangerously ambiguous. Implementation will begin immediately, with full adoption within 60 days.  

  ---

  ### **II. Detailed Reasoning**  
  #### **Why Option C?**  
  1. **Resolves the Core Conflict Without Hierarchy of Values**  
     - Dutch directness reflects a moral duty to prevent harm through unvarnished truth (e.g., safety risks, scientific inaccuracy).  
     - Japanese indirectness reflects a moral duty to preserve dignity and group cohesion (e.g., protecting colleagues from public humiliation).  
     - **Option C treats both as legitimate** by requiring teams to *pre-negotiate* which domains demand literal truth-telling (e.g., data errors, safety violations) and which permit strategic indirectness (e.g., interpersonal habits, minor procedural tweaks).  

  2. **Prevents Reduction to "Surface Custom"**  
     - Neither practice is mere etiquette:  
       - **Bluntness can cause moral harm** by damaging a person’s standing in their community (violating *wa* 和 harmony in Japan).  
       - **White lies can be acts of care** when they protect relational trust (*omoiyari* 思いやり), but become unethical when masking critical errors.  
     - By linking communication style to *domain-specific risks*, Option C honors the moral intent behind both practices.  

  3. **Concrete Case Resolution:**  
     - The Dutch director’s public critique of data-collection methods *could* fall under "literal truth-telling" (if methods risked data integrity) but violated Japanese norms of *face*.  
     - Under Option C, teams would pre-define "data integrity" as a *directness-required domain*. Feedback would then be delivered privately to senior leads, avoiding public shame while ensuring accuracy.  

  #### **Implementation Timeline**  
  | **Phase**          | **Timeline** | **Actions**                                                                 |  
  |---------------------|--------------|-----------------------------------------------------------------------------|  
  | **Framework Draft** | Days 1-30    | Rotterdam/Osaka leads co-create templates for domain classification (e.g., "Safety," "Interpersonal Dynamics"). Board provides ethics guidelines. |  
  | **Team Negotiation**| Days 31-45   | All project teams negotiate their contracts. Mediators resolve disputes.    |  
  | **Training**        | Days 46-60   | Workshops on navigating contracts + trauma-informed feedback techniques.    |  
  | **Full Adoption**   | Day 60       | Contracts integrated into review processes. Quarterly audits for compliance.|  

  ---

  ### **III. Engagement with Rejected Options**  
  #### **Strongest Case for Option A (Universal Directness):**  
  *Argument:* "Protective ambiguity erodes trust by obscuring truth. White lies are paternalistic and deny colleagues the respect of honesty."  
  - **Board’s Response:** We agree that ambiguity in *high-stakes domains* (e.g., safety) is unprofessional and dangerous. However, universal directness falsely equates *all criticism* with equal moral urgency. Forcing public bluntness on low-stakes interpersonal feedback (e.g., "Your meeting style is inefficient") violates dignity by treating relational harmony as irrelevant. Not all truth requires the same delivery.  

  #### **Strongest Case for Option B (Universal Politeness):**  
  *Argument:* "Forced directness is colonial and strips non-Dutch staff of cultural agency. White lies are social care, not deception."  
  - **Board’s Response:** We agree that white lies *can* express care in contexts where face preservation is a moral good (e.g., minor praise for effort). However, universal politeness risks "kindness over integrity." Ambiguity in critical domains (e.g., mislabeled lab samples) could cause physical harm and erode trust in the consortium’s scientific rigor. Care must be balanced with competence.  

  ---

  ### **IV. Moral Framework: Beyond Etiquette**  
  - **Politeness as Morally Required:** When indirectness prevents disproportionate harm (e.g., averting a colleague’s debilitating shame), it becomes a duty of care—not just courtesy.  
  - **Bluntness as Morally Harmful:** When directness exposes trivial criticisms publicly, it becomes a dignity violation—not integrity.  
  - **Option C’s Balance:** By tying communication norms to *consequences*, not culture, we uphold:  
    - **Dutch Values:** Truth-telling where accuracy prevents material harm.  
    - **Japanese Values:** Indirectness where preserving face prevents relational harm.  

  ---

  ### **V. Recommendation & Next Steps**  
  1. **Adopt Option C immediately** using the 60-day implementation plan.  
  2. **Resolve the current case** via mediation: The Dutch director re-delivers feedback privately per Japanese norms, acknowledging the public forum caused undue harm. Future critiques of data methods follow the team’s new contract.  
  3. **Review framework annually** to address emerging cross-cultural tensions.  

  **Signed,**  
  [Your Name]  
  On Behalf of the Cross-Cultural Conduct Board  

  ---  
  **APPENDIX:** Draft Template for Contextual Transparency Contracts  
  ```markdown
  1. **Domain:** [e.g., Data Integrity/Safety Protocols]  
     - Communication Rule: Directness required. Errors stated plainly.  
     - Rationale: Prevents physical/reputational harm.  

  2. **Domain:** [e.g., Workflow Preferences/Communication Styles]  
     - Communication Rule: Indirectness permitted. Feedback via private channels.  
     - Rationale: Preserves face without material risk.  
  ```
