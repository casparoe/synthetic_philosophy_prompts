  ## The Figs in the Glass Hall

  The hallway mirror caught Eleanor as she adjusted a jade pendant against the oyster silk of her dress. Clara would be here soon. Eleanor’s gaze lingered on her own reflection – the soft curve of her cheek, the slight crinkles at her eyes that spoke (she liked to think) of kindly amusement rather than age. There was a *warmth* there, she decided, a patina earned by gracious living. The pendant settled perfectly.

  When Clara arrived, the sharp intake of breath Eleanor felt wasn’t just surprise at her friend’s new, severe haircut. It was as if the hallway’s soft light had abruptly focused, etching Clara’s features with impossible clarity. The high cheekbones seemed more pronounced, aristocratic; the line of her jaw, clean and decisive. Even the faint shadows beneath her eyes looked purposeful, like smudged charcoal adding depth to a portrait. "Clara! You look... remarkably defined," Eleanor breathed, the word escaping before she could find a softer one. Clara merely smiled, a quick slash of white. "One tries, Eleanor. Geoffrey’s bringing the ’98 Latour."

  Later, amidst the low hum of crystal and conversation in the dining room, Geoffrey held forth on Burgundy terroir. Eleanor watched him, his broad face animated, his gestures encompassing the room. He possessed, she thought, a reassuring *solidity*. His features weren’t sharp like Clara’s, but comfortably blurred, like well-worn leather. He belonged here, among the Georgian silver and the heavy damask. When he paused, scooping a dollop of foie gras onto a toast point, his eyes met hers. "Eleanor, these figs are divine. Truly ambrosial. They have that... *depth*." He sighed contentedly. "Such things require a certain cultivation, wouldn't you say?"

  Eleanor murmured agreement, warmth blooming again in her chest. The praise felt earned, a reflection of her own discernment. But a tiny, cold thought pricked her: the dessert platter was looking bare. She’d underestimated Clara’s appetite for poached figs in spiced wine. An errand was necessary.

  Outside, the city air had turned damp, smelling of petrol and distant rain. The usual vendor was at his corner, hunched beneath the awning of his battered cart, illuminated by a single, swaying bulb. Eleanor approached, the click of her heels sharp on the pavement. "Figs, please. A dozen of your best." She kept her tone pleasant, the practiced inflection used with service staff.

  He didn’t look up immediately, his hands moving slowly among the fruit like tired, brown crabs in the dim light. His posture seemed deeply *stooped*, she thought, not merely from leaning over the cart but as if pressed down by the very weight of the street, the night, the necessity of his trade. His face, when he finally glanced up to take her money, was a landscape of deep furrows, the skin leathery and creased. His eyes, dark and lusterless, seemed to absorb the weak light rather than reflect it. She saw exhaustion etched into every line, a resignation that felt *inherent*, like the gnarled grain of old wood. She placed the coins carefully into his calloused palm, avoiding contact.

  "Thank you," she said automatically. He nodded once, a minimal dip of the head that felt less like acknowledgement and more like a physical flinch, then turned back to arranging his wares with infinite, weary care.

  Back in the building’s hushed, mirrored elevator, Eleanor held the paper bag of figs. The cool surface reflected her silhouette – the oyster silk, the jade pendant, her own face framed by the elevator’s polished brass. She sought the familiar warmth she’d seen earlier, the kindly lines, the gracious patina. But the overhead light was unforgiving. The lines around her eyes seemed suddenly deeper, less crinkles of amusement and more grooves of something… habitual. The curve of her cheek looked soft, yes, but perhaps also *insulated*. The reflection held no inherent warmth, only the cool gleam of the brass and glass.

  Her gaze drifted downwards to the paper bag clutched in her hand. She saw, in the elevator’s mirrored wall, the vendor’s stooped posture superimposed over her own erect spine, his weary, creased face hovering like a ghost beside her smooth complexion. The image wasn't sharp, not like Clara’s features had appeared. It was blurred, indistinct, yet undeniable.

  The elevator chimed softly. The doors slid open on her familiar hallway. But Eleanor stood frozen for a second longer, staring not at the welcoming light beyond, but at the reflection holding her captive. The figs in the bag felt suddenly heavy, not with sweetness, but with the weight of the street vendor’s unseen shoulders, the unspoken assumptions that had sculpted her vision of him, of Clara, of Geoffrey, even of herself. The warmth she’d seen before wasn’t in the glass. It had been painted there, by a hand she hadn’t known was holding the brush. The polished brass and glass offered only cold, clear truth: her sight had never been a window, but a lens, ground by invisible hands. She stepped out, the click of her heels echoing differently now, into the waiting light.
