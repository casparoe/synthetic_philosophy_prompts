  me and my flatmate had a massive row in the kitchen last night about moral foundations theory — you know, haidt's thing with care, fairness, loyalty, authority, sanctity and that liberty/oppression one he added later. he was arguing that because conservatives score higher on loyalty and sanctity, that tells us something about who's actually right on immigration or whatever, and i kept saying that's just describing psycholgy, not giving you a moral argument. we went round in circles for ages, neither of us convinced, and now i'm half-curious what a genuinely deadpan version of his logic would look like if you took it seriously in a bureaucracy.

  could you write a satirical internal memo — about 600 words, numbered clauses and bullet points — from a fictional university ethics board called the "Committee on Moral Foundtaions and Institutional Harmony"? the voice should be an over-earnest bureaucrat who genuinely believes that mapping staff disagreements onto the six foundations tells us which side is morally correct. specifically, have it tackle a dispute over inviting a controversial speaker: frame the pro-invitation staff as high on liberty/oppression and authority/subversion, and the anti-invitation staff as high on care/harm and fairness/cheating. the memo should try to "weigh" these profiles as if they're commensurable, then recommend something absurd — maybe adopting whichever profile holds the departmental majority, or declaring a "pluralism holiday" where normative truth is suspended. the satire should land for someone who knows haidt's work but be readable to someone who doesn't; the target is the slide from descriptive moral psychology to normative justification. keep it self-contained with no citations, bibliography, or references to specific papers, and put one small typo in the header like "Foundtaions" just for flavour.
