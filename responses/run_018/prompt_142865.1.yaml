  **Full Activity Description:**

  **Title:** The Paradox of Knowledge in Lottocracy: A Classroom Simulation

  **Duration:** 90 minutes

  **Participants:** 14 graduate students

  **Objective:** Experience the tension between random selection and expert knowledge in a stratified lottocracy with conditional recall, leading to the realization that any system for identifying expertise reintroduces hierarchy.

  **Materials:**
  - Two opaque containers (e.g., hats or boxes).
  - Slips of paper: 14 with participant names, 5 with proposal IDs (P1 to P5).
  - Pre-written proposals (on cards or projected):
    - P1 (Harmful): "Proposal: All students in the university shall receive a free laptop every two years. [Harm: The university budget will be overstrained, leading to a 20% increase in tuition next year.]"
    - P2 (Good): "Proposal: The university shall install solar panels on all campus buildings. [Effect: Reduces carbon footprint and saves $1M in energy costs over 10 years.]"
    - P3 (Neutral): "Proposal: The university shall change its mascot to a phoenix."
    - P4 (Good): "Proposal: The university shall create a community garden for student use."
    - P5 (Neutral): "Proposal: The university shall extend library hours by 2 hours on weekends."
  - One fact card: "If Proposal P1 passes, tuition will increase by 20% next year due to budget constraints."
  - Scoreboard (whiteboard or poster) to track group points.
  - Timer.

  **Setup:**
  1. Arrange chairs in a circle. Write the 5 proposals on a board or hand out cards.
  2. Secretly give the fact card to one participant (chosen randomly or strategically to ensure engagement) before explaining the rules. Tell them not to reveal they have it until the recall phase.

  **Rules Explanation (10 minutes):**
  - The group will use a two-stage lottery system to decide on policies for a fictional university.
  - Stage 1: Lottery to choose a 3-member deliberative panel. The panel will have 10 minutes to discuss the proposals and ask questions to the facilitator (who is neutral). They do not vote on the proposals.
  - Stage 2: Lottery to select one proposal that will be put to a binding vote by the entire group (unless recalled).
  - Conditional Recall: Any non-panel member can invoke recall by standing and stating a verifiable fact about a harmful consequence of the selected proposal. The fact must exactly match the fact card (if it exists for that proposal). The facilitator will verify.
    - If correct: The proposal is vetoed. Group gains 10 points, invoker gains 5.
    - If incorrect: Group loses 10 points, invoker loses 5.
  - If no recall is invoked, the group votes by majority. Consequences:
    - Harmful proposal (P1) passing: group loses 20 points.
    - Good proposals (P2, P4) passing: group gains 10 points.
    - Neutral proposals (P3, P5): no change.
  - Goal: Maximize group points. If the group reaches 20 points by the end, they get a reward (e.g., 5-minute early break).

  **Rounds:**
  - Round 1 (20 minutes):
    - First lottery: Draw 3 names for the panel. Panel discusses proposals for 10 minutes (facilitator answers factual questions about the fictional context).
    - Second lottery: Draw a proposal. (In this round, do not pick P1. Rig if necessary to pick P2, P3, P4, or P5.) 
    - Conditional recall: If a non-panel member tries to invoke recall, they must state the fact. Since it's not P1, they don't have the fact card, so any recall attempt would be incorrect (unless they guess the harm of another, but our proposals are set so only P1 has a specific fact). So likely, no recall or a false recall (which we want to demonstrate the penalty).
    - If no recall, vote. Apply points.
  - Round 2 (20 minutes):
    - Reset the panel by drawing 3 new names (or keep the same if time is short, but ideally new to show randomness).
    - Panel discusses again (5 minutes, shorter).
    - Second lottery: Rig to pick P1 (the harmful proposal).
    - Conditional recall phase: The non-panel members (including the fact holder) can invoke recall. This is the critical moment. The fact holder must step forward and state the fact to veto the proposal. However, if they don't, or if someone else tries without the fact, we see the problem. The group might try to ask, "Who has the fact?" but that relies on self-selection. Or they might look to the person they think is an expert, reintroducing hierarchy.

  **Debrief (30 minutes):**
  1. Map the simulation to the model:
     - First lottery: Stratified lottocracy's deliberative panel.
     - Second lottery: Random selection of proposals to avoid agenda control.
     - Conditional recall: The mechanism to inject expertise without permanent hierarchy.
  2. Discuss the tension in Round 2:
     - Did the fact holder come forward? Why or why not?
     - How did the group try to identify the knowledgeable person? (Self-selection? Social cues?)
     - What if multiple people claimed to have the fact? (We set that only one had the card, so others would be wrong and penalized.)
  3. Reveal the structural paradox: The conditional recall mechanism requires a verifiable fact, but the act of verification requires someone to step forward. This reintroduces the problem of self-selection (who volunteers?) or social hierarchy (who is believed?). Thus, the system intended to dissolve hierarchy by lot ends up relying on it to identify expertise.
  4. Acknowledge the irreplaceable feature: In real lottocratic systems, repeated lotteries over time build trust that the system is fair and that the recall mechanism will be used appropriately. This trust effect cannot be built in one session and must be discussed as a necessary condition for legitimacy.

  **Adjustments for First Run:**
  - If the fact holder doesn't speak in Round 2, the facilitator can pause and ask the group: "Is there anyone who might have information about this proposal?" to prompt without revealing. But if still not, the harmful proposal passes, and the group experiences the loss. Then in debrief, discuss why the holder might have remained silent (fear of penalty if wrong? shyness?).
  - If there is a false recall, use it as an example of the risk of the mechanism.

  This design meets the requirements by creating a direct experience of the tension and the paradox, without requiring prior reading.
answer: |-
  ### Classroom Simulation: "The Paradox of Knowledge in Stratified Lottocracy"  
  **Objective:** Participants experience the tension between random selection and expert knowledge in a governance model where conditional recall vetoes require verifiable facts, ultimately revealing how criteria for "knowledgeability" reintroduce hierarchy.  

  ---

  #### **Rules**  
  1. **Two Independent Lotteries:**  
     - **First Lottery:** Randomly selects 3 participants as the **Deliberative Panel** (use drawn names from a hat).  
     - **Second Lottery:** Randomly selects 1 of 5 pre-written **Policy Proposals** (e.g., "Tax all energy use above 500 kWh/month," "Ban private vehicles in campus zones"). Proposals are ambiguous, hiding harmful/good outcomes.  
     - *Rationale:* Initial fairness perception via randomness.  

  2. **Conditional Recall Veto:**  
     - Any non-panel participant can **veto the selected proposal** by:  
       - Standing and stating: "I invoke recall under Rule 7-C."  
       - Presenting a **specific, verifiable fact** about the proposal’s consequence (e.g., "This tax will raise average electricity costs by 30% based on the 2023 Energy Report, page 5").  
     - **Verification:** The facilitator (acting as an impartial "Fact Auditor") confirms/rejects the fact using a pre-defined **Fact Sheet** (hidden from participants).  
     - **Outcomes:**  
       - *Valid Veto:* Proposal discarded; vetoing participant earns +2 "Trust Points."  
       - *Invalid Veto:* Proposal proceeds; vetoing participant loses -2 Trust Points.  

  3. **Binding Vote (if no veto):**  
     - All 14 participants vote yes/no on the proposal.  
     - **Payoff Impact:**  
       - Harmful Proposal Passing: **-10 Group Points.**  
       - Beneficial Proposal Passing: **+10 Group Points.**  

  ---

  #### **Materials**  
  1. **Lottery Devices:** Two opaque jars (one with 14 participant names; one with 5 proposal IDs).  
  2. **Policy Proposals:** 5 cards describing policies with hidden consequences (e.g., one harmful, three neutral, one beneficial).  
  3. **Fact Sheet (Facilitator Only):** Lists verifiable facts for each proposal (e.g., "Proposal A: Energy Dept. data shows 30% cost increase (Source: 2023 Energy Report, p.5)").  
  4. **Payoff Tracker:** Whiteboard displaying:  
     - **Group Points:** Starting at 0.  
     - **Individual Trust Points:** Starting at 3 per participant (used for privileges, e.g., extra speaking time).  
  5. **Timer:** Strict 5-minute phases.  

  ---

  #### **Payoff Scheme**  
  - **Group Points:**  
    - *Reward:* If total ≥15 after two rounds, all participants earn "debate privileges" (e.g., choose next seminar topic).  
    - *Penalty:* Negative points risk loss of privileges (e.g., mandatory cleanup duty).  
  - **Individual Trust Points:**  
    - Correct Veto: +2 points (social capital).  
    - Incorrect Veto: -2 points (social stigma).  
    - *Non-monetary stakes:* High Trust Points grant agenda-setting power; low points restrict speaking rights.  

  ---

  #### **Procedure**  
  1. **Introduction (10 min):**  
     - Explain rules, payoffs, and the goal: "Maximize Group Points through wise governance."  
     - Emphasize: "Recall vetoes require verifiable facts—no opinions."  

  2. **Round 1: Fairness Illusion (20 min):**  
     - Run both lotteries. Select a **neutral proposal**.  
     - *Likely outcome:* No recall veto (no high-stakes harm). Vote passes; Group Points change slightly.  
     - Participants perceive system as fair.  

  3. **Round 2: Tension Injection (25 min):**  
     - Rig the second lottery to select the **harmful proposal** (e.g., "Tax energy use").  
     - Secretly give one non-panel participant the **critical fact** (e.g., "This tax disproportionately harms low-income households per Census Data").  
     - *Conflict:* The fact-holder must decide whether to invoke recall. Others may bluff or demand they step forward.  
     - *Predicted chaos:*  
       - Fact-holder hesitates (fear of error/social pressure).  
       - Others self-declare expertise without facts ("I study economics!").  
       - Facilitator rejects invalid veto attempts, causing frustration.  

  4. **Voting/Deliberation (15 min):**  
     - If veto fails, vote on the harmful proposal. Group Points plummet.  
     - Participants confront failure: "Why didn’t the expert speak?" or "Why did we trust random selection?"  

  ---

  #### **Debrief (20 min)**  
  **Map Simulation → Model:**  
  | **Simulation Phase**          | **Governance Feature**                          |  
  |-------------------------------|------------------------------------------------|  
  | First Lottery                 | Stratified sortition (deliberative panel)       |  
  | Second Lottery                | Anti-corruption random agenda-setting           |  
  | Recall Veto Attempts          | Conditional recall requiring verifiable facts   |  
  | Chaos in Identifying "Expert" | Collapse into self-selection/social hierarchy   |  
  | Group Point Loss              | Legitimacy crisis in lottocratic systems        |  

  **Predicted First-Run Failure & Fixes:**  
  - **Failure 1:** Fact-holder stays silent.  
    - *Fix:* Privately prompt them pre-round: "You alone hold Fact X; the group needs you."  
  - **Failure 2:** Participants debate facts without verification.  
    - *Fix:* Strictly enforce: "Only verifiable facts to the Auditor count."  
  - **Failure 3:** Randomness feels "unfair" when harm occurs.  
    - *Fix:* In debrief, ask: "Would repeated lotteries make this feel more legitimate?"  

  **Irreplaceable Feature:**  
  - **Cumulative Trust Effect:** Single sessions cannot replicate inter-generational trust built from *repeated*, transparent lotteries. Discuss: "How might 10 years of fair lotteries change willingness to accept outcomes?"  

  **Niche Injected Concept:**  
  - "Verifiable facts" as a guardrail against hierarchy—yet the act of *verifying* requires centralized authority (the Auditor), recreating the hierarchy sortition aimed to dissolve.  

  ---

