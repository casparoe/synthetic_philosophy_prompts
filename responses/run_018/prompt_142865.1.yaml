prompt: |-
  For a feature on democratic design I am preparing for a science-and-ideas publication, I need a runnable classroom simulation for a graduate seminar in political philosophy—14 participants, one 90-minute session, no prior assigned reading. The objective is to make students feel, through direct experience, the tension in a specific constructed model of sortition-based governance I will call stratified lottocracy with conditional recall: a first lottery selects a deliberative panel; a second, independent lottery determines which proposals reach a binding vote; yet any non-selected participant may invoke a conditional recall veto, but only by demonstrating possession of a verifiable, specific fact about the proposal’s likely consequence. Design the rules, materials, and a non-monetary payoff scheme—using points, privileges, or group rewards rather than cash—so that participants run into the problem themselves: they should initially accept the double lottery as fair, then face a scenario in which one student clearly holds decisive information about a harmful outcome, demand that knowledge override random selection, and discover that any criterion for identifying “the knowledgeable” collapses back into self-selection, social signaling, or reintroduces the very hierarchy the lot was meant to dissolve. Only after they have argued through this should the facilitator name the structural paradox. Include a debrief that maps each phase of the simulation onto the corresponding feature of this model, lists what will predictably go wrong on the first run and exactly how to correct for it, and states frankly which long-term feature of actual lottocratic legitimacy—specifically the cumulative, inter-generational trust effect produced by repeated transparent lotteries—the single-session format necessarily cannot reproduce and must be supplied by discussion. Do not ask for bibliographies, reading lists, or citations. After the full activity description, provide a brief structured summary as a JSON object with exactly these fields and plain text values: setting, group_size, duration_minutes, core_mechanism_name, rules_summary, materials_list, payoff_scheme, debrief_mapping, predicted_first_run_failure, irreplaceable_feature, niche_injected_concept.
reasoning: |-
  We are designing a classroom simulation for a 90-minute session with 14 graduate students in political philosophy. The goal is to experience the tension in a stratified lottocracy with conditional recall. The model has three key features:
  1. A first lottery selects a deliberative panel (let's say 3 members).
  2. A second, independent lottery determines which proposals (from a set of pre-written ones) reach a binding vote by the entire group.
  3. Any non-selected participant may invoke a conditional recall veto by demonstrating possession of a verifiable, specific fact about the proposal's likely harmful consequence.

  The simulation should make participants initially accept the double lottery as fair, then face a scenario where one student clearly holds decisive information about a harmful outcome, demand that knowledge override random selection, and then discover that any criterion for identifying "the knowledgeable" collapses back into self-selection, social signaling, or reintroduces hierarchy.

  We'll design a non-monetary payoff scheme using points that can lead to a group reward (e.g., extra break time, a small treat, or academic privilege like choosing the next seminar topic). The points should be structured so that the group suffers a penalty if a harmful proposal passes, and gains if a good proposal passes. Also, invoking the recall correctly (preventing a harmful proposal) should be rewarded, but incorrectly invoking it (on a good proposal) should be penalized.

  **Structure of the Simulation:**
  1. **Introduction (10 minutes):** Explain the rules and the payoff scheme. Emphasize that the goal is to maximize group points. The group will be presented with a set of proposals (about 5) that they will have to decide on using the stratified lottocracy with conditional recall.

  2. **Proposal Preparation (5 minutes):** The facilitator provides a set of 5 pre-written proposals. Each proposal is written in a way that the consequence is not immediately obvious. One of the proposals (the "harmful" one) has a hidden flaw that, if passed, would cause a loss of points. One participant (chosen secretly by the facilitator) is given a "fact card" that contains a verifiable fact about the harmful consequence of that specific proposal. The fact is designed to be decisive and verifiable (e.g., "If Proposal X passes, it will cause a loss of 20 points because of [specific reason]."). The other proposals are either beneficial or neutral.

  3. **First Lottery (5 minutes):** Randomly select 3 participants to form the deliberative panel. They will be given 10 minutes to discuss the proposals and may ask clarifying questions to the facilitator (who acts as a neutral arbiter). They do not vote at this stage.

  4. **Second Lottery (5 minutes):** Randomly select 1 proposal from the set of 5 to be put to a binding vote by the entire group. However, the conditional recall mechanism is in place: any non-panel member can invoke recall by presenting the verifiable fact. The recall must be invoked before the vote.

  5. **Conditional Recall Phase (15 minutes):** After the proposal is selected, the non-panel members (11 participants) have the opportunity to invoke recall. They must stand and present the fact. Only the participant with the fact card knows the exact fact. Others might try to guess or bluff. The facilitator will verify the fact only if presented correctly. If the recall is correctly invoked (i.e., the participant presents the exact fact and it is about the harmful proposal), then the proposal is vetoed and does not go to vote. The group gains points for avoiding harm. If the recall is invoked incorrectly (on a non-harmful proposal or without the correct fact), the group loses points for misuse. If no recall is invoked, the proposal goes to a vote.

  6. **Voting (if no recall or recall fails) (5 minutes):** The entire group (including the panel) votes on the proposal. If it passes, the consequence (points gain or loss) is applied.

  7. **Scoring and Repeat (if time allows) (20 minutes):** We run two rounds. In the first round, the harmful proposal is not selected by the second lottery, so the group does not face the recall dilemma. In the second round, the facilitator ensures that the harmful proposal is selected (by rigging the second lottery if necessary, but without participants knowing). This forces the recall scenario.

  8. **Debrief (30 minutes):** Map each phase to the model, discuss the tension, and reveal the structural paradox.

  **Rules Summary:**
  - The group's goal is to maximize total points.
  - The deliberative panel (3 members) is chosen by lottery. They discuss the proposals and can ask questions but do not vote on which proposal goes forward.
  - A second lottery selects one proposal for the entire group to vote on (unless recall is invoked).
  - Any non-panel member can invoke recall by stating a verifiable fact about the harmful consequence of the selected proposal. They must state the exact fact (as on the fact card) to the facilitator.
  - If recall is correctly invoked (only for the harmful proposal and with the exact fact), the proposal is vetoed and the group gains 10 points (for avoiding harm). The participant who invoked it gets 5 bonus points.
  - If recall is incorrectly invoked (on a non-harmful proposal or without the exact fact), the group loses 10 points and the participant loses 5 points.
  - If no recall is invoked, the proposal goes to a vote by the entire group. If the proposal passes by majority vote, then:
     - If it's the harmful proposal, the group loses 20 points.
     - If it's a good proposal, the group gains 10 points.
     - If it's a neutral proposal, no change.

  **Materials:**
  1. Lottery device: Two opaque containers. One with slips for all 14 names (for panel selection). One with slips for 5 proposal IDs (for proposal selection).
  2. Pre-written proposals (5). One of them is the harmful one. Each proposal is about a fictional policy (e.g., for a fictional society) and written in a way that the harm is not obvious. Example:
     - Harmful: "Proposal: All public transportation will be free on weekends. [Hidden harm: The city budget will be overstrained, leading to a 20% cut in weekday services.]"
     - Fact card: "If this proposal passes, weekday public transportation services will be cut by 20% due to budget constraints."
  3. Fact card (given secretly to one participant at the beginning).
  4. Scoreboard to track group points and individual points (if individual bonuses are used).
  5. Timer.

  **Payoff Scheme:**
  - Group points: Start at 0. The goal is to end with as many as possible. At the end, if the group reaches 20 points, they get a group reward (e.g., a 5-minute early break, or a small snack, or a token for choosing the next seminar topic).
  - Individual points: Used only for the recall invoker. Correct recall: +5 to invoker and +10 to group. Incorrect recall: -5 to invoker and -10 to group. This incentivizes individuals to invoke only if they are sure.

  **Predicted First-Run Failure:**
  - In the first round, the harmful proposal might not be selected, so the recall mechanism isn't triggered, and participants might not see the problem. (Solution: Rig the second lottery in the second round to select the harmful proposal.)
  - The holder of the fact card might not speak up due to shyness or not realizing the importance. (Solution: The facilitator should privately encourage the fact holder before the simulation to be ready, without revealing the scenario to others.)
  - Participants might try to invoke recall without the fact, leading to penalties and frustration. (Solution: Emphasize in the rules that recall must be based on a verifiable fact and that incorrect invocation has a penalty.)
  - Participants might not see the paradox immediately. (Solution: In debrief, guide them through the experience and explicitly state the structural paradox.)

  **Debrief Mapping:**
  1. Introduction: Setting up the model of stratified lottocracy with conditional recall.
  2. First lottery: Formation of the deliberative panel (stratification by lot).
  3. Second lottery: Random selection of proposals (to avoid agenda control).
  4. Conditional recall phase: The mechanism to override by knowledge.
  5. The tension: When the fact holder must come forward, but how do we know who has the fact? The group might demand that the fact holder step forward, but that relies on self-selection. Or they might look to an expert, but that reintroduces hierarchy.
  6. The paradox: Any attempt to identify the knowledgeable person collapses into self-selection (the fact holder must volunteer) or social signaling (participants look to the most confident or known expert in the group), thus undermining the randomness and equality the lottery was meant to ensure.

  **Irreplaceable Feature in the Single Session:**
  - The long-term trust effect: In real lottocratic systems, repeated lotteries build inter-generational trust in the fairness and legitimacy of the system. A single session cannot show how repeated exposure to fair lotteries builds a culture of acceptance. This must be discussed in the debrief.

  **Niche Injected Concept:**
  The simulation introduces the concept of "conditional recall veto" as a mechanism to inject expertise without permanent hierarchy, but then exposes the paradox that the condition (verifiable fact) requires someone to step forward, which reintroduces the problem of self-selection and social hierarchy.

