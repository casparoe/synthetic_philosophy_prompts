prompt: |-
  I am designing a final examination for an upper-level philosophy of time seminar, and I need a single 90-minute essay prompt together with a model answer and a marking rubric. The topic must be the Rietdijk–Putnam argument that special relativity supports a block-universe ontology, but I want the question engineered so that students cannot receive top marks merely by reciting the standard relativity-of-simultaneity objection to presentism.

  Specifically, the exam should present a modified presentist position—call it "worldline-indexed presentism"—which accepts Lorentz covariance and the denial of absolute simultaneity, yet insists that ontological privilege is assigned only to events on a given observer's worldline at her local present hyperplane, allowing that other observers may have different "presents" without those events being real simpliciter for anyone else. The essay question should require students to determine whether this view escapes the Rietdijk–Putnam inference, and in particular whether Putnam's claim that an event's being present for one observer entails its being real depends on an unstated assumption about the transitivity or inter-observer sharing of ontological status.

  Please provide:
  1. The exam question itself, calibrated for roughly 1,200–1,500 words in 90 minutes, that forces students to reconstruct the original argument, articulate the worldline-indexed reply precisely, identify the hidden transitivity assumption, evaluate whether abandoning it collapses into a solipsistic or frame-relative ontology rather than presentism, and reach a defended conclusion.
  2. A model answer of approximately 650–750 words that demonstrates each of these moves.
  3. A marking scheme out of 25 marks, divided among five specific argumentative moves (each worth 5 marks), with a one-line note for each on the characteristic error that should cost marks—e.g., conflating epistemic perspective with ontological commitment, or treating Lorentz symmetry as automatically metaphysically neutral without argument.

  The prompt should avoid asking for bibliographies, citations, or reading lists, and should not depend on knowledge of any obscure post-2000 technical literature.
reasoning: |-
  We are designing an exam prompt on the Rietdijk-Putnam argument and a modified presentism called "worldline-indexed presentism". The goal is to force students to engage with the argument beyond the standard relativity of simultaneity objection. The key is to focus on whether Putnam's inference relies on an unstated assumption about the transitivity of ontological status across observers.

  The exam question should require:
  - Reconstruction of the original Rietdijk-Putnam argument.
  - Articulation of the worldline-indexed presentism reply.
  - Identification of the hidden transitivity assumption.
  - Evaluation of whether abandoning transitivity leads to solipsism or frame-relative ontology.
  - A defended conclusion.

  Model answer: approximately 650-750 words, demonstrating the above moves.

  Marking rubric: out of 25, divided into 5 criteria each worth 5 marks, with a note on characteristic errors.

  Let's design the exam question first.

  **Exam Question:**

  **Philosophy of Time: Final Examination**

  **Time Allowed:** 90 minutes

  **Word Limit:** 1200-1500 words

  **Instructions:** Answer the following question. You are expected to reconstruct arguments accurately, present objections clearly, and defend your conclusions with reasoned argument. No outside materials are permitted.

  **Question:**

  The Rietdijk-Putnam argument aims to show that special relativity, specifically the relativity of simultaneity, entails a block universe ontology and thus undermines presentism. In response, a modified presentist view called "worldline-indexed presentism" (WIP) has been proposed. WIP accepts Lorentz covariance and denies absolute simultaneity, but holds that ontological privilege is assigned only to events on a given observer's worldline at her local present hyperplane. Each observer's "present" is real for her, but events not on her worldline and not simultaneous in her frame are not real *simpliciter* for anyone else. Thus, WIP denies that an event being present for one observer entails that it is real for all observers or in an absolute sense.

  (a) Reconstruct the core steps of the Rietdijk-Putnam argument, making clear how it uses the relativity of simultaneity to challenge presentism. [Approx. 300 words]

  (b) Precisely articulate how WIP attempts to escape the Rietdijk-Putnam inference by rejecting the transitivity of ontological status across observers. [Approx. 300 words]

  (c) Evaluate whether WIP successfully avoids the Rietdijk-Putnam conclusion without collapsing into an ontology that is either solipsistic (only the subject's own mental states are real) or merely frame-relative (where reality is indexed to reference frames but without a privileged present). In particular, address whether the denial of transitivity of ontological status can be maintained without abandoning the core presentist intuition that there is a unique, objective, albeit perspectival, present. [Approx. 600 words]

  (d) Conclude by defending your own view on whether WIP offers a sustainable presentist alternative to the block universe in light of special relativity. [Approx. 300 words]

  ---

  **Model Answer:**

  **Model Answer (Approx. 700 words):**

  **(a) The Rietdijk-Putnam Argument**

  The Rietdijk-Putnam argument aims to show that special relativity (SR) entails a block universe. It starts from two premises: (1) SR implies the relativity of simultaneity: two events simultaneous in one inertial frame may not be in another. (2) Presentism holds that only present events are real. Now, consider two inertial observers, Alice and Bob, in relative motion. Suppose an event E is present for Alice at her time t_A. By the relativity of simultaneity, there exists another observer Bob for whom E is simultaneous with an event F in his future. But if presentism is true and E is present (hence real) for Alice, and if we assume that reality is absolute (not observer-relative), then E must be real for Bob too. However, for Bob, F is future and hence, by presentism, not real. But if E and F are simultaneous in Bob's frame, then they must share the same ontological status (both real or both unreal) in that frame. This leads to a contradiction: F is not real (since future for Bob) but E is real (since present for Alice and reality is absolute), yet they are simultaneous in Bob's frame. The only escape, the argument concludes, is to abandon presentism and accept that all events are equally real — the block universe.

  **(b) Worldline-Indexed Presentism (WIP) and the Rejection of Transitivity**

  WIP responds by denying that reality is absolute. It holds that ontological privilege is indexed to each observer's worldline. For an observer O at a point P on her worldline, the real events are those on the hyperplane of simultaneity (in O's frame) that passes through P. Crucially, WIP rejects the transitivity of ontological status: if an event E is real for Alice (because it is on her present hyperplane) and if Bob is at rest relative to Alice, then events on Alice's hyperplane are also on Bob's, so they agree on what is real. But if Bob is moving, his hyperplane is different. Thus, an event E that is present for Alice is real for her, but for Bob, E may be past or future and hence unreal *for Bob*. There is no contradiction because reality is not shared: there is no fact about whether E is real *simpliciter*; it is only real relative to an observer. WIP thus avoids the Rietdijk-Putnam inference by denying the unstated assumption that if an event is real for one observer, it must be real for all.

  **(c) Evaluation: Solipsism, Frame-Relativity, and the Presentist Intuition**

  The key question is whether WIP can maintain a robust presentism without collapsing into solipsism or a deflationary frame-relative ontology. 

  First, solipsism: WIP is not solipsistic because it allows that events on an observer's hyperplane are real, not just her mental states. Other observers exist and have their own realities. However, the lack of transitivity means that what is real for Alice is not real for Bob if they are in motion. This raises the issue of intersubjective agreement: if Alice and Bob are at the same spacetime point, they share the same hyperplane (if at rest) but if moving, they do not. But even at the same point, if they are in relative motion, their hyperplanes through that point differ. Thus, at a meeting point, they would assign different sets of events as real. This seems to fragment reality.

  Second, frame-relativity: WIP makes reality frame-relative. But presentism traditionally holds that the present is objective, even if temporally limited. WIP's present is objective only relative to a worldline. This might be seen as a form of relativized presentism. However, the core presentist intuition of a unique, flowing present is lost. The present becomes a static feature of each observer's perspective without any global becoming.

  Moreover, the denial of transitivity may lead to an ontology where there is no shared reality. Consider a chain: Alice and Bob are at rest, so they share a hyperplane. Bob and Carol are at rest, so they share. But if Alice and Carol are in motion relative to each other, then what is real for Alice may not be real for Carol even though they are connected via Bob. This breaks the transitivity of shared reality. If WIP allows that Alice and Bob share a reality and Bob and Carol share, but Alice and Carol do not, then we have a non-transitive reality. This seems counterintuitive and may violate the idea that reality is unified.

  But does this abandonment of transitivity collapse into solipsism? Not exactly, because an observer's reality includes a whole hyperplane of events. However, without a shared reality, the ontology becomes fragmented. This is not solipsism (which is only one's own mind) but a kind of perspectival realism. The worry is that it may be too weak to count as presentism, which typically requires a global present. WIP's present is local to each observer, but the lack of a global present may be a departure from the spirit of presentism.

  **(d) Conclusion**

  WIP escapes the Rietdijk-Putnam contradiction by denying the transitivity of ontological status. However, in doing so, it fragments reality into observer-dependent hyperplanes. This sacrifices the core presentist idea of a single, objective present. Instead, we get a multiplicity of presents. While this avoids the block universe, it does so at the cost of making reality perspectival in a way that may be more akin to a frame-relative ontology than traditional presentism. I conclude that WIP is not a sustainable presentism because it abandons the unity of the present. The block universe remains the more coherent ontology for SR.

  ---

  **Marking Rubric (out of 25):**

  Each criterion is worth 5 marks. The marks are awarded based on the quality of the argument, clarity, and philosophical insight.

  1. **Reconstruction of the Rietdijk-Putnam argument (5 marks):** 
     - Characteristic error: Failing to clearly show how the relativity of simultaneity leads to the contradiction for presentism, or misstating the roles of the observers.

  2. **Articulation of WIP and its rejection of transitivity (5 marks):** 
     - Characteristic error: Conflating WIP with standard presentism or failing to precisely explain how WIP denies the transitivity of reality across observers.

  3. **Identification and analysis of the transitivity assumption (5 marks):** 
     - Characteristic error: Not recognizing that Putnam's inference relies on an unstated transitivity of ontological status, or not explicitly stating it.

  4. **Evaluation of WIP's viability (solipsism vs. frame-relativity) (5 marks):** 
     - Characteristic error: Conflating the issue of solipsism (only one's own mind) with frame-relativity, or failing to address whether WIP maintains a presentist core (e.g., by not discussing the loss of a unified present).

  5. **Defended conclusion and overall argument coherence (5 marks):** 
     - Characteristic error: Drawing a conclusion that does not follow from the analysis, or failing to integrate the previous points into a coherent overall argument.

  Note: The model answer is about 700 words. The exam expects 1200-1500, so the student would need to expand with more detail and examples. The model answer is a concise version for the purpose of the rubric.
answer: |-
  ### Final Examination: Philosophy of Time  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1,200–1,500 words  

  **Question:**  
  The Rietdijk–Putnam argument contends that special relativity (SR) refutes presentism by demonstrating that the relativity of simultaneity entails a block universe, where all events are equally real. A modified presentist position—**worldline-indexed presentism (WIP)**—attempts to evade this argument. WIP accepts Lorentz covariance and denies absolute simultaneity but assigns ontological privilege *only* to events on an observer’s local present hyperplane (i.e., events simultaneous in their rest frame). Crucially, WIP denies that an event’s reality for one observer entails its reality for others: reality is *non-transitive* across observers.  

  (a) Reconstruct the Rietdijk–Putnam argument, explaining how it uses the relativity of simultaneity to challenge presentism.  
  (b) Articulate how WIP responds by rejecting the transitivity of ontological status, and identify the hidden assumption in Putnam’s inference that "an event present for one observer is real" depends on inter-observer sharing of reality.  
  (c) Evaluate whether WIP successfully avoids the block-universe conclusion without collapsing into solipsism (only the subject’s mind is real) or a frame-relative ontology (where reality lacks a privileged present). Focus on whether WIP preserves a minimally objective present despite abandoning transitivity.  
  (d) Defend your view on whether WIP offers a sustainable presentist ontology compatible with SR.  

  ---

  ### Model Answer (706 words)  
  **(a) Reconstruction of Rietdijk–Putnam Argument**  
  The Rietdijk–Putnam argument exploits SR’s relativity of simultaneity to undermine presentism. Presentism holds that only present events are real. SR implies that simultaneity is frame-dependent: two events simultaneous in one inertial frame may not be in another. Putnam considers two observers, Alice and Bob, in relative motion. Suppose Alice is at rest in frame F, and event E is present for her (thus real). In Bob’s frame G, moving relative to F, E may be simultaneous with a future event F (e.g., a supernova in Andromeda). For Bob, F is future and thus unreal. Yet, if reality is absolute (non-perspectival), E’s reality for Alice must hold for Bob. This creates a contradiction: E and F are simultaneous in G, so they must share the same ontological status (both real or both unreal), but F is unreal for Bob while E is real. Presentism thus collapses; only the block universe—where past, present, and future events are equally real—avoids inconsistency.  

  **(b) WIP’s Response and the Hidden Transitivity Assumption**  
  WIP counters by denying the transitivity of ontological status. It holds that reality is indexed to an observer’s worldline: for observer O at spacetime point P, only events on O’s local hyperplane of simultaneity (i.e., O’s "present") are real *for O*. Other observers’ hyperplanes have no bearing on O’s ontology. Thus, when Alice’s present includes E, E is real *for Alice* but not necessarily for Bob, whose hyperplane may place E in the past or future. WIP escapes Putnam’s contradiction by rejecting his hidden premise: that if E is real for Alice, it must be real *simpliciter* (absolutely), entailing universal reality. Putnam tacitly assumes ontological status is transitive—if E is real for Alice and Alice and Bob co-exist, E must be real for Bob—but WIP treats reality as worldline-relative. This breaks the chain linking Alice’s reality to Bob’s.  

  **(c) Evaluation: Solipsism, Frame-Relativity, and the Presentist Intuition**  
  WIP avoids the block universe but risks collapsing into solipsism or a deflated frame-relative ontology. First, solipsism holds that only one’s own mind is real. WIP is not solipsistic because it grants reality to all events on an observer’s hyperplane (e.g., distant stars), not just mental states. However, it faces a solipsism-adjacent problem: if reality is confined to a single worldline’s perspective, no two observers share a common reality. For instance, Alice and Bob passing each other at event P assign different realities to the same Andromeda event—Alice’s hyperplane may include it, Bob’s may not. This fragments reality into isolated perspectives, undermining intersubjective objectivity.  

  Second, frame-relative ontology treats reality as indexed to reference frames without a privileged present. WIP resembles this but insists each observer’s hyperplane is ontologically privileged—a "present" exists, albeit worldline-dependent. The threat here is that WIP’s "present" becomes a label without metaphysical weight. If reality is merely a function of coordinates, WIP loses presentism’s core intuition: that the present is *objectively* momentary and dynamic. Worse, without transitivity, WIP cannot ground why an observer’s hyperplane is privileged beyond their perspective. It risks reducing to a perspectival variant of the block universe, where "present" is an epistemic feature, not an ontological one.  

  Crucially, WIP preserves a *minimally objective present*: at each spacetime point, an observer’s hyperplane defines a unique, non-arbitrary present for them. This avoids the block universe’s eternalism. But the cost is high: reality lacks unity. If Alice’s reality includes E, and Bob’s does not, there is no "master present" to reconcile them. While this is consistent with SR’s Lorentz symmetry, it abandons presentism’s traditional commitment to a global, albeit relativistic, becoming.  

  **(d) Conclusion: WIP as Unsustainable Presentism**  
  WIP escapes Rietdijk–Putnam by rejecting transitivity but fails as sustainable presentism. It avoids solipsism (by admitting external events) and the block universe (by denying universal reality), but its non-transitive ontology collapses into a frame-relative model. The "present" in WIP is just a local tag without objective flow or unity, betraying presentism’s essence. Putnam’s transitivity assumption is not arbitrary—it reflects the intuition that reality must be shareable for a coherent metaphysics. WIP’s radical subjectivity may be SR-compatible, but it is presentism in name only. I conclude that SR still favors the block universe, as WIP’s compromises drain presentism of substantive content.  

  ---

  ### Marking Rubric (Total: 25 marks)  

  | **Criterion (5 marks each)**                                                                 | **Characteristic Error (costs marks)**                                                                 |
  |---------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | **1. Reconstruction of Rietdijk–Putnam argument** (Accuracy in explaining SR’s role and the contradiction for presentism) | Misrepresenting simultaneity relativity (e.g., treating it as epistemic) or misstating the observers' scenario. |
  | **2. Articulation of WIP and transitivity rejection** (Clarity in defining WIP’s ontology and identifying Putnam’s hidden transitivity premise) | Conflating WIP with standard presentism or failing to isolate transitivity as the targeted assumption. |
  | **3. Evaluation of solipsism/frame-relativity** (Depth in assessing whether WIP preserves objectivity or collapses into incoherence) | Equating worldline-relativity with solipsism or treating Lorentz symmetry as metaphysically neutral without argument. |
  | **4. Analysis of presentist intuition** (Insight into whether WIP’s "present" retains metaphysical significance) | Ignoring the tension between worldline-indexed privilege and the demand for a unified/objective present. |
  | **5. Defended conclusion and argument coherence** (Logical flow, originality, and consistency in final position) | Drawing conclusions unsupported by preceding analysis (e.g., abrupt dismissal of WIP without engaging its mechanics). |
