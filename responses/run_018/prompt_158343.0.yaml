  Hmm, the user wants to know what philosophical view of universals underpins this practice. They're specifically asking if the museum is treating factory objects as instances of a Platonic universal form, while handmade items are seen as bare particulars. They also wonder if a trope theorist could explain this without Platonism, and whether strict nominalism would force a complete system overhaul.

