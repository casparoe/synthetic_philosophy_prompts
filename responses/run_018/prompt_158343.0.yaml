  For the handmade pot, they're definitely not seeing it as a bare particular - they care about its concrete accidents (chips, cracks) as part of its identity. That actually aligns better with trope theory than bare particular view. 

  The nominalism question is tricky. Could they keep the same practices pragmatically? Probably, but the justification would feel hollow - like they're pretending uniqueness matters for handmades when nominalism says all objects are equally unique. The conservation ethic especially would lose its philosophical footing.

