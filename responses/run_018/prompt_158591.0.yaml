answer: |-
  The maxim "revolutions devour their children" is not a unitary thesis but a conceptual chameleon. Below, I dissect its distinct readings, evaluate their mechanisms and scope, assess compatibility with major interpretive frameworks, and apply the autocannibalism/autoimmunization distinction to isolate its core conceptual work.

  ---

  ### **I. Four Readings of the Maxim**

  | **Reading Type**          | **Mechanism**                     | **Scope**           | **"Devouring" Denotes**                               | **Substance**                                                                 |
  |---------------------------|-----------------------------------|---------------------|-------------------------------------------------------|-------------------------------------------------------------------------------|
  | **(1) Tautological**      | Definitional fiat                 | General             | Literal execution or removal of founders              | Any regime removing its creators is *defined* as self-destructive. No explanatory power. |
  | **(2) Structural**        | Institutional path-dependence     | General (purported) | Literal execution + institutional dismantling        | Revolutionary institutions (e.g., emergency tribunals) generate internal threats to sustain crisis legitimacy. Survival demands perpetual enemy-creation. |
  | **(3) Ideological**       | Logic of purification             | General (purported) | Symbolic betrayal + literal execution                | Abstract principles (e.g., Rousseauian virtue) require eliminating "corrupted" agents (e.g., Dantonists as egoists). Purity transcends persons. |
  | **(4) Contingency**       | Personality/tactical accidents    | 1789–1794 specific  | Literal execution (as betrayal)                      | Factional rivalries (e.g., Robespierre vs. Hébert), misjudged alliances (e.g., Committee of Public Safety), or external pressures drive violence. No inevitability. |

  ---

  ### **II. Assessment Against Interpretive Frameworks**
  *(✓ = Compatible; ✗ = Undermined; ~ = Partially Compatible)*

  | **Reading** | **Class Struggle**                                                | **Ideology-Driven**                                             | **Contingency**                                                 | **Presupposes Unified "Will"?**                              |
  |-------------|-------------------------------------------------------------------|-----------------------------------------------------------------|-----------------------------------------------------------------|--------------------------------------------------------------|
  | **(1)**     | ✓ (Trivial; any regime can eliminate elites)                     | ✓ (Self-definition via betrayal)                               | ✓ (Accidents cause removal)                                    | No (individual removal ≠ collective self-consumption)       |
  | **(2)**     | ~ (If classes fragment into factions) ✗ (If classes are monolithic) | ✗ (Downplays ideas as epiphenomenal)                           | ✗ (Rejects accident for structural inevitability)               | Yes (institutions as organs of a revolutionary "body")      |
  | **(3)**     | ✗ (Ideology masks material interests)                            | ✓ (Core mechanism is ideational)                               | ✗ (Replaces accident with logic of abstraction)                | Yes (revolution as carrier of a transcendent principle)     |
  | **(4)**     | ✓ (Factions reflect class segments)                              | ✗ (Ideology as rhetorical cover)                               | ✓ (Core mechanism is aleatory)                                 | No (factions lack metaphysical unity)                       |

  **Key Tension**: Readings (2) and (3) require positing the revolution as a *unified agent* with self-destructive tendencies. Readings (1) and (4) can be reconstructed through competing factions without holistic metaphysics.

  ---

  ### **III. Autocannibalism vs. Autoimmunization: A Conceptual Injection**
  - **Revolutionary Autocannibalism**: The regime consumes *its own vital elements* (agents, institutions) as nutrients for survival.  
    *Example*: Terror consumes Jacobins to fuel revolutionary momentum.  
  - **Revolutionary Autoimmunization**: The regime identifies its *foundational elements* (norms, personnel) as foreign pathogens threatening purity, expelling them to protect the "true" revolution.  
    *Example*: Robespierre branding Danton a "gangrene" corrupting the body politic.  

  #### **Application to the Maxim:**
  - **The Maxim Captures Autoimmunization**: "Devouring" implies the revolution *mistakes self for other*. Founders become "foreign" due to ideological contamination (Reading 3) or institutional logic (Reading 2). The slogan’s visceral metaphor aligns with a body attacking its own cells as invaders.  
  - **Autocannibalism is Distinct**: Here, consumption is functional (e.g., sacrificing the Girondins consolidates Montagnard power). This fits Reading 4 (tactical betrayal) but lacks the *pathological* dimension of self-misrecognition.  

  #### **Do Revolutions *Generate* or *Reveal* Internal Enemies?**
  - **Structural/Ideological Readings**: Revolutions *generate* enemies by creating new standards of purity (autoimmunization) or institutional dynamics (autocannibalism). Enemies are endogenous products.  
  - **Contingency/Class Readings**: Revolutions *reveal* preexisting fractures (e.g., bourgeois vs. sans-culotte interests). "Enemies" exist latently; the revolution merely exposes them.  

  ---

  ### **IV. Which Readings Survive the Distinction?**
  - **Thrives**: Reading 3 (Ideological) maps perfectly onto **autoimmunization** (principles devour representatives as impurities). Reading 2 (Structural) can be reconceived as autocannibalism if institutions "feed" on creators, but better fits autoimmunization if institutions demand ideological conformity.  
  - **Struggles**: Reading 4 (Contingency) aligns with autocannibalism (factions consume rivals for power) but rejects inevitability. Reading 1 (Tautological) is inert under either lens.  
  - **Core Insight**: The maxim’s enduring power lies in its **autoimmunization** subtext—the revolution must destroy its children to preserve its "soul." This requires ideological purification, not just tactical sacrifice.  

  ---

  ### **Conclusion**
  The slogan’s nontrivial content resides in **autoimmunization** (ideological purification expelling founders as contaminants), which presupposes revolutions possess a *metaphysical essence* threatened by its own agents. Structural and contingency readings can be salvaged only by diluting the maxim to mean "revolutions kill people," losing its paradox. The autocannibalism/autoimmunization distinction thus exposes the maxim as fundamentally **ideological**: it assumes revolutions are doomed by their own idealistic logic, not material constraints or chance. Whether this is a profound truth or a Romantic myth depends on one’s view of revolutions as unified subjects or factional collisions.
