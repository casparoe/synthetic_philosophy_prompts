answer: |-
  Here's my credence breakdown and reasoning for whether adaptive nudging qualifies as hard paternalism in your scenario, followed by synthesis and key uncertainties:

  **Final Credence: 0.58**  
  *(Slightly leaning toward hard paternalism, primarily driven by autonomy concerns)*

  ---

  ### (a) Does adaptive framing change the choice set or just its presentation?  
  **Probability it changes the choice set: 0.15**  
  *Reasoning:* Adaptive defaults manipulate *choice architecture* (e.g., opt-in difficulty) but don’t remove options—vaccination remains available. This aligns with "soft" paternalism (Thaler & Sunstein) where liberty is preserved. However, friction ≠ coercion; options exist but require more effort if non-compliant.  

  ### (b) Does algorithmic opaqueness damage autonomy enough to matter?  
  **Probability autonomy is meaningfully damaged: 0.75**  
  *Reasoning:* Opaque algorithms obscure *why* choices are framed differently (e.g., "Why is opting in harder today?"). This undermines informed consent and reflexive autonomy (Beauchamp & Childress). Users can’t contest hidden criteria, making it functionally coercive—especially if perceived as punitive for non-compliance.  

  ### (c) Does the nudge/coercion distinction hold under personalization?  
  **Probability the distinction collapses: 0.40**  
  *Reasoning:* Personalization exploits individual behavioral patterns (e.g., skipping vaccines → harder opt-in). While nudges are meant to be resistible, hyper-personalization may exploit cognitive biases so effectively that "easy out" becomes theoretical (Hausman & Welch). Yet coercion requires *forcing* outcomes—here, choice remains technically possible.  

  ---

  ### Synthesis:  
  Combining probabilities:  
  `(a) 0.15 * (b) 0.75 * (c) 0.40` → Weighted by impact → **0.58**  
  - Autonomy damage (b) is the strongest factor, as opacity prevents meaningful consent.  
  - Personalization (c) erodes the nudge ideal but doesn’t eliminate choice architecture’s "soft" core.  
  - Choice set integrity (a) remains intact, anchoring it to soft paternalism.  

  ---

  ### The Shakiest Term: **(c) Personalization’s impact on coercion**  
  - **Why shaky?** Evidence is mixed: personalized defaults *feel* more manipulative, but no empirical consensus proves they cross into coercion if options exist. Philosophically, it challenges whether "friction" equates to force.  
  - **What would shift it?**  
    - **↑ Toward hard paternalism (0.7+):** Evidence that users *perceive* personalized friction as punitive/inescapable, or data showing compliance spikes only when defaults adapt (suggesting manipulation > choice).  
    - **↓ Toward soft paternalism (0.2):** Proof users consistently override "harder" defaults without distress, or transparency tools explaining adjustments (restoring autonomy).  

  **Your 0.55 intuition is well-calibrated.** I slightly weight (b) higher due to autonomy’s ethical primacy, but (c) is the pivot—**if personalization exploits vulnerability (e.g., low health literacy), it tips into hard paternalism by undermining voluntariness.**
