prompt: |-
  I'm putting together an interview for my podcast Mind Matters, and my guest next week is a philopher who defends a pretty niche take on the meta-problem of consciousness. Instead of treating phenomenal intuitions as private mental states that need explaining away, she argues they're strategic commitments in a kind of collective epistemic commitment race — they stabilize only when enough researchers lock them in, almost like a Schelling point across the literature. She thinks Chalmers gets the framing wrong by assuming the problem is individual cognitive bias rather than a social-equilibrium failure. I need eight to ten interview questions that go way beyond having her restate this view. Specifically, I want at least one question pressing why an individual-level explanation of intuition failure can't be salvaged (with a follow-up keyed to her likely reply that private mental states don't have the right dynamics), one on what happens to the meta-problem if the commitment race never reaches equlibrium — say, if AI researchers with totally different priors enter the field and break the convergence — and one that asks whether her view secretly collapses into a sociology-of-science debunking argument that undermines her own commitment to consciousness being real. For each of those three, include a follow-up that anticipates her standard deflaction. The rest can probe other weak spots: whether the race model applies to non-philosophers' intuitions, what counts as locking in, and whether she owes us an account of who gets to be in the race. Keep the language readable for a smart general audience but don't avoid the actual philosophical moves — I'm going to ask these live and I don't want to sound like I'm just repeating a Wikipedia summary.
