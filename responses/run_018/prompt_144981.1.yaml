  Summary of the three accounts:

  - Nicod: both O1 and O2 confirm the law.
  - Bayesian: both confirm, but O1 is much stronger than O2.
  - Goodman: only O1 confirms, O2 does not.

  Now, the specific elements:

  Entities: Microbes with or without a synthetic biochemical pathway P.
  Law (direct): "Under thermal stress (H), every microbe with pathway P has concentration of metabolite A greater than metabolite B (A>B)."
  Law (equivalent): "For any microbe, if the concentration of A is not greater than B, then it is not under thermal stress or does not have the pathway P."

  Observations:
    O1: A microbe with P and under H, and we observe A>B.
