  Now, the equivalent form can be interpreted as: For any entity x, if the concentration of A is not greater than B in x, then either x is not under thermal stress or x does not have the pathway P.

  But note that this law is about entities that have the pathway P and are under thermal stress. However, the logically equivalent form also covers entities that do not have the pathway or are not under thermal stress. 

  We are to consider two observations:

  Observation 1 (O1): 
  We observe a microbe that has the pathway P and is under thermal stress (H) and we measure that A>B. This is a direct instance of the law.

  Observation 2 (O2): 
  We observe a microbe that does not have the pathway P (so ¬P) and is not under thermal stress (¬H). Moreover, in this microbe, we measure that the concentration of A is not greater than B (i.e., ¬(A>B)). This observation satisfies the equivalent form: ¬(A>B) and (¬H ∨ ¬P) is true (specifically, ¬H and ¬P).

