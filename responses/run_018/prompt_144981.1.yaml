  2. If we remove the kind boundary restriction for Goodman, then we would have to consider that the predicate ¬(A>B) is projectible everywhere. Then O2 would confirm the law. So the Goodman divergence collapses.

  3. For Hempel, if we remove the logical equivalence, then the entire paradox structure collapses. But note, the logical equivalence is inherent in the universal conditional.

  Defense of Hempel's symmetrical confirmation:

  A defender of Hempel might attack the case in two ways:

  1. Challenge the logical equivalence claim: 
     The law is: ∀x [ (H(x) ∧ P(x)) → (A>B)(x) ]
     The equivalent form: ∀x [ ¬(A>B)(x) → (¬H(x) ∨ ¬P(x)) ]

