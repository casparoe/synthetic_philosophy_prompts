     We must argue that the second observation (O2) does not confirm the law because the predicates in the negated form are not projectible outside the natural kind boundary.

     The natural kind in this scenario is the set of microbes that have the synthetic pathway P. The law is about what happens when P and H are true. The observation O2 is about a microbe that does not have P and is not under H. The predicates in the negated form of the law are ¬(A>B) and ¬(H ∧ P). However, the projectibility of the predicate ¬(A>B) might be restricted to the kind defined by P and H? 

