prompt: |-
  i'm writing my diss on collective responsibility but i'm stuck on framing. i want the full spec for what a theory of transgenerational collective guilt actually has to deliver if it's not just a metaphor stretched too thin. jaspers split guilt into criminal/political/moral/metaphyiscal but never really solved how it survives the death of the guilty generation, so i'm trying to build a framework where guilt has an institutional half-life that decays differently from legal liability — but before i commit i need to know what that framework can't drop.

  write the desiderta: what cases must it accomodate? (the state that committed atrocities, descendants who benefit materially, descendants who actively repudiate the legacy, institutions with complete membership turnover) what distinctions can't it collapse? (between being guilty vs being liable, affective shame vs normative guilt, collective agency vs statistical aggregation, and whether ghost agency — treating dead perpetrators as still nodes in the moral network — is a feature or a bug). also flag any jointly unsatisfiable pairs: e.g., if guilt requires conscious wrongdoing but also survives structurally across generations, do those clash? and tell me which single desideratum kills the most popular accounts.

  briefly score jaspers-style moral guilt, a structural/institutional account, and a purely reparative no-guilt view against the list. but keep weight on the criteria.

  finally, say what would change your mind: which argument or case would make you think one of these desiderata is actually a prejudice, and where your reasoning here is most likely to fail? also please flag if you're just smuggling in an assumption about group agency that isn't earned.
reasoning: |-
  Okay, the user is writing a dissertation on collective responsibility and needs help framing a theory of transgenerational collective guilt. They want to know what such a theory must deliver beyond metaphor, especially how guilt can persist after the original perpetrators have died. They've referenced Jaspers' categories of guilt but note he didn't solve how it survives generations. 

  The user is building a framework where guilt has an "institutional half-life" that decays differently from legal liability. They need to identify non-negotiable desiderata: cases the theory must accommodate, distinctions it must maintain, and potential contradictions. They also want popular accounts scored against these criteria and want me to flag where my reasoning might be weakest.

  Hmm, the user is clearly deep in the philosophical weeds. Their frustration with "metaphor stretched too thin" suggests they've seen too many superficial treatments. The demand for "what it can't drop" signals they're in framework-construction mode and need guardrails. The "ghost agency" point is especially spicy—they're wrestling with whether dead perpetrators can remain moral nodes.

  Breaking this down: First, the must-accommodate cases are brutal but real: states that did atrocities (Germany), beneficiaries (settler-colonial descendants), repudiators (white allies), and institutions with full turnover (modern corporations with dark pasts). Any theory that can't handle these is useless for actual historical injustice.

  The distinctions are equally crucial. Confusing liability with guilt could lead to punishing innocents. Affective shame vs normative guilt matters because one's about feelings, the other about obligations. And "ghost agency" is make-or-break—if dead Nazis are still part of the moral calculus, does that imply metaphysical weirdness?

  Biggest landmine: If guilt requires conscious wrongdoing but must survive structurally, that's a contradiction. Either guilt transforms into something else (duty? debt?) or we redefine guilt sans consciousness. The "consciousness clash" might be what kills most popular accounts—Jaspers-style moral guilt fails here because dead people can't be conscious wrongdoers.

  Scoring the three approaches:
  - Jaspers: Fails structural survival but nails distinctions like guilt vs liability. Too focused on individuals.
  - Structural: Handles institutional persistence but risks collapsing guilt into mere liability. Might need "ghost agency" as a feature.
  - Reparative: Dodges guilt entirely but feels ethically anemic for atrocities. Pragmatic but unsatisfying.

  My own blind spots? I'm probably assuming groups can "hold" guilt without enough argument. If someone showed me a case where descendants repaired harm without any guilt-talk (like Rwanda's Gacaca courts?), I might rethink if guilt is necessary. Also, the "beneficiary" case might be weaker than I think—what if the benefits are indirect and diffuse?

  User's diss is clearly ambitious. They're not just critiquing but building. The "institutional half-life" metaphor is fresh—they're a step ahead by decoupling guilt from legal timelines. Their anxiety about "smuggling assumptions" is telling; they want rigor. Might be worth whispering: "Your framework's strength is making guilt dynamic (decaying differently), but the cost is redefining guilt as something that doesn't require a guilty mind. Own that."
answer: |-
  Here’s a rigorous desiderata list for a theory of **transgenerational collective guilt**, followed by assessments of competing frameworks and critical self-reflection. The goal is to avoid "stretched metaphor" while accommodating real-world cases and conceptual distinctions.

  ---

  ### **Core Desiderata: What the Framework MUST Deliver**  
  *(Non-negotiable criteria for a viable theory)*  

  1. **Case Accommodation:**  
     - **Atrocity-committing states** (e.g., Nazi Germany, colonial regimes): How guilt persists after regime dissolution.  
     - **Material beneficiaries** (e.g., descendants profiting from stolen land/wealth): Guilt absent direct participation.  
     - **Active repudiators** (e.g., descendants denouncing ancestors’ crimes): Whether guilt can coexist with moral opposition.  
     - **Institutions with full turnover** (e.g., corporations, churches with new members): Guilt without biological lineage.  

  2. **Critical Distinctions to Preserve:**  
     - **Guilt vs. Liability:** Guilt as *moral status*; liability as *practical obligation*.  
     - **Affective Shame vs. Normative Guilt:** Shame as emotion; guilt as objective duty (even if unfelt).  
     - **Collective Agency vs. Statistical Aggregation:** Groups as moral agents (e.g., "Germany") ≠ mere demographic sets (e.g., "white people").  
     - **Ghost Agency (Dead Perpetrators):** Must clarify if they remain "nodes" (e.g., ongoing moral taint) or if guilt transfers impersonally.  

  3. **Jointly Unsatisfiable Tensions (Flagged):**  
     - **Consciousness-Structure Clash:** If guilt *requires* conscious wrongdoing (à la Jaspers) but *must* outlive perpetrators, the theory needs a new guilt-bearer (e.g., institutions, symbolic identity).  
     - **Repudiation Paradox:** Can descendants *both* inherit guilt *and* morally transcend it through opposition?  
     - **Beneficiary-Burden Disconnect:** Material benefit + zero participation → guilt? Or only liability?  

  ---

  ### **The Killing Desideratum**  
  **"Consciousness-Structure Clash" destroys most popular accounts:**  
  Jaspers-style **moral guilt** (individual/personal) dies here—dead people lack consciousness. **Reparative views** avoid guilt entirely, collapsing duty into liability. Only **structural-institutional accounts** survive, but risk conflating guilt with liability.  

  ---

  ### **Scoring Competing Frameworks**  
  *(Against the Desiderata)*  

  | **Framework**               | **Case Accommodation**       | **Distinctions Preserved?**       | **Solves Consciousness-Structure Clash?** |  
  |-----------------------------|------------------------------|-----------------------------------|------------------------------------------|  
  | **Jaspers-Style Moral Guilt** | Fails: Dead perpetrators → guilt expires. Ignores beneficiaries/structures. | ✅ Strict on guilt/shame, agency/aggregation. | ❌ Fails: Guilt tied to individual *mens rea*. |  
  | **Structural/Institutional** | ✅ Best: Guilt "lives" in enduring structures (laws, wealth, norms). | ⚠️ Risks collapsing guilt/liability; needs "ghost agency" as feature. | ✅ Solves: Guilt as systemic corrosion, not psychological state. |  
  | **Purely Reparative (No Guilt)** | ✅ All cases → liability only. | ❌ Collapses guilt into liability; ignores affective/normative divide. | ✅ Avoids clash by rejecting guilt. |  

  **Structural Account’s Edge:** Makes "institutional half-life" coherent (e.g., guilt decays as structures reform/reparations advance), but must explain why *guilt* (not just liability) adheres to structures.  

  ---

  ### **Self-Critical Flags: Where This Reasoning Could Fail**  
  1. **Ghost Agency Assumption:** I treat institutions as "carriers" of guilt across time—but this may *smuggle in uncontested group agency*. If institutions lack moral personhood, guilt has no vessel.  
  2. **Beneficiary Guilt Premise:** I assume material benefit + structural continuity → guilt. **Counterexample:** A descendant who donates all inherited wealth and works against the oppressive system—does *guilt* persist, or only liability? If the latter, the desideratum is too strong.  
  3. **Repudiation Paradox Unsolved:** Active denunciation *should* mitigate guilt—but how? If guilt is structural, can individuals ever opt out?  

  **What Would Change My Mind?**  
  - **Evidence that guilt is *always* personal:** A case where structural redress (e.g., reparations, museums) succeeds *without* invoking guilt (e.g., Rwanda’s *Gacaca* courts focused on liability/truth).  
  - **"Ghost agency" as incoherent:** If moral networks *require* living agents, structural guilt collapses into metaphor. Show me a theory where institutions hold *duties* but not *guilt*.  

  **Likely Failure Point:** Over-reliance on institutions as guilt-bearers. If groups lack "moral DNA," guilt might not transfer—only *harm* and *duty* do. Your framework must ground institutional guilt in something thicker than metaphor (e.g., shared identity, ongoing complicity).  

  ---

  ### **Conclusion**  
  A viable theory must:  
  1. **Decouple guilt from consciousness** (embrace structural persistence),  
  2. **Distinguish guilt from liability** (even if linked),  
  3. **Resolve the repudiation paradox** (guilt as defeasible?),  
  4. **Treat "ghost agency" as a feature** (dead perpetrators taint structures).  

  **Your move:** Defend institutions as moral vessels, or find guilt’s "carrier" beyond Jaspers’ individuals. The half-life metaphor works—if guilt decays *as structural harm is repaired*.
