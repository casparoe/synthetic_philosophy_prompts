answer: |-
  ### Exam Question: Philosophy of Science Seminar  
  **Time Allowed:** 45 minutes  
  **Expected Length:** 900–1,100 words  
  **Total Marks:** 25  

  **Background:**  
  Consider the universal law *L*: "All specimens of mineral type M exhibit fluorescence under ultraviolet light." This law is logically equivalent to its contrapositive: "Any object that does not fluoresce under ultraviolet light is not a specimen of mineral type M." The observation of a non-fluorescent object that is clearly not mineral M (e.g., a fragment of organic tissue) appears, by formal logic, to confirm *L*. This generates Hempel’s paradox of confirmation.  

  **Question:**  
  In a structured essay, address the following:  
  1. **Logical Derivation and Paradoxical Confirmation (5 marks):**  
     - Derive the logical equivalence between *L* and its contrapositive.  
     - Explain why observing a non-fluorescent non-mineral M object (e.g., organic tissue) *appears* to confirm *L*.  

  2. **Intuitive Problem (3 marks):**  
     - Articulate why this confirmation is intuitively unacceptable for scientific practice.  

  3. **Resolutions and Hidden Costs (14 marks):**  
     - **Resolution 1: Nicod’s Criterion with Projectability (7 marks):**  
       - Define Nicod’s criterion and explain how restricting it to "projectable" properties (e.g., natural kinds) resolves the paradox in the mineral-fluorescence case.  
       - Identify the hidden cost: How does this resolution tacitly presuppose a privileged partition of properties?  
     - **Resolution 2: Subjective Bayesian Analysis (7 marks):**  
       - Construct a Bayesian argument showing why observing a non-fluorescent non-mineral M object *may not* significantly confirm *L*. Explicitly define:  
         - Prior probability of *L* (\(P(L)\)).  
         - Prior probability of the taxonomic scheme distinguishing M from non-M (e.g., \(P(\neg M)\)).  
       - Identify the hidden cost: How does this resolution tacitly presuppose independence between \(P(L)\) and the prior probability of the taxonomic scheme?  

  4. **Evaluative Judgment (3 marks):**  
     - Does this paradox genuinely undermine naive inductivism (the view that universal laws are confirmed solely by positive instances)? Justify your answer.  

  **Instructions:**  
  - Write in prose, with clear section breaks.  
  - Do not include citations, bibliographies, or reading lists.  
  - Use the mineral-fluorescence framing throughout.  

  ---  

  ### Model Answer (650 words)  

  #### 1. Logical Derivation and Paradoxical Confirmation  
  The law *L* is formalized as:  
  \[  
  \forall x (Mx \to Fx)  
  \]  
  Its contrapositive is:  
  \[  
  \forall x (\neg Fx \to \neg Mx)  
  \]  
  These are logically equivalent: if all M are F, then any non-F must be non-M (and vice versa). By the equivalence condition of confirmation, any evidence confirming the contrapositive confirms *L*.  

  Observing a non-fluorescent object that is not mineral M (e.g., organic tissue) is an instance of \(\neg Fx \land \neg Mx\). This directly satisfies the contrapositive (\(\neg Fx \to \neg Mx\)), thereby confirming *L*. Formally, if the observation is consistent with the contrapositive—and the contrapositive is equivalent to *L*—it incrementally supports *L*.  

  #### 2. Intuitive Problem  
  This confirmation is unacceptable because it violates scientific intuition. Mineralogical laws like *L* concern *minerals*, yet observing irrelevant non-minerals (e.g., biological tissue) appears to strengthen *L*. Science expects confirmation to come from *testing the relevant domain*: observing mineral M specimens (especially non-fluorescent ones). A non-mineral object provides no such test; it is evidentially inert. Equating organic tissue to a "confirming instance" for a mineral law strains scientific practice, where domain-specific evidence matters.  

  #### 3. Resolutions and Hidden Costs  
  **Resolution 1: Nicod’s Criterion with Projectability**  
  Nicod’s criterion states: a universal law \(\forall x (Px \to Qx)\) is confirmed only by observations of \(Px \land Qx\) (positive instances) and disconfirmed by \(Px \land \neg Qx\). Observations of \(\neg Px\) (e.g., non-M objects) are neutral. Applied to *L*, observing organic tissue (\(\neg Mx \land \neg Fx\)) would not confirm *L* under Nicod’s view.  

  To resolve the paradox, a "projectability" constraint restricts Nicod’s criterion to properties that are scientifically natural (e.g., "mineral M" or "fluorescence"). Non-projectable properties (e.g., arbitrary disjunctions like "non-mineral M") cannot generate confirmation. Here, "non-mineral M" is non-projectable; thus, observing organic tissue does not confirm *L*.  

  *Hidden Cost*: Projectability presupposes a privileged partition of properties. It assumes "mineral M" is objectively projectable while "non-mineral M" is not, ignoring that taxonomies are theory-laden. For example, if "non-mineral M" included fluorescent minerals from another category, projectability becomes ambiguous. The resolution relies on an unchallenged background taxonomy, which may reflect historical contingencies, not ontological truths.  

  **Resolution 2: Subjective Bayesian Analysis**  
  Bayesian confirmation quantifies support using probabilities. For *L*, we define:  
  - \(P(L)\): Prior probability that all M are fluorescent (e.g., 0.2, reflecting skepticism).  
  - \(P(\neg M)\): Prior probability that a random object is non-mineral M (e.g., 0.99, since non-minerals dominate).  

  Upon observing evidence \(E\): \(\neg Fx \land \neg Mx\) (organic tissue), Bayes’ theorem updates \(P(L|E)\). The likelihood \(P(E|L)\) is high: if *L* is true, non-fluorescent objects *must* be non-M. However, \(P(E|\neg L)\) is also high: if *L* is false (some M are non-fluorescent), non-minerals are still likely non-fluorescent. Thus:  
  \[  
  P(L|E) \approx P(L) \quad \text{if} \quad P(E|L) \approx P(E|\neg L).  
  \]  
  The evidence \(E\) barely increases \(P(L|E)\) because \(E\) is probable regardless of *L*.  

  *Hidden Cost*: The analysis assumes independence between the priors for *L* and the taxonomy. If mineral M is defined by optical properties (e.g., fluorescence potential), \(P(L)\) and \(P(\neg M)\) are correlated. For instance, a taxonomy classifying M by fluorescence would make \(P(L)\) near 1, violating independence. The Bayesian must tacitly presuppose a fixed taxonomy, but taxonomies evolve with scientific knowledge.  

  #### 4. Evaluative Judgment  
  The paradox genuinely undermines naive inductivism. Inductivism holds that *L* is confirmed only by positive instances (fluorescent M specimens). Yet the paradox shows that negative instances (non-fluorescent non-M objects) *must* confirm *L* by logic. Since intuition rejects this, inductivism fails to capture scientific reasoning. Both resolutions require auxiliary assumptions (projectability or priors), proving that confirmation depends on contextual, non-inductive factors. The paradox reveals inductivism as incomplete, not false: it needs supplementation (e.g., Bayesian or projectability constraints) to align with scientific practice.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **A-Grade (21–25 marks):**  
  - Precise logical derivation; correct application to mineral case.  
  - Nuanced discussion of intuition, resolutions, and hidden costs.  
  - Explicit independence assumption in Bayesian analysis.  
  - Evaluative judgment links paradox to inductivism’s inadequacy.  

  **B-Grade (16–20 marks):**  
  - Minor errors in logic or framing; adequate resolutions.  
  - Identifies hidden costs but lacks depth.  
  - Evaluative judgment present but superficial.  

  #### Component Details:  
  1. **Logical Derivation (5 marks):**  
     - A: Correct formalization of *L* and contrapositive; clear link to organic tissue observation (5).  
     - B: Formalization incomplete; weak explanation of confirmation (3–4).  
     - *Error*: Fails to derive equivalence or misapplies confirmation.  

  2. **Intuitive Problem (3 marks):**  
     - A: Explicitly ties irrelevance of non-minerals to domain-specific testing (3).  
     - B: Vague appeal to "irrelevance" without domain context (1–2).  
     - *Error*: Claims intuition is "irrational" without justification.  

  3. **Resolutions (14 marks):**  
     - **Nicod’s Criterion (7 marks):**  
       - A: Defines Nicod/projectability; resolves paradox; identifies privileged partition cost (6–7).  
       - B: Omits projectability or cost; conflates with other criteria (4–5).  
       - *Error*: Assumes projectability is unproblematic.  
     - **Bayesian Analysis (7 marks):**  
       - A: Sets up Bayes’ theorem; uses priors explicitly; identifies independence cost (6–7).  
       - B: Describes Bayes vaguely; misses independence or priors (4–5).  
       - *Error*: Assumes \(P(E|L) = 1\) without addressing \(P(E|\neg L)\).  

  4. **Evaluative Judgment (3 marks):**  
     - A: Argues paradox undermines inductivism due to auxiliary assumptions (3).  
     - B: States inductivism is weakened without explanation (1–2).  
     - *Error*: Assumes inductivism survives unscathed.  

  **Note:** Credit deductively precise language, mineral-framing consistency, and argumentative clarity. Penalize rote summaries of Hempel without mineral case.
