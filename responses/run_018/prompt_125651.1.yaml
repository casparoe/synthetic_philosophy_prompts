     P(L | E) = [ P(E | L) * P(L) ] / P(E)

  If L is true, then any non-fluorescent object must be non-M. Therefore, P(E | L) = P(¬Fa ∧ ¬Ma | L) = P(¬Ma | L) because L entails that if ¬Fa then ¬Ma. However, note that L does not constrain the distribution of non-M objects. So, P(¬Ma | L) is just the prior probability that a randomly selected object is non-M, which we can denote as P(¬M). Now, if L is false, then there exists at least one mineral M specimen that does not fluoresce. But this does not directly affect the probability of E for a non-M object. Thus, P(E | ¬L) = P(¬Fa ∧ ¬Ma | ¬L) = P(¬Fa | ¬Ma, ¬L) * P(¬Ma | ¬L). Since ¬Ma means the object is non-M, and L being false doesn't change the properties of non-M objects, we can assume P(¬Fa | ¬Ma, ¬L) = P(¬Fa | ¬Ma) and P(¬Ma | ¬L) = P(¬Ma). Therefore, unless there is a correlation between the law and the properties of non-M objects, P(E | L) and P(E | ¬L) are both approximately P(¬Fa) * P(¬Ma). This implies that E does not significantly confirm L. The hidden cost is that this analysis assumes independence between the prior for L and the prior for the taxonomy T. In reality, the taxonomy and the law may be intertwined: if mineral M is defined by characteristics that include fluorescence, then the prior for L and the prior for T are not independent. For example, if the definition of M already assumes fluorescence, then P(L) would be very high, and the evidence E might be more likely under L.

