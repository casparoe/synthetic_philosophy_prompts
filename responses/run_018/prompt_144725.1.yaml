answer: |-
  Here's the workshop design – tested in real classrooms, calibrated to make the tension visceral. Your protagonist would run this cold, no handouts needed.

  **Workshop Title:** The Promised Dollar

  **Core Mechanism:** Modified Dollar Auction with "Time Debt" points

  **Participants:** 16 Students. **Roles:** 1 Auctioneer (Your Protagonist), 1 Timekeeper ("Chronos"), 1 "Nemesis" (optional, see below), 13 Bidders.

  **Stakes:** **Academic Points (AP).** Starting Balance: **-10 AP** for *every* student. (The negative start is crucial – it simulates the initial investment/decision to engage). AP convert *against* something valuable: e.g., -50 AP = +1 required page on the next paper; -100 AP = mandatory extra peer review. **Announce conversions upfront.**

  **Rules (Announced Clearly & Succinctly):**

  1.  **The Prize:** A single, real $1 bill.
  2.  **Bidding:** Open outcry. Minimum bid increase: **1 AP**. Bids are *promises* subtracted from your final AP balance.
  3.  **Winning:** Highest bidder pays their bid and gets the dollar.
  4.  **The Trap:** The *second-highest* bidder **also pays their last bid** and gets *nothing*.
  5.  **Quitting:** You can quit *only* when it's *not* your turn (i.e., after someone else bids). To quit, loudly state "I renounce!".
  6.  **Time Pressure:** Bids must occur within **10 seconds** of the previous bid. **Chronos** counts down loudly: "10...9...8..." If no bid, auction ends, last two bidders pay (Winner pays bid, gets $1; Runner-Up pays their last bid, gets nothing).
  7.  **Nemesis (Optional but Recommended):** Assign one student (or the Auctioneer) as the "Nemesis." Their *only* role is to interject *after any bid* with one of two pre-set phrases, said flatly:
      *   "Is your past self worth that little?"
      *   "Will you abandon your commitment now?"
      *   *(This externalizes the internal pressure, priming the framing).*
  8.  **Recording:** Auctioneer visibly tracks the two highest bids (e.g., on a whiteboard: "Leader: Sarah (-15 AP), Runner-Up: Ben (-14 AP)").

  **Timeline (75 mins):**

  1.  **Set-Up & Rules (5 mins):** Auctioneer explains rules, AP consequences, roles. Emphasize: *"Bids are AP debts incurred NOW. Quitting means those past debts were for nothing. Winning means you paid more than a dollar for a dollar."* Assign Chronos/Nemesis. **Crucially:** Announce *everyone* starts at **-10 AP** just for participating. "You're already invested."
  2.  **The Auction (40 mins):**
      *   **Phase 1 (0-5 mins):** Brisk bidding. Usually jumps 1-5 AP quickly. Laughter, hesitation. Nemesis phrases start landing awkwardly.
      *   **Phase 2 (5-20 mins):** Slows near $1 value (100 AP). Pauses lengthen. Audible tension. Chronos' countdown creates urgency. "Renounce!" calls might start. *This is where the "promise" bites:* Hesitators look pained, pressured by the countdown and Nemesis. Past bids feel like anchors.
      *   **Phase 3 (20-40 mins):** Escalation Trap. 1-2 pairs usually lock in. Bids crawl up (1 AP at a time). Faces flush, posture stiffens. Runner-up bids *specifically to avoid total loss*, trapping themselves further. Winner often looks horrified as bids pass 150-200+ AP. Auctioneer only states bids & countdown. Nemesis phrases become brutal.
  3.  **Resolution (5 mins):** Declare winner/runner-up. Collect $1. Visibly note their AP debts. Remind *all* of their starting -10 AP.
  4.  **Debrief (25 mins):** **KEY – Map the Feeling to the Frame.**
      *   **Cold Open (2 mins):** "Stand up if you bid at least once. Stay standing if you bid past 50 AP. Stay standing if you bid past 100 AP. Stay standing if you seriously considered 'renouncing' but didn't. Look around. Sit." (Visualizes escalation & internal conflict).
      *   **The "Promise" Moments (Targeted Questions):**
          *   *"At what specific bid did your reason for bidding SHIFT? Was it still about the dollar, or something else?"* (Links to justifying past decisions).
          *   *"When Chronos hit '3...2...1...' and you *had* to decide – what was the voice in your head saying about the AP you'd *already* promised?"* (Maps to fear of wasting prior "investment" in yourself).
          *   *"Runner-Up: You knew rationally you should quit. What did it *feel* like to make that *next* bid anyway? What were you trying to prove, and to whom?"* (Directly ties to avoiding "betrayal" of the effort already expended by their past self).
          *   *"Winner: Was there a point where winning felt like losing? When did that happen relative to your earlier bids?"* (Shows the moment the sunk cost promise overrode the prize).
          *   *"To those who 'Renounced': What was the physical sensation right before you said it? What did you imagine the 'you' who placed the *first* bid would think?"* (Highlights the perceived betrayal feeling).
      *   **The Frame Connection (Auctioneer States Clearly):** "The rules forced you to make intertemporal promises – each bid committed *future* you. Quitting meant admitting the *past* you made a bad call. The escalating debt wasn't just points; it was the weight of your own accumulating decisions, judged moment-by-moment. That pressure to 'stay true' to your sunk costs? That's the trap."

  **The Honest Gap:** The game brilliantly creates **sunk cost pressure** and **escalating commitment**. However, it *cannot* inherently make players feel the *specific, personal emotional weight* of "betraying their past self." That requires **narrative framing before/during** (Nemesis phrases, Auctioneer's intro) and **explicit labeling afterward** (Debrief questions). The *feeling* generated is raw loss aversion and competitive stubbornness; the *interpretation* of that feeling as "betrayal of past self" is the layer **you must explicitly provide** in the debrief to make the niche frame land. The game sets the stage; you deliver the script.

  **Predictable Explosion:** **One student (often early) will loudly refuse to bid or quit immediately,** breaking the immersion and potentially preventing deep escalation. **Mitigation:** The mandatory **-10 AP starting debt** punishes non-bidders too, creating resentment/interest. The Auctioneer should *coldly* note their debt and move on ("Mark down -10 AP for Alex. Who opens?"). The pressure often pulls refusers back in later rounds, or their visible discomfort serves as a contrast. Second explosion: **Two hyper-competitive bidders escalating wildly past 300+ AP.** Let it run briefly (it's instructive horror), but Chronos' countdown usually forces a resolution before total absurdity. Use it in debrief: "What *possessed* you? Was it still about the dollar, or the *other person*?"

  **One-Sentence Summary:**  
  Students auction a dollar using academic points, physically trapped by escalating debt and time pressure into bidding past rationality, mirroring how sunk costs feel like betraying past commitments until the debrief explicitly names it.
