answer: |-
  Based on Spinoza's core political principles as developed in the *Theological-Political Treatise* and *Political Treatise*, here is the ranking of regimes by "democratic latency" (DL), defined as the structural distance between formal procedures and the actual exercise of collective rational agency by the multitude:

  1.  **Democracy: DL = 0.2**  
      *   **Justification:** Spinoza defines democracy as "absolute dominion" held by the entire people collectively (PT XI, 1). Sovereignty *is* the multitude's power directly institutionalized. Council composition is maximally inclusive (all citizens meeting basic criteria), maximizing the pool of rational agents participating directly or through easily recallable representatives. While practical exclusions exist (e.g., servants, women in his examples), the structural distance is minimal because the formal sovereign body *is* the multitude organized. The psychological dynamic shifts decisively from fear/obedience towards rational deliberation: laws are seen as self-prescribed, fostering understanding and active consent ("ex ductu rationis"; TTP V). Sovereign power is fundamentally accessible; the people *are* the sovereign. Latency is low but not zero (0.2) due to the practical necessity of representation and the exclusions Spinoza pragmatically accepts, creating a slight formal mediation.

  2.  **Aristocracy: DL = 0.65**  
      *   **Justification:** Sovereignty resides in a council of patricians (PT VIII, 1), structurally distancing the multitude from direct power. While Spinoza insists on a *large* patrician council (proportional to the city size; PT VIII, 14) to harness diverse perspectives and prevent factional domination, eligibility is restricted by wealth/status, excluding the vast majority. This creates a significant structural gap. Deliberation occurs *within* the patriciate, aiming at rational statecraft, but the multitude remains largely passive subjects obeying laws they had no part in making. The dynamic for the common people leans towards obedience, though less fear-based than monarchy, as stability relies on patrician prudence. Accessibility to sovereign power is very limited (only via meeting restrictive patrician criteria). The large council mitigates latency *within* the ruling class but maintains a high barrier between that class and the multitude (DL 0.65).

  3.  **Monarchy: DL = 0.9**  
      *   **Justification:** Sovereignty is most concentrated and structurally distant here, vested in a single monarch (PT VI, 8). Even with a large advisory council (required by Spinoza to counter the monarch's inherent weakness and passions; PT VI, 15, 25), the monarch holds absolute formal power. The multitude has *no* structural avenue to sovereign power. The psychological dynamic is dominated by fear and slavish obedience ("ex solo affectu"; TTP V). The monarch's council, however large, exists to advise *one man* whose primary motivation is often personal security or passion, not collective reason. The council itself may deliberate rationally, but its output is filtered through the monarch's singular, often irrational, will. Accessibility for the common people is virtually non-existent. The formal structure completely conceals and negates the multitude's collective agency, relying entirely on suppression rather than harnessing its rational potential (DL 0.9).

  **Key Spinozist Principles Underpinning the Scores:**

  *   **Power of the Multitude:** The state *is* the power of the multitude (TP VII, 27). Regimes are stable only insofar as their formal structure aligns with and harnesses this underlying power. High DL signifies misalignment.
  *   **Reason vs. Passion/Obeying:** True power and freedom stem from acting according to reason ("ex ductu rationis"). Regimes fostering rational understanding and participation minimize DL. Regimes relying on passive obedience ("ex solo affectu") maximize it.
  *   **Council Size & Diversity:** Larger, more diverse councils (within the sovereign structure) better approximate collective reason and mitigate the irrational passions of individuals or small groups (TP VII, 5; VIII, 6; IX, 14). However, exclusivity negates this benefit for the excluded multitude.
  *   **Accessibility of Sovereignty:** DL decreases as the path for the common person to actively participate in (or be identical with) the sovereign power increases. Formal barriers (birth, wealth, exclusion from councils) increase latency.
  *   **Fear as Destabilizing:** Regimes grounded primarily in fear (monarchy most acutely) are inherently unstable and conceal the multitude's true power, maximizing DL.
