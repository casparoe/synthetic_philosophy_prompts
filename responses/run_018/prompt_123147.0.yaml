  i'm trying to nail down what a real solution to the combination problem for panpsychism actually has to do, so write me the desiderata: what any adequate account of how micro-subjects combine into macro-subjects must deliver -- the cases it has to get right, the distinctions it cant collapse (aggregation vs fusion, subject-summing vs true integration), the neuroscience findings it cant flatly contradict. cover the palette problem and boundary problem, but also inject wether the theory needs to preserve phenomenal transparency under divided attention in macro-subjects, and wether it should predict the absence of macro-experience in highly distributed artificial architectures that lack biological integration. flag which desiderata are hard constraints and which are just camp preferences (smallist vs cosmopsychist). take a committed stance: are these jointly satisfiable, or does the list itself reveal the combination problem is malformed? no bibliographies or citation lists -- just the spec and your verdict. keep it focused.
