  Okay, the user is grappling with a philosophical dilemma in Scanlonian contractualism. They've presented a structured argument that seems to force contractualism into either permitting killing one to save five or collapsing into decision paralysis. The user identifies as someone in an ethics seminar, likely a grad student or academic, given the technical nature of their query. 

  First, I need to parse the core tension: Scanlon explicitly rejects aggregating lives in trolley-like cases (step 8), but the argument claims his framework logically requires aggregation (step 7) or becomes useless (step 10). The user wants to preserve Scanlon's core definition (1) and his no-aggregation stance (9), but worries about the cost. 

  Hmm... the key vulnerability is step 4. The argument assumes the five can reasonably reject principle F because they face "the same burden" as the one under A. But Scanlon's burden comparison isn't about identical outcomes—it's about the nature of the principle itself. Under F, the five aren't being actively killed; they're dying from circumstance. Under A, the one is being deliberately sacrificed. That's a morally relevant difference for contractualism. 

  Ah! And step 6's aggregation math presumes rejections are commensurable weights, but Scanlon treats reasonable rejection as qualitative. Even if all rejections were valid (which they're not), you can't "sum" them like utils—contractualism looks for principles no one could reasonably reject, not least-rejected principles. 

  The user might push back: "But doesn't this make contractualism silent in conflicts?" Not quite. When burdens are comparable (e.g., all face broken arms), numbers matter. Scanlon just draws the line at aggregating fundamental harms like death versus being killed. 

  Cost-wise? Preserving (1) and (9) means contractualism stays non-consequentialist but loses algorithmic neatness. It demands contextual judgment about "reasonable rejection"—which some will call vague. But that's the point: morality isn't math. 

  ...Should I mention that Scanlon himself addresses this in WWO p. 229? Yes—it shows this isn't an oversight but a deliberate feature. The user will appreciate the primary source nod.
answer: |-
  Your colleague's argument cleverly exposes a tension in Scanlonian contractualism, but the critical misstep is **Step 4**. Rejecting this step preserves Scanlon's core anti-aggregation stance while avoiding decision paralysis. Here's the breakdown:

  **The Flaw: Step 4**
  *   **Claim:** "Each of the five can reject F: being permitted to die is a burden of the *same kind*—death—as the burden the one faces under A."
  *   **Problem:** This falsely equates the *nature of the burden* imposed *by the principle itself*.
      *   Under **Principle F (Forbid Killing):** The five die due to the *initial threat/accident* (e.g., a runaway trolley, disease). Principle F *allows* this natural outcome; it does not *cause* their deaths. The burden on the five is *not being saved*.
      *   Under **Principle A (Permit Killing):** The one dies *because Principle A specifically permits/requires* an agent to *actively kill* them as a means to save the five. The burden on the one is *being intentionally killed*.

  *   **Scanlon's Distinction:** Scanlon argues these burdens are **qualitatively different** in a way crucial for reasonable rejection:
      *   **Not being saved** (the burden under F for the five) is a misfortune, but it does not involve the *instrumentalization* or deliberate sacrifice of one person by another under a principle.
      *   **Being intentionally killed** (the burden under A for the one) is a fundamental violation of their status as a person whose life cannot be traded off against others. Principles permitting this are uniquely rejectable.

  **Why the One Can Reasonably Reject A, But the Five Cannot Reasonably Reject F:**

  1.  **The One's Rejection of A:** "Principle A licenses others to *kill me* against my will to save others. This fundamentally disrespects my value and inviolability as a person. No one could be expected to accept a principle allowing them to be used merely as a means in this way." **This rejection is reasonable.**
  2.  **The Five's Attempted Rejection of F:** "Principle F forbids others from killing you to save us, meaning we die. This is a terrible burden (death)." Scanlon's response: While your death is terrible, Principle F does not *cause* it; it merely fails to prevent it by authorizing a morally prohibited action (intentional killing). The principle itself does not *impose* the same kind of direct, agency-driven harm on you that Principle A imposes on the one. **Therefore, this rejection is *not reasonable*.** The five cannot reasonably demand a principle that legitimizes the deliberate killing of an innocent person.

  **Consequences of Rejecting Step 4:**

  1.  **Solves the Aggregation Problem (Blocking Step 7):** Since the five cannot reasonably reject F, there is no "aggregate weight" of rejection against F to compare to the rejection of A. Only the one has a reasonable rejection against A. Therefore, Principle F (forbidding the killing) survives scrutiny, and Principle A is reasonably rejected. Contractualism forbids killing the one.
  2.  **Avoids Decision Paralysis (Blocking Step 10):**
      *   Reasonable rejection is *not* silenced. In conflicts, we *can* compare burdens, but we do so **qualitatively**, focusing on the *kind* of burden the *principle itself* imposes on each individual.
      *   **Aggregation is permitted *within* comparable burdens:** Scanlon *does* allow aggregation for *lesser*, *comparable* burdens (e.g., many small headaches vs. one massive migraine, many broken arms vs. one death). If the burdens are of the *same kind and severity*, numbers *can* matter. The problem in the killing case is that the burdens are *fundamentally different in kind* (being killed vs. not being saved).
      *   **Guidance Remains:** Contractualism provides guidance by asking: "Does this principle impose a burden of a *kind* that makes it reasonably rejectable by any individual affected, considering the alternatives?" In the killing case, the burden of *being killed* is categorically rejectable, even to save many lives. In cases with comparable burdens (e.g., diverting a threat from many to fewer), aggregation applies.

  **What You Pay (Costs of Rejecting Step 4):**

  You rightly want to keep (1) and (9). Rejecting Step 4 allows this, but it comes at a cost:

  1.  **The "Qualitative Distinction" Burden:** You must defend the moral significance of the distinction between *allowing a harm* (not saving) and *actively causing a harm* (killing) *as imposed by the principle*. Critics (especially utilitarians or some consequentialists) argue this distinction is morally arbitrary – death is death, regardless of how it comes about. Scanlonians must argue that the *agency and authorization* embedded in the principle make the burdens fundamentally different.
  2.  **Complexity in Burden Comparison:** Determining when burdens are "qualitatively different" enough to block aggregation (like killing vs. not saving) versus "comparable" enough to allow aggregation (e.g., different numbers of similar injuries) requires careful, context-sensitive judgment. This introduces a degree of indeterminacy critics might seize upon.
  3.  **Potential for Controversy at Boundaries:** While the killing/not-saving distinction is clear-cut for Scanlon, there might be harder cases at the margins (e.g., certain omissions that seem very close to killings, or harms caused by complex institutional rules) where applying the distinction is contentious.

  **Conclusion:**

  The misstep is Step 4's claim that the burdens on the five (under F) and the one (under A) are "of the same kind." Scanlon argues they are fundamentally different: *being intentionally killed* vs. *not being saved*. Rejecting Step 4 allows you to:
  *   Preserve Scanlon's core definition (1).
  *   Maintain the no-simple-aggregation stance for fundamental harms (9).
  *   Forbid killing the one to save the five.
  *   Avoid decision paralysis by allowing aggregation for *comparable* burdens while blocking it for *qualitatively different* burdens like killing vs. not saving.

  The cost is defending the moral significance of the killing/allowing distinction within the framework of principles and reasonable rejection, and accepting some complexity in burden comparison. This is the price Scanlon willingly pays to maintain a non-consequentialist, person-respecting moral theory.
