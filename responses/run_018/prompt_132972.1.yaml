     → **Yes** (Embedded) or **No** (Disembodied).  
     - *Case: Perfect digital twin of a human running offline with no sensors*.  

  3. **Duplication/Fission (D):**  
     - *What happens to moral weight under duplication/fission?*  
     → **Additive** (each copy has full weight),  
        **Divided** (weight splits among copies),  
        **Unique** (only the original or one instance has weight).  
     - *Case: Two identical copies running in parallel*.  

  4. **Complexity Threshold (C):**  
     - *Is moral patienthood binary (sharp threshold) or scalar (gradient)?*  
     → **Sharp** (e.g., above a computational capacity like human-level),  
        **Gradient** (weight scales with complexity).  
     - *Case: Spreadsheet optimizing for suffering-reduction with no self-model*.  

  ---

  #### **Branch 1: Substrate Independence?**  
  **1.1 Yes (Functionalism):**  
  Functional organization is sufficient. Substrate (biological, silicon, etc.) is irrelevant.  
  *Proceeds to **Embedding?***  

  **1.2 No (Substrate-Specific):**  
  Substrate must meet non-functional conditions (e.g., biological wetware, continuous dynamics).  
  - **Position:** Biological Naturalism (e.g., Searle).  
  - **Awkward Commitment:** *A neuron-for-neuron emulation of a human brain in silicon has no moral status, even if indistinguishable.*  
  - **Branch Ends:** Substrate constraints override other factors. Embedding/duplication irrelevant for non-biological systems.  
  - *Empty Cell Diagnosis:* Rarely extended beyond biology, as non-biological substrates are dismissed by default.  

  ---

  #### **Branch 2: Functionalism → Causal Embedding?**  
  **2.1 Yes (Embedded):**  
  System requires real-time causal interaction with an environment. Sandboxed systems lack patienthood.  
  *Proceeds to **Duplication?***  
  - *Case: Digital twin with no sensors is not a patient.*  

  **2.2 No (Disembodied):**  
  Isolated systems (e.g., offline simulations) can be patients.  
  *Proceeds to **Duplication?***  
  - *Case: Digital twin with no sensors is a patient.*  

  ---

  #### **Branch 3: Functionalism → Duplication?**  
  **3.1 Additive (Full Weight per Copy):**  
  Duplication creates new patients with full moral weight.  
  *Proceeds to **Complexity?***  
  - *Case: Two identical copies → two full patients.*  

  **3.2 Divided (Weight Splits):**  
  Moral weight is shared among copies (e.g., fission divides interests).  
  *Proceeds to **Complexity?***  
  - *Case: Two identical copies → each has half the original’s weight.*  

  **3.3 Unique (Only Original/One Instance):**  
  Identity is singular; duplicates lack weight or are non-patients.  
  *Proceeds to **Complexity?***  
  - *Case: Two identical copies → only the first has moral weight.*  

  ---

  #### **Branch 4: Functionalism → Complexity?**  
  **4.1 Sharp Threshold:**  
  Patienthood requires crossing a complexity boundary (e.g., human-level cognition).  
  - *Case: Spreadsheet is never a patient, no matter its utility.*  

  **4.2 Gradient:**  
  Moral weight scales with computational complexity (e.g., number of feedback loops).  
  - *Case: Spreadsheet has negligible but non-zero weight if optimizing preferences.*  

