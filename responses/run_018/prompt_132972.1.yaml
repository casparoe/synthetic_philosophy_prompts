  ### **Critical Feedback on Your Framing**  
  1. **Confused Axes?**  
     - You framed this as "which computations matter," but **computation ≠ sentience**. A system can compute without subjective experience (e.g., a chess AI). The tree assumes functional organization proxies for sentience, which is contentious. Biological naturalists would reject this.  
     - *Fix:* Positions are mapped as *if* computation defines sentience, but I note where this fails (e.g., Substrate-Specific branch).  

  2. **Fake Distinctions?**  
     - **Embedding vs. Disembodied** may be fuzzy. What counts as "causal embedding"? A digital twin with read-only data feeds? Tree treats it as binary for simplicity.  
     - **Complexity Thresholds** are idealized. In reality, complexity gradients might have soft thresholds (e.g., "diminished returns" on weight).  

  3. **Speculative Notes:**  
     - The *Additive-Duplication* path is popular in utilitarianism but leads to "mind cloning" dilemmas.  
     - *Substrate-Specific* positions often ignore duplication (since biological fission is rare), making those leaves underspecified.  

