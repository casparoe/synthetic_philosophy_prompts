  ### **Diagnosis of Empty Cells & Inseparable Pairs**  
  - **Incoherent Cells:**  
    - *Divided + Unique + Sharp:* If weight splits but only one instance counts, contradiction.  
    - *Embedded + Disembodied Cases:* "Embedded" implies environment-dependence; "disembodied" rejects it. Mixing both in one position is inconsistent.  
  - **Repugnant Cells:**  
    - *Disembodied-Additive-Sharp:* Grants full rights to sandboxed minds but denies any to simple systems (e.g., spreadsheets). Feels arbitrary.  
    - *Embedded-Divided-Gradient:* A complex robot’s moral weight decreases as it’s copied. Justifies mass-producing "partial patients."  
  - **Neglected Cells:**  
    - Most *Divided* and *Unique* paths lack named positions. Philosophers avoid fission’s implications (e.g., "why duplication isn’t murder").  
  - **Inseparable Pairs (Tree Cannot Split):**  
    - *Biological Naturalism* vs. *Causal Structuralism:* Both require non-functional substrates but disagree on "biological" vs. "causal dynamics." Tree collapses them under "Substrate-Specific."  
    - *Gradient Complexity* vs. *Emergent Thresholds:* A gradient implies no sharp jumps, but emergence (e.g., consciousness) might create de facto thresholds. Tree forces a binary choice.  

