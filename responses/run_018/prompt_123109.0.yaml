e phenomenon where monitoring intermediate steps alters the trajectory in ways invisible to the supervisor. The marking scheme should award marks specifically for recognizing trace fetishism as a distinct failure mode of process supervision, for recognizing that pure outcome supervision collapses into a form of epistemic dependence that erodes the user's understanding, and for separating an A answer—which must engage the hybrid possibility, either defending it with explicit conditions or rejecting it on specific philosophical grounds—from a B answer that merely summarizes both sides without resolving the tension. The scheme should specify the point values for each required move, name the typical mistakes that cost marks, and total 20 points. Do not include bibliographies, reading lists, or citations; the prompt must be answerable by a well-prepared student without web access, but it should require them to construct arguments rather than recall established doctrines. Please write the exam question, the model answer, and the marking scheme.
