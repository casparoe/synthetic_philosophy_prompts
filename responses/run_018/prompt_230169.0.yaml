  ## Where the Lightning Flashes

  The rain lashed against the Manchester flat’s windowpanes, a rhythmic counterpoint to the low hum Mara barely registered anymore. Her body—*this* body, sitting in the worn armchair—felt the chill seep through the glass. Her fingers traced the grain of the wood on the armrest, registering the familiar texture. Yet Mara knew, with the detached certainty of routine, that the *feeling* originated 200 miles south, in a vat of oxygenated nutrient fluid beneath Cambridge. Her brain was there. Her body was here. The connection, a miracle of quantum-entangled communication replicating neural pathways faster than biology ever could, was the thread stitching her together.

  The degenerative myelopathy had been a slow thief, stealing the signals between mind and muscle. The trial—Project Theseus—was her desperate reprieve. Her brain, excised and sustained, her body piloted remotely. She’d learned to live in the disconnect. To *be* the disconnect. Her life was the high-fidelity link.

  Then, the storm hit Manchester proper. Lightning forked, blinding white, splitting the sky just beyond the window. Simultaneously, the world stuttered.

  **Glitch.**

  The hum faltered. The familiar sensory stream from Manchester to Cambridge, Cambridge to Manchester—frayed. Mara (in Cambridge) felt a sudden, terrifying *absence*. The pressure of the chair vanished. The sound of the rain muted, became distant, tinny. Manchester felt… hollow.

  In Manchester, Mara’s body stood up.

  Mara (in Cambridge) didn't tell it to.

  She watched, a trapped audience in her own skull-vat, as her body walked across the small living room. Smoothly, silently. It moved past the bookshelf, past the dormant terminal, towards the small kitchenette. Her body opened a drawer.

  Mara (in Cambridge) *screamed*. No sound left the tank. Alarms flared silently on the perfusion monitors in Cambridge – elevated cortisol, spiking neural activity – but the techs were monitoring system integrity, not subjective terror.

  In Manchester, Mara’s hand reached into the drawer and pulled out a knife. The chef’s knife, heavy and sharp. Her fingers closed around the handle. It felt… solid. Real. More real than anything had felt in years. The cool metal, the textured grip – the sensation slammed into the Cambridge vat with shocking clarity as the link momentarily stabilized.

  *Why?* Mara (in Cambridge) thought, frantic. *What are you doing? Stop! Put it down!*

  Her body in Manchester didn’t react to the internal plea. It held the knife loosely at its side, turning slightly to look out the rain-streaked window. The reflection showed a face Mara knew intimately, yet its expression was unnervingly blank. Not hostile. Not anything. Just… present. Occupying space.

  The link crackled, fragmented. Mara (in Cambridge) was plunged into sensory deprivation again, then violently snapped back as her body took a step towards the hallway. Panic, pure and chemical, flooded the vat. She tried to seize control, to send the command *DROP IT*, but the signal felt like shouting into static.

  Then, another lightning strike. Closer. The lights in the Manchester flat flickered wildly. The link dissolved into pure noise – a screeching, tearing sensation in the Cambridge vat. Mara (in Cambridge) felt herself unraveling, dissolving into incoherent neural static.

  In Manchester, the lights surged back. Mara’s body flinched violently. The knife clattered to the floor.

  The link slammed back online, full bandwidth. Sensation roared back: the cold floor beneath bare feet, the pounding heart in the chest, the acrid smell of ozone, the weight of limbs, the sheer, overwhelming *terror* radiating from the vat in Cambridge.

  Mara gasped, a ragged sound pulled from lungs in Manchester, initiated by a brainstem reflex in Cambridge. She stumbled back, collapsing against the wall, sliding down until she sat on the floor, staring at the fallen knife. Her hands – *her* hands, trembling violently now – rose to cover her face. Sobs wracked her body, the heaving breaths syncing perfectly with the grief and terror screaming from the neural patterns in the tank.

  The link was pristine again. Cambridge issued commands; Manchester obeyed. The glitch was over. The system report would later cite localized EM interference from the storm.

  But Mara knew. She wasn't just *in* the tank. She wasn't just *in* the body. She wasn't just *in* the link. She was the fragile, dynamic coherence *across* them all. The knife hadn't been wielded by an autonomous body, nor by a disconnected brain hallucinating. It was wielded by a fragment—a body momentarily freed from centralized command, acting on residual impulses, environmental triggers, the raw physicality of holding an object when the conductor vanished. The self had momentarily shattered, its components acting independently. The horror wasn't just the action; it was the terrifying proof of her distributed existence. Her "I" depended utterly on the fidelity of the connection binding her disparate parts into one conscious stream. Without it, she wasn't relocated. She was diminished, fractured, less than whole.

  She stared at the knife on the floor. The storm raged outside. The hum of the link was steady, insistent. Mara (distributed, precarious, unified for now) took a deep, shuddering breath through lungs in Manchester, ordered by a brain in Cambridge, transmitted flawlessly across the invisible bridge between them. She picked up the phone, her Manchester fingers dialing the Cambridge tech line, her Cambridge voice forming the words: "Report a transient link degradation event. Code Amber. I… need to come home." Home wasn't Cambridge or Manchester. Home was the coherence. Home was the link holding her together.

  **Afterword:** My genuine philosophical view leans towards embodied cognition – the self arises *from* the dynamic interaction of brain, body, and environment; the brain-in-a-vat scenario fundamentally severs this, making the "self" a fragmented, impoverished shadow. The story takes liberties by implying the body can exhibit complex, context-aware behavior (picking up a knife) without central input, which is neurologistically implausible. It also dramatizes the *link itself* as a constituent part of the self, a contested interpretation prioritizing the *process* of connection over the physical substrates. The core horror – the terrifying disunity during the glitch – reflects my belief that a truly distributed self, reliant on a fragile technological bridge, is inherently vulnerable and existentially unsettling.
