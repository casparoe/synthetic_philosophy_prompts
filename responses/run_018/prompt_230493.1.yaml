  First, I need to break down each camp's position. The first camp is rooted in philosophy, emphasizing the logical paradox of simultaneously believing and disbelieving something. That's a definitional issue. The second camp, from psychology, relies on observable behaviors and mechanisms like confirmation bias, so their evidence is empirical. The third camp is redefining the term to avoid the paradox, which is more about semantics. 

