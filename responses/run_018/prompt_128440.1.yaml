  ## Analogical Engine

  The mind maps the new by the old it retrieves—  
  a shape in the clouds or a word's subtle sound.  
  **The surface repeats**, the pattern conceives.  

  A child calls all round things "ball," and believes,  
  till shadows deceive on the rain-slicked ground.  
  The mind maps the new by the old it retrieves.  

  That "chairness" we feel? The mind interweaves  
  shared legs and functions, a name we assign.  
  **The essence is elsewhere**, pure thought deceives.  

  A concept's just patterns the mind perceives,  
  a well-worn groove where thought runs around.  
  The mind maps the new by the old it retrieves.  

  A bell's meaning peels (or *peals*?), thought achieves  
  its sense through the echoes that context has found.  
  **The surface repeats**, the pattern retrieves.  

  By the end, what we grasp or what slips through the sieves?  
  Sticky clusters persist where the roots should abound—  
  **the surface repeats** where **the essence** resides?  
  The mind maps the new by the old it conceives.  

  ---

  **Analysis of Analogical Contamination:** The initial "surface repeats" (S1) is an objective statement. S2's "shadows deceive" contaminates the subsequent "essence is elsewhere" (S3) with doubt. S3's "a name we assign" makes the next "surface repeats" (S4) feel constructed. S4's sonic analogy ("peels/peals") causes the following "surface repeats" (S5) to blur with the adjacent "pattern retrieves" (a conceptual neighbor of "repeats"). Finally, the forced near-rhyme "sieves/achieves" and the shared vowel sounds in "repeats/resides" blend the refrains in the couplet, enacting the slippage where surface pattern and perceived essence become indistinguishable constructs.
