  The user might be worried they're rationalizing indifference. They want to be challenged. So, I should highlight the strongest points that could change their mind. Empirical evidence is key. If studies show unexpected neural complexity, that's hard to ignore. Also, the non-linear aggregation argument might make them reconsider the math. 

  I should structure the defeaters from fatal to awkward. Empirical evidence first, then conceptual arguments, then phylogenetic stuff. Unfalsifiability as a serious methodological issue. 

