prompt: |-
  So I teach adults to weld at a community shop, evenings, and I've been going around in circles on something for a couple of years. My brother-in-law finally told me the thing has a name — knowing how vs. knowing that — and then he said something I can't shake: he says knowing how is really just knowing a bunch of facts, and I said that's obviously wrong, and then I couldn't say why. I have zero academic background in anything, I've just got about forty students a year and I've noticed they split in ways I can't fit under one rule. So here are my verdicts, going on gut, and I want to know if there's a principle behind them.

  My uncle drives a stick shift, forty years, never stalls, and he could not tell you what a clutch does if you paid him. Knows how, doesn't know that. Fine, obvious case.

  A kid who's watched every welding video there is, can tell you the amperage for 1/8 rod, can recite the whole sequence, has never struck an arc. Knows that, does not know how. Also obvious.

  Guy who works at the plant and can run the setup perfectly by following the laminated checklist, but if anything is off — wrong fit-up, a gap, a breeze — he stops dead and waits for a supervisor. I want to say he knows how, but it feels like a thinner version than my uncle's.

  My old climbing instructor tied a figure-eight one-handed in the dark and told students to put the tail "through the little loop," and there are three little loops. Still obviously knows how. His description is just wrong.

  A concrete guy I know has a totally bogus story about why he adds the water the way he does — it's about the weather, he says, and it isn't — but he's right every time. Knows how, his explanation is nonsense.

  One of my better students can lay a beautiful bead with his jig and his auto-darkening hood, and take either one away and he's hopeless. I still say he knows how, but half the shop says the jig knows how, not him.

  The rusty case: a woman who rode bikes at twelve, didn't touch one for thirty years, wobbles for thirty seconds and then it's back. I want to say she knew how the whole time, even during the wobbling. Same with a piano piece my hands can still find that I couldn't tell you one note of.

  The one that makes me think my brother-in-law is just wrong: a tennis player who hits a fine backhand in a rally and completely falls apart the second he thinks about his grip, and a runner whose stride goes to hell when someone asks how her foot lands. If knowing how were facts in the head, adding the facts shouldn't wreck it.

  And the one I keep tripping on: a pitching coach with a destroyed shoulder. Can't throw. Can watch a kid for two minutes and fix them, and they get better. I want to say he knows how to pitch — more than the video kid does, even though neither one of them can do it.

  My tentative rule is something like: you know how to do X if (a) you can land it when conditions shift a bit, not just in the exact setup you learned it in, and (b) you could get a beginner closer to being able to do it, by showing rather than by handing over a list. I can see right away this is in trouble — the checklist guy flunks (a) and I still want to count him, and my gut says my jig student (case six) is a weaker case than the checklist guy even though on paper they're the same shape, and don't tell me they're the same case, I know they look identical, but one feels like knowing and one feels like the equipment knows.

  So: test my rule against these, tell me exactly where it breaks, and repair it into something precise — I want a principle where I can point at each clause and say which case earned it. Then use it on two I haven't settled. First, a student who can weld fine while I'm standing next to him talking him through it, but falls apart if I walk away — I'm not touching anything, he's doing it, but only with me in the room. Second, the very first time I ran a bead that came out right: did I know how before I did it, or did I aquire it in the doing?

  Take an actual position, please — don't lay out three candidate principles and leave me to pick; tell me which one you think is right and why, tell me which of my verdicts you'd overturn if you have to, and be honest about how confident you are and what would change your mind. Its fine to tell me I'm being inconsistent, just tell me which way to resolve it. And write it in plain American English, real sentences, no jargon I'd have to look up — if there's a technical term you need, explain it in the same breath.
reasoning: |-
  Okay, the user teaches welding to adults and is struggling with the distinction between "knowing how" and "knowing that." They've provided several examples and want a clear principle to distinguish between the two. Let me start by understanding their scenarios.

  First, their uncle who drives stick shift but can't explain the clutch. That's a classic case of knowing how without knowing that. Then there's the kid who knows all the facts about welding but hasn't done it—knowing that without knowing how. The checklist guy can perform tasks but only under strict conditions. The climbing instructor gives wrong instructions but can tie knots flawlessly. The concrete guy has a bogus explanation but gets results. The student relies on a jig and auto-darkening hood. The rusty biker and pianist retain skill after years. The tennis player and runner fail when overthinking. The pitching coach can't throw but can teach effectively.

  The user's tentative rule has two parts: handling varied conditions and teaching by showing. But they see issues. The checklist guy fails condition (a) but still seems to know how. The jig student might be weaker. They need a principle that accounts for these nuances.

  I recall Gilbert Ryle's distinction: "knowing that" is factual, while "knowing how" is procedural. But the user's examples show that procedural knowledge isn't just a collection of facts. The tennis player's failure when thinking indicates that over-relying on declarative knowledge can disrupt performance.

  The key might be adaptability and the ability to transfer skill. The uncle adapts to driving conditions without facts. The checklist guy can't adapt, so his knowledge is more fragile. The pitching coach has the mental model to correct others, even without physical ability. So maybe "knowing how" involves an internalized process that allows adjustment and teaching through demonstration.

  For the student who needs the instructor present, it's about dependency. The presence might provide confidence or cues, but without adaptability, it's partial knowledge. The first weld: success once doesn't mean they knew how before; the doing solidified it.

  So refining the principle: Knowing how means having a reliable, adaptable skill that isn't disrupted by minor changes and can be demonstrated or guided. The checklist guy has reliability but not adaptability, so partial. The jig student relies on tools excessively, so less internalized. The pitching coach's teaching ability shows deep understanding, even without physical execution.

  For the unsettled cases: The student who needs the instructor present has partial knowledge but lacks independence. The first bead—knowledge came during the doing, not before.
answer: |-
  Here's my take, clear and straight: your brother-in-law is wrong. "Knowing how" isn't just a pile of facts ("knowing that"). It's a different *kind* of knowledge – a **reliable, adaptable ability to perform an action successfully**, often without needing conscious thought about the facts. Facts *support* knowing how, but they aren't *the same thing* as knowing how. Your gut is mostly right.

  Here's the principle I propose, built from your insights and tested against your cases:
  **You "know how" to do X if you possess an internalized, reliable ability to perform X successfully across a reasonable range of expected variations in the task or environment, *without* needing step-by-step external guidance or conscious rule-following for the core actions.**

  Let's break that down clause-by-clause and test it against your cases:

  1.  **"Internalized, reliable ability"**: The skill is ingrained in *you*, not just in the instructions or tools. It's your body/mind system that executes it.
      *   *Uncle (Driving Stick):* **Yes.** His body knows, even if his mind can't explain.
      *   *Video Kid (Welding):* **No.** No internalized ability to *do* it.
      *   *Checklist Guy (Plant Setup):* **Partial.** Ability is reliable *only* when following the external checklist under perfect conditions. It's not fully internalized as *his* adaptable skill.
      *   *Climbing Instructor (Figure-Eight):* **Yes.** His hands know, even if his description is wrong.
      *   *Concrete Guy (Water):* **Yes.** His actions are reliably correct, even if his explanation is wrong.
      *   *Jig Student (Welding):* **Weak/Partial.** His ability is heavily dependent on specific tools acting as external guides/crutches. Remove them, and his internalized ability fails. Less internalized than the Checklist Guy who at least executes the steps himself.
      *   *Rusty Cases (Bike, Piano):* **Yes.** The internalized ability is dormant but quickly reactivated. The wobble is re-calibration, not absence of the ability.
      *   *Tennis Player/Runner:* **Yes (until they think).** They have the internalized ability *until* they try to replace it with conscious rule-following (facts).
      *   *Pitching Coach:* **Yes (for coaching).** His internalized understanding of the *kinesthetics and mechanics* is intact and reliable for *diagnosing and guiding others*, even if his shoulder can't physically execute it. He "knows how" to pitch *in the sense of understanding the action deeply enough to teach it*.
      *   *Student Needs You Talking:* **Weak/Partial.** Relies on your external verbal guidance as a crutch. The ability isn't fully internalized yet.
      *   *First Good Bead:* **No (before).** You acquired the internalized ability *in the doing*. Before that first bead, you had facts and maybe hope, but not the reliable ability.

  2.  **"Perform X successfully"**: You can actually *do* the thing and achieve the intended outcome.
      *   *Video Kid:* **No.** Can't do it.
      *   *Pitching Coach (Throwing):* **No (physically).** Can't perform the physical action.
      *   *All others (when conditions allow):* **Yes.** They can achieve the core outcome (driving, tying knot, laying bead, running stride, hitting backhand, etc.).

  3.  **"Across a reasonable range of expected variations"**: You can handle minor changes, problems, or imperfect conditions without failing or needing constant help. This is where adaptability lives.
      *   *Uncle:* **Yes.** Handles traffic, hills, different cars.
      *   *Checklist Guy:* **No.** Stops dead at any variation.
      *   *Climbing Instructor:* **Yes.** Does it one-handed, in the dark.
      *   *Concrete Guy:* **Yes.** Gets the water right despite his wrong story about *why* it works in different weather.
      *   *Jig Student:* **No.** Can't handle the variation of removing the jig/hood.
      *   *Rusty Cases:* **Yes (after recalibration).** Quickly adapts back.
      *   *Tennis Player/Runner:* **Yes (until they think).** Handles variations in the rally/run naturally.
      *   *Pitching Coach:* **Yes (for coaching).** Can diagnose and correct variations *in others'* pitching.
      *   *Student Needs You Talking:* **No.** Can't handle the variation of you *not* talking.
      *   *First Good Bead:* **N/A (for "before")** / **Yes (for that specific instance).** You handled the conditions *that time*.

  4.  **"Without needing step-by-step external guidance or conscious rule-following for the core actions"**: The skill runs mostly on autopilot, intuition, or ingrained habit. You aren't mentally reciting instructions for every move.
      *   *Uncle:* **Yes.** Shifts instinctively.
      *   *Video Kid:* **N/A (can't perform).** Would *need* rules if he tried.
      *   *Checklist Guy:* **No.** Absolutely relies on the external checklist for every step.
      *   *Climbing Instructor:* **Yes.** Ties it automatically.
      *   *Concrete Guy:* **Yes.** Adds water by feel/habit.
      *   *Jig Student:* **No (without tools).** Relies on the jig/hood as external guides enabling the action. *With* them, he might be automatic, but the reliance shows the skill isn't fully internalized *in him*.
      *   *Rusty Cases:* **Yes (after recalibration).** Once back, it's automatic again.
      *   *Tennis Player/Runner:* **Yes (until they think).** Normally automatic; thinking *introduces* rule-following that breaks it.
      *   *Pitching Coach:* **Yes (for coaching).** His diagnosis/instruction flows from his deep, internalized understanding, not from reciting a manual for each kid.
      *   *Student Needs You Talking:* **No.** Needs your external verbal step-by-step guidance.
      *   *First Good Bead:* **No (before).** You were likely intensely focused on rules/instructions.

  **Why Your Brother-in-law is Wrong & The Tennis Case Proves It:** If "knowing how" were just "knowing that" (facts), then *adding more facts* (thinking about your grip, footfall) should *help* or be neutral. But it demonstrably *wrecks* the performance because it disrupts the automatic, internalized *procedural* knowledge ("knowing how") and forces the system back into slow, clunky, conscious rule-following mode. Facts *describe* the skill; the skill itself is the *doing*.

  **Your Tentative Rule - Where It Breaks & How Mine Fixes It:**
  *   *(a) "land it when conditions shift"*: This is crucial (covered in my point #3). It correctly fails the Checklist Guy and Jig Student where your gut felt weak. It passes the Uncle, Concrete Guy, etc. **This part is solid.** The issue was you *wanted* to count the Checklist Guy. My principle explains why he's only borderline/partial – his knowledge is procedural but *fragile* and lacks adaptability because it's utterly dependent on external guidance (#4). He "knows how" *to follow the checklist*, not necessarily *to do the underlying task* robustly.
  *   *(b) "get a beginner closer by showing"*: This is insightful but not universal. Your Uncle might be a terrible teacher. The Concrete Guy gives bogus explanations. The Pitching Coach *excels* at this, but it's a *separate skill* (teaching) built *on top of* deep "knowing how". My principle focuses on the *performer's* ability, not their pedagogical skill. Teaching is strong *evidence* of deep "knowing how", but not strictly necessary for *having* it (e.g., your Uncle still knows how to drive).

  **Resolving the Jig Student vs. Checklist Guy Feeling:** They *are* similar in structure (reliance on external support), but your gut is right that the Checklist Guy feels stronger. Why? The Checklist Guy *executes the physical actions himself* based on the list. The Jig Student relies on tools that *actively perform parts of the skill for him* (positioning via jig, timing the hood). The jig removes the need for skill in positioning/angle; the auto-hood removes the need for skill in timing the head nod/flip. His reliance is on *automation*, not just instruction. Both lack adaptability (#3) and rely on externals (#4), but the Jig Student's knowledge is *thinner* because the tools do more of the core work. My principle captures this by emphasizing "perform X" and "core actions". The jig performs critical core actions *for* him.

  **Your Unsettled Cases Using the Principle:**

  1.  **Student who welds fine with you talking, falls apart if you leave:** This is **Partial/Weak "knowing how"**.
      *   *Internalized Ability?* Partial. He *can* perform successfully... *if* your verbal prompts act as his external guide/reassurance.
      *   *Successful Performance?* Yes, but only under the specific condition of your presence/talking.
      *   *Handle Variations?* **No.** The variation of you *not* talking/being there disrupts his ability completely. He cannot adapt to that change.
      *   *Needs External Guidance?* **Yes.** Absolutely relies on your step-by-step verbal guidance as a crutch for the core actions. He hasn't fully internalized the process.
      *   *Verdict:* He's developing the skill, but it's not yet robust or internalized enough to count as full "knowing how". He's reliant on your external support.

  2.  **Your very first good bead:** You **acquired "knowing how" in the doing**.
      *   *Before the Bead:* You had "knowing that" (facts, instructions, maybe watched others). You had *intent*. But you lacked the *internalized, reliable ability* to perform successfully. You couldn't demonstrate it. You couldn't have handled variations. You were likely intensely focused on rules (conscious rule-following). No performance = no "knowing how".
      *   *During/After the First Good Bead:* *That specific successful performance* demonstrated the *beginning* of the internalization process. You physically executed the core actions correctly *that time*. You adapted (perhaps imperfectly) to the conditions of *that* weld. You shifted (at least momentarily) from pure rule-following to successful execution. **That moment of successful doing *was* the acquisition of "knowing how" at its most basic, fragile level.** It proved the potential was realized. True robustness and adaptability came *with practice* after that.

  **My Confidence & What Could Change It:**
  I'm highly confident (90%) this principle accurately captures the core distinction between "knowing how" and "knowing that" as demonstrated by your real-world cases, resolving the tensions in your gut feelings and overturning your brother-in-law's claim. It aligns well with philosophical work (like Gilbert Ryle's "The Concept of Mind" which famously argued against "knowing how" being just "knowing that") and cognitive science on procedural vs. declarative memory.

  What would change my mind? If you presented a clear case where someone:
  1.  Could *reliably and adaptably perform* a complex physical skill *without* any prior physical practice or experience, purely based on memorized facts. (The Video Kid fails because he *can't* perform).
  2.  Had deep, adaptable "knowing how" but was *completely incapable* of demonstrating any aspect of it physically or guiding *anyone* in any way, *and* this wasn't due to a physical limitation like the Pitching Coach's shoulder. (Your Uncle can still *drive*, even if he can't explain).

  **Final Verdicts (Overturns in Bold):**
  *   Uncle: Knows How (✓)
  *   Video Kid: Knows That, Not How (✓)
  *   **Checklist Guy: Partial/Weak "Knows How" (Only to follow the checklist rigidly) [Overturns your "want to count him" to a weaker category]**
  *   Climbing Instructor: Knows How (✓)
  *   Concrete Guy: Knows How (✓)
  *   **Jig Student: Partial/Weak "Knows How" (Reliant on tools performing core actions) [Overturns your verdict to a weaker category]**
  *   Rusty Cases: Know How (✓)
  *   Tennis Player/Runner: Know How (until they overthink) (✓)
  *   Pitching Coach: Knows How (to understand/pitch well enough to teach effectively) (✓)
  *   Student Needs You Talking: Partial/Weak "Knows How"
  *   First Good Bead: Acquired "Knowing How" *in the doing*.

  This principle should give you a solid foundation to understand the different ways your students learn and why some "get it" more robustly than others. It's all about that internalized, adaptable ability to *do*.
