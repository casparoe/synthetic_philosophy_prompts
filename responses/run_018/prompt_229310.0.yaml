prompt: |-
  I was a chemist for 35 years, mostly spectroscopy, and since retiring I've fallen into philosophy of machine learning. I run a small reading group of other retired scientists, and we keep going around in circles about whether the "features" that interpretability tools pull out of neural networks—sparse autoencoders, linear probes, saliency maps—are really in the network, or are just useful summaries we impose on it. I'd like to set the group a take-home essay question that can't be answered by muttering "it depends what you mean by representation." Please write the question, a model answer of about 500 words, and a marking scheme out of 20. The scheme should seperate people who can (a) tell apart a claim about the network's internal states actually having content from a claim about our descriptions of those states being faithful, (b) say what would actually settle the dispute, and (c) resist the lazy move of treating every predictive success of an interpretability tool as automatic evidence for realism. I care less about whether they know the literature than whether they argue carefully. Apologies if I've mangled the philosophical vocabulary—I'm new at this.
reasoning: |-
  Okay, the user is a retired chemist with 35 years in spectroscopy who now leads a philosophy of ML reading group. They're struggling with whether interpretability tools reveal real "features" in neural networks or if these are just useful summaries we impose. They want an essay question that forces careful argumentation, avoiding vague answers like "it depends."

  Hmm, this is a classic realism vs. instrumentalism debate in philosophy of science, applied to ML. The user explicitly wants to avoid three pitfalls: (a) conflating internal states with our descriptions, (b) vagueness about empirical tests, and (c) equating predictive success with realism. Smart framing - they've identified the exact pain points in these discussions.

  The user's background in spectroscopy is interesting. They'd understand how scientific instruments measure phenomena indirectly, much like interpretability tools probe networks. But spectroscopy deals with physical properties (wavelengths, energy states), while NN "features" are abstract representations. That tension might inform their group's circular debates.

  For the essay, I'll need to:
  - Craft a question that forces position-taking ("defensible view" avoids fence-sitting)
  - Model answer must demonstrate (a) clear metaphysical distinction, (b) concrete falsifiability criteria, (c) critique of predictive success as proof
  - Marking scheme should reward precision on those three points, not just literature recall

  Key philosophical moves:
  1. For (a): Hammer the difference between causal role (realism) vs. descriptive utility (instrumentalism). Use analogies like "is a Fourier transform in the signal or in our math?"
  2. For (b): Demand specific testable predictions that distinguish the views. E.g., if features are real, altering them should have predictable, domain-general effects.
  3. For (c): Stress that good predictions can come from useful fictions (e.g., epicycles). Success only supports realism if coupled with unique predictions.

  The spectroscopy analogy might help: When they detected a spectral line, was the element "really there" or just a model-fitting artifact? They'd know it's real when multiple independent methods (mass spec, reactivity) converge. Similarly for NNs - triangulation via different interpretability tools could be evidence.

  Better avoid overloading with jargon though. User admitted being new to philosophy, so terms like "ontic" or "anti-realist" need clear grounding in examples.

  ...*brainstorming*...

  Final structure:
  - Essay question forces choosing realism or instrumentalism
  - Model answer picks realism (more fun to argue) but emphasizes falsifiability
  - Marking scheme heavily weights the three requested criteria
  - Extra credit for novel tests (e.g., adversarial attacks on interpretability tools)

  User's frustration with lazy philosophy is palpable. Respectful challenge: Their group might be stuck because they're scientists expecting definitive answers, while philosophy deals in reasoned arguments. The essay should reward good reasoning even if conclusions differ.
answer: |-
  Below is a bespoke essay assignment designed to cut through circular debates about neural network "features" by forcing precise argumentation on realism vs. instrumentalism. The model answer defends a specific position, but the marking scheme rewards cogent arguments for *any* view that rigorously addresses (a), (b), and (c).  

  ---

  ### **Essay Question**  
  **"When sparse autoencoders recover human-legible features from neural network activations (e.g., curve detectors in vision models), does this demonstrate that such features *exist as structured components of the network’s internal states*, or merely that they provide a *usefully faithful summary* for human interpreters? Defend a clear, falsifiable position."**  

  ---

  ### **Model Answer (Realist Position)**  
  The recovery of human-legible features (e.g., "curve detectors") via interpretability tools demonstrates that these features exist as structured components of the network’s internal states—not merely as summaries we impose. I defend this realist position through three arguments: causal robustness, architectural invariance, and counterfactual predictability.  

  First, features exhibit **causal robustness**: perturbing specific activation directions (e.g., via ablation) reliably degrades performance on tasks requiring that feature. If curve detectors were just descriptive summaries, we would not expect such precise, task-specific causal effects. For example, zeroing out curve-detecting activations in a vision model impairs curved-shape recognition but leaves straight-edge tasks intact. This mirrors how damaging a physical component (e.g., a resistor) disrupts a circuit’s function—evidence of real structure.  

  Second, features show **architectural invariance**: independently trained networks converge on similar activation patterns for identical features (e.g., curve detectors appear across ResNets, ViTs). Instrumentalism struggles to explain this consistency. If features were arbitrary summaries, we’d expect high variance in interpretability outputs across architectures. Their recurrence suggests networks discover shared ontological primitives of visual space.  

  Third, **counterfactual predictability** distinguishes realism. Given a feature direction (e.g., "cat ear" activations), we can synthetically generate inputs that selectively excite it, and these inputs align with human labels. Crucially, *false predictions* would falsify realism: if stimulating a "curve detector" produced non-curved images *and* the network still classified them as curves, the feature would be a descriptive artifact. Current tools pass this test.  

  Predictive success alone is insufficient evidence (addressing pitfall c): a Ptolemaic epicycle model predicts planetary motion but misrepresents reality. Here, robustness to adversarial tests (e.g., consistent feature behavior across distribution shifts) and mechanistic explanations (e.g., showing *how* curve detection emerges from weights) are what license realism. Settling the dispute requires interventions: if ablating a "feature" causes incoherent failures (e.g., impairing unrelated tasks), instrumentalism wins. Currently, evidence favors features as real computational entities.  

  (498 words)  

  ---

  ### **Marking Scheme (Total: 20)**  
  Assess clarity, argument precision, and engagement with pitfalls. Deduct points for vagueness, conflations, or reliance on "predictive success as proof."  

  #### **1. Distinguishing Claims (a) (6 points)**  
  - **6**: Explicitly separates *ontic claims* (features as causal components in the network) from *epistemic claims* (features as faithful human summaries). Uses examples (e.g., "curve detectors as vectors vs. curve detectors as labels").  
  - **4**: Identifies the distinction but conflates them under pressure (e.g., equivocates on "existence").  
  - **2**: Vague or circular (e.g., "features exist because we find them").  
  - **0**: No meaningful distinction.  

  #### **2. Empirical Settlement (b) (8 points)**  
  - **8**: Proposes *specific, falsifiable tests* that discriminate realism/instrumentalism (e.g., adversarial interventions: "If realism holds, ablating feature X should impair task Y but not Z"). Rejects unfalsifiable criteria.  
  - **6**: Identifies general evidence (e.g., "reproducibility") but lacks mechanistic specificity.  
  - **4**: Appeals to predictive success alone.  
  - **2**: Vague appeals to "future science."  
  - **0**: No engagement with evidence.  

  #### **3. Avoiding Lazy Predictive Success (c) (6 points)**  
  - **6**: Clearly argues that predictive success ≠ realism (e.g., analogizes to epicycles/ideal gases). Demands *additional criteria* (e.g., invariance, counterfactual stability).  
  - **4**: Notes the pitfall but lapses into using success as evidence.  
  - **2**: Uncritically treats predictive success as proof.  
  - **0**: Ignores the pitfall.  

  #### **Bonus (up to +2)**  
  - Insightful examples from outside ML (e.g., spectroscopy: "Is a spectral peak ‘real’ or a Fourier artifact?").  

  ---

  ### **Notes for Your Group**  
  - **Why this works**: The question forces a metaphysical stance ("exist as structured components" vs. "usefully faithful summary") and demands falsifiable criteria. The model answer avoids "it depends" by committing to a testable realist view.  
  - **Key nuance**: A top-scoring *instrumentalist* essay could argue that features are "faithful summaries" by emphasizing underdetermination (e.g., multiple SAEs fit the same activations) or interpreting invariance as human bias in tool design.  
  - **Pedagogical nudge**: Encourage analogies to their fields. E.g., in spectroscopy, is a "bond vibration peak" in the molecule or the detector? The answer hinges on intervention (e.g., isotopic substitution).  

  This framework rewards rigor over rote knowledge—exactly as requested. Let me know if your group needs a worked instrumentalist answer or refinement!
