answer: |-
  You've nailed a profound and under-discussed pathology in decision theory. What you're describing doesn't have a single universally established term, but it's recognized as a specific, vicious form of **self-referential undefinability** inherent to some resolutions of divergent expectation problems. Here's the breakdown, with a proposed name and clear boundaries:

  1.  **The Core Pattern:** You've identified it perfectly. Resolving a divergent expectation (St. Petersburg, Pasadena) by introducing a parameter `P` (cutoff `N`, discount rate `β`, risk-aversion weight `γ`, etc.) simply *shifts* the divergence problem. Evaluating the *choice* of `P` itself requires computing an expectation over the outcomes of using different `P` values. Crucially, **this meta-expectation often inherits the *same* mathematical structure that caused the original divergence**, rendering it undefined too.

  2.  **Proposed Term: Expectation Regress (or Divergence Regress)**
      *   **Why it fits:** It captures the recursive, self-perpetuating nature. The undefined expectation "regresses" to a higher level (the parameter choice), where it reappears intact. It emphasizes the *expectation* as the source of the problem propagating upward.
      *   **Specific Boundary Conditions:** Expectation Regress occurs *if and only if*:
          *   **A.** The original decision problem has an undefined expected utility due to divergence (conditional or unconditional).
          *   **B.** A resolution method `R` is proposed, parameterized by `P`.
          *   **C.** Evaluating the optimal choice of `P` requires computing an expected utility over possible `P` values.
          *   **D.** **Crucially:** The meta-expectation in (C) exhibits the *same type of mathematical divergence* (e.g., non-summability, conditional convergence to different values depending on order) as the original problem in (A), *when considered as a function of `P`*. This divergence must arise *from the structure inherited from the original problem*, not from an unrelated new pathology.

  3.  **Distinguishing from Normal Parameter Choice:**
      *   **Normal Parameter Choice:** The meta-expectation evaluating `P` is well-defined. Example: Choosing the mean `μ` for a Normal distribution prior based on a hyperprior. The hyperprior integrates to a finite expectation for `μ`, so there's a well-defined optimal `μ` (e.g., the mean of the hyperprior). The mathematical structure of the meta-problem (integrating a proper hyperprior) is fundamentally different and convergent.
      *   **Expectation Regress:** The meta-expectation for `P` diverges *in a way structurally identical* to the original problem. Examples:
          *   **Cutoff `N` for St. Petersburg:** The expected utility for playing with cutoff `N` grows without bound as `N` increases (`U(N) ≈ k * log₂(N)`). Choosing `N` requires maximizing `U(N)`, but `U(N)` diverges as `N→∞`. The meta-problem *is* the original problem mapped onto `N`. **Regress.**
          *   **Discount Factor `β` for St. Petersburg:** Suppose `U(β) = Σ (βⁿ * 2ⁿ⁻¹ * P(headsⁿ)) = Σ ( (β*2)ⁿ / 2 )`. This converges only if `β < 1/2`. But *why* choose `β = 1/2 - ε`? To evaluate `β`, you need the meta-utility `V(β) = U(β)`. `V(β)` blows up to infinity as `β` approaches `1/2` from below. Maximizing `V(β)` is undefined. **Regress.**
          *   **Risk-Weighting Parameter `γ` for Pasadena:** The Pasadena game's expectation is conditionally convergent (value depends on summation order). A risk-weighted utility might tangle with this conditional convergence. Evaluating different `γ` could involve comparing divergent or order-dependent meta-values, reproducing the Pasadena paradox at the meta-level. **Regress.**
      *   **Key Differentiator:** Does the meta-optimization problem (over `P`) possess the *same pathological convergence properties* as the original problem? If yes → Expectation Regress. If no → Normal Parameter Choice.

  4.  **Why "Regress" is Better than Alternatives:**
      *   **Infinite Regress:** Too broad. Applies to many non-expectation problems (e.g., "what caused the cause?").
      *   **Theory Underdetermination:** Too broad. Applies when multiple well-defined theories fit data.
      *   **Parameter Sensitivity:** Focuses on output variation, not the *undefinability* of the optimal choice itself.
      *   **Self-Defeating Resolution / Pathological Resolution:** Descriptive but not specific to the *expectation propagation*.
      *   **Expectation Regress** specifically highlights the *recursive failure of expectation maximization* due to structural inheritance. You're trying to maximize X, but the rule for finding the maximum of X requires maximizing X again under a trivial transformation.

  **In Summary:** You've identified **Expectation Regress** (or **Divergence Regress**): the phenomenon where attempting to resolve a divergent expected utility problem by parameterizing a solution method results in a meta-decision problem for choosing the parameter, and this meta-problem inherits the *exact same type of divergence* that plagued the original problem, rendering the resolution attempt fundamentally incomplete at the meta-level. This occurs precisely when the mathematical structure causing the original divergence is preserved in the mapping from the parameter `P` to the utility achieved by using `P`. Normal parameter choice problems lack this structural homology and have well-defined meta-expectations. This is why these paradoxes are so deeply troublesome – they resist *any* straightforward maximization framework.
