answer: |-
  You raise a crucial challenge, but you mischaracterize the function of karma. It does not instruct the fortunate to regard sufferers *as guilty*; it instructs them to regard suffering *as significant*. The child's present misery is the working out of past intent and action—yes, unseen, but not arbitrary. This isn't a courtroom verdict for others to wield judgmentally; it's the impersonal law of moral causation, akin to gravity acting on a body whose past trajectory we didn’t witness. We see the fall, not the push.

  Critically, karma *demands* compassion precisely because suffering—earned or unearned in *this* life—is real and painful *now*. The doctrine explicitly rejects indifference: if you see a child suffering, whether their karma or yours placed you there, your duty is to alleviate it. Your present compassion becomes *your* karma. The inability to inspect past lives doesn’t negate the principle any more than our inability to trace every genetic or environmental cause of suffering negates biology. We act on observable need. Karma explains *why* suffering exists in a moral universe; it doesn't excuse us from responding to it justly. To claim it licenses indifference ignores its core injunction: your present actions *matter*, and cruelty compounds debt.

  ---

  **Your rebuttal likely hinges on the practical social danger:** *Even if compassion is urged, doesn’t the belief in "earned suffering" inherently poison empathy by implying the victim "had it coming"? How can you deny this breeds quietism?*

  ---

  A fair concern, but it mistakes the doctrine's inner logic. Karma attributes the *condition* to past action, not the *present moral worth* of the sufferer. The child experiencing the fruit of past negative karma is *simultaneously* forming new karma through their endurance, innocence, or responses—karma that may be profoundly positive. Their current state is transient, not defining. True, history shows this concept *can* be twisted to justify caste or apathy—but the same is true of doctrines like predestination or "God's will." The abuse is a human failing, not a flaw in the law itself. The antidote lies *within* the teaching: since you cannot know another's exact karma, you must treat all suffering as a call to alleviate it. Your indifference would create your *own* negative karma. The universe balances moral accounts, but our role is active compassion, not passive accounting. What alternative metaphysics ensures suffering isn't meaningless while demanding we fight it?
