prompt: |-
  hey, i'm in lower sixth and i run this little lunchtime evolution reading group — there's about six of us, we've done speciation and some basic population genetics but basically no maths. i want to make one of those "which level does natural selection actually act at?" sorting quizzes for us to fill in before we argue about it, but everything i've found online either just announces that the gene is the unit of selection or drowns you in equations.

  what i'm after: a short quiz, 8 questions maximum, where every question is a concrete organism case with two or three answer options, plus a scoring key that sorts the answer patterns into the actual positions. but please build it from the logical space rather than from a list of names: give me the three or four separating questions your quiz is really asking underneath, the combinations of answers they allow, then locate the named positions in that space. tell me which combinations are empty and why nobody sits there (incoherent? just unattractive? merely unexplored?), and flag any two positions your quiz genuinely cannot separate rather than inventing a difference between them — if kin-style views and one flavour of group selection give the same verdict on every question you can think of, say that explicitly, that's the bit i'm most interested in.

  the cases need to be weird enough that we can't just guess the "right" answer from something we half remember. please use these three, plus at least two of your own:

  - a mutant gene that sabatoges the other copy of itself so it gets into way more than half the sperm, even though the males carrying it are less fertile overall — the gene spreads, the organism does worse
  - a colonial sea creature i basically made up: every colony starts from about twenty unrelated larvae that fuse into one colony, so cells inside a colony are no more related to each other than to cells in other colonies. some colonies carry a variant that makes their cells divide faster inside the colony, and those colonies are worse at producing new colonies. relatedness is basically zero here, so the kin route shouldn't be available at all
  - a learned bird-song dialect, nothing genetic: birds copy whichever dialect is most common around them, flocks singing one dialect survive droughts better than flocks singing another, but within any flock the birds singing the better dialect die slightly younger

  leaves i want on the tree: gene/replicator selectionism; the organism as the unit; inclusive-fitness or kin-style views; trait-group selection; and multi-level selection split into the version where the group's trait is only the average of its members' traits versus the version where the group has traits and a fitness of its own — i'm told these have different names but i don't care about the labels, just explain the difference. also species- or clade-level selection, the "it's all just bookkeeping, the levels aren't really separate claims" view, and whatever the deflationary no-unit-at-all / it's-just-lineages-proliferating position is called. if you find a combination that nobody actually holds, give it a leaf marked as undefended anyway and say what's wrong with it.

  rules: no question may ask which level someone likes, and no answer option should be "genes!" or "the group!" — every question should be answerable by someone who has never heard of the debate, as a claim about what actually happens in the case, so the quiz sorts us by what we say about the organisms. each leaf gets one sentence on the most awkward thing it's committed to. keep the biology readable for people who've done A-level and nothing past it, and please write the whole thing in British English.
reasoning: |-
  Okay, let me tackle this user's request. They're running an evolution reading group in lower sixth form, so they're likely around 16-17 years old with A-level biology knowledge. Their main goal is to create a sorting quiz about units of selection without heavy maths, using concrete case studies. 

  First, I need to understand their key requirements: a short quiz (max 8 questions) with organism-based scenarios, a scoring key that maps to theoretical positions, and clear explanations of how answers correspond to different views. The user specifically provided three case studies and wants me to add at least two more. 

  The theoretical framework needs to cover: gene selectionism, organism focus, kin selection, trait-group selection, multi-level selection (both averaging and emergent group traits), species selection, deflationary views, and any coherent but undefended positions. Crucially, I must avoid direct questions about "levels" and instead craft scenarios where answers reveal underlying theoretical commitments.

  Hmm... the user seems frustrated with existing resources being either dogmatic ("genes are the only unit!") or overly technical. They want the quiz to force genuine discussion by making cases ambiguous enough that participants can't just recall textbook answers. The colonial sea creature case is particularly interesting because it deliberately nullifies relatedness - that'll test if someone is truly committed to kin selection or just paying lip service.

  For my additional cases, I'm considering:
  - A host-parasite coevolution scenario (tests how they handle fitness conflicts between entities)
  - A frequency-dependent predation case (examines whether group composition affects selection differently from individual traits)

  The scoring key needs to map answer combinations to positions while acknowledging where theories overlap. For example, kin selection and certain group selection models often make identical predictions - I should explicitly flag that rather than pretending they're distinct. The user specifically wants to know which views the quiz can't differentiate.

  I'll structure it as:
  1) Quiz questions with multiple-choice scenarios
  2) Scoring guide showing how answer patterns map to theories
  3) "Leaf" descriptions explaining each position's commitments and problematic cases
  4) A diagram showing theoretical space (optional but helpful)

  Language must be British English ("favour" not "favor", "plough" not "plow") and avoid jargon. When explaining awkward commitments, I'll use their phrasing - e.g. for gene selectionism: "admits organisms sometimes lose when genes win".

  Biggest challenge is making the cases "weird enough" to prevent guessing. The bird song dialect case is perfect - cultural trait with opposing individual/group fitness. I'll ensure my added cases have similar twists. Also need to confirm all positions are distinguishable; if not, I'll group them as the user requested.
answer: |-
  Here’s a quiz designed to map your group’s intuitions onto the units of selection debate, built from logical distinctions. It uses 5 core questions, each isolating a key conceptual fork. The scoring key reveals which combinations of answers are coherent and where major theories sit – including overlaps and undefended positions.

  **The "Where Does Selection Cut?" Quiz**

  *Read each scenario carefully. For each question, pick the ONE answer (A or B) that best reflects your view of what’s happening.*

  1.  **"The Sneaky Gene" (Your Case 1):** A mutant gene in mice causes males carrying it to produce sperm where *this specific gene copy* sabotages the other copy (at the same locus) on the same chromosome. Males with this gene are less fertile overall (produce fewer viable sperm), but *the mutant gene itself* gets into over 80% of the functional sperm they do produce (instead of the expected 50%). Over generations, the mutant gene becomes more common in the population.
      *   **(A)** The gene spreads *because* it directly benefits itself by outcompeting its rival copy within the sperm cell, even though this harms the individual mouse carrying it. Selection acted directly on the gene variant.
      *   **(B)** The gene spreads *despite* harming the individual mouse. While the gene manipulates meiosis, selection ultimately acted on the *consequence* – reduced male fertility – at the organism level, favouring the *absence* of the gene. Its spread is a fluke or requires other factors.

  2.  **"The Fraternal Colonies" (Your Case 2):** A colonial sea squirt forms when ~20 unrelated larvae fuse into one body (colony). Cells within a colony are no more related than cells in neighbouring colonies. A heritable variant arises causing cells *within a colony* to divide faster. Colonies with this variant grow larger slightly faster but are significantly *worse* at producing and dispersing viable larvae to form new colonies (their group fitness is lower). The variant spreads within the population.
      *   **(A)** Selection favoured the variant *within* colonies: faster-dividing cell lines outcompete slower ones inside each colony body. The colony-level cost is an unfortunate side-effect. Selection acted directly among cells/cell lines.
      *   **(B)** Selection acted *on the colonies as wholes*. Colonies with the variant have lower fitness (produce fewer new colonies), so the variant *should* be selected against. Its spread requires an explanation *other* than colony-level selection (e.g., strong within-colony selection overpowering it).

  3.  **"The Costly Dialect" (Your Case 3):** In a finch species, males learn their song dialect by copying the most common local song after fledging. Dialects aren't genetic. One dialect ('Dry') is slightly more energetically costly to sing. Within *any single flock* singing the same dialect, males singing 'Dry' die slightly younger on average than males singing the local alternative ('Wet'). However, flocks where 'Dry' is the dominant dialect survive droughts much better than flocks where 'Wet' is dominant. Over time, the 'Dry' dialect becomes more common across the species' range after a series of droughts.
      *   **(A)** Selection acted on the flocks. Flocks using the 'Dry' dialect had higher survival during droughts (group fitness). The lower survival of *individual* 'Dry' singers within flocks is irrelevant; what matters is the flock-level trait and its consequence.
      *   **(B)** Selection acted on individual birds learning the dialect. Birds copying the locally common song (whether 'Dry' or 'Wet') were favoured. 'Dry' spread because, *after* droughts, flocks with surviving 'Dry' singers became the common source for copying. The group survival difference is a *result* of individual learning choices, not a cause.

  4.  **"The Cooperative Prey" (New Case):** Gazelles in a herd face cheetah attacks. A heritable tendency arises to perform a specific, conspicuous "stotting" jump when a predator approaches. Stotting slightly increases *that individual's* immediate risk of being caught *but* reliably signals the predator's presence to the whole herd, significantly improving the herd's overall escape rate. Herds with a higher *proportion* of stotters have higher average individual survival (due to fewer successful attacks). The stotting trait spreads.
      *   **(A)** Selection favoured the stotting trait *because* herds with more stotters had higher fitness (survival). The trait spread due to this group-level advantage, even with the individual cost.
      *   **(B)** Selection favoured the stotting trait *despite* the individual cost *if* stotters were sufficiently related to the herd members they saved (kin selection). If relatedness is very low, the trait shouldn't spread without another explanation. Selection acts on the individual's inclusive fitness.

  5.  **"The Evolving Ecosystem" (New Case):** Two types of plant species exist in an ecosystem: "Fast" species (rapid growth, short-lived, poor competitors) and "Slow" species (slow growth, long-lived, strong competitors). A slow climate change occurs, favouring faster life cycles. We observe that over millennia, the *clade* (evolutionary lineage) containing *only* Fast species diversifies into many more species and occupies more area, while the Slow clade stagnates. However, *within any local patch* during this change, Slow individuals consistently outcompete and replace Fast individuals whenever they co-occur.
      *   **(A)** Selection acted on the species/clades. The Fast *clade* had higher diversification/survival rates in the changing environment. The local competitive success of Slow *individuals* is irrelevant to this long-term, large-scale pattern.
      *   **(B)** The pattern is explained entirely by selection on individual plants within populations. Slow individuals outcompete Fast ones locally. The success of the Fast clade is just the summed result of Fast species occasionally colonizing disturbed/new areas where they briefly thrive before being outcompeted – no selection *on* species or clades as entities.

  ---

  **Scoring Key: Mapping Your Answers to the Theoretical Landscape**

  The quiz isolates four core, logically distinct questions underlying the debate:

  1.  **Q1:** Does selection *ever* act *directly* on entities below the organism (genes/cells), favouring traits that benefit *themselves* even at a cost to the organism? (Yes = A1, No = B1)
  2.  **Q2 (Fraternal Colonies):** Can selection act *directly* on groups (colonies/flocks) as cohesive units, favouring group-level traits *even when* there is no significant relatedness (kinship) among group members? (Yes = A2, No = B2)
  3.  **Q3 (Costly Dialect) & Q4 (Cooperative Prey):** Does the *group-level consequence* of a trait (flock survival, average herd survival) *ever* be the *direct cause* of the trait's spread, independent of how it arose or its effect on individual fitness within a group? Or is the spread *always* explained by the net effect on the fitness of individuals (or their genes), considering *all* consequences (including effects on relatives)? (Group cause = A3/A4, Individual cause = B3/B4)
  4.  **Q5 (Evolving Ecosystem):** Does selection *ever* act *directly* on entities above the organism (species, clades), favouring traits defined at that level, independent of selection within populations? (Yes = A5, No = B5)

  **Your Answer Pattern & Interpretation:**

  Find your combination below. Positions sharing the same verdicts are grouped. The "Most Awkward Commitment" highlights a key challenge for each view.

  *   **A1, B2, B3/B4, B5: Strict Gene/Replicator Selectionism**
      *   *Views:* Dawkins-style replicator theory. Organisms, groups, species are vehicles.
      *   *Logic:* Selection only acts directly on replicators (genes, memes). Effects at higher levels are outcomes. Low relatedness (Q2) blocks group advantage explanations (A2 impossible). Group-level benefits (Q3/Q4) only count if they boost individual replicator transmission (inclusive fitness). Species/clade patterns (Q5) are summed results.
      *   *Most Awkward Commitment:* Must explain group-advantage traits that spread *without* kinship (like Fraternal Colonies) solely as side-effects of within-group competition or mutation pressure, even when disadvantageous at the group level.

  *   **B1, B2, B3/B4, B5: Organism as the Unit of Selection**
      *   *Views:* Traditional Darwinism, Williams' early view.
      *   *Logic:* Selection acts directly on individual organisms. Genes are selected *through* their effects on organism fitness. Groups/species aren't units. Group advantage (A3/A4) or clade success (A5) must be reducible to organism fitness consequences. Low relatedness (B2) blocks any group selection explanation.
      *   *Most Awkward Commitment:* Explaining "Sneaky Gene" (A1) – must argue the gene spread *despite* harming the organism, perhaps via drift or linkage, denying the gene-level advantage is causal. Also struggles with Fraternal Colonies spread.

  *   **B1, B2, A3/A4, B5: Kin Selection / Inclusive Fitness**
      *   *Views:* Hamilton, Maynard Smith, modern synthesis extension.
      *   *Logic:* Selection acts on individuals (or their genes), but fitness includes effects on relatives (inclusive fitness). Explains cooperation/altruism *with* relatedness. Rejects sub-organismal (B1) and supra-organismal (B5) selection without relatedness. *Crucially overlaps with next group on Q1, Q2, Q5.* **Cannot be distinguished from Trait-Group Selection by this quiz on these cases.** Difference is formalism, not predictions for these scenarios. A3/A4 is valid *if* the benefit is to relatives (Q4 B covers this nuance).
      *   *Most Awkward Commitment:* Explaining Fraternal Colonies (A2) – must argue the variant spreads solely via within-colony competition (cell-level selection), denying any role for colony-level disadvantage, or find subtle relatedness.

  *   **B1, A2, A3/A4, B5: Trait-Group Selection & Multi-Level Selection 1 (Group Trait = Average)**
      *   *Views:* Wilson (DS), structured deme models, "old"/"naive" group selection. MLS1.
      *   *Logic:* Selection can act directly on groups as units *if* groups vary in traits affecting their survival/reproduction *and* groups with different traits "reproduce" differentially (e.g., colonies produce larvae, flocks persist). Group trait is usually the average/aggregate of member traits. Doesn't require kinship (A2 valid). Rejects gene-level (B1) and species-level (B5) selection. **Predicts the same outcomes as Kin Selection for Q1, Q2, Q3/Q4, Q5 on these cases.** Difference is whether "group fitness" is a useful causal concept.
      *   *Most Awkward Commitment:* Explaining "Sneaky Gene" – same as Organism view. Also, specifying what constitutes a "group" with its own fitness.

  *   **B1, A2, A3/A4, A5: Multi-Level Selection 2 (Emergent Group Traits) & Strong Group Selection**
      *   *Views:* MLS2 (Damuth, Heisler), some interpretations of Wynne-Edwards. Species Selection.
      *   *Logic:* Accepts group selection without kinship (A2). Accepts species/clade selection (A5) – entities at these levels have heritable traits (e.g., speciation rate, geographic range) and differential birth/death. Group traits can be *emergent* properties not reducible to averages (e.g., colony structure, flock coordination). Rejects gene-level selection (B1).
      *   *Most Awkward Commitment:* Defining clear, heritable, emergent group-level traits distinct from individual traits, especially for species selection. Explaining "Sneaky Gene" (B1).

  *   **A1, A2, A3/A4, A5: Radical Multi-Level Selection / "It Depends"**
      *   *Views:* Rare, perhaps Okasha's pluralism pushed hard. "Levels are real and selection cuts where it cuts."
      *   *Logic:* Selection can potentially act directly at any level (gene, cell, organism, group, species) if the right conditions (heritability, variation, fitness differences) exist there. The unit varies case-by-case.
      *   *Most Awkward Commitment:* Avoiding incoherence; must clearly define units/fitness at each level and avoid double-counting. Explaining why gene-level selection isn't *always* primary.

  *   **B1, B2, B3/B4, A5: Species Selection Only**
      *   *Views:* Very rare/non-existent coherent position.
      *   *Logic:* Rejects sub-organismal (B1), group-without-kinship (B2), and group-fitness-as-cause (B3/B4) selection. *Only* accepts species/clade level selection (A5).
      *   *Why Undefended?* Incoherent with modern biology. Denies well-established phenomena like meiotic drive (A1), adaptive evolution within species (organism level), and potentially kin-selected altruism (requires B4). Cannot explain most adaptive evolution.

  *   **A1, A2, B3/B4, B5: Gene + Individual Cell Selection Only**
      *   *Views:* Undefended or misapplication.
      *   *Logic:* Accepts sub-organismal (A1) and within-group/cell-level (A2) selection, but denies group-level consequences can *cause* trait spread (B3/B4) and species selection (B5).
      *   *Why Undefended?* Inconsistent. Accepts selection on cells in colonies (A2, Fraternal Colonies) *which is a form of within-group selection*, but then denies that group-level consequences (like average survival in herds/flocks) can be causal (B3/B4). Why accept one within-group selection but not the causal relevance of consequences in another?

  *   **All B's: Deflationary / Lineage Proliferation / "Bookkeeping"**
      *   *Views:* "It's just differential persistence of lineages" (G.C. Williams minimalism), some population genetics perspectives.
      *   *Logic:* Talk of "units" is misleading shorthand. Selection is a population-level statistical outcome of differential survival and reproduction of hereditary information across generations. "Genes", "organisms", "groups" are just different ways the hereditary information is packaged and persists. The fundamental process is the same. Bookkeeping can be done at any convenient level, but no level has causal primacy.
      *   *Most Awkward Commitment:* Explaining *why* certain packages (like selfish genes harming organisms, or altruistic traits in low-relatedness groups) persist or spread without invoking benefit *at the level of the persistent package*. Can feel like avoiding the interesting causal questions.

  **Key Overlaps & Distinctions:**

  *   **Kin Selection (B1,B2,B3/B4,B5) vs. Trait-Group/MLS1 (B1,A2,A3/A4,B5):** *This quiz cannot distinguish them* based on the cases provided. They predict the same answers for Q1, Q3/Q4, Q5. They differ *only* on Q2 (Fraternal Colonies). Kin Selection says B2 (No group selection w/o kinship), Trait-Group/MLS1 says A2 (Yes). **Your answer to Q2 sorts you into one or the other.** They are mathematically equivalent for many models; the difference is conceptual framing.
  *   **Organism (B1,B2,B3/B4,B5) vs. Deflationary (All B):** The Deflationary view encompasses the Organism view but goes further, denying causal primacy to *any* level. All B's could fit either, but the Organism view sees the organism as the *primary* unit, while the Deflationary view sees it as merely one level of description.
  *   **Gene Selectionism (A1,B2,B3/B4,B5) is distinct:** Only it accepts A1 (direct gene-level selection).
  *   **MLS2/Strong Group+Species (B1,A2,A3/A4,A5) is distinct:** Only it accepts A5 (species/clade selection).
  *   **Radical MLS (A1,A2,A3/A4,A5):** Only position accepting direct selection at all levels simultaneously.

  **Tips for Your Group Discussion:**

  1.  **Focus on the Biology:** Argue about *what happens in the case*, not the labels. "Why do you think A2 is right for the sea squirts?"
  2.  **Mind the Overlaps:** Don't get bogged down arguing Kin vs. Trait-Group if you agree on A2/B2. Acknowledge their equivalence for many predictions.
  3.  **Challenge Commitments:** Use the "Most Awkward Commitment" points. "If you're a Gene Selectionist, how *do* you explain the sea squirt variant spreading?"
  4.  **Consider the Deflationary View:** Does framing things purely as "lineage proliferation" resolve the arguments or feel unsatisfying?
  5.  **Weird Cases Rule:** The sea squirt (Q2) and bird song (Q3) cases are particularly potent for forcing distinctions. Lean into them.

  This quiz provides a structured way to map your group's intuitions onto the complex logical space of the units of selection debate, highlighting both the clear divides and the significant areas of overlap between major theories. Enjoy the argument!
