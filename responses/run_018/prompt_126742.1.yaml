answer: |-
  ### Decision Procedure for Determining Protected Status of Historic Structures  
  **Grounding in Philosophical Concepts:**  
  - **Tolerance Conditions**: Small changes (e.g., replacing one plank) may not alter identity, but cumulative changes can.  
  - **Sharp but Unknown Boundaries (Epistemicism)**: A precise threshold exists but is unknowable; we use administrative thresholds for practicality.  
  - **Epistemic vs. Ontic Vagueness**: Uncertainty may stem from human ignorance (epistemic) or inherent indeterminacy (ontic). The procedure defaults to epistemic thresholds but flags cases where ontic vagueness dominates.  
  - **Failure of Bivalence**: Borderline cases defy true/false categorization; these are referred to a review board.  

  **Ordered Checklist**  
  *Officers must answer each question sequentially. Verdicts are definitive only when all criteria align clearly; otherwise, refer borderline cases.*  

  #### **Step 1: Material Continuity**  
  **Question:** *What proportion of the original material remains, and are critical structural elements (e.g., foundation, load-bearing parts) preserved?*  
  - **Sufficient for Continuity**: ≥90% original material, OR 30–90% with critical elements intact.  
  - **Sufficient for Discontinuity**: ≤30% original material AND critical elements compromised.  
  - **Borderline**: 30–90% without critical elements OR ≤30% with critical elements intact.  
  - **Philosophical Commitment**: Epistemicism (sharp boundary approximated by 30%/90% thresholds). Proceed to Step 2 if borderline.  

  #### **Step 2: Functional Design**  
  **Question:** *Does the structure retain its original purpose, form, and design integrity (e.g., unchanged blueprint, aesthetics, engineering)?*  
  - **Sufficient for Continuity**: Unaltered function/form (e.g., still a bridge with original dimensions).  
  - **Sufficient for Discontinuity**: Fundamental redesign (e.g., bridge converted to a walkway with new materials).  
  - **Borderline**: Partial alterations (e.g., modern reinforcements that don’t change outward function).  
  - **Philosophical Commitment**: Tolerance conditions (small functional changes tolerated; large ones break continuity). Proceed to Step 3.  

  #### **Step 3: Temporal Interruption**  
  **Question:** *Was the structure ever fully destroyed or removed from its site for >1 year?*  
  - **Sufficient for Continuity**: No interruption (continuous presence, even during repairs).  
  - **Sufficient for Discontinuity**: Complete destruction/removal with >1 year gap.  
  - **Borderline**: Partial destruction (e.g., fire damage with immediate rebuilding) or gaps <1 year.  
  - **Philosophical Commitment**: Epistemicism (arbitrary 1-year threshold for administrative clarity). Proceed to Step 4.  

  #### **Step 4: Community Identification**  
  **Question:** *Is the structure consistently recognized as "the original" in historical records and local collective memory?*  
  - **Sufficient for Continuity**: Unbroken documentation and community acknowledgment.  
  - **Sufficient for Discontinuity**: Explicit historical/community rejection of authenticity.  
  - **Borderline**: Conflicting records or shifts in perception.  
  - **Philosophical Commitment**: Social ontology (identity depends on collective intentionality).  

  ---

  ### **Determination Rules**  
  Apply after all steps:  
  1. **Protected**:  
     - Material Continuity ≥90% **AND** Functional Design/Temporal Interruption/Community Identification all *sufficient for continuity* or borderline.  
     - Material Continuity 30–90% **AND** ≥2 of Functional Design/Temporal Interruption/Community Identification *sufficient for continuity* **AND** none *sufficient for discontinuity*.  

  2. **Not Protected**:  
     - Material Continuity ≤30% **AND** Functional Design/Temporal Interruption/Community Identification not all *sufficient for continuity*.  
     - Material Continuity 30–90% **AND** ≥2 of Functional Design/Temporal Interruption/Community Identification *sufficient for discontinuity*.  

  3. **Borderline (Refer to Review Board)**:  
     - Material Continuity ≤30% **AND** all other factors *sufficient for continuity*.  
     - Material Continuity 30–90% **AND** mixed factors (e.g., 1 sufficient for continuity, 1 sufficient for discontinuity, 1 borderline).  
     - **Philosophical Reason**: Failure of bivalence (ontic vagueness). Competing theories (e.g., supervaluationism vs. epistemicism) yield opposite outcomes.  

  ---

  ### **Application to Test Cases**  
  #### **(i) Wooden Bridge (60% planks replaced; original arch, foundation, alignment intact)**  
  - **Step 1**: Material Continuity = 40% (borderline; critical elements intact).  
  - **Step 2**: Functional Design = *Sufficient for continuity* (original form/function unchanged).  
  - **Step 3**: Temporal Interruption = *Sufficient for continuity* (no interruption).  
  - **Step 4**: Community Identification = *Sufficient for continuity* (assumed consistent).  
  - **Verdict**: **Protected** (Material Continuity borderline, but ≥2 other factors sufficient).  
  - **Philosophical Note**: Epistemicism permits this outcome; supervaluationism might block it if "critical elements" are vaguely defined.  

  #### **(ii) Bridge Destroyed by Fire, Rebuilt with Salvaged Timber + Modern Reinforcement (never fully absent)**  
  - **Step 1**: Material Continuity = ≤30% (salvaged timber only; critical elements compromised).  
  - **Step 2**: Functional Design = *Sufficient for continuity* (original blueprints used).  
  - **Step 3**: Temporal Interruption = *Borderline* (destroyed but rebuilt immediately; gap <1 year).  
  - **Step 4**: Community Identification = *Sufficient for continuity* (assumed consistent).  
  - **Verdict**: **Borderline** (Material Continuity ≤30% **AND** all other factors sufficient/not negative). **Refer to review board**.  
  - **Authority Dislikes This**: The authority may prefer "protected" due to symbolic value, but the procedure flags material discontinuity.  
  - **Philosophical Conflict**: Epistemicism allows discontinuity verdict; supervaluationism requires considering all precisifications (some preserve identity).  

  #### **(iii) Bridge with No Plank >50 Years Old (200-year continuous maintenance)**  
  - **Step 1**: Material Continuity = 0% (≤30%; critical elements replaced).  
  - **Step 2**: Functional Design = *Sufficient for continuity* (unchanged purpose/form).  
  - **Step 3**: Temporal Interruption = *Sufficient for continuity* (no demolition).  
  - **Step 4**: Community Identification = *Sufficient for continuity* (consistent records).  
  - **Verdict**: **Borderline** (Material Continuity ≤30% **AND** all other factors sufficient). **Refer to review board**.  
  - **Philosophical Note**: Sorites paradox exemplified; tolerance conditions conflict with material discontinuity.  

  ---

  ### **Unresolvable Borderline Cases (Must Be Referred)**  
  The procedure **cannot settle**:  
  1. **"Theseus’s Ship" Scenarios**: Gradual replacement where Material Continuity ≤30% **but** all other factors strongly favor continuity (Step 1 low + Steps 2–4 sufficient).  
     - *Reason*: Epistemicism sees discontinuity; supervaluationism/ontic vagueness allows continuity.  
  2. **Mixed-Factor Ambiguity**: Material Continuity 30–90% **with** one factor sufficient for continuity, one sufficient for discontinuity, and one borderline.  
     - *Reason*: Bivalence failure; no theory objectively resolves competing criteria.  
  3. **High Material Continuity with Critical Negative Factor**: Material Continuity ≥90% **but** one factor (e.g., Community Identification) sufficient for discontinuity.  
     - *Reason*: Epistemicism would permit discontinuity; supervaluationism might not.  

  **Final Output**: A preservation officer issues "Protected" or "Not Protected" only in clear cases (aligned thresholds). All borderline cases escalate to a values-based review board for contextual resolution (e.g., historical significance, community sentiment). This acknowledges vagueness while ensuring defensible administrative rulings.
