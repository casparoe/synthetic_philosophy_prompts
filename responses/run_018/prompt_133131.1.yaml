  Here's a full exam package tailored to your scene, complete with thunderstorm ambiance, the "shadow honor" twist, and a clear marking scheme. The model answer deliberately avoids citations as requested.

  ---

  **PhD Comprehensive Examination: Moral Philosophy**  
  **Time Allowed:** 90 Minutes  
  **Conditions:** The flickering overhead lights cast long shadows as thunder rattles the windows. Power may fail. Write legibly.  

  **QUESTION (Total: 25 Marks):**  

  > Bernard Williams and Kwame Anthony Appiah offer competing accounts of how moral revolutions (like the collapses of slavery and dueling) occur: through rational argument, changing material interests, or shifts in "honor" (social prestige/contempt). **Your task:** Using *dueling* as your primary case study, evaluate whether its disappearance represents a *genuine abolition of the underlying norm* or merely a *transformation in its expression*.  
  >  
  > **Crucially, integrate the concept of "SHADOW HONOR":** The argument that the prestige structures central to dueling (courage, status assertion, elite defiance of consequence) didn't vanish but *migrated* into modern contexts, notably high-stakes corporate risk-taking culture (hostile takeovers, aggressive investment, "disruptive" entrepreneurship).  
  >  
  > **Argue whether "shadow honor" proves:**  
  > (a) Williams/Appiah understate norm *persistence*, showing honor just changed costume, OR  
  > (b) The migration fundamentally alters the norm's *moral character*, making it distinct.  
  >  
  > **Avoid mere summary.** Focus on the implications of "shadow honor" for understanding moral revolutions.  

  ---

  **MODEL ANSWER (Approx. 650 words):**  

  The collapse of dueling is often hailed as a moral revolution – the triumph of Enlightenment reason over barbaric honor. Williams roots this in the erosion of dueling's *intelligibility* as a practice within a changing "ethical life," while Appiah emphasizes the collapse of the *honor code* that sustained it, as elites faced growing social *contempt* for bloodshed over trivial slights. Both suggest the *norm itself died*. However, the "shadow honor" thesis throws this into radical doubt. It posits that the core prestige structure – the valorization of defiant risk-taking to assert status and dominance – didn't die; it went underground, resurfacing in the seemingly rational world of modern corporate competition. This forces us to ask: was the revolution skin-deep?

  If "shadow honor" holds water, it significantly complicates Williams and Appiah. Williams argues practices die when they lose their *point* within a society's web of meanings. But what if the *point* – demonstrating pre-eminence through fearless, consequential action – simply found a new, less overtly violent expression? The duelist risked death for personal honor; the corporate raider risks financial ruin (or others' livelihoods) for market dominance and personal fortune. The adrenaline, the calculated brinkmanship, the admiration (or fear) garnered from peers for "bold moves" – these mirror the duelist's social calculus. The *object* changed (money vs. personal insult), and the *immediate violence* vanished, but the underlying *impulse* – using high-stakes risk to accrue prestige within an elite hierarchy – exhibits startling continuity. This suggests Williams might mistake a *relocation* of intelligibility for its *disappearance*.

  Appiah's focus on shifting honor codes seems better equipped, yet "shadow honor" challenges its finality. Appiah notes elites abandoned dueling when it became contemptible, damaging their desired image. But did the craving for honor *via risk* disappear, or just the *method*? Corporate risk-taking isn't met with contempt; it's often celebrated as "visionary" or "gutsy." The boardroom battle or leveraged buyout becomes the new field of honor. The *expression* shifted to align with a society valuing economic prowess over martial prowess, but the core dynamic – competitive risk for status – persists. This implies Appiah's revolution wasn't the death of the honor-seeking *drive* linked to risk, but a *re-channelling* of it into a socially acceptable (even lauded) domain. The honor code didn't collapse; it got a makeover.

  Does this migration fundamentally alter the norm's *moral character*? Proponents of a true revolution might argue yes: corporate risk operates within legal frameworks, aims (ostensibly) at economic growth, and lacks direct, intentional bodily harm. However, "shadow honor" reveals unsettling parallels. The harms of reckless corporate action – mass layoffs, market destabilization, community devastation – while indirect and systemic, can be profound. The *disregard for consequence* in pursuit of personal or factional glory echoes the duelist's focus on personal honor above societal peace. The *moral myopia* persists, even if the weapon is a hostile tender offer, not a pistol. The migration sanitizes the violence but arguably perpetuates a similar ethos of elite entitlement and status-seeking through destructive competition.

  Therefore, "shadow honor" strongly suggests that Williams and Appiah, while explaining the *mechanism* of dueling's demise (loss of intelligibility, shift in contempt patterns), potentially overstate the *extinction* of the underlying norm. The prestige structure of defiant, status-conferring risk-taking proved remarkably adaptable. It migrated into the corporate sphere, adopting a rational, economic costume. This doesn't negate the moral progress in abolishing ritualized killing. However, it reveals a disquieting truth: the *impulse* driving dueling – the valorization of high-stakes, self-aggrandizing defiance – didn't vanish in a true revolution. It evolved, finding fertile ground in a new arena where its harms are diffused, systemic, and thus harder to condemn with the moral clarity applied to a pistol shot at dawn. The honor didn't die; it put on a suit and tie.

  ---

  **MARKING SCHEME (Out of 25):**

  *   **A-Grade (21-25):** Demonstrates exceptional understanding.
      *   **Must Hit:** Seamlessly integrates "shadow honor" as central to the argument, not an add-on. Explicitly compares/contrasts its implications for BOTH Williams *and* Appiah's frameworks. Develops a clear, sustained argument about whether the norm *died* or *transformed*.
      *   **Must Hit:** Offers a nuanced evaluation of whether the migration to corporate culture *fundamentally alters the norm's moral character*. Avoids simplistic "it's exactly the same" or "it's completely different." Grapples with the complexity (e.g., indirect harms vs. direct violence, economic rationale vs. personal insult).
      *   **Critical Move:** Uses "shadow honor" to *critique* or *extend* Williams/Appiah, moving beyond summary. Shows how SH reveals a potential blind spot (persistence of the prestige structure/impulse).
      *   **Avoids:** Mere description of dueling's fall, basic summary of W/A without deep engagement with SH, treating SH superficially.

  *   **B-Grade (16-20):** Solid but lacks the depth or synthesis of an A.
      *   **Likely Includes:** Good understanding of W/A and SH. Explains SH clearly and applies it to dueling's end. Attempts to discuss norm death vs. transformation.
      *   **Shortcomings:** Comparison of SH's impact on W vs. A might be uneven or less developed. Evaluation of the moral character change in the migrated norm may be simplistic or underdeveloped (e.g., just stating harms exist without analyzing the *nature* of the similarity/difference). SH is used but not as powerfully to *critique* W/A – might feel more like applying SH alongside them.
      *   **Mistakes Costing Marks:** Treating SH as just another example rather than the core analytical lens. Failing to explicitly argue *how* SH challenges/complements W/A's explanations. Vagueness on the "death vs. transformation" question. Over-reliance on summarizing the frameworks.

  *   **C-Grade (11-15):** Limited or flawed engagement.
      *   **Deficiencies:** Superficial treatment of SH (e.g., mentioned but not analyzed). Heavy reliance on summarizing W/A without sufficient original argument using SH. Unclear or weak argument about norm death/transformation. Significant misunderstanding of one or more concepts. Little evaluation of moral character change.
      *   **Major Mistake:** Effectively ignoring the "shadow honor" requirement after mentioning it.

  *   **D/F-Grade (0-10):** Serious deficiencies.
      *   **Fails To:** Adequately address the question's core (norm death/transformation via SH). Misrepresents key concepts (W, A, SH). Primarily summarizes historical events or theories without analysis. Lacks structure or coherence. Ignores "shadow honor" substantially.

  **Specific Mark Deductions (Examples):**
  *   **-3 to -5:** Only summarizes Williams/Appiah without sufficient original argument using SH.
  *   **-5 to -7:** Superficial or incorrect treatment of "shadow honor" (e.g., misdefining it, using it only as a vague analogy).
  *   **-4:** Fails to explicitly compare/contrast SH's implications for Williams vs. Appiah.
  *   **-3:** Weak or absent evaluation of whether the migration *fundamentally alters the norm's moral character*.
  *   **-3:** Unclear or unsustained argument on "death vs. transformation of the norm."
  *   **-2:** Poor structure or significant irrelevance.
  *   **-1 to -2:** Minor factual inaccuracies (e.g., misstating why dueling declined).

  ---
  **Why this works for your scene:**
  1.  **Niche Integration:** "Shadow Honor" is the *linchpin*, not an afterthought. Students *must* engage with it to score well.
  2.  **Forces Critical Thinking:** Goes beyond summary by demanding evaluation of SH's implications *for* Williams/Appiah and the core "death vs. transformation" question.
  3.  **Casual/Urgent Tone:** Imperatives ("Argue whether," "Avoid mere summary"), the thunderstorm note, the slight typo ("teh" -> "the" in prompt heading - left it as you typed for authenticity), and focused question mimic a rushed, high-stakes exam.
  4.  **Clear Demarcation (A vs. B):** The marking scheme explicitly names the "critical moves" for an A (using SH to critique W/A, nuanced moral evaluation) and the common shortcomings of a B (uneven comparison, simplistic evaluation).
  5.  **Verisimilitude:** Feels like a real, challenging PhD comp question a philosophy department might set on this topic, with a contemporary theoretical twist.

  Good luck with the scene – the image of the exhausted prof scribbling furiously as the storm rages is wonderfully atmospheric!
