prompt: |-
  In mass-casualty triage protocols—such as SALT and START—emergency services explicitly deprioritize patients with the gravest injuries and the greatest resource needs, directing care instead toward those whose survival is probable with minimal intervention, precisely to maximize the number of survivors. The same institutions, in ordinary clinical practice, reject aggregate welfare calculations—like quality-adjusted life-year maximization—as a legitimate basis for denying care to any identifiable patient, insisting instead that each person has an individual claim that cannot be overridden by statistical benefits to others. This creates a bifurcated system: aggregation is forbidden in the clinic but treated as mandatory in the crisis zone. What philosophical commitments does that institutional split presuppose? Reconstruct the implicit theory of moral justification: does it assume a Scanlon-style contractualist framework in which, during routine care, no patient could reasonably reject being treated as having an absolute claim, but in which, under crisis conditions, the worst-off can be told that others could not reasonably reject being saved first? Or does the split reveal that the practice is not genuinely contractualist but rather a concealed form of rule-utilitarianism, using individualist language for ordinary ethics and aggregative logic for emergencies? Distinguish what the practice strictly requires from what merely accommodates it—whether contractualism genuinely licenses the crisis exception, or whether the exception undermines contractualism’s core rejection of aggregation. Then consider a revised protocol in which every triage decision had to be justified pairwise to the specific patient being deprioritized, as contractualism demands; describe what would have to change in emergency medicine if that revision were adopted, and say whether the current bifurcation is philosophically stable or incoherent. Say how confident you are in your reconstruction, and single out the point about which you are least sure. Lead with your bottom line in the first sentence, then give the reasoning with no preamble and no restating of the question. Write in American English.
reasoning: |-
  Hmm, the user is asking about the philosophical foundations of triage protocols in emergency medicine. They're pointing out how institutions use different ethical approaches: in mass-casualty situations like SALT or START, they prioritize saving the most lives possible by deprioritizing the severely injured, which is aggregative thinking. But in normal clinical practice, they reject things like QALY maximization and treat each patient as having an absolute claim to care. The user wants me to analyze what this split implies philosophically - whether it fits with Scanlon's contractualism or if it's actually concealed rule-utilitarianism.

  I need to reconstruct the implicit moral justification. The key question is whether contractualism can genuinely accommodate the crisis exception without undermining itself. Scanlon's contractualism says that principles must be acceptable to everyone, meaning no one could reasonably reject them. In routine care, it's plausible that every patient could reasonably reject being denied treatment for the sake of others. But in crises, could the worst-off reasonably accept deprioritization? The user suggests that in crises, we might say others couldn't reasonably reject being saved first - implying that the worst-off can be told their sacrifice is necessary for a principle that benefits everyone overall.

  I'm considering if this makes sense. Contractualism typically opposes aggregation, focusing on individual claims. But crises might create a situation where the alternative - no triage system - leads to even worse outcomes for everyone, including the worst-off. So perhaps a principle like "prioritize those savable with minimal resources during overwhelming crises" could be justified as something no one could reasonably reject, since it's better than chaos. But this is tricky because it still involves aggregative thinking, which Scanlon rejects.

  The user also asks about a hypothetical revised protocol where each triage decision must be justified pairwise to the deprioritized patient. If we strictly applied contractualism this way, emergency medicine would need to change dramatically. Medics would have to explain to each dying patient why they're not being treated, arguing that the principle is reasonable. This seems impractical under crisis conditions with limited time and resources. It might cause delays, distress, and undermine the system's efficiency. The current bifurcation might be philosophically unstable because it switches ethics based on context, which could be seen as incoherent.

  Now, about the core of the split: I think it's more like rule-utilitarianism in disguise. Institutions use individualist language normally to maintain trust and avoid hard choices, but switch to aggregation in crises when necessary for survival. This suggests that the underlying commitment is to maximizing welfare, with rules tailored to circumstances. Contractualism can't easily handle the crisis exception without bending its anti-aggregation stance, making the bifurcation unstable.

  For confidence, I'm fairly sure about the rule-utilitarian interpretation, but least sure about whether contractualism can genuinely license the exception. Scanlon might allow for general principles that apply in crises, but it feels forced. Overall, the current system is philosophically unstable because it doesn't consistently adhere to one ethical framework.

  Bottom line: The institutional split reflects a rule-utilitarian foundation disguised as contractualism in routine care, not a philosophically stable application of Scanlonian contractualism.
answer: |-
  The institutional split reflects a rule-utilitarian foundation disguised as contractualist rhetoric in ordinary care, not a philosophically stable application of Scanlonian contractualism. 

  The practice presupposes that aggregate welfare maximization is the ultimate moral justification, but it strategically adopts non-aggregative language in routine clinical settings to preserve social trust, avoid perceived cruelty in denying individual care, and maintain operational efficiency when resources are adequate. During mass-casualty events, the mask drops: aggregation becomes explicit because the survival imperative overwhelms these pragmatic constraints. This is not genuine contractualism. Scanlon’s framework prohibits aggregative trade-offs that sacrifice identifiable individuals for the greater good, requiring instead that principles be justifiable *to each person* affected. The crisis exception violates this core tenet by deprioritizing the gravely injured based solely on statistical survival probabilities and resource burdens—precisely the aggregation contractualism rejects. 

  If triage strictly adhered to contractualism, every deprioritization decision would need direct justification to the specific patient denied care. Medics would have to argue that *this patient* could not reasonably reject a general principle permitting their sacrifice (e.g., "We let you die because saving three others with minimal resources is a policy no one could reject"). This would paralyze emergency response: crisis protocols rely on rapid, impersonal categorization, not individualized moral deliberation. Implementing pairwise justification would require slowing triage to explain decisions amid chaos, increasing psychological trauma, and likely reducing overall survival rates—undermining the very purpose of crisis protocols. 

  The bifurcation is philosophically incoherent. It inconsistently applies aggregation while invoking contractualist norms only when convenient. Rule-utilitarianism better explains the split: it permits context-dependent rules (strict individualism when feasible, aggregation when necessary) to maximize long-term welfare. However, institutions avoid admitting this utilitarian core in routine care to evade backlash over rationing. 

  I am highly confident that contractualism cannot coherently license the crisis exception without abandoning its rejection of aggregation. My least certain point is whether the practice’s ordinary-care rhetoric is *purely* utilitarian accommodation or reflects residual deontological commitments; the insistence on individual claims may stem from genuine non-consequentialist intuitions, not just utilitarian prudence.
