answer: |-
  Your query cuts to the heart of why the Born rule remains the most stubborn knot in Everettian quantum mechanics. Let me address the interplay between the two strategies you describe, then consider the viability of a third way, before stating where empirical or conceptual pressure might unravel the whole endeavor.

  The decision-theoretic approach (e.g., Deutsch-Wallace) argues that rational agents facing branching events should structure their preferences as if they were facing probabilistic uncertainty, with utilities weighted by squared amplitudes. This relies on axioms of rationality (like consistency across branching events) applied to a deterministic multiverse. Crucially, it *derives* the appearance of probability from instrumental rationality, not from ontological chance. The self-locating uncertainty approach (e.g., Vaidman, Tappenden) treats an agent *before* measurement as facing genuine ignorance about "which future branch-self" they will *subjectively* become. Here, squared amplitudes quantify this ignorance, making probability primitive to the agent’s perspective.

  Are these independent? Superficially yes, but deeper down, their separation blurs. The decision-theoretic view implicitly smuggles in a perspectival "I" whose continuity is fractured by branching—it needs an agent who *anticipates* being one future self among many. This anticipation feels indistinguishable from self-locating uncertainty: the rational agent fears "I might end up in a low-weight branch" as much as "I am uncertain which branch I occupy." Conversely, grounding self-locating uncertainty requires explaining *why* squared amplitude—and not, say, branch count—should index credence. This often appeals to rational action in branching scenarios, looping back to decision-theoretic norms. Thus, while one approach starts with rationality and the other with epistemic lack, both seem to require a *pre-branching agent* whose relationship to their future selves generates the normative force of the Born rule. The core tension you identify—classical uncertainty "relocated" rather than dissolved—persists because both strategies depend on this agent-centric viewpoint within a fundamentally non-agent-centric ontology.

  This leads us to your third option: treating squared amplitudes as measures of *ontological salience* rather than probability. On this view (hinted at by Carroll, developed in "density matrix realism"), branches aren’t equally "real" in a flat multiverse; amplitude moduli confer degrees of "reality" or structural weight. High-weight branches aren’t "more probable" but "more ontologically robust" or "more representative" of the quantum state’s structure. The advantage is jettisoning probabilistic language altogether, avoiding the smuggling of uncertainty. However, the conceptual price is steep for rational deliberation. If all branches are actual but differ in salience, why should an agent *care* more about high-salience branches? Why prefer actions leading to "robust" futures over those yielding "fragile" ones? Unless salience maps to something like *subjective experience intensity* (a fraught move), it struggles to explain why agents naturally develop Born-rule-aligned preferences without invoking circular appeals to rationality or anthropic self-selection. Rational action seems untethered from pure ontology unless salience itself becomes a normative guide—but then we risk collapsing back into decision theory.

  The most decisive test for *any* of these approaches would be an empirical demonstration that amplitude moduli play no role in *predicting observable frequencies* in a way that distinguishes Everett from collapse theories. Suppose we could simulate (or observe in a quantum system) a scenario where agents repeatedly perform measurements on identical pre-measurement states, and their reported relative frequencies consistently *deviate* from the Born rule predictions in a statistically significant way, despite perfect unitarity. This would undermine all three strategies: decision theory (rational agents wouldn’t see expected frequencies), self-locating uncertainty (credences wouldn’t match experiences), and ontological salience (if salience doesn’t track what we observe, what is it for?). Such a result would suggest the Everett interpretation is empirically inadequate or that amplitude moduli are incidental to branching outcomes.

  The point in my reasoning most exposed to error is the claim that decision theory and self-locating uncertainty are not cleanly separable. A compelling formal proof showing that Wallace’s rationality axioms *require no appeal to pre-branching agent identity*—deriving Born weights purely from coherence constraints on future branch-relative valuations—could force a revision. This would decisively untangle decision theory from epistemic uncertainty, grounding probability in pure instrumental rationality without smuggling a persisting "I." Conversely, a robust derivation of the Born rule from indexical ignorance *alone*—without covert appeals to branch-weighted rationality—could rehabilitate the self-locating approach. Currently, both feel like partial perspectives on a deeper, unresolved dilemma: how to situate a temporally extended, deliberating agent in a manifold where their multiplicity is fundamental. Until that dilemma is dissolved, not just relocated, the Born rule problem remains a philosophical wound in an otherwise elegant theory.
