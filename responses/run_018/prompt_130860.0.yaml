  You are a professional philosopher of value theory and an experienced exam designer for graduate-level philosophy courses. Before you begin drafting, take a moment to think carefully and work through a brief internal scratchpad: identify the exact analytical crux that separates a student who truly grasps the heterogeneity problem for hedonism from one who can only recite standard labels (qualitative versus quantitative hedonism, Mill’s distinction between higher and lower pleasures, attitudinal hedonism). Your goal is to make that crux unavoidable.

  Now write a single essay exam question, a model answer of about 600 words, and a marking scheme. The setting is a PhD comprehensive exam in ethics and value theory; the time allowed is 90 minutes; the total marks are 20.

  The topic is the heterogeneity problem for hedonism: what, if anything, do all pleasures genuinely share? Do not ask for bibliographies, reading lists, or citations. Do not invoke obscure or highly niche theories that a well-prepared candidate might not have encountered in standard coursework. To keep the question in the weeds and non-regurgitatable, inject the following constructed conceptual framing: ask candidates to evaluate the “thin-core qualitative defense” (the claim that every pleasure shares a minimal, non-natural phenomenal quality of “pleasantness”) against the “disjunctive phenomenology objection” (the claim that bodily satisfaction, intellectual discovery, malicious glee, and aesthetic absorption share no common felt quality and are grouped only by a functional role—being pursued, endorsed, or desired). The candidate must either defend the thin-core view by rigorously distinguishing phenomenal quality from phenomenal intensity, or attack it by showing that the alleged common core is either descriptively empty or normatively inert as an axiological currency. They must also explain why this dispute matters specifically for hedonism’s ambition to supply a unified measure of well-being.

  The exam question should be precise, formal, and unanswerable by summary alone. After the question, provide the model answer, then the marking scheme structured around five must-hit points with marks assigned to each (totaling 20). For each point, include a one-line note on how candidates typically go wrong. Make clear what distinguishes an A answer (all five moves executed with precision, including the quality/intensity distinction and the normative-inertness worry) from a B answer (three or four moves present, but the functional-role reply is treated as decisive without engagement, or the distinction between quality and intensity is collapsed).

  Write in polished academic prose. Do not use verbatim quotations from real texts; paraphrase without quotation marks if you reference well-known positions. Start immediately with your task.
