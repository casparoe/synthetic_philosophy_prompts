  Hmm, they've actually diagnosed part of the problem themselves: the class is conflating (1) externally monitored behavior ("watched by god") with (2) intrinsic morality, and also (3) individual acts versus (4) societal systems. Clever of them to notice the "moral infrastructure" distinction - that's not stupid at all. The trackpad apology suggests they're typing hastily, probably tired of the deadlock.

  Right, so why is this debate stalled? First, it's absolutely a definitional issue wrapped in methodological confusion. When Group A says "moral," they mean measurable prosocial acts (charity/lie-detector tests), which favors religious studies. Group B means functional societal trust (Denmark's social cohesion), which favors secular examples. They're comparing apples to orbital satellites. 

  Second, the levels-of-analysis problem: individual psychology vs. institutional scaffolding. The charity studies examine personal choices under observation (aligning with religious surveillance theory), while Nordic models demonstrate system-level trust engineering (tax-funded welfare as "moral infrastructure"). No wonder they're talking past each other. 

  What could move this forward? A new study won't help if they don't first untangle these threads. They need to: 
  - Explicitly separate definitions: "moral behavior" (observable actions) vs. "moral motivation" (intrinsic/extrinsic) vs. "moral systems" (societal cooperation mechanisms). 
  - Distinguish analysis levels: hand out a matrix comparing individual/group/society rows with religious/secular columns. 
  - Then examine Scandinavian religious history - their high trust didn't emerge from vacuum but from Lutheran cultural roots evolving into secular institutions. That historical bridge might reframe the "either/or" into "how transitions work." 

  The deepest stall comes from unexamined assumptions about human nature. If someone believes morality requires divine enforcement, no amount of Danish happiness statistics will sway them. That's when you pivot to philosophy: Can worth exist without worship? But perhaps that's beyond the scope of their syllabus. 

