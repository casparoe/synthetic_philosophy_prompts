answer: |-
  Here's a meticulously structured teaching sequence for your 45-minute session, leveraging the "rule" case study to bypass common pitfalls:

  **I. Teaching Sequence & Conceptual Dependencies**  
  *(Total: 35 mins)*  
  1. **The "Picture Theory" Trap & Its Failure (12 mins)**  
     *Why first?* Wittgenstein targets the assumption that words mirror reality. Without showing why this fails, family resemblance seems trivial.  
     *Sequence:*  
     - Ask: "What does 'rule' mean in a **courtroom**?" (Elicit definitions: "law," "judge's order").  
     - Contrast with **board game**: "Is a Monopoly rule like a law?" (Highlight: punishment vs. fun, written vs. mutable).  
     - *Reveal failure:* "If 'rule' means one essential thing (e.g., 'authoritative command'), why does breaking a game rule feel different than contempt of court? The 'picture' doesn't fit."  

  2. **Introduce Language-Games (8 mins)**  
     *Why now?* The failure demands a new framework. Language-games show meaning is anchored in action.  
     *Sequence:*  
     - Define "language-game": "A social activity where words *do* things."  
     - Map examples:  
       - Courtroom game → "Rule" enforces justice.  
       - Board game → "Rule" structures play.  
     - *Key insight:* Same word, different "games" = different jobs.  

  3. **Family Resemblance via "Rule" (15 mins)**  
     *Why last?* It solves the picture-theory problem by showing *how* meaning coheres without essence.  
     - Introduce **unspoken friendship**: "Is ‘Don’t flirt with my crush’ a rule? How is it enforced?" (Highlight: no documents, social fallout).  
     - *Contrast all three:*  
       | Context       | Source of Authority | Enforcement       | Flexibility |  
       |---------------|---------------------|-------------------|-------------|  
       | Courtroom    | Codified law        | State power       | Low         |  
       | Board game   | Rulebook            | Exclusion/restart | Medium      |  
       | Friendship   | Mutual expectation  | Social rupture    | High        |  
     - *Philosophical labor:* Show overlaps without universals (e.g., "constraint" in all, but courtroom ≠ flexibility; "mutuality" in game/friendship, but absent in court).  

  **II. Case Study Requirements**  
  - **Order:** Courtroom → Board game → Friendship. *Why?* Courtroom feels most "essentialist," making its failure vivid. Friendship most easily dispels ambiguity claims.  
  - **Critical Exclusions:** Avoid implying "rule" is *just* homonyms (like "bank" river/finance). Stress: All uses constrain behavior normatively.  
  - **Essential Highlight:** In friendship, "rule" lacks formal articulation but still *guides action*—proving meaning isn’t in the word alone.  

  **III. Misconceptions & Preemption**  
  1. **"No shared features = ambiguity"**  
     *When:* During family resemblance comparison.  
     *Preempt:* Point to overlapping strands (e.g., "violation has consequences" in all three). Say: "Wittgenstein isn’t denying similarities—he’s denying *one core feature* defining all."  

  2. **"Meaning = arbitrary social agreement"**  
     *When:* Introducing language-games.  
     *Preempt:* Note courtroom rules bind *even if disputed*: "Agreement isn’t consensus—it’s how the game *functions*. You can’t opt out of ‘rule’ in court by refusing to play."  

  3. **"This is just vagueness"**  
     *When:* Transitioning to friendship.  
     *Preempt:* Contrast: "Vague = borderline cases (e.g., ‘Is a hotdog a sandwich?’). Here, ‘rule’ has *clear* uses—but no single definition covers all."  

  **IV. Closing Comprehension Check (5 mins)**  
  **Question:** *"If a librarian posts ‘No talking’ and a coach says ‘No talking during drills,’ is ‘rule’ doing the same thing? Where would Wittgenstein look to decide?"*  
  - *Target insight:* They must identify differences in *use-context* (library = quiet for focus; team = discipline for coordination), not the phrase itself. Reject answers fixated on the words alone.  

  **V. Explicit Boundary**  
  **State upfront & reiterate at end:**  
  *"We are NOT covering Wittgenstein’s private language argument. This claims a language only you understand is impossible—but that requires understanding *rules*, which is why we stop here today. It’s a separate, advanced point."*  

  **Timing Notes:**  
  - Intro (3 mins)  
  - Sequence (35 mins)  
  - Closing Q&A (7 mins)  
  *Flex:* Cut board game discussion short if courtroom/friendship contrasts land well. Use student examples to maintain pace.
