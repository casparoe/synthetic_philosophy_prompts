  Constructing the thought experiment requires strict parameters: painless sudden death, no observers/aftermath, objectively positive future. The Symmetry Argument insists nonexistence can't harm you pre-birth or post-death. The Deprivation Account counters that death steals actual future goods. The tension is pure: same outcome (nonexistence), opposite moral verdicts. 

  I'll use "Anna" as a neutral subject. Her death at 30 severs 50 good years—no family, no awareness, no supernatural elements. Epicureans would say Anna isn't there to experience loss, so no harm. Deprivation theorists scream "But those 50 years were *hers*!" The key differentiator: past/future asymmetry. We care about potential futures, not foregone pasts. 

  Epicurean counterattacks might call this bias irrational—a "metaphysical illusion." But if we tweak the case to show someone *gaining* years (e.g., living past 80 unexpectedly), deprivation logic still holds: more goods = better. That’s hard to dismiss. Yet under pressure, deprivation theory stumbles if we question *who* is wronged. Dead-Anna isn't a subject—so is "harm" just a metaphor? 

