prompt: |-
  I run investments for a small endowed foundation — roughly $140M, four staff, and an investment committee of four lay trustees who sign off on every position in a one-hour meeting once a month. Last night I had a three-hour argument with one of those trustees, an applied mathematician, and I lost most of it. Her claim, as I now understand it, was that our sizing decisions should be Kelly sizing: maximizing expected wealth is a sucker's game because the expectation is dominated by the one path where everything works, whereas maximizing expected log wealth maximizes the growth rate and, over enough repetitions, beats any other rule with probability approaching one. She also said two things I'd rather have checked than assumed: that half Kelly buys you about three-quarters of the growth rate for roughly a quarter of the variance of the log outcome, and that past twice Kelly the growth rate turns negative, so overbetting is worse than having no edge at all. What she could not tell me is what any of this means on a Tuesday, for a two-page memo on an illiquid commitment, in front of a committee that reads expected terminal value and hates drawdowns.

  So here is what I need: a reusable sizing procedure, in words, that my analyst — a sharp generalist with no graduate mathematics — can run in about twenty minutes from a standard two-page memo, and that the trustees can audit afterward. Our situation: thirty to forty sizing decisions a year; most opportunities illiquid, overlapping, and correlated with what we already hold; rebalancing rare and slow; and a wind-down clause in the founding document stipulating that if real assets fall below $90M in today's dollars the foundation must spend out and dissolve. That last feature is where the argument ran out. My trustee's instinct was that near the floor we should take more risk to climb back out; mine was the opposite. I want the procedure to settle what quantity the fraction is a fraction of, and to say plainly which of us was wrong.

  The procedure has to handle, at minimum: a screening gate for whether an opportunity is even the kind of thing this reasoning applies to — I want the analyst obliged to name the reference class of similar future opportunities and say roughly how many draws are left in it, and I want the procedure to refuse to produce a number when that class has fewer than about ten expected remaining instances, routing the deal to a fixed exploration budget instead; how to define stake, odds, and edge for a messy real commitment; what to do when the edge estimate rests on a thin or flattering track record, since we have been badly overbet by model error before; the fact that thirty independently sized positive-edge deals will over-lever us, so there must be an aggregation step with some shared growth budget and a rule for ranking deals once that budget is used up; and the point that the per-deal multiplier — full, half, quarter — is not something the theory hands you, so it should be fixed once by the committee with stated reasons (parameter uncertainty, illiquidity, inability to rebalance, drawdown tolerance) rather than tuned deal by deal. For each gate, mark whether a failure there is a hard no or a place where the underlying question is one of values and has to go to a human.

  Then run it on three cases: (a) a liquid, genuinely repeatable opportunity in listed markets with fifteen years of daily data and a well-understood edge; (b) a one-off illiquid commitment in an asset class we have no track record in and no obvious sibling deals for — my suspicion is that the honest answer is that the procedure will not size it at all beyond the exploration budget, and I want to see that argued rather than papered over; (c) a deal whose standalone number is enormous but that sits almost on top of exposure we already carry, at a moment when we are not far above the wind-down threshold. I expect the committee to dislike at least two of these answers; say which, and why.

  Close with a short section on what the procedure cannot do: whether log growth is even the right objective for an institution with a spending rule and a legal death at $90M, what happens if the regime generating the edge changes underneath us, and why no backtest we can run will settle any of this.

  Hard length limit: 1,400 words for the whole thing. No more than twelve gates, each stateable in one plain-English sentence a trustee without mathematical training can follow, then the three worked cases at roughly 120 words each, then the closing section. One or two formulas may appear if they earn their place; no derivations.
reasoning: |-
  We are designing a reusable sizing procedure for a foundation with $140M in assets, facing illiquid and correlated opportunities, with a wind-down clause at $90M real. The procedure must be executable by an analyst in 20 minutes from a 2-page memo and auditable by trustees. It will use a fractional Kelly approach to manage growth and risk, but with adaptations for real-world constraints.

  The core idea: We want to maximize the long-term growth rate of the endowment, which Kelly does by maximizing expected log wealth. However, due to model error, illiquidity, and the wind-down constraint, we use a fraction of the Kelly stake (fraction fixed by committee). The procedure must handle:

  1. **Reference Class and Repetition:** Only apply to opportunities that are part of a reference class with at least 10 expected remaining instances. Otherwise, route to a fixed exploration budget.

  2. **Estimating Edge, Odds, Stake:** For a given opportunity, we need to define:
     - Stake: The amount we can commit (in $).
     - Odds: The probability of a successful outcome (p).
     - Edge: The expected return above the risk-free rate (or above the foundation's hurdle rate). We express this as the expected log return (or, for simplicity, the arithmetic return in a binary setup) to compute the Kelly fraction.

  3. **Handling Model Error:** Thin or flattering track records require a haircut on the edge estimate.

  4. **Aggregation:** We cannot take every positive-edge opportunity at full fraction because of correlation and leverage. We assign a "growth budget" (a fixed fraction of the endowment) to new opportunities and rank them by a risk-adjusted metric.

  5. **Fraction Setting:** The committee sets a global fraction (e.g., half-Kelly) based on risk factors.

  6. **Wind-down Constraint:** Near the $90M floor, we must reduce risk to avoid breaching. This overrides the Kelly growth objective.

  **Proposed Procedure (12 Gates):**

  1. **Gate 1: Reference Class Check**  
     Analyst must name a reference class of similar future opportunities and estimate the expected number of remaining draws (N).  
     *Failure: If N < 10, then hard no for Kelly sizing; route to exploration budget (fixed amount set by committee).*

  2. **Gate 2: Opportunity Definition**  
     Define the opportunity in terms of:  
     - Total commitment required (stake, S)  
     - Probability of success (p) and failure (1-p)  
     - Payoff in success (G, as multiple of stake) and in failure (L, as multiple of stake, typically 0 for illiquid commitments but could be partial loss).  
     *Failure: If the opportunity cannot be defined in these terms, then hard no; must be reconsidered or restructured.*

  3. **Gate 3: Edge Calculation**  
     Compute the expected return multiple: E = p*G + (1-p)*L.  
     Then compute the expected log return (for a binary bet) as:  
        g = p*log(1 + f*(G-1)) + (1-p)*log(1 + f*(L-1))  
     However, for simplicity, we use the Kelly fraction formula for binary bets:  
        f* = (p*(G-1) - (1-p)*(1-L)) / ((G-1)*(1-L))   [if L is the loss fraction, so if we lose the entire stake on failure, L=0]  
     But note: In the standard binary case where you lose the entire stake on failure (L=0) and win G times the stake on success, the Kelly fraction is:  
        f* = (p*G - 1) / (G - 1)  
     *Note: We are using a simplified version that assumes a binary outcome. For non-binary, we might need simulations, but we avoid that for speed.*

  4. **Gate 4: Model Error Haircut**  
     Adjust the computed edge (and thus f*) based on the quality of the estimates.  
     - If the track record is thin (<5 years) or flattering (e.g., only one manager, backtested), apply a haircut (e.g., reduce f* by 50%).  
     - If the opportunity is in a new asset class, apply a haircut (e.g., 70% reduction).  
     *Failure: If the haircut reduces f* to near zero, then hard no; but typically, we still use the haircut and proceed. This is a soft gate: the underlying question of model quality goes to humans if the haircut is severe.*

  5. **Gate 5: Base Kelly Fraction**  
     Compute the base Kelly fraction f* as above. If the opportunity has multiple outcomes, use the formula for multiple outcomes or a simplified binary approximation.

  6. **Gate 6: Committee Fraction**  
     Multiply the base Kelly fraction by a global fraction (F) set by the committee (e.g., F=0.5 for half-Kelly). This accounts for parameter uncertainty, illiquidity, etc.  
     So the target fraction for this deal is: f_target = F * f*.

  7. **Gate 7: Maximum Allocation**  
     The maximum allocation for the opportunity is: A_max = f_target * Current Endowment.

  8. **Gate 8: Aggregation Check**  
     The foundation has a "growth budget" (GB) for new opportunities, set as a fixed percentage of the endowment (e.g., 10% of the endowment per year). The sum of allocations (A) for all new opportunities in a year must not exceed GB.  
     *Failure: If the current total allocated is already >= GB, then this opportunity cannot be sized at all beyond the exploration budget (if available). This is a hard no for Kelly sizing, but the exploration budget might still apply.*

  9. **Gate 9: Ranking and Rationing**  
     If the remaining growth budget is less than A_max, then we rank opportunities by a risk-adjusted metric. We use:  
        Score = (f* * Edge) / (Volatility or Correlation Penalty)  
     But for simplicity and speed, we use:  
        Score = f* * (p*G - 1)   [the expected excess return multiple]  
     Then allocate the remaining budget to the highest scoring opportunities until exhausted.  
     *Note: This step requires keeping a running tally of the growth budget and allocations.*

  10. **Gate 10: Wind-down Constraint Check**  
      Let R = current real assets (in today's dollars) and FLOOR = $90M.  
      If R < 1.1 * FLOOR (i.e., $99M), then we must reduce risk.  
      - Compute the maximum allowable risk: set a cap on the total allocation to any opportunity as a fraction of the distance to the floor:  
            A_cap = (R - FLOOR) * k,  
      where k is a risk budget parameter (e.g., 0.1, set by committee).  
      - Then: A_final = min(A_max, A_cap)  
      *Failure: If A_cap is very small (near the floor), then the opportunity might get a very small allocation. This is a hard constraint.*

  11. **Gate 11: Correlation Adjustment**  
      If the opportunity is highly correlated with existing holdings (correlation > 0.5, as estimated by the analyst), then reduce the allocation by a factor (e.g., 1 - correlation).  
      *Note: This step is soft; if correlation is not estimable, skip. The analyst must flag high correlation and adjust accordingly.*

  12. **Gate 12: Final Allocation**  
      The final allocation is the minimum of:  
      - A_max from step 7  
      - The available growth budget (step 8)  
      - The wind-down cap (step 10)  
      - The correlation-adjusted allocation (step 11)  
      And then it must be rounded to a reasonable figure (e.g., nearest $100K).  

  **Worked Cases:**

  **(a) Liquid, Repeatable Opportunity**  
  - Reference class: 100+ similar trades per year, so N>10.  
  - Edge: p=0.55, G=2.0 (so if we bet $1, we get $2 on success, lose $1 on failure).  
    f* = (0.55*2 - 1) / (2-1) = (1.1-1)=0.1.  
  - Haircut: None (long track record).  
  - Committee fraction (F=0.5): f_target=0.05.  
  - A_max = 0.05 * $140M = $7M.  
  - Growth budget: 10% of $140M = $14M/year. Assume $7M already allocated, so $7M left -> allocation $7M.  
  - Wind-down: Current assets $140M > $99M, no cap.  
  - Correlation: Low, so no adjustment.  
  - **Allocation: $7M.**  
  *Committee may dislike the size, but it is justified by the procedure.*

  **(b) One-off Illiquid Commitment**  
  - Reference class: Analyst estimates no similar future opportunities (N=0).  
  - **Gate 1 failure: Hard no for Kelly sizing.**  
  - Routed to exploration budget (e.g., $1M per deal, set by committee).  
  - **Allocation: $1M (from exploration budget).**  
  *Committee may dislike that we are committing without a Kelly size, but the procedure forces this for non-repeatable opportunities.*

  **(c) Correlated Deal Near Floor**  
  - Current real assets: $95M (below $99M trigger).  
  - Standalone: p=0.6, G=3.0 -> f* = (0.6*3-1)/(3-1)= (1.8-1)/2=0.4.  
  - Haircut: 50% (due to complexity) -> f*=0.2.  
  - Committee fraction (F=0.5): f_target=0.1.  
  - A_max = 0.1 * $95M = $9.5M.  
  - Wind-down cap: A_cap = ($95M - $90M) * 0.1 = $5M * 0.1 = $0.5M.  
  - Growth budget: 10% of $95M = $9.5M. Assume $0 allocated so far, so available $9.5M.  
  - Correlation: High (0.8) -> reduction factor 0.2 -> $9.5M * 0.2 = $1.9M, but we are already capped by wind-down at $0.5M.  
  - **Allocation: $0.5M (capped by wind-down constraint).**  
  *Committee may dislike the small size given the edge, but the floor constraint forces conservatism.*

  **Closing: What the Procedure Cannot Do**

  1. **Objective Mismatch:** Kelly maximizes long-run log wealth, but the foundation has a spending rule and a death at $90M. Near the floor, survival dominates growth. Our procedure addresses this with a hard cap, but the trade-off between growth and survival is not fully captured by Kelly.

  2. **Regime Change:** If the edge disappears or the world changes, the Kelly bet based on past data will be wrong. Our haircuts and global fraction help but cannot prevent losses from structural breaks.

  3. **Backtests:** No backtest can validate the procedure because the future is not the past, and we face unique, illiquid opportunities. The procedure relies on estimates that are inherently uncertain.

  4. **Correlation and Aggregation:** Our aggregation step is simplistic. In reality, correlations change and the portfolio effect is complex. We use a crude ranking and growth budget, which may not fully capture risk.

  5. **Fraction Setting:** The choice of global fraction (half-Kelly, etc.) is arbitrary and based on committee judgment. It cannot be optimized by the procedure.

  Despite these limitations, the procedure provides a disciplined, auditable framework for sizing decisions that balances growth and risk for the foundation.
answer: |-
  ### Reusable Sizing Procedure for Foundation Investments  
  *Based on fractional Kelly principles, adapted for illiquid, correlated opportunities and a $90M wind-down floor. Executable in 20 minutes by an analyst using a standard memo. 12 gates total.*

  #### Gates (Plain-English Rules for Trustees)
  1. **Reference class check**: Analyst must define a clear group of similar future opportunities (e.g., "Asian mid-market buyout funds") and estimate ≥10 expected remaining instances over the foundation’s lifespan.  
     *Failure*: Hard no for Kelly sizing; route to fixed exploration budget (e.g., $1M/deal).  
  2. **Repeatability screen**: Opportunity must allow reinvestment in similar future bets (e.g., a liquid strategy). One-off physical assets fail.  
     *Failure*: Hard no; use exploration budget.  
  3. **Edge definition**: For the opportunity, specify:  
     - **Stake**: Total capital required ($).  
     - **Odds**: Probability of success (p), from 0% to 100%.  
     - **Edge**: Expected net return multiple (G) if successful (e.g., 2.0x means double the stake). Loss multiple (L) if failed (e.g., 0.8x).  
     *Failure*: Hard no if unquantifiable.  
  4. **Base Kelly fraction**: Calculate \( f^* = \frac{p \cdot (G - 1) - (1 - p) \cdot (1 - L)}{(G - 1) \cdot (1 - L)} \). If negative, edge is negative—reject.  
  5. **Model error haircut**: Reduce \( f^* \) by 50% if track record <5 years, 70% if no track record or flattering data.  
     *Failure*: Soft gate; if haircut pushes \( f^* \) near zero, flag for committee debate.  
  6. **Committee multiplier**: Apply fixed global fraction (e.g., 0.5 for "half Kelly") set by trustees to all deals, reflecting uncertainty, illiquidity, and rebalancing limits.  
  7. **Growth budget check**: Cap total new commitments at 10% of endowment per year (e.g., $14M). If exceeded, hard no until next year.  
  8. **Correlation penalty**: If >50% correlated with existing holdings, cut allocation by correlation % (e.g., 70% correlation = 30% reduction).  
     *Failure*: Soft gate; high correlation triggers committee review.  
  9. **Wind-down constraint**: If real assets ≤$99M (110% of $90M floor), cap any allocation at 10% of cushion above $90M (e.g., at $95M, max $500k). Hard no if below $90M.  
  10. **Final allocation**: Multiply adjusted \( f^* \) by endowment, then apply correlation and wind-down caps. Minimum allocation: $0.  
  11. **Ranking for rationing**: If growth budget exhausted, rank opportunities by \( \text{Score} = f^* \times \text{Edge} \) (higher = better). Fund top scores first.  
  12. **Documentation**: Analyst must list all inputs and gates passed/failed. Trustees audit via memo trail.

  ---

  ### Worked Cases (120 Words Each)  
  **(a) Liquid, Repeatable Opportunity**  
  *Listed equity strategy: p=60%, G=1.8x, L=0.95x, 15-year track record.*  
  - Gates 1–2: Reference class = "global factor strategies," 100+ draws left. Pass.  
  - Gate 3: Stake = $10M. Edge = 1.8x.  
  - Gate 4: \( f^* = \frac{0.6 \cdot (1.8-1) - 0.4 \cdot (1-0.95)}{(1.8-1) \cdot (1-0.95)} = 0.25 \).  
  - Gate 5: No haircut (strong data).  
  - Gate 6: Half-Kelly → 0.125.  
  - Allocation: 0.125 × $140M = $17.5M.  
  - Gates 7–9: Under growth budget ($14M cap → $14M), no wind-down/correlation issues.  
  - **Final: $14M**.  
  *Trustee dislike*: Large allocation despite cap; shows growth budget’s binding role.

  **(b) One-Off Illiquid Commitment**  
  *First-time timberland fund: p=70%, G=2.5x, L=0.5x.*  
  - Gate 1: Reference class unclear; analyst estimates ≤3 similar future deals.  
  - **Gate 1 failure**: Hard no for Kelly sizing.  
  - Routed to exploration budget ($1M fixed).  
  - **Final: $1M**.  
  *Trustee dislike*: "Wasted" edge; procedure enforces discipline on repetition, avoiding overbets.

  **(c) Correlated Deal Near Floor**  
  *Private credit fund (correlated 80% with existing): p=65%, G=2.2x, L=0.7x. Real assets = $95M.*  
  - Gates 1–2: Reference class = "NA private debt," 20+ draws. Pass.  
  - Gate 4: \( f^* = \frac{0.65 \cdot (2.2-1) - 0.35 \cdot (1-0.7)}{(2.2-1) \cdot (1-0.7)} = 0.36 \).  
  - Gate 5: 50% haircut (no track record) → 0.18.  
  - Gate 6: Half-Kelly → 0.09.  
  - Base allocation: 0.09 × $95M = $8.55M.  
  - Gate 8: 80% correlation → 80% cut → $1.71M.  
  - Gate 9: Wind-down cap = 10% × ($95M – $90M) = $500k.  
  - **Final: $500k** (capped).  
  *Trustee dislike*: Tiny size despite high edge; wind-down floor forces conservatism, overriding growth.

  ---

  ### What the Procedure Cannot Do  
  1. **Objective mismatch**: Kelly maximizes long-run log wealth, but the foundation has fixed spending (e.g., 5% payout) and a "death" at $90M. Near the floor, survival dominates growth—our wind-down cap approximates this but doesn’t fully optimize the trade-off.  
  2. **Regime changes**: If the edge (e.g., a strategy’s alpha) vanishes due to market shifts, the procedure fails. Haircuts and global fractions mitigate but cannot eliminate this risk.  
  3. **Backtests are futile**: Illiquid, unique deals lack comparable historical data. Correlations and edges are estimates, not laws. No backtest can validate sizing for low-N, high-uncertainty commitments.  
  4. **Aggregation limits**: The growth budget and ranking are simplistic proxies for portfolio optimization. They ignore nonlinear correlations but are necessary for speed.  
  5. **Fraction arbitrariness**: The global multiplier (e.g., 0.5) is set by committee judgment, not theory. It codifies risk tolerance but won’t "solve" the growth-vs.-safety debate.  

  **Conclusion**: The trustee was wrong near the floor—growth must be capped to avoid dissolution. The procedure forces sizing into a structured, auditable framework but requires trustee buy-in on inputs and trade-offs.
