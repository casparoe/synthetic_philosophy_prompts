  ### Philosophy of Computation: Take-Home Examination  
  **Course:** PHIL 450: Advanced Topics in Philosophy of Computation  
  **Time Allowed:** 48 hours  
  **Word Limit:** 1200 words (strictly enforced)  
  **Instructions:**  
  This examination assesses your philosophical engagement with Douglas Hofstadter’s Letter Spirit project. You may consult only course materials (assigned readings, lecture notes, seminar discussions). **No external research, citations, or bibliographies are permitted.** Write in formal academic prose. Focus exclusively on conceptual analysis.  

  ---

  ### Exam Prompt  
  **(Approx. 1200 words)**  

  **Background:**  
  In the Letter Spirit project, Hofstadter seeks to computationally model human creativity in typography. The system generates stylistically consistent alphabets from a small set of seed glyphs (e.g., an ‘a’) by capturing abstract "style" rather than rigid geometric templates. Critically, Letter Spirit does not define ‘a’-ness by fixed strokes (e.g., a bowl and stem) but by relational properties: symmetry, balance between positive/negative space, stroke curvature ratios, and emergent "energy" from interactions between parts. This challenges the intuition that categories like ‘a’ possess an immutable essence—a set of necessary and sufficient geometric features shared by all instances.  

  **Core Philosophical Tension:**  
  Letter Spirit raises two interdependent questions:  
  1. **Primitivism vs. Emergentism**: Is style a perceptual *primitive* (an irreducible gestalt quality) or an *emergent statistical regularity* (arising from correlations between lower-level features)?  
  2. **Essentialism vs. Family Resemblance**: Does Letter Spirit’s approach support Wittgenstein’s family-resemblance account—where category membership relies on overlapping similarities without universal shared features—or does it inadvertently reduce style to a *new* form of computational essentialism?  

  **Hypothetical Scenario:**  
  Consider a modified Letter Spirit system analyzing an alien script. One glyph (call it *Glyph-X*) is identified by the system as an ‘a’-analog despite sharing *zero* geometric strokes with Roman ‘a’s (e.g., it uses spirals instead of curves, jagged edges instead of stems). *Glyph-X* preserves *only* high-level relational properties:  
  - The ratio of enclosed negative space to stroke curvature.  
  - An analogous distribution of "visual weight" (e.g., dense clustering in the lower-left region).  
  - A similar balance between dynamic and static elements.  
  The system recognizes *Glyph-X* as an ‘a’ in the "spirit" of the Roman seeds.  

  **Examination Question:**  
  Defend or reject the following claim:  
  > *The alien-alphabet scenario demonstrates that the category ‘a’ is governed by Wittgensteinian family resemblance, not essentialism, and that style remains a perceptual primitive irreducible to statistical correlations.*  

  In your response, address these points:  
  1. **Essentialism vs. Family Resemblance**: Does *Glyph-X*’s recognition—despite geometric dissimilarity—refute geometric-feature essentialism? Or does Letter Spirit’s reliance on relational parameters merely replace geometric essence with *relational* essence? Use the hypothetical to argue whether shared stroke geometry is necessary for category membership.  
  2. **The Statistical Objection**: Critics argue Letter Spirit’s "style" is just optimized feature-correlation (e.g., weighted parameters for curvature or spacing). Does this reduction undermine style’s status as a perceptual primitive? Or does the system’s success with *Glyph-X* suggest statistical models *capture* (without eliminating) perceptual invariants?  
  3. **Vacuity Challenge**: If family resemblance permits *any* statistically correlated features to define ‘a’-ness (e.g., alien spirals + Roman curves), does "style" become vacuous? Is there a boundary between genuine style and arbitrary pattern-matching?  
  4. **Synthesis**: Does Letter Spirit ultimately vindicate family resemblance, or reveal that computation and style are compatible without resolving the primitivism/emergentism debate?  

  **Constraints:**  
  - Do **not** summarize Letter Spirit’s gridfont alphabet or technical pipeline. Focus on the *philosophical implications* of the project.  
  - Ground your argument in the *alien-alphabet hypothetical*.  
  - Engage only course concepts (e.g., Wittgenstein’s family resemblance, essentialism, perceptual primitives).  

  ---

  ### Model Answer  
  **(Approx. 650 words)**  

  The alien-alphabet hypothetical decisively refutes *geometric-feature essentialism*—the view that letter categories require fixed, low-level strokes (e.g., a bowl-stem structure for ‘a’). *Glyph-X* shares no geometric properties with Roman ‘a’s yet is recognized as an ‘a’-analog solely through relational style properties (e.g., negative space ratios, weight distribution). This shows stroke geometry is unnecessary for category membership. Essentialism cannot accommodate *Glyph-X*: no single geometric feature is universal across Roman ‘a’s and *Glyph-X*, nor is there a fixed set. Letter Spirit thus aligns with Wittgenstein’s family resemblance, where ‘a’-ness emerges from overlapping relational similarities (e.g., ‘a’-like balance, ‘a’-like tension) without a strict essence.  

  However, the system’s reliance on weighted statistical parameters (e.g., curvature ratios, spacing weights) invites the objection that style is reduced to feature-correlation, not perceptual primitivism. The alien-alphabet case counters this: *Glyph-X*’s recognition demonstrates that statistical weights track *perceptual invariants* (e.g., humans perceive both Roman ‘a’s and *Glyph-X* as sharing "dynamic asymmetry"). The parameters *model* perceptual conditions—they do not eliminate style’s primacy. Just as thermodynamics models heat without denying its phenomenological reality, Letter Spirit’s statistics model style’s perceptual foundations. The objection conflates *reduction* (style is nothing but correlations) with *modeling* (correlations approximate perceptual primitives).  

  Yet this raises a vacuity challenge: if family resemblance permits *any* correlations (e.g., between alien spirals and Roman curves) to define style, could arbitrary patterns (e.g., random strokes with matching curvature ratios) qualify as ‘a’? This risks making "style" vacuous. Letter Spirit avoids this by constraining correlations to *human-interpretable* relational properties. The system’s parameters encode perceptual thresholds (e.g., minimum balance for ‘a’-ness), ensuring style remains anchored in cognition, not just statistics. *Glyph-X* works because its ratios and weights align with human gestalt principles—unlike truly random patterns.  

  Nevertheless, Letter Spirit does not fully vindicate family resemblance. The project reveals that computation *requires* parameterization, blurring the line between primitivism and emergentism. Style is treated as both perceptual (emergent from relational interactions) and computational (reducible to weights). The alien system’s success shows categories need not be essentialist but also proves style is computationally tractable *because* it arises from statistical regularities in perception.  

  In conclusion, the hypothetical supports family resemblance over geometric essentialism but complicates style’s status: it is perceptual (hence primitive) yet modelable via statistics (hence emergent). Letter Spirit does not resolve this duality but demonstrates that style and computation are compatible—relational properties bridge the perceptual and the algorithmic.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-grade (18–20)**: Uses alien-alphabet case to rigorously separate perceptual style from geometric features; synthesizes all five moves.  
  **B-grade (15–17)**: Correctly describes Letter Spirit but treats style as subjective or reducible to stroke lists; limited use of hypothetical.  

  #### Criterion 1: Refutation of geometric essentialism via alien-alphabet case (5 marks)  
  - **Full Credit (5)**: Uses *Glyph-X* to argue stroke geometry is unnecessary for ‘a’-ness; contrasts geometric vs. relational properties.  
  - **A-level**: Explicitly links *Glyph-X*’s lack of shared strokes to family resemblance (e.g., "spirals replace curves, proving geometry is incidental").  
  - **B-level**: Correctly defines essentialism but uses hypothetical superficially (e.g., "aliens show letters can look different").  
  - **Error (lose 2–3 marks)**: Describes gridfont examples without philosophical engagement; conflates relational/geometric properties.  

  #### Criterion 2: Defense of style as perceptual primitive against statistical objection (4 marks)  
  - **Full Credit (4)**: Argues statistical weights *model* (without eliminating) perceptual invariants; cites *Glyph-X*’s recognition.  
  - **A-level**: Uses *Glyph-X* to show alien/Roman perceptual commonalities map to parameters (e.g., "curvature ratios capture shared gestalt").  
  - **B-level**: Asserts style is perceptual but reduces parameters to "just statistics" or "subjective choices."  
  - **Error (lose 2 marks)**: Claims AI success *proves* style has no essence; confuses weights with thermal noise analogies.  

  #### Criterion 3: Response to vacuity challenge (4 marks)  
  - **Full Credit (4)**: Argues family resemblance avoids vacuity via human perceptual constraints; references *Glyph-X*’s relational bounds.  
  - **A-level**: Notes *Glyph-X*’s parameters mirror Gestalt principles (e.g., "ratios must exceed perceptual thresholds").  
  - **B-level**: States style isn’t arbitrary but doesn’t tie to computation/perception.  
  - **Error (lose 2 marks)**: Ignores vacuity; claims any correlation is valid style.  

  #### Criterion 4: Synthesis of compatibility between style/computation (4 marks)  
  - **Full Credit (4)**: Qualifies family resemblance’s success; notes computation blurs primitivism/emergentism.  
  - **A-level**: Uses *Glyph-X* to show relational properties enable computational tractability *and* perceptual primacy.  
  - **B-level**: Concludes one-sidedly (e.g., "family resemblance wins" or "style is just statistics").  
  - **Error (lose 2 marks)**: Asserts computation disproves perceptual primitives; introduces unsolved technical details.  

  #### Criterion 5: Clarity, structure, and constraints (3 marks)  
  - **Full Credit (3)**: Avoids technical summaries; adheres to word limit/course materials; centers hypothetical.  
  - **A-level**: Hypothetical drives all arguments; polished academic prose.  
  - **B-level**: Hypothetical mentioned but not integrated; minor tangents.  
  - **Error (lose 1–2 marks)**: Summarizes gridfont pipeline; uses outside sources; word-limit violation.  

  ---  
  **End of Examination Package**
