  We are designing a 48-hour take-home exam for a philosophy of computation seminar. The focus is on Douglas Hofstadter's Letter Spirit project, and we want to push students to engage with the philosophical questions of style, category formation, and the tension between essentialism and family resemblance. The exam prompt should be self-contained and rely only on course materials.

  ### Exam Prompt Structure
  1. **Context Setting**: Briefly describe the Letter Spirit project and its goals.
  2. **Core Philosophical Question**: Pose the question of what makes every instance an 'a' and introduce the tension between style as a primitive vs. emergent property, and essentialism vs. family resemblance.
  3. **Hypothetical Scenario**: Present the alien alphabet scenario where an 'a'-like glyph shares no geometric strokes but only relational style properties with the Roman 'a'.
  4. **Task**: Ask students to defend or reject the claim that this hypothetical supports a Wittgensteinian family-resemblance account over essentialism. Also, require them to address the objection that the system's statistical parameters reduce style to correlations.
  5. **Requirements**: Specify the expected length (around 1200 words) and that no outside research or citations are allowed.

  ### Model Answer Structure (650 words)
  The model answer should:
  (a) Distinguish geometric-feature essentialism from relational-style recognition.
  (b) Use the alien-alphabet case to argue that shared stroke geometry is unnecessary.
  (c) Evaluate whether statistical parameterization eliminates the reality of style or merely models perceptual conditions.
  (d) Consider a self-undermining version of family resemblance (if any correlation is style, then style becomes vacuous).
  (e) Reach a qualified conclusion about whether Letter Spirit vindicates family resemblance or shows that style and computation are compatible.

  ### Marking Scheme (out of 20)
  We break down into five must-hit points with specific point allocations. For each:
  - Marks available.
  - Full credit move.
  - Difference between A and B level.
  - Common mistake to avoid.

  We explicitly note:
  - A answer must use the alien-alphabet case to separate perceptual style from geometric features.
  - B answer might correctly describe Letter Spirit but treat style as either purely subjective or reducible to stroke lists.

  Common errors to flag:
