answer: |-
  **Final Examination Question: Philosophy of Physics 742**  
  **Time Allowed: 60 minutes**  

  > **Essay Prompt:**  
  > The standard decision-theoretic derivation of the Born rule in Everettian quantum mechanics (EQM) argues that rational agents should use |ψ|² branch amplitudes as weights for expected utility maximization. However, consider the following *epitstemic invariance constraint*: because the universal wavefunction evolves unitarily, every branch is equally real, and an agent’s epistemic situation (their evidence and physical state) is identical across branches at the moment of branching. Consequently, any rational credence assigned to branches must depend *only* on information available identically in all branches.  
  >  
  > **Address ALL THREE parts systematically:**  
  > 1. **Identify and critique the indifference principle:** Explain precisely where the decision-theoretic argument introduces a principle of indifference over branches *weighted by amplitude*. Argue why this principle either (a) *begs the question* against a fully deterministic ontology (by covertly assuming probabilistic "occurrence"), or (b) *smuggles in a probabilistic assumption* incompatible with universal wavefunction determinism.  
  >   
  > 2. **Assess epistemic invariance:** Can this constraint be satisfied *without* (i) collapsing EQM into a single-world hidden-variable theory, or (ii) reducing branch weights to *subjective self-locating uncertainty* that undermines the fundamental determinism of EQM? Justify your answer.  
  >   
  > 3. **Diagnose the tension:** Does this challenge show that EQM *fails to solve the measurement problem* (because it cannot ground objective probabilities)? Or does it merely require *reconceiving "probability"* as a purely normative tool for agents in a branching universe? Defend your conclusion.  

  ---

  **Model Answer (Approx. 700 words):**  

  **Part 1: The Indifference Principle’s Circularity**  
  The decision-theoretic derivation of the Born rule (e.g., Wallace 2012) assumes that rational agents facing branching events must maximize expected utility. Crucially, it applies a *weighted principle of indifference*: agents should treat quantum branches as "possible outcomes" and assign indifference over them *weighted by their amplitude modulus*. This step is question-begging. In a deterministic multiverse, branches are not "possible outcomes" awaiting realization; they are all actual. The derivation demands indifference over branches *as if* they were probabilistic alternatives, but weights them by |ψ|²—the very probabilities it aims to derive. This covertly assumes that amplitudes *deserve* to be treated as weights, implying an objective probabilistic fact (e.g., "high-amplitude branches are more likely to contain future agents"). But EQM’s ontology denies this: all branches are equipresent. Thus, weighting indifference by amplitude either *presupposes* the Born rule (circularity) or illicitly imports probabilistic metaphysics (e.g., treating amplitude as "degree of existence") incompatible with unitary determinism.  

  **Part 2: Epistemic Invariance and Its Costs**  
  Satisfying epistemic invariance requires agents to assign identical credences across branches, as all branches contain identical copies of the agent with identical evidence. This forces credences to depend *only* on intrinsic, branch-invariant properties. |ψ|² weights cannot serve this role: they are not intrinsic to agents (who are identically embodied in all branches), nor do they describe objective "chances" of being in one branch (since agents are in all branches). To salvage invariance, two paths fail:  
  - **(i) Hidden variables**: Introducing extra ontology (e.g., Bohmian trajectories) to pick out a "real" branch violates EQM’s commitment to wavefunction monism.  
  - **(ii) Self-locating uncertainty**: Treating branching as creating uncertainty "about which branch I am in" is incoherent. Pre-branching, there is one agent; post-branching, there are many. Agents in each branch are *distinct successors*, not a single agent uncertain of location. Framing this as subjective uncertainty smuggles in probabilistic *ignorance*, contradicting EQM’s deterministic, all-actual multiverse.  
  Thus, epistemic invariance cannot be satisfied without abandoning core tenets of EQM: either its pure wavefunction ontology or its rejection of fundamental indeterminism.  

  **Part 3: Reconceiving Probability or Admitting Failure?**  
  This tension does not prove EQM *fails* the measurement problem. The measurement problem concerns unitary dynamics generating definite outcomes—which branching resolves ontologically. However, it shows that EQM cannot ground *descriptive probabilities* of branch "occurrence" without violating epistemic invariance or determinism. Instead, |ψ|² must be reconceived as *purely normative*: it prescribes rational action for agents who, *despite knowing all branches are real*, must make bets affecting their *future branches*. The weights arise from pragmatic rationality under branching (e.g., caring about future selves proportionally to amplitude), not from metaphysics. Probability here is *forward-looking*: it governs decisions about consequences *within* branching, not ignorance over what "happens." While this divorces probability from ontology, it preserves EQM’s solution to the measurement problem—provided we accept that probability in quantum theory is *only ever* a theory of rational agency, not of objective occurrence.  

  **Conclusion**: The tension exposes a category error: treating decision-theoretic weights as descriptive probabilities misapplies a normative tool to ontology. EQM solves the measurement problem by replacing collapse with branching but redefines probability as a branch-relative calculus for agents navigating deterministic multiplicity.  

  ---

  **Marking Scheme**:  
  **Grade B (Competent)**:  
  - Identifies the decision-theoretic step imposing amplitude-weighted indifference over branches.  
  - Recognizes that epistemic invariance requires identical credences but struggles to explain why |ψ|² weights violate it.  
  - States that weights are normative but conflates normative/descriptive roles OR claims EQM "solves" probability without addressing determinism/invariance.  
  - Does not explicitly name the circularity in weighting indifference or the incoherence of self-locating uncertainty.  

  **Grade A (Excellent)**:  
  - **Explicitly demonstrates** that the weighted indifference principle *presupposes* the Born rule (circularity) and/or smuggles in probabilistic "occurrence" incompatible with determinism.  
  - **Clearly articulates** why |ψ|² cannot be descriptive probabilities under epistemic invariance (all branches real, no ignorance).  
  - **Critically distinguishes**: (a) self-locating uncertainty as incompatible with determinism (distinct successors ≠ one uncertain agent), and (b) hidden variables as abandoning EQM’s ontology.  
  - **Conclusively argues** that probability in EQM must be reconceived as *normative* (prescribing rational action) rather than *descriptive* (quantifying occurrence), and explains how this preserves EQM’s solution to the measurement problem while accepting the loss of objective probabilities.  

  **Verdict:** An A answer must explicitly demonstrate that the decision-theoretic derivation’s weighted indifference step *begs the question* by treating amplitude as a probabilistic weight while claiming to derive it.
