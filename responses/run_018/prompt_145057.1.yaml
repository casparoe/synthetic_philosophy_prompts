  Okay, let me approach this systematically. The user describes a four-step argument pattern in evolutionary debunking debates, specifically noting its layered defensive architecture. As a philosopher of science, I need to identify whether this matches existing frameworks or requires new conceptualization.

  First, I recognize this isn't straightforward special pleading because the critic offers domain-specific justifications rather than arbitrary exemptions. The companions-in-guilt comparison fails here since the structural distinction attempts to break the analogy rather than share epistemic burdens. 

  The key elements I observe are: 
  1) The critic's empirical claim about content-determination in morality 
  2) The defender's analogy to logic/math 
  3) The critic's structural differentiation 
  4) The circular empirical validation using cultural variation

  This resembles Sinnott-Armstrong's evolutionary explanations and Street's adaptive link account, but goes further by weaponizing cultural variation as both premise and conclusion. The circularity is particularly concerning - using variation as evidence of evolutionary determination while presupposing that determination explains variation.

  For boundary conditions, a substantive distinction would require independent criteria for "content-determination" beyond the variation itself. Otherwise it risks being an ad hoc retreat. The edges lie in whether the empirical observation (e.g. cultural variation) can be explained by alternative theories without assuming the debunking conclusion upfront.

  I consider labeling this "empirically circular domain insulation" but note that existing terms like "selective genealogical skepticism" might cover similar ground. The core issue is the bootstrapping of empirical evidence that already assumes the conclusion it purports to prove.
answer: |-
  Based on your description and my analysis (brainstorming first, then conceptualization), here's a precise breakdown of the argumentative structure you're tracking:

  **Brainstorming: Key Differences from Established Concepts**
  1.  **Distinct from Standard Special Pleading:** Special pleading typically involves an *unjustified exemption* from a general rule without relevant difference. Here, the critic *argues for a relevant structural difference* (content-determination vs. capacity-shaping), attempting to ground it empirically (cross-cultural variation). It’s not merely asserting an exemption; it’s offering a differentiating criterion.
  2.  **Distinct from Companions-in-Guilt (CIG):** The CIG response highlights shared epistemic vulnerability across domains. The critic's move here is a *domain-specific rebuttal* to the CIG analogy itself, denying the relevant similarity by positing a structural disanalogy. It's not accepting shared guilt; it's denying the companionship.
  3.  **Distinction from Generic Genetic Fallacy Concerns:** While the defender often invokes the genetic fallacy (origin ≠ justification), the critic’s layered response attempts to show the origin *is* relevant *specifically because* it bypasses or distorts the truth-tracking mechanism in this domain, unlike in logic/math. The appeal to variation is meant to *demonstrate* this bypassing.

  **Established Literature & Naming:**
  This specific layered structure doesn't have a single universally accepted name, but it maps onto key discussions:
  *   **Core Issue:** It's a sophisticated version of the **"Selective Genealogical Skepticism"** (SGS) or **"Differential Genealogical Explanation"** strategy, prominently debated in work by **Sharon Street**, **Guy Kahane**, **David Enoch**, and **Katia Vavova**. Street's "Darwinian Dilemma" (*Phil Studies*, 2006) is the foundational evolutionary debunking argument (EDA), and Enoch's response (*Taking Morality Seriously*, 2011) using CIG (with logic/math) is central.
  *   **The Structural Distinction:** The content/capacity split is often discussed as **"content-specific adaptation" vs. "domain-general capacity"**. Kahane (*Phil Perspectives*, 2011) explicitly analyzes this move in response to the CIG defense. Justin Clarke-Doane (*Morality and Mathematics*, 2020) extensively compares the epistemic status of morality and math, directly addressing this distinction and the variation/convergence point.
  *   **The Empirical Appeal:** The use of variation vs. convergence as *evidence* for the structural distinction (and thus the debunking) is a critical and contested step. Vavova (*Phil Studies*, 2014) argues forcefully that EDAs often rely on *prior normative assumptions* about reliability, making the variation argument question-begging. This step is the locus of the "circularity" or "bootstrapping" concern you identify.

  **Defining the Phenomenon: The Empirically-Circular Domain Insulation (ECDI) Strategy**

  1.  **What it is (Core Structure):** A defensive argumentative strategy employed by proponents of evolutionary debunking arguments (EDAs) against the companions-in-guilt (CIG) defense. It involves:
      *   **Layer 1: Domain-Specific Structural Distinction:** Positing a disanalogy between the target domain (e.g., morality) and the CIG domain (e.g., logic/math), claiming that evolutionary pressures *determined the specific content* of beliefs in the target domain but only shaped a *general capacity* for accessing independent truths in the CIG domain.
      *   **Layer 2: Empirical Validation via Variation/Convergence:** Invoking observed cross-cultural *variation* in the target domain's beliefs as *evidence* that evolutionary pressures directly determined content, while invoking cross-cultural *convergence* in the CIG domain as *evidence* that evolution only shaped a capacity accessing stable truths. Crucially, this empirical appeal *presupposes the very debunking conclusion it is meant to support*: the variation is interpreted *as proof* of non-truth-tracking, rather than as potentially compatible with truth-tracking under different evidence or circumstances.

  2.  **What it is NOT:**
      *   **Not Standard Special Pleading:** It provides an argued (though potentially flawed) differentiating criterion (content-determination) and empirical support (variation), rather than a mere arbitrary exemption.
      *   **Not the Basic CIG Defense:** The CIG defense points out shared vulnerability. ECDI is the *skeptic's rebuttal* to CIG.
      *   **Not the Core EDA Itself:** The core EDA is the initial claim (evolutionary origin undermines reliability). ECDI is the specific *response* to the *defender's CIG counter-argument*.
      *   **Not Necessarily a Genetic Fallacy:** Proponents argue the genealogy *is* relevant *because* it reveals a truth-tracking failure mechanism specific to the target domain (as evidenced by variation). The fallacy accusation arises from the circularity in *how* variation is used as evidence.
      *   **Not Inherently Vain:** The distinction *might* be valid. The flaw lies in the *circular justification* of that distinction via variation.

  3.  **Boundary Conditions & Edge Cases:**
      *   **Genuine Distinction vs. Ad Hoc Retreat:** The distinction is **substantive** if:
          *   The "content-determination" vs. "capacity-shaping" difference is supported by *independent* cognitive science evidence (e.g., specific neural modules for moral emotions vs. general prefrontal activity for abstraction), *not solely* by the variation/convergence observation.
          *   The proposed mechanism for how evolution determines content *directly conflicts* with truth-tracking in a way demonstrably different from how it shapes the capacity (e.g., Street's "adaptive link account").
          *   It can explain why variation *should be expected* under non-realism *and* convergence *should be expected* under realism in the target domain *without presupposing the conclusion*.
      *   **The distinction is likely Ad Hoc if:**
          *   The *only* evidence for the "content-determination" claim is the cross-cultural variation itself.
          *   The distinction is invoked *solely* in response to the CIG defense and isn't applied consistently to other domains where similar evolutionary pressures might be argued to shape content (e.g., folk physics, basic social cognition).
          *   It cannot explain why, *despite* the purported capacity-shaping in logic/math, there *isn't* similar problematic variation there, without again relying on the convergence observation circularly.
          *   It fails to address how the "capacity" in the CIG domain could reliably access truths if the same evolutionary forces shaped it, especially for necessary truths not directly tied to fitness.
      *   **Edge Cases:**
          *   **Aesthetics:** Variation is high, convergence is debated. Does ECDI work better here? Only if the structural distinction is independently plausible (e.g., evolved mating preferences directly shaping beauty standards).
          *   **Basic Perceptual Beliefs:** High convergence (e.g., shape, solidity). A CIG defense using perception is common. Critics might argue perception *is* content-determined by evolution for fitness, yet we deem it reliable. This pressures the ECDI proponent to explain why *this* content-determination is truth-tracking while morality's isn't, potentially collapsing the strategy or forcing deeper epistemic commitments.
          *   **Religious Belief:** High variation, but also claims of necessary truths (e.g., God's existence). ECDI might be applied similarly to morality, but faces challenges regarding the claimed necessity of theological truths and the nature of the "capacity" involved (faith vs. reason).

  **Precise Name & Conceptual Carving:** The phenomenon is best termed **Empirically-Circular Domain Insulation (ECDI)**. It's the strategy of *insulating* a debunking argument against a CIG challenge by positing a *domain-specific structural disanalogy* ("insulation") and then *circularly* using the very empirical phenomenon (variation in the target domain, convergence in the CIG domain) that the debunking argument seeks to explain as the *justification* for that disanalogy.

  **Conclusion:** You've astutely identified a sophisticated and highly contested move within the EDA literature. While the components (CIG, structural distinction, variation/convergence) are well-discussed (Street, Enoch, Kahane, Clarke-Doane, Vavova), the *specific layered architecture* combining them, particularly the **circular use of variation as both premise and proof of the structural distinction enabling the debunking**, is the core of ECDI. Its validity hinges critically on whether the content/capacity distinction can be justified *independently* of the variation observation it's meant to explain. As a journalist, focusing on this circularity and the demands for independent evidence of the structural distinction is key to analyzing these debates fairly and rigorously.
