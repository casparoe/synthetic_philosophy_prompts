prompt: |-
  You work as a philosophical counselor running 50-minute sessions for clients who present with existential complaints about "the meaning of life." Operationalize Frank Ramsey's reconstructed diagnosis—treating such questions as pseudo-problems generated by extending the grammatical form "What is the meaning of X?" (appropriate for symbols, sentences, or practices with specifiable rules) onto the totality "life," where no answer-conditions can be fixed—into a reusable decision procedure. Inject the following reconstructed distinction: distinguish practice-embedded meaning (recoverable only from within a specific form of life or activity) from transcendent meaning (demanding justification from an impossible standpoint outside all practices).

  Write an ordered checklist: the exact questions or tests to apply in sequence, what counts as a passing answer at each step, the stop conditions that yield one of three classifications—(1) pseudo-problem to be dissolved by grammatical clarification, (2) substantive practical crisis of purpose requiring ethical deliberation, or (3) clinical depressive or cognitive-distortion pattern requiring referral—and the points where the procedure must halt and hand judgment to a person because the distinction is normative rather than factual. Include three specific instruments: a counterfactual specification test (can the client state, without contradiction, conditions under which life would lack meaning?), a practice-embedding test (can the client identify the specific practice or form of life within which meaning is sought?), and a transcendence check (does the client demand justification of that practice from a standpoint outside it?). Flag which steps are judgment calls disguised as procedural tests.

  Apply the procedure to two worked cases: (A) a recently retired surgeon who says, "My life has lost its meaning because I no longer save lives," and (B) a graduate student who asks, "Given an infinite, indifferent universe, what is the meaning of human life as a whole?" Add a third variant—modify either case or present a new one—where the procedure delivers a classification the practitioner is likely to resist, and explain what that resistance reveals about the procedure's structural limits. Conclude by stating precisely what the procedure cannot do: which kinds of existential distress it will systematically misclassify, and why its output should never be treated as a mental-health diagnosis. Do not request citations, bibliographies, or reading lists.
reasoning: |-
  Hmm, the user wants me to create a decision procedure based on Frank Ramsey's philosophy about meaning-of-life questions. They want me to operationalize his idea that such questions are pseudo-problems arising from misapplying grammatical forms. I need to distinguish between practice-embedded meaning (within specific life activities) and transcendent meaning (demanding an impossible external justification).

  The user wants an ordered checklist with specific questions/tests, passing criteria, stop conditions, and three classifications: pseudo-problem to dissolve, substantive practical crisis, or clinical/referral case. They specifically want three instruments: a counterfactual specification test, a practice-embedding test, and a transcendence check. I should flag which steps involve judgment calls disguised as procedures.

  I also need to apply this to two cases: a retired surgeon feeling loss of meaning after retirement, and a graduate student asking about meaning in an indifferent universe. Plus a third variant where the classification might cause practitioner resistance, to reveal the procedure's limits. Finally, I must clarify what the procedure cannot do and why it shouldn't be used for mental health diagnosis.

  For the checklist, I'll structure it sequentially. Start with initial screening for clinical concerns, then move through the three core tests. The counterfactual test assesses whether the client can imagine life lacking meaning without contradiction - failure suggests a pseudo-problem. The practice-embedding test checks if they can identify a specific context for meaning - if not, it points to transcendent demands. The transcendence check identifies when they seek justification beyond all practices. I need to note where normative judgment is required, like distinguishing practical crisis from pseudo-problems.

  For case applications: The surgeon clearly fails the practice-embedding test (meaning was tied to surgery) but passes counterfactual (can specify loss conditions) - this suggests a substantive practical crisis. The grad student likely fails counterfactual (can't specify meaning-lacking conditions), fails practice-embedding (no specific practice), and demands transcendence - classic pseudo-problem. For the resistant case, I'll create a depressed artist who meets criteria for clinical referral but whose statements superficially resemble pseudo-problems, revealing how the procedure relies on accurate self-reporting.

  Key limitations: The procedure will misclassify distress rooted in non-linguistic factors (trauma, neurochemistry), culturally specific meaning frameworks, and cases where language itself is pathological. It must never replace mental health diagnosis because it ignores biological/emotional dimensions and pathologizes normal existential questioning. The output is purely conceptual mapping.

  I'll make sure the response is structured clearly with the checklist first, then case applications, the variant with resistance analysis, and finally limitations. The language should stay professional yet accessible, avoiding jargon where possible while respecting the philosophical depth required.
answer: |-
  ## Ramsey-Inspired Existential Complaint Decision Procedure

  **Core Principle:** Treat "meaning of life" complaints as potentially grammatical confusion arising from misapplying the question "What is the meaning of X?" (designed for rule-governed symbols/practices) to the unstructured totality "life," where no fixed answer-conditions exist. Meaning is operationalized as either *practice-embedded* (internal to specific activities/forms of life) or *transcendent* (demanding an impossible external justification).

  **Classification Targets:**
  1.  **Pseudo-Problem (Dissolution):** Complaint stems primarily from grammatical confusion; dissolves upon clarifying the category error and refocusing on practice-embedded meaning.
  2.  **Substantive Practical Crisis (Ethical Deliberation):** Complaint reveals a genuine crisis of purpose/loss *within* specific, identifiable practices; requires exploration of values, identity, and practical re-engagement.
  3.  **Clinical/Referral Pattern:** Complaint exhibits signs of clinical depression, significant cognitive distortions, or pathological fixation incompatible with the existential exploration; requires referral to mental health professional.

  **Ordered Checklist:**

  1.  **Initial Screen: Acute Risk & Clinical Flags**
      *   **Question/Test:** Assess for acute suicidality, severe impairment in basic functioning (hygiene, nutrition), pervasive anhedonia, or psychotic features. *This is ongoing vigilance, not a single question.*
      *   **Passing Answer:** Absence of acute risk indicators or severe dysfunction requiring immediate stabilization.
      *   **Stop Condition/Classification:** If **present**, **HALT** procedure. **Classify as (3)** and initiate safety protocol/referral. Judgment *always* required here.
      *   **Notes:** This is a **critical judgment call disguised as a screen.** Severity and context are paramount.

  2.  **Counterfactual Specification Test**
      *   **Question/Test:** "Can you describe a specific scenario, however unlikely, where you would confidently say human life *lacked* meaning altogether? What conditions would make that true?" Probe for specificity and internal consistency. Avoid metaphors.
      *   **Passing Answer:** Client provides a *coherent, non-contradictory* counterfactual scenario where life lacks meaning (e.g., "If all consciousness caused only suffering," "If all humans were irredeemably evil automatons").
      *   **Stop Condition/Classification:**
          *   If **FAILS (cannot articulate any coherent scenario, or scenarios are contradictory/metaphorical):** Strong indicator of pseudo-problem arising from grammatical confusion. *Proceed to Step 3.*
          *   If **PASSES:** Suggests the client *does* have some implicit criteria for meaning/meaninglessness. *Proceed to Step 4.*
      *   **Notes:** **Judgment call** required to assess coherence and distinguish genuine counterfactual thinking from vague despair or metaphorical gestures.

  3.  **Pseudo-Problem Confirmation & Dissolution Path**
      *   **Question/Test:** (After Step 2 Fail) "When you ask 'What is the meaning of life?', are you seeking something like an instruction manual for life as a whole, or a purpose assigned by something *outside* of all human activities and experiences?" Introduce the grammar distinction: Explain the difference between "meaning of X" for specific things (like words/surgeries/chess) vs. "life as a whole." Ask: "Does reframing your question as potentially misusing language, like asking for the 'location' of a number, change how you feel about the problem?"
      *   **Passing Answer:** Client shows recognition of the grammatical point, expresses relief or reduced urgency about the "big question," and demonstrates willingness to refocus on more specific concerns (if present).
      *   **Stop Condition/Classification:** If client **demonstrates insight and reduced distress** about the transcendent question, **Classify as (1)**. Proceed to explore if any *practice-embedded* concerns remain underneath. If client **rejects the distinction or doubles down on transcendent demand**, *Proceed to Step 5 (Transcendence Check).*

  4.  **Practice-Embedding Test**
      *   **Question/Test:** (After Step 2 Pass) "When you feel life lacks meaning, or when you seek meaning, can you point to specific *areas*, *roles*, *activities*, or *relationships* in your life where this feeling is strongest or where meaning used to be found? What were the rules, goals, or values *within* that specific context?" Probe for concreteness: roles (parent, artist, scientist), activities (gardening, hiking, volunteering), relationships (friend, partner), communities.
      *   **Passing Answer:** Client identifies one or more specific, concrete practices, roles, or forms of life relevant to their distress or search (e.g., "being a surgeon," "my research," "being part of my religious community," "my marriage," "creating art").
      *   **Stop Condition/Classification:**
          *   If **PASSES:** Strong indicator of **substantive practical crisis (2)**. *Proceed to Step 6*.
          *   If **FAILS (remains abstract, e.g., "life in general," "human existence"):** Suggests demand is transcendent or too diffuse. *Proceed to Step 5 (Transcendence Check).*

  5.  **Transcendence Check**
      *   **Question/Test:** (After Step 3 Rejection or Step 4 Fail) "Is the meaning you're seeking something that would make sense *regardless* of any specific human activity, value, or perspective? Does it need to be justified from a standpoint completely outside of everything humans do, feel, or care about? Would meaning found *within* your relationships, work, or passions still feel insufficient because it's 'just human'?"
      *   **Passing Answer:** Client explicitly rejects the need for transcendent justification or acknowledges that meaning must be found within human practices, even if difficult. (Rare after reaching this step).
      *   **Stop Condition/Classification:**
          *   If **FAILS (affirms need for transcendent justification):** Confirms **pseudo-problem (1)** rooted in impossible demand. Focus on dissolution via grammatical clarification and examining the impulse for transcendence.
          *   If **PASSES (rejects transcendence):** Re-evaluate Step 4 failure – is there a blocked or unarticulated practical concern? Consider if cognitive distortion (e.g., nihilistic overgeneralization) is preventing identification. **Judgment call**: Lean towards **(2)** if practical focus emerges, or **(3)** if fixation/distortion persists. *Proceed to Step 6 cautiously.*
      *   **Notes:** **Major judgment call.** Distinguishing philosophical insistence on transcendence from pathological despair or cognitive distortion is nuanced.

  6.  **Final Clinical & Functional Assessment**
      *   **Question/Test:** Assess pervasiveness of hopelessness, anhedonia beyond specific practices, significant cognitive distortions (overgeneralization, disqualifying the positive, catastrophic thinking), impact on basic self-care and responsibilities, social withdrawal. *Does the identified practical concern (if any) seem proportionate to the level of distress and impairment?*
      *   **Passing Answer:** Distress is contextually understandable and focused on practical loss/crisis; cognitive patterns are flexible; basic functioning is maintained.
      *   **Stop Condition/Classification:**
          *   If **clinical flags significant** (pervasive anhedonia, severe impairment, rigid distortions), **HALT. Classify as (3)** and discuss referral.
          *   If **distress is focused and proportionate** to practical concerns, **Classify as (2)** and engage in ethical/practical deliberation.
      *   **Notes:** This is the **primary judgment call step.** Requires integrating all previous information and clinical sensitivity. Reliance on self-report is a limitation.

  **Case Applications:**

  *   **Case A: Recently Retired Surgeon**
      *   *Statement:* "My life has lost its meaning because I no longer save lives."
      *   **Step 1:** Passes (no acute risk indicated).
      *   **Step 2 (Counterfactual):** PASSES. Likely scenario: "If I *could* still operate but chose not to, and people died needlessly" or "If my work had actively harmed people, not helped." Meaning is tied to the *impact* of the activity.
      *   **Step 4 (Practice-Embedding):** PASSES. Clearly identifies the specific practice: "Being a surgeon," "saving lives through surgery."
      *   **Step 5:** Not needed (passed Step 4).
      *   **Step 6:** Distress is focused, proportionate to the major life change. Likely no pervasive clinical flags.
      *   **Classification: (2) Substantive Practical Crisis.** Meaning was embedded in the practice of surgery. Crisis requires ethical deliberation on identity beyond the role, transferable values (helping, mastery), and finding new practices to embed meaning.

  *   **Case B: Graduate Student**
      *   *Statement:* "Given an infinite, indifferent universe, what is the meaning of human life as a whole?"
      *   **Step 1:** Passes (assumed no acute risk).
      *   **Step 2 (Counterfactual):** **FAILS.** Struggles to specify coherent conditions. Answers are abstract ("If it were all suffering," but struggles with "all" or contradictions; resorts to "If God didn't exist"). Suggests the question itself might be ill-formed.
      *   **Step 3 (Pseudo-Problem Path):** Introduce grammatical distinction. Client likely resonates, finding relief ("Oh, it's like asking for the weight of justice?") or doubles down ("But science shows the universe *is* indifferent!"). Assume insight/relief.
      *   **Classification: (1) Pseudo-Problem.** Complaint dissolves upon recognizing the grammatical category error. Focus shifts to whether there's an underlying *practical* concern masked by the big question (e.g., stress in grad school?).

  *   **Variant Case C: The "Existentially Depressed" Artist**
      *   *Modified Case:* A successful painter states: "All art is meaningless. Beauty is subjective, the art market is corrupt, and posterity forgets everyone. Nothing I do matters in the grand scheme of the indifferent cosmos. Why paint?" They report profound anhedonia, neglect studio and hygiene, and feel hopeless about *all* activities.
      *   **Procedure Application:**
          *   **Step 1:** Flags possible impairment (neglect, anhedonia).
          *   **Step 2 (Counterfactual):** **FAILS.** States life *already* lacks meaning due to cosmic indifference/subjectivity. Cannot imagine conditions where it *wouldn't* lack meaning ("Even if happy, it's delusion").
          *   **Step 3:** Rejects grammatical dissolution ("It's not word games, it's reality! The universe *is* indifferent").
          *   **Step 5 (Transcendence Check):** **FAILS.** Demands cosmic justification ("Unless my art changed the fate of the universe, it's pointless"). Rejects practice-embedded meaning as insufficient.
          *   **Step 6:** Significant anhedonia, neglect, pervasive hopelessness, disqualifying the positive ("Success is luck/corruption"), catastrophic thinking ("Nothing matters... ever").
          *   **Classification: (3) Clinical/Referral Pattern.** Strong signs of depression with existential themes.
      *   **Practitioner Resistance & Revealed Limits:** A practitioner philosophically sympathetic to nihilism or critical of "medicalizing" existential angst might resist classifying this as (3). They might see it as a legitimate (1) or extreme (2). This resistance reveals:
          1.  **The Normative Core:** The judgment that demanding cosmic justification is pathological (rather than potentially insightful) is normative. The procedure assumes that transcendence-seeking *in this debilitating form* is dysfunctional.
          2.  **Dependence on Functional Impact:** The classification hinges on the severity of impairment and cognitive distortions, which are value-laden clinical judgments. The procedure doesn't "prove" depression; it flags patterns *interpreted* as pathological within a specific (Western therapeutic) framework.
          3.  **Masked Judgment Calls:** Steps 5 and 6 are heavily reliant on the practitioner's thresholds for "pathological fixation" vs. "philosophical rigor," and "proportionate distress" vs. "clinical depression."

  **What the Procedure Cannot Do & Limits:**

  1.  **Misclassifies Non-Linguistic/Non-Cognitive Distress:** It systematically misclassifies existential distress rooted primarily in:
      *   **Neurobiological Factors:** Severe depression where anhedonia/hopelessness are symptoms, not conclusions.
      *   **Trauma/Attachment Wounds:** Profound disconnection or terror often manifests as meaninglessness but stems from pre-verbal or relational rupture, not grammatical confusion.
      *   **Socioeconomic Oppression:** The crushing weight of systemic injustice can make "meaning" feel like a luxury; the procedure might mislabel this as (2) or (1) when the roots are structural violence.
  2.  **Cultural & Contextual Blind Spots:** It assumes a Western, individualistic framework. Concepts of meaning deeply tied to collective identity, ancestral connection, or spiritual frameworks not centered on "justification" may be misinterpreted as transcendent demands or pseudo-problems.
  3.  **Cannot Diagnose Mental Illness:** The output is a *conceptual classification* of the complaint structure, **not** a mental health diagnosis. It lacks:
      *   Assessment of biological/neurological factors.
      *   Comprehensive psychopathological evaluation (DSM/ICD criteria).
      *   Exploration of developmental history or complex trauma.
      *   Tools for differential diagnosis.
  4.  **Pathologizes Valid Philosophical Positions:** It risks pathologizing coherent, non-debilitating philosophical stances (e.g., existentialist acceptance of absurdity without despair, some forms of nihilism) if expressed during distress, due to reliance on functional impairment judgments.
  5.  **Depends Heavily on Self-Report & Practitioner Judgment:** Accuracy hinges on client articulation and the practitioner's skill in applying normative distinctions and identifying clinical patterns. It cannot bypass the hermeneutic challenge of understanding another's inner world.
  6.  **Does Not Provide Meaning:** It dissolves pseudo-questions or identifies practical crises, but it *cannot* supply practice-embedded meaning. That requires the client's active engagement within forms of life, supported by ethical deliberation (for (2)) or clinical work (for (3)).

  **In essence, this procedure is a tool for *conceptual mapping* of existential complaints based on Ramsey's insight and Wittgensteinian distinctions. It clarifies the *form* of the question to guide the *type* of response (dissolution, practical help, referral), but it cannot answer the unanswerable, heal trauma, or replace medical diagnosis.** Its value lies in preventing philosophical misdirection in the consulting room, not in providing definitive answers or diagnoses.
