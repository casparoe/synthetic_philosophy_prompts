  Here’s a sestina adhering to your formal constraints, voicing the finitist objection through the disrupted envoi and the shifting end-words:

  **The Finitist's Reply to Hilbert's Hotel**

  You claim this endless corridor, each **room**
  Can hold, then shift, another passing **guest**.
  You speak of sets defined by cardinal **number**,
  Unfazed by paradox. Your clever **map**
  Assures us vacancy: declare it **empty**,
  Proclaim the whole arrangement **complete**.

  But see the labour, task that’s never **complete**:
  The bellboy’s weary tread from hall to **room**,
  The constant search for what you call **empty**.
  For every settled, newly welcomed **guest**,
  Demands the order shift – consult the **map**!
  Assign anew the ever-growing **number**.

  Is there a final, settling **number**?
  Can this perpetual motion be **complete**?
  Your function’s rule, a neat recursive **map** –
  n+2 frees space where once was one **room**,
  But calls the next arrival, claims the **guest**
  For whom you’ll *always* need an **empty**.

  You point to odds, declare them **empty**,
  Assigned no prior, settled **number**.
  You welcome one, the latest **guest**,
  Insisting that the plan stays **complete**.
  But freeing space within the crowded **room**
  Requires the endless work of your own **map**.

  You draw the lines, invoke the pairing **map**,
  Insist the odds stand truly **empty**,
  Ready for the next who needs a **room**.
  You count the gaps with transfinite **number**,
  Declare the shifting logic **complete**,
  While shunting every settled **guest**.

  But I observe each weary **guest**
  Displaced again by this forced **map**.
  The process runs – can it be **complete**?
  Is any space held truly **empty**,
  When movement chases cardinal **number**
  Infinite steps to fill one **room**?

  You say: "Shift guest to room n+2, find empty room."
  I say: "For every guest assigned, the map demands the next step. Number
  Completes? The claim is empty. This shifting can't be complete."

  **(Envoi - Broken Pattern)**
  Your logic claims a **guest** can find the **map**,
  Declares the **empty** set a finished **number**...
  But shifting never stops. This **room**? Incomplete.

  ---

  **Structural Breakdown for Clarity:**

  1.  **End-Word Rotation:** Follows the strict sestina pattern (1-2-3-4-5-6, then 6-1-5-2-4-3, etc.) through all six stanzas, enacting the "shifting" of Hilbert's strategy (n -> n+2).
  2.  **Finitist Voice:** The poem directly challenges the Hilbertian/Cantorian perspective ("You claim...", "You speak...", "You point...", "You say...") and counters with the finitist objection ("But see...", "Is there...", "But I observe...", "But shifting never stops").
  3.  **Mathematical Accuracy:**
      *   References the core action: "n+2 frees space" (freeing odd-numbered rooms).
      *   Mentions "cardinal number," "sets," "function's rule," "pairing map," "transfinite number," "shifting logic," "infinite steps."
      *   Highlights the *process* ("constant search," "perpetual motion," "endless work," "shifting never stops") as the core finitist objection.
  4.  **The Broken Envoi:** Instead of the expected pairs (room/guest, number/map, empty/complete), the envoi deliberately disrupts the closure:
      *   Line 1: **guest** (2) / **map** (4) - *Mismatched pair, suggesting the map doesn't reliably place the guest.*
      *   Line 2: **empty** (5) / **number** (3) - *Mismatched pair, questioning the "finished" status of the empty set claimed by the cardinality.*
      *   Line 3: **room** (1) / **Incomplete** (6) - *While "room" is placed correctly (1), "complete" (6) is replaced by "Incomplete," emphatically breaking the cycle and denying totality.*
      *   The final word, "Incomplete," directly contradicts the expected "complete," embodying the finitist rejection of the infinite totality ever being "complete." The broken pairings visually represent the failure of the mapping to achieve finality.

  This structure uses the sestina's inherent recursion to mirror Hilbert's shifting procedure, while the shattered envoi performs the finitist interruption, leaving the process unfinished and the totality incomplete.
