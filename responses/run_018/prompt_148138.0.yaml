  Designed to viscerally expose the combination problem in panpsychism—specifically, the leap from micro-experiences to a unified macro-subject.  

  ---

  #### **Setup & Materials**  
  - **Groups**: 3–4 students per group.  
  - **Time**: 40 minutes (25 min activity + 15 min debrief).  
  - **Materials per Group**:  
    - **Phenomenal Token Cards** (1 per student): Hidden cards assigning a "bare quality" with discrete features.  
      *Example Tokens*:  
      - `Unstructured hum` → *Features*: Modality=Auditory, Intensity=Low, Location=Diffuse  
      - `Pure pressure` → *Features*: Modality=Tactile, Intensity=High, Location=Hand  
      - `Faint glow` → *Features*: Modality=Visual, Intensity=Medium, Location=Diffuse  
      - `Static buzz` → *Features*: Modality=Auditory, Intensity=High, Location=Head  
    - **Rule Sheets** (1 per student): Same for all. Explains constraints, strategies, and scoring.  
    - **Auditor Cheat Sheet** (1 per group): Lists token features for post-activity verification.  
    - **Report Template**: A single sheet for the group’s macro-subject description.  

  ---

  #### **Rules**  
  1. **Secrecy & Communication**:  
     - Students *cannot* reveal their token’s intrinsic qualities (e.g., "I have a hum").  
     - Only **relational descriptions** allowed:  
       - ✅ Permitted: *"The quality that contrasts with the quality in the hand"* (if "hand" is inferred from relations).  
       - ❌ Banned: *"Auditory"*, *"Red"*, *"Warm"*.  

  2. **Strategies (Choose One)**:  
     - **Aggregation**:  
       - Describe the collective as one subject owning *multiple distinct experiences*.  
       - *Report Example*: "The subject experiences: (1) a quality Q1 that opposes Q2 in intensity, (2) a quality Q2 that co-occurs with Q3 in location..."  
     - **Fusion**:  
       - Blend tokens into **one unified quality** (e.g., "a single hum-pressure-glow").  
       - Apply the **Overlap Constraint**:  
         - If tokens share a *feature category* (e.g., both have `Location=Diffuse`), they *must* unify that category.  
         - **Conflict Resolution**: If features in the same category *differ* (e.g., `Intensity=Low` vs. `High`):  
           - Option A: **Force Identity** → One feature is erased (e.g., only `High` remains; `Low` is orphaned).  
           - Option B: **Residue** → Both features become "orphans" (belonging to no subject).  
       - *Report Example*: "The subject experiences a singular quality where [relational description]. Orphans: Medium Intensity (from Token 2)."  

  3. **Scoring (No Money Needed)**:  
     - **Base Points**: 5 pts for submitting a report.  
     - **Aggregation Bonus**: +1 pt per token successfully included via relational description.  
     - **Fusion Bonus**: +3 pts if the report describes *one unified experience* (not a list).  
     - **Penalties**:  
       - **Orphan Penalty**: -2 pts per unreported orphan (found by auditor).  
       - **Direct Description Cheat**: -3 pts per intrinsic term (e.g., "pressure").  
     - **Winning**: Highest-scoring group gets bragging rights + "Combination Champions" title.  

  ---

  #### **Activity Flow**  
  1. **Prep (5 min)**:  
     - Distribute materials. Emphasize: *"No intrinsic language! Focus on relations."*  
  2. **Group Work (20 min)**:  
     - Groups debate strategy (aggregation vs. fusion), create descriptions, and document orphans (if fusing).  
  3. **Audit & Scoring (10 min)**:  
     - Groups swap reports and token feature sheets (auditor cheat sheet).  
     - Auditors check for:  
       - Orphans (fusion) or missing tokens (aggregation).  
       - Intrinsic description cheats.  
       - Penalties/bonuses applied.  
  4. **Group Reports (5 min)**:  
     - Each group reads their macro-subject description aloud.  

  ---

  #### **Debrief Framework**  
  **Map the Game to Panpsychism**:  
  - **Aggregation** → "A crowd, not a subject":  
    - *"You listed micro-experiences under one owner, but did it *feel* like a unified self? Or just a bundle?"*  
  - **Fusion** → "Loss of the originals":  
    - *"When you forced unity via fusion, you sacrificed original qualities (orphans). Is the macro-subject *truly* composed of the micro-experiences?"*  

  **Honest Limitations of the Game**:  
  - *What’s Missing*:  
    - **Mental causation**: The game doesn’t model how micro-experiences *cause* macro-experiences.  
    - **Metaphysical gap**: Creating a "macro-subject" via rules ≠ explaining how subjectivity *emerges*.  
  - *Verbal Supplement*:  
    - *"Real panpsychism struggles with how micro-minds 'blend' into macro-minds without losing causation or creating gaps. This game simplifies that into tokens and orphans."*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem**: Students describe tokens intrinsically ("My token is a hum!").  
     - **Fix**: Interrupt early: *"Use relations—e.g., 'the quality that harmonizes with...'—or lose points!"*  

  2. **Problem**: Fusion groups ignore orphans ("We fused everything! No residue!").  
     - **Fix**: Require groups to submit an "orphan ledger" *before* scoring. Ask: *"Did you check for shared features?"*  

  3. **Problem**: Relational descriptions become circular ("Quality A relates to B, which relates to A...").  
     - **Fix**: Encourage hierarchies: *"Anchor one token (e.g., 'most intense quality') and relate others to it."*  

  4. **Problem**: Aggregation groups default to fusion-like unity ("We combined them into a symphony!").  
     - **Fix**: Clarify: *"Aggregation = a subject *having* multiple experiences, not *being* one experience."*  

  ---

  **Why This Works**:  
  - Students physically wrestle with the gap: Fusion *loses* tokens; aggregation *lacks* unity.  
  - The "orphan" mechanic forces confrontation with residue/erasure trade-offs.  
  - Points incentivize rigor without complexity.  
  - Auditing makes constraints tangible.  

  **Outcome**: They’ll leave feeling the combo problem in their bones—not just on the whiteboard.
