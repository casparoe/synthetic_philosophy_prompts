  I should ensure the example clearly shows the tension. Using slavery makes it stark. Then, explaining why the ontology/ideology move fails because it doesn't preserve the necessary connection moral terms imply. Finally, highlighting that without modality, ethics becomes descriptive, losing its normative essence. That addresses the user's request and reveals the core issue in Quine's framework.
answer: |-
  Here’s an example illustrating the tension, followed by an analysis of why Quine’s ontology/ideology distinction fails to resolve it and what this reveals about naturalized ethics:

  ### **Scenario: The "Wrongness" of Chattel Slavery**
  - **Naturalized Moral Property**: Quine naturalizes "wrongness" as *a complex set of empirically observable harms*—e.g., psychological trauma, physical suffering, social destabilization, and impediments to human flourishing—caused by the practice of chattel slavery.  
  - **Anti-Essentialist Constraint**: Quine denies that any property (e.g., "causing suffering") is *necessarily* tied to "wrongness." Wrongness is merely a contingent, behaviorally observed pattern in human societies.  

  #### **The Tension Emerges**  
  Imagine an alien society ("Beta-World") where chattel slavery exists but **lacks all empirically detectable harms** due to:  
  - Genetic engineering removing pain/emotional distress.  
  - Perfect social harmony maintained via neural implants.  
  - Enslaved individuals reporting high life satisfaction.  

  **Quinean Naturalist Claim**:  
  In Beta-World, slavery *is not wrong* because the natural properties constituting wrongness (suffering, dysfunction) are absent. "Wrongness" is reducible to these contingent empirical effects.  

  **Essentialist Intuition**:  
  We feel slavery in Beta-World remains *necessarily wrong* because its core features—*treating humans as property, negating autonomy*—constitute wrongness *regardless of outcomes*. This implies:  
  > "If an institution treats humans as property, it is **necessarily wrong** (even if no suffering occurs)."  

  Quine cannot accommodate this necessity. For him:  
  - Beta-World slavery is descriptively identical to ours but morally neutral.  
  - "Wrongness" collapses into *whatever harms we empirically observe here and now*.  

  ---

  ### **Why the Ontology/Ideology Distinction Fails to Resolve This**  
  Quine distinguishes:  
  - **Ontology**: *What exists* (e.g., suffering, social practices).  
  - **Ideology**: *How we conceptualize/refer* to what exists (e.g., "wrongness" as a term).  

  He might argue:  
  > "We ontologically commit only to natural properties (suffering, etc.), while 'wrongness' is ideological shorthand for these properties. No modal metaphysics is needed."  

  **The Problem**:  
  1. **Moral Explanations Require Modality**:  
     - To explain *why* suffering makes slavery wrong, we invoke necessity: "Suffering *must* make slavery wrong because it violates essential human needs."  
     - Without this, "wrongness" is merely a *correlation* (slavery + suffering), not a *normative* property. Calling slavery "wrong" becomes no different than calling it "pain-causing."  

  2. **Moral Generalizations Are Modal**:  
     - "Slavery is wrong" functions as a law-like generalization: it holds *across counterfactual scenarios* (e.g., even in Beta-World). Quine’s anti-essentialism reduces this to: "Slavery is wrong *when it causes suffering*." This fails to capture the categorical force of moral claims.  

  3. **Loss of Normative Authority**:  
     - If "wrongness" is *only* an ideological label for observed harms, it cannot justify *why we ought to abolish slavery* in a new society where harms are not yet observed. The essentialist modal claim ("slavery’s structure *ensures* harm") provides this justification; Quine’s descriptivism cannot.  

  ---

  ### **What This Reveals About Quinean Naturalized Ethics**  
  1. **Collapse into Descriptivism**:  
     Moral properties become *nothing beyond* descriptive natural properties (e.g., "wrong" = "causes suffering"). This erases the *normative* dimension of ethics. We can describe slavery’s effects, but we lose the reason to say "it *should not* exist" if effects change.  

  2. **The Indispensability of Modality for Normativity**:  
     Ethics inherently deals with *necessity* (e.g., "autonomy *must* be respected") and *possibility* (e.g., "a society *could* be just"). Quine’s rejection of modality forces naturalized ethics into a straitjacket where moral terms are either:  
     - **Redundant** (merely renaming natural properties), or  
     - **Unintelligible** (if they pretend to normative force).  

  3. **A Dilemma for Quinean Naturalism**:  
     - **Option 1**: Embrace modal commitments (e.g., functional or causal necessities) to preserve moral realism. *But this violates Quine’s anti-essentialism*.  
     - **Option 2**: Reject modality and accept that "moral properties" are purely descriptive. *But this reduces ethics to sociology/psychology, stripping it of normative authority*.  

  ---

  ### **Conclusion**  
  The tension reveals that **Quinean naturalized ethics cannot ground robust moral properties without smuggling in modal commitments**. The ontology/ideology distinction only defers the problem: while "wrongness" may be ideology, its *explanatory and normative roles* require necessities Quine forbids. Thus, a genuinely non-modal Quinean ethics either:  
  - **Eliminates normativity** (collapsing into descriptivism), or  
  - **Renders moral discourse incoherent** by severing it from its modal foundations.  

  This suggests that naturalism in ethics *must* either revise Quine’s hostility to modality (as later naturalists like Boyd or Brink attempt) or accept moral anti-realism—neither of which Quine would endorse.
