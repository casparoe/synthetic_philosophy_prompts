  Now, why can't the ontology/ideology distinction help here? Ontology is about what exists, ideology about how we talk about it. Quine might say "wrongness" as a term is just a way to describe certain natural properties, without committing to necessities. But the problem is that moral judgments seem to carry a modal force. If we strip that away, calling slavery "wrong" just means it causes harm in this world, but not necessarily. That feels inadequate for ethics because we want to say it's wrong even if, hypothetically, no harm occurred. Without that, moral properties lose their normative bite and become purely descriptive.

