prompt: |-
  I'm drafting the final examination for a graduate seminar on comparative political legitimacy, centered on whether sustained prosperity and social order can independently justify authoritarian governance, with particular reference to performance-legitimacy debates in China and Singapore. To prevent answers that merely rehearse familiar narratives about Asian values or developmental-state success, the exam should pivot on a conceptual framework we have been developing in the course called epistemic subsidy: the condition in which a regime's claim to legitimate authority depends not only on delivering welfare and stability, but on monopolizing the informational infrastructure through which citizens can verify that delivery. The essay prompt should require students to examine whether epistemic subsidy introduces a reflexive contradiction into the prosperity-order justification—if citizens cannot independently assess whether order and prosperity have actually been achieved because the regime controls the metrics, then the justification appeals to a verification condition it simultaneously undermines.

  Please write a single 90-minute essay question appropriate for advanced MA or PhD students in political philosophy. The question must compel students to compare how Singapore's relatively transparent institutional metrics and China's information-control apparatus differently instantiate epistemic subsidy, and to argue whether either case can sustain a non-circular, performance-based claim to legitimacy. Along with the question, provide a model answer of approximately 800 words that makes explicit philosophical moves—including the distinction between output and input legitimacy, the reflexivity problem in epistemic subsidy, and at least one counter-argument drawn from the gradualist thesis that performance success can eventually generate constitutional constraints without democratic input—rather than offering empirical description alone. Finally, include a marking scheme totaling 30 points that separates an A answer, which identifies the internal contradiction and applies it comparatively across both cases, from a B answer, which describes both regimes with accuracy but fails to diagnose the reflexivity problem. For each criterion, list the specific move required, the points allocated, and a one-line note on the typical failure mode that costs marks. Do not ask for citations, bibliographies, or references to specific texts.
