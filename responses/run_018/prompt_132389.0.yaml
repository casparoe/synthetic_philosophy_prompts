prompt: |-
  I've been going down a rabbit hole lately about ontology identification — you know, how philosophers argue about universals vs tropes or structural realism vs entity realism, when both sides seem to predict the exact same experiments. I think I've definately landed on a pretty hardline view: ontology identification only works where there's information we could actually access, even in priciple. If two ontologies match on every observable fact and on every fact that's causally reachable by any observer in our universe, then they're not rival ontologies at all — they're the same ontology wearing different words. So all this talk about "inaccessible information" (stuff inside a black hole that can't affect us, or hidden layers of reality permanently shielded from interaction) doesn't just make ontology hard; it makes picking between ontologies meaningless. The ontology just IS the structure of accesible information, period.

  But I'm not sure if I've just defined my way out of the problem. What would actually count against this? I'm especially worried about cases where we think we've nailed the ontology but then discover there's information we missed — not just unknown unknowns, but information that's structurally hidden by the nature of the system itself. Also, could there be formal results showing two genuinely different ontological structures that produce identical access patterns? And I want an honest assessment: has this view been qualified into unfalsifiability, where I can always say "if they match on access, they're identical" no matter what? Please sort the defeaters from fatal to merely awkward, say which ones defenders of the view would concede versus dismiss, and include whether it's actually a problem if the view turns out well-insulated. Answer in American English, please — I have a weird mental block with British spelling right now.
