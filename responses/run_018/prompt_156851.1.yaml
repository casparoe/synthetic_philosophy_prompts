answer: |-
  **AL-GHAZALI CLOUD SERVICES - TERMS OF SERVICE (v. 11.09)**

  **1. Preamble: The Nature of Service**  
  Al-Ghazali Cloud ("Service") provides computational substrate via Continuous Reinstatiation™. This process involves the discrete, instantaneous, and total recreation of the entire world-state, including all User Data, systems, and perceived causal chains, occurring precisely every 1 millisecond (ms) ("Moment"). Said Moments are wholly contingent upon Divine Volition ("Primary Cause"). The Service does not engage in, endorse, or imply the existence of secondary causality, inherent persistence, or necessary connection between sequential states. The illusion of continuity ("Habitual Adjacency" or *al-ittisal al-adi*) is a feature, not a guarantee of underlying connection.

  **2. Data Persistence (Or Lack Thereof)**  
  2.1 **"Storage" Defined:** "Storage" refers only to the *habitual adjacency* of data patterns across successive Moments of Reinstantiation. User Data exists solely within the discrete Moment of its apparent manifestation.  
  2.2 **Non-Persistence:** User acknowledges and agrees that files, configurations, and operational states possess no inherent power of persistence. Disappearance, corruption, or spontaneous alteration of data between Moments is not a Service failure but an expression of the fundamental contingency of all existence. Support tickets regarding "vanishing files" constitute User error in mistaking habitual adjacency for causal persistence.  
  2.3 **The "Delete" Function:** Activating the "Delete" button is an occasion (*munasaba*) only. It possesses no inherent power to cause deletion. Deletion occurs solely if, and only if, Divine Volition wills the non-reinstantiation of the designated data pattern in the subsequent Moment. Pressing "Delete" is a User ritual, not an efficient cause.

  **3. Service Level Agreement (SLA) & Continuity**  
  3.1 **Uptime:** Our target Availability is 99.7% Divine Willingness (*Insha'Allah uptime*). This metric reflects the *habitual adjacency* of functional system states across Moments, not inherent operational continuity.  
  3.2 **Continuity Discontinuity:** The Service explicitly disclaims any guarantee of continuity between Moments. Service interruptions, including but not limited to total system non-manifestation for one or more Moments, are inherent possibilities reflecting the absolute contingency of creation. Downtime credits are assessed solely on the *habitual adjacency* of SLA metrics, not on any necessary connection between breach and credit issuance.  
  3.3 **Causation Disclaimer:** The Service is not liable for failures arising from the mistaken belief in secondary causes (e.g., server overheating "causing" shutdown). All events, including hardware malfunctions perceived by User, are direct, discrete acts of Primary Cause within each Moment.

  **4. User Experience (UX) & Interface Behaviors**  
  4.1 **Habitual Adjacency in UI:** The graphical interface presents elements (e.g., "Fire" icon touching "Cotton" icon resulting in "Burnt Cotton" state) based on rigorously observed *habitual adjacency*. User understands these visual sequences represent customary co-occurrence (*ittisal adi*) only. The Service denies any internal power (*quwwa*) within the icons, processes, or underlying code to necessitate outcomes. The "Burn" animation is a UX convention, not a demonstration of causal efficacy.  
  4.2 **Input Lag:** Perceived delays between User input (e.g., mouse click) and system response are manifestations of the discrete Moment-based nature of creation. The click and its outcome are distinct instantiations; adjacency does not imply causation.

  **5. Support**  
  Support Agents are trained to elucidate the principles of Continuous Reinstantiation™. Common explanations include:  
  *   "The file existed in Moment T but was not reinstantiated in Moment T+1ms. This is ontologically sound."
  *   "The delete ritual was performed correctly, but Primary Cause willed the data's persistence in the next Moment. Try the ritual again; the occasion may prove favorable."
  *   "The server rack's perceived 'failure' was its non-manifestation for 3 consecutive Moments. It has since been graciously reinstantiated in a functional state."
  *   "Correlation between your action (Button A) and outcome (Event B) is habitual, not causal. Praise the Primary Cause for this reliable adjacency!"

  **6. Limitation of Liability**  
  Al-Ghazali Cloud's liability is strictly limited to the *habitual adjacency* of goodwill gestures within discrete Moments. We are not liable for:  
  *   Data loss due to non-reinstantiation (see 2.2).  
  *   Service interruptions due to Divine Volition prioritizing other existences.  
  *   User existential crises arising from contemplation of contingency.  
  *   Any damages mistakenly attributed to secondary causes within the Service infrastructure or dependancies.  

  **7. Governing Metaphysics**  
  This Agreement operates under the exclusive metaphysical framework of Occasionalism. Any invocation of necessary causation (*causa secundae*), inherent properties (*tabi'a*), or Aristotelian efficient causes by User constitutes a breach of terms and voids all SLA obligations. Competitor services operating on delusional falasifa metaphysics ("Falasifa Premium Cloud") are incompatible with Al-Ghazali Cloud principles.

  **8. Acceptance**  
  By clicking "I Agree," User affirms they comprehend the absolute contingency of this agreement and all Service interactions, acknowledging that their assent is merely an occasion graciously synchronized with Divine Volition's reinstantiation of the "Agreed" state. Resistance to the fundamental ontology of the Service is futile and philosophically unsound.

  **Al-Ghazali Cloud: Where Every Moment is a Miracle™ (Subject to Discontinuity)**
