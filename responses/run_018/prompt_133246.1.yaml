answer: |-
  Your friend's experience reveals a profound crisis in the group's hermeneutic structure—a collapse of deliberative space into what we might call **ideological semiotic capture**. This isn't mere interpersonal friction; it's the manifestation of a **structural failure in the collective's epistemic ethics**, where institutional forms have reconstituted perception itself. Let's dissect the architecture:

  ### Core Philosophical Pathology: The Erasure of the Particular
  The group has entered a state where **factual particulars** (grant conditions, logistical impacts) are no longer intelligible as shared objects of analysis. Instead, they've become mere **signifiers in a pre-existing symbolic struggle**. This aligns with:
  - **Sartrean seriality**: Members now relate through the mediating gaze of factional identities ("autonomist" vs. "pragmatist"), not direct engagement with reality.
  - **Foucauldian epistemic violence**: The group’s discourse imposes compulsory interpretive grids that annihilate nuance. Your friend’s judgments are "received" not as thoughts but as moves in a game of positional chess.
  - **Levinasian ethical suppression**: The demand that she be *legible to the collective* (as ally or traitor) overrides her responsibility to attend to the concrete Other (the grant's material implications for recipients).

  ### The Institutional Mechanism: Consent as Ideological Trap
  The consent-based model ("principled objection") was designed to prevent domination but now **produces its own tyranny**:  
  - **False binary construction**: By reducing all positions to "for/against solidarity" or "for/against efficacy," the structure eliminates the possibility of *tertium quid*—your friend’s attempt at immanent critique.  
  - **Procedural fetishism**: The form of deliberation (consent-seeking) masks its hollowed-out substance. What once protected autonomy now enforces ideological conformity by demanding declarations of positional purity.  
  - **Moral cognition colonization**: Members no longer ask "Is this true?" but "What camp does this utterance serve?" This is the **totalization of the political**—where every fact becomes an allegory of faction.  

  ### The Ethical Crossroads: Duty vs. Complicity  
  Her dilemma exposes the false choice between martyrdom and flight. The real question is: **Can one resist the logic without becoming its instrument?**  

  1. **The Duty to Resist (Conditional)**  
     - Stay *only* if she can rupture the semiotic capture *from within*. This requires:  
       - **Refusing interpellation**: Explicitly rejecting factional labels when analyzing particulars ("I am not evaluating this grant as a 'pragmatist' but as someone examining Appendix B, line 12").  
       - **Re-ontologizing the concrete**: Forcing attention to granular details ("Before we discuss solidarity, let’s map how monthly reports would divert 30 volunteer-hours from medicine deliveries").  
     - **Risk**: If the group pathologizes this refusal ("Why won’t you take a side?") it confirms the corruption is terminal.  

  2. **The Duty to Withdraw (When Resistance Becomes Bad Faith)**  
     - Withdrawal is intellectually honest when:  
       - The collective *punishes* attention to particulars (e.g., dismissing data as "divisive").  
       - One’s presence *legitimizes* the corrupted process ("See? Even skeptics participate!").  
     - **Moral calculus**: Staying in a system that annihilates judgment isn’t fidelity—it’s self-betrayal that also absolves others of accountability.  

  ### Verdict: The Necessity of Boundary Work  
  Your friend’s capacity for independent evaluation is not just personal—it’s the **last remnant of the ethical in a system consuming itself**. Her duty is to:  
  - **Stage a decisive confrontation**: Present her analysis *once*, framed explicitly as a test of the group’s capacity for non-allegorical thought. Example: "If we cannot discuss reporting requirements without attributing motives, we’ve ceased to be a mutual-aid collective and become a sect."  
  - **Act on the response**:  
    - If met with *recognition* ("You’re right—let’s examine Appendix B"), stay and rebuild.  
    - If met with *further semiotic capture* ("That’s such an autonomist thing to say!"), leave immediately.  

  To remain after the latter would be to endorse the **transformation of ethics into ethology**—where human judgment is reduced to pack behavior. Withdrawal then becomes the only act that preserves the possibility of true solidarity elsewhere. The group’s corruption lies not in disagreement, but in its *method of interpreting disagreement*: a self-immolating dialectic that mistakes the map of positions for the territory of need. Her exit, if necessary, is not abandonment but an indictment of the false community that eats its own capacity to see.
