  ### Adversarial Collaboration: Historical Explanation in Hanseatic Bookkeeping Diffusion (1420–1580)  
  **Joint Statement by Covering-Law (CL) and Narrative (N) Proponents**  

  ---

  #### I. Agreed-Upon Claims  
  Both parties affirm the following:  
  1. **Explanation Definition**: A historical explanation must render an outcome *intelligible* by identifying its causes, whether through general patterns or contextual specifics.  
  2. **Case Facts**:  
     - Adoption of double-entry bookkeeping was spatially/temporally uneven across Hanseatic towns.  
     - No monocausal factor explains all instances (e.g., literacy alone is insufficient).  
     - High-quality guild records exist for six cities (Lübeck, Danzig, Hamburg, Bremen, Rostock, Cologne).  
  3. **Methodological Commitments**:  
     - **CL**: Seeks to subsume cases under probabilistic regularities (e.g., "literacy + charter reforms → adoption likelihood ↑").  
     - **N**: Requires tracing actor-driven sequences (e.g., "guild master X misinterpreted text Y, leading to adaptation Z").  
  4. **Shared Principles**:  
     - All explanations must be empirically grounded in archival sources.  
     - Both approaches accept multifactorial causality (e.g., literacy, charters, and textual transmission interact).  
     - Neither denies the *utility* of the other; the dispute concerns *necessity and sufficiency*.  

  ---

  #### II. Disagreements Table  
  | Topic                            | Covering-Law (CL) Position                                                                 | Narrative (N) Position                                                                 |  
  |----------------------------------|--------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Necessity of Laws**            | *All historical explanations require implicit or explicit probabilistic laws. Without them, claims are ad hoc and lack predictive power.* | *Laws are unnecessary; a well-constructed narrative suffices to explain singular events through contextual emplotment.* |  
  | **Causal Status of Singulars**   | *Singular causal claims (e.g., "Master A’s misreading caused Bremen’s delay") must instantiate broader statistical regularities to be valid.* | *Singular causes are directly established via evidence of mechanisms (e.g., correspondence, guild minutes), not law-subsumption.* |  
  | **Evidential Role of Coherence** | *Narrative coherence is rhetorical, not evidentiary; coherence alone cannot confirm causality without law-based testing.* | *Coherence is evidentiary; a narrative resolving contradictions in the evidence constitutes proof of causal relations.* |  
  | **Validation Method**            | *Explanation requires showing outcome fits a probabilistic pattern (e.g., regression of adoption rates on literacy/charter variables).* | *Explanation requires showing outcome is the inevitable result of a contingent, actor-driven sequence.* |  

  ---

  #### III. Cruxes: Evidence and Predictions  
  **Crux 1: Can singular causes operate without instantiating statistical laws?**  
  - **Evidence**: Correlation between charter revision dates (e.g., Lübeck 1460, Danzig 1520) and bookkeeping adoption dates in six cities.  
    - **CL Prediction**: *Strong positive correlation* (ρ ≥ +0.7): Charter revisions precede adoption within 5–15 years, reflecting a law-like regularity (e.g., "Charter flexibility → adoption probability ↑").  
    - **N Prediction**: *Weak/no correlation* (ρ ≤ +0.3): Adoption timing depends on idiosyncratic factors (e.g., a Danzig guild’s misreading of Italian texts in 1517), not charter timing.  
  - **Shared Test**: Regress adoption dates against charter revision dates; both accept outcome as falsifiable.  

  **Crux 2: Is narrative coherence evidentially significant?**  
  - **Evidence**: Guild minutes from Lübeck (1542) and Danzig (1517–1523) detailing debates over Italian texts.  
    - **CL Prediction**: Coherence is incidental; only *statistical outliers* (e.g., rapid adoption in low-literacy towns) would challenge narrative plausibility.  
    - **N Prediction**: Coherence is *causally probative*; minutes showing Master B’s misinterpretation → factional conflict → delayed adoption in Danzig directly explain the outcome.  
  - **Shared Test**: If Lübeck/Danzig records show identical initial conditions but divergent outcomes, N claims coherence explains it; CL demands a hidden variable (e.g., merchant networks).  

