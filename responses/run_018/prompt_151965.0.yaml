answer: |-
  Here is a rigorous analysis of the 2016 Brexit referendum through the lens of synchronic vs. diachronic membership, mapping the franchise rules and exclusions to test the conceptual boundaries:

  ### 1. Conceptual Framework Applied to Franchise Rules
  - **Synchronic Membership (Present Subjection)**:  
    *Definition*: Those presently residing within the territorial jurisdiction and subject to the state's coercive laws.  
    *Institutional Mapping*:  
    - Included: UK-resident British/Commonwealth citizens (directly subject to UK laws).  
    - Excluded:  
      - Long-term EU residents (e.g., Polish nurse in UK for 20 years).  
      - British expatriates (>15 years abroad).  
    - Ambiguous: Irish/Maltese/Cypriot EU residents (included via bilateral treaties, not subjection principle).  

  - **Diachronic Membership (Future Impact)**:  
    *Definition*: Those whose fundamental life prospects (citizenship rights, economic security, identity) are irrevocably shaped by the decision across time.  
    *Institutional Mapping*:  
    - Excluded:  
      - EU residents in UK (facing residency uncertainty).  
      - British citizens abroad >15 years (loss of EU freedom of movement, inheritance rights).  
      - Future generations (altered economic/civic opportunities).  
      - Young voters (16–17-year-olds excluded despite living with consequences longest).  

  ---

  ### 2. Testing the Principles Against Exclusions

  | **Excluded Group**          | **Synchronic Principle**                             | **Diachronic Principle**                             | **Theory-Event Misalignment**                                                                 |
  |-----------------------------|------------------------------------------------------|------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **EU Residents (Non-Irish/Maltese/Cypriot)** | ❌ Fails: They *are* subject to UK laws (taxation, criminal justice). Exclusion violates synchronic logic. | ✅ Strong Case: Residency rights, employment, family ties catastrophically disrupted. | *Theory illuminates incoherence*: Institutional design prioritizes citizenship over subjection, contradicting synchronic theory. |
  | **British Expatriates (>15 yrs abroad)** | ⚠️ Partial Justification: Not *currently* subject to all UK laws (e.g., NHS access). | ✅ Overwhelming Case: Loss of EU residence rights, pension access, consular protection. | *Theory falls silent*: Synchronic principle ignores enduring legal-personal ties; diachronic principle lacks institutional mechanisms. |
  | **Future Generations**      | ❌ Explicitly Excluded: No present subjection.       | ✅ Imperative: Inherit economic/political consequences without voice. | *Theory produces implausibility*: Diachronic logic demands inclusion but offers no feasible democratic method (e.g., trusteeship). |
  | **16–17-Year-Olds**         | ⚠️ Debatable: Partial subjection (e.g., criminal law) but no full civic duties. | ✅ Critical: Greatest lifetime exposure to consequences. | *Reveals arbitrary thresholds*: Synchronic theory cannot resolve why 18-year threshold overrides impact severity. |

  ---

  ### 3. Theory's Illuminations and Limitations  
  - **Where Theory Illuminates**:  
    - The exclusion of EU residents exposes a **jurisdictional gap**: Synchronic logic demands their inclusion ("all subjected"), but the franchise prioritized *citizenship*—a non-coercive, ascriptive status. This reveals the state’s privileging of national identity over liberal subjection principles.  
    - Disenfranchised expatriates highlight the **temporal poverty of synchronic demos**: Their diachronic interests (property rights, return migration) were materially affected, yet sovereignty was exercised by a presentist demos with lesser stakes.  

  - **Where Theory Falls Silent or Fails**:  
    - **Defining "Substantial Impact"**: Diachronic theory identifies future generations as members but offers no operational standard for "substantiality" (e.g., why include expatriates but not global markets affected by Brexit?).  
    - **Authority of the Present over Future**: The core dilemma is stark: Synchronic demos claims binding authority to reshape the diachronic population’s life chances (e.g., young Britons’ lost EU opportunities). **No democratic theory convincingly justifies this temporal asymmetry.**  
    - **Institutional Design Vacuum**: Neither principle resolves *how* to weigh interests diachronically (e.g., representing the unborn) or reconcile border fluidity (e.g., should EU residents vote in UK elections but not referendums?).

  ---

  ### 4. What Brexit Reveals About the Boundary Problem  
  The referendum demonstrates that the boundary problem is **not merely spatial but fundamentally temporal**. Key revelations:  
  1. **The Synchronic Demos is Ill-equipped for Diachronic Decisions**: Brexit’s 50-year consequences were decided by a snapshot electorate. This violates the democratic ideal that those burdened by a choice should authorize it (*all-affected principle*).  
  2. **Citizenship Trumps Subjection**: The franchise exposed that states default to *national belonging* when defining the demos, even where subjection and impact cut across civic lines. This undermines normative claims that democracy derives legitimacy from protecting the subjected.  
  3. **The Tyranny of the Present**: The case crystallizes the core paradox: **How can a demos bounded by present residence claim rightful authority to bind future populations and exclude deeply impacted present non-members?** Neither principle alone resolves this, suggesting democratic legitimacy requires hybrid models (e.g., stakeholder voting for long-term residents, guardian advocates for future interests).

  ---

  ### Conclusion: The Epistemic Breach
  The Brexit referendum illustrates that the boundary problem’s deepest challenge is **temporal sovereignty**. Synchronic theories fail to legitimize decisions that reconstitute the diachronic community (e.g., severing EU ties). Diachronic theories, while normatively compelling, lack institutional correlates. This case urges democratic theorists to confront not *where* to draw boundaries, but *how a demos confined to the present can justifiably govern the future**. Institutional innovations—such as reversible referendums, supermajority requirements for intergenerational impacts, or weighted voting for the young—may be necessary to bridge this gap, but their democratic legitimacy remains contested. The referendum thus stands as a cautionary tale: when the demos’ temporal scope is misaligned with a decision’s impact horizon, democratic legitimacy fractures.
