prompt: |-
  You're a moral philosopher who also reads the cross-cultural psychology literature seriously. Take your time, brainstorm a pile of candidate defeaters before you pick any, and please don't just run through the standard objection-list you'd get in a survey article.

  The position I've ended up at: the variation that WEIRD-samples work keeps turning up gives us very little reason to give up on moral objectivity, because what varies is the parameter settings and not the machinery. Every culture seems to run some version of a few core routines — don't harm an insider for no reason, don't cheat on reciprocal arrangements, defer to certain superiors or sacred things — and what differs is how wide the circle of protected beings is drawn (ancestors, animals, fetuses, outgroupers), how much weight purity and loyalty get when they collide with harm and fairness, and whether the domain is handled mostly by rules or mostly by relationships. The disagreement is downstream of shared structure, the way languages differ in whether they mark evidentiality while sharing a grammar.

  What would count against that? I want defeaters ranked from fatal to merely awkward, and I want you to separate the ones a defender of my view should *concede* as counting against it from the ones they'd be right to shrug off as already consistent with it. Two things I'd particularly like you to chew on:

  1. Grain. Am I just describing norms at whatever level of generality makes them match? If "don't harm an insider gratuitously" is universal only because "insider" and "gratuitously" can be filled in locally, is there any content left, or does my view collapse into the formal claim that every culture has some norms it treats as non-optional?

  2. A study I keep imagining. Suppose you run the moral/conventional probes in a lot of small-scale societies, but you add three relativizing questions: would it still be wrong in a village where everyone did it, would it still be wrong if the ancestors or gods commanded it, and would it still be wrong if no one ever found out. Suppose the result is that a small core survives all three everywhere, but the core is *tiny* and its membership shifts a lot between samples, and in a couple of places nothing survives the "the ancestors command it" question at all.

  Does that kill the parameter-setting story or just shrink it? Also: what does my view predict that its rivals don't, and has it been qualified to the point where no finding could touch it — and if it has, is that actually a problem for a claim of this kind, or is insulation fine here? For what its worth, what would move me most is evidence about the *unit* of explanation: if the variation tracks things like market integration or residential mobility rather than "culture" in any thick sense, my story has the wrong explanatory target even if the shared-structure part is true.
reasoning: |-
  Okay, the user is a moral philosopher who's deep into cross-cultural psychology. They've developed a view that moral objectivity isn't undermined by cultural variation because differences are just parameter settings on universal machinery. They want defeaters ranked from fatal to awkward, and specifically want me to chew on two issues: grain and a hypothetical study.

  Hmm, this is sophisticated stuff. The user clearly knows the literature but wants fresh angles beyond standard objections. They're worried about their view being unfalsifiable if the "shared structure" becomes too abstract. That grain point is sharp - if "insider" and "gratuitously" are entirely culturally defined, does "don't harm" retain any substantive content? And that imagined study probing moral/conventional distinctions across cultures could really challenge the core they propose.

  Let me start by mapping the architecture of their position. They see morality as having universal "routines" (harm avoidance, reciprocity, hierarchy) with cultural variation in: scope (who counts as "insider"), weighting when principles conflict, and implementation (rules vs relationships). The analogy to linguistic universals is key here - just like all languages have nouns/verbs but vary in features like evidentiality.

  For potential defeaters... I need to think beyond the usual suspects. The grain problem is fundamental. If the universals are defined at such a high level of abstraction that they can accommodate any content through redefinition, that's nearly fatal. It would make their position collapse into trivial formalism. 

  The hypothetical study is fascinating. If only a tiny, shifting core survives relativizing probes across cultures - and especially if some cultures show no rules surviving divine command overrides - that seriously undermines the "shared machinery" claim. The parameter-setting story could shrink to near nothingness.

  Other strong defeaters would be evidence that moral cognition doesn't track "culture" but material factors like market integration or residential mobility. That would suggest their explanatory target is wrong. Also damning would be finding genuinely incommensurable moral foundations (not just parameter differences), or discovering that moral judgment relies on domain-general cognition without dedicated architecture.

  Medium-strength issues include evidence that moral rules emerge from social coordination games rather than innate structures, or findings that the "core routines" dissociate neurologically. Weaker objections might involve cultural variation in moral development timelines or differences in how violations are processed.

  What would their view uniquely predict? Maybe that moral dumbfounding should occur cross-culturally for core violations, or that moral grammar shows similar acquisition patterns worldwide. If no finding could falsify their view because it's been qualified into triviality, that's a problem - though maybe an inevitable one for high-level claims about human nature.

  This user is clearly wrestling with how to maintain moral objectivity while taking cultural variation seriously. Their concerns about unfalsifiability show impressive intellectual honesty. At heart, they seem to want a robust universalism that doesn't flatten difference - a tricky but worthy balancing act.
answer: |-
  Here's a systematic breakdown of defeaters for your "parameter-setting" view of moral objectivity, ranked by severity and categorized by how a defender should respond. I've prioritized novel angles over standard objections and focused intensely on your concerns about grain and the hypothetical study.

  ### Fatal Defeaters (Must Concede If Found)

  1.  **The Grain Problem: Trivial Universality**
      *   **The Challenge:** If "don't harm an insider gratuitously" is universal *only* because "insider" (e.g., could exclude slaves, outcasts, enemies) and "gratuitously" (e.g., could include blasphemy, violating purity, failing loyalty) are entirely culturally defined, the "core routine" lacks substantive content. It collapses into: "Every culture has rules it treats as non-optional for its members regarding beings it values." This is descriptively true but philosophically vacuous for objectivity claims. It doesn't point to *what* is objectively wrong, only *that* cultures treat *something* as wrong.
      *   **Why Fatal:** It severs any necessary link between the "universal machinery" and any *particular* moral content beyond social regulation. Objectivity requires something invariant *in the norms themselves*, not just in the *form* of having norms.
      *   **Defender's Mitigation (Weak):** Argue that the *structure* of harm-avoidance *towards entities deemed worthy of consideration* is universal, even if membership changes. But this risks conceding the core point – the "deemed worthy" part does the heavy lifting, not an objective property of the entities.

  2.  **The Explanatory Unit Mismatch (Your Key Concern):**
      *   **The Challenge:** Empirical evidence shows moral variation correlates strongly with *functional socio-ecological factors* (market integration, residential mobility, pathogen prevalence, warfare intensity, subsistence strategy) rather than "culture" as a holistic, thick entity. If "parameter settings" track these factors directly and rapidly (within generations), and moral judgments shift predictably with changes in these factors, it undermines the "shared cultural grammar" analogy.
      *   **Why Fatal:** Your view posits "culture" as the unit setting parameters on shared machinery. If the variation is better explained by adaptive responses to material conditions operating largely *outside* of thick cultural transmission, the "shared structure" becomes epiphenomenal or merely a reflection of these deeper functional pressures. The "grammar" isn't driving the variation; the environment is, and the "grammar" is just the cognitive toolkit used to implement the locally adaptive solution.
      *   **Defender's Concession:** This is a major challenge. A defender must either show that "culture" robustly mediates these functional pressures in a way that preserves distinct parameter-setting, or significantly revise the view to incorporate these functional drivers as primary shapers of the parameters.

  3.  **The Hypothetical Study: Collapse of the Inviolable Core:**
      *   **Scenario B (Fatal):** *"In a couple of places nothing survives the 'the ancestors command it' question at all."*
      *   **Why Fatal:** If *any* society demonstrates that *no* moral prohibition is considered binding if a sufficiently authoritative supernatural command overrides it, it directly refutes the existence of a *non-optional* core machinery concerning harm/cheating/etc. It suggests morality in that context is *entirely* contingent on divine will/ancestral authority, reducing your "core routines" to mere *preferences* of the gods/ancestors, not objective constraints. This isn't parameter-setting; it's a fundamentally different architecture where authority *creates* obligation, rather than constraining how universal obligations apply.
      *   **Scenario A (Severely Damaging):** *"A small core survives all three everywhere, but the core is tiny and its membership shifts a lot between samples."*
      *   **Why Damaging:** A tiny, shifting core suggests:
          *   **Lack of Robust Universality:** The supposedly universal "machinery" (harm, fairness) isn't reliably activated as non-optional across cultures.
          *   **Grain Problem Resurface:** The "core" might just be the last vestige of the grain problem – whatever *this specific group* happens to treat as absolutely non-negotiable *right now*, which could be highly idiosyncratic (e.g., "Don't mock the chief's hat," "Don't let the sacred fire die").
          *   **Undermines Objectivity:** If what counts as absolutely wrong varies significantly and unpredictably (shifting membership), it's hard to argue this reflects objective parameters rather than contingent cultural facts.
      *   **Defender's Concession:** Scenario B is likely fatal. Scenario A requires conceding the "core" is much smaller and less stable than hoped, significantly weakening the objectivity claim derived from universality. The parameter-setting story shrinks dramatically.

  ### Major Defeaters (Significant Challenge, May Require Revision)

  4.  **Truly Incommensurable Foundations:**
      *   **The Challenge:** Discovery of a society whose fundamental moral "building blocks" simply don't map onto the proposed Harm/Care, Fairness/Reciprocity, Ingroup/Loyalty, Authority/Respect, Purity/Sanctity framework *at all*. Not just different parameter settings, but genuinely different *categories* or foundational concerns (e.g., a primary emphasis on ecological balance understood as a non-personal force, where "harm" to humans is secondary to disrupting balance; or a focus on "flow" or "connectedness" that doesn't decompose into harm/fairness/etc.).
      *   **Why Major:** It directly challenges the universality of the proposed "machinery." Parameter-setting requires shared parameters. Different machinery suggests deeper cognitive pluralism.
      *   **Defender's Response:** Could argue this is an undiscovered "routine" or a complex interaction of known ones. Requires careful ethnographic analysis to see if it's truly incommensurable or just unfamiliar weighting/scope.

  5.  **Moral Rules as Emergent Coordination, Not Innate Machinery:**
      *   **The Challenge:** Strong evidence that the "core routines" are primarily solutions to recurrent coordination problems (e.g., managing aggression, securing cooperation, maintaining group cohesion) that emerge through cultural evolution and learning, *without* relying on deeply innate, domain-specific cognitive modules. They are "attractors" in social space, not pre-installed programs.
      *   **Why Major:** Undermines the "machinery" metaphor. If the universals arise from domain-general learning and social dynamics, not specialized moral cognition, it weakens claims about the structure being "built-in." Objectivity derived from shared innate structure is compromised.
      *   **Defender's Mitigation:** Can argue that domain-general learning mechanisms interacting with universal human social challenges *produce* the appearance of shared machinery, which still supports a form of pragmatic objectivity. But the "innateness" claim is weakened.

  ### Awkward Defeaters (Consistent but Require Explanation/Qualification)

  6.  **Differential Emergence/Dissociation:**
      *   **The Challenge:** Evidence that the proposed "core routines" don't develop synchronously or uniformly cross-culturally (e.g., purity concerns emerge much later in some societies, fairness manifests very differently in non-market societies) or that they neurologically/behaviorally dissociate in ways inconsistent with being facets of a unified "moral faculty."
      *   **Why Awkward:** Suggests the "machinery" isn't as integrated or uniformly available as implied. Parameter-setting might apply unevenly.
      *   **Defender's Shrug:** Parameter-setting models can accommodate different developmental trajectories and some dissociation. Variation in emphasis is expected. Requires refinement, not rejection.

  7.  **Radical Context-Sensitivity within Cultures:**
      *   **The Challenge:** Findings showing that within a single "culture," moral judgments exhibit extreme context-sensitivity that doesn't neatly follow the proposed parameters (e.g., harm to an outgrouper is permissible in context X but not Y, fairness overridden by loyalty in unexpected ways), suggesting the "settings" are highly fluid and situation-dependent, not stable cultural parameters.
      *   **Why Awkward:** Challenges the stability and explanatory power of "parameter settings" at the cultural level. Are parameters really set, or just activated dynamically?
      *   **Defender's Shrug:** Parameters are defaults or priors, not rigid rules. Contextual override is part of moral reasoning. This is consistent with a sophisticated parameter-setting view incorporating situational factors.

  8.  **"Conventional" Domains Colonizing the "Moral":**
      *   **The Challenge:** Evidence that in some cultures, violations typically classified as "conventional" (e.g., dress codes, forms of address) exhibit key features of "moral" violations (authority-independence, generality, seriousness) according to standard probes, blurring the distinction your view might rely on.
      *   **Why Awkward:** Challenges the universality of the moral/conventional distinction as a marker of the "core machinery." Suggests the domain of the "non-optional" is culturally constructed more broadly.
      *   **Defender's Shrug:** The *content* deemed non-optional varies (parameter setting!), but the *treatment* as non-optional is what marks the output of the moral machinery. Purity/Loyalty/Authority often manifest as rules with this force.

  **Addressing Your Specific Questions:**

  1.  **Grain:** This is the most fundamental threat. A defender *must* avoid collapsing into trivial universality. They need to argue that:
      *   The *structural relationships* are objective (e.g., *If* X is deemed a moral patient, *then* gratuitous harm to X is wrong; reciprocity *ought* to be honored *if* an arrangement exists).
      *   The machinery generates *constraints* on how parameters *can* be set (e.g., you can't parameterize "fairness" to mean "always favor my eldest son" without losing the core meaning; expanding the circle of moral patients tends to be unidirectional).
      *   The core routines identify *functional universals* of human sociality that ground objective *reasons*, even if application varies. Conceding that "insider" and "gratuitously" have cultural components is necessary, but arguing the *form* and *underlying rationale* (preventing internal conflict, enabling cooperation) point to objective features of human flourishing is the defense.

  2.  **The Hypothetical Study:**
      *   **Scenario B (Nothing survives divine command):** **Kills** the parameter-setting story *for those societies*. It reveals a fundamentally different meta-ethic.
      *   **Scenario A (Tiny, shifting core):** **Severely shrinks and destabilizes** it. It suggests the "inviolable core" is minimal and culturally specific, making parameter-setting on a *robust* shared machinery a poor explanation. The view becomes much weaker.
      *   **What your view uniquely predicts:** A stable core of violations (especially related to *unprovoked* harm to clear ingroup members, *egregious* cheating) that universally survives the relativizing probes. Variation should be primarily in scope, weighting in dilemmas, and *which* violations *beyond* this core are treated as non-optional.
      *   **Insulation Problem:** If the view is qualified so that the "core" is defined *post-hoc* as whatever survives the probes in each culture, it becomes insulated from falsification but also trivial ("Cultures treat some norms as non-optional!"). **This is a major problem.** For the claim to have philosophical weight (moral objectivity rooted in shared structure), it needs predictive specificity and vulnerability to counter-evidence (like Scenario B, or genuinely incommensurable foundations). Insulation renders it descriptively true but normatively inert.

  **Conclusion:**

  Your view is sophisticated and accounts for much variation. However, the **Grain Problem** is its Achilles' heel. Conceding cultural definition of key terms risks triviality; avoiding it risks false universality. **Explanatory Unit Mismatch** (tracking functional pressures over "culture") is a powerful external defeater. **The Hypothetical Study**, especially finding places with *no* divine-command-independent norms, is devastating internally. To avoid insulation, your view *must* make specific, falsifiable predictions about a minimal, stable, contentful core surviving relativizing probes across cultures. Evidence that moral cognition primarily tracks socio-ecological function rather than cultural tradition is a strong reason to think the "parameter-setting" metaphor, while capturing surface variation, misses the deeper drivers of moral diversity. The strongest defense likely involves retreating to a weaker claim about functional universals generating *reasons* within contexts, rather than robust moral objectivity derived from innate universal structure.
