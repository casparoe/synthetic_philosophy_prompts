  **INTERGENERATIONAL EQUITY AND LONG-RANGE STEWARDSHIP CONSORTIUM**  
  **Resolution 17.8: Temporal Symmetry in Existential Risk Abatement and Moral Patient Prioritization**  
  *Adopted Unanimously, 12 Thermidor 234th Long Now Cycle*  

  **PREAMBLE**  
  WHEREAS, the moral landscape encompasses all sentient entities across cosmological time;  
  WHEREAS, discounting welfare based solely on temporal location violates principles of impartiality (Temporal Symmetry Thesis, §2.1);  
  WHEREAS, future moral-patient populations are projected to exceed 10^38 beings (per Vinge-Bostrom Expansion Axioms), necessitating urgent mitigation of existential risks (X-risks) to prevent astronomical waste;  
  WHEREAS, an identical magnitude of moral weight must be assigned to past sentient entities under strict temporal symmetry;  
  NOW THEREFORE, the Consortium resolves as follows:  

  **CLAUSES**  
  1. **Temporal Scope of Moral Patients**  
     1.1. Moral consideration extends bidirectionally across all epochs, from the emergence of proto-sentience (ca. -3.8 Gya) to the cosmological endpoint (≥10^100 years).  
     1.2. "Moral patients" include all entities capable of valenced experiences, irrespective of temporal location or substrate (carbon-, silicon-, or quantum-based).  

  2. **Elimination of Pure Time Preference**  
     2.1. A pure time preference rate of 0.000% is mandated for all cost-benefit analyses, rejecting arbitrary temporal discrimination.  
     2.2. Welfare impacts are evaluated via risk-neutral aggregation, weighting all experiences equally regardless of temporal directionality.  

  3. **Existential Risk Prioritization**  
     3.1. Resources shall be allocated to X-risk mitigation proportionate to expected patient-population exposure, accounting for:  
     - 3.1.1. Forward-directed risks (e.g., unaligned artificial superintelligence, gamma-ray bursts).  
     - 3.1.2. Backward-directed risks (e.g., retrocausal information erosion, chronon-field instabilities).  
     3.2. Funding for near-term welfare interventions (e.g., contemporary poverty alleviation) is capped at ≤0.1% of total reserves, as their impact is negligible against expected future-past moral density.  

  4. **Non-Identity Problem Protocol**  
     4.1. Actions altering the identity of moral patients (e.g., preventing a past extinction event) are permissible if they increase expected net welfare across reference classes.  
     4.2. Identity-altering interventions require approval by the Office of Chronoconsistency to avoid paradox-induced value drift.  

  5. **Past Consciousness Recovery Initiative (PCRI)**  
     5.1. The Consortium shall invest 45% of its endowment in PCRI technologies, including:  
     - 5.1.1. Quantum archeology for pattern reconstruction of ancestral moral patients (AMPs).  
     - 5.1.2. Ectemporal simulation substrates for AMP welfare enhancement.  
     5.2. **Refund Protocol for Failed Uploads**:  
     - 5.2.1. Should an AMP pattern-recovery attempt fail, 98% of allocated resources shall be refunded to the Consortium’s Strategic Retroaction Fund.  
     - 5.2.2. Refunds are justified under the Null Counterfactual Principle: failure merely restores the AMP’s pre-intervention state, incurring no net welfare loss.  

  6. **Resource Allocation Formula**  
     6.1. Let \( W_t = \) moral-patient density at time \( t \), \( R_t = \) X-risk intensity at \( t \), and \( C_t = \) cost-effectiveness of intervention.  
     6.2. Funding for epoch \( t \) is:  
     \[ \text{Allocation}_t = k \cdot \frac{W_t \cdot R_t}{C_t} \]  
     where \( k \) normalizes for intertemporal budget constraints.  

  7. **Astronomical Waste Mitigation**  
     7.1. "Waste" is defined as the unrecoverable loss of potential welfare due to X-risk events.  
     7.2. Consortium efforts shall prioritize preventing waste in high-density epochs (e.g., Late Cretaceous, 318th Digital Expansion Wave).  

  **APPENDIX A: Paleontological Moral-Patient Density Estimates**  
  | Epoch                  | Est. Moral Patients (per m³/year) | Confidence Interval | Source                          |  
  |------------------------|-----------------------------------|---------------------|---------------------------------|  
  | Cambrian Explosion     | 2.1 × 10^9                        | ±0.3 × 10^9         | *Phanerozoic Valence Survey*    |  
  | Late Jurassic          | 5.7 × 10^9                        | ±1.1 × 10^9         | *Mesozoic Hedonimetry Journal*  |  
  | Pleistocene Megafauna  | 8.3 × 10^9                        | ±0.9 × 10^9         | *Quaternary Ethics Review*      |  

  **FREQUENTLY ASKED QUESTIONS**  
  **Q1: Why assign equal moral weight to past entities?**  
  *A1: Temporal Symmetry (§2.1) demands impartiality. If future beings deserve consideration due to their potential experiences, past beings warrant equal regard for their realized experiences. Neglecting this symmetry introduces arbitrariness.*  

  **Q2: How can we "affect" the past?**  
  *A2: Via retrocausal welfare augmentation (e.g., quantum archeology). While causal influence is limited, pattern recovery and simulation can enhance the welfare of past entities without altering their identity (per §4.1).*  

  **Q3: Doesn’t the non-identity problem invalidate past-focused efforts?**  
  *A3: No. PCRI interventions (§5) reconstruct existing AMP patterns without altering historical causation. Welfare enhancement in simulations does not create identity paradoxes; it merely optimizes extant moral value.*  

  **Q4: Why prioritize this over present crises?**  
  *A4: Near-term welfare impacts are dwarfed by the expected value of mitigating X-risks affecting 10^38 future-past beings. A dollar spent preventing a Cretaceous asteroid impact (simulation-adjusted) yields 10^12× the expected welfare gain of contemporary aid.*  

  **Q5: Are refunds for failed uploads (§5.2) ethical?**  
  *A5: Yes. Failed uploads revert AMPs to baseline welfare states. Resources are preserved for higher-expected-value interventions, aligning with risk-neutral aggregation (§2.2).**  

  ---  
  *Certified by the Office of the Chronoauditor General*  
  *Seal of the Intertemporal Equity and Long-Range Stewardship Consortium*
