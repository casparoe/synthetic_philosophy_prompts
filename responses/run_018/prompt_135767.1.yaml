prompt: |-
  I am a novelist drafting a satirical interlude for a work of philosophical fiction, and I need a deadpan parodic document—approximately 650 to 750 words, formatted as a formal board resolution with numbered clauses and a brief appended FAQ—issued by an invented body, the Intertemporal Equity and Long-Range Stewardship Consortium. The document should treat strong longtermism not as caricature but as a rigorously applied framework: it must invoke, in precise but invented terms, the expectation of astronomically large future moral-patient populations, the near-elimination of pure time preference, and the prioritization of existential-risk mitigation over near-term welfare. The satirical engine should be a strict temporal-symmetry thesis—the claim that if moral weight extends forward across cosmic time, it must extend backward with equal force—and the text should show the consortium’s bureaucratic apparatus attempting to operationalize this symmetry without logical contradiction. The humor must arise from internal consistency: every clause should be a defensible extension of real longtermist commitments, including references to astronomical waste, risk-neutral aggregation, and the non-identity problem applied across cosmic epochs, so that a specialist recognizes the exaggeration as fair rather than straw-manned. Include an invented statistical appendix citing paleontological moral-patient density estimates and a clause addressing refunds for failed uploads of past consciousness patterns. The voice must remain entirely deadpan—no authorial commentary, no winking—readable to someone unfamiliar with effective altruism, yet precise enough that the joke lands in the logic rather than in ignorance. Please produce the document itself, not an explanation of it.
reasoning: |-
  We are creating a formal board resolution for the "Intertemporal Equity and Long-Range Stewardship Consortium" (IELRSC) that satirizes strong longtermism by extending its principles to include backward temporal symmetry. The document must be deadpan, precise, and internally consistent, with clauses that are defensible extensions of real longtermist ideas. It will include numbered clauses, an FAQ, and an invented statistical appendix.

  Key elements to include:
  1. **Temporal Symmetry Thesis**: If moral weight extends forward in time, it must extend backward equally.
  2. **Astronomically large future populations**: Reference to future moral patients (e.g., digital minds) in the trillions or more.
  3. **Near-elimination of pure time preference**: Treating future and past equally.
  4. **Prioritization of existential risk mitigation**: But now extended to both future and past.
  5. **Astronomical waste**: The loss of potential value due to existential catastrophes, applied symmetrically.
  6. **Risk-neutral aggregation**: Evaluating actions based on expected value without risk aversion.
  7. **Non-identity problem**: How actions affecting who comes to exist create moral dilemmas, now applied to past and future.
  8. **Refunds for failed uploads of past consciousness patterns**: A clause addressing attempts to "rescue" past beings via technology and what happens if it fails.

  Structure:
  - **Preamble**: Setting the context and invoking the temporal symmetry thesis.
  - **Clauses**: Numbered, formal, and precise.
  - **FAQ**: Brief, addressing potential questions.
  - **Statistical Appendix**: Invented data on paleontological moral-patient density.

  Tone: Entirely deadpan. The humor comes from the logical extremes.

  Let's outline the clauses:

  1. **Preamble**: 
     - Recognizing the moral significance of all sentient beings across time.
     - Adopting the Temporal Symmetry Thesis (TST) as foundational.

  2. **Definitions**:
     - Define key terms: Moral Patient, Existential Risk, Astronomical Waste, etc.

  3. **Temporal Scope**:
     - Moral consideration from the beginning of sentient life to the end of the universe.

  4. **Pure Time Preference**:
     - Elimination of any discounting for time, forward or backward.

  5. **Existential Risk Mitigation**:
     - Priority on reducing risks that could wipe out past or future moral patients.

  6. **Non-Identity Problem Resolution**:
     - Acknowledging that actions affecting the identity of past and future beings are acceptable if they increase overall expected moral value.

  7. **Resource Allocation**:
     - Funds allocated to both future-oriented and past-oriented interventions.

  8. **Past Consciousness Recovery Initiative**:
     - Efforts to recover and upload past consciousness patterns (e.g., from fossil records or quantum archaeology).
     - Clause 8.1: Refund policy for failed uploads (since the non-existence of the past being is not made worse by a failed upload, but the resources could have been used elsewhere).

  9. **Expected Value Calculations**:
     - Use of risk-neutral expected value for decision-making, regardless of temporal direction.

  10. **Reporting and Accountability**:
      - Regular assessments of both forward and backward longtermist interventions.

  Appendix: Statistical table with estimates of moral-patient density per million years in the past, with citations to invented paleontological studies.

  FAQ: 
  - Q1: Why extend moral consideration to the past?
  - A1: Because of the Temporal Symmetry Thesis: if we care about future beings because they will exist, we must care about past beings because they did exist, and their moral weight is equivalent.

  - Q2: How can we affect the past?
  - A2: Through retrocausal interventions (theoretical physics) and pattern recovery (e.g., uploading past minds). Also, by preserving information about the past to prevent "existential forgetting".

  - Q3: Doesn't the non-identity problem make past interventions futile?
  - A3: No, because we are not changing the past (which would alter identities) but recovering and enhancing the welfare of past beings without altering their identity (e.g., by uploading them to a simulation where they can experience higher well-being).

  Now, we write the document.
