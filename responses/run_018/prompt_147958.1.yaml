  hey, quick sanity check. a friend summarized the phyilosophical debate on defining life like this: the NASA working definition—life is a self-sustaining chemical system capible of darwinian evolution—got destroyed because viruses aren't self-sustaining and crystals can replicate without being alive. so philosophers mostly gave up on necessary and sufficient conditions and now treat "life" as a practical kind in the sense Dupré talks about, where we group organisms by human interests rather than natural boundaries. my friend then said this means synthetic cells are alive iff we decide it's useful to call them that for regulation. how fair is this summary? go through it piece by piece: is the critique of the NASA definition accurate, did philosophers actually abandon essentialism, and does Dupré's practical-kind idea really imply there's no fact of the matter about synthetic life? please answer in american english.
