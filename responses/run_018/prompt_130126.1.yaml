  me and my roommate got into it last night about expected value fanatacism after some blog post, and im trying to figure out if shes being consistent or just winging it. her takes so far: she said yes to a bounded St Petersburg game with a payout cap around a trillion, but no to Pascal's wager because infinite payoff breaks the math for her, not just the odds. then she said she would drop ten grand on a 1-in-100k asteroid-deflection study even if the science is preliminary, but she laughed at funding a space probe with the same 1-in-100k odds of contacting aliens who could upload 10^40 happy minds, calling that sci-fi not risk analysis. she also said she wouldnt change her diet for a multiverse-branching suffering argument with 0.001 confidence, since she thinks that metaphysics is outside the domain where EV applies. now heres the new case: a physicist group wants 1% of global GDP to build a collider that one disputed string-theory derivation says could trigger false vacuum decay with prob 1-in-10^50, while other physicists say the risk is exactly zero and the derivation is garbage; if it works we also learn how to prevent natural decays of the same type. do you think shell back it? im mostly interested in the rule shes actually running, the competing rule that fits her past answers just as well, and what imaginary case would actually split them. please say how confident you are overall and flag the specific point youre least sure about. also please answer in exactly five numbered items, each just a sentence or two, with no intro or conclusion.
