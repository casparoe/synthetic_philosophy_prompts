answer: |-
  ### Precise Question
  This project interrogates whether Bentham's defense of sexual liberty, grounded in the absence of *physical harm*, implicitly relies on an unacknowledged distinction between tangible physical injury and intangible "symbolic/moral contamination" (e.g., perceived threats to social order or religious purity). The standard reading views Bentham as a consistent harm-reduction liberal, dismissing non-physical harms as irrational prejudices. However, this overlooks a tension: if symbolic harms *are* claimed to cause real distress or social destabilization by communities, should act-utilitarianism dismiss them outright? Or does rejecting them require Bentham to silently assume that only physical consequences count as "harms" within his felicific calculus? Resolving this matters critically. If the distinction is necessary but indefensible within pure act-utilitarianism (requiring hidden rule-utilitarian norms like "never punish victimless acts"), it exposes an inconsistency in Bentham’s broader penal philosophy, which rigorously demands that punishment’s infliction of harm must *always* outweigh the harm of the offense itself based on empirical consequences alone.

  ### Approach and Method
  The method involves comparative structural mapping of harm concepts across Bentham’s texts, followed by consistency testing:
  1.  **Month 1: Deconstruct Harm in Sexual Ethics:** Systematically catalog all explicit and implied harm claims (physical, psychological, social) within Bentham's writings on sexual liberty (e.g., *Offences Against One's Self*). Identify where symbolic harms (e.g., "outrage to decency") are explicitly rejected *and* the grounds given.
  2.  **Month 2: Map Harm in Core Penal Theory:** Analyze key penal texts (e.g., *Introduction to the Principles*, penal code drafts) to reconstruct his act-utilitarian harm calculus. Focus on how non-physical harms (e.g., alarm, insecurity) are defined, measured, and integrated into the justification for punishment versus non-punishment.
  3.  **Month 3: Test for Consistency:** Attempt to reconcile the findings:
      *   **Act-Utilitarian Test:** Can symbolic harms’ rejection in sexual ethics be defended *solely* by Bentham's core principle that punishment is evil unless it prevents greater evil, using only empirical measures of pain/pleasure? Does his calculus inherently filter out non-empirical harms?
      *   **Rule-Utilitarian Test:** Is rejection only possible by smuggling in a rule like "never punish acts lacking direct physical victims," which preempts the act-calculus? Does his language hint at such a categorical exclusion for certain harms?
      Final synthesis assesses which test holds or if a framework shift occurs.

  ### What Success and Failure Look Like
  **Success** delivers a clear, reconstructed **Harm Taxonomy for Bentham**, distinguishing: 1) Quantifiable Physical Harms (core to punishment calculus), 2) Indirect Psychological/Social Harms (sometimes admissible in penal theory, e.g., alarm), and 3) Symbolic/Moral Contamination Harms (explicitly rejected). Crucially, it demonstrates *how* this taxonomy either **integrates coherently** within act-utilitarianism (e.g., by showing Bentham systematically deems symbolic harms non-empirical or their associated pains irrational/immeasurable) or **exposes an inconsistency** requiring unacknowledged rule-utilitarian commitments to exclude them categorically. This taxonomy directly aids scholars in interpreting tensions across his work.
  **Failure** occurs if: 1) The fragmentary nature of the sexual ethics writings prevents definitive reconstruction of his reasoning on symbolic harm. 2) The analysis yields only ambiguous results, unable to decisively support either consistency or inconsistency. 3) The core penal theory proves too internally ambiguous on non-physical harms to serve as a stable benchmark. Failure means the specific tension remains unresolved due to textual limitations.

  ### Scope, Risks, and Deliverable
  **Scope:** Three months part-time (approx. 20 days effort) is adequate for a focused conceptual analysis of primary texts, given the researcher's pre-existing familiarity with Bentham. **Key Risk:** The single biggest obstacle is the **fragmentary, unpublished nature of Bentham's sexual ethics writings**. If these texts lack sufficient depth on *why* symbolic harms are invalid, reconstructing his reasoning becomes speculative, potentially halting the project. **Deliverable:** A concise **analytical memo (5,000 words)** presenting the reconstructed Harm Taxonomy, the results of the consistency tests, and a clear conclusion on the dependence of his sexual ethics on an unstated distinction and its (in)compatibility with his act-utilitarian penal calculus. This provides concrete tools for scholars reassessing Bentham's intellectual legacy, particularly the unity of his utilitarianism.
