  **UNITED STATES OFFICE OF PERSONNEL MANAGEMENT**  
  **VACANCY ANNOUNCEMENT NUMBER: OCE-DM-24-007**  

  **Position Title:** Deservingness Metric Analyst (GS-12/13)  
  **Series & Grade:** GS-0343-12/13  
  **Salary Range:** $94,199 to $145,617 per annum  
  **Duty Location:** Remote Eligible (Continental U.S.)  
  **Appointment Type:** Permanent, Full-Time  
  **Open Period:** 07/01/2024 to 07/15/2024  
  **Agency:** Office of Conditional Entitlement (OCE)  

  **Duties:**  
  The Office of Conditional Entitlement (OCE) administers Title IV benefit programs (Nutritional Support, Temporary Livelihood Assistance, Medical Subsistence) through continuous algorithmic assessment of recipient deservingness. The Deservingness Metric Analyst ensures the integrity of the Real-Time Entitlement Calibration System (RTECS) by:  

  1.  Monitoring aggregated biometric inputs (cortisol levels via wearable compliance monitors, galvanic skin response during virtual eligibility interviews) for indicator stability.
  2.  Analyzing job-search keystroke patterns (velocity, consistency, keyword density) via the WorkSearch Tracker™ platform to quantify applicant effort-in-motion.
  3.  Validating peer-reported effort signals (NeighborNet™ attestations of observable hardship/maintenance activities) against probabilistic deception models.
  4.  Calibrating the dynamic Deservingness Threshold™ to optimize for benefit release events occurring below statistical probability threshold P=0.35, minimizing moral hazard seepage.
  5.  Generating Non-Release Justification Reports (NRJR) documenting metric depression events and recommending corrective conditioning modules.
  6.  Participating in bi-weekly Threshold Sensitivity Reviews to maintain system tautology ("Condition Saturation ensures only demonstrably deserving recipients achieve release states").

  **Qualifications:**  
  *   Bachelor’s degree in Behavioral Economics, Quantified Sociology, or Moral Hazard Mitigation.
  *   GS-12: One year of experience calibrating incentive structures or quantifying effort in a compliance setting.  
      GS-13: One year equivalent to GS-12 plus certification in Algorithmic Probity Assurance.
  *   **Expertise Required:** Statistical modeling of deprivation indicators, fluency in Kafkaesque Regulation Syntax (KRS), indifference to causal feedback loops.
  *   **Desired:** Experience designing systems where demonstrated need inversely correlates with metric achievability.

  **Benefits:**  
  Comprehensive federal benefits package, including access to the OCE Employee Wellness Portal (monitoring *optional*).

