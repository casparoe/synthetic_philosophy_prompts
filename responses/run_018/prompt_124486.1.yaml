answer: |-
  ## Project Proposal: Structural Dissolution and the Lemkinian Gap - A Six-Month Conceptual Inquiry

  **1. Title:** Reconceptualizing Genocidal Intent: Structural Dissolution and the Limits of the UN Convention Framework

  **2. Core Question:** Does the "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such" (UN Genocide Convention, Art. II) necessarily require a *biological* or *reproductive* aim targeting the group's physical existence? Or can this intent be satisfied by deliberate policies that foreseeably dissolve the group's *material conditions of collective existence* – its territorial basis, economic autonomy, or cultural infrastructure – leading to its dissolution *without* direct mass killing?

  **3. The Gap in Existing Debates:** Current legal and moral discourse on genocide typically presents a binary:
      *   **Physical/Biological Genocide:** Focused on killing, causing serious bodily harm, or preventing births (UN Convention core).
      *   **"Cultural Genocide":** Focused on deliberate attacks on culture, language, institutions (explicitly excluded from the Convention but debated conceptually).
  This binary obscures a critical intermediate form: **Structural Dissolution**. This occurs when a perpetrator group, through deliberate policy (e.g., systematic land dispossession, engineered economic collapse, forced displacement under environmental duress), destroys the *foundational material bases* necessary for the victim group’s collective existence *as a distinct entity*. Crucially, this destruction is foreseeable and intended as a means to eliminate the group, but operates through slow-moving structural channels rather than direct violence. Lemkin’s original conception of genocide as the "destruction of the essential foundations of the life of national groups" (Axis Rule) arguably encompassed such socio-economic and territorial destruction alongside biological and cultural attacks. However, the UN Convention’s focus on specific acts (killing, bodily harm, birth prevention) excludes this structural dimension unless it demonstrably causes death or serious harm. Consequently, debates remain polarized between the Convention's narrow physicalism and arguments for cultural genocide, leaving Structural Dissolution conceptually orphaned and legally unnameable as genocide under prevailing interpretations.

  **4. Project Goal & Method:** This six-month philosophical project aims to analytically reconstruct a coherent framework for identifying Structural Dissolution *within a Lemkinian conception of genocide*, distinct from both physical killing and purely cultural erasure, and to test its viability as a conceptual category.

  *   **Phase 1 (Months 1-2): Lemkinian Reconstruction**
      *   Systematically analyze Lemkin’s core writings (particularly "Axis Rule in Occupied Europe") to extract the underlying *architecture of group destruction*. Identify the constituent elements he deemed essential to genocide beyond killing: e.g., destruction of economic existence, political/social institutions, cultural foundations, and crucially, the *territorial basis* of group life.
      *   Analyze the role of *intent* within this framework: How did Lemkin link the perpetrator's aim to the destruction of these diverse foundations? Was "destruction" tied solely to physical disappearance, or to the dissolution of group cohesion and identity via material means?
  *   **Phase 2 (Months 3-4): Framework Application to Case-Types**
      *   Apply the reconstructed Lemkinian framework to two distinct phenomena representing potential Structural Dissolution:
          1.  **Environmental Displacement:** Systematic state/policy failures or actions accelerating climate impacts (e.g., sea-level rise, desertification) *on targeted groups*, coupled with policies denying adaptation resources or forcing relocation that severs the group’s territorial and cultural anchor, aiming for their dispersal and assimilation.
          2.  **Forced Economic Assimilation:** Deliberate state policies (e.g., discriminatory resource extraction, denial of land rights, imposition of debt traps, suppression of traditional economies) designed to destroy the economic autonomy of a specific group, rendering its members individually dependent on the dominant system and dissolving collective bonds and identity.
      *   Assess whether applying the reconstructed framework yields a *coherent classification* of these cases as genocide (under the Lemkinian definition) or generates *internal contradictions* (e.g., regarding intent attribution, foreseeability, or the definition of "destruction").
  *   **Phase 3 (Months 5-6): Taxonomy Development & Refinement**
      *   Synthesize findings to develop a conceptual taxonomy defining **Structural Dissolution** as a potential mode of genocide.
      *   Formulate clear **decision criteria** for identifying Structural Dissolution, focusing on:
          *   *Perpetrator Intent:* Deliberate aim to dissolve the group *as such* through material destruction.
          *   *Mechanism:* Foreseeable destruction of essential material foundations (territory, economy, infrastructure) necessary for collective existence.
          *   *Outcome:* Dissolution of the group's cohesion and distinct identity (even if individuals survive).
          *   *Distinction:* From physical killing (no mass death required) and from incidental cultural loss or diffuse structural violence.

  **5. Deliverable:** A rigorous **Conceptual Taxonomy and Diagnostic Framework** for identifying "Structural Dissolution" as a potential genocidal modality within a Lemkinian conception. This will include:
      *   A clear definition of Structural Dissolution.
      *   Differentiating criteria from physical genocide, cultural genocide (as typically conceived), and non-genocidal structural violence.
      *   Decision rules for assessing perpetrator intent and the causal link between policy and group dissolution.
      *   Illustrated application to the two case-types. *This is not an empirical investigation proving these cases are happening, nor a legal brief arguing for Convention amendment.*

  **6. Defining Failure:** The project fails if:
      *   The reconstructed framework **collapses into Pure Intentionalism:** Where the *mere presence* of hostile intent towards a group, regardless of the mechanism or outcome, becomes sufficient for genocide classification, making Structural Dissolution indistinguishable from prejudice and stripping the concept of its link to *actual destruction*.
      *   The framework **collapses into Pure Outcome-Based Classification:** Where the *fact* of group dissolution, regardless of specific intent or the nature of the destructive process, becomes the sole criterion, diluting the distinctive moral weight of genocide as an intentional crime and conflating it with societal collapse or assimilation due to complex, unintentional forces.

  **7. Timeline & Resources (6 Months):**
  *   Month 1: Deep dive into Lemkin's core texts; initial mapping of destruction architecture.
  *   Month 2: Finalize Lemkinian reconstruction; define key elements of Structural Dissolution.
  *   Month 3: Apply framework to Environmental Displacement case-type; identify conceptual strengths/strains.
  *   Month 4: Apply framework to Forced Economic Assimilation case-type; compare/contrast findings.
  *   Month 5: Develop initial taxonomy and decision criteria; test for internal consistency.
  *   Month 6: Refine taxonomy; articulate failure conditions; finalize deliverable structure and core arguments. *Resources: Access to Lemkin's major works, secondary literature on genocide theory/philosophy, structural violence theory (for contrast only).*

  **8. Specific Risk Flagged: Scope Creep into General Structural Violence.** A significant risk is the project drifting away from its core focus on *genocide taxonomy* and Lemkin's specific concept, evolving instead into a broader theoretical exploration of structural violence. Mitigation requires constant vigilance: rigorously tying every analytical step back to the question of whether the *Lemkinian definition of genocide* can coherently encompass Structural Dissolution, and explicitly contrasting it with non-genocidal structural harm where intent to destroy the group *as such* is absent or ambiguous. The case studies must serve as tests for the *specific framework*, not as springboards for general societal critique.
