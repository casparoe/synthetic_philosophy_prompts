prompt: |-
  Next week I'm presenting at our dept's war-and-ethics colloquium. My thesis is that the Fischer controversy isn't really about archival evidence—it's a metaphysical dispute hiding in plain sight. Both sides treat the Kaiserreich as a unitary moral agent with intentions, which I think is a category mistake. I want to replace "holding Germany responsible" with a bureaucratic diffusion model: culpability gets distributed across the General Staff, the industrial lobby, and the foreign office according to their actual decision-making authority, not national borders. The audience is mostly diplomatic historians who think Fischer overread the sources, one philospher of collective action, and a grad student who insists all national blame is just victors' justice dressed up. I need a Q&A prep sheet: the eight or so objections I'll actually face, ordered by how much damage they'd do, phrased the way that audience would put them (not like rationalist forums), each with a two-minute reply and an honest flag on where my answer is weakest. What's the one concession I should make upfront to not sound like I'm dodging history? And what's the question I'm praying nobody asks—probably whether my model lets the Kaiser personally off the hook?
