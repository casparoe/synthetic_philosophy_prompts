  For Harari's framework: The key question is whether he'd insist on a myth surviving dispersal. His core argument in Sapiens is that shared fictions enable cooperation beyond Dunbar's number. The canals require coordination across seasons and generations - so how could it work without some story persisting? But Kharum has no evidence of such myths. Maybe the "myth" is just the knowledge itself? But Harari distinguishes technical knowledge from binding fictions. The absence of ritual sites or symbolic artifacts weakens his case here.

  For Graeber & Wengrow: Their seasonal hierarchies seem perfect for Kharum's assembly/dispersal pattern. But the transmission problem jumps out - how does technical knowledge survive dispersal without institutions? Their examples like indigenous mound-builders had oral traditions. Kharum has none. The "playful kingship" might coordinate labor temporarily, but canal engineering requires precise generational knowledge transfer. If there's no myth or permanent guild, does their model collapse back into needing symbolic substrate after all?

  The shared hidden premise I notice: both assume material persistence requires symbolic persistence. Harari's myths "push substrate around"; G&W's reversible hierarchies still rely on cultural memory. But Kharum shows canals persisting without either. This suggests both theories conflate different phenomena under "cooperation" - Harari focuses on symbolic binding, G&W on anti-authoritarian flexibility, but neither accounts for pure generational praxis.

