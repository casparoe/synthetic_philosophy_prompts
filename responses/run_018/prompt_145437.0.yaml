  We are considering the idea of non-transferable reason aggregation as a response to the separateness of persons objection to utilitarianism.
   The core idea: separateness is violated not by aggregation per se, but by treating reasons from one person's welfare as fully fungible with those from another's. This means that a large benefit to B is taken to cancel a severe harm to A, even though A's agent-relative reasons (the reasons that A has, from her own perspective, to avoid harm) do not diminish.

   We are to move beyond the Rawls-Nozick exchange. Rawls argued that utilitarianism fails to take seriously the distinction between persons, and Nozick emphasized individual rights as side constraints. Our framing focuses on the non-transferability of reasons.

   Brainstorm of main conceptual moves and connections:

   1. **Agent-Relative vs. Agent-Neutral Reasons**: 
      - The non-transferability claim is that the reasons grounded in A's welfare are agent-relative (they are reasons for A and for those who care about A, but not necessarily for others in the same way). Utilitarianism treats all reasons as agent-neutral (they are reasons for anyone, regardless of their relation to the affected party).
      - Connection to population ethics: In cases of different population sizes, how do we account for the agent-relative reasons of potential future people? How do we avoid the Repugnant Conclusion if we don't aggregate in a utilitarian way?

   2. **Aggregation without Fungibility**:
      - How can we aggregate reasons without treating them as fungible? We might need a form of aggregation that respects the non-transferability. For example, contractualist approaches (like Scanlon's) that require justifications to each person affected might avoid fungibility by not allowing a large benefit to many to override a severe harm to one if that one cannot reasonably reject a principle that forbids such an override.
      - Connection to risk ethics: When making decisions under uncertainty (e.g., exposing a few to high risk to benefit many), the non-transferability of reasons might imply that we cannot simply trade off a high probability of severe harm against diffuse benefits.

   3. **Formal Models of Reason Aggregation**:
      - We might model reasons as having weights that are not additive across persons. For instance, we could have a model where the moral force of a harm to A is not offset by benefits to others, but the overall decision is made by a rule that considers the pattern of reasons (e.g., a lexical priority for avoiding severe harms, or a threshold model).
      - Connection to decision theory: How do we model rational choice when reasons are not additive? This might involve non-expected utility models or multi-dimensional value structures.

   4. **The Role of Compensation**:
      - In the utilitarian framework, compensation is implicit: the gain to B can compensate for the loss to A. But if reasons are non-transferable, then compensation must be understood differently. Perhaps only actual compensation (if A is compensated by B) can justify the harm, but then we are back to a form of Kaldor-Hicks efficiency? This ties into debates about justice and compensation.

   5. **Contractualist Aggregation and Numbers**:
      - Contractualism traditionally has difficulty accounting for the moral significance of numbers (e.g., saving one vs. saving five). If reasons are non-transferable, then how do we explain why it might be permissible to save the five? We might need a way to aggregate without fungibility, e.g., by considering the strength of the reasons each person has and the principle that no one can reasonably reject a principle that allows saving the greater number.

   6. **The Problem of Large Numbers**:
      - If we reject full fungibility, what about cases where the numbers are very large? For example, is it permissible to cause a very small harm to each of a million people to avoid a severe harm to one? Non-transferability might say no, but that seems counterintuitive. This is a challenge for the view.

