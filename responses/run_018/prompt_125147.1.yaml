  For the deportation AI example, Readings 2 and 3 fit best. The humans saying "just following protocol" mirror Eichmann's thoughtlessness and reliance on roles to evade moral reckoning. Reading 1 is too broad here—it doesn't capture the system's structural evasion. Reading 4 is adjacent but not core to Arendt.  

