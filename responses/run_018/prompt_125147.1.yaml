prompt: |-
  hey so in my political theory seminar people keep citing 'the banality of evil' whenever we discuss bureaucratic harm, and i feel like we're all using it in seperate ways. can you break down the exact precise claims that phrase might stand for? im thinking of at least four readings: (1) evil acts come from ordinary people with no special malice, (2) the actor is literally thoughtless or unable to imagine others' perspectives, (3) responsibility gets diffussed through rules and roles so no one feels guilty, and (4) following legal or official norms replaces moral judgment entirely. for each one, say whether its a platitude, a substantive thesis, or false, and tell me which reading actually supports using it to critique modern algorithmic decision-making in immigration courts — like when an AI flags people for deportation and every human in the loop says they were just following protocall. i want to come to office hours with a menu of interpritations so i can ask which one my prof meant.
