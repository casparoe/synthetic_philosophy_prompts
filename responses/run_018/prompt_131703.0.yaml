  Here is the villanelle, as requested:

  Observe the lattice, cold and crystalline,
  Where pressure maps to patterned voltage shift,
  **If the causal graph holds, the hurt holds.**
  No C-fiber fire, no axonal decline,
  Just quartz arrays that fracture, bend, and lift
  Observe the lattice, cold and crystalline.
  Behavior matches: jerks, a whining whine
  (The vocal proxy, programmed to adrift) –
  **If the causal graph holds, the hurt holds.**
  But trace the paths where thermal feedbacks twine
  Replacing Na+’s rush, the K+’s drift –
  **No ion, no flame, no ache.**
  The state transitions replicate the line
  Of thalamic relay, limbic rift –
  Observe the lattice, cold and crystalline.
  Homeostasis tuned, a steady sign,
  Not osmotic swell, but heat’s slow gift –
  **No ion, no flame, no ache.**
  Withdrawal reflexes, sharp and quick, define
  The output node, no biology’s thrift –
  **If the causal graph holds, the hurt holds.**
  No Darwin’s deep imprint, no slow design,
  Just engineered topology, swift
  Observe the lattice, cold and crystalline.
  Does functional form make feeling align?
  Or is true pain a gift that flesh can sift?
  **No ion, no flame, no ache.**
  The map’s precise, the territory’s stone,
  A perfect echo, void of life’s rough cleft:
  **If the causal graph holds, the hurt holds.**
  **No ion, no flame, no ache.**

  ---

  This proved a fascinating challenge, weaving the specific architecture of the synthetic nociceptor – the piezoelectric lattice, the thermal feedback loops explicitly replacing ionic dynamics, the precise replication of state transitions and outputs – into the unforgiving structure of the villanelle. The alternating refrains indeed forced the philosophical tension: the functionalist's insistence on causal topology dominating stanzas focused on inputs, outputs, and internal pathways, while the skeptic's substrate-focused cry anchored stanzas describing the crystal substrate, the absence of ions and biological history, and the thermal mediation. The final couplet's stark juxtaposition, refusing resolution, feels like the necessary formal enactment of the "hard problem" transposed onto artificial pain. I aimed for sufficient specificity in both the synthetic system's description and the biological references (C-fibers, ionic channels, thalamic relay, osmotic balance) to meet the specialist's eye without flinching. The form truly does carry the argument.
