prompt: |-
  Novelist here — not a cognitive scientist, so forgive the framing. I've been thinking about Bongard problems alot lately: those drawings with two panels of six boxes, where the six on the left all obey some rule and the six on the right all break it, and you have to induce the rule from just those twelve examples. Fiction turns out to be a Bongard problem generator. I give you a character's first three scenes, you construct "who she is," and then you predict what she'll do in the fourth scene. So I want to understand what's actually going on when a mind builds a concept from a handful of examples, and I want it sharp enough that the answer isn't a shrug.

  Draft the joint statement of an adversarial collaboration between two camps in the psychology of concept learning. Call camp A the rule-inference camp: few-shot concept induction is hypothesis selection over a space of candidate rules or little programs, ranked partly by a simplicity prior, and what the learner ends up with is a structured, compositional rule. Call camp B the similarity camp: the learner isn't really storing a rule; it's building a similarity field around stored exemplars (or a prototype), and new cases get classified by nearness in a feature space, with attention weights doing the work.

  Produce the document such a collaboration would produce:

  (1) a numbered list of claims both camps can sign — including claims about the underdetermination of the examples (any finite set of boxes fits infinitely many rules) and about the facts any account has to explain;

  (2) a disagreement table: each row states the question in neutral wording, then gives camp A's answer in wording camp A would accept and camp B's answer in wording camp B would accept. Don't soften either side into mush; if they can't co-sign a single sentence, let them speak seperately.

  (3) a list of cruxes: the sub-questions such that settling them would genuinely move at least one camp;

  (4) for at least two cruxes, a concrete experimental setup or Bongard-style case that both sides agree bears on it, with each side's prediction recorded in advance. I'd especially like one case where a short, crisp relational rule conflicts with overall similarity (say, "contains exactly one closed curve that encloses a square" but the boxes otherwise look nothing alike), and one case where the positive boxes hang together by family resemblance but there's no compact rule short of enumerating details.

  Also flag anywhere you suspect the disagreement is partly verbal. No citations, no bibliography — I want the argumentative skeleton, not a literature review.
reasoning: |-
  Okay, the user is a novelist interested in Bongard problems as a metaphor for character development in fiction. They want to understand how minds build concepts from few examples, specifically requesting an adversarial collaboration framework between two psychology camps: rule-inference (Camp A) and similarity-based learning (Camp B). 

  Hmm, this is a sophisticated request blending cognitive science and creative writing. The novelist seems frustrated by vague answers ("shrug") and wants mechanistic rigor. Their metaphor about character scenes as Bongard panels is insightful—it highlights how sparse examples trigger rich inferences. 

  First, I need to crystallize both camps' positions without caricature. Camp A thinks in terms of hypothesis testing with simplicity priors (like Occam's razor for mental programs), while Camp B emphasizes statistical similarity metrics and prototypes. The challenge is presenting their disagreements starkly while finding common ground.

  For the joint statement, I'll start with undisputed truths: 
  - Finite examples underdetermine rules (infinite possible hypotheses)
  - Humans converge on "natural" solutions despite this 
  - Context/prior knowledge matters 
  Both camps must accept these even if their explanations differ.

  The disagreement table needs antithetical phrasing. For example, on "what is stored in memory?" Camp A says "structured rule," Camp B says "similarity field." No compromise—let them clash. I'll pick four key battlegrounds: representation, generalization, attention, and rule exceptions.

  Cruxes should be make-or-break tests. I'll design two Bongard-style cases: 
  1) A relational rule vs. similarity conflict (e.g., "contains one circle enclosing a square" where positives look dissimilar). Camp A predicts rule wins; Camp B bets on similarity. 
  2) A family resemblance case with no crisp rule (e.g., varied "spiky" shapes). Here Camp B should dominate unless Camp A invents a kludgy rule.

  Ah, and verbal disputes! I'll flag terms like "rule" that might be polysemous. Camp B might call their weighted features "implicit rules," muddying the waters. Explicitly separating vocabulary will help the novelist.

  The novelist's deeper need? Probably tools to control reader inference—like knowing when character actions feel "consistent" via rules vs. vibes. These experiments could inform how to plant clues that steer interpretations.
answer: |-
  ## Adversarial Collaboration Statement: Rule-Inference vs. Similarity in Few-Shot Concept Learning

  **Preamble:** We, representatives of the Rule-Inference Camp (Camp A) and the Similarity-Based Camp (Camp B), acknowledge the power and limitations of our respective frameworks in explaining how humans induce concepts from small sets of examples, analogous to solving Bongard problems or inferring character traits in fiction. While fundamental disagreements persist, we agree on core phenomena and the nature of the challenge.

  ### (1) Jointly Signed Claims

  1.  **Underdetermination is Fundamental:** Any finite set of positive and negative examples (like the 12 boxes in a Bongard problem) is logically compatible with an infinite number of potential rules or similarity metrics.
  2.  **Convergence Occurs:** Despite underdetermination, humans (and other learners) typically converge rapidly on a single (or small set of) plausible concept(s) for a given set of examples within a context.
  3.  **"Naturalness" Matters:** Not all logically possible rules or similarity structures are equally likely to be induced. Learners exhibit biases towards concepts perceived as "natural," "simple," or "intuitive" within the perceived context.
  4.  **Prior Knowledge is Crucial:** The learner's background knowledge, expectations, and the framing of the task significantly constrain the hypothesis space (for A) or shape the feature space and similarity metric (for B).
  5.  **Context Guides Interpretation:** The perceived purpose of the concept, the domain (e.g., geometric shapes vs. social behaviors), and the sequence of examples influence concept formation.
  6.  **Explanation is Required:** Any successful account must explain the phenomena of rapid convergence, generalization to novel instances, sensitivity to counterexamples, and the role of perceived "naturalness" and context.
  7.  **Hybrid Mechanisms Exist:** Both camps acknowledge that complex cognition likely involves elements described by both frameworks at different times or for different tasks. Our dispute centers on the *primary* and *sufficient* mechanism for core few-shot induction.

  ### (2) Disagreement Table

  | Question                                                                 | Camp A (Rule-Inference) Answer                                                                 | Camp B (Similarity-Based) Answer                                                                 |
  | :----------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- |
  | **Q1: What is the core cognitive representation of the acquired concept?** | "The learner acquires and stores an explicit, structured, and often compositional rule or symbolic program specifying necessary and sufficient conditions for category membership." | "The learner stores representations of specific exemplars and/or a summary prototype, and the concept is embodied in a dynamically computed similarity field over features." |
  | **Q2: How does generalization to a novel instance primarily occur?**       | "By applying the inferred rule/program to the novel instance's features to compute a deterministic (or probabilistic) verdict." | "By computing the similarity of the novel instance's feature vector to stored exemplars/prototype(s), using a contextually tuned distance metric and attention weights." |
  | **Q3: What role do attention and feature weights play?**                  | "Attention modulates the salience of features *during the hypothesis search process*, influencing which rules are considered. The *final rule* specifies relevant features." | "Attention weights *are integral to the similarity metric itself*, dynamically determining which features contribute most to the similarity calculation for *every* classification." |
  | **Q4: How are exceptions or fuzzy boundaries handled?**                   | "The core rule is maintained; exceptions are either handled by rule refinement (adding clauses), probabilistic application, or noted as deviations requiring separate explanation." | "Exceptions are naturally accommodated by the continuous nature of similarity; membership is graded, and boundaries are inherently fuzzy based on distance in feature space." |

  ### (3) Cruxes for Resolution

  1.  **Representational Primacy:** Is the core representation driving *novel* generalization symbolic/rule-like or distributed/similarity-based?
  2.  **Rule vs. Similarity Primacy in Novel Conflicts:** When a novel instance satisfies a simple, crisp rule but is highly dissimilar to positive exemplars (or vice-versa), which principle dominates classification?
  3.  **Handling "Unnatural" Similarity:** Can learners reliably acquire concepts defined by similarity metrics that defy simple rule description (e.g., family resemblance without a core shared feature)?
  4.  **Sensitivity to Irrelevant Variation:** Does adding highly variable but rule-irrelevant features to positive exemplars hinder rule acquisition (A) more than similarity-based acquisition (B), or vice-versa?
  5.  **Role of Working Memory:** Does imposing a working memory load during learning disproportionately disrupt rule-based hypothesis testing (A) or similarity-based exemplar storage/comparison (B)?

  ### (4) Experimental Cruxes & Predictions

  **Crux 2: Rule vs. Similarity Primacy in Novel Conflicts**

  *   **Setup (Bongard-Style):**
      *   **Panel A (Rule + Dissimilar):** 6 positive boxes. Rule: *"Contains exactly one closed curve that encloses a square."* Crucially, make the enclosing curves and enclosed squares vary wildly (e.g., tiny circle enclosing huge square, large squiggle enclosing tiny square, complex closed shape enclosing square, etc.). Make the *overall visual appearance* of the positive boxes highly dissimilar from each other. Negative boxes lack this specific relation (e.g., no closed curve, curve doesn't enclose square, square encloses curve, multiple enclosing curves, etc.), but some negatives may *look* more similar to individual positives than the positives look to each other.
      *   **Task:** After learning from Panel A positives/negatives, learners classify novel test items:
          *   **Item R:** Clearly satisfies the rule (one closed curve enclosing a square), but its overall visual features (shape, size, line style) are highly dissimilar to *all* positive training exemplars.
          *   **Item S:** Clearly *violates* the rule (e.g., a square enclosing a circle), but its overall visual features closely match one specific positive exemplar (or the "average" look of positives, though they are dissimilar).
  *   **Camp A Prediction:** Learners will overwhelmingly classify **Item R (Rule-Satisfying)** as positive and **Item S (Similar-Looking)** as negative. The crisp relational rule dominates over featural similarity.
  *   **Camp B Prediction:** Learners will show significant tendency to classify **Item S (Similar-Looking)** as positive and **Item R (Rule-Satisfying/Dissimilar)** as negative. Overall similarity to stored exemplars dominates over an abstract rule.

  **Crux 3: Handling "Unnatural" Similarity (Family Resemblance without Compact Rule)**

  *   **Setup (Character Trait Analogue / Abstract Shapes):**
      *   **Concept:** "Gritty" (in a visual abstract sense, or as a character trait).
      *   **Positive Exemplars (6):** Each shares features with some others, but no single feature or simple rule defines all. E.g., (Shape): Rough textures, fragmented lines, high contrast, dark tones, asymmetry, irregular forms – but *each positive has only 3-4 of these features in unique combinations*. Some positives share texture/fragmentation, others share contrast/darkness, others share asymmetry/irregularity. No positive has all features; no feature is present in all positives. Negatives are smooth, simple, symmetric, low-contrast, etc.
      *   **Task:** After learning positives/negatives, classify novel test items:
          *   **Item FR1:** Shares Texture, Fragmentation, Asymmetry (features present in some, but not all, positives).
          *   **Item FR2:** Shares Dark Tones, Irregularity, High Contrast (features present in some, but not all, positives).
          *   **Item Rule:** Has a feature common to *most* positives (e.g., Rough Texture) but lacks other common "gritty" features and instead has strongly negative features (e.g., perfectly symmetric, smooth).
  *   **Camp A Prediction:** Learning will be slower/less accurate than for crisp rules. Classification of **Item FR1/FR2** will be inconsistent or weak. Learners may struggle to articulate a rule beyond listing features or resort to probabilistic rules. **Item Rule** may be misclassified as positive due to the common feature. Performance relies on finding a complex, potentially disjunctive rule or resorting to similarity-like mechanisms.
  *   **Camp B Prediction:** Learners will acquire the concept effectively. Classification of **Item FR1/FR2** will be reliably positive based on overall similarity to the cluster of exemplars/prototype. **Item Rule** will be reliably classified as negative despite the single common feature, as its overall feature vector is dissimilar to the positive cluster. The similarity field naturally captures the family resemblance.

  ### Flagged Verbal Disagreements

  *   **"Rule":** Camp B argues Camp A's "rules" often dissolve into complex, weighted feature combinations or disjunctions that functionally resemble similarity metrics, making "rule" overly broad. Camp A argues Camp B's "similarity metrics with attention weights" are effectively procedural rules for computation.
  *   **"Representation":** Camp A emphasizes a discrete, often propositional, stored representation. Camp B emphasizes a process (similarity computation) operating over stored traces (exemplars/prototypes). Whether the concept *is* the rule or *is* the process/metric is partly definitional.
  *   **"Simplicity":** Both camps appeal to simplicity/naturalness, but Camp A defines it structurally (e.g., rule length, logical complexity), while Camp B defines it statistically or geometrically (e.g., cluster coherence, sparsity in feature space).
