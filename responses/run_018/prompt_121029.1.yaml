  I should emphasize systemic blindness: democracies might have information but fail to act due to competing interests or ideological biases. In Sen's view, a free press prevents famine, but in their story, maybe the press is complicit or algorithms manipulate data to hide the truth.

  Connecting to their archipelago: the algorithms represent a technocratic system where human decisions are embedded in code. The responsibility is diffused among programmers, corporate executives, policymakers. Fiction can explore characters at different levels realizing their complicity but feeling powerless.

  Also, the moral outrage dilution: when harm is systemic, outrage is fragmented. Protests might target the wrong entities, or be ineffective against complex systems. Characters could struggle with where to direct anger, leading to despair or misguided actions.

