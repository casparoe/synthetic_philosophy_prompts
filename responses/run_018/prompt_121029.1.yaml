  Looking at the historical examples: Bengal had food but wartime policies and mismanagement caused hoarding and price inflation. The Irish famine involved colonial policies that exported food while locals starved. The Great Leap Forward's failures were due to ideological enforcement ignoring local conditions.

  For democratic responsibility, the challenge is diffused blame. In democracies, accountability is murkier because multiple actors and systems contribute. Bureaucracies create distance—no one feels directly responsible. The novelist might explore how characters navigate this: officials passing blame, technocrats hiding behind algorithms, media complicity, or public apathy.

