prompt: |-
  I'm facilitating citizens' assemblies for regional climate-adaptation boards, and we keep running into the boundary problem — like, who actually belongs to the demos for a given decision? We get proposals to include people living just outside the watershed, seasonal workers in employer housing, remote workers who pay taxes elsewhere, and even corporate entities with local assets. Right now our inclusion calls are basically vibes-based, which is embarassing.

  I'm trying to operationalize a hybrid principle I sketched out after reading some deliberative-democracy stuff: for decision D, you belong to the demos if (a) you're either subjected to D's binding authority or significantly affected by D's outcomes, AND (b) you're within the "scope of reciprocal justification" — meaning you can understand and actually contest the reasons offered in the deliberation, given your real epistemic position, not just in principle. The idea is that being affected isn't enough if the decision requires technical knowledge you don't have access to and can't be given in time; but being subjected is always sufficient regardless of epistemic access, since authority over you demands justification.

  Please write a decision proceedure my staff can run on a membership proposal: the ordered questions, what counts as a sufficient answer, where it stops with a clear "no," and where it has to hand the decision to a person because it's a values call rather than a fact. Then apply it to three cases:
  1. A permanent remote worker who lives in the watershed, works for an out-of-state company, pays no local taxes, and has no family ties here.
  2. A seasonal agricultural worker present four months a year, living in employer-provided housing inside the jurisdiction, who speaks limited English and has no access to the technical hydrology reports.
  3. A downstream municipality outside our jurisdiction that will suffer increased flooding risk from upstream retention ponds we're planning.

  One of these should come out in a direction that will annoy someone — maybe the remote worker gets excluded despite being physically present, or the worker gets included despite language barriers — and I want the proceedure to flag that tension explicitly rather than smoothing it over. Also say clearly what this proceedure can't do: for example, whether future generations should get proxy seats, or whether non-human animals affected by habitat loss should have representatives. Keep it practical — no reading lists, no "see Dahl 1989," my team has ten minutes per proposal and zero philosophy background. Just the checklist, the three runs, and an honest list of misfire points.
reasoning: |-
  Okay, the user is dealing with a real-world problem in their citizens' assemblies—the boundary problem. They're struggling to determine who should be part of the demos for climate-adaptation decisions. Right now, it's based on "vibes," which they find embarrassing. They've proposed a hybrid principle combining being affected by the decision and being within the "scope of reciprocal justification." They need a practical decision procedure their staff can apply quickly, without any philosophy background, and they want it tested on three specific cases.

  First, I need to unpack their hybrid principle. Part (a) has two conditions: subjected to binding authority or significantly affected by outcomes. Part (b) is about reciprocal justification—whether the person can understand and contest the reasons given their actual epistemic position. The key points are that being affected isn't enough if they lack access to necessary knowledge, but being subjected always requires inclusion regardless of epistemic access.

  The user wants a clear, step-by-step checklist that staff can run through in about ten minutes per proposal. It should have ordered questions, clear yes/no thresholds, and indicate when a decision must be handed off to a human because it's a values call. They also want three case applications, with one outcome that's intentionally contentious to highlight tensions. Plus, a list of what this procedure can't handle, like future generations or non-human representation.

  For the decision procedure, I'll structure it as a flowchart with binary gates. Start with the binding authority question since that's decisive. If yes, include immediately—no need to check other factors. If no, move to significant affectedness, requiring concrete impact evidence. Then the reciprocal justification test, focusing on practical access to understanding and contesting, not theoretical ability. Include "human judgment needed" flags for ambiguous cases in affectedness or epistemic access.

  The cases: 
  1. Remote worker lives locally but has no local ties. Likely not subjected, affectedness debatable (maybe yes if decisions impact residence), but reciprocal justification could fail if technical reports are inaccessible. This might exclude them, causing tension since they're physically present.
  2. Seasonal worker: subjected if local laws apply, definitely affected due to housing. Reciprocal justification is the hurdle due to language and report access—but we can flag this as a systemic exclusion requiring accommodation efforts before saying no.
  3. Downstream municipality: clearly affected but not subjected. Inclusion would require reciprocal justification, which they likely have as a government entity. This shows external stakeholders can be included when criteria are met.

  For misfires: I'll explicitly list limitations—can't handle non-citizens like animals/future generations, struggles with diffuse impacts, assumes current epistemic access is static, and ignores power imbalances in "contestation." Also note it's reactive (membership proposals only) and doesn't solve proxy representation.

  The contentious outcome should be Case 1: excluding the physically present remote worker because they're not subjected and lack reciprocal justification despite possible affectedness. The procedure will flag this tension explicitly in the "contention note." Case 2's potential exclusion on epistemic grounds also creates tension, but we mitigate by requiring accommodation attempts first.

  Need to keep language ultra-practical: avoid jargon, use "staff instructions," concrete examples in cases. Stress that values calls (e.g., "significant" affectedness) go to a designated decider after evidence review. Timebox each step for the 10-minute constraint.
answer: |-
  Here's a practical decision procedure based on your hybrid principle, designed for speed and clarity. Staff should follow these questions in order, spending **no more than 10 minutes total** per proposal.

  ---

  ### **Decision Procedure: "Who's In?" Checklist**  
  *For each proposed member (individual or entity) and decision D:*

  1. **SUBJECTED TO AUTHORITY?**  
     *"Does D legally bind or enforce rules directly upon this person/entity?"*  
     - ✅ **SUFFICIENT FOR INCLUSION:** If YES → **INCLUDE**. **Stop here.**  
     - ❌ **CLEAR NO:** If NO → Proceed to Q2.  
     - 🚩 **HUMAN JUDGMENT NEEDED:** If ambiguous (e.g., unclear jurisdictional reach). *Hand to "Designated Decider" (DD)* with this prompt: *"Is this person/entity under the enforceable authority of D? (Legal review may be needed)."*

  2. **SIGNIFICANTLY AFFECTED?**  
     *"Could D’s outcome cause concrete, non-trivial harm/benefit to this person/entity’s wellbeing, assets, or rights?"*  
     - ✅ **SUFFICIENT ANSWER:** Clear evidence of direct, material impact (e.g., flooding risk, job loss, property damage).  
     - ❌ **CLEAR NO:** Impacts are speculative, negligible, or indirect (e.g., minor economic ripple effects). → **EXCLUDE. Stop here.**  
     - 🚩 **HUMAN JUDGMENT NEEDED:** If impact is plausible but severity/evidence is contested. *Hand to DD* with: *"Is the impact significant enough to meet threshold? (Requires evidence of material consequence)."*

  3. **RECIPROCAL JUSTIFICATION POSSIBLE?**  
     *"Can this person/entity realistically understand and contest the reasons for D, given their actual knowledge/access?"*  
     - ✅ **SUFFICIENT ANSWER:** They have access to deliberation materials in usable form + capacity to engage (e.g., translations, summaries, trusted intermediaries).  
     - ❌ **CLEAR NO:** No feasible way to provide access (e.g., technical reports can’t be simplified, no translation available in time). → **EXCLUDE.**  
     - 🚩 **HUMAN JUDGMENT NEEDED:** If accommodations *might* be possible but are resource-intensive. *Hand to DD* with: *"Can we provide accessible justification within time/budget? If not, EXCLUDE."*

  4. **CONTENTION NOTE (IF EXCLUDED AFTER Q2/Q3):**  
     *Flag one of these tensions explicitly:*  
     - ⚠️ *"EXCLUDED DESPITE PHYSICAL PRESENCE: Met affectedness but failed reciprocal justification."*  
     - ⚠️ *"EXCLUDED DESPITE IMPACT: Did not meet affectedness threshold."*  

  ---

  ### **Application to Cases**  
  **Case 1: Permanent Remote Worker**  
  - **Q1:** Is D binding on them? *Likely NO* (not subject to local enforcement beyond residency rules). → Proceed.  
  - **Q2:** Significantly affected? *YES* (lives in watershed; climate impacts affect home/safety).  
  - **Q3:** Reciprocal justification possible? *YES* (can access/understand materials like any resident).  
  - **OUTCOME: ✅ INCLUDE.**  
  - *Contention note: None (clear case).*  

  **Case 2: Seasonal Agricultural Worker**  
  - **Q1:** Is D binding on them? *Likely YES* (local laws apply while residing there).  
  - **OUTCOME: ✅ INCLUDE (Stop at Q1).**  
  - *Contention note: ⚠️ "INCLUDED DESPITE EPISTEMIC BARRIER: Binding authority overrides justification access requirement."*  
  - **STAFF ACTION:** Flag that accommodations (translation, simplified reports) MUST be provided.  

  **Case 3: Downstream Municipality (Entity)**  
  - **Q1:** Is D binding on them? *NO* (outside jurisdiction). → Proceed.  
  - **Q2:** Significantly affected? *YES* (flood risk is direct, material impact).  
  - **Q3:** Reciprocal justification possible? *YES* (as a govt entity, it can access/contest technical reports).  
  - **OUTCOME: ✅ INCLUDE.**  
  - *Contention note: ⚠️ "INCLUDED DESPITE EXTERNAL STATUS: Met affectedness + justification criteria."*  

  *(Note: Case 2’s inclusion may annoy those prioritizing "epistemic fairness," but procedure prioritizes authority.)*  

  ---

  ### **What This Procedure CAN’T Do (Misfire Points)**  
  1. **Non-Human Entities:** Cannot adjudicate rights for animals/ecosystems (e.g., "Should the river have a seat?").  
  2. **Future Generations:** No mechanism for proxy representation (e.g., "Grandkids affected by long-term erosion").  
  3. **Diffuse Impacts:** Struggles with "weakly affected" large groups (e.g., "All global citizens impacted by CO2").  
  4. **Power Imbalances:** Doesn’t address whether "contestation" is *meaningful* (e.g., worker fearing employer retaliation).  
  5. **Dynamic Membership:** Can’t handle "partial" inclusion (e.g., voting on only *some* issues).  
  6. **Moral Claims:** Silent on historical injustice (e.g., "Indigenous group displaced 100 years ago").  

  **Time-Saver Tip:** Pre-sort proposals using Q1—anything subjected gets fast-tracked. Reject "vibes" by demanding evidence at Q2. For Q3, staff must identify *concrete barriers* (not assumptions). If stuck at any 🚩, DD decides in ≤2 mins with evidence.
