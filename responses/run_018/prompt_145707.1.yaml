prompt: |-
  I'm running a 40-minute session for a philosophy-curious high-school debate club on superrationality, but not the classic prisoner's-dilemma framing that every intro memos — I want to build it around a noisy stag hunt where you cant tell if the other hunter heard the horn. Don't explain the idea to me; plan the teaching arc. What dependency has to come first and why rational-choice reasoning alone fails here, which carrying example carries the idea (the noisy stag hunt) and what it must include and exclude, the misconceptions they'll form in order — I'm guessing "superrational means being extra smart" and "it needs telepathy" — and exactly where in the sequence to head off each, the check at the end that shows they understand the coordination logic not just repeating "cooperate", and what formal game-theory machinery I should openly refuse to use. Take a definite stance on the order and defend it against at least one plausible alternative. End with one line: Verdict: [one-sentence summary of the plan].
reasoning: |-
  Okay, the user is running a 40-minute session for high-school debate students interested in philosophy. They want to focus on superrationality through a noisy stag hunt scenario, avoiding the typical prisoner's dilemma approach. 

  First, I need to understand their core request: they want a teaching arc that builds dependency step-by-step. The key elements are sequencing concepts properly, using the noisy stag hunt as the central example, anticipating and countering misconceptions, creating an effective comprehension check, and strategically omitting complex game theory tools. 

  Hmm, the user is clearly experienced—they know common pitfalls ("don't explain superrationality to me") and even predict student misconceptions like "superrational means extra smart." Their unspoken need might be deeper: they want students to grasp coordination as emergent logic, not just memorize outcomes. The time constraint (40 mins) means every minute must pull weight.

  For structure, I consider two orders: 
  Option A (Concept-first): Start with superrationality definition, then stag hunt, then noise. But this feels abstract—high schoolers might disengage. 
  Option B (Problem-first): Begin with pure coordination (no noise), add noise to break standard reasoning, then reveal superrationality as solution. This mirrors how humans actually puzzle through dilemmas. 

  I strongly favor Option B. Why? Teens learn best by frustration—letting them *feel* why rational choice fails before introducing tools. The noisy stag hunt must include: 
  - Two hunters who both know the game 
  - Uncertainty if the other heard the horn (noise) 
  - Payoffs where mutual stag >> hare > failed stag pursuit 
  But exclude: anything resembling prisoner's dilemma payoffs or repeated games. 

  Misconceptions will hit at two points: 
  1. When first solving the noisy hunt, someone will say "Just always hunt stag—it's better!" That's when I highlight the risk: if partners doubt each other, hare is safer. 
  2. After introducing superrationality, they'll think it requires mind-reading. Nip this by stressing it's about identical reasoning, not psychic powers—use the phrase "What would we both do if we thought the same?" 

  The comprehension check is crucial. Instead of asking "What should you do?", pose: "If your partner is superrational but you think they might not have heard the horn, would they still hunt stag?" Correct answer reveals they get the interdependence: "Yes, because they know I face the same doubt and would choose the same way." 

  Formal tools to avoid: Nash equilibrium (too technical), signaling games (overcomplicates), evolutionary stability (irrelevant). Keep it visceral. 

  Verdict: Trap students in noisy indecision with stag hunt, weaponize their frustration to reveal superrationality as coordination-through-symmetry, and relentlessly tie logic to payoffs.
answer: |-
  Here’s a focused 40-minute teaching arc prioritizing conceptual intuition over formalism, structured to trap students in the failure of individual rationality and force the superrational insight:

  **Order & Defense (Problem-First Sequencing):**  
  *Start with the coordination failure caused by noise, NOT with superrationality definitions.*  
  *Why this order?* Students must *feel* the limitations of standard reasoning before seeking alternatives. Introducing superrationality prematurely frames it as a "clever trick" rather than an inevitable response to symmetry.  
  *Plausible Alternative Rejected (Concept-First):* Defining superrationality upfront ("assuming identical rational agents reason identically") risks abstraction. Teens need concrete pain points first to grasp *why* this assumption matters.

  **Teaching Arc (40 mins):**

  1.  **Groundwork: Pure Stag Hunt (8 mins)**  
      *   *Dependency:* **Symmetrical interdependence** MUST be established first.  
      *   *Activity:* Quick role-play: "You and partner hunt. Stag needs both, worth 10 each. Solo hare hunting always works, worth 3. No communication. Go."  
      *   *Why:* Highlights two Nash equilibria (Stag/Stag, Hare/Hare). Key takeaway: **Mutual success requires justified mutual trust in coordination.** No individual "best move" without knowing the other's choice.

  2.  **Introduce Noise & Break Rationality (12 mins)**  
      *   *Carrying Example: **Noisy Stag Hunt***  
          *   **MUST INCLUDE:** Horn signals "HUNT STAG NOW!" but each hunter independently only hears it with (e.g.) 70% probability. **Crucially, neither knows if the *other* heard it.** Payoffs unchanged.  
          *   **MUST EXCLUDE:** Any possibility of communication, repeated play, or asymmetric payoffs. Noise must create *epistemic uncertainty about mutual knowledge*.  
      *   *Activity:* "Same game, but now flip a coin (hidden) to see if YOU heard the horn. Did your partner hear it? You don't know. What do you do? Discuss in pairs."  
      *   *Pain Point:* Let them struggle. Standard rationality fails:  
          *   "If I heard it, I want Stag... but did *they* hear it? If not, they'll hunt Hare, and I get nothing!"  
          *   "Hunting Hare is safe... but if we both do that, we miss the big reward!"  
      *   *Key Failure:* **Individual expected utility calculation forces Hare hunting** (Hare = 3 > 0.7*10 + 0.3*0 = 7? Wait, but partner faces same doubt... infinite regress!).

  3.  **Introduce Superrationality as Escape (10 mins)**  
      *   *Frame it as Symmetry Recognition:* "What if we *assume* we are identical rational thinkers facing identical situations and information? We *must* reason the *exact same way*. So... what would *both* of us conclude *simultaneously*?"  
      *   *Activity:* Guided Q&A:  
          Q1: "If we're identical, and I conclude 'Hare is safer,' what does my partner conclude?" (A: Also Hare).  
          Q2: "Result?" (A: Both get 3).  
          Q3: "If I conclude 'We should hunt Stag,' what does my partner conclude?" (A: Also Stag).  
          Q4: "Result?" (A: Both get 10 *if both heard*, 0 if one didn't... but *expected payoff depends on noise probability*).  
      *   *Superrational Solution:* Both commit to Stag *because* they assume mutual commitment via identical reasoning. Expected payoff: (0.7 * 10) + (0.3 * 0) = 7 > 3 (Hare).  
      *   ***Head Off Misconceptions HERE:***  
          *   **"Extra Smart?"** NO. It's not about outsmarting. It's about recognizing shared rationality forces coordination. "It's the *only* consistent choice if you truly believe you are identical reasoners."  
          *   **"Telepathy?"** NO. It's not psychic. It's a *logical constraint*: "If I am identical to you, I literally *cannot* think differently about this identical situation. Our choices are locked together by logic."

  4.  **Comprehension Check & Nuance (7 mins)**  
      *   *Critical Question:* "A superrational hunter heard the horn. They know their partner *might* not have heard it. Do they hunt Stag or Hare? WHY?"  
          *   *Target Answer:* **Stag.** *Not* because "cooperate good," but because:  
              *   Their identical partner faces the same uncertainty.  
              *   *Both* know that *if* they are both superrational, they *must* choose the same action.  
              *   Stag gives higher *expected* payoff (7 > 3) *only if both choose Stag*.  
          *   *Why it works:* Forces them to articulate the coordination logic under uncertainty and symmetry, not just parrot cooperation.  
      *   *Contrast:* Reiterate why standard "rational choice" (maximizing *individual* expected utility ignoring symmetry) fails here (leads to Hare).

  5.  **Formal Machinery to OPENLY Refuse (3 mins - Weave in earlier)**  
      *   **Nash Equilibrium:** "We're skipping matrices. Focus on the *feeling* of being stuck between trust and doubt."  
      *   **Mixed Strategies:** "No probability weights for actions. The noise is external uncertainty, not strategic randomization."  
      *   **Bayesian Updating:** "We won't model belief updating. The core is the symmetry of the *initial* reasoning dilemma."

  **Verdict:** Trap them in noisy indecision with Stag Hunt, weaponize their frustration to reveal superrationality as coordination-through-symmetry, and relentlessly tie logic to payoffs.
