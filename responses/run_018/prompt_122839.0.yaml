  I am a retired experimental physicist — solid state, some forty years of it — who has lately been sitting in on a philosophy of physics reading group at the local university, and I have constructed an argument about Bell's theorem whose conclusion I find unacceptable. I would be grateful for a diagnosis: which step goes wrong, why it looked sound, and what each of the ways out costs.

  First, three things I want kept apart, since I suspect an equivocation is hiding in the neighbourhood:

  (i) *Light-cone locality*: no causal influence is propagated outside the light cones.
  (ii) *Screening locality* — what I take Bell to have meant by local causality: a complete specification λ of the beables in the overlap of the two backward light cones renders Alice's outcome probabilistically independent of Bob's setting, and conversely.
  (iii) *Interventional locality*: no manipulation available at one wing shifts the outcome distribution at the other. This is the no-signalling condition, and the no-signalling theorem secures it in quantum mechanics; relatedly, the violation is standardly located in outcome dependence rather than parameter dependence.

  The usual reading, as I understand it, is that the Bell experiments refute (ii), that (iii) survives untouched, and that what people mean when they say Bell refuted locality is (i) — even though what the formalism directly violates is (ii).

  Now the argument. I assume throughout that we will not help ourselves to a denial of measurement independence unless we are forced to.

  1. In (ii) the screening variables are confined to the *backward* light cones. So local causality is not locality simpliciter; it is the conjunction of locality in the light-cone sense with the thesis that the complete causes of an event lie in its past.
  2. Light-cone locality itself is neutral about temporal direction. An influence running from an event into its past light cone stays inside the light cones exactly as much as one running into its future.
  3. Accordingly there are continuous paths between spacelike-separated events whose every segment is timelike or null: from one event back to a point in the overlap of the two past light cones and forward to the other, or forward to a point in the overlap of the two future light cones and back down to the other. Call these round trips. Each segment is light-cone-respecting; the construction requires only that the events share something in their past or in their future, which in a spacetime like ours they generically do.
  4. So the singlet correlations can in principle be modelled without any influence outside the light cones at all: a setting on one wing propagates along a round trip to the distant outcome, and the correlations are screened off locally at every step. This, broadly, is what the time-symmetric approaches to quantum mechanics do.
  5. Hence Bell's theorem does not force us to accept action at a distance. It forces a choice: either some influences travel outside the light cones, or some influences travel backwards. The canonical slogan — Bell refuted locality — conflates locality with the arrow of causation.
  6. Now the step I distrust. Nothing in the construction of a round trip uses anything specific to Bell correlations. For essentially any two events with a shared region in their past or future light cones — that is, for essentially any two events — the same resources are available. So if a round trip is an admissible explanation of the singlet correlations, it is equally an admissible explanation of any correlation between any two events.
  7. Take then any correlation on which a causal inference is ordinarily based — a correlation between smoking and carcinoma, or between a barometer's reading and a storm, or between the setting of an experimental apparatus and a later record. In each case one may say that no forward causal link is needed: the correlation is produced by an influence going forward into the overlap and back again, or back into the overlap and forward again. The manoeuvre is available for the correlation between an intervention and its apparent effect as well, since the intervention is itself an event with a light cone.
  8. It follows that no correlation is ever evidence of a forward causal connection, and that the manipulationist account of causation — which the reading group treats as common ground — rests on nothing more than a prejudice about the direction of time that the Bell case has revealed to be optional.
  9. That is absurd. Whatever the correct thing to say about Bell correlations is, it cannot be something that renders the practice of experimental science unintelligible.
  10. So at least one of steps 1 to 6 is false.

  Where I would like to end up: I want to keep steps 1 and 2. The observation that Bell's formulation builds in a causal arrow, and the observation that light cones are direction-neutral, both seem to me correct and worth having. I want to keep 9 above all. I am willing to surrender any of 3 to 6, and I would rather surrender one of them than give up 1 or 2 — but I want to be told what the surrender buys and what it costs.

  Specifically, I would like you to consider three diagnoses and tell me which you favour:

  - Is the flaw in the generalisation of step 6, on the grounds that the admissibility of a round-trip explanation can be constrained by something the Bell case satisfies and the smoking case does not — a no-bilking requirement, a ban on fine-tuning, the requirement that an intervention be an independent cause of its effect, or the thermodynamic boundary condition — and, if so, does that constraint simply reinstate, under another name, the very temporal asymmetry that steps 1 and 2 were supposed to have shown to be optional?
  - Or is the flaw in steps 2 and 5, on the grounds that the locality worth wanting just *is* past-screened locality, so that the retrocausalist has preserved a word and lost the phenomenon? If that is your answer, I would like to know what becomes of the claim that Bell's theorem is a theorem about locality rather than about the arrow of time.
  - Or is my colleague right that the round trip is superdeterminism run in reverse, and that the real moral of the argument is that measurement independence, not locality, is bearing all the weight in Bell's theorem — in which case I would like to know why the reversed version is thought to be less conspiratorial than the forward one.

  Two further things, if you can fit them in. First, can time-symmetric models secure no-signalling without the sort of fine-tuning that gets superdeterminism called conspiratorial; and if that is where the argument really turns, say so plainly and say why. Second, where does the restored locality sit with respect to the parameter-dependence/outcome-dependence decomposition — is the retrocausalist restoring outcome independence, parameter independence, or something the decomposition does not carve at the joints?

  Write for a reader who knows the physics but is new to the philosophy: define the terms of art as you go, and do not rest anything on a reference I should have to look up. I would also value a closing sentence or two on whether the argument, once repaired, leaves us having learned anything about Bell correlations that the standard presentation omits.
reasoning: |-
  Okay, let me start by really understanding this physicist's argument. He's a retired experimental physicist with 40 years in solid state, now in a philosophy of physics group. He's built an argument about Bell's theorem that leads to an absurd conclusion about causation in general. The conclusion is that no correlation can be evidence of forward causation, which undermines experimental science. He wants to know where the flaw is and what the costs of fixing it are.

  First, he distinguishes three types of locality: light-cone, screening (Bell's), and interventional (no-signaling). He notes that Bell's theorem refutes screening locality (ii), but not interventional (iii), while people often say it refutes locality meaning (i). 

  His argument steps: 
  1. Bell's screening locality assumes causes are in the past. 
  2. Light-cone locality is time-symmetric. 
  3. Round trips via past or future overlaps allow timelike paths between spacelike events. 
  4. Such paths can model singlet correlations without FTL. 
  5. So Bell forces a choice: FTL or retrocausality. 
  6. This round-trip explanation should work for any correlation, like smoking-cancer. 
  7. Thus, no correlation needs forward causation, undermining manipulationist causation. 
  8. Absurd because it invalidates experimental science. 

  He wants to keep 1 and 2, but fix the flaw in 3-6. He proposes three possible diagnoses: 
  A. Generalization in step 6 is wrong because some constraint (no-bilking, fine-tuning, intervention independence) applies only to Bell cases, but does this reintroduce temporal asymmetry? 
  B. Steps 2 and 5 are flawed because true locality is past-screened, so retrocausality saves the word but not the phenomenon. 
  C. Round trips are reverse superdeterminism, so measurement independence is key, and retrocausal isn't less conspiratorial. 

  Additional questions: Can time-symmetric models avoid fine-tuning like superdeterminism? And where does retrocausality fit in parameter/outcome dependence?

  First, I need to recall Bell's theorem. Bell showed that quantum correlations can't be explained by local hidden variables where causes are local and in the past. The physicist points out that Bell's definition (ii) assumes past causes. If we allow retrocausality, maybe locality (i) can be preserved. But then he generalizes this to all correlations, leading to absurdity.

  The key issue is step 6: can the round-trip explanation work for any correlation? For smoking-cancer, a retrocausal path would mean that the cancer causes smoking via some future common effect or something. But interventions break such correlations. If I force someone to smoke, they still get cancer, showing forward causation. In the Bell case, interventions (settings) don't allow signaling, so the retrocausal explanation might work without being "bilked." 

  Ah, so the constraint is that interventions must be exogenous. In the smoking case, if I intervene to force smoking, that breaks any common cause in the future that the retrocausal path relies on. But in the Bell experiment, the settings are chosen freely, but if there's retrocausality, the hidden variables could correlate with settings, violating measurement independence. But time-symmetric models might handle that without conspiracy if the boundary conditions are set appropriately.

  Looking at diagnosis A: the flaw in step 6. Not all correlations can be explained by round trips because interventions break the retrocausal path when they are truly independent. Bell correlations are special because they involve spacelike separation and the no-signaling theorem holds, meaning interventions at one station don't affect the other, which is consistent with retrocausality. But for smoking, intervening changes the outcome independently, which wouldn't hold if cancer caused smoking retrocausally.

  So the no-bilking requirement: if a cause is truly intervened upon, its effect should change, which wouldn't happen if the effect was causing the cause via a future common factor. In retrocausal models for Bell, the measurement settings can influence the hidden variables in the past, but due to the entanglement, the outcomes are correlated without signaling. This involves some fine-tuning to ensure no-signaling, but perhaps it's natural in quantum mechanics.

  Now, diagnosis B: is past-screened locality the only one that matters? If we accept retrocausality, locality (i) is preserved, but the cost is accepting backward causation, which many find unpalatable. But the physicist wants to keep the observation that Bell's theorem conflates locality with time asymmetry.

  Diagnosis C: round trips as reverse superdeterminism. Superdeterminism violates measurement independence, with hidden variables correlating with future settings. Retrocausal models do similar, but with settings affecting the past. The question is whether retrocausal models are less conspiratorial. Some argue that cosmological boundary conditions (like the Big Bang) might explain the correlations without conspiracy, whereas superdeterminism seems ad hoc.

  On additional questions: Time-symmetric models like TI (Transactional Interpretation) or two-time boundary models can achieve no-signaling. They might require fine-tuning in boundary conditions, but if the universe's initial and final conditions are set appropriately, it's not conspiratorial in the same way as superdeterminism, which requires correlations without a physical mechanism. However, critics might still see it as fine-tuning.

  Where does retrocausality fit in parameter/outcome dependence? Parameter dependence is when the outcome at Alice depends on Bob's setting, which violates locality. Outcome dependence is when outcomes depend on each other given settings. Retrocausal models typically restore parameter independence because the settings influence the hidden variables in the past, but conditional on those, the outcomes are independent. So they might achieve locality by making parameters dependent in a time-symmetric way.

  Putting it together: The flaw is in step 6. The round-trip explanation isn't admissible for all correlations because interventions break the symmetry. In cases where interventions are possible and exogenous, like smoking, the retrocausal path is bilked. In Bell, no signaling means interventions don't affect distant outcomes, so retrocausality works. The constraint is that interventions must be independent causes. This does reintroduce temporal asymmetry, but it's a feature of our universe, possibly due to thermodynamics.

  So, the diagnosis is A, but with the note that the temporal asymmetry comes from the nature of interventions and boundary conditions, not from locality per se. This preserves steps 1 and 2 but shows that Bell correlations are special due to no-signaling and spacelike separation.

  Final thoughts: Repairing the argument teaches us that Bell's theorem highlights time asymmetry in causation, and retrocausal models offer a local explanation at the cost of backward causation, which might be acceptable with proper boundary conditions.
answer: |-
  Your argument is incisive and correctly identifies a tension in how Bell's theorem is often presented. The flaw lies primarily in **step 6**, but the implications are nuanced and involve interplays between physics and philosophy. I'll diagnose step-by-step, address your proposed solutions, and answer your additional questions, aiming for clarity in terms familiar to a physicist.

  ### Diagnosis: Why Step 6 Fails
  Step 6 claims that if a "round-trip" retrocausal explanation works for Bell correlations, it should work for *any* correlation (e.g., smoking-cancer). This is incorrect. Bell correlations are *special* due to **no-signalling (iii)** and **spacelike separation**, which impose constraints not present in ordinary causal inferences. Ordinary correlations (like smoking-cancer) can be "bilked" by interventions in a way that Bell correlations cannot. Here's why:

  - **The bilking argument**: For smoking-cancer, an intervention (e.g., forcibly preventing a smoker from smoking) breaks the correlation in the forward direction. If cancer retrocausally "caused" smoking via a future overlap, this intervention would disrupt the retrocausal path. For example, if you prevent smoking despite the "future cancer," the cancer should not occur—but empirically, it does (if other risk factors are present). This demonstrates that the retrocausal explanation is empirically falsified for smoking-cancer.  
  - **Bell correlations evade bilking**: Due to no-signalling, *no intervention on Alice's setting can change Bob's outcome distribution*. A retrocausal "round trip" (e.g., Alice's setting influences a shared past variable λ, which then influences Bob's outcome) is consistent with this. Interventions on settings don't "break" the correlation in a way that empirically contradicts the model—because the no-signalling theorem ensures that marginal outcome probabilities remain unchanged. Thus, retrocausal models for Bell correlations are *not* empirically bilked, unlike in smoking-cancer.

  **Why it looked sound**: Step 6 overlooks that the admissibility of retrocausal explanations depends on **whether interventions can disrupt the proposed causal chain**. Bell correlations are protected by no-signalling; ordinary correlations are not. This is not an *ad hoc* constraint but a physical difference: spacelike-separated events lack a frame-independent temporal order, allowing retrocausal paths without empirical contradiction. Smoking and cancer are timelike-separated, so interventions can enforce a temporal order.

  **Cost of surrendering step 6**: You give up the universality of retrocausal explanations but retain their validity for Bell-type correlations. This reintroduces temporal asymmetry—but not as a brute assumption. Instead, asymmetry arises from **thermodynamic boundary conditions** (e.g., the low-entropy Big Bang) and the **operational definition of interventions**. Interventions are defined as exogenous causes, which are only possible in one temporal direction in our universe. This doesn't undermine steps 1–2; it clarifies that light-cone locality (i) is symmetric, but causation in practice is asymmetric due to contingent boundary conditions.

  ### Evaluation of Your Proposed Diagnoses
  - **Diagnosis A (flaw in step 6) is correct**. The constraint is **no-bilking + intervention independence**, not fine-tuning. Crucially, this *does* reintroduce temporal asymmetry, but it is justified by empirical practice: interventions are possible only forward in time. This doesn't contradict steps 1–2; it shows that light-cone locality (i) is compatible with temporally asymmetric causation. Bell correlations satisfy the no-bilking requirement (via no-signalling), while smoking-cancer does not.  
  - **Diagnosis B (flaw in steps 2–5) is incorrect**. Bell's formulation *does* build in a causal arrow (via past screening), but light-cone locality (i) remains desirable and worth saving. The retrocausalist preserves locality (i) without losing the phenomenon—they explain nonlocal correlations via backward-in-time influences *within* light cones. Bell's theorem is still about locality: it shows that (i) and (ii) are incompatible with quantum predictions *unless* we drop the past-only assumption.  
  - **Diagnosis C (reverse superdeterminism) is incomplete**. Retrocausal models *do* relax measurement independence (λ independent of settings), like superdeterminism. However, they are **less conspiratorial** if boundary conditions (e.g., initial *and* final states) determine λ. Superdeterminism requires fine-tuning *only* at the initial state, making settings and λ correlated by "cosmic accident." Retrocausal models can use final boundary conditions (e.g., the universe's quantum state at future infinity) to explain λ-setting correlations, which may be natural in time-symmetric theories (e.g., Wheeler-Feynman absorber theory). This isn't "run in reverse"—it uses two boundaries, not one.

  ### Answers to Additional Questions
  1. **Can time-symmetric models avoid fine-tuning?**  
     Yes, if they use **fixed boundary conditions** (initial + final) to enforce no-signalling. For example, in the transactional interpretation, emitter states are constrained by both past and future absorber responses, ensuring no-signalling without fine-tuning of initial conditions alone. The cost: you must accept that the universe has a final boundary condition (e.g., a low-entropy future or a universal wave function). Critics argue this is speculative, but it avoids superdeterminism's "conspiracy" because correlations arise from physical laws governing both boundaries, not ad hoc initial correlations.  
     - **Where the argument turns**: Fine-tuning *is* central. Retrocausal models avoid it by distributing explanatory load across both temporal boundaries; superdeterminism concentrates it at the initial state. No-signalling emerges naturally in retrocausal models because the boundary conditions ensure influences cancel outside light cones.

  2. **Where does retrocausality sit in the parameter/outcome-dependence decomposition?**  
     - **Parameter dependence**: Bob's outcome depends on Alice's *setting* (violates locality).  
     - **Outcome dependence**: Bob's outcome depends on Alice's *outcome* (violates separability).  
     Retrocausal models typically **restore parameter independence** by making settings and outcomes *jointly* determined by hidden variables (e.g., λ encodes responses to possible settings). Conditional on λ, outcomes are independent of distant settings—but λ may correlate with settings via backward-in-time influences. Outcome dependence remains, as outcomes are correlated through λ.  
     - **Locality restored?** Light-cone locality (i) is preserved, as influences stay within light cones. Screening locality (ii) is violated because λ is not confined to the *past* light cone alone—it may depend on future settings. The decomposition doesn't carve this at the joints; it assumes a fixed temporal direction.

  ### What We Learn About Bell Correlations
  Your repaired argument shows that **Bell's theorem forces a choice between light-cone locality and causal chauvinism**—the assumption that causes must precede effects. By embracing retrocausality, we preserve locality (i) and explain no-signalling (iii) without action-at-a-distance, at the cost of temporal symmetry in causation. This reveals that quantum nonlocality is not spatial but temporal: it challenges the arrow of time, not light-cone structure. The standard presentation omits this by conflating locality with past-directed causality. In short, Bell correlations teach us that quantum mechanics is incompatible not with relativistic locality, but with the unidirectional time we experience—a distinction your physics intuition has rightly spotlighted.
