  ### Judgment on Representational Latency Extension  
  The temporal-sequence component is a **legitimate development** of Neurath’s view, as it uses visual syntax (panels/overlays) to encode time without linguistic tense. However, the causal-directionality component is an **unintended distortion**: Arrows function as pictorial "causal verbs," implicitly relying on theoretical narratives Neurath sought to eliminate. In laboratory terms, causality requires controlled-intervention data (e.g., perturbation-response plots), which exceed static pictorial representation. Thus, while the extension is fruitful for time, it stumbles on causality—a limitation of the Bildersprache framework itself.
