answer: |-
  ### Restatement of Neurath's Position in Experimental Physics Vocabulary

  Otto Neurath's core program can be reframed within the conceptual toolkit of experimental physics as follows:

  1. **Rejection of non-pictorial statements** translates to the exclusion of theoretical entities or relationships that cannot be reduced to **measurement protocols**. In experimental practice, any claim (e.g., "quantum entanglement exhibits non-locality") lacking a direct instrumental signature (e.g., correlated particle detections in coincidence counters) is excluded from visualization, much like discarding traces from uncalibrated sensors. Only phenomena with empirically resolvable, repeatable signals are admissible.  

  2. **Structural-mirroring thesis** maps to **dimensional analysis and proportional scaling in graphical representations**. The syntax of a visualization must preserve the invariant relations of the phenomena, such as using logarithmic axes for exponential decay curves or ensuring that vector diagrams maintain angle/scale fidelity to force fields. This mirrors Neurath’s demand that visual syntax directly reflects physical structure—akin to how a stress-strain plot’s gradient corresponds to Young’s modulus without theoretical interpolation.  

  3. **ISOTYPE standardization** aligns with **calibrated units and graphical conventions**. Standardized pictograms become universally recognized symbols (e.g., ⏚ for ground in circuit diagrams, or error bars denoting standard deviation), suppressing verbal ambiguity by enforcing conventions like SI units or color-coded temperature scales. This ensures that a "resistor" symbol carries identical meaning across contexts, eliminating linguistic drift.  

  4. **Representational latency (temporal sequence)** addresses the encoding of time in static images through **sequential instrument traces or layered overlays**. For example, a multi-panel figure showing a material’s phase transition (e.g., resistivity vs. temperature at incremental time steps) uses spatial sequence to imply temporal order without verbs. Similarly, a single graph overlaying hysteresis loops at different frequencies encodes time evolution through parametric layering.  

  5. **Representational latency (causal directionality)** employs **directional arrows in phase-space plots or flow diagrams** to imply causation. In a reaction-kinetics diagram, arrows between molecular structures indicate permitted transitions validated by transition-state measurements, avoiding causal verbs ("reacts to form") by mapping directionality to empirically observed pathways (e.g., Arrhenius plots).  

  However, causal directionality faces limitations: Arrows in a magnetic domain diagram signify observed domain-wall motion but cannot distinguish causation from correlation without auxiliary data (e.g., applied field strength). This risks importing implicit theoretical assumptions—contrary to Neurath’s aims—since arrows alone lack the rigor of controlled-variable experiments.  

  ### Residue Report  
  The translation reveals both alignments and friction. Neurath’s core principles map cleanly to experimental visualization, but representational latency exposes gaps. Below is a structured summary, followed by a detailed JSON residue report.  

  #### Key Findings:  
  - **Clean translations**: Measurement protocols and graphical standards absorb Neurath’s anti-metaphysical stance and ISOTYPE principles seamlessly.  
  - **Distortions**: Structural mirroring requires concessions (e.g., log transforms) that distort direct proportionality. Causal directionality relies on arrows that implicitly invoke theoretical narratives.  
  - **Absences**: Neurath’s rejection of *all* verbal syntax has no counterpart; laboratory visualizations require minimal text (e.g., axis labels) for reproducibility. This absence reflects a limitation of Neurath’s claim, not experimental practice.  
  - **Representational latency**: Temporal sequence translates cleanly via panels/overlays; causal directionality distorts by smuggling in narrative assumptions. The extension is a legitimate development for time but overreaches for causality.  

