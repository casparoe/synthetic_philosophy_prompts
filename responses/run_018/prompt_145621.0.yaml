answer: |-
  That's an excellent and perceptive set of questions, pinpointing key challenges for supervaluationism. Let's break this down, starting by clarifying the premise and then addressing the integration and empirical issues, all in American English:

  **1. Correcting the Premise: Truth-Values in Supervaluationism**

  *   **Crucial Clarification:** Supervaluationism does **NOT** assign "precise intermediate truth-values—akin to Bayesian credences" to borderline propositions. This is a common mischaracterization, often confusing it with degree theories (like fuzzy logic).
  *   **How Supervaluationism Actually Works:**
      *   A vague predicate (like "tall") admits multiple equally good ways to make it precise ("precisifications" or "sharpenings"). Each sharpening draws a *sharp* boundary.
      *   A statement ("X is tall") is:
          *   **Supertrue:** True on *all* admissible sharpenings. (Definitely true)
          *   **Superfalse:** False on *all* admissible sharpenings. (Definitely false)
          *   **Indeterminate:** True on *some* sharpenings and false on *others*. (Borderline)
  *   **The "Intermediate" Thing:** The *indeterminate* category is not a third truth-value like 0.5. It's a truth-value *gap*. The statement genuinely lacks a classical truth value. While you can *define* a measure like "truth on proportion of sharpenings" (sometimes called "supertruth degree"), **this is not a fundamental truth-value within the core supervaluationist semantics**. It's a derived, epistemic measure reflecting our *ignorance* about which sharpening is "correct" (since none is uniquely correct).

  **2. Why Supervaluationism Isn't Widely Integrated into Formal Semantics/Computation:**

  *   **Compositionality Problems:** Formal semantics relies heavily on the principle of compositionality: the meaning of a complex expression is a function of the meanings of its parts and how they are combined. Supervaluationism struggles with this.
      *   How do the multiple sharpenings interact compositionally? What's the supervaluationist meaning of "not tall" or "tall and thin" when applied to borderline cases? Defining consistent rules for complex sentences across *all* sharpenings is notoriously tricky and often leads to counterintuitive results or requires complex modifications.
  *   **Computational Intractability:** For computational models (like those in NLP), explicitly representing and reasoning over the huge (often infinite) space of all admissible sharpenings for every vague predicate in a sentence is utterly impractical. It's computationally explosive.
  *   **The Epistemic Stance is Controversial:** The core claim that vagueness is *solely* ignorance about a precise boundary (the epistemic view) faces strong objections:
      *   **Lack of Precision Motivation:** Why *should* there be a precise boundary we just don't know? What facts determine *which* sharpenings are admissible? The theory often struggles to provide a non-circular answer grounded in actual language use or cognition.
      *   **Higher-Order Vagueness:** The boundary between "definitely tall," "borderline tall," and "definitely not tall" is itself vague. Supervaluationism needs to introduce higher-order sharpenings to handle this, leading to complexity and regress problems. Bayesian credences also struggle with higher-order uncertainty inherently.
  *   **Competing, More Computationally Friendly Models:** Degree-based approaches (fuzzy logic, probabilistic semantics) *do* assign intermediate values (degrees of truth/membership/probability) explicitly. These models:
      *   Are inherently compositional (operations like AND, OR can be defined on degrees).
      *   Are computationally much more tractable (dealing with single numbers or distributions).
      *   Seem to better capture the *gradience* we perceive in borderline cases, even if they have their own philosophical issues (like justifying the specific numerical values).
      *   Fit naturally with machine learning approaches that learn patterns of usage from corpora.

  **3. The Corpus Data Challenge: Where are the Smooth Curves?**

  *   **Your Insight is Spot On:** If supervaluationism's epistemic view were correct (vagueness = ignorance of a precise cutoff), and if the derived "proportion of sharpenings true" measure corresponded directly to speakers' confidence or usage probability, **we *should* expect to see smooth, monotonic probability curves in corpora** as we move through a sorites series. For example, the probability of calling a patch "red" should decline smoothly from 1.0 (definitely red) to 0.0 (definitely not red) as it shifts towards orange.
  *   **What We Actually Observe:**
      *   **Sharpening Effects & Context Dependence:** Corpus data and experiments (like those by Diana Raffman, psychologists, and computational linguists) often show **non-monotonicity** and **step-like patterns**. The acceptability or use of a vague predicate doesn't always change smoothly.
      *   **Comparison Classes:** Judgments depend heavily on the context and what other objects are being compared to. A 6-foot man might be "tall" among jockeys but not among basketball players. This context-sensitivity isn't easily captured by a single fixed set of sharpenings.
      *   **Prototype Effects:** Categories often have best examples (prototypes). "Redness" judgments might cluster around good reds and drop more steeply away from them, rather than changing linearly.
      *   **Sensitivity to Extremes:** People are often very confident about clear cases and less confident, but not in a perfectly smooth probabilistic way, about borderline cases. The transition zone shows variability, but not necessarily a perfect match to a smooth Bayesian curve derived from uniform ignorance.
      *   **Lack of a Single Curve:** The "transition curve" isn't stable; it shifts dramatically based on phrasing, task (naming vs. similarity judgment), and context. This variability is hard to square with the idea of fixed underlying sharpenings generating a stable credence function.
  *   **Interpretation:** The empirical data often suggests that human categorization and linguistic usage involve more than just probabilistic uncertainty about a hidden precise boundary. Factors like context, similarity to prototypes, contrast with alternatives, and pragmatic goals play crucial roles that aren't fully accounted for by the supervaluationist epistemic model. The data often looks messier than a simple smooth ignorance curve.

  **Conclusion:**

  Supervaluationism hasn't become dominant in formal semantics or computational linguistics primarily because:

  1.  **It fundamentally relies on truth-value gaps, not intermediate values,** making compositionality difficult.
  2.  **Its core epistemic claim (vagueness is just ignorance) is philosophically contested** and struggles with higher-order vagueness.
  3.  **It's computationally intractable** to model explicitly.
  4.  **Competing degree-based models are more compositionally robust and computationally feasible,** fitting more naturally with how gradience is often modeled computationally.
  5.  **Crucially, large-scale linguistic data doesn't reliably show the smooth, monotonic probability transitions** predicted by the "ignorance of a precise boundary" view. The observed patterns are often more complex, context-dependent, and non-monotonic, suggesting that the underlying mechanisms of vagueness involve more than just semantic indeterminacy resolvable by hidden precise boundaries. The corpus evidence, rather than confirming the epistemic picture, often challenges it.

  So, while supervaluationism offers an elegant *logical* solution to the Sorites by preserving classical logic (via supertruth), the practical and empirical challenges of integrating it into comprehensive theories of meaning and language processing, combined with the lack of clear empirical support for its core epistemic claim in usage data, have limited its adoption in these fields. Degree-based or context-driven probabilistic models currently offer more promising paths forward for formal and computational approaches.
