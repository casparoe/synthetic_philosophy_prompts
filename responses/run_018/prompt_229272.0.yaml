  Okay, the user is asking about the "what if everyone did that?" argument that came up during a Thanksgiving debate about voting. They want to know the precise principles behind this common rhetorical move, especially since their cousin argued that her single vote doesn't matter statistically. 

  First, I need to unpack the different philosophical foundations this slogan could represent. The user already mentioned Kantian ethics, consequentialist generalization, fairness principles, and causal influence—but I should organize these systematically. 

  Hmm, the user seems philosophically literate (they took a course) but wants clarity on how these principles apply to real-world arguments like voting or littering. Their frustration is palpable—they've noticed this "what if" move gets deployed sloppily in everyday ethics debates. 

  Let me start with Kant since the user specifically questioned whether the common usage matches actual Kantian ethics. Kant's universalization test is indeed much weirder than the pop version. For voting, if we universalized "don't vote when your vote probably won't matter," it might not create a logical contradiction (like universalizing theft would), but it could reveal a contradiction in the will—we couldn't rationally will a world where democracy collapses because everyone thinks their vote doesn't count. But is that what people mean when they say "what if everyone did that?" Probably not. 

  Next, the consequentialist generalization: if everyone skipped voting, democracy fails. That's straightforward, but the cousin's objection is valid—her individual action won't cause that collapse. This version struggles with the "threshold problem" (when does my abstention actually tip the scales?). 

  The fairness angle feels strongest here. Voting resembles a collective action problem like paying taxes—we benefit from others' participation while free-riding. The "what if" highlights that we're making an exception for ourselves. But clever cousin might counter: "I'm not free-riding if I'd happily accept democracy's collapse!" (Though that seems unlikely.) 

  Then there's the slippery slope/causal influence claim: your abstention normalizes apathy. But empirically, does one person skipping voting really influence others? Dubious. 

  Ah, and the user's sharp observation about rephrasing maxims! If cousin defines her maxim as "only skip voting when your chance of mattering is <1 in a billion," universalizing that might pass Kant's test because democracy could still function with super-low turnout. That loophole plagues all these principles. 

  In real life, when Uncle Bob says "what if everyone did that?" at Thanksgiving, he's probably mashing up fairness and consequences without rigor. It's rhetorical—less about logic, more about shaming. The slogan works as social glue but crumbles under scrutiny. 

  For the voting case specifically, the fairness argument holds best: if you benefit from democratic systems, you shouldn't free-ride. But cousin could still retort: "Fine, but my vote literally won't change outcomes, so I'm not actually harming anything!" And... she's not wrong statistically. Maybe Uncle Bob should've argued civic virtue instead of leaning on this overused slogan.
answer: |-
  You've perfectly dissected the core problem with this common rhetorical move! The "What If Everyone Did That?" (WIEDT) slogan is incredibly versatile but philosophically muddy. Let's break down its possible meanings, assess their validity, and see if any actually compel your cousin to vote:

  ### 1. Kantian Universalizability (The "Pure" Logic Test)
  *   **Principle:** An action is morally permissible only if you can consistently will that the *maxim* (subjective principle) behind your action become a universal law without contradiction. The contradiction can be:
      *   **In Conceiving (Logical Contradiction):** Universalizing the maxim leads to an impossible state of affairs (e.g., universal promise-breaking destroys the concept of promising).
      *   **In Willing (Practical Contradiction):** Universalizing the maxim creates a state of affairs your rational self would necessarily reject, even if conceivable (e.g., universal non-charity means no one helps you when you need it).
  *   **"What If" Type:** Logical/Imaginary. It's not about predicting the future, but testing the internal consistency of the maxim itself when universalized.
  *   **Platitude/Substantive/False?** **Substantive but Highly Specific & Problematic.** Kant's actual test is rigorous and often produces counterintuitive results. It's not simply "if things go badly."
  *   **Does it compel voting?**
      *   **Cousin's Maxim:** "I will abstain from voting when my individual vote has an astronomically low chance of affecting the outcome."
      *   **Universalized:** "Everyone abstains from voting when their individual vote has an astronomically low chance of affecting the outcome."
      *   **Analysis:** *Conceivability?* Yes, it's conceivable. A society where only people whose vote has a high chance of mattering vote could exist (though defining the threshold is messy). *Willing?* This is the key. Could you rationally *will* this universal law? A democracy relies on mass participation for legitimacy, informed policy, and stability. Universalizing this maxim would likely lead to extremely low turnout, potentially undermining democratic legitimacy, making outcomes less representative, and increasing susceptibility to manipulation by small, motivated groups. Your rational self, needing a functioning society, likely *could not* consistently will this universal law, as it destroys the very system providing benefits you rely on (stability, rights protection). **Conclusion:** *Potentially* fails the "willing" test, suggesting abstention is impermissible. **BUT** clever cousin re-describes the maxim: "Everyone abstains *only if* their chance of affecting the outcome is below a specific, extremely low threshold (e.g., 1 in a billion) *and* sufficient others still vote to maintain a functioning democracy." This *might* pass Kant's test, as the universalized maxim now incorporates the condition preventing system collapse. This highlights the "maxim description" problem.

  ### 2. Consequentialist Generalization (The "Bad Results" Argument)
  *   **Principle:** If the *general practice* of an action would have bad consequences, then performing the action *contributes* to those bad consequences, even if your individual act makes no perceptible difference. Your action is wrong because it's an instance of a harmful type.
  *   **"What If" Type:** Counterfactual/Imaginary (What *would* happen *if* everyone did it?) OR Predictive (This *will* happen if *enough* people do it).
  *   **Platitude/Substantive/False?** **Substantive but Vulnerable.** While true that universal abstention would be catastrophic, the leap to "therefore *your* abstention is harmful" relies on a controversial premise: that your action *does* contribute to the harmful practice *even when* it has no measurable causal effect (the "threshold problem" - no single raindrop causes the flood).
  *   **Does it compel voting?**
      *   **Argument:** If everyone thought like your cousin and abstained, democracy collapses. Therefore, her abstention contributes to this potential collapse.
      *   **Cousin's Objection:** "But everyone *isn't* doing it. My abstention, *holding everyone else's behavior fixed*, has zero impact. I'm not *causing* collapse." Her action falls below the threshold where it makes a difference. The "bad results" only occur if a *critical mass* abstains, which her single action doesn't achieve. **Conclusion:** **Fails** to show that *her specific abstention, given others' fixed behavior,* is harmful or wrong on consequentialist grounds. The universalization highlights the *type* of action, but not the moral weight of the *token* instance she's performing.

  ### 3. Fairness / Non-Free Riding (The "Playing Your Part" Argument)
  *   **Principle:** When participating in a cooperative scheme that produces benefits everyone enjoys (like a functioning democracy, clean streets, public transit), it is unfair to free-ride by enjoying the benefits while refusing to bear your share of the costs/burdens (voting, disposing of litter properly, paying fares). You are making an unjustified exception for yourself.
  *   **"What If" Type:** Primarily highlights the *structure* of the situation. WIEDT exposes the free-riding nature: *if* everyone free-rode, the scheme collapses. But the wrongness lies in benefiting without contributing *even if* the scheme survives *because* others *do* contribute.
  *   **Platitude/Substantive/False?** **Substantive and Defensible.** This captures a strong, common-sense moral intuition about fairness in collective action problems.
  *   **Does it compel voting?**
      *   **Argument:** Democracy is a public good. You benefit from its stability, rights protections, and (hopefully) decent governance, even if your preferred candidate loses. Voting is a minimal cost/burden of participation. Abstaining while enjoying these benefits is free-riding – making an exception for yourself that you couldn't accept if everyone did it.
      *   **Cousin's Objection:** "I don't *care* if democracy collapses!" (But she likely does benefit and would care). Or, more subtly: "The benefits I receive are fixed regardless of whether I vote or not. My vote doesn't *add* to the benefits, nor does abstention *subtract* them. I'm not *taking* anything extra." However, the fairness argument isn't primarily about marginal contribution, but about *participation in the scheme* generating the benefits. By opting out of the minimal duty while accepting the benefits, she violates reciprocity. **Conclusion:** **Strongest case for obligation.** WIEDT effectively illustrates the unfairness of the free-rider position. Even if her vote doesn't swing the election, she has a fairness-based reason to participate in the cooperative system she relies on. Redescribing the maxim doesn't easily escape this, as the core issue is benefiting without contributing.

  ### 4. Causal Influence / Slippery Slope (The "Setting an Example" Argument)
  *   **Principle:** Your individual action *does* have a causal effect by influencing others. If you abstain (or litter, or free-ride), you normalize that behavior, making it slightly more likely others will do the same. WIEDT highlights the potential cumulative effect of this influence.
  *   **"What If" Type:** Predictive. It suggests your action *will* contribute to a trend that *could* lead to the bad outcome.
  *   **Platitude/Substantive/False?** **Empirically Dubious in Many Cases.** Does one person skipping voting *actually* influence others in a measurable way? Probably not significantly, though social norms *are* shaped by aggregated individual behaviors over time. Highly context-dependent.
  *   **Does it compel voting?**
      *   **Argument:** Your abstention might encourage your friends, family, or others in your demographic to also abstain, lowering turnout and harming democracy.
      *   **Cousin's Objection:** "My one abstention won't noticeably influence anyone. Nobody bases their decision to vote on whether *I* do." This is likely true for most individuals in large-scale contexts like national elections. **Conclusion:** **Weakest argument** for compelling *her* vote. While aggregate behavior shapes norms, the causal link from *her specific abstention* to bad outcomes via influencing others is too tenuous and indirect to ground a strong obligation *for her*. WIEDT here is more a warning about social trends than an indictment of her specific act.

  ### What People *Actually* Mean & Does the Slogan Work?

  *   **What People Mean:** In casual arguments like your Thanksgiving debate, people invoking WIEDT are **most often gesturing towards a mix of Consequentialist Generalization (#2) and Fairness / Non-Free Riding (#3)**, usually without distinguishing them. They see the potential catastrophic consequences of universal defection and feel intuitively that the individual actor is being selfish or irresponsible by exempting themselves. They rarely mean the strict Kantian test (#1) and almost never have the empirical backing for the Causal Influence argument (#4).
  *   **Is it Doing Real Work or Just a Shortcut?** It's **primarily a rhetorical shortcut**, and often a **weak one** when scrutinized. Its power lies in:
      *   **Intuition Pumping:** It effectively triggers intuitions about fairness and collective responsibility.
      *   **Highlighting Collective Harm:** It makes vivid the negative consequences of a *pattern* of behavior.
      *   **Shaming/Guilt:** It implies the actor is hypocritical or selfish.
  *   **Why it Often Fails (Especially Against a Clever Cousin):**
      *   **Ignores Thresholds & Marginal Impact:** It doesn't address the core objection that *this one act* doesn't cross the threshold to cause harm.
      *   **Vulnerable to Maxim Redescription:** As you and your cousin noted, reframing the maxim can often make universalization seem acceptable.
      *   **Overstates Causal Influence:** It conflates the harm of the *general practice* with the moral status of the *individual act*.
      *   **Ignores Costs/Benefits:** It doesn't engage with the *actual* costs and benefits of *this* action for *this* individual in *this* context.

  **Conclusion for Your Argument:** Your uncle's WIEDT appeal, while common, is philosophically sloppy. The **only version that provides a plausible reason for your cousin to vote *even if her vote won't swing the election* is the Fairness / Non-Free Riding argument (#3).** It frames voting as a minimal duty of participation in a cooperative system from which she benefits. Her counterargument would need to either: 1) Deny she benefits from democracy (unlikely and self-defeating), 2) Argue voting is an *unreasonable* burden (hard to sustain), or 3) Reject the principle of fairness entirely (a much bigger philosophical stance). WIEDT, while rhetorically catchy, mostly obscures this stronger, more defensible line of reasoning. The slogan itself isn't doing the real work; it's pointing vaguely towards the fairness principle, which *is* the stronger argument your uncle should have made explicitly.
